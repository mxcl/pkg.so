history:
  adoption-history:
    - >
      Smartsheet expanded from its spreadsheet-style work interface into a broadly
      adopted enterprise work-management platform used by nonprofits, small businesses,
      and large organizations. Its vendor emphasizes adoption across a wide range of
      industries and major enterprises.
  package-nerd-significance:
    - >
      The desktop package gives a primarily SaaS platform a dedicated application
      window, taskbar or Dock presence, tab management, desktop notifications, and
      browser integration. It matters less as a local data-processing package than as a
      managed entry point to a cloud work-management service.
  project-history:
    - >
      Smartsheet was founded in 2005 to create work-management solutions for individuals
      and teams. The platform retained a familiar sheet-and-row model while expanding
      into project and portfolio management, forms, dashboards, reports, automated
      workflows, resource management, content collaboration, and integrations.
    - >
      The desktop application provides a dedicated shell around the service,
      consolidating Smartsheet items into application tabs and using the same
      authentication methods as the web application, including organization-configured
      single sign-on.
  related-projects:
    - 'Smartsheet web application: The SaaS service accessed by the desktop client.'
    - >
      Smartsheet mobile apps: Companion applications for mobile access, notifications,
      sheets, and reports.
    - >
      Smartsheet integrations: Official connections include Microsoft, Google, Slack,
      Jira, and other enterprise services.
  sources:
    - 'Official company history: https://www.smartsheet.com/about'
    - 'Official desktop-app guide: https://help.smartsheet.com/articles/2482689-desktop-app'
    - 'Official help catalog: https://help.smartsheet.com/categories'
    - 'Official platform overview: https://www.smartsheet.com/platform'
  summary:
    - >
      Smartsheet is a cloud work-management platform combining spreadsheet-style sheets
      with project planning, collaboration, automation, reports, dashboards, and
      portfolio-management capabilities; this package installs its desktop client.
  timeline:
    - '2005: Smartsheet was founded.'
    - >
      Subsequent development: The service expanded from sheet-based work tracking into
      collaborative project, workflow, reporting, portfolio, and integration
      capabilities.
    - >
      Desktop-app era: Smartsheet introduced a dedicated client with application tabs,
      native notifications, and web-equivalent authentication.
  usage:
    - >
      Users sign in to the cloud service and work with sheets, reports, dashboards,
      forms, projects, and WorkApps. The desktop client keeps up to 100 Smartsheet items
      in tabs, can display notifications while minimized, and supports the same account
      and SSO authentication models as the browser application.
