history:
  adoption-history:
    - >
      gittuf's adoption story is institutional as well as technical: the README
      identifies it as an incubating Open Source Security Foundation project in the
      Supply Chain Integrity Working Group. Packaging across Homebrew, Debian, Nix, and
      WinGet gives the tool the installation surface expected for security tooling that
      may be evaluated by teams on different operating systems.
    - >
      The project sits near Sigstore, gitsign, in-toto, and SLSA in the software
      supply-chain ecosystem. Its distinguishing role is source-control policy
      verification that can be checked outside any one forge.
  package-nerd-significance:
    - >
      gittuf matters to package nerds because it frames source repository state as an
      input to downstream package trust. It complements artifact signing and provenance
      by asking whether the Git branch, tag, or file path that produced a package was
      changed by an authorized identity under an auditable policy.
  project-history:
    - >
      The gittuf repository was opened in 2022, with the project describing itself as a
      platform-agnostic Git security system. Its README states that repository
      maintainers can use gittuf to protect repository contents from unauthorized or
      malicious changes and to avoid making a Git forge the single point of trust.
    - >
      The first GitHub release, v0.1.0, was published in October 2023. The roadmap shows
      the project evolving through alpha and beta milestones, policy files, a reference
      state log, metadata synchronization, and dogfooding of the gittuf repository
      itself.
    - >
      The design expanded beyond basic reference protection into supply-chain
      attestations. The roadmap records in-toto attestation support as reached by April
      2024 and describes work on Git forge integration, including a GitHub app that
      records code-review and merge attestations and reports verification status on pull
      requests.
  related-projects:
    - The Update Framework.
    - OpenSSF Supply Chain Integrity Working Group.
    - Sigstore, gitsign, in-toto, and SLSA.
    - GitHub and GitLab repository policy systems.
  sources:
    - https://api.github.com/repos/gittuf/gittuf
    - https://api.github.com/repos/gittuf/gittuf/releases
    - https://formulae.brew.sh/formula/gittuf
    - https://github.com/gittuf/gittuf
    - https://gittuf.dev/documentation
    - https://gittuf.dev/quickstart
    - https://raw.githubusercontent.com/gittuf/gittuf/main/README.md
    - https://raw.githubusercontent.com/gittuf/gittuf/main/docs/get-started.md
    - https://raw.githubusercontent.com/gittuf/gittuf/main/docs/roadmap.md
  summary:
    - >
      gittuf is a Git repository security system that brings The Update Framework-style
      policy metadata, signed trust roots, and independent verification to source
      control. Its main claim to package-manager relevance is that it treats Git history
      and Git references as supply-chain assets rather than merely developer convenience
      data.
  timeline:
    - '2022: Public GitHub repository opened.'
    - '2023: v0.1.0 release published.'
    - '2024: Roadmap records in-toto attestation integration as reached.'
    - >
      2025: Roadmap describes GitHub app integration work for pull-request attestations
      and policy verification status checks.
  usage:
    - >
      A typical workflow starts by generating keys, initializing a Git repository,
      running `gittuf trust init`, adding policy keys, creating policy rules for
      protected branches or files, staging and applying policy metadata, and recording
      reference changes in the reference state log.
    - >
      Practitioners use `gittuf verify-ref` to check whether a reference follows policy,
      `gittuf sync` or the `git-remote-gittuf` transport to move gittuf metadata with
      remote repositories, and manual Git ref pushes or fetches for environments that
      prefer explicit metadata handling.
related-packages:
  - id: brew:gitsign
    reason: >
      gitsign supplies Sigstore-backed commit and tag signatures that gittuf can use as
      authenticated identities when enforcing repository policy; gittuf's official key
      guide provides the exact Git configuration.
    rel: adjacent_workflow
    sources:
      - https://gittuf.dev/documentation/contributors/signing-keys
      - https://github.com/sigstore/gitsign
