history:
  adoption-history:
    - >
      LocalCan is aimed at developers who need memorable local HTTPS domains or
      temporary and stable public URLs without manually maintaining proxy and tunnel
      infrastructure.
    - >
      Version 3.0 broadened the product beyond its original desktop workflow by bundling
      a command-line interface, adding YAML project configuration and Linux support,
      while retaining desktop applications on macOS and Windows.
  package-nerd-significance:
    - >
      LocalCan combines several traditionally separate development utilities—local
      DNS-style names, TLS termination, reverse proxying, traffic inspection, and public
      tunnels—behind one desktop app and CLI.
    - >
      Its plain YAML configuration and JSON-capable CLI make the newer generation more
      attractive for reproducible development environments, scripts, CI, and AI-agent
      tooling.
  project-history:
    - >
      LocalCan developed as a local-development networking application for assigning
      .local domains and exposing services through public URLs.
    - >
      The 3.0 generation introduced a daemon-and-client architecture, persistent YAML
      projects, a bundled CLI on desktop systems, and a standalone CLI for Linux.
  related-projects:
    - >
      Comparable tool categories include local reverse proxies, HTTPS certificate tools,
      mDNS-based development domains, and tunneling services.
  sources:
    - 'Official CLI overview: https://www.localcan.com/docs/cli/overview'
    - 'Official documentation: https://www.localcan.com/docs'
    - 'Official installation guide: https://www.localcan.com/docs/installation'
  summary:
    - >
      LocalCan is a development networking tool that maps local services to friendly
      .local domains and can publish them through HTTPS public URLs. It is distributed
      as a desktop application on macOS and Windows and, in the 3.0 generation, as a
      CLI-only daemon on Linux.
  timeline:
    - '2.x: LocalCan operated with its earlier desktop-oriented data model and infrastructure.'
    - >
      3.0: A bundled CLI, YAML project files, a daemon architecture, and Linux support
      were introduced.
  usage:
    - >
      Developers point LocalCan at localhost services, then use local HTTPS domains for
      everyday development or public tunnel URLs for previews, webhooks, and client
      review.
    - >
      Saved services are described in YAML project files and loaded with `localcan
      reload`; one-off HTTP, HTTPS, and TCP tunnels can be opened from the CLI.
