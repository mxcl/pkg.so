history:
  adoption-history:
    - >
      SoundSource began as a free menu-bar utility, later became a free add-on for
      owners of other Rogue Amoeba products, and became a standalone commercial
      audio-control product with version 4 in 2019. Its continuing major releases and
      legacy-download program reflect a long-lived Mac utility rather than a short-lived
      menu-bar experiment.
  package-nerd-significance:
    - >
      SoundSource is notable to Mac package users because it spans several eras of macOS
      audio plumbing: Menu Extras, per-application audio capture, Apple Silicon, ACE,
      and the newer ARK routing technology. It is also a representative proprietary Mac
      utility distributed through Homebrew Cask while retaining its own licensing and
      update lifecycle.
  project-history:
    - >
      Rogue Amoeba first released SoundSource in 2003 as a small free utility for
      switching audio devices. Version 2.5 made it a standalone application in 2009.
      Development ended temporarily in 2012 after macOS absorbed much of its original
      functionality, but Rogue Amoeba revived it in 2017 by combining it with LineIn.
    - >
      SoundSource 4, released in 2019, transformed the utility into a full
      per-application audio controller with volume, device-routing, and effects
      controls. Version 5 expanded automatic application discovery and Apple Silicon
      support. Version 6 arrived in 2025 with saved Quick Configs, output groups,
      AirPlay streaming, and a dedicated audio-device interface.
  related-projects:
    - Rogue Amoeba's Audio Hijack and Loopback share the company's Mac audio-routing lineage.
    - LineIn was merged into the revived SoundSource 3.
    - ACE powered older releases; ARK replaced it on newer macOS releases.
  sources:
    - https://rogueamoeba.com/company/lists/archives/press/2025-12-soundsource-600.html
    - >
      https://rogueamoeba.com/support/knowledgebase/?showArticle=SoundSource-Screenshot-Gallery
    - >
      https://www.rogueamoeba.com/support/knowledgebase/?product=SoundSource&showArticle=ACE-Legacy
  summary:
    - >
      SoundSource is Rogue Amoeba's macOS audio-control utility for managing system
      devices and per-application volume, routing, and effects from the menu bar. It
      evolved from a small freeware device switcher into a commercial audio-routing
      application.
  timeline:
    - '2003: SoundSource 1.0 was released as a free audio-device switcher.'
    - '2009: Version 2.5 became a standalone application.'
    - '2012: Development of the original utility ended.'
    - '2017: SoundSource 3 revived the project and incorporated LineIn.'
    - '2019: SoundSource 4 introduced per-application audio control.'
    - >
      2020: SoundSource 5 overhauled application audio adjustment and added Apple
      Silicon support shortly afterward.
    - '2024: ARK began replacing the older ACE audio-capture technology.'
    - '2025: SoundSource 6 added Quick Configs, output groups, and integrated AirPlay.'
  usage:
    - >
      Users run SoundSource from the macOS menu bar to change input and output devices,
      control individual applications, apply Audio Unit effects, create device groups,
      and save reusable audio configurations. Some capabilities depend on Rogue Amoeba's
      background audio-routing component.
