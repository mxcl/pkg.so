credentials-file-location:
  unix:
    - ~/.cf/config.json
    - $CF_HOME/config.json
history:
  adoption-history:
    - >
      Because Cloud Foundry installations span multiple vendors and private foundations,
      cf became a cross-distribution operational standard. Package metadata in this
      batch lists apk, Homebrew, Chocolatey, Nix, and Scoop, showing the tool's reach
      across Linux containers, macOS laptops, and Windows developer workstations.
    - >
      The CLI's adoption follows Cloud Foundry's enterprise PaaS usage: developers use
      it to push and bind applications, while platform teams use it for scripted
      administration, service management, and troubleshooting.
  package-nerd-significance:
    - >
      cloudfoundry-cli is one of the older cloud-native CLIs still packaged broadly by
      operating-system package managers. Unlike many cloud CLIs tied to one hyperscaler
      account model, cf is a shared client for any compatible Cloud Foundry foundation.
    - >
      The executable name cf is short and historically important, so distro package
      names usually spell out cloudfoundry-cli while installing the canonical cf
      command.
  project-history:
    - >
      The official cloudfoundry/cli repository was created in 2013, shortly after Cloud
      Foundry had established itself as an open platform-as-a-service project. The CLI
      became the common client used across Cloud Foundry distributions rather than a
      vendor-specific command.
    - >
      The CLI evolved alongside Cloud Foundry's API and application runtime. Versioned
      documentation now distinguishes modern v8 command references while still
      documenting installation, authentication, plugins, and getting-started flows for
      users of supported foundations.
  related-projects:
    - Cloud Foundry Application Runtime is the platform surface managed by the cf CLI.
    - >
      Cloud Controller API is the API family the CLI targets for application and
      foundation operations.
    - >
      BOSH, buildpacks, service brokers, and cf CLI plugins are adjacent parts of the
      Cloud Foundry operator/developer ecosystem.
  sources:
    - https://docs.cloudfoundry.org/cf-cli/
    - https://docs.cloudfoundry.org/cf-cli/getting-started.html
    - https://cli.cloudfoundry.org/en-US/v8
    - https://github.com/cloudfoundry/cli
  summary:
    - >
      Cloud Foundry CLI, installed as cf, is the official command-line client for Cloud
      Foundry. It is the everyday operator and developer interface for targeting Cloud
      Foundry foundations, logging in, pushing applications, managing services, and
      inspecting app state.
  timeline:
    - '2013: Official cloudfoundry/cli GitHub repository was created.'
    - '2013: Preview release v0.0.1.alpha was published.'
    - '2017: v6 releases were actively published, including v6.33.0.'
    - '2020s: v7 and v8 documentation reflected newer Cloud Foundry API and CLI behavior.'
    - '2026: v8 releases continued, including v8.18.x.'
  usage:
    - >
      Typical cf workflows start with cf api, cf login, and cf target, followed by cf
      push for application deployment and commands for apps, routes, services, orgs,
      spaces, and logs.
    - >
      The CLI stores target and authentication state in config.json under ~/.cf by
      default, with CF_HOME allowing that state directory to be moved for automation or
      isolated environments.
related-packages:
  - id: brew:bosh-cli
    reason: >
      Use BOSH CLI to deploy and operate the Cloud Foundry foundation, then use the cf
