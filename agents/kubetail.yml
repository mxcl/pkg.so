id: brew:kubetail
display-name: Kubetail
repo: null
docs:
  - https://docs.kubetail.com/
  - https://www.kubetail.com/docs
config-file-location:
  unix:
    - ~/.kubetail/config.yaml
credentials-file-location:
  unix:
    - ~/.kube/config
  windows:
    - $HOME\.kube\config
history:
  adoption-history:
    - >
      Kubetail adoption is visible through a public GitHub repository, a dedicated docs
      site, a public website, Homebrew packaging, and release artifacts for multiple
      operating systems. The project also publishes cluster and dashboard-oriented
      pieces, which moved it beyond the older convention of a shell-only kubectl logs
      wrapper.
  package-nerd-significance:
    - >
      The package name is historically easy to confuse with older kubetail scripts, so
      the Homebrew formula and repository identity matter. This batch's package is the
      kubetail-org dashboard/CLI, not the older johanhaleby Bash script with the same
      human-friendly name.
  project-history:
    - >
      The kubetail-org project describes Kubetail as a general-purpose logging dashboard
      optimized for real-time tailing across multi-container Kubernetes workloads. Its
      README and docs position the kubetail CLI as the entry point for launching a local
      web dashboard, streaming logs in a terminal, or managing cluster resources used by
      the tool.
  related-projects:
    - >
      Related tools include kubectl logs, stern, kail, k9s, Kubernetes Dashboard, and
      older kubetail shell scripts. Kubetail differs by combining a CLI, browser
      dashboard, and multi-container timeline-oriented log viewing.
  sources:
    - https://docs.kubetail.com/
    - https://docs.kubetail.com/reference/cli
    - https://formulae.brew.sh/formula/kubetail
    - https://github.com/kubetail-org/kubetail
    - https://github.com/kubetail-org/kubetail/releases
    - https://www.kubetail.com/
  summary:
    - >
      Kubetail is a Kubernetes logging CLI and dashboard for viewing logs from
      multi-container workloads in a single chronological stream. In package-manager
      terms it represents the shift from small log-follow scripts to installable
      desktop/browser-backed Kubernetes developer tools.
  timeline:
    - >
      2024: Public discussion and early issues described Kubetail as a web-based
      real-time log viewer for Kubernetes clusters.
    - >
      2025: Kubetail release notes show continued CLI/dashboard work, including search,
      API backend, security, and packaging changes.
    - >
      2026: The GitHub releases page listed cli/v0.18.0 with signed release artifacts
      for Linux, macOS, and Windows.
  usage:
    - >
      The common use is to run kubetail locally, select workloads, and inspect merged
      logs from multiple pods and containers. The docs emphasize that Kubetail reads
      through the Kubernetes API, so teams can tail logs without first shipping them to
      an external logging backend.
related-packages:
  - id: brew:stern
    reason: >
      Choose Stern for a compact terminal-focused multi-pod log tailer with
      regular-expression selection and output templates; choose Kubetail when you also
      want a browser dashboard and chronological multi-container views.
    rel: alternative
    sources:
      - https://github.com/stern/stern#readme
      - https://github.com/kubetail-org/kubetail#readme
