history:
  adoption-history:
    - >
      Jumpshare began as a browser-based file-sharing service with previews for more
      than 150 formats. It added user accounts in February 2013 and a Mac application in
      July 2013, bringing drag-and-drop sharing into the desktop workflow.
    - >
      The product subsequently broadened from file transfer and previewing into visual
      communication. Version 3 emphasized workspaces, team libraries, native desktop
      clients, and redesigned screen recording; later releases added higher-resolution
      recording, streaming uploads, engagement features, and AI-generated video
      material.
  package-nerd-significance:
    - >
      Jumpshare illustrates how a file-hosting service can evolve into a native desktop
      capture and asynchronous-communication tool. For Homebrew users, its cask provides
      a package-managed route to the macOS menu-bar client.
  project-history:
    - >
      Founder Ghaus Iftikhar began developing Jumpshare after leaving the technology
      publication AddictiveTips in 2011. Following more than a year of development,
      Jumpshare launched publicly on September 5, 2012 as a file-sharing service
      centered on immediate browser previews.
    - >
      Jumpshare Plus launched in November 2013 after the service had introduced
      accounts, mobile-friendly pages, and a Mac client. Over time the desktop
      application accumulated screenshot annotation, GIF capture, screen and webcam
      recording, collaboration, workspaces, analytics, and AI-assisted video features.
  related-projects:
    - >
      The product occupies a workflow category shared with cloud file-transfer services,
      screenshot utilities, and asynchronous video-communication tools.
  sources:
    - >
      https://jumpshare.com/blog/introducing-jumpshare-plus/ — official early product
      chronology.
    - >
      https://jumpshare.com/blog/introducing-jumpshare-v3-say-hello-to-the-worlds-fastest-visual-communication-app/
      — official Version 3 history.
    - >
      https://jumpshare.com/blog/welcome-to-jumpshare/ — official launch account and
      founder background.
    - >
      https://support.jumpshare.com/article/123-what-is-jumpshare — current official
      product description.
    - source_facts.package-manager — supplied Homebrew cask identity.
  summary:
    - >
      Jumpshare is a native macOS and Windows visual-communication application combining
      screen and webcam recording, screenshot and GIF capture, cloud hosting, file
      sharing, and collaboration.
  timeline:
    - '2011: Development began after founder Ghaus Iftikhar left AddictiveTips.'
    - '2012-09-05: Jumpshare launched publicly as a browser-based file-sharing service.'
    - '2013-02: Free user accounts were introduced.'
    - '2013-07: The first Mac application was introduced.'
    - '2013-11-18: Jumpshare Plus launched.'
    - >
      2021-12-29: Jumpshare 3 introduced workspaces, shared libraries, and a redesigned
      recorder.
    - >
      2026-06-12: Desktop clients added streaming recording uploads and screenshot
      watermarking.
  usage:
    - >
      Users record a screen, window, webcam, microphone, or system audio; capture and
      annotate screenshots or GIFs; and receive a cloud link for sharing the result.
    - >
      The menu-bar client also accepts dragged files, while hosted content can support
      collaboration, viewer analytics, calls to action, branding, transcription,
      summaries, and other AI-generated material.
