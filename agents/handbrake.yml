history:
  adoption-history:
    - >
      HandBrake's adoption came from being useful to both casual users and
      automation-heavy users. The GUI made transcoding accessible, while `HandBrakeCLI`
      let packagers, shell users, and batch workflows perform the same kind of
      conversion without a desktop session.
    - >
      Package-manager adoption is broad: the input facts list packages across Homebrew,
      Alpine, Debian/Ubuntu, MacPorts, Nix, Arch, Chocolatey, Scoop, and winget. That
      cross-platform packaging mirrors the project's own platform support and makes
      HandBrake a common baseline tool on developer laptops, home media systems, and
      CI-like encoding boxes.
  package-nerd-significance:
    - >
      HandBrake is significant because it packages a complicated stack of video codecs,
      containers, filters, hardware-encoder options, and UI/CLI behavior behind one name
      users recognize. For package maintainers, it is both a popular application and a
      compatibility promise: users expect the formula or package to produce working GUI
      or CLI transcodes without manually assembling FFmpeg/x264/x265/SVT-AV1 workflows.
    - >
      It also illustrates why package metadata matters. There is a GUI app, a CLI
      executable, platform-specific build systems, GPL licensing, large dependency
      trees, and frequent codec capability shifts. Package nerds care because a small
      build-option difference can change which media workflows users can actually
      perform.
  project-history:
    - >
      The official HandBrake history says the project was started in 2003 by the
      developer known as titer. titer remained the primary developer through April 2006,
      when the last official Subversion revision of that early era was committed.
    - >
      Development resumed informally in August and September 2006 after a period without
      official code changes. Forum contributors worked on optimized builds and on
      reverse-engineering support for Apple's 640x480 H.264 iPod firmware 1.2 format.
      Because the old Subversion repository could not be updated without titer's
      authorization, Rodney Hester created a mirror of the 0.7.1 and final Subversion
      trees so the revived contributors could build on them.
    - >
      On January 26, 2007, the fork was officially known as MediaFork. On February 13,
      2007, titer gave support to the revived work, and by March 2, 2007 the developer
      and user services had returned under the HandBrake banner. The official history
      presents that reintegration as the point where the next release resumed the
      HandBrake name.
    - >
      Over time, HandBrake broadened from its early DVD/iPod-era identity into a general
      post-production transcoder. The official README and docs describe support for
      common video files, camera and mobile-device footage, screen recordings, DVD and
      Blu-ray sources, and output to MP4, MKV, or WebM using components such as FFmpeg,
      x264, x265, and SVT-AV1.
  related-projects:
    - >
      HandBrake relies on media projects including FFmpeg/libavcodec/libavformat, x264,
      x265, and SVT-AV1. Its history also includes the temporary MediaFork name used
      during the 2006-2007 revival.
    - >
      The docs mention tools such as AnyDVD HD and MakeMKV only as separate applications
      that can create readable copies of damaged or protected discs; HandBrake itself
      documents that it does not defeat copy protection.
  sources:
    - https://formulae.brew.sh/formula/handbrake
    - https://github.com/HandBrake/HandBrake
    - https://handbrake.fr/
    - https://handbrake.fr/docs/en/latest
    - https://handbrake.fr/docs/en/latest/about/history.html
    - https://handbrake.fr/docs/en/latest/cli/command-line-reference.html
    - https://handbrake.fr/docs/en/latest/introduction/about.html
    - https://handbrake.fr/docs/en/latest/technical/official-presets.html
  summary:
    - >
      HandBrake is a volunteer-built, GPL-licensed video transcoder for Linux, Mac, and
      Windows. It became package-manager-famous because it turned the hard parts of
      everyday video conversion into a reproducible GUI and CLI workflow with presets,
      queues, and widely packaged codec tooling.
  timeline:
    - '2003: HandBrake started by titer.'
    - '2006-04: Last official Subversion revision of the early titer-led era.'
    - '2006-08: Informal development resumed around optimized and experimental builds.'
    - >
      2006-09: Contributors collaborated on support for Apple's 640x480 H.264 iPod
      firmware 1.2 format.
    - '2007-01-26: The revived fork was officially known as MediaFork.'
    - '2007-02-13: titer expressed support for the revived work.'
    - '2007-03-02: Developer and user services returned under the HandBrake banner.'
  usage:
    - >
      The documented primary use is converting existing video sources into MP4, MKV, or
      WebM files that work on phones, tablets, TV media players, game consoles,
      computers, and browsers. The docs emphasize that HandBrake is a post-production
      transcoder, not a non-linear editor, disc authoring tool, or DRM circumvention
      tool.
    - >
      HandBrake's official presets are a major part of its user model. Presets encode
      practical compatibility knowledge for general use, web sharing, creators,
      social-size targets, and device classes; this is why the package is useful even
      when users do not want to become codec specialists.
    - >
      The command-line reference makes HandBrakeCLI important for package-manager users.
      It supports scripted source selection, preset use, output format choices,
      queue-like automation, and reproducible encode settings that fit shell pipelines
      and server-side jobs.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Choose FFmpeg for lower-level, highly scriptable conversion, filtering, probing,
      and streaming workflows; choose HandBrake when curated presets and its focused
      GUI/CLI transcoding workflow are preferable.
    rel: alternative
    sources:
      - https://handbrake.fr/docs/en/latest/introduction/about.html
      - https://ffmpeg.org/about.html
      - https://ffmpeg.org/ffmpeg.html
  - id: brew:mkvtoolnix
    reason: >
      Use MKVToolNix after HandBrake when an MKV output needs track extraction,
      inspection, remuxing, attachment management, or property edits without another
      full transcode.
    rel: adjacent_workflow
    sources:
      - https://handbrake.fr/docs/en/latest/introduction/about.html
      - https://mkvtoolnix.download/
      - https://mkvtoolnix.download/doc/
