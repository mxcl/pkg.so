history:
  adoption-history:
    - >
      Cython became common infrastructure in the scientific Python and
      performance-sensitive Python ecosystem because it lets projects ship fast
      extension modules while retaining a Python-like development model. The official
      README states that Cython has more than 70 million PyPI downloads per month, which
      reflects broad use as a build-time dependency as well as a developer tool.
  package-nerd-significance:
    - >
      Cython matters to package nerds because it sits at the boundary between source
      packages and compiled artifacts. A missing or mismatched Cython can decide whether
      a Python package builds from sdist, ships generated C, or requires wheels; it is
      one of the quiet tools behind many fast Python libraries.
  project-history:
    - >
      The official Cython README says Cython was originally based on Greg Ewing's Pyrex
      and started as an early-2000s project. Cython kept the Python-extension-module
      idea but grew into a long-lived compiler with its own language features, type
      declarations, C/C++ interop, and CPython-version adaptation.
    - >
      The official site describes Cython as a superset of Python that supports C/C++
      functions and types, allowing generated C code to be compiled with major C/C++
      compilers. The project repository was created on GitHub in 2010 and remains the
      active source for compiler, docs, and tooling.
  related-projects:
    - Pyrex is the predecessor named by the official README.
    - CPython is the primary runtime and C API target.
    - >
      NumPy, PyPy, Pythran, mypyc, Nuitka, and Numba are related ecosystems or
      comparison points listed in official Cython materials.
  sources:
    - https://cython.org/
    - https://docs.cython.org/
    - https://docs.cython.org/en/latest/src/quickstart/overview.html
    - https://github.com/cython/cython
    - https://github.com/cython/cython#readme
    - https://api.github.com/repos/cython/cython
    - https://api.github.com/repos/cython/cython/releases?per_page=5
  summary:
    - >
      Cython is an optimizing static compiler for Python and the extended Cython
      language. It translates Python-like code to C or C++ so developers can write
      CPython extension modules, wrap native libraries, and tune performance without
      abandoning Python syntax.
  timeline:
    - 'Early 2000s: Cython starts as a project based on Pyrex.'
    - '2010: cython/cython repository created on GitHub.'
    - "2011: Official site links the IEEE article 'Cython: The best of both worlds'."
    - '2025: Official site lists Cython 3.1.4 as a stable release.'
    - '2026: GitHub releases show ongoing 3.2.x and 3.3.0 alpha development.'
  usage:
    - >
      Users install Cython, write .pyx modules or use pure-Python annotation mode, and
      run cython or cythonize to generate C/C++ code for extension builds. Common uses
      include wrapping external C libraries, optimizing numerical loops, interacting
      with NumPy arrays, embedding CPython, and maintaining generated C sources for
      reproducible builds.
related-packages:
  - id: brew:pythran
    reason: >
      Choose Pythran for ahead-of-time compilation of numerical Python kernels with a
      narrower NumPy-oriented model; choose Cython for its broader extension-language
      features and direct C or C++ interfaces.
    rel: alternative
    sources:
      - https://docs.cython.org/en/latest/src/tutorial/related_work.html
      - https://pythran.readthedocs.io/
  - id: brew:numpy
    reason: >
      Cython provides dedicated NumPy declarations, typed array access, and memoryview
      workflows for building accelerated numerical extensions around NumPy data.
    rel: adjacent_workflow
    sources:
      - https://docs.cython.org/en/latest/src/tutorial/numpy.html
      - https://numpy.org/doc/stable/
  - id: brew:python@3.14
    reason: >
      Cython's generated native extensions are compiled for and loaded by Python, making
      the Python runtime and extension API central to its build and execution workflow.
    rel: adjacent_workflow
    sources:
      - https://docs.cython.org/en/latest/src/quickstart/build.html
      - https://docs.python.org/3/extending/
