history:
  adoption-history:
    - >
      Backblaze's recovery workflow expanded from server-prepared downloads and physical
      restore media to a native application that can browse a backup and download
      selected content directly. The Restore App became part of the Computer Backup
      client in version 9.0.
    - >
      Version 10 introduced a new standalone macOS Restore App with revised
      authentication, improved handling of large restores, and independence from the
      main backup client.
  package-nerd-significance:
    - >
      The Restore App is notable because it separates disaster recovery from the
      continuous backup process and packages a service-specific recovery workflow as a
      native desktop application.
    - >
      Its temporary assembly directory can require space beyond the final restore size,
      an operational detail that matters when restoring large datasets or working with
      constrained system disks.
  project-history:
    - >
      Backblaze was founded in 2007 to make online backup straightforward for ordinary
      computer users. Its original Computer Backup client continuously copied user data
      to Backblaze's storage service, with recovery offered as a core part of that
      service.
    - >
      The company's native restore tooling evolved into the Backblaze Restore
      application, first integrated with the backup client and later delivered on macOS
      as a standalone application.
  related-projects:
    - >
      Backblaze Computer Backup is the subscription service and primary backup client
      whose stored data the Restore App retrieves.
    - >
      Backblaze B2 Cloud Storage is the company's separate object-storage platform and
      is not the source of Computer Backup Restore App sessions.
  sources:
    - https://www.backblaze.com/company/about
    - https://www.backblaze.com/computer-backup/docs/create-a-restore-client
    - https://www.backblaze.com/computer-backup/docs/get-started
    - https://www.backblaze.com/computer-backup/docs/restore-app-release-notes-mac
    - https://www.backblaze.com/computer-backup/docs/set-a-temporary-data-drive-restore-app
  summary:
    - >
      Backblaze Restore is the native recovery application for selecting and downloading
      files protected by the Backblaze Computer Backup service.
  timeline:
    - '2007: Backblaze was founded and development of its Computer Backup client began.'
    - 'Version 9.0: Computer Backup added a built-in Restore App.'
    - 'Version 9.2.2: Restore chunk handling and temporary-storage behavior were improved.'
    - 'Version 10.0: Backblaze introduced a new standalone Restore App for macOS.'
  usage:
    - >
      A subscriber signs in, chooses a protected computer and restore point, selects
      files or folders, and chooses a destination. The application downloads chunks to
      temporary storage, assembles the files, and moves them to the requested
      destination.
    - >
      Account credentials and any required multifactor-authentication response are
      entered interactively; Backblaze does not document a reusable credentials file for
      the Restore App.
