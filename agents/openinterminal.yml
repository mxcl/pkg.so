history:
  adoption-history:
    - >
      OpenInTerminal gained broad terminal and editor compatibility while retaining a
      narrow Finder-oriented purpose. The project supplies a full application with
      graphical preferences and lighter OpenInTerminal-Lite and OpenInEditor-Lite
      variants.
    - >
      Homebrew cask installation became an official documented path. Current unsigned
      releases require users to approve or locally trust the application and enable the
      Finder extension under recent macOS versions.
  package-nerd-significance:
    - >
      OpenInTerminal turns the common developer action of changing from Finder to a
      shell or editor into a toolbar, context-menu, or keyboard-shortcut operation. Its
      value is the maintained compatibility layer across many terminals and editors.
    - >
      The project is also a representative macOS Finder Sync extension: installation,
      code-signing status, quarantine attributes, extension registration,
      group-container preferences, and Apple Events permissions all affect whether a
      seemingly small utility works.
  project-history:
    - >
      The earliest release supported opening Finder locations in a terminal, initially
      emphasizing iTerm and then adding Hyper and Alacritty. A lightweight branch was
      named OpenInTerminal-Lite while a more capable OpenInTerminal application was
      developed.
    - >
      The full application added graphical preferences, keyboard shortcuts, Finder
      context menus, custom applications, multiple editors and terminals, localization,
      and configurable launch behavior. Later maintenance expanded compatibility to
      modern terminals and editors and fixed an AppleScript command-injection
      vulnerability.
  related-projects:
    - >
      OpenInTerminal-Lite and OpenInEditor-Lite are lighter companion applications from
      the same repository.
    - >
      The README credits cdto, OpenTerminal, SwiftScripting, FinderGo, and Mos as
      reference projects.
  sources:
    - https://github.com/Ji4n1ng/OpenInTerminal
    - https://github.com/Ji4n1ng/OpenInTerminal/blob/master/Resources/README-Config.md
    - source_facts.package-manager
  summary:
    - >
      OpenInTerminal is an open-source macOS Finder extension and toolbar application
      that opens the selected item or current Finder directory in a preferred terminal,
      editor, or other developer application.
  timeline:
    - '0.1.0: First release.'
    - >
      0.3.0: The lightweight implementation was named OpenInTerminal-Lite in preparation
      for a more capable application.
    - '0.9.0: OpenInTerminal was released after several weeks of development.'
    - '2.0: The application expanded editor integration and graphical preferences.'
    - '2.3: Custom applications and broader modern terminal and editor support were added.'
  usage:
    - >
      Users place the application in Applications, enable its Finder extension, and add
      its icon to the Finder toolbar. It opens selected items first, then the top Finder
      window, and finally the desktop when neither is available.
    - >
      Graphical preferences choose terminals, editors, context-menu items, and
      shortcuts. Advanced users can modify commands such as the Neovim or kitty launcher
      in the documented group-container property list.
