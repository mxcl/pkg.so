config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GNU Typist is niche compared with graphical typing tutors, but it has remained
      packageable because it fits Unix education environments: it runs in a terminal,
      depends on curses, and stores lessons as text. Its ecosystem role is strongest in
      free-software education, multilingual practice material, and lightweight lab or
      remote-shell setups.
  package-nerd-significance:
    - >
      The appeal is that a typing tutor can be packaged like any other GNU terminal
      tool: source tarballs, info/man documentation, curses portability, and lesson
      files that can be inspected and patched. It is a small example of GNU treating
      educational software as hackable text.
  project-history:
    - >
      GNU FTP records gtypist releases from the early 2000s, with version 2.5 appearing
      in 2002 and a long release line through the 2.8, 2.9, and 2.10 series. The GNU
      project page presents it as an official GNU package and emphasizes text-mode
      portability across GNU/Linux, GNU/Hurd, Unix variants, and Windows builds using
      PDCurses and MinGW.
    - >
      The project evolved around international lessons and modifiable tutorials. The GNU
      page lists lessons for several languages and keyboard layouts, and describes the
      tutorial format as a simple scripting language that contributors can write
      directly or submit as plain text for conversion.
  related-projects:
    - >
      Related projects include other free typing tutors named by the GNU page, such as
      KTouch, Tux Typing, Typespeed, and dvorak7min, plus curses and PDCurses for
      terminal interfaces.
  sources:
    - https://ftp.gnu.org/gnu/gtypist/
    - https://www.gnu.org/software/gtypist/
    - https://www.gnu.org/software/gtypist/doc/
  summary:
    - >
      GNU Typist, also known as gtypist, is a terminal typing tutor from the GNU
      Project. It combines a curses-based practice program with lesson files,
      keyboard-layout support, and a small lesson scripting language so users and
      teachers can adapt drills rather than consume a fixed course.
  timeline:
    - '2002: GNU FTP archive lists gtypist 2.5.'
    - '2008: GNU FTP archive lists the 2.8 series.'
    - '2011: GNU FTP archive lists the 2.9 series.'
    - '2025: GNU FTP archive lists the 2.10.1 release.'
  usage:
    - >
      Users run gtypist to navigate lessons, practice drills, and track errors and speed
      in a keyboard-focused interface. Teachers and contributors use the lesson format
      to create new tutorials, localize exercises, or adapt material for QWERTY, Dvorak,
      Colemak, and non-English practice.
related-packages:
  - id: brew:typespeed
    reason: >
      Choose Typespeed when you want typing practice as a curses-based arcade game,
      including multiplayer play, rather than GNU Typist's structured tutorials and
      drills.
    rel: alternative
    sources:
      - https://www.gnu.org/software/gtypist/
      - https://typespeed.sourceforge.net/
