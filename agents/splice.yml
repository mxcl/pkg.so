history:
  adoption-history:
    - >
      Splice announced its private beta in October 2013 as a workflow and
      cloud-collaboration platform for musicians. By 2022, an official company
      announcement reported more than four million users of its broader music-creation
      platform; this is a vendor-reported platform figure rather than desktop-cask
      usage.
    - >
      The desktop application's role shifted over time. Its early emphasis included
      project backup and collaboration, while later releases centered on browsing
      Sounds, dragging samples into DAWs, managing rent-to-own software, and integrating
      audio-discovery tools.
    - >
      Splice discontinued its original Studio collaboration feature in 2023 to
      concentrate on Sounds, search and exploration, and the plugin marketplace.
  package-nerd-significance:
    - >
      Splice Desktop is a representative proprietary package-managed client for a
      subscription catalog. The cask delivers the interface and updater, while account
      entitlements, sample licensing, catalog metadata, and rent-to-own activation
      remain service-controlled.
    - >
      Audio users care about its filesystem behavior because samples are real local
      files that can be dragged into a DAW. By default they live in a user-level Splice
      folder, while plugin presets may be placed in product-specific library
      directories.
  project-history:
    - >
      Steve Martocci and Matt Aimonetti founded Splice in 2013. The initial product
      entered private beta that October with cloud backup, revision tracking, dependency
      analysis, and collaboration for digital-audio-workstation projects.
    - >
      A redesigned desktop app launched in May 2018 with direct access to the full
      Sounds library and improved in-app preview, search, and drag-and-drop workflows.
    - >
      The desktop client later gained native Apple Silicon optimization and expanded
      personalized browsing, sample-license generation, and Stack previews. Following
      the 2023 retirement of Studio collaboration, the application focused on Sounds,
      DAW integration, and software management.
  related-projects:
    - >
      Splice Sounds is the service's sample catalog and the desktop application's main
      content source.
    - Splice Bridge connects desktop sample previews to a DAW's key and tempo.
    - >
      Splice Mobile and the Splice Sounds Plugin provide sibling routes into the same
      account and sound catalog.
    - >
      Astra, Beatmaker, and rent-to-own third-party plugins are installed or managed
      through Splice Desktop.
  sources:
    - https://splice.com/blog/desktop-update-june-2023/
    - https://splice.com/blog/hello-world-this-is-splice/
    - https://splice.com/blog/studio-shutdown/
    - https://splice.com/blog/the-all-new-splice-desktop-app/
    - https://support.splice.com/en/articles/8652657-how-do-i-install-the-splice-desktop-app
    - source_facts.package-manager
  summary:
    - >
      Splice Desktop is the macOS client for Splice's music-production service,
      providing sample discovery and download, DAW-oriented preview and drag-and-drop,
      and plugin installation or entitlement management.
  timeline:
    - '2013-10-09: Splice announces its private beta.'
    - '2014: Splice launches the Studio collaboration feature.'
    - >
      2018-05-16: A redesigned desktop application brings the full Sounds library into
      the client.
    - '2023-06-05: The original Studio collaboration workflow is removed.'
    - >
      2023-06-15: Desktop gains native Apple Silicon optimization and expanded discovery
      features.
  usage:
    - >
      Producers browse and filter the Sounds catalog, preview samples, organize
      Collections, download sounds, and drag audio directly into a DAW. Bridge can
      audition loops against the DAW project's tempo and key.
    - >
      The application also installs and activates supported plugins and rent-to-own
      software. Downloaded sounds default to `~/Splice` on macOS, but this is a mutable
      content-library location rather than the application's configuration file.
    - >
      Official troubleshooting documentation identifies `.certs` under the application's
      macOS Application Support directory as certificate material recreated after
      account sign-in. No official stable path for a discrete configuration file was
      found.
