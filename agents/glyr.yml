history:
  adoption-history:
    - >
      Glyr's README lists GMPC, Pragha, Freya, and lyvi as users or related consumers,
      showing adoption inside Linux music-player and desktop-metadata tooling. Its
      package entries in Homebrew, Debian, Ubuntu, Arch, Nix, and openSUSE-derived
      packaging reflect a Unix desktop niche: scripts and players needed metadata
      without each project writing provider scrapers.
    - >
      Because many providers and web pages change over time, Glyr's ecosystem
      significance is tied to the era when local music players needed album art, lyrics,
      biographies, and similar metadata from client-side search tools.
  package-nerd-significance:
    - >
      Glyr is package-nerd significant because it captures a classic Linux-desktop
      utility pattern: one C library and CLI centralize fragile metadata scraping so
      music players and shell scripts do not each reinvent it. Its value is partly
      historical, documenting a pre-streaming-service approach to enriching local music
      collections.
  project-history:
    - >
      The public GitHub repository was created in 2011. The README says Glyr began as an
      internal library for a music player and then expanded into a standalone program
      and library for retrieving music metadata from multiple providers.
    - >
      Early development focused on provider plugins, download speed, API cleanup, cache
      support, Levenshtein-based fuzzy matching, Unicode handling, and a command-line
      interface. The hand-written changelog records a concentrated burst of work in 2011
      and a 2016 license change from GPLv3 to LGPLv3.
  related-projects:
    - GMPC, Pragha, Freya, and lyvi are listed by the README as users or related software.
    - >
      libcurl, GLib, and SQLite are documented dependencies for download, utility, and
      cache functionality.
    - Python and Ruby bindings extended Glyr beyond its C API.
  sources:
    - https://api.github.com/repos/sahib/glyr
    - https://github.com/sahib/glyr
    - https://raw.githubusercontent.com/sahib/glyr/master/CHANGELOG
    - https://raw.githubusercontent.com/sahib/glyr/master/README.textile
  summary:
    - >
      Glyr is a music metadata search engine distributed as both the `glyrc`
      command-line tool and the `libglyr` C library. It searches and downloads
      music-player-oriented metadata such as cover art, lyrics, artist photos,
      biographies, reviews, tags, relations, similar artists, and track lists.
  timeline:
    - '2011: Public GitHub repository created.'
    - '2011: Changelog records provider, parser, performance, API, and getter work.'
    - '2011: Changelog was discontinued in favor of Git history.'
    - '2016: License changed from GPLv3 to LGPLv3.'
  usage:
    - >
      Practitioners use `glyrc` for batch metadata retrieval, for example downloading
      covers for an artist and album to a formatted path, or use `libglyr` from C
      programs that need metadata lookup. The README distinguishes getters, such as
      `cover` or `lyrics`, from providers, meaning the source sites queried for those
      getters.
    - >
      Developers can embed the C library, write provider plugins, use SQLite caching,
      control result counts and query strategy, and build wrappers; the README also
      points to Python and Ruby bindings.
related-packages:
  - id: brew:beets
    reason: >
      Choose beets when you want a maintained, scriptable music-library manager that
      writes and organizes metadata as well as fetching artwork, lyrics, genres, and
      fingerprints; Glyr is a lower-level metadata search CLI and C API.
    rel: alternative
    sources:
      - https://github.com/sahib/glyr
      - https://beets.io/
  - id: brew:sacad
    reason: >
      Choose SACAD when the task is specifically automated cover-art retrieval and
      embedding across a music library; Glyr covers a broader range of player-facing
      metadata through multiple getters.
    rel: alternative
    sources:
      - https://github.com/sahib/glyr
      - https://github.com/desbma/sacad
  - id: cask:musicbrainz-picard
    reason: >
      MusicBrainz Picard complements Glyr by identifying recordings and writing
      authoritative MusicBrainz tags and cover art, while Glyr focuses on retrieving
      player-facing metadata such as lyrics, biographies, reviews, and related artists.
    rel: adjacent_workflow
    sources:
      - https://github.com/sahib/glyr
      - https://picard.musicbrainz.org/
