history:
  adoption-history:
    - >
      U.GG states that millions of users use its app. Its desktop offering grew from a
      League of Legends companion into a shared application covering additional
      competitive games.
  package-nerd-significance:
    - >
      The Homebrew cask provides a repeatable macOS installation path for a proprietary
      game companion normally obtained from U.GG. The package is notable to game-tool
      collectors because it combines live overlays, build recommendations, scouting, and
      post-game analysis in one desktop client.
  project-history:
    - >
      U.GG is an Outplayed, Inc. statistics and companion service whose official site
      dates its copyright range from 2017. The service built its identity around League
      of Legends statistics derived from Riot's API and later developed a desktop
      companion application.
    - >
      The unified U.GG App subsequently combined support for League of Legends,
      Deadlock, Valorant, and other games, adding in-game recommendations, live
      statistics, loadout import, scouting, and post-game analysis.
  related-projects:
    - League of Legends
    - Deadlock
    - Valorant
    - Riot Games API
    - U.GG PLUS
  sources:
    - https://u.gg/app
    - https://u.gg/faq
    - https://u.gg/lol/news/stop-alt-tabbing-between-pulls-u-gg-stats-now-load-inside-wow
  summary:
    - >
      U.GG App is a proprietary desktop companion for competitive games. It supplies
      statistical analysis, builds, overlays, live-game information, and
      player-performance tools.
  timeline:
    - '2017: The official U.GG copyright range begins.'
    - '2026: U.GG announced World of Warcraft support in its desktop application.'
  usage:
    - >
      Players run U.GG alongside supported games to receive champion or character
      recommendations, import loadouts, inspect teammates and opponents, follow live
      metrics, and review post-game performance. Some functionality and an ad-free
      experience are offered through U.GG PLUS.
