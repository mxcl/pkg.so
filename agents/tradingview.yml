history:
  adoption-history:
    - >
      TradingView Desktop extended TradingView's browser-based charting platform into a
      focused multi-window application for Windows, macOS, and Linux. Existing
      TradingView accounts, layouts, watchlists, charts, screeners, news, and broker
      connections carry the platform's network effects into the desktop client.
    - >
      The application reached stable status in December 2021. Subsequent releases added
      and refined multi-monitor workflows, synchronized symbols and crosshairs, native
      notifications, restored workspaces, screeners, heatmaps, news, Linux packaging,
      and customizable tabs.
  package-nerd-significance:
    - >
      The Homebrew cask offers a package-manager installation path for a proprietary,
      automatically updated Electron desktop client. It is a representative example of
      package managers managing the installation boundary while user data and most
      functionality remain tied to a hosted service.
    - >
      Release notes expose Electron upgrades and platform-specific packaging milestones,
      including Apple silicon support and Debian packages, which are useful details for
      desktop-package maintainers.
  project-history:
    - >
      TradingView Desktop began as a native-style companion to TradingView's web
      platform, preserving its charting and social-finance environment while adding
      desktop-specific window, tab, notification, and synchronization behavior.
    - >
      A public beta was available in 2021, followed by a stable release that December.
      Version 2.0 arrived in December 2022, and the 3.x line introduced a redesigned,
      customizable New Tab and additional workspace synchronization.
  related-projects:
    - TradingView web platform
    - TradingView Screeners
    - TradingView Charting Library
    - TradingView broker integrations
  sources:
    - >
      Official Desktop overview:
      https://www.tradingview.com/support/solutions/43000671618-what-is-tradingview-desktop/
    - 'Official Desktop update archive: https://www.tradingview.com/blog/en/category/desktop/'
    - >
      Official release notes:
      https://www.tradingview.com/support/solutions/43000673888-tradingview-desktop-releases-and-release-notes/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      TradingView Desktop is TradingView's cross-platform desktop client for financial
      charting, market analysis, screeners, watchlists, social content, alerts, and
      supported broker connections.
  timeline:
    - '2021-04: TradingView announced a new Desktop beta.'
    - '2021-12: TradingView Desktop reached stable status.'
    - '2022-12: TradingView Desktop 2.0 was released.'
    - '2024-06: TradingView announced Debian packaging for Linux.'
    - '2026-01: Version 3.0 introduced a customizable New Tab on Windows and Linux.'
    - '2026-08: The supplied Homebrew cask referenced TradingView Desktop 3.4.0.'
  usage:
    - >
      Sign in with a TradingView account to open charts, layouts, watchlists, screeners,
      market pages, alerts, and supported broker connections in a dedicated desktop
      workspace. Desktop-specific features include multi-monitor use, linked symbols and
      crosshairs, restored tabs, and native notifications.
    - >
      The application depends heavily on TradingView's hosted platform and account
      services. Users who connect brokerage accounts should follow the broker's security
      practices and TradingView's authentication guidance.
