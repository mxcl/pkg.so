history:
  adoption-history:
    - >
      Screen Studio evolved from a macOS screen recorder into an integrated recorder,
      editor, and sharing workflow. Later releases added reusable presets, iPhone and
      iPad recording, shareable links, camera layouts, quick sharing, and batch export.
    - >
      Homebrew Cask distribution provides a command-line installation path for the
      proprietary macOS application.
  package-nerd-significance:
    - >
      Screen Studio is representative of polished commercial macOS creator tools
      distributed through Homebrew Cask. Its documented .screenstudio project and
      .screenstudiopreset formats also make recordings and editing presets portable
      artifacts rather than purely hidden application state.
  project-history:
    - >
      Screen Studio's surviving official changelog records rapid iteration by November
      2022, including automatic zoom ranges, export improvements, and saved
      .screenstudio project files. The 2.x line expanded editing and preset
      capabilities, while version 3.0 in December 2024 added shareable links, camera
      layouts, a command menu, custom cursors, and multi-project export.
  related-projects:
    - No official companion source-code project is documented.
  sources:
    - 'Homebrew Cask provenance: source_facts.package-manager and source_facts.provenance'
    - 'Official changelog: https://screen.studio/changelog'
    - 'Official guide: https://screen.studio/guide'
    - 'Official project-saving guide: https://screen.studio/guide/saving-your-project'
  summary:
    - >
      Screen Studio is a commercial macOS screen recorder and editor designed to turn
      recordings into polished videos with automatic camera movement and zoom effects.
  timeline:
    - >
      2022: The official legacy changelog records the 1.x release series and
      introduction of saved .screenstudio projects.
    - '2023: Screen Studio added a portable .screenstudiopreset format.'
    - >
      2024: Screen Studio 3.0 introduced shareable links, camera layouts, quick sharing,
      custom cursors, a command menu, and multi-project export.
  usage:
    - >
      Users record a display, window, webcam, microphone, or connected iPhone or iPad,
      then edit zooms, cursor presentation, layout, and other visual effects before
      exporting or creating a shareable link.
    - >
      Projects can be saved for later editing. The default project directory is
      user-selectable in Settings, so the official documentation does not define one
      fixed filesystem location.
