history:
  adoption-history:
    - >
      GoBackup was packaged for Homebrew as the brew:gobackup formula and also documents
      Homebrew installation alongside its shell install script. Its adoption pattern is
      that of a focused operations CLI rather than a framework: users install the
      binary, point it at a YAML configuration file, and let scheduled backup jobs run.
  package-nerd-significance:
    - >
      The package is notable because it packages a classic sysadmin concern as a small
      Go binary with no runtime dependency on Ruby or Python. For Homebrew users, that
      makes it a tidy example of the post-2010s migration of server-maintenance tools
      from scripting-language ecosystems into statically compiled CLIs.
  project-history:
    - >
      The public repository was created in September 2017, and the project documentation
      describes GoBackup as inspired by the Ruby backup/backup project while avoiding a
      Ruby dependency. Early releases followed quickly after the repository appeared,
      beginning with 0.0.1 on September 8, 2017.
  related-projects:
    - backup/backup is the explicitly cited inspiration for GoBackup.
    - >
      GoBackup belongs near other self-hosted backup and sync CLIs that package database
      dumps, filesystem archives, cloud object storage, and notifications into one
      installable command.
  sources:
    - https://api.github.com/repos/gobackup/gobackup
    - https://api.github.com/repos/gobackup/gobackup/releases?per_page=100
    - https://formulae.brew.sh/formula/gobackup
    - https://github.com/gobackup/gobackup
    - https://gobackup.github.io/
  summary:
    - >
      GoBackup is a Go-based server backup utility for databases and files, with output
      targets that include local and network/cloud storage. In package-manager terms it
      sits in the small-admin-tools lane: a single command intended to replace heavier,
      language-runtime-dependent backup scripts on application servers.
  timeline:
    - '2017-09-06: Public GitHub repository created'
    - '2017-09-08: 0.0.1 release published'
    - >
      2017: Project documentation describes Ruby China using GoBackup from the start of
      the design period
    - >
      2025: Documentation site records GoBackup features including daemon mode, Web UI,
      HTTP API, multiple databases, and multiple storage backends
  usage:
    - >
      GoBackup is used to archive configured files and dump databases such as MySQL,
      PostgreSQL, Redis, MongoDB, SQLite, Microsoft SQL Server, InfluxDB, MariaDB, etcd,
      and Firebird, then send the results to storage backends such as FTP, SFTP, SCP,
      S3-compatible services, Google Cloud Storage, Azure Blob Storage, Backblaze B2,
      WebDAV, and others. The same configuration can include notification targets such
      as mail, webhooks, Discord, Slack, Telegram, and similar services.
related-packages:
  - id: brew:restic
    reason: >
      Choose restic when you want encrypted, repository-based snapshots with explicit
      integrity checking instead of GoBackup's database-dump and job-orchestration
      model.
    rel: alternative
    sources:
      - https://gobackup.github.io/
      - https://restic.readthedocs.io/en/stable/010_introduction.html
  - id: brew:duplicity
    reason: >
      Choose duplicity when encrypted tar volumes and bandwidth-efficient incremental
      backups are more important than GoBackup's integrated database, notification, and
      service features.
    rel: alternative
    sources:
      - https://gobackup.github.io/
      - https://duplicity.us/stable/README.html
