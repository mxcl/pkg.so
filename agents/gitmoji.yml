id: brew:gitmoji
display-name: gitmoji-cli
repo: https://github.com/carloscuesta/gitmoji-cli
docs:
  - https://github.com/carloscuesta/gitmoji-cli#readme
  - https://gitmoji.dev/
config-file-location:
  unix:
    - package.json
    - .gitmojirc.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Gitmoji became a recognizable developer-experience convention because the guide is
      easy to display in READMEs and the CLI made the convention usable without
      memorizing the catalog. The guide repository has substantial GitHub stars, and the
      CLI is distributed through npm and Homebrew.
    - >
      The npm package history begins in November 2016 and spans many published versions,
      reflecting a JavaScript-tooling distribution model where the CLI can be installed
      globally and used across repositories.
  package-nerd-significance:
    - >
      gitmoji-cli is notable because the Homebrew formula name gitmoji points to a Node
      CLI whose upstream package is gitmoji-cli. It is a small example of package
      identity drift between a convention, its website, its data package, and the
      executable users install.
  project-history:
    - >
      The Gitmoji guide repository was created in October 2016 to standardize and
      explain emoji usage in GitHub commit messages. The gitmoji-cli repository followed
      in November 2016 as an interactive client for using those symbols from a terminal.
    - >
      The CLI grew around practical commit-message tasks: searching the Gitmoji catalog,
      listing available entries, initializing a commit hook, creating commits through
      prompts, and caching the emoji list for offline use. Its configuration supports
      package.json and .gitmojirc.json so projects can choose emoji format, prompts,
      scopes, and catalog URL.
  related-projects:
    - carloscuesta/gitmoji provides the guide and emoji catalog used by the CLI.
    - The gitmojis npm package publishes the emoji data for dependency use.
  sources:
    - https://api.github.com/repos/carloscuesta/gitmoji
    - https://api.github.com/repos/carloscuesta/gitmoji-cli
    - https://formulae.brew.sh/formula/gitmoji
    - https://github.com/carloscuesta/gitmoji
    - https://github.com/carloscuesta/gitmoji-cli
    - https://gitmoji.dev/
    - https://raw.githubusercontent.com/carloscuesta/gitmoji-cli/master/README.md
    - https://raw.githubusercontent.com/carloscuesta/gitmoji/master/README.md
    - https://registry.npmjs.org/gitmoji-cli
  summary:
    - >
      gitmoji-cli is the command-line companion to Gitmoji, Carlos Cuesta's emoji guide
      for commit messages. The CLI turns the guide into an interactive commit workflow,
      searchable emoji catalog, commit hook, and local configuration system.
  timeline:
    - '2016: The carloscuesta/gitmoji guide repository was created.'
    - '2016: The carloscuesta/gitmoji-cli repository and npm package were created.'
    - '2018: README examples showed hook, search, list, update, and configuration workflows.'
    - "2025: The 9.x release line continued the CLI's maintenance stream."
  usage:
    - >
      Practitioners use gitmoji-cli to search for an intention, create an interactive
      commit, or install a commit hook that prompts for an emoji during git commit.
      Teams that prefer text tokens can configure code-style output, while teams that
      prefer visual logs can use raw emoji.
    - >
      The tool is often paired with Conventional Commits-style scopes or
      project-specific commit guidelines, giving a lightweight visual layer over release
      notes and history scanning.
related-packages: []
