history:
  adoption-history:
    - >
      ReadCube offers individual, team, and enterprise plans, and its official material
      describes use by researchers, research teams, corporate libraries, medical-affairs
      groups, and other organizations managing scientific literature.
  package-nerd-significance:
    - >
      The cask packages the native macOS client for a cloud-backed scholarly workflow.
      Package users may care about the distinction between the current client and the
      separately named legacy Papers 4 application documented by ReadCube.
  project-history:
    - >
      Papers and ReadCube were historically presented as related names for the same
      literature-management product. ReadCube's official FAQ says the names are being
      consolidated under ReadCube, while deployment documentation still calls the
      installed desktop application Papers and distinguishes it from Papers 4 (Legacy).
    - >
      ReadCube expanded the platform in 2024 with ReadCube Pro, adding AI-assisted
      literature search, monitoring, and analysis. During 2026, official release notes
      recorded the replacement of Papers branding with ReadCube branding in the browser
      extension and SmartCite.
  related-projects:
    - >
      SmartCite is ReadCube's citation tool for word processors. ReadCube Pro and
      ReadCube Literature Review add literature monitoring, AI assistance, and
      systematic-review workflows.
  sources:
    - https://about.readcube.com/
    - https://about.readcube.com/faq/
    - >
      https://about.readcube.com/help-center/deploying-the-desktop-app-for-enterprise-customers/
    - https://about.readcube.com/news/unlocking-the-power-of-ai/
    - https://about.readcube.com/release-notes/
  summary:
    - >
      ReadCube Papers is a commercial reference manager for finding, storing, reading,
      annotating, sharing, and citing scholarly literature. The Papers name is being
      consolidated into the ReadCube brand.
  timeline:
    - >
      2020: Official ReadCube material was marketing Papers Enterprise for
      organizational literature management.
    - '2024: ReadCube Pro launched with AI-assisted literature monitoring and analysis.'
    - '2026: ReadCube began consolidating Papers branding under the ReadCube name.'
  usage:
    - >
      Researchers import references and PDFs, organize them into personal or shared
      libraries, annotate full text, search bibliographic data and notes, synchronize
      libraries, and create citations through SmartCite.
