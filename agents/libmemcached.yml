history:
  adoption-history:
    - >
      The official project page says libMemcached was adopted by web properties
      including Yahoo, Twitter, Baidu, and Mixi.jp, and also used outside the web in
      custom caching services for industries such as oil exploration and medical
      research.
    - >
      Since the memcapable tool appeared in 2009, the project has been used as a
      memcached protocol capability checker and certification reference. Distribution
      packaging reflects the split maintenance story: some systems package libmemcached,
      while others package libmemcached-awesome or related libhashkit development
      packages.
  package-nerd-significance:
    - >
      libMemcached matters to package people because it is both a library and a pile of
      sharp little admin tools. The tools expose real memcached protocol behavior, while
      the library underpins older C/C++ software that predates newer language-specific
      clients.
    - >
      It is also a packaging history lesson: when an upstream becomes quiet, downstream
      distributions and forks such as libmemcached-awesome keep ABI expectations, build
      systems, and security fixes alive.
  project-history:
    - >
      The libMemcached project says it was created by Brian Aker and designed from the
      start for high-performance memcached use, with attention to network and memory
      behavior and many tunable client options.
    - >
      The project was historically hosted in Bazaar on Launchpad, where the libmemcached
      code page lists the development focus branch and many active branches. The package
      later developed an ecosystem split: the original libmemcached.org/Launchpad
      project remained the reference named by this package, while libmemcached-awesome
      appeared as a maintained resurrection of Brian Aker's original work.
  related-projects:
    - memcached is the server this client library targets.
    - >
      libhashkit is a related hashing library that appears in downstream package
      relationships.
    - libmemcached-awesome is the active fork/resurrection used by several distributions.
  sources:
    - https://awesomized.github.io/libmemcached/
    - https://code.launchpad.net/libmemcached
    - https://formulae.brew.sh/formula/libmemcached
    - https://github.com/awesomized/libmemcached
    - https://libmemcached.org/About.html
    - https://memcached.org/
  summary:
    - >
      libMemcached is a C and C++ client library and tool suite for the memcached
      server. It gives C-family applications and shell users a full-featured client for
      the memcached protocol, including utilities such as memcat, memcp, memstat,
      memslap, and memcapable.
  timeline:
    - "2009: memcapable is introduced and becomes the project's protocol capability checker."
    - >
      2011: Launchpad branch history shows active 1.0-era development, including binary
      protocol and operational fixes.
    - >
      2021: Launchpad branch activity records Brian Aker commits around the 1.0 and 1.2
      series.
    - >
      2023: libmemcached-awesome 1.1.4 is released as a maintained resurrection of the
      original work.
  usage:
    - >
      Developers link libMemcached into C or C++ services that talk to memcached.
      Operators use the included command-line tools for cache inspection, copying,
      deletion, flushing, statistics, load testing, and protocol conformance checks.
    - >
      The package belongs next to memcached itself: memcached is the in-memory key-value
      server, while libMemcached is one client library and command suite for
      applications and scripts that need to speak to that server.
related-packages:
  - id: brew:memcached
    reason: >
      Run memcached as the cache server that libMemcached applications and command-line
      utilities connect to and administer.
    rel: adjacent_workflow
    sources:
      - https://libmemcached.org/
      - https://memcached.org/
