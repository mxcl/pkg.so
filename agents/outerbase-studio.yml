history:
  adoption-history:
    - >
      Outerbase positioned Studio as a lightweight, local-first option for developers,
      students, independent developers, and small projects that do not require the
      collaboration features of its cloud platform. Browser and desktop editions make
      the interface usable with both local files and network database servers.
  package-nerd-significance:
    - >
      Studio combines a web-oriented database interface with a desktop wrapper that can
      ship native database drivers. That split is notable to package maintainers because
      the desktop package enables MySQL and PostgreSQL connectivity that is impractical
      inside an ordinary browser sandbox.
  project-history:
    - >
      Outerbase Studio grew from LibSQL Studio, an open-source SQLite-oriented GUI
      created by Visal In. Outerbase acquired that project and brought its creator onto
      the team in September 2024.
    - >
      Outerbase announced the expanded, open-source Outerbase Studio in December 2024,
      combining the LibSQL Studio foundation with support for MySQL, PostgreSQL, SQLite,
      and related systems. The desktop edition is an Electron wrapper around the web
      application and supplies drivers unavailable in a browser environment.
  related-projects:
    - LibSQL Studio is the direct predecessor of Outerbase Studio.
    - >
      Outerbase Cloud is the related hosted product for collaboration, AI-assisted
      queries, and visualization.
    - The desktop wrapper complements the browser-hosted Outerbase Studio application.
  sources:
    - https://github.com/outerbase/studio#readme
    - https://github.com/outerbase/studio-desktop#readme
    - https://outerbase.com/blog/outerbase-studio-open-source-database-management/
    - https://outerbase.com/developers/outerbase-studio/
  summary:
    - >
      Outerbase Studio Desktop is a lightweight desktop database GUI for querying,
      editing, and administering relational databases, packaged as an Electron wrapper
      around Outerbase Studio.
  timeline:
    - 'September 2024: Outerbase acquired LibSQL Studio and brought its creator onto the team.'
    - >
      December 2024: Outerbase announced Outerbase Studio as an open-source GUI for
      MySQL, PostgreSQL, and SQLite.
  usage:
    - >
      Users create database connections, browse schemas, edit table data, compose and
      save SQL queries, and modify database structure. The desktop wrapper is especially
      useful when native MySQL or PostgreSQL drivers are required.
