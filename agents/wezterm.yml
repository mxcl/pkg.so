credentials-file-location: null
history:
  adoption-history:
    - >
      WezTerm developed as a portable terminal for Linux, macOS, Windows, FreeBSD, and
      NetBSD, with release artifacts and package-manager instructions for multiple
      ecosystems.
    - >
      The supplied package facts record its availability as a Homebrew cask. Official
      installation documentation also covers winget, Scoop, Chocolatey, native
      downloads, and Linux packages.
  package-nerd-significance:
    - >
      WezTerm combines a GPU-rendered terminal, built-in multiplexer, SSH client, serial
      support, image protocols, and a deeply programmable Lua configuration in one Rust
      project.
    - >
      Its date-and-commit-based release identifiers, live Lua configuration reloads,
      broad platform coverage, and extensive terminal-protocol support make it
      particularly interesting to terminal and dotfile enthusiasts.
  project-history:
    - >
      Wez Furlong began WezTerm as a Rust-based, GPU-accelerated terminal emulator and
      multiplexer. The official documentation carries a 2018-present copyright notice.
    - >
      The earliest release documented in the current changelog is from November 2019 and
      already included tabs, hot-reloaded configuration, SSH and serial connections,
      inline images, IME support, and software-rendering fallback.
    - >
      Subsequent releases expanded native Wayland support, installers and packages,
      multiplexer behavior, shell integration, graphics protocols, and the Lua
      configuration API.
  related-projects:
    - >
      WezTerm's multiplexer and wezterm cli commands are distributed as parts of the
      same project.
    - >
      Its imgcat support interoperates with terminal image protocols associated with
      terminals such as iTerm2.
  sources:
    - https://github.com/wezterm/wezterm
    - https://wezterm.org/
    - https://wezterm.org/changelog.html
    - https://wezterm.org/config/files.html
    - source_facts.package-manager
  summary:
    - >
      WezTerm is an open-source, GPU-accelerated, cross-platform terminal emulator and
      multiplexer written in Rust by Wez Furlong.
  timeline:
    - "2018: The project's official copyright period begins."
    - >
      2019-11-24: The earliest release in the current changelog documented tabs, SSH,
      serial access, inline images, and IME support.
    - '2019-12-18: Native Wayland support was added.'
    - '2020-06-07: A Windows installer and WSL discovery were added.'
    - '2021-02-03: The macOS build became universal for Apple Silicon and Intel.'
  usage:
    - >
      Users run local shells, split work into panes, tabs, and windows, connect to SSH
      or serial endpoints, and attach to multiplexer domains.
    - >
      Configuration is executable Lua and can define appearance, fonts, key bindings,
      launch menus, events, and platform-specific behavior; changes are normally
      reloaded automatically.
