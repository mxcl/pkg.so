history:
  adoption-history:
    - >
      TechSmith has distributed Camtasia across Windows and macOS for many product
      generations. Its continuing manuals, tutorials, enterprise material, and annual
      releases reflect established use in training, product demonstrations, screencasts,
      and instructional-video production.
  package-nerd-significance:
    - >
      Camtasia is a notable proprietary desktop cask: installation is simple, but
      projects, recordings, media references, licensing, and annual-version
      compatibility make lifecycle management more involved than the application bundle
      alone. TechSmith recommends local storage for project media to avoid corruption or
      export failures.
  project-history:
    - >
      Official TechSmith manuals document Camtasia Studio in the early 2000s as a
      combined screen-recording and production suite. The product evolved from separate
      recorder and producer workflows into an integrated cross-platform editor.
    - >
      Modern Camtasia combines screen, camera, and audio capture with timeline editing,
      effects, captions, templates, and sharing workflows. TechSmith continues to issue
      feature releases for both macOS and Windows.
  related-projects:
    - >
      TechSmith Snagit provides image and lightweight video capture and integrates with
      Camtasia workflows.
    - Camtasia Online provides browser-based recording and collaboration.
    - TechSmith Screencast provides hosted sharing.
    - TechSmith Audiate supports transcription and text-based audio/video editing workflows.
  sources:
    - https://assets.techsmith.com/Docs/pdf-camtasiaStudio/cs_602_help.pdf
    - https://support.techsmith.com/hc/en-us/articles/203727488-Location-of-Saved-Recordings
    - https://www.techsmith.com/camtasia/whats-new/
    - https://www.techsmith.com/video-editor.html
  summary:
    - >
      Camtasia is TechSmith's proprietary screen-recording and video-editing suite,
      widely used to make tutorials, demonstrations, training material, and screencasts.
  timeline:
    - >
      Early 2000s: TechSmith documentation describes Camtasia Studio as a
      screen-recording and production suite.
    - '2010s: Camtasia develops into a cross-platform editor for Windows and macOS.'
    - >
      2020s: TechSmith expands Camtasia with Rev workflows, captions, templates,
      collaboration, and AI-assisted editing.
    - '2026: TechSmith continues annual desktop feature releases for macOS and Windows.'
  usage:
    - >
      Record a screen, camera, microphone, or imported media; assemble the result on a
      timeline; add annotations, effects, audio, and captions; then export or share the
      finished video. On macOS, unused recordings default to ~/Movies and are
      automatically deleted after 14 days unless the setting is changed.
