history:
  adoption-history:
    - >
      Thor has been distributed through both the Mac App Store and direct GitHub
      releases. Its official GitHub repository has attracted a substantial macOS utility
      audience, and Homebrew Cask provides a command-line installation route.
  package-nerd-significance:
    - >
      Thor is representative of focused, open-source macOS menu-bar utilities that
      become easier to reproduce and maintain through Homebrew Cask. Its source build
      also uses CocoaPods, connecting desktop-app packaging with the Apple development
      dependency ecosystem.
  project-history:
    - >
      Alvin Zhu developed Thor as an open-source macOS utility for opening selected
      applications immediately through keyboard shortcuts. The repository's copyright
      history begins in 2014.
  related-projects:
    - MASShortcut, the shortcut framework credited by Thor.
    - CocoaPods, used to install Thor's source dependencies.
  sources:
    - https://github.com/gbammc/Thor
    - https://github.com/gbammc/Thor#readme
  summary:
    - >
      Thor is an open-source macOS application launcher centered on user-assigned global
      keyboard shortcuts.
  timeline:
    - "2014: Thor's documented copyright history begins."
    - >
      Later distribution: Thor became available through the Mac App Store, GitHub
      releases, and Homebrew Cask.
  usage:
    - >
      Users assign shortcuts to frequently used applications and invoke them without
      navigating the Dock, Finder, or Spotlight. Developers can build the app with Xcode
      after installing its CocoaPods dependencies.
