id: cask:pgadmin4
display-name: pgAdmin 4
repo: https://github.com/pgadmin-org/pgadmin4
docs:
  - https://www.pgadmin.org/docs
config-file-location:
  macos:
    - ~/Library/Preferences/pgadmin/runtime_config.json
    - /Library/Preferences/pgadmin/config_system.py
credentials-file-location:
  macos:
    - ~/.pgadmin4/pgadmin4.db
history:
  adoption-history:
    - >
      pgAdmin 4 succeeded pgAdmin III as the project's modern cross-platform
      administration interface. Its desktop and web deployment modes helped it serve
      both individual developers and multi-user installations.
    - >
      The project distributes desktop bundles, native Linux packages, a Python wheel, a
      container image, and source releases, making it common across local workstations
      and managed PostgreSQL environments.
  package-nerd-significance:
    - >
      pgAdmin is a reference graphical administration tool in the PostgreSQL ecosystem.
      Package users care about the distinction between its Electron desktop runtime and
      its deployable Python web application, as well as compatibility between pgAdmin,
      PostgreSQL servers, and bundled command-line utilities.
    - >
      Its broad packaging footprint illustrates the complexity of distributing a web
      application as both a desktop program and a multi-user service.
  project-history:
    - >
      pgAdmin 4 was developed as a complete rewrite of pgAdmin III using a Python web
      backend and a JavaScript interface. Its first major release followed more than
      10,000 hours of development.
    - >
      The initial desktop edition used a C++ and Qt runtime. Later releases evolved the
      desktop packaging and interface while retaining the option to deploy the same
      application on a web server.
  related-projects:
    - PostgreSQL is the database platform administered by pgAdmin.
    - pgAdmin III was the preceding generation.
    - pgAgent historically supplied job-scheduling integration for PostgreSQL installations.
  sources:
    - https://www.pgadmin.org/docs/
    - https://www.pgadmin.org/docs/pgadmin4/9.16/release_notes_1_0.html
    - https://www.pgadmin.org/docs/pgadmin4/9.18/desktop_deployment.html
    - https://www.pgadmin.org/download/
  summary:
    - >
      pgAdmin 4 is the pgAdmin Development Team's open-source graphical administration
      and development environment for PostgreSQL. It can run as a macOS desktop
      application or as a multi-user web application.
  timeline:
    - '2016-09-29: pgAdmin 4 1.0 became the first major release of the rewritten application.'
    - >
      2017: Version 2.0 made desktop and server modes available without separate
      configuration changes.
    - "2018: A Docker distribution joined the project's packaging options."
    - '2022: The official source repository moved to the pgadmin-org GitHub organization.'
  usage:
    - >
      Users register PostgreSQL servers, inspect and modify database objects, execute
      and analyze SQL, monitor activity, and invoke backup, restore, and maintenance
      utilities.
    - >
      Desktop installations run a local application server behind the graphical runtime.
      Administrators may instead deploy pgAdmin behind a production web server for
      multiple users.
