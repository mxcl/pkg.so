history:
  adoption-history:
    - >
      Pock became a prominent open-source customization utility for Touch Bar-equipped
      MacBook models. Its official repository records a substantial community footprint
      and an ecosystem of separately maintained widgets.
  package-nerd-significance:
    - >
      Pock is a recognizable example of software built around Apple's Touch Bar
      hardware. Its open-source Swift code, widget framework, and package-manager
      availability make an otherwise niche hardware customization tool easy to inspect,
      extend, and install.
  project-history:
    - >
      Pock began as a macOS utility that places Dock items and system controls in the
      MacBook Touch Bar. The project later developed PockKit and a widget model for
      third-party extensions.
    - >
      The 0.9 series was described by its maintainers as a complete rewrite, adding
      direct widget updates through the Widgets Manager.
  related-projects:
    - PockKit
    - Dock Widget
    - Status Widget
    - Control Center Widget
  sources:
    - https://github.com/pock/pock
    - https://github.com/pock/pock/releases
    - https://pock.app/
    - https://pock.app/docs/
  summary:
    - >
      Pock is a free, open-source widget manager for the MacBook Touch Bar. It supplies
      Dock, media, Escape, status, control-center, and weather widgets, with support for
      customization and additional widgets.
  timeline:
    - >
      0.9 series: Pock was rewritten around an expanded widget ecosystem and one-click
      widget updates.
  usage:
    - >
      After launching Pock, users control it from its menu-bar icon. Preferences
      configure Pock and individual widgets, while Customize Pock changes widget
      placement in the Touch Bar. Developers can build additional widgets with PockKit.
