history:
  adoption-history:
    - >
      The project distributes desktop builds and a headless server for macOS and Linux.
      The `sdrmm` Homebrew formula packages the server, while the project's tap also
      offers the desktop application.
  package-nerd-significance:
    - >
      SDR-- packages a modern Rust-based SDR stack with a browser-accessible
      client/server design. It is notable to package users because one installation can
      place signal processing near an antenna while exposing the same workspace to
      desktop and remote clients.
  project-history:
    - >
      SDR-- is an AGPL-licensed software-defined-radio project created by Julian Haag.
      It combines radio-device access, DSP, demodulation, decoding, recording,
      visualization, and automation in one modular node-and-wire interface.
    - >
      The repository was originally exposed under the `sdrminusminus` name and now
      redirects to `Newspicel/sdrmm`; the user-facing product name remains SDR--.
  related-projects:
    - RTL-SDR and HackRF are among the supported SDR hardware ecosystems.
    - SigMF is supported for recording and playback.
    - The server exposes REST, WebSocket, MCP, and OpenAPI interfaces for automation.
  sources:
    - https://github.com/Newspicel/sdrmm
    - https://sdrmm.com/docs/
    - source_facts.package-manager
  summary:
    - >
      SDR-- is a modular client/server software-defined-radio application for receiving,
      decoding, visualizing, and recording radio signals.
  timeline:
    - '2026: Public SDR-- releases and cross-platform installation artifacts were published.'
  usage:
    - >
      Users connect an SDR device or IQ recording, wire device, channel, decoder, and
      display nodes in Patch view, and pin frequently used controls to Rack view.
    - >
      The `sdrmm` server can run locally or near a remote antenna and serves the
      interface to a browser, with a default local workflow opening the service on port
      8080.
