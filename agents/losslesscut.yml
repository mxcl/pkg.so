  windows:
    - '%APPDATA%\LosslessCut\config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      LosslessCut is released for macOS, Windows, and Linux. Its direct downloads,
      application-store releases, and package-manager availability have made its
      FFmpeg-based workflow accessible without requiring users to construct commands
      manually.
    - >
      The project is maintained by its creator, Mikael Finstad, and accepts community
      contributions and translations through its public repository.
  package-nerd-significance:
    - >
      LosslessCut is a prominent graphical front end for stream-copy-oriented FFmpeg
      workflows. It is useful when a full nonlinear editor would introduce unnecessary
      rendering time or generation loss.
    - >
      Its cross-platform packaging, bundled FFmpeg capabilities, command-line options,
      project-file format, and experimental local HTTP API make it useful to both
      desktop users and automation-oriented media enthusiasts.
  project-history:
    - >
      Mikael Finstad created LosslessCut as a fast, cross-platform tool for trimming
      video and audio without re-encoding. The application grew to cover merging, stream
      extraction, remuxing, metadata operations, segment detection, and other media
      tasks.
    - >
      The project remains free and open source and relies on FFmpeg for its underlying
      media operations.
  related-projects:
    - FFmpeg performs the underlying media processing.
    - Electron supplies the cross-platform desktop application framework.
  sources:
    - >
      Official application metadata:
      https://github.com/mifi/lossless-cut/blob/master/no.mifi.losslesscut.appdata.xml
    - 'Official documentation: https://github.com/mifi/lossless-cut/blob/master/docs/index.md'
    - >
      Official installation documentation:
      https://github.com/mifi/lossless-cut/blob/master/docs/installation.md
    - 'Official repository and README: https://github.com/mifi/lossless-cut'
  summary:
    - >
      LosslessCut is a free, open-source, cross-platform desktop application for rapidly
      cutting and manipulating video and audio, usually without re-encoding.
  timeline:
    - '2019: Official application metadata records the 2.6.2 release.'
    - >
      Subsequent development expanded the application from lossless cutting into stream
      management, remuxing, metadata editing, batch processing, and automation.
  usage:
    - >
      Users open media, mark one or more segments, and export them. When the requested
      operation and cut points permit stream copying, output is produced without a slow
      re-encode or generation loss.
    - >
      The application also supports project files, batch-oriented operations, a basic
      command-line interface, and an experimental local HTTP API.
