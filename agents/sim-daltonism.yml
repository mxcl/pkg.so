history:
  adoption-history:
    - >
      The application has been distributed through both the Mac App Store and a direct
      developer download. Publishing the source opened the simulator to inspection and
      contribution, while the shared Mac and iOS project broadened it beyond
      desktop-only use.
  package-nerd-significance:
    - >
      Sim Daltonism is a compact example of accessibility tooling packaged as a native
      desktop utility. It gives designers and developers an immediate visual check for
      color-dependent interfaces without requiring a browser-specific testing
      environment, and its source exposes a practical implementation of real-time vision
      simulation.
  project-history:
    - >
      Michel Fortin created Sim Daltonism as a Mac color-blindness simulator; the
      copyright record in the official repository begins in 2005. Version 2 was rebuilt
      using code shared with Red Stripe, moved filtering to OpenGL for real-time
      performance, added a transparent filter-window mode, expanded to iOS, and made the
      project open source.
  related-projects:
    - The Mac and iOS editions share the same official source repository.
    - >
      Red Stripe is a related Michel Fortin application whose capture and filtering
      architecture contributed to Sim Daltonism 2.
  sources:
    - https://github.com/michelf/sim-daltonism
    - https://michelf.ca/projects/mac/sim-daltonism/
    - https://michelf.ca/projects/mac/sim-daltonism/whats-new/
  summary:
    - >
      Sim Daltonism is Michel Fortin's open-source color-vision simulator for macOS and
      iOS. The Mac edition filters screen content in real time so designers, developers,
      and other users can approximate several forms of color blindness.
  timeline:
    - '2005: The copyright period recorded in the official repository begins.'
    - >
      Version 2: The filtering engine was rebuilt around OpenGL, the project expanded to
      iOS, and the source was opened.
  usage:
    - >
      On macOS, users position a filter window above screen content or have it follow
      the pointer, then select a simulated color-vision condition. Typical uses include
      accessibility review of websites and application interfaces, checking visual
      designs, and demonstrations of how color distinctions can change.
