history:
  adoption-history:
    - >
      JMC first reached a broad JDK audience when Java Mission Control was bundled with
      JDK 7 Update 40. JMC 7 moved to an open-source OpenJDK project and became a
      separate download usable by both OpenJDK and Oracle JDK users.
    - >
      The OpenJDK project lists binary distributions from multiple downstream Java
      vendors, including Eclipse Adoptium, Azul, BellSoft, Oracle, and Red Hat.
  package-nerd-significance:
    - >
      JMC is valued because it turns low-overhead Java Flight Recorder data into an
      interactive production-diagnostics workflow. Its separation from the JDK also made
      downstream packaging and vendor-neutral distribution important parts of its
      ecosystem.
    - >
      The repository additionally exposes reusable core APIs for parsing recordings,
      automated analysis rules, units, and event processing, enabling command-line and
      programmatic tooling beyond the desktop application.
  project-history:
    - >
      Mission Control originated as a tightly integrated Java production-monitoring and
      diagnostics suite. It combines a JMX console with visualization and automated
      analysis of Java Flight Recorder recordings.
    - >
      JMC 7 marked its transition to community development under OpenJDK and
      distribution independently of the JDK. The open-source project continues to
      support recordings produced by multiple JDK generations.
  related-projects:
    - Java Flight Recorder supplies the event recordings most commonly analyzed with JMC.
    - JMX supplies live monitoring and management capabilities.
    - >
      OpenJDK hosts the open-source JMC project, while several JDK vendors distribute
      binaries.
  sources:
    - https://docs.oracle.com/en/java/java-components/jdk-mission-control/
    - >
      https://docs.oracle.com/en/java/java-components/jdk-mission-control/7/user-guide/jdk-mission-control.html
    - https://github.com/openjdk/jmc
    - https://www.oracle.com/java/technologies/javase/jmc-relnotes.html
  summary:
    - >
      JDK Mission Control is an open-source production-time profiling and diagnostics
      application for Java. It analyzes Java Flight Recorder data and provides live JVM
      monitoring through JMX with low observer overhead.
  timeline:
    - >
      2013: JDK 7 Update 40 included the first Java Mission Control release bundled with
      HotSpot.
    - >
      JMC 7: Development moved to the OpenJDK Mission Control project and JMC became a
      separate download.
    - 'JMC 9: Official documentation added support and guidance for the current OpenJDK line.'
  usage:
    - >
      Developers and operators open JFR recordings to investigate CPU use, allocation,
      garbage collection, locking, latency, and other JVM behavior. Automated rules
      highlight likely problems and provide tuning guidance.
    - >
      The JMX Console connects to local or remote JVMs for live inspection and
      management, while the core APIs support custom recording-processing and reporting
      tools.
