id: brew:badkeys
display-name: badkeys
repo: https://github.com/badkeys/badkeys
docs:
  - https://badkeys.info/
  - https://github.com/badkeys/badkeys#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through PyPI and appears in Homebrew and Nix in the
      batch package metadata. The README also points users to Repology for distribution
      packages, suggesting upstream expected operating-system packaging beyond
      Python-only installation.
    - >
      Release names show the project expanding its checks over time, including DKIM
      support in 2024, parser robustness and return-code improvements in 2026, and a
      'Post-Quantum Edition' release in June 2026.
  package-nerd-significance:
    - >
      badkeys is package-nerd relevant because it turns a pile of cryptographic failure
      cases into a reusable CLI and library with data updates. Packaging it gives
      security teams a repeatable way to scan public keys without copying ad hoc scripts
      around.
    - >
      It also illustrates a modern security package pattern: a small Python CLI,
      external vulnerability/blocklist data, optional network scanning modes, and
      package-manager availability for workstation and CI installation.
  project-history:
    - >
      The badkeys GitHub repository was created in January 2022. Its README says the
      tool checks public keys in multiple formats for known vulnerabilities, with a
      public web version at badkeys.info.
    - >
      The README credits Hanno Boeck as author, says the work was initially funded in
      2022 through the CIDI project and CISAT at the IT University of Copenhagen, and
      notes later 2025/2026 support from NLnet's NGI0 Core Fund.
  related-projects:
    - >
      badkeys is adjacent to OpenSSL, SSH host-key audit tooling, TLS scanners, DKIM key
      checking, and certificate linting tools.
    - The README notes Paramiko as an optional dependency for SSH scanning.
  sources:
    - https://badkeys.info/
    - https://github.com/badkeys/badkeys
    - https://github.com/badkeys/badkeys/releases
    - https://pypi.org/project/badkeys/
    - source_facts.package-manager
  summary:
    - >
      badkeys is a Python tool and library for checking cryptographic public keys
      against known vulnerability patterns and blocklist data. It sits in the practical
      security-tooling niche between certificate/key parsers and vulnerability scanners.
  timeline:
    - >
      2022: Public GitHub repository created and initial CIDI/CISAT funding period
      described by upstream.
    - '2024: v0.0.7 and v0.0.9 releases published; v0.0.9 added DKIM support.'
    - '2025: Upstream README notes NLnet NGI0 Core Fund support across 2025/2026.'
    - "2026: v0.0.19 'Post-Quantum Edition' released."
  usage:
    - >
      badkeys users first download blocklist data with badkeys --update-bl, then scan
      key, certificate, CSR, SSH public key, TLS host, or SSH host material. The README
      documents return codes that distinguish application errors, parser problems, and
      vulnerable keys.
    - >
      Its command-line use is intentionally automation-friendly: quiet output when no
      vulnerable keys are found, an all-keys output flag for audits, and bitmask return
      codes for CI or batch scans.
related-packages:
  - id: brew:openssl@3
    reason: >
      OpenSSL can inspect or extract public keys and certificates before passing the
      resulting PEM material to badkeys for vulnerability analysis.
    rel: adjacent_workflow
    sources:
      - https://docs.openssl.org/3.0/man1/openssl-pkey/
      - https://github.com/badkeys/badkeys
