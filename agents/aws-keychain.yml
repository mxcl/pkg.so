id: brew:aws-keychain
display-name: aws-keychain
repo: null
docs:
  - https://github.com/pda/aws-keychain#readme
config-file-location: null
credentials-file-location:
  macos:
    - ~/.aws/credentials
history:
  adoption-history:
    - >
      GitHub lists v3.0.0 as the latest release dated September 22, 2015 and describes
      the repository as succeeded by aws-vault. Homebrew analytics showed only 8
      installs in 30 days, 10 in 90 days, and 56 in 365 days at the time of this batch,
      consistent with a historical package kept around for existing users.
  package-nerd-significance:
    - >
      aws-keychain is a compact example of the local-secret-storage lineage that led to
      better-known tools such as aws-vault. It matters less as a current recommendation
      and more as a package archaeology marker for how macOS AWS users avoided plaintext
      credentials before first-class AWS SSO workflows.
  project-history:
    - >
      The upstream README identifies the project as a 2014-2015 Paul Annesley
      MIT-licensed tool. It was written for the Mac OS X Keychain era of local AWS
      access-key management, before newer credential-process, SSO, and vault-style
      workflows became the dominant recommendation.
  related-projects:
    - 'aws-vault: the successor recommended by the aws-keychain README.'
  sources:
    - https://formulae.brew.sh/api/formula/aws-keychain.json
    - https://github.com/pda/aws-keychain
  summary:
    - >
      aws-keychain is a macOS shell CLI for storing AWS IAM access keys in the macOS
      Keychain and checking one selected key out into `~/.aws/credentials` or into a
      command environment. Its README explicitly says it is no longer maintained and
      recommends aws-vault instead.
  timeline:
    - '2014-2015: README copyright period for aws-keychain.'
    - '2015: GitHub lists v3.0.0 as the latest release, with separate keychain file behavior.'
    - '2026: Homebrew formula metadata still tracks the v3.0.0 source archive.'
  usage:
    - >
      The command supports `add`, `ls`, `exec`, and `rm` operations for named IAM access
      keys in Keychain. The README warns about shell history when adding keys, supports
      interactive secret entry, and shows `aws-keychain exec personal aws s3 ls` as the
      intended safe command-running workflow.
related-packages:
  - id: brew:aws-vault
    reason: >
      AWS Vault is the successor explicitly recommended by aws-keychain and adds
      maintained secure-backend and temporary-credential workflows across multiple
      platforms.
    rel: alternative
    sources:
      - https://github.com/pda/aws-keychain#readme
      - https://github.com/ByteNess/aws-vault#readme
      - https://github.com/ByteNess/aws-vault/blob/main/USAGE.md
