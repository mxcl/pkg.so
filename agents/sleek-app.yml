credentials-file-location: null
history:
  adoption-history:
    - >
      sleek has been distributed across Windows, macOS, and Linux through GitHub
      releases and ecosystem channels including Homebrew, Flatpak, Snap, the Arch User
      Repository, and desktop app stores.
    - >
      Its use of ordinary todo.txt files makes it interoperable with editors,
      synchronization services, and other todo.txt clients rather than locking tasks
      into an application database.
  package-nerd-significance:
    - >
      sleek is a polished desktop expression of the Unix-friendly todo.txt idea: the
      durable user data is readable text, while the GUI supplies filtering, grouping,
      recurrence, due dates, notifications, and archiving. This makes it attractive to
      users who want desktop convenience without surrendering file ownership or format
      portability.
  project-history:
    - >
      sleek emerged as a free and open-source Electron application for managing todo.txt
      files on Linux, Windows, and macOS. Public v1 releases were in active use by 2021.
    - >
      The project continued through a 2.x series, broadening todo.txt with advanced
      search expressions, friendly dates, recurrence, notifications, safe writes, saved
      filters, localization, and customizable colors.
  related-projects:
    - >
      sleek belongs to the todo.txt ecosystem and can share files conceptually with
      other todo.txt-compatible desktop, mobile, and command-line clients.
  sources:
    - https://github.com/ransome1/sleek
    - https://github.com/ransome1/sleek/releases
    - https://github.com/ransome1/sleek/wiki
    - https://github.com/ransome1/sleek/wiki/Available-todo.txt-attributes-and-extensions
    - https://github.com/ransome1/sleek/wiki/User-data-folder-location
  summary:
    - >
      sleek is a free, open-source, cross-platform task manager built around the
      plain-text todo.txt format. It provides a graphical interface while keeping tasks
      in user-selected text files.
  timeline:
    - 'By 2021: The public 1.x series was in active cross-platform use.'
    - >
      2024: The 2.x series included continued work on archiving and other established
      todo.txt workflows.
    - >
      2026: The project documented safe writes, customizable colors, and explicit
      per-platform user-data locations.
  usage:
    - >
      Users create or open one or more todo.txt files. Tasks can carry priorities,
      projects, contexts, due and threshold dates, recurrence, and other extensions;
      sleek adds filtering, grouping, full-text search, notifications, and archiving to
      done.txt files.
