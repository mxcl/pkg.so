id: brew:gimme-aws-creds
display-name: gimme-aws-creds
repo: https://github.com/Nike-Inc/gimme-aws-creds
docs:
  - https://github.com/Nike-Inc/gimme-aws-creds#readme
config-file-location:
  unix:
    - ~/.okta_aws_login_config
credentials-file-location:
  unix:
    - ~/.aws/credentials
    - ~/.aliyun/config.json
history:
  adoption-history:
    - >
      The package fits the enterprise CLI niche created by federated AWS access:
      engineers need temporary AWS profiles, but organizations often require Okta MFA
      and SAML rather than long-lived IAM user keys. Distribution through PyPI,
      Homebrew, and Nix made it accessible to Python and macOS-oriented workstation
      setups.
  package-nerd-significance:
    - >
      gimme-aws-creds is package-manager-interesting because it lives at the boundary
      between local developer ergonomics and enterprise identity policy. Small packaging
      details, Python support, shell completion, optional dependencies, and
      credential-file paths directly affect whether engineers can enter cloud shells
      without manual SAML copy-and-paste work.
  project-history:
    - >
      The official README describes gimme-aws-creds as a CLI that uses an Okta identity
      provider via SAML to acquire short-lived credentials for AWS and Alibaba Cloud.
      Its 1.0.0 release notes describe support for a Lambda proxy to avoid sharing an
      Okta API key widely, plus Okta MFA support for multiple factors.
    - >
      Over time the tool expanded from an Okta-to-AWS credential helper into a broader
      cloud credential bridge. Its documentation covers Okta Identity Engine,
      browser-based device authorization, MFA factor handling, configurable profiles,
      optional gimme-creds-lambda proxying, and Alibaba Cloud RAM credentials using the
      same Okta authentication flow.
  related-projects:
    - >
      The README points to gimme-creds-lambda for proxying Okta API interaction. It also
      sits near Okta's AWS client, AWS STS AssumeRoleWithSAML workflows, Alibaba Cloud
      STS, and other Okta-to-cloud credential helper CLIs.
  sources:
    - https://github.com/Nike-Inc/gimme-aws-creds
    - https://github.com/Nike-Inc/gimme-aws-creds#readme
    - https://github.com/Nike-Inc/gimme-aws-creds/releases/tag/v1.0.0
    - https://pypi.org/project/gimme-aws-creds/
  summary:
    - >
      gimme-aws-creds is a command-line tool from Nike for obtaining short-lived cloud
      credentials through Okta-backed SAML authentication.
  timeline:
    - '2017: Version 1.0.0 released with Lambda proxy and MFA support notes.'
    - '2018: 1.0 and 1.1 series releases continued on PyPI.'
    - '2019: 2.0 series appeared on PyPI.'
    - '2023: 2.7 series releases added Identity Engine and authentication-policy work.'
    - '2024: 2.8.2 released with config and Windows dependency fixes.'
  usage:
    - >
      Practitioners install the tool, run its configuration action to store Okta
      organization, application, role, and profile preferences, then run gimme-aws-creds
      to write temporary credentials to the AWS shared credentials file or to stdout.
      Teams use named profiles and environment overrides to switch accounts, roles,
      durations, MFA behavior, and cloud-provider mode.
related-packages:
  - id: brew:okta-aws-cli
    reason: >
      Choose Okta's okta-aws-cli for an Identity Engine-native, browser-driven flow with
      minimal configuration; its official comparison contrasts that model with
      gimme-aws-creds' broader Classic and credential-prompting options.
    rel: alternative
    sources:
      - https://github.com/okta/okta-aws-cli#comparison
      - https://github.com/Nike-Inc/gimme-aws-creds#readme
  - id: brew:awscli
    reason: >
      gimme-aws-creds writes temporary profiles to AWS's shared credentials file, which
      AWS CLI can consume with its standard profile workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/Nike-Inc/gimme-aws-creds/blob/master/README.md
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html
tags:
