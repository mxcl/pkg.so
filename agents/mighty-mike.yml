history:
  adoption-history:
    - >
      The modernized release makes the former classic Mac title available on macOS,
      Windows, and Linux. The maintainer distributes builds through GitHub and itch.io
      and groups it with modern ports of several other Pangea Software games.
  package-nerd-significance:
    - >
      The project is notable as a preservation-minded source port: it turns a 1990s
      Macintosh game into an installable modern package while retaining original
      gameplay and assets and adding contemporary display and controller support.
  project-history:
    - >
      Pangea Software originally published the game in 1995 as Power Pete. It was
      re-released in 2000 under the Mighty Mike name.
    - >
      Iliyas Jorio's modern source port reached version 3.0.0 in April 2021 with support
      for current systems, widescreen presentation, twin-stick controls, and other
      compatibility improvements. Pangea Software authorized the repository's
      noncommercial open release.
  related-projects:
    - >
      Jorio's modern ports of other Pangea titles, including Bugdom, Cro-Mag Rally,
      Nanosaur, and Otto Matic.
    - Power Pete, the original title and identity of the game.
  sources:
    - https://github.com/jorio/MightyMike
    - https://github.com/jorio/MightyMike/blob/master/CHANGELOG.md
    - https://github.com/jorio/MightyMike/blob/master/docs/Instructions.pdf
  summary:
    - >
      Mighty Mike is a modernized, cross-platform release of Pangea Software's classic
      Macintosh action game Power Pete.
  timeline:
    - '1995: Initial release as Power Pete.'
    - '2000: Re-released under the name Mighty Mike.'
    - '2021: Modern-system version 3.0.0 released.'
    - '2022: Version 3.0.1 added display, zoom, controller, and macOS improvements.'
    - >
      2023: Version 3.0.2 introduced a custom OpenGL framebuffer renderer and additional
      platform targets.
  usage:
    - >
      Guide Mike through toy-store stages in top-down action gameplay, fighting enemies
      and collecting weapons and items. The modern port supports widescreen display,
      uncapped rendering with interpolation, and twin-stick gamepad controls.
