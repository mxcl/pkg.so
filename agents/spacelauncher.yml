history:
  adoption-history:
    - >
      The application grew from its creator's personal keyboard workflow into software
      shared with other users. Feedback about different typing rhythms shaped its core
      handling of overlapping Space-bar and trigger-key events.
    - >
      SpaceLauncher is distributed directly and through a Homebrew cask. It remains a
      commercial, locally operating utility with an unrestricted evaluation period
      followed by a one-time license for continued use.
  package-nerd-significance:
    - >
      SpaceLauncher is part of the lineage of macOS keyboard-launcher and remapping
      tools that includes Alfred, LaunchBar, Karabiner, Hammerspoon, and Keyboard
      Maestro. Its distinctive contribution is treating Space as a leader key while
      preserving ordinary typing and Space-drag behavior.
    - >
      Its plain-text JSON exports, dedicated binding package format, full-backup format,
      URL scheme, AppleScript and shell-command actions, and local rolling backups make
      it unusually inspectable and automatable for a proprietary desktop utility.
  project-history:
    - >
      Creator Chen Guo traces the idea to a 2013 Alfred hotkey workflow. After moving to
      LaunchBar, he recreated the behavior in Karabiner with Space under the thumb as
      the most comfortable leader key, then built a standalone application when a macOS
      update temporarily left that setup unusable.
    - >
      The difficult part was distinguishing normal typing from intentional Space-led
      shortcuts across different typing rhythms. That specialized timing logic became
      the reason for maintaining a purpose-built tool rather than relying entirely on
      general remappers.
    - >
      Around 2022, work on modifier-tap leader keys produced the related keyseq
      application and informed SpaceLauncher 2. In early 2026, development returned to
      the older project, leading to another round of architectural and feature work.
  related-projects:
    - Alfred inspired the original one-key application-launch workflow.
    - LaunchBar prompted the creator to seek a replacement for Alfred's app hotkeys.
    - >
      Karabiner supplied the first Space-based prototype; Hammerspoon and Keyboard
      Maestro occupy adjacent automation territory.
    - >
      keyseq is a related application by the same creator whose modifier-tap work
      informed SpaceLauncher 2.
  sources:
    - 'Official changelog: https://spacelauncherapp.com/changelog'
    - 'Official configuration reference: https://spacelauncherapp.com/references/config-format'
    - 'Official product and usage page: https://spacelauncherapp.com/'
    - 'Official project story: https://spacelauncherapp.com/story/'
  summary:
    - >
      SpaceLauncher is a macOS keyboard automation utility that turns Space—or another
      chosen key—into a leader for hierarchical shortcuts while preserving the key's
      normal tap behavior. Bindings can launch resources, run menu commands and scripts,
      simulate keystrokes, and perform system actions.
  timeline:
    - >
      2013: The workflow began with single-key application hotkeys in Alfred and a later
      Karabiner prototype using Space as the leader.
    - "2017: The product's official copyright period begins."
    - >
      2022: Modifier-tap experiments produced keyseq and informed the architecture of
      SpaceLauncher 2.
    - >
      Early 2026: Active development resumed with assistance untangling the
      long-standing timing logic.
    - >
      2026: The 3.x series expanded leaders, shortcut editing, configuration export,
      backups, localization, and action support.
  usage:
    - >
      A typical binding holds Space and presses one or more trigger keys, such as
      Space-S to launch Safari or Space-F-D to open Downloads. Users may instead
      configure another held key, a dedicated key, a modifier tap, or a key combination
      as the leader.
    - >
      Bindings can be scoped by application and can open apps, URLs, files, or folders;
      invoke application menu items; simulate keystrokes; run AppleScript, shell
      commands, or executable files; switch input methods; and perform system actions.
    - >
      Users can export key bindings as `.slbindings` JSON packages or full backups as
      `.slbackup` packages. These are user-selected export files, not a documented fixed
      on-disk configuration-file location.
