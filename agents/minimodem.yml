    - https://github.com/kamalmostafa/minimodem
    - https://manpages.ubuntu.com/manpages/xenial/man1/minimodem.1.html
  summary:
    - >
      minimodem is Kamal Mostafa's command-line software FSK modem, with project
      copyright notices covering 2011 through 2020. It decodes or generates audio modem
      tones at user-selected baud rates and frames them with common protocols rather
      than targeting only one historical modem format.
  usage:
    - >
      Its practical niche is audio-frequency data transfer and signal experimentation
      from a Unix shell. The project supports protocols such as Bell 103, Bell 202,
      RTTY, TTY/TDD, NOAA SAME, and Caller ID, and it can work live through the system
      audio device or in batch mode through audio files. Users can move data between
      nearby computers by cable or sound, or across radio, telephone, and other audio
      channels. That makes minimodem useful to radio hobbyists, retrocomputing users,
      signal-processing experiments, and tests where a small FSK encoder/decoder is
      easier than a full modem stack.
related-packages:
  - id: brew:direwolf
    reason: >
      Choose Dire Wolf when the goal is AX.25 packet radio, APRS, digipeating, or an
      Internet gateway; minimodem handles general framed FSK but explicitly does not
      decode AX.25.
    rel: alternative
    sources:
      - https://github.com/kamalmostafa/minimodem/blob/master/src/minimodem.1.in
      - https://github.com/wb2osz/direwolf
