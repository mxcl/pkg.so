credentials-file-location: null
history:
  adoption-history:
    - >
      bwm-ng was adopted by Unix and Linux distributions because it offered a
      lightweight live monitor without requiring a full monitoring stack. The official
      project page lists Debian, Gentoo, Ubuntu, OpenWrt, Source Mage, Fink/Darwin,
      Slackware, Red Hat, Fedora, SUSE, Solaris, FreeBSD, and OpenBSD packaging or
      ports; the supplied package facts add Homebrew, Alpine, Nix, Pacman, and zypper.
  package-nerd-significance:
    - >
      bwm-ng is package-nerd significant as a portability fossil from the era when a
      useful network monitor meant handling many OS-specific kernel interfaces by hand.
      It is tiny, scriptable, and valuable on servers where installing a larger
      telemetry stack would be overkill.
  project-history:
    - >
      Volker Gropp's project page and README say bwm-ng was influenced by an older bwm
      utility by Barney, which had problems with faster interfaces and was very simple.
      Gropp already had much of the needed code from other projects and created his own
      version.
    - >
      The tool grew around portable input backends: /proc/net/dev, netstat, getifaddr,
      sysctl, kstat, /proc/diskstats, /proc/partitions, IOKit, devstat, and libstatgrab.
      Its ChangeLog shows intensive portability work around the 0.6 release in 2007 and
      later maintenance releases in 2015, 2019, and 2021.
  related-projects:
    - The older bwm utility by Barney directly influenced bwm-ng.
    - >
      libstatgrab is an optional related library referenced by the project for
      statistics collection.
    - >
      Tools such as iftop, nload, and vnStat occupy adjacent network-monitoring niches,
      though bwm-ng emphasizes simple multi-output live rates.
  sources:
    - https://github.com/vgropp/bwm-ng
    - https://github.com/vgropp/bwm-ng/blob/main/ChangeLog
    - https://www.gropp.org/?id=projects&sub=bwm-ng
    - source_facts.package-manager
  summary:
    - >
      bwm-ng, Bandwidth Monitor NG, is a small console bandwidth monitor for network and
      disk I/O. It reports live rates for interfaces and devices through curses, plain
      console, CSV, or HTML output.
  timeline:
    - "2004: README copyright range begins, matching the project's early public era."
    - '2007: bwm-ng 0.6 release cleans up portability and disk I/O support.'
    - '2015: bwm-ng 0.6.1 updates build and libstatgrab compatibility.'
    - '2019: bwm-ng 0.6.2 incorporates community fixes and build updates.'
    - '2021: bwm-ng 0.6.3 adds newer Linux netstat support and other fixes.'
  usage:
    - >
      Users run `bwm-ng` interactively to watch interface or disk throughput, switch
      input methods, toggle units, show current, max, sum, or average rates, and
      optionally export machine-readable CSV or HTML. The README documents config files
      at /etc/bwm-ng.conf and ~/.bwm-ng.conf.
related-packages:
  - id: brew:nload
    reason: >
      Choose nload for a focused curses graph of per-interface incoming and outgoing
      traffic; choose bwm-ng when disk I/O or CSV and HTML output also matter.
    rel: alternative
    sources:
      - https://github.com/vgropp/bwm-ng/blob/main/bwm-ng.1
      - https://www.roland-riegel.de/nload/
  - id: brew:iftop
    reason: >
      Choose iftop when you need live bandwidth broken down by communicating host pairs,
      while bwm-ng emphasizes aggregate rates for interfaces and disks.
    rel: alternative
    sources:
      - https://github.com/vgropp/bwm-ng/blob/main/bwm-ng.1
      - https://pdw.ex-parrot.com/iftop/
  - id: brew:vnstat
    reason: >
      Choose vnStat for daemon-backed, persistent daily and monthly traffic accounting;
      choose bwm-ng for an immediate live console view without maintaining a traffic
      database.
    rel: alternative
    sources:
      - https://github.com/vgropp/bwm-ng/blob/main/bwm-ng.1
      - https://humdi.net/vnstat/
