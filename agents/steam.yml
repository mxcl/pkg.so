credentials-file-location: null
history:
  adoption-history:
    - >
      Valve says Steam grew from a digital-content distribution channel into a platform
      through which thousands of creators and publishers deliver content and maintain
      direct customer relationships. Steam Community extended the platform with social
      features for players.
    - >
      Steam subsequently became the software and commerce layer for Valve hardware
      including Steam Link, Valve Index, and Steam Deck, broadening its role beyond a
      desktop game store.
  package-nerd-significance:
    - >
      Steam is a canonical example of a proprietary, self-updating application
      distributed by an operating-system package manager only as a bootstrap cask.
      Package installation places the client, while Steam itself manages accounts, game
      libraries, runtimes, updates, and large mutable content trees.
    - >
      Its split between the application bundle and the user-owned Steam data directory
      matters for backup, migration, troubleshooting, and uninstallation. Valve's macOS
      support documentation explicitly treats ~/Library/Application Support/Steam as
      persistent Steam data.
  project-history:
    - >
      Valve created Steam in 2003 as a digital content distribution channel, before
      modern app stores. The official Steam client release was announced on September
      12, 2003.
    - >
      Over time, Steam expanded beyond delivery and updates into purchasing, library
      management, multiplayer and community services, cloud features, creator tooling
      through Steamworks, and support for Valve's gaming hardware.
  related-projects:
    - Steamworks provides publishing, distribution, and platform APIs for developers.
    - Steam Community supplies social and user-generated-content features.
    - >
      Steam Deck and SteamOS extend the Steam ecosystem into dedicated gaming hardware
      and a Linux-based operating environment.
  sources:
    - https://help.steampowered.com/en/faqs/view/30EB-87BF-531F-512D
    - https://store.steampowered.com/about
    - https://store.steampowered.com/oldnews/183
    - https://www.valvesoftware.com/en/about
  summary:
    - >
      Steam is Valve's game distribution, library, community, and platform client.
      Launched in 2003, it developed from a content-delivery mechanism into a broad
      ecosystem for players, game creators, publishers, and Valve hardware.
  timeline:
    - '2003: Valve created Steam as a digital-content distribution channel.'
    - '2003-09-12: Valve announced the release of the Steam client.'
    - >
      Later years: Steam expanded into a storefront, library, community, developer
      platform, and hardware ecosystem.
  usage:
    - >
      Players use Steam to acquire, install, update, organize, and launch games; manage
      accounts and cloud-enabled data; communicate through Steam Community; and use
      compatible Valve hardware.
    - >
      On macOS, Steam stores substantial mutable data beneath ~/Library/Application
      Support/Steam. Valve's uninstall guidance distinguishes the Steam application from
      this data and notes that preserving SteamApps retains downloaded games and local
      data.
