id: brew:cassandra
display-name: Apache Cassandra
repo: https://gitbox.apache.org/repos/asf/cassandra.git
docs:
  - https://cassandra.apache.org/doc/latest
config-file-location:
  linux:
    - /etc/cassandra/cassandra.yaml
  unix:
    - conf/cassandra.yaml
credentials-file-location:
  unix:
    - ~/.cassandra/credentials
history:
  adoption-history:
    - >
      The official project homepage says Cassandra is trusted by thousands of companies
      for scalability and high availability. Its case studies list very large
      deployments, including Apple running more than 75,000 nodes, Instagram beginning
      use in 2012, Netflix managing petabytes of data, and Uber running Cassandra as a
      service for millions of queries per second and petabytes of data.
    - >
      Homebrew analytics show 3,989 stable installs in the last 365 days in the formula
      API, reflecting developer and local-test usage rather than production cluster
      deployment.
  package-nerd-significance:
    - >
      For package maintainers, Cassandra is a heavy, multi-tool Java database package
      with config files, shell tools, Python cqlsh behavior, and fast-moving runtime
      requirements. It is a good test of how a package manager handles daemon-oriented
      software, Java compatibility, CLI shims, configuration defaults, and large
      upstream release artifacts.
  project-history:
    - >
      The Apache Cassandra GitHub repository dates to 2009. The official README
      describes Cassandra as a highly scalable partitioned row store, with partitioning
      used to distribute data across machines and CQL as a SQL-like query language.
    - >
      Cassandra's release history spans many major operational changes. Current NEWS and
      CHANGES files describe work such as transactional cluster metadata, guardrails,
      repair automation design work, table constraints, role/password policies, and
      extensive storage-engine and read-path performance improvements.
  related-projects:
    - CQL and cqlsh are Cassandra's query language and interactive shell surface.
    - Reaper for Apache Cassandra is a related operations tool focused on repair scheduling.
    - >
      Apache Lucene-derived and storage-engine tooling appears around Cassandra indexing
      and SSTable operations, but Cassandra ships its own administration tools.
  sources:
    - https://gitbox.apache.org/repos/asf/cassandra.git
    - https://cassandra.apache.org
    - https://cassandra.apache.org/_/case-studies.html
    - https://cassandra.apache.org/doc/latest
    - https://github.com/apache/cassandra
    - https://github.com/apache/cassandra/blob/trunk/README.md
    - https://github.com/apache/cassandra/blob/trunk/NEWS.txt
    - https://github.com/apache/cassandra/blob/trunk/CHANGES.txt
    - https://formulae.brew.sh/api/formula/cassandra.json
  summary:
    - >
      Apache Cassandra is an open-source distributed NoSQL database built for high
      availability, linear scalability, and fault tolerance on commodity hardware or
      cloud infrastructure. It is one of the most recognizable databases in the
      package-manager catalog because a single package ships the server, cqlsh,
      nodetool, and a large set of SSTable and operations tools.
  timeline:
    - '2009: Apache Cassandra repository created.'
    - '2012: Instagram began using Cassandra according to the official case-study page.'
    - >
      2016: Bloomberg quote on the official homepage says its engineers turned to
      Cassandra that year.
    - '2026: Homebrew formula packages Apache Cassandra 5.0.8.'
  usage:
    - >
      The package is used to run Cassandra nodes, start local clusters, interact through
      `cqlsh`, and administer clusters with tools such as `nodetool`, `sstabledump`,
      `sstableloader`, and related SSTable utilities. Official docs identify
      `cassandra.yaml` as the main configuration file and cqlsh as the command-line CQL
      shell shipped with every Cassandra package.
related-packages:
  - id: brew:cassandra-reaper
    reason: >
      Reaper complements Cassandra by centrally scheduling and coordinating anti-entropy
      repairs, replacing ad hoc repair scripts with a dedicated service, API, UI, and
      CLI.
    rel: adjacent_workflow
    sources:
      - https://cassandra-reaper.io/
      - https://cassandra-reaper.io/docs
      - https://cassandra.apache.org/doc/latest/cassandra/managing/operating/repair.html
tags:
