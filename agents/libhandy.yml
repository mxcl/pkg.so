history:
  adoption-history:
    - >
      Libhandy began as part of Purism's Librem 5 effort, but Purism described it as
      quickly gaining popularity among GNOME application developers and being used by
      both third-party GNOME apps and core apps such as Settings, Files, and Web. It
      became an unofficial high-level widget layer above GTK before the GTK 4 work was
      redirected into libadwaita.
    - >
      The batch input lists packages for Homebrew, Fedora, MacPorts, Nix, Arch, Ubuntu,
      and openSUSE, showing that Libhandy's adaptive-widget role crossed from
      phone-oriented development into general distribution packaging.
  package-nerd-significance:
    - >
      Libhandy is a rare dependency whose history explains a platform transition: it
      made GNOME-on-phone work practical without forking the desktop ecosystem, then
      informed libadwaita as GTK 4 arrived. For package maintainers, it is also a
      compatibility library for GTK 3 applications that adopted adaptive GNOME UI
      patterns before moving to libadwaita.
  project-history:
    - >
      Purism's June 10, 2021 retrospective says Libhandy was created after experiments
      with mobile-specific and adaptive widgets showed that GTK developers needed a
      library they could include without modifying GTK itself. The name reflects Handy,
      the German word for a mobile phone, and the upstream README states the library's
      aim as helping develop mobile-device UI using GTK/GNOME.
    - >
      The NEWS file records version 0.81.0 migrating the project to GNOME GitLab,
      archiving the previous source.puri.sm project, switching CI to GNOME
      infrastructure, and publishing reference documentation through GNOME GitLab Pages.
      The same release made documentation and Glade catalog installation
      parallel-installable with libhandy 0.0, a packaging-friendly move during API
      transition.
  related-projects:
    - GTK 3 is the toolkit targeted by Libhandy.
    - >
      GNOME applications such as Settings, Files, and Web are named by Purism as
      adopters of Libhandy-style adaptive UI work.
    - >
      libadwaita is the GTK 4-era successor direction described by Purism for GNOME's
      high-level adaptive widgets.
    - >
      The Librem 5 and Phosh ecosystem supplied much of the original mobile GNOME
      pressure that made Libhandy useful.
  sources:
    - https://formulae.brew.sh/formula/libhandy
    - https://gitlab.gnome.org/GNOME/libhandy
    - https://gitlab.gnome.org/GNOME/libhandy/-/raw/main/NEWS
    - https://gitlab.gnome.org/GNOME/libhandy/-/raw/main/README.md
    - https://gnome.pages.gitlab.gnome.org/libhandy/doc/main
    - https://puri.sm/posts/making-a-platform-adaptive-for-everyone/
  summary:
    - >
      Libhandy is Purism and GNOME's GTK 3 widget library for adaptive applications,
      especially interfaces that need to work on both desktop windows and phone-sized
      screens. It is historically important because it bridged Librem 5 mobile work,
      mainstream GNOME applications, and the later GTK 4-era libadwaita direction.
  timeline:
    - >
      2018: Purism and GNOME contributors were actively using Libhandy widgets for
      adaptive Librem 5 application work.
    - >
      Version 0.81.0: The project migrated to GNOME GitLab and started publishing
      reference documentation with GNOME GitLab Pages.
    - 'Version 1.0.0: The NEWS file marked the 1.0 API line with no extra release-note changes.'
    - >
      2021-06-10: Purism described Libhandy's creation, GNOME adoption, and its
      relationship to libadwaita.
  usage:
    - >
      Developers use Libhandy to add adaptive GTK 3 widgets such as leaflet, carousel,
      view switcher, preferences, deck, flap, keypad, and other interface pieces. The
      handy-1-demo executable is the package-level demonstration surface for trying
      those widgets.
related-packages:
  - id: brew:libadwaita
    reason: >
      Choose libadwaita for new GTK 4 GNOME applications or when porting from GTK 3;
      GNOME's official migration guide identifies it as Libhandy's successor and
      documents the API changes.
    rel: alternative
    sources:
      - >
        https://gnome.pages.gitlab.gnome.org/libadwaita/doc/1.0/migrating-libhandy-1-4-to-libadwaita.html
      - https://gnome.pages.gitlab.gnome.org/libadwaita/
