history:
  adoption-history:
    - >
      Vimy occupies a deliberately narrow role alongside Viable: Viable creates and
      configures macOS virtual machines, while Vimy opens saved machines with minimal
      overhead. The official sources do not publish adoption figures.
  package-nerd-significance:
    - >
      Vimy is notable as a tiny, single-purpose front end to Apple's Virtualization
      framework. It turns a VM bundle into a Finder-launchable artifact and avoids
      opening a larger management interface for routine starts.
  project-history:
    - >
      Howard Oakley introduced Vimy in August 2023 as a lightweight way to reopen macOS
      virtual machines on Apple silicon with their saved settings. The first public beta
      was numbered 0.4.
    - >
      Vimy was designed around VM bundles produced by the related Viable application. It
      accepts Apple's .bundle format and the custom .vimi extension introduced with
      Viable 1.0.9.
  related-projects:
    - Viable creates and configures the macOS VM bundles that Vimy can launch.
    - Vimy relies on Apple's Virtualization framework and is intended for Apple silicon Macs.
  sources:
    - >
      https://eclecticlight.co/2023/08/17/run-a-macos-vm-on-apple-silicon-from-a-double-click-with-vimy/
    - https://eclecticlight.co/virtualisation-on-apple-silicon/
  summary:
    - >
      Vimy is a minimal Apple-silicon macOS utility that launches saved macOS
      virtual-machine bundles by double-click, drag-and-drop, or its Open command.
  timeline:
    - '2023: Howard Oakley introduced Vimy; its first beta was version 0.4.'
  usage:
    - >
      Users create or save a VM with Viable, optionally give its bundle the .vimi
      extension, associate that extension with Vimy in Finder, and thereafter launch the
      VM by double-clicking it.
    - >
      Settings property lists reside inside individual .bundle or .vimi VM bundles. The
      official web documentation does not give a stable filename or path within those
      bundles, so no precise config-file location is asserted.
