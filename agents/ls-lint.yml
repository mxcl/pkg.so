history:
  adoption-history:
    - >
      The README advertises use by Renovate, Terser, and other projects, and GitHub
      metadata shows roughly 2.4k stars by July 2026. The supplied package-manager facts
      list Homebrew, Nix, and Scoop packages.
    - >
      ls-lint fits the rise of repository hygiene tooling in CI: rather than linting
      code syntax, it makes naming conventions enforceable across folders, generated
      files, fixtures, and language-mixed monorepos.
  package-nerd-significance:
    - >
      ls-lint is notable because it treats the filesystem itself as lintable source. For
      package maintainers and CI users, it is a small binary that enforces repository
      conventions without depending on a specific programming language stack.
  project-history:
    - >
      The official site and README present ls-lint as an extremely fast directory and
      filename linter intended to bring structure to project filesystems. The GitHub
      repository was created in February 2020, and releases show v1.0.0 published in
      March 2020.
    - >
      The project grew into a cross-platform developer tool with documentation versions,
      a GitHub Action, npm distribution, Homebrew packaging, and Docker support. Its
      public docs emphasize minimal setup, Unicode support, and linting thousands of
      files and directories in milliseconds.
  related-projects:
    - >
      Related tooling includes language-specific linters, pre-commit hooks, GitHub
      Actions, Renovate, and repository policy tools that enforce naming or layout
      conventions.
  sources:
    - https://api.github.com/repos/loeffel-io/ls-lint
    - https://api.github.com/repos/loeffel-io/ls-lint/releases?per_page=100
    - https://github.com/loeffel-io/ls-lint
    - https://ls-lint.org/
    - https://raw.githubusercontent.com/loeffel-io/ls-lint/master/README.md
    - source_facts.package-manager
  summary:
    - >
      ls-lint is a file and directory name linter that enforces naming rules from one or
      more `.ls-lint.yml` files.
  timeline:
    - '2020: GitHub repository created and v1.0.0 released.'
    - '2023: v2.0.0 released.'
    - >
      2025: v2.3.x releases published and official docs list 2.3 as the current
      documentation track.
    - >
      2026: Official site copyright spans 2020-2026 and GitHub metadata shows continued
      activity.
  usage:
    - >
      Users place rules in `.ls-lint.yml` and run `ls-lint` locally or in CI. The docs
      and README show YAML rules that map path globs and extensions to naming styles
      such as kebab-case, camelCase, PascalCase, regex rules, and existence checks.
    - >
      No credentials are involved. Configuration is project-local and intentionally
      simple, with the README describing one or multiple `.ls-lint.yml` files.
