history:
  adoption-history:
    - >
      Hedy expanded from iOS to web and native desktop platforms and is described by its
      founder as serving tens of thousands of professionals. Its audience includes
      people using meetings, lectures, interviews, appointments, and coaching
      conversations as sources of actionable notes and guidance.
  package-nerd-significance:
    - >
      Hedy represents the bot-free, local-first branch of AI meeting software. It
      combines on-device transcription with optional local or cloud AI processing, live
      coaching, structured conversation history, API access, webhooks, integrations, and
      an OAuth-authenticated MCP server.
  project-history:
    - >
      Julian Pscheid founded Hedy AI and introduced the product publicly on iOS in July
      2024 as a real-time meeting assistant. Cloud Sync and desktop-browser access
      followed in August 2024, with recap emails, highlights, multilingual features, API
      access, and imports arriving during the following months.
    - >
      Hedy 2.0 introduced a native macOS application in April 2025. Topics, automatic
      suggestions, integrations, and MCP access subsequently broadened it from an
      in-session assistant into a conversation-knowledge and automation platform.
  related-projects:
    - >
      Hedy integrates with automation systems through its REST API, webhooks, MCP
      server, and third-party workflow connectors. Its product category overlaps with
      meeting transcription, note-taking, and real-time coaching services.
  sources:
    - https://hedy.ai/news/
    - https://www.hedy.ai/help/
    - https://www.hedy.ai/post/hedy-ai-mcp-server/
    - https://www.hedy.ai/post/introducing-hedy-ios/
  summary:
    - >
      Hedy AI is a cross-platform, bot-free meeting and conversation coach offering live
      suggestions, transcription, summaries, highlights, and conversation knowledge
      tools.
  timeline:
    - 'July 2024: Hedy launched publicly on iOS.'
    - 'August 2024: Cloud Sync and desktop-browser access were introduced.'
    - 'December 2024: Hedy launched its REST API and webhooks.'
    - 'April 2025: Hedy 2.0 added a native macOS application.'
    - 'May 2025: Hedy introduced an MCP server.'
    - >
      June 2025: Topics and automatic suggestions expanded cross-session knowledge and
      proactive coaching.
    - '2026: Hedy added broader native-platform and local-AI capabilities.'
  usage:
    - >
      Users start Hedy alongside meetings, lectures, interviews, or other conversations
      to receive live contextual suggestions, create on-device transcripts, generate
      recaps and action items, mark highlights, and query past sessions. Users can
      choose local or cloud storage and processing options, subject to platform
      capabilities.
