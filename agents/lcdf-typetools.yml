history:
  adoption-history:
    - >
      LCDF Typetools became part of TeX and Unix font-packaging practice because it
      solved a concrete packaging problem: making OpenType and CFF fonts usable with
      TeX, PostScript, and older Type 1 oriented tools. CTAN describes the bundle as
      utilities for CFF conversion, multiple-master instances, OpenType inspection, TeX
      font metric generation, Type 1 linting, reencoding, and proof output.
    - >
      Package-manager adoption spans Homebrew, Debian, Ubuntu, Fedora or TeX Live
      packaging, MacPorts, Nix, Arch, and openSUSE-style ecosystems, which reflects the
      package's role as small infrastructure for font and TeX maintainers rather than an
      end-user desktop application.
  package-nerd-significance:
    - >
      LCDF Typetools matters to package nerds because it sits at the awkward boundary
      between font formats, TeX packaging, PostScript compatibility, and Unix
      command-line reproducibility. It is the kind of small, sharp toolchain component
      that makes font packages buildable without bundling opaque GUI font software.
    - >
      Its changelog also documents the maintenance reality of font tooling: a steady
      stream of fixes for specific fonts, encodings, TeX integration, compiler behavior,
      and format edge cases over two decades.
  project-history:
    - >
      The LCDF Typetools changelog records version 0.1 on 2003-06-02 as the initial
      release. The package quickly centered on practical OpenType-to-TeX and CFF-to-Type
      1 workflows: early 0.x releases fixed CFF parsing, added contextual substitutions,
      and made `otftotfm` place generated files into a TeX Directory Structure
      hierarchy.
    - >
      The older `mminstance` tools, `mmafm` and `mmpfb`, were folded into LCDF Typetools
      in version 1.50 on 2003-08-20. Later releases continued to track real-world font
      formats and toolchain behavior, including fixes for problematic fonts, TeX map
      handling, C++ build changes, and `otfinfo --var` support for variable fonts in
      version 2.110 on 2023-08-30.
  related-projects:
    - >
      Related projects and standards include TeX Live, CTAN, kpathsea, Adobe Type 1 and
      Compact Font Format, OpenType, TrueType, Ghostscript, and TeX font metric tooling.
  sources:
    - https://ctan.org/pkg/lcdf-typetools?lang=en
    - https://github.com/kohler/lcdf-typetools
    - https://raw.githubusercontent.com/kohler/lcdf-typetools/master/NEWS.md
    - https://raw.githubusercontent.com/kohler/lcdf-typetools/master/ONEWS
    - https://www.lcdf.org/type/
  summary:
    - >
      LCDF Typetools is Eddie Kohler's collection of command-line utilities for
      inspecting and converting PostScript Type 1, Type 1 Multiple Master, OpenType, and
      TrueType fonts. Its best-known tools include `cfftot1`, `otfinfo`, and `otftotfm`.
  timeline:
    - '2003-06-02: Version 0.1 initial release.'
    - >
      2003-06-23: Version 0.8 renamed `otftopl` to `otftotfm` and made TeX Directory
      Structure integration central to automatic mode.
    - >
      2003-08-20: `mminstance` version 1.50 began shipping `mmafm` and `mmpfb` as part
      of LCDF Typetools.
    - '2014-01-08: Version 2.100 included C++11 and compiler-related build updates.'
    - '2023-08-30: Version 2.110 added `otfinfo --var` support for variable fonts.'
  usage:
    - >
      Typical usage is batch-oriented: inspect a font with `otfinfo`, convert a CFF or
      OpenType CFF font with `cfftot1`, generate TeX font metrics and encodings with
      `otftotfm`, lint Type 1 fonts with `t1lint`, or build instances from Type 1
      Multiple Master fonts with `mmafm` and `mmpfb`.
related-packages:
  - id: brew:texlive
    reason: >
      LCDF Typetools' `otftotfm` generates TeX font metrics and encodings, making TeX
      Live the natural downstream environment for typesetting with its generated
      artifacts.
    rel: adjacent_workflow
    sources:
      - https://www.lcdf.org/type/
      - https://www.tug.org/texlive/
  - id: brew:ghostscript
    reason: >
      The official LCDF documentation specifically identifies Ghostscript as a consumer
      of single-master fonts generated by `mmafm` and `mmpfb`.
    rel: adjacent_workflow
    sources:
      - https://www.lcdf.org/type/
      - https://www.ghostscript.com/
