history:
  adoption-history:
    - >
      Framer Studio gained adoption among product designers, including teams at Dropbox,
      Twitter, Microsoft, and Amazon. Framer later found broader demand in simpler
      web-design workflows and pivoted toward building and publishing production
      websites.
    - >
      The current service combines a visual canvas, publishing, CMS, collaboration, and
      desktop applications for macOS and Windows.
  package-nerd-significance:
    - >
      Framer illustrates the shift from installable, code-oriented prototyping tools to
      cloud-backed visual development platforms. The Homebrew cask remains useful for
      managing its desktop shell even though projects and publishing depend on the
      hosted service.
    - >
      Users of older package artifacts should distinguish the current desktop client
      from Framer X and the legacy desktop service, which ceased functioning in 2023.
  project-history:
    - >
      Framer was started in 2015 around high-fidelity design and prototyping. Its early
      Framer Studio product targeted product designers.
    - >
      By 2021, the company saw demand moving toward simpler design methods and
      redirected the product toward designing and publishing real production websites.
      The current desktop application replaced the legacy Framer X-era desktop app in
      April 2021.
  related-projects:
    - Framer Studio
    - Framer X
  sources:
    - https://www.framer.com/blog/series-c/
    - https://www.framer.com/blog/why-designers-should-become-founders/
    - https://www.framer.com/help/
    - https://www.framer.com/help/articles/legacy-framer-desktop/
  summary:
    - >
      Framer evolved from a high-fidelity interaction-prototyping tool into a hosted
      visual platform for designing and publishing production websites.
  timeline:
    - '2015: Framer began as a high-fidelity design and prototyping company.'
    - 'April 2021: The current desktop application replaced the legacy Framer X-era app.'
    - '2021: Framer began its strategic shift toward production website building.'
    - 'March 31, 2023: The legacy Framer Desktop service was discontinued.'
    - '2023: Framer announced a $27 million Series C round.'
  usage:
    - >
      Designers use Framer's canvas to build responsive pages, components, interactions,
      and CMS-backed sites, then publish them through the hosted platform.
    - >
      The desktop application provides a native entry point to the same project
      workflow; shared project URLs can be opened from the app. An internet connection
      and Framer account are central to normal use.
