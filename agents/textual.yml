history:
  adoption-history:
    - >
      Textual was distributed both through the Mac App Store and directly by Codeux. The
      publisher ended new Mac App Store sales in May 2024 while allowing previous
      purchasers to redownload it.
    - >
      The publisher described Textual as a widely used macOS IRC application. Its native
      interface, IRCv3 support, ZNC integration, and extensive customization made it a
      long-running option for Mac IRC users. The project was later sunset, and its
      source repository was archived in 2026.
  package-nerd-significance:
    - >
      Textual joined classic IRC culture with a polished native macOS application and an
      unusually broad extension surface: themes built with CSS, HTML, and JavaScript;
      plugins in Objective-C or Swift; and scripts in AppleScript and several scripting
      languages. Its source availability and Homebrew cask also made it attractive to
      users who preferred reproducible installation over manual downloads.
  project-history:
    - >
      Textual began in 2010 as a fork of LimeChat. Codeux evolved the fork into a
      macOS-focused IRC client with a native interface, modern IRCv3 support,
      certificate authentication, proxies, SASL, notifications, media previews,
      scripting, plugins, and customizable WebKit-based styles.
    - >
      The project reached the Textual 7 generation and maintained a substantial official
      knowledge base and public source repository. Codeux eventually announced that
      Textual had been sunset and would no longer receive updates.
  related-projects:
    - LimeChat is the IRC client from which Textual was forked in 2010.
    - >
      ZNC is an IRC bouncer for which Textual provides dedicated integration and an
      official connection guide.
    - Libera Chat hosts the community support channel referenced after Textual's sunset.
  sources:
    - 'Official knowledge base: https://help.codeux.com/textual/'
    - 'Official product page: https://www.codeux.com/textual/'
    - 'Official scripting guide: https://help.codeux.com/textual/Writing-Scripts.kb'
    - 'Official source repository and README: https://github.com/Codeux-Software/Textual'
    - 'Official styling guide: https://help.codeux.com/textual/Styles.kb'
  summary:
    - >
      Textual is a customizable native IRC client for macOS. Originating as a LimeChat
      fork, it grew into a commercial and source-available client with IRCv3 features,
      scripting, plugins, styles, secure authentication, and bouncer integration before
      being sunset.
  timeline:
    - '2010: Textual began as a fork of LimeChat.'
    - 'Textual 5: The style system gained per-style key-value storage.'
    - >
      Textual 7: The client added a refined modern macOS interface and expanded
      notification controls.
    - 'May 2024: New sales through the Mac App Store ended.'
    - '2026: The project was sunset and its GitHub repository was archived.'
  usage:
    - >
      Users configure IRC networks, servers, identities, channels, SASL or certificate
      authentication, proxies, notifications, and optional ZNC bouncers. Advanced users
      can install scripts, plugins, and WebKit-based styles or use the command reference
      and keyboard-driven interface.
