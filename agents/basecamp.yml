history:
  adoption-history:
    - >
      Basecamp was an early commercial software-as-a-service success. Its founders
      report that roughly a year after launch it generated more revenue than their
      web-design business, prompting the company to focus on the product.
    - >
      The service spread across companies, teams, agencies, and nonprofits as a
      deliberately simpler alternative to heavyweight project-management systems.
      Basecamp states that millions of people have relied on it over its history and
      that its applications are available on the web, macOS, Windows, iOS, Android, and
      the command line.
  package-nerd-significance:
    - >
      Basecamp matters beyond its desktop cask because the product helped establish
      modern web-based project management and subscription software. Its development
      also produced Ruby on Rails, initially created while David Heinemeier Hansson
      built Basecamp.
    - >
      For package managers, the cask is a native desktop shell for a primarily hosted
      service. Installation is local, while projects, messages, files, and account
      identity principally belong to the Basecamp service.
  project-history:
    - >
      Basecamp began in 2003 as an internal project-management tool at the web-design
      firm 37signals. Jason Fried led its design, David Heinemeier Hansson programmed
      it, and the first version was built by a three-person team.
    - >
      Prototypes began in July 2003 and the service launched in February 2004. Clients
      asked to use the internal system, encouraging 37signals to commercialize it. The
      product eventually became more important than the firm's consulting work.
    - >
      Basecamp evolved through several distinct generations while retaining earlier
      versions for existing customers. Basecamp 5 arrived in 2026 with a broad redesign
      and more than one hundred significant improvements.
  related-projects:
    - >
      Ruby on Rails emerged from Basecamp's original development. Other 37signals
      products include HEY and Fizzy; retired or refocused products in the company's
      historical orbit include Backpack and Writeboard.
  sources:
    - 'Official Basecamp 5 page: https://basecamp.com/5'
    - 'Official Shape Up history: https://basecamp.com/shapeup/0.3-chapter-01'
    - 'Official apps page: https://basecamp.com/apps'
    - 'Official company and reliability information: https://basecamp.com/rights'
    - 'Official origin story: https://basecamp.com/about'
  summary:
    - >
      Basecamp is a project-management and team-collaboration service launched by
      37signals in 2004, with native desktop applications complementing its web service.
  timeline:
    - '2003: 37signals begins building Basecamp for its own client projects.'
    - 'February 2004: Basecamp launches commercially.'
    - >
      2005: Basecamp's revenue overtakes the founders' web-design business around a year
      after launch.
    - >
      2026: Basecamp 5 launches with a major redesign and more than one hundred
      significant improvements.
  usage:
    - >
      Teams use Basecamp to organize projects around to-dos, message boards, schedules,
      documents, files, group chat, notifications, and client collaboration. The macOS
      application provides a standalone desktop experience for the hosted service.
    - >
      A Basecamp account is required for account-backed work, but no official local
      credentials-file path is documented. Configuration and service data should be
      managed through the application and account interfaces.
