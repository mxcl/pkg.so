config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README supports installation from Python packaging with `pip3 install
      gptline`, while the supplied metadata records a Homebrew formula. This gives the
      niche client both Python-native and system-package installation paths.
  package-nerd-significance:
    - >
      gptline captures the early post-ChatGPT pattern of wrapping a hosted model API in
      a focused Unix command. Its small Python package, console entry point, local
      SQLite history, environment-based credentials, and Homebrew availability make it a
      useful snapshot of that packaging moment.
  project-history:
    - >
      The official GitHub repository was created in September 2023, during the first
      large wave of small ChatGPT terminal clients. The project uses Python packaging
      and has no GitHub release series; its README and source tree are the primary
      public record.
    - >
      Its implementation stores conversations and settings in a local SQLite database
      while reading an OpenAI API key from `OPENAI_API_KEY` or the legacy `OPENAI_KEY`
      environment variable.
  related-projects:
    - OpenAI GPT models provide the remote chat service used by gptline.
    - iTerm2 supplies the terminal marks that gptline uses for message navigation.
  sources:
    - https://github.com/gnachman/gptline
    - https://github.com/gnachman/gptline#readme
    - https://github.com/gnachman/gptline/blob/main/src/db.py
    - https://github.com/gnachman/gptline/blob/main/src/main.py
    - source_facts.package-manager
  summary:
    - >
      gptline is George Nachman's Python command-line ChatGPT client, designed around
      multi-line terminal conversations, searchable history, prompt editing, response
      regeneration, and iTerm2 marks.
  timeline:
    - >
      2023: The official GitHub repository is created and gptline is published as a
      Python terminal client.
    - >
      2023–2024: The client gains conversation search, editing, regeneration, and
      terminal-oriented interaction.
    - '2020s: Homebrew adds a packaged installation route alongside pip.'
  usage:
    - >
      After setting an OpenAI API-key environment variable, users run `gptline` to enter
      the interactive client. It supports multiple conversations, full-text search,
      editing and regenerating messages, and iTerm2 marks for moving between messages;
      `Ctrl+C` exits.
related-packages:
  - id: brew:llm
    reason: >
      Choose LLM when you need a maintained, plugin-based terminal client that supports
      multiple hosted and local model providers, embeddings, templates, tools, and
      SQLite logging instead of gptline's focused OpenAI chat interface.
    rel: alternative
    sources:
      - https://github.com/gnachman/gptline#readme
      - https://llm.datasette.io/en/stable/
  - id: brew:chatblade
    reason: >
      Choose Chatblade for a ChatGPT-oriented Unix-filter workflow with piped input,
      named sessions, prompt files, and structured-output extraction; choose gptline for
      its interactive multi-line UI and iTerm2 navigation.
    rel: alternative
    sources:
      - https://github.com/gnachman/gptline#readme
      - https://github.com/npiv/chatblade#readme
