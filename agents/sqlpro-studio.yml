history:
  adoption-history:
    - >
      SQLPro Studio is distributed for macOS, iOS/iPadOS, and Windows; the input records
      its macOS distribution through the Homebrew sqlpro-studio cask.
  package-nerd-significance:
    - >
      Its appeal is a native, multi-engine database client without a Java or Electron
      runtime, especially for developers who want one GUI across local, remote, and
      cloud-hosted relational databases.
  project-history:
    - >
      SQLPro Studio developed as the broader multi-database member of the SQLPro family,
      combining native desktop and mobile clients with support for several major SQL
      engines.
  related-projects:
    - >
      SQLPro for SQLite is the focused SQLite companion product. Supported systems
      include MySQL, MariaDB, PostgreSQL, Microsoft SQL Server, SQLite, Oracle,
      Snowflake, Amazon Redshift, and their managed-cloud variants.
  sources:
    - 'Official FAQ: https://www.sqlprostudio.com/faq/'
    - 'Official downloads page: https://www.sqlprostudio.com/downloads'
    - 'Official features page: https://www.sqlprostudio.com/features'
    - 'Official homepage: https://www.sqlprostudio.com/'
  summary:
    - SQLPro Studio is a commercial native database client for macOS, iOS/iPadOS, and Windows.
  timeline:
    - >
      Current product: Distributed as native applications for Apple platforms and
      Windows, including a Homebrew cask on macOS.
  usage:
    - >
      Developers, DBAs, and analysts use it to connect to local or remote SQL databases,
      write and autocomplete queries, manage database objects, import data, export
      results, use SSH tunnels and TLS, and work with cloud-hosted database services.
