history:
  adoption-history:
    - >
      Garmin reported more than 29 million Connect IQ app downloads across nearly five
      million compatible devices by April 2017. In 2019, it reported more than 90
      million downloads across over ten million devices, indicating substantial adoption
      within Garmin's wearable ecosystem.
  package-nerd-significance:
    - >
      Connect IQ is notable as a vendor SDK distributed outside conventional language
      package registries. Homebrew Cask makes the macOS SDK and simulator easier to
      install reproducibly, while development itself revolves around Garmin's Monkey C
      language, Toybox APIs, device profiles, and constrained wearable hardware.
  project-history:
    - >
      Garmin announced Connect IQ in September 2014 as an open platform for third-party
      applications on Garmin wearables, with availability planned for select devices in
      2015. The SDK emphasized low power use and access to GPS, Bluetooth Low Energy,
      ANT+, sensors, and smartphone connectivity.
    - >
      The platform grew beyond watches to compatible cycling computers and outdoor
      devices. Garmin subsequently organized the APIs into numbered SDK/API generations
      and Connect IQ system generations while expanding graphics, language,
      background-processing, and device capabilities.
  related-projects:
    - >
      Monkey C is the programming language used for Connect IQ applications, while
      Toybox is its device API namespace. Garmin's Connect IQ Store distributes watch
      faces, applications, widgets, and data fields built with the SDK.
  sources:
    - https://developer.garmin.com/connect-iq/connect-iq-basics/your-first-app/
    - https://developer.garmin.com/connect-iq/core-topics/
    - https://www.garmin.com/en-US/blog/featured-2/garmin-connect-iq-developers-summit/
    - >
      https://www.garmin.com/en-US/newsroom/press-release/outdoor/2014-introducing-connect-iq-the-first-ever-open-platform-for-garmin-wearables/
    - >
      https://www.garmin.com/it-IT/newsroom/garmin-connect-iq-store-disponibile-per-il-download-dalle-piattaforme-android-e-ios/
  summary:
    - >
      Garmin Connect IQ is an SDK and application platform for extending compatible
      Garmin wearables, cycling computers, and outdoor devices. Developers build watch
      faces, applications, widgets, and data fields, commonly using Monkey C and
      Garmin's Toybox APIs.
  timeline:
    - '2014: Garmin announced Connect IQ and released developer-preview materials.'
    - '2015: Connect IQ became available for select Garmin wearables.'
    - >
      2017: Garmin reported more than 29 million app downloads and held its first
      Connect IQ Developer Summit.
    - '2019: Garmin reported more than 90 million downloads across over ten million devices.'
    - >
      2021: Connect IQ System 4 introduced new graphics facilities, a new Monkey C type
      system, and Super Apps.
  usage:
    - >
      Developers create a Connect IQ project, select compatible target devices and a
      minimum API level, implement Monkey C source and resources, and build or run it
      with Garmin's simulator tooling. Device builds produce PRG files that can be
      side-loaded into a connected device's GARMIN/APPS directory.
    - >
      A typical project contains source and resource directories plus manifest.xml,
      which records application identity, type, permissions, and supported products.
      Applications can use Garmin-provided APIs for sensors, activities, graphics,
      networking, storage, and communication with companion mobile applications.
