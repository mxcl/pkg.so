history:
  adoption-history:
    - >
      The batch metadata lists Homebrew and Nix packaging. That is narrow adoption, but
      it is meaningful for a niche board-game tool because it keeps an otherwise
      SourceForge-era Java utility installable from modern package managers.
  package-nerd-significance:
    - >
      Its package-nerd interest is mostly archival and interoperability-oriented: it
      packages a small Java GUI from the computer-Hex ecosystem, preserving access to a
      tool associated with Benzene/MoHex-style engine workflows.
  project-history:
    - >
      The SourceForge tree identifies the project as benzene/hexgui, marks it beta, and
      credits Broderick Arneson and Markus Enzenberger. The README is intentionally
      terse: build with ant and run bin/hexgui.
    - >
      The file history visible on SourceForge places key files in the 2010-2014 range,
      including the README dated 2010-02-26 and source-tree updates through 2014.
  related-projects:
    - >
      Related projects include Benzene, MoHex, Wolve, and other Hex engines or research
      tools that can be driven from a GUI.
  sources:
    - >
      GitHub mirror metadata identifies the apetresc/hexgui repository as a mirror of
      benzene/hexgui.
    - Input package-manager facts supply the Homebrew and Nix package presence.
    - >
      SourceForge project tree supplies the project name, beta status, credited
      maintainers, file dates, and README usage.
  summary:
    - >
      hexgui is a Java GUI for the board game Hex, packaged as the graphical side of the
      Benzene/Hex tooling world and built around running Hex games and engines from a
      desktop interface.
  timeline:
    - '2010: README and TODO files appear in the SourceForge tree.'
    - >
      2011: Wrapper, Windows launcher, license, and build-file updates appear in the
      SourceForge tree.
    - '2014: Source updates include adding 15x15 to the list of board sizes.'
    - '2016: A GitHub mirror of benzene/hexgui is created under apetresc/hexgui.'
  usage:
    - >
      hexgui is used as a GUI for playing or analyzing Hex games, commonly in relation
      to engines that speak Hex or Go Text Protocol-style command protocols.
related-packages:
  - id: brew:fuego
    reason: >
      Fuego is useful in the adjacent Benzene/MoHex development workflow: official
      Benzene documentation says its Monte Carlo Hex player links against Fuego's UCT
      search classes, while HexGui supplies the graphical Hex front end.
    rel: adjacent_workflow
    sources:
      - https://sourceforge.net/projects/benzene/
      - https://benzene.sourceforge.net/benzene-doc/html/mohexmainpage.html
      - https://fuego.sourceforge.net/
