id: brew:gws
display-name: gws
repo: null
docs:
  - https://github.com/StreakyCobra/gws#readme
  - https://streakycobra.github.io/gws
config-file-location:
  unix:
    - ./.projects.gws
    - ./.ignore.gws
    - ./.git/theme.gws
    - ~/.theme.gws
    - ~/.config/gws/theme
credentials-file-location: null
history:
  adoption-history:
    - >
      gws reached users through lightweight packaging and shell-script distribution. The
      README lists Arch Linux AUR, openSUSE packaging, manual PATH installation, and
      macOS caveats around Bash and GNU userland tools; Homebrew and MacPorts packaging
      later made it visible in macOS package catalogs.
    - >
      The repository shows moderate interest for a shell utility, with hundreds of stars
      by 2026. Its audience is developers who keep multiple Git checkouts in one
      workspace and prefer a versioned manifest over submodules, monorepo tooling, or a
      heavier project manager.
  package-nerd-significance:
    - >
      gws is package-nerd interesting because it treats a developer's checkout forest as
      data: a tiny manifest can reconstruct an entire workspace without committing
      nested repositories as submodules. It is also a case study in a Bash tool that
      intentionally avoids destructive repository management, leaving pulls, pushes, and
      deletions mostly to the user.
  project-history:
    - >
      The public GitHub repository was created on 2014-01-09. The README explains the
      origin plainly: the author worked across several computers with many Git
      repositories under a development workspace, found Git submodules unsuitable
      because they pin specific commits, and wrote a small Bash script to clone
      repositories from a simple list.
    - >
      The script grew from that small clone helper into a workspace monitor and
      synchronizer. Its README says the project was started by Fabien Dubosson and later
      maintained by Emil Lundberg, while staying intentionally simple and portable.
  related-projects:
    - 'git: gws organizes and operates on many Git repositories.'
    - >
      peru: README points users to peru as another tool for keeping files from different
      sources up to date.
    - >
      Git submodules: README explains why submodules did not fit the author's
      branch-following workspace use case.
  sources:
    - https://api.github.com/repos/StreakyCobra/gws
    - https://api.github.com/repos/StreakyCobra/gws/releases?per_page=100
    - https://github.com/StreakyCobra/gws
    - https://raw.githubusercontent.com/StreakyCobra/gws/master/README.md
    - https://streakycobra.github.io/gws
  summary:
    - >
      gws is a Bash helper for managing workspaces made of many Git repositories. The
      project describes itself as a KISS, colorful helper that keeps a simple list of
      repositories and can clone, check, fetch, fast-forward, and report workspace
      status.
  timeline:
    - '2014-01-09: Public GitHub repository created.'
    - '2015-02-12: GitHub release 0.1.5 published.'
    - '2017: Several 0.1.x releases published, including 0.1.16 on 2017-08-17.'
    - '2018-04-24: GitHub release 0.2.0 published.'
    - '2020-02-28: Repository metadata records later activity in the project.'
  usage:
    - >
      The core file is .projects.gws, one project per line, mapping folder paths to one
      or more Git remotes. gws init can detect existing repositories and create that
      list, gws update clones missing repositories, gws clone selects individual
      projects, gws status reports repository states, gws fetch downloads remote
      changes, gws ff performs fast-forward updates, and gws check finds known, unknown,
      ignored, and missing repositories.
    - >
      .ignore.gws lets users locally skip projects from a shared workspace list. Theme
      scripts can be loaded from ./.git/theme.gws, ~/.theme.gws, or ~/.config/gws/theme;
      the README deliberately avoids loading themes from the project manifest directory
      because a synced repository could otherwise inject shell code.
related-packages:
  - id: brew:git-workspace
    reason: >
      Choose git-workspace when repositories should be discovered and reconciled from
      GitHub, GitLab, or Gitea provider rules; choose gws for a small, explicitly
      versioned repository manifest.
    rel: alternative
    sources:
      - https://streakycobra.github.io/gws/
      - https://github.com/orf/git-workspace#readme
  - id: brew:peru
    reason: >
      Use peru alongside or instead of gws when the workflow must pin and materialize
      selected files from Git, Mercurial, Subversion, or archives rather than manage
      full working repositories.
    rel: adjacent_workflow
    sources:
      - https://streakycobra.github.io/gws/
      - https://github.com/buildinspace/peru#readme
