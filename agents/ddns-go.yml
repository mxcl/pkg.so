id: brew:ddns-go
display-name: DDNS-GO
repo: null
docs:
  - https://github.com/jeessy2/ddns-go/wiki
  - https://github.com/jeessy2/ddns-go/blob/master/README_EN.md
config-file-location:
  unix:
    - ~/.ddns_go_config.yaml
credentials-file-location:
  unix:
    - ~/.ddns_go_config.yaml
history:
  adoption-history:
    - >
      DDNS-GO's adoption is strongest in self-hosting and homelab use, where users need
      a packaged updater for residential or changing IP addresses. Its release stream
      moved quickly through the 5.x and 6.x series, and the project distributes through
      GitHub releases, Docker images, Homebrew, Nix, and Scoop-style package channels.
  package-nerd-significance:
    - >
      DDNS-GO matters to package nerds because it turns a classically cron-and-script
      networking chore into a single packaged daemon with a web UI and provider
      adapters. Its configuration file is both operational state and credential storage,
      so packagers and users care about service paths, mount points, and upgrade
      behavior.
  project-history:
    - >
      The GitHub repository was created in 2020, with v0.0.1 released later that year.
      The official README frames the project around simple web-based configuration,
      multi-provider DNS support, service installation, Docker use, webhooks, callbacks,
      and a default five-minute sync interval.
  related-projects:
    - >
      Supported DNS providers include Aliyun, Tencent Cloud, Dnspod, Cloudflare, Huawei
      Cloud, Baidu Cloud, Porkbun, GoDaddy, Namecheap, NameSilo, and others listed in
      the README.
    - Docker and GHCR images are official deployment surfaces for self-hosted use.
    - >
      Webhook and callback integrations are official extension points for notifications
      and custom DNS-provider behavior.
  sources:
    - https://github.com/jeessy2/ddns-go
    - https://github.com/jeessy2/ddns-go/blob/master/README_EN.md
    - https://github.com/jeessy2/ddns-go/releases
  summary:
    - >
      DDNS-GO is a self-hosted dynamic DNS updater written in Go. It automatically
      obtains public IPv4 or IPv6 addresses and updates DNS provider records, with a web
      UI, service mode, Docker deployment, and support for many DNS providers.
  timeline:
    - '2020: Public GitHub repository created.'
    - '2020: DDNS-GO v0.0.1 released.'
    - '2023: DDNS-GO v5.0.0 released.'
    - '2026: DDNS-GO v6.17.1 released.'
  usage:
    - >
      Typical package usage is to install the binary as a Mac, Linux, or Windows
      service, open the local web UI on port 9876 for initial configuration, and store
      provider credentials in the YAML configuration file. Docker users mount a host
      directory and run the container with host networking or an exposed web port.
related-packages:
  - id: brew:ddclient
    reason: >
      Choose ddclient when you prefer a long-established Unix daemon configured through
      a text file and need its broad provider and router-address discovery support
      instead of a web UI.
    rel: alternative
    sources:
      - https://github.com/jeessy2/ddns-go/blob/master/README_EN.md
      - https://ddclient.net/
      - https://github.com/ddclient/ddclient
  - id: brew:inadyn
    reason: >
      Choose Inadyn for a small C-based DDNS daemon suited to routers and embedded
      gateways where DDNS-GO's web interface is unnecessary.
    rel: alternative
    sources:
      - https://github.com/jeessy2/ddns-go/blob/master/README_EN.md
      - https://troglobit.com/projects/inadyn/
      - https://github.com/troglobit/inadyn
