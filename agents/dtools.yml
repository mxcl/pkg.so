history:
  adoption-history:
    - >
      The tools are adopted as part of the D language toolchain rather than as a
      standalone end-user application. Homebrew, Debian/Ubuntu, Alpine, Arch, Nix, and
      other package systems expose some or all of these utilities, with Debian-family
      packages especially focusing on DustMite.
  package-nerd-significance:
    - >
      dtools is interesting because it is not one app: it is a grab bag of
      language-maintainer utilities that package managers have to present as a coherent
      formula. It also preserves older D workflow habits, such as single-file execution
      with `rdmd` and minimization with DustMite, in a single installable package.
  project-history:
    - >
      The dlang/tools repository was created in 2011 and describes itself as hosting
      tools redistributed with DMD or used internally for D build tasks. The public
      tools table includes a D symbol demangler, the `rdmd` build/run helper, and
      DustMite, a test-case minimization tool.
  related-projects:
    - >
      Closely related projects include DMD, DUB, the D language website, the D wiki's
      development-tools index, and the original DustMite documentation.
  sources:
    - https://github.com/dlang/tools
    - https://dlang.org/rdmd.html
    - https://wiki.dlang.org/Development_tools
    - https://formulae.brew.sh/api/formula/dtools.json
  summary:
    - >
      dtools is the Homebrew packaging name for the D language's ancillary tools
      repository. It packages command-line utilities around the D compiler ecosystem,
      most visibly `rdmd`, `dustmite`, and `ddemangle`.
  timeline:
    - '2011: Public dlang/tools GitHub repository created.'
    - '2010s: Repository becomes the home for DMD-redistributed and internal D build tools.'
    - >
      2020s: Homebrew formula tracks dlang/tools release tags and installs public tools
      such as `ddemangle`, `dustmite`, and `rdmd`.
  usage:
    - >
      `rdmd` is used to compile and run D source files with dependency tracking,
      `ddemangle` decodes D symbol names, and `dustmite` reduces failing source trees or
      test cases. The upstream README also documents building all tools with `make all`
      or individual tools with DUB.
related-packages:
  - id: brew:dub
    reason: >
      DUB is the D package and build manager, and the D Tools repository directly
      documents using it to build and run individual tool subpackages.
    rel: adjacent_workflow
    sources:
      - https://github.com/dlang/tools#using-dub-as-a-build-tool
      - https://dub.pm/
  - id: brew:dfmt
    reason: >
      dfmt formats D source before it is compiled or exercised with tools such as rdmd,
      making it a focused companion for maintaining D code.
    rel: adjacent_workflow
    sources:
      - https://wiki.dlang.org/Development_tools
      - https://github.com/dlang-community/dfmt
  - id: brew:dscanner
    reason: >
      D-Scanner adds static analysis and style checks to the compile, run, and
      failure-reduction workflow supplied by D Tools.
    rel: adjacent_workflow
    sources:
      - https://wiki.dlang.org/Development_tools
      - https://github.com/dlang-community/D-Scanner
  - id: brew:dcd
    reason: >
      DCD provides editor autocompletion for D projects, complementing D Tools'
      command-line build, symbol, and test-reduction utilities.
    rel: adjacent_workflow
    sources:
      - https://wiki.dlang.org/Development_tools
      - https://github.com/dlang-community/DCD
