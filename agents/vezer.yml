history:
  adoption-history:
    - >
      Vezér grew from a MIDI-and-OSC controller aimed at audiovisual performance into a
      broader show-control sequencer supporting DMX, Art-Net, audio-derived automation,
      cues, synchronization, and import/export workflows. Imimot's official tutorials
      document integrations with tools such as CoGe, Resolume, Modul8, MadMapper, VDMX,
      and TouchOSC.
    - >
      The official changelog shows sustained macOS maintenance across Intel and
      Apple-silicon generations, including a Universal Binary in 2021 and later
      compatibility and reliability updates.
  package-nerd-significance:
    - >
      Vezér occupies the junction between media software and control protocols: it makes
      MIDI, OSC, DMX, and Art-Net automation editable on one visual timeline. It is
      especially relevant to audiovisual installations and live-production setups where
      repeatable timing and interoperability matter more than conventional media
      editing.
  project-history:
    - >
      Imimot began developing Vezér near the end of 2012 and released it on July 24,
      2013 as a timeline-oriented control application supporting MIDI and OSC. Version
      1.1 followed in October 2013 with audio tracks, MIDI Clock synchronization, and
      recording of incoming OSC.
    - >
      Later releases expanded its role from VJ control into general audiovisual and
      lighting automation, adding cues, DMX and Art-Net facilities, richer track types,
      synchronization, and production-oriented import and export features.
  related-projects:
    - >
      Vezér commonly controls or synchronizes media and VJ software through MIDI and
      OSC, while lighting systems can be driven through DMX and Art-Net.
    - Imimot's related products include CoGe and Mitti.
  sources:
    - 'Official Vezér Help: https://imimot.com/help/vezer'
    - 'Official changelog: https://imimot.com/help/vezer/changelog'
    - 'Official launch announcement: https://imimot.com/blog/say-hello-to-vezer'
    - 'Official product page: https://imimot.com/vezer'
  summary:
    - >
      Vezér is a native macOS timeline sequencer for MIDI, OSC, DMX, Art-Net, cues,
      audio-derived control data, and synchronization. It is designed for audiovisual
      artists, installations, lighting rigs, and show-control environments.
  timeline:
    - '2012: Development began near the end of the year.'
    - '2013-07-24: Vezér was publicly released with MIDI and OSC support.'
    - '2013-10-09: Version 1.1 added audio, synchronization, and OSC recording.'
    - '2021-11-02: Version 1.9 became a Universal Binary with native Apple-silicon support.'
  usage:
    - >
      Users construct compositions from tracks, keyframes, curves, markers, and cues,
      then send timed control data to musical devices, media servers, lighting rigs, or
      custom systems.
    - >
      Vezér can operate as a timing source or follow external transport. It can record
      incoming MIDI, OSC, or DMX data, derive control curves from audio, and exchange
      MIDI, JSON, XML, color, and composition data with other production tools.
