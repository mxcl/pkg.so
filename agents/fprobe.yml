history:
  adoption-history:
    - >
      The official SourceForge project remains the download and file-release surface,
      with release archives from 2002 through 2005 and a project page listing ongoing
      downloads. Its homepage pairs fprobe with fprobe-ulog, a Linux-only libipulog fork
      for iptables ULOG packet capture.
  package-nerd-significance:
    - >
      fprobe is a compact example of early-2000s Unix network-monitoring packaging: a
      small C daemon, libpcap dependency, man page, init-script contribution, and
      SourceForge tarball releases. It matters historically as a bridge between packet
      capture tools and NetFlow collectors before flow export was routine in commodity
      monitoring stacks.
  project-history:
    - >
      The SourceForge project was registered on 2002-09-27. The ChangeLog in the
      official 1.1 source archive records fprobe 0.8 on 2002-10-25 as the first public
      release, with partial NetFlow 1, 5, and 7 support and builds tested on Linux,
      FreeBSD, and Solaris on x86.
    - >
      The 2002 and 2003 releases moved quickly toward production daemon behavior:
      performance-oriented rewrites, larger hash tables, memory controls, realtime
      scheduling, SNMP interface index workarounds, TCP flags, daemonization, syslog
      logging, pidfiles, tcpdump file input, multiple collectors, and manpage updates.
      Version 1.1 in 2005 included bug fixes, feature enhancement, and a default hash
      change related to algorithmic-complexity DoS hardening.
  related-projects:
    - >
      The homepage describes fprobe-ulog as a libipulog-based fork for Linux netfilter
      ULOG capture. The README also points to nProbe, a namesake fprobe project by
      Bogdan Surdu, Softflowd, Cisco NetFlow resources, and network-monitoring link
      collections.
  sources:
    - https://fprobe.sourceforge.net/
    - https://sourceforge.net/projects/fprobe/
    - https://sourceforge.net/projects/fprobe/files/fprobe/1.1/fprobe-1.1.tar.bz2/download
    - https://sourceforge.net/projects/fprobe/rss?path=/
  summary:
    - >
      fprobe is a libpcap-based NetFlow probe. Its official homepage and README describe
      a tool that collects network traffic data and emits it as NetFlow records to a
      configured collector.
  timeline:
    - '2002: SourceForge project registered.'
    - '2002: fprobe 0.8 first public release.'
    - '2002: fprobe 0.90 focused on performance improvements.'
    - >
      2003: fprobe 1.0 was released with changed filter behavior, option -K, and manpage
      updates.
    - >
      2004: fprobe 1.0.5 changed the default tool location to /usr/sbin and moved the
      man page to section 8.
    - >
      2005: fprobe 1.1 was released with bug fixes, feature enhancement, and default
      hash hardening.
  usage:
    - >
      fprobe runs as a system-oriented command that captures from a libpcap interface or
      from tcpdump -w data on stdin, applies an optional tcpdump-style filter, tracks
      flows, and sends NetFlow to one or more remote collectors. Its man page documents
      interface selection, filters, timers, NetFlow version selection, source address,
      queue and memory limits, realtime priority, chroot/user options, and collector
      syntax.
