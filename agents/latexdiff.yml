history:
  adoption-history:
    - >
      latexdiff became a standard utility in academic and technical writing because
      journals, supervisors, and collaborators often request visible revisions, while
      LaTeX source files do not map naturally to word-processor track changes. CTAN, TeX
      Live, MiKTeX, Homebrew, Debian, MacPorts, and Ubuntu packaging made it easy to add
      to authoring workflows.
    - >
      The ecosystem around it includes wrapper scripts and front ends such as
      git-latexdiff, latexdiffr, latexdiffcite, and browser/WebAssembly interfaces,
      reflecting the same need across Git, R Markdown, BibTeX, and web-based workflows.
  package-nerd-significance:
    - >
      latexdiff is package-nerd significant because it is small, scriptable, and solves
      a workflow problem that version-control diffs do not solve for human reviewers: a
      compiled PDF showing semantic document changes.
    - >
      It is also a classic example of a package that glues together language tooling,
      version control, and publishing conventions without needing a GUI.
  project-history:
    - >
      CTAN identifies latexdiff as a package for determining and marking up significant
      differences between LaTeX files, with Frederik J. Tilmann as maintainer and
      copyright beginning in 2004. The main script header likewise names F J Tilmann and
      points to CTAN and the GitHub repository.
    - >
      The project expanded beyond the core `latexdiff` script to include `latexrevise`,
      which can accept or reject changes, and `latexdiff-vc`, a wrapper for
      version-control systems. The `latexdiff-vc` script records support for systems
      such as CVS, RCS, SVN, Git, and Mercurial, with Git support appearing in its 1.0.1
      history.
    - >
      The GitHub repository was created on 2014-06-17. CTAN lists the package in TeX
      Live and MiKTeX and records the 2026-01-02 package version date.
  related-projects:
    - >
      Related projects include latexrevise, latexdiff-vc, git-latexdiff, latexdiffr,
      latexdiffcite, latexchanges, TeX Live, MiKTeX, Git, Subversion, Mercurial, and
      Algorithm::Diff.
  sources:
    - https://api.github.com/repos/ftilmann/latexdiff
    - https://api.github.com/repos/ftilmann/latexdiff/tags?per_page=20
    - https://ctan.org/pkg/latexdiff?lang=en
    - https://raw.githubusercontent.com/ftilmann/latexdiff/master/README.md
    - https://raw.githubusercontent.com/ftilmann/latexdiff/master/latexdiff
    - https://raw.githubusercontent.com/ftilmann/latexdiff/master/latexdiff-vc
  summary:
    - >
      latexdiff is a Perl tool for comparing two LaTeX files and producing a marked-up
      LaTeX file that shows significant textual changes. It fills the same social role
      for LaTeX authors that track changes fills in word processors.
  timeline:
    - '2004: Copyright range begins for the main latexdiff script.'
    - '2005: latexdiff-vc copyright range begins.'
    - '2014-06-17: GitHub repository created.'
    - '2018-10-07: latexdiff-vc 1.3.0 records an `--only-changes` option.'
    - '2026-01-02: CTAN package version date for latexdiff 1.4.0.'
  usage:
    - >
      The typical command compares an old and a new `.tex` file and emits a new LaTeX
      file with inserted and deleted text marked using standard LaTeX packages. Users
      then compile the generated file to inspect revisions, or use `latexrevise` and
      `latexdiff-vc` for accepting changes or comparing version-control revisions.
related-packages:
  - id: brew:git
    reason: >
      Git works with the bundled `latexdiff-vc` wrapper to compare historical revisions
      of a LaTeX document without manually exporting both source versions.
    rel: adjacent_workflow
    sources:
      - https://github.com/ftilmann/latexdiff/blob/master/latexdiff-vc
      - https://git-scm.com/docs
  - id: brew:latexindent
    reason: >
      latexindent.pl explicitly recommends using latexdiff to inspect whether a
      formatting pass changed document content, making the two tools complementary in a
      safe LaTeX cleanup workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/cmhughes/latexindent.pl#readme
      - https://www.ctan.org/pkg/latexdiff?lang=en
