credentials-file-location: null
history:
  adoption-history:
    - >
      BeLight Software says the application has evolved into a product enjoyed by
      millions of people. It expanded beyond macOS to iPhone, iPad, Windows, Android,
      and visionOS while retaining compatible project formats across platforms.
    - >
      Its audience spans homeowners planning renovations, interior-design enthusiasts,
      and users who need accessible 2D drafting and real-time 3D visualization without a
      professional CAD workflow.
  package-nerd-significance:
    - >
      Live Home 3D is notable as a long-lived consumer design application that combines
      native Mac document formats with cross-platform compressed projects. Package users
      should preserve its Application Support directory because it contains custom
      templates, objects, and materials.
  project-history:
    - >
      Product owner Dmytro Yunchyk brought his home-design application idea to BeLight
      Software in 2005, aiming to make architectural planning approachable to ordinary
      homeowners.
    - >
      The first version shipped in 2007 under the name Live Interior 3D. It later
      evolved into Live Home 3D, adding exterior design, rendering, augmented reality,
      room scanning, and implementations across desktop and mobile platforms.
  related-projects:
    - Live Interior 3D was the product's original name.
    - Live Home 3D Pro is a separate edition with additional professional features.
    - >
      The application can import formats from tools and ecosystems such as SketchUp and
      Sweet Home 3D.
  sources:
    - 'Official FAQ: https://www.livehome3d.com/support/faq/'
    - 'Official Mac help: https://www.livehome3d.com/support/help/mac/en/'
    - 'Official product site: https://www.livehome3d.com/'
    - >
      Official project history:
      https://www.livehome3d.com/useful-articles/a-story-behind-live-home-3d
  summary:
    - >
      Live Home 3D is BeLight Software's cross-platform application for drafting floor
      plans, furnishing interiors, designing exteriors, and producing interactive or
      rendered 3D visualizations.
  timeline:
    - '2005: Dmytro Yunchyk joined BeLight Software with the home-design application idea.'
    - '2007: The first release shipped as Live Interior 3D.'
    - >
      Later: The product evolved into Live Home 3D and expanded across desktop, mobile,
      and spatial-computing platforms.
    - >
      2025: The official project story described continued development and adoption by
      millions of users.
  usage:
    - >
      Users draw or import floor plans, construct walls and roofs, arrange furniture and
      materials, configure lighting, and move between 2D plans and interactive 3D views.
    - >
      Mac projects can be saved as native .lh3d bundles or compressed .lhzd files. The
      compressed format is convenient for sharing and for storage on non-Mac
      filesystems.
