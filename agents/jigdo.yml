history:
  adoption-history:
    - >
      jigdo's most visible adoption came from Debian installation media. The official
      page states that Debian and other users released ISO images in the MD5-based v1.x
      format from around 2004 through late 2023, and that Debian switched trixie jigdo
      files to SHA256-based v2 format in October 2023.
    - >
      It remains packaged in Debian, Ubuntu, Homebrew, MacPorts, Nix, Fedora, and other
      systems because it solves a distribution problem that ordinary direct downloads
      and mirrors do not: large image reconstruction without forcing every mirror to
      host every generated image as a monolithic file.
  package-nerd-significance:
    - >
      jigdo is historically important package-distribution infrastructure. It represents
      a pre-container, pre-cloud answer to the same problem package systems still face:
      how to distribute large reproducible artifacts efficiently from existing package
      pools.
    - >
      The 2023 SHA256 v2 transition is especially package-nerdy because it shows a
      long-lived file format migrating away from MD5 while maintaining compatibility
      behavior for older tools and older release media.
  project-history:
    - >
      Richard Atterer originally designed jigdo and wrote the first implementation.
      Steve McIntyre's official page says maintenance later passed to him, with
      development tracked in the git.einval.com repository.
    - >
      The original jigdo format used MD5 checksums for both file matches and full-image
      tracking. McIntyre extended the code with a v2 format in jigdo 0.8.0, replacing
      the internal checksum basis with SHA256 while preserving version handling for
      jigdo and template files.
  related-projects:
    - >
      jigit and libjte are Steve McIntyre's related reimplementation of a subset of
      jigdo features.
    - genisoimage historically included support for generating jigdo files beside ISO images.
    - xorriso uses libjte to generate jigdo files for ISO-image workflows.
  sources:
    - https://formulae.brew.sh/formula/jigdo
    - https://git.einval.com/cgi-bin/gitweb.cgi?p=jigdo.git;a=summary
    - https://tracker.debian.org/pkg/jigdo
    - https://www.einval.com/~steve/software/JTE/
    - https://www.einval.com/~steve/software/jigdo/
  summary:
    - >
      jigdo, short for Jigsaw Download, is a tool for distributing very large files by
      reconstructing them from pieces already available on mirrors. It is best known for
      Debian CD and DVD image distribution.
  timeline:
    - >
      2004: Debian and other users began releasing ISO images using the MD5-based jigdo
      v1.x format around this period.
    - '2023: Jigdo 0.8.2 was released.'
    - '2023: Debian trixie jigdo files switched to SHA256-based v2 format.'
    - >
      2025: Steve McIntyre's jigdo page recorded the git.einval.com repository as the
      source-code home.
  usage:
    - >
      `jigdo-lite` is the user-facing downloader for reconstructing an image from a
      `.jigdo` file and a matching template. `jigdo-file` creates and inspects
      jigdo/template data, while `jigdo-mirror` supports mirror-oriented workflows.
    - >
      The tool is used when large release images can be assembled from files that
      already exist on package mirrors, saving bandwidth and storage for both users and
      mirror operators.
related-packages:
