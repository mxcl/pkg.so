id: brew:evans
display-name: Evans
repo: null
docs:
  - https://github.com/ktr0731/evans#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/evans/config.toml
    - GIT_PROJECT_ROOT/.evans.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project distributes binaries through GitHub Releases, recommends Homebrew on
      macOS, publishes a container image, and supports `go install`, placing it in the
      usual packaging paths for Go-based infrastructure CLIs.
  package-nerd-significance:
    - >
      Evans matters to package-manager users because it packages a repeatable gRPC
      debugging workflow: shell-friendly JSON in CLI mode, completion in REPL mode,
      reflection support, Docker images, and Homebrew installation.
  project-history:
    - >
      The project describes its motivation as making gRPC clients easier to use than
      existing tools. Its README splits the design into REPL mode for manual API
      inspection and CLI mode for scriptable, one-command calls.
  related-projects:
    - >
      The README compares CLI mode to grpc-ecosystem/polyglot and documents
      compatibility with gRPC reflection and gRPC-Web.
  sources:
    - https://github.com/ktr0731/evans#readme
    - https://github.com/ktr0731/evans/releases
    - https://github.com/ktr0731/evans/pkgs/container/evans
  summary:
    - >
      Evans is a command-line and interactive gRPC client built for inspecting, calling,
      and scripting gRPC APIs from a terminal.
  timeline:
    - >
      2019: README artwork and early documentation frame Evans around easier gRPC
      inspection and scripting.
    - >
      README documents official installation paths via GitHub Releases, Homebrew,
      Docker, and `go install`.
  usage:
    - >
      Users point Evans at proto files or use gRPC reflection, then call services
      interactively in the REPL or pipe JSON through CLI mode. A project-root
      `.evans.toml` can provide defaults such as proto file, package, and service.
related-packages:
  - id: brew:grpcurl
    reason: >
      Choose grpcurl for a focused curl-like gRPC command interface; choose Evans when
      an interactive, completion-driven REPL is useful alongside scriptable calls.
    rel: alternative
    sources:
      - https://github.com/ktr0731/evans#readme
      - https://github.com/fullstorydev/grpcurl#readme
