history:
  adoption-history:
    - >
      Telegram Desktop grew into Telegram's official cross-platform desktop client for
      Windows, macOS, and Linux. Its cloud synchronization lets users move between
      mobile and desktop clients, while official binaries, operating-system stores,
      Linux packages, and package managers provide multiple distribution paths.
    - >
      Telegram reports more than one billion active users for the wider service. That
      figure describes Telegram overall rather than the desktop client alone.
  package-nerd-significance:
    - >
      Telegram Desktop is a substantial GPLv3 C++/Qt desktop application built on the
      public Telegram API and MTProto protocol. It is important to packaging communities
      because it spans Windows, macOS, and Linux, has both upstream and store-specific
      distributions, and maintains a large native build and dependency system.
  project-history:
    - >
      Telegram launched in August 2013. An initially unofficial PC client appeared in
      early 2014 and later became the official Telegram Desktop application. Telegram
      Desktop reached version 1.0 in January 2017 with a redesigned interface and custom
      themes.
    - >
      The client has continued as the service's principal cross-platform desktop
      application, adding features such as cloud drafts, media and document
      synchronization, chat export, calls, themes, and other capabilities shared with
      the Telegram platform.
  related-projects:
    - Telegram Web provides browser-based access.
    - Telegram for macOS is a separate native Apple-platform client.
    - Telegram Desktop uses the Telegram API and MTProto protocol.
  sources:
    - 'Official Desktop 1.0 announcement: https://telegram.org/blog/desktop-1-0'
    - 'Official FAQ: https://telegram.org/faq'
    - 'Official Telegram history: https://telegram.org/evolution'
    - 'Official repository: https://github.com/telegramdesktop/tdesktop'
    - source_facts.package-manager
  summary:
    - >
      Telegram Desktop is Telegram's official open-source desktop messenger, providing
      synchronized access to Telegram chats and cloud media on Windows, macOS, and
      Linux.
  timeline:
    - '2013-08-14: Telegram launched.'
    - >
      2014-01: A stand-alone PC application appeared and later became the official
      Telegram Desktop client.
    - >
      2017-01-11: Telegram Desktop reached version 1.0 with a redesigned interface and
      custom-theme support.
  usage:
    - >
      Sign in with a Telegram account and verification code to synchronize ordinary
      cloud chats, documents, photos, videos, and drafts across devices.
    - >
      Use the client for messaging, groups, channels, calls, file exchange, and
      desktop-oriented operations such as chat-data export.
    - Secret Chats are device-specific and are not synchronized into Telegram Desktop.
