credentials-file-location: null
history:
  adoption-history:
    - >
      ELP exists because classic Erlang editor integrations and OTP tools are not always
      suited to incremental editing of incomplete code. The FAQ says ELP acts as a
      compiler front-end and language server, effectively superseding Erlang LS for its
      intended use case, while being architecturally closer to rust-analyzer than to a
      thin wrapper around existing OTP tools.
  package-nerd-significance:
    - >
      ELP is notable for bringing the rust-analyzer style of incremental compiler
      front-end to Erlang packaging. For package maintainers, it is a modern Rust-built
      developer tool serving an older BEAM language ecosystem, so it sits at the
      intersection of Erlang, LSP, Rust build tooling, and editor distribution.
  project-history:
    - >
      The official repository was created in August 2023 and published a 0.1.0 GitHub
      release the same day. The README says ELP was designed at WhatsApp and inspired by
      rust-analyzer, with a scalable, fully incremental, IDE-first library for Erlang
      semantic analysis.
  related-projects:
    - >
      ELP is related to Erlang LS, rust-analyzer, Tree-sitter, Salsa, LSP clients, and
      eqWAlizer.
  sources:
    - https://github.com/WhatsApp/erlang-language-platform
    - https://github.com/WhatsApp/erlang-language-platform/blob/main/FAQ.md
    - https://github.com/WhatsApp/erlang-language-platform/releases
    - https://api.github.com/repos/WhatsApp/erlang-language-platform
    - https://whatsapp.github.io/erlang-language-platform
  summary:
    - >
      Erlang Language Platform, usually invoked as `elp`, is WhatsApp's Erlang
      semantic-analysis and editor-tooling project. It provides an LSP language server,
      a CLI, static-analysis infrastructure, and integration with eqWAlizer type
      checking.
  timeline:
    - '2023: The GitHub repository was created.'
    - '2023: Version 0.1.0 was published on GitHub releases.'
    - >
      2020s: ELP documentation covers installation, editor setup, project configuration,
      and lint configuration for Erlang projects.
  usage:
    - >
      Users install `elp` and point their editor's language-server client at it for
      go-to-definition, references, call hierarchy, diagnostics, linting, refactoring
      support, and type checking. Project configuration is handled with `.elp.toml` and
      lint settings with `.elp_lint.toml`.
related-packages:
  - id: brew:erlang
    reason: >
      Install Erlang/OTP as the language and runtime underlying the Erlang projects that
      ELP analyzes.
    rel: adjacent_workflow
    sources:
      - https://whatsapp.github.io/erlang-language-platform/docs/get-started/install/
      - https://www.erlang.org/docs
  - id: brew:rebar3
    reason: >
      Use Rebar3 for the project build workflow; ELP officially detects `rebar.config`
      projects and derives their source and dependency structure.
    rel: adjacent_workflow
    sources:
      - https://whatsapp.github.io/erlang-language-platform/docs/get-started/configure-project/
      - https://rebar3.org/docs/
  - id: brew:erlang_ls
    reason: >
      Choose Erlang LS when you prefer an LSP layer that connects established OTP and
      third-party tools, while ELP provides its own incremental compiler front-end and
      is positioned by its maintainers as the successor.
    rel: alternative
    sources:
      - https://github.com/WhatsApp/erlang-language-platform/blob/main/FAQ.md
      - https://github.com/erlang-ls/erlang_ls
