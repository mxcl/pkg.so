id: cask:stay
display-name: Stay
repo: null
docs:
  - https://cordlessdog.com/stay/documentation
  - https://cordlessdog.com/stay/documentation/faq
config-file-location:
  macos:
    - ~/Library/Application Support/Stay
    - ~/Library/Preferences/com.cordlessdog.Stay.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Stay addresses a long-running macOS workflow problem for people who repeatedly
      connect, disconnect, or rearrange displays. Its display-configuration model lets
      one set of stored window positions coexist with layouts for other monitor
      combinations.
  package-nerd-significance:
    - >
      Stay is useful to Mac automation and package-manager users because it preserves
      window geometry across changing display topologies without requiring users to
      script individual applications. Its documented configuration files can also be
      included in a broader user-profile backup.
  project-history:
    - >
      Cordless Dog developed Stay as a focused macOS utility for recording and restoring
      application-window sizes and positions. The product grew beyond simple restoration
      to include automatic restoration, manual window linking, title-pattern matching,
      stored-window editing, and actions.
  related-projects:
    - >
      Stay relies on macOS accessibility facilities to move and resize other
      applications' windows.
  sources:
    - 'Official FAQ: https://cordlessdog.com/stay/documentation/faq/'
    - 'Official documentation: https://cordlessdog.com/stay/documentation/'
    - 'Official product page: https://cordlessdog.com/stay/'
  summary:
    - >
      Stay is a macOS window-management utility that stores window arrangements for
      different display configurations and restores them manually or automatically.
  timeline:
    - >
      The official site maintains downloads for multiple generations of macOS,
      reflecting long-running compatibility maintenance, but it does not publish a dated
      origin timeline.
  usage:
    - >
      Users arrange application windows, ask Stay to store the layout, and later restore
      it. Automatic restoration can react to displays being connected, disconnected,
      repositioned, mirrored, or changed in resolution; difficult windows can be
      manually linked to stored entries.
