config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      MediaInfo became a package-manager staple because it solves a common Unix
      media-workflow problem: identify what is inside a file without opening a
      heavyweight editor or transcoder. The official site exposes both GUI and CLI
      editions, while the package input lists it across Homebrew, Debian, Ubuntu,
      Fedora, Arch, MacPorts, Nix, Scoop, Winget, Chocolatey, and other ecosystems.
    - >
      Its adoption also comes from library reuse. The GitHub README states that this
      repository contains the CLI and GUI source for MediaInfoLib, making MediaInfo not
      just an end-user tool but a metadata engine used by other media applications and
      preservation workflows.
  package-nerd-significance:
    - >
      MediaInfo is one of those packages that quietly anchors media automation: it is
      small enough to install everywhere, scriptable enough for CI and batch jobs, and
      format-aware enough to replace a lot of custom probing code. Its long changelog is
      useful to packagers because container and codec support changes frequently,
      especially for archival formats such as MXF, Matroska, FFV1, and modern
      image/video metadata.
  project-history:
    - >
      The MediaInfo CLI history file records releases at least as far back as 2003, with
      early 0.4 and 0.5 versions tied to MediaInfoLib and command-line multi-file
      analysis. By 2005 and 2006, the changelog shows rapid expansion into MXF,
      RealMedia, Matroska, MPEG-4, H.264, Dirac, Musepack, TrueAudio, WavPack, DTS-HD,
      and broader tag parsing.
    - >
      MediaArea later moved the public source to GitHub; the official repository
      contains the CLI and GUI code for MediaInfoLib and documents the CLI, desktop
      GUIs, mobile GUIs, and supported architectures. The modern website continues to
      publish frequent releases and lists builds for Windows, macOS, Debian, Ubuntu,
      Fedora, openSUSE, Arch Linux, Flatpak, Snap, and other targets.
  related-projects:
    - >
      MediaInfo is closely tied to MediaInfoLib and to other MediaArea tools such as
      MediaConch, MediaTrace, QCTools, RAWcooked, and DVRescue.
  sources:
    - https://github.com/MediaArea/MediaInfo
    - https://mediaarea.net/MediaInfo
    - https://raw.githubusercontent.com/MediaArea/MediaInfo/master/History_CLI.txt
    - source_facts.package-manager
  summary:
    - >
      MediaInfo is MediaArea's long-running media inspection tool for reporting
      container, video, audio, text, chapter, and tag metadata from audiovisual files.
      The official project presents it as a unified display for technical and tag data,
      available as graphical interfaces, a command-line program, and a library.
  timeline:
    - '2003: MediaInfo CLI history records version 0.4.0.1 using MediaInfoLib 0.4.0.1.'
    - >
      2005: Early releases add Linux compilation work, MXF detection, expanded codec
      names, and more container parsers.
    - '2014: Official MediaArea GitHub repository is created for MediaInfo.'
    - '2026: MediaArea publishes MediaInfo 26.05 with new format support and parser fixes.'
  usage:
    - >
      Package users run `mediainfo` to print structured metadata, inspect bitstreams,
      compare files, or export reports as text, CSV, HTML, XML, or other supported
      formats. The official feature list emphasizes format coverage, multiple views,
      export modes, shell integration, localization, GUI use, CLI use, and library use.
related-packages:
  - id: brew:mediaconch
    reason: >
      MediaConch incorporates MediaInfo metadata into policy and conformance reports
      when preservation workflows need validation rather than inspection alone.
    rel: adjacent_workflow
    sources:
      - https://mediaarea.net/MediaConch/Documentation/HowToUse
      - https://mediaarea.net/en/MediaInfo
  - id: brew:ffmpeg
    reason: >
      Choose FFmpeg's ffprobe when you want highly scriptable stream and packet probing
      tied to FFmpeg workflows; choose MediaInfo for its unified technical-and-tag
      report and broad presentation formats.
    rel: alternative
    sources:
      - https://ffmpeg.org/ffprobe.html
      - https://mediaarea.net/en/MediaInfo
