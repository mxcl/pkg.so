history:
  adoption-history:
    - >
      Lody launched with desktop and mobile access to coding-agent sessions and later
      expanded its supported agent ecosystem to include Codex, Claude Code, Kimi, Grok,
      OpenCode, and ACP-compatible runtimes.
    - >
      In August 2026, Lody opened the source for its CLI and local desktop client. The
      official project later reported crossing one thousand GitHub stars, indicating
      early developer interest, while hosted synchronization remained part of its
      cross-device collaboration model.
  package-nerd-significance:
    - >
      Lody packages several current developer-tooling trends into one application:
      remote agent execution, Git-worktree isolation, multi-agent coordination, mobile
      supervision, ACP interoperability, and local-first synchronization. Its CLI can
      also expose workspace and session data as JSON for scripting.
  project-history:
    - >
      Lody was publicly introduced on January 9, 2026 as a way to run AI coding agents
      in isolated Git worktrees with real-time synchronization and mobile access.
    - >
      The product grew from session dispatch and review into a shared workspace with
      live handoff, parallel agents, project browsing, diffs, previews, GitHub
      integration, agent roles, and cross-session coordination.
    - >
      On August 26, 2026, Lody announced that its CLI and local desktop client were open
      source under the LodyAI/Lody repository, describing a longer-term move toward
      local-first, portable team context.
  related-projects:
    - Agent Client Protocol
    - Claude Code
    - Codex
    - Kimi Code
    - OpenCode
    - Git worktrees
    - Loro
  sources:
    - https://github.com/LodyAI/Lody — official source repository and README.
    - https://lody.ai/blog/ — official launch date and announcement index.
    - https://lody.ai/blog/lody-is-now-open-source/ — official open-source announcement.
    - https://lody.ai/docs/ — official feature and workflow documentation.
  summary:
    - >
      Lody is a collaborative workspace for running, reviewing, sharing, and
      coordinating AI coding-agent sessions across computers, phones, browsers, and a
      CLI.
  timeline:
    - '2026-01-09: Lody publicly launched.'
    - '2026-08-26: The CLI and local desktop client became open source.'
    - '2026-09: Lody reported passing 1,000 GitHub stars.'
  usage:
    - >
      Users connect a workstation, server, or cloud VM with the Lody CLI daemon,
      register a local project or connect GitHub, configure an agent, and create
      sessions from desktop, mobile, web, or CLI. Git worktrees isolate concurrent
      coding tasks, while shared sessions expose conversations, files, diffs, runtime
      state, and permission requests to teammates.
