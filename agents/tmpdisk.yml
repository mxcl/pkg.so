history:
  adoption-history:
    - >
      The maintainer states that TmpDisk has been maintained for more than a decade. It
      has remained a macOS-focused utility distributed from the project's GitHub
      releases and through a Homebrew cask.
    - >
      Its scope expanded from a menu-bar GUI and application launch arguments to include
      an optional CLI, automatic volume recreation, privileged operations through a
      helper, and persistent folder-synchronization workflows.
  package-nerd-significance:
    - >
      TmpDisk packages a traditionally shell-oriented macOS task—constructing and
      mounting RAM-backed filesystems—behind both a menu-bar interface and a scriptable
      command. That combination makes it useful to users who want disposable high-speed
      storage without repeatedly composing disk-management commands.
    - >
      Its explicit warning that RAM disks disappear on eject or shutdown is
      operationally important: the package manages deliberately ephemeral storage, while
      later folder-sync features selectively add persistence.
  project-history:
    - >
      TmpDisk began as a simple open-source macOS RAM-disk manager. Its GUI runs in the
      menu bar and creates virtual disks backed by system memory.
    - >
      Later releases added broader filesystem and mount options, an automatic-recreation
      manager, a privileged helper for operations that require elevated access, and a
      standalone command-line program. The folder-sync feature added an opt-in path for
      copying data into a RAM disk and saving changes back.
  related-projects:
    - macOS disk images and RAM disks
    - TmpDiskCLI
    - macOS Disk Utility
    - tmpfs
  sources:
    - https://github.com/imothee/tmpdisk#readme
    - https://github.com/imothee/tmpdisk/releases
    - source_facts.package-manager
  summary:
    - >
      TmpDisk is an open-source macOS utility for creating, opening, recreating,
      synchronizing, and ejecting RAM-backed temporary disks from a menu-bar application
      or command line.
  timeline:
    - >
      Early releases: TmpDisk provides a graphical macOS RAM-disk workflow and accepts
      application launch arguments.
    - 'Version 2.1: A background helper is introduced for privileged RAM-disk operations.'
    - >
      Version 2.2: APFS, no-execute mounts, custom mount points, and a dedicated CLI are
      added.
    - >
      Version 2.3: The CLI becomes standalone and folder synchronization and
      save-on-eject workflows are introduced.
  usage:
    - >
      From the menu-bar application, users create a disk with a chosen name, size,
      filesystem, and mount behavior; select an existing disk to open it in Finder; or
      eject it when finished.
    - >
      The standalone `tmpdisk` command can create, list, save, and eject volumes.
      Optional synchronization copies a source folder into a RAM disk and can save
      changes back manually, periodically, or during eject.
    - >
      Data that has not been synchronized elsewhere is permanently lost when its RAM
      disk is ejected or the computer shuts down.
