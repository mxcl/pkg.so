id: brew:gemgen
display-name: gemgen
repo: https://git.sr.ht/~kota/gemgen
docs:
  - https://sr.ht/~kota/gemgen
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gemgen's adoption evidence is modest and niche. The upstream README lists Arch AUR
      and Homebrew packaging, and Go package metadata identifies it as a command module
      rather than a widely imported library.
  package-nerd-significance:
    - >
      For package maintainers, gemgen is a compact example of Gemini-era publishing
      tooling: a single-purpose CLI, small Go dependency tree, manpage-oriented
      installation, and enough release discipline to appear in Homebrew despite its
      narrow audience.
  project-history:
    - >
      The SourceHut repository began in August 2021 and reached tagged releases through
      v0.6.0 by February 2022. The README describes a Go tool built on goldmark and a
      companion goldmark-gemtext renderer, with options for preserving or adapting
      Markdown constructs to produce readable Gemtext rather than a purely mechanical
      dump.
    - >
      The project scope stayed deliberately narrow: it converts files concurrently or
      streams Markdown from standard input to Gemtext on standard output, with extra
      support for link rewriting, templates, wiki-style links, and formatting choices
      useful when publishing static Gemini content.
  related-projects:
    - >
      gemgen is related to CommonMark, goldmark, goldmark-gemtext, the Gemini protocol,
      and other capsule publishing tools that bridge web-era Markdown into Gemtext.
  sources:
    - https://formulae.brew.sh/formula/gemgen
    - https://git.sr.ht/~kota/gemgen
    - https://pkg.go.dev/git.sr.ht/~kota/gemgen
  summary:
    - >
      gemgen is a small command-line converter from CommonMark Markdown to Gemtext, the
      lightweight markup used by Gemini protocol capsules. Its history is best
      understood as part of the early-2020s tooling wave around maintaining text-first
      Gemini sites from more common Markdown source material.
  timeline:
    - '2021: Initial public commits and v0.1.0 release.'
    - '2021: v0.5.0 adds to the early sequence of SourceHut-hosted releases.'
    - '2022: v0.6.0 is tagged after several months of Markdown-to-Gemtext iteration.'
  usage:
    - >
      Practitioners use gemgen to keep Markdown as the editable source for Gemini
      capsules, then generate `.gmi` output during publishing. The tool pays special
      attention to Gemtext conventions: links are placed after paragraphs, headings and
      lists are simplified, emphasis can be removed or retained, and code blocks are
      emitted in fenced Gemtext form.
related-packages:
  - id: brew:amfora
    reason: >
      Use Amfora to inspect and navigate the Gemini capsule content produced by gemgen
      from within a terminal.
    rel: adjacent_workflow
    sources:
      - https://sr.ht/~kota/gemgen
      - https://github.com/makew0rld/amfora#readme
  - id: cask:lagrange
    reason: >
      Use Lagrange when generated Gemtext needs to be reviewed in a graphical Gemini
      client with page outlines, tabs, typography, and inline media.
    rel: adjacent_workflow
    sources:
      - https://sr.ht/~kota/gemgen
      - https://gmi.skyjake.fi/lagrange/
