history:
  adoption-history:
    - >
      Fedistar is published for macOS, Windows, and Linux through upstream downloads and
      platform-specific package channels. Its audience includes people who follow
      several Fediverse timelines or operate accounts on more than one server.
    - >
      The supported server families extend beyond Mastodon to Pleroma, Friendica,
      Firefish, GoToSocial, Pixelfed, and unofficially supported compatible platforms.
  package-nerd-significance:
    - >
      Fedistar illustrates the client diversity enabled by federated social protocols:
      users can choose a desktop interface independently of their server operator. It is
      also a cross-platform, GPL-licensed application distributed through native
      packages, release artifacts, and community package managers.
  project-history:
    - >
      Fedistar was created by h3poteto as a free, open-source, multi-column desktop
      client for the Fediverse. The project's copyright and official site date its
      public identity to 2023.
    - >
      The application is developed in a public repository and uses the Tauri desktop
      framework. Its feature set grew around multiple accounts, multiple columns,
      streaming timelines, notifications, cross-account reactions, search, and theme
      customization.
  related-projects:
    - >
      Fedistar connects to Mastodon and several other ActivityPub-based server families.
      Its official site also links Whalebird, an earlier desktop Fediverse client
      associated with the same developer.
  sources:
    - https://fedistar.net/
    - https://fedistar.net/help
    - https://github.com/h3poteto/fedistar
  summary:
    - >
      Fedistar is a free and open-source multi-column desktop client for Mastodon and
      other Fediverse services.
  timeline:
    - "2023: Fedistar's official copyright and public project identity began."
    - >
      Subsequent development: Support expanded across multiple ActivityPub server
      families and desktop operating systems.
  usage:
    - >
      Users add one or more Fediverse accounts, arrange timelines and searches into
      columns, compose and react to posts, receive desktop notifications, and monitor
      public timelines without signing in where the server permits it.
