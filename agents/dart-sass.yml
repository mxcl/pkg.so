history:
  adoption-history:
    - >
      Dart Sass became common in build chains because it is both the reference
      implementation and available through normal developer channels: a standalone CLI,
      npm package, and OS package managers such as Homebrew. The `sass` executable also
      made it a straightforward replacement for older Sass commands in scripts and CI
      jobs.
    - >
      The deprecation of LibSass shifted ecosystem pressure toward Dart Sass, especially
      for projects depending on newer Sass language features. Package maintainers care
      about that transition because it changed which Sass compiler downstream tools
      could safely depend on.
  package-nerd-significance:
    - >
      Dart Sass matters to package nerds because it is a language reference
      implementation that is also the everyday package users install. That combination
      makes version bumps semantically important: a formula update can mean new Sass
      syntax, deprecations, or compatibility behavior for large frontend dependency
      graphs.
  project-history:
    - >
      The Dart Sass project grew out of the Sass team's need for a canonical
      implementation that could move with the language specification while still
      shipping as a practical CLI and JavaScript package. Its 1.0.0 release established
      the Dart implementation as a stable, production-ready compiler.
    - >
      The Sass project later deprecated LibSass and Node Sass, pointing users toward
      Dart Sass as the primary implementation with complete ongoing language support.
      That made the Dart Sass package the default answer for developers who wanted the
      current Sass language rather than a compatibility layer around an older engine.
  related-projects:
    - >
      Ruby Sass was the original Sass implementation line, while LibSass and Node Sass
      provided a native-library era that Dart Sass superseded for current language
      support. The Dart Sass CLI is also closely related to the npm `sass` package used
      by JavaScript build tooling.
  sources:
    - https://sass-lang.com/dart-sass
    - https://sass-lang.com/documentation/cli/dart-sass
    - https://sass-lang.com/blog/libsass-is-deprecated/
    - https://github.com/sass/dart-sass/releases/tag/1.0.0
  summary:
    - >
      Dart Sass is the official Sass implementation written in Dart and distributed as
      the `sass` command-line compiler. In package-manager terms it is the modern,
      portable Sass package that replaced the older implementation split between Ruby
      Sass and LibSass for most users.
  timeline:
    - '2018: Dart Sass 1.0.0 was released as a stable implementation.'
    - >
      2020: The Sass team deprecated LibSass and Node Sass, recommending Dart Sass for
      current language support.
    - >
      Present: Dart Sass is documented by the Sass project as the primary Dart-based
      Sass command-line implementation.
  usage:
    - >
      Typical use is direct compilation from Sass or SCSS input to CSS, including watch
      mode and load-path options through the official CLI. It also appears indirectly
      through frontend build tools that shell out to, bundle, or depend on the Dart Sass
      implementation.
related-packages:
