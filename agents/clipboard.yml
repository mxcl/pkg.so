config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README lists several packaging channels, including Alpine, AUR,
      Conda-forge, Flathub, Gentoo, Homebrew, Nix, Pacstall, Scoop, Snap, Void Linux,
      Winget, and GitHub releases. Homebrew's formula API showed stable 0.10.0 and more
      than one thousand on-request installs over the preceding year, while GitHub
      repository metadata showed more than 5,000 stars.
  package-nerd-significance:
    - >
      Clipboard is significant for package-manager users because it is explicitly
      distributed across many OS package ecosystems and tries to normalize clipboard
      behavior across terminals, shells, GUI clipboards, and binary data. It is the kind
      of tool package nerds notice because it turns a pile of platform-specific
      clipboard commands into one portable CLI.
  project-history:
    - >
      The GitHub repository was created on 2022-11-20 and the official README presents
      the project as a fast, lightweight, feature-packed clipboard manager. Its homepage
      is getclipboard.app, while the GitHub wiki and README serve as the main
      documentation surfaces.
    - >
      The README emphasizes terminal-first clipboard interaction across macOS, Linux,
      and Windows, plus GUI clipboard compatibility and a scriptable API. It also notes
      active maintenance and asks for C++ help, reflecting a project that grew from a
      simple `cb copy` / `cb paste` workflow into a broader clipboard suite.
  related-projects:
    - >
      The README compares the problem space to xclip-style clipboard tools and documents
      GUI clipboard compatibility.
    - >
      Package distribution spans Homebrew, Scoop, Winget, Flathub, Snap, Conda-forge,
      AUR, Nix, and other ecosystems listed in the official README.
  sources:
    - https://github.com/Slackadays/Clipboard#readme
    - https://github.com/Slackadays/Clipboard/wiki
    - https://getclipboard.app/
    - https://formulae.brew.sh/api/formula/clipboard.json
    - https://github.com/Slackadays/Clipboard
  summary:
    - >
      The Clipboard Project is a cross-platform terminal clipboard manager whose `cb`
      command aims to copy and paste text, files, directories, binary data, and multiple
      named clipboards from scripts and shells.
  timeline:
    - '2022-11-20: GitHub repository is created.'
    - '2025: README maintenance badge indicates ongoing maintenance.'
    - >
      2026: Homebrew formula tracks stable release 0.10.0 from the official GitHub tag
      archive.
  usage:
    - >
      Typical use is `cb copy` and `cb paste` from the terminal, with support for
      ordinary shell pipelines and non-text data. The README positions it as an easier
      alternative to remembering separate xclip, pbcopy, and platform-specific flags
      when scripts need clipboard access.
related-packages:
  - id: brew:xclip
    reason: >
      Choose xclip for a small, established X11 selection interface; choose Clipboard
      when you need a cross-platform command with files, directories, history, and
      multiple named clipboards.
    rel: alternative
    sources:
      - https://github.com/Slackadays/Clipboard#readme
      - https://github.com/astrand/xclip#readme
  - id: brew:clippy
    reason: >
      Choose Clippy on macOS when Finder-style file references and GUI paste
      compatibility are the main requirement; Clipboard provides a broader
      cross-platform clipboard manager.
    rel: alternative
    sources:
      - https://github.com/Slackadays/Clipboard#readme
      - https://github.com/neilberkman/clippy#readme
