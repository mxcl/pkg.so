id: brew:taoup
display-name: TAO (The Art) of Unix Programming
repo: null
docs:
  - https://github.com/globalcitizen/taoup#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The maintainer documents installation through the Arch User Repository,
      Nix/Nixpkgs, or a direct Ruby setup; the supplied package facts additionally
      record Homebrew distribution.
    - >
      A common adoption pattern is intentionally lightweight: users invoke it from a
      shell profile so that a quotation appears when they log in.
  package-nerd-significance:
    - >
      taoup belongs to the long Unix tradition of tiny terminal amusements such as
      `fortune`, but curates quotations about Unix, systems thinking, architecture,
      engineering, and related philosophy.
    - >
      Its ability to emit classic fortune-file input makes it composable with the older
      `fortune` and `strfile` toolchain, while ANSI and `NO_COLOR` support bridge retro
      terminal culture and modern command-line conventions.
  project-history:
    - >
      taoup began as the maintainer's personal quotation collection, implemented as a
      Ruby-powered, ANSI-colored, fortune-like terminal program. Contributions expanded
      the collection while retaining its Unix and systems-philosophy focus.
    - >
      The project added modes for light terminal backgrounds, colorless machine-readable
      output, and classic fortune-format export, along with a companion `taoup-fortune`
      login example.
  related-projects:
    - >
      `fortune`, the classic Unix quotation program whose behavior and file format taoup
      can imitate.
    - >
      `strfile`, used to compile taoup's fortune-format output for use by classic
      fortune implementations.
    - The Ruby `ansi` gem used by the documented direct-install workflow.
  sources:
    - https://github.com/globalcitizen/taoup
    - source_facts.package-manager
  summary:
    - >
      taoup is a Ruby terminal amusement that prints ANSI-colored quotations and
      observations about Unix programming, systems, design, and related subjects.
  timeline:
    - >
      Initial design: Created as a personal Ruby-powered collection of Unix and
      systems-programming wisdom.
    - >
      Later usage modes: Added login-shell integration, colorless output,
      light-background output, and classic fortune-format export.
  usage:
    - >
      Run `taoup` to print the collection in its standard ANSI-colored form, or invoke
      `taoup-fortune` or a similar command from `.profile` to show output at login.
    - >
      Use `--machine` or the `NO_COLOR` environment convention to suppress ANSI colors,
      `--whitetrash` for light terminals, and `--fortune` to produce classic
      fortune-format text.
    - >
      To use the output with traditional fortune tooling, redirect `taoup --fortune`,
      process it with `strfile`, and pass the resulting database to `fortune`.
