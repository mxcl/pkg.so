  unix:
    - ~/.authinfo.gpg
    - ~/.authinfo
    - ~/.netrc
history:
  adoption-history:
    - >
      Emacs spread through Unix and free software culture because it was not only an
      editor but a programmable environment. Its extension model made modes, mail/news
      clients, shells, version-control interfaces, language tooling, and personal
      workflows installable or scriptable inside one long-lived process.
    - >
      Package-manager adoption is unusually broad: GNU Emacs is available through
      Homebrew, Debian, Ubuntu, Fedora, Arch, Nix, MacPorts, Chocolatey, Scoop, winget,
      and other systems. That breadth reflects both its age and its continuing role as a
      baseline developer and writing tool across operating systems.
    - >
      Modern adoption also depends on package archives and init-file culture. Users
      typically maintain an init.el or equivalent startup file, install packages, and
      share configuration snippets; package managers provide the editor binary, while
      Emacs's own package system and Lisp ecosystem provide much of the user experience.
  package-nerd-significance:
    - >
      GNU Emacs is package-nerd bedrock: it is a large, old, highly configurable package
      with compile-time options, GUI toolkit choices, native compilation, daemon/client
      modes, and many downstream variants. Installing Emacs is often the start of
      another package ecosystem managed through Emacs Lisp packages and user
      configuration.
    - >
      For maintainers, Emacs is also a portability test case. It spans terminal and
      graphical builds, Unix-like systems and Windows, optional libraries, and decades
      of compatibility expectations. That makes it a recurring package-manager benchmark
      for patches, bottles, build flags, and upgrade migrations.
  project-history:
    - >
      The Emacs lineage began before GNU: the GNU source tree's HISTORY file says EMACS
      started as macros on top of the TECO editor and was first operational in late
      1976. That original idea, an extensible and self-documenting editor, became one of
      the defining models for programmable development environments.
    - >
      Work on GNU Emacs began in 1984 as a fresh implementation for GNU and GNU-like
      systems with a full-featured Lisp at its core. GNU Emacs 13, the initial public
      release, was announced on Usenet on 1985-03-20, and the project has kept a long
      stable-release history in the source tree since then.
    - >
      Over later decades, GNU Emacs accumulated major editing, programming, package,
      display, and platform features while keeping Emacs Lisp as the extension language.
      The NEWS files remain the canonical record of user-visible changes, with Emacs 30
      adding items such as default native compilation where libgccjit is available,
      Android port work, and always-available native JSON support.
  related-projects:
    - >
      GNU Emacs is related to earlier TECO-based Emacs systems, XEmacs, Emacs Lisp
      package archives, and editor ecosystems such as Vim and modern IDEs. In
      package-manager data it is also connected to helper executables such as
      emacsclient, etags, and ebrowse.
  sources:
    - https://git.savannah.gnu.org/cgit/emacs.git/plain/etc/HISTORY?h=emacs-30
    - https://git.savannah.gnu.org/cgit/emacs.git/plain/etc/NEWS?h=emacs-30
    - https://www.gnu.org/software/emacs/
    - https://www.gnu.org/software/emacs/documentation.html
    - https://www.gnu.org/software/emacs/manual
  summary:
    - >
      GNU Emacs is the GNU project's extensible, customizable text editor and Lisp
      environment. It is both a daily editor and a programmable application platform,
      shipped by essentially every Unix-like package manager and widely used through
      terminal, GUI, daemon, and emacsclient workflows.
  timeline:
    - '1976: EMACS becomes operational as TECO macros.'
    - '1984: Work begins on GNU Emacs as a new implementation for GNU and GNU-like systems.'
    - '1985: GNU Emacs 13 is announced as the initial public release.'
    - '1997: GNU Emacs 20.1 is released.'
    - '2001: GNU Emacs 21.1 is released.'
    - '2012: GNU Emacs 24.1 is released.'
    - '2018: GNU Emacs 26.1 is released.'
    - >
      2025: Emacs 30 NEWS records Emacs 30.2 as a bug-fix release and Emacs 30.1
      user-visible changes.
  usage:
    - >
      GNU Emacs is commonly launched as emacs for an interactive session, emacsclient
      for connecting to a server, or as a terminal/GUI editor depending on the build.
      Users customize startup through files such as ~/.emacs, ~/.emacs.d/init.el, or
      XDG-style ~/.config/emacs/init.el, with early-init.el available for earlier
      startup customization.
    - >
      Common use spans text editing, programming, project navigation, shells, version
      control, mail, notes, and literate configuration. Its significance is not one
      workflow but the fact that many workflows can be implemented in Emacs Lisp and
      loaded into the same editor.
related-packages:
  - id: brew:neovim
    reason: >
      Choose Neovim when you want modal Vim-style editing with Lua configuration,
      built-in language-server support, and an API-oriented editor platform instead of
      Emacs Lisp workflows.
    rel: alternative
    sources:
      - https://www.gnu.org/software/emacs/
      - https://neovim.io/
      - https://neovim.io/doc/
  - id: brew:vim
    reason: >
      Choose Vim when you want a vi-compatible modal editor with a smaller,
      terminal-centered workflow rather than Emacs's Lisp-programmable application
      environment.
    rel: alternative
    sources:
      - https://www.gnu.org/software/emacs/
      - https://www.vim.org/
      - https://www.vim.org/docs.php
