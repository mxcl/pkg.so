id: brew:clang-build-analyzer
display-name: Clang Build Analyzer
repo: null
docs:
  - https://github.com/aras-p/ClangBuildAnalyzer#readme
config-file-location:
  unix:
    - ./ClangBuildAnalyzer.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager data lists Homebrew and Nix packaging. Release
      metadata shows an initial 1.0.0 release labeled 'Initial release' and later
      releases tracking newer Clang support, including Clang 19 support in 1.6.0.
  package-nerd-significance:
    - >
      It matters because it packages a practical workflow around a compiler diagnostic
      format. For large C++ codebases, it turns a pile of per-object JSON traces into
      actionable package-maintainer and build-engineer questions: which headers,
      templates, source files, or compiler phases are costing rebuild time?
  project-history:
    - >
      The repository was created in August 2019 after Clang 9 introduced -ftime-trace.
      The README says the tool takes the single-file trace output generated by Clang and
      aggregates many compilation traces into summaries of slow files, templates,
      functions, code generation, and expensive headers.
  related-projects:
    - >
      Related projects include Clang, LLVM, Clang's -ftime-trace support, Chrome trace
      viewers, speedscope.app, and native build systems such as Make, CMake, Xcode, and
      Visual Studio.
  sources:
    - https://github.com/aras-p/ClangBuildAnalyzer
    - https://raw.githubusercontent.com/aras-p/ClangBuildAnalyzer/main/readme.md
    - https://raw.githubusercontent.com/aras-p/ClangBuildAnalyzer/main/ClangBuildAnalyzer.ini
    - https://api.github.com/repos/aras-p/ClangBuildAnalyzer/releases
    - https://releases.llvm.org/9.0.0/tools/clang/docs/ReleaseNotes.html
  summary:
    - >
      Clang Build Analyzer is a C and C++ build analysis tool that aggregates Clang
      -ftime-trace JSON files and reports where compilation time is spent. It is a
      package-nerd tool for people optimizing slow native builds rather than a general
      application framework.
  timeline:
    - '2019: Repository created after Clang 9 documented -ftime-trace.'
    - '2020: v1.0.0 initial release published on GitHub.'
    - '2020: v1.2.0 focused on optimizations for large builds.'
    - '2023: v1.5.0 improved expensive-header information.'
    - '2025: v1.6.0 added Clang 19 support and fixes.'
  usage:
    - >
      A typical workflow starts capture with ClangBuildAnalyzer --start, builds with
      Clang 9 or later using -ftime-trace, stops capture with --stop, and runs --analyze
      on the produced capture file. A ClangBuildAnalyzer.ini file in the working
      directory controls how many expensive files, templates, functions, and headers are
      reported.
related-packages:
  - id: brew:llvm
    reason: >
      LLVM supplies the Clang compiler whose `-ftime-trace` JSON output Clang Build
      Analyzer captures and aggregates.
    rel: adjacent_workflow
    sources:
      - https://releases.llvm.org/9.0.0/tools/clang/docs/ReleaseNotes.html
      - https://github.com/aras-p/ClangBuildAnalyzer#readme
      - https://github.com/llvm/llvm-project
