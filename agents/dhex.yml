id: brew:dhex
display-name: dhex
repo: null
docs:
  - https://www.dettus.net/dhex
config-file-location:
  unix:
    - ~/.dhexrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The official page lists successful operation on Linux, HP-UX, FreeBSD, NetBSD, Mac
      OS X, IRIX, and Solaris, which explains its appeal as a packaged terminal utility.
      The 2019 release note explicitly credits persistent users for convincing the
      author to publish another version.
  package-nerd-significance:
    - >
      dhex is package-nerd useful because it combines two common emergency tools, a hex
      editor and binary diff viewer, into a small curses program. It is easy to ship on
      headless Unix systems and does not need a desktop stack.
  project-history:
    - >
      The official project page describes DHEX as more than another hex editor because
      it includes diff mode, ncurses display, theming, and search logs. The downloadable
      0.69 README records the 0.6x branch history from an initial 0.60 release in 2010
      through the final 0.69 release.
  related-projects:
    - Standard Unix tools such as cmp and diff cover adjacent comparison workflows.
    - >
      Other terminal hex editors fill similar packaging niches, but dhex's official
      positioning centers on diff mode.
  sources:
    - https://www.dettus.net/dhex
    - https://www.dettus.net/dhex/dhex_0.69.tar.gz
  summary:
    - >
      dhex is an ncurses-based terminal hex editor with a built-in diff mode. Its niche
      is binary inspection and comparison from a console, including systems where a
      graphical editor is unavailable or inconvenient.
  timeline:
    - '2004: Official page lists early 0.5x releases.'
    - '2010: README records 0.60 as the initial 0.6x release.'
    - '2011: Version 0.63 adds man pages.'
    - '2012: Version 0.67 adds base-address support for memory dumps.'
    - '2019: Version 0.69 is released as the final 0.6x update.'
  usage:
    - >
      dhex opens one file for edit mode or two files for diff mode, supports search,
      bookmarks, a hex calculator, and configurable key/color mappings. On first run it
      creates a .dhexrc file in the user's home directory, and another config file may
      be selected with -f.
related-packages:
  - id: brew:hexyl
    reason: >
      Choose hexyl for colorful, read-only terminal inspection; choose DHEX when editing
      or side-by-side binary diffing is required.
    rel: alternative
    sources:
      - https://www.dettus.net/dhex/
      - https://github.com/sharkdp/hexyl
