  - https://htmlhint.com/usage/options
config-file-location:
  unix:
    - .htmlhintrc
credentials-file-location: null
history:
  adoption-history:
    - >
      HTMLHint's adoption is tied to the JavaScript tooling ecosystem: it can be
      installed with npm, run as a CLI, used programmatically, and integrated into
      editors. The input package facts record Homebrew and Nix packaging, which gives
      non-Node package-manager users a system-level install path for the same linter.
  package-nerd-significance:
    - >
      For package nerds, HTMLHint is significant as a clean example of a web-tooling
      package that crosses ecosystems: npm package, editor extension family, website
      docs, Homebrew formula, and Nix package. It makes HTML style and correctness
      checks available without asking every workflow to run a browser or a full
      validator service.
  project-history:
    - >
      The official site and repository describe HTMLHint as a static code analysis tool
      for HTML. Its documentation centers on installation, configuration, CLI options,
      formatters, and programmatic use through the `HTMLHint.verify` API, which made it
      usable both as a standalone linter and as a library embedded in tooling.
    - >
      The repository tag stream includes early 0.x releases in 2018 and later 1.x
      releases. The changelog shows the project continuing to add rules and output
      formats, including SARIF improvements useful for GitHub Code Scanning and new HTML
      rules such as duplicate attribute-value detection and obsolete-tag detection.
  related-projects:
    - >
      HTMLHint sits alongside linters such as ESLint and Stylelint, but focuses on HTML
      markup. Its related ecosystem includes the official VS Code extension, CI
      code-scanning formats such as SARIF, and browser or validator-based HTML checking
      tools.
  sources:
    - >
      https://api.github.com/repos/htmlhint/HTMLHint/commits/a20dcb8e2ef75c8a85c427612f7a07ee0c3e747e
    - >
      https://api.github.com/repos/htmlhint/HTMLHint/commits/cf955ef6bc111beff790544e7232272da4b4bb2d
    - https://api.github.com/repos/htmlhint/HTMLHint/tags?per_page=100
    - https://github.com/htmlhint/HTMLHint
    - https://github.com/htmlhint/vscode-htmlhint
    - https://htmlhint.com/
    - https://htmlhint.com/changelog/
    - https://htmlhint.com/configuration
  summary:
    - >
      HTMLHint is a JavaScript/TypeScript-oriented static analysis tool for HTML,
      distributed as a command-line linter and reusable library. In package-manager
      terms it is the HTML counterpart to project linters: small, scriptable,
      configurable with `.htmlhintrc`, and useful in editors and CI jobs.
  timeline:
    - '2018: The GitHub tag stream includes early 0.x releases.'
    - '2025: The changelog records 1.6.0 with SARIF formatter improvements and new rules.'
    - '2025: The tag stream includes 1.6.x releases around the documented changelog entries.'
    - 'Package-manager era: The input package facts record HTMLHint in Homebrew and Nix.'
  usage:
    - >
      Typical use is to lint project HTML files from the command line, configure rules
      in `.htmlhintrc`, choose formatter output for humans or machines, or call the
      library API from custom build tools. Its history tracks the broader move from
      browser-only HTML checking toward repeatable CI-friendly linting.
related-packages:
  - id: brew:vnu
    reason: >
      Choose the Nu Html Checker when standards conformance across HTML, CSS, and
      SVG—and optional service or REST deployment—is more important than project-defined
      lint rules.
    rel: alternative
    sources:
      - https://validator.github.io/validator/
      - https://www.htmlhint.com/
  - id: brew:tidy-html5
    reason: >
      Choose HTML Tidy when you want the tool to correct, clean, and modernize HTML or
      XML, rather than only report configurable lint findings.
    rel: alternative
    sources:
      - https://www.html-tidy.org/
      - https://www.htmlhint.com/
