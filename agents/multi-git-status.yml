id: brew:multi-git-status
display-name: multi-git-status
repo: null
docs:
  - https://github.com/fboender/multi-git-status#readme
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The tool fills a common maintainer workflow: scan a directory tree for `.git`
      directories, then print concise status lines for repositories that need attention.
      Its README documents checks for uncommitted changes, untracked files, branches
      that need push or pull, branches without upstreams, and stashes, with options for
      recursion depth, fetching, throttling fetches, flattened output, color, and
      filtering clean repositories.
  sources:
    - https://api.github.com/repos/fboender/multi-git-status
    - https://formulae.brew.sh/formula/multi-git-status
    - https://github.com/fboender/multi-git-status
    - https://www.mankier.com/1/mgitstatus
  summary:
    - >
      multi-git-status installs the `mgitstatus` command, a small utility by fboender
      for checking many Git working trees at once. The public GitHub repository was
      created in 2016 and describes the command as a way to show uncommitted, untracked,
      and unpushed changes across multiple repositories.
  usage:
    - >
      Package-manager metadata exposes it as `multi-git-status` in Homebrew while Debian
      and Ubuntu package the executable-oriented name `mgitstatus`. Its niche is
      deliberately narrower than repository orchestration tools: it is a quick status
      dashboard for people who keep many local clones.
related-packages:
  - id: brew:gita
    reason: >
      Choose Gita when you want a multi-repository status overview plus the ability to
      delegate Git commands across selected repositories; multi-git-status remains the
      narrower read-only attention dashboard.
    rel: alternative
    sources:
      - https://github.com/fboender/multi-git-status
      - https://github.com/nosarthur/gita
tags:
  - cli
