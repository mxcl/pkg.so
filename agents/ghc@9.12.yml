id: brew:ghc@9.12
display-name: GHC 9.12
repo: https://gitlab.haskell.org/ghc/ghc
docs:
  - https://downloads.haskell.org/ghc/9.12.3/docs/users_guide
  - https://www.haskell.org/ghc
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/ghc/ghci.conf
    - ~/.ghc/ghci.conf
    - ./.ghci
credentials-file-location: null
history:
  adoption-history:
    - >
      GHC's adoption is tied to its role as the main compiler used by Haskell projects,
      package repositories, editor tooling, and build systems. The official site names
      Hackage libraries, Haskell Language Server, Cabal, Stack, and GHCup as part of the
      surrounding toolchain.
    - >
      Homebrew exposes `ghc@9.12` as a separate formula with 9.12-suffixed executables.
      That formula role is especially useful for build matrices and projects that test a
      package against a newer stable branch without forcing the unversioned `ghc`
      formula path.
  package-nerd-significance:
    - >
      The formula is packaging glue around a compiler branch whose boot libraries and
      ABI shape downstream package compatibility. Package maintainers care because
      supporting a GHC branch often means testing bounds, generated docs, warnings, and
      extension behavior across that branch.
  project-history:
    - >
      GHC began at the University of Glasgow near the beginning of the 1990s as an
      academic research project funded by the UK government. The project grew from a
      research compiler into a maintained open-source compiler, interactive environment,
      library set, and runtime system for Haskell.
    - >
      The GHC 9.12 branch follows GHC's stable-release convention, where even-numbered
      minor branches receive patchlevel releases. The user guide warns that even
      patchlevel upgrades can require recompiling code built against earlier libraries,
      which is one reason branch-specific packaging is useful.
  related-projects:
    - Cabal and Stack commonly select and invoke GHC for project builds.
    - Hackage package metadata and compiler bounds make versioned GHC installations valuable.
    - GHCup is the official Haskell installer for choosing GHC and related tools.
  sources:
    - https://downloads.haskell.org/ghc/9.12.3/docs/users_guide/intro.html
    - https://formulae.brew.sh/formula/ghc@9.12
    - https://gitlab.haskell.org/ghc/ghc
    - https://www.aosabook.org/en/v2/ghc.html
    - https://www.haskell.org/ghc/
    - https://www.haskell.org/ghc/download_ghc_9_12_1.html
  summary:
    - >
      The Homebrew `ghc@9.12` formula packages the GHC 9.12 branch of the Glasgow
      Haskell Compiler. It gives users a branch-specific compiler and interpreter set
      while preserving the same project lineage as the broader GHC package.
  timeline:
    - 'Early 1990s: GHC began as a Glasgow research project.'
    - >
      2007: The user guide documented GHC's even-numbered stable-branch versioning
      policy starting with GHC 6.8.
    - '2024: GHC 9.12.1 was released as the first listed 9.12 release on the GHC download page.'
    - '2026 batch input: The Homebrew package record listed 9.12.3-suffixed executables.'
  usage:
    - >
      A practitioner installs `ghc@9.12` when a project, package bound, or CI job
      targets GHC 9.12. The package supplies compiler, REPL, package-database, script
      runner, profiling, and Haddock commands with versioned executable names available
      for precise invocation.
    - >
      The underlying GHC workflow is unchanged: use `ghc` for batch compilation, `ghci`
      for interactive exploration, and build tools such as Cabal or Stack to coordinate
      flags, dependencies, and package databases.
related-packages:
  - id: brew:ghcup
    reason: >
      Use GHCup when you need to install and switch among multiple GHC releases instead
      of managing one Homebrew compiler branch.
    rel: adjacent_workflow
    sources:
      - https://www.haskell.org/ghcup/guide/
  - id: brew:cabal-install
    reason: >
      cabal-install resolves dependencies and drives GHC to build, test, and run Cabal
      projects.
    rel: adjacent_workflow
    sources:
      - https://cabal.readthedocs.io/en/stable/getting-started.html
      - https://www.haskell.org/ghc/download_ghc_9_12_1.html
  - id: brew:haskell-stack
    reason: >
      Stack selects a GHC toolchain and uses it for snapshot-oriented Haskell builds,
      tests, and interactive sessions.
    rel: adjacent_workflow
    sources:
      - https://docs.haskellstack.org/en/stable/
  - id: brew:haskell-language-server
    reason: >
      Haskell Language Server adds editor diagnostics and completion through binaries
      selected to match the project's GHC version.
    rel: adjacent_workflow
    sources:
      - https://haskell-language-server.readthedocs.io/en/stable/what-is-hls.html
