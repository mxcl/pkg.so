history:
  adoption-history:
    - >
      Grammarly began as a grammar checker and expanded into a broader writing and
      communication assistant. Its official history describes growth from a
      student-focused checker into an AI partner used across many applications and
      websites.
    - >
      The 2021 desktop generation broadened adoption beyond a dedicated editor and
      browser extension by placing real-time suggestions in native desktop applications
      and web writing surfaces.
  package-nerd-significance:
    - >
      The desktop application illustrates the shift from editor-specific proofreading
      add-ons to a system-spanning writing layer. For Mac package users, the cask turns
      Grammarly's graphical installer into a repeatable desktop-software installation,
      while the service itself remains proprietary and account-backed.
  project-history:
    - >
      Max Lytvyn, Alex Shevchenko, and Dmytro Lider founded Grammarly in 2009 to help
      people communicate more effectively. The product evolved from grammar checking
      toward contextual writing assistance based on natural-language processing and
      machine learning.
    - >
      Grammarly introduced its new all-in-one application for Windows and Mac in 2021.
      It was designed to supply real-time correctness, clarity, vocabulary, and tone
      suggestions across browsers and native applications rather than only inside a
      standalone editor.
    - >
      Grammarly remains a product brand within the broader Superhuman suite following
      the company's later expansion, while continuing to provide cross-application
      writing assistance.
  related-projects:
    - Grammarly Editor
    - Grammarly browser extension
    - Grammarly for Windows
    - Superhuman
  sources:
    - https://support.grammarly.com/hc/en-us/articles/115000090792-What-is-Grammarly
    - >
      https://support.grammarly.com/hc/en-us/articles/360047727871-How-to-install-Grammarly-on-a-desktop-computer
    - https://www.grammarly.com/about
    - https://www.grammarly.com/blog/product/introducing-grammarly-for-mac-windows/
  summary:
    - >
      Grammarly for Mac is Grammarly's proprietary desktop writing assistant. It
      supplies writing and AI assistance across supported macOS applications and
      websites rather than requiring users to compose exclusively in a dedicated editor.
  timeline:
    - '2009: Max Lytvyn, Alex Shevchenko, and Dmytro Lider founded Grammarly.'
    - '2021: Grammarly introduced its new all-in-one desktop application for Windows and Mac.'
    - >
      2025: Grammarly expanded through acquisitions as it evolved toward the broader
      Superhuman productivity suite.
  usage:
    - >
      Install the Mac application, sign in, and type in a supported application or
      website. Grammarly appears as an in-context interface offering corrections,
      rewrites, tone guidance, and other writing assistance.
    - >
      The desktop product is useful for writers who want consistent assistance across
      tools such as browsers, email, documents, presentations, and workplace messaging
      applications.
