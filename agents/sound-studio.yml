history:
  adoption-history:
    - >
      Sound Studio has remained available across the transition from Classic Mac OS
      through modern macOS and Apple silicon. Its official version archive preserves
      builds for older operating systems, reflecting the compatibility needs of
      long-lived Mac audio workflows.
  package-nerd-significance:
    - >
      Sound Studio is a veteran Mac-native audio package whose lineage predates macOS.
      It appeals to users who want a focused waveform editor and recorder rather than a
      large digital audio workstation, while still supporting automation and a broad
      collection of audio formats.
  project-history:
    - >
      Sound Studio was first released in 1999 for Classic Mac OS. Felt Tip continued the
      application through successive Mac hardware and operating-system transitions, with
      Sound Studio 4 supporting contemporary macOS and Apple silicon.
  related-projects:
    - >
      Audacity occupies the same recording-and-waveform-editing category but is open
      source and available across macOS, Windows, and Linux.
  sources:
    - https://www.felttip.com/ss/
    - https://www.felttip.com/ss/Sound-Studio-4-Manual.pdf
    - https://www.felttip.com/ss/archive.html
  summary:
    - Sound Studio is Felt Tip's long-running Mac audio recorder and waveform editor.
  timeline:
    - '1999: Sound Studio was first released for Classic Mac OS.'
    - '2010: The official archive records the final Sound Studio 3 release.'
    - >
      2025: Felt Tip's version archive lists a modern Sound Studio 4 build for Apple
      silicon and Intel Macs.
  usage:
    - >
      Users digitize tapes or vinyl, make live recordings, edit podcasts, music,
      interviews, and presentations, apply effects and crossfades, and export to common
      audio formats.
    - >
      Sound Studio also supports batch processing through Automator or AppleScript,
      making it useful for repeatable Mac-centric audio conversion and editing tasks.
related-packages:
  - id: cask:audacity
    reason: >
      Choose Audacity when you need a free, open-source, multi-track recorder and editor
      that also runs on Windows and Linux; Sound Studio is the more Mac-specific
      alternative.
    rel: alternative
    sources:
      - https://www.felttip.com/ss/
      - https://github.com/audacity/audacity
      - https://www.audacityteam.org/faq/
