history:
  adoption-history:
    - >
      Transfer is distributed to macOS package-manager users through the Homebrew cask
      named `transfer`, according to `source_facts.package-manager`. Its primary
      audience is network and IT administrators rather than general-purpose file-sharing
      users.
  package-nerd-significance:
    - >
      Transfer packages several traditionally separate Unix-style file-transfer services
      behind a native macOS interface. It is useful when provisioning network equipment,
      moving configuration files, installing firmware, or retrieving logs without
      maintaining separate server daemons.
  project-history:
    - >
      Intuitibits released Transfer 1.0 in June 2019 as a macOS file-transfer server.
      The product began with TFTP-oriented administration use cases, added FTP and SFTP
      in version 2.0, HTTP and IPv6 in version 2.1, and HTTPS in version 2.4.
  related-projects:
    - >
      Its protocol coverage overlaps with standalone TFTP, FTP, SFTP, HTTP, and HTTPS
      servers, while its native GUI and shared root-directory workflow distinguish it
      from command-line daemons.
  sources:
    - Homebrew cask identity supplied by `source_facts.package-manager`.
    - 'Official product documentation: https://docs.intuitibits.com/transfer/about'
    - 'Official release notes: https://www.intuitibits.com/release-notes/transfer/'
  summary:
    - >
      Transfer is a proprietary macOS application from Intuitibits that turns a Mac into
      a TFTP, SFTP, FTP, HTTP, or HTTPS file server. It presents the server root and
      transfer history through a native graphical interface.
  timeline:
    - '2019: Transfer 1.0 was released.'
    - '2021: Version 2.0 added FTP and SFTP servers.'
    - '2022: Version 2.1 added HTTP and IPv6 support.'
    - '2026: Version 2.4 added HTTPS support.'
  usage:
    - >
      Administrators select a root directory, enable the required protocols, and let
      network devices upload or download firmware, configuration files, and logs. The
      application records completed and failed transfers and can export that history as
      CSV.
