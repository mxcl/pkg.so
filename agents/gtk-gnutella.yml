config-file-location:
  unix:
    - ~/.gtk-gnutella/config_gnet
    - ~/.gtk-gnutella/config_gui
credentials-file-location: null
history:
  adoption-history:
    - >
      gtk-gnutella was adopted as a Unix/Gtk alternative to the better-known Windows-era
      Gnutella clients, but its release notes show explicit interoperability work with
      BearShare, LimeWire, Shareaza, Gnutella Web Cache, ultrapeers, and network
      extensions. The 0.93 release history also lists Debian, Red Hat, SuSE, Mandrake,
      and Slackware packages or source packages, reflecting the way it circulated
      through Unix packaging channels as well as upstream tarballs.
    - >
      The project remained attractive to package maintainers because it was not a
      wrapper around a proprietary service: it implemented the open Gnutella network
      stack, shipped source, and exposed many tunables for firewalls, bandwidth, peer
      mode, downloads, uploads, and network statistics.
  package-nerd-significance:
    - >
      gtk-gnutella is package-nerd interesting because it preserves a whole P2P network
      implementation in a traditional Unix desktop package. It pulls together GUI
      toolkit concerns, network bootstrapping, firewall and NAT behavior, file hashing,
      partial-download recovery, internationalized queries, and distribution packaging.
    - >
      It is also a good example of why old GUI network clients can be more than
      nostalgic leaf packages: their release notes encode protocol churn, peer
      compatibility, and safety tradeoffs from a decentralized network era. For Homebrew
      and other package indexes, the formula marks a surviving buildable artifact of the
      Gnutella ecosystem rather than a mere GTK demo.
  project-history:
    - >
      The project identifies its long-running authorship as Yann Grossel, Raphael
      Manfredi, and contributors beginning in 2000. Its public release history shows
      stable releases by 0.85 in April 2002 and 0.90 in July 2002, already covering GUI
      configuration, bandwidth management, SHA1/URN search, Gnutella Hash/URN
      extensions, traffic compression, and automatic bans for abusive servents.
    - >
      The 2002-2004 releases track the broader evolution of the Gnutella network.
      Version 0.91 added HTTP/1.1, download swarming, alternate-source collection,
      Gnutella Web Cache bootstrapping, expert mode, and more detailed packet
      statistics. Version 0.92 added ultrapeer support, partial-file sharing, PARQ, GGEP
      handling, vendor-specific messages, and asynchronous DNS for web caches. Version
      0.95 described 0.94 as deprecated for Gnutella network health and added dynamic
      querying, out-of-band query hits, UDP transport, high outdegree behavior, better
      firewall detection, and large-file support.
    - >
      The project later moved source hosting to GitHub while keeping the SourceForge
      site as its main project and documentation surface. Its Git guide documents the
      public Git repository, the stable master branch, and a devel branch used for
      testing new features before release.
  related-projects:
    - Gnutella is the peer-to-peer network and protocol family gtk-gnutella implements.
    - >
      BearShare, LimeWire, and Shareaza appear in upstream release notes as
      compatibility targets.
    - GTK is the GUI toolkit used for the client interface.
    - >
      Gnutella Web Cache, ultrapeers, PARQ, GGEP, SHA1 URNs, and magnet links are
      protocol or ecosystem pieces that shaped gtk-gnutella's implementation.
  sources:
    - https://gtk-gnutella.sourceforge.io/?page=docs
    - https://gtk-gnutella.sourceforge.io/?page=git_quick_guide
    - https://gtk-gnutella.sourceforge.io/?page=news_old
    - https://gtk-gnutella.sourceforge.io/?page=release_history
    - https://gtk-gnutella.sourceforge.io/manual/firsttime.html
  summary:
    - >
      gtk-gnutella is a graphical Unix Gnutella servent: a peer-to-peer file-sharing
      client that combines a GTK interface with a native implementation of the Gnutella
      protocol. In packaging terms it belongs to the early-2000s class of desktop P2P
      clients that were useful to users but unusually network-protocol-heavy for a GUI
      application.
  timeline:
    - '2000: Project authorship begins as credited on the official site.'
    - >
      2002-04-04: Version 0.85 stable release documents traffic prioritization, flow
      control, proxies, search statistics, persistent upload statistics, and
      configurable bandwidth management.
    - >
      2002-07-07: Version 0.90 stable release adds GUI configuration, URN/SHA1 search,
      Gnutella bandwidth management, HUGE support, and traffic compression.
    - >
      2002-10-19: Version 0.91 adds HTTP/1.1, download swarming, Gnutella Web Cache
      bootstrapping, expert mode, and richer packet statistics.
    - >
      2003-06-15: Version 0.92 adds ultrapeer support, partial-file sharing, PARQ, GGEP
      support, and asynchronous DNS for Gnutella web caches.
    - >
      2004-11-27: Version 0.95 adds dynamic querying, out-of-band query hits, UDP
      transport, improved firewall detection, and large-file support.
    - '2011-12-11: Version 0.98 is described as a major release adding IPv6-ready features.'
    - >
      2021-07-12: Version 1.2.1 notes the project IRC move to Libera.Chat and sets a
      cutoff for very old versions connecting.
  usage:
    - >
      A user launches gtk-gnutella, connects to GnutellaNet, searches for files, shares
      selected local files, and manages downloads and uploads through the GTK interface.
      The manual describes the first-run experience as network-heavy because the client
      must discover peers; once enough nodes are found it reports a connected state and
      then keeps the peer-to-peer session alive.
    - >
      The package is not just a point-and-click front end. Its history includes expert
      settings, remote shell support, download mesh behavior, packet statistics, host
      caches, firewalled-host handling, ultrapeer/leaf behavior, and careful bandwidth
      accounting, all of which matter when packaging or debugging it on Unix-like
      systems.
related-packages:
