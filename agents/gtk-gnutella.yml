    reason: >
      Choose Transmission when the files are distributed through BitTorrent rather than
      Gnutella; it provides maintained native desktop clients and a distinct BitTorrent
      peer-and-tracker workflow.
    rel: alternative
    sources:
      - https://gtk-gnutella.sourceforge.io/
      - https://transmissionbt.com/
