history:
  adoption-history:
    - >
      The CLI's adoption follows LiveKit's developer adoption rather than a separate
      ecosystem. As LiveKit became a self-hostable and managed realtime stack, the CLI
      became the practical bridge between package-manager installation and day-to-day
      project setup.
    - >
      By June 2024, LiveKit said its platform was used by more than 20,000 developers;
      the CLI sits in that workflow as a setup and management tool for both cloud
      projects and local/self-hosted testing.
  package-nerd-significance:
    - >
      livekit-cli is a good example of a modern infrastructure CLI that is both a
      package-manager binary and a cloud control surface. Its aliases and package names
      matter because users may invoke either livekit-cli or lk depending on installation
      path and documentation vintage.
    - >
      For package maintainers, it combines typical Go CLI distribution with multimedia
      build considerations: the README notes audio and console subsystem dependencies
      around CGO, PortAudio, and WebRTC audio processing for source builds.
  project-history:
    - >
      The livekit/livekit-cli repository was created on May 10, 2021, shortly before
      LiveKit's public launch in July 2021. The CLI grew alongside LiveKit's open source
      SFU and SDK ecosystem as the project moved from realtime audio/video
      infrastructure toward a broader agent and voice-AI platform.
    - >
      LiveKit documentation describes the CLI, invoked as lk, as the primary interface
      for managing LiveKit Cloud projects, creating applications from templates, and
      deploying agents. The GitHub README also documents older core workflows such as
      token generation, room APIs, egress management, participant simulation, and load
      testing.
  related-projects:
    - >
      The CLI is related to the LiveKit server, LiveKit Cloud, LiveKit Agents, client
      SDKs, server SDKs, egress, ingress, SIP, and LiveKit app template repositories.
  sources:
    - https://api.github.com/repos/livekit/livekit-cli
    - https://docs.livekit.io/reference/developer-tools/livekit-cli/
    - https://github.com/livekit/livekit-cli
    - https://livekit.com/blog/and-were-live-kit
    - https://livekit.com/blog/livekit-series-a
  summary:
    - >
      LiveKit CLI is the terminal interface for LiveKit projects. It packages common
      developer and operator workflows around LiveKit Cloud, self-hosted LiveKit
      servers, access tokens, rooms, egress, load testing, app templates, and agents.
  timeline:
    - '2021-05-10: The livekit/livekit-cli repository was created.'
    - >
      2021-07-07: LiveKit was publicly introduced as open source realtime audio/video
      infrastructure.
    - '2024-06-04: LiveKit reported more than 20,000 developers using the platform.'
    - >
      2026-06-30: The livekit/livekit-cli repository showed active updates through
      GitHub metadata.
  usage:
    - >
      Developers install LiveKit CLI with Homebrew, a shell installer, winget, or source
      builds. The documented precedence order for command parameters is command-line
      flags, environment variables, local configuration files such as ./livekit.toml,
      and then default project configuration.
    - >
      The CLI can create access tokens, call LiveKit APIs, join rooms as a participant,
      publish demo media, start and manage egresses, run load tests, create app
      templates, authenticate to LiveKit Cloud, and deploy agents.
related-packages:
