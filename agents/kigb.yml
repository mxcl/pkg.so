history:
  adoption-history:
    - >
      KiGB became known for an unusually strong compatibility claim: its official page
      says every released Game Boy and Game Boy Color title had been tested as
      compatible with the current release. It is distributed within Richard Bannister's
      collection of classic-system emulators for macOS.
  package-nerd-significance:
    - >
      KiGB is notable to emulator enthusiasts for prioritizing compatibility and
      supporting less-common hardware features such as Super Game Boy behavior,
      cartridge motion sensors, and cheat devices. Its presence in Homebrew Cask also
      makes an older-style desktop emulator installable through a modern package
      workflow.
  project-history:
    - >
      KiGB is a Game Boy and Game Boy Color emulator presented through Richard
      Bannister's official macOS emulator collection. The documented 2.0.9 release
      includes optional Super Game Boy emulation, motion-sensor support, and Game Genie
      and Game Shark support.
  related-projects:
    - >
      Emulator Enhancer is an optional companion add-on providing joystick, full-screen,
      audio-effect, and recent-game features.
    - >
      Boycott Advance is the same publisher's separate Game Boy Advance emulator; its
      official page directs classic Game Boy users to KiGB.
  sources:
    - https://www.bannister.org/software/ba.htm
    - https://www.bannister.org/software/index_emulators.htm
    - https://www.bannister.org/software/kigb.htm
  summary:
    - KiGB is a native macOS emulator for Nintendo Game Boy and Game Boy Color software.
  timeline:
    - '2.0.9: Officially documented release available from the Bannister software site.'
  usage:
    - >
      Users open legally obtained Game Boy or Game Boy Color software in KiGB. Optional
      Emulator Enhancer support adds gamepads, full-screen operation, audio effects, and
      convenient access to recent games.
