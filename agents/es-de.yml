credentials-file-location: null
history:
  adoption-history:
    - >
      ES-DE expanded the EmulationStation-style frontend into a supported desktop
      product for Linux, macOS, and Windows, later adding Android and Haiku support. Its
      official releases include portable and installer builds as well as
      architecture-specific AppImages.
    - >
      The application is commonly paired with RetroArch and standalone emulators.
      Preconfigured system definitions, a built-in scraper, and a theme downloader
      reduce the setup normally required for a multi-emulator library.
  package-nerd-significance:
    - >
      ES-DE separates the polished library frontend from the emulators that actually
      execute games. Package maintainers can therefore update the browsing, metadata,
      theme, and launcher layer without bundling every emulator or ROM.
    - >
      Its XML-based system definitions and per-user override files are useful to
      enthusiasts who maintain unusual emulator layouts, portable installations, or
      large cross-platform game collections.
  project-history:
    - >
      ES-DE began as EmulationStation Desktop Edition, a desktop-focused fork in the
      wider EmulationStation family. It retained compatibility with established
      EmulationStation concepts while developing its own cross-platform interface,
      scraper, theme engine, and extensive emulator definitions.
    - >
      The project later shortened its public branding to ES-DE. Version 3-era releases
      also moved current application data from the older hidden `.emulationstation`
      directory to the visible `~/ES-DE` directory.
  related-projects:
    - EmulationStation is the upstream design lineage.
    - RetroArch supplies many of the emulator cores used in common ES-DE setups.
    - The project maintains a separate official themes-list repository.
  sources:
    - https://gitlab.com/es-de/emulationstation-de
    - https://gitlab.com/es-de/emulationstation-de/-/blob/master/INSTALL.md
    - https://gitlab.com/es-de/emulationstation-de/-/blob/master/USERGUIDE.md
    - https://www.es-de.org/
  summary:
    - >
      ES-DE is a customizable cross-platform frontend that organizes, enriches, browses,
      and launches games through separately installed emulators and game engines.
  timeline:
    - >
      2024: The 3.0 generation moved current application data to `~/ES-DE` and adopted
      the shortened ES-DE branding.
    - '2026: ES-DE continued supporting Android, Linux, macOS, Windows, and Haiku.'
  usage:
    - >
      On first launch ES-DE creates its application-data directory and can generate a
      platform-organized ROM directory tree. Users then add games, install the required
      emulators or RetroArch cores, scrape metadata and media, select a theme, and
      launch titles from a controller-friendly library.
    - >
      Most settings should be changed through the UI. Advanced users can edit
      `es_settings.xml` or add complementary system definitions under `custom_systems`
      rather than modifying bundled definitions.
