credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as signed, notarized macOS software and documents
      Homebrew Cask installation with `brew install --cask qlmarkdown`. Its official
      release history shows continued development of Markdown rendering and macOS
      integration.
  package-nerd-significance:
    - >
      QLMarkdown fills a small but familiar macOS packaging niche: restoring rich Finder
      Quick Look previews for a developer-oriented text format. It is also useful for
      testing packaging details specific to app extensions, notarization, group
      containers, and Quick Look discovery.
  project-history:
    - >
      QLMarkdown was created as a macOS application centered on a Quick Look extension
      for Markdown. It later grew to include a configurable preview renderer, a
      Markdown-to-HTML command-line tool, and an experimental Shortcuts extension.
    - >
      Its renderer uses cmark-gfm and adds optional facilities such as syntax
      highlighting, mathematics, Mermaid diagrams, tables, task lists, wiki links, and
      YAML-header rendering.
  related-projects:
    - cmark-gfm, the Markdown parser on which QLMarkdown bases its rendering.
    - >
      Apple Quick Look and Shortcuts, the macOS extension systems integrated by the
      application.
  sources:
    - https://github.com/sbarex/QLMarkdown#readme
    - https://github.com/sbarex/QLMarkdown/releases
    - source_facts.package-manager
  summary:
    - >
      QLMarkdown is a macOS Quick Look extension and companion application for
      previewing Markdown-family documents and configuring how those previews are
      rendered.
  timeline:
    - >
      Later releases: The project added a configurable graphical application, CLI
      conversion, Shortcuts support, notarized builds, and expanded Markdown extensions.
  usage:
    - >
      After installation, users launch the application once so macOS discovers the Quick
      Look extension, then preview Markdown files from Finder. The companion interface
      controls themes and rendering extensions; the CLI can convert Markdown to HTML.
