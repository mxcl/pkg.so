history:
  adoption-history:
    - >
      AirDroid evolved from an Android-oriented personal device companion into a product
      family serving consumers, families, support teams, and managed-device fleets.
      Official materials describe more than twelve years of experience and separate
      Personal, Business, Cast, Remote Support, and Parental Control offerings.
    - >
      The vendor reports recognition in G2 Grid reports from 2021 through 2024 and
      positions AirDroid as a global device-management and remote-access suite.
  package-nerd-significance:
    - >
      AirDroid exemplifies the shift from a single desktop/mobile companion into a
      multi-product, account-backed device-management platform. For package users, the
      desktop Cask supplies the local endpoint while pairing, remote access, file
      movement, notifications, and management depend on companion apps and vendor
      services.
  project-history:
    - >
      Sand Studio was established in Singapore in 2011 and began developing the original
      AirDroid application that year. The original personal product connected computers
      with Android devices for management and remote workflows; the brand later expanded
      into enterprise MDM, screen casting, remote support, and parental-control
      products.
  related-projects:
    - AirDroid Personal
    - AirDroid Business
    - AirDroid Cast
    - AirDroid Remote Support
    - AirDroid Parental Control
  sources:
    - https://help.airdroid.com/hc/en-us
    - https://www.airdroid.com/
    - https://www.airdroid.com/about-us/
  summary:
    - >
      AirDroid is Sand Studio's family of device-management, remote-control,
      remote-support, and screen-casting applications. The desktop client participates
      in workflows connecting computers with mobile devices for remote access, file
      transfer, notifications, and device administration.
  timeline:
    - >
      2011: Sand Studio was established in Singapore and development of the original
      AirDroid app began
    - '2010s: AirDroid expanded beyond its original personal Android companion'
    - '2021–2024: AirDroid reported repeated recognition in G2 Grid reports'
    - >
      2020s: The family encompassed Personal, Business, Cast, Remote Support, and
      Parental Control products
  usage:
    - >
      Personal users connect the desktop client with mobile devices to transfer files,
      mirror or control supported devices, and manage phone content and notifications.
      Organizations use the related Business and Remote Support products for fleet
      administration and assistance. Account or pairing credentials are handled through
      the applications; no official credentials-file path is documented.
