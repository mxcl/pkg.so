config-file-location:
  macos:
    - ~/Library/Preferences/Aquamacs Emacs/customizations.el
    - ~/Library/Preferences/Aquamacs Emacs/Preferences.el
    - ~/.emacs.el
    - ~/.emacs
credentials-file-location: null
history:
  adoption-history:
    - >
      Aquamacs found a niche among macOS users who wanted Emacs' editing and extension
      ecosystem while retaining familiar Mac conventions such as Command-key shortcuts,
      standard menus, tabs, and document-oriented windows.
    - >
      It has also been used as a packaged route to Emacs-based tools such as AUCTeX on
      macOS, with the project shipping and updating selected Emacs Lisp packages as part
      of its application releases.
  package-nerd-significance:
    - >
      Aquamacs demonstrates how a deeply Unix-oriented, Lisp-extensible editor can be
      repackaged as a conventional macOS application without removing traditional Emacs
      workflows.
    - >
      Its coexistence of Aquamacs-specific preference files with ~/.emacs and
      ~/.emacs.el matters to users moving configurations between GNU Emacs
      distributions.
  project-history:
    - >
      Aquamacs is a macOS-focused distribution and customization of GNU Emacs intended
      to feel natural to users of graphical Mac applications.
    - >
      The official development page credits David Reitter as the principal developer and
      Kevin Walzer as a project co-founder who wrote the initial documentation,
      alongside many other contributors.
    - >
      The project continued tracking GNU Emacs while maintaining macOS integration,
      application signing and notarization, bundled packages, and its own preferences
      and customization layer.
  related-projects:
    - GNU Emacs is Aquamacs' upstream editor.
    - >
      AUCTeX is among the bundled Emacs Lisp packages specifically mentioned in official
      Aquamacs release notes.
  sources:
    - 'Official About page: https://aquamacs.org/about/'
    - 'Official Development page: https://aquamacs.org/development/'
    - 'Official Downloads page: https://aquamacs.org/downloads/'
    - 'Official Help page: https://aquamacs.org/help/'
  summary:
    - >
      Aquamacs is a macOS-oriented GNU Emacs distribution that combines Emacs editing
      and extensibility with native Mac interaction conventions.
  timeline:
    - >
      Project origins: David Reitter led Aquamacs development; Kevin Walzer co-founded
      the project and produced its initial documentation.
    - '2019: Aquamacs 3.5 was announced on the official project site.'
    - >
      Aquamacs 3.6: The application added updated bundled packages and fully signed and
      notarized distribution.
  usage:
    - >
      Users edit text and source code with either traditional Emacs key bindings or
      familiar macOS shortcuts and menus.
    - >
      Configuration can be stored in Aquamacs-specific files under
      ~/Library/Preferences/Aquamacs Emacs or in conventional personal Emacs files such
      as ~/.emacs and ~/.emacs.el.
