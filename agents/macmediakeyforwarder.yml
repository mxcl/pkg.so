history:
  adoption-history:
    - >
      The original application attracted contributions for localization,
      external-keyboard support, Touch Bar behavior, login startup, and compatibility
      with successive macOS security changes. The original maintainer later directed
      users to Quentin Le Sceller's fork for current versions and bug fixes.
  package-nerd-significance:
    - >
      Mac Media Key Forwarder addresses a characteristic desktop integration problem:
      ensuring global hardware media keys control the music player the user intends. Its
      evolution tracks changes in macOS event taps, Accessibility authorization,
      Automation authorization, iTunes-to-Apple-Music naming, and system media-key
      routing.
  project-history:
    - >
      The project began in Milgra's repository as a small menu-bar application for
      directing media keys to iTunes or Spotify. Releases gradually added explicit
      player priority, external-keyboard compatibility, pause behavior, localization,
      launch-at-login support, Mojave permission guidance, Catalina compatibility, and
      the ability to hide the menu icon.
    - >
      Maintenance subsequently moved to Quentin Le Sceller's fork; the original official
      README explicitly directs users there for the latest releases and bug fixes.
  related-projects:
    - The original README suggests BeardedSpice for users who need broader control.
    - The application targets Apple Music, formerly iTunes, and Spotify.
  sources:
    - >
      Current official repository README:
      https://github.com/quentinlesceller/macmediakeyforwarder#readme
    - 'Original official releases: https://github.com/milgra/macmediakeyforwarder/releases'
    - >
      Original official repository README and changelog:
      https://github.com/milgra/macmediakeyforwarder#readme
  summary:
    - >
      Mac Media Key Forwarder is a macOS menu-bar utility that intercepts hardware media
      keys and directs them to Apple Music or Spotify. The currently packaged project
      continues a utility originally developed in Milgra's repository.
  timeline:
    - 'Version 1.5: Added explicit prioritization of iTunes or Spotify.'
    - 'Version 1.8: Added pause controls and automatic fallback to normal macOS behavior.'
    - 'Version 1.9: Added an Open at Login option.'
    - >
      Version 2.0: Adopted the Mac Media Key Forwarder name and documented newer macOS
      permissions.
    - 'Version 3.0: Added Catalina compatibility.'
    - 'Version 3.1: Added menu-icon hiding and French localization.'
  usage:
    - >
      The application runs in the menu bar. Users choose a preferred player or retain
      automatic behavior, then use the keyboard's play, pause, previous, next,
      fast-forward, and rewind controls. On relevant macOS releases, Accessibility and
      Automation permissions must be granted for event interception and player control.
