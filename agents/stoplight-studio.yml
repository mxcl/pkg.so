history:
  adoption-history:
    - >
      Studio was designed to complement existing file- and Git-based development
      practices. Its local application works offline with ordinary project folders,
      while Stoplight's browser workflow supports repositories and collaboration.
  package-nerd-significance:
    - >
      Studio packages a design-first OpenAPI workflow into a desktop application while
      keeping API descriptions as files that can be reviewed and versioned with normal
      Git tooling. It also brings Stoplight's Spectral validation and Prism mocking
      tools into one graphical workflow.
  project-history:
    - >
      Stoplight presented Studio as its next-generation application for API design,
      modeling, and technical writing, succeeding the company's earlier desktop wrapper
      with a workflow centered on local files and reusable API models.
  related-projects:
    - Spectral supplies style-guide validation and linting within Studio.
    - Prism supplies the local mock-server capability used for API projects.
    - Stoplight's hosted platform provides collaborative and publishing workflows.
  sources:
    - https://docs.stoplight.io/
    - https://github.com/stoplightio/desktop#readme
    - https://github.com/stoplightio/studio#readme
  summary:
    - >
      Stoplight Studio is a graphical editor for designing, validating, mocking, and
      documenting OpenAPI-based APIs.
  timeline:
    - >
      2019: Stoplight's public Studio repository began documenting the next-generation
      API design application.
  usage:
    - >
      Users create or open local API projects, edit OpenAPI 2 or 3 descriptions through
      form and code views, model JSON Schema, preview documentation, apply Spectral
      rules, and run automatically updated Prism mock servers. Project files can be
      committed with an ordinary Git client.
