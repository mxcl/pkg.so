history:
  adoption-history:
    - >
      Rathole is packaged for Homebrew, Alpine Linux, Nix, and Scoop, giving the Rust
      binary coverage across common server and workstation environments.
  package-nerd-significance:
    - >
      Rathole appeals to self-hosters and infrastructure-oriented package users as a
      compact, cross-platform reverse-tunneling binary. Its declarative TOML setup and
      optional transports make it a notable Rust alternative in the NAT-traversal tool
      family.
  project-history:
    - >
      Rathole was created as a secure, high-performance reverse proxy for exposing
      services located behind NAT. The project later moved under the rathole-org GitHub
      organization while preserving its Rust implementation and configuration-oriented
      client/server model.
    - >
      Development added multiple transport and security choices, service-level mappings,
      hot reload support, and platform packaging. The project describes itself in
      relation to reverse-tunneling tools such as frp and ngrok.
  related-projects:
    - frp is a related open-source reverse-proxy and tunneling system.
    - ngrok provides a managed tunneling service for exposing local endpoints.
  sources:
    - 'Official README: https://github.com/rathole-org/rathole#readme'
    - 'Official documentation: https://github.com/rathole-org/rathole/tree/main/docs'
    - source_facts.package-manager
  summary:
    - >
      Rathole is a Rust reverse proxy that creates tunnels between a public server and
      clients behind NAT, allowing otherwise unreachable services to be exposed through
      configured endpoints.
  timeline:
    - >
      Initial project: Rathole was published as a Rust client/server reverse-tunneling
      utility.
    - >
      Later development: The project moved to the rathole-org organization and expanded
      its transport, encryption, and reload capabilities.
  usage:
    - >
      Operators prepare TOML configuration files for the public server and private
      client, define matching services and tokens, then start each side with `rathole`
      and the relevant file. A configuration containing only a server or client section
      lets the program infer its mode; explicit `--server` and `--client` modes are also
      available.
    - >
      The documentation uses user-selected files such as `config.toml`; it does not
      prescribe a persistent platform-specific configuration or credentials-file
      location. Authentication tokens are normally values inside the chosen
      configuration.
