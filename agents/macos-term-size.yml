  summary:
    - >
      macos-term-size is a small C command-line utility that prints the current terminal
      window size on macOS.
  timeline:
    - '2017: Official GitHub repository created.'
    - '2023: Repository activity continued through commits pushed to the default branch.'
  usage:
    - >
      The command is installed as `terminal-size` and prints columns followed by rows.
      The README contrasts this with `tput cols`, showing that `terminal-size` keeps
      reporting the actual terminal size in situations where `tput` may fall back to a
      default.
