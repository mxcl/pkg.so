history:
  adoption-history:
    - >
      The maintained project is distributed as a native macOS application and through
      Homebrew Cask. Its support for common CBR and CBZ archives and its bundled Quick
      Look component fit established macOS comic-library workflows.
  package-nerd-significance:
    - >
      Simple Comic is a focused native alternative to larger ebook managers: it opens
      common comic archives, minimizes reader interaction, and integrates previews and
      thumbnails with macOS Quick Look.
  project-history:
    - >
      The current Simple Comic repository is a maintained fork of Andrew Rauchfuss's
      original project. Its maintainer explains that the fork continued development
      after maintenance of the original version ceased.
  related-projects:
    - Original arauchfuss/Simple-Comic project
    - Quick Comic Quick Look plug-in
  sources:
    - https://github.com/MaddTheSane/Simple-Comic
  summary:
    - >
      Simple Comic is an open-source, streamlined comic-book reader for macOS designed
      to reduce the interactions needed to browse a comic.
  timeline:
    - >
      The current maintained fork succeeded the original Simple Comic project after its
      maintainer became inactive.
    - Later development added Apple Live Text support on Apple Silicon Macs.
  usage:
    - >
      Users open comic archives such as CBR and CBZ files for page-oriented reading. The
      bundled Quick Comic component supplies Finder previews and thumbnails, while Live
      Text can make recognized comic text selectable for copying or speech.
