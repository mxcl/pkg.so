credentials-file-location: null
history:
  adoption-history:
    - >
      OpenChamber is offered through desktop and web interfaces, with documentation
      recommending desktop use for everyday macOS work and the web interface for remote
      or mobile review.
    - >
      Its installation through a Homebrew cask places the desktop application in the
      macOS package-manager workflow, while its CLI and server modes support Linux and
      remote installations.
  package-nerd-significance:
    - >
      OpenChamber adds a graphical control surface to a terminal-oriented coding agent.
      It exposes worktrees, diffs, terminals, agent progress, project actions, provider
      selection, and remote access in one workspace.
    - >
      Its mix of desktop application, local server, CLI, and native user-service
      integration makes it relevant to users who want reproducible AI coding
      environments without giving up Git and terminal workflows.
  project-history:
    - >
      OpenChamber was developed as a visual workspace around OpenCode. The project grew
      beyond a chat front end to cover project and worktree sessions, Git and GitHub
      workflows, terminals, remote access, extensions, provider configuration, and
      mobile access.
  related-projects:
    - OpenCode supplies the coding-agent server and stores AI-provider sign-ins.
    - >
      Git, GitHub, worktrees, MCP servers, and agent skills are integrated into the
      OpenChamber workflow.
  sources:
    - https://docs.openchamber.dev/
    - https://docs.openchamber.dev/environment/
    - https://docs.openchamber.dev/opencode-server/
    - https://docs.openchamber.dev/providers/
    - https://docs.openchamber.dev/quickstart/
    - source_facts.package-manager
  summary:
    - >
      OpenChamber is a visual workspace for supervising and steering OpenCode
      coding-agent sessions. It combines chat, terminals, Git changes, worktrees,
      project actions, and remote access.
  timeline:
    - >
      2026: Official documentation described a multi-interface workspace spanning
      desktop, web, mobile access, and OpenCode-backed agent sessions.
  usage:
    - >
      Users install or start OpenCode, launch OpenChamber, connect an AI provider, and
      manage coding sessions from the visual workspace. Common workflows include
      creating isolated worktree sessions, reviewing diffs, managing terminals, choosing
      agents and models, and opening remote access through a protected server or tunnel.
