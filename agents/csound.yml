config-file-location:
  unix:
    - $CSOUND6RC
    - .csound6rc
credentials-file-location: null
history:
  adoption-history:
    - >
      The canonical manual history says early Csound manuals started at MIT with Barry
      L. Vercoe and were maintained there through the 1980s and early 1990s, with
      material tracing back to Music11-era documents. It also records that MIT licensed
      Csound as LGPL in 2003, with the manual licensed GFDL and placed on SourceForge
      with the sources.
  package-nerd-significance:
    - >
      Csound is package-heavy in the old Unix sense: one formula installs a main
      executable plus many analysis and conversion utilities, plugin search paths, a
      library API, and documentation. That makes packaging choices around paths,
      opcodes, examples, and frontends unusually visible to users.
  project-history:
    - >
      The official repository README identifies Csound as a sound and music computing
      system and says the repository contains the core Csound library, command-line
      frontend, and code for embedded, mobile, and web ports. The README credits
      contributors from musicians, scientists, and programmers around the world.
  related-projects:
    - >
      The manual history connects Csound documentation to Music11, and the
      getting-started docs describe frontends such as QuteCsound as part of common use.
  sources:
    - https://github.com/csound/csound#readme
    - https://csound.com/docs/manual/PrefaceHistory.html
    - https://csound.com/docs/manual/PrefaceGettingStarted.html
    - https://csound.com/docs/manual/CommandUnifileParFile.html
    - https://formulae.brew.sh/formula/csound
  summary:
    - >
      Csound is a long-running sound and music computing system with a command-line
      compiler, runtime, libraries, plugins, and a reference manual. Its packaging
      significance comes from bridging computer-music history with modern Unix, desktop,
      mobile, and web builds.
  timeline:
    - '1980s: Early Csound manual work was started at MIT by Barry L. Vercoe.'
    - '1999: The official manual history mentions the version 4.16 reference manual.'
    - >
      2003: MIT licensed Csound as LGPL and placed sources on SourceForge with the GFDL
      manual.
    - '2004: The Canonical Manual was converted to DocBook/XML.'
    - >
      2026: The Csound repository README describes 6.x as EOL and the develop branch as
      Csound 7.x beta.
  usage:
    - >
      Official getting-started docs describe Csound as normally run from a command line
      or frontend, using .csd files that combine options, instruments, and score
      sections. The manual documents .csound6rc as a command-line parameter file read
      from HOME or the path in CSOUND6RC, then from the current directory with local
      options taking precedence.
related-packages:
  - id: cask:supercollider
    reason: >
      Choose SuperCollider when you prefer a Smalltalk-like live-coding language
      communicating with a separate synthesis server instead of Csound's orchestra,
      score, and opcode model.
    rel: alternative
    sources:
      - https://supercollider.github.io/
      - https://csound.com/
