history:
  adoption-history:
    - >
      DockMate was sold as a lightweight macOS utility with a one-week trial and a
      perpetual license. Its 2021 release line supported Intel and Apple Silicon Macs
      and macOS Mojave through Big Sur or Monterey, depending on the official page
      consulted.
  package-nerd-significance:
    - >
      DockMate is an early polished example of adding Windows-like thumbnail previews to
      Apple's Dock without replacing it. Its specialized Calendar and media integrations
      distinguish it from utilities that provide only generic window thumbnails.
  project-history:
    - >
      macEnhance developed DockMate as a companion to its cDock customization utility,
      while keeping DockMate usable with Apple's standard Dock and with System Integrity
      Protection enabled. The 2021 releases expanded it beyond window thumbnails with
      native Apple Silicon support, calendar previews, meeting links, media controls,
      configurable gestures, and multi-monitor improvements.
  related-projects:
    - cDock
    - IconChamp
    - MacForge
  sources:
    - 'Official FAQ: https://www.macenhance.com/docs/dockmate/faq.html'
    - 'Official macEnhance blog: https://www.macenhance.com/blog/2020/helloworld.html'
    - 'Official product page: https://www.macenhance.com/dockmate.html'
    - 'Official release notes: https://www.macenhance.com/docs/dockmate/changes.html'
  summary:
    - >
      DockMate is a commercial macOS utility that adds hover previews and window
      controls to application icons in the Dock.
  timeline:
    - '2020: macEnhance described DockMate as an actively developed companion to cDock.'
    - >
      2021: Version 0.8.2 added native Apple Silicon support, Calendar and Fantastical
      previews, and meeting links.
    - '2021: Version 0.8.7 added preview sorting and configurable swipe or scroll actions.'
  usage:
    - >
      Users hover over an application icon to inspect its windows, focus a window, or
      perform actions such as minimize, maximize, close, and open. Optional views expose
      calendar events, meeting links, and playback controls. Automation, Screen
      Recording, and optionally Calendar permissions are required for the corresponding
      features.
