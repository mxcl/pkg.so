history:
  adoption-history:
    - >
      Tencent reported that WeCom reached 180 million active users and more than 10
      million companies and organizations during 2021.
    - >
      Its growth was tied to enterprise digitalization and interoperability with Weixin,
      allowing organizations to communicate with customers who use Weixin without
      requiring those customers to install WeCom.
  package-nerd-significance:
    - >
      The Homebrew cask packages Tencent's proprietary macOS enterprise client. It is
      operationally useful for teams that standardize workstation setup through
      package-manager manifests.
    - >
      Unlike consumer WeChat, WeCom combines communication with managed business
      identity, office applications, APIs, and enterprise-owned customer relationships.
  project-history:
    - >
      Tencent launched WeCom in 2016 as an enterprise communication and
      office-collaboration platform. It combines messaging with lightweight
      office-automation applications and integrations with the wider Weixin ecosystem.
    - >
      By the WeCom 4.0 launch in January 2022, Tencent had deepened integration with
      Tencent Docs, Tencent Meeting, Weixin Channels, Official Accounts, Mini Programs,
      Search, and payments.
  related-projects:
    - Weixin/WeChat, with which WeCom supports customer communication.
    - Tencent Docs and Tencent Meeting.
    - Weixin Mini Programs and Weixin Pay.
  sources:
    - https://work.weixin.qq.com/
    - https://www.tencent.com/en-us/articles/2201273.html
    - https://www.tencent.com/products/wecom/
    - source_facts.package-manager
  summary:
    - >
      WeCom is Tencent's enterprise messaging, collaboration, and office-automation
      platform, formerly commonly identified with Enterprise WeChat.
  timeline:
    - '2016: Tencent launched WeCom.'
    - >
      2021: The service reached 180 million active users across more than 10 million
      companies and organizations, according to Tencent.
    - >
      2022-01: WeCom 4.0 launched with deeper Tencent Docs, Tencent Meeting, and Weixin
      integration.
  usage:
    - >
      Organizations use WeCom for employee messaging and calling, address books, office
      workflows, managed applications, and customer communication through Weixin.
    - >
      Developers and administrators can integrate internal applications using the
      platform's APIs and third-party application ecosystem.
