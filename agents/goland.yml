credentials-file-location: null
history:
  adoption-history:
    - >
      GoLand entered JetBrains's commercial IDE lineup as the dedicated Go counterpart
      to products such as PyCharm and IntelliJ IDEA. It also joined the JetBrains All
      Products Pack, while related Go functionality remained available through the Go
      plugin in IntelliJ IDEA Ultimate.
    - >
      The IDE became a common option for Go developers wanting an integrated debugger,
      test runner, refactoring tools, database tooling, web-development support, and
      JetBrains's shared plugin ecosystem. JetBrains maintains a regular major-release
      cadence with intervening maintenance updates.
  package-nerd-significance:
    - >
      GoLand is a representative JetBrains desktop package: a versioned IntelliJ
      Platform application with per-release configuration directories, bundled runtime
      components, plugins, caches, and logs. Package managers primarily automate
      installation of JetBrains's proprietary upstream builds rather than compile the
      IDE from source.
  project-history:
    - >
      JetBrains announced a new IntelliJ Platform-based Go IDE under the codename
      Gogland in December 2016. During its Early Access Program, JetBrains selected
      GoLand as the final product name.
    - >
      GoLand 2017.3 was officially released on 30 November 2017. The initial commercial
      release combined Go-aware completion, inspections, navigation, refactoring,
      testing, coverage, and debugging with JetBrains platform facilities for version
      control, databases, terminals, Docker, and web development.
  related-projects:
    - >
      IntelliJ IDEA Ultimate can provide related Go functionality through JetBrains's Go
      plugin.
    - >
      GoLand is built on the IntelliJ Platform and shares settings, plugin concepts, and
      user-interface conventions with other JetBrains IDEs.
    - Delve supplies the underlying debugger used for Go debugging workflows.
  sources:
    - 'Official GoLand documentation: https://www.jetbrains.com/help/go/'
    - >
      Official GoLand naming announcement:
      https://blog.jetbrains.com/go/2017/11/02/announcing-goland-former-gogland-eap-18-final-product-name-templates-support-and-more/
    - >
      Official Gogland announcement:
      https://blog.jetbrains.com/go/2016/12/15/announcing-gogland-brand-new-go-ide-from-jetbrains/
    - >
      Official first-release announcement:
      https://blog.jetbrains.com/go/2017/11/30/the-way-to-go-jetbrains-goland-ide-hits-the-market/
  summary:
    - >
      GoLand is JetBrains's proprietary cross-platform integrated development
      environment for Go. It is based on the IntelliJ Platform and combines Go-specific
      code intelligence with debugging, testing, version control, database, web, and
      plugin tooling.
  timeline:
    - '2016: JetBrains announced the Gogland Early Access Program.'
    - '2017: JetBrains selected GoLand as the final product name.'
    - '2017: GoLand 2017.3 became the first commercial release.'
    - '2018: GoLand joined the JetBrains Toolbox product set.'
  usage:
    - >
      Developers use GoLand to create and maintain Go module projects, navigate and
      refactor code, run tests, debug with Delve, manage version control, and work with
      databases and web assets. Project-specific settings are normally stored in the
      project's .idea directory, while user-wide settings occupy a versioned JetBrains
      configuration directory.
    - >
      The configuration directory can be relocated through the idea.config.path
      property. Passwords and tokens handled by the IDE may use JetBrains Password Safe
      and operating-system secure storage, so no single portable credentials-file
      location is documented.
