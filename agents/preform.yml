history:
  adoption-history:
    - >
      PreForm became the preparation application associated with Formlabs' printer
      ecosystem. Its workflow spans model preparation, printer-specific material
      settings, support generation, layout, firmware delivery, and local or Wi-Fi job
      upload.
  package-nerd-significance:
    - >
      PreForm exemplifies vendor-managed, hardware-coupled desktop packaging.
      Compatibility depends not only on the host operating system but also on supported
      printer families, materials, firmware, and proprietary print calculations, making
      release selection more consequential than for a standalone file utility.
  project-history:
    - >
      Formlabs developed PreForm as its free print-preparation software. The application
      uses proprietary calculations to orient and support parts and optimize printer
      settings, and its official release archive records continuing releases from at
      least 2014 onward as the company's SLA and SLS printer ecosystem expanded.
  related-projects:
    - >
      PreForm works with Formlabs printers and complements Formlabs Dashboard, printer
      firmware, and the company's developer platform. Formlabs' OpenFL repository
      concerns an API and special workflow for legacy Form 1-series hardware, not the
      main PreForm source repository.
  sources:
    - 'Official PreForm guide: https://formlabs.com/global/support/PreForm/'
    - 'Official product page: https://formlabs.com/software/preform/'
    - 'Official release archive: https://formlabs.com/support/PreForm-Release-Notes/'
  summary:
    - >
      PreForm is Formlabs' proprietary desktop application for preparing models and
      sending jobs to supported Formlabs 3D printers.
  timeline:
    - >
      2014–2019: Formlabs maintains an official legacy archive of PreForm releases from
      this period.
    - >
      Later releases: PreForm added support for additional SLA and SLS printer families,
      materials, preparation tools, and production workflows.
  usage:
    - >
      Users import models, choose a printer and material, scale and orient parts,
      generate supports, arrange the build layout, check for likely print defects, and
      upload the prepared job to a printer. One-Click Print combines the principal
      preparation operations into an automated workflow.
