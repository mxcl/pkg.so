id: brew:diffle
display-name: diffle
repo: https://github.com/moritzwilksch/diffle
docs:
  - https://github.com/moritzwilksch/diffle#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Upstream supports installation through conda-forge/Pixi, npm, Nix, and standalone
      binaries for Linux, macOS, and Windows. The catalog record adds Homebrew
      distribution.
  package-nerd-significance:
    - >
      diffle joins a local Git command with a temporary browser interface, keeping
      review comments in Git metadata rather than changing the worktree. Package
      enthusiasts may also value its standalone binary, language-server discovery, shell
      completions, and optional GitHub CLI integration.
  project-history:
    - >
      diffle was developed as a keyboard-first browser diff reviewer inspired by difit.
      It expanded the local diff-viewer model with persistent review comments, GitHub
      pending-review export, range-diff support, and language-server navigation.
  related-projects:
    - >
      The project credits difit as its inspiration and uses the @pierre/diffs rendering
      library.
    - >
      GitHub CLI can supply authentication for pull-request access, and upstream's full
      Nix package bundles `gh`.
    - >
      Language servers found on PATH add definition, reference, symbol, and hover
      navigation to reviewed files.
  sources:
    - https://github.com/moritzwilksch/diffle#readme
  summary:
    - >
      diffle is a keyboard-oriented browser interface for reviewing Git changes,
      recording line or file comments, and sending those comments to an agent prompt or
      a pending GitHub review.
  timeline:
    - >
      Current: upstream distributes diffle through conda-forge, npm, Nix, and standalone
      binaries, while the catalog records a Homebrew formula.
    - >
      Current: the project documents GitHub review export and LSP-assisted source
      navigation in addition to local diff review.
  usage:
    - >
      Users can review the worktree, staged and untracked changes, a branch, commit,
      revision range, range-diff, or GitHub pull request. Comments may be copied as an
      agent prompt or added to a pending GitHub review.
    - >
      When an appropriate language server is installed, diffle supports jumping to
      definitions and type definitions, finding references and symbols, and viewing
      hover information without leaving the review.
related-packages:
  - id: brew:gh
    reason: >
      GitHub CLI is diffle's documented authentication fallback for pull-request access,
      and upstream's full Nix package bundles it for the GitHub review workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/moritzwilksch/diffle#readme
      - https://cli.github.com/manual/gh
      - https://docs.github.com/en/github-cli/github-cli/about-github-cli
