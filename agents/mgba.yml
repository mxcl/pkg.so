    - ~/.config/mgba
  windows:
    - '%APPDATA%\mGBA'
credentials-file-location: null
history:
  project-history:
    - >
      Technically, mGBA set out to be faster and more accurate than many older GBA
      emulators while adding features they lacked. Its README and FAQ describe support
      not only for Game Boy Advance games but also Game Boy and Game Boy Color titles,
      with an emphasis on accuracy, portability, and practical extras. That combination
      made it useful both for players and for development/debugging workflows around
      Nintendo handheld software.
  sources:
    - https://formulae.brew.sh/formula/mgba
    - https://github.com/mgba-emu/mgba
    - https://mgba.io/
    - https://mgba.io/2023/04/03/mgba-turns-ten/
    - https://mgba.io/faq.html
    - https://www.wired.com/review/epilogue-gb-operator
  summary:
    - >
      mGBA is an open-source Game Boy Advance emulator created by Vicki Pfau, also known
      as endrift. The official FAQ says the project started in April 2013 with the goal
      of running on lower-end hardware without giving up accuracy or portability, and
      the ten-year retrospective ties that history to the first commit in the mGBA
      repository. The project site identifies it as copyright 2013-2026 Vicki Pfau.
  usage:
    - >
      Its adoption reaches beyond package managers. The project is distributed through
      its own site and GitHub, packaged by Homebrew and Linux distributions, and
      published for Windows through winget. It also appears inside other retro-gaming
      products and workflows: Wired's review of the Epilogue GB Operator notes that
      Epilogue Playback defaults to the mGBA emulator core while allowing users to
      select other cores. In package-manager terms, Homebrew's `mgba` formula gives
      macOS and Linux users a maintained route to the desktop emulator, while distro
      packages such as `libmgba-dev` expose the emulator library for software that
      embeds or integrates mGBA.
related-packages:
  - id: cask:retroarch-metal
    reason: >
      Use RetroArch when you want mGBA as one core inside a unified multi-system
      frontend; mGBA officially supplies a libretro core, though its FAQ warns that the
      core can lag behind standalone upstream.
    rel: adjacent_workflow
    sources:
      - https://github.com/mgba-emu/mgba#readme
      - https://mgba.io/faq.html
      - https://docs.libretro.com/library/mgba/
  - id: cask:dolphin
    reason: >
      Dolphin works with mGBA for GameCube-to-Game-Boy-Advance link-cable and Game Boy
      Player workflows documented by both emulator projects.
    rel: adjacent_workflow
    sources:
      - https://github.com/mgba-emu/mgba#readme
      - https://dolphin-emu.org/blog/2021/07/21/integrated-gba/
