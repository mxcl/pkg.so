id: brew:galen
display-name: Galen Framework
repo: null
docs:
  - https://galenframework.com/docs/all
config-file-location:
  unix:
    - galen.config
    - ~/.galen.config
credentials-file-location: null
history:
  adoption-history:
    - >
      Galen appeared during the responsive-web testing boom, when teams needed automated
      checks across browser sizes rather than only DOM-level assertions. Its adoption
      surface includes command-line use, Java/Maven/TestNG integration, JavaScript
      tests, IDE syntax support, BrowserStack examples, and package-manager entries in
      Homebrew and Nix from the supplied facts.
  package-nerd-significance:
    - >
      Galen is package-relevant because it packages an opinionated browser-testing stack
      into a CLI/JVM tool at the boundary of Selenium, Java, JavaScript, and front-end
      workflow tooling. It also illustrates a once-common distribution pattern for QA
      tools: upstream zip/script installs plus package-manager wrappers.
  project-history:
    - >
      The GitHub repository was created in September 2013. Upstream documentation says
      Galen was originally designed for testing web-application layout and later also
      became useful for functional testing.
    - >
      The official documentation and release/news list show a 2.x line focused on spec
      language improvements, object groups, heatmaps, spec generation, and mutation
      testing. GitHub releases include the 2.4.x series through 2.4.4 in March 2019.
  related-projects:
    - Galen depends conceptually on Selenium for browser interaction.
    - >
      Official docs link Java/TestNG usage, JavaScript tests, BrowserStack integration
      examples, and IDE support projects including galen.vim.
  sources:
    - https://api.github.com/repos/galenframework/galen
    - https://api.github.com/repos/galenframework/galen/releases?per_page=10
    - https://galenframework.com/docs/all/
    - https://galenframework.com/docs/getting-started-configuration/
    - https://github.com/galenframework/galen
    - https://raw.githubusercontent.com/galenframework/galen/master/README.md
  summary:
    - >
      Galen Framework is an open-source layout, responsive-design, and functional
      testing tool for websites. It combines Selenium-driven browser interaction with a
      domain-specific spec language for checking element positions, sizes, and visual
      relationships.
  timeline:
    - '2013: GitHub repository created.'
    - '2015: Galen 2.0 release announced with a new spec language implementation.'
    - '2016: Galen 2.3 release announced.'
    - '2018: Galen 2.4 release announced with spec generator and mutation testing.'
    - '2019: GitHub release galen-2.4.4 published.'
  usage:
    - >
      A Galen test opens a page in a browser, resizes it to a requested viewport, and
      checks the layout against user-defined specs. When checks fail, Galen reports the
      error, makes a screenshot, and highlights the affected element.
    - >
      Configuration is project-local through galen.config or global through
      ~/.galen.config, both documented by upstream.
related-packages:
  - id: brew:selenium-server
    reason: >
      Galen uses Selenium for browser control and can send tests to Selenium Grid by
      enabling its documented Grid configuration properties.
    rel: adjacent_workflow
    sources:
      - https://galenframework.com/docs/all/
      - https://galenframework.com/docs/getting-started-configuration/
      - https://www.selenium.dev/documentation/grid/
