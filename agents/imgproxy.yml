id: brew:imgproxy
display-name: imgproxy
repo: null
docs:
  - https://docs.imgproxy.net/
config-file-location:
  linux:
    - /etc/imgproxy.rc
credentials-file-location:
  unix:
    - ~/.aws/credentials
history:
  adoption-history:
    - >
      imgproxy has much broader visible adoption than the small CLI tools in this batch:
      repository metadata shows roughly 10k GitHub stars, Homebrew publishes a formula,
      and the official docs and README emphasize Docker and container deployment. The
      input metadata also records packaging in Nix.
    - >
      Its adoption story is tied to web infrastructure: image variants, responsive
      crops, CDN-backed delivery, and moving CPU-heavy transformations out of
      application servers. The README thanks Evil Martians as a launch platform and
      libvips maintainers for image-processing support, reflecting its roots in
      production web image pipelines.
  package-nerd-significance:
    - >
      imgproxy is significant because it is not just a CLI binary in Homebrew; it is
      infrastructure software packaged as a Go executable and container image. For
      package nerds, it sits at the intersection of formula packaging, container
      registries, libvips dependency management, and web-performance operations.
  project-history:
    - >
      The GitHub repository was created on 2017-06-20. The README describes imgproxy as
      a drop-in replacement for application-side image-processing code: applications
      generate signed processing URLs, while imgproxy fetches source images, processes
      them, and serves the result.
    - >
      The project evolved from a utility server into a broader image-processing product
      line. Its official documentation covers Docker-based startup, URL processing
      syntax, security controls, source restrictions, memory tuning, and format support;
      the README also distinguishes the open-source edition from imgproxy Pro features.
  related-projects:
    - >
      imgproxy is closely related to libvips, which the README identifies as its
      image-processing engine. The imgproxy organization also maintains helper projects
      such as imgproxy-node and imgproxy-rails for integrating signed URLs and
      processing flows into applications.
  sources:
    - https://docs.imgproxy.net/
    - https://docs.imgproxy.net/getting_started
    - https://docs.imgproxy.net/usage/processing
    - https://formulae.brew.sh/formula/imgproxy
    - https://github.com/imgproxy/imgproxy
  summary:
    - >
      imgproxy is a Go-based standalone HTTP server for resizing, processing,
      optimizing, and converting images on the fly. The project presents itself around
      three principles: speed, security, and simplicity, with libvips as its core
      image-processing engine.
  timeline:
    - '2017-06-20: GitHub repository created.'
    - '2025-09-17: v3.30.0 release published.'
    - '2026-05-13: v4.0.0 release published.'
    - >
      2026: Documentation for the 4.0.x line describes Docker startup, URL processing,
      and security guidance.
  usage:
    - >
      The documented usage model is URL-driven. A caller encodes processing options and
      a source image URL into an imgproxy URL; imgproxy fetches the source, applies
      resize/crop/format/security rules, and returns the transformed image over HTTP.
      The getting-started docs recommend Docker for a short path to a running server,
      while the processing docs describe options such as resize, gravity, DPR, and
      enlargement.
related-packages:
  - id: brew:vips
    reason: >
      libvips is the documented processing engine beneath imgproxy, so install its tools
      when you need direct local image operations or want to inspect the native library
      that powers the server.
    rel: adjacent_workflow
    sources:
      - https://github.com/imgproxy/imgproxy
      - https://github.com/libvips/libvips
