history:
  adoption-history:
    - >
      The project targeted users of Apple's `container` CLI 0.1.0 and offered a Homebrew
      install path. GitHub repository metadata recorded 365 stars on July 1, 2026,
      suggesting interest from early adopters rather than broad infrastructure-tool
      adoption.
  package-nerd-significance:
    - >
      Its significance is mostly timing: it packaged a TUI wrapper almost immediately
      after Apple's container CLI drew attention. That makes it a snapshot of how
      quickly Homebrew formulas and Go TUIs appear around new platform CLIs.
  project-history:
    - >
      The public repository was created on June 20, 2025, and v0.0.1 was published on
      June 22, 2025. The README described it as an alpha release and limited the
      supported feature set to viewing and inspecting containers and images.
  related-projects:
    - >
      The direct dependency and context is Apple's `container` project. The interface
      style is in the broader Bubble Tea terminal-UI ecosystem.
  sources:
    - https://api.github.com/repos/andreybleme/lazycontainer
    - https://api.github.com/repos/andreybleme/lazycontainer/releases
    - https://github.com/andreybleme/lazycontainer
    - https://github.com/apple/container
    - https://github.com/charmbracelet/bubbletea
  summary:
    - >
      lazycontainer is a small Go terminal UI for Apple's `container` CLI. Its public
      history is short, but it is a neat example of the rapid package ecosystem that
      formed around Apple's container tooling in 2025.
  timeline:
    - '2025: Public GitHub repository created'
    - '2025: v0.0.1 release published'
  usage:
    - >
      Users run `lazycontainer` to open a Bubble Tea terminal interface, then navigate
      containers and images, inspect resources, and exit from the keyboard.
related-packages:
