id: brew:copier
display-name: Copier
repo: https://github.com/copier-org/copier
docs:
  - https://copier.readthedocs.io/en/stable
config-file-location:
  unix:
    - copier.yml
    - copier.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Copier's README documents installation through pipx, uv, pip, conda-forge, and
      Homebrew, reflecting its use both as a Python library and as a standalone CLI on
      macOS and Linux.
  package-nerd-significance:
    - >
      Copier is significant for maintainers who want template updates after initial
      scaffolding. Its changelog tracks packaging-relevant choices such as PEP 440
      versioning, Git URL handling, Homebrew distribution, Python version support, and
      security hardening around trusted templates and path traversal.
  project-history:
    - >
      The official repository was created in November 2011. The documented Copier
      lineage is explicit in the changelog: version 2.0.0 in February 2019 rebranded the
      project from Voodoo to Copier and made `copier.yaml` the recommended configuration
      file.
  related-projects:
    - >
      The project is commonly compared with project scaffolding tools such as
      Cookiecutter, and its README points users to public templates under the
      `copier-template` GitHub topic.
  sources:
    - https://github.com/copier-org/copier
    - https://raw.githubusercontent.com/copier-org/copier/master/README.md
    - https://copier.readthedocs.io/en/stable/configuring/
    - https://copier.readthedocs.io/en/stable/changelog/
    - https://api.github.com/repos/copier-org/copier
  summary:
    - >
      Copier is a project templating CLI and Python library. Like Cookiecutter, it
      renders projects from templates, but its documented identity emphasizes updating
      generated projects when templates evolve.
  timeline:
    - '2011: Official GitHub repository created.'
    - '2019: Version 2.0.0 rebranded Voodoo as Copier.'
    - '2020: Version 3.0.0 added template-upgrade support and broader prompt features.'
    - '2022: Version 6.0.0 refactored the core and expanded question and migration behavior.'
    - '2023: Version 8.0.0 made subcommands explicit and disabled unsafe features by default.'
  usage:
    - >
      Template authors put questions and settings in `copier.yml` or `copier.yaml`, then
      users run `copier copy` from a local path or Git URL. Copier stores answers for
      later update workflows, and the docs distinguish copying, recopying, and updating.
related-packages:
  - id: brew:cookiecutter
    reason: >
      Choose Cookiecutter for widely used one-time Jinja scaffolding; choose Copier when
      built-in template migrations and updates to existing generated projects matter.
    rel: alternative
    sources:
      - https://copier.readthedocs.io/en/stable/comparisons/
      - https://cookiecutter.readthedocs.io/en/stable/
