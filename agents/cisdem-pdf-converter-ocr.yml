history:
  adoption-history:
    - >
      Cisdem markets the application as a commercial macOS utility for converting native
      and scanned PDFs. Its official product page says Cisdem products serve more than
      one million customers, but does not publish product-specific installation or
      active-user figures.
  package-nerd-significance:
    - >
      For package-manager users, the application represents the proprietary macOS
      utility pattern: a signed DMG distributed by the vendor and made reproducibly
      installable and updatable through a Homebrew cask.
  project-history:
    - >
      The official release record documents the product by 2013. Later milestones added
      batch conversion, PDF creation, manual OCR marking, broader OCR-language support,
      Apple-silicon compatibility work, and continuing conversion improvements.
  related-projects:
    - >
      Cisdem PDF Master and Cisdem PDF Password Remover are related commercial PDF
      utilities from the same vendor.
  sources:
    - 'Official product page: https://www.cisdem.com/pdf-converter-ocr.html'
    - 'Official release notes: https://www.cisdem.com/pdf-converter-ocr-mac/release-notes.html'
    - >
      Official user guide:
      https://www.cisdem.com/resource/cisdem-pdf-converter-ocr-user-guide.html
    - source_facts.package-manager
  summary:
    - >
      Cisdem PDF Converter OCR is a proprietary macOS document-conversion application
      combining PDF-to-document conversion, PDF creation, merging, and optical character
      recognition for scanned documents and images.
  timeline:
    - '2013: Version 2.0 expanded Office and image output formats.'
    - '2016: Version 4.0 added page ranges and batch conversion.'
    - '2017: Version 5.0 added PDF creation and output security settings.'
    - '2018: Version 6.0 added manual OCR marking.'
    - >
      2024: Version 8.3 expanded OCR-language support; version 9.0 updated the
      underlying code.
    - >
      2026: Version 9.7 improved conversion performance and compatibility with the
      latest macOS icon conventions.
  usage:
    - >
      Users import PDFs or images, select page ranges and output formats, optionally
      enable OCR and choose recognition languages, then select an output folder. The
      application can also create or merge PDFs. Full functionality requires activation
      with a purchased license code.
