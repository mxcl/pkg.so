  - https://github.com/sagiegurari/duckscript#readme
  - https://sagiegurari.github.io/duckscript
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption evidence is modest and mostly package/ecosystem based: crates.io
      packages, a Homebrew formula, binary GitHub releases, and distro packages. It is
      not a general-purpose scripting language with broad standalone adoption, but it
      has a clear embedding niche.
    - >
      The executable-name overlap with Cyberduck CLI's duck package is important in
      package-manager contexts, especially because both can expose a duck command
      depending on packaging.
  package-nerd-significance:
    - >
      Duckscript is package-nerd-interesting because the package name, project name, and
      executable name are not the same across ecosystems: Homebrew installs duckscript,
      some packages install duck, and the CLI binary is duck.
    - >
      It also represents a class of embeddable language runtimes distributed like
      command-line tools, where the package is useful both to end users and as a library
      dependency.
  project-history:
    - >
      The README describes Duckscript as a language with few core rules, where common
      language features are implemented as commands rather than built into the syntax.
      That keeps the language small and makes it customizable by embedding applications.
    - >
      The release history begins at the end of 2019 and the project documentation links
      it to the cargo-make ecosystem through badges and examples. The CLI installs as
      duck, while crates expose the language and SDK separately.
  related-projects:
    - >
      Duckscript is related to cargo-make, its Rust SDK crates, and other small
      embeddable scripting systems used for automation inside larger tools.
  sources:
    - https://github.com/sagiegurari/duckscript
    - https://sagiegurari.github.io/duckscript
    - https://github.com/sagiegurari/duckscript/blob/master/CHANGELOG.md
    - https://github.com/sagiegurari/duckscript/releases
  summary:
    - >
      Duckscript is a small embeddable scripting language implemented in Rust,
      distributed with a CLI executable named duck. Its significance is mostly inside
      Rust automation: it is designed to be simple, extendable, and easy to embed in
      other tools.
  timeline:
    - '2019: Early 0.1.x releases appear in the GitHub release history.'
    - '2020: 0.2.x and 0.3.0 releases appear in the GitHub release history.'
    - >
      2020s: Documentation continues to present Homebrew, cargo install, and binary
      release installation paths.
    - '2020s: Duckscript remains tied to Rust embedding and automation workflows.'
  usage:
    - >
      Users can run Duckscript files with the duck executable or embed the interpreter
      from Rust. The language uses command-oriented lines, global variables, labels,
      preprocessing, and an SDK for adding commands.
    - >
      Its intended use is automation and application scripting where a host program
      wants a tiny language rather than a full shell, Python, or JavaScript runtime.
related-packages:
  - id: brew:cargo-make
    reason: >
      cargo-make embeds duckscript as its @duckscript runner, shares environment
      variables with scripts, and lets duckscript invoke cargo-make tasks, making it the
      strongest documented companion workflow.
    rel: adjacent_workflow
    sources:
      - https://sagiegurari.github.io/duckscript/
      - https://sagiegurari.github.io/cargo-make/
