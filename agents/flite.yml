history:
  adoption-history:
    - >
      Flite was designed for both constrained devices and high-density servers, and the
      upstream history records support for PalmOS, Windows CE, Android, Windows, macOS,
      Linux, ARM, MIPS, and experimental WASI use.
    - >
      source_facts.package-manager records broad distribution through Alpine, Homebrew,
      Debian, Fedora, MacPorts, Nix, Arch, Ubuntu, and openSUSE.
  package-nerd-significance:
    - >
      Flite is a classic small-footprint package: an ANSI C speech engine whose language
      and voice data can be compiled into read-only program data. It provides
      text-to-speech without requiring the much larger Festival runtime.
    - >
      Packagers encounter a mix of engine libraries, voice-specific executables, bundled
      language data, optional audio backends, and cross-compilation concerns.
  project-history:
    - >
      Alan W. Black developed Flite at Carnegie Mellon University's Language
      Technologies Institute as a small, fast, portable runtime speech engine. Its name
      originally meant “Festival-lite.” Kevin Lenzo and Alan W. Black developed its
      voices, lexicons, language components, and compression techniques.
    - >
      Flite belongs to the Festival and FestVox family but is an independent runtime.
      Voices created with FestVox can be compiled for Flite when size and speed matter
      more than runtime customization.
  related-projects:
    - >
      Festival is the larger speech-synthesis system from which Flite's “Festival-lite”
      name and ecosystem derive.
    - >
      FestVox supplies tools and processes for building synthetic voices, while Bard
      Storyteller is identified upstream as a companion multilingual ebook reader.
  sources:
    - https://github.com/festvox/flite
    - https://www.festvox.org/
    - https://www.festvox.org/flite/
  summary:
    - >
      Flite is Carnegie Mellon University's small, fast, portable text-to-speech engine.
      Written in ANSI C, it targets embedded devices as well as servers requiring many
      lightweight synthesis instances.
  timeline:
    - '1999: Upstream copyright history begins for the Flite runtime.'
    - >
      2003: Version 1.2 adds FestVox voice conversion, initial macOS support, and
      optional shared libraries.
    - '2005: Version 1.3 improves voice data and cross-platform support, including PalmOS.'
    - '2009: Version 1.4 adds multiple bundled voices, ALSA, ClusterGen, and Windows support.'
    - >
      2014: Version 2.0 adds Indic languages, SSML, external voices, Android
      improvements, and thread-safety work.
    - '2017: Version 2.1 expands English and Indian voices and reduces `.flitevox` sizes.'
    - '2018: Version 2.2 expands grapheme-based language support.'
    - '2022: Version 2.3 improves grapheme-voice quality.'
  usage:
    - >
      The `flite` command accepts literal text or a text file and can play speech or
      write waveform audio. Users can select bundled voices or load external `.flitevox`
      voice files.
    - >
      Developers can embed the Flite library in applications that need portable,
      low-overhead synthesis without the Festival runtime.
related-packages:
  - id: brew:espeak-ng
    reason: >
      Choose eSpeak NG when broad multilingual coverage, phoneme output, or
      compatibility with accessibility workflows matters more; choose Flite for a
      compact embeddable runtime using FestVox-derived voices.
    rel: alternative
