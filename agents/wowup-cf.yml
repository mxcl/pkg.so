history:
  adoption-history:
    - >
      WowUp is distributed for macOS, Windows, and Linux and is also packaged by
      community package managers. The official repository describes both CurseForge and
      Wago variants and welcomes community contributions and translations.
  package-nerd-significance:
    - >
      WowUp is part of the specialized package-management ecosystem around World of
      Warcraft: it discovers installed addons, queries multiple addon providers, handles
      release channels, and can update several game-client installations from one
      interface.
    - >
      The CurseForge cask is notable because it selects a provider-specific build while
      development of both client variants has been consolidated in the shared WowUp
      repository.
  project-history:
    - >
      WowUp was developed as a community-centered World of Warcraft addon updater
      supporting discovery, installation, and automatic updates across major addon
      sources.
    - >
      A separate WowUp.CF repository was used for the CurseForge client. Its official
      README now says that the repository is no longer updated because both clients are
      built from the main WowUp repository.
  related-projects:
    - >
      The official project lists the WowUp companion addon and the deprecated
      WowUpUpdater as related projects.
    - >
      CurseForge, WowUpHub, TukUI, WowInterface, Wago, and GitHub releases are adjacent
      addon-distribution sources supported in different parts of the WowUp workflow.
  sources:
    - https://github.com/WowUp/WowUp#readme
    - https://github.com/WowUp/WowUp.CF#readme
    - https://wowup.io/
    - https://wowup.io/guide/get-addons/overview
    - https://wowup.io/guide/my-addons/addons
  summary:
    - >
      WowUp with CurseForge is the CurseForge-enabled distribution of WowUp, an
      open-source desktop manager for discovering, installing, and updating World of
      Warcraft addons.
  timeline:
    - The WowUp.CF client was maintained in a dedicated repository.
    - >
      Later: Development of the CurseForge and Wago clients was consolidated in the main
      WowUp repository.
  usage:
    - >
      Users select a World of Warcraft installation, scan its addon folders, discover
      addons from supported providers, and install or update them through the desktop
      interface.
    - >
      Advanced workflows include automatic hourly update checks, alpha or beta release
      channels, provider switching, URL-based installation, and portable addon-list
      import and export.
