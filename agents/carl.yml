provenance:
  category-sources:
    - >
      Official docs describe carl as a command-line calendar with cal(1)-style output
      and iCal support.
  display-name-sources:
    - Official docs title and README content use the display name carl.
  docs-sources:
    - >
      Official documentation at https://carl.cli.rs/ describes carl usage, installation,
