id: brew:carl
display-name: carl
repo: https://codeberg.org/birger/carl
docs:
  - https://carl.cli.rs/
config-file-location:
  unix:
    - XDG_CONFIG_DIRS/carl/config.toml
    - XDG_CONFIG_HOME/.carl/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      carl is a niche terminal productivity tool rather than a large platform project.
      Its adoption path is typical for Rust command-line software: upstream publishes
      source and cargo installation instructions, while package managers such as
      Homebrew, MacPorts, and Nix make the executable available outside Cargo workflows.
  package-nerd-significance:
    - >
      For package nerds, carl is a tidy example of a modern replacement for a small Unix
      utility: it keeps the old terminal shape of cal(1), but adds XDG configuration,
      iCalendar awareness, theming, and Rust packaging.
  project-history:
    - >
      The Codeberg repository was created in December 2021 and the first tagged release,
      0.0.1, was published on January 1, 2022. Its README identifies Birger Schacht as
      the copyright holder for 2021-2023 and documents a compact CLI installed with
      cargo.
  related-projects:
    - carl explicitly positions itself next to cal(1) implementations.
    - >
      Its iCalendar support connects it to the broader family of terminal calendar and
      agenda tools.
  sources:
    - https://codeberg.org/birger/carl
    - https://carl.cli.rs/
    - https://formulae.brew.sh/api/formula/carl.json
  summary:
    - >
      carl is a Rust command-line calendar that deliberately resembles traditional
      cal(1) tools while adding color themes, iCalendar highlighting, agendas, and
      template customization.
  timeline:
    - '2021: Codeberg repository created.'
    - '2022: 0.0.1 tagged as the first release.'
    - '2023: 0.0.3 released on Codeberg.'
  usage:
    - >
      Users run carl to print one month, three months, a year, Julian dates, or a
      specified date. Configuration can point to iCalendar files or directories, select
      themes, and configure custom Jinja templates.
related-packages: []
tags:
  - calendar
  - cli
  - ical
  - rust
geiger:
  category: appliance
  color: green
  confidence: low
  reason: narrow executable package without higher-risk signals
  reasons:
