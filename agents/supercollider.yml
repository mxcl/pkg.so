history:
  adoption-history:
    - >
      SuperCollider moved from a creator-led proprietary system to a
      community-maintained free-software project in 2002. It is now available across
      macOS, Linux, and Windows and is used by musicians, sound artists, researchers,
      educators, and live coders.
    - >
      Its client-server design encouraged clients in languages beyond sclang, while the
      Quarks package system and sc3-plugins collection gave the community established
      ways to distribute language extensions and additional synthesis units.
  package-nerd-significance:
    - >
      SuperCollider is simultaneously a programming language, an interactive development
      environment, a network-controllable synthesis server, and an extension ecosystem.
      That separation makes it unusually composable compared with monolithic music
      applications.
    - >
      Quarks are especially notable to package enthusiasts: they are Git-backed packages
      that can declare dependencies, preserve exact revisions, install local development
      trees, and save reproducible package sets.
  project-history:
    - >
      James McCartney originally developed and released SuperCollider in 1996. In 2002
      he released it as free software under the GNU General Public License, after which
      an active community continued its development.
    - >
      The modern system is organized around scsynth, the real-time synthesis server;
      sclang, its native language and client; and ScIDE, an editor with integrated help.
      The alternative supernova server adds multithreaded synthesis support.
  related-projects:
    - sc3-plugins extends the synthesis server with additional unit generators.
    - >
      Quarks is SuperCollider's integrated ecosystem for community language extensions
      and packages.
    - >
      Sonic Pi has distributed builds derived from SuperCollider technology, while
      Supriya is a Python client for the server.
  sources:
    - https://docs.supercollider.online/
    - https://docs.supercollider.online/Guides/UsingQuarks.html
    - https://docs.supercollider.online/Reference/StartupFile.html
    - https://supercollider.github.io/
  summary:
    - >
      SuperCollider is a free, cross-platform environment for real-time sound synthesis,
      algorithmic composition, live coding, and audio research.
  timeline:
    - '1996: James McCartney originally released SuperCollider.'
    - >
      2002: SuperCollider became GPL-licensed free software and transitioned to
      community maintenance.
    - >
      SuperCollider 3 era: The project established its modern server, language, IDE,
      Quarks, and plugin ecosystem.
  usage:
    - >
      Users write and evaluate sclang code to construct synthesis graphs, patterns, and
      time-based processes, while scsynth or supernova performs real-time audio
      processing.
    - >
      SuperCollider communicates through Open Sound Control, so its server can run
      locally or over a network and can be driven by sclang or clients written in other
      programming languages.
