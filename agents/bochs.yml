history:
  adoption-history:
    - >
      Bochs was historically adopted by operating-system developers, emulator users,
      educators, and hardware-modeling tinkerers who cared more about inspection and
      portability than raw speed. The official site notes SourceForge activity around
      release times, and the input package facts list packaging across Homebrew, Debian,
      Ubuntu, Fedora, Alpine, Nix, MacPorts, Scoop, and winget.
    - >
      Its adoption path differs from virtualization tools such as VMware or VirtualBox:
      Bochs became a package-manager staple because it is small enough to ship widely,
      scriptable, and useful on hosts that cannot or should not run native
      virtualization.
  package-nerd-significance:
    - >
      Bochs is package-nerd significant because it is one of the classic open source PC
      emulators that survived multiple eras: pre-virtualization desktop emulation,
      SourceForge-era open source packaging, teaching OS development, and modern
      instruction-set correctness work.
    - >
      For distribution maintainers, Bochs is a compact but serious systems package: it
      combines a CPU emulator, BIOS pieces, GUI backends, disk-image tooling,
      configuration files, and optional debugger behavior, which makes it a useful test
      of build flags and platform assumptions.
  project-history:
    - >
      Bochs began in 1994 as Kevin Lawton's commercial PC emulator. The official user
      manual says MandrakeSoft bought Bochs and released it as open source under the GNU
      LGPL in March 2000, then project activity moved to SourceForge in March 2001.
    - >
      The project continued as a long-lived emulator and hardware-modeling codebase. Its
      official home page describes it as capable of running operating systems such as
      Linux, DOS, Microsoft Windows, BSD variants, and others inside a simulated x86
      machine.
    - >
      Bochs 3.0 was released on February 16, 2025. The official release notes highlight
      debugger availability in release binaries, softfloat3e integration, CPU
      correctness fixes, AVX512_FP16, AVX10, AMX, and other modern x86 instruction-set
      work, showing that the old emulator still tracks current CPU behavior.
  related-projects:
    - >
      Related projects include QEMU, VirtualBox, VMware, PCem, DOSBox, and other x86
      emulators or virtualizers. Bochs is distinct from many of them because it
      emphasizes portable full software simulation rather than native-speed
      virtualization.
  sources:
    - https://bochs.sourceforge.io/
    - https://bochs.sourceforge.io/doc/docbook/user/introduction.html
    - https://github.com/bochs-emu/Bochs/blob/REL_3_0_FINAL/bochs/CHANGES
    - input.source_facts.package-manager
  summary:
    - >
      Bochs is a portable, open source IA-32 and x86-64 PC emulator written in C++. Its
      value is accuracy and portability: it simulates a whole PC, including CPU, BIOS,
      and devices, rather than relying on host CPU virtualization.
  timeline:
    - '1994: Kevin Lawton starts Bochs.'
    - '2000: MandrakeSoft buys Bochs and releases it under the GNU LGPL.'
    - '2001: Bochs project activity moves from bochs.com to SourceForge.'
    - '2011: Bochs 2.5 is released, noted by the project as the first release from SVN.'
    - '2022: The Bochs source tree starts transitioning from SVN to GitHub-hosted Git.'
    - '2025: Bochs 3.0 is released with debugger, CPU, device, and documentation updates.'
  usage:
    - >
      Typical usage is to boot a disk image or installed guest operating system under a
      `.bochsrc` configuration, optionally using tools such as `bximage` to create disk
      images. It is especially useful when deterministic emulation, debugger support,
      BIOS/device modeling, or non-native host portability matter.
related-packages:
  - id: brew:qemu
    reason: >
      Choose QEMU for broader guest-architecture coverage or hardware-assisted
      virtualization; choose Bochs when controlled, portable x86 software emulation is
      the priority.
    rel: alternative
    sources:
