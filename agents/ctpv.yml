id: brew:ctpv
display-name: ctpv
repo: null
docs:
  - https://github.com/NikitaIvanovV/ctpv#readme
  - https://www.nikitaivanov.com/man1/ctpv
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/ctpv/config
    - ~/.config/ctpv/config
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents package-manager paths for AUR, MacPorts, Homebrew, Nix, and
      Gentoo overlay users, along with source builds. Its NixOS/Home Manager example
      shows ctpv being packaged as part of declarative terminal-file-manager
      configuration.
  package-nerd-significance:
    - >
      ctpv is package-manager-friendly because most of its functionality is integration
      glue over existing Unix tools. A package can ship the core C binary and manpage,
      while optional preview capabilities naturally expand as the user's system has more
      helper programs installed.
  project-history:
    - >
      The README describes ctpv as a C remake of stpv. The author liked stpv's behavior
      but found its POSIX-shell implementation sluggish, so ctpv was written in C as a
      faster version with additional features.
    - >
      Official GitHub releases show v1.0 in July 2022 and v1.1 in March 2023. The
      project documentation now includes both README integration examples and a
      generated CTPV(1) manual page.
  related-projects:
    - >
      ctpv is related to lf, stpv, Ueberzug, Chafa, Kitty, and the many small Unix
      preview helpers it can dispatch.
  sources:
    - https://github.com/NikitaIvanovV/ctpv#readme
    - https://www.nikitaivanov.com/man1/ctpv
    - https://api.github.com/repos/NikitaIvanovV/ctpv/releases?per_page=20
  summary:
    - >
      ctpv is a terminal file previewer written with lf file-manager integration in
      mind. It previews text, archives, PDFs, images, videos, and other file types by
      selecting from installed helper programs.
  timeline:
    - '2022: v1.0 release published.'
    - '2023: v1.1 release published.'
    - '2023: Documentation noted Wayland/sixel guidance for lf image previews.'
  usage:
    - >
      ctpv is usually configured as lf's previewer and cleaner, with ctpv, ctpvclear,
      and ctpvquit coordinating preview output and lifecycle. Image previews can use
      Ueberzug, Chafa, or Kitty terminal support, while other previews delegate to
      common tools such as bat, jq, poppler, ffmpegthumbnailer, and atool.
related-packages:
  - id: brew:lf
    reason: >
      ctpv is designed around lf's previewer and cleaner hooks, providing rich file
      previews inside lf's terminal interface.
    rel: adjacent_workflow
    sources:
      - https://github.com/NikitaIvanovV/ctpv#readme
      - https://github.com/gokcehan/lf#readme
  - id: brew:chafa
    reason: >
      ctpv can delegate image previews to Chafa, including sixel output for suitable
      Wayland terminal setups.
    rel: adjacent_workflow
    sources:
      - https://www.nikitaivanov.com/man1/ctpv
      - https://hpjansson.org/chafa/
  - id: brew:bat
    reason: >
      ctpv uses bat as one of its documented renderers for syntax-highlighted text-file
      previews.
    rel: adjacent_workflow
    sources:
      - https://www.nikitaivanov.com/man1/ctpv
      - https://github.com/sharkdp/bat#readme
  - id: brew:jq
    reason: ctpv dispatches JSON files to jq for structured, readable terminal previews.
    rel: adjacent_workflow
    sources:
      - https://www.nikitaivanov.com/man1/ctpv
      - https://jqlang.org/
