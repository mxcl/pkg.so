display-name: GHex
repo: https://gitlab.gnome.org/GNOME/ghex
docs:
  - https://help.gnome.org/users/ghex/stable
  - https://wiki.gnome.org/Apps/Ghex
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GHex occupies a small but durable role in the GNOME desktop ecosystem: it is not a
      core GNOME application, but the README identifies it as part of the GNOME Extra
      Apps family. Its release notes show ongoing translation updates, GTK and
      libadwaita porting work, and maintenance of the libgtkhex library API.
  package-nerd-significance:
    - >
      For desktop packagers, GHex is a classic GNOME utility with both an application
      and a reusable library surface. Its NEWS file tracks GNOME-cycle versioning,
      translations, AppStream data, D-Bus integration, documentation generation, and GTK
      stack changes that downstream distributions care about.
  project-history:
    - >
      The GNOME repository README names Jaka Mocnik as the original author and notes
      that the project has been maintained by various individuals under the
      GPLv2-or-later license. The DOAP metadata describes it as a GNOME application
      written in C, with source, issues, and releases hosted in GNOME infrastructure.
  related-projects:
    - >
      GHex is related to GNOME Extra Apps, GTK, libadwaita, and the libgtkhex library
      produced from the same source tree.
  sources:
    - https://gitlab.gnome.org/GNOME/ghex
    - https://gitlab.gnome.org/GNOME/ghex/-/raw/master/NEWS
    - https://gitlab.gnome.org/GNOME/ghex/-/raw/master/README.md
    - https://gitlab.gnome.org/GNOME/ghex/-/raw/master/ghex.doap
    - https://gitlab.gnome.org/api/v4/projects/GNOME%2Fghex
  summary:
    - >
      GHex is GNOME's graphical hex editor, used for inspecting and editing raw binary
      data with paired hexadecimal and ASCII views.
  timeline:
    - '2018: The GNOME GitLab project record was created.'
    - '2024: GHex 46.0 included libgtkhex 4.8.0.'
    - '2026: GHex 50.0 included libgtkhex 4.12.0.'
  usage:
    - >
      Practitioners use GHex when they need a desktop-oriented view of raw data rather
      than a terminal hex dump. The application loads binary files, displays bytes and
      ASCII side by side, supports editing, and shares libgtkhex for applications that
      need the hex widget.
related-packages:
  - id: brew:bvi
    reason: >
      Choose bvi when you need to edit binary data in a terminal with vi-like commands
      instead of using GHex's GNOME graphical interface.
    rel: alternative
    sources:
      - https://help.gnome.org/users/ghex/stable/ghex-intro.html
      - https://bvi.sourceforge.net/overview.php
