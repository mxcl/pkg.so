history:
  adoption-history:
    - >
      The official README tells users to obtain fswatch from their operating-system or
      third-party package manager when available, and gives examples for MacPorts,
      Homebrew, and FreeBSD pkg. The supplied package data shows packages across
      Homebrew, Debian, Fedora, MacPorts, Nix, Ubuntu, winget, and openSUSE families.
    - >
      The project has continued as a packaged command-line utility while also exposing
      libfswatch for programs that need filesystem events without maintaining
      per-platform watcher code.
  package-nerd-significance:
    - >
      fswatch is important to package users because it provides one CLI and one library
      abstraction over the incompatible filesystem notification APIs that build tools,
      static-site generators, test runners, and shell automation frequently need.
    - >
      For maintainers, fswatch is also a classic portability package: it wraps native
      APIs where possible, keeps a poll fallback, publishes Texinfo/man/PDF/API
      documentation, and ships through many Unix and Windows package channels.
  project-history:
    - >
      The fswatch README traces the project to Alan Dipert's 2009 OS X implementation
      using Apple's FSEvents API. At the end of 2013 Enrico M. Crisostomo wrote fsw as a
      cross-platform replacement and front end for multiple filesystem event APIs.
    - >
      In April 2014, the authors of fswatch and fsw agreed to merge the programs, with
      future development continuing in the fswatch repository under Crisostomo's
      maintenance. The current README describes fswatch as a frontend for libfswatch,
      with C, C++, and Go bindings noted.
  related-projects:
    - fsw is the predecessor project that merged into fswatch.
    - libfswatch is the library layer behind the fswatch frontend.
    - >
      The project is related to native event systems including FSEvents, kqueue, File
      Events Notification, inotify, fanotify, ReadDirectoryChangesW, and stat-based
      polling.
  sources:
    - https://api.github.com/repos/emcrisostomo/fswatch
    - https://emcrisostomo.github.io/fswatch/documentation.html
    - https://github.com/emcrisostomo/fswatch
    - https://raw.githubusercontent.com/emcrisostomo/fswatch/master/NEWS
    - https://raw.githubusercontent.com/emcrisostomo/fswatch/master/README.md
  summary:
    - >
      fswatch is a cross-platform file-change monitor and libfswatch frontend with
      backends for macOS, BSD, Linux, Solaris/Illumos, Windows, and portable polling.
  timeline:
    - '2009: First fswatch implementation written for OS X FSEvents.'
    - '2013: fsw written as a multi-backend replacement effort.'
    - '2014: fsw and fswatch merged, with development continuing in fswatch.'
    - >
      2024: fswatch 1.18.0 adopted C++17 and updated FSEvents/inotify rename-correlation
      support.
    - >
      2026: fswatch 1.21.0 documented conjunctive filters, pruning, and CMake package
      configuration files for libfswatch.
  usage:
    - >
      fswatch accepts paths and streams events for changes to files or directories. Its
      output can be piped to shell loops or to xargs, and the -o mode supports running
      one command per batch of changes.
    - >
      By default fswatch chooses the best available monitor for the platform, while
      users can select monitors explicitly. The README recommends FSEvents on macOS,
      File Events Notification on Solaris derivatives, inotify on Linux, the Windows
      monitor on Windows, kqueue for small BSD/macOS watch sets, and polling as the
      fallback.
related-packages:
  - id: brew:entr
    reason: >
      Choose entr for a smaller Unix-oriented workflow where a file list is piped in and
      an arbitrary command or service is rerun when those files change.
    rel: alternative
    sources:
      - https://emcrisostomo.github.io/fswatch/usage.html
      - https://eradman.com/entrproject/
  - id: brew:watchexec
    reason: >
      Choose watchexec when the primary task is cross-platform command rerunning with
      built-in process restart and development-server workflows.
    rel: alternative
    sources:
      - https://emcrisostomo.github.io/fswatch/usage.html
      - https://watchexec.github.io/
  - id: brew:inotify-tools
    reason: >
      Choose inotify-tools for Linux-specific shell access to inotify or fanotify
      instead of fswatch's portable multi-backend abstraction.
    rel: alternative
    sources:
      - https://emcrisostomo.github.io/fswatch/
      - https://github.com/inotify-tools/inotify-tools
