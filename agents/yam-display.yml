history:
  adoption-history:
    - >
      Yam Display occupied the pre-Sidecar market for turning iOS hardware into an extra
      Mac screen. The official support archive shows continued adaptation to High
      Sierra, Mojave, and Catalina, including changes for AirPlay behavior, system
      extensions, screen-recording permission, automation, and accessibility controls.
  package-nerd-significance:
    - >
      Yam Display is representative of a class of desktop packages whose usefulness
      depends on a coordinated host application, a mobile companion, drivers or system
      extensions, and operating-system privacy permissions. Installing the Mac cask
      alone is only one part of the working setup.
    - >
      It is also a reminder that display-extension utilities can be tightly coupled to
      macOS internals: operating-system upgrades changed the required driver approval,
      screen-capture permission, accessibility permission, and fallback display
      technology.
  project-history:
    - >
      Yam Display is a macOS host utility that uses an iPad or iPhone as an additional
      display, with the mobile companion connecting over USB. Its related Yam Air
      products add wireless iOS connections and Mac-to-Mac second-display operation.
    - >
      The surviving official support archive documents the product by 2016 and records
      compatibility work through the macOS Catalina era.
  related-projects:
    - Yam Air is the wireless iOS companion in the same product family.
    - Yam Air Desk turns a secondary Mac into a display for the primary Mac.
    - Yam Pad focuses on using an iPad and Apple Pencil as a drawing tablet.
  sources:
    - 'Official FAQ archive: https://www.yamdisplay.com/category/faq/'
    - 'Official Yam Air and Yam Air Desk description: https://www.yamdisplay.com/aboutair/'
    - 'Official installation page: https://www.yamdisplay.com/'
  summary:
    - >
      Yam Display is a proprietary Mac utility for using an iPad or iPhone as a second
      display over USB. Companion products extend the same idea to wireless iOS
      connections, Mac-to-Mac display extension, and drawing-tablet use.
  timeline:
    - >
      2016: Official support articles documented Yam Display connectivity and OS X
      compatibility.
    - '2017: A High Sierra compatibility path used AirPlay for display extension.'
    - >
      2018: Mojave support required approval of the display system extension and
      additional privacy permissions.
    - '2019: Catalina support added explicit Screen Recording permission guidance.'
    - '2020: The related Yam Pad product received Catalina permission guidance.'
  usage:
    - >
      Install and run Yam Display on the primary Mac, install the Yam Display companion
      from the iOS App Store, and connect the iPad or iPhone by USB.
    - >
      On newer macOS releases, users may need to grant Screen Recording and
      Accessibility permissions and approve the system extension. Yam Air and Yam Air
      Desk provide wireless and Mac-to-Mac alternatives.
