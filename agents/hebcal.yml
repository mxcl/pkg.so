history:
  adoption-history:
    - >
      Hebcal occupies the classic Unix utility niche: a domain-specific calendar program
      that can print plain text, tab-delimited output, localized event names, and date
      ranges for shell scripts or human reading. The input package facts record
      packaging in Homebrew, Debian, Ubuntu, and Nix, suggesting sustained use by
      command-line users who want Jewish calendar data outside a web app.
  package-nerd-significance:
    - >
      For package nerds, Hebcal is a good example of a small culturally specific Unix
      tool that remains valuable because it is composable. It turns calendrical rules,
      local sunset calculations, transliteration choices, and recurring study cycles
      into predictable command output that can be piped, scripted, cron-run, or wrapped
      by other calendar systems.
  project-history:
    - >
      The README credits Danny Sadinoff as the original author, with portions by Michael
      J. Radwin and later contributions for JavaScript, Daf Yomi, Molad, and
      sunrise/sunset features. It describes Hebcal as a flexible program for printing
      Jewish calendar events for a given secular or Hebrew year, month, day, or ISO
      date.
    - >
      The README records that version 3 rewrote much of the program using the Emacs 19
      calendar routines by Edward M. Reingold and Nachum Dershowitz, tying the Unix CLI
      to a wider lineage of calendrical computation rather than a single-purpose holiday
      table. GitHub repository metadata records the public hosted project from July
      2013.
  related-projects:
    - >
      The README explicitly points to `calendar(1)`, Emacs calendar, hcal, hdate, omer,
      remind, and rise as related command-line or calendar tools. Algorithmically it is
      related to the calendrical work of Edward M. Reingold and Nachum Dershowitz.
  sources:
    - https://github.com/hebcal/hebcal
    - https://hebcal.github.io/
    - https://raw.githubusercontent.com/hebcal/hebcal/main/README.md
  summary:
    - >
      hebcal is a command-line perpetual Jewish calendar. It prints Hebrew dates,
      holidays, weekly Torah portions, Omer counts, candle-lighting and Havdalah times,
      daily learning schedules, and related calendar data for scripted or terminal use.
  timeline:
    - >
      Version 3 era: The README says much of Hebcal was rewritten using Emacs 19
      calendar routines by Reingold and Dershowitz.
    - '2013: GitHub repository metadata records the hosted Hebcal source repository.'
    - >
      Package-manager era: The input package facts record Hebcal in Homebrew, Debian,
      Ubuntu, and Nix packaging.
  usage:
    - >
      The CLI accepts a year, month/day/year, Hebrew month/year, or ISO date and can
      selectively enable or suppress Hebrew dates, holidays, sedrot, Omer counts, modern
      Israeli holidays, candle-lighting, Havdalah, zmanim, and daily learning schedules.
      Its environment support includes `HEBCAL_CITY` for default candle-lighting
      geography and `HEBCAL_OPTS` for repeated command options.
