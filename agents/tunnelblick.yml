id: cask:tunnelblick
display-name: Tunnelblick
repo: https://github.com/Tunnelblick/Tunnelblick
docs:
  - https://tunnelblick.net/cFileLocations.html
  - https://tunnelblick.net/czUsing.html
  - https://tunnelblick.net/documents.html
config-file-location:
  macos:
    - ~/Library/Application Support/Tunnelblick/Configurations
    - /Library/Application Support/Tunnelblick/Shared
    - /Applications/Tunnelblick.app/Contents/Resources
    - /Library/Application Support/Tunnelblick/Users/<username>
    - /Library/Application Support/Tunnelblick/Backup
    - ~/Library/Preferences/net.tunnelblick.tunnelblick.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Tunnelblick became a longstanding native macOS interface for OpenVPN client and
      server connections. It supports personal installations as well as shared and
      deployed configurations, making it useful to individual users and managed Mac
      fleets.
  package-nerd-significance:
    - >
      Tunnelblick is the graphical macOS counterpart to command-line OpenVPN packaging.
      Its application bundle integrates OpenVPN, supporting libraries, scripts,
      privileged helpers, and configuration-bundle handling, so its packaging and
      upgrade behavior are more involved than those of a self-contained GUI application.
  project-history:
    - >
      Tunnelblick is a free, GPL-licensed graphical interface for OpenVPN on macOS. The
      project maintains its own documentation and release infrastructure alongside an
      official GitHub source repository.
    - >
      The application evolved from handling standalone OpenVPN configuration files to a
      Tunnelblick VPN Configuration bundle format that can contain configuration data,
      keys, certificates, and scripts. Later releases adapted its networking components
      and privileged integration to changing macOS security requirements.
  related-projects:
    - OpenVPN
    - OpenSSL
    - easy-rsa
    - tuntaposx
  sources:
    - 'Official documentation: https://tunnelblick.net/documents.html'
    - 'Official file-locations reference: https://tunnelblick.net/cFileLocations.html'
    - 'Official repository: https://github.com/Tunnelblick/Tunnelblick'
    - 'Official website: https://tunnelblick.net/'
  summary:
    - >
      Tunnelblick is a free and open-source macOS graphical client for managing OpenVPN
      connections.
  timeline:
    - 'Before version 3.0b24: Private configurations were stored in ~/Library/openvpn.'
    - >
      Version 3.0b24: Private configurations moved to ~/Library/Application
      Support/Tunnelblick/Configurations, with migration support for the old location.
    - >
      2024: Tunnelblick 4.0 added command-line installation of private and shared
      configurations and updated its bundled OpenVPN and OpenSSL components.
  usage:
    - >
      Users install or import .tblk, .ovpn, or .conf configurations and control VPN
      connections from Tunnelblick's menu-bar interface. Administrators can distribute
      shared, deployed, or per-user configurations and apply forced preferences.
