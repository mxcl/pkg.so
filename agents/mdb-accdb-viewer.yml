history:
  adoption-history:
    - >
      The application serves Mac users who need to inspect or migrate Microsoft Access
      data without running Access. Its documentation developed into a migration-oriented
      reference covering Excel, CSV, SQL, MySQL, PostgreSQL, SQLite, FileMaker, Numbers,
      and other destinations.
  package-nerd-significance:
    - >
      MDB/ACCDB Viewer occupies a useful package niche: a native Mac reader and export
      bridge for a proprietary database ecosystem centered on Windows. Database-oriented
      users care particularly about its schema and data exports and its handling of
      legacy Access encodings and field types.
  project-history:
    - >
      Jakob Egger's application was originally named MDB Viewer. Version 2.2 renamed it
      MDB ACCDB Viewer to reflect support for modern ACCDB databases and also added MDE
      and ACCDE support. Subsequent releases added XLSX improvements, modern macOS
      compatibility, Apple-silicon support, dark mode, and database-export fixes.
  related-projects:
    - Microsoft Access
    - Microsoft Jet Database Engine
    - PostgreSQL
    - MySQL
    - SQLite
    - Microsoft Excel
  sources:
    - https://eggerapps.at/mdbviewer/docs/en/
    - https://eggerapps.at/mdbviewer/docs/en/file-formats.html
    - https://eggerapps.at/mdbviewer/docs/en/whats-new.html
  summary:
    - >
      MDB/ACCDB Viewer is a read-only macOS application by Egger Apps for opening
      Microsoft Access databases and exporting their tables to other data formats and
      database systems.
  timeline:
    - >
      2011: The official documentation copyright range begins, indicating the product
      was established by this year.
    - 'Version 2.2: MDB Viewer was renamed MDB ACCDB Viewer and gained MDE and ACCDE support.'
    - >
      Version 2.3: The app became a universal binary with native Apple-silicon support
      and added dark mode.
  usage:
    - >
      Users open Access 97-or-newer MDB or ACCDB files, inspect tables, and export data
      to formats such as CSV, XLSX, or SQL. The viewer is read-only and displays tables
      rather than Access forms or queries; encrypted ACCDB files are not supported.
