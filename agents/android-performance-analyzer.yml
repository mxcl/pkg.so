history:
  adoption-history:
    - >
      Google positions APA specifically for profiling games and Vulkan-based graphics;
      its documentation directs developers of other applications to Android Studio
      profilers.
  package-nerd-significance:
    - >
      APA gives Android performance specialists a dedicated trace-analysis workflow for
      graphics-heavy software, including Vulkan debug annotations, frame analysis,
      memory analysis, and comparison of multiple traces.
  project-history:
    - >
      Google introduced Android Performance Analyzer as a new profiler and
      performance-analysis tool for the Android ecosystem. The official download page
      distributes desktop builds for Linux, macOS, and Windows under the Android SDK
      license.
  related-projects:
    - >
      Android Studio profilers provide the recommended profiling workflow for Android
      applications outside APA's current games-and-Vulkan focus.
    - >
      Android GPU Inspector and Perfetto occupy related parts of Android's graphics and
      system-tracing toolchain.
  sources:
    - >
      Android Developers APA overview and downloads:
      https://developer.android.com/android-performance-analyzer
    - >
      Android Developers APA quickstart:
      https://developer.android.com/android-performance-analyzer/quickstart
  summary:
    - >
      Android Performance Analyzer (APA) is Google's desktop trace profiler for
      optimizing Android games and Vulkan-based graphics workloads.
  timeline:
    - >
      2026: Official APA documentation and cross-platform desktop downloads were
      published through Android Developers.
  usage:
    - >
      Developers record or import system traces, organize them in projects, inspect
      frame processing and memory behavior, analyze thread scheduling, and compare
      traces during performance experiments.
