id: brew:dstp
display-name: dstp
repo: null
docs:
  - https://github.com/ycd/dstp#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Homebrew, Go install, Nix, Arch AUR, and GitHub release
      downloads for macOS, Linux, and Windows. Homebrew packages v0.4.23 from the GitHub
      release tag.
    - >
      Evidence for broad adoption is limited, but its presence in Homebrew and Nix shows
      the kind of small diagnostic binary that package sets include because it is cheap
      to package and useful during incident triage.
  package-nerd-significance:
    - >
      dstp is interesting mostly as a small Go networking tool with multi-platform
      release artifacts and package-manager coverage. It illustrates how a
      single-purpose diagnostic idea can become a normal `brew install` command without
      a large ecosystem around it.
    - >
      Its name also collides with the `docker stop` alias in some oh-my-zsh setups, a
      small but very package-nerd detail documented by the upstream README.
  project-history:
    - >
      The GitHub repository was created in November 2021. The README says the motivation
      came from a Lobsters discussion about diagnosing DNS-related failures, then shaped
      that idea into a compact command with plaintext or JSON output.
    - >
      The release history was concentrated around late 2021, with v0.1.0 through v0.4.0
      appearing in November, and later maintenance releases leading to v0.4.23 in
      January 2025.
  related-projects:
    - Go is the implementation and source-install path documented by the README.
    - Nix and Arch AUR are documented as alternate package channels.
    - >
      Docker and oh-my-zsh are relevant only because the README documents a command
      alias collision with `dstp`.
  sources:
    - https://github.com/ycd/dstp
    - https://api.github.com/repos/ycd/dstp
    - https://api.github.com/repos/ycd/dstp/releases
    - https://formulae.brew.sh/api/formula/dstp.json
  summary:
    - >
      dstp is a small Go CLI for running common network checks against a site, including
      address, DNS, ping, TLS, and HTTPS-oriented diagnostics. It is a
      package-manager-friendly utility in the tradition of tiny command-line probes for
      answering 'is the site reachable, and where is it failing?'
  timeline:
    - '2021-11: The dstp GitHub repository is created.'
    - '2021-11: GitHub releases publish v0.1.0 through v0.4.0.'
    - '2025-01: GitHub releases and Homebrew package v0.4.23.'
  usage:
    - >
      Users run `dstp --addr` with a URL or IP address and can request plaintext or JSON
      output, set ping packet counts and timeouts, choose a port for TLS and HTTPS
      tests, and use a custom DNS server for resolution.
    - >
      The tool has no documented config file or credential store; it is meant to be
      driven entirely by command-line options.
related-packages:
  - id: brew:doggo
    reason: >
      Use doggo after dstp flags a resolution problem to inspect DNS records and modern
      encrypted DNS transports in substantially greater detail.
    rel: adjacent_workflow
    sources:
      - https://github.com/ycd/dstp#readme
      - https://doggo.mrkaran.dev/docs
  - id: brew:curl
    reason: >
      Use curl after dstp's basic HTTPS check when you need detailed request, response,
      certificate, protocol, redirect, or transfer diagnostics.
    rel: adjacent_workflow
    sources:
      - https://github.com/ycd/dstp#readme
      - https://curl.se/docs/manpage.html
  - id: brew:mtr
    reason: >
      Use mtr when dstp's endpoint ping indicates connectivity trouble and you need
      continuous per-hop latency and packet-loss measurements along the network path.
    rel: adjacent_workflow
    sources:
      - https://github.com/ycd/dstp#readme
      - https://www.bitwizard.nl/mtr/
