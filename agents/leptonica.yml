history:
  adoption-history:
    - >
      Leptonica became important infrastructure below OCR and document-image projects.
      Its README lists Tesseract OCR, OpenCV, and jbig2enc among open source projects
      that use it.
    - >
      The project's packaging history reflects a classic C-library role: distributions
      ship the library, headers, command-line utilities, and example programs so
      higher-level tools can depend on a stable native image-processing base.
  package-nerd-significance:
    - >
      Leptonica is significant because it is one of those quiet dependency packages that
      makes OCR stacks work. It is small enough to feel like a C utility library, but
      large enough to cover thousands of image-processing functions and the boring
      portability details that downstream packages need.
  project-history:
    - >
      Leptonica's official README metadata dates the work to 2001 and describes it as an
      open source C library for efficient image processing and image analysis. The
      project site emphasizes a pedagogical style: the code is accompanied by web pages
      explaining algorithms and design methods.
    - >
      The library grew into a broad C toolkit covering raster operations, affine and
      projective transforms, morphology, convolution, connected components, image format
      I/O, PDF and PostScript generation, document cleanup, skew detection, dewarping,
      barcode experiments, and many supporting data structures.
  related-projects:
    - Tesseract OCR is a major downstream user.
    - OpenCV and jbig2enc are listed by Leptonica as open source projects using the library.
  sources:
    - https://github.com/DanBloomberg/leptonica
    - https://www.leptonica.org/
    - https://www.leptonica.org/source/README.html
    - https://www.leptonica.org/source/version-notes.html
  summary:
    - >
      Leptonica is Dan Bloomberg's open source C library for image processing and image
      analysis, with especially deep coverage of document-image operations used by OCR
      and page-processing tools.
  timeline:
    - >
      2001: Official metadata identifies Leptonica as an open source C library for image
      processing and image analysis.
    - >
      2010s: Leptonica moved into GitHub-based maintenance, with contributors preserving
      old distributions and modernizing build support.
    - '2024: Version 1.85.0 added PDF rendering support and many maintenance fixes.'
    - '2025: Version 1.87.0 was distributed on December 24, 2025.'
  usage:
    - >
      Developers link against liblept and use the pix-centered API for reading,
      transforming, analyzing, and writing images. The package also includes
      command-line programs such as file conversion and PDF/PostScript helpers that
      expose common library workflows.
related-packages:
  - id: brew:tesseract
    reason: >
      Tesseract uses Leptonica for image loading and preprocessing, so the two form the
      standard packaged OCR engine and document-image library stack.
    rel: adjacent_workflow
    sources:
      - https://github.com/DanBloomberg/leptonica
      - https://github.com/tesseract-ocr/tesseract
  - id: brew:jbig2enc
    reason: >
      jbig2enc is an official downstream Leptonica user that combines Leptonica's image
      handling with JBIG2 compression for multipage binary documents.
    rel: adjacent_workflow
    sources:
      - https://github.com/DanBloomberg/leptonica
      - https://github.com/agl/jbig2enc
