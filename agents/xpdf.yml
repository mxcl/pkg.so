history:
  adoption-history:
    - >
      Xpdf became a fixture on Unix-like systems because it was small, scriptable, and
      useful before PDF support was built into every desktop environment. The
      command-line tools made it valuable even for users who never launched the GUI
      viewer: pdftotext, pdfinfo, pdffonts, pdfimages, pdftops, pdftoppm, and pdftopng
      fit naturally into shell pipelines.
    - >
      Poppler's creation shows the scale of downstream adoption. Its README says many
      applications incorporated the Xpdf code base and that duplicated security and
      maintenance work motivated a shared library fork using modern Unix desktop
      components such as fontconfig and cairo.
    - >
      Today Xpdf remains relevant as a compact upstream toolkit and as a historical root
      of PDF handling in free desktops. Some distributions package Xpdf-derived viewers
      differently from Poppler utilities, but the conceptual split between viewer,
      rendering engine, and CLI PDF tools is part of Xpdf's legacy.
  package-nerd-significance:
    - >
      Xpdf is one of the classic examples of a small Unix GUI application whose
      command-line utilities became just as important as the viewer. Packaging it gives
      users a PDF reader, but it also gives scripts a set of focused PDF inspection and
      conversion commands.
    - >
      Its relationship with Poppler is historically important for package maintainers:
      one upstream codebase became both a standalone viewer/toolkit and the origin point
      for a shared rendering library used by many other applications. That fork explains
      why similar PDF tools and libraries often appear side by side in package
      collections.
    - >
      Xpdf also sits at the intersection of old X11 desktop software and modern
      cross-platform Qt software, making it a useful marker of how long-lived Unix tools
      survive by keeping a stable command-line surface while changing GUI/toolkit
      internals.
  project-history:
    - >
      The official Xpdf about page says Xpdf was first released in 1995, written by
      Derek Noonburg, and still developed by him. Early Xpdf was closely associated with
      Unix and the X Window System; modern Xpdf uses Qt and ships cross-platform tools
      for Linux, Windows, and Mac.
    - >
      Xpdf's code became a base for a broader ecosystem. Poppler's README states that
      Poppler is a fork of the Xpdf PDF viewer developed by Derek Noonburg of Glyph &
      Cog, created to provide shared PDF rendering functionality and centralize
      maintenance effort for applications that had embedded Xpdf-derived code.
    - >
      The project later separated branding between the open source xpdf package and
      XpdfReader. The official site describes XpdfReader as a closed-source viewer build
      with extra features, while the xpdf package remains the open source viewer and
      tool collection.
  related-projects:
    - >
      Poppler is the major Xpdf-derived PDF rendering library used by many free-desktop
      applications.
    - >
      Evince and Okular are adjacent desktop PDF viewers commonly associated with
      Poppler-based stacks.
    - >
      BePDF, !PDF, SWFTools, PDFKit, and other projects are listed by Xpdf as open
      source projects based on Xpdf.
    - >
      MuPDF and PDF.js are related PDF engines with different implementation and
      packaging tradeoffs.
  sources:
    - https://gitlab.freedesktop.org/poppler/poppler/-/raw/master/README.md
    - https://www.xpdfreader.com/
    - https://www.xpdfreader.com/about.html
    - https://www.xpdfreader.com/download.html
    - https://www.xpdfreader.com/opensource.html
  summary:
    - >
      Xpdf is a long-running PDF viewer and command-line toolkit from Glyph & Cog,
      developed by Derek Noonburg. The official site describes it as a PDF viewer plus
      tools for text extraction, PostScript conversion, image conversion, HTML
      conversion, metadata extraction, font listing, attachment extraction, and raw
      image extraction.
    - >
      Its package-nerd importance comes from being both an end-user viewer and one of
      the ancestral codebases for Unix PDF tooling, including the Poppler fork that many
      modern desktop applications and distributions use.
  timeline:
    - '1995: Xpdf is first released, according to the official Xpdf about page.'
    - >
      2000s: Xpdf code is widely reused by PDF viewers and tools, creating maintenance
      pressure around duplicated embedded code.
    - >
      2005: Poppler is created as a fork of Xpdf to provide shared PDF rendering
      functionality and modern desktop integration.
    - >
      2010s: Xpdf 4.x moves the viewer line to a Qt-based, cross-platform presentation
      under the XpdfReader site.
    - '2025-11-14: The official download page lists Xpdf 4.06 as the current release.'
  usage:
    - >
      Typical package usage is split between viewing and conversion. Users launch xpdf
      to read a document, or use command-line tools to extract text, inspect metadata
      and fonts, convert pages to images, convert PDFs to PostScript or HTML, and
      extract embedded images or attachments.
    - >
      The configuration file xpdfrc controls viewer and tool behavior, including font
      paths, language support, and related settings. That makes Xpdf useful in both
      interactive desktop setups and controlled batch environments where predictable PDF
      extraction matters.
    - >
      Because PDFs are untrusted document inputs, Xpdf and its descendants also matter
      to security maintenance. Poppler explicitly calls out PDF rendering as sensitive
      to security bugs, and the shared-library fork was partly a response to the
      maintenance burden of many applications carrying Xpdf-derived code.
