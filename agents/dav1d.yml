history:
  adoption-history:
    - >
      The project became package-manager-relevant because AV1 needed a fast software
      decoder on desktops, mobile systems, and other platforms before hardware support
      was universal. Its roadmap highlights portability, SIMD work, and
      architecture-specific optimization.
  package-nerd-significance:
    - >
      dav1d is significant because it made AV1 decoding practical as a small system
      package: fast enough for real playback, permissively licensed, and maintained by a
      media-toolchain community.
  project-history:
    - >
      The dav1d README describes a decoder focused on speed and correctness, created to
      overcome the early lack of AV1 hardware decoding. It identifies the VideoLAN
      GitLab repository as canonical and notes partial funding by the Alliance for Open
      Media.
  related-projects:
    - >
      Related projects include AV1, Alliance for Open Media, VideoLAN, VLC, FFmpeg,
      libaom, and platform SIMD toolchains.
  sources:
    - https://code.videolan.org/videolan/dav1d/-/blob/master/README.md
    - https://code.videolan.org/videolan/dav1d/-/blob/master/NEWS
    - https://videolan.videolan.me/dav1d
  summary:
    - >
      dav1d is VideoLAN's small, fast, cross-platform AV1 decoder, written in C and
      assembly and designed for broad embedding.
  timeline:
    - '2018: dav1d development begins in the early AV1 software-decoder era.'
    - '2023: 1.x releases continue with new SIMD and API work.'
    - '2025: 1.5.x releases focus on maintenance and architecture optimizations.'
  usage:
    - >
      Package users install the command-line tool and library when they need AV1
      decoding support, tests, benchmarks, or downstream multimedia software linked
      against a permissively licensed decoder.
related-packages:
  - id: brew:aom
    reason: >
      Choose libaom when you need the AOMedia reference implementation or AV1 encoding
      as well as decoding; choose dav1d for a focused, small, performance-oriented AV1
      decoder.
    rel: alternative
    sources:
      - https://images.videolan.org/projects/dav1d.html
      - https://aomedia.googlesource.com/aom
  - id: brew:ffmpeg
    reason: >
      FFmpeg can be built with libdav1d and uses it through a documented decoder wrapper
      to decode AV1 streams within broader transcoding and playback workflows.
    rel: adjacent_workflow
    sources:
      - https://www.ffmpeg.org/general.html
      - https://www.ffmpeg.org/ffmpeg-codecs.html
      - https://images.videolan.org/projects/dav1d.html
