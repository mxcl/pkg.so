history:
  adoption-history:
    - >
      The vendor describes Neat Reader as a cross-platform EPUB application with clients
      for macOS, Windows, Android, and iOS plus a browser application. It reports
      millions of users worldwide, although that figure is vendor-supplied.
    - >
      The macOS desktop client is distributed through the Homebrew cask recorded in
      source_facts.package-manager, while optional accounts and premium plans add cloud
      storage and cross-device synchronization.
  package-nerd-significance:
    - >
      Neat Reader represents the polished, freemium side of EPUB tooling: one library
      and annotation workflow spanning desktop, mobile, and web rather than a local-only
      Unix utility.
    - >
      For Homebrew users, the cask provides a convenient installation path for the macOS
      client, but the product itself is proprietary and service-oriented rather than an
      open-source package.
  project-history:
    - >
      Neat Reader began with a V1 beta capable of opening local EPUB files, rendering
      books, and providing basic library management. Later V1 releases added login,
      synchronization, cloud storage, settings, and category management.
    - >
      Subsequent generations redesigned the application, replaced its internal EPUB SDK,
      and improved parsing, search, rendering, and page-number calculation. The product
      expanded into a cross-platform reader with optional synchronized storage.
  related-projects:
    - Calibre, which the official help center recommends for normalizing malformed EPUB files
    - The EPUB publishing format
  sources:
    - https://www.neat-reader.com/download/windows-epub-reader
    - https://www.neat-reader.com/help
    - https://www.neat-reader.com/membership-mobile
    - https://www.neat-reader.com/webapp
    - source_facts.package-manager
  summary:
    - >
      Neat Reader is a freemium EPUB reader and library manager for desktop, mobile, and
      web. Its core workflow covers reading, highlights, annotations, bookmarks, and
      book organization, with paid cloud storage and synchronization available across
      devices.
  timeline:
    - 'V1.0.0 beta: First public beta provided local EPUB rendering and basic management'
    - 'V1.0.2 beta: Added login and data synchronization'
    - 'V1.0.3 beta: Added cloud-storage management'
    - 'V2–V3: Introduced a new design, application logic, and EPUB SDK'
  usage:
    - >
      Import local EPUB books to read, organize, highlight, and annotate them. The
      official help notes that encrypted, damaged, or non-standard EPUB files may fail
      to import.
    - >
      Users who need the same library on multiple devices can sign in and use the
      premium cloud synchronization features. The browser version caches local books in
      browser storage, so the vendor recommends desktop clients or cloud backup for
      larger libraries.
