credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is still early but visible in Unix package channels: the official README
      lists Homebrew, Arch, Nix, NetBSD, Snap, Cargo, and prebuilt GitHub releases. That
      pattern fits a terminal-first Rust utility whose audience discovers tools through
      package managers and TUI communities.
  package-nerd-significance:
    - >
      bulletty is notable less for ecosystem scale than for its data model: it treats
      RSS as a local, file-oriented workflow similar to an Obsidian vault. For
      package-history purposes it is an example of the modern Rust TUI wave combining
      Ratatui-style interfaces, XDG-style data directories, and package-manager
      distribution.
  project-history:
    - >
      The public GitHub repository was created in May 2025 and describes the project as
      a TUI feed reader and aggregator written for users who want to decide where their
      feed data lives. Its README frames the project around local ownership, offline
      reading, OPML import/export, themes, hooks, and a Markdown directory structure
      under the user's local data directory.
    - >
      The 2025-2026 release notes show rapid early iteration: v0.1.9 added a
      directory-reporting command and OPML import/export, v0.2.0 added Read Later
      support, and early 2026 releases refined metadata handling and UI feedback.
  related-projects:
    - >
      Related package-manager neighbors include Newsboat and other terminal feed
      readers, plus Markdown-backed personal knowledge tools. Its implementation and
      packaging also connect it to the Ratatui/Rust TUI ecosystem.
  sources:
    - https://github.com/CrociDB/bulletty
    - https://github.com/CrociDB/bulletty/releases
    - https://raw.githubusercontent.com/CrociDB/bulletty/main/README.md
    - source_facts.package-manager
  summary:
    - >
      bulletty is a young terminal RSS and Atom reader whose distinguishing idea is to
      keep feed subscriptions, entries, highlights, and comments in local Markdown files
      rather than inside a hosted service or opaque database.
  timeline:
    - '2025-05: Public GitHub repository created.'
    - '2025-09: v0.1.7 released during early public development.'
    - '2025-10: v0.1.9 added directory reporting and OPML import/export.'
    - '2025-11: v0.2.0 added Read Later support.'
    - '2026-02: v0.2.2 release notes described themes, notifications, and continued bug fixes.'
  usage:
    - >
      Typical use starts by adding RSS or Atom feeds with the CLI, then running the TUI
      to synchronize, browse categories, read entries, and open links externally. The
      project stores feed content as Markdown so users can back up, sync, search, or
      process the feed library with ordinary file tools.
related-packages:
  - id: brew:newsboat
    reason: >
      Choose Newsboat when you want a mature text-console RSS/Atom reader with extensive
      configuration and remote-feed-service integrations; choose bulletty for a
      Markdown-backed local library and embedded reader.
    rel: alternative
    sources:
      - https://bulletty.croci.dev/
      - https://newsboat.org/
