history:
  adoption-history:
    - >
      Hytale built a large pre-release community following its 2018 announcement. After
      cancellation was announced in June 2025, a community-backed revival culminated in
      the original founders reacquiring the project in November 2025 and releasing it in
      early access on January 13, 2026.
  package-nerd-significance:
    - >
      The Homebrew cask gives macOS users a package-manager-native way to install and
      update a proprietary game launcher—an application class more commonly distributed
      through bespoke download pages.
  project-history:
    - >
      Hytale grew out of the Hypixel Minecraft map-making and multiplayer-server
      community. Hypixel Studios announced the game in December 2018, was acquired by
      Riot Games in 2020, ended development in June 2025, and returned to its original
      founders as an independent studio in November 2025.
  related-projects:
    - >
      The project is historically related to the Hypixel Minecraft server, whose modding
      and minigame culture shaped Hytale's creative tools and multiplayer ambitions.
  sources:
    - 'Early-access release announcement: https://hytale.com/news/2026/1/hytale-is-finally-here'
    - 'Homebrew package identity: source_facts.package-manager'
    - 'Official studio history: https://hytale.com/about'
    - 'Original 2018 announcement: https://www.hytale.com/news/2018/11/simon-and-rezzus'
    - 'Revival announcement: https://hytale.com/news/2025/11/2025-11-17-hytale-is-saved/'
  summary:
    - >
      Hytale is a sandbox role-playing and creation game developed by Hypixel Studios.
      Its launcher installs and manages the game, profiles, and release updates.
  timeline:
    - '2018: Hytale and Hypixel Studios were publicly announced.'
    - '2020: Riot Games acquired Hypixel Studios.'
    - >
      2025: Development was cancelled in June and revived under the original founders in
      November.
    - '2026: Hytale entered early access on January 13.'
  usage:
    - >
      Players use the launcher to install Hytale, select a game profile, receive
      updates, and manage the local game installation. The official support guide
      documents Windows, macOS, and Linux launcher workflows.
