id: cask:dosbox
display-name: DOSBox
repo: https://sourceforge.net/p/dosbox/code-0/HEAD/tree
docs:
  - https://www.dosbox.com/DOSBoxManual.html
  - https://www.dosbox.com/wiki
config-file-location:
  linux:
    - ~/.dosbox/dosbox-{version}.conf
  macos:
    - ~/Library/Preferences/DOSBox {version} Preferences
  windows:
    - '%LOCALAPPDATA%\DOSBox\dosbox-{version}.conf'
credentials-file-location: null
history:
  adoption-history:
    - >
      DOSBox became the de facto way to run MS-DOS games on modern operating systems.
      Its portability brought DOS software to Windows, macOS, Linux, BSD, and
      less-common host platforms after native DOS compatibility had disappeared from
      mainstream systems.
    - >
      Commercial storefronts and publishers adopted it as packaging infrastructure for
      rereleased DOS games: the original game files, a private DOSBox build,
      configuration, and a launcher can be shipped together as a self-contained modern
      application.
  package-nerd-significance:
    - >
      DOSBox is a canonical example of an emulator functioning as a compatibility
      runtime. Packagers can preserve an unchanged DOS executable while declaring its
      virtual drives, emulated hardware, CPU speed, sound devices, and startup commands
      in configuration.
    - >
      Its long-lived stable series and open development also produced an extensive
      ecosystem of frontends, downstream builds, libretro cores, and specialized forks
      such as DOSBox Staging and DOSBox-X.
  project-history:
    - >
      Dutch programmers Peter Veenstra and Sjoerd van der Berg created DOSBox around
      2000 to restore DOS-game compatibility as Windows moved away from its DOS-based
      lineage. The first public version, DOSBox 0.1, was released on 31 January 2002.
    - >
      DOSBox combines an x86 CPU emulator, a DOS-like environment, and emulation of
      period graphics, audio, input, and networking hardware. This avoids requiring
      users to install a separate copy of DOS.
  related-projects:
    - DOSBox Staging
    - DOSBox-X
    - DOSBox Pure
    - ScummVM
    - FreeDOS
  sources:
    - https://www.dosbox-staging.org/0.83/manual/introduction/what-is-dosbox-staging/
    - https://www.dosbox.com/
    - https://www.dosbox.com/DOSBoxManual.html
    - https://www.dosbox.com/wiki/Releases%3AAll
  summary:
    - >
      DOSBox is an open-source x86 and DOS environment emulator primarily used to run
      DOS games on modern operating systems.
  timeline:
    - '2002-01-31: DOSBox 0.1 became the first public release.'
    - '2010-05-12: DOSBox 0.74 was released and became the long-lived stable baseline.'
    - '2019-06-26: DOSBox 0.74-3 delivered security and rendering fixes.'
  usage:
    - >
      Users mount a host directory or disk image as a DOS drive, change to that virtual
      drive, and start an executable. The configuration file controls emulated machine
      type, CPU speed, memory, graphics, sound, input, networking, drive mounts, and
      startup commands.
