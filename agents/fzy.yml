history:
  adoption-history:
    - >
      The upstream README documents installation through Homebrew, MacPorts, Arch
      Linux/MSYS2 pacman, FreeBSD pkg, Gentoo Portage, Ubuntu/Debian apt, pkgsrc,
      openSUSE zypper, and source builds. That breadth reflects fzy's role as a compact
      Unix-style filter that distribution maintainers can package easily.
  package-nerd-significance:
    - >
      fzy is significant as the minimal C member of the fuzzy-finder family: it exposes
      the classic stdin-to-stdout Unix interface, has a documented scoring algorithm,
      avoids a large runtime, and is small enough to be carried by many Unix package
      systems.
  project-history:
    - >
      The repository was created in July 2014, and GitHub Releases show early 0.x
      releases in October 2014. The README positions fzy against fzf, pick, selecta,
      ctrlp, and similar tools, arguing that its scoring favors consecutive letters and
      word starts rather than merely short matches.
    - >
      The 1.0 release was published in 2018, and the fzy 1.1 man page is dated July
      2025. The man page describes the stable core interface: read newline-separated
      items from stdin, show a terminal menu, narrow with fuzzy matching, and print the
      selected item to stdout.
  related-projects:
    - >
      The README compares fzy with fzf, pick, selecta, and ctrlp, and lists fzy.js as a
      JavaScript port. Its Vim usage examples place it in the same editor-workflow space
      as older fuzzy file selectors.
  sources:
    - https://api.github.com/repos/jhawthorn/fzy
    - https://github.com/jhawthorn/fzy
    - https://github.com/jhawthorn/fzy/releases
    - https://raw.githubusercontent.com/jhawthorn/fzy/master/README.md
    - https://raw.githubusercontent.com/jhawthorn/fzy/master/fzy.1
  summary:
    - >
      fzy is a small fuzzy text selector for the terminal, written in C, with an
      emphasis on speed, simplicity, and scoring quality. Its README presents it as both
      a command-line selector and an editor-plugin building block.
  timeline:
    - '2014: GitHub repository created.'
    - '2014: Releases 0.1 and 0.2 published.'
    - '2018: Release 1.0 published.'
    - '2025: Release v1.1 published and man page dated for fzy 1.1.'
  usage:
    - >
      fzy is normally used as a filter in shell pipelines, for example `ls | fzy`, `vi
      $(find -type f | fzy)`, choosing a directory to `cd` into, selecting a process to
      kill, or selecting a Git branch. The README also gives Vim integration examples
      that pipe file lists through fzy and then open the selected file.
related-packages:
  - id: brew:fzf
    reason: >
      Choose fzf when you need a more programmable fuzzy finder with previews, shell
      completion, event bindings, built-in traversal, and broader editor and multiplexer
      integration.
    rel: alternative
    sources:
      - https://github.com/jhawthorn/fzy#readme
      - https://github.com/junegunn/fzf#readme
  - id: brew:pick
    reason: >
      pick is another small Unix-pipeline selector named by fzy's official comparison;
      choose it when a deliberately minimal interactive choice utility is preferable to
      fzy's scoring-focused interface.
    rel: alternative
    sources:
      - https://github.com/jhawthorn/fzy#readme
      - https://github.com/mptre/pick#readme
