      convenient to install on macOS.
  package-nerd-significance:
    - >
      Nanosaur II illustrates a distinctive packaging niche: community-maintained source
      ports that preserve commercial-era Mac games while making them installable on
      current operating systems. Its CMake-based source tree and ready-made releases
      turn a legacy title into a conventional modern desktop package.
  project-history:
    - >
      Pangea Software originally released Nanosaur II in 2004. Jorio later ported the
      original Mac game to modern operating systems and re-released it with Pangea
      Software's permission under CC BY-NC-SA 4.0.
  related-projects:
    - Nanosaur, the original game and another Jorio-maintained source port.
    - >
      Jorio's ports of other Pangea titles, including Bugdom, Cro-Mag Rally, Mighty
      Mike, Otto Matic, and Billy Frontier.
