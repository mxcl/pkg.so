  summary:
    - >
      Nanosaur II: Hatchling is a modern source port of Pangea Software's 2004 dinosaur
      action game. Players control an armed pterodactyl through an adventure campaign
      and six two-player modes.
  timeline:
    - '2004: Pangea Software released the original Nanosaur II.'
    - >
      2004–2008: The copyright period stated by the official port covers the original
      Pangea release era.
    - >
      Modern-port era: Jorio re-released the game for macOS, Windows, and Linux with
      Pangea Software's permission.
  usage:
    - >
      Players use the packaged application for the three-level egg-rescue campaign or
      local two-player racing, capture-the-flag, and battle modes. The repository also
      serves developers building or maintaining the cross-platform port.
