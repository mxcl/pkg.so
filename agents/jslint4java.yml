config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package was useful in the period before JavaScript linting consolidated around
      Node.js-based tools. Java shops could run JSLint from Maven or Ant without
      introducing a separate JavaScript runtime into the build.
  package-nerd-significance:
    - >
      jslint4java is a small fossil from the Google Code and Java build-tool era: a Java
      wrapper that made a JavaScript quality tool fit Maven Central, Ant, and distro
      packaging before npm-based linting became the common packaging path.
  project-history:
    - >
      The Maven POM records an inception year of 2007, Dominic Mitchell as developer,
      Google Code issue management, and GitHub as the source-control location. The
      archived project description and GitHub README describe it as a simple interface
      for detecting potential problems in JavaScript code.
  related-projects:
    - >
      jslint4java wraps Douglas Crockford's JSLint and relates to Java build
      integrations such as Ant and Maven. It predates the broader shift toward Node.js
      linters such as JSHint, ESLint, and npm-distributed command-line tooling.
  sources:
    - >
      https://central.sonatype.com/artifact/com.googlecode.jslint4java/jslint4java-parent/2.0.2
    - https://code.google.com/archive/p/jslint4java
    - https://github.com/happygiraffe/jslint4java
    - https://github.com/happygiraffe/jslint4java/blob/master/pom.xml
  summary:
    - >
      jslint4java is a Java wrapper around Douglas Crockford's JSLint. It packaged
      JavaScript linting for Java-centric build environments by exposing command-line,
      Ant, Maven, and library integrations.
  timeline:
    - '2007: The upstream Maven POM records the project inception year.'
    - '2011: Version 2.0.0 appears in the Git tag series.'
    - '2013: Version 2.0.5 appears as the later tagged release in the upstream repository.'
    - >
      2015: Google Code shuts down project hosting, leaving the Google Code Archive page
      as the historical homepage.
  usage:
    - >
      Typical usage was running the jar from the command line against JavaScript files,
      wiring the Ant task into an Ant build, or using the Maven plugin during a build
      phase to fail on lint errors.
related-packages:
  - id: brew:eslint
    reason: >
      ESLint is the stronger alternative for modern JavaScript projects because it
      performs the same linting task through a maintained Node.js toolchain with
      pluggable rules, while jslint4java is designed around JSLint and Java build
      integration.
    rel: alternative
    sources:
      - https://github.com/happygiraffe/jslint4java#readme
      - https://eslint.org/docs/latest/use/getting-started
