history:
  adoption-history:
    - >
      The vendor positions the application as a consumer-oriented DVD digitization
      product used internationally, with a trial edition and a paid registered edition.
      The official product page associates the broader MacXDVD brand with a 2009
      founding date.
    - >
      The application has been maintained across many macOS generations and continues to
      be distributed as a downloadable DMG outside the Mac App Store.
  package-nerd-significance:
    - >
      MacX DVD Ripper Pro represents the proprietary side of the macOS media-tool
      ecosystem: a signed application bundle delivered by cask rather than an
      open-source command-line encoder.
    - >
      Its packaging is useful to curators because installation is conventional while
      licensing, disc-analysis updates, media codecs, and output destinations remain
      application-managed.
  project-history:
    - >
      MacX DVD Ripper Pro was developed by Digiarty as a graphical macOS application for
      converting and backing up DVD video. Official guides dating from the mid-2010s
      document support for common video, audio, and device-oriented output profiles.
    - >
      Later official material emphasizes hardware acceleration, ISO and DVD-folder
      input, title analysis, editing, subtitle handling, and lossless backup modes.
  related-projects:
    - >
      The product belongs to Digiarty's MacXDVD software family, alongside MacX Video
      Converter and media-transfer products.
  sources:
    - >
      Official PDF help document:
      https://www.macxdvd.com/download/macx-dvd-ripper-pro-user-guide.pdf
    - 'Official product page: https://www.macxdvd.com/mac-dvd-ripper-pro/index.htm'
    - 'Official user guide: https://www.macxdvd.com/guide/mac-dvd-ripper-pro.htm'
  summary:
    - >
      MacX DVD Ripper Pro is Digiarty's commercial macOS application for reading DVDs,
      ISO images, and DVD folders and converting or backing them up to common video and
      audio formats.
  timeline:
    - '2009: The official product page dates the founding of the MacXDVD brand to this year.'
    - >
      2015: Digiarty's official PDF guide documented the product's DVD conversion and
      backup workflow.
    - >
      2020s: Official releases continued supporting modern conversion profiles and
      hardware-accelerated processing.
  usage:
    - >
      Users load a disc, ISO image, or DVD folder, choose a backup or conversion profile
      and destination folder, then start processing with the RUN control. Optional tools
      cover trimming, cropping, subtitles, metadata, and output parameters.
    - >
      The trial limits conversion length and some advanced features. Registration uses
      an email address and license code entered in the application's Register window;
      the official documentation does not identify a credentials file or a persistent
      configuration-file path. Users should comply with copyright and applicable
      anti-circumvention laws.
