config-file-location:
  unix:
    - ~/.gitconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      ghq has a durable following among developers who keep many open-source and work
      repositories on one machine. Its official README lists installation paths through
      Homebrew, Void Linux, GNU Guix, Scoop, Go install, conda, asdf, mise, source
      build, and release binaries.
  package-nerd-significance:
    - >
      Package nerds care about ghq because it turns a developer's source tree into an
      indexable package-like store. It is small, scriptable, and especially useful when
      combined with shell functions, fuzzy search, and editor launchers.
  project-history:
    - >
      The ghq repository was created in 2013. Its README describes the tool as a way to
      organize remote repository clones like `go get`: a `ghq get` command places a
      checkout under a root directory, using the remote URL host and path as the local
      directory structure.
    - >
      The project grew from a simple clone-and-list helper into a workspace manager with
      multiple roots, git-config based settings, support for several VCS backends,
      repository removal, migration of existing repositories into ghq layout, shallow
      and partial clone options, shell completions, and Windows packaging.
  related-projects:
    - >
      ghq is related to `go get` style source layouts, Git configuration, Mercurial and
      other VCS backends, fuzzy finders, editor launchers, and the community
      ghq-handbook project.
  sources:
    - https://api.github.com/repos/x-motemen/ghq
    - https://github.com/x-motemen/ghq
    - https://github.com/x-motemen/ghq/blob/master/CHANGELOG.md
    - https://github.com/x-motemen/ghq/blob/master/README.adoc
    - https://github.com/x-motemen/ghq/releases/tag/v0.2
  summary:
    - >
      ghq is a command-line repository manager that gives remote Git and other VCS
      clones a predictable local directory layout.
  timeline:
    - '2013: GitHub repository created.'
    - '2014: v0.2 published on GitHub Releases.'
    - >
      2020: README documents installation through multiple package managers and release
      binaries.
    - '2024: ghq added repository removal support.'
    - >
      2026: ghq added migration support for existing repositories and worktree-aware
      operations.
  usage:
    - >
      Practitioners use ghq to fetch repositories into `~/ghq` or another configured
      root, list known checkouts, pipe repository paths into fuzzy finders or editors,
      remove managed clones, and migrate older working trees into a consistent
      host/user/project hierarchy.
