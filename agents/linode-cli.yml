id: brew:linode-cli
display-name: Linode CLI
repo: https://github.com/linode/linode-cli
docs:
  - https://techdocs.akamai.com/cloud-computing/docs/cli
  - https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
config-file-location:
  unix:
    - ~/.config/linode-cli
credentials-file-location:
  unix:
    - ~/.config/linode-cli
history:
  adoption-history:
    - >
      The old CLI was packaged for Debian, Ubuntu, CentOS, Fedora, NixOS, and Homebrew,
      showing that Linode users wanted cloud operations available outside the web
      manager before API v4. The current Akamai TechDocs page positions the CLI as a
      wrapper around the Linode API for managing an Akamai Cloud Computing account, with
      almost any Cloud Manager task also available through the CLI.
  package-nerd-significance:
    - >
      Linode CLI is interesting because it is generated from an API description instead
      of being purely handwritten. For package maintainers, that means CLI behavior
      follows the provider's API surface, while users get a stable local command for
      automating cloud resources.
  project-history:
    - >
      Linode had an older Perl-based CLI in the linode/cli repository. That repository
      now describes itself as deprecated and points users to linode/linode-cli, the
      newer CLI built for the Linode API v4 line.
    - >
      The modern linode-cli repository describes the tool as the official Linode
      command-line interface and says it provides access to Linode API endpoints with
      organized, configurable table output. Its README also states that the project is
      automatically generated from the Linode OpenAPI spec using the openapi3 Python
      package.
  related-projects:
    - >
      Related projects include the deprecated linode/cli tool, the Linode API, the
      linode-api-openapi specification repository, Cloud Manager, and Akamai Cloud
      Computing documentation.
  sources:
    - https://github.com/linode/cli
    - https://github.com/linode/linode-api-openapi
    - https://github.com/linode/linode-cli
    - https://techdocs.akamai.com/cloud-computing/docs/cli
    - https://techdocs.akamai.com/cloud-computing/docs/getting-started-with-the-linode-cli
    - https://www.linode.com/community/questions/9099/linode-cli-developer-release-2
  summary:
    - >
      Linode CLI is the official command-line interface for the Linode API, later
      documented under Akamai Cloud Computing. It lets users manage cloud resources from
      a terminal and is generated from Linode's OpenAPI specification.
  timeline:
    - >
      2013: Linode community posts described early developer releases of a Linode
      command-line tool.
    - '2018-10-31: The older linode/cli repository was archived.'
    - >
      API v4 era: linode/cli pointed users to linode/linode-cli for the newer Linode API
      v4 tool.
    - >
      2026-05-27: The linode-api-openapi repository release panel listed a 2026-05-27
      OpenAPI package release.
  usage:
    - >
      Typical use covers provisioning and managing Linodes, NodeBalancers, volumes,
      object storage, domains, and account resources from scripts or terminals. Because
      credentials and configuration live under ~/.config/linode-cli, the package is a
      developer-operations tool rather than a daemon.
related-packages: []
