config-file-location:
  unix:
    - .editorconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      ktfmt is consumed both as a command-line jar and through integrations: a JetBrains
      IDE plugin, Gradle and Maven examples, Spotless integration, Maven Central
      artifacts, and Homebrew packaging. That puts it in the same culture as gofmt and
      google-java-format, where a formatter's value is partly social: teams agree to
      stop arguing about layout.
  package-nerd-significance:
    - >
      ktfmt matters to package people because it packages style as an executable policy.
      It is a Kotlin example of formatter distribution via Maven Central, IDE plugins,
      build plugins, jars, and Homebrew, with very little configuration surface by
      design.
  project-history:
    - >
      The repository README describes ktfmt as a formatter that reformats Kotlin source
      code and compares its output with ktlint and IntelliJ formatting. Its website
      emphasizes that the same input always receives the same output, regardless of
      initial layout, so developers can avoid style debates.
  related-projects:
    - >
      Related projects include google-java-format, ktlint, IntelliJ IDEA formatting,
      Android Studio, Spotless, Gradle, Maven, and Kotlin coding conventions.
  sources:
    - https://facebook.github.io/ktfmt/
    - https://github.com/facebook/ktfmt
    - https://github.com/facebook/ktfmt/releases
    - https://github.com/facebook/ktfmt/tags
  summary:
    - >
      ktfmt is Meta's Kotlin formatter, built to pretty-print Kotlin code
      deterministically and with minimal style choice. The project describes itself as
      based on google-java-format and intentionally non-customizable to promote
      consistency.
  timeline:
    - '2024-10-30: The v0.53 tag was published in the GitHub tag history.'
    - '2025-06-25: The v0.56 tag was published in the GitHub tag history.'
    - '2026-03-17: The v0.62 tag was published in the GitHub tag history.'
    - '2026-06-24: Release 0.64 was published on GitHub.'
  usage:
    - >
      Users run ktfmt from the command line, through build tooling, through Spotless, or
      through the IntelliJ and Android Studio plugin. The README documents editorconfig
      use for approximating ktfmt behavior in IDE editing and command-line options for
      whole-file or partial formatting.
related-packages:
  - id: brew:ktlint
    reason: >
      Choose ktlint when a project needs configurable Kotlin lint rules, violation
      reporting, custom rulesets, and automatic correction; choose ktfmt when
      deterministic, minimally configurable whole-source formatting is the priority.
    rel: alternative
    sources:
      - https://github.com/Kotlin/ktfmt#ktfmt-vs-ktlint-vs-intellij
      - https://ktlint.github.io/ktlint/latest/
