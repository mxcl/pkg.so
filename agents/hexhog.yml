id: brew:hexhog
display-name: hexhog
repo: null
docs:
  - https://github.com/DVDTSB/hexhog#readme
config-file-location:
  linux:
    - ~/.config/hexhog/config.toml
  macos:
    - ~/Library/Application Support/hexhog/config.toml
  windows:
    - '%APPDATA%\hexhog\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through cargo, AUR, and Homebrew. The batch
      metadata lists Homebrew packaging, and crates.io metadata records a published Rust
      crate.
  package-nerd-significance:
    - >
      The project is package-relevant as a young Rust entrant in the crowded
      hex-viewer/editor niche, with cargo as the natural upstream channel and
      Homebrew/AUR packaging giving it a wider install surface.
  project-history:
    - >
      The GitHub repository metadata places the project in 2025, and the README
      describes an early, focused feature set: opening a file,
      editing/deleting/inserting bytes, selecting and copy/pasting bytes, and a
      non-modal interface.
  related-projects:
    - >
      Related projects include terminal hex tools such as hexyl, hexer, bvi, xxd, and
      graphical editors used for binary inspection.
  sources:
    - GitHub README provides usage, feature, packaging, and configuration notes.
    - Homebrew formula metadata supports the Homebrew package identity.
    - crates.io metadata supports the Rust crate identity.
  summary:
    - >
      hexhog is a Rust command-line hex viewer/editor focused on interactive file
      editing with configurable coloring.
  timeline:
    - >
      2025: GitHub repository metadata and the README copyright line place the project's
      public packaging era in 2025.
    - '2025: crates.io records the hexhog crate.'
    - '2025-2026: README-documented packaging includes cargo, AUR, and Homebrew.'
  usage:
    - >
      hexhog is used as an interactive terminal tool for inspecting and editing bytes in
      a file. Its README frames the workflow as direct file editing rather than as a
      dump converter.
related-packages:
  - id: brew:bvi
    reason: >
      Choose bvi when you want a mature curses-based binary editor built around familiar
      vi commands instead of hexhog's deliberately non-modal interface.
    rel: alternative
    sources:
      - https://github.com/DVDTSB/hexhog#readme
      - https://bvi.sourceforge.net/overview.php
  - id: brew:hexer
    reason: >
      Choose hexer when a vi/ex-like multi-buffer binary editor is preferable to
      hexhog's simpler non-modal editing workflow.
    rel: alternative
    sources:
      - https://github.com/DVDTSB/hexhog#readme
      - https://devel.ringlet.net/editors/hexer/
  - id: brew:hexyl
    reason: >
      Choose hexyl when you only need a colorized terminal hex view and do not need
      hexhog's byte-editing operations.
    rel: alternative
    sources:
      - https://github.com/DVDTSB/hexhog#readme
      - https://github.com/sharkdp/hexyl#readme
tags:
  - binary-files
  - cli
  - hex-editor
  - hex-viewer
