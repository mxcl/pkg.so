history:
  adoption-history:
    - >
      Outline's documentation supports migration and interoperability workflows for
      OneNote users. The vendor distributes the application through both the App Store
      and its own store, with separate license-recovery procedures.
  package-nerd-significance:
    - >
      Its distinctive role is working with OneNote-compatible notebook files on Apple
      platforms while supporting local storage and several synchronization providers.
      That combination makes file-format compatibility and persistent notebook storage
      central to installation and migration workflows.
  project-history:
    - >
      Outline is developed by Gorillized Corporation for Apple devices. The vendor's
      fourth major release introduced a subscription model and a free tier.
  related-projects:
    - 'Microsoft OneNote: compatible notebook format and an interoperability target.'
  sources:
    - >
      [Official license recovery
      guide](https://help.outline.app/article/156-cannot-find-my-outline-license).
    - '[Official product website](https://www.outline.app/).'
    - >
      [Official synchronization
      guide](https://help.outline.app/article/143-syncing-options-in-outline).
  summary:
    - >
      Outline is a notebook application for Mac, iPad, and iPhone with local storage,
      rich content, and OneNote compatibility.
  timeline:
    - >
      Version 4: A subscription model and free tier are introduced; no release date
      established from the reviewed source.
  usage:
    - >
      Organize notes into notebooks and sections, attach documents or images, and choose
      local storage or a supported synchronization provider. Notebook folders are user
      data and should not be mistaken for application configuration.
