history:
  adoption-history:
    - >
      WidgetToggler is distributed through GitHub releases and is packaged for macOS
      through the Homebrew cask recorded in source_facts.package-manager.
  package-nerd-significance:
    - >
      It packages a narrowly focused macOS preference toggle as a menu-bar application,
      illustrating how small desktop utilities can expose operating-system defaults
      through a convenient interface.
  project-history:
    - >
      WidgetToggler was created for macOS Sonoma to provide direct control over the
      visibility of widgets on the desktop and in Stage Manager.
  related-projects:
    - >
      It operates on Apple's WindowManager preferences and occupies the same utility
      niche as other macOS menu-bar and Focus Filter tools.
  sources:
    - 'Official README: https://github.com/sieren/WidgetToggler#readme'
    - source_facts.package-manager
  summary:
    - >
      WidgetToggler is a lightweight open-source macOS menu-bar utility for hiding or
      showing Sonoma widgets.
  timeline:
    - 'macOS Sonoma era: Introduced as a widget-visibility utility requiring macOS 14 or later.'
  usage:
    - >
      Users can toggle desktop and Stage Manager widgets separately, invoke the global
      Command-Control-W shortcut, integrate visibility with Focus Filters, and launch
      the app at login. The README also documents equivalent com.apple.WindowManager
      defaults commands.
