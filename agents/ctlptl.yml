credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation paths include Homebrew on macOS and Linux, Scoop on Windows,
      and go install. The README emphasizes interoperability with common local
      Kubernetes products rather than replacing them.
  package-nerd-significance:
    - >
      ctlptl is packaging glue for the local Kubernetes stack: it wraps existing cluster
      implementations, exposes declarative YAML, and provides package-manager-friendly
      binaries for developers who want reproducible local infrastructure without
      maintaining bespoke shell scripts.
  project-history:
    - >
      The README says ctlptl was inspired by kubectl and Cluster API's clusterctl, with
      the idea that users declare a local cluster in YAML and let the CLI set it up.
      Tilt created it after helping teams debug repeated local-development environment
      misconfigurations.
    - >
      The project reached v0.1.0 in November 2020 and has continued as a 0.x tool, with
      official release artifacts reaching v0.9.4 in June 2026.
  related-projects:
    - >
      ctlptl is explicitly related to kubectl, Cluster API's clusterctl, kind, k3d,
      minikube, Docker Desktop, and Tilt's local-development tooling.
  sources:
    - https://github.com/tilt-dev/ctlptl#readme
    - https://github.com/tilt-dev/ctlptl/tree/main/docs
    - https://api.github.com/repos/tilt-dev/ctlptl/releases?per_page=100
  summary:
    - >
      ctlptl is a Tilt-developed CLI for declaratively creating and managing local
      Kubernetes clusters. It uses Kubernetes-style YAML to drive local cluster products
      such as Docker Desktop, kind, k3d, and minikube.
  timeline:
    - '2020: v0.1.0 release published.'
    - >
      2020: Early releases added declarative local-cluster workflows around kind, k3d,
      minikube, and Docker Desktop.
    - '2026: v0.9.4 release published.'
  usage:
    - >
      Common commands include ctlptl get, create cluster, apply -f cluster.yaml, and
      delete -f cluster.yaml. Typical package use is in developer-workstation setup
      scripts and CI-friendly local-cluster recipes where a registry, CPU limits,
      Kubernetes version, or Docker Desktop setting needs to be repeatable.
related-packages:
  - id: brew:kind
    reason: >
      ctlptl can create and declaratively manage kind clusters, including wiring them to
      a local registry.
    rel: adjacent_workflow
    sources:
      - https://github.com/tilt-dev/ctlptl#readme
      - https://kind.sigs.k8s.io/
  - id: brew:k3d
    reason: >
      ctlptl orchestrates k3d clusters and registries when a lightweight k3s-in-Docker
      environment is preferred.
    rel: adjacent_workflow
    sources:
      - https://github.com/tilt-dev/ctlptl#readme
      - https://k3d.io/
  - id: brew:minikube
    reason: >
      ctlptl can provision minikube declaratively while selecting Kubernetes versions
      and attaching a registry.
    rel: adjacent_workflow
    sources:
      - https://github.com/tilt-dev/ctlptl#readme
      - https://minikube.sigs.k8s.io/docs/
  - id: brew:kubernetes-cli
    reason: >
      ctlptl makes a newly created local cluster the current kubectl context, after
      which kubectl handles workloads and cluster resources.
    rel: adjacent_workflow
    sources:
      - https://github.com/tilt-dev/ctlptl#readme
      - https://kubernetes.io/docs/reference/kubectl/
