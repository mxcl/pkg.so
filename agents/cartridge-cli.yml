id: brew:cartridge-cli
display-name: Cartridge CLI
repo: null
docs:
  - https://www.tarantool.io/en/doc/2.11/book/cartridge/cartridge_cli/commands
  - https://www.tarantool.io/en/doc/2.11/book/cartridge/cartridge_dev
config-file-location:
  unix:
    - ./.cartridge.yml
    - ~/.cartridge.yml
    - ./instances.yml
    - /etc/tarantool/conf.d/instances.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption followed Tarantool Cartridge's application-development story: the
      official developer guide used cartridge-cli for creating projects, developing
      cluster-aware applications, and packaging deployments. Current official docs
      encourage migration to tt for Tarantool 3.0 and newer.
    - >
      Homebrew analytics show light contemporary use, with 63 installs in the last 365
      days in the formula API, consistent with a deprecated tool retained for older
      Cartridge projects.
  package-nerd-significance:
    - >
      For package maintainers, Cartridge CLI is a snapshot of Tarantool's pre-tt
      application tooling: a Go CLI distributed via RPM, DEB, and Homebrew that bridged
      local development, cluster topology files, and Linux service packaging.
  project-history:
    - >
      The public repository was created under the Tarantool organization in 2019. Its
      README now marks the project as deprecated and archived, and directs users to
      Tarantool's newer tt CLI, which supersedes the Cartridge CLI workflows for
      managing Tarantool environments, applications, and clusters.
    - >
      The changelog shows active maintenance through the 2.x series, including template
      dependency updates, packaging behavior changes, and security-driven Go/tooling
      updates. The Homebrew formula currently pins the stable source to tag 2.12.12.
  related-projects:
    - Tarantool Cartridge is the application framework that Cartridge CLI managed.
    - tt is the successor Tarantool CLI recommended by official documentation.
  sources:
    - https://api.github.com/repos/tarantool/cartridge-cli
    - https://github.com/tarantool/cartridge-cli
    - https://tarantool.org/
    - https://www.tarantool.io/en/doc/2.11/book/cartridge/cartridge_cli/commands
    - https://www.tarantool.io/en/doc/2.11/book/cartridge/cartridge_dev
    - https://formulae.brew.sh/api/formula/cartridge-cli.json
  summary:
    - >
      Cartridge CLI was the command-line tool for creating, building, running,
      packaging, and administering Tarantool Cartridge applications. It sits in the
      package-manager niche of database application lifecycle tooling rather than in the
      core database runtime itself.
  timeline:
    - '2019: Public GitHub repository created under tarantool/cartridge-cli.'
    - '2022: Version 2.12.0 changed package naming behavior and moved to Go 1.18.'
    - '2024: Version 2.12.12 released; Homebrew stable points at this tag.'
    - '2026: README marks the project deprecated and archived in favor of tt.'
  usage:
    - >
      Typical use was `cartridge create`, `cartridge build`, `cartridge start`,
      `cartridge status`, `cartridge replicasets`, and `cartridge pack`. Generated
      Cartridge projects include `.cartridge.yml` and `instances.yml`; packaged
      deployments place instance configuration under `/etc/tarantool/conf.d/`.
related-packages:
  - id: brew:tt
    reason: >
      Choose `tt` for supported Tarantool application and cluster management; Tarantool
      identifies it as Cartridge CLI's replacement and provides migration from
      `.cartridge.yml`.
    rel: alternative
    sources:
      - https://www.tarantool.io/en/doc/latest/tooling/tt_cli/
      - https://www.tarantool.io/en/doc/2.11/book/cartridge/cartridge_cli/migration-to-tt/
  - id: brew:tarantool
    reason: >
      Cartridge CLI creates and operates applications that run on Tarantool, which its
      official installation and development guides require as the underlying runtime and
      database.
    rel: adjacent_workflow
    sources:
      - https://github.com/tarantool/cartridge-cli
      - https://www.tarantool.io/en/doc/2.11/book/cartridge/cartridge_dev/
      - https://github.com/tarantool/tarantool
