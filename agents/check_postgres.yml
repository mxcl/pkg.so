id: brew:check_postgres
display-name: check_postgres
repo: https://github.com/bucardo/check_postgres
docs:
  - https://bucardo.org/check_postgres
  - https://bucardo.org/check_postgres/check_postgres.pl.html
config-file-location:
  unix:
    - .check_postgresrc
    - ~/.check_postgresrc
    - /etc/check_postgresrc
credentials-file-location:
  unix:
    - ~/.pgpass
  windows:
    - '%APPDATA%\postgresql\pgpass.conf'
history:
  adoption-history:
    - >
      The README gives both a quick Nagios-script installation path and a standard Perl
      Makefile.PL build path. The batch input records packaging across Homebrew, Alpine,
      Debian, Ubuntu, Fedora, and openSUSE families.
  package-nerd-significance:
    - >
      check_postgres is a classic ops package: a single Perl monitoring tool with many
      symlink-friendly subcommands, Nagios exit codes, packageable docs, and
      long-running compatibility concerns around PostgreSQL client binaries and
      credentials.
  project-history:
    - >
      The script copyright begins in 2007 under Greg Sabino Mullane. Its GitHub
      repository was created in May 2009, and the embedded documentation describes many
      PostgreSQL actions, output modes, rc-file support, and mailing lists for
      announcements and general development.
  related-projects:
    - PostgreSQL and psql are core runtime dependencies for many checks.
    - Nagios, MRTG, and Cacti are documented output or integration targets.
    - Bucardo hosts the official documentation and project pages.
  sources:
    - https://github.com/bucardo/check_postgres
    - https://bucardo.org/check_postgres/check_postgres.pl.html
    - https://raw.githubusercontent.com/bucardo/check_postgres/master/README.md
    - https://raw.githubusercontent.com/bucardo/check_postgres/master/check_postgres.pl
  summary:
    - >
      check_postgres is a Perl monitoring plugin for PostgreSQL, designed primarily for
      Nagios but also documenting MRTG, Cacti, and simple output modes.
  timeline:
    - '2007: Copyright period for check_postgres begins.'
    - '2009: GitHub repository created.'
    - '2009: Version 2.11.0 added .check_postgresrc support.'
    - '2017: 2.23.0 release published.'
    - '2023: 2.26.0 release published.'
    - '2025: README copyright range extends through 2025.'
  usage:
    - >
      Administrators use check_postgres actions to monitor connections, locks, bloat,
      replication, database size, transaction age, settings checksums, pgbouncer state,
      and many other PostgreSQL operational signals.
related-packages:
  - id: brew:nagios
    reason: >
      check_postgres is designed primarily as a Nagios plugin and emits
      Nagios-compatible status text, performance data, and exit codes for PostgreSQL
      service checks.
    rel: adjacent_workflow
    sources:
      - https://bucardo.org/check_postgres/check_postgres.pl.html
      - https://www.nagios.org/projects/nagios-core/
tags:
  - cli
  - database
  - monitoring
  - nagios
  - postgresql
geiger:
  category: tool
  color: blue
  confidence: medium
  reason: broad file, network, media, or database tool signal
  reasons:
    - broad file, network, media, or database tool signal
  signals:
    - text:database
provenance:
  category-sources:
    - >
      Official check_postgres docs describe it as a script for monitoring Postgres
      databases for Nagios, MRTG, Cacti, and standalone scripts.
  display-name-sources:
    - Official Bucardo page and manual use the project name 'check_postgres'.
  docs-sources:
    - >
      Official Bucardo check_postgres page says documentation is available locally via
      man check_postgres and in HTML format.
    - >
      Official check_postgres HTML manual documents version 2.26.0, usage, database
      connection options, files, environment variables, and actions.
  history-sources:
    - https://github.com/bucardo/check_postgres
    - https://bucardo.org/check_postgres/check_postgres.pl.html
    - https://raw.githubusercontent.com/bucardo/check_postgres/master/README.md
    - https://raw.githubusercontent.com/bucardo/check_postgres/master/check_postgres.pl
  repo-sources:
    - >
      Official Bucardo check_postgres page links 'check_postgres on GitHub' and says the
      latest development version can be obtained from GitHub.
  tags-sources:
    - >
      Official check_postgres docs describe Postgres database monitoring, Nagios output,
      and database connection options.
category-confidence: high
category-path:
  - data
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
