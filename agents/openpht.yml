history:
  adoption-history:
    - >
      OpenPHT served users who wanted the traditional Plex Home Theater interface and
      playback model to continue under community maintenance. Desktop releases covered
      major operating systems, while the related OpenPHT-Embedded project ran the client
      on LibreELEC-based media-center hardware.
  package-nerd-significance:
    - >
      OpenPHT is an example of a community preserving an abandoned or superseded desktop
      client through a source fork. Its XBMC ancestry, Plex-specific integration,
      desktop packages, and embedded LibreELEC builds illustrate the layered maintenance
      burden common to home-theater software.
  project-history:
    - >
      OpenPHT was developed by the RasPlex community as a community-driven fork of Plex
      Home Theater. Its source tree identifies itself as the Plex Home Theater branch of
      XBMC, preserving that project's couch-oriented media-center foundations while
      integrating with Plex services.
    - >
      The project produced desktop and embedded releases through the 1.x series. Its
      main repository is now archived, and its final release activity included
      repackaging embedded images after an expired certificate authority prevented
      connections to Plex servers.
  related-projects:
    - >
      Plex Home Theater is OpenPHT's immediate upstream. The codebase also descends from
      XBMC, now known as Kodi. RasPlex and OpenPHT-Embedded applied related client
      technology to appliance-style and Raspberry Pi media centers.
  sources:
    - https://github.com/RasPlex
    - https://github.com/RasPlex/OpenPHT
    - https://github.com/RasPlex/OpenPHT-Embedded
    - https://github.com/RasPlex/OpenPHT/releases
  summary:
    - >
      OpenPHT is an archived, community-maintained fork of Plex Home Theater based on
      the XBMC media-center codebase.
  timeline:
    - '2010s: The RasPlex community maintained OpenPHT as a continuation of Plex Home Theater.'
    - >
      2021: Embedded OpenPHT images were repacked to restore Plex connectivity after a
      certificate-authority expiration.
    - >
      2022: The official organization records the main repository's final update before
      archival.
  usage:
    - >
      OpenPHT is used as a television-oriented client for browsing and playing media
      from Plex servers, with remote-control-friendly navigation and home-theater
      playback features. Because the project is archived, it is primarily relevant to
      legacy installations and software-history preservation.
