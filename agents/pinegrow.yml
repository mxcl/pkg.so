credentials-file-location: null
history:
  adoption-history:
    - >
      Pinegrow evolved from a desktop visual HTML editor into a cross-platform
      professional tool available on macOS, Windows, and Linux. Its scope expanded to
      Bootstrap and Foundation components, WordPress theme generation, Tailwind CSS,
      interactions, online editing, and a self-hosted WordPress plugin while retaining
      standard project files.
  package-nerd-significance:
    - >
      Pinegrow occupies the space between WYSIWYG site builders and code editors: it
      edits ordinary HTML, CSS, and framework projects rather than locking work into a
      proprietary hosted format. That makes it relevant to developers who want visual
      tooling without abandoning source files, Git, or an existing build workflow.
  project-history:
    - >
      The Pinegrow project existed in prototype form by 2011, while the official
      community's anniversary record dates the Pinegrow 1.0 release to January 8, 2014.
      The product has since developed into a family of desktop, online, and
      WordPress-integrated visual development tools.
  related-projects:
    - >
      Pinegrow integrates workflows around HTML, CSS, SASS, LESS, Bootstrap, Foundation,
      Tailwind CSS, GSAP, WordPress, WooCommerce, PHP, and Vue-oriented tooling.
  sources:
    - >
      Official community anniversary discussion:
      https://forum.pinegrow.com/t/happy-new-year-happy-birthday/2574
    - 'Official documentation: https://pinegrow.com/docs/'
    - 'Official product site: https://pinegrow.com/'
    - >
      Official project-settings documentation:
      https://pinegrow.com/docs/wordpress/actions/theme-settings/
    - 'Official projects guide: https://pinegrow.com/docs/pinegrow-pro/projects/'
  summary:
    - >
      Pinegrow Web Editor is a professional visual web-development environment that
      works directly with standard project files and combines page manipulation, code
      editing, CSS tools, framework support, and optional WordPress-oriented generation.
  timeline:
    - '2011: An early Pinegrow project demonstration was published.'
    - '2014: Pinegrow 1.0 was released on January 8.'
    - '2015: Pinegrow added Bootstrap 3 Blocks.'
    - '2021: Pinegrow Web Editor 6 emphasized a redesigned interface and visual design tooling.'
  usage:
    - >
      Developers open an existing folder or create a project, edit HTML structure and
      CSS visually or in code, and use framework-aware controls for Bootstrap or
      Tailwind. Optional editions and add-ons support interactions and exporting
      production-ready WordPress themes or plugins.
