history:
  adoption-history:
    - >
      Gnumeric gained its niche in Unix-like packaging as a lightweight spreadsheet that
      could read and write many office formats without installing a full office suite.
      Its import documentation lists formats associated with Excel, Lotus 1-2-3,
      OpenOffice Calc, StarOffice Calc, Quattro Pro, Xbase and other spreadsheet
      systems.
  package-nerd-significance:
    - >
      For package maintainers and data-tool users, Gnumeric matters because it exposes
      spreadsheet capability as both a desktop application and a scriptable conversion
      tool. It is a practical bridge between GUI office files and command-line data
      pipelines.
  project-history:
    - >
      Miguel de Icaza began Gnumeric in 1998 as a large real-world GNOME application,
      both to provide a free spreadsheet and to exercise GNOME platform libraries. The
      project reached its 1.0 series in 2001 and later became one of the durable
      productivity applications associated with the GNOME desktop.
    - >
      The project evolved around compatibility and numerical correctness. Its
      documentation describes a conventional spreadsheet model of workbooks, worksheets,
      formulas, charts and imported external data, while the project homepage emphasizes
      speed, responsiveness and calculation accuracy.
  related-projects:
    - >
      Gnumeric is part of the GNOME application family and is closely associated with
      GNOME libraries, GOffice and libgsf. It overlaps in user workflows with Microsoft
      Excel, LibreOffice Calc and command-line data conversion tools.
  sources:
    - https://gitlab.gnome.org/GNOME/gnumeric
    - https://gnome.pages.gitlab.gnome.org/gnumeric-web/
    - https://gnome.pages.gitlab.gnome.org/gnumeric/manual/chapter-welcome.html
    - https://gnome.pages.gitlab.gnome.org/gnumeric/manual/sect-dataentryextern.html
    - https://www.kernel.org/doc/ols/2003/ols2003-pages-213-218.pdf
  summary:
    - >
      Gnumeric is the GNOME spreadsheet application, combining a graphical workbook
      interface with command-line utilities such as ssconvert for format conversion and
      data-processing workflows.
  timeline:
    - '1998: Work on Gnumeric began inside the early GNOME application ecosystem.'
    - '2001: Gnumeric reached the 1.0.0 series.'
    - >
      2000s: The project built out spreadsheet-format import and export support for
      common proprietary and free-office formats.
    - >
      2020s: Maintenance continued in the GNOME GitLab project, with release notes
      showing compatibility, accuracy, import/export and test-suite work.
  usage:
    - >
      Practitioners use Gnumeric interactively for spreadsheet editing, charting,
      calculations and analysis tools. Package users also value the non-GUI helpers,
      especially ssconvert, for scripted spreadsheet-to-CSV or
      spreadsheet-to-spreadsheet conversions.
