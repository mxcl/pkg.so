id: brew:mr
display-name: myrepos
repo: https://github.com/RichiH/myrepos
docs:
  - https://myrepos.branchable.com/
  - https://myrepos.branchable.com/README
config-file-location:
  unix:
    - ~/.mrconfig
    - ./.mrconfig
credentials-file-location: null
history:
  project-history:
    - >
      Technically, mr sits above individual VCS tools rather than replacing them. It
      supports Git, Subversion, Mercurial, Bazaar, Darcs, CVS, Fossil, and Veracity, and
      exposes familiar cross-repository commands such as checkout, update, status, diff,
      commit, fetch, push, grep, and arbitrary run commands. The project emphasizes
      being self-contained, with the main mr command depending only on basic Perl, which
      made it easy to keep in ~/bin or a version-controlled home directory.
  sources:
    - https://formulae.brew.sh/formula/mr
    - https://github.com/RichiH/myrepos
    - https://github.com/RichiH/myrepos/blob/master/mr
    - https://myrepos.branchable.com/
  summary:
    - >
      myrepos, installed as the mr command, is Joey Hess's Perl tool for managing many
      version-control repositories as a group. Its README describes the problem it
      solves: developers often have many repositories, need to update or push them
      together, and need repository-specific workflows. mr records repositories in
      ~/.mrconfig, can discover chained .mrconfig files, and runs commands recursively
      over repositories below the working directory.
  usage:
    - >
      Its adoption niche is the long-tail developer and sysadmin workflow of maintaining
      many unrelated repositories without adopting a monorepo or a heavyweight workspace
      manager. The project site documents parallel updates, offline retry of failed
      actions, per-repository command overrides, global custom commands, and combining
      related repositories into a logical repository group. In package managers it
      appears under both mr and myrepos names, alongside developer tools rather than VCS
      implementations themselves.
related-packages:
  - id: brew:gita
    reason: >
      Choose gita for a Git-focused multi-repository workflow; choose myrepos when you
      need multiple VCS types or extensive per-repository command overrides.
    rel: alternative
    sources:
      - https://myrepos.branchable.com/related/
      - https://github.com/nosarthur/gita
  - id: brew:gitbatch
    reason: >
      Choose gitbatch for an interactive terminal interface focused on managing Git
      repositories in one place; choose myrepos for scriptable operations across several
      VCS implementations.
    rel: alternative
    sources:
      - https://myrepos.branchable.com/related/
      - https://github.com/isacikgoz/gitbatch
  - id: brew:mani
    reason: >
      Choose mani when YAML-defined projects, tags, and task orchestration fit your
      workflow; choose myrepos for its lightweight Perl command and native multi-VCS
      support.
    rel: alternative
    sources:
      - https://myrepos.branchable.com/related/
      - https://manicli.com/
