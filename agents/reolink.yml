history:
  adoption-history:
    - >
      Reolink distributes the client free for Windows and macOS as the large-screen
      desktop counterpart to its mobile application. Current documentation says it
      supports Reolink cameras, NVRs, and Home Hubs, while older discontinued devices
      may require an earlier client release.
  package-nerd-significance:
    - >
      The client is vendor-specific rather than a general ONVIF camera viewer: Reolink
      states that its software does not support third-party camera or NVR brands. It is
      therefore chiefly relevant when packaging or administering a Reolink hardware
      deployment.
  project-history:
    - >
      Reolink Client evolved alongside the company's cameras and recorders as its
      desktop management application. Reolink maintains documentation for current and
      previous client generations and distributes the supported macOS and Windows builds
      through its download center.
  related-projects:
    - Reolink App is the vendor's mobile client.
    - >
      Reolink NVRs and Home Hubs provide recording and device-management back ends used
      by the client.
  sources:
    - >
      Official client overview:
      https://support.reolink.com/articles/16976201933593-About-Reolink-Client/
    - >
      Official client-operation documentation:
      https://support.reolink.com/sections/360000756913-Advanced-Network-Settings/
    - >
      Official software overview:
      https://support.reolink.com/articles/360014099374-Introduction-to-Reolink-Software/
  summary:
    - >
      Reolink Client is Reolink's Windows and macOS desktop application for configuring
      its cameras and recorders and viewing live or recorded surveillance video.
  timeline:
    - >
      Previous-client generation: Reolink retained downloads and documentation for
      compatibility with older devices.
    - >
      Current-client generation: The desktop client provides automatic updates,
      unrestricted device addition in supported releases, and consolidated camera, NVR,
      and Home Hub management.
  usage:
    - >
      Users add Reolink devices over the local network or by address or UID, then view
      live feeds, play recordings, adjust detection and alarm behavior, and configure
      device settings.
    - >
      The client does not require a Reolink account login. Device access may still
      require the credentials configured on each camera, NVR, or Home Hub.
