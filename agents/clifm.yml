id: brew:clifm
display-name: CliFM
repo: null
docs:
  - https://github.com/leo-arch/clifm/wiki
  - https://github.com/leo-arch/clifm#readme
config-file-location:
  unix:
    - $CLIFMRC
    - $XDG_CONFIG_HOME/clifm/profiles/PROFILE/clifmrc
    - ~/.config/clifm/profiles/PROFILE/clifmrc
credentials-file-location: null
history:
  adoption-history:
    - >
      CliFM's README links package installation through Linux package channels and
      OpenSUSE Build Service, while the batch input lists apk, dnf, Homebrew, MacPorts,
      and Nix entries. That distribution spread is notable for a file manager whose
      design intentionally avoids the more common curses-style TUI pattern.
  package-nerd-significance:
    - >
      CliFM is interesting to package nerds because it is a terminal file manager that
      rejects the usual ncurses file-pane model. It packages as a small C-oriented Unix
      tool, runs across many Unix-like systems, and exposes optional integration points
      instead of hard depending on a desktop environment.
  project-history:
    - >
      The upstream GitHub repository was created in 2018. By the 1.x series, the project
      had grown from a command-line file browser into a feature-rich terminal file
      manager with profiles, plugins, keybindings, image previews, a directory jumper,
      remote filesystem operations, and many compatibility paths for old or constrained
      terminals.
  related-projects:
    - >
      CliFM's own README compares specific components with tools such as ranger's rifle
      and scope.sh, pistol, autojump, z.lua, and zoxide. In the broader package
      ecosystem it sits near terminal file managers like ranger, nnn, lf, vifm, and
      yazi, but keeps a command-line rather than full-screen TUI identity.
  sources:
    - https://github.com/leo-arch/clifm#readme
    - https://github.com/leo-arch/clifm/wiki
    - https://github.com/leo-arch/clifm/blob/master/CHANGELOG
  summary:
    - >
      CliFM is a shell-like command-line file manager: no GUI, no TUI menus, and a
      workflow centered on typed commands. Its official README emphasizes
      file-management features such as bookmarks, search, selections, previews, bulk
      rename, archive handling, trash, plugins, workspaces, autosuggestions, and
      shell-style command expansion.
  timeline:
    - '2018: leo-arch/clifm GitHub repository created.'
    - >
      2025: The changelog shows active 1.24 through 1.26 feature releases, including
      terminal, image preview, keybinding, and filesystem improvements.
    - >
      2026: The changelog lists 1.27 and 1.28 releases; the batch input lists apk, dnf,
      Homebrew, MacPorts, and Nix packaging.
  usage:
    - >
      Users start clifm in a directory and manage files through short commands, entry
      list numbers, shell commands, tab completion, plugins, filters, previews, and
      profile-specific configuration. The official README says ordinary shell commands
      work, while the built-in help, man page, and wiki expose the richer
      file-management command set.
related-packages:
  - id: brew:ranger
    reason: >
      Choose ranger when you want a mature Vim-style, column-oriented TUI with extensive
      preview and Python customization; choose CliFM when the command line itself should
      remain the primary interface.
    rel: alternative
    sources:
      - https://github.com/leo-arch/clifm/wiki/Introduction
      - https://ranger.fm/documentation.html
  - id: brew:nnn
    reason: >
      Choose nnn for a minimal, keyboard-driven full-screen browser with a plugin
      ecosystem; choose CliFM for shell-like typed commands, profiles, and
      entry-list-number workflows.
    rel: alternative
    sources:
      - https://github.com/leo-arch/clifm#readme
      - https://github.com/jarun/nnn#readme
      - https://github.com/jarun/nnn/wiki
  - id: brew:yazi
    reason: >
      Choose Yazi when asynchronous I/O, rich previews, and a modern full-screen
      terminal UI are priorities; choose CliFM for an interface that stays
      command-line-oriented and works in constrained terminals.
    rel: alternative
    sources:
      - https://github.com/leo-arch/clifm/wiki/Introduction
      - https://yazi-rs.github.io/docs/quick-start
      - https://yazi-rs.github.io/docs/image-preview
