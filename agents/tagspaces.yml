id: cask:tagspaces
display-name: TagSpaces
repo: null
docs:
  - https://docs.tagspaces.org/
  - https://docs.tagspaces.org/installation
config-file-location:
  linux:
    - ~/.config/TagSpaces
  macos:
    - ~/Library/Application Support/TagSpaces
  windows:
    - C:\Users\<username>\AppData\Roaming\TagSpaces
credentials-file-location: null
history:
  adoption-history:
    - >
      TagSpaces grew as a cross-platform, offline-first alternative to cloud-bound
      document organizers. Its desktop application supports Windows, macOS, and Linux,
      while browser extensions and mobile and web variants extend the same local-file
      approach.
    - >
      The project combines an AGPL-licensed core with separately licensed Pro
      functionality. It is distributed through release packages and package managers,
      including the Homebrew cask `tagspaces`.
  package-nerd-significance:
    - >
      TagSpaces is notable for avoiding a proprietary central database: tags can be
      encoded in filenames or stored in sidecar files, and notes remain ordinary
      Markdown, text, or HTML files. That design makes collections portable,
      sync-provider-neutral, and less susceptible to application lock-in.
    - >
      Its profile and portable modes are also useful to package-oriented users because
      application configuration is clearly separated from managed documents and can be
      preserved across upgrades or carried alongside a portable installation.
  project-history:
    - >
      Ilian Sapundshiev initiated TagSpaces in Munich in 2012. The project was built
      around local-first file organization, standard file formats, and operation without
      mandatory cloud accounts.
    - >
      The platform subsequently expanded from desktop file tagging into note editing,
      searching, media viewing, web clipping, mobile builds, S3-compatible locations,
      and optional commercial Pro perspectives and features.
  related-projects:
    - Electron and React underpin the desktop application.
    - The Web Clipper captures web pages or screenshots as local files.
    - >
      Dropbox, Google Drive, Nextcloud, Syncthing, and other synchronization tools can
      synchronize TagSpaces-managed folders without becoming TagSpaces' storage backend.
  sources:
    - Input source_facts.package-manager.brew-cask.
    - https://docs.tagspaces.org/
    - https://docs.tagspaces.org/installation/
    - https://github.com/tagspaces/tagspaces
    - https://www.tagspaces.org/about/
  summary:
    - >
      TagSpaces is an offline-first, cross-platform file and document organizer that
      adds tagging, search, notes, and previews directly to ordinary local folders.
  timeline:
    - '2012: Ilian Sapundshiev initiated the project in Munich.'
    - >
      Later releases: TagSpaces expanded across Windows, macOS, Linux, mobile, web, and
      browser-extension surfaces.
    - >
      2026: Official documentation formalized platform profile paths and portable-mode
      behavior.
  usage:
    - >
      Users connect a local folder, removable drive, synchronized folder, or supported
      object-storage location, then browse, search, tag, preview, and edit its files.
      Tags may be placed in filenames or JSON sidecars, while notes are saved as regular
      files.
    - >
      The profile directory stores the tag library, location definitions, and
      application settings. Portable mode instead uses a `tsprofile` directory beside
      the application.
