history:
  adoption-history:
    - >
      Paste expanded from a Mac-only utility to iOS in 2018, making clipboard history
      and pinboards available across Apple devices through iCloud. Later releases added
      Siri and Shortcuts integrations, editing, improved search, Paste Keyboard, and
      shared pinboards.
    - >
      Paste’s official retrospective frames the product’s adoption around writers,
      developers, designers, and other users who repeatedly reuse snippets, links,
      images, and reference material. Its evolution tracks a shift from a single-user
      Mac utility toward a synchronized and collaborative productivity tool.
  package-nerd-significance:
    - >
      Clipboard managers are a classic power-user package category because they replace
      the operating system’s single-item clipboard with searchable history and reusable
      collections. Paste is a polished Apple-platform example with a background Mac
      process, system shortcut, local storage, and optional private iCloud
      synchronization.
    - >
      The Homebrew cask gives Mac setup scripts a straightforward installation path.
      Package-conscious users should note that Paste deliberately ignores recognized
      confidential clipboard content, can exclude selected applications, and stores
      captured data on the device or in the user’s own iCloud rather than on Paste’s
      servers.
  project-history:
    - >
      Paste began in 2015 as a full-screen Mac clipboard manager with visual previews,
      basic search, and unformatted pasting. In 2016 it adopted the bottom-panel
      interface and pinboards that became central to its daily workflow.
    - >
      An iOS edition arrived in 2018. From 2018 through 2022, the project added
      cross-device synchronization, new search and editing features, Apple silicon
      improvements, Shortcuts support, and the Paste Keyboard. Paste 4 unified the Mac
      and iOS experience in 2023, with collaborative shared pinboards following later.
  related-projects:
    - >
      Apple’s system clipboard supplies the underlying copy-and-paste mechanism that
      Paste extends.
    - >
      iCloud and CloudKit provide private cross-device synchronization and
      shared-pinboard infrastructure.
    - >
      Paste Keyboard and Paste MCP extend saved clipboard material into iOS typing and
      AI-tool workflows.
  sources:
    - https://pasteapp.io/blog/meet-paste-for-ios
    - https://pasteapp.io/blog/paste-evolution-through-the-years
    - https://pasteapp.io/help
    - https://pasteapp.io/help/explore-paste
    - https://pasteapp.io/help/paste-on-mac
    - https://pasteapp.io/help/where-paste-stores-your-data
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Paste is a proprietary clipboard-history manager for macOS, iPhone, and iPad. It
      saves copied material into a searchable visual history, organizes reusable items
      in pinboards, and optionally synchronizes them through the user’s private iCloud
      account.
  timeline:
    - '2015: Paste began as a full-screen Mac clipboard manager.'
    - '2016: The bottom-panel interface and pinboards were introduced.'
    - '2018: Paste for iOS launched.'
    - '2022: Paste Keyboard brought clipboard history into the iOS keyboard.'
    - '2023: Paste 4 unified the experience across Mac and iOS.'
    - '2025: Shared Pinboards added collaborative clipboard collections.'
    - '2026: Paste MCP exposed clipboard context to supported AI tools.'
  usage:
    - >
      On macOS, Paste runs in the background and records supported text, links, images,
      files, and colors copied by the user. Shift-Command-V opens the visual history,
      where items can be searched, organized into pinboards, or inserted into another
      application.
    - >
      On iPhone and iPad, users access history through the app, share extensions, or
      Paste Keyboard; iOS background restrictions mean capture differs from macOS.
      Optional iCloud sync keeps history and pinboards available across devices.
