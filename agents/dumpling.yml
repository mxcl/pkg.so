history:
  adoption-history:
    - >
      Dumpling adoption follows TiDB adoption. It is installed with TiUP, included in
      TiDB Toolkit, documented in TiDB Cloud and TiDB self-managed workflows, and paired
      with TiDB Lightning for imports. Homebrew packaging makes the tool available
      outside TiUP for macOS and general Unix package users.
  package-nerd-significance:
    - >
      Dumpling matters because it is not just another mysqldump clone: it is the TiDB
      ecosystem's logical export replacement for a TiDB-enhanced mydumper fork. Its
      packaging captures database-operational assumptions such as TiUP distribution,
      cloud storage URIs, GC safe-point coordination, and Lightning-compatible output
      layout.
  project-history:
    - >
      Dumpling lives in the PingCAP TiDB ecosystem rather than as a standalone
      historical project. Official docs introduce it as the data export tool for
      TiDB/MySQL, with support for SQL and CSV output, logical full backup or export,
      and Amazon S3 output.
    - >
      PingCAP's documentation records an important lineage change: PingCAP previously
      maintained a TiDB-specific fork of mydumper, but starting with TiDB v7.5.0 that
      Mydumper path is deprecated and most features are replaced by Dumpling. The docs
      strongly recommend Dumpling instead.
  related-projects:
    - >
      Related projects include TiDB, TiUP, TiDB Toolkit, TiDB Lightning, BR, TiCDC,
      mydumper, MySQL, and external-storage backends such as Amazon S3.
  sources:
    - https://docs.pingcap.com/tidb/stable/dumpling-overview
    - https://github.com/pingcap/docs/blob/master/dumpling-overview.md
    - https://github.com/pingcap/docs/blob/master/tidb-lightning/tidb-lightning-overview.md
    - https://github.com/pingcap/tidb#readme
    - https://api.github.com/repos/pingcap/tidb
    - https://formulae.brew.sh/formula/dumpling
  summary:
    - >
      Dumpling is PingCAP's logical export tool for dumping TiDB or MySQL-compatible
      data as SQL or CSV files, commonly as part of TiDB backup, migration, and
      data-loading workflows.
  timeline:
    - '2015: The pingcap/tidb repository is created.'
    - '2020: Dumpling docs note Amazon S3 export support starting from TiDB v4.0.8.'
    - 'TiDB v7.5.0: PingCAP deprecates its Mydumper path and recommends Dumpling instead.'
    - '2026: Homebrew packages Dumpling stable 26.3.4 from the TiDB repository.'
  usage:
    - >
      Users run Dumpling against a live TiDB or MySQL-compatible source to export full
      data sets, filtered subsets, SQL files, CSV files, metadata, schema files, and
      cloud-storage outputs. The docs emphasize consistency options, GC safe-point
      handling for TiDB, table filtering, parallel export, file sizing, compression, and
      downstream import with TiDB Lightning.
related-packages:
  - id: brew:mydumper
    reason: >
      Choose MyDumper for a community MySQL-family parallel dump-and-restore workflow
      that includes MyLoader; for TiDB-specific exports, PingCAP explicitly recommends
      Dumpling instead of its deprecated Mydumper fork.
    rel: alternative
    sources:
      - https://docs.pingcap.com/tidb/stable/dumpling-overview
      - https://mydumper.github.io/mydumper/docs/html/
  - id: brew:mysql-client
    reason: >
      Choose the mysql-client package when the standard mysqldump utility and broad
      MySQL compatibility are sufficient; choose Dumpling for parallel, TiDB-aware
      exports and TiDB Lightning workflows.
    rel: alternative
    sources:
      - https://docs.pingcap.com/tidb/stable/dumpling-overview
      - https://dev.mysql.com/doc/refman/en/mysqldump.html
