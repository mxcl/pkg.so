history:
  adoption-history:
    - >
      The LAME project describes itself as source-code-only software aimed at users who
      can compile C, while also noting that many ripping and encoding programs include
      the LAME encoding engine. Package managers made that source-first upstream usable
      for ordinary users by supplying the lame CLI and library builds across Unix,
      Windows-oriented, and cross-platform ecosystems.
  package-nerd-significance:
    - >
      LAME is package-nerd famous because MP3 historically sat at the intersection of
      patents, codec quality, source distribution, and optional multimedia features. For
      years, having or not having LAME support was a visible signal of how a
      distribution handled audio codecs, licensing risk, and user convenience.
  project-history:
    - >
      The official LAME homepage says development started around mid-1998 when Mike
      Cheng began with patches against the 8hz-MP3 encoder sources, then restarted from
      the dist10 MPEG reference sources after quality concerns. That branch became LAME
      2.0, and by LAME 3.81 the remaining dist10 code had been replaced.
    - >
      The official about page explains the recursive name and the early limitation: LAME
      started life as a GPL patch against the dist10 ISO demonstration source and was
      not initially a standalone MP3 encoder. In May 2000 the last ISO-source remnants
      were replaced, making LAME a fully LGPL MP3 encoder. Mark Taylor's leadership and
      gpsycho psychoacoustic model helped turn it from a speed-focused patch line into a
      quality-focused encoder.
  related-projects:
    - >
      Related projects and technologies include the 8hz-MP3 encoder sources, the dist10
      ISO demonstration source, tooLAME for MP2 encoding, MPEG Layer III, and audio
      ripping or encoding front ends that embed the LAME engine.
  sources:
    - https://lame.sourceforge.io/
    - https://lame.sourceforge.io/about.php
    - https://sourceforge.net/p/lame/svn/HEAD/tree
    - https://sourceforge.net/projects/lame/
  summary:
    - >
      LAME is one of the defining open-source MP3 encoders. It began as a patch and
      research vehicle around MPEG Layer III encoding, then became a standalone LGPL
      encoder known for psychoacoustic improvements, source-code distribution, and deep
      integration into audio conversion workflows.
  timeline:
    - '1998: Mike Cheng began LAME development as patches against earlier MP3 encoder sources.'
    - '1998: The dist10-based branch became LAME 2.0.'
    - '2000-05: LAME replaced the last ISO source remnants and became a fully LGPL MP3 encoder.'
    - '2001: By LAME 3.81, all dist10 code had been replaced.'
    - '2017-10: LAME v3.100 was released.'
  usage:
    - >
      The package is most visible as the lame command-line encoder, used to encode
      PCM/WAV audio to MP3 with constant, average, or variable bitrate modes. It is also
      built as a shared library, DLL, DirectShow filter, or ACM codec in downstream
      environments.
related-packages:
