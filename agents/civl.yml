id: brew:civl
display-name: CIVL
repo: https://vsl.cis.udel.edu/trac/civl/browser
docs:
  - https://vsl.cis.udel.edu/lib/sw/civl/civl-manual.pdf
  - https://vsl.cis.udel.edu/trac/civl/wiki
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The batch input shows CIVL as a Homebrew-only package among the package managers
      captured for this run. That matches a niche academic verification tool: important
      to a small formal-methods audience, but not broadly distributed like
      general-purpose compilers.
  package-nerd-significance:
    - >
      CIVL is package-nerd interesting because it is an academic formal-verification
      tool distributed through Homebrew, not because it is a mass-market CLI. It is the
      sort of package that tests whether a package manager can carry research software
      with Java/toolchain assumptions and infrequent but versioned upstream releases.
  project-history:
    - >
      The official CIVL homepage redirects to the VSL Trac wiki, and the official
      software directory publishes versioned CIVL releases. That directory shows a 0.x
      release series, a 1.x series, and later 2.0 builds, with the manual PDF dated
      2021.
  related-projects:
    - CIVL belongs to the University of Delaware VSL formal-methods tool family.
    - >
      It is related by domain to model checking, symbolic execution, and concurrency
      verification tools rather than to general programming-language runtimes.
  sources:
    - https://vsl.cis.udel.edu/civl/
    - https://vsl.cis.udel.edu/lib/sw/civl/
    - https://vsl.cis.udel.edu/lib/sw/civl/civl-manual.pdf
    - https://formulae.brew.sh/api/formula/civl.json
  summary:
    - >
      CIVL is the Concurrency Intermediate Verification Language from the University of
      Delaware Verified Software Laboratory, packaged as a command-line verification
      tool for concurrent programs.
  timeline:
    - '2015: Official VSL directory lists early archived releases from 0.1 through 1.0.'
    - '2016: Official VSL directory lists the 1.6 and 1.7 release line.'
    - '2021: Official CIVL manual PDF was generated.'
    - '2026: Official VSL directory lists CIVL 2.0 builds and a main directory.'
  usage:
    - >
      CIVL is used from the `civl` executable to model, analyze, and verify concurrent
      programs against CIVL's intermediate verification language and runtime model. Its
      official manual is the primary user documentation.
related-packages:
  - id: brew:cbmc
    reason: >
      Choose CBMC for bounded checking of general C and C++ programs; choose CIVL when
      MPI, OpenMP, CUDA, or CIVL-C concurrency modeling is central to the analysis.
    rel: alternative
    sources:
      - https://verified-software-lab.github.io/civl/
      - https://www.cprover.org/cbmc/
  - id: brew:spin
    reason: >
      Choose Spin when the system is modeled explicitly in Promela; choose CIVL when
      verification should begin from supported C code or parallel-programming APIs.
    rel: alternative
    sources:
      - https://verified-software-lab.github.io/civl/
      - https://spinroot.com/spin/whatispin.html
