history:
  adoption-history:
    - >
      RoboFont's extensibility encouraged a community of type designers and developers
      to build specialized tools around its scripting APIs. Mechanic, released in 2015,
      became the principal extension manager and helped establish an ecosystem of
      open-source and commercial extensions.
  package-nerd-significance:
    - >
      RoboFont is notable as a commercial macOS application assembled around open-source
      Python font-engineering components while exposing a public scripting environment
      of its own. Its movement from Python 2, UFO 2, and RoboFab to Python 3, UFO 3, and
      FontParts reflects a major toolchain transition in digital type design.
    - >
      For package users, RoboFont is both an application and a platform: the core is
      installed as a macOS app, while scripts and extensions provide specialized
      functionality. Compatibility among the application, embedded Python runtime, UFO
      format, and extensions is therefore operationally important.
  project-history:
    - >
      Development began around 2010 to create a native UFO-based font editor in Python.
      RoboFont was built around open-source libraries including defcon, vanilla, and
      defconAppKit, with an API initially modeled on RoboFab.
    - >
      After roughly 18 months of development, RoboFont 1.0 was publicly released in
      September 2011 at the ATypI conference in Reykjavík. RoboFont 2 remained an
      unreleased transitional effort; RoboFont 3 completed the move to Python 3, UFO 3,
      and FontParts, and later releases continued the extensible-core design.
  related-projects:
    - Unified Font Object (UFO) is RoboFont's native source format.
    - >
      defcon, vanilla, defconAppKit, RoboFab, and FontParts are important parts of its
      technical lineage.
    - Mechanic manages RoboFont extensions.
  sources:
    - 'Official extensions documentation: https://robofont.com/documentation/topics/extensions/'
    - 'Official history: https://robofont.com/documentation/topics/robofont-history/'
    - 'Official product overview: https://robofont.com/'
    - 'Official release notes: https://robofont.com/version-history/'
  summary:
    - >
      RoboFont is a scriptable, extensible font editor for macOS. It is designed for
      drawing and producing typefaces, uses UFO as its native font format, and exposes
      its objects and interface to Python scripts and extensions.
  timeline:
    - '2010: Development of a new Python-based UFO font editor began.'
    - '2011-09-03: RoboFont 1.0 became the first publicly orderable release.'
    - '2015: Mechanic was released and became a central extension-distribution tool.'
    - '2017: The RoboFont 3 generation moved the application to Python 3, UFO 3, and FontParts.'
    - '2020: RoboFont 4 introduced a further generation of drawing and extension APIs.'
  usage:
    - >
      Type designers use RoboFont to draw and edit glyph outlines, manage font data,
      work with spacing and OpenType features, and generate font binaries.
    - >
      Developers automate font-production work through RoboFont's Python API and add
      focused tools through scripts and installable extensions. Preferences can be
      exported to a user-selected `.roboFontSettings` file, but the official
      documentation does not identify a fixed configuration-file path.
