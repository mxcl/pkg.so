config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README names xine, VideoLAN, MPlayer, FFmpeg, drip, and GStreamer as projects
      that used liba52, which explains why distributions kept shipping a small
      standalone a52dec package long after upstream development slowed.
  package-nerd-significance:
    - >
      a52dec is interesting to package maintainers because it is a classic codec-library
      package with a tiny CLI, old CVS-era history, GPL licensing, dormant upstream
      years, and a later distribution-led maintenance handoff.
  project-history:
    - >
      The project started publicly as ac3dec in 1999 and evolved into a52dec/liba52 in
      2001. The official ChangeLog records the first public ac3dec release in June 1999,
      the 0.7.0 liba52-era release in August 2001, and the 0.7.4 release in July 2002.
    - >
      The project then had a very long quiet period after the 2004 0.7.5 development
      snapshot. In 2022, Adelie Linux imported the historically available SourceForge
      code into Git, declared the Adelie GitLab URL canonical for source control and
      issue tracking, and took over maintenance while trying to minimize churn.
  related-projects:
    - >
      Related users and peers include xine, VideoLAN/VLC, MPlayer, FFmpeg, GStreamer,
      and other media playback or transcoding projects that needed AC-3/A52 decoding.
  sources:
    - https://git.adelielinux.org/community/a52dec/-/raw/current/ChangeLog
    - https://git.adelielinux.org/community/a52dec/-/raw/current/README
    - https://git.adelielinux.org/community/a52dec/-/raw/current/configure.ac
  summary:
    - >
      a52dec is the command-line test decoder and distribution package for liba52, a C
      library for decoding ATSC A/52 audio streams, also known as AC-3.
  timeline:
    - '1999: First public ac3dec release.'
    - '2001: a52dec/liba52 0.7.0 release introduces a new library interface and major speedups.'
    - '2002: a52dec 0.7.4 release marks liba52 as fully reentrant.'
    - '2004: a52dec 0.7.5 development snapshot adds fixed-point support and other improvements.'
    - >
      2022: a52dec 0.8.0 imports historical SourceForge code into Git and updates the
      maintenance situation.
  usage:
    - >
      The a52dec program decodes ATSC A/52 files and can demultiplex MPEG-1 and MPEG-2
      program streams. Typical use is running a52dec against an AC-3/A52 file, with
      options for multiplexed streams, output layer selection, optimization control, and
      dynamic range compression.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Choose FFmpeg when you need AC-3 decoding inside a broad conversion, filtering,
      probing, or remuxing toolkit; choose a52dec for a small dedicated decoder and
      liba52 implementation.
    rel: alternative
    sources:
      - https://ffmpeg.org/ffmpeg-codecs.html
      - https://git.adelielinux.org/community/a52dec/-/raw/current/README
  - id: brew:aften
    reason: >
      Use Aften to encode PCM audio into ATSC A/52 streams and a52dec to decode or test
      those AC-3 streams in a complementary round-trip workflow.
    rel: adjacent_workflow
    sources:
      - https://aften.sourceforge.net/
      - https://git.adelielinux.org/community/a52dec/-/raw/current/README
