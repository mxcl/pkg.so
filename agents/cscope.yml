id: brew:cscope
display-name: cscope
repo: https://sourceforge.net/p/cscope/cscope/ci/master/tree
docs:
  - https://cscope.sourceforge.net/
  - https://cscope.sourceforge.net/cscope_man_page.html
config-file-location:
  unix:
    - ./cscope.files
credentials-file-location: null
history:
  adoption-history:
    - >
      The cscope homepage says it was part of the official AT&T Unix distribution for
      many years. The history page says it spread through AT&T and Bell Labs by the
      exptools network, was used at AT&T locations around the world, and supported
      projects with millions of lines of C and C++.
  package-nerd-significance:
    - >
      cscope is a small but culturally durable Unix developer tool: curses UI, on-disk
      indexes, editor integration, and broad packaging across Homebrew, Linux
      distributions, MacPorts, Nix, Scoop, and others. It is the kind of tool whose
      package value is stable because it serves old and large codebases without needing
      a language server.
  project-history:
    - >
      The official cscope history page attributes the original work to Joe Steffen at
      Bell Labs in the early 1980s. It describes the first version as growing from shell
      scripts using grep and sed into a C program that parsed source into a tagged,
      updateable database for repeated searches.
  related-projects:
    - >
      The homepage documents integration with Vim and nvi, and the man page documents
      command-line and line-oriented modes that allow wrappers and frontends.
  sources:
    - https://cscope.sourceforge.net/
    - https://cscope.sourceforge.net/history.html
    - https://cscope.sourceforge.net/cscope_man_page.html
    - https://formulae.brew.sh/formula/cscope
  summary:
    - >
      cscope is a classic Unix source-code browser and cross-reference tool for C-family
      code. Its history is unusually important for package nerds because it moved from
      Bell Labs internal tooling into official AT&T Unix and then into open-source Unix
      distributions.
  timeline:
    - 'Early 1980s: Joe Steffen started cscope at Bell Labs.'
    - 'AT&T Unix era: cscope became part of the official AT&T Unix distribution.'
    - '2000: SCO open sourced the Cscope code under the BSD license.'
    - '2012: The official homepage announced cscope 15.8a.'
    - '2026: Homebrew formula metadata lists stable version 15.9.'
  usage:
    - >
      The man page describes cscope as an interactive, screen-oriented tool that builds
      a cscope.out cross-reference database and searches definitions, callers, callees,
      strings, regular expressions, files, and includes. It can also use cscope.files as
      the default namefile and offers a line-oriented mode for scripts and editor
      frontends.
related-packages:
  - id: brew:universal-ctags
    reason: >
      Use Universal Ctags alongside Cscope when you want ordinary tag jumps plus
      Cscope's call and reference queries; Vim officially supports searching both
      databases through `:cstag`.
    rel: adjacent_workflow
    sources:
      - https://vimhelp.org/if_cscop.txt.html
      - https://docs.ctags.io/
  - id: brew:global
    reason: >
      Choose GNU GLOBAL when you want an editor-independent tagging system with
      definition and reference databases, broader parser options, hypertext generation,
      and a Cscope-compatible interface.
    rel: alternative
    sources:
      - https://www.gnu.org/software/global/
      - https://cscope.sourceforge.net/
tags:
  - c
  - cli
  - code-browser
  - code-search
  - cross-reference
  - curses
