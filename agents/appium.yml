history:
  adoption-history:
    - >
      Appium became a standard fixture in mobile QA stacks because tests can be written
      in WebDriver-compatible client libraries rather than platform-native test
      languages only. The README lists official client support for Java, Python, Ruby,
      and .NET C#, with third-party clients for other languages.
    - >
      The project's adoption model changed significantly with Appium 2: drivers and
      plugins became extensions installed and updated through the Appium CLI rather than
      everything being bundled into one server package. That made the Homebrew formula
      useful as an entry point to the server while real platform support moved into
      extension management.
  package-nerd-significance:
    - >
      Appium is a good example of a CLI package whose real payload is an extension
      ecosystem. The formula installs the command, but the working toolchain is
      assembled from npm-distributed drivers and plugins plus language-specific test
      clients.
    - >
      For packagers, Appium also marks the tension between system package managers and
      upstream Node distribution: the README says npm is the supported installation
      method, while Homebrew packages it for developers who expect a global `appium`
      command alongside other testing tools.
  project-history:
    - >
      The Appium project grew from the idea that mobile app automation should use the
      same open WebDriver protocol that had become central to browser automation. The
      official docs state that Appium's initial goals were iOS and Android automation,
      and that Appium adopted WebDriver rather than inventing a new API.
    - >
      The npm package history records Appium 1.0.0 in May 2014. Appium 2.0.0 was
      published in July 2023 after a long beta series, and the upstream changelog
      records Appium 3.0.0 in August 2025.
  related-projects:
    - Selenium and WebDriver are the protocol lineage Appium deliberately follows.
    - >
      Appium Inspector is the related official GUI used to inspect app UI trees while
      developing tests.
    - >
      Official and third-party Appium drivers provide platform-specific automation for
      iOS, Android, macOS, Windows, and other targets.
  sources:
    - https://appium.io/docs/en/latest/guides/config/
    - https://appium.io/docs/en/latest/intro/appium/
    - https://github.com/appium/appium#readme
    - https://github.com/appium/appium/blob/master/packages/appium/CHANGELOG.md
    - https://registry.npmjs.org/appium
  summary:
    - >
      Appium is an open-source WebDriver-based automation framework for native, hybrid,
      mobile web, desktop, and other app platforms. Its package-manager identity is a
      Node.js CLI server plus an ecosystem of separately installed drivers, clients, and
      plugins.
  timeline:
    - '2014: npm registry records Appium 1.0.0 publication.'
    - '2021: Appium 2.0.0 beta series appears in the upstream changelog.'
    - '2023: npm registry records Appium 2.0.0 publication.'
    - '2025: Upstream changelog records Appium 3.0.0.'
  usage:
    - >
      A typical install starts the Appium server with `appium` or `appium server`, then
      installs a platform driver such as an iOS, Android, macOS, or Windows driver with
      `appium driver install`. Test suites connect over WebDriver using a language
      client.
    - >
      Configuration can be auto-discovered from `.appiumrc.*`, `appium.config.*`,
      `.appiumrc`, or an `appium` property in `package.json`; Appium searches upward
      from the current working directory and also supports `appium --config
      /path/to/config/file`.
