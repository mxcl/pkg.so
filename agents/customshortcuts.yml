history:
  adoption-history:
    - >
      CustomShortcuts remains a focused free utility rather than a broad automation
      suite. Houdah Software’s current distribution supports modern macOS releases and
      integrates with the KeyClu shortcut viewer.
  package-nerd-significance:
    - >
      The utility exposes a useful macOS preference mechanism through a purpose-built
      interface. It is attractive to package-manager users who want repeatable
      installation of a small native tool instead of manually navigating System Settings
      for each shortcut.
  project-history:
    - >
      Houdah Software released CustomShortcuts 1.0 in June 2020 as a free tool for
      assigning user-defined shortcuts to macOS application menu commands. Later
      releases added conveniences such as copying shortcuts between applications,
      menu-name completion, and conflict validation.
  related-projects:
    - >
      Houdah Software documents integration with KeyClu, which displays the active
      application’s available keyboard shortcuts.
  sources:
    - >
      https://blog.houdah.com/2020/06/25/customshortcuts-1-0-free-tool-to-customize-menu-shortcuts/
    - https://www.houdah.com/customShortcuts
    - https://www.houdah.com/customShortcuts/download.html
  summary:
    - >
      CustomShortcuts is a free macOS utility from Houdah Software for adding or
      changing keyboard shortcuts assigned to application menu commands.
  timeline:
    - >
      2020: Houdah Software released CustomShortcuts 1.0 as a free menu-shortcut
      customization tool.
    - >
      2020s: Subsequent versions added cross-application copying, auto-completion, and
      validation features.
  usage:
    - >
      Users select an application and menu command, then assign a shortcut. The utility
      helps identify exact menu hierarchy names and warns about ambiguous commands or
      conflicts. Houdah Software states that assigned shortcuts are written to the
      preferences of each target application rather than a single shared CustomShortcuts
      preferences file.
