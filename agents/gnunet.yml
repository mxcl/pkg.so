id: brew:gnunet
display-name: GNUnet
repo: https://git.gnunet.org/gnunet.git
docs:
  - https://docs.gnunet.org/doxygen
  - https://docs.gnunet.org/master/index.html
config-file-location:
  unix:
    - ~/.config/gnunet.conf
    - $XDG_CONFIG_HOME/gnunet.conf
    - /etc/gnunet.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      GNUnet's adoption has been strongest in free-software, privacy, peer-to-peer
      networking and academic research circles. Its own history notes that most
      contributions came from volunteers or people funded to do fundamental research,
      and that it remained an experimental system with known design and implementation
      limits.
  package-nerd-significance:
    - >
      For package users, GNUnet is interesting because the formula installs a dense
      toolkit of subsystem commands rather than a single daemon. It is the kind of
      package used to experiment with alternative network protocols, service
      supervision, DHT behavior, decentralized naming and privacy-preserving application
      plumbing.
  project-history:
    - >
      The GNUnet documentation traces the project to 2001, when ideas for changing
      Freenet's file-sharing design proved too large for that project. The first release
      used the name GNet while the maintainers sought GNU approval; after adopting GNU
      governance, it became an official GNU package.
    - >
      The system broadened from anonymous file sharing into a modular network stack.
      Early work produced GNU libextractor, then pluggable transports in 2003,
      peer-to-peer chat in 2005, GNU libmicrohttpd support for HTTP transport in 2007,
      and a multi-process architecture in 2009.
    - >
      Research work from 2009 to 2014 produced major GNUnet subsystems including R5N
      DHT, CADET, ATS and the GNU Name System. Later projects such as secushare, GNU
      Taler, pEp metadata protection and Taler Systems helped keep GNUnet tied to
      privacy-preserving application research.
  related-projects:
    - >
      GNUnet is related to Freenet by origin, to GNU libextractor and GNU libmicrohttpd
      by project history, and to GNU Taler, secushare and pEp through later application
      work.
  sources:
    - https://docs.gnunet.org/master/users/configuration.html
    - https://docs.gnunet.org/master/users/subsystems.html
    - https://docs.gnunet.org/v0.20.x/about.html
    - https://gnunet.org/
  summary:
    - >
      GNUnet is GNU's framework for decentralized, secure and privacy-preserving
      networking, built as a collection of services and command-line tools rather than a
      single end-user program.
  timeline:
    - "2001: Project started from ideas that exceeded Freenet's file-sharing scope."
    - '2001: The first release used the name GNet before GNUnet joined GNU governance.'
    - '2003: Pluggable transports appeared, starting with TCP, UDP and SMTP.'
    - '2005: The project began moving beyond file sharing with a simple P2P chat.'
    - '2009: GNUnet was modularized into a multi-process architecture.'
    - '2010: secushare selected GNUnet as its networking basis.'
    - '2013: GNU Taler was launched from the GNUnet community.'
    - '2015: pEp announced GNUnet use for a metadata-protection layer.'
    - '2016: Taler Systems SA was founded using GNUnet technology.'
  usage:
    - >
      Practitioners use GNUnet by running a peer with gnunet-arm, configuring services
      in gnunet.conf and enabling selected subsystems such as file sharing, DHT
      operations, GNS naming, VPN support, messaging or testbed tooling. Advanced
      deployments separate per-user and system services and may run a dedicated gnunet
      account.
