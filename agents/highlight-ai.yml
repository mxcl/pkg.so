history:
  adoption-history:
    - >
      Highlight is distributed as a desktop application for macOS and Windows. Its
      official materials position the product as an assistant that follows the user's
      context across applications rather than requiring work to be moved into a
      standalone chatbot.
  package-nerd-significance:
    - >
      Highlight is relevant to desktop-tool users because it combines model access,
      screen context, meeting transcription, integrations, reusable shortcuts, and
      optional bring-your-own-key configuration in a system-wide assistant. The package
      represents the growing class of AI utilities installed as part of a workstation
      environment.
  project-history:
    - >
      Highlight began as an individual context-aware AI assistant and expanded to cover
      chat, meeting transcription and summaries, dictation, tasks, daily briefs,
      integrations, and custom workflows. Official 2026 pricing materials describe the
      original individual assistant as still available while the company develops a
      newer team-oriented Highlight product.
  related-projects:
    - >
      Highlight integrates with services including GitHub, Notion, Google Calendar,
      Linear, and Slack, and supports user-supplied MCP servers.
    - >
      Its model settings can use hosted models or user-provided API keys for supported
      providers.
  sources:
    - https://docs.highlightai.com/
    - https://help.highlightai.com/
    - https://highlightai.com/default
    - https://highlightai.com/pricing
  summary:
    - >
      Highlight is a context-aware AI desktop assistant for working with on-screen
      content, meetings, writing, tasks, voice input, and connected applications.
  timeline:
    - >
      Initial product: Highlight launched as a context-aware personal AI assistant that
      could be invoked across desktop applications.
    - >
      Subsequent development: The product added meetings, summaries, tasks, dictation,
      integrations, shortcuts, and bring-your-own-key model configuration.
    - >
      2026: Official pricing describes Highlight for Individuals as the original
      assistant and a new team-oriented Highlight product as forthcoming.
  usage:
    - >
      Users invoke Highlight over other applications to ask questions about visible
      context, draft or transform text, transcribe and summarize meetings, dictate text,
      extract tasks, query connected services, and run reusable shortcuts.
