    - https://formulae.brew.sh/formula/mmdbctl
    - https://github.com/ipinfo/mmdbctl
  summary:
    - >
      mmdbctl is an IPinfo-maintained command-line tool for working with MaxMind DB
      (MMDB) files, the binary database format commonly used for IP geolocation and
      network metadata. Its project documentation presents it as a management CLI rather
      than only a lookup utility: it can read records for IPs, import CSV/TSV/JSON-style
      source data into MMDB, export MMDB data, diff two databases, print metadata,
      verify file validity, and install shell completions.
  usage:
    - >
      Its practical niche is the production and inspection side of the MMDB ecosystem.
      IPinfo community documentation shows it being used to convert IPinfo CSV database
      downloads into MMDB files with `mmdbctl import --in data.csv --out data.mmdb`,
      which is the kind of workflow that separates it from lookup-only tools such as
      MaxMind's mmdblookup or mmdbinspect. Packaging through Homebrew and Nix makes it a
      small infrastructure utility for developers who maintain private IP intelligence
      databases or need to transform vendor data into the MMDB format.
related-packages:
  - id: brew:mmdbinspect
    reason: >
      Use mmdbinspect after creating, converting, or validating an MMDB with mmdbctl
      when you need structured YAML or JSONL inspection across IPs, CIDR networks, or
      multiple database files.
    rel: adjacent_workflow
    sources:
      - https://github.com/ipinfo/mmdbctl
      - https://github.com/maxmind/mmdbinspect/blob/main/README.md
