id: brew:cgvg
display-name: CGVG
repo: null
docs:
  - https://uzix.org/cgvg.html
  - https://uzix.org/cgvg/README
config-file-location:
  unix:
    - ~/.cgvgrc
credentials-file-location: null
history:
  adoption-history:
    - >
      CGVG's adoption evidence is modest but real: the 2002 ChangeLog thanks Sergio
      Talens-Oliag for Debian packaging, and the supplied input records packages in
      Homebrew, Debian, Ubuntu, and Nix. That makes it a classic niche developer utility
      whose distribution survived through operating-system package collections rather
      than a large project ecosystem.
  package-nerd-significance:
    - >
      Package nerds care about CGVG because it preserves a pre-GitHub style of Unix tool
      distribution: a tiny Perl utility, a hand-written homepage, an upstream tarball,
      and downstream packages that keep an old developer workflow installable. It is
      also an example of how Homebrew and distribution package sets carry niche tools
      long after their active release cadence slows.
  project-history:
    - >
      Joshua Uziel's README describes CGVG as a quick hack written mostly for his own
      source-code navigation needs, inspired by cscope but intentionally simpler and not
      language-specific. The official ChangeLog records an initial 1.0 release on June
      8, 1999, followed by rapid 1999 iterations that renamed rg to cg, added vi/vim
      behavior, colors, manpages, a per-user ~/.cgvgrc file, and Perl-based searching.
  related-projects:
    - >
      The official README directly relates CGVG to cscope, ctags, etags, find, grep, vi,
      and vim. Its niche is lighter than cscope and broader than tag-only navigation
      because it jumps to arbitrary uses as well as definitions.
  sources:
    - https://uzix.org/cgvg.html
    - https://uzix.org/cgvg/README
    - https://uzix.org/cgvg/ChangeLog
  summary:
    - >
      CGVG is a small pair of Perl command-line source browsing tools, cg and vg, built
      around recursive code search and jumping from search results into vi-like editors.
      Its history is typical of tarball-era Unix developer utilities: a personal
      workflow tool, released with a static homepage, README, and ChangeLog, then kept
      useful through occasional maintenance.
  timeline:
    - '1999: Initial 1.0 release of rg and vg.'
    - >
      1999: rg renamed to cg; ~/.cgvgrc, colors, manpages, and Perl-based search were
      added across 1.1 through 1.6.0.
    - >
      2002: Version 1.6.2 thanked Debian packaging work and noted continued personal use
      despite cscope's open-source release.
    - >
      2014: Version 1.6.3 modernized the scripts for newer Perl and added Python file
      support plus .git exclusion.
  usage:
    - >
      The cg command searches source trees and stores numbered matches; vg then opens
      the selected match in an editor at the recorded file and line. The README
      positions it as a convenience layer over the find/grep/ctags/cscope family, with
      persistent logs under ~/.cgvg and per-user display/search defaults in ~/.cgvgrc.
related-packages:
  - id: brew:cscope
    reason: >
      Cscope is the direct alternative that inspired CGVG; choose it for database-backed
      navigation and richer symbol queries, especially in C code.
    rel: alternative
    sources:
      - https://uzix.org/cgvg.html
      - https://cscope.sourceforge.net/
  - id: brew:ctags
    reason: >
      CGVG's author specifically recommends using ctags alongside it: tags handle
      definition jumps while CGVG searches arbitrary references and opens matching
      lines.
    rel: adjacent_workflow
    sources:
      - https://uzix.org/cgvg.html
      - https://ctags.sourceforge.net/
  - id: brew:vim
    reason: >
      CGVG's vg command is designed to open numbered search results in vi-like editors,
      making Vim the documented editor-side component of the workflow.
    rel: adjacent_workflow
    sources:
      - https://uzix.org/cgvg/README
      - https://www.vim.org/
