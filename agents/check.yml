history:
  adoption-history:
    - >
      The project long predates its 2015 GitHub mirror/repository creation. Its README
      and website document Autotools and CMake builds, pkg-config-style packaging,
      Windows support through Cygwin/MinGW/MSVC, and availability across many Unix-like
      package repositories.
  package-nerd-significance:
    - >
      Check is significant because it is one of the classic packaged C testing
      libraries: small, C-focused, build-system-friendly, and old enough to be present
      in mainstream Linux, BSD, macOS, and source-based packaging ecosystems.
  project-history:
    - >
      Check's NEWS file records an initial public 0.5.0 release before the 0.6.0 release
      in June 2001. Its documentation explains the name as a reference to the
      Autoconf/Automake `make check` testing idiom, while noting that those build tools
      are not required.
  related-projects:
    - >
      GNU Autounit is cited by Check documentation as an influence for using forked test
      processes.
    - >
      Other C/C++ testing frameworks named in the manual include AceUnit, CUnit, CuTest,
      and CppUnit.
    - >
      Autoconf, Automake, CMake, pkg-config, TAP, XML, and Subunit are important
      integration points.
  sources:
    - https://github.com/libcheck/check
    - https://libcheck.github.io/check/
    - https://libcheck.github.io/check/doc/check_html/check_2.html
    - https://raw.githubusercontent.com/libcheck/check/master/NEWS
  summary:
    - >
      Check is a C unit testing framework whose defining feature is running tests in
      separate address spaces so assertion failures, segmentation faults, and signals
      can be reported without killing the whole runner.
  timeline:
    - '2001: 0.5.0 initial public release recorded in NEWS.'
    - '2001: 0.8.0 added nofork mode and pipe-based backend.'
    - '2002: License changed to LGPL in 0.8.1.'
    - '2010: checkmk helper added for reducing test boilerplate.'
    - '2015: GitHub repository created.'
    - '2020: 0.15.2 released.'
  usage:
    - >
      Developers link against Check, define suites and test cases in C, and run tests
      through `make check`, CTest, or their own runner. Check reports failures in
      source-location formats and can output Subunit, TAP, XML, and generic logs.
