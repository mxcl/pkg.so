history:
  adoption-history:
    - >
      NeededApps distributes MetaImage directly, through the Mac App Store, and through
      Setapp. The official site describes a community with hundreds of five-star reviews
      and invites users to influence development through its forum.
  package-nerd-significance:
    - >
      MetaImage packages a wide metadata surface—EXIF, IPTC, XMP, ICC, GPS, QuickTime,
      camera maker notes, sidecars, and CSV exchange—behind a native macOS interface.
      For package-manager users, the cask provides a repeatable installation route for a
      proprietary GUI counterpart to command-line metadata tools.
  project-history:
    - >
      MetaImage has evolved through multiple major versions. NeededApps characterizes
      MetaImage 2 as its largest update since the application’s creation, with a
      redesigned interface, expanded tags, Photos-library editing, filtering, and a file
      comparator. Subsequent releases added broader format support and continued
      improvements to GPS, date, sidecar, and batch workflows.
  related-projects:
    - MetaVideo applies a similar interface and workflow to video metadata.
    - MetaRename uses metadata to construct filenames and organize media collections.
    - >
      ExifTool is a related command-line metadata utility discussed in NeededApps’
      official tutorials.
  sources:
    - 'Official product page: https://neededapps.com/metaimage/'
    - 'Official tutorials: https://neededapps.com/tutorials/'
    - 'Official version history: https://neededapps.com/resources/metaimage/versions/'
  summary:
    - >
      MetaImage is a proprietary macOS application from NeededApps for inspecting,
      comparing, and editing image metadata and geographical tags. It supports
      individual and batch workflows across common images, RAW formats, sidecar files,
      CSV tables, and the macOS Photos library.
  timeline:
    - >
      Before MetaImage 2: The original generation established the application’s
      image-metadata workflow.
    - >
      MetaImage 2: A major redesign added expanded tags, Photos editing, filtering, and
      metadata comparison.
    - >
      Later releases: Support expanded to formats including writable WebP and AVIF, with
      continuing GPS, date, and sidecar improvements.
  usage:
    - >
      Users open images or folders, inspect and compare embedded metadata, edit tags in
      batches, correct GPS data on a map, apply presets, and import or export sidecar
      and CSV data. A Photos extension and Photos importer support workflows involving
      Apple Photos.
