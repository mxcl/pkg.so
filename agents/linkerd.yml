history:
  adoption-history:
    - >
      Linkerd joined CNCF on January 24, 2017 as the foundation's fifth hosted project,
      alongside early cloud-native infrastructure projects such as Kubernetes and
      Prometheus. CNCF announced Linkerd graduation on July 28, 2021, calling it the
      first service mesh project to reach graduated status and naming production
      adopters including Microsoft, Nordstrom, Expedia, JPMC, Clover Health, Entain, and
      H-E-B.
    - >
      The service mesh category grew quickly around Kubernetes operations. Linkerd's
      position was shaped by a deliberately small operational surface, a
      service-mesh-specific proxy rather than a general-purpose proxy, and CLI-first
      workflows for checking cluster health, injecting workloads, and inspecting
      traffic.
  package-nerd-significance:
    - >
      Linkerd is significant because it packages a whole distributed control-plane
      workflow behind a single CLI. For package managers, that means the local binary is
      only the front door: the installed command coordinates CRDs, proxies, mTLS
      identity, metrics, and Kubernetes resources that live elsewhere.
  project-history:
    - >
      Linkerd came from Buoyant's work on production microservice reliability. Linkerd's
      2017 CNCF announcement says it was created by Buoyant founders William Morgan and
      Oliver Gould in 2015 and built on ideas from Twitter's Finagle library; CNCF's
      2021 graduation announcement describes the project as created by Buoyant in 2016.
    - >
      The first CNCF donation was Linkerd 1. Linkerd's own historical note distinguishes
      that donated project from Linkerd 2, the later Kubernetes-oriented line with a
      Rust-based data plane proxy. The Linkerd architecture documentation describes
      Linkerd2-proxy as an ultralight transparent micro-proxy written in Rust and
      designed specifically for service-mesh sidecar use.
  related-projects:
    - >
      Related projects include Kubernetes, Finagle, Linkerd2-proxy, Prometheus,
      OpenTracing, Fluentd, Envoy, and other service-mesh projects such as Istio.
  sources:
    - https://linkerd.io/2-edge/reference/architecture/
    - https://linkerd.io/2017/01/24/linkerd-joins-the-cloud-native-computing-foundation/
    - >
      https://linkerd.io/2020/07/23/under-the-hood-of-linkerds-state-of-the-art-rust-proxy-linkerd2-proxy/
    - >
      https://www.cncf.io/announcements/2021/07/28/cloud-native-computing-foundation-announces-linkerd-graduation/
    - https://www.cncf.io/projects/linkerd/
  summary:
    - >
      Linkerd is a Kubernetes-focused service mesh and CLI for adding observability,
      reliability, and security features to service-to-service traffic without changing
      application code. The Homebrew package supplies the linkerd command used to
      install, inspect, and operate the mesh.
  timeline:
    - >
      2015-2016: Buoyant created Linkerd for cloud-native service communication and
      reliability.
    - '2017-01-24: CNCF accepted Linkerd as its fifth hosted project.'
    - '2018-04-06: CNCF moved Linkerd to the Incubating maturity level.'
    - '2021-07-28: CNCF announced Linkerd graduation.'
    - >
      Linkerd 2 era: the project centered on Kubernetes and the Rust Linkerd2-proxy data
      plane.
  usage:
    - >
      The package is used by cluster operators and platform engineers to install Linkerd
      components, validate a cluster, inject workloads, inspect routes and metrics, and
      manage mesh extensions. It is usually paired with kubectl and Kubernetes manifests
      rather than used as a standalone network daemon.
related-packages:
  - id: brew:istioctl
    reason: >
      istioctl operates Istio, an alternative service mesh offering traffic management,
      policy, telemetry, sidecar, and ambient deployment modes; choose it when Istio's
      broader routing and extensibility model fits the platform.
    rel: alternative
    sources:
      - https://linkerd.io/docs/overview/
      - https://istio.io/docs/concepts/what-is-istio/
      - https://istio.io/latest/docs/reference/commands/istioctl/
  - id: brew:kubernetes-cli
    reason: >
      kubectl is Linkerd's primary companion for applying generated manifests and
      inspecting the Kubernetes resources that Linkerd installs or injects.
    rel: adjacent_workflow
    sources:
      - https://linkerd.io/docs/getting-started/
      - https://linkerd.io/docs/reference/cli/inject/
      - https://kubernetes.io/docs/concepts/overview/kubectl/
