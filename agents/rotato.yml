history:
  adoption-history:
    - >
      Rotato developed into an offline-first Mac production tool with more than 30
      hand-built device models, still and video rendering up to 8K, templates, Figma
      workflows, USB-based iPhone capture, and App Store screenshot production. A
      browser-based version later entered public beta.
    - >
      The application subsequently added a bundled command-line interface and
      machine-readable agent instructions, extending its workflow from interactive
      mockup creation into local render automation.
  package-nerd-significance:
    - >
      Rotato packages a real-time 3D rendering workflow as a native macOS application
      aimed at designers who do not want to assemble device scenes in a general-purpose
      3D package. It accepts a broad range of image, video, audio, and 3D inputs while
      keeping rendering local.
    - >
      The bundled `rotato` CLI and `.rotato` project format make the app relevant beyond
      graphical installation: automated systems can inspect projects, substitute media,
      and queue renders through the installed desktop application.
  project-history:
    - >
      Rotato was created as a Mac application for placing interface captures into
      three-dimensional device mockups and producing polished still images or
      animations. Its scope expanded to templates, multi-device scenes, App Store
      screenshots, Figma integration, custom models, and numerous export formats.
    - >
      Later releases added developer-facing local automation. The official developer
      resources describe the bundled CLI as the supported automation interface, while
      hosted API and MCP integrations were not yet available.
  related-projects:
    - The official Rotato for Figma plugin connects design files with Rotato workflows.
    - Rotato Converter prepares transparent video for Safari and Chromium-based browsers.
    - The local Rotato CLI automates inspection and rendering of `.rotato` projects.
  sources:
    - 'Official Help Center: https://rotato.app/help'
    - 'Official developer resources: https://rotato.app/developers'
    - 'Official product information: https://rotato.app/ai-info'
    - 'Official release notes: https://rotato.app/releases'
  summary:
    - >
      Rotato is an offline-first 3D device-mockup generator and animator for macOS. It
      combines imported screenshots or videos with modeled devices, lighting, cameras,
      backgrounds, and timelines to render marketing stills and videos.
  timeline:
    - >
      2025-08-13: A release added new device models and updated tutorials for several
      scene-editing features.
    - '2025-10-10: Release 154 added newer Apple device models and macOS design updates.'
    - >
      2026: Official developer resources documented preview CLI and agent automation for
      local Rotato renders.
  usage:
    - >
      Designers drag images or videos onto device models, compose and animate scenes on
      a timeline, and export still images or video, including high-resolution and
      transparent formats.
    - >
      Automation users install the CLI from Rotato's settings, inspect `.rotato`
      projects, replace screen media or overlays at render time, and queue snapshot or
      movie renders in the Mac application.
