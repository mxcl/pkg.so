id: brew:bitlbee
display-name: BitlBee
repo: https://github.com/bitlbee/bitlbee
docs:
  - https://wiki.bitlbee.org/
  - https://www.bitlbee.org/user-guide.html
config-file-location:
  linux:
    - /etc/bitlbee/bitlbee.conf
credentials-file-location:
  unix:
    - /var/lib/bitlbee/*.accounts
history:
  adoption-history:
    - >
      BitlBee was adopted by IRC users who wanted one always-open terminal or GUI IRC
      client to cover both IRC and instant messaging. Public BitlBee servers also
      lowered the barrier for users who could not or did not want to run their own
      daemon.
    - >
      The package metadata in this batch shows BitlBee available through Homebrew,
      Debian, Ubuntu, Fedora, Arch, Alpine, MacPorts, Nix, and openSUSE, which is broad
      packaging for a niche chat gateway. The official README also says it is available
      in most distro package managers.
  package-nerd-significance:
    - >
      BitlBee is a classic example of a Unix network shim: it preserves a beloved client
      interface, IRC, while translating newer or different chat protocols behind it.
      Packaging it means packaging both a daemon and a social workflow.
    - >
      It is also significant because its history tracks the churn of consumer messaging
      networks. Package maintainers have had to deal with protocol removals, plugin
      splits, libpurple integration, TLS dependencies, account storage, and security
      fixes as upstream networks changed.
  project-history:
    - >
      The official site describes BitlBee as bringing IM to IRC clients for people who
      already keep an IRC client running. The current README summarizes the project as
      an IRC-to-other-chat-networks gateway, with the main site, wiki, and bug tracker
      as official support surfaces.
    - >
      BitlBee historically supported networks such as Jabber/XMPP, MSN, OSCAR/AIM/ICQ,
      Yahoo, and Twitter; the user guide and wiki document account commands, the
      `&bitlbee` control channel, protocol-specific setup, and plugin or libpurple-based
      expansion. As proprietary IM networks changed or shut down, BitlBee's supported
      protocols changed with them.
  related-projects:
    - IRC clients such as irssi, WeeChat, and HexChat are common front ends for BitlBee users.
    - XMPP/Jabber is one of BitlBee's central built-in protocol families.
    - libpurple provides optional access to many more chat protocols.
    - >
      Third-party plugins cover networks such as Discord, Mastodon, Steam, Facebook, and
      others documented on the BitlBee wiki.
  sources:
    - https://api.github.com/repos/bitlbee/bitlbee
    - https://raw.githubusercontent.com/bitlbee/bitlbee/master/README.md
    - https://wiki.bitlbee.org/
    - https://www.bitlbee.org/
    - https://www.bitlbee.org/user-guide.html
    - input.json source_facts.package-manager
  summary:
    - >
      BitlBee is an IRC gateway to other chat networks. Instead of replacing an IRC
      client, it lets users connect to a BitlBee server from their existing IRC client
      and interact with IM accounts through a control channel and IRC-like
      conversations.
  timeline:
    - >
      2000s: BitlBee establishes the IRC-to-IM gateway model for users who keep an IRC
      client running.
    - >
      2010s: The user guide documents the control channel, account commands, and
      protocols including Jabber, MSN, OSCAR, Yahoo, and Twitter.
    - >
      2017: BitlBee 3.5 adds protocol and enterprise-deployment improvements, according
      to the official news feed.
    - >
      2019: BitlBee 3.6 removes several obsolete built-in protocols and points users
      toward plugins for networks such as Skype, ICQ, Discord, and Mastodon.
    - '2025: The official site still shows current Git activity in the GitHub development tree.'
  usage:
    - >
      A user connects an IRC client to BitlBee, joins the `&bitlbee` control channel,
      registers or identifies, adds accounts, and then chats with contacts as IRC users
      or queries. Account data is saved server-side, which is why the package has
      credential-bearing account files.
    - >
      Admins can run BitlBee as a daemon or inetd-style service, and users can
      alternatively connect to public servers. Plugins and libpurple support extend the
      gateway to networks beyond the built-in protocols.
related-packages:
  - id: brew:irssi
    reason: >
      Use irssi as the terminal IRC client that connects to BitlBee; BitlBee's official
      getting-started guide demonstrates that workflow explicitly.
    rel: adjacent_workflow
    sources:
      - https://wiki.bitlbee.org/GettingStarted
      - https://irssi.org/
