history:
  adoption-history:
    - >
      SimpleMind expanded into a cross-platform product for macOS, Windows, Android,
      iPhone, and iPad. Its official 2019 release coverage marked ten years of
      SimpleMind, while the support documentation describes workflows for moving maps
      among editions and devices.
  package-nerd-significance:
    - >
      The Homebrew cask gives macOS users a package-manager-friendly way to install a
      proprietary, cross-platform mind-mapping application. Its support for FreeMind,
      OPML, cloud folders, and ordinary document files makes it relevant to users who
      value portable knowledge-management formats.
  project-history:
    - >
      SimpleMind was established by 2009 and developed as a visual mind-mapping tool
      across desktop and mobile platforms. Version 2.0, released in 2023, redesigned
      desktop file handling around documents stored in user-selected local or cloud
      directories.
  related-projects:
    - FreeMind is related through SimpleMind's official import support for .mm files.
    - >
      Dropbox, iCloud Drive, OneDrive, and Nextcloud are supported or documented storage
      and synchronization options.
  sources:
    - https://simplemind.eu/blog/category/support/page/2/
    - https://simplemind.eu/blog/category/support/updates/
    - https://simplemind.eu/support/
    - source_facts.description
  summary:
    - >
      SimpleMind is a proprietary cross-platform mind-mapping application. It combines
      visual outlining, document-style storage, imports and exports, and optional
      cloud-folder synchronization.
  timeline:
    - >
      2009: SimpleMind's first decade began, according to its official 2019
      tenth-anniversary release coverage.
    - "2019: Version 1.23 marked SimpleMind's tenth anniversary."
    - '2023: SimpleMind 2.0 introduced redesigned desktop file handling.'
    - >
      2024–2026: Versions 2.4 through 2.9 continued adding layouts, image tools,
      roll-ups, and presentation features.
  usage:
    - >
      Users create hierarchical mind maps containing topics, notes, links, media, dates,
      and checkboxes, then export or share them in formats such as PDF, images, text, or
      calendars.
    - >
      On macOS and Windows, mind maps are saved as ordinary documents in a directory
      selected by the user; placing them in a cloud-synchronized folder enables
      cross-device workflows.
