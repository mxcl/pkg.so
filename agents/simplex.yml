history:
  adoption-history:
    - >
      A terminal prototype appeared in 2021, followed by the stable v1 protocol
      implementation in January 2022 and public mobile applications in early 2022. A
      multiplatform desktop application followed in 2023, extending SimpleX beyond its
      original command-line and mobile clients.
    - >
      The project subsequently added encrypted local databases and files, groups, calls,
      Tor access, device linking, reproducible builds, and self-hostable messaging and
      file-transfer servers.
  package-nerd-significance:
    - >
      SimpleX is notable for deliberately avoiding global user identifiers, including
      random account identifiers. Its open protocols, Haskell core, locally held data,
      self-hostable relays, terminal client, and reproducible-build work make it
      unusually inspectable and operator-friendly for a consumer messenger.
  project-history:
    - >
      Evgeny Poberezkin began working on the SimpleX idea in early 2020 and publicly
      described a prototype SimpleX Messaging Protocol server that October. The first
      terminal chat prototype was announced in May 2021. SimpleX Chat v1 arrived in
      January 2022 with a redesigned, compatible protocol and the chat application
      expanded to mobile and later desktop platforms.
  related-projects:
    - SimpleX Messaging Protocol and SimpleXMQ
    - SimpleX File Transfer Protocol
    - SimpleX Chat terminal client
    - SimpleX SMP, XFTP, and chat relays
  sources:
    - https://github.com/simplex-chat/simplex-chat/blob/stable/README.md
    - https://simplex.chat/blog/20201022-simplex-chat.html
    - https://simplex.chat/blog/20220112-simplex-chat-v1-released.html
    - >
      https://simplex.chat/blog/20230925-simplex-chat-v5-3-desktop-app-local-file-encryption-directory-service.html
    - https://simplex.chat/docs/guide/readme.html
  summary:
    - >
      SimpleX Chat is an open-source, end-to-end encrypted messenger built around
      protocols that do not assign global identifiers to users and that retain user data
      on client devices.
  timeline:
    - '2020: The SimpleX idea and an SMP server prototype were publicly described.'
    - '2021: The first terminal chat prototype was announced.'
    - '2022: SimpleX Chat v1 established the stable protocol generation; mobile apps followed.'
    - '2023: The multiplatform desktop app was released.'
  usage:
    - >
      Users create a local profile, establish contacts through one-time links or QR
      codes, and exchange direct messages, group messages, files, and calls. Advanced
      users can select their own relay servers, use the terminal client, or operate
      SimpleX infrastructure.
