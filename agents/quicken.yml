history:
  adoption-history:
    - >
      Quicken reports that the product became the top-selling consumer software title in
      1988 and has served more than 20 million customers. Its longevity made the Quicken
      data file and desktop workflow familiar fixtures in personal-finance software.
    - >
      After becoming independent, Quicken moved from perpetual licenses to subscriptions
      and expanded its mobile and web companions while retaining the desktop product for
      long-time users.
  package-nerd-significance:
    - >
      Quicken is notable in desktop package catalogs as a proprietary application with
      roots in the DOS era that remains actively distributed for modern macOS. Its
      long-lived local data-file model distinguishes it from newer web-first budgeting
      services.
  project-history:
    - >
      Quicken originated as Intuit's first product and launched for DOS in 1984. Mac and
      Windows editions followed, with the Windows release arriving in 1991 and Quicken
      Deluxe in 1993.
    - >
      The product separated from Intuit in 2016 when Quicken became an independent
      company. In 2023, the established desktop product was renamed Quicken Classic as
      the company unified its products under the Quicken brand.
  related-projects:
    - Quicken Simplifi is Quicken's cloud-native personal-finance service.
    - Quicken's mobile and web applications act as companions to supported desktop data.
  sources:
    - https://www.quicken.com/about-us/press/quicken-anniversary/
    - >
      https://www.quicken.com/about-us/press/quicken-celebrates-forty-years-in-personal-finance-management/
    - https://www.quicken.com/blog/this-is-quicken-at-40/
  summary:
    - >
      Quicken Classic is a proprietary personal-finance application descended from the
      original 1984 Quicken product. It supports budgeting, account tracking,
      investments, reports, and connected financial-data downloads.
  timeline:
    - "1984: Quicken for DOS launches as Intuit's first product."
    - '1988: Quicken becomes the top-selling consumer software product, according to Quicken.'
    - '1991: Quicken for Windows launches.'
    - '2012: Mobile and web companion applications launch.'
    - '2016: Quicken separates from Intuit and becomes an independent company.'
    - '2023: The desktop product is renamed Quicken Classic.'
  usage:
    - >
      Users maintain a financial data file containing accounts, transactions, budgets,
      investments, and reports. Quicken Classic can download data from supported
      financial institutions and synchronize selected information with companion
      services.
    - >
      The Mac edition exposes application-wide behavior through its Settings window and
      can password-protect a data file. Quicken's official help does not document a
      stable user-editable configuration or credentials-file path.
