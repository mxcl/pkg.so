config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The tool matters because MPD is built around a daemon-and-client split. The MPD
      manual calls mpc the most basic client, useful in shell scripts, and notes that
      people bind specific mpc commands to hotkeys. In practice, mpc is the Unixy
      control surface for MPD: scripts can enqueue music, control playback, inspect the
      database, format metadata, and automate a headless music setup without a terminal
      UI or graphical client.
  sources:
    - https://github.com/MusicPlayerDaemon/mpc
    - https://mpd.readthedocs.io/en/stable/user.html
    - https://raw.githubusercontent.com/MusicPlayerDaemon/mpc/master/AUTHORS
    - https://www.musicpd.org/clients/mpc/
    - https://www.musicpd.org/doc/mpc/html/
  summary:
    - >
      mpc is the small command-line client in the Music Player Daemon ecosystem. The
      Music Player Daemon project credits mpc to The Music Player Daemon Project, with
      contributors including Avuton Olrich, Eric Wong, Florian Schlichting, J. Alexander
      Treuman, Jeffrey Middleton, Jonathan Neuschaefer, Max Kellermann, Michal
      Nazarewicz, Richard Molitor, Romain Bignon, and Warren Dukes. Its role has stayed
      deliberately narrow: connect to an MPD server, send commands, and print status or
      query results.
  usage:
    - >
      As a package, mpc travels with MPD across Unix-like package managers and Homebrew.
      It occupies the opposite end of the MPD client spectrum from ncurses, web, mobile,
      and desktop clients: it is not a library or rich browser, but the composable CLI
      piece that other shell workflows can depend on.
related-packages:
  - id: brew:mpd
    reason: >
      MPD supplies the server, music database, playback engine, queue, and network
      protocol that mpc connects to and controls.
    rel: adjacent_workflow
    sources:
      - https://www.musicpd.org/clients/mpc/
      - https://www.musicpd.org/
  - id: brew:ncmpc
    reason: >
      Choose ncmpc when you want an interactive, keyboard-oriented curses interface with
      library browsing, search, playlist editing, and lyrics for the same MPD server.
    rel: alternative
    sources:
      - https://www.musicpd.org/clients/mpc/
      - https://www.musicpd.org/clients/ncmpc/
