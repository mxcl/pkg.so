id: brew:git-when-merged
display-name: git-when-merged
repo: null
docs:
  - https://github.com/mhagger/git-when-merged#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents several installation paths: pipx from PyPI, a local virtual
      environment, cloning the repository onto PATH, and Homebrew for macOS users.
      Package-manager metadata also lists distribution through Homebrew, MacPorts, and
      Nix.
  package-nerd-significance:
    - >
      The tool is a package-nerd favorite because it wraps a subtle Git graph question
      in a memorable subcommand, making first-parent merge analysis scriptable and
      repeatable.
  project-history:
    - >
      Michael Haggerty created the repository in February 2013. The README says the
      command was originally based on a Stack Overflow suggestion for finding the merge
      commit that included a specific commit.
    - >
      The project grew around Git-history forensics. The 2016 releases added recursive
      merge tracing, log output, commit-only output, branch display, and describe-based
      options. A 2022 release added the packaging work needed for PyPI distribution.
  related-projects:
    - git log --first-parent, git describe, pipx, PyPI, Homebrew
  sources:
    - https://formulae.brew.sh/formula/git-when-merged
    - https://github.com/mhagger/git-when-merged
    - https://github.com/mhagger/git-when-merged/releases
    - https://pypi.org/project/git-when-merged
    - https://raw.githubusercontent.com/mhagger/git-when-merged/master/README.md
  summary:
    - >
      git-when-merged is a Python Git extension that finds the merge commit that first
      brought a given commit into a branch.
  timeline:
    - '2013: Repository created.'
    - '2016: v1.1 and v1.2 releases expanded merge-analysis options.'
    - '2022: v1.2.1 added PyPI release packaging.'
  usage:
    - >
      Practitioners use git when-merged during code archaeology, release maintenance,
      and regression tracking. It walks first-parent history to answer when and why a
      commit entered a branch, with options to show logs, diffs, merge ranges, patterns,
      and configured reference groups.
related-packages: []
tags:
  - cli
