history:
  adoption-history:
    - >
      TtH's adoption came from a specific web-publishing problem: TeX was strong for
      mathematical authoring, while early HTML lacked reliable math rendering. The
      official comparison page argues for native HTML using symbol fonts and tables as a
      fast, convenient alternative to PDF pages or image-based equations.
    - >
      The supplied package facts show TtH distributed through Homebrew, Debian, Fedora,
      MacPorts, and Ubuntu, evidence that it survived as a compact Unix-style converter
      even as newer TeX-to-web systems appeared.
  package-nerd-significance:
    - >
      For package maintainers, TtH is valuable because it is a small, portable
      command-line converter with a long release history and very few moving parts
      compared with browser-driven or image-generation workflows.
    - >
      It is also historically interesting because the project pages are themselves
      artifacts of the tool: generated HTML pages that document the same TeX-to-HTML
      problem the package solves.
  project-history:
    - >
      The official site presents TtH as a translator from TeX, especially mathematical
      TeX, into browser-readable HTML. The site's own pages are generated by TtH, and
      the homepage notes that the manual can be translated in real time from TeX source.
    - >
      Hutchinson's web-math overview records an original version in November 1997, with
      updates in 1998 and 2002, placing TtH in the first wave of tools trying to make
      scientific and mathematical documents practical on the web before browser-native
      math support was common.
    - >
      The distribution page describes TtH as portable to essentially any operating
      system, available as executables or C source, and still developing. The change log
      records version 4.00 on 5 December 2010, version 4.01 as the GPL2 public-source
      release, and version 4.16 on 25 July 2022.
  related-projects:
    - TtM is the companion TeX-to-MathML translator linked from the official TtH homepage.
    - >
      The official web-math comparison discusses LaTeX2HTML and TeX4ht as neighboring
      TeX-to-web converters.
    - >
      TtHfunc is the function-callable version for integrating the translator into other
      executables.
  sources:
    - http://silas.psfc.mit.edu/tth/
    - http://silas.psfc.mit.edu/tth/CHANGES
    - http://silas.psfc.mit.edu/tth/distribution.html
    - http://silas.psfc.mit.edu/tth/manual/
    - http://silas.psfc.mit.edu/tth/webmath.html
    - source_facts.package-manager
  summary:
    - >
      TtH is Ian Hutchinson's TeX and LaTeX to HTML translator, built for publishing
      mathematical documents on the web without converting equations into images.
    - >
      Its package-manager niche is old-school TeX automation: a portable C command that
      can be dropped into documentation pipelines when compact HTML output is preferable
      to image-heavy conversions.
  timeline:
    - >
      1997: Hutchinson's web-math overview lists the original version of the discussion
      around TtH's approach.
    - >
      2006: The distribution page was generated by TtHgold 3.77 and described ongoing
      development and C-source distribution.
    - '2010: Version 4.00 released.'
    - '2010: Version 4.01 released as the full public GPL2 source version.'
    - '2022: Version 4.16 released.'
  usage:
    - >
      The official manual describes TtH as translating Plain TeX and LaTeX documents
      into HTML, including document structure, hyperlinks, equations, tables,
      bibliographies, indexes, graphics inclusion, and split output.
    - >
      The site emphasizes that TtH translates equations rather than rendering them as
      images, producing compact and fast-viewing web documents. The official examples
      include large lecture notes, a Plain TeX test document, and the TtH manual itself
      served from TeX source.
