history:
  adoption-history:
    - >
      Transocks broadened its reach across mobile devices, Windows, macOS, televisions,
      browser extensions, and routers. The official site promotes registration-free
      mobile use while offering accounts and paid service time for sharing access across
      devices. The macOS edition is also represented by the Homebrew cask in
      `source_facts.package-manager`.
  package-nerd-significance:
    - >
      For package-manager users, Transocks represents the specialized class of
      regional-access clients intended to route selected traffic back through China
      rather than a general-purpose developer VPN. Its cross-platform presence makes the
      macOS cask one endpoint in a larger consumer service.
  project-history:
    - >
      The official site displays a 2017–2023 copyright range, showing that the service
      was publicly represented by at least 2017. Reliable official material provides
      little additional dated project history.
  related-projects:
    - >
      Transocks is related to consumer VPN and smart-proxy clients, but its documented
      purpose is specifically accelerating or restoring access to mainland-Chinese
      media, shopping, study, and work services for users abroad.
  sources:
    - Homebrew cask identity supplied by `source_facts.package-manager`.
    - 'Official English homepage: https://www.transocks.com/en.html'
    - 'Official help center: https://www.transocks.com/information.html?item=use-help'
  summary:
    - >
      Transocks is a cross-platform back-to-China proxy service aimed at overseas users
      who need access to mainland-Chinese applications, websites, media, shopping, or
      work resources.
  timeline:
    - '2017: The beginning of the copyright range displayed by the official Transocks site.'
    - '2023: The latest year in the copyright range displayed on the English homepage.'
  usage:
    - >
      On macOS, users start a one-click connection, approve creation of the system VPN
      configuration, and choose web or application mode. The official help page
      recommends connecting Transocks before opening the target Chinese application or
      website.
