    - >
      https://help.elgato.com/hc/en-us/articles/360027951012-Newer-Elgato-Game-Capture-HD-software-works-with-original-Elgato-Game-Capture-HD-hardware
    - https://help.elgato.com/hc/en-us/sections/360004111092-Elgato-Game-Capture-HD-Software
    - source_facts.package-manager
  summary:
    - >
      Elgato Game Capture HD is a legacy desktop application for recording, organizing,
      editing, and streaming video from supported Elgato capture devices.
  timeline:
    - >
      Version 2.0: Stream Command and separate audio-track features became available for
      the original Game Capture HD and HD60 hardware.
    - >
      Version 3.0: The Windows application added a 64-bit build, hardware encoding, web
      overlays, and a redesigned interface.
    - >
      Version 3.5: Stream Deck control and a Nintendo Switch device profile were added
      on Windows.
    - >
      End of active development: Elgato designated Game Capture HD as a legacy product,
      with 3.7 for Windows and 2.11.14 for macOS.
    - '2026 input snapshot: Homebrew still packages the final macOS 2.11.14 release.'
  usage:
    - >
      Users connect supported Elgato hardware, preview incoming video, record gameplay,
      add commentary and metadata, perform basic editing, and share or stream the
      result. The application can stream to integrated services or a custom RTMP
      endpoint. Because it is no longer developed, it is mainly appropriate for
      compatible legacy hardware and established workflows.
