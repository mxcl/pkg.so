id: brew:litra
display-name: litra
repo: null
docs:
  - https://github.com/timrogers/litra-rs#readme
config-file-location:
  linux:
    - /etc/udev/rules.d/99-litra.rules
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through Cargo, direct release binaries, and Homebrew.
      The upstream README records that litra entered Homebrew core on January 30, 2026
      after previously being distributed through the maintainer's tap.
  package-nerd-significance:
    - >
      litra-rs packages vendor-specific USB lighting control as a small cross-platform
      Rust utility. Its progression from a third-party Homebrew tap into homebrew-core
      illustrates a common adoption route for specialized hardware CLIs.
    - >
      Its combination of a command-line interface, Rust library, and local MCP server
      makes the same hardware integration usable by shell scripts, native applications,
      and agent-oriented tools.
  project-history:
    - >
      litra-rs was created as a command-line and Rust interface for Logitech's Litra
      lighting hardware. Upstream currently supports Litra Glow, Litra Beam, and Litra
      Beam LX devices connected over USB.
    - >
      The feature set expanded beyond basic power control to brightness and
      color-temperature adjustment, Beam LX rear-light control, machine-readable device
      discovery, and an MCP server.
  related-projects:
    - >
      The upstream README points to litra-autotoggle, a companion utility that switches
      Litra lights in response to webcam activity.
  sources:
    - https://docs.rs/litra
    - https://github.com/timrogers/litra-rs
  summary:
    - >
      litra-rs is a Rust hardware-control project whose `litra` executable manages
      Logitech Litra lights locally over USB.
  timeline:
    - >
      2026: The `litra` formula moved from the maintainer's Homebrew tap into
      homebrew-core on January 30.
  usage:
    - >
      Users turn lights on or off, adjust brightness and color temperature, select
      devices by serial number, path, or type, and request JSON-formatted device
      information.
    - >
      Linux installations generally require the supplied `99-litra.rules` udev rule and
      membership in the `video` group. No application-specific persistent configuration
      or credential file is documented.
related-packages: []
