history:
  adoption-history:
    - >
      Snes9x became a portable emulator with official Windows, macOS, GTK, and Unix
      ports, while its core was also adopted by libretro and ported to additional
      systems.
    - >
      Its longevity, broad platform support, save states, controller and peripheral
      emulation, cheats, movie recording, netplay, and display filters made it a
      familiar component of retro-gaming installations.
  package-nerd-significance:
    - >
      Snes9x is a classic emulation package: a mature C++ codebase with multiple native
      front ends, architecture-specific emulation cores, platform-dependent
      configuration conventions, and a reusable libretro core. Packaging it exposes the
      practical differences among desktop ports while preserving a common emulator core.
  project-history:
    - >
      Gary Henderson and Jerremy Koot founded Snes9x by combining their earlier Snes96
      and Snes97 emulation projects. The project subsequently attracted contributors
      from the SNES emulation community and developed numerous platform ports.
    - >
      Development eventually consolidated around the official GitHub repository, where
      the emulator core and its Windows, macOS, GTK, Unix, Qt, and libretro-related code
      continue to be maintained.
  related-projects:
    - Snes96 and Snes97 were the predecessor projects merged to create Snes9x.
    - >
      The libretro Snes9x core adapts the emulator for RetroArch and other libretro
      front ends.
  sources:
    - >
      Official Windows documentation:
      https://github.com/snes9xgit/snes9x/blob/master/win32/docs/readme-windows.txt
    - 'Official homepage: https://www.snes9x.com/'
    - 'Official ports documentation: https://github.com/snes9xgit/snes9x/wiki/Ports'
    - 'Official repository and README: https://github.com/snes9xgit/snes9x'
  summary:
    - >
      Snes9x is a portable, freeware emulator for Super Nintendo Entertainment System
      and Super Famicom software.
  timeline:
    - '1990s: Gary Henderson and Jerremy Koot combined Snes96 and Snes97 to establish Snes9x.'
    - >
      1999: The official homepage described more than three years of development and
      numerous available ports.
    - "2010s: Development became centered on the project's official GitHub repository."
    - '2024: Official Windows documentation was updated for the 1.63 release line.'
  usage:
    - >
      Users supply legally obtained SNES or Super Famicom game images, configure
      keyboard or gamepad controls, and run games with optional display and audio
      processing.
    - >
      Snes9x supports cartridge-style SRAM saves, save states, cheats, emulated
      peripherals, movie recording, and netplay, with exact capabilities varying by
      platform port.
