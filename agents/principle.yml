history:
  adoption-history:
    - >
      Principle found a niche among product and interface designers who need to evaluate
      motion and interaction before engineering implementation. Official import support
      for Figma and Sketch places it within established interface-design workflows.
  package-nerd-significance:
    - >
      Principle is representative of specialized commercial macOS applications installed
      through cask-oriented package management. It bridges static design assets and
      interactive demonstrations while remaining a native, GUI-first tool rather than a
      code framework.
  project-history:
    - >
      Principle was created by Daniel Hooper and is published by Hooper Software. It was
      designed as a native macOS environment for constructing animated, interactive
      interface prototypes using artboards, transitions, timelines, events, drivers, and
      reusable components.
  related-projects:
    - >
      Principle imports designs from Figma and Sketch. Its prototyping and motion-design
      role overlaps with tools such as Framer and Adobe After Effects, while focusing on
      interactive interface behavior.
  sources:
    - https://principleformac.com/
    - https://principleformac.com/contact.html?q=faq
    - https://principleformac.com/docs.html
    - https://principleformac.com/tutorial.html
  summary:
    - >
      Principle is a commercial native macOS application for designing and presenting
      animated, interactive prototypes for mobile, web, and desktop interfaces.
  timeline:
    - 'Principle 2.0: Reusable components were introduced.'
    - 'Principle 6: Share to Web enabled browser-based distribution of interactive designs.'
    - 'Later releases: Figma import joined the established Sketch import workflow.'
  usage:
    - >
      Designers create or import artboards, connect them with events and animated
      transitions, preview interactions, and export recordings or web-shareable
      prototypes to communicate intended behavior to collaborators and engineers.
