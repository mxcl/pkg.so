history:
  adoption-history:
    - >
      Wins is distributed directly by its developer and as a Homebrew cask. The official
      site presents a trial followed by paid lifetime-license tiers.
    - >
      The developer reports use across more than 100 countries and promotes
      compatibility with both Apple Silicon and Intel Macs; these are first-party
      adoption claims rather than independently audited figures.
  package-nerd-significance:
    - >
      Wins belongs to the active ecosystem of third-party macOS window managers that
      fill gaps between native macOS behavior and Windows-style snapping. Its
      package-manager relevance comes chiefly from being installable and upgradable as a
      Homebrew cask despite being proprietary commercial desktop software.
    - >
      The application is unusual in integrating its controls into macOS System Settings
      rather than relying solely on a conventional standalone settings window.
  project-history:
    - >
      Wins was developed as a macOS window-management utility emphasizing Windows-like
      snapping and richer window switching. The product evolved into Wins 3 with
      features including Snap Island, Cmd-Tab Plus, Dock Preview, Mission Control
      enhancements, customizable shortcuts, and multi-display controls.
    - >
      The official changelog documents continuing feature and compatibility releases,
      while the current product is offered commercially with a short free trial and
      lifetime licenses.
  related-projects:
    - >
      Wins occupies the same macOS utility category as other third-party snapping and
      window-management tools, but the official site does not identify a predecessor or
      parent open-source project.
  sources:
    - 'Input package identity: source_facts.package-manager.brew-cask'
    - 'Official changelog: https://wins.cool/changelog'
    - 'Official homepage and FAQ: https://wins.cool/'
  summary:
    - >
      Wins is a commercial macOS window manager that adds edge snapping, enhanced
      Command-Tab and Mission Control behavior, Dock previews, keyboard shortcuts, and
      multi-display tools.
  timeline:
    - '2026: The official site announced Wins 3.6 and continued the Wins 3 product line.'
  usage:
    - >
      Users drag windows to screen edges for quick layouts, switch and close windows
      through an enhanced Command-Tab interface, preview windows from the Dock, and
      assign custom shortcuts.
    - >
      Wins integrates its settings into macOS System Settings. It requires Accessibility
      permission for core behavior; Screen Recording permission is optional for
      applicable preview functionality.
