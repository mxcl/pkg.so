history:
  adoption-history:
    - >
      Sabaki became a cross-platform desktop tool for Go players who needed more than a
      basic SGF viewer. Support for external GTP engines connected it to the wider
      ecosystem of traditional and neural-network Go engines.
  package-nerd-significance:
    - >
      Sabaki packages a specialized board-game workflow as an Electron desktop
      application across macOS, Windows, and Linux. It is useful to package enthusiasts
      because it combines an SGF editor, study interface, scoring tools, and a generic
      engine protocol rather than bundling one fixed opponent.
  project-history:
    - >
      Sabaki was created as a free, open-source Go board and SGF editor using
      Electron-based web technology. Development expanded the application from record
      editing and navigation into engine play and analysis, extensible themes,
      localization, and support for several game-record formats.
  related-projects:
    - Shudan supplies Sabaki's customizable goban component.
    - >
      SabakiHQ maintains related SGF, GTP, game-tree, board-matching, and dead-stone
      libraries.
    - GNU Go, Pachi, KataGo, and other GTP-compatible engines can be used with Sabaki.
  sources:
    - https://github.com/SabakiHQ/Sabaki
    - https://github.com/SabakiHQ/Sabaki/blob/master/docs/README.md
    - https://sabaki.yichuanshen.de/
  summary:
    - >
      Sabaki is a free, open-source, cross-platform Go/Baduk/Weiqi board, game-record
      viewer, and SGF editor.
  timeline:
    - Sabaki began as an Electron-based open-source Go board and SGF editor.
    - >
      Later development added richer SGF tooling, themes, localization, and GTP engine
      analysis workflows.
  usage:
    - >
      Players use Sabaki to create, open, annotate, and study SGF game records; navigate
      variations; estimate or score positions; play against GTP engines; or run
      engine-versus-engine games.
