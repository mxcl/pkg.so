history:
  adoption-history:
    - >
      cmix is distributed narrowly compared with mainstream compressors: the input
      package facts list Homebrew only. Its adoption is therefore less about day-to-day
      compression and more about access for people studying or benchmarking high-ratio
      compressors.
  package-nerd-significance:
    - >
      cmix matters to package nerds because it is a deliberately impractical compressor
      in the useful sense: high CPU and memory needs make the packaging problem about
      reproducible builds, large-resource tests, and benchmark comparability rather than
      command convenience.
  project-history:
    - >
      The official homepage describes cmix as a lossless compressor that optimizes
      compression ratio at the cost of high CPU and memory use, with state-of-the-art
      results on several compression benchmarks.
    - >
      The homepage download table records a long public release line beginning with v1
      in April 2014 and continuing through v21 in September 2024. The GitHub repository
      was created in November 2015 and tracks the source-control era of the project.
  related-projects:
    - >
      The official homepage links cmix results to the Calgary, Silesia, enwik, Large
      Text Compression, Silesia Open Source Compression, and Lossless Photo Compression
      benchmarks.
  sources:
    - https://www.byronknoll.com/cmix.html
    - https://api.github.com/repos/byronknoll/cmix
    - https://api.github.com/repos/byronknoll/cmix/releases
  summary:
    - >
      cmix is Byron Knoll's lossless data compression program aimed at compression ratio
      rather than speed or memory thrift.
  timeline:
    - '2014-04: v1 release listed on the official homepage.'
    - '2015-11: GitHub repository created and v8 release listed.'
    - '2019-08: v18 release listed.'
    - '2023-11: v20 release listed.'
    - '2024-09: v21 release listed.'
  usage:
    - >
      The official homepage emphasizes Linux, Windows, and Mac OS X support and
      recommends at least 32 GB of RAM. That framing makes cmix a benchmark and
      experimentation tool rather than a default archive format for ordinary users.
