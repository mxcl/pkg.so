history:
  adoption-history:
    - >
      gpsim was adopted in embedded and hobbyist PIC development because it offered a
      free software simulator with debugging concepts familiar from gdb-like workflows
      and in-circuit emulator usage.
    - >
      The project also formed a small ecosystem around GNUPIC tooling. The official
      related-links section points to gpasm/gputils and other PIC tools, while the
      Windows section points to Borut Razem's gpsimWin32 port and installer.
    - >
      SourceForge file feeds show continued packaged tarball releases across the 2010s
      and into the 2020s, which explains why the tool remains present in Unix package
      managers despite its older SourceForge-era development style.
  package-nerd-significance:
    - >
      gpsim is a compact example of old-school embedded free software packaging:
      SourceForge hosting, generated HTML/PDF docs, a devel mailing list, GTK-era GUI
      pieces, and integration with assembler/debugging workflows.
    - >
      For package maintainers, its value is in preserving a niche toolchain component
      for PIC work. It sits near gputils/gpasm rather than modern language-runtime
      stacks, and it keeps older embedded development workflows installable from
      standard package managers.
  project-history:
    - >
      The gpsim site presents the project as part of the GNUPIC ecosystem: a
      full-featured simulator for Microchip PIC microcontrollers designed for accuracy,
      speed, and usefulness rather than visual polish.
    - >
      Its design goal is whole-chip simulation, including the CPU core, I/O pins, and
      internal peripherals. The documentation emphasizes breakpoints, single-stepping,
      disassembly, memory inspection and changes, read/write breakpoints, trace buffers,
      stimuli, and modules.
    - >
      The project used SourceForge for downloads, support trackers, mailing lists, and
      Subversion source browsing. Its site points users to released source tarballs, SVN
      checkout instructions, documentation generated from LyX, and a gpsim-devel mailing
      list.
  related-projects:
    - gputils and gpasm are named by the gpsim site as related GNUPIC assembler tooling.
    - gpsimWin32 is the Windows port referenced by the official gpsim site.
    - GTK and gtk+extra are part of the documented GUI/build environment.
  sources:
    - https://gpsim.sourceforge.net/
    - https://gpsim.sourceforge.net/gpsim.html.LyXconv/gpsim.html
    - https://sourceforge.net/p/gpsim/code/HEAD/tree/trunk
    - https://sourceforge.net/projects/gpsim/
    - https://sourceforge.net/projects/gpsim/rss?path=/gpsim
  summary:
    - >
      gpsim is a GPL/LGPL software simulator for Microchip PIC microcontrollers, with a
      command-line interface, GTK-based GUI, debugger-like controls, stimuli, modules,
      and support for many PIC families.
  timeline:
    - '2009: SourceForge file feed lists gpsim 0.24.0 release artifacts.'
    - '2010: gpsim 0.25.0 release artifacts appear on SourceForge.'
    - '2011: gpsim 0.26.x release artifacts appear on SourceForge.'
    - '2013: gpsim 0.27.0 release artifacts appear on SourceForge.'
    - >
      2017: gpsim site records a page modification date and points users to SVN, docs,
      and support resources.
    - '2019: gpsim 0.31.0 release artifact appears on SourceForge.'
    - '2020: HTML documentation identifies a 2020 document date.'
    - '2023: gpsim 0.32.1 release artifact appears on SourceForge.'
  usage:
    - >
      Users run `gpsim` to load PIC assembly/object artifacts, select a processor,
      inspect registers and memory, single-step or run code, set breakpoints, and
      connect simulated stimuli to pins.
    - >
      The official documentation treats the command-line interface as central and also
      documents GUI windows such as register viewers, source browsers, breadboard views,
      scope windows, trace viewers, and module support.
    - >
      The project is useful when a developer wants to test microcontroller code behavior
      without hardware or to debug peripheral interactions before moving to a device or
      in-circuit tool.
related-packages:
  - id: brew:gputils
    reason: >
      Use gputils to assemble and link PIC firmware into the symbol-rich `.cod` files
      that gpsim's official manual uses for simulation and source-level debugging.
    rel: adjacent_workflow
    sources:
      - https://gpsim.sourceforge.net/gpsim.html.LyXconv/gpsim.html
      - https://gputils.sourceforge.io/
