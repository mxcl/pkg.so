history:
  adoption-history:
    - >
      The 2.x series is the main Homebrew formula. MongoDB's release notes mark 2.0.0 as
      a breaking release that removed deprecated types and methods, added BSON Binary
      Vector subtype support in libbson, and added libmongoc support for aggregate
      operations that include lookup stages for in-use encryption. Later 2.x notes show
      the driver continuing to track server features such as OIDC authentication
      variants, Queryable Encryption operations, client-side timeout behavior, overload
      handling, and other production-driver concerns.
  project-history:
    - >
      The driver line has been packaged under several names. Homebrew notes
      mongo-c-driver as also known as libmongoc and mongo-c-driver@2, and formerly known
      as mongo-c. The upstream API site describes the package as a cross-platform
      MongoDB client library for C and for writing drivers in higher-level languages,
      while the GitHub repository summarizes the project as libmongoc plus libbson and
      points contributors to MongoDB's driver documentation and support channels.
  sources:
    - https://formulae.brew.sh/formula/mongo-c-driver
    - https://github.com/mongodb/mongo-c-driver
    - https://mongoc.org/
    - https://www.mongodb.com/docs/languages/c/c-driver/current/
    - https://www.mongodb.com/docs/languages/c/c-driver/current/reference/release-notes/
  summary:
    - >
      mongo-c-driver is MongoDB's official C client-driver project. The documentation
      identifies libmongoc as the official driver for C applications and explains that
      it depends on libbson for creating and parsing BSON, MongoDB's native document
      format. The project therefore serves two audiences: C programs that connect
      directly to MongoDB, and higher-level drivers or bindings that need a maintained C
      implementation underneath.
  usage:
    - >
      In practice the formula is installed when building C applications against MongoDB,
      compiling software that embeds MongoDB access through libmongoc, or satisfying
      native dependencies for language bindings and tools. It sits beside server
      packages and higher-level MongoDB drivers: users rarely run it as an end-user
      database tool, but many builds need its headers, libraries, pkg-config/CMake
      metadata, and small diagnostic utility.
related-packages:
  - id: brew:mongo-c-driver@1
    reason: >
      Use the versioned 1.x formula only when an existing build still requires the older
      libmongoc/libbson ABI; new development should use the current driver.
    rel: alternative
    sources:
      - https://formulae.brew.sh/formula/mongo-c-driver@1
      - https://www.mongodb.com/docs/languages/c/c-driver/v1.x/reference/release-notes/
      - https://www.mongodb.com/docs/languages/c/c-driver/current/upgrade/
  - id: brew:mongo-orchestration
    reason: >
      Use Mongo Orchestration to provision standalone servers, replica sets, and sharded
      clusters when integration-testing code built with the C driver.
    rel: adjacent_workflow
    sources:
      - https://github.com/mongodb/mongo-c-driver
      - https://github.com/mongodb-labs/mongo-orchestration
