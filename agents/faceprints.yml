id: brew:faceprints
display-name: Faceprints
repo: null
docs:
  - https://github.com/Nexuist/faceprints#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official release page provides downloadable builds, and Homebrew packages the
      project at stable version 1.1.2 with a HEAD build option.
  package-nerd-significance:
    - >
      Faceprints is notable for package-manager users because it exposes platform-native
      computer-vision functionality as a scriptable command-line tool without requiring
      internet access or third-party model downloads.
  project-history:
    - >
      The GitHub repository was created in June 2024. The official README says
      Faceprints is built off the author's seeV work and provides shell-friendly
      operations for classifying photos, adding labeled faceprints, removing entries,
      listing labels, and extracting embeddings.
  related-projects:
    - The README explicitly relates Faceprints to seeV, another project by the same author.
  sources:
    - https://api.github.com/repos/Nexuist/faceprints
    - https://api.github.com/repos/Nexuist/faceprints/releases
    - https://formulae.brew.sh/api/formula/faceprints.json
    - https://github.com/Nexuist/faceprints#readme
  summary:
    - >
      Faceprints is a Swift CLI for local face recognition and face-label indexing using
      Apple's Vision.framework models.
  timeline:
    - '2024: GitHub repository created.'
    - '2024: 1.1.2 published as the initial GitHub Release.'
    - '2026: Homebrew formula tracks 1.1.2 as the stable version.'
  usage:
    - >
      The CLI accepts local image paths or image URLs for classification, can emit JSON
      or plaintext results, and stores its faceprint index under the user's home
      directory as documented in the README.
related-packages: []
