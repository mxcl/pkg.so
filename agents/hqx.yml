history:
  adoption-history:
    - >
      The README ties hqx to emulator culture, naming Nestopia, bsnes, ZSNES, Snes9x,
      and FCE Ultra as users of the algorithm family. Homebrew and Fedora packaging make
      the grom358 library/CLI available outside emulator source trees.
  package-nerd-significance:
    - >
      hqx matters because it packages a once-emulator-specific graphics algorithm as a
      reusable system library and filter command. That is exactly the sort of niche
      media primitive package managers keep alive: small, old-school, useful when you
      need it, and awkward to rederive from scratch.
    - >
      Its significance is also historical: hq2x/hq3x/hq4x belong to the era when
      emulator authors competed to make low-resolution console graphics look acceptable
      on higher-resolution displays without losing pixel-art structure.
  project-history:
    - >
      The grom358 implementation packages Maxim Stepin's hqx pixel-art scaling family as
      a buildable Unix library and CLI. Its NEWS file says version 1.0 added 24-bit
      color support, a command-line tool using the DevIL image library, and an autotools
      build system.
    - >
      The README explains the algorithmic shape: each source pixel is evaluated against
      its 3-by-3 neighborhood, color differences are calculated in YUV space, a
      256-entry lookup table selects interpolation patterns, and the result preserves
      sharp edges better than nearest-neighbor scaling for sprites and line art.
  related-projects:
    - hq2x, hq3x, and hq4x are the three scaling filters implemented by the package.
    - DevIL is the image library required by the documented command-line build.
    - >
      Nestopia, bsnes, ZSNES, Snes9x, and FCE Ultra are emulator projects named in the
      upstream README as users of the hqx algorithm family.
    - >
      Scale2x and 2xSaI are neighboring pixel-art scaling algorithms shown alongside
      hq2x in preserved HiEnd3D comparison material.
  sources:
    - https://formulae.brew.sh/formula/hqx
    - https://github.com/grom358/hqx
    - https://github.com/grom358/hqx/blob/master/NEWS
    - https://web.archive.org/web/20131205091805/http://www.hiend3d.com/hq2x.html
  summary:
    - >
      hqx is a C library and command-line tool for the hq2x, hq3x, and hq4x pixel-art
      scaling filters. The upstream README describes hqx as a fast, high-quality
      magnification filter designed for pixel art.
  timeline:
    - '2001-2002: Archived HiEnd3D hq2x material carries Maxim Stepin copyright dates.'
    - >
      1.0: The grom358 NEWS file records 24-bit color support, the DevIL-based
      command-line tool, and autotools build support.
    - '1.2: Homebrew packages the grom358 hqx implementation as version 1.2.'
  usage:
    - >
      The documented CLI usage is `hqx -s scaleBy input output`, where the scale is 2,
      3, or 4. The library API exposes functions such as `hq4x_32` after `hqxInit()`,
      allowing applications to scale RGB bitmaps directly.
    - >
      The filter is intended for images with sharp edges, such as pixel art, line
      graphics, and cartoon sprites, rather than photographs.
related-packages:
  - id: brew:scale2x
    reason: >
      Choose Scale2x for a simpler real-time pixel-art enlargement effect, while hqx
      offers its distinct neighborhood-based hq2x, hq3x, and hq4x filtering approach.
    rel: alternative
    sources:
      - https://github.com/grom358/hqx
      - https://www.scale2x.it/
