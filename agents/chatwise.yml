history:
  adoption-history:
    - >
      ChatWise targets users who want one desktop interface for several model providers.
      Its support for bring-your-own API keys, existing AI subscriptions, local models,
      web search, and MCP tools has made it particularly relevant to developers and AI
      power users.
  package-nerd-significance:
    - >
      ChatWise represents the provider-neutral desktop AI-client category: users can
      change model vendors without changing their primary chat interface. Local
      conversation storage, custom OpenAI- or Anthropic-compatible providers, deep
      links, and MCP integration make it more configurable than a simple hosted-chat
      wrapper.
  project-history:
    - >
      ChatWise was developed as a fast, privacy-oriented desktop chatbot capable of
      using models from providers such as OpenAI, Anthropic, Google, and local or
      compatible services. The project distributes binaries and tracks releases through
      its official GitHub release repository while maintaining product documentation on
      a dedicated domain.
    - >
      The product subsequently expanded beyond basic chat with multimodal input, web
      search, artifacts, reusable assistants, custom providers, MCP tools, and a preview
      agent mode.
  related-projects:
    - Model Context Protocol (MCP), whose servers ChatWise can use as tools.
    - >
      OpenAI-compatible and Anthropic-compatible APIs, which ChatWise supports through
      custom providers.
    - >
      GitHub Copilot, whose subscriptions can be used through ChatWise's documented
      integration.
  sources:
    - 'Official MCP documentation: https://docs.chatwise.app/tools'
    - 'Official agent-mode documentation: https://docs.chatwise.app/agent'
    - 'Official documentation: https://docs.chatwise.app/'
    - 'Official homepage: https://chatwise.app/'
    - 'Official release repository: https://github.com/egoist/chatwise-releases'
  summary:
    - >
      ChatWise is a cross-provider desktop AI chat client focused on speed, local data
      storage, and user choice of model or subscription. Its package-manager appeal
      comes from combining a native desktop installation with power-user integrations
      such as custom providers, URL schemes, web search, and MCP.
  timeline:
    - '2025-03-16: MCP tool support was introduced in ChatWise 0.8.'
    - '2026: The product moved to its date-based v26 release line.'
    - >
      2026: Agent mode added built-in file and shell tools, skills, memory, and subagent
      support in preview.
  usage:
    - >
      Users configure providers or sign into supported subscriptions, select a model,
      and use ChatWise for conversational work with text, images, PDFs, audio, and other
      files.
    - >
      Power users can add compatible API endpoints, configure search providers, invoke
      chats through the chatwise:// URL scheme, and attach local or remote MCP servers.
      API keys are entered through the settings interface; the official documentation
      does not publish a credentials-file path.
