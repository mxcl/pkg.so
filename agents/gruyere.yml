id: brew:gruyere
display-name: Gruyere
repo: https://github.com/savannahostrowski/gruyere
docs:
  - https://github.com/savannahostrowski/gruyere#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is packaged for Homebrew and installable through Python tool
      installers such as uv tool, pipx, and pip according to the README. Adoption
      evidence is therefore limited but fits a familiar developer-tool niche: quickly
      freeing a port during local development.
  package-nerd-significance:
    - >
      Gruyere is package-manager interesting mainly as a tiny TUI wrapper around
      operating-system process and port inspection. It packages a recurring shell
      workflow into one command while leaving permissions and platform differences
      visible to users.
  project-history:
    - >
      The GitHub repository was created in February 2023. Its public release stream
      begins with v0.0.3 in October 2025 and reaches v0.1.0 in November 2025, indicating
      a young, focused utility rather than a long-lived ecosystem project.
  related-projects:
    - pipx and uv tool are documented installation paths for isolated Python CLI use.
    - >
      lsof, ss, netstat, and platform process tools are adjacent lower-level tools in
      the same troubleshooting workflow.
  sources:
    - https://api.github.com/repos/savannahostrowski/gruyere
    - https://api.github.com/repos/savannahostrowski/gruyere/releases?per_page=50
    - https://github.com/savannahostrowski/gruyere
  summary:
    - >
      Gruyere is a small Python terminal UI for viewing and killing processes listening
      on ports. Its README positions it as a prettier interactive alternative to
      manually combining port-inspection commands with process termination.
  timeline:
    - '2023: GitHub repository created.'
    - '2025: v0.0.3 release published.'
    - '2025: v0.1.0 release published.'
  usage:
    - >
      Users run `gruyere` to list listening processes, filter by port or user, inspect
      details, navigate with arrow or vim-style keys, and kill a selected process after
      confirmation. On macOS, the README notes that elevated privileges may be needed
      for system-wide process visibility.
related-packages:
  - id: brew:lsof
    reason: >
      Choose lsof when you need a scriptable, noninteractive way to identify the process
      owning a listening socket; Gruyère adds an interactive filtered TUI and confirmed
      process termination to that troubleshooting workflow.
    rel: alternative
    sources:
      - https://github.com/savannahostrowski/gruyere
      - https://github.com/lsof-org/lsof/blob/master/docs/tutorial.md
      - https://github.com/lsof-org/lsof/blob/master/docs/manpage.md
