id: brew:curlftpfs
display-name: CurlFtpFS
repo: https://sourceforge.net/p/curlftpfs/code
docs:
  - https://curlftpfs.sourceforge.net/
config-file-location:
  unix:
    - /etc/fstab
credentials-file-location:
  unix:
    - ~/.netrc
history:
  adoption-history:
    - >
      CurlFtpFS occupied the practical Unix niche between command-line FTP clients and
      full file synchronization tools: it let users mount an FTP server and then use
      ordinary tools such as ls, cd, cp, mv, and editors. SourceForge's file browser
      shows the 0.9.2 tarball line under the project's downloads, and the supplied
      package-manager facts show continued packaging across Homebrew, Debian, Fedora,
      Arch, MacPorts, and Alpine-like ecosystems.
  package-nerd-significance:
    - >
      CurlFtpFS is package-nerd relevant because it combines three packaging-sensitive
      layers: FUSE integration, libcurl feature support, and mount-helper behavior. It
      also represents a once-common era of packaging small FUSE filesystems for network
      protocols before cloud object stores and WebDAV/SFTP workflows displaced many FTP
      use cases.
  project-history:
    - >
      The official project page describes CurlFtpFS as a filesystem for accessing FTP
      hosts based on FUSE and libcurl. SourceForge lists the project as registered in
      2006, alpha status, GPLv2 licensed, and brought by the user braga.
  related-projects:
    - >
      FUSE, libcurl, sshfs, lftpfs, and other FTPFS-style filesystems are the closest
      related packaging neighbors.
  sources:
    - https://curlftpfs.sourceforge.net/
    - https://sourceforge.net/projects/curlftpfs/
    - https://sourceforge.net/p/curlftpfs/code/
    - https://sourceforge.net/projects/curlftpfs/files/
  summary:
    - >
      CurlFtpFS is a FUSE filesystem that mounts FTP servers as local directories while
      delegating transfer behavior to libcurl.
  timeline:
    - '2006: Project registered on SourceForge.'
    - '2008: SourceForge file listing shows the curlftpfs download tree modified on 2008-05-28.'
    - '2013: SourceForge summary records the last project update as 2013-05-02.'
  usage:
    - >
      The official site demonstrates creating a mount point, mounting an FTP URL with
      curlftpfs, and then browsing the remote tree with shell commands. It highlights
      SSL/TLS support, tunneling HTTP proxies, reconnecting after server timeouts, and
      rewriting absolute symlinks back into the FTP filesystem.
related-packages:
  - id: brew:curl
    reason: >
      curl supplies the libcurl FTP transfer engine on which CurlFtpFS is based and is
      useful for testing the same server outside the FUSE mount.
    rel: adjacent_workflow
    sources:
      - https://curlftpfs.sourceforge.net/
      - https://curl.se/docs/faq.html
  - id: brew:sshfs
    reason: >
      Choose SSHFS when the remote host offers SSH/SFTP instead of FTP; it provides the
      same mount-and-use-filesystem workflow over SSH's encrypted file-transfer
      protocol.
    rel: alternative
    sources:
      - https://curlftpfs.sourceforge.net/
      - https://github.com/libfuse/sshfs
