history:
  adoption-history:
    - >
      Mia has been distributed both independently and through the Mac App Store, while
      Homebrew Cask offers package-manager installation of the standalone build. The
      official site positions it as a replacement for Google's discontinued Gmail
      notifier.
  package-nerd-significance:
    - >
      Mia represents the long-running class of focused macOS menu-bar utilities that
      wrap a web service with native notifications and quick actions. Its Homebrew Cask
      availability makes the independently distributed edition straightforward to
      install alongside other managed desktop tools.
  project-history:
    - >
      Sovapps has developed Mia for Gmail as a native macOS menu-bar Gmail client since
      at least 2015. The application evolved beyond notification into reading,
      composing, searching, labeling, archiving, deleting, and spam-management workflows
      through Gmail's APIs.
  related-projects:
    - Mia integrates with Gmail through the official Gmail API and OAuth 2.0.
    - The product is presented as a successor in purpose to the discontinued Google Notifier.
  sources:
    - 'Official help and privacy page: https://www.miaforgmail.com/help'
    - 'Official product site: https://www.miaforgmail.com/'
    - source_facts.package-manager
  summary:
    - >
      Mia for Gmail is a macOS menu-bar email client and notifier for Gmail, developed
      by Sovapps and distributed in standalone and Mac App Store editions.
  timeline:
    - '2015: The official site states a Sovapps copyright beginning in 2015.'
    - '2026: The official site continued distributing a universal macOS standalone release.'
  usage:
    - >
      Users add an email address in Preferences > Accounts and complete Google's OAuth
      2.0 authorization flow. Mia then provides inbox notifications, message previews,
      reading and composition, labels, archive/delete/spam actions, and browser
      shortcuts from the menu bar. Search and multiple-account support are premium
      features.
