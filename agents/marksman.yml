id: brew:marksman
display-name: Marksman
repo: null
docs:
  - https://github.com/artempyanykh/marksman#readme
config-file-location:
  linux:
    - ~/.config/marksman/config.toml
    - .marksman.toml
  macos:
    - ~/Library/Application Support/marksman/config.toml
    - .marksman.toml
  windows:
    - $HOME\AppData\Roaming\marksman\config.toml
    - .marksman.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      By 2026-07-01 the repository reported 3,243 stars and 65 forks. The supplied
      package-manager facts list Homebrew, MacPorts, Nix, Arch, Scoop, and Winget, which
      is broad for a Markdown-specific language server.
    - >
      Marksman's README documents integrations or support paths for VS Code, Vim,
      Neovim, Emacs, Helix, Sublime Text, BBEdit, Zed, and other LSP-capable editors.
      That breadth is the main adoption story: it is not tied to a single editor
      extension.
  package-nerd-significance:
    - >
      Marksman is notable because it treats Markdown as a language server target rather
      than a loose text format. In package-manager terms, it is a small standalone
      binary that unlocks editor features across many clients, which explains its
      presence in both Unix and Windows package ecosystems.
  project-history:
    - >
      The Marksman repository was created on 2021-03-06. Its README frames the project
      as a generic LSP server for Markdown, providing completion, goto definition,
      references, rename refactoring, diagnostics, and wiki-link support.
    - >
      The project is implemented in F# and distributed as self-contained binaries for
      macOS, Linux, and Windows. That distribution model made it easier for many editors
      to integrate Marksman without requiring users to build a runtime-specific
      toolchain.
  related-projects:
    - >
      Marksman complements editor LSP clients and Markdown editor extensions such as
      Marksman VSCode and Markdown Memo.
    - >
      It is related to note-taking workflows that use wiki links and Zettelkasten-style
      cross references.
  sources:
    - https://github.com/artempyanykh/marksman
    - https://raw.githubusercontent.com/artempyanykh/marksman/main/README.md
    - https://raw.githubusercontent.com/artempyanykh/marksman/main/docs/configuration.md
    - source_facts.repo
  summary:
    - >
      Marksman is an open-source Markdown language server that brings code-assist style
      editor features to prose, notes, and documentation projects.
  timeline:
    - '2021: GitHub repository created.'
    - '2025: Release notes added contributors and editor/configuration updates.'
    - >
      2026: Latest observed release tag was 2026-02-08, with platform binaries for
      Linux, macOS, and Windows.
  usage:
    - >
      Users install the marksman binary and configure an editor's LSP client to run it
      for Markdown files. For linked-note and documentation repositories, it adds
      cross-file navigation, completions, reference lookup, diagnostics, and wiki-link
      behavior.
    - >
      Marksman reads project-level configuration from .marksman.toml at the project root
      and user-level TOML files under OS-specific config directories. Project
      configuration takes precedence over user configuration.
related-packages:
  - id: brew:markdown-oxide
    reason: >
      Choose markdown-oxide when you want a Markdown LSP centered on personal knowledge
      management with backlinks, daily notes, tags, and explicit Obsidian compatibility;
      choose Marksman for its focused link intelligence and documented breadth of editor
      integrations.
    rel: alternative
    sources:
      - https://oxide.md/
      - https://github.com/artempyanykh/marksman#readme
