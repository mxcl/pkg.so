history:
  adoption-history:
    - >
      The Chinese edition is integrated with Tencent's office ecosystem and is
      documented for personal and enterprise accounts. Official materials describe links
      to Tencent Docs, QQ Mail, Tencent Meeting, WeCom, WeChat, and other collaboration
      channels.
    - >
      Official documentation also presents WorkBuddy through desktop, mobile,
      mini-program, bot, and enterprise-agent surfaces, indicating expansion beyond a
      single desktop chat client. No unsupported user-count estimate is included.
  package-nerd-significance:
    - >
      WorkBuddy is representative of packaged desktop AI agents that combine model
      selection, reusable skills, local filesystem operations, connectors, automation,
      and remote bot interfaces in one workstation.
    - >
      Its custom-model configuration is noteworthy because API keys can be stored in a
      local JSON file. Package users should therefore back up or synchronize that file
      only with credential-appropriate protections.
  project-history:
    - >
      Tencent developed WorkBuddy as an AI office workstation capable of planning and
      executing complete tasks rather than only returning chat responses. Its Chinese
      distribution emphasizes integration with Tencent's productivity and messaging
      ecosystem.
    - >
      The official changelog records a graphical custom-model configuration interface in
      version 4.7.0 in March 2026. Version 5.1.0 in June 2026 expanded project,
      cloud-assistant, security, model-plan, and bot-related capabilities and added hot
      reloading for `models.json`.
  related-projects:
    - >
      Tencent CodeBuddy uses the same `.codebuddy` configuration family and supplies
      coding-oriented capabilities within Tencent's broader AI-assistant ecosystem.
  sources:
    - https://www.workbuddy.cn/
    - https://www.workbuddy.cn/docs/workbuddy/Changelog
    - https://www.workbuddy.cn/docs/workbuddy/FirstTask
    - >
      https://www.workbuddy.cn/docs/workbuddy/From-Beginner-to-Expert-Guide/Function-Description/Model
    - https://www.workbuddy.cn/docs/workbuddy/Overview
  summary:
    - >
      WorkBuddy is Tencent's Chinese-market AI office workstation. It accepts
      natural-language assignments, plans and executes multi-step work, manipulates
      authorized local files, and produces documents, spreadsheets, presentations,
      analysis, research, and other deliverables.
  timeline:
    - '2026-03-25: Version 4.7.0 introduced graphical custom-model configuration.'
    - >
      2026-06-13: Version 5.1.0 added broader project, model, security, bot, and
      cloud-assistant capabilities.
  usage:
    - >
      Users sign in through the Chinese service, create a task, describe the desired
      result, optionally provide a workspace and source files, and inspect generated
      artifacts in the results area.
    - >
      The application can use built-in or user-supplied language models, perform batch
      file operations, create office documents, conduct research, analyze data, and
      connect to Tencent and third-party communication services.
    - >
      Official model documentation says locally configured provider parameters,
      including API keys, are stored in `models.json` and are not uploaded to
      WorkBuddy's cloud service.
