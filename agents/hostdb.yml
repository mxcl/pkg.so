id: brew:hostdb
display-name: HostDB
repo: https://code.google.com/archive/p/hostdb/source
docs:
  - https://code.google.com/archive/p/hostdb
config-file-location:
  unix:
    - hostlist.txt
credentials-file-location: null
history:
  adoption-history:
    - >
      HostDB's adoption appears to be mostly historical and system-administrator
      oriented. Its Google Code archive and Homebrew formula preserve it for users who
      want the original toolchain or need to inspect an older text-driven
      network-configuration workflow.
  package-nerd-significance:
    - >
      HostDB is a preserved sysadmin artifact: small scripts, text files, and generated
      network configuration. For package nerds, it marks an older branch of
      infrastructure automation that sits between hand-edited zone files and heavyweight
      IPAM/configuration-management systems.
  project-history:
    - >
      The archived project and bundled documentation identify HostDB as a complete
      system rather than a single script. The source archive includes generators such as
      `mkzones`, `mknamedconf`, `zone2hostdb`, `genrange`, comparison helpers, example
      configurations, and a `hostdb.txt` data model.
    - >
      The LISA 2005 paper by Thomas Limoncelli describes HostDB as a system for
      generating DNS zone files, BIND configurations, and ISC DHCP server
      configurations. It emphasizes simplicity: no SQL database or web server, just text
      input, generation scripts, and deployable output.
  related-projects:
    - BIND/named and ISC DHCP are the generated configuration targets.
    - >
      IPAM and configuration-management tools are related by problem domain, although
      HostDB deliberately uses a simpler text-file model.
    - Google Code Archive is related as the preservation surface for the project.
  sources:
    - >
      Google Code Archive and source archive: project files, README, docs, examples, and
      executables.
    - 'Homebrew input metadata: package description and executable list.'
    - 'USENIX LISA 2005 paper: original system description and design rationale.'
  summary:
    - >
      HostDB is a DNS and DHCP generation system built around a plain-text host
      database. The project predates modern infrastructure-as-code branding but follows
      the same practical idea: keep host data in a readable source file, generate BIND
      zone files and ISC DHCP configuration, and deploy generated artifacts repeatably.
  timeline:
    - '2005: HostDB is presented in a LISA paper focused on host-to-DNS/DHCP generation.'
    - >
      2016: Google Code archive source snapshot preserves README, docs, scripts,
      examples, and the LISA paper.
    - 'Homebrew era: A formula packages HostDB as a command-line DNS/DHCP generation tool.'
  usage:
    - >
      A HostDB workflow starts from a host database text file and supporting
      zone/destination configuration. The packaged executables generate zones, named
      configuration, DHCP output, root-cache checks, and conversion helpers, with
      examples included in the source archive.
    - >
      The package is most relevant in environments where DNS/DHCP data should be
      generated from source-controlled text, but where running a database-backed IPAM
      system would be excessive.
related-packages:
  - id: brew:bind
    reason: >
      HostDB generates BIND zone and named configuration files, while BIND 9 serves and
      validates the resulting DNS configuration.
    rel: adjacent_workflow
    sources:
      - >
        https://www.usenix.org/conference/lisa-05/hostdb-best-damn-host2dnsdhcp-script-ever-written
      - https://www.isc.org/bind/
