config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      XMLStarlet spread because it matched the way Unix users already handled text: one
      executable, composable subcommands, stdin/stdout behavior, and concise XPath/XSLT
      operations. Early SourceForge news called out a FreeBSD port in 2004 and Windows
      builds, showing that adoption was not limited to one Unix family.
  package-nerd-significance:
    - >
      XMLStarlet is one of the few XML tools that feels native in a pipeline. For
      package nerds, it is the dependable answer to 'jq, but for XML before jq existed':
      small enough to install everywhere, powerful enough for metadata rewrites, and old
      enough to appear in build scripts, distro tooling, and release automation.
  project-history:
    - >
      The SourceForge news archive records the first XMLStarlet release in May 2003,
      describing a C program using GNOME's libxml2 and libxslt to query, check,
      transform, search, and edit XML documents. The 0.1.0 announcement a few days later
      stated the project's goal as creating a command-line XML toolkit for shell prompts
      and automated processing.
    - >
      Early releases moved quickly through 2003 and 2004, including validation fixes,
      Relax NG support, Windows availability, HP-UX binaries, and a FreeBSD port.
      Version 1.0.0 was announced in January 2005, and later distribution files show the
      1.6.1 source release in 2014.
    - >
      The project homepage later noted that development had stalled and asked for help
      with maintenance, bug fixes, and Windows packaging. That maintenance note is part
      of the package's history: XMLStarlet became stable infrastructure, with far more
      downstream script value than upstream churn.
  related-projects:
    - >
      Related projects and technologies include libxml2, libxslt, xsltproc, xmllint,
      XPath, XSLT, EXSLT, Relax NG, XML canonicalization, DocBook, and shell text tools
      such as grep, sed, awk, diff, and patch.
  sources:
    - https://sourceforge.net/p/xmlstar/news/
    - https://sourceforge.net/projects/xmlstar/files/
    - https://xmlstar.sourceforge.net/
    - https://xmlstar.sourceforge.net/doc/UG/ch01.html
    - https://xmlstar.sourceforge.net/doc/UG/xmlstarlet-ug.html
  summary:
    - >
      XMLStarlet is the classic Unix-shell XML toolkit: query, transform, validate,
      edit, format, canonicalize, and inspect XML from a single command-line interface.
      It was explicitly framed as doing for XML what grep, sed, awk, diff, patch, and
      related tools do for plain text.
  timeline:
    - '2003-05-07: SourceForge announced the first XMLStarlet release and project site updates.'
    - '2003-05-11: XMLStarlet 0.1.0 was released with the command-line XML toolkit goal.'
    - '2004-07-01: The project announced that the FreeBSD port was ready.'
    - '2005-01-29: XMLStarlet 1.0.0 was released.'
    - '2014-08-09: SourceForge files list xmlstarlet-1.6.1 as the latest source release.'
  usage:
    - >
      Common uses include XPath extraction with xml sel, in-place-like XML editing with
      xml ed, XSLT transformation with xml tr, validation against DTD, XSD, or Relax NG
      with xml val, pretty-printing with xml fo, canonicalization with xml c14n,
      escaping text, listing element structure, and turning directory listings into XML.
    - >
      The user guide emphasizes that the select command generates and applies XSLT from
      command-line templates, which lets shell scripts perform structured XML queries
      without writing a separate stylesheet.
related-packages:
  - id: brew:libxml2
    reason: >
      Choose libxml2's xmllint when you mainly need low-level XML parsing, validation,
      formatting, or XPath inspection; XMLStarlet provides a broader shell-oriented
      editing and transformation interface built on libxml2.
    rel: alternative
    sources:
      - https://xmlstar.sourceforge.net/doc/UG/xmlstarlet-ug.html
      - https://gnome.pages.gitlab.gnome.org/libxml2/xmllint.html
  - id: brew:libxslt
    reason: >
      libxslt is the transformation engine beneath XMLStarlet, and its xsltproc utility
      is a useful adjacent tool when a workflow centers on applying complete XSLT
      stylesheets rather than composing XMLStarlet subcommands.
    rel: adjacent_workflow
    sources:
      - https://xmlstar.sourceforge.net/doc/UG/xmlstarlet-ug.html
      - https://gnome.pages.gitlab.gnome.org/libxslt/xsltproc.html
