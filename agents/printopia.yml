history:
  adoption-history:
    - >
      Printopia filled a practical gap for households and small offices with working
      Mac-connected printers that lacked native AirPrint support. Client devices use
      their built-in printing interface, so deployment does not require an app on each
      iPhone or iPad.
    - >
      Decisive Tactics took over sales and support from Ecamm in March 2015. Printopia 3
      later changed the product from a System Preferences pane into a standalone
      application while retaining an always-running background service.
  package-nerd-significance:
    - >
      Printopia represents a class of Mac utilities that package system integration and
      a background network service behind a small graphical application. For package
      users, its transition from a preference pane to an app explains why older removal
      and troubleshooting instructions differ from current ones.
  project-history:
    - >
      Printopia was originally developed and sold by Ecamm as a way to expose printers
      connected to a Mac through Apple's AirPrint workflow. Decisive Tactics assumed
      ownership, sales, and support in 2015.
    - >
      Printopia 3, released in 2017, became a standalone app, added printing when nobody
      was logged in, secured document transport, simplified access controls, and
      supported stored credentials for protected printers and print servers.
  related-projects:
    - Printopia Pro
    - Apple AirPrint
  sources:
    - https://www.decisivetactics.com/about/
    - https://www.decisivetactics.com/products/printopia/doc/Printopia-Quick-Start.pdf
    - https://www.decisivetactics.com/products/printopia/release-notes
    - https://www.decisivetactics.com/support/view?article=printopia-troubleshooting-guide
  summary:
    - >
      Printopia is a macOS printer-sharing utility that makes printers configured on a
      Mac available to AirPrint-capable iPhone, iPad, and Mac clients. It can also turn
      incoming print jobs into PDF or image files on the host Mac.
  timeline:
    - '2015: Decisive Tactics took over Printopia sales and support from Ecamm.'
    - >
      2017: Printopia 3 moved from System Preferences to a standalone app and introduced
      an always-on background service.
    - '2023: Printopia 3.0.23 delivered printing fixes and maintenance updates.'
  usage:
    - >
      Users enable printers or Send to Mac destinations in Printopia, then print from
      the standard interface on an iPhone, iPad, or Mac. Printopia runs its sharing
      service in the background even when its application window is closed.
