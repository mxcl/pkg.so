id: brew:adns
display-name: GNU adns
repo: https://www.chiark.greenend.org.uk/ucgi/~ianmdlvl/git/adns.git
docs:
  - https://www.chiark.greenend.org.uk/~ian/adns/docs/adns.h.txt
  - https://www.chiark.greenend.org.uk/~ian/adns/docs/adnshost.txt
  - https://www.chiark.greenend.org.uk/~ian/adns
config-file-location:
  unix:
    - /etc/resolv.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      adns became a GNU-distributed resolver component with both library and scriptable
      CLI use cases. The supplied package metadata shows broad packaging under Homebrew,
      Debian/Ubuntu adns-tools, Fedora/DNF, MacPorts, Nix, Arch/pacman, and openSUSE
      zypper.
    - >
      The homepage lists ecosystem bindings and integrations, including Python bindings,
      liboop event-loop support, and an MS Visual Studio C++ port. That adoption pattern
      is very Unix-library-like: one C API, a few small command-line tools, and
      integrations by event loops and language bindings.
  package-nerd-significance:
    - >
      adns is package-nerd interesting because it is a classic Unix networking library
      packaged alongside small utilities, with GNU distribution, long-running release
      tarballs, and distro-specific binary splits. It also documents the resolver
      boundary clearly: it is a stub resolver and expects a real recursive nameserver on
      the same system or a secure nearby network.
  project-history:
    - >
      The official homepage describes adns as an advanced, easy-to-use DNS client
      library and utilities collection. It contrasts adns with gethostbyname and
      libresolv by emphasizing asynchronous operation, multiple simultaneous queries,
      decoded response structures, sanity checking, explicit resolver state, and
      conventional resolv.conf support.
    - >
      The official previous-versions directory shows public release tarballs starting
      with adns 0.1 in April 1999, progressing through 1.0 in 2000, 1.5.x in the 2010s,
      and 1.6.x releases in the 2020s. The homepage also points to a master git
      repository browser and notes that adns is available from GNU Project FTP servers
      and mirrors.
  related-projects:
    - GNU FTP distribution and mirrors are linked by the homepage.
    - liboop is listed as having a built-in adns binding.
    - Python bindings and a Visual Studio C++ port are listed as related projects.
  sources:
    - https://www.chiark.greenend.org.uk/~ian/adns/
    - https://www.chiark.greenend.org.uk/~ian/adns/docs/adns.h.txt
    - https://www.chiark.greenend.org.uk/~ian/adns/docs/adnshost.txt
    - https://www.chiark.greenend.org.uk/~ian/adns/ftp/
    - source_facts.package-manager
  summary:
    - >
      GNU adns is Ian Jackson's asynchronous-capable DNS resolver library for C and C++
      programs, accompanied by command-line resolver utilities. It offers a nonblocking
      resolver API and utility programs such as adnshost, adnslogres, and adnsresfilter.
  timeline:
    - '1999-04: adns 0.1 tarball appears in the official previous-versions directory.'
    - '2000-09: adns 1.0 tarball appears in the official previous-versions directory.'
    - '2014-11: adns 1.5.0 tarball appears after the long 1.4 era.'
    - '2020-06: adns 1.6.0 tarball appears.'
    - '2026-05: adns 1.6.2 tarball appears in the official previous-versions directory.'
  usage:
    - >
      C and C++ programs use adns when they need DNS lookups without blocking on one
      resolver call at a time. The library can process many queries simultaneously,
      return decoded records, distinguish failure causes, and use or override
      conventional resolver configuration.
    - >
      Shell and scripting users get adnshost for DNS lookups, adnslogres as a faster
      Apache logresolv-style tool, and adnsresfilter for replacing IP addresses in
      streamed command output without delaying the stream unnecessarily.
related-packages:
  - id: brew:c-ares
    reason: >
      Choose c-ares for an asynchronous C resolver with a permissive license and
      explicit portability to proprietary applications; its official comparison
      identifies adns as the GPL alternative.
    rel: alternative
    sources:
      - https://c-ares.org/why.html
      - https://c-ares.org/docs.html
      - https://www.chiark.greenend.org.uk/~ian/adns/
  - id: brew:getdns
    reason: >
      Choose getdns when the application needs a higher-level asynchronous API with
      first-class DNSSEC, arbitrary record types, and event-loop integration.
    rel: alternative
    sources:
      - https://getdnsapi.net/documentation/spec/
      - https://getdnsapi.net/documentation/readme/
      - https://www.chiark.greenend.org.uk/~ian/adns/
