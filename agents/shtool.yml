history:
  adoption-history:
    - >
      GNU shtool was designed to be included in other free-software source trees, where
      it could replace assorted nonportable helper scripts. Official GNU release
      archives preserve a succession of 1.x and 2.x releases, while the input records
      packages in Homebrew, Debian, and Ubuntu.
  package-nerd-significance:
    - >
      shtool captures an older source-distribution strategy: vendoring one generated,
      portable shell tool so a package can build on heterogeneous Unix systems without
      assuming that every host has compatible install, mkdir, echo, or related commands.
  project-history:
    - >
      Ralf S. Engelschall assembled GNU shtool from small, stable shell scripts already
      used across free-software projects. The official page carries copyright from 1994
      and identifies release 2.0.8, dated 18 July 2008.
  related-projects:
    - >
      GNU Autoconf addresses related portability concerns at configuration time. shtool
      instead compiles portable helper operations into a shell program intended for
      inclusion in a project's source tree.
  sources:
    - 'Official GNU project page: https://www.gnu.org/software/shtool/'
    - 'Official GNU release archive: https://ftp.gnu.org/gnu/shtool/'
    - 'Official manual: https://www.gnu.org/software/shtool/shtool.html'
    - 'Package availability: source_facts.package-manager.'
  summary:
    - >
      GNU shtool is a collection of stable, portable shell-script functions compiled
      into a single tool for use inside software source trees, especially during build
      and installation.
  timeline:
    - '1994: Beginning of the copyright period shown on the official GNU page.'
    - '1999: GNU archive records the 1.3.x and 1.4.x release series.'
    - '2004: GNU archive records the 2.0.0 release.'
    - '2008: GNU shtool 2.0.8 released on 18 July.'
  usage:
    - >
      Projects can generate or include shtool and call its portable replacements for
      operations such as directory creation, installation, and output handling.
      shtoolize supports incorporating the tool into a source tree.
