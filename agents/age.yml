history:
  adoption-history:
    - >
      age became widely packaged for a security CLI. The upstream README lists
      installation commands for Homebrew, MacPorts, winget, Alpine, Arch, Debian,
      Fedora, Gentoo, Guix, Nix, openSUSE, Ubuntu, Void, FreeBSD, OpenBSD, Chocolatey,
      and Scoop, and it asks new packagers for help. The supplied package metadata also
      records major Linux and Windows package-manager names.
    - >
      The ecosystem around age includes plugins, alternate implementations,
      browser/TypeScript work, Passage, and an awesome-age list. That adoption pattern
      is important: age is not just a command named by package managers, but a small
      format other tools embed.
  package-nerd-significance:
    - >
      age is the package-manager-friendly successor-shaped tool many users wanted for
      file encryption: one small CLI, readable key files, no daemon, no keyring
      requirement, and simple static-ish binary distribution. Its packaging matrix and
      plugin convention make it a useful case study in how a security format gets from a
      GitHub repo to distro repositories and operator scripts.
    - >
      For package nerds, the interesting bit is that age's minimalism is a distribution
      feature. The same project is a Go module, a command-line binary, a file format
      specification, and an ecosystem anchor for Rust, TypeScript, YubiKey, Secure
      Enclave, and password-manager integrations.
  project-history:
    - >
      age was designed by Ben Cartwright-Cox and Filippo Valsorda and the public
      repository was created in May 2019. The README describes it as a simple, modern,
      secure file encryption tool, format, and Go library with small explicit keys,
      post-quantum support, no config options, and Unix-style composability.
    - >
      The first beta releases appeared in December 2019, including a beta named from the
      floor of 36C3. Release candidates followed in 2021, and age v1.0.0 was published
      in September 2021. The 1.1.0 release in December 2022 added plugin and YubiKey
      support, helping turn age from a single CLI into a format with a hardware and
      plugin ecosystem.
    - >
      The project continued with v1.2.x in 2024 and v1.3.x in December 2025. The v1.3.0
      release was explicitly described upstream as a post-quantum release, matching the
      README's current positioning of age as a format and tool with post-quantum
      support.
  related-projects:
    - rage is the alternative interoperable Rust implementation named by the age README.
    - typage is the TypeScript implementation named by the age README.
    - age-plugin-yubikey provides hardware PIV token support.
    - age-plugin-se provides Apple Secure Enclave support.
    - awesome-age collects plugins, implementations, tools, and integrations.
  sources:
    - official GitHub releases API
    - official GitHub repository metadata
    - official age specification and man page
    - source_facts.package-manager
    - upstream README
  summary:
    - >
      age is a modern file-encryption tool, file format, and Go library designed around
      small explicit keys, Unix-style composability, and a deliberately small option
      surface.
  timeline:
    - '2019: GitHub repository created.'
    - '2019: First beta releases published.'
    - '2021: v1.0.0 released.'
    - '2022: v1.1.0 released with plugin and YubiKey support.'
    - '2024: v1.2.x releases published.'
    - '2025: v1.3.0 released with post-quantum support.'
  usage:
    - >
      The canonical CLI flow is `age-keygen -o key.txt`, encryption with `age -r
      RECIPIENT`, and decryption with `age --decrypt -i key.txt`. The README documents
      recipient files, identity files, passphrase encryption, SSH public keys as
      recipients, and stdin/stdout friendly operation for shell pipelines.
    - >
      age has intentionally no global config file documented by upstream. Instead, users
      pass identity and recipient files explicitly, which is part of its packaging
      appeal: the installed binary is portable, scriptable, and easy to compose with
      tar, password managers, backups, and deployment tooling.
related-packages:
  - id: brew:rage
    reason: >
      Choose rage for an interoperable Rust implementation of the age format with a
      compatible Unix-style CLI and Rust library ecosystem.
    rel: alternative
    sources:
      - https://github.com/FiloSottile/age#readme
      - https://github.com/str4d/rage#readme
  - id: brew:age-plugin-yubikey
    reason: >
      Add age-plugin-yubikey when age identities should be backed by a YubiKey or
      compatible PIV hardware token instead of an ordinary software key.
    rel: adjacent_workflow
    sources:
      - https://github.com/FiloSottile/age#readme
      - https://github.com/str4d/age-plugin-yubikey#readme
  - id: brew:age-plugin-se
    reason: >
      Add age-plugin-se when decryption keys should be bound to an Apple Secure Enclave
      and authorized through macOS biometric or passcode controls.
    rel: adjacent_workflow
    sources:
      - https://github.com/FiloSottile/awesome-age
      - https://github.com/remko/age-plugin-se#readme
