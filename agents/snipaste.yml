history:
  adoption-history:
    - >
      Snipaste began as a Windows utility and progressively broadened its platform
      reach: a public macOS beta appeared in December 2017, and the first Linux release
      arrived in December 2023. Stable version 2 releases for Windows, macOS, and Linux
      were declared in September 2024.
    - >
      The project adopted a mixed licensing model: it remains free for personal use,
      while Snipaste 2 requires a Pro license for business use. Its long official
      changelog documents sustained releases from 2016 onward.
  package-nerd-significance:
    - >
      Snipaste popularized a compact capture-and-pin workflow: F1 begins a snip and F3
      places an image back on the desktop as a floating window. The combination is
      particularly useful for programmers, designers, testers, and documentation authors
      comparing visual references while working.
    - >
      It is also notable as a portable, highly configurable desktop utility with
      command-line capture support, cross-platform packages, image history, and an
      unusually detailed official release record.
  project-history:
    - >
      Snipaste's first public version was released for Windows in July 2016. Early
      releases rapidly added quick-save folders, image-window grouping, automatic
      updates, command-line options, history controls, and a dedicated documentation
      site.
    - >
      Version 2.0 arrived in July 2018 with the Pro offering and an updated
      personal-versus-business licensing model. Later releases expanded annotations,
      automation, QR and barcode features, Wayland support, ARM64 Windows support, OCR,
      and cross-platform desktop stability.
  related-projects:
    - >
      Snipaste's official translation repository is hosted at
      https://github.com/Snipaste/translations, but it is not the source repository for
      the application itself.
    - The Microsoft Store is an alternative official distribution channel on Windows.
    - The Linux edition supports AppImage distribution and modern Wayland desktops.
  sources:
    - 'Official FAQ: https://www.snipaste.com/faq.html'
    - 'Official download page and full changelog: https://www.snipaste.com/download.html'
    - 'Official homepage: https://www.snipaste.com/'
    - 'Official manual: https://docs.snipaste.com/'
  summary:
    - >
      Snipaste is a cross-platform screenshot utility distinguished by its ability to
      pin captured images or clipboard content back onto the desktop as manipulable
      floating windows.
  timeline:
    - '2016-07-28: Snipaste 1.0 released.'
    - '2016-12-01: A dedicated documentation site was introduced.'
    - >
      2017-09-26: Snipaste became available through the Microsoft Store and added
      configurable configuration-file placement.
    - '2017-12-09: First public macOS release.'
    - '2018-07-18: Snipaste 2.0 and Pro became available.'
    - '2023-12-28: First Linux release.'
    - '2024-09-10: Stable version 2 builds were released across Windows, macOS, and Linux.'
    - '2025-12-08: Version 2.11 added OCR and expanded command-line capture controls.'
  usage:
    - >
      The basic workflow uses F1 to capture a region and F3 to pin an image or supported
      clipboard content as an always-on-top window. Pinned images can be zoomed,
      rotated, made translucent or click-through, grouped, edited, and sampled for
      colors.
    - >
      Annotation tools include shapes, arrows, freehand marks, text, mosaic, blur, and
      erasing. Advanced users can automate captures through command-line options and
      customize behavior through Preferences and config.ini.
    - >
      The official changelog says users can change the configuration-file location in
      Preferences, so no single portable path is asserted here.
