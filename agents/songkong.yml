id: cask:songkong
display-name: SongKong
repo: null
docs:
  - https://www.jthink.net/songkong/help/help.html
config-file-location:
  macos:
    - ~/Library/Preferences/SongKong
credentials-file-location:
  linux:
    - ~/.songkong/license.properties
  macos:
    - ~/Library/Preferences/SongKong/license.properties
  windows:
    - C:\Users\<username>\AppData\Roaming\SongKong\license.properties
history:
  adoption-history:
    - >
      SongKong is distributed for macOS, Windows, Linux, headless Linux, Docker, and
      music-server or NAS environments. Official installation material documents
      integrations for platforms such as Synology and Dela, broadening it beyond
      desktop-only tagging.
  package-nerd-significance:
    - >
      SongKong appeals to collectors maintaining large, carefully organized libraries
      because it combines MusicBrainz and Discogs matching, acoustic identification,
      deterministic rename masks, detailed reports, duplicate handling, and an undo
      database.
    - >
      Its desktop, command-line, headless, and container deployment options make the
      same metadata workflow usable on workstations, NAS devices, and dedicated music
      servers.
  project-history:
    - >
      SongKong was created by JThink as a companion product to Jaikoz. It applies
      related matching techniques while emphasizing automated, collection-scale
      operation and simpler workflows.
  related-projects:
    - Jaikoz
    - MusicBrainz
    - Discogs
    - AcoustID
  sources:
    - >
      https://community.jthink.net/t/how-do-i-move-songkong-configuration-to-a-different-computer/8754
    - https://www.jthink.net/songkong/download.jsp
    - https://www.jthink.net/songkong/help/help.html
    - https://www.jthink.net/songkong/install.jsp
  summary:
    - >
      SongKong is JThink's automated music metadata and file-organization application.
      It matches recordings and releases against online databases, updates embedded tags
      and artwork, renames files, detects duplicates, and records changes for later
      undo.
  timeline:
    - >
      2026: Official guidance documents platform-independent configuration transfer
      among macOS, Windows, Linux, and Docker.
    - '2026: The supplied Homebrew cask record tracks SongKong 12.8.'
  usage:
    - >
      Users select a music-library folder and run Fix Songs to match files, update
      metadata, optionally rename or move them, and generate a report. Watch-folder mode
      automates processing of newly added music, while command-line modes support
      fixing, watching, duplicate removal, and undo.
