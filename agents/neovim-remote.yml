id: brew:neovim-remote
display-name: neovim-remote
repo: https://github.com/mhinz/neovim-remote
docs:
  - https://github.com/mhinz/neovim-remote#readme
  - https://github.com/mhinz/neovim-remote/blob/master/INSTALLATION.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The repository had 1,894 stars and 83 forks when queried on 2026-07-01. Homebrew
      analytics showed 210 installs in 30 days, 359 in 90 days, and 1,130 in 365 days,
      which is healthy for a narrow workflow helper.
    - >
      The package also exists on PyPI as `neovim-remote`, so Homebrew is one install
      route rather than the original distribution channel. The adoption audience is
      shell-heavy Neovim users, tmux users, plugin authors, and people who use Neovim as
      `$EDITOR` or Git editor.
  package-nerd-significance:
    - >
      This is a classic tiny-package-with-real-leverage entry. It does not compete with
      Neovim; it packages a missing bit of client/server ergonomics around Neovim's API,
      similar in spirit to `emacsclient` workflows.
  project-history:
    - >
      The `mhinz/neovim-remote` repository was created on 2015-12-04. Its README
      explains the context directly: Neovim always starts a server, exposes an address
      such as `v:servername`, and can be started with `nvim --listen /tmp/nvimsocket`;
      `nvr` then sends commands to that server.
    - >
      The project released v1.4.0 in 2016 and v1.7.0 in 2017, then continued through
      tags such as v2.5.1. It fills a precise compatibility gap around `--remote` and
      friends, especially for users moving Vim workflows into Neovim.
  related-projects:
    - Neovim
    - PyPI neovim-remote
    - vimtex
    - tmux workflows
  sources:
    - https://api.github.com/repos/mhinz/neovim-remote
    - https://api.github.com/repos/mhinz/neovim-remote/releases?per_page=8
    - https://formulae.brew.sh/api/formula/neovim-remote.json
    - https://github.com/mhinz/neovim-remote
    - https://github.com/mhinz/neovim-remote/blob/master/INSTALLATION.md
    - https://pypi.org/project/neovim-remote/
  summary:
    - >
      neovim-remote provides the `nvr` command, a small Python client for controlling
      Neovim server processes from the shell. Its core value is restoring Vim-style
      remote workflows around Neovim's RPC/listen-address model.
  timeline:
    - "{'date': '2015-12-04', 'event': 'The `mhinz/neovim-remote` repository was created.'}"
    - "{'date': '2016-12-06', 'event': 'Release v1.4.0 was published.'}"
    - >
      {'date': '2017-06-23', 'event': 'Release v1.7.0 was published with README/use-case
      updates.'}
  usage:
    - >
      Typical commands include `nvr file`, `nvr --remote file1 file2`, `nvr
      --remote-send`, `nvr --remote-expr`, `nvr -cc split file`, and `git config
      --global core.editor 'nvr --remote-wait-silent'`.
    - >
      The canonical use case is avoiding nested Neovim inside Neovim's `:terminal`: a
      Git commit launched from a terminal buffer can open a commit-message buffer in the
      existing Neovim session and block until that buffer is closed.
related-packages:
  - id: brew:neovim
    reason: >
      Neovim is the editor server that `nvr` controls, so it is required for the remote
      editing, terminal-buffer, and Git-editor workflows documented by neovim-remote.
    rel: adjacent_workflow
    sources:
      - https://github.com/mhinz/neovim-remote
      - https://neovim.io/doc/user/remote.html
