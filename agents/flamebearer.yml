config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package's adoption niche is Node and browser performance work. It can be
      installed globally with npm, used through `flamebearer-node` to profile a script,
      or pointed at Chrome trace and Node CPU profile files.
    - >
      Its README explicitly leaves GUI flamegraph browsing to Speedscope and instead
      optimizes for one-page terminal summaries, drill-down flags, source-map support,
      hot source lines, and long-task visibility.
  package-nerd-significance:
    - >
      flamebearer is interesting because it changed identity without abandoning the
      package: from a Node HTML flamegraph generator inspired by earlier profiling tools
      into a fast textual trace summarizer aimed at modern command-line workflows.
    - >
      It sits in the flamegraph family tree but intentionally chooses a terminal-first
      UX, which makes it attractive for CI logs, scripted profiling runs, and automated
      performance investigations.
  project-history:
    - >
      The official GitHub repository was created in 2018 and was formerly available
      under Mapbox; GitHub now redirects the Mapbox URL to mourner/flamebearer. The
      README says version 1 generated an HTML flamegraph for Node traces, then the
      project lay dormant after 2018.
    - >
      In 2026 the project was revived with a new purpose: a CLI-oriented analyzer for
      performance optimization loops, especially useful for agents and humans reading
      CPU traces without opening a GUI.
  related-projects:
    - Brendan Gregg's FlameGraph is credited for the flamegraph concept.
    - 0x is credited as the original inspiration for the project.
    - >
      Speedscope is named as the GUI flamegraph viewer that flamebearer does not try to
      replace.
  sources:
    - https://github.com/mourner/flamebearer
    - https://raw.githubusercontent.com/mapbox/flamebearer/master/README.md
  summary:
    - >
      flamebearer is a JavaScript CPU trace analysis CLI for Chrome DevTools performance
      recordings and Node `.cpuprofile` files. The current README positions it as a
      compact text-summary tool rather than an HTML flame-graph renderer.
  timeline:
    - '2018: Official repository created.'
    - '2018: Version 1 era generated HTML flamegraphs for Node traces, according to the README.'
    - '2026: Project revived as a CLI CPU trace analysis tool for agents and humans.'
  usage:
    - >
      Typical commands include `flamebearer-node bench.js`, `flamebearer
      profile.json.gz`, and `flamebearer CPU.*.cpuprofile`. Drill-down flags restrict
      stacks, threads, row counts, and time ranges.
    - >
      The tool does not document a persistent config file or credentials file; usage is
      command-line and profile-file driven.
related-packages:
