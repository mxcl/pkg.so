history:
  adoption-history:
    - >
      EPSILON's visible adoption is narrow: it is packaged by Homebrew in this dataset
      and hosted on SourceForge with code, wiki, tickets, mailing lists, and file
      releases. The official page lists BSD, Linux, and Windows as operating systems.
  package-nerd-significance:
    - >
      EPSILON is interesting mostly as a niche compressor: wavelet-based, command-line
      friendly, and old enough to preserve a SourceForge-era image-processing project in
      modern package managers.
  project-history:
    - >
      The SourceForge project was registered on October 2, 2006. Its public project
      metadata lists a last update of June 17, 2014, suggesting a mature but quiet
      utility rather than an actively evolving media stack.
  related-projects:
    - >
      The project is adjacent to other command-line image-compression and
      image-processing tools, but no direct upstream companion project is documented in
      the official sources.
  sources:
    - https://sourceforge.net/projects/epsilon-project/
    - https://sourceforge.net/p/epsilon-project/wiki/Home/
    - https://sourceforge.net/p/epsilon-project/code
  summary:
    - >
      EPSILON is an open-source wavelet image compressor. The official SourceForge
      project page and wiki describe it as aimed at parallel and robust image
      processing.
  timeline:
    - '2006: SourceForge project registered.'
    - '2014: SourceForge project page lists its last update.'
  usage:
    - >
      The package provides an epsilon command plus helper scripts for starting and
      stopping EPSILON nodes, fitting its stated focus on parallel image-processing
      workflows.
