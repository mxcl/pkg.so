id: brew:bashly
display-name: Bashly
repo: null
docs:
  - https://bashly.dev/
  - https://bashly.dev/usage/getting-started
  - https://bashly.dev/usage/settings
config-file-location:
  unix:
    - <project>/src/bashly.yml
    - <project>/bashly-settings.yml
    - <project>/settings.yml
    - $BASHLY_SETTINGS_PATH
credentials-file-location: null
history:
  adoption-history:
    - >
      Bashly is distributed as a Ruby gem and Docker image and is also packaged by
      Homebrew. Its official repository reports substantial community interest,
      reflecting adoption among developers who want structured CLI behavior while
      retaining deployable Bash output.
  package-nerd-significance:
    - >
      Bashly occupies an unusual package-tooling niche: it brings declarative YAML,
      argument validation, generated help, completions, and documentation to Bash while
      producing a readable standalone shell script. This makes it interesting to users
      who value both generator ergonomics and low-runtime-dependency deployment.
  project-history:
    - >
      Bashly developed as a Ruby-based framework and generator for feature-rich Bash
      command-line programs. Instead of embedding argument-parsing boilerplate by hand,
      authors describe commands, subcommands, arguments, and flags in YAML and generate
      the executable script.
    - >
      The project expanded beyond parsing to include shell completion, library
      functions, split configuration, and generated Markdown and manual-page
      documentation.
  related-projects:
    - >
      The generated programs are conventional Bash scripts and commonly fit into
      workflows using ShellCheck and shfmt; the official project states that its output
      is designed to be compliant with both tools.
  sources:
    - https://bashly.dev/
    - https://bashly.dev/usage/getting-started/
    - https://bashly.dev/usage/settings/
    - https://github.com/bashly-framework/bashly
  summary:
    - >
      Bashly is a Ruby-based command-line framework and code generator that turns YAML
      command definitions and user-supplied shell functions into standalone Bash
      applications.
  timeline:
    - Project established as a YAML-driven Bash CLI generator.
    - >
      Current releases: Distributed through RubyGems, Docker, Homebrew, and the
      project's own documentation ecosystem.
  usage:
    - >
      A typical project starts with `bashly init`, which creates `src/bashly.yml`; users
      describe the command tree and then run `bashly generate`. Command implementations
      live in separate source files and are merged into the generated executable on
      subsequent runs.
    - >
      Optional settings are read from `bashly-settings.yml`, `settings.yml`, or the path
      named by `BASHLY_SETTINGS_PATH`.
related-packages:
  - id: brew:shfmt
    reason: >
      Bashly can invoke shfmt as its documented post-generation formatter, including
      custom shfmt arguments for generated scripts.
    rel: adjacent_workflow
    sources:
      - https://bashly.dev/usage/settings/
      - https://github.com/mvdan/sh
  - id: brew:shellcheck
    reason: >
      ShellCheck provides static analysis for the standalone Bash programs Bashly
      generates, which Bashly explicitly aims to keep ShellCheck-compliant.
    rel: adjacent_workflow
    sources:
      - https://github.com/bashly-framework/bashly#readme
      - https://www.shellcheck.net/
tags:
  - bash
  - cli
  - cli-framework
  - cli-generator
  - code-generation
  - ruby
  - shell-scripting
  - yaml
provenance:
  category-sources:
    - 'Official documentation: https://bashly.dev/'
    - 'source_facts.description: "Bash command-line framework and CLI generator".'
  display-name-sources:
    - 'Official documentation title: "Bashly - Bash Command Line Framework".'
    - 'Official repository README: https://github.com/bashly-framework/bashly'
  docs-sources:
    - Dedicated official documentation domain and its Getting Started and Settings references.
  history-sources:
    - https://bashly.dev/
    - https://bashly.dev/usage/getting-started/
    - https://bashly.dev/usage/settings/
    - https://github.com/bashly-framework/bashly
  repo-sources:
    - >
      source_facts.repo already contains a value, so repo is intentionally returned as
      null per the input rule.
  tags-sources:
    - 'Official documentation: https://bashly.dev/'
    - 'Official repository topics and README: https://github.com/bashly-framework/bashly'
category-confidence: high
category-path:
  - developer-tools
  - code-generation
  - cli
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: high
tags-confidence: high
