history:
  adoption-history:
    - >
      Singlebox was distributed as a cross-platform desktop application for macOS,
      Linux, and Windows, with a limited free tier and a paid license for unlimited
      applications and workspaces. Its legacy repository was archived in 2020 when
      development moved to a shared WebCatalog core.
    - >
      The current WebCatalog-operated product is positioned as Singlebox Messenger for
      macOS and Windows. It combines messaging, email, and other web applications and
      adds profiles, cloud synchronization, tray access, app locking, and privacy
      controls. Homebrew Cask provides a package-managed installation route on macOS.
  package-nerd-significance:
    - >
      Singlebox is part of the Electron-era family of desktop web-app aggregators. Its
      history is notable because the standalone application and WebCatalog shared
      infrastructure: the original source was published, then development consolidated
      into a common core and later became closed-source. It illustrates both the
      convenience and packaging complexity of maintaining many isolated web sessions
      inside one desktop shell.
  project-history:
    - >
      Singlebox began as a cross-platform application for placing multiple web
      applications and accounts in one window. The legacy repository describes paid
      software with a free two-workspace allowance and says development was unified with
      WebCatalog.
    - >
      The original repository was archived in December 2020, and its final release notes
      state that the standalone application was being sunset while development moved to
      WebCatalog's Neutron core. WebCatalog subsequently continued the Singlebox name as
      an all-in-one messenger and multi-account browser.
  related-projects:
    - >
      Singlebox shares its lineage and application core with WebCatalog; the archived
      Neutron repository also identifies Clovery and Skywhale as products built on the
      same core.
    - Comparable desktop web-workspace applications include Franz, Rambox, Shift, and Wavebox.
  sources:
    - https://github.com/quanglam2807/singlebox-legacy
    - https://github.com/quanglam2807/singlebox-legacy/releases
    - https://github.com/webcatalog/neutron
    - https://webcatalog.io/en/singlebox
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Singlebox Messenger is WebCatalog's desktop workspace for keeping multiple
      messaging, email, and web-application accounts in one interface while separating
      their browsing environments.
  timeline:
    - >
      2020: The legacy Singlebox repository was archived as development moved to
      WebCatalog's shared core and the old standalone line was sunset.
    - >
      2022: WebCatalog archived the public Neutron core after moving continuing
      development to a closed-source successor.
    - >
      2026: WebCatalog's official site continued to offer Singlebox Messenger for macOS
      and Windows.
  usage:
    - >
      Users add web applications and create profiles for separate accounts, then switch
      among those sessions without repeatedly signing in and out. Optional workflow
      features include cloud synchronization, tray applications, keyboard shortcuts, an
      application lock, advertisement and tracker blocking, and isolated browsing
      environments.
