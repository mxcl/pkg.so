history:
  adoption-history:
    - >
      After its initial Product Hunt launch, PopSQL was adopted by companies including
      DoorDash, Redfin, and Shipt and entered Y Combinator. The company raised a $3.4
      million seed round in 2020.
    - >
      PopSQL raised a $14 million Series A in 2022 and reported use by more than 2,000
      companies. TigerData, then Timescale, acquired PopSQL in April 2024.
    - >
      In 2025 TigerData moved PopSQL into limited support and announced a 2026
      retirement. The official PopSQL site subsequently displayed a notice that the
      shutdown had been postponed.
  package-nerd-significance:
    - >
      PopSQL represented a shift from local, single-user database clients toward an
      account-backed SQL workspace combining query editing, shared knowledge, version
      history, charts, dashboards, scheduling, and real-time collaboration.
    - >
      It is also a cautionary example for package users who install a desktop client but
      depend on a hosted service: locally packaged software does not make the workspace,
      saved queries, or team features local. Export and Git synchronization therefore
      matter for portability.
  project-history:
    - >
      Founder Rahil Sondhi started PopSQL while working as an engineer at Instacart,
      motivated by the friction of keeping SQL in local files, exchanging snippets over
      Slack, and sharing static spreadsheet exports. The product dates to 2016 and was
      launched publicly through Product Hunt.
    - >
      PopSQL developed into a collaborative SQL editor supporting desktop and web
      access, shared connections and queries, version history, charts, dashboards,
      scheduling, data catalogs, dbt workflows, and GitHub synchronization.
    - >
      Timescale, later branded TigerData, acquired PopSQL in April 2024 to bring its SQL
      editing and collaboration experience into the company's PostgreSQL cloud tooling.
  related-projects:
    - >
      TigerData acquired PopSQL and began incorporating aspects of its experience into
      Tiger Cloud.
    - >
      PopSQL integrates with major databases and warehouses, including PostgreSQL,
      MySQL, Redshift, SQL Server, BigQuery, Snowflake, Athena, ClickHouse, Presto, and
      Trino. It also integrates with GitHub, Slack, and dbt.
  sources:
    - https://docs.popsql.com/docs/getting-started — official usage overview
    - >
      https://popsql.com/blog/popsql-limited-support — official 2025 limited-support
      announcement
    - >
      https://popsql.com/blog/seed-round — official founder account of the product's
      origin, early adoption, Y Combinator, and seed funding
    - https://popsql.com/blog/series-a — official Series A and adoption announcement
    - >
      https://popsql.com/learn-sql — official site displayed the subsequent
      shutdown-postponed notice
    - >
      https://www.tigerdata.com/blog/best-postgresql-gui-popsql-joins-timescale —
      official 2024 acquisition announcement
  summary:
    - >
      PopSQL is a proprietary collaborative SQL editor for desktop and web. It combines
      database connections and query editing with shared query libraries, versioning,
      visualization, dashboards, scheduling, and team collaboration.
  timeline:
    - '2016: PopSQL launched'
    - '2020: PopSQL announced a $3.4 million seed round'
    - '2022: PopSQL announced a $14 million Series A and use by more than 2,000 companies'
    - '2024-04-04: Timescale acquired PopSQL'
    - '2025-09-02: PopSQL moved into limited support'
    - '2026: The previously announced shutdown was postponed'
  usage:
    - >
      Users connect PopSQL to a database or warehouse, write and run SQL, inspect
      schemas, save and organize queries, visualize results, and share queries or
      dashboards with teammates.
    - >
      Cloud connections let PopSQL's servers connect to a database and support web
      access and scheduling. Direct connections operate from the desktop client;
      usernames and passwords remain local, while non-secret connection details may be
      shared through the service.
    - >
      The official documentation does not identify a credentials file. Teams can export
      individual queries or synchronize shared queries to GitHub for portability.
