history:
  adoption-history:
    - >
      Motrix has been packaged for macOS, Windows, and Linux in several formats and is
      available to macOS package-manager users through Homebrew Cask. Its version 1
      documentation also described Chocolatey, Scoop, AppImage, Snap, AUR, and Flatpak
      installation routes.
    - >
      Motrix 2 broadens the project beyond a desktop GUI with an official headless
      server image, web interface, command-line client, browser integration, and a
      plug-in model.
  package-nerd-significance:
    - >
      Motrix provides a graphical, cross-platform front end around an aria2-based
      engine, making resumable HTTP/FTP transfers and BitTorrent workflows accessible
      without operating aria2 directly.
    - >
      Its combination of desktop packages, CLI integration, a containerized server
      edition, explicit persistent-state paths, and configurable RPC behavior makes it
      relevant to both desktop package users and self-hosters.
  project-history:
    - >
      Motrix began as an open-source Electron and Vue download-manager interface built
      around aria2. Its early releases emphasized a simple UI, multi-protocol transfers,
      segmented downloads, BitTorrent controls, and platform packaging.
    - >
      Motrix 2 is documented as a ground-up rebuild. The current architecture shares a
      core between the Electron desktop application and a Node.js headless server and
      adds SQLite persistence, plug-ins, browser integration, and a Motrix-maintained
      aria2 fork.
  related-projects:
    - aria2
    - Electron
    - SQLite
    - Motrix CLI
  sources:
    - https://github.com/agalwood/Motrix
    - https://motrix.app/manual/
    - https://motrix.app/manual/docker/
    - https://motrix.app/manual/faq/
    - https://motrix.app/manual/getting-started/
    - source_facts.package-manager
  summary:
    - >
      Motrix is an open-source, cross-platform download manager for HTTP(S), FTP,
      BitTorrent, magnet links, and torrent files.
  timeline:
    - >
      2019: The v1.4 series added selective BitTorrent downloading, speed limits, and
      RPC-secret preferences
    - 'Motrix 1: The application used an Electron/Vue front end around aria2'
    - >
      Motrix 2: A ground-up rebuild introduced a shared desktop/server core and new
      persistence and integration features
  usage:
    - >
      Users add direct links, magnet URIs, or torrent files; manage queued and
      concurrent transfers; control bandwidth and seeding; configure proxies and
      trackers; and optionally operate Motrix through its CLI or headless server
      edition.
