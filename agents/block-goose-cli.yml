id: brew:block-goose-cli
display-name: goose
repo: null
docs:
  - https://goose-docs.ai/docs/category/getting-started
  - https://goose-docs.ai/docs/guides/config-files
config-file-location:
  unix:
    - ~/.config/goose/config.yaml
  windows:
    - '%APPDATA%\Block\goose\config\config.yaml'
credentials-file-location:
  unix:
    - ~/.config/goose/secrets.yaml
  windows:
    - '%APPDATA%\Block\goose\config\secrets.yaml'
history:
  adoption-history:
    - >
      goose's adoption is linked to the rapid package-manager normalization of AI-agent
      CLIs after MCP became a common extension interface. The input metadata records
      Homebrew, Fedora, MacPorts, Nix, Scoop, and other package entries, while the
      README shows active release and packaging-status badges.
    - >
      The release feed shows frequent 2026 releases, including v1.39.0 on June 25, 2026,
      indicating active iteration rather than a static wrapper.
  package-nerd-significance:
    - >
      goose is significant as an example of the new class of packaged AI-agent tools: it
      needs normal CLI distribution, config files, secret storage, frequent releases,
      and extension discovery, but its behavior depends on remote or local model
      providers rather than only local code.
    - >
      For package maintainers, it illustrates a naming and provenance wrinkle: the
      package can retain a vendor-era formula name while upstream governance and
      repository ownership move to a foundation namespace.
  project-history:
    - >
      GitHub metadata dates the current public repository to August 2024. The official
      README describes goose as a general-purpose AI agent that runs on the user's
      machine for code, research, writing, automation, and data analysis, with a Rust
      implementation for performance and portability.
    - >
      The README states that goose supports desktop, CLI, and API use, works with many
      model providers, and connects to extensions through the Model Context Protocol.
      Its governance document describes lightweight technical governance, open
      development, community contribution, and stewardship through core maintainers and
      maintainers.
    - >
      By 2026 the README identifies goose as part of the Agentic AI Foundation at the
      Linux Foundation, marking a shift from a company-associated open source tool
      toward foundation-hosted agent infrastructure.
  related-projects:
    - Model Context Protocol is a central extension mechanism named by the README.
    - >
      Anthropic, OpenAI, Google, Ollama, OpenRouter, Azure, and Bedrock are named
      provider families in the README.
    - Agent Client Protocol is referenced by the README for subscription-based provider use.
  sources:
    - GitHub repository metadata via gh api repos/aaif-goose/goose
    - https://github.com/aaif-goose/goose#readme
    - https://github.com/aaif-goose/goose/blob/main/GOVERNANCE.md
    - https://github.com/aaif-goose/goose/releases
    - https://goose-docs.ai/docs/category/getting-started
    - https://goose-docs.ai/docs/guides/config-files
    - source_facts.package-manager
  summary:
    - >
      goose is an open source, extensible local AI agent distributed as a desktop app,
      CLI, and API. The Homebrew formula name `block-goose-cli` preserves its Block-era
      packaging identity, while the current upstream README says the project has moved
      from `block/goose` to the Agentic AI Foundation at the Linux Foundation.
  timeline:
    - '2024: Current public GitHub repository created.'
    - '2025: Official tag stream includes nightly releases in the 1.x line.'
    - >
      2026: README states goose moved from `block/goose` to the Agentic AI Foundation at
      the Linux Foundation.
    - '2026: v1.39.0 released on June 25.'
  usage:
    - >
      Users install the CLI or desktop app, configure providers and secrets, then use
      goose for terminal agent workflows. The official docs document configuration and
      secrets files under the goose config directory, and the README emphasizes provider
      choice across hosted and local models plus MCP extensions.
related-packages:
  - id: brew:ollama
    reason: >
      Install Ollama alongside goose when you want goose to use locally running open
      models; goose officially supports Ollama as a provider and documents selecting its
      host and model during configuration.
    rel: adjacent_workflow
    sources:
      - https://goose-docs.ai/docs/getting-started/providers/
      - https://docs.ollama.com/
tags:
  - ai
  - ai-agent
  - cli
  - coding
