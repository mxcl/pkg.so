history:
  project-history:
    - >
      The project evolved from a small embeddable web server into a two-file C
      networking library for production device dashboards. Its homepage and repository
      emphasize microcontroller and embedded use: TCP/IP, HTTP, WebSocket, MQTT, TLS
      1.3, OTA firmware update support, asynchronous DNS, a small runtime footprint, and
      portability across desktop operating systems and chips from vendors such as STM32,
      NXP, ESP32, Nordic, TI, Microchip, Infineon, and Renesas.
  sources:
    - https://formulae.brew.sh/formula/mongoose
    - https://github.com/cesanta/mongoose
    - https://mongoose-os.com/about.html
    - https://mongoose.ws/
    - https://www.st.com/en/partner-products-and-services/mongoose-web-server-library.html
  summary:
    - >
      Mongoose is Cesanta's embedded web server and C networking library. Cesanta traces
      the Mongoose Web Server Library back to development that started in 2004, and says
      Cesanta Software Ltd. was established in 2013 to continue development and support
      as the web server matured.
  usage:
    - >
      In package-manager terms, the Homebrew formula installs the standalone mongoose
      command, but the larger ecosystem role is as source code embedded into firmware
      and device software. It sits near libraries such as libmicrohttpd, CivetWeb, and
      lwIP-backed stacks, with Mongoose's niche being a compact C/C++ network layer that
      can serve web UIs and speak IoT protocols from constrained devices.
related-packages:
  - id: brew:civetweb
    reason: >
      Choose CivetWeb for an MIT-licensed embeddable or standalone HTTP server descended
      from pre-2013 Mongoose; choose Mongoose when its MQTT support, bare-metal targets,
      or built-in TCP/IP stack are important.
    rel: alternative
    sources:
      - https://github.com/civetweb/civetweb
      - https://mongoose.ws/documentation/
