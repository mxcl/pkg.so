history:
  adoption-history:
    - >
      Genesys distributes the desktop client as one of several official ways to access
      Genesys Cloud, alongside the web application and embedded clients. This gives
      organizations a dedicated application while retaining the service's cloud-hosted
      account, calling, and contact-center model.
  package-nerd-significance:
    - >
      The cask packages a dedicated desktop shell for a continuously delivered cloud
      service. Its usefulness and compatibility therefore depend more on the remote
      Genesys Cloud platform, organization configuration, and supported peripherals than
      on local command-line tooling or editable configuration files.
  project-history:
    - >
      The desktop application is maintained as a client for the Genesys Cloud service
      and receives application updates through its built-in update workflow. Official
      support material treats it as a first-party access channel alongside the browser
      and embedded-client experiences.
  related-projects:
    - Genesys Cloud web app
    - Genesys Cloud embedded clients
    - Genesys Cloud WebRTC
  sources:
    - https://apps.mypurecloud.com/directory-mac
    - https://help.mypurecloud.com/
    - https://help.mypurecloud.com/articles/configure-a-cyber-acoustics-headset/
  summary:
    - >
      Genesys Cloud is the official standalone desktop client for the Genesys Cloud
      communications and contact-center platform.
  timeline:
    - >
      Cloud-client era: Genesys offered the desktop application as a dedicated
      alternative to browser access.
    - >
      Current operation: The application follows a built-in update workflow and shares
      Genesys Cloud calling and device-profile concepts with other supported clients.
  usage:
    - >
      Users sign in to their organization's Genesys Cloud environment and use the
      standalone client for communications and contact-center work without keeping the
      service in a general-purpose browser.
    - >
      The app supports Genesys Cloud audio profiles and compatible headsets. Updates can
      be checked from the Genesys Cloud application menu, while calling-device choices
      are managed through the Phone Settings interface.
