history:
  adoption-history:
    - >
      nkoda broadened access through applications for Apple, Android, Windows, and Mac
      devices and through plans for conservatoires, universities, schools, and
      performing institutions. Publisher partnerships are central to its adoption model
      because the service distributes licensed scores while remunerating publishers and
      composers.
  package-nerd-significance:
    - >
      nkoda represents the subscription-library model applied to notated music: the
      package installs a client whose main value comes from authenticated access to a
      licensed remote catalogue. Homebrew Cask makes that proprietary desktop client
      reproducibly deployable on Macs.
  project-history:
    - >
      nkoda was established to provide digital access to licensed scores and parts
      rather than relying on individually purchased paper editions. It developed a
      cross-platform reader and library around publisher agreements, offline access, and
      tools used in study, rehearsal, teaching, and performance.
  related-projects:
    - >
      The application sits alongside dedicated score readers and digital music-library
      services. Its catalogue depends on partnerships with music publishers; nkoda
      announced a strategic partnership with Schott Music in 2023.
  sources:
    - 'Official nkoda blog: https://www.nkoda.com/blog'
    - 'Official nkoda help page: https://www.nkoda.com/help/using-nkoda%E2%80%8B'
    - 'Official nkoda website: https://www.nkoda.com/'
    - source_facts.package-manager
  summary:
    - >
      nkoda is a cross-platform subscription service and reader for licensed digital
      sheet music, scores, parts, and music-education materials.
  timeline:
    - >
      By 2021: nkoda described its application as both a digital score library and a
      score reader.
    - >
      2023: nkoda announced a strategic partnership with Schott Music to add the
      publisher's catalogue.
    - >
      Later development: nkoda expanded its institutional offering for educational and
      performing organizations.
  usage:
    - >
      Musicians search the licensed catalogue, open scores or individual parts, maintain
      a personal library, annotate music, and save permitted material for offline
      access. A subscription can be used across supported devices, subject to the
      service's simultaneous-use and regional catalogue restrictions.
