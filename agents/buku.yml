config-file-location:
  unix:
    - $BUKU_DEFAULT_DBDIR/bookmarks.db
    - $XDG_DATA_HOME/buku/bookmarks.db
    - ~/.local/share/buku/bookmarks.db
    - ./bookmarks.db
  windows:
    - '%APPDATA%\buku\bookmarks.db'
    - .\bookmarks.db
credentials-file-location: null
history:
  adoption-history:
    - >
      buku's adoption followed the path of many beloved CLI productivity tools:
      distribution through PyPI and operating-system package managers, then auxiliary
      frontends and integrations around the core database. The input package facts list
      Homebrew, Debian, Ubuntu, Fedora, Alpine, MacPorts, Nix, and PyPI-adjacent
      installation routes.
    - >
      The upstream README lists related projects such as a browser WebExtension, rofi
      frontend, search-as-you-type CLI frontend, and Android app, plus press/tutorial
      mentions. That ecosystem points to adoption by users who wanted browser bookmarks
      to become a portable, searchable personal dataset.
  package-nerd-significance:
    - >
      buku is package-nerd catnip because it turns a browser-owned feature into a plain
      local database with a normal CLI. It is small enough to understand, useful enough
      to package everywhere, and scriptable enough to become part of shell workflows.
    - >
      Its charm is that it treats bookmarks like data: searchable, exportable,
      mergeable, syncable, and private by default rather than bound to one browser
      profile or cloud account.
  project-history:
    - >
      The `jarun/buku` repository was created on 2015-11-01. In the README, the author
      explains that buku was written because they could not find a flexible command-line
      bookmark manager with a private, portable, mergeable database and seamless GUI
      integration.
    - >
      Over time buku grew beyond simple URL storage into a bookmark database with
      browser import, automatic title/tag/description fetching, regex and fielded
      search, Wayback Machine lookups, import/export formats, manual encryption, shell
      completion, a Python API, and the optional `bukuserver` web UI.
  related-projects:
    - >
      buku is related to `bukuserver`, bukubrow, oil, buku_run, buku-dmenu,
      buku-android, browser bookmark import/export formats, SQLite, PyPI packaging, and
      XDG data-directory conventions.
  sources:
    - https://api.github.com/repos/jarun/buku
    - https://buku.readthedocs.io/en/latest
    - https://github.com/jarun/buku#readme
    - https://github.com/jarun/buku/wiki
    - source_facts.package-manager
  summary:
    - >
      buku is a command-line bookmark manager built around a private, portable SQLite
      bookmark database. It sits in the Unix tradition of personal information tools
      that are scriptable, editor-friendly, and intentionally local-first.
  timeline:
    - '2015: Public `jarun/buku` repository is created.'
    - '2010s: buku gains packaging across Python and Linux/macOS package managers.'
    - >
      2010s: Related projects appear around browser integration, rofi, Android, and web
      UI workflows.
    - >
      2026: The repository remains active and continues to document package-manager
      installation and a broad feature set.
  usage:
    - >
      Users add, edit, tag, search, open, import, export, and refresh bookmarks from the
      terminal. Common workflows include importing browser bookmarks, adding URLs with
      fetched metadata, searching by tags or URL/title/comment markers, exporting
      subsets to HTML/XBEL/Markdown/Org/RSS, and using an editor for bookmark entry.
    - >
      `bukuserver` gives users a local web UI, while the Python API and related tools
      allow custom integrations. The database location can be redirected through
      `BUKU_DEFAULT_DBDIR` or XDG paths, which makes syncing and backups
      straightforward.
