  - https://www.rubydoc.info/gems/gitlab
config-file-location:
  unix:
    - config/initializers/gitlab.rb
credentials-file-location:
  unix:
    - config/initializers/gitlab.rb
history:
  adoption-history:
    - >
      The package's adoption is visible in RubyGems metadata: the API response collected
      for this enrichment reported over 112 million gem downloads. That scale reflects
      long-running use in Ruby automation, scripts, internal tools, and CI jobs that
      need GitLab API access without hand-written HTTP calls.
    - >
      Homebrew's `gitlab-gem` formula exists because the gem also exposes a `gitlab`
      executable, giving non-Ruby specialists a packaged CLI route to the same API
      client.
  package-nerd-significance:
    - >
      For package maintainers, `gitlab-gem` is a reminder that language packages can
      become general-purpose command-line tools. The Homebrew formula wraps a RubyGem so
      developers can install a GitLab API CLI without thinking about Bundler, while Ruby
      users still get the library through the normal gem ecosystem.
  project-history:
    - >
      The NARKOZ/gitlab repository was created in September 2012, making it one of the
      earlier third-party client libraries for GitLab automation. The README describes
      the package as both a Ruby wrapper and a CLI for the GitLab API, with installation
      through RubyGems, Bundler, and Homebrew.
    - >
      The gem evolved with GitLab's API versions and Ruby packaging norms. Its README
      documents endpoint and token configuration, client initialization, pagination
      helpers, CLI command dispatch to client methods, an interactive CLI shell, and
      development against either a Dockerized GitLab instance or an external GitLab
      instance.
  related-projects:
    - >
      Related surfaces include GitLab's REST API, RubyGems, RubyDoc, Bundler, Homebrew,
      HTTParty, and GitLab CE or EE instances used for development and testing.
  sources:
    - https://api.github.com/repos/NARKOZ/gitlab
    - https://github.com/NARKOZ/gitlab
    - https://github.com/NARKOZ/gitlab/releases/tag/v6.1.0
    - https://raw.githubusercontent.com/NARKOZ/gitlab/master/README.md
    - https://rubygems.org/api/v1/gems/gitlab.json
    - https://rubygems.org/gems/gitlab
    - https://www.rubydoc.info/gems/gitlab
  summary:
    - >
      GitLab Ruby Gem, packaged by Homebrew as `gitlab-gem`, is a Ruby client library
      and command-line interface for the GitLab REST API. It lets Ruby programs and
      terminal users call GitLab API methods for users, projects, merge requests,
      branches, groups, and related resources.
  timeline:
    - '2012: Repository created for a Ruby GitLab API wrapper.'
    - '2012: Package documented Ruby library and CLI usage against GitLab.'
    - '2024: v5.x releases continued API-client maintenance.'
    - '2025: v6.1.0 release published on GitHub.'
  usage:
    - >
      Practitioners configure `GITLAB_API_ENDPOINT` and `GITLAB_API_PRIVATE_TOKEN`, or
      configure those values in Ruby with `Gitlab.configure`. CLI users call client
      methods as commands, such as `gitlab users`, `gitlab user`, and `gitlab
      create_merge_request`, with YAML-style option hashes where needed.
related-packages:
  - id: brew:glab
    reason: >
      Choose GLab for GitLab's official, broad terminal workflow covering issues, merge
      requests, pipelines, changelogs, and releases; choose gitlab-gem when Ruby-library
      integration or its method-oriented CLI is required.
    rel: alternative
    sources:
      - https://narkoz.github.io/gitlab/
      - https://docs.gitlab.com/cli/
