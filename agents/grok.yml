history:
  adoption-history:
    - >
      The standalone package remained a niche command-line tool, but the grok pattern
      idea became culturally important in log processing. Similar pattern syntax appears
      in widely used log pipelines and observability products, while the original
      package stayed available through package managers such as Homebrew and MacPorts.
  package-nerd-significance:
    - >
      For package nerds, the appeal is the old-school Unix shape: a C command,
      PCRE-backed named patterns, installable pattern files, and log parsing without
      pulling in a larger log-ingestion stack.
  project-history:
    - >
      The project predates its GitHub repository through the semicomplete.com and Google
      Code era referenced from the repository metadata. Its manual page describes the
      command as software for parsing logs, handling events, and turning unstructured
      text into structured data.
    - >
      The C implementation builds a `grok` command, `discogrok`, and a shared library.
      Its pattern-file model lets users name regular expressions once and compose them
      in match blocks instead of repeating long PCRE expressions across log-processing
      configurations.
  related-projects:
    - >
      Related projects include Jordan Sissel's Ruby grok implementation, Logstash-style
      grok filters, and observability tools that use named pattern matching for
      unstructured logs.
    - >
      It is also adjacent to traditional text-processing tools such as grep, awk, sed,
      and PCRE-based command-line filters.
  sources:
    - https://api.github.com/repos/jordansissel/grok
    - https://api.github.com/repos/jordansissel/grok/tags
    - https://github.com/jordansissel/grok
    - https://github.com/jordansissel/grok/blob/master/grok.pod
  summary:
    - >
      Jordan Sissel's grok is a small Unix-oriented log parsing tool that turns reusable
      regular-expression patterns into structured output.
  timeline:
    - >
      2011: The GitHub repository was created and release tags from the 2011 series were
      published.
    - >
      2012: Homebrew and other package ecosystems carried the standalone tool during the
      early 2010s log-processing boom.
    - >
      2020s: The original project persisted as a niche packaged utility while grok-style
      patterns became common in larger logging systems.
  usage:
    - >
      A typical invocation points `grok` at a configuration file with `-f`.
      Configurations declare inputs such as files or command output, define match
      blocks, and emit reactions such as the original line, captured fields, JSON, or
      shell-command input.
related-packages:
  - id: brew:logstash
    reason: >
      Choose Logstash when grok-style parsing must be embedded in a maintained
      input-filter-output pipeline; choose standalone grok for a smaller PCRE-based
      command-line workflow.
    rel: alternative
    sources:
