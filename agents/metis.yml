history:
  project-history:
    - >
      Its technical importance comes from making high-quality graph and mesh
      partitioning available as practical command-line programs and libraries for sparse
      numerical computation. Typical uses include splitting finite-element meshes for
      parallel simulation, partitioning irregular graphs, and ordering sparse matrices
      so later factorization does less fill-in. The Homebrew executables mirror those
      domains: gpmetis for graph partitioning, mpmetis for mesh partitioning, ndmetis
      for nested-dissection ordering, plus checking and conversion utilities.
  sources:
    - https://formulae.brew.sh/formula/metis
    - https://github.com/KarypisLab/METIS
    - https://jmlr.org/papers/volume23/21-0644/21-0644.pdf
    - https://karypis.github.io/glaros/software/metis/overview.html
    - https://raw.githubusercontent.com/KarypisLab/METIS/master/manual/manual.pdf
    - >
      https://www.researchgate.net/publication/254424775_METIS-A_Software_Package_for_Partitioning_Unstructured_Graphs_Partitioning_Meshes_and_Computing_Fill-Reducing_Ordering_of_Sparse_Matrices
  summary:
    - >
      METIS is a long-running scientific computing package from George Karypis's graph
      partitioning work at the University of Minnesota. The METIS 4.0 report by George
      Karypis and Vipin Kumar described it as software for partitioning unstructured
      graphs, partitioning meshes, and computing fill-reducing orderings of sparse
      matrices; the Karypis project page and the GitHub README describe METIS 5.x as a
      set of serial programs implementing multilevel recursive-bisection, multilevel
      k-way, and multi-constraint partitioning schemes developed in the lab.
  usage:
    - >
      METIS also became a reference point for related partitioning packages. Karypis's
      own software family presents ParMETIS as the MPI-based parallel counterpart and
      hMETIS as the hypergraph/circuit partitioning sibling, while later
      graph-partitioning literature commonly lists METIS alongside SCOTCH, ParMETIS,
      PT-SCOTCH, and Zoltan. In package managers it sits less like an end-user app and
      more like infrastructure for scientific software stacks, solvers, mesh tools, and
      applications that need graph partitioning or sparse matrix ordering.
related-packages:
  - id: brew:scotch
    reason: >
      SCOTCH is an alternative graph, mesh, and sparse-matrix partitioning toolkit that
      also provides METIS v3 and v5 compatibility interfaces to ease migration.
    rel: alternative
    sources:
      - https://www.labri.fr/perso/pelegrin/scotch/
      - https://gitlab.inria.fr/scotch/scotch
      - https://github.com/KarypisLab/METIS
