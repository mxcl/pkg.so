history:
  adoption-history:
    - >
      Black Light has remained a specialist Mac utility rather than a general
      display-management standard. Its long span of compatibility—from releases for
      pre-Mac OS X 10.6 systems through the modern version 3 line—reflects sustained use
      by people needing display effects beyond ordinary brightness controls.
  package-nerd-significance:
    - >
      Black Light is an example of the enduring small-utility tradition in the Mac
      ecosystem: narrowly focused, independently distributed, and maintained across
      major operating-system transitions. Its gamma-curve approach also records an older
      layer of display customization that predates today's system-wide appearance and
      night-light features.
  project-history:
    - >
      Michel Fortin developed Black Light as an application and screen saver for
      applying display effects through the gamma curve. By 2009, version 1.7 had added
      64-bit screen-saver support for Snow Leopard and an HDTV luminance-correction
      effect.
    - >
      Black Light 2 arrived in 2013 with updates for contemporary versions of OS X. The
      version 3 generation added a newer effect-composition workflow while retaining
      older releases for legacy Mac systems.
  related-projects:
    - Gamma Control is another display utility developed by Michel Fortin.
    - >
      Black Light Pro was an earlier related product recognized by the version 3 upgrade
      program.
  sources:
    - >
      Developer's 2009 release history:
      https://michelf.ca/blog/2009/update-black-light-php-markdown/
    - >
      Developer's Black Light 2 announcement:
      https://michelf.ca/blog/2013/black-light-2-gamma-control-4/
    - 'Official FAQ: https://michelf.ca/projects/black-light/faq/'
    - 'Official product page: https://michelf.ca/projects/black-light/'
  summary:
    - >
      Black Light is a macOS display-effects utility by Michel Fortin. It applies
      configurable tint, brightness, gamma, inversion, luminance, and color-vision
      simulation effects to connected displays.
  timeline:
    - >
      October 10, 2009: Black Light 1.7 added Snow Leopard 64-bit support and HDTV
      luminance adjustment.
    - '2013: Black Light 2.0 was released for newer OS X versions.'
    - >
      October 1, 2023: Start of the purchase window qualifying for a free Black Light 3
      upgrade.
    - 'Version 3.0: Current major generation documented by the official site.'
  usage:
    - >
      Users compose visual effects and activate them with global keyboard shortcuts,
      schedules, foreground-application rules, or the Dock/menu-bar menu. Typical uses
      include reducing perceived brightness, producing a red astronomy display, changing
      color temperature, simulating color-vision differences, and correcting HDTV
      luminance.
