history:
  adoption-history:
    - >
      KDoctor's adoption is tied to Kotlin Multiplatform Mobile onboarding: it is used
      by developers and support channels to quickly identify missing or mismatched
      macOS, Android, Xcode, Java, or CocoaPods setup. Homebrew packaging made it
      convenient for macOS developers to install as a standalone diagnostic command.
  package-nerd-significance:
    - >
      KDoctor is notable as a single-purpose ecosystem health check: it turns a
      traditionally fragile mobile cross-toolchain setup into one small
      package-manager-installable command. For package nerds, it is the kind of glue CLI
      that captures the real state of an SDK stack better than a version number alone.
  project-history:
    - >
      The GitHub repository was created on 2022-01-17 under the Kotlin organization, and
      its first public pre-release, v0.0.1, was published on 2022-02-04. The README
      presents it as a JetBrains incubator project and documents the simple `kdoctor`
      workflow for diagnosing a Kotlin Multiplatform Mobile environment.
    - >
      The 2022-05-20 Kotlin Multiplatform Mobile beta roadmap update singled out KDoctor
      as a tool for improving onboarding. Its release history moved from the 0.0.x
      series in 2022 to v1.0.0 on 2023-03-15, with v1.0.0 adding project-analysis
      diagnostics and team-id reporting.
  related-projects:
    - >
      KDoctor is adjacent to Kotlin Multiplatform, Kotlin Multiplatform Mobile, Android
      Studio, Xcode, CocoaPods, and Gradle. It is diagnostic glue around those projects
      rather than a replacement for any of them.
  sources:
    - https://api.github.com/repos/Kotlin/kdoctor
    - >
      https://blog.jetbrains.com/kotlin/2022/05/kotlin-multiplatform-mobile-beta-roadmap-update/
    - https://github.com/Kotlin/kdoctor
    - https://github.com/Kotlin/kdoctor/releases
  summary:
    - >
      KDoctor is a Kotlin-team command-line diagnostic tool for checking whether a macOS
      development environment is ready for Kotlin Multiplatform Mobile work. It tests
      the surrounding toolchain rather than compiling Kotlin code itself: operating
      system, JDK, Android Studio, Xcode, CocoaPods, and related setup details.
  timeline:
    - '2022-01-17: GitHub repository created under the Kotlin organization.'
    - '2022-02-04: v0.0.1 pre-release published.'
    - >
      2022-05-20: JetBrains' Kotlin Multiplatform Mobile beta roadmap update highlighted
      KDoctor for onboarding.
    - '2023-03-15: v1.0.0 published with project-analysis diagnostics and team-id reporting.'
    - '2023-11-01: v1.1.0 published.'
  usage:
    - >
      The normal workflow is to run `kdoctor` in a terminal and review its report before
      building or debugging a Kotlin Multiplatform Mobile project. Later releases added
      more specific diagnostics, including analysis of Gradle project configuration via
      command-line options.
related-packages:
  - id: brew:kotlin
    reason: >
      Kotlin is the language and multiplatform toolchain whose mobile development
      environment KDoctor is designed to validate.
    rel: adjacent_workflow
    sources:
      - https://github.com/Kotlin/kdoctor#readme
      - https://kotlinlang.org/docs/multiplatform.html
  - id: brew:cocoapods
    reason: >
      KDoctor explicitly checks the CocoaPods installation used to integrate
      Apple-platform dependencies in Kotlin Multiplatform mobile projects.
    rel: adjacent_workflow
    sources:
      - https://github.com/Kotlin/kdoctor#readme
      - https://guides.cocoapods.org/using/using-cocoapods.html
  - id: brew:openjdk
    reason: >
      KDoctor checks the installed JDK and JAVA_HOME because Java is part of the Android
      and Gradle side of the Kotlin Multiplatform toolchain.
    rel: adjacent_workflow
    sources:
      - https://github.com/Kotlin/kdoctor#readme
      - https://openjdk.org/guide/
