id: brew:dcd
display-name: DCD
repo: null
docs:
  - https://github.com/dlang-community/DCD#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/dcd/dcd.conf
    - ~/.config/dcd/dcd.conf
  windows:
    - <current-working-directory>\dcd.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      DCD sits in the era before language-server-protocol tooling fully standardized
      editor integration. Its adoption came through editor scripts and plugins for D
      programmers, with the README pointing users to a wiki page for IDE and editor
      support and the input package facts showing availability in Homebrew, MacPorts,
      and Arch packaging.
  package-nerd-significance:
    - >
      DCD is a classic small-language tooling package: two command-line programs, a
      daemon protocol, editor hooks, and a package-manager install path. It matters to
      package nerds because it shows how autocomplete tooling was distributed before
      every language tool became an LSP server.
  project-history:
    - >
      The official GitHub repository was created in 2013 under the D language community
      organization. The README documents a client/server design, Unix-domain socket
      defaults on Unix-like systems, TCP socket support, and setup paths through
      Homebrew, source builds, or Dub.
  related-projects:
    - >
      The README points IDE users to D editor integrations; in the wider D ecosystem,
      Dub and D compilers provide the build/runtime context that DCD expects.
  sources:
    - https://github.com/dlang-community/DCD
    - https://raw.githubusercontent.com/dlang-community/DCD/master/README.md
    - https://api.github.com/repos/dlang-community/DCD
  summary:
    - >
      DCD, the D Completion Daemon, is an autocomplete program for the D programming
      language. Its README positions it as editor infrastructure rather than an IDE: a
      server caches imported files and computes completion data, while a client is
      called by editor integrations or the command line.
  timeline:
    - '2013: Official GitHub repository created.'
    - '2010s: README documents Homebrew, Git/Make, and Dub installation paths.'
    - >
      2025: Official GitHub API metadata shows repository activity continuing into
      December 2025.
  usage:
    - >
      Package users install DCD to give lightweight editors D-aware completion, call
      tips, symbol locations, and import completion without installing a full IDE. The
      server process is started before editing, and editor plugins usually invoke
      dcd-client on source buffers.
related-packages:
  - id: brew:dub
    reason: >
      DUB is the documented build path for DCD's client and server and is useful for
      rebuilding DCD or managing the surrounding D project dependencies.
    rel: adjacent_workflow
    sources:
      - https://github.com/dlang-community/DCD#readme
      - https://dub.pm/
  - id: brew:ldc
    reason: >
      LDC provides the recent D compiler environment required to build DCD and the
      standard-library import trees that DCD indexes for completion.
    rel: adjacent_workflow
    sources:
      - https://github.com/dlang-community/DCD#readme
      - https://github.com/ldc-developers/ldc#readme
