config-file-location:
  unix:
    - $XDG_CONFIG_HOME/openshell/gateway.toml
  windows:
    - Linux-side $XDG_CONFIG_HOME/openshell/gateway.toml when using WSL 2
credentials-file-location: null
history:
  adoption-history:
    - >
      OpenShell is distributed through platform-native packages for Linux and Apple
      Silicon macOS, with WSL 2 support marked experimental. It supports local Docker,
      Podman, and microVM deployments as well as Kubernetes gateways. The 0.1 release
      line introduced a stable cadence and documented production-oriented API and
      upgrade policies.
  package-nerd-significance:
    - >
      OpenShell packages an agent sandbox, gateway, policy prover, and
      credential-routing system into a local or clustered runtime. It is notable for
      combining kernel isolation, declarative policy, formal policy verification, and
      host-side credential injection so agents need not receive raw provider secrets.
  project-history:
    - >
      NVIDIA developed OpenShell as a secure runtime for autonomous agents that need
      controlled access to files, processes, networks, APIs, and credentials. Early 0.0
      releases evolved into the 0.1 release line, which removed the alpha designation
      and established a predictable release cadence and API-change policy.
  related-projects:
    - Docker
    - Podman
    - Kubernetes
    - Open Policy Agent
    - Z3
  sources:
    - https://docs.nvidia.com/openshell/latest/about/how-it-works
    - https://docs.nvidia.com/openshell/latest/about/installation
    - https://github.com/NVIDIA/OpenShell#readme
    - https://github.com/NVIDIA/OpenShell/milestones
    - https://github.com/NVIDIA/OpenShell/releases
  summary:
    - >
      NVIDIA OpenShell is a runtime and control plane for executing autonomous AI agents
      inside policy-governed sandboxes while keeping credentials and sensitive host
      resources outside the agent's unrestricted reach.
  timeline:
    - >
      2026: OpenShell's 0.1 release line established a stable release cadence and
      production-oriented compatibility policy.
  usage:
    - >
      Users install the CLI and a local gateway, create sandboxes, attach provider
      credentials, and define filesystem, process, and network policies. The gateway
      owns durable state and credential handling, while a supervisor enforces policy
      within each sandbox. Kubernetes installations provide a clustered deployment
      option.
