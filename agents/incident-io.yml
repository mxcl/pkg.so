history:
  adoption-history:
    - >
      The product grew from incident-response practices developed at Monzo. incident.io
      reports adoption by engineering and reliability organizations for coordinated
      response, on-call, investigations, post-incident work, and status communication.
  package-nerd-significance:
    - >
      The desktop package is notable for bringing a traditionally web- and chat-centered
      incident-management service into the macOS notch or menu bar and for bundling a
      local MCP server that connects incident response with coding agents.
  project-history:
    - >
      The founders began developing incident.io from frustrations with fragmented
      incident-management processes. The company dates its launch as a full-time
      business to 2021 and subsequently expanded the product from Slack-centered
      response into a broader software-reliability platform.
  related-projects:
    - >
      The platform officially integrates with Slack and Microsoft Teams and offers
      one-click desktop integrations for Claude Code, Codex, and Cursor, plus manual
      configuration for other MCP clients.
  sources:
    - https://docs.incident.io/ai/desktop-app
    - https://incident.io/
    - https://incident.io/blog/incident.io-raises-62m
    - https://incident.io/blog/podcast-a-trip-down-memory-lane-with-the-founders
  summary:
    - >
      incident.io is a commercial software-reliability and incident-management platform.
      Its macOS application surfaces pages and incident updates locally and lets
      operators investigate and post findings through MCP-enabled coding agents.
  timeline:
    - '2021: incident.io began operating as a full-time company.'
    - >
      2025: The company described its expansion toward AI-assisted incident
      investigation and response.
  usage:
    - >
      Operators use the desktop app to receive and acknowledge pages, pin incidents,
      start investigations in a coding agent, post findings to an incident channel, and
      follow incident or status-page updates without leaving their terminal workflow.
