id: brew:instalooter
display-name: InstaLooter
repo: https://github.com/althonos/instalooter
docs:
  - https://instalooter.readthedocs.io/en/latest/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      InstaLooter was distributed through PyPI and packaged by Homebrew. The official
      Read the Docs build, README badges, and PyPI metadata show a conventional Python
      CLI distribution path with documentation, changelog, source repository, and
      package releases.
    - >
      The Homebrew formula packages the PyPI source archive for version 2.4.4, while
      PyPI records dozens of releases beginning in 2016. That adoption is modest but
      real for a single-purpose scraper.
  package-nerd-significance:
    - >
      InstaLooter is historically interesting because it shows the fragile lifecycle of
      API-less social-media downloaders: quick adoption, many small fixes, rewrites
      after web changes, and eventual defunct status as upstream platform behavior
      moves.
    - >
      For package maintainers, it is a cautionary package: the source archive, docs, and
      formula remain useful records, but the project's own description warns that its
      web-scraping assumptions aged out.
  project-history:
    - >
      The GitHub repository and PyPI package appeared in 2016. The README says
      InstaLooter can download pictures or videos associated with an Instagram profile
      without API access and describes it as a reimplementation of the deprecated
      InstaRaider project.
    - >
      The 1.0.0 line was rewritten from scratch and intentionally risked breaking script
      compatibility while trying to keep the CLI familiar. The changelog records a
      semantic-versioned release stream through the 2.x series, including fixes for
      Instagram-side API and login changes.
  related-projects:
    - >
      InstaLooter is related to InstaRaider, Instaloader, PyPI-distributed scraping
      CLIs, Read the Docs documentation, Homebrew Python formulas, and Instagram media
      archival scripts.
  sources:
    - https://formulae.brew.sh/api/formula/instalooter.json
    - https://github.com/althonos/instalooter
    - https://instalooter.readthedocs.io/en/latest/changelog.html
    - https://instalooter.readthedocs.io/en/latest/index.html
    - https://pypi.org/pypi/instalooter/json
  summary:
    - >
      InstaLooter is a Python command-line downloader for Instagram pictures and videos
      from profiles, hashtags, posts, and batch files. Its own GitHub metadata describes
      it as API-less and defunct, which makes it a useful historical companion to
      better-maintained Instagram archiving tools.
  timeline:
    - '2016: GitHub repository created and 0.1.0 uploaded to PyPI.'
    - '2018: v1.0.0 released after a from-scratch rewrite.'
    - '2018: v2.0.0 addressed Instagram API changes around April 2018.'
    - '2020: v2.4.4 documented in the changelog and uploaded to PyPI.'
    - '2023: GitHub repository metadata describes the project as defunct.'
  usage:
    - >
      The documented command-line interface includes user, hashtag, post, and batch
      subcommands. Options cover credentials, output directories, number of files,
      parallel jobs, filename templates, videos, metadata dumps, time limits, and
      authenticated downloads.
    - >
      The docs describe logging in with username/password or a login subcommand, then
      storing a session cookie in a cache-specific folder. That credential behavior is
      central to how such tools handled private profiles and authenticated media access.
related-packages:
  - id: brew:instaloader
    reason: >
      Choose Instaloader for the same general Instagram media-archiving task because it
      remains actively documented and supports profiles, stories, highlights, reels,
      feeds, saved posts, metadata, and reusable sessions, while InstaLooter is
      officially defunct.
    rel: alternative
    sources:
      - https://github.com/althonos/instalooter
      - https://instaloader.github.io/
      - https://instaloader.github.io/cli-options.html
