config-file-location:
  linux:
    - ~/.config/Sononym
  macos:
    - /Users/[User Name]/Library/Application Support/Sononym
  windows:
    - C:\Users\[User Name]\AppData\Roaming\Sononym
credentials-file-location: null
history:
  adoption-history:
    - >
      Sononym launched as commercial, cross-platform software for Windows, Linux, and
      macOS, with a fully functional 30-day trial. Its official release archive
      documents continued development through workflow, metadata, duplicate-detection,
      tagging, and browsing improvements.
  package-nerd-significance:
    - >
      Sononym applies local machine-learning analysis to a user’s own sample library
      rather than limiting discovery to filenames or manually entered metadata. Its
      combination of acoustic similarity search, automatic categorization, duplicate
      detection, and cross-platform packaging makes it a distinctive desktop tool for
      large sample collections.
  project-history:
    - >
      Sononym was publicly introduced in April 2018 as a new kind of sample browser,
      with version 1.0 released on August 10, 2018. The initial release emphasized deep
      audio analysis, automatic grouping, similarity search, live-recorded queries,
      bookmarking, and export.
    - >
      Subsequent releases expanded the original discovery workflow. The official release
      archive records workflow enhancements in 1.1, stability work in 1.2,
      project-related improvements in 1.3, cross-library search and duplicate finding in
      1.4, metadata and audio-server improvements in 1.5, and faster browsing and
      tagging in 1.6.
  related-projects:
    - >
      Sononym is used alongside digital audio workstations and audio editors: users
      discover, audition, organize, and export samples in Sononym, then drag or import
      them into their production environment.
  sources:
    - https://www.sononym.net/blog/introducing-sononym/
    - https://www.sononym.net/blog/sononym-has-arrived/
    - https://www.sononym.net/categories/releases/
    - https://www.sononym.net/docs/
  summary:
    - >
      Sononym is a commercial cross-platform sample browser created for musicians and
      sound designers. It analyzes local audio collections and supports discovery by
      acoustic similarity, extracted descriptors, categories, metadata, and conventional
      text search.
  timeline:
    - '2018-04: Sononym was publicly introduced ahead of its planned first release.'
    - '2018-08: Sononym 1.0 launched for Windows, Linux, and macOS.'
    - '2019: Sononym 1.1 added community-requested workflow enhancements.'
    - '2020: Sononym 1.2 focused on stability, fixes, and selected requested features.'
    - '2021: Sononym 1.3 improved several core workflows.'
    - '2022: Sononym 1.4 added cross-library search and duplicate finding.'
    - '2023: Sononym 1.5 added metadata support and a new audio server.'
    - '2025: Sononym 1.6 delivered faster browsing, tagging, and other enhancements.'
  usage:
    - >
      Users add folders as libraries, allow Sononym to analyze their audio, and then
      browse by text, descriptors, automatic categories, or similarity to an existing or
      newly recorded sound. Results can be previewed, bookmarked into projects, tagged,
      and exported or dragged into other audio software.
