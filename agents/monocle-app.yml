history:
  adoption-history:
    - >
      Monocle is sold directly by its developer and is also distributed through Homebrew
      Cask. Version 3.0 explicitly added Homebrew support and automation through URL
      schemes, AppleScript, shell commands, and Shortcuts.
  package-nerd-significance:
    - >
      Monocle represents a newer class of focused macOS utilities that reduce visual
      distraction without rearranging or closing windows. Its Homebrew distribution and
      automation hooks make it suitable for repeatable Mac workstation setups.
  project-history:
    - >
      Dominik Heywood developed Monocle as a native macOS focus utility that visually
      suppresses background windows while leaving the active window prominent.
    - >
      Later releases added customizable blur and tint effects, gestures, automation,
      Stage Manager support, app groups, and improved multi-display behavior.
  related-projects:
    - >
      Monocle integrates with macOS Shortcuts, AppleScript, shell automation, Stage
      Manager, Spaces, and multiple-display workflows.
  sources:
    - 'Official changelog: https://www.heyiam.dk/monocle/changelog'
    - 'Official product page: https://www.heyiam.dk/monocle'
  summary:
    - >
      Monocle is a commercial macOS focus utility that dims, blurs, tints, or
      desaturates background windows while emphasizing the window currently in use.
  timeline:
    - '1.0: Monocle launched as a window-dimming focus utility.'
    - >
      3.0: The application was rebuilt with adjustable blur, gestures, automation, and
      Homebrew support.
    - >
      3.5: App groups, Stage Manager handling, multi-screen controls, and blur-free mode
      were added.
    - '3.5.1: Shortcuts scripting controls and Stage Manager refinements were expanded.'
  usage:
    - >
      Monocle runs from the macOS menu bar and automatically applies an overlay to
      windows outside the current focus context.
    - >
      Users can configure blur, tint, grain, monochrome effects, ignored applications,
      gestures, global shortcuts, multi-screen behavior, and automation commands.
