history:
  adoption-history:
    - >
      Proton VPN launched publicly after more than a year of development and a beta
      involving over 10,000 Proton Mail community members. Proton later opened the
      source code for all of its VPN clients and began publishing independent security
      audits.
  package-nerd-significance:
    - >
      The macOS client is notable to package users because it is an officially
      maintained, open-source privacy application whose source can be inspected and
      built independently. It also exposes modern VPN features such as WireGuard, kill
      switch behavior, custom DNS, and saved connection profiles.
  project-history:
    - >
      Proton launched the VPN service in 2017 as a companion to Proton Mail, with a free
      tier intended to make private internet access broadly available. In January 2020,
      Proton announced that its VPN applications for macOS, Windows, Android, and iOS
      were open source and independently audited.
  related-projects:
    - Proton Mail is the earlier Proton service whose community participated in the VPN beta.
    - The macOS and iOS clients share the official ProtonVPN/ios-mac-app repository.
    - OpenVPN and WireGuard are supported protocols for app or manual connections.
  sources:
    - https://github.com/ProtonVPN/ios-mac-app
    - https://protonvpn.com/blog/free-vpn-service-launch
    - https://protonvpn.com/blog/open-source
    - https://protonvpn.com/support/protonvpn-mac-vpn-application
  summary:
    - >
      Proton VPN is Proton AG's cross-platform virtual private network service and
      client, designed to protect network traffic and help users work around censorship.
      The macOS application is part of Proton's open-source Apple client codebase.
  timeline:
    - '2017: Proton VPN left beta and opened to the public.'
    - >
      2020: Proton open-sourced all Proton VPN applications and published independent
      audit results.
  usage:
    - >
      On macOS, users sign in with a Proton Account, allow the required network
      extension and VPN configuration, and connect automatically or select a country,
      server, or saved profile. Manual OpenVPN connections use separately generated
      OpenVPN credentials.
