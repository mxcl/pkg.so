history:
  adoption-history:
    - >
      AirBuddy expanded from an AirPods-focused Mac utility into a broader companion for
      Beats headphones, Apple mobile devices, batteries, widgets, Shortcuts, and handoff
      workflows. Continued compatibility releases track new Apple hardware and macOS
      versions.
  package-nerd-significance:
    - >
      AirBuddy is notable to Mac package users as an independently distributed,
      frequently updated system companion that exposes iOS-like accessory status and
      controls on macOS. Its Homebrew Cask availability makes an otherwise
      license-managed graphical utility reproducibly installable.
  project-history:
    - >
      Independent developer Guilherme Rambo released the first paid generation by 2019.
      AirBuddy 2 became the maintained major release, with version 2.5 arriving in 2022
      and subsequent releases adding support for newer AirPods, Beats devices, Apple
      silicon, and macOS versions. AirBuddy 3 entered public beta development in 2022
      and became the current purchasable generation in 2026.
  related-projects:
    - Apple AirPods and Beats firmware ecosystems
    - macOS Shortcuts and WidgetKit
    - Setapp distribution
  sources:
    - https://releasenotes.airbuddy.app/Beta/
    - https://releasenotes.airbuddy.app/Release/
    - https://support.airbuddy.app/
    - https://v2.airbuddy.app/upgrade
  summary:
    - >
      AirBuddy is a proprietary macOS companion utility created by Guilherme Rambo for
      viewing and controlling AirPods, Beats, and other nearby Apple devices. It adds
      battery information, alerts, widgets, automation, listening-mode controls, and
      handoff features beyond macOS's standard interface.
  timeline:
    - '2019: First-generation purchases documented by the official upgrade program'
    - '2021: AirBuddy 1 remained available while AirBuddy 2 became the newer generation'
    - '2022: AirBuddy 2.5 shipped and AirBuddy 3 public beta development began'
    - '2026: AirBuddy 3 became the current purchasable generation'
  usage:
    - >
      Users install AirBuddy on a Bluetooth Low Energy-capable Mac, leave its helper
      running in the background, and use its menu-bar interface, settings, widgets,
      Shortcuts, or AppleScript features to monitor and control supported devices.
      Activation normally uses a purchased license, while the Setapp edition uses an
      active subscription.
