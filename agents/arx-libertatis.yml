id: brew:arx-libertatis
display-name: Arx Libertatis
repo: https://github.com/arx/ArxLibertatis
docs:
  - https://wiki.arx-libertatis.org/
  - https://wiki.arx-libertatis.org/FAQ
config-file-location:
  linux:
    - ~/.config/arx/
  macos:
    - ~/Library/Application Support/ArxLibertatis/
  windows:
    - '%USERPROFILE%\My Documents\My Games\Arx Libertatis'
    - '%USERPROFILE%\Saved Games\Arx Libertatis'
credentials-file-location: null
history:
  adoption-history:
    - >
      Arx Libertatis' adoption is tied to the Arx Fatalis community and to distribution
      packaging. The website provides official Windows and Linux builds and notes
      packaging for macOS through Homebrew, FreeBSD, DragonFly BSD, NetBSD, OpenBSD,
      Haiku, and Pandora. The provided package-manager facts also list Homebrew, dnf,
      and Nix.
    - >
      Because users must supply original or demo game data, package-manager adoption
      centers on engine delivery rather than content distribution. The README documents
      `arx-install-data` for extracting/installing data from CD, demo, GOG.com
      installers, Steam installs, and other Arx Fatalis installs.
  package-nerd-significance:
    - >
      Arx Libertatis is a classic source-port packaging case. The package ships code and
      tools, but not copyrighted game assets, so package recipes must handle engine
      binaries, data search paths, launch wrappers, and user instructions cleanly.
    - >
      It is also a useful comparison point for other open engine reimplementations and
      ports: portability work, save/data migration, case-sensitive filesystem handling,
      and preserving compatibility with legacy commercial game data all become packaging
      concerns.
  project-history:
    - >
      The project exists because the Arx Fatalis engine source code was publicly
      released, while the game data remained proprietary. Arx Libertatis packages and
      modernizes that engine under GPL 3+ terms, focusing on portability, bug fixes, and
      compatibility with modern systems.
    - >
      The GitHub repository was created in January 2011. Official releases visible
      through GitHub include Arx Libertatis 1.2 in July 2021 and 1.2.1 in April 2022,
      with the website presenting 1.2.1 as the current public release at research time.
    - >
      Official documentation and the FAQ describe the project's goal as updating and
      improving Arx Fatalis to bring it up to par with modern implementations of similar
      games. Before the first release, the focus was porting the game and fixing issues
      with modern operating systems.
  related-projects:
    - >
      The Arx Libertatis website links to related Arx Fatalis resources and mods,
      including Arx Insanity, Arx Neuralis, Arx Fatalis UE4 Remastered, Arx End Of Sun,
      and a wiki page of additional Arx Fatalis mods. The FAQ also compares the idea to
      OpenMW for Morrowind.
  sources:
    - https://api.github.com/repos/arx/ArxLibertatis
    - https://api.github.com/repos/arx/ArxLibertatis/releases
    - https://arx-libertatis.org/
    - https://github.com/arx/ArxLibertatis
    - https://raw.githubusercontent.com/arx/ArxLibertatis/master/README.md
    - https://wiki.arx-libertatis.org/FAQ
    - source_facts.package-manager
  summary:
    - >
      Arx Libertatis is an open source, cross-platform engine port for Arx Fatalis,
      Arkane Studios' 2002 first-person role-playing game, dungeon crawler, and
      immersive sim. It is not a standalone free game package: users still need original
      or demo Arx Fatalis data.
  timeline:
    - '2002: Arx Fatalis released, according to the Arx Libertatis website description.'
    - '2011: ArxLibertatis GitHub repository created.'
    - '2021: Arx Libertatis 1.2 release published.'
    - '2022: Arx Libertatis 1.2.1 bugfix release published.'
  usage:
    - >
      A typical user installs the engine, obtains the original or demo Arx Fatalis data,
      installs or points Arx Libertatis at that data, then runs `arx`. The README also
      documents `arx --list-dirs`, portable directory options, and tools such as
      `arx-install-data`, `arxsavetool`, and `arxunpak`.
    - >
      The official paths matter to packagers: Linux splits user data and config between
      `~/.local/share/arx/` and `~/.config/arx/`, macOS uses `~/Library/Application
      Support/ArxLibertatis/`, and Windows uses the user's My Games or Saved Games
      directory depending on OS generation.
