history:
  adoption-history:
    - >
      The official showcase lists independent sites addressed through ENS names,
      illustrating adoption by small publishers experimenting with decentralized
      hosting.
    - >
      Planet also functions as a reader for ENS and IPNS sites and conventional RSS,
      Atom, and JSON Feed sources, so it can be adopted without operating a
      Planet-authored site.
  package-nerd-significance:
    - >
      Planet combines a native SwiftUI application, an embedded IPFS node, IPNS
      publishing, ENS naming, feed reading, and static-site generation in one macOS
      package. It is a notable desktop-native entry in the otherwise command-line-heavy
      IPFS ecosystem.
    - >
      Its export facility includes the site's IPNS key, making backups especially
      important for users who treat the app as publishing infrastructure.
  project-history:
    - >
      Planet was established as a free and open-source macOS application for publishing
      and following web content without relying on a centralized hosting service. It
      publishes through IPFS and can associate an IPNS-backed site with an Ethereum Name
      Service name.
    - >
      The project expanded beyond basic decentralized blogging with Markdown authoring,
      media attachments, templates, feed reading, offline pinning, import and export, a
      bundled command-line utility, and optional local AI-oriented features.
  related-projects:
    - IPFS and IPNS provide Planet's peer-to-peer content distribution and mutable naming.
    - Ethereum Name Service and EIP-1577 allow a .eth name to point to published content.
    - Kubo supplies the embedded IPFS implementation.
  sources:
    - https://github.com/Planetable/Planet#readme
    - https://github.com/Planetable/Planet/releases
    - https://www.planetable.xyz/
  summary:
    - >
      Planet is a free, open-source macOS application for creating and following
      decentralized blogs and websites using IPFS, IPNS, and Ethereum Name Service.
  timeline:
    - >
      Early project: Planet began as a sandboxed native macOS application for
      decentralized publishing and reading.
    - >
      2026: The official release series added a bundled `pn` command-line utility
      alongside the graphical application.
  usage:
    - >
      Authors create Markdown-based sites, publish them to IPFS, copy the resulting IPNS
      address, and can place that address in an ENS ContentHash record.
    - >
      Readers can follow ENS or IPNS sites and ordinary RSS, Atom, or JSON Feed sources;
      followed content is pinned for offline availability.
    - >
      Users should regularly export important sites because an export includes the IPNS
      key needed to retain publishing identity.
