history:
  adoption-history:
    - >
      Douyin became a major mainland-Chinese mobile video and entertainment platform,
      with its format expanding beyond music-backed short clips into livestreaming,
      search, commerce, longer video, and desktop viewing and creation.
    - >
      The macOS cask reflects Douyin's expansion beyond mobile application stores into a
      downloadable desktop client. It packages the official signed distribution
      retrieved from Douyin's own download infrastructure.
  package-nerd-significance:
    - >
      Douyin is relevant to package catalogs because a service best known as a mobile
      social platform also maintains a native desktop application distributed directly
      by the vendor. The Homebrew cask provides reproducible installation and upgrade
      metadata for that otherwise web-downloaded macOS client.
  project-history:
    - >
      ByteDance launched Douyin in China as a mobile short-video product centered on
      recording and sharing creative videos. It developed separately for the
      mainland-Chinese market while sharing a corporate lineage with the internationally
      oriented TikTok service.
    - >
      Over time Douyin broadened from a short-video application into a multi-purpose
      media platform incorporating creator tools, recommendation feeds, livestreaming,
      communication, search, and commerce.
  related-projects:
    - TikTok
    - ByteDance
    - Douyin Creator services
  sources:
    - https://www.douyin.com/
    - https://www.douyin.com/aboutus
    - https://www.douyin.com/downloadpage
  summary:
    - >
      Douyin is ByteDance's mainland-Chinese short-video and social-media platform. The
      reviewed package installs its official macOS desktop client.
  timeline:
    - '2016: Douyin was launched in China.'
    - 'Late 2010s: The service achieved mass adoption as a short-video platform.'
    - >
      2020s: Douyin expanded its livestreaming, commerce, search, creator, and desktop
      surfaces.
    - '2026: The reviewed Homebrew cask distributes Douyin 8.4.0 for macOS.'
  usage:
    - >
      Users watch recommended videos, follow creators, search content, publish videos,
      interact socially, and access livestreaming and commerce features. The desktop
      client brings core consumption and account workflows to macOS.
    - >
      The Homebrew cask is useful for installing and upgrading the vendor-provided
      desktop application without manually retrieving each disk image from Douyin's
      download page.
