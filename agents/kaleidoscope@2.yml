history:
  adoption-history:
    - >
      Version 2 brought Kaleidoscope to the Mac App Store in January 2013 and served as
      the product’s principal release line for roughly eight years.
    - >
      The new owners issued version 2.4 in 2021 with Xcode debugger integration and
      other improvements before releasing version 3. Existing v2 owners retained
      perpetual-license use rights.
  package-nerd-significance:
    - >
      The versioned Homebrew cask preserves access to a legacy, perpetually licensed Mac
      developer tool after the main cask advanced to newer commercial releases.
    - >
      Kaleidoscope 2 is also a useful example of package managers retaining old
      application generations when licensing, operating-system compatibility, or
      workflow stability makes an in-place major upgrade undesirable.
  project-history:
    - >
      Black Pixel released Kaleidoscope 2 after taking over development from Made by
      Sofa. It was the last major generation before the product’s 2020 acquisition and
      subsequent revival.
    - >
      Kaleidoscope 2.4 was used as a bridge release by the new team, adding
      developer-focused capabilities while version 3 was being prepared.
  related-projects:
    - >
      Kaleidoscope 3 succeeded this release line; Git, Xcode, Subversion, Mercurial, and
      ksdiff are closely related workflow tools.
  sources:
    - https://blog.kaleidoscope.app/2021/04/14/kaleidoscope-2-4-1/
    - https://blog.kaleidoscope.app/2021/10/12/acquiring-a-product/
    - https://blog.kaleidoscope.app/2022/03/11/app-bundles/
    - https://kaleidoscope.app/help
  summary:
    - >
      Kaleidoscope 2 is the legacy second major generation of the macOS visual diff and
      merge application, retained as a separate Homebrew cask for users of that release.
  timeline:
    - '2013: Kaleidoscope 2.0 launched and entered the Mac App Store.'
    - '2020: The product changed ownership.'
    - >
      2021: Version 2.4 added Xcode debugger integration; 2.4.1 followed with fixes and
      PDF-image handling.
    - '2021: Kaleidoscope 3 succeeded the v2 generation.'
  usage:
    - >
      Kaleidoscope 2 compares and merges text, images, and folders and can participate
      in version-control workflows through ksdiff.
    - >
      This cask is primarily useful to owners of a version 2 perpetual license or users
      maintaining an older compatible Mac workflow.
