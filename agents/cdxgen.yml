id: brew:cdxgen
display-name: CycloneDX Generator (cdxgen)
repo: https://github.com/cdxgen/cdxgen
docs:
  - https://cdxgen.github.io/cdxgen
  - https://github.com/cdxgen/cdxgen#readme
config-file-location:
  unix:
    - .cdxgenrc
    - .cdxgen.json
    - .cdxgen.yml
    - .cdxgen.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      cdxgen's adoption tracks the rise of SBOM requirements in software supply-chain
      security. The README positions it for developers, AppSec, compliance teams, SOC
      analysts, hardware teams, and AI platform teams, and the supplied package-manager
      metadata shows Homebrew, Nix, and winget packaging in addition to npm and GitHub
      release binaries.
  package-nerd-significance:
    - >
      cdxgen is package-nerd significant because it turns package graphs into
      standardized artifacts that other tools can consume. It sits at the intersection
      of language package managers, container metadata, CycloneDX, SPDX,
      Dependency-Track-style workflows, and modern compliance demands.
  project-history:
    - >
      The GitHub API records the cdxgen repository as created on 2019-12-30. Its package
      metadata identifies @cyclonedx/cdxgen as the npm package and points to the
      official GitHub repository, while the README now presents cdxgen as a broader BOM
      toolkit covering SBOM, CBOM, OBOM, SaaSBOM, HBOM, AI-BOM, and validation/signing
      workflows.
    - >
      The project grew from a CycloneDX SBOM generator into a multi-command supply-chain
      analysis suite with commands such as cdxgen, cdx-validate, cdx-convert, cdx-sign,
      cdx-verify, cdx-audit, evinse, hbom, obom, cbom, saasbom, aibom, and spdxgen.
  related-projects:
    - CycloneDX is the primary BOM specification cdxgen emits.
    - >
      OWASP Dependency-Track and depscan are adjacent downstream/security workflows
      referenced by the project documentation.
    - SPDX is supported as an export format through cdxgen and cdx-convert.
  sources:
    - https://api.github.com/repos/cdxgen/cdxgen
    - https://github.com/cdxgen/cdxgen
    - https://github.com/CycloneDX/cdxgen
    - https://cdxgen.github.io/cdxgen
    - https://github.com/cdxgen/cdxgen#readme
    - https://formulae.brew.sh/api/formula/cdxgen.json
    - https://api.github.com/repos/CycloneDX/cdxgen
    - https://raw.githubusercontent.com/CycloneDX/cdxgen/master/package.json
  summary:
    - >
      CycloneDX Generator, usually called cdxgen, is a CLI, library, REPL, and server
      for generating CycloneDX and SPDX software bill of materials documents from source
      trees, container images, binaries, hosts, and related inputs.
  timeline:
    - '2019: GitHub API records the cdxgen repository as created on 2019-12-30.'
    - >
      2024: Git tags include the v10 series, showing the project had reached a mature
      major-version cadence.
    - >
      2026: Homebrew formula packages cdxgen 12.7.0, and the README documents CycloneDX
      1.5-1.7 plus SPDX 3.0.1 support.
  usage:
    - >
      The common developer path is cdxgen -o bom.json . for a local project, with
      additional modes for containers, git URLs, purls, hosts, AI assets, and
      validation/conversion/signing. The README emphasizes CI/CD use and standalone
      binaries for several commands.
related-packages:
  - id: brew:syft
    reason: >
      Choose Syft for a focused Go-based SBOM generator with strong container and
      filesystem cataloging; choose cdxgen for broader BOM types, build-aware polyglot
      analysis, signing, validation, and SPDX export in one suite.
    rel: alternative
    sources:
      - https://github.com/cdxgen/cdxgen#readme
      - https://oss.anchore.com/syft/
      - https://github.com/anchore/syft#readme
  - id: brew:cyclonedx-cli
    reason: >
      Use CycloneDX CLI after cdxgen when generated BOMs need dedicated merging,
      diffing, format conversion, validation, signing, or signature verification.
    rel: adjacent_workflow
    sources:
      - https://github.com/cdxgen/cdxgen#readme
      - https://github.com/CycloneDX/cyclonedx-cli/blob/main/README.md
