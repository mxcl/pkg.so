history:
  adoption-history:
    - >
      IRRToolSet belongs to the operational ecosystem around RADb, RIPE, and other IRR
      databases. The Merit-operated irr.net overview says the IRR emerged early in 1995
      as providers prepared for the end of the NSFNET Backbone Service and the
      commercial Internet, and it points users to IRRToolSet on GitHub. That context
      explains why the package persists: network operators still need ways to query and
      transform IRR/RPSL policy data.
    - >
      Homebrew and MacPorts packaging make IRRToolSet available outside router-vendor
      environments, especially for engineers who want `peval`, `rpslcheck`, or
      `rtconfig` on a workstation. The upstream README also names bgpq4 as a
      better-maintained alternative for users seeking a fast IRRDB client.
  package-nerd-significance:
    - >
      IRRToolSet is significant because it packages a piece of Internet routing
      operations history. It encodes old but still recognizable assumptions about IRR
      data, Cisco and JunOS configuration generation, IPv4/IPv6 policy evolution, and
      RPSL/RPSLng syntax, making it both useful tooling and a fossil record of how
      operators automated BGP policy.
  project-history:
    - >
      The GitHub README defines IRRToolSet as tools for Internet routing policies stored
      in IRRs using Routing Policy Specification Language, with the goal of helping
      engineers automate router configuration, analyze routing policy, and maintain
      policy data. The README also notes the project's long history and mixed copyright
      across several parties.
    - >
      RIPE NCC's archived project page says the Internet Routing Registry ToolSet
      project moved to Internet Systems Consortium maintenance. The preserved NEWS file
      shows an even older RAToolSet/IRRToolSet lineage, including RPSL implementation in
      4.0.0, full RPSL compliance in 4.4.0, JunOS support in 4.6.0, RPSLng and
      IPv6-related work in 4.8.x, a 5.0.0 reorganization that left rtconfig, peval, and
      rpslcheck, and a 5.1.0 semantic-versioning release line.
  related-projects:
    - >
      IRRToolSet is related to RADb, IRRd, RIPE Database tooling, RPSL, RPSLng, bgpq4,
      router configuration generators, and BGP policy operations.
  sources:
    - https://formulae.brew.sh/formula/irrtoolset
    - https://github.com/irrtoolset/irrtoolset
    - https://irr.net/overview/
    - https://raw.githubusercontent.com/irrtoolset/irrtoolset/master/NEWS
    - https://www.apnic.net/manage-ip/apnic-services/routing-registry/
    - https://www.radb.net/
    - https://www.ripe.net/analyse/archived-projects/irrtoolset/
  summary:
    - >
      IRRToolSet is a suite for working with Internet Routing Registry routing policies
      expressed in RPSL. It is a classic network-operator package: small command-line
      tools such as `peval`, `rpslcheck`, and `rtconfig` turn registry policy data into
      checks, evaluations, and router configuration.
  timeline:
    - >
      1995: The global IRR effort emerged as providers prepared for the post-NSFNET
      commercial Internet.
    - 'IRRToolSet 4.0.0: RPSL support was implemented.'
    - 'IRRToolSet 4.4.0: The NEWS file described the toolset as fully RPSL compliant.'
    - 'IRRToolSet 4.6.0: JunOS support was added to RtConfig.'
    - 'IRRToolSet 4.8.x: RPSLng and IPv6-related support was added and refined.'
    - >
      IRRToolSet 5.0.0: The package was substantially reorganized, leaving rtconfig,
      peval, and rpslcheck.
    - '2016: IRRToolSet 5.1.0 began a semantic-versioning release line.'
    - '2019: GitHub releases list IRRToolSet 5.1.3.'
  usage:
    - >
      `peval` evaluates policy expressions, `rpslcheck` checks RPSL objects, and
      `rtconfig` generates router configuration from IRR policy. APNIC documentation
      describes tools such as IRRToolSet as useful for suggesting CIDR aggregates,
      checking aut-num objects and routes, and performing RPSL syntax checks.
related-packages:
  - id: brew:bgpq4
    reason: >
      Choose bgpq4 for a smaller, actively maintained IRR client focused specifically on
      generating prefix lists, policy terms, and AS-path filters; IRRToolSet offers
      broader RPSL evaluation and template-driven router configuration.
    rel: alternative
    sources:
      - https://github.com/irrtoolset/irrtoolset#readme
      - https://github.com/bgp/bgpq4#readme
