id: brew:leetcode-cli
display-name: leetcode-cli
repo: null
docs:
  - https://github.com/clearloop/leetcode-cli#readme
config-file-location:
  unix:
    - ~/.leetcode/leetcode.toml
credentials-file-location:
  unix:
    - ~/.leetcode/leetcode.toml
history:
  adoption-history:
    - >
      The repository shows hundreds of stars and dozens of forks, and the input package
      facts list Homebrew and Nix packaging. That puts it in the small but active
      ecosystem of terminal-first LeetCode clients used by programmers who want
      editor-centric practice instead of browser-only workflows.
  package-nerd-significance:
    - >
      The package is interesting because it packages an authenticated web-workflow CLI:
      browser cookies, local code generation, editor integration, shell completions,
      SQLite/OpenSSL build concerns, and LeetCode API changes all meet in one terminal
      tool.
  project-history:
    - >
      The project is distributed from GitHub and crates.io-style Rust installation
      paths, with the README emphasizing `cargo install leetcode-cli`, a Nix flake,
      shell completions, and local configuration.
    - >
      A notable configuration milestone appears in the v0.4.0 release on 2024-06-24,
      which introduced the documented TOML configuration layout for editor, cookies, and
      storage. Later releases expanded everyday coding-practice ergonomics, including
      daily challenge flags, LeetCode China support, environment-variable cookie
      overrides, clap-derived commands, and README/docs restructuring.
  related-projects:
    - >
      It overlaps with other LeetCode CLIs in this batch, especially `leetgo`, `leetup`,
      and older JavaScript-era LeetCode command-line clients, but clearloop's
      implementation is Rust-centered and packaged for cargo, Homebrew, and Nix users.
  sources:
    - https://crates.io/crates/leetcode-cli
    - https://github.com/clearloop/leetcode-cli
    - https://github.com/clearloop/leetcode-cli/releases
  summary:
    - >
      clearloop's `leetcode-cli` is a Rust command-line client for LeetCode workflows:
      picking problems, opening generated solution files, running sample tests,
      submitting solutions, filtering problem lists, and managing local cache data.
  timeline:
    - '2024-06-24: v0.4.0 release introduced the documented TOML configuration format.'
    - '2024-12-24: v0.5.0 release switched command definitions to clap derive.'
    - >
      2026-06-21: v0.5.1 release notes document README/docs restructuring and macOS
      Chrome-cookie fixes.
    - '2026-06-21: v0.5.2 release bundled SQLite to reduce system build dependency friction.'
  usage:
    - >
      The README's quickstart has users sign in to LeetCode in a browser, then run
      commands such as `leetcode pick`, `leetcode edit`, `leetcode test`, and `leetcode
      exec`. On macOS and Linux, the tool can read Chrome cookies automatically; manual
      cookie setup and environment-variable overrides are documented for other cases.
related-packages:
  - id: brew:leetgo
    reason: >
      leetgo is the stronger alternative when you want contest generation, broad
      language code generation, and documented local testing for Go, Python, C++, and
      Rust.
    rel: alternative
    sources:
      - https://github.com/j178/leetgo#readme
      - https://github.com/clearloop/leetcode-cli#readme
  - id: brew:leetup
    reason: >
      leetup is a smaller Rust alternative with testing and submission plus configurable
      code-fragment injection and post-generation project hooks.
    rel: alternative
    sources:
      - https://github.com/dragfire/leetup#readme
      - https://github.com/clearloop/leetcode-cli#readme
