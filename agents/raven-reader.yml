history:
  adoption-history:
    - >
      Raven was distributed for macOS, Windows, and Linux, with the official README
      documenting Homebrew Cask and Chocolatey installation alongside direct downloads.
      It supported local feeds as well as Feedbin, Inoreader, Fever, and self-hosted
      services implementing the Google Reader API.
    - >
      The final listed release, version 1.0.80, shipped in June 2023. The owner archived
      the repository in September 2023 and stated that the maintained codebase was being
      replaced by a complete rewrite.
  package-nerd-significance:
    - >
      Raven is representative of the Electron-era revival of desktop RSS clients: one
      open-source codebase produced packages for all three major desktop systems while
      retaining offline reading and optional service synchronization. Its archived
      repository and still-available packages make maintenance status important context
      for package users.
  project-history:
    - >
      Raven Reader was developed by Hello Efficiency Inc. as an open-source,
      cross-platform desktop news reader built with Electron and Vue. Its site
      emphasizes a distraction-free reading view, offline access, flexible themes and
      typography, and operation without a mandatory login.
    - >
      The public repository accumulated a broad feature set including podcasts, OPML
      import and export, Pocket and Instapaper integration, cloud-reader
      synchronization, and categorized feeds. Development of this implementation ended
      when its repository was archived in 2023.
  related-projects:
    - >
      The application integrates with Feedbin, Inoreader, Fever, Pocket, Instapaper, and
      Google Reader API-compatible servers such as FreshRSS.
    - The archived implementation used Electron, Vue, Vuex, Lovefield, and Mercury Parser.
  sources:
    - 'Official homepage: https://ravenreader.app/'
    - 'Official releases: https://github.com/hello-efficiency-inc/raven-reader/releases'
    - 'Official repository: https://github.com/hello-efficiency-inc/raven-reader'
  summary:
    - >
      Raven Reader is an open-source desktop RSS and news reader focused on
      distraction-free, offline-capable reading and optional synchronization with hosted
      or self-hosted feed services.
  timeline:
    - >
      2019: The official site carries a Hello Efficiency Inc. copyright beginning with
      this year.
    - '2023: Version 1.0.80 was released in June.'
    - '2023: The owner archived the repository on September 28 and announced a rewrite.'
  usage:
    - >
      Users subscribe to RSS feeds or synchronize an existing cloud-reader account,
      organize feeds into categories, read extracted articles without distractions, save
      content for offline use, and export or import subscriptions through OPML. No login
      is required for local use. The official site says configuration and credentials
      are encrypted, but it does not document their filesystem locations.
