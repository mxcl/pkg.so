history:
  adoption-history:
    - >
      SimPholders evolved with Apple's development stack: early releases supported older
      iOS Simulator layouts, later releases followed Mavericks and iOS 7, version 2
      added Xcode 7 plus watchOS and tvOS support, and the 3.x line added Mojave,
      Catalina, Xcode 11, and Apple Silicon compatibility.
  package-nerd-significance:
    - >
      SimPholders addresses a recurring Apple-development nuisance: locating the
      changing, opaque sandbox directories created by Simulator. It turns those paths
      and common maintenance operations into discoverable menu items and Finder-oriented
      actions.
  project-history:
    - >
      KF Interactive's SimPholders began as a menu-bar shortcut for locating and
      launching applications installed in Apple's iPhone Simulator. It expanded into
      broader simulator and sandbox management, including app-group access, storage
      reset, photo import, multi-Xcode selection, and, for a period, a FUSE-backed
      virtual filesystem called SimPhuse.
  related-projects:
    - >
      Xcode and Apple's iOS, watchOS, and tvOS Simulators provide the environments
      SimPholders manages.
    - >
      SimPhuse was an optional FUSE-based virtual filesystem integration; official
      release notes say support was removed in version 3.0.7 because of licensing
      restrictions.
  sources:
    - https://simpholders.com/
  summary:
    - >
      SimPholders is a commercial macOS menu-bar utility for navigating and managing
      application sandboxes and devices created by Apple's Simulator tooling.
  timeline:
    - 'Version 1.1: Added direct launching of applications in Simulator.'
    - 'Version 1.5: Added recent-application access and support for iOS 7 and Mavericks.'
    - >
      Version 2.0: Added Xcode 7, watchOS, tvOS, App Groups, and optional FUSE-backed
      browsing.
    - 'Version 3.0.7: Removed SimPhuse support because of FUSE licensing restrictions.'
    - 'Version 3.0.11: Added Apple Silicon support.'
  usage:
    - >
      Developers use SimPholders to reveal or copy simulated-app sandbox paths, open App
      Group containers, launch or uninstall simulated applications, reset application
      storage or whole simulators, add photos, and switch among Simulator installations
      associated with different Xcode versions.
