history:
  adoption-history:
    - >
      Repo Prompt first served a manual workflow in which developers selected repository
      files, assembled model-ready prompts, and applied proposed edits through
      reviewable diffs. It subsequently added Context Builder, MCP integration,
      CLI-agent support, and orchestration across multiple coding-agent providers.
    - >
      In June 2026, Community Edition became the active open-source development home.
      Repo Prompt Classic was retained as an archived reference for the original
      prompt-building workflow.
  package-nerd-significance:
    - >
      Repo Prompt represents the context-engineering layer that emerged around AI coding
      tools: repository trees, code maps, selected file contents, Git diffs, and token
      budgets are packaged into deliberate model context instead of being rediscovered
      independently by each agent.
    - >
      Its open-source Community Edition also serves as an inspectable native MCP server
      and agent harness, making it relevant to users who compare or combine Codex,
      Claude Code, Gemini CLI, and other MCP-compatible clients.
  project-history:
    - >
      Founder Eric Provencher began building Repo Prompt in summer 2024 as a tool for
      copying code context into models such as Claude. The product expanded from manual
      prompt construction into a native macOS context IDE with reviewable edits,
      automated context curation, MCP tools, and multi-agent orchestration.
    - >
      The project moved to a free, Apache-2.0-licensed Community Edition in 2026. The
      official announcement designated github.com/repoprompt/repoprompt-ce as the active
      development repository.
  related-projects:
    - >
      Repo Prompt integrates with MCP-compatible clients and coding agents including
      Codex, Claude Code, Gemini CLI, and OpenCode.
    - >
      Repo Prompt Classic is the archived predecessor to the actively developed
      Community Edition.
  sources:
    - https://github.com/repoprompt/repoprompt-ce
    - https://repoprompt.com/
    - https://repoprompt.com/blog/context-over-convenience
    - https://repoprompt.com/blog/repo-prompt-community-edition
    - https://repoprompt.com/docs
  summary:
    - >
      Repo Prompt is a native macOS environment for curating repository context and
      coordinating AI coding agents. Its Community Edition combines file selection, code
      maps, Git context, MCP tools, agent sessions, and reviewable handoffs.
  timeline:
    - 'Summer 2024: Development began around a manual code-context and prompt-copying workflow.'
    - >
      2025: The product emphasized context engineering, planning, and reviewable
      model-generated edits.
    - 'June 2026: Repo Prompt Community Edition became the active open-source development home.'
  usage:
    - >
      Users open one or more repository roots, select or automatically curate relevant
      files and code maps, add task instructions and Git context, and hand the resulting
      context to a reasoning model or coding agent.
    - >
      Agent Mode and the bundled MCP server can launch, coordinate, steer, and inspect
      external coding-agent sessions. Community Edition is intended for current
      development, while Classic remains available for established manual
      prompt-building workflows.
