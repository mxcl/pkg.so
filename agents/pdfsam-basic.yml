history:
  adoption-history:
    - >
      PDFsam Basic is distributed for macOS, Windows, and Linux, including installable
      and portable forms, and performs its PDF operations locally rather than uploading
      documents to a third party.
    - >
      The project also supports command-line use and documents deployment-oriented
      topics such as silent installation, Java runtime behavior, workspaces, and memory
      tuning.
  package-nerd-significance:
    - >
      PDFsam Basic is a long-standing open-source desktop utility that packages common
      structural PDF operations without requiring a full PDF editor or a cloud service.
    - >
      Its evolution from a Java application requiring a separately installed Java
      8/JavaFX runtime to a self-contained jlinked distribution illustrates a
      significant packaging shift for desktop Java software.
  project-history:
    - >
      PDFsam Basic—originally expanded as PDF Split and Merge—was created as a
      multi-platform utility for manipulating PDF page structures.
    - >
      Earlier releases were licensed under GPLv2. From version 3 onward, PDFsam Basic
      adopted the GNU Affero General Public License and used JavaFX; version 4 changed
      distribution by bundling a jlinked Java runtime instead of requiring users to
      install Java 8 with JavaFX.
  related-projects:
    - >
      PDFsam Visual and PDFsam Enhanced are related commercial PDF applications offered
      by the same organization.
    - JavaFX supplies the desktop user-interface platform used by PDFsam Basic.
  sources:
    - https://github.com/torakiki/pdfsam/blob/master/README.md
    - https://pdfsam.org/documentation/
    - https://pdfsam.org/download-pdfsam-basic/
  summary:
    - >
      PDFsam Basic is a free, open-source, cross-platform desktop tool for splitting,
      merging, rotating, mixing, and extracting PDF pages.
  timeline:
    - 'Version 3: PDFsam Basic moved from GPLv2 to AGPLv3 and required Java 8 with JavaFX.'
    - >
      Version 4: PDFsam Basic became a self-contained application bundling a jlinked
      Java runtime.
  usage:
    - >
      Users select PDF files, choose an operation such as merge, split, rotate, mix, or
      extract, configure page ranges and output names, and write new PDF files locally.
    - >
      Workspaces can preserve recurring task configurations, while command-line and
      documented properties support automation and advanced tuning.
    - PDFsam Basic does not require account credentials for its core local operations.
