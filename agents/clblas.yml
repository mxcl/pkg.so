history:
  adoption-history:
    - >
      clBLAS became a packaged OpenCL numerical library for developers targeting
      heterogeneous computing before vendor-neutral GPU math stacks consolidated. The
      batch metadata lists Homebrew, MacPorts, Nix, Ubuntu, and openSUSE packaging, with
      related client/development package names.
    - >
      Its upstream release train appears to have slowed after the 2.12 bugfix rollup,
      but the package remains historically important as one of the recognizable OpenCL
      BLAS implementations available through Unix package managers.
  package-nerd-significance:
    - >
      clBLAS matters to package nerds because it packages GPU math as a shared library
      plus tooling in a way that depends on OpenCL ICDs, driver quality, CPU/GPU device
      behavior, and architecture-specific correctness. Its changelog is full of driver,
      GPU-family, and routine-specific caveats, the kind of details that make numerical
      GPU libraries unusually packaging-sensitive.
  project-history:
    - >
      The repository changelog carries AMD copyright from 2013 and records version 1.0
      as the initial release, initially Linux64-only. Version 1.10 in April 2013
      expanded level-1 coverage and tested against AMD APP SDK and runtime driver
      versions.
    - >
      The modern README says the repository houses the OpenCL BLAS portion of clMath and
      that APPML 1.12 was the current generally available pre-packaged binary release
      for Linux and Windows. A January 2017 update note identifies v2.12 as a bugfix
      rollup from the develop branch.
  related-projects:
    - clMath is the broader AMD library family named by the README.
    - OpenCL is the compute API used directly by clBLAS callers.
    - Netlib BLAS is the routine model referenced by the README.
    - clMAGMA appears in the changelog as a test/compatibility consumer.
    - >
      CLBlast is a later tunable OpenCL BLAS library that explicitly compares itself
      with clBLAS.
  sources:
    - https://github.com/clMathLibraries/clBLAS#readme
    - https://raw.githubusercontent.com/clMathLibraries/clBLAS/master/CHANGELOG
    - https://github.com/clMathLibraries/clBLAS/wiki
  summary:
    - >
      clBLAS is the OpenCL BLAS component of AMD's clMath libraries. Its README
      describes a full BLAS level 1, 2, and 3 implementation that generates and enqueues
      optimized OpenCL kernels while leaving OpenCL state management under user control.
  timeline:
    - '2013: Version 1.0 is recorded as the initial release.'
    - '2013: Version 1.10 is released in April with additional level-1 routines.'
    - '2017: Version 2.12 is described as a bugfix rollup from the develop branch.'
    - '2017: v2.12 tags are present in the official Git repository.'
  usage:
    - >
      Developers use clBLAS by creating OpenCL contexts, queues, and buffers, calling
      clblasSetup, invoking BLAS routines such as clblasSgemm, waiting for events,
      reading buffers, and finally calling clblasTeardown. The README example shows this
      explicit OpenCL-buffer style.
related-packages:
  - id: brew:clblast
    reason: >
      Choose CLBlast when you want a newer OpenCL BLAS implementation with built-in
      device tuners; its upstream documentation explicitly positions it as a tunable
      alternative to clBLAS.
    rel: alternative
    sources:
      - https://github.com/CNugteren/CLBlast#readme
      - https://github.com/clMathLibraries/clBLAS#readme
