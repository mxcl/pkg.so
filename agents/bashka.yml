id: brew:bashka
display-name: bashka
repo: null
docs:
  - https://github.com/dmtrKovalenko/bashka#readme
config-file-location:
  unix:
    - ~/.config/bashka/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official project provides installation through Homebrew, Cargo,
      cargo-binstall, mise, release binaries, and its own reviewed installation script.
      Homebrew packaging is also recorded in source_facts.package-manager.
  package-nerd-significance:
    - >
      bashka addresses a long-standing package-installation tension: one-line shell
      installers are convenient but execute remotely supplied code immediately. It
      inserts a review and policy layer while retaining the familiar pipeline workflow,
      and adds a lightweight registry for updating and removing software installed this
      way.
  project-history:
    - >
      bashka was created as a safety guard for the `curl … | bash` installation pattern.
      It parses installer scripts, follows forwarded scripts, scores behaviors such as
      credential access, exfiltration, unsafe deletion, TLS weakening, and persistence,
      and asks the user how to proceed.
    - >
      The project subsequently paired static inspection with package-like lifecycle
      tracking. It records installed files and source installers so users can list,
      inspect, update, or remove software handled through bashka.
  related-projects:
    - curl supplies installer content in the common pipeline pattern.
    - Bash and sh are the script interpreters bashka analyzes and mediates.
    - pacman inspired the presentation of bashka's installation registry.
  sources:
    - https://github.com/dmtrKovalenko/bashka#readme
    - source_facts.package-manager
  summary:
    - >
      bashka is a command-line static-analysis and lifecycle-management tool for shell
      installation scripts. Appending `ka` to the conventional `curl … | bash` pipeline
      routes the script through security checks before execution.
  timeline:
    - >
      The public project established script-chain analysis, configurable security flags,
      and an installation registry as its core feature set.
  usage:
    - >
      A typical invocation pipes a downloaded installer to `bashka`. Findings are
      classified from positive signals and advisories through dangerous or critically
      malicious behaviors, after which configured interaction rules determine whether to
      ask, abort, or proceed.
    - >
      Users can customize checks in `~/.config/bashka/config.toml` and manage reviewed
      installations with `bashka list`, `bashka info`, `bashka update`, and `bashka
      remove`. The project cautions that static analysis cannot completely reason about
      arbitrary Bash programs.
