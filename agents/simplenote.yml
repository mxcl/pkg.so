history:
  adoption-history:
    - >
      Simplenote became a multi-platform service spanning the web, macOS, Windows,
      Linux, iOS, and Android. Automattic's acquisition of Simperium brought the service
      into the WordPress.com company's portfolio, while later open-sourcing of all
      official clients encouraged community contributions.
  package-nerd-significance:
    - >
      Simplenote is notable for pairing a deliberately minimal, text-first interface
      with automatic cross-device synchronization. Its official clients are open source,
      its Electron client is installable through desktop package managers, and its
      support for Markdown, plain-text import and export, tags, and version history
      makes it attractive to users who prefer portable text workflows.
  project-history:
    - >
      Simplenote was already publicly documented in 2009 as a focused text-note
      application. It later became associated with Simperium, the synchronization
      technology used to store and synchronize notes across platforms. Automattic
      acquired Simperium and Simplenote in 2013.
    - >
      The Windows and Linux Electron client was open-sourced in March 2016. In August
      2016, Automattic announced that the iOS, Android, and macOS clients were also
      available under GPLv2, making every official client open source.
  related-projects:
    - Simperium supplies the synchronization layer used by Simplenote.
    - >
      Automattic maintains the official Simplenote clients and acquired Simplenote with
      Simperium.
    - >
      The native macOS, iOS, and Android clients are maintained in separate official
      repositories.
  sources:
    - https://github.com/Automattic/simplenote-electron
    - https://simplenote.com/blog/?s=open+source
    - https://simplenote.com/blog/page/2/?s=simplenote
    - https://simplenote.com/developers/
    - https://simplenote.com/help/
  summary:
    - >
      Simplenote is a cross-platform, text-focused note-taking and synchronization
      service maintained by Automattic. Its official clients emphasize fast search,
      tags, Markdown, version history, offline editing, and automatic synchronization.
  timeline:
    - '2009: Official blog archives document Simplenote as a focused text-note application.'
    - '2013: Automattic acquired Simplenote and its creator, Simperium.'
    - '2016: The Windows and Linux Electron client became open source.'
    - '2016: Automattic released all remaining official Simplenote clients under GPLv2.'
  usage:
    - >
      Users create and organize text notes with tags, search, checklists, internal
      links, and optional Markdown formatting. Notes synchronize automatically among
      signed-in devices and can also be edited offline before synchronizing after
      reconnection.
    - >
      The desktop and web applications support importing Simplenote exports, plain-text
      or Markdown files, and—on supported desktop clients—Evernote exports. Users can
      export their notes and tags as an archive for backup or migration.
