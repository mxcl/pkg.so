history:
  adoption-history:
    - >
      GZDoom became a major target for advanced Doom modifications because it combined
      ZDoom compatibility with hardware-accelerated rendering and progressively added
      features such as 3D floors, dynamic lights, models, true-color rendering, and
      ZScript.
    - >
      Its compatibility with Doom-family game data and large body of ZDoom-oriented
      modding documentation made it both a player-facing source port and a development
      platform for standalone games and mods. The supplied metadata records Homebrew
      cask distribution.
  package-nerd-significance:
    - >
      GZDoom sits at the intersection of source-port culture, preservation, modding, and
      engine development. Packaging the engine is useful, but users generally still
      provide legally obtained IWAD game data separately.
    - >
      Its configuration, save-game, screenshot, autoload, and mod-search paths are
      meaningful operational details, while its scripting and renderer features make it
      much more than a compatibility launcher.
  project-history:
    - >
      GZDoom was created and maintained by Christoph Oelckers as a 3D-accelerated source
      port derived from ZDoom. It initially used the ZDoom 2.0.96x community build and
      later tracked official ZDoom development.
    - >
      The project added an OpenGL renderer and an extensive collection of engine and
      modding capabilities, including dynamic lighting, 3D floors, model support, true
      color, and ZScript. The official wiki now identifies UZDoom as its successor.
  related-projects:
    - ZDoom is GZDoom's principal upstream lineage.
    - UZDoom is identified by the official wiki as GZDoom's successor.
    - >
      The engine supports content from Doom and related games including Heretic, Hexen,
      and Strife.
  sources:
    - https://github.com/ZDoom/gzdoom
    - >
      https://github.com/ZDoom/gzdoom/blob/master/src/common/platform/posix/osx/i_specialpaths.mm
    - https://zdoom.org/wiki/GZDoom
    - source_facts.package-manager.brew-cask
  summary:
    - >
      GZDoom is a hardware-accelerated Doom-family source port descended from ZDoom and
      maintained for both playing classic game data and running sophisticated modern
      mods.
  timeline:
    - 'Early development: GZDoom began from the ZDoom 2.0.96x community build.'
    - >
      Later development: The port moved onto official ZDoom versions and continued
      adding renderer and scripting capabilities.
    - '2026: The official ZDoom Wiki described GZDoom as superseded by UZDoom.'
  usage:
    - >
      Players launch GZDoom with an IWAD from a supported Doom-family game, then
      optionally load WAD or PK3 mods, maps, gameplay conversions, and visual
      enhancements.
    - >
      Mod authors use ZScript, ACS, DECORATE-compatible content, custom assets, models,
      dynamic lights, and other engine extensions documented by the ZDoom Wiki.
