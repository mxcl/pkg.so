history:
  adoption-history:
    - >
      Trimmy is distributed as a signed macOS menu-bar application, through Homebrew,
      and from GitHub Releases. Its repository also publishes a headless command-line
      component, including Linux release artifacts, extending the trimming engine beyond
      the macOS interface.
  package-nerd-significance:
    - >
      Trimmy addresses a small but familiar command-line hazard: copied multiline
      commands may execute in pieces, retain prompt gutters, or leave the shell waiting
      for unfinished quoting. It is especially relevant to package and infrastructure
      work, where commands copied from READMEs, chats, and generated answers often
      contain continuations, pipes, redirects, and indentation.
  project-history:
    - >
      Peter Steinberger created Trimmy as an open-source Swift menu-bar utility that
      recognizes command-shaped clipboard contents and rewrites them into a single
      pasteable command. The project subsequently added context-sensitive rules for
      terminal applications, manual original-versus-trimmed paste actions, Markdown
      reflow, URL cleanup, and a reusable CLI.
    - >
      The project emphasizes local processing: its official documentation says clipboard
      contents remain on the Mac, with no authentication or telemetry and network use
      limited to update checks.
  related-projects:
    - The official README points to a community Alfred workflow inspired by Trimmy.
    - >
      Trimmy's command cleanup is useful with Terminal, iTerm, Ghostty, Warp, kitty,
      WezTerm, Hyper, Alacritty, and cmux.
  sources:
    - https://github.com/steipete/Trimmy#readme
    - https://github.com/steipete/Trimmy/releases
    - https://trimmy.app/
  summary:
    - >
      Trimmy is an open-source macOS menu-bar clipboard utility and companion CLI that
      flatten multiline shell commands for safer single-paste execution.
  timeline:
    - >
      2026: Trimmy was publicly distributed from its official website, GitHub Releases,
      and a Homebrew tap.
    - >
      2026: The release line expanded beyond command flattening with context-aware
      terminal rules, text reflow, URL cleanup, and packaged Linux CLI artifacts.
  usage:
    - >
      Trimmy watches for clipboard changes and, when text resembles a shell command,
      removes prompt gutters and joins continuations and lines according to a
      configurable sensitivity. Users can paste either the transformed or original text,
      exclude applications or sites, or run the same engine in scripts through the CLI.
