history:
  adoption-history:
    - >
      Kingsoft described WPS as a leading domestically developed office application in
      China and reported about 40 million monthly active users for WPS Mobile Office in
      2013. It has been offered to individual, enterprise, government, and educational
      users, with free personal editions helping expand its user base.
  package-nerd-significance:
    - >
      WPS is historically important as a long-lived non-Microsoft office lineage
      originating in Chinese-language word processing. Its Homebrew Cask makes the macOS
      client reproducibly discoverable and installable alongside other desktop
      productivity tools.
  project-history:
    - >
      WPS originated with WPS 1.0 in 1989, after Kingsoft's founding in 1988. It grew
      from Chinese-language word processing into an office suite spanning documents,
      spreadsheets, presentations, PDF features, cloud collaboration, and desktop and
      mobile platforms.
    - >
      Kingsoft launched WPS Mobile Office for Android in 2011 and for iOS in 2013. By
      2019, WPS Office's international suite included macOS support.
  related-projects:
    - >
      The broader product family includes WPS 365, WPS AI, Kingsoft Docs, and WPS
      clients for Windows, Linux, iOS, and Android.
  sources:
    - >
      Kingsoft business filing describing WPS history and adoption:
      https://ir.kingsoft.com/static-files/20e36628-aa8d-4d52-b4bd-08a8cc8dd305
    - 'Kingsoft company history: https://www.kingsoft.com/iksnet/aboutus'
    - 'Official WPS Office for Mac page: https://mac.wps.cn/'
    - 'Official WPS learning center: https://www.wps.cn/learning?chan=pc_web_official'
    - source_facts.package-manager
  summary:
    - >
      WPS Office for Mac is the macOS edition of Kingsoft Office's long-running
      productivity suite, combining word processing, spreadsheets, presentations, PDF
      features, templates, and online collaboration.
  timeline:
    - '1988: Kingsoft was founded and the original WPS code was developed.'
    - '1989: WPS 1.0 launched as an early Chinese-language word processor.'
    - '2011: WPS Mobile Office launched for Android.'
    - '2013: WPS Mobile Office launched for iOS.'
    - "2019: WPS Office's international suite included macOS support."
  usage:
    - >
      The Mac client is used to create and edit documents, spreadsheets, presentations,
      and PDFs, and to work with online documents and collaborative features. The
      official Mac download page provides separate builds for Apple silicon and Intel
      Macs.
