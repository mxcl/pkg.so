id: brew:libpq@17
display-name: libpq@17
repo: https://git.postgresql.org/git/postgresql.git
docs:
  - https://www.postgresql.org/docs/17/app-psql.html
  - https://www.postgresql.org/docs/17/libpq.html
config-file-location:
  unix:
    - psqlrc in the directory reported by pg_config --sysconfdir
    - ~/.psqlrc
    - pg_service.conf in the directory reported by pg_config --sysconfdir
    - ~/.pg_service.conf
  windows:
    - '%APPDATA%\postgresql\psqlrc.conf'
    - '%APPDATA%\postgresql\.pg_service.conf'
credentials-file-location:
  unix:
    - ~/.pgpass
  windows:
    - '%APPDATA%\postgresql\pgpass.conf'
history:
  adoption-history:
    - >
      The PostgreSQL versioning policy gives each major version five years of support
      from first release. For PostgreSQL 17, the policy table lists 2024-09-26 as first
      release and 2029-11-08 as final release, which creates a long window where
      version-pinned client packages remain useful.
    - >
      Homebrew publishes `libpq@17` as a keg-only formula beside the unversioned `libpq`
      and `libpq@16`. This lets users keep PostgreSQL 17 client binaries available for
      applications, CI, and operational scripts that have standardized on the 17.x
      toolchain.
  package-nerd-significance:
    - >
      `libpq@17` matters because database clients are not just leaf applications; they
      are build inputs, migration tools, and production-adjacent utilities. Keeping a
      versioned keg lets package managers serve that dependency without forcing all
      users onto a single PostgreSQL major.
    - >
      The formula also captures the packaging compromise around PostgreSQL's annual
      major releases: users need supported older client lines for years, but package
      managers need a clean default. Versioned, keg-only formulae are the small
      mechanism that makes both true.
  project-history:
    - >
      PostgreSQL grew from the Berkeley POSTGRES research system that began
      implementation in 1986. Postgres95 added SQL support and `psql` in 1994, and the
      PostgreSQL name was chosen in 1996 to reflect the link between POSTGRES and SQL
      capability.
    - >
      PostgreSQL 17 was released on 2024-09-26. The press kit highlighted vacuum memory
      improvements, storage and high-concurrency performance work, bulk loading and
      export speedups, SQL/JSON `JSON_TABLE`, logical replication improvements, and new
      administrative utilities such as `pg_createsubscriber`.
  related-projects:
    - >
      PostgreSQL 17 server, PostgreSQL client utilities, the unversioned Homebrew
      `libpq` formula, `libpq@16`, libpq-based language drivers, and database migration
      or backup tooling are the main related projects.
  sources:
    - https://formulae.brew.sh/formula/libpq@17
    - https://www.postgresql.org/about/press/presskit17/
    - https://www.postgresql.org/docs/17/app-psql.html
    - https://www.postgresql.org/docs/17/libpq.html
    - https://www.postgresql.org/docs/current/history.html
    - https://www.postgresql.org/support/versioning/
  summary:
    - >
      libpq@17 is Homebrew's PostgreSQL 17 client-library formula: libpq and the
      PostgreSQL client tools pinned to the 17 major line. Its role is to keep
      PostgreSQL 17 client development and operations reproducible while newer major
      versions can be installed separately.
  timeline:
    - '1986: Berkeley POSTGRES implementation began.'
    - '1994: Postgres95 added SQL support and `psql`.'
    - '1996: PostgreSQL became the project name.'
    - '2024-09-26: PostgreSQL 17 was released.'
    - >
      2029-11-08: PostgreSQL's versioning table lists the final release date for
      PostgreSQL 17.
  usage:
    - >
      Typical use is selecting PostgreSQL 17's `psql`, `pg_dump`, `pg_restore`,
      `pg_config`, and libpq headers for builds or operational scripts. The versioned
      formula is useful when application infrastructure has standardized on PostgreSQL
      17 but a workstation or build host also carries another PostgreSQL major.
related-packages:
  - id: brew:libpq
    reason: >
      Choose the unversioned formula when you want Homebrew's current default PostgreSQL
      client line instead of remaining pinned to major version 17.
    rel: alternative
    sources:
      - https://formulae.brew.sh/formula/libpq
      - https://formulae.brew.sh/formula/libpq@17
      - https://www.postgresql.org/support/versioning/
  - id: brew:libpq@16
    reason: >
      Choose this when builds or administrative workflows must remain aligned with the
      supported PostgreSQL 16 client toolchain.
    rel: alternative
    sources:
      - https://formulae.brew.sh/formula/libpq@16
      - https://formulae.brew.sh/formula/libpq@17
      - https://www.postgresql.org/support/versioning/
  - id: brew:postgresql@17
    reason: >
      Install the full PostgreSQL 17 package when the version-matched libpq clients must
      be paired with a locally managed PostgreSQL 17 server.
    rel: adjacent_workflow
    sources:
      - https://formulae.brew.sh/formula/postgresql@17
      - https://www.postgresql.org/docs/17/index.html
tags:
  - c-api
  - cli
  - client-library
  - database
  - postgresql
provenance:
  category-sources:
    - 'source_facts.description: Postgres C API library.'
  display-name-sources:
    - source_facts.name.
  docs-sources:
    - >
      source_facts.homepage is the official PostgreSQL 17 libpq documentation;
      PostgreSQL 17 docs also include psql.
  history-sources:
    - https://formulae.brew.sh/formula/libpq@17
    - https://www.postgresql.org/about/press/presskit17/
    - https://www.postgresql.org/docs/17/app-psql.html
    - https://www.postgresql.org/docs/17/libpq.html
    - https://www.postgresql.org/docs/current/history.html
    - https://www.postgresql.org/support/versioning/
  repo-sources:
    - >
      Official PostgreSQL Gitweb summary says postgresql.git is the main PostgreSQL git
      repository and lists this HTTPS URL.
  tags-sources:
    - source_facts.description and source_facts.executables.
category-confidence: high
category-path:
  - developer-tools
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
