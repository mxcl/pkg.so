history:
  adoption-history:
    - >
      Ripcord was distributed for Windows, macOS, and Linux and targeted users wanting a
      smaller, native alternative to browser-based Slack and Discord clients.
    - >
      The developer explicitly permitted unmodified releases to be redistributed and
      managed through package managers, subject to the project's shareware rules. Slack
      functionality was positioned as paid shareware, while payment for Discord-only use
      remained optional during the preview period.
  package-nerd-significance:
    - >
      Ripcord appealed to users dissatisfied with the resource use of browser-based
      desktop chat applications. Its native Qt interface, cross-platform archives,
      permissive package-manager redistribution terms, and old-school shareware model
      make it a distinctive desktop package.
    - >
      The official release notes also connect Ripcord to PhantomStyle, an open-source Qt
      styling engine originally designed for the client.
  project-history:
    - >
      Ripcord is an independently developed desktop client for Slack and Discord. Its
      developer emphasized a compact traditional interface, low CPU and memory use,
      multiple accounts and windows, and the absence of tracking or forced updates.
    - >
      The documented 0.4 series was actively developed during 2019 and 2020, adding a
      custom Qt styling engine, richer Slack and Discord support, and an experimental
      shareware licensing system. The official download page records its later
      cross-platform release in June 2021.
  related-projects:
    - Slack
    - Discord
    - PhantomStyle
  sources:
