  summary:
    - >
      Ripcord is an independent, native desktop chat client for Slack and Discord
      designed for a compact interface and low resource usage.
  timeline:
    - >
      2019: The 0.4 series introduced Ripcord's custom PhantomStyle interface and
      expanded Slack and Discord support.
    - '2019: Ripcord began testing its shareware licensing system.'
    - '2021: The official site published its last documented cross-platform release.'
  usage:
    - >
      Users connect Slack or Discord accounts and organize conversations through tabs,
      multiple windows, multiple accounts, configurable appearance, bookmarks, and
      optional Discord voice chat.
    - >
      Slack users can purchase a non-subscription shareware license. The official page
      says the client has no tracking, installer, or forced updates.
