history:
  adoption-history:
    - >
      The tool became the practical automation client for Archive users because it is
      maintained alongside Archive APIs and documented in the Archive developer portal.
      It is distributed through PyPI/pipx and downloadable binaries, while third-party
      package managers such as Homebrew, Debian, Ubuntu, MacPorts, and Nix also package
      it. The upstream README warns that third-party package-manager builds may lag
      behind supported install methods, which is itself a useful adoption signal: people
      want it in system package managers even when upstream prefers Python-native
      distribution.
  package-nerd-significance:
    - >
      `internetarchive` is one of the more consequential packages in this batch because
      it is infrastructure for digital preservation work. For package nerds, it is a
      case study in the tension between Python packaging, standalone binaries, official
      service tooling, and distro/Homebrew lag: the same command is both an API client
      and an operational tool for a public digital library.
  project-history:
    - >
      The GitHub repository was created in August 2012. Internet Archive's own 2019 blog
      history says the client started in 2012 and was overseen primarily by Archive
      employee Jake Johnson, with the `internetarchive` client serving both as a library
      set and as a command-line program for broad Archive interactions.
    - >
      The package reached a 1.0 release in 2016 after a series of 0.9 releases. Later
      work continued through PyPI, GitHub releases, binary `ia` downloads, and
      documentation under the Internet Archive developer portal. The README also records
      a security-driven maintenance path, including explicit upgrade guidance for
      versions affected by a directory traversal vulnerability.
  related-projects:
    - >
      The package connects directly to Archive.org APIs, including metadata and item
      services documented in the developer portal. It also overlaps with `ia` binary
      distribution, Python API clients, and preservation workflows used by
      Archive-adjacent communities.
  sources:
    - >
      Official GitHub README, Internet Archive developer documentation, Internet Archive
      blog history, GitHub release metadata, PyPI metadata, and Homebrew formula
      metadata.
  summary:
    - >
      `internetarchive` is the official-ish Python library and `ia` command-line client
      for working with archive.org services. It gives archivists, librarians,
      researchers, and automation-heavy users a scriptable interface for search,
      download, upload, metadata changes, and other Archive workflows that are awkward
      to repeat through the website.
  timeline:
    - '2012: The repository was created and the Internet Archive client effort began.'
    - '2013: Early PyPI releases in the 0.2 series established public Python packaging.'
    - '2016: The project published its 1.0.0 release on GitHub.'
    - '2019: Internet Archive published a history and usage post for the `ia` client.'
    - '2026: The 5.x line continued with PyPI and Homebrew packaging metadata.'
  usage:
    - >
      The official CLI docs describe `ia` as installed with the Python module or
      available as a binary, then used to interact with archive.org services from the
      command line. Common workflows include configuring Archive credentials, searching,
      downloading, uploading, modifying metadata, and scripting bulk operations.
