history:
  adoption-history:
    - >
      TeamViewer distributed QuickJoin as a reduced-function participant client
      alongside its full desktop client. It was suitable for invitees who only needed to
      enter a meeting rather than host one or install the complete remote-control
      product.
  package-nerd-significance:
    - >
      QuickJoin represents the single-purpose companion-app pattern common in older
      enterprise software: package managers could deliver a narrowly scoped participant
      client separately from the much larger TeamViewer suite. Its continued cask
      identity also preserves a distinction that TeamViewer’s newer unified client is
      phasing out.
  project-history:
    - >
      QuickJoin was developed as TeamViewer’s lightweight meeting-join module.
      TeamViewer manuals documented both a standard module and license-holder
      customization, including preconfigured meeting IDs and branding.
    - >
      TeamViewer subsequently moved meeting participation into its principal desktop
      client. Its current documentation says the meeting feature is in final sunset
      planning and points readers to an announcement concerning the QuickJoin app and
      meeting.teamviewer.com.
  related-projects:
    - TeamViewer
    - TeamViewer Meeting
    - TeamViewer QuickSupport
  sources:
    - >
      Official TeamViewer Meeting manual:
      https://dl.teamviewer.com/docs/en/v15/TeamViewer-Manual-Meeting-en.pdf
    - >
      Official TeamViewer meeting knowledge base:
      https://www.teamviewer.com/en/global/support/knowledge-base/teamviewer-remote/meeting/create-and-join-a-meeting/
    - source_facts.description
    - source_facts.package-manager.brew-cask
  summary:
    - >
      TeamViewer QuickJoin is a lightweight TeamViewer module for entering online
      meetings and presentations without the full TeamViewer client. The Homebrew cask
      packages the macOS QuickJoin application as a distinct desktop artifact.
  timeline:
    - >
      2013 or earlier: TeamViewer manuals document QuickJoin as a customizable
      meeting-participant module.
    - >
      2025: TeamViewer’s current meeting documentation describes the meeting feature as
      being in final sunset planning.
  usage:
    - >
      A participant launches QuickJoin, supplies the meeting ID—and a password when
      required—and joins a session organized by a TeamViewer user. Customized modules
      could embed meeting details so invitees joined with less manual setup.
