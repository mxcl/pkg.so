id: brew:cloudflare-wrangler
display-name: Wrangler
repo: https://github.com/cloudflare/workers-sdk
docs:
  - https://developers.cloudflare.com/workers/wrangler
config-file-location:
  macos:
    - ~/Library/Preferences/.wrangler/config/default.toml
  unix:
    - ~/.wrangler/config/default.toml
    - ~/.config/.wrangler/config/default.toml
    - $XDG_CONFIG_HOME/.wrangler/config/default.toml
credentials-file-location:
  macos:
    - ~/Library/Preferences/.wrangler/config/default.toml
  unix:
    - ~/.wrangler/config/default.toml
    - ~/.config/.wrangler/config/default.toml
    - $XDG_CONFIG_HOME/.wrangler/config/default.toml
history:
  adoption-history:
    - >
      Official Cloudflare documentation presents Wrangler as the standard CLI for
      Workers development. Package-manager metadata in this batch shows the Homebrew
      formula alongside MacPorts, Nix, and Arch packaging, while Cloudflare's primary
      installation path remains the JavaScript package ecosystem.
    - >
      GitHub release metadata shows the workers-sdk monorepo publishing frequent
      wrangler-tagged releases through 2026, which is a useful signal for maintainers
      because the Homebrew package tracks a fast-moving upstream CLI rather than a slow
      system utility.
  package-nerd-significance:
    - >
      Wrangler is interesting to package maintainers because it is a Node-based,
      vendor-owned cloud CLI distributed both through npm-style workflows and
      operating-system package managers. That creates the usual tension between fast
      upstream release cadence, lockfile-heavy JavaScript packaging, and distro
      expectations for reproducibility.
    - >
      The Homebrew formula name cloudflare-wrangler also preserves a vendor-qualified
      package identity even though the executable is wrangler, which helps avoid
      namespace ambiguity with unrelated tools.
  project-history:
    - >
      Cloudflare introduced Wrangler as a Workers-focused CLI during the early growth of
      Workers as an edge/serverless platform. The original public Wrangler repository
      was created in 2019 and later archived as the v1 codebase, with current
      development consolidated into the workers-sdk monorepo that Cloudflare describes
      as home to Wrangler.
    - >
      The move into workers-sdk matched Wrangler's broadening role: it stopped being
      only a deploy command for Worker scripts and became the CLI surface for local
      development, configuration files, environments, asset workflows, and other
      Cloudflare developer-platform features.
  related-projects:
    - Cloudflare Workers is the runtime and deployment target Wrangler primarily manages.
    - >
      workers-sdk is the official monorepo that contains Wrangler and adjacent Workers
      developer tooling.
    - >
      Miniflare and workerd are related pieces of the local/runtime tooling stack around
      Workers development.
  sources:
    - https://developers.cloudflare.com/workers/wrangler/
    - https://developers.cloudflare.com/workers/wrangler/configuration/
    - https://github.com/cloudflare/workers-sdk
    - https://github.com/cloudflare/wrangler-legacy
  summary:
    - >
      Wrangler is Cloudflare's command-line interface for building, previewing,
      configuring, and deploying Cloudflare Workers and related developer-platform
      resources. The modern package lives in the official Cloudflare Workers SDK
      monorepo, while the earlier Wrangler v1 repository is archived as wrangler-legacy.
  timeline:
    - >
      2019: Original Cloudflare Wrangler v1 repository was created and Wrangler became
      the Workers CLI.
    - >
      2021: Cloudflare created the workers-sdk monorepo, now described as the home of
      Wrangler.
    - >
      2022: Early wrangler-tagged releases appeared in workers-sdk as the modern CLI
      line developed.
    - '2023: Wrangler v1 repository was archived after v1 maintenance ended.'
    - '2026: workers-sdk continued publishing frequent wrangler@4.x releases.'
  usage:
    - >
      Developers use Wrangler to scaffold and configure Workers projects, run local
      development, deploy Workers, manage bindings and environments, and interact with
      Cloudflare platform resources from scripts and CI.
    - >
      Wrangler configuration is project-local in wrangler.jsonc, wrangler.json, or
      wrangler.toml. Environment variables and secrets can be loaded from .env-style
      files for local workflows, with production secrets managed through Cloudflare's
      documented secret mechanisms.
related-packages:
  - id: cask:vercel
    reason: >
      Choose Vercel CLI when deploying and operating projects on Vercel rather than
      building for the Cloudflare Workers platform.
    rel: alternative
    sources:
      - https://developers.cloudflare.com/workers/wrangler/
      - https://vercel.com/docs/cli
  - id: brew:netlify-cli
    reason: >
      Choose Netlify CLI for Netlify deployments and local emulation of Netlify-specific
      redirects, Functions, and environment behavior.
    rel: alternative
    sources:
      - https://developers.cloudflare.com/workers/wrangler/
      - https://docs.netlify.com/api-and-cli-guides/cli-guides/get-started-with-cli/
      - https://docs.netlify.com/api-and-cli-guides/cli-guides/local-development/
