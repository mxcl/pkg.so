id: brew:beets
display-name: beets
repo: https://github.com/beetbox/beets
docs:
  - https://beets.readthedocs.io/
  - https://beets.readthedocs.io/en/stable/reference/config.html
config-file-location:
  unix:
    - ~/.config/beets/config.yaml
  windows:
    - '%APPDATA%\beets\config.yaml'
    - C:\Users\You\AppData\Roaming\beets\config.yaml
    - macos?
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata lists beets across Alpine, Homebrew, Debian, Fedora,
      MacPorts, Nix, Arch, Ubuntu, and openSUSE package names. The README also notes
      PyPI installation and distribution repository packaging.
    - >
      beets adoption grew around the MusicBrainz-centered local-music workflow: import
      files, correct tags, move or copy into a library layout, then query and manipulate
      the collection through the beet CLI and plugins.
  package-nerd-significance:
    - >
      beets is package-nerd significant because it is one of the enduring examples of a
      personal-data CLI that wraps a rich Python application, a SQLite-ish local library
      model, a plugin ecosystem, external metadata services, and distro packaging into
      one command called beet.
    - >
      It sits at the intersection of package managers and hobbyist media preservation:
      PyPI, Linux distributions, Homebrew, and Nix all carry it because music-library
      users want the same tool available on servers, laptops, and long-lived archival
      machines.
    - >
      For CLI collectors, beets also has the satisfying trait of turning messy
      filesystem culture into explicit configuration: tags, templates, metadata sources,
      plugins, and output paths are all package-managed and scriptable.
  project-history:
    - >
      beets was created by Adrian Sampson and the GitHub repository was opened in August
      2010. The project describes itself as a media library management system for
      obsessive music users, with automatic metadata improvement as the core import
      workflow.
    - >
      The changelog records the early beta series beginning with 1.0b1 on June 17, 2010,
      followed by many beta releases and two release candidates before 1.0.0 shipped on
      January 29, 2013.
    - >
      The 1.0 release marked beets as stable while new development continued. The plugin
      system became central to the project's identity, with plugins for album art,
      lyrics, ReplayGain, acoustic fingerprints, transcoding, duplicates, web access,
      MPD, and several metadata sources.
    - >
      The project reached 2.0.0 in May 2024 and continued active 2.x releases through
      2026, including 2.12.0 in June 2026.
  related-projects:
    - >
      MusicBrainz is the central metadata source named throughout beets' documentation
      and README.
    - >
      Discogs, Beatport, ReplayGain, MPD, and acoustic-fingerprint tooling are related
      services or workflows exposed through plugins.
    - >
      Picard is a related MusicBrainz-oriented tagger, while beets occupies the
      scriptable command-line library-manager niche.
  sources:
    - https://api.github.com/repos/beetbox/beets
    - https://beets.readthedocs.io/en/stable/changelog.html
    - https://beets.readthedocs.io/en/stable/reference/config.html
    - https://github.com/beetbox/beets#readme
    - https://github.com/beetbox/beets/releases
    - source_facts.package-manager
  summary:
    - >
      beets is a Python command-line music library manager and MusicBrainz tagger for
      users who want a curated, queryable, correctly tagged local music collection.
  timeline:
    - '2010: 1.0b1 released and GitHub repository created.'
    - '2013: 1.0.0 released after fifteen betas and two release candidates.'
    - '2024: 2.0.0 released.'
    - '2026: 2.12.0 released.'
  usage:
    - >
      The standard workflow is beet import followed by interactive metadata matching,
      file organization, and database-backed querying. Users customize behavior with
      config.yaml, path templates, plugins, and metadata-source credentials where
      individual plugins require them.
    - >
      beets is especially useful for large local music collections because it combines
      tagging, library layout, duplicate checks, album art, lyrics, ReplayGain,
      transcoding, and scripting-friendly command-line access.
related-packages:
  - id: cask:musicbrainz-picard
    reason: >
      Choose MusicBrainz Picard for a graphical, album-oriented tagging workflow with
      AcoustID and CD lookup; choose beets for command-line automation, persistent
      library queries, and plugin-driven collection management.
    rel: alternative
    sources:
      - https://picard.musicbrainz.org/
      - https://beets.io/
      - https://beets.readthedocs.io/en/stable/guides/main.html
