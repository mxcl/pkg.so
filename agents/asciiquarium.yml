config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ASCIIQuarium's adoption is mostly package-culture adoption rather than
      application-platform adoption: it is useful as a terminal demo, a Curses/Perl
      curiosity, and a bit of ASCII-art nostalgia. The input facts list Alpine,
      Homebrew, Fedora, Nix, and Arch packages, which is broad for a terminal toy.
    - >
      Its README includes Ubuntu setup notes for Perl Curses and Term::Animation,
      reflecting the older CPAN-plus-distro packaging style. Package-manager formulas
      are valuable because they hide those Perl module requirements behind a single
      install.
  package-nerd-significance:
    - >
      For package nerds, ASCIIQuarium is a tiny example of why toy packages matter: it
      exercises terminal capabilities, Perl module dependencies, curses support, and
      package naming conventions while also being fun enough to keep around.
  project-history:
    - >
      The official README identifies the program as Asciiquarium v1.1 by Kirk Baucom and
      describes it as an aquarium/sea animation in ASCII art. The script header gives a
      2003 copyright date for Kirk Baucom and points users to the robobunny.com project
      page as the current version location.
    - >
      The GitHub mirror/import used by current package managers was created in 2011 by
      Claudio Matsuoka. Its first commit message says it imported Kirk Baucom's
      ASCIIQuarium 1.0, and the README credits Matsuoka with new fish species and minor
      improvements backported from an Android live wallpaper.
  related-projects:
    - Term::Animation and Curses are required Perl modules.
    - Joan Stark's ASCII art is credited for much of the artwork.
    - An Android live wallpaper is mentioned as the source for some backported species.
  sources:
    - https://github.com/cmatsuoka/asciiquarium
    - https://raw.githubusercontent.com/cmatsuoka/asciiquarium/master/CHANGES
    - https://raw.githubusercontent.com/cmatsuoka/asciiquarium/master/README
    - https://raw.githubusercontent.com/cmatsuoka/asciiquarium/master/asciiquarium
    - source_facts.package-manager
  summary:
    - >
      ASCIIQuarium is a Perl terminal toy that animates an aquarium scene in ASCII art
      using Curses and Term::Animation. It is the sort of small, durable package that
      persists in Unix package collections because it is whimsical, dependency-light,
      and instantly demonstrable.
  timeline:
    - '2003: Script header copyright date for Kirk Baucom.'
    - '2011: GitHub repository created and initial import commit records ASCIIQuarium 1.0.'
    - '2011: Version 1.1 documented with new fish species.'
    - '2023: GitHub repository still received updates/pushes.'
  usage:
    - >
      The program is a single Perl script. Users put it somewhere on PATH and run
      `asciiquarium`; while it is running, `q` quits, `r` redraws the aquarium, `p`
      toggles pause, and `-c` selects classic mode with only species from Asciiquarium
      1.0.
