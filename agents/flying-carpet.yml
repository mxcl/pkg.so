history:
  adoption-history:
    - >
      Flying Carpet expanded from a desktop-oriented transfer utility into a
      five-platform application for Android, iOS, Linux, macOS, and Windows. Its
      official releases provide native packages and standalone builds, while the macOS
      edition is also distributed through Homebrew.
  package-nerd-significance:
    - >
      Flying Carpet is notable as an open-source, cross-platform answer to AirDrop-style
      transfers. It can move files without cloud storage or a pre-existing network and
      avoids filesystem-size constraints that can make removable media inconvenient.
    - >
      Its combination of Rust/Tauri desktop code and separate Android and Apple builds
      makes it an interesting example of a utility packaged across mobile and desktop
      ecosystems.
  project-history:
    - >
      Flying Carpet was created as a local file-transfer application that forms an
      ad-hoc Wi-Fi connection between nearby devices. Later releases added
      Bluetooth-based connection negotiation and a shared-network mode.
    - >
      Version 9 introduced optional Bluetooth negotiation for hotspot credentials.
      Version 10 added transfers over an existing wired or wireless network, rebuilt
      encryption around the Noise Protocol Framework, and made version 10 incompatible
      with earlier protocol versions.
  related-projects:
    - >
      The README points to other projects by the same developer, including Cloaker and
      WhatFiles.
  sources:
    - 'Official README: https://github.com/spieglt/flyingcarpet#readme'
    - 'Official releases: https://github.com/spieglt/flyingcarpet/releases'
    - source_facts.package-manager identifies the Homebrew cask.
  summary:
    - >
      Flying Carpet is an open-source file-transfer utility for Android, iOS, Linux,
      macOS, and Windows. It transfers files directly over an ad-hoc hotspot or a
      network shared by both devices, without requiring Internet or cellular service.
  timeline:
    - 'Version 9: Added Bluetooth-based connection negotiation.'
    - 'Version 10: Added shared-network transfers and Noise-based encryption.'
  usage:
    - >
      Install or run Flying Carpet on both devices, choose compatible transfer modes and
      opposing send/receive roles, then select the files or folder to transfer. Shared
      Network mode uses a one-time password or QR code; Hotspot mode creates an ad-hoc
      Wi-Fi network and can exchange its credentials over Bluetooth.
