credentials-file-location: null
history:
  adoption-history:
    - >
      Mattermost emerged publicly as an open-source project in 2015 and was adopted as a
      self-hosted alternative to proprietary team-chat services. GitLab promoted an
      integrated GitLab Mattermost distribution in 2015, helping expose the project to
      development and operations teams.
    - >
      The desktop client entered beta in March 2016. It evolved into a cross-platform
      Electron application for Windows, macOS, and Linux, adding support for multiple
      servers, notifications, deep links, and later multiple workspace contexts.
    - >
      Mattermost's official open-source overview describes a global community of tens of
      thousands of contributors, while the desktop repository credits its origin to Yuya
      Ochiai's electron-mattermost project.
  package-nerd-significance:
    - >
      Mattermost became a prominent package-manager choice for organizations wanting a
      Slack-style collaboration client connected to infrastructure they can self-host
      and control.
    - >
      The desktop cask is the endpoint of a broader open-source stack: administrators
      package and deploy the server, while users install native desktop and mobile
      clients. That split makes Mattermost relevant across server repositories,
      container registries, Linux package repositories, and desktop package managers.
  project-history:
    - >
      Mattermost's roots are in SpinPunch, an HTML5 game-engine company founded in 2011.
      The team repurposed its in-game messaging technology after encountering lock-in
      with its existing communications service.
    - >
      The Mattermost project was opened to the public in 2015. Mattermost 1.0 followed
      in October 2015, and the desktop application appeared in beta in March 2016.
    - >
      The desktop application was originally created as electron-mattermost by Yuya
      Ochiai. It is now maintained by Mattermost as an Electron client wrapping the web
      application and providing operating-system integration.
  related-projects:
    - Mattermost Server
    - Mattermost Web App
    - Mattermost Mobile
    - GitLab
    - Focalboard
    - Mattermost Playbooks
  sources:
    - 'Official desktop documentation: https://docs.mattermost.com/product-overview/desktop'
    - 'Official desktop repository: https://github.com/mattermost/desktop'
    - 'Official newsroom archive: https://mattermost.com/newsroom/news/'
    - 'Official open-source history: https://mattermost.com/open-source/'
  summary:
    - >
      Mattermost is an open-core collaboration platform centered on self-hosted and
      private-cloud messaging, workflow, and operational coordination. The packaged
      desktop app is the Electron-based client for connecting to one or more Mattermost
      servers.
  timeline:
    - '2011: The predecessor company SpinPunch was founded.'
    - '2015: Mattermost was released as an open-source collaboration project.'
    - '2015-10: Mattermost 1.0 reached a self-host-ready release.'
    - '2016-03: Mattermost Desktop entered beta.'
  usage:
    - >
      Users install the desktop application and connect it to a Mattermost server URL.
      The client supports multiple servers and workspace contexts, desktop
      notifications, unread badges, deep links, keyboard navigation, and background
      operation.
    - >
      Organizations commonly pair the desktop client with a self-hosted Mattermost
      deployment when data control, private-cloud operation, or integration with
      development and incident-response workflows is important.
