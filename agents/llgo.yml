history:
  adoption-history:
    - >
      llgo is a niche compiler project rather than a mainstream Go distribution. Its
      adoption story is mainly among XGo/GoPlus users and developers interested in
      Go-like syntax with lower-friction access to C ABI libraries, Python modules,
      WebAssembly, embedded development, and data-science tooling.
  package-nerd-significance:
    - >
      llgo is interesting because it packages a language experiment at the boundary
      between Go, LLVM, and foreign-function ecosystems. It is not just another Go tool;
      it is a compiler-line package that asks whether Go-style code can use LLVM and C
      ABI linkage as its integration layer.
  project-history:
    - >
      The public project proposal for llgo was opened in February 2024 in the GoPlus/XGo
      issue tracker, describing a Go compiler based on LLVM for better integration with
      the C ecosystem. The repository release history includes v0.1.0 on April 21, 2024.
    - >
      The README frames LLGo as 'Go * C ecosystem': compatible with Go through source
      syntax and compatible with C-family ecosystems through ABI linkage. Examples
      include importing C standard library wrappers and Python libraries.
  related-projects:
    - XGo/GoPlus is the parent ecosystem described by the llgo README.
    - LLVM provides the compiler infrastructure foundation.
    - >
      The goplus/lib packages provide C, C++, and Python-facing libraries used by llgo
      examples.
  sources:
    - https://formulae.brew.sh/formula/llgo
    - https://github.com/goplus/gop/issues/1734
    - https://github.com/goplus/llgo
    - https://github.com/xgo-dev/llgo/releases/tag/v0.1.0
    - https://github.com/xgo-dev/llgo/releases/tag/v0.13.0
  summary:
    - >
      llgo is an LLVM-based Go compiler from the XGo/GoPlus ecosystem. Its stated
      purpose is to make Go source code interoperate more directly with the C ABI and
      with ecosystems such as C/C++, Python, JavaScript, Objective-C, and Swift.
  timeline:
    - '2024-02-13: GoPlus/XGo issue #1734 proposed llgo as an LLVM-based Go compiler.'
    - '2024-04-21: v0.1.0 appeared in GitHub releases.'
    - '2026-03-09: v0.13.0 appeared in GitHub releases.'
  usage:
    - >
      The command-line tool is used to build or run LLGo programs, including examples
      that import C wrappers or Python-facing packages. In Homebrew, the formula gives
      macOS and Linux users a packaged entry point without cloning and bootstrapping the
      compiler from source.
related-packages:
  - id: brew:go
    reason: >
      Choose the standard Go toolchain for mainstream Go compatibility and its
      established compiler workflow; choose LLGo when LLVM and direct C/Python ecosystem
      interoperability are the primary requirements.
    rel: alternative
    sources:
