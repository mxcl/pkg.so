history:
  adoption-history:
    - >
      Goku appears in Homebrew, MacPorts, and Nix package metadata, which places it in
      the small but familiar package-manager niche of single-binary HTTP benchmarking
      tools. Its adoption footprint is modest compared with older load generators, so
      the best-supported history is the maintainer's README and release stream rather
      than third-party ecosystem writing.
  package-nerd-significance:
    - >
      For package nerds, Goku is notable as a newer Rust entrant in the classic
      `ab`/Vegeta/Drill style: easy to bottle, easy to run from CI or a shell, and small
      enough to install as a toolbox binary. Its MCP support also reflects the 2025-era
      pattern of CLI tools exposing agent-callable surfaces.
  project-history:
    - >
      The GitHub project was created in February 2023 and had early 0.0.x and 0.1.x
      releases within the same week. The README later expanded the tool beyond one-shot
      HTTP benchmarking with duration-based runs, multi-step YAML scenarios, comparison
      of saved JSON benchmark runs, and an MCP server interface.
  related-projects:
    - >
      Drill and Vegeta are named by the maintainer as inspirations for Goku's HTTP
      load-testing model.
    - >
      Goku occupies the same CLI benchmarking space as other installable HTTP load
      tools, but its official sources frame it primarily around Rust packaging,
      structured output, and agent integration.
  sources:
    - https://github.com/jcaromiq/goku
    - https://github.com/jcaromiq/goku/releases
    - https://goku.observabilityinsight.com/
  summary:
    - >
      Goku is a Rust HTTP load-testing CLI for benchmarking web services. Its maintainer
      describes it as inspired by Drill and Vegeta, with a focus on simple command-line
      load profiles, live statistics, rate limiting, scenarios, and structured output.
  timeline:
    - '2023: GitHub repository created for a Rust HTTP load-testing application.'
    - '2023: Early 0.0.x and 0.1.x GitHub releases published.'
    - >
      2024-2025: README describes expanded benchmarking features including duration
      runs, live stats, scenario files, JSON/CSV output, result comparison, and MCP
      support.
  usage:
    - >
      Typical use is `goku --target URL` with flags for clients, iterations or duration,
      headers, request body, output format, and rate limits. The `compare` subcommand
      makes it useful for package-manager users who want a local CLI to compare
      benchmark results without standing up a hosted load-testing service.
related-packages:
  - id: brew:vegeta
    reason: >
      Choose Vegeta when a constant request-rate attack model and composable
      attack/report pipeline are more important than Goku's scenario and MCP features.
    rel: alternative
    sources:
      - https://github.com/jcaromiq/goku
      - https://github.com/tsenart/vegeta
  - id: brew:drill
    reason: >
      Choose Drill when declarative YAML benchmark plans with request chaining,
      assignments, loops, and CSV-driven data are the center of the workload.
    rel: alternative
    sources:
      - https://github.com/jcaromiq/goku
      - https://github.com/fcsonline/drill
