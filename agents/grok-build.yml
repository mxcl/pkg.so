id: cask:grok-build
display-name: Grok Build
repo: https://github.com/xai-org/grok-build
docs:
  - https://docs.x.ai/build/overview
  - https://x.ai/news/grok-build-cli
config-file-location:
  unix:
    - ~/.grok/config.toml
    - $GROK_HOME/config.toml
    - .grok/config.toml
    - ~/.grok/managed_config.toml
    - /etc/grok/managed_config.toml
    - ~/.grok/requirements.toml
    - /etc/grok/requirements.toml
credentials-file-location:
  unix:
    - ~/.grok/mcp_credentials.json
history:
  adoption-history:
    - >
      Initial access was tied to xAI subscription accounts, which makes the
      package-manager story closer to a proprietary developer CLI than to a traditional
      open-source utility. The Homebrew cask makes the binary easier to install and
      update on macOS while official docs continue to point users at xAI's shell
      installer.
  package-nerd-significance:
    - >
      For package nerds, Grok Build is notable as a fast-moving AI coding-agent binary
      distributed outside a public source repository. Its Homebrew cask record matters
      because it gives macOS users a package-manager path for a tool whose upstream
      installation docs otherwise prefer a remote installer script.
  project-history:
    - >
      xAI introduced Grok Build as an early beta coding agent and CLI for professional
      software engineering work. The official documentation describes it as a coding
      agent usable through an interactive terminal UI, scripts, bots, or Agent Client
      Protocol clients.
    - >
      The product grew around the same Grok coding-model line that xAI exposed through
      its API, but the CLI is the user-facing developer tool: it installs a `grok`
      command, provides plan and review workflows, and supports agent-extension surfaces
      such as skills, plugins, hooks, MCP servers, and subagents.
  related-projects:
    - >
      Related xAI surfaces include the Grok Build API model family, xAI API
      documentation, and integrations with agentic coding environments that can use Grok
      accounts or the Grok Build model.
    - >
      Adjacent package-manager comparisons include other binary coding-agent CLIs
      distributed through Homebrew casks or tap formulas rather than source-built
      packages.
  sources:
    - https://docs.x.ai/build/cli/headless-scripting
    - https://docs.x.ai/build/features/skills-plugins-marketplaces
    - https://docs.x.ai/build/overview
    - https://x.ai/build/changelog
    - https://x.ai/news/grok-build-cli
  summary:
    - >
      Grok Build is xAI's terminal coding-agent CLI, packaged in Homebrew as a cask
      because the official distribution is a prebuilt end-user command-line application
      rather than a source-built Unix formula.
  timeline:
    - '2026: xAI announced Grok Build as an early beta terminal coding agent.'
    - >
      2026: xAI documented interactive TUI, headless scripting, ACP, skills, plugins,
      hooks, MCP servers, and subagents for the CLI.
    - '2026: Homebrew distributed Grok Build as a cask for macOS users.'
  usage:
    - >
      The CLI is used from a terminal either as an interactive full-screen coding agent
      or in headless/automation contexts. xAI's docs also describe ACP operation over
      JSON-RPC on standard input and output for editor or tool integration.
