history:
  adoption-history:
    - >
      Transmit became a long-running part of the Mac software ecosystem as a polished
      alternative to command-line FTP and SFTP clients. Panic reported in 2014 that its
      shared transfer engine had accumulated 16 years of compatibility and performance
      work. The package is also available through the Homebrew cask recorded in
      `source_facts.package-manager`.
    - >
      Transmit expanded beyond conventional FTP workflows to WebDAV, Amazon S3, and
      numerous cloud-storage services. Panic Sync later provided synchronization of
      saved servers, keys, passwords, and related connection information between Macs.
  package-nerd-significance:
    - >
      Transmit is notable for translating protocol-heavy file-transfer work into a
      native dual-pane Mac interface without discarding advanced facilities such as SSH
      configuration, key authentication, synchronization, remote editing, automation,
      and protocol-specific settings.
    - >
      For package-manager users, the cask provides a convenient installation path for a
      commercial Mac application with roots predating modern cloud-storage clients.
  project-history:
    - >
      Transmit originated in the late 1990s as a Mac FTP client from Panic. An official
      2014 account described the underlying engine as 16 years old, placing its
      beginnings around 1998.
    - >
      Over successive generations it broadened from FTP into SFTP, WebDAV, Amazon S3,
      and cloud-storage services. Transmit 5 arrived in 2017 with a rebuilt transfer
      engine, expanded cloud support, Panic Sync, and local-to-local and
      remote-to-remote synchronization.
  related-projects:
    - >
      Transmit occupies the same broad client category as Cyberduck, Fetch, FileZilla,
      ExpanDrive, Flow, and Interarchy; its official import menu recognizes server data
      from several of these applications.
  sources:
    - Homebrew cask identity supplied by `source_facts.package-manager`.
    - 'Official 2014 Panic account of the transfer engine: https://panic.com/blog/page/11/'
    - 'Official 2017 Panic report: https://blog.panic.com/the-2017-panic-report/'
    - 'Official help center: https://help.panic.com/transmit/transmit5/'
    - 'Official product page: https://panic.com/transmit/'
  summary:
    - >
      Transmit is Panic's long-running graphical file-transfer client for macOS. It
      combines a dual-pane file browser with FTP, SFTP, WebDAV, S3, cloud-service,
      synchronization, and saved-server workflows.
  timeline:
    - >
      Circa 1998: Transmit's file-transfer engine originated, based on Panic's later
      description of its age.
    - '2014: Panic brought the shared Transmit engine to an iOS edition.'
    - '2017: Transmit 5 launched with a rebuilt engine, broader cloud support, and Panic Sync.'
  usage:
    - >
      Users save or quick-connect to remote servers, browse local and remote files side
      by side, and upload, download, edit, rename, or synchronize content. Saved server
      definitions can be grouped, exported, or synchronized through Panic Sync.
    - >
      For SFTP, Transmit can automatically use keys in `~/.ssh/` and settings from
      `~/.ssh/config`. The official settings documentation also exposes key management
      and protocol-specific transfer controls.
