id: brew:since
display-name: since
repo: null
docs:
  - http://welz.org.za/projects/since
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official homepage links to Debian and FreeBSD distribution pages, and the
      input records packages for Homebrew, Debian, Fedora/DNF, and Ubuntu. That adoption
      pattern fits a tiny admin utility preserved by Unix package collections.
  package-nerd-significance:
    - >
      Package nerds care because since is a minimal example of a Unix command that does
      one operational job, stores simple state, and avoids a larger log-monitoring stack
      when a shell session is enough.
  project-history:
    - >
      The official homepage describes since as a tail-like Unix utility for monitoring
      growing log files. The official source archive includes a manpage dated July 1998,
      and the homepage offers an old stable 0.5 source archive plus a 1.1 rewrite with
      more features.
  related-projects:
    - >
      Related tools include tail, logger, stat, shell aliases for log monitoring, and
      other stateful log-following scripts.
  sources:
    - http://welz.org.za/projects/since
    - http://welz.org.za/projects/since/since-1.1.tar.gz
    - source_facts.package-manager
  summary:
    - >
      since is a small Unix utility for stateful log tailing: it prints only the content
      appended to files since the last run.
  timeline:
    - '1998: Official manpage in the source archive is dated July 1998.'
    - >
      2000s: Official homepage lists 0.5 as old and stable and 1.1 as a rewrite with
      more features.
    - >
      2026: Input package-manager facts list Homebrew, Debian, Fedora/DNF, and Ubuntu
      packages.
  usage:
    - >
      Users run since against log files, commonly under /var/log, to see only new lines
      after a previous check. The manpage documents follow mode, quiet and relaxed
      modes, compressed-extension skipping, and an explicit state-file option.
tags:
  - cli
  - log-monitoring
  - stateful
  - tail
