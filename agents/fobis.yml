id: brew:fobis
display-name: FoBiS
repo: https://github.com/szaghi/FoBiS
docs:
  - https://szaghi.github.io/FoBiS
config-file-location:
  unix:
    - ./fobos
    - ~/.config/fobis/config.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is published through Homebrew in the supplied package metadata and
      through the upstream Python/PyPI-oriented naming shown in the official README
      badge. The README also lists a set of Fortran projects using FoBiS, including
      ADAM, BeFoR64, FACE, FiNeR, FLAP, PENF, StringiFor, VecFor, and VTKFortran.
  package-nerd-significance:
    - >
      FoBiS matters to package and build-tool enthusiasts because it packages Fortran's
      module-ordering problem as a CLI workflow, while also treating dependencies, build
      profiles, lock files, and reusable project scaffolding as first-class features. It
      is a Fortran-specific counterpart to the automation that other language ecosystems
      expect from their package tools.
  project-history:
    - >
      FoBiS grew around the recurring Fortran problem of manually tracking module,
      include, and source compilation order. The official documentation presents `fobis
      build` as a zero-configuration path for simple projects and the `fobos` file as an
      INI-style replacement for makefiles in complex projects.
  related-projects:
    - >
      FoBiS is related to modern Fortran projects listed in its README, including ADAM,
      BeFoR64, FACE, FiNeR, FLAP, FUNDAL, FOSSIL, MORTIF, MOTIOn, PENF, StringiFor,
      VecFor, and VTKFortran. It also integrates with GitHub-hosted dependencies, gcovr
      or lcov coverage tools, Ollama, and OpenAI-compatible local LLM servers.
  sources:
    - https://formulae.brew.sh/api/formula.json
    - https://formulae.brew.sh/formula/fobis
    - https://github.com/szaghi/FoBiS
    - https://szaghi.github.io/FoBiS
  summary:
    - >
      FoBiS, the Fortran Building System, is a Python-based build and project tool for
      modern Fortran. Its official README describes automatic dependency-resolving
      builds with no makefiles or boilerplate, plus package-management, testing,
      coverage, scaffolding, and documentation features.
  timeline:
    - 'Current: Official README brands FoBiS as the Fortran Building System.'
    - >
      Current: Official docs describe `fobos` as the FoBiS makefile and document
      dependency fetching with `fobos.lock`.
    - 'Current: Supplied package metadata lists Homebrew packaging.'
  usage:
    - >
      FoBiS users typically run `fobis build` for convention-based builds or define
      modes in a `fobos` file for named compiler configurations. The tool also supports
      fetching GitHub dependencies, lock files, test discovery, coverage, doctests,
      build caching, introspection, scaffolding, and local-LLM commit-message
      generation.
related-packages:
  - id: brew:fpm
    reason: >
      Choose Fortran Package Manager when you want a standardized `fpm.toml` manifest,
      dependency registry, and package-oriented build workflow; choose FoBiS for
      automatic source dependency analysis and optional `fobos` build profiles.
    rel: alternative
    sources:
      - https://szaghi.github.io/FoBiS/
      - https://fpm.fortran-lang.org/
      - https://fpm.fortran-lang.org/spec/manifest.html
