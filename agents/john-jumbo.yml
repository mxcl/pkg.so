id: brew:john-jumbo
display-name: John the Ripper Jumbo
repo: https://github.com/openwall/john
docs:
  - https://www.openwall.com/john
  - https://www.openwall.com/john/doc
config-file-location:
  unix:
    - $JOHN/john.conf
    - $JOHN/john-local.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Openwall distributes Jumbo source and Windows binaries and recommends the GitHub
      development source in preference to the old Jumbo release tarball. Homebrew
      packages it separately as john-jumbo, where it conflicts with the core john
      formula and pulls in extra dependencies such as GMP and OpenSSL.
    - >
      The upstream homepage and Homebrew formula show the package-manager split clearly:
      core john remains available, while john-jumbo is the enhanced formula for users
      who want broader cracking coverage.
  package-nerd-significance:
    - >
      The john-jumbo formula is package-nerd-interesting because it captures a real
      upstream social split: a conservative core and a fast-moving, format-rich Jumbo
      branch. It also exposes the maintenance cost of security packages that bundle
      optimized CPU/GPU code, optional cryptographic libraries, helper scripts, and many
      architecture-specific assumptions.
  project-history:
    - >
      John the Ripper began in 1996 as Solar Designer's replacement for Cracker Jack,
      with prototypes for incremental mode dating to 1995. It became open source in
      1997, and the 1.5 rewrite in 1998 became the basis for later versions. The public
      GitHub repository was created in 2011 and uses bleeding-jumbo as its default
      branch.
    - >
      The Jumbo branch formalized the place where experimental and community-contributed
      cracking formats, scripts, and documentation could land faster than in the core
      release. Openwall's own README warns that Jumbo contains much more functionality
      and lower maturity guarantees than core, which is exactly why it became the branch
      most security practitioners reach for when they need broad format coverage.
  related-projects:
    - >
      Related projects include John the Ripper core, John the Ripper Pro, Hash Suite,
      Hash Suite Droid, Openwall wordlists, yescrypt, crypt_blowfish, passwdqc,
      john-packages, and the Johnny GUI.
  sources:
    - https://api.github.com/repos/openwall/john
    - https://formulae.brew.sh/formula/john-jumbo
    - https://github.com/openwall/john
    - https://www.openwall.com/john/
    - https://www.openwall.com/john/doc/
    - https://www.openwall.com/lists/john-users/2015/09/10/4
  summary:
    - >
      John the Ripper Jumbo is the community-enhanced branch of John the Ripper, an
      offline password auditing and recovery tool. The Jumbo line adds large amounts of
      community code, documentation, formats, and helper data beyond the core cracker,
      including support for hundreds of hash and cipher types.
  timeline:
    - "1995: Prototypes for John's incremental mode were written."
    - '1996: John the Ripper 1.0 was released as a Cracker Jack replacement.'
    - '1997: John the Ripper became open source.'
    - '1998: Version 1.5 rewrote the codebase that later versions built upon.'
    - '2011: The openwall/john GitHub repository was created.'
    - '2019: Openwall released the 1.9.0 Jumbo line and documented it separately from core.'
  usage:
    - >
      Jumbo is used for password-auditing jobs where the input format may be archive
      files, office documents, SSH keys, cryptocurrency wallets, network captures,
      operating-system password stores, databases, or web application hashes. Users
      typically run converter tools where needed, crack with john, and inspect results
      with john --show or the john.pot store.
related-packages:
  - id: brew:john
    reason: >
      Choose core John the Ripper when its narrower format set is sufficient and you
      prefer the smaller, more conservative upstream line.
    rel: alternative
    sources:
      - https://www.openwall.com/john/
      - https://github.com/openwall/john#readme
  - id: brew:hashcat
    reason: >
      Choose hashcat when GPU-oriented multi-device cracking and its optimized hash-mode
      ecosystem better match the auditing workload.
    rel: alternative
    sources:
      - https://www.openwall.com/john/
      - https://hashcat.net/hashcat/
