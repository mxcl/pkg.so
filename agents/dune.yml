history:
  adoption-history:
    - >
      Dune adoption spread through the OCaml packaging ecosystem because opam packages
      could use a common build invocation, and Dune itself documents recommended package
      builds such as `dune build -p name -j jobs` and `dune runtest -p name -j jobs`.
    - >
      The package is distributed across Homebrew, Alpine, Fedora, MacPorts, Nix, and
      Arch, reflecting its role as a workstation and CI prerequisite for building many
      OCaml packages outside opam-only environments.
  package-nerd-significance:
    - >
      Dune is package-nerd important because it turned OCaml builds from a patchwork of
      ocamlbuild, oasis, makefiles, and custom scripts into a largely uniform
      package-manager target. A formula for Dune unlocks many other formulae.
    - >
      Its jbuilder-to-dune migration is also a useful packaging case study: upstream
      kept compatibility for old names, emitted warnings, and shipped an upgrader,
      giving distributions and opam packages a path away from historical build files
      without a flag day.
  project-history:
    - >
      Dune began as jbuilder, a build system derived from ideas used inside Jane Street
      and adapted for open-source OCaml projects. The upstream README still frames Dune
      as inspired by Jane Street's internal build scheme and matured through daily use
      by hundreds of developers.
    - >
      The project was renamed from jbuilder to Dune during the 1.x era. The Dune project
      documented a staged deprecation of the `jbuilder` binary and `jbuild` files, with
      automatic `dune upgrade` support to migrate projects to `dune` files and
      `dune-project` metadata.
    - >
      Dune's public repository is maintained under the OCaml GitHub organization. GitHub
      metadata records the repository as created in 2016, with OCaml as the main
      language, MIT licensing, and ongoing 3.x releases through 2026.
  related-projects:
    - >
      opam is closely related because Dune's recommended package build commands are
      designed for opam packaging.
    - >
      Merlin is related because Dune generates editor-tool configuration for OCaml
      development.
    - >
      Coq and Reason are related user communities called out in the existing package
      curation tags and supported by the Dune ecosystem.
  sources:
    - >
      https://raw.githubusercontent.com/ocaml/dune/main/README.md documents Dune's
      purpose, Jane Street inspiration, project files, workspace features, opam-oriented
      installation, and build behavior.
    - >
      https://dune.build/blog/second-step-deprecation/ documents the jbuilder
      deprecation, `dune upgrade`, and migration of `jbuild` files to Dune files.
    - >
      https://api.github.com/repos/ocaml/dune documents repository creation, language,
      license, topics, and public activity.
    - https://api.github.com/repos/ocaml/dune/releases documents recent 3.x release history.
  summary:
    - >
      Dune is the dominant build system for OCaml projects, with support for OCaml,
      Reason, and Coq workflows. Its significance is that it standardized a large part
      of OCaml package building around declarative `dune`, `dune-project`, and
      `dune-workspace` files rather than per-project build scripts.
  timeline:
    - '2016: The public GitHub repository now used for Dune is created.'
    - '2018: Dune 1.0 is announced in the OCaml community after the jbuilder period.'
    - >
      2019: Dune enters the second stage of jbuilder deprecation and adds `dune upgrade`
      migration support.
    - '2026: Dune 3.24.0 is published, showing continued active development.'
  usage:
    - >
      Typical users write `dune` files with S-expression stanzas and let Dune generate
      build rules, installation metadata, and editor-tool configuration. Dune also
      supports workspaces, multi-package repositories, multiple build contexts, tests,
      documentation targets, and cross-compilation workflows.
    - >
      For package managers, the important interface is the `dune` executable plus the
      conventional project files it understands. The installed tool is often needed not
      because users run Dune directly as an application, but because downstream OCaml
      packages declare Dune as their build system.
related-packages:
  - id: brew:opam
    reason: >
      Use opam alongside Dune to manage OCaml compilers and dependencies; Dune
      officially recommends opam for installation and emits package builds designed for
      opam workflows.
    rel: adjacent_workflow
    sources:
      - https://dune.build/install
      - https://dune.build/blog/second-step-deprecation/
      - https://opam.ocaml.org/
