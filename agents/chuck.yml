history:
  adoption-history:
    - >
      The upstream history traces adoption through miniAudicle, the Princeton Laptop
      Orchestra, the Stanford Laptop Orchestra, computer-music curricula, Smule's early
      iPhone apps, a 2015 book, online coursework, and later browser and host
      integrations. The batch input records broad package-manager availability across
      Homebrew, Debian, Ubuntu, MacPorts, Nix, Arch, Scoop, and WinGet.
  package-nerd-significance:
    - >
      ChucK is significant because it is not just an audio tool but a language runtime
      with a long-lived package-manager presence. Installing it from Homebrew or distro
      repositories gives musicians and researchers a reproducible CLI runtime for live
      audio code, while companion projects such as chugins, miniAudicle, WebChucK, and
      chump show an ecosystem around the core VM.
  project-history:
    - >
      The ChucK README says Ge Wang and Perry R. Cook created ChucK at Princeton in the
      early 2000s, with the first GPL release in 2003. The language developed around
      precise time control, concurrency, on-the-fly code changes, and computer-music
      performance.
  related-projects:
    - >
      Official related projects include miniAudicle, chugins, WebChucK, WebChucK IDE,
      chump, Chunity, Chunreal, ChucKDesigner, Fauck, and Pure Data or Max integrations.
  sources:
    - https://github.com/ccrma/chuck#readme
    - https://chuck.stanford.edu/doc/
    - https://chuck.stanford.edu/release/
    - https://api.github.com/repos/ccrma/chuck
    - https://formulae.brew.sh/api/formula/chuck.json
  summary:
    - >
      ChucK is a strongly timed programming language and runtime for real-time sound
      synthesis, live coding, teaching, and computer-music research.
  timeline:
    - '2003: First ChucK release under the GPL.'
    - '2004: miniAudicle IDE created.'
    - '2005: Princeton Laptop Orchestra began using ChucK.'
    - >
      2008: Stanford Laptop Orchestra founded; ChucK also used in early Smule iPhone
      audio apps.
    - '2015: Programming for Musicians and Digital Artists published.'
    - '2017: Chunity brought ChucK into Unity workflows.'
    - '2020s: WebChucK and the WebChucK IDE made ChucK runnable in browsers.'
  usage:
    - >
      Users run the command-line chuck VM to execute ChucK programs, add or modify
      shreds on the fly, use MIDI, OpenSoundControl, HID, and audio drivers, or embed
      ChucK core in other C++ hosts. The official release page distributes source,
      installers, miniAudicle, and command-line builds.
