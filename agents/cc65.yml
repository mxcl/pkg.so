    - $LD65_CFG
    - $CC65_HOME/cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      cc65 became a long-lived retrocomputing toolchain because it supports many
      6502-family targets, including Apple II, Atari 8-bit systems, Commodore machines,
      NES, Oric, BBC, PC Engine, KIM-1, Commander X16, and others. The supplied package
      facts show it is packaged across Homebrew, Debian, Fedora, MacPorts, Nix, Scoop,
      Ubuntu, and Alpine.
  package-nerd-significance:
    - >
      cc65 is a classic package-manager fixture: a portable cross-compiler suite that
      lets modern hosts build software for many constrained historic targets. Its many
      small executables also make it a good test case for toolchain packaging,
      documentation paths, and target-library layout.
  project-history:
    - >
      The official README traces cc65 to Ron Cain's Small C, enhanced by James E.
      Hendrix, then to John R. Dunning's Atari-hosted compiler/runtime implementation.
      Ullrich von Bassewitz moved the code to modern systems, rewrote most of the
      compiler, and rewrote the runtime library.
  related-projects:
    - >
      Small C, ca65, ld65, cl65, sim65, and target ecosystems for Apple II, Atari,
      Commodore, NES, and other 65(C)02 machines.
  sources:
    - https://api.github.com/repos/cc65/cc65
    - https://github.com/cc65/cc65
    - https://cc65.github.io/cc65/
    - https://cc65.github.io/doc
    - https://cc65.github.io/doc/cc65.html
    - https://cc65.github.io/doc/ld65.html
    - https://cc65.github.io/getting-started.html
    - https://formulae.brew.sh/api/formula/cc65.json
  summary:
    - >
      cc65 is a complete cross-development toolchain for 65(C)02 systems, including a C
      compiler, macro assembler, linker, archiver, simulator, and supporting tools.
  usage:
    - >
      Developers use cc65 to build C and assembly programs for old 6502-family machines
      and custom hardware. The official documentation covers each tool and shows that
      ld65 linker configuration files define output layout, memory areas, and segment
      placement.
related-packages:
  - id: brew:atasm
    reason: >
      Choose ATasm for an Atari-focused, MAC/65-compatible cross-assembler with Atari
      image and emulator-oriented outputs; choose cc65 when you need C, ca65 assembly,
      linking, libraries, and multiple 6502 targets in one suite.
    rel: alternative
    sources:
      - https://github.com/cc65/cc65#readme
      - https://github.com/CycoPH/atasm#readme
