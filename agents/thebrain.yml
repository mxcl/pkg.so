    - https://www.thebrain.com/support
  summary:
    - >
      TheBrain is proprietary visual mind-mapping and personal knowledge-base software
      organized around interconnected Thoughts and Links.
  timeline:
    - '1996: TheBrain originated as an associative alternative to file-and-folder organization.'
    - >
      1999: Inventor and CEO Harlan Hugh publicly described the product's
      dynamic-information vision.
    - >
      2020s: TheBrain continued through successive desktop releases with cloud
      synchronization and knowledge-management features.
  usage:
    - >
      Users build visual networks of ideas, files, web pages, notes, and other
      information. Typical uses include research, project organization, personal
      knowledge management, decision support, and navigating relationships that do not
      fit neatly into folder hierarchies.
