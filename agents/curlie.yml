history:
  adoption-history:
    - >
      Curlie spread through developer-oriented package channels rather than through
      operating-system base installs. Its official install notes mention Homebrew, webi,
      eget, MacPorts, FreeBSD pkg, Go install, Scoop, mise, and binary downloads.
  package-nerd-significance:
    - >
      Curlie is useful to package nerds as a modern single-binary wrapper around an
      established base tool. Its packaging story is mostly about shipping a Go CLI
      across many developer package managers while depending conceptually on curl's
      semantics rather than replacing libcurl.
  project-history:
    - >
      The official README positions Curlie directly between curl and HTTPie: it is for
      users who like HTTPie's interface but want curl's features and performance. The
      repository's tag history shows releases in the 1.6.x series by 2021 and active
      releases through the 1.8.x series in 2025.
  related-projects:
    - >
      curl and HTTPie are the explicit upstream inspirations; webi, eget, mise,
      Homebrew, MacPorts, Scoop, and pkg are named install channels.
  sources:
    - https://github.com/rs/curlie
    - https://rs.github.io/curlie
    - https://github.com/rs/curlie/tags
  summary:
    - >
      Curlie is a Go command-line frontend to curl that borrows HTTPie's interactive
      syntax and output formatting while keeping curl's option surface.
  timeline:
    - '2021: GitHub tags page shows v1.6.6 and v1.6.7.'
    - '2023: GitHub tags page shows v1.7.x releases.'
    - '2025: GitHub tags page shows v1.8.x releases.'
  usage:
    - >
      Users invoke curlie with curl options, an optional HTTP method, a URL, and request
      items. Its main usage pitch is concise API testing with pretty JSON output while
      retaining access to curl options and a --curl mode to print the executed curl
      command.
related-packages:
  - id: brew:curl
    reason: >
      Use curl directly for canonical scripting syntax, complete first-party
      documentation, and non-HTTP protocols; Curlie remains a frontend that exposes
      curl's options and can print the underlying command.
    rel: alternative
    sources:
      - https://github.com/rs/curlie#readme
      - https://curl.se/docs/faq.html
  - id: brew:httpie
    reason: >
      Choose HTTPie for its native human-friendly HTTP client experience; Curlie
      explicitly targets similar ergonomics while retaining curl's options, streaming
      output, and execution model.
    rel: alternative
    sources:
      - https://github.com/rs/curlie#readme
      - https://httpie.io/docs/cli
