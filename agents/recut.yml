history:
  adoption-history:
    - >
      Recut targets video creators with integrations for Adobe Premiere Pro, DaVinci
      Resolve, Final Cut Pro, ScreenFlow, and CapCut. Its official site highlights use
      by YouTubers and other creators but does not publish independently verifiable
      installation totals.
  package-nerd-significance:
    - >
      Recut is a focused example of automating a repetitive nonlinear-editing task while
      preserving established workflows through timeline interchange formats. Its move
      from a Mac-only application to a cross-platform desktop package also makes it
      relevant to software-packaging catalogs.
  project-history:
    - >
      Recut launched in early 2021 as a Mac-only application that handled one video at a
      time. The developer rewrote it in 2022 for macOS and Windows, adding multiple
      tracks, broader format support, and more editing capabilities. Later releases
      expanded export controls and added command-line operation for hands-off editing.
  related-projects:
    - >
      Recut exports projects for Adobe Premiere Pro, DaVinci Resolve, Final Cut Pro,
      ScreenFlow, and CapCut rather than replacing those full nonlinear editors.
  sources:
    - https://getrecut.com/
    - https://getrecut.com/changelog/
    - https://getrecut.com/tutorials/
  summary:
    - >
      Recut is a commercial desktop video-editing utility that detects silence in audio
      and video, builds an automatic rough cut, and exports either rendered media or a
      timeline for another editor.
  timeline:
    - 'Early 2021: Recut launched as a Mac-only, single-video application.'
    - 'May 2022: The rewritten cross-platform Recut 3.0 was released for macOS and Windows.'
    - 'March 2026: Recut 4.4 added quality controls and a command-line interface.'
  usage:
    - >
      Creators import one or more camera and microphone tracks, adjust silence threshold
      and padding, review the detected regions, and export a finished media file or an
      editable timeline for a supported nonlinear editor.
