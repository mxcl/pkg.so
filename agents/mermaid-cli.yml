id: brew:mermaid-cli
display-name: mermaid-cli
repo: https://github.com/mermaid-js/mermaid-cli
docs:
  - https://github.com/mermaid-js/mermaid-cli#readme
  - https://mermaid.js.org/config/mermaidCLI
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The practical interface is the `mmdc` command, used in documentation builds, CI
      pipelines, and local authoring workflows where diagrams must be rendered from
      `.mmd` source files without opening the Mermaid live editor. The package supports
      global npm installation, Docker-oriented usage, theming, transparent backgrounds,
      custom CSS injection, and file conversion workflows such as `mmdc -i input.mmd -o
      output.svg`.
  sources:
    - https://formulae.brew.sh/formula/mermaid-cli
    - https://github.com/mermaid-js/mermaid-cli
    - https://github.com/mermaid-js/mermaid-cli/releases
    - https://mermaid.js.org/config/mermaidCLI.html
  summary:
    - >
      mermaid-cli is the command-line front end for Mermaid, the text-to-diagram
      JavaScript library. The repository describes it as a CLI that takes a Mermaid
      definition file and produces SVG, PNG, or PDF output; the Mermaid documentation
      page for the CLI redirects readers to the separate `mermaid-js/mermaid-cli`
      project.
  usage:
    - >
      For Homebrew, the package-manager niche is making Mermaid rendering available as a
      normal system CLI, alongside its npm package identity. It sits between
      documentation generators and browser automation: users write Mermaid syntax in
      source-controlled text files, then render stable image or document artifacts for
      READMEs, static sites, and release documentation.
related-packages:
  - id: brew:d2
    reason: >
      Choose D2 when you want a standalone server-side text-to-diagram language with
      minimal syntax and formatter support; choose Mermaid CLI when your source is
      Mermaid syntax or Mermaid blocks embedded in Markdown.
    rel: alternative
    sources:
      - https://d2lang.com/tour/faq/
      - https://github.com/mermaid-js/mermaid-cli#readme
