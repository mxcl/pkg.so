history:
  adoption-history:
    - >
      The product targets users who want an Arc-style sidebar without being tied to one
      browser. Official documentation describes several levels of integration across
      more than 25 browsers, ranging from link handling to live tabs and profile-aware
      spaces.
  package-nerd-significance:
    - >
      SupaSidebar belongs to a growing class of macOS utilities that separate
      browser-workspace features from the browser itself. It is particularly relevant to
      users who routinely switch among Safari, Chromium-family browsers, Firefox-family
      browsers, and multiple profiles.
    - >
      Its documented Homebrew cask installation gives command-line-oriented Mac users a
      reproducible alternative to installing the downloadable disk image manually.
  project-history:
    - >
      SupaSidebar was developed as a unified macOS sidebar for links, files, folders,
      applications, and tabs from multiple browsers. Its official documentation
      describes continued expansion into workspaces, live-tab handling, smart folders,
      browser routing, search, and data export.
  related-projects:
    - >
      The product explicitly presents itself as an Arc-style sidebar usable with many
      browsers rather than as a browser extension.
    - >
      Its Air Traffic Control feature provides rule-based browser and browser-profile
      selection for links.
  sources:
    - >
      Official browser-support documentation:
      https://docs.supasidebar.com/gettingStarted/browserSupport
    - 'Official documentation: https://docs.supasidebar.com/'
    - 'Official product site: https://supasidebar.com/'
  summary:
    - >
      SupaSidebar is a macOS productivity utility that places saved links, files,
      folders, applications, and live browser tabs in a shared sidebar usable across
      many browsers.
  timeline:
    - >
      2026: Official documentation described support for more than 25 browsers and
      documented Spaces, live tabs, smart folders, browser routing, and import/export
      workflows.
  usage:
    - >
      Users invoke the sidebar or command panel with keyboard shortcuts, save material
      from their browsers, arrange it into folders and Spaces, search it, and route
      links to chosen browsers or profiles.
    - >
      The application requires macOS Accessibility and Automation permissions for parts
      of its browser integration. It can be installed from the official disk image or
      with `brew install --cask supasidebar`.
