history:
  adoption-history:
    - >
      The official README supports both direct download and Homebrew Cask installation,
      making noTunes convenient for conventional macOS users and package-manager-driven
      setups. Later releases adapted its instructions and behavior to newer macOS
      versions.
  package-nerd-significance:
    - >
      noTunes is a narrowly scoped macOS utility that solves a persistent platform
      annoyance with minimal setup. Its official Homebrew Cask command makes it a
      familiar example of a small GUI utility that fits cleanly into declarative or
      scripted Mac provisioning.
  project-history:
    - >
      Tom Taylor developed noTunes as an open-source utility for suppressing automatic
      iTunes launches; its official license dates the project to 2017. As macOS replaced
      iTunes with the Music application, the utility continued under the same name and
      added menu-bar controls and updated startup guidance.
  related-projects:
    - >
      The utility interacts with Apple's iTunes and Music applications but is an
      independent project.
  sources:
    - https://github.com/tombonez/noTunes
    - https://github.com/tombonez/noTunes/blob/master/LICENSE
    - https://github.com/tombonez/noTunes/releases
  summary:
    - >
      noTunes is a small macOS menu-bar application that prevents iTunes or Apple Music
      from opening automatically.
  timeline:
    - "2017: The project's official MIT license dates its origin to 2017."
    - >
      Later releases: noTunes added menu-bar toggling, icon hiding, and guidance for
      newer macOS login-item settings.
  usage:
    - >
      Launch noTunes to block iTunes or Music from opening. Its menu-bar icon toggles
      blocking on or off and can be hidden. Users who want persistent operation can add
      the application to macOS login items; the README also documents a defaults command
      for restoring a hidden icon.
