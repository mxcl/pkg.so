id: brew:create-api
display-name: Create API
repo: null
docs:
  - https://github.com/CreateAPI/CreateAPI#readme
config-file-location:
  unix:
    - .create-api.yaml
    - .create-api.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through Mint, Homebrew, Swift Package
      Plugins, and make. It also lists open-source projects using Create API, including
      App Store Connect API, Swift SDK for Jellyfin, and Google Generative AI SDK.
  package-nerd-significance:
    - >
      Create API sits at the intersection of API schema packaging and Swift package
      generation. For package maintainers, its significance is that it can convert
      upstream OpenAPI descriptions into reproducible Swift source bundles suitable for
      normal SwiftPM workflows.
  project-history:
    - >
      The CreateAPI/CreateAPI repository was created in late 2021 and shipped its
      initial pre-release in January 2022. The README describes the project as OpenAPI
      code generation for Swift, written in Swift, powered by OpenAPIKit.
    - >
      The 0.1.0 release in August 2022 was a major maturation point: the changelog lists
      Homebrew publication, Swift Package Plugin support, expanded documentation and
      contribution guides, command-line config overrides, configurable generated package
      dependencies, custom data-type mappings, and parallel path generation.
  related-projects:
    - >
      The README says Create API is powered by OpenAPIKit and lists downstream Swift
      SDKs generated or maintained with the tool.
  sources:
    - https://github.com/CreateAPI/CreateAPI
    - https://github.com/CreateAPI/CreateAPI#readme
    - https://github.com/CreateAPI/CreateAPI/blob/main/CHANGELOG.md
    - https://github.com/CreateAPI/CreateAPI/releases/tag/0.0.1
    - https://github.com/CreateAPI/CreateAPI/releases/tag/0.1.0
    - https://github.com/CreateAPI/CreateAPI/releases/tag/0.2.0
  summary:
    - >
      Create API is a Swift command-line code generator that turns OpenAPI 3.0
      specifications into Swift client code and Swift Package outputs.
  timeline:
    - '2021: CreateAPI/CreateAPI repository created.'
    - '2022: 0.0.1 initial pre-release published.'
    - '2022: 0.1.0 added Homebrew publication and Swift Package Plugin support.'
    - '2023: 0.2.0 release published.'
  usage:
    - >
      Users run create-api generate against a JSON or YAML OpenAPI schema, optionally
      passing output and configuration options. The default configuration path is
      .create-api.yaml, and the tool can generate complete Swift packages or individual
      components for integration into an existing Swift project.
related-packages:
  - id: brew:openapi-generator
    reason: >
      OpenAPI Generator is the broader multi-language alternative when a project needs
      clients, servers, or documentation targets beyond Create API's Swift-focused
      output.
    rel: alternative
    sources:
      - https://github.com/CreateAPI/CreateAPI#readme
      - https://openapi-generator.tech/docs/generators/
  - id: brew:swift
    reason: >
      Create API emits complete Swift packages and its official workflow builds those
      generated packages with the Swift toolchain.
    rel: adjacent_workflow
    sources:
      - https://github.com/CreateAPI/CreateAPI/blob/main/Docs/Tutorial.md
      - https://docs.swift.org/swiftpm/documentation/packagemanagerdocs
