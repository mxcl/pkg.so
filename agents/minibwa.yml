config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The design deliberately mixes earlier tools by the same lineage: a BWA-MEM-style
      BWT/FM-index and variable-length seed search, ropebwt3-inspired supermaximal
      exact-match work, and minimap2-style chaining plus SIMD-based base alignment. The
      authors report comparable accuracy with much higher speed than BWA-MEM and
      BWA-MEM2, while noting that exact BWA-MEM compatibility is traded for algorithmic
      improvement.
  sources:
    - https://arxiv.org/abs/2606.15357
    - https://arxiv.org/html/2606.15357v1
    - https://github.com/lh3/bwa
    - https://github.com/lh3/minibwa
  summary:
    - >
      minibwa is a genomic read aligner from the BWA/minimap2 lineage. The repository
      identifies it as the successor of BWA-MEM for short-read alignment, and the arXiv
      preprint by Heng Li and Nils Homer presents it as a next iteration of BWA-MEM for
      standard whole-genome short reads, Hi-C reads, accurate long reads, and
      directional bisulfite sequencing data.
  usage:
    - >
      In practice, minibwa is a bioinformatics command-line aligner for pipelines that
      map sequencing reads to a reference genome before variant calling, methylation
      analysis, or related downstream analysis. Its package-manager niche is narrow but
      important: it gives genomics users an installable replacement candidate for
      BWA-MEM where performance and support for newer read types matter more than
      byte-for-byte legacy output.
related-packages:
  - id: brew:bwa
    reason: >
      Choose BWA when an established pipeline requires legacy BWA-MEM behavior or exact
      option compatibility; minibwa is the faster successor but does not produce
      identical alignments.
    rel: alternative
    sources:
      - https://github.com/lh3/minibwa#readme
      - https://github.com/lh3/bwa
  - id: brew:minimap2
    reason: >
      Choose minimap2 for noisy long reads, spliced RNA-seq, or long contigs, which
      minibwa explicitly does not support well.
    rel: alternative
    sources:
      - https://github.com/lh3/minibwa#readme
      - https://github.com/lh3/minimap2
  - id: brew:samtools
    reason: >
      Use SAMtools after minibwa to sort, convert, index, inspect, or otherwise process
      the SAM alignments it emits.
    rel: adjacent_workflow
    sources:
      - https://github.com/lh3/minibwa#readme
      - https://www.htslib.org/doc/samtools.html
