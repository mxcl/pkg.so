id: brew:regex-opt
display-name: regex-opt
repo: null
docs:
  - https://bisqwit.iki.fi/source/regexopt.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official release archive shows a small, long-lived command-line utility
      distributed as source tarballs rather than a large framework. Homebrew
      subsequently made it convenient to install on macOS.
  package-nerd-significance:
    - >
      regex-opt is an unusual single-purpose Unix-style filter: it transforms a regular
      expression into a generally shorter equivalent expression. Its explicit catalogue
      of supported and unsupported syntax also makes its optimization boundaries
      inspectable.
  project-history:
    - >
      Joel Yliluoma, also known as Bisqwit, wrote regex-opt as a GPL-licensed optimizer
      for Perl-compatible regular expressions. The official archive documents releases
      spanning 2004 through 2017.
  related-projects:
    - Perl-compatible regular-expression engines
    - GNU make
    - Homebrew
  sources:
    - https://bisqwit.iki.fi/source/regexopt.html
  summary:
    - >
      regex-opt is a command-line optimizer that rewrites supported Perl-compatible
      regular expressions using character-set folding, alternative combination, count
      simplification, parenthesis reduction, and repeated-sequence compression.
  timeline:
    - '2004: Version 1.0.0 appeared in the official release archive'
    - '2005–2007: The 1.1 and 1.2 release series expanded the utility'
    - '2012: Version 1.2.3 was published'
    - '2017: Version 1.2.4 was published'
  usage:
    - >
      Run regex-opt with a regular expression as its argument; it prints an optimized
      expression. Because anchors, capturing semantics, Unicode-specific markup, and
      several advanced constructs are unsupported or transformed, users should check
      compatibility before substituting its output in production patterns.
tags:
  - cli
  - optimizer
  - perl-compatible-regex
  - regex
  - text-processing
provenance:
