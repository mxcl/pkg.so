history:
  adoption-history:
    - >
      LanguageTool expanded from a Java-based standalone proofreader into a family of
      browser, office-suite, web, and desktop integrations. The desktop application
      brings real-time checking to applications such as Word, Mail, and Slack through
      operating-system integration.
    - >
      The open-source core supports more than 25 languages, which has encouraged broad
      use in multilingual proofreading tools and self-hosted deployments even though the
      modern desktop product is distributed separately.
  package-nerd-significance:
    - >
      LanguageTool is a long-lived open-source proofreading engine available through
      desktop packages, Java archives, command-line tools, a server, and an HTTP API.
      Package enthusiasts value the ability to run its core locally or self-host its
      server rather than relying exclusively on a hosted writing service.
    - >
      The desktop cask represents the polished end-user application, while the official
      repository remains important for the underlying engine and standalone tooling.
  project-history:
    - >
      LanguageTool dates to 2005 and was initiated by Daniel Naber with contributions
      from the LanguageTool community. It grew from a Java proofreading program into a
      multilingual grammar, style, and spell-checking platform.
    - >
      The open-source repository contains the core engine, language modules,
      command-line client, standalone interface, server, and office extension. In March
      2025, the standalone distribution moved from numbered ZIP releases to daily
      snapshots.
  related-projects:
    - LanguageTool open-source core
    - LanguageTool standalone
    - LanguageTool command-line client
    - LanguageTool server and HTTP API
    - LanguageTool browser and office integrations
  sources:
    - https://github.com/languagetool-org/languagetool
    - https://github.com/languagetool-org/languagetool-org.github.io/blob/master/roadmap.md
    - >
      https://github.com/languagetool-org/languagetool/blob/master/languagetool-standalone/README.md
    - https://help.languagetool.org/hc/en-us/categories/39254470614551-How-to-use-LanguageTool
  summary:
    - >
      LanguageTool for Desktop is the desktop integration of the multilingual
      LanguageTool proofreading service, providing grammar, spelling, and style
      suggestions across supported applications.
  timeline:
    - >
      2005: LanguageTool's official standalone documentation identifies the start of the
      project.
    - >
      2025: The standalone project switched from fixed-version ZIP releases to daily
      snapshots.
    - >
      2026: Official macOS guidance documents system-wide checking through accessibility
      permissions.
  usage:
    - >
      On macOS, users grant Accessibility permission so LanguageTool can read and
      interact with text in other applications and provide real-time corrections. The
      application also supports account-based Premium features, but no official
      credentials-file location is documented.
