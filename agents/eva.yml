history:
  adoption-history:
    - >
      The official README documents installation through Homebrew, crates.io, and manual
      source builds. The input package facts list packages for Homebrew, Alpine,
      MacPorts, Nix, Arch/Pacman, and Scoop.
  package-nerd-significance:
    - >
      eva is a small terminal calculator in the lineage of `bc`, interesting to package
      maintainers because it is a Rust CLI distributed through crates.io and several
      system package managers while keeping a focused single-binary interface.
  project-history:
    - >
      The official repository was created in 2019. Its README describes eva as a simple
      calculator REPL with syntax highlighting and persistent history, and Cargo
      metadata classifies it under command-line, science, and parser categories.
  related-projects:
    - bc
    - Rust
    - crates.io
    - Homebrew
  sources:
    - GitHub API for oppiliappan/eva repository metadata.
    - Official eva Cargo.toml.
    - Official eva README.
    - Official eva src/main.rs.
    - source_facts.package-manager
  summary:
    - eva is a Rust calculator REPL and command-mode calculator similar to `bc(1)`.
  timeline:
    - '2019: Official GitHub repository created.'
    - '2025: Repository metadata shows continued activity.'
  usage:
    - >
      eva can be launched as an interactive REPL or passed an expression argument for
      command mode. It supports arithmetic operators, constants, trigonometric and
      logarithmic functions, output radix and precision options, previous-answer reuse,
      syntax highlighting, and persistent REPL history.
related-packages:
  - id: brew:bc
    reason: >
      Choose GNU bc when POSIX-style scripting and the established bc language matter;
      choose eva for a modern interactive REPL with syntax highlighting and persistent
      history.
    rel: alternative
    sources:
