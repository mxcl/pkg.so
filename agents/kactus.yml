history:
  adoption-history:
    - >
      Kactus targeted designers and teams using Sketch who wanted branches, commits,
      pull requests, and collaboration without abandoning their existing design-file
      workflow. Adoption was consequently concentrated among macOS, Sketch, Git, and
      GitHub users.
  package-nerd-significance:
    - >
      Kactus occupies an unusual package niche: a specialized desktop Git client that
      converts design-document contents into a form suitable for source-control
      workflows. It also reflects the Electron-era expansion of Git clients beyond
      programming teams.
  project-history:
    - >
      Kactus was developed as an open-source Git client for designers, initially
      focusing on Sketch files. It combined conventional repository operations with
      parsing, visual change review, merging, and sharing features specific to design
      documents.
    - >
      The project published a long sequence of pre-1.0 releases. Its official repository
      is now archived, so the package should be treated as inactive software.
  related-projects:
    - Git
    - GitHub Desktop
    - Sketch
  sources:
    - https://github.com/kactus-io/kactus
    - https://github.com/kactus-io/kactus/releases
  summary:
    - >
      Kactus is an archived open-source macOS Git client designed to bring branch,
      review, merge, and collaboration workflows to Sketch documents.
  timeline:
    - '2017: Early public releases established Kactus as a Git workflow for Sketch users.'
    - '2021: The final 0.3.x releases were published before the project became inactive.'
  usage:
    - >
      Designers use Kactus to create or clone repositories, commit changes to Sketch
      documents, work on branches, inspect design changes, merge work, and collaborate
      through pull requests.
