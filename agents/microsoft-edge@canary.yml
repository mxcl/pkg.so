history:
  adoption-history:
    - >
      Microsoft distributes Canary alongside Dev and Beta as an Edge Insider channel.
      Insider builds install separately from stable Edge, allowing multiple channels to
      coexist.
    - >
      Homebrew Cask exposes the macOS Canary build under a versioned cask name, making
      daily preview builds accessible through familiar package-manager workflows.
  package-nerd-significance:
    - >
      Canary is valuable to web developers and browser testers because it exposes
      upcoming Edge and Chromium behavior earlier than the stable channel, at the cost
      of being Microsoft's least stable Edge channel.
    - >
      Keeping stable and Canary installations side by side is useful for regression
      testing, standards experimentation, and checking whether a browser bug has already
      changed upstream.
  project-history:
    - >
      Microsoft's modern Edge browser was rebuilt on Chromium and released in January
      2020. Canary forms the earliest public tier of the browser's continuously updated
      Insider pipeline.
  related-projects:
    - Microsoft Edge stable is the production channel.
    - Edge Dev and Edge Beta provide progressively more stable preview tiers.
    - Chromium is the upstream open-source browser project used by modern Edge.
  sources:
    - >
      https://support.microsoft.com/en-us/microsoft-edge/what-s-the-difference-between-the-new-microsoft-edge-and-microsoft-edge-legacy-a01258e5-8c05-7bbb-bed2-c65bec0eb126
    - https://www.microsoft.com/en-us/edge/download/insider
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Microsoft Edge Canary is Microsoft's daily, least-stable preview channel for its
      Chromium-based Edge browser. This record packages the macOS Canary application
      through Homebrew Cask.
  timeline:
    - '2020: The Chromium-based Microsoft Edge reached general availability.'
    - >
      Present: Microsoft describes Canary as a daily-updated Insider channel and its
      least stable preview tier.
  usage:
    - >
      Use Canary to test forthcoming browser changes, reproduce bugs against a newer
      engine build, and validate sites or extensions before changes reach stable Edge.
    - >
      Microsoft documents the default Canary user-data directory on macOS as
      ~/Library/Application Support/Microsoft Edge Canary. That directory contains
      application state rather than one documented configuration file.
