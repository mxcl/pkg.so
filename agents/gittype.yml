credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption evidence is early but concrete: the project is distributed through Cargo
      and Homebrew, and package metadata also lists Nix and WinGet. That spread is
      notable for a game-like developer utility because it makes the same terminal toy
      easy to install in macOS, Linux, and Windows workflows.
  package-nerd-significance:
    - >
      gittype shows how modern Rust CLIs can blur package categories: it is a game, a
      code parser, and a GitHub-aware terminal app. For package catalogues, it belongs
      near developer toys that are useful precisely because they understand source
      trees.
  project-history:
    - >
      The repository was opened in 2025 and published early to the Rust crate ecosystem.
      The README positions the tool around practicing with a user's own code, cloning
      public GitHub repositories, browsing trending repositories, and tracking live
      typing metrics.
    - >
      The first GitHub release was v0.1.1 in August 2025, followed by a rapid 0.x
      release line. By the 0.10.0 release, the README documented several play modes,
      supported programming languages, themes, repository caching, ranking, and
      analytics screens.
  related-projects:
    - Cargo and Rust terminal UI tooling.
    - GitHub repository browsing and cloning workflows.
    - Gitlogue, a related project by the same author for animating Git commit history.
  sources:
    - https://api.github.com/repos/unhappychoice/gittype
    - https://api.github.com/repos/unhappychoice/gittype/releases
    - https://crates.io/api/v1/crates/gittype
    - https://crates.io/crates/gittype
    - https://formulae.brew.sh/formula/gittype
    - https://github.com/unhappychoice/gittype
    - https://raw.githubusercontent.com/unhappychoice/gittype/main/README.md
  summary:
    - >
      gittype is a Rust command-line typing game that turns source code into practice
      text. Its niche is developer-oriented play: instead of generic drills, it extracts
      functions and repository content so programmers can practice typing code-shaped
      text.
  timeline:
    - '2025: Public GitHub repository opened.'
    - '2025: Crate publication recorded on crates.io.'
    - '2025: v0.1.1 release published.'
    - '2026: v0.10.0 release line documented in GitHub releases.'
  usage:
    - >
      Practitioners run `gittype` inside a repository, pass a local path, or use
      `--repo` with a GitHub owner/repository name or clone URL. The README also
      documents a `trending` command for browsing public repositories and a cached
      repository mode for repeated play.
    - >
      The tool is used less as production infrastructure and more as a terminal-native
      exercise, onboarding, or procrastination aid: it makes developers type real
      functions, symbols, and idioms from source trees while showing WPM, accuracy,
      ranks, and themed game screens.
