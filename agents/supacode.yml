id: cask:supacode
display-name: Supacode
repo: https://github.com/supabitapp/supacode
docs:
  - https://docs.supacode.sh/
  - https://docs.supacode.sh/configuration/settings-and-storage
  - https://docs.supacode.sh/getting-started/installation
  - https://docs.supacode.sh/reference/faq
config-file-location:
  macos:
    - ~/.supacode/settings.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Supacode is distributed as a free, open-source macOS beta and through the Homebrew
      cask identified by source_facts.package-manager. Its documented workflow supports
      any shell-based coding agent rather than requiring a proprietary agent protocol.
  package-nerd-significance:
    - >
      Supacode combines several tools popular in contemporary terminal development—Git
      worktrees, coding-agent CLIs, Ghostty, and GitHub CLI—inside a native application.
      Package users may especially care about its local JSON configuration, predictable
      managed-worktree directory, macOS requirement, and reliance on separately
      installed command-line tools.
  project-history:
    - >
      Supacode was introduced as a native macOS command center for running
      terminal-based coding workflows across isolated Git worktrees. The application
      uses SwiftUI and GhosttyKit, keeps repository and worktree state locally, and
      layers GitHub pull-request and continuous-integration awareness on top of the `gh`
      command-line client.
  related-projects:
    - >
      The official documentation names Ghostty and GhosttyKit, Git, GitHub CLI, Codex,
      Claude Code, OpenCode, Aider, and mise as related tools.
  sources:
    - https://docs.supacode.sh/
    - https://docs.supacode.sh/configuration/settings-and-storage
    - https://docs.supacode.sh/getting-started/installation
    - https://docs.supacode.sh/reference/faq
    - https://supacode.sh/
    - source_facts.package-manager
  summary:
    - >
      Supacode is an open-source native macOS application for organizing repositories,
      running terminal-based coding agents in separate Git worktrees, and monitoring
      GitHub pull requests and continuous-integration checks.
  timeline:
    - >
      2026: The official site presents Supacode as a free macOS beta and open-source
      coding-agent command center.
  usage:
    - >
      Users add a Git repository, create an isolated worktree, and run an agent,
      development server, tests, or other commands in the worktree's Ghostty-backed
      terminal tabs and splits. Managed worktrees live below `~/.supacode/repos/`.
      GitHub features use the separately authenticated `gh` CLI, while repository setup
      scripts can automatically start an agent in newly created worktrees.
