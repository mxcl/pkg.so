id: brew:checkmake
display-name: checkmake
repo: null
docs:
  - https://github.com/checkmake/checkmake/tree/main/docs
  - https://github.com/checkmake/checkmake#readme
config-file-location:
  unix:
    - ./checkmake.ini
  windows:
    - .\checkmake.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation with Go, prebuilt releases, packages,
      packagecloud, Homebrew-style package-manager use through batch metadata, and
      official container images on quay.io. It also provides pre-commit hook
      configuration for repository-level adoption.
    - >
      The README notes that checkmake is natively embedded in MegaLinter, which makes it
      available inside a broader multi-language linting workflow even when users do not
      install it directly.
  package-nerd-significance:
    - >
      checkmake is package-nerd interesting because it lints one of the oldest
      build-description formats still found in modern repositories. It is also a tidy
      example of a Go CLI distributed through source install, binary releases,
      containers, packagecloud, Homebrew, MacPorts, Nix, and distro packages.
    - >
      Its presence in pre-commit and MegaLinter shows the common path from standalone
      command to plumbing inside larger developer-tool aggregators.
  project-history:
    - >
      The checkmake/checkmake repository was created in August 2016 and describes the
      project as a linter and analyzer for Makefiles. The README says it scans one or
      more Makefiles for potential issues according to configurable rules.
    - >
      The project was inspired by an idea from Dan Buch, according to the README, and
      later moved into the checkmake GitHub organization while retaining older badge
      references to the original mrtazz/checkmake namespace.
  related-projects:
    - pre-commit is an adjacent integration surface documented by the project.
    - >
      MegaLinter embeds checkmake for Makefile linting, and GNU Make is the input format
      the tool analyzes.
  sources:
    - https://github.com/checkmake/checkmake
    - https://github.com/checkmake/checkmake/releases
    - https://github.com/checkmake/checkmake#readme
  summary:
    - >
      checkmake is a Go command-line linter for Makefiles. It is a small but
      package-relevant tool because Makefiles are ubiquitous, and checkmake gives them
      the kind of static analysis that shell scripts, YAML, and source code often
      already receive.
  timeline:
    - '2016: checkmake/checkmake repository created.'
    - '2022: 0.2.1 release published on GitHub.'
    - '2023: 0.2.2 release used in the official pre-commit example.'
    - '2026: v0.3.x releases published, showing renewed maintenance.'
  usage:
    - >
      Typical usage is to run checkmake against Makefile, GNUmakefile, or *.mk inputs
      and receive text or JSON reports. The CLI supports a default checkmake.ini
      configuration file, listing rules, and custom output templates.
    - >
      In CI and pre-commit workflows, checkmake is used to catch missing phony
      declarations and similar Makefile maintainability issues before they are merged.
related-packages:
  - id: brew:pre-commit
    reason: >
      Use pre-commit to install and run checkmake automatically for matching Makefiles
      before commits or across all repository files using checkmake's official hooks.
    rel: adjacent_workflow
    sources:
      - https://github.com/checkmake/checkmake#pre-commit-usage
      - https://pre-commit.com/
tags:
  - cli
  - go
  - linting
  - makefile
  - static-analysis
geiger:
  category: appliance
  color: green
  confidence: low
  reason: narrow executable package without higher-risk signals
  reasons:
    - narrow executable package without higher-risk signals
  signals:
    - metadata:no-higher-risk-signals
provenance:
  category-sources:
    - >
      Official README describes checkmake as a linter for Makefiles that scans for
      potential issues based on configurable rules.
  display-name-sources:
    - Official GitHub repository and README use the display name checkmake.
  docs-sources:
    - >
      Official GitHub repository README documents checkmake usage and command-line
      flags; repository has an official docs directory at
      https://github.com/checkmake/checkmake/tree/main/docs.
    - >
      Official README documents --config default as checkmake.ini and notes the default
      config file name checkmake.ini in the current working directory.
  history-sources:
    - https://github.com/checkmake/checkmake
    - https://github.com/checkmake/checkmake/releases
    - https://github.com/checkmake/checkmake#readme
  repo-sources:
    - >
      source_facts.repo is already https://github.com/checkmake/checkmake; prompt
      requires returning repo as null when source_facts.repo is populated.
  tags-sources:
    - >
      Official README describes a CLI Makefile linter/analyzer; repository language
      metadata and install instructions show Go.
category-confidence: high
category-path:
  - developer-tools
  - linting
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: high
tags-confidence: high
