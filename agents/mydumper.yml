    - /opt/homebrew/etc/mydumper.cnf
credentials-file-location: null
history:
  project-history:
    - >
      The project has long occupied the DBA niche between the official mysqldump client
      and heavier physical-backup systems. Package descriptions and project
      documentation emphasize separate output files for tables and metadata, consistent
      snapshots across worker threads, binary log position capture, compression,
      regex-based selection, and parallel restore. A 2015 Percona post about version
      0.9.1 highlighted full schema support in MyDumper/MyLoader, reducing the need to
      combine MyDumper data dumps with mysqldump schema dumps.
  sources:
    - https://community.linuxmint.com/software/view/mydumper
    - https://formulae.brew.sh/formula/mydumper
    - https://github.com/mydumper/mydumper
    - https://learn.microsoft.com/en-us/azure/mysql/migrate/concepts-migrate-mydumper-myloader
    - https://mydumper.github.io/mydumper/docs/html/index.html
    - https://www.percona.com/blog/logical-mysql-backup-tool-mydumper-0-9-1-now-available/
  summary:
    - >
      MyDumper is a community-maintained logical backup and restore toolset for
      MySQL-family databases. Its own documentation frames the project as a response to
      the limits of mysqldump: mysqldump is widely used for logical backups, but its
      single-threaded design makes large backups and restores slow. MyDumper split that
      workflow into two programs, `mydumper` for exporting consistent backups and
      `myloader` for importing them, with both tools built around multithreading.
  usage:
    - >
      In practice, MyDumper is used for fast logical backups, restores, and migrations
      where SQL-level portability matters but database size makes serial dumps painful.
      Cloud migration guides from Microsoft describe mydumper/myloader as community
      tools for large Azure Database for MySQL migrations, including examples that run
      MyDumper near the source database, tune thread counts, split table data into
      chunks, compress traffic, and restore with MyLoader on the target. Homebrew, Nix,
      and Ubuntu package it as `mydumper`, usually exposing the two command-line
      programs `mydumper` and `myloader`.
related-packages:
  - id: brew:mysql-client
    reason: >
      Choose MySQL Client's mysqldump for straightforward, portable logical exports;
      choose MyDumper when parallel backup and restore are important for larger
      datasets.
    rel: alternative
    sources:
      - https://mydumper.github.io/mydumper/docs/html/
      - https://dev.mysql.com/doc/refman/8.4/en/mysqldump.html
  - id: brew:percona-xtrabackup
    reason: >
      Choose Percona XtraBackup for physical hot backups on the database host; choose
      MyDumper for portable logical backups, remote execution, and selective table
      restores.
    rel: alternative
    sources:
      - https://docs.percona.com/percona-monitoring-and-management/3/apps/mysql-backup.html
      - https://mydumper.github.io/mydumper/docs/html/
