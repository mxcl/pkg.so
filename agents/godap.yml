id: brew:godap
display-name: godap
repo: null
docs:
  - https://github.com/Macmod/godap#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      godap's adoption is visible through security and directory-service packaging
      channels rather than broad language-runtime ecosystems. The README says community
      members published working releases in Homebrew, Alpine Linux community, and Arch
      AUR, while upstream provides automated releases for several platforms.
    - >
      GitHub repository metadata showed hundreds of stars by June 2026, consistent with
      a specialized but visible tool for LDAP and Active Directory operators.
  package-nerd-significance:
    - >
      Package nerds care about godap because it is a modern Go TUI packaged for a niche
      operational workflow. It shows how security and infrastructure tools often move
      from GitHub releases to Homebrew, Alpine, and AUR once operators want repeatable
      workstation installs.
    - >
      It also has unusually rich credential and transport surfaces for a CLI package,
      which matters to packagers and users checking docs for Kerberos, certificates,
      LDAPS, StartTLS, SOCKS, and Active Directory behavior.
  project-history:
    - >
      The public GitHub repository was created in December 2023. The README describes
      godap as a complete terminal user interface for LDAP and lists authentication
      support for passwords, NTLM hashes, Kerberos tickets, and PEM or PKCS#12
      certificates.
    - >
      The project grew quickly through the 2.x release line. Its README calls it a fun
      side project that became useful, and the release history shows frequent 2.10.x
      maintenance and feature releases through 2025 and early 2026.
  related-projects:
    - tview is the Go terminal UI toolkit named by the repository topics.
    - >
      ldapper and Darksteel are acknowledged as sources for adapted DACL parsing and
      SOCKS code.
    - BadBlood is acknowledged as useful test data during development.
  sources:
    - https://api.github.com/repos/Macmod/godap
    - https://api.github.com/repos/Macmod/godap/releases
    - https://formulae.brew.sh/api/formula/godap.json
    - https://github.com/Macmod/godap
    - https://github.com/Macmod/godap/releases
    - https://github.com/Macmod/godap/wiki/0.-General
  summary:
    - >
      godap is a Go terminal user interface for LDAP, with a strong focus on Active
      Directory browsing and administration. It combines LDAP bind options, tree
      browsing, searches, group membership work, deleted-object inspection, DACL
      editing, GPO viewing, ADIDNS operations, and export workflows in a single TUI.
  timeline:
    - '2023-12: GitHub repository created.'
    - '2024-12: v2.10.2 and v2.10.3 releases published.'
    - '2025-02: v2.10.4 released.'
    - '2025-10: v2.10.7 released.'
    - '2026-03: v2.11.0 released.'
  usage:
    - >
      Typical usage is `godap <hostname or IP>` with bind flags for username and
      password, NTLM hash, Kerberos ticket, certificate, anonymous bind, LDAPS,
      StartTLS, or SOCKS proxy. The README and wiki document in-session connection
      changes, reconnects, TLS upgrades, paging, formatting, colors, expanded
      attributes, and deleted-object controls.
    - >
      godap is interactive by design: users navigate LDAP trees, search objects, inspect
      and edit attributes, manage groups, export data, and perform Active
      Directory-specific operations from terminal keybindings.
related-packages:
  - id: brew:ldapvi
    reason: >
      Choose ldapvi for a traditional editor-driven LDAP modification workflow; choose
      godap for a full-screen tree browser with broader Active Directory-specific
      operations.
    rel: alternative
    sources:
      - https://github.com/Macmod/godap#readme
      - http://www.lichteblau.com/ldapvi/
