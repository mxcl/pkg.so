id: brew:clang-format
display-name: clang-format
repo: null
docs:
  - https://clang.llvm.org/docs/ClangFormat.html
config-file-location:
  unix:
    - .clang-format
    - _clang-format
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager data shows Homebrew, Debian, Fedora/DNF, and Ubuntu
      packaging. Its adoption is reinforced by direct editor integration in Vim, Emacs,
      BBEdit, CLion, Visual Studio, and similar tooling documented by LLVM.
  package-nerd-significance:
    - >
      clang-format is significant because it decouples source formatting policy from any
      one IDE. Package managers provide a pinned binary that projects can call from
      hooks, CI jobs, editor plugins, and language-server-style workflows, making
      formatting reproducible across operating systems.
  project-history:
    - >
      LLVM's Clang 3.3 documentation already described ClangFormat as tools built on
      LibFormat, with a standalone clang-format binary under clang/tools/clang-format.
      Later documentation expanded language coverage, configuration files, ignore files,
      and editor integrations.
  related-projects:
    - >
      Related projects include LLVM, Clang, LibFormat, git-clang-format, clang-format
      editor plugins, clangd, and language-specific formatters such as gofmt, rustfmt,
      black, and prettier.
  sources:
    - https://clang.llvm.org/docs/ClangFormat.html
    - https://github.com/llvm/llvm-project
    - https://releases.llvm.org/3.3/tools/clang/docs/ClangFormat.html
    - https://releases.llvm.org/3.4/tools/clang/docs/ClangFormat.html
    - https://releases.llvm.org/11.1.0/tools/clang/docs/ReleaseNotes.html
  summary:
    - >
      clang-format is LLVM/Clang's source formatter and editor-integration tool for
      C-family and several adjacent languages. It became a standard package-manager
      dependency because teams can install one CLI and enforce formatting locally, in
      editors, in Git workflows, and in CI.
  timeline:
    - '2013: Clang 3.3 documentation included clang-format for C/C++/Obj-C.'
    - '2014: Clang 3.4 documentation documented multi-file formatting and dump-config support.'
    - >
      2020: LLVM 11 release notes continued adding clang-format style options such as
      IndentExternBlock.
    - >
      2026: Current LLVM documentation lists broader language support including Java,
      JavaScript, JSON, TypeScript, C#, Protobuf, and Objective-C.
  usage:
    - >
      Users run clang-format over files or standard input, often with -i for in-place
      edits. Project style is commonly stored in .clang-format or _clang-format,
      generated with -dump-config, and found by using -style=file.
related-packages:
  - id: brew:astyle
    reason: >
      Artistic Style is an alternative C-family formatter that also supports Java and
      can be used as either a CLI or library, making it useful when embeddability or
      AStyle's formatting model is preferred.
    rel: alternative
    sources:
      - https://astyle.sourceforge.net/
      - https://astyle.sourceforge.net/astyle.html
      - https://clang.llvm.org/docs/ClangFormat.html
  - id: brew:gnu-indent
    reason: >
      GNU indent is a narrower alternative for projects that only need traditional C
      formatting and GNU, K&R, Berkeley, or Linux-style presets.
    rel: alternative
    sources:
      - https://www.gnu.org/software/indent/
      - https://www.gnu.org/software/indent/manual/indent.html
      - https://clang.llvm.org/docs/ClangFormat.html
