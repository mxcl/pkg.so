id: brew:aldo
display-name: Aldo
repo: https://git.savannah.nongnu.org/cgit/aldo.git
docs:
  - https://git.savannah.nongnu.org/cgit/aldo.git/plain/aldo.1
  - https://www.nongnu.org/aldo
config-file-location:
  unix:
    - ~/.aldorc
credentials-file-location: null
history:
  adoption-history:
    - >
      Aldo appears in the supplied package facts across Homebrew, Debian, Ubuntu,
      Fedora, openSUSE, and Nix. That is the adoption profile of a stable utility whose
      upstream is quiet but whose source remains portable enough for distributions to
      keep carrying.
    - >
      Its Debian-oriented man page and Savannah hosting reflect an older GNU/Linux
      packaging culture: source tarballs, man pages, GPL licensing, and a user-specific
      dotfile under the home directory.
  package-nerd-significance:
    - >
      Aldo is significant less because it is large and more because it is archetypal: a
      tiny GPL command-line program, old enough to have moved through SourceForge-era
      email addresses and Savannah, still packaged by modern distros.
    - >
      For package maintainers, the interesting bits are exactly the boring ones: libao
      linkage, old C++ code, man page availability, and a stable home-directory config
      file.
  project-history:
    - >
      The official Savannah source dates Aldo's beginning to May 6, 2001 and lists
      Giuseppe Martino as the original author. Its man page describes it as a console
      Morse-code trainer developed from scratch in ISO C++ with the GNU C++ standard
      library and libao.
    - >
      The NEWS file shows rapid early development in 2003-2005: a Koch training method,
      callsign exercise, exercise generation, persistent Koch settings,
      autoconf/automake support, and a 0.7.0 switch to libao. The Savannah cgit summary
      shows later maintenance tags through v0.7.8 in 2013.
  related-projects:
    - Aldo's closest technical dependency is libao, used for portable audio output.
    - >
      Its training methods place it near other Morse and amateur-radio learning
      utilities rather than general productivity suites.
  sources:
    - https://git.savannah.nongnu.org/cgit/aldo.git
    - https://git.savannah.nongnu.org/cgit/aldo.git/plain/NEWS
    - https://git.savannah.nongnu.org/cgit/aldo.git/plain/aldo.1
    - https://git.savannah.nongnu.org/cgit/aldo.git/plain/src/main.cc
    - source_facts.package-manager
  summary:
    - >
      Aldo is a small console Morse-code trainer written in ISO C++. It belongs to the
      long-lived class of ham-radio and learning tools that survive in package managers
      because they do one offline task with minimal ceremony.
  timeline:
    - '2001-05-06: Source header records the project beginning.'
    - '2003-07-06: NEWS records Aldo 0.5.0 with Koch method and exercise-from-file support.'
    - '2004-11-20: Man page date for the Debian-oriented manual page.'
    - '2005-10-04: Aldo 0.7.0 switched to libao and removed soundcard configuration.'
    - '2013-07-16: Savannah cgit shows v0.7.8 tag and last listed maintenance commits.'
  usage:
    - >
      Running `aldo` opens a menu-driven console trainer with Blocks, Koch, File, and
      Callsign exercises. The Koch mode starts with two Morse characters at full speed
      and adds characters as the learner reaches the target recognition threshold.
    - >
      Configuration is stored in `~/.aldorc`; the source creates a default config if
      that file is missing. Audio output is handled through libao, so device selection
      follows the selected libao driver.
related-packages:
  - id: brew:morse
    reason: >
      Choose morse-classic when you want a smaller Unix filter and QSO generator, rather
      than Aldo's menu-driven collection of training exercises.
    rel: alternative
    sources:
      - https://www.nongnu.org/aldo/
      - http://www.catb.org/~esr/morse/
tags:
  - cli
  - education
  - morse-code
