history:
  adoption-history:
    - >
      Squash is distributed as a native macOS application. Its drag-and-drop workflow is
      aimed at photographers, web developers, journalists, bloggers, and other users who
      routinely prepare collections of images; the supplied package record also
      identifies a Homebrew cask.
  package-nerd-significance:
    - >
      Squash packages a repeatable batch-image pipeline in a Mac-native GUI, covering
      several jobs that otherwise require separate command-line image tools or scripted
      workflows. Presets and Apple Shortcuts support make it useful for lightweight
      automation.
  project-history:
    - >
      Squash was created by the UK-based Realmac Software as a batch image-processing
      application for macOS. Squash 3 was rewritten from the ground up with newer Apple
      technologies and incorporated vintage effects derived from Realmac's earlier
      Analog application after Realmac reacquired Analog in 2020.
  related-projects:
    - >
      Analog supplied the vintage effects system later incorporated into Squash 3. Apple
      Shortcuts can automate supported Squash workflows.
  sources:
    - 'Official documentation: https://docs.realmacsoftware.com/squash-docs/'
    - 'Official press kit: https://www.realmacsoftware.com/squash/press-kit/'
    - 'Official release notes: https://www.realmacsoftware.com/squash/releasenotes/'
    - source_facts.package-manager.brew-cask
  summary:
    - Squash is Realmac Software's native macOS application for batch-processing images.
  timeline:
    - '2020: Realmac reacquired Analog and ported its effects system into Squash 3.'
    - '2021: Squash 3 entered early access on June 21 after a ground-up rewrite.'
    - >
      Later Squash 3 releases added presets, expanded watermarking, modern image
      formats, and Apple Shortcuts support.
  usage:
    - >
      Users drag one or many images into Squash and build operations that resize,
      convert, compress, rename, adjust, filter, strip location metadata, or apply text
      and image watermarks. Saved presets support recurring export workflows.
