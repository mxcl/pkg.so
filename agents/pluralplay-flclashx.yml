history:
  adoption-history:
    - >
      FlClashX is distributed across desktop and mobile operating systems, including
      macOS, Windows, Linux, and Android. The repository documents desktop tray or
      menu-bar operation, Android and Android TV behavior, and provider-driven
      subscription customization.
    - >
      Its adoption is oriented toward users of Clash-compatible subscription services
      who want a graphical, cross-platform client with TUN and system-proxy controls.
  package-nerd-significance:
    - >
      FlClashX sits in the active family tree of Clash-compatible clients: it is a fork
      of FlClash and uses the Mihomo core. That layered provenance matters to packagers
      because the Flutter interface and networking core have distinct build and release
      concerns.
    - >
      The project exposes unusually extensive provider customization through HTTP
      response headers and YAML extensions. Package maintainers must also account for
      privileged networking helpers, TUN behavior, tray integration, and
      platform-specific artifacts.
  project-history:
    - >
      FlClashX began as a fork of the multi-platform FlClash proxy client and retained
      the project's Flutter-based cross-platform approach. Its official description
      emphasizes an open-source, advertising-free interface over a Clash-compatible
      core.
    - >
      The fork added opinionated defaults and provider-facing capabilities, including
      dashboard widgets, profile metadata, subscription-header customization, Android TV
      controls, a macOS status-bar interface, and configuration overrides.
  related-projects:
    - FlClash is the upstream project from which FlClashX was forked.
    - Mihomo provides the Clash-compatible networking core used by the client.
    - >
      Remnawave is an optionally integrated provider-panel ecosystem referenced by
      several FlClashX metadata and interface features.
  sources:
    - https://github.com/pluralplay/FlClashX
    - https://github.com/pluralplay/FlClashX/blob/main/README_EN.md
    - https://github.com/pluralplay/FlClashX/releases
  summary:
    - >
      FlClashX is an open-source, cross-platform graphical proxy client forked from
      FlClash and built around a Clash-compatible Mihomo core. It manages subscription
      profiles, proxy selection, TUN or system-proxy operation, and provider-supplied
      interface metadata.
  timeline:
    - >
      FlClashX forked the multi-platform FlClash client and established its own feature
      and release line.
    - >
      The project subsequently expanded provider-controlled widgets, profile metadata,
      configuration overrides, Android TV support, and macOS status-bar integration.
  usage:
    - >
      Users import a provider subscription or profile, select proxies and operating
      modes, and enable TUN, VPN, or system-proxy behavior as appropriate to the
      platform.
    - >
      Providers can customize the client through documented subscription response
      headers and YAML keys. Local override settings let users retain control over
      provider-supplied application and network defaults.
