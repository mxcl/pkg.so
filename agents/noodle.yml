id: brew:noodle
display-name: Noodle
repo: null
docs:
  - https://noodlerest.dev/docs
config-file-location:
  unix:
    - ~/.config/noodle/config.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Noodle is packaged for Homebrew according to the supplied metadata. Its workflow
      is designed to span an interactive terminal interface, command-line automation,
      CI, scripts, and coding agents without converting the underlying collections.
  package-nerd-significance:
    - >
      Its distinguishing package-culture idea is that the repository itself is the API
      workspace: human-readable request files live beside source code and can be
      reviewed and versioned rather than being trapped in an application database.
  project-history:
    - >
      Noodle was created as an open-source terminal REST client organized around
      file-based collections. The project evolved into a combined TUI and CLI with
      import, testing, scripting, response capture, authentication, and CI-oriented
      collection execution.
  related-projects:
    - Postman
    - Insomnia
    - OpenAPI
    - cURL
  sources:
    - https://github.com/wilfredinni/noodle
    - https://noodlerest.dev/
    - https://noodlerest.dev/docs/
    - source_facts.package-manager
  summary:
    - >
      Noodle is a terminal REST client whose requests, folder settings, environments,
      and collection metadata are stored as readable files within a project repository.
  timeline:
    - >
      Current generation: Provides a TUI, CLI automation, file-based collections,
      scripting, assertions, captures, and imports from established API-client formats.
  usage:
    - >
      Users create YAML request files inside a collection, select dotenv-style
      environments, and send requests interactively or with `noodle request run` and
      `noodle collection run`. Sensitive environment values and selected proxy or TLS
      secrets are kept in the operating system credential vault rather than plaintext
      collection files.
