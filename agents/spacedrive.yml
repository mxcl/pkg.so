history:
  adoption-history:
    - >
      Spacedrive gained substantial open-source attention around its ambition to unify
      local, removable, cloud, and peer devices in one file-management interface. Its
      official GitHub repository reports a large contributor and watcher community,
      while releases have supplied macOS, Linux, Windows, and server builds at different
      stages of maturity.
    - >
      A Homebrew cask was in use by 2023, giving macOS package users a conventional
      installation and upgrade path. Development was paused after the 0.4.3 release
      because of funding constraints, then resumed around a ground-up multi-device
      rewrite.
  package-nerd-significance:
    - >
      Spacedrive is notable to package enthusiasts because it combines a polished
      desktop application with a large Rust and TypeScript monorepo, Tauri clients, a
      daemon and CLI, SQLite-backed metadata, content hashing, peer-to-peer
      synchronization, and cloud-volume adapters.
    - >
      Its release history is also a useful example of the packaging difficulties
      surrounding ambitious cross-platform desktop software: native dependencies,
      platform-specific artifacts, alpha channels, data-format migrations, and an
      evolving licensing model all matter alongside the application itself.
  project-history:
    - >
      Spacedrive began as an open-source attempt to build a cross-platform file explorer
      around a virtual distributed filesystem rather than a single machine's directory
      tree. Early alpha releases developed file indexing, media metadata, previews,
      tagging, and the foundations for mobile and multi-device synchronization.
    - >
      After the 0.4 series, the team temporarily paused its roadmap because of funding
      constraints. Work later continued as a ground-up rewrite centered on peer-to-peer
      synchronization, cross-device file operations, cloud volumes, automation, and a
      reusable Rust core. The official project subsequently described this rewrite
      through its 2.0 alpha series.
  related-projects:
    - Tauri supplies the cross-platform desktop application framework used by Spacedrive.
    - Iroh and QUIC underpin parts of the peer-to-peer networking design.
    - >
      Spacebot is a related open-source agent runtime that can use Spacedrive as a data,
      permission, and execution layer.
  sources:
    - >
      Official Homebrew discussion:
      https://github.com/spacedriveapp/spacedrive/discussions/1547
    - 'Official documentation: https://v2.spacedrive.com/overview/introduction'
    - 'Official releases: https://github.com/spacedriveapp/spacedrive/releases'
    - 'Official repository and README: https://github.com/spacedriveapp/spacedrive'
  summary:
    - >
      Spacedrive is an open-source, cross-platform file manager and data platform built
      around a Rust virtual distributed filesystem. It indexes content across devices
      and storage providers, presents disconnected files in a unified catalog, and is
      developing peer-to-peer synchronization, deduplication, cloud volumes, and
      automation interfaces.
  timeline:
    - '2023: The project documented successful installation through a Homebrew cask.'
    - >
      2024: The 0.3 and 0.4 alpha series expanded indexing, previews, localization, and
      multi-device foundations.
    - '2025: Release 0.4.3 marked a temporary roadmap pause caused by funding constraints.'
    - >
      2025–2026: The project introduced a ground-up 2.0 alpha rewrite focused on
      peer-to-peer, cross-device operation.
    - >
      2026: Development continued on Windows and server builds, pairing,
      synchronization, cloud volumes, and automation.
  usage:
    - >
      Users add local or external locations to a Spacedrive library, index their
      contents, and browse, search, preview, tag, deduplicate, or organize files through
      a single interface.
    - >
      Multi-device users can pair peers and synchronize metadata directly. The newer
      architecture also treats supported cloud services and script-based data adapters
      as searchable sources alongside local files.
    - >
      Developers can build the monorepo with Rust, Bun, Just, and Python, or use its CLI
      and server components for scripted and headless workflows. The 2.0 line remains
      alpha software, so testing and migration planning are important.
