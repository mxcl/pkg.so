id: brew:clang-uml
display-name: clang-uml
repo: null
docs:
  - https://clang-uml.github.io/
  - https://clang-uml.github.io/md_docs_2configuration__file.html
  - https://clang-uml.github.io/md_docs_2quick__start.html
config-file-location:
  unix:
    - ./.clang-uml
credentials-file-location: null
history:
  adoption-history:
    - >
      Distribution broadened beyond source builds: the input metadata lists Homebrew,
      MacPorts, Nix, and winget packaging. Homebrew ships bottles for macOS and Linux
      and reported 615 installs over the prior 365 days for the formula.
  package-nerd-significance:
    - >
      clang-uml matters to package nerds because it is a substantial LLVM consumer
      packaged as a cross-platform CLI: it exposes the friction points of
      compiler-version pinning, C++ dependency packaging, and diagram-tool integration
      in one formula.
  project-history:
    - >
      The public repository was created in 2021. Its README describes the project as a
      way to keep diagrams up to date inside a codebase and to document legacy code from
      real source, with output support for PlantUML, Mermaid, GraphML, and JSON.
    - >
      The release series has grown from 0.1.0 through 0.6.x, with the Homebrew stable
      version 0.6.2 using LLVM 21 and yaml-cpp. The documentation includes a dedicated
      configuration reference and quick-start workflow around a .clang-uml file.
  related-projects:
    - >
      clang-include-graph is a narrower sibling project by the same author focused on
      include relationships.
    - >
      PlantUML, Mermaid, and GraphML are core output ecosystems for clang-uml, while
      Clang's JSON compilation database is the build-system interface.
  sources:
    - https://github.com/bkryza/clang-uml#readme
    - https://clang-uml.github.io/
    - https://github.com/bkryza/clang-uml/blob/master/docs/configuration_file.md
    - https://github.com/bkryza/clang-uml/blob/master/docs/quick_start.md
    - https://api.github.com/repos/bkryza/clang-uml
    - https://api.github.com/repos/bkryza/clang-uml/releases
    - https://formulae.brew.sh/api/formula/clang-uml.json
  summary:
    - >
      clang-uml is a Clang-based automatic diagram generator for C, C++, and Objective-C
      codebases, using YAML configuration to produce class, sequence, package, and
      include diagrams.
  timeline:
    - '2021: GitHub repository created.'
    - '2024: 0.5.x releases expanded the maintained release train.'
    - '2025: 0.6.0, 0.6.1, and 0.6.2 releases published.'
    - '2026: Homebrew formula metadata lists 0.6.2 as stable with bottles for macOS and Linux.'
  usage:
    - >
      A typical workflow is to run clang-uml --init, edit .clang-uml to point at a
      compile_commands.json database and diagram definitions, then generate PlantUML,
      Mermaid, GraphML, or JSON diagram output from selected source globs.
related-packages:
  - id: brew:clang-include-graph
    reason: >
      clang-include-graph is a narrower alternative when the task is specifically
      include-cycle, include-tree, reverse-dependency, or topological analysis rather
      than general UML generation.
    rel: alternative
    sources:
      - https://clang-uml.github.io/
      - https://github.com/bkryza/clang-include-graph#readme
  - id: brew:plantuml
    reason: >
      The clang-uml quick start documents PlantUML as a renderer for its generated
      `.puml` diagrams, including an integrated rendering command.
    rel: adjacent_workflow
    sources:
      - https://clang-uml.github.io/md_docs_2quick__start.html
      - https://plantuml.com/starting
  - id: brew:mermaid-cli
    reason: >
      clang-uml can generate Mermaid files, and its quick start documents using `mmdc`
      from mermaid-cli to render them as SVG.
    rel: adjacent_workflow
    sources:
      - https://clang-uml.github.io/md_docs_2quick__start.html
      - https://github.com/mermaid-js/mermaid-cli#readme
  - id: brew:cmake
    reason: >
      CMake can export the `compile_commands.json` database referenced by clang-uml's
      configuration and quick-start documentation.
    rel: adjacent_workflow
    sources:
      - https://clang-uml.github.io/md_docs_2configuration__file.html
      - https://cmake.org/cmake/help/latest/variable/CMAKE_EXPORT_COMPILE_COMMANDS.html
  - id: brew:bear
    reason: >
      Bear can produce `compile_commands.json` for build systems that cannot export one,
      supplying the compilation database clang-uml needs to parse a project accurately.
    rel: adjacent_workflow
    sources:
      - https://clang-uml.github.io/md_docs_2configuration__file.html
      - https://github.com/rizsotto/Bear#readme
