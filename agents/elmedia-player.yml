history:
  adoption-history:
    - >
      Elmedia has been distributed both directly by Electronic Team and through the Mac
      App Store, with feature differences between editions. Its long version history
      shows continuing adaptation to macOS releases, media codecs, subtitles, AirPlay,
      Chromecast, Roku, and other playback or streaming targets.
  package-nerd-significance:
    - >
      Elmedia occupies the polished macOS media-player niche: broad local playback plus
      network streaming in a native commercial/freeware application. Package-manager
      users care about the distinction between direct and App Store editions and between
      free and PRO features.
  project-history:
    - >
      Electronic Team developed Elmedia as a macOS video and audio player with playlist,
      subtitle, screenshot, online-video, and streaming features.
    - >
      The official changelog records the 6.x line by at least 2016, the 7.x line through
      2020, and the 8.x line through 2025. Development progressively added or improved
      AirPlay, modern codecs such as AV1 and HEVC, OpenSubtitles integration, Chromecast
      and Roku behavior, and compatibility with new macOS releases.
  related-projects:
    - AirPlay
    - Chromecast
    - DLNA
    - OpenSubtitles
    - Roku
    - Apple TV
  sources:
