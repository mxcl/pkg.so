history:
  adoption-history:
    - >
      Epic has been positioned for users seeking privacy defaults without assembling a
      collection of browser extensions. Its official materials emphasize Chromium
      compatibility combined with built-in tracking defenses and encrypted proxy
      functionality.
  package-nerd-significance:
    - >
      For package users, Epic represents a privacy-oriented Chromium derivative
      distributed as a standalone proprietary desktop cask. It is chiefly interesting as
      an opinionated browser build rather than a reusable browser engine or command-line
      package.
  project-history:
    - >
      Hidden Reflex introduced the Chromium-based Epic Privacy Browser in 2013 as a
      browser engineered around privacy protections. The vendor describes it as the
      first Chromium-based browser specifically engineered to protect user privacy.
  related-projects:
    - >
      Epic is built on Chromium but is distributed and maintained as a distinct
      privacy-focused browser by Hidden Reflex.
  sources:
    - >
      https://blog.epicbrowser.com/2013/08/the-epic-privacy-browser-from-hidden-reflex-is-born/
    - https://epicbrowser.com/about-us
    - https://epicbrowser.com/faq
    - https://epicbrowser.com/privacy/
  summary:
    - >
      Epic Privacy Browser is a Chromium-based web browser from Hidden Reflex with
      privacy protections enabled as product defaults.
  timeline:
    - '2013: Hidden Reflex announced the Epic Privacy Browser.'
    - '2010s–2020s: Epic continued as a desktop privacy-browser distribution based on Chromium.'
  usage:
    - >
      Users install Epic as an alternative web browser when they want tracker blocking,
      reduced data retention, and other privacy-oriented defaults without configuring a
      conventional Chromium installation.
