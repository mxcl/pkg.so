history:
  adoption-history:
    - >
      The official site describes Pomello as available on macOS, Windows, and Linux and
      reports that users have completed more than one million Pomodoro sessions. A free
      basic tier and paid premium tier support individual adoption.
  package-nerd-significance:
    - >
      Pomello is notable as a focused cross-platform desktop utility that joins two
      established productivity conventions: Trello's card-based task model and timed
      Pomodoro work sessions. The Homebrew cask provides a convenient installation route
      for macOS users even though the application itself is proprietary.
  project-history:
    - >
      Pomello was developed by Tiny Nudge LLC as a Trello-oriented Pomodoro application.
      The official sources document the product and its workflow but do not provide a
      dependable launch chronology.
  related-projects:
    - >
      Trello supplies the boards, lists, cards, and checklists used as Pomello tasks.
      Pomello states that it is not affiliated with Trello or with Francesco Cirillo's
      Pomodoro Technique organization.
  sources:
    - https://pomelloapp.com/ — official product overview and platform availability
    - https://pomelloapp.com/help — official setup and usage guide
    - https://pomelloapp.com/pricing — official plan and feature overview
    - https://pomelloapp.com/privacy — official operator and affiliation statements
    - source_facts.package-manager — identifies the Homebrew cask
  summary:
    - >
      Pomello is a cross-platform productivity timer that turns Trello cards into
      Pomodoro tasks. It combines timed work and break intervals with task selection,
      activity logging, notes, and productivity statistics.
  timeline:
    - 'By 2026: Official site reports more than one million completed Pomodoro sessions'
  usage:
    - >
      Users connect a Trello account, select a board and list, and start timed work on a
      card. Pomello can append Pomodoro counts to card titles, record events and notes
      in comments, create cards, and track internal or external distractions.
    - >
      An optional separate Pomello account enables aggregate productivity statistics.
      Board- and list-level settings control logging, tracking, card archiving, timers,
      sounds, and keyboard shortcuts.
