credentials-file-location: null
history:
  adoption-history:
    - >
      FontBase broadened its role from local font organization by adding Google Fonts
      support in 2017. Later releases added watched folders, cross-platform workflows,
      team synchronization, and license-compliance features.
  package-nerd-significance:
    - >
      FontBase is notable to package users as a cross-platform desktop font manager with
      a free core, direct Google Fonts access, watched-folder workflows, and an
      unusually detailed public release history.
  project-history:
    - >
      The official update archive records active development by 2017, including Google
      Fonts integration, font-family grouping, and specimen views. FontBase subsequently
      evolved into a font-management platform for individual designers and teams.
  related-projects:
    - >
      Google Fonts is integrated as a font provider. FontBase’s official comparison
      places it alongside products such as RightFont, Typeface, MainType, Suitcase,
      NexusFont, FontExplorer, and FontAgent.
  sources:
    - 'Official licensing feature page: https://fontba.se/features/licensing'
    - 'Official tutorials: https://fontba.se/learn/adding-fonts'
    - 'Official update history: https://fontba.se/updates'
  summary:
    - >
      FontBase is a cross-platform font manager built for designers. It organizes local
      and watched font folders, activates fonts, provides previews and search, and
      integrates online font providers.
  timeline:
    - '2017: Google Fonts support, family grouping, and specimen pages were added.'
    - '2021: Watched folders and modern light and dark themes were documented.'
    - >
      2025: FontBase expanded its platform and licensing terms for font distribution and
      services.
    - >
      2026: The official update history continued to document provider synchronization
      and web-font import improvements.
  usage:
    - >
      Users add fonts or folders by drag-and-drop or with the Add menu. Ordinary imports
      are copied into the configurable Root folder; watched folders remain in place and
      are linked so filesystem changes appear in FontBase. Google Fonts are available
      inside the application.
