  - https://www.nikhef.nl/~form
config-file-location:
  unix:
    - ./form.set
    - $FORMSETUP
credentials-file-location: null
history:
  adoption-history:
    - >
      FORM's adoption is concentrated in research computing and high-energy physics
      rather than general-purpose scripting. The README states that it has been
      essential for state-of-the-art high-energy-physics computations, and the NIKHEF
      pages describe an ecosystem of manuals, courses, tutorials, a reference manual,
      and workshops around the tool.
  package-nerd-significance:
    - >
      FORM is package-nerd significant because it is an old, performance-oriented domain
      tool that still ships as a Unix-style command-line program. It bridges scientific
      computing, symbolic algebra, disk-backed data structures, and long-running source
      distribution history, making it a classic example of research software that
      package managers keep usable outside its original lab environment.
  project-history:
    - >
      FORM was started in 1984 by Jos Vermaseren at NIKHEF. The official NIKHEF history
      describes its evolution across Apollo workstations, Atari ST, NeXT systems, PCs,
      Linux systems, and multicore machines, while the current GitHub README names Jos
      Vermaseren as the original author and lists later contributors in the AUTHORS
      file.
    - >
      Parallel variants became part of the FORM story: ParFORM was developed for
      multiprocessor and cluster systems, while TFORM became the multithreaded version
      for shared-memory machines. The GitHub project was established in 2013 and
      continues to publish tagged releases, including the 5.0 series in 2026.
  related-projects:
    - >
      Related FORM variants include ParFORM for distributed-memory multiprocessor
      systems and TFORM for shared-memory multithreading. FORM also occupies the
      efficient, large-expression side of the computer-algebra landscape, often used
      alongside more general CAS tools in hybrid workflows.
  sources:
    - https://api.github.com/repos/form-dev/form/releases?per_page=10
    - https://github.com/form-dev/form
    - https://raw.githubusercontent.com/form-dev/form/master/AUTHORS
    - https://raw.githubusercontent.com/form-dev/form/master/README.md
    - https://www.nikhef.nl/~form/aboutform/aboutform.html
    - https://www.nikhef.nl/~form/maindir/documentation/documentation.html
  summary:
    - >
      FORM is a symbolic manipulation system designed for very large algebraic
      expressions, especially in high-energy physics. Its official materials emphasize
      that expression size is limited mainly by disk space rather than RAM, making it a
      specialist tool for computations that strain conventional computer algebra
      systems.
  timeline:
    - '1984: FORM development started.'
    - '1999: ParFORM development era began on multiprocessor systems.'
    - '2013: Public GitHub repository created and 4.x releases published there.'
    - '2026: FORM 5.0-series releases published.'
  usage:
    - >
      FORM programs read symbolic expressions from files, apply symbolic or algebraic
      transformations, and print textual mathematical results. The distributed command
      set includes form for sequential use and tform for multithreaded use, with
      optional dependencies such as GMP, MPFR, zstd, zlib, and FLINT improving
      capabilities or performance.
related-packages:
  - id: brew:singular
    reason: >
      Choose Singular for specialized polynomial, Gröbner-basis, commutative-algebra, or
      algebraic-geometry work rather than FORM's emphasis on extremely large symbolic
      expressions in physics calculations.
    rel: alternative
    sources:
      - https://www.singular.uni-kl.de/
      - https://www.nikhef.nl/~form/aboutform/aboutform.html
  - id: brew:maxima
    reason: >
      Choose Maxima when you need a general-purpose interactive computer algebra system;
      FORM is more specialized toward high-throughput manipulation of very large
      expressions.
    rel: alternative
    sources:
      - https://maxima.sourceforge.io/
      - https://www.nikhef.nl/~form/aboutform/aboutform.html
