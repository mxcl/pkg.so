history:
  adoption-history:
    - >
      ArgyllCMS became important in open-source color workflows because it made serious
      profiling and calibration scriptable on ordinary Unix-like and desktop systems.
      The official home page explicitly asks users and distributors to support the work,
      including those who benefit from having serious color management on platforms
      beyond commercial Windows and macOS tooling.
    - >
      Its ecosystem role is reinforced by the International Color Consortium's
      open-source tools page, which lists Argyll as an open-source ICC v2-compatible
      color-management system and describes it as command-line tools plus icclib and a
      CGATS file-format library. That is strong secondary confirmation from the
      standards community around the file format Argyll manipulates.
  package-nerd-significance:
    - >
      ArgyllCMS is a classic package-manager stress test: one source distribution
      produces dozens of small, domain-specific executables, several libraries,
      instrument access code, profile and measurement file formats, and
      platform-specific display behavior. It is valuable precisely because packaging
      preserves a specialist toolchain that would otherwise be trapped in proprietary
      desktop applications.
    - >
      It also matters as a preservation bridge between color science and everyday Unix
      tooling. Package users can keep old instruments, ICC profiles, spectral
      measurements, printer targets, and calibration routines usable through plain
      commands, even when vendor software stops supporting a device or platform.
  project-history:
    - >
      The ArgyllCMS documentation records a long pre-release gestation: code development
      began in 1995, icclib first appeared publicly in November 1998, and ArgyllCMS
      itself was first released publicly in October 2000. The project remained centered
      on Gill's own site rather than a public forge-style source-control home, with the
      official documentation and downloadable source archives serving as the primary
      upstream surfaces.
    - >
      The official overview explains the motivation as both practical and
      research-oriented. Gill wrote Argyll to deepen his own color expertise, to
      experiment with alternate approaches to electronic color correction, and to make
      advanced color-management work available outside proprietary systems. That origin
      shows in the package's shape: it is not a single polished GUI, but a dense toolbox
      of interoperating utilities and libraries.
    - >
      By version 3.5.0, dated 4 February 2026, the documentation described support for
      ICC profile creation, calibration and profiling, device links, specialized video
      calibration standards, 3D LUTs, spectral sample data, illuminant and observer
      choices, fluorescent-whitener compensation, CIECAM02-based gamut mapping, and
      browser-based gamut viewing through X3DOM. Its changelog-style release history is
      continuous enough that ArgyllCMS reads as mature specialist infrastructure rather
      than a one-off utility.
  related-projects:
    - icclib and cgatslib are included ArgyllCMS libraries.
    - >
      ICC profiles, CGATS data, CIECAM02, X3DOM gamut viewing, and color-measurement
      instrument drivers are central to the ArgyllCMS workflow.
    - >
      The International Color Consortium lists Argyll alongside other open-source ICC
      tools such as iccDEV, IccXml, LittleCMS, and LPROF.
  sources:
    - https://www.argyllcms.com/
    - https://www.argyllcms.com/doc/ArgyllDoc.html
    - https://www.argyllcms.com/doc/Overview.html
    - https://www.argyllcms.com/doc/Scenarios.html
    - https://www.color.org/opensource.xalter
  summary:
    - >
      ArgyllCMS is Graeme Gill's open-source ICC-compatible color-management system. It
      is distributed as a collection of command-line tools, plus icclib and cgatslib,
      for creating, inspecting, linking, applying, and validating color profiles across
      displays, scanners, cameras, film recorders, RGB printers, CMY/CMYK printers, and
      video calibration workflows.
  timeline:
    - '1995: Code development began.'
    - '1998-11: icclib first appeared publicly.'
    - '2000-10: ArgyllCMS first appeared publicly.'
    - '2026-02-04: ArgyllCMS 3.5.0 documentation and home page were dated 4 February 2026.'
  usage:
    - >
      Typical use is a workflow rather than a single command. Users generate or print
      targets, measure devices with supported instruments, build ICC profiles, verify or
      inspect those profiles, load display calibration, convert raster files, create
      device links, and inspect gamut data. The official scenarios page is organized
      around tasks such as display profiling, scanner and camera profiling, printer
      profiling and calibration, profile linking, raster transforms, observer
      color-matching functions, and video calibration 3D LUTs.
    - >
      The package is command-line-first by design. The documentation calls it a
      command-line terminal environment and provides separate pages for the major tools,
      which makes it useful in repeatable lab, prepress, photography, and
      package-manager workflows where a GUI-only calibrator would be awkward or
      impossible to automate.
related-packages:
  - id: brew:little-cms2
    reason: >
      Choose Little CMS 2 when an application needs an embeddable ICC color-transform
      engine and small conversion utilities rather than ArgyllCMS's instrument-driven
      calibration and profiling suite.
    rel: alternative
    sources:
      - https://www.argyllcms.com/doc/ArgyllDoc.html
      - https://www.littlecms.com/
      - https://github.com/mm2/Little-CMS
  - id: brew:iccdev
    reason: >
      Use iccDEV alongside ArgyllCMS to inspect, convert, test, or develop ICC and
      iccMAX profiles with tools maintained by the International Color Consortium.
    rel: adjacent_workflow
    sources:
      - https://www.argyllcms.com/doc/ArgyllDoc.html
      - https://github.com/InternationalColorConsortium/iccDEV
      - https://www.color.org/opensource.xalter
