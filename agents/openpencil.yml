history:
  adoption-history:
    - >
      OpenPencil is distributed as a browser application, installable PWA, and native
      Tauri desktop application for macOS, Windows, and Linux. The official Homebrew
      cask provides the packaged macOS desktop build.
    - >
      The project also publishes its engine, scene graph, file codecs, CLI, MCP server,
      and Vue SDK as reusable packages, allowing adoption independently of the default
      editor interface.
  package-nerd-significance:
    - >
      OpenPencil treats a graphical editor as a programmable software stack rather than
      a sealed application. The desktop app, browser editor, CLI, SDK, built-in AI, and
      MCP server operate on the same document model and tool definitions.
    - >
      Package enthusiasts get several distinct surfaces: a Homebrew cask for the GUI,
      npm packages for headless and embedding workflows, and an MCP package that exposes
      design operations to coding agents. Its native .fig handling also makes it
      relevant to open document-tooling and interoperability work.
  project-history:
    - >
      OpenPencil launched its first public alpha on March 1, 2026 as an open-source
      editor able to read and write Figma .fig files. The initial release already
      combined CanvasKit rendering, Yoga layout, design components, variables, a CLI,
      and built-in AI tooling.
    - >
      Development quickly added peer-to-peer collaboration, a headless MCP server,
      expanded CLI automation, Tailwind and JSX export, multi-provider AI, ACP
      coding-agent support, SDK packages, PDF export, and support for the Pencil .pen
      format.
  related-projects:
    - >
      Figma is the proprietary design platform whose .fig files and clipboard format
      OpenPencil interoperates with.
    - Pencil documents are supported through the @open-pencil/pen package.
    - CanvasKit and Yoga provide rendering and layout foundations.
    - >
      Claude Code, Codex, Gemini CLI, Cursor, and other MCP or ACP clients can automate
      the editor.
  sources:
    - https://github.com/open-pencil/open-pencil
    - https://github.com/open-pencil/open-pencil/blob/master/CHANGELOG.md
    - https://openpencil.dev/getting-started
    - https://openpencil.dev/overview/features
    - https://openpencil.dev/programmable/mcp-server
  summary:
    - >
      OpenPencil is an open-source, AI-enabled design editor and programmable toolkit
      that runs on the desktop and web, reads and writes .fig and .pen documents, and
      exposes its editing engine through a CLI, SDK, and MCP server.
  timeline:
    - 'March 1, 2026: First public alpha released.'
    - 'March 2, 2026: MCP server introduced.'
    - 'March 7, 2026: PWA support, Tailwind JSX export, and the original Homebrew tap arrived.'
    - 'March 15, 2026: ACP coding-agent support was added.'
    - >
      May 2026: The project expanded document interoperability, export formats, and
      official package distribution.
  usage:
    - >
      Designers can use the browser application or desktop editor for drawing, layout,
      components, variables, Figma-file exchange, asset export, and peer-to-peer
      collaboration.
    - >
      Developers and agents can inspect, lint, query, transform, render, and export
      documents through the openpencil CLI, the published JavaScript packages, or the
      MCP server. Built-in AI supports user-supplied model-provider credentials through
      the application's configured credential backend.
