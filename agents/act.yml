id: brew:act
display-name: act
repo: null
docs:
  - https://nektosact.com/
  - https://nektosact.com/usage/index.html
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/act/actrc
    - ~/.actrc
    - ./.actrc
credentials-file-location:
  unix:
    - ./.secrets
history:
  adoption-history:
    - >
      act spread through CLI package ecosystems because it solved a common GitHub
      Actions pain point: testing workflow changes without committing and waiting for
      hosted CI. The supplied package-manager facts list packages in Homebrew, apk, dnf,
      MacPorts, Nix, pacman, Scoop, winget, and zypper.
    - >
      GitHub repository metadata showed more than 70,000 stars by June 2026, making act
      one of the highest-visibility local GitHub Actions tools in package-manager
      catalogs.
  package-nerd-significance:
    - >
      Package maintainers care about act because it is a small CLI with a large CI
      surface area: it depends on Docker behavior, tracks GitHub Actions semantics, and
      is often used in pre-push or local validation loops. Its many package-manager
      entries make version freshness and reproducible installation especially visible.
  project-history:
    - >
      The nektos/act repository was created in January 2019, shortly after GitHub
      Actions entered the broader developer-tooling conversation. Its README describes
      the core idea as reading workflows from .github/workflows, preparing Docker
      images, and running the jobs locally with filesystem and environment behavior
      modeled on GitHub-hosted runners.
    - >
      The first GitHub release, v0.0.1, was published on 2019-01-15. Later releases
      continued the same basic CLI shape while expanding compatibility with GitHub
      Actions features, runner images, secrets, variables, and workflow execution
      options.
  related-projects:
    - >
      act is closely tied to GitHub Actions, Docker, GitHub-hosted runner images, and
      editor integrations such as GitHub Local Actions for VS Code.
  sources:
    - https://api.github.com/repos/nektos/act
    - https://api.github.com/repos/nektos/act/releases
    - https://github.com/nektos/act#readme
    - https://github.com/nektos/act/blob/master/cmd/root.go
    - source_facts.package-manager
  summary:
    - >
      act is a command-line runner for executing GitHub Actions workflows locally. It
      became a standard package-manager-friendly developer tool because it turns
      repository workflow files into a local Docker-backed feedback loop.
  timeline:
    - '2019-01-02: nektos/act repository created on GitHub.'
    - '2019-01-15: v0.0.1 published as the first GitHub release.'
    - '2026-06: GitHub API metadata showed active maintenance and broad star/fork adoption.'
  usage:
    - >
      Users typically run act from a repository to execute jobs defined under
      .github/workflows. The tool can read command-line options from actrc files, load
      secrets from a .secrets file, and use Docker to run workflow steps in local
      containers.
related-packages:
  - id: brew:docker
    reason: >
      Docker supplies the Engine API and containers that act normally uses to pull or
      build runner images and execute workflow jobs locally.
    rel: adjacent_workflow
    sources:
      - https://nektosact.com/
      - https://nektosact.com/installation/
      - https://docs.docker.com/reference/cli/docker/
  - id: brew:gh
    reason: >
      GitHub CLI can install act as an extension and can pass the authenticated token
      from gh auth token into local workflow runs.
    rel: adjacent_workflow
    sources:
      - https://nektosact.com/installation/gh.html
      - https://nektosact.com/usage/index.html
      - https://cli.github.com/manual/gh_auth_token
  - id: brew:actionlint
    reason: >
      Use actionlint to statically check the same GitHub Actions workflow files for
      syntax, expression, action-input, shell, and Python issues before executing them
      locally with act.
    rel: adjacent_workflow
    sources:
      - https://rhysd.github.io/actionlint/
      - https://nektosact.com/usage/index.html
tags:
