id: brew:harsh
display-name: Harsh Taskmaster
repo: null
docs:
  - https://github.com/wakatara/harsh#readme
config-file-location:
  unix:
    - ~/.config/harsh/habits
    - ~/.config/harsh/log
  windows:
    - '%APPDATA%\harsh\habits'
    - '%APPDATA%\harsh\log'
credentials-file-location: null
history:
  adoption-history:
    - >
      The launch shipped Homebrew and Snap installation plus cross-platform binaries.
      The current README adds Arch AUR, DEB, RPM, APK, Go installation, and a one-line
      installer; supplied metadata also records Homebrew, Alpine, and Nix packaging.
  package-nerd-significance:
    - >
      Harsh is a durable example of Unix-style personal software: a single Go binary,
      plain-text state, scriptable JSON, shell completions, and broad
      binary/package-manager distribution. It is both interactive enough for daily use
      and transparent enough for backups, Git, editors, and data analysis.
  project-history:
    - >
      Manning publicly released Harsh on May 26, 2020 after using the Rust program
      habitctl and finding that project no longer active. He kept its simple text-file
      and Seinfeld-chart ideas, rewrote the concept in Go to reduce build and
      installation friction, and added skips, warnings, score fixes, and corrected
      sparklines.
    - >
      The project continued beyond its initial release series. By 2026 it supported
      habit end dates for long-range records, structured JSON output for agents and
      scripts, filtering, statistics, notes and amounts, and shell completions while
      retaining human-editable storage.
  related-projects:
    - habitctl supplied the core text-file and consistency-graph inspiration for Harsh.
    - >
      Emacs org-habits was evaluated by the author but rejected as too complex for his
      intended workflow.
  sources:
    - https://daryl.wakatara.com/better-habit-tracking-in-harsh/
    - https://daryl.wakatara.com/harsh-a-minimalist-cli-habit-tracker/
    - https://github.com/wakatara/harsh#readme
    - https://github.com/wakatara/harsh/releases
    - source_facts.package-manager
  summary:
    - >
      Harsh Taskmaster is Daryl Manning's minimalist Go command-line habit tracker,
      built around editable text files, daily prompts, todo urgency, statistics, and
      long-range consistency graphs.
  timeline:
    - >
      2020: Harsh is released as open source on May 26 with Homebrew, Snap, and binary
      installation.
    - '2020: v0.8.1 begins the recorded GitHub release series.'
    - '2026: End dates and longer-range habit tracking are documented by the maintainer.'
    - '2026: v0.14.5 is released in June.'
  usage:
    - >
      `harsh ask` records today's habits, `harsh log` renders the last 100 days, and
      `harsh todo` shows pending habits with urgency. Users own and can directly edit
      the `habits` and append-only `log` text files, relocate them with `HARSHPATH`, and
      request structured output with `harsh log --json`.
related-packages: []
tags:
  - cli
  - go
  - habit-tracking
  - plain-text
  - productivity
  - terminal
  - tracking
