history:
  adoption-history:
    - >
      RepoBar is distributed as a signed macOS application, through Homebrew Cask, and
      through GitHub releases. Its command-line companion extends the same repository,
      cache, authentication, and diagnostic surfaces into shell workflows.
    - >
      Early releases rapidly expanded the original menu dashboard with GitHub Enterprise
      and personal-access-token authentication, local Git actions, persistent caching,
      repository archives, rate-limit diagnostics, issue and pull-request navigation,
      and an iOS companion.
  package-nerd-significance:
    - >
      RepoBar packages a GitHub maintainer cockpit into both a native menu-bar
      application and a scriptable CLI. It is especially useful to developers
      responsible for many repositories who want operational signals without maintaining
      a browser tab set.
    - >
      Its cache-first design, explicit rate-limit visibility, GitHub App authentication,
      and optional archive sources make GitHub API behavior visible rather than hiding
      it behind a simple status menu.
  project-history:
    - >
      RepoBar was released publicly at the end of 2025 as a native macOS menu-bar
      dashboard for repository health, activity, and local project state. It began with
      repository cards and rich submenus, then developed into a broader maintainer tool
      spanning hosted GitHub data, local checkouts, diagnostics, and automation.
  related-projects:
    - GitHub and GitHub Enterprise provide repository and account data.
    - The GitHub CLI can supply an imported token when appropriate.
    - >
      Discrawl-style snapshot archives can provide cached repository data when GitHub is
      unavailable or rate-limited.
  sources:
    - https://github.com/steipete/RepoBar#readme
    - https://github.com/steipete/RepoBar/blob/main/CHANGELOG.md
    - https://github.com/steipete/RepoBar/blob/main/docs/cli.md
    - https://repobar.app/
  summary:
    - >
      RepoBar is a free, open-source macOS menu-bar dashboard and CLI for monitoring
      GitHub repositories, including issues, pull requests, CI, releases, activity,
      local checkout state, and API rate limits.
  timeline:
    - '2025-12-31: First public release.'
    - >
      January 2026: Added broader authentication choices, CLI operations, and token
      sharing between the app and CLI.
    - >
      May 2026: Added persistent API caching, archive sources, richer rate-limit
      diagnostics, and issue and pull-request navigation.
  usage:
    - >
      Users sign in through the RepoBar GitHub App or provide an appropriate token,
      select visible or pinned repositories, and inspect activity and health from the
      menu bar. Local repository roots can be scanned to show branch, dirty-file,
      worktree, and ahead/behind state.
    - >
      The repobar CLI supports repository queries, issue and pull-request inspection,
      authentication, settings, cache diagnostics, archive management, and
      machine-readable JSON output.
