history:
  adoption-history:
    - >
      The supplied package metadata records a Homebrew formula. LIVE555's official page
      says its libraries are used for open multimedia streaming protocols and can be
      used to build RTSP clients and servers.
  package-nerd-significance:
    - >
      openRTSP is small but revealing package material because installing it exposes the
      LIVE555 utility suite and the practical RTSP/RTP surface area used for cameras,
      test servers, and stream debugging.
  project-history:
    - >
      The official openRTSP page describes it as a command-line program for opening,
      streaming, receiving, and optionally recording media streams specified by RTSP
      URLs.
    - >
      The official source-code section says openRTSP uses LIVE555 library modules and
      that its own source files, openRTSP.cpp and playCommon.cpp, are bundled in the
      LIVE555 Streaming Media source package under testProgs.
  related-projects:
    - >
      Related LIVE555 programs include playSIP, LIVE555 Media Server, LIVE555 Proxy
      Server, LIVE555 HLS Proxy, vobStreamer, and testRTSPClient.
  sources:
    - http://www.live555.com/liveMedia/
    - http://www.live555.com/openRTSP/
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - openRTSP is the command-line RTSP client distributed with LIVE555 Streaming Media.
  timeline:
    - '1998: RTSP 1.0 was published as protocol context for tools such as openRTSP.'
    - >
      LIVE555 Streaming Media era: openRTSP is bundled as source in the LIVE555
      testProgs directory.
    - '2026: the supplied metadata records openrtsp as a Homebrew package.'
  usage:
    - >
      The basic documented workflow is openRTSP followed by an rtsp:// URL. The program
      sends RTSP DESCRIBE, retrieves SDP, sets up understood audio or video subsessions,
      plays them, and writes received data to output files.
    - >
      Documented options cover authentication, transport choices, recording containers,
      periodic file output, trick-play options, and diagnostic behavior.
