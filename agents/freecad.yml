history:
  adoption-history:
    - >
      FreeCAD grew into a cross-platform community CAD environment with workbenches
      covering mechanical design, drafting, architecture and BIM, CAM/CNC, 3D printing,
      robotics, and finite-element analysis. An Addon Manager supports
      community-maintained workbenches and macros.
    - >
      The project reached its 1.0 milestone in November 2024, bringing a built-in
      assembly workbench and merging the earlier Arch and external BIM workflows into a
      built-in BIM workbench. This milestone marked the transition from the long-running
      0.x release series without abandoning FreeCAD's extensible workbench model.
  package-nerd-significance:
    - >
      FreeCAD is a substantial desktop engineering stack built from C++, Python, Qt, and
      Open CASCADE Technology. Packagers must reconcile a large dependency graph,
      plugins, Python modules, geometry libraries, platform-specific graphics behavior,
      and many import/export formats.
    - >
      Its long 0.x era and eventual 1.0 release make it a recognizable example of mature
      open-source software whose practical adoption and capabilities preceded
      semantic-versioning maturity.
  project-history:
    - >
      FreeCAD is a community-developed, open-source parametric 3D modeler. Its modeling
      kernel is based on Open CASCADE Technology, while Python is used extensively for
      scripting, automation, macros, and custom workbenches.
    - >
      The project developed through a long series of 0.x releases, steadily adding
      specialized workbenches and a broad file-format ecosystem. The official release
      record lists releases from at least 0.11 in 2011 through the 1.0 milestone in
      2024.
  related-projects:
    - Open CASCADE Technology supplies FreeCAD's solid-modeling geometry kernel.
    - Python and Qt underpin much of its scripting, workbench, and user-interface ecosystem.
    - >
      OpenSCAD interoperability and community workbenches connect FreeCAD with broader
      CAD, fabrication, BIM, and 3D-printing toolchains.
  sources:
    - https://www.freecad.org/
    - https://www.freecad.org/api/
    - https://www.freecad.org/downloads
    - https://www.freecad.org/features.php
  summary:
    - >
      FreeCAD is a community-developed, open-source parametric CAD system used for
      real-world 3D design, technical drawings, fabrication, analysis, architecture, and
      automation.
  timeline:
    - '2011: FreeCAD 0.11 was released.'
    - '2016: FreeCAD 0.16 was released.'
    - '2021: FreeCAD 0.19 was released.'
    - '2022: FreeCAD 0.20 was released.'
    - '2023: FreeCAD 0.21 was released.'
    - '2024: FreeCAD 1.0 was released with built-in assembly and BIM workbenches.'
  usage:
    - >
      Users create constraint-based sketches and parametric solids whose dimensions and
      dependencies can be revised later in the model history. Workbenches adapt the
      interface to mechanical CAD, BIM, CAM, FEM, drafting, and other disciplines.
    - >
      FreeCAD imports and exports many engineering and graphics formats, including STEP,
      IGES, STL, OBJ, DXF, IFC, and its native FCStd format. Python consoles, macros,
      and add-on workbenches support automation and domain-specific extensions.
