history:
  adoption-history:
    - >
      Roam's official help material presents the product as a flexible environment for
      writing, research, studying, task and project management, and personal knowledge
      workflows. Hosted graphs support cross-device access and collaboration, while
      local graphs support local-only use.
  package-nerd-significance:
    - >
      Roam helped popularize graph-oriented personal knowledge management centered on
      blocks, backlinks, and bidirectional links. The desktop cask provides a standalone
      application for a product also available on the web, and the desktop application
      now exposes a local API used by Roam's official CLI and MCP tooling.
  project-history:
    - >
      Roam Research developed as a note-taking system for networked thought, organizing
      information as linked pages and addressable blocks rather than only as
      hierarchical documents. Its documentation is itself published as a public Roam
      graph, reflecting the product's graph-native model.
  related-projects:
    - >
      Roam Research publishes an official open-source MCP server and CLI in the
      Roam-Research/roam-tools repository. Those companion tools connect to the desktop
      application's local HTTP API but are not the source repository for the proprietary
      desktop application.
  sources:
    - https://github.com/Roam-Research/roam-tools
    - https://roamresearch.com/
    - https://roamresearch.com/#/app/help
  summary:
    - >
      Roam Research is a graph-oriented note-taking and knowledge-management application
      built around linked pages, blocks, backlinks, and daily notes.
  timeline:
    - >
      Desktop expansion: Roam added a standalone desktop application alongside its
      browser experience.
    - >
      Local API expansion: Roam published official CLI and MCP tooling that communicates
      with the desktop application's local HTTP API.
  usage:
    - >
      Users capture notes as nested blocks, connect concepts with page links and block
      references, navigate backlinks, and maintain hosted or local knowledge graphs.
      Common workflows include research, writing, studying, journaling, task tracking,
      and collaborative knowledge bases.
