  summary:
    - >
      Notion Mail was Notion's customizable, AI-assisted Gmail client. It launched
      publicly in April 2025 and the standalone web, desktop, and iOS inbox was
      discontinued on September 22, 2026.
  timeline:
    - '2024-10-24: Notion announced a preview and opened the waitlist.'
    - '2025-04-15: Notion Mail launched on the web and macOS.'
    - '2026-06-25: Export of Notion Mail-only data began.'
    - '2026-09-22: The Notion Mail inbox shut down for all users.'
  usage:
    - >
      Before shutdown, users connected Gmail, arranged messages into filtered views,
      applied AI-generated labels, composed mail, reused snippets, and inserted Notion
      Calendar scheduling links. The application is no longer available for ongoing
      inbox use.
