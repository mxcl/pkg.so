history:
  adoption-history:
    - >
      Notion introduced a preview of its planned mail client in October 2024 and
      launched Notion Mail publicly on April 15, 2025. The free client initially worked
      with Gmail and was offered on the web and macOS, later adding iOS.
    - >
      Notion discontinued the inbox application for all plans on September 22, 2026.
      Messages remained in Gmail because the client used two-way synchronization, but
      users had to export app-specific drafts, scheduled messages, snippets, and
      auto-label instructions before shutdown.
  package-nerd-significance:
    - >
      Notion Mail is a short-lived proprietary desktop application whose cask documents
      Notion's expansion from workspaces and calendars into email. Because the inbox
      application shut down in September 2026, its package entry is now primarily of
      historical and maintenance interest.
  project-history:
    - >
      Notion Mail was conceived as a customizable, AI-assisted alternative to a
      conventional chronological inbox. Its principal features included custom views,
      AI-generated labels, snippets, scheduling through Notion Calendar, keyboard-driven
      navigation, and a block-style composer.
    - >
      The product's public lifetime was brief: it launched in April 2025 and was shut
      down in September 2026. Notion retained separate Gmail and Outlook integrations,
      mail blocks, and agent-based mail tools after retiring the standalone inbox.
  related-projects:
    - Notion
    - Notion Calendar
    - Gmail
    - Notion AI
  sources:
