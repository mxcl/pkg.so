history:
  adoption-history:
    - >
      Highball targets Apple-silicon Mac users who want to run Windows games without
      being tied to a single Wine build. It combines a native macOS interface and CLI
      with Steam support, Epic integration through Legendary, and an open compatibility
      database.
    - >
      Community game reports can be submitted with the CLI and incorporated into the
      separately maintained Highball database, where verified results, community
      reports, and predictions are distinguished.
  package-nerd-significance:
    - >
      Highball treats engines, renderer selection, recipes, and compatibility results as
      inspectable data. Engines are assembled from pinned upstream components, while
      game recipes and compatibility data are maintained separately under CC0.
    - >
      Its explicit response to the 2025 archival of Whisky makes Highball especially
      relevant to Mac compatibility-layer enthusiasts concerned with project longevity,
      reproducibility, and reusable compatibility knowledge.
  project-history:
    - >
      Highball was designed as an open-source macOS app and CLI around HighballKit, Wine
      prefixes, interchangeable renderers, declarative recipes, and a separate
      compatibility database. Its README presents engine independence and public,
      reusable data as safeguards against the fragility of earlier Mac gaming wrappers.
  related-projects:
    - Wine supplies the Windows compatibility layer.
    - DXMT, D3DMetal, DXVK, and WineD3D provide alternative rendering paths.
    - Legendary supplies Epic Games integration.
    - highball-db stores recipes and compatibility reports.
    - >
      Whisky is cited by Highball as a related project whose 2025 archival influenced
      its design.
  sources:
    - https://github.com/gauthierpiarrette/highball
    - https://github.com/gauthierpiarrette/highball/blob/main/CONTRIBUTING.md
    - https://github.com/gauthierpiarrette/highball/security
  summary:
    - >
      Highball is a free, open-source native macOS application and CLI for creating
      Wine-based environments and running Windows games on Apple silicon. It combines
      managed compatibility engines with renderer recommendations from an open game
      database.
  timeline:
    - >
      2025: Whisky was archived, an event Highball explicitly cites as a design caution
      for Mac gaming wrappers.
  usage:
    - >
      Users install an engine, create a Wine environment from a recipe, install or
      connect a game launcher, and launch games with a database-recommended renderer.
      Advanced users can perform the same operations through the `highball` CLI.
    - >
      The application stores its engines, environments, settings, and other runtime data
      under `~/Library/Application Support/Highball/`.
