credentials-file-location:
  unix:
    - ~/.config/ghorg/conf.yaml
    - $XDG_CONFIG_HOME/ghorg/conf.yaml
history:
  adoption-history:
    - >
      ghorg's adoption is concentrated among teams and operators that need local
      snapshots of many repositories at once rather than one-off clones. The README's
      installation section documents prebuilt binaries, Homebrew, Mise, Go installation,
      Docker, and Windows support, matching its role as a cross-platform CLI utility.
  package-nerd-significance:
    - >
      Package nerds care about ghorg because it automates the otherwise repetitive edge
      between package-manager install culture and source-control inventory work: install
      one small binary, point it at a namespace, and get a reproducible local checkout
      layout for analysis or backup.
  project-history:
    - >
      The GitHub repository for ghorg was created in 2018, and the project settled
      around a narrow developer-operations job: turn a hosted source-control namespace
      into a local tree of Git repositories. Its README describes default behavior that
      either clones missing repositories or updates existing local clones with pull and
      clean operations.
    - >
      The project evolved beyond GitHub-only organization cloning into a
      provider-oriented tool. Official documentation lists support for GitHub, GitLab,
      Bitbucket, Gitea, and SourceHut, with separate setup and example pages for
      provider-specific authentication, API limits, and self-hosted base URLs.
  related-projects:
    - >
      ghorg sits beside Git hosting APIs, GitHub Enterprise and GitLab self-managed
      deployments, XDG-style CLI configuration, and command-line search tools such as
      grep, ack, and The Silver Searcher.
  sources:
    - https://api.github.com/repos/gabrie30/ghorg
    - https://github.com/gabrie30/ghorg
    - https://github.com/gabrie30/ghorg#readme
    - https://github.com/gabrie30/ghorg/releases/tag/v1.0.6
  summary:
    - >
      ghorg is a Go command-line tool for cloning all repositories from a source-control
      organization or user into one local directory.
  timeline:
    - '2018: GitHub repository created.'
    - '2018: v1.0.6 published on GitHub Releases.'
    - '2019: README screenshot and CLI examples document the bulk-clone workflow.'
    - '2020s: Documentation covers GitHub, GitLab, Bitbucket, Gitea, and SourceHut providers.'
  usage:
    - >
      Practitioners use ghorg to clone an organization's repositories for code search,
      onboarding, audits, backups, and scripted maintenance. Typical use starts with a
      provider token in the ghorg YAML configuration or a command-line flag, then runs a
      clone or reclone operation against an organization, user, or group.
related-packages:
  - id: brew:gitbackup
    reason: >
      Choose gitbackup when the primary requirement is a backup-focused workflow across
      GitHub, GitLab, Bitbucket, and Forgejo rather than ghorg's broader cloning,
      search, onboarding, and audit workflows.
    rel: alternative
    sources:
      - https://github.com/gabrie30/ghorg#readme
      - https://github.com/amitsaha/gitbackup#readme
  - id: brew:ghq
    reason: >
      Choose ghq when you want to fetch and organize individually selected remote
      repositories under a deterministic local root instead of cloning an entire
      provider namespace.
    rel: alternative
    sources:
      - https://github.com/gabrie30/ghorg#readme
      - https://github.com/x-motemen/ghq#readme
