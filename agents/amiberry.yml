config-file-location:
  linux:
    - ~/.config/amiberry/amiberry.conf
    - ~/Amiberry/conf/*.uae
  macos:
    - ~/Library/Application Support/Amiberry/amiberry.conf
    - ~/Documents/Amiberry/Configurations/*.uae
  windows:
    - '%LOCALAPPDATA%\Amiberry\amiberry.conf'
    - '%USERPROFILE%\Amiberry\Configurations\*.uae'
credentials-file-location: null
history:
  adoption-history:
    - >
      Amiberry initially emphasized ARM single-board computers, including Raspberry
      Pi-class systems, before expanding into a multi-platform emulator for Linux,
      macOS, Windows, Android, FreeBSD, and Haiku. Official distribution now includes
      native packages, Flatpak, AUR, Homebrew Cask, installers, portable archives, and
      direct release artifacts.
  package-nerd-significance:
    - >
      Amiberry connects several package-culture niches: retro-computing preservation,
      emulator packaging, low-power ARM systems, desktop application bundles, and
      ROM-dependent software that cannot bundle all required proprietary firmware. Its
      platform-specific directory model and portable mode are particularly relevant to
      packagers maintaining upgrades without losing configurations.
  project-history:
    - >
      Amiberry was forked from the UAE4ARM-RPi project and evolved into a separately
      named Amiga emulator. It incorporates the WinUAE emulation core while adding
      platform ports, performance work, JIT implementations, a modern GUI, controller
      integration, and automated WHDLoad workflows.
  related-projects:
    - >
      WinUAE supplies the upstream emulation core. UAE4ARM-RPi was the project from
      which Amiberry was forked. Amiberry Lite preserves a lighter WinUAE-based variant
      for slower hardware, while WHDLoad integration provides automated launching of
      installed Amiga software.
  sources:
    - 'Official README: https://github.com/BlitterStudio/amiberry#readme'
    - >
      Official directories reference:
      https://github.com/BlitterStudio/amiberry/wiki/Amiberry-directories
    - 'Official version history: https://github.com/BlitterStudio/amiberry/wiki/Version-history'
    - 'Official website: https://amiberry.com/'
  summary:
    - >
      Amiberry is a GPL-licensed, multi-platform Amiga emulator built on the WinUAE
      core. It targets systems ranging from low-power ARM boards to modern desktop
      workstations and supports floppy, hard-drive, CD, WHDLoad, save-state, and
      machine-configuration workflows.
  timeline:
    - >
      2017: The 2.8 beta line recorded the transition from UAE4ARM naming to Amiberry
      and the fork from UAE4ARM-RPi.
    - >
      2020: The 3.x and 4.0 era expanded WinUAE synchronization, WHDLoad automation,
      hardware targets, and desktop-oriented functionality.
    - >
      Current distribution: Amiberry supports Linux, macOS, Windows, Android, FreeBSD,
      and Haiku.
  usage:
    - >
      Users supply legally obtained Amiga Kickstart ROMs, select an emulated Amiga
      model, and load disk, CD, hard-drive, WHDLoad, or `.uae` configuration files.
      Quickstart presets cover common machines, while advanced users tune CPU, chipset,
      display, input, storage, shaders, and JIT settings or launch media from the
      command line.
