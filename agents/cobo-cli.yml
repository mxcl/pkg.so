    - source_facts.package-manager
  summary:
    - >
      Cobo CLI is Cobo's command-line developer tool for building, testing, and managing
      integrations with Cobo Wallet-as-a-Service 2.0.
  timeline:
    - 'GitHub repository: official project history shows 23 commits at the time of review.'
  usage:
    - >
      Users run cobo commands to manage environments, authentication, config, generated
      API and app key pairs, webhook testing, and WaaS API calls.
