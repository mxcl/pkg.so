history:
  adoption-history:
    - >
      Server Box is distributed across desktop and mobile platforms, including macOS
      through Homebrew Cask. Its cross-platform clients and optional Monitor agent
      support both interactive SSH administration and unattended monitoring features
      such as widgets, notifications, and historical charts.
  package-nerd-significance:
    - >
      Server Box combines tasks commonly split among SSH clients, SFTP tools, monitoring
      dashboards, and container front ends. Its open-source Flutter implementation and
      broad platform coverage make it especially visible to self-hosters and operators
      who want the same server toolbox on desktop and mobile devices.
  project-history:
    - >
      Server Box is an open-source Flutter application maintained by lollipopkit. It
      grew from a server-status viewer into a broader toolbox covering SSH terminals,
      SFTP, Docker and Podman, processes, services, hardware metrics, remote desktop
      connections, and platform-specific widgets.
    - >
      The project also incorporates Server Box Monitor, an optional server-side agent
      that records metrics and exposes an HTTP API and web panel. The main application
      can otherwise operate directly over SSH without requiring that agent.
  related-projects:
    - Server Box Monitor
    - dartssh2
    - xterm.dart
    - Docker
    - Podman
    - OpenSSH
  sources:
    - https://github.com/lollipopkit/flutter_server_box
    - https://github.com/lollipopkit/flutter_server_box/blob/main/monitor/README.md
    - https://serverbox.lolli.tech/docs/
  summary:
    - >
      Server Box is an open-source, cross-platform server-monitoring and administration
      application. It presents server metrics and provides SSH, SFTP, container,
      process, service, storage, and remote-management tools.
  timeline:
    - >
      2023: The official repository's Server Box Monitor license notice dates this part
      of the project to 2023.
    - >
      2025: The project consolidated user, architecture, and development material in a
      dedicated documentation site.
  usage:
    - >
      Operators add servers through SSH or through the optional Monitor agent, inspect
      live system metrics, open terminal sessions, transfer files, and manage containers
      and services. The macOS cask provides the desktop application, while compatible
      mobile clients add biometric authentication, widgets, notifications, and watch
      integration.
