history:
  adoption-history:
    - >
      Receipts Space is positioned for individuals and teams who want receipt and
      invoice management without a mandatory proprietary cloud. Folder-based libraries,
      synchronization options, portable exports, migration support, and integrations
      with other finance applications support adoption into existing macOS workflows.
  package-nerd-significance:
    - >
      The application is notable for keeping document libraries under user control while
      combining OCR, structured financial metadata, automation, AppleScript support, and
      import/export workflows. That makes it relevant to users who value local-first
      data ownership and scriptable desktop applications.
    - >
      The official changelog preserves downloadable earlier releases and documents
      migration from Receipts 1, which is useful when maintaining older libraries or
      macOS installations.
  project-history:
    - >
      Receipts is a macOS document-management application by Dirk Holtwick. The current
      Receipts Space line organizes receipts and other financial documents in local
      libraries and automatically extracts information such as dates, amounts, taxes,
      contacts, and bank details.
    - >
      The 2.x line introduced a renewed application generation with migration from
      Receipts 1. Later releases expanded synchronization, OCR controls, observed
      folders, exports, encrypted libraries, integrity checking, audit-oriented change
      tracking, and broader language support.
  related-projects:
    - Receipts API exposes AppleScript-oriented automation examples for Receipts.
    - >
      GrandTotal and MoneyMoney are financial applications supported by Receipts import
      workflows.
  sources:
    - https://receipts-app.com/
    - https://receipts-app.com/changelog
    - https://receipts-app.com/help
  summary:
    - >
      Receipts Space is a local-first macOS hub for capturing, recognizing, organizing,
      and exporting receipts and other financial documents. It emphasizes privacy,
      portable libraries, automation, and optional multi-computer collaboration.
  timeline:
    - 'Receipts 1.x: Earlier product generation supported existing receipt libraries.'
    - '2.0: Initial release of the renewed Receipts Space line.'
    - >
      2.1: Personal settings and synchronized library settings were separated, with
      automation and migration capabilities restored over subsequent updates.
    - >
      3.0: Added an audit-oriented workflow, change timeline, encrypted libraries,
      improved synchronization, and a redesigned dashboard.
  usage:
    - >
      Users import scans, PDFs, email attachments, e-invoices, and files from watched
      folders; the application applies OCR and content analysis, then organizes
      documents by metadata such as contact, category, date, amount, tax, and payment
      status.
    - >
      Libraries can be searched, synchronized, reviewed through financial dashboards,
      and exported to supported formats or accounting workflows.
