id: brew:nap
display-name: nap
repo: null
docs:
  - https://github.com/maaslalani/nap#readme
config-file-location:
  unix:
    - $NAP_CONFIG
    - $XDG_CONFIG_HOME/nap/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      GitHub API data fetched on 2026-07-01 showed 2,209 stars and 64 forks, which is
      good visibility for a personal productivity CLI. Homebrew's formula JSON generated
      on 2026-07-01 reported 145 installs over 365 days and 18 installs over 30 days, so
      package-manager usage is small even though the repository attracted attention.
    - >
      The adoption pattern is typical for a boutique developer tool: users discover it
      from GitHub, demos, dotfiles, or terminal-tool circles, then use it if its local
      snippet workflow matches their habits. It is not infrastructure and has no broad
      dependency graph.
  package-nerd-significance:
    - >
      Nap is significant as a compact example of the modern Go TUI/CLI wave:
      single-purpose, Homebrew-installable, pipe-friendly, and intended to live inside a
      developer's terminal workflow. Its package significance is practical rather than
      infrastructural.
  project-history:
    - >
      The GitHub repository was created on 2022-11-12, and the only GitHub releases
      returned by the releases API were v0.1.0 and v0.1.1, both published on 2022-11-21.
      The repository was still visible and starred in 2026, but the release history is
      short and the upstream scope is intentionally narrow.
    - >
      The project comes from Maas Lalani's ecosystem of polished terminal tools. Nap's
      README emphasizes a simple workflow: launch `nap` for a TUI, save snippets from
      stdin or files, retrieve snippets by fuzzy-ish name, pipe snippets to files or
      clipboards, and store configuration under `$XDG_CONFIG_HOME/nap/config.yaml` or
      `$NAP_CONFIG`.
  related-projects:
    - Charm Gum
    - pbcopy
    - xclip
    - GitHub Gist
  sources:
    - https://api.github.com/repos/maaslalani/nap
    - https://api.github.com/repos/maaslalani/nap/releases?per_page=5
    - https://formulae.brew.sh/api/formula/nap.json
    - https://formulae.brew.sh/formula/nap
    - https://github.com/maaslalani/nap
  summary:
    - >
      Nap is a small Go terminal tool for saving, browsing, organizing, and outputting
      code snippets. Its README frames it as both a command-line interface and a
      text-user interface for snippets kept in the terminal.
  timeline:
    - '2022-11-12: maaslalani/nap repository created on GitHub.'
    - '2022-11-21: v0.1.0 and v0.1.1 releases published.'
    - >
      2026-07-01: Homebrew formula JSON listed stable version 0.1.1 and 145 installs
      over 365 days.
  usage:
    - >
      Users run `nap` to open the TUI, press keys to create/edit/copy/delete snippets,
      or use CLI pipes such as `nap Notes/FizzBuzz.go < main.go`, `curl ... | nap
      Notes/FizzBuzz.go`, `nap list`, `nap go/boilerplate > main.go`, or `nap foobar |
      pbcopy`.
    - >
      Package nerds should think of Nap as a dotfiles-adjacent productivity binary. The
      useful package metadata is the executable name, config location, and storage
      behavior; there is not much deeper ecosystem history beyond the repository and
      formula.
related-packages:
  - id: brew:gum
    reason: >
      Nap's official README pipes `nap list` into `gum filter`, making Gum a documented
      interactive fuzzy selector for saved snippets.
    rel: adjacent_workflow
    sources:
      - https://github.com/maaslalani/nap#readme
      - https://github.com/charmbracelet/gum/blob/main/README.md
  - id: brew:gh
    reason: >
      Nap's official README pipes `gh gist view` into Nap, so GitHub CLI provides a
      documented way to import Gist content as a local snippet.
    rel: adjacent_workflow
    sources:
      - https://github.com/maaslalani/nap#readme
      - https://cli.github.com/manual/gh_gist_view
