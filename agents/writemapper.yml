history:
  adoption-history:
    - >
      WriteMapper has been distributed as a commercial desktop writing application for
      macOS and Windows, with an in-app tutorial, a time-limited trial, and dedicated
      documentation supporting its user base.
  package-nerd-significance:
    - >
      WriteMapper is notable in desktop-package catalogs as a focused proprietary
      writing tool that treats a mind map as both an outline and the structure of the
      resulting document.
  project-history:
    - >
      WriteMapper's official changelog records the addition of a web-based User Guide in
      2019 and instant guide search in 2020. The current version 4 documentation
      organizes its workflow around starting, outlining, writing, and finishing a
      document.
  related-projects:
    - >
      Mind-mapping applications, outliners, and distraction-reduced writing tools
      address adjacent parts of the same workflow.
  sources:
    - https://writemapper.com/features/
    - https://writemapper.com/features/part-1-start/
    - https://writemapper.com/support/
    - https://writemapper.com/whats-new/changelog/
  summary:
    - >
      WriteMapper is a visual writing application that combines mind-map outlining with
      a content editor to turn structured ideas into finished documents.
  timeline:
    - '2019-07-14: Official web-based User Guide announced'
    - '2020-05-10: Instant search added to the User Guide'
    - >
      2022: WriteMapper 3 introduced a redesigned desktop application and the first paid
      major upgrade since 1.0
    - '2026: Version 4 documentation describes the current four-stage writing workflow'
  usage:
    - >
      Writers brainstorm ideas as nodes, arrange those nodes into a hierarchy, expand
      them in the integrated editor, and save or export the resulting document. The app
      supports macOS and Windows and includes a tutorial WriteMap.
