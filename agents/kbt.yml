history:
  adoption-history:
    - >
      The package reached CLI users through several package-manager channels recorded in
      the batch input, including Homebrew, Nix, Arch Linux, and Cargo installation.
  package-nerd-significance:
    - >
      For package collectors, kbt is a tidy example of the post-ratatui Rust TUI wave: a
      small hardware-adjacent diagnostic tool that moved from Cargo-style distribution
      into mainstream Unix package managers.
  project-history:
    - >
      The repository was created in March 2023 and published release builds during 2023,
      with 1.0.0 appearing on July 23, 2023 and 2.1.0 on January 6, 2024. The README
      presents the project as a deliberately small terminal utility motivated by
      frustration with semi-broken web-based keyboard testers.
  related-projects:
    - The README credits ratatui as the TUI library used to build the interface.
  sources:
    - https://github.com/bloznelis/kbt
    - https://github.com/bloznelis/kbt/releases
    - https://github.com/ratatui-org/ratatui
  summary:
    - >
      kbt is a Rust terminal keyboard tester whose upstream README expands the name as
      keyboard tester and frames it as a terminal alternative to online keyboard-test
      pages.
  timeline:
    - '2023: Repository created for a terminal keyboard tester.'
    - '2023-07-23: kbt 1.0.0 release published.'
    - '2024-01-06: kbt 2.1.0 release published.'
  usage:
    - >
      kbt is run as an interactive terminal UI for checking keyboard input and layouts.
      The README notes Linux, macOS, and Windows support, a Wayland limitation, and a
      macOS first-run Accessibility permission requirement.
