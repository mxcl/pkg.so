history:
  adoption-history:
    - >
      The platform expanded from securities trading into futures, asset management,
      fixed income, funds, and other investment services. Its official chronology
      records strategic investment from Sina and cooperation with Weibo in 2017,
      followed by continued development of its in-house trading and clearing
      infrastructure.
  package-nerd-significance:
    - >
      The Homebrew cask provides a package-managed installation path for a specialized,
      region-specific financial desktop client that would otherwise be obtained directly
      from the broker. It is a closed end-user application rather than a reusable
      developer library.
  project-history:
    - >
      Valuable Capital launched the HSTong trading application in August 2016 after
      obtaining its Hong Kong securities-trading license earlier that year. The company
      describes HSTong as its internally developed online platform for access to Hong
      Kong, United States, mainland Chinese, futures, fund, bond, and related markets.
  related-projects:
    - >
      HSTong is the client application of Valuable Capital Limited, branded in Chinese
      as 華盛通 and distributed by Homebrew under the vbrokers cask token.
  sources:
    - 'Official company profile and chronology: https://www.vbkr.com/about-us/profile'
    - 'Official product overview: https://www.vbkr.com/'
    - >
      Package identity and Homebrew distribution: source_facts.applications and
      source_facts.package-manager
  summary:
    - >
      VBrokers packages HSTong.app, the macOS client for Valuable Capital's Hong
      Kong-based online brokerage platform. It combines market information, account
      management, and trading for several asset classes.
  timeline:
    - '2016: Valuable Capital obtained a securities-trading license and launched HSTong.'
    - '2017: Sina invested in the company, and it entered a strategic cooperation with Weibo.'
    - >
      2020–2021: The company moved its United States and Hong Kong/mainland-China
      clearing operations onto internally developed systems.
  usage:
    - >
      Users open and manage a brokerage account, fund it, follow market data, and trade
      supported securities and other investment products. Because it handles regulated
      financial accounts, authentication and account data are managed through the
      service rather than a documented local credentials file.
