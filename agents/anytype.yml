history:
  adoption-history:
    - >
      Anytype ran an alpha program on desktop platforms before extending the client to
      Android and iOS. Its 2023 open beta removed the waitlist, opened the application's
      code, and established a broader community around local-first knowledge management.
    - >
      The project added local-first sharing and collaboration through AnySync in 2024,
      broadening its use from private personal knowledge bases to shared spaces.
  package-nerd-significance:
    - >
      Anytype interests package enthusiasts because it combines an Electron desktop
      client with a Go middleware, local storage, peer-to-peer synchronization,
      end-to-end encryption, inspectable application code, and separately open-source
      synchronization infrastructure.
  project-history:
    - >
      Anytype began in 2018 with a mission centered on digital ownership and freedom.
      Development initially focused on a private, local-first knowledge system whose
      data model represents notes, tasks, collections, and other material as connected
      objects.
    - >
      The alpha program began on macOS and Windows in 2020, followed by Linux and
      Android clients. An iOS alpha completed coverage of the major desktop and mobile
      platforms in 2021. Any Association opened the desktop and mobile application
      repositories alongside the public beta in 2023.
  related-projects:
    - >
      The desktop application depends on anytype-heart, a shared middleware library used
      by Anytype clients. AnySync provides the project's local-first, peer-to-peer
      synchronization protocol, while any-block defines data structures used by the
      ecosystem.
  sources:
    - https://blog.anytype.io/2023-in-review-2024-for-the-win/
    - https://blog.anytype.io/a-new-networked-era-for-anytype/
    - https://blog.anytype.io/hello-iphone-its-anytype/
    - https://blog.anytype.io/our-journey-and-plans-for-2025/
    - https://blog.anytype.io/our-open-philosophy/
    - https://github.com/anyproto/anytype-ts
  summary:
    - >
      Anytype is a local-first, peer-to-peer and end-to-end-encrypted knowledge
      application for notes, tasks, structured objects, personal organization, and
      collaborative spaces.
  timeline:
    - '2018: The Anytype project began.'
    - >
      2020: The desktop alpha program opened on macOS and Windows, followed by Linux and
      Android.
    - '2021: Anytype released its first iOS alpha.'
    - '2023: The open beta launched and the application repositories became public.'
    - '2024: Anytype publicly debuted local-first sharing and collaboration through AnySync.'
  usage:
    - >
      Users create spaces containing linked, typed objects such as pages, tasks,
      journals, collections, and databases. Content remains available locally and can
      optionally synchronize peer-to-peer across a user's devices or collaborative
      spaces.
