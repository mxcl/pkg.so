history:
  adoption-history:
    - >
      XProCheck is distributed as a focused Mac troubleshooting utility for users who
      want to confirm that Apple's background malware-remediation scans are running. It
      complements the author's broader family of macOS security and Unified Log tools.
  package-nerd-significance:
    - >
      XProCheck exposes an otherwise obscure part of macOS security operations without
      pretending to be an independent antivirus engine. For Mac administrators and
      diagnostic-tool collectors, its value lies in translating Unified Log evidence
      from Apple's XProtect Remediator into a small, purpose-built interface.
  project-history:
    - >
      Howard Oakley introduced XProCheck during the early public evolution of XProtect
      Remediator. By September 2022, version 1.1 could both summarize logged scan
      results and request an on-demand XProtect Remediator scan.
    - >
      Later releases refined interpretation and performance as Apple's scan modules and
      log messages evolved. The official product page describes current builds as
      covering recent macOS generations and reporting whether scans completed, detected
      malware, or attempted remediation.
  related-projects:
    - >
      SilentKnight checks the installed versions and available updates for Apple's
      security components.
    - Ulbow and LogUI provide broader access to the macOS Unified Log.
    - >
      Mints includes specialized log views useful when investigating background task
      scheduling.
  sources:
    - https://eclecticlight.co/2022/09/16/interpreting-xprochecks-results-and-problems/
    - https://eclecticlight.co/2024/07/23/xprocheck-1-6-update-improves-performance/
    - https://eclecticlight.co/consolation-t2m2-and-log-utilities/
  summary:
    - >
      XProCheck is a macOS utility by The Eclectic Light Company that inspects Unified
      Log records for Apple's XProtect Remediator scans and highlights detections,
      remediation, or abnormal results.
  timeline:
    - >
      2022-09: XProCheck 1.1 added the ability to request an XProtect Remediator scan on
      demand.
    - '2024-07: XProCheck 1.6 improved performance and reporting.'
    - >
      2026: The official distribution page lists builds supporting current and
      forthcoming macOS release families.
  usage:
    - >
      Users select a look-back period and inspect completed XProtect Remediator scan
      reports. If no automatic scans appear, the author's guide recommends widening the
      period before trying an on-demand scan.
    - >
      Normal reports commonly contain NoThreatDetected or status codes 0 or 20.
      XProCheck marks other status messages or codes for attention, but its results are
      evidence from Apple's log rather than scans performed by XProCheck itself.
