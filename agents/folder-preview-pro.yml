history:
  adoption-history:
    - >
      Anybox distributes Folder Preview Pro directly from its website rather than
      through the Mac App Store. Homebrew Cask provides a package-manager installation
      path for the same Mac application.
    - >
      The product evolved rapidly after its initial release, adding an icon view,
      navigation, more file actions, archive-format support, performance improvements,
      and compatibility updates for multiple macOS generations.
  package-nerd-significance:
    - >
      Folder Preview Pro fills a narrow macOS usability gap by turning Quick Look into a
      browsable folder and archive viewer. Homebrew Cask makes this independently
      distributed, notarized-style desktop utility manageable alongside command-line and
      GUI development tools.
    - >
      The Pro edition is also an example of functionality that benefits from direct
      distribution: the official site notes that it is not sandboxed, allowing
      capabilities beyond the related Mac App Store edition.
  project-history:
    - >
      Anybox Ltd released Folder Preview Pro 1.0 in August 2025. Version 2.0 followed in
      September with an icon view, path-bar navigation, additional file actions, and
      settings inside the Quick Look window.
    - >
      Version 3.0 arrived in September 2026 as the largest update to that point, making
      preview interactions more Finder-like with immediate clicks, folder navigation,
      back and forward controls, and a Liquid Glass toolbar.
  related-projects:
    - Folder Preview, Anybox's lower-priced related application.
    - >
      Archive Preview Pro, an extension that can be enabled alongside Folder Preview Pro
      for ZIP, 7z, RAR, and other archives.
  sources:
    - 'Official changelog: https://anybox.ltd/folder-preview-pro/changelog'
    - 'Official product page: https://anybox.ltd/folder-preview-pro'
    - 'Official user guide: https://anybox.ltd/folder-preview-pro/user-guide'
    - source_facts.package-manager identifies the Homebrew cask.
  summary:
    - >
      Folder Preview Pro is a macOS Quick Look extension from Anybox Ltd that previews
      folders and archives and permits Finder-like navigation and file actions from the
      preview window.
  timeline:
    - '2025-08-11: Folder Preview Pro 1.0 was released.'
    - >
      2025-09-19: Version 2.0 added icon view, path-bar navigation, more actions, and
      in-preview settings.
    - '2026-09-06: Version 3.0 added Finder-like folder navigation and redesigned controls.'
  usage:
    - >
      Enable the Folder Preview Pro extension in macOS System Settings, select a folder
      in Finder or another file manager, and press Space or Command-Y. The preview can
      display list or icon views and expose actions such as Open, Open With, Copy, Get
      Info, Show in Finder, and Move to Trash.
