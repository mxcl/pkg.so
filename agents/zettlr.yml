config-file-location:
  linux:
    - ~/.config/Zettlr/config.json
  macos:
    - ~/Library/Application Support/Zettlr/config.json
  windows:
    - '%APPDATA%\Zettlr\config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      A community of academics and students formed around Zettlr during its first two
      years. The official project history says that by 2020 it was being used on every
      continent and at universities worldwide.
    - >
      Later releases broadened its audience beyond academia to journalists, authors, and
      others managing substantial writing projects. Cross-platform releases for Linux,
      macOS, and Windows and an open-source development model support that broad use.
  package-nerd-significance:
    - >
      Zettlr combines plain-text Markdown storage with academic citation workflows and
      publication tooling, avoiding a proprietary document format or mandatory cloud
      service.
    - >
      It is attractive to package users who want a cross-platform, open-source writing
      environment that can connect Markdown notes and manuscripts with reference
      managers and reproducible export workflows.
  project-history:
    - >
      Hendrik Erz began Zettlr in 2017 as a passion project after finding existing word
      processors and note-taking applications poorly suited to academic writing.
    - >
      Major 2.0 and 3.0 releases in 2021 and 2023 developed the editor into a broader
      publication workbench spanning notes, citations, long-form writing, and final
      export.
  related-projects:
    - >
      Zettlr participates in a broader Markdown and academic-writing ecosystem and is
      commonly paired with citation managers and export tools. Its documentation
      describes import and export profiles and Lua filters as part of the application
      data.
  sources:
    - https://docs.zettlr.com/en/getting-started/migrating.html
    - https://docs.zettlr.com/en/getting-started/setup.html
    - https://zettlr.com/
    - https://zettlr.com/about
  summary:
    - >
      Zettlr is a free and open-source Markdown editor and publication workbench
      designed initially for academic researchers and later adopted by other long-form
      writers.
  timeline:
    - '2017: Hendrik Erz started Zettlr as a Markdown-based academic-writing project.'
    - '2020: The project reported use on every continent and at universities worldwide.'
    - '2021: Zettlr 2.0 was released.'
    - '2023: Zettlr 3.0 was released.'
  usage:
    - >
      Users organize local Markdown files and workspaces, take notes, manage citations,
      draft long-form material, and export publication-ready documents. Files remain
      locally controlled, with no forced cloud synchronization or telemetry.
