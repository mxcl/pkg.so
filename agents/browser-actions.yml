history:
  adoption-history:
    - >
      Browser Actions targets macOS 14 and later and supports Brave, Chromium, Google
      Chrome, Microsoft Edge, Vivaldi, and Safari through one Shortcuts-oriented
      interface.
    - >
      The application is commercially distributed with a trial and perpetual licenses
      rather than a subscription; the supplied metadata records Homebrew Cask packaging
      for macOS installation.
  package-nerd-significance:
    - >
      Browser Actions fills a niche between browser automation, AppleScript, and macOS
      Shortcuts. Its uniform browser references and actions let workflows switch
      browsers without being rebuilt around separate browser-specific interfaces.
    - >
      Its dedicated action reference exposes typed parameters and return values, making
      the application useful as an automation component rather than only an interactive
      utility.
  project-history:
    - >
      Independent developer Carlo created Browser Actions after finding that
      Chromium-family browsers lacked convenient macOS Shortcuts integration. The
      project uses underlying browser scripting and AppleScript capabilities while
      presenting them as native Shortcuts actions.
    - >
      The action set grew to cover tabs, windows, browser references, menu operations,
      keyboard input, form fields, page content, JavaScript, and element interaction.
  related-projects:
    - Apple Shortcuts is the host automation environment.
    - AppleScript provides part of the underlying browser-control technology.
    - >
      Actions For Obsidian is another ActionsDotWork automation product referenced by
      the developer.
  sources:
    - 'Official documentation: https://docs.actions.work/browser-actions/'
    - 'Official product page and FAQ: https://actions.work/browser-actions/'
    - 'Package-manager adoption: source_facts.package-manager'
  summary:
    - >
      Browser Actions is a macOS application that adds a unified collection of
      browser-control actions to Apple Shortcuts.
  timeline:
    - 'Initial release: Created to bridge the Shortcuts-support gap in Chrome-family browsers.'
    - >
      Current generation: Supports six browser families and a growing set of tab,
      window, menu, page, and scripting actions.
  usage:
    - >
      Users install the application, prepare supported browsers using its in-app setup,
      and then compose automations in Apple Shortcuts.
    - >
      A typical portable workflow obtains a browser reference once and passes it into
      subsequent actions, avoiding repeated frontmost-browser detection and allowing
      easier browser switching.
