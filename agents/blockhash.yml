history:
  adoption-history:
    - >
      blockhash has narrow but durable package adoption. The input metadata records
      Homebrew and Nix packages, which is enough for scripts and reproducible
      media-processing environments to depend on the CLI without building the
      ImageMagick-backed source manually.
  package-nerd-significance:
    - >
      blockhash matters as a compact packaged implementation of perceptual hashing,
      useful for duplicate detection, image comparison, media archives, and content
      pipelines where cryptographic hashes are too brittle because visually similar
      images may have different bytes.
  project-history:
    - >
      The official README says blockhash is based on the algorithm described in 'Block
      Mean Value Based Image Perceptual Hashing' by Bian Yang, Fan Gu, and Xiamu Niu.
      GitHub metadata dates the repository to September 2014, and the README copyright
      line names Commons Machinery in 2014.
    - >
      The release history shows v0.1 in December 2014, follow-up 0.2 releases in January
      2017, v0.3 in November 2017, and later maintenance releases through v0.3.3 in
      January 2023.
  related-projects:
    - ImageMagick/MagickWand is the image-processing dependency named in the README.
    - >
      The underlying perceptual-hashing method comes from the block mean value image
      hashing paper cited by the README.
    - >
      Other perceptual-hash tools and media duplicate-detection pipelines are adjacent
      use cases.
  sources:
    - GitHub repository metadata via gh api repos/commonsmachinery/blockhash
    - https://github.com/commonsmachinery/blockhash#readme
    - https://github.com/commonsmachinery/blockhash/releases
    - source_facts.package-manager
  summary:
    - >
      blockhash is a small Commons Machinery command-line tool for computing perceptual
      image hashes. It packages the block mean value perceptual-hashing algorithm into a
      Unix-style utility that can hash one or more images from the shell.
  timeline:
    - '2014: Official repository created and v0.1 released.'
    - '2017: 0.2 and v0.3 releases published.'
    - '2023: v0.3.3 maintenance release published.'
  usage:
    - >
      The README documents a direct CLI workflow: run `blockhash` with a list of images
      to calculate hashes, or `blockhash --help` for options. Building from source
      requires ImageMagick's MagickWand development library and the waf build script.
