history:
  adoption-history:
    - >
      EdrawMax grew from a desktop diagramming application into a cross-platform product
      for Windows, macOS, Linux, web browsers, and mobile devices.
    - >
      Wondershare Edraw describes the product as serving millions of users and
      supporting more than 200 diagram types, with templates and import/export workflows
      aimed at education, business, engineering, and technical documentation.
  package-nerd-significance:
    - >
      EdrawMax occupies the commercial, all-in-one end of desktop diagramming: one
      package covers flowcharts, network diagrams, UML, floor plans, organizational
      charts, mind maps, and other visual-document formats.
    - >
      It is also notable among proprietary creative applications for maintaining native
      desktop distributions across Windows, macOS, and Linux while adding a browser
      edition and cloud features.
  project-history:
    - >
      Wondershare Edraw says Edraw was established in Shenzhen in 2014 and that EdrawMax
      launched with cross-platform Windows, macOS, and Linux support in March 2016.
    - >
      Wondershare took control of Edraw in 2019. EdrawMax later added cloud workflows
      and, beginning in 2023, AI-assisted content and diagram generation.
  related-projects:
    - "EdrawMind: Wondershare Edraw's mind-mapping application."
    - 'EdrawProj: its project-management application.'
    - 'Edraw.AI: its cloud-based AI visual-collaboration product.'
  sources:
    - https://edrawmax.wondershare.com/guide/
    - https://edrawmax.wondershare.com/whats-new.html
    - https://edrawsoft.wondershare.com/about-us.html
  summary:
    - >
      Wondershare EdrawMax is a commercial, cross-platform diagramming suite for
      producing flowcharts, technical diagrams, floor plans, organizational charts, mind
      maps, and other visual documents.
  timeline:
    - '2014: Edraw is established in Shenzhen.'
    - '2016: EdrawMax launches with Windows, macOS, and Linux support.'
    - '2019: Edraw becomes controlled by Wondershare Technology Group.'
    - '2023: EdrawMax begins adding AI features.'
  usage:
    - >
      Users begin with a blank canvas or template, arrange symbols and connectors, and
      export diagrams to image, PDF, Office, or Visio-compatible formats.
    - >
      The application supports local desktop work as well as account-connected
      templates, cloud storage, sharing, version history, and AI-assisted diagram
      generation.
