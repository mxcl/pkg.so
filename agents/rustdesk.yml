id: cask:rustdesk
display-name: RustDesk
repo: null
docs:
  - https://rustdesk.com/docs/en
  - https://rustdesk.com/docs/en/client
  - https://rustdesk.com/docs/en/self-host/client-configuration
config-file-location:
  linux:
    - ~/.config/rustdesk/RustDesk.toml
    - ~/.config/rustdesk/RustDesk2.toml
  macos:
    - ~/Library/Preferences/com.carriez.RustDesk/RustDesk.toml
    - ~/Library/Preferences/com.carriez.RustDesk/RustDesk2.toml
  windows:
    - '%APPDATA%\RustDesk\config\RustDesk.toml'
    - '%APPDATA%\RustDesk\config\RustDesk2.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      RustDesk supports Windows, macOS, Linux, iOS, Android, and web clients. Its
      documentation serves both ordinary remote-support users and administrators
      deploying self-hosted infrastructure.
  package-nerd-significance:
    - >
      RustDesk is notable to package users as a Rust-based, cross-platform alternative
      to proprietary remote-desktop tools. Its split client/server ecosystem,
      self-hosting option, and portable or managed deployment modes make it relevant to
      desktop packaging and fleet administration.
  project-history:
    - >
      RustDesk developed as an open-source remote-control client written primarily in
      Rust. The project subsequently established separate repositories for the client,
      open-source rendezvous/relay server, commercial server, and documentation.
  related-projects:
    - RustDesk Server OSS provides the self-hostable rendezvous and relay services.
    - >
      RustDesk Server Pro adds enterprise administration, account, policy, and
      web-console capabilities.
  sources:
    - https://github.com/rustdesk/rustdesk
    - https://rustdesk.com/docs/en/
    - https://rustdesk.com/docs/en/client/
  summary:
    - >
      RustDesk is an open-source remote-desktop and remote-support application designed
      to work with public infrastructure or a self-hosted rendezvous and relay server.
  timeline:
    - >
      The client project established a cross-platform Rust implementation and an
      independent open-source server.
    - >
      The ecosystem expanded to include dedicated documentation and commercial
      server-management features.
  usage:
    - >
      Users run RustDesk on the controlling and remote computers, enter the remote
      device ID, and authenticate with one-time approval or a configured password.
      Administrators can point clients at self-hosted ID and relay servers and automate
      deployment with imported configuration strings.
