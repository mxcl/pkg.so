history:
  adoption-history:
    - >
      Poedit became a broadly packaged desktop localization tool: the project
      distributes official Windows and macOS binaries and a Linux Snap, while noting
      that many Linux distributions provide native packages.
    - >
      Its gettext workflow is especially relevant to open-source and WordPress
      localization, while later releases broadened support to XLIFF, JSON, RESX, Qt TS,
      Flutter ARB, and other structured translation formats.
  package-nerd-significance:
    - >
      Poedit is a familiar graphical companion to GNU gettext. It gives translators and
      developers a desktop workflow for formats that are otherwise commonly manipulated
      with command-line gettext utilities or localization-platform tooling.
    - >
      The official repository, cross-platform build system, Linux distribution packages,
      Snap, and Homebrew cask make Poedit a useful example of an open-source desktop
      application distributed through several packaging ecosystems.
  project-history:
    - >
      Poedit is an open-source, cross-platform translation editor maintained by Václav
      Slavík. Its original and most complete workflow centers on GNU gettext PO, POT,
      and compiled MO files, and it also acts as a graphical frontend to gettext-related
      utilities.
    - >
      The project evolved beyond basic catalog editing with source-code extraction,
      validation, translation memory, pre-translation, machine-translation providers,
      cloud localization integrations, and dedicated WordPress workflows.
  related-projects:
    - >
      GNU gettext provides the PO, POT, and MO ecosystem at the center of Poedit's
      original workflow.
    - >
      WordPress is a prominent Poedit use case because its themes and plugins commonly
      use gettext catalogs.
    - Crowdin and Localazy are supported cloud-localization integrations.
  sources:
    - https://github.com/vslavik/poedit
    - https://poedit.com/docs/
    - https://poedit.com/docs/get-started/wordpress/
    - https://poedit.com/docs/reference/file-formats/
  summary:
    - >
      Poedit is an open-source graphical editor for software-localization files, best
      known for its GNU gettext workflow and cross-platform desktop interface.
  timeline:
    - >
      2023: Poedit's repository continued the 3.x release series across macOS, Windows,
      and Unix-like systems.
    - '2026-06-04: Poedit 3.9.1 was released from the official repository.'
  usage:
    - >
      Translators open a structured localization file, edit strings with context and
      validation assistance, and save the result; gettext PO files can also be compiled
      into MO files.
    - >
      Developers use Poedit to create catalogs from source code, update existing
      catalogs, translate WordPress themes and plugins, and connect selected
      cloud-localization projects.
