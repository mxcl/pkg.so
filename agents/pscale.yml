id: brew:pscale
display-name: pscale
repo: null
docs:
  - https://planetscale.com/docs/cli
config-file-location:
  unix:
    - ~/.config/planetscale/pscale.yml
credentials-file-location:
  unix:
    - ~/.config/planetscale/access-token
  windows:
    - ~\.config\planetscale\access-token
history:
  adoption-history:
    - >
      PlanetScale distributes the CLI as release binaries and packages for macOS, Linux,
      and Windows, as well as an official container image. Homebrew and Nix coverage is
      recorded in source_facts.package-manager.
    - >
      The CLI is also designed for automation: official guidance documents service-token
      environment variables, machine-readable output, GitHub Actions usage, and
      agent-oriented commands.
  package-nerd-significance:
    - >
      pscale packages a hosted database control plane into a scriptable Unix-style
      interface. It is especially notable for exposing PlanetScale's branching and
      deploy-request concepts alongside conventional database shells and SQL execution,
      making infrastructure workflows reproducible from terminals and CI systems.
  project-history:
    - >
      PlanetScale created pscale as the command-line interface to its managed database
      platform. The tool grew beyond basic connection commands to cover organizations,
      databases, branches, deploy requests, backups, workflows, webhooks, service
      tokens, Postgres roles and passwords, and Vitess-specific operations.
    - >
      The project later added container distribution, structured output, service-token
      automation, GitHub Actions integration, and guidance for non-interactive agents.
  related-projects:
    - 'PlanetScale: The managed database service controlled by the CLI.'
    - 'Vitess: One of the database technologies supported by PlanetScale commands.'
    - 'PostgreSQL: Supported by current command families alongside Vitess.'
    - 'MySQL client: Required for certain interactive database commands.'
    - 'PlanetScale MCP server: The documented successor to the deprecated CLI-hosted MCP mode.'
  sources:
    - 'Input package coverage: source_facts.package-manager'
    - 'Official CLI documentation: https://planetscale.com/docs/cli'
    - 'Official CLI repository README: https://github.com/planetscale/cli'
  summary:
    - >
      PlanetScale CLI, invoked as pscale, manages PlanetScale databases and platform
      resources from interactive terminals, scripts, CI jobs, and agent workflows.
  timeline:
    - '2021: Official project discussions documented an available pscale container image.'
    - >
      Later releases: Structured JSON and CSV output, service-token automation, Postgres
      command families, and agent guidance expanded non-interactive use.
    - >
      Current direction: The CLI-hosted MCP server is deprecated in favor of the
      dedicated PlanetScale MCP server.
  usage:
    - >
      Users authenticate interactively with pscale auth login or supply
      PLANETSCALE_SERVICE_TOKEN_ID and PLANETSCALE_SERVICE_TOKEN for automation.
      Commands manage databases, branches, deploy requests, organizations, backups,
      passwords, roles, webhooks, and workflows.
    - >
      The CLI opens database shells and connections, and pscale sql supports
      non-interactive queries. The global --config option defaults to
      $HOME/.config/planetscale/pscale.yml.
