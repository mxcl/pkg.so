history:
  adoption-history:
    - >
      Version 1.0.0, codenamed Silver, was announced in July 2023 as a culmination of
      work by the community and core Metals team, with support for important LSP
      features and IDE-like workflows in users' editors. Metals documentation names
      Scala Center and VirtusLab among the organizations developing Metals with
      community help.
  project-history:
    - >
      Metals' technical role is to bring IDE features to editors that speak the Language
      Server Protocol. The 2019 Scala language blog described Metals 0.5 as supporting
      completions, type at point, goto definition, fuzzy symbol search, and other
      editing and navigation features in VS Code, Vim, Emacs, Atom, Sublime Text, and
      any compatible LSP client. The tool also connected the editor side of Scala
      tooling to build tools through Bloop and the Build Server Protocol, allowing
      support for sbt, Gradle, Maven, Mill, and any build tool implementing BSP.
  sources:
    - https://formulae.brew.sh/formula/metals
    - https://github.com/scalameta/metals
    - https://scalameta.org/metals/blog/2019/01/24/tin/
    - https://scalameta.org/metals/blog/2023/07/19/silver/
    - https://scalameta.org/metals/docs/integrations/new-build-tool/
    - >
      https://users.scala-lang.org/t/metals-v0-3-is-out-compile-errors-and-goto-definition-in-the-editor/3681
    - https://www.scala-lang.org/2019/04/16/metals.html
  summary:
    - >
      Metals is the Scala language server from the Scalameta ecosystem. The name is
      explained by the project as Meta, from Scalameta, plus LS, from Language Server.
      Early public announcements credited work at the Scala Center with community
      contributors, and Ólafur Páll Geirsson announced Metals 0.3 and 0.4 releases
      during the 2018-2019 period as a work-in-progress language server for Scala
      editors.
  usage:
    - >
      In practice, Metals is installed by editor plugins or as a standalone
      language-server binary, then launched by VS Code, Neovim, Emacs, Sublime Text,
      Zed, Helix, or another client. Homebrew and Nix packaging make the server
      available outside editor-specific installers, which matters for reproducible
      developer machines, CI checks around editor tooling, and users who prefer to
      manage language servers through the OS package manager.
