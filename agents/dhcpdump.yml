history:
  adoption-history:
    - >
      dhcpdump stayed relevant because DHCP troubleshooting often needs a readable
      decode of broadcasts, options, client identifiers, relay-agent data, and pcap
      captures. The maintained fork adds modern fixes such as VLAN-tagged traffic
      support, pcap-file reading, and updated option parsing.
  package-nerd-significance:
    - >
      For package maintainers, dhcpdump is the sort of tiny network utility that
      survives because it is easier to package and invoke than a full packet-analysis
      suite. Its value is not breadth, but the convenience of purpose-built DHCP
      decoding in scripts, support sessions, and server rooms.
  project-history:
    - >
      The original Mavetju page lists DHCPDUMP 1.8 as a utility to analyze sniffed DHCP
      packets, and its change log records incremental releases through 1.8. The current
      official fork describes itself as a fork of dhcpdump 1.8 by Edwin Groothuis that
      collects bug fixes and improvements accumulated over more than a decade.
  related-projects:
    - dhcping is another Mavetju DHCP diagnostic tool.
    - tcpdump and libpcap are adjacent packet-capture tools used around dhcpdump workflows.
  sources:
    - http://www.mavetju.org/unix/general.php
    - http://www.mavetju.org/unix/dhcpdump-man.php
    - http://www.mavetju.org/unix/dhcpdump-changes.txt
    - https://github.com/dhcpdump-org/dhcpdump
    - https://api.github.com/repos/bbonev/dhcpdump
  summary:
    - >
      dhcpdump is a small DHCP packet inspection utility: it decodes captured DHCP
      traffic into output that is easier to read than raw packet dumps. It occupies the
      classic Unix niche of a narrow diagnostic command built for administrators
      debugging a specific protocol.
  timeline:
    - '2002: Original man page revision identifies dhcpdump as a DHCP packet dumper.'
    - '2004: Version 1.8 changes dhcpdump to use pcap instead of tcpdump output.'
    - '2023: Current GitHub fork is created to collect long-running fixes and improvements.'
  usage:
    - >
      The original manual documents use on a network interface, optional
      client-hardware-address filtering, and verbose decoded output of DHCP headers and
      options. Later releases moved from parsing tcpdump output to using pcap directly.
related-packages:
  - id: brew:dhcping
    reason: >
      Use dhcping first to test whether a DHCP server responds, then dhcpdump when
      packet-level decoding is needed to investigate the exchange.
    rel: adjacent_workflow
    sources:
      - https://www.mavetju.org/unix/dhcping-man.php
      - https://www.mavetju.org/unix/dhcpdump-man.php
