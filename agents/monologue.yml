history:
  adoption-history:
    - >
      Monologue began as a macOS dictation application and subsequently expanded across
      iPhone, iPad, and Apple Watch. The official product now combines system-wide
      dictation, synchronized voice notes, and bot-free meeting transcription.
    - >
      Later integrations exposed saved notes through read-only MCP, CLI, API, and
      webhook workflows, making the product useful both as an assistive writing tool and
      as a voice-input source for developer agents and personal automation.
  package-nerd-significance:
    - >
      Monologue is notable to automation-oriented Mac users because it pairs
      application-aware dictation with local transcription models and structured access
      to saved notes through MCP, a CLI, and a documented API.
    - >
      Its URL scheme, global shortcuts, custom writing modes, offline processing option,
      and agent integrations turn voice input into a composable workstation capability
      rather than an isolated transcription window.
  project-history:
    - >
      Monologue is an Every Media, Inc. product for voice dictation, voice notes, and
      meeting transcription on Apple platforms. Its Mac application transforms natural
      speech into formatted text appropriate to the active application and can use local
      models for offline transcription.
    - >
      The product expanded from desktop dictation into synchronized Notes, iOS and Apple
      Watch capture, multilingual recognition, read-only agent integrations, and an
      in-house dictation model.
  related-projects:
    - >
      Monologue integrates with macOS and iOS Shortcuts, Apple Watch, hosted MCP
      clients, local coding agents, a command-line client, public Notes API, and
      webhooks.
    - >
      The application can write into third-party tools such as code editors, chat
      applications, email clients, browsers, and document editors.
  sources:
    - 'Official app documentation: https://www.monologue.to/docs'
    - 'Official changelog: https://www.monologue.to/changelog'
    - >
      Official integration guide:
      https://www.monologue.to/docs/integrations/choose-a-connection
    - 'Official mono-1 announcement: https://www.monologue.to/blog/introducing-mono-1'
    - 'Official product page: https://www.monologue.to/'
    - 'Official public API documentation: https://www.monologue.to/docs/public-api'
  summary:
    - >
      Monologue is an AI-assisted dictation, voice-note, and meeting-transcription
      application for Mac, iPhone, iPad, and Apple Watch, with local transcription and
      developer integration options.
  timeline:
    - >
      2025: The macOS changelog records external automation through the
      monologue://record-dictation URL scheme by August.
    - '2026: Monologue launched on iPhone, iPad, and Apple Watch in February.'
    - >
      2026: Mac and iOS releases added cursor-following indicators, expanded Notes
      workflows, multilingual dictation, tags, and recording recovery.
    - '2026: Monologue introduced mono-1, its in-house dictation model, in September.'
  usage:
    - >
      On Mac, users invoke a shortcut, speak naturally, and let Monologue insert cleaned
      and formatted text into the active application. Per-application modes and custom
      instructions adapt the output for contexts such as code prompts, chat, notes, and
      email.
    - >
      Users can also capture longer voice notes and meetings, then organize and search
      transcripts, summaries, speakers, and tags. Notes can be accessed by agents and
      scripts through read-only MCP, CLI, or public API connections.
    - >
      Local transcription models permit offline processing on Mac, while cloud-backed
      features, cross-device synchronization, and integrations require a Monologue
      account and their applicable permissions.
