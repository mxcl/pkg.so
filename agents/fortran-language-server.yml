id: brew:fortran-language-server
display-name: Fortran Language Server
repo: https://github.com/hansec/fortran-language-server
docs:
  - https://github.com/hansec/fortran-language-server#readme
config-file-location:
  unix:
    - root_dir/.fortls
credentials-file-location: null
history:
  adoption-history:
    - >
      The package entered package-manager culture as a small Python CLI named `fortls`,
      installed directly with `pip install fortran-language-server` and packaged by
      Homebrew, Debian, Ubuntu, and Nix according to the supplied package facts. Its
      significance comes from giving Fortran users the same editor-neutral LSP workflow
      that became standard for newer languages.
  package-nerd-significance:
    - >
      For package maintainers, Fortran Language Server is a classic LSP-era package: a
      small executable, a Python distribution, a project-local dotfile, and many
      downstream editor integrations. It is notable because it helped modernize tooling
      around an older scientific language without requiring each editor to implement its
      own Fortran parser.
  project-history:
    - >
      The project appeared publicly on GitHub in 2017 and was developed around the
      then-new cross-editor Language Server Protocol. Its README described editor
      clients for Atom, Visual Studio Code, Visual Studio, Vim, Neovim, and Emacs, which
      made the package a language-specific server rather than a single-editor plugin.
    - >
      The 1.x changelog shows steady work on Fortran parsing and language-service
      behavior: preprocessing support, rename and implementation requests, Doxygen and
      FORD comment parsing, diagnostics, type-bound procedure handling, and per-project
      configuration in `.fortls`.
  related-projects:
    - >
      The README points to editor clients for Atom, Visual Studio Code, Visual Studio,
      Vim, Neovim, and Emacs. It also relates to FORD and Doxygen through
      documentation-comment parsing, and to the broader Microsoft Language Server
      Protocol ecosystem.
  sources:
    - https://api.github.com/repos/hansec/fortran-language-server
    - https://api.github.com/repos/hansec/fortran-language-server/releases
    - https://github.com/hansec/fortran-language-server
    - https://raw.githubusercontent.com/hansec/fortran-language-server/master/CHANGELOG.md
    - https://raw.githubusercontent.com/hansec/fortran-language-server/master/README.rst
  summary:
    - >
      Fortran Language Server is a Python implementation of the Language Server Protocol
      for Fortran, distributed as the `fortls` command. It brought common IDE features
      such as completion, symbols, hover, go-to-definition, references, rename,
      diagnostics, and code actions to Fortran editors through the LSP model.
  timeline:
    - '2017: GitHub repository created for a Fortran LSP server.'
    - >
      2018: The 1.x release series added project features such as rename, Doxygen/FORD
      comment parsing, and implementation requests.
    - >
      2019: Releases expanded preprocessing, diagnostics, hover, references, and
      workspace behavior.
    - '2020: v1.12.0 added global and per-project diagnostic disabling.'
  usage:
    - >
      Users install the package, configure their editor to launch `fortls`, and
      optionally place a `.fortls` JSON file in the project root to tune diagnostics,
      source directories, preprocessing suffixes, include directories, and debug
      logging.
related-packages:
  - id: brew:fortls
    reason: >
      Choose fortls for the independently maintained successor with additional fixes and
      features; it preserves the same executable name for editor compatibility, so the
      two packages should not be installed simultaneously.
    rel: alternative
    sources:
      - https://github.com/fortran-lang/fortls
      - https://github.com/hansec/fortran-language-server
