history:
  adoption-history:
    - >
      PYM Player has remained a macOS-specific utility, with archived downloads
      extending back to PowerPC Macs. It is distributed as a drag-and-drop application
      and is also available through the Homebrew pym-player cask.
    - >
      Its focus on Polish subtitle encodings and NapiProjekt integration gives it a
      specialized audience rather than positioning it as a general cross-platform
      player.
  package-nerd-significance:
    - >
      PYM Player is an example of long-lived, independently distributed Mac software
      shaped around a regional media ecosystem. It combines FFmpeg playback with Polish
      subtitle discovery, encoding conversion, Finder integration, and a local
      metadata-rich video library.
  project-history:
    - >
      Grzegorz Pawlik created PYM Player in 2005 as a Mac application for watching video
      with subtitles. The official archive preserves releases for PowerPC-era Macs,
      showing continuity across major Apple hardware and operating-system transitions.
    - >
      The eighth major generation replaced MPlayer with FFmpeg/FFplay and rebuilt
      significant playback and subtitle internals. The application remained free while
      adding a media library, metadata retrieval, subtitle conversion, and modern macOS
      interface support.
  related-projects:
    - FFmpeg
    - FFplay
    - NapiProjekt
    - Open Movie Database
  sources:
    - 'Official PYM Player 8 announcement: https://pym.uce.pl/pym-player-8/'
    - 'Official product page and history: https://pym.uce.pl/pym-player/'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      PYM Player is a free macOS video player and media-library application created in
      2005. It emphasizes automatic Polish subtitle discovery, subtitle encoding and
      conversion tools, broad FFmpeg-backed format support, and local movie and series
      organization.
  timeline:
    - '2005: PYM Player was created.'
    - >
      2022: PYM Player 8 was released after replacing MPlayer with FFmpeg as its
      playback engine.
  usage:
    - >
      Users can drag video files onto the application, associate common video formats
      with it, or organize films and series in its local library. PYM Player can fetch
      subtitles from NapiProjekt, detect Polish character encodings, convert subtitle
      formats, and retrieve covers and metadata from the Open Movie Database.
