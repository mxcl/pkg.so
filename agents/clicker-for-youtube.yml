history:
  adoption-history:
    - >
      DBK Labs added Apple Silicon support immediately after the first release and
      subsequently added browser extensions for Chrome, Firefox, and Safari.
    - The application is also distributed through Homebrew Cask as clicker-for-youtube.
  package-nerd-significance:
    - >
      Clicker is an example of a native Swift wrapper that turns a web streaming service
      into a conventional macOS application, complete with Dock, menu-bar, notification,
      media-control, and browser-extension integration. Its cask provides a scriptable
      installation path for an otherwise commercial GUI app.
  project-history:
    - >
      DBK Labs released Clicker for YouTube 1.0 on November 11, 2020. It was positioned
      as a native macOS YouTube client rather than an Electron application.
    - >
      Updates through 2021 added Apple Silicon compatibility, companion browser
      extensions, multiple-account support, and repeated fixes for YouTube and
      ad-blocking changes.
  related-projects:
    - Clicker for YouTube TV
    - Clicker for Netflix
  sources:
    - Input field source_facts.package-manager.
    - 'Official product page: https://www.dbklabs.com/clicker-for-youtube/'
    - >
      Official release notes:
      https://www.dbklabs.com/clicker-for-youtube/appcast/releasenotes.html
    - >
      Official support FAQ:
      https://dbklabs.freshdesk.com/support/solutions/folders/48000675189
  summary:
    - >
      Clicker for YouTube is a commercial, native Swift macOS client that presents
      YouTube in a standalone application with platform integrations such as
      Picture-in-Picture, notifications, Touch Bar controls, and menu-bar access.
  timeline:
    - '2020-11-11: Version 1.0 is released.'
    - '2020-11-14: Version 1.1 adds Apple Silicon support.'
    - '2021-01: Chrome, Firefox, and Safari companion extensions arrive.'
    - '2021-04: Version 1.10 adds multiple-account support.'
  usage:
    - >
      Users sign into YouTube inside the application and use it as a standalone viewer
      or creator interface. It supports video playback, Picture-in-Picture,
      notifications, uploads through YouTube Studio, a sleep timer, and browser
      extensions that redirect YouTube links into the app.
