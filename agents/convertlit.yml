id: brew:convertlit
display-name: Convert LIT
repo: null
docs:
  - http://www.convertlit.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Although upstream is a static HTTP-era project site, package managers kept Convert
      LIT useful for Unix users who needed the source build. The input package facts
      list Homebrew, MacPorts, Nix, and Arch packaging; Homebrew now marks the formula
      deprecated because the upstream is not available via HTTPS.
  package-nerd-significance:
    - >
      Convert LIT is package-manager archaeology: a small GPL command-line converter for
      an obsolete Microsoft ebook format, still carried by Unix package collections
      because source builds made the tool portable beyond its original Windows audience.
  project-history:
    - >
      The official site distributed Convert LIT as a Windows binary and as GPL source
      code for the `clit` command and its associated library. Version 1.8 was announced
      on 2004-07-04, with the site also retaining older 1.5 downloads and a 1.4 link for
      historical Windows 98 compatibility.
  related-projects:
    - >
      Convert LIT is tied to Microsoft Reader `.lit` files and Open eBook/OEBPS output
      rather than to a maintained source-control repository.
  sources:
    - http://www.convertlit.com/
    - http://www.convertlit.com/download.php
    - http://www.convertlit.com/faq.php
    - http://www.convertlit.com/legal.php
    - https://formulae.brew.sh/formula/convertlit
  summary:
    - >
      Convert LIT is an older ebook conversion utility for Microsoft Reader `.lit`
      files, intended to convert that format into an open format for readers and devices
      that cannot directly use Microsoft Reader.
  timeline:
    - '2004-07-04: Convert LIT 1.8 released.'
    - '2004-09-25: Official site noted a third-party GUI and a Mac OS X 10.3.5 binary.'
    - >
      2026-01-05: Homebrew marked the formula deprecated for HTTP-only upstream, with
      disable date 2027-01-05.
  usage:
    - >
      The FAQ documents command-prompt use of `clit` and explains that the output path
      is Open eBook/OEBPS rather than a dedicated modern ebook format. The official
      download page also warns that legal treatment depends on local copy-control laws
      and frames use as fair-use conversion of already purchased ebooks.
related-packages:
  - id: cask:calibre
    reason: >
      Choose calibre when you want maintained LIT input support within a broader ebook
      library and conversion suite offering both graphical and command-line workflows.
    rel: alternative
    sources:
      - http://www.convertlit.com/
      - https://manual.calibre-ebook.com/en/generated/en/ebook-convert.html
