id: brew:cdi
display-name: CDI
repo: https://gitlab.dkrz.de/mpim-sw/libcdi
docs:
  - https://code.mpimet.mpg.de/projects/cdi/embedded/index.html
  - https://code.mpimet.mpg.de/projects/cdi/wiki
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CDI appears as a specialized scientific package rather than a general CLI utility.
      Its official wiki lists software that uses CDI, including Climate Data Operators,
      ECHAM, MPIOM, ICON, afterburner, and MATLAB-CDI. Homebrew packaging gives macOS
      and Linux package-manager users access to the cdi executable and library.
  package-nerd-significance:
    - >
      CDI is interesting in package-manager terms because it packages domain
      infrastructure from climate modeling: a format abstraction layer used by larger
      tools such as CDO and model workflows, not a standalone consumer application. Its
      value is in making scientific data formats available through distro and Homebrew
      dependency graphs.
  project-history:
    - >
      The official MPI-M Redmine overview and wiki describe CDI as a C and Fortran
      interface to access Climate and NWP model data. The embedded C manual identifies
      Uwe Schulzweida of the Max Planck Institute for Meteorology as the author and
      documents CDI C manual version 1.9.9 from October 2020.
    - >
      The project news on the official overview shows recent release cadence: version
      2.0.0 in 2021, 2.1.0 in 2022, 2.2.0 and 2.3.0 in 2023, and 2.4.0 in 2024.
  related-projects:
    - >
      The official wiki lists CDO, ECHAM, MPIOM, ICON, afterburner, and MATLAB-CDI as
      software using CDI.
  sources:
    - https://code.mpimet.mpg.de/projects/cdi
    - https://code.mpimet.mpg.de/projects/cdi/embedded/index.html
    - https://code.mpimet.mpg.de/projects/cdi/wiki
    - https://formulae.brew.sh/api/formula/cdi.json
  summary:
    - >
      CDI, the Climate Data Interface, is a C and Fortran library for accessing climate
      and numerical weather prediction model data in formats such as GRIB, netCDF,
      SERVICE, EXTRA, and IEG.
  timeline:
    - '2020-10: Embedded C manual version 1.9.9 published.'
    - '2021-10-11: Version 2.0.0 release news posted.'
    - '2022-10-07: Version 2.1.0 release news posted.'
    - '2023-07-13: Version 2.2.0 release news posted.'
    - '2023-10-20: Version 2.3.0 release news posted.'
    - '2024-02-21: Version 2.4.0 release news posted.'
  usage:
    - >
      CDI is used by climate and meteorology software to read, write, and transform
      model-data streams across GRIB, netCDF, SERVICE, EXTRA, and IEG formats. The
      manuals cover C and Fortran bindings, file formats, stream APIs, and
      compiling/linking with the CDI library.
related-packages:
  - id: brew:cdo
    reason: >
      CDO is the primary user-facing command-line companion: its operators use CDI to
      process the same GRIB, netCDF, SERVICE, EXTRA, and IEG datasets.
    rel: adjacent_workflow
    sources:
      - https://code.mpimet.mpg.de/projects/cdi/wiki
      - https://code.mpimet.mpg.de/projects/cdo
  - id: brew:eccodes
    reason: >
      Install ecCodes alongside CDI when applications need CDI's documented GRIB2
      encoding and decoding support.
    rel: adjacent_workflow
    sources:
      - https://code.mpimet.mpg.de/projects/cdi/embedded/index.html
      - https://confluence.ecmwf.int/display/ECC
  - id: brew:netcdf
    reason: >
      Install netCDF alongside CDI when applications need CDI's documented netCDF
      read-and-write support.
    rel: adjacent_workflow
    sources:
      - https://code.mpimet.mpg.de/projects/cdi/embedded/index.html
      - https://docs.unidata.ucar.edu/netcdf-c/current
