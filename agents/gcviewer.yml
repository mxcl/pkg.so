config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GCViewer fits the Java operations era in which verbose GC logs were exchanged as
      files and interpreted offline. The changelog shows maintenance following JVM
      logging changes: G1 work in the 1.31 series, Maven Central publication in 1.33,
      command-line image/report generation, Java 8 updates, unified logging, Shenandoah,
      ZGC, and a 2026 update for newer parser cases.
  package-nerd-significance:
    - >
      GCViewer is notable because it packages years of JVM log-format drift into one
      small desktop-and-CLI artifact. It preserves support for vendor-era Java logs
      while continuing to parse newer OpenJDK unified logging, which is exactly the kind
      of compatibility surface package maintainers care about.
  project-history:
    - >
      The current repository is a fork of tagtraum industries' GCViewer. Its GitHub
      metadata says tagtraum development stopped in 2008 and that this fork aimed to
      improve support for Sun/Oracle Java 1.6 and later garbage-collector logs,
      including G1. The README credits Hendrik Schreiber for GCViewer up to 1.29.
  related-projects:
    - The original tagtraum GCViewer is the direct predecessor named by the project.
    - >
      Sun/Oracle HotSpot, OpenJDK, IBM JVM, HP-UX JVM, and BEA JRockit logs are
      supported input families.
    - gchisto is referenced by the changelog as a related simple-GC-log export target.
  sources:
    - https://api.github.com/repos/chewiebug/GCViewer
    - https://api.github.com/repos/chewiebug/GCViewer/releases
    - https://github.com/chewiebug/GCViewer
    - https://github.com/chewiebug/GCViewer/wiki
    - https://raw.githubusercontent.com/chewiebug/GCViewer/master/README.md
    - https://raw.githubusercontent.com/wiki/chewiebug/GCViewer/Changelog.md
  summary:
    - >
      GCViewer is a Java tool for visualizing and summarizing garbage-collection logs.
      It covers historical and modern JVM log formats from Sun/Oracle, IBM, HP, and BEA,
      and can be used either as a GUI application or from the command line.
  timeline:
    - '2008: Repository metadata says tagtraum development had stopped.'
    - '2011: GitHub records the chewiebug GCViewer repository creation.'
    - '2012: The 1.31 series adds G1 parser work and OS X bundle support.'
    - '2013: GCViewer 1.33 publishes to Maven Central and adds command-line image generation.'
    - '2019: GCViewer 1.36 adds unified logging support, Shenandoah, ZGC, and Go GC logging.'
    - '2026: GCViewer 1.37 is released with parser and UI updates.'
  usage:
    - >
      Users open or pass GC log files to GCViewer, then inspect charts, pause summaries,
      heap metrics, parser warnings, and exported summaries. The command-line mode can
      generate CSV-style reports and optional chart images, making it useful in scripted
      JVM performance investigations.
related-packages:
  - id: cask:visualvm
    reason: >
      Choose VisualVM and its Visual GC plugin for live attachment, JVM monitoring, and
      broader profiling; choose GCViewer when the primary artifact is an existing
      garbage-collection log that must be analyzed offline or scripted into a report.
    rel: alternative
    sources:
      - https://github.com/chewiebug/GCViewer#readme
      - https://visualvm.github.io/
      - https://visualvm.github.io/plugins.html
