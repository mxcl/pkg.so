credentials-file-location: null
history:
  adoption-history:
    - >
      LaTeXiT has remained useful in macOS scientific and academic workflows by
      supporting a wide range of system releases and relying on the user's independently
      installed TeX distribution.
    - >
      Localization contributions, equation libraries, macOS Services, Automator support,
      and multiple export formats broadened it beyond a one-shot equation renderer.
      Apple Silicon support arrived in the 2.16 series.
  package-nerd-significance:
    - >
      LaTeXiT is a classic macOS companion to TeX distributions: it keeps the
      heavyweight typesetting engine separate while providing a small native interface
      for producing equations that can be dropped into presentations, word processors,
      and graphics applications.
    - >
      It preserves LaTeX source inside compatible exported equations, allowing later
      round trips back into the editor. Its use of Core Data and publicly documented
      data model also makes equation histories and libraries potentially interoperable.
    - >
      For Homebrew users, installing LaTeXiT as a cask pairs naturally with a separately
      managed MacTeX or other TeX installation.
  project-history:
    - >
      Pierre Chatelier created LaTeXiT to remove the repetitive work of creating a TeX
      file, compiling it, cropping the result, inserting it elsewhere, and repeating
      those steps after edits.
    - >
      The application developed into a native equation editor with syntax coloring,
      templates, configurable engines and scripts, equation history and libraries, macOS
      Services and Automator integration, and exports including PDF, MathML, SVG, and
      bitmap formats.
    - >
      LaTeXiT is open source under the CeCILL license. The official project distributes
      source archives alongside application releases, but does not identify an official
      hosted source-control repository.
  related-projects:
    - >
      A separately installed LaTeX distribution such as MacTeX supplies the typesetting
      engine; LaTeXiT does not bundle one.
    - >
      LinkBack enables supported host applications to reopen and update embedded LaTeXiT
      equations.
    - Ghostscript, pdf2svg, and pdftocairo support particular conversion and export workflows.
  sources:
    - https://www.chachatelier.fr/latexit/downloads/latexit-changelog-en.html
    - https://www.chachatelier.fr/latexit/latexit-downloads.php?lang=en
    - https://www.chachatelier.fr/latexit/latexit-faq.php?lang=en
    - https://www.chachatelier.fr/latexit/latexit-features.php?lang=en
    - https://www.chachatelier.fr/latexit/latexit-home.php?lang=en
  summary:
    - >
      LaTeXiT is Pierre Chatelier's native macOS graphical equation editor and front end
      for an independently installed LaTeX engine.
  timeline:
    - '2010: The 2.1 series refined exporting, updates, and LinkBack compatibility.'
    - '2012: Version 2.5 introduced a new history and library data model.'
    - '2015: Version 2.8 added history search and TeX-source library export.'
    - '2018: Version 2.12 added macOS Mojave Dark Mode support.'
    - '2021: Version 2.16 added Apple Silicon support and a LaTeXiT app extension.'
    - >
      2023: Version 2.16.6 added opening of TikZ and TeX files and additional SVG
      handling fixes.
  usage:
    - >
      Users enter an equation, select a LaTeX mode and engine, typeset it, and drag or
      export the cropped result into another application. PDF is the default, with
      image, MathML, and SVG options also available.
    - >
      Compatible exports retain their LaTeX source for later reopening. Frequently used
      equations can be retrieved from automatic history or organized into user-managed
      libraries.
    - >
      LaTeXiT requires a working external TeX installation. Engine paths and advanced
      scripts can be adjusted in the application's preferences.
