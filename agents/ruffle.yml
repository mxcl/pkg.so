credentials-file-location: null
history:
  adoption-history:
    - >
      Ruffle became available as a desktop player, a browser extension and an embeddable
      WebAssembly player. This let individual users open local SWF files while website
      operators could restore Flash content without requiring Adobe's retired plug-in.
    - >
      The project publishes nightly builds and packages its web player for self-hosting.
      Its repository also documents installation from the project's Homebrew tap, while
      the reviewed record represents the separate Homebrew cask.
  package-nerd-significance:
    - >
      Ruffle is a prominent preservation-oriented replacement for a discontinued
      proprietary runtime. Its Rust and WebAssembly implementation makes the same
      emulator useful as a native desktop package, a browser extension and a web
      dependency.
    - >
      For packagers, Ruffle is interesting because it combines a fast-moving
      compatibility project, nightly artifacts and multiple delivery forms while
      avoiding bundling the original Adobe runtime.
  project-history:
    - >
      Ruffle began as a clean-room Adobe Flash Player emulator written in Rust,
      targeting native desktops and browsers through WebAssembly. Early development
      concentrated on parsing SWF files and executing older ActionScript content.
    - >
      By 2020 the maintainers were preparing an initial alpha and formal release process
      covering desktop binaries, browser extensions and web packages. Development
      continued toward broader ActionScript 1, 2 and 3 compatibility.
    - >
      After browser support for the original Flash Player ended, Ruffle's desktop and
      web forms provided a route for running and preserving SWF content without the
      obsolete Adobe plug-in.
  related-projects:
    - Adobe Flash Player, the proprietary runtime whose content Ruffle reimplements.
    - >
      Rust and WebAssembly, the primary technologies behind Ruffle's native and browser
      targets.
    - Lightspark, another open-source Flash Player implementation.
  sources:
    - https://github.com/ruffle-rs/ruffle
    - https://github.com/ruffle-rs/ruffle/blob/master/desktop/src/cli.rs
    - https://github.com/ruffle-rs/ruffle/issues/575
    - https://github.com/ruffle-rs/ruffle/issues/9
    - https://ruffle.rs/
  summary:
    - >
      Ruffle is an open-source Adobe Flash Player emulator written in Rust, available
      for desktop systems and the web.
  timeline:
    - '2019: Early public development tracked ActionScript 2 and 3 support.'
    - >
      2020: Maintainers began preparing the first alpha release and a multi-platform
      release process.
    - >
      Later releases expanded distribution across desktop applications, browser
      extensions and self-hosted web packages.
  usage:
    - >
      Desktop users can open a SWF file through the application or pass its path on the
      command line. Ruffle also exposes command-line controls for rendering, storage,
      networking and player behavior.
    - >
      Website operators can embed the self-hosted WebAssembly build or use the browser
      extension. Compatibility is substantial but incomplete, so some ActionScript
      content may still behave differently from the original Flash Player.
