history:
  adoption-history:
    - >
      Overlayed addresses users whom Discord's native game overlay does not serve,
      particularly macOS and Linux users and people who need voice status outside a
      supported game. Official distribution instructions cover Homebrew on macOS, Winget
      on Windows, and Flathub on Linux.
  package-nerd-significance:
    - >
      Overlayed is a cross-platform desktop utility distributed through three distinct
      desktop package ecosystems while sharing a Tauri-based codebase. It is a useful
      example of package managers carrying the same graphical application across macOS,
      Windows, and Linux.
  project-history:
    - >
      Overlayed was created to provide an out-of-game, cross-platform Discord voice
      overlay. Its author cites the absence of an official general-purpose Discord
      overlay and the Windows-only, game-specific limits of Discord's native overlay as
      the motivation.
    - >
      The application uses Discord's local RPC interface to receive voice-channel
      events. It is developed in public as a Tauri application and provides installation
      paths for macOS, Windows, and Linux.
  related-projects:
    - >
      Overlayed interoperates with the Discord desktop client through Discord RPC but is
      independent from and not endorsed by Discord.
    - >
      Its official Minecraft guide recommends borderless-window modifications on Windows
      and Linux when a game lacks suitable borderless fullscreen behavior.
  sources:
    - https://github.com/overlayeddev/overlayed#readme
    - https://overlayed.dev/
    - https://overlayed.dev/about
    - https://overlayed.dev/blog/discord-overlay-for-minecraft
    - https://overlayed.dev/blog/installation-guide
  summary:
    - >
      Overlayed is an open-source, cross-platform overlay that shows speaking, mute, and
      deaf status for the current Discord voice channel.
  timeline:
    - 'February 2024: Overlayed published its all-platform installation guide.'
    - >
      October 2024: The project published an official guide for using Overlayed with
      Minecraft.
  usage:
    - >
      Users run Discord and Overlayed together, join a voice channel, position the
      transparent overlay, and pin it above a game or other application. Borderless
      fullscreen mode may be required for some Windows and Linux games.
