id: brew:barman
display-name: Barman
repo: https://github.com/EnterpriseDB/barman
docs:
  - https://docs.pgbarman.org/release/3.12.0/user_guide/configuration.html
  - >
    https://www.enterprisedb.com/docs/supported-open-source/barman/single-server-streaming/step02-backup-setup
config-file-location:
  unix:
    - /etc/barman.conf
    - ~/.barman.conf
    - /etc/barman.d/*.conf
credentials-file-location:
  unix:
    - ~/.pgpass
history:
  adoption-history:
    - >
      Barman is adopted by PostgreSQL operators who need backup catalogs, retention
      policies, WAL management, and recoverable physical backups outside the database
      server itself. Its presence in Linux distributions, Homebrew, MacPorts, Nix,
      PyPI-linked docs, and EnterpriseDB documentation reflects use by both community
      and commercial PostgreSQL users.
  package-nerd-significance:
    - >
      Barman is package-nerd significant because it bridges PostgreSQL internals and
      system packaging: executable families for local and cloud backup, configuration
      directories, Python dependencies, PostgreSQL client tooling, and credential
      conventions all have to line up for reliable recovery.
  project-history:
    - >
      The upstream README identifies Barman as a disaster-recovery tool for PostgreSQL
      servers, maintained by EnterpriseDB under GPL-3.0-or-later. It also records that
      the GitHub repository became the new home starting with version 2.13, replacing
      the legacy SourceForge repository.
    - >
      Barman's documentation presents it as a tool for managing backups of multiple
      PostgreSQL servers in business-critical environments. Over time it has added
      streaming backup modes, WAL archiving helpers, cloud commands, snapshot support,
      export/import workflows, and restore features.
  related-projects:
    - >
      Barman works with PostgreSQL server tools and concepts such as pg_basebackup,
      pg_receivewal, WAL archiving, archive_command, restore_command, rsync, SSH, object
      storage, and .pgpass credentials.
  sources:
    - https://docs.pgbarman.org/release/3.12.0/user_guide/configuration.html
    - https://docs.pgbarman.org/release/3.19.1/user_guide/
    - https://github.com/EnterpriseDB/barman/blob/master/README.rst
    - https://github.com/EnterpriseDB/barman/blob/master/RELNOTES.md
    - source_facts.package-manager
  summary:
    - >
      Barman is EnterpriseDB's open-source Backup and Recovery Manager for PostgreSQL, a
      Python administration tool for physical backups, WAL archiving, point-in-time
      recovery, and cloud backup workflows.
  timeline:
    - '2011: EnterpriseDB copyright history begins for Barman.'
    - >
      Version 2.13: GitHub becomes the new upstream home, replacing the legacy
      SourceForge repository.
    - >
      2024: Barman 3.12.0 continues the 3.x line with documented configuration and
      recovery workflows.
    - >
      2026: Barman 3.19 adds and fixes cloud backup restore, cloud WAL restore,
      export/import, and parallel WAL-related behavior.
  usage:
    - >
      A typical Barman setup defines global and per-server configuration in barman.conf
      or barman.d snippets, grants PostgreSQL access using credentials such as .pgpass,
      archives WAL files with barman-wal-archive or streaming, and restores backups
      through barman restore or cloud restore commands.
related-packages:
  - id: brew:libpq
    reason: >
      Install libpq alongside Barman when a workstation or backup host needs PostgreSQL
      client utilities such as pg_basebackup and psql without a locally managed
      PostgreSQL server.
    rel: adjacent_workflow
    sources:
      - https://docs.pgbarman.org/release/3.20.0/user_guide/installation.html
      - https://www.postgresql.org/docs/current/app-pgbasebackup.html
tags:
  - backup
  - cli
  - postgresql
  - recovery
  - wal
