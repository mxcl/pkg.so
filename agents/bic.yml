id: brew:bic
display-name: bic
repo: null
docs:
  - https://github.com/hexagonal-sun/bic#readme
config-file-location:
  unix:
    - ~/.bic
credentials-file-location: null
history:
  adoption-history:
    - >
      bic remains a niche developer tool, but Homebrew and Nix packaging make it easy to
      install as a command-line REPL for systems programmers who want to poke at C
      libraries interactively.
    - >
      The README also documents Docker and Arch Linux AUR installation paths, showing
      adoption in lightweight developer experimentation workflows rather than mainstream
      language-runtime distribution.
  package-nerd-significance:
    - >
      bic is package-nerd interesting as a compact C REPL built from classic Unix
      development pieces: readline for interaction, flex/bison/autotools for building,
      GMP and libffi for runtime behavior, and a single-user dotfile for startup state.
    - >
      It occupies the practical gap between compiling throwaway C programs and using a
      full debugger or notebook-style environment.
  project-history:
    - >
      The public GitHub repository begins with an initial commit in July 2015, and
      release metadata records v0.9.1 in October 2019 followed by a first stable v1.0.0
      release in February 2020.
    - >
      The README describes bic as a tool for exploring and testing C APIs using a
      read-eval-print loop, with runtime dependencies on GNU Readline, GNU MP, and
      libffi.
  related-projects:
    - GNU Readline provides the interactive command-line editing layer used by bic.
    - libffi is part of bic's runtime dependency stack for calling C APIs dynamically.
    - Flex, Bison, Automake, and Autoconf are part of the documented build toolchain.
  sources:
    - https://api.github.com/repos/hexagonal-sun/bic/commits?per_page=1&page=889
    - https://api.github.com/repos/hexagonal-sun/bic/releases
    - https://github.com/hexagonal-sun/bic/blob/master/README.org
    - https://github.com/hexagonal-sun/bic/blob/master/configure.ac
  summary:
    - >
      bic is a C interpreter and API explorer that lets developers experiment with C
      APIs through a REPL and evaluate C source files.
  timeline:
    - '2015-07-16: Initial public GitHub commit.'
    - '2019-10-03: v0.9.1 release is published.'
    - '2020-02-19: v1.0.0 is published as the first stable release.'
  usage:
    - >
      Running bic with no arguments opens a BIC> prompt where users can include system
      headers, declare variables, call C library functions, and inspect types or values
      with special REPL syntax.
    - >
      The ~/.bic startup file is evaluated when the REPL starts, and source files can be
      evaluated with -s so that a C main function receives argc and argv.
related-packages:
  - id: brew:cling
    reason: >
      Choose Cling for a Clang/LLVM-backed, JIT-compiled C++ REPL and ROOT workflows;
      choose bic for a smaller C-focused REPL aimed at inspecting native APIs.
    rel: alternative
    sources:
      - https://github.com/hexagonal-sun/bic/blob/master/README.org
      - https://root.cern/cling/
  - id: brew:picoc
    reason: >
      Choose PicoC when embedding a very small C-like scripting engine in constrained or
      robotic software; choose bic for an interactive developer REPL that explores
      installed C headers and libraries.
    rel: alternative
    sources:
      - https://github.com/hexagonal-sun/bic/blob/master/README.org
      - https://gitlab.com/zsaleeba/picoc/-/blob/master/README
