id: brew:bash_unit
display-name: bash_unit
repo: null
docs:
  - https://github.com/bash-unit/bash_unit#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bash_unit adoption is concentrated among shell-script projects that want tests but
      do not need Bats or a cross-language test framework. The batch input shows
      Homebrew, Debian, and Nix packages, which is enough distribution coverage to make
      it a repeatable dependency in developer workstations and CI images.
  package-nerd-significance:
    - >
      bash_unit matters mostly as part of the Bash testing ecosystem. Package nerds care
      because shell code is everywhere, but many shell projects historically had little
      test structure; a small packaged runner lowers the friction without introducing a
      language runtime beyond Bash itself.
    - >
      It also sits in the interesting overlap between package infrastructure and package
      contents: many packages are built by shell scripts, and tools like bash_unit help
      test that glue code.
  project-history:
    - >
      The official executable identifies itself as a Bash unit testing framework and
      carries Pascal Grange copyright years 2011-2016. Its source points to the official
      `bash-unit/bash_unit` repository and currently declares version v2.3.3.
    - >
      The repository tag list starts at v0.0.1 and progresses through v1.x and v2.x
      releases, showing a long-maintained single-purpose shell testing tool rather than
      a recent wrapper around a larger framework.
  related-projects:
    - >
      Related Bash and shell test tools include Bats, shunit2, ShellSpec, ShellCheck,
      and shfmt. bash_unit occupies the minimal unit-test-runner lane among those tools.
  sources:
    - >
      Official `bash_unit` executable identifies the framework, copyright years
      2011-2016, repository URL, and version v2.3.3.
    - Official tags list shows v0.0.1 through v2.3.3 release tags.
    - input.source_facts.package-manager lists Homebrew, Debian, and Nix packaging.
  summary:
    - >
      bash_unit is a Bash unit-testing framework. It is intentionally small: an
      installable shell test runner for projects that want assertions and test discovery
      without leaving Bash.
  timeline:
    - "2011: Copyright header begins for bash_unit's main executable."
    - '2010s: Tag series begins at v0.0.1 and reaches v1.x.'
    - '2020s: v2.x release series continues through v2.3.3.'
    - '2020s: Homebrew, Debian, and Nix package the runner.'
  usage:
    - >
      Users write Bash test functions and run them with the `bash_unit` executable. The
      tool provides assertions, colored reporting, failure output, and a small runtime
      that remains close to plain shell code.
related-packages:
  - id: brew:bats-core
    reason: >
      Bats Core is a TAP-compliant alternative with dedicated `.bats` syntax and broad
      support for testing both Bash code and arbitrary Unix programs.
    rel: alternative
    sources:
      - https://bats-core.readthedocs.io/en/stable/
      - https://github.com/bash-unit/bash_unit
  - id: brew:shunit2
    reason: >
      shUnit2 is an xUnit-style alternative designed for Bourne-family shells, making it
      useful when tests must run under shells other than Bash.
    rel: alternative
    sources:
      - https://github.com/kward/shunit2
      - https://github.com/bash-unit/bash_unit
  - id: brew:shellcheck
    reason: >
      ShellCheck complements bash_unit's runtime assertions with static analysis for
      defects and portability problems that a test suite may not execute.
    rel: adjacent_workflow
    sources:
      - https://www.shellcheck.net/
      - https://github.com/bash-unit/bash_unit
  - id: brew:shfmt
    reason: >
      shfmt complements bash_unit by consistently formatting Bash test files and can
      enforce formatting through CI or pre-commit workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/mvdan/sh
      - https://github.com/bash-unit/bash_unit
tags:
