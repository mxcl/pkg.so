id: cask:embyserver
display-name: Emby Server
repo: null
docs:
  - https://emby.media/support/index.html
config-file-location:
  linux:
    - /var/lib/emby/config/system.xml
  macos:
    - ~/emby-server/config/system.xml
    - ~/.config/emby-server/config/system.xml
  windows:
    - '%APPDATA%\Emby-Server\programdata\config\system.xml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The 2015 renaming announcement described an existing presence across app stores
      and an expanding client ecosystem. Emby's distribution across computers, NAS
      devices, and playback applications supports household media-server use; these
      sources do not establish adoption counts.
  package-nerd-significance:
    - >
      Emby illustrates the separation between an installed server, its persistent
      configuration and media library, and independently distributed playback clients.
      Its Media Browser ancestry also explains historical naming that survives around
      the project.
  project-history:
    - >
      Emby previously operated as Media Browser. In March 2015, the project announced
      the Emby name as it expanded beyond the associations of its original name; the
      pronunciation deliberately retained a connection to the initials MB.
  related-projects:
    - "Media Browser: the project's former name."
  sources:
    - '[Introducing Emby](https://emby.tv/introducing-emby.html).'
    - '[Official product overview](https://emby.media/).'
  summary:
    - >
      Emby Server organizes a personal collection of video, music, photos, and live
      television for playback through connected applications.
  timeline:
    - '2015: Media Browser announces its transition to the Emby name.'
  usage:
    - >
      Install the server on a computer or NAS, add media folders, and connect playback
      applications. Separate users can receive individual access rules and parental
      controls.
tags:
  - live-tv
  - media-server
  - music
