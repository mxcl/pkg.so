  docs-sources:
    - >
      Config paths: medium confidence; combine the documented [platform data
      directories](https://emby.media/support/articles/Server-Data-Folder.html) with the
      Emby administrator's documented [config/system.xml
      location](https://emby.media/community/topic/40388-cant-access-control-panel/).
      Actual data directory is visible through Dashboard → Get Server Info.
    - >
      Credentials location: low confidence; no credential-file path verified in the
      official documentation reviewed.
    - '[Official documentation](https://emby.media/support/index.html).'
  history-sources:
