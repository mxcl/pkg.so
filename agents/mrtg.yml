history:
  adoption-history:
    - >
      In operation MRTG polls SNMP counters or external command output, logs the values,
      and generates HTML pages with PNG graphs for day, week, month, and year views. It
      keeps constant-size log files through data consolidation, supports SNMPv2c 64-bit
      counters, can identify interfaces by IP address, description, or Ethernet address,
      and has hooks for RRDtool when performance demands it. Although it began with
      router interfaces, the documentation explicitly notes monitoring arbitrary SNMP
      variables or command outputs such as system load, login sessions, modem
      availability, and similar integer-valued metrics.
  project-history:
    - >
      A major technical milestone came in January 1996 after Dave Rand investigated
      MRTG's speed. Oetiker's history says Rand rewrote the time-critical parts in C,
      producing about a forty-fold speedup and prompting renewed development of MRTG 2.
      The resulting architecture paired Perl-based polling and configuration with fast C
      routines for logging and graph generation.
  sources:
    - https://formulae.brew.sh/formula/mrtg
    - https://oss.oetiker.ch/mrtg/doc/mrtg.en.html
    - https://www.usenix.org/legacy/event/lisa98/full_papers/oetiker/oetiker.pdf
  summary:
    - >
      MRTG, the Multi Router Traffic Grapher, is Tobias Oetiker's classic
      network-traffic graphing tool, co-authored with Dave Rand. Oetiker's project
      documentation traces its origin to 1994, when he needed to show how a 64 kbit
      Internet link was performing and wrote a quick web graphing hack. That hack
      evolved into the configurable Perl script MRTG 1.0, released in spring 1995.
  usage:
    - >
      MRTG's package-manager niche is old but durable network monitoring. It predates
      many web-dashboard monitoring stacks and remains useful where static HTML graphs,
      cron or daemon polling, SNMP, and simple deployment are enough. Related tools such
      as RRDtool, Munin, and Cacti cover broader graphing or dashboard workflows, while
      MRTG retains the direct router-traffic-grapher identity in Unix and macOS
      packaging.
related-packages:
  - id: brew:rrdtool
    reason: >
      Use RRDtool as MRTG's documented alternative logging and graphing backend when you
      need round-robin databases, improved performance, or more flexible graph
      generation.
    rel: adjacent_workflow
    sources:
      - https://oss.oetiker.ch/mrtg/doc/mrtg-rrd.en.html
      - https://oss.oetiker.ch/rrdtool/
