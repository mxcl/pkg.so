history:
  adoption-history:
    - >
      Kona's audience is smaller than mainstream language runtimes but unusually
      durable: array-language enthusiasts, performance-oriented programmers, and people
      studying the K/KDB+ ecosystem use it as a source-available route into a language
      family that otherwise has limited public implementation material.
  package-nerd-significance:
    - >
      Kona is package-nerd significant because it preserves access to an older K dialect
      in source form. It also exposes the famously terse C implementation style
      associated with the K tradition, which makes it a cultural artifact as much as a
      language runtime.
  project-history:
    - >
      The repository was created on 2010-08-25. Its README explains that Kona targets
      k3, describes K as a synthesis of APL and Lisp, and says Kona is unaffiliated with
      Kx. The README also places k3 in the lineage of k1, k2, k3, k4, q, KDB, and KDB+.
  related-projects:
    - >
      Kona is related to APL, Lisp, K, k3, k4, q, KDB, KDB+, Kx Systems, and other open
      K-family implementations documented by the K community.
  sources:
    - https://api.github.com/repos/kevinlawler/kona
    - https://github.com/kevinlawler/kona
    - https://github.com/kevinlawler/kona/releases/tag/Win.3.06-32
    - https://github.com/kevinlawler/kona/wiki
    - https://ngn.bitbucket.io/k.html
    - https://raw.githubusercontent.com/kevinlawler/kona/master/README.md
  summary:
    - >
      Kona is an open-source implementation of the k3 programming language, one member
      of the K family associated with Arthur Whitney and Kx Systems. It gives Unix
      package managers a buildable, inspectable implementation of a historically
      proprietary array language lineage.
  timeline:
    - '2010-08-25: GitHub repository created.'
    - '2014-09-24: Win.3.06-32 release published.'
    - '2014-08-24: W3.08-64 tag created.'
  usage:
    - >
      The Homebrew package installs the `k` executable, making the interpreter
      accessible from a shell. The project is mainly used interactively and for studying
      K idioms rather than as a broad application platform.
