id: brew:cycode
display-name: Cycode CLI
repo: https://github.com/cycodehq/cycode-cli
docs:
  - https://github.com/cycodehq/cycode-cli#readme
config-file-location:
  unix:
    - ~/.cycode/config.yaml
    - ./.cycode/config.yaml
credentials-file-location:
  unix:
    - ~/.cycode/credentials.yaml
history:
  adoption-history:
    - >
      Official installation paths include PyPI, Homebrew, and GitHub Releases, which
      lets teams choose between Python packaging, macOS package management, and
      standalone executables. The README also documents pre-commit integration, making
      the CLI part of developer workflow rather than only a central CI scanner.
  package-nerd-significance:
    - >
      For package maintainers, Cycode CLI is a security SaaS client with real local
      state: packaging needs to expose the cycode executable cleanly while leaving
      credentials, service URLs, and ignore-rule config in user- or project-owned YAML
      files.
  project-history:
    - >
      The cycode-cli repository was created in July 2022 and published early releases
      later that year. Its README has grown from a scanner guide into a broader
      command-line manual covering authentication, configuration, pre-commit and
      pre-push hooks, repository and path scans, SBOM reports, and an experimental MCP
      server.
  related-projects:
    - >
      The CLI integrates with pre-commit and with Cycode's hosted service through client
      credentials, OIDC tokens, and Cycode API and app URLs.
  sources:
    - https://github.com/cycodehq/cycode-cli/blob/main/README.md
    - https://api.github.com/repos/cycodehq/cycode-cli
    - https://github.com/cycodehq/cycode-cli/releases
    - https://formulae.brew.sh/formula/cycode
  summary:
    - >
      Cycode CLI is a local and CI-oriented security scanner for Cycode users, covering
      secrets, infrastructure-as-code misconfigurations, SCA vulnerabilities, and SAST
      findings.
  timeline:
    - '2022: Repository created and early 0.1.x releases published.'
    - '2023: 0.2.x releases continued the CLI line.'
    - >
      2026: 3.x releases remained active with scanner and workflow features documented
      in the README.
  usage:
    - >
      Users authenticate with cycode auth, cycode configure, or environment variables,
      then run scans over repositories, paths, commit history, pre-commit, or pre-push
      contexts. The CLI stores global credentials and URLs under the user's .cycode
      directory and local ignore rules in .cycode/config.yaml where scans are run.
related-packages:
  - id: brew:pre-commit
    reason: >
      Use pre-commit with Cycode CLI to run documented secrets, SCA, and SAST hooks
      automatically before commits or pushes.
    rel: adjacent_workflow
    sources:
      - https://github.com/cycodehq/cycode-cli#install-pre-commit-hook
      - https://pre-commit.com/
  - id: brew:trivy
    reason: >
      Choose Trivy as a fully open-source alternative when repository, filesystem,
      image, or Kubernetes scanning is more important than integration with the Cycode
      platform; its repository scanner covers vulnerabilities, secrets,
      misconfigurations, licenses, and SBOM generation.
    rel: alternative
    sources:
      - https://github.com/cycodehq/cycode-cli#readme
      - https://www.trivy.dev/docs/latest/guide/target/repository/
