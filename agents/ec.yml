id: brew:ec
display-name: ec (easy-conflict)
repo: null
docs:
  - https://github.com/chojs23/ec#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/ec/themes.json
    - ~/.config/ec/themes.json
  macos:
    - $XDG_CONFIG_HOME/ec/themes.json
    - ~/Library/Application Support/ec/themes.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README documents Homebrew, npm, Nix, Go install, shell installer,
      AUR, and Windows binary installation paths. That is the adoption story so far: a
      new developer tool trying to meet users through common workstation package
      channels rather than only source builds.
  package-nerd-significance:
    - >
      ec is interesting to package nerds because it is a modern, single-purpose terminal
      UI for an old Git pain point. It sits near lazygit, Neovim, Git mergetool, and
      Jujutsu workflows, so package availability matters more than a library API.
  project-history:
    - >
      The public repository was created in January 2026 and describes ec as a 3-way
      terminal Git mergetool with optional Neovim integration. The README emphasizes
      diff3 base comparison, a no-argument conflicted-file picker, non-interactive modes
      for scripts or CI, and configuration as a Git mergetool.
    - >
      Early releases moved quickly through the 0.1, 0.2, and 0.3 series in
      February-March 2026, with v0.3.3 published in June 2026.
  related-projects:
    - >
      Git mergetool, Jujutsu merge-editor, Neovim terminal buffers, and lazygit are the
      workflows ec explicitly targets or demonstrates.
    - >
      Other terminal diff and merge tools occupy the same packaging neighborhood, but
      ec's README focuses on the Git/Jujutsu conflict-resolution path.
  sources:
    - https://github.com/chojs23/ec
    - https://github.com/chojs23/ec/releases
    - https://raw.githubusercontent.com/chojs23/ec/main/README.md
    - https://api.github.com/repos/chojs23/ec
  summary:
    - >
      ec, short for easy-conflict, is a young terminal-native Git merge conflict
      resolver. Its history is short but package-relevant: it packages a familiar
      three-pane merge workflow as a small CLI/TUI that can be installed from Homebrew,
      npm, Nix, Go, or release binaries.
  timeline:
    - '2026: Public GitHub repository created.'
    - '2026: v0.1.x, v0.2.x, and v0.3.x releases published in the first half of the year.'
    - '2026: README documents Homebrew, npm, Nix, Go, AUR, and Windows install routes.'
  usage:
    - >
      Typical usage is to run ec inside a Git repository with conflicts, or configure
      Git's mergetool command so Git passes BASE, LOCAL, REMOTE, and MERGED paths to ec.
      The README also documents Jujutsu merge-editor integration and non-interactive
      modes such as --check and --apply-all.
related-packages:
  - id: cask:meld
    reason: >
      Choose Meld when you prefer a graphical two- or three-way diff and merge
      application; choose ec for a keyboard-driven terminal workflow and documented
      Git/Jujutsu integration.
    rel: alternative
    sources:
      - https://github.com/chojs23/ec
      - https://meldmerge.org/
tags:
  - cli
  - git
  - merge-conflicts
  - mergetool
  - tui
provenance:
  category-sources:
    - >
      source_facts.description says ec is a TUI 3-way git mergetool; official README
      describes it as a terminal Git merge conflict resolver.
  display-name-sources:
    - Official README title expands ec as easy-conflict; source_facts.name is ec.
  docs-sources:
    - >
      Official GitHub README is the primary documentation and includes installation, Git
      mergetool setup, usage, key bindings, and theme configuration.
  history-sources:
    - https://github.com/chojs23/ec
    - https://github.com/chojs23/ec/releases
    - https://raw.githubusercontent.com/chojs23/ec/main/README.md
    - https://api.github.com/repos/chojs23/ec
  repo-sources:
    - >
      source_facts.repo already contains https://github.com/chojs23/ec; per instructions
      repo was not re-determined.
  tags-sources:
    - >
      source_facts.description and official README identify Git merge conflict
      resolution, TUI behavior, and CLI usage.
category-confidence: high
category-path:
  - developer-tools
  - version-control
  - merge-tools
display-name-confidence: high
docs-confidence: medium
history-confidence: medium
repo-confidence: high
tags-confidence: high
