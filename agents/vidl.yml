history:
  adoption-history:
    - >
      ViDL packages youtube-dl's broad site support in a native Mac interface and adds
      Safari and bookmarklet integration. The official site does not publish broader
      adoption figures.
  package-nerd-significance:
    - >
      ViDL is an example of a desktop package built around command-line media tooling:
      it bundles youtube-dl and FFmpeg while still allowing users to replace those
      components under the application's support directory.
  project-history:
    - >
      Omz:software developed ViDL as a free graphical front end for youtube-dl. Its
      design combines the downloader with bundled FFmpeg binaries, an integrated login
      browser, and browser-launch integration.
  related-projects:
    - youtube-dl provides the underlying site extraction support.
    - FFmpeg performs conversion and audio extraction.
  sources:
    - https://omz-software.com/vidl/
    - https://omz-software.com/vidl/bookmarklet/
  summary:
    - >
      ViDL for Mac is a graphical web-video downloader based on youtube-dl, with
      playlist handling, audio extraction, browser integration, and support for
      authenticated sessions.
  timeline:
    - >
      2020: The official page's copyright notice documents ViDL as an omz:software
      product by this year.
  usage:
    - >
      Users paste a video or playlist URL, invoke ViDL through Safari or a bookmarklet,
      and optionally extract audio. An integrated browser supplies session cookies when
      a supported site requires login.
    - >
      ViDL copies its bundled youtube-dl script and FFmpeg tools to
      ~/Library/Application Support/ViDL on first launch; advanced users can replace
      those bundled tools there.
