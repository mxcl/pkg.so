id: cask:duckduckgo
display-name: DuckDuckGo
repo: https://github.com/duckduckgo/apple-browsers
docs:
  - https://duckduckgo.com/duckduckgo-help-pages
  - >
    https://duckduckgo.com/duckduckgo-help-pages/get-duckduckgo/get-duckduckgo-browser-on-mac
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      DuckDuckGo first gained adoption as a private search alternative. Apple added it
      as a built-in Safari search option in 2014, and DuckDuckGo expanded beyond search
      with mobile apps and browser extensions in 2018 before bringing its browser to Mac
      in 2022.
  package-nerd-significance:
    - >
      The macOS browser is open source and packaged as a Homebrew cask, making a
      mainstream privacy-focused browser available through reproducible command-line
      workstation setup. Its source moved from the archived macos-browser repository
      into DuckDuckGo's combined apple-browsers repository.
  project-history:
    - >
      DuckDuckGo launched in 2008 as a search engine that did not track search history.
      It subsequently broadened into privacy applications and extensions, culminating in
      the DuckDuckGo Private Browser for Mac in April 2022.
  related-projects:
    - DuckDuckGo Search
    - DuckDuckGo for iOS
    - DuckDuckGo for Android
    - DuckDuckGo Privacy Essentials
  sources:
    - https://duckduckgo.com/about
    - >
      https://duckduckgo.com/duckduckgo-help-pages/get-duckduckgo/get-duckduckgo-browser-on-mac/
    - https://github.com/duckduckgo/apple-browsers
    - https://github.com/duckduckgo/macos-browser
  summary:
    - >
      DuckDuckGo is a privacy-oriented web browser for macOS from the company that began
      with the DuckDuckGo search engine.
  timeline:
    - '2008: DuckDuckGo launched as a search engine.'
    - '2014: Apple added DuckDuckGo as a built-in Safari search option.'
    - >
      2018: DuckDuckGo expanded its privacy protection through mobile apps and browser
      extensions.
    - '2022: DuckDuckGo Private Browser launched on Mac.'
    - >
      2025: The standalone macos-browser repository was archived after development moved
      to apple-browsers.
  usage:
    - >
      Used for everyday web browsing with private search, tracker blocking, encryption
      upgrades, cookie-pop-up management, and controls for clearing local browsing data.
