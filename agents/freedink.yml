history:
  adoption-history:
    - >
      GNU FreeDink entered the normal GNU distribution channel and appears in several
      package managers. The supplied package facts list Homebrew, Debian, Fedora,
      MacPorts, Nix, Ubuntu, and winget entries, showing a small but durable packaging
      footprint for a niche game engine.
  package-nerd-significance:
    - >
      FreeDink is a package-nerd preservation case: a legacy game engine carried through
      GNU release infrastructure, source control, and distribution recipes. It is small
      compared with modern game engines, but interesting because packages must bridge
      classic game assumptions with current filesystem, SDL, and launcher conventions.
  project-history:
    - >
      The GNU project page presents FreeDink as a portable Dink Smallwood engine rather
      than a new game universe. Its role is preservation and portability: keeping the
      engine and editor usable on free software systems while pointing users to the GNU
      documentation and Savannah source-control area.
  related-projects:
    - >
      FreeDink is directly related to Dink Smallwood and to GNU's wider collection of
      free software games and game engines. Its Savannah CVS page is the official
      source-control surface named by current curation.
  sources:
    - https://ftp.gnu.org/gnu/freedink/
    - https://savannah.gnu.org/cvs?group=freedink
    - https://www.gnu.org/software/freedink
    - https://www.gnu.org/software/freedink/doc
  summary:
    - >
      GNU FreeDink is the GNU portable version of the Dink Smallwood game engine. It
      packages a classic adventure/RPG engine, editor tools, and runtime commands for
      systems where users expect old free games to build and run from source or from a
      package manager.
  timeline:
    - '2008: GNU FTP lists early freedink 1.08 source releases.'
    - '2010: Multiple 1.08 dated releases appeared in the GNU archive.'
    - '2012: GNU archive entries include later 1.08 dated and 108.x releases.'
    - '2020s: Distribution packages continue to ship FreeDink as a niche free game engine.'
  usage:
    - >
      Users run freedink or dink to play compatible Dink Smallwood content and
      freedinkedit or dinkedit to use the editor. Packaging usually focuses on making
      the SDL-based engine, data lookup paths, and desktop/game integration work without
      requiring users to build old game code manually.
