history:
  adoption-history:
    - >
      The OpenMPT wiki lists distribution packages for Alpine, Arch, Debian, Fedora,
      FreeBSD, Gentoo, Homebrew, MacPorts, MSYS2, NixOS, OpenBSD, Ubuntu, and other
      systems. That broad packaging reflects its role as the modern packaged decoder for
      tracker modules.
    - >
      The same wiki lists software using libopenmpt across desktop players, plugins,
      media frameworks, streaming software, audio libraries, game engines, language
      bindings, websites, and games. Examples include Audacious, MPD, FFmpeg, GStreamer,
      Kodi-related plugins, SoLoud, and Sonic Robo Blast 2.
  package-nerd-significance:
    - >
      libopenmpt is significant because tracker music is a file-format archaeology
      problem: many formats came from different DOS, Amiga, Windows, game, and demoscene
      tools, and correct playback depends on preserving old quirks. Packaging one
      maintained decoder prevents every media player from relearning that history.
    - >
      For package maintainers, it is also a useful example of a library that pairs a
      serious API with a small command-line tool, allowing both dependency use and quick
      terminal inspection or playback.
  project-history:
    - >
      The project page says libopenmpt is based on the player code of OpenMPT, also
      known as Open ModPlug Tracker, and is developed in the same source repository to
      avoid code-base fragmentation. The first libopenmpt 0.2 beta release is dated
      2013-12-31 in the official changelog.
    - >
      The changelog shows rapid early work in 2014 and 2015 on Autotools packaging,
      Android and Emscripten builds, playback compatibility, C and C++ documentation,
      plugin support, and the openmpt123 command-line player. Later releases continued
      the pattern of format-loader fixes, security updates, build-system support, and
      compatibility with old tracker quirks.
  related-projects:
    - >
      OpenMPT, or Open ModPlug Tracker, is the source project whose player code
      underpins libopenmpt.
    - >
      libmodplug is an adjacent older module-decoding library; libopenmpt provides a
      compatibility layer for its interface.
    - FFmpeg and GStreamer are major media-framework adopters listed by the OpenMPT wiki.
    - >
      XMPlay, Winamp, foobar2000, WACUP, and Kodi-related plugins represent the plugin
      ecosystem around module playback.
  sources:
    - https://formulae.brew.sh/formula/libopenmpt
    - https://lib.openmpt.org/doc/changelog.html
    - https://lib.openmpt.org/libopenmpt/
    - https://source.openmpt.org/browse/openmpt/trunk
    - https://wiki.openmpt.org/Libopenmpt
  summary:
    - >
      libopenmpt is a C++ and C library for decoding tracked music module files into raw
      PCM audio, plus the openmpt123 command-line player. It brings OpenMPT's module
      playback engine to Unix packages, media players, plugins, game tools, and language
      bindings.
  timeline:
    - '2013: Changelog records libopenmpt 0.2-beta1 as the first release on 2013-12-31.'
    - >
      2014: Changelog records Autotools tarballs, Emscripten work, plugin changes, and
      openmpt123 improvements across beta releases.
    - >
      2015: Changelog records completed C and C++ documentation and additional
      platform/build support.
    - >
      2016: Changelog records libopenmpt 0.2-beta17 with native MO3 support,
      dynamic-loading changes, and many playback fixes.
    - '2025: Project news records libopenmpt 0.8.0 on 2025-05-31.'
    - '2026: Project news and changelog record libopenmpt 0.8.7 on 2026-05-17.'
  usage:
    - >
      End users get openmpt123 for terminal playback of module files. Developers use the
      C or C++ APIs to decode formats such as MOD, XM, S3M, IT, and many more
      tracker-derived formats into PCM audio.
    - >
      The library also provides a libmodplug compatibility layer, which helps projects
      migrate from older module-decoding APIs while using OpenMPT playback behavior.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Use FFmpeg when tracked modules must be decoded or transcoded inside a broad
      command-line and library media workflow; OpenMPT documents FFmpeg's libopenmpt
      demuxer.
    rel: adjacent_workflow
    sources:
      - https://wiki.openmpt.org/Libopenmpt
      - https://ffmpeg.org/documentation.html
  - id: brew:gstreamer
    reason: >
      Use GStreamer to incorporate libopenmpt decoding into graph-based multimedia
      applications through its documented openmptdec plugin.
    rel: adjacent_workflow
    sources:
      - https://wiki.openmpt.org/Libopenmpt
      - https://gstreamer.freedesktop.org/documentation/
  - id: brew:mpd
    reason: >
      Use Music Player Daemon when module playback should be served by a persistent,
      remotely controlled music player; OpenMPT lists MPD as a libopenmpt adopter.
    rel: adjacent_workflow
    sources:
      - https://wiki.openmpt.org/Libopenmpt
      - https://mpd.readthedocs.io/en/stable/user.html
