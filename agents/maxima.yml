id: brew:maxima
display-name: Maxima
repo: https://sourceforge.net/p/maxima/code/ci/master/tree
docs:
  - https://maxima.sourceforge.io/documentation.html
  - https://maxima.sourceforge.io/ext/maxima.pdf
config-file-location:
  unix:
    - ~/.maxima/maxima-init.mac
    - ~/.maxima/maxima-init.lisp
  windows:
    - '%USERPROFILE%/maxima/maxima-init.mac'
    - '%USERPROFILE%/maxima/maxima-init.lisp'
credentials-file-location: null
history:
  adoption-history:
    - >
      Maxima's adoption is tied to its role as a free, source-available computer algebra
      system. The official site emphasizes that it runs on modern Windows, Linux, and
      Mac systems, offers terminal, wxMaxima, and XMaxima interfaces, and remains active
      through community updates.
    - >
      The input package-manager metadata shows Maxima packaged across Homebrew,
      MacPorts, Debian, Ubuntu, Fedora, Alpine, Nix, Pacman, Chocolatey, Scoop, winget,
      and other ecosystems, reflecting use by students, researchers, and Unix users who
      want symbolic math from a CLI or notebook-style interface.
  package-nerd-significance:
    - >
      Maxima matters because it keeps a historically important computer algebra lineage
      available in ordinary package managers. It is one of the few symbolic math systems
      that package maintainers can ship as free software, inspect at source level, and
      connect to terminal workflows.
  project-history:
    - >
      The official Maxima homepage traces the system to Macsyma, developed at MIT in the
      late 1960s, and says Maxima is the only system based on that effort that remains
      publicly available with an active user community. It credits the Maxima branch to
      William Schelter, who maintained it from 1982 until 2001.
    - >
      A pivotal event in Maxima's package history came in 1998, when Schelter obtained
      permission to release the source under the GNU GPL. After his death in 2001, a
      group of users and developers took over and moved the project forward through
      SourceForge, frequent releases, documentation work, and mailing-list coordination.
  related-projects:
    - Macsyma, wxMaxima, XMaxima, Common Lisp, Maple, Mathematica, SageMath
  sources:
    - https://maxima.sourceforge.io/
    - https://maxima.sourceforge.io/docs/manual/Runtime-Environment.html
    - https://sourceforge.net/p/maxima/code/ci/master/tree/
    - source_facts.package-manager-url
  summary:
    - >
      Maxima is an open-source computer algebra system descended from MIT Macsyma and
      maintained as a Common Lisp-based symbolic mathematics package.
  timeline:
    - 'Late 1960s: Macsyma is developed at MIT.'
    - '1982: William Schelter begins maintaining the Maxima branch of Macsyma.'
    - '1998: Permission is obtained to release Maxima under the GNU GPL.'
    - '2001: Schelter dies; a user and developer community continues the project.'
    - '2026: Official site describes frequent updates and an active user community.'
  usage:
    - >
      CLI users run `maxima` or related frontends such as `rmaxima` and `xmaxima`.
      Startup customization is done with `maxima-init.mac` and `maxima-init.lisp`, which
      the manual says are loaded automatically from `maxima_userdir` or another
      directory in Maxima's search path.
related-packages:
  - id: brew:wxmaxima
    reason: >
      Install wxMaxima alongside Maxima when you want a document-oriented graphical
      interface with formatted output, menus, autocompletion, inline plots, and
      animations over the same algebra engine.
    rel: adjacent_workflow
    sources:
      - https://maxima.sourceforge.io/download.html
      - https://wxmaxima-developers.github.io/wxmaxima/
