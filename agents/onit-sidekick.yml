history:
  adoption-history:
    - >
      SideKick is distributed as a prebuilt macOS application and as source that can be
      built with Xcode. Homebrew Cask provides an additional package-manager
      installation path.
  package-nerd-significance:
    - >
      SideKick is representative of provider-neutral desktop AI clients: it combines
      cloud-model APIs, custom providers, and local Ollama models in a native macOS
      interface. Its cask is useful to users who want reproducible installation of a
      graphical AI tool while retaining a bring-your-own-token or local-model workflow.
  project-history:
    - >
      The project was originally published as the open-source Onit macOS client, an AI
      chat panel designed to attach to other applications and use selected text or
      window contents as context.
    - >
      The 3.0 release separated the AI side panel into the standalone SideKick product.
      The project retained support for multiple remote model providers, user-supplied
      API tokens, and local models through Ollama.
  related-projects:
    - Ollama supplies the local-model API that SideKick can detect and use.
    - >
      Onit Dictate and Onit QuickEdit are related products, but the official repository
      explicitly states that their code is maintained separately.
  sources:
    - https://github.com/synth-inc/onit
    - https://github.com/synth-inc/onit/releases
    - https://www.cloudless.so/ai-sidebar
  summary:
    - >
      SideKick is an open-source macOS AI chat sidebar that can dock to other
      applications, incorporate selected text or window context, and use either remote
      providers or local Ollama models.
  timeline:
    - '2.2: The project published its first GitHub release.'
    - >
      2.x: Releases expanded local-model support, custom providers, saved history,
      shortcuts, and automatic context features.
    - >
      3.0: The AI side panel was split from the Onit client as the first standalone
      SideKick release.
  usage:
    - >
      Users invoke the sidebar with a configurable shortcut, attach selected text or an
      application window as context, and choose among supported cloud or local models.
    - >
      Remote requests can use the project's hosted service or user-provided provider
      tokens. Local Mode sends requests to locally available Ollama models.
