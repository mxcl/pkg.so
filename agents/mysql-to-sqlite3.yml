    - https://raw.githubusercontent.com/techouse/mysql-to-sqlite3/master/README.md
  summary:
    - >
      mysql-to-sqlite3 is a small Python command-line migration utility from the
      techouse GitHub organization. The project positions `mysql2sqlite` as a transfer
      tool for MySQL or MariaDB schemas and data into a SQLite 3 database file, creating
      SQLite tables, indexes, views, and foreign keys where possible before copying
      rows.
  usage:
    - >
      Its practical role is narrower than a general ETL system: it is for developers who
      need a local SQLite copy, a one-off database downgrade, a schema-only export,
      selected-table transfer, Docker-based execution, or careful handling of
      MySQL/MariaDB differences such as JSON, generated defaults, collations, and
      information_schema metadata. Distribution through PyPI, Docker, and Homebrew gives
      the package a lightweight cross-platform niche around the `mysql2sqlite`
      executable rather than a server-side migration service.
related-packages:
  - id: brew:sqlite3-to-mysql
    reason: >
      Use Techouse's companion sqlite3-to-mysql tool when the required transfer
      direction is reversed and a SQLite database must be loaded into MySQL or MariaDB.
    rel: adjacent_workflow
    sources:
      - https://techouse.github.io/sqlite3-to-mysql/
      - https://github.com/techouse/sqlite3-to-mysql
      - https://formulae.brew.sh/formula/sqlite3-to-mysql
  - id: brew:sqlite-utils
    reason: >
      After migration, sqlite-utils can inspect, query, transform and index the
      resulting SQLite database from the command line.
    rel: adjacent_workflow
    sources:
