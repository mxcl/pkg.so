id: brew:dtrx
display-name: dtrx
repo: https://github.com/dtrx-py/dtrx
docs:
  - https://github.com/dtrx-py/dtrx#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dtrx has a long tail in Unix package managers: Homebrew, Debian/Ubuntu, Alpine,
      MacPorts, Nix, and openSUSE-style packaging all carry or have carried it. The
      modern dtrx-py project publishes releases to PyPI and GitHub to keep the tool
      installable for Python 3 systems.
  package-nerd-significance:
    - >
      dtrx is a classic package-nerd utility: tiny, opinionated, and memorable because
      it wraps a messy Unix tool surface into one command. The Python 2 to Python 3
      maintenance story also mirrors a common distribution-maintenance pattern, where
      useful old scripts survive through community continuation projects.
  project-history:
    - >
      The current dtrx-py repository describes itself as a copy of Brett Smith's
      original dtrx project, with all credit attributed to the original author. The
      maintained Python 3 fork exists because the original Python 2-era package became
      difficult to keep in Linux distributions, with the README specifically citing
      Ubuntu 20.04+ removal from default package archives as motivation.
  related-projects:
    - >
      Related tools include `tar`, `unzip`, `cpio`, `p7zip`, `unar`, and distribution
      archive helper scripts. The maintained project is directly related to Brett
      Smith's original dtrx repository.
  sources:
    - https://github.com/dtrx-py/dtrx
    - https://pypi.org/project/dtrx/
    - http://www.brettcsmith.org/2007/dtrx/
    - https://formulae.brew.sh/api/formula/dtrx.json
  summary:
    - >
      dtrx, short for 'Do The Right eXtraction', is a small command-line archive
      extractor that tries to make archive unpacking predictable. Its point is cultural
      as much as technical: stop remembering the right `tar`, `unzip`, `cpio`, or
      decompressor flags and run one command.
  timeline:
    - '2007: Original dtrx homepage published by Brett Smith.'
    - '2020: dtrx-py GitHub repository created to carry Python 3 patches.'
    - '2020s: dtrx-py releases are tagged and published to PyPI.'
  usage:
    - >
      Users run `dtrx archive.tar.gz` or equivalent archive names and let the tool
      choose extraction behavior. Its attraction is avoiding accidental directory
      clutter, wrong flags, or inconsistent behavior across archive formats.
related-packages:
  - id: brew:unar
    reason: >
      Choose unar when broad support for proprietary, legacy, and obscure formats
      through The Unarchiver engine matters more than dtrx's policy-driven wrapping of
      standard Unix extraction commands.
    rel: alternative
    sources:
      - https://github.com/dtrx-py/dtrx#readme
      - https://theunarchiver.com/command-line
      - https://github.com/MacPaw/XADMaster
