id: cask:dcp-o-matic-disk-writer
display-name: DCP-o-matic Disk Writer
repo: https://github.com/cth103/dcpomatic
docs:
  - https://dcpomatic.com/manual/html
  - https://dcpomatic.com/manual/html/ch20.html
config-file-location:
  linux:
    - ~/.config/dcpomatic2/config.xml
  macos:
    - /Users/<user>/Library/Preferences/com.dcpomatic/2/config.xml
  windows:
    - C:\Users\<user>\AppData\Local\dcpomatic\config.xml
credentials-file-location:
  linux:
    - ~/.config/dcpomatic2/config.xml
  macos:
    - /Users/<user>/Library/Preferences/com.dcpomatic/2/config.xml
  windows:
    - C:\Users\<user>\AppData\Local\dcpomatic\config.xml
history:
  adoption-history:
    - >
      DCP-o-matic is used by film-makers, projectionists, film festivals, subtitlers,
      and cinema technicians. Disk Writer packages the specialist task of preparing
      Linux-formatted cinema drives into the cross-platform suite.
  package-nerd-significance:
    - >
      Disk Writer is useful because cinema delivery commonly requires EXT2-formatted
      media, a workflow that is awkward on macOS and Windows without specialist tooling.
      Its separate Homebrew cask lets users install this focused utility without
      treating it as a generic disk copier.
  project-history:
    - >
      DCP-o-matic began with its first repository commit in 2012 and grew into a suite
      for creating, checking, delivering, and manipulating Digital Cinema Packages. Disk
      Writer became the suite component dedicated to formatting external drives and
      copying DCPs onto them.
  related-projects:
    - DCP-o-matic
    - DCP-o-matic Player
    - DCP-o-matic KDM Creator
    - DCP-o-matic Encode Server
    - DCP-o-matic Editor
  sources:
    - https://dcpomatic.com/development
    - https://dcpomatic.com/manual/html/ch01s02.html
    - https://dcpomatic.com/manual/html/ch20.html
    - https://www.dcpomatic.com/
  summary:
    - >
      DCP-o-matic Disk Writer is the DCP-o-matic suite utility for formatting external
      hard drives as EXT2 and copying Digital Cinema Packages onto them for cinema
      delivery.
  timeline:
    - '2012: First commit to the DCP-o-matic repository.'
    - '2015: DCP-o-matic 1.83 was available across Windows and major Linux distributions.'
    - '2022: DCP-o-matic 2.16 added writing Linux-formatted DCP drives from macOS and Windows.'
  usage:
    - >
      Select an external drive and a DCP, then use the utility to format the drive
      appropriately and copy the package. The official manual cautions that formatting
      destroys existing data on the selected drive.
