history:
  adoption-history:
    - >
      Trivial targets Mac users who need a temporary or persistent transfer server for
      computers, routers, embedded devices, and other equipment without installing and
      configuring separate server packages. The official product page emphasizes an
      approachable graphical workflow rather than adoption statistics.
  package-nerd-significance:
    - >
      TFTP and FTP servers remain common tools for firmware delivery, network-device
      provisioning, recovery, and testing. Trivial is notable in Mac package culture
      because it wraps several traditionally daemon-and-configuration-file-driven
      protocols in a sandboxed drag-and-drop application.
  project-history:
    - >
      Decisive Tactics released Trivial 1.0 in April 2019 as a macOS file-transfer
      server. Subsequent releases added compatibility updates for successive macOS
      generations, corrected interoperability with some Cisco devices, and updated its
      OpenSSL dependency in response to published vulnerabilities.
    - >
      The application combines TFTP, FTP, FTPS, HTTP, and HTTPS serving with uniform
      read, write, or read/write access controls. It is ephemeral by default but can be
      configured to run continuously as a background service.
  related-projects:
    - Trivial fills roles commonly served by command-line TFTP, FTP, and HTTP daemons.
    - >
      Decisive Tactics also develops networking and device-management applications such
      as Serial, but no direct code relationship is documented.
  sources:
    - https://www.decisivetactics.com/products/trivial/
    - https://www.decisivetactics.com/products/trivial/release-notes
  summary:
    - >
      Trivial is a sandboxed macOS application for sharing selected files through TFTP,
      FTP, FTPS, HTTP, or HTTPS.
  timeline:
    - '2019-04-29: Trivial 1.0 was released.'
    - '2019-06-17: Version 1.0.1 fixed receiving files from some Cisco devices.'
    - '2021-03-31: Version 1.0.5 updated OpenSSL to address CVE-2021-3450 and CVE-2021-3449.'
    - '2023-10-01: Version 1.0.10 added macOS Sonoma support.'
  usage:
    - >
      Users drag files into Trivial, select access permissions, and start one or more
      transfer protocols. Typical uses include serving firmware or configuration files,
      receiving uploads from network equipment, running a temporary local web server,
      and enabling continuous background service when required.
