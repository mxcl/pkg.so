history:
  adoption-history:
    - >
      Compose's adoption path runs through Docker Desktop, Linux binaries, distribution
      packages, and CI systems. The README says Docker Desktop includes Compose on
      Windows and macOS and documents installation as a CLI plugin under Docker's
      cli-plugins directory on Linux. The batch input shows especially broad
      package-manager coverage, including Homebrew, Chocolatey, Debian, Fedora-style
      distributions, MacPorts, Nix, Arch, Scoop, Ubuntu, winget, and zypper.
  package-nerd-significance:
    - >
      Docker Compose is package-nerd significant because it made multi-container Docker
      applications portable before Kubernetes became the default mental model for
      orchestration. It also marks a major packaging transition: the old standalone
      docker-compose command and Python implementation gave way to a Docker CLI plugin,
      while package managers kept shipping a familiar formula name.
  project-history:
    - >
      Compose became one of Docker's defining developer-experience tools because it
      translated a multi-container application into a file that could live beside source
      code. The current upstream README describes the modern Go-based Compose as a
      Docker CLI plugin and notes that the legacy Python version remains on the v1
      branch.
  related-projects:
    - >
      Docker Compose is closely related to Docker Engine, Docker Desktop, the Compose
      Specification, Docker Buildx for Compose builds, Swarm's older Compose-file usage,
      and editor tools such as Microsoft's Compose Language Service.
  sources:
    - https://docs.docker.com/compose/
    - https://github.com/docker/compose#readme
    - https://compose-spec.io/
    - https://formulae.brew.sh/formula/docker-compose
  summary:
    - >
      Docker Compose is Docker's tool for defining and running multi-container
      applications from a Compose file. Docker's docs describe it as a way to manage
      services, networks, and volumes in one YAML configuration, then start the
      application stack with a single command.
  timeline:
    - '2010s: Compose popularizes application stacks described in docker-compose.yml files.'
    - >
      2020: The Compose Specification becomes the shared Compose file format used by the
      modern project.
    - >
      2020s: The Go-based Compose V2 becomes the main Docker Compose implementation,
      with the Python version kept on the v1 branch.
    - >
      2026: Docker docs present Compose as the standard tool for defining and running
      multi-container applications, and the batch input lists broad package-manager
      distribution.
  usage:
    - >
      The normal workflow is to define services in compose.yaml or docker-compose.yml,
      then use docker compose up to create and start the application. Docker docs call
      out lifecycle commands for starting, stopping, rebuilding, viewing status,
      streaming logs, and running one-off commands, making Compose common in local
      development, test environments, staging, simple production deployments, and CI
      workflows.
related-packages:
  - id: brew:docker-buildx
    reason: >
      Use Docker Buildx with Compose when Compose-defined service builds need Bake,
      multi-platform output, shared cache, or other advanced BuildKit controls.
    rel: adjacent_workflow
    sources:
      - https://docs.docker.com/build/bake/compose-file/
      - https://docs.docker.com/guides/compose-bake/
  - id: brew:docker-compose-langserver
    reason: >
      Use the Compose Language Service while authoring Compose YAML to add completion,
      diagnostics, formatting, signatures, and hover information in an LSP-capable
      editor.
    rel: adjacent_workflow
    sources:
      - >
        https://github.com/microsoft/vscode-containers/tree/main/packages/compose-language-service
      - https://docs.docker.com/reference/compose-file/
  - id: brew:podman-compose
    reason: >
      Choose podman-compose when you want a Compose-style multi-container workflow
      backed by daemonless, rootless-oriented Podman rather than Docker.
    rel: alternative
    sources:
      - https://github.com/containers/podman-compose#readme
      - https://docs.docker.com/compose/
