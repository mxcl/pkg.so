history:
  adoption-history:
    - >
      Rowboat distributes desktop builds for macOS, Windows, and Linux through its
      official releases and website. The input identifies a Homebrew cask for the macOS
      application.
  package-nerd-significance:
    - >
      Rowboat combines a local-first Markdown knowledge base with an Electron desktop
      assistant, bring-your-own-model support, MCP integrations, and optional
      collaborative Spaces. It is notable to package enthusiasts because the open-source
      desktop client keeps personal context on the user's machine while still exposing
      extensible agent and self-hosting workflows.
  project-history:
    - >
      Rowboat developed as an open-source desktop AI coworker centered on persistent,
      user-inspectable memory. The project expanded beyond personal email, notes,
      meetings, browsing, and code workflows to include shareable applications and
      collaborative Spaces backed by the self-hostable Harbor server.
  related-projects:
    - Harbor is Rowboat's open-source Spaces server and is maintained in the same repository.
    - Ollama and LM Studio are supported local-model routes.
    - Claude Code and Codex can be used by Rowboat's code mode.
    - Model Context Protocol servers extend Rowboat with external tools and services.
  sources:
    - https://github.com/rowboatlabs/rowboat
    - https://github.com/rowboatlabs/rowboat/releases
    - https://www.rowboatlabs.com/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Rowboat is an open-source desktop AI coworker that indexes work into a local
      knowledge graph and provides email, notes, browser, meeting, coding, application,
      and team-collaboration surfaces.
  timeline:
    - The project began as a local-first personal AI assistant with persistent work memory.
    - >
      The product expanded to include built-in work surfaces, background agents, code
      mode, MCP integrations, and collaborative Spaces.
    - "2026: The official release history records the desktop application's 1.0 release series."
  usage:
    - >
      Users install the desktop application, connect selected services or local data,
      and work with an assistant whose knowledge is stored as local Markdown. Optional
      API-key files enable voice input, voice output, Exa search, and Composio tools;
      local or hosted language models can be selected independently.
