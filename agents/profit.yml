history:
  adoption-history:
    - >
      Nelogica describes Profit as a leading trading platform in Latin America. Adoption
      grew through direct subscriptions, broker-distributed white-label editions, and
      offerings for individual and institutional market participants.
    - >
      The vendor reported reaching 100,000 clients in 2017 and one million customers
      across its technology products in 2021. Those company-wide milestones provide
      context for the ecosystem around Profit rather than package-specific installation
      counts.
  package-nerd-significance:
    - >
      Profit is significant as a long-running, Brazil-centered trading workstation that
      combines real-time data, charting, order-flow analysis, order routing, replay,
      automation, and a marketplace for user-created strategies.
    - >
      Its NTSL strategy language, robots, indicators, broker integrations, and
      white-label editions make it an ecosystem as well as a desktop application.
  project-history:
    - >
      Nelogica was founded in 2003 by Marcos Boschetti and Fabiano Kerber with the aim
      of widening access to financial-market technology. The company records Profit's
      release in 2005.
    - >
      Profit evolved from analysis software into a multi-broker trading environment.
      Nelogica records its first successful order sent to the Brazilian exchange from
      its servers in 2012, followed by institutional adoption and a mobile edition.
    - >
      The modern family includes Training, One, Plus, Pro, and Ultra editions, alongside
      desktop, mobile, and web access with differing analysis, routing, automation, and
      support capabilities.
  related-projects:
    - >
      NTSL is Nelogica's language for indicators, screening, coloring rules, backtests,
      and automated strategies.
    - NeloStore distributes optional modules and third-party strategies.
    - Copy Invest replicates selected traders' or robots' operations inside Profit.
    - Profit Mobile and Profit Web extend the platform beyond the desktop application.
  sources:
    - https://ajuda.nelogica.com.br/hc/pt-br
    - >
      https://ajuda.nelogica.com.br/hc/pt-br/articles/360036157871-Plataformas-dispon%C3%ADveis
    - https://oneclick.nelogica.com.br/en/about
    - https://www.nelogica.com.br/produtos/
  summary:
    - >
      Profit is Nelogica's professional market-analysis and electronic-trading platform.
      It provides charting, order-flow tools, order entry, risk features, market replay,
      and programmable strategies for traders and investors.
  timeline:
    - '2003: Nelogica was founded in Brazil.'
    - '2005: Profit was released.'
    - >
      2012: Nelogica sent its first successful order to the Brazilian exchange from its
      servers.
    - "2014: Nelogica's institutional-market solutions gained broader corporate adoption."
    - '2018: Profit Mobile was released.'
  usage:
    - >
      Traders use Profit to monitor real-time markets, analyze charts and order flow,
      submit and manage orders through supported brokers, replay sessions, and review
      performance.
    - >
      Advanced users create indicators and automated strategies in NTSL, obtain optional
      modules through NeloStore, and use broker or multi-broker licenses. Access uses
      the email address or CPF and password associated with the contracted license.
