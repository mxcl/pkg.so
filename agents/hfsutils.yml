history:
  adoption-history:
    - >
      The official page says hfsutils had been in widespread use since 1996 with reports
      of successful ports to many operating systems. That made it part of the Unix
      toolbox for vintage Macintosh media, emulation, CD-ROM extraction, and disk-image
      work long after HFS stopped being the everyday Mac filesystem.
    - >
      The input package facts record hfsutils in Homebrew, Fedora-style dnf packaging,
      MacPorts, Nix, Ubuntu, and zypper-family packaging. Its continued package-manager
      presence comes from archival and retrocomputing needs rather than rapid upstream
      change.
  package-nerd-significance:
    - >
      hfsutils is package-nerd catnip because it is stable old infrastructure with real
      ongoing utility. A 1990s C toolkit still earns modern formulae because filesystem
      archaeology, emulators, old media recovery, and reproducible archival workflows
      need command-line tools more than polished GUIs.
    - >
      It also illustrates why package managers preserve niche utilities: the upstream
      history is quiet, but the tool solves a concrete interoperability problem at the
      boundary between Unix files, block devices, disk images, and classic Macintosh
      metadata.
  project-history:
    - >
      Robert Leslie wrote hfsutils in the mid-1990s to manipulate Macintosh HFS volumes
      from Unix and related systems. The official page states that Leslie is the author
      of all code distributed in the package and that the software is GPLv2-licensed.
    - >
      The version history shows a mature late-1990s maintenance arc: performance
      improvements through an internal block cache in November 1997, support for
      blessing the MacOS System Folder in September 1998, and version 3.2.6 in November
      1998 with portability fixes, clean-unmount handling, B*-tree fixes, and
      formatting/mount options.
    - >
      The project's scope stayed focused on classic HFS. The official page notes that
      early Macintosh MFS volumes are not supported, and that some 800K floppy media
      cannot be read on many systems because of low-level hardware limitations even
      though images of such floppies can work.
  related-projects:
    - >
      hfsutils is related to classic Macintosh HFS, Apple partition maps, MacBinary,
      emulator workflows such as vMac and Executor-era tooling, optional Tcl/Tk
      interfaces, Linux HFS support, and later graphical wrappers around the same
      command-line utilities.
  sources:
    - https://formulae.brew.sh/formula/hfsutils
    - https://www.mars.org/home/rob/proj/hfs/
    - https://www.mars.org/home/rob/proj/hfs/version.html
  summary:
    - >
      HFS Utilities is Robert Leslie's Unix-oriented toolkit for reading and writing
      classic Macintosh HFS volumes. It packages a library, many `h*` command-line
      utilities, and optional Tcl/Tk interfaces for working with old Macintosh disks and
      disk images from non-Mac systems.
  timeline:
    - '1996: The official page says hfsutils had been in widespread use since this year.'
    - >
      1997-11-11: The version history records an internal block cache, filesystem bug
      fixes, character-set translation, and documentation updates.
    - >
      1998-09-02: The version history records support for blessing the MacOS System
      Folder and release 3.2.2.
    - >
      1998-11-02: The version history records version 3.2.6 with portability and
      filesystem-consistency fixes.
    - >
      Package-manager era: The input package facts record hfsutils availability across
      Homebrew, MacPorts, Nix, Ubuntu, dnf, and zypper-family packaging.
  usage:
    - >
      The command set mirrors a small filesystem shell: `hmount` introduces a volume,
      `hls` lists files, `hcd` changes directories, `hcopy` copies files, `hformat`
      formats volumes, and related utilities manage attributes, directories, names, and
      unmounting. The tools can operate on block devices or regular files containing HFS
      volume images.
    - >
      Use cases include copying files from classic Mac media, preserving
      resource-fork-aware files through MacBinary workflows, creating or formatting HFS
      images, and inspecting old CD-ROMs or disk images where modern desktop operating
      systems provide little or no direct support.
