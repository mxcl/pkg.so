history:
  adoption-history:
    - >
      Nightfall's official installation instructions support both direct release
      downloads and Homebrew Cask, making it convenient for individual Mac users and
      declaratively managed setups.
  package-nerd-significance:
    - >
      Nightfall is a compact, open-source example of a native Swift menu-bar utility.
      Homebrew Cask support makes a graphical appearance tool reproducibly installable
      from the command line.
  project-history:
    - >
      Nightfall was created as an open-source macOS utility for switching between light
      and dark appearances from the menu bar. Its 2.0 release substantially rewrote the
      application and moved its interface to SwiftUI; later releases added login
      startup, update checks, and further compatibility work.
  related-projects:
    - >
      Nightfall complements macOS's built-in Appearance settings and automation
      mechanisms that can switch system appearance.
  sources:
    - 'Official release history: https://github.com/r-thomson/Nightfall/releases'
    - 'Official repository and README: https://github.com/r-thomson/Nightfall'
  summary:
    - >
      Nightfall is an open-source macOS menu-bar utility for quickly toggling system
      dark mode.
  timeline:
    - >
      Version 2.0.0: The application was substantially rewritten and its views were
      converted to SwiftUI.
    - 'Version 2.1.0: Login startup and automatic update checking were added.'
    - '2023: Version 3.1.0 was published.'
  usage:
    - >
      A left click on the menu-bar icon toggles dark mode; a right click opens options.
      Users can assign a global shortcut, enable an animated transition, start the
      utility at login, and hide its menu-bar item. Animated transitions require macOS
      screen-recording permission.
