config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README points users to PyPI for installation and documents Docker use
      for repeatable local runs. The supplied package-manager facts show Homebrew and
      Nix packages, which gives the project an unusually convenient path for a
      Python/PyTorch media utility.
  package-nerd-significance:
    - >
      BackgroundRemover matters to package nerds as an example of AI media tooling
      becoming a normal CLI package: it wraps PyTorch, ffmpeg, model downloads, optional
      GPU acceleration, and server mode into a tool installable from general package
      managers.
  project-history:
    - >
      The GitHub repository was created in May 2021, and the README says the tool was
      made by nadermx to power BackgroundRemoverAI.com. The first GitHub release listed
      by the repository is v0.1.1 in July 2021, with later releases continuing into
      2026.
    - >
      The README documents a practical evolution from simple local image/video
      processing toward Docker usage, GPU acceleration, folder processing, stdin/stdout
      pipelines, and an HTTP API server exposed through backgroundremover-server.
  related-projects:
    - >
      The README names PyTorch and torchvision as core requirements, ffmpeg for video
      processing, and U2-Net model variants for segmentation. BackgroundRemoverAI.com is
      the hosted service the README says the tool was made to power.
  sources:
    - https://api.github.com/repos/nadermx/backgroundremover
    - https://api.github.com/repos/nadermx/backgroundremover/releases
    - https://github.com/nadermx/backgroundremover#readme
    - source_facts.package-manager
  summary:
    - >
      BackgroundRemover is an open-source command-line and server tool for removing
      backgrounds from images and video with AI models. It packages a common creator
      workflow behind a Python CLI instead of a hosted-only web service.
  timeline:
    - '2021: GitHub repository created for nadermx/backgroundremover.'
    - '2021: v0.1.1 published as the earliest GitHub release listed by the repository.'
    - >
      2025: README documents folder processing, pipe usage, Docker model persistence,
      and GPU guidance.
    - '2026: v0.4.4 published in GitHub releases.'
  usage:
    - >
      Users run backgroundremover against image files, videos, folders, standard input,
      or an HTTP upload endpoint. The README documents U2-Net model choices, alpha
      matting, custom background replacement, mask-only output, GPU fallback behavior,
      and model caching under ~/.u2net for Docker runs.
related-packages:
  - id: brew:ffmpeg
    reason: >
      BackgroundRemover officially requires FFmpeg for video processing and documents
      using it to convert transparent output or composite a replacement background.
    rel: adjacent_workflow
    sources:
      - https://github.com/nadermx/backgroundremover
      - https://ffmpeg.org/documentation.html
