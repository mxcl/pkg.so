history:
  adoption-history:
    - >
      HSD adoption is tied to Handshake network participation: running a full node,
      serving recursive or authoritative DNS, managing wallets, mining, claiming names
      through DNSSEC proofs, and participating in name auctions. The Homebrew and Nix
      package metadata in the input shows packaging beyond npm-style installation.
    - >
      The release notes show long-running protocol maintenance with network soft forks,
      database and wallet migrations, API changes, and DNS/name-resolution improvements.
      That makes hsd closer to Bitcoin-derived node software than to a disposable CLI.
  package-nerd-significance:
    - >
      For package maintainers, hsd is significant because it packages a full
      blockchain/DNS stack with native dependency considerations such as libunbound,
      network ports, persistent state under ~/.hsd, wallet migrations, and
      security-sensitive API keys.
    - >
      It is also a good example of an ecosystem package where the formula is not just
      installing a binary: the package participates in a protocol, has stateful
      upgrades, and exposes multiple command-line entry points.
  project-history:
    - >
      Handshake's own site identifies hsd as the initial code for the protocol, and the
      hsd README describes it as an implementation of Handshake. The project grew as a
      node, wallet, DNS resolver, RPC server, and CLI suite rather than as a
      single-purpose daemon.
    - >
      The README and install guide show a Node.js-based project distributed from the
      official GitHub repository, installable from source, Git refs, Homebrew, and
      container images. The command set includes hsd, hsd-cli, hsw-cli, RPC shortcuts,
      wallet tools, and seeding utilities.
  related-projects:
    - >
      Related projects include the Handshake protocol documentation, hs-client for RPC
      helpers, Bob Wallet as a GUI wallet, bns for DNS-related functionality, and
      libunbound for recursive resolver support.
  sources:
    - https://github.com/handshake-org/hsd#readme
    - https://github.com/handshake-org/hsd/blob/master/CHANGELOG.md
    - https://github.com/handshake-org/hsd/blob/master/docs/install.md
    - https://handshake.org
  summary:
    - >
      HSD is the JavaScript full-node and daemon implementation of the Handshake
      protocol, a decentralized naming and certificate-authority experiment built around
      a peer-to-peer root zone.
  timeline:
    - '2018-2019: Public v0.x tags and testnet tags appear in the upstream repository.'
    - '2020: v1.0.0 appears in the upstream tag series.'
    - '2023: v6.0.0 release notes include the ICANN Lockup soft fork and configuration changes.'
    - >
      2024: v7.0.0 release notes describe wallet migrations, interactive rescans, and
      history API changes.
    - '2025: v8.0.0 release notes include the End Airdrop soft fork.'
  usage:
    - >
      Common usage is operational: run hsd as a full node, query it with hsd-cli, manage
      wallet state with hsw-cli, expose node and wallet HTTP APIs, and configure DNS
      ports for recursive or authoritative service.
    - >
      The README emphasizes bitcoind-style RPC plus additional REST APIs, name auction
      commands such as sendopen, sendbid, sendreveal, sendupdate, and DNSSEC-based claim
      flows.
related-packages:
  - id: cask:kyokan-bob
    reason: >
      Bob Wallet provides a graphical Handshake wallet and DNS/name-auction interface
      with an integrated HSD full node.
    rel: adjacent_workflow
    sources:
      - https://github.com/handshake-org/hsd
      - https://github.com/bob-wallet/bob-wallet
  - id: brew:unbound
    reason: >
      HSD can use native libunbound bindings for better recursive-DNS performance and
      standards conformance, making Unbound a specific runtime companion for resolver
      deployments.
    rel: adjacent_workflow
    sources:
      - https://github.com/handshake-org/hsd
      - https://nlnetlabs.nl/projects/unbound/about/
