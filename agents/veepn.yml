history:
  adoption-history:
    - >
      VeePN broadened its reach from mobile devices to Windows, browser extensions,
      Android TV, Amazon Fire TV, and macOS during 2018–2019. It later expanded beyond
      VPN connectivity into additional privacy and security services.
  package-nerd-significance:
    - >
      VeePN represents the consumer VPN-client class of Homebrew casks: a graphical,
      account-backed network application whose service infrastructure and configuration
      are controlled by its vendor rather than exposed as a conventional Unix daemon or
      configuration-file workflow.
  project-history:
    - >
      VeePN was founded in March 2017 to make VPN-based privacy and security accessible
      without requiring extensive technical knowledge. Its first Android application
      appeared in June 2017, followed by its website and iOS application in July.
  related-projects:
    - >
      The wider VeePN product family includes browser extensions and vendor-operated
      privacy and security tools in addition to the desktop VPN clients.
  sources:
    - 'Official company history: https://veepn.com/about-us/'
    - 'Official documentation: https://help.veepn.com/hc/en-us'
    - >
      Package identity and distribution: source_facts.applications and
      source_facts.package-manager
  summary:
    - >
      VeePN is a cross-platform consumer VPN and privacy service. The macOS cask
      installs its graphical client for establishing encrypted connections through the
      vendor's server network.
  timeline:
    - '2017: VeePN was founded and released its first Android and iOS applications.'
    - '2018: A Windows client was introduced.'
    - '2019: Support expanded to macOS, browser extensions, Android TV, and Amazon Fire TV.'
    - "2021: VeePN's browser extensions underwent an independent security audit."
    - '2024–2025: The service expanded into a broader set of privacy tools.'
  usage:
    - >
      On macOS, users sign in, approve installation of the required VPN configuration,
      and select a server location or use the automatically chosen location. The
      official support site documents setup, connection troubleshooting, subscriptions,
      and account management.
