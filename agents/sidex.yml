history:
  adoption-history:
    - >
      SideX remains an early-release editor. Its initial beta releases offered builds
      for macOS, Windows, and Linux, while the project invited outside contributors to
      help complete the extension host and debugger.
  package-nerd-significance:
    - >
      SideX explores a technically interesting packaging tradeoff: retaining the
      familiar VS Code workbench while replacing Electron and bundled Chromium with
      Tauri, Rust, and each operating system's native webview. This makes it relevant to
      developers tracking desktop application size, memory use, native webviews, and
      Electron alternatives.
  project-history:
    - >
      SideX began as an open-source port of the Code - OSS workbench to Tauri. Its
      TypeScript frontend retains VS Code patterns, while a Rust backend replaces
      Electron services for file access, terminals, Git, search, and native integration.
    - >
      The project subsequently added an optional local AI-agent server written in Go.
      The editor works without an account; users supply their own model provider or
      connect a local model service.
  related-projects:
    - Visual Studio Code / Code - OSS supplies the workbench lineage.
    - Tauri provides the desktop shell and native-webview architecture.
    - Monaco Editor provides editing functionality.
    - Open VSX supplies extension distribution.
  sources:
    - 'Official README: https://github.com/Sidenai/sidex/blob/main/README.md'
    - >
      Official architecture document:
      https://github.com/Sidenai/sidex/blob/main/ARCHITECTURE.md
    - 'Official contributing guide: https://github.com/Sidenai/sidex/blob/main/CONTRIBUTING.md'
    - 'Official releases: https://github.com/Sidenai/sidex/releases'
  summary:
    - >
      SideX is an open-source, early-stage port of the Visual Studio Code workbench that
      replaces Electron with a Tauri and Rust desktop backend.
  timeline:
    - '2026-04-07: SideX 0.1.0 Beta released.'
    - '2026-04-12: SideX 0.1.2 Beta released.'
    - '2026: The project documented an optional local, bring-your-own-provider AI agent.'
  usage:
    - >
      SideX provides source editing, file navigation, terminals, Git operations, search,
      themes, and Open VSX extension installation. The extension host and debugger are
      documented as works in progress.
    - >
      The built-in AI agent is optional. Provider credentials can come from Settings,
      environment variables, opted-in CLI logins, or keyless local model servers; the
      official documentation says they are passed through the child process environment
      rather than written to a configuration file.
