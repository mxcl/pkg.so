id: cask:btp
display-name: SAP BTP CLI
repo: null
docs:
  - https://help.sap.com/docs/btp/btp-cli-command-reference/btp-cli-command-reference
  - >
    https://help.sap.com/docs/btp/sap-business-technology-platform/account-administration-using-sap-btp-command-line-interface-btp-cli
  - https://help.sap.com/docs/btp/sap-business-technology-platform/how-to-work-with-btp-cli
  - >
    https://help.sap.com/docs/btp/sap-business-technology-platform/specify-location-of-configuration-file
  - https://tools.hana.ondemand.com/
config-file-location:
  linux:
    - ~/.config/.btp/config.json
  macos:
    - ~/Library/Application Support/.btp/config.json
  windows:
    - C:\Users\<username>\AppData\Roaming\SAP\btp\config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption follows SAP BTP administration workflows: the CLI is documented as the
      command-line interface for account administration and day-to-day BTP work. Its
      Homebrew cask exists to make the vendor tool fit common macOS package-management
      workflows.
    - >
      Because BTP is an enterprise platform, public adoption signals are less visible
      than for open-source CLIs; reliable evidence is SAP's official documentation and
      the package's presence as a Homebrew cask.
  package-nerd-significance:
    - >
      For package maintainers, btp is a classic vendor-binary cask: source is not
      public, updates follow SAP's archive naming and versioning, and trust is anchored
      in SAP's download host and Help Portal rather than in reproducible source builds.
  project-history:
    - >
      The CLI belongs to SAP Business Technology Platform, SAP's cloud platform umbrella
      for application development, integration, data, analytics, and AI services. SAP
      publishes the command reference and task documentation through SAP Help Portal,
      while macOS packages are distributed from SAP Development Tools rather than from a
      public source repository.
    - >
      The current Homebrew cask tracks SAP's downloadable btp binary archive from
      tools.hana.ondemand.com. The absence of a public official source repository is
      itself part of the package history: consumers package the vendor binary, not a
      build from source.
  related-projects:
    - SAP Business Technology Platform is the managed cloud platform administered by the CLI.
    - >
      SAP Development Tools is the vendor download surface used for the packaged macOS
      archives.
    - Homebrew Cask packages the vendor-supplied binary for macOS users.
  sources:
    - https://help.sap.com/docs/btp/btp-cli-command-reference/btp-cli-command-reference
    - >
      https://help.sap.com/docs/btp/sap-business-technology-platform/account-administration-using-sap-btp-command-line-interface-btp-cli
    - https://help.sap.com/docs/btp/sap-business-technology-platform/how-to-work-with-btp-cli
    - >
      https://help.sap.com/docs/btp/sap-business-technology-platform/specify-location-of-configuration-file
    - https://tools.hana.ondemand.com/
    - source_facts.source-archive
    - source_facts.version
  summary:
    - >
      SAP BTP CLI is SAP's command-line client for administering accounts, subaccounts,
      entitlements, services, and related resources on SAP Business Technology Platform.
      In package-manager terms it is a vendor-distributed operational CLI, closer to
      cloud account tooling than to an open-source developer utility.
  timeline:
    - >
      2020s: SAP Business Technology Platform becomes the umbrella platform for SAP
      cloud development and administration workflows.
    - >
      2020s: SAP documents btp as the command-line interface for SAP BTP account
      administration.
    - '2026: Homebrew cask metadata tracks SAP BTP CLI 2.106.1 from tools.hana.ondemand.com.'
  usage:
    - >
      The btp executable is used for scripted and interactive SAP BTP administration:
      logging in, selecting global accounts or subaccounts, inspecting available
      commands, and automating account-management tasks described in SAP's BTP CLI
      guides.
    - >
      The tool stores local configuration in platform-specific application data paths
      documented by SAP; credentials are not separately documented in the supplied
      curation, so no credentials path is asserted.
tags:
  - account-management
  - btp
  - cli
  - cloud
  - sap
provenance:
  category-sources:
    - >
      SAP Help describes btp CLI as account administration tooling for SAP Business
      Technology Platform.
  display-name-sources:
    - >
      SAP Help and the official SAP tools page use the name SAP BTP command line
      interface (btp CLI).
  docs-sources:
    - >
      SAP Help documents account administration and command usage for the SAP BTP
      command line interface.
    - >
      SAP Help documents the default btp CLI config.json locations on Linux, macOS, and
      Windows.
    - source_facts.homepage is the official SAP Development Tools download page for btp CLI.
  history-sources:
    - https://help.sap.com/docs/btp/btp-cli-command-reference/btp-cli-command-reference
    - >
      https://help.sap.com/docs/btp/sap-business-technology-platform/account-administration-using-sap-btp-command-line-interface-btp-cli
    - https://help.sap.com/docs/btp/sap-business-technology-platform/how-to-work-with-btp-cli
    - >
      https://help.sap.com/docs/btp/sap-business-technology-platform/specify-location-of-configuration-file
    - https://tools.hana.ondemand.com/
    - source_facts.source-archive
    - source_facts.version
  repo-sources:
    - >
      SAP's official documentation and download surface distribute a vendor binary and
      identify no official public source-control repository.
  tags-sources:
    - >
      SAP Help and the official SAP tools page identify this as the SAP BTP command line
      interface for account administration.
category-confidence: high
category-path:
  - cloud-infrastructure
  - cloud-management
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: high
tags-confidence: high
