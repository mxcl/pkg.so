config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption evidence is narrow and mostly tied to Juniper network automation users.
      Homebrew packaging made it installable on macOS for engineers who wanted an
      off-box Junos scripting workflow.
  package-nerd-significance:
    - >
      juise is interesting because it packages vendor-specific network automation
      tooling as a Unix CLI. It captures an older, XML-and-SLAX-centered automation era
      before Python, NETCONF libraries, and controller-driven workflows became more
      common.
  project-history:
    - >
      The official repository and manual describe JUISE as tooling for SLAX scripts that
      interact with Junos XML data through Junos-specific extension functions. The
      repository tag history includes a 0.5.1 tag from July 2013 and a later 0.6.0 line,
      reflecting a specialized toolchain rather than a broad application platform.
  related-projects:
    - >
      libslax is the related SLAX processing library used in the same Junos scripting
      ecosystem.
    - Juniper PyEZ is a later Python-oriented Junos automation project.
    - junoscriptorium is Juniper's repository of Junos script examples.
  sources:
    - https://formulae.brew.sh/formula/juise
    - https://github.com/Juniper/juise
    - https://github.com/Juniper/juise/tags
    - https://github.com/Juniper/junoscriptorium
    - https://github.com/Juniper/py-junos-eznc
    - https://juniper.github.io/juise/juise-manual.html
  summary:
    - >
      juise is Juniper's JUNOS User Interface Scripting Environment, a desktop-side
      environment for writing, testing, debugging, and running Junos-oriented SLAX
      scripts outside the normal Junos device environment.
  timeline:
    - '2013: The public repository tag history includes the 0.5.1 tag.'
    - >
      2015: Juniper community material described SLAX as a language for Junos commit,
      op, and event scripts.
    - '2016: The repository tag history includes the 0.6.0 tag.'
  usage:
    - >
      Network engineers use juise to develop and debug op, commit, and related Junos
      scripts without copying each iteration to a router or switch. It is most relevant
      in environments that still rely on SLAX and Junos XML scripting.
related-packages:
  - id: brew:libslax
    reason: >
      Install libslax alongside JUISE when developing or debugging SLAX scripts, because
      JUISE uses SLAX as its typical scripting language and invokes the libslax
      debugger.
    rel: adjacent_workflow
    sources:
      - https://juniper.github.io/juise/juise-manual.html
      - https://github.com/Juniper/libslax
