history:
  adoption-history:
    - >
      The developer describes Tofu as the most popular of his applications. After
      development was paused in 2014 and older builds stopped working beyond macOS
      10.14, continued user requests prompted its revival in 2023.
  package-nerd-significance:
    - >
      Tofu is a long-lived independent Mac utility with a classic shareware-era
      distribution story: a focused free application, a long compatibility hiatus, a
      modern revival, and Homebrew Cask packaging for automated installation.
  project-history:
    - >
      Amar Sagoo began Tofu in 2003 as an experiment in making long-form on-screen
      reading easier by replacing long lines and vertical scrolling with horizontally
      navigated columns. Version 2.0 arrived in 2008 with simple PDF support, fullscreen
      improvements, trackpad scrolling, and a Universal Binary. Sagoo announced in 2014
      that he did not plan further development, then revived the application as Tofu 3.0
      in 2023 after sustained user interest.
  related-projects:
    - Amar Sagoo also created the Mac applications Licensed and Deep Notes.
  sources:
    - "Developer's 2014 status post: https://blog.amarsagoo.info/2014/01/5-years-later.html"
    - "Developer's Tofu 2.0.1 post: https://blog.amarsagoo.info/2008/09/tofu-201.html"
    - "Developer's Tofu 3.0 post: https://blog.amarsagoo.info/2023/07/tofu-30.html"
    - 'Official product page: https://amarsagoo.info/tofu'
    - source_facts.description; source_facts.package-manager
  summary:
    - >
      Tofu is Amar Sagoo's free macOS reader that reformats text into horizontally
      navigated columns.
  timeline:
    - '2003: Tofu began as a reading-layout experiment.'
    - '2008: Tofu 2.0 added simple PDF support and a Universal Binary.'
    - '2014: The developer announced that further development was not planned.'
    - '2023: Tofu 3.0 revived the application for modern Macs.'
    - '2025: Tofu 3.1 updated its interface for macOS 26 Tahoe.'
  usage:
    - >
      Users open or paste text and supported documents into Tofu, which lays the content
      out in columns navigated from left to right to avoid long lines and vertical
      scrolling.
