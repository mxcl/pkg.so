id: brew:frum
display-name: frum
repo: null
docs:
  - https://github.com/TaKO8Ki/frum
config-file-location:
  unix:
    - <project>/.ruby-version
    - ~/.bashrc
    - ~/.zshrc
    - ~/.config/fish/conf.d/frum.fish
credentials-file-location: null
history:
  adoption-history:
    - >
      frum's official installation section documents Homebrew/Linuxbrew, Arch AUR
      packages, Cargo installation, and release binaries. The v0.1.1 release notes
      explicitly mention Linuxbrew installation, showing package-manager support as part
      of its early adoption path.
  package-nerd-significance:
    - >
      frum is notable as an example of the Rust rewrite wave reaching language-version
      managers: it borrows the fast-startup pitch common to tools like fnm while
      targeting Ruby workflows historically served by rbenv, chruby, RVM, and
      ruby-build-based tooling.
  project-history:
    - >
      The project appeared publicly as a 0.1.0 alpha series in April 2021 and reached
      v0.1.0 in May 2021. Its README emphasizes a pure Rust implementation that does not
      use ruby-build, cross-platform support for macOS and Linux, and faster shell
      initialization than rbenv in the included benchmark.
    - >
      The release history stayed small, with v0.1.2 published in November 2021. The
      README references fnm, a Rust-based Node.js version manager, which places frum in
      the family of small compiled version managers built for quick shell startup.
  related-projects:
    - The README lists Schniz/fnm as a reference project.
    - >
      The benchmark compares shell initialization against rbenv, making rbenv an
      important adjacent Ruby version manager.
  sources:
    - https://github.com/TaKO8Ki/frum
    - https://github.com/TaKO8Ki/frum/releases
  summary:
    - >
      frum is a Ruby version manager written in Rust. Its README positions it as a fast,
      modern alternative in the Ruby toolchain space, with support for `.ruby-version`
      files, shell initialization, completions, and Ruby installation commands.
  timeline:
    - '2021: v0.1.0-alpha.0 was published as the first GitHub release.'
    - '2021: v0.1.0 followed in May with global config options.'
    - '2021: v0.1.1 added documented Linuxbrew installation support.'
    - '2021: v0.1.2 fixed Homebrew OpenSSL usage.'
  usage:
    - >
      Users initialize frum in their shell profile with `frum init`, then install,
      uninstall, list, and select Ruby versions with subcommands such as `install`,
      `versions`, `global`, and `local`. The tool also supports `.ruby-version` files so
      it can fit into existing Ruby project conventions.
    - >
      The README documents `$HOME/.frum` as the default installation root, with
      `--frum-dir` and `FRUM_DIR` available when users need a customized location.
related-packages:
  - id: brew:rbenv
    reason: >
      Choose rbenv for a mature shim-based Ruby version selector with a large plugin
      ecosystem; frum instead emphasizes a compiled Rust implementation and faster shell
      initialization.
    rel: alternative
    sources:
      - https://github.com/TaKO8Ki/frum#readme
      - https://github.com/rbenv/rbenv#readme
  - id: brew:chruby
    reason: >
      Choose chruby for a minimal shell-function approach without shims; pair it with a
      separate installer, whereas frum includes Ruby installation commands.
    rel: alternative
    sources:
      - https://github.com/postmodern/chruby#readme
      - https://github.com/TaKO8Ki/frum#readme
