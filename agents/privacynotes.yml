config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      PrivacyNotes distributes signed clients for macOS, Windows, Linux, Android and iOS
      while also providing a browser application. This gives the same encrypted vault
      model a broad cross-platform installation surface.
    - >
      The project publishes the client applications, cryptographic implementation and
      threat model so users and packagers can inspect the privacy claims and reproduce
      client builds.
  package-nerd-significance:
    - >
      PrivacyNotes is notable to package maintainers because its security model makes
      artifact provenance, signed releases and client-source correspondence unusually
      important. The official VERIFY document explicitly distinguishes a fixed desktop
      or mobile artifact from web code that can change between visits.
    - >
      Its phrase-based identity and optional self-custody also differ from conventional
      note applications that store a reusable password or credentials file.
  project-history:
    - >
      PrivacyNotes was developed around a local-first, end-to-end-encrypted data model
      in which note content is encrypted on the user's device before synchronization.
    - >
      In 2026 the project published the full web, desktop and mobile client code under
      the AGPL-3.0 license, alongside its production cryptographic core and formal
      threat-model documentation.
  related-projects:
    - BIP-39, used for the recovery phrase and seed derivation.
    - >
      The Noble and Scure JavaScript cryptography libraries used by the published client
      implementation.
  sources:
    - https://github.com/LifetimeLabsDev/PrivacyNotes.app
    - https://github.com/LifetimeLabsDev/PrivacyNotes.app/blob/main/VERIFY.md
    - https://privacynotes.app/
    - https://privacynotes.app/help
  summary:
    - >
      PrivacyNotes is a cross-platform, local-first application for end-to-end-encrypted
      notes and related personal information, with phrase-based identity and optional
      self-custody.
  timeline:
    - '2026: The full web, desktop and mobile client source was published under AGPL-3.0.'
    - '2026: Official signed releases covered desktop, mobile and browser platforms.'
  usage:
    - >
      Users may create a phrase-only vault without supplying an email address, or use a
      supported identity provider and select how their encryption phrase is held. A
      self-custodied phrase must be backed up because the service cannot recover it.
    - >
      The application works from an encrypted local copy and synchronizes ciphertext.
      The official help recommends its encrypted full-backup export for moving or
      preserving a vault rather than copying internal application storage.
