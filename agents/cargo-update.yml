id: brew:cargo-update
display-name: cargo-update
repo: null
docs:
  - https://docs.rs/cargo-update
  - https://github.com/nabijaczleweli/cargo-update#readme
  - >
    https://rawcdn.githack.com/nabijaczleweli/cargo-update/man/cargo-install-update-config.1.html
  - https://rawcdn.githack.com/nabijaczleweli/cargo-update/man/cargo-install-update.1.html
config-file-location:
  unix:
    - $CARGO_HOME/.install_config.toml
    - ~/.cargo/.install_config.toml
credentials-file-location:
  unix:
    - $CARGO_HOME/credentials
    - $CARGO_HOME/credentials.toml
    - ~/.cargo/credentials
    - ~/.cargo/credentials.toml
history:
  adoption-history:
    - >
      GitHub records the repository as created in October 2016, and crates.io records
      the first cargo-update release the same month. The input package facts list
      Alpine, Homebrew, Nix, and Arch packages.
  package-nerd-significance:
    - >
      cargo-update fills a long-standing package-manager gap for Cargo-installed CLI
      tools: it gives users a repeatable way to discover and apply crate executable
      updates while preserving per-package install options.
  project-history:
    - >
      The official manual says cargo-update was built from frustration with periodically
      checking cargo-installed executables for updates. The README presents `cargo
      install-update` and `cargo install-update-config` as the two user-facing commands.
  related-projects:
    - >
      The manual documents optional cargo-binstall integration and relies on Cargo
      registry metadata and Cargo install state.
  sources:
    - https://api.github.com/repos/nabijaczleweli/cargo-update
    - https://github.com/nabijaczleweli/cargo-update
    - https://docs.rs/cargo-update
    - https://github.com/nabijaczleweli/cargo-update#readme
    - >
      https://rawcdn.githack.com/nabijaczleweli/cargo-update/man/cargo-install-update-config.1.html
    - https://rawcdn.githack.com/nabijaczleweli/cargo-update/man/cargo-install-update.1.html
    - https://crates.io/api/v1/crates/cargo-update
    - https://formulae.brew.sh/api/formula/cargo-update.json
  summary:
    - >
      cargo-update provides Cargo subcommands for checking and applying updates to
      executables installed with `cargo install`.
  timeline:
    - '2016: GitHub repository created and first crates.io release recorded.'
    - '2026: crates.io records max_version 20.0.2.'
  usage:
    - >
      The manual documents updating all installed packages with `cargo install-update
      -a`, updating selected packages, listing without updating, using cargo-binstall
      when appropriate, and configuring per-package build options with `cargo
      install-update-config`.
related-packages:
  - id: brew:cargo-binstall
    reason: >
      Install cargo-binstall alongside cargo-update to let eligible updates use prebuilt
      binaries instead of compiling from source; both projects explicitly document this
      integration.
    rel: adjacent_workflow
    sources:
      - https://github.com/nabijaczleweli/cargo-update#readme
      - https://github.com/cargo-bins/cargo-binstall#readme
      - https://github.com/nabijaczleweli/cargo-update/blob/master/src/main.rs
