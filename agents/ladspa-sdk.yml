history:
  adoption-history:
    - >
      The LADSPA site describes the standard as a way for audio processors and effects
      to plug into a wide range of Linux synthesis and recording packages, with most
      major Linux audio applications supporting it. The same page points to plugin
      libraries and generators such as Steve Harris's plugins, CMT, CAPS, TAP, and
      Faust, which is why the SDK package tends to appear as a small dependency in
      audio-oriented package sets.
  package-nerd-significance:
    - >
      LADSPA SDK is a classic small-library package: stable header, tiny tools, simple
      search path, and lots of downstream optional integrations. It matters because it
      represents the Unix packaging style of exposing a narrow shared interface rather
      than shipping a whole workstation.
  project-history:
    - >
      The original API text was posted by Richard Furse in 2000 as a deliberately short
      C interface for unit generators that could be dynamically loaded by multiple audio
      hosts. The official SDK change log records version 1.01 on 2 April 2000 with the
      header, limited documentation, three plugins, and two hosts, followed in May 2000
      by SDK version numbering, more example plugins, LADSPA_PATH support, HTML
      documentation, and the listplugins utility.
    - >
      The SDK stayed intentionally small. Version 1.10 introduced the LGPL license in
      May 2001, version 1.12 updated the SDK for LADSPA v1.1 in August 2002, and later
      maintenance releases in 2019 and 2021 modernized the build, default search paths,
      libsndfile use in applyplugin, and small command-line behavior.
  related-projects:
    - >
      The official site links LADSPA to the CMT plugin library, Steve Harris plugins,
      CAPS, TAP, Faust, Csound-oriented tooling, and other Linux audio projects that
      either provide LADSPA plugins or generate them.
  sources:
    - https://ladspa.org/original_api.txt
    - https://www.ladspa.org/
    - https://www.ladspa.org/ladspa_sdk/changes.html
    - https://www.ladspa.org/ladspa_sdk/overview.html
  summary:
    - >
      LADSPA SDK packages the Linux Audio Developer's Simple Plugin API header, example
      audio plugins, and small host/inspection tools for the older but still
      package-relevant LADSPA audio plugin standard. Its cultural importance is less
      about a large application and more about a compact ABI that made Unix audio plugin
      packaging predictable.
  timeline:
    - >
      2000-04-02: LADSPA SDK 1.01 initial release included the header, limited
      documentation, three plugins, and two hosts.
    - >
      2000-05-04: SDK 1.02 added version numbering, ten example plugins, and LADSPA_PATH
      support.
    - '2001-05-08: SDK 1.10 introduced LGPL licensing.'
    - '2002-08-07: SDK 1.12 updated for LADSPA v1.1.'
    - >
      2019-01-03: SDK 1.14 modernized build details and introduced a default plugin
      search path.
    - '2021-09-09: SDK 1.17 shipped applyplugin clip-checking and usage-message maintenance.'
  usage:
    - >
      Developers use the SDK primarily for ladspa.h and the example code, while users
      and package tests see analyseplugin, applyplugin, and listplugins. The LADSPA_PATH
      environment variable is part of the historical packaging story because it gives
      hosts a standard way to find installed plugin shared libraries.
related-packages:
  - id: brew:lv2
    reason: >
      Choose LV2 when developing a newer, extensible audio-plugin ecosystem with richer
      metadata and features; retain LADSPA for its deliberately small ABI and broad
      legacy-host compatibility.
    rel: alternative
    sources:
      - https://www.ladspa.org/
      - https://lv2plug.in/
      - https://lv2plug.in/pages/projects.html
  - id: brew:csound
    reason: >
      Csound is a practical companion host: its optional `dssi4cs` module loads and
      processes installed LADSPA effects discovered through `LADSPA_PATH`.
    rel: adjacent_workflow
    sources:
      - https://csound.com/manual/plugin/dssi4cs/
      - https://www.ladspa.org/
