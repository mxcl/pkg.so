history:
  adoption-history:
    - >
      Afterglow targets modern macOS 15 or later on both Apple silicon and Intel. It can
      import modules from original files and archives or install preserved software
      releases through its built-in Internet Archive browser.
  package-nerd-significance:
    - >
      Afterglow is a preservation-oriented compatibility package: it runs original
      Motorola 68k After Dark module code without requiring a classic Macintosh ROM or
      operating-system installation. Its specialized emulator preserves a distinctive
      body of 1990s desktop software in a modern package.
  project-history:
    - >
      Afterglow was created as a non-commercial software-preservation project to run
      classic After Dark screen savers on modern macOS. Rather than remake the
      animations, it uses the Musashi 68k CPU emulator and reimplements enough Macintosh
      Toolbox and operating-system APIs to execute original modules.
  related-projects:
    - >
      After Dark is the historic Berkeley Systems screen-saver platform whose modules
      Afterglow runs.
    - Musashi supplies the Motorola 68000 CPU emulation used by Afterglow.
    - The Internet Archive is integrated as a source for preserved After Dark releases.
  sources:
    - 'Official help: https://morphing.cloud/afterglow/help/'
    - 'Official product page: https://morphing.cloud/afterglow/'
  summary:
    - >
      Afterglow is a macOS emulator and screen-saver host for classic After Dark
      modules. It is designed to preserve and run original 68k module code on current
      Macs.
  timeline:
    - >
      2026: Afterglow's initial public release supports macOS 15+, Intel and Apple
      silicon, module importing, and modern macOS screen-saver integration.
  usage:
    - >
      Users import After Dark modules by dragging module files, disk images,
      directories, or supported archives into Afterglow; the app can also browse
      preserved releases from the Internet Archive.
    - >
      Afterglow installs a modern macOS screen-saver component and keeps imported
      modules and related application data under ~/Library/Application
      Support/Afterglow. The official help describes this as application data, not a
      configuration file, so config-file-location remains null.
