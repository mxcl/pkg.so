history:
  adoption-history:
    - >
      The project distributes PiBar directly, through the Mac App Store, and through
      Homebrew. Its README documents compatibility paths for both Pi-hole 5 and Pi-hole
      6, including the different authentication models used by those releases.
  package-nerd-significance:
    - >
      PiBar packages a common homelab administration task as a native macOS menu-bar
      utility. It is useful to Pi-hole operators who want persistent query statistics,
      quick enable/disable controls, and multi-instance failover visibility without
      keeping the Pi-hole dashboard open.
  project-history:
    - >
      PiBar was created by Brad Root as a free and open-source, independent macOS client
      for Pi-hole. The project is not affiliated with Pi-hole LLC or the Pi-hole
      community.
    - >
      The application evolved to support multiple Pi-hole instances and both the version
      5 API-token workflow and version 6 password/session workflow.
  related-projects:
    - Pi-hole is the network-wide DNS filtering system managed by PiBar.
  sources:
    - https://github.com/amiantos/pibar
  summary:
    - >
      PiBar is a free and open-source macOS menu-bar client for monitoring and
      controlling one or more Pi-hole installations.
  timeline:
    - 'PiBar 1.1.2: Supported Pi-hole 5 and older macOS releases.'
    - 'PiBar 1.2.1: Added the documented compatibility path for Pi-hole 5 and 6.'
  usage:
    - >
      Users add a Pi-hole hostname or IP address in Preferences. PiBar detects the
      server version, port, and TLS settings, then prompts for a version 5 API token or
      version 6 password. It can show DNS statistics, warn about unavailable servers,
      manage multiple instances, and toggle blocking from the menu bar or a keyboard
      shortcut.
