history:
  adoption-history:
    - >
      Tencent reported that Weixin had passed 100 million registered users by March
      2012. An official 2018 release described Weixin/WeChat as having more than 1.08
      billion monthly active user accounts as of September 2018.
    - >
      The Mac client extends the service to desktop workflows, while its Homebrew cask
      provides a package-manager installation route for macOS users.
  package-nerd-significance:
    - >
      The cask packages the official proprietary Mac client rather than an open-source
      implementation. It is useful to package-manager users who want reproducible
      installation of a major messaging client while account state remains managed by
      Tencent's service.
  project-history:
    - >
      Tencent launched Weixin in January 2011; the service is branded WeChat in
      international markets. It grew from mobile messaging into a broader communications
      and services platform incorporating voice and video calls, Moments, Official
      Accounts, Mini Programs, and payments.
    - >
      WeChat for Mac brought the account's messaging workflow to macOS as an official
      desktop application.
  related-projects:
    - WeCom, Tencent's enterprise communication and office platform.
    - Weixin Mini Programs and WeChat DevTools.
    - Weixin/WeChat Official Accounts.
  sources:
    - https://mac.weixin.qq.com/
    - >
      https://static.www.tencent.com/storage/uploads/2019/11/09/634e1026223880d83763826b18025952.pdf
