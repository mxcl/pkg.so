      https://static.www.tencent.com/storage/uploads/2019/11/09/9be38cfe9a80ac5078147bd0cbb8d1a2.pdf
    - https://www.tencent.com/attachments/toolkit/2020/4Q20_earnings_presentation.pdf
    - source_facts.package-manager
  summary:
    - WeChat for Mac is Tencent's macOS client for the Weixin/WeChat communication service.
  timeline:
    - '2011-01: Tencent launched Weixin, known internationally as WeChat.'
    - '2012-03: Weixin had exceeded 100 million registered users.'
    - '2018-09: Tencent reported more than 1.08 billion monthly active Weixin/WeChat accounts.'
  usage:
    - >
      Users sign in to communicate through text and multimedia messages and voice or
      video calls, with the Mac application supporting desktop access to the wider
      Weixin/WeChat account ecosystem.
