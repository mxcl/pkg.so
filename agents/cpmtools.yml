history:
  adoption-history:
    - >
      The supplied package facts list cpmtools in Homebrew, Debian, Ubuntu, Fedora/dnf,
      and MacPorts. That packaging spread reflects its role as a practical bridge
      between current Unix-like hosts and CP/M disk images used by retrocomputing
      communities.
  package-nerd-significance:
    - >
      For packagers, cpmtools is notable because it preserves access to
      non-self-describing CP/M disk formats. The diskdefs file is part of the package
      interface: CP/M generally does not store enough format information in the
      filesystem, so distributions must install the definitions file where the tools can
      find it.
  project-history:
    - >
      The upstream README and homepage describe cpmtools as a package for accessing CP/M
      file systems in a style similar to mtools for MS-DOS file systems. It includes
      commands for listing, copying, removing, changing attributes and permissions,
      creating, checking, repairing, and viewing CP/M file systems.
    - >
      The manual pages identify Michael Haardt's copyright beginning in 1997 and note a
      Windows port by John Elliott. The 2026 cpmtools 2.24 release continues maintenance
      with filesystem, filename translation, mkfs, fsck, LibDsk, and diskdefs updates.
  related-projects:
    - mtools is cited by upstream as the analogous package for MS-DOS file systems.
    - LibDsk support is mentioned in the 2.24 changes and command manual.
  sources:
    - https://www.moria.de/~michael/cpmtools/
    - https://www.moria.de/~michael/cpmtools/files/
    - https://www.moria.de/~michael/cpmtools/files/cpmtools-2.24.tar.gz
  summary:
    - >
      cpmtools is Michael Haardt's collection of utilities for accessing CP/M file
      systems from modern host systems. It is a retrocomputing and disk-image
      maintenance package rather than an emulator.
  timeline:
    - "1997: Manual-page copyright begins for Michael Haardt's cpmtools."
    - '2022: Upstream files list cpmtools 2.23.'
    - '2026: Upstream files list cpmtools 2.24 with diskdefs and filesystem fixes.'
  usage:
    - >
      cpmtools is used to inspect and modify CP/M disk images, exchange files with
      simulators or floppy devices, and define disk geometries through diskdefs. The
      upstream documentation says all CP/M file system features are supported, while
      password protection is exposed as data rather than enforced.
related-packages:
  - id: brew:libdsk
    reason: >
      LibDsk complements cpmtools by providing access and conversion backends for real
      floppy devices and numerous emulator image formats before cpmtools operates on the
      CP/M filesystem.
    rel: adjacent_workflow
    sources:
      - https://www.seasip.info/Unix/LibDsk/
      - https://www.moria.de/~michael/cpmtools/
  - id: brew:mtools
    reason: >
      Choose mtools when the target disk uses MS-DOS/FAT rather than CP/M; cpmtools'
      official description explicitly presents mtools as the analogous filesystem
      utility suite.
    rel: alternative
    sources:
      - https://www.moria.de/~michael/cpmtools/
      - https://www.gnu.org/software/mtools/manual/mtools.html
