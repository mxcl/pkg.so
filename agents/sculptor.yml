history:
  adoption-history:
    - >
      Feedback from research-preview users—particularly people using Claude Code—led
      Imbue to prioritize parallel agents, isolated execution, persistent context, and
      rapid local testing in the rebuilt product. Imbue later added Codex support, but
      has not published authoritative broad-adoption figures.
  package-nerd-significance:
    - >
      Sculptor reflects the shift from single terminal-based coding-agent sessions
      toward graphical orchestration of multiple isolated agents. Its container model
      and bidirectional Pairing Mode address package and dependency isolation,
      concurrent work, review, and integration—concerns familiar to development-tool
      users.
  project-history:
    - >
      Imbue introduced Sculptor in April 2025 as a research preview focused on detecting
      and correcting issues in agent-written code. User feedback prompted a ground-up
      redesign around running multiple coding agents safely in parallel.
    - >
      The rebuilt Sculptor was announced in September 2025 with isolated containers,
      Pairing Mode for synchronizing changes into a local repository, merge assistance,
      and persistent session history. The announcement was later updated to record Codex
      support.
  related-projects:
    - >
      Sculptor initially centered on Claude Code and subsequently added Codex as another
      supported coding-agent backend.
    - >
      Imbue's Vet verification tool originated as imbue_verify inside Sculptor before
      becoming a standalone product.
  sources:
    - 'Initial official research-preview announcement: https://imbue.com/blog/sculptor'
    - 'Official Vet product page: https://imbue.com/product/vet'
    - 'Official rebuilt-product announcement: https://imbue.com/blog/sculptor-announce'
  summary:
    - >
      Sculptor is Imbue's graphical environment for running coding agents in isolated
      containers, reviewing their changes, and synchronizing accepted work with a local
      development environment.
  timeline:
    - >
      2025-04: Imbue announced Sculptor as a research preview for finding and fixing
      issues in agent-produced code.
    - >
      2025-09: Imbue announced a ground-up rebuild focused on parallel, isolated coding
      agents.
    - '2025-12: The official announcement was updated to record Codex support.'
  usage:
    - >
      Developers connect a repository, launch concurrent coding-agent tasks in separate
      containers, inspect their conversations and changes, and use Pairing Mode to test
      selected work in the local development environment.
    - >
      Completed changes can be retained, discarded, or merged, with Sculptor detecting
      potential conflicts. Session plans, chats, tool calls, and code changes remain
      available for later continuation.
