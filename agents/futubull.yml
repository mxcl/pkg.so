history:
  adoption-history:
    - >
      Futubull is offered across desktop and mobile platforms as an account-based
      financial service. Its official download page presents it as a professional
      trading platform with market alerts, news, charting, multi-screen support,
      algorithmic trading, options features, and AI-assisted research.
    - >
      The package's Homebrew Cask presence, recorded in source_facts.package-manager,
      gives macOS users a package-manager installation route while accounts, market-data
      permissions, and brokerage services remain controlled by Futu.
  package-nerd-significance:
    - >
      Futubull exemplifies a proprietary, service-backed desktop client whose installed
      application is only one part of the system: identity, brokerage eligibility,
      quotations, and transaction security are maintained upstream.
    - >
      Package maintainers must distinguish the current desktop generation from the
      separately offered legacy client, since both remain official downloads but serve
      different compatibility and workflow needs.
  project-history:
    - >
      Futu developed Futubull as an integrated application for market information,
      investor-community features, charting, paper trading, and supported securities
      transactions.
    - >
      By 2026, Futu's official download surface promoted a next-generation desktop
      client while retaining a separate Futubull Legacy download. The current client
      also incorporates no-code strategy construction, backtesting, and supported live
      algorithmic trading.
  related-projects:
    - Futubull Legacy
    - Futu OpenD and OpenAPI
    - Futu Token
    - moomoo
  sources:
    - 'Official Help Center: https://support.futunn.com/en/'
    - 'Official Mac download page: https://www.futunn.com/en/download/mac'
    - 'Official algorithmic-trading overview: https://support.futunn.com/en/topic605'
    - 'Official product page: https://www.futunn.com/en/download'
    - source_facts.package-manager
  summary:
    - >
      Futubull is Futu's account-based market-data, investment-community, charting,
      paper-trading, and securities-trading application.
  timeline:
    - >
      2021: Official Help Center material documented Futubull's visual
      algorithmic-trading workflow.
    - >
      2026: Futu promoted a next-generation desktop client while continuing to offer a
      separate legacy download.
  usage:
    - >
      Users sign in to follow quotations and news, maintain watchlists, analyze
      securities, use paper-trading features, and access brokerage functions available
      to their account and region.
    - >
      On supported desktop platforms, the Algo workspace can construct and backtest
      strategies and execute supported live trades. Authentication, quote entitlements,
      and transaction verification are service-managed; no official local
      credentials-file path is documented.
