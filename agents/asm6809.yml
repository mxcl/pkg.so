id: brew:asm6809
display-name: asm6809
repo: https://www.6809.org.uk/git/asm6809.git
docs:
  - https://www.6809.org.uk/asm6809
  - https://www.6809.org.uk/asm6809/doc/asm6809.pdf
  - https://www.6809.org.uk/asm6809/doc/asm6809.shtml
  - https://www.6809.org.uk/asm6809/doc/asm6809.txt
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      asm6809 is packaged by Homebrew and Fedora according to the input package facts,
      while the upstream site also offers Debian snapshot builds, an Ubuntu PPA, and
      Windows binaries. Homebrew analytics are small, but that is normal for a
      specialized cross-assembler aimed at 6809 and 6309 retrocomputing.
  package-nerd-significance:
    - >
      For package nerds, asm6809 is a neat example of a retrocomputing tool that still
      behaves like a conventional Unix package: source tarballs, a manpage-style manual,
      distro packages, Windows zips, and a plain Git repository. It is also
      domain-specific in a useful way, preserving Dragon and CoCo workflows without
      pulling in an emulator or full IDE.
  project-history:
    - >
      The upstream changelog records prereleases beginning in August 2013 and an initial
      2.0 release on April 30, 2014. Early 2.x releases added a manpage, macro and
      expression improvements, conditional assembly, output options, and tests.
    - >
      The project has remained active in a small-retro-tooling style rather than moving
      to a large hosting forge. The official site publishes tarballs, Windows builds, a
      Git repository, HTML/PDF/text manuals, and a detailed changelog on the author's
      6809.org.uk domain.
  related-projects:
    - >
      The upstream homepage names LWTOOLS/LWASM and A09 as similar assemblers, and
      points to XRoar as an emulator that can run asm6809 output.
  sources:
    - https://formulae.brew.sh/api/formula/asm6809.json
    - https://www.6809.org.uk/asm6809/
    - https://www.6809.org.uk/asm6809/dl/
    - https://www.6809.org.uk/asm6809/doc/ChangeLog
    - https://www.6809.org.uk/asm6809/doc/asm6809.shtml
    - source_facts.package-manager
  summary:
    - >
      asm6809 is a portable macro cross-assembler for Motorola 6809 and Hitachi 6309
      code. The upstream manual describes those processors as most commonly encountered
      in Dragon and Tandy Colour Computer systems.
  timeline:
    - '2013: First prerelease recorded in the upstream changelog.'
    - '2014: Version 2.0 initial release.'
    - >
      2017: 2.10 added FQB and expression/table fixes after several 2016 and 2017
      compatibility releases.
    - '2019: 2.12 added `--max-passes` and S-record checksum fixes.'
    - '2025: 2.17 released, fixing use of `*` as current PC in expressions.'
  usage:
    - >
      The command reads one or more source files and performs enough passes for symbols
      and addresses to stabilize. It can emit raw binary, DragonDOS binary, CoCo
      RS-DOS/DECB segmented binary, Motorola S-record, and Intel HEX output, plus
      optional listing, exports, and symbol files.
related-packages:
  - id: brew:lwtools
    reason: >
      LWTOOLS' LWASM is the upstream-named alternative when a 6809 project needs OS-9
      modules or its object and linking format, which asm6809 does not support.
    rel: alternative
    sources:
      - https://www.6809.org.uk/asm6809/
      - https://www.lwtools.ca/manual/manual.html
  - id: brew:xroar
    reason: >
      XRoar is the upstream-recommended Dragon and Tandy Color Computer emulator for
      running binaries produced by asm6809.
    rel: adjacent_workflow
    sources:
      - https://www.6809.org.uk/asm6809/
      - https://www.6809.org.uk/xroar/doc/xroar.shtml
