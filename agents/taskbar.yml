history:
  adoption-history:
    - >
      Taskbar is distributed directly by lawand.io and through the official Homebrew
      cask. The official site says it supports both Intel and Apple Silicon Macs across
      a broad range of macOS releases.
    - >
      Its intended audience includes people moving from Windows who prefer one visible
      button per window, as well as macOS users who find the Dock's application-grouped
      model inefficient.
  package-nerd-significance:
    - >
      Taskbar is a native utility that changes a core desktop interaction without
      replacing the macOS window system. Homebrew Cask gives this independently
      distributed application a conventional install and upgrade path.
    - >
      The project is also an example of a proprietary Mac utility using an official
      public GitHub repository for issue tracking and release infrastructure without
      publishing the application source code.
  project-history:
    - >
      Developer Lawand Dalatieh created Taskbar after using an earlier Windows-style
      taskbar replacement that was no longer maintained. The developer describes
      spending roughly a year and a half building the first releases while learning
      native macOS development.
    - >
      Taskbar has shipped publicly since 2024 and has continued to add window previews,
      pinned applications, Spaces and multi-monitor support, configurable appearance,
      and a Start menu.
  related-projects:
    - The official site compares Taskbar with uBar, another macOS Dock alternative.
    - >
      Taskbar complements macOS facilities such as the Dock, Launchpad, Spaces, and
      Accessibility APIs rather than replacing the operating system's window manager.
  sources:
    - https://github.com/lawand-dot-io/taskbar
    - https://lawand.io/taskbar/
    - https://lawand.io/taskbar/intro/
    - https://lawand.io/taskbar/permissions-help/
    - https://lawand.io/taskbar/release-notes/
  summary:
    - >
      Taskbar is a native macOS Dock alternative that presents each open window as a
      separate Windows-style taskbar button.
  timeline:
    - '2024: Taskbar begins shipping publicly.'
    - "2025: The developer publishes an account of the project's origins and development."
    - >
      2026: The Start menu graduates from beta and ongoing releases improve modern macOS
      compatibility.
  usage:
    - >
      Users grant Accessibility permission so Taskbar can enumerate and switch windows.
      Screen Recording permission is additionally needed for optional live window
      thumbnails.
    - >
      Taskbar can show one bar per display, follow Spaces, pin applications, reorder
      window buttons, adjust appearance, hide selected applications, and move or hide
      the standard Dock.
