history:
  adoption-history:
    - >
      Tunnelite is distributed through Homebrew for macOS and Linux, as a .NET global
      tool, and as standalone cross-platform binaries. The project also publishes an SDK
      and ASP.NET Core middleware for embedding tunnels in .NET applications.
  package-nerd-significance:
    - >
      Tunnelite offers an open-source, self-hostable alternative in the local-tunneling
      niche. Its appearance in Homebrew Core makes a .NET-based tunneling client
      available through a conventional native package-manager workflow.
  project-history:
    - >
      Tunnelite was developed as an open-source .NET tunneling system using WebSockets
      and SignalR. The repository contains the client, server, SDK, ASP.NET Core
      integration, deployment workflow, and end-to-end tests.
  related-projects:
    - >
      ngrok: A hosted tunneling service identified by Tunnelite as an alternative point
      of comparison.
    - >
      ASP.NET Core and SignalR: The .NET technologies used by Tunnelite's server and
      application integration.
  sources:
    - https://github.com/cristipufu/tunnelite
    - https://tunnelite.com/
  summary:
    - >
      Tunnelite is an open-source command-line tool and server for exposing local HTTP,
      HTTPS, WebSocket, Server-Sent Events, and self-hosted TCP services through public
      endpoints.
  timeline:
    - >
      2025: The official repository documented Homebrew, .NET-tool, and
      standalone-binary distribution.
    - >
      2026: The official project website presented Tunnelite as an open-source
      local-tunneling and self-hosting solution.
  usage:
    - >
      A typical invocation is `tunnelite http://localhost:3000`, which creates an
      automatically named public URL. Developers commonly use it to demonstrate local
      applications, test webhooks, or reach services behind firewalls.
    - >
      Organizations can self-host the server with wildcard DNS and TLS, then select it
      with `--publicUrl`. TCP tunneling requires a self-hosted server.
