config-file-location:
  unix:
    - ./clickhouse-client.[xml|yaml|yml]
    - $XDG_CONFIG_HOME/clickhouse/config.[xml|yaml|yml]
    - ~/.config/clickhouse/config.[xml|yaml|yml]
    - ~/.clickhouse-client/config.[xml|yaml|yml]
    - /etc/clickhouse-client/config.[xml|yaml|yml]
    - path set by CLICKHOUSE_CONFIG
    - '--config'
credentials-file-location:
  unix:
    - ./clickhouse-client.[xml|yaml|yml]
    - $XDG_CONFIG_HOME/clickhouse/config.[xml|yaml|yml]
    - ~/.config/clickhouse/config.[xml|yaml|yml]
    - ~/.clickhouse-client/config.[xml|yaml|yml]
    - /etc/clickhouse-client/config.[xml|yaml|yml]
    - path set by CLICKHOUSE_CONFIG
    - '--config'
history:
  adoption-history:
    - >
      The project remains niche and ClickHouse-specific, but its own README documents
      standalone Linux and macOS binaries, deb/rpm/tar.gz artifacts, AUR packages,
      Scoop, Homebrew, and availability through ClickHouse as `clickhouse chdig`.
  package-nerd-significance:
    - >
      For package-manager people, chdig is interesting because it packages a
      database-specific operational TUI as both a standalone formula and a ClickHouse
      subcommand, with release artifacts spanning Linux, macOS, Arch/AUR, Scoop, and
      Homebrew.
  project-history:
    - >
      The repository was created in January 2023 by Azat Khuzhin. The README traces the
      idea to everyday ClickHouse debugging work and to a 2022 "Know Your ClickHouse"
      presentation that collected ClickHouse introspection tools before the project
      became an interactive TUI.
  related-projects:
    - ClickHouse is the database being inspected.
    - csysdig is cited by the README as a closer model than top for the interface.
    - >
      flamelens, Perfetto, speedscope, pastila.nl, and viz.js are referenced as related
      tooling for flamegraph, trace, sharing, and query-pipeline workflows.
  sources:
    - https://github.com/azat/chdig
    - https://api.github.com/repos/azat/chdig
    - https://api.github.com/repos/azat/chdig/releases
  summary:
    - >
      chdig is a Rust terminal UI for inspecting ClickHouse systems, positioned by its
      README as a ClickHouse-oriented cousin of top or csysdig for database
      introspection.
  timeline:
    - '2022: Project motivation documented through a Know Your ClickHouse presentation.'
    - '2023: GitHub repository created.'
    - '2023: v0.2.0 release published.'
    - '2024: v24.x releases align the versioning with ClickHouse-era release numbers.'
  usage:
    - >
      Users run chdig against ClickHouse to browse server and query state, use
      flamegraph and Perfetto-oriented views, inspect logs and query pipelines, and
      optionally aggregate across a cluster or include historical system log tables.
related-packages:
  - id: brew:clickhouse
    reason: >
      ClickHouse provides the database and client that chdig inspects, and the official
      chdig README documents a bundled `clickhouse chdig` command.
    rel: adjacent_workflow
    sources:
      - https://github.com/azat/chdig
      - https://clickhouse.com/docs/en/interfaces/cli
