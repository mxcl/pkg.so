history:
  adoption-history:
    - >
      libhdhomerun is packaged because HDHomeRun devices are network tuners rather than
      USB capture hardware, so Unix users need a small vendor protocol tool for
      discovery, status, channel, and streaming setup. The batch input lists packages
      for Alpine, Homebrew, Debian, Nix, Ubuntu, and openSUSE, often exposing the
      hdhomerun_config executable as the user-facing artifact.
  package-nerd-significance:
    - >
      libhdhomerun is small but hardware-specific, which makes it exactly the sort of
      package that matters when the device is on the shelf and useless when it is not.
      In package-manager terms it preserves vendor protocol access in a plain C form,
      independent of larger DVR or media-center applications.
  project-history:
    - >
      The upstream GitHub README carries SiliconDust copyright years 2005-2023 and
      describes the library as implementing the libhdhomerun protocol for use with
      SiliconDust HDHomeRun TV tuners. The same README says a simple make build compiles
      both the library and the hdhomerun_config command-line utility, with
      hdhomerun_device as the top-level API.
    - >
      SiliconDust's HDHomeRun Development Guide PDF was created on September 19, 2011
      and documents libhdhomerun for direct programmatic control of HDHomeRun devices.
      The separate Discover API PDF was created on February 3, 2024, showing that vendor
      documentation for network discovery continued to be maintained long after the
      original C library entered distro packaging.
  related-projects:
    - HDHomeRun is SiliconDust's network TV-tuner device family controlled by the library.
    - hdhomerun_config is the command-line utility built alongside libhdhomerun.
    - >
      DVR and media-center tools use HDHomeRun discovery and control protocols as
      lower-level building blocks.
  sources:
    - https://formulae.brew.sh/formula/libhdhomerun
    - https://github.com/Silicondust/libhdhomerun
    - https://info.hdhomerun.com/info/hdhomerun_config
    - https://raw.githubusercontent.com/Silicondust/libhdhomerun/master/README.md
    - https://www.silicondust.com/hdhomerun/hdhomerun_development.pdf
    - https://www.silicondust.com/hdhomerun/hdhomerun_discover_api.pdf
  summary:
    - >
      libhdhomerun is SiliconDust's C library and command-line utility for controlling
      HDHomeRun network TV tuners. It is a classic hardware-vendor support package: the
      library implements the device protocol, while hdhomerun_config gives users and
      scripts a direct way to discover tuners and send control commands.
  timeline:
    - '2005-2023: The upstream README records SiliconDust copyright years for the library.'
    - '2011-09-19: The HDHomeRun Development Guide PDF was created.'
    - '2024-02-03: The HDHomeRun Discover API PDF was created.'
    - >
      2026: The batch input lists libhdhomerun package coverage across Homebrew, Alpine,
      Debian, Nix, Ubuntu, and openSUSE.
  usage:
    - >
      Users run hdhomerun_config to discover tuners, query or change device variables,
      and script tuner control. Developers link libhdhomerun when they need direct C
      access to HDHomeRun discovery and control APIs from media-center, DVR, or
      diagnostic software.
related-packages:
  - id: cask:jellyfin
    reason: >
      Jellyfin can automatically discover HDHomeRun tuners and use them for watching and
