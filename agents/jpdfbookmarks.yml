history:
  adoption-history:
    - >
      JPdfBookmarks appears as a narrower package than most PDF toolkits: the batch
      facts list Homebrew packaging but not a broad cross-distro matrix. SourceForge
      download counts and reviews show continuing niche use, especially by users who
      need PDF bookmarks after other PDF edits remove or damage outlines.
  package-nerd-significance:
    - >
      JPdfBookmarks matters to package collectors because it is one of those single-job
      PDF utilities that persists outside large office suites. It is useful when
      pdftk-style structural manipulation or a full commercial PDF editor is too broad
      for simply repairing outlines.
  project-history:
    - >
      The SourceForge project was registered on 2010-01-07 and describes JPdfBookmarks
      as software for creating and editing bookmarks on existing PDF files. The file
      archive shows a quick 2.x release sequence through 2010 and 2011, ending with the
      2.5.2 package dated 2011-11-23.
    - >
      The project later exposed a SourceForge Git code area for JPdfBookmarks 3, while
      the main SourceForge project page and wiki remained the public documentation
      surfaces.
  related-projects:
    - >
      SourceForge recommends adjacent PDF bookmark and PDF manipulation tools such as
      PDFtk Bookmarks Editor, PDFTK Builder Enhanced, PDF Split and Merge,
      HandyOutliner, and PDFPatcher.
  sources:
    - https://formulae.brew.sh/formula/jpdfbookmarks
    - https://sourceforge.net/p/jpdfbookmarks/githublink/ci/main/tree/README
    - https://sourceforge.net/p/jpdfbookmarks/wiki/Home/
    - https://sourceforge.net/projects/jpdfbookmarks/
    - https://sourceforge.net/projects/jpdfbookmarks/files/
  summary:
    - >
      JPdfBookmarks is a Java PDF utility for creating and editing bookmarks in existing
      PDF files. Its niche is practical document repair: restore, edit, dump, and load
      outline bookmarks without changing the rest of the PDF workflow.
  timeline:
    - '2010: SourceForge project registered on January 7.'
    - '2010: JPdfBookmarks 2.0.1 appeared in the SourceForge files archive on January 24.'
    - '2010: Multiple 2.x releases followed through 2.4.3 by October 2.'
    - '2011: JPdfBookmarks 2.5.2 appeared in the SourceForge files archive on November 23.'
    - >
      2026: SourceForge project page showed project activity and a 2026-04-18
      last-update date.
  usage:
    - >
      The project page lists GUI and command-line use: add bookmarks, edit bookmarks,
      create bookmark targets for web pages or files, and reorganize outlines by
      dragging and dropping in the interface.
