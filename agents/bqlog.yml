history:
  adoption-history:
    - >
      Tencent describes BqLog as battle-tested in Honor of Kings. Its integration
      surface grew beyond C++ to Java, Kotlin, C#, Python, Node.js, Go, HarmonyOS and
      game engines, while official packages became available through language registries
      and release archives.
  package-nerd-significance:
    - >
      BqLog is notable to package enthusiasts as an industrial logging implementation
      that couples unusually broad language bindings with compressed binary logs,
      decoding utilities, encryption and game-engine plugins. Its Homebrew formula
      exposes the category generator and offline decoder rather than merely installing
      another application logger.
  project-history:
    - >
      BqLog originated at Tencent as a lightweight, high-performance logging system used
      in production game workloads. The 1.x line established its cross-platform core and
      wrappers; the changelog identifies 1.5.0 as the final stable release before the
      next major redesign.
    - >
      BqLog 2.x was rebuilt around wider Unix support, native HarmonyOS and Node.js
      integrations, a revised configuration model, hybrid encryption, more capable
      recovery and separately distributed platform and language packages.
  related-projects:
    - The official benchmark compares BqLog with fmtlog, quill, spdlog, glog and Log4j2.
    - >
      Official integrations cover Unity, Tuanjie Engine and Unreal Engine, including
      Blueprint support.
  sources:
    - https://github.com/Tencent/BqLog#readme
    - https://github.com/Tencent/BqLog/blob/main/CHANGELOG.md
    - https://github.com/Tencent/BqLog/blob/main/docs/ADVANCED_USAGE.md
    - https://github.com/Tencent/BqLog/blob/main/docs/INTEGRATION_GUIDE.md
  summary:
    - >
      BqLog is Tencent's cross-language logging system, designed for low logging-thread
      overhead, compressed or text appenders, crash recovery and optional encrypted logs
      across application, server and game-engine environments.
  timeline:
    - '1.5.0: Final stable release of the 1.x series.'
    - '2026-02-08: BqLog 2.x is announced as a ground-up major redesign.'
    - '2026-07: The 2.4 line improves configuration, performance and release portability.'
  usage:
    - >
      Applications construct a configuration string defining console, text-file or
      compressed-file appenders and pass it when creating a log object. The same core
      can be reached through the project's language wrappers.
    - >
      The Homebrew package is especially useful for its category-code generator and
      LogDecoder utilities; encrypted compressed logs can be decoded offline with a
      private key.
