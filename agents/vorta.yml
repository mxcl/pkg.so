credentials-file-location: null
history:
  adoption-history:
    - >
      Vorta expanded Borg's reach from command-line users to Linux and macOS desktop
      users. Official distribution channels include PyPI, Flatpak, Linux distribution
      repositories, and signed macOS application releases.
    - >
      Linux packaging includes official or community-maintained packages in
      Debian-derived distributions, Arch Linux, and EPEL-based enterprise distributions,
      making Vorta accessible without a Python-centric installation workflow.
  package-nerd-significance:
    - >
      Vorta is important in package-manager culture because it wraps Borg's encrypted,
      compressed, deduplicated repository format in a desktop workflow without imposing
      a proprietary backup format or storage provider. Users can target local media,
      their own SSH server, or a hosted Borg service.
  project-history:
    - >
      Vorta was created by Manuel Riel and has been developed as a GPLv3 application
      since 2018. It is implemented with Python and Qt and delegates backup storage and
      archive operations to BorgBackup.
    - >
      The project evolved into a cross-distribution desktop client with profiles,
      scheduling, archive browsing, restore operations, and platform-native packaging
      for Linux and macOS.
  related-projects:
    - >
      Vorta is a graphical frontend for BorgBackup. BorgBase is a compatible hosted
      backup service, but Vorta can also use self-hosted or local Borg repositories.
  sources:
    - https://github.com/borgbase/vorta
    - https://vorta.borgbase.com/
    - https://vorta.borgbase.com/faq/
    - https://vorta.borgbase.com/install/linux/
  summary:
    - >
      Vorta is an open-source desktop backup client for BorgBackup on Linux and macOS.
      It manages backup profiles, repositories, schedules, archives, and restores while
      retaining Borg's encryption, deduplication, and compression.
  timeline:
    - '2018: Vorta development began under Manuel Riel.'
    - >
      Vorta became available through PyPI and desktop-oriented distribution channels
      including Flatpak and Linux repositories.
    - '2023: Vorta participated in Google Summer of Code with student contributors.'
  usage:
    - >
      Users define source folders and a local or remote Borg repository, choose
      exclusions and retention rules, schedule backups, browse point-in-time archives,
      and restore selected files. Multiple profiles can separate destinations, source
      sets, and schedules.
