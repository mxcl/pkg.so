config-file-location:
  macos:
    - ~/Library/Application Support/Dropzone/
    - ~/Library/Preferences/com.aptonic.Dropzone4.plist
    - ~/Library/Preferences/com.aptonic.Dropzone-setapp.plist (Setapp edition)
credentials-file-location: null
history:
  adoption-history:
    - >
      Dropzone developed a long-running following among macOS users who favor
      drag-and-drop utilities and launcher-style workflow tools. It moved through paid
      major releases, entered the Mac App Store, added Setapp distribution, and adopted
      a free base application with optional Pro features for Dropzone 4.
  package-nerd-significance:
    - >
      Dropzone is representative of the highly scriptable macOS utility tradition
      associated with tools such as Quicksilver and TextExpander. Its action bundles,
      cloud-upload integrations, direct, Mac App Store, and Setapp variants, and later
      command-line interface create unusually rich packaging and sandboxing
      considerations for a menu-bar utility.
  project-history:
    - >
      Aptonic launched Dropzone in July 2009 as a macOS drag-and-drop utility with a
      scripting API. Dropzone 3 arrived in 2014 with a redesigned grid, actions, task
      progress, and Drop Bar. Dropzone 4 launched in January 2020 with a redesigned
      interface, dark mode, Catalina support, built-in Google Drive integration, and a
      free-plus-Pro subscription model; a direct edition later restored a
      lifetime-purchase option.
  related-projects:
    - >
      Dropzone Actions extend the application with built-in and downloadable file,
      cloud, media, and automation workflows.
    - >
      The dz command-line tool later exposed actions and Drop Bar operations to terminal
      scripts.
    - >
      Dropzone 5 succeeded Dropzone 4 in 2026 while Aptonic retained an official
      Dropzone 4 download page.
  sources:
    - https://aptonic.com/
    - https://aptonic.com/blog/dropzone-4-released
    - https://aptonic.com/blog/page/4
    - https://aptonic.com/blog/page/6
    - https://aptonic.com/dropzone4
  summary:
    - >
      Dropzone is an Aptonic macOS productivity utility that turns drag-and-drop
      gestures into file-management, application-launching, upload, sharing, and
      automation actions.
  timeline:
    - '2009-07-02: Aptonic launched the original Dropzone.'
    - '2014-07-01: Dropzone 3 launched with a redesigned action grid and Drop Bar workflow.'
    - '2020-01-29: Dropzone 4 launched with a redesigned interface and free-plus-Pro model.'
    - '2020-09-02: A direct Dropzone 4 edition added a lifetime Pro purchase option.'
    - '2025: Dropzone 4 added the dz command-line integration.'
    - '2026-03-21: Dropzone 5 succeeded Dropzone 4 as the current major release.'
  usage:
    - >
      Users drag files to the top-of-screen Dropzone target and drop them on configured
      actions to move, copy, rename, upload, share, or transform them. Drop Bar
      temporarily stages files gathered from different applications, while add-on
      actions and the dz command-line tool support customized and scripted workflows.
