history:
  adoption-history:
    - >
      The application's long version history tracks changes in macOS and network
      services: it gained router-aware address lookup, Universal builds, Retina support,
      code signing, 64-bit support, notarization, Apple Silicon support, country
      display, VPN-address display, and several replacements for retired external-IP
      services.
  package-nerd-significance:
    - >
      Package enthusiasts value it as a small, long-lived example of the classic macOS
      status-item utility: a single application bundle, minimal installation, login-item
      compatibility, and narrowly focused network visibility.
  project-history:
    - >
      Monkeybread Software developed IP in menubar as freeware and as an example of
      building a macOS status item with Xojo and the company's MBS plugins. Its official
      changelog reaches back through releases 2.0, 3.x, and 4.x.
  related-projects:
    - The official page points users needing broader monitoring features to iStat Menus.
    - The application serves as an example for Xojo and the MBS NSStatusItemMBS class.
  sources:
    - 'Official Monkeybread Software catalog: https://www.monkeybreadsoftware.de/Software/'
    - >
      Official product page and changelog:
      https://www.monkeybreadsoftware.de/Software/IPinmenubar.shtml
  summary:
    - >
      IP in menubar is a small Monkeybread Software freeware utility that runs in the
      background and displays a Mac's current IP address in the menu bar.
  timeline:
    - 'Version 2.0: Added router support through a configuration file.'
    - 'Version 3.0: Added event-driven updates and copying from the menu.'
    - 'Version 4.0: Became a Universal application.'
    - 'Version 4.4: Added Retina support and code signing.'
    - '2019: Version 4.6 became 64-bit and notarized.'
    - 'Version 4.7: Added an Apple Silicon Universal build.'
    - 'Version 4.7.2: Switched the country lookup service to ip-api.com.'
  usage:
    - >
      Users launch the application to show local or external IP information in the menu
      bar, customize its appearance, optionally display country or VPN information, and
      add it to macOS Login Items for automatic startup.
