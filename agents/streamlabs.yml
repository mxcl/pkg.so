history:
  adoption-history:
    - >
      Streamlabs positioned Desktop as an approachable all-in-one alternative for
      creators who found traditional broadcasting tools difficult to configure. It
      combines scenes, chat, alerts, themes, recent events, and stream setup in one
      application.
    - >
      The source repository has accumulated thousands of stars and thousands of commits.
      Distribution for both Windows and macOS, together with integration across major
      streaming platforms, made it a prominent OBS-derived broadcasting client.
  package-nerd-significance:
    - >
      Streamlabs Desktop is a large production Electron application embedding OBS
      technology, making it notable to packagers for its mix of JavaScript, native
      modules, media capture, code signing, platform permissions, and frequent upstream
      development.
    - >
      It also illustrates the open-source lineage common in streaming software: a
      commercial creator platform shipping a GPL-licensed desktop client built around
      OBS while maintaining its own services and user experience.
  project-history:
    - >
      Streamlabs grew from TwitchAlerts, an alerts and donations service acquired by
      Vulcan in fall 2015 and quickly rebranded. The company subsequently pursued a
      fully integrated streaming application, leading to Streamlabs Desktop.
    - >
      The desktop client was built on OBS and Electron as a powerful but approachable
      all-in-one broadcasting environment. Streamlabs later marked the 1.0 release as
      the point at which the product left beta.
  related-projects:
    - OBS Studio supplies the core broadcasting lineage and technology.
    - >
      Streamlabs' alerts, widgets, themes, chat, and creator services are integrated
      into Desktop.
  sources:
    - https://github.com/streamlabs/desktop
    - https://streamlabs.com/content-hub/post/streamlabs-desktop-v1-is-officially-here
    - >
      https://support.streamlabs.com/hc/en-us/articles/53398599968923-Get-started-with-Streamlabs-Desktop
  summary:
    - >
      Streamlabs Desktop is an open-source, OBS-based desktop application for live
      streaming and recording. It packages broadcasting, scene composition, chat,
      alerts, themes, and creator services into an Electron client.
  timeline:
    - '2015: TwitchAlerts was acquired and rebranded as Streamlabs.'
    - >
      2018: Streamlabs published its early getting-started material for the desktop
      broadcasting application.
    - '2021: Streamlabs Desktop 1.0 formally left beta.'
  usage:
    - >
      Users connect a Streamlabs ID or supported streaming account, grant camera and
      microphone access, configure scenes and sources, and then stream live or record
      locally.
    - >
      Existing OBS Studio settings can be imported during onboarding. Typical workflows
      add overlays, alerts, chat, audio and video sources, and platform-specific stream
      settings before going live.
