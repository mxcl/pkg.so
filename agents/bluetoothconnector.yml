id: brew:bluetoothconnector
display-name: BluetoothConnector
repo: null
docs:
  - https://github.com/lapfelix/BluetoothConnector
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its adoption is centered on macOS users who want a scriptable Bluetooth action for
      headphones or other paired devices. Homebrew made it installable as
      bluetoothconnector, while Mint support fit Swift CLI users.
  package-nerd-significance:
    - >
      BluetoothConnector is a neat example of a tiny Mac-only utility becoming
      package-manager material: one executable, one hardware annoyance, Homebrew
      distribution, and enough SwiftPM structure for repeatable builds.
  project-history:
    - >
      Felix Lapalme wrote BluetoothConnector to make switching BeatsX earbuds from an
      iPhone to a Mac easier. The README frames it as a simple personal macOS CLI, with
      releases, Homebrew installation, Mint installation, and manual Swift Package
      Manager build instructions.
    - >
      The tag history starts at 1.0 in 2017 and reaches the 2.x line by 2023, with the
      project continuing as a compact utility rather than a broad Bluetooth management
      suite.
  related-projects:
    - Homebrew and Mint are documented installation paths.
    - macOS Automator is documented as the suggested keyboard-shortcut integration.
    - Apple's IOBluetooth/macOS Bluetooth stack is the underlying platform target.
  sources:
    - https://github.com/lapfelix/BluetoothConnector#readme
    - https://github.com/lapfelix/BluetoothConnector/releases
    - source_facts.package-manager
  summary:
    - >
      BluetoothConnector is a small macOS Swift command-line tool for connecting,
      disconnecting, or toggling a Bluetooth device by MAC address.
  timeline:
    - '2017: 1.0 tag published.'
    - >
      2019: README screenshots and workflow instructions documented Notification Center
      and Automator usage.
    - '2023: 2.1.0 tag published.'
    - '2025: Repository activity shows continued maintenance work.'
  usage:
    - >
      Users pass a Bluetooth MAC address and choose connect, disconnect, or default
      toggle behavior. The tool can also request macOS Notification Center feedback and
      the README shows an Automator service workflow for binding the command to a
      keyboard shortcut.
    - >
      No persistent configuration or credentials file is documented; the device address
      is supplied on the command line or embedded by the user in an Automator workflow.
related-packages:
  - id: brew:blueutil
    reason: >
      Choose blueutil when macOS automation also needs adapter power, discoverability,
      pairing, device queries, wait operations, or structured JSON output rather than
      only connection toggling.
    rel: alternative
    sources:
      - https://github.com/lapfelix/BluetoothConnector#readme
      - https://github.com/toy/blueutil#readme
  - id: brew:bluetuith
    reason: >
      Choose bluetuith for an interactive cross-platform terminal interface with
      pairing, device menus, media control, and file transfers instead of a
      single-purpose macOS command.
    rel: alternative
    sources:
      - https://github.com/lapfelix/BluetoothConnector#readme
      - https://github.com/bluetuith-org/bluetuith#readme
