id: brew:mjml
display-name: MJML
repo: https://github.com/mjmlio/mjml
docs:
  - https://documentation.mjml.io/
config-file-location:
  unix:
    - .mjmlconfig
credentials-file-location: null
history:
  project-history:
    - >
      The MJML engine transpiles `<mj-*>` components into responsive email HTML. Its
      documentation presents semantic components such as sections and columns as the
      central workflow: developers write MJML templates, use built-in or custom
      components, and let the engine produce email-client-oriented HTML. The homepage
      also identifies a community and user ecosystem around email tooling, including
      integrations or public users such as Sinch Mailjet, Email Love, Parcel.io,
      GrapesJS, Spatie, Typeform, and Litmus-related template work.
  sources:
    - https://documentation.mjml.io/
    - https://formulae.brew.sh/formula/mjml
    - https://github.com/mjmlio/mjml
    - https://mjml.io/
  summary:
    - >
      MJML, the Mailjet Markup Language, was created in early 2015 by Mailjet developers
      while they were working on Passport, Mailjet's drag-and-drop interface for
      responsive emails. The project began from the observation that responsive HTML
      email was difficult because email clients render HTML inconsistently, so the team
      built a higher-level markup language that abstracts tables, inline CSS, and
      client-specific quirks.
  usage:
    - >
      As a package, MJML sits in the email-development niche rather than general web
      templating. Homebrew exposes the `mjml` CLI for compiling templates locally, while
      the upstream documentation and GitHub project support use in Node-based build
      systems and template pipelines.
related-packages: []
tags:
