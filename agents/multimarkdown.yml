history:
  project-history:
    - >
      Technically, MultiMarkdown's role is not just "Markdown to HTML." It adds features
      such as tables, footnotes, citations, metadata, and smart typography, and it
      targets workflows that end in HTML, LaTeX/PDF, OPML, and OpenDocument/Flat
      OpenDocument files that can be carried into word processors. The Homebrew package
      exposes both the main `multimarkdown` command and convenience front ends such as
      `mmd2pdf`, `mmd2tex`, `mmd2epub`, `mmd2odt`, and `mmd2opml`, making it a
      document-conversion package rather than only a web publishing filter.
  sources:
    - https://fletcherpenney.net/multimarkdown/
    - https://formulae.brew.sh/formula/multimarkdown
    - https://github.com/fletcher/MultiMarkdown-6
    - https://multimarkdown.com/about/
  summary:
    - >
      MultiMarkdown is Fletcher T. Penney's extension of John Gruber's Markdown, created
      to keep Markdown's readable plain-text writing style while adding
      document-oriented features and additional output formats. Penney's own description
      says MultiMarkdown began as a Perl script modified from Markdown.pl; later
      versions became a standalone converter and syntax family. MultiMarkdown Software
      describes Penney as the author and summarizes the format as a Markdown superset
      for converting minimally formatted text into HTML, LaTeX, and other formats.
  usage:
    - >
      Its ecosystem niche overlaps with Pandoc, Markdown processors, and
      editor-integrated previewers, but MultiMarkdown is distinctive for being both a
      syntax specification and a compact conversion tool with a long
      Mac/document-authoring lineage. Package managers such as Homebrew, MacPorts, Nix,
      and Linux distributions carry it for users who want repeatable command-line
      document builds without adopting a larger universal converter.
related-packages:
  - id: brew:pandoc
    reason: >
      Choose Pandoc when you need a universal converter spanning many markup,
      word-processing, ebook, presentation, and data formats; choose MultiMarkdown for
      its specific syntax and lighter document-authoring workflow.
    rel: alternative
    sources:
      - https://fletcher.github.io/MultiMarkdown-6/introduction.html
      - https://pandoc.org/
