history:
  adoption-history:
    - >
      The libmtp homepage explicitly lists downstreams and related clients such as GVFS
      MTP support for GNOME, KIO-MTP for KDE, go-mtpfs, XNJB, Gnomad2, Amarok, and
      Rhythmbox. That downstream list captures why the library became the common Unix
      packaging point for MTP access.
    - >
      Package managers ship both the shared library and many small mtp-* utilities,
      letting users inspect devices, transfer files, manage playlists, and debug unknown
      vendor/product IDs without writing code.
  package-nerd-significance:
    - >
      libmtp matters to packagers because it turns a messy device protocol and vendor-ID
      database into one shared dependency. It is also a classic example of a library
      whose command-line tools are as important for debugging support tickets as the
      library ABI is for applications.
  project-history:
    - >
      The project grew around the practical problem that MTP devices are not normal
      mounted filesystems. The upstream homepage describes libmtp as an initiator
      implementation of MTP Basic, and the README explains the difference between a
      host-side initiator and a device-side responder.
    - >
      Copyright notices in the public headers and examples show active authorship
      beginning in 2005, including Linus Walleij and other contributors. Over time the
      project accumulated a large device database, examples, command-line tools, and
      downstream integrations for desktop environments and media applications.
  related-projects:
    - >
      libmtp is related to libgphoto2's PTP/MTP handling, but the README explains that
      libmtp stays closer to the MTP object model rather than presenting everything as
      files. Desktop integrations include GVFS and KIO-MTP, while go-mtpfs and XNJB are
      standalone client examples.
  sources:
    - https://formulae.brew.sh/formula/libmtp
    - https://github.com/libmtp/libmtp
    - https://github.com/libmtp/libmtp/blob/master/src/libmtp.h.in
    - https://libmtp.sourceforge.net/
    - https://sourceforge.net/p/libmtp/code/ci/HEAD/tree/README
  summary:
    - >
      libmtp is a POSIX-oriented C implementation of the Media Transfer Protocol
      initiator side: host software talks to MTP responders such as media players,
      phones, and other portable devices.
  timeline:
    - '2005: Public source copyright notices begin for libmtp authorship and examples.'
    - >
      2007: Additional contributors and device support appear in public source copyright
      notices.
    - '2008: Several libmtp source files record continued authorship and device-support work.'
    - >
      2010s: GNOME, KDE, FUSE, and media-player clients use libmtp or related MTP access
      paths.
    - >
      2020s: The project maintains SourceForge and GitHub source surfaces plus release
      packaging across Unix distributions.
  usage:
    - >
      Typical usage is through desktop file managers, media players, FUSE clients, or
      the bundled commands such as mtp-detect, mtp-files, mtp-getfile, and mtp-sendfile.
      The upstream site asks users with unrecognized devices to submit USB IDs and
      mtp-detect output, reflecting the device-quirk maintenance model.
related-packages:
  - id: brew:simple-mtpfs
    reason: >
      Use simple-mtpfs with libmtp when you want an attached MTP device presented as a
      FUSE-mounted filesystem.
    rel: adjacent_workflow
    sources:
      - https://github.com/phatina/simple-mtpfs#readme
  - id: brew:libgphoto2
    reason: >
      Choose libgphoto2 when a camera-oriented workflow also needs MTP access; libmtp
      instead exposes a dedicated MTP object API and tracks libgphoto2's PTP
      implementation.
    rel: alternative
    sources:
      - https://github.com/libmtp/libmtp#readme
      - https://github.com/gphoto/libgphoto2/blob/master/README.md
