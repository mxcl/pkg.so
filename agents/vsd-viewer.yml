history:
  adoption-history:
    - >
      Nektony developed the viewer for Mac users who receive Microsoft Visio business
      diagrams but do not have Visio itself. Later releases added broader format
      coverage and capabilities including layers, shape data, hyperlinks, PDF
      conversion, printing, and support for newer macOS versions.
  package-nerd-significance:
    - >
      VSD Viewer fills a focused interoperability gap in the Mac desktop ecosystem:
      package-managed installation gives administrators a lightweight reader for
      proprietary Visio formats without deploying a full diagram editor or uploading
      sensitive diagrams to an online converter.
  project-history:
    - >
      Nektony announced VSD Viewer 1.0 for Mac OS X on April 11, 2013. The initial
      release focused on opening Visio 2000–2010 VSD drawings, including multipage
      documents, layers, hidden text, and embedded metafile content.
  related-projects:
    - >
      Nektony's VSDX Annotator builds on the viewing use case by adding annotation and
      VSDX editing features.
    - >
      Microsoft Visio is the originating application for the drawing formats handled by
      VSD Viewer.
  sources:
    - >
      Official 2013 release announcement:
      https://nektony.com/wp-content/uploads/2020/08/nektony-announces-release-of-vsd-viewer-for-mac-os-x.pdf
    - 'Official help page: https://nektony.com/help/vsd-viewer-mac'
    - 'Official product page: https://nektony.com/free-visio-viewer-mac'
    - 'Official release notes: https://nektony.com/release-notes'
  summary:
    - >
      VSD Viewer is Nektony's macOS application for opening, inspecting, printing, and
      converting Microsoft Visio drawings without Microsoft Visio.
  timeline:
    - '2013: Nektony released VSD Viewer 1.0 for Mac OS X.'
    - >
      2022: Version 6.16 added macOS Ventura optimization and copying page content to
      the clipboard.
    - '2022: Version 6.16.1 improved rendering of VSDX drawings containing embedded images.'
  usage:
    - >
      Users open VSD, VDX, VSDX, and related Visio files locally, navigate multipage
      diagrams, inspect layers and shape data, follow hyperlinks, print drawings, or
      convert them to PDF. The local workflow avoids sending documents to an online
      converter.
