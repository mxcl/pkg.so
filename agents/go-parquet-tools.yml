config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project packages a Parquet inspection workflow for users who want a single
      static-style CLI instead of a JVM-oriented toolchain. Its README documents
      releases, Homebrew installation, container images, and prebuilt deb and RPM
      packages.
  package-nerd-significance:
    - >
      For package users, go-parquet-tools is significant because Parquet debugging is
      common in data pipelines, and a small CLI with packaged binaries lowers the cost
      of checking column encodings, row groups, encryption metadata, and file layout
      during development or incident response.
  project-history:
    - >
      The public repository was created in 2021. Its README describes a utility to
      inspect Parquet files and documents a growing command set for reading, importing,
      merging, splitting, transcoding, and reporting metadata from Parquet data.
  related-projects:
    - >
      Apache Parquet is the columnar storage format the tool inspects and rewrites.
      Homebrew distributes the command as go-parquet-tools while the executable is named
      parquet-tools.
  sources:
    - https://api.github.com/repos/hangxie/parquet-tools
    - https://formulae.brew.sh/formula/go-parquet-tools
    - https://github.com/hangxie/parquet-tools
    - https://github.com/hangxie/parquet-tools/releases
  summary:
    - >
      parquet-tools is a Go command-line utility for inspecting and manipulating Apache
      Parquet files.
  timeline:
    - '2021: Public GitHub repository created.'
    - '2024: v1.x releases available for the Go CLI.'
    - '2026: v1.52.0 release published.'
  usage:
    - >
      Practitioners use parquet-tools to print schemas, row counts, metadata, and
      records; import CSV, JSON, or JSONL into Parquet; merge or split files; and
      transcode compression or encoding. The README also documents access to local files
      and remote storage such as S3, GCS, Azure storage, HDFS, and HTTP endpoints.
related-packages:
  - id: brew:parquet-cli
    reason: >
      Apache Parquet CLI offers overlapping inspection and conversion commands from the
      official Java implementation; choose it for Hadoop or parquet-java workflows and
      go-parquet-tools for a Go-based standalone utility with broad remote-storage
      support.
    rel: alternative
    sources:
      - https://github.com/hangxie/parquet-tools
      - https://github.com/apache/parquet-java/blob/master/parquet-cli/README.md
  - id: brew:duckdb
    reason: >
      DuckDB complements parquet-tools by running SQL directly over Parquet files and
      exposing Parquet metadata as queryable tables after low-level inspection
      identifies what needs analysis.
    rel: adjacent_workflow
    sources:
      - https://github.com/hangxie/parquet-tools
      - https://duckdb.org/docs/lts/data/parquet/overview
      - https://duckdb.org/docs/current/data/parquet/metadata
