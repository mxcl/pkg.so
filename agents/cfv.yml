    - https://github.com/cfv-project/cfv
    - https://github.com/cfv-project/cfv/blob/python3/README.md
    - https://github.com/cfv-project/cfv/blob/python3/cfv.1
    - https://formulae.brew.sh/api/formula/cfv.json
  repo-sources:
    - Official README says this maintained fork is at https://github.com/cfv-project/cfv.
    - >
      source_facts.homepage identifies the official project repository as
      https://github.com/cfv-project/cfv.
  tags-sources:
    - >
      Official README lists supported checksum/hash formats including sfv, crc, md5, sha
      variants, BLAKE3, and torrent files.
    - >
      Official cfv.1 synopsis and options show it is a command-line utility for testing
