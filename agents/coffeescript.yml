history:
  adoption-history:
    - >
      CoffeeScript was packaged broadly because it was both a language compiler and a
      day-to-day CLI. The official README documents npm installation for local project
      use and global execution, while the supplied package facts list Homebrew, Debian,
      Nix, Arch/pacman, Scoop, Ubuntu, and winget packages.
    - >
      The official site describes CoffeeScript as part of the JavaScript ecosystem and
      lists related integrations, books, build tools, and editor support. It also notes
      that CoffeeScript's fat arrow was one of its most popular features and that ES2015
      adopted a corresponding arrow-function syntax.
  package-nerd-significance:
    - >
      CoffeeScript is historically significant to package managers because it represents
      an early JavaScript-to-JavaScript language distributed as a Node CLI, a browser
      compiler, and OS packages. Its package history mirrors a period when language
      tools moved from standalone tarballs and distro packages into npm-centered
      workflows while still being wrapped by Homebrew and Linux distributions.
  project-history:
    - >
      The official changelog begins in December 2009 and shows CoffeeScript quickly
      evolving around the JavaScript and Node.js ecosystem. Early 2010 releases added
      the class syntax, switched the default JavaScript engine from Narwhal to Node.js,
      added Node require-extension support, and kept pace with early Node releases.
    - >
      CoffeeScript 2 repositioned the compiler for modern JavaScript output. The
      official documentation says the biggest CoffeeScript 2 change is that the compiler
      now emits ES2015-and-later syntax where possible, with features such as async
      functions and JSX, while later documentation discusses Babel transpilation when
      older runtimes need support.
  related-projects:
    - >
      The official docs connect CoffeeScript to Node.js, npm, Babel, browser compilers,
      source maps, Cakefiles, and JavaScript ecosystem integrations.
  sources:
    - https://coffeescript.org/
    - https://github.com/jashkenas/coffeescript#readme
  summary:
    - >
      CoffeeScript is a programming language and compiler that turns CoffeeScript source
      into JavaScript. Its command-line package provides coffee for running or compiling
      .coffee files and cake for task definitions.
  timeline:
    - '2009: The official changelog starts with December 2009 releases.'
    - >
      2010: Early releases added classes, Node.js as the default engine, Node
      require-extension support, and directory compilation behavior.
    - >
      2017: CoffeeScript 2 alpha and beta releases introduced ES2015+ output; the
      official changelog dates the initial alpha to February 21 and the initial beta to
      April 14.
    - 'Current docs: CoffeeScript 2.7.0 is the documented source version on the official site.'
  usage:
    - >
      Common package usage is to install Node.js, install the coffeescript package, run
      scripts with coffee, compile with coffee -c, and use Cakefiles for task
      automation. CoffeeScript 2 output may require runtime support for modern
      JavaScript or a transpilation step through tools such as Babel.
related-packages:
  - id: brew:node
    reason: >
      CoffeeScript's official command-line utility runs on Node.js, so Node supplies the
      runtime used by `coffee`, `cake`, and npm-based installation workflows.
    rel: adjacent_workflow
    sources:
      - https://coffeescript.org/#installation
      - https://nodejs.org/en/about
  - id: brew:babel
    reason: >
      CoffeeScript has built-in Babel integration for transforming its modern JavaScript
      output when a project must support older runtimes.
    rel: adjacent_workflow
    sources:
      - https://coffeescript.org/#transpilation
      - https://babeljs.io/docs/
