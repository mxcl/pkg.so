history:
  adoption-history:
    - >
      SuperTuxKart became a recognizable free-software game, with official binaries for
      Linux, Windows, macOS, Android, and Switch homebrew as well as downstream packages
      in additional systems.
    - >
      The official FAQ reports more than five million downloads. Community participation
      also produced hundreds of add-on tracks and karts, while the game was used in
      academic research and technology demonstrations.
  package-nerd-significance:
    - >
      SuperTuxKart is a prominent example of a substantial, cross-platform open-source
      game that can be built and redistributed independently of a proprietary game
      store.
    - >
      Its cast and world draw on mascots from free and open-source projects, giving the
      game a distinctive place in package-manager and Linux-desktop culture. Its long
      development also demonstrates how a community fork can replace most of its
      predecessor's technology and assets.
  project-history:
    - >
      The lineage began with Steve Baker's TuxKart in April 2000. After TuxKart entered
      maintenance mode, contributors preserved Game of the Month work in a fork named
      SuperTuxKart in December 2004.
    - >
      Joerg Henrichs resumed work in 2006, fixing serious stability and performance
      problems. With Eduardo Hernandez Munoz, he published SuperTuxKart 0.2 in September
      2006, establishing the continuing project.
    - >
      The game subsequently replaced its interface and rendering technology, expanded
      community add-ons and game modes, and reached version 1.0 with online multiplayer
      in April 2019. SuperTuxKart Evolution, presented as a new game in the same series,
      was announced in August 2025.
  related-projects:
    - TuxKart is the original game from which SuperTuxKart was forked.
    - STK Addons is the official community repository for downloadable tracks and karts.
    - SuperTuxKart Evolution is the officially announced next game in the series.
  sources:
    - https://blog.supertuxkart.net/2026/04/the-history-of-supertuxkart.html
    - https://github.com/supertuxkart/stk-code
    - https://supertuxkart.net/FAQ
    - https://supertuxkart.net/History_of_SuperTuxKart
  summary:
    - >
      SuperTuxKart is a free, open-source, cross-platform kart-racing game with story,
      time-trial, local multiplayer, online multiplayer, and additional
      community-created content.
  timeline:
    - '2000: Development of the predecessor TuxKart began.'
    - '2004: Contributors preserved later TuxKart work in a fork named SuperTuxKart.'
    - "2006: SuperTuxKart 0.2 became the revived project's first public release."
    - >
      2010: The project began public testing of its extensively reworked 0.7 generation
      and separated STK Addons into its own service.
    - '2015: Version 0.9 introduced the modern graphics renderer.'
    - '2019: Version 1.0 introduced production online multiplayer.'
    - '2025: SuperTuxKart Evolution was announced.'
  usage:
    - >
      Players use story mode, individual races, time trials, soccer, egg hunts, local
      multiplayer, and online multiplayer. Community add-ons extend the supplied tracks
      and karts.
    - >
      Per-user graphics, controls, player, and gameplay preferences are stored in
      config.xml beneath the versioned configuration directory. Online identity data is
      managed by the game, but official documentation does not establish a separate
      credentials file.
