history:
  adoption-history:
    - >
      gifski attracted users who cared more about perceptual quality than minimum file
      size. Its upstream documentation points to prebuilt releases, Homebrew, cargo
      installation, C library use, Windows and macOS GUI paths, and release downloads
      for Linux, macOS, and Windows.
  package-nerd-significance:
    - >
      gifski is notable in package collections because it represents the modern Rust
      side of GIF tooling: a CLI, reusable C-compatible library, cargo package, Homebrew
      formula, and GUI-adjacent encoder with explicit tradeoffs around GIF quality, file
      size, and licensing.
  project-history:
    - >
      The official repository presents gifski as a GIF encoder based on pngquant and
      libimagequant ideas, using cross-frame palettes and temporal dithering to work
      around GIF format limits. The project provides a CLI and can also be built as a
      C-compatible library for integration into other applications.
  related-projects:
    - >
      gifski is closely related to pngquant and libimagequant. It also complements
      ffmpeg for frame extraction and Gifsicle for downstream GIF manipulation or
      optimization.
  sources:
    - https://gif.ski/
    - https://github.com/ImageOptim/gifski
    - https://raw.githubusercontent.com/ImageOptim/gifski/main/README.md
    - source_facts.repo
  summary:
    - >
      gifski is a Rust GIF encoder from the ImageOptim/pngquant ecosystem, designed to
      produce high-quality animated GIFs from video frames or PNG sequences.
  timeline:
    - '2017: Repository-era gifski releases began in the ImageOptim ecosystem.'
    - '2018: Transparency support and GUI-adjacent packaging paths broadened usage.'
    - >
      2020s: Homebrew, cargo, native installers, and library builds widened distribution
      paths.
    - '2020s: Upstream documentation continued to emphasize ffmpeg and PNG-frame workflows.'
  usage:
    - >
      Practitioners feed gifski either a stream from ffmpeg in YUV4MPEG format or a
      directory of PNG frames exported from animation or video software. They tune
      output size and quality with width, height, frame rate, quality, lossy quality,
      and motion quality options.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Use FFmpeg to decode a video and stream YUV4MPEG frames directly into gifski,
      following gifski's officially documented video-to-GIF pipeline.
    rel: adjacent_workflow
    sources:
      - https://github.com/ImageOptim/gifski/blob/main/README.md
      - https://ffmpeg.org/documentation.html
  - id: brew:gifsicle
    reason: >
      Choose Gifsicle when editing, assembling, or aggressively optimizing existing GIF
      frames matters more than gifski's high-quality video-frame encoding.
    rel: alternative
    sources:
      - https://github.com/ImageOptim/gifski/blob/main/README.md
      - https://www.lcdf.org/gifsicle/
      - https://www.lcdf.org/gifsicle/man.html
