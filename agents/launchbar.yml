credentials-file-location: null
history:
  adoption-history:
    - >
      LaunchBar predates macOS and began on NeXT platforms. Objective Development's
      official legacy archive spans LaunchBar 1 for NEXTSTEP and OPENSTEP, LaunchBar 2
      for Rhapsody, and successive releases across the entire Mac OS X and macOS era.
    - >
      Its adaptive abbreviation search, extensible actions, clipboard history, snippets,
      indexing rules, and system-wide launcher workflow made it a durable model for
      keyboard-driven Mac productivity software. Homebrew Cask later supplied a
      reproducible command-line installation path for the otherwise graphical commercial
      application.
  package-nerd-significance:
    - >
      LaunchBar is historically important because it carried the keyboard launcher idiom
      from NeXT into mainstream Mac use well before the current generation of command
      palettes. Its long compatibility archive is also an unusually clear record of
      software continuity across NeXT, PowerPC, Intel, and modern macOS generations.
    - >
      Its action system interests automation-focused users because indexed content and
      custom JavaScript, AppleScript, Ruby, Python, PHP, and Unix-executable actions let
      a graphical launcher serve as a programmable front end to local tools.
  project-history:
    - >
      LaunchBar was developed by Objective Development and originated as a launcher for
      NEXTSTEP and OPENSTEP. The vendor's archive describes more than two decades of
      releases, with LaunchBar 1.10 for NeXT systems and LaunchBar 2.0 for Mac OS X
      Server 1.2/Rhapsody preceding the later Mac OS X product line.
    - >
      By LaunchBar 6, the program had evolved from an adaptive application launcher into
      a broad document browser and productivity environment incorporating web search,
      file operations, clipboard history, snippets, calculation, media control,
      indexing, and scriptable actions.
  related-projects:
    - >
      Spotlight overlaps with LaunchBar's system search and launching role, while
      contemporary command palettes such as Alfred and Raycast occupy the same broad Mac
      productivity category.
    - >
      Little Snitch and Micro Snitch are other long-lived macOS utilities developed and
      distributed by Objective Development.
  sources:
    - 'Official features: https://www.obdev.at/products/launchbar/features.html'
    - 'Official help: https://www.obdev.at/resources/launchbar/help/'
    - 'Official legacy archive: https://www.obdev.at/products/launchbar/download-legacy.html'
    - 'Official overview: https://www.obdev.at/products/launchbar/index.html'
    - 'Official support center: https://www.obdev.at/support/launchbar'
    - 'source_facts.package-manager: brew-cask/launchbar'
  summary:
    - >
      LaunchBar is Objective Development's keyboard-driven macOS application launcher,
      document browser, search tool, and automation environment. It uses adaptive
      abbreviations and a configurable index to provide quick access to applications,
      files, contacts, browser data, actions, snippets, and other local resources.
  timeline:
    - 'NeXT era: LaunchBar 1 supported NEXTSTEP 3.x and OPENSTEP.'
    - 'Rhapsody era: LaunchBar 2.0 supported Mac OS X Server 1.2.'
    - 'Early Mac OS X: LaunchBar 3 and 4 tracked the Puma through Tiger generations.'
    - 'Later Mac OS X: LaunchBar 5 covered Tiger through Mavericks.'
    - '2014: LaunchBar 6 licensing and upgrades followed the LaunchBar 5 generation.'
    - 'Modern macOS: LaunchBar 6 continued through Intel and Apple-silicon-era macOS releases.'
  usage:
    - >
      Invoke LaunchBar with a global shortcut, type an abbreviation to select an indexed
      item, and press Return or browse related objects. Users can search the web,
      navigate files, manipulate clipboard history, run calculations, open applications
      and documents, and send items to actions.
    - >
      The index and preferences UI control discoverable content and ranking. Advanced
      users can install or develop actions to connect LaunchBar to scripts, command-line
      executables, services, and third-party applications.
