history:
  adoption-history:
    - >
      Greenfoot was designed for learners and educators and developed an ecosystem
      around tutorials, an official textbook, teacher resources, and a gallery for
      publishing and studying scenarios.
    - >
      The project is produced at the University of Kent in conjunction with La Trobe
      University and has received sponsorship from Oracle and Google. The supplied
      metadata also records Homebrew cask distribution.
  package-nerd-significance:
    - >
      Greenfoot packages a real Java environment behind a deliberately visual,
      beginner-oriented object-world interface. It is notable among educational IDEs
      because concepts and code transfer into standard Java development.
    - >
      The GPLv2-with-Classpath-Exception source releases and long public version history
      make it an instructive example of an academic teaching tool maintained as
      distributable desktop software.
  project-history:
    - >
      Greenfoot was designed and implemented through university computing-education
      work, initially involving the University of Kent and Deakin University. Its
      current official materials place it in the University of Kent's Programming
      Education Tools Group and identify La Trobe University as a collaborator.
    - >
      The official version history records pre-1.0 releases in early 2006 and the first
      full release on 31 May 2006. Later milestones included Greenfoot 2.0 in 2010 and
      the Stride frame-based editor in Greenfoot 3.0 in 2015.
  related-projects:
    - >
      BlueJ is a related educational Java environment developed by the same University
      of Kent group.
    - >
      Greenroom is Greenfoot's instructor community, while the Greenfoot Gallery hosts
      user-created scenarios.
  sources:
    - https://www.greenfoot.org/about
    - https://www.greenfoot.org/doc
    - https://www.greenfoot.org/overview
    - https://www.greenfoot.org/site/download_source
    - https://www.greenfoot.org/version_history
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Greenfoot is an educational Java development environment built around interactive
      graphical scenarios. It teaches object orientation while allowing learners to
      write standard Java code.
  timeline:
    - '2006: Greenfoot 1.0 became the first full release.'
    - '2010: Greenfoot 2.0 expanded editing, debugging, sound, and world features.'
    - '2015: Greenfoot 3.0 introduced the Stride frame-based editor and continuous compilation.'
  usage:
    - >
      Learners create worlds and actors, run scenarios interactively, inspect objects,
      and publish projects to the Greenfoot Gallery.
    - >
      Teachers use its tutorials, API reference, textbook, videos, and instructor
      community as course material for introductory object-oriented programming.
