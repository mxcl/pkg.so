credentials-file-location: null
history:
  adoption-history:
    - >
      Keyboard Maestro gained a durable following among macOS power users by making
      sophisticated automation available through a visual macro editor while retaining
      integration with AppleScript, shell commands, and other scripting tools. Stairways
      describes thousands of people as using it daily.
    - >
      Its trigger-and-action model supports both simple keyboard shortcuts and complex
      multi-application workflows, which has made it useful to writers, developers,
      administrators, and other users with repetitive desktop processes.
  package-nerd-significance:
    - >
      Keyboard Maestro is a canonical proprietary macOS power-user utility: graphical
      and approachable, but able to orchestrate command-line tools, scripts,
      applications, browsers, and system events. For reproducible setups, the
      application package and the user's separately stored macro library are both
      important.
  project-history:
    - >
      Michael Kamprath wrote Keyboard Maestro following his Application Switcher utility
      and released it in early 2002. Development of version 2 stalled after beta
      releases in 2003.
    - >
      Stairways Software acquired all rights on June 30, 2004 and released Keyboard
      Maestro 2 in September 2004. Later releases expanded it from hot-key macros and
      switchers into a broad visual automation platform with variables, control flow,
      palettes, clipboard history, scripting, and hundreds of actions.
  related-projects:
    - AppleScript
    - Automator
    - Shortcuts
    - QuicKeys
  sources:
    - https://wiki.keyboardmaestro.com/
    - https://www.keyboardmaestro.com/documentation-keyboardmaestro/7/keyboardmaestro.html
    - https://www.keyboardmaestro.com/documentation/6/keyboardmaestro.html
    - https://www.keyboardmaestro.com/main/
  summary:
    - >
      Keyboard Maestro is a proprietary macOS automation application in which triggers
      run user-defined sequences of actions through a persistent background engine.
  timeline:
    - '2002: Michael Kamprath released Keyboard Maestro.'
    - '2003: Development reached the Keyboard Maestro 2 beta series before stalling.'
    - '2004: Stairways Software acquired Keyboard Maestro and released version 2.'
    - >
      2011: Version 5 added major control-flow, variable, calculation, and macro-library
      capabilities.
  usage:
    - >
      Users build macros from triggers, conditions, and actions in the Keyboard Maestro
      editor; the background Keyboard Maestro Engine detects triggers and executes those
      macros. Common workflows include launching and controlling applications,
      rearranging windows, transforming text and images, filling web forms, running
      scripts, managing clipboards, and scheduling repetitive tasks.
