history:
  adoption-history:
    - >
      Happy's adoption path is shaped by developers who already run Claude Code or Codex
      locally but want to monitor or steer sessions away from the keyboard. The official
      site emphasizes mobile access, multiple active sessions, push notifications, voice
      control, and no requirement to move code onto rented cloud machines.
  package-nerd-significance:
    - >
      Happy Coder is package-nerd-interesting because it shows how AI-agent tools are
      being packaged as local wrappers plus mobile/web companions, not just as SaaS
      endpoints. The executable names `happy` and `happy-mcp`, the package-name
      migration, and the split between archived CLI-specific and broader app
      repositories are the details a formula maintainer has to track.
  project-history:
    - >
      The original `happy-cli` repository describes Happy Coder as a CLI that connects
      local Claude Code to a mobile device. The newer official repository and
      documentation describe Happy as a mobile and web client for Claude Code and Codex
      with end-to-end encryption, real-time sync, and a CLI installed as `happy`.
    - >
      The official README records a package-name migration from `happy-coder` to
      `happy`, crediting the donation of the shorter npm package name. That migration is
      an important packaging detail: Homebrew still uses the `happy-coder` formula name
      in the input batch, while the documented npm command installs `happy`.
  related-projects:
    - >
      Happy Coder is directly related to Claude Code, Codex, the Happy App, Happy CLI,
      Happy Agent, Happy Server, and the Happy web app. The project also has an
      MCP-facing executable in the package facts.
  sources:
    - https://formulae.brew.sh/formula/happy-coder
    - https://github.com/slopus/happy
    - https://github.com/slopus/happy-cli
    - https://happy.engineering
    - https://happy.engineering/docs/
    - https://happy.engineering/docs/versions/release-notes/
  summary:
    - >
      Happy Coder is a CLI-centered mobile and web control layer for AI coding agents.
      Its package history is tied to the fast-moving 2025-2026 coding-agent ecosystem:
      local agents stay on user-owned machines while phones and browsers provide remote
      control, notifications, and voice-driven interaction.
  timeline:
    - >
      2026-04-20: Official documentation page records a published update date for the
      Happy Coder docs.
    - >
      2026: Official README documents migration from the `happy-coder` package to the
      `happy` package name.
    - >
      2026: Official repository presents Happy as a mobile and web client for Claude
      Code and Codex.
  usage:
    - >
      The documented workflow is to install the CLI, then run `happy claude` or `happy
      codex` instead of invoking the underlying agent directly. Happy wraps the local
      agent, allows control from phone, tablet, web app, or desktop, and can switch
      control back to the local keyboard.
related-packages:
  - id: brew:claude-code
    reason: >
      Claude Code is one of the local coding agents that Happy Coder officially wraps
      for encrypted mobile and web control.
    rel: adjacent_workflow
    sources:
      - https://happy.engineering/guides/terminal/
      - https://docs.anthropic.com/en/docs/claude-code/overview
  - id: brew:codex
    reason: >
      Codex is an officially supported local agent that can be launched through `happy
      codex` when remote session control is wanted.
    rel: adjacent_workflow
    sources:
      - https://happy.engineering/guides/terminal/
      - https://developers.openai.com/codex
