history:
  adoption-history:
    - >
      Plaud expanded from dedicated recording hardware into a shared App, Web, Desktop,
      and Team ecosystem. This lets conversations recorded in different settings flow
      into the same transcription and summary workspace.
  package-nerd-significance:
    - >
      The desktop package brings Plaud's hardware-centered AI note workflow to ordinary
      macOS meetings. It is relevant to package users who want a native, bot-free
      meeting recorder that feeds an existing cross-device workspace.
  project-history:
    - >
      Plaud was established in 2021 and shipped its first recording device in 2023. The
      product family subsequently grew beyond physical recorders to include web and
      desktop software for online conversations.
  related-projects:
    - Plaud App
    - Plaud Web
    - Plaud Note
    - Plaud NotePin
    - Plaud Team
  sources:
    - https://support.plaud.ai/hc/en-us/articles/53792807283225-Download-the-Plaud-Desktop
    - >
      https://support.plaud.ai/hc/en-us/articles/58739679361305-Before-you-start-Plaud-Desktop-FAQ
    - https://www.plaud.ai/blogs/articles/plaud-anniversary
  summary:
    - >
      Plaud is an AI note-taking ecosystem for capturing conversations and producing
      transcripts, summaries, highlights, mind maps, and reusable exports. Plaud Desktop
      applies that workflow to online meetings on macOS and Windows.
  timeline:
    - '2021: Plaud was established.'
    - '2023: Plaud shipped its first dedicated recording device.'
    - >
      2026: Plaud described a broader ecosystem spanning four recording devices and a
      desktop app.
  usage:
    - >
      Users sign in with a Plaud account, grant recording permissions, and capture
      meeting audio without adding a meeting bot. Recordings are sent to the Plaud
      workspace for transcription and summarization, where results can be reviewed in
      Plaud Web or the mobile app.
