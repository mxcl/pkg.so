config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README lists Cargo, FreeBSD pkg, Homebrew, and Scoop installation paths, while
      the input package facts also record Alpine, MacPorts, Nix, Arch, and Scoop
      packaging. That spread is notable for a small Rust CLI because it shows adoption
      by users who want jq-like HTML querying without writing per-task scripts.
  package-nerd-significance:
    - >
      For package nerds, htmlq is a neat example of the Rust single-binary CLI wave: a
      narrowly scoped tool, easy to install through Cargo or OS package managers, with a
      name and interface that map an existing Unix mental model from JSON to HTML.
  project-history:
    - >
      The upstream README describes htmlq as a tool that extracts pieces of HTML files
      with CSS selectors. Michael Maclean's project post says it grew out of
      web-scraping work where Python and BeautifulSoup were workable but slow to start
      repeatedly inside shell-oriented loops.
    - >
      The public release stream is small and concentrated: tags show v0.2.0 and v0.3.0
      in September 2021 and v0.4.0 in January 2022. That pattern matches a focused
      utility whose interface stabilized around selector extraction, text output,
      attribute extraction, and shell installation paths.
  related-projects:
    - >
      htmlq is conceptually related to `jq`, but targets HTML rather than JSON. Its
      implementation space is adjacent to scraper libraries such as BeautifulSoup and
      command-line HTML/XML tools such as `pup`, `xmllint`, and selector-aware web
      scraping utilities.
  sources:
    - https://api.github.com/repos/mgdm/htmlq/commits/1361c8c46811dd7b961c3fe9c6b04f9318a345e8
    - https://api.github.com/repos/mgdm/htmlq/commits/5cae41f69bebd28a6ea6dea25fd8ab66f408f706
    - https://api.github.com/repos/mgdm/htmlq/tags?per_page=20
    - https://formulae.brew.sh/formula/htmlq
    - https://github.com/mgdm/htmlq
    - https://github.com/mgdm/htmlq/releases
    - https://mgdm.net/weblog/htmlq-revisited/
  summary:
    - >
      htmlq is a Rust command-line tool that applies CSS selectors to HTML input,
      deliberately positioning itself as 'like jq, but for HTML.' Its package-manager
      appeal is direct: it gives shell users a compact selector-based extractor for
      scraping, inspection, and pipeline work.
  timeline:
    - '2021: v0.2.0 was tagged in September.'
    - '2021: v0.3.0 was tagged later the same month.'
    - '2022: v0.4.0 was tagged in January.'
    - >
      Package-manager era: The README and input package facts record Cargo, FreeBSD pkg,
      Homebrew, Scoop, Alpine, MacPorts, Nix, and Arch availability.
  usage:
    - >
      htmlq is used in pipelines that fetch or read HTML and then select elements with
      CSS selectors. It is adjacent to `jq` workflows, but chooses web-native selectors
      instead of JSON paths, making it useful for one-off scraping, documentation
      checks, and command-line extraction from generated HTML.
related-packages:
  - id: brew:hq
    reason: >
      Choose hq when you want CSS-selector extraction to produce a deliberately
      structured JSON object; choose htmlq when emitting selected HTML, text, or
      attributes fits the pipeline better.
    rel: alternative
    sources:
      - https://github.com/orf/html-query
      - https://github.com/mgdm/htmlq
