history:
  adoption-history:
    - >
      Trickster occupies a specialized macOS productivity niche: it complements Finder
      and application-specific recent-item lists with a system-wide, menu-bar view.
      Official documentation also supplies workflows for Hookmark, DEVONthink, Alfred,
      and LaunchBar, indicating adoption among users of keyboard-driven Mac productivity
      tools.
  package-nerd-significance:
    - >
      For package users, Trickster is notable as a polished example of a narrowly
      focused macOS menu-bar utility. Its continued maintenance must track behavioral
      changes in macOS file metadata, permissions, and cloud-backed storage rather than
      merely add new commands or formats.
  project-history:
    - >
      Apparent Software developed Trickster around continuous monitoring of
      user-selected folders. The application evolved beyond a simple recent-files list
      to include favorites, configurable filters, active-application filtering,
      drag-and-drop actions, AppleScript, URL schemes, and integrations with other Mac
      productivity applications.
    - >
      The official support history shows ongoing adaptation to macOS changes. The 2023
      release notes document improved Hookmark and DEVONthink integration, while the
      2024 notes describe adjustments for changes to application-use metadata in macOS
      Sequoia.
  related-projects:
    - >
      Official workflows connect Trickster with Hookmark for linked files, DEVONthink
      for reopening database items, and LaunchBar for keyboard-driven access to
      Trickster's recent-file lists.
  sources:
    - https://discourse.apparentsoft.com/t/1-start-here-welcome-to-trickster/32
    - >
      https://discourse.apparentsoft.com/t/applescript-and-url-schemes-for-trickster-automation/42
    - >
      https://discourse.apparentsoft.com/t/impoved-hookmark-devonthink-integrations-and-favorites-in-trickster-3-9-1/329
    - https://discourse.apparentsoft.com/t/trickster-3-9-4-release-notes/506
    - https://tricksterapp.com/
    - https://tricksterapp.com/getting-started/
  summary:
    - >
      Trickster is a commercial macOS menu-bar utility that monitors selected folders
      and presents recently created, opened, edited, or downloaded files for quick
      access.
  timeline:
    - '2021: Apparent Software published the current online user-manual series.'
    - '2023: Trickster improved its Hookmark and DEVONthink integrations.'
    - >
      2024: Trickster adapted its recent-application handling to macOS Sequoia metadata
      behavior.
  usage:
    - >
      Users select watched folders, then open Trickster from the menu bar to filter,
      preview, reveal, open, rename, move, or drag recent files into other applications.
      Favorites, custom filters, keyboard shortcuts, AppleScript, and URL schemes
      support more elaborate workflows.
related-packages:
  - id: cask:hookmark
    reason: >
      Use Hookmark with Trickster when you want Trickster's recent files to expose and
      invoke durable links between related documents.
    rel: adjacent_workflow
    sources:
      - https://discourse.apparentsoft.com/t/support-for-the-application-hookmark/44
      - https://hookproductivity.com/help
  - id: cask:devonthink
    reason: >
      Use DEVONthink with Trickster to reopen recently used DEVONthink items and surface
      Hookmark-linked database documents from Trickster.
    rel: adjacent_workflow
    sources:
      - https://discourse.apparentsoft.com/t/devonthink-and-trickster-integration/47
      - https://www.devontechnologies.com/apps/devonthink
  - id: cask:launchbar
    reason: >
      The official Trickster Files action exposes recent files and enabled Trickster
      filters inside LaunchBar's keyboard interface.
    rel: adjacent_workflow
    sources:
      - https://discourse.apparentsoft.com/t/using-trickster-with-launchbar/45
      - https://www.obdev.at/products/launchbar/index.html
