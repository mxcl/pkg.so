    - https://forum.navigraph.com/t/welcome-to-beta-test-the-charts-mobile-app/11079
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Navigraph Charts is a subscription-oriented flight-simulation planning and chart
      application providing regularly updated Jeppesen airport charts, enroute charts,
      moving-map facilities, and simulator integrations.
  timeline:
    - '2003: Navigraph began operating in the flight-simulation market.'
    - '2019: Navigraph published its Introduction to Navigraph Charts guide.'
    - '2022: Charts 8 replaced Charts 7 on desktop.'
    - '2023: Native Charts 8 phone applications entered beta testing.'
  usage:
    - >
      Users sign in with a Navigraph account, plan or import flights, explore upper and
      lower enroute charts, view and pin airport procedures, organize charts for a
      flight, and track a simulated aircraft through supported integrations. Full chart
      access generally requires an eligible subscription.
