history:
  adoption-history:
    - >
      Navigraph has operated in the flight-simulation community since 2003. Its official
      2022 community survey reported Navigraph Charts as the most-used chart product
      among respondents, at 67.9%, reflecting its prominent role in enthusiast flight
      planning.
  package-nerd-significance:
    - >
      Navigraph Charts packages regularly refreshed licensed aviation data into a
      cross-platform consumer application and integrates it with simulated aircraft
      through Simlink and in-game panels. For package users, the cask provides a
      repeatable desktop installation for a service whose useful data changes on the
      aviation industry's 28-day AIRAC cycle.
  project-history:
    - >
      Navigraph developed Charts as a desktop and web interface for Jeppesen airport
      charts and Navigraph-rendered enroute charts. An official public guide appeared in
      2019. Charts 8 replaced Charts 7 on desktop in 2022, adding a more comprehensive
      interface and broader flight-planning workflow, followed by native phone testing
      in 2023.
  related-projects:
    - Navigraph Hub
    - Navigraph Simlink
    - Navigraph Navdata
    - SimBrief
    - Navigraph Charts In-Game Panel
  sources:
    - https://developers.navigraph.com/docs/charts/introduction
