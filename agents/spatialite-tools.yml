id: brew:spatialite-tools
display-name: spatialite-tools
repo: https://www.gaia-gis.it/fossil/spatialite-tools
docs:
  - https://www.gaia-gis.it/fossil/spatialite-tools/index
  - https://www.gaia-gis.it/gaia-sins/spatialite-cookbook-5/cookbook_topics.tools.html
config-file-location:
  unix:
    - spatialite-dem.conf
    - $SPATIALITE_DEM
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts list spatialite-tools or spatialite-bin in Homebrew,
      Debian, Fedora, MacPorts, Nix, and Ubuntu. That spread mirrors the package's role
      as the scripting and batch-processing face of SpatiaLite for GIS users.
  package-nerd-significance:
    - >
      For package nerds, spatialite-tools matters because it makes SpatiaLite useful in
      pipelines. It turns a library-backed spatial database into command-line programs
      that can be depended on by scripts, distro packages, GIS workflows, and CI jobs.
  project-history:
    - >
      The official project page describes spatialite-tools as open source CLI tools
      supporting SpatiaLite. The suite includes a spatialite shell comparable to sqlite3
      but with SpatiaLite support, import/export helpers for Shapefiles and DBF files,
      diagnostics for Shapefiles, EXIF-GPS import, network/routing tools, GML and DXF
      importers, OpenStreetMap loaders, XML processors, and version-conversion tools.
  related-projects:
    - >
      Officially related projects include libspatialite, spatialite_gui, FreeXL,
      ReadOSM, VirtualPG, and the Gaia-SINS project family.
  sources:
    - https://www.gaia-gis.it/fossil/spatialite-tools/index
    - https://www.gaia-gis.it/fossil/spatialite-tools/timeline
    - https://www.gaia-gis.it/gaia-sins/spatialite-cookbook-5/cookbook_topics.tools.html
    - source_facts.package-manager
  summary:
    - >
      spatialite-tools is Gaia-SINS' collection of command-line utilities for working
      with SpatiaLite databases and geospatial exchange formats.
  timeline:
    - '2014: The Fossil timeline records work toward the 4.2.1 release candidate.'
    - '2015: Version 4.3.0 was released as stable.'
    - '2016: shp_repack was replaced by the more capable shp_sanitize in the Fossil timeline.'
    - '2023: Current version 5.1.0a was released on August 13.'
  usage:
    - >
      Users install the suite to get shell and batch utilities around SpatiaLite:
      loading Shapefiles, checking geometry data, importing OSM or GML data, converting
      database versions, creating network datasets, and processing XML-backed spatial
      datasets.
