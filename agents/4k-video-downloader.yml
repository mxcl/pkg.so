history:
  adoption-history:
    - >
      4K Download states that its applications have served more than 60 million users
      and that the downloader product line has more than ten years of operation. The
      desktop software has been distributed for macOS, Windows, and Linux; the supplied
      record identifies the legacy macOS application packaged through Homebrew Cask.
  package-nerd-significance:
    - >
      The package represents a prominent proprietary desktop counterpart to command-line
      media downloaders. It packages link parsing, format and resolution selection,
      subtitles, playlists, subscriptions, account-backed private content, and
      download-history management behind a graphical interface.
    - >
      The legacy-versus-Plus transition is important for package maintainers: the
      official store says licenses for the original 4K Video Downloader are no longer
      sold and directs new purchases to 4K Video Downloader Plus.
  project-history:
    - >
      4K Video Downloader was established as a desktop application for saving video and
      audio from popular hosting services. Over its product life it added
      high-resolution formats, playlists and channels, subtitles, Smart Mode
      preferences, subscriptions, proxy support, and account authorization for
      accessible private content.
    - >
      4K Download later introduced 4K Video Downloader Plus as the successor. The
      company describes Plus as faster and gives it redesigned download management,
      including combined JSON import and export. The original product remains distinct
      from Plus in the supplied cask record and official licensing notices.
  related-projects:
    - >
      The 4K Download product family includes 4K Video Downloader Plus, 4K YouTube to
      MP3, 4K Tokkit, 4K Stogram, and other media utilities.
  sources:
    - https://www.4kdownload.com/blog/2023/07/26/4k-video-downloader-faq/
    - https://www.4kdownload.com/buy/videodownloader-8
    - https://www.4kdownload.com/products/product-videodownloader
  summary:
    - >
      4K Video Downloader is the legacy desktop video-downloading application from 4K
      Download. It saves online video, audio, playlists, channels, and subtitles, and
      has been succeeded commercially by 4K Video Downloader Plus.
  timeline:
    - >
      2010s: 4K Video Downloader established the downloader product line; the vendor
      reports more than ten years of operation.
    - >
      2023: 4K Download introduced and documented 4K Video Downloader Plus as a newer
      product alongside the original application.
    - >
      Current: The vendor no longer sells licenses for the original application and
      directs new customers to 4K Video Downloader Plus.
  usage:
    - >
      Users generally copy a media URL, paste it into the desktop application, select
      output format, quality, subtitles, and destination, and start the download. Smart
      Mode applies saved choices automatically to later links.
    - >
      Account authorization is required for private media the user is permitted to
      access. Premium licensing controls higher-volume and advanced functionality.
