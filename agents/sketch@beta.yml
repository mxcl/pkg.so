history:
  adoption-history:
    - >
      Sketch reported more than one million customers by 2020. Its focused Mac
      experience, accessible pricing, reusable design resources, and plugin ecosystem
      helped it become a prominent interface-design tool.
  package-nerd-significance:
    - >
      Sketch is notable in Mac package culture as a major native creative application
      distributed outside the Mac App Store. The beta cask gives testers a
      package-managed route to prerelease builds while keeping the distinct Sketch Beta
      application.
  project-history:
    - >
      Pieter Omvlee and Emanuel Sá created Sketch as a native Mac tool for interface
      design, releasing its first version in 2010. Sketch later expanded from a
      standalone editor into a platform with shared Workspaces, web collaboration,
      prototyping, libraries, plugins, and an iPhone companion app.
    - >
      Sketch moved away from the Mac App Store in 2015, citing review delays, sandbox
      restrictions, and the lack of upgrade pricing. Direct distribution subsequently
      became central to its Mac release model.
  related-projects:
    - >
      Related official components include Sketch Workspaces, the Sketch web app, the
      Sketch iPhone app, developer plugins, shared Libraries, and the stable Sketch Mac
      release.
  sources:
    - https://www.sketch.com/beta
    - https://www.sketch.com/blog/from-one-to-one-million/
    - https://www.sketch.com/blog/leaving-the-mac-app-store/
    - https://www.sketch.com/docs/
  summary:
    - >
      Sketch Beta is the prerelease channel of Sketch's native Mac application for
      interface design, prototyping, and collaborative product-design workflows.
  timeline:
    - '2010: Sketch 1.0 launched as a native Mac design application.'
    - '2015: Sketch announced its departure from the Mac App Store.'
    - '2020: Sketch reported more than one million customers.'
    - '2022: Sketch introduced a rebuilt iPhone companion based on Workspaces.'
  usage:
    - >
      Designers use Sketch Beta to preview upcoming Mac-app changes, create interface
      layouts and reusable components, build prototypes, and collaborate through Sketch
      Workspaces. Beta builds may be less stable than the production channel.
