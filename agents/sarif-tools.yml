history:
  adoption-history:
    - >
      The project documents pip installation on Windows, Linux and macOS. Its Code
      Climate export supports presenting results in GitLab code-quality reports; no
      quantitative adoption history is established.
  package-nerd-significance:
    - >
      It provides a reusable reporting layer across analyzers that emit SARIF, with both
      a Python API and a command-line interface.
  project-history:
    - >
      Published under Microsoft's GitHub organization, SARIF Tools combines report
      conversion, comparison and filtering. The 2024 major release reorganized its
      Python reporting API around IssueReport.
  related-projects:
    - >
      SARIF is the interchange format consumed by the toolkit; GitLab Code Quality is a
      documented export destination.
  sources:
    - https://github.com/microsoft/sarif-tools#readme
    - https://github.com/microsoft/sarif-tools/blob/main/CHANGELOG.md
  summary:
    - >
      SARIF Tools is a Python library and command suite for examining and transforming
      static-analysis reports.
  timeline:
    - >
      2024-09-10: Version 3.0.0 introduced an IssueReport-based Python API and revised
      report grouping.
  usage:
    - >
      Run sarif summary, diff, html or csv against reports or directories. The --check
      option can produce a failing exit status for selected severities, supporting
      automated checks.
