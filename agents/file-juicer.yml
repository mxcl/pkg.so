history:
  adoption-history:
    - >
      File Juicer has remained a specialized independent Mac utility rather than a
      general archive manager. Its long release history tracks changes in document
      formats, browser caches, media formats, processor architectures, and macOS
      security requirements.
    - >
      The application progressed from early shareware releases through PowerPC, Intel,
      and Apple Silicon support. Later versions added extraction for formats such as
      HEIC, WebP, AVIF, and modern browser-cache content while preserving compatibility
      builds for older macOS releases.
  package-nerd-significance:
    - >
      File Juicer is interesting as a desktop-oriented form of file carving: it scans
      byte streams for recognizable embedded formats rather than trusting filename
      extensions or requiring the outer document to open correctly. This makes it useful
      for extracting assets from office documents, caches, disk images, and partially
      damaged files.
    - >
      Its official changelog preserves an unusually long record of macOS compatibility
      work, including PowerPC, 32-bit Intel, Apple Silicon, code signing, notarization,
      and repeated rebuilds for new Xcode and macOS releases.
  project-history:
    - >
      File Juicer emerged as a Mac utility for extracting images and other recognizable
      data embedded in documents and arbitrary files. Its official changelog records
      version 1.5 in November 2004 and version 2.0 as shareware in December 2004.
    - >
      The project expanded beyond image extraction into text recovery, archive and
      compressed-data handling, browser-cache inspection, media extraction, rudimentary
      deleted-file recovery, and forensic logging. Version 4.89 added native Apple
      Silicon support in January 2021.
  related-projects:
    - PhotoRec
    - foremost
    - binwalk
    - strings
    - macOS Finder
    - Preview
  sources:
    - https://echoone.com/filejuicer/ReadMe
    - https://echoone.com/filejuicer/download
    - https://echoone.com/filejuicer/forensics
    - https://echoone.com/filejuicer/userguide
  summary:
    - >
      File Juicer is a long-running macOS file-carving and extraction utility from Echo
      One. It scans files byte by byte for embedded images, media, text, archives, and
      other recognizable formats, saving recoverable content without depending solely on
      the outer file type.
  timeline:
    - '2004: Version 1.5 added text and embedded-ZIP extraction; version 2.0 became shareware.'
    - '2005: Version 3.0 added AppleScript support.'
    - '2017: Version 4.59 changed the default results destination to a File Juicer folder.'
    - '2021: Version 4.89 introduced native Apple Silicon support.'
    - '2024: Version 4.99 formally documented HEIC and WebP support.'
    - '2025: Version 4.111 added AVIF support.'
    - '2026: Version 4.115 was released after rebuilding on a current macOS toolchain.'
  usage:
    - >
      Users drag files, folders, caches, flash-card images, or disk images onto File
      Juicer and select the formats to recover. Results can be organized by type and
      inspected in Finder, Preview, Photos, or generated HTML indexes. The application
      also supports basic scripting through macOS's open command.
    - >
      File Juicer records each run in ~/Library/Logs/FileJuicerLog.txt and
      ~/Library/Logs/FileJuicerResultsLog.txt. These are operational logs, not
      configuration or credential files.
