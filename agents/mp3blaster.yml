id: brew:mp3blaster
display-name: MP3Blaster
repo: https://github.com/stragulus/mp3blaster
docs:
  - https://github.com/stragulus/mp3blaster#readme
  - https://github.com/stragulus/mp3blaster/blob/master/FAQ
  - https://github.com/stragulus/mp3blaster/blob/master/mp3blaster.1
config-file-location:
  unix:
    - ~/.mp3blasterrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README names FreeBSD, Linux, NetBSD, and OpenBSD as supported
      systems, and the change log records portability work for macOS, Cygwin, and newer
      compilers. The supplied package metadata shows continued distribution through
      several Unix-oriented package managers.
  package-nerd-significance:
    - >
      MP3Blaster preserves the late-1990s console-multimedia tradition: a capable
      interactive player built for systems without a graphical desktop. Its long
      packaging life also shows how port and distribution maintainers can keep a mature
      ncurses-era application compiling after upstream development slows.
  project-history:
    - >
      The project began during the early Linux MP3 era. Its project history traces the
      author's motivation to an MP3 collection started in 1997 and records a first
      usable release, then called mp3player, in August 1997.
    - >
      The 3.0 line redesigned the interface and added Ogg Vorbis support before the
      first stable 3.0 release in September 2001. The 3.2 series broadened audio-output
      and platform support, while the 2017 release incorporated compilation fixes from
      Debian packaging work.
  related-projects:
    - >
      The source tree includes the splay MPEG decoder, nmixer, and mp3tag utilities; Ogg
      Vorbis and several Unix audio systems broadened playback beyond the original MP3
      and OSS focus.
  sources:
    - http://www.mp3blaster.org/p/history.html
    - https://github.com/stragulus/mp3blaster
    - https://github.com/stragulus/mp3blaster/blob/master/mp3blaster.1
    - https://raw.githubusercontent.com/stragulus/mp3blaster/master/ChangeLog
    - https://raw.githubusercontent.com/stragulus/mp3blaster/master/README
    - source_facts.package-manager
  summary:
    - >
      MP3Blaster is an interactive text-console audio player whose defining feature is a
      filesystem-like playlist hierarchy. Songs can be grouped into albums or
      categories, allowing album-level ordering and shuffling as well as ordinary song
      shuffling.
  timeline:
    - '1997: The first usable release appeared under the name mp3player.'
    - '2001: MP3Blaster 3.0 added Ogg Vorbis support and reached a stable release.'
    - '2006: Version 3.2.2 added SDL and Esound output and portability fixes.'
    - '2017: Version 3.2.6 incorporated Debian-maintainer compilation fixes.'
  usage:
    - >
      Users run MP3Blaster in a terminal, browse files, build hierarchical playlists,
      stream audio over HTTP, and customize colours and keybindings in
      `~/.mp3blasterrc`. Command-line options can start playback immediately, select
      play modes, or replace the default configuration file.
related-packages:
  - id: brew:cmus
    reason: >
      Choose cmus when you want a newer console player with a library browser, live
      filtering, broader codec support, ReplayGain, and remote control rather than
      MP3Blaster's group-oriented playlist interface.
    rel: alternative
    sources:
      - https://github.com/stragulus/mp3blaster#readme
      - https://cmus.github.io/
