id: brew:maven-shell
display-name: Maven Shell
repo: https://github.com/jdillon/mvnsh
docs:
  - https://github.com/jdillon/mvnsh#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The batch input records only Homebrew packaging for maven-shell, which fits its
      narrow audience: Java developers who wanted an interactive Maven shell rather than
      repeatedly invoking `mvn` commands from a normal terminal.
  package-nerd-significance:
    - >
      maven-shell is a small historical artifact from the period when Java build tools
      experimented with richer shells and command environments. It matters less as a
      modern ecosystem pillar than as a package-manager fossil for Maven power users and
      GShell-based tooling.
  project-history:
    - >
      The README describes the project tersely as Maven Shell (`mvnsh`) and says it is
      based on GShell 3. The README and POM both carry copyright text beginning in 2009,
      and the POM identifies the Maven coordinates as `com.planet57.maven.shell:mvnsh`
      with modules for commands, bootstrap, personality, and assembly.
    - >
      The public tag list includes mvnsh-0.9, 0.10, 1.0, 1.0.1, and 1.1.0, with the
      GitHub release page for mvnsh-1.1.0 dated 2013-04-26. The POM's unreleased
      snapshot version is 1.2.0-SNAPSHOT, suggesting the packaged tool belongs to an
      older Maven 3.x/Java 8 era.
  related-projects:
    - >
      The README says Maven Shell is based on GShell 3. Its neighboring ecosystem is
      Apache Maven, Maven Wrapper, Java build tooling, and older interactive shells
      around build systems.
  sources:
    - https://github.com/jdillon/mvnsh
    - https://github.com/jdillon/mvnsh/releases/tag/mvnsh-1.1.0
    - https://raw.githubusercontent.com/jdillon/mvnsh/master/README.md
    - https://raw.githubusercontent.com/jdillon/mvnsh/master/pom.xml
    - source_facts.package-manager
  summary:
    - >
      Maven Shell, packaged as `maven-shell` and executed as `mvnsh`, is a
      shell-oriented wrapper around Apache Maven intended to give Maven users an
      interactive command environment.
  timeline:
    - '2009: README and POM copyright ranges begin.'
    - '2013: GitHub release mvnsh-1.1.0 is published.'
    - '2010s: POM records Maven 3.3+ and Java 8+ requirements for the maintained source line.'
  usage:
    - >
      The README documents building with Maven 3.3+ and Java 8+, preferably through the
      included Maven wrapper, then running the assembled shell with `./build run`.
      Homebrew exposes the `mvnsh` executable for users who install it as a package
      instead of building from source.
related-packages:
  - id: brew:maven
    reason: >
      Maven is the underlying build system that Maven Shell wraps, and it supplies the
      project model, lifecycle, plugins, repositories, and settings used during shell
      sessions.
    rel: adjacent_workflow
    sources:
      - https://github.com/jdillon/mvnsh
      - https://maven.apache.org/what-is-maven.html
