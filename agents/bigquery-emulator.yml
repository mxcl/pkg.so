id: brew:bigquery-emulator
display-name: BigQuery Emulator
repo: null
docs:
  - https://github.com/goccy/bigquery-emulator#readme
  - https://pkg.go.dev/github.com/goccy/bigquery-emulator
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project targets developers who need BigQuery-compatible integration tests. Its
      README documents use from the `bq` CLI, official Google client libraries, Docker
      images, Go embedding, and release archives; the input package facts show it
      packaged by Homebrew and Nix.
  package-nerd-significance:
    - >
      It is package-nerd interesting because it makes a cloud data warehouse workflow
      reproducible from a local binary: no service account, no live GCP project, and no
      heavyweight container stack if the CLI package is enough.
  project-history:
    - >
      The official README says the maintainer built the project in 2022 after a
      long-standing request for an official BigQuery emulator remained unresolved.
      GitHub metadata shows the repository was created on 2022-06-20, followed by early
      v0.1.x releases in July and August 2022.
  related-projects:
    - >
      Related projects and dependencies include Google BigQuery, the `bq` CLI, Google
      Cloud BigQuery client libraries, SQLite, and the maintainer's googlesqlite engine.
  sources:
    - GitHub repository and release metadata from api.github.com.
    - Official GitHub README.
    - Package adoption from source_facts.package-manager.
  summary:
    - >
      BigQuery Emulator is a Go-based local server that emulates Google BigQuery APIs
      for tests and development without a cloud project or credentials.
  timeline:
    - '2022-06-20: GitHub repository created.'
    - '2022-07-09: v0.1.0 release published.'
    - '2022-08-07: v0.1.4 release published.'
  usage:
    - >
      Typical package use is to run `bigquery-emulator --project=test`, point clients at
      the local REST and gRPC ports, optionally persist state in SQLite, and seed
      datasets from YAML.
related-packages:
  - id: brew:sqlite
    reason: >
      Use the SQLite CLI to inspect a persistent emulator database, which the emulator
      README explicitly identifies as an ordinary SQLite database suitable for
      examination with SQLite tools.
    rel: adjacent_workflow
    sources:
      - https://github.com/goccy/bigquery-emulator#readme
      - https://sqlite.org/cli.html
