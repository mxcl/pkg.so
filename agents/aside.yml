history:
  adoption-history:
    - >
      Aside is distributed as a desktop browser and also exposes developer-facing CLI,
      MCP, and REPL interfaces. Its official documentation positions it for browser work
      across authenticated sites, recurring routines, local files, and automation tasks.
  package-nerd-significance:
    - >
      Aside combines a graphical browser, an agent runtime, a credential vault, and
      command-line and MCP surfaces in one packaged application. That makes it relevant
      to users tracking the convergence of desktop browsers, local automation, coding
      agents, and package-managed developer tooling.
  project-history:
    - >
      Aside Computer Inc. developed Aside as a browser designed for both people and
      agents. The official changelog records an initial bundled component release in May
      2026 with an agent interface, password manager, routines, settings, and browser
      automation.
    - >
      Subsequent releases expanded the product with a Help Center, custom skills,
      local-folder context, multiple AI-provider options, CLI tooling, MCP support,
      projects, subagents, and remote channels.
  related-projects:
    - Aside Vault
    - Aside CLI
    - Model Context Protocol
    - Chromium browser extensions
  sources:
    - https://aside.com/
    - https://docs.aside.com/
    - https://docs.aside.com/changelog/components
    - https://docs.aside.com/help/developers
    - https://docs.aside.com/help/password-manager
  summary:
    - >
      Aside is an AI-enabled web browser from Aside Computer Inc. that combines
      conventional browsing with agent-driven tasks, local memory, credential-assisted
      sign-in, automation, and developer interfaces.
  timeline:
    - >
      2026-05-27: The first documented bundled component release added the agent UI,
      password manager, routines, settings, and browser automation.
    - '2026-06-06: Custom-skill management was added.'
    - '2026-06-22: The first Aside Help Center pages were added.'
    - '2026-08-14: Aside added visible subagent activity.'
    - '2026-09-02: CLI skill-management and session-resume features were added.'
  usage:
    - >
      Users browse normally or ask the integrated agent to perform multi-step work
      across websites and local files. Aside can use autofill without exposing raw
      passwords to the agent, pause sensitive actions for approval, schedule routines,
      and connect to developer tools through its CLI, MCP server, or automation REPL.
