history:
  adoption-history:
    - >
      Yak and Yakit were publicly introduced at XCon in October 2021. The project later
      opened more of its Yaklang language and runtime foundation to community inspection
      and contribution in 2023.
    - >
      Yakit's official repository has accumulated a substantial public contributor and
      user footprint, while its plugin system provides a distribution channel for
      reusable security workflows. It is used by security researchers, penetration
      testers, developers, system administrators, and enterprise security teams.
  package-nerd-significance:
    - >
      Yakit is interesting to package maintainers because it is not a self-contained
      GUI: it is an Electron front end that manages and drives a separate Yak engine,
      local databases, plugins, and security content. Releases therefore package a
      coordinated desktop-and-engine toolchain rather than a conventional single binary.
    - >
      For security-tool collectors, Yakit consolidates jobs commonly spread across
      intercepting proxies, fuzzers, scanners, exploit utilities, scripting runtimes,
      and reporting tools. Its Yaklang foundation also makes GUI workflows scriptable
      and extensible.
  project-history:
    - >
      Yakit is the desktop workbench of the Yak Project, built on the Yaklang
      cybersecurity domain-specific language. The client communicates with a Yak gRPC
      engine and exposes the engine's capabilities through graphical tools and an
      integrated development environment.
    - >
      The platform was created around the project's 'security fusion' idea: instead of
      maintaining isolated tools, security capabilities are rewritten, integrated, or
      orchestrated through Yaklang and presented in a unified desktop interface.
  related-projects:
    - Yaklang is the language, runtime, and engine underlying Yakit.
    - Yak CLI exposes the same ecosystem to command-line automation and CI/CD.
    - >
      Yakit's plugin marketplace distributes Yaklang-based scanning, MITM, codec,
      packet, and proof-of-concept extensions.
  sources:
    - >
      Official Yak Project development history:
      https://github.com/yaklang/yaklang.github.io/blob/master/materials/project-credibility/full-history.md
    - 'Official Yakit User Manual: https://yaklang.com/en/products/intro/'
    - 'Official Yakit repository and architecture overview: https://github.com/yaklang/yakit'
    - 'Official Yaklang ecosystem repository: https://github.com/yaklang/yaklang'
  summary:
    - >
      Yakit is an open-source, cross-platform desktop security workbench built around
      the Yaklang engine. It combines intercepting-proxy, traffic-replay, web-fuzzing,
      scanning, exploitation, code-editing, plugin, data-analysis, and reporting
      workflows in one graphical application.
  timeline:
    - '2021: Yak and Yakit were publicly presented at XCon.'
    - '2023: The CDSL-YAK language and runtime foundation was formally open-sourced.'
    - "2023: YAKIT V2.0 was listed among Beijing's recognized new technologies and products."
    - '2025: The Yaklang project established an official Homebrew tap for Yakit releases.'
  usage:
    - >
      Security practitioners use Yakit for authorized penetration testing, including
      HTTP interception, request replay, fuzzing, port and directory scanning,
      weak-password testing, vulnerability detection, reverse connections, traffic
      auditing, and report generation.
    - >
      Developers can write and debug Yaklang in the integrated Yak IDE, automate tasks,
      and package repeatable techniques as Yakit plugins. The official project
      explicitly restricts use to authorized and lawful security work.
