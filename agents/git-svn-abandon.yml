config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption evidence is limited to the upstream repository and package-manager
      presence. Homebrew packages version 0.0.1 and also exposes a HEAD build,
      reflecting the tool's role as a niche migration helper rather than a broad
      day-to-day Git workflow package.
  package-nerd-significance:
    - >
      Its significance is as a fossil of the SVN-to-Git migration era: a packageable set
      of `git-*` commands that extends Git's subcommand discovery and handles a one-way
      repository conversion step that core Git intentionally leaves to external tooling.
  project-history:
    - >
      The README frames the project as a workflow for abandoning SVN in favor of Git
      while keeping a clean history. The documented process starts from a git-svn clone,
      runs `git svn-abandon-fix-refs`, optionally adds `.git/info/grafts` for merge
      commits, and then runs `git-svn-abandon-cleanup`.
  related-projects:
    - >
      git-svn-abandon builds on git-svn and points users toward Snerp Vortex and
      svn2git-style scripts when a repository is too large or complex for its own
      cleanup scripts.
  sources:
    - https://formulae.brew.sh/formula/git-svn-abandon
    - https://github.com/nothingmuch/git-svn-abandon#readme
    - https://raw.githubusercontent.com/nothingmuch/git-svn-abandon/master/README.mkdn
  summary:
    - >
      git-svn-abandon is a small suite of Git extension scripts for turning a git-svn
      working repository into a plain Git repository after a Subversion migration.
  timeline:
    - "2009: README links to the author's detailed git-svn-abandon how-to."
    - '0.0.1: Homebrew packages the upstream release as git-svn-abandon.'
  usage:
    - >
      Practitioners use it after a git-svn import to convert SVN remote references into
      normal Git heads and tags, recreate SVN tags as annotated Git tags, remove
      git-svn-id and SVK message noise, and apply grafts where merge ancestry has to be
      supplied manually. After cleanup, the README warns that `git svn rebase` can no
      longer be used against the converted repository.
related-packages:
  - id: brew:git-svn
    reason: >
      git-svn performs the initial SVN import that git-svn-abandon expects before it
      converts references and removes SVN-specific metadata.
    rel: adjacent_workflow
    sources:
      - https://github.com/nothingmuch/git-svn-abandon#readme
      - https://git-scm.com/docs/git-svn
