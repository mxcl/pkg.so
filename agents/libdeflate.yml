history:
  adoption-history:
    - >
      libdeflate became attractive anywhere software needed faster in-memory
      DEFLATE-family compression than zlib-style streaming APIs. The README explicitly
      supports direct source integration and documents language bindings, helping it
      spread into applications, libraries, and package managers as a
      performance-oriented dependency.
  package-nerd-significance:
    - >
      libdeflate is a modern compression-library package with exactly the kind of
      constraints packagers care about: stable C APIs, CPU-specific optimized code
      selected at runtime, direct embedding support, CMake/pkg-config integration, and a
      non-zlib-compatible API that prevents accidental semantic confusion.
  project-history:
    - >
      The README presents libdeflate as a fast whole-buffer compression library
      supporting raw DEFLATE, zlib-wrapped DEFLATE, and gzip-wrapped DEFLATE. It
      includes library APIs plus libdeflate-gzip/libdeflate-gunzip convenience programs,
      benchmarks, and checksum tools.
    - >
      The NEWS file starts with version 0.1 as the initial official release, then
      records a steady sequence of compression-ratio, checksum, architecture, build, and
      portability improvements. Notable milestones include MIT relicensing by 0.5, CMake
      and compiler support work, custom allocator APIs in 1.19, RISC-V basics and new
      checksum acceleration in 1.20, and relocatable CMake package work in 1.25.
  related-projects:
    - >
      zlib, gzip, and raw DEFLATE are the formats and incumbent ecosystem around
      libdeflate. Language bindings and bundled integrations use libdeflate when
      whole-buffer compression is a better fit than streaming APIs.
  sources:
    - https://encode.su/threads/2482-libdeflate-a-new-optimized-DEFLATE-implementation
    - https://github.com/ebiggers/libdeflate
    - https://github.com/ebiggers/libdeflate/releases
    - https://raw.githubusercontent.com/ebiggers/libdeflate/master/NEWS.md
    - https://raw.githubusercontent.com/ebiggers/libdeflate/master/README.md
  summary:
    - >
      libdeflate is Eric Biggers' optimized C library for whole-buffer DEFLATE, zlib,
      and gzip compression and decompression. It is intentionally not a streaming zlib
      clone; it trades API compatibility for speed, compactness, and easy embedding.
  timeline:
    - >
      2016: The author publicly announced libdeflate as a new optimized DEFLATE
      implementation.
    - '2017: Version 0.1 was the initial official release according to upstream NEWS.'
    - >
      2018: Version 1.0-era Windows binary and API usage surfaced in upstream issue and
      release workflows.
    - >
      2023: Version 1.19 added custom allocator APIs and compatibility fixes for DEFLATE
      streams created by libdeflate.
    - >
      2024: Version 1.20 added VPCLMULQDQ/VNNI checksum acceleration and basic RISC-V
      optimizations.
    - '2026: Version 1.25 fixed a GCC 16 build error and made the CMake package relocatable.'
  usage:
    - >
      Developers use libdeflate when the compressed or decompressed data fits in memory
      and whole-buffer APIs are acceptable. The libdeflate-gzip tool can substitute for
      standard gzip in some cases, but upstream warns it is a convenience program with
      limitations rather than the main use case.
related-packages:
  - id: brew:gzip
    reason: >
      Choose GNU gzip for mature file-oriented streaming, broad command-line
      compatibility, and large streams; choose libdeflate when whole-buffer speed is the
      priority.
    rel: alternative
    sources:
      - https://github.com/ebiggers/libdeflate#readme
      - https://www.gnu.org/software/gzip/manual/gzip.html
