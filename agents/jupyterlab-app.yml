id: cask:jupyterlab-app
display-name: JupyterLab Desktop
repo: null
docs:
  - https://jupyterlab.readthedocs.io/en/stable
  - https://github.com/jupyterlab/jupyterlab-desktop/blob/master/user-guide.md
config-file-location:
  linux:
    - ${XDG_CONFIG_HOME:-~/.config}/jupyterlab-desktop/settings.json
    - ${working-directory}/.jupyter/desktop-settings.json
  macos:
    - ~/Library/Application Support/jupyterlab-desktop/settings.json
    - ${working-directory}/.jupyter/desktop-settings.json
  windows:
    - '%APPDATA%\jupyterlab-desktop\settings.json'
    - '%working-directory%\.jupyter\desktop-settings.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      JupyterLab Desktop lowers the setup barrier for notebook users by bundling a
      Python environment and exposing environment, project, and session management
      through a native application. It is aimed both at newcomers and at advanced users
      who want to select external conda, venv, or pyenv environments.
    - >
      The application complements the normal pip or conda installation of the JupyterLab
      web application rather than replacing it. It can also reconnect to compatible
      local or remote Jupyter servers.
  package-nerd-significance:
    - >
      JupyterLab Desktop packages a Python server application, scientific-computing
      environment, and Electron shell as one desktop deliverable. That combination makes
      it an interesting boundary between language-environment packaging and conventional
      desktop application distribution.
  project-history:
    - >
      JupyterLab Desktop is the Project Jupyter distribution that wraps JupyterLab in an
      Electron desktop application. Its modern releases track the bundled JupyterLab
      version and add a separate build number.
    - >
      The project evolved into a cross-platform distribution with installers for Linux,
      macOS, and Windows, a bundled Python environment, project-specific settings,
      session restoration, and command-line launching through jlab.
  related-projects:
    - JupyterLab
    - Jupyter Notebook
    - IPython
    - Project Jupyter
    - Electron
  sources:
    - https://github.com/jupyterlab/jupyterlab-desktop
    - https://github.com/jupyterlab/jupyterlab-desktop/blob/master/Release.md
    - https://github.com/jupyterlab/jupyterlab-desktop/blob/master/user-guide.md
    - https://jupyterlab.readthedocs.io/en/stable/
  summary:
    - >
      JupyterLab Desktop is the official cross-platform Electron application for running
      JupyterLab with bundled or user-selected Python environments.
  timeline:
    - >
      2021: The modern JupyterLab Desktop 3.x release line began publishing
      cross-platform installers.
    - >
      Later releases: Desktop versions adopted the bundled JupyterLab version plus a
      desktop build-number suffix.
  usage:
    - >
      Users can open notebooks or project directories from the graphical application, by
      double-clicking notebook files, or with the jlab command. Each window represents a
      session, and projects can retain their own Python environment and interface
      layout.
    - >
      Advanced users can select conda, venv, or pyenv environments and connect to
      existing local or remote JupyterLab servers. Authentication tokens may be retained
      through the operating system's secure credential store, but the project does not
      document a portable credentials file.
