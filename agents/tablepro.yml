history:
  adoption-history:
    - >
      The project's official site records that TablePro reached number one on GitHub
      Trending on 23 March 2026. It is distributed from GitHub Releases and through a
      Homebrew cask.
    - >
      The application broadened from its bundled relational and key-value drivers to an
      on-demand plugin catalog covering document databases, cloud databases, analytics
      systems, and embedded formats.
  package-nerd-significance:
    - >
      TablePro occupies an unusual niche among database clients: it combines a native
      macOS interface and multi-database coverage with source availability under the
      AGPL, avoiding Electron, JDBC, and a Java runtime.
    - >
      Its plugin registry, Homebrew cask, iCloud-synchronized connection metadata,
      built-in MCP server, and bring-your-own-provider AI features make it especially
      interesting to developers who want both a conventional database workbench and
      controlled automation tooling.
  project-history:
    - >
      TablePro was created as a free, open-source, native alternative to proprietary
      native clients and heavier JVM or Electron database tools. The macOS application
      is built with SwiftUI and AppKit and connects through native database drivers.
    - >
      The project expanded into a multi-platform effort with iPhone and iPad
      applications and a Linux implementation under development. It also added
      downloadable drivers, an AI assistant, an MCP server, URL-scheme integration, and
      a pairing system for external developer tools.
  related-projects:
    - >
      The official README positions TablePro alongside TablePlus, DBeaver, Beekeeper
      Studio, DBGate, Sequel Ace, and Postico while distinguishing itself through native
      multi-database support and an open-source license.
    - >
      A separate official plugin registry supplies database drivers that are installed
      on demand.
  sources:
    - 'Official MCP documentation: https://docs.tablepro.app/features/mcp'
    - 'Official documentation: https://docs.tablepro.app/'
    - 'Official repository README: https://github.com/TableProApp/TablePro#readme'
    - 'Official website: https://tablepro.app/'
  summary:
    - >
      TablePro is a free, AGPL-licensed database workbench built natively for macOS. It
      combines SQL editing, data browsing and editing, import/export, database
      administration, plugins, AI assistance, and an MCP interface across numerous
      database engines.
  timeline:
    - >
      2026-03-23: TablePro reached number one on GitHub Trending, according to the
      official project site.
    - >
      2026: Official releases rapidly expanded the database-driver catalog and developer
      automation features.
    - >
      2026: MCP tooling documented scoped tokens, pairing, auditing, and integrations
      with multiple AI development clients.
  usage:
    - >
      Developers create saved database connections, browse schemas and data, edit rows,
      run and analyze queries, inspect servers, and import or export data. Credentials
      for database connections are stored in the macOS Keychain.
    - >
      External AI clients can use TablePro's bundled stdio bridge or its HTTP MCP
      endpoint. Access is controlled with scoped tokens and optional connection
      allowlists; the service does not expose saved database passwords to MCP clients.
