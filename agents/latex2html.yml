credentials-file-location: null
history:
  adoption-history:
    - >
      LaTeX2HTML became a recognizable part of TeX and Unix publishing culture because
      many academic and technical sites used it to publish manuals, course notes,
      standards drafts, and software documentation as static HTML. The official site
      documents availability through Fedora, Debian, Ubuntu, Homebrew, and MacPorts.
    - >
      Its adoption declined as PDF-first publishing, MathJax, Sphinx, Pandoc, and
      static-site generators became common, but it remains packaged because old document
      trees and automated build systems still depend on its particular HTML output
      model.
  package-nerd-significance:
    - >
      LaTeX2HTML is package-nerd significant because it captures the first wave of
      TeX-to-web conversion in a still-packaged command-line tool. It is also a
      dependency fossil: even if a new project would choose a newer converter, old
      documentation builds may require LaTeX2HTML's exact behavior.
    - >
      For package maintainers, it is the kind of utility that forces careful dependency
      handling around Perl, TeX, Ghostscript, Netpbm, Poppler, dvips, and dvipng.
  project-history:
    - >
      The project originated with Nikos Drakos at the Computer Based Learning Unit,
      University of Leeds; the README names Drakos as the original author, and
      historical generated pages carry 1993 copyright notices. Ross Moore at Macquarie
      University later became a principal author listed in the README, with Marek
      Rouchal and Jens Lippmann listed as former authors.
    - >
      LaTeX2HTML grew alongside the early web as an answer to a concrete publishing
      problem: authors already had structured LaTeX documents, while the web needed
      navigable HTML. Its feature set reflects that era, including generated navigation
      panels, hypertext cross-references, image conversion for equations, and support
      for raw HTML embedded in LaTeX.
    - >
      The GitHub repository was created on 2016-06-27, providing a modern source-control
      home for a tool whose change log still records annual maintenance releases through
      the 2020s.
  related-projects:
    - >
      Related projects and tools include TeX Live, Ghostscript, Netpbm, Poppler, dvips,
      dvipng, Pandoc, HeVeA, TtH, Sphinx, and MathJax-era HTML math publishing.
  sources:
    - https://api.github.com/repos/latex2html/latex2html
    - https://raw.githubusercontent.com/latex2html/latex2html/master/Changes
    - https://raw.githubusercontent.com/latex2html/latex2html/master/README.md
    - https://www.latex2html.org/
  summary:
    - >
      LaTeX2HTML is a long-running LaTeX-to-HTML translator that turns LaTeX documents
      into linked web pages. It preserves document structure, navigation panels,
      cross-references, citations, footnotes, tables of contents, and many LaTeX
      constructs while converting heavily formatted content such as equations and
      figures to images when needed.
  timeline:
    - >
      1993: Historical copyright notices identify Nikos Drakos as author of early
      LaTeX2HTML releases.
    - >
      1997-1999: Ross Moore copyright notices appear in generated LaTeX2HTML pages and
      the README lists him as a later principal author.
    - '1999: The README records a TeX User Group mailing-list archive beginning in 1999.'
    - '2016-06-27: GitHub repository created.'
    - '2024-2026: Change log records maintenance releases for modern TeX and conversion issues.'
  usage:
    - >
      Users run `latex2html` on a LaTeX source file to generate a directory of linked
      HTML pages. Companion tools such as `pstoimg` and `texexpand` support image
      generation and source expansion, and the README points to `perldoc latex2html`,
      `latex2html -help`, and the docs directory for detailed usage.
related-packages:
  - id: brew:hevea
    reason: >
      Choose HEVEA when you want a fast OCaml-based translator that emits HTML directly
      and understands user-defined LaTeX macros; choose LaTeX2HTML when its established
      navigation and image-rendering behavior is required.
    rel: alternative
    sources:
      - https://www.latex2html.org/
      - https://hevea.inria.fr/
  - id: brew:tth
    reason: >
      Choose TtH for a small, portable converter focused on representing mathematical
      TeX in native HTML; choose LaTeX2HTML when image-backed rendering and multi-page
      navigation better suit the document.
    rel: alternative
    sources:
      - https://www.latex2html.org/
      - http://silas.psfc.mit.edu/tth/
  - id: brew:pandoc
    reason: >
      Choose Pandoc when LaTeX is one format in a broader conversion pipeline involving
      Markdown, EPUB, DOCX, or other document formats; choose LaTeX2HTML for its
      specialized legacy LaTeX-to-web model.
    rel: alternative
    sources:
      - https://www.latex2html.org/
      - https://pandoc.org/MANUAL.html
