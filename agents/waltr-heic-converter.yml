history:
  adoption-history:
    - >
      Softorino offered WALTR HEIC Converter as a free Mac and Windows utility. By July
      2019, the company's official material was recommending it for private, offline
      batches of iPhone photographs.
    - >
      Its practical niche emerged from Apple's adoption of HEIC in iOS 11 and the
      continuing need to exchange photographs with software and services expecting JPEG
      or PNG.
  package-nerd-significance:
    - >
      The application packages a narrowly scoped compatibility conversion into a simple
      desktop interface. It is notable to package users who need local batch conversion
      without uploading personal photographs to a web service.
    - >
      Because it operates offline and has no documented account requirement, it is also
      a straightforward example of a privacy-oriented GUI converter.
  project-history:
    - >
      Softorino created WALTR HEIC Converter as a free companion in the WALTR product
      family. The current official branding shortens the visible product name to HEIC
      Converter while the knowledge base retains the WALTR HEIC Converter name.
  related-projects:
    - WALTR PRO is Softorino's broader media conversion and Apple-device transfer application.
    - >
      Apple's iOS camera workflow popularized HEIC files, while JPEG and PNG are the
      application's output formats.
  sources:
    - https://help.softorino.com/help/what-s-waltr-heic-converter
    - https://softorino.com/blog/heic-to-jpg
    - https://softorino.com/heic-converter
  summary:
    - >
      WALTR HEIC Converter is Softorino's free offline utility for converting HEIC
      photographs to JPEG or PNG on macOS and Windows.
  timeline:
    - >
      2017: Apple's iOS 11 made HEIC a common default camera format, creating the
      compatibility problem addressed by the utility.
    - >
      2019: Softorino's official HEIC conversion guide documented WALTR HEIC Converter
      for offline batch conversion.
    - >
      2025: Softorino's knowledge base continued to document the product under the WALTR
      HEIC Converter name.
  usage:
    - >
      Users drag one or more HEIC files into the application, select JPEG or PNG, and
      start conversion. The official product page says batches have no item limit and
      conversion remains on the local computer.
    - >
      Softorino states that the converter preserves EXIF details. For archival work,
      retaining the original HEIC files remains prudent because JPEG output is lossy.
