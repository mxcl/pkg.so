id: cask:dolphin
display-name: Dolphin Emulator
repo: https://github.com/dolphin-emu/dolphin
docs:
  - https://dolphin-emu.org/docs
  - https://dolphin-emu.org/docs/faq
  - https://dolphin-emu.org/docs/guides
  - https://wiki.dolphin-emu.org/
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/dolphin-emu/
    - ~/.dolphin-emu/Config/ (legacy installations)
  macos:
    - ~/Library/Application Support/Dolphin/Config/
  windows:
    - '%APPDATA%\Dolphin Emulator\Config\'
    - '%USERPROFILE%\Documents\Dolphin Emulator\Config\ (existing legacy installations)'
credentials-file-location: null
history:
  adoption-history:
    - >
      Dolphin grew from an experimental GameCube emulator into a mature cross-platform
      emulator with high compatibility across much of the GameCube and Wii libraries.
      The official FAQ credits more than 200 contributors and documents support for
      Windows, Linux, macOS, and Android.
  package-nerd-significance:
    - >
      Dolphin is a landmark open-source emulator and a demanding real-world workload for
      graphics APIs, CPU emulation, controller integration, and reproducible per-game
      configuration. Its continuously published development builds and large
      compatibility knowledge base make it especially visible in enthusiast package
      repositories.
  project-history:
    - >
      Dolphin began as a closed-source GameCube emulator in 2003 and received an
      experimental public release in 2004. The developers opened the source in 2008
      under GPLv2, later adopting GPLv2+, and added experimental Wii support during the
      open-source transition.
  related-projects:
    - The Dolphin Wiki maintains compatibility and configuration notes for individual games.
    - >
      Dolphin's development ecosystem includes an official issue tracker, continuous
      development builds, and platform-specific packaging maintained both upstream and
      by distributions.
  sources:
    - https://dolphin-emu.org/blog/2018/05/02/legend-dolphin-lens-between-worlds/
    - https://dolphin-emu.org/blog/2026/03/12/dolphin-progress-report-release-2603/
    - https://dolphin-emu.org/docs/faq/
    - https://dolphin-emu.org/docs/guides/controlling-global-user-directory/
  summary:
    - >
      Dolphin Emulator is an open-source, cross-platform emulator for Nintendo GameCube
      and Wii software.
  timeline:
    - '2003: Development began as a closed-source GameCube emulator.'
    - '2004: An experimental version was released publicly.'
    - '2008: Dolphin became open source and gained experimental Wii support.'
    - '2026: Upstream added initial Triforce arcade-system support.'
  usage:
    - >
      Users dump games they own, add those images to Dolphin's game library, and
      configure graphics, audio, and emulated or physical controllers. Per-game settings
      and the official compatibility wiki help accommodate titles that need behavior
      different from the global defaults.
