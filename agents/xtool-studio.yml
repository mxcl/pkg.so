history:
  adoption-history:
    - >
      xTool made Studio its primary software platform and recommends it for all xTool
      users. New devices introduced after August 2025 are supported exclusively in
      Studio, creating a deliberate migration path from Creative Space.
  package-nerd-significance:
    - >
      xTool Studio is part of the growing class of hardware-bound creative applications
      delivered as desktop packages. It is operationally important because design,
      material parameters, device setup, processing previews, firmware interaction, and
      cloud projects converge in one vendor-maintained client.
  project-history:
    - >
      xTool Studio is xTool's desktop design and machine-control environment for its
      laser cutters, printers, and related fabrication hardware. It was developed as the
      successor to xTool Creative Space, with a redesigned interface, expanded design
      resources, AI-assisted tools, cloud integration, and device-processing workflows.
    - >
      The first public Studio desktop release listed by xTool is version 1.0.14 from
      September 2025. Creative Space ended at version 2.7, after which feature and
      device development shifted to Studio.
  related-projects:
    - >
      xTool Creative Space is Studio's predecessor and remains a separately installable
      application.
    - >
      Atomm supplies designs and creative inspiration accessible from Studio, while
      AImake provides integrated generative and image-editing functions.
  sources:
    - 'Official Studio overview: https://support.xtool.com/article/3404'
    - >
      Official release notes for the initial desktop release:
      https://support.xtool.com/article/3414
    - 'Official software wiki: https://support.xtool.com/learning-center'
    - 'Official transition guide: https://support.xtool.com/article/2909'
  summary:
    - >
      xTool Studio is xTool's proprietary desktop environment for designing projects and
      controlling xTool fabrication machines. Introduced in 2025 as the successor to
      xTool Creative Space, it combines canvas editing, material parameters, processing
      previews, device control, templates, AI-assisted creation, and local or cloud
      project storage.
  timeline:
    - '2025: xTool Creative Space 2.7 became the final Creative Space desktop release.'
    - '2025: xTool Studio Desktop 1.0.14 was released on September 4.'
    - '2025: New xTool products released after August began receiving Studio-only support.'
    - '2026: Studio 1.7 introduced the .xs project format and cloud-file version history.'
  usage:
    - >
      Users create or import artwork, arrange and edit it on a canvas, select materials
      and processing parameters, preview a job, connect an xTool machine, and send the
      design for engraving, cutting, or printing.
    - >
      An xTool account is optional for basic local work but required for services such
      as Cloud Space and some AI features. Projects can be stored locally or in xTool's
      cloud.
