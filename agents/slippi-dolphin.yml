history:
  adoption-history:
    - >
      Slippi grew from a data-rich replay infrastructure into a broader Melee platform.
      Its Dolphin integration records portable `.slp` files; companion tools analyze
      them, support broadcasts, and reproduce matches. Slippi Online later added
      improved netcode and matchmaking, and the project became a central modern
      toolchain for online and data-driven competitive Melee.
  package-nerd-significance:
    - >
      Slippi is a prominent example of a specialized emulator fork becoming
      infrastructure for an esports community. Its combination of emulator patches,
      PowerPC assembly modifications, a documented replay format, launcher, parsing
      libraries, and console tooling supports both players and an ecosystem of
      statistics, overlays, archival, and tournament software.
  project-history:
    - >
      Project Slippi was created to modernize the competitive Super Smash Bros. Melee
      experience, initially around portable replays and metadata. The emulator component
      was built on the Faster Melee/Ishiiruka branch of Dolphin and works with Slippi's
      Melee assembly modifications. Creator and project lead Fizzi left his job in
      November 2019 to work on Slippi full-time; the later release of Slippi Online
      expanded the system with rollback-oriented online play and matchmaking.
  related-projects:
    - Dolphin Emulator
    - Ishiiruka and Faster Melee
    - Slippi Launcher
    - slippi-js
    - Slippi SSBM ASM
    - Slippi Nintendont
  sources:
    - https://github.com/project-slippi/project-slippi
    - https://github.com/project-slippi/slippi-launcher
    - https://github.com/project-slippi/slippi-wiki/blob/master/GETTING_STARTED.md
    - https://github.com/project-slippi/slippi-wiki/blob/master/SPEC.md
    - https://www.slippi.gg/about
  summary:
    - >
      Slippi Dolphin is a customized Dolphin emulator in the Project Slippi ecosystem,
      built to support Super Smash Bros. Melee replays, statistics, matchmaking, and
      low-latency online play.
  timeline:
    - '2018: The documented `.slp` replay format was in use for recorded Melee games.'
    - '2019: Project lead Fizzi began working on Slippi full-time.'
    - >
      2020: Slippi Online brought improved online netcode and matchmaking to the wider
      Melee community.
  usage:
    - >
      Players supply their own Melee disc image and use Slippi Dolphin, normally managed
      through Slippi Launcher, to play online and record matches. The launcher updates
      Dolphin, starts netplay, browses and analyzes `.slp` replays, and launches replay
      playback.
