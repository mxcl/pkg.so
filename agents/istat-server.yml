id: cask:istat-server
display-name: iStat Server
repo: null
docs:
  - https://bjango.com/help/istat3/firewalls
  - https://diagnostics.bjango.com/help/istat3/gettingstarted
  - https://diagnostics.bjango.com/istatserver
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Bjango distributed iStat Server for macOS, Windows, Linux, FreeBSD, AIX, Solaris,
      and other Unix-like systems, making the iStat monitoring model useful across mixed
      fleets.
  package-nerd-significance:
    - >
      It represents the server-side half of an unusually broad desktop-and-mobile
      monitoring ecosystem. The Linux edition's conventional source build and included
      rc.d, Upstart, and systemd examples are particularly recognizable to package
      maintainers.
  project-history:
    - >
      iStat Server was created by Bjango as the host agent for iStat: it gathers vital
      statistics from a computer or server and exposes them to iStat View clients.
      Version 3 established a common generation across the client and server components.
  related-projects:
    - iStat
    - iStat View
    - iStat Server for Linux
    - iStat Menus
  sources:
    - https://bjango.com/help/istat3/linuxpackages/
    - https://diagnostics.bjango.com/help/istat3/gettingstarted/
    - https://diagnostics.bjango.com/istatserver/
  summary:
    - >
      iStat Server is Bjango's background monitoring agent for sending system statistics
      to iStat View on macOS or iOS. This cask packages the macOS edition.
  timeline:
    - 'Version 3: iStat 3 requires the corresponding iStat Server 3 generation.'
    - 'Version 3.03: Version identified by Bjango for the macOS server download.'
  usage:
    - >
      Install it on the Mac to be monitored, then connect from iStat View. Bjango
      documents TCP port 5109 and notes that firewall or port-forwarding configuration
      may be needed for remote access.
tags:
