history:
  adoption-history:
    - >
      dmg2img became useful in packaging and recovery workflows because DMG files are
      common distribution containers for macOS software, but package builders and Linux
      users often need ordinary image output. Its small C utility shape makes it easy
      for package managers to ship alongside tools such as vfdecrypt.
  package-nerd-significance:
    - >
      Package nerds care about dmg2img because it is the boring glue that lets non-macOS
      build and forensic environments handle Apple's disk-image packaging format without
      a large desktop stack.
  project-history:
    - >
      The original project is published from the vu1tur.eu.org tools page, whose dmg2img
      page describes the tool and carries the upstream changelog. The maintained GitHub
      tree says it imports the original dmg2img code and tarballs, while Peter Wu's
      maintenance branch adds bug fixes, security fixes, and other enhancements.
  related-projects:
    - vfdecrypt is shipped with dmg2img for encrypted DMG workflows.
    - Apple's Disk Utility and hdiutil cover similar disk-image work on macOS.
  sources:
    - https://vu1tur.eu.org/dmg2img
    - https://github.com/Lekensteyn/dmg2img
  summary:
    - >
      dmg2img is a small command-line converter for turning Apple compressed DMG disk
      images into standard HFS+ image files. Its package-manager appeal is that it gives
      Unix and Windows users a narrow, scriptable way to inspect or convert macOS disk
      images without Apple's Disk Utility.
  timeline:
    - '2017: The upstream changelog lists dmg2img 1.6.7.'
    - '2020: The maintained GitHub tree records imported upstream code plus maintenance fixes.'
  usage:
    - >
      Typical use is a one-shot conversion from a .dmg input to an .img output, followed
      by mounting or extracting the resulting filesystem image with platform tools. The
      maintained README also documents optional build support for newer compression
      handling such as LZFSE.
