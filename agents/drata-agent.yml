history:
  adoption-history:
    - >
      Drata launched its compliance-automation platform in 2021 and initially focused on
      automated SOC 2 compliance. The company says the platform reached thousands of
      customers within its first two years and later expanded into broader governance,
      risk, compliance, and trust management.
    - >
      The agent supports managed compliance workflows across macOS, Windows, and
      supported Ubuntu LTS releases. Drata's onboarding flow distributes and registers
      it through each user's My Drata page.
  package-nerd-significance:
    - >
      Drata Agent represents the enterprise endpoint-compliance class of desktop
      packages: it is installed locally but managed through an organization's SaaS
      account, runs automatically, and reports security posture rather than functioning
      as a conventional interactive utility.
    - >
      Its presence in desktop package managers is useful for fleet setup, although
      successful registration still requires an active Drata production account and an
      organization-controlled verification flow.
  project-history:
    - >
      Drata was founded during the COVID-19 pandemic and launched its
      compliance-automation platform in 2021. The endpoint agent became part of its
      method for continuously collecting evidence about workforce-device security
      settings.
    - >
      The official agent source describes an Electron application using osquery
      components. Official documentation now presents it as a lightweight, automatically
      updated application with read-only access to relevant system settings.
  related-projects:
    - >
      The agent is a component of the Drata governance, risk, compliance, and
      trust-management platform.
    - >
      The official source documentation identifies Electron and osquery as underlying
      technologies.
  sources:
    - >
      Official agent installation guide:
      https://help.drata.com/en/articles/13612377-install-the-drata-agent
    - 'Official agent source README: https://github.com/drata/drata-agent#readme'
    - 'Official five-year retrospective: https://drata.com/blog/celebrating-five-years'
    - 'Official two-year retrospective: https://drata.com/blog/celebrating-two-years'
  summary:
    - >
      Drata Agent is a lightweight endpoint application that reports selected
      device-security settings to the Drata compliance platform.
  timeline:
    - '2021: Drata launched its compliance-automation platform from stealth.'
    - >
      2023: Drata reported thousands of customers and support for more than fourteen
      compliance frameworks, standards, and regulations.
    - >
      2026: Drata marked five years and described its evolution toward a broader
      continuous-trust platform.
  usage:
    - >
      An employee installs the appropriate package from the My Drata onboarding page,
      opens the agent, selects Register Drata Agent, and completes verification through
      an emailed link. Once registered, it runs in the background and checks settings
      such as disk encryption, screen locking, antivirus, password-manager use, and
      automatic updates.
