history:
  adoption-history:
    - >
      The project appears to have been a niche academic and systems-networking library
      rather than a broad user-facing tool. Homebrew packaging keeps the library and the
      `mcastproxy` and `rmchat` executables installable for legacy multicast
      experiments.
  package-nerd-significance:
    - >
      rmcast is notable to package maintainers as a preserved multicast library with old
      release tarballs, bundled manual material, and QPL licensing. It represents the
      kind of specialized networking code that survives mostly through Unix package
      collections.
  project-history:
    - >
      The official archived project page explains that IP multicast saves bandwidth by
      sending one packet across each physical link, but that UDP-based multicast lacks
      reliability. RML was developed to provide a reliable multicast environment and was
      distributed under the QPL.
  related-projects:
    - >
      Related technologies include IP multicast, UDP, reliable multicast protocols,
      `mcastproxy`, and `rmchat`.
  sources:
    - https://formulae.brew.sh/api/formula/rmcast.json
    - >
      https://web.archive.org/web/20250722003825/https://www.land.ufrj.br/tools/rmcast/rmcast.html
    - source_facts.executables
  summary:
    - >
      rmcast packages RML, the Reliable Multicast Library, a free software library for
      reliable data transmission over IP multicast.
  timeline:
    - '2004: Version 1.5 released on 2004-09-26.'
    - '2005: Version 1.6 released on 2005-12-14.'
    - '2006: Versions 1.7 and 1.8 released.'
    - '2008: Version 1.9 released on 2008-05-01.'
    - '2009: Version 2.0.0 released on 2009-08-06.'
  usage:
    - >
      Package-level usage centers on the reliable multicast library and the shipped
      command-line programs `mcastproxy` and `rmchat`; the official project page says
      the release tarballs included a manual.
