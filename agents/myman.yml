history:
  project-history:
    - >
      The README history says MyMan was written on a dare on 1998-06-28. The first
      version had no color or attribute support, used large tiles, consisted of 742
      lines of ANSI C, and depended on three data files for the maze, tiles, and
      sprites. It ran with ncurses on Linux and Cygwin, gained alternate maze layouts
      within hours, and later gained color and small-tile support in December 1998. The
      README credits Benjamin C. Wiley Sittler for the 1997-2009 copyright period and
      states that the program moved from its original public-domain status to a
      BSD-style license.
  sources:
    - https://formulae.brew.sh/formula/myman
    - https://github.com/kragen/myman
    - https://github.com/kragen/myman/blob/master/README
    - https://myman.sourceforge.io/
    - https://sourceforge.net/projects/myman
  summary:
    - >
      MyMan is a text-mode arcade game inspired by Namco's Pac-Man. The project homepage
      describes it as a terminal-oriented game that has been ported across a wide set of
      text and graphics backends, including ncurses, PDCurses, S/Lang curses, Win32
      console, VMS console, raw stdio/termios, GGI, Allegro, aalib, libcaca, TWin, and
      Carbon. That portability is the package's main historical identity: it is less a
      modern game platform than a compact C program exploring how much of a maze-chase
      arcade game can be carried by text displays.
  usage:
    - >
      As packaged by Homebrew, Nix, and openSUSE, MyMan is a small terminal-game
      curiosity rather than an ecosystem foundation. Users run the `myman` executable
      for a Pac-Man-like game rendered with characters, and the project site also
      publishes plain-text and HTML screenshots to show how the same game appears in a
      terminal.
