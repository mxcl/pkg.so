id: cask:memoryanalyzer
display-name: Eclipse Memory Analyzer
repo: https://github.com/eclipse-mat/mat
docs:
  - https://eclipse.dev/mat/documentation
  - >
    https://help.eclipse.org/latest/index.jsp?topic=%2Forg.eclipse.mat.ui.help%2Fwelcome.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Eclipse lists Memory Analyzer as a mature project and records its participation
      across many coordinated Eclipse IDE release trains, beginning with Galileo and
      continuing through modern quarterly releases.
  package-nerd-significance:
    - >
      MAT is a standard specialist tool in the Java troubleshooting toolbox because it
      can index very large heap dumps, calculate retained sizes, trace
      garbage-collection roots, and generate leak-suspect reports.
  project-history:
    - >
      The Eclipse Memory Analyzer project was created in February 2008. Eclipse records
      milestone 0.7.0 in December 2008, 0.8.0 in June 2009, and the 1.0.0 release in May
      2010.
    - >
      The project later graduated and moved into the Eclipse Tools top-level project. It
      remains actively maintained as both a standalone Eclipse RCP application and
      Eclipse-installable tooling.
  related-projects:
    - Eclipse IDE and Eclipse RCP, which provide the application platform and plug-in model.
    - Java HPROF and other supported heap-dump formats that MAT parses.
  sources:
    - https://eclipse.dev/mat/
    - https://github.com/eclipse-mat/mat
    - https://projects.eclipse.org/projects/tools.mat
    - https://projects.eclipse.org/projects/tools.mat/governance
  summary:
    - >
      Eclipse Memory Analyzer, commonly called MAT, is an Eclipse Foundation tool for
      diagnosing Java heap usage, memory leaks, and out-of-memory failures.
  timeline:
    - '2008: Eclipse Memory Analyzer project created.'
    - '2008: Version 0.7.0 released.'
    - '2009: Version 0.8.0 released.'
    - '2010: Project graduated and moved to Eclipse Tools.'
    - '2010: Version 1.0.0 released.'
  usage:
    - >
      Open a Java heap dump, inspect dominator trees and retained sizes, trace paths to
      garbage-collection roots, or run the automated Leak Suspects report. It is
      commonly used after an OutOfMemoryError or while investigating unexpectedly high
      JVM memory consumption.
tags:
