id: brew:cadaver
display-name: cadaver
repo: https://github.com/notroj/cadaver
docs:
  - https://github.com/notroj/cadaver#readme
  - https://github.com/notroj/cadaver/blob/master/doc/cadaver.1
  - https://notroj.github.io/cadaver
config-file-location:
  unix:
    - ~/.cadaverrc
credentials-file-location:
  unix:
    - ~/.netrc
history:
  adoption-history:
    - >
      cadaver became a packaging staple because it fills a narrow but durable role:
      scripted or interactive WebDAV access without mounting a filesystem or using a
      graphical client. The Homebrew input records packaging across Alpine, Debian,
      Fedora, Homebrew, MacPorts, Nix, Arch, Ubuntu, and openSUSE.
  package-nerd-significance:
    - >
      For package maintainers, cadaver is a classic small Unix network client: old
      enough to expose Autotools, gettext, readline, iconv, OpenSSL/neon, netrc, and
      locale wrinkles, but still useful as a regression target for WebDAV servers and
      packaging systems.
  project-history:
    - >
      The project is credited to Joe Orton and the README records copyright years
      beginning in 1999. Its NEWS file shows the tool evolving from basic
      open/get/put/mkcol/delete operations in the 0.2 and 0.3 era into remote globbing,
      mget/mput, locking, WebDAV properties, SSL support through neon, DASL/DeltaV
      support, and later portability and security updates.
    - >
      cadaver has stayed deliberately close to the Unix terminal model: a small C
      client, readline-style interaction, a user rc file, netrc support, and a man page.
      Later releases continued maintenance rather than reinvention, including neon
      updates, path and character-set rewrites, proxy support, and new commands such as
      resumeget and head.
  related-projects:
    - >
      cadaver is closely tied to the neon HTTP/WebDAV client library, which it uses for
      WebDAV, SSL, authentication, and protocol handling. Its command model is
      explicitly compared to BSD ftp and Samba smbclient.
  sources:
    - https://github.com/notroj/cadaver#readme
    - https://notroj.github.io/cadaver/
    - https://raw.githubusercontent.com/notroj/cadaver/master/NEWS
    - https://raw.githubusercontent.com/notroj/cadaver/master/doc/cadaver.1
    - source_facts.package-manager
  summary:
    - >
      cadaver is a long-running Unix command-line WebDAV client in the tradition of
      interactive file-transfer tools. Its own documentation describes an ftp- and
      smbclient-like interface for uploading, downloading, editing, copying, moving,
      creating collections, manipulating properties, and working with WebDAV locks over
      HTTP and HTTPS.
  timeline:
    - "1999: README copyright range begins for Joe Orton's cadaver."
    - >
      2001: 0.21.0 adds DASL searching and DeltaV basic versioning support from the
      GRASE team.
    - '2007: 0.22.5 updates neon for a URI parser security fix.'
    - '2009: 0.23.3 updates to neon 0.29.1.'
    - '2022: 0.24 modernizes configure scripts and supports newer neon.'
    - '2024: 0.26 rewrites path and character-set handling.'
    - '2025: 0.28 adds resumeget and head commands.'
  usage:
    - >
      Typical use is to run cadaver with an absolute http or https URL, then navigate
      and modify a WebDAV collection with commands such as ls, cd, get, put, edit,
      mkcol, copy, move, lock, unlock, propget, and propset. Its man page documents
      ~/.cadaverrc for startup commands and ~/.netrc for automatic authentication.
related-packages:
  - id: brew:neon
    reason: >
      cadaver directly uses the neon HTTP/WebDAV client library, so neon is the relevant
      lower-level companion for building, debugging, or extending its protocol behavior.
    rel: adjacent_workflow
    sources:
      - https://github.com/notroj/cadaver
      - https://notroj.github.io/neon-docs/
