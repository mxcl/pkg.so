config-file-location:
  unix:
    - ~/.config/slicer.org/Slicer.ini
    - ~/.config/slicer.org/Slicer-<REVISION>.ini
  windows:
    - '%USERPROFILE%\AppData\Roaming\slicer.org\Slicer.ini'
    - '%USERPROFILE%\AppData\Roaming\slicer.org\Slicer-<REVISION>.ini'
credentials-file-location: null
history:
  adoption-history:
    - >
      3D Slicer developed into an international research platform supported by users,
      developers, academic contributors, commercial partners, and substantial US
      National Institutes of Health funding. The official project site describes an
      ecosystem of more than 150 installable extensions and broad use across
      medical-image computing specialties.
    - >
      Its adoption spans interactive research, clinical-prototype development, teaching,
      and custom application development. The project documents workflows including
      DICOM interoperability, segmentation, registration, image-guided therapy,
      radiotherapy, tractography, surgical planning, and AI-assisted annotation.
  package-nerd-significance:
    - >
      3D Slicer is an unusually substantial desktop package: it bundles a
      medical-imaging workstation, Python environment, development platform, and
      extension manager around major scientific libraries such as VTK and ITK.
      Application-level extensions and Python packages are commonly managed inside
      Slicer rather than through the host system's package manager.
    - >
      The Homebrew cask offers a reproducible installation entry point for the macOS
      application, while Slicer's own extension infrastructure supplies specialized
      modules independently of the cask.
  project-history:
    - >
      3D Slicer has evolved through several major generations as a free, open-source
      platform for visualization and image analysis. The official historical wiki
      records the Slicer 3 line, early Slicer 4 alpha builds in 2010, and the Slicer 4.0
      release at RSNA in November 2011.
    - >
      The modern project is maintained by an international community and serves both as
      an end-user application and a framework for building research or commercial
      image-computing solutions.
  related-projects:
    - "VTK: A visualization toolkit central to Slicer's rendering and data-processing stack."
    - 'ITK: A medical-image analysis toolkit used throughout the Slicer ecosystem.'
    - "CMake and Qt: Core technologies in Slicer's build system and desktop interface."
    - >
      SlicerIGT and SlicerRT: Domain-specific extension ecosystems for image-guided
      therapy and radiation therapy.
  sources:
    - https://github.com/Slicer/Slicer
    - https://slicer.readthedocs.io/en/latest/
    - https://www.slicer.org/
    - https://www.slicer.org/wiki/News
  summary:
    - >
      3D Slicer is a free, open-source, cross-platform application and development
      environment for visualization, segmentation, registration, processing, and
      analysis of medical and other three-dimensional data.
  timeline:
    - '2010: Early alpha versions of the Qt-based Slicer 4 became available.'
    - '2011: Slicer 4.0 was released at RSNA.'
    - >
      2012–2016: The official project history records continued Slicer 4 releases and
      expanding research and training activity.
  usage:
    - >
      Users import DICOM studies, volumes, meshes, and other scientific data; process
      them with built-in or extension modules; visualize results in two and three
      dimensions; and save scenes or derived datasets.
    - >
      Researchers and developers can automate workflows with Slicer's embedded Python
      environment or build scripted and compiled extensions.
