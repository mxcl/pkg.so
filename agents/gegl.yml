history:
  adoption-history:
    - >
      The GEGL site names GIMP as the flagship user and also points to GNOME Photos,
      imgflo, and other graphics projects as users of the framework. GIMP 2.10's GEGL
      port gave the library broad downstream exposure because every distribution
      packaging GIMP also needed the GEGL stack and its close companion library, babl.
    - >
      For package maintainers, GEGL is notable because it sits at the boundary between
      an end-user desktop application and a reusable media-processing runtime. Its
      operations, command-line interface, plugins, and GObject-based API make it a
      common dependency in GNOME and graphics-oriented package sets.
  package-nerd-significance:
    - >
      GEGL matters to package nerds because it is both a leaf command and a heavy shared
      dependency. Version skew between GEGL, babl, and GIMP can affect image loading,
      filters, and plugin behavior, so distro and Homebrew formula updates tend to track
      it alongside the rest of the GIMP graphics stack.
  project-history:
    - >
      GEGL's public source history reaches back to the early GNOME graphics stack era,
      with early repository activity in 2000 and later 0.x release tags preserved in the
      GNOME repository. The project evolved around processing images as graphs of
      operations rather than as one-off filter calls, exposing floating-point
      processing, non-destructive pipeline structure, and reusable operations.
    - >
      GIMP's 2.10 development cycle made GEGL historically important beyond a standalone
      library. The GIMP release notes describe the 2.10 release as the result of a
      six-year effort that originally focused on porting the application to GEGL,
      completing a progression that began with optional GEGL-backed color tools and
      ended with GEGL handling tile management and project graphs.
  related-projects:
    - >
      GEGL is closely tied to GIMP, babl, GNOME Photos, imgflo, and other graphics
      projects that consume GEGL operations or depend on its color and image-processing
      model.
  sources:
    - https://developer.gimp.org/api/gegl/
    - https://gegl.org/
    - https://gitlab.gnome.org/GNOME/gegl
    - https://www.gimp.org/release-notes/gimp-2.10.html
  summary:
    - >
      GEGL, the Generic Graphics Library, is a data-flow image processing framework used
      both as a library and through the `gegl` command-line tool. Its package-manager
      interest comes from its role as the image-processing engine behind GIMP's modern
      high bit-depth, graph-based processing pipeline.
  timeline:
    - '2000: Early GEGL source history appears in the GNOME repository.'
    - "2012-2018: GIMP's six-year 2.10 development cycle centers on completing the GEGL port."
    - '2018: GIMP 2.10 ships with GEGL used for tile management and project processing graphs.'
  usage:
    - >
      Practitioners use GEGL by chaining operations into processing graphs. Developers
      link against the C API or write operations; users and testers can invoke `gegl` on
      the command line to run the same style of pipelines outside GIMP.
    - >
      In GIMP workflows, GEGL-backed filters support higher bit depths, multi-threaded
      processing, split previews, saved presets, and the architectural groundwork for
      non-destructive editing.
related-packages:
  - id: brew:babl
    reason: >
      babl provides the pixel-format and color-space conversions used internally by GEGL
      buffers, making it GEGL's closest lower-level companion library.
    rel: adjacent_workflow
    sources:
      - https://gegl.org/babl/
      - https://developer.gimp.org/api/gegl/
  - id: cask:gimp
    reason: >
      GIMP is the principal desktop application built on GEGL and exposes GEGL
      operations as high-bit-depth, graph-backed image filters and processing tools.
    rel: adjacent_workflow
    sources:
      - https://gegl.org/
      - https://www.gimp.org/release-notes/gimp-2.10.html
      - https://www.gimp.org/about/
