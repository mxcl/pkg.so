history:
  adoption-history:
    - >
      The Phoenix Firestorm Project describes a volunteer organization divided among
      development, support, quality assurance, and gateway teams, with multilingual
      support for its user community.
    - >
      Firestorm is distributed for macOS, Windows, and Linux and serves users of Second
      Life and compatible OpenSim virtual worlds. Its breadth of customization and
      continuity with Phoenix Viewer have made it a prominent third-party viewer.
  package-nerd-significance:
    - >
      Firestorm matters to package enthusiasts as a large, cross-platform desktop client
      descended from an unusually long-lived open-source virtual-world codebase. Its
      build combines the Linden Lab viewer foundation with project-specific features,
      release branches, build variables, and optional components.
    - >
      The Homebrew cask provides a convenient managed installation for macOS users who
      otherwise obtain prebuilt releases from the project website.
  project-history:
    - >
      Firestorm Viewer is developed by the nonprofit Phoenix Firestorm Project and
      succeeded the discontinued Phoenix Viewer. The project describes Firestorm as an
      advanced viewer with extensive features, interface flexibility, and an optional
      Phoenix-like appearance.
    - >
      Its code derives from Linden Lab's Second Life viewer, whose client codebase has
      been open source since 2007 under the LGPL. Firestorm continues that lineage while
      targeting Second Life and OpenSim worlds.
  related-projects:
    - Phoenix Viewer is Firestorm's discontinued predecessor.
    - Linden Lab's Second Life Viewer supplies the upstream LGPL code lineage.
    - OpenSim provides compatible virtual worlds that Firestorm can access.
  sources:
    - 'Input package mapping: source_facts.package-manager.brew-cask'
    - 'Official project organization profile: https://github.com/FirestormViewer'
    - 'Official project wiki: https://wiki.firestormviewer.org/'
    - 'Official source repository: https://github.com/FirestormViewer/phoenix-firestorm'
  summary:
    - >
      Firestorm Viewer is a free, open-source desktop client for Second Life and OpenSim
      virtual worlds. It emphasizes extensive features, interface customization, and
      compatibility with workflows inherited from Phoenix Viewer.
  timeline:
    - "2007: Linden Lab's upstream Second Life client codebase became open source."
    - 'After Phoenix Viewer was discontinued: Firestorm continued as its successor.'
    - >
      Present: The Phoenix Firestorm Project maintains cross-platform releases and an
      active source repository.
  usage:
    - >
      Users sign in to a supported virtual world to explore 3D environments,
      communicate, create content, manage inventory, and customize the viewer interface.
    - >
      Prebuilt releases are intended for ordinary users. The official repository also
      documents source builds, but the project explicitly does not provide normal
      support for self-compiled viewers.
