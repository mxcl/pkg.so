id: cask:duplicacy-web-edition
display-name: Duplicacy Web Edition
repo: null
docs:
  - https://duplicacy.com/guide.html
config-file-location:
  unix:
    - ~/.duplicacy-web/duplicacy.json
  windows:
    - '%USERPROFILE%\.duplicacy-web\duplicacy.json'
    - >
      C:\ProgramData\.duplicacy-web\duplicacy.json (when installed as a Windows service
      for all users)
credentials-file-location: null
history:
  adoption-history:
    - >
      Duplicacy Web Edition replaced the older native GUI as the full-featured graphical
      frontend. Official releases support Windows, macOS, Linux, FreeBSD, QNAP, and
      Synology environments.
    - >
      Version 1.0.0 was announced in 2020. Later releases added and refined deployment
      options for desktop systems, Windows services, NAS platforms, and managed or
      customized installations.
  package-nerd-significance:
    - >
      Duplicacy is distinguished by lock-free deduplication, which allows multiple
      clients to share deduplicated storage without a centralized chunk database or
      storage locks.
    - >
      Web Edition packages the Duplicacy command-line engine into a scheduler and
      dashboard while retaining access to backup, restore, check, copy, and prune
      operations. This separation between a source-available CLI engine and a separately
      distributed web frontend is important when assessing packaging, licensing, and
      reproducibility.
  project-history:
    - >
      Duplicacy was created as a cross-platform backup system centered on client-side
      encryption and lock-free deduplication. Its command-line engine is published in
      the `gilbertchen/duplicacy` repository.
    - >
      The web-based GUI was introduced after the earlier native GUI. It drives the CLI
      engine and adds browser-based configuration, scheduling, notifications, reporting,
      and storage-health views.
  related-projects:
    - >
      Duplicacy CLI is the engine used to perform Web Edition operations and has its
      source in the official `gilbertchen/duplicacy` repository.
    - >
      Duplicacy Native GUI is the older, limited graphical frontend that the official
      download page describes as being deprecated.
  sources:
    - https://duplicacy.com/
    - https://duplicacy.com/download.html
    - https://duplicacy.com/guide.html
    - https://forum.duplicacy.com/t/duplicacy-web-edition-1-0-0-is-now-available/3605
    - https://github.com/gilbertchen/duplicacy
  summary:
    - >
      Duplicacy Web Edition is the cross-platform web interface for Duplicacy's
      encrypted, deduplicating backup engine. It manages backup, restore, check, copy,
      prune, and scheduled jobs.
  timeline:
    - '2019: The official site and user guide were updated for the new web-based GUI.'
    - '2020: Duplicacy Web Edition 1.0.0 was released.'
    - >
      2021: The Duplicacy lock-free deduplication paper was accepted by IEEE
      Transactions on Cloud Computing.
    - '2022–2026: The Web Edition release line continued with desktop, server, and NAS builds.'
  usage:
    - >
      Administrators add local or cloud storage targets, define directories and backup
      IDs, and arrange backup, check, copy, and prune jobs into schedules.
    - >
      A master password encrypts stored storage credentials. A derived token is kept in
      the operating system's Keychain or Keyring when available; the application
      requests the password after restart when secure OS storage is unavailable.
    - >
      The web service listens on localhost port 3875 by default and can be configured
      for remote access and HTTPS.
tags:
  - backup
  - cloud-backup
  - cross-platform
  - deduplication
  - encryption
  - scheduler
  - web-ui
