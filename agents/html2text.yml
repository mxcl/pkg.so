id: brew:html2text
display-name: html2text
repo: https://gitlab.com/grobian/html2text
docs:
  - https://gitlab.com/grobian/html2text#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool is packaged across Homebrew, Debian, Ubuntu, Alpine, MacPorts, Nix, Arch,
      and Fedora-family ecosystems. Its adoption is helped by a stable command name and
      by mailcap integration examples for text-mode mail clients such as Mutt.
  package-nerd-significance:
    - >
      html2text is package-nerd material because it solves a stubborn Unix desktop
      problem: making HTML email tolerable in text-mode tools. It is small enough for a
      mailcap line, but specialized enough to preserve tables, links, alignment, and
      character-set behavior better than a bare text dump.
  project-history:
    - >
      The README states that the repository continues the project formerly hosted at
      mbayer.de/html2text and carries patches that were no longer available from the
      original sources. It also states that version 2.0 made the GitLab repository the
      official home.
    - >
      GitLab tag metadata places v2.0.0 in 2020, followed by v2.1.x in 2022, v2.2.x in
      2023, and v2.3.0 and v2.4.0 in 2025. The ChangeLog shows that later work added
      autotools-based builds, compatibility flags, whitespace normalization, ANSI escape
      output, color handling, and direct URL retrieval.
  related-projects:
    - >
      Related tools include lynx -dump, w3m -dump, pandoc, Python html2text, and
      mailcap-driven HTML viewers used by Mutt and similar text mail clients.
  sources:
    - Homebrew and distribution package metadata support package-manager adoption.
    - The GitLab ChangeLog and tag API document the 2.x release evolution.
    - >
      The GitLab README documents origin, email-focused usage, and official-home status
      from version 2.0.
  summary:
    - >
      html2text renders HTML into terminal- and email-friendly plain text. The
      grobian-maintained project is a continuation of Martin Bayer's older html2text,
      with a focus on mail clients, terminal width, links, tables, character sets, and
      ANSI rendering.
  timeline:
    - "Pre-2020: Martin Bayer's html2text provided the original project line."
    - '2020: v2.0.0 established the grobian GitLab repository as the official home.'
    - '2022: v2.1.x releases continued the 2.x series.'
    - >
      2023: v2.2.0 moved the build system to autotools and added compatibility and
      whitespace work.
    - '2025: v2.3.0 added ANSI and color handling; v2.4.0 added direct remote URL retrieval.'
  usage:
    - >
      The README's central workflow is rendering text/html parts for terminal email. It
      shows a mailcap entry using html2text with ANSI output, link references, charset
      conversion, and terminal-width wrapping, plus Mutt configuration that auto-views
      HTML mail through the converter.
related-packages:
  - id: brew:neomutt
    reason: >
      NeoMutt can automatically display text/html MIME parts through a mailcap-defined
      filter, making html2text a practical external renderer for terminal email.
    rel: adjacent_workflow
    sources:
      - https://gitlab.com/grobian/html2text/-/blob/master/README.md
      - https://docs.neomutt.org/howto/mime.html
  - id: brew:w3m
    reason: >
      Choose w3m when you want HTML-to-text dumping plus an interactive terminal
      browser, rather than html2text's more focused email-rendering workflow.
    rel: alternative
    sources:
      - https://gitlab.com/grobian/html2text
      - https://w3m.sourceforge.net/MANUAL
  - id: brew:lynx
    reason: >
      Choose Lynx when formatted text output is needed alongside mature interactive
      browsing and crawling features; its official command supports noninteractive
      output with `-dump`.
    rel: alternative
    sources:
      - https://gitlab.com/grobian/html2text
      - https://lynx.invisible-island.net/manpage/
