history:
  adoption-history:
    - >
      MediaConch's adoption is narrower than MediaInfo's but important in digital
      preservation circles. The official documentation frames it for memory institutions
      that need batch-level validation, policy exchange, and sidecar reports for
      audiovisual collections.
    - >
      Package availability in Homebrew, Debian, Ubuntu, and Fedora reflects that
      specialist role: it is not a casual desktop codec tool, but a CLI-capable
      validator that archivists and preservation engineers can put into repeatable
      ingest and quality-control pipelines.
  package-nerd-significance:
    - >
      MediaConch matters to package maintainers because it packages institutional
      audiovisual validation into a reproducible command-line tool. Its dependency on
      MediaArea's codec and metadata knowledge makes it a practical companion to
      MediaInfo for archives that need policy-driven checks rather than simple file
      identification.
  project-history:
    - >
      MediaConch was created by MediaArea, the team behind MediaInfo, and the official
      project page says it received funding from PREFORMA, co-funded by the European
      Commission FP7-ICT Programme. The GitHub repository description also identifies
      MediaConch as funded by PREFORMA.
    - >
      The project was designed around a preservation workflow rather than a general
      media-player workflow: check implementation conformance, apply
      institution-specific policies, generate reports, and expose the same policy
      structure through CLI, GUI, and Web UI surfaces.
  related-projects:
    - >
      MediaConch is part of the MediaArea family and relates directly to MediaInfo,
      MediaTrace, Matroska, FFV1, LPCM, and PREFORMA preservation tooling.
  sources:
    - https://github.com/MediaArea/MediaConch
    - https://mediaarea.net/MediaConch
    - https://mediaarea.net/MediaConch/Documentation/DataFormat
    - https://mediaarea.net/MediaConch/Documentation/HowToUse
  summary:
    - >
      MediaConch is MediaArea's open-source conformance checker, policy checker,
      reporter, and fixer for preservation-level audiovisual files. It focuses on
      formats used in archives and memory institutions, especially Matroska, LPCM, and
      FFV1.
  timeline:
    - '2014: Official MediaConch GitHub tags begin with 2014.12.29 and 2014.12.31.'
    - '2015: Early public tag 2015.03.14 appears in the official repository.'
    - '2025: MediaArea project page lists MediaConch 25.04 as the current release.'
  usage:
    - >
      Users create or import policy sets, run implementation and policy checks, and
      export reports in HTML, text, CSV, XML, sidecar metadata, or preservation-oriented
      formats. Its XML documentation connects MediaConch reports with MediaInfo XML,
      MediaTrace XML, and broader MediaArea XML reporting.
related-packages:
  - id: brew:media-info
    reason: >
      MediaConch produces a MediaInfo report alongside conformance and policy results,
      making MediaInfo the natural companion for standalone metadata inspection.
    rel: adjacent_workflow
    sources:
      - https://mediaarea.net/MediaConch/Documentation/HowToUse
      - https://mediaarea.net/en/MediaInfo
  - id: cask:qctools
    reason: >
      QCTools complements MediaConch's specification and policy checks with visual and
      signal-level audiovisual quality analysis in preservation workflows.
    rel: adjacent_workflow
    sources:
      - https://mediaarea.net/MediaConch
      - https://mediaarea.net/QCTools
