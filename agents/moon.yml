    - moon.*
credentials-file-location: null
history:
  project-history:
    - >
      The tool is written in Rust and intentionally occupies a middle ground between
      heavyweight build systems such as Bazel and lightweight script runners such as
      make or just. The documentation says many concepts are inspired by Bazel and other
      build systems but tailored for web-ecosystem languages; the product page lists
      JavaScript, TypeScript, Rust, Go, Ruby, and more among supported languages. Its
      practical feature set includes task orchestration, project graphs, smart hashing,
      incremental builds, local and remote caching, toolchain management, code ownership
      metadata, and CI-oriented notifications.
  sources:
    - https://github.com/moonrepo/moon
    - https://moonrepo.dev/docs
    - https://moonrepo.dev/docs/faq
    - https://moonrepo.dev/moon
    - https://news.ycombinator.com/item?id=34885077
  summary:
    - >
      moon is the open-source build-system and repository-management tool from moonrepo.
      Its own documentation expands the name into management, organization,
      orchestration, and notification, and says the first incarnation of the broader
      "moonrepo" name came from a misspelling of "monorepo". In the February 21, 2023
      Launch HN post, Miles and James described building Moonrepo to simplify repository
      management, project ownership, task running, and daily developer workflows after
      years working on infrastructure and developer tooling.
  usage:
    - >
      In package-manager terms, the Homebrew formula gives macOS developers a native way
      to install a tool that otherwise sits close to Node-oriented and monorepo tooling.
      Its niche overlaps with Turborepo, Nx, Bazel, Pants, just, and make, but moon's
      documentation frames the difference as structured repository management with
      incremental adoption and explicit developer-experience choices rather than only
      package.json script acceleration.
related-packages:
  - id: brew:bazel
    reason: >
      Choose Bazel when a repository needs a highly structured, general-purpose build
      graph and is prepared for greater complexity; moon's official introduction
      explicitly places itself between Bazel and lightweight script runners.
    rel: alternative
    sources:
      - https://moonrepo.dev/docs
      - https://bazel.build/
  - id: brew:just
    reason: >
      Choose just when the main need is a small, low-structure command runner; moon's
      official introduction contrasts that model with moon's project graphs, toolchains,
      caching, and repository management.
    rel: alternative
    sources:
      - https://moonrepo.dev/docs
      - https://just.systems/man/en/
