id: brew:bookokrat
display-name: Bookokrat
repo: null
docs:
  - https://github.com/bugzmanov/bookokrat/blob/main/readme.txt
  - https://bugzmanov.github.io/bookokrat/index.html
  - https://github.com/bugzmanov/bookokrat#readme
config-file-location:
  unix:
    - ~/.config/bookokrat/config.yaml
    - ~/.config/bookokrat/keybindings.toml
  windows:
    - '%APPDATA%\bookokrat\config.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Bookokrat is a young package with Homebrew packaging in the input metadata and an
      upstream GitHub Pages documentation site. Its adoption is likely among
      terminal-first readers, developers reading technical PDFs, and users who want
      ebook navigation without leaving a console workflow.
  package-nerd-significance:
    - >
      Bookokrat is notable as part of the modern terminal-app revival: it packages an
      experience that used to be GUI-only, but with rich TUI conventions and
      configuration files. For package indexes, it is a reminder that terminal
      productivity tools now include media-like workflows such as ebooks and PDFs.
  project-history:
    - >
      The Git history begins in March 2025 with a basic EPUB reader TUI. The README
      later presents Bookokrat as a feature-rich terminal reader rather than a minimal
      pager, including Calibre library detection, table-of-contents navigation, PDF
      support, annotations, SyncTeX support, and Vim-style controls.
  related-projects:
    - Calibre is related through the documented library detection feature.
    - EPUB, PDF, and DjVu are related document formats in the package tags and documentation.
    - VimTeX is related through the documented SyncTeX/editor integration workflow.
  sources:
    - current_curation.config-file-location
    - https://bugzmanov.github.io/bookokrat/index.html
    - https://github.com/bugzmanov/bookokrat/blob/main/readme.txt
    - https://github.com/bugzmanov/bookokrat/releases
    - source_facts.package-manager
  summary:
    - >
      Bookokrat is a terminal ebook reader for EPUB and PDF, with a keyboard-heavy TUI,
      library discovery, reading progress, bookmarks, search, annotations, and PDF
      rendering features.
  timeline:
    - '2025-03-27: Initial commit for a basic EPUB reader with TUI.'
    - '2025-10-28: v0.1.0 tag appears.'
    - '2025-12-13: v0.2.0 tag appears.'
    - '2026-03-07: v0.3.7 tag appears.'
    - '2026-06-06: v0.3.12 tag appears.'
    - '2026-06-25: Recent repository commits show ongoing tweaks after v0.3.12.'
  usage:
    - >
      The documented interface emphasizes keyboard operation: library and reader panes,
      chapter navigation, search, marks, comments, theme selection, reading history, and
      PDF controls. Configuration is stored under the user's Bookokrat config directory
      with separate files for settings and keybindings.
related-packages:
  - id: cask:calibre
    reason: >
      Use calibre alongside Bookokrat to manage an ebook library that Bookokrat can
      detect and open from its terminal interface.
    rel: adjacent_workflow
    sources:
      - https://github.com/bugzmanov/bookokrat/blob/main/readme.txt
      - https://manual.calibre-ebook.com/
tags:
