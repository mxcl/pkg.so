  linux:
    - ~/.config/openttd/secrets.cfg
    - ~/.openttd/secrets.cfg
  macos:
    - ~/Documents/OpenTTD/secrets.cfg
  windows:
    - '%USERPROFILE%\Documents\OpenTTD\secrets.cfg'
history:
  adoption-history:
    - >
      OpenTTD emerged from the established Transport Tycoon community, where TTDPatch
      had extended the proprietary original but remained constrained by its closed,
      assembly-language engine. An open implementation enabled continued development
      across modern operating systems.
    - >
      Community-created OpenGFX, OpenSFX, and OpenMSX assets eventually removed the need
      for data from the original commercial game. OpenTTD 1.0.0 consequently became a
      standalone distributable game in 2010.
    - >
      Long-term package availability, portable builds, dedicated-server support, network
      play, and in-game content downloads have made OpenTTD a durable fixture in
      open-source game repositories.
  package-nerd-significance:
    - >
      OpenTTD is a classic example of a compatibility-driven reimplementation becoming
      an independent, actively maintained platform. Package maintainers care about its
      portability, dedicated-server mode, replaceable asset sets, mod ecosystem, and
      unusually long release history.
    - >
      Its split between general settings, private settings, and secrets files is also
      relevant to reproducible and secure server deployments.
  project-history:
    - >
      Ludvig Strigeus began developing the project that became OpenTTD in the early
      2000s, translating Transport Tycoon Deluxe behavior into maintainable C code. The
      first public OpenTTD release arrived in March 2004.
    - >
      The project expanded beyond compatibility with larger maps, improved multiplayer,
      dedicated servers, new pathfinding, scripting, and NewGRF extensions. Development
      later moved toward C++ and a community-driven GitHub workflow.
  related-projects:
    - Transport Tycoon
    - Transport Tycoon Deluxe
    - TTDPatch
    - OpenGFX
    - OpenSFX
    - OpenMSX
  sources:
    - 'Official About page: https://www.openttd.org/about'
    - 'Official history: https://wiki.openttd.org/en/Archive/OpenTTD/OpenTTD%20History'
    - 'Official repository: https://github.com/OpenTTD/OpenTTD'
    - >
      Official twentieth-anniversary account:
      https://www.openttd.org/news/2024/03/06/happy-birthday
  summary:
    - >
      OpenTTD is an open-source transport-management simulation based on Transport
      Tycoon Deluxe and extended with modern platforms, multiplayer, scripting,
      downloadable content, and extensive mod support.
  timeline:
    - '2002: Work began on the code that would become OpenTTD.'
    - '2004: OpenTTD was publicly released as open source.'
    - >
      2010: OpenTTD 1.0.0 shipped with open replacement media, enabling standalone
      distribution.
    - '2024: The community marked twenty years since the public release.'
  usage:
    - >
      Players build road, rail, air, and sea transport networks to move passengers and
      cargo while managing a transport company. It is also commonly run as a dedicated
      multiplayer server and extended with NewGRFs, scenarios, AIs, game scripts, and
      community asset sets.
