history:
  adoption-history:
    - >
      The project distributes builds for Intel and Apple-silicon Macs and explicitly
      supports installation through the `yandex-music-unofficial` Homebrew cask. Its
      public repository has accumulated sustained community development across many
      commits and contributors.
  package-nerd-significance:
    - >
      This project packages a community-built desktop shell around a proprietary web
      music service, adding macOS integration that was attractive before or alongside an
      official desktop client. Its explicit Homebrew installation path makes it a
      natural package-manager choice for users who prefer reproducible installation over
      downloading architecture-specific builds.
  project-history:
    - >
      Yandex Music Unofficial was created as an independent macOS client for Yandex
      Music. It adds native desktop conveniences around the service, including media-key
      and AirPods controls, system notifications, global shortcuts, and Dock or tray
      controls.
    - >
      The application is an MIT-licensed community project and is not an official Yandex
      client.
  related-projects:
    - Yandex Music is the underlying streaming service.
    - >
      The official Yandex Music desktop client is a separate Yandex product and should
      not be confused with this community application.
  sources:
