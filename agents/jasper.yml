history:
  adoption-history:
    - >
      The project site lists a broad set of downstream users and integrations, including
      KDE, OpenCV, Ghostscript, ImageMagick, Netpbm, XnView, GraphicsMagick, and other
      graphics or imaging tools. Its package-manager footprint in the input spans
      Homebrew, Linux distributions, MacPorts, Nix, Scoop, and winget, which matches the
      library-plus-CLI role described by its documentation.
  package-nerd-significance:
    - >
      JasPer matters to package nerds because it sits at the intersection of standards
      work, reference-code licensing, and distribution policy. A small image library
      with command-line utilities became embedded in many larger graphics stacks, making
      it the kind of package that appears as an indirect dependency far more often than
      users knowingly install it.
  project-history:
    - >
      The JasPer project was written by Michael D. Adams during doctoral work at the
      University of British Columbia while he was involved in JPEG 2000 standardization,
      including service as a co-editor of Part 5 of the standard. Work began in
      September 1999, and source code was released to the public in December 2000.
    - >
      JasPer was published in JPEG 2000 Part 5 as a reference implementation of the Part
      1 codec. The project documentation says its scope expanded from a reference codec
      into a toolkit for handling image data in a variety of applications.
  related-projects:
    - >
      JasPer is related to JPEG 2000, ISO/IEC 15444-1, ISO/IEC 15444-5, IJG JPEG,
      OpenJPEG, ImageMagick, GraphicsMagick, Ghostscript, KDE, OpenCV, and Netpbm.
  sources:
    - https://github.com/jasper-software/jasper
    - https://jasper-software.github.io/jasper-manual
    - https://jasper-software.github.io/jasper/
    - source_facts.package-manager
  summary:
    - >
      JasPer is a C library and set of utilities for JPEG 2000 and related image
      formats. It began as a free reference implementation for the JPEG 2000 Part 1
      codec and later grew into a more general image coding and processing toolkit.
  timeline:
    - '1999: Work on JasPer begins.'
    - '2000: JasPer source code is released to the public.'
    - >
      2000: Adams and Kossentini publish a paper on JasPer as a software-based JPEG 2000
      codec implementation.
    - >
      2004: Adams and Ward publish a paper describing JasPer as a portable open-source
      image coding and processing toolkit.
    - >
      2016: JasPer moves from a private Subversion repository to a public GitHub Git
      repository.
    - >
      2020: The GitHub repository moves from Michael Adams's account to the
      jasper-software organization.
  usage:
    - >
      JasPer provides a library and sample programs such as jasper, imginfo, and imgcmp
      for converting, inspecting, and comparing image data. Its documentation emphasizes
      JPEG 2000 JP2 and codestream support, while the software overview also notes use
      of the IJG JPEG library for JPEG support and graphics libraries selected for
      cross-platform availability.
related-packages:
  - id: brew:openjpeg
    reason: >
      Choose OpenJPEG as an alternative C library and command-line codec focused
      specifically on JPEG 2000; choose JasPer when its broader image-toolkit API or
      supported auxiliary formats fit the application.
    rel: alternative
    sources:
      - https://jasper-software.github.io/jasper/
      - https://www.openjpeg.org/
      - https://github.com/uclouvain/openjpeg/wiki/DocJ2KCodec
  - id: brew:imagemagick
    reason: >
      Use ImageMagick for higher-level image conversion and processing workflows that
      can incorporate JasPer as JPEG 2000 codec support, as documented by JasPer's
      official downstream-user list.
    rel: adjacent_workflow
    sources:
      - https://jasper-software.github.io/jasper/
      - https://imagemagick.org/command-line-processing
