id: brew:ebook2cw
display-name: ebook2cw
repo: https://git.fkurz.net/dj1yfk/ebook2cw
docs:
  - https://fkurz.net/ham/ebook2cw.html
config-file-location:
  unix:
    - ~/.ebook2cw/ebook2cw.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The input metadata records packaging in Homebrew, Debian, Ubuntu, Nix, and
      openSUSE. That package spread is notable for a ham-radio utility because it keeps
      a personal-site project installable through mainstream Unix package managers.
  package-nerd-significance:
    - >
      ebook2cw is a tidy example of a domain-specific CLI that persists because
      packaging makes it easy to discover. It bridges ebook text, audio encoding
      libraries, Morse/CW learning, and ham-radio culture without becoming a broad media
      framework.
  project-history:
    - >
      The official changelog records the first ebook2cw release on November 22, 2007.
      The project page documents the current 0.8.5 release from August 16, 2023, a
      separate optional GUI, command-line parameters, text commands, configuration
      files, code tables, CGI use, and download links.
    - >
      The changelog shows a classic small-tool evolution: ISO 8859-1 and UTF-8 support
      in 2008, configuration files in 0.7.0, Ogg output and CGI support in 0.8.0,
      encoding guessing in 0.8.1, gettext and more text commands in 0.8.3, and longer
      output filenames plus character-table fixes in 0.8.5.
  related-projects:
    - >
      ebook2cwgui is the separate GUI named on the project page. Related domains include
      CW practice, Morse code, MP3/Ogg encoders, and public-domain ebook sources such as
      Project Gutenberg.
  sources:
    - https://fkurz.net/ham/ebook2cw.html
    - https://fkurz.net/ham/ebook2cw/ChangeLog
    - https://git.fkurz.net/dj1yfk/ebook2cw
  summary:
    - >
      ebook2cw is Fabian Kurz's command-line converter from plain-text ebooks to
      Morse-code MP3 or Ogg audio. It is niche, but historically rich inside
      amateur-radio tooling because it turns long-form reading material into CW practice
      audio.
  timeline:
    - '2007: Initial ebook2cw release.'
    - '2008: UTF-8 support, expanded code tables, and configuration files added.'
    - '2011: Ogg output and CGI support added in the 0.8 line.'
    - '2020: gettext support and additional text-command behavior added.'
    - '2023: 0.8.5 released with filename, final-word, character-table, and Makefile fixes.'
  usage:
    - >
      Typical usage feeds a text ebook to `ebook2cw`, sets CW speed, tone, bitrate,
      chapter splitting, output file name, and optional Ogg output, then listens to the
      generated practice audio. The project page also documents Project Gutenberg as a
      common source for public-domain ebooks.
