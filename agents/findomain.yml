history:
  adoption-history:
    - >
      Findomain's adoption is mostly in the offensive-security and reconnaissance niche.
      Its own documentation names Homebrew, pacman, Nix, Pentoo, Docker, and direct
      release downloads as installation paths, which fits a tool used from disposable
      workstations, CI-style monitoring jobs, and bug-bounty toolchains.
    - >
      The project also added premium and monitoring-oriented features, such as webhook
      alerts, database-backed subdomain monitoring, and imports from other tools. That
      shifted it from a one-shot enumerator toward a small domain-observation workflow.
  package-nerd-significance:
    - >
      Findomain is package-interesting because it is a modern security CLI with the
      familiar shape of a single executable, but with a workflow that spans SaaS APIs,
      CT logs, local resolution, notifications, and optional persistence.
    - >
      It also reflects a common pattern in security packaging: fast-moving niche tools
      become useful to package managers when they provide repeatable release artifacts
      and simple CLI installation, even if most of their culture lives in README
      examples rather than formal manuals.
  project-history:
    - >
      The public GitHub repository was created in April 2019, and its first GitHub
      release was tagged 0.1.2 later that month. The project quickly defined itself
      around speed and breadth rather than brute force alone: the README describes a
      CT-log and API-driven approach, with later feature growth around monitoring,
      webhooks, resolver behavior, and multiple output modes.
    - >
      Findomain's implementation choice matters to packagers because the README
      emphasizes cross-platform Rust builds and official binaries for Linux, Windows,
      macOS, AArch64, ARMv7, NixOS, and Docker. That made it easy to distribute as a
      single CLI in security-focused environments.
  related-projects:
    - >
      Certificate Transparency logs are a primary data source for Findomain's
      enumeration strategy.
    - >
      crt.sh, Certspotter, VirusTotal, Sublist3r, SecurityTrails, urlscan.io,
      Threatminer, and related APIs are documented as data sources.
    - >
      Other subdomain enumeration tools are part of the same ecosystem because Findomain
      can import and work with data discovered by other tools.
  sources:
    - https://github.com/Findomain/Findomain
    - https://raw.githubusercontent.com/Findomain/Findomain/master/docs/INSTALLATION.md
    - https://api.github.com/repos/Findomain/Findomain
    - https://api.github.com/repos/Findomain/Findomain/releases
  summary:
    - >
      Findomain is a Rust-based subdomain enumeration and reconnaissance tool for
      security testing, bug bounty work, and domain monitoring. Its official README
      presents it as a complete domain-recognition tool that combines Certificate
      Transparency logs, public APIs, optional API keys, resolution, screenshotting,
      port scanning, imports from other tools, and alerting integrations.
  timeline:
    - '2019: Public GitHub repository is created.'
    - '2019: First GitHub release, 0.1.2, is published.'
    - >
      2020s: README documents monitoring, webhook alerts, imports, brute-force support,
      and multiple API integrations.
    - '2026: Repository metadata shows continued maintenance activity.'
  usage:
    - >
      Users run Findomain to discover subdomains from Certificate Transparency logs and
      public APIs, optionally resolve the results, write target-specific output files,
      import findings from other tools, and monitor for newly observed subdomains.
    - >
      Because several sources require API tokens, Findomain usage ranges from
      zero-configuration public lookups to richer authenticated enumeration using
      providers such as VirusTotal, SecurityTrails, Facebook Certificate Transparency,
      and C99.
related-packages:
  - id: brew:subfinder
    reason: >
      Use Subfinder for its focused passive-enumeration workflow, then import its output
      into Findomain for combined resolution, filtering, and reporting.
    rel: adjacent_workflow
    sources:
      - https://github.com/Findomain/Findomain/blob/master/README.md
      - https://docs.projectdiscovery.io/tools/subfinder/overview
  - id: brew:amass
    reason: >
      Use OWASP Amass when you need broader attack-surface mapping and active DNS
      techniques; Findomain officially documents importing Amass results into its
      processing pipeline.
    rel: adjacent_workflow
    sources:
      - https://github.com/Findomain/Findomain/blob/master/README.md
      - https://github.com/owasp-amass/amass
      - https://github.com/owasp-amass/amass/wiki/User-Guide
