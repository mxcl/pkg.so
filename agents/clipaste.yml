history:
  adoption-history:
    - >
      Clipaste is distributed directly by NTWind for macOS and Windows and is also
      installable on macOS through a Homebrew cask. NTWind describes it as free software
      without advertising or subscriptions.
  package-nerd-significance:
    - >
      Clipaste represents the newer privacy-focused class of cross-platform clipboard
      managers: local-only history, encryption at rest, OS-backed key storage, and no
      required account. Its Homebrew cask gives Mac users a reproducible installation
      path.
  project-history:
    - >
      NTWind introduced Clipaste 1.0.1 on December 25, 2025 as a private, searchable
      clipboard-history application for Windows and macOS. Subsequent 1.0.x releases
      added interface options, optimizations, localization fixes, and maintenance
      updates.
  related-projects:
    - NTWind cross-platform applications
    - Hive CE
    - flutter_secure_storage
  sources:
    - 'Official changelog: https://www.ntwind.com/cross-platform/clipaste/what-is-new.html'
    - >
      Official encryption documentation:
      https://www.ntwind.com/cross-platform/clipaste/encryption.html
    - 'Official product page: https://www.ntwind.com/cross-platform/clipaste.html'
  summary:
    - >
      Clipaste is a free, privacy-focused clipboard-history manager from NTWind Software
      for macOS and Windows. It records text, rich text, images, and files locally and
      provides search, favorites, application filters, keyboard shortcuts, and
      drag-and-drop.
  timeline:
    - '2025-12-25: Clipaste 1.0.1 was announced.'
    - '2026-02-01: Version 1.0.2 added position and animation options.'
    - '2026-06-05: Version 1.0.3 delivered interface and performance refinements.'
    - '2026-07-21: Version 1.0.4 shipped as a maintenance release.'
  usage:
    - >
      Clipaste runs in the background and records copied content for later searching,
      filtering, favoriting, pasting, or dragging into another application. History
      remains local; its Hive database is encrypted by default with a per-user key held
      by the operating system credential store.
