id: brew:docker-credential-helper
display-name: Docker Credential Helpers
repo: null
docs:
  - https://github.com/docker/docker-credential-helpers#readme
config-file-location:
  unix:
    - ~/.docker/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The helper suite became part of normal Docker desktop and CLI workflows because
      Docker config supports a credsStore setting in ~/.docker/config.json. Users often
      encounter it indirectly when Docker Desktop or a package manager installs
      docker-credential-osxkeychain, docker-credential-wincred,
      docker-credential-secretservice, or docker-credential-pass.
  package-nerd-significance:
    - >
      This is a classic small package with outsized operational effect: it is not the
      Docker daemon, but it determines whether registry authentication is stored in a
      system keychain or leaks into config files. It also explains why Docker packages
      often need platform-specific credential-helper binaries alongside the main CLI.
  project-history:
    - >
      The repository was created to house the helper programs that Docker can invoke
      through its credential-store protocol. The README describes helpers for macOS
      Keychain, Linux Secret Service, Windows Credential Manager, and pass, plus
      libraries for client applications and for implementing new helpers.
    - >
      The tag history begins with v0.1.0 in 2016 and continues through the 2020s. Its
      development has stayed intentionally narrow: it maintains small platform-specific
      executables, a common credentials protocol with store/get/erase/list commands, and
      build/release machinery for distributing helper binaries.
  related-projects:
    - >
      Related projects include Docker CLI and Docker Engine, platform credential stores
      such as macOS Keychain, Secret Service, Windows Credential Manager, and pass, and
      service-specific helpers such as Amazon ECR Docker Credential Helper.
  sources:
    - https://github.com/docker/docker-credential-helpers#readme
    - https://github.com/docker/docker-credential-helpers/releases
    - https://github.com/docker/docker-credential-helpers/tags
    - https://docs.docker.com/reference/cli/docker/login/
  summary:
    - >
      Docker Credential Helpers is Docker's suite of helper binaries and Go libraries
      for storing registry credentials in native platform stores rather than plain
      Docker config JSON.
  timeline:
    - '2016: v0.1.0 tagged for the Docker credential helper suite.'
    - '2017: v0.5.x releases continue early helper development.'
    - '2022: v0.7.0 appears after a long 0.6.x line.'
    - '2024: v0.8.x releases continue maintenance of the helper binaries.'
    - '2026: v0.9.8 is tagged in the upstream repository.'
  usage:
    - >
      Users configure Docker with a credsStore value such as osxkeychain, secretservice,
      wincred, or pass. Docker then calls the corresponding docker-credential-* program
      to store, retrieve, erase, and list registry secrets. Other command-line
      applications can also call helpers through the Go client package documented by the
      project.
related-packages:
  - id: brew:docker
    reason: >
      Docker CLI invokes the configured helper during registry login, pulls, and pushes,
      using `credsStore` or `credHelpers` entries in its client configuration.
    rel: adjacent_workflow
    sources:
      - https://docs.docker.com/reference/cli/docker/login/#credential-stores
      - https://github.com/docker/docker-credential-helpers#readme
  - id: brew:pass
    reason: >
      Install and initialize `pass` when using the packaged `docker-credential-pass`
      backend to store Docker registry secrets in a GnuPG-encrypted password store.
    rel: adjacent_workflow
    sources:
      - https://github.com/docker/docker-credential-helpers#readme
      - https://www.passwordstore.org/
  - id: brew:docker-credential-helper-ecr
    reason: >
      Choose the Amazon ECR helper instead when Docker should obtain ECR authentication
      automatically from the AWS credential provider chain rather than a generic local
      keychain.
    rel: alternative
    sources:
      - https://github.com/awslabs/amazon-ecr-credential-helper#readme
      - https://github.com/docker/docker-credential-helpers#readme
