history:
  adoption-history:
    - >
      The first public version, named 1Passwd, was uploaded for Mac users in May 2006.
      User feedback drove frequent early releases, and the product expanded from a
      consumer password manager into family, team, business, developer, and enterprise
      offerings.
    - >
      1Password reports adoption by millions of people and more than 200,000 businesses.
      Its platform now spans desktop and mobile applications, browser integration,
      command-line and developer tooling, secrets management, and broader identity and
      access products.
  package-nerd-significance:
    - >
      For package users, 1Password is notable as a mainstream graphical security
      application that also participates in developer workflows through browser
      integration, SSH support, a separate command-line tool, and secrets-management
      products.
    - >
      The Homebrew cask provides a conventional macOS installation path, but users
      should distinguish the `1password` desktop cask from separately packaged developer
      components such as the 1Password CLI.
  project-history:
    - >
      1Password was founded in Toronto in 2005 by Dave Teare, Roustem Karimov, Natalia
      Karimov, and Sara Teare. The founders originally built a form-filling utility to
      simplify testing websites, then released the first public Mac version in 2006.
    - >
      The product grew from a consumer-focused password manager into a multi-platform
      identity-security company. Its core application stores passwords, passkeys,
      payment details, secure notes, and other private records behind end-to-end
      encryption.
  related-projects:
    - >
      1Password CLI: The company's command-line interface for retrieving and using items
      in developer workflows.
    - '1Password browser extensions: Browser integration for saving and filling credentials.'
    - >
      1Password Secrets Automation and developer tools: Related products for application
      and infrastructure secrets.
  sources:
    - https://1password.com/blog/accel-partnership
    - https://1password.com/company
    - https://1password.com/press
    - https://support.1password.com/
  summary:
    - >
      1Password is a commercial password manager and identity-security platform that
      originated as a Mac utility and expanded to consumer, family, developer, and
      enterprise use.
  timeline:
    - '2005: 1Password was founded in Toronto.'
    - >
      2006: The first public release, then named 1Passwd, was uploaded to MacUpdate and
      VersionTracker.
    - '2019: 1Password announced an Accel partnership to accelerate company growth.'
    - >
      Later development: The product expanded into business identity security, developer
      tooling, secrets management, and access-management services.
  usage:
    - >
      People use the desktop application and browser integrations to generate, save,
      synchronize, and fill credentials and other sensitive records. Accounts are
      protected by an account password and Secret Key.
    - >
      The desktop application's preferences are stored in `settings.json`; 1Password
      warns that sensitive settings are cryptographically signed and does not support
      generic direct configuration of that file.
