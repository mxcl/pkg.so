history:
  adoption-history:
    - >
      Draco became part of the web and realtime-3D asset pipeline through its
      JavaScript, WebAssembly, npm, Unity, and glTF-oriented tooling. The official site
      lists related projects such as the npm package, Khronos glTF, and three.js, and
      the README repeatedly calls out hosted versioned decoders for web applications.
  package-nerd-significance:
    - >
      Draco is significant in package metadata because it is both a command-line codec
      package and a web-distributed runtime component: package managers ship native
      tools while web projects consume versioned decoder artifacts, npm packages, and
      engine integrations.
  project-history:
    - >
      The google/draco repository was created in December 2016, and the official site
      dates the public Draco project to 2017. The project was designed for compression
      efficiency and speed so 3D applications could reduce download size and
      transmission bandwidth without compromising visual fidelity.
  related-projects:
    - Khronos glTF
    - three.js
    - draco3d npm package
    - Unity
    - WebAssembly
    - Emscripten
  sources:
    - https://github.com/google/draco
    - https://raw.githubusercontent.com/google/draco/main/README.md
    - https://google.github.io/draco/
    - https://google.github.io/draco/spec
    - https://api.github.com/repos/google/draco
    - https://api.github.com/repos/google/draco/releases?per_page=5
  summary:
    - >
      Draco is Google's open-source C++ library and tool suite for compressing and
      decompressing 3D meshes and point clouds, with JavaScript and WebAssembly decoders
      for web delivery.
  timeline:
    - '2016: google/draco was created on GitHub.'
    - >
      2017: the official site and bitstream specification identify the public Draco 3D
      compression project and spec release period.
    - >
      2020: Draco 1.4.0 moved npm modules to WebAssembly and documented static hosted
      decoders.
    - >
      2022: Draco 1.5.0 added the draco_transcoder tool and packaging-oriented CMake
      improvements.
    - '2024: Draco 1.5.7 shipped bug and security fixes.'
  usage:
    - >
      Users encode geometry with draco_encoder, decode with draco_decoder, integrate the
      C++ library into native applications, or load the JavaScript/Wasm decoders in
      browsers. The bitstream specification documents the file format and decoding
      process for interoperability.
