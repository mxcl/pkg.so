id: brew:hck
display-name: hck
repo: null
docs:
  - https://github.com/sstadick/hck#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Homebrew/Linuxbrew, conda-forge,
      MacPorts, Debian packages from GitHub releases, Cargo, and optimized release
      binaries. Input package facts also list Homebrew, MacPorts, Nix, and pacman
      packaging.
    - >
      The README includes a Repology packaging-status badge, which signals that the
      maintainer expects hck to be tracked across multiple distribution ecosystems.
  package-nerd-significance:
    - >
      hck is the kind of package CLI enthusiasts like: a small Rust replacement for a
      standard Unix primitive that adds just enough practical ergonomics for messy data
      exploration while staying scriptable. Its value is not replacing awk or CSV
      parsers, but reducing common one-off pipelines.
  project-history:
    - >
      The public GitHub repository was created in June 2021. The README explains the
      name as a shortening of 'hack', a rougher form of cut, and describes the tool as a
      near drop-in replacement for cut that fills a gap between cut and awk.
    - >
      The project deliberately does not try to become a complete CSV/TSV parser like
      xsv. Its stated non-goal is respecting full quoting rules; it remains a
      line-by-line splitter in the spirit of cut.
  related-projects:
    - >
      cut, awk, xsv, tsv-utils, choose, ripgrep-style decompression behavior, and gzp
      compression are related tools or inspirations named by the README.
  sources:
    - https://api.github.com/repos/sstadick/hck
    - https://github.com/sstadick/hck
    - https://raw.githubusercontent.com/sstadick/hck/master/README.md
  summary:
    - >
      hck is a Rust command-line text-processing tool described by its author as a sharp
      cut(1) clone. It keeps the familiar field-selection niche of cut while adding
      regex delimiters, output-column reordering, header selection, decompression
      support, and speed-focused packaging.
  timeline:
    - '2021: Public GitHub repository created.'
    - >
      2020s: README documents packaging through Homebrew/Linuxbrew, conda-forge,
      MacPorts, Debian artifacts, Cargo, and release binaries.
    - '2020s: Input package facts show additional Nix and pacman packaging.'
  usage:
    - >
      Typical use is to pipe text or process files with field selections such as hck
      -f2,1,3-, choose regex delimiters for whitespace or unusual separators, select
      columns by header literal or regex, and optionally process compressed inputs when
      a local decompressor exists.
related-packages:
  - id: brew:choose-rust
    reason: >
      Choose is a direct field-selection alternative with Python-style ranges, negative
      indexes, and regex separators; choose it when slice-oriented syntax matters more
      than hck's header selection and decompression features.
    rel: alternative
    sources:
      - https://github.com/sstadick/hck#readme
      - https://github.com/theryangeary/choose#readme
  - id: brew:awk
    reason: >
      One True Awk is the more expressive alternative when field extraction must grow
      into calculations, conditions, or record-processing programs.
    rel: alternative
    sources:
      - https://github.com/sstadick/hck#readme
      - https://awk.dev/
  - id: brew:miller
    reason: >
      Miller is the stronger alternative for structured CSV, TSV, and JSON processing
      when quoting and record semantics exceed hck's intentionally line-oriented model.
    rel: alternative
    sources:
      - https://github.com/sstadick/hck#readme
      - https://miller.readthedocs.io/
