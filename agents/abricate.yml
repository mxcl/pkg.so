id: brew:abricate
display-name: ABRicate
repo: null
docs:
  - https://github.com/tseemann/abricate/wiki
  - https://github.com/tseemann/abricate#readme
  - https://github.com/tseemann/abricate/releases
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ABRicate became useful in workflow packaging because the README documents Bioconda
      installation, source installation, dependency checks, database setup, and
      operation through a single abricate command. The current Homebrew input metadata
      shows it packaged for Homebrew, while upstream also advertises Bioconda download
      badges.
  package-nerd-significance:
    - >
      ABRicate is a classic bioinformatics packaging target: a Perl entry point with
      external command dependencies, bundled or downloadable reference databases, and a
      check/setup workflow that packagers and workflow engines can exercise after
      install. Its release history also tracks database refreshes and CI migration.
  project-history:
    - >
      The first GitHub release, v0.1, was published as 'Debut' on April 2, 2015. The
      README describes the project as mass screening of contigs for antimicrobial
      resistance or virulence genes and explains that the name combines the common
      acronym ABR, for antibiotic resistance, with an English-verb-like form.
  related-projects:
    - >
      The README points users to ARIBA, ResFinder, RGI, SRST2, and AMRFinderPlus when
      ABRicate is not the right fit. It also bundles or references databases including
      NCBI AMRFinderPlus, CARD, ResFinder, ARG-ANNOT, MEGARES, PlasmidFinder, VFDB,
      VICTORS, BacMet, and UPEC/ExPEC VF.
  sources:
    - https://github.com/tseemann/abricate#readme
    - https://github.com/tseemann/abricate/releases
    - input source_facts.package-manager
  summary:
    - >
      ABRicate is a Perl command-line tool for mass screening assembled contigs against
      antimicrobial-resistance and virulence-gene databases. It matters to package
      maintainers because it wraps BLAST+, database setup, and summary reporting into a
      familiar Unix bioinformatics command.
  timeline:
    - '2015: v0.1 Debut release.'
    - >
      2020: v1.0.0 added file-of-filenames scanning, defaults around coverage/identity
      thresholds, MEGARES docs, and NCBI/CARD database support.
    - >
      2025: v1.2.0 refreshed databases, moved CI to GitHub Actions, switched download
      code to Perl File::Fetch, and improved docs.
    - '2026: v1.4.0 added a UPEC/ExPEC virulence-factors database and updated NCBI AMR data.'
  usage:
    - >
      The tool screens assemblies, not raw FASTQ reads, and reports gene hits with
      coverage, identity, database, accession, product, and resistance fields. It can
      process many files, read a file-of-filenames, summarize reports into a
      presence/absence matrix, update bundled databases, and build custom nucleotide
      databases.
related-packages:
  - id: brew:blast
    reason: >
      Use BLAST alongside ABRicate when you need to inspect or reproduce the underlying
      nucleotide alignments, because ABRicate officially requires BLAST+ as its
      sequence-search engine.
    rel: adjacent_workflow
    sources:
      - https://github.com/tseemann/abricate#readme
      - https://blast.ncbi.nlm.nih.gov/doc/blast-help/
