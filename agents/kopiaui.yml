    - >
      Official command-line reference documents the configuration paths and
      operating-system credential stores.
  history-sources:
    - https://github.com/kopia/kopia/releases
    - https://kopia.io/docs/
    - https://kopia.io/docs/advanced/compatibility/
    - https://kopia.io/docs/installation/
  repo-sources:
