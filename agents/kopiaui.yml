id: cask:kopiaui
display-name: KopiaUI
repo: null
docs:
  - https://kopia.io/docs
  - https://kopia.io/docs/faqs
  - https://kopia.io/docs/getting-started
  - https://kopia.io/docs/reference/command-line
config-file-location:
  linux:
    - ~/.config/kopia/repository.config
  macos:
    - ~/Library/Application Support/kopia/repository.config
  windows:
    - '%APPDATA%\kopia\repository.config'
credentials-file-location: null
history:
  adoption-history:
    - >
      Kopia serves both command-line-oriented administrators and desktop users through a
      shared backup engine and KopiaUI. Official distribution spans native installers
      and package channels including Homebrew, APT, RPM, Scoop, winget, and Docker,
      helping the same repository format travel across desktop, server, and container
      environments.
  package-nerd-significance:
    - >
      Kopia is notable for combining content-addressed incremental snapshots,
      compression, deduplication, client-controlled encryption, multiple storage
      backends, a CLI, and a desktop GUI in one open-source project. Its explicit
      repository-compatibility policy is particularly important to users treating
      backups as long-lived data rather than disposable application state.
  project-history:
    - >
      Kopia developed as a cross-platform open-source backup system for selected files
      and directories rather than whole-machine imaging. The project added a graphical
      application alongside its CLI and formalized repository compatibility and
      migration behavior beginning with the v0.3.0 series.
  related-projects:
    - Kopia CLI
    - Kopia repository server
    - Rclone
    - Amazon S3
    - Backblaze B2
    - Azure Blob Storage
    - Google Cloud Storage
  sources:
    - https://github.com/kopia/kopia/releases
    - https://kopia.io/docs/
    - https://kopia.io/docs/advanced/compatibility/
    - https://kopia.io/docs/installation/
  summary:
    - >
      KopiaUI is the graphical interface to Kopia, a cross-platform system for creating
      encrypted, compressed, deduplicated snapshots in local, network, and cloud-backed
      repositories.
  timeline:
    - 'v0.3.0: Kopia introduced a documented repository-compatibility promise.'
    - >
      Later development: Official GUI, repository-server, package-repository, and
      container distribution paths broadened deployment options.
  usage:
    - >
      Users create or connect to a repository, choose folders to snapshot, establish
      retention and scheduling policies, and restore files through KopiaUI. Repository
      connection settings reside in repository.config, while repository passwords are
      kept in the platform credential store rather than a documented credentials file.
tags:
  - backup
  - compression
  - deduplication
  - encryption
  - gui
  - incremental-backup
  - restore
  - snapshots
  - storage
provenance:
  category-sources:
