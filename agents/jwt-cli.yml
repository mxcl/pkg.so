history:
  adoption-history:
    - >
      The tool spread through several package ecosystems because JWT inspection is a
      cross-platform developer workflow. The README documents installation through
      Homebrew, MacPorts, Cargo, FreeBSD ports, Scoop, and Arch Linux, and the Homebrew
      formula also records package-manager distribution under the `jwt-cli` formula.
  package-nerd-significance:
    - >
      Its significance is package-manager convenience: JWTs are everywhere in web auth,
      and a small static-ish Rust CLI with shell completion, stdin behavior, and broad
      OS packaging is exactly the kind of utility users expect to install with one
      command.
  project-history:
    - >
      Mike Engel released jwt-cli publicly in March 2017, with GitHub release metadata
      showing 0.1.0 as an initial prerelease on March 6, 2017. The README frames the
      tool around two goals: decoding JWT headers and claims like other JWT CLIs, and
      encoding new JWTs with flexible headers, claims, and secrets.
    - >
      The project evolved with the Rust JWT ecosystem. Its changelog records a move to
      the `jsonwebtoken` crate in 0.3.0, JSON output in 2.1.0, stdin support in 2.4.0,
      ECDSA support in 2.5.0, PEM support through `jsonwebtoken` 7 in 3.0.0, stricter
      expiration handling and file secrets in 5.0.0, EdDSA and output-file support in
      6.0.0, and JWKS support in 6.1.0.
  related-projects:
    - >
      jwt-cli sits alongside browser tools such as JWT.io, security-focused JWT tooling
      such as jwt-hack, and the Rust `jsonwebtoken` crate used internally for token
      operations.
  sources:
    - https://crates.io/crates/jwt-cli
    - https://github.com/mike-engel/jwt-cli
    - https://github.com/mike-engel/jwt-cli/blob/main/CHANGELOG.md
    - https://github.com/mike-engel/jwt-cli/releases
    - https://www.rfc-editor.org/rfc/rfc7519
  summary:
    - >
      jwt-cli is a Rust command-line utility for decoding, verifying, and encoding JSON
      Web Tokens. It became a common package-manager answer to the everyday developer
      need to inspect opaque bearer tokens from a shell pipeline.
  timeline:
    - '2017-03-06: 0.1.0 initial prerelease published.'
    - '2018-09-24: 2.1.0 adds JSON output for piping into tools such as `jq`.'
    - '2019-04-19: 2.4.0 adds stdin support for encode and decode.'
    - '2021-11-14: 5.0.0 adds file secrets and stricter expiration validation.'
    - '2023-06-22: 6.0.0 adds EdDSA support and output-file support.'
    - '2024-05-27: 6.1.0 adds JWKS support and shell completion.'
  usage:
    - >
      jwt-cli is used in two main ways: as an interactive command such as `jwt decode
      TOKEN`, and as a pipeline component, for example extracting an access token with
      `curl` and `jq` and piping it into `jwt decode -`. Encoding support lets
      developers create test tokens without reaching for a web UI.
related-packages:
  - id: brew:jq
    reason: >
      Use jq with jwt-cli to extract tokens from JSON API responses or further process
      jwt-cli's JSON decoding output in shell pipelines.
    rel: adjacent_workflow
    sources:
      - https://github.com/mike-engel/jwt-cli#readme
      - https://jqlang.github.io/jq/manual/
  - id: brew:jwt-hack
    reason: >
      Choose jwt-hack when you need offensive JWT testing such as weak-secret cracking,
      attack-payload generation, or vulnerability scanning rather than routine token
      encoding and decoding.
    rel: alternative
    sources:
      - https://github.com/mike-engel/jwt-cli#readme
      - https://github.com/hahwul/jwt-hack#readme
