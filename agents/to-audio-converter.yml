  summary:
    - To Audio Converter is AMVidia's macOS batch audio-conversion application.
  timeline:
    - '1.0.0: Initial version.'
    - >
      Later 1.0 releases: Added effects, CUE splitting, metadata features, playlist
      support, and macOS compatibility updates.
  usage:
    - >
      Users drag files, folders, playlists, or supported links into the application,
      choose automatic or custom output settings, and convert them to formats including
      MP3, WAV, FLAC, AIFF, and M4A/MP4.
