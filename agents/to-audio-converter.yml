history:
  adoption-history:
    - >
      AMVidia distributes the application for macOS, while its Homebrew Cask entry makes
      the graphical converter installable through the same workflow used for
      command-line packages and other Mac applications.
  package-nerd-significance:
    - >
      It is a representative proprietary Homebrew cask: package tooling automates
      installation of a graphical media application even though no official public
      source repository is exposed.
  project-history:
    - >
      AMVidia introduced To Audio Converter as a Mac application for batch audio
      conversion. Its official changelog identifies 1.0.0 as the initial version and
      documents later additions including CUE splitting, volume normalization, metadata
      lookup, playlist handling, and support for newer macOS releases.
  related-projects:
    - AMVidia publishes related format-focused converters and Tag Editor for Mac.
  sources:
    - 'Official changelog: https://amvidia.com/to-audio-converter/what-s-new'
