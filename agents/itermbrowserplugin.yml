config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The browser plug-in is an optional application bundle placed in /Applications and
      detected automatically by iTerm2. Users enable it by creating a profile whose type
      is Web Browser.
    - >
      Built-in browser profiles became a major feature of the iTerm2 3.6 release line,
      bringing browser panes into the same window, tab, split, shortcut, and automation
      model as terminal sessions.
  package-nerd-significance:
    - >
      The plug-in keeps a comparatively large and security-sensitive browser capability
      optional while letting iTerm2 package its terminal and browser workflows
      independently. It is especially interesting to users who organize documentation,
      local web interfaces, and terminals as adjacent panes.
  project-history:
    - >
      The official documentation says the idea of translating iTerm2's session features
      to web browsing was suggested in 2014. The production feature was later
      implemented with WKWebView and delivered as an optional plug-in maintained in the
      main iTerm2 repository.
    - >
      The 3.6 release line exposed web-browser profiles alongside terminal profiles,
      allowing existing iTerm2 concepts such as split panes, key bindings, triggers,
      search, replay, and AI chat integration to operate in browser sessions.
  related-projects:
    - >
      iTerm2 is the required host application and supplies profiles, windows, tabs,
      split panes, automation, and session features.
    - WebKit's WKWebView provides the embedded browser engine.
  sources:
    - 'Official browser documentation: https://iterm2.com/documentation-web.html'
    - 'Official iTerm2 release notes: https://iterm2.com/downloads.html'
    - 'Official plug-in page: https://iterm2.com/browser-plugin.html'
    - >
      Official source directory:
      https://github.com/gnachman/iTerm2/tree/master/iTermBrowserPlugin
  summary:
    - >
      iTerm2 Browser Plugin is the optional component that enables full web-browser
      profiles inside iTerm2. Browser sessions participate in the terminal emulator's
      existing pane, tab, shortcut, search, replay, and automation workflows.
  timeline:
    - >
      2014: A former colleague suggested the integrated-browser concept, according to
      the official feature documentation.
    - '2025: The iTerm2 3.6 release line introduced configurable Web Browser profiles.'
  usage:
    - >
      After placing the plug-in in /Applications, users create an iTerm2 profile and
      select Web Browser as its profile type. Web pages can then occupy ordinary iTerm2
      tabs or split panes.
    - >
      The browser is intended for integrated terminal-and-web workflows rather than as a
      primary general-purpose browser. It supports navigation, reader and
      distraction-removal modes, content saving, iTerm2 key bindings and triggers, and
      optional AI Chat linkage.
