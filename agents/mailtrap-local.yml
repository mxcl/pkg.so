history:
  adoption-history:
    - >
      The project is distributed as a standalone binary and through Homebrew, Snap, Nix,
      Docker Hub, and GitHub Container Registry. Its release automation also updates the
      official Homebrew tap and Nix repository.
    - >
      The supplied record represents the Homebrew formula, while the official README
      positions the tool as a local, single-user complement to Mailtrap's hosted
      service.
  package-nerd-significance:
    - >
      mailtrap-local packages an SMTP catcher, searchable browser UI, API, SQLite
      storage, and sendmail-compatible mode into one executable. That makes it
      attractive for reproducible development environments that would otherwise need a
      separate mail-testing service and database.
    - >
      Its explicit XDG configuration and multi-channel binary distribution make it
      straightforward to integrate into workstation package managers and local service
      definitions.
  project-history:
    - >
      Mailtrap released mailtrap-local as an open-source, MIT-licensed local email
      sandbox for individual developers. It is implemented as a Go backend with an
      embedded React interface and uses SQLite for local storage.
  related-projects:
    - >
      Mailtrap is the hosted email testing and delivery platform that this local tool
      complements.
    - >
      The official mailtrap/homebrew-local and mailtrap/mailtrap-nur repositories carry
      its Homebrew and Nix packaging.
  sources:
    - https://github.com/mailtrap/mailtrap-local#configuration
    - https://github.com/mailtrap/mailtrap-local#readme
    - https://github.com/orgs/mailtrap/packages
    - source_facts.package-manager
  summary:
    - >
      mailtrap-local is a self-contained local email sandbox. It listens for application
      mail over SMTP, stores caught messages locally, and exposes them through a web UI
      and JSON API.
  timeline:
    - >
      2026: Mailtrap published mailtrap-local through its official GitHub organization
      and package channels.
  usage:
    - >
      Developers run the service locally, point an application's SMTP settings at port
      3535, and inspect captured messages through the web interface on port 3550.
    - >
      The binary can also act as a sendmail replacement. Optional YAML settings control
      retention, cloud mirroring, outbound relay, and webhooks; cloud and relay
      credentials may be placed in the same config file or managed through the
      application's SQLite-backed UI.
