history:
  adoption-history:
    - >
      Gyroflow developed into a cross-platform application for Windows, macOS, Linux,
      Android, and iOS. Its official repository also documents installation through
      Homebrew on macOS.
    - >
      Support for embedded motion metadata from widely used GoPro, Sony, Insta360, DJI,
      and other cameras broadened its usefulness beyond workflows requiring a separate
      gyro logger.
  package-nerd-significance:
    - >
      Gyroflow brings telemetry parsing, lens calibration, rolling-shutter correction,
      motion integration, and GPU rendering together in a free desktop tool. That makes
      it an important open-source component in action-camera, FPV, aerial-video, and
      post-production workflows.
    - >
      Its Rust core, QML interface, hardware acceleration, cross-platform packaging, and
      integrations with video editors make it interesting both as a media tool and as a
      substantial modern desktop application.
  project-history:
    - >
      Gyroflow was created as an open-source, motion-data-based alternative to
      optical-only stabilization and physical gimbals. It uses lens profiles and
      timestamped gyroscope data to reconstruct camera motion and stabilize footage in
      post-production.
    - >
      The project expanded from a standalone stabilizer into an ecosystem that includes
      a lens-profile database, camera and telemetry-format support, mobile builds, and
      plugins for major video editors.
  related-projects:
    - The application uses the telemetry-parser project for motion-data formats.
    - >
      Officially documented editor integrations include Adobe Premiere Pro, After
      Effects, DaVinci Resolve, and Final Cut Pro workflows.
  sources:
    - https://docs.gyroflow.xyz/app
    - https://github.com/gyroflow/gyroflow
    - source_facts.package-manager.brew-cask
    - source_facts.repo
  summary:
    - >
      Gyroflow is a free, open-source, cross-platform video stabilizer that derives
      camera motion from gyroscope and optional accelerometer data.
  timeline:
    - >
      Open-source era: Gyroflow established a public project centered on gyro-assisted
      post-production stabilization.
    - >
      Cross-platform expansion: The project added desktop and mobile builds plus
      integrations for major video editors.
  usage:
    - >
      A typical workflow loads camera footage and its embedded or external gyro data,
      selects or creates a lens profile, synchronizes motion with the video, adjusts
      smoothing and horizon controls, and renders stabilized output.
    - >
      It is especially useful for action-camera, FPV, drone, and cinema-camera footage
      where recorded motion data can avoid the failure modes of purely optical
      stabilization.
