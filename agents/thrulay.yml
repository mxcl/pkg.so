history:
  adoption-history:
    - >
      Official SourceForge metadata lists Unix-like operating systems including BSD,
      FreeBSD, Linux, Mac, NetBSD, OpenBSD, and Solaris, with intended audiences such as
      education, government, science/research, system administrators, and
      telecommunications.
    - >
      In this Homebrew batch, thrulay appears as a package with both `thrulay` and
      `thrulayd` executables, matching the official client/daemon documentation.
  package-nerd-significance:
    - >
      thrulay is a niche but classic network-benchmark package: the package installs
      both a client and a daemon, so it fits the same admin-tool shelf as iperf-style
      utilities while preserving older Internet2/SourceForge-era measurement ideas.
  project-history:
    - >
      The SourceForge project page describes thrulay as a program for measuring network
      capacity, delay, and other performance metrics by sending bulk TCP or UDP streams.
      SourceForge lists the project as registered in 2005, maintained under a BSD
      license, and aimed at command-line and daemon use.
    - >
      The thrulay-hd project page says the original thrulay was initially created by
      Stanislav Shalunov, and describes thrulay-hd as a 2005 effort to improve the
      original 0.6 release with multiple TCP/UDP streams, an API for programmatic tests,
      IPv6 support, and client-address authentication.
  related-projects:
    - >
      The thrulay-hd page identifies thrulay-ng as a separate Google Summer of Code
      project also aimed at improving the original thrulay.
  sources:
    - https://sourceforge.net/projects/thrulay/
    - https://thrulay-hd.sourceforge.net/
    - https://thrulay-hd.sourceforge.net/docs/thrulay.1.html
    - https://thrulay-hd.sourceforge.net/docs/thrulayd.8.html
    - input source_facts.executables
    - input source_facts.package-manager
  summary:
    - >
      thrulay is a command-line network performance tester for measuring throughput,
      delay, and related network metrics with TCP and UDP traffic.
  timeline:
    - '2005: SourceForge project registered.'
    - '2005: thrulay-hd page last updated with CVS checkout and build instructions.'
    - '2015: SourceForge project page lists the latest project update.'
  usage:
    - >
      The `thrulay` manual describes a client that sends continuous TCP streams or
      fine-grained Poisson UDP streams to a host. The `thrulayd` manual describes the
      server daemon that listens for client requests, returns data for TCP tests, and
      sends statistics for UDP tests.
