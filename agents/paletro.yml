history:
  adoption-history:
    - >
      Paletro applies the command-palette interaction popularized by editors such as
      Visual Studio Code and Sublime Text to ordinary macOS applications. Its
      compatibility work has included Apple Silicon, fast user switching, hidden menu
      items, non-English locales, and applications such as Adobe InDesign and Figma.
  package-nerd-significance:
    - >
      Paletro is a focused example of a native utility that generalizes an
      editor-centric workflow across unrelated graphical applications. It obtains
      commands from the active application's menu through macOS Accessibility rather
      than requiring a dedicated plugin for every supported application.
  project-history:
    - >
      AppMakes created Paletro as a commercial macOS utility that exposes the focused
      application's menu commands through a searchable palette. The initial 1.0 release
      established fuzzy command search and keyboard-driven execution.
    - >
      Subsequent releases added stability and compatibility improvements, Apple Silicon
      support, fast user switching, hidden-menu access, and an extension mechanism.
  related-projects:
    - Visual Studio Code command palette
    - Sublime Text command palette
  sources:
    - https://appmakes.io/paletro — official product description and feature list.
    - https://appmakes.io/paletro/changelog — official release history.
    - https://appmakes.io/paletro/docs — official support documentation.
    - source_facts.description
  summary:
    - >
      Paletro is an AppMakes utility for macOS that turns the active application's menu
      commands into a searchable, keyboard-driven command palette.
  timeline:
    - "Version 1.0.0: Paletro's first public release."
    - 'Version 1.3.0: Added fast user switching.'
    - 'Version 1.5.0: Added native Apple Silicon support.'
    - 'Version 1.8.0: Improved extension handling.'
  usage:
    - >
      Users press the default Shift-Command-P shortcut, search for a command from the
      focused application's menu, and execute it without navigating menu hierarchies.
      Paletro supports fuzzy filtering, displays existing shortcuts, and offers rules
      for excluding commands or disabling the palette in selected applications.
    - >
      The application requires macOS Accessibility access so it can inspect and invoke
      the active application's menu commands.
