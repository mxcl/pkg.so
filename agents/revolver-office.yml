credentials-file-location: null
history:
  adoption-history:
    - >
      Revolver is positioned for small and midsize service businesses whose work
      revolves around projects and billable time, including advertising and digital
      agencies, photographers, film-production businesses, IT service providers, and
      consultants.
  package-nerd-significance:
    - >
      Revolver is notable to Mac package users as a specialized, long-lived business
      application rather than a general-purpose task manager. Deployment can involve
      either a single-workstation database or a separate Revolver Server, and the vendor
      documents distinct data and preference locations for those arrangements.
  project-history:
    - >
      Revolver Office was developed as an integrated agency-management system that
      brings customer records, correspondence, calendars, projects, time tracking,
      purchasing, invoicing, and reporting into one linked application. The current
      product line includes single-user and networked configurations.
  related-projects:
    - >
      Revolver Server provides the multi-workstation deployment model, while Revolver
      ONE and Revolver SOLO cover single-workstation use cases.
  sources:
    - https://hilfe.revolver.info/
    - https://hilfe.revolver.info/article/1of3r9f9zr-was-liegt-wo
    - https://hilfe.revolver.info/article/3lmcmbhybx-ueberblick
    - https://www.revolver.info/
  summary:
    - >
      Revolver Office is commercial agency and project-management software for
      organizing customer work from planning and time capture through invoicing and
      business reporting.
  timeline:
    - >
      2026: Revolver 8.13 was promoted with support for receiving and issuing electronic
      invoices.
  usage:
    - >
      Teams use Revolver to maintain customers, plan and assign projects, record time
      against project stages, associate incoming costs with projects, issue quotations
      and invoices, and evaluate profitability through reports.
