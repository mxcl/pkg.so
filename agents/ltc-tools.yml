history:
  adoption-history:
    - >
      Adoption evidence is niche but real: the supplied package-manager facts list
      Homebrew, MacPorts, and Nix packages, and GitHub shows about 91 stars, 23 forks,
      200 commits, and a v0.7.0 release. This is consistent with a specialist
      audio/video utility rather than a general-purpose media application.
  package-nerd-significance:
    - >
      ltc-tools matters in package histories because it exposes pro-audio
      synchronization primitives as simple Unix commands. It is the sort of package that
      rarely appears in broad developer tooling discussions but is important in audio,
      broadcast, and measurement setups where linear timecode must be inspected or
      synthesized without a large DAW.
  project-history:
    - >
      The official README is deliberately short: it identifies the project as
      command-line tools for linear timecode and notes that it requires x42/libltc. The
      repository contents show C sources and roff man pages for tools such as `ltcgen`,
      `ltcdump`, `jltcgen`, `jltcdump`, `jltc2mtc`, `jltcntp`, and `jltctrigger`.
  related-projects:
    - x42/libltc is the required LTC library named by the README.
    - MIDI timecode is related through the `jltc2mtc` executable.
    - JACK-oriented tooling is implied by the `jltc*` executable family.
  sources:
    - https://github.com/x42/libltc
    - https://github.com/x42/ltc-tools
    - https://github.com/x42/ltc-tools/releases
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      ltc-tools is a small collection of command-line programs for generating, dumping,
      converting, and triggering against linear timecode.
  timeline:
    - >
      2019: GitHub lists v0.7.0 as the latest release, with statically linked `ltcdump`
      binaries included.
    - '2020s: Homebrew, MacPorts, and Nix package the toolset for command-line LTC workflows.'
  usage:
    - >
      Users install the package to get focused CLI tools for LTC workflows. The
      executable names map directly to package-nerd use cases: generate LTC, dump or
      inspect LTC, bridge JACK-oriented LTC to MIDI timecode, and perform trigger or
      NTP-related timecode tasks.
