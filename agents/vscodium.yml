credentials-file-location: null
history:
  adoption-history:
    - >
      VSCodium became a prominent way to obtain the open-source VS Code codebase as
      ready-made binaries without Microsoft's product branding, proprietary release
      license, or configured telemetry endpoints.
    - >
      Its distribution broadened from GitHub releases to Homebrew, Windows package
      managers, Snap, Flatpak, Arch packages, and an apt/rpm repository. VSCodium uses
      Open VSX as its default extension registry because Microsoft Marketplace terms
      restrict Marketplace offerings to Visual Studio products and services.
  package-nerd-significance:
    - >
      VSCodium makes the distinction between an open-source codebase and vendor-produced
      binaries unusually visible. It is a practical case study in reproducible
      downstream builds, branding, telemetry defaults, extension-registry policy, and
      the licensing consequences of repackaging an upstream editor.
  project-history:
    - >
      The VSCodium project began in 2018 as automation for building Microsoft's
      MIT-licensed vscode source into community-distributed binaries. The project
      emphasizes that it is a build-and-release system rather than a source-code fork.
    - >
      Its scripts fetch upstream VS Code, apply community product configuration and
      branding, disable telemetry, build platform packages, and publish the resulting
      binaries. This model allows releases to follow upstream VS Code closely while
      keeping VSCodium-specific changes relatively small.
  related-projects:
    - >
      VSCodium is built from Microsoft's vscode source repository. It uses Open VSX for
      extensions by default and has an Insiders channel corresponding to upstream
      prerelease builds.
  sources:
    - https://github.com/VSCodium/vscodium
    - https://github.com/VSCodium/vscodium/blob/master/LICENSE
    - https://github.com/VSCodium/vscodium/blob/master/docs/migration.md
    - https://github.com/VSCodium/vscodium/tree/master/docs
  summary:
    - >
      VSCodium is a community build and release system for freely licensed Visual Studio
      Code binaries. It removes Microsoft branding and configured telemetry and supplies
      desktop packages for major operating systems.
  timeline:
    - '2018: The VSCodium project and its MIT-licensed build scripts were established.'
    - '2018: Community apt and rpm packaging work began alongside the GitHub releases.'
    - >
      VSCodium subsequently gained Homebrew, WinGet, Chocolatey, Scoop, Snap, Flatpak,
      and Arch-oriented installation paths.
  usage:
    - >
      Users install VSCodium as a general-purpose graphical code editor and IDE
      platform. Most VS Code workflows and settings carry over, but extensions come from
      Open VSX by default and some Microsoft-restricted extensions may be unavailable or
      incompatible.
