history:
  adoption-history:
    - >
      AdPlug started in the SourceForge era and moved active development to GitHub in
      2015. At that point the project split AdPlay, the Winamp plugin, and other modules
      into separate repositories under the AdPlug organization, a packaging-friendly
      layout that distinguishes the core library from frontends.
    - >
      The provided package facts show AdPlug in Homebrew, Debian/Ubuntu as
      `adplug-utils`, Fedora, MacPorts, and openSUSE-style packaging. That spread is
      typical for a small preservation library: it is not a mainstream end-user app, but
      it is valuable enough that Unix distributions keep it available for media players,
      testing tools, and retro collections.
    - >
      The 2020 and 2025 releases show continued attention to security and correctness.
      The project recorded multiple CVE fixes in 2.3.3 and a large fuzzing, cleanup, and
      new-format pass in 2.4.
  package-nerd-significance:
    - >
      AdPlug is significant because it turns a pile of game-specific and
      tracker-specific AdLib formats into a reusable Unix library. That matters for
      preservation workflows, regression testing old music files, and package ecosystems
      that prefer small CLI/library components over monolithic emulators.
    - >
      Its emulator-license notes are also package-nerd bait: the README documents a move
      away from problematic MAME-derived emulator code toward LGPL-compatible emulation,
      which affects redistribution and whether distributions can ship the library
      cleanly.
  project-history:
    - >
      The AdPlug README dates the project to Simon Peter's 1999 codebase and describes
      it as a multi-platform C++ library for playing data originally created for AdLib
      OPL2/3 boards on top of an emulator or real hardware. The project site emphasizes
      that AdPlug is the backend for multiple frontends, including standalone players
      and plugins.
    - >
      AdPlug grew by adding replayers for individual formats instead of flattening
      everything into one generic parser. Its official site lists a broad catalog of
      supported formats, including AdLib Tracker, Westwood ADL, Creative CMF, DOSBox
      DRO, Apogee IMF, LucasArts LAA, Sierra SCI, Softstar RIX, Reality AdLib Tracker,
      VGM, and many others.
    - >
      The release history shows a steady maintenance story: early versions made AdPlug a
      real library, added libbinio and a database framework, and expanded Unix
      portability; later versions added OPL3 support, safer emulators, test coverage,
      more game formats, CI, fuzzing-driven fixes, and modern build support.
  related-projects:
    - AdPlay/UNIX is the console frontend for AdPlug.
    - libbinio is an AdPlug dependency for platform-independent binary I/O.
    - >
      DOSBox, NukedOPL, WoodyOPL, and older MAME-derived OPL code are relevant because
      AdPlug can play through emulated OPL implementations.
  sources:
    - https://adplug.github.io/
    - https://github.com/adplug/adplug#readme
    - https://raw.githubusercontent.com/adplug/adplug/master/NEWS
    - source_facts.package-manager
  summary:
    - >
      AdPlug is a hardware-independent AdLib/OPL2 and OPL3 playback library for old PC
      music formats. It is packaged both as a library and with utilities because it
      preserves a wide set of DOS game, tracker, and AdLib-era music formats behind one
      C++ playback API.
  timeline:
    - '1999: AdPlug project copyright begins.'
    - '2001: AdPlay/UNIX frontend copyright begins.'
    - '2010: AdPlug 2.2 released with new format support and AdPlay/UNIX 1.7.'
    - >
      2015: Development moved to GitHub and related modules were split into separate
      repositories.
    - '2017: AdPlug 2.3 added many formats, CI support, and NukedOPL/WoodyOPL emulators.'
    - '2020: AdPlug 2.3.3 fixed multiple parser CVEs.'
    - '2025: AdPlug 2.4 added new formats, fuzzing-driven fixes, and updated NukedOPL.'
  usage:
    - >
      Developers use AdPlug as a library when they need to decode or play original OPL
      music data without depending on an AdLib card. Users more often meet it indirectly
      through `adplugdb`, AdPlay/UNIX, player plugins, or other tools linked against the
      library.
    - >
      For package maintainers, AdPlug is a classic multimedia library package: it has a
      stable public purpose, a long source history, optional frontends,
      platform-specific build concerns, and a supported-format matrix that grows as
      obscure file formats are identified and reimplemented.
related-packages:
