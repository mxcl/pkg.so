config-file-location:
  unix:
    - ${XDG_CONFIG_HOME:-~/.config}/broot/conf.toml
    - ${XDG_CONFIG_HOME:-~/.config}/broot/conf.hjson
credentials-file-location: null
history:
  adoption-history:
    - >
      Broot became popular among command-line users who wanted richer navigation without
      adopting a full-screen orthodox file manager. GitHub shows a large user audience,
      and the input package facts show broad packaging across Homebrew, Debian, Alpine,
      MacPorts, Nix, Arch, Scoop, Winget, and openSUSE.
  package-nerd-significance:
    - >
      Broot is a representative modern Rust CLI package: single-purpose but deep,
      cross-platform, visually rich in the terminal, and widely distributed by both Unix
      and Windows package managers. It also illustrates how newer tools compose with
      shells rather than replacing them outright.
  project-history:
    - >
      The official documentation describes Broot as a better way to navigate
      directories, find files, and launch commands. Its core idea is to keep a readable
      tree visible even for large directories by filtering, respecting ignore files, and
      letting the user jump back to the shell in the selected directory through the `br`
      integration.
    - >
      The GitHub repository and changelog show steady development over many years, with
      features expanding from directory overview and search into panels, file previews,
      staging areas, trash support, image rendering through terminal graphics protocols,
      Git status views, modal input, configurable verbs, and shell integrations.
  related-projects:
    - >
      Related command-line navigation and file-management tools include tree, fd, fzf,
      ranger, nnn, vifm, zoxide, broot's own shell function `br`, and terminal
      file-preview ecosystems built around Kitty or WezTerm graphics.
  sources:
    - https://dystroy.org/broot/
    - https://github.com/Canop/broot#readme
    - https://raw.githubusercontent.com/Canop/broot/main/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      Broot is a Rust terminal file navigator that combines a compact directory tree,
      fuzzy search, file operations, preview panels, shell integration, and user-defined
      verbs. It is designed as a more interactive answer to `tree`, `ls`, `find`, and ad
      hoc `cd` workflows.
  timeline:
    - '2019: Early public release tags appear in the official Git repository.'
    - >
      2023: The changelog shows continuing shell integration and file-operation
      improvements, including trash support and Windows installer work.
    - >
      2024: Preview transformers, improved terminal key handling, and richer panels land
      in the 1.40+ series.
    - '2025: Broot adds more filesystem, preview, watching, and image-rendering improvements.'
    - '2026-06-01: Changelog lists v1.57.0.'
  usage:
    - >
      Typical use is `br` or `broot` inside a project tree: type a few letters to narrow
      the tree, press enter or a configured verb to open a file, use Alt-Enter to return
      to the shell in a selected directory, and use panels or the staging area for file
      operations. Configuration lives under the XDG config directory and lets users
      define verbs, shortcuts, skins, icons, and preview transformers.
