history:
  adoption-history:
    - >
      gif2png's adoption was rooted in a specific historical problem: GIF was ubiquitous
      but politically and technically contentious, while PNG offered a patent-free
      replacement for many web graphics. The utility gave web maintainers a batchable
      path to convert image assets and update references.
    - >
      The package's continued presence in Homebrew, Fedora, Arch, and other packaging
      indexes reflects its role as a small, stable conversion tool rather than a large
      image suite. Users who need this exact conversion can install a purpose-built
      command instead of pulling in a broad graphics application.
  package-nerd-significance:
    - >
      gif2png is package-nerd significant because it is old, focused, and still easy to
      package. Its changelog records decades of small portability and correctness fixes,
      including security hardening and a language-port transition from C-era tooling to
      Go while keeping the command-line identity intact.
  project-history:
    - >
      The project predates its GitLab hosting and has a long changelog preserved by Eric
      S. Raymond's project page. The NEWS file shows releases in 1999 leading up to
      version 2.0.0, which was marked ready for Burn All GIFs Day, a campaign-era
      milestone in PNG advocacy.
    - >
      Development continued through portability, packaging, and correctness work:
      DocBook documentation in 2002, RPM and Freshmeat packaging updates in 2003, libpng
      and security fixes in the 2000s and 2010s, a simpler makefile after Autotools
      removal in 2015, a Go port in 2019, and Go module packaging in 2023.
  related-projects:
    - >
      gif2png is related to PNG, GIF, libpng, web2png, Burn All GIFs Day, and small
      Unix-style image conversion utilities.
  sources:
    - http://www.catb.org/~esr/gif2png
    - http://www.catb.org/~esr/gif2png/NEWS.adoc
    - https://gitlab.com/esr/gif2png
    - https://gitlab.com/esr/gif2png/-/tags
  summary:
    - >
      gif2png is a classic image-conversion utility that converts GIF files to PNG and
      ships with `web2png`, a front end for converting web hierarchies and rewriting
      image references. It is strongly associated with the late-1990s move from GIF
      toward PNG on the open web.
  timeline:
    - '1999: Version 2.0.0 was prepared for Burn All GIFs Day.'
    - '2002: Documentation masters moved to DocBook.'
    - '2003: RPM and Freshmeat packaging updates landed in the 2.5 series.'
    - '2012: A filename buffer overflow fix for CVE-2009-5018 was released.'
    - '2015: Autotools was removed in favor of a simple makefile.'
    - '2019: The code was ported to Go.'
    - '2023: The build was converted to a Go module.'
    - '2026: Version 3.0.4 updated web2png for Python 3.'
  usage:
    - >
      Practitioners use `gif2png` for file-level GIF to PNG conversion and `web2png`
      when converting a directory tree of web pages and image references. The README
      describes POSIX and Go build requirements, a regression test suite, and the `make
      check` workflow.
    - >
      Typical use is archival cleanup, static-site maintenance, packaging tests around
      image conversion, or migration of old GIF-heavy web assets to PNG.
related-packages:
  - id: brew:imagemagick
    reason: >
      Choose ImageMagick when GIF-to-PNG conversion must be combined with resizing,
      cropping, color processing, or other multi-format transformations.
    rel: alternative
    sources:
      - https://gitlab.com/esr/gif2png
      - https://imagemagick.org/command-line-processing/
      - https://imagemagick.org/formats/
  - id: brew:pngquant
    reason: >
      Run pngquant on gif2png's PNG output when the next step is palette-based lossy
      compression for smaller web assets.
    rel: adjacent_workflow
    sources:
      - https://gitlab.com/esr/gif2png
      - https://pngquant.org/
