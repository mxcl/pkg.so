id: brew:mdformat
display-name: mdformat
repo: https://github.com/hukkin/mdformat
docs:
  - https://mdformat.readthedocs.io/en/stable
config-file-location:
  unix:
    - .mdformat.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      mdformat's adoption is tied to Python packaging and automated formatting
      workflows. Its official docs show installation with pipx, Python API use, and use
      as a pre-commit hook by referencing the GitHub repository and pinning a revision.
    - >
      The plugin docs document a broader ecosystem of mdformat-* packages for GitHub
      Flavored Markdown, MyST, front matter, table-of-contents generation, code-block
      formatting with Black, shfmt, gofmt, rustfmt, and related tools. The input facts
      list availability in Homebrew, Debian, Nix, and Arch-style packaging.
  package-nerd-significance:
    - >
      mdformat is a useful package-history marker for the shift from Markdown rendering
      tools to Markdown style enforcement. It fills a similar cultural role for Markdown
      that Black filled for Python: fewer formatting arguments, more reproducible diffs.
    - >
      Its plugin model matters to packagers because optional behavior is split across
      separately distributed Python packages. That keeps the core package small but
      makes environment composition important for users who need GFM, MyST, front
      matter, or code-block formatters.
  project-history:
    - >
      The project was published to PyPI in July 2020 as version 0.1.0 and is developed
      in the hukkin/mdformat GitHub repository. Its README describes the core pitch as
      enforcing a consistent Markdown style while preserving CommonMark-rendered output.
    - >
      The changelog shows steady maturation of the 0.7 series: configuration in
      `.mdformat.toml` arrived in 0.7.10, plugin interfaces evolved in 0.7.19, and
      version 1.0.0 later removed older Python support, added markdown-it-py v4 support,
      and added CommonMark 0.31.2 support.
  related-projects:
    - >
      The README explicitly compares mdformat with Prettier for Markdown formatting and
      discusses CommonMark-focused behavior.
    - >
      The plugin ecosystem includes mdformat-gfm, mdformat-black, mdformat-toc,
      mdformat-myst, mdformat-frontmatter, and other official-doc-listed extensions.
  sources:
    - https://github.com/hukkin/mdformat#readme
    - https://mdformat.readthedocs.io/en/stable/users/changelog.html
    - https://mdformat.readthedocs.io/en/stable/users/configuration_file.html
    - https://mdformat.readthedocs.io/en/stable/users/installation_and_usage.html
    - https://mdformat.readthedocs.io/en/stable/users/plugins.html
    - https://pypi.org/project/mdformat/
    - source_facts.package-manager
  summary:
    - >
      mdformat is an opinionated CommonMark-compliant Markdown formatter available as
      both a Unix-style command-line tool and a Python library. It formats Markdown
      documents in place, checks formatting in CI, and exposes plugin hooks for parser
      extensions and code-block formatting.
  timeline:
    - '2020: Version 0.1.0 published to PyPI.'
    - '2021: Version 0.7.10 added `.mdformat.toml` configuration.'
    - '2025: Version 1.0.0 published with Python support and CommonMark updates.'
    - '2026: Homebrew formula tracked stable version 1.0.0.'
  usage:
    - >
      Common CLI usage is `mdformat README.md CHANGELOG.md`, `mdformat .` for recursive
      formatting, `mdformat -` for standard input, and `mdformat --check` in CI. The
      tool also exposes a Python API through `mdformat.text()` and `mdformat.file()`.
    - >
      Configuration is resolved from a TOML file named `.mdformat.toml`, searched upward
      from the formatted file or from the current working directory for standard input.
      Command-line arguments take precedence over configuration values.
related-packages:
  - id: brew:prettier
    reason: >
      Choose Prettier when one formatter must cover Markdown together with JavaScript,
      TypeScript, CSS, HTML, YAML, and other web formats; choose mdformat for a
      Python-native, CommonMark-focused and extensible Markdown formatter.
    rel: alternative
    sources:
      - https://github.com/hukkin/mdformat#why-not-use-prettier-instead
      - https://prettier.io/docs/en/
  - id: brew:pre-commit
    reason: >
      mdformat officially publishes a pre-commit hook, so pre-commit can run and enforce
      Markdown formatting automatically before changes are committed or in CI.
    rel: adjacent_workflow
    sources:
      - >
        https://mdformat.readthedocs.io/en/stable/users/installation_and_usage.html#usage-as-a-pre-commit-hook
      - https://pre-commit.com/
