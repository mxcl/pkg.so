history:
  adoption-history:
    - >
      Aurora HDR was offered for both Mac and Windows and developed a workflow spanning
      tone mapping, layers, filters, batch processing, and use as a plug-in alongside
      other photo editors.
  package-nerd-significance:
    - >
      Aurora HDR represents the wave of specialized commercial photo applications
      distributed outside traditional app stores and installed through desktop package
      catalogs. Its retained cask is also useful for users maintaining older licensed
      creative workflows.
  project-history:
    - >
      Aurora HDR was developed as a joint project between Skylum and photographer Trey
      Ratcliff. Aurora HDR 2018 introduced a redesigned cross-platform codebase, a new
      interface, lens corrections, faster processing, updated tone mapping, and an
      edit-history panel.
    - >
      Skylum now directs the former Aurora HDR product page to a comparison with Luminar
      Neo, indicating that Aurora HDR is a legacy product in the company's current
      catalog.
  related-projects:
    - >
      Luminar Neo is the current Skylum product presented as the successor alternative
      on the redirected Aurora HDR product page.
  sources:
    - https://blog.skylum.com/aurora-hdr-2018-the-preorder-has-arrived/
    - https://skylum.com/aurorahdr
    - https://skylum.com/aurorahdr/tutorials/2018/introduction-aurora-hdr-2018
    - https://skylum.com/aurorahdr/tutorials/2018/user-interface-overview-2018
  summary:
    - >
      Aurora HDR is Skylum's dedicated high-dynamic-range photo editor, built to merge
      and tone-map bracketed exposures and to edit photographs with layers, filters,
      presets, and related correction tools.
  timeline:
    - '2017: Skylum announced Aurora HDR 2018 with a redesigned cross-platform implementation.'
    - 'Current catalog: Skylum redirects Aurora HDR visitors to a comparison with Luminar Neo.'
  usage:
    - >
      Photographers use Aurora HDR to merge bracketed exposures or process individual
      images, then refine them with tone mapping, layers, filters, history states, and
      export or plug-in workflows.
