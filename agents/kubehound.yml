credentials-file-location: null
history:
  adoption-history:
    - >
      KubeHound is narrower than general Kubernetes admin tools, but it entered
      package-manager culture quickly enough to appear in Homebrew. That packaging
      matters for security teams because the tool is meant to run from an analyst
      workstation against a selected kubeconfig context.
    - >
      The project's adoption signal is strongest in Kubernetes security circles:
      official docs, Datadog Security Labs posts, and conference material frame it as a
      way to prioritize security work by graph reachability rather than scanner output
      volume.
  package-nerd-significance:
    - >
      KubeHound is package-nerd interesting because it brings graph-security analysis
      into a CLI that can be installed from Homebrew beside kubectl and kubectx. It
      represents the Kubernetes security tooling trend from static lists toward
      attack-path modeling.
  project-history:
    - >
      The public GitHub repository was created on May 15, 2023. Datadog Security Labs
      announced KubeHound on October 2, 2023, describing it as a new open source project
      for visualizing attack paths in Kubernetes deployments.
    - >
      Datadog's 2023 Security Labs review says KubeHound was an internal project used by
      the adversary emulation team before it was open sourced. The documentation
      presents KubeHound as a graph of pods, nodes, identities, permissions, and attack
      techniques.
  related-projects:
    - kubectx is documented as one way to select the target Kubernetes cluster.
    - >
      JanusGraph and Gremlin are the graph database and query ecosystem used for
      attack-path storage and analysis.
    - >
      The KubeHound documentation includes an attack reference for Kubernetes attack
      techniques.
  sources:
    - https://api.github.com/repos/DataDog/KubeHound
    - https://formulae.brew.sh/formula/kubehound
    - https://github.com/DataDog/KubeHound
    - https://kubehound.io/
    - https://securitylabs.datadoghq.com/articles/kubehound-identify-kubernetes-attack-paths/
    - https://securitylabs.datadoghq.com/articles/security-labs-in-review-2023/
  summary:
    - >
      KubeHound is Datadog's open source Kubernetes attack-graph tool. It collects
      cluster data, computes attack paths, and stores them in a graph database so
      defenders and red teams can reason about multi-hop compromise paths instead of
      isolated findings.
  timeline:
    - '2023-05-15: Public GitHub repository created'
    - '2023-10-02: Datadog Security Labs announced KubeHound as an open source project'
    - >
      2024-01-04: Datadog's Security Labs review described KubeHound as open sourced
      from an internal adversary-emulation project
    - '2025-11-14: v1.6.7 release published'
  usage:
    - >
      KubeHound can select a target cluster through kubectx or through a KUBECONFIG
      environment variable. It ingests data from the Kubernetes API server, computes
      attack paths, stores results in JanusGraph, and supports graph queries through
      Gremlin or the KubeHound DSL.
    - >
      The documentation says KubeHound can identify more than 25 attacks, including
      container escape and lateral movement techniques, and can answer questions such as
      whether a path exists from a specific container to a node or cluster-admin role.
related-packages:
  - id: brew:kubectx
    reason: >
      KubeHound's official setup guide recommends kubectx as an optional way to select
      the cluster context before collecting and analyzing attack paths.
    rel: adjacent_workflow
    sources:
      - https://kubehound.io/user-guide/getting-started/
      - https://github.com/ahmetb/kubectx#readme
