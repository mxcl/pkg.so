id: cask:playcover-community
display-name: PlayCover
repo: null
docs:
  - https://docs.playcover.io/
config-file-location:
  macos:
    - ~/Library/Containers/io.playcover.PlayCover/Keymapping/<com.bundle.id>.plist
    - ~/Library/Containers/io.playcover.PlayCover/App Settings/<com.bundle.id>.plist
    - ~/Library/Containers/io.playcover.PlayCover/Entitlements/<com.bundle.id>.plist
credentials-file-location:
  macos:
    - ~/Library/Containers/io.playcover.PlayCover/PlayChain/<bundle-id>
history:
  adoption-history:
    - >
      The current PlayCover organization describes its project as a community fork with
      no affiliation to the original author. It maintains the application, a dedicated
      documentation project, PlayTools, community keymaps, a website, and a Homebrew
      tap.
    - >
      The software grew from a Genshin Impact-oriented utility into a general wrapper
      for a range of iOS applications and games, although compatibility remains
      application-specific.
  package-nerd-significance:
    - >
      PlayCover exploits Apple Silicon's architectural compatibility with iOS software
      while adding packaging, signing, an iPad-like wrapper, keyboard and controller
      mapping, resolution controls, and compatibility bypasses.
    - >
      Its ecosystem is unusually package-manager-friendly: the maintainers publish their
      own Homebrew tap and document stable, prerelease, and nightly casks.
    - >
      PlayChain is technically notable because it supplies a partial Keychain-like store
      for self-signed applications without requiring macOS's signature enforcement to
      remain disabled.
  project-history:
    - >
      PlayCover originated as software for running Genshin Impact on Apple Silicon Macs.
      Its scope expanded to other iOS applications and games, using a wrapper that
      imitates an iPad and allows applications to run natively on compatible Mac
      hardware.
    - >
      A community-maintained fork now carries the project forward under the PlayCover
      organization. Supporting projects include PlayTools for injected controls and
      compatibility features, PlayBook for documentation, and a shared keymap
      collection.
  related-projects:
    - >
      PlayTools supplies keymapping, display controls, PlayChain, and compatibility
      functions to installed applications.
    - PlayBook is the project's official user documentation.
    - >
      The PlayCover keymaps repository distributes community-created `.playmap`
      configurations.
  sources:
    - https://docs.playcover.io/
    - https://docs.playcover.io/getting_started/download_playcover
    - https://docs.playcover.io/miscellaneous/playchain.html
    - https://docs.playcover.io/other_features/playcover_settings.html
    - https://github.com/PlayCover/PlayCover#readme
  summary:
    - >
      PlayCover is a community-maintained macOS compatibility tool for installing and
      running iOS applications and games on Apple Silicon Macs with keyboard, mouse,
      trackpad, and controller support.
  timeline:
    - >
      Project origin: PlayCover was initially designed to run Genshin Impact on Apple
      Silicon Macs.
    - >
      Community-fork era: The PlayCover organization expanded the project,
      documentation, Homebrew distribution, PlayTools integration, and keymap ecosystem.
  usage:
    - >
      Users import compatible decrypted IPA files, optionally install PlayTools, and
      launch the wrapped applications from PlayCover's library.
    - >
      Per-application settings can control resolution, device behavior, keymaps,
      bypasses, and related options.
    - >
      PlayChain can be enabled per application to persist login tokens and device
      identifiers in PlayCover's Keychain-like store.
