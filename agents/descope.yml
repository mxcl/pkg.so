history:
  adoption-history:
    - >
      The official README points users to downloadable binaries, Debian and Ubuntu APT
      installation, Fedora and CentOS DNF installation, and source builds with Go. That
      packaging mix made the CLI usable both for local administrators and automated
      project-management scripts.
  package-nerd-significance:
    - >
      For package-manager users, Descope CLI is a vendor CLI whose value is reproducible
      identity administration: it turns Descope console and management-API operations
      into installable, scriptable commands.
  project-history:
    - >
      The public descopecli release stream shows active 0.8.x releases beginning in 2024
      and continuing into 2026. The README presents the tool as a Go-based command for
      project entities, settings snapshots, audit logs, JSON output, and CI scripting.
  related-projects:
    - >
      Related Descope tooling includes create-descope-app and Descope SDK packages
      listed in the Descope documentation.
  sources:
    - https://docs.descope.com/cli
    - https://github.com/descope/descopecli#readme
    - https://github.com/descope/descopecli/releases/tag/v0.8.3
    - https://github.com/descope/descopecli/releases/tag/v0.8.15
  summary:
    - >
      Descope CLI is the command-line tool for managing Descope projects through
      Descope's management APIs. It sits in the identity and access-management tooling
      space, where package users often want repeatable project setup, export, import,
      and audit-log workflows.
  timeline:
    - '2024: v0.8.3 release included packaged binary assets for multiple platforms.'
    - '2026: v0.8.15 was published with dependency updates and snapshot import improvements.'
  usage:
    - >
      Users provide a Descope project id and management key through environment
      variables or command arguments, then run entity commands for users, tenants,
      access keys, apps, audit logs, and project snapshots. JSON output is explicitly
      supported for scripts and CI/CD workflows.
