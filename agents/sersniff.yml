history:
  adoption-history:
    - >
      sersniff remains available through Homebrew and openSUSE packaging, preserving a
      small legacy Unix utility for serial debugging and protocol investigation.
  package-nerd-significance:
    - >
      sersniff is representative of compact, purpose-built Unix hardware-debugging
      tools: it exposes traffic between endpoints without requiring a large capture
      framework and can bridge older serial equipment to TCP workflows.
  project-history:
    - >
      Jonathan McDowell wrote sersniff while decoding communication between a Nokia
      9000i Communicator and Nokia's Windows-only NServer software. He published the
      resulting skeleton because it could also help debug other serial connections and
      unknown protocols.
    - >
      The documented 0.0.5 release added selectable ports and baud rates, along with
      TCP-to-TCP and serial-to-TCP operation.
  related-projects:
    - Nokia NServer was the original counterpart whose protocol motivated the utility.
    - >
      General packet sniffers provide analogous inspection for network interfaces, while
      sersniff targets serial links and simple TCP bridges.
  sources:
    - https://www.earth.li/projectpurple/progs/sersniff.html
    - source_facts.package-manager
  summary:
    - >
      sersniff is a small Unix utility for relaying and observing traffic between two
      serial ports, between TCP endpoints, or between serial and TCP endpoints.
  timeline:
    - '1999: The Project Purple page and project copyright date establish its early public era.'
    - 'Version 0.0.5: Configurable ports, baud rates, and TCP modes were documented.'
    - '2011-07-09: The official project page received its recorded update.'
  usage:
    - >
      Users place sersniff between two communication endpoints to relay traffic while
      examining it. Configurable ports and baud rates support serial debugging, and TCP
      modes permit network-side capture or serial-to-network bridging.
