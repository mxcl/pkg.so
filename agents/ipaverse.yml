history:
  adoption-history:
    - >
      The official installation instructions support Homebrew Cask as well as source
      builds with Xcode. The project targets Apple Silicon Macs and serves developers
      and security researchers working with applications across Apple's operating-system
      ecosystem.
  package-nerd-significance:
    - >
      ipaverse combines several tasks that are usually split among command-line
      utilities: App Store package acquisition, version-library management, IPA
      comparison, code signing, device installation, and authorized reverse-engineering
      workflows. Its Homebrew Cask makes that specialized native toolkit reproducibly
      discoverable to macOS package users.
  project-history:
    - >
      ipaverse is an open-source native SwiftUI application developed by Bahattin Koç.
      It grew from an App Store package downloader and IPA re-signing tool into a
      broader local-first library and security-analysis environment with static
      inspection, Frida-assisted testing, and device-installation features.
  related-projects:
    - Apple App Store services supply catalog, licensing, and package data.
    - Xcode's devicectl and libimobiledevice provide device-installation paths.
    - Frida and Unicorn Engine support optional security-analysis capabilities.
  sources:
    - 'Official README: https://github.com/bahattinkoc/ipaverse#readme'
    - 'Official usage guide: https://github.com/bahattinkoc/ipaverse/blob/main/USAGE.md'
  summary:
    - >
      ipaverse is a macOS application for finding and downloading Apple-platform
      packages, organizing IPA copies, inspecting and comparing them, re-signing
      compatible packages, and installing them on devices. It also includes explicitly
      guarded facilities for authorized mobile-application security testing.
  timeline:
    - >
      The project subsequently expanded beyond downloading and re-signing to include IPA
      comparison, static analysis, Frida-assisted testing, and multi-account storefront
      workflows.
  usage:
    - >
      Users can search by application name or bundle identifier, select available
      versions, queue downloads, and manage original, imported, re-signed, and decrypted
      copies in a local library. Compatible DRM-free or lawfully decrypted IPAs can be
      edited, signed with a certificate and provisioning profile, and installed over USB
      or Wi-Fi.
    - >
      Security researchers can enable the guarded testing mode for local analysis and
      authorized Frida workflows. App Store downloads remain FairPlay-encrypted, and the
      project warns that re-signing does not itself remove DRM.
