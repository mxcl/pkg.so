history:
  adoption-history:
    - >
      Yuque is positioned for both personal and organizational knowledge management. Its
      official product material describes uses ranging from private notes and digital
      gardens to team documentation, enterprise knowledge retention, task management,
      discussions, and developer-facing API documentation.
  package-nerd-significance:
    - >
      The desktop package gives package-manager users a native client for a document
      platform prominent in the Chinese-language productivity ecosystem. Its structured
      knowledge-base model distinguishes it from simpler local note editors.
  project-history:
    - >
      Yuque developed as a cloud documentation and knowledge-management service
      organized around structured documents and knowledge bases. Its product offering
      subsequently broadened to personal, team, and enterprise workspaces.
  related-projects:
    - Yuque Spaces
    - Yuque knowledge bases
  sources:
