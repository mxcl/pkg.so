    - source_facts.description
  summary:
    - >
      Yuque is a cloud documentation, collaboration, and structured knowledge-management
      platform with a desktop client.
  timeline:
    - >
      Current product generation: Yuque offers personal and organizational workspaces
      centered on documents and structured knowledge bases.
  usage:
    - >
      Individuals use Yuque for notes, journals, knowledge organization, and public
      digital gardens. Teams use shared spaces for collaborative documents,
      institutional knowledge, tasks, discussions, and technical documentation.
