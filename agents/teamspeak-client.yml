history:
  adoption-history:
    - >
      TeamSpeak spread through gaming communities, LAN parties, clans, guilds, and
      tournaments after its first public release. The official history describes
      TeamSpeak 3 as serving gamers, professionals, and large online communities, with
      self-hosting and administrative control remaining central attractions.
  package-nerd-significance:
    - >
      TeamSpeak is a long-lived example of proprietary cross-platform client software
      paired with self-hostable server infrastructure. Package users value its low
      resource usage, low latency, detailed permissions, plugin SDK, and independence
      from an exclusively vendor-hosted community service.
  project-history:
    - >
      TeamSpeak began in 1999 as a personal project among friends seeking efficient
      Internet voice communication. The first public client-server release arrived in
      2001. TeamSpeak 2 improved codecs, stability, and administration in 2002.
      TeamSpeak 3 entered open beta in 2009 with a reengineered architecture, modular
      permissions, plugins, and an SDK, then officially launched in 2011. Development of
      a next-generation client was announced in 2018, followed by TeamSpeak 6 in 2025.
  related-projects:
    - >
      Mumble is a prominent open-source low-latency voice-chat alternative. Discord is a
      hosted community communication alternative.
  sources:
    - 'Official downloads: https://teamspeak.com/en/downloads?product=ts3'
    - 'Official history: https://teamspeak.com/en/more/about-us/'
    - 'Official support portal: https://support.teamspeak.com/hc/en-us'
  summary:
    - >
      TeamSpeak Client is the desktop component of TeamSpeak's low-latency,
      client-server voice communication platform, historically associated with gaming
      and privately administered communities.
  timeline:
    - '1999: TeamSpeak began as a personal project among online-gaming friends.'
    - '2001: The first public TeamSpeak release introduced its client-server architecture.'
    - '2002: TeamSpeak 2 launched with improved codecs, stability, and administration.'
    - '2009: TeamSpeak 3 entered open beta and the TeamSpeak 3 SDK was released.'
    - '2011: TeamSpeak 3 officially launched.'
    - '2018: Development of the next-generation client concept was introduced.'
    - '2025: TeamSpeak 6 was introduced.'
  usage:
    - >
      Users connect to TeamSpeak servers, enter voice and text channels, manage
      identities and bookmarks, and participate under server-defined roles and
      permissions. Communities can operate their own server or use hosted
      infrastructure, while the client remains available for Windows, macOS, Linux,
      Android, and iOS.
