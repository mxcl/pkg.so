config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Radial broadened from an application-and-action launcher into a configurable
      automation environment with community presets and shortcuts, contextual menus,
      submenus, import and export, window management, and integrations with Apple
      Shortcuts and Keyboard Maestro.
    - >
      The application remains a native macOS product distributed directly and through
      Homebrew Cask.
  package-nerd-significance:
    - >
      Radial combines the spatial efficiency of pie menus with desktop automation,
      scripts, snippets, application launching, and window management. It occupies the
      space between a conventional launcher and a programmable workflow tool.
    - >
      For package-manager users, its Homebrew cask provides a reproducible installation
      route for a commercial macOS productivity utility.
  project-history:
    - >
      AppVerge released Radial for macOS in November 2025 as a radial menu offering
      quick access to applications, emoji, folders, and custom actions.
    - >
      Rapid subsequent releases added macros and application-aware menus, community
      presets, templates, window management, shared shortcuts, import and export, an
      application switcher, AI actions, variables, and expanded trigger options.
  related-projects:
    - Radial can invoke Apple Shortcuts and Keyboard Maestro macros.
    - >
      Its official comparison pages position it alongside pie-menu and launcher tools
      such as Pieoneer, Kando, Launchy, Spotlight, and Raycast.
  sources:
    - Homebrew distribution is identified by source_facts.package-manager.brew-cask.
    - 'Official changelog: https://radial.appverge.net/changelog'
    - 'Official documentation: https://radial.appverge.net/docs/index.html'
    - 'Official features page: https://radial.appverge.net/features'
    - 'Official manifesto: https://radial.appverge.net/manifesto'
  summary:
    - >
      Radial is a gesture-driven radial launcher and automation utility for macOS that
      places applications, shortcuts, snippets, files, scripts, and multi-step workflows
      around the pointer.
  timeline:
    - '2025: Radial 1.0 launched for macOS.'
    - '2025: Version 2.0 added Community Presets.'
    - '2026: Version 3.0 added templates, window management, and automatic updates.'
    - >
      2026: Version 4.0 added shared shortcuts, import and export, submenus, and
      expanded automation actions.
    - >
      2026: Version 5.0 added AI actions, variables, saved window layouts, and a larger
      action library.
  usage:
    - >
      Users invoke a circular menu with a configured gesture or keyboard shortcut and
      select an action by direction. Menu items can launch or switch applications, type
      snippets, open URLs or files, run scripts, and invoke automations.
    - >
      Menus can change with the active application, contain submenus, and run multi-step
      workflows. Community presets provide reusable configurations, while JSON import
      and export can transfer or back up a setup.
    - >
      Configuration is performed in Radial's graphical settings. Although exported
      configurations may be saved as JSON, the official documentation does not publish a
      fixed local configuration-file or credentials-file location.
