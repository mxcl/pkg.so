id: brew:jython
display-name: Jython
repo: https://github.com/jython/jython
docs:
  - https://www.jython.org/jython-old-sites/docs/index.html
  - https://www.jython.org/
config-file-location:
  unix:
    - ~/.jython
    - <Jython root>/registry
  windows:
    - '%USERPROFILE%\.jython'
    - <Jython root>\registry
credentials-file-location: null
history:
  adoption-history:
    - >
      Jython found its niche wherever Python syntax was useful inside Java applications:
      embedding scripts in JVM software, calling Java libraries from Python code, and
      experimenting with dynamic language support on the Java platform.
    - >
      The package has remained in Unix package managers because it is historically
      important, still useful for JVM/Python interoperability, and different enough from
      CPython to matter to users who specifically need Java integration.
  package-nerd-significance:
    - >
      For package maintainers, Jython is a classic alternate-language-runtime package:
      it looks like Python at the command line but has JVM dependencies, Java
      compatibility concerns, and a release cadence separate from CPython.
    - >
      It is also a reminder that language packages are not always mere compilers or
      interpreters; some are compatibility layers between two large ecosystems, which
      makes versioning and dependency policy especially visible.
  project-history:
    - >
      JPython was created in late 1997 by Jim Hugunin at CNRI. Barry Warsaw took over as
      primary developer in February 1999, and the project moved to SourceForge in
      October 2000 under the Jython name.
    - >
      The project became a durable bridge between the Python and Java ecosystems. Its
      2.x line tracked Python 2 compatibility, while the official Jython site and
      repository describe ongoing Python 3 work as a separate development direction
      rather than a completed replacement.
  related-projects:
    - >
      Jython is related to CPython as an alternate Python implementation, to the Java
      platform as its runtime target, and to other Python-on-managed-runtime projects
      that trade native C extension compatibility for host-platform integration.
  sources:
    - https://github.com/jython/jython
    - https://www.jython.org/
    - https://www.jython.org/jython-old-sites/license.html
    - https://www.jython.org/news.html
  summary:
    - >
      Jython is the long-running implementation of Python for the Java platform,
      descended from JPython and maintained as a Python runtime that can import and use
      Java classes while running on the JVM.
  timeline:
    - '1997: JPython was created by Jim Hugunin.'
    - '1999: Barry Warsaw became primary developer and released JPython 1.1.'
    - '2000: The project moved to SourceForge and was renamed Jython.'
    - '2020: Jython 2.7.2 was released with Java 8 builds and Java 11 testing.'
    - '2022: Jython 2.7.3 was released.'
    - '2024: Jython 2.7.4 was released.'
  usage:
    - >
      Users run the `jython` command as a Python interpreter on the JVM, often to script
      Java APIs or to embed Python-like extension points in Java software. Official
      documentation emphasizes Java package access, Java bytecode compilation, and
      integration with Java platform classes.
related-packages:
  - id: brew:python@3.14
    reason: >
      Choose CPython for current Python 3 language and native-extension compatibility;
      choose Jython specifically when direct JVM embedding and Java-class access are
      required.
    rel: alternative
    sources:
      - https://github.com/jython/jython
      - https://www.jython.org/
      - https://docs.python.org/3.14/
