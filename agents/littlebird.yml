history:
  adoption-history:
    - >
      Littlebird is offered as a macOS desktop application and browser service, with
      optional integrations for calendars, email, messaging, and other work tools. Its
      documentation presents integrations as optional rather than prerequisites.
  package-nerd-significance:
    - >
      For desktop-package users, Littlebird represents the category of context-aware AI
      assistants that combine a native macOS client, cloud-backed memory, meeting
      capture, and third-party connectors in one installable application.
  project-history:
    - >
      Littlebird was developed as a context-aware work assistant that observes permitted
      on-screen activity, joins the user's meeting workflow, and connects to work
      services to build a reusable memory of ongoing work.
    - >
      Meeting Notes entered a broader rollout in late 2025, adding transcription,
      summaries, and action items. Subsequent documentation expanded around Chat,
      Routines, integrations, MCP access, projects, and cross-app workflows.
  related-projects:
    - Littlebird Meeting Notes
    - Littlebird Routines
    - Littlebird MCP
    - Littlebird Hover
  sources:
    - >
      https://docs.littlebird.ai/docs/setup/ — official context-awareness and
      integration setup.
    - >
      https://docs.littlebird.ai/docs/start-here/ — official documentation index and
      getting-started guide.
    - https://littlebird.ai/ — official product overview.
    - https://littlebird.ai/changelog/december-2025 — official Meeting Notes rollout history.
  summary:
    - >
      Littlebird is a context-aware AI productivity assistant that combines chat,
      meeting notes, routines, work memory, and optional application integrations.
  timeline:
    - >
      2025: Littlebird began broadening access to Meeting Notes, with transcription,
      summaries, and action items.
    - >
      2026: Official documentation describes an expanded product spanning desktop,
      browser, mobile chat, integrations, MCP, routines, and meeting workflows.
  usage:
    - >
      After installation, users verify macOS permissions and Context Awareness, then
      optionally connect services such as Gmail, Google Calendar, Outlook, Apple
      Calendar, and Apple Reminders. Typical uses include asking questions about current
      work, capturing meeting notes, preparing for meetings, and running recurring
      briefing routines.
