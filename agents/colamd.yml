history:
  adoption-history:
    - >
      ColaMD is distributed for macOS, Windows, and Linux and uses ordinary local
      Markdown files, allowing it to fit alongside Obsidian, Typora, VS Code, scripts,
      and AI coding agents without requiring migration into a proprietary document
      store. Its public release roadmap shows rapid feature expansion after the initial
      release.
  package-nerd-significance:
    - >
      ColaMD is notable as an Electron-based, MIT-licensed Markdown editor shaped around
      agent-written files. Its local-file model and live reaction to atomic saves make
      it relevant to users whose package and coding workflows increasingly mix graphical
      editors with command-line agents.
  project-history:
    - >
      ColaMD was created by marswave.ai from the premise that a free, attractive
      Markdown editor should be broadly available. It began as a focused WYSIWYG editor
      and evolved toward an agent-native workflow in which external edits from coding
      agents and scripts appear immediately.
  related-projects:
    - >
      Obsidian, Typora, and Visual Studio Code are explicitly named by the project as
      tools that can share the same Markdown files. Milkdown, ProseMirror, Electron,
      KaTeX, and Mermaid are important parts of or complements to its implementation and
      document features.
  sources:
    - 'Official ColaMD homepage: https://colamd.com/'
    - 'Official ColaMD releases: https://github.com/marswaveai/ColaMD/releases'
    - 'Official ColaMD repository README: https://github.com/marswaveai/ColaMD'
  summary:
    - >
      ColaMD is a free, open-source WYSIWYG Markdown editor for macOS, Windows, and
      Linux. It keeps local files in sync when agents, scripts, or other editors modify
      them and provides themes, export, diagrams, tabs, outline, and same-directory
      navigation.
  timeline:
    - "v1.0.0: ColaMD's initial public release presented the agent-native Markdown editor."
    - 'v1.3.0: The project added an agent activity indicator and richer workflow features.'
    - >
      v1.7.x: Same-directory file navigation, search, LaTeX, and an interactive
      changelog expanded the editor.
  usage:
    - >
      Users open local Markdown files or a folder-adjacent set of Markdown files and
      edit them in a WYSIWYG view or source mode. External changes are reloaded live,
      and documents can be exported to Word, PDF, self-contained HTML, or images.
