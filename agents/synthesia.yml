credentials-file-location: null
history:
  adoption-history:
    - >
      Synthesia expanded from an initially donation-supported desktop project to a
      commercial learning product with a paid Learning Pack, then reached Mac, iPad,
      Android tablets, and compatible Chromebooks.
    - >
      Its official history says piano tutorial creators adopted Synthesia widely, while
      later educator features, classroom-oriented platform support, localization, and
      keyboard integrations broadened its role in teaching and practice.
  package-nerd-significance:
    - >
      Synthesia is a notable example of a long-lived, cross-platform proprietary music
      application distributed on macOS through Homebrew Cask. Its documented per-user
      XML data and system-wide template directory are particularly useful to
      administrators deploying consistent classroom installations.
  project-history:
    - >
      The project began in 2006 as Piano Hero, initially without musical-keyboard
      support and funded by donations. In 2007, demand for a Mac version led to a
      hardware fundraiser; the Mac release coincided with a rename to Synthesia after
      Activision requested a name change.
    - >
      In 2008 the paid Learning Pack replaced the donation model and introduced an
      expanding set of educational features. Subsequent releases added educator tooling,
      tablet platforms, localization, keyboard integrations, Chromebook availability,
      and a multi-track song recorder.
  related-projects:
    - Synthesia Learning Pack, the project's historical paid educational upgrade.
    - Synthesia Music Store, an official source of MIDI song arrangements.
  sources:
    - 'Official classroom setup guide: https://www.synthesiagame.com/classroom'
    - 'Official project history: https://www.synthesiagame.com/about'
    - 'Official support portal: https://www.synthesiagame.com/support'
    - source_facts.package-manager
  summary:
    - >
      Synthesia is a piano-practice game that visualizes songs as falling notes and
      supports connected musical keyboards, notation, practice exercises, and custom
      MIDI or MusicXML songs.
  timeline:
    - '2006: Introduced as Piano Hero under a donation-supported model.'
    - '2007: Mac version released and the project renamed Synthesia.'
    - '2008: Learning Pack sales replaced donations.'
    - '2011: Became widely used for online piano tutorial videos.'
    - '2012: Added educator features and debuted on iPad.'
    - '2013: Added six display languages and launched the Music Store.'
    - '2014: Released for Android tablets.'
    - '2018: Expanded to compatible Chromebooks.'
    - '2021: Added a multi-track song recorder.'
  usage:
    - >
      Players can practice included or imported MIDI and MusicXML songs, connect a MIDI
      keyboard, slow passages, isolate hands, and use notation or falling-note views.
    - >
      Desktop users can add folders for custom songs in Settings. Classroom
      administrators can copy selected XML data files into Synthesia's system-wide
      application-support directory to enforce template settings across accounts.
