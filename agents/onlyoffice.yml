history:
  adoption-history:
    - >
      The desktop suite made the browser-based ONLYOFFICE editing engine available
      offline on Windows, macOS, and Linux. The project subsequently broadened Linux
      distribution through Snap, AppImage, and Flatpak, while connections to ONLYOFFICE
      and third-party cloud services enabled collaborative workflows.
    - >
      Opening the Desktop Editors source under AGPL in 2016 made the suite free for
      personal and commercial use and positioned it as an open-source alternative in the
      desktop-office ecosystem.
  package-nerd-significance:
    - >
      ONLYOFFICE Desktop Editors is notable for packaging the same HTML5 Canvas-based
      editing core used by the online product as a cross-platform desktop application.
      Package maintainers must account for a comparatively large GUI suite, local fonts
      and plugins, and optional cloud connectivity rather than a single-purpose document
      tool.
  project-history:
    - >
      ONLYOFFICE originated in the TeamLab collaboration platform launched in 2009. The
      developers presented their first HTML5-based document editor at CeBIT in 2012,
      rebranded TeamLab Office as ONLYOFFICE in 2014, and released Desktop Editors in
      March 2016.
    - >
      Desktop Editors initially brought the web editing engine to offline document,
      spreadsheet, and presentation work. Its source code was published in October 2016,
      plugin support followed in November, and subsequent releases expanded formats,
      collaboration, forms, and PDF capabilities.
  related-projects:
    - ONLYOFFICE Docs
    - ONLYOFFICE DocSpace
    - Nextcloud
    - ownCloud
  sources:
    - https://helpcenter.onlyoffice.com/desktop/desktop-faq.aspx
    - >
      https://www.onlyoffice.com/blog/2016/03/onlyoffice-desktop-editors-for-your-pc-or-mac-are-out
    - https://www.onlyoffice.com/blog/2016/12/onlyoffice-2016-year-in-review
    - https://www.onlyoffice.com/blog/2022/03/onlyoffice-editors-a-10-year-journey
    - https://www.onlyoffice.com/en/about
  summary:
    - >
      ONLYOFFICE Desktop Editors is a cross-platform, open-source office suite for
      documents, spreadsheets, presentations, forms, and PDFs, with both offline editing
      and optional cloud collaboration.
  timeline:
    - '2009: TeamLab collaboration platform launched.'
    - '2012: First HTML5-based ONLYOFFICE document editor was presented at CeBIT.'
    - '2014: TeamLab Office was rebranded as ONLYOFFICE.'
    - '2016-03-28: ONLYOFFICE Desktop Editors was released.'
    - '2016-10-12: Desktop Editors became open source.'
    - '2016-11: Plugin support was added.'
    - >
      2018: Snap and AppImage distribution expanded Linux availability; Flatpak followed
      later.
  usage:
    - >
      Users create and edit local office files without an internet connection or connect
      the desktop application to supported cloud platforms for collaborative work. The
      suite is commonly used where OOXML compatibility, local fonts, printing, plugins,
      and a free cross-platform desktop client are priorities.
