history:
  adoption-history:
    - >
      DoltHub moved DoltLite into its organization in April 2026 after reporting early
      users and satisfactory robustness. DoltHub added hosted push, pull, and clone
      support for DoltLite databases in August 2026.
    - >
      DoltLite advanced from an experimental alpha to beta in August 2026, five months
      after launch.
  package-nerd-significance:
    - >
      DoltLite combines SQLite's embedded-library deployment model with Git-like
      operations over structured data. This makes it notable to database and package
      enthusiasts interested in local-first software, reproducible data history, and
      distributing version-controlled databases without running a separate database
      server.
    - >
      The project is also an unusually visible experiment in agent-driven systems
      development: its maintainers describe the initial implementation as produced
      through large-scale coding-agent orchestration and extensive compatibility
      testing.
  project-history:
    - >
      DoltLite began on March 16, 2026 as an experiment by DoltHub CEO Tim Sehn to add
      Dolt-style version control to SQLite. It replaces SQLite's B-tree storage layer
      with content-addressed prolly trees while retaining the upstream-derived parser,
      planner, virtual machine, and API surface.
    - >
      The first public announcement followed on March 25, 2026. The project initially
      lived under Sehn's account, then moved to the DoltHub organization in April 2026.
      Subsequent releases added remote workflows and broader language bindings.
  related-projects:
    - SQLite supplies the upstream SQL engine and API surface.
    - Dolt supplies the Git-style database model and prolly-tree design.
    - DoltHub provides a hosted remote for sharing DoltLite databases.
  sources:
    - 'Official adoption post: https://www.dolthub.com/blog/2026-04-14-dolthub-adopts-doltlite/'
    - 'Official beta announcement: https://www.dolthub.com/blog/2026-08-31-doltlite-beta/'
    - >
      Official hosted-remotes announcement:
      https://www.dolthub.com/blog/2026-08-07-dolthub-supports-doltlite-and-doltgres/
    - 'Official launch post: https://www.dolthub.com/blog/2026-03-25-doltlite/'
  summary:
    - >
      DoltLite is an embedded, SQLite-compatible database that adds Dolt-style
      branching, commits, diffs, merges, history, and remote synchronization through SQL
      functions and virtual tables.
  timeline:
    - '2026-03-16: Development began as an agent-driven experiment.'
    - '2026-03-25: DoltLite was publicly announced as an alpha.'
    - '2026-04: DoltHub adopted the project and moved it into its organization.'
    - '2026-08: DoltHub remote hosting became available for DoltLite databases.'
    - '2026-08-31: DoltLite reached beta.'
  usage:
    - >
      Use the doltlite shell as a SQLite-like CLI, embed libdoltlite through its C API
      or language bindings, and invoke version-control operations such as add, commit,
      branch, merge, diff, push, and pull through SQL.
    - >
      Its main niche is local-first or embedded software that needs auditable, mergeable
      structured data without operating a separate database server.
