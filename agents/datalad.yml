      Official docs at https://docs.datalad.org/en/stable/ identify themselves as
      DataLad technical documentation.
    - Official homepage links the DataLad Handbook as comprehensive user documentation.
  history-sources:
    - https://docs.datalad.org/en/stable
    - https://docs.datalad.org/en/stable/changelog.html
    - https://handbook.datalad.org/en/latest/basics/101-180-FAQ.html
  repo-sources:
    - >
      GitHub README says full documentation is available at docs.datalad.org and
      handbook.datalad.org.
    - Official homepage links DataLad on GitHub to https://github.com/datalad/datalad.
  tags-sources:
