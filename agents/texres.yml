history:
  adoption-history:
    - >
      The official project supplies Homebrew installation, native macOS installers,
      Linux packages for Debian-family, RPM-family and Arch systems, a generic glibc
      archive, and a Windows installer. Its README notes that the AUR still carries an
      older release under the former names ratex and ratex-bin.
  package-nerd-significance:
    - >
      TeXres takes an unusually self-contained approach to TeX packaging: formats,
      packages, fonts, BibTeX and Biber are bundled into one distribution, avoiding a
      separate TeX Live installation and network downloads during builds. That makes it
      attractive for reproducible builds, CI, and compact developer environments.
  project-history:
    - >
      TeXres is a Rust-based TeX distribution and build driver that was formerly named
      Ratex. It combines pdfLaTeX-, XeLaTeX- and LuaLaTeX-compatible workflows with
      bundled formats, packages, fonts and bibliography tooling.
  related-projects:
    - >
      TeX Live is the compatibility reference used by the project's
      continuous-integration tests. TeXres also provides C-library and WebAssembly
      interfaces for in-memory document compilation.
  sources:
    - https://github.com/leoliu0/texres
    - https://github.com/leoliu0/texres/tree/main/docs
  summary:
    - >
      TeXres is a self-contained TeX distribution and LaTeX build tool written in Rust.
      It selects an engine, runs bibliography tools and repeats compilation as needed to
      produce a finished document.
  timeline:
    - 'Ratex era: Earlier releases and AUR packages used the Ratex name.'
    - >
      TeXres era: The project adopted the TeXres name and expanded distribution through
      native installers and multiple Linux package formats.
  usage:
    - >
      Run texres on a .tex source to build its PDF; engine-specific flags select
      pdfLaTeX, XeLaTeX or LuaLaTeX behavior. It automatically invokes BibTeX or its
      bundled Biber implementation when required. Symlinks named after individual TeX
      tools can expose single-pass compatibility modes, while editor integrations can
      call TeXres as a latexmk replacement.
