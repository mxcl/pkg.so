history:
  adoption-history:
    - >
      DbGate is distributed as a cross-platform desktop application and as a self-hosted
      web application through Docker and npm. Its official documentation describes
      Community, Premium, and Team Premium editions.
  package-nerd-significance:
    - >
      DbGate is notable to package users as a single cross-platform client spanning
      traditional SQL databases, document databases, key-value systems, and embedded
      databases. The upstream project also publishes reusable npm packages and a
      self-hosted server.
  project-history:
    - >
      The project evolved from a multi-database desktop client into a broader desktop
      and web platform. Its changelog records an npm package in the 3.9 series, MongoDB
      support in 4.1, a redesigned connection workflow in 5.0, and later cloud, team,
      and premium capabilities.
  related-projects:
    - >
      The upstream repository contains DbGate's application, server, API, data
      libraries, database plugins, and other supporting packages.
    - >
      DbGate Cloud complements the desktop application with online storage for
      connections and SQL scripts.
  sources:
    - https://docs.dbgate.io/dbgate/
    - https://docs.dbgate.io/dbgate/dbgate-cloud/index.html
    - https://github.com/dbgate/dbgate
    - https://github.com/dbgate/dbgate/blob/master/CHANGELOG.md
  summary:
    - >
      DbGate is an open-source, cross-platform SQL and NoSQL database manager maintained
      as a desktop application and self-hosted web application.
  timeline:
    - '3.9 series: DbGate added an npm distribution and expanded its SQL-editor workflow.'
    - '4.1 series: MongoDB support was added.'
    - >
      5.0 series: The connection workflow was redesigned and the local data directory
      was renamed `.dbgate`.
    - '2025: The project moved its user documentation to docs.dbgate.io.'
  usage:
    - >
      Users connect to databases such as PostgreSQL, MySQL, SQL Server, SQLite, MongoDB,
      Redis, ClickHouse, DuckDB, and others to browse schemas, edit data, execute
      queries, and import or export records.
    - >
      Desktop users install the native application, while teams and server
      administrators can run the web edition through Docker, npm, or supported cloud
      deployments.
