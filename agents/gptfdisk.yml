history:
  adoption-history:
    - >
      GPT fdisk became important as EFI and GPT partitioning became ordinary on PCs,
      Macs, removable media, and large disks. It gave Unix users an fdisk-like workflow
      for GPT and gave script authors `sgdisk` for repeatable partition-table
      operations.
    - >
      The tool family also filled a practical migration gap: its documentation covers
      MBR-to-GPT conversion, GPT-to-MBR conversion, hybrid MBRs, wiping GPT data,
      booting from GPT, and protective MBR details.
    - >
      Its package-manager footprint is broad because disk partitioning tools must be
      available in rescue systems, installers, live environments, and administrator
      workstations.
  package-nerd-significance:
    - >
      GPT fdisk is a package-nerd staple because it is both powerful and dangerous in
      the traditional Unix way: small named executables, manpages, scriptable
      operations, and direct disk writes.
    - >
      It is also historically interesting because it tracks the storage transition from
      MBR assumptions to GPT/UEFI norms, including alignment issues, Advanced Format
      drives, hybrid MBR compatibility, Windows/macOS/FreeBSD support, and rescue-disk
      packaging.
  project-history:
    - >
      The official GPT fdisk page describes `gdisk`, `cgdisk`, and `sgdisk` as tools for
      GPT disks rather than older MBR partition tables, while `fixparts` repairs certain
      MBR damage and converts partition types between primary and logical.
    - >
      The revisions page shows a long beta-era progression from early `gdisk` releases
      through added Mac OS X support, hybrid MBR handling, FreeBSD support, Windows
      support, non-512-byte-sector support, and the addition of `sgdisk` for scripts.
    - >
      Version 0.7.0 added `fixparts` in March 2011, and version 0.8.0 added `cgdisk` in
      September 2011 as a cfdisk-like interface. Version 1.0.0 in March 2015 moved GPT
      fdisk out of beta status because the program had been used for years and appeared
      reliable.
    - >
      The author-maintained rodsbooks.com pages remain the documentation center, while
      SourceForge provides source code and downloads for source and non-Linux binaries.
  related-projects:
    - >
      FreeBSD `gpt`, traditional `fdisk`, `cfdisk`, parted-style tools, UEFI firmware,
      rEFInd, and Linux rescue systems are recurring comparisons or environments in the
      GPT fdisk documentation.
    - `fixparts` has its own official page but is part of the GPT fdisk package family.
  sources:
    - https://sourceforge.net/p/gptfdisk/code/ci/master/tree
    - https://www.rodsbooks.com/gdisk
    - https://www.rodsbooks.com/gdisk/download.html
    - https://www.rodsbooks.com/gdisk/revisions.html
  summary:
    - >
      GPT fdisk is Rod Smith's family of text-mode partitioning tools for GUID Partition
      Table disks, including `gdisk`, `cgdisk`, `sgdisk`, and `fixparts`.
  timeline:
    - >
      2009: Early beta-era `gdisk` releases receive successful-use reports and
      precompiled RPMs.
    - '2010: Version 0.6.0 adds non-512-byte-sector support and the new `sgdisk` program.'
    - '2010: Version 0.6.2 adds Windows support.'
    - '2011: Version 0.7.0 adds `fixparts`.'
    - '2011: Version 0.8.0 adds `cgdisk`.'
    - '2015: Version 1.0.0 moves GPT fdisk out of beta status.'
    - '2021: Version 1.0.7 adds ARM64 Mac builds for `gdisk` and `fixparts`.'
    - '2022: Version 1.0.9 adds Windows builds for `sgdisk` and `cgdisk`.'
    - '2024: Version 1.0.10 includes bug fixes and disk-handling improvements.'
  usage:
    - >
      `gdisk` is the interactive expert-style tool, `cgdisk` offers a curses interface,
      `sgdisk` is suited to scripts and automation, and `fixparts` handles broken MBR
      partition tables.
    - >
      Administrators use GPT fdisk for inspecting and editing GPT partition tables,
      converting legacy layouts, repairing GPT metadata, creating hybrid MBRs in edge
      cases, and preparing disks from rescue or installer environments.
    - >
      The official documentation warns about platform limits such as FreeBSD write
      behavior on mounted disks and macOS System Integrity Protection restricting
      low-level access to system disks.
related-packages:
  - id: brew:gptsync
    reason: >
      Choose gptsync only for the narrower Intel Mac and legacy dual-boot task of
      synchronizing an MBR view from an existing GPT; GPT fdisk is the broader editor,
      converter, and repair suite.
    rel: alternative
    sources:
      - https://refit.sourceforge.net/doc/c3s3_config.html
      - https://www.rodsbooks.com/gdisk/hybrid.html
  - id: brew:testdisk
    reason: >
      Use TestDisk alongside GPT fdisk when partitions must be discovered or files
      recovered first, then use GPT fdisk for deliberate GPT inspection, conversion, or
      metadata repair.
    rel: adjacent_workflow
    sources:
      - https://www.cgsecurity.org/wiki/TestDisk
      - https://www.rodsbooks.com/gdisk/repairing.html
