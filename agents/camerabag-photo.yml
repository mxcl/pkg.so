history:
  adoption-history:
    - >
      Nevercenter distributes CameraBag directly and has also offered it through the Mac
      App Store, Steam, and Setapp. CameraBag Photo is the photo-only edition, while
      CameraBag Pro adds video editing.
  package-nerd-significance:
    - >
      CameraBag is notable in Mac package-manager culture as a long-lived proprietary
      creative application available as a Homebrew cask, with legacy installers and
      presets retained for users of older major releases.
  project-history:
    - >
      CameraBag progressed through 1.x and 2.x editions before CameraBag 3.x appeared in
      2016. CameraBag 2020 followed in the summer of 2019, introducing rolling
      year-based releases and separate Photo and Pro editions.
    - >
      Nevercenter sells perpetual licenses with an included upgrade period rather than a
      mandatory subscription. Its support archive preserves installers and resources for
      older major versions.
  related-projects:
    - CameraBag Pro is the companion edition with photo and video functionality.
    - CameraBag Cinema was an earlier name associated with the Pro line.
  sources:
    - https://nevercenter.com/camerabag/press/
    - https://nevercenter.com/camerabag/support/
    - https://nevercenter.com/camerabag/v_2/
    - https://nevercenter.com/camerabag/v_3/
  summary:
    - >
      CameraBag Photo is Nevercenter's commercial, preset-oriented photo editor for
      macOS and Windows. It emphasizes nondestructive-looking adjustment workflows,
      filters, RAW support supplied through the operating system, and reusable custom
      presets.
  timeline:
    - '2016: CameraBag 3.x replaced the 2.x generation.'
    - >
      2019: CameraBag 2020 was announced with Photo and Pro editions and a
      perpetual-license model with one year of upgrades.
  usage:
    - >
      Users open photographs, combine adjustment tiles and presets, and export processed
      images. The Photo edition omits the expanded video functions supplied by CameraBag
      Pro.
