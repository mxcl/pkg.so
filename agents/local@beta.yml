id: cask:local@beta
display-name: Local Beta
repo: null
docs:
  - https://localwp.com/help-docs
config-file-location:
  macos:
    - ~/Library/Application Support/Local Beta/
credentials-file-location: null
history:
  adoption-history:
    - >
      Local became popular as a free, graphical alternative to manually assembling a
      WordPress development stack. The official FAQ states that it can be used without
      being a Flywheel or WP Engine customer.
    - >
      Integration with Flywheel and WP Engine hosting, Blueprints, add-ons, SSL,
      database tooling, and shareable previews broadened it from a simple local server
      bundle into a WordPress-oriented development environment.
  package-nerd-significance:
    - >
      The beta cask gives Homebrew users a reproducible installation path for preview
      builds while keeping it distinct from the stable Local application. Package users
      should expect beta releases to change more frequently and to use the separate
      “Local Beta” application-data directory.
    - >
      Local packages an opinionated collection of web-server, PHP, database, mail,
      certificate, and WordPress-management functionality behind a desktop interface,
      avoiding much of the manual service setup associated with local WordPress
      development.
  project-history:
    - >
      Local originated under Flywheel as “Local by Flywheel” and is now branded Local.
      It is distributed as a free desktop application for creating and managing local
      WordPress sites and supports deployment-oriented workflows with Flywheel and WP
      Engine.
    - >
      The surrounding project also developed an add-on API and an ecosystem of official
      and community extensions. Flywheel publishes supporting open-source components,
      but the main desktop application does not have an identified official public
      source repository.
  related-projects:
    - >
      WordPress, Flywheel, WP Engine, Xdebug, Docker-based development environments,
      MAMP, and XAMPP participate in related local web-development workflows.
    - >
      The getflywheel GitHub organization publishes Local add-on APIs, add-ons, reusable
      components, and an archived experimental Local CLI.
  sources:
    - https://github.com/getflywheel
    - https://localwp.com/
    - https://localwp.com/help-docs/
    - https://localwp.com/help-docs/getting-started/local-by-flywheel-faq/
  summary:
    - >
      Local Beta is the preview channel of Local, Flywheel and WP Engine's desktop
      environment for creating, testing, and managing WordPress sites on a developer's
      computer.
  timeline:
    - '2016: Local by Flywheel entered the Flywheel product family.'
    - >
      2019: Official documentation was using the Local by Flywheel name and documenting
      its general WordPress workflow.
    - '2025: The experimental official Local CLI repository was archived.'
    - >
      2026: Official add-on documentation continues to describe the Local extension API
      and separate Local Beta data directory.
  usage:
    - >
      Users create a site in the desktop application, choose a PHP and web-server
      environment, work on WordPress files and the local database, and optionally push
      or pull sites through supported hosting integrations.
    - >
      The beta channel is intended for testing upcoming Local releases. Add-on
      developers can install extensions under the Local Beta application-data directory;
      individual sites contain generated service configuration under their own `conf`
      directories.
