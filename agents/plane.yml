history:
  adoption-history:
    - >
      Plane's maintainers report that the project grew rapidly after its public launch,
      becoming a widely followed open-source alternative to Jira, Linear, Monday, and
      ClickUp. It is distributed as a hosted service, self-hosted Community Edition, and
      native desktop client.
  package-nerd-significance:
    - >
      Plane is notable to package users because its desktop client is only one surface
      of a larger open-source, self-hostable work-management stack. Teams can begin with
      the packaged client or hosted service and retain a path to operating the server
      themselves.
  project-history:
    - >
      Plane was founded by Vamsi Kurama and Vihar Kurama in November 2022. An early
      private repository gathered feedback from a small user community before the
      project made its open-source debut in early 2023.
    - >
      The project began as a lightweight issue, cycle, and module tracker, then expanded
      into a broader work-management platform with pages, wikis, intake, analytics,
      integrations, APIs, and hosted and self-hosted editions.
  related-projects:
    - >
      The official ecosystem includes Plane Cloud, Plane Community Edition, developer
      APIs, webhooks, an MCP server, mobile clients, and self-hosting distributions for
      Docker and Kubernetes.
  sources:
    - https://developers.plane.so/
    - https://docs.plane.so/
    - https://github.com/makeplane/plane
    - https://plane.so/about
    - https://plane.so/blog/how-we-got-to-20k-github-stars
    - >
      https://plane.so/blog/introducing-plane-simple-extensible-open-source-project-management-tool
    - https://plane.so/blog/plane-raises-4m-seed
  summary:
    - >
      Plane is an open-source project and work-management platform for organizing work
      items, cycles, modules, roadmaps, documentation, and team workflows.
  timeline:
    - '2022-11: Plane was founded and began gathering users around a private repository.'
    - '2023-01: Plane was publicly introduced as an open-source project-management tool.'
    - >
      2023: The project reported rapid GitHub adoption and introduced its first
      commercial self-hosted offering.
  usage:
    - >
      Teams use Plane to track work items, plan cycles and modules, maintain project
      documentation, publish updates, and coordinate product or operational work. The
      service can be used through Plane Cloud or a self-hosted deployment, while
      Plane.app provides the native desktop surface.
