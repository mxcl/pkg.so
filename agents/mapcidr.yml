history:
  adoption-history:
    - >
      mapcidr is distributed through Go install, Homebrew, and other package-manager
      channels. Its adoption is tied to ProjectDiscovery's security tooling ecosystem,
      where CIDR expansion and splitting are common preparation steps for scanning and
      reconnaissance.
  package-nerd-significance:
    - >
      mapcidr is useful package-manager glue for operators who need predictable,
      scriptable IP range transformations before passing targets into scanners, probes,
      or asset-inventory tools.
  project-history:
    - >
      The public repository was created in August 2020. The README says mapCIDR was
      developed to ease load distribution for mass scanning operations and can be used
      both as an independent CLI and as a Go library.
  related-projects:
    - >
      ProjectDiscovery maintains mapcidr as part of its broader open-source security
      tooling ecosystem.
  sources:
    - https://github.com/projectdiscovery/mapcidr
    - https://github.com/projectdiscovery/mapcidr#readme
    - https://github.com/projectdiscovery/mapcidr/releases/tag/v1.1.97
  summary:
    - >
      mapcidr is a ProjectDiscovery Go utility and library for subnet and CIDR
      operations, including expansion, slicing, aggregation, matching, filtering,
      sorting, and IP format conversion.
  timeline:
    - '2020: Public GitHub repository created.'
    - '2024: v1.1.34 release published.'
    - '2025: v1.1.97 release published.'
  usage:
    - >
      Common uses include expanding CIDR ranges to IP lists, slicing large ranges into
      smaller blocks by CIDR or host count, aggregating IPs back into minimal subnets,
      filtering or matching IPs, sorting ranges, shuffling IP or IP:port input, and
      converting IPv4/IPv6 formats.
related-packages:
  - id: brew:naabu
    reason: >
      Use mapCIDR to expand, filter, or split address ranges for load distribution, then
      pass the resulting IP/CIDR targets to Naabu for port discovery.
    rel: adjacent_workflow
    sources:
      - https://github.com/projectdiscovery/mapcidr
      - https://github.com/projectdiscovery/naabu
