  - https://docs.nvidia.com/nsight-compute/NsightCompute
  - https://docs.nvidia.com/nsight-compute/NsightComputeCli
config-file-location:
  linux:
    - ./config.ncu-cfg
    - ~/.config/NVIDIA Corporation/config.ncu-cfg
  windows:
    - .\config.ncu-cfg
    - '%APPDATA%\NVIDIA Corporation\config.ncu-cfg'
credentials-file-location: null
history:
  adoption-history:
    - >
      NVIDIA distributes Nsight Compute both independently and within the CUDA Toolkit.
      NVIDIA subsequently directed nvprof and Visual Profiler users toward Nsight
      Compute and Nsight Systems as successor profiling tools.
  package-nerd-significance:
    - >
      Its relationship to CUDA Toolkit releases makes it part of the broader GPU
      development toolchain. The separate GUI and command-line workflows support
      collecting detailed kernel measurements and inspecting or processing reports
      elsewhere.
  project-history:
    - >
      NVIDIA's release history dates Nsight Compute 1.0 to September 19, 2018, alongside
      CUDA Toolkit 10.0. The tool focuses on detailed GPU kernel metrics and CUDA API
      inspection.
  related-projects:
    - >
      Nsight Systems provides application-wide analysis; Nsight Compute examines
      individual compute kernels. Both belong to NVIDIA's Nsight tool family.
  sources:
    - https://developer.nvidia.com/blog/nvidia-announces-nsight-systems-2019-5/
    - https://developer.nvidia.com/nsight-compute
    - https://developer.nvidia.com/nsight-compute-history
    - https://docs.nvidia.com/nsight-compute/
  summary:
    - NVIDIA Nsight Compute is a kernel-level profiler for CUDA and NVIDIA OptiX applications.
  timeline:
    - '2018: Nsight Compute 1.0 released alongside CUDA Toolkit 10.0.'
    - >
      2019: NVIDIA identified Nsight Compute and Nsight Systems as successors to nvprof
      and Visual Profiler.
  usage:
    - >
      Collect kernel performance metrics, correlate results with source code, compare
      baselines, and use guided analysis to investigate GPU bottlenecks. The GUI and CLI
      support complementary interactive and automated workflows.
tags:
  - cuda
