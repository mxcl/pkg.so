history:
  adoption-history:
    - >
      PDFpen established the Mac product lineage before Nitro acquired the technology.
      Nitro subsequently provided migration tooling for PDFpen and PDFpenPro customers,
      including migration of libraries, preferences, and registration data, preserving
      continuity for existing users.
  package-nerd-significance:
    - >
      The package is notable in Mac software history because its cask spans a vendor and
      brand transition from Smile's PDFpen family to Nitro PDF Pro. It provides a
      script-installable commercial alternative to Acrobat while retaining Mac-specific
      automation and document-workflow features.
  project-history:
    - >
      The Mac application originated in Smile's PDFpen family of PDF productivity
      software. Nitro completed its acquisition of PDFpen in July 2021, extending
      Nitro's PDF product line to Mac, iPad, and iPhone. The Mac software subsequently
      continued under the Nitro PDF Pro name.
  related-projects:
    - >
      PDFpen and PDFpenPro are the direct predecessors of Nitro PDF Pro for Mac. Nitro
      Sign supplies connected electronic-signature workflows, while Nitro PDF Pro for
      Windows is the related Windows product.
  sources:
    - 'Official Mac product page: https://www.gonitro.com/pdf/pdf-pro/mac'
    - 'Official Mac user guide: https://www.gonitro.com/user-guide/nitro-pdf-for-mac'
    - >
      Official Nitro acquisition announcement:
      https://www.gonitro.com/about/press/nitro-announces-completion-of-pdfpen-acquisition
    - 'Official PDFpen migration page: https://www.gonitro.com/pdfpen'
  summary:
    - >
      Nitro PDF Pro is a commercial PDF editor for macOS descended from the PDFpen
      product family. It supports reading, creating, editing, converting, annotating,
      OCR-processing, securing, and signing PDF documents.
  timeline:
    - >
      2021: Nitro acquired the PDFpen technology from Smile and completed the
      acquisition in July.
    - >
      After the acquisition: The Mac product continued under the Nitro PDF Pro name,
      with migration tooling offered to PDFpen users.
  usage:
    - >
      Users edit PDF text and images, annotate or combine documents, fill and create
      forms, perform OCR, redact content, convert PDFs to other formats, apply
      signatures, and automate work with AppleScript or JavaScript.
