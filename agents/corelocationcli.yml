history:
  adoption-history:
    - >
      The project is distributed as a macOS application and command-line utility and
      documents Homebrew installation, making Core Location data readily composable in
      shell scripts without requiring developers to write a native application.
  package-nerd-significance:
    - >
      CoreLocationCLI is a characteristically Unix-oriented wrapper around a
      platform-native macOS framework: it converts Core Location readings into plain
      text, formatted output, or JSON suitable for pipelines, tests, logging, and
      automation.
  project-history:
    - >
      CoreLocationCLI was created as a small, focused interface to Apple's Core Location
      framework. The maintainer's official project-scope note says it is intentionally
      meant to be composed with other tools or used directly for testing and logging.
  related-projects:
    - >
      Apple Core Location: the operating-system framework from which the utility obtains
      location data.
  sources:
    - https://github.com/fulldecent/corelocationcli
  summary:
    - >
      CoreLocationCLI is a macOS command-line utility that reports the device's location
      and optional reverse-geocoded details through text, custom formats, or JSON.
  timeline:
    - >
      Ongoing project: Maintained as a deliberately small Core Location command-line
      interface with Homebrew installation support.
  usage:
    - >
      Run the command once for the current latitude and longitude, use watch mode for
      continuing updates, select JSON for machine-readable output, or construct a format
      string containing coordinates, accuracy, movement, address, region, and time-zone
      fields. Wi-Fi generally needs to be enabled for macOS location resolution.
