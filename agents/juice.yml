id: cask:juice
display-name: Juice
repo: null
docs:
  - https://github.com/brianmichel/Juice#readme
config-file-location:
  macos:
    - ~/Library/Containers/com.bsm.macos.Juice/Data/Library/Application Support/Juice/*.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Juice was distributed as an open-source macOS application and through published
      binary releases. Its principal release series dates from late 2016 through 2017,
      with a 1.0.1 release in June 2017.
  package-nerd-significance:
    - >
      Juice appeals to Mac utility enthusiasts because it turns otherwise mundane
      battery telemetry into a user-programmable menu-bar display. Its simple plist
      scale format is a compact example of a desktop application exposing customization
      as user-editable data.
  project-history:
    - >
      Brian Michel created Juice after seeing a custom battery-display idea and
      investigating the battery information and change notifications exposed by Apple's
      IOKit framework.
    - >
      The project introduced a plist-based scale format so users could map
      battery-charge ranges to their own text or symbols.
  related-projects:
    - Apple IOKit
    - macOS menu-bar utilities
    - Apple Juice
  sources:
    - https://github.com/brianmichel/Juice
    - https://github.com/brianmichel/Juice/releases
  summary:
    - >
      Juice is an open-source macOS menu-bar utility that replaces a conventional
      battery indicator with customizable text scales.
  timeline:
    - "2016-12: The project's published release series began."
    - '2017-06: Juice 1.0.1 was released with additional scale content and a minor correction.'
  usage:
    - >
      Users select a supplied battery scale or create a plist defining a default value,
      ten charge-range detents, and a title. Custom plist files can be added through the
      preferences interface or placed in Juice's application-support directory.
tags:
