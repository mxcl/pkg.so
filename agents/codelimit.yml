id: brew:codelimit
display-name: Code Limit
repo: https://github.com/getcodelimit/codelimit
docs:
  - https://getcodelimit.github.io/codelimit
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears niche but real: Homebrew distributes it as the codelimit formula,
      and the project publishes frequent 0.x releases. Homebrew analytics for the
      formula showed hundreds of installs over the prior year when checked for this
      enrichment run.
  package-nerd-significance:
    - >
      For package-manager users, Code Limit is notable as a narrow, packaged
      code-quality tool in the same ecosystem as formatters, linters, and pre-commit
      helpers. Its appeal is the Unix-friendly single-command workflow rather than
      ecosystem scale.
  project-history:
    - >
      The project was created in 2022 by Rob van der Leek under the getcodelimit GitHub
      organization. Its README positions the tool around maintainability workflows
      rather than general linting, with standalone, pre-commit, and GitHub Action usage
      documented.
  related-projects:
    - >
      Related tools include pre-commit for local hooks, Ruff and Black as Python
      code-quality tools used in the project, and general complexity or maintainability
      analyzers that gate refactoring work.
  sources:
    - https://github.com/getcodelimit/codelimit
    - https://getcodelimit.github.io
    - https://formulae.brew.sh/api/formula/codelimit.json
  summary:
    - >
      Code Limit is a small Python developer tool that describes itself as a refactoring
      alarm: it scans a codebase and warns when code has grown complex enough to merit
      refactoring.
  timeline:
    - '2022: Project copyright and public repository lineage begin.'
    - '2022: Tool is documented for standalone, pre-commit, and GitHub Action workflows.'
    - '2025: v0.21.0 release published on GitHub.'
    - '2026: Homebrew formula distributes codelimit 0.21.0.'
  usage:
    - >
      Users run the codelimit executable directly, wire it into pre-commit, or use it in
      CI to produce maintainability checks and badges. The project emphasizes low setup
      effort and documents configuration only for exceptions to its zero-configuration
      default.
related-packages:
  - id: brew:pre-commit
    reason: >
      Code Limit publishes a pre-commit hook, so pre-commit can run its refactoring
      checks automatically before changes are committed.
    rel: adjacent_workflow
    sources:
      - https://github.com/getcodelimit/codelimit
      - https://pre-commit.com/
