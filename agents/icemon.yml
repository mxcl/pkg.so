history:
  adoption-history:
    - >
      Icemon's adoption follows Icecream's adoption: users install it when they need a
      live visual overview of a compile cluster rather than only logs or scheduler
      status. The Icecream README recommends installing Icemon or icecream-sundae with
      Icecream.
    - >
      The package is niche but useful in distribution workflows because it gives an
      immediate picture of which machines are compiling, idle, or unreachable.
  package-nerd-significance:
    - >
      Icemon is package-nerd significant as a small observability sidecar for a build
      accelerator. It is not essential to compile with Icecream, but it makes the
      invisible scheduler/daemon traffic legible.
    - >
      Its separate package identity also shows a common Unix packaging pattern: keep the
      daemon/client tools in one package and the graphical monitor in another.
  project-history:
    - >
      The repository describes Icemon as an Icecream GUI monitor and lists Kevin Funk as
      maintainer. The project is closely tied to Icecream packaging because its build
      instructions require the Icecream development package and its purpose is to
      observe an Icecream network.
    - >
      Maintainer posts show the 3.x series becoming public in 2015, followed by bug-fix
      and minor releases in 2016, 2017, and 2018. The GitHub repository records a 3.3
      release in 2019.
  related-projects:
    - Icecream is the distributed compiler system that Icemon monitors.
    - >
      icecream-sundae is a command-line monitor alternative referenced by Icecream
      documentation.
    - distcc is the older distributed-compilation project behind Icecream's lineage.
  sources:
    - https://formulae.brew.sh/formula/icemon
    - https://github.com/icecc/icecream
    - https://github.com/icecc/icemon
    - https://github.com/icecc/icemon/releases
    - https://kfunk.org/tag/icemon/
  summary:
    - >
      Icemon is the graphical monitor for Icecream compile networks. It is a companion
      package rather than a compiler tool: it visualizes scheduler and daemon activity
      so users can see how an Icecream cluster is distributing build work.
  timeline:
    - '2015: Icemon 3.0 was announced publicly by maintainer Kevin Funk.'
    - '2016: Icemon 3.0.1 followed as a patch release.'
    - '2017: Icemon 3.1.0 added bug fixes and small feature work.'
    - '2018: Icemon 3.2.0 addressed scheduler discovery problems with newer Icecream releases.'
    - '2019: The GitHub repository lists release 3.3.'
  usage:
    - >
      After installing the Icecream development pieces and Qt/CMake build dependencies,
      users run `icemon` to connect to an Icecream scheduler and display compile-network
      activity.
    - >
      It is most useful while tuning a local network build setup, checking whether
      workers are discovered, or explaining why a distributed build is not using
      expected hosts.
related-packages:
  - id: brew:icecream
    reason: >
      Icecream supplies the scheduler, compiler wrapper, and workers whose live activity
      Icemon is specifically designed to display.
    rel: adjacent_workflow
    sources:
      - https://github.com/icecc/icemon#readme
      - https://github.com/icecc/icecream/blob/master/doc/icecream.adoc
