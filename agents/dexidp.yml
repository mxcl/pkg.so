credentials-file-location: null
history:
  adoption-history:
    - >
      Dex adoption has been strongest around Kubernetes and cloud-native infrastructure.
      Its own adopters list includes companies and projects using it for Kubernetes API
      authentication, SSO for web UIs, and integration into platforms such as Argo CD,
      Kubeflow, Kyma, and sigstore.
  package-nerd-significance:
    - >
      For package maintainers, Dex is a security-sensitive Go service rather than a
      small CLI utility: packaging needs to preserve the server binary, example
      configuration workflow, release-note tracking, and the operational expectation
      that deployments will supply their own connectors, storage, and TLS settings.
  project-history:
    - >
      The official release stream begins with v0.1.0 in 2015 and continues through the
      2.x series. The project presents itself as an identity service built around OpenID
      Connect ID tokens, with configuration and connector support aimed at production
      deployment rather than only local development.
  related-projects:
    - >
      Dex is commonly paired with Kubernetes OIDC authentication, kubelogin, OAuth2
      Proxy-style protected web UIs, and upstream identity providers reached through its
      connector system.
  sources:
    - https://github.com/dexidp/dex#readme
    - https://github.com/dexidp/dex/blob/master/ADOPTERS.md
    - https://github.com/dexidp/dex/tags
    - https://github.com/dexidp/dex/blob/master/config.yaml.dist
    - https://github.com/dexidp/dex/blob/master/cmd/dex/serve.go
    - https://dexidp.io/docs/
  summary:
    - >
      Dex is an OpenID Connect identity provider used as a federation layer between
      client applications and upstream identity systems such as LDAP, SAML, GitHub,
      Google, and Active Directory.
  timeline:
    - '2015: v0.1.0 appears in the official tag history.'
    - '2020: the official configuration documentation page is dated January 2020.'
    - '2026: the 2.x release series remains active in the official tags.'
  usage:
    - >
      Operators usually run Dex as a service with a YAML configuration file and
      configure one or more connectors for upstream authentication. Client applications
      then speak OpenID Connect to Dex instead of implementing every backend identity
      protocol themselves.
related-packages:
  - id: brew:kubelogin
    reason: >
      Dex provides an official guide for using kubelogin as the Kubernetes
      exec-credential helper that obtains OIDC tokens from a Dex deployment.
    rel: adjacent_workflow
    sources:
      - https://dexidp.io/docs/guides/kubelogin-activedirectory/
      - https://github.com/int128/kubelogin#readme
  - id: brew:kubernetes-cli
    reason: >
      kubectl is the client used after a Kubernetes API server is configured to trust
      Dex-issued ID tokens, as demonstrated by Dex's official Kubernetes authentication
      guide.
    rel: adjacent_workflow
    sources:
      - https://dexidp.io/docs/guides/kubernetes/
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:oauth2_proxy
    reason: >
      OAuth2 Proxy can protect upstream web applications using its generic OpenID
      Connect provider, with Dex serving as the OIDC identity service.
    rel: adjacent_workflow
    sources:
      - https://dexidp.io/docs/
      - https://oauth2-proxy.github.io/oauth2-proxy/configuration/providers/
