id: brew:bitbucket-cli
display-name: Bitbucket CLI
repo: null
docs:
  - https://github.com/avivsinai/bitbucket-cli/blob/master/README.md
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/bkt/config.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through multiple package ecosystems, including
      Homebrew, WinGet, Debian-family packaging, Alpine, and Nix, according to the
      supplied package-manager metadata. Its structured JSON and YAML output also
      targets scripts, CI systems, and coding agents.
  package-nerd-significance:
    - >
      It brings a gh-style workflow to both Bitbucket Cloud and self-hosted Bitbucket
      Data Center, filling a cross-hosting gap for developers who want one
      automation-oriented command surface.
  project-history:
    - >
      Bitbucket CLI was developed as a standalone command-line client named `bkt`. It
      supports both Bitbucket Cloud and Data Center and emphasizes predictable
      structured output for automation.
  related-projects:
    - Bitbucket Cloud
    - Bitbucket Data Center
    - GitHub CLI
  sources:
    - https://github.com/avivsinai/bitbucket-cli/blob/master/README.md
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      Bitbucket CLI, invoked as `bkt`, is an automation-oriented client for repository,
      pull-request, issue, pipeline, permission, and webhook workflows across Bitbucket
      Cloud and Data Center.
  timeline:
    - >
      Current generation: Supports Bitbucket Cloud and Data Center, package-manager
      installation, structured output, and headless environment-variable authentication.
  usage:
    - >
      Users authenticate with OAuth or API tokens, create a context for a Cloud
      workspace or Data Center project, and then operate on repositories and pull
      requests. Headless jobs can instead provide host and token settings through
      environment variables.
related-packages:
  - id: brew:git
    reason: >
      Use Git for local commits, branches, and remotes, then use `bkt` for the
      associated Bitbucket pull requests, repository administration, pipelines, and API
      operations.
    rel: adjacent_workflow
    sources:
      - https://github.com/avivsinai/bitbucket-cli
      - https://git-scm.com/docs
  - id: brew:gh
    reason: >
      GitHub CLI is the closest first-party-style alternative when repositories are
      hosted on GitHub rather than Bitbucket, and `bkt` explicitly models its ergonomics
      on `gh`.
    rel: alternative
    sources:
      - https://github.com/avivsinai/bitbucket-cli
      - https://cli.github.com/manual/
  - id: brew:glab
    reason: >
      Choose GLab for analogous merge-request, issue, and CI workflows on GitLab.com or
      self-managed GitLab instead of Bitbucket.
    rel: alternative
    sources:
      - https://github.com/avivsinai/bitbucket-cli
      - https://docs.gitlab.com/cli/
