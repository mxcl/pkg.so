id: brew:mongocli
display-name: MongoDB CLI
repo: null
docs:
  - https://www.mongodb.com/docs/mongocli/current
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/mongocli/config.toml
    - ~/.config/mongocli/config.toml
  macos:
    - /Users/{username}/Library/Application Support/mongocli/config.toml
  windows:
    - '%AppData%\mongocli\config.toml'
credentials-file-location:
  linux:
    - $XDG_CONFIG_HOME/mongocli/config.toml
    - ~/.config/mongocli/config.toml
  macos:
    - /Users/{username}/Library/Application Support/mongocli/config.toml
  windows:
    - '%AppData%\mongocli\config.toml'
history:
  project-history:
    - >
      The tool's role narrowed after MongoDB separated Atlas administration into the
      Atlas CLI. MongoDB CLI 2.0.0, released on 2024-03-14, fully deprecated mongocli
      atlas commands and directed users to migrate Atlas workflows to the Atlas CLI.
      That leaves mongocli primarily in the Ops Manager and Cloud Manager niche:
      automation, alerts, backups, clusters, agents, logs, maintenance windows, metrics,
      processes, and security settings for managed MongoDB deployments outside the
      dedicated Atlas CLI path.
  sources:
    - https://formulae.brew.sh/formula/mongocli
    - https://github.com/mongodb/mongodb-cli
    - https://www.mongodb.com/docs/mongocli/current/command/mongocli-ops-manager/
    - https://www.mongodb.com/docs/mongocli/current/release-notes/
    - https://www.mongodb.com/try/download/mongocli
  summary:
    - >
      MongoDB CLI, invoked as mongocli, was built by MongoDB as a terminal interface for
      MongoDB management services. Its repository describes it as a modern command-line
      interface for managing MongoDB services from the terminal, with simple one-line
      commands for Ops Manager and Cloud Manager automation.
  usage:
    - >
      Homebrew and MacPorts package it as a single mongocli executable for
      administrators and CI jobs that need scripted access to Cloud Manager or Ops
      Manager without using the web UI.
related-packages:
  - id: brew:mongodb-atlas-cli
    reason: >
      Choose Atlas CLI for Atlas administration because MongoDB deprecated mongocli's
      Atlas commands and provides an official profile-and-key migration path.
    rel: alternative
    sources:
      - https://www.mongodb.com/docs/atlas/cli/current/migrate-to-atlas-cli/
      - https://www.mongodb.com/docs/mongocli/current/release-notes/
