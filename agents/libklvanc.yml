history:
  adoption-history:
    - >
      The project is packaged by Homebrew and is optionally integrated by FFmpeg's
      DeckLink support for handling VANC-related data and captions.
  package-nerd-significance:
    - >
      libklvanc packages specialized broadcast-engineering logic that would otherwise
      require implementing several SMPTE and SCTE ancillary-data formats directly. Its
      support for both Autotools and Meson also makes it notable to build-system and
      multimedia-stack maintainers.
  project-history:
    - >
      Developed as an LGPL-licensed VANC processing framework, libklvanc accumulated
      parsers and generators for closed captions, Active Format Description, SCTE-104
      triggers, SMPTE ST 2038 data, timecodes, subtitles, and HDR/WCG signaling.
  related-projects:
    - klvanc-tools applies libklvanc to real SDI capture workflows with Blackmagic hardware.
    - FFmpeg can use libklvanc in its DeckLink input and output implementation.
  sources:
    - 'Input package metadata: source_facts.package-manager'
    - >
      Official FFmpeg source:
      https://github.com/FFmpeg/FFmpeg/blob/master/libavdevice/decklink_enc.cpp
    - 'Official project README: https://github.com/stoth68000/libklvanc#readme'
    - 'Official related project: https://github.com/stoth68000/klvanc-tools'
  summary:
    - >
      libklvanc is a C library for parsing and generating Vertical Ancillary Data
      carried in professional SDI video. It targets broadcast workflows rather than
      general-purpose media-file metadata.
  timeline:
    - >
      The project developed support for multiple SMPTE and SCTE VANC payload formats and
      both Autotools and Meson builds.
    - >
      The library was adopted as an optional component of FFmpeg's DeckLink integration
      and distributed through Homebrew.
  usage:
    - >
      Applications use the library to decode VANC captured from SDI or generate
      correctly framed VANC for SDI output, including checksums and format-specific edge
      cases. The repository includes sample tools and tests; API documentation is
      generated locally with Doxygen.
