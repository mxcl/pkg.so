history:
  adoption-history:
    - >
      TrainerRoad expanded from desktop indoor-training software to applications for
      macOS, Windows, iOS, and Android, allowing athletes to follow structured training
      across computers and mobile devices.
    - >
      Its training platform grew beyond workout control to include planning, performance
      analysis, outdoor workouts, and Adaptive Training, which adjusts recommendations
      using completed-workout data and athlete feedback.
  package-nerd-significance:
    - >
      TrainerRoad illustrates a common package-manager boundary for subscription
      software: the cask automates installation of the native client, while athlete
      history, plans, analytics, and recommendations belong to the hosted account-backed
      service.
  project-history:
    - >
      TrainerRoad originated after Nate Pearson began attending cycling classes led by
      coach Chad Timmerman. Pearson built software to run cycling workouts and later
      combined the application with Timmerman's workouts and training plans, an origin
      Pearson confirmed on TrainerRoad's official forum.
    - >
      The company subsequently developed a data-informed training platform. Its official
      material describes using accumulated workout outcomes to refine plans, and
      Adaptive Training extended that approach with individualized workout
      recommendations.
  related-projects:
    - Adaptive Training
    - Ask a Cycling Coach podcast
    - TrainerRoad Forum
  sources:
    - https://support.trainerroad.com/
    - https://www.trainerroad.com/
    - https://www.trainerroad.com/blog/adaptive-training-live-qa-ask-a-cycling-coach-338/
    - https://www.trainerroad.com/forum/t/how-did-trainerroad-get-started/4541/4
    - source_facts.description
  summary:
    - >
      TrainerRoad is an account-backed cycling-training platform offering structured
      workouts, training plans, analytics, and adaptive recommendations through desktop
      and mobile applications.
  timeline:
    - "2011: TrainerRoad's official support-site copyright history begins."
    - >
      2018: Co-founder Nate Pearson publicly confirmed TrainerRoad's origin story on the
      official forum.
    - '2021: TrainerRoad publicly launched Adaptive Training after a staged beta.'
  usage:
    - >
      Cyclists sign in, select or build a training plan, pair supported trainers, power
      meters, or sensors, and complete scheduled indoor or outdoor workouts. Workout
      performance and athlete feedback inform subsequent training recommendations.
