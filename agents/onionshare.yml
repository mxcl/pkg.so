id: cask:onionshare
display-name: OnionShare
repo: https://github.com/onionshare/onionshare
docs:
  - https://docs.onionshare.org/
config-file-location:
  linux:
    - ~/.config/onionshare/onionshare.json
  macos:
    - ~/Library/Application Support/OnionShare/onionshare.json
  windows:
    - '%APPDATA%\OnionShare\onionshare.json'
credentials-file-location:
  linux:
    - ~/.config/onionshare/persistent/*.json
  macos:
    - ~/Library/Application Support/OnionShare/persistent/*.json
  windows:
    - '%APPDATA%\OnionShare\persistent\*.json'
history:
  adoption-history:
    - >
      OnionShare grew from a file-sharing utility into a cross-platform Tor application
      with desktop and command-line interfaces. Its official packaging includes Windows
      and macOS downloads, Homebrew Cask, Flatpak, Snap, and distribution-oriented Linux
      workflows.
  package-nerd-significance:
    - >
      OnionShare turns Tor onion-service primitives into an installable end-user
      application. Its packaging is unusually interesting because releases bundle or
      integrate Tor and pluggable transports while spanning Python, Qt, desktop signing,
      Linux sandbox formats, and multiple CPU architectures.
  project-history:
    - >
      OnionShare began as a focused way to share files through ephemeral Tor onion
      services. Its early releases added cross-platform graphical installers, a native
      Qt interface, human-readable secret URLs, bridges, persistent URLs, and a
      standalone Tor connection.
    - >
      The 2.x series broadened the application beyond sending files: receive mode
      arrived in 2.0, website publishing in 2.2, and anonymous chat plus persistent
      multi-tab services in 2.3. Later releases added onion client authentication,
      censorship-circumvention features, accessibility improvements, and more automated
      packaging.
  related-projects:
    - >
      The Tor network and Tor Browser provide the onion-service and recipient-access
      foundations used by OnionShare.
    - >
      Flatpak, Snap, and Homebrew Cask are official distribution channels or documented
      installation methods for the desktop application.
  sources:
    - https://docs.onionshare.org/
    - https://docs.onionshare.org/2.6.3/en/advanced.html
    - https://github.com/onionshare/onionshare
    - https://github.com/onionshare/onionshare/blob/main/CHANGELOG.md
    - https://onionshare.org/
  summary:
    - >
      OnionShare is an open-source, cross-platform application for sharing and receiving
      files, publishing websites, and chatting through Tor onion services without
      requiring a conventional third-party hosting service.
  timeline:
    - >
      2014: Early public releases provided a cross-platform GUI and packaged Linux,
      Windows, and macOS builds.
    - >
      1.0: The project standardized on ephemeral Tor onion services and expanded Tor
      connection settings.
    - '2.0: Receive mode and next-generation onion-service support were added.'
    - '2.2: Website publishing mode was introduced.'
    - >
      2.3: Anonymous chat, multiple tabs, persistent services, Flatpak, and Snap
      packaging were added.
    - '2.6: Automatic censorship circumvention and updated bridge handling were introduced.'
  usage:
    - >
      A sender starts a local OnionShare service and gives its unguessable onion address
      and any required private key to intended recipients, who normally open it through
      Tor Browser. Services can share files, accept uploads and messages, publish static
      content, or host an anonymous chat.
    - >
      Saved tabs can retain an onion identity between sessions. Their JSON files contain
      the onion-service private key and client-authentication material, so the
      documented persistent-data directory must be protected and migrated carefully.
