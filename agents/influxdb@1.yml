id: brew:influxdb@1
display-name: InfluxDB 1.x
repo: null
docs:
  - https://docs.influxdata.com/influxdb/v1
  - https://docs.influxdata.com/influxdb/v1/administration/config
config-file-location:
  linux:
    - /etc/influxdb/influxdb.conf
  macos:
    - /usr/local/etc/influxdb.conf
  windows:
    - Same directory as influxd.exe
credentials-file-location: null
history:
  adoption-history:
    - >
      By the 1.0 announcement, InfluxData reported tens of thousands of organizations
      using InfluxDB for network infrastructure, security, containers, solar,
      agriculture, science, user analytics, business intelligence, and home automation.
      The same post tied InfluxDB to the broader TICK stack with Telegraf for collection
      and Kapacitor for processing and alerting.
    - >
      The 1.x line remained important after 2.x work began because many deployments
      depended on InfluxQL, existing line-protocol ingest paths, and stable TSM data
      files. InfluxDB 1.8 later added production-ready Flux support and 2.0-compatible
      API endpoints, giving 1.x installations a migration bridge.
  package-nerd-significance:
    - >
      InfluxDB 1.x is a classic package-manager case: a fast-moving infrastructure
      database that became important enough to need major-version formulae. It also
      represents the Go-era shift toward single-purpose infrastructure daemons with
      strong CLI and HTTP surfaces.
    - >
      For package nerds, it sits at the center of an ecosystem rather than being just a
      daemon: Telegraf, Kapacitor, Chronograf, client libraries, and distro packages all
      orbit the same line-protocol and time-series storage conventions.
  project-history:
    - >
      InfluxDB grew out of Errplane, a monitoring SaaS company whose founders repeatedly
      needed a database designed for irregular time-series events. Paul Dix's
      retrospective says the open source database idea was validated by monitoring and
      DevOps users at Monitorama in September 2013, after earlier experiments with
      Cassandra, Redis, OpenTSDB, Graphite, and RRD did not match their requirements.
    - >
      The 1.0 release in 2016 marked the point where InfluxData committed to stable 1.x
      APIs and storage compatibility. That mattered because pre-1.0 releases moved
      quickly and sometimes broke interfaces; 1.x gave operators a predictable base for
      metrics, monitoring, and IoT data stores.
  related-projects:
    - >
      Related projects include Telegraf, Kapacitor, Chronograf, InfluxDB Enterprise,
      InfluxDB Cloud, Flux, OpenTSDB, Graphite, and RRD.
  sources:
    - https://docs.influxdata.com/influxdb/v1
    - https://github.com/influxdata/influxdb
    - https://www.influxdata.com/blog/influxdb-1-0-ga-released-a-retrospective-and-whats-next/
    - >
      https://www.influxdata.com/blog/release-announcement-influxdb-with-long-awaited-features/
  summary:
    - >
      InfluxDB 1.x is the original stable line of InfluxData's open source time-series
      database, packaged for operators who need the 1.x HTTP API, InfluxQL, line
      protocol, and TSM storage behavior.
  timeline:
    - >
      2013: InfluxDB began after Errplane's monitoring work and Monitorama feedback
      pointed to demand for an open source time-series database.
    - >
      2014: InfluxData raised Series A funding to accelerate the database and company
      around it.
    - >
      2016: InfluxDB 1.0 and InfluxDB Enterprise reached general availability with 1.x
      API and storage compatibility promises.
    - >
      2020: InfluxDB 1.8 added production-ready Flux support and 2.0 API compatibility
      endpoints.
  usage:
    - >
      The Homebrew package installs server and utility binaries such as `influxd`,
      `influx`, `influx_inspect`, and `influx_tools`. It is used as a local time-series
      daemon, a development database for metrics-heavy applications, or a compatibility
      target for systems written around the 1.x API.
    - >
      Package users care about the `@1` suffix because InfluxDB's major versions carry
      different operational models. Keeping 1.x separately installable avoids forcing a
      database and client migration when an application only needs the established 1.x
      server.
related-packages:
  - id: brew:telegraf
    reason: >
      Telegraf is the TICK stack collector that gathers metrics and writes them into
      InfluxDB 1.x.
    rel: adjacent_workflow
    sources:
      - https://docs.influxdata.com/platform/
      - https://docs.influxdata.com/platform/getting-started/
  - id: brew:chronograf
    reason: >
      Chronograf connects to InfluxDB 1.x to provide data exploration, dashboards,
      infrastructure monitoring, and alert management.
    rel: adjacent_workflow
    sources:
      - https://docs.influxdata.com/chronograf/v1/
      - https://docs.influxdata.com/chronograf/v1/administration/creating-connections/
  - id: brew:kapacitor
    reason: >
      Kapacitor consumes InfluxDB streams or queries batches from InfluxDB to transform
      data and trigger alerts.
    rel: adjacent_workflow
    sources:
      - https://docs.influxdata.com/kapacitor/v1/introduction/getting-started/
      - https://docs.influxdata.com/platform/getting-started/
