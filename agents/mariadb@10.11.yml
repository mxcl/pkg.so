    - '%MYSQL_HOME%\my.cnf'
history:
  adoption-history:
    - >
      The 10.11 branch became important because it gave operators a late 10.x LTS line
      at a time when MariaDB was moving toward new 11.x release trains. Users with
      MySQL-compatible applications, distro packaging, or replication topologies could
      choose 10.11 for stability while delaying larger behavioral changes.
    - >
      MariaDB's broader adoption came through Linux distribution defaults, cloud
      offerings, container usage, and the project's promise of MySQL compatibility. A
      versioned formula gives Homebrew users the same kind of controlled branch choice
      that server administrators expect from distribution repositories.
  package-nerd-significance:
    - >
      Versioned database formulae are about compatibility, not novelty. Pinning
      mariadb@10.11 lets package users keep a known server ABI, client-tool behavior,
      dump format, authentication behavior, and SQL feature set while the unversioned
      formula advances.
    - >
      MariaDB 10.11 is especially significant as an LTS bridge: old enough to remain in
      the 10.x family, but supported long enough to be a practical target for
      conservative applications and migration planning.
  project-history:
    - >
      MariaDB itself began in 2009 as a community fork of MySQL, with the first 5.1.38
      release on 29 October 2009. The server kept MySQL compatibility while developing
      an independent release stream, public GitHub-hosted source tree, and MariaDB
      Foundation governance.
    - >
      MariaDB 10.11 was announced by MariaDB as an LTS line before GA. Its 10.11.2
      release notes identify 16 February 2023 as the Stable GA release date and describe
      10.11 as an evolution of MariaDB 10.10 with new features and maintenance until
      February 2028.
  related-projects:
    - MariaDB 10.6 is the earlier 10.x LTS line.
    - MariaDB 11.4 and 11.8 are later LTS branches for users moving into the 11.x generation.
    - >
      MariaDB Connector/C supplies the C client library used by many applications
      connecting to 10.11 servers.
  sources:
    - https://mariadb.com/docs/release-notes/community-server/10.11/10.11.2
    - >
      https://mariadb.com/docs/server/clients-and-utilities/server-client-software/download/getting-the-mariadb-source-code
    - >
      https://mariadb.com/docs/server/server-management/install-and-upgrade-mariadb/configuring-mariadb/configuring-mariadb-with-option-files
    - https://mariadb.org/about/
    - https://mariadb.org/download/
    - https://mariadb.org/mariadb-10-11-is-lts/
    - https://mariadb.org/mariadb-server-turns-fifteen/
  summary:
    - >
      MariaDB 10.11 is a long-term-maintenance MariaDB Server line. The Homebrew
      mariadb@10.11 formula matters to users who need a stable, older LTS branch for
      application compatibility, replication compatibility, or conservative upgrade
      windows.
  timeline:
    - '2009: MariaDB began as a community fork of MySQL.'
    - '2009: MariaDB 5.1.38 was released on 29 October 2009.'
    - '2022: MariaDB Foundation announced MariaDB 10.11 as an LTS line.'
    - '2023: MariaDB 10.11.2 became Stable GA on 16 February 2023.'
    - '2026: MariaDB Foundation continued to list 10.11 among current long-term release lines.'
    - '2028: MariaDB 10.11 maintenance is scheduled through February 2028.'
  usage:
    - >
      Use mariadb@10.11 when local development or CI must match a production MariaDB
      10.11 deployment, when plugins or dumps are tested against the 10.11 LTS line, or
      when an application has not yet certified a newer MariaDB series.
    - >
      Configuration follows MariaDB's normal my.cnf/my.ini option-file hierarchy. As
      with other MariaDB packages, users should treat option files as both configuration
      and possible credential stores when client groups contain passwords or TLS key
      settings.
related-packages:
  - id: brew:mariadb@12.3
    reason: >
      Choose MariaDB 12.3 for the newest maintained LTS generation when you can test the
      major-version upgrade and do not need 10.11 compatibility.
    rel: alternative
    sources:
      - https://mariadb.org/mariadb-server-12-3-lts-released/
      - https://mariadb.org/about/
  - id: brew:mysql@8.4
    reason: >
      Choose MySQL 8.4 when Oracle MySQL LTS compatibility or its vendor ecosystem is
      required; MariaDB documents substantial protocol compatibility but also increasing
      implementation differences.
    rel: alternative
    sources:
      - https://dev.mysql.com/doc/refman/8.4/en/
      - >
        https://mariadb.com/docs/release-notes/community-server/about/compatibility-and-differences/mariadb-vs-mysql-compatibility
  - id: brew:mariadb-connector-c
    reason: >
      Use MariaDB Connector/C to connect C and C++ applications to MariaDB 10.11 through
      MariaDB's supported native client API.
    rel: adjacent_workflow
    sources:
      - https://mariadb.com/docs/connectors/mariadb-connector-c
