history:
  adoption-history:
    - >
      Ancient sits at the intersection of software preservation, retrocomputing, and
      archive tooling. Its value is not broad user-interface adoption but format
      coverage: it preserves the ability to unpack data from old scenes, games, music
      modules, and system-specific compressors.
    - >
      The supplied package facts show Ancient packaged in Homebrew, Debian, Fedora/dnf,
      MacPorts, Ubuntu, and zypper. That distribution breadth is notable for a
      specialist decompressor library because it makes obscure formats available to
      scripts and preservation workflows without each user rebuilding from source.
  package-nerd-significance:
    - >
      Ancient is significant because package managers can turn a preservation niche into
      a normal command-line capability. Once installed, old packed data can be tested or
      unpacked in automated pipelines without depending on questionable original
      binaries.
    - >
      It is also a nice example of 'boring modern C++ around weird old formats': the
      project replaces fragile historical code with a maintained, licensed, test-backed
      implementation.
  project-history:
    - >
      The public GitHub repository was created in March 2017. The README explains the
      motivation: old decompression algorithms may still be findable, but original
      implementations are often system-specific, incomplete, direct translations from
      M68K assembly, poorly licensed, or hard to reuse safely.
    - >
      Ancient's project goals are a clean modern implementation, BSD-style licensing,
      and test coverage against a cache of roughly ten thousand available files plus
      generated public-domain test files. The README also stresses that some old formats
      have undocumented corner cases and weak password protection, but the project is
      decompression-focused rather than cryptographic.
    - >
      The latest GitHub release observed for this batch is v2.3.0, published in
      September 2025.
  related-projects:
    - >
      PowerPacker, XPK, StoneCracker, Disk Masher System, Pack-Ice, and other legacy
      compressors listed by the README.
    - >
      Lhasa: referenced by the README as a source for reimplementing rare LZH
      compressors without reusing code.
    - 'bzip2 and gzip: modern/Unix formats included alongside retro formats.'
  sources:
    - https://api.github.com/repos/temisu/ancient
    - https://api.github.com/repos/temisu/ancient/releases/latest
    - https://github.com/temisu/ancient
    - https://github.com/temisu/ancient#readme
    - source_facts.package-manager
  summary:
    - >
      Ancient is a modern C++17 decompressor collection for old compression formats,
      especially formats from Amiga, Atari, and other 1980s and 1990s systems. It ships
      both a command-line application and a small API.
  timeline:
    - '2017: GitHub repository created.'
    - '2017 onward: Ancient grows as a C++17 library and CLI for legacy decompression formats.'
    - '2025: Release v2.3.0 published.'
  usage:
    - >
      The README says simple usage is available through both the CLI and API, and that
      the compression algorithm is automatically detected in most cases. It also notes
      important boundaries: Ancient currently does not support archival files or
      self-extracting executables as primary built-in functionality.
    - >
      The format list is the package's main feature: it includes classic Unix
      `compress`/`pack` variants, bzip2 and gzip bitstreams, Amiga-oriented formats such
      as PowerPacker, XPK-encapsulated files, Disk Masher System, StoneCracker,
      Pack-Ice, and many others.
