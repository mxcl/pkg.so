history:
  adoption-history:
    - >
      Apptorium distributes SideNotes through its website, the Mac App Store, and
      Setapp. The input records a Homebrew Cask package, giving command-line-managed Mac
      installations another supported distribution route.
  package-nerd-significance:
    - >
      SideNotes illustrates how Homebrew Cask manages a proprietary Mac application
      while the application's notes, backups, preferences, and optional iCloud
      synchronization remain outside package-manager control.
  project-history:
    - >
      Apptorium developed SideNotes as a native Mac note-taking application that remains
      at the edge of the screen, allowing notes to be captured without switching away
      from the current application.
    - >
      The documented release history shows continuing development since at least early
      2020. Automatic backups arrived in the 1.2 series, while the 1.3 release added
      iCloud synchronization and themes.
  related-projects:
    - SideNotes for iPhone and iPad
    - Apple Shortcuts
    - AppleScript
    - iCloud
  sources:
    - 'Official data-location article: https://www.apptorium.com/sidenotes/articles/data'
    - 'Official product page: https://www.apptorium.com/sidenotes/'
    - 'Official release notes: https://www.apptorium.com/sidenotes/release-notes'
    - source_facts.package-manager
  summary:
    - >
      SideNotes is Apptorium's native note-taking application for macOS, built around an
      edge-of-screen interface for quickly capturing notes, tasks, links, images, and
      code snippets.
  timeline:
    - "2020: SideNotes 1.1 was documented as the application's first update."
    - '2020: SideNotes 1.2 introduced automatic backups.'
    - '2021: SideNotes 1.3 introduced iCloud synchronization and themes.'
    - '2021: SideNotes 1.4 added Shortcuts actions and expanded AppleScript automation.'
  usage:
    - >
      Users summon SideNotes from the screen edge or with a shortcut, organize material
      into folders, and work with Markdown, tasks, images, file shortcuts, and snippets.
    - >
      Notes are stored locally in an SQLite-based data store; optional iCloud
      synchronization can synchronize them between the user's devices. Apptorium
      explicitly warns against manually modifying the data files.
