history:
  adoption-history:
    - >
      Fathom expanded from a Zoom-oriented meeting assistant to support Zoom, Google
      Meet, and Microsoft Teams. It is offered to individuals as well as teams, with
      calendar, CRM, sharing, and administrative workflows documented by the vendor.
    - >
      The vendor identifies Fathom as a Zoom Apps Launch Partner and offers both a
      desktop application and an in-Zoom application. Later releases added team-wide
      search, public API and webhook capabilities, and bot-free capture modes.
  package-nerd-significance:
    - >
      Fathom represents the modern cloud-connected desktop-app cask: installation is
      local, but transcription, summaries, integrations, and the recording library
      depend on a hosted account and service. It also illustrates why a package entry
      may have no public source repository or documented local credentials file.
  project-history:
    - >
      Fathom Video Inc. developed Fathom as an AI-assisted meeting recorder,
      transcription service, and summarizer. Its desktop client coordinates scheduled
      meetings and capture while the service provides searchable transcripts, summaries,
      clips, action items, and integrations.
    - >
      By 2026 the vendor was rolling out a substantially revised Fathom 3.0 experience,
      including local bot-free capture modes alongside its established meeting-bot
      workflow.
  related-projects:
    - >
      Fathom integrates with Zoom, Google Meet, Microsoft Teams, Google and Microsoft
      calendars, CRM systems, and workflow tools. Other AI meeting assistants occupy the
      same general software category.
  sources:
    - https://fathom.video/
    - https://help.fathom.video/en/articles/11577345
    - https://help.fathom.video/en/articles/276608
    - https://help.fathom.video/en/articles/449088
    - https://help.fathom.video/en/articles/6220097
  summary:
    - >
      Fathom is a proprietary AI meeting assistant from Fathom Video Inc. It captures
      supported online meetings and produces recordings or transcripts, summaries,
      highlights, and action items.
  timeline:
    - '2026: Fathom began rolling out its 3.0 experience with bot-free capture options.'
    - >
      2026: Official release notes documented broader API, webhook, administrative, and
      organization-wide search capabilities.
  usage:
    - >
      Users connect a calendar, install the desktop client, and configure which
      scheduled or impromptu meetings should be captured. After a meeting they review
      the transcript and summary, create or share clips, search recordings, and
      optionally synchronize results with a CRM or other workflow tools.
