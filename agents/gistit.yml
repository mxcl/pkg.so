id: brew:gistit
display-name: git-absorb
repo: null
docs:
  - https://github.com/tummychow/git-absorb#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      gistit appears to have remained a niche uploader. Its README documents build
      dependencies and Homebrew installation, but the available project materials do not
      show the broad packaging or maintainer ecosystem seen around the older Ruby gist
      client.
  package-nerd-significance:
    - >
      For package maintainers, gistit is mainly interesting as a minimal C
      implementation of a GitHub Gist uploader: it has few dependencies, an
      autotools-style build, and a command surface small enough to package without a
      language runtime.
  project-history:
    - >
      The repository history begins in June 2012 with an initial implementation,
      followed by small releases through the 0.1.x series. The README describes a
      console app that can create gists from piped input, a single file, or multiple
      files, with flags for private gists, file names, descriptions, help, and version
      output.
  related-projects:
    - >
      gistit is related to GitHub Gist, the Ruby gist client, libcurl, jansson, and its
      small companion web application.
  sources:
    - https://formulae.brew.sh/formula/gistit
    - https://github.com/jrbasso/gistit
    - https://github.com/jrbasso/gistit/blob/master/README.md
  summary:
    - >
      gistit is a small C command-line utility for creating GitHub Gists from standard
      input or files. It overlaps with other gist uploaders but emphasizes a compiled
      CLI with libcurl and jansson dependencies.
  timeline:
    - '2012: Initial repository history and v0.1 release.'
    - '2013: v0.1.1 and v0.1.2 followed with small updates.'
    - '2015: v0.1.3 was tagged.'
    - '2021: v0.1.4 was tagged.'
  usage:
    - >
      Practitioners use gistit in pipeline form, such as sending command output to a new
      gist, or by passing one or more file names. The README also documents anonymous
      gist creation by default and an account-association flow through the companion web
      application.
related-packages:
  - id: brew:gh
    reason: >
      Choose GitHub CLI for a maintained first-party client that creates gists from
      files or standard input and also manages existing gists through authenticated
      GitHub workflows.
    rel: alternative
    sources:
      - https://cli.github.com/manual/gh_gist
      - https://cli.github.com/manual/gh_gist_create
  - id: brew:gist
    reason: >
      Choose gist for a richer dedicated Gist client with login, GitHub Enterprise
      support, updating, listing, reading, clipboard handling, and a Ruby library API.
    rel: alternative
    sources:
      - https://github.com/jrbasso/gistit#readme
      - https://github.com/defunkt/gist#readme
