id: brew:libqalculate
display-name: libqalculate
repo: null
docs:
  - https://qalculate.github.io/manual/index.html
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/qalculate/qalc.cfg
    - ~/.config/qalculate/qalc.cfg
  windows:
    - '%LOCALAPPDATA%\Qalculate\qalc.cfg'
credentials-file-location: null
history:
  adoption-history:
    - >
      libqalculate became package-worthy because it packages a full calculator brain
      separately from the interfaces. That lets distributions ship qalc for terminal
      users, GUI packages for desktop users, and a library for programs that need the
      same unit and expression engine.
  package-nerd-significance:
    - >
      libqalculate is beloved package-manager material because it is a calculator that
      behaves like a small computer algebra and unit-conversion system but installs as a
      normal Unix CLI/library package. Its dependency changes in 2017 are also a good
      example of a mature scientific desktop project reducing legacy library drag.
  project-history:
    - >
      Qalculate! began as a free software calculator with a GTK interface and split its
      reusable engine into libqalculate. The 2004 0.7.0 release made libqalculate a
      shared library and introduced the qalc command-line interface, which gave the
      project a package-manager identity beyond the GUI application.
    - >
      The project saw long quiet stretches followed by renewed development. The official
      news archive records 0.9.7 in 2010 after a long pause, then a 2016 revival leading
      to 0.9.8. In 2017, version 1.0 marked increased stability and efficiency, version
      2.0 replaced CLN with GMP and MPFR, removed the Glib dependency from the library,
      and brought a feature-complete Windows build.
    - >
      By the 5.x series, the manual and homepage describe a broad calculator
      environment: customizable functions, unit conversion, physical constants, symbolic
      calculations, arbitrary precision, uncertainty propagation, interval arithmetic,
      plotting, GTK and Qt interfaces, and qalc.
  related-projects:
    - >
      Qalculate! is organized around libqalculate plus qalc, qalculate-gtk, and
      qalculate-qt. It also intersects with GMP, MPFR, libcurl, and gnuplot in the
      package graph.
  sources:
    - https://formulae.brew.sh/formula/libqalculate
    - https://github.com/Qalculate/libqalculate
    - https://github.com/Qalculate/libqalculate/tags
    - https://qalculate.github.io/
    - https://qalculate.github.io/manual/index.html
    - https://qalculate.github.io/news.html
  summary:
    - >
      libqalculate is the calculation engine behind Qalculate!, a desktop and
      command-line calculator focused on units, symbolic manipulation, arbitrary
      precision, and practical scientific conversion.
  timeline:
    - >
      2004: Version 0.7.0 installed libqalculate as a shared library and added the qalc
      text interface.
    - '2010: Version 0.9.7 was released after a long period without updates.'
    - '2016: Version 0.9.8 revived development after nearly a decade of little activity.'
    - >
      2017: Version 1.0 was released, followed by 2.0 with GMP, MPFR, reduced Glib
      dependency, libcurl exchange-rate retrieval, and a Windows installer.
    - '2019: Version 3.0 implemented support for the 2019 SI base-unit redefinition.'
    - '2026: Version 5.11 was documented on the project homepage and manual.'
  usage:
    - >
      Homebrew users normally meet libqalculate through qalc, using it for unit
      conversions, exact arithmetic, physical constants, date and time calculations,
      symbolic algebra, and quick terminal math. Desktop Qalculate! users depend on the
      same library through the GTK and Qt front ends.
related-packages:
  - id: brew:qalculate-gtk
    reason: >
      Install the GTK interface when you want libqalculate's calculation engine in a
      full graphical desktop calculator.
    rel: adjacent_workflow
    sources:
      - https://qalculate.github.io/downloads
      - https://github.com/Qalculate/qalculate-gtk
  - id: brew:qalculate-qt
    reason: Install the Qt interface when you prefer a Qt desktop front end backed by libqalculate.
    rel: adjacent_workflow
    sources:
      - https://qalculate.github.io/downloads
      - https://github.com/Qalculate/qalculate-qt
  - id: brew:gnu-units
    reason: >
      Choose GNU Units for a smaller terminal-first tool focused specifically on unit
      conversion and dimensional calculations rather than Qalculate!'s broader symbolic
      calculator.
    rel: alternative
    sources:
      - https://www.gnu.org/software/units/
      - https://qalculate.github.io/manual/qalc.html
tags:
