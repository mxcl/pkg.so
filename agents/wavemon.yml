config-file-location:
  linux:
    - $XDG_CONFIG_HOME/wavemon/wavemonrc
    - ~/.config/wavemon/wavemonrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README notes packaging for Debian and Ubuntu and the availability of
      SlackBuild scripts; the supplied metadata records a Homebrew formula as another
      distribution route.
    - >
      Its continued maintenance around Linux kernel wireless interfaces has made it a
      familiar terminal diagnostic tool rather than a general-purpose cross-platform
      Wi-Fi application.
  package-nerd-significance:
    - >
      wavemon is a durable example of the Unix terminal-monitor genre: a focused ncurses
      interface that exposes live kernel networking data without requiring a graphical
      desktop.
    - >
      It is especially useful on Linux workstations, embedded systems, and remote
      machines where administrators want signal, noise, packet, channel, and
      access-point information in one lightweight interface.
  project-history:
    - >
      Source headers trace wavemon to Jan Morgenstern's 2001–2002 implementation. The
      program evolved as a Linux ncurses monitor for wireless devices and is now
      maintained in the uoaerg repository.
    - >
      Modern releases use Linux networking interfaces and retain a per-user
      configuration model exposed both through an interactive Preferences screen and an
      XDG configuration file.
  related-projects:
    - >
      iw: Linux wireless configuration tooling; wavemon's official README notes that it
      includes ISC-licensed code from iw.
    - "ncurses: the terminal UI library underlying wavemon's screen-oriented interface."
  sources:
    - https://github.com/uoaerg/wavemon
    - https://github.com/uoaerg/wavemon/blob/master/wavemon.1
    - https://github.com/uoaerg/wavemon/blob/master/wavemon.h
    - https://github.com/uoaerg/wavemon/blob/master/wavemonrc.5
  summary:
    - >
      wavemon is a long-running ncurses monitor for Linux wireless devices, presenting
      signal levels, packet statistics, interface configuration, and nearby access-point
      information.
  timeline:
    - >
      2001–2002: Jan Morgenstern authored the original wavemon code identified by the
      project's source copyright.
    - >
      2026: The maintained manuals describe XDG-based per-user configuration and the
      current screen-oriented interface.
  usage:
    - >
      Launch `wavemon` to inspect the selected wireless interface through information,
      level-history, scan, and preference screens. An interface can also be selected on
      the command line.
    - >
      Use the F7 Preferences screen or edit `wavemonrc`; privileged installation may be
      needed for restricted scanning operations on some Linux systems.
