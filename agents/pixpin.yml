history:
  adoption-history:
    - >
      PixPin's official documentation addresses designers, software developers, project
      managers, educators, and marketing workers, reflecting broad use as a general
      desktop productivity utility. It permits company use and keeps most functionality
      free while reserving a smaller set of capabilities for members.
  package-nerd-significance:
    - >
      PixPin belongs to the power-user tradition of screenshot tools that grow into
      programmable desktop workbenches. Its combination of capture, persistent screen
      pins, OCR, annotation, recording, configurable actions, and a small scripting
      interface makes it more than a simple screenshot command.
    - >
      For package-manager users, the cask provides a convenient installation path for a
      rapidly iterated proprietary utility available on both macOS and Windows.
  project-history:
    - >
      The name PixPin derives from “Pixel Pin,” reflecting its original emphasis on
      screenshots and pinning captured material above other windows. The project
      expanded those core ideas with scrolling capture, OCR, annotation, recording,
      translation, configurable actions, image history, and scripting.
    - >
      Official release records show rapid iteration during 2024. A major stable release
      in August 2024 added a macOS edition, pin groups, extensive annotation and
      configuration options, settings import and export, and an optional membership
      model. Later releases continued to broaden recording, recognition, automation, and
      other productivity features.
  related-projects:
    - >
      PixPin occupies the same desktop-utility niche as screenshot, annotation, OCR, and
      screen-pinning applications, but its official documentation does not claim a
      source-code relationship with another project.
  sources:
    - 'Official historical beta archive: https://pixpin.cn/docs/change-log/archive'
    - 'Official product overview: https://pixpin.cn/docs/start/what-is-pixpin'
    - 'Official quick-start guide: https://pixpin.cn/docs/start/quick-start'
    - 'Official stable release notes: https://pixpin.cn/docs/official-log/1.8.22'
  summary:
    - >
      PixPin is a proprietary Windows and macOS productivity utility centered on
      screenshots and persistent screen pins. It also provides scrolling capture,
      annotation, OCR, screen recording, history, configurable shortcuts and actions,
      translation, and scripting.
  timeline:
    - >
      2024: The documented 1.8 series rapidly expanded annotation, translation, pin
      management, settings, and capture features.
    - >
      August 2024: Stable release 1.8.22 added macOS support and introduced optional
      membership features while retaining most functionality for free.
    - >
      2025: The documented 2.1 series expanded screen recording, including microphone
      and system-audio support.
  usage:
    - >
      Users capture static or scrolling regions, annotate results, extract text with
      OCR, record screen regions, and pin images, text, files, colors, or formulas over
      other windows for reference. Designers use pins for visual references; developers
      retain code and error snippets; educators and managers capture and mark up
      explanatory material.
    - >
      Global shortcuts, mouse actions, custom actions, and the embedded scripting
      interface support keyboard-driven and automated workflows. Some translation
      providers can be configured with user-supplied API keys, but the official
      documentation does not identify a credentials file location.
