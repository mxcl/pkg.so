history:
  adoption-history:
    - >
      Scapple began as developer Keith Blount's personal writing tool. It was initially
      built specifically for macOS and later expanded to Windows following the Mac
      release.
    - >
      The official Homebrew Cask record makes the commercial desktop application
      installable through the command-line package-management workflow on macOS.
  package-nerd-significance:
    - >
      Scapple is an example of Homebrew Cask extending package-manager management to a
      proprietary graphical writing tool rather than a traditional command-line utility.
  project-history:
    - >
      Keith Blount developed Scapple over several years as a spare-time project
      alongside Scrivener. The original macOS application was released in 2012; a
      Windows edition followed in October 2013.
    - >
      Literature & Latte positioned Scapple as a deliberately simple, freeform
      alternative to rigid mind-mapping software, with integration that lets users drag
      notes into Scrivener.
  related-projects:
    - >
      Scrivener is Literature & Latte's writing application and supports receiving notes
      dragged from Scapple.
  sources:
    - 'Homebrew Cask provenance: source_facts.package-manager and source_facts.provenance'
    - >
      Official Windows release announcement:
      https://forum.literatureandlatte.com/t/scapple-for-windows-now-available/23965
    - >
      Official origin and 2012 release account:
      https://forum.literatureandlatte.com/t/scapple-and-other-platforms-ios-windows-etc/19940
    - 'Official product overview: https://www.literatureandlatte.com/scapple/overview'
  summary:
    - >
      Scapple is Literature & Latte's freeform idea-development application for placing
      notes anywhere on a canvas and drawing connections between them.
  timeline:
    - '2012: Scapple was released for macOS after several years of spare-time development.'
    - '2013: Scapple 1.0 was released for Windows.'
  usage:
    - >
      Users double-click the canvas to create notes, drag notes together to form
      connections, rearrange ideas freely, and export, print, or move notes into
      Scrivener.
