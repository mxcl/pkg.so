config-file-location:
  macos:
    - ~/.config/mac-cleanup-go/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Homebrew as the primary install path, with GitHub Releases as
      an alternative. Homebrew formula analytics reported 2,099 installs over 365 days
      for mac-cleanup-go at the time of this batch.
    - >
      GitHub repository metadata showed several hundred stars and releases by mid-2026,
      suggesting fast early adoption for a young macOS utility rather than
      long-established cross-platform packaging.
  package-nerd-significance:
    - >
      For package-manager users, mac-cleanup-go is notable because Homebrew is both an
      installation channel and a cleanup target. It reflects a newer generation of macOS
      maintenance tools that wrap package caches, build caches, and app-specific paths
      in a TUI instead of relying on one-shot shell scripts.
  project-history:
    - >
      The public GitHub repository was created in January 2026 and the project quickly
      iterated through a 1.x release series. Release notes show early work on preview
      and confirmation UI, Docker item handling, a command-line cleaning mode in
      v1.3.10, and expanded cleanup coverage through v1.5.0 and v1.5.1.
    - >
      The project positions itself as a safer, interactive alternative to broad cleanup
      scripts: risky categories are unselected by default, SIP-protected paths are
      excluded, and manual categories surface guidance rather than automatically
      deleting data.
  related-projects:
    - >
      The README lists mac-cleanup-py and Mole as alternatives. mac-cleanup-go overlaps
      with mac-cleanup-py in the macOS cleanup niche but emphasizes a Go implementation
      and terminal UI preview workflow.
  sources:
    - https://formulae.brew.sh/api/formula/mac-cleanup-go.json
    - https://github.com/2ykwang/mac-cleanup-go#readme
    - https://github.com/2ykwang/mac-cleanup-go/releases
    - source_facts.repo
  summary:
    - >
      mac-cleanup-go is a Go-based macOS cleanup utility that presents cleanup targets
      in a terminal UI before anything is deleted. Its README describes a preview-first
      workflow for caches, logs, temporary files, selected app data, Docker, Homebrew,
      and developer-tool caches.
  timeline:
    - '2026-01: Public GitHub repository created.'
    - '2026-02: v1.3.10 added CLI mode for selecting targets, dry runs, and cleanup execution.'
    - '2026-04: v1.5.0 expanded cleanup coverage and upgraded the Bubble Tea terminal UI stack.'
    - '2026-06: v1.5.1 included Docker availability and scan-performance fixes.'
  usage:
    - >
      Typical interactive use is `mac-cleanup`, then selecting categories, previewing
      items, excluding anything to keep, and confirming deletion. The README also
      documents CLI mode with `mac-cleanup --select`, `mac-cleanup --clean --dry-run`,
      and `mac-cleanup --clean`.
    - >
      The tool sends most deleted items to Trash by default, while the Trash category
      itself is permanent. The README says Full Disk Access may be needed for Trash or
      restricted locations.
related-packages:
  - id: brew:mac-cleanup-py
    reason: >
      Choose mac-cleanup-py for an established Python, module-oriented cleaner with
      configurable and custom cleanup modules; choose mac-cleanup-go for a compiled
      preview-first TUI.
    rel: alternative
    sources:
      - https://github.com/2ykwang/mac-cleanup-go#readme
      - https://github.com/mac-cleanup/mac-cleanup-py#readme
  - id: brew:mole
    reason: >
      Choose Mole when the workflow also needs app uninstallation, disk analysis,
      project-artifact purging, or maintenance tasks beyond mac-cleanup-go's
      intentionally limited cache, log, and temporary-file scope.
    rel: alternative
    sources:
      - https://github.com/2ykwang/mac-cleanup-go#readme
      - https://github.com/tw93/Mole#readme
