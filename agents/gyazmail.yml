history:
  adoption-history:
    - >
      GyazMail occupies a specialist niche among native macOS mail clients. Its official
      changelog records continuing work across many macOS generations, including
      Universal Binary support and later Apple silicon compatibility.
  package-nerd-significance:
    - >
      GyazMail is notable to package users as a long-lived, independently distributed
      Mac email client that retains traditional power-user features such as rules,
      regular-expression searches, AppleScript integration, IMAP controls, and Keychain
      password storage.
  project-history:
    - >
      The official changelog traces GyazMail from pre-1.0 releases through the 1.x
      series. Over time it added HTML mail display, customizable shortcuts, AppleScript
      commands, IMAP improvements, Growl integration, Universal Binary support, modern
      cryptography libraries, and native compatibility with Apple silicon.
  related-projects:
    - >
      The changelog documents optional integration with macOS Keychain, AppleScript,
      SpamSieve, Growl, and the Oniguruma regular-expression library.
  sources:
    - 'Official changelog: https://gyazsquare.com/gyazmail/changes/'
    - 'Official download page: https://gyazsquare.com/gyazmail/download/'
    - 'Official product site: https://gyazsquare.com/gyazmail/'
    - 'Official requirements: https://gyazsquare.com/gyazmail/requirements/'
  summary:
    - >
      GyazMail is an independently distributed shareware email client for macOS. Its
      extensive official changelog shows a mature application developed through multiple
      eras of Mac hardware and operating-system evolution.
  timeline:
    - >
      Pre-1.0 era: Early public releases added local accounts, message rules, encoding
      controls, and mail-management features.
    - >
      1.1 series: Added basic HTML display, software updating, Keychain password
      storage, and broader shortcut customization.
    - >
      1.2–1.5 series: Expanded AppleScript, IMAP, regular-expression, security, and
      Universal Binary support.
    - '2026: GyazMail 1.8 added Apple silicon and macOS Tahoe compatibility.'
  usage:
    - >
      Users configure mail accounts and incoming/outgoing servers in the application,
      then manage mail with folders, rules, filters, searches, templates, signatures,
      and customizable shortcuts. The application supports local and IMAP-oriented
      workflows and can store account passwords in macOS Keychain.
