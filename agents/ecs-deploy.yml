id: brew:ecs-deploy
display-name: ecs-deploy
repo: https://github.com/fabfuel/ecs-deploy
docs:
  - https://github.com/fabfuel/ecs-deploy#readme
config-file-location:
  unix:
    - ~/.aws/config
credentials-file-location:
  unix:
    - ~/.aws/credentials
history:
  adoption-history:
    - >
      The README documents installation through PyPI with `pip install ecs-deploy`,
      Homebrew with `brew install ecs-deploy`, and Docker images beginning with version
      1.7.1. That multi-channel distribution is the clearest primary evidence of
      adoption beyond a source checkout.
    - >
      The project remains active in 2026 according to repository metadata, but official
      sources do not provide enough evidence to make broad adoption claims beyond its
      AWS ECS deployment niche.
  package-nerd-significance:
    - >
      ecs-deploy is the kind of small package-manager tool that exists because cloud
      CLIs are too general for one repeated deployment workflow. It wraps AWS ECS
      primitives into a narrower, scriptable surface for release automation.
    - >
      It is also a useful packaging example for Python DevOps CLIs: PyPI is the upstream
      install path, Homebrew serves workstation users, and Docker images serve users who
      do not want a local Python environment.
  project-history:
    - >
      The GitHub repository was created in February 2016, during the early period when
      teams were standardizing Docker deployments on Amazon ECS and needed repeatable
      command-line workflows around task definitions and services. The README describes
      the project as a convenience CLI for complex ECS actions that are executed often.
    - >
      The release history shows steady feature accretion around real deployment needs:
      Docker Hub images, task-wide CPU and memory limits, environment files, Docker
      tags, and multi-account usage.
  related-projects:
    - Amazon ECS is the managed container service ecs-deploy automates.
    - boto3 is the AWS Python library that supplies its credential and configuration behavior.
    - AWS CLI configuration files are reused for credentials and profiles.
  sources:
    - https://raw.githubusercontent.com/fabfuel/ecs-deploy/develop/README.rst
    - https://api.github.com/repos/fabfuel/ecs-deploy
    - https://api.github.com/repos/fabfuel/ecs-deploy/releases
  summary:
    - >
      ecs-deploy is a Python CLI for common Amazon ECS service operations: deploy,
      redeploy, scale, run one-off tasks, update task definitions, and update scheduled
      tasks. Its history is mostly a pragmatic DevOps story rather than a large
      ecosystem story.
  timeline:
    - '2016-02: GitHub repository created.'
    - '2020-08: Release 1.10.2 used in README Docker examples.'
    - '2021-08: Release 1.12.0 adds environment-file, Docker tag, and flag-related features.'
    - '2022-04: Release 1.13.0 covers task-wide CPU and memory limits and Docker Hub images.'
    - '2022-11: Release 1.14.0 adds multi-account usage.'
  usage:
    - >
      Typical use is operational: `ecs deploy` updates or redeploys a service, `ecs
      scale` changes desired task count, `ecs run` starts one-off tasks, `ecs update`
      creates revised task definitions, and `ecs cron` updates scheduled tasks.
    - >
      Configuration follows boto3 and AWS CLI conventions. The README points users to
      AWS credential configuration, `aws configure`, explicit access-key options, or
      named AWS profiles.
related-packages:
  - id: brew:awscli
    reason: >
      Use AWS CLI to create the shared AWS profile and credentials that ecs-deploy
      consumes, and keep it available for lower-level ECS operations outside
      ecs-deploy's focused workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/fabfuel/ecs-deploy#configuration
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html
