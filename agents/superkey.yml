history:
  adoption-history:
    - >
      Superkey is aimed at macOS keyboard power users who want to reduce transitions to
      a mouse or trackpad. It combines its distinctive Seek workflow with Hyperkey and
      preset-driven remapping in one application.
  package-nerd-significance:
    - >
      Superkey packages several familiar Mac automation ideas—OCR-assisted navigation,
      Accessibility-based clicking, modifier-key remapping, and Hyperkey—behind a
      deliberately simple preferences interface. Its Homebrew cask makes the
      independently distributed utility easy to install alongside other keyboard
      automation tools.
  project-history:
    - >
      Independent macOS developer Ryan Hanson created Superkey to bridge situations
      where keyboard-driven workflows still required pointer input. Its initial defining
      feature, Seek, used Apple's Vision framework and accessibility information to find
      typed text and activate the selected match.
    - >
      Hanson incorporated the functionality of his separate Hyperkey utility into
      Superkey while retaining a checkbox-centered configuration model rather than a
      general-purpose remapping language.
  related-projects:
    - >
      Hyperkey, also by Ryan Hanson, supplies the four-modifier Hyper key concept
      included in Superkey.
    - Keyboard Maestro can use shortcuts produced by Superkey's Hyperkey functionality.
    - Rectangle and Multitouch are related macOS productivity utilities by the same developer.
  sources:
    - https://ryanhanson.dev/
    - https://ryanhanson.dev/posts/superkey
    - https://superkey.app/
  summary:
    - >
      Superkey is a proprietary macOS keyboard utility that can search for visible text,
      click it, create a Hyper key, and apply preset key remappings.
  timeline:
    - >
      Initial release: Ryan Hanson introduced Superkey around its Seek feature, powered
      by Apple's Vision framework.
    - >
      Later development: Superkey added accessibility-based matching alongside OCR and
      continued expanding preset-driven keyboard enhancements.
  usage:
    - >
      Users assign Seek to a shortcut or remapped key, type visible text into its search
      bar, move among matches with the keyboard, and press Enter to click the selected
      result.
    - >
      The application can also convert Caps Lock or another modifier into the combined
      Control-Option-Command-Shift Hyper key and enable additional remapping presets.
      Seek requires Screen Recording for OCR, while clicking and key detection require
      Accessibility permission.
