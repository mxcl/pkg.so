history:
  adoption-history:
    - >
      WordNet became a reference resource for computational linguistics and natural
      language processing because it exposes word senses and semantic relationships
      rather than only word forms. Princeton's own description highlights this structure
      as useful for NLP, and later community work kept compatibility and comparability
      important by treating Princeton WordNet as the reference base.
    - >
      The data also became a substrate for other resources. Princeton's news page points
      to ImageNet as a database of images linked to WordNet synsets, illustrating how
      the lexical graph escaped its original dictionary-browser niche and became
      infrastructure for machine learning datasets, annotation projects, and word-sense
      research.
  package-nerd-significance:
    - >
      WordNet is one of the classic examples of packaging a large curated dataset as a
      Unix-installable artifact. It matters to package nerds because it is not merely a
      command-line program; it is a shared lexical corpus, a set of on-disk database
      files, manpage-documented tools, and a compatibility target for downstream
      libraries.
    - >
      The Princeton-to-Open-English-WordNet transition is also a useful maintenance
      lesson: widely depended-on research data may outlive its original institutional
      development, so downstream packages preserve old releases while community forks
      carry the living vocabulary forward.
  project-history:
    - >
      The project began in the mid-1980s under Princeton psychologist George A. Miller,
      who later remained principal investigator of WordNet. Princeton's own news page
      records WordNet 3.1 reaching the web interface in June 2011, and the current
      Princeton site now states that Princeton WordNet is no longer developed while the
      database and tools remain freely available.
    - >
      The post-Princeton maintenance story is part of WordNet's modern importance.
      Princeton points users toward community-led resources such as Open English WordNet
      and the Global Wordnet Association for ongoing support. Open English WordNet
      describes itself as a fork of Princeton WordNet developed under an open source
      methodology, preserving the Princeton lineage while moving maintenance into a
      public contribution model.
  related-projects:
    - >
      Open English WordNet continues the English lexical database as an open source fork
      of Princeton WordNet.
    - The Global Wordnet Association provides a forum for wordnets across languages.
    - ImageNet is a notable downstream dataset linked to WordNet synsets.
  sources:
    - https://github.com/globalwordnet/english-wordnet
    - https://wordnet.princeton.edu/
    - https://wordnet.princeton.edu/news-0
    - https://wordnet.princeton.edu/people/george-miller
  summary:
    - >
      WordNet is Princeton University's English lexical database: nouns, verbs,
      adjectives, and adverbs are organized into synonym sets, or synsets, with semantic
      and lexical relations between them. In package collections it is both data and
      tooling: the database is the main artifact, while commands such as wn and browser
      front-ends let users query the lexical graph locally.
  timeline:
    - 'Mid-1980s: George A. Miller begins the WordNet project at Princeton.'
    - 'June 2011: Princeton announces WordNet 3.1 on the web interface.'
    - '2019: Open English WordNet is released as an open source fork of Princeton WordNet.'
    - >
      2026: Princeton's WordNet site states that Princeton WordNet is no longer
      developed and directs users to community-led resources.
  usage:
    - >
      Typical package-manager usage is local lookup and batch querying: users install
      the database and CLI tools, then query synsets, definitions, relations, and
      morphology through wn or library bindings. In NLP pipelines, WordNet is often used
      as a stable lexical knowledge base for sense lookup, semantic relation traversal,
      lemmatization-adjacent workflows, and evaluation datasets.
    - >
      Because the database is freely available and has a long-standing citation culture,
      WordNet also appears in reproducible research and educational settings where a
      fixed English lexical graph is more useful than a live online dictionary.
