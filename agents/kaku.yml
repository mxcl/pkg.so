history:
  adoption-history:
    - >
      Kaku is distributed as a notarized macOS application and through Homebrew. Its
      documentation currently describes it as macOS-only.
  package-nerd-significance:
    - >
      Kaku represents the convergence of the configurable GPU-terminal tradition with AI
      coding workflows. Its WezTerm-compatible Lua configuration lowers migration
      friction for users who already curate terminal dotfiles.
  project-history:
    - >
      The author describes Kaku as growing out of long-term command-line use and
      experience with Alacritty, followed by exploration of kitty, Ghostty, Warp, and
      iTerm2. It was built as a deeply customized fork of WezTerm with smaller binaries,
      curated defaults, and integrated AI assistance.
  related-projects:
    - WezTerm is Kaku's upstream foundation and configuration model.
    - The author presents Kaku alongside the related Waza and Kami projects.
  sources:
    - 'Official README and project background: https://github.com/tw93/Kaku'
    - >
      Official configuration documentation:
      https://github.com/tw93/Kaku/blob/main/docs/configuration.md
    - 'Official features documentation: https://github.com/tw93/Kaku/blob/main/docs/features.md'
  summary:
    - >
      Kaku is an open-source, macOS-focused GPU terminal derived from WezTerm and
      tailored for AI-assisted coding. It combines conventional tabs, panes, shell
      tooling, and Lua customization with command-failure suggestions, natural-language
      command generation, and an AI chat panel.
  timeline:
    - >
      Initial project direction: A customized WezTerm fork was created around practical
      defaults and AI-oriented terminal workflows.
  usage:
    - >
      Users run Kaku as their interactive development terminal, managing tabs and panes
      while retaining WezTerm-compatible Lua customization. Optional assistant features
      can suggest fixes for failed commands, generate commands from natural language,
      and provide an integrated chat panel.
    - >
      Terminal behavior and appearance belong in kaku.lua. The kaku ai setup flow writes
      assistant provider, model, authentication, and API-key settings to assistant.toml.
