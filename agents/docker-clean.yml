history:
  adoption-history:
    - >
      The README documents Homebrew installation and notes that docker-clean v2.0.3 and
      newer became available without using the project's own tap. The batch input also
      lists Debian and Ubuntu package-manager entries, showing that the script escaped a
      single GitHub install path into distribution packages.
  package-nerd-significance:
    - >
      Docker Clean is historically interesting because it packages a one-file
      operational habit: reclaiming disk space from Docker's local daemon. Its niche
      shrank as Docker added and popularized native prune commands, but it remains a
      good example of package-manager culture wrapping repetitive CLI maintenance before
      the platform fully absorbs it.
  project-history:
    - >
      Docker Clean belongs to the earlier Docker ecosystem era when the Docker CLI had
      fewer built-in cleanup affordances and users commonly accumulated unused images,
      containers, volumes, and networks. The official README centers the project on
      wrapping common docker cleanup commands in one script.
  related-projects:
    - >
      Docker Clean is adjacent to docker system prune, docker image prune, docker
      container prune, Docker Machine-era maintenance workflows, and other shell scripts
      for local Docker daemon housekeeping.
  sources:
    - https://github.com/ZZROTDesign/docker-clean#readme
    - https://github.com/ZZROTDesign/docker-clean/blob/master/USAGE.md
    - https://formulae.brew.sh/formula/docker-clean
  summary:
    - >
      Docker Clean is a small shell utility for cleaning Docker daemon state: stopped
      containers, images, dangling volumes, and empty networks. Its README presents it
      as a simple script, installable by curl or Homebrew, with optional modes for
      stopping containers, removing tagged images, cleaning all resources, restarting
      Docker, and dry runs.
  timeline:
    - '2016: README badges and install examples point to the v2.0.4-era project release line.'
    - >
      2016: v2.0.3 and newer are documented as available through Homebrew without the
      project's tap.
    - '2026: The batch input lists Homebrew, Debian, and Ubuntu distribution.'
  usage:
    - >
      Running docker-clean with no arguments removes stopped containers, dangling
      volumes, empty networks, and untagged images. The USAGE.md file documents dry
      runs, host selection for remote Docker hosts, image cleanup, container cleanup,
      stop and all modes, and log output for users who want to inspect the underlying
      removals.
related-packages:
  - id: brew:docker
    reason: >
      Choose Docker's built-in `docker system prune` when you want a maintained native
      command for removing unused containers, networks, images, build cache, and
      optionally anonymous volumes.
    rel: alternative
    sources:
      - https://docs.docker.com/reference/cli/docker/system/prune/
      - https://github.com/ZZROTDesign/docker-clean#readme
