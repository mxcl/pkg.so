history:
  adoption-history:
    - >
      Infinity's official site reports use by more than 25,000 teams. The service
      expanded beyond its browser interface with desktop clients for macOS, Windows, and
      Linux, mobile access, integrations, an API, and automation features.
  package-nerd-significance:
    - >
      The Homebrew cask gives macOS users a package-manager route to Infinity's desktop
      wrapper. The application is notable among productivity casks because it fronts a
      synchronized hosted workspace rather than storing projects in a documented local
      configuration format.
  project-history:
    - >
      Infinity was conceived as a highly customizable work-management system capable of
      organizing many kinds of projects and data. Its hierarchy of workspaces, boards,
      folders, and items was supplemented over time with multiple views, attributes,
      templates, integrations, desktop and mobile applications, an API, and automations.
  related-projects:
    - Trello
    - Asana
    - Notion
    - Clockify
    - Zapier
  sources:
    - >
      Official automation guide:
      https://startinfinity.com/help/1.0/automations/infinity-automations
    - >
      Official desktop-app guide:
      https://startinfinity.com/help/1.0/getting-started/desktop-app
    - 'Official help center: https://startinfinity.com/help'
    - 'Official homepage: https://startinfinity.com/'
    - >
      Official quick-start guide:
      https://startinfinity.com/help/1.0/getting-started/quick-guide-to-infinity
  summary:
    - >
      Infinity is a hosted, customizable work-management platform with browser, desktop,
      and mobile access.
  timeline:
    - >
      2021: Infinity's official guide announced desktop applications for macOS, Windows,
      and Linux.
    - >
      By 2026: The official product site reported adoption by more than 25,000 teams and
      offered AI, automation, integrations, and more than 70 templates.
  usage:
    - >
      Teams and individuals structure work into workspaces, boards, folders, and items,
      then present the same data through table, columns, list, calendar, Gantt, form,
      chart, document, and dashboard views. The desktop client synchronizes hosted work
      and supplies native notifications.
