history:
  adoption-history:
    - >
      OpenCat is distributed as a native application across macOS, iOS, and iPadOS. It
      supports either the vendor's multi-model cloud subscription or API-client mode
      with credentials supplied by the user.
    - >
      The standalone macOS edition extends chat workflows into other applications
      through an accessibility-enabled keyboard extension. An official deployment guide
      also covers centrally configured team installations.
  package-nerd-significance:
    - >
      OpenCat represents the native-client branch of the generative-AI application
      ecosystem: a platform-specific interface that can use user-managed provider keys
      while also offering a managed service.
    - >
      For package-manager users, the Homebrew cask supplies a desktop installation path
      for software otherwise promoted primarily through Apple's App Store ecosystem.
  project-history:
    - >
      OpenCat was developed as a native AI client for Apple platforms. Its product model
      expanded to include OpenCat Cloud, which routes requests to models from several
      providers, alongside a direct API-client mode.
  related-projects:
    - >
      OpenAI, Anthropic, and Google model services are among the third-party AI services
      identified by the official privacy documentation.
    - OpenCat for Team extends the client with centrally managed deployment.
  sources:
    - https://opencat.app/en/doc/
    - https://opencat.app/en/doc/macos-keyboard/
    - https://opencat.app/en/doc/opencat-for-team/
    - https://opencat.app/en/privacy/
    - source_facts.package-manager
  summary:
    - >
      OpenCat is a native AI chat client for macOS, iOS, and iPadOS. It combines a
      conventional chat interface with provider selection, custom prompts, conversation
      history, and macOS-wide keyboard interactions.
  timeline:
    - >
      2025: The published privacy policy documented OpenCat Cloud and direct API-client
      operation.
  usage:
    - >
      Users chat through the native application using OpenCat Cloud or their own
      provider credentials. On macOS, the optional keyboard extension can invoke saved
      conversations, prompts, translations, or particular models from other text-entry
      contexts.
