id: cask:deviceshelf
display-name: DeviceShelf
repo: null
docs:
  - https://deviceshelf.app/en/server
  - https://deviceshelf.app/guide
  - https://deviceshelf.app/linux
config-file-location:
  linux:
    - ~/.config/DeviceShelf
  macos:
    - ~/Library/Application Support/DeviceShelf
  windows:
    - '%AppData%\DeviceShelf'
credentials-file-location: null
history:
  adoption-history:
    - >
      DeviceShelf is distributed across macOS, Windows, Linux, iPhone, and Android, with
      a headless server edition for continuous monitoring. The server can integrate with
      Home Assistant through MQTT and expose local automation interfaces.
    - >
      The server edition entered public beta with the 1.4.0 release in June 2026, after
      which monitoring, API, mobile-pairing, infrastructure-health, and alerting
      features developed rapidly.
  package-nerd-significance:
    - >
      DeviceShelf packages a broad set of discovery techniques—ARP and service scanning,
      DNS-family protocols, SNMP, DHCP fingerprints, vendor data, and open-port
      profiles—behind a local-first interface.
    - >
      It is notable for covering desktop, mobile, native Linux packages, AppImage,
      Docker, and headless-service deployment while keeping core scanning local and
      avoiding a required user account.
  project-history:
    - >
      DeviceShelf began as a local-first device inventory and network scanner. Its
      official 2026 release history records an expansion into continuous monitoring,
      notifications, a headless server, Home Assistant integration, service checks,
      infrastructure health, APIs, and mobile clients.
  related-projects:
    - Home Assistant can consume DeviceShelf device presence and network events over MQTT.
    - >
      The server edition exposes monitoring information for API, Prometheus, and MCP
      consumers.
  sources:
    - https://deviceshelf.app/blog/category/release-history/
    - https://deviceshelf.app/en/
    - https://deviceshelf.app/en/server
    - https://deviceshelf.app/guide
  summary:
    - >
      DeviceShelf is a local-first network discovery, inventory, port-scanning, and
      monitoring application. It identifies devices from multiple network signals and
      can highlight unknown devices, exposed services, and security risks.
  timeline:
    - >
      2026-06: DeviceShelf 1.4.0 introduced continuous scanning, notifications, and the
      first public beta of the headless server edition.
    - >
      2026-06: DeviceShelf 1.5 expanded server monitoring with threshold checks,
      dependencies, maintenance controls, and desktop-to-server connections.
    - >
      2026-07: Releases added mobile pairing, broader infrastructure monitoring, and
      server-management features.
  usage:
    - >
      Users scan a LAN to inventory hosts, identify device types and operating systems,
      inspect open ports, and receive alerts when devices or services change. Optional
      packet-capture setup enables live per-device bandwidth views.
    - >
      For continuous operation, the server edition can run through Docker or native
      service packages and provide a dashboard, reports, integrations, and automation
      APIs.
