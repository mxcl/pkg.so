history:
  adoption-history:
    - >
      libwbxml is not a broad end-user package; it is infrastructure for software that
      must still read or write WBXML. Its adoption follows protocol compatibility needs
      around WAP, SyncML-style data, and other compact XML exchanges rather than
      fashion-driven developer uptake.
  package-nerd-significance:
    - >
      libwbxml is package archaeology with a purpose: it keeps a once-important
      mobile-web binary XML format decodable on modern systems. Its value is less about
      new development and more about letting package managers preserve tools for old
      protocols, tests, and data migrations.
  project-history:
    - >
      The WBXML format was defined by the WAP Forum; the WAP-192-WBXML Version 1.3
      specification is dated 2001-07-25 and describes a tokenized binary XML content
      format with public identifiers, string tables, tag code pages, attributes,
      entities, opaque data, and example encodings.
    - >
      The libwbxml README describes the library as a WBXML parser, internal tree
      representation, and encoder, with high-level conversion between WBXML and XML.
      SourceForge records the project as registered on 2008-11-20 and says the
      historical SourceForge pages remain because development and releases previously
      happened there before migration to GitHub.
  related-projects:
    - >
      Related technologies include WAP, WML, SyncML-family data exchange, Expat for XML
      parsing, and other XML-to-binary or compact protocol encodings from the mobile-web
      era.
  sources:
    - https://github.com/libwbxml/libwbxml
    - https://sourceforge.net/projects/libwbxml/
    - https://www.openmobilealliance.org/tech/affiliates/wap/wap-192-wbxml-20010725-a.pdf
  summary:
    - >
      libwbxml is a C library and tool set for parsing, encoding, and converting WBXML,
      the WAP Binary XML format. It occupies a narrow but useful compatibility niche for
      mobile-era protocols and systems that stored XML-like data in compact binary form.
  timeline:
    - '2001-07-25: WAP Forum releases WBXML Version 1.3 specification material.'
    - '2008-11-20: SourceForge records the libwbxml project registration.'
    - >
      2024-06-06: SourceForge marks the project as available on GitHub, with SourceForge
      retained for historical development and release context.
  usage:
    - >
      The package provides the wbxml2xml and xml2wbxml tools and a library API.
      Developers use it to convert archived or protocol-level WBXML documents to
      readable XML, generate WBXML from XML, or embed WBXML parsing in C applications.
related-packages:
  - id: brew:expat
    reason: >
      Install Expat when building or embedding libwbxml with XML parsing and
      XML-to-WBXML conversion enabled; upstream documents it as the required XML parser
      for that feature.
    rel: adjacent_workflow
    sources:
      - https://github.com/libwbxml/libwbxml#readme
      - https://github.com/libwbxml/libwbxml/blob/master/INSTALL
      - https://libexpat.github.io/
