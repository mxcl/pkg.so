config-file-location:
  unix:
    - ~/.aws/config
credentials-file-location:
  unix:
    - ~/.aws/credentials
history:
  adoption-history:
    - >
      Rasterio is distributed through PyPI wheels and is also commonly installed through
      conda-forge. source_facts.package-manager records packages across Homebrew,
      Alpine, Debian/Ubuntu, MacPorts, Nix, Arch, Scoop, and WinGet, reflecting broad
      adoption across scientific Python and GIS environments.
  package-nerd-significance:
    - >
      Rasterio offers a Pythonic, NumPy-oriented alternative to using GDAL's native
      Python bindings directly while retaining GDAL's extensive raster-format support.
      Packaging it is technically interesting because its Python and Cython layers link
      to GDAL and related native libraries, making binary compatibility and wheel
      construction important concerns.
  project-history:
    - >
      Rasterio was developed to provide idiomatic Python access to geospatial raster
      data. Its design wraps GDAL-backed input and output in dataset objects resembling
      Python files and exposes raster bands as NumPy arrays. The project adopted a
      stable x.y.z release process for the Rasterio 1.x line.
  related-projects:
    - GDAL provides Rasterio's underlying raster data access and format-driver capabilities.
    - NumPy supplies the N-dimensional array model exposed through Rasterio's Python API.
    - GeoJSON conventions are used for vector-shaped geographic features and footprints.
  sources:
    - https://github.com/rasterio/rasterio
    - https://rasterio.readthedocs.io/en/stable/
    - https://rasterio.readthedocs.io/en/stable/contributing.html
    - https://rasterio.readthedocs.io/en/stable/installation.html
    - source_facts.package-manager
  summary:
    - >
      Rasterio is a Python library and rio command suite for reading, writing,
      transforming, and analyzing geospatial raster datasets through GDAL-backed drivers
      and NumPy arrays.
  timeline:
    - 'Pre-1.0: Rasterio developed as a Pythonic abstraction over GDAL raster access.'
    - '1.0 era: The project standardized x.y.z releases from maintenance branches.'
    - >
      Current releases: Official binary packages support Linux, macOS, and Windows,
      alongside source builds linked to system GDAL.
  usage:
    - >
      Python programs use rasterio.open() to read or create datasets, inspect
      georeferencing, access bands as arrays, and perform operations such as
      reprojection, masking, resampling, and rasterization. The rio CLI exposes
      composable commands for dataset inspection, conversion, clipping, merging,
      warping, and related GIS workflows.
