history:
  adoption-history:
    - >
      Blitz has been adopted as a companion application across several competitive
      games. Its official product material has promoted a large user community and
      support for multiple titles, although the vendor provides little durable
      chronological adoption data.
  package-nerd-significance:
    - >
      Blitz represents the service-backed game-companion category: a proprietary desktop
      client combines frequently updated game data, account-linked statistics,
      recommendations, and in-game overlays. Its usefulness depends on compatibility
      with supported games, their patches, and publisher policies.
  project-history:
    - >
      Blitz developed as a desktop companion for competitive games, initially
      emphasizing League of Legends analysis and later broadening its supported-game and
      overlay features. Official product material describes performance analysis,
      pre-game setup, player profiles, recommendations, and in-game overlays.
  related-projects:
    - >
      League of Legends, Teamfight Tactics, and Valorant are among the competitive games
      associated with Blitz features.
    - >
      Game publishers and their APIs supply the changing game and match context on which
      companion features depend.
  sources:
    - 'Official Blitz company page: https://blitz.gg/about-us'
    - 'Official Blitz homepage: https://blitz.gg/'
    - 'Official Blitz product subdomain: https://ads.blitz.gg/'
  summary:
    - >
      Blitz is a desktop game companion that provides statistics, builds,
      recommendations, performance analysis, and overlays for supported competitive
      games.
  timeline:
    - >
      Late 2010s: Blitz established its desktop companion around League of Legends and
      expanded into additional competitive games.
    - >
      2019: Official Blitz material announced Teamfight Tactics integration in the
      desktop companion.
    - >
      Subsequent releases: Blitz expanded its supported games, analysis features, and
      in-game overlays.
  usage:
    - >
      Players run Blitz alongside a supported game to review builds and player
      statistics, automate or simplify supported pre-game setup, receive contextual
      overlays, and inspect post-match performance. Features depend on the selected game
      and may require linked game or Blitz accounts.
