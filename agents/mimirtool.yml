history:
  adoption-history:
    - >
      In practice, operators configure the CLI with `MIMIR_ADDRESS`, `MIMIR_API_USER`,
      `MIMIR_API_KEY`, `MIMIR_TENANT_ID`, and TLS-related flags or environment
      variables, then use it to automate rule management, migration checks, storage
      validation, and backfills. Grafana Cloud documentation specifically uses
      `mimirtool` to upload alert and recording rules to Grafana Cloud Metrics and
      Alerts.
  project-history:
    - >
      Mimirtool exists because running a Mimir or Grafana Cloud Metrics deployment
      involves more than querying time series. The official Mimirtool docs describe it
      as a command-line tool for common tasks involving Grafana Mimir or Grafana Cloud
      Metrics, interacting with user-facing APIs and backend storage. Its commands cover
      Alertmanager configuration, Prometheus rule validation and upload, remote-read
      export, metric-usage analysis from Grafana dashboards and rules, object-storage
      bucket validation, ACL header generation, Cortex-to-Mimir config conversion, TSDB
      block backfill, and partition-ring operations.
  sources:
    - https://formulae.brew.sh/formula/mimirtool
    - https://github.com/grafana/mimir
    - https://grafana.com/blog/announcing-grafana-mimir/
    - >
      https://grafana.com/docs/grafana-cloud/alerting-and-irm/alerting/set-up/provision-alerting-resources/use-mimirtool/
    - https://grafana.com/docs/mimir/latest/
    - https://grafana.com/docs/mimir/latest/manage/tools/mimirtool/
    - https://grafana.com/oss/mimir/
  summary:
    - >
      mimirtool is the operator and tenant CLI shipped from the Grafana Mimir
      repository. Grafana Mimir itself was announced by Grafana Labs on March 31, 2022
      as an open-source time-series database for Prometheus-compatible metrics, built
      from lessons learned running Grafana Enterprise Metrics and Grafana Cloud Metrics
      at large scale. The announcement and Grafana's Mimir OSS page describe the project
      as started at Grafana Labs, AGPLv3-licensed, and aimed at highly scalable, highly
      available, multi-tenant long-term metric storage.
  usage:
    - >
      Its package niche is narrow and infrastructure-focused: Homebrew distributes the
      standalone `mimirtool` executable, while upstream also publishes release binaries
      from the Grafana Mimir GitHub releases. It is best understood as the
      administrative companion to Grafana Mimir, not a general observability client.
related-packages:
  - id: brew:prometheus
    reason: >
      Use Prometheus as the scrape, rule, remote-read, or local-TSDB side of workflows
      that Mimirtool validates, exports, or backfills into Mimir.
    rel: adjacent_workflow
    sources:
      - https://grafana.com/docs/mimir/latest/manage/tools/mimirtool/
      - https://prometheus.io/docs/introduction/overview/
  - id: brew:grafana
    reason: >
      Use Grafana to build dashboards, then use Mimirtool's analyze commands to identify
      which metrics those dashboards and hosted instances consume.
    rel: adjacent_workflow
    sources:
      - https://grafana.com/docs/mimir/latest/manage/tools/mimirtool/
      - https://grafana.com/docs/grafana/latest/
  - id: brew:cortex
    reason: >
      Use Mimirtool's config conversion support when migrating a Cortex deployment to
      Grafana Mimir.
    rel: adjacent_workflow
    sources:
      - https://grafana.com/docs/mimir/latest/manage/tools/mimirtool/
      - https://cortexmetrics.io/docs/
