config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents pip installation for the Python package and Homebrew
      installation for users who only want the command-line tool. Beyond that
      package-manager footprint, the official sources provide little evidence of a
      larger ecosystem.
  package-nerd-significance:
    - >
      goolabs is package-nerd interesting as a niche CLI wrapper around a hosted
      language API: the package is mostly useful because it turns API credentials and
      Japanese NLP endpoints into installable command-line plumbing.
  project-history:
    - >
      The GitHub repository was created in December 2014. Git tags show early releases
      in 2014 and 2015, with v0.3.0 tagged in March 2016.
  related-projects:
    - >
      The README relates goolabs to Goo Labs APIs for Japanese morphological analysis,
      similarity, hiragana conversion, entity extraction, and short summaries.
  sources:
    - https://api.github.com/repos/tell-k/goolabs
    - https://api.github.com/repos/tell-k/goolabs/tags
    - https://github.com/tell-k/goolabs
    - https://github.com/tell-k/goolabs#readme
  summary:
    - >
      goolabs is a small Python API client and command-line tool for Goo Labs
      Japanese-language APIs. Its README focuses on API access for tasks such as
      morphological analysis, similarity scoring, hiragana and katakana conversion,
      named-entity extraction, and short summaries.
  timeline:
    - '2014: GitHub repository created under tell-k/goolabs.'
    - '2014: v0.1.1 tag points to a version and history update commit.'
    - '2015: v0.1.2 and v0.2.0 tags published in July.'
    - '2016: v0.3.0 tag published in March.'
  usage:
    - >
      Users need a Goo Labs application id before using the library or CLI. The README
      examples instantiate `GoolabsAPI` with that app id and call API methods for
      Japanese text processing.
