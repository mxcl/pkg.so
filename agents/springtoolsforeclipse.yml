config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Spring's Eclipse tooling traces back to the Spring IDE project. It later became
      the foundation of Spring Tool Suite, a ready-to-use Eclipse distribution for
      Spring development.
    - >
      Spring Tools 4 broadened the architecture beyond Eclipse to editors including
      Visual Studio Code and Theia. In 2022, Spring reported that Spring Tools 4 was the
      most-downloaded extension on Eclipse Marketplace and had about 1.5 million Visual
      Studio Code Marketplace installs.
  package-nerd-significance:
    - >
      Spring Tools for Eclipse packages an Eclipse distribution with Spring-aware
      tooling and selected extensions, giving package-manager users a reproducible
      alternative to assembling the IDE from separate update sites.
    - >
      The transition from the Eclipse-specific Spring IDE and Spring Tool Suite to an
      editor-agnostic language-server architecture mirrors a wider shift in developer
      tooling toward reusable services shared across IDEs.
  project-history:
    - >
      The Spring IDE lineage began in 2004 as tooling for Spring development in Eclipse.
      Spring Tool Suite was subsequently built on that work.
    - >
      Spring Tools 4 entered public beta in 2017 and reached general availability in
      2018 as a largely rewritten, IDE-agnostic generation focused on Spring Boot, fast
      navigation, content assistance, and live application information.
    - >
      Maintenance of the older Spring Tool Suite 3 and Spring IDE line ended in 2022,
      leaving Spring Tools 4 as the actively developed generation.
  related-projects:
    - Eclipse provides the desktop IDE platform used by this distribution.
    - >
      Spring Boot and Spring Framework are the principal application frameworks
      understood by the tooling.
    - Spring Initializr is integrated for creating Spring projects.
    - The same Spring Tools codebase also supports Visual Studio Code, Cursor, and Theia.
  sources:
    - https://github.com/spring-projects/spring-tools
    - https://github.com/spring-projects/spring-tools/wiki
    - https://spring.io/blog/2018/09/25/spring-tools-4-ga-released/
    - https://spring.io/blog/2022/06/14/goodbye-spring-ide-welcome-spring-tools-4/
    - https://spring.io/tools/
  summary:
    - >
      Spring Tools for Eclipse is the Eclipse-based distribution of the open-source
      Spring Tools project. It adds Spring- and Spring Boot-aware navigation, editing
      assistance, project creation, validation, and live application information to the
      Eclipse development environment.
  timeline:
    - '2004: Work begins on the Spring IDE project for Eclipse.'
    - '2017: The first public beta of Spring Tools 4 is released.'
    - '2018: Spring Tools 4 reaches general availability.'
    - '2022: Maintenance of Spring Tool Suite 3 and the older Spring IDE line ends.'
  usage:
    - >
      Developers use the distribution as a ready-to-run Eclipse IDE for creating,
      navigating, running, debugging, and upgrading Spring Boot applications.
    - >
      The Boot Dashboard and live application information connect source code with
      running Spring Boot applications, while Spring Initializr integration creates new
      projects. The official documentation does not identify one stable cross-version
      user configuration file for the packaged application.
