id: brew:baresip
display-name: Baresip
repo: null
docs:
  - https://github.com/baresip/baresip/wiki/Accounts
  - https://github.com/baresip/baresip/wiki/Configuration
config-file-location:
  unix:
    - ~/.baresip/config
credentials-file-location:
  unix:
    - ~/.baresip/accounts
history:
  adoption-history:
    - >
      Baresip is adopted by users who want a scriptable or terminal-friendly SIP
      softphone instead of a large desktop VoIP client. Its package coverage across
      Alpine, Debian, Fedora, Arch, Ubuntu, openSUSE, MacPorts, Nix, and Homebrew
      reflects its usefulness to VoIP developers, test environments, and Unix telephony
      setups.
  package-nerd-significance:
    - >
      Baresip is package-nerd significant because it pulls real-time communications into
      normal Unix packaging: OpenSSL/libre dependencies, optional media modules,
      platform audio backends, codec feature choices, and configuration files that make
      SIP testing possible from scripts and terminals.
  project-history:
    - >
      The upstream README credits Alfred E. Heggestad and contributors from 2010 onward
      and describes Baresip as a BSD-licensed SIP user agent. It depends on the related
      libre networking library and is configured through simple files that are generated
      in the user's home directory on first run.
    - >
      Baresip has expanded from a compact SIP endpoint into a broad media and signaling
      toolkit with TLS, SRTP, DTLS-SRTP, ZRTP, STUN, TURN, ICE, multiple audio and video
      codecs, native audio/video backends, command-line control, and optional HTTP and
      MQTT management modules.
  related-projects:
    - >
      Baresip is closely related to the libre library from the same project ecosystem.
      It also sits near SIP clients and tools such as Linphone, PJSIP/PJSUA, SIPp, and
      Asterisk, but with a smaller modular user-agent focus.
  sources:
    - https://github.com/baresip/baresip/blob/main/CHANGELOG.md
    - https://github.com/baresip/baresip/blob/main/README.md
    - https://github.com/baresip/baresip/wiki/Accounts
    - https://github.com/baresip/baresip/wiki/Configuration
    - source_facts.package-manager
  summary:
    - >
      Baresip is a portable, modular SIP user agent with audio and video support, used
      from the command line and built around selectable modules for signaling, media,
      devices, and NAT traversal.
  timeline:
    - '2010: Upstream copyright history begins for Alfred E. Heggestad and contributors.'
    - >
      2024: Baresip 3.x continues monthly-style releases with modular SIP, audio, video,
      and NAT traversal work.
    - '2025: Baresip 4.0.0 is released.'
    - >
      2026: Baresip 4.9.0 is released with continued SIP, TLS, Android audio, contact,
      and test improvements.
  usage:
    - >
      A typical installation starts baresip once to generate configuration under
      ~/.baresip, then edits accounts and config files for SIP registration, codecs,
      devices, NAT traversal, and modules. The package exposes a single baresip
      executable while related examples and wiki pages document account and
      configuration syntax.
related-packages:
  - id: brew:sipp
    reason: >
      Use SIPp alongside Baresip to generate repeatable SIP scenarios and traffic when
      testing Baresip endpoints, registrations, signaling, or media behavior.
    rel: adjacent_workflow
    sources:
      - https://github.com/baresip/baresip
      - https://sipp.readthedocs.io/
