history:
  adoption-history:
    - >
      MWeb expanded across macOS, iPadOS, and iOS while retaining deeper desktop-only
      functions in MWeb Pro. Its publishing integrations and flexible exports position
      it between a Markdown editor, a personal knowledge library, and a blogging tool.
  package-nerd-significance:
    - >
      MWeb Pro is notable to Mac package users because it combines local Markdown
      editing with managed notes, publishing adapters, image-upload services, and
      static-site generation in one native application. It can operate on ordinary
      folders instead of requiring every document to live in its managed library.
  project-history:
    - >
      MWeb evolved into a multi-platform Markdown application with two principal
      workflows: a managed Library mode and an External Folder mode for ordinary
      Markdown and Textbundle files.
    - >
      The 4.x generation changed the editor, redesigned the interface, and introduced
      CloudKit synchronization for the document library. Static website and blog
      generation remains a macOS MWeb Pro feature.
  related-projects:
    - >
      MWeb can publish to services including WordPress, MetaWeblog API endpoints,
      WordPress.com, Evernote, Medium, Ghost, and Yuque, and can upload images through
      several hosted or custom services.
  sources:
    - 'Official basic-use guide: https://www.mweb.im/en-mweb-start'
    - 'Official download and release page: https://www.mweb.im/download'
    - 'Official usage documentation: https://www.mweb.im/en-help'
  summary:
    - >
      MWeb Pro is a native Markdown writing, note-management, publishing, and
      static-site generation application for macOS, with companion MWeb editions on
      iPadOS and iOS.
  timeline:
    - >
      4.x generation: MWeb replaced its editor, redesigned the interface, and added
      CloudKit library synchronization.
    - >
      2025: The official English usage documentation described MWeb's current
      multi-platform workflow and macOS-only Pro static-site generation.
  usage:
    - >
      Library mode organizes documents with categories and tags and can support note
      taking and static blogs. External Folder mode directly edits Markdown and
      Textbundle documents in user-selected folders. MWeb can export to formats
      including HTML, PDF, EPUB, RTF, DOCX, and images, and can publish to multiple web
      services.
