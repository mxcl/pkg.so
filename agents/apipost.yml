history:
  adoption-history:
    - >
      Apipost expanded from a desktop API client into a cross-platform workspace
      supporting Windows, macOS, Linux, and the web. Its documentation emphasizes team
      collaboration as well as offline use.
  package-nerd-significance:
    - >
      Apipost occupies the same toolchain niche as API clients and collaborative
      API-design suites, combining request debugging, documentation, mocks, automated
      tests, and project sharing in one application.
  project-history:
    - >
      Apipost has evolved through several major client generations. Official
      documentation distinguishes legacy V5–V7 data from V8 and provides migration
      guidance for older projects.
  related-projects:
    - >
      The official documentation describes importing Postman projects and integrating
      Apipost with IDE plugins, OpenAPI access, and an MCP server.
  sources:
    - https://doc.apipost.cn/
    - https://wiki.apipost.cn/
    - https://wiki.apipost.cn/docs/install/
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      Apipost is a cross-platform API lifecycle workspace for designing and documenting
      APIs, sending and debugging requests, creating mocks, and running automated tests.
  timeline:
    - '2019: Official pricing material documented an established Apipost product line.'
    - 'V5: Offline use without signing in became an advertised capability.'
    - 'V8: A new major-generation workspace and migration path replaced the legacy V6/V7 line.'
  usage:
    - >
      Developers use Apipost to organize API projects, define requests, manage shared
      parameters and authentication, generate documentation and mock data, and execute
      debugging or automated-test workflows.
