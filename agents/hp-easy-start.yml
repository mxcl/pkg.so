history:
  adoption-history:
    - >
      HP distributed Easy Start through its printer support and driver-download workflow
      as a guided alternative to manually selecting and installing individual printer
      components. HP's current support material increasingly directs users to the HP app
      or HP Smart for ongoing printer setup and management.
  package-nerd-significance:
    - >
      The package is useful in managed Mac setups because it provides a repeatable way
      to bootstrap HP printer discovery and obtain model-appropriate software, although
      the downloaded components can vary by printer model.
  project-history:
    - >
      HP Easy Start was created as HP's guided macOS installer for discovering a
      supported printer, establishing a USB or network connection, and downloading the
      appropriate driver and utility software.
  related-projects:
    - >
      HP Smart / HP app: HP's newer application for printer setup, scanning, and
      settings management.
    - >
      HP Utility: A macOS printer-management utility that can be installed through HP
      Easy Start.
  sources:
    - >
      Official HP Easy Start troubleshooting documentation:
      https://support.hp.com/my-en/document/ish_7280416-7280464-16
    - >
      Official HP USB installation documentation:
      https://support.hp.com/hk-en/document/ish_6669804-6669779-16
    - >
      Official HP Utility documentation:
      https://support.hp.com/pl-pl/document/ish_3158845-3156329-16?fallbackLocale=us-en&validated=true
  summary:
    - >
      HP Easy Start is HP's guided macOS utility for locating an HP printer and
      installing the printer-specific drivers and supporting software needed for USB or
      network use.
  timeline:
    - >
      Current support era: HP support documentation recommends the HP app or HP Smart
      for many new setup and management workflows while retaining Easy Start
      instructions for driver installation.
  usage:
    - >
      A user launches Easy Start, selects or discovers a printer, chooses a USB or
      network connection, and follows the prompts to download and install the
      appropriate HP printer software. HP advises disconnecting VPNs and avoiding guest
      networks when troubleshooting discovery or download failures.
