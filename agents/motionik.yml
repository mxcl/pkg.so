history:
  adoption-history:
    - >
      Motionik's official homepage states that it is trusted by more than 600 creators.
      It supports both macOS and Windows, including separate downloads for Apple
      Silicon, Intel Macs, and Windows.
  package-nerd-significance:
    - >
      Motionik is relevant to desktop-package users as an all-in-one alternative to
      multi-stage recording and editing workflows. It bundles capture, automated camera
      movement, cursor treatment, overlays, masking, editing, and export in a single
      desktop application.
  project-history:
    - >
      Motionik was developed by Motionik LLC as a cross-platform screen-recording and
      editing product. Its public materials emphasize producing polished demonstrations
      and tutorials quickly through automatic zooming, cursor tracking, and integrated
      editing.
  related-projects:
    - The official site positions Motionik as an alternative to Screen Studio.
    - Its feature-request service and community channels supplement the official Help Center.
  sources:
    - 'Official GitHub organization linked by the product site: https://github.com/Motionik'
    - 'Official Help Center: https://motionik.com/help-center'
    - 'Official product homepage: https://motionik.com/'
  summary:
    - >
      Motionik is a Windows and macOS screen recorder and editor for producing polished
      product demonstrations, tutorials, promotional videos, and screenshots.
  timeline:
    - 'Product era: Launched as an integrated recorder and editor for Windows and macOS.'
    - >
      2026: Official site identifies Motionik LLC and advertises a user base of more
      than 600 creators.
    - >
      2.4.0: Version represented by the supplied macOS source archive in
      source_facts.source-archive.
  usage:
    - >
      Users record an entire display, a window, or a selected region, optionally
      including webcam, microphone, system audio, or an iPhone/iPad screen. Recordings
      can be enhanced with automatic or manual zoom, cursor effects, text, images,
      audio, masks, highlights, captions, noise reduction, and then exported as video or
      GIF.
