history:
  adoption-history:
    - >
      The developers reported that early users adopted Vivid for outdoor and brightly
      lit work. The app was subsequently offered both as a direct download and through
      the Mac App Store, with an unlimited split-screen trial intended to demonstrate
      compatibility before purchase.
  package-nerd-significance:
    - >
      Vivid is representative of small, focused macOS utilities that expose hardware
      behavior through public Apple APIs. It is especially relevant to owners of Liquid
      Retina XDR MacBook Pro displays and the Pro Display XDR, where ordinary desktop
      use does not normally access the display's sustained HDR brightness range.
  project-history:
    - >
      Jordi Bruin began exploring system-wide XDR brightness after testing HDR video on
      a new MacBook Pro, and worked with Ben Harraway on an implementation using Apple's
      Metal and other public APIs. Vivid launched in early April 2022.
    - >
      Vivid 2.0 followed in October 2022 with a rebuilt brightness method, substantially
      lower CPU use, broader integration, and Eclipse Mode for brightness below the
      normal minimum.
  related-projects:
    - >
      Vivid Browser is the developers' related iOS browser for viewing web content at
      maximum supported brightness.
    - >
      Apple's Metal framework and XDR display capabilities underpin Vivid's brightness
      technique.
  sources:
    - https://impresskit.net/1f8f199e-4a3c-4637-820c-074762693eb5
    - https://impresskit.net/press-release/524fb565-65a7-4836-916a-f34f8ef133cf
    - https://impresskit.net/press-release/9ef1deb6-c9b1-4927-9f82-958bbe236a45
    - https://www.getvivid.app/
  summary:
    - >
      Vivid is a macOS display utility that makes the extended brightness range of
      supported MacBook Pro XDR displays and the Pro Display XDR available system-wide.
  timeline:
    - '2022-04: Vivid launched.'
    - '2022-10: Vivid 2.0 introduced a rebuilt implementation and Eclipse Mode.'
    - '2023-04: Vivid marked its first anniversary.'
  usage:
    - >
      Users enable Vivid when working outdoors or in other bright environments and
      continue adjusting brightness with the standard keyboard keys. Its split-screen
      trial applies extended brightness to half the display, while Eclipse Mode supports
      unusually dim working environments. Higher brightness increases power consumption.
