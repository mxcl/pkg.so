  summary:
    - >
      Pika is an open-source macOS colour picker for sampling foreground and background
      colours from the screen, converting them among common colour spaces, checking
      contrast, and copying values into design or development workflows.
  timeline:
    - >
      Public development and packaged releases are maintained in the official GitHub
      repository.
    - >
      The current project documents formats including Hex, RGB, HSB, HSL, LAB, OpenGL,
      and OKLCH, plus automation through pika:// URLs.
  usage:
    - >
      Users pick foreground and background colours, switch output formats, inspect
      colour history and compliance, and copy individual values or complete colour sets.
      Keyboard shortcuts and pika:// URL triggers support fast or automated operation.
