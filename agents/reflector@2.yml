history:
  adoption-history:
    - >
      Squirrels positioned Reflector 2 for classrooms, presentations, recording, gaming,
      and other settings where several mobile devices needed to share a computer
      display. Support for both AirPlay and Google Cast broadened it beyond Apple-only
      workflows.
  package-nerd-significance:
    - >
      Reflector 2 represents the class of desktop packages that turn a general-purpose
      Mac or PC into a software wireless-display receiver, avoiding dedicated receiver
      hardware. The versioned Homebrew cask is also useful where an older,
      compatibility-specific release must remain distinct from the current Reflector
      product.
  project-history:
    - >
      Reflector began under the name Reflection and adopted the Reflector name in 2012.
      Squirrels released Reflector 2 for Mac in April 2015 as a redesigned receiver for
      AirPlay and Google Cast devices, later adding recording, live streaming, webcam
      integration, classroom companion support, localization, and compatibility updates.
  related-projects:
    - >
      Squirrels developed Reflector Director for remotely managing mirrored devices and
      Reflector Student for connecting on restricted classroom networks. AirParrot is
      the company's complementary sending application.
  sources:
    - https://blog.airsquirrels.com/2015/04/introducing-reflector-2
    - >
      https://press.airsquirrels.com/2015/04/reflector-2-with-android-mirroring-and-new-features-available-today
    - https://www.airsquirrels.com/reflector/release-notes/mac
  summary:
    - >
      Reflector 2 is Squirrels' wireless screen-mirroring receiver for displaying and
      recording AirPlay and Google Cast devices on macOS or Windows.
  timeline:
    - '2012: Reflection was renamed Reflector.'
    - '2015: Reflector 2 launched for Mac and Windows with AirPlay and Google Cast reception.'
    - >
      2015: Version 2.1 added live streaming, webcam support, and Reflector Student
      integration.
    - >
      2017: The final documented Reflector 2 updates improved device compatibility
      before the Reflector 3 generation.
  usage:
    - >
      Users run Reflector on a computer, select that computer as a mirroring destination
      from a supported phone, tablet, Chromebook, or Mac, and then display, arrange,
      record, or stream the received screens. Connection approval and on-screen codes
      can restrict who is allowed to mirror.
