history:
  adoption-history:
    - >
      The project page presents CRFsuite as a faster and more flexible CRF package than
      older template-oriented tools, with a simple data format, benchmark results, and
      model storage based on CQDB. Version 0.12 added Python SWIG modules and sample
      programs, including named entity recognition and part-of-speech tagging examples.
  package-nerd-significance:
    - >
      For package maintainers, CRFsuite is a compact C/C++ NLP toolkit with historical
      source and binary releases, a BSD license, and a small command-line surface. It is
      also useful as a contrast point with CRF++ because its official page calls out
      data-format flexibility that CRF++ lacks.
  project-history:
    - >
      The official changelog records internal releases beginning with CRFsuite 0.1 on
      2007-10-29 and a first public release, 0.4, on 2008-03-05. The 0.4 release added
      the website, documentation, a tutorial, and a CoNLL 2000 chunking performance
      comparison.
  related-projects:
    - >
      The official page links CRFsuite's data-format comparison to CRF++, and also
      points to libLBFGS and CQDB as implementation-related software.
  sources:
    - https://www.chokkan.org/software/crfsuite
    - https://github.com/chokkan/crfsuite/blob/master/ChangeLog
  summary:
    - >
      CRFsuite is Naoaki Okazaki's fast implementation of Conditional Random Fields for
      labeling sequential data. It provides command-line training/tagging, C++ and SWIG
      APIs, and training algorithms such as L-BFGS, OWL-QN, SGD, averaged perceptron,
      passive aggressive, and AROW.
  timeline:
    - '2007-10-29: CRFsuite 0.1 internal release'
    - '2008-03-05: CRFsuite 0.4 first public release'
    - '2009-03-07: Version 0.6 added SGD and reduced training memory usage'
    - >
      2011-08-11: Version 0.12 optimized training, added more algorithms, revised APIs,
      and added Python SWIG support
  usage:
    - >
      CRFsuite users train and tag sequence-labeling models with a feature-per-line data
      format. The official documentation emphasizes speed, training-method choice,
      performance evaluation during training, and programmatic use through C++ and SWIG
      APIs.
related-packages:
  - id: brew:crf++
    reason: >
      Choose CRF++ when its established template-driven feature workflow and
      crf_learn/crf_test interface match an existing pipeline; choose CRFsuite for
      arbitrary per-item features and a wider selection of documented training
      algorithms.
    rel: alternative
    sources:
      - https://www.chokkan.org/software/crfsuite/
      - https://taku910.github.io/crfpp/
