history:
  adoption-history:
    - >
      The vendor reports that the iSlide plug-in has been used by millions of office
      workers. Official compatibility guidance covers Microsoft PowerPoint and WPS
      Office on Windows, PowerPoint on macOS, Keynote support, and a Linux build aligned
      with WPS requirements.
  package-nerd-significance:
    - >
      For macOS package users, the cask packages a proprietary presentation-design
      companion that otherwise belongs to an account-backed template and asset
      ecosystem. It is notable as a cross-platform office extension rather than a
      standalone slide editor.
  project-history:
    - >
      iSlide's company traces its origins to the Nordri presentation-design business
      founded in 2007. The official company history says the iSlide plug-in was formally
      launched in 2017 as an upgrade from the earlier Nordri plug-in.
    - >
      The product developed into an office-integrated design suite combining layout
      utilities with online libraries of templates, diagrams, charts, icons, images, and
      other presentation assets.
  related-projects:
    - Nordri was the predecessor presentation-design company and plug-in.
    - >
      Microsoft PowerPoint and WPS Office are the principal host applications; official
      documentation also describes Keynote support on macOS.
  sources:
    - 'Official company history: https://www.islide.cc/about'
    - 'Official product introduction: https://www.islide.cc/help/article/253'
    - 'Official system and Office requirements: https://www.islide.cc/help/article/264'
  summary:
    - >
      iSlide is a presentation-productivity plug-in and resource service. It embeds
      design tools and reusable online assets into supported presentation applications
      to accelerate consistent slide creation.
  timeline:
    - '2007: The predecessor Nordri presentation-design company was founded.'
    - '2017: The iSlide plug-in was formally launched as an upgrade from the Nordri plug-in.'
  usage:
    - >
      Users invoke iSlide from their presentation application's interface to insert
      templates and reusable components, normalize fonts and colors, align and lay out
      slide elements, create charts, and export presentation content.
    - >
      An iSlide account enables access to synchronized online resources and records such
      as favorites and prior downloads; premium and enterprise services add licensed
      assets and organizational management.
