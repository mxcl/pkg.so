history:
  adoption-history:
    - >
      Gucharmap became a standard desktop utility because character maps are basic
      infrastructure for multilingual text entry, font inspection, and Unicode lookup.
      The archived GNOME page lists features oriented to both end users and developers,
      including a reusable GTK+ widget.
    - >
      Package-manager adoption is broad because it is both a desktop application and a
      small library/API surface. The input metadata records packages across Alpine,
      Homebrew, Debian, Ubuntu, Fedora-family, MacPorts, Nix, Arch, and openSUSE
      ecosystems.
  package-nerd-significance:
    - >
      Gucharmap is a classic desktop utility package with unusually concrete
      data-version constraints. A distribution update is not just a rebuild: package
      maintainers must line up GTK, GLib, PCRE2, FreeType, gobject-introspection, and
      the expected Unicode Character Database version.
    - >
      For users, it is one of the fastest ways to answer practical Unicode questions
      from the desktop: what code point is this, what is its name, what font renders it,
      and how do I paste it elsewhere?
  project-history:
    - >
      The GNOME wiki describes gucharmap as the GNOME Character Map based on the Unicode
      Character Database. Its DOAP metadata gives the project name as Character Map,
      describes it as based on the Unicode Character Database, and records it as a GNOME
      core-category project maintained by Christian Persch.
    - >
      The release archive shows a long lineage beginning with 0.4-era tarballs and
      continuing through GNOME 1.x, 2.x, 3.x, and Unicode-version-numbered series such
      as 8.0, 9.0, 10.0, 11.0, 12.0, and 17.0. The source tree's Meson build documents
      an exact coupling between each gucharmap major/minor version and a specific
      Unicode data version.
    - >
      The modern source layout ships the Unicode data files needed for builds, while
      also allowing builders to point Meson at an external absolute Unicode Character
      Database path. That evolution reflects gucharmap's role as a desktop application
      that must track Unicode itself, not just GNOME release conventions.
  related-projects:
    - >
      The GNOME wiki places gucharmap alongside GTK, GNOME, Unicode Character Database
      files, KCharSelect, Unibook, Microsoft Character Map, UnicodeChecker, UniView, and
      older/deprecated GNOME and KDE character-map tools. The reusable GTK widget also
      connects it to other GTK applications that need character browsing.
  sources:
    - https://download.gnome.org/sources/gucharmap/
    - https://gitlab.gnome.org/GNOME/gucharmap
    - https://gitlab.gnome.org/GNOME/gucharmap/-/raw/master/README.md
    - https://gitlab.gnome.org/GNOME/gucharmap/-/raw/master/gucharmap.doap
    - https://gitlab.gnome.org/GNOME/gucharmap/-/raw/master/meson.build
    - https://wiki.gnome.org/Apps/Gucharmap
  summary:
    - >
      Gucharmap is the GNOME Character Map, a GTK application and library based on the
      Unicode Character Database. Its niche is simple but enduring: browse Unicode by
      block or script, inspect character metadata, find glyphs in fonts, and copy
      characters or strings into other applications.
  timeline:
    - >
      2000s: GNOME release archive includes 0.4, 0.6, 0.8, 0.9, 1.0, and later 1.x
      gucharmap tarballs.
    - '2011-04-04: GNOME release changes include version 3.0.0.'
    - '2010s: Release series tracks GNOME 3-era numbering and later Unicode-numbered series.'
    - >
      2019: Meson build copyright header appears in the source tree, reflecting the
      Meson-based build system.
    - >
      2020s: Build metadata records exact Unicode version coupling, including the 17.0
      series designed for Unicode 17.0 data.
  usage:
    - >
      Users browse characters by Unicode block or script, search by name or metadata,
      jump by code point, inspect encodings such as UTF-8 and UTF-16 representations,
      view glyphs in selected fonts, identify clipboard characters, and copy or drag
      selected characters into other programs.
    - >
      Developers and maintainers care about the Unicode data pipeline: the README says
      gucharmap ships the Unicode data files it needs, and the Meson build warns that a
      released gucharmap version is designed to work with its corresponding Unicode
      version rather than accepting an arbitrary Unicode data bump.
related-packages:
  - id: cask:unicodechecker
    reason: >
      UnicodeChecker is a macOS-native alternative with Unicode browsing plus
      normalization, conversion, diff, Services, AppleScript, Spotlight, and Quick Look
      workflows; choose Gucharmap for a GTK/GNOME application and reusable widget.
    rel: alternative
    sources:
      - https://wiki.gnome.org/Apps/Gucharmap
      - https://earthlingsoft.net/UnicodeChecker/
