id: brew:git-plus
display-name: git-plus
repo: https://github.com/tkrajina/git-plus
docs:
  - https://github.com/tkrajina/git-plus#readme
config-file-location:
  unix:
    - .multigit_ignore
credentials-file-location: null
history:
  adoption-history:
    - >
      git-plus is a niche workflow package rather than a platform tool. Homebrew
      packaging made the command collection easy to install on macOS, while the README's
      pip and PATH instructions kept it usable as a script bundle for developers
      managing multiple checkouts.
  package-nerd-significance:
    - >
      git-plus is representative of the lightweight Git-extension culture in which shell
      or Python scripts are distributed as package-manager formulae and become
      first-class Git verbs. It overlaps with standalone tools such as git-recent but
      packages several small workflows together.
  project-history:
    - >
      The repository started in May 2013 with git-multi-oriented commits and later
      collected related Git scripts under one package. Tagged releases began with v0.1.0
      in 2015 and continued through the 0.4 series, with the README documenting
      installation by PATH, Homebrew, or pip.
    - >
      The toolset follows Git's extension convention: executables named git-multi,
      git-relation, git-old-branches, git-recent, and git-semver become subcommands
      available as git multi, git relation, git old-branches, git recent, and git
      semver.
  related-projects:
    - git-recent overlaps with the branch-selection workflow provided by git-plus.
    - >
      Git's external command convention makes each git-plus executable available as a
      git subcommand.
  sources:
    - https://formulae.brew.sh/formula/git-plus
    - https://github.com/tkrajina/git-plus
    - https://github.com/tkrajina/git-plus#readme
  summary:
    - >
      git-plus is a collection of small Git helper commands for multi-repository work,
      branch relation checks, old branch cleanup, recent branch listing, and
      semantic-version tag creation.
  timeline:
    - '2013: Repository initialized with git-multi documentation.'
    - '2015: v0.1.0 tag published.'
    - '2016: v0.3.0 tag published.'
    - '2023: v0.4.10 tag published.'
  usage:
    - >
      Practitioners use git multi to run one Git command across sibling repositories,
      git relation to compare two refs as ahead, behind, equal, or diverged, git
      old-branches to identify stale local or remote branches, git recent to order
      branches by last commit time, and git semver to list or create version tags.
    - >
      Its most durable use case is local repository housekeeping: checking many working
      trees, comparing branch state, deleting old branches after confirmation, and
      moving quickly among recently touched branches.
related-packages:
  - id: brew:git-extras
    reason: >
      Choose git-extras when you want a much broader suite of Git subcommands for
      summaries, changelogs, releases, contribution reports, and other workflows; choose
      git-plus for its smaller collection focused on multi-repository and branch
      housekeeping.
    rel: alternative
    sources:
      - https://github.com/tkrajina/git-plus#readme
      - https://github.com/tj/git-extras#readme
  - id: brew:git-recent
    reason: >
      Choose the standalone git-recent for an fzf-based recent-branch browser with
      checkout and diff previews; git-plus offers a simpler recent-branch command
      alongside four other Git utilities.
    rel: alternative
    sources:
      - https://github.com/tkrajina/git-plus#readme
      - https://github.com/paulirish/git-recent#readme
