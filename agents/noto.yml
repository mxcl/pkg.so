history:
  adoption-history:
    - >
      Noto was distributed directly by its developer, through the Mac App Store, and
      later through a Homebrew cask. Its official release archive records the 1.0
      release in June 2017, followed by releases through January 2018.
  package-nerd-significance:
    - >
      Noto is a small GPL-licensed, Swift-based native Mac editor. It is representative
      of independently developed macOS utilities that combine direct signed
      distribution, App Store availability, open source code, and third-party
      package-manager installation.
  project-history:
    - >
      Bruno Philipe created Noto as a focused general-purpose plain-text editor for
      macOS and released its source under GPLv3. The application was written primarily
      in Swift and designed around native Cocoa capabilities.
    - >
      Its initial feature set emphasized text-encoding support, indentation across
      multiple selections, invisible-character display, configurable printing, themes,
      and integration with iCloud Drive and Time Machine document versioning.
  related-projects:
    - Cocoa
    - Swift
    - iCloud Drive
    - Time Machine
  sources:
    - https://github.com/brunophilipe/Noto
    - https://www.brunophilipe.com/software/noto/
    - https://www.brunophilipe.com/software/noto/themes/
  summary:
    - >
      Noto is a free and open-source plain-text editor for macOS, written primarily in
      Swift and designed as a simple native editor with encoding, indentation, printing,
      and theme features.
  timeline:
    - '2017-06-04: Noto 1.0 was released.'
    - '2017-09-17: Noto 1.1 was released.'
    - '2018-01-13: Noto 1.2 was released.'
  usage:
    - >
      Users open and edit plain-text documents in many encodings, adjust indentation,
      reveal invisible characters, customize editor themes, and use native macOS
      document features. Custom themes can be imported or exported as .plist files.
