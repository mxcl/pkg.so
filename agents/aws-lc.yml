history:
  adoption-history:
    - >
      AWS-LC is aimed at infrastructure and language/runtime consumers that need an
      OpenSSL-like API surface, tuned implementations, FIPS work, and CI coverage across
      AWS-relevant platforms. Its Homebrew formula also exposes command-line utilities
      such as bssl and c_rehash for developers who want the library toolchain locally.
    - >
      Package-manager adoption matters here because replacing or supplementing
      OpenSSL-family libraries is operationally sensitive: downstream packages care
      about ABI/API compatibility, FIPS status, CPU optimizations, and whether the
      library is available through system package channels.
  package-nerd-significance:
    - >
      For package maintainers, AWS-LC is interesting because it sits in the
      BoringSSL/OpenSSL family but is packaged as an AWS-maintained crypto library with
      formal verification references, FIPS artifacts, and active cross-platform CI. That
      makes the formula more like infrastructure plumbing than a standalone app.
  project-history:
    - >
      The project presents itself as maintained by the AWS Cryptography team and
      explicitly traces its code lineage to Google's BoringSSL and OpenSSL. Its git
      history preserves older imported upstream commits, but AWS-specific work appears
      in 2020, with early tags such as v0.1-alpha and v0.1-beta in September 2020.
    - >
      AWS-LC's stated goal is to maintain a secure libcrypto compatible with software
      and applications used at AWS, while also giving the AWS Cryptography team a public
      home for open-source cryptographic contributions and enhancements.
  related-projects:
    - BoringSSL and OpenSSL are the stated code bases AWS-LC is based on.
    - >
      AWS-LC Formal Verification and s2n-bignum are referenced by the README for
      verified cryptographic code paths.
  sources:
    - https://github.com/aws/aws-lc#readme
    - https://github.com/aws/aws-lc/blob/main/BUILDING.md
    - https://github.com/aws/aws-lc/blob/main/PORTING.md
    - https://github.com/aws/aws-lc/blob/main/crypto/fipsmodule/FIPS.md
    - official git history and tags from https://github.com/aws/aws-lc
  summary:
    - >
      AWS-LC is Amazon's libcrypto/libssl distribution for AWS and customer use: a
      general-purpose cryptographic library based on BoringSSL and OpenSSL, packaged as
      a C/C++ library rather than an end-user command-line application.
  timeline:
    - '2020: AWS-specific AWS-LC commits and alpha/beta tags appear in the public repository.'
    - '2021: v0.0.1 and FIPS-related tags appear.'
    - '2022: v1.x releases continue alongside AWS-LC-FIPS tags.'
    - '2026: v5.x tags show the project remains actively released.'
  usage:
    - >
      Typical use is as a build dependency or embedded TLS/crypto provider. The README
      points users to BUILDING.md for dependencies and build options, public headers for
      API documentation, PORTING.md for OpenSSL migration, and FIPS.md for FIPS-specific
      builds.
    - >
      AWS-LC includes portable C implementations plus optimized assembly for selected
      x86 and Arm processors, and documents supported platforms including Linux, macOS,
      Windows, Android, and iOS.
related-packages:
  - id: brew:openssl@3
    reason: >
      Choose OpenSSL 3 when software requires upstream OpenSSL's provider architecture
      or APIs rather than AWS-LC's OpenSSL-compatible, AWS-optimized implementation.
    rel: alternative
    sources:
      - https://github.com/aws/aws-lc/blob/main/PORTING.md
      - https://docs.openssl.org/3.0/man7/migration_guide/
  - id: brew:libressl
    reason: >
      Choose LibreSSL when the desired stack is the OpenBSD-maintained fork with its
      libtls API and security-focused removal of legacy OpenSSL code.
    rel: alternative
    sources:
      - https://github.com/aws/aws-lc#readme
      - https://www.libressl.org/goals.html
      - https://github.com/libressl/portable#readme
