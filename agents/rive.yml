history:
  adoption-history:
    - >
      Rive states that its technology is used in products from organizations including
      Spotify, Duolingo, Disney, Google, and other large companies, and that products
      built with it reach more than two billion users.
  package-nerd-significance:
    - >
      The cask provides a native macOS route to an editor whose output bridges design
      tooling and application runtimes. It is notable to package users who want
      reproducible installation of a cross-platform interactive-graphics authoring tool.
  project-history:
    - >
      Rive developed an editor and runtime ecosystem for creating interactive vector
      graphics that can be shipped directly in applications, games, and websites. Its
      official site distinguishes the authoring editor from its open-source platform
      runtimes.
  related-projects:
    - Rive Runtimes
    - Rive Renderer
  sources:
    - https://rive.app/
    - https://rive.app/docs/editor/get-rive
    - source_facts.package-manager
  summary:
    - >
      Rive is an interactive design and animation environment whose editor creates
      graphics, animations, state machines, and scripted experiences for use across
      multiple runtime platforms.
  timeline:
    - >
      Current era: Rive offers native macOS and Windows editors alongside a browser
      editor and cross-platform runtimes.
  usage:
    - >
      Users design and animate assets in the editor, add interaction through state
      machines or scripting, and export Rive files for integration with supported web,
      mobile, desktop, and game runtimes.
