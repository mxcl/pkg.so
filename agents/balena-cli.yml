id: brew:balena-cli
display-name: balena CLI
repo: https://github.com/balena-io/balena-cli
docs:
  - https://docs.balena.io/reference/balena-cli/latest
  - https://github.com/balena-io/balena-cli#readme
config-file-location:
  unix:
    - ~/.balenarc.yml
    - $PWD/balenarc.yml
  windows:
    - '%UserProfile%\_balenarc.yml'
    - '%CD%\balenarc.yml'
credentials-file-location:
  unix:
    - ~/.balena/token
  windows:
    - '%UserProfile%\_balena\token'
history:
  adoption-history:
    - >
      balena CLI is a central tool for balenaCloud and openBalena users because it
      handles account login, fleet and device operations, image deployment, OS
      downloads, SSH, API-backed scripting, and CI-friendly workflows. The Homebrew
      formula API reported stable version 25.1.10 with 248 installs in the previous 30
      days as of June 30, 2026.
    - >
      The input package facts list Homebrew, Chocolatey, MacPorts, Nix, Scoop, and
      winget packages, reflecting broad packaging for developer workstations and
      Windows/macOS/Linux operator environments.
  package-nerd-significance:
    - >
      balena CLI matters because it is the package-managed entry point to an IoT fleet
      platform. It turns cloud/device operations into reproducible terminal commands,
      which makes it important for CI, deployment scripts, support workflows, and
      developers who need to manage physical devices without living entirely in a web
      console.
  project-history:
    - >
      The balena-io/balena-cli GitHub repository was created on March 2, 2015. The
      README describes it as the official balena CLI and says it builds on the balena
      API and balena SDK, can be imported in Node.js applications, and is available for
      Windows, macOS, and Linux.
    - >
      The project has evolved with balena's platform. Its changelog is generated by
      Versionist, follows semantic versioning, and shows a long-running release train
      with major-version compatibility and deprecation policy documented in the README.
  related-projects:
    - balenaCloud and openBalena are the platform targets documented by the README.
    - >
      The CLI builds on the balena API and balena SDK, and the changelog shows regular
      SDK and compose-parser dependency updates.
  sources:
    - https://api.github.com/repos/balena-io/balena-cli
    - https://api.github.com/repos/balena-io/balena-cli/releases/latest
    - https://formulae.brew.sh/api/formula/balena-cli.json
    - https://raw.githubusercontent.com/balena-io/balena-cli/master/CHANGELOG.md
    - https://raw.githubusercontent.com/balena-io/balena-cli/master/README.md
  summary:
    - >
      balena CLI is the official command-line interface for balenaCloud, openBalena, and
      the balena API. It is a cross-platform operational tool for IoT and edge-device
      fleets, used interactively and in scripts.
  timeline:
    - '2015-03-02: balena-io/balena-cli repository created on GitHub.'
    - '2026-04-29: v25.1.0 changelog adds organization management commands.'
    - '2026-06-29: v25.1.10 released on GitHub.'
    - '2026-06-30: Homebrew formula reports stable balena-cli 25.1.10.'
  usage:
    - >
      Common workflows begin with `balena login`, then use CLI commands to interact with
      balenaCloud or openBalena resources. The README calls out proxy support, shell
      support, command reference docs, troubleshooting, auto-completion, and regular
      upgrading to stay compatible with backend services.
related-packages:
  - id: cask:balenaetcher
    reason: >
      Choose balenaEtcher when the task is only to flash and validate an OS image
      through a graphical interface; balena CLI offers scriptable flashing plus broader
      balenaCloud and fleet operations.
    rel: alternative
    sources:
      - https://etcher.balena.io/
      - https://docs.balena.io/reference/balena-cli/latest
