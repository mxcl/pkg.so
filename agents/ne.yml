    - ~/.ne/syntax/
credentials-file-location: null
history:
  adoption-history:
    - >
      ne is widely packaged for an editor of its size. The upstream README links Fedora,
      Debian, Ubuntu, OpenBSD, MacPorts, Homebrew, and Haiku ports. Debian describes it
      as easy for beginners and powerful enough for advanced users, with UTF-8,
      multi-column character support, syntax highlighting, and configurable menus and
      keybindings.
    - >
      On July 1, 2026, GitHub showed 568 stars and 36 forks for vigna/ne. Homebrew
      Formulae listed stable 3.3.4 and 149 installs in its 365-day analytics window.
  package-nerd-significance:
    - >
      ne is not a dominant editor, but it is a durable counterexample to the idea that
      terminal editing means either vi or emacs. For package indexes, it belongs in the
      small-editor lineage with Joe, nano, micro, and other tools that trade ecosystem
      gravity for immediate usability.
  project-history:
    - >
      The ne README says it was originally developed on the Amiga, inspired by Martin
      Taillefer's TurboText, and later moved to Linux. Todd Lewis joined development
      with features written for the University of North Carolina, and Daniele Filaretti
      helped with syntax highlighting.
    - >
      Sebastiano Vigna's software page says ne had a measure of success among UN*X users
      who disliked vi or emacs, which matches the editor's niche: conventional shortcuts
      and menus, but still a terminal-native Unix program.
  related-projects:
    - TurboText
    - Joe editor
    - vi
    - emacs
    - nano
    - micro
  sources:
    - https://api.github.com/repos/vigna/ne
    - https://formulae.brew.sh/formula/ne
    - https://github.com/vigna/ne
    - https://packages.debian.org/sid/ne
    - https://vigna.di.unimi.it/software.php
  summary:
    - >
      ne, the nice editor, is Sebastiano Vigna's small POSIX terminal editor for users
      who want something easier than vi and lighter than emacs. The project emphasizes
      portability, low resource use, configurable menus and keybindings, syntax
      highlighting, UTF-8 support, regular expressions, autocomplete, and large-file
      support.
  timeline:
    - >
      {'date': '1993', 'event': 'Commonly reported first release year for ne; upstream
      describes its origin on Amiga before the move to Linux.'}
    - >
      {'date': '2015-04-17', 'event': 'vigna/ne repository creation date reported by the
      GitHub API.'}
    - >
      {'date': '2025-02-06', 'event': 'Version 3.3.4 date reported by package metadata
      sources.'}
    - >
      {'date': '2026-07-01', 'event': 'Homebrew Formulae listed stable 3.3.4 and 149
      installs in the 365-day analytics window.'}
  usage:
    - >
      Users install `ne` as a low-friction terminal editor for remote sessions, rescue
      environments, small systems, and people who do not want modal vi. The appeal is
      that common operations use familiar control-key shortcuts while advanced users can
      customize menus, keys, macros, syntax rules, and extension-specific preferences.
    - >
      Its package metadata is especially helpful because it exposes real config
      locations such as `~/.ne/.keys`, `~/.ne/.menus`, `~/.ne/.extensions`,
      `~/.ne/.default#ap`, and `~/.ne/syntax/`.
related-packages: []
