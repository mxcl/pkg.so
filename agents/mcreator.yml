history:
  adoption-history:
    - >
      MCreator developed a community among Minecraft players, beginning mod authors,
      educators, and workshop organizers by reducing the amount of Java knowledge needed
      to create a mod.
    - >
      Its scope expanded beyond Forge-based Java mods to support other workspace types,
      including data packs, resource packs, and Bedrock Edition add-ons. A plugin system
      lets the community add generators and extend the editor.
    - >
      The official product overview describes worldwide use by players, aspiring
      developers, online classes, STEM workshops, and Minecraft camps, but it does not
      publish a stable current adoption count.
  package-nerd-significance:
    - >
      MCreator is unusual among game-development packages because it combines a visual
      mod generator, Blockly-style procedures, asset tools, an integrated code editor,
      and a Gradle project underneath each workspace.
    - >
      For package users, it provides a ready-made Minecraft modding toolchain while
      still producing workspaces that can be opened in conventional Gradle-aware IDEs
      and kept in version control.
  project-history:
    - >
      The first public MCreator prototype appeared around May 2012, initially creating
      blocks and exporting mods. MCreator 0.5 followed in June, and the first stable
      release arrived in August 2012.
    - >
      Over subsequent releases, MCreator added more mod elements, multiple workspaces,
      Forge integration, a visual procedure system, broader workspace types, plugins,
      asset editors, debugging tools, and a more capable integrated code editor.
    - >
      MCreator is now developed openly, with its source hosted by the MCreator
      organization and releases documented on the official site.
  related-projects:
    - Minecraft Java Edition
    - Minecraft Bedrock Edition
    - Minecraft Forge
    - NeoForge
    - Fabric
    - Gradle
    - Blockly
  sources:
    - 'Official about page: https://mcreator.net/about'
    - >
      Official project-history article hosted on MCreator:
      https://mcreator.net/forum/64553/origins-today-mcreator-story
    - 'Official release notes: https://mcreator.net/wiki/mcreator-release-notes'
    - 'Official workspace guide: https://mcreator.net/wiki/create-new-workspace-window'
  summary:
    - >
      MCreator is an open-source visual development environment for creating Minecraft
      Java Edition mods, Bedrock Edition add-ons, data packs, and resource packs. It
      targets beginners while also exposing generated code and conventional Gradle
      workspaces to advanced users.
  timeline:
    - '2012-05: The first public prototype appeared.'
    - '2012-06-12: MCreator 0.5 was released.'
    - '2012-08-09: The first stable MCreator release arrived.'
    - >
      2018-05-04: A major release introduced the redesigned procedure system and other
      broad editor changes.
  usage:
    - >
      Users create a self-contained workspace, choose a target and generator, then
      define blocks, items, entities, recipes, interfaces, procedures, and assets
      through visual editors. Generated source can also be edited in MCreator's code
      editor.
    - >
      Each workspace is also a Gradle project, allowing advanced users to open it in an
      external IDE. Workspaces can be exported as shareable ZIP files or connected to
      remote version-control hosting.
