history:
  adoption-history:
    - >
      libheif became a common Unix package because it gave image applications and shell
      workflows a reusable way to read HEIC files from Apple-oriented ecosystems and
      AVIF files from web-image ecosystems without each application implementing the
      container stack itself.
    - >
      Homebrew ships it with user-facing tools such as heif-convert, heif-enc, heif-dec,
      heif-info, and heif-thumbnailer, which made it useful both as a library dependency
      and as a command-line conversion utility.
  package-nerd-significance:
    - >
      libheif matters to packagers because the visible package is small, but its
      usefulness depends on codec policy, optional dependencies, plugin choices, and
      file-format brands. It is the sort of package where build options decide whether
      users get HEIC-only, AVIF-capable, or broader modern-image support.
    - >
      It also marks the shift from classic single-image formats toward containerized
      image formats that carry auxiliary images, metadata, sequences, depth, alpha, HDR,
      and codec-specific boxes.
  project-history:
    - >
      The v1.0.0 release in February 2018 was billed as the first still-image decoder
      release and already covered HEIF features such as tiled images, alpha channels,
      thumbnails, EXIF/XMP metadata, depth channels, multiple images, image
      transformations, and overlays.
    - >
      The v1.7.0 release in June 2020 added AVIF reading and writing through libaom and
      described a plugin architecture that let encoders reuse HEIF infrastructure while
      selecting AV1 compression.
    - >
      The v1.12.0 release in May 2021 added MIAF conformance handling,
      premultiplied-alpha signaling, AV1 sequence-header parsing for the av1C box, and
      AVIF pixi-box writing. The v1.22.0 release in May 2026 broadened the library
      toward generic image components and a reworked ISO/IEC 23001-17 lossless-image
      codec implementation.
  related-projects:
    - libde265 and x265 are closely related through HEVC/HEIC workflows.
    - libaom and other AV1 codec projects are related through AVIF encoding and decoding.
    - >
      ImageMagick, GIMP, thumbnailers, and desktop file managers are typical downstream
      consumers of HEIF/AVIF libraries.
  sources:
    - https://api.github.com/repos/strukturag/libheif/releases/tags/v1.0.0
    - https://api.github.com/repos/strukturag/libheif/releases/tags/v1.12.0
    - https://api.github.com/repos/strukturag/libheif/releases/tags/v1.22.0
    - https://api.github.com/repos/strukturag/libheif/releases/tags/v1.7.0
    - https://formulae.brew.sh/formula/libheif
    - https://github.com/strukturag/libheif
  summary:
    - >
      libheif is a C/C++ library and set of command-line tools for HEIF-family
      still-image formats. Its package-manager value comes from sitting at the awkward
      but important boundary between container formats, patent-heavy video codecs, and
      desktop image tooling.
    - >
      The project is associated with Struktur AG and Dirk Farin, and the public
      repository describes it as an ISO/IEC 23008-12 HEIF and AVIF file-format decoder
      and encoder.
  timeline:
    - '2018: v1.0.0 released as the first still-image decoder release.'
    - '2020: v1.7.0 added AVIF reading and writing through libaom.'
    - '2021: v1.12.0 added MIAF conformance and AVIF metadata refinements.'
    - >
      2026: v1.22.0 expanded generic image components and ISO/IEC 23001-17
      lossless-image support.
  usage:
    - >
      Typical package use is format conversion, image inspection, thumbnail generation,
      and linking higher-level image software against a shared HEIF/AVIF implementation.
      Codec details are delegated to companion libraries or plugins such as libaom for
      AV1 support.
related-packages:
  - id: brew:imagemagick
    reason: >
      ImageMagick is a documented libheif consumer, so installing it provides a broader
      command-line image-processing workflow around HEIC and AVIF files.
    rel: adjacent_workflow
    sources:
      - https://github.com/strukturag/libheif
      - https://imagemagick.org/
  - id: brew:x265
    reason: >
      libheif uses x265 as an HEVC encoder backend when writing HEIC images; choose it
      when HEIC encoding is required and its GPL licensing is acceptable.
    rel: adjacent_workflow
    sources:
      - https://github.com/strukturag/libheif
      - https://bitbucket.org/multicoreware/x265_git/wiki/Home
  - id: brew:ffmpeg
    reason: >
      libheif documents FFmpeg as an optional decoding backend for several codecs,
      making it useful when a build needs FFmpeg-supported decoding or hardware-assisted
      HEVC paths.
    rel: adjacent_workflow
    sources:
      - https://github.com/strukturag/libheif
      - https://ffmpeg.org/documentation.html
  - id: brew:openjpeg
    reason: >
      libheif can use OpenJPEG to decode and encode JPEG 2000 or decode HTJ2K image data
      stored in HEIF containers.
    rel: adjacent_workflow
    sources:
      - https://github.com/strukturag/libheif
      - https://www.openjpeg.org/
