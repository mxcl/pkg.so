history:
  adoption-history:
    - >
      ARC was distributed as a cross-platform desktop application for Windows, macOS,
      and Linux, with an open development process and packaged releases. The Electron
      repository accumulated a long release series culminating in the documented 17.x
      desktop releases.
    - >
      Homebrew cask packaging supplied a package-manager route for macOS users,
      complementing the installers published with upstream releases.
  package-nerd-significance:
    - >
      ARC belongs to the class of graphical HTTP clients used to inspect and exercise
      APIs without writing a one-off script. Its open Electron implementation, request
      history, authorization handling, cookies, redirects, timing data, and HAR-oriented
      request information make it useful for API debugging and reproducible development
      workflows.
  project-history:
    - >
      Advanced REST Client evolved into an Electron desktop application whose main
      source repository is arc-electron. The project presents itself as open API tooling
      and manages planning, contributions, releases, and issue reporting publicly.
    - >
      Its request architecture delegates transport and request preparation to reusable
      Advanced REST Client modules. Requests can incorporate authorization and cookies,
      and completed responses can be recorded in history with redirect and timing
      details.
  related-projects:
    - >
      The wider advanced-rest-client GitHub organization contains reusable request,
      authorization, and UI modules used by the Electron application.
    - >
      ARC occupies a similar workflow niche to other graphical API clients, while
      emphasizing its open-web and open-tooling project model.
  sources:
    - Input field source_facts.package-manager
    - https://docs.advancedrestclient.com/
    - https://github.com/advanced-rest-client/arc-electron
    - >
      https://github.com/advanced-rest-client/arc-electron/blob/master/docs/request-architecture.md
    - https://github.com/advanced-rest-client/arc-electron/releases
  summary:
    - >
      Advanced REST Client, commonly abbreviated ARC, is an open-source desktop
      application for composing HTTP requests, testing APIs, and inspecting detailed
      responses.
  timeline:
    - The official sources reviewed do not state a reliable initial project date.
    - >
      2020: The repository's contribution workflow referenced the redesign2020
      development branch.
    - '2022: The project published its documented 17.0.9 desktop release.'
  usage:
    - >
      Users compose an HTTP request, configure headers, query parameters, body, cookies,
      and authorization, then inspect the response, redirects, timing information, and
      request history.
    - >
      ARC can persist request history and authorization-related request data internally,
      but the official documentation reviewed does not identify a stable
      credentials-file or user configuration-file location.
