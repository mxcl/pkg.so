history:
  adoption-history:
    - >
      EasyEngine became recognizable in WordPress hosting circles because it wrapped
      common Nginx/WordPress operations in commands such as `ee site create example.com
      --type=wp`. The input metadata records packaging across Homebrew, MacPorts, and
      Nix, showing that users install it as a normal system CLI as well as through the
      upstream installer.
  package-nerd-significance:
    - >
      EasyEngine is interesting to package maintainers because it is not just one
      binary: the `ee` command coordinates Dockerized services, PHP PHAR delivery, shell
      completions, and a family of command packages. Packaging it cleanly means tracking
      both the CLI release and its operational assumptions about Docker and root access.
  project-history:
    - >
      The EasyEngine repository was created in August 2012. The current project README
      identifies the repository as EasyEngine v4 and says the tool manages Nginx while
      using Docker, Docker Compose, PHP CLI, and bundled command packages.
    - >
      The README also says EasyEngine is built on the WP-CLI framework and splits
      top-level commands such as site, shell, cron, service, and WordPress site types
      into related command repositories. That modular layout is a major part of the
      v4-era architecture.
  related-projects:
    - >
      WP-CLI is the base framework named by the README. Related EasyEngine repositories
      include site-command, site-type-wp, cron-command, shell-command, service-command,
      admin-tools-command, auth-command, and dockerfiles.
  sources:
    - https://github.com/EasyEngine/easyengine
    - https://github.com/EasyEngine/easyengine/releases/tag/v4.11.0
    - https://easyengine.io/docs/
  summary:
    - >
      EasyEngine is a command-line control panel for managing WordPress and other sites
      on an Nginx-based stack. Its package-nerd appeal is that it turns a server recipe
      involving Nginx, PHP, MySQL, Docker, certificates, and WordPress commands into a
      single `ee` CLI.
  timeline:
    - '2012: Public EasyEngine repository created.'
    - '2018: EasyEngine v4 line established around Dockerized site management.'
    - >
      2026: v4.11.0 release published with continued site-command, Docker image,
      installer, and dependency updates.
  usage:
    - >
      The README's first examples create WordPress sites, cached WordPress sites,
      multisite installs, plain HTML sites, and interactive shells. The documented
      command set is explicitly server-management oriented and expects root privileges.
related-packages:
  - id: brew:wp-cli
    reason: >
      EasyEngine provisions and operates the WordPress hosting environment, while WP-CLI
      handles application-level WordPress administration and also supplies EasyEngine's
      underlying command framework.
    rel: adjacent_workflow
    sources:
      - https://github.com/EasyEngine/easyengine#development
      - https://wp-cli.org/
  - id: brew:docker-compose
    reason: >
      EasyEngine uses Docker Compose to define and run the multi-container services
      behind its managed sites.
    rel: adjacent_workflow
    sources:
      - https://github.com/EasyEngine/easyengine#requirements
      - https://docs.docker.com/compose/
