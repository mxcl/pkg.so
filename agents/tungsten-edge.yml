history:
  adoption-history:
    - >
      The project distributes ready-to-run macOS builds through its official website and
      supports installation through Homebrew. Its public repository also serves as the
      official issue tracker and source distribution.
  package-nerd-significance:
    - >
      Tungsten Edge is a package-manager-friendly example of a native Swift desktop
      customization utility. It replaces an operating-system interaction surface,
      requires macOS Accessibility permission, and is distributed both as an application
      bundle and as GPL-licensed source.
  project-history:
    - >
      Moonbai Studio developed Tungsten Edge as an open-source, per-window taskbar for
      macOS. Unlike the application-oriented macOS Dock, it gives each open window its
      own taskbar card while collapsing single-window applications into compact icons.
    - >
      During its pre-1.0 development, the project added a drawer, file shelf,
      multi-display behavior, bilingual UI, automatic updates, and signed and notarized
      builds.
  related-projects:
    - macOS Dock
    - uBar
    - DockDoor
  sources:
    - 'Official releases: https://github.com/moonbai-studio/tungsten-edge/releases'
    - 'Official repository: https://github.com/moonbai-studio/tungsten-edge'
    - 'Official website: https://tungstenedge.app/en/'
  summary:
    - >
      Tungsten Edge is an open-source macOS Dock replacement organized around individual
      windows rather than applications.
  timeline:
    - >
      2026: Tungsten Edge was publicly developed and distributed through its official
      website and GitHub repository.
    - '2026: Version 0.8 moved compiled downloads from GitHub Releases to the official website.'
    - >
      2026: Version 0.9 introduced signed and notarized builds, automatic updates, and
      English and Simplified Chinese interfaces.
  usage:
    - >
      Users grant Accessibility permission so Tungsten Edge can enumerate, focus, and
      minimize windows. They can then switch directly between window cards, organize
      applications in a drawer, use a file shelf, and optionally suppress the native
      Dock.
