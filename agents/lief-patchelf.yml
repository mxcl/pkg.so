id: brew:lief-patchelf
display-name: lief-patchelf
repo: null
docs:
  - https://lief.re/doc/latest/tools/lief-patchelf/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Compatibility with the original NixOS patchelf command line is intended to make
      substitution straightforward. The supplied package record shows lief-patchelf as a
      standalone Homebrew formula, while the official documentation also supports
      building it directly with Cargo.
  package-nerd-significance:
    - >
      patchelf is a foundational packaging utility for repairing interpreter and
      runtime-library paths in prebuilt ELF software. lief-patchelf is significant
      because it offers a compatible implementation based on a cross-platform
      binary-instrumentation library and a Rust CLI, while remaining installable as its
      own package.
  project-history:
    - >
      The LIEF project introduced lief-patchelf in July 2025 as a more robust, modern,
      and maintainable implementation built on LIEF's binary-parsing and rewriting
      facilities. The tool lives inside the broader LIEF repository rather than as a
      separate upstream project.
  related-projects:
    - >
      NixOS/patchelf is the original implementation whose command-line interface
      lief-patchelf preserves.
    - >
      LIEF provides the executable-format parsing and modification foundation used by
      lief-patchelf.
  sources:
    - https://github.com/lief-project/LIEF/commit/7fce27408ad8ccef9ab10c3b324c556a018b349d
    - https://github.com/lief-project/LIEF/releases/tag/1.0.0
    - https://lief.re/doc/latest/tools/lief-patchelf/index.html
    - source_facts.package-manager
  summary:
    - >
      lief-patchelf is LIEF's Rust-based reimplementation of NixOS patchelf, a
      command-line utility for modifying properties of ELF executables and shared
      libraries. It intentionally preserves the original tool's command-line interface.
  timeline:
    - >
      2025: LIEF added lief-patchelf on July 12 as a LIEF-based implementation of NixOS
      patchelf.
    - >
      2026: LIEF 1.0.0 was released on July 12 with lief-patchelf included in the
      official tool documentation.
  usage:
    - >
      Users employ lief-patchelf through the familiar patchelf-style CLI to alter ELF
      metadata. The binary can also generate its own man page and completion scripts for
      bash, elvish, fish, PowerShell, and zsh.
related-packages:
  - id: brew:patchelf
    reason: >
      Choose the original NixOS patchelf for its established implementation, or
      lief-patchelf when you want the same command-line interface backed by LIEF and
      written in Rust.
    rel: alternative
    sources:
      - https://lief.re/doc/latest/tools/lief-patchelf/index.html
      - https://github.com/NixOS/patchelf
