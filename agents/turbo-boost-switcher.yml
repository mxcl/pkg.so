history:
  adoption-history:
    - >
      The project has been distributed in free and Pro editions. The free edition
      publishes its source, while the Pro edition adds automated switching rules and
      other convenience features. Its audience is limited to Intel Macs that implement
      Turbo Boost.
  package-nerd-significance:
    - >
      Turbo Boost Switcher is a characteristic macOS menu-bar power utility: it exposes
      a processor control normally hidden from desktop users and lets them trade peak
      performance for temperature, fan-noise, or battery considerations. It is also
      notable for relying on privileged kernel-level machinery.
  project-history:
    - >
      Rubén García Pérez created Turbo Boost Switcher after finding a kernel extension
      that could manipulate the processor register controlling Turbo Boost. He wrapped
      that mechanism in a status-bar application so users would not need to compile code
      or repeatedly operate it from a terminal.
  related-projects:
    - >
      The project's README credits nanoant's DisableTurboBoost.kext as the low-level
      work that inspired its implementation and osx-cpu-temp for temperature-related
      functionality. Turbo Boost Switcher Pro is the commercial companion edition.
  sources:
    - https://github.com/rugarciap/Turbo-Boost-Switcher
    - https://tbswitcher.rugarciap.com/
    - https://www.rugarciap.com/2016/06/turbo-boost-switcher-2-0-released/
    - https://www.rugarciap.com/faqs/
  summary:
    - >
      Turbo Boost Switcher is an open-source macOS status-bar application that enables
      or disables Intel Turbo Boost and displays processor-related status information.
  timeline:
    - '2016: The developer released the redesigned 2.0 generation in free and Pro editions.'
    - >
      2021: A release added customizable keyboard shortcuts and expanded automatic-mode
      controls.
    - '2022: The project added another CPU-load-based automatic mode to the Pro edition.'
    - >
      2025: The developer added AppleScript control and continued testing on
      contemporary macOS releases.
  usage:
    - >
      Users toggle Turbo Boost from the macOS status bar, optionally configure launch
      and restoration behavior, and monitor CPU temperature, load, frequency, and fan
      speed. Because the utility changes processor state through a kernel extension,
      macOS may request administrator authorization and explicit extension approval.
