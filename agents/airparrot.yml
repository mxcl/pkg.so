history:
  adoption-history:
    - >
      AirParrot became a practical way for Mac and Windows computers to transmit to
      Apple TV and later to Chromecast, AirPlay audio devices, and Squirrels' Reflector
      receiver. Later releases added selected-area and application mirroring, media
      streaming, subtitles, remote control integration, 4K output, and broader receiver
      compatibility.
  package-nerd-significance:
    - >
      AirParrot matters to package enthusiasts because it packages proprietary
      screen-casting protocol support into a small desktop utility, making computers
      useful as senders in mixed AirPlay and Google Cast environments. The Homebrew cask
      offers a reproducible installation route for the otherwise vendor-distributed Mac
      disk image.
  project-history:
    - >
      Squirrels launched AirParrot for Windows in June 2012, extending its desktop
      mirroring software beyond Mac. The official release history records AirParrot 2.0
      in November 2014 and AirParrot 3.0 in May 2020. AirParrot 3 was positioned as a
      paid major upgrade with lower latency, reduced CPU use, 4K media streaming,
      Windows extended-desktop support, and HomePod support.
  related-projects:
    - Reflector is Squirrels' complementary wireless-mirroring receiver.
    - AirParrot Remote provides remote control for AirParrot.
    - >
      Supported receiver ecosystems include Apple TV, Chromecast, and AirPlay-compatible
      audio devices.
  sources:
    - >
      Official launch release:
      https://press.airsquirrels.com/2012/06/reflection-and-airparrot-launch-on-windows-xpvista7
    - 'Official release notes: https://www.airsquirrels.com/airparrot/release-notes'
    - 'Official specifications: https://www.airsquirrels.com/airparrot/specs'
    - 'Official support: https://help.airsquirrels.com/airparrot/frequently-asked-questions'
  summary:
    - >
      AirParrot is Squirrels' proprietary desktop application for wirelessly mirroring a
      display or application and streaming media or audio from a Mac or Windows computer
      to compatible receivers.
  timeline:
    - '2012: Squirrels launched AirParrot for Windows.'
    - '2014-11-20: AirParrot 2.0 was released.'
    - '2016: AirParrot Remote integration arrived for AirParrot 2.'
    - '2020-05-26: AirParrot 3.0 was released.'
    - '2023-01-18: AirParrot 3.1.7 updated media playback support.'
  usage:
    - >
      Users run AirParrot from the desktop, select a display, application, area, media
      file, or audio-only mode, and choose one or more receivers on the local network.
      Automatic discovery normally requires the sender and receiver to share a subnet
      with Bonjour or mDNS multicast available; Quick Connect or Bluetooth discovery can
      cover some restricted-network cases.
