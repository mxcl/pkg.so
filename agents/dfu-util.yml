history:
  adoption-history:
    - >
      The official homepage names Openmoko Neo1973 and Freerunner among tested devices,
      then broadens the list to microcontroller boards, phones, DfuSe devices, STM32
      bootloaders, Black Magic Probe, Particle-era hardware, and other embedded targets.
      It also states that most Linux distributions ship dfu-util and that macOS users
      can install it through Homebrew or MacPorts.
  package-nerd-significance:
    - >
      dfu-util is a classic tiny-but-critical system package: it is not a framework, but
      it lets firmware projects document one portable command instead of vendor GUI
      steps. Its packaging matters because hardware instructions, board recovery guides,
      and CI-adjacent flashing scripts assume the binary can be installed from the
      user's normal OS package manager.
  project-history:
    - >
      The official manual records dfu-util as originally written for the OpenMoko
      project by Weston Schmidt and Harald Welte, with support added over time for DFU
      1.0, DFU 1.1, and ST's DfuSe variant. The project homepage also notes that Harald
      Welte's original work was partly based on dfu-programmer 0.4 and that the project
      is maintained by Tormod Volden.
  related-projects:
    - >
      dfu-programmer is related historically and functionally, while libusb provides the
      USB access layer used by dfu-util. ST DfuSe support gives dfu-util a bridge into
      many STM32-style firmware workflows.
  sources:
    - https://dfu-util.sourceforge.net/
    - https://dfu-util.sourceforge.net/dfu-util.1.html
    - https://dfu-util.sourceforge.net/dfuse.html
    - https://dfu-util.sourceforge.net/releases/
    - https://sourceforge.net/p/dfu-util/dfu-util/ci/master/tree/README?format=raw
  summary:
    - >
      dfu-util is the general-purpose host-side command-line utility for USB Device
      Firmware Upgrade. It downloads firmware to DFU-capable devices, uploads firmware
      from them, and ships companion tools for DFU suffix and prefix handling.
  timeline:
    - '2012: 0.5 and 0.7 release archives were published on the official release index.'
    - '2014: 0.8 release archive was published.'
    - '2016: 0.9 release archive was published.'
    - '2020: 0.10 release archive and binaries were published.'
    - '2021: 0.11 release archive and binaries were published.'
  usage:
    - >
      The man page documents the core package-manager-visible workflow: list attached
      DFU devices, select by USB identifiers, interface, path, or serial number, then
      upload with -U or download with -D. DfuSe usage adds address selection and
      modifiers such as leave, unprotect, and mass-erase for devices whose DFU behavior
      extends the base USB specification.
related-packages:
  - id: brew:dfu-programmer
    reason: >
      Choose dfu-programmer for supported Atmel USB bootloaders whose vendor-specific
      behavior is incompatible with standard DFU loaders; dfu-util is broader and
      standards-oriented.
    rel: alternative
    sources:
      - https://dfu-util.sourceforge.net/
      - https://github.com/dfu-programmer/dfu-programmer#readme
