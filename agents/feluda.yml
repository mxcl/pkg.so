id: brew:feluda
display-name: Feluda
repo: null
docs:
  - https://feluda.readthedocs.io/en/latest
  - https://github.com/anistark/feluda#readme
config-file-location:
  unix:
    - ./.feluda.toml
    - ./config/license_compatibility.toml
    - ~/.feluda/license_compatibility.toml
credentials-file-location:
  unix:
    - ./.feluda.toml
history:
  adoption-history:
    - >
      Official installation paths include Cargo and GitHub release packages for Debian
      and RPM systems. The README also documents community-maintained Homebrew, AUR, and
      NetBSD/pkgsrc packaging, with release tracking through GitHub releases and a
      release feed.
  package-nerd-significance:
    - >
      Feluda fits the recent package-manager interest in supply-chain metadata: it turns
      manifests and package metadata into license and SBOM outputs that can be run
      locally, in CI, or from a release artifact.
  project-history:
    - >
      The official README presents Feluda as actively developed but still experimental,
      with a fast iteration model. GitHub releases show a 1.0.0 release in January 2025
      and a 1.14.0 release in June 2026.
    - >
      The Read the Docs site frames the tool around scanning source trees across Rust,
      Node, Go, Python, C/C++, .NET, R, Java, Maven, Gradle, and Ruby ecosystems, then
      extending into SBOM and CI workflows.
  related-projects:
    - SPDX and CycloneDX are related SBOM formats supported by Feluda.
  sources:
    - https://github.com/anistark/feluda
    - https://raw.githubusercontent.com/anistark/feluda/main/README.md
    - https://feluda.readthedocs.io/en/latest/
    - https://github.com/anistark/feluda/releases
  summary:
    - >
      Feluda is a Rust command-line tool for dependency license analysis,
      license-restriction checks, compliance file generation, and SBOM generation.
  timeline:
    - '2025: 1.0.0 release published on GitHub.'
    - '2026: 1.14.0 released on 2026-06-26.'
  usage:
    - >
      Default usage scans a project path for dependency license information, with
      language selection, local-license detection, network lookup fallback, OSI approval
      filters, compliance file generation, and SPDX or CycloneDX SBOM output.
related-packages:
  - id: brew:syft
    reason: >
      Use Syft to catalogue a container image or filesystem, then pipe its SPDX output
      into Feluda to resolve licenses and enforce restrictive or incompatible-license
      policy.
    rel: adjacent_workflow
    sources:
      - https://github.com/anistark/feluda#readme
      - https://github.com/anchore/syft
  - id: brew:cargo-deny
    reason: >
      Choose cargo-deny for Rust-specific advisory, license, source, ban, and
      duplicate-dependency policy; choose Feluda for multi-ecosystem license and SBOM
      workflows.
    rel: alternative
    sources:
      - https://feluda.readthedocs.io/en/latest/
      - https://embarkstudios.github.io/cargo-deny/
