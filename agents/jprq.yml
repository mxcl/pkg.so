history:
  adoption-history:
    - >
      JPRQ sits in the same developer workflow niche as ngrok and other tunnel brokers:
      webhook testing, client demos, SSH or TCP exposure, and sharing localhost without
      a deployment. Its package footprint is smaller than jq or libjpeg, but Homebrew
      and Scoop packaging made it convenient for developers who prefer package-manager
      installation over curl scripts.
  package-nerd-significance:
    - >
      JPRQ is interesting to package watchers because it is part of the wave of small
      developer-networking CLIs that turned hosted tunnel services into installable
      local tools. Its history also shows the tension between open self-hostable code
      and a maintained hosted service.
  project-history:
    - >
      JPRQ started as an ngrok-style tunneling client, with early binaries published in
      2021. The 2.0 release in February 2023 was described by upstream as a complete
      rewrite that required GitHub authentication and installed binaries through an
      install script.
    - >
      The project then added practical local-development features: a debugger in 2.1, a
      built-in static file server and Homebrew installation notes in 2.2, custom-domain
      CNAME support in 2.3, debugger fixes in 2.4, and a macOS desktop app line in 2026.
  related-projects:
    - >
      Related projects include ngrok, localtunnel, Cloudflare Tunnel, inlets, and other
      localhost-to-public-network tunneling tools.
  sources:
    - https://dev.to/azimjohn/how-i-built-ngrok-alternative-3n0g
    - https://github.com/azimjohn/jprq
    - https://github.com/azimjohn/jprq/releases
    - https://jprq.io/
    - https://raw.githubusercontent.com/azimjohn/jprq/master/readme.md
  summary:
    - >
      JPRQ, short for Join Public Router Quickly, is a local-tunnel tool for exposing
      development servers to the public internet. The upstream README describes it as a
      free and open tool for exposing local servers and TCP protocols such as HTTP and
      SSH.
  timeline:
    - '2021-11-02: JPRQ Client Binaries 1.0.0 were published.'
    - '2023-02-27: jprq 2.0 was published as a complete rewrite.'
    - '2023-05-14: jprq 2.1 added a built-in debugger.'
    - '2023-10-17: jprq 2.2 added `jprq serve` and Homebrew installation notes.'
    - '2024-01-02: jprq 2.3 added custom-domain CNAME support.'
    - '2026-06-09: JPRQ Desktop 1.0.4 for macOS was published.'
  usage:
    - >
      Typical CLI usage authenticates with the service, then runs commands such as `jprq
      http 8000`, `jprq tcp 22`, `jprq http 3000 --debug`, or `jprq serve .`. The
      official site also presents a desktop workflow for tunnels, request inspection,
      replay, reserved subdomains, and custom domains.
related-packages:
  - id: brew:localtunnel
    reason: >
      Choose localtunnel for a minimal open-source HTTP-only localhost sharing workflow;
      choose JPRQ when TCP forwarding, integrated request debugging, or custom domains
      are needed.
    rel: alternative
    sources:
      - https://jprq.io/cli/
      - https://github.com/localtunnel/localtunnel#readme
  - id: brew:cloudflared
    reason: >
      Choose cloudflared for Cloudflare-managed, policy-aware, durable connectors;
      choose JPRQ for a development-focused tunnel workflow with built-in request
      inspection and replay-oriented tooling.
    rel: alternative
    sources:
      - https://jprq.io/
      - https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/
