      https://github.com/Aleph-One-Marathon/alephone/wiki/File-Locations
  summary:
    - >
      Marathon 2: Durandal is the second science-fiction first-person shooter in
      Bungie's Marathon trilogy. Its current all-in-one release uses Aleph One and
      offers both classic presentation and high-definition replacement assets.
  timeline:
    - "Original era: Bungie released Marathon 2 as the trilogy's second installment."
    - 'Open-source era: Its engine became the basis of Aleph One.'
    - >
      Modern distribution: The official release combines classic assets, optional
      high-definition assets, and cross-platform Aleph One packages.
  usage:
    - >
      Players install the standalone application for its campaign or multiplayer modes.
      The modern release supports classic or high-definition presentation, configurable
      controls, saves and recordings, plugins, community maps, and Aleph One's
      network-play facilities.
