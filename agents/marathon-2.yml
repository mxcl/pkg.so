history:
  adoption-history:
    - >
      The current official release uses Aleph One and combines the classic game with
      optional high-definition textures and monsters derived from the Xbox Live Arcade
      edition. Official packages are available for macOS, Windows, and Linux.
    - >
      The dedicated Homebrew cask recorded in source_facts.package-manager installs
      Marathon 2 independently from the other trilogy applications while retaining the
      common Aleph One implementation.
  package-nerd-significance:
    - >
      Marathon 2 is central to the trilogy's modern packaging because Aleph One is
      explicitly the open-source continuation of its engine. It demonstrates how one
      maintained engine can ship several separately named, scenario-specific
      applications with distinct preference paths.
  project-history:
    - >
      Marathon 2: Durandal is the second game in Bungie's Marathon trilogy. Its engine
      later became the foundation of Aleph One, which preserves and extends Marathon 2,
      Marathon Infinity, the original Marathon, and community scenarios across modern
      platforms.
  related-projects:
    - Marathon precedes it and Marathon Infinity concludes the original trilogy.
    - >
      Aleph One is the shared open-source engine; the modern Marathon 2 release also
      incorporates optional assets based on the Xbox Live Arcade edition.
  sources:
