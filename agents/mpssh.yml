config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The tool is deliberately thin: it executes the OpenSSH ssh binary directly, can
      scp a local script to each remote host before execution, supports per-host
      usernames and ports, host labels, output files, connection delays, and a
      configurable number of parallel ssh processes. It depends on existing passwordless
      authentication such as public keys or Kerberos rather than managing credentials
      itself.
  sources:
    - https://github.com/ndenev/mpssh
    - https://github.com/ndenev/mpssh/tags
    - https://raw.githubusercontent.com/ndenev/mpssh/master/README
    - https://raw.githubusercontent.com/ndenev/mpssh/master/mpssh.1
  summary:
    - >
      mpssh, short for Mass Parallel Secure Shell, is a small parallel-SSH
      administration tool by Nikolay Denev. Its README carries a 2005-2015 copyright
      notice and describes the program as connecting to many hosts from a hosts file,
      running the same command on all of them, and prefixing each output line with the
      hostname that produced it. GitHub tags show the 1.0, 1.1, 1.2, and 1.3 releases in
      September 2012, a 1.3.1 tag in January 2013, and 1.3.3 in June 2014.
  usage:
    - >
      mpssh sits in the old-school sysadmin niche alongside pssh, pdsh, and ad hoc shell
      loops: one command, many machines, minimal state. It is useful when the operator
      already has SSH trust configured and wants bounded parallelism, host-labeled
      output, and simple host grouping without adopting a configuration-management
      system.
related-packages:
  - id: brew:pssh
    reason: >
      Choose pssh when you want a maintained Python suite that also supplies parallel
      scp, rsync, and kill commands alongside parallel SSH.
    rel: alternative
    sources:
      - https://github.com/ParallelSSH/parallel-ssh
  - id: brew:pdsh
    reason: >
      Choose pdsh when you need a parallel remote shell designed around selectable
      remote-command modules and host-range expressions.
    rel: alternative
    sources:
      - https://github.com/chaos/pdsh
