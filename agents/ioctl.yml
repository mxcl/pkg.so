id: brew:ioctl
display-name: ioctl
repo: null
docs:
  - https://docs.iotex.io/
config-file-location:
  unix:
    - ~/.config/ioctl/default/config.default
credentials-file-location:
  unix:
    - ~/.config/ioctl/default
history:
  adoption-history:
    - >
      ioctl adoption tracks IoTeX ecosystem participation: developers use it to
      configure endpoints and interact with the chain, wallet users can create and
      inspect accounts, and delegates or node operators rely on command-line workflows
      around releases and network operations. The Homebrew formula makes the CLI
      available as a standard macOS package.
  package-nerd-significance:
    - >
      ioctl is a good example of a blockchain project CLI packaged separately from the
      node daemon but built from the same monorepo. For package maintainers, that means
      versioning, release assets, install scripts, and node/network compatibility all
      matter more than a normal standalone utility's flags.
    - >
      The name is also package-nerd bait: it collides conceptually with Unix `ioctl(2)`,
      but in Homebrew it is the IoTeX client executable. Context from docs and
      repository metadata is essential to avoid misclassifying it as a low-level Unix
      system tool.
  project-history:
    - >
      ioctl's history is coupled to iotex-core, the Go implementation of the IoTeX
      blockchain protocol. The IoTeX docs show `make ioctl` as the source-build path and
      the GitHub repository describes iotex-core as the official implementation of the
      protocol.
    - >
      The official reference includes a version example built in April 2019, which
      places the CLI in the early public mainnet era of IoTeX tooling. IoTeX project
      updates from that period discuss Mainnet Alpha launch preparation and delegate
      operations, the same operational context in which a chain CLI is needed.
    - >
      Over time, ioctl became a documented developer and operator tool rather than only
      a build artifact. The docs include install scripts, Homebrew installation,
      endpoint setup for mainnet and testnet gateways, update commands, and a reference
      tree covering the core blockchain interaction surface.
  related-projects:
    - iotex-core is the source repository and blockchain implementation that contains ioctl.
    - iotex-bootstrap documents node and network operation around iotex-core releases.
    - >
      IoTeX docs, IoTeXscan, staking tools, ioID, and W3bstream are adjacent ecosystem
      surfaces referenced from the ioctl documentation.
  sources:
    - https://community.iotex.io/t/official-iotex-project-updates/695
    - https://docs.iotex.io/blockchain/build/reference-docs/ioctl-client
    - https://docs.iotex.io/blockchain/build/web3-development/ioctl-cli
    - https://docs.iotex.io/blockchain/build/web3-development/ioctl-cli/installation
    - https://formulae.brew.sh/formula/ioctl
    - https://github.com/iotexproject/iotex-core
    - https://github.com/iotexproject/iotex-core/releases
  summary:
    - >
      ioctl is the command-line client for interacting with the IoTeX blockchain. It is
      built from the iotex-core repository and gives developers, node operators, and
      wallet users a terminal interface for installation checks, endpoint configuration,
      accounts, actions, queries, smart contracts, staking, tokens, ioID identities,
      W3bstream, DID, and JWT-related workflows.
  timeline:
    - >
      2018-2019: IoTeX project updates describe Mainnet Alpha preparation and launch-era
      network operations.
    - >
      2019-04: IoTeX docs show `ioctl version` output from client and server builds
      around Mainnet Alpha timing.
    - >
      2019 onward: Documentation organizes ioctl as the command-line client for
      accounts, actions, queries, smart contracts, staking, tokens, and identities.
    - 'Package-manager era: Homebrew provides the `ioctl` formula for installing the IoTeX CLI.'
    - >
      2026: iotex-core release notes continue to ship protocol releases from the same
      repository that contains the CLI.
  usage:
    - >
      Users install ioctl with the IoTeX install script, Homebrew, or a source build
      from iotex-core, then configure an endpoint such as the IoTeX mainnet or testnet
      gateway. The reference documents `ioctl config`, `ioctl update`, `ioctl version`,
      and command groups for accounts, queries, actions, smart contracts, staking,
      tokens, and identity-related features.
related-packages: []
