history:
  adoption-history:
    - >
      JPEG XL adoption has been both standards-driven and package-driven. The official
      JPEG site positions it for responsive web delivery, professional photography, wide
      color gamut, high dynamic range, alpha, animation, lossless coding, progressive
      coding, and lossless recompression of existing JPEG files.
    - >
      The libjxl README documents availability through Linux distributions and Homebrew,
      with Debian-style packages installing tools such as cjxl and djxl. The repository
      also points to application integrations, plugins, examples, a community site, and
      discussion channels, reflecting a codec ecosystem rather than a single binary.
  package-nerd-significance:
    - >
      jpeg-xl is important because it packages an active image standard, not merely an
      implementation. Installing it gives users the reference codec, benchmark and
      quality tools, and the command-line handles needed to test JPEG XL workflows
      before or alongside application-level support.
    - >
      It is also a case study in codec packaging tension: standards work,
      browser/application adoption, conformance testing, patents/licensing, and distro
      integration all matter before a new image format feels real to users.
  project-history:
    - >
      JPEG XL grew through the JPEG committee standardization process. The official
      documentation lists an April 2018 final call for proposals and March 2019
      use-cases and requirements work. The official workplan lists the file format
      edition from 2021, core coding and conformance editions from 2022, and reference
      software as ISO/IEC 18181-4:2022.
    - >
      The libjxl repository is the reference implementation for JPEG XL, including
      encoder and decoder libraries plus command-line tools. Its README states that
      files encoded with cjxl conform to the JPEG XL specification and can be decoded by
      future djxl decoders or the libjxl decoding library.
  related-projects:
    - libjxl is the reference software implementation for JPEG XL.
    - The official JPEG software page also lists jxl-rs, jxl-oxide, and libjxl/conformance.
    - jpegli is identified by the libjxl README as continuing in google/jpegli.
    - >
      JPEG XL is related to legacy JPEG through its lossless JPEG transcoding and
      reconstruction feature.
  sources:
    - https://formulae.brew.sh/formula/jpeg-xl
    - https://github.com/libjxl/libjxl
    - https://github.com/libjxl/libjxl#readme
    - https://github.com/libjxl/libjxl/releases
    - https://jpeg.org/jpegxl/documentation.html
    - https://jpeg.org/jpegxl/index.html
    - https://jpeg.org/jpegxl/software.html
    - https://jpeg.org/jpegxl/workplan.html
  summary:
    - >
      JPEG XL is the ISO/IEC 18181 still-image coding system and libjxl is its
      open-source reference implementation. In package-manager terms, the Homebrew
      jpeg-xl formula exposes the practical tools around the standard, especially cjxl
      for encoding and djxl for decoding.
  timeline:
    - >
      2018: JPEG issued the final call for proposals for a next-generation image coding
      standard.
    - >
      2019: JPEG XL use cases and requirements were documented at the March 2019 Geneva
      meeting.
    - '2021: ISO/IEC 18181-2:2021 file format edition was published.'
    - >
      2022: JPEG XL was standardized as ISO/IEC 18181, with core coding, conformance,
      and reference software parts in the 2022 generation.
    - '2024: ISO/IEC 18181-1:2024 published a second edition of the core coding system.'
    - '2025: ISO/IEC 18181-3:2025 published a second edition of conformance testing.'
    - '2026: ISO/IEC 18181-2:2026 appeared as a third edition file-format publication.'
  usage:
    - >
      Users encode with commands such as cjxl input.png output.jxl and decode with djxl
      input.jxl output.png. For JPEG input, libjxl can losslessly recompress an existing
      JPEG into JPEG XL and later reconstruct the original JPEG bitstream.
related-packages:
  - id: brew:webp
    reason: >
      Choose WebP when broad established browser support is more important than JPEG
      XL's reversible JPEG transcoding and newer high-fidelity feature set.
    rel: alternative
    sources:
      - https://jpeg.org/jpegxl/index.html
      - https://developers.google.com/speed/webp/
  - id: brew:libavif
    reason: >
      Choose libavif when you need command-line and library support for the AV1-derived
      AVIF format instead of the JPEG XL coding system.
    rel: alternative
    sources:
      - https://jpeg.org/jpegxl/index.html
      - https://github.com/AOMediaCodec/libavif
  - id: brew:exiftool
    reason: >
      ExifTool complements libjxl by reading and writing metadata in JPEG XL files, an
      integration documented by libjxl's official software-support list.
    rel: adjacent_workflow
    sources:
      - https://github.com/libjxl/libjxl/blob/main/doc/software_support.md
      - https://exiftool.org/
