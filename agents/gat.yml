config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through the author's Homebrew tap, Homebrew
      core, `go install`, and GitHub release binaries. That places gat in the same
      terminal-tool packaging niche as other enhanced `cat` replacements, but with a
      small Go binary distribution story.
  package-nerd-significance:
    - >
      gat is package-nerd-relevant as another entry in the long-running ecosystem of
      `cat` replacements, but its mix of terminal image support, Markdown rendering, and
      built-in token masking makes it more than a straight colorizer.
  project-history:
    - >
      The project started publicly in March 2023 and released v0.1.0 the same day. Its
      official README describes it as a cat alternative written in Go and documents a
      steady release series through the 0.x line.
  related-projects:
    - >
      gat relates to traditional Unix `cat`; the official sources describe it
      generically as a cat alternative rather than positioning it against a specific
      competing package.
  sources:
    - https://github.com/koki-develop/gat
    - https://github.com/koki-develop/gat/releases
  summary:
    - >
      gat is a Go implementation of a modern `cat`-style terminal file viewer. It keeps
      the familiar single-command file display model while adding syntax highlighting,
      Markdown rendering, image display for Sixel-capable terminals, pretty printing,
      and secret masking.
  timeline:
    - '2023: Public GitHub repository created.'
    - '2023: v0.1.0 released.'
    - '2025: v0.20.x releases continued the 0.x series.'
  usage:
    - >
      Users run `gat` with one or more files and optional flags for language selection,
      output format, themes, Markdown rendering, nonprinting character display, and
      secret masking. Environment variables such as `GAT_FORMAT` and `GAT_THEME` can
      provide defaults for output style.
related-packages:
  - id: brew:bat
    reason: >
      Choose bat for a mature cat-compatible viewer with Git change markers, paging, and
      a broad integration ecosystem; choose gat when Markdown, terminal images, or
      built-in secret masking are central.
    rel: alternative
    sources:
      - https://github.com/koki-develop/gat#readme
      - https://github.com/sharkdp/bat#readme
  - id: brew:glow
    reason: >
      Choose Glow when the task is specifically browsing and rendering Markdown through
      a dedicated TUI; gat is the broader file viewer that offers Markdown as one mode.
    rel: alternative
    sources:
      - https://github.com/koki-develop/gat#readme
      - https://github.com/charmbracelet/glow#readme
