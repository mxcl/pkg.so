id: brew:bsdsfv
display-name: BSDSFV
repo: https://sourceforge.net/p/bsdsfv/code
docs:
  - https://bsdsfv.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project predates modern forge and package registry conventions, but it
      survived in Unix package managers as a compact checksum utility. The Homebrew
      input also records MacPorts packaging, which is typical for old C command-line
      tools that remained useful without active feature churn.
  package-nerd-significance:
    - >
      For package-history nerds, BSDSFV is a time capsule of early-2000s
      file-verification culture: tiny C source, SourceForge distribution, SFV
      interoperability, and FTP-site automation all in one formula-sized package.
  project-history:
    - >
      The project published source tarballs on SourceForge from at least June 2000
      through November 2003. The README in the 1.18 source archive says this version was
      based on pdsfv by hoopy, with additional features, performance tuning, and
      cleanup.
    - >
      BSDSFV targeted the SFV workflow common in FTP and release-distribution scenes:
      create SFV files, verify single files or whole releases, add banners, and
      interoperate with other SFV tools including an SFVNIX compatibility mode.
  related-projects:
    - pdsfv is named in the BSDSFV README as the codebase BSDSFV was based on.
    - >
      SFVNIX is named by the official page as a compatibility target for SFV files
      created by BSDSFV.
    - glFTPd is named by the official page as an integration target for site automation.
  sources:
    - >
      Official homepage describes SFV creation, verification, SFVNIX compatibility, and
      glFTPd support: https://bsdsfv.sourceforge.net/
    - Package-manager adoption from source_facts.package-manager.
    - >
      SourceForge RSS feed lists releases from 1.0.0 in 2000 through 1.18 in 2003:
      https://sourceforge.net/projects/bsdsfv/rss?path=/
    - >
      The 1.18 source README says BSDSFV was based on pdsfv by hoopy:
      https://sourceforge.net/projects/bsdsfv/files/bsdsfv/1.18/bsdsfv-1.18.tar.gz/download
  summary:
    - >
      BSDSFV is a small SourceForge-era command-line utility for creating and checking
      SFV checksum files. Its official page positions it as an all-in-one SFV tool for
      local use, site operators, packagers, and download verification.
  timeline:
    - '2000: SourceForge file feed lists bsdsfv-1.0.0.tar.gz.'
    - '2001: Version 1.0.12 was published on SourceForge.'
    - '2002: README in the source archive records the pdsfv lineage.'
    - '2003: Version 1.18 was published on SourceForge.'
  usage:
    - >
      BSDSFV is used from the shell to generate or verify SFV files, especially when
      checking that a release directory or downloaded file set matches expected CRC32
      checksums. The official page also calls out glFTPd integration and
      count-missing-files support for race scripts.
related-packages:
  - id: brew:cksfv
    reason: >
      cksfv performs the same CRC32-based SFV creation and verification tasks and is a
      stronger choice when recursive checking and broader modern Unix packaging are
      useful.
    rel: alternative
    sources:
      - https://bsdsfv.sourceforge.net/
      - https://zakalwe.fi/~shd/foss/cksfv
      - https://gitlab.com/heikkiorsila/cksfv/-/blob/master/cksfv.1
