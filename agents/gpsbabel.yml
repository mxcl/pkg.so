history:
  adoption-history:
    - >
      GPSBabel became a standard bridge in geocaching, mapping, and GPS-device workflows
      because it solved the unglamorous but persistent problem of converting proprietary
      GPS data into portable formats such as GPX and KML.
    - >
      Lipe's project history notes use by Google Earth and GSAK, plus coverage in
      mapping and GPS books and Linux publications. The package appears in many
      Unix-like package managers, reflecting its role as a reusable plumbing tool rather
      than a single-vendor application.
  package-nerd-significance:
    - >
      GPSBabel matters to package-manager culture because it is classic Unix glue: a
      small executable with many format adapters that lets old devices, proprietary
      vendor formats, GPX, KML, GIS tools, and geocaching workflows coexist.
    - >
      It is also a useful packaging stress test. Builds have historically needed
      USB/Garmin support, Qt GUI pieces, platform-specific installers, and a large
      matrix of format tests while still exposing a simple CLI.
  project-history:
    - >
      Robert Lipe describes GPSBabel as growing out of his own frustration in late 2001
      with Unix and Linux tools for transferring waypoints to a Magellan 330 for
      geocaching. The idea was to normalize the small set of information needed to
      represent a waypoint, then connect readers and writers for many formats around
      that common model.
    - >
      The first public GPSBabel release was made on SourceForge in July 2002. Lipe's
      history page says that release was Unix-only and supported ten formats:
      Geocaching.com LOC, GPSman, GPX 1.0, Magellan Serial, Mapsend, Mapsource, PCX,
      GPSUtil, Tiger, and CSV.
    - >
      The project later moved source development to GitHub while the gpsbabel.org site
      remained the authoritative documentation and release surface. Its change log shows
      years of format support, GPX/KML work, Garmin handling, GUI and build-system
      maintenance, and cross-platform packaging.
  related-projects:
    - GPX is a major interchange format in GPSBabel workflows.
    - >
      Google Earth and KML are recurring GPSBabel targets in the official history and
      change log.
    - GSAK is named by the project history as a program using GPSBabel.
    - >
      OpenStreetMap-style workflows commonly depend on GPX conversion, even when
      GPSBabel is only one step in the toolchain.
  sources:
    - https://github.com/GPSBabel/gpsbabel
    - https://www.gpsbabel.org/capabilities.html
    - https://www.gpsbabel.org/changes.html
    - https://www.gpsbabel.org/people/robertlipe.html
  summary:
    - >
      GPSBabel is a long-running command-line and graphical utility for moving GPS
      waypoints, tracks, and routes between consumer GPS devices, GPX, geocaching files,
      mapping programs, and many vendor-specific formats.
  timeline:
    - '2001: Robert Lipe buys a Magellan 330 and starts from waypoint-transfer frustration.'
    - '2002: First public GPSBabel release appears on SourceForge with ten supported formats.'
    - '2010: GPSBabel 1.4.0 release series includes continued GUI and format work.'
    - '2014: GPSBabel 1.5.0 release series continues GPX, NMEA, device, and GUI maintenance.'
    - '2016: GPSBabel 1.5.4 release notes include GPX metadata and device fixes.'
    - >
      2019: Change-log maintenance folds 2017-2019 development entries into the public
      changes page.
  usage:
    - >
      Package users generally invoke the `gpsbabel` executable in scripts or shell
      pipelines to read one GPS/file format, apply filters, and write another format.
      Typical jobs include downloading waypoints from older GPS receivers, converting
      geocache files, exporting tracks to GPX, and preparing KML for map viewers.
    - >
      The official capabilities page is central to real use: users pick a supported
      reader/writer pair, then consult the generated HTML documentation for options
      specific to a device or file format.
