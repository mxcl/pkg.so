config-file-location:
  unix:
    - <project>/.codebuddy/rules/*/RULE.mdc
    - <project>/CODEBUDDY.md
  windows:
    - <project>\.codebuddy\rules\*\RULE.mdc
    - <project>\CODEBUDDY.md
credentials-file-location: null
history:
  adoption-history:
    - >
      CodeBuddy is offered as both a desktop IDE for Windows and macOS and a
      command-line product installed from npm. The desktop product targets developers as
      well as product managers, designers, and programming beginners.
  package-nerd-significance:
    - >
      The package is part of the newer generation of AI-native editors that combine
      repository-aware chat, predictive completion, agent workflows, design-to-code
      tooling, and deployment integrations in a single desktop application.
  project-history:
    - >
      Tencent Cloud launched CodeBuddy as an AI-assisted programming product. Its
      official documentation presents a two-part product family: CodeBuddy IDE for
      integrated product, design, development, and deployment work, and CodeBuddy Code
      for command-line automation.
  related-projects:
    - >
      The IDE integrates with Figma, CloudBase, Supabase, CloudStudio, EdgeOne Pages,
      MCP services, and common source-control workflows.
  sources:
    - https://www.codebuddy.ai/docs/ide/Introduction
    - https://www.codebuddy.ai/docs/ide/User-guide/Overview
    - https://www.codebuddy.ai/docs/ide/User-guide/Rules
  summary:
    - >
      CodeBuddy IDE is Tencent Cloud's AI-powered development environment covering
      requirements, design, coding, debugging, and deployment workflows.
  timeline:
    - >
      2026: Official documentation describes CodeBuddy as a combined IDE and CLI product
      family
  usage:
    - >
      Users open or clone a local project and work with AI through completion, inline
      chat, Ask, Craft, Plan, or agent modes. Project rules may be stored under
      .codebuddy/rules, while CODEBUDDY.md supplies simpler repository-level
      instructions.
