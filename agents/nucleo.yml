history:
  adoption-history:
    - >
      Nucleo developed into a combined icon library and icon-management application for
      designers and developers. Its workflows cover searching, organizing, customizing,
      and exporting icons into formats used by design systems and web applications.
    - >
      Team users originally shared projects through third-party cloud services such as
      Dropbox. Nucleo v4 moved team-project synchronization onto Nucleo's own servers
      and introduced editor and read-only roles.
  package-nerd-significance:
    - >
      Nucleo is of interest as a specialist asset manager that bridges packaged SVG
      libraries and application-development outputs. It can export ordinary SVG assets
      as well as SVG sprites, icon fonts, and components for frameworks such as React
      and Vue.
  project-history:
    - >
      Nucleo v1 launched around 2013. Over the following decade, the product combined a
      growing commercial icon catalog with native icon-management applications.
    - >
      Nucleo v4, introduced in 2023, redesigned the macOS and Windows applications,
      added first-party team synchronization and role management, refreshed the brand,
      and introduced the Nucleo UI icon system.
  related-projects:
    - >
      Nucleo UI: An icon system introduced alongside Nucleo v4 and distributed through
      the application.
    - 'React and Vue: Application-component export targets supported by Nucleo.'
    - >
      Dropbox: A former third-party synchronization option superseded by Nucleo's
      first-party team syncing.
  sources:
    - 'Official Nucleo v4 announcement: https://nucleoapp.com/blog/post/introducing-nucleo-v4'
    - 'Official application guide: https://nucleoapp.com/support'
  summary:
    - >
      Nucleo is a cross-platform icon library and asset-management application for
      organizing, customizing, collaborating on, and exporting icon collections.
  timeline:
    - >
      2013: Nucleo v1 launched, according to the official ten-year retrospective
      published in 2023.
    - >
      2023: Nucleo v4 introduced a redesigned native application, first-party team
      syncing, role management, new branding, and the Nucleo UI library.
  usage:
    - >
      Designers and developers import or browse icon sets, group icons into projects,
      adjust visual properties, and export assets as SVG, sprites, icon fonts, or
      framework components. Team plans synchronize shared projects and apply editor or
      read-only roles.
