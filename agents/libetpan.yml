history:
  adoption-history:
    - >
      The etpan.org project page identifies LibEtPan as the low-level API used by
      MailCore and MailCore 2, then lists downstream use in Mac and iOS mail
      applications as well as Claws Mail and other clients. That placement gave it a
      long life as a reusable mail-protocol layer below application-specific user
      interfaces.
  package-nerd-significance:
    - >
      For package maintainers, LibEtPan is a dense networking library with many optional
      protocol surfaces: SSL/TLS, SASL, local mailbox formats, MIME generation, and
      multiple server quirks. Its ChangeLog shows the maintenance style of a real mail
      library, with repeated compatibility work for specific IMAP servers and encodings.
  project-history:
    - >
      The project presents itself as a portable and efficient framework for mail access
      in C. Its older NEWS file records releases in the 0.28 to 0.45 range during
      2003-2006, with early work on IMAP fixes, maildir support, MIME parsing, Berkeley
      DB-backed caches, SSL/TLS, SASL, PGP/S/MIME, Windows support, and
      cross-compilation.
  related-projects:
    - >
      The project page explicitly connects LibEtPan to MailCore and MailCore 2. Its
      feature list also places it near mail clients and libraries that need IMAP, SMTP,
      POP, NNTP, mbox, MH, Maildir, MIME, and RFC 822 handling.
  sources:
    - https://github.com/dinhvh/libetpan
    - https://github.com/dinhvh/libetpan/tags
    - https://raw.githubusercontent.com/dinhvh/libetpan/master/ChangeLog
    - https://raw.githubusercontent.com/dinhvh/libetpan/master/NEWS
    - https://www.etpan.org/libetpan.html
  summary:
    - >
      LibEtPan is a portable C mail framework for IMAP, SMTP, POP, NNTP, local mailbox
      formats, MIME, and RFC 822 style message handling.
  timeline:
    - '2003: The NEWS file records libEtPan 0.28 on April 1, 2003 and 0.29 on October 6, 2003.'
    - >
      2005: The NEWS file records versions 0.36 through 0.41, including Windows support,
      SASL, S/MIME, and PGP work.
    - >
      2011: The ChangeLog records libetpan 1.1 on July 12, 2011 with IMAP NAMESPACE,
      SMTP SIZE, and progress-report API improvements.
    - '2013: The 1.2 tag was dated June 4, 2013 on GitHub.'
    - '2014: The 1.5 and 1.6 tags were dated May 5, 2014 and October 31, 2014.'
    - '2019: The 1.9.4 tag was dated November 1, 2019.'
    - >
      2026: The 1.10 tag was dated May 22, 2026, and the repository page listed a 1.10.1
      release dated June 14, 2026.
  usage:
    - >
      LibEtPan is used either as a C library linked through pkg-config or through
      platform project files for macOS, iOS, and Windows. The upstream site includes
      examples for composing MIME/RFC 2822 messages, downloading IMAP and POP messages,
      and sending SMTP mail.
related-packages:
