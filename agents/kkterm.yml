history:
  adoption-history:
    - >
      KKTerm is packaged as a desktop application and through Homebrew. Its audience is
      system administrators, homelab operators, and developers who want several
      remote-access and operations tools in one local workspace.
  package-nerd-significance:
    - >
      KKTerm is notable as a local-first consolidation of terminal, file-transfer,
      remote-desktop, dashboard, and AI-assistance workflows. It targets the space
      traditionally occupied by separate terminal emulators, SSH profile managers, SFTP
      clients, and remote-administration suites.
    - >
      Its explicit separation of non-secret connection metadata from credential backends
      is relevant to users evaluating how administration tools persist sensitive
      connection data.
  project-history:
    - >
      KKTerm is an open-source desktop administration workspace built with Tauri, Rust,
      React, and TypeScript. Its official materials frame a durable saved target as a
      Connection and a live invocation as a Session, reflecting a workspace-oriented
      design rather than a single-terminal model.
    - >
      The project grew to cover local terminals, SSH, SFTP/FTP, serial access, RDP/VNC,
      dashboards, connection import, encrypted credential storage, AI tooling, and a
      built-in MCP server.
  related-projects:
    - >
      The product documentation describes interoperability with OpenSSH configuration
      and imports from RDCMan, MobaXterm, and PuTTY.
    - >
      Its terminal and coding-tool workflows recognize tools including Codex, Claude
      Code, Gemini CLI, tmux, WezTerm, Alacritty, and common shells.
  sources:
    - >
      Official connections manual:
      https://github.com/ryantsai/KKTerm/blob/main/docs/manual/03-connections.md
    - 'Official project documentation: https://ryantsai.github.io/KKTerm/'
    - 'Official repository and README: https://github.com/ryantsai/KKTerm'
  summary:
    - >
      KKTerm is an open-source, local-first administration workspace combining local
      terminals, saved remote connections, SSH and file transfer, remote desktop access,
      dashboards, installation helpers, and AI-assisted workflows.
  timeline:
    - >
      Initial project direction: KKTerm was established as a unified local-first
      terminal and remote-administration workspace.
    - >
      Later development: The scope expanded to connection imports, remote desktop and
      file-transfer protocols, encrypted credential backends, AI providers, and MCP
      integration.
  usage:
    - >
      Users create durable Connections for local shells or remote services, organize
      them into workspaces and folders, and open live Sessions in tabs. Quick Connect
      can save and immediately open a target, while import tools accept formats
      including OpenSSH config, RDCMan, MobaXterm, and PuTTY exports.
    - >
      Passwords may be entered interactively or linked to centrally managed Saved
      Credentials. The official manual says non-secret connection data is persisted
      separately while secret values remain in the selected credential backend.
