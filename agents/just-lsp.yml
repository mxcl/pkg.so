history:
  adoption-history:
    - >
      just-lsp adoption follows editor adoption of `justfile` automation. Its README
      documents installation through Cargo, Homebrew, Arch Linux, Mason for Neovim, and
      prebuilt binaries for Linux, macOS, and Windows. The input package metadata also
      shows packaging in Alpine, Homebrew, Nix, and Arch.
    - >
      The official repository metadata showed more than 300 GitHub stars on 2026-07-01,
      which is modest but meaningful for a language server dedicated to one task-runner
      file format.
  package-nerd-significance:
    - >
      just-lsp is a small sign of `just` becoming infrastructure rather than a personal
      helper binary. Once a file format gets a language server, package maintainers and
      editor users start treating it as a language with syntax, diagnostics, and tooling
      expectations.
    - >
      For package nerds, it is also an example of the LSP pattern spreading from
      programming languages to configuration and automation files.
  project-history:
    - >
      The just-lsp repository was created on 2022-02-12 by Liam Scalzulli. It appeared
      after `just` had become a popular Make-like command runner and after Language
      Server Protocol tooling had become the normal way to add editor intelligence
      without writing editor-specific plugins.
    - >
      The project is intentionally narrow: it tracks the syntax and builtin surface of
      `just` and exposes it through the Language Server Protocol. The `just` manual
      includes a language-server page that points users to just-lsp for
      go-to-definition, inline diagnostics, and code completion.
  related-projects:
    - just is the command runner and file format that just-lsp serves.
    - The Language Server Protocol is the editor protocol just-lsp implements.
    - >
      Mason is a Neovim package manager that the just-lsp README documents as an
      installation path.
    - >
      tree-sitter grammar work around justfiles is adjacent because syntax awareness is
      central to editor tooling.
  sources:
    - https://api.github.com/repos/terror/just-lsp
    - https://github.com/terror/just-lsp
    - https://github.com/terror/just-lsp/releases
    - https://just.systems/man/en/language-server-protocol.html
    - https://microsoft.github.io/language-server-protocol/
    - https://raw.githubusercontent.com/terror/just-lsp/master/README.md
  summary:
    - >
      just-lsp is a Rust language-server implementation for `just` files. It brings
      editor features such as completion, hover documentation, go-to-definition,
      diagnostics, rename, references, semantic highlighting, folding, formatting, and
      code actions to `justfile` workflows.
  timeline:
    - '2022-02-12: The just-lsp GitHub repository is created.'
    - '2026-02-04: just-lsp 0.3.3 is published on GitHub.'
    - '2026-03-16: just-lsp 0.4.0 is published on GitHub.'
    - '2026-06-16: just-lsp 0.4.7 is published on GitHub.'
  usage:
    - >
      Users install `just-lsp`, configure their editor's LSP client for `justfile`
      files, and get structured diagnostics and navigation while editing recipes. It is
      especially useful in repositories where the justfile has grown beyond a small list
      of shell snippets.
    - >
      Because formatting delegates to `just --fmt --unstable`, just-lsp sits beside the
      `just` binary rather than replacing its parser and formatter as the authority for
      the language.
related-packages:
  - id: brew:just
    reason: >
      Install just alongside just-lsp to execute recipes and provide the formatter that
      just-lsp invokes for editor formatting.
    rel: adjacent_workflow
    sources:
      - https://github.com/terror/just-lsp#readme
      - https://just.systems/man/en/language-server-protocol.html
      - https://github.com/casey/just#readme
