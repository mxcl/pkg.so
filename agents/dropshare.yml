history:
  adoption-history:
    - >
      Dropshare expanded from a native macOS utility to an ecosystem covering macOS,
      iOS, and Android. Its official documentation lists integrations with dozens of
      object-storage, file-storage, image-hosting, and protocol-based destinations.
  package-nerd-significance:
    - >
      Dropshare appeals to users who want ShareX-style immediacy on Apple platforms
      while retaining control over storage. Its support for S3-compatible services,
      SFTP, WebDAV, custom APIs, URL-scheme automation, a command-line helper, and MCP
      makes it unusually adaptable for a desktop sharing utility.
  project-history:
    - >
      The official site describes Dropshare as established in 2013 and implemented as a
      native application. Continued development added screenshot and screen-recording
      workflows, customizable landing pages, mobile clients, automation interfaces, and
      broad storage-provider support.
  related-projects:
    - >
      Integrates with S3-compatible object stores, Google Drive, Dropbox, OneDrive, Box,
      Nextcloud, SFTP, SCP, FTP, WebDAV, custom upload APIs, Raycast, Clop, and MCP
      clients.
  sources:
    - https://dropshare.app/
    - https://kb.dropshare.app/how-to/how-can-i-enable-dropshare-integrations.html
    - https://kb.dropshare.app/set-up-an-upload-connection/availability-matrix.html
    - https://kb.dropshare.app/start.html
  summary:
    - >
      Dropshare is a cross-platform capture, upload, and link-sharing application
      centered on a macOS menu-bar workflow and user-selected storage providers.
  timeline:
    - '2013: Dropshare is established as a native Mac file-sharing application.'
    - '2024: Official CLI instructions document manual installation for modern macOS releases.'
    - >
      2026: The official guide documents macOS, iOS, and Android clients plus broad
      storage-provider support.
  usage:
    - >
      A user configures a cloud account, object store, image host, WebDAV endpoint, or
      self-hosted server, then uploads files through drag-and-drop, keyboard shortcuts,
      the share menu, screenshots, recordings, Shortcuts, the `ds` command, or the
      application's URL scheme.
