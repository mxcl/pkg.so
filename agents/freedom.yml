history:
  adoption-history:
    - >
      Freedom says the product grew from a small idea in Chapel Hill, North Carolina
      into a cross-device focus service used by millions worldwide.
  package-nerd-significance:
    - >
      Freedom is representative of commercial distraction-blocking utilities packaged
      for desktop systems: the Homebrew cask supplies the native client, while
      blocklists, schedules, devices, and session records are managed through the
      broader Freedom account service.
  project-history:
    - >
      Freedom was created to address digital distraction and evolved from a simple focus
      tool into a multi-device service for blocking websites, applications, and internet
      access.
  related-projects:
    - >
      Freedom participates in the broader category of focus timers, website blockers,
      application blockers, and digital-wellness software.
  sources:
    - 'Official About page: https://freedom.to/about'
    - 'Official Help Center: https://support.freedom.to/'
    - >
      Official first-year retrospective:
      https://freedom.to/blog/looking-back-at-freedoms-first-year/
    - >
      Official getting-started guide:
      https://support.freedom.to/en/articles/4385673-how-to-get-started-with-freedom
  summary:
    - >
      Freedom is a commercial focus and digital-wellness service whose desktop client
      blocks distracting websites and applications according to user-created sessions
      and schedules.
  timeline:
    - '2010s: Freedom emerged from Chapel Hill as a tool for reducing digital distraction.'
    - "2016: Freedom published a retrospective on the product's first year."
    - >
      Current era: Freedom operates across desktop and mobile platforms and reports
      millions of users worldwide.
  usage:
    - >
      Users create an account, define blocklists, attach devices, and start immediate,
      delayed, recurring, or always-active blocking sessions. Session history and
      controls are available through the Freedom dashboard.
