id: brew:certigo
display-name: certigo
repo: null
docs:
  - https://github.com/square/certigo#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      certigo moved beyond a GitHub-only utility into regular package-manager channels.
      The supplied package facts list APK, Homebrew, MacPorts, Nix, and Scoop, and the
      README itself documents Homebrew installation for macOS.
  package-nerd-significance:
    - >
      Package nerds care about certigo because it packages a practical slice of TLS
      troubleshooting into one portable CLI. It handles formats and protocols that
      otherwise push users toward several different OpenSSL, keytool, and ad hoc shell
      invocations.
  project-history:
    - >
      The public repository was created in 2016 under square/certigo and has continued
      to receive upstream releases, including v1.18.0 in 2026. The project is written in
      Go and documents Go module-based development.
  related-projects:
    - >
      The README examples pair certigo JSON output with jq, and its feature set overlaps
      with OpenSSL and Java keystore inspection workflows.
  sources:
    - https://api.github.com/repos/square/certigo
    - https://github.com/square/certigo
    - https://github.com/square/certigo#readme
    - https://formulae.brew.sh/api/formula/certigo.json
  summary:
    - >
      certigo is Square's certificate inspection and validation CLI. Its README
      positions it as a debugging tool for SSL/TLS issues, with support for common
      certificate and keystore formats, remote TLS connections, StartTLS protocols,
      validation, linting, and JSON output.
  timeline:
    - '2016: Public GitHub repository created.'
    - '2022: v1.16.0 released.'
    - '2025: v1.17.x releases published.'
    - '2026: v1.18.0 released.'
  usage:
    - >
      certigo is commonly used to dump certificate files and keystores, connect to
      servers to inspect and verify TLS chains, and verify certificate chains against
      expected names. Its JSON output makes it scriptable with tools such as jq.
related-packages:
  - id: brew:step
    reason: >
      Choose step when you want certificate inspection and verification within a broader
      PKI toolkit that also covers certificate creation, trust stores, ACME, JWT, and
      SSH certificates.
    rel: alternative
    sources:
      - https://smallstep.com/docs/step-cli/
      - https://smallstep.com/docs/step-cli/reference/certificate/inspect/
      - https://github.com/square/certigo#readme
  - id: brew:openssl@3
    reason: >
      Choose OpenSSL when you need the standard low-level certificate, key, protocol,
      and cryptographic command suite rather than certigo's focused, format-detecting
      inspection interface.
    rel: alternative
    sources:
      - https://docs.openssl.org/3.6/man1/openssl-x509/
      - https://docs.openssl.org/3.6/man1/openssl-verify/
      - https://github.com/square/certigo#readme
  - id: brew:jq
    reason: >
      certigo's official README recommends jq for filtering its JSON certificate output,
      such as selecting weak signatures or CA certificates from a bundle.
    rel: adjacent_workflow
    sources:
      - https://github.com/square/certigo#readme
      - https://jqlang.github.io/jq/manual/
tags:
  - certificates
  - cli
  - debugging
  - tls
  - validation
  - x509
