credentials-file-location: null
history:
  adoption-history:
    - >
      Notes developed a visible open-source community around its Qt codebase, with many
      contributors and packaging for Linux, macOS, and Windows. The official
      repository's thousands of stars and hundreds of forks indicate meaningful adoption
      among users seeking a native, private desktop notes application.
  package-nerd-significance:
    - >
      Notes is a cross-platform native application written in C++ and Qt rather than a
      browser-shell application. Its shared Unix-style storage path and support for
      traditional desktop packaging make it notable to users who value inspectable local
      state and consistent behavior across operating systems.
  project-history:
    - >
      Notes was built as an open-source, keyboard-oriented desktop note-taking
      application. Its scope grew to include Markdown formatting, hierarchical folders,
      tags, themes, feed views, and Kanban boards generated from Markdown tasks. The
      project also introduced an optional paid Pro build while retaining source
      availability and allowing Pro features to be built from source.
  related-projects:
    - Qt provides the cross-platform native application framework.
    - QMarkdownTextEdit provides part of the Markdown editing stack.
    - Daino Notes is the name used by the project's later packaged update artifacts.
  sources:
    - https://github.com/nuttyartist/notes
    - https://github.com/nuttyartist/notes/wiki
    - https://www.notes-foss.com/
  summary:
    - >
      Notes is an open-source, cross-platform C++ and Qt note-taking application with
      Markdown, folders, tags, themes, and Kanban functionality.
  timeline:
    - >
      By 2020: The official project wiki was established for community participation and
      product direction.
    - >
      2020s: Development expanded Notes with Markdown task boards, cross-platform
      packages, and an optional Pro distribution.
  usage:
    - >
      Users create and organize private local notes with nested folders and tags, format
      text with Markdown, and turn Markdown tasks into Kanban boards. The application
      supports keyboard-driven use and can remain available in the background.
    - >
      The official README says the notes database and settings file are stored under
      `~/.config/Awesomeness` on both macOS and conventional Linux installations. No
      separate credentials file is documented.
