history:
  adoption-history:
    - >
      gocloc is packaged for Homebrew and is also documented for AUR installation in the
      README. Its packaging profile is typical of developer metrics tools: small binary,
      no service, useful in local repositories and CI jobs.
  package-nerd-significance:
    - >
      The package is interesting as part of the lineage from cloc to newer compiled
      counters such as tokei and gocloc. For package managers, it is a low-friction
      developer-tool formula: install one executable and use it across repositories
      without managing a Perl or Rust toolchain at runtime.
  project-history:
    - >
      The public repository was created in April 2016. The README describes the project
      as a little fast cloc-style counter written in Go and explicitly cites tokei as an
      inspiration. GitHub release records show the v0.2.1 release in March 2019 and
      later 0.x releases through the 2020s.
  related-projects:
    - cloc is the predecessor-style tool named in the README.
    - tokei is explicitly cited by gocloc as an inspiration.
    - SLOCCount appears in the README's Jenkins integration workflow.
  sources:
    - https://api.github.com/repos/hhatto/gocloc
    - https://api.github.com/repos/hhatto/gocloc/releases?per_page=100
    - https://formulae.brew.sh/formula/gocloc
    - https://github.com/hhatto/gocloc
  summary:
    - >
      gocloc is a Go implementation of a source-code line counter, inspired by cloc and
      tokei. It reports file, blank, comment, and code counts by language, with CLI and
      container workflows.
  timeline:
    - '2016-04-01: Public GitHub repository created'
    - '2019-03-02: v0.2.1 release published'
    - '2021-02-19: v0.4.0 release published'
    - '2023-05-06: v0.5.0 release published'
    - '2025-03-24: v0.7.0 release published'
  usage:
    - >
      Users run gocloc against a directory to print per-language totals, request
      supported languages with --show-lang, or run it through Docker. The README also
      documents Jenkins/SLOCCount-oriented output workflows, making it useful both at
      the terminal and in reporting pipelines.
related-packages:
  - id: brew:cloc
    reason: >
      Choose cloc when you want the established Perl-based counter with extensive
      archive, repository, and diff support; gocloc intentionally implements the same
      basic counting task as a compiled Go CLI.
    rel: alternative
    sources:
      - https://github.com/hhatto/gocloc
      - https://github.com/AlDanial/cloc
  - id: brew:tokei
    reason: >
      Choose Tokei when you want a Rust implementation with library use and JSON, YAML,
      or CBOR reporting; gocloc officially cites it as an inspiration.
    rel: alternative
    sources:
      - https://github.com/hhatto/gocloc
      - https://github.com/XAMPPRocky/tokei
  - id: brew:scc
    reason: >
      Choose scc when line counts should be accompanied by complexity and COCOMO cost
      estimates rather than gocloc's narrower cloc-style report.
    rel: alternative
    sources:
      - https://github.com/hhatto/gocloc
      - https://github.com/boyter/scc
