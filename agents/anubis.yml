id: brew:anubis
display-name: Anubis
repo: null
docs:
  - https://anubis.techaro.lol
  - https://github.com/TecharoHQ/anubis#readme
config-file-location:
  linux:
    - /etc/anubis/default.env
    - /etc/anubis/<service>.env
    - /etc/anubis/<service>.botPolicies.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Anubis entered package-manager ecosystems quickly for a young security tool: the
      input package facts list Homebrew, Alpine, Fedora, MacPorts, Nix, Arch, and
      openSUSE packaging. The README also links a Repology packaging badge, suggesting
      upstream cares about distribution visibility.
    - >
      Its adoption story is tied to the post-LLM web: administrators use it when they
      need proof-of-work challenges, allow/deny/challenge bot rules, and reverse-proxy
      integration without moving the whole site behind a proprietary edge service.
  package-nerd-significance:
    - >
      Anubis is interesting because it is a small, installable answer to an
      infrastructure-wide problem. It sits at the intersection of Go single-binary
      packaging, container images, reverse proxy snippets, and web-administration policy
      files.
    - >
      For package maintainers, Anubis also has a moving target problem: security
      advisories, bot identifiers, browser behavior, and AI-crawler names change
      quickly, so the value of a package is not only the binary but also timely updates
      and clear policy migration notes.
  project-history:
    - >
      The official README frames Anubis as a response to heavy scraper traffic from AI
      companies, especially for smaller sites that cannot or do not want to depend on a
      larger hosted protection service. The setup docs describe it as a component that
      sits between a reverse proxy such as Nginx or Caddy and the target service, one
      Anubis instance per protected service.
    - >
      The project is implemented and released actively through the TecharoHQ/anubis
      repository. Its release feed shows a fast-moving 1.x series, with v1.26.0-pre1 in
      June 2026 including security, metrics, policy, localization, and performance work.
  related-projects:
    - >
      Caddy, Nginx, Traefik, HAProxy, Apache, and Kubernetes appear in official
      deployment documentation as front-end environments for Anubis.
    - >
      The official default bot policy file is the related configuration artifact most
      users customize.
  sources:
    - >
      Official README, installation docs, policy docs, release feed, and
      source_facts.package-manager.
  summary:
    - >
      Anubis is Techaro's Web AI Firewall Utility for protecting web resources from
      scraper bots. It is a modern reverse-proxy-era security CLI: install one binary or
      container, put it between a load balancer and an upstream app, and tune bot policy
      and challenge behavior.
  timeline:
    - >
      2025: Public 1.x tags and package-manager entries establish Anubis as a
      distributable CLI service.
    - >
      2026: v1.26.0-pre1 release notes include security-advisory work, metrics policy
      moves, pprof gating, localization, and performance improvements.
  usage:
    - >
      Operators run Anubis as a reverse proxy or sidecar and configure target service
      routing with environment variables plus a policy file. Official docs document
      BIND, TARGET, PUBLIC_URL, cookie settings, metrics settings, and POLICY_FNAME,
      while the policy docs define YAML or JSON rules for paths, user agents, headers,
      remote addresses, actions, challenge difficulty, and metrics.
    - >
      The policy file is the important package-nerd surface: it is not just a daemon
      config, it is the distribution of bot behavior. The default policy file, local
      overrides, known-good bot allowlists, and reverse-proxy examples are where the
      package turns from binary into operational security posture.
related-packages:
  - id: brew:caddy
    reason: >
      Caddy is a documented front-end reverse proxy for Anubis, terminating public
      traffic and forwarding it through Anubis before requests reach the protected
      service.
    rel: adjacent_workflow
    sources:
      - https://github.com/TecharoHQ/anubis/blob/main/docs/docs/admin/installation.mdx
      - https://caddyserver.com/docs/
  - id: brew:nginx
    reason: >
      Nginx is a documented deployment companion that can route public requests and
      required Anubis asset paths to the Anubis service before the protected origin.
    rel: adjacent_workflow
    sources:
      - https://github.com/TecharoHQ/anubis/blob/main/docs/docs/admin/installation.mdx
      - https://nginx.org/en/docs/
  - id: brew:traefik
    reason: >
      Traefik is covered by Anubis's official environment guidance and can integrate
      Anubis into dynamic container or Kubernetes routing workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/TecharoHQ/anubis/blob/main/docs/docs/admin/installation.mdx
      - https://doc.traefik.io/traefik/
