history:
  adoption-history:
    - >
      Adoption was accelerated by the Git project's own filter-branch documentation,
      which warns against filter-branch for many use cases and points users toward
      git-filter-repo. The project became a standard answer for history-rewrite work
      because it combines a command-line interface, a Python library for custom filters,
      conversion guides from filter-branch and BFG, and packaging in common Unix package
      ecosystems.
  package-nerd-significance:
    - >
      For package maintainers and release engineers, git-filter-repo matters because it
      replaced a folklore-heavy set of filter-branch recipes with a single-file script,
      a documented manual, and reproducible transformations. Its existence also fed
      changes back into core Git fast-export and fast-import behavior, making it part of
      the broader Git tooling ecosystem rather than only a cleanup script.
  project-history:
    - >
      The project grew out of Newren's work on Git fast-export and fast-import based
      history filtering. The public repository carries imported history back to a 2009
      initial import, while the standalone GitHub project was established in 2018 and
      began tagging releases alongside Git 2.23-era packaging. Its README frames the
      tool as a response to shortcomings in git filter-branch and BFG Repo Cleaner: poor
      performance, confusing multi-step cleanup, limited rewrite types, and fragile
      shell-based filtering.
  related-projects:
    - >
      git-filter-repo is related to git filter-branch, BFG Repo Cleaner, git
      fast-export, git fast-import, and the filter-lamely and bfg-ish demos shipped in
      its contrib tree.
  sources:
    - https://git-scm.com/docs/git-filter-branch
    - https://git.github.io/rev_news/2019/08/21/edition-54/
    - https://github.com/newren/git-filter-repo
    - https://github.com/newren/git-filter-repo#readme
    - https://github.com/newren/git-filter-repo/blob/main/Documentation/git-filter-repo.txt
  summary:
    - >
      git-filter-repo is a Python-based Git history rewriting tool by Elijah Newren,
      positioned as a safer and faster successor to git filter-branch for repository
      cleanup, extraction, path rewriting, tag rewriting, and sensitive-data removal.
  timeline:
    - '2009: Imported predecessor history begins with an initial filter-repo commit.'
    - '2018: The standalone GitHub repository was created.'
    - "2019: Git Rev News published Newren's introduction to git-filter-repo."
    - >
      Git 2.23 era: Early tagged releases appeared as the tool entered package-manager
      distribution.
  usage:
    - >
      Practitioners use git-filter-repo for destructive repository rewrites: removing
      large blobs or secrets, extracting a subdirectory with history, moving a project
      into a subdirectory before a merge, renaming tags, rewriting author data with
      mailmap information, or replacing text across historical blobs. The tool
      deliberately encourages use from a fresh clone and performs cleanup steps such as
      pruning old history and repacking so users do not mix rewritten and original refs.
related-packages:
  - id: brew:bfg
    reason: >
      BFG Repo-Cleaner is an alternative optimized for common large-file and credential
      purges, while git-filter-repo supports a broader transformation model and
      programmable callbacks.
    rel: alternative
    sources:
      - https://github.com/newren/git-filter-repo
      - https://rtyley.github.io/bfg-repo-cleaner/
  - id: brew:git
    reason: >
      git-filter-repo installs as a Git subcommand and replaces repository-rewriting
      workflows that Git's own documentation discourages users from performing with
      filter-branch.
    rel: adjacent_workflow
    sources:
      - https://github.com/newren/git-filter-repo
      - https://git-scm.com/docs/git-filter-branch
