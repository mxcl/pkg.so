      Official GitHub README describes composing, sending mail, address book, and
      Notmuch integration.
    - source_facts.description says "Curses terminal client for the Notmuch email system".
  display-name-sources:
    - >
      Official GitHub README heading is "Bower - A curses terminal client for the
      Notmuch email system".
  docs-sources:
    - >
      Official GitHub README Configuration section documents BOWER_CONFIG,
      XDG_CONFIG_HOME, HOME, and XDG_CONFIG_DIRS config paths.
    - Official GitHub README describes Bower as a curses terminal client for Notmuch.
  history-sources:
    - https://api.github.com/repos/wangp/bower
    - https://github.com/wangp/bower
    - https://github.com/wangp/bower/blob/master/bower.conf.sample
    - source_facts.package-manager
  repo-sources:
    - >
      source_facts.repo already set to https://github.com/wangp/bower; prompt requires
      returning repo as null when source_facts.repo is populated.
  tags-sources:
    - >
      Official GitHub README describes a curses terminal client for Notmuch, mail
      sending, address book, and terminal usage.
    - source_facts.executables lists bower.
category-confidence: high
category-path:
