config-file-location:
  macos:
    - ~/Library/Application Support/Yojam/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Yojam is distributed as a free, open-source macOS application and through a
      Homebrew cask. Its official repository documents migration from Bumpr, Choosy, and
      Finicky, placing it in the established macOS browser-selection utility niche.
    - >
      Reliable official adoption statistics and a dated release narrative are not
      published, so no quantitative adoption or inferred launch date is included.
  package-nerd-significance:
    - >
      Yojam turns macOS's single default-browser setting into a programmable URL-routing
      layer. It is especially useful to developers and multi-account users who routinely
      split links across work and personal browser profiles, private windows, native
      applications, and multiple displays.
    - >
      Its live-editable JSON configuration is suitable for scripted changes and
      dotfile-style management. Privacy-conscious users may also value its local
      processing and ability to remove common tracking parameters before opening a URL.
  project-history:
    - >
      The project's author created Yojam after repeatedly needing links from
      applications such as Slack to open in a particular browser profile or native
      application rather than the system's one default browser.
    - >
      The project developed into a menu-bar utility with ordered routing rules, a fast
      browser picker, browser-profile and container support, tracker removal, URL
      rewriting, application routing, browser extensions, Shortcuts integration, iCloud
      synchronization, and a flat-file configuration interface.
  related-projects:
    - The official migration assistant recognizes Bumpr, Choosy, and Finicky configurations.
    - >
      Browser extensions extend Yojam's routing workflow into Safari, Chromium-family
      browsers, Firefox, and Orion.
  sources:
    - https://github.com/fluffypony/yojam
    - https://yoj.am/
  summary:
    - >
      Yojam is a free, open-source macOS link router and browser picker. It runs in the
      menu bar, intercepts links, applies configurable rewriting and routing rules, and
      opens each URL in the desired browser, profile, private window, container, or
      native application.
  timeline:
    - >
      The official sources reviewed do not provide a reliable dated origin or release
      timeline.
  usage:
    - >
      Users set Yojam as the default browser, register their available browsers and
      profiles, and create ordered rules matching domains, prefixes, regular
      expressions, source applications, or all URLs from a source.
    - >
      Unmatched links can open a keyboard-driven picker, while matching rules route
      automatically. Optional processing includes stripping tracking parameters,
      rewriting URLs, selecting private windows, targeting displays, and forwarding
      links to native applications.
    - >
      Settings can be edited in the graphical preferences, exported and imported as
      JSON, synchronized through iCloud, or managed through the live
      `~/Library/Application Support/Yojam/config.json` file.
