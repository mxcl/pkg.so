history:
  adoption-history:
    - >
      Termius reports that the application launched in 2011. Its official beta program
      now distributes prerelease desktop builds for macOS, Windows, Linux, and Snap,
      plus mobile builds for iOS and Android.
  package-nerd-significance:
    - >
      The beta cask gives package-manager users a managed route to Termius prereleases.
      Termius is also notable as a modern, cross-platform graphical layer over
      established remote-access workflows such as SSH, terminal sessions, host
      organization, and SFTP.
  project-history:
    - >
      Termius describes its mission as rebuilding the SSH client and terminal for modern
      engineering work. Its official chronology records the app launch in 2011, company
      formation in November 2019, participation in Y Combinator in December 2019,
      investment in May 2020, and profitability in November 2022.
  related-projects:
    - >
      Termius interoperates with SSH servers and fills a role commonly served by OpenSSH
      command-line clients and terminal emulators. This package is the beta-channel
      counterpart of stable Termius distributions.
  sources:
    - https://docs.termius.com/
    - https://termius.com/about
    - https://termius.com/blog/termius-x
    - https://www.termius.com/beta-program
  summary:
    - >
      Termius Beta is the prerelease channel for the cross-platform Termius
      remote-access and terminal-emulator application.
  timeline:
    - '2011: Termius application launched.'
    - '2018: Termius introduced sidebar navigation for hosts, snippets, and terminal tabs.'
    - 'November 2019: Termius company founded.'
    - 'December 2019: Termius joined the Y Combinator accelerator.'
    - 'November 2022: Termius reported becoming profitable.'
    - >
      2024: Termius introduced a reimagined desktop interface with horizontal tabs,
      vaults, and a command palette.
  usage:
    - >
      Beta testers install it to try new Termius improvements early and provide
      feedback. Typical Termius workflows include connecting to remote systems, working
      in terminal sessions, organizing hosts, transferring files with SFTP, and managing
      reusable connection data.
