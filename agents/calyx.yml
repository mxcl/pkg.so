credentials-file-location: null
history:
  adoption-history:
    - >
      Calyx is distributed both through GitHub releases and as a Homebrew cask. Its
      official installation instructions make Homebrew the primary package-manager path.
    - >
      Its integrations target several agent CLIs—including Claude Code, Codex, OpenCode,
      Hermes, Grok, and pi—positioning it within the emerging coding-agent terminal
      ecosystem rather than as a general-purpose terminal alone.
  package-nerd-significance:
    - >
      Calyx combines a Ghostty-derived terminal engine with agent supervision, MCP-based
      inter-pane communication, centralized approval handling, persistent sessions, code
      review, and browser automation.
    - >
      It is notable to package enthusiasts as an MIT-licensed, Apple-Silicon-native
      terminal application with a rapid pre-1.0 release cadence and direct Homebrew cask
      installation.
  project-history:
    - >
      Calyx was created by Yuuichi Eguchi as a native macOS terminal built around
      libghostty and Apple's macOS 26 design technologies.
    - >
      The project evolved into an agent-oriented workspace with status tracking,
      approval routing, MCP communication, persistent local and remote sessions, Git
      review, LSP access, and a scriptable browser.
    - >
      Its 2026 release series remained pre-1.0 while adding increasingly specialized
      coding-agent orchestration features.
  related-projects:
    - Ghostty supplies the terminal engine and compatible configuration format.
    - Claude Code, Codex CLI, OpenCode, Hermes, Grok, and pi are supported agent environments.
    - MCP is used for agent communication and terminal-control integrations.
  sources:
    - https://github.com/yuuichieguchi/Calyx
    - https://github.com/yuuichieguchi/Calyx/releases
    - https://help.getcalyx.app/
  summary:
    - >
      Calyx is an open-source native macOS terminal designed to run and supervise
      multiple coding agents while preserving a conventional terminal workflow.
  timeline:
    - >
      2026: Calyx is documented as a macOS 26-native coding-agent terminal and publishes
      a continuing pre-1.0 release series.
    - '2026: Dedicated official help is published at help.getcalyx.app.'
  usage:
    - >
      Users create tabs and split panes for shells or coding agents, monitor agent state
      in a sidebar, and optionally route permission prompts through a shared approval
      inbox.
    - >
      Enabling AI Agent IPC writes integration entries into supported agents' own
      configuration files. Calyx also reads the standard Ghostty configuration at
      ~/.config/ghostty/config and hot-reloads most compatible settings.
