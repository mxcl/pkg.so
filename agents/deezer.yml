history:
  adoption-history:
    - >
      Deezer expanded from its French origins into an international streaming service
      and launched a direct-to-consumer offering in the United States in 2016. Its
      official newsroom describes a company operating across several countries with a
      global streaming audience.
  package-nerd-significance:
    - >
      The Homebrew Cask packages Deezer's proprietary macOS desktop client, making a
      mainstream subscription streaming application installable and upgradable through
      the same workflow as developer tools and open-source desktop software.
  project-history:
    - >
      Deezer was founded in Paris in 2007 as an on-demand music streaming service. The
      company marked its tenth anniversary in 2017 and introduced a redesigned brand
      identity and logo in 2023.
  related-projects:
    - >
      Deezer occupies the same desktop music-streaming category as Spotify, Apple Music,
      and other subscription catalog services.
  sources:
    - >
      https://newsroom-deezer.com/2016/07/deezer-launches-direct-to-consumers-in-u-s-with-the-most-personalized-music-discovery-platform/
    - https://newsroom-deezer.com/2023/11/deezer-new-brand-identity-and-logo/
    - https://newsroom-deezer.com/fr/2017/10/deezer-fete-ses-10-ans/
    - https://www.deezer.com/download
  summary:
    - >
      Deezer is a proprietary on-demand music-streaming service founded in Paris, with
      desktop, web, and mobile clients.
  timeline:
    - '2007: Deezer founded in Paris'
    - '2016: Direct-to-consumer service launched in the United States'
    - '2017: Deezer marked its tenth anniversary'
    - '2023: Deezer introduced a new brand identity and logo'
  usage:
    - >
      The desktop client is used to search and stream Deezer's music catalog, manage a
      personal library and playlists, receive recommendations, and access subscription
      features. An online account and network service are central to normal operation.
