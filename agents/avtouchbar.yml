history:
  adoption-history:
    - >
      AVTouchBar was distributed as a specialized macOS utility for Touch Bar-equipped
      Macs. Its audience is consequently tied to a particular generation of Apple
      hardware rather than general-purpose audio-production workflows.
  package-nerd-significance:
    - >
      AVTouchBar represents the short-lived ecosystem of utilities built around Apple's
      MacBook Pro Touch Bar. It is also an example of a niche commercial Mac application
      made package-manager-installable despite being distributed primarily from its own
      website.
  project-history:
    - >
      Creator Jake Fishman says the idea arose from wanting an audio visualizer on the
      Touch Bar. He began developing it while teaching himself more programming during
      the 2020 quarantine and spent several months building and beta-testing the
      application.
  related-projects:
    - >
      A third-party virtual audio driver may be used when visualizing system audio,
      according to the official product page.
  sources:
    - "Creator's official account: https://www.avtouchbar.com/about/"
    - 'Official documentation: https://www.avtouchbar.com/documentation/'
    - 'Official product page: https://www.avtouchbar.com/'
  summary:
    - >
      AVTouchBar is a macOS audio visualizer designed specifically for the MacBook Pro
      Touch Bar.
  timeline:
    - '2020: Jake Fishman began developing AVTouchBar during the COVID-19 quarantine.'
  usage:
    - >
      Users select an audio input, start visualization, and display animated
      audio-reactive graphics on the Touch Bar. The application supports microphone
      input, system audio through a third-party audio driver, customizable gradients,
      and Touch Bar gestures.
