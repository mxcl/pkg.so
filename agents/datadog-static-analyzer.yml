id: brew:datadog-static-analyzer
display-name: Datadog Static Analyzer
repo: null
docs:
  - https://docs.datadoghq.com/security/code_security/static_analysis
config-file-location:
  unix:
    - code-security.datadog.yaml
    - static-analysis.datadog.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption follows Datadog's Code Security product rather than a standalone
      community plugin model: the official docs describe scans in CI/CD pipelines or
      hosted scanning, pull-request feedback, IDE integrations, and Datadog result
      views.
  package-nerd-significance:
    - >
      For package managers, the analyzer is notable because it packages a vendor SAST
      engine as a local binary that can run outside the Datadog UI while still feeding
      Datadog-oriented code-security workflows.
  project-history:
    - >
      The public Datadog repository was created in July 2023 and published an initial
      0.0.1 release that same month. Its README positions the analyzer as the engine
      behind Datadog's SAST product and documents direct CLI, Docker, CI/CD, and IDE
      usage.
  related-projects:
    - >
      Official integrations include a GitHub Action, a CircleCI orb, Datadog IDE
      plugins, and the broader Datadog Code Security product.
  sources:
    - https://github.com/DataDog/datadog-static-analyzer#readme
    - https://github.com/DataDog/datadog-static-analyzer/releases/tag/0.0.1
    - https://github.com/DataDog/datadog-static-analyzer/releases/tag/0.8.7
    - https://docs.datadoghq.com/security/code_security/static_analysis
  summary:
    - >
      Datadog Static Analyzer is the command-line static analysis engine for Datadog
      Static Code Analysis.
  timeline:
    - '2023: Public repository created and 0.0.1 initial release published.'
    - '2026: 0.8.x releases show continuing binary distribution through GitHub releases.'
  usage:
    - >
      Users run `datadog-static-analyzer` against a directory and emit CSV or
      SARIF-style reports, optionally selecting rules through a
      `code-security.datadog.yaml` file at the repository root.
related-packages:
  - id: brew:semgrep
    reason: >
      Choose Semgrep when you want a standalone, community-rule-oriented CLI SAST
      workflow; Datadog also documents Semgrep SARIF as tested input when its findings
      need to be imported into Datadog.
    rel: alternative
    sources:
      - https://semgrep.dev/docs/category/local-and-cli-scans
      - https://semgrep.dev/products/community-edition/
      - https://docs.datadoghq.com/security/code_security/troubleshooting/
