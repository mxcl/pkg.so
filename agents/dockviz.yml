history:
  adoption-history:
    - >
      Dockviz became a niche but well-known Docker helper rather than a general-purpose
      platform tool. The repository still has more than a thousand stars, and Homebrew
      continues to package release 0.6.4, but Homebrew analytics show modest recent
      installs, which fits a mature specialist tool.
  package-nerd-significance:
    - >
      Dockviz is package-nerd interesting because it captures a specific moment in
      Docker history: image layers were central to understanding builds, and a small Go
      binary plus Graphviz was enough to turn opaque local Docker state into inspectable
      structure.
  project-history:
    - >
      The GitHub repository was created in April 2014 and describes the project as a way
      to present Docker image and container information in different forms. Its README
      documents image trees, Graphviz DOT output, short summaries, and container-link
      diagrams, all centered on making Docker's local state visible from the terminal.
  related-projects:
    - >
      Dockviz is closely related to Docker itself and to Graphviz, which the README uses
      for rendering DOT output. Its examples also reference older Docker environment
      tooling such as boot2docker and docker-machine.
  sources:
    - https://github.com/justone/dockviz
    - https://raw.githubusercontent.com/justone/dockviz/master/README.md
    - https://api.github.com/repos/justone/dockviz
    - https://formulae.brew.sh/api/formula/dockviz.json
  summary:
    - >
      Dockviz is a Go command-line tool for visualizing Docker image and container data.
      It belongs to the early Docker utility wave: small CLIs that made Docker's layer
      and container relationships easier to inspect before those views were common in
      mainstream tooling.
  timeline:
    - '2014: GitHub repository created for visualizing Docker data.'
    - '2010s: README documents Docker image trees, Graphviz output, and container diagrams.'
    - '2026: Homebrew packages stable release 0.6.4 with low but continuing install activity.'
  usage:
    - >
      Typical usage is interactive inspection: `dockviz images --tree` for a terminal
      tree, `dockviz images --dot | dot ...` for rendered graphs, and `dockviz
      containers --dot` for container relationship diagrams. It can read Docker daemon
      data directly or accept Docker JSON on standard input.
related-packages:
  - id: brew:graphviz
    reason: >
      Use Graphviz to render Dockviz's documented DOT output into PNG or other diagram
      formats.
    rel: adjacent_workflow
    sources:
      - https://github.com/justone/dockviz
      - https://graphviz.org/documentation/
  - id: brew:dive
    reason: >
      Choose Dive when you need an interactive, actively maintained view of files, layer
      changes, and wasted space inside a container image rather than Dockviz's ancestry
      and relationship diagrams.
    rel: alternative
    sources:
      - https://github.com/justone/dockviz
      - https://github.com/wagoodman/dive
