history:
  adoption-history:
    - >
      The supplied package metadata records aamath in Homebrew and MacPorts. Homebrew
      also carries a local patch for modern builds, which is typical of small older Unix
      utilities that remain useful but no longer have an active upstream VCS workflow.
  package-nerd-significance:
    - >
      aamath matters as a tiny package-manager survivor: a lex/yacc-era C++ utility
      preserved because package systems can keep old text-processing tools buildable
      long after their original homepage becomes fragile.
  project-history:
    - >
      The official project homepage listed by the package metadata is fuse.superglue.se,
      and Homebrew packages the 0.3 source release from the original upstream tarball
      with a NetBSD distfiles mirror. The source ChangeLog records a compact 2005
      release series ending at version 0.3.
  related-projects:
    - >
      Related contexts include terminal math rendering, computer algebra text output,
      AsciiMath-style notation, and lightweight plain-text documentation workflows.
  sources:
    - https://raw.githubusercontent.com/Homebrew/homebrew-core/master/Formula/a/aamath.rb
    - source_facts.description
    - source_facts.homepage
    - source_facts.package-manager
  summary:
    - >
      aamath is a small command-line utility that reads mathematical expressions in
      infix notation and renders them as ASCII art for text-only communication.
  timeline:
    - '2005-03-02: Version 0.1 first release recorded in the ChangeLog.'
    - '2005-03-07: Version 0.2 added determinants, nabla, and radical-rendering improvements.'
    - '2005-06-22: Version 0.3 added command-line expression input and man page cleanup.'
  usage:
    - >
      The documented use is direct terminal execution: run `aamath` with an expression
      argument or interactively, then paste or send the resulting plain-text formula
      through media such as email, newsgroups, terminal sessions, and text
      documentation.
