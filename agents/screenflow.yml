    - source_facts.package-manager
  summary:
    - >
      ScreenFlow is Telestream’s commercial macOS application for recording screens,
      cameras, microphones, and computer audio, then editing the captured material on a
      multitrack timeline and exporting or publishing finished videos.
  timeline:
    - '2008: ScreenFlow 1.x was available and received two Apple Design Awards.'
    - '2008: Full Sail University selected ScreenFlow for student and faculty use.'
    - >
      2021: ScreenFlow 10 added multi-source recording, Apple Silicon support, titles,
      and background removal.
    - >
      2025: ScreenFlow 10.5 added region, looped, and timed recording plus native
      system-audio capture.
    - '2026: Telestream released ScreenFlow 10.5.2.'
  usage:
    - >
      A typical workflow records a display or region together with camera, microphone,
      and application audio; arranges the resulting clips on a timeline; adds callouts,
      titles, captions, motion, and filters; and exports or publishes the finished
      screencast. It is commonly used for tutorials, software demonstrations, lessons,
      presentations, and asynchronous feedback.
