history:
  adoption-history:
    - >
      ScreenFlow found early institutional use in education: Telestream’s official Full
      Sail University case study says the university selected it in June 2008 and
      deployed more than 1,200 units for student and faculty workflows. It has since
      remained commercially maintained for macOS and is available both directly and
      through the Mac App Store.
    - >
      For package-manager users, the Homebrew cask recorded in
      source_facts.package-manager provides a reproducible installation path alongside
      Telestream’s graphical installer.
  package-nerd-significance:
    - >
      ScreenFlow is a prominent example of a mature, Mac-native commercial application
      combining capture and nonlinear editing in one package. Package users care about
      its long compatibility history, paid major-version upgrade model, auxiliary
      audio-capture components, and the operational differences between Telestream and
      Mac App Store distributions.
  project-history:
    - >
      ScreenFlow’s first generation was established by 2008. That year it received two
      Apple Design Awards, while early releases already combined screen capture,
      editing, callouts, input visualization, and video export.
    - >
      Telestream continued developing the application through successive paid major
      versions. Later releases added richer timeline editing, captions, stock media,
      multi-source recording, Apple Silicon support, background removal, independent
      application-audio tracks, and modernized capture workflows.
    - >
      The official version archive documents continuing maintenance through the 10.5
      line, including native system-audio capture and application inclusion or exclusion
      controls in 2025 and compatibility fixes in 2026.
  related-projects:
    - Telestream Wirecast
    - Final Cut Pro
    - Camtasia
    - QuickTime Player
    - Homebrew Cask
  sources:
    - >
      Official 2009 ScreenFlow release:
