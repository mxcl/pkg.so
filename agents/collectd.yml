id: brew:collectd
display-name: collectd
repo: https://github.com/collectd/collectd
docs:
  - https://collectd.org/documentation
config-file-location:
  unix:
    - sysconfdir/collectd.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      collectd was widely adopted by Unix and Linux distributions as a lightweight host
      metrics collector before newer cloud-native agents became common. The input
      package facts show it packaged across apk, Homebrew, Debian, Fedora, MacPorts,
      Nix, Ubuntu, and zypper ecosystems.
    - >
      Its plugin set helped it fit many monitoring stacks: local collection, network
      forwarding, RRD-style storage, and integrations with systems such as Apache, BIND,
      Ceph, cgroups, DPDK, OpenLDAP, and many hardware or kernel interfaces.
  package-nerd-significance:
    - >
      collectd is package-manager significant because it is a classic plugin-heavy
      daemon: downstream packages often split or toggle plugin dependencies, ship
      init/service integration, and place collectd.conf under the package sysconfdir.
  project-history:
    - >
      The official README presents collectd as a system information collection daemon
      with a plugin-centered architecture for collecting metrics from operating systems,
      services, hardware, and applications.
    - >
      The project has a long 3.x, 4.x, and 5.x release history in its official tag
      namespace, with later 6.0 release candidates visible in the official repository.
  related-projects:
    - >
      collectd sits in the same operational space as host monitoring agents, metrics
      forwarders, RRD-based collection setups, and Nagios-compatible monitoring
      integrations.
  sources:
    - https://collectd.org/
    - https://collectd.org/documentation
    - https://github.com/collectd/collectd
    - https://github.com/collectd/collectd/blob/main/src/collectd.conf.in
  summary:
    - >
      collectd is a small daemon that periodically collects system information and
      provides mechanisms to store and monitor the collected values.
  timeline:
    - '2000s: collectd 3.x and 4.x release tags appear in the official repository history.'
    - '2010s: collectd 5.x becomes the long-running packaged release series.'
    - '2020s: Official repository contains 6.0 release-candidate tags.'
  usage:
    - >
      Users run collectd as a daemon, configure global settings and LoadPlugin blocks in
      collectd.conf, and use companion commands such as collectdctl, collectdmon,
      collectd-nagios, and collectd-tg for control or integration.
related-packages:
  - id: brew:telegraf
    reason: >
      Choose Telegraf as an alternative when you want a single plugin-driven agent with
      built-in processing and aggregation stages in addition to metric collection and
      output.
    rel: alternative
    sources:
      - https://docs.influxdata.com/telegraf/v1/concepts/
      - https://collectd.org/
  - id: brew:rrdtool
    reason: >
      Use RRDtool with collectd when you want collectd's collected values written to
      fixed-size round-robin databases for retention and graphing.
    rel: adjacent_workflow
    sources:
      - https://github.com/collectd/collectd
      - https://oss.oetiker.ch/rrdtool/doc/index.en.html
  - id: brew:nagios
    reason: >
      Use Nagios Core with collectd when you want collectd-nagios to query collected
      values through the Unix-socket plugin and translate thresholds into Nagios
      statuses.
    rel: adjacent_workflow
    sources:
      - https://collectd.org/documentation/manpages/collectd-nagios.html
      - https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/
