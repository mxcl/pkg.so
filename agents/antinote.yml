id: cask:antinote
display-name: Antinote
repo: null
docs:
  - https://antinote.io/changelog
  - https://antinote.io/extensions
  - https://antinote.io/user-manual
config-file-location:
  macos:
    - >
      ~/Library/Containers/com.chabomakers.Antinote/Data/Library/Preferences/com.chabomakers.Antinote.plist
    - ~/Library/Preferences/com.chabomakers.Antinote.plist
    - >
      ~/Library/Containers/com.chabomakers.Antinote-setapp/Data/Library/Preferences/com.chabomakers.Antinote-setapp.plist
    - ~/Library/Preferences/com.chabomakers.Antinote-setapp.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Antinote gained additional distribution through Homebrew Cask and Setapp. Its
      official changelog credits community contributions and describes community-created
      themes, Discord feedback, and integrations with Raycast and Alfred.
    - >
      The application remains deliberately complementary to full note-management
      systems: official materials position it as a temporary scratchpad that can export
      useful content to Apple Notes, Obsidian, Bear, or plain-text files.
  package-nerd-significance:
    - >
      Antinote is interesting to package enthusiasts as a native macOS scratchpad with a
      narrow design philosophy but unusually broad automation surfaces, including URL
      schemes, terminal launching, local SQLite storage, JavaScript extensions, and
      Homebrew distribution.
  project-history:
    - >
      Antinote began as a native Swift and SwiftUI macOS application for temporary notes
      and contextual calculations. Its design prioritizes immediate capture and
      lightweight manipulation rather than long-term organization.
    - >
      The 1.x series expanded beyond plain scratch notes with timers, simple Markdown,
      themes, URL schemes, code highlighting, automatic backups, and export
      integrations. The 2.0 beta series added iCloud synchronization, JavaScript
      extensions, slotted notes, and recovery features.
  related-projects:
    - Antinote can export notes to Apple Notes, Obsidian, and Bear.
    - >
      Its official materials distinguish it from full-featured note systems and mention
      Scrap Note as another scratchpad application.
  sources:
    - https://antinote.io/
    - https://antinote.io/changelog
    - https://antinote.io/presskit
    - https://antinote.io/user-manual
    - source_facts.version
  summary:
    - >
      Antinote is a native macOS scratchpad for temporary notes, calculations, lists,
      timers, code snippets, OCR, and lightweight text transformations. It intentionally
      avoids the organizational weight of a conventional long-term note system.
  timeline:
    - >
      2025: The 1.1 series adds broader automation, themes, backups, code features, and
      Homebrew distribution.
    - >
      2026: The 2.0 beta series develops iCloud sync, JavaScript extensions, slotted
      notes, and deleted-note recovery.
    - '2026: The official roadmap targets an iOS v1 release.'
  usage:
    - >
      Users summon Antinote with a global shortcut, write disposable text, and activate
      behaviors with keywords such as math, list, code, and timer. Notes can be copied
      or exported when they become worth retaining elsewhere.
    - >
      Notes and backups are stored locally in
      `~/Library/Containers/Antinote/Data/Documents/notes.sqlite3`; this is application
      data rather than an officially documented configuration-file location. Extensions
      may keep API credentials in macOS Keychain, but the official documentation does
      not publish a credentials-file path.
tags:
