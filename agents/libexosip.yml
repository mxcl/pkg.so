id: brew:libexosip
display-name: libeXosip2
repo: https://git.savannah.nongnu.org/git/exosip.git
docs:
  - https://savannah.nongnu.org/projects/exosip
  - https://www.antisip.com/doc/exosip2
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Savannah's release archive shows libeXosip tarballs in March 2005 and libeXosip2
      tarballs in November 2005, followed by 3.x, 4.x, and 5.x series releases. Package
      managers keep it around for older and embedded VoIP software that still wants a
      compact GPL SIP user-agent stack.
  package-nerd-significance:
    - >
      libeXosip2 is a small but durable example of the early-2000s open SIP stack era:
      oSIP handles lower SIP machinery, while eXosip2 gives packagers a higher-level
      endpoint library and test tools.
  project-history:
    - >
      Antisip describes oSIP and eXosip2 as open-source SIP projects started in 2001.
      The eXosip documentation presents libeXosip2 as the extended stack built on oSIP
      for quickly building compliant SIP endpoint applications.
  related-projects:
    - >
      Related projects include GNU oSIP, Antisip SIP products, SIP RFC 3261
      implementations, and endpoint stacks used by VoIP clients and embedded telephony
      devices.
  sources:
    - https://download.savannah.nongnu.org/releases/exosip/
    - https://savannah.nongnu.org/projects/exosip
    - https://www.antisip.com/
    - https://www.antisip.com/doc/exosip2/eXosip2_changelog.html
    - https://www.antisip.com/doc/exosip2/group__libeXosip2.html
  summary:
    - >
      libeXosip2 is a C SIP endpoint library layered above oSIP. It packages
      higher-level call-control, registration, messaging, and presence APIs for
      applications that do not want to drive SIP transactions directly.
  timeline:
    - '2001: Antisip says oSIP and eXosip2 open-source projects were started.'
    - '2005-03-29: Savannah archive lists libeXosip 0.9.0.'
    - '2005-11-24: Savannah archive lists libeXosip2 2.2.2.'
    - '2016-09-13: Savannah archive lists libexosip2 5.0.0.'
    - '2021-11-22: Antisip ChangeLog and Savannah archive list eXosip2 5.3.0.'
  usage:
    - >
      The library is used to initialize an eXosip context, select UDP, TCP, TLS, or DTLS
      transport, and build SIP endpoint behavior such as registration, calls, transfer,
      messaging, and presence.
