id: brew:diary
display-name: diary
repo: https://code.in0rdr.ch/diary
docs:
  - https://diary.p0c.ch/man
config-file-location:
  unix:
    - ${XDG_CONFIG_HOME:-~/.config}/diary/diary.cfg
credentials-file-location:
  unix:
    - ${XDG_CONFIG_HOME:-~/.config}/diary/diary.cfg
history:
  adoption-history:
    - >
      The supplied Homebrew facts identify diary as packaged for Homebrew with an MIT
      license and the official homepage at diary.p0c.ch.
  package-nerd-significance:
    - >
      It is package-manager friendly because it is a small terminal utility with
      XDG-style configuration, plain text journal storage, and optional CalDAV
      integration.
  project-history:
    - >
      The official manual documents a terminal journaling workflow driven by a diary
      directory, an optional XDG configuration file, and editor integration.
  related-projects:
    - >
      CalDAV clients, terminal diaries, plain-text journaling tools, calendar
      import/export tools.
  sources:
    - https://diary.p0c.ch/man
    - source_facts.homepage
    - source_facts.package-manager
  summary:
    - >
      diary is a text-based journaling program that stores entries as date-named text
      files and can import, export, and synchronize calendar entries.
  timeline:
    - >
      Current: Official manual documents XDG config, DIARY_DIR storage, .ics
      import/export, and CalDAV sync.
  usage:
    - >
      Users navigate days in the terminal, edit entries with their configured editor,
      import or export .ics files, and optionally sync entries to CalDAV.
related-packages:
  - id: brew:jrnl
    reason: >
      Choose jrnl when you prefer natural-language entry creation, tags, multiple
      journals, and optional AES encryption; diary instead centers on a calendar UI, one
      text file per date, and CalDAV/.ics workflows.
    rel: alternative
    sources:
      - https://diary.p0c.ch/man
      - https://jrnl.sh/en/stable/
tags:
  - caldav
  - calendar
  - cli
  - ics
  - journaling
  - terminal
  - text-files
  - xdg
geiger:
  category: appliance
  color: green
  confidence: low
  reason: narrow executable package without higher-risk signals
  reasons:
    - narrow executable package without higher-risk signals
  signals:
    - metadata:no-higher-risk-signals
provenance:
  category-sources:
    - >
      Official manual documents journal text files, editor integration, import/export,
      and CalDAV sync.
    - 'source_facts.description: text-based journaling program.'
  display-name-sources:
    - 'Official manual title: DIARY(1).'
    - 'source_facts.name: diary.'
  docs-sources:
    - >
      Official diary manual at https://diary.p0c.ch/man documents options, files,
      configuration, import/export, and CalDAV sync.
  history-sources:
    - https://diary.p0c.ch/man
    - source_facts.homepage
    - source_facts.package-manager
  repo-sources:
    - >
      source_facts.repo is empty; official manual links source files under
      https://code.in0rdr.ch/diary and current_curation.repo is
      https://code.in0rdr.ch/diary.
  tags-sources:
    - >
      Official manual documents DIARY_DIR, XDG config, CalDAV
      server/calendar/credentials, .ics import/export, and terminal key actions.
category-confidence: high
category-path:
  - productivity
  - journaling
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: medium
tags-confidence: high
