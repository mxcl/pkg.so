history:
  adoption-history:
    - >
      Cindori announced Backdrop in November 2023 after four years of development and
      planned an early-access beta. The finished product launched in December 2024 with
      a browser for discovering and sharing community-created scenes.
    - >
      Backdrop later expanded beyond desktop video wallpapers to include Lock Screen
      animation, custom-wallpaper creation, multi-display playback, and a community
      library. Cindori's store describes a user base exceeding 70,000.
  package-nerd-significance:
    - >
      Backdrop represents the increasingly common class of polished, proprietary Mac
      utilities distributed as Homebrew casks. Its cask lets users reproduce
      installation of a graphical customization app alongside the rest of a declarative
      Mac setup.
    - >
      Its dependence on macOS graphics, wallpaper, Lock Screen, and iCloud facilities
      makes operating-system compatibility more important than command-line integration.
      No official public source repository or stable configuration-file location was
      documented.
  project-history:
    - >
      Cindori developed Backdrop as a macOS wallpaper engine capable of rendering video
      and other dynamic scenes. The original announcement also described an editor and a
      community platform for sharing artwork.
    - >
      The public release initially emphasized video-based scenes, a built-in browser,
      and user submissions. Subsequent releases added Lock Screen video wallpapers and
      broader creation and playback features.
  related-projects:
    - >
      Backdrop is positioned as a richer alternative to macOS's built-in static and
      dynamic wallpaper facilities.
    - Cindori also develops other Mac utilities, including Sensei.
  sources:
    - 'Official announcement: https://cindori.com/news/announcing-backdrop'
    - >
      Official getting-started guide:
      https://cindori.com/support/backdrop/general/getting-started
    - 'Official release announcement: https://cindori.com/news/backdrop-release'
    - 'Official store and adoption statement: https://cindori.com/store/backdrop'
  summary:
    - >
      Backdrop is Cindori's commercial macOS application for downloading, creating,
      sharing, and displaying animated desktop and Lock Screen wallpapers.
  timeline:
    - '2023: Cindori announces Backdrop after four years of development.'
    - '2024: Backdrop receives its general public release.'
    - '2025: Backdrop 2.0 adds video wallpapers for the Mac Lock Screen.'
  usage:
    - >
      Users browse the built-in collection, download a scene, and select it as the
      desktop background. Playback can be controlled in the main window or from the
      menu-bar item, with individual or mirrored behavior for multiple displays.
    - >
      The editor can turn a local video into a private wallpaper or publish it to the
      community. Access to the community collection and preference synchronization
      requires an active, unrestricted iCloud account; license activation is handled
      inside Settings rather than through a documented credentials file.
