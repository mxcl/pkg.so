history:
  adoption-history:
    - >
      MagicPlot developed into a cross-platform commercial scientific application with
      Windows, macOS, and Unix-like distributions and commercial, academic, and student
      licensing. Its release history documents steady adoption of workflow features such
      as batch processing, reusable style templates, vector export, bundled Java
      runtimes, and platform-native builds.
  package-nerd-significance:
    - >
      MagicPlot occupies the middle ground between spreadsheet charting and
      script-driven scientific stacks. It gives researchers interactive fitting, visual
      parameter adjustment, batch processing, and publication-oriented vector export
      while retaining a portable Java-based Unix distribution and native desktop
      packages.
  project-history:
    - >
      Development of MagicPlot began in March 2007, and the first public release
      appeared in November 2008. Early releases established styled plots and figures,
      then added numerical integration, differentiation, FFT, multiple axes, drawing
      objects, calculators, histograms, statistics, and nonlinear-fitting improvements.
    - >
      The 2.x series introduced batch processing, multi-core curve fitting, expanded
      processing tools, SVG export, and increasingly polished cross-platform packaging.
      Later releases bundled Java for Windows and macOS, signed the desktop executables,
      and continued the product as a maintained 3.x application.
  related-projects:
    - >
      MagicPlot is a standalone alternative to spreadsheet plotting and script-oriented
      scientific environments; the official manual does not identify a direct
      predecessor or fork.
  sources:
    - 'Official first-launch documentation: https://magicplot.com/wiki/launch'
    - 'Official full release history: https://magicplot.com/wiki/release_notes'
    - 'Official homepage: https://magicplot.com/'
    - 'Official manual: https://www.magicplot.com/wiki/'
  summary:
    - >
      MagicPlot is cross-platform software for scientific plotting, nonlinear curve
      fitting, peak analysis, and numerical data processing. Development began in 2007,
      with a first public release in 2008, and the application has continued through
      multiple major release families.
  timeline:
    - '2007: Development began in March.'
    - '2008: MagicPlot 1.0 became the first public release on November 18.'
    - >
      2010: Version 1.2 added formulas, integration, differentiation, FFT, multiple
      axes, and drawing tools.
    - '2011: Version 2.0 added batch processing and multi-core fitting improvements.'
    - >
      2019: Version 2.9 introduced signed desktop executables and bundled Java runtimes
      on Windows and macOS.
    - '2026: MagicPlot 3.2 continued the maintained 3.x series.'
  usage:
    - >
      A typical workflow imports tabular text data into a MagicPlot project, creates a
      Figure or Fit Plot from selected columns, adjusts plot or model parameters
      visually, performs fitting or numerical processing, and exports
      publication-quality graphics in formats such as EPS, PDF, SVG, or EMF.
