history:
  adoption-history:
    - >
      Waves Central replaced Waves License Center as Waves' supported license-management
      utility on October 25, 2015. It became the standard installation and activation
      path for current Waves plug-ins and applications.
  package-nerd-significance:
    - >
      Waves Central is a proprietary, domain-specific package manager: it selects and
      installs Waves products and versions while also coordinating account entitlements
      and device-bound licenses. It illustrates how commercial creative-software
      ecosystems combine package installation with licensing workflows.
  project-history:
    - >
      Waves introduced Waves Central in October 2015 as a one-stop system for installing
      and activating Waves products. The change accompanied the Waves V9.6 product line
      and the retirement of Waves License Center.
  related-projects:
    - Waves License Center
    - Waves Creative Access
    - Waves plug-ins and live applications
  sources:
    - 'Official Waves Central download page: https://www.waves.com/downloads/central'
    - >
      Official Waves License Center retirement notice:
      https://www.waves.com/support/waves-license-center-wlc-discontinued
    - 'Official release notes: https://www.waves.com/downloads/release-notes'
  summary:
    - >
      Waves Central is Waves Audio's desktop utility for installing, updating,
      activating, and managing Waves plug-ins, applications, and licenses.
  timeline:
    - '2015: Waves introduced Waves Central as its one-stop installation and activation system.'
    - '2015: Waves License Center was discontinued and replaced by Waves Central.'
    - '2017: Waves Central added product-update and installation-repair features.'
    - '2023: Waves Central incorporated access to Waves Creative Access subscriptions.'
  usage:
    - >
      Users sign in with a Waves account, select entitled products, choose software
      versions and installation targets, and activate licenses to a computer or USB
      device. Waves also documents offline installation and license-recovery workflows.
