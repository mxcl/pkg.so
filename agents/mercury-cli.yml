history:
  project-history:
    - >
      Mercury's API product page places the CLI inside a broader developer-facing
      banking surface: a REST API, terminal-native CLI, and MCP server for programmable
      financial workflows. It specifically calls out terminal, script, and CI-pipeline
      usage; human-readable output; structured output for piping, scripting, and LLM
      consumption; and write actions such as payments, transaction categorization,
      invoices, and receipt uploads.
  sources:
    - https://formulae.brew.sh/formula/mercury-cli
    - https://github.com/MercuryTechnologies/mercury-cli
    - https://mercury.com/api
  summary:
    - >
      mercury-cli is Mercury's official command-line interface for its banking platform.
      The public repository describes it as a way to manage a Mercury account from the
      terminal, including accounts, cards, transactions, payments, recipients,
      customers, invoices, statements, treasury accounts, and webhooks. The command
      structure is resource-oriented, with examples such as mercury accounts list and
      mercury payments create.
  usage:
    - >
      The package is young enough that durable external history is sparse. Its Homebrew
      formula packages it as mercury-cli, built from the MercuryTechnologies GitHub
      repository with Go, and the repository documents installation through curl, Nix,
      and go install. Its package niche is therefore narrower than a generic finance
      library: it is a first-party operational CLI for Mercury users and automation,
      with API-token and OAuth-style login paths.
