id: brew:bacon
display-name: bacon
repo: null
docs:
  - https://dystroy.org/bacon
  - https://dystroy.org/bacon/config
config-file-location:
  unix:
    - prefs.toml
    - $BACON_PREFS
    - Cargo.toml workspace.metadata.bacon
    - workspace-root/bacon.toml
    - workspace-root/.config/bacon.toml
    - Cargo.toml package.metadata.bacon
    - package-root/bacon.toml
    - package-root/.config/bacon.toml
    - $BACON_CONFIG
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through crates.io and is packaged in Homebrew, Debian,
      Alpine, Arch, and Nix according to the batch package metadata. GitHub repository
      metadata showed several thousand stars by June 2026, consistent with a well-known
      Rust developer convenience tool rather than a niche one-off.
    - >
      Its adoption path follows the modern Rust CLI pattern: cargo install for upstream
      users, then operating-system packages for people who want reproducible workstation
      setup or package-manager updates.
  package-nerd-significance:
    - >
      Package nerds care about bacon because it is a clean example of a
      language-ecosystem helper that became worth packaging independently. It wraps
      common Cargo invocations without becoming a new dependency manager, and its config
      discovery across Cargo metadata and bacon.toml mirrors how Rust workspaces
      actually get shared.
  project-history:
    - >
      The public GitHub repository was created in October 2020 under Canop, and the
      README describes bacon as a background code checker designed for minimal
      interaction alongside an editor. Early releases reached 1.x by January 2021, and
      by 2026 the project was still publishing 3.x releases.
    - >
      bacon grew around Cargo jobs rather than replacing Cargo: the official README
      shows default usage for check, clippy, tests, nextest, documentation, and
      user-defined jobs in bacon.toml. That kept it close to Rust's standard tooling
      while adding continuous feedback, keyboard switching between jobs, and
      project-local configuration.
  related-projects:
    - Cargo, clippy, rustdoc, and cargo-nextest are the core tools bacon commonly drives.
    - >
      watchexec and cargo-watch are adjacent file-watching command runners; bacon is
      more Rust-job oriented and interactive.
  sources:
    - https://crates.io/crates/bacon
    - https://dystroy.org/bacon
    - https://github.com/Canop/bacon
    - https://github.com/Canop/bacon/releases
    - source_facts.package-manager
  summary:
    - >
      bacon is a Rust command-line tool for keeping cargo check, clippy, tests,
      documentation, and custom jobs running in the background while a developer edits
      code. Its package-manager significance is less about being a foundational compiler
      tool and more about packaging a common Rust workflow as a small, editor-adjacent
      daemon.
  timeline:
    - '2020: Canop/bacon GitHub repository created.'
    - '2021: First GitHub release series visible as v1.1.3 and related 1.x releases.'
    - '2026: v3.23.0 released, showing continued maintenance.'
  usage:
    - >
      Typical usage is to run bacon in a Rust workspace and let it keep a selected job
      alive. The README examples cover plain bacon, bacon clippy, bacon test, bacon
      nextest, bacon doc, check-all, and custom job definitions in bacon.toml.
    - >
      Because bacon watches a project and re-runs Cargo commands, it is most useful
      during active development and continuous refactoring. It is not a build system; it
      is a terminal feedback loop around Cargo.
related-packages:
  - id: brew:bacon-ls
    reason: >
      Add bacon-ls when you want Bacon-produced diagnostics published through LSP inside
      an editor; it can read Bacon's exported locations while rust-analyzer continues to
      provide completion and refactoring.
    rel: adjacent_workflow
    sources:
      - https://dystroy.org/bacon/
      - https://github.com/crisidev/bacon-ls#readme
  - id: brew:cargo-nextest
    reason: >
      Install cargo-nextest when you want Bacon's documented `nextest` job to drive
      nextest's faster Rust test runner instead of the standard Cargo test harness.
    rel: adjacent_workflow
    sources:
      - https://dystroy.org/bacon/
      - https://nexte.st/docs/
