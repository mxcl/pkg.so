history:
  adoption-history:
    - >
      Focus@Will expanded across web browsers and native macOS, Windows, iOS, and
      Android applications, with additional workplace offerings. Its official site says
      the service's research and listening history spans 16 years and reports 640,000
      users of its music.
    - >
      In 2026 the company presented Focus@Will as having evolved into focus.music,
      allowing existing subscribers to retain access with the same email address.
  package-nerd-significance:
    - >
      The Homebrew Cask packages the native macOS client for a subscription-backed
      streaming service. It is representative of casks that install a desktop front end
      while accounts, catalog data, and core service behavior remain remotely managed.
  project-history:
    - >
      Focus@Will was developed as a personalized music service intended to reduce
      distraction and support sustained concentration. Its catalog was arranged into
      focus-oriented channels and paired with timers and productivity tracking.
    - >
      The service later evolved into focus.music, described by the company as an
      adaptive focus system built on Focus@Will's accumulated behavioral data and
      human-composed catalog.
  related-projects:
    - focus.music is the official successor service.
    - Focus@Will also provided mobile, Windows, browser, Sonos, and workplace access.
  sources:
    - 'Official Windows download page: https://www.focusatwill.com/app/downloads/windows'
    - 'Official current site and migration notice: https://www.focusatwill.com/'
    - >
      Official science page:
      https://www.focusatwill.com/app/pages/science-of-focus-concentration
    - 'Package provenance: source_facts.package-manager and source_facts.provenance'
  summary:
    - >
      Focus@Will is a personalized streaming-music service and desktop application
      designed to support concentration during work, study, reading, and writing. The
      service has since evolved into focus.music.
  timeline:
    - >
      Approximately 2010–2026: The official site reports 16 years of longitudinal focus
      research.
    - >
      2026: Focus@Will announced its evolution into focus.music while preserving
      existing subscribers' account access.
  usage:
    - >
      Users selected focus-oriented music channels and listened during work or study
      sessions, optionally using an integrated timer and productivity tracker. The
      service could be used with speakers or headphones.
    - >
      Use requires a service account, but official sources do not document a local
      credentials file.
