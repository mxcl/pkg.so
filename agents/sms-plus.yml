history:
  adoption-history:
    - >
      The official page presents SMS Plus as able to run the classic software libraries
      of both supported Sega systems and advertises compatibility with titles that
      troubled less accurate emulators.
  package-nerd-significance:
    - >
      SMS Plus represents the focused, platform-specific style of classic Mac emulator
      packaging: a native application dedicated to two closely related Sega systems,
      with optional functionality supplied by a separate companion package.
  project-history:
    - >
      SMS Plus was developed as an emulator for the technically similar Sega Master
      System and Game Gear hardware. Its official feature list emphasizes accurate
      emulation, the Japanese Master System's YM2413 FM sound chip, and the CodeMasters
      memory mapper.
  related-projects:
    - >
      Emulator Enhancer, an optional Bannister.org add-on, supplies features including
      USB controller support, full-screen operation, audio effects, and recent-game
      access.
  sources:
    - >
      Official Bannister.org emulator catalog:
      https://www.bannister.org/software/index_emulators.htm
    - 'Official SMS Plus product page: https://www.bannister.org/software/sms.htm'
  summary:
    - >
      SMS Plus is a macOS emulator for Sega Master System and Game Gear software,
      maintained and distributed through Bannister.org.
  timeline:
    - >
      Current official distribution: SMS Plus 1.3.7 is listed for macOS, including
      native Apple silicon support through Bannister.org's emulator catalog.
  usage:
    - >
      Users open compatible Master System or Game Gear game images in the application.
      The emulator supports standard hardware as well as YM2413 FM audio and
      CodeMasters-mapped titles; Emulator Enhancer can add controller, full-screen, and
      convenience features.
