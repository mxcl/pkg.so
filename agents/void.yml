history:
  adoption-history:
    - >
      Void entered the AI-editor ecosystem as an open-source alternative that let users
      connect directly to hosted model providers or local models. Compatibility with VS
      Code themes, keybindings, and settings lowered migration friction for existing VS
      Code users.
    - >
      The desktop repository was archived in 2026 and the project was declared
      deprecated, leaving the code as a reference for developers building VS Code forks.
  package-nerd-significance:
    - >
      Void is relevant to package enthusiasts as a distributable desktop fork of VS Code
      combining editor packaging, bundled AI workflows, local-model support, and direct
      provider integration. Its archived source remains useful for studying how AI
      features can be incorporated into a large VS Code-derived application.
  project-history:
    - >
      Void was developed as an open-source AI code editor built by forking the VS Code
      codebase. Its product emphasized autocomplete, inline editing, chat and agent
      workflows, checkpoints, and user choice of hosted or locally operated language
      models.
    - >
      The official repository was archived on June 2, 2026, and its README now describes
      Void as deprecated and closed to further contributions.
  related-projects:
    - >
      Visual Studio Code supplies Void’s underlying editor codebase and extension
      ecosystem compatibility.
    - >
      Ollama and OpenAI-compatible endpoints are among the local or self-hosted model
      routes presented by the project.
    - Hosted model providers shown by the project include OpenAI, Anthropic, Google, and xAI.
  sources:
    - https://github.com/voideditor/void
    - https://github.com/voideditor/void/blob/main/VOID_CODEBASE_GUIDE.md
    - https://voideditor.com/
  summary:
    - >
      Void was an open-source, VS Code-derived AI code editor designed to connect users
      directly to hosted or local language models. It is now deprecated.
  timeline:
    - >
      2024: The public repository’s early issue history documents Void’s initial
      extension-era API-key and model-selection work.
    - '2026: The desktop repository was archived and Void was declared deprecated.'
  usage:
    - >
      Users employed Void for AI-assisted completion, inline edits, codebase chat,
      agent-driven work, and checkpointing changes. They could connect provider APIs
      directly or use locally hosted models while retaining familiar VS Code settings
      and keybindings.
