history:
  adoption-history:
    - >
      dasel has been packaged across common Unix package managers because it fits a
      familiar CLI niche: scripting against config files without writing one-off parsing
      code. It is most naturally adopted by shell users who want a `jq`-like utility
      that is not limited to JSON.
  package-nerd-significance:
    - >
      Package nerds care about dasel because it collapses a handful of format-specific
      dependencies into one CLI. That makes it attractive in minimal environments, CI
      scripts, and dotfile repositories where JSON, YAML, TOML, and XML all show up.
  project-history:
    - >
      The project is maintained by Tom Wright and documented through its official docs
      site and GitHub repository. Its design centers on a selector language that can
      read and modify nested data across multiple serialization formats.
    - >
      dasel's history is less about a large ecosystem moment and more about the
      packaging of a practical CLI for configuration-heavy workflows. The official docs
      emphasize installation, selectors, conversion, and command examples rather than a
      separate historical narrative.
  related-projects:
    - >
      dasel is commonly compared with `jq` for JSON, `yq` for YAML, and other small
      command-line tools that query or transform structured configuration files.
  sources:
    - https://daseldocs.tomwright.me/
    - https://github.com/TomWright/dasel#readme
    - https://github.com/TomWright/dasel/releases
  summary:
    - >
      dasel is a command-line query and modification tool for structured data formats
      including JSON, YAML, TOML, XML, and CSV. Its package-manager appeal is simple:
      one small executable covers several file formats that otherwise tend to require
      separate tools.
  timeline:
    - 'Project era: dasel established itself as a multi-format structured-data CLI.'
    - >
      Present: The official docs describe dasel as a data selector and modifier for
      JSON, YAML, TOML, XML, and CSV.
  usage:
    - >
      Common usage includes selecting values, updating fields, converting between
      formats, and using the tool in shell pipelines. Since it operates on passed files
      and streams, there is no official per-user config or credentials location to
      record.
related-packages:
  - id: brew:yq
    reason: >
      Choose yq when you prefer jq-style expressions and first-class YAML-oriented
      workflows; choose Dasel for its format-independent selector language.
    rel: alternative
    sources:
      - https://daseldocs.tomwright.me/v2
      - https://mikefarah.gitbook.io/yq/
  - id: brew:jq
    reason: >
      Choose jq for its mature JSON-specific filter language and module ecosystem;
      choose Dasel when the same workflow must cover JSON, YAML, TOML, XML, and other
      formats.
    rel: alternative
    sources:
      - https://daseldocs.tomwright.me/v2
      - https://jqlang.github.io/jq/manual/
