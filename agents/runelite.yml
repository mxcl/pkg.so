id: cask:runelite
display-name: RuneLite
repo: null
docs:
  - https://github.com/runelite/runelite/wiki
config-file-location:
  unix:
    - ~/.runelite/
  windows:
    - '%USERPROFILE%\.runelite\'
credentials-file-location: null
history:
  adoption-history:
    - >
      RuneLite became a prominent community client for Old School RuneScape. Its
      official FAQ states that the client is approved by Jagex, while warning users to
      avoid unofficial clients impersonating RuneLite.
    - >
      The Homebrew Cask represented by source_facts.package-manager provides a familiar
      macOS installation route alongside RuneLite's native launcher.
  package-nerd-significance:
    - >
      RuneLite is notable for combining an open-source game client with a large plugin
      ecosystem and frequent compatibility updates tied to Old School RuneScape changes.
    - >
      Its launcher, client, wiki, plugin hub, profiles, and cross-platform packaging
      make it an unusually substantial desktop package around a continuously updated
      online game.
  project-history:
    - >
      The official project was publicly shipping regular releases by early 2018. Its
      release archive documents continuing additions to the client’s overlays, trackers,
      interface, performance, and platform support.
    - >
      The project later added a Plugin Hub, account-linked profiles, launcher
      configuration, and integrations such as RuneScape Wiki pricing.
  related-projects:
    - Old School RuneScape
    - RuneLite launcher
    - RuneLite Plugin Hub
    - RuneScape Wiki
  sources:
    - '[Official RuneLite FAQ](https://github.com/runelite/runelite/wiki/FAQ)'
    - '[Official RuneLite blog archive](https://runelite.net/blog/)'
    - '[Official RuneLite repository](https://github.com/runelite/runelite)'
    - source_facts.package-manager
  summary:
    - >
      RuneLite is an open-source desktop client for Old School RuneScape, distributed
      with a dedicated launcher and maintained around the game's continuing update
      cycle.
  timeline:
    - '2018: Official release posts document an active RuneLite release series.'
    - '2019: The official archive records the introduction of the RuneLite Plugin Hub.'
    - '2021: RuneLite and the RuneScape Wiki established a Grand Exchange pricing partnership.'
    - >
      2023: Account-linked configuration profiles and a launcher configuration interface
      were introduced.
  usage:
    - >
      Players use RuneLite to launch Old School RuneScape with configurable overlays,
      trackers, notifications, visual options, and approved plugins.
    - >
      Configuration, profiles, logs, screenshots, and related client state are kept
      beneath the `.runelite` directory in the user's home directory.
