config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Kate occupied a specific moment in open media packaging: Xiph codecs were widely
      packaged, subtitle and karaoke support were still codec-fragmented, and players
      such as VLC, MPlayer, xine, and GStreamer were natural integration targets. The
      README notes VLC 1.0 support for basic text and SPU Kate streams and preliminary
      patches for other players.
  package-nerd-significance:
    - >
      libkate is package-nerd catnip because it is a small, specialized codec library
      from the Ogg era: valuable for archival compatibility and multimedia dependency
      graphs, but rarely something a user installs directly. It explains why older
      multimedia stacks may carry an apparently odd subtitle/karaoke codec dependency.
  project-history:
    - >
      The Xiph.Org repository records an initial import on 2008-03-21. The README
      describes libkate as the reference implementation for the Kate bitstream format
      and explains that Kate was meant to carry Unicode text, images, animation, and
      timed metadata in an Ogg container.
    - >
      The project shipped command-line tools such as kateenc, katedec, and katalyzer,
      plus KateDJ for remixing Kate tracks in Ogg streams. Upstream documentation also
      pointed to libtiger, a Pango/Cairo rendering library for Kate streams.
  related-projects:
    - >
      Related projects include Ogg, Vorbis, Theora, VLC, MPlayer, xine, GStreamer,
      libtiger, Pango, Cairo, and SubRip subtitle tooling.
  sources:
    - https://formulae.brew.sh/formula/libkate
    - https://gitlab.xiph.org/xiph/kate
    - https://gitlab.xiph.org/xiph/kate/-/tags
    - https://wiki.xiph.org/OggKate
  summary:
    - >
      libkate is the reference implementation of Kate, an Ogg overlay codec for timed
      text, karaoke, subtitles, lyrics, images, and arbitrary timed metadata. It belongs
      to the Xiph.Org media-codec ecosystem alongside Ogg, Vorbis, and Theora.
  timeline:
    - '2008-03-21: Xiph.Org Kate repository initial import.'
    - >
      2008: README copyright identifies Vincent Penquerc'h and describes libkate as the
      reference implementation.
    - '2008-09-28: kate-0.2.1 tag points at a maintenance commit.'
    - '2009: README describes VLC 1.0 support for basic Kate streams.'
  usage:
    - >
      The included tools encode Kate text or SubRip files into Ogg/Kate streams, decode
      Ogg/Kate streams back to text formats, inspect streams, and remix Kate tracks.
      Most use cases were subtitles, lyrics, karaoke timing, and metadata overlays
      multiplexed with audio or video.
related-packages:
  - id: brew:ffmpeg2theora
    reason: >
      ffmpeg2theora can turn SubRip subtitle input into Kate streams while producing
      Ogg/Theora media, making it a practical front end for libkate-based subtitle
      authoring.
    rel: adjacent_workflow
    sources:
      - https://wiki.xiph.org/OggKate
  - id: brew:oggz
    reason: >
      KateDJ uses the oggz tools to demultiplex and remultiplex Kate tracks when editing
      subtitles or other overlays in an existing Ogg file.
    rel: adjacent_workflow
    sources:
      - https://wiki.xiph.org/OggKate
  - id: cask:vlc
    reason: >
      VLC is an officially documented Kate-capable player, so it can play Ogg media
      containing streams encoded by libkate.
    rel: adjacent_workflow
    sources:
      - https://wiki.xiph.org/OggKate
