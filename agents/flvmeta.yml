history:
  adoption-history:
    - >
      FLVMeta was packaged for multiple Unix-like distributions;
      source_facts.package-manager records Homebrew, Debian, and Ubuntu packages. Its
      command-line interface and structured XML, YAML, and JSON output made it usable
      both interactively and in media-processing automation.
    - >
      The tool occupied a practical niche during the FLV and HTTP pseudo-streaming era:
      repairing or injecting metadata when encoders had not produced seekable files.
      Continued packaging preserves it for archival and legacy-media workflows.
  package-nerd-significance:
    - >
      FLVMeta is a mature, narrowly scoped Unix utility from the Flash-video ecosystem.
      Package maintainers value it as a small composable tool for inspecting,
      validating, repairing, and normalizing legacy FLV assets without loading whole
      files into memory.
  project-history:
    - >
      Marc Noirot released FLVMeta publicly in September 2007 as a utility for computing
      and inserting FLV `onMetaData` information. Early releases improved 64-bit
      operation, codec handling, extended timestamps, large-file support, and
      malformed-file robustness.
    - >
      The 1.1 line consolidated the former flvdump functionality into flvmeta and added
      metadata dumping, XML/YAML/JSON formats, schemas, file validation, custom
      metadata, timestamp resetting, and CMake support. Later releases improved
      checking, modernized builds, added AVC/AAC packet dumping, and fixed parser and
      memory-safety defects.
  related-projects:
    - flvdump was folded into flvmeta in the 1.1 development line.
    - FLV, AMF0, AVC/H.264, AAC, VP6, and Speex are formats or codecs handled by the utility.
  sources:
    - https://flvmeta.com/flvmeta.1.html
    - https://github.com/noirotm/flvmeta#readme
    - https://github.com/noirotm/flvmeta/blob/master/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      FLVMeta is a command-line editor, inspector, and validator for Adobe Flash Video
      files. It can calculate and inject seek metadata, dump FLV and AMF information,
      and diagnose malformed or incompatible files.
  timeline:
    - '2007: Version 1.0 became the first public release.'
    - >
      2008: Extended timestamps and support for all codecs in the official FLV
      specification were added.
    - '2009: Large-file and AVC resolution support matured.'
    - >
      2012: The 1.1 beta integrated flvdump and added structured dumping, schemas, and
      file checking.
    - >
      2016: Version 1.2 improved 64-bit handling and validation and added AVC/AAC packet
      dumping.
    - '2019: Version 1.2.2 fixed several invalid-memory-access and overflow defects.'
  usage:
    - >
      With one input file and no explicit command, flvmeta dumps its metadata; with
      input and output paths, it writes an updated file. Explicit modes provide metadata
      dumping, full-file dumping, validation, and metadata updating.
    - >
      Typical package and media-pipeline uses include adding keyframe indices for
      random-access seeking, generating XML/YAML/JSON metadata, checking FLV validity by
      exit status, resetting timestamps, and repairing selected invalid tags.
