history:
  adoption-history:
    - >
      BrowserOS is distributed as a desktop Chromium fork for macOS, Windows, and Linux
      and is designed to retain compatibility with familiar browser data and Chrome
      extensions.
    - >
      The project broadened from an AI-assisted browser for human users into a
      repository that also houses BrowserOS neo, a secondary browser intended for
      external MCP agents.
  package-nerd-significance:
    - >
      BrowserOS is notable to package users because it combines a complete
      Chromium-derived browser with a locally running agent service rather than shipping
      only a browser extension or hosted automation API.
    - >
      Its bring-your-own-model design, local-model support, MCP endpoint, and AGPL
      licensing make it relevant to users seeking inspectable, locally controlled
      browser automation.
  project-history:
    - >
      BrowserOS emerged in 2025 as an open-source Chromium fork with a built-in AI
      agent. The project credits Chromium and ungoogled-chromium as its browser
      foundations.
    - >
      The original BrowserOS product is a browser operated by a person with an agent
      built into each new tab. The same project later introduced BrowserOS neo, a
      companion browser designed to be driven by external AI tools.
    - >
      Development added provider choice, local Ollama and LM Studio support, scheduled
      tasks, MCP integrations, cloud-sync options, and controlled local file and command
      access.
  related-projects:
    - Chromium
    - ungoogled-chromium
    - BrowserOS neo
    - Model Context Protocol (MCP)
    - Ollama
    - LM Studio
  sources:
    - https://docs.browseros.com/browseros/
    - https://docs.browseros.com/llms.txt
    - https://github.com/browseros-ai/BrowserOS
    - https://www.browseros.com/
  summary:
    - >
      BrowserOS is an open-source Chromium-based browser with a built-in AI agent. It
      supports hosted or local models and exposes browser automation to compatible
      external agents through MCP.
  timeline:
    - '2025: BrowserOS was presented as an open-source agentic browser.'
    - >
      2025–2026: Documentation expanded to cover model providers, scheduled tasks,
      application connectors, MCP clients, and cloud sync.
    - >
      2026: The repository added BrowserOS neo alongside the original human-operated
      BrowserOS product.
  usage:
    - >
      Users can browse normally while asking the built-in agent to navigate sites, fill
      forms, extract information, and perform multi-step web tasks.
    - >
      Users may bring API access for supported model providers or run local models
      through Ollama or LM Studio. BrowserOS can also act as an MCP server for tools
      such as Claude Code and other compatible clients.
    - >
      The application stores browser profiles and provider state locally, but the
      official user documentation reviewed does not identify stable individual config or
      credentials files, so no file paths are asserted.
