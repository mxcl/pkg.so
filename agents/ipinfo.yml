id: brew:ipinfo
display-name: ipinfo
repo: null
docs:
  - https://kyberdigi.cz/projects/ipinfo
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package is obscure but durable: its value is the classic Unix shape of a tiny
      calculator binary plus a companion matcher, easy to build with make and gcc and
      easy for package managers to wrap.
  package-nerd-significance:
    - >
      This is the non-API `ipinfo` package, not IPinfo.io's `ipinfo-cli`. The
      distinction matters because both expose network-oriented commands, but Kyberdigi
      ipinfo is a local subnet calculator whose Homebrew executable is `ipmatch` in the
      supplied metadata.
    - >
      Its significance is mostly historical and practical: a tiny pre-cloud networking
      helper with a Beerware license and a name that now collides with a much larger IP
      intelligence brand.
  project-history:
    - >
      The official Kyberdigi page describes ipinfo as a Linux-first C program for
      calculating network address, broadcast address, wildcard address, prefix length,
      usable host ranges, and address counts from an IP address and mask.
    - >
      The project page lists version 1.0 in 2004, version 1.1 in 2013, and version 1.2
      in 2014. It also records a license change: version 1.0 under the GPL, and version
      1.1 and later under the Beerware license.
  related-projects:
    - ipcalc and sipcalc occupy similar subnet-calculation territory.
    - IPinfo CLI is unrelated despite the similar package name in some package managers.
  sources:
    - https://kyberdigi.cz/projects/ipinfo/
  summary:
    - >
      Kyberdigi ipinfo is a small C utility for IPv4 network calculations, accompanied
      by `ipmatch` for checking whether an address belongs to a subnet or represents a
      network or broadcast address.
  timeline:
    - '2004: Version 1.0 released.'
    - '2013: Version 1.1 released.'
    - '2014: Version 1.2 released.'
  usage:
    - >
      Users run `ipinfo` with an address and optional mask or prefix to print
      network-derived values, or use flags to select a specific output such as netmask,
      prefix, broadcast, host count, or host range.
    - >
      `ipmatch` handles the related membership test: whether an address belongs to a
      subnet, is the network address, or is the broadcast address.
related-packages:
  - id: brew:ipcalc
    reason: >
      Choose ipcalc when you want explanatory binary subnet layouts, wildcard masks, and
      an IPv6-capable continuation rather than ipinfo's smaller IPv4-oriented calculator
      and matcher.
    rel: alternative
    sources:
      - https://kyberdigi.cz/projects/ipinfo/
      - https://jodies.de/ipcalc
      - https://github.com/kjokjo/ipcalc
  - id: brew:sipcalc
    reason: >
      Choose sipcalc for IPv4 and IPv6 calculation, interface queries, standard-input
      processing, and recursive subnet splitting.
    rel: alternative
    sources:
      - https://kyberdigi.cz/projects/ipinfo/
      - https://www.routemeister.net/projects/sipcalc/
      - https://www.routemeister.net/projects/sipcalc/sipcalc-man.html
