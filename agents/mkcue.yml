id: brew:mkcue
display-name: mkcue
repo: https://salsa.debian.org/debian/mkcue
docs:
  - https://manpages.debian.org/bullseye/mkcue/mkcue.1.en.html
  - https://packages.debian.org/sid/mkcue
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      mkcue survives mainly through distribution packaging. Debian, Ubuntu, Homebrew,
      and Nix package it for users maintaining optical-disc archival workflows.
  package-nerd-significance:
    - >
      mkcue is package-nerd interesting because it is the kind of tiny Unix utility that
      remains useful only when kept alive by distributions. Its value is narrow, but it
      composes with abcde, FLAC, and optical-disc archival packages.
  project-history:
    - >
      The Debian manpage notes that it was written for Debian because the original
      program did not include one. The current Debian source package is maintained as
      `mkcue` and has an official Debian source repository on Salsa.
  related-projects:
    - >
      mkcue is related to abcde, FLAC ripping workflows, cuetools, cue2toc, libdiscid,
      and Debian sound packages.
  sources:
    - https://manpages.debian.org/bullseye/mkcue/mkcue.1.en.html
    - https://packages.debian.org/sid/mkcue
    - https://packages.debian.org/source/sid/mkcue
  summary:
    - >
      mkcue is a small command-line utility that generates a CUE sheet from a CD table
      of contents. Debian's package description presents it as a companion to abcde for
      backing up audio CDs as a single FLAC track plus cue sheet.
  timeline:
    - '2008: Debian changelog history records Debian packaging activity for mkcue 1.'
    - '2021: Debian bullseye manpage documents the command interface.'
    - >
      2026: Debian sid lists source package mkcue 1-9 with Salsa as the Debian source
      repository.
  usage:
    - >
      The interface is intentionally small: `mkcue` reads a CD-ROM device, defaults to
      `/dev/cdrom`, and supports `-t` to exclude tracks above a given count, which is
      useful for CDs with data tracks.
    - >
      Its role is metadata extraction for audio-CD backups rather than general cue-sheet
      editing.
related-packages:
  - id: brew:abcde
    reason: >
      Use mkcue with abcde when ripping an audio CD as a single lossless file plus a CUE
      sheet; Debian and abcde document mkcue as part of that workflow.
    rel: adjacent_workflow
    sources:
      - https://packages.debian.org/sid/mkcue
      - https://abcde.einval.com/wiki/
  - id: brew:cuetools
    reason: >
      Use cuetools after mkcue to print or convert the generated CUE metadata, extract
      track breakpoints, or apply tags.
    rel: adjacent_workflow
    sources:
      - https://packages.debian.org/sid/mkcue
      - https://github.com/svend/cuetools
  - id: brew:flac
    reason: >
      Use FLAC to store the lossless single-file audio image paired with mkcue's CUE
      sheet in the archival workflow documented by Debian.
    rel: adjacent_workflow
    sources:
      - https://packages.debian.org/sid/mkcue
      - https://xiph.org/flac/
