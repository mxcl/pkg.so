credentials-file-location: null
history:
  adoption-history:
    - >
      Jump Desktop expanded from conventional RDP and VNC access to its own Fluid
      protocol and clients across macOS, Windows, iOS, and Android. Later releases added
      collaboration, audio, virtual displays, browser access, and centrally managed
      Teams features.
  package-nerd-significance:
    - >
      Jump Desktop is notable to package users as a polished proprietary remote-access
      client distributed across several platforms while retaining compatibility with
      standard RDP and VNC workflows alongside its vendor-specific Fluid stack.
  project-history:
    - >
      Jump Desktop developed from a multi-protocol remote-desktop client into a broader
      remote-work platform. In the mid-2010s it introduced Fluid Remote Desktop, a
      proprietary high-performance screen-sharing protocol designed to use less
      bandwidth than RDP or VNC. Subsequent generations added end-to-end encryption,
      audio, multi-monitor handling, collaboration, and enterprise management.
  related-projects:
    - Jump Desktop Connect
    - Jump Desktop for Teams
    - Microsoft Remote Desktop Protocol
    - VNC
  sources:
    - https://changelog.jumpdesktop.com/
    - https://jumpdesktop.com/
    - https://jumpdesktop.com/redir/new_pc_inapp/index-old.html
    - https://support.jumpdesktop.com/hc/en-us/articles/216423983-General-Fluid-Remote-Desktop
  summary:
    - >
      Jump Desktop is a cross-platform remote-desktop client and service supporting the
      vendor's Fluid protocol as well as established remote-access workflows such as RDP
      and VNC.
  timeline:
    - >
      2016: Jump Desktop 7.0 entered beta on Windows as a rewritten viewer centered
      initially on Fluid connections.
    - '2017: Fluid Remote Desktop left beta for connections to Windows and macOS.'
    - >
      2024: Fluid 2.0 release candidates added new compression, color, audio,
      networking, and browser-access capabilities.
    - >
      2026: Jump Desktop 10 release notes documented expanded virtual-display and
      USB-redirection features.
  usage:
    - >
      Users install Jump Desktop on the viewing device and typically install Jump
      Desktop Connect on the remote computer. Connections can use automatic discovery
      and Fluid, while manual configurations support traditional remote-desktop setups.
