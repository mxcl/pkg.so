config-file-location:
  unix:
    - <project-root>/compile_commands.json
    - <project-root>/.ccls
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package facts show ccls packaged broadly across Alpine, Homebrew,
      Debian, MacPorts, Nix, Arch, Ubuntu, and openSUSE. That spread reflects
      language-server adoption by editors and distributions after the Language Server
      Protocol became common infrastructure.
  package-nerd-significance:
    - >
      ccls is significant because it packages a clang-based language server as a
      standalone system dependency instead of binding users to one editor extension. For
      package managers, it is the sort of developer-tool daemon that makes editor
      integrations reproducible across machines.
  project-history:
    - >
      The official GitHub repository was created in March 2018. The README explicitly
      frames ccls as originating from cquery, another C/C++ language-server project, and
      describes ccls' distinguishing emphasis on indexing the whole project while
      serving requests before indexing is complete.
  related-projects:
    - >
      The README names cquery as the origin project and relies on clang-style
      compilation databases such as compile_commands.json.
  sources:
    - https://api.github.com/repos/MaskRay/ccls
    - https://github.com/MaskRay/ccls
    - https://github.com/MaskRay/ccls/wiki
    - https://github.com/MaskRay/ccls#readme
    - https://formulae.brew.sh/api/formula/ccls.json
  summary:
    - >
      ccls is a C, C++, and Objective-C language server. Its README says it originates
      from cquery and supports completion, cross references, hierarchies, formatting,
      diagnostics, semantic highlighting, and whole-project indexing.
  timeline:
    - '2018: GitHub repository created.'
    - >
      2018: README documents ccls as originating from cquery and able to index itself,
      FreeBSD, glibc, Linux, LLVM, and musl.
    - '2025: GitHub tags show continued dated releases.'
  usage:
    - >
      A typical ccls setup gives the server a project-root compile_commands.json
      generated by the build system, or a project-root .ccls file containing compiler
      flags. Editors then speak LSP to ccls for code completion, navigation, references,
      diagnostics, and semantic highlighting.
related-packages:
  - id: brew:llvm
    reason: >
      Choose LLVM's clangd for the LLVM project's own C/C++ language server; choose ccls
      when its whole-project indexing and ccls-specific cross-reference extensions
      better fit the editor workflow.
    rel: alternative
    sources:
      - https://clangd.llvm.org/
      - https://github.com/MaskRay/ccls
