history:
  adoption-history:
    - >
      InfoCert distributes the suite across desktop, web and mobile surfaces. The
      official product page positions it for individuals and professional users, with
      FREE, PRO and Business tiers supporting progressively broader batch-signing and
      workflow capabilities.
  package-nerd-significance:
    - >
      For package-manager users, the cask provides a repeatable installation path for a
      proprietary trust-service client that would otherwise be installed from a vendor
      download. The application is notable for covering several European
      electronic-signature container formats and both hardware-backed and remote signing
      workflows.
  project-history:
    - >
      InfoCert Sign Desktop is the desktop member of InfoCert's signing suite. It
      combines digital signing, signature verification and trusted timestamp operations,
      with support for physical signature devices, remote signatures and software
      certificates.
  related-projects:
    - >
      The same InfoCert Sign suite includes web and mobile applications. Desktop
      licenses are offered in FREE and PRO tiers, while the wider suite also includes
      Business workflow features.
  sources:
    - https://help.infocert.digital/Home/Guida/infocert-sign-manual-desktop
    - https://infocert.digital/consumer/infocert-sign-suite/
  summary:
    - >
      InfoCert Sign Desktop is a proprietary digital-signature and timestamp application
      for signing and validating documents.
  timeline:
    - >
      Current suite era: InfoCert Sign is offered through desktop, web and mobile
      applications with FREE, PRO and Business capabilities.
  usage:
    - >
      Users can sign PDF and other documents using PAdES, CAdES and, where licensed,
      XAdES workflows; validate signed files; and apply timestamps. Authentication may
      involve a signature-device PIN or remote-signature credentials and a one-time
      code. Account, certificate, timestamp, proxy and license settings are managed
      through the application's interface.
