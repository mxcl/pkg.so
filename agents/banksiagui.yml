history:
  adoption-history:
    - >
      BanksiaGUI is aimed at a broad chess audience ranging from casual players to
      engine testers and developers. It is distributed for Windows, macOS, and Linux and
      developed through frequent preview releases informed by user feedback.
    - >
      Its feature growth followed specialist computer-chess needs: engine tournaments,
      UCI and WinBoard integration, Chess960, opening books, database tooling, Lichess
      bots, network engines, test suites, and analysis workflows.
  package-nerd-significance:
    - >
      BanksiaGUI is significant to computer-chess enthusiasts because it combines
      ordinary chess play with engine-management and tournament-laboratory features in
      one cross-platform GUI. It also exposes package-relevant operational details such
      as a configurable data folder containing JSON and initialization files.
  project-history:
    - >
      BanksiaGUI was developed by Nguyen Hong Pham as a freeware, cross-platform chess
      graphical interface built on the open-source Banksia chess tournament manager.
    - >
      Public alpha releases appeared in 2019, followed by beta development in 2020. The
      project continued adding database, accessibility, analysis, networking, and
      engine-testing capabilities while working toward a 1.0 release.
  related-projects:
    - >
      Banksia is the open-source chess tournament manager on which BanksiaGUI is based:
      https://github.com/nguyenpham/Banksia
    - >
      UCI and WinBoard chess engines, Lichess bots, Polyglot books, Syzygy tablebases,
      and PGN/EPD databases are major parts of its surrounding ecosystem.
  sources:
    - 'Official About page: https://banksiagui.com/about/'
    - 'Official download page: https://banksiagui.com/download/'
    - 'Official homepage: https://banksiagui.com/'
    - 'Official version history: https://banksiagui.com/versions-history/'
  summary:
    - >
      BanksiaGUI is a freeware, cross-platform chess interface for playing, analysis,
      engine tournaments, databases, opening books, and online or networked chess
      workflows.
  timeline:
    - '2019: Public alpha releases added tournament and engine-oriented features.'
    - >
      2020: The project entered beta and added Chess960, Internet Chess Server support,
      opening-book tooling, and a configurable data folder.
    - >
      2021: Releases expanded analysis, backups, engine testing, databases, networking,
      and Lichess-bot support.
    - >
      2022: The application moved to Qt 6, added native Apple Silicon support, richer
      database facilities, and accessibility features.
    - '2023: Version 0.58 was published as a release candidate for the planned 1.0 release.'
  usage:
    - >
      Users play against people or chess engines, run engine tournaments, analyze
      positions and games, manage PGN/EPD and other chess databases, build or inspect
      opening books, connect remote engines, operate Lichess bots, and run
      engine-development tests.
