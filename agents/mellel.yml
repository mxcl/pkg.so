history:
  adoption-history:
    - >
      Mellel grew from a small independent Mac application into a long-lived commercial
      word processor with macOS and iOS editions. Its official material particularly
      addresses academics, students, authors, and writers of scholarly, scientific,
      technical, multilingual, and long documents.
  package-nerd-significance:
    - >
      Mellel is a durable example of independent Mac-native productivity software.
      Package users value the cask as a repeatable installation path for a specialized
      commercial word processor whose structured styles, outlining, citations,
      cross-references, and right-to-left support distinguish it from general office
      suites.
  project-history:
    - >
      Eyal and Ori Redler founded Mellel in 2002. Eyal Redler wrote the application, and
      Mellel 1.0 appeared early that year. By August, version 1.3.2 had become a
      commercial product and gained its first paying customer. Development continued
      through major 2.x, 3.x, 4.x, 5.x, and 6.x generations.
  related-projects:
    - Mellel Mobile
    - Bookends
  sources:
    - https://www.mellel.com/about-us/
    - https://www.mellel.com/faq/
    - https://www.mellel.com/guides/directory/
  summary:
    - >
      Mellel is an independent commercial word processor designed for long, complex,
      scholarly, scientific, and technical documents.
  timeline:
    - '2002: Eyal and Ori Redler founded Mellel and released Mellel 1.0.'
    - 'August 2002: Mellel 1.3.2 became a paid product and attracted its first customers.'
    - '2022: Mellel 5.1 overhauled the Auto-title hierarchy system.'
    - '2025: Mellel 6.5 added navigation history and extensive style-palette improvements.'
    - >
      2026: The Mellel 6.7 release series continued development for Apple Silicon and
      Intel Macs.
  usage:
    - >
      Writers use Mellel for books, dissertations, articles, and technical manuscripts
      that need consistent style sets, outlines, auto-titles, tables of contents,
      citations, bibliographies, notes, indexes, cross-references, and multilingual or
      right-to-left typography.
