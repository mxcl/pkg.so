history:
  adoption-history:
    - >
      LibreOffice 4.0, released in 2013, is listed by LibreOffice's own timeline as
      adding an import filter for Microsoft Publisher files. After the Document
      Liberation Project launch, libmspub continued as one of the libraries that let
      non-LibreOffice software reuse the parser instead of carrying the import code only
      inside an office suite.
    - >
      The Document Foundation's 2018 DLP announcement names libmspub as the library for
      importing MS Publisher documents and says the DLP libraries can be used by other
      software under OSI-compliant licensing.
  package-nerd-significance:
    - >
      Package maintainers care about libmspub because it turns a historically awkward
      proprietary desktop-publishing format into a normal shared library dependency. It
      also illustrates the Document Liberation pattern: one narrow parser library, tied
      to librevenge, with command-line probes for testing and conversion.
  project-history:
    - >
      The libmspub repository identifies the project as a library and set of tools for
      reading and converting Microsoft Publisher files, with build dependencies
      including Boost, ICU, librevenge, and zlib. Its cgit history shows early 0.0.x
      tags and the later 0.1.x series, with the 0.1.0 tag appearing in the same
      long-lived LibreOffice/freedesktop source tree.
    - >
      The Document Liberation Project context matters: The Document Foundation says
      LibreOffice developers and file-format engineers began extracting
      proprietary-format knowledge into reusable libraries, and that the Document
      Liberation Project was born in April 2014 when the family of libraries had grown
      large enough to need an independent home.
  related-projects:
    - >
      libmspub sits beside other Document Liberation import libraries such as libvisio,
      libwps, libmwaw, libpagemaker, libqxp, and libfreehand. Its parser stack is tied
      to librevenge, the common document-interface framework used by several DLP
      libraries.
  sources:
    - https://blog.documentfoundation.org/blog/2018/01/22/dlp-five-new-libraries/
    - https://cgit.freedesktop.org/libreoffice/libmspub/
    - https://formulae.brew.sh/formula/libmspub
    - https://github.com/LibreOffice/libmspub
    - https://wiki.documentfoundation.org/DLP/Libraries/libmspub
    - https://www.documentliberation.org/about/
    - https://www.libreoffice.org/libreoffice-timeline/
  summary:
    - >
      libmspub is a Document Liberation Project library and toolset for reading and
      converting Microsoft Publisher files. It is part of the LibreOffice-adjacent
      family of small import-filter libraries that turn proprietary office formats into
      reusable open-source parsing components.
  timeline:
    - >
      2013: LibreOffice 4.0 release notes list import-filter support for Microsoft
      Publisher files.
    - >
      2014-04: The Document Liberation Project is born within The Document Foundation
      framework.
    - >
      2015-04-09: The Document Foundation describes DLP libraries as independent
      projects with their own maintainers, release schedules, and licenses.
    - >
      2018-01-22: The Document Foundation announces DLP libraries including libmspub for
      importing MS Publisher documents.
    - '2026-05-26: The cgit log records release-maintenance commits in the libmspub repository.'
  usage:
    - >
      libmspub is used through its library API by document converters and through small
      tools such as pub2raw and pub2xhtml in packaged builds. Its practical job is
      rescuing .pub content from a proprietary desktop-publishing format into
      inspectable or convertible output.
related-packages:
  - id: brew:writerperfect
    reason: >
      Use writerperfect after installing libmspub when you want command-line conversion
      of Microsoft Publisher documents to ODF or EPUB rather than only the parser's raw
      or XHTML-oriented tools.
    rel: adjacent_workflow
    sources:
      - https://sourceforge.net/p/libwpd/wiki/writerperfect/
      - https://www.documentliberation.org/projects/
