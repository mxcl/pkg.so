history:
  adoption-history:
    - >
      YubiSwitch is distributed through official GitHub releases and as the
      `pallotron-yubiswitch` Homebrew cask. The repository documents later macOS
      Accessibility and Input Monitoring requirements and continued compatibility work
      for newer macOS releases.
  package-nerd-significance:
    - >
      The utility addresses a hardware-specific operational problem familiar to
      security-key users: a permanently inserted YubiKey Nano can accidentally emit OTP
      text when touched. It is also notable for separating its menu-bar interface from a
      privileged helper that exclusively controls the USB HID interface.
  project-history:
    - >
      Anton Tolchanov originally implemented the idea in Python with PyObjC. The current
      project was ported to Objective-C after the older Carbon Event Manager bridge
      became unsuitable for Python 3, and it grew to include configurable shortcuts,
      automatic switching, AppleScript commands, and screen-lock behavior.
  related-projects:
    - YubiKey Nano and YubiKey Neo hardware from Yubico.
    - ShortcutRecorder, used for global keyboard-shortcut configuration.
  sources:
    - https://github.com/pallotron/yubiswitch#readme
    - https://github.com/pallotron/yubiswitch/releases/
  summary:
    - >
      YubiSwitch is a macOS status-bar utility that temporarily enables or disables a
      connected YubiKey's USB HID interface, primarily to prevent accidental OTP entry
      from Nano-style keys.
  timeline:
    - >
      Early project: Anton Tolchanov's Python/PyObjC implementation inspired an
      Objective-C port.
    - >
      Later releases: Added configurable shortcuts, AppleScript KeyOn/KeyOff commands,
      automatic switching, and modern macOS permission guidance.
  usage:
    - >
      Launch the status-bar application and use its menu or configured global shortcut
      to enable or disable the key. First launch requests the user's password to install
      a privileged helper. On macOS Catalina and later, the app may also require
      Accessibility and Input Monitoring permission.
