credentials-file-location:
  linux:
    - ~/.sabnzbd/sabnzbd.ini
  macos:
    - ~/Library/Application Support/SABnzbd/sabnzbd.ini
  windows:
    - '%USERPROFILE%\AppData\Local\sabnzbd\sabnzbd.ini'
history:
  adoption-history:
    - >
      SABnzbd is distributed across desktop and server-oriented environments and is
      designed to work through a browser-based interface. The official project describes
      it as working practically everywhere.
    - >
      Its package-manager appeal comes from unattended operation and portability:
      source_facts.package-manager records a Homebrew Cask, while the official manual
      covers Windows, macOS, Unix, NAS, and source installations.
  package-nerd-significance:
    - >
      SABnzbd is a long-running example of a Python application packaged as a
      self-contained desktop or server service while retaining a web interface and
      automation API.
    - >
      It occupies a durable niche in self-hosting and media-automation stacks because it
      turns NZB input into verified, repaired, extracted, categorized output with
      minimal intervention.
  project-history:
    - >
      Official source headers show continuous SABnzbd maintenance dating from at least
      2007. The project developed as an open-source Python binary newsreader focused on
      automating the complete Usenet download and post-processing workflow.
    - >
      The project maintains stable and development branches and publishes its own
      website, manual, installation guidance, and API documentation.
  related-projects:
    - Usenet
    - NZB
    - PAR2
    - unrar
  sources:
    - '[Official SABnzbd repository](https://github.com/sabnzbd/sabnzbd)'
    - '[Official SABnzbd user manual](https://sabnzbd.org/wiki/)'
    - '[Official folder-setup documentation](https://sabnzbd.org/wiki/advanced/directory-setup)'
    - source_facts.package-manager
  summary:
    - >
      SABnzbd is an open-source Python binary newsreader that automates downloading,
      verification, repair, extraction, and filing of content described by NZB files.
  timeline:
    - >
      2007: Official source headers indicate the beginning of the project's maintained
      copyright history.
    - >
      2023: The project publicly tested a major downloader-performance redesign with its
      community.
  usage:
    - >
      Users configure Usenet servers, folders, categories, scheduling, RSS, sorting,
      notifications, and post-processing through the web interface, then add NZB files
      or integrate other applications through the API.
    - >
      All configuration data—including configured server and interface credentials—is
      stored in `sabnzbd.ini`; the official folder-setup documentation gives
      platform-specific default locations.
tags:
