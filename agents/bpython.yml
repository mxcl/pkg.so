id: brew:bpython
display-name: bpython
repo: https://github.com/bpython/bpython
docs:
  - https://docs.bpython-interpreter.org/en/latest
  - https://docs.bpython-interpreter.org/en/latest/configuration.html
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/bpython/config
    - ~/.config/bpython/config
credentials-file-location: null
history:
  adoption-history:
    - >
      bpython became a staple optional Python REPL in package managers because it adds
      interactive niceties without asking users to abandon standard Python semantics.
      The input package facts list Homebrew, Debian, Fedora, Arch, and Ubuntu packaging.
    - >
      Its adoption overlaps with IPython, ptpython, and standard `python` REPL
      workflows. bpython's niche is lightweight terminal interaction: autocomplete and
      display improvements with less notebook or shell-framework machinery.
  package-nerd-significance:
    - >
      bpython matters because REPL ergonomics are a quiet but important layer of
      language tooling. It is small enough to package like a CLI utility, but visible
      enough that Python users often discover it while comparing interpreter frontends.
    - >
      For package history, bpython is also a durable example of a non-core developer
      tool following Python's release cadence. Each new Python version creates
      compatibility work, so the package's changelog doubles as a record of ecosystem
      maintenance.
  project-history:
    - >
      The GitHub repository describes bpython as a fancy curses interface to the Python
      interactive interpreter, and the official website lists Linux, BSD, macOS, and
      partial Windows support. The tag history reaches back to a 0.9.4 release commit in
      July 2009, while the modern GitHub repository metadata dates the current
      repository object to 2014.
    - >
      Over time, bpython tracked Python language releases and terminal UI dependencies.
      The official changelog records releases focused on Python 3.10, 3.11, 3.13, and
      3.14 support, as well as curtsies dependency changes, theme configuration fixes,
      and declarative build configuration.
  related-projects:
    - >
      Related Python REPLs include the standard CPython interactive interpreter,
      IPython, ptpython, and other terminal shells that improve completion, display, and
      editing.
    - >
      The bpython docs and executables also connect it to terminal UI libraries such as
      curses, urwid, and curtsies.
  sources:
    - https://bpython-interpreter.org
    - https://docs.bpython-interpreter.org/en/latest
    - https://docs.bpython-interpreter.org/en/latest/changelog.html
    - https://docs.bpython-interpreter.org/en/latest/configuration.html
    - https://github.com/bpython/bpython
    - source_facts.package-manager
  summary:
    - >
      bpython is a long-running enhanced interface to the Python interactive
      interpreter. Its official site emphasizes inline syntax highlighting,
      readline-like autocomplete, rewind, and pastebin support, positioning it as a
      friendlier REPL rather than a replacement Python runtime.
  timeline:
    - '2009: 0.9.4 release tag commit appears in the official GitHub repository history.'
    - '2014: Current GitHub repository object was created.'
    - '2021: Changelog records Python 3.10 support work in the 0.22 era.'
    - '2024: Changelog records Python 3.13 support in 0.25.'
    - '2025: 0.26 release tag appears with Python 3.14 support.'
  usage:
    - >
      Users run `bpython` for an enhanced interactive Python session, `bpython-urwid`
      for the urwid frontend, or `bpdb` for debugger-related use. Configuration lives
      under `$XDG_CONFIG_HOME/bpython/config`, and the docs describe editing that config
      from inside bpython with F3.
    - >
      The documented feature set focuses on day-to-day interactive work: syntax
      highlighting, suggestions as you type, rewinding recent input and reevaluating,
      pastebin submission, themes, and editor integration.
related-packages:
  - id: brew:ipython
    reason: >
      Choose IPython when you want a broader interactive-computing shell with magics,
      rich display, introspection, and close integration with Jupyter; bpython’s own
      site identifies it as an alternative.
    rel: alternative
    sources:
      - https://bpython-interpreter.org/alternatives.html
      - https://ipython.readthedocs.io/en/stable/interactive/index.html
  - id: brew:ptpython
    reason: >
      Choose ptpython when multiline editing, vi/Emacs bindings, mouse support,
      top-level await, or prompt-toolkit-based embedding matters more than bpython’s
      curses-oriented workflow.
    rel: alternative
    sources:
      - https://bpython-interpreter.org/alternatives.html
      - https://github.com/prompt-toolkit/ptpython
