id: brew:mods
display-name: mods
repo: null
docs:
  - https://github.com/charmbracelet/mods#readme
config-file-location:
  linux:
    - ~/.config/mods/mods.yml
  macos:
    - ~/Library/Application Support/mods/mods.yml
credentials-file-location:
  linux:
    - ~/.config/mods/mods.yml
  macos:
    - ~/Library/Application Support/mods/mods.yml
history:
  project-history:
    - >
      The tool grew around provider flexibility. The README documents OpenAI-compatible
      endpoints, LocalAI, OpenAI, Cohere, Groq, Azure OpenAI, and Gemini, plus
      configuration through a settings file and environment variables. It also includes
      command-line affordances such as selecting models, custom roles, conversation
      save/list/show/delete commands, Markdown formatting, proxy settings, shell
      completions, and package installs through Homebrew, Winget, Arch, Nix, Debian/RPM
      packages, FreeBSD ports, binaries, and `go install`.
  sources:
    - https://charm.land/blog/gh-mods-pop/
    - https://formulae.brew.sh/formula/mods
    - https://github.com/charmbracelet/mods
    - https://raw.githubusercontent.com/charmbracelet/mods/main/README.md
  summary:
    - >
      Mods is Charm Bracelet's command-line LLM tool, described by the project as "AI
      for the command line, built for pipelines." It was designed around Unix standard
      input and output: read command output or a prompt, send it to an LLM, and print
      formatted text such as Markdown, JSON, shell-oriented answers, or saved
      conversation output. That made it part of Charm's broader terminal tooling family
      rather than a GUI chatbot or application SDK.
  usage:
    - >
      Charm announced that Mods was sunset and the repository archived on March 9, 2026
      so the team could focus on Crush, with much of the non-interactive use case moving
      to `crush run`. That gives the package a clear historical place: an early
      pipeline-friendly AI CLI that helped normalize piping terminal output into LLMs,
      later superseded inside Charm's agentic terminal product line.
related-packages:
  - id: brew:localai
    reason: >
      Run LocalAI as a local OpenAI-compatible model backend for Mods, an integration
      explicitly documented by the Mods project.
    rel: adjacent_workflow
    sources:
      - https://github.com/charmbracelet/mods#readme
      - https://localai.io/
tags:
  - ai
