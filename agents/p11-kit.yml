credentials-file-location: null
history:
  adoption-history:
    - >
      p11-kit became common Linux security infrastructure because it gives applications
      a shared mechanism for discovering PKCS #11 providers and coordinating their
      initialization.
    - >
      Its trust module is also used by distributions to expose centrally managed
      certificate trust policy and to extract that policy into formats consumed by TLS
      libraries and applications. The input records packages across major Linux
      families, Homebrew, MacPorts, Nix, and Arch Linux.
  package-nerd-significance:
    - >
      p11-kit centralizes two areas that otherwise tend to fragment across applications:
      PKCS #11 module discovery and system trust policy. This reduces duplicated
      provider configuration and helps distributions apply certificate policy
      consistently.
    - >
      It is often an invisible dependency, but its module files and trust extraction can
      affect smart cards, hardware tokens, TLS clients, desktop components, and
      system-wide certificate validation.
  project-history:
    - >
      p11-kit was established within the p11-glue project family to coordinate PKCS #11
      modules used by multiple components in the same process and to define a consistent
      module-discovery configuration.
    - >
      The project subsequently incorporated trust-policy tooling, module proxying,
      remoting, and command-line facilities for inspecting configured modules and
      tokens. It remains actively maintained, with releases in the 0.26 series during
      2026.
  related-projects:
    - >
      PKCS #11 defines the Cryptoki interface implemented by providers managed through
      p11-kit.
    - >
      GnuTLS, NSS, OpenSSL, smart-card middleware, and hardware security modules are
      common consumers or adjacent components.
  sources:
    - https://github.com/p11-glue/p11-kit/releases
    - https://p11-glue.github.io/p11-glue/p11-kit.html
    - https://p11-glue.github.io/p11-glue/p11-kit/manual/
  summary:
    - >
      p11-kit provides shared infrastructure for discovering, loading, and coordinating
      PKCS #11 modules and for exposing system trust policy.
  timeline:
    - >
      2011: Early p11-kit releases established shared PKCS #11 module loading and
      configuration.
    - >
      2013: Trust extraction and certificate-policy work formed a significant part of
      the project.
    - '2026: The actively maintained project released the 0.26 series with updated PKCS'
  usage:
    - >
      Applications use the p11-kit library or proxy to load configured PKCS #11
      providers. Administrators install one .module file per provider and can apply
      global or per-user overrides.
    - >
      The p11-kit command lists modules and operates on configured tokens; the trust
      command lists, stores, removes, and extracts trust anchors. Secret keys and PINs
      belong to the backing PKCS #11 token or provider, not to a p11-kit credentials
      file.
    - >
      The documented paths are build-time configurable. The listed /etc/pkcs11 and
      $HOME/.pkcs11 locations are the upstream usual/default layouts.
