history:
  adoption-history:
    - >
      Unity made Hub its central onboarding and lifecycle tool for the Unity development
      environment. It became the normal interface for installing multiple Editor
      releases, adding platform modules, opening projects, and managing Unity accounts
      and licenses.
  package-nerd-significance:
    - >
      Unity Hub is a bootstrap and lifecycle manager rather than the Unity Editor
      itself. Installing the Hub through a system package manager delegates
      Editor-version selection and platform-module downloads to Unity's own manager, a
      pattern also seen in language and SDK version managers.
  project-history:
    - >
      Unity introduced Unity Hub as a connected desktop application that consolidated
      project, license, Editor-installation, and add-on management.
    - >
      Unity Hub 1.0 launched in September 2018. Subsequent releases expanded Editor and
      module installation, project management, account and licensing workflows, Linux
      distribution, and command-line automation.
  related-projects:
    - Unity Editor
    - Unity Package Manager
    - Unity CLI
  sources:
    - 'Official CLI documentation: https://docs.unity.com/en-us/hub/cli-overview'
    - >
      Official Unity 2018.3 announcement:
      https://unity.com/blog/technology/introducing-unity-2018-3
    - 'Official documentation: https://docs.unity.com/en-us/hub'
  summary:
    - >
      Unity Hub is Unity's desktop manager for Editor installations, build modules,
      projects, accounts, and licenses.
  timeline:
    - >
      2018: Early Unity Hub preview releases were used to install and launch Unity
      Editor versions.
    - 'September 2018: Unity launched Unity Hub 1.0.'
    - >
      2020s: Hub became Unity's standard graphical workflow for managing Editor
      versions, modules, projects, accounts, and licenses.
    - >
      Unity Hub 3.18: The embedded Hub CLI entered deprecated, minimal-support status as
      Unity introduced a standalone Unity CLI.
  usage:
    - >
      Developers use Unity Hub to install and maintain multiple Unity Editor versions,
      add target-platform modules, create or import projects, and manage Unity ID and
      licensing workflows. It also exposes a headless CLI for Editor and module
      management, although Unity now marks that Hub CLI as deprecated.
