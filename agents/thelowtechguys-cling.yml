id: cask:thelowtechguys-cling
display-name: Cling
repo: https://github.com/FuzzyIdeas/Cling
docs:
  - https://lowtechguys.com/cling
config-file-location:
  unix:
    - ~/.fsignore
credentials-file-location: null
history:
  adoption-history:
    - >
      Cling is distributed directly by its developer and through Homebrew Cask. A free
      mode covers common search scopes, while Cling Pro adds system-wide scopes,
      external-volume indexing, filters, scripts, and larger result sets.
    - >
      The project also provides a Raycast extension and a command-line interface,
      extending the same search engine beyond the standalone application.
  package-nerd-significance:
    - >
      Cling targets the gap between Spotlight-style indexed search and complex metadata
      search tools. Its ability to fuzzy-search hidden files, dotfiles, application
      data, system paths, and detached external volumes makes it especially relevant to
      macOS power users.
    - >
      The project is GPLv3-licensed and publishes its Swift source, release history,
      Homebrew installation command, and CLI alongside the graphical application.
  project-history:
    - >
      The low-tech guys developed Cling as a native, keyboard-oriented macOS counterpart
      to the rapid filename search workflow associated with Everything on Windows.
    - >
      Cling 2 replaced its earlier external-tool-based search implementation with a
      custom native binary index, live FSEvents tracking, persistent indexes, and a
      terminal-facing CLI.
  related-projects:
    - Everything for Windows is the explicit workflow inspiration named by Cling's developers.
    - Spotlight, Alfred, and Raycast are comparison points in the official documentation.
    - The official Raycast extension exposes Cling's filesystem search inside Raycast.
  sources:
    - https://files.lowtechguys.com/ReleaseNotes/Cling-2.0.0.html
    - https://github.com/FuzzyIdeas/Cling
    - https://github.com/FuzzyIdeas/Cling/releases
    - https://www.lowtechguys.com/cling/
  summary:
    - >
      Cling is an open-source macOS fuzzy file finder by the low-tech guys. It maintains
      native indexes for fast filename searches and provides keyboard-driven actions on
      matching files.
  timeline:
    - >
      Cling 1.x: Early releases used external search tooling and established the
      application's fuzzy file-search workflow.
    - >
      Cling 2.0: The search engine was rewritten around a native persistent binary index
      and gained a CLI.
    - >
      Cling 2.x: Subsequent releases continued performance, indexing, filtering, and
      file-action improvements.
  usage:
    - >
      Users summon Cling with a keyboard shortcut, type an approximate filename or
      extension-aware query, and immediately open, copy, move, preview, rename, drag, or
      script against selected results.
    - >
      Users can control indexed content with ~/.fsignore, enable search scopes for home,
      library, applications, system, and root paths, and maintain indexes for external
      or network volumes.
