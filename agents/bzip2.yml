history:
  adoption-history:
    - >
      bzip2 adoption followed the familiar Unix pattern: first as a better-compressing
      alternative to gzip, then as a standard option in tar pipelines, release archives,
      Linux distributions, and package managers. The command names `bzip2`, `bunzip2`,
      and `bzcat` intentionally echo gzip's workflow, reducing friction for shell users.
    - >
      The package's presence across Homebrew, Debian, Ubuntu, Fedora, Alpine, Arch,
      MacPorts, Nix, Chocolatey, Scoop, and openSUSE reflects near-universal
      distribution. Even where xz and zstd displaced it for many new archives, bzip2
      remains installed because decades of `.bz2` artifacts still need reliable
      decompression.
  package-nerd-significance:
    - >
      bzip2 is package-nerd bedrock: it is one of the archive formats every build tool,
      mirror, bootstrap script, and source-fetching system eventually has to understand.
      A working `bunzip2` is boring until a historical tarball or distro source package
      requires it.
    - >
      It is also a case study in conservative infrastructure. The compressor is no
      longer fashionable, but its stable format, simple commands, portable C
      implementation, and widespread packaging make it one of the quiet dependencies
      that keeps old source distribution workflows reproducible.
  project-history:
    - >
      The official bzip2 manual identifies Julian Seward as author and gives the 1.0.8
      manual release date as 13 July 2019, with copyright running from 1996 through
      2019. The Sourceware home page describes bzip2 as a freely available, patent-free,
      high-quality data compressor organized as both a command-line program and a
      library.
    - >
      Technically, bzip2 uses block-sorting compression associated with the
      Burrows-Wheeler transform, followed by entropy coding. Its design favored
      compression ratio over speed, and the official site positions it as typically
      compressing close to much heavier statistical compressors while remaining
      practical on ordinary Unix systems.
    - >
      The 1.0 line became the compatibility anchor for the `.bz2` format and libbzip2
      API. Sourceware's git tags preserve older public milestones from `bzip2-0.1`
      through `bzip2-1.0.8`, showing a package with a slow, conservative release culture
      after its format became infrastructure.
  related-projects:
    - >
      gzip is the older Unix compressor whose command-line conventions bzip2
      intentionally resembles.
    - >
      xz, zstd, and lzip are common later alternatives in source distribution and
      package-manager ecosystems.
    - >
      libbzip2 is the library interface shipped with the command-line program for
      applications that need `.bz2` support.
  sources:
    - https://sourceware.org/bzip2/
    - https://sourceware.org/bzip2/manual/manual.html
    - https://sourceware.org/git/?p=bzip2.git;a=summary
    - source_facts.package-manager
  summary:
    - >
      bzip2 is Julian Seward's open-source block-sorting compressor and its companion
      library, libbzip2. Since the late 1990s it has been one of the standard Unix
      compression formats for source tarballs, backups, package payloads, and long-lived
      archives.
  timeline:
    - "1996: Julian Seward's bzip2 copyright history begins."
    - >
      1997: Early public tags such as `bzip2-0.1` appear in the official Sourceware git
      history.
    - '2000: The 1.0 series establishes the long-lived format and library baseline.'
    - '2010: bzip2 1.0.6 becomes a widely packaged stable release.'
    - >
      2019: bzip2 1.0.8 is released and documented as the current stable version on
      Sourceware.
  usage:
    - >
      Users compress files with `bzip2`, decompress with `bunzip2`, stream with `bzcat`,
      compare or diff compressed files with `bzcmp` and `bzdiff`, and recover damaged
      block-based archives with `bzip2recover`.
    - >
      Developers use libbzip2 when applications need to read or write `.bz2` streams
      directly. The official manual documents both the command interface and the
      programming interface, which is why package managers usually split runtime tools
      and development headers.
related-packages:
  - id: brew:bzip3
    reason: >
      Choose BZip3 when experimenting with a modern BWT-family compressor that upstream
      describes as faster and stronger, while retaining bzip2-like command ergonomics
      but not `.bz2` format compatibility.
    rel: alternative
    sources:
      - https://github.com/iczelia/bzip3
      - https://sourceware.org/bzip2/manual/manual.html
  - id: brew:gzip
    reason: >
      Choose GNU gzip when lower memory use and latency or broad `.gz` interoperability
      matter more than bzip2's compression ratio.
    rel: alternative
    sources:
      - https://sourceware.org/bzip2/manual/manual.html
      - https://www.gnu.org/software/gzip/
