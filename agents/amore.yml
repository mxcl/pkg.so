history:
  adoption-history:
    - >
      The official site reports use by hundreds of Mac applications, ranging from
      independent utilities to Apple-featured software. Amore is distributed as a macOS
      application with an accompanying command-line tool and can also be incorporated
      into GitHub Actions.
  package-nerd-significance:
    - >
      Amore consolidates a traditionally fragmented macOS distribution
      toolchain—Developer ID signing, notarization, DMG generation, Sparkle feeds,
      hosting, and licensing—behind a GUI, CLI, and CI action. This makes it relevant to
      developers who ship outside the Mac App Store but still want automated,
      reproducible releases.
  project-history:
    - >
      Amore was created as a distribution platform for macOS applications published
      outside the Mac App Store. It grew into an integrated release service covering
      signing, notarization, Sparkle updates, installer creation, hosting, analytics,
      and license sales.
  related-projects:
    - Sparkle, whose update feeds and EdDSA signing keys Amore manages.
    - Apple notarization and Developer ID code signing.
    - AmoreComputer/release-action, the official GitHub Action for automated releases.
  sources:
    - https://amore.computer/
    - https://amore.computer/help/
    - https://amore.computer/help/command-line/
    - https://amore.computer/help/github-actions/
  summary:
    - >
      Amore is a macOS application-distribution service and toolchain for signing,
      notarizing, packaging, updating, hosting, and licensing apps distributed outside
      the Mac App Store.
  timeline:
    - >
      Initial product phase: Amore launched as an integrated self-publishing workflow
      for independent macOS applications.
    - >
      Current generation: Amore supports GUI and CLI releases plus automated GitHub
      Actions workflows.
  usage:
    - >
      Developers install Amore.app and its amore command, sign in, run amore setup for
      an application, and use amore release to archive, sign, notarize, package, update
      the Sparkle appcast, and publish. CI users can instead configure the official
      release action and store its required tokens, certificates, and keys as GitHub
      Actions secrets.
