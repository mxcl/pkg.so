history:
  project-history:
    - >
      The project became a standard testing tool because it supports both in-process
      Python decorators/context managers and a stand-alone HTTP server mode. The server
      mode lets non-Python SDKs point at Moto's fake AWS endpoints, while the Python API
      fits normal unit-test and pytest workflows. Moto 5.0.0 marked a major API
      simplification by replacing service-specific decorators with a single `mock_aws`
      decorator and making one MotoServer instance the recommended server shape, a
      milestone aimed at simplifying usage and state management.
  sources:
    - https://docs.getmoto.org/
    - https://docs.getmoto.org/en/latest/docs/getting_started.html
    - https://formulae.brew.sh/formula/moto
    - https://github.com/getmoto/moto/blob/master/AUTHORS.md
    - https://github.com/getmoto/moto/issues/7198
    - https://pypi.org/project/moto/
  summary:
    - >
      Moto began as Steve Pulec's Python library for mocking AWS services, with the
      project AUTHORS file naming Pulec as the original writer and a long contributor
      list behind the broader emulator. Its role is tightly coupled to the boto and
      boto3 ecosystem: tests wrap AWS-using code with Moto's mocks so that S3, DynamoDB,
      IAM, Lambda, and other service calls are handled locally instead of reaching a
      real AWS account.
  usage:
    - >
      As a package-manager entry, Moto is more of a developer-test dependency than an
      end-user CLI, although Homebrew exposes `moto_server` and `moto_proxy` executables
      for local service emulation. Its closest neighbors are broader local cloud
      emulators and hand-written mocks, but Moto's niche is AWS-specific behavioral
      coverage that can be pulled directly into Python tests.
related-packages:
  - id: brew:localstack
    reason: >
      Choose LocalStack when tests need broader, infrastructure-heavy AWS emulation;
      Moto's own documentation recommends it as the more advanced alternative, while
      Moto is lighter for in-process Python mocks.
    rel: alternative
    sources:
      - https://docs.getmoto.org/en/stable/docs/contributing/faq.html
      - https://docs.localstack.cloud/overview/
