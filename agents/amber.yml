history:
  adoption-history:
    - >
      Amber's adoption has largely followed the Crystal community rather than mainstream
      web-framework volume. It was packaged for Homebrew and other package managers
      because it provides a real CLI binary, project generator, and local development
      workflow, not just a library dependency in shard.yml.
    - >
      The release stream reached v1.0 release-candidate status in 2021 and stable 1.4.x
      releases in 2023. Its documentation and README continued to emphasize familiar
      framework ergonomics for developers coming from Rails, Phoenix, Django, or Kemal.
  package-nerd-significance:
    - >
      Amber is package-interesting because it is both a framework dependency and a
      generator CLI. Installing it from Homebrew gives users a global executable, while
      generated projects still depend on Crystal shards and checked-in application
      templates.
    - >
      It also represents the Crystal ecosystem's recurring question for packagers:
      should framework tools be installed globally as native binaries, vendored through
      shards, or built per project with shards build amber?
  project-history:
    - >
      The amberframework/amber repository was created in April 2017, during the period
      when Crystal's web ecosystem was forming around small fast HTTP libraries,
      Rails-like frameworks, and experiments in compiled-language productivity. Amber
      positioned itself as the cohesive, batteries-included option, not just a minimal
      web server shard.
    - >
      Official documentation describes Amber as a server-side MVC framework with
      generators, database management, CLI commands, deployment tools, Docker support,
      encrypted secrets, websockets, and a conventional application layout. The README
      names Dru Jensen, Elias Perez, Isaac Sloan, Faustino Aguilar, Nick Franken, Mark
      Siemers, and Robert Carpenter among visible contributors.
  related-projects:
    - Crystal is the language runtime and shard ecosystem Amber targets.
    - >
      Kemal, Rails, Phoenix, Django, and Hanami are named by Amber docs or README as
      inspirations or comparable framework traditions.
    - >
      Amber's separate docs repository and site-assets repository support its
      documentation and project branding.
  sources:
    - https://api.github.com/repos/amberframework/amber
    - https://api.github.com/repos/amberframework/amber/releases?per_page=8
    - https://raw.githubusercontent.com/amberframework/amber/master/README.md
    - https://raw.githubusercontent.com/amberframework/docs/master/README.md
    - https://raw.githubusercontent.com/amberframework/docs/master/cli/encrypt.md
    - https://raw.githubusercontent.com/amberframework/docs/master/guides/configuration.md
  summary:
    - >
      Amber is a Crystal web application framework and CLI that packages the familiar
      full-stack MVC framework experience for Crystal developers. Its own README says it
      is inspired by Kemal, Rails, Phoenix, and other popular frameworks, with a focus
      on productivity, performance, and developer happiness.
  timeline:
    - '2017-04-17: amberframework/amber repository is created.'
    - '2021-06-15: v1.0.0rc2 release is published.'
    - '2022-10-26: v1.3.0 release is published.'
    - '2023-08-01: v1.4.0 release is published.'
    - '2023-08-02: v1.4.1 release is published.'
  usage:
    - >
      Users install the amber CLI, generate or manage an Amber project, and keep
      project-specific framework configuration under the application's config directory.
      The official configuration guide says each Amber project has config/environments
      YAML files such as development, test, and production, selected at runtime using
      AMBER_ENV.
    - >
      Amber also has a built-in encrypt command for environment settings. Official docs
      say amber encrypt production decrypts and edits
      config/environments/.production.enc using .encryption_key or
      ENV[AMBER_ENCRYPTION_KEY], and warn that the encryption key should not be
      committed.
