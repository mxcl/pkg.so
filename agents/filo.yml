history:
  adoption-history:
    - >
      Filo is distributed across mobile, web, macOS, and Windows clients. Its macOS
      binary is also available through a Homebrew cask, giving package-manager users an
      alternative to direct download.
  package-nerd-significance:
    - >
      Filo represents the emerging class of AI-assisted desktop email clients that
      combine traditional mailbox handling with task extraction, summaries, drafting,
      and agent-style automation. Its package is notable for bringing this connected,
      service-backed workflow into a native desktop install.
  project-history:
    - >
      Filo began as an AI-oriented mail client and developed into a broader productivity
      workspace for email and connected applications. Official materials describe
      support for multiple mailbox types and integrations, along with summaries, smart
      labels, extracted to-dos, assisted replies, and automated actions.
  related-projects:
    - >
      Filo connects to mail providers including Gmail, Outlook, iCloud, Yahoo, and
      IMAP-compatible services, with additional connected-app integrations documented by
      the service.
  sources:
    - 'Official documentation: https://www.filomail.com/docs'
    - 'Official privacy policy: https://www.filomail.com/privacy-policy'
    - 'Official product page: https://www.filomail.com/'
    - 'Official terms: https://www.filomail.com/terms-of-service'
    - 'Package provenance: source_facts.package-manager'
  summary:
    - >
      Filo is an AI-assisted email and task application that extracts actions from
      messages and helps users organize, summarize, and respond to mail.
  timeline:
    - "2025-01-10: The effective date stated in Filo's official service and privacy policies."
    - >
      2026: Official product materials describe Filo as a cross-platform email and
      connected-app productivity workspace.
  usage:
    - >
      Users connect supported mail accounts, review AI-generated summaries and smart
      labels, extract to-dos, draft replies, search mail, and request automated actions.
    - >
      Authentication uses provider authorization such as Google OAuth. Official
      quick-start documentation says the user's Google password remains with Google and
      that an encrypted token is stored locally, but it does not document the token's
      filesystem path.
