history:
  adoption-history:
    - >
      Nota has been offered as a macOS beta for users who prefer ordinary Markdown files
      over a proprietary notes database. Its no-account, no-subscription design
      particularly suits local-first writing, personal-wiki, and Git-compatible
      workflows.
  package-nerd-significance:
    - >
      Nota treats a workspace as a normal directory and keeps notes as portable
      Markdown, allowing the same material to be inspected, synchronized,
      version-controlled, scripted, or edited with other tools. Its workspace-local
      `.nota` extension structure also makes automation travel with the documents it
      affects.
  project-history:
    - >
      Nota was developed by erusev and astoilkov as a macOS editor centered on local
      Markdown files. During its public beta it evolved from a focused editor into a
      linked-notes environment with backlinks, workspace search, templates, daily notes,
      hooks, custom commands, and other scriptable extensions.
  related-projects:
    - Markdown supplies Nota's portable document format.
    - >
      Dropbox and OneDrive are documented as possible synchronization locations because
      a Nota workspace is an ordinary folder.
    - >
      Git and arbitrary executable scripts can be used through Nota's workspace and
      extension model.
  sources:
    - https://docs.nota.md/
    - https://docs.nota.md/custom-commands
    - https://docs.nota.md/workspaces
    - https://nota.md/
    - https://nota.md/changelog
  summary:
    - >
      Nota is a local-first macOS editor for Markdown notes, todo lists, articles,
      journals, wikis, and linked personal knowledge bases.
  timeline:
    - >
      2021: The official changelog records rapid development of backlinks,
      extensibility, search, and editing features.
    - '2022: Nota added templates, hooks, daily notes, folding, and richer workspace features.'
    - '2023: Version 0.39 moved the application to a new technology stack.'
    - '2024: Version 0.41 added note merging and further performance and design improvements.'
  usage:
    - >
      On first launch, users select any local folder as a workspace. Nota reads and
      writes regular Markdown files there and supports wiki links, backlinks, tags,
      search, templates, and multiple workspaces.
    - >
      Extensions are executable scripts stored under the workspace's `.nota` directory,
      including `.nota/commands` and `.nota/hooks`. These are extension locations rather
      than a single documented application configuration file, so no top-level
      config-file location is asserted. Nota requires no account, and no credentials
      file applies.
