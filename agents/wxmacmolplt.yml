history:
  adoption-history:
    - >
      The project supplies source code and native builds for macOS, Linux, and Windows.
      Its documentation asks researchers who publish work made with the program to cite
      the Bode and Gordon paper, reflecting its adoption within the GAMESS
      computational-chemistry community.
  package-nerd-significance:
    - >
      wxMacMolPlt is a long-lived specialist scientific GUI packaged across three
      desktop operating-system families. It combines a wxWidgets/OpenGL application
      stack with domain-specific support for quantum-chemistry files, visualization, and
      GAMESS input generation.
  project-history:
    - >
      Brett Bode is the primary developer of MacMolPlt. The current wxMacMolPlt codebase
      is a wxWidgets rewrite of MacMolPlt developed by Bode's research group at Iowa
      State University. The project's cited journal paper appeared in 1999 and describes
      the earlier application lineage.
    - >
      Development expanded the application from a molecular viewer into a cross-platform
      environment for building molecules, generating GAMESS input, and examining
      structures, normal modes, orbitals, densities, and other calculated properties.
      Distribution later moved to GitHub when Google Code shut down.
  related-projects:
    - MacMolPlt
    - GAMESS
    - GamessQ
    - wxWidgets
    - OpenGL
  sources:
    - https://brettbode.github.io/wxmacmolplt/
    - https://brettbode.github.io/wxmacmolplt/MacMolPlt_Manual.html
    - https://brettbode.github.io/wxmacmolplt/Manual_pages/Version_History.html
    - https://github.com/brettbode/wxmacmolplt
  summary:
    - >
      wxMacMolPlt is an open-source, cross-platform graphical environment for preparing,
      submitting, and visualizing GAMESS quantum-chemistry input and output.
  timeline:
    - '1999: Bode and Gordon published the paper associated with MacMolPlt.'
    - >
      Version 4.0: The application received a substantial redesign with per-document
      preferences and additional surface visualization.
    - 'Version 7.0: A new graphical molecule builder was introduced.'
    - '2010s: Distribution moved to GitHub following the closure of Google Code.'
  usage:
    - >
      Chemists use wxMacMolPlt to construct molecular geometries, generate GAMESS input
      decks, and inspect calculation results such as optimized structures, trajectories,
      vibrational modes, orbitals, electron densities, and electrostatic potentials. It
      also reads several common chemistry formats and exports images, movies, molecular
      files, and surface data.
    - >
      Global preferences are edited inside the application, while document-specific
      preferences can be embedded in saved extended CML documents. The official manual
      does not document a stable external global configuration-file path, and the
      application has no credential requirement.
