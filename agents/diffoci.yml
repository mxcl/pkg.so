id: brew:diffoci
display-name: diffoci
repo: null
docs:
  - https://github.com/reproducible-containers/diffoci#readme
config-file-location: null
credentials-file-location:
  unix:
    - ~/.docker/config.json
  windows:
    - '%USERPROFILE%/.docker/config.json'
history:
  adoption-history:
    - >
      The official README documents binary releases for Linux and macOS, installation
      through mise, and source installation with Go, which places diffoci in the
      familiar package-manager and single-binary CLI lane for container tooling.
  package-nerd-significance:
    - >
      For package maintainers and reproducible-builds people, diffoci fills the gap
      between byte-level archive comparison and the layered, metadata-heavy world of OCI
      images. It is useful when the artifact being packaged is not a tarball or binary
      but a container image with registry, platform, and layer semantics.
  project-history:
    - >
      The project lives under the reproducible-containers organization and frames itself
      as a diff tool for Docker and OCI images. Its README presents strict comparison as
      the baseline and semantic comparison as the more useful mode for image
      reproducibility checks.
  related-projects:
    - >
      diffoci is adjacent to diffoscope for deep artifact comparison, but specializes in
      Docker and OCI image layout, containerd, Docker, Podman, and registry workflows.
  sources:
    - https://github.com/reproducible-containers/diffoci#readme
    - https://github.com/reproducible-containers/diffoci/blob/master/go.mod
  summary:
    - >
      diffoci is a command-line comparison tool for Docker and OCI container images,
      aimed at finding the practical differences between two image artifacts in
      reproducible-builds work.
  timeline:
    - >
      2023: README examples focus on comparing Alpine and Docker Hub images in
      reproducibility investigations.
    - '2020s: Project distributed as a Go CLI with Linux and macOS binary releases.'
  usage:
    - >
      Typical use compares two image references with `diffoci diff IMAGE0 IMAGE1`; the
      README recommends `--semantic` when timestamp, layer ordering, build history, or
      image-name annotation noise would make strict output too noisy. It can also
      compare local Docker or Podman images with `docker://` and `podman://` prefixes
      and can dump differing files to a report directory.
related-packages:
  - id: brew:diffoscope
    reason: >
      Use diffoscope after diffoci extracts conflicting layer files with `--report-dir`;
      upstream demonstrates this workflow for recursively investigating a
      non-reproducible archive inside an image layer.
    rel: adjacent_workflow
    sources:
      - https://github.com/reproducible-containers/diffoci#readme
      - https://diffoscope.org/
