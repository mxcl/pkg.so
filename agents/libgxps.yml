history:
  adoption-history:
    - >
      libgxps was adopted as a distribution library because document viewers and
      converters need occasional XPS support even on systems where XPS is not a native
      document culture. The GNOME wiki listed Evince as a project using libgxps and
      linked to packages for Arch, Debian, Fedora, and Ubuntu; the batch input also
      shows Homebrew, Nix, pacman, and openSUSE package coverage.
  package-nerd-significance:
    - >
      libgxps is a format-bridge package: small enough to be invisible most days, but
      important when a user receives an XPS file and expects the desktop stack to do
      something sensible. It also shows the GNOME pattern of wrapping document parsing,
      cairo rendering, and conversion utilities around a specific file format.
  project-history:
    - >
      The GNOME wiki describes libgxps as a GObject-based library for handling and
      rendering XPS documents, built on GLib, GObject, GIO, cairo, libarchive, and
      FreeType, with optional image and color-management libraries. The same page frames
      XPS/OpenXPS as an XML-based electronic-paper format originally developed by
      Microsoft and later standardized as an open document format.
    - >
      The NEWS file records libgxps 0.1.0 on October 12, 2011 as the first public
      release. Version 0.2.0 followed on November 19, 2011 with API changes and
      documentation work, while version 0.3.0 on August 8, 2017 added OpenXPS
      fixed-representation schema support and switched the build system to Meson.
  related-projects:
    - Evince is listed by GNOME as a project using libgxps.
    - >
      cairo, libarchive, FreeType, GLib, GObject, and GIO are core dependencies named by
      the GNOME wiki.
    - XPS and OpenXPS are the document formats handled by libgxps.
  sources:
    - https://formulae.brew.sh/formula/libgxps
    - https://gitlab.gnome.org/GNOME/libgxps
    - https://gitlab.gnome.org/GNOME/libgxps/-/raw/master/NEWS
    - https://gitlab.gnome.org/GNOME/libgxps/-/raw/master/README
    - https://wiki.gnome.org/Projects/libgxps
  summary:
    - >
      libgxps is a GNOME C library and toolset for reading, rendering, and converting
      XPS and OpenXPS documents. It fills a practical desktop gap: support for
      Microsoft's XML Paper Specification in GTK/GNOME document workflows without
      treating XPS as a first-class platform format.
  timeline:
    - '2011-10-12: libgxps 0.1.0 was the first public release.'
    - '2011-11-19: libgxps 0.2.0 added API and documentation changes.'
    - >
      2017-08-08: libgxps 0.3.0 added OpenXPS fixed-representation schema support and
      switched to Meson.
    - >
      2021-02-16: libgxps 0.3.2 added Windows WIC support for WDP images and conversion
      crash fixes.
  usage:
    - >
      The library is used by applications that need to inspect or render XPS documents.
      Its command-line tools, including xpstopdf, xpstopng, xpstojpeg, xpstops, and
      xpstosvg, make it useful in scripts that convert XPS files into more common Unix
      document and image formats.
related-packages:
  - id: brew:evince
    reason: >
      Evince is a practical graphical companion because GNOME officially documents that
      it uses libgxps to open XPS and OpenXPS documents.
    rel: adjacent_workflow
    sources:
      - https://wiki.gnome.org/Projects/libgxps
      - https://wiki.gnome.org/Apps/Evince/SupportedDocumentFormats/
