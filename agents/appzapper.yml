history:
  adoption-history:
    - >
      AppZapper became a long-running third-party answer to the support files left
      behind when macOS applications are moved to the Trash. The developer's
      twentieth-anniversary page presents it as a utility retained by users across
      multiple Mac generations.
    - >
      AppZapper 3000 continues the commercial desktop application with a trial model and
      distribution suitable for installation through Homebrew Cask.
  package-nerd-significance:
    - >
      AppZapper represents the established macOS utility category devoted to removing
      application bundles together with related caches, preferences, and support
      files—artifacts that package uninstall operations do not always cover.
    - >
      For package-manager users, the cask provides a reproducible installation route for
      a traditionally downloaded commercial Mac utility.
  project-history:
    - >
      Austin Sarner and Brian Ball first released AppZapper in 2006. The official site
      credits Sarner, Ball, and Clemens Knieper for the current product.
    - >
      For its twentieth anniversary, the application was rebuilt and presented as
      AppZapper 3000, retaining the original drag-and-drop uninstall concept while
      introducing a new 3D-themed interface.
  related-projects:
    - macOS Finder
    - Homebrew Cask
  sources:
    - https://appzapper.com/
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      AppZapper 3000 is a commercial macOS uninstaller that locates an application and
      associated caches, preferences, and support files, then removes them together.
  timeline:
    - '2006: The original AppZapper was released.'
    - '2026: The developers marked twenty years of AppZapper and introduced AppZapper 3000.'
  usage:
    - >
      A user drags an unwanted application into AppZapper, reviews the related files it
      discovers, and triggers removal with the application's zap control.
    - >
      The current product also provides a Zap All action for removing all selected
      targets and offers a limited trial before purchase.
