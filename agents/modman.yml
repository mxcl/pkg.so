credentials-file-location: null
history:
  project-history:
    - >
      In practice, modman became a small Unixy tool for Magento developers who wanted
      separate repositories for extensions before Composer became the dominant PHP
      packaging path. It supports Git and Subversion checkouts, a deploy command for
      already-checked-out code, and a plain text mapping file rather than a package
      registry. Community Magento posts and extension READMEs used it as an installation
      path, and a 2015 Magento 2 development article identified Colin Mollenhour as its
      creator and described the ability to attach multiple local repositories to a
      Magento project as its key feature.
  sources:
    - https://formulae.brew.sh/formula/modman
    - https://github.com/colinmollenhour/modman
    - >
      https://magento.stackexchange.com/questions/30315/how-to-use-modman-for-managing-modules-in-github
    - https://raw.githubusercontent.com/colinmollenhour/modman/master/README.md
    - https://www.maxpronko.com/magento-2-module-in-a-separate-repository/
  summary:
    - >
      modman, short for Module Manager, is a Bash deployment script by Colin Mollenhour,
      copyrighted from 2009 and strongly associated with Magento extension development.
      Its README explains the original pain point: some software, especially Magento,
      forced extension files to be interleaved through core application directories,
      making version control and deployment awkward. modman answered that by keeping
      each module checked out under `.modman` and maintaining symlinks into the target
      tree according to a mapping file.
  usage:
    - >
      The Homebrew formula packages the `modman` executable for macOS and Linux users.
      Its niche is historical but still legible: it is not a general package manager so
      much as a symlink-based module layout tool for codebases that predate cleaner
      extension packaging.
related-packages:
  - id: brew:composer
    reason: >
      Choose Composer for modern PHP dependency resolution and lock files; its
      custom-installer mechanism also supports modules that must be placed outside
      `vendor`, while modman only maps separately checked-out files into an application
      tree.
    rel: alternative
    sources:
      - https://github.com/colinmollenhour/modman
      - https://getcomposer.org/doc/00-intro.md
      - https://getcomposer.org/doc/articles/custom-installers.md
