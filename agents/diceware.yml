id: brew:diceware
display-name: diceware
repo: https://github.com/ulif/diceware
docs:
  - https://diceware.readthedocs.io/en/latest
  - https://github.com/ulif/diceware#readme
config-file-location:
  unix:
    - ~/.diceware.ini
    - $XDG_CONFIG_HOME/diceware/diceware.ini
    - ~/.config/diceware/diceware.ini
    - /etc/xdg/diceware/diceware.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      The package sits in the Unix security-tool tradition: small CLI, auditable inputs,
      standard package-manager names, and passphrases that can be generated either from
      the operating system's randomness or from physical dice.
  package-nerd-significance:
    - >
      diceware is notable because it packages a human-centered security practice as a
      reproducible CLI. It is small enough for distro packaging but opinionated enough
      to encode defaults around wordlists, entropy, and configuration locations.
  project-history:
    - >
      The GitHub repository was created in 2015, and the official changelog starts with
      version 0.1 on 2015-02-18. The docs show a steady command-line password-tool
      history: new wordlists, real-dice randomness, Python-version support, manpage
      work, XDG config support, and a 1.0 project-layout overhaul in 2024.
  related-projects:
    - >
      The docs credit Arnold G. Reinhold's Diceware proposal and include wordlists from
      EFF and other contributors.
  sources:
    - https://github.com/ulif/diceware
    - https://raw.githubusercontent.com/ulif/diceware/master/README.rst
    - https://diceware.readthedocs.io/en/latest/
    - https://diceware.readthedocs.io/en/latest/readme.html
    - https://diceware.readthedocs.io/en/latest/config.html
    - https://diceware.readthedocs.io/en/latest/changes.html
    - https://api.github.com/repos/ulif/diceware
  summary:
    - >
      diceware is a Python command-line passphrase generator that follows Arnold G.
      Reinhold's Diceware proposal by selecting random words from wordlists.
  timeline:
    - '2015: Repository created and version 0.1 released.'
    - '2016: EFF wordlist support added.'
    - >
      2022: Version 0.10 added syntactically valid phrase support with adjective and
      noun wordlists.
    - '2024: Version 1.0 added XDG config support and modernized the project layout.'
  usage:
    - >
      Users run `diceware` to emit memorable multiword passphrases, choose the number of
      words, set delimiters, select randomness sources, and pick wordlists. The docs
      note the EFF wordlist as the default and describe custom, numbered, and PGP-signed
      wordlists.
related-packages:
  - id: brew:pwgen
    reason: >
      Choose pwgen for compact pronounceable or fully random passwords; choose diceware
      when you specifically want memorable multiword passphrases, selectable wordlists,
      or physical-dice randomness.
    rel: alternative
    sources:
      - https://github.com/ulif/diceware
      - https://pwgen.sourceforge.net/
tags:
  - cli
  - passphrases
  - passwords
  - randomness
  - wordlists
