history:
  adoption-history:
    - >
      Stillcolor emerged from the display-comfort community's investigation of temporal
      dithering on Apple Silicon Macs. Its official repository attracted users seeking a
      direct software control for a display behavior not exposed by standard macOS
      settings.
  package-nerd-significance:
    - >
      Stillcolor is notable because it packages a low-level Apple Silicon display
      adjustment into a small menu-bar application. For Mac utility enthusiasts, it
      provides both a one-click control and a reproducible Terminal check through the
      I/O Registry, while publishing its implementation under the MIT license.
  project-history:
    - >
      Stillcolor was introduced in 2024 as an open-source macOS utility for disabling
      GPU/DCP-generated temporal dithering from user space. The project targets Apple
      Silicon hardware and documents an important limitation: a display panel's own
      timing controller may still apply dithering independently.
    - >
      The first follow-up release improved display connection detection and added an
      option concerning the uniformity feature on embedded displays.
  related-projects:
    - >
      The project's README discusses temporal dithering, frame-rate control, PWM, and
      display-testing tools as adjacent parts of the display-comfort ecosystem.
  sources:
    - 'Official releases: https://github.com/aiaf/Stillcolor/releases'
    - 'Official repository and README: https://github.com/aiaf/Stillcolor'
  summary:
    - >
      Stillcolor is an open-source macOS menu-bar utility that disables
      GPU/DCP-generated temporal dithering on supported Apple Silicon Macs.
  timeline:
    - '2024: Stillcolor 1.0 was publicly released.'
    - >
      2024: Stillcolor 1.1 improved display connection detection and added an
      embedded-display uniformity control.
  usage:
    - >
      Users place Stillcolor in Applications, launch it, and enable its dithering
      control. Because the system resets the setting at restart, the README recommends
      enabling launch at login. Users can verify the state with `ioreg -lw0 | grep -i
      enableDither` and re-enable dithering from the menu-bar control.
