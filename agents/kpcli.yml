history:
  adoption-history:
    - >
      kpcli became a packaged utility across Unix-like distributions because it filled a
      narrow but persistent need: terminal access to KeePass databases. The official
      installation wiki noted on April 17, 2023 that most Linux and BSD distributions
      packaged a 3.x version, while users needing 4.x or newer for KDBX4 support might
      need to install it manually.
    - >
      Package-manager support in Homebrew, Debian, Ubuntu, Fedora, Nix, Chocolatey, and
      other ecosystems reflects its status as a small security-adjacent utility rather
      than a large password-manager platform.
  package-nerd-significance:
    - >
      kpcli is package-nerd interesting because it is a thin terminal layer over a
      widely used encrypted password database format. It represents a common packaging
      niche: a small CLI that makes a GUI-centered file format usable on servers, in
      remote shells, and in dotfile-heavy workflows.
  project-history:
    - >
      Lester Hightower created kpcli around a practical migration need: the official
      project page says it was inspired by use of the Ked Password Manager CLI, `kedpm
      -c`, combined with a need to migrate to KeePass. That origin explains kpcli's
      shape as an interactive shell rather than only a collection of one-shot
      subcommands.
    - >
      The project was hosted on SourceForge, with a homepage, file area, wiki, tickets,
      and source-code browser. Its Perl licensing followed Perl's own terms, and the
      tool grew support for KeePass 1.x and 2.x database files.
  related-projects:
    - >
      kpcli is related to KeePass, KeePassX, File::KeePass, File::KDBX, Ked Password
      Manager, and other command-line password-manager tools such as pass.
  sources:
    - https://kpcli.sourceforge.io/
    - https://sourceforge.net/p/kpcli/code
    - https://sourceforge.net/p/kpcli/wiki/Installation%20instructions/
    - https://sourceforge.net/projects/kpcli/files/
    - https://sourceforge.net/projects/kpcli/reviews/
  summary:
    - >
      kpcli is a Perl command-line and interactive-shell client for KeePass database
      files. It gives Unix-like terminal users a way to inspect and edit KeePass 1.x and
      2.x password stores without opening a graphical KeePass application.
  timeline:
    - >
      2012-10-13: kpcli 1.5 appeared in downstream manpage history with interactive help
      and password-generation improvements.
    - >
      2023-04-17: The official installation wiki documented broad Linux and BSD
      packaging of kpcli 3.x.
    - >
      2023-08-21: SourceForge project review notes associated kpcli 4.0 with full KDBX
      support through File::KDBX.
  usage:
    - >
      Users run `kpcli` to open a KeePass database in an interactive shell, then browse,
      search, copy, create, edit, or otherwise manage entries from a terminal. The
      package is most useful for SSH sessions, scriptable maintenance workflows, and
      people who keep KeePass databases synced but prefer command-line interaction.
related-packages:
  - id: cask:keepassxc
    reason: >
      Choose KeePassXC when you want a maintained graphical, cross-platform interface
      with browser integration and broad KDBX support instead of kpcli's interactive
      terminal shell.
    rel: alternative
    sources:
      - https://kpcli.sourceforge.io/
      - https://keepassxc.org/docs/
      - https://keepassxc.org/project/
  - id: brew:pass
    reason: >
      Choose pass for a Unix-native, Git-friendly password store built from individually
      GPG-encrypted files; choose kpcli when interoperability with KeePass KDB or KDBX
      databases is the priority.
    rel: alternative
    sources:
      - https://kpcli.sourceforge.io/
      - https://www.passwordstore.org/
