id: brew:lunzip
display-name: Lunzip
repo: null
docs:
  - https://www.nongnu.org/lzip/manual/lzip_manual.html
  - https://www.nongnu.org/lzip/lunzip.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata lists Lunzip in Homebrew, Debian, MacPorts, and
      Ubuntu, reflecting its role as a small Unix-style utility distributed next to
      lzip, lziprecover, tar, and related archive tools.
  package-nerd-significance:
    - >
      Lunzip matters to package maintainers as the decompression-only lzip utility for
      bootstrap, installer, recovery, and minimal-system scenarios. It is useful when a
      system needs reliable extraction but not compression.
  project-history:
    - >
      Lunzip is part of Antonio Diaz Diaz's lzip ecosystem and is distributed through
      the NonGNU/Savannah release infrastructure. Upstream release listings show
      tarballs beginning at least with Lunzip 1.4 in 2013 and continuing through Lunzip
      1.16 in 2026.
    - >
      The tool exists for systems and workflows that need lzip extraction without
      shipping the full compressor. The official lzip manual provides format and
      tool-family context for Lunzip, lzip, and lziprecover.
  related-projects:
    - >
      Related projects include lzip, lziprecover, tar, and zutils, all part of or
      adjacent to the lzip archive-tool ecosystem.
  sources:
    - https://download-mirror.savannah.gnu.org/releases/lzip/lunzip/
    - https://www.nongnu.org/lzip/lunzip.html
    - https://www.nongnu.org/lzip/manual/lzip_manual.html
    - source_facts.package-manager
  summary:
    - >
      Lunzip is a small decompressor for lzip files. The official lzip project pages
      position it as a decompression-only member of the lzip tool family.
  timeline:
    - '2013-09-27: Savannah release index lists Lunzip 1.4 tarballs.'
    - '2018-02-06: Savannah release index lists Lunzip 1.10 tarballs.'
    - '2024-01-24: Savannah release index lists Lunzip 1.14 tarballs.'
    - '2025-01-11: Savannah release index lists Lunzip 1.15 tarballs.'
    - '2026-03-09: Savannah release index lists Lunzip 1.16 tarballs.'
  usage:
    - >
      Users run Lunzip to decompress `.lz` files and to feed uncompressed tar data into
      tools such as tar. Its package role is extraction-focused rather than
      configuration-driven, so no official config or credentials file is documented.
related-packages:
  - id: brew:lzip
    reason: >
      Choose lzip when you need to create as well as extract `.lz` files; Lunzip
      deliberately provides decompression only and targets smaller installations.
    rel: alternative
    sources:
      - https://www.nongnu.org/lzip/lunzip.html
      - https://www.nongnu.org/lzip/
  - id: brew:lziprecover
    reason: >
      Choose lziprecover when an `.lz` file may be damaged, because it can decompress
      normally while also repairing errors and merging usable data from damaged copies.
    rel: alternative
    sources:
      - https://www.nongnu.org/lzip/lunzip.html
      - https://www.nongnu.org/lzip/manual/lziprecover_manual.html
  - id: brew:tarlz
    reason: >
      Use Tarlz when the workflow must create, append, inspect, or recover structured
      `tar.lz` archives instead of only streaming one through Lunzip into tar.
    rel: adjacent_workflow
    sources:
      - https://www.nongnu.org/lzip/lunzip.html
      - https://www.nongnu.org/lzip/manual/tarlz_manual.html
