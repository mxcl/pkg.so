history:
  adoption-history:
    - >
      Adoption has been package-manager driven rather than institutionally branded. The
      input metadata records packaging across Homebrew, Debian and Ubuntu as emf2svg,
      Nix, Alpine, and openSUSE, which is typical for format-conversion utilities that
      are useful in automated document-processing pipelines.
  package-nerd-significance:
    - >
      For package maintainers, libemf2svg sits in the useful but awkward corner of
      office-graphics interoperability: it depends on native graphics/font libraries,
      handles a Windows-origin vector format, and provides a Unix-style CLI for
      reproducible conversion workflows.
  project-history:
    - >
      The project README explains that libemf2svg began with a narrow
      document-interoperability problem: converting Visio stencil graphics from VSS
      files into reusable SVG. The same README points to libvisio2svg as a related
      motivation and notes that embedded EMF blobs can appear inside other Microsoft
      file formats.
  related-projects:
    - >
      The README names libvisio2svg as the original adjacent project, and its dependency
      list includes libpng, fontconfig, FreeType, fmem, and argp-standalone.
  sources:
    - https://formulae.brew.sh/formula/libemf2svg
    - https://github.com/kakwa/libemf2svg
    - https://github.com/kakwa/libemf2svg/tags
  summary:
    - >
      libemf2svg is a small C/C++ conversion library and command-line tool for turning
      Microsoft Enhanced Metafile and EMF+ graphics into SVG.
  timeline:
    - '2016: The 0.4.0 tag was dated March 6, 2016 on GitHub.'
    - '2017: The 1.0.0 tag was dated January 16, 2017 on GitHub.'
    - '2018: The 1.1.0 tag was dated January 2, 2018 on GitHub.'
    - '2025: The 1.8.1 tag was dated December 22, 2025 on GitHub.'
  usage:
    - >
      The upstream README documents the emf2svg-conv command, with explicit input and
      output file options and optional dimensions, plus a library API for callers that
      want to convert EMF data already loaded in memory.
related-packages:
  - id: brew:libvisio
    reason: >
      Use libvisio to parse and import Microsoft Visio documents, then libemf2svg when
      the workflow must convert embedded EMF stencil graphics into reusable SVG.
    rel: adjacent_workflow
    sources:
      - https://github.com/kakwa/libemf2svg#readme
      - https://wiki.documentfoundation.org/DLP/Libraries/libvisio
