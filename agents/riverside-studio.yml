history:
  adoption-history:
    - >
      Riverside says it has served media companies, businesses, and independent creators
      since its 2020 debut. Its browser-first service is complemented by a macOS desktop
      application distributed through Homebrew Cask.
  package-nerd-significance:
    - >
      The cask provides a conventional package-manager installation path for a
      commercial, cloud-connected recording client. Riverside is notable for recording
      participants locally before uploading their individual tracks, an approach
      intended to avoid network-quality limitations during remote sessions.
  project-history:
    - >
      Riverside was founded in 2020 by brothers Gideon and Nadav. It began as a remote
      podcast and video-interview recording service and subsequently expanded into a
      broader recording, transcription, editing, clipping, streaming, and publishing
      platform.
  related-projects:
    - >
      Riverside's service overlaps with remote-recording and podcast-production tools,
      while its editor and publishing features place it alongside general
      creator-oriented media suites.
  sources:
    - 'Official Riverside 2.0 announcement: https://riverside.fm/blog/introducing-riverside-2-0'
    - 'Official Riverside About page: https://riverside.fm/about'
    - 'Official Riverside Help Center: https://support.riverside.com/hc/en-us'
    - 'source_facts.package-manager.brew-cask: "riverside-studio"'
  summary:
    - >
      Riverside Studio is the macOS desktop client for Riverside, a hosted platform for
      recording and producing podcasts, interviews, and other video or audio content.
  timeline:
    - '2020: Riverside debuted as a remote recording platform.'
    - '2023: Riverside described its 2.0 expansion into a broader content-creation platform.'
  usage:
    - >
      Hosts and guests use Riverside Studio or a supported browser to join a virtual
      studio, select audio and video devices, record locally, upload separate
      participant tracks, and optionally edit or publish the resulting content. An
      account and the Riverside service are integral to normal use.
