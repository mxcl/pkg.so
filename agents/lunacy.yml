history:
  adoption-history:
    - >
      Lunacy began as a Windows-oriented design application and later expanded to native
      applications for macOS and Linux. Cross-platform availability and support for
      Sketch documents made it an alternative desktop workflow for interface designers.
    - >
      The application grew to include local and cloud documents, real-time
      collaboration, prototyping, reusable components, integrated Icons8 graphics, and
      private-cloud options.
  package-nerd-significance:
    - >
      Lunacy is notable in desktop package ecosystems because it supplies a
      full-featured native UI/UX design tool on Windows, macOS, and Linux, where
      comparable commercial design applications have not always offered equal platform
      coverage.
    - >
      Its offline-capable local documents, cross-platform packaging, and compatibility
      with Sketch and Figma document formats distinguish it from browser-only
      collaborative design tools.
  project-history:
    - >
      Icons8 developed Lunacy as part of its move from supplying design assets into
      building design software. The official release archive documents its early Windows
      releases, including version 3.5 in 2018.
    - >
      Lunacy evolved into a broader UI/UX and vector-design environment with built-in
      graphics, auto layout, shared libraries, prototyping, cloud collaboration, and
      private-cloud deployment.
  related-projects:
    - >
      Icons8 supplies the icons, photos, illustrations, and other graphic assets
      integrated into Lunacy.
    - Sketch and Figma are related design ecosystems whose document formats Lunacy can open.
  sources:
    - 'Official Icons8 company history: https://icons8.com/history'
    - 'Official Lunacy documentation: https://lunacy.docs.icons8.com/'
    - 'Official download page: https://icons8.com/lunacy-download'
    - 'Official historical release archive: https://desk.icons8.com/lunacy/docs/releases/'
    - 'Official product overview: https://lunacy.docs.icons8.com/about/'
  summary:
    - >
      Lunacy is Icons8's cross-platform application for UI/UX design, vector graphics,
      prototyping, collaboration, and working with local or cloud documents.
  timeline:
    - '2018: The official release archive documents Lunacy 3.5 as a Windows application.'
    - >
      Later development: Lunacy expanded to native macOS and Linux applications and
      added collaborative and cloud workflows.
  usage:
    - >
      Designers use Lunacy to create interface layouts and vector graphics, build
      interactive prototypes, manage components and styles, collaborate on cloud
      documents, and use integrated Icons8 assets.
    - >
      Local documents support offline work, while cloud documents add sharing,
      collaboration, comments, and version history.
