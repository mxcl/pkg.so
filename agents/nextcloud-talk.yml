config-file-location:
  linux:
    - $XDG_CONFIG_HOME/Nextcloud Talk/config.json
    - ~/.config/Nextcloud Talk/config.json
  macos:
    - ~/Library/Application Support/Nextcloud Talk/config.json
  windows:
    - '%APPDATA%\Nextcloud Talk\config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      The client progressed from early cross-platform desktop builds to a
      production-oriented 1.0 roadmap in 2024. Official packages now cover Linux, macOS,
      and Windows, while community package channels include Homebrew and Chocolatey and
      official Windows package-manager identifiers are available.
  package-nerd-significance:
    - >
      Talk Desktop packages a self-hosted collaboration service as a conventional
      desktop application while retaining dependency on a compatible Nextcloud server
      and Talk app. It is useful to packagers because it spans Electron distribution
      formats, enterprise installation, OS integration, and a separately versioned
      server-side application.
  project-history:
    - >
      Nextcloud Talk began as a server-integrated communication application; Talk
      Desktop provides its official dedicated desktop shell. The desktop repository's
      2024 v1.0 roadmap concentrated on installers, signed releases, automatic updates,
      notifications, settings, and security before production releases.
  related-projects:
    - >
      Nextcloud Talk, also developed as the nextcloud/spreed server application and
      embedded by the desktop client.
    - Nextcloud Server, which hosts accounts, conversations, files, and the Talk application.
  sources:
    - >
      Official application-config implementation:
      https://github.com/nextcloud/talk-desktop/blob/main/src/app/AppConfig.ts
    - 'Official desktop repository: https://github.com/nextcloud/talk-desktop'
    - 'Official product page: https://nextcloud.com/talk'
    - 'Official v1.0 roadmap: https://github.com/nextcloud/talk-desktop/issues/635'
  summary:
    - >
      Nextcloud Talk Desktop is the official desktop client for Nextcloud Talk,
      providing chat, calls, and collaboration against a user's or organization's
      Nextcloud deployment.
  timeline:
    - >
      2022–2023: Early repository issues document pre-1.0 desktop-client use and
      cross-platform integration work.
    - >
      2024: The project published a formal v1.0 roadmap covering installers, signing,
      updates, notifications, settings, and security.
    - 'Late 2024: Production v1.0 builds were in use across supported desktop platforms.'
  usage:
    - >
      Install the desktop client, connect it to a compatible Nextcloud server with the
      Talk app, and use it for conversations and calls. The client can start in the
      background, accepts a CLI command for prefilling account/server identifiers, and
      supports one active account while full multi-account support remains incomplete.
