history:
  adoption-history:
    - >
      EasyFind is distributed by DEVONtechnologies as freeware and is also available
      through the Homebrew Cask package `easyfind`.
  package-nerd-significance:
    - >
      EasyFind is valued by Mac power users as a lightweight, non-indexed alternative to
      Spotlight, especially when searches require Boolean expressions, wildcards,
      phrases, regular expressions, tags, comments, or file-content matching.
  project-history:
    - >
      DEVONtechnologies developed EasyFind as a specialized macOS file-search utility.
      Its search operators share conventions with the company's DEVONthink and
      DEVONagent products.
  related-projects:
    - Spotlight is the indexed macOS search facility that EasyFind complements.
    - DEVONthink and DEVONagent use related advanced search operators.
  sources:
    - 'Official DEVONtechnologies page: https://www.devontechnologies.com/apps/freeware'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      EasyFind is a free macOS file-search application from DEVONtechnologies. It
      searches names, contents, tags, and comments without requiring an index.
  timeline:
    - >
      2026: The official distribution page lists EasyFind 5.0.2 and support for OS X El
      Capitan or later.
  usage:
    - >
      Search directly across files and folders using Boolean operators, wildcards,
      quoted phrases, or regular expressions; inspect previews and act on matching files
      from the results.
