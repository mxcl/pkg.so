id: brew:katana
display-name: katana
repo: null
docs:
  - https://github.com/projectdiscovery/katana#readme
config-file-location:
  unix:
    - ~/.config/katana/form-config.yaml
    - ~/.config/katana/field-config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      katana fits the broader ProjectDiscovery ecosystem of small security CLIs used in
      bug bounty, reconnaissance, and continuous security workflows. Package-manager
      entries across Homebrew, Alpine, MacPorts, and Nix reflect that it is meant to be
      installed into shell pipelines and CI jobs.
  package-nerd-significance:
    - >
      katana is notable as a security package because it packages browser-aware crawling
      as a single CLI with predictable output. That makes it easy to chain with URL
      collectors, template scanners, and other ProjectDiscovery tools.
  project-history:
    - >
      ProjectDiscovery introduced katana publicly in November 2022 as a crawler focused
      on automation pipelines. Its README emphasizes standard and headless crawling,
      JavaScript parsing, scope control, automatic form filling, and structured output.
    - >
      The 1.0.0 release in March 2023 made a breaking change to the JSON output
      structure, a signal that katana had moved from early crawler prototype to a more
      stable automation surface for downstream tooling.
  related-projects:
    - >
      Related ProjectDiscovery tools include nuclei, httpx, subfinder, and naabu;
      adjacent crawler concepts include headless-browser crawling, JavaScript endpoint
      extraction, and web reconnaissance pipelines.
  sources:
    - https://docs.projectdiscovery.io/opensource/katana/overview
    - https://formulae.brew.sh/formula/katana
    - https://github.com/projectdiscovery/katana
    - >
      https://github.com/projectdiscovery/katana/commit/eed0e33049830e3c917c5ab5baeeea3cfec740b0.patch
    - https://github.com/projectdiscovery/katana/releases/tag/v1.0.0
  summary:
    - >
      katana is ProjectDiscovery's Go-based crawling and spidering framework for
      security automation, designed for fast CLI crawling with both standard HTTP and
      headless-browser modes.
  timeline:
    - '2022-11-07: Initial release commit'
    - '2023-03-20: v1.0.0 release changed the JSON output structure'
    - '2024-07-23: v1.2.0 release line continued the post-1.0 series'
    - '2026-01-06: v1.4.0 release appeared in the GitHub release list'
  usage:
    - >
      The documented usage accepts URLs from flags, files, or stdin and emits results to
      stdout, files, or JSON. Its headless mode targets JavaScript-heavy sites and
      single-page applications that plain HTTP crawlers can miss.
related-packages:
  - id: brew:httpx
    reason: >
      httpx can probe a domain list for reachable HTTP services and pipe those live
      targets directly into Katana for endpoint crawling.
    rel: adjacent_workflow
    sources:
      - https://docs.projectdiscovery.io/opensource/katana/running
      - https://docs.projectdiscovery.io/opensource/httpx/overview
  - id: brew:nuclei
    reason: >
      Nuclei can consume Katana URL or structured output to run template-based
      vulnerability checks against the endpoints the crawler discovers.
    rel: adjacent_workflow
    sources:
      - https://docs.projectdiscovery.io/opensource/katana/running
      - https://docs.projectdiscovery.io/tools/nuclei/input-formats
