history:
  adoption-history:
    - >
      Prefs Editor has remained a focused macOS utility for developers and power users
      who need a graphical view of preference domains. The developer has maintained
      downloads for both modern macOS releases and older systems.
  package-nerd-significance:
    - >
      Prefs Editor matters to macOS package users because it works through CFPreferences
      rather than treating cached preference plists as ordinary files. It provides a
      graphical counterpart to the defaults command while respecting the
      preference-caching behavior introduced in OS X 10.8.
  project-history:
    - >
      Thomas Tempelmann created Prefs Editor after OS X 10.8 introduced the cfprefsd
      preference cache, which made direct plist editing unreliable for active
      application preferences. By December 2013, the official page described the tool as
      a plist-editor-style interface backed by CFPreferences calls.
  related-projects:
    - >
      Prefs Editor complements Apple's defaults command and tools such as Xcode's plist
      editor. The official page names PrefEdit and Preferee as alternatives, while
      noting that Prefs Editor edits actual preference domains rather than arbitrary
      plist files.
  sources:
    - 'Official applications index: https://apps.tempel.org/'
    - 'Official product and documentation page: https://apps.tempel.org/PrefsEditor/'
  summary:
    - >
      Prefs Editor is a free macOS graphical interface for inspecting and changing
      application and system preference domains through the CFPreferences API.
  timeline:
    - >
      2013: The developer documented Prefs Editor as a response to the preference
      caching introduced with OS X 10.8.
    - >
      Later releases: The utility added support for newer macOS generations while
      retaining an older-system download.
  usage:
    - >
      Users select or search for a preference domain, inspect typed key-value data, and
      add, edit, copy, paste, or delete values. Changes are committed immediately
      through CFPreferences; the developer advises quitting applications that might
      overwrite externally changed settings.
