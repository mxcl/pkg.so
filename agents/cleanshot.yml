history:
  adoption-history:
    - >
      CleanShot X became a feature-rich alternative to macOS's built-in screenshot
      tools, adding capture, recording, annotation, OCR, scrolling capture, cloud
      sharing, and automation facilities. Its official FAQ also documents distribution
      through Setapp.
  package-nerd-significance:
    - >
      Mac package users care about CleanShot X because it consolidates several capture
      utilities into one polished native application while exposing a URL-scheme API
      suitable for launcher and automation workflows.
  project-history:
    - >
      The current CleanShot X generation was rebuilt for the 3.0 release in April 2020.
      The official changelog marks May 2021 as its first anniversary, placing the
      CleanShot X launch in May 2020. Later releases added OCR, an automation-oriented
      URL scheme, editable project files, capture history, and broader image tooling.
  related-projects:
    - >
      CleanShot Cloud is the optional companion sharing service. A Cloud account is
      supplied with a license, but the official FAQ says it is not required for the
      desktop application's other features.
  sources:
    - 'Official API documentation: https://cleanshot.com/docs-api'
    - 'Official FAQ: https://cleanshot.com/faq'
    - 'Official changelog: https://cleanshot.com/changelog'
    - 'Official product page: https://cleanshot.com/'
  summary:
    - >
      CleanShot X is a proprietary macOS screen-capture and recording application
      developed as a comprehensive replacement for Apple's built-in screenshot utility.
  timeline:
    - '2020-04: CleanShot 3.0 was rebuilt from the ground up'
    - '2020-05: CleanShot X was released'
    - '2021-06: Version 3.8 added OCR'
    - '2021-07: Version 3.8.1 introduced the URL scheme API'
    - '2021-12: Version 4.0 introduced editable .cleanshot project files'
    - '2025-05: Version 4.8 added expanded annotation, scrolling-capture, and format support'
  usage:
    - >
      Users capture screenshots, scrolling regions, text via OCR, and screen recordings;
      annotate or pin the results; then save, copy, drag, or optionally upload them.
      Automation users can invoke capture, recording, annotation, history, and settings
      actions through cleanshot:// URLs.
