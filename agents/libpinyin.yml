history:
  adoption-history:
    - >
      Its clearest downstream adoption path is ibus-libpinyin, an IBus engine that
      provides Chinese Pinyin and ZhuYin input methods based on libpinyin. That split is
      important for packaging because distributions can package the reusable language
      engine separately from desktop input-method integration.
  package-nerd-significance:
    - >
      libpinyin is package-nerd interesting because it is language input infrastructure:
      small, data-driven, and usually invisible until an input method depends on it. It
      separates Chinese pinyin algorithms from the IBus frontend.
  project-history:
    - >
      The project lives in the libpinyin GitHub organization and focuses on pinyin
      processing rather than on a standalone user interface. The repository's public
      description and README are intentionally short: a library to deal with pinyin and
      to provide algorithms for sentence-based Chinese input methods.
  related-projects:
    - >
      ibus-libpinyin is the main related frontend, providing an IBus Chinese Pinyin and
      ZhuYin input method based on libpinyin.
    - >
      IBus is the input-method framework that makes the libpinyin engine available in
      many Linux desktop sessions.
  sources:
    - https://github.com/libpinyin/ibus-libpinyin
    - https://github.com/libpinyin/ibus-libpinyin/wiki/ibus-libpinyin-features
    - https://github.com/libpinyin/libpinyin
    - https://raw.githubusercontent.com/libpinyin/ibus-libpinyin/main/README
    - https://raw.githubusercontent.com/libpinyin/libpinyin/main/README
  summary:
    - >
      libpinyin is a library for intelligent sentence-based Chinese pinyin input
      methods. Its upstream README presents it as the algorithmic core that other
      input-method frontends can build on.
  timeline:
    - >
      2013: The ibus-libpinyin wiki history shows documented feature work around fuzzy
      pinyin and correction support.
    - >
      2023: The ibus-libpinyin feature page was updated with pinyin correction, fuzzy
      pinyin, and ZhuYin-related input behavior.
  usage:
    - >
      Package users usually encounter libpinyin indirectly through desktop input
      methods. Developers and packagers see its helper programs, including tools for
      generating binary pinyin data and importing model data.
