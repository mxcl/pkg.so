history:
  adoption-history:
    - >
      Official releases expanded TapMap from its original desktop implementation to
      Linux packages, Docker, macOS, and Windows builds. Homebrew distributes the macOS
      application as the tapmap cask.
  package-nerd-significance:
    - >
      TapMap combines socket inspection, local GeoIP data, and an interactive
      browser-based map in a cross-platform package. Its local-only processing, Docker
      support, and explicit environment-variable interface make it useful to networking
      and self-hosting enthusiasts.
  project-history:
    - >
      TapMap was created by Ola Lie as an open-source network-awareness application. Its
      early 2026 release series added structured documentation and testing, followed by
      Linux and Docker packaging, a macOS backend, persistent activity insights, GeoIP
      management, and cross-platform application identification.
  related-projects:
    - Uses psutil on Windows and Linux and lsof on macOS for connection discovery.
    - Uses Dash and Plotly to present the interactive map.
    - Supports MaxMind GeoLite2 and DB-IP Lite GeoIP databases.
  sources:
    - 'Official changelog: https://github.com/olalie/tapmap/blob/main/CHANGELOG.md'
    - 'Official documentation: https://olalie.github.io/tapmap/'
    - source_facts.package-manager
  summary:
    - >
      TapMap is an open-source, cross-platform network-awareness application that
      visualizes a computer's connections on a world map and maintains local activity
      history.
  timeline:
    - '2026-03: Linux packaging and Docker support arrived in the 1.2 and 1.3 series.'
    - '2026-03: Version 1.4 added the macOS connection backend.'
    - '2026-04: Version 1.5 added persistent 30-day activity insights.'
    - >
      2026-08: Version 1.10 added cross-platform application identity and verification
      information.
  usage:
    - >
      Run the desktop application to inspect established connections, applications,
      providers, countries, ports, and local listeners through a browser interface on
      127.0.0.1:8050.
    - >
      Keep TapMap running to build its rolling activity history. Docker users on Linux
      can grant host network and PID visibility and persist application data through a
      mounted directory.
    - >
      Runtime behavior such as host, port, data directory, browser launch, map location,
      and cache retention can be overridden with documented TAPMAP_* environment
      variables.
