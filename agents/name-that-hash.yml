id: brew:name-that-hash
display-name: Name That Hash
repo: https://github.com/bee-san/Name-That-Hash
docs:
  - https://github.com/bee-san/Name-That-Hash/wiki
  - https://github.com/bee-san/Name-That-Hash#readme
  - https://nth.skerritt.blog/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project reached security distributions and package managers beyond PyPI. Its
      README lists REMnux, AUR, MacPorts, and Homebrew, and Kali documents the
      `name-that-hash` and `nth` binaries for identifying MD5, SHA256, and more than 300
      other hash types.
    - >
      Repository metadata consulted on 2026-07-01 showed 1,658 GitHub stars and 110
      forks. Homebrew listed 348 installs over the prior 365 days, which is modest but
      plausible for a specialist CTF/forensics helper.
  package-nerd-significance:
    - >
      Name That Hash matters because it packages the messy regex database problem with
      better output priorities and cracking-tool context. It is not a cryptographic
      primitive; it is a triage tool that saves time before using Hashcat, John, or CTF
      tooling.
  project-history:
    - >
      The repository was created on 2021-01-13, and PyPI release history begins with
      0.0.1 on 2021-01-24. The project positioned itself as a modern successor to older
      hash identifiers, emphasizing popularity-ranked results, hash summaries,
      accessible output, JSON/API use, and Hashcat/John the Ripper mode information.
    - >
      Release 1.10.0 on 2021-06-13 added more than 50 hashes and an automated test
      matrix for hash database correctness; release 1.11.0 on 2022-11-17 added and
      verified hash patterns including yescrypt, BitLocker, RACF, Argon2, and other
      community-contributed entries.
  related-projects:
    - HashID
    - Hash-Identifier
    - Hashcat
    - John the Ripper
    - REMnux
    - Kali Linux
  sources:
    - https://api.github.com/repos/bee-san/Name-That-Hash
    - https://api.github.com/repos/bee-san/Name-That-Hash/releases?per_page=5
    - https://formulae.brew.sh/formula/name-that-hash
    - https://github.com/bee-san/Name-That-Hash
    - https://pypi.org/project/name-that-hash/
    - https://www.kali.org/tools/name-that-hash/
  summary:
    - >
      Name That Hash is a Python hash-identification CLI and web app for mapping unknown
      hashes to likely algorithms and cracking-tool modes.
  timeline:
    - '2021-01-13: GitHub repository created.'
    - '2021-01-24: PyPI release 0.0.1 published.'
    - '2021-06-13: 1.10.0 release adds more than 50 hashes and an automated test matrix.'
    - '2022-11-17: 1.11.0 release published on GitHub and PyPI.'
    - '2026-07-01: Homebrew Formulae page listed 348 installs over the prior 365 days.'
  usage:
    - >
      The practical loop is simple: pass one hash with `nth --text`, pass a
      newline-delimited file with `nth --file`, or use greppable/JSON output for
      automation. Kali's help output also documents base64 decoding, accessible mode,
      and an extreme mode that searches for hashes inside larger strings.
    - >
      Package nerds use it before cracking: identify candidate formats, choose likely
      Hashcat or John modes, then feed those guesses into heavier cracking or forensic
      tooling. The JSON output makes it scriptable in pipelines.
related-packages:
  - id: brew:hashcat
    reason: >
      Name That Hash reports Hashcat mode numbers so an identified hash can be passed
      into Hashcat for the subsequent password-auditing or recovery step.
    rel: adjacent_workflow
    sources:
      - https://github.com/bee-san/Name-That-Hash#readme
      - https://github.com/hashcat/hashcat
  - id: brew:john-jumbo
    reason: >
      Name That Hash reports John the Ripper format information, making John Jumbo a
      documented next-stage tool after identification.
    rel: adjacent_workflow
    sources:
      - https://github.com/bee-san/Name-That-Hash#readme
      - https://www.openwall.com/john/
