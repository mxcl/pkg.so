config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LocateMe's adoption appears to be modest and Mac-specific. Its value is in
      automation: scripts can ask the operating system for a location fix and format the
      result as coordinates, a Google Maps URL, XML-like text, or other shell-friendly
      output.
  package-nerd-significance:
    - >
      LocateMe is a classic single-purpose Homebrew formula: a tiny binary wrapper
      around a platform feature that becomes more useful once it is installed into PATH.
    - >
      Its public-domain status and small SourceForge-hosted release make it
      representative of older macOS command-line utilities that package managers keep
      discoverable long after their original release.
  project-history:
    - >
      Robert Harder's official LocateMe page describes the tool as a command-line
      program that returns latitude, longitude, and related fields through Apple's
      geolocation services. The page lists version 0.2.1 as the downloadable release and
      documents usage for custom output formats.
    - >
      LocateMe belongs to the broader iHarder.net SourceForge project, which hosts open
      source and public domain Java, XML, and Cocoa utilities. SourceForge lists the
      project as public domain and as registered in 2001, while the LocateMe page
      carries its own compact version history.
  related-projects:
    - iHarder.net hosts other small public-domain Cocoa and command-line utilities.
    - >
      Other macOS location CLI tools expose Apple's Core Location APIs for scripting
      with different maintenance histories.
  sources:
    - https://iharder.sourceforge.net/current/macosx/locateme/
    - https://sourceforge.net/p/iharder/cvs/
    - https://sourceforge.net/projects/iharder/
  summary:
    - >
      LocateMe is a small public-domain macOS command-line utility for printing the
      machine's location using Apple's geolocation services. It is package-nerd
      interesting because it exposes a GUI-era macOS location facility to shell scripts.
  timeline:
    - '2001: The iHarder.net SourceForge project was registered.'
    - 'Unknown year: LocateMe v0.1 was the initial release.'
    - 'Unknown year: LocateMe v0.2 added custom output formats and Google Map URLs.'
    - >
      Unknown year: LocateMe v0.2.1 fixed help text and more forcibly quit the app after
      finding location.
  usage:
    - >
      The official installation instructions are intentionally simple: copy the
      `LocateMe` executable into a directory on the user's PATH, such as
      `/usr/local/bin`, or run it from the current directory as `./LocateMe`.
    - >
      The command supports flags for help, Google Maps URL output, long multiline
      output, and custom formats with placeholders such as `{LAT}`, `{LON}`, `{ALT}`,
      `{HAC}`, and `{TIME}`. No official config or credentials file is documented.
