history:
  adoption-history:
    - >
      There is distributed as a direct macOS download and through Homebrew Cask. Its
      public MIT-licensed repository accepts contributions, making it accessible both to
      ordinary remote workers and to macOS developers.
  package-nerd-significance:
    - >
      There is a small native utility in the classic macOS menu-bar tradition. Package
      users may value its open-source SwiftUI implementation, Homebrew installation, low
      idle resource use, and lack of a required account.
  project-history:
    - >
      Dena Sohrabi and Mo Rajabi developed There as a lightweight native macOS
      application for tracking the local times of friends, teammates, family members,
      and cities.
    - >
      The project is maintained publicly under the MIT License and deliberately keeps
      its scope narrow, with additional features evaluated against the goal of
      preserving simplicity.
  related-projects:
    - >
      The official roadmap mentions a possible AppleScript API for integrations such as
      Raycast.
    - Homebrew Cask provides the documented command-line installation route.
  sources:
    - https://github.com/dena-sohrabi/There
    - https://there.pm/
  summary:
    - >
      There is an open-source native macOS menu-bar application for displaying the local
      times of people and cities.
  timeline:
    - '2020s: There emerged as a public SwiftUI menu-bar utility for tracking time zones.'
    - >
      2026: The official site lists Dena Sohrabi and Mo Rajabi as its makers and
      continues to distribute the application for macOS 13 and later.
  usage:
    - >
      Users add entries by city, country, time-zone abbreviation, or UTC offset. Entries
      can represent people and optionally include a locally selected photo or an image
      associated with an X or Telegram handle.
    - >
      There runs in the menu bar, requires no account, and keeps its information on the
      user's device.
