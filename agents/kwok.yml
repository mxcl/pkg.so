id: brew:kwok
display-name: KWOK
repo: null
docs:
  - https://kwok.sigs.k8s.io/docs
config-file-location:
  unix:
    - ~/.kwok/kwok.yaml
credentials-file-location:
  unix:
    - ~/.kube/config
history:
  adoption-history:
    - >
      KWOK's adoption is strongest in test and simulation workflows. The official site
      emphasizes compatibility with Kubernetes API clients such as kubectl and Helm, and
      the docs show fake nodes and pods represented as ordinary API objects that kwok
      keeps in plausible states.
  package-nerd-significance:
    - >
      KWOK is interesting because it packages a fake kubelet world as normal CLI
      tooling. It turns what used to require heavyweight test clusters or bespoke mocks
      into a reproducible binary install, making it a neat inhabitant of the Kubernetes
      testing toolbox.
  project-history:
    - >
      KWOK was introduced publicly on the Kubernetes blog on 2023-03-01 by contributors
      from DaoCloud and Apple. The announcement framed it as a toolkit for creating
      clusters with thousands of simulated nodes in seconds, aimed at controller
      development, scale testing, and Kubernetes learning without large infrastructure
      bills.
    - >
      The project lives under kubernetes-sigs, which makes it part of the Kubernetes
      community's SIG-governed tooling rather than a vendor-only simulator. Its release
      process uses Kubernetes-style release issues, staging images, GitHub releases, and
      registry.k8s.io promotion.
  related-projects:
    - >
      KWOK relates to Kubernetes, kubelet, kubemark, controller testing, scheduler
      testing, kubectl, Helm, and registry.k8s.io image promotion workflows.
  sources:
    - https://github.com/kubernetes-sigs/kwok
    - https://github.com/kubernetes-sigs/kwok/issues/29
    - https://kubernetes.io/blog/2023/03/01/introducing-kwok/
    - https://kwok.sigs.k8s.io/
    - https://kwok.sigs.k8s.io/docs/user/kwok-manage-nodes-and-pods/
  summary:
    - >
      KWOK, short for Kubernetes WithOut Kubelet, is a Kubernetes SIG project for
      simulating nodes, pods, and cluster behavior without running kubelets on real
      machines. The package ships the kwok simulator and kwokctl cluster-management CLI.
  timeline:
    - '2022-09-27: The v0.0.1 release issue was opened in the kubernetes-sigs/kwok repository.'
    - '2023-03-01: The Kubernetes blog published the public KWOK introduction.'
    - >
      2023-08-15: The node and pod management guide was updated with examples for
      keeping fake nodes ready and running fake pods.
  usage:
    - >
      Users install kwok to maintain fake node and pod status, and kwokctl to create or
      delete local simulated clusters. Package-manager users care about having both
      binaries available for fast CI jobs, controller load tests, scheduler experiments,
      and demos that need Kubernetes API behavior without worker-node cost.
related-packages:
  - id: brew:kind
    reason: >
      Choose kind when tests must run real pod containers; KWOK's official comparison
      recommends kwokctl instead when simulated API objects are sufficient and much
      larger scale is desired.
    rel: alternative
    sources:
      - https://kwok.sigs.k8s.io/
      - https://kind.sigs.k8s.io/docs/
  - id: brew:kubernetes-cli
    reason: >
      kubectl works against KWOK's Kubernetes-compatible API and is the natural
      companion for creating, inspecting, and modifying the simulated resources.
    rel: adjacent_workflow
    sources:
      - https://kubernetes.io/blog/2023/03/01/introducing-kwok/
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:helm
    reason: >
      Helm can install and exercise chart-generated Kubernetes objects against a KWOK
      cluster when a test needs API behavior without executing the resulting pods.
    rel: adjacent_workflow
    sources:
      - https://kubernetes.io/blog/2023/03/01/introducing-kwok/
      - https://helm.sh/docs/
