id: brew:foxglove-cli
display-name: Foxglove CLI
repo: null
docs:
  - https://docs.foxglove.dev/docs/cli
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official CLI docs explicitly list Homebrew as the macOS installation path,
      alongside direct release binaries for Linux, macOS, and Windows. That makes the
      Homebrew formula part of the supported distribution story rather than a
      third-party afterthought.
  package-nerd-significance:
    - >
      Foxglove CLI is package-nerd relevant because it bridges cloud/SaaS robotics data
      workflows with native package-manager installation. It packages an API client,
      data uploader/exporter, extension publisher, and completion generator as a single
      terminal binary.
    - >
      Its examples expose the package ecosystem around robotics logs: ROS bags, MCAP,
      Foxglove extensions, API keys, devices, recordings, and topic-filtered exports.
  project-history:
    - >
      The official GitHub repository was created in November 2021 and describes the
      project as the Foxglove command-line tool. The README centers on account
      authentication, API keys, devices, projects, imports, exports, events, extensions,
      and shell completion.
    - >
      Foxglove's documentation positions the CLI inside a broader platform for
      recording, uploading, organizing, and visualizing multimodal log data such as time
      series, text logs, video, 3D data, maps, MCAP, ROS bags, and ULog.
  related-projects:
    - >
      Foxglove's desktop and web platform, Foxglove Agent, Foxglove extensions, MCAP,
      and ROS bag tooling are adjacent parts of the workflow described in official docs.
  sources:
    - https://api.github.com/repos/foxglove/foxglove-cli
    - https://docs.foxglove.dev/docs
    - https://docs.foxglove.dev/docs/cli
    - https://github.com/foxglove/foxglove-cli
    - https://raw.githubusercontent.com/foxglove/foxglove-cli/main/README.md
  summary:
    - >
      Foxglove CLI is the command-line companion for the Foxglove robotics data
      platform. Official docs describe it as a tool for importing, exporting, and
      interacting with Foxglove data from a terminal.
  timeline:
    - '2021: Official GitHub repository was created.'
    - >
      2021-2022: README examples show early device, import, and export workflows using
      dated sample data.
    - '2026: Official repository metadata showed continued pushes.'
  usage:
    - >
      Users authenticate with foxglove auth login or configure an API key, then manage
      devices and projects, import recordings, export data as JSON, MCAP, or ROS 1 bag,
      create events, and publish organization extensions.
    - >
      The CLI supports shell autocompletion for bash, zsh, fish, and PowerShell,
      matching its role as an operational tool for robotics data pipelines.
related-packages:
  - id: brew:mcap
    reason: >
      Use MCAP alongside Foxglove CLI to inspect and manipulate the multimodal log files
      that Foxglove uploads and exports; the official CLI README demonstrates running
      mcap info on an exported file.
    rel: adjacent_workflow
    sources:
      - https://github.com/foxglove/foxglove-cli#readme
      - https://mcap.dev/
