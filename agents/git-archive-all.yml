history:
  adoption-history:
    - >
      Adoption is utilitarian rather than broad-platform-defining. Its presence on PyPI,
      Homebrew, and Linux package sets reflects a common release-engineering need:
      produce source archives from repositories whose dependencies are tracked as Git
      submodules.
  package-nerd-significance:
    - >
      Package maintainers care because missing submodules are a classic
      broken-source-tarball problem. git-archive-all offers a boring, scriptable answer
      that honors Git attributes and avoids inventing a new archive format.
  project-history:
    - >
      The repository opened in 2010 to solve a practical packaging gap: git archive
      works well for one repository, but release tarballs often need the checked-out
      contents of submodules too. The project kept the interface close to git archive
      while adding recursive submodule traversal, export-ignore support, include paths,
      dry-run output, and compression control.
    - >
      The changelog shows a maintenance phase focused on cross-platform archive
      correctness: tests and export-ignore handling in 2018, Windows and Apple Git
      compatibility fixes, non-Unicode filename handling, and a 2021 change to retrieve
      submodule lists via Git rather than parsing .gitmodules directly.
  related-projects:
    - >
      Related tools include Git's git archive command, Git submodules, .gitattributes
      export-ignore rules, PyPI packaging, and Homebrew formula packaging.
  sources:
    - https://api.github.com/repos/Kentzo/git-archive-all
    - https://formulae.brew.sh/formula/git-archive-all
    - https://github.com/Kentzo/git-archive-all
    - https://github.com/Kentzo/git-archive-all/blob/master/CHANGES.rst
    - https://github.com/Kentzo/git-archive-all/blob/master/README.rst
  summary:
    - >
      git-archive-all is a Python command-line wrapper around git archive that archives
      a Git superproject together with its submodules.
  timeline:
    - '2010: Repository created.'
    - >
      2018: CHANGES.rst started tracking releases; tests and export-ignore handling were
      added.
    - '2018: Windows support and Apple Git compatibility fixes landed in the 1.19 series.'
    - '2021: Version 1.23.0 began retrieving submodules via Git.'
    - '2022: Version 1.23.1 added typing information to PyPI and source distributions.'
  usage:
    - >
      Practitioners run git-archive-all with an output filename, optional base
      repository, prefix, export-ignore behavior, forced submodule update, include
      paths, dry-run mode, and compression level. It is typically used for release
      tarballs, vendor drops, or reproducible snapshots where submodules must be
      included.
related-packages:
