history:
  adoption-history:
    - >
      The README says the project had no regular release process defined and warned that
      documentation across repositories and gopass versions could be outdated or
      incomplete. Package adoption nonetheless expanded enough for Fedora and several
      cross-platform package managers to package it as a separate binary.
  package-nerd-significance:
    - >
      gopass-jsonapi is package-nerd notable because it turns browser native messaging
      setup into a packaged command. It is not the password manager itself; it is the
      integration shim that lets OS packages, browser manifests, and the gopass CLI
      cooperate.
  project-history:
    - >
      The standalone gopass-jsonapi repository was created in January 2021. Its README
      documents the split from earlier gopass release packaging: gopass v1.10 and v1.11
      users downloaded the binary from gopass releases, while gopass v1.12 and newer
      users downloaded gopass-jsonapi from the separate repository's releases.
  related-projects:
    - >
      The README relates gopass-jsonapi to gopass, gopassbridge, browser native
      messaging, Firefox, Chrome, Chromium, Brave, Vivaldi, Iridium, Slimjet, and
      platform package managers such as Fedora.
  sources:
    - https://api.github.com/repos/gopasspw/gopass-jsonapi
    - https://github.com/gopasspw/gopass-jsonapi
    - https://github.com/gopasspw/gopass-jsonapi#readme
    - https://github.com/gopasspw/gopass-jsonapi/releases
  summary:
    - >
      gopass-jsonapi is the JSON-message bridge that lets browser extensions communicate
      with gopass as a native application. Its README describes it as especially useful
      for browser plugins such as gopassbridge.
  timeline:
    - '2021: GitHub repository created under gopasspw/gopass-jsonapi.'
    - '2021: v1.11.1 release published on GitHub Releases.'
    - '2022: v1.15.0 release published after a series of 1.14.x releases.'
    - '2025: v1.16.1 release published on GitHub Releases.'
  usage:
    - >
      Users run `gopass-jsonapi configure` for each browser so the required native
      messaging manifest is installed. Browser extensions then send JSON messages to
      gopass-jsonapi, which invokes gopass to retrieve login data from the user's
      password store.
related-packages:
  - id: brew:gopass
    reason: >
      gopass is the required password-store application that gopass-jsonapi invokes when
      a browser extension requests login data.
    rel: adjacent_workflow
    sources:
      - https://github.com/gopasspw/gopass-jsonapi#readme
      - https://github.com/gopasspw/gopass#readme
