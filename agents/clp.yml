id: brew:clp
display-name: Clp
repo: null
docs:
  - https://coin-or.github.io/Clp
  - https://github.com/coin-or/Clp#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README documents broad distribution through Linux distributions,
      FreeBSD, Homebrew, conda, Docker images for the COIN-OR Optimization Suite, GitHub
      release assets, and older COIN-OR binary archives.
    - >
      That packaging spread reflects Clp's role as infrastructure for optimization users
      who need a solver available through normal system-package channels as well as from
      source.
  package-nerd-significance:
    - >
      Clp is package-nerd relevant because it is both a command-line tool and a linkable
      numerical library, with solver dependencies and optional binary functionality that
      vary across platforms.
    - >
      It sits in the small but important class of scientific packages where Homebrew,
      Debian, conda, FreeBSD, Docker, and source builds all serve different user
      communities.
  project-history:
    - >
      The official README expands Clp as Coin-or linear programming and describes it as
      an open source linear programming solver maintained under the COIN-OR Foundation.
    - >
      Clp is primarily a callable library, but the project also ships a standalone `clp`
      executable. Its solver features include primal and dual simplex algorithms, a
      barrier method, sparse and specialized matrix storage support, and configurable
      pivot choices.
  related-projects:
    - COIN-OR Foundation is the umbrella organization for Clp.
    - >
      coinbrew is the recommended helper for fetching and building Clp and its COIN-OR
      dependencies.
    - COIN-OR Optimization Suite is the related Docker distribution referenced by the README.
  sources:
    - https://github.com/coin-or/Clp#readme
    - https://coin-or.github.io/Clp
    - https://github.com/coin-or/Clp/releases
  summary:
    - >
      Clp, the COIN-OR Linear Programming solver, is an open source C++ solver for
      linear optimization problems.
  timeline:
    - '2019: GitHub releases include Clp 1.17.2 and 1.17.3.'
    - '2020: Clp 1.17.6 was published on GitHub.'
    - '2023: Clp 1.17.9 was published on GitHub.'
    - >
      2020s: The README documents distribution through system packages, Homebrew, conda,
      Docker, GitHub releases, and COIN-OR archives.
  usage:
    - >
      Users can call Clp as a C++ library or invoke the `clp` executable to read
      optimization problem files, run primal or dual simplex, execute unit tests, and
      try Netlib problem sets.
    - >
      The README recommends `coinbrew` for fetching and building Clp with its COIN-OR
      dependencies, while expert users can still build from a cloned repository with
      configure, make, test, and install.
related-packages:
  - id: brew:highs
    reason: >
      Choose HiGHS when you need a modern high-performance solver that also handles
      mixed-integer and convex quadratic models; choose Clp for established COIN-OR
      linear-programming integration.
    rel: alternative
    sources:
      - https://github.com/ERGO-Code/HiGHS
      - https://github.com/coin-or/Clp
  - id: brew:glpk
    reason: >
      Choose GLPK when GNU MathProg modeling or built-in mixed-integer branch-and-cut
      support is important; choose Clp for COIN-OR's C++ LP library and simplex/barrier
      tooling.
    rel: alternative
    sources:
      - https://www.gnu.org/software/glpk/
      - https://github.com/coin-or/Clp
