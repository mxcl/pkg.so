    - 'Wondershare corporate history: https://www.wondershare.com/about/our-story.html'
    - source_facts.package-manager
  summary:
    - >
      Wondershare Filmora is a proprietary cross-platform video editor aimed at making
      video creation accessible while retaining a substantial collection of editing,
      effects, audio, export, and cloud-collaboration features.
  timeline:
    - "2010: Wondershare's corporate history records the debut of Filmora."
    - >
      2018: Wondershare brought Filmora to the Chinese market, according to its
      corporate history.
    - >
      2020s: Filmora expanded its Mac workflow with cloud backup, collaboration, and
      AI-assisted media tools.
  usage:
    - >
      Users create Filmora project files, import referenced media, edit on a timeline,
      apply effects and audio processing, and export completed videos. The official Mac
      guide warns that project files reference source media, so projects should be
      archived or backed up before media is moved or transferred.
