credentials-file-location:
  unix:
    - ~/.aws/credentials
history:
  adoption-history:
    - >
      cli53's adoption story is mainly practical rather than institutional: it packages
      common Route 53 workflows into a small CLI and ships prebuilt Linux, macOS, and
      Windows binaries from GitHub releases.
    - >
      The README explicitly documents Homebrew installation for macOS, while input
      package metadata also lists Nix packaging. The GitHub repository metadata showed
      more than two thousand stars at research time, indicating durable niche use among
      DNS and AWS operators.
  package-nerd-significance:
    - >
      cli53 is package-nerd interesting because it is a focused cloud CLI that overlaps
      with a large vendor CLI but keeps a Unix-friendly shape for DNS import/export and
      scripting. It is the kind of small, purpose-built binary that package managers
      keep useful long after the broader vendor tooling exists.
    - >
      Its Homebrew formula is also a reminder that cloud operators often install small
      single-purpose tools beside official SDKs and CLIs when those tools fit a repeated
      operational workflow better.
  project-history:
    - >
      The official GitHub repository was created in December 2010 and describes cli53 as
      a Route 53 management CLI. Its README centers the project on DNS zone operations:
      creating, deleting, listing, importing, exporting, validating, and updating Route
      53 records.
    - >
      The project is implemented in Go and distributed through GitHub releases, `go
      install`, and Homebrew. GitHub release metadata shows public release artifacts
      from at least 2015 through the 2026 v0.9.0 release.
  related-projects:
    - Amazon Route 53 is the managed DNS service cli53 controls.
    - >
      BIND zone-file tooling is related because cli53's README highlights BIND import,
      export, and validation workflows.
    - >
      The AWS SDK credential conventions are related because cli53 uses AWS shared
      credentials, environment variables, profiles, and role assumption.
  sources:
    - https://github.com/barnybug/cli53#readme
    - https://api.github.com/repos/barnybug/cli53
    - https://api.github.com/repos/barnybug/cli53/releases
  summary:
    - >
      cli53 is a command-line tool for Amazon Route 53 focused on hosted-zone and
      DNS-record management, including BIND-format import and export.
  timeline:
    - '2010: The GitHub repository is created.'
    - '2015: GitHub release metadata records cli53 0.6.0.'
    - '2026: GitHub release metadata records cli53 v0.9.0.'
  usage:
    - >
      Typical usage includes creating hosted zones, listing zones, importing and
      exporting BIND zone files, validating zone files, creating weighted, latency,
      geolocation, failover, and alias records, and assuming AWS roles.
    - >
      cli53 uses standard AWS credential locations and environment variables: the README
      documents `~/.aws/credentials`, `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`,
      `AWS_PROFILE`, and role assumption with `--role-arn`.
related-packages:
  - id: brew:awscli
    reason: >
      Choose AWS CLI for an AWS-supported, service-wide interface that includes Route
      53; choose cli53 when BIND zone import, export, and validation are the central
      workflow.
    rel: alternative
    sources:
      - https://github.com/barnybug/cli53/blob/main/README.md
      - https://docs.aws.amazon.com/cli/latest/reference/route53/
