history:
  adoption-history:
    - >
      UPDF expanded from an iOS release into desktop and Android applications during
      2022, establishing a single product family across Apple, Windows, and Android
      platforms.
    - >
      The product subsequently added an AI Assistant, browser-accessible UPDF AI, cloud
      synchronization, and a broader subscription-based document workflow.
    - >
      The macOS application is distributed as the Homebrew cask `updf` in addition to
      the vendor's own download and the Mac App Store.
  package-nerd-significance:
    - >
      UPDF represents the commercial, cross-platform end of the macOS PDF-tool spectrum:
      one cask installs a reader, editor, OCR tool, converter, annotator, form tool, and
      AI-assisted document interface.
    - >
      For package-manager users, the cask offers a straightforward installation route
      for an otherwise account- and subscription-oriented desktop product.
  project-history:
    - >
      Superace Software was founded in September 2021 and released UPDF for iOS in
      January 2022. Mac and Windows editions followed in May 2022, with Android support
      in June.
    - >
      UPDF's scope grew beyond conventional PDF editing. An AI Assistant arrived in
      2023, UPDF AI Online launched in 2024, and UPDF 2.0 was released in 2025.
    - >
      The official product history identifies UPDF 2.5 in 2026 as another major product
      milestone.
  related-projects:
    - UPDF AI
    - UPDF Cloud
    - UPDF Sign
    - UPDF Converter
  sources:
    - https://updf.com/about-us/
    - https://updf.com/updf-features/
    - https://updf.com/updf-mac-user-guide/introduction-updf-mac/
    - https://updf.com/whats-new/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      UPDF is a commercial cross-platform PDF application from Superace Software. It
      combines reading, editing, annotation, conversion, OCR, forms, redaction, cloud
      synchronization, and AI-assisted document processing.
  timeline:
    - '2021-09: Superace Software was founded.'
    - '2022-01: UPDF for iOS was released.'
    - '2022-05: UPDF for macOS and Windows was released.'
    - '2022-06: UPDF for Android was released.'
    - '2023-07: UPDF AI Assistant was released.'
    - '2024-03: UPDF AI Online launched.'
    - '2025-05: UPDF 2.0 was released.'
    - '2026-03: UPDF 2.5 was released.'
  usage:
    - >
      Use UPDF to read and edit PDF text, images, links, pages, annotations, forms,
      watermarks, headers, and footers.
    - >
      Its conversion and OCR tools turn PDFs or scanned documents into searchable
      content and common office or image formats.
    - >
      Optional UPDF account, cloud, AI, and paid-license features extend the local
      editor with synchronization and hosted services.
