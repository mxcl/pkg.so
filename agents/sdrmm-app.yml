history:
  adoption-history:
    - >
      SDR-- is packaged both as a desktop application for a locally attached radio and
      as a headless server that can run near an antenna and expose the same receiver
      engine through a browser.
    - >
      Official installation coverage includes macOS, Windows, Linux, Homebrew, Nix, and
      Docker, supporting both workstation and remotely hosted receiver deployments.
  package-nerd-significance:
    - >
      SDR-- is notable as a Rust-based, modular SDR stack that combines native desktop
      packaging, a browser interface, a headless service, and documented REST,
      WebSocket, MCP, and OpenAPI surfaces. This makes it relevant to radio hobbyists as
      well as users building automated or remotely managed receiving systems.
  project-history:
    - >
      Julian Haag developed SDR-- as a modular client-server software-defined-radio
      application for listening, decoding, visualization, and recording.
    - >
      The project organizes receivers as connected device, channel, decoder, and display
      nodes. Its architecture supports local desktop operation and remote browser access
      through the same radio engine.
  related-projects:
    - rtl-sdr
    - HackRF
    - Airspy
    - SigMF
  sources:
    - https://github.com/Newspicel/sdrmm#readme
    - https://github.com/Newspicel/sdrmm/blob/main/openapi.json
    - https://sdrmm.com/
  summary:
    - >
      SDR-- is an open-source, modular client-server software-defined-radio application
      for receiving, decoding, displaying, and recording radio signals.
  timeline:
    - >
      2026: The official repository documents SDR-- as an AGPL-licensed desktop and
      headless-server project maintained by Julian Haag.
  usage:
    - >
      Users connect supported SDR hardware, construct receiver pipelines in Patch view,
      and pin frequently used controls in Rack view.
    - >
      The application supports analog and digital reception, spectrum and waterfall
      displays, signal decoding, IQ and audio recording, SigMF playback, scanning,
      direction-finding experiments, and remote or automated operation.
