    - source_facts.description
  summary:
    - >
      HBuilderX is DCloud's lightweight IDE and code editor for front-end development,
      with especially close integration for Vue, uni-app, mobile applications, and
      mini-programs.
  timeline:
    - 'January 2018: DCloud announced the HBuilderX public test.'
    - 'March 2018: An alpha version for macOS was released.'
    - 'July 2018: DCloud formally released HBuilderX and uni-app.'
    - >
      2018: HBuilderX replaced the original HBuilder as DCloud's actively developed
      editor generation.
  usage:
    - >
      Developers use HBuilderX to edit web and Vue projects, create and run uni-app
      applications, manage plugins, invoke application build services, use integrated
      terminals, and target browsers, native apps, and mini-program platforms.
