history:
  adoption-history:
    - >
      HBuilderX became DCloud's successor to the original HBuilder and the principal
      development environment for DCloud's uni-app and related cross-platform
      application workflows. DCloud's official product overview reports that the
      HBuilder family serves millions of developers.
  package-nerd-significance:
    - >
      HBuilderX represents a major Chinese front-end and cross-platform application
      ecosystem in desktop package collections. Its C++-based editor core, installable
      plugins, integrated application tooling, and close relationship with uni-app
      distinguish it from Electron-based general-purpose editors.
  project-history:
    - >
      DCloud announced the HBuilderX public test in January 2018 and released the first
      Mac alpha in March. The formal HBuilderX and uni-app release followed in July 2018
      after numerous public-test iterations.
    - >
      HBuilderX was positioned as the modern replacement for the Eclipse-based HBuilder,
      emphasizing fast native startup, Vue and Markdown editing, Node-based plugins,
      terminals, and workflows for web, app, and mini-program development.
  related-projects:
