    - Official graph reference documents dependency visualization.
    - Official syntax reference documents the architecture-file schema.
  history-sources:
    - https://github.com/fe3dback/go-arch-lint/blob/master/README.md
    - https://github.com/fe3dback/go-arch-lint/blob/master/docs/graph/README.md
    - https://github.com/fe3dback/go-arch-lint/blob/master/docs/syntax/README.md
    - source_facts.package-manager
  repo-sources:
    - source_facts.repo is already populated; repository output must therefore be null.
  tags-sources:
