id: brew:go-arch-lint
display-name: go-arch-lint
repo: null
docs:
  - https://github.com/fe3dback/go-arch-lint/blob/master/docs/graph/README.md
  - https://github.com/fe3dback/go-arch-lint/blob/master/docs/syntax/README.md
  - https://github.com/fe3dback/go-arch-lint/blob/master/README.md
config-file-location:
  unix:
    - <project-root>/.go-arch-lint.yml
  windows:
    - <project-root>/.go-arch-lint.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as source-installable Go tooling, precompiled releases,
      a container image, and the supplied Homebrew formula. Its README recommends
      incorporating checks into continuous-integration workflows.
    - >
      Its configuration-led workflow supports gradual adoption: teams can describe their
      intended architecture, temporarily mark existing violations as accepted technical
      debt, and remove those exceptions as the codebase is improved.
  package-nerd-significance:
    - >
      go-arch-lint represents a class of repository-local policy tools whose behavior is
      versioned alongside application code in a small YAML file.
    - >
      It is especially relevant to Go projects that want dependency-boundary enforcement
      beyond formatting and conventional source-level lint rules.
  project-history:
    - >
      go-arch-lint was developed as a Go-specific architecture linter for enforcing
      package-layer and dependency rules. Its configuration schema evolved to cover
      components, external vendors, exclusions, common dependencies, and deeper source
      analysis.
    - >
      The tool later added graph generation, allowing the same architecture declaration
      to produce flow-oriented or dependency-injection-oriented visualizations.
  related-projects:
    - Go toolchain and `go/packages`, which provide the package structure being analyzed.
    - >
      Graphviz-style architecture visualization workflows generated from dependency
      declarations.
  sources:
    - https://github.com/fe3dback/go-arch-lint/blob/master/README.md
    - https://github.com/fe3dback/go-arch-lint/blob/master/docs/graph/README.md
    - https://github.com/fe3dback/go-arch-lint/blob/master/docs/syntax/README.md
    - source_facts.package-manager
  summary:
    - >
      go-arch-lint is a command-line static-analysis tool that checks whether a Go
      codebase follows declared architectural component and dependency rules.
  timeline:
    - >
      Configuration schema v3: Added the current documented component, vendor,
      exclusion, and deep-scan model.
    - >
      Graph support: Added flow and dependency-injection views derived from the
      architecture configuration.
  usage:
    - >
      Place `.go-arch-lint.yml` in the project root, describe components and permitted
      dependencies, then run `go-arch-lint check`. The `--arch-file` flag can select
      another path.
    - >
      A successful check exits with status 0; detected architecture warnings produce
      status 1, making the command suitable for CI gates.
    - >
      Run `go-arch-lint graph` to generate an SVG dependency view, optionally focusing
      on a component or including vendor dependencies.
tags:
  - ci
  - clean-architecture
  - cli
  - dependency-rules
  - go
