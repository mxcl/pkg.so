history:
  adoption-history:
    - >
      Termius expanded the traditional desktop SSH-client model across desktop and
      mobile devices. Its encrypted vault and team features support synchronized
      infrastructure inventories, reusable credentials, and collaborative
      administration.
  package-nerd-significance:
    - >
      For package-manager users, Termius represents the commercial, cross-platform
      branch of the SSH-client ecosystem: a graphical client that combines terminal
      sessions, host organization, SFTP, tunneling, snippets, and encrypted
      synchronization in one application.
  project-history:
    - >
      Termius says its application launched in 2011. The company behind it was founded
      in November 2019, joined the Y Combinator accelerator the following month, and
      reported becoming profitable in November 2022.
    - >
      The product developed from an SSH client into a structured infrastructure-access
      workspace built around vaults, groups, hosts, a credential keychain, terminal
      workspaces, snippets, and session logs.
  related-projects:
    - >
      OpenSSH and Mosh provide remote-access protocols and tooling used by the kinds of
      connections Termius manages.
    - SFTP and Telnet are additional connection modes exposed through the Termius host model.
  sources:
    - 'Official company history: https://www.termius.com/about'
    - 'Official documentation index: https://docs.termius.com/llms.txt'
    - 'Official product concepts: https://docs.termius.com/getting-started/what-is-termius'
  summary:
    - >
      Termius is a proprietary cross-platform SSH client and infrastructure-access
      workspace. It organizes hosts, connection settings, keys, passwords, snippets, and
      logs in encrypted personal or team vaults.
  timeline:
    - '2011: Termius says the application launched.'
    - 'November 2019: The company behind Termius was founded.'
    - 'December 2019: Termius joined the Y Combinator accelerator.'
    - 'November 2022: Termius reported reaching profitability.'
  usage:
    - >
      Users define hosts and groups, associate SSH or other protocol settings and
      credentials, and open remote terminal or SFTP sessions. Workspaces, port
      forwarding, snippets, autocomplete, synchronized vaults, and team session logs
      support larger operational workflows.
