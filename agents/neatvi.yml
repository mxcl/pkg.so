id: brew:neatvi
display-name: neatvi
repo: https://repo.or.cz/neatvi.git
docs:
  - http://litcave.rudi.ir/
  - https://repo.or.cz/neatvi.git
config-file-location:
  unix:
    - ~/.neatvi
credentials-file-location: null
history:
  adoption-history:
    - >
      neatvi's adoption is niche and enthusiast-driven. It appears in Homebrew and
      Alpine, and the GitHub mirror showed 394 stars and 38 forks on July 1, 2026.
      Homebrew Formulae listed stable version 19 and 32 installs in its 365-day
      analytics window.
    - >
      Its distinguishing adoption hook is not broad editor popularity but a rare
      combination: vi/ex familiarity, compact C code, UTF-8, and
      bidirectional/right-to-left editing support.
  package-nerd-significance:
    - >
      neatvi is useful enrichment material because it is not merely another vi clone.
      Its package identity is tied to bidirectional UTF-8 editing, small-source
      maintainability, and ex-scriptable configuration.
  project-history:
    - >
      The upstream repo.or.cz summary describes neatvi as a small ex/vi editor and shows
      active maintenance through June 2026. The GitHub mirror/API reports the GitHub
      repository was created on May 28, 2015.
    - >
      The project is deliberately small but not toy-like: its README documents EXINIT
      startup commands, `$HOME/.neatvi`, syntax color commands, keymaps, right-to-left
      text direction options, Arabic/Farsi shaping, buffer/window commands, tags
      support, and quick-access commands.
  related-projects:
    - vi
    - ex
    - nvi
    - OpenBSD vi
  sources:
    - https://api.github.com/repos/aligrudi/neatvi
    - https://formulae.brew.sh/formula/neatvi
    - https://github.com/aligrudi/neatvi
    - https://pkgs.alpinelinux.org/package/edge/testing/x86/neatvi
    - https://repo.or.cz/neatvi.git
  summary:
    - >
      neatvi is Ali Gholami Rudi's small ex/vi clone for editing UTF-8 text, with
      particular emphasis on bidirectional text. Its README says it supports syntax
      highlighting, multiple windows, right-to-left languages, and keymaps.
  timeline:
    - >
      {'date': '2015-05-28', 'event': 'aligrudi/neatvi repository creation date reported
      by the GitHub API.'}
    - >
      {'date': '2026-05-17', 'event': 'repo.or.cz tag listing showed version 19 around
      this date.'}
    - "{'date': '2026-06-28', 'event': 'repo.or.cz summary showed a last change on this date.'}"
    - >
      {'date': '2026-07-01', 'event': 'Homebrew Formulae listed stable 19 and 32
      installs in the 365-day analytics window.'}
  usage:
    - >
      Package nerds install neatvi when they want a minimal vi-like editor with Unicode
      and right-to-left behavior, or when they want a small C editor they can read and
      patch. Configuration is done through EXINIT, `$HOME/.neatvi`, and in some cases
      source-level changes to `conf.h` for syntax highlighting and text direction
      patterns.
    - >
      The README also notes terminal-specific behavior for VTE-based terminals and
      exposes options for disabling shaping, character reordering, or highlighting when
      performance matters.
related-packages: []
