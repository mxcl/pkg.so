history:
  adoption-history:
    - >
      Pencil2D developed into a volunteer-run, cross-platform application for Windows,
      macOS, Linux, and FreeBSD. Its official repository describes a community-driven
      project and provides release and nightly builds.
    - >
      Its availability as a Homebrew cask gives macOS users a package-managed
      alternative to downloading the application bundle manually.
  package-nerd-significance:
    - >
      Pencil2D is notable as a small, cross-platform GPL animation application that
      supports both bitmap and vector drawing rather than requiring a full commercial
      animation suite.
    - >
      The project preserves a visible lineage from the original Pencil application while
      maintaining primary and mirror repositories and reproducible source builds.
  project-history:
    - >
      Pencil2D descends from the earlier Pencil animation program. The official
      changelog records early Pencil releases, a unified Mac, Windows, and Linux
      codebase in 2007, a Morevna branch in 2010, and the later Pencil2D release series.
    - >
      The project subsequently added customizable shortcuts, colored onion-skinning,
      improved timeline tooling, crash recovery, and continued Qt-based cross-platform
      maintenance.
  related-projects:
    - Pencil
    - Morevna branch
    - Qt
  sources:
    - 'Official changelog: https://github.com/pencil2d/pencil/blob/master/ChangeLog.md'
    - 'Official repository and project history: https://github.com/pencil2d/pencil'
    - 'Official user documentation: https://www.pencil2d.org/doc/'
  summary:
    - >
      Pencil2D is a free, open-source application for traditional frame-by-frame 2D
      animation using bitmap and vector graphics.
  timeline:
    - '2007: Pencil 0.4.3b unified the Mac, Windows, and Linux source code.'
    - '2010: The official changelog recorded the Pencil Animation Morevna branch.'
    - '2013: Version 0.5.4 added customizable keyboard shortcuts and substantial refactoring.'
    - >
      2017: Pencil2D 0.6 introduced a redesigned timeline, colored onion skins, and
      drawing-tool improvements.
    - '2021: Version 0.6.6 added preliminary crash recovery and other workflow improvements.'
  usage:
    - >
      Artists use Pencil2D to sketch and animate frame by frame, organize drawings on a
      timeline, combine bitmap and vector layers, preview with onion skins, and export
      finished work.
    - >
      The official manual recommends learning the basic interface and adjusting
      preferences such as automatic key-frame creation, onion-skin visibility, and
      keyboard shortcuts.
