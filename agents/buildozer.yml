history:
  adoption-history:
    - >
      Buildozer's adoption is tied to Bazel adoption. Teams with large monorepos use it
      for mechanical BUILD-file migrations: adding dependencies, changing rule kinds,
      rewriting loads, deleting attributes, or applying edits across entire package
      trees.
    - >
      Its availability through Homebrew and Nix makes it easy to install outside a Bazel
      source checkout, while Go module installation gives Bazel users a direct
      upstream-supported path.
  package-nerd-significance:
    - >
      Buildozer is a package nerd tool because it encodes Bazel's BUILD-file editing
      semantics into a small CLI. It is the kind of utility that package managers carry
      so build-system maintainers can do tedious monorepo migrations without checking
      out a larger toolchain.
    - >
      Its relationship with Buildifier is the key: one tool changes the syntax tree, the
      other normalizes the result. That pair became part of the everyday hygiene toolkit
      for serious Bazel repositories.
  project-history:
    - >
      The `bazelbuild/buildtools` repository was created on 2016-06-09 as a home for
      developer tools around Bazel BUILD files. Its top-level README groups Buildifier,
      Buildozer, and unused_deps together: formatter, editor, and Java dependency
      cleanup tool.
    - >
      Buildozer's README defines it as a command-line tool for rewriting multiple Bazel
      BUILD files with standard commands. Its command language grew around labels, rule
      kinds, loads, attributes, comments, and later MODULE.bazel operations, reflecting
      the needs of large Bazel codebases where hand-editing BUILD files is slow and
      error-prone.
  related-projects:
    - >
      Buildozer is closely related to Bazel, Buildifier, unused_deps, Starlark BUILD
      files, MODULE.bazel, and monorepo migration tooling.
  sources:
    - https://api.github.com/repos/bazelbuild/buildtools
    - https://github.com/bazelbuild/buildtools
    - https://github.com/bazelbuild/buildtools/blob/master/buildozer/README.md
  summary:
    - >
      Buildozer is the command-line rewrite tool from Bazel's `buildtools` repository.
      It applies scripted edits to Bazel BUILD-like files, complementing Buildifier's
      formatting role with bulk, machine-checkable structural changes.
  timeline:
    - '2016: `bazelbuild/buildtools` repository is created.'
    - '2016: Buildozer is distributed as one of the core tools in the Buildtools repository.'
    - >
      2020s: Buildozer gains support for modern Bazel file shapes such as MODULE.bazel
      operations.
    - >
      2026: The Buildtools repository remains active as Bazel's formatter/editor tool
      collection.
  usage:
    - >
      Typical usage is `buildozer 'command args' //pkg:target`, often repeated across
      many labels or fed from a command file. Buildozer can print modified files, format
      through Buildifier, run multiple commands in order, and process files in parallel.
    - >
      The tool is most useful when a repository-wide BUILD migration should be expressed
      as a small, repeatable command instead of a one-off script that parses Starlark
      poorly.
related-packages:
  - id: brew:buildifier
    reason: >
      Run Buildifier after structural Buildozer edits to apply standard formatting and
      lint checks to the modified Bazel and Starlark files.
    rel: adjacent_workflow
    sources:
      - https://github.com/bazel-contrib/buildtools/blob/main/buildozer/README.md
      - https://github.com/bazelbuild/buildtools/blob/main/buildifier/README.md
  - id: brew:bazel
    reason: >
      Use Bazel to query, build, and test the targets whose source BUILD definitions
      Buildozer edits; Buildozer itself does not evaluate expanded Bazel macros.
    rel: adjacent_workflow
    sources:
      - https://github.com/bazel-contrib/buildtools/blob/main/buildozer/README.md
      - https://bazel.build/about/intro
