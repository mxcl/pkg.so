history:
  adoption-history:
    - >
      The client won first prize in Telegram’s Lightweight Client Contest and
      subsequently became an official Telegram web client at web.telegram.org/a. Its
      installable desktop build extends the same application beyond the browser.
    - >
      The project’s public repository and GPL licensing enable community inspection and
      contribution, while operational feedback is routed through Telegram’s official
      suggestions platform.
  package-nerd-significance:
    - >
      Telegram A is notable for being an official messenger client built with an
      unusually self-contained web stack: its own React-like Teact framework, a
      customized GramJS implementation, and extensive use of Web Workers, WebAssembly,
      IndexedDB-style caching, streaming, and PWA APIs. The desktop cask packages that
      web-first architecture as a native-style application.
  project-history:
    - >
      Telegram Web A began as a lightweight-client contest entry and published its
      initial 1.0 release in March 2021. The project deliberately minimized dependencies
      and built its interface on the custom Teact framework.
    - >
      In August 2023, the project jumped from version 1.x to 10.0 to mark Telegram’s
      tenth anniversary and its functional parity with native clients. That release also
      introduced an experimental standalone desktop build for macOS, Windows, and Linux.
  related-projects:
    - Telegram
    - Telegram Web K
    - Teact
    - GramJS
  sources:
    - 'Official changelog: https://github.com/Ajaxy/telegram-tt/blob/master/CHANGELOG.md'
    - 'Official project wiki: https://github.com/Ajaxy/telegram-tt/wiki'
    - 'Official repository README: https://github.com/Ajaxy/telegram-tt#readme'
    - source_facts.applications
    - source_facts.description
  summary:
    - >
      Telegram A is the installable desktop edition of Telegram Web A, an open-source
      official Telegram client derived from a prize-winning lightweight-client contest
      entry.
  timeline:
    - '2021: Version 1.0.0 is released on March 13.'
    - '2023: Version 10.0 introduces an experimental standalone desktop edition.'
    - '2026: The project wiki adopts the Telegram Air (Web A) name.'
  usage:
    - >
      Users sign in to their Telegram account and access chats, channels, groups, calls,
      media, bots, and other Telegram features through the Web A interface. The cask
      provides the experimental standalone desktop packaging rather than requiring a
      browser tab.
