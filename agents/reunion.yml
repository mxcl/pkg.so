history:
  adoption-history:
    - >
      Reunion has maintained compatibility across many generations of its family-file
      format: Reunion 14 directly converts files from versions 5 through 13. Its
      official community, ReunionTalk, and companion ReunionTouch application support
      long-lived family-history projects across Mac, iPhone, and iPad.
  package-nerd-significance:
    - >
      Reunion is notable as a long-running, Mac-focused genealogy package with
      proprietary family files, GEDCOM interchange, extensive reporting, and migration
      paths spanning many major releases. For package maintainers, its enduring user
      data and paid-license model make upgrades and file compatibility more
      consequential than a routine application replacement.
  project-history:
    - >
      Leister Productions develops Reunion for Mac and the companion ReunionTouch
      application. The product has advanced through numerous paid major releases while
      retaining conversion paths for older family files; Reunion 14 replaced Reunion 13
      in early 2024.
  related-projects:
    - >
      ReunionTouch is the companion iPhone and iPad application. GEDCOM provides
      interchange with other genealogy software, while Dropbox and iCloud Drive can be
      used in supported workflows for sharing family files between devices.
  sources:
    - https://leisterpro.com/doc/olderversions/olderversions.php
    - https://www.leisterpro.com/
    - https://www.leisterpro.com/doc/v14/features/features.php
    - https://www.leisterpro.com/doc/v14/questions/answers/howtoupgrade.php
  summary:
    - >
      Reunion is Leister Productions' proprietary genealogy and family-tree application
      for macOS.
  timeline:
    - >
      2015: Reunion 11 replaced Reunion 10, and ReunionTouch replaced the earlier iPhone
      and iPad applications.
    - '2017: Reunion 12 replaced Reunion 11 late in the year.'
    - '2020: Reunion 13 replaced Reunion 12 late in the year.'
    - '2024: Reunion 14 replaced Reunion 13 early in the year.'
  usage:
    - >
      Genealogists use Reunion to maintain people, families, events, places, media,
      sources, citations, notes, and relationships; generate charts, books, reports, and
      web projects; and exchange raw genealogy data through GEDCOM. By default, family
      files are kept under Documents/Reunion Files, although users may deliberately
      place them in supported cloud-storage workflows.
