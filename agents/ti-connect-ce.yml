history:
  adoption-history:
    - >
      TI positions TI Connect CE as the free desktop companion for the TI-84 Plus
      family. Its ability to address multiple connected calculators makes it useful not
      only to individual owners but also to teachers and classroom administrators
      maintaining groups of devices.
  package-nerd-significance:
    - >
      TI Connect CE bridges desktop package management and a durable
      educational-hardware ecosystem. It is particularly useful to calculator
      enthusiasts and classroom administrators who want a repeatable way to install the
      vendor utility needed for operating-system updates, file transfer, screenshots,
      and TI-Basic development.
  project-history:
    - >
      Texas Instruments developed TI Connect CE as the computer-side connectivity
      environment for the color-screen TI-84 Plus CE generation and compatible earlier
      TI-84 Plus models. Official TI educational material documents the software in use
      by 2015, the year TI introduced the TI-84 Plus CE calculator.
  related-projects:
    - >
      TI Connect, the earlier connectivity application for older and non-color graphing
      calculators.
    - TI Connect CE App for Chrome OS, a more limited browser-platform companion.
    - TI-84 Plus CE and other supported TI-84 Plus-family calculators.
  sources:
    - https://education.ti.com/en/product-resources/guidebooks/ti-connectivity-sw
    - https://education.ti.com/en/product-resources/ti-connect-ce-get-the-right-version
    - https://education.ti.com/en/products/computer-software/ti-connect-ce-sw
    - >
      https://www.ti.com/about-ti/newsroom/news-releases/2015/2015-01-27-texas-instruments-unveils-the-new-ti-84-plus-ce.html
  summary:
    - >
      TI Connect CE is Texas Instruments' free Windows and macOS companion application
      for transferring files, maintaining, capturing screens from, and programming TI-84
      Plus-family graphing calculators.
  timeline:
    - >
      2015: Texas Instruments introduced the TI-84 Plus CE, and contemporary TI
      materials documented TI Connect CE as its desktop connectivity software.
    - >
      Later releases: TI continued expanding and maintaining the application for current
      Windows and macOS systems and multiple TI-84 Plus-family models.
  usage:
    - >
      Users connect calculators over USB, browse and transfer calculator files, update
      calculator operating systems and applications, capture screens, inspect device
      information, and create or edit TI-Basic programs. It can communicate with
      multiple supported calculators at once.
