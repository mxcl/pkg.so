id: brew:eureka
display-name: eureka
repo: null
docs:
  - https://github.com/simeg/eureka#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/eureka/config.json
    - ~/.config/eureka/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents Homebrew and Cargo installation. The input package
      facts list eureka in Homebrew, Debian, Ubuntu, Fedora/DNF, MacPorts, and
      openSUSE/Zypper.
  package-nerd-significance:
    - >
      eureka is a small Rust productivity CLI that leans on Unix conventions: `$EDITOR`,
      `$PAGER`, XDG config, Git remotes, Cargo distribution, and Homebrew packaging.
  project-history:
    - >
      The official repository was created in 2017. The README describes a workflow where
      a user runs `eureka`, writes an idea in their preferred editor, and has the result
      committed and pushed to an ideas repository.
  related-projects:
    - Git
    - Cargo
    - Homebrew
    - XDG Base Directory
  sources:
    - GitHub API for simeg/eureka repository metadata.
    - Official eureka Cargo.toml.
    - Official eureka README.
    - Official eureka src/config_manager.rs and src/lib.rs.
    - source_facts.package-manager
  summary:
    - >
      eureka is a Rust CLI for quickly capturing ideas in a terminal and committing them
      to a user-owned Git repository.
  timeline:
    - '2017: Official GitHub repository created.'
    - '2023: Cargo.toml reports version 2.0.0 and current Rust 2021-era packaging metadata.'
  usage:
    - >
      On first run, eureka asks for the absolute path to an ideas repository and stores
      it in an XDG-style config file. Later runs open the repository README in the
      user's editor, then commit and push to the `main` branch; `--view` opens the ideas
      file through the user's pager.
related-packages:
  - id: brew:nb
    reason: >
      Choose nb when you want multiple plain-text notebooks, search, tags, encryption,
      and configurable Git synchronization; choose eureka for a deliberately minimal
      single-file idea capture-and-push workflow.
    rel: alternative
    sources:
      - https://github.com/simeg/eureka#readme
      - https://xwmx.github.io/nb/
