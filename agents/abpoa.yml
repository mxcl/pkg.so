history:
  adoption-history:
    - >
      The README documents installation via conda and Homebrew, source builds, prebuilt
      Linux and macOS binaries, and a pyabpoa Python package. The input metadata also
      shows distribution packaging in Homebrew, Debian, Nix, and Ubuntu, which is
      typical for bioinformatics tools that need both reproducible workflows and local
      command-line execution.
  package-nerd-significance:
    - >
      The package is significant because it turns a common long-read consensus and MSA
      building block into a portable SIMD-aware command-line dependency. Its release
      notes continue to mention packaging-facing work such as pyproject.toml for pyabpoa
      and SIMD dispatch.
  project-history:
    - >
      The first GitHub release, v1.0.0, was published on April 15, 2020. The project was
      described in Bioinformatics later in 2020 as an SIMD-based C library for fast
      partial order alignment using adaptive banding, and the upstream README presents
      it as an extended version of partial-order alignment with adaptive banded dynamic
      programming and SIMD implementation.
  related-projects:
    - >
      The README explicitly frames abPOA as an extension of partial-order alignment and
      references heaviest bundling for consensus generation. It also ships pyabpoa for
      Python users and connects to Bioconda and Homebrew packaging for workflow
      installation.
  sources:
    - https://doi.org/10.1093/bioinformatics/btaa963
    - https://github.com/yangao07/abPOA#readme
    - https://github.com/yangao07/abPOA/releases
    - input source_facts.package-manager
  summary:
    - >
      abPOA is a C library and command-line tool for adaptive-banded partial-order
      alignment, multiple sequence alignment, and consensus generation. Package
      maintainers care about it because it exposes a performance-sensitive
      bioinformatics primitive as a small buildable C package with command-line, conda,
      Homebrew, and Python-facing usage.
  timeline:
    - '2020: First public GitHub release v1.0.0.'
    - '2020: Bioinformatics article published for abPOA.'
    - '2025: v1.5.4 added SIMD dispatch and Python 3.13 installation fixes.'
    - '2026: v1.5.6 added easier incremental MSA and pyproject.toml for pyabpoa.'
  usage:
    - >
      abPOA accepts FASTA, FASTQ, and gzip-compressed FASTA/FASTQ input, performs
      sequence-to-graph alignment, emits consensus FASTA by default, and can also emit
      row-column MSA, GFA graph output, amino-acid consensus, and graph plots. The
      README documents global, local, and extension alignment modes plus linear, affine,
      and convex gap penalties.
related-packages:
  - id: brew:graphviz
    reason: >
      abPOA uses Graphviz's dot command to render its partial-order alignment graph when
      graph plotting is requested.
    rel: adjacent_workflow
    sources:
