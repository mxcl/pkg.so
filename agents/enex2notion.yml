config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through multiple CLI-friendly channels: Homebrew for
      macOS, pipx and pip for Python users, portable GitHub release binaries, and Docker
      images. That spread reflects its role as a one-shot migration utility rather than
      a long-running service.
  package-nerd-significance:
    - >
      enex2notion matters in package-manager culture because it packages a fragile
      migration workflow into a repeatable CLI. The interesting packaging surface is
      less the binary itself and more the mix of Python packaging, Homebrew
      installation, Docker distribution, and optional external tools such as
      wkhtmltopdf.
  project-history:
    - >
      The public GitHub project was created in 2021. Its README says it was written
      because Notion's native Evernote importer did not satisfy the author, and it
      credits md2notion and notion-py as inspirations.
  related-projects:
    - >
      The README names evernote-backup as a companion export tool and credits md2notion
      and notion-py as inspirations.
  sources:
    - https://github.com/vzhd1701/enex2notion
    - https://raw.githubusercontent.com/vzhd1701/enex2notion/master/README.md
    - https://formulae.brew.sh/formula/enex2notion
  summary:
    - >
      enex2notion is a Python command-line importer for moving Evernote ENEX exports
      into Notion, preserving attachments, formatting, tables, web clips, metadata, and
      notebook structure where Notion allows it.
  timeline:
    - '2021: Public GitHub repository created.'
    - >
      2020s: README documents Homebrew, pipx, pip, Docker, and portable binary
      installation paths.
  usage:
    - >
      Users point the tool at one or more ENEX files or directories and pass a Notion
      `token_v2` cookie when uploading. The README also documents a dry-run mode without
      a token, retry behavior, continuation through a done-file, database versus page
      upload modes, and web-clip conversion to text or PDF.
related-packages:
  - id: brew:evernote-backup
    reason: >
      Use evernote-backup first to synchronize an Evernote account and export the ENEX
      files that enex2notion imports into Notion.
    rel: adjacent_workflow
    sources:
      - https://github.com/vzhd1701/enex2notion#readme
      - https://github.com/vzhd1701/evernote-backup#readme
