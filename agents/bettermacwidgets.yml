history:
  adoption-history:
    - >
      The official site positions BetterMacWidgets as a native Apple-silicon utility for
      users who want desktop widgets that remain colorful, animated, interactive, and
      freely positioned instead of using the standard WidgetKit presentation.
  package-nerd-significance:
    - >
      Its Homebrew cask makes a young, independently distributed Mac utility
      reproducibly discoverable and installable. Custom widgets defined by small JSON
      files also give the application an unusually hackable edge for a commercial
      desktop-widget product.
  project-history:
    - >
      BetterMacWidgets was created by Nico Sagolla, also identified by the official site
      as the maker of MenuBarMonitor and Notchmate. Its public changelog documents rapid
      development during 2026, including widget stacks, custom JSON widgets, per-display
      layout restoration, and lock-screen support.
  related-projects:
    - MenuBarMonitor and Notchmate are sibling applications from the same developer.
    - >
      Apple WidgetKit supplies macOS's built-in widget model, whose presentation and
      animation limitations BetterMacWidgets explicitly seeks to avoid.
  sources:
    - >
      https://bettermacwidgets.de/ — official product description, authorship, feature
      set, privacy model, and supported systems.
    - https://bettermacwidgets.de/changelog — official dated release history.
    - https://bettermacwidgets.de/desktop-widgets — official usage and troubleshooting guide.
  summary:
    - >
      BetterMacWidgets is a native macOS desktop-customization utility that places live
      widgets in freely arranged desktop panels. It combines system monitoring, clocks,
      weather, reminders, media controls, notes, launchers, and user-defined JSON
      widgets.
  timeline:
    - '2026-07: Early public releases added activation, automatic updates, and smart layouts.'
    - '2026-07-21: Version 1.1.0 introduced widget stacks and the Clear glass appearance.'
    - '2026-08-12: Version 1.9.0 introduced custom JSON widgets.'
    - '2026-09-02: Version 2.1.0 introduced lock-screen widgets in beta.'
    - '2026-09-17: Version 2.3.1 unified premium features under Pro access.'
  usage:
    - >
      Users arrange widgets directly on the desktop using drag-and-drop and an invisible
      snap grid. Common uses include system monitoring, weather, calendars and
      reminders, media control, sticky notes, app launching, and Shortcut execution.
    - >
      Custom widgets are described in `.bmwidget` JSON files and can display local
      readings, time values, or data retrieved from a named JSON endpoint.
