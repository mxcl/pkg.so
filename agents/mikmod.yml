history:
  project-history:
    - >
      The package split matters: libmikmod is the playback library, while mikmod is the
      curses-style player built on it. The project describes support for common module
      formats such as MOD, S3M, IT, and XM, and the man page lists a wider set including
      MTM, STM, ULT, FAR, MED, DSM, AMF, IMF, and 669. That made MikMod useful both as
      an end-user module player and as a reusable decoder/playback layer for software
      that needed tracker music support.
  sources:
    - https://formulae.brew.sh/formula/mikmod
    - https://linux.die.net/man/1/mikmod
    - https://mikmod.sourceforge.net/
    - https://mikmod.sourceforge.net/doc/mikmod-3.3.13.html
    - https://sourceforge.net/projects/mikmod/
  summary:
    - >
      MikMod is a tracked-module music player and library rooted in the MS-DOS demoscene
      and tracker-music ecosystem. The project homepage says it began as a player for
      MS-DOS and was ported to Unix, Macintosh, BeOS, Java, and other platforms. It
      names Jean-Paul Mikkers, Jake Stine, and Frank Loemker as main authors, with Steve
      McIntyre, Peter Amstutz, Miodrag Vallat, Raphaël Assénat, Shlomi Fish, and Ozkan
      among successive Unix or project maintainers.
  usage:
    - >
      The project history is also a portability story. The homepage records migration of
      version control to SourceForge Git in 2017 and maintenance releases for libmikmod
      and the player through the 2020s, including loader fixes, audio-driver updates,
      format support, fuzzing-driven robustness work, and platform build updates. In
      package managers, mikmod fills the compact command-line module-player niche beside
      libraries such as libmodplug and libopenmpt: useful for playing and validating old
      tracker files, archives, and chiptune-era music collections from a terminal.
related-packages:
  - id: brew:libopenmpt
    reason: >
      Choose libopenmpt's openmpt123 for a modern cross-platform terminal module player
      backed by OpenMPT's actively maintained decoder; choose MikMod when compatibility
      with the libmikmod ecosystem is important.
    rel: alternative
    sources:
      - https://mikmod.sourceforge.net/
      - https://lib.openmpt.org/libopenmpt/documentation/
      - https://lib.openmpt.org/libopenmpt/faq/
