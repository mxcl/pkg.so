config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Chroma's adoption is partly library-driven: it has Go package documentation, a
      playground, and a CLI, while static-site and documentation tooling can embed it to
      avoid a Python/Pygments runtime. Homebrew packages the CLI and reports stable
      version 2.27.0.
    - >
      The supplied package-manager facts list Homebrew, Debian, Ubuntu, Nix, and Scoop
      packages, showing distribution beyond the Go module ecosystem.
  package-nerd-significance:
    - >
      Chroma is package-nerd interesting because it made Pygments-style highlighting
      available as a native Go dependency and standalone binary. That matters for
      self-contained Go programs, static-site generators, and container images that want
      syntax highlighting without a Python toolchain.
  project-history:
    - >
      The GitHub repository was created in June 2017. The README describes Chroma as
      converting source code and structured text into highlighted HTML, ANSI-colored
      text, and other output, with lexers, formatters, and styles modeled heavily on
      Pygments.
    - >
      The project published v0.1.0 in September 2017, v2.0.0 in May 2022, and continued
      a fast v2 release line through 2026, with v3 alpha releases introducing Go
      iterator changes and a new module path.
  related-projects:
    - >
      Pygments is the explicit design ancestor; the README says Chroma is based heavily
      on it and includes translators for Pygments lexers and styles. Related surfaces
      include Go package documentation, the Chroma playground, and the
      `pygments2chroma_xml.py` conversion script.
  sources:
    - https://github.com/alecthomas/chroma#readme
    - https://github.com/alecthomas/chroma/releases
    - https://pkg.go.dev/github.com/alecthomas/chroma/v3
    - https://formulae.brew.sh/api/formula/chroma.json
  summary:
    - >
      Chroma is a pure-Go general-purpose syntax highlighter, usable both as a Go
      library and as the `chroma` command-line tool.
  timeline:
    - '2017: Repository created and v0.1.0 release published.'
    - '2022: v2.0.0 release published.'
    - '2025: v2 line continues with frequent releases through v2.20.0.'
    - '2026: v2.27.0 and v3.0.0-alpha releases published.'
  usage:
    - >
      Library users select a lexer, formatter, and style, or use the `quick.Highlight`
      helper. CLI users can run `chroma` directly and inspect available lexers with
      `chroma --list`.
related-packages:
  - id: brew:pygments
    reason: >
      Choose Pygments when a Python-native highlighter, its broader lexer collection, or
      formats such as LaTeX and RTF are preferable; Chroma explicitly derives its model
      and many definitions from Pygments.
    rel: alternative
    sources:
      - https://github.com/alecthomas/chroma#readme
      - https://pygments.org/
      - https://pygments.org/docs/quickstart/
  - id: brew:hugo
    reason: >
      Hugo provides a documented publishing workflow that uses Chroma-backed
      highlighting for fenced code, templates, and shortcodes.
    rel: adjacent_workflow
    sources:
      - https://github.com/alecthomas/chroma#readme
      - https://gohugo.io/content-management/syntax-highlighting/
