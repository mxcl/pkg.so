credentials-file-location: null
history:
  adoption-history:
    - >
      KubeKey adoption is tied closely to KubeSphere installation and lifecycle
      management. It became the path for installing Kubernetes alone or installing
      Kubernetes and KubeSphere together, especially for users who wanted all-in-one,
      multi-node, highly available, or offline setups.
    - >
      The project is less broadly packaged than kubectx or kubelogin, but its Homebrew
      formula is useful for operators who want the kk binary installed through the same
      package manager as kubectl and other cluster tools.
  package-nerd-significance:
    - >
      KubeKey is notable because it packages a full Kubernetes/KubeSphere installer as a
      single CLI binary. For package-manager users, kk sits in the same mental bucket as
      kubeadm wrappers and distribution installers: a bootstrap executable whose version
      controls a large amount of cluster state.
  project-history:
    - >
      The public GitHub repository was created on March 19, 2020. KubeSphere
      documentation from the KubeKey installation guide refers to KubeKey version 1.0.1,
      and the repository README describes KubeKey as an open source lightweight
      task-flow execution tool that provides a flexible way to install Kubernetes.
    - >
      The README says the 3.x line expanded KubeKey from a Kubernetes
      lifecycle-management tool into a task-execution tool with template management and
      multiple connection methods. The 4.x release packaging also includes web-installer
      assets, schema files, task templates, and offline package tooling.
  related-projects:
    - >
      KubeSphere is the platform ecosystem for which KubeKey is an installer and
      lifecycle tool.
    - >
      kubeadm is listed among the repository topics and is part of the broader
      Kubernetes bootstrap context.
    - Ansible is referenced by the README as an inspiration for KubeKey's task-flow design.
  sources:
    - https://api.github.com/repos/kubesphere/kubekey
    - https://formulae.brew.sh/formula/kubekey
    - https://github.com/kubesphere/kubekey
    - https://github.com/kubesphere/kubekey/releases
    - https://github.com/kubesphere/kubekey/tree/main/docs
    - https://kubesphere.io/blogs/install-kubernetes-using-kubekey/
  summary:
    - >
      KubeKey is the KubeSphere ecosystem's installer and task-execution CLI for
      Kubernetes, KubeSphere, and related cloud-native add-ons. It is packaged as the kk
      executable and is used for cluster creation, upgrades, scaling, offline artifacts,
      and later task-flow style automation.
  timeline:
    - '2020-03-19: Public GitHub repository created'
    - '2021: KubeSphere installation documentation referenced KubeKey version 1.0.1'
    - '2023: 3.x README described expansion from lifecycle management to task execution'
    - '2026-06-05: v4.0.5 release published'
  usage:
    - >
      A common workflow is to run kk create config to generate config-sample.yaml, edit
      host and cluster settings, and then run kk create cluster -f config-sample.yaml.
      The repository documentation also covers node add/delete operations, certificate
      renewal, offline artifact export, image registry setup, and dependency packages.
    - >
      KubeKey's configuration file can include host connection details, Kubernetes
      version, networking, registry mirrors, and add-ons. That makes it closer to an
      installer plus declarative cluster recipe than a single-purpose kubectl plugin.
related-packages: []
