history:
  adoption-history:
    - >
      fgbio has a narrower package footprint than general-purpose CLIs, but it is
      visible in bioinformatics distribution channels. Its README advertises Bioconda,
      Maven Central, Javadocs, Zenodo DOI metadata, and installation through conda or a
      minimal conda package; the batch package facts show a Homebrew formula as well.
    - >
      The project README says the tools are used by Fulcrum Genomics customers and
      others for ad-hoc analysis and production pipelines. That positions fgbio as a
      practical pipeline component rather than only a reference implementation.
  package-nerd-significance:
    - >
      fgbio matters to package maintainers because it packages a JVM/Scala genomics
      toolkit as a reproducible command-line dependency for sequencing pipelines. Its
      useful surface is a large family of subcommands, so packaging quality is about
      making one executable reliably available with the right Java runtime rather than
      exposing a single algorithm.
  project-history:
    - >
      The GitHub repository was created in March 2016, and the first release listed by
      the GitHub API is 0.1.0 later that month. The README describes fgbio as a set of
      tools for genomic data analysis with a focus on next-generation sequencing.
    - >
      The project is written in Scala, built with sbt, and distributed as an executable
      jar or through package managers. Its README says the repository README is mostly
      for developers and builders, while the project website carries detailed user
      documentation, per-tool usage pages, and metrics documentation.
    - >
      The toolkit's stated goals are robust, well-tested tools, an easy command line,
      clear documentation, and open-source development for the community and Fulcrum
      Genomics clients. The tool list shows the project expanding into UMI handling,
      consensus reads, FASTQ/BAM manipulation, QC metrics, contig-name rewriting, and
      synthetic mixture VCF creation.
  related-projects:
    - >
      fgbio relates to bioinformatics tools and formats around FASTQ, SAM/BAM, VCF/BCF,
      Unique Molecular Index workflows, and Fulcrum Genomics' Rust fqtk demultiplexing
      work mentioned in the README.
  sources:
    - https://github.com/fulcrumgenomics/fgbio
    - https://api.github.com/repos/fulcrumgenomics/fgbio
    - https://api.github.com/repos/fulcrumgenomics/fgbio/releases
    - https://fulcrumgenomics.github.io/fgbio
    - https://fulcrumgenomics.github.io/fgbio/tools/latest
    - https://formulae.brew.sh/formula/fgbio
  summary:
    - >
      fgbio is a Fulcrum Genomics toolkit for analyzing genomic and high-throughput
      sequencing data. It is a command-line collection aimed at read-level and
      variant-level workflows, with a particular emphasis on robust NGS processing,
      molecular indexes, and consensus-read generation.
  timeline:
    - '2016: GitHub repository created and 0.1.0 released.'
    - '2024: Zenodo DOI metadata was present in the project README badge.'
    - '2026: GitHub API showed release 4.1.0 and recent repository activity.'
  usage:
    - >
      Users run fgbio as a command-line toolkit over FASTQ, SAM/BAM, VCF/BCF, and
      related genomic data. Common documented areas include UMI annotation and
      correction, grouping reads by UMI, calling molecular or duplex consensus reads,
      filtering and clipping BAMs, sorting and updating read groups, collecting QC
      metrics, and manipulating contig names.
    - >
      The README documents `java -jar target/scala-2.13/fgbio-<version>.jar` for command
      discovery when building locally, while normal users are directed to the hosted
      tools documentation and package-manager installation.
related-packages:
  - id: brew:picard-tools
    reason: >
      fgbio's official support guidance asks users to run Picard ValidateSamFile on BAM
      inputs before reporting failures, making Picard a concrete validation companion.
    rel: adjacent_workflow
    sources:
      - https://fulcrumgenomics.github.io/fgbio/
      - https://broadinstitute.github.io/picard/command-line-overview.html
