history:
  adoption-history:
    - >
      Xunlei reports that its download products accumulated more than 460 million
      registered users. Its corporate timeline records 100 million users in 2006, 300
      million in 2010, and 460 million in 2013; these are company-reported figures.
  package-nerd-significance:
    - >
      Xunlei is notable in package-manager catalogs as a long-lived, regionally
      prominent proprietary download client built around P2SP acceleration rather than a
      conventional open-source Unix downloader.
  project-history:
    - >
      The product originated in Silicon Valley in 2002, according to Xunlei's corporate
      history. The company was established and Xunlei 2 was publicly released in 2003;
      later releases expanded the download client across desktop, mobile, NAS, and
      cloud-storage products.
    - >
      The Mac edition was introduced in 2011. Xunlei subsequently broadened its
      technology and product portfolio into cloud storage, content delivery,
      decentralized storage, and related services.
  related-projects:
    - Xunlei Cloud Drive
    - Xunlei NAS
    - Xunlei Video
    - Xunlei Browser
  sources:
    - 'Official Xunlei corporate history and product overview: https://www.xunlei.com/about/'
    - 'Official Xunlei product page: https://www.xunlei.com/'
  summary:
    - >
      Xunlei, packaged on macOS as Thunder.app, is the Mac edition of the proprietary
      Chinese download and storage client. Its official site emphasizes accelerated
      downloading, cloud storage, and a wider decentralized transfer ecosystem.
  timeline:
    - '2002: The prototype of Xunlei was created in Silicon Valley'
    - '2003: The company was established and Xunlei 2 was publicly released'
    - '2006: Xunlei reported surpassing 100 million users'
    - '2011: The Mac edition was released'
    - '2014: Xunlei listed on Nasdaq'
  usage:
    - >
      Users employ Xunlei to acquire and manage digital downloads, with optional
      membership services for acceleration and integration with Xunlei's cloud-storage
      ecosystem.
