id: brew:iceberg-cli
display-name: Apache Iceberg CLI
repo: null
docs:
  - https://go.iceberg.apache.org/cli.html
config-file-location:
  unix:
    - ~/.iceberg-go.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The CLI reflects Iceberg adoption moving from engine-integrated libraries into
      packageable operational tools. The Apache Iceberg site lists Go alongside Python,
      Rust, and C++ as other implementations, while the Homebrew formula exposes the Go
      CLI directly as `iceberg`.
    - >
      Its package-manager role is strongest for data engineers who want quick catalog
      checks, snapshot inspection, and maintenance commands from scripts, CI jobs, or a
      laptop shell.
  package-nerd-significance:
    - >
      For package nerds, `iceberg-cli` is the small executable edge of a very large
      lakehouse ecosystem. It packages the Iceberg control plane as a Go binary,
      avoiding a JVM for routine table metadata operations.
    - >
      It also shows the maturation of Apache Iceberg beyond its reference Java library:
      the same table format is represented by dedicated Go docs, releases, and a
      Homebrew formula.
  project-history:
    - >
      The CLI inherits its significance from Apache Iceberg, the open table format
      originally developed at Netflix and contributed to the Apache Software Foundation
      in 2018. Iceberg's format made table metadata, snapshots, schema evolution, hidden
      partitioning, and multi-engine access central to data-lake operations.
    - >
      The Go implementation made Iceberg usable in Go services and small operational
      tools without requiring a JVM. Its CLI documentation explicitly says the command
      is built from `./cmd/iceberg` and that its usage is similar to PyIceberg's CLI,
      placing it in the growing family of non-Java Iceberg implementations.
  related-projects:
    - >
      Apache Iceberg is the table format and Java reference implementation behind the
      ecosystem.
    - >
      PyIceberg is the Python implementation whose CLI behavior is referenced by the Go
      CLI documentation.
    - >
      Apache Iceberg Rust and C++ are sibling non-Java implementations listed by the
      Apache Iceberg documentation.
  sources:
    - https://formulae.brew.sh/formula/iceberg-cli
    - https://github.com/apache/iceberg-go
    - https://github.com/apache/iceberg-go/releases
    - https://go.iceberg.apache.org/cli.html
    - https://iceberg.apache.org/
    - https://news.apache.org/foundation/entry/asf-project-spotlight-apache-iceberg
  summary:
    - >
      Apache Iceberg CLI is the command-line program built from Apache Iceberg Go. It
      gives developers a local `iceberg` executable for catalog inspection, namespace
      and table operations, snapshot maintenance, rollback, tagging, branch work, and
      JSON-friendly automation.
  timeline:
    - '2018: Iceberg was contributed to the Apache Software Foundation.'
    - '2020: Apache Iceberg graduated as an Apache top-level project.'
    - '2024: Apache Iceberg Go began publishing 0.x releases for the Go implementation.'
    - >
      2026: The Go CLI documentation covers catalog flags, config files, maintenance
      commands, refs, branches, tags, and JSON automation.
  usage:
    - >
      Typical use starts with a REST, Glue, Hive, or Hadoop catalog URI, optionally read
      from `~/.iceberg-go.yaml`. Commands cover listing namespaces, creating and
      describing tables, inspecting snapshots and refs, expiring snapshots, cleaning
      orphan files, rolling back tables, upgrading table format versions, and emitting
      JSON for downstream tooling.
    - >
      The CLI is useful as a small operational companion to larger engines such as
      Spark, Flink, Trino, and Hive rather than as the primary compute engine for
      queries.
related-packages:
  - id: brew:duckdb
    reason: >
      DuckDB's official Iceberg extension can query table files directly or attach an
      Iceberg REST catalog for reads and writes, complementing the CLI's metadata
      inspection and maintenance commands.
    rel: adjacent_workflow
    sources:
      - https://duckdb.org/docs/stable/core_extensions/iceberg/overview
      - https://go.iceberg.apache.org/cli.html
  - id: brew:trino
    reason: >
      Trino's Iceberg connector provides distributed SQL over Iceberg tables and
      supported catalogs, while the CLI supplies lightweight catalog inspection and
      operational maintenance.
    rel: adjacent_workflow
    sources:
      - https://trino.io/docs/current/connector/iceberg.html
      - https://go.iceberg.apache.org/cli.html
  - id: brew:apache-spark
    reason: >
      Apache Iceberg recommends Spark as its most feature-rich compute engine, making
      Spark the query and data-processing companion to the CLI's catalog and metadata
      administration.
    rel: adjacent_workflow
    sources:
      - https://iceberg.apache.org/docs/latest/spark-getting-started/
      - https://go.iceberg.apache.org/cli.html
