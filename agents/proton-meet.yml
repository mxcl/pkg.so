history:
  adoption-history:
    - >
      At launch, Proton made Meet available through web, desktop, and mobile clients.
      Guests can join from an invitation link without an account, while signed-in users
      can create recurring rooms, schedule calls, and connect meetings with Proton
      Calendar.
  package-nerd-significance:
    - >
      Proton Meet brings Messaging Layer Security-based end-to-end encryption to a
      mainstream-style conferencing client. The desktop application is represented in
      Proton's public GPL-licensed WebClients monorepo, making it relevant to users who
      value inspectable clients and privacy-focused replacements for proprietary meeting
      software.
  project-history:
    - >
      Proton launched Proton Meet on March 31, 2026 as an end-to-end encrypted
      video-conferencing service for personal and business conversations. The service
      uses Messaging Layer Security for call media, screen shares, and meeting chat and
      integrates scheduling with Proton Calendar as well as external calendars.
  related-projects:
    - Proton Calendar
    - Proton Mail
    - Proton Drive
    - Proton Workspace
  sources:
    - 'Official desktop guide: https://proton.me/support/meet-desktop'
    - 'Official getting-started guide: https://proton.me/support/meet-get-started'
    - 'Official launch announcement: https://proton.me/business/blog/introducing-proton-meet'
    - 'Official source monorepo: https://github.com/ProtonMail/WebClients'
  summary:
    - >
      Proton Meet is Proton's end-to-end encrypted video-conferencing service. Its
      desktop client supports hosting and joining calls, reusable rooms, scheduling,
      screen sharing, chat, moderation, and recording on eligible plans.
  timeline:
    - '2026-03-31: Proton Meet launched'
  usage:
    - >
      A guest can open a Meet link and join without a Proton Account. Signed-in users
      can start instant calls, schedule meetings, create reusable rooms, and manage
      upcoming calls; participants can share screens, chat, react, and configure audio
      and video devices.
