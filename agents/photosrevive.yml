history:
  adoption-history:
    - >
      NeededApps expanded PhotosRevive beyond its standalone Mac distribution with Mac
      App Store and mobile editions for iPhone and iPad. A Lite edition provides a
      lower-friction App Store entry point.
  package-nerd-significance:
    - >
      PhotosRevive is representative of consumer machine-learning applications packaged
      as conventional native Mac software. It performs its core inference offline, an
      important distinction for users processing private family photographs.
  project-history:
    - >
      NeededApps developed PhotosRevive to automate colorization of old black-and-white
      photographs while retaining a manual mode for supplying corrective colour hints.
    - >
      Later development added batch processing, new colorization engines, Apple Photos
      integration, photo-library browsing, metadata preservation, Continuity Camera
      scanning, and compatibility updates for newer macOS releases.
  related-projects:
    - Apple Photos can invoke the bundled PhotosRevive editing extension.
    - PhotosRevive editions are also available for iPhone and iPad.
  sources:
    - https://neededapps.com/photosrevive/
    - https://neededapps.com/resources/photosrevive/presskit/
    - https://neededapps.com/resources/photosrevive/versions/
  summary:
    - >
      PhotosRevive is a NeededApps application that uses on-device artificial
      intelligence to colorize black-and-white photographs automatically, with optional
      manual corrections.
  timeline:
    - >
      Major update: Added two new colorization engines, batch processing, manual
      colorization, and deeper Apple Photos integration.
    - >
      Subsequent updates: Added metadata preservation, Continuity Camera scanning,
      in-place replacement options, and continuing macOS compatibility work.
  usage:
    - >
      Users import an image from Finder or Photos, or scan a print from another Apple
      device, then run automatic colorization and optionally refine the output with
      colour points and image adjustments.
    - >
      The included model operates without an internet connection, keeping source
      photographs on the user's device. A Photos extension supports colorization from
      within Apple's photo library application.
