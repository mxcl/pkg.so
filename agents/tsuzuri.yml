id: brew:tsuzuri
display-name: Tsuzuri
repo: null
docs:
  - https://github.com/jaisuriya-11/tsuzuri#readme
config-file-location:
  linux:
    - ~/.config/tsuzuri/config.json
  macos:
    - ~/Library/Application Support/tsuzuri/config.json
  windows:
    - '%APPDATA%\tsuzuri\config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Tsuzuri is distributed as a standalone binary and through Homebrew according to
      the supplied package metadata. Its plain-file design also lets users combine it
      with Git or an existing file-synchronization tool.
  package-nerd-significance:
    - >
      Tsuzuri combines the portability of Markdown and a single binary with notebook
      features normally associated with graphical knowledge-management applications,
      making it attractive to terminal-centric users who avoid proprietary note
      databases.
  project-history:
    - >
      Tsuzuri was developed as a block-oriented Markdown notebook for the terminal. It
      uses ordinary Markdown files while adding modal editing, live previews, links and
      backlinks, graph views, boards, calendars, diagrams, equations, themes, and PDF
      export.
  related-projects:
    - Markdown
    - Bubble Tea
    - Lip Gloss
    - Mermaid
  sources:
    - https://github.com/jaisuriya-11/tsuzuri
    - source_facts.package-manager
  summary:
    - >
      Tsuzuri is a terminal notebook and knowledge workspace that keeps notes as plain
      Markdown files.
  timeline:
    - >
      Current generation: Distributed as a cross-platform single binary with Markdown
      editing, visual notebook blocks, graph navigation, custom themes, and PDF export.
  usage:
    - >
      Users start Tsuzuri inside a directory of Markdown notes or select one with
      `--dir`. Notes remain editable by other tools, while Tsuzuri supplies a file
      explorer, modal editor, preview, wiki links, structured blocks, and export
      commands.
tags:
  - cli
  - knowledge-base
  - markdown
  - notes
  - plain-text
  - productivity
  - tui
provenance:
  category-sources:
    - https://github.com/jaisuriya-11/tsuzuri
    - source_facts.description
  display-name-sources:
