id: brew:gql
display-name: GitQL
repo: null
docs:
  - https://amrdeveloper.github.io/GQL
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GitQL entered package-manager listings as a Rust-era developer tool for exploring
      repository metadata without exporting it to a database. The supplied metadata
      lists Homebrew, MacPorts, Nix, Scoop, and winget package names.
    - >
      The official README also links related SDK-based tools, showing adoption of the
      query engine idea beyond Git data: LLQL, ClangQL, FileQL, and PyQL.
  package-nerd-significance:
    - >
      GitQL sits in the same package-manager niche as `jq`, `sqlite-utils`, and other
      exploratory CLI tools: it gives maintainers and developers an ad hoc query surface
      over data they already have locally.
    - >
      Its packaging across desktop package managers matters because Git repositories are
      local working-set data; installing a single CLI is simpler than standing up an
      indexed service just to ask a one-off history question.
  project-history:
    - >
      The repository history begins on 2023-06-02 with commits implementing the base
      structure and early SELECT, LIMIT, and OFFSET statements. The README describes
      GitQL as a tool built on the GitQL SDK for SQL-like queries over local Git
      repositories.
    - >
      Over time the project expanded from a Git-history query CLI into a reusable SDK
      with customizable schema, data provider, standard library, type system, value
      system, and component assembly documentation.
  related-projects:
    - LLQL applies the GitQL SDK idea to LLVM IR/BC.
    - ClangQL applies SQL-like querying to C and C++ source code files.
    - FileQL applies it to file-system metadata.
    - PyQL applies it to Python source code files.
  sources:
    - https://amrdeveloper.github.io/GQL
    - https://amrdeveloper.github.io/GQL/setup
    - https://github.com/AmrDeveloper/GQL
    - https://github.com/AmrDeveloper/GQL/discussions/100
  summary:
    - >
      GitQL is a SQL-like query language and CLI for querying local `.git` data. The
      project also exposes the GitQL SDK, an in-memory query engine that can be adapted
      to other data sources.
  timeline:
    - '2023-06-02: Repository history begins with the first GitQL commits.'
    - '2023: README license copyright names Amr Hesham.'
    - >
      2024-05-18: Project discussion for release 0.19.0 records parser, type-checker,
      and function work.
    - >
      2025: README copyright range extends through 2025 and lists SDK-based related
      tools including PyQL.
    - '2026-03-09: Repository history records version and dependency update work.'
  usage:
    - >
      Users run SQL-like statements against tables such as commits, branches, refs,
      tags, and diff changes. README examples include grouping commits by author,
      filtering refs, ordering branches, and aggregating file-change counts.
    - >
      The SDK use case is broader: developers can define a schema and provider for a
      different source of data while reusing GitQL's parser, type system, functions, and
      query execution pieces.
related-packages:
  - id: brew:clangql
    reason: >
      ClangQL uses the GitQL SDK to query C and C++ program structure, complementing
      GitQL when an investigation needs source-code semantics as well as repository
      history.
    rel: adjacent_workflow
    sources:
      - https://github.com/AmrDeveloper/GQL
      - https://github.com/AmrDeveloper/ClangQL
  - id: brew:fileql
    reason: >
      FileQL uses the GitQL SDK to query local filesystem metadata, making it a useful
      companion when repository analysis also needs SQL-style inspection of files and
      directories.
    rel: adjacent_workflow
    sources:
      - https://github.com/AmrDeveloper/GQL
      - https://github.com/AmrDeveloper/FileQL
