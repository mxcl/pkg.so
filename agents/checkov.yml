history:
  adoption-history:
    - >
      Checkov was first uploaded to PyPI in December 2019 and was still publishing
      frequent 3.x releases in June 2026. The official README documents installation
      through pip, Homebrew, Docker, and upgrades through pip or brew.
    - >
      Docker Hub metadata for bridgecrew/checkov showed more than 22 million pulls by
      June 2026, and the GitHub repository metadata showed thousands of stars,
      indicating adoption well beyond niche use. In 2021, Palo Alto Networks announced
      completion of its Bridgecrew acquisition, after which the README and docs
      positioned Checkov as part of Prisma Cloud Application Security.
  package-nerd-significance:
    - >
      Checkov is package-nerd significant because it is a high-churn Python security CLI
      with multiple distribution channels, a large policy corpus, Docker images,
      Homebrew packaging, PyPI releases, and enterprise integration pressure. It shows
      how cloud-security tooling moved from SaaS dashboards into developer workstation
      and CI packages.
    - >
      Its packaging story also reflects IaC's growth: a single command-line package
      became a front door for scanning Terraform, Kubernetes, Docker, CI configuration,
      secrets, and SCA inputs.
  project-history:
    - >
      The bridgecrewio/checkov repository was created in November 2019. The official
      README describes Checkov as a static code analysis tool for IaC and software
      composition analysis, maintained by Prisma Cloud and able to detect cloud
      misconfigurations and vulnerabilities during build time.
    - >
      Checkov expanded from Terraform-oriented misconfiguration scanning into a broader
      scanner for Terraform plans, CloudFormation, AWS SAM, Kubernetes, Helm, Kustomize,
      Dockerfiles, Serverless, Bicep, ARM templates, OpenAPI, OpenTofu, CI pipelines,
      container images, and open source packages.
  related-projects:
    - >
      Prisma Cloud Application Security is the commercial platform integration
      documented by Checkov.
    - >
      Terraform, OpenTofu, Kubernetes, CloudFormation, Helm, Docker, CycloneDX, and
      SARIF are major adjacent ecosystems and formats supported by Checkov.
  sources:
    - https://github.com/bridgecrewio/checkov
    - https://www.checkov.io/
    - https://github.com/bridgecrewio/checkov/releases
    - https://pypi.org/project/checkov/
    - https://hub.docker.com/r/bridgecrew/checkov
    - >
      https://www.paloaltonetworks.com/company/press/2021/palo-alto-networks-completes-acquisition-of-bridgecrew
  summary:
    - >
      Checkov is an infrastructure-as-code static analysis tool created by Bridgecrew
      and maintained under Prisma Cloud. It became a major security package because it
      brought policy-as-code checks for Terraform, Kubernetes, CloudFormation,
      Dockerfiles, CI workflows, and related formats into a single installable CLI.
  timeline:
    - '2019: bridgecrewio/checkov repository created and first PyPI release uploaded.'
    - '2021: Palo Alto Networks completed its acquisition of Bridgecrew.'
    - '2026: Checkov 3.3.x releases published and Docker image updated.'
  usage:
    - >
      Typical CLI usage scans a directory, file, or Terraform plan JSON and emits
      findings with policy IDs, file paths, pass/fail status, and remediation links.
      Output formats include CLI, CycloneDX, JSON, JUnit XML, CSV, SARIF, and GitHub
      markdown.
    - >
      Teams commonly run Checkov locally, in CI, or in pull request workflows to block
      insecure infrastructure definitions before deployment. With a Prisma Cloud API
      key, the CLI can also use severity thresholds and platform-backed policy metadata.
related-packages:
  - id: brew:kics
    reason: >
      Choose KICS for a similarly broad infrastructure-as-code scanner when you prefer
      its explicitly query-oriented, customizable rules architecture and
      Checkmarx-supported workflow.
    rel: alternative
    sources:
      - https://www.checkov.io/
      - https://docs.kics.io/latest/
  - id: brew:trivy
    reason: >
      Choose Trivy when you want infrastructure misconfiguration checks combined with
      vulnerability and secret scanning for repositories, filesystems, and container
      images in one CLI.
    rel: alternative
    sources:
      - https://github.com/bridgecrewio/checkov
      - https://trivy.dev/docs/latest/scanner/misconfiguration/
