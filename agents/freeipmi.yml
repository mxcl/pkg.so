id: brew:freeipmi
display-name: GNU FreeIPMI
repo: https://git.savannah.gnu.org/git/freeipmi.git
docs:
  - https://www.gnu.org/software/freeipmi/documentation.html
  - https://www.gnu.org/software/freeipmi
  - https://www.gnu.org/software/freeipmi/freeipmi-faq.html
config-file-location:
  unix:
    - /etc/freeipmi/freeipmi.conf
credentials-file-location:
  unix:
    - /etc/freeipmi/freeipmi.conf
history:
  adoption-history:
    - >
      FreeIPMI is widely packaged because IPMI is common in servers, clusters, and HPC
      environments. The supplied package facts list Alpine, Homebrew, Debian, Fedora,
      MacPorts, Nix, Arch, Ubuntu, and openSUSE packages, indicating broad Linux and
      Unix administrator adoption.
  package-nerd-significance:
    - >
      FreeIPMI is significant because it turns a hardware-management protocol into a
      Unix toolbox. For package maintainers it is the kind of system package where
      manpages, capabilities, library ABI, optional drivers, and dozens of executable
      names matter more than a single user-facing app.
  project-history:
    - >
      The GNU FreeIPMI project documents support for IPMI 1.5 and 2.0 style hardware
      management. Its source and release history are hosted through GNU/Savannah
      infrastructure, with many small command-line programs for chassis control, sensor
      inspection, SEL logs, FRU data, raw IPMI commands, console access, and monitoring.
  related-projects:
    - >
      Related projects and interfaces include IPMI, BMC firmware, RMCP/RMCP+, DCMI
      tooling, ipmiconsole, ipmidetect, and cluster monitoring stacks that consume
      sensor and power-control data.
  sources:
    - https://ftp.gnu.org/gnu/freeipmi/
    - https://git.savannah.gnu.org/git/freeipmi.git
    - https://www.gnu.org/software/freeipmi
    - https://www.gnu.org/software/freeipmi/documentation.html
    - https://www.gnu.org/software/freeipmi/freeipmi-faq.html
  summary:
    - >
      GNU FreeIPMI is a suite of in-band and out-of-band IPMI tools and libraries for
      managing Baseboard Management Controllers and other platform-management hardware.
      It is packaged as a command-heavy system administration toolkit rather than a
      single daemon.
  timeline:
    - '2009: GNU FTP lists FreeIPMI 0.7.5 as an early archived release.'
    - '2011: GNU FTP lists FreeIPMI 1.0.x releases.'
    - '2020s: FreeIPMI 1.6.x releases continued in the GNU archive.'
    - >
      2020s: Distribution packages kept the tool suite available across major Unix-like
      systems.
  usage:
    - >
      Administrators use tools such as ipmi-sensors, ipmi-power, ipmi-chassis, ipmi-sel,
      ipmi-fru, ipmi-raw, bmc-config, bmc-info, and ipmiconsole for hardware inventory,
      monitoring, remote power control, and BMC configuration. Packagers must expose
      many small utilities and keep library/tool compatibility aligned.
related-packages:
  - id: brew:ipmitool
    reason: >
      Choose IPMItool for a compact, widely recognized general-purpose IPMI command;
      choose FreeIPMI for its broader suite of specialized tools, libraries, monitoring,
      discovery, and cluster-oriented capabilities.
    rel: alternative
    sources:
      - https://codeberg.org/IPMITool/ipmitool
      - https://www.gnu.org/software/freeipmi/
  - id: brew:conman
    reason: >
      ConMan directly uses FreeIPMI's libipmiconsole to provide managed IPMI
      Serial-over-LAN console sessions and logging.
    rel: adjacent_workflow
    sources:
      - https://github.com/dun/conman#readme
      - https://www.gnu.org/software/freeipmi/freeipmi-faq.html
