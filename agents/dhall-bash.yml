id: brew:dhall-bash
display-name: dhall-bash
repo: https://github.com/dhall-lang/dhall-haskell
docs:
  - https://docs.dhall-lang.org/
  - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-bash
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Dhall's official integration guide frames Bash output as one of the external
      executable paths for projects that do not read Dhall directly. The supplied
      package facts show dhall-bash packaged by Homebrew, Nix, and Arch, which fits its
      niche as an optional companion command rather than the default Dhall entry point.
  package-nerd-significance:
    - >
      dhall-bash matters to package nerds because it captures a recurring packaging
      pattern: a language ecosystem grows small format-specific executables so package
      managers can expose only the integration a user needs. It lets shell-heavy
      deployments consume typed configuration without pulling an application into a
      Dhall binding.
  project-history:
    - >
      The dhall-haskell repository lists dhall-bash as one of the packages maintained in
      the main Haskell implementation tree. Its package README describes a Dhall-to-Bash
      compiler that marshals Dhall values into Bash scripts, with support focused on
      primitive values, lists, optional values, and records from normalized expressions.
  related-projects:
    - >
      dhall-json, dhall-yaml, dhall-toml, dhall-nix, and dhall-lsp-server are sibling
      packages in dhall-haskell. The language-independent dhall-lang repository defines
      the shared standard and documentation.
  sources:
    - https://github.com/dhall-lang/dhall-haskell
    - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-bash
    - https://docs.dhall-lang.org/howtos/How-to-integrate-Dhall.html
    - https://docs.dhall-lang.org/discussions/Dhall-in-production.html
    - https://api.github.com/repos/dhall-lang/dhall-haskell/releases?per_page=100
  summary:
    - >
      dhall-bash is the Dhall ecosystem's bridge from typed, normalizing configuration
      expressions into shell-friendly values. It exists for the corner of operations
      culture where Bash remains the glue, but users still want Dhall's type checking
      and import discipline before values enter a script.
  timeline:
    - '2017: dhall-haskell public releases included the multi-package Dhall toolchain.'
    - >
      2026: The official docs still present Bash generation as an external executable
      integration path.
  usage:
    - >
      Users pipe or redirect Dhall expressions into dhall-to-bash, optionally asking it
      to emit Bash declarations. The official README examples show scalar output,
      readonly variable declarations, arrays, and associative arrays that can be
      evaluated by a shell script.
related-packages:
  - id: brew:dhall
    reason: >
      Use the core Dhall CLI to format, type-check, normalize, and freeze configuration
      while authoring expressions that dhall-to-bash will compile for shell consumption.
    rel: adjacent_workflow
    sources:
      - https://docs.dhall-lang.org/howtos/How-to-integrate-Dhall.html
      - https://github.com/dhall-lang/dhall-haskell
  - id: brew:dhall-lsp-server
    reason: >
      Use dhall-lsp-server while editing the Dhall source later converted to Bash to
      obtain language-aware editor support.
    rel: adjacent_workflow
    sources:
      - https://docs.dhall-lang.org/howtos/Text-editor-configuration.html
      - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-lsp-server
