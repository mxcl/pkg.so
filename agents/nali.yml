id: brew:nali
display-name: nali
repo: null
docs:
  - https://github.com/zu1k/nali#readme
config-file-location:
  unix:
    - $NALI_CONFIG_HOME/config.yaml
    - $XDG_CONFIG_HOME/nali/config.yaml
    - $NALI_HOME/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      nali has a visibly stronger GitHub footprint than its Homebrew install count
      suggests. Repository metadata consulted on 2026-07-01 showed 4,095 stars and 370
      forks, while the Homebrew formula listed 218 installs over the prior 365 days.
    - >
      The adoption pattern is regional and operator-focused: it is useful for network
      debugging, DNS/CDN inspection, traceroute or dig/nslookup annotation, and log
      enrichment, especially for users who want offline lookups and Chinese-language
      network database support.
  package-nerd-significance:
    - >
      nali is a neat example of a packaged offline-data CLI: the executable is small,
      the value comes from data-provider support and update workflows, and the Unix
      pipeline behavior makes it compose with ordinary diagnostics.
  project-history:
    - >
      The GitHub repository was created on 2020-07-17. Its README describes Nali as an
      offline terminal tool for querying IP geographic information and CDN providers,
      with support for multiple data sources such as Chunzhen/QQWry, ZX IPv6, GeoIP2,
      IPIP, ip2region, DB-IP, and IP2Location DB3 Lite.
    - >
      The 0.8 line in late 2023 added JSON output and self-update work in v0.8.0,
      followed by v0.8.1 on 2023-12-11 with a fix recommended for v0.8.0 users and
      country-code output for GeoIP JSON.
  related-projects:
    - QQWry/Chunzhen IP database
    - GeoIP2
    - ip2region
    - NextTrace
  sources:
    - https://api.github.com/repos/zu1k/nali
    - https://api.github.com/repos/zu1k/nali/releases?per_page=5
    - https://formulae.brew.sh/formula/nali
    - https://github.com/zu1k/nali
  summary:
    - >
      nali is a Go terminal utility for annotating IP addresses and CDN hostnames with
      offline geographic and provider information.
  timeline:
    - '2020-07-17: GitHub repository created.'
    - '2023-10-02: v0.8.0 release adds JSON output and self-update work.'
    - >
      2023-12-11: v0.8.1 release fixes v0.8.0 issues and adds country-code output for
      GeoIP JSON.
    - >
      2026-07-01: Homebrew Formulae page listed version 0.8.1 and 218 installs over the
      prior 365 days.
  usage:
    - >
      The README demonstrates direct lookup (`nali 1.2.3.4`), pipe usage (`echo IP
      6.6.6.6 | nali`), interactive lookup, and combining it with `dig` or `nslookup` so
      resolved IPs and CNAMEs get annotated inline. The help output includes an `update`
      command for refreshing QQWry, ZX IPv6, ip2region, and CDN data.
    - >
      Package nerds use nali as a filter: run a networking command, pipe the output
      through nali, and get human-readable IP/CDN hints without sending every lookup to
      an online API.
related-packages:
  - id: brew:bind
    reason: >
      BIND supplies the `dig` DNS utility whose output Nali's official README pipes
      through `nali` for inline IP and CDN annotation.
    rel: adjacent_workflow
    sources:
      - https://github.com/zu1k/nali/blob/master/README_en.md
      - https://bind9.readthedocs.io/en/latest/manpages.html
