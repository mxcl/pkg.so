history:
  adoption-history:
    - >
      glyph's adoption signals are modest but visible for a young media CLI: repository
      metadata shows hundreds of stars, Homebrew packages it, and a Windows package
      entry is listed in the input data. That suggests interest from users who want a
      readily installed ASCII-media converter rather than a library platform.
  package-nerd-significance:
    - >
      glyph is package-nerd interesting because it combines a modern Zig build with a
      classic terminal-art task and FFmpeg media output. The package value is practical:
      install one small CLI, convert an image or video, and leave without writing a
      script around lower-level media libraries.
  project-history:
    - >
      The public repository was created in 2024 under the `seatedro` GitHub account. The
      README describes the project as a modern ASCII renderer that can build with Zig,
      optionally compile FFmpeg support, and output terminal renderings, text files,
      images, GIFs, or videos.
    - >
      Development centers on media conversion features rather than a large ecosystem:
      color output, brightness and contrast adjustment, edge detection, custom character
      sets, dithering, pixel mode, block symbols, and FFmpeg-backed software or hardware
      encoders.
  related-projects:
    - FFmpeg provides the media decoding and encoding context described by the README.
    - Zig is the implementation and build language.
    - >
      Homebrew and Windows package entries make the CLI easier to install for media-art
      workflows.
  sources:
    - https://api.github.com/repos/seatedro/glyph
    - https://formulae.brew.sh/formula/glyph
    - https://github.com/seatedro/glyph
    - https://raw.githubusercontent.com/seatedro/glyph/main/readme.md
  summary:
    - >
      glyph is a Zig command-line renderer that converts images and videos into ASCII
      art, either in a terminal or as saved media files. Its public history is short, so
      the strongest source-backed account is its repository metadata and
      README-documented feature set.
  timeline:
    - '2024: Public GitHub repository created.'
    - '2024: README documented Homebrew installation and Zig source builds.'
    - >
      Later development: README documented FFmpeg-backed video encoding, dithering,
      pixel mode, and terminal rendering options.
  usage:
    - >
      Practitioners use `glyph -i input.jpg -o output.png` for image conversion, omit
      `--output` for terminal rendering, save `.txt` output for plain ASCII text, and
      pass video files to produce MP4 or GIF output. Options cover color, scaling, edge
      detection, dithering, custom character ramps, block size, audio retention, and
      codec selection.
    - >
      The README's FFmpeg section documents software encoders such as x264 and x265,
      NVIDIA NVENC on Windows and Linux, and VideoToolbox on macOS, making the tool
      useful for both quick terminal previews and exported ASCII-video artifacts.
related-packages:
  - id: brew:chafa
    reason: >
      Choose Chafa for highly portable terminal graphics with ANSI, Unicode, sixel,
      Kitty, iTerm2, and animated-image support; choose glyph when saved ASCII-rendered
      images or FFmpeg-backed video output is the priority.
    rel: alternative
    sources:
      - https://github.com/seatedro/glyph
      - https://github.com/hpjansson/chafa
      - https://hpjansson.org/chafa/
  - id: brew:jp2a
    reason: >
      Choose jp2a for a mature, lightweight image-to-ASCII workflow supporting JPEG,
      PNG, and WebP; glyph additionally handles video, GIF output, pixel-mode rendering,
      and codec selection.
    rel: alternative
    sources:
      - https://github.com/seatedro/glyph
      - https://github.com/Talinx/jp2a
