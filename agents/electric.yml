history:
  adoption-history:
    - >
      Electric's adoption story is tied to production local-first and real-time
      workloads rather than traditional database administration. The 1.0 announcement
      cites production users, managed Electric Cloud, open-source users, and workloads
      that process large volumes of sync traffic.
    - >
      The project has also broadened through integrations and examples: the official
      docs list TypeScript clients, React integration, framework integrations,
      deployment guides, demos, and the related PGlite project.
  package-nerd-significance:
    - >
      Electric is package-nerd interesting because it packages database synchronization
      as a developer-service CLI/runtime rather than a framework-only library. It sits
      at the intersection of Postgres, local-first apps, HTTP APIs, client packages, and
      deployment tooling.
  project-history:
    - >
      The electric-sql/electric repository was created in June 2022. The project grew
      around the local-first application problem: keeping local UI state fast while
      retaining Postgres as the source database.
    - >
      Electric's own 1.0 release notes describe a major 2024 rebuild that made the sync
      engine simpler, faster, more reliable, and more scalable. The project reached beta
      in December 2024 and then announced 1.0 general availability in March 2025 with
      stable APIs for the core sync service.
  related-projects:
    - >
      Electric is related to Postgres logical replication, PGlite, TanStack
      integrations, Phoenix integrations, local-first data libraries, and real-time sync
      systems such as Replicache or custom WebSocket fan-out services.
  sources:
    - https://github.com/electric-sql/electric
    - https://raw.githubusercontent.com/electric-sql/electric/main/README.md
    - https://electric-sql.com/docs
    - https://electric-sql.com/blog/2025/03/17/electricsql-1.0-released
    - https://api.github.com/repos/electric-sql/electric
  summary:
    - >
      Electric is an open-source Postgres sync engine. It focuses on syncing data out of
      Postgres into local clients over HTTP, using Shapes for partial replication and
      client libraries or framework integrations for consumption.
  timeline:
    - '2022: GitHub repository created.'
    - '2024: Electric rebuilt around a simpler, faster sync engine.'
    - '2024: Beta announced with production users and updated docs.'
    - '2025: Electric 1.0 released with stable sync service APIs.'
  usage:
    - >
      A typical Electric setup runs the sync service in front of a Postgres database
      with logical replication enabled and a `DATABASE_URL`. Clients consume the HTTP
      API directly or through libraries such as the TypeScript client and React hooks.
    - >
      Developers use Electric when they want local-first or real-time application
      behavior without writing their own fan-out, partial replication, and data delivery
      layer. The README highlights Shapes as the primitive for selecting the subset of
      Postgres data to sync.
