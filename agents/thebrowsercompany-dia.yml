history:
  adoption-history:
    - >
      Dia progressed from an invitation-based beta to general availability for macOS
      with version 1.0.1 in October 2025.
  package-nerd-significance:
    - >
      Dia represents the AI-browser category in desktop package catalogs: a
      Chromium-based browser that integrates conversational assistance, reusable Skills,
      and contextual Memory directly into browsing.
  project-history:
    - >
      The Browser Company developed Dia as an AI-centered successor in its browser
      product line. Official 2025 changelogs document its beta period, rapid weekly
      releases, and transition to general availability.
  related-projects:
    - >
      Arc is an earlier browser from The Browser Company and shares some interaction
      concepts referenced in Dia's official release notes.
    - Chromium supplies Dia's underlying browser engine.
  sources:
    - https://www.diabrowser.com/changelog/0-43-0
