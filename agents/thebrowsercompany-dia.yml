  summary:
    - >
      Dia is a macOS web browser from The Browser Company that combines Chromium
      browsing with integrated AI chat, Skills, and personalized Memory.
  timeline:
    - '2025-08: Dia remained in beta while adding built-in Skills and improved Memory.'
    - '2025-10-08: Dia 1.0.1 became generally available on macOS.'
  usage:
    - >
      Users browse normally while invoking chat against open pages, using reusable
      Skills, searching remembered context, and organizing work through tabs and split
      views.
