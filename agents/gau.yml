id: brew:gau
display-name: getallurls (gau)
repo: null
docs:
  - https://github.com/lc/gau#readme
config-file-location:
  unix:
    - ~/.gau.toml
  windows:
    - '%USERPROFILE%\.gau.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation options include `go install`, cloning and building from
      source, downloading GitHub release binaries, and Docker. The input curation also
      records Homebrew, MacPorts, and Nix package availability, showing the tool's
      spread through common security-tool package channels.
  package-nerd-significance:
    - >
      gau is package-nerd-significant because it turns multiple web-archive and
      threat-intelligence sources into a composable Unix-style CLI. Its short name also
      collides with an oh-my-zsh git alias, a small but memorable packaging and
      shell-environment wrinkle documented by the project.
  project-history:
    - >
      The project was created in February 2020 and reached a v1.0 release in April 2020.
      The README says gau was inspired by Tomnomnom's `waybackurls`, and the v2.0.4
      release in November 2021 introduced a rewrite with speed improvements, a new
      URLScan provider, configuration-file loading, new filters, and SOCKS5 proxy
      support.
  related-projects:
    - >
      gau is inspired by Tomnomnom's `waybackurls` and depends conceptually on
      AlienVault OTX, the Wayback Machine, Common Crawl, and URLScan as URL providers.
  sources:
    - https://github.com/lc/gau
    - https://github.com/lc/gau/releases
    - https://github.com/lc/gau/releases/tag/v2.0.4
  summary:
    - >
      getallurls, commonly packaged as `gau`, is a reconnaissance CLI that fetches known
      URLs for domains from AlienVault Open Threat Exchange, the Wayback Machine, Common
      Crawl, and URLScan. It is aimed at security researchers and bug bounty workflows
      that need historical and third-party URL discovery.
  timeline:
    - '2020: Public GitHub repository created.'
    - '2020: v1.0 released.'
    - >
      2021: v2.0.4 rewrite release added URLScan, config loading, filters, and SOCKS5
      proxy support.
    - '2024: v2.2.4 release published.'
  usage:
    - >
      gau accepts domains from arguments or stdin and can run with worker threads, write
      results to a file, filter by extensions, status codes, MIME types, date ranges,
      providers, and proxy settings, and output JSON. It automatically looks for
      `$HOME/.gau.toml` or `%USERPROFILE%\.gau.toml` unless an alternate config is
      supplied.
related-packages:
  - id: brew:httpx
    reason: >
      Pipe URLs discovered by gau into ProjectDiscovery httpx to probe which endpoints
      are reachable and collect HTTP metadata for the next reconnaissance stage.
    rel: adjacent_workflow
    sources:
      - https://github.com/lc/gau#readme
      - https://docs.projectdiscovery.io/tools/httpx/overview
  - id: brew:katana
    reason: >
      Use Katana alongside gau when active crawling of reachable applications is needed
      in addition to gau's archive- and intelligence-backed URL discovery.
    rel: adjacent_workflow
    sources:
      - https://github.com/lc/gau#readme
      - https://docs.projectdiscovery.io/tools/katana/overview
