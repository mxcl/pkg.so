history:
  adoption-history:
    - >
      Meta launched Muse in the United States through dedicated mobile apps, muse.ai,
      and WhatsApp. The initial service combines a free offering with subscription plans
      for heavier use.
  package-nerd-significance:
    - >
      The Homebrew cask packages an early consumer application from the emerging
      personal-agent category. Muse is notable because execution occurs in a dedicated
      cloud virtual machine rather than solely in the local desktop application, so
      there are no documented local configuration or credential files to curate.
  project-history:
    - >
      Meta introduced Muse as a personal AI agent designed to carry out tasks rather
      than only answer questions. Its launch architecture uses Muse Secure VM, an
      isolated computer with a browser, while a control system mediates actions that
      reach external services.
    - >
      The launch emphasized user approval for sensitive actions and isolated storage for
      connected-service credentials. Meta said a stronger Confidential VM design,
      encrypted with a user-held key, was planned for later in 2026.
  related-projects:
    - >
      Muse integrates with Meta's WhatsApp and uses the Muse Spark model and Muse Secure
      VM infrastructure. The launch also documents payment integration with Stripe Link
      and planned 1Password support.
  sources:
    - https://about.fb.com/news/2026/09/introducing-muse-personal-ai-agent/
    - https://muse.ai/
    - source_facts.applications
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      Muse is Meta's personal AI agent for handling tasks and projects and turning
      long-term goals into actionable plans.
  timeline:
    - '2026-09-08: Meta publicly introduces Muse.'
    - >
      2026-09: Muse begins rolling out in the United States on iOS, Android, muse.ai,
      and WhatsApp.
  usage:
    - >
      People give Muse tasks or goals through its app, website, or WhatsApp. It can plan
      work, operate a browser, fill forms, coordinate schedules, book travel, and
      prepare purchases, returning for approval before sensitive actions.
