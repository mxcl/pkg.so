history:
  adoption-history:
    - >
      MacGDBp provided Mac-based PHP developers with a focused alternative to debugging
      inside a full IDE. Its long-running official issue tracker records use across many
      PHP, Xdebug, and macOS generations, while later releases added compatibility for
      newer macOS releases and Apple Silicon.
  package-nerd-significance:
    - >
      MacGDBp is representative of the small native utilities that made dynamic-language
      debugging more approachable on classic Mac OS X. Its longevity also illustrates
      the maintenance burden carried by desktop developer tools as PHP, Xdebug, code
      signing, CPU architectures, and macOS security behavior evolved.
  project-history:
    - >
      Robert Sesek released MacGDBp through Blue Static in 2008 as the site's first Mac
      product. It implements a native macOS front end for Xdebug's DBGp protocol,
      providing breakpoints, stepping, source display, stack inspection, and variable
      inspection.
    - >
      MacGDBp 2.0 modernized the application around 2020 with a unified tabbed
      interface, transaction-aware debugger communication, symbolic breakpoints, and
      extensive internal refactoring. The 2.1 line subsequently added macOS Monterey and
      native Apple Silicon support.
  related-projects:
    - Xdebug supplies the remote PHP debugging facility and DBGp protocol used by MacGDBp.
    - PHP is the language runtime whose applications MacGDBp examines.
  sources:
    - 'Official Blue Static history: https://www.bluestatic.org/about/'
    - 'Official Blue Static product index: https://www.bluestatic.org/'
    - 'Official MacGDBp blog archive: https://www.bluestatic.org/blog/category/macgdbp/'
    - 'Official historical issue tracker: https://www.bluestatic.org/bugs/'
  summary:
    - >
      MacGDBp is a native macOS graphical client for interactively debugging PHP
      programs through Xdebug. It was introduced in 2008 and has been maintained across
      major changes in macOS and Mac hardware.
  timeline:
    - '2008: Blue Static released MacGDBp as its first Mac product.'
    - >
      2020: MacGDBp 2.0 introduced a unified interface, symbolic breakpoints, and a
      substantially refactored debugger core.
    - '2022: MacGDBp 2.1 added macOS Monterey compatibility and native Apple Silicon support.'
  usage:
    - >
      A developer enables and configures Xdebug for a local or remote PHP runtime,
      starts MacGDBp listening for a debugger connection, and then uses breakpoints,
      stepping, source views, the call stack, and variable inspection to examine a
      running request.
