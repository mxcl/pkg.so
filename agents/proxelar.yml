history:
  adoption-history:
    - >
      The project documents installation through Homebrew, winget, Cargo, containers,
      and release binaries. These establish distribution channels without demonstrating
      adoption scale.
  package-nerd-significance:
    - >
      Proxelar packages a Rust proxy engine and several interfaces into one executable,
      with an embeddable proxyapi library and Lua-based customization.
  project-history:
    - >
      The project is maintained under Emanuele Micheletti's account and presents itself
      as a local developer traffic-debugging tool.
  related-projects:
    - proxyapi; Tokio; hyper; rustls; mlua.
  sources:
    - '[Architecture documentation](https://proxelar.micheletti.io/#architecture)'
    - '[Official README](https://github.com/emanuele-em/proxelar#readme)'
  summary:
    - Proxelar is a scriptable HTTP, HTTPS, and WebSocket inspection proxy.
  timeline:
    - 'Project development: Provides terminal, TUI, browser, and headless API interfaces.'
  usage:
    - >
      Start proxelar, configure the client to use its proxy endpoint, and trust its
      generated local CA for HTTPS inspection. Lua hooks and rules can rewrite or mock
      traffic; sessions support capture reuse.
