credentials-file-location: null
history:
  adoption-history:
    - >
      Navicat for SQLite brought SQLite connectivity into the wider Navicat family and
      has been released for Windows, macOS, and Linux. It targets users who want
      Navicat's shared visual workflow for file-based SQLite databases.
  package-nerd-significance:
    - >
      The cask packages a commercial desktop alternative to SQLite's command-line shell
      and open-source SQLite browsers, useful to people who standardize on Navicat
      across several database engines.
  project-history:
    - >
      PremiumSoft introduced Navicat for SQLite in the Navicat 9 era in response to
      demand for graphical SQLite management. The launch also added SQLite connectivity
      to Navicat Premium.
  related-projects:
    - Navicat Premium
    - SQLite
    - Navicat for PostgreSQL
    - Navicat for SQL Server
  sources:
    - >
      https://www.navicat.com/en/company/press-2/162-navicat%E2%84%A2-version-9-is-released.html
    - https://www.navicat.com/en/products/navicat-for-sqlite
    - https://www.navicat.com/en/products/navicat-for-sqlite-release-note
  summary:
    - >
      Navicat for SQLite is PremiumSoft's proprietary graphical database administration
      and development client for SQLite.
  timeline:
    - >
      2010: Navicat 9 introduced Navicat for SQLite and added SQLite connectivity to
      Navicat Premium.
    - '2017: The version 12 release line added and refined encrypted SQLite-file support.'
    - '2026: Navicat distributes the current SQLite edition for Windows, macOS, and Linux.'
  usage:
    - >
      Typical work includes opening local SQLite databases, browsing and editing
      records, designing objects, running SQL, importing and exporting data,
      transferring or synchronizing data, and performing backup or restore operations.
