history:
  adoption-history:
    - >
      TRAE CN is distributed as the Chinese-market edition of the TRAE desktop IDE. The
      official Chinese site provides native IDE downloads and positions the product
      around AI-assisted software-development workflows.
    - >
      Reliable official sources establish the product's availability and intended
      workflow but provide little durable public information about adoption milestones,
      so no broader adoption claims are made.
  package-nerd-significance:
    - >
      TRAE CN is notable as a region-specific AI IDE packaged separately from the
      international TRAE application. The separate cask lets macOS package users select
      the Chinese service and distribution channel explicitly.
    - >
      Like other AI-native editors, it packages a traditional code-editing environment
      together with conversational and agent-style development assistance, making
      account, service-region, and update-channel distinctions relevant to package
      management.
  project-history:
    - >
      TRAE presents its IDE as an AI-native development environment whose intelligent
      assistance is integrated directly into the coding workflow. The Chinese edition is
      distributed through trae.com.cn and is identified separately on macOS as TRAE CN.
    - >
      The official documentation has since emphasized increasingly autonomous
      agent-oriented development workflows, while the Chinese product site continues to
      present the native IDE as the core downloadable product.
  related-projects:
    - >
      TRAE CN is the Chinese-distribution counterpart to TRAE's international IDE and
      documentation ecosystem.
    - >
      Its product category overlaps with AI-assisted code editors, IDE copilots, and
      agentic software-engineering tools.
  sources:
    - https://docs.trae.ai/ide
    - https://www.trae.com.cn/
    - source_facts.description
    - source_facts.homepage
  summary:
    - >
      TRAE CN is the Chinese edition of TRAE's macOS AI-native integrated development
      environment. It combines code editing with AI assistance intended to improve
      development quality and efficiency.
  timeline:
    - >
      2025: The Chinese TRAE IDE was publicly distributed through the official
      trae.com.cn product channel.
    - >
      2026: Official TRAE documentation emphasized expanded agent-oriented development
      workflows.
  usage:
    - >
      Developers use TRAE CN as a desktop code editor and IDE with embedded AI
      assistance for understanding, producing, and modifying software projects.
    - >
      The CN package is appropriate for users who specifically need TRAE's Chinese
      distribution and service environment rather than its international desktop
      package.
