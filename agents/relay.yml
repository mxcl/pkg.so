history:
  adoption-history:
    - >
      Relay is a young application distributed through signed macOS releases and,
      according to the supplied input, Homebrew Cask. Its 0.x release series shows rapid
      iteration around dictation, annotations, capture history, automation, and LLM-tool
      integration.
  package-nerd-significance:
    - >
      Relay represents a newer class of native desktop utilities that package context
      for AI assistants rather than providing an AI model themselves. Its bundled native
      MCP server is especially relevant to tool-focused users because it exposes
      composed context to compatible coding assistants without requiring a separate
      Node.js runtime.
  project-history:
    - >
      Relay was developed as a native macOS menu-bar utility for turning voice notes and
      captured clipboard or screen content into structured Markdown prompts. During its
      early 0.x releases, it added persistent capture history, on-device speech
      features, screen annotation, automation URLs, and a bundled MCP bridge.
  related-projects:
    - Claude Code, documented as a consumer of Relay's MCP bridge.
    - >
      Apple Shortcuts, Siri, Raycast, and Alfred, which can invoke Relay through its URL
      scheme.
    - Model Context Protocol, used by Relay to expose composed context to external tools.
  sources:
    - https://github.com/msllrs/relay#readme
    - https://github.com/msllrs/relay/releases
    - source_facts.package-manager
  summary:
    - >
      Relay is a native macOS prompt-composition utility that combines dictation,
      clipboard captures, files, and annotated screenshots into context suitable for
      large-language-model workflows.
  timeline:
    - >
      2026: Relay's documented early 0.x series expands from prompt capture into
      annotations, persistent history, on-device speech features, automation, and a
      bundled MCP server.
  usage:
    - >
      Users dictate an explanation while Relay inserts captured material at the relevant
      points, then copy or paste the resulting Markdown prompt into an LLM. Optional
      integrations let automation tools control recording and let MCP clients retrieve
      or add context.
