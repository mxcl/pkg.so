id: brew:dbml-cli
display-name: DBML CLI
repo: https://github.com/holistics/dbml
docs:
  - https://dbml.dbdiagram.io/cli
  - https://dbml.dbdiagram.io/home
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Holistics reports that the original dbdiagram.io syntax reached more than 100,000
      diagrams created by 60,000 users before DBML was formalized, and the DBML site
      reported 2.5 million DBML docs and 1.4 million users across dbdiagram.io and
      dbdocs.io as of February 2025.
  package-nerd-significance:
    - >
      For package-manager users, dbml-cli is a compact bridge between schema-as-code
      workflows and visual/documentation tools: it exposes DBML as shell commands such
      as dbml2sql, sql2dbml, and db2dbml instead of tying the workflow to a hosted UI.
  project-history:
    - >
      DBML grew out of dbdiagram.io, which Holistics says it started in August 2018
      after failing to find a database-structure design tool it liked. The syntax behind
      dbdiagram.io was later separated into DBML after a year of real-world use.
  related-projects:
    - >
      DBML is tied to dbdiagram.io, dbdocs.io, RunSQL, and the @dbml/core JavaScript
      package, with community parsers and editor plugins listed by the official project.
  sources:
    - https://dbml.dbdiagram.io/home
    - https://dbml.dbdiagram.io/cli
    - https://github.com/holistics/dbml
  summary:
    - >
      DBML CLI is the command-line packaging of DBML, the open-source Database Markup
      Language maintained by Holistics for describing database schemas in a readable,
      database-agnostic DSL.
  timeline:
    - '2018: Holistics begins dbdiagram.io and the syntax that becomes DBML.'
    - '2019: DBML is formalized after a year of dbdiagram.io usage.'
    - '2025: Official DBML statistics report 2.5 million docs and 1.4 million users.'
  usage:
    - >
      The CLI converts DBML to SQL, SQL to DBML, and live database schemas to DBML,
      giving package users a local way to keep database diagrams, docs, and SQL DDL in a
      repo-friendly text format.
related-packages: []
