history:
  adoption-history:
    - >
      The project attracted users seeking a graphical layer over Claude Code and added
      packaged builds for macOS and Linux. Its feature set broadened beyond session
      browsing into custom agents, MCP server management, usage analytics, checkpoints,
      and CLAUDE.md editing.
  package-nerd-significance:
    - >
      opcode is an open-source Tauri desktop wrapper around an otherwise
      terminal-oriented AI coding workflow. It exposes Claude Code's local projects and
      sessions graphically while retaining the underlying CLI and ~/.claude data model,
      making the boundary between GUI package and command-line dependency especially
      relevant.
  project-history:
    - >
      The project was initially released under the name Claudia as an independent
      graphical companion for Claude Code. It was renamed opcode in its 0.2.0 release
      while retaining its focus on local session management, agents, and developer
      tooling.
    - >
      The application is independent of Anthropic and is implemented with a React and
      TypeScript frontend plus a Rust/Tauri backend.
  related-projects:
    - Claude Code
    - Model Context Protocol
    - Tauri
  sources:
    - https://github.com/winfunc/opcode#readme
    - https://github.com/winfunc/opcode/releases
    - https://opcode.sh/docs
  summary:
    - >
      opcode is an open-source desktop GUI and toolkit for managing Claude Code
      projects, sessions, custom agents, MCP servers, checkpoints, and usage data.
  timeline:
    - '2025-08-15: Initial 0.1.0 release was published under the Claudia name.'
    - '2025-08-31: Version 0.2.0 renamed Claudia to opcode and supplied macOS and Linux builds.'
  usage:
    - >
      opcode expects the Claude Code CLI to be installed and automatically detects the
      user's ~/.claude directory. Users can browse and resume project sessions,
      configure and run custom agents, inspect usage, manage MCP server definitions, and
      edit CLAUDE.md files from the graphical interface.
