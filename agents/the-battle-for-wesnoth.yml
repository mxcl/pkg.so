credentials-file-location: null
history:
  adoption-history:
    - >
      Wesnoth attracted a broad volunteer community after its 2003 conception, with
      contributors working on engine code, campaigns, artwork, music, translations,
      packaging, testing, and community management. Official distributions span Windows,
      macOS, Linux, mobile ports, Steam, itch.io, standalone installers, and Linux
      packaging systems.
  package-nerd-significance:
    - >
      Wesnoth is notable in package-manager culture as a substantial, cross-platform
      open-source game with a long-lived C++ engine, extensive data assets,
      localization, multiplayer infrastructure, and user-generated add-ons. Its
      packaging exercises concerns uncommon in small utilities, including large resource
      trees, platform-specific user-data paths, and compatibility across stable and
      development release lines.
    - >
      Its Wesnoth Markup Language and built-in add-on ecosystem also make the package
      more than a fixed game: installed users can create, install, and distribute
      campaigns, eras, maps, and multiplayer scenarios.
  project-history:
    - >
      The Battle for Wesnoth was conceived by David White in 2003 and developed by an
      international volunteer project. It grew into an open-source fantasy tactical
      strategy game supporting single-player campaigns, local and online multiplayer, a
      map editor, and extensive community-created content.
  related-projects:
    - Wesnoth Markup Language (WML)
    - wesnothd multiplayer server
    - Wesnoth add-ons server
  sources:
    - https://github.com/wesnoth/wesnoth
    - https://wiki.wesnoth.org/Create
    - https://wiki.wesnoth.org/Editingwesnoth
    - https://wiki.wesnoth.org/Project
  summary:
    - >
      The Battle for Wesnoth is an open-source, turn-based tactical strategy game with a
      high-fantasy setting, maintained by an international volunteer community.
  timeline:
    - '2003: David White conceived The Battle for Wesnoth.'
    - >
      2003 onward: A volunteer community expanded the engine, campaigns, artwork, music,
      translations, packaging, and online services.
    - >
      2010s–2020s: Distribution expanded across major desktop platforms, mobile ports,
      Steam, itch.io, app stores, and Linux package formats.
  usage:
    - >
      Players recruit and advance units across hex-based tactical battles in story
      campaigns, play local or online multiplayer matches, and use the map editor and
      add-on system to create or install new campaigns, eras, maps, and scenarios.
    - >
      On macOS, the official wiki documents a versioned user-data directory containing
      saved games, add-ons, editor files, caches, and the plaintext preferences file.
      The in-game version dialog exposes the effective paths.
