history:
  adoption-history:
    - >
      The original KeyTool GUI reportedly reached more than 2,000 downloads per month
      before evolving into KeyStore Explorer. The application later gained native
      installation options for Windows, macOS, and Linux/Unix.
    - >
      KSE returned to open-source distribution with version 5.0 in 2013. The project's
      2023 retrospective reports more than 100 features added across 18 releases during
      the following decade.
  package-nerd-significance:
    - >
      KSE gives Java and PKI users a graphical alternative to keytool, jarsigner, and
      assorted OpenSSL-style workflows. Its support for formats such as JKS, JCEKS, PKCS
      #12, BKS, UBER, BCFKS, PEM, and KDB makes it particularly useful when certificates
      and keys must move between ecosystems.
  project-history:
    - >
      Wayne Grant began the project as KeyTool GUI while learning Java, releasing
      version 1.0 in April 2002. It became the commercial KeyStore Explorer in May 2004
      and expanded beyond keytool parity into a broader cryptographic file and signing
      utility.
    - >
      Versions 3.0 through 3.3 modernized the interface and added cross-platform
      packaging. Kai Kramer subsequently took over the project, and version 5.0 restored
      it to open-source distribution under GPLv3 in October 2013.
  related-projects:
    - >
      Java keytool and jarsigner provide the command-line workflows KSE was designed to
      replace or complement.
    - Portecle emerged from the earlier open-source KeyTool GUI code.
    - >
      The application works with Java, OpenSSL, Microsoft, and other keystore and
      certificate formats.
  sources:
    - https://keystore-explorer.org/features.html
    - https://keystore-explorer.org/history/index.html
    - https://keystore-explorer.org/release50.html
  summary:
    - >
      KeyStore Explorer is a cross-platform graphical application for creating,
      inspecting, converting, and managing keystores, keys, certificates, certificate
      requests, and signatures.
  timeline:
    - '2002: KeyTool GUI 1.0 was released.'
    - '2004: The project became the commercial KeyStore Explorer.'
    - >
      2006–2009: The 3.x series introduced a multi-document interface and broader
      platform and format support.
    - >
      2013: KeyStore Explorer 5.0 returned the project to open-source distribution under
      GPLv3.
  usage:
    - >
      Users commonly open or create keystores, generate key pairs and CSRs, import CA
      replies and trusted certificates, convert keystore formats, inspect TLS endpoints,
      and sign or verify JAR files.
    - >
      The built-in password manager can retain keystore and entry passwords, but the
      official manual does not document a stable credentials-file path.
