history:
  adoption-history:
    - >
      By August 2012, TuneIn reported 40 million monthly active listeners, 70,000
      stations, two million on-demand programs, availability on more than 200 device
      platforms, and broadcaster relationships including CBS Radio Network and NPR.
      Later official materials described expansion into podcasts, live sports, connected
      cars, smart speakers, and other listening platforms.
    - >
      In 2026, official press material described TuneIn as Stingray's streaming-audio
      platform, continuing its combination of partner radio, sports, news, music,
      audiobooks, and podcasts.
  package-nerd-significance:
    - >
      TuneIn is a prominent example of an Internet-radio directory becoming a
      cross-platform audio aggregation service. For package-manager users, the desktop
      cask provides a native entry point to a catalog otherwise available across the
      web, mobile devices, cars, televisions, speakers, and digital assistants.
  project-history:
    - >
      TuneIn grew as a Palo Alto streaming-radio startup and by 2012 was presenting
      itself as a large global directory for live online radio. Its service subsequently
      broadened from station aggregation into podcasts, sports, news, music, audiobooks,
      owned channels, and premium programming.
  related-projects:
    - >
      TuneIn integrates content from terrestrial and Internet broadcasters, podcast
      publishers, sports organizations, and connected-device platforms rather than
      functioning as a standalone local media library.
  sources:
    - >
      Official 2012 growth announcement:
      https://tunein.com/press-release/tunein-hits-40-million-monthly-active-listeners-raises-16-million-in-funding/
    - >
      Official 2026 Stingray announcement:
      https://cms.tunein.com/press-release/stingray-and-just-for-laughs-team-up-to-launch-comedy-radio-channel-on-tunein/
    - 'Official about page: https://tunein.com/about/'
    - 'Official support site: https://help.tunein.com/en/support/home'
  summary:
    - >
      TuneIn is a global streaming-audio service aggregating live radio, sports, news,
      music, podcasts, and audiobooks across desktop, web, mobile, automotive, and
      connected-device platforms.
  timeline:
    - '2012: TuneIn reported 40 million monthly active listeners'
    - >
      2014: TuneIn reported more than 50 million monthly active users and over 100,000
      stations
    - "2026: Official releases described TuneIn as Stingray's streaming-audio platform"
  usage:
    - >
      Listeners search for and stream live stations, news, sports, music, podcasts, and
      other audio. Free and premium offerings differ, while the official support center
      documents accounts, subscriptions, mobile applications, automotive use, and
      broadcaster listings.
