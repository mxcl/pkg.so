    - path supplied with -env
credentials-file-location: null
history:
  adoption-history:
    - >
      goose became attractive to Go projects because it offers the same artifact as both
      a CLI and importable library. Its README documents installation with `go install`,
      Homebrew, and separate installation docs, while the package-manager facts show
      distribution through Homebrew, DNF, MacPorts, Nix, Scoop, and WinGet.
  package-nerd-significance:
    - >
      goose is significant in package-manager culture because it is a Go CLI whose
      usefulness depends on being easy to install in developer shells, containers, and
      CI images. It also packages database driver choices as build-time concerns through
      driver-exclusion tags, a very Go-flavored answer to binary size and dependency
      sprawl.
    - >
      For database-tool collectors, goose sits alongside migration tools such as
      golang-migrate, Flyway, Liquibase, Rails migrations, and Alembic, but keeps the
      Go-native option of writing migrations as Go functions.
  project-history:
    - >
      The pressly/goose repository was created in February 2016 and published a v1.0
      GitHub release in December 2016. The project developed around a familiar migration
      workflow: create, apply, roll back, inspect status, and track applied versions in
      a database table.
    - >
      By the v2 series, releases added features such as reset, logger support,
      configurable migration-table names, build tags for excluding drivers, and hybrid
      migration versioning. The v3 module path reflects the Go module era while
      preserving the command-line workflow.
  related-projects:
    - >
      The README relates goose to Go's database/sql ecosystem, embedded migrations via
      Go's embed package, and database engines such as Postgres, MySQL, SQLite, Spanner,
      ClickHouse, MSSQL, YDB, and Vertica.
  sources:
    - https://api.github.com/repos/pressly/goose
    - https://github.com/pressly/goose
    - https://github.com/pressly/goose#readme
    - https://github.com/pressly/goose/releases
    - https://pressly.github.io/goose/documentation
  summary:
    - >
      goose is Pressly's Go database migration tool, usable as both a CLI and a Go
      library. It manages database schema changes through incremental SQL migrations or
      Go migration functions.
  timeline:
    - '2016: GitHub repository created under pressly/goose.'
    - '2016: v1.0 release published on GitHub Releases.'
    - '2017: v2.0.0 release published, followed by reset and other command improvements.'
    - '2018: v2.4.0 release added hybrid migration versioning.'
    - '2020s: v3 module path used for Go module-aware installation and library imports.'
  usage:
    - >
      The standard workflow is to create timestamped or sequential migrations, run
      `goose up` to apply them, `goose down` or `down-to` to roll them back, and `goose
      status` or `version` to inspect state. Configuration can come from command-line
      driver and database-string arguments, environment variables, or `.env` files.
    - >
      The README lists support for databases including Postgres, MySQL, MariaDB, SQLite,
      Spanner, ClickHouse, MSSQL, YDB, Vertica, and more, making goose a cross-database
      migration layer for Go services.
related-packages:
  - id: brew:golang-migrate
    reason: >
      Choose golang-migrate for its URL-oriented source and database driver ecosystem;
      choose goose when Go migration functions, embedded migrations, or its `.env`
      workflow are a better fit.
    rel: alternative
    sources:
      - https://github.com/golang-migrate/migrate
      - https://github.com/pressly/goose#readme
  - id: brew:flyway
    reason: >
      Choose Flyway for JVM, Maven, Gradle, Docker, or Redgate database-delivery
      workflows; choose goose for a Go-native CLI and embeddable Go library.
    rel: alternative
    sources:
      - https://documentation.red-gate.com/flyway
      - https://github.com/pressly/goose#readme
  - id: brew:liquibase
    reason: >
      Choose Liquibase when you need changelog-driven database change management and
      explicit deployment or rollback governance; choose goose for incremental SQL files
      or Go functions.
    rel: alternative
    sources:
      - https://docs.liquibase.com/
      - https://github.com/liquibase/liquibase
      - https://github.com/pressly/goose#readme
