id: brew:felinks
display-name: felinks
repo: null
docs:
  - https://github.com/rkd77/elinks#readme
  - https://github.com/rkd77/elinks/tree/master/doc
config-file-location:
  unix:
    - ~/.config/elinks/elinks.conf
    - $XDG_CONFIG_HOME/elinks/elinks.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      ELinks has long been packaged as elinks across Linux distributions and other
      package collections, while Homebrew uses felinks for this maintained fork. The
      supplied metadata shows packaging in Alpine, Debian, Fedora, MacPorts, Nix, Arch,
      Scoop, Ubuntu, and openSUSE, consistent with a portable terminal-browser niche.
    - >
      Its adoption is sustained less by mainstream web browsing and more by terminal,
      SSH, recovery, accessibility, and automation use cases where a text-mode browser
      still fits.
  package-nerd-significance:
    - >
      felinks matters because it is a living branch of a classic terminal-browser
      family. For package nerds, it sits in the same lineage as lynx, Links, and w3m,
      but with a feature-heavy philosophy and a continued release cadence.
    - >
      It is also a case study in naming and continuity: the upstream repository is now
      elinks again, the executable is elinks, but some package managers retain felinks
      to identify the maintained fork lineage.
  project-history:
    - >
      The ELinks README gives unusually direct historical context: ELinks began as a
      development version and fork of Links, with a more liberal feature policy than the
      original Links project. The fork aimed to test and tune new features while still
      producing stable branches.
    - >
      The same README explains the later felinks phase. After the old ELinks team lost
      interest, felinks continued development from the original ELinks master branch.
      The repository was renamed back to elinks on 2020-12-01 with Petr's approval,
      while Homebrew kept the formula name felinks to distinguish this continuation.
    - >
      The modern release stream is active. The NEWS file lists releases from 0.16
      through 0.19, including 0.17.0 in 2023 with the XDG config path change, 0.18.0 in
      2024, 0.19.0 in 2025, and 0.19.1 in 2026.
  related-projects:
    - Links is the direct ancestor project described by the ELinks README.
    - Lynx and w3m are peer text-mode browsers in the same package-manager niche.
    - >
      Chawan is adjacent in newer terminal-browser culture; ELinks release notes mention
      support for Chawan mailcap extensions.
  sources:
    - https://github.com/rkd77/elinks
    - https://raw.githubusercontent.com/rkd77/elinks/master/README.md
    - https://raw.githubusercontent.com/rkd77/elinks/master/NEWS
    - https://raw.githubusercontent.com/rkd77/elinks/master/doc/man/man1/elinks.1.in
  summary:
    - >
      felinks is the Homebrew package name for the maintained ELinks continuation. It
      installs the elinks executable, a text-mode browser descended from Links and
      focused on terminal browsing across HTTP, FTP, Gopher, Gemini, NNTP, Finger, and
      related protocols.
  timeline:
    - 'Pre-2010s: ELinks begins as a feature-liberal development fork of Links.'
    - '2019: GitHub releases for the maintained continuation include v0.13.0.'
    - '2020: Repository renamed to elinks on 2020-12-01 with approval from Petr.'
    - >
      2023: ELinks 0.17.0 moves saved configuration to ~/.config/elinks or
      $XDG_CONFIG_HOME/elinks.
    - '2026: ELinks 0.19.1 released on 2026-02-07.'
  usage:
    - >
      The manual describes ELinks as a lynx-like character-mode browser with colors,
      table rendering, background downloading, menu-driven configuration, tabbed
      browsing, and slim code. It handles local files and remote URLs, primarily HTTP,
      HTTPS, and FTP, with additional protocol support for BitTorrent, finger, Gopher,
      SMB, and NNTP.
    - >
      Modern releases add and maintain features that matter to terminal users: XDG
      config paths, libcurl support, CSS and JavaScript experiments, Gemini support,
      sixel or kitty inline image work, iframe support, and scripting hooks.
related-packages:
  - id: brew:links
    reason: >
      Choose Links for the smaller, deliberately narrower browser from which ELinks was
      forked; choose ELinks when you want its broader feature and scripting policy.
    rel: alternative
    sources:
      - https://raw.githubusercontent.com/rkd77/elinks/master/README.md
      - https://links.twibright.com/
  - id: brew:lynx
    reason: >
      Choose Lynx for a conservative character-cell web browser with its own
      long-established terminal interface; choose ELinks for tabs, tables, scripting,
      and its broader protocol feature set.
    rel: alternative
    sources:
      - https://raw.githubusercontent.com/rkd77/elinks/master/README.md
      - https://invisible-island.net/lynx/
  - id: brew:w3m
    reason: >
      Choose w3m when a browsable pager-style workflow is the priority; choose ELinks
      for a more browser-like, extensively configurable multiprotocol client.
    rel: alternative
    sources:
      - https://raw.githubusercontent.com/rkd77/elinks/master/README.md
      - https://github.com/tats/w3m
