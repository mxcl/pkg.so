history:
  adoption-history:
    - >
      dcp is packaged for Homebrew and Nix, which points to a niche but practical
      audience of developers who need a quick way to inspect or extract files from
      container images without creating containers by hand.
  package-nerd-significance:
    - >
      For package-manager users, dcp is a tiny example of the post-Docker CLI ecosystem:
      a focused binary that turns a verbose container-runtime ritual into one command,
      useful when packages, manifests, or other deployable assets are shipped inside OCI
      images.
  project-history:
    - >
      The public GitHub repository was created in July 2022, and the first tagged
      release, v0.1.0, was published on July 14, 2022. The project intentionally depends
      on existing Docker and Podman APIs rather than implementing its own container
      image stack.
  related-projects:
    - docker cp, podman, containerd, dive
  sources:
    - https://github.com/exdx/dcp
    - https://github.com/exdx/dcp#readme
    - https://github.com/exdx/dcp/releases/tag/v0.1.0
    - https://github.com/exdx/dcp/releases/tag/v0.2.1
    - https://api.github.com/repos/exdx/dcp
  summary:
    - >
      dcp is a small Rust command-line tool that wraps the multi-step workflow behind
      docker cp for container images. Its README frames the project around OCI images
      that are used as data carriers, especially Kubernetes-adjacent images such as
      operator bundles and Crossplane packages.
  timeline:
    - '2022: GitHub repository created'
    - '2022: v0.1.0 release published'
    - '2022: v0.2.1 release published'
  usage:
    - >
      Users run dcp with an image name and optional content and destination flags to
      copy filesystem content locally. The tool can also pass username and password
      flags for private images, while its README warns that shell history makes that
      convenience insecure.
related-packages:
  - id: brew:docker
    reason: >
      dcp uses the Docker API and normally connects to the standard Docker socket, so
      Docker supplies the runtime that pulls images and exposes their contents for
      extraction.
    rel: adjacent_workflow
    sources:
      - https://github.com/exdx/dcp#readme
      - https://docs.docker.com/reference/cli/docker/
  - id: brew:podman
    reason: >
      When Docker is unavailable, dcp can connect to the current user's Podman socket,
      making Podman its documented daemonless runtime option.
    rel: alternative
    sources:
      - https://github.com/exdx/dcp#readme
      - https://docs.podman.io/en/latest/markdown/podman.1.html
  - id: brew:dive
    reason: >
      dcp's FAQ recommends using dive to locate files within container-image layers and
      then using dcp to extract the selected path.
    rel: adjacent_workflow
    sources:
      - https://github.com/exdx/dcp#readme
      - https://github.com/wagoodman/dive#readme
