history:
  adoption-history:
    - >
      Nektony distributes VSDX Annotator directly and through the Mac App Store as a
      paid macOS utility. Its stated audience is teams that exchange Microsoft Visio
      drawings across platforms.
  package-nerd-significance:
    - >
      VSDX Annotator fills a narrow interoperability gap: opening and annotating
      proprietary Visio drawing formats on macOS without Microsoft Visio. The Homebrew
      cask makes this otherwise graphical, proprietary utility reproducibly installable.
  project-history:
    - >
      Nektony released VSDX Annotator in April 2016, extending its earlier Visio-viewer
      product line with annotation and cross-platform collaboration features.
    - >
      Later releases added compatibility work for newer macOS versions and improved
      rendering of drawings containing embedded images.
  related-projects:
    - Nektony VSD Viewer is the read-oriented companion in the same product family.
    - Microsoft Visio produces the VSD, VDX, and VSDX formats handled by the application.
  sources:
    - https://download.nektony.com/download/media/vsdx-annotator/VSDXAnnotator-UserGuide.pdf
    - https://nektony.com/about
    - https://nektony.com/release-notes
    - https://nektony.com/vsdx-annotator-mac
  summary:
    - >
      VSDX Annotator is a proprietary macOS application from Nektony for viewing,
      annotating, editing, and converting Microsoft Visio drawings.
  timeline:
    - '2016: Nektony released VSDX Annotator.'
    - '2022: Version 1.16 added macOS Ventura optimization and page-content copying.'
    - '2022: Version 1.16.1 improved rendering of VSDX drawings with embedded images.'
  usage:
    - >
      Users open VSD, VDX, or VSDX drawings, inspect pages, layers, shape data,
      hyperlinks, and annotations, add text or graphical markup, and save supported
      edits as VSDX or export them as PDF.
