credentials-file-location: null
history:
  adoption-history:
    - >
      The official project positions Solod as experimental and encourages trials in
      hobby projects rather than production deployment. Distribution through Homebrew
      and other package managers, alongside `go install`, makes the compiler accessible
      while the language remains under active development.
  package-nerd-significance:
    - >
      Solod occupies an unusual point between a language subset and a transpiler
      package: valid Go syntax and much of the Go toolchain remain useful, but the
      produced program is readable C11 without a garbage collector or language runtime.
    - >
      For systems-language enthusiasts, its explicit stack-first allocation, opt-in heap
      facilities, direct C interoperability, freestanding targets, and support for
      several C compilers offer a different tradeoff from ordinary Go compilation or
      CGO.
  project-history:
    - >
      Anton Zhiyanov developed Solod as a strict Go subset for programmers who want Go's
      syntax and tooling with C-style control and interoperability. The compiler
      translates Go modules into C rather than introducing an unrelated source language.
    - >
      The roadmap progressed from core language and standard-library work through
      networking and additional targets, then concurrency, JSON, testing, benchmarking,
      and safety features. The project remains in active development and its official
      site cautions that it is not yet production-ready.
  related-projects:
    - >
      Go supplies Solod's source syntax, module system, editor tooling, and the model
      for many standard-library packages. Generated C can be built with GCC, Clang,
      Emscripten, or Zig's C compiler; MSVC is not supported by the official
      compatibility notes.
  sources:
    - https://github.com/solod-dev/solod#readme
    - https://solod.dev/
  summary:
    - >
      Solod is a systems-programming language implementation based on a strict subset of
      Go. Its `so` tool translates Go-module projects into readable C11 and can also
      compile or run the result.
  timeline:
    - >
      v0.1 milestone: Established core language features and initial standard-library
      packages.
    - >
      v0.2 milestone: Added networking, UUID support, WebAssembly, 32-bit, and
      freestanding targets.
    - >
      v0.3 milestone: Added concurrency, JSON, testing, benchmarking, and additional
      safety features.
    - >
      2026: The official site described Solod as actively developed but not yet ready
      for production use.
  usage:
    - >
      Users create an ordinary Go module, import Solod's replacement standard-library
      packages, and run `so translate`, `so build`, or `so run` on the module directory.
      The generated C can be inspected, incorporated into native builds, or compiled
      directly by the tool.
    - >
      Solod is aimed at Go programmers seeking runtime-free native output and C
      programmers who prefer Go-like structure and tooling. It does not document a
      separate credential file; project metadata follows Go's `go.mod` convention.
