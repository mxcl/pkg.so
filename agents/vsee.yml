history:
  adoption-history:
    - >
      After an early deployment supporting the Albert Schweitzer Hospital in Gabon, VSee
      shifted its focus toward healthcare and developed telehealth workflows around its
      communications technology.
    - >
      VSee Messenger is offered to providers and patients across desktop and mobile
      platforms, with free and paid healthcare-oriented service tiers.
  package-nerd-significance:
    - >
      VSee Messenger represents the specialized clinical branch of desktop
      video-conferencing software. Its Homebrew cask is useful for managed Mac setups
      where a provider requires the native client rather than an ordinary consumer
      meeting application.
  project-history:
    - >
      VSee was founded in 2008 by Milton Chen and Erika Chuang from Stanford’s Human
      Computer Interaction and Computer Graphics labs. Its original video application
      aimed to simplify remote work before the company concentrated on healthcare.
    - >
      The Messenger product evolved into a secure communications client supporting video
      calls, chat, file exchange, screen annotation, peripheral streaming, and
      telehealth use cases.
  related-projects:
    - >
      VSee Clinic adds virtual waiting rooms, scheduling, intake, and other clinical
      workflow features around VSee’s communications platform.
  sources:
    - https://help.vsee.com/kb/articles/getting-started-with-vsee-messenger-free-version
    - https://help.vsee.com/kb/vsee-messenger-providers-and-patients
    - https://vsee.com/aboutus
    - https://vsee.com/messenger
  summary:
    - >
      VSee Messenger is VSee’s healthcare-focused desktop and mobile client for secure
      video calls, messaging, screen sharing, and file exchange.
  timeline:
    - '2008: VSee was founded from work at Stanford laboratories.'
    - >
      After 2008: A deployment at the Albert Schweitzer Hospital helped redirect VSee
      toward healthcare.
    - '2022: Messenger 4.13 expanded group-chat capacity and added macOS dark mode.'
  usage:
    - >
      Users create or receive a VSee account, sign in to the native client, add
      contacts, and conduct individual or group chats and video calls. The client also
      supports screen sharing, live annotation, file transfer, and configurable audio
      and video devices.
