history:
  adoption-history:
    - >
      The original release belonged to Pangea Software's line of Mac games. The
      authorized modern port broadened access by providing builds for macOS, Windows,
      and Linux at no charge.
  package-nerd-significance:
    - >
      Billy Frontier is representative of community-led preservation work that keeps
      older Mac games usable on current systems. Its source-based modernization and
      cross-platform releases make the game practical to distribute through contemporary
      package managers.
  project-history:
    - >
      Pangea Software released Billy Frontier for PowerPC Macs in 2003. It combined a
      space-western setting with arcade sequences built around duels, shootouts, and
      stampedes.
    - >
      Jorio later ported the game to modern operating systems with Pangea Software's
      permission. The maintained repository contains the source, original manual, build
      instructions, changelog, and releases for macOS, Windows, and Linux.
  related-projects:
    - >
      The maintainer has produced similar modern ports of Pangea titles including
      Bugdom, Cro-Mag Rally, Mighty Mike, Nanosaur, and Otto Matic.
  sources:
    - 'Official releases: https://github.com/jorio/BillyFrontier/releases'
    - 'Official repository and README: https://github.com/jorio/BillyFrontier'
    - >
      Original manual in the official repository:
      https://github.com/jorio/BillyFrontier/blob/master/Instructions.pdf
  summary:
    - >
      Billy Frontier is Pangea Software's 2003 space-western arcade action game,
      preserved as an authorized port for modern macOS, Windows, and Linux systems.
  timeline:
    - '2003: Pangea Software released Billy Frontier for PowerPC Macs.'
    - >
      Modern-port era: Jorio ported the game to current operating systems with Pangea
      Software's permission.
    - >
      Modern-port era: Version 1.1.0 was identified as the initial playable release of
      the modern version.
  usage:
    - >
      Players alternate among shootouts, stampedes, and reflex-based duels. The modern
      README documents mouse, keyboard, mouse-wheel, and trackpad controls.
    - >
      Current builds are downloaded as a self-contained desktop game; no online account
      or external credentials are required.
