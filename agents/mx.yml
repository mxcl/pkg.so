credentials-file-location: null
history:
  project-history:
    - >
      Its central abstraction is the suite. A suite is both a source tree and the
      container for libraries, projects, distributions, metadata, and imports of other
      suites. That model fits the GraalVM ecosystem, where compiler, Truffle, language,
      and VM components need coordinated builds across related repositories. Oracle's
      GraalVM build instructions use mx for building GraalVM from source, including the
      VM suite that assembles the GraalVM SDK, Graal JIT compiler, SubstrateVM, and
      Truffle framework.
  sources:
    - https://github.com/graalvm/mx
    - https://github.com/oracle/graal/blob/master/vm/README.md
    - https://raw.githubusercontent.com/graalvm/mx/master/README.md
  summary:
    - >
      mx is the Python-based command-line tool used to develop Graal projects. The
      graalvm/mx README describes it as a tool for managing primarily Java code:
      defining dependencies, building, testing, running, updating, and packaging
      artifacts, including code spread across multiple source repositories.
  usage:
    - >
      In package-manager terms, mx is not a general Java build tool competing with Maven
      or Gradle for application projects. It is a specialist developer tool for the
      GraalVM codebase and projects that adopt Graal's suite metadata format, useful
      when a repository needs mx commands, suite.py metadata, and the surrounding Graal
      build conventions.
related-packages:
  - id: brew:graalvm
    reason: >
      Install GraalVM alongside mx when developing or building Graal suites that require
      the GraalVM JDK, compiler, runtime, and Native Image ecosystem that mx coordinates
      from source.
    rel: adjacent_workflow
    sources:
      - https://github.com/graalvm/mx
      - https://github.com/oracle/graal/blob/master/vm/README.md
      - https://www.graalvm.org/latest/docs/
