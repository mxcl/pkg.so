history:
  adoption-history:
    - >
      ProWritingAid says the service has grown from a personal prototype into a tool
      used by millions of creative and business writers. It remains independently
      operated without venture-capital funding.
  package-nerd-significance:
    - >
      The macOS cask provides a native entry point into a broader writing-assistance
      ecosystem that also includes a web editor, browser extensions, and integrations.
      It is particularly relevant to users editing Scrivener, Word, OpenOffice,
      Markdown, Final Draft, and rich-text documents.
  project-history:
    - >
      Founder Chris Banks created the first prototype after struggling to apply
      storytelling advice to a novel inspired by his travels. He put the prototype
      online and launched ProWritingAid in 2013.
  related-projects:
    - >
      The Desktop Editor works with formats and projects from Scrivener, Microsoft Word,
      OpenOffice, Markdown, Final Draft, and rich-text editors.
    - >
      Desktop Everywhere and the browser extensions provide complementary integration
      surfaces.
