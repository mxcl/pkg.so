    - https://prowritingaid.com/about-us
    - https://prowritingaid.com/founders-story
  summary:
    - >
      ProWritingAid is a proprietary writing assistant for grammar, spelling, style, and
      longer-form writing analysis. Its desktop software is aimed at creative and
      business writers working in common document formats and authoring tools.
  timeline:
    - '2012: Chris Banks began developing a prototype to analyze his own fiction writing.'
    - '2013: ProWritingAid launched publicly.'
  usage:
    - >
      Users open supported documents or projects in the Desktop Editor, or use Desktop
      Everywhere inside compatible macOS and Windows applications, to receive
      suggestions and run specialized writing reports.
