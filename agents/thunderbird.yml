id: cask:thunderbird
display-name: Mozilla Thunderbird
repo: https://hg.mozilla.org/comm-central
docs:
  - https://developer.thunderbird.net/
  - https://source-docs.thunderbird.net/en/latest
  - https://support.mozilla.org/en-US/products/thunderbird
config-file-location:
  linux:
    - ~/.thunderbird/<profile>/prefs.js
  macos:
    - ~/Library/Thunderbird/Profiles/<profile>/prefs.js
  windows:
    - '%APPDATA%\Thunderbird\Profiles\<profile>\prefs.js'
credentials-file-location:
  linux:
    - ~/.thunderbird/<profile>/logins.json
    - ~/.thunderbird/<profile>/key4.db
  macos:
    - ~/Library/Thunderbird/Profiles/<profile>/logins.json
    - ~/Library/Thunderbird/Profiles/<profile>/key4.db
  windows:
    - '%APPDATA%\Thunderbird\Profiles\<profile>\logins.json'
    - '%APPDATA%\Thunderbird\Profiles\<profile>\key4.db'
history:
  adoption-history:
    - >
      Thunderbird became a widely used cross-platform alternative to proprietary mail
      clients. The project reports that it continued serving about 20 million users
      during its difficult community-led period after Mozilla reduced paid development
      resources.
    - >
      User donations enabled a small paid team to return in 2017. Growth in donations
      and staffing led the project to move in 2020 to MZLA Technologies Corporation, a
      wholly owned Mozilla Foundation subsidiary, while remaining free and open source.
  package-nerd-significance:
    - >
      Thunderbird is one of the enduring open-source desktop mail clients available
      across Linux, macOS, and Windows. It matters to package users because it combines
      local control of mail data with standards-based accounts, calendaring, contacts,
      extensions, and a long-lived Mozilla-derived codebase.
  project-history:
    - >
      Thunderbird began in 2003 as an offshoot of Mozilla Mail, initially associated
      with the name Minotaur. Thunderbird 1.0 was released on December 7, 2004 as a
      free, customizable, cross-platform alternative to proprietary email clients.
    - >
      In 2012, Mozilla reduced direct paid development and Thunderbird transitioned
      toward community governance. The elected Thunderbird Council and volunteers
      maintained the project until donation-supported staffing restored development
      capacity.
    - >
      The 2023 Supernova release modernized the desktop interface. In 2024, the project
      launched its first Android application, developed from the K-9 Mail project,
      extending the Thunderbird identity beyond desktop systems.
  related-projects:
    - Mozilla Firefox
    - Mozilla Suite and SeaMonkey
    - K-9 Mail
    - Thunderbird for Android
  sources:
    - 'Official MZLA announcement: https://blog.thunderbird.net/2020/01/thunderbirds-new-home/'
    - >
      Official organizational history:
      https://blog.thunderbird.net/2023/11/the-untold-history-of-thunderbird/
    - 'Official project overview: https://www.thunderbird.net/en-US/about/'
    - >
      Official twentieth-anniversary history:
      https://blog.thunderbird.net/2024/12/celebrating-20-years-of-thunderbird/
  summary:
    - >
      Mozilla Thunderbird is a free and open-source email and productivity client with
      mail, calendar, contacts, and extensibility features. It grew from the Mozilla
      application family and is currently operated by MZLA Technologies Corporation
      within the Mozilla Foundation family.
  timeline:
    - '2003: Thunderbird began as a Mozilla Mail offshoot'
    - '2004: Thunderbird 1.0 was released on December 7'
    - >
      2012: The project began transitioning from Mozilla Corporation funding to
      community operation
    - '2017: Donation funding supported a renewed paid development team'
    - '2020: Thunderbird moved to MZLA Technologies Corporation'
    - '2023: The Supernova desktop redesign shipped'
    - '2024: Thunderbird launched its first Android application'
  usage:
    - >
      Users configure one or more email accounts and manage messages, calendars, and
      contacts locally. Unified inboxes, filters, tags, add-ons, RSS support, OpenPGP,
      and profile portability make it suitable for both ordinary desktop mail and highly
      customized workflows.
