id: cask:usage-app
display-name: Usage
repo: null
docs:
  - https://www.mediaatelier.com/Usage
  - https://www.mediaatelier.com/en-DE/Compatibility
  - https://www.mediaatelier.com/en/Migration
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Usage was a small macOS utility for recording time spent in applications. It
      occupied a simpler niche than Media Atelier's project-oriented Timings product.
    - >
      Media Atelier's compatibility archive places the Usage 1.x line in December 2015
      and now lists it among discontinued products.
    - >
      The application remains represented by the Homebrew cask `usage-app`, allowing
      package-manager catalogs to preserve access to this legacy utility.
  package-nerd-significance:
    - >
      Usage is an example of a discontinued, single-purpose Mac utility that remains
      discoverable through a cask even after its original product documentation has
      largely receded.
    - >
      Its surviving official migration documentation is important for archival users
      because it identifies the application data directory needed when moving or
      recovering an installation.
  project-history:
    - >
      Media Atelier produced Usage as a macOS application-usage tracker. The surviving
      official records identify a 1.x product line and classify it as discontinued.
    - >
      Official migration guidance continues to document where Usage keeps its
      application data, supporting manual transfers and restoration from backup.
  related-projects:
    - Media Atelier Timings
    - Media Atelier TimeLog
  sources:
    - https://www.mediaatelier.com/en-DE/Compatibility/
    - https://www.mediaatelier.com/en/Migration/
    - source_facts.description
    - source_facts.homepage
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Usage is a discontinued Media Atelier utility for tracking how long macOS
      applications are used.
  timeline:
    - >
      2015-12: Media Atelier's compatibility archive dates the Usage 1.x line to
      December 2015.
    - 'Later: Media Atelier classified Usage among its discontinued applications.'
  usage:
    - >
      Run Usage in the background to collect application-usage time and review where
      time was spent.
    - >
      For migration or recovery, Media Atelier documents Usage data under
      `~/Library/Application Support/com.mediaatelier.Usage`. This is an
      application-data directory, not a documented configuration file, so the
      config-file field remains null.
tags:
