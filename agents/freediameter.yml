id: brew:freediameter
display-name: freeDiameter
repo: null
docs:
  - https://github.com/freeDiameter/freeDiameter#readme
  - https://www.freediameter.net/trac/wiki/Configuration.html
  - https://www.freediameter.net/trac/wiki/WikiStart.html
config-file-location:
  unix:
    - ${CMAKE_INSTALL_PREFIX}/etc/freeDiameter/freeDiameter.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      freeDiameter has a narrower adoption profile than RADIUS servers, but it is
      present in multiple Unix package collections. The supplied package facts list
      Alpine, Homebrew, Debian, Fedora, Nix, and Ubuntu packages, which is typical for
      telecom/protocol infrastructure libraries that are needed by specialists rather
      than desktop users.
  package-nerd-significance:
    - >
      The package matters to protocol-oriented packagers because it ships daemon
      binaries, shared libraries, headers, dictionaries, CMake build files, and many
      optional extensions. Its value is not a flashy executable but a standards-oriented
      framework for telecom AAA experiments and services.
  project-history:
    - >
      The upstream README describes freeDiameter as the successor name for the WIDE AAA
      Daemon, or waaad, project, and notes that it is not related to Sun's older
      SourceForge project of a similar name. Its design follows Diameter's extensible
      model: a base protocol framework plus loadable applications and routing
      extensions.
  related-projects:
    - >
      The README relates freeDiameter to Diameter Base Protocol work, RADIUS as
      Diameter's predecessor, and application RFCs such as Network Access Server and EAP
      support. It explicitly distinguishes itself from Sun's unrelated freediameter
      project.
  sources:
    - https://github.com/freeDiameter/freeDiameter
    - https://raw.githubusercontent.com/freeDiameter/freeDiameter/master/NEWS
    - https://raw.githubusercontent.com/freeDiameter/freeDiameter/master/README
    - >
      https://raw.githubusercontent.com/freeDiameter/freeDiameter/master/contrib/debian/changelog
  summary:
    - >
      freeDiameter is an implementation of the Diameter protocol for Authentication,
      Authorization, and Accounting traffic. It provides reusable protocol/core
      libraries, the freeDiameterd daemon, and extension modules for Diameter server,
      agent, routing, peer, and dictionary work.
  timeline:
    - 'Pre-1.0: Project known as waaad, the WIDE AAA Daemon.'
    - '2010s: freeDiameter published 1.x releases and distribution packaging.'
    - >
      2020s: Upstream changelog work includes 3GPP Release 15 dictionary updates and
      JSON/dictionary tooling.
    - '2025: The GitHub repository remained active on the master branch.'
  usage:
    - >
      Operators run freeDiameterd for Diameter server or agent components, while client
      applications can link directly with libfdcore. Developers use libfdproto for
      Diameter message and dictionary manipulation and extend the daemon with fdx
      modules.
related-packages:
  - id: brew:freeradius-server
    reason: >
      Choose FreeRADIUS Server for RADIUS-based network AAA deployments; choose
      freeDiameter when the deployment requires Diameter peers, routing, or Diameter
      application extensions.
    rel: alternative
    sources:
      - https://github.com/freeDiameter/freeDiameter#readme
      - https://www.freeradius.org/
