history:
  adoption-history:
    - >
      Adoption is still early compared with PostgreSQL itself, but the packaging story
      is notable: Doltgres has an official release pipeline, Docker image, Homebrew
      formula, and direct install script. That makes it easy for database experimenters
      and data-versioning users to try without building from source.
  package-nerd-significance:
    - >
      Doltgres is package-nerd interesting because it packages a database server whose
      main differentiator is not storage alone but Git-like workflows at the SQL layer.
      It also shows a common modern packaging pattern for infrastructure tools: GitHub
      releases, Docker images, install scripts, and Homebrew in parallel.
  project-history:
    - >
      Doltgres grew out of DoltHub's earlier Dolt database work, which applied
      version-control semantics to SQL tables. The public GitHub repository was created
      in September 2023, and the README positions Doltgres as the Postgres-facing
      sibling of Dolt rather than a separate database lineage.
    - >
      The project moved through rapid early releases during 2024 and 2025, then
      announced beta quality in April 2025. By June 2026 the GitHub release stream was
      still active, with 0.56.x releases appearing frequently.
  related-projects:
    - >
      Related projects include Dolt, PostgreSQL, DoltHub, PostgreSQL client tooling, and
      Docker-based database distribution workflows.
  sources:
    - https://github.com/dolthub/doltgresql#readme
    - https://api.github.com/repos/dolthub/doltgresql
    - https://api.github.com/repos/dolthub/doltgresql/releases
    - https://formulae.brew.sh/formula/doltgres
  summary:
    - >
      Doltgres is Dolt's Postgres-flavored database: a SQL server that exposes Git-like
      branch, merge, clone, push, and pull workflows for tables and schemas while
      accepting ordinary PostgreSQL clients.
  timeline:
    - '2023: The public dolthub/doltgresql repository is created.'
    - '2024: Early 0.x releases continue as Doltgres tracks more PostgreSQL behavior.'
    - '2025: DoltHub announces Doltgres beta quality.'
    - '2026: GitHub release metadata shows active 0.56.x releases.'
  usage:
    - >
      Users run the `doltgres` server, connect with PostgreSQL-compatible clients, and
      use SQL-exposed version-control features for branching and merging table data. The
      README also documents imports from existing PostgreSQL databases with `pg_dump`
      and `psql`.
related-packages:
  - id: brew:dolt
    reason: >
      Choose Dolt when MySQL compatibility and its longer production history matter more
      than PostgreSQL syntax and client compatibility.
    rel: alternative
    sources:
      - https://www.dolthub.com/blog/2025-04-17-doltgres-over-dolt/
      - https://github.com/dolthub/dolt#readme
  - id: brew:doltlite
    reason: >
      Choose DoltLite for an embedded, SQLite-compatible, single-file versioned
      database; choose Doltgres when applications need a PostgreSQL-compatible server
      and client ecosystem.
    rel: alternative
    sources:
      - https://github.com/dolthub/doltlite#readme
      - https://github.com/dolthub/doltgresql#readme
