history:
  adoption-history:
    - >
      Synalyze It! developed a specialist audience among software developers,
      data-stream specialists, and digital-forensics practitioners who need structured
      interpretation rather than an undifferentiated hex dump.
    - >
      A free edition lowers the barrier to basic hex editing, while the paid Pro edition
      adds binary comparison, grammar editing, advanced data views, scripting, and
      export features.
  package-nerd-significance:
    - >
      Its distinctive abstraction is the XML-based grammar: reusable declarative
      descriptions that turn byte ranges into named structures, strings, and numbers.
      This makes the tool relevant to file-format reverse engineering and preservation
      work.
    - >
      The application combines native macOS packaging with extensibility through Python
      or Lua scripts and shareable grammar files, bridging desktop hex editing and
      programmable binary analysis.
  project-history:
    - >
      Synalyze It! was created by Andreas Pehnack as a native macOS hex editor focused
      on interactive binary-format grammars. The official manual carries copyright years
      beginning in 2009.
    - >
      The product evolved into free and Pro editions. The Pro edition expanded the
      grammar system with scripting, custom element types, binary comparison, checksums,
      export facilities, and a dedicated grammar editor.
  related-projects:
    - Hexinator, Synalysis's related binary-analysis application for Linux and Windows.
    - GraphViz, supported as an export target for visualizing grammars.
    - Python and Lua, supported by the Pro scripting environment.
  sources:
    - https://www.synalysis.net/
    - https://www.synalysis.net/Synalyze_It_Manual.pdf
    - https://www.synalysis.net/features/
    - https://www.synalysis.net/pro/
    - https://www.synalysis.net/scripting
  summary:
    - >
      Synalyze It! Pro is a commercial macOS hex editor and structured binary-analysis
      tool. Users define XML grammar files that describe a format, then apply them to
      decode, inspect, edit, compare, and automate work on binary files.
  timeline:
    - '2009: Earliest copyright year listed in the official user guide.'
    - '2016: The extant official manual documents the mature grammar and scripting model.'
    - >
      Later releases: Universal binaries added native support for both Apple Silicon and
      Intel Macs.
  usage:
    - >
      Open a binary file, create or select a grammar, map byte ranges to structures and
      elements, and inspect parsed values beside the hex view.
    - >
      Use the Pro edition for Python or Lua automation, scripted data types, binary
      comparison, checksums, grammar debugging, GraphViz output, and XML or text export.
