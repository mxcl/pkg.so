id: brew:certbot
display-name: Certbot
repo: https://github.com/certbot/certbot
docs:
  - https://certbot.eff.org/docs
config-file-location:
  unix:
    - /etc/letsencrypt/cli.ini
    - $XDG_CONFIG_HOME/letsencrypt/cli.ini
    - ~/.config/letsencrypt/cli.ini
    - /etc/letsencrypt/renewal/*.conf
credentials-file-location:
  macos:
    - ~/Library/Application Support/letsencrypt
  unix:
    - ~/.config/letsencrypt
    - ~/.letsencrypt
history:
  adoption-history:
    - >
      Certbot rode the same adoption wave as Let's Encrypt: EFF's 2016 announcement
      noted Let's Encrypt had issued its three millionth certificate, and EFF later
      reported Certbot installed on more than 4 million web servers maintaining
      certificates for more than 31 million websites.
  package-nerd-significance:
    - >
      Certbot is one of the canonical examples of a security CLI becoming distribution
      infrastructure: it appears in many package managers, replaced the older
      letsencrypt command name in user documentation, deprecated certbot-auto, and
      standardized operational files under /etc/letsencrypt.
  project-history:
    - >
      The repository was created in 2014 during the early Let's Encrypt client era. In
      2016, EFF announced the client would move under the Certbot name to distinguish
      the client from the Let's Encrypt certificate authority and ISRG organization.
  related-projects:
    - Let's Encrypt is the default certificate authority commonly used with Certbot.
    - ACME is the protocol Certbot speaks, standardized as RFC 8555.
    - >
      certbot-apache, certbot-nginx, and Certbot DNS plugins provide authenticator and
      installer integrations.
  sources:
    - https://api.github.com/repos/certbot/certbot
    - https://github.com/certbot/certbot
    - https://certbot.eff.org/
    - https://certbot.eff.org/docs
    - https://www.eff.org/deeplinks/2016/05/announcing-certbot-new-tls-robot
    - https://www.eff.org/deeplinks/2024/03/should-caddy-and-traefik-replace-certbot
    - https://github.com/certbot/certbot/blob/main/certbot/CHANGELOG.md
    - https://formulae.brew.sh/api/formula/certbot.json
  summary:
    - >
      Certbot is EFF's ACME client for obtaining and renewing HTTPS certificates, most
      commonly from Let's Encrypt, and optionally configuring web servers such as Apache
      and nginx.
  timeline:
    - '2014: Public certbot/certbot repository created.'
    - >
      2016: EFF announced the Let's Encrypt client rename to Certbot and the new
      certbot.eff.org site.
    - '2025: Certbot 5.0.0 released, removing older deprecated APIs and Python 3.9 support.'
    - '2026: Certbot 5.6.0 released according to the official changelog.'
  usage:
    - >
      Certbot is intended to run on the server that hosts the site. It obtains
      certificates, saves them under /etc/letsencrypt/live, renews them on a schedule,
      and can use plugins for Apache, nginx, webroot, standalone, manual, and DNS-based
      validation.
related-packages:
  - id: brew:acme.sh
    reason: >
      Choose acme.sh when you want a shell-only ACME client with no Python dependency
      and broad DNS-provider automation, rather than Certbot's Python and plugin-based
      workflow.
    rel: alternative
    sources:
      - https://github.com/acmesh-official/acme.sh
      - https://github.com/certbot/certbot
  - id: brew:caddy
    reason: >
      Choose Caddy when the web server itself should obtain, renew, and deploy
      certificates automatically, avoiding a separate Certbot process for sites served
      by Caddy.
    rel: alternative
    sources:
      - https://caddyserver.com/docs/automatic-https
      - https://www.eff.org/deeplinks/2024/03/should-caddy-and-traefik-replace-certbot
tags:
  - acme
  - certificates
  - cli
  - https
  - letsencrypt
  - tls
