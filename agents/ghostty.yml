id: cask:ghostty
display-name: Ghostty
repo: https://github.com/ghostty-org/ghostty
docs:
  - https://ghostty.org/docs
  - https://ghostty.org/docs/config
  - https://ghostty.org/docs/config/reference
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/ghostty/config.ghostty
    - ~/.config/ghostty/config.ghostty
  macos:
    - $XDG_CONFIG_HOME/ghostty/config.ghostty
    - ~/.config/ghostty/config.ghostty
    - ~/Library/Application Support/com.mitchellh.ghostty/config.ghostty
credentials-file-location: null
history:
  adoption-history:
    - >
      Ghostty's initial public release brought the project to a broad audience after a
      period of private development. The official repository now characterizes it as
      stable and in daily use by millions of people and machines, while release notes
      show substantial community participation soon after 1.0.
  package-nerd-significance:
    - >
      Ghostty is notable to package enthusiasts as a modern terminal written primarily
      in Zig, with distinct native front ends for macOS and Linux rather than a shared
      web-based shell. Its maintainers publish package-specific build guidance and
      signed source archives, reflecting unusually deliberate support for downstream
      packaging.
    - >
      Its reusable libghostty work also makes the project relevant beyond the
      application itself: the terminal parser and related components are being developed
      for embedding in other programs.
  project-history:
    - >
      Ghostty began as Mitchell Hashimoto's passion project to build a terminal emulator
      that combined competitive performance, a rich feature set, and platform-native
      interfaces. It uses native Swift/AppKit integration on macOS and GTK on Linux,
      backed by a shared terminal core.
    - >
      The project made its initial public release in late 2024 and quickly entered a
      regular release cadence. During the Ghostty 1.3 development cycle in 2026, it
      became a nonprofit project intended to provide mission-driven long-term
      stewardship.
  related-projects:
    - libghostty, Ghostty's embeddable terminal library
    - GTK and libadwaita, used by the Linux interface
    - Zig, Ghostty's principal implementation language
  sources:
    - https://ghostty.org/docs/about
    - https://ghostty.org/docs/install/release-notes
    - https://ghostty.org/docs/install/release-notes/1-1-0
    - https://ghostty.org/docs/install/release-notes/1-3-0
    - https://github.com/ghostty-org/ghostty
    - https://github.com/ghostty-org/ghostty/blob/main/PACKAGING.md
  summary:
    - >
      Ghostty is an open-source, GPU-accelerated terminal emulator for macOS and Linux.
      It combines a shared high-performance terminal core with platform-native user
      interfaces and is also developing that core as the embeddable libghostty library.
  timeline:
    - '2024: Ghostty made its initial public 1.0 release'
    - '2025: Early post-1.0 releases expanded stability and Linux desktop integration'
    - '2026: Ghostty 1.3 arrived after a six-month development cycle involving 180 contributors'
    - '2026: The project announced that it had become a nonprofit'
  usage:
    - >
      Users run shells and terminal applications in native windows with tabs, splits,
      themes, shell integration, custom key bindings, and extensive terminal-protocol
      support. Ghostty follows a zero-configuration philosophy but exposes hundreds of
      text-file options for users who want to tune its behavior.
    - >
      On macOS it provides an AppKit-based experience; on Linux it uses GTK and
      integrates with contemporary Wayland and X11 desktops. Developers can also build
      from source or experiment with libghostty as an embeddable terminal component.
