history:
  adoption-history:
    - >
      DEVONtechnologies maintained CalcService as part of its freeware collection
      through multiple macOS transitions. It received a universal-binary update in the
      PowerPC-to-Intel era, was included in the company's 2010 freeware refresh, and was
      optimized for Apple Silicon in 2021.
  package-nerd-significance:
    - >
      CalcService exemplifies the classic macOS Services model: a small system-wide
      component adds contextual functionality to many applications without
      application-specific plugins or code injection.
  project-history:
    - >
      CalcService was created by DEVONtechnologies as a free macOS Service for
      evaluating selected calculations directly inside compatible applications.
  related-projects:
    - >
      Distributed alongside DEVONtechnologies utilities and Services such as
      WordService, BlueService, EasyFind, PhotoStickies, ThumbsUp, and XMenu.
  sources:
    - https://www.devontechnologies.com/apps/freeware
    - https://www.devontechnologies.com/blog/20210817-summer-freeware-updates
    - https://www.devontechnologies.com/blog/dayofthefreewaredevontechnologies
  summary:
    - >
      CalcService is a free macOS Service that evaluates selected formulas in
      Service-aware applications, replacing the text, appending the result, or
      displaying the result in a panel.
  timeline:
    - >
      2007: DEVONtechnologies published a universal-binary update for CalcService and
      related Services.
    - >
      2010: CalcService participated in a broad refresh of the company's freeware
      applications and Services.
    - '2021: CalcService 3.5.1 was optimized for Apple Silicon.'
  usage:
    - >
      Select a calculation in a Service-aware application such as Mail or Messages, then
      invoke CalcService to append the answer, replace the selected formula, or show the
      result in a panel.
