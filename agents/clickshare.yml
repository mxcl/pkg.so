      https://www.barco.com/en/news/news-insights/2012-04-19-barco-launches-clickshare
    - Input field source_facts.package-manager.
    - 'Official Desktop App page: https://www.barco.com/en/product/clickshare-app'
    - >
      Official sharing guide:
      https://www.barco.com/en/support/knowledge-base/2607-how-to-share-using-clickshare-desktop-app
  summary:
    - >
      ClickShare Desktop App is Barco's Windows and macOS client for connecting to
      ClickShare-equipped meeting rooms, sharing screens or application windows, and
      using compatible room conferencing equipment.
  timeline:
    - '2012-04-18: Barco launches the ClickShare wireless presentation system.'
    - >
      2020s: The ClickShare family expands around wireless conferencing and hybrid
      meeting-room workflows.
    - >
      2026: Barco documents a redesigned Desktop App sharing interface as the default
      experience.
  usage:
    - >
      Users open the app, select a nearby ClickShare room or enter its name or IP
      address, enter the room's four-digit passcode when required, and share either the
      whole desktop or an application window. Compatible Conference systems can also
      expose room cameras, microphones, and audio devices.
