history:
  adoption-history:
    - >
      ClickShare began as a hardware-and-software meeting-room system based on USB
      Buttons and a Base Unit. The Desktop App later provided software-based discovery,
      connection, content sharing, and wireless-conferencing workflows on Windows and
      macOS.
    - >
      The macOS Desktop App is distributed through Homebrew Cask as clickshare, making
      deployment accessible to package-managed Mac fleets.
  package-nerd-significance:
    - >
      ClickShare is notable as a desktop client tied to enterprise meeting-room hardware
      rather than a standalone conferencing service. Package management is particularly
      useful in managed workplace environments where the client must be installed
      consistently across many Macs.
  project-history:
    - >
      Barco launched ClickShare on April 18, 2012 as a one-click wireless presentation
      system. Presenters connected a ClickShare Button to a PC or Mac, while a Base Unit
      relayed the desktop to the room display.
    - >
      The product family expanded from presentation into conferencing and collaboration.
      The current Desktop App supports nearby-room discovery, full-screen or
      individual-window sharing, and integration with ClickShare Present and Conference
      devices.
  related-projects:
    - ClickShare Present
    - ClickShare Conference
    - ClickShare Button
  sources:
