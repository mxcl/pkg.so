id: brew:gita
display-name: Gita
repo: https://github.com/nosarthur/gita
docs:
  - https://github.com/nosarthur/gita#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/gita/repos.csv
    - $XDG_CONFIG_HOME/gita/cmds.json
    - $XDG_CONFIG_HOME/gita/color.csv
    - $XDG_CONFIG_HOME/gita/info.csv
    - $XDG_CONFIG_HOME/gita/symbols.csv
credentials-file-location: null
history:
  adoption-history:
    - >
      Upstream distributes Gita through PyPI and documents installation with pip, uv,
      and pipx. The supplied package facts also show packages in Homebrew, Debian,
      Ubuntu, and Nix, giving the Python CLI several workstation-oriented installation
      paths.
    - >
      The official GitHub repository has accumulated a long-running release series and a
      substantial user following for a focused multi-repository utility. Its adoption is
      especially natural among developers who keep many unrelated clones and want a
      dashboard and batch-command layer without converting them into a monorepo.
  package-nerd-significance:
    - >
      Gita is interesting to package users because it applies a package-manager-like
      control plane to source checkouts while leaving Git itself untouched. It is a
      lightweight alternative to bespoke shell loops and sits between individual clones
      and heavier manifest-driven multi-repository systems.
  project-history:
    - >
      The public Gita repository was created in January 2018. The project grew around
      two core features that remain central in the official README: summarizing the
      status of many repositories and delegating commands to them without requiring the
      user to enter each working directory.
    - >
      Later functionality added repository groups, contexts, recursive discovery, custom
      command definitions, status colors and symbols, shell-command delegation, and
      freeze-and-clone workflows. These features kept the package focused on
      coordinating ordinary Git repositories rather than introducing a new repository
      format.
  related-projects:
    - Git is the underlying version-control system whose commands Gita delegates.
    - >
      The official README identifies myrepos, Android's repo tool, and mu-repo as other
      multi-repository tools.
  sources:
    - https://github.com/nosarthur/gita
    - https://github.com/nosarthur/gita/releases
    - source_facts.package-manager
  summary:
    - >
      Gita is a Python command-line tool for viewing and operating many Git repositories
      from one place. It keeps a registry of repository paths, displays branch and
      working-tree status side by side, and delegates Git or shell commands across
      selected repositories or groups.
  timeline:
    - '2018: The nosarthur/gita GitHub repository was created.'
    - '2023: The official release feed published the v0.16.6 series.'
    - '2025: The official release feed published the v0.16.8 series.'
  usage:
    - >
      A typical workflow begins with gita add, then uses gita ll to inspect branch and
      modification state across repositories. Built-in delegated commands can fetch or
      pull across all or selected repositories, while superman mode forwards arbitrary
      Git commands and shell mode runs arbitrary shell commands.
    - >
      Configuration follows the XDG base-directory convention. The repository registry
      and optional command, color, information, and symbol customizations live under
      $XDG_CONFIG_HOME/gita, usually ~/.config/gita.
related-packages:
  - id: brew:mr
    reason: >
      Choose myrepos when you want one command layer that can manage repositories from
      multiple version-control systems; Gita is centered on Git status visualization and
      Git-oriented delegation.
    rel: alternative
    sources:
      - https://github.com/nosarthur/gita#alternatives
      - https://myrepos.branchable.com/README
  - id: brew:mu-repo
    reason: >
      Choose mu-repo for recursively discovering repositories and running Git or shell
      commands in parallel; choose Gita for its registered-repository dashboard, groups,
      and customizable status display.
    rel: alternative
    sources:
      - https://github.com/nosarthur/gita#alternatives
      - https://github.com/fabioz/mu-repo#readme
  - id: brew:repo
    reason: >
      Choose Android's repo tool when a manifest should define and synchronize a
      coordinated source tree; choose Gita to manage an ad hoc collection of otherwise
      independent Git checkouts.
    rel: alternative
    sources:
      - https://github.com/nosarthur/gita#alternatives
      - https://source.android.com/docs/setup/reference/repo
