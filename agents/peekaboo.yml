config-file-location:
  macos:
    - ~/.peekaboo/config.json
credentials-file-location:
  macos:
    - ~/.peekaboo/credentials
history:
  adoption-history:
    - >
      Peekaboo is distributed as a macOS command-line tool through Homebrew and as an
      npm-launched MCP server, with a separate menu-bar application available from
      project releases.
    - >
      Its MCP surface and agent skill are documented for AI clients including Codex,
      Claude Code, and Cursor, broadening the project from a shell utility into agent
      infrastructure.
  package-nerd-significance:
    - >
      Peekaboo exposes macOS screen capture, Accessibility data, and native input
      automation through one scriptable CLI and MCP tool surface. It is notable for
      packaging operating-system permissions, UI inspection, automation primitives,
      AI-provider configuration, and an agent runtime into a composable local tool.
    - >
      The project also separates CLI, MCP, app, library, daemon, and bridge-host
      surfaces, illustrating the packaging complexity of modern desktop automation tools
      that must coordinate macOS privacy permissions and agent clients.
  project-history:
    - >
      Peekaboo developed from a macOS screen-capture and visual-question-answering
      utility into a broader automation toolkit. Current official documentation
      describes capture, accessibility-tree inspection, clicks and typed input,
      application and window control, natural-language agent runs, MCP exposure, a warm
      daemon, and a bridge host.
  related-projects:
    - >
      Codex, Claude Code, and Cursor are documented MCP clients for Peekaboo's
      desktop-automation tools.
    - >
      The official repository identifies PeekabooWin and PeekabooX as community
      Windows-first and Linux-first rewrites of its automation loop.
  sources:
    - https://github.com/openclaw/Peekaboo#readme
    - https://peekaboo.sh/
    - https://peekaboo.sh/configuration.html
  summary:
    - >
      Peekaboo is a macOS automation toolkit that captures the screen, inspects
      accessibility elements, drives native input and application controls, runs agent
      workflows, and exposes the same primitives through MCP.
  timeline:
    - >
      Current: Peekaboo provides CLI, MCP server, menu-bar app, embeddable Swift
      library, daemon, and bridge-host surfaces.
    - >
      Current: official documentation supports Homebrew installation for the CLI and npm
      invocation for MCP clients.
  usage:
    - >
      People use Peekaboo to capture screens or windows, inspect accessible UI elements,
      click, type, scroll, drag, invoke menus and dialogs, manage applications and
      Spaces, or run multi-step instructions through its agent.
    - >
      MCP clients can launch Peekaboo over stdio and use the same observation and action
      tools. Screen Recording and Accessibility permissions are required for the
      corresponding macOS capabilities.
    - >
      Hosted AI providers are optional for direct automation but required for
      model-driven agent workflows; their settings and credentials are managed beneath
      `~/.peekaboo`.
related-packages:
  - id: cask:codex
    reason: >
      Peekaboo officially supports Codex as an MCP client, allowing Codex workflows to
      inspect and automate the macOS desktop through Peekaboo's tool server.
    rel: adjacent_workflow
    sources:
      - https://peekaboo.sh/
      - https://peekaboo.sh/quickstart.html
      - https://developers.openai.com/codex
  - id: cask:claude-code
    reason: >
      Peekaboo officially supports Claude Code as an MCP client, giving Claude Code
      access to its screen-inspection and native macOS automation primitives.
    rel: adjacent_workflow
    sources:
      - https://peekaboo.sh/
      - https://peekaboo.sh/quickstart.html
      - https://code.claude.com/docs/en/overview
