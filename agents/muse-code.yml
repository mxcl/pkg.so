id: cask:muse-code
display-name: Muse
repo: null
docs:
  - https://dev.meta.ai/
config-file-location:
  unix:
    - ~/.config/muse/settings.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Meta released Muse Code as a public beta in August 2026 and brought it out of beta
      later that month with inter-session messaging, workflows, rewind support, and a
      developer-preview SDK.
    - >
      The tool supports interactive terminal sessions and headless execution for scripts
      and continuous-integration pipelines, broadening it beyond conversational coding
      into automation.
  package-nerd-significance:
    - >
      Muse Code belongs to the rapidly developing class of terminal-native AI coding
      agents distributed as standalone binaries. Package-manager installation makes it
      easier to provision consistently beside established tools such as compilers,
      linters, and version-control clients.
    - >
      Its support for AGENTS.md instructions, skills, hooks, MCP servers, subagents,
      sandboxing, and event-sourced sessions makes it especially relevant to users who
      treat agent behavior as configurable developer infrastructure.
  project-history:
    - >
      Meta introduced Muse Code on August 5, 2026 as a purpose-built coding agent
      powered by Muse Spark 1.2, initially in beta.
    - >
      On August 31, 2026, Meta announced that Muse Code was out of beta and introduced
      additional coordination features and an SDK developer preview.
  related-projects:
    - Muse Spark
    - Meta Model API
    - Muse Code SDK
    - Model Context Protocol
  sources:
    - https://dev.meta.ai/docs/muse-code
    - https://dev.meta.ai/docs/muse-code/changelog
    - https://dev.meta.ai/resources/blog/build-with-muse-code
    - https://dev.meta.ai/resources/blog/muse-code-new-plans-and-features
  summary:
    - >
      Muse Code is Meta's terminal and CI coding agent, powered by Muse Spark and
      designed to plan, edit files, run commands, and coordinate longer
      software-engineering workflows.
  timeline:
    - '2026-08-05: Meta released Muse Code in beta with Muse Spark 1.2.'
    - >
      2026-08-31: Meta brought Muse Code out of beta and announced new coordination
      features and an SDK preview.
  usage:
    - >
      Run `muse` inside a project for an interactive terminal session or `muse exec` for
      a single headless task.
    - >
      Users can configure model behavior, permissions, MCP servers, hooks, workflows,
      project instructions, and memory. Authentication is available through browser
      sign-in, a stored API key, or the `META_API_KEY` environment variable.
