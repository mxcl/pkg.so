id: brew:drill
display-name: Drill
repo: null
docs:
  - https://github.com/fcsonline/drill#readme
  - https://github.com/fcsonline/drill/blob/master/SYNTAX.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Drill reached users through GitHub release binaries, cargo install, crates.io, and
      Homebrew. Its packaging footprint is significant for a small utility because the
      same executable appeals to Rust users, macOS package users, and teams that want
      benchmark definitions committed as text files.
  package-nerd-significance:
    - >
      Drill sits in the practical CLI niche between tiny one-shot HTTP benchmark tools
      and large test suites. Its appeal is package-manager friendly: a single Rust
      binary plus YAML files, with no JVM runtime and no service to operate.
  project-history:
    - >
      The public repository was created in May 2017. Its README states the project goal
      plainly: build a lightweight alternative to load-testing tools that require the
      JVM, using Rust and YAML benchmark files.
  related-projects:
    - Ansible influenced Drill's YAML syntax style.
    - Cargo and crates.io are documented installation channels alongside release binaries.
    - rustls is used for TLS, removing the older OpenSSL build requirement.
  sources:
    - https://github.com/fcsonline/drill
    - https://raw.githubusercontent.com/fcsonline/drill/master/README.md
    - https://raw.githubusercontent.com/fcsonline/drill/master/SYNTAX.md
    - https://formulae.brew.sh/formula/drill
    - https://formulae.brew.sh/api/formula/drill.json
  summary:
    - >
      Drill is a Rust HTTP load-testing CLI that describes benchmark scenarios in YAML
      and executes them with concurrency, interpolation, assertions, CSV input, cookies,
      and threshold checks.
  timeline:
    - '2017: Public fcsonline/drill repository created.'
    - '2017: First public tags in the 0.3.x series appear.'
    - '2026: Homebrew stable formula packages drill 0.9.1.'
  usage:
    - >
      Users write benchmark.yml files with concurrency, iterations, ramp-up, a base URL,
      and a plan of requests. The syntax supports includes, assignments, assertions,
      request dependencies, CSV-driven item expansion, tags, and environment
      interpolation.
related-packages:
  - id: brew:k6
    reason: >
      Choose k6 when load tests should be expressed as JavaScript or TypeScript and need
      multiple protocols, extensibility, richer metrics outputs or distributed/cloud
      execution; choose Drill for compact YAML-defined HTTP scenarios.
    rel: alternative
    sources:
      - https://github.com/fcsonline/drill#readme
      - https://github.com/grafana/k6/blob/master/README.md
