history:
  adoption-history:
    - >
      LuaRadio is niche compared with GNU Radio, but it is packaged by Homebrew and
      MacPorts and has an official comparison path for GNU Radio users. Its adoption is
      mainly among SDR users who want scriptable flow graphs without the larger GNU
      Radio stack.
  package-nerd-significance:
    - >
      LuaRadio is interesting in package history because it shows LuaJIT's FFI-centered
      niche outside web stacks: a small scripting runtime used for native-adjacent
      signal-processing workflows.
    - >
      For package maintainers, the dependencies on LuaJIT, FFTW, and liquid-dsp matter
      more than the command-line executable itself. The package gives SDR users a
      compact alternative to installing a larger radio framework.
  project-history:
    - >
      LuaRadio presents itself as a framework for building signal-processing flow
      graphs. Its official README emphasizes a small binary footprint, no hard external
      dependencies, and LuaJIT FFI as the bridge to accelerated libraries and SDR
      hardware.
  related-projects:
    - LuaJIT provides the runtime and FFI layer.
    - GNU Radio is the larger flow-graph SDR framework LuaRadio users often compare against.
    - liquid-dsp and FFTW are common native DSP dependencies in packaged builds.
  sources:
    - https://github.com/vsergeev/luaradio
    - https://luaradio.io/docs/getting-started.html
    - source_facts.package-manager
  summary:
    - >
      LuaRadio is a lightweight flow-graph signal-processing framework for
      software-defined radio, written for LuaJIT and usable both as a command-line
      runner and as an embeddable scripting engine.
  timeline:
    - '2010s: LuaRadio develops as a LuaJIT-based SDR flow-graph framework.'
    - '2020s: Homebrew ships LuaRadio with LuaJIT, FFTW, and liquid-dsp dependencies.'
    - >
      2026: The upstream repository continues to present LuaRadio as lightweight and
      embeddable.
  usage:
    - >
      A typical LuaRadio program requires the radio package, builds blocks such as
      sources, mixers, filters, throttles, and sinks, connects them through a
      CompositeBlock, and runs the graph with the luaradio runner.
    - >
      Common use cases include rapid prototyping of software radios, modulation and
      demodulation utilities, signal-processing experiments, and embedding Lua-defined
      processing in an existing radio application.
related-packages:
  - id: brew:gnuradio
    reason: >
      Choose GNU Radio when you need its larger block ecosystem, broader hardware
      support, graphical flow-graph tooling, or higher overall maturity; choose LuaRadio
      for a smaller, script-first and embeddable workflow.
    rel: alternative
    sources:
      - https://luaradio.io/docs/comparison-gnuradio.html
      - https://www.gnuradio.org/
  - id: brew:librtlsdr
    reason: >
      LuaRadio's RtlSdrSource uses librtlsdr to receive samples from inexpensive RTL-SDR
      USB devices.
    rel: adjacent_workflow
    sources:
      - https://luaradio.io/docs/supported-hardware.html
      - https://github.com/steve-m/librtlsdr#readme
  - id: brew:hackrf
    reason: >
      LuaRadio provides HackRF source and sink blocks through libhackrf, enabling
      receive and transmit flow graphs with HackRF hardware.
    rel: adjacent_workflow
    sources:
      - https://luaradio.io/docs/supported-hardware.html
      - https://hackrf.readthedocs.io/en/latest/
  - id: brew:luajit
    reason: >
      LuaRadio is built on LuaJIT and uses its FFI to access acceleration libraries and
      SDR hardware interfaces.
    rel: adjacent_workflow
    sources:
      - https://luaradio.io/
      - https://luajit.org/extensions.html
