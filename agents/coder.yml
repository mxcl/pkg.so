id: brew:coder
display-name: Coder
repo: null
docs:
  - https://coder.com/docs
config-file-location:
  linux:
    - ~/.config/coderv2/url
  macos:
    - ~/Library/Application Support/coderv2/url
credentials-file-location:
  linux:
    - ~/.config/coderv2/session
history:
  adoption-history:
    - >
      Coder sits in the remote-development lineage that includes code-server, web IDEs,
      SSH-based development, JetBrains Gateway, VS Code Remote, and Kubernetes-backed
      workspaces. Its adoption path has been strongest among platform teams that want
      centrally managed, self-hosted development environments rather than a purely
      hosted SaaS.
  package-nerd-significance:
    - >
      For package-manager users, Coder is significant because a single CLI bootstraps a
      full remote-development control plane. Homebrew, Nix, Scoop, and winget packaging
      make the same binary reachable across developer laptops, CI machines, and
      self-hosted servers.
  project-history:
    - >
      Coder Technologies lists its founding date as August 2017. The modern coder/coder
      project is the open-source Coder v2 line, with workspaces defined in Terraform and
      a single coder CLI used for both server and client workflows.
  related-projects:
    - >
      Related projects include code-server, coder/registry modules and templates,
      Terraform, Kubernetes, Docker, Dev Containers, VS Code Remote, JetBrains Gateway,
      Mutagen, and web IDE tools such as Jupyter.
  sources:
    - https://coder.com/docs.md
    - https://coder.com/docs/install.md
    - https://github.com/coder/coder
    - https://formulae.brew.sh/api/formula/coder.json
  summary:
    - >
      Coder is an open-source, self-hosted platform and CLI for running cloud
      development environments and AI coding agents on infrastructure controlled by the
      user or organization.
  timeline:
    - '2017: Coder Technologies founding date listed in official site metadata.'
    - '2022: Public v0.1.0 tag appears in the coder/coder repository lineage.'
    - '2023: v2.0.0 tag appears in the coder/coder repository lineage.'
    - >
      2026: Homebrew formula distributes Coder 2.33.11 while Coder docs show the v2
      documentation line.
  usage:
    - >
      Users install the coder binary, start a server with coder server, log in with
      coder login, and connect to workspaces through IDEs, terminals, SSH, or web
      interfaces. Administrators define reusable workspace templates with Terraform,
      then manage users, images, policies, and infrastructure centrally.
related-packages:
  - id: brew:code-server
    reason: >
      Coder officially supports code-server as its VS Code-in-the-browser workspace
      application and provides a template module that installs and exposes it through
      Coder.
    rel: adjacent_workflow
    sources:
      - https://coder.com/docs/code-server/coder
      - https://coder.com/docs/user-guides/workspace-access/web-ides
      - https://github.com/coder/code-server
