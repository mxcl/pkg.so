history:
  adoption-history:
    - >
      Invoker is offered as a cross-platform desktop product for macOS, Windows, and
      Linux. It supports local Laravel projects and remote projects reached through SSH.
  package-nerd-significance:
    - >
      Invoker packages several Laravel maintenance workflows into a desktop interface
      without requiring source changes to the managed application. It is particularly
      notable as a framework-specific alternative to combining database clients,
      command-line tools, mail previewers, and custom admin scaffolding.
  project-history:
    - >
      Beyond Code developed Invoker as a commercial desktop companion for Laravel
      applications. Its official community repository is used for support and issue
      reporting rather than publishing the application source.
  related-projects:
    - Laravel is the PHP application framework managed by Invoker.
    - >
      Beyond Code maintains an official invoker-community repository for community
      information and support.
  sources:
    - https://github.com/beyondcode/invoker-community
    - https://invoker.dev/
  summary:
    - >
      Invoker is Beyond Code’s cross-platform desktop tool for inspecting and operating
      Laravel applications through an automatically generated admin interface and
      development utilities.
  timeline:
    - Invoker was introduced by Beyond Code as a dedicated desktop developer tool for Laravel.
    - >
      Invoker 2: The current major product line adds local and SSH-connected project
      management through a cross-platform application.
  usage:
    - >
      Developers open local projects or connect to remote Laravel installations over
      SSH. Invoker can browse and edit application data through its instant admin panel,
      preview emails, trigger jobs and commands, execute PHP code, and add functionality
      through plugins.
