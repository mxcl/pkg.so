config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      httm reached package-manager users through crates.io and later through system
      package channels represented in the input metadata, including Homebrew, Alpine,
      and Nix. GitHub topics and README examples place its audience among ZFS, btrfs,
      FreeBSD, Linux, homelab, and shell users.
  package-nerd-significance:
    - >
      The package is interesting because it turns filesystem snapshot plumbing into a
      small composable CLI. The related ounce and bowie tools show the same package-nerd
      pattern: wrap a focused executable into shell workflows for dynamic snapshots and
      diffing historical file versions.
  project-history:
    - >
      The GitHub repository was created in March 2022, and crates.io records the httm
      crate beginning in May 2022. The project grew around a Unix idea: expose snapshot
      history at the file level, rather than treating snapshots mainly as dataset-wide
      rollback machinery.
  related-projects:
    - >
      Related tools include ZFS and btrfs snapshot tooling, NILFS2, Apple Time Machine,
      Restic, and httm-adjacent wrappers such as ounce and bowie.
  sources:
    - >
      Official GitHub README, author project article, crates.io metadata, and GitHub
      release metadata.
  summary:
    - >
      httm is a Rust command-line tool for finding and restoring file-level versions
      from snapshot and backup systems. Its own README frames it as a CLI Time Machine
      for ZFS, btrfs, NILFS2, Time Machine, and Restic-style storage.
  timeline:
    - '2022: The kimono-koans/httm repository was created on GitHub.'
    - '2022: The httm crate appeared on crates.io.'
    - >
      2022: The author described httm's inspiration in file-level ZFS and btrfs snapshot
      workflows.
    - '2024: Release notes included macOS local snapshot support in the 0.35 line.'
  usage:
    - >
      Users run httm against one or more paths to print unique versions by size and
      modification time, browse versions interactively, output JSON, find deleted files
      in snapshots, and work with alternate stores such as Time Machine or mounted
      Restic repositories.
related-packages:
  - id: brew:restic
    reason: >
      httm can browse file versions from a Restic repository after `restic mount`
      exposes that repository as a filesystem and `httm --alt-store=restic` selects it.
    rel: adjacent_workflow
    sources:
      - https://github.com/kimono-koans/httm#readme
      - https://restic.readthedocs.io/en/stable/050_restore.html
