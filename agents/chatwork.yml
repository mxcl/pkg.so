history:
  adoption-history:
    - >
      Chatwork became a major business-chat service in Japan. The company reported in
      2023 that it had been the country's leading business chat by user count for five
      consecutive years and was used by more than 410,000 companies.
  package-nerd-significance:
    - >
      The cask packages the desktop companion to a cloud service rather than an
      independently operated chat server. Its value is convenient, repeatable
      installation of the native client for organizations standardized on Chatwork.
  project-history:
    - >
      Chatwork began service in March 2011 as a business communication product focused
      on replacing fragmented email and telephone workflows with persistent group chat.
    - >
      In July 2024, the company formerly named Chatwork Co., Ltd. changed its corporate
      name to kubell Co., Ltd.; the Chatwork product name remained in use.
  related-projects:
    - Chatwork web application
    - Chatwork mobile applications
  sources:
    - 'Official Chatwork help: https://help.chatwork.com/hc/ja/articles/900001009643'
    - >
      Official kubell adoption announcement:
      https://www.kubell.com/news/2023/10/nielsen-report-no1.html
    - 'Official kubell corporate history note: https://corp.chatwork.com/ja/kubell/'
    - source_facts.package-manager
  summary:
    - >
      Chatwork is a business-oriented group communication service with chat, task,
      file-sharing, and calling features, delivered through web, desktop, and mobile
      clients.
  timeline:
    - '2011-03: Chatwork service launched.'
    - '2023: The operator reported more than 410,000 adopting companies.'
    - '2024-07: Chatwork Co., Ltd. changed its corporate name to kubell Co., Ltd.'
  usage:
    - >
      The desktop client supports group and direct chat, task coordination, file
      sharing, and voice or video communication. Users sign in with their Chatwork email
      address and password, and the same account synchronizes data across devices.
