history:
  adoption-history:
    - >
      libpagemaker's adoption is mostly indirect: it belongs to the DLP family of import
      libraries used by document tools rather than being an end-user application. The
      DLP site lists LibreOffice, Calligra, Inkscape, Scribus, AbiWord, and related
      software among users of its import-library ecosystem.
  package-nerd-significance:
    - >
      libpagemaker is niche but culturally important in package collections: it is the
      kind of small format-rescue library that keeps old proprietary files recoverable.
      Its value is less daily command-line use and more making sure a distribution can
      open documents that would otherwise be stranded.
  project-history:
    - >
      The Document Liberation Project was created under The Document Foundation in April
      2014 to give proprietary document-format import libraries a shared home.
      libpagemaker fits that mission by preserving access to PageMaker files, a legacy
      desktop-publishing format that otherwise depends on old commercial software.
    - >
      The Document Foundation reported libpagemaker 0.0.3 in March 2016 with improved
      parsing for big-endian Mac files. In January 2018, The Document Liberation Project
      announced libpagemaker alongside other libraries originally developed for
      LibreOffice 6.0, describing it as an importer for PageMaker 6 and 7 documents.
  related-projects:
    - librevenge provides shared document interfaces and common types for DLP libraries.
    - >
      libmspub, libqxp, libabw, libfreehand, and other DLP libraries cover neighboring
      legacy document and publishing formats.
    - >
      LibreOffice and Scribus are natural downstream applications for document-import
      libraries in this family.
  sources:
    - >
      https://blog.documentfoundation.org/blog/2016/06/17/document-liberation-project-progress-so-far-in-2016/
    - https://blog.documentfoundation.org/blog/2018/01/22/dlp-five-new-libraries/
    - https://wiki.documentfoundation.org/DLP/Libraries/libpagemaker
    - https://www.documentliberation.org/about/
    - https://www.documentliberation.org/projects/
  summary:
    - >
      libpagemaker is a Document Liberation Project library for importing Aldus/Adobe
      PageMaker documents, with command-line converters such as pmd2raw, pmd2svg, and
      pmd2text.
  timeline:
    - '2014: The Document Liberation Project was born under The Document Foundation.'
    - >
      2016: The Document Foundation reported libpagemaker 0.0.3 with big-endian Mac-file
      support.
    - >
      2018: The Document Liberation Project announced libpagemaker as a PageMaker 6/7
      import library developed for LibreOffice 6.0.
  usage:
    - >
      The package is useful for document-conversion workflows that need to extract text,
      SVG, or raw structure from old PageMaker files. It is also packaging
      infrastructure for office-suite import filters, where a narrow library can be
      updated independently of a larger application.
