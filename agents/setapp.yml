history:
  adoption-history:
    - >
      The invite-only beta attracted 30,000 signups in under two months. Setapp's
      official milestone history says the catalog reached 100 apps and the service
      reached 300,000 users by the end of 2017. It later expanded beyond Mac apps to
      compatible iOS and web applications.
  package-nerd-significance:
    - >
      Setapp is notable as an alternative distribution and monetization channel in the
      Mac software ecosystem. Instead of purchasing and maintaining many individual
      licenses, users can discover, install, update, and run a curated catalog through
      one client and membership.
  project-history:
    - >
      MacPaw conceived Setapp in 2016 as a subscription platform for curated Mac
      software, secured partnerships for an invite-only beta, and publicly launched it
      in January 2017 with 61 applications.
    - >
      The platform subsequently added annual plans, recommendations, more languages,
      iOS-compatible applications, and additional purchasing options while retaining
      centralized discovery and updates.
  related-projects:
    - MacPaw
    - CleanMyMac
    - Setapp Mobile
  sources:
    - 'Official about page: https://setapp.com/about'
    - 'Official company milestones: https://setapp.com/news/company-updates'
    - 'Official launch announcement: https://macpaw.com/news/setapp-launched'
    - >
      Official support overview:
      https://support.setapp.com/hc/en-us/articles/213269709-What-is-Setapp
  summary:
    - >
      Setapp is a MacPaw-created software discovery, installation, and subscription
      platform centered on a curated catalog of productivity applications.
  timeline:
    - '2016: MacPaw began developing Setapp and opened invite-only beta access.'
    - 'January 2017: Setapp launched publicly with 61 curated Mac applications.'
    - 'November 2017: The catalog reached 100 applications.'
    - '2020: Setapp added access to compatible iOS applications.'
  usage:
    - >
      Users sign in to the Setapp desktop client, browse or search its catalog, and
      install applications on demand. The client also manages application access and
      automatic updates; account and subscription administration are available through
      Setapp's account services.
