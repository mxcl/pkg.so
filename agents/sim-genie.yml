history:
  adoption-history:
    - >
      The official site presents Sim Genie as a commercial macOS utility with a fully
      featured trial. Its supported workflows target developers, testers, and teams
      preparing screenshots or recordings from Apple simulators; no broader adoption
      statistics are published.
  package-nerd-significance:
    - >
      Sim Genie packages many operations otherwise reached through Xcode, Simulator
      menus, or command-line tools into one menu-bar utility. Its built-in stdio MCP
      server also makes Simulator automation available to compatible coding agents.
  project-history:
    - >
      Breakpoint Studio developed Sim Genie as a macOS menu-bar companion for Xcode
      Simulator. The available official material emphasizes the continuing expansion of
      Simulator workflow shortcuts rather than publishing a dated release history.
  related-projects:
    - >
      Sim Genie relies on Xcode's Simulator command-line tooling and follows the toolset
      selected through xcode-select.
    - >
      Its bundled MCP server can be configured in clients supporting the Model Context
      Protocol.
  sources:
    - https://simgenie.app/
    - https://simgenie.app/faq/
  summary:
    - >
      Sim Genie is a commercial macOS menu-bar utility that exposes additional Xcode
      Simulator operations for development, testing, and marketing workflows.
  timeline:
    - >
      Undated: Breakpoint Studio introduced Sim Genie as an Xcode Simulator menu-bar
      companion.
    - 'Undated: Sim Genie added a bundled MCP server for agent-driven Simulator interaction.'
  usage:
    - >
      Developers use Sim Genie to simulate GPS routes, send deep links and push
      notifications, control permissions, record Simulator output, adjust status bars,
      preserve and restore test snapshots, inspect application sandboxes, and clear
      derived data.
