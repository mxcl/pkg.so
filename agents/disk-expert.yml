credentials-file-location: null
history:
  adoption-history:
    - >
      Nektony distributes the application directly and through the Mac App Store,
      offering both subscription and one-time licenses. Official materials position it
      as a standalone utility and as part of the MacCleaner Pro suite.
  package-nerd-significance:
    - >
      The package illustrates a common cask-maintenance wrinkle: the established package
      identifier and download path retain the older "Disk Expert" name while current
      vendor-facing branding says "Disk Space Analyzer" and the installed bundle is
      version-branded. Curators must distinguish product renaming from a wholly
      different package.
  project-history:
    - >
      Nektony's disk-analysis utility was historically branded Disk Expert and is now
      marketed as Disk Space Analyzer. The vendor's detailed release log documents
      sustained development through versions 4, 5, and 6, including interface redesigns,
      faster scanning, search, CSV export, file operations, cloud-storage analysis, and
      compatibility updates for new macOS releases.
  related-projects:
    - >
      Disk Space Analyzer is also bundled with Nektony's MacCleaner Pro suite alongside
      App Cleaner & Uninstaller, Duplicate File Finder, Memory Cleaner, and Funter.
  sources:
    - https://nektony.com/disk-expert
    - https://nektony.com/disk-expert/buy
    - https://nektony.com/disk-expert/download
  summary:
    - >
      Disk Space Analyzer, formerly branded Disk Expert, is Nektony's macOS disk-usage
      utility. It scans local, external, mounted-image, and cloud storage and visualizes
      file and folder sizes to help users locate and manage large items.
  timeline:
    - '2024-03: Version 4.2 refreshed settings and incorporated user-requested improvements.'
    - '2024-10: Version 5.0 redesigned the interface and added Pro file operations.'
    - '2025-07: Version 5.2 added CSV report export and macOS Tahoe compatibility work.'
    - '2025-10: Version 6.0 delivered a complete redesign.'
    - >
      2026-06: The official download page recorded a current update supporting recent
      macOS releases.
  usage:
    - >
      Users scan a disk, folder, external device, disk image, or cloud location and
      inspect an interactive size visualization and largest-file lists. Paid
      capabilities include deleting, copying, or moving items, scanning additional
      locations, analyzing purgeable space, and exporting CSV reports.
