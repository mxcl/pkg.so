history:
  adoption-history:
    - >
      ConnectMeNow began as the author's personal solution for faster access to network
      shares and was subsequently published as a free macOS utility. Its protocol
      support grew beyond the original SMB use case to include AFP, NFS, WebDAV, FTP,
      SSH, and SSHFS.
    - >
      Version 4 added native Apple Silicon and Intel builds, reduced polling, introduced
      multithreaded mount and status tasks, and retained configuration import from
      version 3.
  package-nerd-significance:
    - >
      ConnectMeNow wraps several Unix and macOS network-mount workflows in a menu-bar
      interface while retaining features useful to administrators, including custom
      mount paths, fallback servers, Wake-on-LAN, scripts, SSH keys, and share
      configuration backups.
    - >
      Its preferences are inspectable files in the user's Library, making backup and
      managed deployment more approachable than utilities that keep all state in opaque
      cloud storage.
  project-history:
    - >
      The developer created ConnectMeNow to reduce the repetitive Finder workflow
      required to mount network shares. The earliest design focused on SMB, then
      broadened into a menu-driven connection manager for multiple filesystem and
      remote-access protocols.
    - >
      ConnectMeNow 4 was rewritten from scratch to reduce system load and beachballing,
      use event-driven techniques and task-based operations, and support both Intel and
      Apple Silicon Macs.
  related-projects:
    - macFUSE is required for ConnectMeNow's SSHFS functionality.
    - >
      macOS Finder and the system network-filesystem APIs provide the underlying
      mounted-volume experience.
    - ConnectMeNow version 3 is the predecessor from which version 4 can import configuration.
  sources:
    - >
      https://www.tweaking4all.com/os-tips-and-tricks/macosx-tips-and-tricks/connect-network-shares-mac/
    - https://www.tweaking4all.com/software/macosx-software/connectmenow-v4/
  summary:
    - >
      ConnectMeNow is a free macOS menu-bar utility for mounting network shares and
      opening SSH connections with saved, automatable connection settings.
  timeline:
    - >
      2015: The developer documented the earlier ConnectMeNow workflow for quickly
      connecting macOS network shares.
    - >
      2022: ConnectMeNow 4 was introduced as a from-scratch build with native Intel and
      Apple Silicon variants.
    - >
      2023: Version 4 added automatic encryption of plaintext usernames and passwords
      found in manually edited configuration.
    - '2024: Version 4 added further configuration-backup safeguards.'
  usage:
    - >
      Create share entries with a server, protocol, remote path, mount behavior, and
      optional username or password. Entries can be mounted or unmounted from the menu
      and revealed in Finder.
    - >
      Automatic mounting can be tied to startup, wake, network changes, or server
      availability. SSH and SSHFS entries can use passwords or SSH keys; the developer
      notes that usernames and passwords stored in the INI configuration are encrypted
      automatically.
