id: brew:chrony
display-name: chrony
repo: https://gitlab.com/chrony/chrony
docs:
  - https://chrony-project.org/documentation.html
  - https://chrony-project.org/doc/latest/chrony.conf.html
config-file-location:
  unix:
    - /etc/chrony.conf
credentials-file-location:
  unix:
    - /etc/chrony.keys
history:
  adoption-history:
    - >
      The official download page says most Linux distributions and BSD systems provide a
      chrony package and recommends using those packages because they are integrated
      with service files and networking scripts. The supplied package facts list broad
      packaging across apk, Homebrew, Debian, dnf, MacPorts, Nix, pacman, Ubuntu, and
      zypper.
  package-nerd-significance:
    - >
      chrony is a classic system package: small, daemon-oriented, security-sensitive,
      and heavily integrated with init systems and distribution defaults. It is also one
      of the packages where downstream packaging choices matter because service users,
      default config paths, network-online behavior, and crypto support affect the
      correctness of the system clock.
  project-history:
    - >
      The official site says chrony was originally written by Richard Curnow and is
      currently maintained by Miroslav Lichvar. Its release archive reaches back to the
      1.x series, and the current source repository is hosted on GitLab.
    - >
      chrony was designed to work well with intermittent network access, congested
      networks, temperature-sensitive clocks, systems that suspend or do not run
      continuously, and virtual machines.
  related-projects:
    - >
      Related projects and alternatives include ntp, ntpsec, OpenNTPD,
      systemd-timesyncd, pool.ntp.org, GPS/PPS reference-clock tooling, and Network Time
      Security implementations.
  sources:
    - https://chrony-project.org/index.html
    - https://chrony-project.org/download.html
    - https://chrony-project.org/documentation.html
    - https://chrony-project.org/doc/latest/chrony.conf.html
    - https://chrony-project.org/faq.html
    - https://chrony-project.org/comparison.html
  summary:
    - >
      chrony is a long-running GPLv2 implementation of NTP with a daemon, chronyd, and a
      control CLI, chronyc, designed for accurate clock synchronization under difficult
      real-world network and hardware conditions.
  timeline:
    - '2000s: 1.x tarballs available in the official release archive.'
    - '2020: 4.0 series began after the 3.x line.'
    - '2024: 4.6 added newer NTP and PTP-related configuration options.'
    - '2025: 4.7 added systemd Type=notify support and other daemon improvements.'
    - '2025: 4.8 released as the latest stable release on the official download page.'
  usage:
    - >
      chronyd runs as the time-synchronization daemon, while chronyc monitors and
      changes daemon parameters. A common configuration points chrony.conf at NTP
      servers or pools, stores drift, allows initial clock stepping, and may use
      /etc/chrony.keys for symmetric-key authentication.
related-packages:
  - id: brew:ntp
    reason: >
      NTP supplies the traditional reference-style ntpd toolchain; choose it when
      compatibility with that implementation and its established utilities matters more
      than chrony's faster convergence and difficult-network behavior.
    rel: alternative
    sources:
      - https://chrony-project.org/comparison
      - https://www.ntp.org/documentation
tags:
