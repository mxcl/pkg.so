id: brew:dmenu
display-name: dmenu
repo: https://git.suckless.org/dmenu
docs:
  - https://tools.suckless.org/dmenu
config-file-location:
  unix:
    - 'source tree: config.h (generated from config.def.h)'
    - 'source tree: config.mk'
credentials-file-location: null
history:
  adoption-history:
    - >
      dmenu became a standard suckless tool because it composes through stdin and
      stdout: scripts can pass newline-separated choices in, and dmenu prints the
      selected item out. Its official manual also documents dmenu_run, the script used
      by dwm to list programs in PATH and run the selected command.
  package-nerd-significance:
    - >
      dmenu is significant because it is tiny, source-customizable X11 infrastructure
      rather than a full desktop launcher. It appears in package managers as a small
      dependency-free-ish building block for window-manager users, shell scripts, and
      Unix workflows that prefer composition over integrated desktop services.
  project-history:
    - >
      The official suckless page describes dmenu as a dynamic menu for X that was
      originally designed for dwm and manages large numbers of user-defined menu items
      efficiently. The official git refs show public tagged releases beginning at 0.1 in
      August 2006 and continuing through the 5.x series.
  related-projects:
    - The official page ties dmenu to dwm, and the man page cross-references dwm and stest.
  sources:
    - https://tools.suckless.org/dmenu
    - https://git.suckless.org/dmenu/refs.html
    - https://git.suckless.org/dmenu/file/dmenu.1.html
    - https://git.suckless.org/dmenu/file/README.html
  summary:
    - >
      dmenu is suckless.org's efficient dynamic menu for X, originally designed for dwm
      and commonly used as a keyboard-driven launcher or scriptable selector.
  timeline:
    - '2006-08: dmenu 0.1 tag appeared in the official git refs.'
    - '2009-02: dmenu 4.0 was tagged.'
    - '2020-09: dmenu 5.0 was tagged.'
    - '2025-08: dmenu 5.4 was released.'
  usage:
    - >
      In everyday package use, dmenu reads newline-separated items from stdin, narrows
      matches as the user types, and prints the chosen item on Return. Options cover
      bottom placement, case-insensitive matching, vertical lists, monitor selection,
      prompts, fonts, colors, and embedding into another X window.
related-packages:
  - id: brew:dwm
    reason: >
      Install dwm alongside dmenu when building the intended suckless X11 desktop
      workflow; dwm's official site specifically recommends dmenu for adding a wmii-like
      menu.
    rel: adjacent_workflow
    sources:
      - https://tools.suckless.org/dmenu/
      - https://dwm.suckless.org/
tags:
  - cli
  - launcher
