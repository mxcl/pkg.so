history:
  adoption-history:
    - >
      Pinwheel is positioned for designers and developers who maintain design systems,
      exchange variables with Figma, export tokens into application or web code, and
      repeatedly test color accessibility. Its document format is openly specified and
      intended to work with Git-based collaboration.
  package-nerd-significance:
    - >
      Pinwheel treats a design system as a buildable and testable artifact. Its
      command-line interface can export code and run accessibility checks in scripts,
      making the graphical Mac application relevant to version-controlled and automated
      development workflows.
  project-history:
    - >
      Bjango released Pinwheel 1.0 on November 19, 2024. The initial product focused on
      colors, gradients, aliases, code export, and repeatable WCAG and APCA contrast
      testing.
    - >
      Updates soon added Figma export support, numbers, booleans, strings, more color
      spaces, color-proofing tools, metadata, deprecation markers, command-line
      improvements, and macOS interface updates.
  related-projects:
    - >
      Bjango supplies a Pinwheel Figma plugin and publishes reusable export templates in
      Bjango DevKit. Pinwheel can import Figma, Sketch, CSS, asset-catalog, and Design
      Tokens JSON data.
  sources:
    - https://bjango.com/mac/pinwheel
    - https://diagnostics.bjango.com/help/pinwheel/commandline/
    - https://diagnostics.bjango.com/help/pinwheel/welcome/
    - https://register.bjango.com/mac/pinwheel/versionhistory/
  summary:
    - >
      Pinwheel is a commercial macOS design-system editor for colors and other tokens,
      code generation, Figma interchange, and automated accessibility testing.
  timeline:
    - '2024: Pinwheel 1.0 was released on November 19.'
    - >
      2025: Updates expanded token types, Figma workflows, color-space support, and
      color proofing.
    - >
      2026: Updates added metadata and deprecation fields and continued improving
      command-line and macOS integration.
  usage:
    - >
      Designers and developers create color ramps and semantic aliases, manage other
      design tokens, import variables from design tools, export code and asset formats,
      and run WCAG or APCA contrast tests. Builds and tests can also run through the
      bundled command-line interface.
