history:
  adoption-history:
    - >
      The application grew into a multi-platform service for Chinese-speaking learners
      of French. Official downloads are available for macOS, Windows, Linux, iOS,
      Android, and browser extensions, with one account supporting synchronized
      vocabulary, notes, and learning records.
  package-nerd-significance:
    - >
      Frhelper is notable to package users as a specialized bilingual reference suite
      rather than a simple dictionary database. It combines offline desktop reference
      material, system-wide word lookup, study tools, cloud synchronization, and newer
      AI-assisted translation features.
  project-history:
    - >
      法语助手, packaged on macOS as Frhelper, was developed by Shanghai Qianyan Network
      Technology for Chinese learners of French. Its core combines French–Chinese,
      Chinese–French, French–French, and French–English dictionaries with conjugation,
      pronunciation, translation, and vocabulary study.
    - >
      Official historical feature notes document continued development through at least
      the mid-2010s, including expanded dictionaries, examination vocabulary,
      example-sentence audio, improved synchronization, and WeChat login. The current
      product extends the same learning platform with document translation and
      configurable AI translation services.
  related-projects:
    - >
      The developer also distributes 每日法语听力, a related French listening application
      whose audio and example material is integrated into the learning ecosystem.
    - >
      Browser extensions provide lookup, translation, vocabulary-book, and review
      features alongside the desktop and mobile clients.
  sources:
    - https://www.eudic.net/Product/frhelper.aspx
    - https://www.eudic.net/v4/fr/app/download
    - https://www.eudic.net/v4/fr/app/frhelper
  summary:
    - >
      法语助手, known by the package name Frhelper, is a French–Chinese dictionary,
      translation, reading, and language-learning suite from Shanghai Qianyan Network
      Technology.
  timeline:
    - >
      2015: Official feature notes documented redesigned dictionary management,
      original-language examples, and vocabulary synchronization improvements.
    - >
      2016: The product added updated dictionaries, examination vocabulary, enhanced
      example audio, and WeChat login.
    - >
      2020s: The suite expanded across desktop, mobile, Linux, and browser-extension
      clients and added document and AI-assisted translation.
  usage:
    - >
      Learners look up French words and conjugations, translate text and documents, hear
      pronunciation, capture words from other applications, maintain vocabulary books
      and notes, and synchronize study records between devices.
