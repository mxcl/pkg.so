history:
  adoption-history:
    - >
      Surfshark grew from a VPN service into a broader consumer privacy and security
      suite available across desktop, mobile, browser, and router environments. The
      macOS client combines VPN connectivity with settings for ancillary protection
      features.
  package-nerd-significance:
    - >
      The Homebrew cask offers a command-line installation path for a mainstream
      proprietary VPN client. It is useful in managed or repeatable Mac setups where GUI
      applications are installed alongside developer tooling.
  project-history:
    - >
      Surfshark originated as a consumer VPN service and subsequently expanded its
      application into a privacy and security suite. The macOS client supports multiple
      VPN connection modes and centrally exposes application, account, and protection
      settings.
  related-projects:
    - >
      Surfshark also supplies clients for Windows, Linux, Android, iOS, browser
      extensions, and supported routers.
    - >
      The macOS application integrates Surfshark features including CleanWeb, MultiHop,
      Dedicated IP, and Antivirus where available.
  sources:
    - https://support.surfshark.com/hc/en-us/articles/360012791960-How-to-get-started
    - >
      https://support.surfshark.com/hc/en-us/articles/360022825034-How-to-set-up-Surfshark-VPN-on-macOS
    - source_facts.description
  summary:
    - >
      Surfshark is a commercial VPN and privacy client used to route network traffic
      through encrypted VPN connections and apply related security controls.
  timeline:
    - 'Late 2010s: Surfshark entered the consumer VPN market.'
    - >
      2020s: The client expanded beyond basic VPN connectivity with features such as
      MultiHop, CleanWeb, Rotating IP, Dedicated IP, and antivirus controls.
  usage:
    - >
      Users sign in with an active subscription, select a location, and establish a VPN
      connection. The macOS client also offers automatic connection, kill-switch
      behavior, protocol selection, MultiHop, NoBorders, and related privacy settings.
    - >
      Surfshark documents settings through its graphical interface rather than an
      officially supported user-editable configuration file.
