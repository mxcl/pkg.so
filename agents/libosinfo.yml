history:
  adoption-history:
    - >
      libosinfo became useful wherever virtual-machine front ends need to choose sane
      defaults for a guest: identifying ISO media, mapping an OS to supported virtual
      devices, finding install trees, and generating unattended-install scripts. Its
      value is strongest in Linux virtualization stacks because multiple applications
      can share the same operating-system knowledge instead of each shipping stale
      lists.
  package-nerd-significance:
    - >
      For package maintainers, libosinfo is a classic data-versus-code package: the
      library changes slowly, but the OS database needs frequent updates as
      distributions, Windows releases, and install media change. That split explains why
      package freshness can visibly affect VM creation dialogs and automated
      provisioning even when the hypervisor itself is working.
  project-history:
    - >
      The project published its first public libosinfo tag in October 2011, after
      establishing a model in which operating-system facts live in a common XML database
      and applications query them through a reusable library rather than carrying their
      own detection tables. The official site describes the project as three cooperating
      parts: metadata database, GObject API, and query/extraction tools.
    - >
      By 2016 the project had formalized adjacent pieces such as osinfo-db-tools for
      importing, exporting, validating, and packaging the database files, and libosinfo
      1.0.0 was tagged in October 2016. Later releases continued the steady maintenance
      pattern expected from low-level virtualization infrastructure: translation
      updates, build-system work, memory fixes, and compatibility with XML library
      changes.
  related-projects:
    - osinfo-db supplies the XML operating-system data consumed by libosinfo.
    - >
      osinfo-db-tools provides import, export, validation, and packaging tools for the
      database.
    - >
      libvirt and desktop virtualization front ends are the natural consumers of the
      metadata model because they need OS-aware guest defaults.
  sources:
    - https://gitlab.com/libosinfo/libosinfo/-/tags
    - https://gitlab.com/libosinfo/libosinfo/-/tags?page=2
    - https://gitlab.com/libosinfo/osinfo-db-tools
    - https://libosinfo.org/
    - https://libosinfo.org/download.html
  summary:
    - >
      libosinfo is the C/GObject library in the libosinfo family: a shared database,
      API, and set of command-line tools for describing guest operating systems,
      hypervisors, virtual hardware, install media, and installation resources used by
      virtualization provisioning tools.
  timeline:
    - '2011: libosinfo v0.0.1 was tagged as the first public release.'
    - '2016: osinfo-db-tools was created for managing libosinfo database files.'
    - '2016: libosinfo v1.0.0 was tagged.'
    - >
      2024: libosinfo 1.12.0 and osinfo-db-tools 1.12.0 release notes listed maintenance
      fixes, CI work, and translation updates.
  usage:
    - >
      Packagers usually split the ecosystem into libosinfo, osinfo-db, and
      osinfo-db-tools. The library is consumed by programs through the C API or GObject
      Introspection bindings, while users and maintainers interact with tools such as
      osinfo-query, osinfo-detect, osinfo-install-script, and osinfo-db-import.
related-packages:
  - id: brew:osinfo-db-tools
    reason: >
      Use osinfo-db-tools alongside libosinfo to import, export, validate, and package
      the operating-system database files that the library queries.
    rel: adjacent_workflow
    sources:
