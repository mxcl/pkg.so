credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as a desktop application for macOS, Linux, and Windows.
      Its official README documents Homebrew installation on macOS and an Arch User
      Repository package, reflecting adoption beyond direct release downloads.
  package-nerd-significance:
    - >
      React Native Debugger became useful to developers who wanted React Inspector,
      Redux DevTools, Apollo Client DevTools, and Chrome-style debugging in one desktop
      application. It also illustrates the transition away from React Native's legacy
      remote-debugger architecture: the maintainers explicitly caution that it supports
      the old Remote Debugger rather than Hermes, JSI, and the New Architecture.
  project-history:
    - >
      React Native Debugger was created as a standalone, enhanced version of React
      Native's official remote-debugger interface. It assembled several previously
      separate inspection tools into a single Electron desktop workflow.
  related-projects:
    - React Native Remote Debugger supplies the underlying debugging model.
    - React DevTools provides component inspection.
    - Redux DevTools and Apollo Client DevTools are integrated into the application.
    - >
      react-native-debugger-open supports opening debugger windows for React Native
      packager ports.
  sources:
    - https://github.com/jhen0409/react-native-debugger
    - >
      https://github.com/jhen0409/react-native-debugger/blob/master/docs/config-file-in-home-directory.md
    - https://github.com/jhen0409/react-native-debugger/tree/master/docs
  summary:
    - >
      React Native Debugger is an open-source standalone desktop debugger for React
      Native applications, combining the legacy remote debugger with React, Redux,
      Apollo, network, and console inspection tools.
  timeline:
    - >
      The project combined React Native's remote debugger with React Inspector and Redux
      DevTools in a standalone desktop application.
    - >
      Later releases added integrations such as Apollo Client DevTools and documented
      separate compatibility tracks for older React Native versions.
    - >
      The maintainers now characterize the application as a tool for the old Remote
      Debugger and direct users seeking Hermes, JSI, or New Architecture support to an
      ongoing project discussion.
  usage:
    - >
      Developers enable remote JavaScript debugging in a compatible React Native
      application and connect it to the desktop debugger. They can inspect components,
      Redux state and actions, Apollo data, network traffic, console output, and
      multiple packager ports. Application defaults such as fonts, window bounds, ports,
      editor integration, and network inspection can be placed in the JSON5-formatted
      ~/.rndebuggerrc file.
