history:
  adoption-history:
    - >
      Requestly broadened from browser-based request modification into a cross-platform
      ecosystem comprising an HTTP interceptor, desktop proxy, API client, mocks, and
      automation integrations.
    - >
      The desktop application extended interception to desktop programs, mobile devices,
      terminals, and browsers where extension-only interception is insufficient.
  package-nerd-significance:
    - >
      Requestly is significant to developer-tool users because it packages browser-style
      HTTP rewriting and mocking alongside a system-wide desktop proxy. It occupies
      territory shared by API clients, debugging proxies, browser extensions, and
      test-automation tools.
    - >
      Its open-source ecosystem is divided into focused repositories for the
      interceptor, desktop shell, proxy engine, mock server, web SDK, and automation
      integrations, while the newer API Client has a separate community surface.
  project-history:
    - >
      Requestly developed as a tool for intercepting and modifying HTTP requests and
      responses, with capabilities including redirects, header and body modification,
      script injection, API mocking, and traffic inspection.
    - >
      In 2026, Requestly reorganized its source repositories: HTTP Interceptor code
      moved to requestly/interceptor, the desktop repository was renamed to
      requestly/http-interceptor-desktop-app, and requestly/requestly became the API
      Client's community and issue hub.
  related-projects:
    - Requestly HTTP Interceptor
    - Requestly API Client
    - requestly-proxy
    - Requestly Mock Server
    - Requestly Web SDK
  sources:
    - https://docs.requestly.com/http-interception/getting-started/overview
    - https://docs.requestly.com/security-privacy/http-interceptor
    - https://github.com/requestly/http-interceptor-desktop-app#readme
    - https://github.com/requestly/requestly/issues/4737
    - https://requestly.com/
  summary:
    - >
      Requestly is a cross-platform developer tool for intercepting, inspecting,
      modifying, mocking, and testing HTTP traffic and APIs.
  timeline:
    - >
      Initial product era: Requestly established browser-based HTTP request and response
      modification.
    - >
      Desktop expansion: A desktop proxy added interception for applications, mobile
      devices, terminals, and additional browsers.
    - >
      2026: HTTP Interceptor source moved to requestly/interceptor and the desktop
      repository was renamed requestly/http-interceptor-desktop-app.
  usage:
    - >
      Developers use Requestly to redirect URLs, replace local or remote resources,
      modify headers and bodies, inject scripts, mock APIs, inspect traffic, record
      sessions, and simulate failures or latency.
    - >
      The desktop application runs a local proxy for system-wide or selected-application
      interception. Captured traffic is processed locally, and saved interception
      sessions remain on the user's system as HAR data.
