id: brew:gnupg
display-name: GnuPG
repo: https://dev.gnupg.org/source/gnupg.git
docs:
  - https://gnupg.org/documentation/index.html
  - https://gnupg.org/documentation/manuals/gnupg
config-file-location:
  unix:
    - ~/.gnupg/gpg.conf
    - ~/.gnupg/gpg-agent.conf
    - ~/.gnupg/dirmngr.conf
    - ~/.gnupg/common.conf
credentials-file-location:
  unix:
    - ~/.gnupg/private-keys-v1.d/
    - ~/.gnupg/secring.gpg
    - ~/.gnupg/trustdb.gpg
history:
  adoption-history:
    - >
      GnuPG became a standard security tool in Unix-like systems and
      software-distribution workflows. The project download page notes that common Linux
      distributions such as Debian, Fedora, Red Hat and Ubuntu include GnuPG, while
      Gpg4win provides an integrated Windows distribution with a context menu tool,
      crypto manager and Outlook plugin.
    - >
      Its ecosystem includes libraries and frontends as well as helper packages such as
      pinentry, GPGME, GPA and Scute. That surrounding stack made GnuPG a platform for
      applications needing OpenPGP operations rather than only an interactive command.
  package-nerd-significance:
    - >
      For package users, GnuPG is foundational plumbing: it links archive signatures,
      maintainer keys, trust databases, agents, pinentry programs, smart-card daemons
      and language bindings. Installing it often means installing the small operational
      security stack around OpenPGP, not just the gpg binary.
  project-history:
    - >
      GnuPG was introduced in 1997 as Free Software and became the GNU project's OpenPGP
      implementation. The project describes it as a complete and free implementation of
      OpenPGP, with command-line integration, key-management facilities and access
      modules for public-key directories.
    - >
      The release-line history shows the 1.0 branch born in 1999, the 1.4 branch in
      2004, the 2.0 branch in 2006 and later 2.x branches adding the more modular
      architecture around gpg-agent, dirmngr, gpgsm, smart-card support and supporting
      libraries.
  related-projects:
    - >
      GnuPG implements OpenPGP and is related to PGP by protocol lineage. Its project
      ecosystem includes GPGME, pinentry, dirmngr, gpg-agent, gpgsm, Scute, GPA and
      Gpg4win.
  sources:
    - https://gnupg.org/documentation/manuals/gnupg/
    - https://gnupg.org/download/index.html
    - https://gnupg.org/download/release_notes.html
    - https://www.gnupg.org/
  summary:
    - >
      GnuPG, also known as GPG, is the GNU Privacy Guard: a free implementation of the
      OpenPGP standard used for encryption, signatures and key management.
  timeline:
    - '1997: GnuPG was introduced as Free Software.'
    - '1999: The 1.0 release branch was born.'
    - '2004: The 1.4 release branch was born.'
    - '2006: The 2.0 release branch was born.'
    - '2014: The 2.2 release branch was born.'
    - '2021: The 2.4 release branch was born.'
  usage:
    - >
      Practitioners use GnuPG to encrypt and decrypt files or messages, create and
      verify signatures, manage public and private keys, fetch or publish keys through
      directory mechanisms, operate smart cards and verify downloaded source releases.
      Its command-line interface also makes it common in scripts, build systems and
      release automation.
related-packages:
  - id: brew:pinentry
    reason: >
      Use pinentry with GnuPG when passphrases or PINs should be collected through the
      Assuan-compatible prompt program designed for gpg-agent.
    rel: adjacent_workflow
    sources:
      - https://www.gnupg.org/related_software/pinentry/
      - https://gnupg.org/documentation/manuals/gnupg/Agent-Options.html
  - id: brew:gpgme
    reason: >
      Use GPGME when an application needs a supported library API for driving GnuPG
      instead of parsing the interactive gpg command-line interface.
    rel: adjacent_workflow
    sources:
      - https://www.gnupg.org/related_software/gpgme/
      - https://gnupg.org/documentation/manuals/gpgme/
  - id: brew:gnupg-pkcs11-scd
    reason: >
      Add gnupg-pkcs11-scd when GnuPG must use keys held by a PKCS#11 token through a
      replacement smart-card daemon.
    rel: adjacent_workflow
    sources:
      - https://github.com/alonbl/gnupg-pkcs11-scd
      - >
        https://github.com/alonbl/gnupg-pkcs11-scd/blob/master/gnupg-pkcs11-scd/gnupg-pkcs11-scd.1
