  package-nerd-significance:
    - >
      clock-rs is a good example of a polished Rust CLI moving through multiple
      packaging channels while keeping configuration simple and cross-platform.
  project-history:
    - >
      The official README describes clock-rs as a modern terminal-based Rust clock and a
      new alternative to tty-clock, adding a single configuration file and command-line
      overrides.
  related-projects:
