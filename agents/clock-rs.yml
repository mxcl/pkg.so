  summary:
    - >
      clock-rs is a Rust terminal clock with timer and stopwatch modes, TOML
      configuration, shell completions, and package-manager distribution.
  timeline:
    - '2024: README copyright year for the clock-rs project.'
    - >
      2026-05-16: GitHub releases page lists clock-rs v0.2.1 as latest in the opened
      repository metadata.
  usage:
    - >
      Users run `clock-rs` for the default clock, or subcommands such as `timer` and
      `stopwatch`. Settings can live in `conf.toml` and be overridden by command-line
      options.
