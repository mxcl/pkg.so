history:
  adoption-history:
    - >
      Artillery's adoption path is typical for a developer-first testing tool: npm
      global installs are the primary documented installation route, while Homebrew
      packaging gives macOS and Linux package-manager users a native formula. The GitHub
      repository metadata reported roughly nine thousand stars and hundreds of forks at
      research time.
    - >
      The product focus broadened from API load tests into full-stack reliability
      workflows. Current official docs position Artillery for Playwright E2E testing,
      scalable load testing, and synthetic monitoring, which helps explain its use by
      developers, QA engineers, and SREs rather than only dedicated performance-test
      teams.
  package-nerd-significance:
    - >
      Artillery is interesting to package nerds because it sits at the junction of Node
      packaging, cloud execution, and ops tooling. It is a CLI with a JavaScript package
      core, but its value shows up in CI pipelines, observability integrations, and
      serverless execution targets.
    - >
      The v2-era repository also shows the modern pattern of developer tools becoming
      platforms: one installable CLI, a script format, cloud runners, Playwright
      integration, plugins, and telemetry sinks.
  project-history:
    - >
      The public GitHub repository was created in May 2015 under the Artillery
      organization. GitHub releases show 1.5.x artifacts in May and June 2016, while the
      current repository has evolved into a monorepo around the `artillery` CLI package.
    - >
      The project describes itself as cloud-scale load testing. Its README and
      documentation emphasize distributed execution on AWS Lambda, AWS Fargate, and
      Azure ACI, protocol support for HTTP, WebSocket, Socket.io, gRPC, Kinesis and
      more, and an extension/plugin model.
  related-projects:
    - >
      The official README points to Playwright load testing, distributed runners on AWS
      Lambda, AWS Fargate and Azure ACI, observability destinations such as Datadog, New
      Relic and Honeycomb, and community/official integrations.
  sources:
    - https://api.github.com/repos/artilleryio/artillery
    - https://api.github.com/repos/artilleryio/artillery/releases
    - https://github.com/artilleryio/artillery
    - >
      https://raw.githubusercontent.com/artilleryio/artillery/main/packages/artillery/README.md
    - https://www.artillery.io/docs
    - https://www.artillery.io/docs/reference/test-script
    - source_facts.package-manager
  summary:
    - >
      Artillery is a JavaScript/Node.js command-line load-testing and
      reliability-testing platform. In package-manager terms it is the kind of tool
      people install globally as a CLI, keep in CI, and drive with small YAML or
      TypeScript test scripts rather than a long-lived daemon.
  timeline:
    - '2015: Public GitHub repository created.'
    - '2016: GitHub releases show Artillery 1.5.x builds.'
    - '2026: Artillery v2.0.33 published according to GitHub Releases.'
  usage:
    - >
      A typical Artillery workflow is to write a small test script with a `config`
      section, target, phases, and scenarios, then run it from the CLI locally or in CI.
      The reference docs show YAML and TypeScript test-script forms, and the README
      points users to examples plus guides for Playwright, distributed load tests, SLO
      checks, Apdex, and observability publishing.
    - >
      The package matters in Homebrew because it provides a single `artillery`
      executable for a tool whose upstream ecosystem is otherwise npm-first. That lets
      users keep load-testing tooling beside other CLI dependencies managed by the OS
      package manager.
related-packages:
  - id: brew:k6
    reason: >
      Choose Grafana k6 when you prefer its resource-efficient Go runtime, k6 JavaScript
      API, Grafana-oriented metrics workflow, and extension ecosystem; choose Artillery
      for Node-module extensibility, Playwright-native workloads, and its documented
      serverless runners.
    rel: alternative
    sources:
      - https://www.artillery.io/docs
      - https://grafana.com/docs/k6/latest/
  - id: brew:hey
    reason: >
      Choose hey for a compact single-endpoint HTTP benchmark with count, concurrency,
      duration, and rate flags; choose Artillery when you need multi-step scenarios,
      multiple protocols, browser testing, or distributed execution.
    rel: alternative
    sources:
      - https://www.artillery.io/docs/reference/test-script
      - https://github.com/rakyll/hey#readme
