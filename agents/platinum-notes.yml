history:
  adoption-history:
    - >
      Mixed In Key positions Platinum Notes as a preparation tool for DJs whose
      libraries contain tracks mastered at inconsistent loudness levels. It is designed
      to feed processed files back into software such as Serato, Rekordbox, Traktor,
      Ableton, Denon, VirtualDJ, and Mixed In Key.
    - >
      The product remains commercial desktop software for macOS and Windows, activated
      with a purchase-specific VIP code.
  package-nerd-significance:
    - >
      Platinum Notes occupies the library-preparation stage of a DJ workflow: it
      batch-processes source files before performance rather than acting as a player or
      full digital-audio workstation.
    - >
      Its overwrite option, automatic original-file backups, metadata handling, format
      matching, and configurable output location matter to users maintaining large,
      path-sensitive DJ libraries.
  project-history:
    - >
      Platinum Notes was developed by Mixed In Key to normalize perceived loudness,
      repair clipped peaks, and apply controlled audio enhancement across music
      collections.
    - >
      The product evolved from Platinum Notes 4, which offered Official and Festival
      templates, to Platinum Notes 10. The later generation added a Big Boost template,
      native Apple-silicon support, optional replacement with automatic backups,
      improved metadata handling, and Kilohearts-based processing.
  related-projects:
    - >
      Mixed In Key can identify tracks with clipped peaks and hand them to Platinum
      Notes through its Fix with Platinum Notes workflow.
    - >
      Platinum Notes is also sold within Mixed In Key's broader DJ-oriented software
      collections.
  sources:
    - https://mixedinkey.com/platinum-notes/
    - https://mixedinkey.com/platinum-notes/faq/
    - https://mixedinkey.com/platinum-notes/how-to/
    - https://mixedinkey.com/platinum-notes/upgrade/
  summary:
    - >
      Platinum Notes is Mixed In Key's commercial batch audio-enhancement application
      for making music libraries more consistent in loudness and repairing clipped
      peaks.
  timeline:
    - 'Platinum Notes 4: Offered Official and Festival processing templates.'
    - >
      Platinum Notes 10: Added the Big Boost template, native Apple-silicon support,
      optional overwrite with backups, and revised audio processing.
  usage:
    - >
      Users add individual audio files or folders, select an output location and format,
      choose a processing template, and start batch processing.
    - >
      The default workflow creates optimized copies with a `_PN` filename suffix, while
      an optional mode replaces originals and retains backups.
    - >
      For path-sensitive DJ libraries, the official guide recommends either writing
      beside the originals or deliberately using replacement mode so linked tracks
      remain available.
