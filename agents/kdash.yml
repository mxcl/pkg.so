id: brew:kdash
display-name: KDash
repo: null
docs:
  - https://github.com/kdash-rs/kdash#readme
  - https://kdash-rs.github.io/
config-file-location:
  unix:
    - ~/.config/kdash/config.yaml
credentials-file-location:
  unix:
    - ~/.kube/config
history:
  adoption-history:
    - >
      KDash is distributed through Homebrew, MacPorts, Cargo, Scoop, Chocolatey, AUR,
      Docker, manual release binaries, and an install script documented in the README.
      The README also displays crates.io, GitHub download, Docker pull, and crates.io
      download badges, which reflects packaging as a first-class part of the project.
  package-nerd-significance:
    - >
      KDash sits in the modern Rust TUI category alongside other single-binary
      operations tools. It is package-interesting because it offers Kubernetes
      observability and some day-to-day actions without a browser dashboard, while still
      fitting neatly into Homebrew, Cargo, Docker, Windows package managers, and
      release-binary workflows.
  project-history:
    - >
      The repository was created in April 2021 and the first tagged release, v0.0.1, was
      published on April 17, 2021. The project grew as a terminal alternative to
      graphical Kubernetes dashboards, adding broader resource support, filtering,
      YAML/log/describe views, custom resource support, and cross-platform binary
      distribution.
    - >
      The 1.0.0 release on April 9, 2026 added a troubleshoot tab, shell access,
      aggregate logs, deeper navigation, configurable keybindings/themes, and live
      kubeconfig watching. The 2.0.0 release on June 15, 2026 changed the app from
      mostly observational to operational by adding resource actions, edit, delete,
      rollout restart, scaling, port-forwarding, and confirmation prompts for impactful
      actions.
  related-projects:
    - >
      KDash is part of the Kubernetes CLI ecosystem and relies on users' kubeconfig
      context; its README also references kubectl-backed actions and related package
      channels such as Cargo, Docker, Scoop, Chocolatey, and AUR.
  sources:
    - https://github.com/kdash-rs/kdash
    - https://github.com/kdash-rs/kdash/blob/main/CHANGELOG.md
    - https://github.com/kdash-rs/kdash/releases
    - https://kdash-rs.github.io/
  summary:
    - >
      KDash is a Rust terminal dashboard for Kubernetes. The README describes it as a
      simple and fast dashboard and shows a keyboard-driven TUI for inspecting
      Kubernetes resources.
  timeline:
    - '2021-04-13: GitHub repository created.'
    - '2021-04-17: v0.0.1 release published.'
    - '2023-07-04: v0.4.0 added basic Custom Resource Definition support.'
    - >
      2026-04-09: v1.0.0 release added troubleshoot, shell, aggregate logs, and custom
      configuration support.
    - '2026-06-15: v2.0.0 release added resource management actions and port-forwarding.'
    - '2026-06-29: v2.0.2 release published.'
  usage:
    - >
      Users run kdash in a terminal with Kubernetes credentials available through
      kubeconfig. The interface supports keyboard navigation across resources, logs,
      YAML, describe output, filtering, namespace changes, context switching, copying,
      secret decoding, port-forwarding, and action menus.
related-packages:
  - id: brew:k9s
    reason: >
      K9s is the closest terminal-dashboard alternative, with a mature plugin and
      customization ecosystem; KDash offers a Rust-based interface with its own
      troubleshooting and resource-action workflow.
    rel: alternative
    sources:
      - https://github.com/kdash-rs/kdash#readme
      - https://k9scli.io/
      - https://github.com/derailed/k9s#readme
  - id: brew:kubernetes-cli
    reason: >
      kubectl complements KDash as Kubernetes' primary scriptable CLI, using the same
      kubeconfig-based cluster access for automation and commands outside the dashboard
      workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/kdash-rs/kdash#readme
      - https://kubernetes.io/docs/concepts/overview/kubectl/
      - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
tags:
