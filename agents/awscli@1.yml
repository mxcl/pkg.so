      Official AWS CLI v1 User Guide describes AWS CLI as a command-line tool for
      interacting with AWS services and AWS infrastructure APIs.
  display-name-sources:
    - Official AWS CLI v1 User Guide labels the product AWS Command Line Interface version 1.
  docs-sources:
    - >
      Official AWS CLI version 1 User Guide documents AWS CLI v1 and its configuration
      and credential files.
  history-sources:
    - https://api.github.com/repos/aws/aws-cli
    - >
      https://api.github.com/repos/aws/aws-cli/git/tags/7dc8d4f613a5b0d6d0fe80977bbcb13662bf6b55
    - >
      https://api.github.com/repos/aws/aws-cli/git/tags/b824720aa0c766c39ee2c6039f25e9425ddf4498
    - https://aws.amazon.com/blogs/developer/cli-v1-maintenance-mode-announcement/
    - https://docs.aws.amazon.com/cli/v1/userguide/cli-configure-files.html
    - https://github.com/aws/aws-cli
  repo-sources:
    - >
      Official aws/aws-cli GitHub README identifies the repository as AWS CLI, with the
      README for AWS CLI version 1.
  tags-sources:
    - >
      Official AWS CLI v1 User Guide describes command-line AWS service automation and
      says v1 is built using the SDK for Python.
