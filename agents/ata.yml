history:
  adoption-history:
    - >
      The supplied package metadata lists Homebrew and MacPorts packaging. Upstream
      release notes show community bug fixes, including input handling and old-config
      compatibility, but official public adoption history is otherwise thin.
  package-nerd-significance:
    - >
      For package nerds, the interesting bit is the naming drift and Unix-tool posture:
      a package named `ata`, an upstream README titled `trf`, and a deliberate
      preference for stdin/stdout, environment variables, and tiny wrapper scripts over
      application-managed state.
  project-history:
    - >
      The repository began in January 2023, shortly after the first wave of ChatGPT
      terminal wrappers. Early releases used the `ata` name and focused on OpenAI-style
      chat from standard input; by the current README the project presents itself as
      `trf` and supports OpenAI, DeepInfra, Google, Hyperbolic, and other providers.
    - >
      The 2.0.0 release added support for `gpt-3.5-turbo` and mentioned a default
      configuration directory, while the current README states the project philosophy as
      not handling state and doing settings through command-line arguments and
      environment variables.
  related-projects:
    - >
      Related tools include terminal AI wrappers, OpenAI/DeepInfra command-line clients,
      text-to-speech pipelines, and shell-scriptable LLM helpers.
  sources:
    - Official git metadata from https://github.com/transformrs/ata.git
    - https://github.com/transformrs/ata#readme
    - https://github.com/transformrs/ata/releases.atom
  summary:
    - >
      The Homebrew `ata` formula currently points at a small Rust command-line AI tool
      whose upstream README now brands the executable as `trf`: multimodal AI in the
      terminal. It is designed for shell pipelines rather than a stateful chat
      application.
  timeline:
    - '2023: Initial repository commits and first tagged release series.'
    - '2023: v2.0.0 added gpt-3.5-turbo support.'
    - '2024: v2.0.4 fixed crashes with old config files.'
  usage:
    - >
      Typical usage pipes text into `trf chat` or `trf tts`, with provider keys supplied
      as environment variables such as `OPENAI_KEY` or `DEEPINFRA_KEY`. The README
      examples intentionally compose with ordinary shell tools, files, scripts, and
      media players such as VLC.
related-packages:
  - id: brew:llm
    reason: >
      Choose LLM when you want a maintained plugin ecosystem, stored provider keys,
      templates, and persistent conversations; choose trf for deliberately stateless
      pipelines and its documented text-to-speech workflow.
    rel: alternative
    sources:
      - https://github.com/transformrs/ata#readme
      - https://llm.datasette.io/en/stable/help.html
