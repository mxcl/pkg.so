history:
  adoption-history:
    - >
      Wootility is available both as a browser application and as a desktop application
      for Windows, macOS, and Linux. Wooting reports that a 2025 in-app survey received
      more than 6,000 responses, with many respondents using Wootility several times per
      week.
    - >
      The fifth-generation application retained compatibility with Wooting keyboards
      extending back to the original Wooting One, while providing migration from
      Wootility v4 profiles.
  package-nerd-significance:
    - >
      Wootility illustrates a hardware configurator designed around both WebHID-style
      browser delivery and conventional desktop packaging. Storing profiles on the
      keyboard makes the configured hardware usable without leaving the management
      application running.
  project-history:
    - >
      Wooting developed Wootility as the configuration companion for its analog and
      Hall-effect keyboards. Successive releases added profile management, per-key
      actuation and Rapid Trigger controls, firmware management, RGB layers, and support
      for new Wooting devices.
    - >
      Wootility v5 entered public beta in October 2024 and became stable in February
      2025 after a ground-up interface redesign. Later releases added expanded
      calibration, switch selection, background services, and automatic
      application-linked profile switching.
  related-projects:
    - Wooting firmware stores active profiles and settings on supported keyboards.
    - >
      Wooting also maintains separate analog-input and RGB SDKs plus the Wootomation
      macro application.
  sources:
    - https://wooting.io/post/beta-of-wootility-v5-is-here
    - https://wooting.io/post/wootility-v5-what-you-told-us
    - https://wooting.io/wootility
    - https://wooting.io/wootility/changelogs/5.0.0
    - https://wooting.io/wootility/changelogs/5.4.1
  summary:
    - >
      Wootility is Wooting’s browser-based and desktop configuration utility for its
      analog and Hall-effect keyboards.
  timeline:
    - '2023: Wootility v4.6 expanded RGB layering and device support.'
    - '2024: Wootility v5 entered public beta with a redesigned interface and profile workflow.'
    - '2025: Wootility v5 became the stable generation.'
    - >
      2026: Wootility added broader switch calibration and automatic application-linked
      profiles.
  usage:
    - >
      Users connect a supported Wooting keyboard, create or select profiles, remap keys,
      tune actuation and Rapid Trigger behavior, configure RGB effects, and update
      firmware. Profiles can be saved to onboard keyboard storage for use without
      keeping Wootility open.
