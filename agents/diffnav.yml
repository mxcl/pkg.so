id: brew:diffnav
display-name: diffnav
repo: null
docs:
  - https://github.com/dlvhdr/diffnav#readme
config-file-location:
  macos:
    - $DIFFNAV_CONFIG_DIR/config.yml
    - $XDG_CONFIG_HOME/diffnav/config.yml
    - ~/Library/Application Support/diffnav/config.yml
  unix:
    - $DIFFNAV_CONFIG_DIR/config.yml
    - ~/.config/diffnav/config.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Because diffnav is young, its adoption history is still mostly upstream-led: the
      README documents installation through Homebrew from the author's tap or building
      with Go, plus usage as a global Git diff pager. The package-manager interest is in
      bringing a newer TUI diff-navigation workflow to standard install channels.
  package-nerd-significance:
    - >
      diffnav matters to package nerds as part of the modern wave of Go-based terminal
      UIs: a single installable binary, YAML config, Git integration, and explicit
      dependence on established projects such as delta and Bubble Tea.
  project-history:
    - >
      The diffnav repository was created in 2024 and describes the tool as a Git diff
      pager based on delta with a GitHub-like file tree. Its README documents
      side-by-side and unified views, watch mode, file-tree controls, and configuration
      through YAML.
    - >
      The release feed shows rapid early iteration through 2026, with versions from the
      0.6.0 through 0.11.0 series published in the first quarter of that year.
  related-projects:
    - >
      delta, Bubble Tea, Git, gh, and gh-dash are the closest projects named or implied
      by upstream documentation.
  sources:
    - https://github.com/dlvhdr/diffnav
    - https://api.github.com/repos/dlvhdr/diffnav
    - https://raw.githubusercontent.com/dlvhdr/diffnav/main/README.md
    - https://api.github.com/repos/dlvhdr/diffnav/releases
  summary:
    - >
      diffnav is a Git diff pager that combines delta-style diff rendering with a
      file-tree navigation pane. It is a newer terminal UI tool aimed at making large
      diffs easier to browse.
  timeline:
    - '2024: The dlvhdr/diffnav GitHub repository is created.'
    - '2026: Version 0.6.0 is released.'
    - '2026: Version 0.11.0 is released.'
  usage:
    - >
      Users pipe git diff or gh pr diff output into diffnav, or configure Git with
      pager.diff diffnav. The tool adds keyboard navigation, file-tree toggling,
      side-by-side or unified rendering, and watch mode for refreshing a diff command.
related-packages:
  - id: brew:git-delta
    reason: >
      Choose delta when you want a mature, highly configurable Git pager without
      diffnav's dedicated file-tree TUI; diffnav itself uses delta as its rendering
      engine.
    rel: alternative
    sources:
      - https://github.com/dlvhdr/diffnav#readme
      - https://dandavison.github.io/delta/features.html
  - id: brew:gh
    reason: >
      Pipe `gh pr diff` output into diffnav to navigate a GitHub pull request's changed
      files in its terminal file-tree interface.
    rel: adjacent_workflow
    sources:
      - https://github.com/dlvhdr/diffnav#readme
      - https://cli.github.com/manual/gh_pr_diff
