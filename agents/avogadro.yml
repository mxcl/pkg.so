history:
  adoption-history:
    - >
      Avogadro developed into a cross-platform, open-source application serving
      computational chemistry, molecular modeling, education, bioinformatics, and
      materials science. Its broad file-format support and plugin architecture make it
      useful across both teaching and research workflows.
  package-nerd-significance:
    - >
      Avogadro is notable as a desktop scientific application whose reusable libraries,
      plugin system, and integrations connect graphical molecular editing with
      command-line chemistry packages. Package maintainers must account for a
      substantial native scientific and graphics dependency stack.
  project-history:
    - >
      The original Avogadro project was already publishing beta releases in 2007.
      Avogadro 2 was subsequently developed as a rewrite of the now-unsupported 1.x
      codebase, with its code divided into reusable libraries and an application layer
      under the Open Chemistry community.
    - >
      The second-generation project emphasizes modern rendering, stability,
      extensibility, and reusable components for chemical visualization and data
      processing.
  related-projects:
    - Open Chemistry is the umbrella community under which Avogadro is developed.
    - >
      Open Babel and external computational-chemistry programs complement Avogadro's
      format conversion, force-field, and input-generation workflows.
  sources:
    - 'Official 0.2.0 release notes: https://avogadro.cc/install/versions/v020.html'
    - 'Official guide: https://avogadro.cc/docs/'
    - 'Official project repository: https://github.com/OpenChemistry/avogadrolibs'
  summary:
    - >
      Avogadro is a free, open-source molecular editor and visualization application for
      scientific research and education. The current Avogadro 2 generation is a major
      rewrite of the original application.
  timeline:
    - '2007: Avogadro 0.2.0 was released as an early beta.'
    - '2015: The first version of the official Avogadro manual was produced.'
    - '2022–2025: The official manual was extensively revised for Avogadro 2.'
  usage:
    - >
      Users draw, edit, optimize, analyze, and visualize molecular structures; inspect
      orbitals and surfaces; and prepare input for external computational-chemistry
      programs. Avogadro runs on macOS, Linux, and Windows.
