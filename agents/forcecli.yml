config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents precompiled binaries from the GitHub release page or CLI home
      page, plus source installation with Go. It also documents reuse of SFDX usernames
      or aliases when a stored force session is unavailable, placing the tool alongside
      Salesforce DX workflows rather than only older standalone Force.com usage.
  package-nerd-significance:
    - >
      Force CLI is significant as a standalone Go-era Salesforce CLI that predates or
      coexists with SFDX-style tooling. For package managers, it is a single executable
      that wraps authenticated cloud workflows, release binaries, and local metadata
      directory conventions.
  project-history:
    - >
      The project is maintained in the ForceCLI/force repository. Its README labels the
      documented generation as force CLI v1.3.0, while the repository tag list shows
      later v1.x releases, including v1.13.0.
  related-projects:
    - >
      The README and command docs relate Force CLI to Force.com, Salesforce, SFDX
      authentication, Salesforce metadata directories, Apex, SOQL, and Bulk API
      workflows.
  sources:
    - https://github.com/ForceCLI/force
    - https://raw.githubusercontent.com/ForceCLI/force/master/README.md
    - https://raw.githubusercontent.com/ForceCLI/force/master/docs/force.md
  summary:
    - >
      Force CLI is a Go command-line interface for Force.com and Salesforce orgs. The
      README identifies it as a command-line interface to force.com and documents
      commands for login, metadata import/export, SOQL queries, bulk APIs, Apex,
      packages, records, limits, and org inspection.
  timeline:
    - 'v1.3.0: README documents the command set under the force CLI v1.3.0 heading.'
    - 'v1.13.0: official Git tags include a later v1.13.0 release line.'
  usage:
    - >
      Users authenticate with force login, list and switch saved logins, inspect
      objects, run SOQL, import and export metadata directories, deploy metadata, run
      Apex tests, and interact with Bulk API 1.0 and 2.0. The generated command docs
      expose a --config option whose default directory is .force, but no specific config
      file path is documented.
related-packages:
  - id: brew:sf
    reason: >
      Choose Salesforce CLI for Salesforce's current first-party project, org,
      metadata-deployment, automation, and extensible plugin workflows; Force CLI
      remains a smaller standalone Go client.
    rel: alternative
    sources:
      - https://developer.salesforce.com/tools/salesforcecli
      - >
        https://developer.salesforce.com/docs/platform/salesforce-cli-reference/guide/cli_reference_project_deploy_start.html
      - https://github.com/ForceCLI/force#readme
