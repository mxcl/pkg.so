config-file-location:
  macos:
    - ~/Library/Preferences/net.publicspace.abfa4.plist
    - ~/Library/Preferences/net.publicspace.abfa5.plist
    - ~/Library/Preferences/A Better Finder Attributes Pref
credentials-file-location: null
history:
  adoption-history:
    - >
      The vendor reports use by professional photographers, website designers,
      developers, and other creative professionals handling large file collections for
      close to two decades. Its longevity reflects a persistent need to repair or
      normalize metadata that Finder and media applications do not edit efficiently in
      bulk.
  package-nerd-significance:
    - >
      A Better Finder Attributes is a long-lived example of the specialized macOS
      utilities captured by graphical package managers. It exposes filesystem and media
      metadata operations through batch-oriented workflows, including attributes that
      Unix tools, archives, and version-control systems can be sensitive to.
  project-history:
    - >
      A Better Finder Attributes was originally released for Mac OS 8 and has been
      rewritten several times for newer Mac technologies. Archived vendor downloads show
      releases by early 2001, while the modern version 7 line added broader image and
      video metadata handling, multithreaded processing, Apple Silicon support, and
      continuing macOS compatibility updates.
  related-projects:
    - A Better Finder Rename
    - Finder
    - EXIF and IPTC metadata tools
  sources:
    - https://www.publicspace.net/ABetterFinderAttributes/
    - https://www.publicspace.net/ABetterFinderAttributes/Manual.html
    - https://www.publicspace.net/ABetterFinderAttributes/troubleshooting.html
    - https://www.publicspace.net/app/signed_abfa7.html
    - https://www.publicspace.net/old_versions.html
  summary:
    - >
      A Better Finder Attributes is a commercial macOS batch utility from
      publicspace.net for changing file dates, Finder flags, and image or video
      metadata.
  timeline:
    - 'Mac OS 8 era: A Better Finder Attributes was first released.'
    - '2001: Archived vendor downloads document early classic-Mac releases.'
    - '2016: Version 6 expanded direct editing and removal of JPEG EXIF metadata.'
    - '2020: Version 7 introduced major metadata-processing changes and Apple Silicon support.'
    - '2026: The version 7 series continued receiving metadata and compatibility updates.'
  usage:
    - >
      Drag files into the application, select an attribute or metadata action, configure
      its parameters, preview the operation, and perform the batch change. Common
      workflows include correcting camera-clock errors, synchronizing Finder dates with
      capture dates, removing GPS or equipment metadata, and standardizing file flags.
