history:
  adoption-history:
    - >
      Rayon first tested its browser-based drawing environment with selected companies
      in a closed beta. It opened the beta to its waitlist in 2023 and reported tens of
      thousands of drawings created before removing the beta label in September of that
      year.
    - >
      Official launch material identifies early deployments across commercial real
      estate, housing, interior-space planning, furniture manufacturing, and asset
      management. Subsequent releases broadened the product from collaborative floor
      planning toward complete architectural drawing and presentation workflows.
  package-nerd-significance:
    - >
      Rayon represents the movement of traditionally heavyweight CAD workflows toward
      browser-first, collaborative software. The downloadable macOS application packages
      access to a service whose primary model remains online and synchronized rather
      than a conventional file-and-dotfile desktop CAD program.
    - >
      For design-tool enthusiasts, Rayon is notable for combining CAD-like precision,
      multiplayer collaboration, reusable libraries and templates, presentation layouts,
      and AI-assisted asset or drawing generation.
  project-history:
    - >
      Bastien Dolla and Stanislas Chaillou co-founded Rayon in October 2021 to build a
      lighter, collaborative alternative for architectural and space-design drawing. The
      team drew inspiration from browser-based multiplayer tools while targeting
      workflows traditionally handled by CAD and BIM software.
    - >
      After closed- and open-beta periods, Rayon formally launched on September 27, 2023
      alongside a €4 million seed round. Rayon V2 followed in October 2024 with a
      redesigned interface, professional layouts, views, annotations, and templates;
      later development added AI-assisted workflows and continued expansion of the
      drawing system.
  related-projects:
    - >
      Rayon positions itself between traditional CAD and BIM products and collaborative
      visual tools such as Figma and Miro.
    - >
      Rayon Assets provides reusable two-dimensional design content, while templates and
      shared libraries support repeatable team standards.
  sources:
    - 'Official AI documentation: https://docs.rayon.design/documentation/work-with-ai'
    - 'Official Rayon V2 announcement: https://www.rayon.design/blog/rayon-v2'
    - 'Official documentation: https://docs.rayon.design/'
    - 'Official launch announcement: https://www.rayon.design/blog/rayon-seed-round'
    - >
      Official pre-seed and origins announcement:
      https://www.rayon.design/blog/announcing-rayon-s-pre-seed
  summary:
    - >
      Rayon is a collaborative, browser-first architectural drawing platform with
      desktop applications for macOS and Windows. It supports precise 2D drawing,
      layouts, reusable assets, team workspaces, presentation, import and export, and
      AI-assisted design workflows.
  timeline:
    - '2021-10: Bastien Dolla and Stanislas Chaillou co-founded Rayon.'
    - '2022: Rayon exposed its first product iteration to selected closed-beta users.'
    - '2023: Rayon progressed through an open beta and formally launched in September.'
    - '2024-10-29: Rayon released V2 after a six-month redesign.'
    - >
      2025: Rayon continued expanding its CAD-oriented drawing platform, culminating in
      Rayon V3.
  usage:
    - >
      Architects, interior designers, and space-planning teams use Rayon to create and
      style precise two-dimensional drawings, collaborate in real time, organize work in
      shared workspaces, prepare layouts, and publish or export results.
    - >
      Rayon's AI panel can provide product help, generate or edit imagery, trace images
      into vector drawings, generate CAD blocks, and search Rayon's shared content. An
      internet connection is required to start the service, although interrupted work
      can synchronize after connectivity returns.
