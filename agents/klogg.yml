history:
  adoption-history:
    - >
      klogg carries the established glogg interaction model into a separately maintained
      cross-platform application. Its official repository supplies desktop builds and
      describes DEB and RPM repositories in addition to Windows and macOS packaging.
    - >
      A 2019 configuration change separated changing session data into
      klogg_session.conf while retaining manually changed options in klogg.conf,
      reflecting use cases such as portable and centrally managed installations.
  package-nerd-significance:
    - >
      klogg combines a graphical filtered view with familiar Unix-log habits: regular
      expressions, marking, live following in the style of tail -f, and command-line
      file arguments.
    - >
      Its attention to very large files, fast indexing, Hyperscan acceleration,
      compressed archives, encodings, saved filters, and active log files makes it
      useful when a text editor or a basic tail pipeline becomes cumbersome.
  project-history:
    - >
      klogg is a fork and continuation of the glogg log explorer. It preserves the split
      full-file and filtered-result interface while adding its own performance,
      packaging, session, highlighter, archive, and remote-file features.
  related-projects:
    - glogg is the upstream project from which klogg was forked.
    - >
      Hyperscan accelerates supported regular-expression searches, with Qt's
      regular-expression engine used when richer PCRE syntax is required.
    - tail -f provides the command-line interaction that klogg's follow mode resembles.
  sources:
    - https://github.com/variar/klogg
    - https://github.com/variar/klogg/blob/master/DOCUMENTATION.md
    - https://github.com/variar/klogg/issues/94
  summary:
    - >
      klogg is a fast cross-platform graphical log explorer derived from glogg and
      designed to search, filter, highlight, and follow large or changing text logs.
  timeline:
    - '2018: The klogg fork was publicly active as a glogg-based log explorer.'
    - '2019: Runtime session state moved from klogg.conf into klogg_session.conf.'
  usage:
    - >
      Users open local logs, compressed files, archives, remote URLs, or clipboard text
      and filter them with regular expressions, fixed strings, or logical pattern
      combinations.
    - >
      Common workflows include following a growing log, marking lines, saving filters,
      applying highlighter sets, switching encodings, restoring sessions, and passing
      files on the command line.
