history:
  adoption-history:
    - >
      DepQBF adoption is visible through the official release history, QBF Gallery and
      QBFEVAL mentions, and published system descriptions. It won multiple medals in the
      2014 QBF Gallery and placed in tracks at QBFEVAL 2016, which made it a known
      baseline and comparison point for QBF researchers.
  package-nerd-significance:
    - >
      For package nerds, DepQBF is interesting because Homebrew packages a research
      solver whose upstream distribution is essentially source tarballs, a README,
      academic papers, and a small C build. It is the kind of specialized solver package
      that matters deeply to benchmarks and formal-methods workflows while staying
      invisible to most developers.
  project-history:
    - >
      The DepQBF homepage records source releases back to version 0.1 in 2010 and
      version 1.0 in 2012. The GitHub repository was created in 2012, and the official
      site describes DepQBF as a QDPLL-based QBF solver with conflict-driven clause
      learning, solution-driven cube learning, and dependency-scheme analysis.
    - >
      The 5.x and 6.x series added notable solver-engine work. Version 5.0 introduced
      blocked clause elimination as pre-, in-, and dynamic processing; version 6.0 added
      QCDCL with generalized axioms; version 6.03 replaced Bloqqer with Nenofex because
      Bloqqer was not reentrant.
  related-projects:
    - >
      Related official or upstream projects mentioned by DepQBF include Nenofex,
      PicoSAT, Bloqqer, QxBF, QBFCert, DepQBF4J, and QRATPre+.
  sources:
    - https://lonsing.github.io/depqbf/
    - https://github.com/lonsing/depqbf
    - https://raw.githubusercontent.com/lonsing/depqbf/master/README
    - https://api.github.com/repos/lonsing/depqbf
  summary:
    - >
      DepQBF is a search-based solver for quantified Boolean formulae in prenex
      conjunctive normal form. It is a compact research solver with command-line and
      library use cases, important in SAT/QBF competition and formal-methods circles
      rather than general application development.
  timeline:
    - '2010: DepQBF 0.1 source code released.'
    - '2012: DepQBF 1.0 source code released and GitHub repository created.'
    - '2014: DepQBF won multiple QBF Gallery medals.'
    - '2015: Version 4.0 added a novel API for incremental solving.'
    - '2015: Version 5.0 added blocked clause elimination work.'
    - '2017: Version 6.0 introduced QCDCL with generalized axioms.'
    - '2017: Version 6.03 released as a maintenance release.'
  usage:
    - >
      The command-line tool solves QDIMACS-style QBF inputs and returns the conventional
      SAT-competition exit codes 10 for satisfiable and 20 for unsatisfiable. It can
      also be built as a library through `libqdpll.a`, used through the `qdpll.h` API,
      and exercised via examples for incremental solving and clause groups.
