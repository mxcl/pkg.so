docs:
  - https://www.open-mpi.org/projects/hwloc
  - https://www.open-mpi.org/projects/hwloc/doc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Open MPI's project page lists downstream or related users including MPC,
      Newmadeleine, StarPU, Kokkos, oneTBB, memkind, H2M, Seastar, PaStiX, LIKWID,
      TensorFlow, GEOPM, and OpenPMIx. The package metadata shows broad distribution
      across Homebrew, Debian, Ubuntu, Fedora-family, Alpine, Arch, Nix, MacPorts, and
      openSUSE ecosystems.
  package-nerd-significance:
    - >
      hwloc is package-nerd-significant because it is often pulled in indirectly by
      high-performance and systems software. A package manager may present it as a small
      system formula, but it encodes hard-won portability across Linux, BSDs, macOS,
      Windows, Solaris, AIX, cpusets, NUMA, caches, GPUs, and other topology surfaces.
  project-history:
    - >
      The Open MPI project history says hwloc evolved from and merged the libtopology
      and Portable Linux Processor Affinity projects because they overlapped
      functionally and ideologically. It was released under the hwloc name as an Open
      MPI sub-project and is mostly developed by the TADaaM team at Inria in Bordeaux.
    - >
      The NEWS file covers features since version 0.9 and carries 2009 copyright notices
      for CNRS, Inria, Universite Bordeaux, and Cisco Systems. The 1.0.0 tag dates to
      May 2010. Later major lines expanded the API and the command-line suite while
      preserving the central promise: make topology discovery and binding portable
      across operating systems and hardware generations.
  related-projects:
    - >
      hwloc is historically related to libtopology and PLPA, and operationally related
      to Open MPI, PMIx, NUMA libraries, CPU binding APIs, StarPU, Kokkos, oneTBB,
      memkind, TensorFlow, and other software that needs hardware-locality knowledge.
  sources:
    - >
      Open MPI hwloc project history, README, NEWS, release archives, repository
      metadata, and Homebrew package metadata were used.
  summary:
    - >
      hwloc, Hardware Locality, is a portable library and command-line tool suite for
      discovering and using machine topology: NUMA nodes, packages, cores, processing
      units, caches, I/O devices, and locality relationships. It is a system and HPC
      building block rather than a single end-user command.
  timeline:
    - >
      2009: NEWS history begins at version 0.9, with CNRS, Inria, Universite Bordeaux,
      and Cisco copyright notices.
    - '2010: 1.0.0 release tag published.'
    - '2013: GitHub mirror/repository metadata begins for the Open MPI hwloc repo.'
    - >
      2018: 2.0.x line introduced a new major API era; 2.0.0 was marked as having a
      broken ABI, with 2.0.1 or later recommended.
    - '2026: NEWS documents 3.0.0 API changes, removals, and topology-info updates.'
  usage:
    - >
      Users run tools such as `lstopo`, `hwloc-info`, `hwloc-bind`, `hwloc-calc`, and
      related utilities to inspect topology, bind processes, calculate CPU or NUMA sets,
      export XML topologies, and debug locality issues. Developers use the C API to make
      runtime, scheduler, MPI, database, and performance tools topology-aware.
related-packages:
  - id: brew:open-mpi
    reason: >
      Open MPI requires hwloc for topology discovery and placement, making it a strong
      companion when building or diagnosing topology-aware MPI workloads.
    rel: adjacent_workflow
    sources:
      - https://docs.open-mpi.org/en/main/installing-open-mpi/required-support-libraries.html
      - https://www.open-mpi.org/projects/hwloc/
  - id: brew:numactl
    reason: >
      On Linux, numactl supplies NUMA policy and memory-binding operations, while hwloc
      documents helpers for converting its CPU and node sets to libnuma representations.
    rel: adjacent_workflow
    sources:
      - https://www.open-mpi.org/projects/hwloc/doc/v2.15.0/interoperability.html
      - https://github.com/numactl/numactl
