history:
  adoption-history:
    - >
      libarchive spread widely because packaging systems, installers, build tools, and
      OS utilities all need to unpack archives without shelling out to a pile of
      format-specific programs. Its bsdtar and bsdcpio utilities became
      FreeBSD-associated alternatives to GNU tar and cpio, while the library itself was
      packaged across Linux, macOS, BSD, and Windows-oriented environments.
  package-nerd-significance:
    - >
      libarchive is one of those packages that quietly makes package managers work. Its
      importance is in boring reliability: many archive formats, many platforms, a test
      suite, and CLI tools that can replace multiple single-format utilities.
  project-history:
    - >
      The project began in the FreeBSD orbit and was first released in 2006, according
      to its own libarchive 3.0 transition notes. Its design emphasized streaming,
      automatic format detection, and a single API that could handle tar, cpio, zip, ISO
      images, compression filters, and later many more formats.
  related-projects:
    - >
      Related projects include FreeBSD tar and cpio tooling, GNU tar, Info-ZIP, zlib,
      bzip2, xz, lz4, zstd, archive-consuming package managers, and installers.
  sources:
    - https://github.com/libarchive/libarchive
    - https://github.com/libarchive/libarchive/blob/master/NEWS
    - https://github.com/libarchive/libarchive/wiki
    - https://github.com/libarchive/libarchive/wiki/Libarchive3
    - https://github.com/libarchive/libarchive/wiki/ReleaseNotes
    - https://www.libarchive.org
  summary:
    - >
      libarchive is a portable C library and command-line tool suite for reading and
      writing many archive formats. It ships bsdtar, bsdcpio, bsdcat, and bsdunzip,
      making it both a developer library and a practical Unix toolbox package.
  timeline:
    - '2006: libarchive was first released.'
    - '2011-12: libarchive 3.0 was released after nearly two years of development since 2.8.'
    - >
      2016-04-30: libarchive 3.2.0 added bsdcat, LZ4, WARC, raw writer, and
      ZIP64-related features.
    - '2018-09-03: libarchive 3.3.3 included Zstandard read and write filters.'
    - '2023-07-14: the project recorded a bsdunzip port from FreeBSD in NEWS.'
  usage:
    - >
      Applications link libarchive to read and write archives through one API, while
      users run bsdtar, bsdcpio, bsdcat, or bsdunzip. The project site emphasizes
      automatic handling of archive-plus-compression combinations such as tar.gz and
      support for POSIX-like systems plus Windows.
related-packages:
  - id: brew:gnu-tar
    reason: >
      Choose GNU tar when the workflow is specifically tar-focused and needs GNU tar’s
      archive-manipulation semantics; libarchive’s bsdtar is broader across archive
      formats.
    rel: alternative
    sources:
      - https://www.gnu.org/software/tar/
      - https://www.libarchive.org/
  - id: brew:p7zip
    reason: >
      Choose p7zip when creating 7z archives with its extended codec set is the primary
      task; libarchive is preferable for a single streaming API and CLI suite spanning
      many archive families.
    rel: alternative
    sources:
      - https://github.com/p7zip-project/p7zip
      - https://github.com/libarchive/libarchive/wiki/LibarchiveFormats
  - id: brew:zstd
    reason: >
      Install zstd when building or using libarchive workflows that need native
      Zstandard compression and decompression support through libzstd.
    rel: adjacent_workflow
    sources:
      - https://github.com/libarchive/libarchive/wiki/LibarchiveFormats
      - https://facebook.github.io/zstd/
