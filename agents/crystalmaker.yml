history:
  adoption-history:
    - >
      CrystalMaker moved from its original Macintosh base to Mac OS X and later Windows
      while preserving a native application on each platform. Its releases added
      structure libraries, broader scientific file-format support, energy modelling,
      vibration analysis, and Apple-silicon compatibility.
    - >
      The software has been used across crystallography, materials science, chemistry,
      mineralogy, teaching, and engineering workflows. Its vendor has maintained
      companion diffraction applications and long-running relationships with scientific
      societies and meetings.
  package-nerd-significance:
    - >
      CrystalMaker is a veteran specialist macOS application whose origins predate Mac
      OS X. Packaging it as a Homebrew cask gives command-line-managed access to a
      proprietary graphical research tool with a large set of scientific interchange
      formats.
    - >
      Its evolution from floppy-disk Macintosh software to a universal native
      application for Apple silicon and Intel makes it a compact example of unusually
      long desktop-software continuity.
  project-history:
    - >
      CrystalMaker 1.0 shipped for Macintosh in November 1994 on two floppy disks. It
      subsequently gained PowerPC support, a Mac OS X Carbon architecture, a Windows
      edition, 64-bit native implementations, integrated structure libraries, and
      increasingly sophisticated modelling tools.
    - >
      Major milestones included the award-winning CrystalMaker 5, Mac OS X-native
      CrystalMaker 6, the first Windows release in 2005, energy modelling in
      CrystalMaker 9, and the redesigned 64-bit CrystalMaker 10. CrystalMaker 11 added
      full crystal-energy modelling.
  related-projects:
    - >
      CrystalDiffract handles powder-diffraction simulation, phase identification, and
      refinement using structural data from CrystalMaker.
    - SingleCrystal provides reciprocal-lattice and single-crystal diffraction visualization.
    - >
      CrystalViewer is the vendor's viewing-oriented companion application and structure
      library.
  sources:
    - 'Official company history: https://crystalmaker.com/about/history/'
    - >
      Official documentation overview:
      https://crystalmaker.com/support/advice/pages/cm-documentation.html
    - 'Official product overview: https://crystalmaker.com/crystalmaker/index.html'
    - 'Official technical specifications: https://crystalmaker.com/crystalmaker/specs/'
  summary:
    - >
      CrystalMaker is proprietary macOS and Windows software for building, visualizing,
      analysing, and modelling crystal and molecular structures.
  timeline:
    - '1994: CrystalMaker 1.0 was released for Macintosh.'
    - "2001: CrystalMaker 5.0 received a Macworld Editors' Choice award."
    - '2002: CrystalMaker 6.0 adopted a Mac OS X Carbon architecture.'
    - '2005: CrystalMaker 1.0 was released for Windows XP.'
    - '2014: CrystalMaker 9.0 added energy modelling and crystal-engineering tools.'
    - >
      2017: CrystalMaker 10 introduced a redesigned 64-bit native application and
      integrated CrystalViewer.
    - '2024: CrystalMaker 11 added full crystal-energy modelling.'
  usage:
    - >
      Researchers import or build crystal and molecular structures, inspect symmetry and
      bonding, visualize volumetric and vector data, calculate structural and
      thermodynamic properties, and export graphics, video, coordinates, or model data.
    - >
      CrystalMaker can work live with CrystalDiffract and SingleCrystal so that
      structural edits drive updated diffraction calculations and visualizations.
    - >
      The vendor recommends beginning with the bundled self-guided tutorials and using
      the searchable user guide from the Help menu as the definitive reference.
