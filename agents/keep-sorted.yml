history:
  adoption-history:
    - >
      Adoption is strongest in repositories that want deterministic ordering for
      generated-looking lists without adopting a language-specific formatter. The
      pre-commit hook documented in the README is the main adoption path: projects can
      enforce sorted blocks in review and CI while keeping the tool independent of file
      type.
  package-nerd-significance:
    - >
      keep-sorted is package-nerdy because it solves a recurring maintenance itch with a
      tiny explicit contract: the source file says which lines are machine-sortable.
      That makes it a useful complement to gofmt-style whole-file formatters and to
      pre-commit-driven hygiene stacks.
  project-history:
    - >
      The GitHub repository was created on 2023-02-23. The README presents the tool as a
      general formatter for sorted blocks and documents installation through `go
      install` and pre-commit integration. Public GitHub releases began with the 0.1.x
      line in January 2024, followed by rapid feature growth around nested blocks,
      numeric sorting, YAML-style option lists, regex sorting, release binaries, and
      skip/group options.
  related-projects:
    - >
      keep-sorted is related to pre-commit, Go module distribution,
      repository-formatting tools, and language-specific formatters such as gofmt and
      clang-format, but it intentionally stays language-agnostic.
  sources:
    - https://api.github.com/repos/google/keep-sorted
    - https://github.com/google/keep-sorted
    - https://github.com/google/keep-sorted/releases
  summary:
    - >
      keep-sorted is Google's language-agnostic formatter for sorting marked blocks of
      lines inside larger files. Instead of trying to parse a whole language, it asks
      maintainers to mark regions with `keep-sorted start` and `keep-sorted end`, then
      sorts just those regions.
  timeline:
    - '2023-02-23: GitHub repository created.'
    - '2024-01-23: v0.1.1, v0.2.0, and v0.3.0 releases published.'
    - '2024-03-05: v0.4.0 added skip_lines and group_prefixes options.'
    - '2024-09-27: v0.5.0 added YAML-list support for multi-valued options.'
    - '2025-03-18: v0.6.0 added by_regex and a --version flag.'
    - '2026-06-30: v0.9.1 published.'
  usage:
    - >
      Users wrap a section of code, configuration, documentation, or data with
      keep-sorted markers and run `keep-sorted` over files or stdin. Options on the
      marker control grouping, block parsing, case sensitivity, duplicate removal,
      descending order, regex-based sorting, and blank-line handling.
related-packages:
  - id: brew:pre-commit
    reason: >
      Use pre-commit to install and run keep-sorted's officially supplied hook
      automatically during repository checks.
    rel: adjacent_workflow
    sources:
      - https://github.com/google/keep-sorted#pre-commit
      - https://pre-commit.com/
