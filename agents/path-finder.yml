history:
  adoption-history:
    - >
      Path Finder is positioned for macOS users whose file-management work exceeds
      Finder's basic workflow, including developers, creative professionals, and people
      managing large or complicated directory structures.
  package-nerd-significance:
    - >
      Path Finder is a long-running example of the commercial Finder-replacement
      category. Package-manager users value the cask as a reproducible way to install a
      proprietary power-user utility with unusually deep terminal, Git, file-inspection,
      and dual-pane features.
  project-history:
    - >
      Cocoatech developed Path Finder as a macOS file manager offering a more
      configurable, tool-rich workspace than the system Finder. The application combines
      ordinary file browsing with tabs, dual panes, queued file operations, modules, and
      developer-oriented tools.
  related-projects:
    - >
      Commander One is another packaged dual-pane Finder alternative, with particular
      emphasis on remote servers, archives, cloud storage, and device access.
  sources:
    - https://support.cocoatech.com/hc/en-us/articles/43462431781396-What-is-Path-Finder
    - >
      https://support.cocoatech.com/hc/en-us/articles/43462660340244-Path-Finder-User-Interface-Overview
    - https://support.cocoatech.com/hc/en-us/articles/43505313427988-Terminal-Integration
    - https://support.cocoatech.com/hc/en-us/articles/43505345615636-Git-Integration
  summary:
    - Path Finder is Cocoatech's advanced file manager and Finder alternative for macOS.
  timeline:
    - >
      2025: Cocoatech published a refreshed official support library covering Path
      Finder's interface, settings, modules, terminal, and Git workflows.
  usage:
    - >
      Users browse and manipulate files through tabs or two independent panes, stage
      items in the Drop Stack, inspect metadata and permissions, and customize the
      surrounding module layout.
    - >
      Developer workflows can keep a terminal synchronized with the selected directory
      and expose common Git status and actions without leaving the file manager.
related-packages:
  - id: cask:commander-one
    reason: >
