credentials-file-location:
  macos:
    - macOS Keychain
    - ~/.aws/credentials
    - ~/.aws/config
history:
  adoption-history:
    - >
      Captain’s Deck was introduced for macOS power users seeking a keyboard-first
      alternative to Finder and other commercial dual-pane file managers. Reliable
      public adoption history beyond its initial 2026 release is not yet available.
  package-nerd-significance:
    - >
      The application deliberately revives orthodox-file-manager conventions—two panes,
      function-key operations, and keyboard navigation—inside a native modern macOS
      application. Package and Unix enthusiasts may particularly value its embedded
      shell, inline Git tools, remote protocols, archive browsing, and Homebrew Cask
      availability.
  project-history:
    - >
      Multimodal Solutions introduced Captain’s Deck in 2026 as a native Swift/AppKit
      dual-pane file manager for macOS. Its design explicitly draws on the interaction
      traditions of Norton Commander, Midnight Commander, Far Manager, and Total
      Commander.
  related-projects:
    - >
      Norton Commander, Midnight Commander, Far Manager, and Total Commander provide the
      orthodox-file-manager design lineage cited by the project.
    - >
      Finder, ForkLift, Commander One, Nimble Commander, and Path Finder are
      contemporary macOS alternatives discussed by the official site.
  sources:
    - https://www.captains-deck.com/
    - https://www.captains-deck.com/about.html
    - https://www.captains-deck.com/docs.html
  summary:
    - >
      Captain’s Deck is a native macOS dual-pane file manager combining orthodox
      keyboard controls with an embedded terminal, remote storage, Git integration,
      search, and archive browsing.
  timeline:
    - '2026: Captain’s Deck was introduced as a native macOS orthodox-style file manager.'
    - >
      2026: The product reached its 1.x release series and was distributed through
      Homebrew Cask.
  usage:
    - >
      Users navigate two local or remote directory panes, copy and move files with
      function keys, work in a terminal synchronized to the active pane, browse
      archives, search file contents, and connect to SFTP, FTP, S3-compatible, WebDAV,
      and cloud-storage services.
    - >
      Remote passwords, keys, and tokens are stored in the macOS Keychain; the S3
      interface can also read standard AWS credentials and configuration files.
