credentials-file-location:
  unix:
    - ~/.cline/data/secrets.json
history:
  adoption-history:
    - >
      Cline expanded from a VS Code extension into a shared agent platform exposed
      through IDE integrations, a native desktop application, a headless CLI, and an
      SDK. It supports numerous hosted and local model providers rather than requiring a
      single vendor.
    - >
      Its human-in-the-loop workflow—showing diffs and requesting approval for edits and
      terminal commands—helped establish it as an accessible form of agentic coding
      inside an editor.
  package-nerd-significance:
    - >
      Cline is important to package and developer-tool enthusiasts because it combines
      an open-source coding agent with provider choice, MCP integrations, project-local
      rules, skills, hooks, plugins, CLI automation, and persistent sessions.
    - >
      The retained internal package name `claude-dev` reflects the project's earlier
      identity and is a useful historical detail when locating extension storage or
      interpreting older integrations.
  project-history:
    - >
      The project was publicly known as Claude Dev in 2024 and was subsequently renamed
      Cline. The official extension package retains `claude-dev` as its package
      identifier while displaying the Cline name.
    - >
      The project evolved beyond its original editor extension into a common agent core
      serving VS Code, JetBrains, CLI, SDK, and desktop surfaces.
  related-projects:
    - Model Context Protocol integrations extend Cline with external tools and services.
    - Cline SDK exposes the agent core for embedding in other applications.
    - Cline Kanban provides a local interface for coordinating CLI agents.
  sources:
    - https://docs.cline.bot/cline-overview
    - https://github.com/cline/cline
    - https://github.com/cline/cline/blob/main/.clinerules/storage.md
    - https://github.com/cline/cline/blob/main/README.md
    - https://github.com/cline/cline/blob/main/docs/cli/cli-reference.mdx
  summary:
    - >
      Cline is an open-source AI coding agent available through desktop, IDE, CLI, and
      SDK interfaces. It can inspect and edit projects, run terminal commands, use
      external tools, and retain sessions while supporting explicit user approval
      controls.
  timeline:
    - '2024: The project was publicly used under the Claude Dev name.'
    - >
      2024–2026: The project adopted the Cline name and broadened from an editor
      extension into desktop, CLI, SDK, and additional IDE surfaces.
  usage:
    - >
      Developers give Cline a goal, review its plan, and allow it to read files, apply
      changes, execute commands, and react to compiler or test output. Project behavior
      can be customized with `.cline` rules, skills, hooks, MCP configuration, and agent
      definitions.
    - >
      Cline can use hosted-provider API keys, Cline-hosted access, or local model
      servers. Its CLI also supports noninteractive JSON output for scripts and CI
      workflows.
