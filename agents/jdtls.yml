id: brew:jdtls
display-name: Eclipse JDT Language Server
repo: https://github.com/eclipse-jdtls/eclipse.jdt.ls
docs:
  - https://github.com/eclipse-jdtls/eclipse.jdt.ls/blob/master/README.md
  - https://projects.eclipse.org/projects/eclipse.jdt.ls
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      JDT LS gained adoption by letting editors consume Eclipse-grade Java services
      through LSP instead of embedding the Eclipse IDE. The proposal named Codenvy,
      Microsoft, IBM, and Red Hat as interested parties, and the README says the server
      can be used with any editor that supports the protocol.
    - >
      Package managers made that workflow easier for terminal and editor users: the
      batch input records Homebrew, Alpine, and Scoop packages, and Homebrew exposes a
      jdtls formula for macOS and Linux installs.
  package-nerd-significance:
    - >
      JDT LS is important in package-manager culture because it turns a large IDE
      subsystem into an installable background service. A single jdtls package can wire
      Eclipse JDT into Neovim, Emacs, VS Code-derived clients, and other LSP front ends
      without packaging a whole Java IDE.
  project-history:
    - >
      The Eclipse proposal for JDT Language Server was filed on August 22, 2016. It
      framed LSP as a way to make Java tooling work across editors with otherwise
      incompatible extension systems, and it identified an earlier GitHub project,
      gorkem/java-language-server, as the initial contribution.
    - >
      The Eclipse project page records the project under Eclipse JDT and lists releases
      beginning with 1.0 on April 7, 2021. The GitHub repository and CHANGELOG then show
      regular feature, bug-fix, dependency, and Java-version support work across the 1.x
      series.
  related-projects:
    - >
      Related projects include Eclipse LSP4J for Java LSP bindings, Eclipse JDT for Java
      language intelligence, M2Eclipse for Maven support, Buildship for Gradle support,
      and the Eclipse Che and Orion projects named in the original proposal.
  sources:
    - https://formulae.brew.sh/formula/jdtls
    - https://github.com/eclipse-jdtls/eclipse.jdt.ls
    - https://github.com/eclipse-jdtls/eclipse.jdt.ls/blob/master/CHANGELOG.md
    - https://github.com/eclipse-jdtls/eclipse.jdt.ls/blob/master/README.md
    - https://projects.eclipse.org/projects/eclipse.jdt.ls
    - https://projects.eclipse.org/proposals/jdt-language-server
  summary:
    - >
      Eclipse JDT Language Server is the Eclipse Java tooling stack adapted to the
      Language Server Protocol. Its README describes a Java-specific language server
      based on Eclipse LSP4J, Eclipse JDT, M2Eclipse, and Buildship.
  timeline:
    - '2016: Eclipse proposal created for JDT Language Server.'
    - '2016: Proposal cited gorkem/java-language-server as the initial contribution.'
    - '2021: Eclipse project page records release 1.0 on April 7.'
    - '2025: Eclipse project page records frequent 1.x releases through the year.'
    - '2026: CHANGELOG records 1.60.0 with Javadoc quick-fix work and dependency maintenance.'
  usage:
    - >
      The language server is used by Java-aware editors to provide project import,
      diagnostics, completion, Javadoc hovers, code actions, navigation, formatting,
      code lenses, hierarchy views, and Maven or Gradle project support.
related-packages:
  - id: brew:maven
    reason: >
      Use Maven to build pom.xml-based Java projects that JDT LS can import and analyze
      through its documented Maven project support.
    rel: adjacent_workflow
    sources:
      - https://github.com/eclipse-jdtls/eclipse.jdt.ls
      - https://maven.apache.org/
  - id: brew:gradle
    reason: >
      Use Gradle to define and build Java projects that JDT LS imports through its
      documented Buildship-based Gradle support.
    rel: adjacent_workflow
    sources:
      - https://github.com/eclipse-jdtls/eclipse.jdt.ls
      - https://gradle.org/
