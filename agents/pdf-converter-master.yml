history:
  adoption-history:
    - >
      Lighten Software reports that its Mac applications have been available through the
      Mac App Store and collectively received more than 500,000 downloads since 2012.
      This figure covers the vendor's Mac catalog rather than PDF Converter Master
      alone.
  package-nerd-significance:
    - >
      PDF Converter Master typifies the commercial, locally installed PDF-conversion
      utilities distributed through the Mac App Store and Homebrew casks. It is useful
      to package users who prefer batch, offline document conversion over browser-based
      upload services.
  project-history:
    - >
      PDF Converter Master is part of Lighten Software's long-running collection of PDF
      and productivity applications for macOS, Windows, and iOS.
    - >
      The Mac edition developed as an all-in-one converter supporting Microsoft Office,
      Apple iWork, EPUB, CSV, rich text, plain text, and image output, with a separate
      OCR-capable edition for scanned documents.
  related-projects:
    - >
      Lighten Software also publishes PDF Converter OCR, format-specific PDF converters,
      PDF Toolbox, Sign PDF, Compress PDF, and Text Extractor.
  sources:
    - 'Official Mac product page: https://www.lightenpdf.com/pdf-converter-mac.html'
    - 'Official Mac software catalog: https://www.lightenpdf.com/mac-software'
    - >
      Official tutorial dated 2019-08-21:
      https://www.lightenpdf.com/product-tutorials/how-to-convert-pdf-to-office.html
  summary:
    - >
      PDF Converter Master is a commercial desktop document converter from Lighten
      Software. The Mac edition batch-converts PDFs to Office, iWork, ebook, text,
      spreadsheet, and image formats while attempting to preserve the source layout.
  timeline:
    - >
      2012: Lighten Software says its Mac applications began accumulating Mac App Store
      downloads from this year.
    - '2019: Lighten Software published an official step-by-step PDF Converter Master tutorial.'
    - >
      Current product line: PDF Converter Master remains the vendor's general-purpose
      PDF conversion application alongside an OCR edition.
  usage:
    - >
      Users add or drag multiple PDFs into the application, select an output format and
      page range, adjust format-specific options, choose an output folder, and run a
      batch conversion.
    - >
      A built-in reader previews source documents. The standard edition handles
      text-based PDFs, while Lighten markets its OCR edition for scanned or image-only
      documents.
