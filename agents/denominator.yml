id: brew:denominator
display-name: Denominator
repo: https://github.com/Netflix/denominator
docs:
  - https://github.com/Netflix/denominator#readme
  - https://github.com/Netflix/denominator/tree/v4.7.1/cli
config-file-location:
  unix:
    - ~/.denominatorconfig
credentials-file-location:
  unix:
    - ~/.denominatorconfig
history:
  adoption-history:
    - >
      Denominator's adoption was strongest in the Netflix OSS era, when cloud
      infrastructure teams wanted provider-neutral libraries for operational automation.
      Its Homebrew packaging was documented directly in the upstream README, which is a
      good sign that the CLI was intended for operators, not just Java developers.
    - >
      Its provider list reflected the multi-DNS reality of the early cloud era: AWS
      Route53, UltraDNS, DynECT, Rackspace Cloud DNS, OpenStack Designate, and test
      mocks all sat behind one command and API.
  package-nerd-significance:
    - >
      Denominator is a useful package-history artifact because it captures a moment when
      Netflix OSS libraries were routinely packaged as operator tools. A Java cloud
      library became a brew-installable executable for DNS work.
    - >
      It also shows why package managers preserve older infrastructure tools: even
      archived projects can remain useful for legacy automation, migrations, or reading
      old operational scripts.
  project-history:
    - >
      The official GitHub repository was created in January 2013 and describes
      Denominator as a portable Java library for manipulating DNS clouds, with a
      command-line version for quick use. The README ties the project to Netflix's need
      for multi-vendor DNS control and documents pluggable back ends, provider-specific
      credentials, and a common resource-record-set model.
    - >
      The CLI was packaged as a single executable jar so operators could run denominator
      like a normal Unix command instead of invoking java -jar. Its git-like command
      shape, provider listing, and YAML configuration file made it feel closer to dig or
      git than to a Java library demo.
    - >
      The GitHub repository is now archived, but tags through v4.7.1 and the v4.7.1 CLI
      docs preserve the last mature interface for Homebrew and other users.
  related-projects:
    - >
      AWS Route53, UltraDNS, DynECT, Rackspace Cloud DNS, and OpenStack Designate are
      official providers listed by Denominator.
    - >
      Dagger and Feign are Java libraries used in the provider architecture documented
      by the README.
    - >
      dig is an inspiration for the CLI feel, while git is an inspiration for subcommand
      structure.
  sources:
    - https://github.com/Netflix/denominator
    - https://github.com/Netflix/denominator#readme
    - https://github.com/Netflix/denominator/tree/v4.7.1/cli
    - https://api.github.com/repos/Netflix/denominator
    - https://api.github.com/repos/Netflix/denominator/tags
  summary:
    - >
      Denominator is a Netflix OSS Java library and CLI for portable control of DNS
      providers. It abstracts common zone and record operations across Route53,
      UltraDNS, DynECT, Rackspace Cloud DNS, OpenStack Designate, and mock providers.
  timeline:
    - '2013: The Netflix/denominator repository is created on GitHub.'
    - '2013: The README documents Denominator as a multi-vendor interface for DNS clouds.'
    - '2015: The v4.x tag series is active, including v4.6.0 in the CLI docs.'
    - '2023: The archived repository shows its last push date in GitHub metadata.'
  usage:
    - >
      CLI users choose a provider with -p or a named provider from ~/.denominatorconfig,
      then list or change zones, records, and geo records. Credentials can be passed as
      repeated -c arguments, read from the YAML config file, or supplied by DENOMINATOR_
      environment variables.
    - >
      Library users create a DNSApiManager for a provider and then work with zones and
      resource record sets. The official README emphasizes a portable model where
      providers are Dagger modules and HTTP bindings are handled through Feign.
related-packages:
