id: brew:kubernetes-cli@1.35
display-name: kubectl 1.35
repo: null
docs:
  - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig
  - https://kubernetes.io/docs/reference/kubectl
config-file-location:
  unix:
    - ~/.kube/config
credentials-file-location: null
history:
  adoption-history:
    - >
      By the project's tenth anniversary in 2024, Kubernetes described itself as one of
      the largest open source projects, with more than 88,000 contributors from more
      than 8,000 companies. kubectl's adoption followed Kubernetes itself: package
      managers, cloud SDKs, CI images, and developer workstations commonly package it
      because it is the common denominator for cluster operations.
  package-nerd-significance:
    - >
      For package maintainers, kubectl is a canonical example of a fast-moving
      infrastructure CLI that benefits from versioned formulas. The versioned Homebrew
      formula lets users install a specific Kubernetes client without replacing every
      other cluster-management tool on the machine.
  project-history:
    - >
      Kubernetes began as a Google-originated open source project in June 2014, drawing
      on experience from Google's internal Borg and Omega systems. kubectl emerged as
      the operator-facing command line for talking to the Kubernetes API server and
      became the daily interface for applying manifests, inspecting cluster state,
      debugging workloads, and managing resources.
    - >
      Kubernetes 1.0 was announced in July 2015 and the project was placed under the
      newly formed Cloud Native Computing Foundation. Kubernetes v1.35, named
      Timbernetes, was announced on December 17, 2025 with 60 enhancements across
      stable, beta, and alpha features.
  related-projects:
    - >
      Related Kubernetes command-line tools include kubeadm for cluster bootstrapping,
      helm for package installation, kustomize for manifest customization, and krew for
      kubectl plugins.
  sources:
    - https://kubernetes.io/blog/2018/07/20/the-history-of-kubernetes-the-community-behind-it/
    - https://kubernetes.io/blog/2024/06/06/10-years-of-kubernetes/
    - https://kubernetes.io/blog/2025/12/17/kubernetes-v1-35-release/
    - https://kubernetes.io/docs/home/
    - https://kubernetes.io/docs/reference/kubectl/
  summary:
    - >
      kubectl is the standard command-line client for Kubernetes, the CNCF-hosted open
      source container orchestration project. The Homebrew package kubernetes-cli@1.35
      is a version-pinned distribution of that client for the Kubernetes 1.35 release
      line.
  timeline:
    - >
      2014: Kubernetes received its first public GitHub commit on June 6 and was
      announced at DockerCon on June 10.
    - '2015: Kubernetes 1.0 was announced and the project joined the newly formed CNCF.'
    - >
      2024: Kubernetes' tenth-anniversary writeup reported more than 88,000 contributors
      from more than 8,000 companies.
    - '2025: Kubernetes v1.35 Timbernetes was announced on December 17.'
  usage:
    - >
      kubectl reads kubeconfig data from ~/.kube/config by default, or from paths
      selected with KUBECONFIG or --kubeconfig. Package users often pin kubectl to a
      Kubernetes minor release, such as 1.35, to stay within the client/server
      version-skew expectations used by Kubernetes operators.
related-packages:
  - id: brew:krew
    reason: >
      Krew discovers and installs community kubectl plugins that appear as additional
      kubectl subcommands.
    rel: adjacent_workflow
    sources:
      - https://kubernetes.io/docs/tasks/extend-kubectl/kubectl-plugins/
      - https://sigs.k8s.io/krew/
  - id: brew:helm
    reason: >
      Use Helm alongside kubectl when Kubernetes applications should be installed,
      upgraded, and rolled back as versioned charts rather than managed as individual
      manifests.
    rel: adjacent_workflow
    sources:
      - https://helm.sh/docs/intro/introduction/
      - https://helm.sh/docs/intro/quickstart/
tags:
  - cli
  - cluster-management
  - kubectl
  - kubernetes
  - versioned
provenance:
  category-sources:
    - 'source_facts.description: Kubernetes command-line interface.'
  display-name-sources:
    - source_facts.executables lists kubectl; package id supplies version 1.35.
  docs-sources:
    - >
      Official Kubernetes kubectl reference and kubeconfig documentation match
      source_facts.homepage.
  history-sources:
    - https://kubernetes.io/blog/2018/07/20/the-history-of-kubernetes-the-community-behind-it/
    - https://kubernetes.io/blog/2024/06/06/10-years-of-kubernetes/
    - https://kubernetes.io/blog/2025/12/17/kubernetes-v1-35-release/
    - https://kubernetes.io/docs/home/
    - https://kubernetes.io/docs/reference/kubectl/
  repo-sources:
    - >
      source_facts.repo is already populated with the official GitHub repository; prompt
      requires repo=null when present.
  tags-sources:
    - Official Kubernetes docs describe kubectl as the Kubernetes command-line tool.
category-confidence: high
category-path:
  - developer-tools
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
