id: brew:fluid-synth
display-name: FluidSynth
repo: null
docs:
  - https://www.fluidsynth.org/documentation
  - https://www.fluidsynth.org/api
config-file-location:
  unix:
    - ~/.fluidsynth
    - /etc/fluidsynth.conf
  windows:
    - '%USERPROFILE%\fluidsynth.cfg'
    - '%ProgramData%\fluidsynth\fluidsynth.cfg'
credentials-file-location: null
history:
  adoption-history:
    - >
      FluidSynth's adoption is visible in its official showcase of frontends and
      dependent applications, including QSynth, wxFluid, LMMS, MusE, Miditzer, Swami,
      jOrgan, Denemo, and other music tools. The project site also notes embedded and
      mobile-app usage.
  package-nerd-significance:
    - >
      FluidSynth is important in package ecosystems because it provides a common free
      MIDI synthesis backend: one packaged shared library and CLI can enable MIDI
      playback across many otherwise unrelated applications.
    - >
      It is also a useful packaging case because audio backends, optional features,
      SoundFont search behavior, ABI compatibility, and command-line rendering all
      matter to downstream users.
  project-history:
    - >
      The official project site presents FluidSynth as a GUI-less synthesizer that
      reached widespread distribution and became reusable through a shared library API.
      Its feature set centers on SoundFont 2 and SoundFont 3 playback, MIDI file
      playback, audio drivers, and a built-in command-line shell.
    - >
      The release history shows a long 1.x line followed by the 2.x series. FluidSynth
      2.0.0 introduced major synthesis, MIDI, SoundFont, build-system, and API changes,
      including a CMake-only direction and removal of the deprecated autotools build
      system.
  related-projects:
    - QSynth is a cross-platform GUI frontend for FluidSynth.
    - >
      LMMS, MusE, Miditzer, Swami, jOrgan, and Denemo are listed by the project as
      applications or frontends using FluidSynth.
  sources:
    - https://github.com/FluidSynth/fluidsynth/releases/tag/v2.0.0
    - https://www.fluidsynth.org/
    - https://www.fluidsynth.org/documentation/
    - https://www.fluidsynth.org/wiki/ChangeLog/
  summary:
    - >
      FluidSynth is a real-time software synthesizer and shared library based on the
      SoundFont 2 specifications, with a command-line shell and API used by many music
      and multimedia applications.
  timeline:
    - '2009: FluidSynth 1.0.9 added PulseAudio, JACK MIDI, CoreMIDI, and OS/2 support.'
    - >
      2010: FluidSynth 1.1.0 added file rendering, multicore synthesis, and developer
      API improvements.
    - >
      2018: FluidSynth 2.0.0 was released with major MIDI, SoundFont, API, and
      build-system changes.
    - '2025: FluidSynth 2.5.0 was released.'
    - '2026: FluidSynth 2.5.5 was released.'
  usage:
    - >
      Users run the fluidsynth command to render or play MIDI with SoundFont files,
      script the built-in shell, or use libfluidsynth from applications that need
      software MIDI synthesis. Developers use the API documentation when embedding the
      synthesizer in games, notation software, sequencers, or audio utilities.
related-packages:
  - id: brew:timidity
    reason: >
      Choose TiMidity++ for its classic MIDI-to-audio workflow and support for legacy
      patch and module formats; choose FluidSynth when an embeddable SoundFont-focused
      library is required.
    rel: alternative
    sources:
      - https://www.fluidsynth.org/
      - https://timidity.sourceforge.net/
