id: brew:git-split-diffs
display-name: git-split-diffs
repo: https://github.com/banga/git-split-diffs
docs:
  - https://github.com/banga/git-split-diffs#readme
config-file-location:
  unix:
    - .git/config
    - ~/.gitconfig
    - ~/.config/git/config
    - /etc/gitconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      git-split-diffs gained attention among developers who prefer richer diff review
      without leaving the shell. It is distributed through npm and Homebrew, and its
      repository acknowledges nearby tools such as diff-so-fancy and delta, placing it
      in the ecosystem of Git pager replacements.
  package-nerd-significance:
    - >
      The project is notable because it packages a modern editor-like diff presentation
      as a small CLI rather than as an IDE feature. For package managers, it is a clear
      example of the Node CLI pattern applied to developer ergonomics around Git review.
  project-history:
    - >
      The GitHub repository began in 2021, and early tags followed within days. The
      README presents the project around a visual goal: bringing split, side-by-side
      diffs with GitHub-like styling into command-line review sessions.
    - >
      The tool evolved as a terminal formatter built from familiar JavaScript packages,
      including shiki for VS Code-style syntax highlighting, chalk for terminal color,
      and diff parsing utilities. Its 2.x release line kept the same core idea while
      raising the Node engine baseline and refining packaging.
  related-projects:
    - >
      The README acknowledges diff-so-fancy, shiki, chalk, and delta as adjacent or
      enabling projects.
  sources:
    - https://formulae.brew.sh/formula/git-split-diffs
    - https://github.com/banga/git-split-diffs
    - https://github.com/banga/git-split-diffs/blob/main/README.md
    - https://github.com/banga/git-split-diffs/blob/main/package.json
    - https://github.com/banga/git-split-diffs/releases
  summary:
    - >
      git-split-diffs is a Node-based Git pager that renders GitHub-style side-by-side
      diffs with syntax highlighting inside a terminal.
  timeline:
    - '2021: Repository and early v0.1 tags appeared.'
    - '2024: v2.0 releases moved the release line into the 2.x series.'
    - '2025: v2.3.0 release was published.'
  usage:
    - >
      Practitioners usually configure Git's core.pager to pipe colored diffs through
      git-split-diffs and less, or run git diff into the command manually. Git config
      keys tune wrapping, inline change highlighting, syntax themes, terminal width
      fallback, and custom theme directories.
related-packages:
  - id: brew:git-delta
    reason: >
      Choose git-delta for a Rust-based syntax-highlighting pager with side-by-side mode
      plus diff navigation, blame formatting, merge-conflict display, and grep support.
    rel: alternative
    sources:
      - https://github.com/dandavison/delta#readme
      - https://github.com/banga/git-split-diffs#readme
  - id: brew:diff-so-fancy
    reason: >
      Choose diff-so-fancy when you want a simpler enhanced unified-diff presentation
      rather than git-split-diffs' two-column layout and syntax-theme machinery.
    rel: alternative
    sources:
      - https://github.com/so-fancy/diff-so-fancy#readme
      - https://github.com/banga/git-split-diffs#readme
