history:
  adoption-history:
    - >
      Processing became widely used in art and design education, generative art,
      visualization, installations, and introductory programming. Its community created
      more than one hundred libraries spanning computer vision, music, networking,
      three-dimensional export, data visualization, and electronics.
  package-nerd-significance:
    - >
      Processing helped establish creative coding as a recognizable software category by
      packaging an editor, language conventions, runtime, renderer, examples, and
      extension ecosystem into an approachable desktop environment. Its sketch model
      influenced related projects such as p5.js and language-specific modes.
  project-history:
    - >
      Ben Fry and Casey Reas began Processing in spring 2001 while studying in John
      Maeda's Aesthetics and Computation research group at the MIT Media Lab. It grew
      directly from Maeda's Design By Numbers project and was conceived as a software
      sketchbook for visual work and programming education.
    - >
      The free and open-source project grew from an educational environment into a
      professional creative tool. Fry and Reas established the Processing Foundation in
      2012 to support the software, related projects, and broader access to programming
      and creative coding.
  related-projects:
    - Design By Numbers
    - p5.js
    - Processing for Android
    - Processing Python Mode
    - Arduino
  sources:
    - https://processing.org/environment/
    - https://processing.org/overview/
    - https://processingfoundation.org/
  summary:
    - >
      Processing is a free, open-source software sketchbook and creative-coding
      environment for learning programming and producing visual and interactive work.
  timeline:
    - '2001: Ben Fry and Casey Reas began Processing at the MIT Media Lab.'
    - '2021: Processing marked twenty years since its first software release.'
    - '2012: The Processing Foundation was established.'
  usage:
    - >
      Users write and run programs called sketches in the Processing Development
      Environment, consult an integrated reference and examples, install contributed
      libraries or modes, and export finished work. Common uses include teaching,
      generative graphics, visualization, interactive installations, and
      physical-computing prototypes.
