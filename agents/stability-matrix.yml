id: cask:stability-matrix
display-name: Stability Matrix
repo: null
docs:
  - https://docs.lykos.ai/stability-matrix
  - https://docs.lykos.ai/stability-matrix/getting-started/data-directory.html
  - https://docs.lykos.ai/stability-matrix/settings/settings.html
config-file-location:
  linux:
    - ~/StabilityMatrix/settings.json
    - <chosen data directory>/settings.json
    - <application directory>/Data/settings.json (portable mode)
  macos:
    - ~/.config/StabilityMatrix/settings.json
    - <chosen data directory>/settings.json
    - <application directory>/Data/settings.json (portable mode)
  windows:
    - '%APPDATA%\StabilityMatrix\settings.json'
    - <chosen data directory>\settings.json
    - <application directory>\Data\settings.json (portable mode)
credentials-file-location:
  linux:
    - ~/.config/StabilityMatrix/user-secrets.data
  macos:
    - ~/Library/Application Support/StabilityMatrix/user-secrets.data
  windows:
    - '%APPDATA%\StabilityMatrix\user-secrets.data'
history:
  adoption-history:
    - >
      Stability Matrix has been adopted by local generative-AI users who want to install
      and maintain several inference interfaces without manually reproducing each
      project's Python environment and directory layout. Portable storage and a shared
      model library make it especially useful for enthusiasts with large model
      collections.
  package-nerd-significance:
    - >
      Stability Matrix behaves as a package manager for a fragmented local generative-AI
      ecosystem. It creates isolated package installations, manages embedded tooling and
      dependencies, permits version changes, and shares large model files across
      otherwise independent interfaces.
  project-history:
    - >
      Stability Matrix emerged publicly in 2023 as an open-source desktop manager for
      Stable Diffusion applications. It developed from an installer and launcher into a
      broader management environment covering packages, shared models, extensions,
      updates, rollbacks, workflows, and a built-in inference interface.
  related-projects:
    - >
      Managed packages include ComfyUI, Stable Diffusion WebUI variants, Forge,
      InvokeAI, and training tools.
    - >
      CivitAI and Hugging Face integrations support authenticated model discovery and
      downloads.
    - ComfyUI can serve as the backend for Stability Matrix's built-in inference interface.
  sources:
    - https://docs.lykos.ai/stability-matrix/
    - https://docs.lykos.ai/stability-matrix/getting-started/data-directory.html
    - https://docs.lykos.ai/stability-matrix/package-manager/overview.html
    - https://docs.lykos.ai/stability-matrix/settings/settings.html
    - https://github.com/LykosAI/StabilityMatrix#readme
  summary:
    - >
      Stability Matrix is an open-source, cross-platform package manager and inference
      interface for local Stable Diffusion and related image and video generation tools.
  timeline:
    - >
      2023: Public project documentation and discussions described portable package and
      model management.
    - >
      2025: Package version selection and rollback workflows were available through the
      application.
    - >
      2026: Upstream established a dedicated documentation site covering package
      management and built-in inference.
  usage:
    - >
      Users select a portable or custom data directory, install supported AI interfaces
      as isolated packages, share models between them, manage launch arguments and
      environments, and launch those interfaces. The built-in inference page can also
      generate images through an installed ComfyUI backend.
