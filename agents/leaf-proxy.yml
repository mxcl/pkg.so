id: brew:leaf-proxy
display-name: Leaf
repo: null
docs:
  - https://github.com/eycorsican/leaf#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Leaf's adoption is tied to the broader proxy-client ecosystem rather than a single
      server product. Homebrew, MacPorts, and Scoop packaging expose it as a desktop and
      developer utility for users who want a lightweight proxy executable with multiple
      protocol options.
  package-nerd-significance:
    - >
      Leaf is package-interesting because it collects many proxy-world protocols into
      one Rust CLI/framework. It also illustrates the naming collision problem common in
      package indexes: Homebrew names this formula leaf-proxy to distinguish it from
      RivoLink's unrelated Markdown previewer that also installs a leaf command.
  project-history:
    - >
      The GitHub release history available through the repository begins with v0.1.1 on
      September 27, 2020 and shows steady 0.x releases through v0.14.2 on February 25,
      2026. The README presents Leaf as a Rust-built proxy framework with a CLI package
      built via cargo.
  related-projects:
    - >
      Related protocols and projects include Shadowsocks, SOCKS5, Trojan, VMess, Vless,
      Xray Reality, QUIC transports, TUN-based transparent proxying, and platform proxy
      clients.
  sources:
    - https://api.github.com/repos/eycorsican/leaf/releases?per_page=50
    - https://formulae.brew.sh/formula/leaf-proxy
    - https://github.com/eycorsican/leaf
    - https://raw.githubusercontent.com/eycorsican/leaf/master/README.md
  summary:
    - >
      Leaf is eycorsican's versatile proxy framework, packaged in Homebrew as
      leaf-proxy. The upstream README describes support for inbound and outbound proxy
      protocols, transports, traffic-control features, and transparent proxying.
  timeline:
    - '27 Sep 2020: v0.1.1 is published in the GitHub release stream.'
    - '6 Oct 2020: v0.2.0 is published.'
    - '19 Apr 2021: v0.3.0 is published.'
    - '9 May 2022: v0.6.0 is published.'
    - '23 May 2023: v0.9.0 is published.'
    - '1 Jun 2024: v0.11.0 is published.'
    - '5 Nov 2025: v0.12.0 is published.'
    - '25 Feb 2026: v0.14.2 is published.'
  usage:
    - >
      The README documents HTTP, SOCKS5, Shadowsocks, Trojan, VMess, and Vless protocol
      roles, WebSocket/TLS/QUIC transports, proxy chaining, failover, and TUN or Windows
      NF transparent proxying. Building from source uses cargo build -p leaf-cli
      --release.
related-packages:
  - id: brew:shadowsocks-rust
    reason: >
      Choose shadowsocks-rust for a focused Shadowsocks client/server with detailed JSON
      configuration, ACL, container, and Kubernetes support; choose Leaf when one
      framework must combine Shadowsocks with protocols such as Trojan, VMess, Vless,
      and general proxy chaining.
    rel: alternative
    sources:
      - https://github.com/eycorsican/leaf#readme
      - https://github.com/shadowsocks/shadowsocks-rust#readme
