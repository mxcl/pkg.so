history:
  adoption-history:
    - >
      Droppy is distributed as a native macOS application, including through the
      Homebrew cask represented by this package record. It supports both notched and
      non-notched Macs and requires macOS 14 or later.
    - >
      The product expanded beyond its original file-shelf role to include clipboard
      history, status surfaces, an iPhone companion, and an extension catalogue called
      Droplets.
  package-nerd-significance:
    - >
      Droppy combines several normally separate macOS utilities—temporary file shelving,
      clipboard history, status overlays, quick file actions, and small
      extensions—behind one notch or floating-island interface.
    - >
      Its local-first design is notable for users evaluating desktop utilities with
      access to clipboard contents and files: the official privacy documentation says
      normal processing remains on-device, while cloud sharing is an explicit separate
      action.
  project-history:
    - >
      Droppy is a macOS productivity application built by Jordy Spruit. Its official
      documentation describes a native workspace at the top of the display rather than
      merely a cosmetic notch replacement.
  related-projects:
    - >
      Droppy for iPhone pairs with the Mac application for selected synchronization and
      actions.
    - DroppyKit is the official SDK used to build Droplet extensions for Droppy.
  sources:
    - https://getdroppy.app/changelog
    - https://getdroppy.app/docs
    - https://getdroppy.app/docs/privacy
    - https://getdroppy.app/docs/what
  summary:
    - >
      Droppy is a native macOS file shelf and productivity surface that also provides
      clipboard history, live status, quick actions, and optional Droplet extensions.
  timeline:
    - >
      2026: The official site documents Droppy as a commercial macOS application with a
      comprehensive handbook, Droplet ecosystem, and iPhone companion.
  usage:
    - >
      Users drag files to the top of the display for temporary holding, then drag them
      into another application or location when needed.
    - >
      The application can also retain searchable clipboard history, expose file-oriented
      quick actions, show media and system status, and run optional Droplet extensions.
