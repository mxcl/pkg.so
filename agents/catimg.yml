id: brew:catimg
display-name: Catimg
repo: null
docs:
  - https://github.com/posva/catimg#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents Homebrew, Arch Linux, and Fedora installation examples, and
      the supplied package facts add Alpine, Debian, Nix, Ubuntu, and openSUSE
      packaging. That spread reflects the appeal of a tiny visual CLI utility across
      Unix package sets.
  package-nerd-significance:
    - >
      catimg is the kind of package that makes terminal environments feel playful
      without bringing in a GUI stack. It is also easy to package because the current C
      tool is small, MIT-licensed, and largely self-contained.
  project-history:
    - >
      The README says catimg was originally a script that used ImageMagick convert
      before becoming a C implementation. It keeps script-era documentation for the
      older dependency path while presenting the C version as the fast default.
  related-projects:
    - >
      Related tools include ImageMagick convert, which powered the original script
      version, and terminal graphics/image viewers that render media through ANSI colors
      or Unicode cells.
  sources:
    - https://api.github.com/repos/posva/catimg
    - https://github.com/posva/catimg
    - https://github.com/posva/catimg#readme
    - https://formulae.brew.sh/api/formula/catimg.json
    - https://github.com/posva/catimg/releases
  summary:
    - >
      Catimg is a terminal image renderer. Its README describes a small C program with
      no dependencies that prints JPEG, PNG, and GIF images in the terminal.
  timeline:
    - "2013: The repository links to the author's original catimg article from May 27."
    - '2026: Homebrew formula packages v2.8.0 from the official release archive.'
    - '2026: The README continues to document package-manager installation examples.'
  usage:
    - >
      catimg is used directly from the terminal to render image files using ANSI colors
      and optional Unicode high-resolution output. The README highlights the tradeoff
      between the older script's color accuracy and the C version's speed.
related-packages:
  - id: brew:chafa
    reason: >
      Choose Chafa when you need animated images, more input formats, color-mode
      controls, or native Sixel, Kitty, and iTerm2 output in addition to Unicode
      mosaics.
    rel: alternative
    sources:
      - https://github.com/posva/catimg#readme
      - https://hpjansson.org/chafa/
  - id: brew:viu
    reason: >
      Choose viu for a Rust-based terminal viewer with native Kitty and iTerm graphics,
      stdin input, transparency, recursive traversal, and animated GIF controls.
    rel: alternative
    sources:
      - https://github.com/posva/catimg#readme
      - https://github.com/atanunq/viu#readme
