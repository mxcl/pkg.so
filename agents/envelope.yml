id: brew:envelope
display-name: envelope
repo: null
docs:
  - https://github.com/mattrighetti/envelope#readme
config-file-location:
  unix:
    - .envelope
credentials-file-location:
  unix:
    - .envelope
history:
  adoption-history:
    - >
      The input package metadata lists Homebrew and MacPorts packages. Homebrew
      currently tracks the 0.8.0 source archive from the official GitHub release.
  package-nerd-significance:
    - >
      The project is interesting to package users because it replaces scattered .env
      files with a single SQLite-backed CLI database while retaining import/export
      workflows for traditional dotenv tooling.
  project-history:
    - >
      The GitHub repository was created in September 2023. The README describes an
      environment variables CLI backed by SQLite, with commands for initializing,
      adding, listing, importing, exporting, history, diffing, and locking the database.
  related-projects:
    - >
      The README explicitly positions envelope around .env file migration and shell/CI
      environment variable workflows.
  sources:
    - 'GitHub releases API: 0.1.7a published 2023-10-14 and 0.8.0 published 2026-04-19'
    - 'GitHub repository API: created_at 2023-09-21, language Rust, topics, and metadata'
    - 'Homebrew formula API: stable version 0.8.0 and official source archive'
    - >
      Official README: SQLite-backed .envelope storage, migration, security best
      practices, and command examples
  summary:
    - >
      envelope is a Rust command-line tool for managing environment variables in a
      per-project SQLite database named .envelope.
  timeline:
    - '2023: GitHub repository created'
    - '2023: 0.1.7a published on GitHub releases'
    - '2026: 0.8.0 published on GitHub releases and tracked by Homebrew'
  usage:
    - >
      Users initialize a project database with envelope init, add environment variables
      under named environments, export them into shell workflows, import from .env
      files, and lock or unlock the database for sensitive projects.
related-packages:
  - id: brew:envio
    reason: >
      Choose envio when you want individually encrypted profiles, GPG or system-keyring
      support, and credential-expiration metadata; envelope instead emphasizes a single
      SQLite database with history, diff, revert, and whole-database locking.
    rel: alternative
    sources:
      - https://github.com/mattrighetti/envelope#readme
      - https://github.com/humblepenguinn/envio/blob/main/docs/usage.md
