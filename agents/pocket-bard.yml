history:
  adoption-history:
    - >
      An organic demonstration video went viral in January 2024, producing millions of
      views and tens of thousands of downloads in one month. Pocket Bard reported more
      than 60,000 monthly active users by June 2026.
  package-nerd-significance:
    - >
      Pocket Bard is notable to desktop-package users as a specialized tabletop utility
      that moved from mobile-first distribution to native Windows and macOS packages.
      Its multiple framework rewrites also illustrate the packaging consequences of
      cross-platform application development.
  project-history:
    - >
      The founding team developed Pocket Bard to eliminate awkward gaps and manual
      playlist changes during tabletop role-playing sessions. An open beta appeared in
      April 2022, followed by the full iOS and Android release in February 2023.
    - >
      The application was rebuilt from Unity to Godot, then to .NET MAUI. Pocket Bard
      3.0, released in October 2025, was another ground-up rebuild using Kotlin
      Multiplatform. The version 3 desktop application followed in June 2026.
  related-projects:
    - Pocket Bard mobile applications
    - Pocket Bard desktop beta
    - Planned Pocket Bard Stream Deck integration
  sources:
    - >
      Official desktop announcement:
      https://www.pocketbard.app/our-blog/pocket-bard-comes-to-desktop
    - 'Official download page: https://www.pocketbard.app/download?platform=desktop'
    - 'Official project history: https://www.pocketbard.app/our-blog/the-journey-of-pocket-bard'
  summary:
    - >
      Pocket Bard is a cross-platform ambient-music and sound-effects application
      designed for tabletop role-playing games. It provides adaptive scenes, transitions
      between exploration, combat and victory, an intensity control, layered ambience
      and one-shot effects.
  timeline:
    - '2022-04: Pocket Bard reached open beta'
    - '2023-02: Full mobile application launched on iOS and Android'
    - '2024-01: A viral demonstration sharply increased downloads and subscriptions'
    - '2025-10-23: Pocket Bard 3.0 launched on Kotlin Multiplatform'
    - '2026-06-26: Version 3 launched officially for Windows and macOS'
  usage:
    - >
      Game masters use Pocket Bard during in-person or virtual tabletop sessions to
      control adaptive background music, ambience and one-shot effects without
      assembling and switching conventional playlists. The desktop interface can remain
      alongside a virtual tabletop or session notes.
