  - https://github.com/TigerVNC/tigervnc/wiki
  - https://tigervnc.org/
  - https://tigervnc.org/doc/vncpasswd.html
  - https://tigervnc.org/doc/vncviewer.html
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/tigervnc/default.tigervnc
    - ~/.config/tigervnc/default.tigervnc
    - $XDG_CONFIG_HOME/tigervnc/config
    - ~/.config/tigervnc/config
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/tigervnc/passwd
    - ~/.config/tigervnc/passwd
history:
  adoption-history:
    - >
      TigerVNC is distributed by multiple operating-system and Linux-distribution
      projects, including Fedora, openSUSE, FreeBSD, Arch Linux, Red Hat Enterprise
      Linux, and SUSE Linux Enterprise. It is used both as a desktop viewer and as
      server components for virtual or existing displays.
  package-nerd-significance:
    - >
      TigerVNC is one of the central open implementations of the VNC/RFB ecosystem and
      carries lineage from RealVNC, TightVNC, and X.org. Its combination of a native
      viewer, Unix display servers, cross-platform protocol support, and distribution
      packaging makes it a recurring building block in remote-desktop stacks.
  project-history:
    - >
      TigerVNC began as a next-generation TightVNC effort for Unix and Linux and split
      from TightVNC in early 2009 when the parent project concentrated on Windows. The
      codebase combines RealVNC 4 and X.org foundations and accelerates Tight encoding
      with libjpeg-turbo.
  related-projects:
    - TightVNC
    - RealVNC
    - X.org
    - libjpeg-turbo
    - noVNC
    - RFB protocol
  sources:
    - https://github.com/TigerVNC/tigervnc — official repository history and architecture
    - https://tigervnc.org/ — official documentation and distribution list
    - https://tigervnc.org/doc/vncpasswd.html — official credential-file manual
    - https://tigervnc.org/doc/vncviewer.html — official viewer manual
  summary:
    - >
      TigerVNC is a high-performance, multi-platform VNC client-and-server suite for
      viewing and exporting remote graphical desktops over the RFB protocol.
  timeline:
    - '2009: Split from TightVNC as an independent project'
    - '2020: Official support for the Windows server was dropped'
    - >
      2024: New installations adopted XDG base-directory paths and the Unix server
      gained modern graphics support
  usage:
    - >
      The native vncviewer connects to remote VNC servers and can load saved .tigervnc
      connection profiles. On Unix-like hosts, Xvnc creates virtual desktops, while
      x0vncserver shares an existing display; vncpasswd creates the password file used
      for VNC authentication.
