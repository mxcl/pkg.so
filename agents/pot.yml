history:
  adoption-history:
    - >
      Pot was distributed across Windows, macOS, and Linux. Its official README
      documents Homebrew installation on macOS, Winget on Windows, and packages or
      community channels for several Linux formats.
    - >
      Its plugin system and support for multiple translation, OCR, speech, and
      vocabulary services let users combine local engines with third-party APIs instead
      of depending on one provider.
  package-nerd-significance:
    - >
      Pot is notable as an open-source, cross-platform translation front end built
      around shortcut-driven desktop workflows. Its combination of selection
      translation, screenshot OCR, local HTTP integration, Wayland accommodations, and
      pluggable services made it useful beyond a conventional translation window.
    - >
      The repository's wide set of platform-specific release artifacts illustrates the
      packaging burden carried by cross-platform Tauri desktop applications.
  project-history:
    - >
      Pot was developed by Pylogmon as a GPL-licensed desktop application for text
      translation and recognition. The project expanded from selection and input
      translation into screenshot OCR, clipboard monitoring, text-to-speech, external
      HTTP calls, vocabulary export, and a plugin system.
    - >
      The project shipped a signed macOS build in its 3.0.7 release. The owner archived
      the official repository in September 2026, leaving it read-only.
  related-projects:
    - >
      Pot's plugin ecosystem supplies additional translation, recognition, speech, and
      vocabulary integrations.
    - >
      The official documentation now links to Manggo as a newer translation application
      from the developer.
  sources:
    - 'Official English README: https://github.com/pot-app/pot-desktop/blob/master/README_EN.md'
    - >
      Official application metadata:
      https://github.com/pot-app/pot-desktop/blob/master/com.pot_app.pot.metainfo.xml
    - 'Official documentation: https://pot-app.com/docs/'
    - 'Official release history: https://github.com/pot-app/pot-desktop/releases'
  summary:
    - >
      Pot is an open-source, cross-platform desktop application for text translation,
      selection translation, screenshot OCR, and related language workflows.
  timeline:
    - "2024: Pot 3.0 releases expanded the application's service and platform support."
    - '2025-05-10: Pot 3.0.7 added a signed macOS application build.'
    - '2026-09-07: The owner archived the official pot-desktop repository.'
  usage:
    - >
      Users select text and invoke a shortcut, open an input-translation window, monitor
      the clipboard, or capture a screen region for OCR or translation. Pot can run
      several services in parallel and exposes a local HTTP interface for integrations
      with tools such as PopClip and screenshot utilities.
