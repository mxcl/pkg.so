id: brew:mongosh
display-name: MongoDB Shell
repo: https://github.com/mongodb-js/mongosh
docs:
  - https://www.mongodb.com/docs/mongodb-shell
config-file-location:
  unix:
    - ~/.mongoshrc.js
credentials-file-location: null
history:
  project-history:
    - >
      The redesign focused on a shell that could be extensible, embeddable in other
      products, and easier to use in terminals. The public changelog records mongosh
      v1.0 on 2021-07-09, after a preview series that added features such as
      transactions support, AWS IAM authentication, script loading, --eval,
      .mongoshrc.js customization, MongoDB 5.0 support, Stable API-aware autocomplete,
      and snippets. The GitHub repository is a monorepo for shell components across
      REPL, browser, Compass, and related environments.
  sources:
    - https://formulae.brew.sh/formula/mongosh
    - https://github.com/mongodb-js/mongosh
    - >
      https://www.mongodb.com/company/blog/product-release-announcement/introducing-the-new-shell
    - https://www.mongodb.com/docs/mongodb-shell/
    - https://www.mongodb.com/docs/mongodb-shell/changelog/
    - https://www.mongodb.com/try/download/shell
  summary:
    - >
      mongosh is the MongoDB Shell, MongoDB's modern JavaScript and Node.js REPL for
      interacting with MongoDB deployments in Atlas, local installations, or remote
      hosts. MongoDB introduced the first preview on 2020-06-08 after deciding that
      extending the legacy mongo shell was not the right path for a growing MongoDB
      platform.
  usage:
    - >
      Users run mongosh to test queries, inspect and change data, configure settings,
      and script database operations with shell helpers on top of the MongoDB driver.
      MongoDB distributes it as an Apache-2.0 standalone product separate from the
      MongoDB Server, and package managers such as Homebrew, Nix, and Scoop make it
      available independently from server releases.
related-packages:
  - id: cask:mongodb-compass
    reason: >
      Choose Compass for a visual query, aggregation, and schema-analysis workflow;
      choose mongosh for a scriptable terminal REPL, noting that Compass also embeds
      MongoDB Shell.
    rel: alternative
    sources:
      - https://www.mongodb.com/docs/compass/
      - https://www.mongodb.com/docs/mongodb-shell/
  - id: brew:mongodb-atlas-cli
    reason: >
      Use Atlas CLI to create and administer Atlas deployments, then let its setup
      workflow connect to the resulting database through mongosh.
    rel: adjacent_workflow
    sources:
      - https://www.mongodb.com/docs/atlas/cli/current/
      - https://www.mongodb.com/docs/atlas/cli/current/command/atlas-setup/
      - https://www.mongodb.com/docs/mongodb-shell/
