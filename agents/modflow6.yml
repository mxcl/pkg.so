history:
  adoption-history:
    - >
      MODFLOW has been widely used by academics, private consultants, and government
      scientists for groundwater simulation. MODFLOW 6 continues that lineage while
      consolidating capabilities that had accumulated across specialized MODFLOW
      variants.
  package-nerd-significance:
    - >
      MODFLOW 6 is notable as a long-lived government scientific code delivered as a
      command-line executable. Package-manager distribution makes a substantial Fortran
      modeling system easier to install reproducibly alongside tools such as FloPy.
    - >
      Its input-driven workflow, stable executable interface, public-domain licensing,
      and cross-platform builds make it representative of scientific software that fits
      naturally into scripted and reproducible research environments.
  project-history:
    - >
      MODFLOW originated at the U.S. Geological Survey as a modular finite-difference
      groundwater-flow model. Core versions were released in 1984, 1988, 1996, 2000, and
      2005.
    - >
      Released in 2017, MODFLOW 6 was redesigned around an object-oriented framework
      capable of hosting multiple models and exchanges in one simulation. It brought
      together capabilities associated with earlier variants for unstructured grids,
      local refinement, transport, variable-density flow, and coupled surface-water and
      groundwater processes.
  related-projects:
    - FloPy is a Python package commonly used to create, run, and process MODFLOW models.
    - MODPATH 7 provides particle tracking for MODFLOW flow fields.
    - ZONEBUDGET for MODFLOW 6 calculates subregional water budgets.
    - ModelMuse provides a graphical interface for constructing and processing MODFLOW models.
  sources:
    - https://modflow6.readthedocs.io/en/stable/index.html
    - >
      https://www.usgs.gov/news/technical-announcement/groundwater-modeling-software-modflow-6-now-available
    - https://www.usgs.gov/publications/documentation-modflow-6-framework
    - https://www.usgs.gov/software/modflow-6-usgs-modular-hydrologic-model
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      MODFLOW 6 is the sixth core generation of the U.S. Geological Survey's modular
      groundwater-modeling system. It is an object-oriented simulation framework
      supporting multiple interacting models, groundwater flow and transport, particle
      tracking, and related hydrologic processes.
  timeline:
    - '1984: The USGS released the first core MODFLOW version.'
    - '1988–2005: Successive core versions expanded and modernized MODFLOW.'
    - '2017: The USGS publicly released MODFLOW 6 with its redesigned multi-model framework.'
    - >
      2022: USGS publications documented groundwater transport and subsidence
      capabilities in MODFLOW 6.
  usage:
    - >
      Users describe a simulation with MODFLOW input files and run the `mf6`
      command-line executable. Models may contain independent or coupled
      groundwater-flow, transport, energy, and particle-tracking components.
    - >
      Existing MODFLOW-2005, MODFLOW-NWT, and MODFLOW-LGR datasets can be migrated with
      the conversion utility distributed with MODFLOW 6. FloPy is frequently used to
      generate inputs and post-process results programmatically.
