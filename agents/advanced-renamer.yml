history:
  adoption-history:
    - >
      Advanced Renamer developed into a feature-rich desktop batch utility rather than
      remaining a simple search-and-replace renamer. Its official guide covers
      composable methods, metadata-driven names, regular expressions, JavaScript, batch
      copy and move modes, and undo support.
    - >
      The project historically served Windows users and now provides native downloads
      for both Windows and macOS. Version 4 introduced a current-generation guide and
      continues to receive feature releases; the official download page lists version
      4.24 with an August 4, 2026 release date.
    - >
      The product is free for personal use, while frequent and commercial users can
      purchase licenses. Version 4.x licenses include upgrades within the 4.x series.
  package-nerd-significance:
    - >
      Advanced Renamer sits between one-off Finder or Explorer operations and scripted
      shell pipelines. It gives users previewable, reversible, metadata-aware
      transformations without requiring them to write rename loops.
    - >
      Its ability to save method lists, consume media metadata, use regular expressions
      and JavaScript, and automate jobs from the command line makes it useful beyond
      casual GUI renaming.
  project-history:
    - >
      Advanced Renamer was initially designed for mass renaming files and folders. The
      official guide states that version 3.0 added copy and move modes using the same
      tag-driven naming technology.
    - >
      The 4.x series expanded metadata handling, exports, scripting interfaces, and
      macOS support. The current official download page distributes separate Apple
      silicon and Intel builds alongside the Windows edition.
  related-projects:
    - ExifTool-style metadata fields are exposed through Advanced Renamer’s tag system.
    - >
      The application’s Script method embeds a lightweight JavaScript engine for custom
      transformations.
    - >
      Its command-line automation tool complements the graphical batch editor for
      scheduled or server-style jobs.
  sources:
    - 'Official complete user guide: https://www.advancedrenamer.com/user_guide/complete_guide'
    - 'Official download and licensing page: https://www.advancedrenamer.com/download.php'
    - 'Official homepage: https://www.advancedrenamer.com/'
    - 'Official older-version archive: https://www.advancedrenamer.com/download_older'
    - 'Official version 4 changes: https://www.advancedrenamer.com/whatsnew'
  summary:
    - >
      Advanced Renamer is a desktop batch file-management utility for Windows and macOS.
      Users build an ordered list of methods, preview resulting names, and then rename,
      copy, or move files and folders in bulk.
  timeline:
    - 'Version 3.0: Copy and move batch modes are added to the original mass-renaming workflow.'
    - 'Version 4.08: The Timestamp method is added to macOS.'
    - 'Version 4.13: Text, CSV, and JSON list export is added.'
    - 'Version 4.14: Tag modifiers are introduced.'
    - 'Version 4.16: The scripting API gains line-oriented text-file reading.'
    - '2026: Advanced Renamer 4.24 is released on August 4 for Windows and macOS.'
  usage:
    - >
      Users add files or folders, assemble one or more ordered renaming methods, inspect
      the live New Filename preview, and start the batch when satisfied. Completed
      batches can be reverted through the Undo window.
    - >
      Typical workflows include sequential numbering, case conversion, prefix and suffix
      insertion, regular-expression replacement, photo organization using EXIF or GPS
      metadata, timestamp changes, and metadata-derived folder structures.
    - >
      Advanced users can save method configurations, write JavaScript methods, export
      file lists, or invoke the separate command-line automation tool.
