id: brew:all-repos
display-name: all-repos
repo: https://github.com/asottile/all-repos
docs:
  - https://github.com/asottile/all-repos
config-file-location:
  unix:
    - all-repos.json
credentials-file-location:
  unix:
    - all-repos.json
history:
  adoption-history:
    - >
      The input package-manager facts show Homebrew packaging. The README's primary
      installation path is pip, which matches its Python ecosystem audience and its use
      in multi-repository maintenance workflows.
  package-nerd-significance:
    - >
      all-repos is a concise answer to the monorepo-versus-many-repos maintenance
      problem: it gives package maintainers and infra engineers a scriptable way to fan
      out searches, sed edits, and pull requests across repositories without adopting a
      larger platform.
  project-history:
    - >
      The public repository begins in git history on 2017-08-02 with an initial
      skeleton, followed by v0.1.0 on 2017-08-04 and v1.0.0 on 2017-10-24. The README
      describes the package as a pip-installable CLI suite rather than a single command.
    - >
      The tool grew around a simple configuration file, all-repos.json, that chooses a
      repository source module and optional push module. Built-in modules cover sources
      such as GitHub and file-based repository lists, while push modules can open pull
      requests.
  related-projects:
    - 'git: underlying clone, grep, and repository operation tool.'
    - >
      GitHub, GitLab, Bitbucket, and Azure Repos: repository providers supported through
      source and push modules.
  sources:
    - Git history from https://github.com/asottile/all-repos.git
    - 'Official README: https://raw.githubusercontent.com/asottile/all-repos/main/README.md'
    - source_facts.package-manager
  summary:
    - >
      all-repos is Anthony Sottile's command-line toolkit for cloning many repositories
      and applying sweeping searches or changes across them.
  timeline:
    - '2017: Public Git history begins.'
    - '2017: v0.1.0 and v1.0.0 tags appear.'
    - '2026: v1.32.0 tag appears in repository history.'
  usage:
    - >
      Users run all-repos-clone to materialize or update every configured repository,
      then use tools like all-repos-grep, all-repos-find-files, all-repos-sed, and
      all-repos-manual to inspect or modify the fleet. The default config filename is
      all-repos.json and can be overridden with -C or ALL_REPOS_CONFIG_FILENAME.
    - >
      The README documents API keys in source_settings or push_settings, with
      api_key_env alternatives for keeping tokens in the environment.
related-packages:
  - id: brew:git
    reason: >
      Git is the underlying adjacent tool: all-repos clones repositories and distributes
      Git file searches, branch operations, commits, merges, and pushes across the
      configured collection.
    rel: adjacent_workflow
    sources:
      - https://github.com/asottile/all-repos#readme
      - https://git-scm.com/docs/git-clone
      - https://git-scm.com/docs/git-grep
tags:
