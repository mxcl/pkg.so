history:
  adoption-history:
    - >
      Adoption was niche but concrete. The homepage lists testing on Linux, Mac OS X,
      OpenBSD, and FreeBSD, and notes that FreeBSD carried it in the ports tree as
      comms/ems-flasher. Credits mention contributors for Mac build help, SRAM reverse
      engineering, OpenBSD testing, device detection, and FreeBSD port maintenance.
  package-nerd-significance:
    - >
      ems-flasher is a classic tiny hardware package: the value is not a big ecosystem,
      but keeping one specific USB cartridge usable from Unix-like systems. It is
      exactly the kind of tool package managers preserve for retro-computing and
      hardware-repair workflows.
  project-history:
    - >
      The official page describes the EMS USB cartridge as useful hardware for Game Boy
      development and play, then explains the gap: the supplied software only worked on
      Windows. ems-flasher was created as portable flasher software for Linux, Mac OS X,
      and similar systems.
    - >
      The project page shows an old-school workflow: build with make, run the binary
      directly, browse the gitweb repository, and consult project-hosted documentation
      and FAQ pages. The homepage was last updated in January 2013, after the small 2011
      release series.
  related-projects:
    - >
      Related areas include the EMS Game Boy USB cartridge, libusb-based hardware
      access, the FreeBSD comms/ems-flasher port, and Game Boy homebrew or cartridge
      backup tooling.
  sources:
    - https://lacklustre.net/projects/ems-flasher
    - https://lacklustre.net/projects/ems-flasher/download.html
  summary:
    - >
      ems-flasher is a command-line utility for reading and writing the EMS Game Boy USB
      cartridge from Mac OS X, Linux, and other libusb-capable systems. It exists
      because the original cartridge software was Windows-only.
  timeline:
    - '2011-03-21: Version 0.01 released.'
    - '2011-03-24: Version 0.02 released.'
    - '2011-08-25: Version 0.03 released and listed as the latest version.'
    - '2013-01: Official pages show their last update dates.'
  usage:
    - >
      Users flash ROMs with a write flag, dump ROM or SRAM contents with read mode,
      select banks, print ROM headers, and increase output with verbose mode. That made
      it useful for retro development, save backup, and moving homebrew or test ROMs
      onto real Game Boy-compatible cartridge hardware.
