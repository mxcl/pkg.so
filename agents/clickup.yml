history:
  adoption-history:
    - >
      ClickUp states that millions of teams use the platform. The desktop client is
      offered on every plan and supports guests as well as regular Workspace users.
  package-nerd-significance:
    - >
      The cask packages a native desktop surface for a primarily hosted work-management
      platform. It is useful to package-manager users who want scripted Mac
      provisioning, system-wide shortcuts, background operation, and fewer browser tabs.
  project-history:
    - >
      ClickUp began in 2017 with the goal of consolidating tasks, documents,
      conversations, and related work into one platform. Its product subsequently
      expanded into chat, calendars, dashboards, automation, integrations, and
      AI-assisted work.
  related-projects:
    - ClickUp web application
    - ClickUp mobile applications
    - ClickUp integrations and API
  sources:
