      Official desktop-app documentation:
      https://help.clickup.com/hc/en-us/articles/6311884486423-Use-the-ClickUp-desktop-app
    - 'source_facts.package-manager.brew-cask: clickup'
  summary:
    - >
      ClickUp is a commercial collaborative productivity platform combining project and
      task management with documents, chat, goals, dashboards, automation, and AI
      features. This package installs its macOS desktop client.
  timeline:
    - '2017: ClickUp began developing its unified work platform.'
    - >
      2026: The desktop application was documented for macOS, Windows, and Linux and
      made available on every ClickUp plan.
  usage:
    - >
      Users sign in to a ClickUp account and work with tasks, Docs, Chat, dashboards,
      and other Workspace features. The desktop client adds launch-at-startup behavior,
      global task and command shortcuts, background operation, and desktop
      clipboard-history features.
