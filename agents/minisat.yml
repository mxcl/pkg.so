history:
  project-history:
    - >
      Its importance came from being both compact and competitive. The MiniSat site
      highlights three design goals: easy modification, high efficiency, and integration
      into other tools through incremental SAT and mechanisms for non-clausal
      constraints. MiniSat and the SatELite preprocessor won industrial categories at
      the SAT 2005 competition, and later MiniSat-related work covered conflict-clause
      minimization, pseudo-Boolean solving through MiniSat+, and preprocessing through
      variable and clause elimination.
  sources:
    - http://minisat.se/
    - http://minisat.se/Papers.html
    - https://formulae.brew.sh/formula/minisat
    - https://github.com/niklasso/minisat
    - https://github.com/stp/minisat
  summary:
    - >
      MiniSat is a minimalist open-source SAT solver by Niklas Een and Niklas Sorensson.
      The authors presented "An Extensible SAT-solver" at SAT 2003, and the project site
      frames MiniSat as a small, well-documented solver intended to help researchers and
      developers start with satisfiability solving.
  usage:
    - >
      In practice, MiniSat is used as a command-line DIMACS CNF solver and as embeddable
      C++ code for verification, model checking, planning, constraint solving, and
      research prototypes. Its package-manager niche is the reference small SAT solver:
      less feature-heavy than modern portfolio solvers, but valuable because its
      codebase is readable, MIT-licensed, and historically central to SAT-solver
      education and experimentation.
related-packages:
  - id: brew:cadical
    reason: >
      Choose CaDiCaL for a modern, actively developed CDCL solver with an incremental
      C++ API and proof support; MiniSat remains valuable as the smaller historical
      reference implementation.
    rel: alternative
    sources:
      - https://minisat.se/
      - https://fmv.jku.at/cadical/
      - https://github.com/arminbiere/cadical#readme
  - id: brew:cryptominisat
    reason: >
      Choose CryptoMiniSat when multi-threading, native XOR-clause reasoning, or Python
      bindings matter; both accept general SAT workloads, while MiniSat emphasizes a
      compact, easily modified core.
    rel: alternative
    sources:
      - https://minisat.se/
      - https://www.msoos.org/cryptominisat5/
      - https://github.com/msoos/cryptominisat#readme
  - id: brew:kissat
    reason: >
      Choose Kissat for a modern competition-oriented non-incremental solver, while
      MiniSat is a better fit when its classic incremental and embeddable design is
      specifically required.
    rel: alternative
    sources:
      - https://minisat.se/
      - https://fmv.jku.at/kissat/
      - https://github.com/arminbiere/kissat#readme
