    - .gemini/settings.json
    - C:\ProgramData\gemini-cli\settings.json
    - C:\ProgramData\gemini-cli\system-defaults.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Gemini CLI's adoption path was tied to Google's Gemini Code Assist product line.
      The launch article stated that the tool shared technology with Gemini Code Assist,
      giving developers prompt-driven AI help in both VS Code and the terminal.
    - >
      Package-manager adoption followed the developer-tool pattern: the README documents
      global npm installation, `npx` execution, Homebrew installation, and MacPorts
      packaging. That made the CLI visible both to JavaScript users and to developers
      who expect AI tools to install like ordinary command-line utilities.
  package-nerd-significance:
    - >
      For package nerds, Gemini CLI is a marker of AI coding tools becoming ordinary CLI
      packages. It is distributed through language-package tooling and system package
      managers, has documented stable, preview, and nightly release channels, and
      exposes configuration paths that matter for reproducible developer environments.
  project-history:
    - >
      Google announced Gemini CLI on June 25, 2025 as an open-source AI agent that
      brings Gemini into developers' terminals. The launch positioned the CLI as a local
      utility for coding, content generation, research, problem solving, and task
      management rather than only as a chat wrapper.
    - >
      The public repository developed around a terminal-first workflow: installation
      through npm or Homebrew, documented release channels, configuration through
      settings files and `GEMINI.md`, support for non-interactive invocation, and
      integration points such as MCP servers and extensions.
  related-projects:
    - >
      Gemini CLI is related to Gemini Code Assist, Google AI Studio, Vertex AI, MCP
      servers, and the broader family of terminal AI agents used for code navigation and
      automation.
  sources:
    - >
      https://blog.google/innovation-and-ai/technology/developers-tools/introducing-gemini-cli-open-source-ai-agent/
    - https://formulae.brew.sh/formula/gemini-cli
    - https://github.com/google-gemini/gemini-cli
    - https://github.com/google-gemini/gemini-cli/blob/main/README.md
    - https://github.com/google-gemini/gemini-cli/tree/main/docs
  summary:
    - >
      Gemini CLI is Google's open-source terminal agent for interacting with Gemini
      models from the command line. It became significant quickly because Google
      launched it as an Apache-2.0 project with free individual access, Code Assist
      integration, built-in tools, and package-manager distribution through npm and
      Homebrew.
  timeline:
    - '2025-06-25: Google announces Gemini CLI as an open-source AI agent for the terminal.'
    - '2025: The repository publishes early preview, stable, and nightly release-channel tags.'
    - >
      2025: Homebrew, MacPorts, npm, and other package-manager entries make the tool
      installable through common developer workflows.
  usage:
    - >
      Practitioners use Gemini CLI inside source trees to ask questions about code, edit
      files, run shell commands, debug failures, generate applications from multimodal
      inputs, and automate tasks from scripts. The tool also supports Google Search
      grounding, file operations, web fetching, conversation checkpointing, and
      project-specific context files.
    - >
      Teams use the CLI alongside Gemini Code Assist and GitHub workflows, while
      individual users often treat it as a terminal-native coding assistant that can
      operate without leaving the shell.
related-packages:
  - id: cask:antigravity-cli
    reason: >
      Choose Antigravity CLI for Google's successor consumer terminal experience and
      unified multi-agent harness; supported enterprise and API-key workflows may
      continue using Gemini CLI.
    rel: alternative
    sources:
      - >
        https://developers.googleblog.com/an-important-update-transitioning-gemini-cli-to-antigravity-cli/
      - https://antigravity.google/docs/cli-overview
  - id: brew:claude-squad
    reason: >
      Claude Squad explicitly launches Gemini CLI with `cs -p "gemini"` and isolates
      concurrent agent tasks with tmux sessions and Git worktrees.
    rel: adjacent_workflow
    sources:
      - https://github.com/smtg-ai/claude-squad#readme
      - https://geminicli.com/docs/
