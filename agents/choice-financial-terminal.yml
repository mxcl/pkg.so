  summary:
    - >
      Choice金融终端 is Eastmoney's professional financial-information and
      investment-research workstation.
  timeline:
    - '2022: Eastmoney published the cited Choice financial-terminal usage guide.'
    - '2025: Eastmoney announced Choice智能金融终端 support for the HarmonyOS PC ecosystem.'
  usage:
    - >
      Users authenticate with a Choice or Eastmoney account and use the terminal to
      follow markets, search securities and research, build watchlists, extract data,
      manage portfolios, and produce investment-research materials.
