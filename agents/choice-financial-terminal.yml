history:
  adoption-history:
    - >
      Eastmoney describes the terminal as serving financial institutions, academic
      research organizations, investors, regulators, and media, with millions of users.
      An official university edition also supports institutional access for students and
      teachers.
  package-nerd-significance:
    - >
      The cask packages a specialized, account-based financial-data workstation. It is
      useful to package-manager users who want the terminal installed and maintained
      alongside ordinary macOS applications while retaining access to Choice's
      proprietary research environment.
  project-history:
    - >
      Choice金融终端 is an Eastmoney financial-data and investment-research terminal. Its
      official guides cover market monitoring, securities and fund data, research
      reports, portfolio analysis, data extraction, and other professional research
      workflows.
    - >
      The product later evolved into the Choice智能金融终端, combining its established data
      and research surfaces with AI-assisted search, research, writing, monitoring, and
      roadshow tools.
  related-projects:
    - >
      Related official Choice products include the Choice Data mobile application, the
      university edition, and EMQuant API integrations.
