history:
  adoption-history:
    - >
      The manual says CLooG was used beyond optimizing compilers, including control
      automata for high-level synthesis and polynomial approximation, and was designed
      to serve as a back end for automatic parallelizers such as LooPo.
    - >
      The supplied input shows packaging in Homebrew, dnf, and MacPorts. The official
      README and build docs also describe classic Unix source distribution concerns:
      configure, make, make install, GMP, PolyLib, and isl backends.
  package-nerd-significance:
    - >
      CLooG matters to compiler-package maintainers because it is a small specialized C
      library in the polyhedral optimization stack, with optional and historical
      dependencies such as isl, PolyLib, and GMP. Its packaging exposes the intersection
      of research compiler tooling and Unix library build systems.
    - >
      The changelog shows evolution around isl and OpenScop support, including OpenScop
      input in 0.17.0 and OpenScop coordinate/loop extensions in later 0.18.x releases.
      That makes it a useful marker package for polyhedral-model toolchains.
  project-history:
    - >
      The README records the first version of that file in January 2002, and the Texinfo
      manual records its first version in July 2002 with a 1.0 release on September 17,
      2002. The manual names Cedric Bastoul as author and describes CLooG as part of the
      Chunky project for data locality improvement.
    - >
      CLooG's core technical role is polyhedral code generation: given affine
      constraints and context, it emits pseudo-code or near-compilable code that visits
      integral points efficiently while avoiding unnecessary control overhead.
  related-projects:
    - >
      Related projects and dependencies include Chunky, PolyLib, isl, GMP, OpenScop, and
      LooPo. The manual also connects CLooG to automatic parallelizers and the wider
      polyhedral compilation model.
  sources:
    - https://github.com/periscop/cloog/blob/master/README
    - https://github.com/periscop/cloog/blob/master/doc/cloog.texi
    - https://github.com/periscop/cloog/blob/master/ChangeLog
  summary:
    - >
      CLooG, the Chunky Loop Generator, is a C software tool and library for generating
      loops that scan Z-polyhedra. Its official manual says it was originally written to
      solve code generation problems for optimizing compilers based on the polytope
      model.
  timeline:
    - '2001: Manual title page includes a September 2001 origin note.'
    - >
      2002: README first version recorded in January; manual first version recorded in
      July; release 1.0 recorded on September 17.
    - >
      2004: Manual asks users to cite Bastoul's PACT paper on code generation in the
      polyhedral model.
    - '2005: Manual records release 2.0 on November 21.'
    - '2007: Manual records release 2.1 on October 15.'
    - '2011: Changelog records 0.17.0 with OpenScop input support and isl backend updates.'
    - >
      2012: Changelog records 0.18.0 with isl 0.11.1, OpenMP/vectorization annotations,
      and OpenSCoP coordinates extension.
    - '2014: Changelog records 0.18.3 with isl 0.14 and OpenScop loop extension support.'
    - '2015: Manual edition 2.1.2 updated July 27, 2015.'
  usage:
    - >
      Users run cloog, optionally with an input file, or call CLooG as a library. The
      README describes input as affine inequalities over polyhedra and context
      parameters, and output as scanning code such as nested loops.
    - >
      Build-time usage is typical autotools C: from Git, fetch submodules and run
      autogen.sh, then configure, make, and make install. The README documents options
      for isl, PolyLib, GMP, integer size, and installation prefix.
