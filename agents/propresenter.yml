history:
  adoption-history:
    - >
      ProPresenter was initially built for houses of worship, where volunteer-friendly
      lyric, scripture, copyright, video, and stage-display workflows made it a
      specialized alternative to general-purpose slide software.
    - >
      Renewed Vision later promoted ProPresenter for concerts, schools, corporate
      events, government, sports, and broadcast production. The official product
      material documents multi-screen output, broadcast hardware support, streaming,
      automation, and third-party integrations, reflecting its expansion beyond worship
      services.
    - >
      An official 2015 customer story described ProPresenter 6 being used across a large
      church's weekly services, television, live streaming, and youth performance
      venues, illustrating adoption in multi-venue production environments.
  package-nerd-significance:
    - >
      ProPresenter represents a domain-specific desktop package whose value comes from
      tightly integrated live-production workflows rather than ordinary slide authoring.
      It combines presentation editing with lyrics, scripture, layered video, stage
      displays, operator views, broadcast outputs, automation, recording, and streaming.
    - >
      For deployment-oriented users, Homebrew cask provides a repeatable way to install
      the macOS application, although licensing, content libraries, show configuration,
      and production hardware remain application-level concerns.
  project-history:
    - >
      Renewed Vision was established in 2000 to build production tools for ministries,
      and ProPresenter grew from that focus on worship presentation. Official legacy
      manuals document ProPresenter 3 by 2008 and later Mac and Windows editions.
    - >
      By 2015, ProPresenter 6 was positioned as cross-platform lyric and media
      presentation software for live worship and streaming. The ProPresenter 7
      generation expanded the user guide around layered presentations, screen
      configuration, stage layouts, media, recording, RTMP streaming, network control,
      APIs, and integrations.
    - >
      The product subsequently moved toward account-based activation and
      subscription-linked services while retaining downloadable desktop applications for
      macOS and Windows.
