    - 'Official user guide: https://learn.renewedvision.com/propresenter'
  summary:
    - >
      ProPresenter is Renewed Vision's commercial presentation and live-production
      application for worship services, concerts, schools, businesses, broadcast
      environments, and other events.
  timeline:
    - '2000: Renewed Vision was established to create production tools for ministries.'
    - >
      2008: Official ProPresenter 3 documentation recorded an established downloadable
      desktop product.
    - >
      2015: ProPresenter 6 was documented in use for worship, television, streaming, and
      live-event production.
    - >
      2020s: ProPresenter 7 documentation formalized workflows for layered output,
      streaming, APIs, network control, and extensive integrations.
    - >
      2026: Renewed Vision's download history documents continued cross-platform feature
      and maintenance releases.
  usage:
    - >
      Operators build presentations from slides, lyrics, scripture, images, audio,
      video, live inputs, and layered visual elements, then send distinct layouts to
      audience screens, stage displays, lobby feeds, streams, or broadcast hardware.
    - >
      Production teams can use macros, MIDI, DMX, timecode, network control, an API,
      Stream Deck integration, recording, and RTMP streaming. Current activation can use
      a Renewed Vision account, but the official sources reviewed do not document a
      standalone credentials-file location.
