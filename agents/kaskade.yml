id: brew:kaskade
display-name: kaskade
repo: https://github.com/sauljabin/kaskade
docs:
  - https://github.com/sauljabin/kaskade#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/kaskade/settings.yaml
    - ~/.config/kaskade/settings.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      kaskade's package presence spans Homebrew, PyPI/pipx, and Docker images,
      reflecting a common Kafka-operator need: quick inspection and ad hoc consumption
      without opening a browser-based Kafka UI.
  package-nerd-significance:
    - >
      For package people, kaskade is a modern example of the Python TUI wave: a Kafka
      utility distributed as a CLI, but designed around rich terminal interaction rather
      than plain line-oriented output.
  project-history:
    - >
      The repository started in September 2021. The README frames the tool as a Kafka
      TUI for listing topics, partitions, groups, and group members, inspecting lag and
      records, and consuming messages with common deserializers.
    - >
      The 1.0.0 release work in July 2022 added Schema Registry support. Later releases
      expanded the consumer/admin workflow, with the 4.0.0 release changing several
      command-line options and adding config-file support.
  related-projects:
    - >
      Apache Kafka, Textual, Redpanda, Schema Registry tooling, kcat, and browser-based
      Kafka UIs occupy nearby workflow space.
  sources:
    - https://formulae.brew.sh/formula/kaskade
    - https://github.com/sauljabin/kaskade
    - >
      https://github.com/sauljabin/kaskade/commit/befa5b8a0a303b1bf187bb2b37a14b4588872525.patch
    - >
      https://github.com/sauljabin/kaskade/commit/cb9b27c626f337f2ac2fdd7e24913385fb3abb61.patch
    - https://github.com/sauljabin/kaskade/releases/tag/v1.0.0
    - https://github.com/sauljabin/kaskade/releases/tag/v4.0.0
  summary:
    - >
      kaskade is a terminal user interface for Apache Kafka, built with Textual, that
      combines topic administration and message consumption in a Python CLI/TUI package.
  timeline:
    - '2021-09-19: Repository history starts with the project bootstrap'
    - '2022-07-24: v1.0.0 release work added Schema Registry support'
    - '2025-12-26: v4.0.0 release work changed CLI options and added config-file support'
  usage:
    - >
      The documented command shape separates admin and consumer modes, for example
      connecting with a bootstrap server and then selecting a topic for consumption.
related-packages:
  - id: brew:kafkactl
    reason: >
      Choose kafkactl when you want scriptable commands for Kafka topics, consumer
      groups, ACLs, users, production, and consumption rather than Kaskade's interactive
      TUI.
    rel: alternative
    sources:
      - https://github.com/sauljabin/kaskade#readme
      - https://deviceinsight.github.io/kafkactl/
  - id: brew:kcat
    reason: >
      Choose kcat for a small non-JVM Kafka producer and consumer that composes readily
      in shell pipelines; choose Kaskade for interactive topic administration and record
      browsing.
    rel: alternative
    sources:
      - https://github.com/sauljabin/kaskade#readme
      - https://github.com/edenhill/kcat
