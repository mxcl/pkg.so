history:
  adoption-history:
    - >
      KICS adoption is tied to CI and DevSecOps workflows. Official materials document a
      GitHub Action, a Docker image, a standalone CLI, and broad platform coverage
      across Terraform, Kubernetes, Docker, CloudFormation, Ansible, Helm, OpenAPI,
      gRPC, Azure Resource Manager, Pulumi, Serverless Framework, OpenTofu, Bicep, and
      more.
  package-nerd-significance:
    - >
      KICS is significant because it packages a large IaC security rule corpus as a Go
      CLI that can be installed by package managers, run in containers, or embedded in
      GitHub workflows. It sits in the same package-nerd mental shelf as Terraform
      linters, policy engines, and static analyzers, but focuses on concrete
      misconfiguration checks across many IaC syntaxes.
  project-history:
    - >
      Checkmarx created the public KICS repository in 2020 and published v1.0.0 on
      2020-11-30. The project arrived during the wider shift from manually provisioned
      infrastructure toward Terraform, Kubernetes, Helm, CloudFormation, Docker Compose,
      and other declarative infrastructure formats, where configuration mistakes can
      become security defects.
  related-projects:
    - >
      Official KICS materials include a companion Checkmarx/kics-github-action
      repository for GitHub Actions integration and documentation for scanning common
      IaC ecosystems such as Terraform, Kubernetes, Helm, CloudFormation, and Docker
      Compose.
  sources:
    - https://checkmarx.com/product/kics/
    - https://docs.kics.io/
    - https://docs.kics.io/latest/integrations_ghactions/
    - https://github.com/Checkmarx/kics
    - https://github.com/Checkmarx/kics-github-action
    - https://github.com/Checkmarx/kics/releases
  summary:
    - >
      KICS, short for Keeping Infrastructure as Code Secure, is Checkmarx's open-source
      scanner for infrastructure-as-code vulnerabilities, compliance problems, and
      misconfigurations.
  timeline:
    - '2020: Checkmarx/kics repository created on GitHub.'
    - '2020: v1.0.0 release published on 2020-11-30.'
    - '2021: The 1.1 and 1.2 release series expanded after the initial 1.0 release.'
    - '2025: The 2.1 release series was active through repeated published releases.'
    - '2026: v2.1.20 release published on 2026-03-03.'
  usage:
    - >
      Users run `kics scan` or CI integrations against infrastructure repositories to
      catch risky cloud and orchestration settings before deployment. Query packs and
      documentation make it useful both for one-off audits and for policy-style checks
      in build pipelines.
related-packages:
  - id: brew:checkov
    reason: >
      Choose Checkov for its Python or YAML policy framework and graph-based resource
      checks; choose KICS for Checkmarx's customizable query architecture and
      KICS-specific integrations.
    rel: alternative
    sources:
      - https://github.com/Checkmarx/kics
      - https://www.checkov.io/1.Welcome/What%20is%20Checkov.html
  - id: brew:trivy
    reason: >
      Choose Trivy when IaC misconfiguration checks should be combined with container,
      filesystem, dependency, license, and secret scanning in one broader security tool;
      choose KICS for a dedicated IaC-query workflow.
    rel: alternative
    sources:
      - https://docs.kics.io/
      - https://trivy.dev/docs/latest/scanner/misconfiguration/
