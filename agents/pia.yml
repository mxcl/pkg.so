history:
  adoption-history:
    - >
      CNIL aimed the software principally at data controllers already somewhat familiar
      with impact assessments. It published both a stand-alone desktop application and a
      server-deployable web version so organizations could use it locally or integrate
      it with internal systems.
    - >
      The initial release was timed to help organizations prepare for the GDPR's May
      2018 application date. Its free license and customizable models were intended to
      encourage adaptation for particular organizations and business sectors.
  package-nerd-significance:
    - >
      PIA is a notable example of a data-protection regulator publishing an operational,
      free-software compliance tool rather than only prose guidance. Packagers encounter
      a multilingual Angular/Electron application whose desktop and self-hosted forms
      share CNIL's legal and technical knowledge base.
  project-history:
    - >
      France's data-protection authority, CNIL, released the beta PIA software in
      December 2017. It turned the PIA methodology CNIL had developed since 2015 into a
      guided application with risk visualizations and contextual material derived from
      the GDPR, CNIL's PIA guides, and its security guide.
    - >
      The source was published under a free license so users could add features and
      integrate the tool into organizational systems. The official repository
      subsequently became the front end for both browser deployment and packaged desktop
      builds.
  related-projects:
    - LINCnil/pia-back provides the official Ruby on Rails REST API for server deployments.
    - >
      CNIL's PIA methodology, knowledge-base, and security guides supply the
      application's underlying assessment material.
  sources:
    - https://github.com/LINCnil/pia
    - >
      https://www.cnil.fr/en/cnil-releases-free-software-pia-tool-help-data-controllers-carry-out-data-protection-impact
    - >
      https://www.cnil.fr/en/open-source-pia-software-helps-carry-out-data-protection-impact-assessment
  summary:
    - >
      PIA is CNIL's open-source Privacy Impact Assessment application for conducting
      data-protection impact assessments and demonstrating GDPR compliance.
  timeline:
    - '2015: CNIL began developing the PIA methodology later embodied in the software.'
    - '2017: CNIL released the free bilingual PIA software in beta.'
    - '2018: CNIL planned the finalized release ahead of the GDPR becoming applicable.'
    - '2021: CNIL announced version 3.0 with expanded customization capabilities.'
  usage:
    - >
      Users work through the impact-assessment methodology step by step, document
      processing operations and risks, consult contextual legal and technical guidance,
      define mitigating measures, and submit completed sections for evaluation and
      validation. Organizations may use a stand-alone desktop build or deploy the web
      front end with the official back end.
