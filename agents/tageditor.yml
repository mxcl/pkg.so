history:
  adoption-history:
    - >
      Tag Editor is a macOS-focused commercial desktop utility distributed through
      conventional Mac channels and the Homebrew cask `tageditor`. Its workflow is
      designed for users maintaining local music libraries rather than for server-side
      metadata pipelines.
  package-nerd-significance:
    - >
      It packages bulk metadata editing, filename transformation, artwork handling, and
      Music integration into a native spreadsheet-style interface. This makes it a
      graphical complement to command-line taggers for users who want to inspect many
      proposed changes before writing them.
  project-history:
    - >
      Amvidia's release history begins with Tag Editor 1.0.0 and records a gradual
      expansion from manual metadata editing into automatic tag and artwork retrieval,
      batch renaming, playlist interchange, broad format support, and Apple Music
      integration.
    - >
      Later releases added many more metadata columns, reusable column layouts, network
      lookups using services such as MusicBrainz and AcoustID, and a redesigned Tag
      Editor 2 experience for newer macOS releases.
  related-projects:
    - Apple Music and iTunes are supported as library import and export targets.
    - >
      MusicBrainz, AcoustID, Cover Art Archive, and Discogs are among the metadata or
      artwork sources documented by Amvidia.
  sources:
    - Input source_facts.package-manager.brew-cask.
    - https://amvidia.com/guides/tag-editor/getting-started
    - https://amvidia.com/tag-editor
    - https://amvidia.com/tag-editor/what-s-new
  summary:
    - >
      Tag Editor is Amvidia's spreadsheet-style macOS application for viewing and
      batch-editing audio and video metadata, artwork, and filenames.
  timeline:
    - 'Tag Editor 1.0.0: Initial version.'
    - >
      Tag Editor 1.0.5: Added automatic metadata and artwork retrieval plus batch
      renaming features.
    - 'Tag Editor 1.0.9: Expanded tag, playlist, and iTunes support.'
    - 'Tag Editor 2: Introduced a refreshed workflow optimized for newer macOS releases.'
  usage:
    - >
      Users open media files, folders, playlists, CUE sheets, or Music tracks as rows;
      edit metadata in columns; retrieve tags and artwork; review highlighted changes;
      then save them to the files. The application also exports playlists, text, CSV,
      and Music playlists.
