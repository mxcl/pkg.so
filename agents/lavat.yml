history:
  adoption-history:
    - >
      lavat spread through lightweight package channels rather than a large application
      ecosystem. The README advertises repository availability through packaging badges,
      and Homebrew and Nix package metadata both list it for convenient installation.
  package-nerd-significance:
    - >
      lavat is package-nerd catnip because it is the tiny terminal visual toy every
      package index needs: simple to build, visibly testable, and dependent on terminal
      behavior rather than a GUI stack.
  project-history:
    - >
      The GitHub repository was created on 2022-10-17 and its first GitHub release,
      v1.0.0, was published the same day. The README presents it as a little program for
      simulating a lava lamp in the terminal, requiring a Unix-like system, a C
      compiler, and make.
    - >
      Subsequent releases added interactive and visual controls: v2.0.0 on 2023-01-14
      added terminal-resize detection and runtime controls, while later release metadata
      records v2.1.0 on 2024-01-25, v2.2.0 on 2025-04-18, and v3.0.0 on 2026-01-27.
  related-projects:
    - >
      Related ideas include terminal screensavers, metaball demos, ASCII/ANSI animation
      programs, Homebrew packaging, and Nix packaging.
  sources:
    - https://formulae.brew.sh/formula/lavat
    - https://github.com/AngelJumbo/lavat
    - https://github.com/AngelJumbo/lavat/releases
  summary:
    - >
      lavat is a terminal lava-lamp simulation that renders moving metaballs in a
      Unix-like terminal. It is a small C-and-make style visual toy rather than a
      media-processing framework, but package managers classify it naturally with
      terminal animation and screensaver-like utilities.
  timeline:
    - '2022: GitHub repository created on 2022-10-17.'
    - '2022: v1.0.0 release published on 2022-10-17.'
    - '2023: v2.0.0 release published on 2023-01-14 with terminal resize and runtime controls.'
    - '2024: v2.1.0 release published on 2024-01-25.'
    - '2025: v2.2.0 release published on 2025-04-18.'
    - '2026: v3.0.0 release published on 2026-01-27.'
  usage:
    - >
      Users run lavat directly in a terminal and tune colors, gradients, speed, metaball
      radius, rim size, ball count, containment, party modes, and runtime controls. Its
      role is mostly decorative: a terminal animation, demo, or screensaver-like
      process.
