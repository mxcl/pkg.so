history:
  adoption-history:
    - >
      Phoenix Slides has remained a specialized macOS utility across major platform
      transitions, including Intel-era systems, Gatekeeper code signing, notarization,
      Dark Mode, Retina displays, and native Apple Silicon support.
    - >
      Its longevity and continued maintenance make it a lightweight package-managed
      alternative to larger photo-management applications for users who primarily need
      rapid browsing and slideshows.
  package-nerd-significance:
    - >
      Phoenix Slides exemplifies the durable single-purpose Mac utility: it is small,
      keyboard-oriented, and focused on local files rather than library import or cloud
      synchronization.
    - >
      Its support for EXIF inspection and lossless JPEG transformations through jpegtran
      gives it capabilities beyond a basic slideshow viewer, while hidden defaults allow
      experienced users to tune behavior.
  project-history:
    - >
      Dominic Yu created Phoenix Slides after finding the available Mac slideshow tools
      inadequate for quickly viewing and rotating a collection of photographs. The
      design was also partly inspired by the discontinued Curator image organizer.
    - >
      The official documentation dates the software to 2005. It has since accumulated
      thumbnail browsing, EXIF display, lossless JPEG transformations, temporary image
      groups, windowed slideshows, modern macOS compatibility, and extensive keyboard
      control.
  related-projects:
    - Curator
    - jpegtran
    - macOS Preview
  sources:
    - 'Official help and origin story: https://blyt.net/phxslides/doc'
    - 'Official homepage: https://blyt.net/phxslides'
    - 'Official version history: https://blyt.net/phxslides/version'
  summary:
    - >
      Phoenix Slides is a free, open-source macOS image browser and full-screen
      slideshow application with EXIF viewing and lossless JPEG transformation tools.
  timeline:
    - >
      2005: Phoenix Slides originated as a faster, more capable alternative for browsing
      and presenting photo folders.
    - >
      2009: The 1.2 series added and refined slideshow, thumbnail, and transformation
      behavior.
    - >
      2016: The 1.4 series added Gatekeeper signing, window restoration, and expanded
      slideshow controls.
    - '2021: Version 1.4.6 added native Apple Silicon support.'
    - >
      2023: Version 1.5 introduced windowed slideshows, tabs, live directory updates,
      and improved sorting.
    - >
      2026: The 1.6 series added smoother zooming, more sorting options, and updated
      macOS support.
  usage:
    - >
      Users browse directly through filesystem directories, select images or folders,
      and start full-screen or windowed slideshows without importing photographs into a
      managed library.
    - >
      Keyboard controls provide navigation, timed advance, zooming, rotation, grouping,
      and EXIF display. The application can also perform lossless JPEG rotations and
      related jpegtran-based transformations.
