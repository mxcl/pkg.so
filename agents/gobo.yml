id: brew:gobo
display-name: Gobo Eiffel
repo: https://github.com/gobo-eiffel/gobo
docs:
  - https://www.gobosoft.com/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Gobo's audience is narrower than mainstream Go or GNOME packages, but the package
      has a long-running release identity in the Eiffel ecosystem. GitHub release
      records include Gobo Eiffel 4.3 in November 2018 and later date-coded releases
      such as 26.05 in May 2026.
  package-nerd-significance:
    - >
      The package is interesting because it preserves a complete, installable slice of
      the Eiffel tooling world in a general-purpose package manager. It is a reminder
      that Homebrew formulas are not only for high-volume Unix utilities; they also
      carry language-community toolchains whose value is portability, archival
      continuity, and reproducible setup for a niche ecosystem.
  project-history:
    - >
      The Gobo Eiffel project positions portability and free tooling for the Eiffel
      community as its central concern. Its GitHub repository was created in September
      2009, and the repository README describes the project as hosted on GitHub while
      the official stable-release site is Gobosoft.
    - >
      The project includes a broad set of libraries and utilities rather than a single
      executable. The README lists nineteen Eiffel libraries and thirteen utilities,
      covering compiler, parser, lexer, documentation, testing, XSLT, and yacc-style
      workflows.
  related-projects:
    - EiffelStudio and the Gobo Eiffel Compiler are documented compiler contexts for Gobo.
    - >
      The bundled Boehm GC and Zig toolchain are acknowledged in the repository README
      as included third-party components.
  sources:
    - https://api.github.com/repos/gobo-eiffel/gobo
    - https://api.github.com/repos/gobo-eiffel/gobo/releases?per_page=100
    - https://formulae.brew.sh/formula/gobo
    - https://github.com/gobo-eiffel/gobo
    - https://github.com/gobo-eiffel/gobo/releases/tag/gobo-26.05
    - https://github.com/gobo-eiffel/gobo/releases/tag/gobo-4.3
    - https://www.gobosoft.com/
  summary:
    - >
      Gobo Eiffel is an open-source collection of Eiffel tools and libraries,
      distributed to make portable Eiffel development possible across multiple Eiffel
      compilers. The Homebrew package exposes the toolchain side of that ecosystem
      through commands such as geant, gec, gelex, gelint, getest, gexslt, and geyacc.
  timeline:
    - '2009-09-03: Public GitHub repository created'
    - '2018-11-28: Gobo Eiffel 4.3 release published on GitHub'
    - '2018: Gobo Eiffel 4.3 release notes describe migration from Xace files to ECF files'
    - '2026-05-15: Gobo Eiffel 26.05 release published on GitHub'
  usage:
    - >
      Developers use Gobo Eiffel for Eiffel compilation, testing, preprocessing,
      linting, lexical and parser generation, documentation, and XML/XSLT work. The
      repository documentation emphasizes use across different Eiffel compilers so users
      can keep their preferred compiler while using the Gobo tools and libraries.
related-packages:
  - id: brew:eiffelstudio
    reason: >
      EiffelStudio provides the ISE Eiffel compiler that Gobo officially lists as a
      supported environment for using its portable tools and libraries.
    rel: adjacent_workflow
    sources:
      - https://github.com/gobo-eiffel/gobo
      - https://docs.eiffel.com/
