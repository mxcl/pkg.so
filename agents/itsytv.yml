history:
  adoption-history:
    - >
      Itsytv is available as a free, MIT-licensed Mac application through GitHub
      releases and Homebrew, with a separately sold universal App Store edition covering
      Mac, iPhone, and iPad.
    - >
      The project documents direct installation with the `itsytv` Homebrew cask and
      notes that Homebrew's automation detects new GitHub releases.
  package-nerd-significance:
    - >
      Itsytv supplies a native Mac interface for a capability absent from macOS:
      controlling Apple TV through Apple's local-network remote protocols.
    - >
      Its split between a SwiftUI front end and the reusable `itsytv-core` Swift package
      makes the protocol implementation independently interesting to developers and
      automation-oriented users.
  project-history:
    - >
      Nick Ustinov created Itsytv as an open-source macOS menu-bar remote for Apple TV.
      The application uses Apple's MediaRemote and Companion protocols over the local
      network rather than a cloud relay.
    - >
      The project later exposed playback through AppleScript and Shortcuts, allowing
      integrations with tools such as Hammerspoon, Keyboard Maestro, Raycast, and shell
      scripts.
  related-projects:
    - itsytv-core
    - Itsypad
    - Itsyhome
    - pyatv
  sources:
    - https://github.com/nickustinov/itsytv-macos
    - https://github.com/nickustinov/itsytv-macos/releases
    - source_facts.package-manager
  summary:
    - >
      Itsytv is an open-source macOS menu-bar application that controls compatible Apple
      TV devices over the local network.
  timeline:
    - >
      2026: The documented release series added automation and interaction refinements,
      including AppleScript playback commands and trackpad or Magic Mouse D-pad swipes.
  usage:
    - >
      Pair a Mac with an Apple TV using the PIN shown on the television, then use the
      menu-bar panel for navigation, playback, text input, app launching, and
      now-playing information.
    - >
      The app supports multiple Apple TVs, per-device panel placement, global hotkeys,
      AppleScript commands, and a Shortcuts action. Pairing credentials are stored in
      macOS Keychain rather than a documented user-managed credentials file.
