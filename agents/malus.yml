history:
  adoption-history:
    - >
      The official site says Malus has served more than one million users and presents
      overseas Chinese users and international students as its principal audience. This
      is a vendor-reported adoption claim rather than an independently audited figure.
  package-nerd-significance:
    - >
      Malus is notable in macOS package catalogs as a region-specific consumer
      networking application rather than a general-purpose VPN or developer proxy. Its
      Homebrew cask gives command-line-oriented Mac users a reproducible way to install
      the otherwise proprietary desktop client.
  project-history:
    - >
      Malus was developed as a cross-platform network-acceleration service for users
      outside mainland China who need lower-latency access to Chinese streaming, music,
      gaming, live-broadcast, work, and education services. The product subsequently
      expanded across macOS, Windows, iOS, Android, Android TV, and browser extensions.
  related-projects:
    - >
      Related software categories include return-to-China accelerators, consumer VPN
      clients, game accelerators, and smart-routing proxies.
  sources:
    - https://getmalus.com/
    - https://getmalus.com/support
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Malus is a proprietary cross-platform network accelerator aimed primarily at
      overseas users accessing Chinese media, games, and online services. It combines
      automatic routing and geographically distributed acceleration lines with free and
      paid service tiers.
  timeline:
    - >
      After more than two years in operation: The official site reported serving over
      one million users.
    - >
      2026: The official site offered clients for macOS, Windows, iOS, Android, Android
      TV, and browsers.
  usage:
    - >
      Users install the client, register an account, and select or automatically
      activate acceleration for supported applications and games. The official help
      center covers client installation, account recovery, VIP service, and
      platform-specific connectivity problems.
