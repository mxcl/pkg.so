history:
  adoption-history:
    - >
      Argo CD adoption grew with GitOps and Kubernetes platform engineering. The
      upstream repository maintains an official users list with hundreds of
      organizations and the CNCF project page links case studies and project insights,
      indicating use by large enterprises, cloud-native vendors, universities, and
      platform teams.
    - >
      Its package-manager footprint reflects that adoption: the input records Homebrew,
      apk, MacPorts, Nix, pacman, Scoop, and WinGet packages, which is typical for a CLI
      that developers run locally while operators deploy the controller in clusters.
  package-nerd-significance:
    - >
      Argo CD is one of the packages that made `brew install argocd` feel normal for
      Kubernetes operators: a Go CLI with frequent releases, completions, auth material
      in a local config file, and tight coupling to a Kubernetes-native controller.
    - >
      It also represents a modern packaging split: the formula supplies the CLI binary,
      while most runtime deployment happens through Kubernetes YAML or Helm charts. That
      split is common for cloud-native tools but still important for reproducible
      developer laptops and automation runners.
  project-history:
    - >
      Argo CD is part of the Argo project family. The upstream README describes the
      project as declarative continuous delivery for Kubernetes and emphasizes
      version-controlled application definitions plus automated, auditable lifecycle
      management.
    - >
      CNCF records Argo as accepted on March 26, 2020 at the Incubating maturity level
      and promoted to Graduated on December 6, 2022. That graduation is the official
      marker that Argo, including Argo CD as the best-known GitOps component, had become
      stable and broadly adopted in cloud-native production environments.
  related-projects:
    - Other Argo projects include Argo Workflows, Argo Rollouts, and Argo Events.
    - >
      Argo CD Image Updater, ApplicationSet, Helm, Kustomize, and config-management
      plugins are common ecosystem companions.
  sources:
    - https://argo-cd.readthedocs.io/en/stable/user-guide/commands/argocd/
    - https://github.com/argoproj/argo-cd
    - https://raw.githubusercontent.com/argoproj/argo-cd/master/USERS.md
    - https://www.cncf.io/projects/argo/
  summary:
    - >
      Argo CD is a declarative GitOps continuous delivery system for Kubernetes. It
      continuously compares application definitions stored in Git with the live cluster
      state and drives Kubernetes resources toward the declared desired state.
  timeline:
    - '2020-03-26: Argo accepted into CNCF at Incubating maturity.'
    - '2022-12-06: Argo promoted to CNCF Graduated maturity.'
    - >
      Current: Upstream README lists Argo CD as declarative GitOps continuous delivery
      for Kubernetes and links official docs, user list, releases, and community
      channels.
  usage:
    - >
      The `argocd` CLI is used to log in to an Argo CD API server, manage application
      definitions, sync or inspect applications, switch contexts, and configure local
      client state. Official command docs show the client config path defaulting to an
      XDG-style `argocd/config` file and the `argocd configure` command managing local
      configuration.
    - >
      Operationally, package users often install the CLI with Homebrew for day-to-day
      interaction while installing the controller via manifests or Helm in Kubernetes.
      The package is therefore both a workstation tool and a control-plane companion.
related-packages:
  - id: brew:flux
    reason: >
      Flux is the strongest cataloged alternative for Kubernetes GitOps; choose it for a
      composable controller toolkit and Git-driven image automation, while Argo CD
      emphasizes an integrated API, CLI, and fully featured UI.
    rel: alternative
    sources:
      - https://fluxcd.io/flux/
      - https://argo-cd.readthedocs.io/
  - id: brew:helm
    reason: >
      Argo CD officially renders Helm charts with `helm template` while retaining
      control of the application lifecycle, so Helm is useful for authoring and
      validating the charts Argo CD deploys.
    rel: adjacent_workflow
    sources:
      - https://argo-cd.readthedocs.io/en/stable/user-guide/helm/
      - https://helm.sh/docs/
  - id: brew:kustomize
    reason: >
      Argo CD natively detects `kustomization.yaml` and renders Kustomize overlays,
      making Kustomize a direct companion for composing the manifests reconciled by Argo
      CD.
    rel: adjacent_workflow
    sources:
      - https://argo-cd.readthedocs.io/en/stable/user-guide/kustomize/
      - https://kubectl.docs.kubernetes.io/guides/introduction/kustomize/
