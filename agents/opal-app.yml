history:
  adoption-history:
    - >
      Opal expanded from its Apple-platform focus to availability across iPhone, Mac,
      and Android. The company describes the service as used by millions and identifies
      it as a 2025 Apple Design Award finalist.
  package-nerd-significance:
    - >
      The macOS package brings a consumer-oriented screen-time and app-blocking service
      to desktop package management. Unlike open-source focus utilities, Opal is
      distributed as a proprietary application with account and subscription features
      managed through its own product interfaces.
  project-history:
    - >
      Opal was founded by Kenneth Schlenker to build tools for controlling screen time
      and improving focus. The product developed into a multi-platform system centered
      on scheduled Focus Rules, timers, blocking difficulty levels, progress
      measurements, and focus milestones.
  related-projects:
    - Apple Screen Time
    - Opal for iPhone
    - Opal for Android
  sources:
    - https://brandkit.opal.so/press.html
    - https://opalapp.com/help
    - https://www.opal.so/
  summary:
    - >
      Opal is a proprietary screen-time and focus application that blocks distracting
      apps and websites through rules and timed focus sessions.
  timeline:
    - '2025: Opal was named an Apple Design Award finalist.'
    - >
      2025: Official support material described Android as newly launched while Mac
      feature parity remained in development.
  usage:
    - >
      Users define distracting applications or sites, create recurring Focus Rules, or
      start an on-demand Focus Timer. Blocking difficulty can be raised when users want
      sessions to be harder to bypass, while progress features provide feedback and
      milestones.
