id: brew:fastmcp
display-name: FastMCP
repo: https://github.com/PrefectHQ/fastmcp
docs:
  - https://gofastmcp.com/getting-started/welcome
config-file-location:
  unix:
    - fastmcp.json
credentials-file-location: null
history:
  adoption-history:
    - >
      FastMCP's adoption is unusually fast because it rides the MCP wave: AI agents need
      tool and data access, and Python developers want a decorator-based framework
      rather than raw protocol plumbing. The official README claims the standalone
      project is downloaded a million times a day and that some version of FastMCP
      powers 70% of MCP servers across languages.
    - >
      The repository also shows strong current interest, with more than 25,000 GitHub
      stars in June 2026. That signal should be read as developer attention and
      ecosystem momentum, not a precise measure of production deployments.
  package-nerd-significance:
    - >
      FastMCP matters to package nerds because it is the framework layer turning MCP
      from a protocol spec into an installable developer experience. The package bundles
      a fast-moving protocol client/server stack, a CLI, config conventions, docs meant
      for LLM consumption, and compatibility guidance for older SDK-bundled servers.
    - >
      It is also a snapshot of 2025-2026 packaging culture: packages are not just
      libraries for humans anymore, but surfaces for coding agents, MCP clients,
      generated configs, and documentation endpoints that tools can read
      programmatically.
  project-history:
    - >
      The standalone PrefectHQ/fastmcp repository was created on November 30, 2024, and
      PyPI records the first 0.1.0 upload minutes later. The official docs say FastMCP
      1.0 was incorporated into the official MCP Python SDK in 2024, while the
      standalone project later grew into the actively maintained framework.
    - >
      The project has moved quickly with the MCP ecosystem. Its upgrade guide documents
      the shift from the SDK-bundled import path, from mcp.server.fastmcp import
      FastMCP, to the standalone from fastmcp import FastMCP import, and says most
      servers can upgrade with that import change.
    - >
      By 2026, the project was on the 3.x line, with documentation organized around
      servers, clients, apps, deployment, CLI commands, integrations, and LLM-friendly
      docs. The README and docs identify Prefect as the maintainer and connect
      production deployment to Prefect Horizon.
  related-projects:
    - Model Context Protocol is the protocol FastMCP implements for tools and data access.
    - >
      The official MCP Python SDK bundled FastMCP 1.0 and remains a dependency path for
      compatibility.
    - Prefect Horizon is the production MCP gateway promoted by the FastMCP team.
  sources:
    - https://github.com/PrefectHQ/fastmcp
    - https://raw.githubusercontent.com/PrefectHQ/fastmcp/main/README.md
    - https://gofastmcp.com/getting-started/welcome.md
    - https://gofastmcp.com/getting-started/upgrading/from-mcp-sdk.md
    - https://gofastmcp.com/llms.txt
    - https://pypi.org/pypi/fastmcp/json
    - https://api.github.com/repos/PrefectHQ/fastmcp
  summary:
    - >
      FastMCP is Prefect's Python framework for building Model Context Protocol servers,
      clients, and applications. It turns ordinary Python functions into MCP tools and
      handles schema generation, validation, transports, authentication, lifecycle, and
      client behavior.
  timeline:
    - >
      2024: FastMCP 1.0 incorporated into the official MCP Python SDK, according to
      FastMCP docs.
    - '2024: Standalone PrefectHQ/fastmcp repository created on November 30.'
    - '2024: PyPI 0.1.0 uploaded on November 30.'
    - '2026: FastMCP 3.x documented as the active standalone framework.'
    - '2026: Repository shows more than 25,000 GitHub stars.'
  usage:
    - >
      A minimal FastMCP server creates a FastMCP instance, decorates a Python function
      with @mcp.tool, and calls mcp.run(). The framework generates the tool schema and
      handles the MCP side of the server.
    - >
      FastMCP also includes clients for connecting to local or remote MCP servers, apps
      for interactive UIs inside conversations, a CLI for running and inspecting
      servers, and fastmcp.json for portable declarative project configuration. The docs
      expose llms.txt and markdown pages so LLM-driven coding agents can consume the
      documentation directly.
related-packages:
  - id: brew:mcp-inspector
    reason: >
      Use MCP Inspector to exercise and debug the tools, resources, prompts, transports,
      and authentication exposed by a FastMCP server through an official visual, CLI, or
      terminal test client.
    rel: adjacent_workflow
    sources:
      - https://gofastmcp.com/getting-started/welcome
      - https://github.com/modelcontextprotocol/inspector#readme
