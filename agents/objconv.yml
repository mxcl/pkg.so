history:
  adoption-history:
    - >
      Homebrew core packaged objconv as a single `objconv` executable and used Agner
      Fog's upstream zip as the source URL, with stable version 2026-05-14 in the
      2026-07-01 formula JSON. Homebrew analytics recorded 491 installs over 365 days,
      and Debian sid packaged objconv 2.57+ds-1 for amd64, i386, x32, and an ia64
      unofficial port.
    - >
      The package's adoption is niche but durable: object-format conversion is not a
      mainstream daily task, yet cross-toolchain developers, compiler users, reverse
      engineers, and assembly programmers still need a compact utility that understands
      several historical and platform-specific binary formats.
  package-nerd-significance:
    - >
      objconv is the kind of package that keeps old and mixed binary ecosystems
      workable. Its value is not broad popularity but format coverage: OMF, COFF/PE,
      ELF, and Mach-O in one GPL-licensed utility, available through common package
      managers.
  project-history:
    - >
      Agner Fog distributes objconv from his optimization software page alongside
      manuals, vector-class libraries, test programs, and assembly libraries. That
      context matters: objconv is part of a broader x86 optimization and binary-tooling
      body of work, not an isolated package-manager utility.
    - >
      A D language forum thread announced objconv 2.03 on 2008-12-09 and highlighted
      conversion among OMF, COFF, ELF, and Mach-O plus improved disassembly of OMF
      COMDAT sections. By 2026, the Homebrew formula used date-based upstream packaging
      from Agner's zip file, while Debian packaged objconv as versioned source in its
      utils section.
  related-projects:
    - >
      objconv sits near assemblers, disassemblers, linkers, compiler object formats,
      Agner Fog's optimization manuals, and his assembly/vector tooling. It complements
      rather than replaces platform-native binutils, llvm-objdump, linkers, and
      compiler-specific library tools.
  sources:
    - https://formulae.brew.sh/api/formula/objconv.json
    - https://forum.dlang.org/thread/ghfptb%24fov%241%40digitalmars.com
    - https://packages.debian.org/unstable/utils/objconv
    - https://www.agner.org/optimize/#objconv
    - https://www.agner.org/optimize/objconv-instructions.pdf
  summary:
    - >
      objconv is Agner Fog's object-file converter and disassembler for x86 and x86-64
      platforms. It converts between COFF/PE, OMF, ELF, and Mach-O object formats, can
      modify symbol names, can build and convert static function libraries across
      platforms, and can dump or disassemble object and executable files.
  timeline:
    - >
      2008-12-09: a D forum announcement discussed objconv 2.03 and its cross-format
      object conversion support.
    - "2026-05-14: Agner Fog's upstream page listed `objconv.zip` with that modification date."
    - >
      2026-07-01: Homebrew core formula metadata listed stable version 2026-05-14;
      Debian sid metadata listed objconv 2.57+ds-1.
  usage:
    - >
      Users reach for objconv when object files or static libraries need to cross
      compiler or operating-system boundaries, when symbol names need adjustment, or
      when a disassembler is needed for x86-family object code. The official manual also
      states a boundary: objconv can dump or disassemble executables and
      shared-library-like files, but it cannot modify or convert them.
    - >
      The disassembler support listed by the upstream page spans instruction-set
      families from SSE4 through AVX512, FMA3, FMA4, XOP, and Knights Corner, matching
      the tool's role in low-level optimization and portability work.
