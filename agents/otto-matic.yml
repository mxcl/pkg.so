history:
  adoption-history:
    - >
      The original Mac release was bundled with some Apple computers, giving the game an
      audience beyond conventional retail distribution. The 2021 source port broadened
      availability to modern macOS, Windows, and Linux systems.
  package-nerd-significance:
    - >
      Otto Matic is an example of preservation through an authorized open-source port: a
      Carbon-era commercial Mac game was adapted for current operating systems and
      distributed through modern release and package channels.
  project-history:
    - >
      Pangea Software originally released Otto Matic in 2001 for Mac OS 9 and Mac OS X.
      It was implemented as a Carbon application and was later ported to 32-bit Intel
      Macs.
    - >
      After macOS 10.15 removed support for 32-bit applications and Carbon software,
      Iliyas Jorio updated the game with Pangea Software's permission. The modern port
      was released in 2021 for macOS, Windows, and Linux while aiming to preserve the
      original presentation and gameplay.
  related-projects:
    - >
      The maintainer has produced similar modern ports of Pangea Software games
      including Bugdom, Cro-Mag Rally, Mighty Mike, Nanosaur, Nanosaur II, and Billy
      Frontier.
  sources:
    - https://github.com/jorio/OttoMatic#readme
    - https://github.com/jorio/OttoMatic/releases
    - https://jorio.itch.io/ottomatic
  summary:
    - >
      Otto Matic is Pangea Software's science-fiction 3D action-adventure game,
      preserved as an authorized open-source port for modern desktop operating systems.
  timeline:
    - '2001: Pangea Software released Otto Matic for classic Mac OS and Mac OS X.'
    - "2019: macOS 10.15 ended compatibility with the game's earlier 32-bit Carbon build."
    - '2021: The authorized modern port received its initial playable cross-platform release.'
    - >
      2023: Version 4.0.1 added quality-of-life, compatibility, physics, and gameplay
      improvements.
  usage:
    - >
      Players guide the robot Otto through themed planets, rescue humans, fight alien
      enemies, and return to a rocket ship. The modern builds support keyboard, mouse,
      and gamepad input, with configurable controls.
