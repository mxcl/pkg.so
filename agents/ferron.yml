id: brew:ferron
display-name: Ferron
repo: null
docs:
  - https://ferron.sh/docs
  - https://ferron.sh/docs/reference/commands
config-file-location:
  unix:
    - ./ferron.kdl
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package metadata shows Ferron packaged by Homebrew and Nix. Official
      GitHub metadata also shows substantial repository interest for a young web-server
      project.
  package-nerd-significance:
    - >
      Ferron is significant to package users as a new Rust-based web server distributed
      as a single CLI, competing in the same operational space as lightweight reverse
      proxies and static/file-serving servers.
  project-history:
    - >
      The official GitHub repository was created in 2025 and describes Ferron as a fast,
      modern, easily configurable web server with automatic TLS.
  related-projects:
    - >
      Rust is the implementation language identified by official repository topics and
      package metadata.
    - Automatic TLS and HTTP serving put Ferron near web-server and reverse-proxy tooling.
  sources:
    - Official Ferron documentation.
    - Official GitHub release metadata.
    - Official GitHub repository metadata for ferronweb/ferron.
    - input.source_facts.package-manager
  summary:
    - >
      Ferron is a Rust web server focused on modern HTTP serving, configuration, and
      automatic TLS.
  timeline:
    - '2025: Official GitHub repository created.'
    - '2026: Official GitHub release metadata lists version 2.8.1.'
    - '2026: Repository metadata shows active maintenance.'
  usage:
    - >
      Package users install the `ferron` executable and run it with the documented
      command interface; the official command reference documents `./ferron.kdl` as the
      default configuration file.
related-packages:
  - id: brew:caddy
    reason: >
      Choose Caddy when mature automatic HTTPS and a well-established Caddyfile or JSON
      configuration ecosystem are more important than Ferron's Rust implementation and
      KDL-oriented workflow.
    rel: alternative
    sources:
      - https://ferron.sh/docs
      - https://caddyserver.com/docs/automatic-https
      - https://caddyserver.com/docs/quick-starts/reverse-proxy
  - id: brew:nginx
    reason: >
      Choose nginx when you need its long-established HTTP, reverse-proxy, mail-proxy,
      and extensive module-oriented deployment model.
    rel: alternative
    sources:
      - https://ferron.sh/docs
      - https://nginx.org/en/docs/
tags:
  - automatic-tls
  - cli
  - http
  - rust
  - tls
  - web-server
geiger:
  category: tool
  color: blue
  confidence: medium
  reason: broad file, network, media, or database tool signal
  reasons:
    - broad file, network, media, or database tool signal
  signals:
    - text:server
provenance:
  category-sources:
    - Official GitHub repository description and topics identify Ferron as a web server.
    - source_facts.description
  display-name-sources:
    - Official Ferron site and GitHub repository use Ferron.
    - current_curation.display-name
  docs-sources:
    - Official Ferron documentation at ferron.sh/docs and official command reference.
  history-sources:
    - Official Ferron documentation.
    - Official GitHub release metadata.
    - Official GitHub repository metadata for ferronweb/ferron.
    - input.source_facts.package-manager
  repo-sources:
    - >
      source_facts.repo already contains the official repository; prompt requires
      returning null instead of second-guessing it.
  tags-sources:
    - >
      Official GitHub repository topics include HTTP, Rust, server, web, and web-server;
      official docs mention automatic TLS.
category-confidence: high
category-path:
  - networking
  - web-servers
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: high
tags-confidence: high
