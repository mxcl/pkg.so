id: cask:smartsvn
display-name: SmartSVN
repo: null
docs:
  - https://docs.syntevo.com/SmartSVN
config-file-location:
  macos:
    - ~/Library/Preferences/SmartSVN/<major-version>/preferences.yml
    - ~/Library/Preferences/SmartSVN/<major-version>/smartsvn.properties
    - ~/Library/Preferences/SmartSVN/smartsvn.vmoptions
credentials-file-location:
  macos:
    - ~/Library/Preferences/SmartSVN/<major-version>/passwords
history:
  adoption-history:
    - >
      Syntevo describes SmartSVN as a popular Subversion client and offers free licenses
      to qualifying open-source developers, academic users, and charitable organizations
      alongside commercial licensing.
  package-nerd-significance:
    - >
      SmartSVN is a long-running representative of polished, standalone Subversion
      clients. It remains useful where centralized SVN repositories persist despite Git
      becoming dominant, and its cross-platform desktop packaging makes it relevant to
      graphical developer-tool catalogs.
  project-history:
    - >
      Syntevo began SmartSVN in 2005 as a successor to its earlier SmartCVS client,
      adapting its graphical version-control approach to Subversion repositories. The
      product has continued through numerous major releases and remains maintained by
      Syntevo for macOS, Windows, and Linux.
  related-projects:
    - >
      Apache Subversion provides the underlying version-control system. SmartGit,
      SmartSynchronize, DeepGit, and the earlier SmartCVS are related Syntevo tools.
  sources:
    - https://blog.syntevo.com/smartgit/2025/11/10/20-years-syntevo.html
    - https://blog.syntevo.com/tag/smartsvn.html
    - https://docs.syntevo.com/SmartSVN/
    - https://www.smartsvn.com/
  summary:
    - >
      SmartSVN is Syntevo's cross-platform graphical client for Apache Subversion,
      providing working-copy management, repository browsing, history inspection,
      merging, conflict resolution, and operating-system integration.
  timeline:
    - '2005: Syntevo started SmartSVN as a successor to SmartCVS for Subversion repositories.'
    - '2012: SmartSVN 7 added support for the Subversion 1.7 working-copy format.'
    - >
      2025: SmartSVN 14.5 added macOS 15 support and further comparison and editing
      improvements.
  usage:
    - >
      Developers use SmartSVN to check out repositories, inspect and commit working-copy
      changes, update or merge branches, resolve conflicts, browse revision history, and
      administer common SVN properties through a standalone graphical interface.
tags:
  - conflict-resolution
  - cross-platform
  - gui
  - merge
  - repository-browser
  - subversion
  - svn
  - version-control
