id: brew:sem-cli
display-name: sem-cli
repo: null
docs:
  - https://ataraxy-labs.github.io/sem
  - https://github.com/Ataraxy-Labs/sem#readme
config-file-location:
  unix:
    - ~/.sem/cloud.json
credentials-file-location: null
history:
  adoption-history:
    - >
      sem is distributed through Homebrew, MacPorts, Nix, Scoop, WinGet, npm, Cargo,
      release binaries, and a project installer. Its documentation emphasizes
      coding-agent workflows as well as direct terminal use.
  package-nerd-significance:
    - >
      sem applies tree-sitter parsing to a traditionally line-oriented version-control
      workflow. Package and tooling enthusiasts care about its attempt to make
      functions, classes, dependencies, and blast radius first-class Git concepts, plus
      its machine-readable output and MCP integration.
  project-history:
    - >
      Ataraxy Labs developed sem as a semantic analysis layer over Git. Rather than
      replacing Git's object store, it parses supported source languages and data
      formats into entities, then provides entity-level diff, blame, history,
      dependency, impact, and context operations.
    - >
      The project expanded into a broader Ataraxy Labs developer-tool stack alongside
      weave for semantic merging and inspect for structurally informed code review.
  related-projects:
    - >
      Git remains the underlying version-control system. tree-sitter supplies language
      parsing. Related Ataraxy Labs projects include weave, inspect, opensessions, and
      lazydiff.
  sources:
    - https://ataraxy-labs.github.io/sem/
    - https://github.com/Ataraxy-Labs
    - https://github.com/Ataraxy-Labs/sem#readme
    - source_facts.package-manager
  summary:
    - >
      sem is a semantic code-intelligence and version-control CLI built on Git, offering
      entity-level diffs, blame, history, dependency graphs, impact analysis, and
      agent-oriented context.
  timeline:
    - >
      2026: sem gained visible adoption as an agent-oriented semantic version-control
      tool and expanded its language and package-manager coverage.
    - >
      2026: Ataraxy Labs positioned sem as the analysis foundation of a related merge
      and code-review tool family.
  usage:
    - >
      Run sem inside an existing Git repository; basic local analysis requires no
      project setup. Commands such as sem diff, sem blame, sem log, sem entities, sem
      impact, and sem context operate on parsed code entities, and --json supports
      automation.
    - >
      sem setup can configure Git's external diff behavior and install related hooks;
      sem unsetup reverses that integration. Cloud-backed queries are opt-in per
      repository, while ordinary local analysis does not require credentials.
tags:
  - cli
  - git
  - semantic-diff
  - semantic-version-control
  - version-control
provenance:
  category-sources:
    - source_facts.description describes a semantic version-control CLI.
  display-name-sources:
    - source_facts.name and official repository name.
  docs-sources:
    - >
      source_facts.homepage is the official documentation site; current_curation.repo
      identifies the official GitHub README.
  history-sources:
    - https://ataraxy-labs.github.io/sem/
    - https://github.com/Ataraxy-Labs
    - https://github.com/Ataraxy-Labs/sem#readme
    - source_facts.package-manager
  repo-sources:
    - >
      source_facts.repo already supplies https://github.com/Ataraxy-Labs/sem; repo
      output is null per instructions.
  tags-sources:
    - source_facts.description and source_facts.executables.
category-confidence: high
category-path:
  - developer-tools
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: high
tags-confidence: high
