history:
  adoption-history:
    - >
      The Unarchiver became one of the leading free applications in the Mac App Store
      and accumulated millions of users. MacPaw cited that established user base when it
      acquired the application and committed to keeping it maintained and free.
  package-nerd-significance:
    - >
      The Unarchiver is a characteristic Mac power-user package: a small default-handler
      utility that quietly broadens the archive formats Finder can open. Its support for
      RAR, 7z, StuffIt-era formats, disk images, package formats, and archives with
      non-Latin filenames makes it useful at the boundary between modern macOS and files
      produced by other platforms or older software.
    - >
      The same underlying unarchiving work also produced the unar and lsar command-line
      tools for macOS, Windows, and Linux, connecting a familiar Mac desktop utility
      with command-line and Unix package-manager culture.
  project-history:
    - >
      Dag Ågren created The Unarchiver as a focused macOS extraction utility and
      maintained it for more than a decade. MacPaw acquired the application in July 2017
      after its creator had less time to maintain it, promising continued compatibility
      work, design updates, and free availability.
  related-projects:
    - unar
    - lsar
    - XADMaster
    - Archives for iOS
  sources:
    - https://macpaw.com/news/macpaw-bought-unarchiver
    - https://theunarchiver.com/
    - https://theunarchiver.com/command-line
  summary:
    - >
      The Unarchiver is a free macOS archive-extraction utility designed to handle
      substantially more formats and filename encodings than the system Archive Utility.
  timeline:
    - 'Mid-2000s: Dag Ågren created The Unarchiver.'
    - >
      2010s: The app reached millions of users and became a leading free Mac App Store
      utility.
    - >
      2017: MacPaw acquired The Unarchiver and committed to maintaining it and keeping
      it free.
  usage:
    - >
      Users commonly associate archive types with The Unarchiver through Finder's Get
      Info panel, after which opening an archive extracts it automatically. The
      application handles mainstream formats such as ZIP, RAR, 7z, tar, gzip, and xz as
      well as numerous legacy, disk-image, package, and game-data formats.
    - >
      The utility is especially useful for archives originating on other operating
      systems or using non-Latin filenames, and for older formats that macOS's built-in
      Archive Utility does not support.
