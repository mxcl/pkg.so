history:
  adoption-history:
    - >
      The package is distributed through Homebrew, MacPorts, and Nix according to the
      supplied package metadata, which is typical for a niche but useful terminal
      utility.
  package-nerd-significance:
    - >
      For package collectors, bed is a small example of the modern Go CLI pattern: a
      single portable executable providing an old Unix workstation tool category, the
      hex/binary editor, with familiar modal-editor ergonomics.
  project-history:
    - >
      The project was created by itchyny and its repository was opened in April 2018.
      The README frames the project as both a practical binary editor and an exploration
      of how to handle large files interactively in Go.
    - >
      Its upstream releases show a compact CLI tool that has remained active through the
      2020s, with v0.1.0 published in January 2020 and v0.2.8 published in December
      2024.
  related-projects:
    - >
      Related package categories include hex editors, binary viewers, and Vim-style
      terminal editing tools.
  sources:
    - https://api.github.com/repos/itchyny/bed
    - https://github.com/itchyny/bed#readme
    - https://github.com/itchyny/bed/releases
    - source_facts.package-manager
  summary:
    - >
      bed is a terminal binary editor written in Go, aimed at fast portable editing of
      binary files with a Vim-like interface.
  timeline:
    - '2018: GitHub repository created.'
    - '2020: v0.1.0 release published.'
    - '2024: v0.2.8 release published.'
  usage:
    - >
      bed is used for byte-level inspection and editing in a terminal. The README lists
      large-file support, split windows, search, undo and redo, partial writing, and
      Vim-influenced commands.
related-packages:
  - id: brew:bvi
    reason: >
      Choose bvi when you want the older vi-derived binary editor with Ex scripting and
      .bvirc startup configuration; choose bed for a modern Go implementation with split
      windows, large-file support, and broader undo/redo behavior.
    rel: alternative
    sources:
      - https://github.com/itchyny/bed#readme
      - https://bvi.sourceforge.net/man_bvi.html
      - https://bvi.sourceforge.net/overview.php
