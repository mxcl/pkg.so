history:
  adoption-history:
    - >
      Runway's first public announcement in 2018 described a free beta with roughly 200
      selected testers drawn from artists, designers, educators, and companies.
    - >
      The platform subsequently expanded from an accessible interface for existing
      machine-learning models into a commercial creative suite, research organization,
      mobile and web product, developer API, and enterprise offering. Its official
      Academy states that organizations use its training resources, but no independent
      adoption total is supplied here.
  package-nerd-significance:
    - >
      Runway is historically notable for moving creative machine learning from
      research-code setup into an installable visual tool. The early desktop application
      abstracted model runtimes and connected outputs to creative software; later
      generations shifted the center of gravity toward hosted generative-video models
      and account-backed workflows.
    - >
      For package users, the cask captures an earlier desktop-distribution phase of a
      product whose official getting-started guidance now emphasizes the web application
      and mobile clients. No official local configuration or credential file is
      documented.
  project-history:
    - >
      Runway emerged from Cristóbal Valenzuela's NYU Interactive Telecommunications
      Program thesis and was publicly announced in May 2018. The original beta aimed to
      make pre-trained machine-learning models usable by artists without requiring
      low-level environment setup.
    - >
      The company later developed its own multimodal generative systems. Gen-1 and Gen-2
      were announced in 2023, bringing video-to-video and text-to-video generation into
      the platform. Subsequent generations expanded quality, control, image generation,
      editing, character animation, workflows, APIs, and world-model research.
    - >
      The product evolved from the earlier ML Lab and desktop-oriented toolkit into a
      primarily hosted creative environment organized around generative sessions, tools,
      apps, agents, workflows, assets, and team workspaces.
  related-projects:
    - >
      Runway's platform spans its Creative web application, Runway Academy, Runway Dev
      APIs, MCP integration, mobile applications, and research publications.
    - >
      Its creative workflows connect generative video, image, audio, editing, visual
      effects, character animation, and node-based automation.
  sources:
    - >
      https://help.runwayml.com/hc/en-us/articles/37425232841875-Getting-Started-with-Generative-Video
    - https://runway.com/about
    - >
      https://runway.com/news/machine-learning-en-plein-air-building-accessible-tools-for-artists
    - https://runwayml.com/research/gen-1
    - https://runwayml.com/research/gen-2
  summary:
    - >
      Runway is a generative-media platform and AI research company providing video,
      image, audio, editing, agent, workflow, and developer tools for creative
      production.
  timeline:
    - >
      2018: Runway was publicly announced as a beta for making machine-learning models
      accessible to creative practitioners.
    - >
      2023: Runway announced Gen-1 and Gen-2 generative-video systems; the earlier ML
      Lab was retired later that year.
    - '2025: Gen-4 and related creative models expanded controllable video and image workflows.'
    - >
      2026: Runway's platform encompassed generative sessions, agents, apps, workflows,
      developer APIs, and broader world-model research.
  usage:
    - >
      Creators sign in to the hosted application, start a session, select a tool, app,
      agent, or workflow, provide text and media inputs, generate outputs, and iterate
      or edit the resulting assets.
    - >
      Common uses include text-to-video and image-to-video generation, visual-effects
      transformations, character animation, image creation, audio generation,
      storyboarding, advertising content, social media assets, and automated node-based
      creative pipelines. Developers can integrate supported models through Runway Dev
      APIs or MCP.
