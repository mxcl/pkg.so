history:
  adoption-history:
    - >
      Filtlong became available beyond source builds through system and
      scientific-software packaging, including Homebrew and Debian-family distributions
      recorded in the supplied package metadata. Its small standalone executable suits
      reproducible sequencing pipelines.
  package-nerd-significance:
    - >
      Filtlong is valued as a focused Unix pipeline component: it reads FASTA or FASTQ
      data, writes selected reads to standard output, and composes naturally with
      compressors and downstream bioinformatics tools. Its limited dependency footprint
      also makes it straightforward to package.
  project-history:
    - >
      Filtlong was created by Ryan Wick as a quality-filtering tool for noisy long
      reads, particularly Nanopore and PacBio data. Its first tagged release was v0.1.0.
    - >
      The tool evolved with FASTA support when an external reference is supplied,
      trimming and splitting controls, hard quality and length thresholds, and
      convenient unit suffixes. Version 0.3.0 modernized terminology from "Illumina
      reads" to "short reads," while v0.3.1 added short-form options and unit suffixes.
  related-projects:
    - >
      Filtlong is commonly positioned before long-read assemblers and other downstream
      genomics tools. It can use a reference assembly or accurate short-read data to
      estimate long-read quality through k-mer matching.
  sources:
    - https://github.com/rrwick/Filtlong
    - https://github.com/rrwick/Filtlong/releases
  summary:
    - >
      Filtlong is a standalone C++ command-line program that selects a smaller,
      higher-quality subset of noisy long sequencing reads using read length, mean
      quality, window quality, and optionally k-mer agreement with an external
      reference.
  timeline:
    - '2017: v0.1.0, the first public release.'
    - >
      2018: v0.2.0 added FASTA support with an external reference and improved
      corrupt-input diagnostics.
    - >
      2023: v0.3.0 updated compiler compatibility and replaced Illumina-specific option
      terminology with short-read terminology.
    - '2025: v0.3.1 added short-form options and length-unit suffixes.'
  usage:
    - >
      Users commonly set minimum length, retained percentage, or target base count and
      pipe Filtlong's standard output into gzip. Without a reference it evaluates FASTQ
      quality scores; with an assembly or short-read reference it scores k-mer agreement
      and can additionally trim or split reads.
    - >
      The maintainer cautions that incomplete or biologically mismatched external
      references can incorrectly penalize genuine long reads.
related-packages:
  - id: brew:chopper
    reason: >
      Choose chopper for a Rust-based streaming FASTQ filter centered on quality,
      length, cropping, and trimming; choose Filtlong when global read ranking or
      reference-guided k-mer scoring is required.
    rel: alternative
    sources:
      - https://github.com/wdecoster/chopper
      - https://github.com/rrwick/Filtlong
  - id: brew:gzip
    reason: >
      Filtlong's official examples pipe filtered reads directly into gzip, making GNU
      gzip a practical companion for keeping FASTQ output compressed.
    rel: adjacent_workflow
    sources:
      - https://github.com/rrwick/Filtlong
      - https://www.gnu.org/software/gzip/manual/gzip.html
