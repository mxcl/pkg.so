history:
  adoption-history:
    - >
      Typeless expanded from a pre-1.0 macOS application in late 2025 to a 1.0 release
      in February 2026. Its official materials position it for system-wide use across
      editors, browsers, messaging tools, and workplace applications.
  package-nerd-significance:
    - >
      Typeless represents the newer class of cloud-assisted, system-wide AI dictation
      utilities distributed as native desktop applications. Its reliance on
      Accessibility and Microphone permissions, plus cloud processing with on-device
      history, makes privacy and operating-system integration central deployment
      considerations.
  project-history:
    - >
      Official release notes record macOS version 0.9.0 on December 24, 2025, followed
      by version 1.0.0 on February 10, 2026. The 1.0 release organized the product
      around Dictate, Translate, and Ask anything.
    - >
      Subsequent 2026 releases added hands-free operation, dictionary import,
      external-keyboard shortcuts, expanded translation controls, and enterprise
      administration.
  related-projects:
    - >
      Typeless integrates at the operating-system text-entry layer and is designed to
      work inside applications such as Slack, Microsoft Teams, Google Docs, Notion,
      Gmail, browsers, and text editors.
  sources:
    - 'Official first-dictation guide: https://www.typeless.com/help/quickstart/first-dictation'
    - 'Official installation guide: https://www.typeless.com/help/installation-and-setup'
    - 'Official macOS release notes: https://www.typeless.com/help/release-notes/macos'
    - 'Official privacy policy: https://www.typeless.com/privacy'
  summary:
    - >
      Typeless is a cross-application AI voice-input service for dictation, translation,
      rewriting, and spoken queries. On macOS it uses Microphone access to capture
      speech and Accessibility access to insert results into the active text field.
  timeline:
    - '2025-12-24: macOS version 0.9.0 introduced personalization and web-search features.'
    - '2026-02-10: macOS version 1.0.0 launched Dictate, Translate, and Ask anything.'
    - '2026-05-14: Version 1.4.0 added bulk dictionary import.'
    - >
      2026-07-08: Version 2.0.0 expanded contextual dictation, translation, and
      enterprise controls.
  usage:
    - >
      After installation, users sign in, grant Microphone and Accessibility permissions,
      focus a text field, and press the configured shortcut to begin and end dictation.
      Typeless then inserts polished text into the active application.
    - >
      Official privacy documentation says audio and contextual text are processed in
      real time on cloud servers and discarded after the result is returned, while the
      product site describes dictation history as remaining on the device.
