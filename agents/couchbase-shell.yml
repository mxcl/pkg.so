id: brew:couchbase-shell
display-name: Couchbase Shell
repo: null
docs:
  - https://docs.couchbase.com/cloud/reference/command-line-tools.html
  - https://couchbase.sh/
config-file-location:
  unix:
    - ~/.cbsh/config
credentials-file-location:
  unix:
    - ~/.cbsh/config
history:
  adoption-history:
    - >
      Official packaging emphasizes downloadable archives for Linux, macOS, and Windows,
      while the Homebrew formula and Nix package make it available through common
      developer package managers.
  package-nerd-significance:
    - >
      For package maintainers, Couchbase Shell is notable as a vendor-maintained
      database shell that ships batteries-included release artifacts and sits alongside
      Couchbase's older command-line tools rather than replacing a single generic
      `couchbase` binary.
  project-history:
    - >
      The public GitHub repository was created in 2020 under `couchbaselabs`, and the
      README describes the project as maintained by Couchbase with community support
      through the issue tracker rather than Couchbase Enterprise Edition support.
    - >
      The project reached a tagged 1.0.0 release in 2024 after earlier beta and 0.75.x
      releases, with later 1.x releases continuing through 2026.
  related-projects:
    - Couchbase Server
    - Couchbase Capella
    - Nushell
  sources:
    - https://github.com/couchbaselabs/couchbase-shell
    - https://api.github.com/repos/couchbaselabs/couchbase-shell
    - https://github.com/couchbaselabs/couchbase-shell/releases
    - https://docs.couchbase.com/cloud/reference/command-line-tools.html
    - https://couchbase.sh/docs/
  summary:
    - >
      Couchbase Shell is the Couchbase-maintained `cbsh` command-line shell for
      Couchbase Server and Couchbase Capella, implemented and distributed as a
      standalone CLI.
  timeline:
    - '2020: Public GitHub repository created.'
    - '2021: 1.0.0 beta releases appear.'
    - '2024: 1.0.0 release published.'
    - '2026: 1.3.0 release published.'
  usage:
    - >
      `cbsh` is used to connect to Couchbase clusters, run commands for buckets,
      queries, analytics, search, users, Capella projects, and related administrative
      tasks, and can persist cluster connection details in `~/.cbsh/config`.
related-packages:
  - id: brew:libcouchbase
    reason: >
      Choose libcouchbase's `cbc` tools for lower-level document access,
      protocol-oriented utilities, or stress testing; Couchbase Shell offers a broader
      interactive environment for SQL++, data manipulation, and cluster administration.
    rel: alternative
    sources:
      - https://docs.couchbase.com/cloud/reference/command-line-tools.html
      - https://docs.couchbase.com/c-sdk/current/hello-world/cbc.html
