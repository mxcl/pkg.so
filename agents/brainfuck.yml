history:
  adoption-history:
    - >
      The input package facts record Homebrew and Fedora DNF packaging. That is modest
      adoption, but enough to make the interpreter available through mainstream package
      managers rather than only as source code.
    - >
      As a package, its role is mostly educational and recreational: it gives users a
      ready-made interpreter for an esoteric language often used in programming-language
      demonstrations and code-golf culture.
  package-nerd-significance:
    - >
      This package is not historically important as a unique interpreter, but it is a
      neat package-manager specimen: an esoteric language runtime small enough to ship
      everywhere and useful for testing terminals, compilers, examples, and packaging
      workflows.
    - >
      Its significance comes from Brainfuck's cultural footprint among programmers, plus
      the practical convenience of having a maintained C interpreter available from
      Homebrew and DNF.
  project-history:
    - >
      The GitHub repository was created in November 2011. The official README describes
      the project as a Brainfuck interpreter written in C, built with CMake and a C
      compiler, with libedit used for interactive console support.
    - >
      Official Git tags show a long-lived small project, from early 0.1.x tags through
      2.7.x tags. The repository README lists multiple contributors and includes an
      examples directory of Brainfuck programs with attribution where possible.
  related-projects:
    - Brainfuck is the esoteric programming language implemented by the package.
    - libedit is the line-editing dependency named by the README.
    - CMake, Clang, and GCC are listed build-time tools for compiling the interpreter.
  sources:
    - https://api.github.com/repos/fabianishere/brainfuck
    - https://github.com/fabianishere/brainfuck#readme
    - https://github.com/fabianishere/brainfuck/tags
    - source_facts.package-manager
  summary:
    - >
      fabianishere/brainfuck is a C implementation of a Brainfuck interpreter. It
      packages the esoteric language as a conventional Unix-style CLI with file
      execution, direct evaluation, an interactive console, examples, and a small C API.
  timeline:
    - '2011-11: The GitHub repository was created.'
    - '2011-2012: Official Git tags include early 0.1.x and 0.2.x releases.'
    - '2022: Official repository metadata shows activity into February 2022.'
    - '2022: Official Git tags include the 2.7.x release line.'
  usage:
    - >
      The README documents running brainfuck with files, using --eval to run code
      directly, --version and --help, and opening an interactive console when no
      arguments are passed.
    - >
      The project also exposes a C API around parsing, execution context creation,
      execution, and cleanup, so it can be embedded or used as a small interpreter
      library in addition to the command-line binary.
