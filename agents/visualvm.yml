config-file-location:
  linux:
    - ~/.visualvm/<version>/
  macos:
    - ~/Library/Application Support/VisualVM/<version>/
  windows:
    - '%APPDATA%\VisualVM\<version>\'
credentials-file-location: null
history:
  adoption-history:
    - >
      VisualVM gained unusually broad reach for a profiler because Java VisualVM was
      shipped with Oracle JDK releases, including JDK 6, 7, and 8 updates. It was also
      distributed with GraalVM releases before returning to standalone distribution.
    - >
      Current releases are delivered as a standalone application for Windows, Linux, and
      macOS, with support for Oracle JDK, OpenJDK, and GraalVM processes.
  package-nerd-significance:
    - >
      VisualVM is notable for combining several familiar JVM diagnostics—process
      discovery, monitoring, sampling, profiling, thread dumps, heap dumps, JMX access,
      and plugin extensions—in one desktop tool. Its long association with the JDK made
      it a standard item in many Java troubleshooting toolkits.
  project-history:
    - >
      VisualVM 1.0 was released in July 2008 and was also incorporated into JDK 6 Update
      7 as Java VisualVM. The project continued through the 1.x line on Java.net and in
      JDK updates.
    - >
      VisualVM 1.4 began the modern standalone line in December 2017. VisualVM 2.0
      followed in February 2020, and development continues under Oracle sponsorship with
      releases hosted on GitHub.
  related-projects:
    - >
      VisualVM builds on JVM serviceability technologies such as JMX, jvmstat, heap
      dumps, thread dumps, and Java Flight Recorder. It overlaps with command-line JDK
      tools such as jcmd, jstack, jmap, and jstat, while presenting their data through a
      GUI.
  sources:
    - https://visualvm.github.io/docs/command-line-options.html
    - https://visualvm.github.io/download
    - https://visualvm.github.io/features.html
    - https://visualvm.github.io/releases.html
  summary:
    - >
      VisualVM is a graphical monitoring, profiling, and troubleshooting application for
      the Java Virtual Machine. It can inspect local and remote Java processes and
      analyze live telemetry, dumps, and recordings.
  timeline:
    - >
      2008: VisualVM 1.0 was released and VisualVM entered JDK 6 distribution as Java
      VisualVM.
    - '2017: VisualVM 1.4 established the modern standalone release line.'
    - '2020: VisualVM 2.0 was released.'
    - >
      2023: Bundling with GraalVM ended after the GraalVM 19–23.0 generation; standalone
      distribution continued.
  usage:
    - >
      Developers use VisualVM to discover JVM processes, inspect CPU and memory
      behavior, take or open thread and heap dumps, connect through JMX, run sampling or
      profiling sessions, and examine Java Flight Recorder data. Plugins extend the base
      application.
