id: brew:direnv
display-name: direnv
repo: null
docs:
  - https://direnv.net/docs
  - https://github.com/direnv/direnv
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/direnv/direnv.toml
    - ~/.config/direnv/direnv.toml
    - ~/.config/direnv/direnvrc
    - .envrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation documentation lists packages or install paths for Fedora,
      Arch Linux, Debian, Gentoo Guru, NetBSD pkgsrc-wip, NixOS, Homebrew, openSUSE,
      MacPorts, Ubuntu, GNU Guix, and Windows winget. That packaging spread matches
      direnv's role as cross-language glue for local development environments.
  package-nerd-significance:
    - >
      Package nerds care about direnv because it solves a small boundary problem
      cleanly: it lets shells, package managers, language managers, and project
      repositories cooperate without turning into a full environment manager.
  project-history:
    - >
      The project frames itself as a way to unclutter shell startup files: instead of
      putting every export in a global profile, a project can keep an authorized .envrc
      near its source tree. Its README and man page describe a small, language-agnostic
      executable that hooks into interactive shells and evaluates environment changes in
      a subprocess.
  related-projects:
    - >
      The official README points users toward adjacent tools including Environment
      Modules, autoenv, zsh-autoenv, asdf, shadowenv, quickenv, and mise.
  sources:
    - https://github.com/direnv/direnv
    - https://github.com/direnv/direnv/blob/master/README.md
    - https://github.com/direnv/direnv/blob/master/docs/installation.md
    - https://github.com/direnv/direnv/blob/master/man/direnv.1.md
    - https://github.com/direnv/direnv/blob/master/man/direnv.toml.1.md
    - https://github.com/direnv/direnv/releases/tag/v2.37.1
  summary:
    - >
      direnv is a shell extension for loading and unloading project-specific environment
      variables as the current working directory changes.
  timeline:
    - '2011: GitHub repository created.'
    - '2019: direnv.toml manual documents the TOML config file path.'
    - '2025: v2.37.1 published on GitHub releases.'
  usage:
    - >
      The common workflow is to install direnv, hook it into the user's shell, create a
      project .envrc, and explicitly allow that file before it is evaluated. The README
      highlights 12-factor environment variables, isolated development environments,
      deployment secrets, and integrations with tools such as Nix and language version
      managers.
related-packages:
  - id: brew:mise
    reason: >
      Choose mise when you want directory-aware environment loading combined with
      tool-version management and task running in one program; direnv's official README
      describes it as combining direnv, make, and asdf roles.
    rel: alternative
    sources:
      - https://github.com/direnv/direnv
      - https://mise.jdx.dev/
  - id: brew:asdf
    reason: >
      Use asdf with direnv when project tool versions should be managed by asdf while
      direnv activates their resolved executables and environment through the documented
      asdf-direnv integration.
    rel: adjacent_workflow
    sources:
      - https://github.com/direnv/direnv
      - https://github.com/asdf-community/asdf-direnv
      - https://asdf-vm.com/
