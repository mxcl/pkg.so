      - https://gitlab.com/DavidGriffith/frotz
  - id: brew:glulxe
    reason: >
      Use the Glulx reference interpreter to execute and test Inform 6 games compiled
      for the Glulx target.
    rel: adjacent_workflow
    sources:
      - https://www.inform-fiction.org/manual/I6-Addendum.html
      - https://github.com/erkyrath/glulxe
