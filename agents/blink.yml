history:
  adoption-history:
    - >
      blink's adoption comes from portability obsessives, compiler/toolchain users, and
      people who like Actually Portable Executable style workflows. Package-manager
      facts list Homebrew, MacPorts, Nix, and a Windows winget name, showing interest
      beyond one Unix distribution.
    - >
      Because it can run Linux binaries on macOS, BSDs, Cygwin, and non-x86 hardware,
      blink fills a different packaging niche than full-system emulators: it is small
      enough to install as a developer utility, script runner, or compatibility shim.
  package-nerd-significance:
    - >
      blink is catnip for package nerds because it compresses a loader, emulator,
      syscall personality, debugger, and cross-architecture compatibility story into a
      tiny command-line package. It also has a clear comparison target, `qemu-x86_64`,
      which makes the packaging tradeoff legible: less generality, far smaller
      footprint.
    - >
      It matters culturally because it extends the Cosmopolitan/APE idea from 'make
      binaries that run everywhere' to 'run Linux-shaped binaries almost anywhere'. That
      makes it a tool about distribution itself, not merely CPU emulation.
  project-history:
    - >
      The upstream README says the project contains `blink`, a virtual machine for
      x86-64 Linux programs, and `blinkenlights`, a terminal debugger interface for
      x86-64 Linux and i8086 programs. The README explicitly compares `blink` to
      `qemu-x86_64`, emphasizing smaller binary size, POSIX host portability, and faster
      performance on some workloads.
    - >
      The same README ties blink to the Cosmopolitan Libc ecosystem: blink's prime
      directive is to support userspace binaries compiled by Cosmopolitan Libc, while
      also supporting a practical subset of Linux syscalls and x86-64 instructions.
      GitHub releases show Blink 1.0.0 published in June 2023 and 1.1.0 in January 2024.
  related-projects:
    - >
      Related projects include Cosmopolitan Libc, Actually Portable Executable
      workflows, QEMU user-mode emulation, Musl libc tests, Linux Test Project, and
      terminal debuggers such as GDB and TUI-oriented visual debuggers.
  sources:
    - https://github.com/jart/blink#readme
    - https://github.com/jart/blink/releases
    - https://justine.lol/blinkenlights
    - input source_facts.package-manager
  summary:
    - >
      blink is Justine Tunney's tiny x86-64 Linux emulator for running Linux binaries
      across POSIX operating systems and CPU architectures. It is both a practical
      portability tool and a package-nerd flex: a very small VM competing with much
      larger emulator stacks for one sharply defined job.
  timeline:
    - '2023-06-04: Blink 1.0.0 release published on GitHub.'
    - '2024-01-21: Blink 1.1.0 release published on GitHub.'
    - >
      Current README: documents POSIX hosts including Linux, macOS, FreeBSD, OpenBSD,
      and Cygwin, plus Linux, ARM, RISC-V, MIPS, PowerPC, and s390x test targets.
  usage:
    - >
      Typical use is `blink PROGRAM [ARG...]` to run an x86-64 Linux ELF binary.
      `blinkenlights PROGRAM` opens the TUI debugger, with stepping, continuing, memory
      visualization, mouse-wheel scrolling/zooming, and reverse debugging.
    - >
      The README documents tiny builds, optional feature disabling, JIT controls, POSIX
      compliance checks, VFS support for chroot-like use, and large test coverage
      against Cosmopolitan, Linux Test Project, and Musl libc tests.
related-packages:
