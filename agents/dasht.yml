config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dasht's adoption is centered on users who want Dash-style API documentation
      without leaving Unix shells, editors, or lightweight browser views. Official
      documentation covers package-manager installation, manual installation, shell
      completion, and Vim integration.
  package-nerd-significance:
    - >
      Package nerds care about dasht because it treats offline API documentation as
      command-line data: SQLite docset indexes, POSIX tools, manpages, shell
      completions, and editor integration instead of a GUI-only documentation browser.
  project-history:
    - >
      The project published v1.0.0 in early 2016 and moved quickly to a v2.0.0 line the
      same year. Its README frames the name as a combination of Dash and terminal, and
      documents a collection of scripts for searching, serving, installing, and updating
      offline docsets.
  related-projects:
    - >
      dasht is built around Dash docsets and documents related use with Vim through the
      vim-dasht plugin.
  sources:
    - https://github.com/sunaku/dasht#readme
    - https://sunaku.github.io/dasht/man/
    - https://github.com/sunaku/dasht/releases/tag/v1.0.0
    - https://github.com/sunaku/dasht/releases/tag/v2.0.0
    - https://github.com/sunaku/dasht/releases/tag/v2.4.0
  summary:
    - >
      dasht is a POSIX-shell toolset for searching and browsing Dash docsets from a
      terminal or local browser.
  timeline:
    - '2016: v1.0.0 and v1.1.0 releases established the project.'
    - '2016: v2.0.0 introduced the second major release line.'
    - '2020: v2.4.0 was published as a tagged GitHub release.'
  usage:
    - >
      The normal workflow is to install one or more docsets with
      `dasht-docsets-install`, search them with `dasht`, and optionally expose a browser
      search interface with `dasht-server`.
related-packages:
  - id: brew:dashing
    reason: >
      Use Dashing to turn existing HTML documentation into the Dash-compatible docsets
      that dasht can manage and search offline.
    rel: adjacent_workflow
    sources:
      - https://github.com/technosophos/dashing#readme
      - https://sunaku.github.io/dasht/man/man0/README.html
