history:
  adoption-history:
    - >
      libnet spread through security and networking tools because it hides byte
      ordering, buffer management, and link/IP layer packet assembly details while still
      allowing deliberate packet shaping. The official README names packaged tools such
      as arping, ettercap, nemesis, packit, tcptraceroute, and yersinia as libnet users.
  package-nerd-significance:
    - >
      For package maintainers, libnet is notable because it is tiny in concept but sits
      on privileged and platform-specific network interfaces. Its ABI break between
      1.0.x and 1.1.x, the revival from an abandoned upstream, and the long-lived
      libnet-config compatibility shim are exactly the sort of details that explain why
      distributions keep careful split packages and rebuild notes for it.
  project-history:
    - >
      The project traces its 1.1 line to Mike D. Schiffman's Packetfactory-era work,
      with project materials crediting libnet 1.1 to 1998-2004. The maintained
      1.1.3-and-later line was revived by Sam Roberts starting in 2009 after the older
      Packetfactory-hosted code had become unmaintained.
    - >
      The 1.1 API was a significant break from 1.0.x code. The migration guide describes
      the change as a simplification from a five-step packet workflow to initialization,
      packet building, and packet writing, and the README warns that libnet 1.0.x code
      is incompatible with libnet 1.1.x and later.
  related-projects:
    - libpcap is the natural companion library for capture-side workflows.
    - >
      Packet-generation and network-security tools named by the project include arping,
      ettercap, nemesis, packit, tcptraceroute, and yersinia.
  sources:
    - https://github.com/libnet/libnet
    - https://github.com/libnet/libnet/blob/master/doc/MIGRATION.md
    - https://sourceforge.net/projects/libnet-dev/files/
  summary:
    - >
      libnet is a C library for constructing and injecting network packets. It occupies
      the low-level packet-building side of the classic libpcap/libnet pairing: libpcap
      captures packets, while libnet gives test tools, scanners, and protocol
      experiments a portable API for emitting packets with controlled headers.
  timeline:
    - >
      1998-2004: libnet 1.1 materials credit Mike D. Schiffman for the Packetfactory-era
      implementation.
    - >
      2009: Sam Roberts began maintaining the 1.1.3-and-later line after the older
      upstream had gone quiet.
    - '2012: libnet 1.1.6 appeared in the SourceForge-hosted release area.'
    - '2023: GitHub listed libnet v1.3 as a release dated October 2, 2023.'
  usage:
    - >
      Developers include libnet through libnet.h and link with -lnet. The project
      retained libnet-config for compatibility but moved new integration guidance toward
      pkg-config, with libnet.pc replacing the older helper in modern builds.
related-packages:
  - id: brew:libpcap
    reason: >
      Pair libpcap's packet capture with libnet's packet construction and injection when
      building bidirectional network-analysis or testing tools.
    rel: adjacent_workflow
    sources:
      - https://github.com/libnet/libnet#readme
      - https://www.tcpdump.org/
