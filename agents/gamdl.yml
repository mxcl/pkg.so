id: brew:gamdl
display-name: Gamdl
repo: https://github.com/glomatico/gamdl
docs:
  - https://github.com/glomatico/gamdl#readme
config-file-location:
  linux:
    - ~/.gamdl/config.ini
  windows:
    - '%USERPROFILE%\.gamdl\config.ini'
credentials-file-location:
  unix:
    - ./cookies.txt
  windows:
    - .\cookies.txt
history:
  adoption-history:
    - >
      Gamdl's official README advertises PyPI packaging and monthly download badges, and
      the input package facts show a Homebrew formula. Its adoption is centered on
      Python CLI users comfortable supplying browser cookies and optional media-tool
      dependencies.
  package-nerd-significance:
    - >
      Gamdl is notable as a modern media-downloader package that is mostly Python
      application glue: it coordinates service cookies, configurable output templates,
      yt-dlp-style downloading, optional native tools, and a rapidly moving release
      stream.
  project-history:
    - >
      The official GitHub repository was created in November 2022. The README positions
      Gamdl as a command-line downloader for Apple Music, with installation through pip,
      configuration through command-line flags or ~/.gamdl/config.ini, and cookies
      supplied in Netscape cookies.txt format.
    - >
      By the 3.x release line in 2026, the project documented high-quality song and
      video downloads, synced lyrics, Apple Music Classical support, optional
      wrapper-backed account and decryption requests, and optional N_m3u8DL-RE and
      FFmpeg integration.
  related-projects:
    - >
      wrapper-v2 is an optional companion server for account, playback, and decryption
      requests.
    - N_m3u8DL-RE can be used as an optional faster download mode.
    - FFmpeg is required when using N_m3u8DL-RE.
    - yt-dlp is used as a file download library in the default mode.
  sources:
    - https://api.github.com/repos/glomatico/gamdl
    - https://github.com/glomatico/gamdl
    - https://github.com/glomatico/gamdl/releases
  summary:
    - >
      Gamdl is Glomatico's Apple Music Downloader, a Python command-line application for
      downloading Apple Music songs, music videos, post videos, synced lyrics, and
      metadata.
  timeline:
    - '2022: Public GitHub repository created.'
    - '2026: 3.x releases documented frequent updates.'
    - '2026: Version 3.8 released on June 30.'
  usage:
    - >
      Users install gamdl with pip, place cookies.txt in the working directory or
      configure a cookies path, and pass Apple Music song, album, playlist, artist,
      music-video, post-video, or Classical URLs. Command-line options and config.ini
      control output paths, codecs, templates, lyrics formats, metadata language, and
      download mode.
related-packages:
  - id: brew:yt-dlp
    reason: >
      Gamdl uses yt-dlp as its default file-download library while continuing to fetch
      media directly from Apple Music's servers.
    rel: adjacent_workflow
    sources:
      - https://github.com/glomatico/gamdl#readme
      - https://github.com/yt-dlp/yt-dlp#readme
  - id: brew:ffmpeg
    reason: >
      Gamdl requires FFmpeg when its optional N_m3u8DL-RE download mode is selected,
      making FFmpeg part of that faster transfer and media-processing workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/glomatico/gamdl#readme
      - https://ffmpeg.org/documentation.html
