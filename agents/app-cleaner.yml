history:
  adoption-history:
    - >
      Nektony reports that the application has served more than ten million users. Its
      adoption is concentrated among macOS users wanting a guided alternative to
      dragging an application bundle to the Trash, which can leave related support files
      behind.
    - >
      The product broadened from uninstallation into application management. Official
      milestones include Apple Silicon support, a redesigned interface and pricing
      model, an application-update module, removal-history improvements, security
      insights, permission management, and optional Apple Intelligence summaries.
  package-nerd-significance:
    - >
      App Cleaner & Uninstaller is relevant to package enthusiasts because it examines
      the application state left behind by several macOS distribution and updater
      ecosystems, including the Mac App Store, Sparkle, Electron, Squirrel, Homebrew,
      and GitHub-delivered applications.
    - >
      It occupies an unusual position beside package managers: rather than installing
      packages, it inventories application bundles, startup items, extensions, updates,
      and associated service files, and provides a recoverable removal history when
      deletion is configured to use the Trash.
  project-history:
    - >
      Ukrainian Mac-software developer Nektony first released App Cleaner & Uninstaller
      on July 23, 2015 as a focused tool for removing applications and their leftover
      files.
    - >
      Over subsequent major versions it grew into a broader application-management
      utility. Official revision archives document version 6 releases before 2020,
      version 7 during 2020–2022, version 8 from 2022–2025, and version 9 beginning in
      October 2025.
  related-projects:
    - >
      Nektony's related macOS utilities include MacCleaner Pro, Duplicate File Finder,
      and Disk Space Analyzer.
    - >
      The product manages applications installed or updated through systems including
      the Mac App Store, Homebrew, Sparkle, Electron, and Squirrel.
  sources:
    - https://nektony.com/downloads/previous-versions-of-products
    - https://nektony.com/help/app-cleaner
    - https://nektony.com/knowledge/app-cleaner-uninstaller-overview
    - https://nektony.com/mac-app-cleaner/download
  summary:
    - >
      App Cleaner & Uninstaller is Nektony's macOS utility for removing applications and
      associated service files, managing startup programs and extensions, finding
      remnants, and tracking application updates.
  timeline:
    - 'July 2015: First release as a dedicated Mac uninstaller.'
    - '2020: Native Apple Silicon support added.'
    - '2023: Major redesign and revised pricing model introduced.'
    - '2024: Application-update functionality added.'
    - 'October 2025: Version 9.0 launches with a redesigned interface and faster scanning.'
    - '2026: Version 9 adds security insights and application-permission management.'
  usage:
    - >
      Users scan installed applications, inspect associated caches and support files,
      and remove selected items. Additional sections manage startup programs,
      extensions, remaining files, and available application updates.
    - >
      By default, removed files can be moved to the Trash and restored through Removal
      History. Full Disk Access is needed for comprehensive scanning and certain cleanup
      or restoration operations; users should review shared or ambiguous files before
      removal.
