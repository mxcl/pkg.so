config-file-location:
  unix:
    - <project>/.nodeterm/project.json
credentials-file-location: null
history:
  adoption-history:
    - >
      nodeterm is distributed for macOS and Linux, with a browser-based Server Edition
      also available. Its official repository documents a Homebrew cask and
      self-updating desktop builds.
  package-nerd-significance:
    - >
      nodeterm combines terminal multiplexing, spatial canvas organization, and
      coding-agent orchestration. It is notable to package users because it wraps
      existing command-line agents rather than replacing their subscriptions,
      credentials, or native CLIs.
  project-history:
    - >
      The independently developed project emerged as an early-access desktop environment
      for arranging terminals, editors, notes, and AI coding-agent sessions as movable
      nodes on an infinite canvas. Its terminals can be backed by tmux for persistence
      across application restarts.
    - >
      The source is distributed under BUSL-1.1, with individual releases scheduled to
      convert to MIT four years after publication.
  related-projects:
    - tmux provides the optional persistent terminal sessions used by nodeterm.
    - >
      Claude Code, Codex, Gemini, and opencode are among the external agent CLIs that
      nodeterm can launch.
  sources:
    - 'Official FAQ: https://nodeterm.dev/docs/reference/faq'
    - 'Official installation documentation: https://nodeterm.dev/docs/get-started/installation/'
    - 'Official projects documentation: https://nodeterm.dev/docs/concepts/projects/'
    - >
      Official repository overview and distribution notes:
      https://github.com/eneskirca/nodeterm
  summary:
    - >
      nodeterm is a desktop terminal and coding-agent workspace that places terminals,
      agents, notes, and editors on a pan-and-zoom canvas.
  timeline:
    - >
      2026: Early-access releases were distributed for macOS and Linux, including
      through a Homebrew cask.
  usage:
    - >
      Users open a folder as a project, arrange terminal or agent nodes on its canvas,
      and optionally enable tmux-backed persistent sessions. The project layout can be
      shared through the project’s `.nodeterm/project.json` file.
