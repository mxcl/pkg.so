history:
  adoption-history:
    - >
      Folo is distributed for desktop, mobile, and web use. Its official README also
      identifies community-maintained packages for Homebrew, Arch Linux, Flatpak, Nix,
      and Scoop, reflecting adoption across several package-manager ecosystems.
  package-nerd-significance:
    - >
      Folo is notable to package enthusiasts as an open-source, cross-platform feed
      reader whose official project explicitly tracks community packaging across several
      otherwise unrelated ecosystems.
  project-history:
    - >
      Folo is developed by RSSNext as an open-source information reader. The project
      describes itself as an AI RSS reader and combines conventional feed subscriptions
      with lists, collections, multimedia handling, translation, summaries, and
      automation rules.
    - >
      The application remains under active development in a monorepo containing desktop,
      mobile, web, API, documentation, localization, and plugin components.
  related-projects:
    - >
      RSSHub is closely associated through the RSSNext organization and the repository's
      RSSHub topic.
    - >
      The project has also used the name Follow, which remains visible in some community
      package names and older project material.
  sources:
    - https://github.com/RSSNext/Folo#readme
    - https://github.com/RSSNext/Folo/releases
    - https://github.com/RSSNext/Folo/wiki
  summary:
    - >
      Folo is an open-source, cross-platform RSS and information reader maintained by
      RSSNext. It presents subscriptions and curated sources in a unified timeline and
      layers AI-assisted reading and automation features over traditional feed-reading
      workflows.
  timeline:
    - '2024: The official project wiki was established under the earlier Follow name.'
    - >
      2025: Official wiki material documented Folo Actions for filtering, rewriting,
      summarizing, translating, and forwarding feed entries.
  usage:
    - >
      Users subscribe to feeds or shared lists, browse entries in a consolidated
      timeline, and can apply actions such as summaries, translation, readability
      extraction, notifications, filtering, rewriting, and webhooks.
    - >
      Desktop users can install the macOS build through Homebrew, while the project
      documents additional community packages for Linux, Windows, and Nix users.
