history:
  adoption-history:
    - >
      Mailbird's official company page says the product grew from its 2012 beginnings
      into a widely used email-management client serving more than 200,000 customers,
      while current product pages describe millions of users. The product expanded from
      its Windows roots to advertise both Windows and macOS support.
  package-nerd-significance:
    - >
      Mailbird is notable in desktop package catalogs as a proprietary, account-oriented
      client rather than a mail service: installation supplies the local application,
      while users connect existing Gmail, Outlook, Yahoo, iCloud, Exchange, IMAP, or
      SMTP accounts. The cask record also illustrates the arrival of a formerly
      Windows-centered client in macOS package management.
  project-history:
    - >
      Mailbird began in 2012 as a desktop email-management product. It developed into an
      all-in-one client combining multiple mail accounts, a unified inbox, contacts,
      calendars, productivity features, and integrations with third-party services.
  related-projects:
    - >
      Mailbird connects to services including Gmail, Outlook, Yahoo Mail, iCloud,
      Exchange, and generic IMAP/SMTP providers.
    - >
      Its official pages position it alongside desktop clients such as Outlook,
      Thunderbird, and eM Client.
  sources:
    - Input field source_facts.package-manager identifies the Homebrew cask.
    - 'Official Help Center: https://support.getmailbird.com/hc/en-us'
    - 'Official company history and product description: https://www.getmailbird.com/about/'
    - 'Official product page: https://www.getmailbird.com/'
  summary:
    - >
      Mailbird is a commercial desktop email client that brings multiple existing email
      accounts into one workspace. It emphasizes a unified inbox, straightforward setup,
      customization, productivity features, and embedded integrations.
  timeline:
    - "2012: Mailbird's official company page dates the project's beginnings to this year."
    - '2020-2025: The official company page lists a succession of product and adoption awards.'
    - 'Current era: Mailbird advertises desktop availability for both Windows and macOS.'
  usage:
    - >
      Users add existing provider accounts or generic IMAP/SMTP accounts, then read,
      compose, search, organize, and track mail from one desktop interface.
      Unified-account views, folders, shortcuts, themes, snoozing, signatures, and
      third-party integrations support personal and business workflows.
