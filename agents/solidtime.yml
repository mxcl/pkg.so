    - 'Official desktop repository: https://github.com/solidtime-io/solidtime-desktop'
    - 'Official documentation: https://docs.solidtime.io/'
    - 'Official project organization: https://github.com/solidtime-io'
  summary:
    - >
      solidtime is an open-source time-tracking platform with cloud, self-hosted, web,
      browser-extension, and desktop-client surfaces.
  timeline:
    - >
      By 2026: The project maintained a beta cross-platform desktop client alongside its
      established web application and self-hosting resources.
  usage:
    - >
      Users track time against projects and tasks, review timesheets, manage billable
      work, and import or export records. Organizations can use the hosted service or
      deploy the core application themselves.
