history:
  adoption-history:
    - >
      solidtime is available as a hosted cloud service or a self-hosted application. The
      official project organization also maintains a beta desktop client for macOS,
      Windows, and Linux, a browser extension, documentation, and self-hosting examples.
  package-nerd-significance:
    - >
      solidtime is relevant to self-hosting and open-source package users because its
      core application and desktop client are AGPL-licensed, while its official
      organization publishes deployment examples and companion clients rather than
      limiting the product to a hosted service.
  project-history:
    - >
      solidtime was developed as a modern open-source time-tracking system for
      individuals and organizations. The main application grew to cover projects, tasks,
      clients, timesheets, billable rates, imports, exports, and organization-level
      workflows.
    - >
      A separate Electron-based desktop client was created to provide native packages
      for macOS, Windows, and Linux. The desktop project identifies itself as beta
      software.
  related-projects:
    - >
      The solidtime organization maintains the core web application, solidtime-desktop,
      a browser extension, documentation, and self-hosting examples.
  sources:
