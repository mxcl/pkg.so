history:
  adoption-history:
    - >
      Shortcat is available directly from its developer and through Homebrew Cask. Its
      official compatibility material targets native Mac applications, major browsers,
      and many Electron applications, broadening its usefulness beyond a single
      interface toolkit.
  package-nerd-significance:
    - >
      Shortcat brings command-palette and fuzzy-search interaction to graphical macOS
      interfaces. This appeals to keyboard-centric users who otherwise rely on terminal
      tools, launchers, and browser hinting extensions, while Homebrew Cask makes the
      GUI component reproducibly installable.
  project-history:
    - >
      Shortcat is a macOS keyboard-navigation application whose trademark belongs to
      Chendo Enterprises and is licensed to Sproutcube. The official privacy policy
      identifies Sproutcube as a one-person studio in Melbourne and as the current
      builder.
    - >
      The modern application indexes macOS interface elements through the Accessibility
      API and exposes controls, application menus, windows, and applications through a
      searchable command palette.
  related-projects:
    - macOS Accessibility API
    - VoiceOver
    - Homebrew Cask
  sources:
    - https://shortcat.app/
    - https://shortcat.app/docs
    - https://shortcat.app/docs/getting-started/
    - https://shortcat.app/privacy
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Shortcat is a macOS command palette for searching and operating interface
      controls, menus, windows, and applications without a mouse.
  timeline:
    - >
      2022: Shortcat's official privacy policy identified Sproutcube as the
      application's builder and documented its licensing and diagnostics services.
    - >
      2025: The official site and documentation presented the current
      universal-command-palette design for modern macOS.
  usage:
    - >
      Users grant Shortcat macOS Accessibility permission, invoke it with the configured
      shortcut—Command-Shift-Space by default—and type a fuzzy query for a control, menu
      command, window, application, or emoji. Enter performs the default action, while
      modifier keys enable alternate click actions.
    - >
      Preferences are managed through Shortcat's menu-bar interface or Command-comma.
      The official documentation does not publish a configuration-file path.
