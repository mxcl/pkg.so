history:
  adoption-history:
    - >
      Ollama quickly became a prominent developer-facing route to local open-model
      inference. The official project says it serves millions of developers, while an
      official Docker image and Python and JavaScript libraries broadened its use beyond
      the original desktop and CLI workflow.
  package-nerd-significance:
    - >
      Ollama packages model acquisition, model manifests, hardware-backed inference, a
      local HTTP API, and a terse CLI into one tool. Package users care because a single
      install can turn a workstation into a reusable model service, while environment
      variables and API compatibility make it straightforward to connect editors,
      agents, scripts, and containers.
  project-history:
    - >
      Ollama emerged publicly in 2023 as a simple way to download and run open
      large-language models locally. Its founders previously created Kitematic, which
      Docker acquired in 2015; they later applied a similar ease-of-use approach to open
      models.
    - >
      The project expanded from local CLI model execution into an application platform
      with a REST API, official language libraries, desktop integrations, container
      distribution, multimodal models, and optional cloud-hosted models.
  related-projects:
    - >
      Kitematic and Docker Desktop are part of the founders' earlier developer-tooling
      history.
    - >
      The official ecosystem includes ollama-python, ollama-js, an official Docker
      image, and integrations with desktop applications, editors, and coding agents.
  sources:
    - https://docs.ollama.com/
    - https://github.com/ollama/ollama
    - https://ollama.com/blog
    - https://ollama.com/blog/all-aboard-open-models
  summary:
    - >
      Ollama is a cross-platform model runner and inference service designed to make
      open models easy to download, execute, and expose through command-line and HTTP
      interfaces.
  timeline:
    - '2023: Ollama became publicly available for running open models locally.'
    - '2023: An official Docker image extended Ollama to containerized Linux GPU workflows.'
    - '2024: Official Python and JavaScript libraries were released.'
    - >
      2026: Ollama described itself as serving 8.9 million developers and expanded its
      cloud-model and coding-agent workflows.
  usage:
    - >
      Typical use starts with `ollama run <model>` or `ollama pull <model>`. Developers
      also call the local server through Ollama's native API or compatible clients,
      embed it in applications, run it in containers, and adjust model storage,
      networking, concurrency, and GPU behavior with environment variables.
