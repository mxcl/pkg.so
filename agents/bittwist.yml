config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package-manager data lists Homebrew, Debian, Ubuntu, MacPorts, and
      openSUSE packaging, which matches Bit-Twist's official cross-platform positioning
      for Windows, Linux, BSD, and macOS.
    - >
      Version 4.x in 2024 refreshed distribution artifacts across Windows, Linux, BSD,
      and macOS and added modern network-test features such as jumbo frames and VLAN
      editing.
  package-nerd-significance:
    - >
      Bit-Twist is package-nerd interesting because it is a small C-era Unix networking
      tool that survived across libpcap, WinPcap/Npcap, BSD, macOS, and Linux packaging
      rather than becoming a one-platform appliance utility.
    - >
      Its split between a pcap editor and a sender reflects classic command-line
      composability: tcpdump captures, bittwiste edits, bittwist replays.
  project-history:
    - >
      The official changelog begins with version 0.1 on January 25, 2006, initially
      using libpcap and libnet and tested on FreeBSD. By version 0.2, the project
      removed the libnet dependency and centered on libpcap.
    - >
      The 2006 public release added man pages for bittwist, bittwistb, and bittwiste.
      Later releases consolidated the tool around the packet generator and editor, with
      version 2.0 in 2012 adding a Mac OS X distribution and ending the old web edition
      and bridge maintenance.
  related-projects:
    - tcpdump is the capture-side tool Bit-Twist explicitly complements.
    - libpcap is the packet capture/transmission library Bit-Twist is built around.
    - Npcap is listed by the official site as the Windows prerequisite.
  sources:
    - https://bittwist.sourceforge.io/
    - https://bittwist.sourceforge.io/doc.html
    - https://bittwist.sourceforge.io/news.html
    - https://sourceforge.net/projects/bittwist/rss?path=/
    - source_facts.package-manager
  summary:
    - >
      Bit-Twist is a libpcap-based Ethernet packet generator and packet editor
      maintained by Addy Yeow. Its official site presents it as a companion to tcpdump:
      capture traffic into pcap files, edit the packets, then regenerate that traffic on
      a live network.
  timeline:
    - '2006-01-25: Version 0.1 skeleton program released.'
    - '2006-04-11: Version 0.7 public release with man pages.'
    - '2007-10-26: Version 1.0 increased generator throughput option up to 10 Gbps.'
    - '2012-04-21: Version 2.0 added Mac OS X distribution and revised platform support.'
    - '2023-05-24: Version 3.0 updated homepage to bittwist.sourceforge.io.'
    - '2024-11-01: Version 4.7 released with IEEE 802.1ad Q-in-Q VLAN editing support.'
  usage:
    - >
      Users typically combine bittwiste and bittwist: create or edit a pcap with
      bittwiste, then send it on an interface with bittwist. The official examples
      include throughput testing, firewall testing, SYN flood simulation,
      ARP-cache-poisoning demonstrations, and jumbo-frame testing in controlled
      networks.
    - >
      The tool is aimed at administrators and network testers who need repeatable packet
      streams for firewalls, IDS/IPS, routers, switches, load balancers, and
      troubleshooting.
related-packages:
  - id: brew:tcpreplay
    reason: >
      Choose Tcpreplay when you need a broader pcap replay suite with two-interface
      flows, direction-aware preprocessing, and integrated header rewriting; Bit-Twist
      is the smaller generator/editor pair.
    rel: alternative
    sources:
      - https://bittwist.sourceforge.io/
      - https://tcpreplay.appneta.com/
      - https://tcpreplay.appneta.com/tools/
  - id: brew:tcpdump
    reason: >
      Use tcpdump to capture traffic into pcap files and Bit-Twist to edit and
      regenerate that traffic, the workflow explicitly described by Bit-Twist upstream.
    rel: adjacent_workflow
    sources:
      - https://bittwist.sourceforge.io/
      - https://www.tcpdump.org/
