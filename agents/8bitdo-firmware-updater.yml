config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The updater supports the firmware-maintenance workflow across 8BitDo's expanding
      controller catalog. The official support index exposes it alongside model-specific
      manuals, FAQs, firmware releases, and changelogs.
  package-nerd-significance:
    - >
      The Homebrew cask makes a vendor-specific hardware maintenance utility installable
      through the same declarative workflow used for ordinary Mac applications, useful
      when controller firmware must be updated before troubleshooting compatibility or
      connectivity.
  project-history:
    - >
      8BitDo publishes the Firmware Updater as its general desktop utility for applying
      controller firmware. Detailed historical release information is maintained
      primarily per controller on the official support index rather than as a standalone
      updater history.
  related-projects:
    - >
      8BitDo Ultimate Software configures supported controller behavior and profiles;
      the Firmware Updater is focused on device firmware maintenance.
  sources:
    - 'Official support index: https://support.8bitdo.com/'
    - 'Official updater page: https://support.8bitdo.com/firmware-updater.html'
    - source_facts.package-manager
  summary:
    - >
      8BitDo Firmware Updater is the vendor's desktop maintenance utility for installing
      firmware on supported 8BitDo controllers and related devices.
  timeline:
    - >
      Ongoing: 8BitDo publishes model-specific firmware releases and directs supported
      devices to the common Firmware Updater.
  usage:
    - >
      Users connect a supported 8BitDo device, select or obtain the applicable firmware
      through official support, and run the updater to apply it. Model-specific
      compatibility information, manuals, and firmware changelogs should be checked
      before updating.
