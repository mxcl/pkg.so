history:
  adoption-history:
    - >
      The official service catalog presents the application as a broad web-service
      aggregator, listing more than 50 supported communication and productivity
      services. Its macOS distribution also entered Homebrew Cask under the token
      all-in-one-messenger.
  package-nerd-significance:
    - >
      The package is representative of Electron-era unified messengers: many web
      applications are isolated behind a single desktop shell, trading browser-tab
      clutter for one installable, cross-platform workspace. Its Homebrew Cask presence
      makes that proprietary-style desktop delivery reproducible for macOS users.
  project-history:
    - >
      All-in-One Messenger developed as a desktop shell for accessing numerous web-based
      messaging services from one interface. The official site identifies Hamburg with
      the product and documents desktop builds for Windows, macOS, and Linux.
  related-projects:
    - >
      Comparable unified-workspace applications include Franz, Ferdi, Rambox, and
      Station; these are related by product category, not documented as ancestors or
      forks.
  sources:
    - 'Official downloads page: https://allinone.im/downloads'
    - 'Official homepage: https://allinone.im/'
    - 'Official supported-services catalog: https://allinone.im/messenger'
    - source_facts.package-manager
  summary:
    - >
      All-in-One Messenger is a cross-platform desktop aggregator for messaging, email,
      collaboration, and other web services. It provides per-service instances,
      appearance controls, notifications, and unread counts within a common interface.
  timeline:
    - >
      2021: The official site’s terms and privacy documents were last updated, providing
      a dated marker for the current product identity.
    - >
      Version 2.5.0: The official downloads page distributes Windows and macOS builds;
      Linux is offered as version 2.0.0 AppImage.
  usage:
    - >
      Users add supported services such as WhatsApp, Telegram, Slack, Gmail, Microsoft
      Teams, or Discord, then switch among them from the application bar. Multiple
      instances allow separate accounts, while desktop notifications and unread counters
      centralize attention.
    - >
      On macOS, package-manager users install the application through the Homebrew Cask
      token all-in-one-messenger; service authentication remains within the individual
      web services.
