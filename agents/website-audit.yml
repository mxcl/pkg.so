history:
  adoption-history:
    - >
      The tool was first presented to data-protection-authority auditors at an EDPB
      bootcamp in June 2023. Positive feedback led the EDPB to consolidate and publish
      it as free and open-source software for authorities, controllers, processors, and
      other legal or technical auditors.
    - >
      Later work added multilingual support, multiple knowledge databases, import and
      export capabilities, a basic web edition, and an optional open-source backend
      intended to improve collaboration within organizations.
  package-nerd-significance:
    - >
      The project packages legal and technical privacy-audit workflows into a
      cross-platform desktop application under the EUPL. It is notable as an official
      European regulatory body's reproducible auditing tool, with both client and server
      components published on the EU's source-code platform.
  project-history:
    - >
      The Website Auditing Tool was developed through the EDPB Support Pool of Experts
      under supervision of the EDPB Secretariat. Dr. Jérôme Gorin developed the tool,
      building on ideas from the European Data Protection Supervisor's Website Evidence
      Collector.
  related-projects:
    - EDPS Website Evidence Collector
    - EDPB Website Auditing Tool Backend
    - EDPB Support Pool of Experts
  sources:
