      Official launch announcement:
      https://www.edpb.europa.eu/news/news/2024/edpb-launches-website-auditing-tool_en
    - >
      Official product page:
      https://www.edpb.europa.eu/documents/support-pool-of-experts/edpb-website-auditing-tool_en
    - 'Official release tags: https://code.europa.eu/edpb/website-auditing-tool/-/tags'
    - 'Official source repository: https://code.europa.eu/edpb/website-auditing-tool'
  summary:
    - >
      The EDPB Website Auditing Tool is a free, open-source application for preparing,
      conducting, evaluating, and reporting website privacy and data-protection audits.
  timeline:
    - >
      2022: The Support Pool of Experts project began developing a documented
      website-inspection tool.
    - >
      2023: The tool was presented to data-protection-authority auditors at the first
      EDPB Bootcamp.
    - >
      2024: Version 1.1.2 became the first public release, and the EDPB publicly
      launched the tool on January 29.
    - >
      2024: A second public iteration added features including multiple languages and
      knowledge databases.
    - '2025: Development expanded toward collaborative client and server workflows.'
  usage:
    - >
      Auditors visit a target website through the application, collect and evaluate
      evidence such as trackers and storage behavior, consult knowledge databases,
      import results from compatible tools, and generate audit reports. The intended
      users include data protection authorities as well as organizations assessing their
      own websites.
