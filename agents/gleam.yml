credentials-file-location: null
history:
  adoption-history:
    - >
      Gleam grew around BEAM developers who wanted static types without giving up
      Erlang's runtime model or Elixir's library reach. Official documentation also
      points learners from Elixir, Elm, Erlang, PHP, Python, and Rust toward migration
      guides, which reflects the language's role as a bridge between functional-web
      communities.
    - >
      The project maintains its own package index and documentation flow, making
      third-party libraries visible without depending solely on Hex package pages. That
      helped Gleam develop a recognizable ecosystem around web services, deployment
      guides, editor tooling, and core-team packages.
  package-nerd-significance:
    - >
      For package maintainers, Gleam is a small but complete language stack: one binary,
      one manifest, official docs, official package search, and reproducible project
      commands. That makes it easy to package compared with language ecosystems that
      split compiler, formatter, package manager, and language server into separate
      distributions.
  project-history:
    - >
      Louis Pilfold announced Gleam v0.1 in April 2019 as a friendly language for
      maintainable, scalable systems on the Erlang virtual machine. The early design
      combined ML-family type-system ideas with BEAM interoperability, so Gleam modules
      could call Erlang and Elixir code and expose libraries back to the wider BEAM
      ecosystem.
    - >
      The 1.0 release in March 2024 marked the language, compiler, build tool, package
      manager, formatter, language server, and WASM/JavaScript compiler API as stable
      public surfaces. That milestone turned Gleam from a promising BEAM experiment into
      a production-oriented language with a semver promise for its core tooling.
  related-projects:
    - >
      Gleam is related to Erlang and Elixir through the BEAM runtime, and to Elm, OCaml,
      and Rust through type-system and developer-experience influences.
  sources:
    - https://github.com/gleam-lang/gleam
    - https://gleam.run/documentation/
    - https://gleam.run/news/gleam-version-1/
    - https://gleam.run/news/hello-gleam/
  summary:
    - >
      Gleam is a statically typed functional programming language and toolchain for the
      Erlang VM, with JavaScript runtime support added as the language matured. Its
      package-manager identity is unusually compact: the same `gleam` command covers
      compiling, formatting, project management, package publishing, and editor
      integration.
  timeline:
    - '2019: Gleam v0.1 announced as the first public release.'
    - '2024: Gleam v1.0 released with stable language and tooling APIs.'
  usage:
    - >
      Practitioners use `gleam new`, `gleam build`, `gleam test`, `gleam format`, and
      `gleam publish` as the normal project loop. In package-manager terms, installing
      the Homebrew formula gives the compiler plus the build and package tools, with
      `gleam.toml` as the project manifest.
    - >
      Gleam is most often chosen for network services, web backends, command-backed
      project automation, and typed libraries that need BEAM interoperation. The
      JavaScript target extends the same source language to browsers and other
      JavaScript runtimes.
related-packages:
  - id: brew:erlang
    reason: >
      Erlang/OTP supplies the BEAM runtime used by Gleam's default Erlang target and
      enables direct interoperability with Erlang libraries.
    rel: adjacent_workflow
    sources:
      - https://gleam.run/news/gleam-version-1/
      - https://www.erlang.org/docs
