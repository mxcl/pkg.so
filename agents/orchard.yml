history:
  adoption-history:
    - >
      The official project README reports recurring Homebrew installations and interest
      from engineers across major technology and cloud-native organizations. Orchard
      remains a comparatively young, focused tool rather than a general multi-runtime
      desktop platform.
  package-nerd-significance:
    - >
      Orchard packages a native macOS control surface for Apple's container runtime, an
      ecosystem that otherwise centers on the container command-line interface. It is
      notable for using the same typed Swift XPC APIs as the CLI for most operations
      instead of emulating Docker or parsing command output.
  project-history:
    - >
      Orchard was developed as an open-source Swift and SwiftUI application focused
      exclusively on Apple's container runtime. Its architecture uses ContainerAPIClient
      over XPC for typed access to containers, images, networks, statistics, logs, and
      system health, with limited CLI use where the API lacks coverage.
  related-projects:
    - Apple container
    - ContainerAPIClient
    - Podman Desktop
    - Docker Desktop
    - OrbStack
  sources:
    - 'Official repository README: https://github.com/andrew-waters/orchard#readme'
    - source_facts.description
    - source_facts.repo
  summary:
    - >
      Orchard is a lightweight, native macOS GUI for managing Apple's container runtime,
      including containers, images, networks, logs, statistics, container machines, and
      related developer workflows.
  timeline:
    - >
      Undated: Orchard launched as an open-source, native Swift/SwiftUI frontend for
      Apple's container runtime.
  usage:
    - >
      Developers use Orchard to inspect and manage Apple containers, images, networks,
      machines, logs, and resource statistics from a graphical macOS application.
      Apple's container runtime is a prerequisite.
