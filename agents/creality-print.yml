history:
  adoption-history:
    - >
      Creality distributes the slicer for its FDM-printer ecosystem while developing it
      openly. Official releases provide desktop builds, and the project maintains
      community channels for testers and developers.
  package-nerd-significance:
    - >
      Its source lineage illustrates the unusually fork-rich culture of open-source
      3D-printing slicers: improvements flow through a chain beginning with Slic3r and
      continuing through PrusaSlicer, Bambu Studio, OrcaSlicer, and Creality Print, with
      additional ideas incorporated from SuperSlicer.
  project-history:
    - >
      Creality Print is Creality's open-source FDM slicer. The official project states
      that it was originally forked from OrcaSlicer, which derives through Bambu Studio
      and PrusaSlicer from Slic3r.
    - >
      The project also incorporates features from SuperSlicer and is released under the
      GNU Affero General Public License version 3.
  related-projects:
    - 'OrcaSlicer: the immediate upstream from which Creality Print was originally forked.'
    - 'Bambu Studio, PrusaSlicer, and Slic3r: earlier projects in its upstream lineage.'
    - 'SuperSlicer: a source of additional slicer features incorporated by Creality Print.'
  sources:
    - https://github.com/CrealityOfficial/CrealityPrint
    - https://wiki.creality.com/en/software/6-0
  summary:
    - >
      Creality Print is Creality's open-source desktop slicer for preparing models and
      generating G-code for FDM 3D printers, with printer calibration, Klipper support,
      and cloud-connected workflows.
  timeline:
    - 'Project origin: Forked from OrcaSlicer as part of the Slic3r-derived slicer family.'
    - >
      Current development: Maintained openly by Creality with stable and prerelease
      desktop builds published through GitHub Releases.
  usage:
    - >
      Users import a 3D model, select a supported printer and filament profile, tune
      slicing and calibration parameters, preview the generated toolpath, and export or
      transmit G-code for printing. Klipper users can apply the documented printer
      configuration for features such as object exclusion and arc support.
