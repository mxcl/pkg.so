history:
  adoption-history:
    - >
      Hyperkey occupies a focused niche among macOS users who need additional
      conflict-free shortcuts, particularly users of window managers and automation
      tools. The official site presents it as a lightweight companion to Rectangle and
      documents interoperability with Keyboard Maestro.
  package-nerd-significance:
    - >
      The application packages the long-standing power-user convention of mapping Caps
      Lock to the combined Control-Option-Command-Shift modifier into a small graphical
      utility. It offers a simpler, higher-level alternative to configuring the broader
      Karabiner-Elements remapping system.
  project-history:
    - >
      macOS developer Ryan Hanson created Hyperkey as a single-purpose implementation of
      the established 'hyper key' convention. Hanson explicitly designed it for
      lightweight configuration and minimal operating-system impact rather than
      comprehensive keyboard remapping.
    - >
      The product later became the focused free tier alongside Superkey, which
      incorporates Hyperkey's remapping capability into a broader keyboard-productivity
      application.
  related-projects:
    - >
      Rectangle: Ryan Hanson's open-source macOS window manager and an intended
      companion for Hyperkey shortcuts.
    - "Superkey: A broader productivity application containing Hyperkey's remapping features."
    - >
      Karabiner-Elements: A more comprehensive open-source keyboard-customization tool
      that can also implement a hyper key.
    - >
      Keyboard Maestro: A macOS automation tool whose shortcuts can be triggered through
      Hyperkey with the documented recording procedure.
  sources:
    - "Creator's Hyperkey design article: https://ryanhanson.dev/posts/hyperkey"
    - "Creator's application catalog: https://ryanhanson.dev/"
    - 'Hyperkey official site and FAQ: https://hyperkey.app/'
  summary:
    - >
      Hyperkey is Ryan Hanson's lightweight macOS utility for turning Caps Lock or
      another modifier into the combined Control-Option-Command-Shift 'hyper key',
      providing an extra shortcut namespace.
  timeline:
    - >
      Product evolution: Hyperkey became a free, focused utility while its functionality
      was also incorporated into the broader Superkey application.
  usage:
    - >
      Choose Caps Lock or another modifier as the hyper key, then bind the resulting
      four-modifier chord in other applications. Users can alternatively remap Caps Lock
      to another useful key. Password fields may ignore remappings because macOS secure
      input prevents third-party applications from observing their keystrokes.
