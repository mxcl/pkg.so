history:
  adoption-history:
    - >
      The toolset is delivered as part of the Vulkan SDK. The input additionally records
      packages in Homebrew and Arch Linux's package ecosystem.
  package-nerd-significance:
    - >
      Vulkan Profiles turns a sprawling matrix of versions, extensions, features,
      formats, and limits into machine-readable capability contracts. The package
      supplies tooling useful to SDK packagers, graphics developers, engine maintainers,
      and conformance-oriented workflows.
  project-history:
    - >
      Khronos and ecosystem contributors developed Vulkan Profiles to reduce
      capability-fragmentation problems across devices and platforms. The project
      combines a profile-processing CLI, JSON schemas, a C++ API library, a development
      layer, and generated comparison documentation. Its release tags track Vulkan
      specification and SDK revisions.
  related-projects:
    - The Vulkan SDK distributes the toolset.
    - Vulkan-Headers supplies API definitions against which profiles are generated.
    - >
      Vulkan Validation Layers complement the Profiles layer when testing application
      behavior.
    - Vulkan Configurator can enable and configure the Profiles layer.
  sources:
    - https://github.com/KhronosGroup/Vulkan-Guide/blob/main/chapters/vulkan_profiles.adoc
    - https://github.com/KhronosGroup/Vulkan-Profiles
    - https://github.com/KhronosGroup/Vulkan-Profiles/blob/main/CHANGELOG.md
    - https://github.com/KhronosGroup/Vulkan-Profiles/blob/main/OVERVIEW.md
    - source_facts.package-manager
  summary:
    - >
      The Vulkan Profiles Toolset is Khronos's collection of command-line, schema,
      library, layer, and documentation components for defining and using portable
      Vulkan capability profiles.
  timeline:
    - >
      2021: The toolset documentation references Android baseline profiles using the
      year-versioned profile scheme.
    - >
      2022: Baseline and Khronos roadmap profiles established widely documented
      cross-platform capability targets.
    - >
      2023: Repository tagging adopted Vulkan-specification and Vulkan-SDK version
      conventions.
    - '2026: The official changelog records Vulkan 1.4-era profiles and tooling updates.'
  usage:
    - >
      Developers use `vkprofiles` to validate, analyze, combine, transform, and generate
      artifacts from profile JSON. Applications can use the Profiles API library to test
      device support and enable required features, while the Profiles layer can clamp
      reported capabilities for development testing.
