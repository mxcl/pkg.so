id: brew:mkvalidator
display-name: mkvalidator
repo: https://github.com/Matroska-Org/foundation-source
docs:
  - https://www.matroska.org/downloads/mkvalidator.html
config-file-location: null
credentials-file-location: null
history:
  sources:
    - https://formulae.brew.sh/formula/mkvalidator
    - https://sourceforge.net/projects/matroska/files/mkvalidator/
    - https://www.matroska.org/downloads/mkvalidator.html
  summary:
    - >
      mkvalidator is part of the Matroska tool ecosystem: a small command-line validator
      for Matroska and WebM files. Matroska.org describes it as checking Matroska and
      WebM files for conformance against the EBML DocType version and reporting
      command-line errors and warnings for bogus or missing key elements.
  usage:
    - >
      The SourceForge release notes show active validator evolution in 2010 around WebM
      strings, profile handling, cue and track checks, cluster timing, live-stream
      checks, track bitrate/details output, aspect-ratio warnings, attachment-link
      validation, and DivX extension handling. In practice, the tool occupies a QA niche
      beside muxing and inspection tools such as MKVToolNix: it does not create or edit
      media, but reports whether a Matroska/WebM file follows container expectations.
      Homebrew packages it as a standalone BSD-licensed conformance checker.
related-packages:
  - id: brew:mkclean
    reason: >
      Use mkclean to clean and optimize an already-muxed Matroska or WebM file, then run
      mkvalidator to check the resulting container for specification conformance.
    rel: adjacent_workflow
    sources:
      - https://www.matroska.org/downloads/mkclean.html
      - https://www.matroska.org/downloads/mkvalidator.html
  - id: brew:mkvtoolnix
    reason: >
      Use MKVToolNix to create, inspect, or modify Matroska files and mkvalidator as the
      subsequent independent conformance-checking step.
    rel: adjacent_workflow
    sources:
      - https://www.matroska.org/downloads/mkvalidator.html
      - https://mkvtoolnix.download/doc/mkvmerge.html
