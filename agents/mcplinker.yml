history:
  adoption-history:
    - >
      MCP Linker broadened from a graphical MCP server catalog into a cross-platform
      configuration manager supporting clients including Claude Desktop and Claude Code,
      Cursor, VS Code/Copilot, Cline, Windsurf, Codex, Roo Code, and MCPHub. The project
      is distributed through direct releases, Homebrew, and the Arch User Repository.
  package-nerd-significance:
    - >
      MCP Linker treats configuration fragments as packages that can be discovered,
      installed, enabled, and synchronized across otherwise incompatible AI clients.
      This addresses a distinct package-management problem in the MCP ecosystem: the
      same server definition often needs to be translated into several client-specific
      configuration locations.
  project-history:
    - >
      MCP Linker began as a desktop manager for discovering MCP servers and writing
      their definitions into supported AI-client configuration files. It developed
      cross-platform local synchronization, a curated marketplace, automatic runtime
      detection, and optional encrypted cloud synchronization. Later releases
      reorganized client support and moved cloud synchronization to Supabase.
  related-projects:
    - >
      Model Context Protocol is the interoperability standard around which MCP Linker
      organizes server configurations.
    - >
      The official README names Claude, Cursor, VS Code/Copilot, Cline, Windsurf, Codex,
      Roo Code, and MCPHub among supported clients.
    - The maintainer identifies Codexia as a related graphical tool for the OpenAI Codex CLI.
  sources:
    - >
      https://github.com/milisp/mcp-linker#readme — official features, installation,
      supported clients, and workflow.
    - https://github.com/milisp/mcp-linker/releases — official release history.
    - >
      https://github.com/milisp/mcp-linker/wiki — official explanation of configuration
      changes and client paths.
    - source_facts.package-manager — records Homebrew cask distribution.
  summary:
    - >
      MCP Linker is a cross-platform desktop application for discovering MCP servers and
      adding or synchronizing their configuration across multiple AI clients.
  timeline:
    - >
      2025: The official wiki documented direct modification of supported clients' MCP
      configuration files.
    - >
      2025: v1.7 added Codex CLI and Claude Code configuration management and local
      synchronization.
    - '2025: v2.0 introduced tier-based feature controls.'
    - >
      2026: v2.2 moved cloud synchronization and configuration management to Supabase
      and refined the supported-client list.
  usage:
    - >
      Browse the built-in MCP marketplace, select a server, inspect its configuration,
      and add it to one or more supported clients. MCP Linker writes the appropriate
      client configuration directly; the official wiki advises backing up existing
      configuration because some operations can overwrite it.
