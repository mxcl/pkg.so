id: cask:qgis@ltr
display-name: QGIS LTR
repo: https://github.com/qgis/QGIS
docs:
  - https://docs.qgis.org/3.44/en/docs
  - https://docs.qgis.org/3.44/en/docs/training_manual
  - https://docs.qgis.org/3.44/en/docs/user_manual
config-file-location:
  linux:
    - ~/.local/share/QGIS/QGIS3/profiles/<profile>/
  macos:
    - ~/Library/Application Support/QGIS/QGIS3/profiles/<profile>/
  windows:
    - '%APPDATA%\QGIS\QGIS3\profiles\<profile>\'
credentials-file-location:
  linux:
    - ~/.local/share/QGIS/QGIS3/profiles/<profile>/qgis-auth.db
  macos:
    - ~/Library/Application Support/QGIS/QGIS3/profiles/<profile>/qgis-auth.db
  windows:
    - '%APPDATA%\QGIS\QGIS3\profiles\<profile>\qgis-auth.db'
history:
  adoption-history:
    - >
      QGIS grew from a Linux PostGIS viewer into a cross-platform desktop GIS for Linux,
      Unix, macOS, and Windows. It is maintained by an international contributor
      community, supported by commercial and institutional participants, and forms part
      of the Open Source Geospatial Foundation ecosystem.
    - >
      The project supports professional adoption through long-term-release branches,
      monthly bug-fix releases, a Python and C++ extension model, an official plugin
      repository, training material, and related server tooling.
  package-nerd-significance:
    - >
      QGIS is one of the flagship open-source desktop GIS packages and a prominent
      example of packaging a very large C++/Qt application with extensive native
      geospatial dependencies. The LTR cask matters to organizations that prioritize
      stability and plugin compatibility over receiving the newest feature release.
  project-history:
    - >
      Gary Sherman began QGIS in February 2002 to provide a Linux viewer for PostGIS
      data, and the first release followed in June 2002. The application subsequently
      gained editing, map composition, GRASS integration, plugins, and support for major
      desktop operating systems.
    - >
      QGIS reached version 1.0 after nearly seven years of development. The project now
      follows a time-based release process with Latest Release, Long Term Release, and
      development branches, while the same codebase also supports QGIS Server.
  related-projects:
    - >
      QGIS is an OSGeo project and works with PostGIS, GDAL/OGR, PROJ, GEOS, GRASS GIS,
      Qt, Python plugins, and QGIS Server.
  sources:
    - https://docs.qgis.org/3.44/en/docs/user_manual/introduction/qgis_configuration.html
    - https://github.com/qgis/QGIS
    - https://issues.qgis.org/projects/qgis/wiki/VisualChangelog100
    - https://www.qgis.org/download/
  summary:
    - >
      QGIS is a free, open-source, cross-platform geographic information system for
      viewing, editing, analyzing, and publishing raster, vector, mesh, point-cloud, and
      database-backed spatial data. This package tracks the stability-oriented Long Term
      Release line.
  timeline:
    - '2002-02: QGIS development begins as a Linux PostGIS viewer.'
    - '2002-06: First QGIS release.'
    - '2009-01: QGIS 1.0 establishes a stable application and extension API.'
    - >
      Current era: Time-based development maintains Latest Release and Long Term Release
      branches with monthly point releases.
  usage:
    - >
      QGIS is used for cartography, spatial-data editing and management, geospatial
      analysis, database and web-service access, print-layout production, and extensible
      workflows built with plugins, models, Python, or C++.
tags:
  - cartography
  - geospatial
  - gis
  - long-term-support
  - mapping
  - open-source
  - remote-sensing
  - spatial-analysis
