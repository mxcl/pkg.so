history:
  adoption-history:
    - >
      The JavaCC README describes an estimated user base above 1,000 users and more than
      100,000 downloads, and lists production users such as Apache ActiveMQ, Avro,
      Calcite, Camel, Jena, Lucene, Tomcat, ZooKeeper, and JavaParser. The package
      metadata in the input shows distribution through Homebrew, Debian/Ubuntu, Fedora,
      MacPorts, Nix, and openSUSE.
  package-nerd-significance:
    - >
      JavaCC is a classic compiler-construction package: small on the command line,
      large in influence. It appears in source trees as generated parser code, in build
      systems as a grammar-generation step, and in package managers as a standalone
      toolchain dependency for projects that prefer Java-native parser generation over
      ANTLR or yacc-family tools.
  project-history:
    - >
      The JavaCC repository says the project was originally developed at Sun
      Microsystems by Sreeni Viswanadha and Sriram Sankar. The long-running version 7
      repository represents the classic Java-focused line, while the version 8 work
      separates the parser core from language generators and adds C++ and C# generator
      targets.
    - >
      The project documentation positions JavaCC as a top-down parser generator rather
      than a yacc-style bottom-up generator. Its generated parsers are pure Java and do
      not require JavaCC at runtime, a design choice that helped it fit naturally into
      Java build and distribution workflows.
  related-projects:
    - >
      JavaCC is closely related to JJTree, JJDoc, JavaCC 8, ANTLR, yacc-style parser
      generators, Apache Lucene, Apache Tomcat, Apache Calcite, Apache Jena, and
      JavaParser.
  sources:
    - https://github.com/javacc/javacc
    - https://github.com/javacc/javacc-8
    - https://javacc.github.io/javacc/
    - https://javacc.github.io/javacc/documentation
    - source_facts.package-manager
  summary:
    - >
      JavaCC, the Java Compiler Compiler, is a parser generator and lexical-analyzer
      generator for Java applications. It reads grammar specifications and emits
      recursive-descent parsers, with companion tools such as JJTree for syntax trees
      and JJDoc for grammar documentation.
  timeline:
    - '1990s: JavaCC originates at Sun Microsystems.'
    - >
      2000s: JavaCC becomes a common Java parser generator in open-source and commercial
      Java projects.
    - '2023: JavaCC 7.0.13 is released from the classic repository.'
    - '2026: JavaCC 8.1.0 is released from the v8 umbrella repository.'
  usage:
    - >
      Developers write .jj or .jjt grammar files, run javacc or jjtree, and compile the
      generated Java sources into their application. The tool supports EBNF constructs,
      LL(k) lookahead, lexical states, Unicode-aware lexical specs, debug options, and a
      documentation generator for grammars.
related-packages:
  - id: brew:antlr
    reason: >
      Choose ANTLR when one grammar must target several supported languages and the
      broader ANTLR runtime ecosystem is useful; choose JavaCC for its Java-oriented
      recursive-descent workflow and integrated JJTree and JJDoc tools.
    rel: alternative
    sources:
      - https://github.com/javacc/javacc
      - https://www.antlr.org/
      - https://github.com/antlr/antlr4/blob/master/doc/index.md
