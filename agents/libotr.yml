history:
  adoption-history:
    - >
      OTR became especially associated with desktop XMPP and multiprotocol IM clients.
      XMPP Extension Protocol 0364 described OTR as the de facto standard for end-to-end
      encryption in XMPP, while the OTR site maintained user-facing downloads for
      pidgin-otr, source repositories, protocol documents, and implementation lists.
  package-nerd-significance:
    - >
      libotr matters because it is a small library package carrying a big protocol
      story: it let package managers deliver interoperable deniable encryption to chat
      clients before modern app-specific encrypted messengers became dominant. Its 2016
      security release also shows why distro maintainers cared about keeping even niche
      crypto libraries patched.
  project-history:
    - >
      OTR came from academic and cypherpunk work on making instant messaging behave more
      like an off-the-record conversation than signed email. The official OTR site links
      the library, the Pidgin plugin, protocol descriptions, and the original research
      papers as one software-and-protocol family.
    - >
      libotr served as the reference C implementation for client developers. The project
      paired the LGPL library with GPL toolkit programs and with pidgin-otr, making it
      practical for multiprotocol IM clients to add OTR without each client
      reimplementing the cryptographic state machine.
  related-projects:
    - >
      pidgin-otr is the best-known client plugin distributed alongside libotr by the OTR
      project.
    - The OTR protocol documents define the wire protocol that libotr implements.
    - >
      XMPP clients and multiprotocol IM clients were the main ecosystem where libotr was
      reused.
  sources:
    - https://dl.acm.org/doi/10.1145/1102199.1102216
    - https://otr.cypherpunks.ca/
    - https://otr.cypherpunks.ca/Protocol-v3-4.0.0.html
    - https://otr.cypherpunks.ca/news.php
    - https://xmpp.org/extensions/xep-0364.html
  summary:
    - >
      libotr is the portable C library and toolkit for Off-the-Record Messaging, a
      protocol for private instant-messaging conversations with encryption,
      authentication during the conversation, deniability after the fact, and perfect
      forward secrecy.
  timeline:
    - >
      2004: The OTR design was published in the WPES paper linked from the official OTR
      documentation.
    - '2012: libotr 4.0.0 and pidgin-otr 4.0.0 were released.'
    - >
      2014: libotr 4.1.0 was released with build-system, secure-memory, constant-time
      comparison, and API changes.
    - '2016: libotr 4.1.1 fixed CVE-2016-2851 and tightened protocol parsing.'
  usage:
    - >
      Applications link libotr to negotiate OTR sessions, run the authenticated key
      exchange, encrypt and authenticate data messages, and expose higher-level
      verification flows such as the Socialist Millionaires' Protocol. The Homebrew
      package also installs toolkit programs for inspecting, modifying, and testing OTR
      message artifacts.
