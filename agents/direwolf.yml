history:
  adoption-history:
    - >
      Dire Wolf's adoption follows the amateur-radio package path: source builds for
      Linux and macOS, Windows release archives, and distribution packages whose
      versions may lag development. The README explicitly lists Debian-style apt, Red
      Hat-style yum, and Homebrew installation routes.
  package-nerd-significance:
    - >
      Dire Wolf matters to package nerds because it turns specialized radio hardware
      behavior into portable software that can be installed on ordinary Linux, macOS,
      Windows, and single-board-computer systems.
  project-history:
    - >
      The official README presents Dire Wolf as a modern software replacement for older
      hardware TNCs. It uses a computer soundcard and digital signal processing to
      decode packet radio signals and includes APRS tracker, digipeater, IGate, KISS,
      AGW, telemetry, and modem features.
  related-projects:
    - >
      The official documentation points to companion repositories for additional Dire
      Wolf documentation, presentations, Ham Radio of Things, and APRS packet
      specifications.
  sources:
    - https://github.com/wb2osz/direwolf
    - https://github.com/wb2osz/direwolf/blob/dev/README.md
    - https://github.com/wb2osz/direwolf/blob/dev/doc/README.md
    - https://github.com/wb2osz/direwolf/blob/dev/CHANGES.md
    - https://github.com/wb2osz/direwolf/releases/tag/1.8.1
  summary:
    - >
      Dire Wolf is a software soundcard AX.25 packet modem, TNC, and APRS
      encoder/decoder for amateur packet radio.
  timeline:
    - '2015: GitHub repository created.'
    - '2020: Version 1.6 moved to a CMake build procedure.'
    - '2023: Version 1.7 added more external documentation and IL2P support.'
    - '2025: Version 1.8.1 released.'
  usage:
    - >
      Typical users run it as a virtual TNC for APRS and packet-radio applications, as
      an APRS Internet Gateway, or as a tracker/digipeater. The documentation directory
      has grown into user guides and application notes for Raspberry Pi APRS, IGate
      operation, FX.25, AIS reception, telemetry, and related packet-radio workflows.
