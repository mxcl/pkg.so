history:
  adoption-history:
    - >
      VitalSource says that by 2013 Bookshelf was the leading academic e-reader
      platform, with a billion pages read by millions of students. Its 2014 acquisition
      of CourseSmart expanded the catalog and related content-management capabilities.
    - >
      The company reports more than 17 million active Bookshelf users in 2025, with
      content delivery relationships spanning thousands of publishers and educational
      institutions.
  package-nerd-significance:
    - >
      Bookshelf represents the institutionally distributed side of desktop package
      management: users often install it because a school, publisher, or purchased title
      depends on VitalSource's account, licensing, synchronization, and offline-reading
      ecosystem. Its presence in a package catalog makes a proprietary academic-content
      client reproducibly discoverable outside an app-store-only workflow.
  project-history:
    - >
      Bookshelf grew out of VitalSource's work on digital course materials. VitalSource
      was founded in 1994, and its early technology included a digitized dental
      curriculum and the VitalBook format.
    - >
      During the 2000s, VitalSource expanded university-wide e-text programs and
      learning-management-system integrations. By the following decade, Bookshelf had
      become the company's flagship academic reading platform, adding EPUB 3 support and
      a much larger catalog after the CourseSmart acquisition.
    - >
      A redesigned Bookshelf experience launched in 2021 with revised navigation,
      note-taking, workbook, and accessibility-oriented features. VitalSource has
      continued extending the platform with study and AI-assisted learning capabilities.
  related-projects:
    - VitalSource Online provides browser-based access to the same learning ecosystem.
    - >
      CourseSmart became part of VitalSource in 2014, expanding Bookshelf's catalog and
      institutional capabilities.
    - >
      Bookshelf+, CoachMe, and VitalSource's wider learning-delivery network extend
      Bookshelf with practice and assisted-study features.
  sources:
    - https://get.vitalsource.com/about-us
    - >
      https://get.vitalsource.com/press/vitalsource-announces-enhanced-bookshelf-experience-for-learners-and-institutions
    - https://www.vitalsource.com/about-us
    - https://www.vitalsource.com/bookshelf-features
  summary:
    - >
      VitalSource Bookshelf is a cross-platform eTextbook reader and study application
      used to access licensed academic materials online or offline. It combines reading
      with annotations, highlights, search, read-aloud support, bookmarks, flashcards,
      and synchronized study data.
  timeline:
    - '1994: VitalSource is founded.'
    - '1995-2000: Early VitalBook technology digitizes professional-school curricula.'
    - '2006: Ingram Content Group acquires VitalSource.'
    - >
      2013: Bookshelf is described by VitalSource as the leading academic e-reader
      platform, with one billion pages read.
    - "2014: VitalSource acquires CourseSmart and expands Bookshelf's catalog."
    - '2021: VitalSource launches a redesigned Bookshelf experience.'
    - '2025: VitalSource reports more than 17 million active Bookshelf users.'
  usage:
    - >
      Learners sign in with a VitalSource account to download or open assigned and
      purchased eTextbooks. Downloaded titles can be read offline, subject to the
      title's license, while notes and highlights synchronize between registered
      devices.
    - >
      The application is commonly used for course reading, full-text and figure
      searches, margin notes, highlighting, bookmarks, read-aloud access, flashcards,
      and review through its workbook and study tools.
