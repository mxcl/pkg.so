id: brew:fex
display-name: fex
repo: https://github.com/jordansissel/fex
docs:
  - https://github.com/jordansissel/fex#readme
  - https://www.semicomplete.com/projects/fex
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew packages fex as a stable formula at version 2.0.0. Its official project
      page directs release downloads to GitHub, making the GitHub repository the
      practical source and release surface for package maintainers.
  package-nerd-significance:
    - >
      fex matters to CLI package users because it sits in the classic Unix text-filter
      niche: tiny executable, no service state, and a focused syntax that makes
      package-manager installation convenient for shell pipelines.
  project-history:
    - >
      Jordan Sissel published the official fex project page on May 19, 2010, describing
      it as flexible token-field extraction and documenting examples for logs, paths,
      and passwd-style records. The GitHub repository identifies the project as flexible
      field/token extraction and has been public on GitHub since 2011.
  related-projects:
    - The README says fex is related to cut, awk, and ksb's xapply field extraction syntax.
  sources:
    - https://api.github.com/repos/jordansissel/fex
    - https://formulae.brew.sh/api/formula/fex.json
    - https://github.com/jordansissel/fex
    - https://www.semicomplete.com/projects/fex/
  summary:
    - >
      fex is a small command-line field extractor for tokenizing strings and selecting
      fields with concise delimiter and range syntax.
  timeline:
    - '2010: Official fex project page published.'
    - '2011: GitHub repository created.'
    - '2021: GitHub repository last pushed according to GitHub metadata.'
    - '2026: Homebrew formula reports stable version 2.0.0.'
  usage:
    - >
      Typical use is pipeline text processing: provide delimiters and field selectors to
      pull fields from log lines, paths, or colon-separated records. The official docs
      position it as a concise alternative to repeated cut or awk invocations for
      selected field extraction.
related-packages:
  - id: brew:gawk
    reason: >
      Choose GNU Awk when extraction also needs calculations, conditions, record
      processing, or a full text-processing language rather than fex's compact selector
      syntax.
    rel: alternative
    sources:
      - https://www.semicomplete.com/projects/fex/
      - https://www.gnu.org/software/gawk/manual/gawk.html
  - id: brew:coreutils
    reason: >
      GNU Coreutils supplies cut for straightforward character-, byte-, and
      delimiter-based field selection when fex's nested or negative-offset selectors are
      unnecessary.
    rel: alternative
    sources:
      - https://www.semicomplete.com/projects/fex/
      - https://www.gnu.org/software/coreutils/manual/html_node/cut-invocation.html
tags:
