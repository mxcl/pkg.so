history:
  adoption-history:
    - >
      The vendor explicitly documents installation through Homebrew Cask, alongside
      desktop distribution for Windows, macOS, and Linux. Its stated workflows include
      data analysis and preparing files for database import.
  package-nerd-significance:
    - >
      Modern CSV applies familiar programmer-editor conventions to tabular files: a
      searchable command launcher, configurable shortcuts, and simultaneous operations
      on multiple cells. Official Homebrew installation instructions make its desktop
      packaging relevant to command-line-oriented users.
  project-history:
    - >
      The developer describes Modern CSV as an attempt to bring the editing experience
      of Sublime Text, Atom, and Visual Studio Code to CSV data, including proper column
      operations. The second major release introduced interface and performance
      improvements and native Apple Silicon compatibility.
  related-projects:
    - >
      Sublime Text, Atom, and Visual Studio Code are cited by the developer as interface
      inspirations.
  sources:
    - >
      [Developer's design
      explanation](https://www.moderncsv.com/a-text-editor-for-csv-files/).
    - '[Official overview](https://www.moderncsv.com/).'
    - '[Official release archive](https://www.moderncsv.com/category/uncategorized/).'
  summary:
    - >
      Modern CSV is a desktop editor and viewer for delimited text tables, with tools
      for inspecting and transforming data.
  timeline:
    - '2023: Modern CSV 2 adds native Apple Silicon compatibility and interface improvements.'
    - '2024: Modern CSV 2.1 adds JSON/XML exchange and pivot-table functionality.'
  usage:
    - >
      Use it to edit rows and columns, sort or filter data, and inspect large files.
      Preferences can be reached through the application; Open Preference File Folder
      reveals the installed preference location.
