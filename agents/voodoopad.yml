history:
  adoption-history:
    - >
      VoodooPad developed a long-lived Mac user base around personal wikis and
      interlinked documents, with historical Lite and Pro editions as well as macOS and
      iOS versions. Its FAQ preserves downloads for older releases reaching back to the
      2.x generation.
    - >
      The product moved through Plausible Labs and was acquired by Primate Labs in
      December 2017. Primate Labs committed to maintaining the application with
      incremental releases.
  package-nerd-significance:
    - >
      VoodooPad is part of the early Mac-native personal-wiki tradition: documents
      behave like small interlinked websites but retain desktop application features
      such as rich text, scripting, import and export, encryption, and local serving. A
      Homebrew cask keeps this established proprietary Mac application accessible
      through command-line package workflows.
  project-history:
    - >
      VoodooPad matured through multiple major versions and separate Lite and Pro
      editions before the modern unified product. Official documentation records a
      Plausible Labs era during which its legacy cryptography was audited and replaced
      with a documented authenticated-encryption design.
    - >
      Primate Labs acquired VoodooPad in December 2017, succeeding Plausible Labs as
      steward of the macOS and iOS application.
  related-projects:
    - >
      VoodooPad for iOS and VP Reader extended access to VoodooPad documents on mobile
      devices.
    - >
      The application’s built-in web server can publish selected documents over a local
      network or the internet.
  sources:
    - https://www.voodoopad.com/blog/2017/12/primate-labs-acquires-voodoopad/
    - https://www.voodoopad.com/documentation/
    - https://www.voodoopad.com/documentation/encryption-overview/
    - https://www.voodoopad.com/documentation/frequently-asked-questions/
  summary:
    - >
      VoodooPad is a long-running macOS personal wiki and notes organizer built around
      linked pages, rich content, search, tags, scripting, export, and optional
      encryption.
  timeline:
    - 'VoodooPad 2.x: Official archives supported Mac OS X 10.3.9-era systems.'
    - 'VoodooPad 4.x: The product offered standard, Lite, and Pro editions.'
    - 'VoodooPad 5.1.4: Introduced the post-audit authenticated-encryption design.'
    - '2017: Primate Labs acquired VoodooPad.'
  usage:
    - >
      Users create documents containing interlinked pages, notes, images, files, lists,
      and other reference material. Search, backlinks, aliases, collections, tags,
      templates, scripting, import/export, encryption, and an optional built-in web
      server support personal-knowledge-base workflows.
