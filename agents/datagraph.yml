history:
  adoption-history:
    - >
      DataGraph developed a niche following among macOS users who need
      publication-oriented scientific plots without programming against a plotting
      library. Homebrew Cask adds a package-manager installation path for the
      vendor-distributed application.
  package-nerd-significance:
    - >
      DataGraph is notable in the Mac package ecosystem as a native, document-based
      alternative to script-driven tools such as R, Python plotting libraries, and
      gnuplot. Its package combines spreadsheet-like data manipulation, statistical
      operations, and precise graphics in one application.
  project-history:
    - >
      DataGraph was created by David Adalsteinnson and is developed by Visual Data
      Tools. Archived official release notes document the product by at least version
      2.3.1 in 2010.
    - >
      The application evolved from graph construction toward broader analytical work.
      Official notes for version 3.2 highlighted pivot-table functionality, while
      version 4.0 added autosave, Excel import and export, performance improvements, and
      expanded drawing commands.
  related-projects:
    - >
      The DataGraph Framework exposes the application's graphics engine for integration
      into other applications. DataPlot is another Visual Data Tools product appearing
      in the vendor's historical release material.
  sources:
    - https://www.visualdatatools.com/DataGraph/Framework/index.html
    - https://www.visualdatatools.com/DataGraph/Manual.pdf
    - https://www.visualdatatools.com/DataGraph/Versions/36/
    - https://www.visualdatatools.com/DataGraph/Versions/48/
  summary:
    - >
      DataGraph is a native macOS application for scientific and statistical graphing,
      data transformation, analysis, and publication-quality figure preparation.
  timeline:
    - '2010: Official release notes documented DataGraph 2.3.1.'
    - '2014: Version 3.2 expanded pivot-table and analytical functionality.'
    - >
      2016: Version 4.0 added autosave, Excel interchange, and extensive graphing
      improvements.
    - '2024: Visual Data Tools released the DataGraph 5.4 manual.'
  usage:
    - >
      Users import or paste tabular data, derive and transform columns, apply
      statistical operations, assemble plots from configurable drawing commands, and
      export figures or processed data.
