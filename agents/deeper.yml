history:
  adoption-history:
    - >
      Deeper has served Mac users who want a graphical interface for preferences that
      would otherwise require command-line defaults or other advanced system changes.
      Titanium Software maintains separate releases for major macOS versions, including
      historical builds extending back to Mac OS X Tiger.
    - The supplied record documents an additional installation route through Homebrew Cask.
  package-nerd-significance:
    - >
      Deeper represents a long-running class of macOS tweaking utilities that expose
      undocumented or inconvenient preferences through a GUI. Package users must pay
      particular attention to the vendor's strict mapping between application versions
      and macOS major releases.
    - >
      Deeper is also a component of Titanium Software's broader OnyX utility, so users
      of OnyX generally do not need the standalone application.
  project-history:
    - >
      Titanium Software has developed Mac utilities since 2003. Deeper emerged from that
      utility family as a focused interface for enabling and disabling hidden macOS and
      Apple-application features.
    - >
      The vendor preserves old Deeper versions for older operating systems while
      discontinuing updates to those branches. Current development tracks each new macOS
      generation with a compatible release.
  related-projects:
    - >
      Deeper is part of Titanium Software's OnyX suite and is related to the vendor's
      Maintenance, Uninstaller, CalHash, and Schedulizer utilities.
  sources:
    - https://www.titanium-software.fr/en/applications.html
    - https://www.titanium-software.fr/en/deeper.html
    - https://www.titanium-software.fr/en/deeper_release.html
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Deeper is a free macOS personalization utility from Titanium Software that exposes
      hidden system and Apple-application settings.
  timeline:
    - '2003: Titanium Software began developing its family of Mac utilities.'
    - 'Mac OS X 10.4 era: Deeper 1.0 supported PowerPC and Intel Macs.'
    - >
      2026: Deeper 3.3 targeted macOS Tahoe 26, with older branches retained for earlier
      macOS releases.
  usage:
    - >
      Users select the Deeper release intended for their exact macOS major version, then
      use its graphical panes to adjust hidden Finder, Dock, Safari, Music,
      login-window, Gatekeeper, and related preferences.
