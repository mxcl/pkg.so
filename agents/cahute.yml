id: brew:cahute
display-name: Cahute
repo: https://gitlab.com/cahute/cahute
docs:
  - https://cahute.org/
  - https://cahute.org/cli/cas.html
  - https://cahute.org/topics/file-formats/casrc.html
config-file-location:
  unix:
    - ~/.casrc
    - /etc/system.casrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is mostly in the calculator hacking, education-device, and
      retro-computing niche. The Homebrew package makes the tools available to macOS
      users who need calculator file transfer and protocol tools without building from
      source.
  package-nerd-significance:
    - >
      Cahute is package-nerd interesting because it packages a hardware-protocol
      archaeology project: a modern C library and tools that encode knowledge about
      calculator file formats and serial/USB protocols that would otherwise live in
      scattered hobbyist utilities.
  project-history:
    - >
      The official README describes Cahute as communication and file-format handling
      tools for CASIO calculators and states that the GitLab project is the main
      repository for issues, release notes, merge requests, and collaboration. The
      public GitLab project was created in 2024 and the first visible tags run from 0.1
      through 0.6 during that year.
    - >
      Cahute's documentation is unusually broad for a niche hardware tool: it includes
      installation and build guides, command references for CaS, p7, p7os, p7screen, and
      xfer9860, file-format notes, USB detection, and protocol documentation for several
      generations of CASIO calculator protocols.
  related-projects:
    - The documented tools include CaS, p7, p7os, p7screen, and xfer9860.
    - >
      The documentation covers CASIOLINK, Protocol 7.00, USB Mass Storage, and other
      CASIO calculator protocols and file formats.
  sources:
    - https://cahute.org/
    - https://cahute.org/cli/cas.html
    - https://cahute.org/topics/file-formats/casrc.html
    - https://gitlab.com/api/v4/projects/cahute%2Fcahute
    - https://gitlab.com/api/v4/projects/cahute%2Fcahute/repository/tags
    - https://gitlab.com/cahute/cahute
    - https://gitlab.com/cahute/cahute/-/raw/develop/README.rst
  summary:
    - >
      Cahute is a library and command-line toolkit for CASIO calculator communication
      protocols and file formats, covering serial and USB devices from the 1990s through
      modern models.
  timeline:
    - '2024: GitLab project created for Cahute.'
    - '2024: 0.1 tag published in March.'
    - '2024: 0.6 tag published in December.'
    - 'Present: Homebrew distributes Cahute as a CLI package.'
  usage:
    - >
      Users invoke the included CLIs to convert or inspect calculator files, communicate
      with calculators, transfer data, work with operating-system images or screen
      streaming, and configure CaS through casrc. On POSIX systems the documented casrc
      locations are ~/.casrc and a system file such as /etc/system.casrc.
related-packages: []
