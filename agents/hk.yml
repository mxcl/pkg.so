id: brew:hk
display-name: hk
repo: null
docs:
  - https://hk.jdx.dev/
  - https://hk.jdx.dev/configuration
config-file-location:
  unix:
    - hk.local.pkl
    - .config/hk.local.pkl
    - hk.pkl
    - .config/hk.pkl
    - ~/.config/hk/config.pkl
credentials-file-location: null
history:
  adoption-history:
    - >
      hk is a young tool in the git-hook manager space. The GitHub repository was
      created in January 2025, early GitHub releases began in March 2025, and the
      documentation quickly oriented around global Git hook installation, per-project
      hk.pkl files, and integration with mise-en-place.
    - >
      The input package facts show packaging through Homebrew, MacPorts, and Scoop,
      which is a practical footprint for a developer CLI aimed at local workstations
      rather than servers.
  package-nerd-significance:
    - >
      hk matters to package nerds because it is part of the newer wave of developer
      workflow CLIs that try to make local checks fast enough to keep enabled. Its
      differentiator is not another hook file format by itself, but the combination of
      Pkl configuration, built-in linter definitions, libgit2 usage, mise integration,
      and locking around file modification.
    - >
      It also reflects a packaging trend: single-purpose Rust CLIs distributed through
      Homebrew, Scoop, MacPorts, and direct release binaries for developers who want one
      binary in their path.
  project-history:
    - >
      The official README describes hk as a git hook manager and project linting tool
      with an emphasis on performance. Its About page explains the motivation: git hooks
      need to be fast or developers stop using them, and naive parallel execution can
      break when multiple formatters or linters modify the same files.
    - >
      hk's configuration model uses Apple's Pkl language through hk.pkl files. The
      configuration documentation describes layered sources, including built-in
      defaults, user-level hkrc, project config, Git config, environment variables, and
      CLI flags.
  related-projects:
    - >
      mise-en-place: jdx's environment/tool-version manager that hk documentation names
      as an integration point.
    - >
      pre-commit, lefthook, Husky, lint-staged: adjacent git-hook and lint-running tools
      in the same developer workflow category.
    - "Pkl: Apple's configuration language used for hk.pkl."
  sources:
    - https://api.github.com/repos/jdx/hk
    - https://hk.jdx.dev/about.html
    - https://hk.jdx.dev/configuration
    - https://hk.jdx.dev/getting_started
    - https://raw.githubusercontent.com/jdx/hk/main/README.md
    - 'input: source_facts.package-manager'
  summary:
    - >
      hk is a Rust git-hook manager and project lint runner by jdx, designed around fast
      hook execution, tighter linter integration, and safe parallelism through
      read/write file locking.
  timeline:
    - '2025-01-26: The jdx/hk GitHub repository was created.'
    - '2025-03-29: Early v0.6.x GitHub releases were published.'
    - '2025: hk documentation described global Git hook installation and hk.pkl project setup.'
    - >
      2026: hk documentation described pklr as the built-in Pkl evaluator and layered
      configuration sources.
  usage:
    - >
      The intended workflow is to install hooks globally or per repository, run hk init
      to create hk.pkl, and then let Git events run configured lint and fix steps. hk
      check and hk fix provide explicit command-line entry points for running checks
      outside Git hooks.
    - >
      The configuration docs emphasize precedence and local overrides: hk.local.pkl is
      for local changes that should not be committed, while ~/.config/hk/config.pkl can
      hold user-wide defaults.
related-packages:
  - id: brew:lefthook
    reason: >
      Lefthook is a direct Git-hook-manager alternative; hk's official benchmark
      highlights hk's file-locking model while documenting lefthook's parallel read-only
      groups and sequential fixers.
    rel: alternative
    sources:
      - https://hk.jdx.dev/benchmarks
      - https://hk.jdx.dev/migrate-lefthook.html
      - https://github.com/evilmartians/lefthook#readme
  - id: brew:pre-commit
    reason: >
      pre-commit is the established framework-oriented alternative, while hk emphasizes
      concurrent steps, integrated fixes, and automatic staging.
    rel: alternative
    sources:
      - https://hk.jdx.dev/benchmarks
      - https://pre-commit.com/
  - id: brew:mise
    reason: >
      mise can install hk and its project tools, launch Git hooks in the correct
      environment, and expose mise tasks as hk steps.
    rel: adjacent_workflow
    sources:
      - https://hk.jdx.dev/mise_integration.html
      - https://mise.jdx.dev/
