history:
  adoption-history:
    - >
      XnConvert is distributed for Windows, macOS, and Linux and is offered free for
      private, educational, and nonprofit use, with a commercial license required for
      company use. Its cross-platform GUI makes XnSoft's batch-processing engine
      accessible without scripting.
  package-nerd-significance:
    - >
      XnConvert is useful in package catalogs as the graphical counterpart to NConvert:
      it exposes a mature, format-heavy image conversion engine through repeatable
      presets and can export workflows for command-line use. It also occupies the
      practical middle ground between one-file editors and scripted media pipelines.
  project-history:
    - >
      XnConvert was developed by XnSoft as a standalone, cross-platform form of the
      batch-conversion facilities associated with the XnView family. It shares the
      ecosystem's broad format support while concentrating on repeatable bulk operations
      rather than image browsing.
    - >
      The application has grown into a specialized batch processor supporting more than
      500 readable formats, roughly 70 output formats, and over 80 chainable operations.
      Current releases are distributed for Windows, macOS, and Linux.
  related-projects:
    - >
      NConvert is XnSoft's command-line batch image processor and the
      automation-oriented counterpart to XnConvert.
    - >
      XnView MP is XnSoft's cross-platform image viewer and organizer with built-in
      batch features.
    - XnResize is a narrower batch-resizing application in the same product family.
  sources:
    - https://www.xnview.com/en/apps/
    - https://www.xnview.com/en/how-to-batch-convert-and-batch-process/
    - https://www.xnview.com/en/nconvert/
    - https://www.xnview.com/en/xnconvert/
  summary:
    - >
      XnConvert is XnSoft's cross-platform graphical batch image converter. It applies
      reusable chains of conversion, resizing, metadata, adjustment, filter, watermark,
      and other operations to collections of images.
  timeline:
    - "2019-01-24: XnSoft's official archive lists the cross-platform XnConvert 1.78 release."
    - '2026-08: XnSoft distributes XnConvert 1.115.0 for Windows, macOS, and Linux.'
  usage:
    - >
      Users add files or folders, arrange processing steps under Actions, choose output
      naming, location, format, and quality, and then run the batch. Presets allow the
      same workflow to be reused, while watch folders can automatically process new or
      updated images.
    - >
      Typical jobs include resizing photo collections, converting formats, adding
      watermarks or text, adjusting color, editing or removing metadata, renaming
      outputs, and exporting a workflow to NConvert for command-line use.
