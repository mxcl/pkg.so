history:
  adoption-history:
    - >
      Hexler says TouchOSC Mk1 and its free Editor and Bridge tools are used daily by
      thousands of creators and makers in studios, live shows, clubs, workshops, and
      galleries.
  package-nerd-significance:
    - >
      TouchOSC Editor is a recognizable example of a desktop companion tool packaged
      separately from its mobile application. It matters to package-manager users
      maintaining older audiovisual workflows because the editor remains necessary for
      authoring the legacy layout files used by TouchOSC Mk1.
  project-history:
    - >
      TouchOSC debuted in 2008 as a customizable touchscreen control surface for OSC and
      MIDI. TouchOSC Editor became the desktop authoring tool for creating and modifying
      its layouts on macOS, Windows, and Linux.
    - >
      When Hexler launched the next-generation TouchOSC in 2021, it retained the
      original product as TouchOSC Mk1. The legacy editor remains part of that
      maintained ecosystem, although Hexler says Mk1 will receive no new features.
  related-projects:
    - TouchOSC Mk1
    - TouchOSC Bridge
    - TouchOSC
  sources:
    - https://hexler.net/touchosc-mk1
    - https://hexler.net/touchosc-mk1/manual/introduction
    - https://hexler.net/touchosc-mk1/releases
    - https://hexler.net/touchosc-the-next-generation
  summary:
    - >
      TouchOSC Editor is Hexler's free desktop layout-authoring companion for TouchOSC
      Mk1, the original customizable OSC and MIDI touch-control application.
  timeline:
    - '2008: The original TouchOSC debuted.'
    - >
      2021: The original product was renamed TouchOSC Mk1 after the next-generation
      TouchOSC launched.
  usage:
    - >
      Users visually assemble pages and controls, assign OSC or MIDI behavior, and
      transfer the resulting layouts to TouchOSC Mk1 devices. It is primarily
      encountered in music-production, live-performance, installation, and
      creative-coding setups.
