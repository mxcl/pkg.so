config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its useful audience was deliberately narrow: Bob users running macOS 15.0, 15.1,
      or the first 15.2 beta. The official guide says later systems do not need it
      because Apple corrected the operating-system behavior.
  package-nerd-significance:
    - >
      BobHelper is a good example of a narrowly scoped compatibility cask: a separately
      shipped helper existed to work around an operating-system regression and became
      largely unnecessary after the upstream platform fix.
  project-history:
    - >
      BobHelper was released as a separate macOS application because App Store
      restrictions prevented its functionality from being bundled with Bob. Its sole
      original purpose was restoring Bob's Option-plus-letter shortcuts under affected
      macOS 15 Sequoia releases.
  related-projects:
    - Bob is the translation and OCR application assisted by BobHelper.
    - >
      Alfred workflows and Raycast extensions were alternative workarounds mentioned by
      the official guide.
  sources:
    - 'Official BobHelper guide: https://bobtranslate.com/guide/advance/bobhelper.html'
  summary:
    - >
      BobHelper is an auxiliary application for the Bob translation and OCR utility. It
      worked around a macOS 15 Sequoia restriction that interfered with Bob's common
      Option-plus-letter keyboard shortcuts.
  timeline:
    - '2024: BobHelper was documented as a workaround for affected macOS 15 Sequoia versions.'
    - >
      2024-12-14: The guide reported that Apple had fixed the shortcut problem in macOS
      15.2 Beta 2.
  usage:
    - >
      After installing BobHelper, users install its communication script from Bob's
      Preferences > Feature Enhancement page and approve the requested permissions. Bob
      1.11.0 or later is required. The official guide advises that macOS 15.2 and later
      no longer require the helper.
