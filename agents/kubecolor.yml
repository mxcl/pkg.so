config-file-location:
  unix:
    - ~/.kube/color.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      kubecolor's adoption follows a terminal-tool route: users alias kubectl to
      kubecolor, or use the KUBECTL_COMMAND environment variable to wrap compatible
      commands such as oc. Its official site presents it as compatible with any kubectl
      version because it delegates command execution to kubectl.
  package-nerd-significance:
    - >
      kubecolor is the package-manager version of a shell customization: small,
      optional, and immediately visible. It is the kind of tool that spreads through
      dotfiles, Homebrew installs, and team recommendations because it improves the
      default Kubernetes CLI experience without changing Kubernetes itself.
    - >
      Its package interest also comes from restraint. Instead of building a replacement
      client, it composes with kubectl, which keeps the binary easy to reason about and
      easy to remove if a workflow needs plain output.
  project-history:
    - >
      The kubecolor/kubecolor repository was created on 2022-09-23, and the first GitHub
      release in that repository's releases feed, v0.0.21, was published on 2022-09-28.
      The README states that this project is a heavily modified version of the original
      kubecolor archived at hidetatz/kubecolor.
    - >
      The project grew from a simple colorizing wrapper into a maintained CLI with
      documentation, custom themes, autocompletion, dynamic TTY detection, and
      colorblind-adjusted themes.
  related-projects:
    - kubectl is the command kubecolor wraps.
    - hidetatz/kubecolor is the archived original project named by the README.
    - OpenShift's oc command can be wrapped through KUBECTL_COMMAND according to the README.
    - kubecolor.github.io hosts the project documentation.
  sources:
    - https://api.github.com/repos/kubecolor/kubecolor
    - https://api.github.com/repos/kubecolor/kubecolor/releases
    - https://formulae.brew.sh/formula/kubecolor
    - https://github.com/hidetatz/kubecolor
    - https://github.com/kubecolor/kubecolor
    - https://kubecolor.github.io/
    - https://kubecolor.github.io/usage/getting-started
  summary:
    - >
      kubecolor is a kubectl wrapper that runs kubectl and colorizes its output. Its aim
      is intentionally narrow: make common Kubernetes terminal output easier to scan
      while preserving kubectl's command shape.
  timeline:
    - '2022-09-23: kubecolor/kubecolor GitHub repository created.'
    - '2022-09-28: GitHub release v0.0.21 published.'
    - '2023-12-15: GitHub release v0.1.0 published.'
    - '2026-04-12: GitHub release v0.6.0 published.'
  usage:
    - >
      A common setup is alias kubectl="kubecolor", after which ordinary kubectl commands
      produce colorized output. The tool detects non-interactive output and can leave
      plaintext for scripts and pipes, avoiding a common failure mode for terminal color
      wrappers.
    - >
      Because kubecolor is a visual wrapper rather than a Kubernetes API client, it does
      not manage configuration or credentials itself; it depends on kubectl and the
      user's existing kubeconfig setup.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      kubecolor wraps the kubectl executable supplied by kubernetes-cli, adding
      interactive colorization while leaving Kubernetes communication and authentication
      to kubectl.
    rel: adjacent_workflow
    sources:
      - https://kubecolor.github.io/
      - https://kubecolor.github.io/usage/getting-started/
      - https://kubernetes.io/docs/reference/kubectl/
