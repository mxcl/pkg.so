config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LibreOffice's own timeline records Apple Keynote import filters in LibreOffice 4.2
      in 2014, the same year the Document Liberation Project was announced. The Document
      Liberation Project about page says its import libraries were used by projects
      including LibreOffice, Calligra, AbiWord, Inkscape, and Scribus.
  package-nerd-significance:
    - >
      For package maintainers, libetonyek is one of the classic Document Liberation
      Project libraries: C++, MPL-licensed, wired into office-suite import stacks, and
      built around librevenge-style document conversion APIs. It is the sort of
      dependency that quietly makes proprietary office archives readable on Unix
      systems.
  project-history:
    - >
      libetonyek grew out of LibreOffice and Document Liberation Project work on
      proprietary office formats. The Document Liberation Project describes its
      formation in April 2014 after LibreOffice developers and format specialists had
      built a family of reusable import libraries for formats such as Visio, Publisher,
      CorelDraw, Apple Keynote, and older Macintosh formats.
    - >
      The libetonyek README describes the library as reverse-engineering heavy: official
      Apple documentation for Keynote was limited, so much of the implementation was
      inferred from sample presentations and real-world documents.
  related-projects:
    - >
      libetonyek belongs with the Document Liberation Project family of import libraries
      and depends on related document-conversion infrastructure such as librevenge,
      libxml2, libmdds, liblangtag, Boost, and GLM.
  sources:
    - https://github.com/LibreOffice/libetonyek
    - https://github.com/LibreOffice/libetonyek/tags
    - https://wiki.documentfoundation.org/DLP/Libraries/libetonyek
    - https://www.documentliberation.org/about/
    - https://www.libreoffice.org/libreoffice-timeline/
  summary:
    - >
      libetonyek is a Document Liberation Project library and set of conversion tools
      for Apple iWork formats, especially Keynote, Pages, and Numbers files.
  timeline:
    - '2013: The libetonyek-0.0.0 tag was dated October 30, 2013 on the GitHub mirror.'
    - '2014: The libetonyek-0.1.0 tag was dated May 23, 2014 on the GitHub mirror.'
    - >
      2015: The libetonyek-0.1.2 tag message noted initial Pages and Numbers support on
      May 19, 2015.
    - '2015: The libetonyek-0.1.4 tag message noted support for Keynote 6 on November 17, 2015.'
    - '2021: The libetonyek-0.1.10 tag was dated May 18, 2021.'
    - '2025: The libetonyek-0.1.13 tag was dated September 22, 2025.'
  usage:
    - >
      The package ships CLI tools for extracting raw, text, XHTML/HTML, or CSV-like
      representations from Keynote, Pages, and Numbers files. Upstream documents support
      for Keynote 2-6, Pages 1-4, and Numbers 1-2.
related-packages:
  - id: brew:writerperfect
    reason: >
      Use writerperfect with libetonyek when Apple Keynote input must be converted
      headlessly to an OpenDocument output through the documented librevenge and
      libodfgen pipeline.
    rel: adjacent_workflow
    sources:
      - https://sourceforge.net/p/libwpd/wiki/writerperfect/
      - https://www.documentliberation.org/projects/
