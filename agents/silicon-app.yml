history:
  adoption-history:
    - >
      Silicon was published as an open-source Mac utility by DigiDNA during the
      transition from Intel processors to Apple silicon. The input records its
      availability through Homebrew Cask.
  package-nerd-significance:
    - >
      Silicon addresses a package-maintenance question created by Apple's architecture
      transition: which installed applications still require Intel compatibility
      support.
    - >
      It is useful when auditing a Mac before migration, identifying legacy software, or
      tracking progress toward an entirely arm64-native application set.
  project-history:
    - >
      DigiDNA created Silicon as a small, open-source macOS application for identifying
      Intel-only applications.
    - >
      The project is implemented as a native Xcode application and released under the
      MIT License.
  related-projects:
    - Rosetta 2, Apple's translation environment for Intel applications on Apple silicon.
    - >
      iMazing, a DigiDNA product identified through the repository owner's official
      company information.
    - macOS command-line architecture-inspection tools such as file and lipo.
  sources:
    - 'Official repository and README: https://github.com/DigiDNA/Silicon'
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      Silicon is DigiDNA's open-source macOS utility for finding applications that
      contain only Intel code.
  timeline:
    - '2020: DigiDNA published Silicon during the transition to Apple-silicon Macs.'
    - >
      Apple-silicon transition era: Homebrew Cask made the utility available through
      command-line package management.
  usage:
    - Users run Silicon to audit Mac applications and identify software that is Intel-only.
    - >
      The results help determine which applications may depend on Rosetta 2 and which
      applications should be upgraded or replaced with Apple-silicon-native builds.
