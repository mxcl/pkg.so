id: brew:gping
display-name: gping
repo: null
docs:
  - https://github.com/orf/gping#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Homebrew, MacPorts, Scoop, Chocolatey,
      Fedora COPR, Cargo, Arch, Alpine, Debian/Ubuntu, FreeBSD, Docker, Flox, and gah.
      The input package-manager map also records coverage across apk, brew, Chocolatey,
      Debian, MacPorts, Nix, pacman, Scoop, Ubuntu, winget, and zypper.
    - >
      Homebrew packages gping as a Rust-built formula with binary bottle support for
      macOS and Linux, which is a strong fit for a tool whose value is immediate
      command-line ergonomics rather than a service or daemon.
  package-nerd-significance:
    - >
      gping is the kind of package that travels well across package managers: one
      obvious executable name, a compact Rust binary, no background service, and
      immediate terminal-visible payoff. It is also a good example of the modern 'better
      Unix tool' pattern where an old primitive is kept but made more observable.
    - >
      For maintainers, it is a network utility with platform-sensitive behavior, so
      package metadata tends to expose conflicts and platform packaging details even
      though the user-facing command is simple.
  project-history:
    - >
      The public project lives at orf/gping on GitHub and is organized as a Rust CLI
      with a manual page and a companion pinger component. Its repository page describes
      an active command-line tool with hundreds of commits and dozens of release
      artifacts.
    - >
      The 2024 tag history shows separate gping and pinger release tags, indicating that
      the project evolved from a single end-user command into a small Rust workspace
      where the lower-level ping implementation can move alongside the CLI.
  related-projects:
    - ping and inetutils provide the classic baseline that gping visually extends.
    - >
      The repository's pinger component is related as the lower-level ping
      implementation used alongside the CLI.
    - >
      Terminal graphing and monitoring tools such as watch-style CLIs occupy the same
      package-manager niche, but gping stays narrowly focused on latency and command
      timing.
  sources:
    - https://formulae.brew.sh/formula/gping
    - https://github.com/orf/gping
    - https://github.com/orf/gping/tags
  summary:
    - >
      gping is a Rust terminal network utility that keeps the familiar mental model of
      ping but adds an inline graph of response times. Its README positions it as 'Ping,
      but with a graph' and documents use with one or more hosts, command timing through
      --cmd, color choices, and support across Windows, macOS, and Linux.
    - >
      The project matters in package-manager culture because it is a small, memorable
      CLI replacement that turns a plain diagnostic stream into a visual terminal
      display without asking users to leave the shell.
  timeline:
    - >
      2024: GitHub tags show coordinated gping and pinger releases, including
      gping-v1.17.x and pinger-v1.2.x.
    - '2024: gping-v1.19.0 and pinger-v2.0.0 were tagged on Dec 18, 2024.'
    - >
      2026: GitHub release metadata on the repository page listed gping-v1.20.4 dated
      Jun 24, 2026.
  usage:
    - >
      The common workflow is to run gping with a host or list of hosts and watch latency
      over time in the terminal. The README also documents --cmd for graphing command
      execution time, cloud shorthand targets such as AWS regions, adjustable watch
      intervals, graph buffer length, address-family forcing, interface selection,
      simple graphics, and named or hex colors.
    - >
      Because it stays close to ping, gping is often useful for live troubleshooting:
      comparing hosts, watching intermittent latency, or leaving a terminal graph
      visible while changing networks or testing a remote endpoint.
related-packages:
  - id: brew:prettyping
    reason: >
      Choose prettyping when you want a lightweight Bash-and-awk wrapper around the
      system ping command rather than gping's standalone Rust implementation.
    rel: alternative
    sources:
      - https://github.com/orf/gping#readme
      - https://denilsonsa.github.io/prettyping/
  - id: brew:trippy
    reason: >
      Choose Trippy when you need a polished TUI that combines continuous latency
      measurement with traceroute-style hop analysis.
    rel: alternative
    sources:
      - https://github.com/orf/gping#readme
      - https://trippy.rs/
  - id: brew:mtr
    reason: >
      Choose mtr when diagnosing packet loss and latency at every hop along a route is
      more important than gping's endpoint-focused graph.
    rel: alternative
    sources:
      - https://github.com/orf/gping#readme
      - https://www.bitwizard.nl/mtr/
      - https://github.com/traviscross/mtr#readme
