history:
  adoption-history:
    - >
      Kubeshark fits into the Kubernetes observability niche for teams that need
      packet-level or protocol-level visibility without changing application code. The
      package-manager angle is important because the CLI drives local workflows such as
      tapping traffic, cleaning deployments, connecting MCP clients, and installing the
      Helm chart.
  package-nerd-significance:
    - >
      Kubeshark is notable because it packages a cluster-resident observability system
      behind a developer-friendly CLI. It also bridges traditional packet-analysis
      workflows with Kubernetes metadata and newer MCP-based AI-agent workflows.
  project-history:
    - >
      Kubeshark's repository describes a tool that captures and indexes network traffic
      at the kernel level, exposes filtered PCAP downloads, visual dashboards, TLS and
      mTLS visibility, protocol parsing, and MCP access for AI-driven incident response.
      Its documentation packages the product around Helm deployment plus a CLI installed
      through Homebrew or downloaded from GitHub releases.
    - >
      The late-2025 and 2026 release notes show an active transition into a V2
      architecture: v52.11.0 on December 16, 2025 described the first release in
      preparation for V2.00 and a backend refactor, while v53.3.0 on May 19, 2026
      highlighted TLSX dissector behavior, authorization refactoring, L7 data
      boundaries, snapshots, and AI skills.
  related-projects:
    - >
      Related projects and concepts include Kubernetes, Helm, eBPF, Wireshark, tcpdump,
      PCAP tooling, KFL, and Model Context Protocol integrations.
  sources:
    - https://docs.kubeshark.com/en/install
    - https://github.com/kubeshark/kubeshark
    - https://github.com/kubeshark/kubeshark/releases
  summary:
    - >
      Kubeshark is a Kubernetes network observability tool that indexes cluster-wide
      traffic with Kubernetes, API, and network context. The project presents itself as
      eBPF-powered observability for SREs and AI agents.
  timeline:
    - >
      2025: v52.11.0 was released on December 16 as the first release preparing for
      V2.00 and introduced a refactored backend path.
    - >
      2026: v52.11.7 was released on January 15 with a complementary license for
      clusters up to 100 nodes.
    - >
      2026: v53.3.0 was released on May 19 with TLSX enabled by default, authorization
      changes, L7 data boundaries, snapshot filters, and AI skills.
  usage:
    - >
      Users install Kubeshark with Helm or Homebrew, port-forward the frontend service,
      and query live or retained traffic through the dashboard, KFL filters, PCAP
      exports, APIs, or MCP integrations.
related-packages:
  - id: brew:wireshark
    reason: >
      Choose Wireshark for general desktop packet capture and deep protocol analysis;
      choose Kubeshark when capture, filtering, and endpoint identity must be
      Kubernetes-aware.
    rel: alternative
    sources:
      - https://www.wireshark.org/docs/
      - https://github.com/kubeshark/kubeshark
  - id: brew:helm
    reason: >
      Helm is Kubeshark's officially recommended cluster installation method and is also
      used to uninstall the deployed components after an investigation.
    rel: adjacent_workflow
    sources:
      - https://docs.kubeshark.com/en/install
      - https://helm.sh/docs/
