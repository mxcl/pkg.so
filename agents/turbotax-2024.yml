history:
  adoption-history:
    - >
      TurboTax developed into an annually issued family of consumer tax-preparation
      products spanning desktop and online workflows. The year-specific desktop editions
      remain useful for preparing, printing, and electronically filing returns for their
      designated tax year.
  package-nerd-significance:
    - >
      TurboTax 2024 illustrates an unusual desktop-packaging lifecycle: it is
      proprietary software whose identity and practical usefulness are tied to a single
      tax year rather than an evergreen application that users simply keep upgrading in
      place.
  project-history:
    - >
      TurboTax originated with ChipSoft and became an Intuit product when Intuit
      completed its acquisition of ChipSoft in December 1993. Intuit has continued to
      issue tax-year-specific TurboTax products, including a separately downloadable
      desktop edition for tax year 2024.
  related-projects:
    - >
      TurboTax Online provides a browser-based counterpart to the desktop application.
      Intuit's desktop tax line includes several editions aimed at different return
      complexity levels, while the Mac application excludes the Windows-only Business
      product.
  sources:
    - >
      https://investors.intuit.com/sec-filings/all-sec-filings/content/0000891618-96-002383/0000891618-96-002383.pdf
    - >
      https://ttlc.intuit.com/turbotax-support/en-us/help-article/product-system-requirements/minimum-system-requirements-turbotax-mac-software/L5ar0Busw_US_en_US
    - https://turbotax.intuit.com/personal-taxes/cd-download/install-turbotax/
  summary:
    - >
      TurboTax 2024 is Intuit's proprietary desktop application for preparing and filing
      tax-year-2024 returns.
  timeline:
    - 'December 1993: Intuit completed its acquisition of TurboTax developer ChipSoft.'
    - '2024: Intuit issued the tax-year-2024 generation of TurboTax Desktop.'
    - '2025: The 2024 edition served its principal filing season for tax-year-2024 returns.'
  usage:
    - >
      Users download and install the appropriate desktop edition, sign in with an Intuit
      Account, activate it with a license code, prepare a return, run validation checks,
      and either file electronically or print the result. Internet access is required
      for installation, activation, updates, and optional online features.
