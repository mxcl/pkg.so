history:
  adoption-history:
    - >
      Micro Snitch has remained a commercial macOS utility distributed both directly by
      Objective Development and through the Mac App Store. The direct edition supports a
      license key and its own updater, while the App Store manages those functions for
      its edition.
    - >
      Successive releases tracked macOS platform changes including El Capitan, Mojave
      dark mode, Apple Silicon, Monterey, and Ventura.
  package-nerd-significance:
    - >
      Micro Snitch represents the polished proprietary menu-bar utility tradition in the
      macOS package ecosystem. Its direct-download and App Store variants also
      illustrate how licensing and update behavior can differ while application
      functionality remains essentially the same.
  project-history:
    - >
      Objective Development released Micro Snitch 1.0 in June 2015 as a lightweight
      background monitor for microphone and camera activity.
    - >
      The project evolved through notification, accessibility, localization, dark-mode,
      Apple Silicon, and newer-macOS compatibility work while retaining its focused
      monitoring role.
  related-projects:
    - >
      Objective Development also develops Little Snitch, a network-connection monitor
      and firewall utility.
  sources:
    - 'Official help center: https://www.obdev.at/support/microsnitch'
    - 'Official product page: https://www.obdev.at/products/microsnitch/index.html'
    - 'Official release notes: https://www.obdev.at/products/microsnitch/releasenotes.html'
  summary:
    - >
      Micro Snitch is a lightweight macOS menu-bar application that reports microphone
      and camera use, displays an overlay during activity, and records changes for later
      review.
  timeline:
    - '2015: Micro Snitch 1.0 was released.'
    - '2015: Version 1.1 added device-activity notifications and accessibility improvements.'
    - '2018: Version 1.3 added support for macOS Mojave dark mode.'
    - >
      2021: Version 1.5 restored FaceTime-camera detection on Apple Silicon Macs running
      Monterey.
    - >
      2023: Version 1.6.1 updated terminology for newer macOS releases and fixed a
      USB-hub-related crash.
  usage:
    - >
      Micro Snitch runs in the background and exposes current device activity through a
      menu-bar icon. It can show an overlay, issue notifications, and retain an activity
      log for review.
    - >
      The application reports device activity but macOS interfaces do not always let it
      identify the particular application using a microphone or camera. Certain
      third-party or combined input/output devices may also be unsupported.
    - >
      Direct-download builds accept a purchased license key in the application's
      Settings interface. The official help material does not document a
      credentials-file location.
