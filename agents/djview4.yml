history:
  adoption-history:
    - >
      DjVuLibre's site presents DjVu as a web-centric document and image distribution
      format used by academic, commercial, governmental, and non-commercial sites, and
      describes DjVuLibre as the GPL implementation containing viewers, plugins,
      decoders, encoders, and utilities. DjView4's adoption follows that
      document-viewing niche: it is useful when archives, scanned books, or older web
      collections are distributed as DjVu rather than PDF.
    - >
      Package-manager adoption persists because DjView4 is the practical desktop viewer
      for a legacy but still-present document format. The official DjView4 page points
      to binary packaging through Fedora/Redhat, openSUSE, Debian, Ubuntu, Windows
      SourceForge downloads, and Mac OS SourceForge downloads.
  package-nerd-significance:
    - >
      DjView4 is package-nerd significant as a survivor from the era when browser
      plugins, scanned-document compression, and Unix desktop viewers overlapped. It
      keeps DjVu readable from modern package managers even as the format is no longer
      mainstream, and it separates the viewer from the broader DjVuLibre encoder/utility
      suite.
  project-history:
    - >
      The DjVuLibre site says DjVu began at AT&T Labs-Research in 1996 and that
      DjVuLibre came from a cleaned-up GPL code base after LizardTech acquired the
      technology and released reference-library code. DjView4 appears in that lineage as
      a newer portable viewer distributed separately from the main DjVuLibre package.
    - >
      The official DjView4 page describes it as a new portable DjVu viewer and browser
      plugin, entirely based on the public DjVuLibre API and written in portable Qt4 for
      Qt/X11, Qt/Mac, and Qt/Windows. The page lists version 4.12 with a 2020-11-20
      release date.
  related-projects:
    - >
      Related tools include DjVuLibre's command-line utilities such as ddjvu, djvused,
      djvutxt, and djvudump; JavaDjVu for Java viewing; GSDjVu for Ghostscript-based
      conversion; and PDF viewers and converters used in adjacent scanned-document
      workflows.
  sources:
    - https://djvu.sourceforge.net/djview4.html
    - https://djvu.sourceforge.net/index.html
    - https://djvu.sourceforge.net/credits.html
    - https://djvu.sourceforge.net/doc/index.html
    - https://djvu.sourceforge.net/doc/man/djview4.html
    - https://sourceforge.net/p/djvu/djview-git/ci/master/tree
  summary:
    - >
      DjView4 is the portable Qt4 DjVu viewer and browser-plugin component associated
      with DjVuLibre. It opens DjVu documents as a desktop viewer while supporting
      document navigation, zooming, thumbnails, outlines, hidden-text search, printing,
      and command-line URL/options handling.
  timeline:
    - '1996: DjVu project started at AT&T Labs-Research.'
    - >
      1999: AT&T released version 2.0 of the DjVu Reference Library under an open source
      license.
    - >
      2000: LizardTech acquired DjVu technology from AT&T and released reference-library
      code under the GPL.
    - >
      2001-10-11: Official djview4 man page carries an update date in the DjVuLibre
      documentation.
    - '2020-11-20: DjView4 4.12 released, as listed by the official DjView4 page.'
  usage:
    - >
      Users run `djview4 file.djvu` or open local and remote DjVu URLs. The official man
      page notes standalone viewing, browser-plugin slave-process behavior, command-line
      options, multi-page display, hidden-text search, thumbnail display, bundled or
      indirect multi-page saving, and export or print workflows.
related-packages:
  - id: brew:djvulibre
    reason: >
      DjView4 is built on the public DjVuLibre API and requires DjVuLibre, whose package
      also supplies the command-line encoders, decoders, and document utilities used
      around the viewer.
    rel: adjacent_workflow
    sources:
      - https://djvu.sourceforge.net/djview4.html
      - https://djvu.sourceforge.net/
  - id: brew:evince
    reason: >
      Choose Evince when you want one GNOME document viewer for DjVu, PDF, PostScript,
      DVI, XPS, and comic archives instead of a DjVu-focused viewer.
    rel: alternative
    sources:
      - https://djvu.sourceforge.net/djview4.html
      - https://help.gnome.org/users/evince/stable/formats.html
