id: brew:forgit
display-name: forgit
repo: null
docs:
  - https://github.com/wfxr/forgit#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      forgit's adoption follows the shell-plugin route: zplug, zgen, antigen, fisher,
      omf, zinit, oh-my-zsh, sheldon, Homebrew, AUR, and manual sourcing are all
      documented upstream.
    - >
      The GitHub releases page shows a regular date-based release stream in the 2020s,
      while the README advertises Homebrew installation and AUR packages maintained by
      the project's developers.
  package-nerd-significance:
    - >
      forgit is a compact example of how fzf turned Git porcelain into interactive
      terminal workflows without replacing Git itself.
    - >
      It is package-manager interesting because installation is mostly about shell
      integration paths, completions, aliases, and dependency versioning rather than a
      daemon or library ABI.
  project-history:
    - >
      The upstream README describes forgit as a lightweight utility for using git more
      efficiently, powered by fzf, and supports Bash, Zsh, and Fish.
    - >
      The license file records Wenxuan Zhang's copyright beginning in 2017, and the
      project has continued into date-based monthly-style releases such as 26.05.0.
  related-projects:
    - >
      forgit is built around Git and fzf, and its README links fzf as the required
      interactive selector.
    - >
      It is adjacent to shell plugin managers such as zplug, zgen, antigen, fisher, omf,
      zinit, oh-my-zsh, and sheldon because those are first-class installation paths.
  sources:
    - https://github.com/wfxr/forgit
    - https://github.com/wfxr/forgit/releases
    - https://raw.githubusercontent.com/wfxr/forgit/master/LICENSE
    - https://raw.githubusercontent.com/wfxr/forgit/master/README.md
    - https://raw.githubusercontent.com/wfxr/forgit/master/bin/git-forgit
  summary:
    - >
      forgit is a shell-oriented Git helper that wraps common Git workflows in
      interactive fzf pickers. It provides aliases and a git-forgit executable for
      staging, logs, diffs, branches, stashes, blame, worktrees, and related operations.
  timeline:
    - '2017: The license file records the start of the forgit copyright range.'
    - >
      2022: The tag list includes 22.11.0, showing the project on date-based releases by
      late 2022.
    - '2025: The release stream includes monthly 25.x releases.'
    - '2026: The GitHub releases page lists 26.05.0, published on May 1, 2026.'
  usage:
    - >
      Users source a shell plugin or put bin/git-forgit on PATH, then invoke aliases
      such as ga for interactive git add, glo for git log, gd for git diff, gss for
      stashes, and gwt for worktrees.
    - >
      forgit depends on fzf 0.60.0 or newer and can also be used as git forgit
      subcommands when git-forgit is available on PATH.
related-packages:
  - id: brew:fzf
    reason: >
      fzf is forgit's required fuzzy-selection engine and powers every interactive Git
      picker exposed by the shell plugin.
    rel: adjacent_workflow
    sources:
      - https://github.com/wfxr/forgit#installation
      - https://github.com/junegunn/fzf
  - id: brew:git
    reason: >
      forgit wraps Git commands and repository data, so Git remains the underlying
      version-control tool for every forgit workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/wfxr/forgit#usage
      - https://git-scm.com/docs
  - id: brew:lazygit
    reason: >
      Choose lazygit when you prefer a persistent full-screen Git TUI; choose forgit
      when you want lightweight shell aliases and task-specific fzf pickers.
    rel: alternative
    sources:
      - https://github.com/wfxr/forgit
      - https://github.com/jesseduffield/lazygit
tags:
  - cli
  - fzf
  - git
