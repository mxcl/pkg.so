id: brew:autorest
display-name: AutoRest
repo: https://github.com/Azure/autorest
docs:
  - https://github.com/Azure/autorest/blob/main/docs/generate/readme.md
  - https://github.com/Azure/autorest/blob/main/docs/user/configuration.md
  - >
    https://github.com/Azure/autorest/blob/main/docs/user/literate-file-formats/configuration.md
  - https://github.com/Azure/autorest#readme
config-file-location:
  unix:
    - ./readme.md
    - ./*.md
    - ./*.markdown
    - <config-file>.md
    - <config-file>.json
    - <config-file>.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      AutoRest adoption is strongly tied to Azure SDK generation and the
      azure-rest-api-specs repository. The official generation docs reference Azure SDK
      language repositories and management-plane generation, showing that AutoRest
      became infrastructure for large-scale, multi-language SDK production rather than
      just a standalone end-user CLI.
    - >
      The Homebrew input lists only a Homebrew package for this batch, but official
      GitHub metadata shows thousands of stars and hundreds of forks for Azure/autorest,
      consistent with a prominent role in Azure developer tooling.
  package-nerd-significance:
    - >
      AutoRest matters to package nerds because it is generator infrastructure at
      cloud-provider scale. It explains why SDK repositories can contain large generated
      surfaces, language-specific generator packages, pinned core versions, and
      readme.md files that are executable configuration rather than just documentation.
  project-history:
    - >
      The Azure/autorest repository was created in February 2015. Official repository
      metadata describes it as an OpenAPI, formerly Swagger, specification code
      generator supporting multiple languages.
    - >
      AutoRest evolved around a configuration-heavy model. The official docs emphasize
      command-line flags, YAML/JSON/Markdown configuration files, and literate readme.md
      files that combine human documentation with machine-readable generation settings.
  related-projects:
    - azure-rest-api-specs supplies many OpenAPI inputs used with AutoRest.
    - Azure SDK language repositories consume generated output from AutoRest workflows.
    - OpenAPI/Swagger is the specification family AutoRest reads.
  sources:
    - https://api.github.com/repos/Azure/autorest
    - https://github.com/Azure/autorest/blob/main/docs/generate/readme.md
    - https://github.com/Azure/autorest/blob/main/docs/user/configuration.md
    - >
      https://github.com/Azure/autorest/blob/main/docs/user/literate-file-formats/configuration.md
  summary:
    - >
      AutoRest is Microsoft's OpenAPI/Swagger code generation tool for producing client
      libraries and SDKs, especially around Azure. It turns OpenAPI descriptions plus
      configuration files into generated code for languages such as C#, Java, Python,
      TypeScript, Go, PowerShell, and others.
  timeline:
    - '2015: Azure/autorest GitHub repository created.'
    - '2010s: AutoRest becomes associated with Swagger/OpenAPI-based Azure SDK generation.'
    - >
      2020s: AutoRest docs emphasize multi-language generation, literate configuration,
      and Azure management-plane workflows.
  usage:
    - >
      Basic usage is autorest with an input OpenAPI file and a language flag, for
      example autorest --input-file=pets.json --python --output-folder=myFolder/. The
      preferred documented workflow moves those options into a configuration file and
      runs autorest readme.md.
    - >
      AutoRest supports YAML, JSON, and Markdown configuration. Markdown literate
      configuration is especially important: docs say readme.md can serve as both
      project documentation and the storage for generation settings, using code blocks
      and the magic string that identifies AutoRest configuration.
related-packages:
  - id: brew:openapi-generator
    reason: >
      Choose OpenAPI Generator for an actively maintained, vendor-neutral generator
      covering OpenAPI clients, server stubs, documentation, and many target ecosystems
      now that AutoRest is retired.
    rel: alternative
    sources:
      - https://github.com/Azure/autorest
      - https://openapi-generator.tech/docs/
      - https://github.com/OpenAPITools/openapi-generator
tags:
  - azure
  - cli
  - code-generation
  - openapi
  - sdk-generator
  - swagger
