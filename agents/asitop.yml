id: brew:asitop
display-name: asitop
repo: https://github.com/tlkh/asitop
docs:
  - https://github.com/tlkh/asitop#readme
  - https://tlkh.github.io/asitop
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      asitop spread as a small Apple Silicon utility rather than as a cross-platform
      monitoring suite. GitHub repository metadata shows several thousand stars, and
      Homebrew analytics report thousands of installs over the previous year, indicating
      continuing package-manager use among Mac developers and performance tinkerers.
  package-nerd-significance:
    - >
      For package-manager users, asitop is notable because it packages a niche macOS
      performance workflow into one CLI command. It sits in the same mental shelf as
      htop, nvtop, and powermetrics wrappers, but is tuned for Apple Silicon hardware
      counters rather than generic Unix process accounting.
  project-history:
    - >
      The GitHub repository was created in October 2021, shortly after Apple Silicon
      machines had become common enough for developers to want terminal-native CPU, GPU,
      memory, and power visibility. The README says the author wrote it because they
      could not find an equivalent tool online and were curious about the hardware
      counters.
    - >
      The project is deliberately macOS-specific. Its implementation relies on
      powermetrics, which requires elevated privileges, and the README documents
      limitations caused by Apple removing some memory bandwidth and package power data
      from powermetrics.
  related-projects:
    - >
      The README explicitly compares the project to nvtop and documents its reliance on
      Apple's powermetrics utility.
  sources:
    - https://api.github.com/repos/tlkh/asitop
    - https://formulae.brew.sh/api/formula/asitop.json
    - https://github.com/tlkh/asitop#readme
  summary:
    - >
      asitop is a Python command-line monitor for Apple Silicon Macs. Its upstream
      README describes it as an nvtop-inspired terminal tool for M1-era macOS systems,
      built around Apple's powermetrics plus psutil, sysctl, and system_profiler.
  timeline:
    - '2021: GitHub repository created for an Apple Silicon performance monitor.'
    - '2024: Repository metadata still shows recent maintenance activity.'
    - '2026: Homebrew API lists stable version 0.0.24 and recent install activity.'
  usage:
    - >
      The normal workflow is to install the package and run `sudo asitop` in a terminal.
      It presents CPU cluster, GPU, ANE, memory, swap, frequency, utilization, and power
      estimates in a terminal UI, with options for sampling interval, color, and rolling
      average.
related-packages:
  - id: brew:nvtop
    reason: >
      Choose NVTOP for htop-style per-process monitoring across many GPU and accelerator
      vendors, including Apple; choose asitop for Apple Silicon-specific CPU-cluster,
      frequency, neural-engine, and power telemetry.
    rel: alternative
    sources:
      - https://github.com/tlkh/asitop
      - https://github.com/Syllo/nvtop
