config-file-location:
  macos:
    - ~/Library/Preferences/com.libraw-llc.FastRawViewer.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      FastRawViewer is distributed for Windows and macOS and is aimed at photographers
      who want a dedicated ingest and culling stage before cataloging or editing their
      photographs.
  package-nerd-significance:
    - >
      The package is a useful example of Homebrew Cask managing a proprietary
      photography application. Its workflow also reflects a specialized distinction
      familiar to imaging enthusiasts: evaluating decoded sensor data instead of
      trusting the smaller JPEG preview embedded by the camera.
  project-history:
    - >
      LibRaw LLC began publicly testing FastRawViewer in 2014. The project was designed
      to read and process complete RAW files on the fly, emphasizing exposure analysis,
      focus inspection, ratings, and labels based on RAW data.
    - >
      The product subsequently developed separate 1.x and 2.x lines. Upstream ended
      support for the 1.x line in 2022 while retaining its licenses and downloads, and
      continued development with FastRawViewer 2.
  related-projects:
    - >
      FastRawViewer is closely associated with LibRaw, the RAW-decoding project
      maintained by the same organization. It commonly precedes cataloging and editing
      in applications such as Lightroom or Capture One, while exchanging ratings and
      labels through XMP metadata.
  sources:
    - https://updates.fastrawviewer.com/data/FastRawViewer2-Manual-ENG.pdf
    - https://www.fastrawviewer.com/
    - https://www.fastrawviewer.com/download
    - https://www.fastrawviewer.com/node/48
  summary:
    - >
      FastRawViewer is a proprietary RAW-image viewer and culling application from
      LibRaw LLC. It reads full RAW files and provides tools for exposure evaluation,
      focus checking, sorting, rating, and selecting photographs.
  timeline:
    - '2014: Public beta development and discussion were underway.'
    - >
      2022: Upstream support for FastRawViewer 1.x ended while the product continued
      with version 2.
  usage:
    - >
      Photographers use FastRawViewer to browse camera cards or directories, inspect
      focus and exposure, assign ratings or labels, and select or move files before
      importing them into a larger photo-management or editing workflow.
