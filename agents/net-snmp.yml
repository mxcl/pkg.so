  - https://www.net-snmp.org/dev/agent
config-file-location:
  unix:
    - snmp.conf
    - snmp.local.conf in Net-SNMP configuration directories
    - snmpd.conf
    - snmpd.local.conf in Net-SNMP configuration directories
    - ~/.snmp/snmp.conf
    - /var/net-snmp/snmpd.conf
credentials-file-location:
  unix:
    - ~/.snmp/snmp.conf
    - /var/net-snmp/snmpd.conf
history:
  adoption-history:
    - >
      Net-SNMP became infrastructure software because SNMP remained the common
      denominator for monitoring routers, servers, printers, UPS devices, and
      appliances. The official history says it was adopted by most Linux and BSD-based
      systems and ported to Windows and embedded systems.
    - >
      Homebrew analytics are high relative to the rest of this batch: the formula page
      showed 127,106 installs over 365 days and 10,635 installs on request, indicating
      it is often pulled in as a dependency as well as installed directly.
  package-nerd-significance:
    - >
      Net-SNMP is one of those packages whose value is not glamour but compatibility. It
      embodies decades of protocol edge cases, MIB parser behavior, OS-specific agent
      modules, and CLI conventions that monitoring stacks still assume.
  project-history:
    - >
      The project starts with CMU-SNMP in 1992, when Carnegie Mellon made an SNMP
      library, simple management commands, and an agent publicly available. Wes Hardaker
      extended that code at UC Davis, published it as ucd-snmp v3.0 in 1995, and opened
      it into a broader collaborative open source project.
    - >
      The IETF engaged Hardaker in 1998 to work on a reference implementation of SNMPv3.
      That work fed into ucd-snmp v4.0 in August 1999, adding SNMPv3 capability and
      early AgentX support. In late 2000 the project moved to SourceForge and changed
      its name to Net-SNMP; v5.0 followed in April 2002 with a restructured, more
      modular agent framework.
  related-projects:
    - CMU-SNMP
    - UCD-SNMP
    - AgentX
    - SMUX
    - MRTG
    - RRDtool
    - Nagios plugins
  sources:
    - https://formulae.brew.sh/formula/net-snmp
    - https://github.com/net-snmp/net-snmp
    - https://net-snmp.sourceforge.io/about/history.html
    - https://www.net-snmp.org/
    - https://www.net-snmp.org/docs/FAQ.html
  summary:
    - >
      Net-SNMP is the classic open source SNMP toolkit: command-line clients, an
      extensible `snmpd` agent, trap handling, MIB tools, and libraries for building
      SNMP-aware software.
  timeline:
    - '1992: CMU-SNMP origins at Carnegie Mellon University.'
    - '1995: UCD-SNMP v3.0 released publicly.'
    - '1998: IETF-sponsored SNMPv3 reference-implementation work begins.'
    - 'August 1999: ucd-snmp v4.0 released with SNMPv3 and early AgentX support.'
    - 'Late 2000: renamed Net-SNMP and moved to SourceForge.'
    - 'April 2002: net-snmp v5.0 released.'
  usage:
    - >
      Package users reach for `snmpwalk`, `snmpget`, `snmptable`, `snmptranslate`,
      `snmpset`, `snmptrap`, and `snmpd`. Typical work includes walking a device
      subtree, translating numeric OIDs through MIB files, testing SNMPv3 credentials,
      running a local agent, or debugging traps with `snmptrapd`.
    - >
      The package is keg-only in Homebrew, which matters for users expecting system SNMP
      tools. On macOS it often gets installed because another build needs Net-SNMP
      headers/libraries, or because an operator wants modern upstream tools instead of
      vendor-provided ones.
related-packages:
