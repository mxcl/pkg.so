history:
  adoption-history:
    - >
      The Mac edition is distributed as a commercial application and integrates with
      established video players rather than replacing the entire playback stack.
      Official installation guidance recommends Homebrew for its mpv and VapourSynth
      dependencies on supported macOS releases.
  package-nerd-significance:
    - >
      SVP is notable for assembling a motion-interpolation pipeline from a controller
      application, player integration, VapourSynth, and SVPflow components. Its
      packaging therefore crosses application-bundle, multimedia-framework, and
      package-manager boundaries.
  project-history:
    - >
      SVP 4 Mac is the macOS edition of SmoothVideo Project's fourth-generation
      frame-interpolation software. Official documentation presents it alongside SVP 4
      Pro for Windows and SVP 4 Linux.
  related-projects:
    - mpv, IINA, and VLC are supported playback front ends.
    - VapourSynth and SVPflow participate in the frame-generation pipeline.
    - SVPtube, SVPcode, SVPcast, and SVPlight are related SVP extensions.
  sources:
    - https://www.svp-team.com/docs/mac/
    - https://www.svp-team.com/wiki/Manual:Advanced_SVP
    - https://www.svp-team.com/wiki/Manual:Installation
    - https://www.svp-team.com/wiki/Manual:Licensing
  summary:
    - >
      SVP 4 Mac performs real-time video motion interpolation to raise apparent frame
      rates during playback and can also support transcoding and streaming workflows.
  timeline:
    - 'SVP 4 generation: Separate Pro, Mac, and Linux editions documented by the project.'
  usage:
    - >
      Install the application and its supported player dependencies, then play video
      through mpv, IINA, or VLC with SVP integration enabled. Advanced users can tune
      interpolation profiles and script-generation settings; official documentation
      warns against arbitrary changes to low-level options.
