history:
  adoption-history:
    - >
      The official README documents Homebrew and Nix installation paths in addition to
      manual installation, while the supplied package facts confirm Homebrew and Nix
      package names.
  package-nerd-significance:
    - >
      Its package-nerd value is modest but real: it turns browser profile files,
      including Chrome's SQLite history database, into scriptable exports without
      depending on browser UI automation.
  project-history:
    - >
      The project began in 2011 as py-chrome-bookmarks. Its README explains that Chrome
      already offered an interactive bookmark export, but the script existed to make
      bookmark and history export usable from cron or other automated workflows.
    - >
      Version 2.0 in 2018 renamed the project to chrome-export and renamed the
      executables to export-chrome-bookmarks and export-chrome-history without changing
      functionality.
  related-projects:
    - >
      Related surfaces include Google Chrome profile data, the browser bookmarks HTML
      export format, Homebrew, and Nix.
  sources:
    - https://github.com/bdesham/chrome-export#readme
    - https://api.github.com/repos/bdesham/chrome-export
    - https://api.github.com/repos/bdesham/chrome-export/releases
  summary:
    - >
      chrome-export is a small Python command-line utility for exporting Google Chrome
      bookmarks and history to the browser bookmarks HTML format.
  timeline:
    - '2011: Initial release as py-chrome-bookmarks.'
    - '2011: Version 1.1 started counted releases.'
    - '2017: Version 1.2 added Python 3 support and optional default input-file discovery.'
    - '2018: Version 2.0 renamed the project and executables to chrome-export.'
    - '2019: Version 2.0.2 added man pages.'
  usage:
    - >
      The package provides export-chrome-bookmarks and export-chrome-history. If an
      input file is omitted, the tools try to open Chrome's default bookmarks or history
      file and write an HTML bookmarks-format output file.
