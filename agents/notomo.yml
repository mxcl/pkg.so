history:
  adoption-history:
    - >
      Notomo expanded from an Apple Notes formatting companion into a broader workflow
      layer with Quick Open, templates, reusable Skills, cross-application Actions,
      backlinks, export commands, and an assistant that can use the current note as
      context.
    - >
      The project subsequently added Homebrew installation, a multilingual user guide, a
      PopClip handoff, and support for multiple account, API, CLI, and OpenAI-compatible
      AI providers.
  package-nerd-significance:
    - >
      Notomo is an example of a macOS utility that augments a closed, built-in
      application rather than replacing it. It uses Accessibility, Apple Events, and
      read-only access to the Notes database while leaving Apple Notes as the
      authoritative content store.
    - >
      For package users, its Homebrew distribution and Sparkle update path make the same
      signed application accessible through both package-managed installation and native
      in-app updates.
  project-history:
    - >
      Notomo began as a native macOS beta focused on bringing Markdown-style shortcuts,
      a floating command panel, and contextual AI assistance to Apple Notes. Its scope
      grew through quick navigation, formatting tools, templates, Skills, backlinks,
      note export, and cross-application text actions.
    - >
      Later development broadened the assistant with attachments, conversation history,
      web search, multiple AI providers, reusable instructions, and local Apple Notes
      search while retaining the design principle that notes remain in Apple's
      application.
  related-projects:
    - Apple Notes remains Notomo's underlying note store and editing surface.
    - >
      PopClip has an officially supported Notomo extension for sending selected text
      into Notomo Actions.
  sources:
    - https://notomo.app/
    - https://notomo.app/changelog
    - https://notomo.app/docs/en/ai/assistant/
    - https://notomo.app/docs/en/getting-started/install/
    - https://notomo.app/docs/en/privacy/local-data/
  summary:
    - >
      Notomo is a native macOS companion for Apple Notes that adds Markdown shortcuts,
      quick navigation, templates, reusable actions, and note-aware AI without
      maintaining a replacement notes library.
  timeline:
    - >
      Initial beta: Introduced Markdown shortcuts, a command panel, note context, and an
      AI assistant
    - >
      Early expansion: Added Quick Open, formatting controls, templates, Skills, and
      note export
    - 'Package-manager adoption: Added an official Homebrew installation path'
    - >
      Later expansion: Added a user guide, broader provider support, backlinks, web
      search, and local note-search workflows
  usage:
    - >
      Users run Notomo alongside Apple Notes and invoke formatting, Quick Open, the
      Command Palette, Actions, or Assistant through keyboard shortcuts and contextual
      controls.
    - >
      AI features use only the selected note context, attachments, Skills, and
      conversation history included for the request. Provider credentials and license
      data are stored in the macOS Keychain where applicable.
related-packages:
  - id: cask:popclip
    reason: >
      Use PopClip with Notomo’s official extension to send selected text from other
      macOS applications directly into Notomo Actions.
    rel: adjacent_workflow
    sources:
      - https://notomo.app/
      - https://www.popclip.app/guide/
