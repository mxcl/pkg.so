history:
  adoption-history:
    - >
      Snapline is distributed directly as a signed and notarized macOS application and
      through an official Homebrew cask. It uses a one-time license with a year of
      updates and requires no user account.
  package-nerd-significance:
    - >
      Snapline is notable as a small native Swift/AppKit alternative to Electron-based
      or cloud-centered capture suites. It keeps captures as ordinary local files and
      performs OCR and translation on-device.
    - >
      Its explicit Homebrew support, small download, Sparkle updates, and absence from
      the Mac App Store make it a characteristic independently distributed macOS
      utility.
  project-history:
    - >
      Snapline was independently developed as a native macOS menu-bar capture studio.
      Its design centers on local files rather than cloud records, using Apple's
      ScreenCaptureKit for capture and recording and Vision for on-device text
      recognition.
    - >
      The 2.x release line expanded the product beyond still screenshots into scrolling
      capture, MP4 recording, GIF conversion, searchable history, vector annotation,
      redaction, and capture-time presentation aids.
  related-projects:
    - Apple ScreenCaptureKit provides capture and recording facilities.
    - Apple Vision provides on-device OCR.
    - Sparkle supplies signed in-app updates.
    - >
      The official site positions Snapline alongside Apple's built-in screenshot tool
      and CleanShot X.
  sources:
    - 'Official about page: https://snap-line.app/about/'
    - 'Official changelog: https://snap-line.app/changelog/'
    - 'Official product page: https://snap-line.app/'
  summary:
    - >
      Snapline is an independently developed native macOS screenshot and
      screen-recording studio built around local files, on-device processing, and a
      menu-bar workflow.
  timeline:
    - >
      2026: The documented 2.x series delivered frequent releases covering capture,
      recording, GIF conversion, OCR, annotation, redaction, and history workflows.
    - >
      2026-08-28: The official about page documented Snapline's independent, native,
      local-first design.
    - >
      2026-09-11: Version 2.32.0 expanded redaction, export fidelity, recording,
      history, and accessibility behavior.
  usage:
    - >
      Snapline captures regions, windows, and displays; joins manually scrolled content
      into tall images; records MP4 video; converts recordings to GIF; and edits
      captures with re-editable vector annotations.
    - >
      Captures remain local files and are indexed with on-device OCR for searchable
      history. Users can drag results into other applications, export them, or pin
      captures above other windows.
