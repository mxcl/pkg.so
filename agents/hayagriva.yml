history:
  adoption-history:
    - >
      The README documents library use, CLI installation through Cargo with the cli
      feature, and support for all styles from the official Citation Style Language
      repository. Input package facts show downstream packaging in Homebrew, Nix, and
      zypper.
  package-nerd-significance:
    - >
      Hayagriva is notable because it packages scholarly citation plumbing as a reusable
      Rust crate and standalone CLI. That makes it useful outside Typst itself, but its
      strongest package-manager relevance is as a small tool in reproducible writing and
      publishing pipelines.
  project-history:
    - >
      The GitHub repository was created in September 2020. The README describes
      Hayagriva as 'Rusty bibliography management' and positions it as both an
      application dependency and terminal tool for dealing with literature and other
      media.
    - >
      Hayagriva's history is tied to Typst's document-preparation ecosystem: it provides
      structured bibliography data and citation formatting that fit Typst's broader goal
      of modern technical writing workflows.
  related-projects:
    - Typst is the closest related project by organization and ecosystem.
    - >
      BibTeX, BibLaTeX, Citation Style Language styles, and the citationberg parser are
      related bibliography and citation-formatting technologies named by the README.
  sources:
    - https://api.github.com/repos/typst/hayagriva
    - https://github.com/typst/hayagriva
    - https://raw.githubusercontent.com/typst/hayagriva/main/README.md
  summary:
    - >
      Hayagriva is a Rust bibliography-management library and CLI from the Typst
      organization. It handles literature collections, YAML bibliography files,
      BibTeX/BibLaTeX interoperability, Citation Style Language formatting, and
      command-line citation/reference generation.
  timeline:
    - '2020: Public GitHub repository created.'
    - '2020s: Project develops as a Rust library and CLI for bibliography handling.'
    - >
      2020s: Downstream packages appear in Homebrew, Nix, and zypper according to input
      package facts.
  usage:
    - >
      Users can parse bibliography data from YAML or BibLaTeX, format references and
      in-text citations using CSL styles, and run commands such as hayagriva
      literature.yaml reference or hayagriva literature.yaml cite. As a library, it
      exposes data structures and formatting drivers for applications that need citation
      support.
related-packages:
  - id: brew:typst
    reason: >
      Typst directly consumes Hayagriva YAML files for citations and bibliographies,
      making it the strongest end-user companion to Hayagriva.
    rel: adjacent_workflow
    sources:
      - https://www.typst.app/docs/reference/model/bibliography/
      - https://github.com/typst/hayagriva#readme
