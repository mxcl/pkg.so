history:
  adoption-history:
    - >
      DisplayBuddy has evolved through multiple major releases while retaining a
      one-time-purchase model in which major updates are free to existing users. Its
      compatibility path includes an older 1.45 build for legacy macOS releases and
      current builds for modern macOS.
    - >
      The product expanded from basic DDC display controls into presets,
      synchronization, Apple-display support, smart-monitor control, scheduling,
      Shortcuts integration, and command-line automation, targeting increasingly complex
      multi-monitor Mac setups.
  package-nerd-significance:
    - >
      DisplayBuddy gives Mac power users one control layer across built-in displays,
      Apple displays, conventional DDC/CI monitors, and selected smart monitors. Its
      presets, scheduling, Shortcuts actions, CLI, JSON output, and MCP support make
      display state scriptable rather than purely graphical.
  project-history:
    - >
      DisplayBuddy began as a macOS menu-bar utility for controlling external-monitor
      settings through DDC/CI. Version 2.0 in 2023 introduced a ground-up redesign
      together with presets and refreshed multi-display synchronization.
    - >
      Later releases added support for Apple-display high-brightness modes and Samsung
      smart monitors, followed by schedules in version 3 and broader automation. In
      2026, DisplayBuddy added a command-line interface and MCP server, expanded
      smart-monitor support, localization, Control Center integration, and color-profile
      controls.
  related-projects:
    - >
      The bundled displaybuddy CLI communicates with the running DisplayBuddy desktop
      application.
    - DisplayBuddy's MCP server exposes monitor controls to compatible AI-agent workflows.
    - The application integrates with macOS Shortcuts, Spotlight, Siri, and Control Center.
  sources:
    - https://displaybuddy.app/docs
    - https://displaybuddy.app/docs/command-line-ai
    - https://displaybuddy.app/docs/getting-started
    - https://displaybuddy.app/release-notes
    - https://displaybuddy.app/troubleshooting
  summary:
    - >
      DisplayBuddy is a proprietary menu-bar display controller for macOS. It manages
      brightness, contrast, volume, inputs, resolution, rotation, presets,
      synchronization, and automation across supported monitors.
  timeline:
    - >
      2023: DisplayBuddy 2.0 introduced a ground-up redesign, presets, and refreshed
      synchronization.
    - '2024: DisplayBuddy added UltraBright and Samsung Smart Monitor controls.'
    - '2025: DisplayBuddy 3 introduced schedules and expanded preset automation.'
    - '2026: DisplayBuddy added a CLI and MCP server for terminal and agent-driven automation.'
    - >
      2026: Later releases added LG webOS control, Control Center integration,
      localization, and color-profile selection.
  usage:
    - >
      Users run DisplayBuddy from the macOS menu bar, where they can adjust each
      connected display, synchronize controls, save multi-monitor presets, and trigger
      schedules. It supports DDC/CI monitors, Apple displays, software dimming, and
      selected Samsung and LG smart displays.
    - >
      Power users can install the bundled displaybuddy command from Settings. The CLI
      can inspect displays, change properties, activate presets, manage schedules, and
      emit JSON, but the desktop application must remain running.
