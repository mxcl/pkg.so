history:
  sources:
    - https://formulae.brew.sh/formula/mintoolkit
    - https://github.com/mintoolkit/examples
    - https://github.com/mintoolkit/mint
    - https://github.com/slimtoolkit/slim
    - https://slimtoolkit.org/
  summary:
    - >
      Mint Toolkit is the Homebrew package for the container-image optimization tool
      whose lineage runs through DockerSlim and SlimToolkit. The mintoolkit/mint README
      describes DockerSlim as MinToolkit or Mint, and Homebrew records mintoolkit as
      formerly known as docker-slim. The related SlimToolkit project credits Kyle Quest
      as creator and explains the tool's role as an open-source way to inspect,
      optimize, and harden container images without changing the application image by
      hand.
  usage:
    - >
      In practice, Mint is used from the command line against existing Docker or OCI
      images. Its commands cover image inspection, minification, debugging, linting,
      registry work, vulnerability-oriented checks, and build workflows; the
      compatibility executables docker-slim and slim reflect its older package names.
      The examples repository documents use with Node.js, Python, Ruby, Java, Go, Rust,
      Elixir, and PHP applications across common Linux base images, with most examples
      centered on the mint build, also known as mint slim, workflow. In package-manager
      terms, mintoolkit occupies the niche between manual multi-stage Dockerfile
      slimming and broader container scanners: it tries to discover the files an app
      actually needs, then emits a smaller runtime image and related inspection
      artifacts.
related-packages:
  - id: brew:dive
    reason: >
      Use dive after building or slimming an image to interactively inspect its layers,
      file changes, and wasted space; Mint performs the behavioral minification while
      dive provides a focused layer-level audit.
    rel: adjacent_workflow
    sources:
      - https://github.com/mintoolkit/mint
      - https://github.com/wagoodman/dive
  - id: brew:trivy
    reason: >
      Run Trivy against Mint's resulting image when you need a dedicated vulnerability,
      secret, license, and misconfiguration scan in addition to Mint's image reduction
      and runtime-derived hardening workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/mintoolkit/mint
      - https://trivy.dev/latest/
