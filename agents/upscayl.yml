credentials-file-location: null
history:
  adoption-history:
    - >
      Upscayl quickly became available across Linux, macOS, and Windows, packaging
      Real-ESRGAN-based image enhancement in a desktop interface.
    - >
      Its public issue tracker already showed active feature planning and packaged
      releases in 2022. Later documentation added custom NCNN models, batch processing,
      multiple scale choices, and detailed GPU compatibility guidance.
    - >
      The project is distributed through GitHub releases and ecosystem packages,
      including the Homebrew cask `upscayl`.
  package-nerd-significance:
    - >
      Upscayl is a prominent example of turning research-oriented super-resolution
      components into an approachable, cross-platform desktop package.
    - >
      It is useful to package enthusiasts because its Electron interface, native NCNN
      backend, Vulkan dependency, bundled models, and platform-specific GPU behavior
      expose the practical packaging challenges of desktop AI software.
    - >
      The separate `upscayl-ncnn` backend and custom-model workflow also make it
      relevant to users who want to move beyond the graphical application's default
      models.
  project-history:
    - >
      Upscayl emerged publicly in 2022 as a free and open-source desktop image upscaler.
      Early releases and issue activity established Windows, Linux, and macOS support.
    - >
      The project built its processing backend around NCNN and Real-ESRGAN techniques,
      using Vulkan-capable hardware for local inference.
    - >
      Later releases expanded model selection, batch workflows, custom-model loading,
      and scale controls while an official wiki and documentation site grew around
      compatibility and troubleshooting.
  related-projects:
    - Real-ESRGAN
    - NCNN
    - upscayl-ncnn
    - Upscayl custom models
  sources:
    - https://docs.upscayl.org/
    - https://github.com/upscayl
    - https://github.com/upscayl/upscayl
    - https://github.com/upscayl/upscayl/wiki
    - https://github.com/upscayl/upscayl/wiki/Guide
    - https://github.com/upscayl/upscayl/wiki/Troubleshooting
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Upscayl is a free and open-source desktop application that uses AI
      super-resolution models to enlarge and enhance low-resolution images locally on
      Linux, macOS, and Windows.
  timeline:
    - '2022: Upscayl entered public use with cross-platform 1.x releases.'
    - >
      2022-08: The public roadmap tracked batch mode, scale controls, model selection,
      and additional packaging targets.
    - "2022-10: Version 2.0.1 was distributed through the project's GitHub releases."
    - >
      2023: The 2.x series added custom-model and scaling capabilities documented by the
      project.
    - >
      2024: The official GitHub wiki was substantially expanded with guides and
      troubleshooting material.
  usage:
    - >
      Select an image or folder, choose an upscaling model and output settings, and run
      local enhancement. Batch mode handles groups of images.
    - >
      A Vulkan-capable GPU is normally required. The official guide exposes GPU
      selection, logging, scale options, and custom NCNN model loading.
    - >
      Upscayl improves low-resolution or pixelated material but is not intended to
      restore focus to fundamentally blurred images.
