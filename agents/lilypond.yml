history:
  adoption-history:
    - >
      LilyPond found a durable audience among free-software musicians, publishers,
      educators, composers, and technically inclined engravers who preferred a
      reproducible source-based workflow over GUI-only score editing. Its inclusion in
      GNU and broad packaging across Unix distributions made it a standard installable
      engraver for people already comfortable with LaTeX-like document production.
  package-nerd-significance:
    - >
      LilyPond is package-nerd significant because it treats sheet music like source
      code. It brings compiler-style reproducibility, text diffs, batch builds, fonts,
      Scheme extensibility, and decades of compatibility concerns into a domain more
      often associated with graphical editors.
  project-history:
    - >
      LilyPond was created by Han-Wen Nienhuys and Jan Nieuwenhuizen to escape the
      mechanical look of much computer-generated sheet music. The official introduction
      frames the project as an attempt to let musicians and publishers focus on music
      while the program handles engraving details according to classical music-engraving
      practice.
    - >
      The project's own essay ties LilyPond's design to traditional manual engravings
      from European publishers in the first half of the twentieth century. Instead of
      exposing every spacing and glyph choice as a manual WYSIWYG tweak, LilyPond
      encodes engraving rules and lets users override them from a text language when
      necessary.
    - >
      LilyPond 2.0.0 was released on September 24, 2003 with a focus on syntax cleanup
      that made entering music easier and more efficient. The project has continued with
      extensive manuals, converters such as abc2ly and musicxml2ly, and an ecosystem of
      snippets, examples, editor modes, and publication workflows.
  related-projects:
    - >
      LilyPond is related to GNU, TeX/LaTeX-style publishing workflows, MusicXML and ABC
      conversion tools, Guile/Scheme extension work, and graphical or hybrid front ends
      that use LilyPond for final engraving. It is often compared with notation programs
      such as MuseScore, Finale, and Sibelius, but its source-first workflow is closer
      to document compilers.
  sources:
    - https://lilypond.org/
    - https://lilypond.org/attic.html
    - https://lilypond.org/doc/v2.24/Documentation/essay-big-page.html
    - https://lilypond.org/doc/v2.26/Documentation
    - https://lilypond.org/doc/v2.26/Documentation/web/introduction
  summary:
    - >
      LilyPond is a GNU music engraving system that turns textual music notation into
      high-quality printed scores. It is part scorewriter, part compiler culture: users
      write source files, run command-line tools, and receive PDF, PostScript, SVG,
      MIDI, and related output.
  timeline:
    - >
      1996: Han-Wen Nienhuys and Jan Nieuwenhuizen began the LilyPond project after
      earlier work around MusiXTeX-related tooling.
    - >
      2003-05: The paper "LilyPond, a system for automated music engraving" appeared in
      the XIV Colloquium on Musical Informatics literature record.
    - >
      2003-09-24: LilyPond 2.0.0 was released with syntax cleanups for easier and more
      efficient music entry.
    - '2026-04-21: The LilyPond site listed LilyPond 2.26.0 as a stable release.'
  usage:
    - >
      Users write .ly source files, run lilypond to engrave them, and often pair it with
      version control, Makefiles, LaTeX, or documentation pipelines. Auxiliary commands
      convert ABC, MIDI, ETF, and MusicXML inputs, update old LilyPond syntax, and
      integrate scores into larger documents.
related-packages:
  - id: cask:frescobaldi
    reason: >
      Frescobaldi is a purpose-built LilyPond editor that adds syntax assistance, score
      setup, point-and-click PDF preview, error navigation, and direct engraving while
      preserving LilyPond's text-source workflow.
    rel: adjacent_workflow
    sources:
      - https://frescobaldi.org/
      - https://frescobaldi.org/uguide.html
  - id: cask:musescore
    reason: >
      Choose MuseScore Studio when an interactive WYSIWYG score editor and integrated
      playback are preferable to LilyPond's source-first compiler workflow; MusicXML and
      MIDI provide interchange between the approaches.
    rel: alternative
    sources:
      - https://musescore.org/en/handbook/musescore-product-description
      - https://lilypond.org/doc/v2.26/Documentation/usage/invoking-musicxml2ly
