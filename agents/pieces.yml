credentials-file-location: null
history:
  adoption-history:
    - >
      By the end of 2022, Pieces reported more than 37,000 suite installations,
      including over 15,000 Desktop App installations and substantial adoption of its
      Visual Studio Code, JetBrains, and browser extensions.
    - >
      Pieces broadened from a code-snippet manager into a cross-tool workflow platform.
      Later releases added Linux support, local and cloud AI models, workflow timelines,
      long-term memory, MCP integrations, audio capture, and generated work summaries.
  package-nerd-significance:
    - >
      Pieces is notable for splitting its user-facing desktop application from PiecesOS,
      a separately packaged local service shared by its integrations. That architecture
      makes the runtime, desktop client, editor extensions, browser extensions, CLI, and
      MCP clients independently distributable parts of one ecosystem.
    - >
      Its local-first storage and support for both local and cloud models make data
      placement, runtime compatibility, and optional account-backed synchronization
      important packaging considerations.
  project-history:
    - >
      Pieces was developed by Mesh Intelligent Technologies as a developer-oriented
      system for saving and enriching code snippets and screenshots. By 2022, its
      desktop, IDE, and browser tools formed a cross-platform suite centered on reusable
      developer materials.
    - >
      The product subsequently expanded into contextual AI. Workflow Activity and the
      first Pieces Copilot appeared in the 2022 generation; live workflow context
      followed in 2023; and the product later emphasized long-term memory,
      conversational search, summaries, and MCP access across a user's tools.
  related-projects:
    - PiecesOS
    - Pieces MCP
    - Pieces CLI
    - Pieces extensions for Visual Studio Code and JetBrains IDEs
  sources:
    - https://docs.pieces.app/products/desktop
    - https://pieces.app/
    - https://pieces.app/about
    - https://pieces.app/changelog/pieces-for-developers-22-biggest-achievements-of-2022
    - >
      https://pieces.app/changelog/pieces-for-developers-desktop-app-1100-pieces-os-310-massive-updates-to-start-the-holiday-season
    - https://pieces.app/updates
  summary:
    - >
      Pieces is a local-first AI productivity application that captures workflow
      context, organizes it as searchable memory, and makes it available through its
      desktop interface and connected AI tools.
  timeline:
    - '2021: The Desktop App offered code extraction from screenshots.'
    - >
      2022: Pieces expanded its desktop, IDE, browser, and Linux offerings and reported
      more than 37,000 suite installations.
    - '2023: Pieces extended its copilot with live context spanning tools and workflows.'
    - >
      2025: Pieces introduced its LTM-2 long-term-memory agent and connections to
      external AI tools.
    - >
      2026: Pieces added audio capture, scheduled summaries, and further local-model
      improvements.
  usage:
    - >
      Users run Pieces in the background to capture selected visual, clipboard, and
      optional audio context. The Desktop App provides a timeline, conversational
      search, summaries, saved materials, configuration, and privacy controls.
    - >
      Local storage is the default. Users may optionally sign in for Personal Cloud
      backups or use cloud model providers; official documentation says linked-account
      connections are backed up without passwords.
