credentials-file-location: null
history:
  adoption-history:
    - >
      The project supplies prebuilt macOS and Linux binaries and documents installation
      through Homebrew, Nix, Cargo, or a source build. This gives it several entry
      points familiar to Unix package users, although the official material does not
      establish broad industry adoption.
  package-nerd-significance:
    - >
      sofka is notable as a Rust-native alternative in the Kubernetes TUI niche. Its use
      of kube-rs and ratatui, async-first design, XDG-aware configuration, and
      distribution through both language and system package ecosystems make it
      interesting to users comparing modern terminal tooling with k9s.
  project-history:
    - >
      sofka was created as a Kubernetes terminal interface written in Rust, using
      kube-rs and ratatui. Its documentation explicitly calls it a reimagining of k9s
      rather than a line-for-line port, emphasizing an asynchronous interface and a
      generic rendering pipeline for built-in and custom Kubernetes resources.
  related-projects:
    - 'k9s: The established Kubernetes TUI that inspired sofka.'
    - 'kube-rs: Rust Kubernetes client ecosystem used by sofka.'
    - 'ratatui: Rust terminal-interface library used by sofka.'
    - >
      kubectl: The standard Kubernetes CLI whose workflows and kubeconfig context sofka
      complements.
  sources:
    - 'Official README: https://github.com/nklmilojevic/sofka#readme'
    - >
      Official comparison with k9s:
      https://github.com/nklmilojevic/sofka/blob/main/docs/vs-k9s.md
    - >
      Official debugging documentation:
      https://github.com/nklmilojevic/sofka/blob/main/docs/debugging.md
  summary:
    - >
      sofka is a keyboard-driven Kubernetes terminal interface implemented in Rust. It
      packages cluster browsing, logs, resource actions, GitOps navigation, diagnostics,
      and extensibility into a single TUI.
  timeline:
    - >
      Project documentation: sofka is introduced as a Rust, kube-rs, and ratatui-based
      Kubernetes TUI inspired by k9s.
    - >
      Later development: The project added richer diagnostics, snapshots, safety
      controls, plugins, and built-in Flux and Argo CD workflows.
  usage:
    - >
      Users launch sofka against the current kubeconfig context, optionally selecting a
      resource, namespace, context, or kubeconfig path. Interactive keys navigate
      resources, logs, YAML, events, context selection, and guarded mutation actions;
      headless check and snapshot modes support diagnostics and automation.
