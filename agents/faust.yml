history:
  adoption-history:
    - >
      Faust adoption is visible in its target matrix. The official README and manual
      describe output for native standalone applications, iOS and Android apps,
      WebAssembly, and plugin or environment targets including Csound, LADSPA, Max/MSP,
      Pure Data, Q, SuperCollider, VST, AU, LV2, JACK, JUCE, Bela, Teensy, ESP32, and
      others.
    - >
      The surrounding community has its own recurring venue: the International Faust
      Conference, which the official site describes as a biennial gathering of Faust
      developers and users. Past editions listed by the project include IFC-18, IFC-20,
      IFC-22, IFC-24, and IFC-26.
  package-nerd-significance:
    - >
      Faust is interesting to package nerds because it is not just one binary. A Faust
      package exposes a compiler, a library interface (`libfaust`), DSP libraries,
      architecture templates, and many generated-target scripts, so downstream packaging
      has to preserve paths and auxiliary tools that users expect to compose.
    - >
      It also sits at the intersection of language runtimes and audio tooling.
      Installing Faust from Homebrew, MacPorts, Linux packages, or source gives users a
      portable way to generate native code and plugins without manually assembling each
      audio SDK or framework workflow.
  project-history:
    - >
      Faust has been developed since 2002, with GRAME-CNCM described by the project as
      its birthplace and main development home. Its core design is to describe DSP
      algorithms as mathematical signal-processing specifications, then compile those
      specifications into efficient code in languages and intermediate forms such as C,
      C++, Java, LLVM IR, and WebAssembly.
    - >
      The project grew from a compiler into a distribution. The official repository
      includes compiler sources, architecture targets, build tooling, documentation,
      examples, tests, DSP libraries, syntax-highlighting support, and a large set of
      helper scripts that turn Faust programs into plugins, standalone applications,
      diagrams, web targets, embedded targets, and audio-environment integrations.
    - >
      Faust's development workflow also reflects a mature language project. Official
      documentation distinguishes stable release packages, a `master` branch, and a
      `master-dev` branch used as the main development branch, with GRAME merging
      development work into stable releases.
  related-projects:
    - >
      FaustLive and Faustgen are related prototyping tools in the Faust ecosystem; the
      official overview notes FaustLive is no longer the recommended primary tool, with
      Faust IDE preferred.
    - >
      The Faust DSP Libraries are maintained as a separate project and included by the
      main Faust repository as a submodule.
  sources:
    - https://faust.grame.fr
    - https://faustdoc.grame.fr/manual/introduction/
    - https://faustdoc.grame.fr/manual/overview/
    - https://github.com/grame-cncm/faust
    - https://faust.grame.fr/downloads/
    - https://faust.grame.fr/community/ifc/
  summary:
    - >
      Faust, short for Functional Audio Stream, is a domain-specific functional
      programming language for real-time audio signal processing and synthesis. It is
      distributed as both a command-line compiler and an ecosystem of libraries,
      architecture files, web tools, and target-specific `faust2...` scripts.
  timeline:
    - '2002: Faust development begins.'
    - '2018: First International Faust Conference takes place in Mainz.'
    - '2020: IFC-20 takes place in the Paris area.'
    - '2022: IFC-22 takes place during SMC-22 in Saint-Etienne.'
    - '2024: IFC-24 takes place in Turin.'
    - '2026: IFC-26 takes place in Cannes.'
  usage:
    - >
      At the package level, Faust is most often installed to obtain the `faust` compiler
      and the many `faust2...` tools. A developer writes a `.dsp` program, compiles it
      directly with `faust`, or uses a wrapper such as `faust2jaqt`, `faust2lv2`,
      `faust2supercollider`, `faust2puredata`, `faust2svg`, or `faust2wasm`-style
      tooling to generate a target-specific artifact.
    - >
      The project also supports zero-configuration web workflows through the Faust IDE,
      Faust Editor, and Faust Playground, which lowers the barrier for experiments while
      keeping the command-line compiler central for packaging and reproducible builds.
related-packages:
  - id: cask:supercollider
    reason: >
      Use SuperCollider alongside Faust when you want to host generated Faust DSP as a
      SuperCollider external; Faust officially provides the `faust2supercollider`
      target.
    rel: adjacent_workflow
    sources:
      - https://github.com/grame-cncm/faust
      - https://supercollider.github.io/
  - id: brew:csound
    reason: >
      Use Csound alongside Faust when a Faust DSP should become a Csound opcode through
      the officially documented `faust2csound` target.
    rel: adjacent_workflow
    sources:
      - https://github.com/grame-cncm/faust
      - https://csound.com/
