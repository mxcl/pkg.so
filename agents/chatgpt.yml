history:
  adoption-history:
    - >
      OpenAI expanded the macOS client through 2024 and 2025 with a companion window,
      data-analysis views, voice features, app integrations, reasoning models, Canvas,
      Tasks, Projects, and code-editing support. These additions turned it from a
      desktop chat client into an assistant designed to work alongside native
      applications.
  package-nerd-significance:
    - >
      The cask gives Homebrew users a reproducible installation path for OpenAI's
      proprietary desktop client. It is especially relevant to developers because the
      application added integrations with terminals and editors and later gained direct
      code-editing workflows.
  project-history:
    - >
      OpenAI introduced the native ChatGPT macOS application during the GPT-4o era in
      2024. Official release notes document rapid iteration from the companion-window
      experience into deeper integration with coding and note-taking applications.
    - >
      In July 2026, OpenAI renamed the earlier macOS client ChatGPT Classic while
      introducing a new desktop application that brings together Chat, Work, and Codex
      experiences.
  related-projects:
    - >
      ChatGPT, GPT-4o, OpenAI o-series models, Canvas, Codex, and OpenAI's broader
      desktop-app ecosystem.
  sources:
    - https://help.openai.com/en/articles/9275200
    - https://help.openai.com/en/articles/9703738-macos
  summary:
    - >
      ChatGPT is OpenAI's official desktop application for accessing its conversational
      AI and related productivity and coding features on macOS.
  timeline:
    - '2024: OpenAI introduced the native ChatGPT application for macOS.'
    - >
      2024-08-06: Official release notes documented the companion window and expanded
      data-analysis interface.
    - '2024-11-14: The macOS client added an early Work with Apps beta.'
    - '2025-03-06: The application added direct code-editing support in IDEs.'
    - >
      2026-07-09: The previous macOS application was renamed ChatGPT Classic alongside
      OpenAI's new desktop app.
  usage:
    - >
      Users install the application on a supported Mac, sign in to ChatGPT, and invoke
      it with a configurable desktop shortcut. Common uses include general questions,
      writing, file and image analysis, voice interaction, and assistance alongside
      coding or note-taking applications.
