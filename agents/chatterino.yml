id: cask:chatterino
display-name: Chatterino
repo: https://github.com/Chatterino/chatterino2
docs:
  - https://wiki.chatterino.com/
config-file-location:
  linux:
    - ~/.local/share/chatterino
    - ~/.var/app/com.chatterino.chatterino/data/chatterino
  macos:
    - ~/Library/Application Support/chatterino
  windows:
    - '%APPDATA%/Chatterino2'
credentials-file-location:
  linux:
    - ~/.local/share/chatterino/settings.json
    - ~/.var/app/com.chatterino.chatterino/data/chatterino/settings.json
  macos:
    - ~/Library/Application Support/chatterino/settings.json
  windows:
    - '%APPDATA%/Chatterino2/settings.json'
history:
  adoption-history:
    - >
      Chatterino is available as a native application for Windows, macOS, Linux, and
      FreeBSD and is packaged as a Homebrew cask. It is aimed at viewers, streamers, and
      moderators who need to follow many Twitch channels or use chat intensively.
  package-nerd-significance:
    - >
      Chatterino is a prominent native alternative to a browser-embedded chat interface.
      Its cross-platform packaging, portable mode, third-party emote integrations, and
      documented per-user data directories make it especially relevant to desktop
      package maintainers and configuration-backup workflows.
  project-history:
    - >
      Chatterino 2 continued the Chatterino project as an open-source native desktop
      client for Twitch chat. The official site credits fourtf, pajlada, and
      contributors, while development takes place in the Chatterino/chatterino2
      repository.
  related-projects:
    - >
      Chatterino integrates Twitch chat and supports emotes from BetterTTV,
      FrankerFaceZ, and 7TV. It can also detect streaming software for its Streamer
      Mode.
  sources:
    - https://chatterino.com/
    - https://github.com/Chatterino/chatterino2
    - https://wiki.chatterino.com/
    - https://wiki.chatterino.com/Settings/
    - source_facts.package-manager
  summary:
    - >
      Chatterino is a native, cross-platform client designed as an improved and extended
      interface for Twitch chat.
  timeline:
    - >
      Chatterino 2 established a cross-platform continuation of the Chatterino desktop
      chat client.
  usage:
    - >
      Users connect to multiple Twitch channels, arrange chats side by side, apply
      message highlights or ignores, use third-party emotes, monitor mentions, and
      perform chat or moderation work outside the Twitch web interface. The settings
      file also stores sensitive data such as the user's login token.
