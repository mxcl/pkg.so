history:
  adoption-history:
    - >
      ATasm occupies a niche but durable package-manager slot: retrocomputing developers
      need a small native assembler that can be scripted from makefiles and editors
      instead of running original Atari tools inside an emulator. The supplied metadata
      shows Homebrew, Fedora/DNF, and Nix packaging.
    - >
      Its adoption is tightly connected to Atari emulator and cross-development
      workflows. The README explicitly names Atari800Win, Atari800, and Atari++
      state-file targets, and later releases added outputs used by CC65 and VS
      Code/Altirra tooling.
  package-nerd-significance:
    - >
      ATasm is a compact example of why niche retro tools survive in general-purpose
      package managers: it is small, C-based, scriptable, compatible with old source
      idioms, and bridges modern build systems with emulator/debugger ecosystems.
  project-history:
    - >
      The README traces ATasm to Mark Schmelzenbach in 1998 and explains that it was
      created from a desire for a fast Atari-specific cross-assembler after using OSS
      MAC/65 on real hardware and finding other cross-assemblers lacked Atari-specific
      directives and conveniences. The current fork documents modifications by Peter
      Hinz from 2021 through 2025.
    - >
      The version history records an initial public 0.90 release, GPL release at 1.00,
      Atari-specific output work such as XFD/ATR and emulator state-file support,
      undocumented opcodes, MAC/65 compatibility improvements, list/debug output, CC65
      header generation, VS Code/Altirra bridge symbol dumps, long branches,
      trigonometry table helpers, procedure scopes, and .GUARD/.NOTIFY directives.
  related-projects:
    - >
      Related projects include OSS MAC/65, Atari800, Atari800Win, Atari++, Altirra,
      CC65, MADS-format source conventions, and VS Code Atari cross-development plugins.
  sources:
    - Official git metadata from https://github.com/CycoPH/atasm.git
    - https://github.com/CycoPH/atasm#readme
    - https://github.com/CycoPH/atasm/releases.atom
  summary:
    - >
      ATasm is a mostly MAC/65-compatible 6502 cross-assembler for Atari 8-bit
      development. It lets programmers write Atari assembly on modern hosts while
      producing Atari-native load objects, disk images, and emulator-related outputs.
  timeline:
    - '1998: Original ATasm copyright and project origin.'
    - 'v0.90: Initial public release.'
    - 'v1.00: Package explicitly released under the GPL.'
    - '2019: v1.09 fixed multiple buffer-overflow CVEs.'
    - '2025: v1.30 added .GUARD and .NOTIFY directives.'
  usage:
    - >
      The command is `atasm [options] <file.m65>`. Users enable undocumented opcodes,
      raw binary output, include paths, predefined symbols, XFD/ATR output, emulator
      state-file merging, symbol/list output, CC65 headers, ATasm include files, and
      JSON symbol dumps for editor integrations.
related-packages:
  - id: brew:atari800
    reason: >
      Atari800 runs the Atari binaries and disk images produced by ATasm, while its
      monitor provides an immediate environment for inspecting and debugging assembled
      code.
    rel: adjacent_workflow
    sources:
      - https://github.com/CycoPH/atasm#readme
      - https://github.com/atari800/atari800/blob/master/DOC/USAGE
  - id: brew:cc65
    reason: >
      Choose cc65 when a project needs a broader 6502 C toolchain with assembler and
      linker support; choose ATasm for Atari-specific MAC/65-compatible assembly and
      direct Atari disk or emulator-state outputs.
    rel: alternative
    sources:
      - https://github.com/CycoPH/atasm#readme
      - https://cc65.github.io/
