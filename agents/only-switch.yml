history:
  adoption-history:
    - >
      OnlySwitch is distributed as a conventional macOS application and through the
      Homebrew Cask recorded in the supplied package metadata. Its open repository also
      invites translations, bug fixes, and user-contributed Evolution actions.
  package-nerd-significance:
    - >
      It packages numerous macOS controls behind one menu-bar interface while remaining
      inspectable and script-extensible. Evolution actions and deep links make it more
      automation-friendly than a simple collection of graphical toggles.
  project-history:
    - >
      OnlySwitch began as an open-source, all-in-one macOS menu-bar utility. Its scope
      expanded from system toggles into notch hiding, AirPods controls, radio playback,
      widgets, custom shell and AppleScript actions, and natural-language automation.
  related-projects:
    - Apple Shortcuts
    - OpenClaw
    - Ollama
  sources:
    - https://github.com/jacklandrin/OnlySwitch#readme
    - https://github.com/jacklandrin/OnlySwitch/releases
    - source_facts.package-manager.brew-cask
  summary:
    - >
      OnlySwitch is an open-source macOS menu-bar utility that consolidates system
      switches, buttons, and automation actions.
  timeline:
    - >
      2.3 series: Added utilities including screen testing, menu-bar icon hiding, and
      radio controls.
    - >
      2.4 series: Introduced Evolution for user-defined shell and AppleScript switches
      and buttons.
    - '2.5 series: Added configurable macOS widgets.'
    - '2.6 series: Added Only Agent and natural-language automation integrations.'
  usage:
    - >
      Users keep OnlySwitch in the menu bar for quick access to macOS settings and
      utility actions. Advanced users can create Evolution actions backed by shell
      commands or AppleScript and invoke supported actions through hotkeys, widgets,
      Shortcuts, or deep links.
