history:
  adoption-history:
    - >
      Nagios grew from a sysadmin tool into an ecosystem by the late 2000s. The official
      history records SourceForge Project of the Month in June 2005, eWeek and
      LinuxQuestions.org recognition in 2006-2007, InfoWorld BOSSIE recognition in 2008
      and 2009, more than 500,000 direct SourceForge downloads by 2008, more than
      600,000 by 2009, and more than 8 million installs since 2008 by 2014.
    - >
      Homebrew is not Nagios's primary deployment channel, but it remains a convenient
      local install path for Mac and Linux users. The Homebrew formula page consulted on
      2026-07-01 listed Nagios 4.5.13 and 509 installs over the prior 365 days.
  package-nerd-significance:
    - >
      Nagios matters because it normalized the small-executable monitoring plugin
      pattern: the core does scheduling and state, while checks are ordinary commands
      with exit codes and text output. That shape made it easy to package checks
      separately, script local probes, and carry Nagios-compatible checks into later
      monitoring stacks.
  project-history:
    - >
      Nagios traces its architecture to Ethan Galstad's 1996 MS-DOS pager/checking tool
      and a 1998 Linux rewrite. Galstad released the project as open source in 1999
      under the name NetSaint, then renamed it Nagios in 2002 after trademark concerns;
      the official history expands the name as "Nagios Ain't Gonna Insist On Sainthood."
      The plugin checks that originally shipped with NetSaint were split into the
      separate Nagios Plugins project, which became central to the ecosystem.
    - >
      The project became Nagios Core in 2009, after Nagios Enterprises had been formed
      in 2007 to provide consulting and commercial development around the open source
      engine. Nagios Core 4 arrived in 2013, and the GitHub release stream still carries
      4.x maintenance releases; release 4.5.13 was published on 2026-05-28.
  related-projects:
    - Nagios Plugins
    - Nagios XI
    - Icinga
    - Naemon
    - Checkmk
  sources:
    - https://api.github.com/repos/NagiosEnterprises/nagioscore/releases?per_page=5
    - https://formulae.brew.sh/formula/nagios
    - https://github.com/NagiosEnterprises/nagioscore
    - https://www.nagios.org/about/
    - https://www.nagios.org/about/history/
  summary:
    - >
      Nagios Core is one of the long-running reference points for open source
      infrastructure monitoring: a scheduler, notification engine, web UI, and plugin
      model for checking hosts, services, and network devices.
  timeline:
    - '1996: Ethan Galstad builds a pager/checking tool for Novell NetWare servers.'
    - '1999: The project is released as NetSaint.'
    - '2002: NetSaint is renamed Nagios; plugins move under the Nagios Plugins project.'
    - '2007: Nagios Enterprises is founded.'
    - '2009: The open source engine is renamed Nagios Core.'
    - '2013: Nagios Core 4 is released.'
    - '2026-05-28: Nagios Core 4.5.13 is published on GitHub.'
  usage:
    - >
      Package nerds use Nagios as the classic check/alert loop: define hosts and
      services, run plugin commands such as ping, HTTP, SSH, disk, or custom checks, and
      let Nagios notify when state changes. It is especially common as a baseline or
      compatibility target because many monitoring plugins, add-ons, and forks learned
      from its object model and check-result format.
    - >
      A Homebrew install is most useful for labs, local config validation, plugin
      experimentation, or small monitoring setups. Production Nagios deployments more
      often live on Linux servers with explicit configuration under a Nagios etc
      directory, a web server front end for the CGI views, and a large local collection
      of plugins.
related-packages:
  - id: brew:prometheus
    reason: >
      Prometheus is the stronger alternative for white-box metrics and dynamic cloud
      environments, while its official comparison describes Nagios as suitable for basic
      black-box monitoring of smaller or static systems.
    rel: alternative
    sources:
      - https://prometheus.io/docs/introduction/comparison/#prometheus-vs-nagios
      - https://www.nagios.org/documentation/
