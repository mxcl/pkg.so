id: brew:mecab-ko
display-name: MeCab-ko
repo: https://bitbucket.org/eunjeon/mecab-ko
docs:
  - https://bitbucket.org/eunjeon/mecab-ko
config-file-location:
  unix:
    - /usr/local/etc/mecabrc
    - ~/.mecabrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The README directs users to the separate mecab-ko-dic project for the Korean
      dictionary, so mecab-ko is best understood as the engine fork used with that
      dictionary. The input package facts show it distributed under the same executable
      names as MeCab, including `mecab` and `mecab-config`.
  package-nerd-significance:
    - >
      mecab-ko matters in package history because it keeps the familiar MeCab
      command-line and library surface while swapping in Korean-specific analysis
      behavior. That lets package managers expose Korean morphological analysis without
      inventing a separate CLI culture.
  project-history:
    - >
      The README identifies mecab-ko as a fork of MeCab for use by the Eunjeon project
      and documents a key Korean-language adaptation: increasing connection costs for
      selected parts of speech when whitespace appears on the left. This addresses
      Korean spacing behavior that is not present in Japanese text, while keeping
      MeCab's general build and usage model.
    - >
      The package inherits MeCab's GPL, LGPL, or BSD licensing terms and points users
      back to MeCab for the common installation model. The official repository metadata
      exposes the HTTPS Bitbucket repository and clone URL.
  related-projects:
    - MeCab, mecab-ko-dic, Eunjeon project.
  sources:
    - https://bitbucket.org/eunjeon/mecab-ko
    - https://bitbucket.org/eunjeon/mecab-ko/downloads/
    - https://bitbucket.org/eunjeon/mecab-ko/raw/master/README.md
    - source_facts.package-manager
  summary:
    - >
      MeCab-ko is the Eunjeon project's Korean-oriented fork of MeCab. Its official
      README says the goal is to add Korean-specific functionality with minimal changes
      to upstream MeCab.
  timeline:
    - >
      2015: Official Bitbucket repository metadata shows mecab-ko as a public Git
      repository under the Eunjeon workspace.
    - >
      Current README: mecab-ko is documented as a Korean fork of MeCab with minimal
      Korean-specific changes.
  usage:
    - >
      Installation follows the conventional source build flow: unpack the release
      tarball, run `./configure`, `make`, `make check`, and `make install`.
      Korean-specific behavior is controlled through MeCab dictionary settings such as
      `left-space-penalty-factor` in `dicrc`.
related-packages:
  - id: brew:mecab
    reason: >
      Choose upstream MeCab for Japanese analysis; choose MeCab-ko when Korean-specific
      spacing behavior and the mecab-ko dictionary ecosystem are required.
    rel: alternative
    sources:
      - https://bitbucket.org/eunjeon/mecab-ko/raw/master/README.md
      - https://taku910.github.io/mecab/
