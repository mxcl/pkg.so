history:
  adoption-history:
    - >
      DockFix is distributed directly as a notarized disk image and as a Homebrew cask.
      It is a commercial, one-time-purchase application with a trial, student pricing,
      community-shared Dock configurations, and an official support channel.
  package-nerd-significance:
    - >
      DockFix sits between a preference tweaker and a complete shell replacement: it can
      expose hidden settings for Apple's Dock or run a separately rendered, deeply
      customizable Dock. This combination, plus presets modeled on several desktop
      environments and Homebrew distribution, makes it notable among macOS customization
      utilities.
  project-history:
    - >
      DockFix began as a tool for customizing the native macOS Dock and expanded into a
      full Dock replacement with custom layouts, icons, widgets, workflows, window
      previews, notification badges, shortcuts, and a temporary file shelf. Version 4
      introduced workflow-oriented Dock configurations, while later 4.x releases
      overhauled performance and the window system.
  related-projects:
    - Radial
  sources:
    - 'Official changelog: https://www.dockfix.app/changelog'
    - 'Official installation guide: https://www.dockfix.app/blog/download-dockfix'
    - 'Official product page: https://www.dockfix.app/'
    - 'Official workflow guide: https://www.dockfix.app/blog/utilizing-workflows'
  summary:
    - >
      DockFix is a commercial macOS Dock customization utility that can modify the
      native Dock or replace it with a configurable alternative.
  timeline:
    - '2025: DockFix 4.0 introduced named workflows for different Dock configurations.'
    - >
      2026: DockFix 4.2 added automatic updates, Liquid Glass support, and a substantial
      performance and window-system overhaul.
    - >
      2026: The developer announced a ground-up rewrite intended to replace the original
      implementation.
  usage:
    - >
      Users can reveal hidden native Dock settings or enable DockFix's custom Dock, then
      configure colors, animations, icons, folders, website shortcuts, widgets,
      screen-space reservation, notification badges, and workflow-specific app sets.
