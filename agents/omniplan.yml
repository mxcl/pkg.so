history:
  adoption-history:
    - >
      OmniPlan joined The Omni Group's established family of native Mac productivity
      software and later expanded to iPhone, iPad, and Apple Vision Pro.
    - >
      Successive releases broadened it from standalone Gantt planning into multi-project
      dashboards, collaboration, Monte Carlo simulation, earned-value analysis,
      reporting, and Omni Automation. Homebrew Cask offers an additional installation
      route for Mac administrators and enthusiasts.
  package-nerd-significance:
    - >
      OmniPlan is notable as a long-lived, native Mac alternative to larger enterprise
      project-management suites, with structured document formats and support for
      importing and exporting common interchange formats.
    - >
      Its combination of Gantt charts, resource leveling, critical-path planning,
      automation, and scriptable installation makes substantial project-management
      machinery accessible in a desktop application.
  project-history:
    - >
      OmniPlan began as a side project by engineer Greg Titus and became part of The
      Omni Group's productivity suite after OmniOutliner and OmniGraffle but before
      OmniFocus. Its first generation established task scheduling, dependencies,
      resources, costs, and Gantt visualization as the core workflow.
    - >
      Later major versions added iOS editions and increasingly advanced Pro features.
      OmniPlan 3 redesigned inspectors and added views and analytical tools; OmniPlan 4
      continued as a universal product across supported Apple platforms with ongoing
      automation and compatibility updates.
  related-projects:
    - >
      OmniFocus handles personal task execution at a finer granularity, while OmniPlan
      models schedules, dependencies, resources, and work involving multiple
      stakeholders.
    - >
      OmniOutliner and OmniGraffle documents can supply task structures imported into
      OmniPlan.
    - >
      Omni Automation provides JavaScript-based automation shared with other Omni Group
      applications.
  sources:
    - https://support.omnigroup.com/documentation/omniplan/mac/4/
    - https://support.omnigroup.com/omniplan/all/
    - https://theomnishow.omnigroup.com/episode/the-story-of-omniplan
    - https://www.omnigroup.com/omniplan
    - https://www.omnigroup.com/releasenotes/omniplan/
  summary:
    - >
      OmniPlan is The Omni Group's project-planning application for building schedules,
      linking dependent tasks, assigning resources, tracking costs and progress, and
      visualizing work with Gantt and network views.
  timeline:
    - >
      2000s: Greg Titus's side project became OmniPlan within The Omni Group's
      productivity suite.
    - '2006: The first generation of OmniPlan was publicly released for Mac.'
    - >
      2016: OmniPlan 3 introduced a redesigned interface and expanded planning and
      analysis features.
    - '2020: OmniPlan 4 began the current major product generation.'
    - >
      2026: The Omni Group continued publishing OmniPlan 4 updates across Mac, iOS, and
      Apple Vision Pro.
  usage:
    - >
      Create a project, choose forward or backward scheduling, add tasks and milestones,
      connect dependencies, define calendars, assign resources and costs, level the
      schedule, and save a baseline for later progress comparison.
    - >
      Use Gantt, task, resource, calendar, and network views to inspect the plan. Pro
      workflows add features for collaboration, multi-project review, reporting,
      simulations, and automation; project documents are saved wherever the user
      chooses.
