history:
  adoption-history:
    - >
      The official README documents Homebrew installation with dependencies handled by
      brew, plus mise and Go installation paths where the user installs universal-ctags
      separately. The input package facts also list apk and Nix packages, suggesting
      packaging interest beyond macOS.
  package-nerd-significance:
    - >
      The package is significant as a bridge between old tag-file tooling and modern
      editor LSP plumbing. It lets package managers compose universal-ctags with an LSP
      executable rather than requiring language-specific servers for every file type.
  project-history:
    - >
      The visible GitHub release line begins in late 2024. The README describes the
      design as intentionally modest: on startup the server runs universal-ctags, keeps
      the resulting index in memory, and serves completion, go-to-definition, and symbol
      requests without creating or updating tag files.
  related-projects:
    - >
      ctags-lsp depends on universal-ctags for indexing and is historically related to
      editor tag navigation, but its user-facing protocol is LSP rather than direct
      editor tag-file lookup.
  sources:
    - https://github.com/netmute/ctags-lsp#readme
    - https://github.com/netmute/ctags-lsp/releases
    - https://github.com/universal-ctags/ctags
  summary:
    - >
      ctags-lsp is a Language Server Protocol implementation that uses universal-ctags
      as its indexing backend. It is meant to provide a minimal, broadly available
      language-server experience for projects that do not have a dedicated language
      server configured.
  timeline:
    - '2024: First visible GitHub releases in the v0.2.x-v0.4.x series.'
    - '2024: README documented Homebrew, mise, and Go installation methods.'
    - '2026: Development README identifies v0.11.0 as the last release documentation line.'
  usage:
    - >
      ctags-lsp is used from editors with LSP clients, with official examples for Neovim
      and Helix. Advanced options focus on startup control: choosing the ctags binary,
      passing language filters through to ctags, using a preexisting tagfile, and
      setting worker jobs.
related-packages:
  - id: brew:universal-ctags
    reason: >
      Universal Ctags is the documented indexing backend that ctags-lsp runs to produce
      its in-memory symbol index, and it must be installed separately outside Homebrew's
      dependency-managed installation.
    rel: adjacent_workflow
    sources:
      - https://github.com/netmute/ctags-lsp
      - https://github.com/universal-ctags/ctags
