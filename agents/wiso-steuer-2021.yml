history:
  adoption-history:
    - >
      Buhl offered WISO Steuer-Mac 2021 as one member of a multi-edition family spanning
      Web, Windows, Mac, Start, Plus, and adviser-oriented products.
    - >
      The edition supported Buhl's cross-platform account model: official guidance
      explains how licensed PC or Mac users could activate Web and tablet submission
      capabilities using a personal buhl:Konto.
  package-nerd-significance:
    - >
      The year in this cask's identity determines the tax material it can process. Buhl
      states that annual releases can edit only their corresponding tax year.
    - >
      The separate cask therefore preserves a reproducible route to the 2020 German
      assessment-year application instead of treating every yearly release as
      interchangeable.
  project-history:
    - >
      WISO Steuer-Mac 2021 was Buhl's macOS tax-preparation edition for the 2020
      assessment year.
    - >
      Official feature documentation lists macOS support, ELSTER-related online
      requirements, guided preparation, interview-style input, data retrieval, tax
      calculation, and electronic filing capabilities.
  related-projects:
    - WISO steuer:Mac 2020 preceded this edition for assessment year 2019.
    - >
      The 2021 product family also included WISO Steuer WEB, SPARBUCH, START, PLUS, and
      BERATER.
  sources:
    - https://forum.buhl.de/wcf/index.php?file-download%2F30211%2F=
    - https://www.buhl.de/kundencenter/updates
    - https://www.buhl.de/shop/faqs?article=2373
    - https://www.buhl.de/shop/faqs?article=655
  summary:
    - >
      WISO Steuer-Mac 2021 is Buhl's proprietary macOS application for preparing the
      German income-tax declaration for assessment year 2020.
  timeline:
    - '2020–2021: Buhl distributed WISO Steuer-Mac 2021 for the 2020 tax declaration.'
    - >
      2021: The edition appeared alongside Web, Windows, Start, Plus, and adviser
      variants in Buhl's product comparison.
    - >
      Later releases: Buhl retained the 2021 edition in its legacy update center because
      each annual release remains tied to a particular tax year.
  usage:
    - >
      Users import eligible prior-year information, enter income and deductible expenses
      through a guided workflow, retrieve supported tax data, calculate the expected
      result, and prepare electronic submission through ELSTER-related functionality.
    - >
      A buhl:Konto is used when registering the software or activating associated Web
      and app submission access. The account itself is managed by the service; no
      official local credentials-file path is documented.
