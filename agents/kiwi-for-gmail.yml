history:
  adoption-history:
    - >
      Kiwi is aimed at Gmail and Google Workspace users who prefer desktop windows and
      native notifications to browser tabs. The vendor says usage increased during the
      shift toward remote work and that the product is used by individuals and
      organizational Google Workspace customers.
    - >
      The product was formerly distributed through the Mac App Store. Zive later moved
      Mac sales, upgrades, and updates to its own website so releases would not depend
      on the store's review process.
  package-nerd-significance:
    - >
      For Homebrew Cask users, Kiwi represents a proprietary desktop wrapper around an
      otherwise browser-centered cloud office stack. It is useful when a Mac setup needs
      Gmail and Workspace accounts available as conventional desktop applications.
    - >
      The cask is especially relevant to users managing multiple Google accounts who
      want one reproducible installation command for their desktop workspace client.
  project-history:
    - >
      Zive, Inc. developed Kiwi for Gmail to turn Gmail and Google Workspace into a
      desktop-oriented office environment for macOS and Windows.
    - >
      Kiwi 3.0 was presented as a ground-up rebuild with expanded plug-in support,
      offline Gmail, account-management improvements, and support for Apple Silicon
      through Rosetta. Later releases expanded the product with tabbed workspaces and
      the XO AI companion.
  related-projects:
    - >
      Gmail and Google Workspace provide the mail, calendar, document, spreadsheet,
      presentation, chat, and storage services surfaced through Kiwi.
    - >
      The official site states that Kiwi is developed independently and is not sponsored
      by or affiliated with Google, Apple, or Microsoft.
  sources:
    - https://www.kiwiforgmail.com/
    - https://www.kiwiforgmail.com/about-3
    - https://www.kiwiforgmail.com/kiwi-for-gmail-quick-start-guide
    - >
      https://www.kiwiforgmail.com/post/bye-bye-to-the-mac-app-store-kiwi-for-gmail-is-now-web-based
    - https://www.kiwiforgmail.com/post/kiwi-for-gmail-3-0-has-arrived
  summary:
    - >
      Kiwi for Gmail is Zive's proprietary desktop client and office suite for Gmail and
      Google Workspace on macOS and Windows.
  timeline:
    - '2023: Zive announced Kiwi for Gmail 3.0 as a ground-up rebuild.'
    - "2023: Kiwi distribution moved away from the Mac App Store to the vendor's website."
    - '2024: Kiwi introduced its XO AI companion.'
  usage:
    - >
      On first launch, users authenticate through Google's sign-in portal with a Gmail
      or licensed Google Workspace account. Additional supported Google accounts can
      then be added and switched from Kiwi's desktop interface.
    - >
      Kiwi exposes Gmail alongside services such as Calendar, Drive, Docs, Sheets,
      Slides, and Chat, with features including separate windows, notifications,
      recent-document recall, focus filtering, and multi-account workflows.
