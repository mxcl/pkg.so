credentials-file-location: null
history:
  adoption-history:
    - >
      bumpp gained traction in the Node and TypeScript tooling world because it fits the
      `npx`/`pnpm dlx` style of one-off release commands. It is especially convenient
      for package.json-based libraries and monorepos that want an interactive release
      bump without a larger release-management platform.
  package-nerd-significance:
    - >
      bumpp is a package-nerd tool because it automates the tiny but important ritual
      around npm releases: editing package metadata, producing Git tags, and making
      release commits predictable. Its design reflects modern JavaScript preferences for
      interactive CLIs, TypeScript config files, and monorepo-aware workflows.
  project-history:
    - >
      The README states that bumpp was forked from `version-bump-prompt` and renamed so
      users could run it directly as `npx bumpp`. The fork added confirmation before
      bumping, default commit/tag/push behavior, monorepo recursion, command execution
      hooks, Conventional Commits defaults, ESM and CJS bundles, and `bump.config.ts`
      support.
    - >
      npm registry metadata shows the package appearing in July 2020 and continuing
      through major releases into 2026. The GitHub release feed shows v11.0.0 in March
      2026 raising the Node requirement and v11.1.0 in May 2026 fixing CLI and Git push
      behavior.
  related-projects:
    - >
      Related tools include `version-bump-prompt`, npm version, changesets,
      semantic-release, release-it, and conventional-changelog based release flows.
  sources:
    - https://github.com/antfu-collective/bumpp
    - https://github.com/antfu-collective/bumpp/releases
    - https://raw.githubusercontent.com/antfu-collective/bumpp/main/README.md
    - https://registry.npmjs.org/bumpp
  summary:
    - >
      bumpp is an interactive JavaScript/TypeScript version-bump CLI for projects that
      want to bump package versions, commit, tag, push, and optionally run commands in
      one prompt-driven flow.
  timeline:
    - '2020-07: First npm publication of the bumpp package line.'
    - '2021-09: 7.x releases continued the post-fork package series.'
    - '2022-06: 8.x releases followed in the npm registry timeline.'
    - '2026-03: v11.0.0 introduced a breaking Node requirement update.'
    - '2026-05: v11.1.0 fixed config and Git push edge cases.'
  usage:
    - >
      Developers usually run `bumpp` in a repository, choose the next version
      interactively, and let the tool update files, make a Git commit, create a tag,
      push changes, and run configured commands. Projects that need repeatable behavior
      can define options in `bump.config.ts`.
related-packages:
  - id: brew:release-it
    reason: >
      Choose release-it when you need configurable npm publication, GitHub or GitLab
      releases, changelog plugins, and unattended CI mode; choose bumpp for a lighter
      interactive version-bump flow with monorepo recursion.
    rel: alternative
    sources:
      - https://github.com/antfu-collective/bumpp#readme
      - https://github.com/release-it/release-it#readme
