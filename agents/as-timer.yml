history:
  adoption-history:
    - >
      AS Timer is offered free of charge for macOS, both from the Mac App Store and as a
      signed disk image from Alinof Software. It is also available through the Homebrew
      cask `as-timer`.
  package-nerd-significance:
    - >
      The application is a small example of a desktop utility that remains GUI-oriented
      while exposing startup arguments suitable for shell scripts and AppleScript
      automation.
  project-history:
    - >
      Alinof Software states that AS Timer has evolved since 2011. It is positioned as
      the free, simpler sibling of AS TimerPRO.
  related-projects:
    - AS TimerPRO is Alinof Software's more capable companion product.
  sources:
    - >
      Official AS Timer product page:
      https://www.alinofsoftware.ch/apps/products-timer/index.html
  summary:
    - >
      AS Timer is a free, sandboxed macOS countdown timer from Alinof Software. It
      provides a minimal graphical workflow and can also be launched with timer
      parameters from Terminal or AppleScript.
  timeline:
    - >
      2011: Alinof Software identifies this as the beginning of AS Timer's continuing
      evolution.
    - >
      2026: The product remained available for current macOS releases, Intel Macs, and
      Apple Silicon.
  usage:
    - >
      Set hours, minutes, and seconds with the mouse and press Start; the app displays a
      message and sounds an alarm when time expires. Automation can invoke the
      application executable with bracketed `SetHours`, `SetMinutes`, `SetSeconds`, and
      `Start` arguments.
