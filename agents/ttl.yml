history:
  adoption-history:
    - >
      The README lists installation paths through crates.io, Homebrew core, Alpine
      edge/testing, Arch AUR, Gentoo, NetBSD pkgsrc, Nix, GitHub release binaries, and
      Docker images. That spread is unusually broad for a young network CLI and reflects
      its appeal to package users who want a current alternative to stock
      traceroute/mtr.
    - >
      The GitHub page describes ttl as a better mtr and lists topics such as Rust, CLI,
      terminal, networking, latency, geolocation, ICMP, TUI, traceroute, network
      visualization, mtr, ASN lookup, and Ratatui.
  package-nerd-significance:
    - >
      ttl is significant to package nerds because it packages a modern
      terminal-networking stack: Rust, Ratatui, cross-platform raw socket handling,
      package-manager install paths, and ops-friendly exports in one binary.
    - >
      It also shows how newer CLIs compete with entrenched Unix tools by keeping the
      familiar traceroute mental model while adding structured output and observability
      hooks that fit scripted and containerized environments.
  project-history:
    - >
      The official README describes ttl as a network diagnostic tool that goes beyond
      traceroute, with route flap alerts, IX identification, NAT detection, MTU
      discovery, and multi-target tracing. Its Cargo metadata identifies the package as
      a command-line network diagnostic utility and points to the GitHub repository.
    - >
      The changelog shows active release work through 2026. Version 0.15.0 in January
      2026 added animated replay and event recording; later releases added ECMP
      classification, NetBSD support, replay controls, daemon mode, Prometheus export,
      Docker publishing, trace diffing, and platform-specific raw-socket fixes.
  related-projects:
    - traceroute and mtr are the classic tools ttl explicitly builds beyond.
    - Ratatui and crossterm provide the terminal UI stack named in Cargo dependencies.
    - >
      PeeringDB, MaxMind GeoIP data, and ASN lookups are adjacent data sources used for
      ttl's enrichment features.
  sources:
    - https://github.com/lance0/ttl#readme
    - https://github.com/lance0/ttl/blob/master/CHANGELOG.md
    - https://github.com/lance0/ttl/blob/master/Cargo.toml
    - https://github.com/lance0/ttl/blob/master/docs/FEATURES.md
    - source_facts.package-manager
  summary:
    - >
      ttl is a modern Rust traceroute and mtr-style terminal tool with a real-time TUI,
      per-hop statistics, ASN and GeoIP enrichment, ECMP detection, path MTU discovery,
      and machine-readable exports.
    - >
      Its package-manager niche is the contemporary network-debugging CLI: a single
      command that blends classic traceroute behavior with TUI observability, structured
      output, and daemon-friendly monitoring.
  timeline:
    - '2026-01: Version 0.15.0 added animated replay and probe event recording.'
    - '2026-02: Version 0.18.1 added experimental NetBSD support.'
    - >
      2026-06: Version 0.20.0 added daemon mode, Prometheus export, Docker publishing,
      streaming JSON, and trace diffing.
    - '2026-06: Version 0.20.1 fixed macOS/BSD probe TTL behavior and updated dependencies.'
  usage:
    - >
      The README's quick start shows `ttl 8.8.8.8` on Linux after granting
      `cap_net_raw`, `sudo ttl 8.8.8.8` on macOS/BSD, UDP probing, multi-flow ECMP path
      discovery, path MTU discovery, multiple targets, and resolve-all tracing.
    - >
      For automation, ttl supports JSON, CSV, text reports, line-delimited JSON
      streaming, saved-session replay, diffing, daemon mode, Prometheus metrics, Docker,
      and shell completions.
