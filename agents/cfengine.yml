id: brew:cfengine
display-name: CFEngine
repo: https://github.com/cfengine/core
docs:
  - https://docs.cfengine.com/
  - https://docs.cfengine.com/docs/3.27/overview/directory-structure
  - https://github.com/cfengine/core#readme
config-file-location:
  unix:
    - /var/cfengine/masterfiles
    - /var/cfengine/inputs
credentials-file-location:
  unix:
    - /var/cfengine/ppkeys
history:
  adoption-history:
    - >
      The official overview says CFEngine runs across many platforms, from embedded
      devices through servers, cloud systems, and mainframes, and can handle tens or
      hundreds of thousands of hosts. The input package facts show it packaged for
      Homebrew and Alpine.
  package-nerd-significance:
    - >
      CFEngine matters in package-manager culture because it is one of the classic
      Unix-native configuration management agents: a pile of small `cf-*` binaries, a
      private `/var/cfengine` workspace, local convergence, and policy-as-code before
      that term became fashionable.
  project-history:
    - >
      The CFEngine core README says CFEngine was originally created by Mark Burgess and
      that CFEngine 3 is a popular open source configuration management system for
      automated configuration and maintenance of large-scale computer systems. The same
      README describes CFEngine 3 as a significant, incompatible generation after
      CFEngine 2.
  related-projects:
    - >
      Official source repositories include `cfengine/core`, `cfengine/masterfiles`,
      `cfengine/documentation`, `cfengine/cf-remote`, and `cfengine/buildscripts`.
    - CFEngine's documentation links the system to Promise Theory.
  sources:
    - https://api.github.com/repos/cfengine/core
    - https://github.com/cfengine/core
    - https://cfengine.com/
    - https://docs.cfengine.com/
    - https://docs.cfengine.com/docs/3.27/overview/directory-structure
    - https://github.com/cfengine/core#readme
    - https://formulae.brew.sh/api/formula/cfengine.json
  summary:
    - >
      CFEngine is a long-running open source configuration management and infrastructure
      automation system. Official docs describe lightweight C-based agents that
      continually converge machines toward desired state written in the CFEngine policy
      language.
  timeline:
    - >
      CFEngine 2 era: CFEngine 3 kept enough server protocol compatibility to support
      gradual upgrades.
    - '2012: Official `cfengine/core` GitHub repository metadata records repository creation.'
    - >
      CFEngine 3: Official README documents a more powerful but
      policy-language-incompatible generation.
  usage:
    - >
      Administrators write desired state in `.cf` policy files, normally stored under
      `/var/cfengine/masterfiles` on policy hubs and cached into `/var/cfengine/inputs`
      on clients before local `cf-agent` execution.
related-packages:
  - id: brew:ansible
    reason: >
      Choose Ansible when agentless, SSH-driven YAML playbooks are preferable to
      CFEngine's continuously running local agents and promise-based policy model.
    rel: alternative
    sources:
      - https://docs.cfengine.com/docs/3.27/overview/how-cfengine-works/
      - https://docs.ansible.com/projects/ansible/latest/getting_started/introduction.html
