history:
  adoption-history:
    - >
      Glade became a standard tool in GNOME and GTK packaging because it gave
      application authors a visual way to edit interface definitions while still keeping
      those definitions portable across GTK language bindings. Its package metadata
      appears across common Unix-like package managers, including Homebrew,
      Debian-family systems, Fedora-family systems, Arch, Nix, MacPorts, MSYS2, and
      Flatpak.
  package-nerd-significance:
    - >
      For package maintainers, Glade is significant because it packages both a desktop
      application and the libgladeui tooling around GTK catalogs, templates, and preview
      support. It is also a useful marker for the GTK 2 to GTK 3 transition because the
      project documents Glade 3.8 as the branch for GTK 2 work while later releases
      target GTK 3.
  project-history:
    - >
      The GNOME project distributes Glade as a free-software user-interface designer,
      with archived release series reaching back to the 0.x and 1.x eras and later 2.x
      and 3.x branches. The 3.x line became the GTK 3-oriented branch, while Glade 3.8
      remained the documented path for projects that still needed GTK 2 support.
    - >
      Glade evolved alongside GTK's move toward GtkBuilder XML and template-based widget
      classes. Its release notes show continued adaptation to GNOME application
      conventions, Meson builds, JavaScript widget support, GTK 3.24, and fixes for
      GtkBuilder and template workflows.
  related-projects:
    - GTK, GNOME, GtkBuilder, GNOME Builder, Flatpak, MSYS2, Homebrew.
  sources:
    - https://download.gnome.org/sources/glade/
    - https://gitlab.gnome.org/GNOME/glade/-/raw/master/NEWS
    - https://gitlab.gnome.org/GNOME/glade/-/raw/master/README.md
    - https://glade.gnome.org/
  summary:
    - >
      Glade is a graphical interface designer for GTK and GNOME applications. It belongs
      to the long line of desktop RAD tools, but its lasting role in the GTK world comes
      from producing declarative interface files that applications load through
      GtkBuilder rather than from generating application code.
  timeline:
    - '1999: GNOME source archives include early Glade release series such as 0.5 and 0.6.'
    - '2011: Glade 3.8 is documented as the GTK 2-compatible branch.'
    - '2020: Glade 3.38 adds automatic template loading and JavaScript widget support.'
    - '2022: Glade 3.40.0 is released as the last stable release noted by the project site.'
  usage:
    - >
      Practitioners use Glade to sketch and maintain GTK interfaces, save them as XML,
      and load those files from C, Python, Vala, Java, Perl, C#, and other GTK bindings
      through GtkBuilder. The command-line companion glade-previewer supports testing
      interface files outside the full application.
related-packages:
  - id: brew:gtk4
    reason: >
      Use GTK with Glade because GTK's GtkBuilder loads the XML interface descriptions
      produced by Glade; GTK 4 is the current toolkit generation, while this final Glade
      line primarily reflects GTK 3-era workflows.
    rel: adjacent_workflow
    sources:
      - https://infrastructure.pages.gitlab.gnome.org/glade-web/
      - https://www.gtk.org/docs/
      - https://gnome.pages.gitlab.gnome.org/gtk/gtk3/getting_started.html
