history:
  adoption-history:
    - >
      SQLPro for Postgres targets macOS users who prefer a focused native PostgreSQL
      client rather than a broad Java- or Electron-based database IDE. It is available
      through direct download, the Mac App Store, and Homebrew Cask.
    - >
      The product sits within the wider SQLPro family, whose related editions offer
      focused clients for individual database engines and a Studio edition for
      multi-database work.
  package-nerd-significance:
    - >
      The application supplies a lightweight, engine-specific PostgreSQL GUI for
      package-managed Mac workstations. Its appeal is the combination of native desktop
      behavior with common database-client essentials such as object browsing, query
      editing, autocomplete, table design, and simultaneous result sets.
  project-history:
    - >
      SQLPro for Postgres is a proprietary Hankinsoft database client from the same
      independently developed family as SQLPro for MSSQL, SQLPro for MySQL, SQLPro for
      SQLite, and SQLPro Studio. The developer states that his native macOS and iOS
      application work began in 2010.
    - >
      The official Postgres product site identifies Hankinsoft Development and presents
      the application as a dedicated macOS PostgreSQL manager focused on core querying
      and table-management workflows.
  related-projects:
    - SQLPro Studio is the related multi-database product.
    - Other focused SQLPro editions target Microsoft SQL Server, MySQL, and SQLite.
    - >
      PostgreSQL is the database server managed by the application; SQLPro for Postgres
      is a client rather than a PostgreSQL distribution.
  sources:
    - https://macpostgresclient.com/
    - https://www.macsqlclient.com/blog/15-license-key-faq
    - source_facts.package-manager.brew-cask
  summary:
    - >
      SQLPro for Postgres is a proprietary native macOS client for querying and managing
      PostgreSQL databases.
  timeline:
    - '2010: Developer Kyle Hankinson began building native macOS and iOS applications.'
    - '2015: The copyright range shown by the official Postgres product site begins.'
    - >
      2021: The SQLPro licensing FAQ documented SQLPro for Postgres as part of the
      independently developed product family.
  usage:
    - >
      Users connect to PostgreSQL databases, browse and design tables, write custom SQL
      with syntax highlighting and autocomplete, edit selected result cells, and execute
      several queries while viewing their result sets, errors, and messages
      concurrently.
