config-file-location:
  macos:
    - ~/Library/LaunchAgents/com.macmon.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Homebrew, MacPorts, Cargo, and Nix, and
      the batch input also records Homebrew, MacPorts, and Nix packages. Repository
      metadata captured during this run showed more than one thousand GitHub stars
      within roughly two years of creation, suggesting fast adoption among Apple Silicon
      power users and monitoring hobbyists.
  package-nerd-significance:
    - >
      macmon is notable because Apple Silicon telemetry is useful to developers running
      local AI models, compilers, benchmarks, and long-lived services, but official
      user-facing tools expose only part of that picture. A package-manager-installable
      TUI plus Prometheus endpoint makes Mac hardware metrics fit into Unix-style
      pipelines and observability stacks.
  project-history:
    - >
      The official repository was created in June 2024. The README states that the
      project was motivated by a need to observe Apple Silicon power consumption while
      testing local LLM models, without relying on `powermetrics` workflows that require
      root privileges.
    - >
      macmon expanded beyond a simple terminal display into JSON output, an HTTP metrics
      server, Prometheus-format metrics, a Grafana example, launchd service installation
      for `macmon serve`, and a Rust library API for embedding the sampler in other
      programs.
  related-projects:
    - >
      The README explicitly compares the motivation with `asitop` and `powermetrics`,
      and documents integration with Prometheus and Grafana.
  sources:
    - https://api.github.com/repos/vladkens/macmon
    - https://api.github.com/repos/vladkens/macmon/releases
    - https://github.com/vladkens/macmon
    - https://github.com/vladkens/macmon#readme
    - source_facts.package-manager
  summary:
    - >
      macmon is a Rust system-monitoring CLI and TUI for Apple Silicon Macs. Its README
      emphasizes sudoless access to live power, temperature, CPU, GPU, ANE, memory, and
      fan metrics.
  timeline:
    - '2024: Official GitHub repository created.'
    - '2024: 0.4.x releases published late in the year.'
    - '2025: 0.6.x releases added to the release stream.'
    - '2026: 0.7.x releases published, with docs covering HTTP metrics and library use.'
  usage:
    - >
      Interactive use runs the TUI at a configurable interval. Scripted use centers on
      `macmon pipe` for JSON samples, while monitoring-stack use centers on `macmon
      serve`, which exposes `/json` and `/metrics` endpoints and can install a launchd
      agent at `~/Library/LaunchAgents/com.macmon.plist`.
related-packages:
  - id: brew:asitop
    reason: >
      Choose asitop for the original Python and `powermetrics`-based Apple Silicon
      monitor; choose macmon when rootless operation, per-process data, JSON or
      Prometheus output, and a Rust library matter more.
    rel: alternative
    sources:
      - https://github.com/vladkens/macmon#readme
      - https://github.com/tlkh/asitop#readme
