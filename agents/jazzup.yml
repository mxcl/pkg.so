history:
  adoption-history:
    - >
      JazzUp was offered as a free experimental download rather than as a finished
      commercial product. Its official listing targets Mac OS X 10.6 or later.
  package-nerd-significance:
    - >
      JazzUp belongs to the tradition of whimsical, narrowly scoped macOS menu-bar
      utilities frequently preserved and redistributed through package-manager casks
      long after their beta-era debut.
  project-history:
    - >
      Irradiated Software released JazzUp as an experimental Mac utility. The surviving
      official release is identified as version 1.0 beta 3.
  related-projects:
    - >
      Irradiated Software groups JazzUp with its other experimental Mac utilities,
      including FinderMinder, KeyUp, and ShortcutDetective.
  sources:
    - https://www.irradiatedsoftware.com/downloads/
    - https://www.irradiatedsoftware.com/labs/
  summary:
    - >
      JazzUp is a small macOS menu-bar utility that plays themed sound effects as the
      user types.
  timeline:
    - >
      Version 1.0 beta 3: Officially listed as a free experimental download for Mac OS X
      10.6 or later.
  usage:
    - >
      Users run JazzUp in the menu bar and select a sound theme, such as its documented
      Cherry MX theme, to add audible effects to keyboard input.
