history:
  adoption-history:
    - >
      ct was adopted by operators and image builders who needed reproducible first-boot
      configuration for Container Linux and Flatcar machines. Its Homebrew formula
      matters because macOS laptops often acted as the workstation side of a cloud or
      bare-metal provisioning workflow.
  package-nerd-significance:
    - >
      coreos-ct is a packaging fossil with useful context: the package name preserves
      CoreOS-era terminology, while the maintained upstream and docs are
      Flatcar-oriented. That distinction helps users pick between ct for Flatcar
      Container Linux and FCCT for Fedora CoreOS.
  project-history:
    - >
      ct comes from the Container Linux provisioning model: operators wrote a
      higher-level YAML configuration and transpiled it into the lower-level Ignition
      format consumed during first boot. The official Flatcar repository describes ct as
      the utility responsible for transforming a human-friendly Container Linux Config
      into a JSON file for provisioning a Container Linux machine.
    - >
      After the CoreOS Container Linux lineage moved into successor systems, Flatcar
      maintained the Container Linux Config Transpiler for Flatcar Container Linux
      users. The README explicitly distinguishes it from Fedora CoreOS's FCCT, which
      serves the Fedora CoreOS equivalent use case.
  related-projects:
    - >
      ct is related to Ignition, Flatcar Container Linux, historical CoreOS Container
      Linux provisioning, and Fedora CoreOS Config Transpiler.
  sources:
    - https://github.com/flatcar/container-linux-config-transpiler
    - https://github.com/flatcar/container-linux-config-transpiler#readme
    - https://github.com/flatcar/container-linux-config-transpiler/releases
    - https://www.flatcar.org/docs/latest/provisioning/cl-config/
    - https://github.com/coreos/fcct
  summary:
    - >
      Container Linux Config Transpiler, usually invoked as ct, converts a
      human-friendly Container Linux Config into Ignition JSON for first-boot machine
      provisioning. In Homebrew it remains visible under the historical coreos-ct
      package name, while the current upstream lives under Flatcar.
  timeline:
    - '2018: flatcar/container-linux-config-transpiler repository created.'
    - '2021-2022: v0.9.x Flatcar ct releases published.'
    - >
      2020s: Flatcar documentation continues to document ct for Container Linux Config
      to Ignition workflows, while README points Fedora CoreOS users to FCCT.
  usage:
    - >
      A typical workflow writes a Container Linux Config file, runs ct to produce
      Ignition JSON, then supplies that JSON to a Container Linux or Flatcar machine at
      first boot. The tool does not have a persistent user config file or credential
      store; the input config is the artifact being transformed.
related-packages:
  - id: brew:butane
    reason: >
      Use Butane for new human-readable Flatcar or Fedora CoreOS configurations because
      it is the documented successor that emits current Ignition configurations, while
      ct is retained for the deprecated Container Linux Config format.
    rel: alternative
    sources:
      - https://www.flatcar.org/docs/latest/fb-provision/cl-config/
      - https://coreos.github.io/butane/
