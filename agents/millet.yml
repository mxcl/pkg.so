history:
  adoption-history:
    - >
      Millet's practical role is editor tooling for a niche language rather than a
      general compiler. Its README says it analyzes SML without running it and offers
      inline diagnostics, hover type and documentation, inlay hints, jump to definition,
      completions, code actions, document symbols, and find references. It understands
      multi-file projects through SML/NJ Compilation Manager files and ML Basis files,
      with configuration through `millet.toml`, VS Code settings, language-server
      initialization, and ML Basis annotations.
  project-history:
    - >
      The same development narrative describes an early 2020 first attempt, a dormant
      period, and a May 2022 revival after Davis saw interest from a CMU student
      Discord. The revived implementation was rewritten around language-server needs:
      partial and malformed code should still produce useful diagnostics, and the
      project split the old code into crates, modernized tests, and replaced the earlier
      design with a more robust implementation.
  sources:
    - https://azdavis.net/posts/millet/
    - https://formulae.brew.sh/formula/millet
    - https://github.com/azdavis/millet
    - https://github.com/azdavis/millet/blob/main/docs/manual.md
  summary:
    - >
      Millet is a Rust language server for Standard ML by Andrew Davis. Davis introduced
      it publicly in a July 2, 2022 blog post, explaining that the idea came from his
      experience as a Carnegie Mellon undergraduate and teaching assistant for 15-150,
      an introductory functional programming course taught in Standard ML. The original
      motivation was to reduce the friction of compiler-error loops and give SML
      programmers editor feedback similar to modern language ecosystems.
  usage:
    - >
      The package-manager niche is small but useful: official distribution includes a VS
      Code extension, Open VSX publication, and GitHub release binaries, while community
      packaging includes Homebrew, Nixpkgs, and AUR. It sits alongside SML/NJ and MLton
      rather than replacing them; users still need an SML implementation to run code,
      while Millet supplies the language-server layer for VS Code-compatible editors and
      other LSP-capable editors.
related-packages:
  - id: brew:smlnj
    reason: >
      Use SML/NJ to compile or run Standard ML projects described by Compilation Manager
      files while Millet supplies editor analysis for those same files.
    rel: adjacent_workflow
    sources:
      - https://github.com/azdavis/millet/blob/main/docs/manual.md
      - https://www.smlnj.org/doc/CM/
  - id: brew:mlton
    reason: >
      Use MLton for whole-program native compilation of Standard ML projects whose ML
      Basis files can also define Millet's analysis workspace.
    rel: adjacent_workflow
    sources:
      - https://github.com/azdavis/millet/blob/main/docs/manual.md
      - https://www.mlton.org/Documentation
