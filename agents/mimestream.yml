history:
  adoption-history:
    - >
      Mimestream reported that more than 167,000 users joined its public beta. Its
      adoption has centered on Mac users who want native Gmail features without using
      Gmail's browser interface.
  package-nerd-significance:
    - >
      Mimestream represents the proprietary, independently distributed Mac application
      commonly managed with Homebrew Cask. It is also an example of an email client
      built around a provider API instead of traditional IMAP.
  project-history:
    - >
      Mimestream was founded in 2019 by Neil Jhaveri, a former Apple Mail and Notes
      engineering manager and software engineer. A public beta opened in fall 2020.
    - >
      Version 1.0 launched in May 2023 after more than two years of public beta testing.
      The application uses the Gmail API and native Apple technologies.
  related-projects:
    - Gmail
    - Apple Mail
    - Homebrew Cask
  sources:
    - >
      Official 1.0 announcement and beta adoption figures:
      https://mimestream.com/blog/mimestream-launches
    - 'Official company history: https://mimestream.com/about'
    - 'Official help center: https://mimestream.com/help/'
  summary:
    - >
      Mimestream is a proprietary native macOS email client that connects directly to
      Gmail through the Gmail API.
  timeline:
    - '2019: Mimestream was founded.'
    - '2020: The public beta opened.'
    - '2023: Mimestream 1.0 was released.'
  usage:
    - >
      Users connect Google accounts to read, search, organize, and compose Gmail
      messages. The client supports Gmail concepts such as labels, inbox categories,
      aliases, server-side filters, and search, along with multiple accounts and unified
      inboxes.
