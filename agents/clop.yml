id: cask:clop
display-name: Clop
repo: https://github.com/FuzzyIdeas/Clop
docs:
  - https://github.com/FuzzyIdeas/Clop#readme
  - https://lowtechguys.com/clop
config-file-location: null
credentials-file-location:
  macos:
    - ~/Library/Application Support/Clop/
history:
  adoption-history:
    - >
      Clop is distributed directly by The Low-Tech Guys, through Homebrew Cask as clop,
      and as source code under GPLv3 on GitHub.
    - >
      The project adopted a freemium model with Clop 2 while remaining open source. Its
      documented workflow grew from clipboard-image optimization to video, PDF,
      watched-folder, Shortcuts, SDK, and command-line automation.
  package-nerd-significance:
    - >
      Clop combines a polished macOS menu-bar workflow with established command-line
      encoders including pngquant, jpegoptim, gifsicle, FFmpeg, libvips, gifski, and
      Ghostscript. It is attractive to automation-minded Mac users because the GUI,
      hotkeys, Shortcuts, CLI, watched folders, and SDK all expose the same local
      optimization workflow.
  project-history:
    - >
      Clop was created by Romanian developers The Low-Tech Guys as a clipboard optimizer
      for macOS. Its name comes from the Romanian word for a traditional straw hat.
    - >
      The project broadened into a local image, video, PDF, and clipboard optimizer.
      Clop 2 introduced its Pro tier alongside major additions such as video
      optimization, downscaling, watched paths, floating results, URL handling, and
      Shortcuts support, while later releases continued expanding media formats and
      batch workflows.
  related-projects:
    - ClopSDK
    - pngquant
    - jpegoptim
    - gifsicle
    - FFmpeg
    - libvips
    - gifski
    - Ghostscript
  sources:
    - Input field source_facts.package-manager.
    - >
      Official Clop 2 release notes:
      https://files.lowtechguys.com/ReleaseNotes/Clop-2.0.0.html
    - 'Official product documentation: https://lowtechguys.com/clop'
    - 'Official releases: https://github.com/FuzzyIdeas/Clop/releases'
    - 'Official repository: https://github.com/FuzzyIdeas/Clop'
  summary:
    - >
      Clop is an open-source macOS utility from The Low-Tech Guys that automatically or
      interactively optimizes images, videos, PDFs, and clipboard content on the local
      machine.
  timeline:
    - 'Initial generation: Clop begins as a macOS clipboard-image optimizer.'
    - >
      Clop 2: A freemium Pro tier and video, watched-folder, hotkey, floating-result,
      URL, and Shortcuts features are introduced.
    - >
      Clop 3: Supported media and workflow capabilities expand further, including
      additional formats and batch-oriented tools.
  usage:
    - >
      With Clop running, copied images can be optimized automatically. Users can also
      optimize selected Finder files, screen recordings, videos, and PDFs with hotkeys,
      drag-and-drop, watched folders, macOS Shortcuts, or the CLI. Originals can be
      retained in a backup folder, and processing normally occurs locally without
      sending file contents to a cloud service.
    - >
      Clop Pro activation uses license files under ~/Library/Application Support/Clop/,
      as documented by the official troubleshooting guide.
tags:
  - automation
  - clipboard
  - image-optimization
  - macos
  - open-source
  - pdf-compression
  - video-optimization
provenance:
  category-sources:
    - >
      The official product page also documents PDF and media optimization:
      https://lowtechguys.com/clop
    - source_facts.description identifies an image, video, and clipboard optimiser.
  display-name-sources:
    - >
      Official product-page and repository headings: https://lowtechguys.com/clop and
      https://github.com/FuzzyIdeas/Clop
    - current_curation.display-name
  docs-sources:
    - >
      The official product page is the primary documentation surface and includes
      features, automation, CLI examples, integration guidance, technical details, and
      troubleshooting.
    - The official repository README provides usage and implementation details.
  history-sources:
    - Input field source_facts.package-manager.
    - >
      Official Clop 2 release notes:
      https://files.lowtechguys.com/ReleaseNotes/Clop-2.0.0.html
    - 'Official product documentation: https://lowtechguys.com/clop'
    - 'Official releases: https://github.com/FuzzyIdeas/Clop/releases'
    - 'Official repository: https://github.com/FuzzyIdeas/Clop'
  repo-sources:
    - >
      The official product page links https://github.com/FuzzyIdeas/Clop as Clop's GPLv3
      source code repository.
    - >
      The repository links back to lowtechguys.com/clop and is owned by The Low-Tech
      Guys' FuzzyIdeas organization.
  tags-sources:
    - 'Official product documentation: https://lowtechguys.com/clop'
    - 'Official repository README: https://github.com/FuzzyIdeas/Clop#readme'
    - source_facts.description
category-confidence: high
category-path:
