history:
  adoption-history:
    - >
      Monodraw established a durable niche among developers who need diagrams that
      remain readable in source code, specifications, terminals, and Markdown. Helftone
      distributes it as a commercial Mac application, with both direct and Mac App Store
      editions; only the direct edition includes its command-line tool.
  package-nerd-significance:
    - >
      Monodraw applies a polished native GUI to a traditionally hand-crafted,
      text-native medium. Package users value it for producing version-control-friendly
      diagrams and for its direct edition's scriptable export workflow.
  project-history:
    - >
      Helftone developed Monodraw as a native macOS editor dedicated to ASCII and
      Unicode text art. It progressed from a public beta to a commercial release in
      2015.
    - >
      The application subsequently added and refined diagramming, mind-mapping,
      entity-relationship notation, FIGlet banners, image tracing, reusable snippets,
      and command-line export.
  related-projects:
    - Monodraw embeds FIGlet for text banners.
    - >
      Its plain-text output complements source editors, Markdown documentation,
      version-control systems, and terminal tools.
  sources:
    - 'Official Helftone blog: https://blog.helftone.com/'
    - 'Official product page: https://monodraw.helftone.com/'
  summary:
    - >
      Monodraw is a commercial native macOS editor for constructing ASCII and Unicode
      diagrams, flow charts, mind maps, entity-relationship diagrams, and banners.
  timeline:
    - '2015: Helftone released the Monodraw public beta.'
    - '2015: Monodraw shipped as a commercial application.'
    - >
      Later releases: The direct-download edition gained a command-line interface and
      JSON output.
  usage:
    - >
      Users arrange text, rectangles, connectors, mind maps, ER diagrams, and banners on
      an infinite character-aligned canvas, then copy the result as text or export PNG
      or SVG.
    - >
      The direct-download edition includes a CLI suitable for documentation generation
      and version-control hooks; the Mac App Store edition omits it because of sandbox
      restrictions.
