credentials-file-location:
  macos:
    - ~/Library/Caches/Bit/config/config.json
    - ~/.ssh/id_rsa
history:
  adoption-history:
    - >
      Bit's adoption has been strongest in JavaScript and TypeScript component
      ecosystems, especially teams trying to share UI or backend modules across
      monorepos and polyrepos. Its package-manager presence in Homebrew, MacPorts, Nix,
      and Scoop reflects a cross-platform CLI distribution strategy rather than a
      Unix-only tool.
    - >
      The project remains actively maintained: the GitHub repository shows continued
      activity in 2026 and release tags in the 1.13 series. The README also points users
      to Bit Cloud and a community space, which are central to the hosted-scope
      workflow.
  package-nerd-significance:
    - >
      For package nerds, Bit is interesting because it blurs the line between package
      manager, monorepo tool, component registry, and build orchestrator. It treats
      components as first-class packageable units instead of making the repository the
      only meaningful boundary.
    - >
      It also explains the Homebrew naming collision with `bit-git`: the simple `bit`
      formula belongs to Teambit's component workflow, while the modern Git helper is
      packaged as `bit-git`.
  project-history:
    - >
      The official teambit/bit repository was created in 2017. Its README describes Bit
      as a system for organizing source code into reusable components, with support for
      common JavaScript and TypeScript environments such as Node.js, React, Angular,
      Vue, React Native, and Next.js.
    - >
      Over time Bit expanded from a distributed component manager into a broader
      workspace, build, release, and cloud collaboration system. The current README
      emphasizes composable components, shell applications, CI, Bit Cloud scopes, and
      reusable templates for both developers and AI agents.
  related-projects:
    - Bit Cloud is the hosted scope and collaboration platform documented by the project.
    - >
      npm and standard JavaScript package managers consume exported Bit components as
      packages.
    - >
      Nx, Turborepo, and Lerna occupy adjacent monorepo and workspace-tooling territory,
      though Bit's component model is distinct.
    - >
      React, Angular, Vue, Node.js, React Native, and Next.js are official environment
      targets named in the README.
  sources:
    - https://api.github.com/repos/teambit/bit
    - https://api.github.com/repos/teambit/bit/releases
    - https://bit.dev/docs
    - https://github.com/teambit/bit
    - https://raw.githubusercontent.com/teambit/bit/master/README.md
    - input.json source_facts.package-manager
  summary:
    - >
      Bit is Teambit's component-oriented development platform and CLI. It started as a
      way to manage and share code components across repositories, and its current
      documentation frames it as a build system for composing components, applications,
      and AI-assisted development workspaces.
  timeline:
    - '2017: The teambit/bit repository is created.'
    - >
      Late 2010s: Bit is presented as a distributed code component manager for sharing
      components across projects.
    - >
      2020s: Bit grows into a component workspace and build system tied to Bit Cloud
      scopes and JavaScript/TypeScript environments.
    - '2026: The project continues publishing 1.13.x releases and active repository updates.'
  usage:
    - >
      Typical usage starts with installing Bit, running `bit init --default-scope`,
      creating components or applications with `bit create`, previewing them with the
      Bit UI or `bit run`, versioning them with `bit tag`, and exporting them with `bit
      export`.
    - >
      Bit is most useful when a team wants code units to have their own build, test,
      version, dependency, and release lifecycle while still living inside existing
      repositories or workspaces.
related-packages:
  - id: brew:nx
    reason: >
      Choose Nx when repository-wide project graphs, task orchestration, and computation
      caching are the primary concern; choose Bit when independently versioned and
      reusable components are the central unit of development.
    rel: alternative
    sources:
      - https://github.com/teambit/bit
      - https://nx.dev/docs
  - id: brew:pnpm
    reason: >
      pnpm can install and manage the JavaScript dependencies used by a Bit workspace,
      while Bit adds component-level composition, versioning, builds, and remote scopes.
    rel: adjacent_workflow
    sources:
      - https://bit.dev/reference/dependencies/configuring-dependencies/
      - https://pnpm.io/workspaces
