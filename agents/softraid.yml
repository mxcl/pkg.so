history:
  adoption-history:
    - >
      SoftRAID became associated with professional Mac storage and OWC multi-drive
      hardware. OWC states that it had worked with the SoftRAID team for nearly a decade
      before acquiring the company in 2014, after already supplying multi-drive products
      configured with SoftRAID. Windows support subsequently broadened the product
      beyond its Mac origins.
  package-nerd-significance:
    - >
      SoftRAID is an unusually system-sensitive cask because it manages RAID metadata,
      disk health, volumes, and historically a low-level driver. Compatibility with
      operating-system releases and storage hardware matters more than for an ordinary
      desktop application, so its extensive official changelogs and support guidance are
      operationally important.
  project-history:
    - >
      SoftRAID was developed as a software-controlled RAID system for Macs, providing
      additional RAID management and monitoring capabilities beyond basic
      operating-system tools. OWC acquired SoftRAID in 2014 and continued integrating it
      with OWC storage hardware. SoftRAID later added a Windows edition, Apple-silicon
      support, APFS support, administrative command-line functionality, and additional
      protected RAID levels.
  related-projects:
    - AppleRAID
    - Apple Disk Utility
    - OWC ThunderBay
    - OWC ThunderBlade
  sources:
    - https://software.owc.com/support/softraid/
    - https://software.owc.com/support/softraid/downloads/
    - https://software.owc.com/support/softraid/raid-levels/
    - https://www.owc.com/eu/why-we-are-here/our-history
    - >
      https://www.owc.com/news/owc-takes-data-protection-and-drive-performance-to-new-heights-with-softraid-standard-for-both-macos-and-windows-machines-and-softraid-pro-for-macs
  summary:
    - >
      SoftRAID is OWC's commercial software RAID management and monitoring suite for
      macOS and Windows. It creates and manages RAID volumes, monitors disk health,
      predicts failures, validates storage, and supports professional multi-drive
      workflows.
  timeline:
    - '2014: OWC acquired SoftRAID after working with its team for nearly a decade.'
    - '2020: SoftRAID for Windows received its initial release.'
    - '2021: SoftRAID 6 added macOS 11 and Apple-silicon support.'
    - '2021: SoftRAID 6.1 added APFS volume support.'
    - '2024: SoftRAID 8 added expanded Windows RAID and APFS capabilities.'
    - '2025: SoftRAID 8.5 added an expanded administrative command-line interface on macOS.'
  usage:
    - >
      Administrators use SoftRAID to initialize disks, create and manage RAID volumes,
      monitor disk health, validate storage, replace failed members, and collect
      diagnostic reports. Because these actions affect storage availability and data
      safety, users should maintain backups and verify the official operating-system
      compatibility guidance before installation or upgrades.
