id: brew:bibtex-tidy
display-name: bibtex-tidy
repo: https://github.com/FlamingTempura/bibtex-tidy
docs:
  - https://github.com/FlamingTempura/bibtex-tidy/blob/master/docs/options.md
  - https://flamingtempura.github.io/bibtex-tidy
  - https://github.com/FlamingTempura/bibtex-tidy#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bibtex-tidy fits the formatter wave that made source-formatting tools common in
      developer workflows: the README documents browser use, CLI installation through
      npm, a JavaScript/TypeScript API, Docker, and pre-commit usage.
    - >
      Homebrew and Nix packaging make it available to users who manage bibliography
      tooling alongside other command-line development utilities rather than through npm
      alone.
  package-nerd-significance:
    - >
      bibtex-tidy is package-nerd interesting because it brings the expectations of
      modern code formatters to the old BibTeX file format: deterministic output,
      pre-commit hooks, stdin/stdout behavior, Docker packaging, and npm/Homebrew/Nix
      distribution.
    - >
      It is especially useful for teams that store .bib files in source control and want
      noisy bibliography diffs reduced to stable, reviewable changes.
  project-history:
    - >
      The public GitHub repository begins with an initial commit in December 2017, and
      the package.json describes the project as 'Tidy bibtex files' with a bibtex-tidy
      command-line executable.
    - >
      The changelog records growth from basic cleanup into duplicate checking,
      multi-file operation, pre-commit integration, trailing commas, empty-field
      removal, wrapping, key generation, and a higher-performance parser.
  related-projects:
    - BibTeX is the bibliography format that bibtex-tidy parses and rewrites.
    - JabRef is referenced by bibtex-tidy's generated-key template support.
    - >
      pre-commit is a common integration point for using bibtex-tidy in
      source-controlled bibliography projects.
  sources:
    - https://api.github.com/repos/FlamingTempura/bibtex-tidy/commits?per_page=1&page=593
    - https://github.com/FlamingTempura/bibtex-tidy/blob/master/CHANGELOG.md
    - https://github.com/FlamingTempura/bibtex-tidy/blob/master/README.md
    - https://github.com/FlamingTempura/bibtex-tidy/blob/master/package.json
  summary:
    - >
      bibtex-tidy is a JavaScript/TypeScript formatter and cleaner for BibTeX files,
      shipped as a CLI, browser app, API, Docker image, and pre-commit hook.
  timeline:
    - '2017-12-02: Initial public GitHub commit.'
    - '2020: README media and project docs show an established browser and CLI workflow.'
    - >
      2021: v1.8.x changelog entries add a higher-performance parser, type definitions,
      and a new release process with tags.
    - >
      2023: v1.9.0 adds JabRef-style key generation, Docker configuration, URL-persisted
      web UI configuration, and a Svelte web UI rewrite.
    - '2024: v1.10.0 previews safer v2 CLI semantics for stdin/stdout and file modification.'
  usage:
    - >
      Typical usage is running bibtex-tidy against a .bib file to normalize indentation,
      field alignment, casing, URL encoding, field ordering, duplicates, and output
      behavior.
    - >
      The v1.10 changelog previews a v2-style safer CLI where files are not overwritten
      by default unless --modify is specified, reflecting the package's role in
      automated formatting pipelines.
related-packages:
  - id: cask:jabref
    reason: >
      Use JabRef to manage a BibTeX/BibLaTeX library graphically, then use bibtex-tidy
      to enforce repository-friendly formatting; bibtex-tidy also accepts JabRef-style
      key patterns.
    rel: adjacent_workflow
    sources:
      - https://github.com/FlamingTempura/bibtex-tidy#readme
      - https://docs.jabref.org/
  - id: brew:pre-commit
    reason: >
      Use pre-commit to run bibtex-tidy automatically on bibliography changes before
      they enter Git history.
    rel: adjacent_workflow
    sources:
      - https://github.com/FlamingTempura/bibtex-tidy#readme
      - https://pre-commit.com/
