history:
  adoption-history:
    - >
      HapiGo is a commercial macOS utility with free and paid editions. Its integrations
      with applications such as Notes, Bear, Dash, Craft, 1Password, DEVONthink, Zotero,
      and Shortcuts position it as a launcher for knowledge-work workflows.
  package-nerd-significance:
    - >
      HapiGo packages launcher, search, preview, clipboard, snippet, translation, and
      command-running features in one Mac application. Homebrew Cask users can include
      it in a reproducible workstation setup.
  project-history:
    - >
      HapiGo's official site carries a 2020 copyright notice and documents continuing
      releases, including version 2.22.1 in July 2026. The available official material
      does not identify an earlier founding date or public source-code repository.
  related-projects:
    - >
      HapiGo integrates with macOS Shortcuts, Notes, Finder, and third-party
      knowledge-management and developer applications.
  sources:
    - 'Official HapiGo documentation: https://docs-cn.hapigo.com/'
    - 'Official HapiGo homepage: https://www.hapigo.com/'
    - 'Official integrations catalog: https://hapigo.com/integrations.html'
  summary:
    - >
      HapiGo is a macOS productivity launcher centered on instant search, quick
      previews, and direct actions for applications, files, and integrated services.
  timeline:
    - '2020: Copyright date shown on the official HapiGo site.'
    - '2026: Official site lists HapiGo 2.22.1.'
  usage:
    - >
      Users open HapiGo with the keyboard, search for an application, file, note,
      document, or command, preview the result, and invoke an action such as open, copy,
      reveal in Finder, AirDrop, or run in a terminal.
