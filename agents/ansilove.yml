history:
  adoption-history:
    - >
      The README lists packages for OpenBSD, NetBSD, FreeBSD, Debian, Ubuntu, openSUSE,
      Solus, Gentoo, Homebrew, Guix, and Nix, making Ansilove a cross-distro
      preservation tool for ANSI art collections. It also names downstream or user
      projects such as 16colo.rs, Textfiles.com, Durdraw, and emacs-ansilove.
    - >
      Its adoption is tied less to everyday shell scripting and more to digital
      preservation and artscene tooling. Archives use it to generate preview images from
      text-mode art, while editors and viewers can embed its renderer through
      libansilove or shell out to the CLI.
  package-nerd-significance:
    - >
      Ansilove is package-nerd catnip because it packages a niche cultural format with
      serious portability discipline. The upstream cares about C99, GCC and Clang, BSD
      platforms, CMake, man pages, test cases, and distro links, all for the humble job
      of turning CP437-era art into inspectable PNGs.
    - >
      It also demonstrates a clean split between a CLI package and a reusable rendering
      library, libansilove, which matters for downstream tools that want faithful
      ANSI-art rendering without reimplementing SAUCE, font, and palette behavior.
  project-history:
    - >
      The official README describes AnsiLove/C as a complete rewrite of AnsiLove/PHP in
      C. The rewrite was motivated by independence from a PHP interpreter, performance,
      portability, and the desire for a reusable C foundation that could support
      libraries and embedding.
    - >
      The 4.0.0 release in 2019 switched the command-line program to libansilove, added
      DOS aspect-ratio handling, improved SAUCE parsing, and added support for PabloDraw
      24-bit ANSI sequences. Later releases continued the package-maintainer-friendly
      path: CMake improvements, tests, optional seccomp support, and links to additional
      distro packages.
  related-projects:
    - libansilove is the rendering library used by current Ansilove/C.
    - AnsiLove/PHP is the earlier implementation from which the C rewrite departed.
    - Durdraw and emacs-ansilove are documented downstream users.
  sources:
    - https://github.com/ansilove/ansilove#readme
    - https://raw.githubusercontent.com/ansilove/ansilove/master/ChangeLog
    - source_facts.package-manager
  summary:
    - >
      Ansilove, also called AnsiLove/C upstream, is an ANSI and ASCII art to PNG
      converter. It renders classic artscene formats such as ANS, PCB, BIN, ADF, IDF,
      TND, and XBin using DOS and Amiga fonts, SAUCE metadata, iCE colors, and compact
      4-bit PNG output.
  timeline:
    - '2019: Ansilove/C 4.0.0 switches to libansilove and expands rendering behavior.'
    - >
      2020: 4.1.x releases add type selection, seccomp work, SAUCE rendering hints, and
      portability fixes.
    - '2022: 4.1.6 documents experimental seccomp support and modernizes CMake usage.'
    - '2023: 4.2.0 adds Spleen 8x16 font support.'
    - '2025: 4.2.1 adds project and package links including Durdraw and Guix.'
    - '2026: 4.2.2 fixes Topaz font selection from SAUCE metadata.'
  usage:
    - >
      The ansilove command takes an input file and writes a PNG, with flags for output
      path, font, columns, file type, iCE colors, DOS aspect ratio, Retina scale, and
      SAUCE inspection. In most package-manager installs it is a single-purpose media
      converter rather than a general terminal filter.
    - >
      No official config file or credential store is documented; behavior is controlled
      by CLI flags and build options.
related-packages:
  - id: brew:ansifilter
    reason: >
      Choose ansifilter when ANSI sequences should be stripped or converted to text,
      HTML, RTF, TeX, BBCode, Pango, or SVG instead of rendering classic ANSI art as
      PNG.
    rel: alternative
    sources:
      - https://github.com/ansilove/ansilove
      - https://gitlab.com/saalen/ansifilter
