history:
  adoption-history:
    - >
      Shearwater Cloud is used within Shearwater Research's diving ecosystem across
      desktop and mobile platforms. Its device support spans multiple generations of
      Shearwater dive computers, allowing divers to retain a synchronized logbook while
      changing computers or client devices.
  package-nerd-significance:
    - >
      For package-manager users, Shearwater Cloud is representative of
      hardware-companion software: installing the desktop client can be automated, but
      its main value depends on compatible dive-computer hardware, Bluetooth
      connectivity, and an optional vendor cloud account.
  project-history:
    - >
      Shearwater Research developed Shearwater Cloud as its cross-platform logbook and
      dive-computer companion. It combines dive download and analysis with cloud
      synchronization, firmware updates, and supported device settings.
    - >
      The company migrated users away from the unsupported legacy Shearwater Desktop
      application. Its official migration procedure exports the old database and imports
      it into Shearwater Cloud.
  related-projects:
    - >
      Shearwater Desktop was the preceding desktop logbook application and is now
      treated as legacy software by Shearwater Research.
    - >
      Shearwater Cloud accompanies Shearwater dive computers including the Perdix,
      Peregrine, Petrel, Teric, Tern, and NERD families.
  sources:
    - https://shearwater.com/pages/cloud-quickstart-guide
    - https://shearwater.com/pages/shearwater-cloud
    - https://shearwater.com/pages/support
  summary:
    - >
      Shearwater Cloud is Shearwater Research's cross-platform dive-log synchronization
      and device-management application for supported Shearwater dive computers.
  timeline:
    - >
      Legacy era: Shearwater Desktop provided the company's earlier computer-based
      logbook workflow.
    - >
      Cloud era: Shearwater Cloud combined desktop and mobile logbooks with
      account-based synchronization.
    - >
      Migration era: Shearwater formally directed users of the unsupported legacy
      desktop application to export their database and import it into Shearwater Cloud.
  usage:
    - >
      Divers pair a supported dive computer, download and review dive logs, update
      device firmware, and adjust supported settings. Signing into an online account
      synchronizes dives between devices; an offline or guest workflow keeps data out of
      the vendor cloud.
