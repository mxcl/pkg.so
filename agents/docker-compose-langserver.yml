config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The primary adoption route is editor integration through Microsoft's Container
      Tools extension for VS Code, with the npm package and docker-compose-langserver
      executable making it usable by other LSP clients. Homebrew packaging turns that
      language-server executable into a simple install for Vim, Neovim, Emacs, and other
      editor setups that prefer system package managers.
  package-nerd-significance:
    - >
      This package matters to package nerds because it exposes an editor language
      service as a standalone CLI executable. That lets users assemble their own editor
      toolchains with Homebrew and LSP configuration instead of installing a full IDE
      extension stack.
  project-history:
    - >
      The changelog shows the language service beginning with a 0.0.1-alpha release in
      September 2021, focused on Compose YAML editing features such as Docker Hub links,
      hover information, signature help, completions, diagnostics, and formatting. Later
      releases added more completion coverage, an executable language-server entry
      point, alternate YAML language service integration, CodeLens support, and package
      entry points for client and VS Code use.
  related-projects:
    - >
      The project is related to Docker Compose, the Compose specification, Microsoft's
      VS Code Container Tools extension, YAML language services, and generic Language
      Server Protocol clients.
  sources:
    - https://github.com/microsoft/compose-language-service#readme
    - https://github.com/microsoft/compose-language-service/blob/main/CHANGELOG.md
    - https://github.com/microsoft/compose-language-service/blob/main/package.json
    - https://formulae.brew.sh/formula/docker-compose-langserver
  summary:
    - >
      Docker Compose Language Service is Microsoft's Language Server Protocol
      implementation for Docker Compose documents. The README says it is shipped in the
      Visual Studio Code Container Tools extension and provides completions, signatures,
      diagnostics, formatting, hover hints, and Docker-specific image hyperlinks.
  timeline:
    - '2021: 0.0.1-alpha initial release adds Compose editing features.'
    - '2023: 0.1.3 adds an executable to launch the language server.'
    - '2024: 0.3.0 adds CodeLenses for starting Compose services from documents.'
    - '2026: 0.5.0 adds client and VS Code entry points plus an ESM build.'
  usage:
    - >
      The package is used by editors and LSP clients to understand Compose files,
      especially Compose file version 3 style documents. It supplies YAML-aware editing
      assistance rather than running containers itself, and the README notes that VS
      Code-specific telemetry events can be ignored by non-VS Code clients.
related-packages:
  - id: brew:docker-language-server
    reason: >
      Choose Docker Language Server for a broader official Docker editor backend
      covering Compose, Dockerfiles, and Bake files; choose Compose Language Service
      when Microsoft's Compose-focused implementation or Container Tools integration is
      required.
    rel: alternative
    sources:
      - https://github.com/docker/docker-language-server#readme
      - >
        https://github.com/microsoft/vscode-containers/tree/main/packages/compose-language-service
  - id: brew:docker-compose
    reason: >
      Install Docker Compose to execute and inspect the multi-container application
      definitions that the language service helps users author.
    rel: adjacent_workflow
    sources:
      - >
        https://github.com/microsoft/vscode-containers/tree/main/packages/compose-language-service
      - https://docs.docker.com/compose/
