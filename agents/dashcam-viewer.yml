history:
  adoption-history:
    - >
      Dashcam Viewer expanded from its initial Mac release to support both macOS and
      Windows and accumulated parsers for many dashcam and action-camera formats. Its
      practical adoption has been driven by compatibility with camera-specific GPS
      metadata and by a workflow that combines playback, maps, graphs, and export tools.
    - >
      The application is commercially licensed, with trial, Plus, Pro, and
      bulk-licensing paths documented by the vendor. It is also distributed to macOS
      users through Homebrew Cask.
  package-nerd-significance:
    - >
      Dashcam Viewer is a long-lived example of specialized desktop software packaged
      through a general-purpose Mac package manager. Its value lies less in codec
      playback alone than in normalizing the inconsistent sidecar files, embedded
      telemetry, filenames, and directory layouts emitted by many camera vendors.
    - >
      For package curators, it is a useful example of proprietary cross-platform
      software whose authoritative metadata, compatibility knowledge, manuals, and
      release history live on the vendor's site rather than in a public source
      repository.
  project-history:
    - >
      Dashcam Viewer began as a desktop tool for synchronizing dashcam recordings with
      vehicle telemetry. The official manual records version 1.0.4 on January 26, 2014
      as the first public release, already supporting drag-and-drop media loading, GPS
      metrics, maps, graphs, and multiple camera formats.
    - >
      By late 2014 the application was shipping on both Mac and Windows. Continued
      releases broadened camera support and added navigation, export, multi-channel
      playback, geotagging, and analysis features.
  related-projects:
    - >
      Dashcam Viewer consumes recordings and telemetry produced by numerous dashcam and
      action-camera vendors rather than depending on one camera ecosystem.
    - >
      The official resources page links tutorials, camera-support information, and a
      long-running DashCamTalk community thread.
  sources:
    - Homebrew adoption is supplied by source_facts.package-manager["brew-cask"].
    - >
      Official 2014 Mac/Windows release post:
      https://dashcamviewer.com/2014/11/24/dashcam-viewer-v1-5-0-released-for-mac-and-windows/
    - 'Official resources hub: https://dashcamviewer.com/resources/'
    - >
      Official user manual and history:
      https://dashcamviewer.com/wp-content/uploads/2015/04/dashcam-viewer-users-manual.pdf
    - 'Official website: https://dashcamviewer.com/'
  summary:
    - >
      Dashcam Viewer is a commercial macOS and Windows application for playing dashcam
      and action-camera recordings together with synchronized GPS routes, speed,
      distance, G-force, and other recorded telemetry.
  timeline:
    - >
      2014-01-26: Version 1.0.4 was identified in the official manual as the first
      public release.
    - '2014-11-24: Version 1.5.0 was announced for both Mac and Windows.'
    - >
      Later releases: Camera compatibility and telemetry, mapping, playback, and export
      capabilities continued to expand.
  usage:
    - >
      Users open a camera's movie folder or SD card, then review synchronized video,
      route position, speed, G-force, altitude, satellite, and other available metadata.
      The application can work with front/rear channels and camera-specific file
      layouts.
    - >
      Typical workflows include incident review, route visualization, frame or clip
      export, geotagging, and troubleshooting timestamp or GPS-data mismatches. Feature
      availability varies by camera format and license tier.
