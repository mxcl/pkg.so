id: brew:gi-docgen
display-name: GI-DocGen
repo: https://gitlab.gnome.org/GNOME/gi-docgen
docs:
  - https://gnome.pages.gitlab.gnome.org/gi-docgen
config-file-location:
  unix:
    - Path supplied with -C
    - '--config; no default path is documented'
credentials-file-location: null
history:
  adoption-history:
    - >
      The project's adoption is tied to GNOME library publishing rather than broad
      language-wide documentation. It matters because many GNOME platform libraries
      share the same GObject Introspection machinery, so a generator that understands
      that metadata can produce consistent API references for libraries that bindings
      and application developers depend on.
    - >
      Distribution packaging across Linux distributions, Homebrew, MacPorts, Nix, and
      Python packaging made GI-DocGen available to maintainers building GNOME-related
      source releases and documentation sites.
  package-nerd-significance:
    - >
      For package maintainers, GI-DocGen is a build-time documentation dependency with
      GNOME-specific semantics. It is useful in distro and Homebrew contexts because it
      can be installed as a normal tool while preserving the GNOME project's preferred
      documentation pipeline.
  project-history:
    - >
      The GNOME-hosted GitLab project was created in November 2020 and carries GNOME
      Foundation copyright terms from 2021. Its documentation frames the project as a
      focused generator for libraries that expose GObject Introspection data, with GTK
      and its immediate dependencies as the primary target rather than all C libraries.
    - >
      GI-DocGen sits in the lineage of GNOME API documentation tooling alongside
      GTK-Doc, but it reflects a later approach built around introspection metadata,
      Sphinx-style documentation pages, Meson integration, and generated reference sites
      for the GObject ecosystem.
  related-projects:
    - >
      GI-DocGen is related to GObject Introspection, GTK, Meson, GTK-Doc, HotDoc,
      Doxygen, and Devhelp documentation indexes.
  sources:
    - https://gitlab.gnome.org/GNOME/gi-docgen
    - https://gitlab.gnome.org/GNOME/gi-docgen/-/tags
    - https://gitlab.gnome.org/api/v4/projects/GNOME%2Fgi-docgen
    - https://gnome.pages.gitlab.gnome.org/gi-docgen
  summary:
    - >
      GI-DocGen is GNOME's documentation generator for GObject-based libraries. It uses
      GObject Introspection data to produce API references and ancillary documentation,
      especially for GTK and nearby platform libraries.
  timeline:
    - '2020: GNOME GitLab project created.'
    - '2021: GNOME Foundation copyright appears in the project README and documentation.'
    - '2025: Tagged releases included 2025.4 and 2025.5.'
    - '2026: The 2026.1 tag documented parser, template, and styling fixes.'
  usage:
    - >
      Practitioners use GI-DocGen from a source tree or a package installation to
      generate reference documentation from introspection data and a project
      configuration file. The documented workflow points users to a tutorial, project
      configuration, linking rules, introspection attributes, templates, content pages,
      and command documentation.
    - >
      The README emphasizes that GI-DocGen is not a general C documentation tool. Its
      practical use is strongest in GObject projects that already produce introspection
      data and want API pages aligned with GTK and GNOME documentation conventions.
related-packages:
  - id: brew:gobject-introspection
    reason: >
      GObject Introspection produces the GIR metadata that GI-DocGen requires to
      generate API-reference documentation.
    rel: adjacent_workflow
    sources:
      - https://gnome.pages.gitlab.gnome.org/gi-docgen/tutorial.html
      - https://gi.readthedocs.io/en/latest/
  - id: brew:gtk-doc
    reason: >
      GTK-Doc is an established GObject-aware documentation alternative; choose it for
      projects that retain its source-scanning and DocBook-oriented workflow.
    rel: alternative
    sources:
      - https://gnome.pages.gitlab.gnome.org/gi-docgen/
      - https://gitlab.gnome.org/GNOME/gtk-doc/-/tree/master/help/manual/C
  - id: brew:doxygen
    reason: >
      Doxygen is the officially recommended alternative when a project needs a
      general-purpose, multi-language documentation generator rather than GI-DocGen's
      introspection-focused GTK workflow.
    rel: alternative
    sources:
      - https://gnome.pages.gitlab.gnome.org/gi-docgen/
      - https://www.doxygen.nl/manual/index.html
