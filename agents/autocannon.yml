id: brew:autocannon
display-name: autocannon
repo: https://github.com/mcollina/autocannon
docs:
  - https://github.com/mcollina/autocannon#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      autocannon's adoption follows the Node.js server ecosystem: it is distributed
      through npm for global CLI installs or library use, and the Homebrew formula
      packages the CLI for users who prefer system package managers.
    - >
      Its popularity comes from being easy to run against a local URL while still
      exposing enough controls for serious testing: connection counts, pipelining,
      duration, request bodies, headers, HAR input, worker threads, rate limits and JSON
      output.
  package-nerd-significance:
    - >
      autocannon is package-nerd useful because it is a small, installable benchmark
      executable that competes culturally with native tools such as wrk while staying in
      the Node toolchain. It is one of the standard quick checks for HTTP service
      throughput in JavaScript projects.
    - >
      Because it needs no daemon, config file or credentials, the packaging surface is
      clean: install Node, expose the bin, and let users point it at a URL.
  project-history:
    - >
      The npm package and GitHub repository both date to 2016-03-31. The README
      describes autocannon as an HTTP/1.1 benchmarking tool written in Node.js, inspired
      by wrk and wrk2, with support for HTTPS and HTTP pipelining.
    - >
      The project reached a long-lived 7.x series and published v8.0.0 on 2024-10-14.
      The repository remained active into 2026, with thousands of GitHub stars and
      hundreds of forks.
  related-projects:
    - The README explicitly names wrk and wrk2 as inspirations.
    - >
      autocannon is commonly compared with HTTP benchmarking tools such as ab, wrk and
      hey, though its official docs emphasize its Node.js implementation and API.
  sources:
    - https://api.github.com/repos/mcollina/autocannon
    - https://api.github.com/repos/mcollina/autocannon/releases
    - https://github.com/mcollina/autocannon#readme
    - https://registry.npmjs.org/autocannon
  summary:
    - >
      autocannon is a fast HTTP/1.1 benchmarking and load-testing tool for Node.js
      users, usable both as a CLI and as a JavaScript API.
  timeline:
    - '2016: Repository and npm package are created on 2016-03-31.'
    - '2021: v7.x releases continue the mature CLI/API line.'
    - '2024: v8.0.0 is published on 2024-10-14.'
  usage:
    - >
      The basic CLI form is autocannon [opts] URL. Defaults are intentionally simple,
      such as 10 connections and a 10 second run, but the README documents many options
      for duration, request count, concurrency, pipelining, warmup, headers, bodies, TLS
      certificates and output formats.
    - >
      Programmatic usage imports the autocannon package and passes an options object,
      which makes it useful for benchmark scripts and project-local performance checks
      in Node.js repositories.
related-packages:
  - id: brew:wrk
    reason: >
      Choose wrk when you prefer a compiled C/LuaJIT load generator with lower
      generator-side CPU overhead; autocannon is easier to embed in Node.js and supports
      HTTP/1.1 pipelining.
    rel: alternative
    sources:
      - https://github.com/mcollina/autocannon#limitations
      - https://github.com/wg/wrk#readme
