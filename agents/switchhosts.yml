id: cask:switchhosts
display-name: SwitchHosts
repo: null
docs:
  - https://github.com/oldj/SwitchHosts#readme
config-file-location:
  unix:
    - ~/.SwitchHosts/internal/config.json
  windows:
    - '%USERPROFILE%\.SwitchHosts\internal\config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      SwitchHosts is distributed as a desktop application for macOS, Windows, and Linux.
      Its official README also documents Chocolatey installation, while
      source_facts.package-manager records availability as a Homebrew cask.
  package-nerd-significance:
    - >
      Hosts-file switching is a small but recurring developer and operations task.
      SwitchHosts packages that workflow into a cross-platform GUI with remote lists,
      scheduled refreshes, import and export, system-tray switching, and native
      privilege handling.
  project-history:
    - >
      SwitchHosts evolved through several storage formats and application architectures.
      Version 4.0 was released by 2021. Version 5 replaced the Electron main process
      with a Rust and Tauri 2 backend, introduced a layered JSON data layout, and added
      migration from older PotDb-backed data.
  related-projects:
    - >
      The operating system hosts file is the underlying configuration surface managed by
      the application.
    - Tauri 2 supplies the native application backend used by SwitchHosts version 5.
  sources:
    - https://github.com/oldj/SwitchHosts#readme
    - https://github.com/oldj/SwitchHosts/discussions/561
    - https://github.com/oldj/SwitchHosts/releases
  summary:
    - >
      SwitchHosts is an open-source, cross-platform desktop application for organizing
      hosts-file entries and switching them on or off.
  timeline:
    - '2021: SwitchHosts 4.0 was released.'
    - >
      2026: Version 5.0 migrated the application backend from Electron to Tauri 2 and
      introduced a new data layout.
  usage:
    - >
      Users maintain local or remotely refreshed hosts sets, group entries, toggle them
      from the main window or system tray, and import or export hosts data. Version 5
      stores preferences separately from entry content and histories.
tags:
  - dns-override
