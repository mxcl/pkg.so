id: brew:bibtexconv
display-name: BibTeXConv
repo: null
docs:
  - https://github.com/dreibh/bibtexconv#readme
  - https://www.nntb.no/~dreibh/bibtexconv
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      BibTeXConv is packaged in Homebrew, Debian, and Ubuntu, and the upstream README
      documents additional binary-package routes for Ubuntu PPAs, Fedora COPR, and
      FreeBSD ports.
    - >
      Its adoption is narrower than Biber or BibTeX2HTML, but it serves users who
      maintain publication lists and want programmable exports into web pages, text
      files, ODT documents, or IETF XML references.
  package-nerd-significance:
    - >
      BibTeXConv is a small but very package-manager-shaped bibliography utility: a
      C/C++ CLI with man pages, examples, Debian/RPM/FreeBSD packaging metadata, and a
      stable upstream tarball flow.
    - >
      It is most interesting as a BibTeX-to-everything bridge for publication-list
      maintenance rather than as a LaTeX build dependency.
  project-history:
    - >
      The Git history traces BibTeXConv back to an imported Subversion-era commit in
      July 2010, and the current CMake metadata carries copyright years 2010-2026.
    - >
      The upstream README describes a converter centered on export scripts, mappings,
      URL checking, MD5/size/MIME computations, ISBN and ISSN verification, and separate
      helper commands such as bibtexconv-odt and ietf2bibtex.
  related-projects:
    - BibTeX is the source data format BibTeXConv reads and writes.
    - >
      LibreOffice and OpenOffice are relevant to the bibtexconv-odt workflow documented
      upstream.
    - >
      IETF XML reference tooling is a target output area through BibTeXConv's XML
      reference generation.
  sources:
    - https://api.github.com/repos/dreibh/bibtexconv/commits?per_page=1&page=1251
    - https://github.com/dreibh/bibtexconv/blob/master/CMakeLists.txt
    - https://github.com/dreibh/bibtexconv/blob/master/README.md
    - https://www.nntb.no/~dreibh/bibtexconv/
  summary:
    - >
      BibTeXConv is Thomas Dreibholz's BibTeX file converter for exporting BibTeX
      entries to custom text, HTML, YAML, Markdown, OpenDocument, BibTeX, and
      XML-oriented outputs.
  timeline:
    - '2010-07-11: Earliest public GitHub commit imports the project from an SVN repository.'
    - >
      2026-05-28: Upstream announces bibtexconv 2.2.2 with manpage improvements and
      updated examples.
    - >
      2026-06-12: Upstream announces bibtexconv 2.2.3 with build improvements for
      NetBSD, OpenBSD, and macOS.
  usage:
    - >
      Users feed a BibTeX file plus an export script or option set to bibtexconv,
      producing updated BibTeX, HTML, plain text, YAML, Markdown, separate XML
      references, or downloaded/verified publication assets.
    - >
      The README warns that script-based mappings can be slow and can introduce security
      risk when export scripts come from untrusted sources, recommending mapping files
      for safer author-to-URL lookups.
related-packages:
  - id: brew:bibtex2html
    reason: >
      Choose BibTeX2HTML for BibTeX-style-aware static HTML bibliographies and built-in
      entry filtering; keep BibTeXConv for custom scripts and its wider output set.
    rel: alternative
    sources:
      - https://usr.lmf.cnrs.fr/~jcf/bibtex2html/index.en.html
      - https://www.nntb.no/~dreibh/bibtexconv/
  - id: brew:bibutils
    reason: >
      Choose bibutils for standard bibliography interchange through MODS—such as RIS,
      EndNote, NBIB, Word bibliography, BibTeX, and BibLaTeX—while BibTeXConv is
      stronger for custom publication outputs and validation.
    rel: alternative
    sources:
      - https://sourceforge.net/p/bibutils/home/Bibutils/
      - https://www.nntb.no/~dreibh/bibtexconv/
