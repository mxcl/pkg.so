history:
  adoption-history:
    - >
      Redot is distributed for Linux, macOS, and Windows and maintains editor binaries,
      export templates, documentation, and extension bindings. Its adoption is
      community-led; the official repository documents thousands of stars and hundreds
      of forks, but the project does not publish a reliable installed-user total.
  package-nerd-significance:
    - >
      Redot is notable as a packageable, MIT-licensed fork of a major open-source game
      engine. It retains Godot's scene, node, scripting, extension, and project-file
      conventions while pursuing an independently governed release line, making
      compatibility and divergence especially interesting to engine packagers.
  project-history:
    - >
      Redot was forked from Godot in September 2024. Its maintainers describe the
      project as an independent, community-driven continuation intended both to improve
      the engine and to contribute useful work back to the shared codebase. The project
      adapted the Godot documentation for Redot and has since maintained its own editor,
      export templates, releases, and supporting repositories.
  related-projects:
    - >
      Redot is derived from Godot Engine and retains close technical and documentation
      ancestry. First-party related projects include redot-docs, redot-cpp bindings for
      GDExtension, demo projects, and platform packaging repositories.
  sources:
    - https://docs.redotengine.org/
    - https://docs.redotengine.org/about/introduction
    - https://github.com/Redot-Engine/redot-engine
    - https://github.com/Redot-Engine/redot-engine/releases
  summary:
    - >
      Redot Engine is a free, MIT-licensed, community-driven fork of Godot for building
      and exporting 2D and 3D games across desktop, mobile, web, and console targets.
  timeline:
    - 'September 2024: Redot was forked from Godot.'
    - '2024: Redot established its independent community project and release line.'
    - >
      2026: Redot adopted a calendar-oriented 26.x release series and published
      long-term-support releases.
  usage:
    - >
      Developers create projects in the Redot editor using scenes, nodes, scripts,
      assets, and a project.godot settings file, then export games with
      platform-specific templates. The built-in class reference and online manual
      support both application development and engine contribution.
