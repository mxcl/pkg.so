history:
  adoption-history:
    - >
      The official download page documents Homebrew installation alongside the DMG
      installer, making NetViews available through the Mac package-management workflow.
      The product is aimed at network administrators, IT professionals, engineers, and
      power users rather than broad consumer monitoring.
  package-nerd-significance:
    - >
      NetViews brings several tools commonly used separately—ping monitoring, route
      inspection, port and host discovery, protocol-event monitoring, Wi-Fi analysis,
      and subnet calculation—into one native macOS interface. Its official Homebrew
      installation command makes it particularly relevant to managed Mac toolsets.
  project-history:
    - >
      Network engineer Bill Bushong created the application to provide a more focused
      macOS network-diagnostics tool. It was initially named PingStalker and was renamed
      NetViews in November 2025 as its scope grew beyond ping monitoring.
  related-projects:
    - >
      Wireshark is an optional companion for Wi-Fi packet-capture analysis. NetViews
      also uses Sparkle for application updates and Lemon Squeezy for license
      activation.
  sources:
    - https://www.netviews.app/about/
    - https://www.netviews.app/changelog/
    - https://www.netviews.app/download/
    - https://www.netviews.app/help/
  summary:
    - >
      NetViews is a native macOS network-monitoring and diagnostic application created
      by network engineer Bill Bushong. It combines interface visibility, host
      discovery, continuous pinging, network-event logs, Wi-Fi diagnostics, and common
      network calculations.
  timeline:
    - >
      2025: The PingStalker name was replaced by NetViews as the application's
      diagnostic scope expanded.
  usage:
    - >
      Select a network interface to begin monitoring, then use network scans for device
      discovery, Ping Monitor for availability and latency, Network Logs for
      ARP/DHCP/DNS/LLDP/CDP and Wi-Fi events, and the wireless tools for access-point
      analysis. Location Services and BPF access are needed for portions of the Wi-Fi
      and packet-monitoring functionality.
