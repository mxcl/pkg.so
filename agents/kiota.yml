history:
  adoption-history:
    - >
      After the March 2023 general availability announcement, Microsoft announced a
      Visual Studio Code extension on April 10, 2023. Package availability expanded
      across developer-tool channels represented in the input facts, including Homebrew,
      Scoop, and WinGet, making Kiota a cross-platform CLI rather than only a .NET-local
      tool.
  package-nerd-significance:
    - >
      Kiota matters to package nerds because it is Microsoft shipping a general-purpose
      SDK generator as a standalone open source tool. It intersects with OpenAPI,
      Microsoft Graph, NuGet/.NET tooling, Homebrew, WinGet, Scoop, and editor
      extensions rather than living only inside a single language ecosystem.
  project-history:
    - >
      Microsoft announced Kiota's general availability on March 16, 2023, describing it
      as an open source generator for HTTP APIs described by OpenAPI. Its goal was to
      reduce the need for a separate hand-written SDK for every API while preserving
      strongly typed clients, authentication abstractions, retry handling, redirects,
      compression, and path filtering.
    - >
      The Kiota repository is part of Microsoft's broader OpenAPI and Microsoft Graph
      tooling work. Its README describes supported generation targets including C#, Go,
      Java, PHP, Python, Ruby, TypeScript/JavaScript, and Dart, with shared abstractions
      for serialization, authentication, and HTTP transport.
  related-projects:
    - >
      Kiota builds on Microsoft.OpenAPI.NET and is used around Microsoft Graph
      scenarios. It sits beside older and broader OpenAPI generator ecosystems such as
      AutoRest and OpenAPI Generator while emphasizing request builders, path filtering,
      and shared runtime abstractions.
  sources:
    - https://api.github.com/repos/microsoft/kiota/releases?per_page=100
    - >
      https://devblogs.microsoft.com/microsoft365dev/tailored-sdk-experiences-via-kiota-now-generally-available/
    - >
      https://devblogs.microsoft.com/microsoft365dev/you-can-now-use-microsoft-kiota-within-visual-studio-code/
    - https://formulae.brew.sh/formula/kiota
    - https://github.com/microsoft/kiota
    - https://github.com/microsoft/kiota/releases
    - https://learn.microsoft.com/en-us/openapi/kiota/overview
  summary:
    - >
      Kiota is Microsoft's OpenAPI-based HTTP API client generator, distributed as a
      command-line tool and supported by Microsoft Learn documentation, a GitHub
      repository, package-manager formulas, and a Visual Studio Code extension.
  timeline:
    - '2023-03-16: Microsoft announced Kiota general availability.'
    - '2023-04-10: Microsoft announced the Kiota Visual Studio Code extension.'
    - '2023-09-28: GitHub release v1.7.0-preview.202309280001 was published.'
    - '2023-10-05: GitHub release v1.7.0 was published.'
    - '2026-06-26: GitHub release v1.32.4 was published.'
  usage:
    - >
      Kiota users point the CLI or VS Code extension at an OpenAPI description, inspect
      and filter the desired API paths, and generate a typed client for an application.
      This workflow is especially useful when developers need a smaller API surface than
      a full vendor SDK or want the same request-builder style across multiple APIs.
related-packages:
  - id: brew:openapi-generator
    reason: >
      Choose OpenAPI Generator when you need its much broader set of client,
      server-stub, documentation, schema, and configuration targets; choose Kiota for
      Microsoft's request-builder-oriented, selectively generated API clients.
    rel: alternative
    sources:
      - https://learn.microsoft.com/en-us/openapi/kiota/
      - https://openapi-generator.tech/docs/generators/
