history:
  adoption-history:
    - >
      libicns filled a practical packaging gap for Unix and Linux desktops: converting
      macOS icon resources into PNGs and generating .icns files without requiring macOS
      development frameworks.
    - >
      Its adoption stayed niche, but the utilities icns2png and png2icns made it useful
      in icon-theme packaging, cross-platform application packaging, and build scripts
      that needed to consume or emit Apple icon assets.
  package-nerd-significance:
    - >
      libicns is package-nerd useful because it keeps an old platform-specific binary
      resource format scriptable on POSIX systems. It is not a glamorous dependency, but
      it is exactly the sort of tiny converter that keeps cross-platform release
      automation boring.
  project-history:
    - >
      The project page describes libicns as a library for the Mac OS icns resource
      format, including reading and writing Mac OS X icns files and reading Mac resource
      files and MacBinary-encoded resource forks.
    - >
      SourceForge release records show early public tarballs in February 2008, a steady
      0.5 and 0.6 series through 2008 and 2009, and the 0.8 line in 2012. Release 0.8.0
      added support for PNG icns elements, icon variants, and TOC awareness; release
      0.8.1 added 1024x1024 support and packaging/build fixes.
  related-projects:
    - Apple's .icns/IconFamily resource format is the direct file-format target.
    - Jasper and OpenJPEG are related through JPEG 2000-backed icon-element support.
    - >
      IconFamily is noted by the project as a related Objective-C option for Mac OS X
      developers.
  sources:
    - https://icns.sourceforge.io/
    - https://icns.sourceforge.io/apidocs.html
    - https://sourceforge.net/p/icns/code
    - https://sourceforge.net/projects/icns/files/
  summary:
    - >
      libicns is a small library and utility set for manipulating Apple's .icns icon
      resource format outside Apple's native tooling.
  timeline:
    - '2008: Early SourceForge tarballs published for the 0.0 and 0.1 series.'
    - '2009: 0.6 and 0.7 releases improved portability, licensing, and build behavior.'
    - '2012: 0.8.0 added PNG icns-element support and icon variant handling.'
    - '2012: 0.8.1 added 1024x1024 support and Debian/build fixes.'
  usage:
    - >
      Users most often install libicns for the command-line tools icns2png, png2icns,
      and icontainer2icns, while developers can link the library to read, write,
      inspect, and assemble icon-family elements.
related-packages:
  - id: brew:jasper
    reason: >
      libicns officially documents Jasper as the JPEG 2000 backend that enables full
      handling of larger 256-by-256 and 512-by-512 icon elements.
    rel: adjacent_workflow
    sources:
      - https://icns.sourceforge.io/
      - https://jasper-software.github.io/jasper-manual/
