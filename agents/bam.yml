id: brew:bam
display-name: bam
repo: null
docs:
  - https://matricks.github.io/bam
  - https://matricks.github.io/bam/bam.html
config-file-location:
  unix:
    - ./bam.lua
credentials-file-location: null
history:
  adoption-history:
    - >
      In package-manager terms, bam is a niche but broadly carried build tool: the
      supplied package facts list packages in Homebrew, Debian/Ubuntu, Fedora, Arch,
      MacPorts, Nix, Alpine, and openSUSE-style ecosystems. That breadth reflects its
      occasional role as a build dependency for projects that chose bam over make,
      CMake, or SCons.
  package-nerd-significance:
    - >
      bam is interesting to package maintainers because it is both a build tool and
      often itself a build-time bootstrap dependency. Its Lua-based model puts it near
      SCons and Premake culturally, but its small C implementation and zlib license make
      it simpler to vendor or package than larger build frameworks.
  project-history:
    - >
      The public Git history for bam dates to October 2008, and the project
      documentation describes it as a fast build system with flexible Lua build scripts.
      The manual copyright line dates the manual to 2010, and the project has remained
      centered on a single executable that reads a default bam.lua build script.
    - >
      The 0.5.x line modernized the embedded scripting environment by moving from Lua
      5.1 to Lua 5.3.3 and added reproducible-build-oriented changes such as avoiding
      timestamps in the executable.
  related-projects:
    - >
      bam is related to other scriptable build tools such as SCons and Premake, and to
      lower-level build runners such as make and Ninja. Its distinguishing feature is a
      compact C implementation paired with Lua build descriptions.
  sources:
    - https://github.com/matricks/bam
    - https://github.com/matricks/bam/blob/master/CHANGELOG
    - https://github.com/matricks/bam/blob/master/README.md
    - https://github.com/matricks/bam/commit/68ce71e9273f0527fcb4344eddceacf88d54c1db
    - https://matricks.github.io/bam/bam.html
    - input.source_facts.package-manager
  summary:
    - >
      bam is a small C build tool that uses Lua as its build-description language. It
      belongs to the family of lightweight, scriptable build systems that appeal to
      package maintainers because the build logic lives in a normal programming language
      rather than in generated makefiles.
  timeline:
    - '2008: Public Git history begins in the official repository.'
    - '2010: v0.4.0 is tagged and the manual is published with a 2010 copyright line.'
    - >
      2016: v0.5.0 upgrades the embedded Lua runtime to 5.3.3 and improves reproducible
      build behavior.
    - >
      2016: v0.5.1 fixes compiler-environment handling and adds additional
      platform/compiler support.
  usage:
    - >
      A bam project normally provides a bam.lua script. The built-in command-line help
      in the official source sets bam.lua as the default script file and allows another
      script to be selected with -s.
    - >
      The README's quick example shows the usual style: create settings, collect source
      files, compile them, and link the resulting objects using Lua functions exposed by
      bam.
related-packages:
  - id: brew:scons
    reason: >
      Choose SCons when correctness-focused Python build scripts and its larger build
      framework are preferable; bam explicitly describes its Lua scripts as
      SCons-inspired but optimized for faster builds with different tradeoffs.
    rel: alternative
    sources:
      - https://matricks.github.io/bam/
      - https://www.scons.org/
