history:
  adoption-history:
    - >
      Dafny has grown through language documentation, binary releases for common
      operating systems, a wiki and issue tracker, and editor-centered workflows such as
      Visual Studio Code installation. Its README also points to tutorials, reference
      material, a Zulip channel, and a standard library, which are typical signs of a
      specialist language moving from research use into practical developer workflows.
  package-nerd-significance:
    - >
      Dafny matters in package history because it packages formal methods as an
      installable developer tool rather than a one-off theorem-proving environment. It
      gives package managers a concrete artifact for a verification language, including
      CLI binaries, documentation, and cross-platform releases.
  project-history:
    - >
      The official Dafny README describes Dafny as a verification-ready programming
      language whose verifier checks code against specifications while the developer
      writes. The public dafny-lang/dafny repository was created in 2016, and GitHub
      release metadata records Dafny 1.9.7 in June 2016.
  related-projects:
    - >
      The official README lists influences including Euclid, Eiffel, CLU, Java, C#,
      Scala, ML, Coq, and VeriFast, and points to Dafny libraries and editor
      integrations.
  sources:
    - https://github.com/dafny-lang/dafny
    - https://raw.githubusercontent.com/dafny-lang/dafny/master/README.md
    - https://dafny.org/dafny/DafnyRef/DafnyRef
    - https://github.com/dafny-lang/dafny/releases/tag/v1.9.7
  summary:
    - >
      Dafny is a verification-aware programming language and toolchain. It occupies a
      special package-manager niche: a single CLI that lets developers write programs,
      specifications, and proofs together, then verify them and compile to mainstream
      languages.
  timeline:
    - '2016: Public dafny-lang/dafny GitHub repository is created.'
    - '2016: Dafny 1.9.7 is published on GitHub releases.'
    - '2017: Dafny 2.0.0 is published on GitHub releases.'
    - '2025: Dafny 4.11.0 is published on GitHub releases.'
  usage:
    - >
      Users write Dafny programs with specifications such as preconditions,
      postconditions, invariants, and proofs; the Dafny verifier checks them, and the
      compiler can emit C#, Go, Python, Java, or JavaScript. The reference manual is the
      authoritative source for the language and verification system.
related-packages:
  - id: brew:z3
    reason: >
      Z3 is the SMT solver bundled with and normally used by Dafny to discharge
      generated verification conditions, making it the key adjacent tool for
      understanding or extending Dafny's solver workflow.
    rel: adjacent_workflow
    sources:
