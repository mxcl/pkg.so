credentials-file-location: null
history:
  adoption-history:
    - >
      Dusklight brings the reimplemented game to Windows, Linux, macOS, iOS, and Android
      through native builds. The macOS build is also distributed through Homebrew.
    - >
      The project has attracted a modding ecosystem built around `.dusk` packages,
      persistent mod configuration, asset overlays, native and Luau-based extensions,
      and an official mod catalogue.
  package-nerd-significance:
    - >
      Dusklight is part of the modern decompilation and recompilation scene in which
      community reverse engineering turns console-era software into portable native
      projects. It is notable as an unusually large completed decompilation being used
      for multi-platform releases.
    - >
      The package deliberately contains no copyrighted game assets: users must supply a
      dump from their own GameCube or Wii copy. This split between an open
      reimplementation and separately supplied original data is central to how the
      package is built and distributed.
  project-history:
    - >
      The Twilit Realm team began the Twilight Princess decompilation project in August
      2020. Contributors from the ZeldaRET and wider GameCube/Wii decompilation
      communities worked toward a matching reimplementation.
    - >
      After the decompilation was completed, the team began its multi-platform porting
      effort in late February 2026. The first public release arrived in May 2026 under
      the short-lived name Dusk and was renamed Dusklight days later.
  related-projects:
    - The Twilight Princess decompilation project provides the matching game-code foundation.
    - >
      Aurora supplies the compatibility layer used to target modern desktop and mobile
      platforms.
    - >
      Dolphin is relevant for dumping, converting, and transferring compatible GameCube
      save data, but Dusklight is a native reimplementation rather than an emulator.
  sources:
    - https://github.com/TwilitRealm/dusklight
    - https://twilitrealm.dev/
    - https://twilitrealm.dev/faq/
    - https://twilitrealm.dev/install/
    - https://twilitrealm.dev/posts/2026-05-09-dusk-v1-released/
  summary:
    - >
      Dusklight is an open-source, reverse-engineered reimplementation of The Legend of
      Zelda: Twilight Princess for modern desktop and mobile platforms.
  timeline:
    - 'August 2020: The Twilight Princess decompilation project began.'
    - >
      Late February 2026: Work began on bringing the completed decompilation to
      additional platforms.
    - 'May 9, 2026: The first public release became available as Dusk.'
    - 'May 12, 2026: The project was renamed Dusklight.'
  usage:
    - >
      Users install the native build and provide a dump of their own original GameCube
      or Wii disc; copyrighted levels, textures, models, music, and other assets are not
      bundled.
    - >
      Dusklight offers higher resolutions and frame rates, quality-of-life options, and
      an advanced mod system while aiming to preserve the original game's behavior.
    - >
      Players can move compatible GameCube save files between Dolphin and Dusklight
      using the platform-specific application-data directories documented in the
      official FAQ.
