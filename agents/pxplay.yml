history:
  adoption-history:
    - >
      The client is available across Android, iOS, Apple TV, Windows, Linux, and macOS.
      Homebrew packages the macOS application as the pxplay cask.
    - >
      Its platform reach and support for both local and internet connections position it
      as an alternative client for users wanting broader controller, profile, and
      streaming controls than a basic Remote Play workflow.
  package-nerd-significance:
    - >
      PXPlay is notable as a third-party implementation of the PlayStation Remote Play
      client experience across mobile, television, and desktop platforms. Networking
      enthusiasts may value its documented manual port-forwarding path, while controller
      users gain configurable layouts and mappings.
  project-history:
    - >
      PXPlay was originally distributed under the name PSPlay. The developer later
      renamed it PXPlay while continuing the same application and documentation.
    - >
      The client broadened from its mobile-oriented origins to support Apple TV and
      desktop operating systems. Its remote-connection workflow evolved to include an
      automatic internet connection mode alongside manual router configuration.
  related-projects:
    - PSPlay
    - PlayStation Remote Play
  sources:
    - 'Official instruction manual: https://streamingdv.github.io/pxplay/'
    - source_facts.description
    - source_facts.package-manager.brew-cask
  summary:
    - >
      PXPlay is a third-party Remote Play client for PlayStation consoles, formerly
      named PSPlay. It supports local and internet streaming, configurable controller
      layouts, multiple console profiles, and a broad range of desktop and mobile
      platforms.
  timeline:
    - 'Undated: The application was renamed from PSPlay to PXPlay.'
    - 'PXPlay 5.0.0: Automatic remote connection over the internet was introduced.'
  usage:
    - >
      A user first enables Remote Play on the console and registers PXPlay while both
      devices are on the same network. Local Connect is used on the home network; Remote
      Connect can use the automatic connection facility or manually configured router
      ports. Console profiles and controller layouts can be managed inside the
      application.
