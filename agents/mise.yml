history:
  project-history:
    - >
      Technically, mise started in the same problem space as asdf, pyenv, nvm, and
      direnv: keeping per-project tool versions and environment setup reproducible. It
      kept compatibility hooks that mattered to asdf users, including .tool-versions
      files and asdf plugins, but expanded into multiple installation backends such as
      npm, pipx, core, aqua, and GitHub releases. The documentation emphasizes real
      executable paths on PATH, optional shell activation, shims for CI and IDE use, and
      a mise.toml file that can hold tool versions, environment variables, and task
      definitions together.
  sources:
    - https://formulae.brew.sh/formula/mise
    - https://github.com/jdx/mise
    - https://mise.jdx.dev/dev-tools/comparison-to-asdf.html
    - https://mise.jdx.dev/getting-started.html
    - https://mise.jdx.dev/rtx.html
  summary:
    - >
      mise is a Rust-based developer-environment manager by jdx that grew out of the
      earlier rtx project. The project's documentation says rtx was renamed to mise to
      avoid confusion with Nvidia's RTX graphics branding and to make the CLI easier to
      search for and discuss. Its Homebrew description still captures that origin by
      calling it a polyglot runtime manager and an asdf Rust clone, while the project
      README frames the broader scope as dev tools, environment variables, and tasks in
      one CLI.
  usage:
    - >
      In practice, developers use mise to install and switch between runtimes like
      Node.js, Python, Ruby, Go, Terraform, CMake, and many other CLIs, then run project
      tasks under the same resolved environment. Its package-manager niche is broader
      than a language-specific version manager and more integrated than a plain task
      runner: it is installed by Homebrew and other package managers as a single CLI
      that coordinates tool acquisition, directory-aware environment loading, and
      repeatable project commands.
related-packages:
  - id: brew:asdf
    reason: >
      Choose asdf when you prefer its established plugin-and-shim model; choose mise for
      official `.tool-versions` migration support plus integrated environment, task, and
      bootstrap features.
    rel: alternative
    sources:
      - https://mise.jdx.dev/dev-tools/comparison-to-asdf.html
      - https://asdf-vm.com/
  - id: brew:direnv
    reason: >
      Use direnv alongside mise when you want direnv's explicit `.envrc` authorization
      workflow while mise manages installed tool versions; mise documents
      directory-aware environment handling, and direnv documents its shell-hook model.
    rel: adjacent_workflow
    sources:
      - https://mise.jdx.dev/
      - https://direnv.net/
