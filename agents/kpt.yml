history:
  adoption-history:
    - >
      Google introduced kpt publicly in 2020 as an open-source approach to packaging
      Kubernetes configuration with Git and YAML. Its package format was designed so an
      existing directory of configuration in a Git repository could become a package
      without requiring a separate templating language.
    - >
      The project subsequently developed package operations, reusable KRM functions,
      deployment inventory, direct-apply and GitOps workflows, and a separately
      versioned Go API. The related Porch system extends the package model into
      Kubernetes-native repository and package-lifecycle management.
  package-nerd-significance:
    - >
      kpt treats configuration as data rather than as source code for a monolithic
      template generator. That distinction matters to package-tool enthusiasts because
      transformations are performed in place on ordinary YAML or JSON, leaving
      reviewable configuration in Git.
    - >
      Its Kptfile metadata, Git-based package acquisition, function pipeline,
      inventory-aware deployment, and independently consumable Go API make kpt both a
      CLI package manager for configuration and a toolkit for building higher-level
      configuration platforms.
  project-history:
    - >
      kpt emerged from work around Kubernetes configuration management and was publicly
      introduced by Google in 2020. The project centered packages on directories of
      Kubernetes Resource Model resources stored in Git.
    - >
      During the transition toward its v1 package model, the project documented a
      migration path for older packages and made backward compatibility of the new
      package format an explicit goal. The project is now maintained under the kptdev
      organization and includes the CLI, API types, function tooling, and associated
      documentation.
  related-projects:
    - >
      Kubernetes supplies the resource model on which kpt operates. Kustomize is part of
      the broader Kubernetes configuration ecosystem, while kpt emphasizes package
      lifecycle and in-place functions. Porch is part of the kpt project and provides
      Kubernetes-native orchestration for KRM packages. Config Sync and Flux are
      documented GitOps integrations.
  sources:
    - https://github.com/kptdev/kpt
    - https://kpt.dev/
    - https://kpt.dev/faq/
    - https://opensource.googleblog.com/2020/03/kpt-packaging-up-your-kubernetes.html
    - https://porch.kpt.dev/
  summary:
    - >
      kpt is a package-centric toolchain for composing, transforming, validating, and
      deploying Kubernetes Resource Model configuration. It represents configuration as
      ordinary versionable data and applies reusable functions to it.
  timeline:
    - >
      2020: Google publicly introduced kpt as an open-source Kubernetes configuration
      packaging tool.
    - '2021: The project documented migration toward a backward-compatible v1 package format.'
    - >
      Later development: The CLI, independently versioned Go API, function ecosystem,
      deployment workflows, and Porch integration formed a broader KRM
      package-management stack.
  usage:
    - >
      Users fetch or create configuration packages, edit their resource files directly,
      run functions to transform or validate them, and commit the resulting data to
      version control. The CLI can also apply packages while maintaining inventory for
      pruning, status, and previews.
    - >
      A Kptfile at the package root carries package metadata and pipeline information.
      Cluster deployment requires Kubernetes credentials supplied through the user's
      environment or an explicitly provided credential file; the kpt documentation does
      not establish a kpt-specific credential-file location.
