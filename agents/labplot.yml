history:
  adoption-history:
    - >
      LabPlot became part of KDE's scientific-application ecosystem and is now
      distributed across Linux package repositories as well as through Flatpak, Snap,
      FreeBSD Ports, Homebrew, Windows installers, and signed macOS images. The
      project's download page documents this broad packaging footprint.
    - >
      The application has expanded from a KDE-oriented plotting program into a
      cross-platform research tool with import support for many scientific and
      statistical formats, computational notebooks, plot digitization, statistical
      analysis, and a command-line interface.
  package-nerd-significance:
    - >
      LabPlot is notable to package users as a substantial native, open-source
      alternative to proprietary scientific plotting packages. It combines a desktop GUI
      with KDE integration, reusable project files, numerous optional scientific
      dependencies, and increasingly scriptable interfaces.
    - >
      Its availability through both operating-system repositories and cross-platform
      packaging systems illustrates how a traditionally Linux/KDE scientific application
      evolved into a maintained macOS and Windows application as well.
  project-history:
    - >
      LabPlot 2 was developed as a complete rewrite of the earlier LabPlot 1 codebase.
      The project released the first stable LabPlot 2 version in January 2014 and
      announced its intention to move onto KDE infrastructure and join KDE Education.
    - >
      Later releases steadily added plot digitization, computational notebooks,
      additional scientific file formats, statistical and signal-processing tools,
      live-data support, and cross-platform packaging. In 2024 the project began moving
      its user documentation to a new Sphinx-based manual, and the 2.12 release in 2025
      continued the mature 2.x line.
  related-projects:
    - >
      LabPlot belongs to KDE's education and scientific-software ecosystem and can use
      computational backends associated with projects such as Maxima, Python, Sage, and
      KAlgebra.
    - >
      Its workflow overlaps with scientific plotting, numerical-analysis, notebook, and
      plot-digitization packages, while retaining a native project-oriented desktop
      interface.
  sources:
    - https://docs.labplot.org/en/
    - https://invent.kde.org/education/labplot
    - https://labplot.org/categories/release-notes/
    - https://labplot.org/pages/download/
    - https://labplot.org/posts/labplot-2-0-0-released/
  summary:
    - >
      LabPlot is a free, open-source, cross-platform application for scientific data
      visualization and analysis. It provides project-based data management, interactive
      plotting, statistical and numerical analysis, computational notebooks, data import
      and export, plot digitization, and automation interfaces.
  timeline:
    - '2014: The first stable LabPlot 2 release completed a major rewrite of LabPlot 1.'
    - '2016: LabPlot 2.2 added the Data Picker tool for extracting data from plot images.'
    - '2020: LabPlot 2.8 broadened notebook, dataset, and plotting capabilities.'
    - '2024: The project began transferring its user documentation to a new format.'
    - >
      2025: LabPlot 2.12 expanded supported formats, visualizations, analysis features,
      and validated example projects.
  usage:
    - >
      Users create projects containing spreadsheets, matrices, worksheets, plots, and
      analysis objects; import experimental or statistical data; perform fitting,
      transforms, interpolation, smoothing, and other analyses; and export plots to
      raster or vector formats.
    - >
      The application is used by researchers, engineers, students, and educators who
      want reproducible interactive analysis without relying on a proprietary plotting
      environment. Its CLI, scripting, and SDK work also make it relevant to automated
      or embedded scientific workflows.
