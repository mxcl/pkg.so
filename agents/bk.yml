id: brew:bk
display-name: bk
repo: null
docs:
  - https://github.com/aeosynth/bk#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package-manager data lists Homebrew, Nix, and openSUSE packaging. The
      README's primary upstream install path is cargo install bk, so system packages are
      convenience packaging around a Rust CLI tool.
  package-nerd-significance:
    - >
      bk is a small but tidy example of Rust single-binary packaging in the
      terminal-media niche: no Python/curses runtime stack, quick startup, and enough
      EPUB support for keyboard-driven reading.
    - >
      Its package appeal is strongest for users who want ebook reading to behave like
      the rest of their terminal workflow.
  project-history:
    - >
      The repository was created in 2020 and published early 0.x releases the same year.
      The release history includes v0.2.0 in June 2020, v0.5.3 in March 2021, and v0.6.0
      in November 2023.
  related-projects:
    - epr is listed by the README as inspiration.
    - epy is compared in the README's feature table.
    - >
      nnn is mentioned as an example file manager that can use bk --meta for preview
      integration.
  sources:
    - https://github.com/aeosynth/bk#readme
    - source_facts.package-manager
  summary:
    - >
      bk is a terminal EPUB reader written in Rust. Its README emphasizes a
      cross-platform single binary with instant startup, EPUB 2/3 support, Vim bindings,
      incremental search, and bookmarks.
  timeline:
    - '2020: aeosynth/bk repository created.'
    - '2020-06-17: v0.2.0 release published.'
    - '2021-03-27: v0.5.3 release published.'
    - '2023-11-03: v0.6.0 release published.'
  usage:
    - >
      Users run bk with an EPUB path, or without a path to reopen the most recent EPUB.
      Options include metadata output, starting with the table of contents open, and
      setting display width and colors.
    - >
      The README compares bk with epr/epy, highlighting no runtime dependencies,
      wide-character support, incremental and multi-line search, links, themes, and the
      --meta switch for file-preview integration.
related-packages:
  - id: brew:epr
    reason: >
      Choose epr for a Python-based terminal EPUB reader with image opening,
      regular-expression search, and reading-history selection; choose bk for a single
      Rust binary with incremental and multiline search, links, and wide-character
      support.
    rel: alternative
    sources:
      - https://github.com/aeosynth/bk#readme
      - https://github.com/wustho/epr#readme
