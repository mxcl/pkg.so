history:
  adoption-history:
    - >
      MacPulse is available as a direct macOS application and through the Homebrew cask
      `macpulse`. Reliable evidence for broader or long-term adoption is not yet
      available.
  package-nerd-significance:
    - >
      MacPulse combines live system monitoring with retained local metrics,
      deterministic insights, performance-session recording, CSV export, and menu-bar
      operation. Its documented SQLite storage makes the history accessible to users who
      care about where monitoring data lives.
  project-history:
    - >
      MacPulse emerged as a native macOS monitoring dashboard focused on both current
      measurements and historical analysis. Its official guide documents seven
      monitoring areas, rule-based insights, configurable fan control, widgets, and
      high-resolution performance sessions.
  related-projects:
    - Activity Monitor
    - iStat Menus
    - TG Pro
    - Stats
  sources:
    - https://www.macpulse.app/
    - https://www.macpulse.app/guide.html
    - source_facts.package-manager.brew-cask
  summary:
    - >
      MacPulse is a macOS system-monitoring dashboard with menu-bar metrics, historical
      analytics, rule-based insights, fan controls, and performance-session recording.
  timeline:
    - >
      2026: The official MacPulse site and comprehensive user guide document the
      application's monitoring, history, insight, and session-recording workflow.
  usage:
    - >
      Users monitor CPU, memory, network, disk, thermals, fans, battery, Bluetooth
      accessories, GPU activity, and active processes from a dashboard or menu-bar
      popover.
    - >
      MacPulse retains historical measurements in `~/Library/Application
      Support/MacPulse/macpulse.sqlite`, compacts older samples, and can export history
      or performance sessions as CSV. License activation is validated online and stored
      in the macOS Keychain.
