credentials-file-location: null
history:
  adoption-history:
    - >
      SEB was introduced to the Moodle community in 2009 and was used for an ETH Zurich
      computing-lab examination that year. It subsequently integrated with Moodle,
      ILIAS, OpenOlat, and other assessment systems. ETH Zurich and SWITCH launched the
      SEB Consortium in 2016 to sustain development, maintenance, and support; the
      project reports use by educational organizations worldwide.
  package-nerd-significance:
    - >
      Safe Exam Browser is a prominent example of endpoint lockdown packaged as a
      specialized browser rather than a conventional web application. Its cross-platform
      encrypted .seb configuration format, LMS integrations, kiosk controls, and
      institutional deployment requirements make it unusually important to education IT
      administrators.
  project-history:
    - >
      Safe Exam Browser originated from an idea by Stefan Schneider at the University of
      Giessen and was developed at ETH Zurich. Early releases established a locked-down
      assessment client; work funded through the AAA/SWITCH program expanded the project
      and its platform coverage. The macOS port adopted WebKit and entered beta in 2010.
      Version 2.0 later introduced encrypted, per-exam configuration shared across
      supported platforms.
  related-projects:
    - >
      SEB integrates with learning-management and assessment systems including Moodle,
      ILIAS, OpenOlat, Open edX, Canvas, and commercial assessment platforms.
    - The SEB Consortium coordinates institutional support for the open-source project.
  sources:
    - https://safeexambrowser.org/
    - https://safeexambrowser.org/about_overview_en.html
    - https://safeexambrowser.org/macosx/mac_usermanual_en.html
  summary:
    - >
      Safe Exam Browser is a managed, lockdown-oriented browser environment for
      conducting web-based examinations on controlled or student-owned devices.
  timeline:
    - >
      2009: SEB was introduced to the Moodle community and used for an ETH Zurich
      computing-lab examination.
    - '2010: The AAA/SWITCH development project began and the first macOS beta was released.'
    - '2013: The project prepared SEB 2.0 and its updated platform baseline.'
    - '2016: ETH Zurich and SWITCH launched the Safe Exam Browser Consortium.'
  usage:
    - >
      Institutions create a .seb configuration containing the start URL, permitted
      resources, security controls, and exam-system settings, then distribute it to
      candidates or managed computers. SEB opens the assessment while restricting system
      commands, other applications, navigation, and unrelated web resources according to
      that configuration.
