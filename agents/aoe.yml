credentials-file-location: null
history:
  adoption-history:
    - >
      AoE entered package-manager culture through a Homebrew formula named `aoe`, and
      its README advertises Homebrew, Nix, curl-install, and source-build paths. That
      packaging choice is central to its audience: developers who already install
      AI-agent CLIs and want a single manager installed like any other terminal tool.
    - >
      The README says the project is maintained by the Agent of Empires community with
      support from Mozilla.ai and includes public channels such as GitHub issues, a
      roadmap board, Discord, YouTube, and social accounts. It also acknowledges
      inspiration from `agent-deck`, another terminal-oriented agent session manager.
  package-nerd-significance:
    - >
      AoE is interesting to package nerds because it packages a fast-moving AI-agent
      workflow as a normal CLI with shell completions, config files, a service-like web
      mode, and update logic. It also exposes the messy integration edges of modern dev
      tooling: tmux, containers, worktrees, browser UIs, multiple agent CLIs, and
      per-repo policy.
  project-history:
    - >
      The project README frames AoE as an answer to the operational problem created by
      running many coding agents at once: tracking which session is active, blocked,
      idle, or messy. Its core abstraction is a persistent tmux session per agent, with
      an AoE TUI and optional web dashboard on top.
    - >
      AoE's official documentation expanded beyond a simple TUI into a full workflow
      tool. The current docs cover a web dashboard, structured ACP view, remote phone
      access, git worktrees, multi-repo workspaces, Docker and Podman sandboxing, diff
      review, repo config, hooks, sound and push notifications, shell completions, and
      an HTTP API.
  related-projects:
    - tmux provides AoE's persistent terminal session substrate.
    - agent-deck is acknowledged by the upstream README as an inspiration.
    - >
      Claude Code, Codex CLI, OpenCode, Gemini CLI, Cursor CLI, Copilot CLI, and other
      agent CLIs are managed by AoE.
  sources:
    - https://github.com/agent-of-empires/agent-of-empires#readme
    - https://github.com/agent-of-empires/agent-of-empires.git tags via `git ls-remote --tags`
    - https://www.agent-of-empires.com/docs/guides/configuration/
    - https://www.agent-of-empires.com/docs/installation/
    - https://www.agent-of-empires.com/guides/repo-config/
  summary:
    - >
      Agent of Empires is a Rust terminal session manager for AI coding agents. It wraps
      tmux, git worktrees, optional container sandboxes, and a browser dashboard around
      tools such as Claude Code, Codex CLI, OpenCode, Gemini CLI, Cursor CLI, Copilot
      CLI, and others.
  timeline:
    - '2025: Early public tags such as `v0.0.1` appear in the upstream Git repository.'
    - '2025: README documents Homebrew installation with `brew install aoe`.'
    - '2026: Official docs describe layered global, profile, and repo configuration for AoE.'
  usage:
    - >
      The documented quick start is `aoe` to launch the TUI, `aoe add --cmd claude` to
      create a session, and `aoe serve` to start the web dashboard. AoE keeps sessions
      alive in tmux after terminals close and lets users reattach or inspect status
      later.
    - >
      Configuration is layered. Official docs state that global config, profile config,
      and repo config are resolved in order, with repo-local
      `.agent-of-empires/config.toml` able to define hooks, sandbox behavior, worktree
      settings, and default agents for a project.
related-packages:
  - id: brew:claude-squad
    reason: >
      Choose Claude Squad for a narrower terminal TUI centered on tmux, Git worktrees,
      and diff review; choose AoE when browser access, HTTP APIs, ACP views, or
      container sandboxes matter.
    rel: alternative
    sources:
      - https://github.com/agent-of-empires/agent-of-empires#readme
      - https://github.com/smtg-ai/claude-squad#readme
  - id: brew:tmux
    reason: >
      Install tmux as AoE's required session substrate; AoE stores each agent in a tmux
      session so it survives interface exits and SSH disconnects.
    rel: adjacent_workflow
    sources:
      - https://github.com/agent-of-empires/agent-of-empires#readme
      - https://github.com/tmux/tmux/wiki
