history:
  adoption-history:
    - >
      Cycling '74 says Max has been used to connect the components of commercial
      products, art installations, and stage shows. Its reach expanded through Jitter
      for video and graphics, Max for Live for Ableton Live integration, Gen for
      lower-level processing, and an integrated package manager for community add-ons.
  package-nerd-significance:
    - >
      Max is a long-lived visual programming environment with its own patcher format,
      object ecosystem, extension APIs, and in-application package manager. It sits at
      an unusual intersection of programming language, media workstation, prototyping
      system, and live-performance tool.
    - >
      For package-oriented users, Max matters both as a host application and as an
      ecosystem: its package manager exposes add-ons for computer vision, controllers,
      and other specialist hardware, while C++, Node.js, Java, and JavaScript extension
      points support custom objects and tooling.
  project-history:
    - >
      Max originated at IRCAM in the late 1980s and was created by Miller Puckette.
      David Zicarelli worked on the environment before founding Cycling '74 in 1997; the
      company initially sold the MSP audio add-on and later took over Max development
      and sales from Opcode Systems.
    - >
      Cycling '74 broadened the platform with Jitter in 2001, co-developed Max for Live
      with Ableton in 2009, introduced Gen in 2011, and added RNBO in 2022.
  related-projects:
    - MSP adds real-time audio and signal-processing objects.
    - Jitter adds video, matrix, and graphics processing.
    - Max for Live embeds Max devices and editing workflows in Ableton Live.
    - >
      Gen provides lower-level patching and code-generation facilities; RNBO targets
      exportable audio systems.
  sources:
    - https://cycling74.com/company
    - https://cycling74.com/products/max
    - https://docs.cycling74.com/
    - https://docs.cycling74.com/learn/articles/01_mspintro/
  summary:
    - >
      Max, historically called Max/MSP, is Cycling '74's visual programming environment
      for interactive audio, video, graphics, hardware control, and custom software.
  timeline:
    - 'Late 1980s: Miller Puckette created the Max environment at IRCAM.'
    - "1997: David Zicarelli founded Cycling '74."
    - "2001: Cycling '74 added Jitter."
    - "2009: Cycling '74 and Ableton introduced Max for Live."
    - "2011: Cycling '74 introduced Gen."
    - "2022: Cycling '74 introduced RNBO."
  usage:
    - >
      Users construct programs by placing objects on a patcher canvas and connecting
      them with patch cords. Common work includes synthesizers, effects, MIDI-controlled
      systems, audiovisual installations, hardware prototypes, and Max for Live devices.
    - >
      Max can be extended with community packages and custom components written using
      C++, Node.js, Java, or JavaScript.
