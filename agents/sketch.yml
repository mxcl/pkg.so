history:
  adoption-history:
    - >
      Sketch credits its early growth to an active design community that produced
      plugins, icon sets, interface kits, and other resources. The company reported
      passing one million customers in 2019.
    - >
      Its focus on interface design and a comparatively accessible native Mac
      application helped establish Sketch as a widely used product-design tool. Later
      Workspace and web-app features broadened it from an individual drawing application
      into a collaborative design platform.
  package-nerd-significance:
    - >
      Sketch helped define the modern distribution pattern for professional macOS design
      tools: a proprietary, frequently updated application surrounded by plugins,
      reusable libraries, cloud collaboration, and developer-handoff workflows.
    - >
      For package-catalog users, it is a canonical macOS design cask rather than a
      source-built utility. Its documents, Workspace data, version history, and
      extensions are user assets distinct from the installed application bundle.
  project-history:
    - >
      Pieter Omvlee and Emanuel Sá created Sketch in 2010 to make interface design a
      first-class discipline. The first versions were built collaboratively by the two
      founders and released as a native Mac application.
    - >
      The application developed alongside a community that shared plugins, icon sets,
      interface kits, and other resources. Sketch later added shared Libraries,
      prototyping, browser-based review and handoff, and Workspace document storage.
    - >
      By 2019 Sketch had passed one million customers. Its current platform combines the
      macOS editor with a web application and collaborative Workspaces while retaining
      support for local Sketch documents.
  related-projects:
    - Sketch Libraries provide reusable design components across documents.
    - >
      The Sketch web app supports document viewing, collaboration, version history, and
      developer handoff alongside the native Mac editor.
    - >
      Community plugins extend the Mac application and were important to Sketch's early
      ecosystem.
  sources:
    - https://www.sketch.com/blog/from-one-to-one-million/
    - https://www.sketch.com/docs/
    - https://www.sketch.com/docs/getting-started/saving-and-managing-documents/
  summary:
    - >
      Sketch is a native macOS interface-design and prototyping application paired with
      browser-based collaboration, document management, design libraries, and developer
      handoff.
  timeline:
    - '2010: Pieter Omvlee and Emanuel Sá release the first version of Sketch.'
    - '2019: Sketch passes one million customers.'
    - '2020-10-22: Sketch publishes its retrospective on ten years of community-driven growth.'
  usage:
    - >
      Designers use Sketch to create interfaces, reusable components and Libraries,
      interactive prototypes, and exportable assets. Teams save documents locally or in
      a Workspace, collaborate through the web app, inspect designs for implementation,
      and retain named or starred document versions.
