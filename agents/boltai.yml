config-file-location:
  macos:
    - ~/Library/Application Support/co.podzim.BoltGPT
credentials-file-location:
  macos:
    - macOS Keychain
    - >
      ~/Library/Application Support/co.podzim.BoltGPT (encrypted API-service records in
      BoltAI's local database)
history:
  adoption-history:
    - >
      BoltAI broadened from a native chat interface into a multi-provider AI workspace
      supporting OpenAI-compatible services, Anthropic, local models through Ollama,
      custom endpoints, AI commands, inline assistance, prompt libraries, chat
      organization, and import/export workflows.
    - >
      Its bring-your-own-key model appeals to users who want direct requests to model
      providers and local chat storage rather than routing prompts through an
      intermediary chat service.
  package-nerd-significance:
    - >
      BoltAI is representative of the macOS-native, bring-your-own-key LLM-client
      ecosystem. Package-oriented users care about its support for local Ollama models,
      custom endpoints, configurable data locations, local SQLite-backed data, Keychain
      integration, and scriptable AI workflows.
  project-history:
    - >
      BoltAI was developed as a native macOS AI client and underwent two major rewrites,
      according to its official feature documentation, to improve live-chat rendering
      performance. It subsequently expanded beyond basic chat into system-wide AI
      Command and AI Inline features.
    - >
      The application’s architecture emphasizes local persistence and direct provider
      access: chats and service configuration are stored locally, while prompts are sent
      directly to the selected AI provider.
  related-projects:
    - BoltAI supports OpenAI and other hosted AI providers through user-supplied credentials.
    - Ollama integration permits fully local model use.
    - >
      Custom OpenAI-compatible endpoints and proxies allow connection to additional
      model servers.
  sources:
    - >
      Official API-key storage explanation:
      https://docs.boltai.com/blog/how-boltai-handles-your-api-keys
    - 'Official Help Center: https://boltai.com/help'
    - 'Official data-locations guide: https://docs.boltai.com/docs/chat-ui/locations'
    - 'Official features documentation: https://docs.boltai.com/docs/features'
    - 'Official setup guide: https://docs.boltai.com/docs/start/setup'
  summary:
    - >
      BoltAI is a native macOS client for interacting with hosted and local large
      language models. It combines chat management with system-wide commands, inline
      assistance, plugins, model tuning, and bring-your-own-key provider access.
  timeline:
    - 'Early development: BoltAI underwent two major rewrites to improve performance.'
    - >
      Later releases: Support expanded to multiple AI providers, custom endpoints,
      plugins, AI Command, AI Inline, and local models through Ollama.
  usage:
    - >
      Users select an AI provider, enter an API key or configure a local endpoint, and
      converse through the native chat interface. Power users invoke AI inside other
      applications, create assistants and prompt workflows, adjust model parameters,
      export chats, or point BoltAI at Ollama for offline operation.
