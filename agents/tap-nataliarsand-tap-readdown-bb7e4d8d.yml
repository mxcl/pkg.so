history:
  adoption-history:
    - >
      Readdown is distributed as a native macOS application with a Quick Look extension
      and can be installed from the maintainer's Homebrew tap. It is free to use,
      requires no account, and includes an automatic updater.
  package-nerd-significance:
    - >
      Readdown fills a focused macOS packaging niche: making Markdown behave like a
      document format in Finder rather than forcing it into a code editor. The
      application and its Quick Look extension cover both double-click and
      spacebar-preview workflows.
    - >
      Its read-only design is useful when inspecting README files, documentation, agent
      instructions, and generated reports without risking edits or invoking a full
      development environment.
  project-history:
    - >
      Readdown was built as a lightweight, read-only Markdown reader for macOS with an
      accompanying Finder Quick Look extension. It subsequently added syntax
      highlighting, offline mathematics, Mermaid diagrams, printing and PDF export,
      navigation, rich copying, and document tables of contents.
  related-projects:
    - Apple Quick Look supplies the Finder extension point used for spacebar previews.
    - KaTeX and Mermaid provide offline equation and diagram rendering within documents.
  sources:
    - https://github.com/nataliarsand/readdown#readme
    - https://github.com/nataliarsand/readdown/blob/main/CHANGELOG.md
    - https://readdown.app/
    - https://readdown.app/help
  summary:
    - Readdown is a read-only native macOS Markdown reader and Quick Look preview extension.
  timeline:
    - >
      Early releases: Readdown established native document viewing and Finder Quick Look
      previews.
    - >
      1.18: Appearance controls, YAML front-matter rendering, and guarded application
      links were added.
    - >
      1.19: Tables of contents, navigation history, window tabs, and Homebrew
      installation were added.
  usage:
    - >
      Users can make Readdown the default application for Markdown files and enable its
      Quick Look extension in System Settings. Double-clicking opens a rendered,
      read-only document; selecting a file in Finder and pressing Space opens a rendered
      preview.
    - >
      It renders syntax-highlighted code, TeX mathematics, Mermaid diagrams, tables,
      task lists, and images while leaving source files unchanged.
related-packages:
  - id: cask:qlmarkdown
    reason: >
      Choose QLMarkdown when you primarily want a highly configurable Quick Look
      generator and Markdown-to-HTML utility; choose Readdown when you also want a
      polished read-only document application.
    rel: alternative
    sources:
      - https://github.com/nataliarsand/readdown#readme
      - https://github.com/sbarex/QLMarkdown#readme
