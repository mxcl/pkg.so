history:
  adoption-history:
    - >
      OrbStack is distributed as a signed macOS application and through a Homebrew cask.
      It targets developers who otherwise use Docker Desktop or manually managed Linux
      virtual machines on Apple hardware.
  package-nerd-significance:
    - >
      OrbStack matters to package-oriented macOS developers because it supplies a
      lightweight local runtime beneath familiar Docker tooling while also exposing
      complete Linux machines. This allows existing container-oriented command lines and
      development workflows to remain useful without making Docker Desktop the local
      runtime.
  project-history:
    - >
      OrbStack was developed as a macOS-focused environment for running Docker
      containers and Linux machines with an emphasis on speed, low resource use, and
      native integration.
  related-projects:
    - >
      OrbStack is positioned as an alternative runtime for Docker Desktop workflows and
      supports Docker-compatible containers alongside standalone Linux machines.
  sources:
    - https://docs.orbstack.dev/
    - https://orbstack.dev/
    - 'source_facts.version: 2.2.3,20963'
  summary:
    - >
      OrbStack is a macOS application for running Docker-compatible containers and Linux
      virtual machines. It emphasizes fast startup, low resource consumption, filesystem
      integration, networking, automatic domains, SSH, and migration from existing
      Docker environments.
  timeline:
    - '2026: The supplied Homebrew cask record identifies version 2.2.3, build 20963.'
  usage:
    - >
      Developers use OrbStack to run existing Docker Compose projects and container
      images or to create full Linux machines. Its integration features provide
      automatic domains, command-line and filesystem access, VPN behavior, and SSH
      access. The official documentation does not identify a stable user-editable
      configuration file or credentials file path.
