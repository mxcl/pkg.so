history:
  adoption-history:
    - >
      The application initially attracted security and network-analysis users through
      its integration with packet-capture tooling, Zeek, and Suricata. Its remit
      broadened as the underlying Zed project evolved into a general system for
      heterogeneous and nested data.
    - >
      Zui shipped native packages for Linux, macOS, and Windows. An Insiders channel
      provided weekday builds that could run alongside the stable application with
      separate data and service ports.
  package-nerd-significance:
    - >
      Zui packaged a complete local exploratory-data environment: an Electron interface,
      a bundled Zed lake service, query tooling, and optional packet-capture processing.
      This reduced the setup normally required to ingest and interactively inspect
      heterogeneous structured data.
    - >
      Its evolution from the security-focused Brim application to Zui, and later toward
      SuperDB Desktop in the same repository, records the broader evolution of the
      underlying data engine from Zed to SuperDB.
  project-history:
    - >
      The desktop application was originally called Brim and shared its name with Brim
      Security. After the company shifted its emphasis toward the Zed data model,
      language, engine, and lake in 2021, the application was repositioned as the
      graphical interface to Zed.
    - >
      Brim Data announced the Zui name in November 2022, deriving it from 'Zed user
      interface'. Brim 0.31.0 was the final release under the old application name.
    - >
      Zui subsequently added general data-ingest, query, visualization, and
      lake-management features alongside its established packet-capture workflows. The
      upstream repository now presents the continuing application as SuperDB Desktop,
      reflecting the underlying project's later SuperDB identity.
  related-projects:
    - >
      Zed supplied the data model, query language, lake service, formats, and
      command-line tools used by Zui.
    - Brimcap provided Zui's packet-capture workflows and integrations with Zeek and Suricata.
    - >
      SuperDB is the successor identity of the underlying data platform and the current
      focus of the same desktop repository.
  sources:
    - https://github.com/brimdata/zui
    - https://github.com/brimdata/zui/releases
    - https://www.brimdata.io/blog/brim-app-will-be-zui/
    - https://www.brimdata.io/blog/july-2024-release/
    - https://zui.brimdata.io/docs
  summary:
    - >
      Zui is the former name of Brim Data's open-source desktop interface for exploring,
      querying, and managing data in Zed lakes. The same upstream repository has since
      evolved toward the name SuperDB Desktop.
  timeline:
    - '2021-04: Brim Security shifted its flagship focus to Zed and became Brim Data.'
    - '2022-11: Brim Data announced that the Brim application would become Zui.'
    - '2024-06: Zui added native Apple-silicon packages and expanded packet-capture settings.'
    - '2024-07: Zui synchronized its release numbering with Zed.'
    - >
      By 2026: The upstream repository presented the continuing application as SuperDB
      Desktop.
  usage:
    - >
      Users import files by drag-and-drop, inspect inferred structures, filter or pivot
      values, and write Zed queries for more advanced transformations and analysis.
      Results can be displayed in nested or tabular views and exported in formats
      including Parquet.
    - >
      Zui automatically starts a local Zed lake service. Security-oriented workflows use
      the bundled Brimcap component to ingest packet captures and generate Zeek and
      Suricata data.
