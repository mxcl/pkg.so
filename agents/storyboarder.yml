id: cask:storyboarder
display-name: Storyboarder
repo: null
docs:
  - https://github.com/wonderunit/storyboarder#readme
  - https://wonderunit.com/software/storyboarder
config-file-location:
  linux:
    - ~/.config/Storyboarder/pref.json
  macos:
    - ~/Library/Application Support/Storyboarder/pref.json
  windows:
    - '%APPDATA%\Storyboarder\pref.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Wonder Unit released Storyboarder free and open source for macOS, Windows, and
      Linux. Its audience includes story artists, writers, directors, advertisers, and
      other creators who need rapid visual planning rather than a full animation suite.
  package-nerd-significance:
    - >
      Storyboarder is an unusually accessible open-source desktop creative tool built
      with Electron and distributed across all three major desktop platforms. Its plain
      project files, Fountain screenplay support, Photoshop round-tripping, and
      Git-oriented collaboration make it friendly to file-based creative workflows.
  project-history:
    - >
      Wonder Unit built Storyboarder because the studio could not find the streamlined
      storyboarding tool it wanted. The project intentionally treats storyboarding as
      fast drawing and organization: create or import a script, draw boards, sequence
      them, play an animatic, and iterate.
  related-projects:
    - Fountain screenplay files can be opened as a starting point for boards.
    - Photoshop can be configured as an external image editor.
    - >
      Shot Generator and the project's VR features extend the workflow into
      three-dimensional shot planning.
  sources:
    - https://github.com/wonderunit/storyboarder#readme
    - https://github.com/wonderunit/storyboarder/blob/master/package.json
    - https://wonderunit.com/software/storyboarder/
  summary:
    - >
      Storyboarder is Wonder Unit's free, open-source desktop application for rapidly
      drawing, organizing, presenting, and exporting storyboards.
  timeline:
    - '2017: Storyboarder 1.0 became available for macOS, Windows, and Linux.'
    - '2020: The 2.x line expanded Shot Generator and VR-oriented planning features.'
  usage:
    - >
      Users start a blank storyboard or open a Fountain screenplay, draw boards with a
      mouse or pen tablet, reorder and play them as an animatic, and export or send
      artwork to Photoshop for refinement. Printed worksheets provide an
      analog-to-digital capture workflow.
