id: brew:docx2txt
display-name: docx2txt
repo: http://docx2txt.cvs.sourceforge.net/
docs:
  - https://docx2txt.sourceforge.net/
config-file-location:
  unix:
    - ./docx2txt.config
    - ~/docx2txt.config
    - /etc/docx2txt.config
  windows:
    - .\docx2txt.config
    - '%APPDATA%\docx2txt.config'
    - <script-directory>\docx2txt.config
credentials-file-location: null
history:
  adoption-history:
    - >
      docx2txt spread through package managers and text-processing workflows rather than
      through a large upstream community. The official site lists examples of direct or
      indirect usage, including search/indexing systems and an Oxford University Press
      hot-folder workflow, while Homebrew continues to package v1.4 with low but steady
      install activity.
  package-nerd-significance:
    - >
      docx2txt is package-nerd significant as a small, dependency-light bridge between
      binary-ish office documents and plain-text automation. It is the kind of utility
      that stays useful in scripts, search indexes, mail pipelines, and recovery
      workflows long after its upstream release cadence slows.
  project-history:
    - >
      The official SourceForge page lists releases from v0.1 in August 2008 through v1.4
      in May 2014. Its homepage describes support for character conversion, text
      alignment, hyperlinks, lists, wrapper scripts, standard input and output, and
      multiple command-line unzip backends.
  related-projects:
    - >
      The official page relates docx2txt to command-line unzip tools such as Unzip,
      7-Zip, PKZip, WinZip, and CakeCmd, and to editor/file-manager workflows in
      Midnight Commander, Vim, and Emacs.
  sources:
    - https://docx2txt.sourceforge.net/
    - https://sourceforge.net/projects/docx2txt/
    - https://sourceforge.net/p/docx2txt/code/
    - https://formulae.brew.sh/api/formula/docx2txt.json
  summary:
    - >
      docx2txt is a Perl-based command-line utility for extracting formatted plain text
      from Microsoft Office `.docx` files. It reflects a classic Unix-filter approach to
      Office Open XML documents: unzip the archive, read the XML, and write text
      suitable for terminals, scripts, and editors.
  timeline:
    - '2008-08: v0.1 released.'
    - '2009-10: v1.0 released.'
    - '2012-01: v1.2 released.'
    - '2014-05: v1.4 released and homepage last updated.'
    - '2026: Homebrew continues to package v1.4.'
  usage:
    - >
      The tool is commonly used as `docx2txt.pl input.docx output.txt` or as a filter
      through wrapper scripts. The official page documents integrations for Midnight
      Commander, Vim, and Emacs so `.docx` files can be viewed as text from existing
      editor/file-manager workflows.
related-packages:
  - id: brew:pandoc
    reason: >
      Choose Pandoc when you need DOCX input converted to plain text or many other
      output formats with a much broader, actively documented conversion pipeline;
      choose docx2txt for a small focused extractor with damaged-file recovery use
      cases.
    rel: alternative
    sources:
      - https://docx2txt.sourceforge.net/
      - https://pandoc.org/MANUAL.html
tags:
  - cli
  - document-conversion
  - docx
  - perl
  - text-extraction
