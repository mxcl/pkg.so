credentials-file-location: null
history:
  adoption-history:
    - >
      iVolume found a niche among Apple Music and iTunes users with large local
      libraries who wanted consistent perceived loudness without re-encoding their
      audio. The product also shipped for Windows, while the Homebrew cask provides a
      package-managed route for its Mac edition.
    - >
      Its continuing compatibility work followed major ecosystem changes including
      successive iTunes releases, 64-bit systems, Apple’s replacement of iTunes with
      Music on macOS, and the transition to Apple silicon.
  package-nerd-significance:
    - >
      iVolume is a specialist metadata-oriented audio utility rather than an audio
      transcoder. It demonstrates the ReplayGain ecosystem’s separation between
      measuring perceived loudness and destructively rewriting audio samples.
    - >
      For package users, the cask automates installation of a proprietary GUI
      application whose durable value comes from integration with Apple’s library and
      Sound Check metadata conventions.
  project-history:
    - >
      iVolume was developed by Manfred Schwind Software to improve the loudness
      information used by Apple’s Sound Check feature. It analyzes perceived loudness
      with a ReplayGain-based algorithm and replaces the `iTunNORM` metadata used at
      playback time without re-encoding songs.
    - >
      Version 3 was rewritten for Mac and Windows with multicore processing, album-aware
      adjustment, configurable groups, and remembered analysis results. Later releases
      added 64-bit modernization, compatibility with Apple Music on macOS Catalina, and
      native Apple-silicon support.
  related-projects:
    - ReplayGain supplies the loudness-analysis approach used by iVolume.
    - >
      Apple Music, iTunes, Sound Check, and the `iTunNORM` tag form the playback and
      metadata ecosystem with which iVolume integrates.
  sources:
    - https://www.mani.de/en/ivolume/faq.html
    - https://www.mani.de/en/ivolume/help.html
    - https://www.mani.de/en/ivolume/history.html
    - https://www.mani.de/en/ivolume/index.html
  summary:
    - >
      iVolume is a proprietary Mac and Windows utility that analyzes perceived song
      loudness and writes improved Sound Check metadata for Apple Music and iTunes
      libraries. It changes playback adjustment information without re-encoding the
      audio.
  timeline:
    - >
      Version 3.0: Rewritten for Mac and Windows with multicore processing, album
      handling, and configurable groups.
    - 'Version 3.5: Automatically handled songs lacking an `iTunNORM` tag.'
    - 'Version 3.7: Modernized as a 64-bit application.'
    - 'Version 3.8.0: Added support for macOS Catalina and Apple Music.'
    - 'Version 3.9.0: Added native Apple-silicon operation and full macOS Big Sur support.'
  usage:
    - >
      In the default workflow, users enable Sound Check, open iVolume, and start
      analysis of their Apple Music or iTunes library. iVolume calculates and applies
      improved loudness metadata; it need not remain installed or running during
      playback.
    - >
      Groups provide specialized adjustment policies, while album modes preserve
      intentional relative loudness between tracks. The documented per-library plist
      retains library configuration and previous analysis results.
