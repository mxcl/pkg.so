history:
  adoption-history:
    - >
      TextSniper is distributed as a focused commercial Mac utility rather than a large
      framework or service. Its release history shows continuing adaptation to new macOS
      recognition capabilities, languages, and Apple Silicon hardware.
  package-nerd-significance:
    - >
      TextSniper packages a narrow operating-system capability—screen-region OCR—into a
      global shortcut and clipboard workflow characteristic of small macOS menu-bar
      utilities.
  project-history:
    - >
      Public release notes document active development from at least August 2020.
      Subsequent releases added multilingual recognition, Apple Silicon support,
      text-to-speech, QR and barcode recognition, custom vocabulary, and additive
      clipboard features.
  related-projects:
    - TextSniper relies on macOS text-recognition and accessibility facilities.
    - >
      Its output is designed to be pasted into editors, note applications, messengers,
      and other clipboard-aware software.
  sources:
    - https://textsniper.app/
    - https://textsniper.app/release
  summary:
    - >
      TextSniper is a proprietary macOS menu-bar OCR utility that recognizes otherwise
      non-selectable text in a selected screen region and copies it to the clipboard.
  timeline:
    - >
      2020: Public release notes document TextSniper 1.1 and later multilingual and
      Apple Silicon support.
    - >
      2021: QR/barcode recognition, custom vocabulary, mobile-device capture, and
      expanded clipboard controls are added.
    - '2022: Recognition expands for additional languages available with macOS Ventura.'
  usage:
    - >
      Users invoke a global shortcut, draw a rectangle over text on screen, and paste
      the recognized result from the clipboard into another application.
    - >
      Optional workflows include preserving line breaks, accumulating multiple captures,
      reading recognized text aloud, and recognizing QR codes or barcodes.
