history:
  adoption-history:
    - >
      Base64 as an encoding is ubiquitous, but this package is specifically the
      Fourmilab utility distributed through package managers. The input metadata lists
      Homebrew, MacPorts, Chocolatey, Scoop, and apk packages, showing that the compact
      public-domain implementation has been repackaged across Unix, macOS, and Windows
      ecosystems.
    - >
      Its adoption is partly historical: many operating systems now ship a base64
      command through coreutils or similar base systems, but this standalone package
      remains useful where a tiny permissively reusable implementation is wanted.
  package-nerd-significance:
    - >
      This package is significant less because it invented Base64 and more because it
      captures a classic packaging pattern: a single-purpose public-domain C utility
      with a manpage-like homepage, tarball source release, and cross-platform
      package-manager afterlife.
    - >
      It also sits at the intersection of MIME, email history, uuencode replacement, and
      the modern expectation that binary-to-text encoders are available everywhere.
  project-history:
    - >
      The official Fourmilab page documents base64 in Unix manual-page style and
      identifies version 1.5 dated June 10, 2007. It explains Base64 as the MIME
      encoding described by RFC 1341 and successors, designed to carry arbitrary binary
      data through text-oriented mail systems.
    - >
      The distribution is not centered on a public source-control repository. Fourmilab
      provides a tar archive containing source code, a Unix Makefile, and a 32-bit
      Windows executable, plus a zip archive for Windows users.
  related-projects:
    - >
      uuencode and uudecode are listed by the official page as related tools and
      historical alternatives.
    - MIME and RFC 1341 are the protocol context for Base64 encoding.
    - >
      GNU coreutils and platform base64 commands are related modern implementations,
      although they are separate packages from the Fourmilab utility.
  sources:
    - https://www.fourmilab.ch/webtools/base64
    - https://www.fourmilab.ch/webtools/base64/rfc1341.html
    - source_facts.package-manager
  summary:
    - >
      Fourmilab base64 is John Walker's public-domain command-line encoder and decoder
      for Base64 files. It packages the MIME-era binary-to-text encoding as a small
      Unix-style filter.
  timeline:
    - '1992: RFC 1341 defined MIME mechanisms including Base64-style content transfer encoding.'
    - '2007: Fourmilab published base64 version 1.5 page and archive dated June 10, 2007.'
    - >
      2000s-2020s: Package-manager metadata shows the Fourmilab utility packaged for
      Homebrew, MacPorts, Chocolatey, Scoop, and apk.
  usage:
    - >
      The utility supports encode and decode modes, takes optional input and output
      files, and can use '-' or omitted filenames for stdin and stdout. The official
      page emphasizes pipeline use, especially as part of automated mail processing.
    - >
      There is no documented configuration file or credentials store; the command is
      controlled entirely by flags and file arguments.
related-packages:
  - id: brew:coreutils
    reason: >
      Choose GNU Coreutils when you want base64 alongside the standard GNU file, shell,
      and text utilities; choose this package for the small standalone Fourmilab
      implementation.
    rel: alternative
    sources:
      - https://www.fourmilab.ch/webtools/base64/
      - https://www.gnu.org/software/coreutils/manual/coreutils.html
  - id: brew:base91
    reason: >
      Choose basE91 when lower ASCII-armoring overhead matters more than Base64's much
      wider interoperability.
    rel: alternative
    sources:
      - https://www.fourmilab.ch/webtools/base64/
      - https://sourceforge.net/projects/base91/
  - id: brew:uudeview
    reason: >
      UUDeview complements simple Base64 filtering when decoding multipart email or
      Usenet material because it sorts parts and auto-detects MIME Base64 and several
      legacy encodings.
    rel: adjacent_workflow
    sources:
      - https://www.fourmilab.ch/webtools/base64/
      - https://github.com/hannob/uudeview#readme
