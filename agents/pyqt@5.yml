history:
  adoption-history:
    - >
      PyQt5 became the established PyQt generation for applications built on Qt 5 and
      remains distributed by Riverbank even after the arrival of Qt 6 and PyQt6. Its
      availability across Homebrew, Debian, Ubuntu, and Fedora-family package metadata
      reflects broad packaging across desktop-oriented Unix systems.
  package-nerd-significance:
    - >
      PyQt5 remains important to package maintainers because many applications still
      depend on Qt 5 APIs. It also illustrates the practical need for versioned
      formulas: PyQt5 and PyQt6 may coexist conceptually but target different major Qt
      runtimes, command names, and compatibility expectations.
  project-history:
    - >
      PyQt was created by Riverbank Computing as Python bindings for Qt. PyQt5 is the
      generation targeting Qt 5; it succeeded PyQt4 and was later joined by PyQt6 for Qt
      6. Riverbank states that PyQt5 remains supported, whereas PyQt4 is unsupported.
  related-projects:
    - Qt 5 is the underlying application framework.
    - SIP supplies Riverbank’s binding-generation and build technology.
    - PyQt6 is the newer generation targeting Qt 6.
  sources:
    - >
      Riverbank Computing official download page:
      https://www.riverbankcomputing.com/software/pyqt/download
    - >
      Riverbank Computing official introduction:
      https://www.riverbankcomputing.com/software/pyqt
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      PyQt5 is Riverbank Computing’s Python binding set for Qt 5, used for
      cross-platform Qt applications and distributed under GPL or commercial licensing.
  timeline:
    - '2010s: PyQt5 became the PyQt generation for Qt 5.'
    - '2020s: PyQt6 arrived for Qt 6 while PyQt5 remained supported.'
    - 'Current: Homebrew keeps PyQt5 available through the versioned pyqt@5 formula.'
  usage:
    - >
      Developers use PyQt5 modules to implement Qt applications in Python. The formula’s
      pyuic5 converts Qt Designer files to Python, pyrcc5 compiles Qt resource
      collections, and pylupdate5 supports translation workflows.
