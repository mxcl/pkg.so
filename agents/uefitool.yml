history:
  adoption-history:
    - >
      UEFITool emerged to fill the lack of cross-platform, open-source utilities for
      examining and modifying UEFI firmware images. Its engine also became the basis for
      the companion UEFIExtract and UEFIFind command-line tools.
  package-nerd-significance:
    - >
      UEFITool gives firmware researchers and system tinkerers a portable graphical view
      of the nested structures inside vendor firmware. The companion command-line tools
      make the same parsing engine useful in extraction, search, reverse-engineering,
      and automated analysis workflows.
  project-history:
    - >
      Development began in mid-2013. A major refactoring started in early 2015 to
      support newer UEFI features such as FFSv3 volumes and fixed image elements.
    - >
      The project evolved into a suite: UEFITool provides the graphical viewer and
      editor, UEFIExtract recursively exports parsed structures, and UEFIFind searches
      image elements for byte patterns.
  related-projects:
    - UEFIExtract and UEFIFind share UEFITool's parsing engine.
    - >
      The official README identifies TianoCore FMMT, Fiano, CHIPSEC,
      uefi-firmware-parser, and CERT UEFI Parser as related or alternative
      firmware-analysis tools.
  sources:
    - https://github.com/LongSoft/UEFITool#readme
    - https://github.com/LongSoft/UEFITool/releases
  summary:
    - >
      UEFITool is a cross-platform, open-source C++/Qt viewer and editor for firmware
      images conforming to the UEFI Platform Interface specifications.
  timeline:
    - '2013: Project development began.'
    - '2015: A major parser and architecture refactoring began for newer UEFI features.'
    - '2023: The release line adopted Qt 6.5 and a newer hex-view component.'
    - >
      2026: Active alpha releases continued with parser, architecture, and GUID-database
      improvements.
  usage:
    - >
      Users open a firmware image to inspect its tree structure, validate its integrity,
      search or extract components, and, where supported, manipulate image elements.
      Prebuilt binaries are available, while source builds use Qt with CMake or other
      supported build systems.
