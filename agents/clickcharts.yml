history:
  adoption-history:
    - >
      NCH expanded ClickCharts across Windows, macOS, Android, and Windows Store
      distributions. A free edition for non-commercial use lowered the barrier for home
      users, while the official release log shows continuing maintenance across the
      desktop platforms.
  package-nerd-significance:
    - >
      ClickCharts is a compact example of cross-platform proprietary productivity
      software shipped through desktop package channels. Its long release log also
      illustrates NCH's model of incrementally adding diagram types and maintaining
      separate platform builds.
  project-history:
    - >
      ClickCharts emerged as NCH Software's general diagram-drawing application. The
      earliest entries in its official build log date to 2013 and already include
      entity-relationship and data-flow diagrams, image insertion, connectors, and PDF
      export.
    - >
      Subsequent releases added richer selection and grouping, free and paid editions,
      graphing, chemistry drawing, more templates, and extensive symbol libraries. The
      current product positioning spans flowcharts, UML, ER diagrams, mind maps, process
      diagrams, organization charts, and conventional graphs.
  related-projects:
    - NCH DrawPad
    - NCH PhotoPad
  sources:
    - 'Official product page: https://www.nchsoftware.com/chart/index.html'
    - 'Official user guide: https://help.nchsoftware.com/help/en/clickcharts/win/'
    - 'Official version history: https://www.nchsoftware.com/chart/versions.html'
  summary:
    - >
      ClickCharts is NCH Software's diagram and flowchart editor for constructing
      process maps, organizational charts, mind maps, UML and ER diagrams, graphs, and
      related visual models.
  timeline:
    - >
      2013: The official build log begins with early Windows and macOS releases adding
      ER, data-flow, connector, image, and PDF capabilities.
    - >
      2015: ClickCharts introduced distinct free and paid editions and expanded grouping
      and editing features.
    - '2021: The product added graph samples and graphing features.'
    - '2022: Chemistry drawing support appeared in the Windows release line.'
    - '2024: NCH continued Windows and macOS maintenance releases in the 9.x series.'
  usage:
    - >
      Users start with a blank canvas or template, place symbols and connectors, style
      text, fills, lines, and arrowheads, then print or export the result. Supported
      scenarios include workflows, UML and ER models, organization charts, mind maps,
      value-stream maps, and imported-data graphs.
