id: cask:yed
display-name: yEd Graph Editor
repo: null
docs:
  - https://yed.yworks.com/support/manual
  - https://www.yworks.com/products/yed/release-notes
config-file-location:
  linux:
    - ~/.yEd/settings.xml
  macos:
    - ~/Library/yWorks/yEd/settings.xml
  windows:
    - '%APPDATA%\yWorks\yEd\settings.xml'
credentials-file-location: null
history:
  adoption-history:
    - >
      yEd became a cross-platform, no-cost desktop option for graph and diagram
      authoring. yWorks permits commercial use at no charge, while retaining a
      proprietary license and restricting redistribution and automated operation.
    - >
      The supplied Homebrew Cask identity shows adoption in macOS package-manager
      workflows, despite yEd itself remaining proprietary.
  package-nerd-significance:
    - >
      yEd occupies an unusual package-catalog niche: it is a mature,
      proprietary-but-free Java desktop application whose strongest differentiator is
      the automatic graph-layout technology inherited from yFiles.
    - >
      Its GraphML-centered workflow and broad import/export support make it useful as a
      visual companion to generated graph data, while the stable profile-directory
      convention makes preferences portable across installations.
  project-history:
    - >
      yEd emerged from the yWorks graph-visualization ecosystem. yWorks traces that
      ecosystem to a 1998 University of Tübingen project that evolved into the yFiles
      diagramming libraries; yEd is implemented with yFiles for Java.
    - >
      Over many releases, yEd expanded beyond general graph editing with UML, BPMN,
      entity-relationship, swimlane, mind-map, data-import, and automatic-layout
      capabilities. yWorks later introduced yEd Live as its browser-based relative.
  related-projects:
    - 'yFiles for Java: the diagramming library on which the desktop application is based.'
    - >
      yEd Live: yWorks' browser-based diagram editor, interoperable with desktop yEd
      through GraphML.
    - "GraphML: yEd's principal XML-based graph exchange format."
  sources:
    - 'Input package identity: source_facts.package-manager.brew-cask'
    - 'Official yEd manual: https://yed.yworks.com/support/manual/'
    - 'Official yEd product page: https://www.yworks.com/products/yed'
    - 'Official yEd release notes: https://www.yworks.com/products/yed/release-notes'
    - 'Official yWorks FAQ: https://www.yworks.com/faq?id=30037'
    - 'Official yWorks company history: https://www.yworks.com/company'
  summary:
    - >
      yEd Graph Editor is yWorks' cross-platform desktop application for manually
      creating diagrams or generating them from imported graph data. It is free to use,
      including commercially, but is not open source.
  timeline:
    - >
      1998: The university project that became the yWorks/yFiles diagramming ecosystem
      began at the University of Tübingen.
    - >
      2016: yWorks announced yEd 3.16 with expanded yFiles GraphML compatibility and
      hierarchical-layout options.
    - >
      2026: yEd remains actively maintained as a cross-platform desktop graph editor
      alongside yEd Live.
  usage:
    - >
      Users create flowcharts, UML and entity-relationship diagrams, mind maps, network
      visualizations, and other structured graphics, then apply automatic layouts or
      arrange elements manually.
    - >
      yEd imports formats including GraphML, GML, Excel spreadsheets, GEDCOM, and
      transformed XML, and exports diagrams to formats such as PDF, SVG, PNG, JPEG, and
      GraphML.
