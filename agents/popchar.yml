history:
  adoption-history:
    - >
      The official product page includes a customer account of using PopChar since its
      first appearance in 1987, illustrating its unusually long life as a Macintosh
      utility. Ergonis later expanded it to Windows, whose edition officially debuted in
      2004.
    - >
      PopChar has remained useful as character repertoires expanded from legacy
      encodings to Unicode and emoji. Its audience includes designers, translators,
      typographers, editors, developers, and other users who regularly work with
      specialized glyphs.
  package-nerd-significance:
    - >
      PopChar is a veteran example of the polished commercial desktop utility: it
      exposes capabilities already present in fonts and Unicode through a faster
      system-wide workflow than native character viewers.
    - >
      Its history spans classic Macintosh-era character handling, MacRoman
      compatibility, Unicode growth, Apple Silicon, and parallel macOS and Windows
      editions. That longevity makes it interesting to collectors and maintainers of
      long-lived desktop packages.
  project-history:
    - >
      PopChar first appeared on Macintosh in 1987. Ergonis subsequently became its
      developer and publisher, maintaining separate macOS and Windows editions.
    - >
      The Windows edition debuted in 2004. Later macOS releases added modern Unicode and
      emoji coverage, detailed character information, shape-based search, color-font
      handling, and native Apple Silicon support.
  related-projects:
    - >
      Ergonis also develops Typinator and KeyCue, which are distributed alongside
      PopChar as productivity utilities. PopChar can integrate with KeyCue to expose
      recently used or favorite characters.
  sources:
    - >
      https://blog.ergonis.com/hc/en-us/articles/23973279398556-PopChar-10-now-for-Windows-Setting-new-standards-in-character-and-font-management
      — official statement that the Windows edition debuted in 2004
    - >
      https://ergonis.com/en/popchar/ — official overview, audience, platform support,
      and 1987 user account
    - https://ergonis.com/en/popchar/version-history/mac/ — official macOS release history
    - >
      https://help.popchar.ergonis.com/hc/en-us/articles/23108918963100-How-to-start-with-PopChar
      — official setup and usage guide
  summary:
    - >
      PopChar is a commercial character-map utility for macOS and Windows. It lets users
      browse, inspect, search, and insert characters, symbols, emoji, ligatures, and
      glyphs from installed fonts across applications.
  timeline:
    - '1987: PopChar first appeared on Macintosh'
    - '2004: PopChar for Windows debuted'
    - '2022: The macOS edition added native Apple Silicon support'
    - '2024: PopChar 10 introduced a redesigned interface and Unicode 15 support'
  usage:
    - >
      PopChar runs system-wide and opens through a hotkey or its on-screen/menu-bar
      control. Users select a font, search or browse its character repertoire, inspect
      Unicode and HTML information, and click a character to insert it into the active
      application.
    - >
      It can display the union of characters available across installed fonts, identify
      fonts containing a chosen symbol, maintain favorites and recent characters, and
      insert either plain or formatted output.
