id: brew:foreman
display-name: Foreman
repo: null
docs:
  - https://ddollar.github.io/foreman
config-file-location:
  unix:
    - ./Procfile
    - ./.env
credentials-file-location: null
history:
  adoption-history:
    - >
      Foreman's README points users to installation as a Ruby gem and warns Ruby users
      not to bundle Foreman inside an application's Gemfile, reflecting its role as a
      developer tool around an application rather than a library dependency.
    - >
      The README's ports list shows the Procfile-runner idea spreading into other
      languages and ecosystems, including forego, node-foreman, goreman, honcho,
      shoreman, and other reimplementations.
  package-nerd-significance:
    - >
      Foreman is historically important because it helped normalize Procfile as a
      portable, package-manager-distributed convention rather than only a Heroku
      deployment file.
    - >
      It is also a small example of a package whose interface became a pattern: many
      later packages are not forks of Foreman, but compatibility ports of the same
      Procfile workflow.
  project-history:
    - >
      David Dollar introduced Foreman in May 2011 as a way to start multi-process web
      applications from a Procfile, covering web, worker, and clock processes with
      shared environment handling and automatic port assignment.
    - >
      The project grew beyond local development by adding export targets for process
      supervisors. Its manual documents running an app directly, running one-off
      commands, and exporting process definitions to formats such as init, upstart,
      systemd, runit, and supervisord.
  related-projects:
    - >
      Forego, goreman, node-foreman, honcho, shoreman, proclet, and other ports listed
      by the upstream README reuse Foreman's Procfile-runner model in other languages or
      shell environments.
    - >
      Foreman is related to platform Procfile conventions used by Heroku-style
      applications and to Unix service managers such as systemd, upstart, runit, and
      supervisord through its export functionality.
  sources:
    - https://blog.daviddollar.org/2011/05/06/introducing-foreman.html
    - https://ddollar.github.io/foreman/
    - https://github.com/ddollar/foreman
    - https://raw.githubusercontent.com/ddollar/foreman/main/Changelog.md
    - https://raw.githubusercontent.com/ddollar/foreman/master/README.md
  summary:
    - >
      Foreman is a Ruby command-line process manager for Procfile-based applications. It
      is best known for making the Heroku-style Procfile a local-development and
      deployment artifact outside Heroku itself.
  timeline:
    - >
      2011: David Dollar publishes the Introducing Foreman post and documents
      Procfile-based local process startup.
    - >
      2011: The changelog records 0.26.x and 0.27.0 releases with .env loading and
      Travis CI configuration.
    - >
      2012: Early releases add and refine concurrency, root directory handling, and
      one-off command execution.
    - '2016: The changelog records systemd exporter work and related service-management fixes.'
    - '2024: Foreman 0.88.0 refreshes CI and updates documentation for systemd export.'
    - '2025: Foreman 0.90.0 is released with Ruby dependency updates.'
  usage:
    - >
      Foreman reads a Procfile, loads environment from .env by default or from files
      passed with --env, starts each declared process, prefixes output, and can scale
      process counts with formation options.
    - >
      Package users typically install the foreman executable and keep Procfile and .env
      files in the application root, making it a bridge between twelve-factor app
      conventions, local shells, and service managers.
related-packages:
  - id: brew:forego
    reason: >
      Choose forego when you want Foreman's core Procfile-running workflow as a small
      compiled Go executable without a Ruby runtime.
    rel: alternative
    sources:
      - https://github.com/ddollar/foreman#ports
      - https://github.com/ddollar/forego#readme
  - id: brew:goreman
    reason: >
      Choose goreman for another Go-based Foreman implementation with documented
      Procfile and environment-file options.
    rel: alternative
    sources:
      - https://github.com/ddollar/foreman#ports
      - https://github.com/mattn/goreman#readme
  - id: brew:honcho
    reason: >
      Choose Honcho for a Python implementation of the Foreman and Procfile model,
      particularly when Python packaging already fits the development environment.
    rel: alternative
    sources:
      - https://github.com/ddollar/foreman#ports
      - https://honcho.readthedocs.io/en/stable/
