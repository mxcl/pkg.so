history:
  adoption-history:
    - >
      The project is distributed as a macOS application and documents Homebrew
      installation, giving command-line-oriented Mac users a package-managed alternative
      to downloading an unsigned release manually.
  package-nerd-significance:
    - >
      dmenu-mac brings the keyboard-driven launcher style associated with Unix dmenu
      workflows to macOS while avoiding Spotlight indexing. Its standard-input pipe
      support also lets scripts use a native graphical chooser.
  project-history:
    - >
      dmenu-mac was created as a macOS application launcher inspired by dmenu. The
      project focuses on fuzzy application search, a configurable global shortcut,
      multiple displays, and operation independent of Spotlight indexing.
  related-projects:
    - >
      Inspired by dmenu's keyboard-oriented menu model, but implemented as a native
      macOS application launcher.
  sources:
    - 'Input package metadata: source_facts.description and source_facts.package-manager'
    - 'Official project README: https://github.com/oNaiPs/dmenu-mac#readme'
  summary:
    - >
      dmenu-mac is a native macOS, keyboard-only application launcher inspired by dmenu,
      with fuzzy search and a scripting-oriented pipe interface.
  timeline:
    - The official sources reviewed do not document a reliable first-release date.
  usage:
    - >
      Open the application and press Command-Space to bring it forward, type an
      application name, and press Enter. The shortcut can be changed in the interface.
      Scripts can pipe newline-separated choices to the dmenu-mac executable and supply
      a prompt.
