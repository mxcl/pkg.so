id: brew:cilium-cli
display-name: Cilium CLI
repo: null
docs:
  - https://docs.cilium.io/en/stable/gettingstarted/k8s-install-default
  - https://github.com/cilium/cilium-cli#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Cilium's official quick-install documentation instructs users to install the
      Cilium CLI before installing Cilium into a Kubernetes cluster. That placement
      makes the CLI a front door for new Cilium deployments rather than only an optional
      helper.
    - >
      The input records packages across Homebrew, Alpine, Nix, Arch, winget, and zypper.
      Homebrew's formula API currently reports more than one thousand 30-day
      install-on-request events, which is strong package-manager adoption for a
      specialized Kubernetes networking CLI.
  package-nerd-significance:
    - >
      For package maintainers, cilium-cli is a modern cloud-native operations binary
      with frequent releases, official multi-OS binary artifacts, and compatibility
      tracking against Cilium versions. It is also a good example of package managers
      distributing the operational CLI separately from the Kubernetes workloads it
      manages.
  project-history:
    - >
      The cilium/cilium-cli repository was created in December 2020. Its early public
      releases began with v0.1 in February 2021, aligning with the project's move toward
      a dedicated CLI for cluster installation, status checks, Hubble enablement,
      connectivity testing, ClusterMesh, and related operations.
    - >
      The CLI is maintained as a separate Go repository from the main Cilium datapath
      and control-plane repository, but its README and Cilium documentation present it
      as the standard quick-install path for Cilium users.
  related-projects:
    - >
      Cilium is the Kubernetes networking, security, and observability system managed by
      the CLI.
    - >
      Hubble is the observability component enabled and tested through cilium hubble and
      cilium connectivity commands.
    - >
      ClusterMesh is a Cilium multi-cluster feature with CLI setup flows documented in
      the README.
  sources:
    - https://github.com/cilium/cilium-cli#readme
    - https://docs.cilium.io/en/stable/gettingstarted/k8s-install-default/
    - https://api.github.com/repos/cilium/cilium-cli
    - https://api.github.com/repos/cilium/cilium-cli/releases
    - https://formulae.brew.sh/api/formula/cilium-cli.json
  summary:
    - >
      Cilium CLI is the official command-line installer, manager, and troubleshooting
      tool for Kubernetes clusters running Cilium, the eBPF-based networking, security,
      and observability platform.
  timeline:
    - '2020-12-22: cilium/cilium-cli repository created.'
    - '2021-02-15: v0.1 release published.'
    - >
      2021: README documents installation, status, Hubble, connectivity tests,
      performance tests, and ClusterMesh capabilities.
    - '2026-06-25: v0.19.5 release published.'
    - >
      2026: Homebrew packages cilium-cli 0.19.5 and the input records broad
      Linux/macOS/Windows package-manager coverage.
  usage:
    - >
      Common documented commands include cilium install, cilium status, cilium hubble
      enable, cilium connectivity test, cilium connectivity perf, and ClusterMesh setup.
      The README also lists supported environments such as minikube, kind, EKS, GKE, AKS
      BYOCNI, k3s, and self-managed clusters.
related-packages:
  - id: brew:hubble
    reason: >
      Hubble is Cilium's companion observability CLI; Cilium CLI enables and exposes
      Hubble while connectivity tests can validate traffic using Hubble flow data.
    rel: adjacent_workflow
    sources:
      - https://github.com/cilium/cilium-cli#hubble
      - https://docs.cilium.io/en/stable/observability/hubble/
  - id: brew:helm
    reason: >
      Cilium CLI installs Cilium as a Helm release, and its README documents using Helm
      to inspect that release and the non-default values chosen by the CLI.
    rel: adjacent_workflow
    sources:
      - https://github.com/cilium/cilium-cli#examples
      - https://helm.sh/docs/intro/using_helm/
  - id: brew:kubernetes-cli
    reason: >
      kubectl complements Cilium CLI for inspecting the Kubernetes resources it manages
      and for documented operations such as port-forwarding Hubble Relay.
    rel: adjacent_workflow
    sources:
      - https://github.com/cilium/cilium-cli#connectivity-check
      - https://kubernetes.io/docs/reference/kubectl/
