id: brew:gitsign
display-name: gitsign
repo: null
docs:
  - https://docs.sigstore.dev/
  - https://github.com/sigstore/gitsign#readme
config-file-location:
  unix:
    - .git/config
    - ~/.gitconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      gitsign belongs to the broader Sigstore supply-chain security ecosystem alongside
      Fulcio, Rekor, and Cosign. Its adoption story is tied to the move from personal
      key management toward short-lived certificates, identity-backed signatures, and
      transparency-log verification.
  package-nerd-significance:
    - >
      For package maintainers, gitsign is important because it brings Sigstore's keyless
      model to Git history rather than only to container images or release artifacts. It
      packages a security workflow as a Git signing backend with a small CLI surface and
      a credential-cache helper.
  project-history:
    - >
      The gitsign repository was created in May 2022 under the Sigstore organization.
      Its README says the tool was heavily inspired by GitHub's smimesign, but
      substitutes keyless Sigstore signing with a GitHub or other OIDC identity.
  related-projects:
    - >
      gitsign is related to Sigstore, Fulcio, Rekor, Cosign, Git's X.509 signing
      support, and GitHub's smimesign.
  sources:
    - https://api.github.com/repos/sigstore/gitsign
    - https://api.github.com/repos/sigstore/gitsign/releases
    - https://docs.sigstore.dev/
    - https://docs.sigstore.dev/cosign/signing/git_support/
    - https://formulae.brew.sh/formula/gitsign
    - https://github.com/sigstore/gitsign
    - https://raw.githubusercontent.com/sigstore/gitsign/main/README.md
  summary:
    - >
      gitsign is a Sigstore tool for keyless signing of Git commits and tags. It uses
      OpenID Connect identities and Sigstore infrastructure instead of long-lived local
      signing keys.
  timeline:
    - '2022: Repository created under the Sigstore organization.'
    - '2022: Test release published from the new repository.'
    - >
      2020s: Distributed through Homebrew, Debian, MacPorts, Nix, Arch, Scoop, and
      zypper package channels.
  usage:
    - >
      Practitioners configure Git to use `gitsign` as the `gpg.x509.program`, set
      `gpg.format` to `x509`, and then sign commits with `git commit -S` or sign tags
      with `git tag -s`. Verification commonly uses `gitsign verify` so callers can
      check both cryptographic integrity and certificate identity claims.
related-packages:
  - id: brew:smimesign
    reason: >
      Choose smimesign when Git signatures must use conventional S/MIME certificates
      from platform certificate stores or smart cards; choose gitsign for short-lived
      Sigstore certificates tied to an OIDC identity and recorded in a transparency log.
    rel: alternative
    sources:
      - https://github.com/sigstore/gitsign
      - https://github.com/github/smimesign
  - id: brew:gittuf
    reason: >
      gittuf can enforce repository policies that rely on authenticated Git signatures,
      and its official signing-key guide documents gitsign as the Sigstore configuration
      for signing commits and tags.
    rel: adjacent_workflow
    sources:
      - https://gittuf.dev/documentation/contributors/signing-keys
      - https://github.com/sigstore/gitsign
