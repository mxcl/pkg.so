history:
  adoption-history:
    - >
      Brook's adoption is strongest in the privacy, proxy, and programmable-networking
      niche. GitHub shows a large open-source audience with thousands of stars and
      forks, while the input package facts show distribution through Homebrew, MacPorts,
      Nix, Arch, and other Unix-like package channels.
  package-nerd-significance:
    - >
      Brook is notable in package-manager history as one of several post-Shadowsocks-era
      Go networking tools that package cleanly into a single binary while covering a
      wide surface area: proxying, VPN-like routing, mobile clients, DNS policy, and
      traffic inspection. Its date-based release tags also make it recognizable in
      rolling-release packaging.
  project-history:
    - >
      The official GitHub repository describes Brook as a cross-platform programmable
      network tool and documents a basic server/client workflow around commands such as
      `brook server` and `brook link`. Its tag history includes date-stamped releases
      starting in 2017, showing a long-running release model rather than a one-off proxy
      experiment.
    - >
      The current official product page emphasizes system-level networking,
      TCP/UDP/IPv4/IPv6 coverage, client-side and server-side programmability, DNS and
      routing control, packet capture, MITM HTTP/HTTPS capabilities, and cross-platform
      clients for iOS, macOS, Android, Windows, and Linux.
  related-projects:
    - >
      Related networking packages include Shadowsocks, V2Ray/Xray, sing-box, gost,
      WireGuard, OpenVPN, and OpenWrt proxy tooling. Brook differs by combining proxy
      transport, programmable policy, and cross-platform commercial-style clients around
      the same project.
  sources:
    - https://github.com/txthinking/brook#readme
    - https://www.txthinking.com/brook.html
    - source_facts.package-manager
  summary:
    - >
      Brook is TxThinking's cross-platform programmable network tool, packaged as a
      Go-based proxy/VPN-style command-line program with clients for desktop, mobile,
      Linux, and OpenWrt. Its public positioning has shifted from a simple encrypted
      proxy toward a broader programmable network layer.
  timeline:
    - '2017-03-16: Earliest public release tag observed in the official Git repository.'
    - '2017-2020s: Brook evolves through frequent date-stamped releases.'
    - '2025-12-31: GitHub lists v20260101 as the latest release at the time researched.'
  usage:
    - >
      Common use starts with a Brook server listening on a port and a client or
      generated link carrying connection parameters. Later Brook workflows extend into
      system-wide routing, DNS policy, destination rewriting, application-level
      controls, and OpenWrt or mobile clients.
related-packages:
  - id: brew:sing-box
    reason: >
      Choose sing-box when you need a declarative JSON configuration with a broad
      catalog of inbound, outbound, DNS, and routing components instead of Brook's
      command- and link-oriented workflow.
    rel: alternative
    sources:
      - https://sing-box.sagernet.org/
      - https://sing-box.sagernet.org/configuration/
      - https://github.com/txthinking/brook#readme
