  - https://www.belightsoft.com/products/getbackup/GBHelp
  - https://www.belightsoft.com/products/getbackup/version-changes
  - https://www.belightsoft.com/resources/Get%20Backup%203%20User%20Manual.pdf
config-file-location:
  macos:
    - ~/Library/Preferences/com.belightsoft.GetBackupPro3.plist
    - ~/Library/Application Support/Get Backup 3
credentials-file-location: null
history:
  adoption-history:
    - >
      Distributed as a native macOS application and through Homebrew Cask. Its appeal is
      broad coverage of backup, archive, synchronization, and disk-cloning workflows in
      one graphical utility.
  package-nerd-significance:
    - >
      Get Backup Pro is notable for wrapping standard Unix technologies and
      rsync-oriented workflows in a Mac interface while producing archives that can be
      restored without the application. It also reflects the long-running Mac utility
      tradition of scheduled, bootable, and incremental local backups.
  project-history:
    - >
      BeLight Software developed Get Backup as a macOS backup utility. Version 2.3
      introduced separate freeware and Pro editions; version 3 added a non-archive
      incremental backup method based on hard links, a redesigned interface, and
      expanded scheduling.
  related-projects:
    - rsync
    - macOS Time Machine
    - Carbon Copy Cloner
    - SuperDuper!
  sources:
    - 'Official features: https://www.belightsoft.com/products/getbackup/features'
    - >
      Official manual:
      https://www.belightsoft.com/resources/Get%20Backup%203%20User%20Manual.pdf
    - 'Official version history: https://www.belightsoft.com/products/getbackup/version-changes'
  summary:
    - >
      Get Backup Pro is BeLight Software's macOS utility for incremental backups,
      compressed archives, folder synchronization, and disk cloning.
  timeline:
    - 'Version 2.3: Freeware and Pro editions introduced'
    - >
      Version 3: Hard-link-based incremental folder backups and a redesigned interface
      introduced
    - 'Version 3.4: APFS support and encrypted disk-image backups added'
    - 'Version 3.7.3: Compatibility and maintenance update'
  usage:
    - >
      Users create separate projects for folder backups, archives, disk clones, or
      one-way and two-way synchronization, then run them manually, on schedules, or when
      external storage is mounted. Project settings reside under the documented
      application-support directory.
    - >
      The application can optionally save an administrator password in macOS Keychain
      for unattended scheduled operations; this is a keychain entry rather than a
      documented credentials file.
