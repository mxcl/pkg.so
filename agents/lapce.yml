history:
  adoption-history:
    - >
      Lapce has attracted users looking for an open-source, native alternative to
      Electron-based editors. Its cross-platform releases, familiar editor features, and
      package-manager availability make it approachable without requiring a Rust
      toolchain.
  package-nerd-significance:
    - >
      Lapce is notable as a substantial Rust desktop application distributed as a
      conventional native package. Its combination of wgpu rendering, built-in LSP
      support, WASI plugins, remote development, and Vim-style editing makes it
      interesting to users comparing modern editor architectures.
  project-history:
    - >
      Lapce is an Apache-2.0-licensed code editor written in Rust. Its architecture
      draws on Rope Science from Xi Editor, uses Floem for its interface, and uses wgpu
      for rendering.
    - >
      Early public builds established the project's focus on startup and editing
      responsiveness. Later development added cross-platform packaging, remote
      development, language-server integration, a terminal, and a WASI-based plugin
      system.
  related-projects:
    - Xi Editor influenced Lapce's text-buffer design through Rope Science.
    - Floem is the Rust UI toolkit used by Lapce.
    - Lapdev is a related remote-development environment from the Lapce team.
  sources:
    - https://docs.lapce.dev/
    - https://github.com/lapce/lapce
    - https://lap.dev/lapce/
  summary:
    - >
      Lapce is a cross-platform, open-source code editor written in Rust and designed
      around native UI, GPU rendering, and low-latency editing.
  timeline:
    - "2021: The v0.0.1-era builds marked Lapce's early public release period."
    - >
      Later releases expanded the editor with remote development, integrated terminals,
      language-server support, and WASI plugins.
  usage:
    - >
      Users open a project directory as a workspace and use Lapce for source editing,
      language-server features, terminal work, remote development, and optional modal
      editing.
    - >
      Settings are normally managed through the graphical settings interface or the Open
      Settings File command. The official documentation discusses settings.toml but does
      not document a stable platform-specific filesystem path, so no location is
      asserted here.
