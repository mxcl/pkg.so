history:
  adoption-history:
    - >
      The project remains a niche but durable open source game package. The supplied
      package-manager metadata lists it across Alpine, Homebrew, Debian, Fedora, Nix,
      Ubuntu, winget, and openSUSE, showing the kind of cross-distro preservation
      footprint package maintainers care about.
  package-nerd-significance:
    - >
      C-Dogs SDL is a tidy example of game preservation in package-manager form: a DOS
      freeware title became a source-available SDL game, gained portable builds, and now
      ships as a small native package rather than an emulator-only artifact.
  project-history:
    - >
      The bundled original C-Dogs readme identifies C-Dogs v1.06 as a freeware DOS game
      copyrighted 1997-2001 by Ronny Wester. The C-Dogs SDL README says Wester released
      the source code in 2002, after which Jeremy Chin and Lucas Martin-King ported it
      to SDL for modern PCs.
    - >
      The current project is maintained by Cong Xu and contributors, who have kept the
      game compatible with Windows, Linux, and macOS while adding campaigns, maps,
      multiplayer improvements, and a level editor.
  related-projects:
    - Cyberdogs preceded C-Dogs in Ronny Wester's DOS game lineage.
    - SDL2 is the portability layer used by the modern port.
  sources:
    - https://api.github.com/repos/cxong/cdogs-sdl
    - https://github.com/cxong/cdogs-sdl
    - https://cxong.github.io/cdogs-sdl/
    - https://cxong.github.io/cdogs-sdl
    - https://github.com/cxong/cdogs-sdl#readme
    - https://formulae.brew.sh/api/formula/cdogs-sdl.json
    - https://api.github.com/repos/cxong/cdogs-sdl/releases
    - https://raw.githubusercontent.com/cxong/cdogs-sdl/master/doc/original_readme.txt
  summary:
    - >
      C-Dogs SDL is the modern open source SDL port of C-Dogs, a freeware DOS overhead
      run-and-gun game by Ronny Wester. The upstream README frames the project as both a
      preservation port and an actively maintained game with co-op, deathmatch, modding,
      and user-created campaigns.
  timeline:
    - '1997-2001: Original C-Dogs freeware DOS game developed by Ronny Wester.'
    - >
      2002: Original source released and picked up for SDL porting, according to the
      upstream README.
    - '2013: GitHub releases show C-Dogs SDL 0.4.5 published on 2013-07-25.'
    - '2026: Official site shows ongoing release/news activity, including 2.4.0-era content.'
  usage:
    - >
      Users launch the game with cdogs-sdl and can use cdogs-sdl-editor for campaign and
      map editing. Upstream documentation points players to GitHub releases, itch.io
      downloads, custom campaigns, and a getting-started wiki for building with SDL2.
