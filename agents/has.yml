id: brew:has
display-name: has
repo: null
docs:
  - https://github.com/kdabir/has#readme
config-file-location:
  unix:
    - ./.hasrc
credentials-file-location: null
history:
  adoption-history:
    - >
      has spread through several conventions favored by shell users: direct `curl`
      execution, a copied script on `PATH`, Git installation, Homebrew, asdf, and mise.
      Supplied metadata also records Homebrew and Nix packages.
  package-nerd-significance:
    - >
      has is a strong example of the single-file shell package: no runtime beyond Bash,
      directly inspectable source, multiple install methods, and behavior useful both
      interactively and in automation. A committed `.hasrc` also acts as a lightweight
      executable declaration of a repository's external toolchain.
  project-history:
    - >
      The official GitHub repository was created in February 2014. The project stayed
      centered on one portable Bash script while accumulating tool-specific version
      detection, readable success and failure output, meaningful exit status, and
      project-local `.hasrc` files.
    - >
      A tagged GitHub release series is visible from v1.2.0 in 2018 through v1.5.2 in
      August 2025. The README continues to present direct download and execution as
      first-class options alongside package managers.
  related-projects:
    - asdf-has packages has as an asdf plugin.
    - mise can install has through its version-manager workflow.
  sources:
    - https://api.github.com/repos/kdabir/has
    - https://github.com/kdabir/has#readme
    - https://github.com/kdabir/has/releases
    - source_facts.package-manager
  summary:
    - >
      has is Kiran Dabir's dependency-free Bash utility for checking whether named
      command-line tools are on `PATH` and reporting their installed versions.
  timeline:
    - '2014: The official GitHub repository is created.'
    - '2018: v1.2.0 begins the visible GitHub release series.'
    - '2025: v1.5.2 is released in August.'
  usage:
    - >
      Users run commands such as `has node npm java git`; the output lists detected
      versions, and the exit status counts missing commands. A project can commit one
      tool name per line in `.hasrc`, letting `has` serve as an immediately readable
      environment preflight for developers and scripts.
related-packages: []
