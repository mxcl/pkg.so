history:
  adoption-history:
    - >
      SoundAnchor is distributed both as a direct-download Mac application and through
      the Mac App Store. The direct edition offers a trial and license-key purchase.
    - >
      The project has also introduced a Windows beta with independent input and output
      priorities, while multi-device output remains a Mac-specific capability.
  package-nerd-significance:
    - >
      SoundAnchor is a focused response to a recurring desktop-audio annoyance:
      operating systems choosing a newly connected headset microphone or output instead
      of the user’s preferred device.
    - >
      It is particularly useful in developer, remote-work, streaming, and desk-docking
      setups where USB microphones, Bluetooth headsets, monitors, and speakers
      repeatedly appear and disappear.
  project-history:
    - >
      SoundAnchor was developed as a menu-bar audio-device utility centered on ordered
      input and output priorities. It later added quick multi-output creation on macOS
      and expanded to a Windows beta.
    - >
      Its official guides broaden the project from a simple device selector into a
      practical reference for Bluetooth call quality, professional microphones,
      multi-output devices, and moving between home and office audio setups.
  related-projects:
    - >
      Apple Audio MIDI Setup provides the built-in macOS method for creating
      multi-output devices.
    - >
      macOS System Settings provides manual input and output selection but not
      SoundAnchor’s ordered automatic fallback lists.
  sources:
    - https://apps.kopiro.me/soundanchor/
    - https://apps.kopiro.me/soundanchor/automatically-switch-mac-audio-home-work.html
    - >
      https://apps.kopiro.me/soundanchor/bluetooth-earphones-lose-quality-during-calls-mac.html
    - https://apps.kopiro.me/soundanchor/create-multi-output-device-mac.html
    - https://apps.kopiro.me/soundanchor/professional-microphone-keeps-switching-mac.html
  summary:
    - >
      SoundAnchor is a menu-bar audio-device utility that keeps preferred microphones
      and speakers selected as devices connect and disconnect. On macOS it can also
      create combined multi-output devices.
  timeline:
    - >
      Current generation: Distributed for macOS by direct download and through the Mac
      App Store, with a Windows beta also available.
  usage:
    - >
      Arrange microphones and outputs in priority order, then enable automatic switching
      so the highest-priority available device becomes the system default.
    - >
      Keep a Mac or USB microphone selected while listening through Bluetooth headphones
      to avoid unwanted headset call mode, or combine two outputs for shared listening.
