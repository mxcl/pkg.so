history:
  adoption-history:
    - >
      Jumpcut has remained available for more than fifteen years and is distributed
      through Homebrew Cask as well as the project's releases. Its longevity reflects
      continuing demand for a small, keyboard-driven clipboard utility.
  package-nerd-significance:
    - >
      Jumpcut is a characteristic package-manager utility: narrowly focused, native,
      open source, and easy to install without a larger productivity suite. Its
      migration from Objective-C to Swift also illustrates the modernization required to
      keep older macOS utilities viable.
  project-history:
    - >
      Jumpcut began as an Objective-C macOS clipboard manager and was originally hosted
      through SourceForge. The official project later moved to GitHub; releases
      beginning with the 0.80 series use Swift.
  related-projects:
    - >
      Maccy and Clipy are open-source macOS clipboard managers identified as
      alternatives by the official Jumpcut site.
    - Homebrew Cask provides a packaged installation route documented by the project.
  sources:
    - https://github.com/snark/jumpcut
    - https://snark.github.io/jumpcut/
  summary:
    - >
      Jumpcut is a free, open-source macOS clipboard manager that keeps a stack of
      recently copied text accessible from the menu bar or a global shortcut.
  timeline:
    - >
      Early project: Jumpcut was developed as an Objective-C clipboard utility and
      distributed through SourceForge.
    - 'Swift transition: Releases beginning with the 0.80 series were rewritten in Swift.'
    - >
      2023: The official site documented continued distribution through GitHub and
      Homebrew Cask.
  usage:
    - >
      Jumpcut records copied or cut text in a clipping stack. Users select older entries
      from its menu or keyboard-controlled bezel; the application then restores the
      selection to the pasteboard and can simulate Command-V when macOS Accessibility
      permission is granted.
