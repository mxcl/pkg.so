id: brew:lxc
display-name: LXC
repo: null
docs:
  - https://documentation.ubuntu.com/lxd
config-file-location:
  unix:
    - $LXD_CONF/config.yml
    - ~/.config/lxc/config.yml
credentials-file-location:
  unix:
    - $LXD_CONF/client.crt
    - $LXD_CONF/client.key
    - $LXD_CONF/oidctokens/<remote>.json
    - $LXD_CONF/jars/<remote>
    - ~/.config/lxc/client.crt
    - ~/.config/lxc/client.key
    - ~/.config/lxc/oidctokens/<remote>.json
    - ~/.config/lxc/jars/<remote>
history:
  adoption-history:
    - >
      LXD adoption grew from Linux container users who wanted machine-like system
      containers with images, profiles, networking, storage pools, remotes, and
      clustering. The official README documents installation of the daemon on Linux and
      the `lxc` client on Linux, Windows, and macOS, including Homebrew for macOS.
    - >
      By July 2026, the official GitHub repository had roughly 4,800 stars and 1,000
      forks, and Canonical maintained both feature releases and long-term-support
      release branches such as 4.0, 5.0, and 5.21.
  package-nerd-significance:
    - >
      This package is significant because its name is historically confusing: package
      users may expect LXC, but the formula installs the LXD client named `lxc`. For
      package managers, it is a cross-platform client for a Linux-only daemon and has
      important configuration and credential files outside the package prefix.
  project-history:
    - >
      The LXD repository was created in November 2014, and the official documentation
      carries LXD contributor copyright years from 2014 through 2026. Canonical's
      documentation describes LXD as a modern, secure system container and virtual
      machine manager with a REST API and support for workloads from a single
      development machine to clustered production infrastructure.
    - >
      The official `lxd and lxc` explanation distinguishes LXD from LXC: LXC is the
      low-level userspace interface for Linux kernel containment features, while LXD is
      a more user-friendly system built on top of LXC with network-controllable
      management features.
  related-projects:
    - LXC provides the lower-level Linux container interface used underneath LXD.
    - dqlite is used by LXD for clustered state.
    - pylxd and the Go client package are official SDKs documented by the LXD README.
    - >
      MicroCloud, Terraform provider for LXD, Packer LXD builder, and Ansible
      integrations are listed as management tools.
  sources:
    - https://api.github.com/repos/canonical/lxd
    - https://api.github.com/repos/canonical/lxd/releases?per_page=5
    - https://canonical.com/lxd/docs/latest/explanation/lxd_lxc/
    - https://canonical.com/lxd/docs/latest/reference/manpages/lxc/
    - https://documentation.ubuntu.com/lxd/latest/
    - https://github.com/canonical/lxd#readme
    - https://raw.githubusercontent.com/canonical/lxd/main/lxc/config/config.go
    - https://raw.githubusercontent.com/canonical/lxd/main/lxc/config/file.go
    - https://raw.githubusercontent.com/canonical/lxd/main/lxc/config/remote.go
    - https://raw.githubusercontent.com/canonical/lxd/main/lxc/main.go
  summary:
    - >
      The Homebrew `lxc` formula packages the LXD command-line client named `lxc`, not
      the older low-level LXC tool suite. LXD is Canonical's system container and
      virtual-machine manager, and `lxc` is its default CLI for managing instances,
      remotes, images, networks, projects, storage, and server settings.
  timeline:
    - '2014: Public `canonical/lxd` repository created.'
    - '2021: LXD 4.0 LTS line still maintained through later point releases.'
    - '2024: LXD 5.21 LTS line active.'
    - '2026: LXD 6.9 feature release and LTS point releases published.'
  usage:
    - >
      The `lxc` command is the everyday LXD client. Official man pages list subcommands
      for launching, listing, stopping, copying, moving, snapshotting, exporting,
      importing, and configuring instances, plus image, profile, project, network,
      storage, cluster, and remote management.
    - >
      The client stores remotes and aliases in `config.yml` under `$LXD_CONF` or
      `~/.config/lxc`. For remote authentication it can use TLS client certificate and
      key files, optional client CA material, OIDC token JSON files, and per-remote
      cookie jars.
related-packages:
  - id: brew:incus
    reason: >
      Choose Incus when you want a community-governed LXD-derived container and VM
      manager with a familiar remote-management model; its official site describes it as
      an alternative to Canonical LXD.
    rel: alternative
    sources:
      - https://linuxcontainers.org/incus/
      - https://linuxcontainers.org/incus/docs/main/
