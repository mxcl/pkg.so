history:
  adoption-history:
    - >
      wBlock expanded from a macOS Safari blocker into a cross-device application for
      macOS, iOS, iPadOS, and visionOS. The project recommends App Store installation
      while also documenting a signed Homebrew cask for macOS.
    - >
      Its adoption is tied to Safari's native content-blocking model. wBlock packages
      filter-list management, automatic updates, per-site controls, userscripts, user
      styles, and synchronization into an interface designed around Apple's extension
      limits.
  package-nerd-significance:
    - >
      wBlock is notable to package users as an open-source, package-manageable Safari
      blocker in a field dominated by browser-specific extensions and closed App Store
      applications.
    - >
      Its implementation illustrates the platform-specific work hidden behind a desktop
      cask: signed application distribution, several Safari content-blocker extensions,
      rule conversion, background updating, and optional iCloud synchronization.
  project-history:
    - >
      Alexander Skula developed wBlock as a free and open-source Safari content blocker.
      The project converts compatible filter lists into Safari-native rules and
      distributes them among multiple content-blocker extensions.
    - >
      The 2025 development cycle added support for Apple's mobile platforms, increased
      blocking capacity, introduced an element zapper, and expanded userscript support.
      Version 1.0 added automatic filter updates and broader Greasemonkey-compatible
      APIs.
    - >
      Version 2.0 in February 2026 added iCloud synchronization, richer custom-list
      import, broader element-zapper support, and a native Homebrew cask release
      pipeline. Subsequent development continued to expand the blocking and userscript
      architecture.
  related-projects:
    - >
      The project uses AdGuard-compatible filter syntax and credits AdGuard components
      for rule conversion and scriptlets.
    - >
      Its bundled optional workflows integrate data or functionality associated with
      projects such as SponsorBlock, DeArrow, and Dark Reader.
  sources:
    - https://github.com/0xCUB3/wBlock
    - https://github.com/0xCUB3/wBlock/discussions/137
    - https://github.com/0xCUB3/wBlock/discussions/221
    - https://github.com/0xCUB3/wBlock/discussions/78
    - https://github.com/0xCUB3/wBlock/releases
    - https://github.com/0xCUB3/wBlock/wiki
  summary:
    - >
      wBlock is a free, open-source Safari content blocker for Apple platforms. It
      combines native content-blocking rules with filter-list management, per-site
      controls, userscripts, user styles, an element zapper, and optional
      synchronization.
  timeline:
    - >
      2025: The 0.3 beta adds iOS support, multiple content-blocker extensions, an
      element zapper, and userscript management.
    - >
      2025: Version 1.0 adds automatic filter updates and expanded
      Greasemonkey-compatible userscript APIs.
    - >
      2026: Version 2.0 adds iCloud synchronization, enhanced custom-list management,
      and native Homebrew cask distribution.
    - '2026: The project continues through the 3.x release line.'
  usage:
    - >
      Users install wBlock, enable its extensions in Safari, choose filter lists, and
      apply the resulting rules. Custom lists can be supplied by URL, pasted rules, or
      file import.
    - >
      The Safari toolbar supplies per-site switches for filtering and userscripts. On
      macOS, scheduled filter updates can run through a background helper while the
      application is closed.
    - >
      The project advises using one general-purpose content blocker at a time because
      concurrent blockers can conflict or make troubleshooting difficult.
