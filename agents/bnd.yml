id: brew:bnd
display-name: bnd
repo: https://github.com/bndtools/bnd
docs:
  - https://bnd.bndtools.org/
config-file-location:
  unix:
    - cnf/build.bnd
    - cnf/ext/*.bnd
    - bnd.bnd
    - '*.bnd'
credentials-file-location:
  unix:
    - ~/.bnd/settings.json
    - ~/.bnd/connection-settings.xml
    - ~/.m2/settings.xml
history:
  adoption-history:
    - >
      bnd became important because OSGi metadata is precise and tedious. Maven and
      Gradle users adopted bnd-derived plugins to turn ordinary Java artifacts into OSGi
      bundles without hand-writing every manifest header.
    - >
      It also became the foundation for Bndtools, the Eclipse-based OSGi development
      environment, giving the same underlying model a GUI, workspace conventions, and
      repository tooling.
  package-nerd-significance:
    - >
      bnd is package-nerd-significant because it turns Java packaging metadata into a
      first-class build artifact. OSGi bundles are still JARs, but their manifests
      encode module boundaries, version ranges, capabilities, and wiring expectations.
    - >
      For maintainers, bnd is the difference between a JAR that happens to load and a
      bundle that declares what it exports, imports, requires, and promises. That makes
      it a key tool in the long-running Java modularity story beside Maven, Gradle,
      Felix, Equinox, and later JPMS.
  project-history:
    - >
      bnd grew out of the OSGi tooling world around Peter Kriens and aQute. The Bndtools
      about page describes how Richard Hall, the Apache Felix developer, and Peter
      Kriens worked together on a Maven plugin with bnd for Apache Felix.
    - >
      The project expanded from manifest generation into a broader toolchain:
      Bnd/Bndtools now advertises tooling for OSGi bundles including Eclipse, Maven, and
      Gradle plugins.
  related-projects:
    - 'Bndtools: Eclipse-based OSGi development tools built on bnd.'
    - 'Apache Felix and Eclipse Equinox: OSGi framework implementations in the same ecosystem.'
    - >
      Maven Bundle Plugin and Gradle bnd plugins: build-system integrations that expose
      bnd functionality.
    - >
      OSGi specifications: the modular Java component model whose metadata bnd generates
      and validates.
  sources:
    - https://bnd.bndtools.org/
    - https://bnd.bndtools.org/commands/baseline.html
    - https://bnd.bndtools.org/instructions/sub.html
    - https://bndtools.org/about.html
    - https://github.com/bndtools/bnd
    - source_facts.description
  summary:
    - >
      bnd is OSGi bundle tooling for Java: a command-line tool and library used to
      generate manifests, wrap JARs, resolve bundles, and support OSGi builds through
      Eclipse, Maven, and Gradle integrations.
  timeline:
    - >
      2000s: bnd emerges in the OSGi ecosystem around Peter Kriens/aQute and Apache
      Felix-related tooling.
    - >
      2000s: bnd is used in a Maven plugin for Apache Felix, helping make OSGi manifest
      generation easier for Maven users.
    - '2010s: Bndtools builds an Eclipse OSGi development environment on top of bnd.'
    - >
      2020s: The GitHub project presents Bnd/Bndtools as OSGi bundle tooling with
      Eclipse, Maven, and Gradle plugins.
  usage:
    - >
      Developers use bnd files such as bnd.bnd and cnf/build.bnd to describe bundle
      metadata, exports, imports, baselining, repositories, and launch/run
      configurations. The CLI is also used to inspect, build, wrap, and resolve bundles.
    - >
      In build systems, bnd commonly appears indirectly through Maven Bundle Plugin,
      Gradle bnd plugins, or Bndtools projects rather than as a manually invoked
      command.
related-packages:
  - id: brew:maven
    reason: >
      Use bnd's official Maven plugins with Maven when OSGi manifests and bundle checks
      must be incorporated into an existing Maven build lifecycle.
    rel: adjacent_workflow
    sources:
      - https://github.com/bndtools/bnd
      - https://maven.apache.org/guides/
  - id: brew:gradle
    reason: >
      Use the official bnd Gradle plugins with Gradle to build bnd workspaces or add
      bnd-based OSGi metadata to conventional Gradle projects.
    rel: adjacent_workflow
    sources:
      - https://github.com/bndtools/bnd
      - https://docs.gradle.org/current/
tags:
