history:
  adoption-history:
    - >
      ucspi-tcp became part of the classic djb software ecosystem, especially alongside
      daemontools-style service supervision and qmail-era mail setups. The input package
      metadata shows that, despite its age and tarball distribution model, it remains
      packaged in Homebrew, Debian, Ubuntu, MacPorts, Nix, and other Unix package
      collections.
  package-nerd-significance:
    - >
      For package nerds, ucspi-tcp is historically significant because it is a compact
      Unix networking toolkit from the pre-systemd, pre-framework era. It represents a
      style where small binaries, environment variables, file-descriptor conventions,
      and package-manager preservation keep old but sharp infrastructure tools
      available.
  project-history:
    - >
      The UCSPI specification is dated 1996 and defines a command-line interface for
      client-server communication tools. ucspi-tcp applies that model to TCP, with
      clients and servers setting descriptors and environment variables before executing
      an application.
    - >
      The official install page identifies ucspi-tcp 0.88 as the latest published
      package, and the official tarball has a March 18, 2000 last-modified date. The
      project is distributed from Bernstein's cr.yp.to site rather than through a public
      source-control repository.
  related-projects:
    - >
      The official rblsmtpd page points to tcpserver and tcprules as companion programs
      within the suite.
    - The documentation also points to rbldns from djbdns for running RBL or anti-RBL sources.
  sources:
    - https://cr.yp.to/proto/ucspi.txt
    - https://cr.yp.to/ucspi-tcp.html
    - https://cr.yp.to/ucspi-tcp/install.html
    - https://cr.yp.to/ucspi-tcp/rblsmtpd.html
    - source_facts.package-manager
  summary:
    - >
      ucspi-tcp is Daniel J. Bernstein's Unix Client-Server Program Interface
      implementation for TCP. It provides small command-line tools such as tcpserver and
      tcpclient for building TCP services and clients around ordinary Unix programs.
  timeline:
    - '1996: UCSPI specification copyrighted by D. J. Bernstein.'
    - '2000: ucspi-tcp 0.88 tarball published according to official HTTP metadata.'
    - '2002: rblsmtpd documentation records then-current public RBL source status updates.'
    - >
      Current packaging: source_facts lists Homebrew, Debian, Ubuntu, MacPorts, Nix, and
      other package-manager entries.
  usage:
    - >
      Package users most often encounter tcpserver, tcpclient, tcprules, tcprulescheck,
      recordio, rblsmtpd, and helper tools. The official docs describe tcpserver as a
      way to accept TCP connections and run another program, while rblsmtpd is
      documented as an SMTP wrapper that blocks mail from listed sites when used under
      tcpserver.
