history:
  adoption-history:
    - >
      Bionic launched in initial preview as a separate LM Studio application. Official
      sources do not yet publish broad adoption figures.
  package-nerd-significance:
    - >
      Bionic packages local, remote, and hosted open-model workflows into a desktop
      agent, making it notable to users who want coding and document automation without
      committing entirely to a proprietary hosted-model stack.
  project-history:
    - >
      LM Studio introduced Bionic on July 16, 2026 as the next generation of its
      open-model tooling and a separate application from the original LM Studio app.
    - >
      The initial release combined an agentic workbench with local inference, LM Link
      remote inference, LM Studio Secure Cloud models, file and code tools, and local
      voice transcription.
  related-projects:
    - LM Studio
    - LM Link
    - LM Studio Secure Cloud
  sources:
    - 'Official Bionic documentation: https://lmstudio.ai/docs/bionic'
    - 'Official launch announcement: https://lmstudio.ai/blog/introducing-lm-studio-bionic'
    - >
      Official projects and sessions guide:
      https://lmstudio.ai/docs/bionic/projects-and-sessions
  summary:
    - >
      LM Studio Bionic is a desktop AI agent from the LM Studio team for coding,
      research, and work with documents using open models. It can run models locally,
      use models shared through LM Link, or access hosted open models through LM Studio
      Secure Cloud.
  timeline:
    - '2026-07-16: LM Studio introduced Bionic in initial preview.'
    - '2026-08-17: Official updates added support for reusable Agent Skills.'
  usage:
    - >
      Users create projects that group related sessions and files. Code projects can
      point at a local repository and use search, editing, Git, and shell tools; work
      projects use a managed workspace for research and document creation.
    - >
      A session can use a local model, a remote model exposed through LM Link, or a
      cloud model. Local execution emphasizes privacy, while cloud execution is offered
      with a stated Zero Data Retention policy.
