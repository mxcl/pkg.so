history:
  adoption-history:
    - >
      The official README supports installation directly with Go, and the supplied
      package metadata records a Homebrew formula. Its adoption footprint is that of a
      focused command-line utility rather than a platform or library.
  package-nerd-significance:
    - >
      dskDitto is notable to utility collectors for combining a modern TUI with a staged
      duplicate-detection pipeline: size grouping, sample hashing, and full hashing
      reduce unnecessary I/O, while Go installation and Homebrew packaging keep
      deployment simple.
  project-history:
    - >
      The official GitHub repository was created in June 2021. Its first GitHub release
      record is v0.5.6, published in May 2026, after the codebase had developed a
      parallel walk, staged hashing pipeline, TUI, optional GUI, and multiple scan
      modes.
  related-projects:
    - >
      The implementation uses Bubble Tea and Lip Gloss for its terminal UI, Raylib for
      its optional GUI, and BLAKE3 as an alternative content hash.
  sources:
    - >
      https://api.github.com/repos/jdefrancesco/dskDitto — official GitHub repository
      metadata and creation date.
    - >
      https://api.github.com/repos/jdefrancesco/dskDitto/releases?per_page=100 —
      official GitHub release history.
    - >
      https://github.com/jdefrancesco/dskDitto — official README for purpose, features,
      installation, and CLI usage.
    - >
      https://github.com/jdefrancesco/dskDitto/blob/master/docs/DittoDoc.md — official
      design documentation for the scanning and hashing pipeline.
    - input source_facts.package-manager — supplied Homebrew package record.
  summary:
    - >
      dskDitto is a Go duplicate-file detector built around parallel scanning and an
      interactive terminal interface, with an optional experimental GUI. It can verify
      content with SHA-256 or BLAKE3 and offers guarded deletion, symlink conversion,
      filtering, and machine-readable export.
  timeline:
    - '2021-06: Official GitHub repository created.'
    - "2026-05: v0.5.6 published as the repository's first GitHub release record."
  usage:
    - >
      Users run dskDitto with one or more filesystem paths. The default experience scans
      for duplicates and opens a Bubble Tea terminal UI; flags select filters, hashing
      behavior, text or structured output, destructive operations, and the optional
      Raylib GUI.
related-packages:
  - id: brew:jdupes
    reason: >
      Choose jdupes for a mature, highly scriptable command-line duplicate finder with
      extensive deletion, linking, deduplication, and filesystem-safety controls instead
      of an interactive TUI-first workflow.
    rel: alternative
    sources:
      - https://codeberg.org/jbruchon/jdupes/src/branch/master/README.md
      - https://github.com/jdefrancesco/dskDitto#readme
  - id: brew:rdfind
    reason: >
      Choose rdfind when deterministic original-file ranking and batch replacement of
      duplicates with hard links or symbolic links are more important than interactive
      review.
    rel: alternative
    sources:
      - https://github.com/pauldreik/rdfind#readme
      - https://github.com/jdefrancesco/dskDitto#readme
  - id: brew:fdupes
    reason: >
      Choose fdupes for a smaller, traditional Unix CLI centered on listing or
      interactively deleting duplicate files without dskDitto's TUI and optional GUI
      layers.
    rel: alternative
    sources:
      - https://github.com/adrianlopezroche/fdupes#readme
      - https://github.com/jdefrancesco/dskDitto#readme
  - id: brew:czkawka
    reason: >
      Choose Czkawka for a broader cross-platform cleanup suite that includes duplicate
      detection alongside empty-file, similar-image, broken-file, and other cleanup
      searches.
    rel: alternative
    sources:
      - https://github.com/qarmin/czkawka#readme
      - https://github.com/jdefrancesco/dskDitto#readme
