history:
  adoption-history:
    - >
      Kompose became a standard package-manager-visible bridge for teams moving from
      local Compose applications toward Kubernetes. Its Homebrew formula and binary
      releases made it easy to add to developer laptops, while Kubernetes ownership gave
      it a clear place inside the broader container tooling ecosystem.
  package-nerd-significance:
    - >
      For package nerds, Kompose is interesting because it packages a cross-orchestrator
      translation problem into one CLI. It also records the history of container tooling
      convergence: Compose was the local-development lingua franca, while Kubernetes
      became the deployment API that package managers needed to put on workstations.
  project-history:
    - >
      The repository was created on 2016-06-27, during the period when Kubernetes
      adoption was expanding beyond early cluster operators. The first alpha release,
      v0.0.1-alpha, was published on 2016-07-01. The v1.0.0 release on 2017-07-20
      announced graduation from Kubernetes Incubator and a move to the
      `kubernetes/kompose` repository.
    - >
      Kompose's README defines the core contract: take a Compose file and translate it
      into Kubernetes resources. The project documentation is hosted at kompose.io and
      in the repository's docs tree, with user-guide material for conversion, labels,
      commands, and operational workflows.
  related-projects:
    - >
      Kompose is directly related to Docker Compose, the Compose Specification,
      Kubernetes, kubectl, and the historical Kubernetes Incubator organization.
  sources:
    - https://api.github.com/repos/kubernetes/kompose
    - https://github.com/kubernetes/kompose
    - https://github.com/kubernetes/kompose/releases/tag/v0.0.1-alpha
    - https://github.com/kubernetes/kompose/releases/tag/v1.0.0
    - https://kompose.io/user-guide/
    - https://raw.githubusercontent.com/kubernetes/kompose/main/README.md
  summary:
    - >
      Kompose, short for Kubernetes plus Compose, is a migration utility that translates
      Compose Specification files into Kubernetes resources. It sits at the boundary
      between the Docker Compose developer workflow and Kubernetes manifests, helping
      users get a first Kubernetes deployment without manually rewriting every service,
      volume, and network concept.
  timeline:
    - '2016-06-27: GitHub repository created.'
    - '2016-07-01: v0.0.1-alpha published.'
    - '2017-07-20: v1.0.0 published and Kubernetes Incubator graduation announced.'
  usage:
    - >
      The common workflow is `kompose convert -f compose.yaml`, which emits Kubernetes
      YAML such as Deployments and Services. The project warns that conversion from
      Compose to Kubernetes may not be exact, framing Kompose as a convenience and
      migration aid rather than a perfect semantic compiler.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Kompose generates Kubernetes manifests, and kubectl is the official CLI used in
      Kompose's documented workflow to apply and inspect those resources.
    rel: adjacent_workflow
    sources:
      - https://kompose.io/
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:minikube
    reason: >
      Kompose's official beginner guide uses minikube to provide a local Kubernetes
      cluster on which users convert and deploy a Compose application.
    rel: adjacent_workflow
    sources:
      - https://kompose.io/getting-started/
      - https://minikube.sigs.k8s.io/docs/
