history:
  project-history:
    - >
      The tool is tied to the mid-2010s wave of C++ metaprogramming tooling around Clang
      and Templight. Public Templight material names Abel Sinkovics and Andras Kucsma in
      connection with Metashell, and a Meeting C++ 2014 talk presented an interactive
      metaprogramming shell based on Clang. Metashell's own documentation says it uses
      Clang to evaluate metaprograms, while later discussion of Metashell 2.0.0
      highlighted a GDB-like template metaprogram debugger.
  sources:
    - https://formulae.brew.sh/formula/metashell
    - https://github.com/metashell/metashell
    - >
      https://lists.boost.org/archives/list/boost%40lists.boost.org/thread/HCSZTS5QAA5UK3JPUYACBMKDDSTGMSY6/
    - https://llvm.org/devmtg/2015-04/slides/EuroLLVM2015Templight.pdf
    - https://plc.inf.elte.hu/templight/
    - https://raw.githubusercontent.com/metashell/metashell/master/docs/index.md
    - >
      https://www.boost.org/doc/libs/latest/doc/html/metaparse/getting_started_with_boost_metap.html
  summary:
    - >
      Metashell is a C++ template metaprogramming REPL: its project README describes the
      goal as providing an interactive shell for template metaprogramming, and the
      project documentation frames it as the C++ template analogue of Python, Haskell,
      or Erlang interactive shells. Its core niche is making compile-time C++ template
      evaluation inspectable without forcing developers to encode every experiment as
      compiler diagnostics.
  usage:
    - >
      In practice, Metashell is used by C++ library authors and template-heavy codebases
      to experiment with types, evaluate metaprograms, and debug template instantiation
      flows. Boost.Metaparse documentation explicitly assumes Metashell can be used
      while building compile-time parsers, which places it in the same ecosystem as
      Boost.MPL, Metaparse, Clang, and Templight rather than in general-purpose C++
      build tooling. The Homebrew package exposes both metashell and
      templight_metashell, matching that role as a specialist command-line tool for
      template metaprogramming work.
