history:
  adoption-history:
    - >
      BluOS Controller is distributed across macOS, Windows, iOS, and Android as the
      common control surface for BluOS-enabled audio products. Its role spans consumer
      listening setups and professionally installed multi-room systems.
  package-nerd-significance:
    - >
      The macOS cask is useful for reproducibly installing the desktop controller used
      with networked Bluesound and other BluOS-enabled hardware, without relying on a
      mobile app.
  project-history:
    - >
      BluOS Controller was developed as the client application for the BluOS wireless
      multi-room audio platform. Bluesound states that BluOS is developed in-house and
      supports products and integrations across the wider BluOS ecosystem.
  related-projects:
    - BluOS is the underlying networked-audio platform.
    - Bluesound players are a primary family of hardware managed by the controller.
    - >
      AirPlay 2, Spotify Connect, TIDAL Connect, Roon, and smart-home control systems
      are supported by various BluOS products.
  sources:
    - 'Official Bluesound BluOS overview: https://www.bluesound.com/pages/ci'
    - >
      Official installation guide:
      https://support1.bluesound.com/hc/en-us/articles/205605968-How-do-I-install-and-update-the-BluOS-Controller-App
    - 'Official support center: https://support.bluesound.com/hc/en-us'
  summary:
    - >
      BluOS Controller is the desktop and mobile control application for BluOS-enabled
      network audio systems. It discovers and manages players, playback queues, music
      services, network libraries, grouping, settings, upgrades, and diagnostics.
  timeline:
    - '2023: Official installation guidance documented desktop support for macOS and Windows.'
    - >
      2024: Official help documentation described the consolidated Help, diagnostics,
      upgrade, and support-request features in BluOS Controller.
  usage:
    - >
      Users run the controller on the same network as their BluOS players to discover
      rooms, select music, manage playback and grouping, configure services and shares,
      inspect diagnostics, and install updates.
