history:
  adoption-history:
    - >
      The README's primary installation path is Homebrew, using `brew install
      media-control`. It also includes advanced examples such as xbar menu-bar
      integration and shell pipelines for saving cover artwork, which is a strong signal
      that the project is meant for everyday automation rather than only library
      embedding.
  package-nerd-significance:
    - >
      For package-manager users, media-control is a tidy macOS automation bridge: a
      single CLI wraps media playback state that would otherwise require private
      frameworks or app-specific scripting. That makes it useful in status bars, shell
      scripts, and lightweight desktop automation.
  project-history:
    - >
      The official repository is a compact CMake-based project with a
      `mediaremote-adapter` submodule. Public tags and releases show active versioned
      releases from at least v0.5.1 in July 2025 through v0.7.6 in May 2026.
    - >
      The README states that the tool is available for all macOS versions, including
      macOS Tahoe, and centers the project around scriptable access to now-playing
      state, artwork, playback position, and transport controls.
  related-projects:
    - mediaremote-adapter, xbar, Spotify, jq, macOS MediaRemote.
  sources:
    - https://github.com/ungive/media-control#readme
    - https://github.com/ungive/media-control/releases
    - https://github.com/ungive/media-control/tags
  summary:
    - >
      media-control is a macOS command-line utility for observing and controlling media
      playback. Its README describes one-shot now-playing queries, real-time streams,
      and playback actions such as toggling play and pause.
  timeline:
    - '2025: v0.5.1 tag appears in the official repository.'
    - '2025: v0.7.0 tag starts the 0.7 release line.'
    - '2026: v0.7.6 is released with streamed artwork MIME type support.'
  usage:
    - >
      Common commands include `media-control get` for one-time now-playing information,
      `media-control get -h` for human-readable output, `media-control stream` for
      real-time updates, and `media-control toggle-play-pause` for playback control.
      Examples also cover extracting artwork data, watching song changes, tracking
      timeline position, and pausing when a track ends.
related-packages:
  - id: brew:jq
    reason: >
      The official media-control examples pipe its JSON output through jq to select
      metadata, decode artwork fields, and react to playback events.
    rel: adjacent_workflow
    sources:
      - https://github.com/ungive/media-control/blob/master/README.md
      - https://jqlang.github.io/jq/
  - id: cask:xbar
    reason: >
      media-control includes an xbar plugin example that displays the current song in
      the macOS menu bar.
    rel: adjacent_workflow
    sources:
      - https://github.com/ungive/media-control/blob/master/README.md
      - https://xbarapp.com/
