history:
  adoption-history:
    - >
      HAMRS targets portable amateur-radio operating across desktop and mobile devices.
      The current product supports offline field use, device synchronization, ADIF
      interchange, QRZ uploads, POTA and SOTA workflows, callsign lookup, and
      radio-control integrations.
  package-nerd-significance:
    - >
      HAMRS Pro is interesting as a cross-platform field application whose packaging
      must serve desktop, mobile, web, offline-data, and radio-hardware use cases. The
      Pro name denotes the rewritten product identity rather than merely a conventional
      paid feature tier.
  project-history:
    - >
      HAMRS was created as a simple portable amateur-radio logger. In September 2024 its
      developer announced a ground-up rewrite intended to improve release velocity,
      synchronization, error reporting, offline POTA data, imports, and custom
      templates.
    - >
      The rewrite left beta in November 2024 as HAMRS Pro. A distinct product identifier
      allowed the previous HAMRS version and the rewritten application to coexist while
      users migrated their data.
  related-projects:
    - FLRIG and Hamlib provide radio-control integration.
    - WSJT-X supplies digital-mode data that HAMRS can consume.
    - >
      QRZ, HamDB, Parks on the Air, and Summits on the Air are services or activity
      ecosystems integrated into common HAMRS workflows.
  sources:
    - https://docs.hamrs.app/docs/rig-control/getting-started
    - https://hamrs.app/
    - https://hamrs.app/announcements/1
    - https://hamrs.app/announcements/2
  summary:
    - >
      HAMRS Pro is a cross-platform, field-oriented amateur-radio contact logger
      designed to remain useful when operating without network connectivity.
  timeline:
    - '2024-09: A ground-up HAMRS rewrite entered public beta.'
    - '2024-11: The rewrite left beta under the HAMRS Pro name.'
  usage:
    - >
      Operators create logbooks for activities such as Parks on the Air and Field Day,
      record radio contacts, import or export ADIF, synchronize across devices, and
      upload contacts to QRZ.
    - >
      Desktop users can connect HAMRS to FLRIG or use native Hamlib support for rig
      control; the application also integrates with WSJT-X workflows.
