history:
  adoption-history:
    - >
      AWSweeper's official README documents installation from GitHub releases and from
      the author's Homebrew tap. The batch input also shows packaging in Homebrew and
      Nix, which is typical for a niche infrastructure CLI: small enough to remain
      specialized, but useful enough to be packaged for repeatable workstation and CI
      installation.
  package-nerd-significance:
    - >
      Package maintainers care about AWSweeper because it is a compact example of a
      cloud CLI that delegates hard provider-specific behavior to generated AWS and
      Terraform-adjacent code. It is also exactly the kind of tool package managers make
      safer to install: operationally powerful, infrequently used, and much better
      pinned to a known release than fetched from an arbitrary install script.
  project-history:
    - >
      The official GitHub repository was created in July 2017, and the first GitHub
      release listed by the repository is v0.1.0 from November 2017. The README
      describes AWSweeper as a tool for cleaning AWS accounts and explains that it
      builds on delete routines from the Terraform AWS provider, list operations from
      the author's awsls project, and generated code based on AWS API models.
    - >
      By the documented v0.12.0 release in February 2022, the README described support
      for more than 290 AWS resource types, with a stated goal of covering every AWS
      resource supported by Terraform without maintaining large amounts of bespoke
      deletion code in AWSweeper itself.
  related-projects:
    - >
      The README explicitly relates AWSweeper to the Terraform AWS provider for delete
      routines, awsls for list operations, AWS SDK API models for generated code, and
      awsrm as a later Unix-like AWS resource deletion tool by the same author.
  sources:
    - GitHub releases API lists v0.1.0 on 2017-11-22 and v0.12.0 on 2022-02-08.
    - 'GitHub repository metadata: created_at 2017-07-25.'
    - >
      Official README documents resource coverage, Terraform provider relationship,
      awsls relationship, install methods, and usage.
    - input.source_facts.package-manager lists Homebrew and Nix packaging.
  summary:
    - >
      AWSweeper is a Go command-line tool for deleting selected AWS resources from an
      account using a YAML filter file. It belongs to the small but important class of
      cloud cleanup tools that exist because real AWS accounts accumulate test,
      orphaned, and policy-violating resources faster than humans can remove them by
      hand.
  timeline:
    - '2017: Official GitHub repository created.'
    - '2017: v0.1.0 GitHub release published.'
    - '2020: Regular v0.5 through v0.11 release series.'
    - '2022: v0.12.0 release published.'
  usage:
    - >
      Users pass AWSweeper a YAML filter file naming Terraform-style AWS resource type
      identifiers and optional filters by id, tag, or creation date. The tool lists
      matching resources before deletion, supports a dry-run mode, and requires explicit
      confirmation unless the dangerous force flag is used for automation.
