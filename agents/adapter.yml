history:
  adoption-history:
    - >
      Macroplant shipped Adapter for both macOS and Windows. Official 2011 release posts
      show early updates responding to crash reports and adding presets for contemporary
      devices such as the Kindle Fire, iPhone 4S, and iPad 2.
    - >
      Adapter 2 remained freeware and expanded the application from straightforward
      transcoding into operations such as watermarking, subtitle burning, animated-GIF
      creation, image-sequence conversion, and time-lapse output.
  package-nerd-significance:
    - >
      Adapter is notable as a graphical, freeware front end around established media
      components, especially FFmpeg and VLC. Its Homebrew cask offers macOS users a
      package-managed way to install a consumer-friendly transcoder without constructing
      FFmpeg command lines.
  project-history:
    - >
      Official Macroplant posts document active Mac and Windows releases by 2011.
      Version 2.1.0 for Mac arrived in 2014 with an updated FFmpeg backend, integrated
      VLC previews, layers, and broader image-sequence workflows.
    - The official downloads page distributes Adapter 2.1.6 for macOS and 2.1.2 for Windows.
  related-projects:
    - FFmpeg supplies Adapter’s core media-conversion capability.
    - VLC is used for media preview functionality.
  sources:
    - >
      Official historical release posts: https://macroplant.com/blog/page/19 and
      https://macroplant.com/blog?tag=audio+converter
    - 'Official license: https://macroplant.com/adapter/eula'
    - >
      Official product and downloads pages: https://macroplant.com/adapter and
      https://macroplant.com/downloads
    - >
      Official tutorials and support: https://macroplant.com/adapter/tutorials and
      https://helpdesk.macroplant.com/hc/en-us/categories/360001487673-Adapter
  summary:
    - >
      Adapter is Macroplant’s graphical converter for video, audio, and image files on
      macOS and Windows. It provides individual and batch conversion through a desktop
      interface and relies on established media engines rather than presenting itself as
      a command-line codec suite.
  timeline:
    - '2011: Official Macroplant posts document Adapter 1.x releases for Mac and Windows.'
    - >
      2014: Adapter 2.1.0 for Mac adds an updated FFmpeg backend, integrated VLC
      previews, layers, and expanded image workflows.
    - 'Current official download surface: Adapter 2.1.6 for macOS and 2.1.2 for Windows.'
  usage:
    - >
      Users add one or more media files, choose an output format or device-oriented
      preset, optionally configure layers or other transformations, and run the
      conversion.
    - >
      The application is commonly useful when a graphical batch workflow is preferable
      to direct FFmpeg usage.
