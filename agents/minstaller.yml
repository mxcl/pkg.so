history:
  adoption-history:
    - >
      MotionVFX positions mInstaller as the standard utility for customers with one-time
      purchases, templates, and plugins. Current releases support macOS and Windows,
      while an associated iPad edition distributes compatible DaVinci Resolve plugins.
  package-nerd-significance:
    - >
      For package users, mInstaller is an example of a vendor-controlled content manager
      whose value lies in installing and licensing downstream creative assets rather
      than providing a conventional open-source package workflow.
  project-history:
    - >
      MotionVFX created mInstaller as a free companion application for downloading
      purchased products. It evolved into a combined library, installer, uninstaller,
      repair tool, license manager, download resumer, notification client, store, and
      support entry point.
  related-projects:
    - >
      mExtension is MotionVFX's newer companion for DesignStudio elements, mCaptionsAI,
      and CineStudio content.
    - >
      mInstaller manages products used with Final Cut Pro, Apple Motion, DaVinci
      Resolve, Adobe Premiere Pro, and After Effects.
  sources:
    - >
      Official Help Center overview:
      https://support.motionvfx.com/en/articles/5500247-what-is-minstaller-and-how-to-use-it
    - >
      Official installation guide:
      https://support.motionvfx.com/en/articles/9099828-how-to-install-motionvfx-products
    - 'Official product page: https://www.motionvfx.com/minstaller'
  summary:
    - >
      mInstaller is MotionVFX's free download, installation, and license-management
      application for the company's creative plugins, templates, and purchased products.
  timeline:
    - >
      By 2020: Official MotionVFX manuals instructed customers to obtain products
      through mInstaller.
    - >
      2026: MotionVFX documentation described mInstaller as the application for
      purchases, templates, and timelines, while directing subscription-oriented
      products to mExtension.
  usage:
    - >
      Users sign in with their MotionVFX account, access purchased products, install or
      remove them, repair installations, and manage licenses. Installing products can
      require the Mac administrator password. Downloaded standalone content defaults to
      the user's Downloads/motionVFXDownload directory, which can be changed in
      mInstaller settings.
