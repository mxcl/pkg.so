id: brew:dhall-lsp-server
display-name: dhall-lsp-server
repo: https://github.com/dhall-lang/dhall-haskell
docs:
  - https://docs.dhall-lang.org/howtos/Text-editor-configuration.html
  - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-lsp-server#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official text-editor configuration guide documents use with Vim, Emacs, and
      Visual Studio Code-style environments, while the dhall-lsp-server README describes
      the VSCode/ium plugin pairing. That is adoption in the developer-tooling sense:
      the package makes Dhall usable as something edited with feedback, not just
      batch-rendered into JSON or YAML.
  package-nerd-significance:
    - >
      For package maintainers, dhall-lsp-server is the piece that turns a
      compiler-oriented language package into a daily editor dependency. It also shows
      the modern split between language core packages, editor client extensions, and a
      separately packaged server binary.
  project-history:
    - >
      The dhall-lsp-server README places it inside the dhall-haskell project as the
      actual LSP server backend. It distinguishes the backend from VSCode/ium client
      extensions and says the server implements language features in an editor-agnostic
      way.
  related-projects:
    - >
      vscode-language-dhall supplies syntax highlighting, vscode-dhall-lsp-server
      supplies an LSP client extension, and dhall-haskell supplies the backend package.
      dhall-json and other sibling packages provide non-editor command-line
      integrations.
  sources:
    - https://github.com/dhall-lang/dhall-haskell/tree/main/dhall-lsp-server
    - https://docs.dhall-lang.org/howtos/Text-editor-configuration.html
    - https://github.com/dhall-lang/dhall-haskell
    - https://api.github.com/repos/dhall-lang/dhall-haskell/releases?per_page=100
  summary:
    - >
      dhall-lsp-server is the editor-facing language server for Dhall. It packages the
      Dhall implementation as an LSP backend so editors can surface diagnostics, hover
      types, completion, formatting, linting, and import-related actions while users
      edit configuration files.
  timeline:
    - >
      2017: dhall-haskell public releases included the broader Dhall toolchain that
      dhall-lsp-server later ships within.
    - >
      2026: Official Dhall documentation continues to document editor configuration
      around dhall-lsp-server.
  usage:
    - >
      Users install dhall-lsp-server, put it on PATH, and configure an editor LSP client
      to launch it for Dhall files. Official docs describe completion, document
      formatting, hover, parse/type diagnostics, clickable imports, freeze/refreeze
      import actions, and formatting/linting commands.
related-packages:
  - id: brew:dhall
    reason: >
      Install the core Dhall interpreter alongside the language server for command-line
      type checking, normalization, formatting, and other non-editor language workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/dhall-lang/dhall-haskell
      - https://docs.dhall-lang.org/howtos/Text-editor-configuration.html
