history:
  adoption-history:
    - >
      Futubull is distributed across mobile and desktop platforms as an account-based
      financial service. The retained legacy desktop build serves compatibility needs
      while Futu promotes a next-generation desktop application.
  package-nerd-significance:
    - >
      The versioned Homebrew cask preserves access to the older Mac desktop line after
      the vendor introduced a newer desktop generation. This is useful when users depend
      on legacy workflows or compatibility, but it also means the package should be
      distinguished carefully from the current Futubull client.
  project-history:
    - >
      Futu developed Futubull as its market-information, community, and
      securities-trading client. The official Mac download history now presents a
      next-generation desktop series while retaining version 16.11.15608 as a separately
      downloadable legacy-era build.
  related-projects:
    - >
      Futubull is accompanied by Futu's mobile clients, the current Futubull Desktop
      application, Futu OpenD, and the separately documented Futu API.
  sources:
    - 'Official Help Center: https://support.futunn.com/en/'
    - 'Official Mac download page: https://www.futunn.com/en/download/mac'
    - >
      Official algorithmic-trading platform documentation:
      https://support.futunn.com/en/topic638
  summary:
    - >
      Futubull Legacy for Mac is the retained legacy generation of Futu's macOS
      market-data and securities-trading client.
  timeline:
    - '2026-04-09: Version 16.11.15608 was published for Mac.'
    - >
      2026: Futu promoted its next-generation Futubull Desktop while continuing to
      expose the legacy build.
  usage:
    - >
      Users sign in with a Futu account to view market data and news, maintain
      watchlists, and use supported brokerage and trading features. Because it handles
      financial accounts, authentication and transaction-security settings are managed
      through the service and application rather than a documented local credentials
      file.
