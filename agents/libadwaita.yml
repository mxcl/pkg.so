config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libadwaita 1.0 was released on 2021-12-31, and GNOME design documentation was
      updated for the 1.0-era APIs in January 2022. GNOME 42-era application ports made
      it a central package for the GTK 4 transition, especially for adaptive layouts,
      preferences UI, navigation widgets, dark-style support, and consistent GNOME
      styling.
  package-nerd-significance:
    - >
      libadwaita is significant because it changed the packaging shape of GNOME apps: a
      visual and interaction policy layer became a shared library with ABI,
      documentation, demos, and distro dependencies.
  project-history:
    - >
      The project was introduced in 2021 as the GTK 4 successor to libhandy. GNOME
      developers framed it as a way to move Adwaita-specific widgets and style out of
      GTK itself while giving GNOME applications a stable library that could track Human
      Interface Guidelines revisions.
  related-projects:
    - >
      Related projects include GTK 4, GNOME Shell and core applications, libhandy,
      gi-docgen, GNOME Human Interface Guidelines, and language bindings built on
      GObject introspection.
  sources:
    - https://adrienplazas.com/blog/2021/03/31/introducing-libadwaita.html
    - >
      https://blogs.gnome.org/aday/2022/01/13/human-interface-guidelines-libadwaita-1-0-edition/
    - https://blogs.gnome.org/alicem/2021/
    - https://blogs.gnome.org/alicem/2022/03/19/libadwaita-1-1-libhandy-1-6/
    - https://blogs.gnome.org/alicem/2023/09/15/libadwaita-1-4/
    - https://gitlab.gnome.org/GNOME/libadwaita
    - https://gnome.pages.gitlab.gnome.org/libadwaita/doc
    - https://gnome.pages.gitlab.gnome.org/libadwaita/doc/main
  summary:
    - >
      libadwaita is GNOME's GTK 4 companion library for modern GNOME application UI:
      widgets, adaptive patterns, style, and HIG-aligned building blocks under the Adw
      namespace.
  timeline:
    - '2021-03-31: GNOME developers introduced libadwaita as the GTK 4 successor to libhandy.'
    - '2021-12-31: libadwaita 1.0 was released.'
    - >
      2022-01-13: GNOME's Human Interface Guidelines were updated for the libadwaita 1.0
      edition.
    - '2022-03-19: libadwaita 1.1 and libhandy 1.6 were released for the GNOME 42 cycle.'
    - '2023-09-15: libadwaita 1.4 introduced breakpoints for responsive UI changes.'
  usage:
    - >
      Developers use libadwaita through the C API, GObject introspection bindings,
      GtkBuilder UI files, and the adwaita-1 demo. The package is pulled in by many
      GNOME apps rather than run directly by end users.
related-packages:
  - id: brew:gtk4
    reason: >
      GTK 4 provides the underlying widget toolkit that libadwaita supplements with
      GNOME-specific adaptive widgets, styles, and design patterns.
    rel: adjacent_workflow
    sources:
      - https://gnome.pages.gitlab.gnome.org/libadwaita/doc/main/
      - https://gnome.pages.gitlab.gnome.org/gtk/gtk4/
  - id: brew:libhandy
    reason: >
      Choose libhandy for an application that must remain on GTK 3; libadwaita is its
      GTK 4 successor and requires a GTK 3-to-4 migration.
    rel: alternative
    sources:
      - >
        https://gnome.pages.gitlab.gnome.org/libadwaita/doc/1.0/migrating-libhandy-1-4-to-libadwaita.html
      - https://gitlab.gnome.org/GNOME/libhandy
