history:
  adoption-history:
    - >
      The developers reported rapid early use by authors and publishers immediately
      after the initial release. Vellum later added print-book production alongside
      ebook generation, and its official showcase documents use across thousands of
      independently published books and multiple genres.
  package-nerd-significance:
    - >
      Vellum is a notable macOS-only publishing cask because it packages a specialized
      commercial desktop workflow rather than a command-line formatter. It turns
      manuscripts into store-specific ebook files and print-ready output while hiding
      much of the platform-specific typography and validation work.
  project-history:
    - >
      Two developers created Vellum after researching the difficulties authors faced
      when preparing ebooks with tools designed primarily for print. Vellum 1.0 launched
      in December 2013 with a focus on predictable, book-oriented formatting and
      built-in knowledge of ebook-store requirements.
  related-projects:
    - >
      Its generated files target publishing ecosystems including Kindle, Kobo, and Apple
      Books. Vellum's workflow begins with imported Word manuscripts and produces EPUB
      and print-ready PDF output.
  sources:
    - 'Official adoption showcase: https://created.vellum.pub/about/'
    - 'Official documentation: https://help.vellum.pub/'
    - 'Official origin story: https://blog.vellum.pub/2014/01/why-ebooks/'
    - 'Official product overview: https://vellum.pub/'
  summary:
    - >
      Vellum is a commercial macOS application for formatting and generating ebooks and
      print editions. It emphasizes automated book structure, reusable visual styles,
      device previews, and synchronized output for multiple stores and print formats.
  timeline:
    - '2013: Vellum 1.0 launched in December.'
    - '2014: Vellum began publicly showcasing books made with the application.'
    - >
      2019: Its Kindle-generation workflow moved away from reliance on Amazon's aging
      KindleGen utility.
  usage:
    - >
      Authors import a DOCX manuscript or build a book in the application, organize
      front matter and chapters, select a visual style, preview the result on
      representative devices, and generate ebook and print editions. Projects are saved
      as user-selected Vellum documents; the official documentation does not prescribe a
      global configuration-file location.
