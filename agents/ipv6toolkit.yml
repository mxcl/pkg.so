history:
  adoption-history:
    - >
      ipv6toolkit is adopted most visibly by security practitioners, protocol
      implementers, trainers, and operators who need reproducible IPv6 packets and edge
      cases. Its packaging in Homebrew and Linux distributions makes that research
      toolkit available without cloning the source tree.
    - >
      Because many of its tools intentionally exercise attack vectors, malformed
      traffic, or protocol corner cases, the package lives more in assessment labs,
      conference demos, and troubleshooting sessions than in always-on production
      daemons.
  package-nerd-significance:
    - >
      ipv6toolkit is package-nerd significant because it packages a research-grade
      protocol workbench as many small executables rather than one monolithic scanner.
      The executable list itself is a tour of IPv6's security-sensitive mechanisms.
    - >
      Its changelog also shows the maintenance burden of portable low-level networking
      code: routing sockets, Netlink, libpcap timing differences, loopback behavior,
      endian definitions, and platform-specific builds all matter.
  project-history:
    - >
      The manual page describes the SI6 Networks IPv6 Toolkit as a security assessment
      and troubleshooting toolkit for IPv6 networks and implementations. It lists tools
      including addr6, frag6, icmp6, na6, ns6, ra6, scan6, tcp6, udp6, and others.
    - >
      The CHANGES.TXT file shows a steady evolution from the 1.4 line into 2.x,
      including a shared libipv6 library, improved next-hop and source-address
      selection, support for several BSD and macOS variants, port scanning in scan6,
      path6 for IPv6 traceroute-style work, script6 helpers, blackhole6, udp6, and
      Solaris support.
    - >
      The README records that the toolkit builds with make, depends on libpcap, installs
      tools, configuration data, databases, and manual pages, and has been tested across
      Linux, BSD, macOS, and OpenSolaris systems.
  related-projects:
    - >
      ipv6toolkit relates to SI6 Networks research, libpcap, IPv6 Neighbor Discovery,
      ICMPv6, Router Advertisement tooling, Netlink, BSD routing sockets, and other
      network assessment tools such as nmap and traceroute-style utilities.
  sources:
    - https://formulae.brew.sh/formula/ipv6toolkit
    - https://github.com/fgont/ipv6toolkit
    - https://raw.githubusercontent.com/fgont/ipv6toolkit/master/CHANGES.TXT
    - https://raw.githubusercontent.com/fgont/ipv6toolkit/master/README.TXT
    - https://raw.githubusercontent.com/fgont/ipv6toolkit/master/manuals/ipv6toolkit.7
    - https://www.si6networks.com/research/tools/ipv6toolkit/
  summary:
    - >
      ipv6toolkit is Fernando Gont and SI6 Networks' command-line toolkit for IPv6
      security assessment and troubleshooting. It bundles packet-crafting, scanning,
      Neighbor Discovery, Router Advertisement, fragmentation, flow-label, and
      path-analysis tools aimed at protocol testing rather than general network
      monitoring.
  timeline:
    - '2011: Manual-page copyright period begins for the SI6 Networks toolkit documentation.'
    - '2015: Manual page records v2.0-era tool coverage and copyright through 2015.'
    - 'v1.4: libipv6 is introduced to avoid per-tool code replication.'
    - 'v1.5: Next-hop determination and source-address selection are improved.'
    - >
      v2.0: path6, script6, blackhole6, udp6, Solaris support, and port-scanning
      improvements arrive.
    - 'v2.2: The changelog records consistency fixes and path6/blackhole6 maintenance.'
  usage:
    - >
      Users employ ipv6toolkit to generate arbitrary IPv6, ICMPv6, TCP/IPv6, and
      UDP/IPv6 packets; test fragmentation and jumbogram behavior; assess Neighbor
      Discovery and Router Advertisement handling; perform IPv6 address scans; and
      locate blackholes related to extension headers.
    - >
      The package's libpcap dependency and manual-page set are important operational
      details: the tools need packet-capture privileges and are meant to be run
      deliberately on test hosts or authorized assessment networks.
