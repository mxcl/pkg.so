id: brew:configen
display-name: configen
repo: null
docs:
  - https://github.com/theappbusiness/ConfigGenerator#readme
config-file-location:
  unix:
    - <project>/Config/*.map
    - <project>/Config/*.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation guidance is project-local: download a release binary or
      build the Xcode project, copy the executable into the app repository, and wire it
      into Xcode schemes. The supplied Homebrew package fact shows how the same
      binary-oriented workflow was also made installable through a package manager.
  package-nerd-significance:
    - >
      configen is package-nerd relevant as a narrow, app-build helper that Homebrew
      turns into a repeatable CLI dependency. It is less a general configuration system
      than a fossil of a common iOS packaging need: typed, generated build configuration
      from plist-era project assets.
  project-history:
    - >
      The project was published by The App Business as ConfigGenerator, with the
      executable named configen. The README frames it around robust multi-environment
      iOS builds: developers keep per-environment values in plist files, describe
      expected keys and types in a .map file, and add configen as an external build
      step.
    - >
      The release feed shows a compact lifecycle: v1.0.0 in 2017, Swift 4 and Xcode 9
      compatibility soon after, Swift 4.2/Xcode 10 compatibility in 2018, array support
      in 2019, and a Swift 5 update in 2020.
  related-projects:
    - >
      Official documentation ties configen to Xcode, Swift, Objective-C, plist files,
      mapping files, schemes, and external build-system targets.
  sources:
    - https://github.com/theappbusiness/ConfigGenerator#readme
    - https://github.com/theappbusiness/ConfigGenerator/releases
    - https://github.com/theappbusiness/ConfigGenerator/releases/tag/v1.0.0
    - https://github.com/theappbusiness/ConfigGenerator/releases/tag/v1.0.1
    - https://github.com/theappbusiness/ConfigGenerator/releases/tag/v1.0.2
    - https://github.com/theappbusiness/ConfigGenerator/releases/tag/1.1.0
    - https://github.com/theappbusiness/ConfigGenerator/releases/tag/1.1.2
  summary:
    - >
      configen is a small Xcode-oriented configuration code generator. It reads a
      mapping file and one or more property-list files, then generates Swift or
      Objective-C configuration code for app builds.
  timeline:
    - '2017: v1.0.0 release published; v1.0.1 updated the project for Swift 4 and Xcode 9.'
    - '2018: v1.0.2 updated the project for Swift 4.2 and Xcode 10.'
    - >
      2019: v1.1.0 added plist array support; v1.0.3 sorted generated variables to
      reduce git diffs.
    - '2020: v1.1.2 updated the project to Swift 5.'
  usage:
    - >
      Typical usage is configen --plist-path <plist> --hints-path <mapping-file>
      --class-name <output-class-name> --output-directory <output-directory>, optionally
      with --objective-c. It is aimed at build-time generation of typed configuration
      constants for multiple app environments.
