history:
  adoption-history:
    - >
      Apidog is distributed as a desktop and web-based team platform, with Homebrew Cask
      providing a native macOS installation path. Its documentation also covers CLI and
      CI/CD workflows, self-hosted runners, and on-premises deployment, reflecting
      adoption beyond interactive request testing.
  package-nerd-significance:
    - >
      Apidog occupies the all-in-one API-tool category: it combines capabilities that
      might otherwise require separate specification editors, request clients, mock
      servers, documentation generators, and test runners. The cask is chiefly valuable
      as a managed installation of its macOS desktop client.
  project-history:
    - >
      Apidog developed as a unified, specification-centered platform for the API
      lifecycle. Its official documentation presents both design-first and request-first
      workflows and organizes design, debugging, mocking, automated testing,
      documentation publishing, and collaboration around shared projects.
  related-projects:
    - OpenAPI and Swagger specifications are central interchange formats for Apidog projects.
    - Postman collections and scripts are supported migration and compatibility surfaces.
    - GraphQL, gRPC, WebSocket, SOAP, and SSE are supported alongside HTTP APIs.
  sources:
    - https://docs.apidog.com/en
    - https://docs.apidog.com/en/introduction-to-apidog-643492m0
    - https://docs.apidog.com/get-started-with-apidog-644404m0
    - source_facts.package-manager
  summary:
    - >
      Apidog is a collaborative API development platform covering API specification
      design, request debugging, mocking, automated testing, documentation publishing,
      and lifecycle management.
  timeline:
    - >
      By 2026: Official documentation covered desktop, web, CLI, CI/CD, self-hosted
      runner, and on-premises workflows.
    - '2026: The supplied Homebrew Cask record distributes Apidog 2.8.43 for macOS.'
  usage:
    - >
      Teams create or import API specifications, organize endpoints and environments in
      projects, send and validate requests, generate local or cloud mocks, build test
      scenarios, and publish interactive API documentation.
    - >
      Apidog supports design-first work that begins with a specification and
      request-first work that turns successful requests into endpoint specifications.
      Its automated tests can be incorporated into CI/CD workflows.
