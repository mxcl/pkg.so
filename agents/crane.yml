history:
  adoption-history:
    - >
      crane became common packaging material because it is useful without a Docker
      daemon: scripts can copy, tag, inspect, authenticate to, and move images directly
      against registries. Official installation instructions explicitly cover Homebrew,
      Arch Linux, release tarballs, Go install, and containerized usage.
  package-nerd-significance:
    - >
      For package maintainers, crane is a small, single-purpose registry CLI with signed
      release artifacts and documented SLSA provenance verification. That makes it
      attractive in build pipelines where installing a full container engine would be
      unnecessary overhead.
  project-history:
    - >
      The go-containerregistry repository was created in 2018 as a Go library and set of
      CLIs for container registry work. Its README describes the library as largely
      based on Google's earlier Python containerregistry library and explains that
      crane, gcrane, and krane are tools built on top of the shared registry primitives.
    - >
      The crane README documents direct binary releases, Go installation, Homebrew, Arch
      Linux, GitHub Actions setup, and a container image form of the tool. The project
      published a v0.1.0 GitHub release in 2020 and was still publishing releases in
      2026.
  related-projects:
    - >
      go-containerregistry also includes gcrane, a GCR-oriented variant, and krane, a
      Kubernetes-workload-identity-aware drop-in replacement. The README notes that ko
      originally lived in the repository before moving to its own project.
  sources:
    - https://github.com/google/go-containerregistry
    - https://github.com/google/go-containerregistry/tree/main/cmd/crane#readme
    - https://github.com/google/go-containerregistry/releases/tag/v0.1.0
    - https://github.com/google/go-containerregistry/releases/tag/v0.21.7
  summary:
    - >
      crane is the command-line front end in Google's go-containerregistry project for
      working with remote container images and registries. It sits beside the Go library
      APIs and exposes common registry operations as shell commands.
  timeline:
    - '2018: google/go-containerregistry repository created.'
    - '2020: v0.1.0 release published.'
    - '2026: v0.21.7 release published.'
  usage:
    - >
      Package users reach for crane for registry automation: pulling and pushing images,
      copying between registries, tagging images in CI, listing tags, and authenticating
      to registries. The go-containerregistry README maps examples such as crane pull,
      crane push, and crane cp to library-level remote and tarball operations.
related-packages:
  - id: brew:skopeo
    reason: >
      Choose skopeo when you need transports beyond registries, containers/image policy
      and signing integration, or the broader Podman ecosystem; choose crane for a
      compact go-containerregistry-based workflow.
    rel: alternative
    sources:
      - https://github.com/google/go-containerregistry/tree/main/cmd/crane#readme
      - https://github.com/podman-container-tools/skopeo#readme
  - id: brew:oras
    reason: >
      Choose ORAS when the primary task is pushing, attaching, discovering, and copying
      general OCI artifacts such as SBOMs or policy bundles rather than manipulating
      container images specifically.
    rel: alternative
    sources:
      - https://github.com/google/go-containerregistry/tree/main/cmd/crane#readme
      - https://oras.land/docs/
  - id: brew:cosign
    reason: >
      Use cosign alongside crane when images copied or inspected by crane must also be
      signed, attested, or verified through Sigstore workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/google/go-containerregistry/tree/main/cmd/crane#readme
      - https://docs.sigstore.dev/cosign/
  - id: brew:ko
    reason: >
      Use ko to build and publish Go applications as OCI images, then use crane for
      registry-side inspection, copying, tagging, or mutation of the resulting images.
    rel: adjacent_workflow
    sources:
      - https://ko.build/
      - https://github.com/google/go-containerregistry/blob/main/cmd/crane/recipes.md
