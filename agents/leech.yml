credentials-file-location: null
history:
  adoption-history:
    - >
      Leech has remained a macOS-specific commercial utility rather than a
      cross-platform downloader. Its long release history tracks macOS platform changes,
      including Retina graphics, Safari extension revisions, Dark Mode, sandboxing, and
      native Apple-silicon support.
  package-nerd-significance:
    - >
      Leech appeals to Mac package users who want more control than a browser download
      list provides without adopting a large cross-platform download suite. Its
      combination of a small native interface, automation rules, scheduling, bandwidth
      control, and Safari integration is characteristic of focused macOS utility
      software.
  project-history:
    - >
      Many Tricks developed Leech as a lightweight native download manager for macOS.
      The 3.0 release in 2016 substantially revised the interface and added accelerated
      downloads, scheduling, bandwidth throttling, and more reliable resume support.
    - >
      Subsequent releases adapted the Safari extension to changing browser rules, added
      Dark Mode and modern macOS compatibility, and produced a universal build for Intel
      and Apple-silicon Macs.
  related-projects:
    - >
      Leech integrates with Safari through an extension and with macOS through Services,
      notifications, the Dock, the menu bar, and AppleScript.
  sources:
    - 'Official data-location disclosure: https://manytricks.com/privacy/appstore/'
    - 'Official product page: https://manytricks.com/leech/'
    - 'Official release notes: https://manytricks.com/leech/releasenotes/'
    - 'Official user guide: https://manytricks.com/leech/help/'
  summary:
    - >
      Leech is a lightweight commercial download manager from Many Tricks for macOS,
      offering queues, scheduling, bandwidth limits, acceleration, rules, history, and
      browser integration.
  timeline:
    - >
      2016: Leech 3.0 introduced scheduling, bandwidth throttling, accelerated
      downloads, and a redesigned interface.
    - "2018: Leech 3.1.3 added Dark Mode and filtering for Safari's download-all-links feature."
    - '2021: Leech 3.1.5 became a universal application for Apple silicon and Intel Macs.'
    - '2025: The official user guide was updated for the Leech 3.2 generation.'
  usage:
    - >
      Users add URLs by pasting them, dropping them on Leech, opening URL lists, or
      sending links through the Safari extension. Downloads can be queued, paused,
      resumed, accelerated, scheduled, bandwidth-limited, and routed using host or
      filename rules.
    - >
      Leech can run as a Dock application, a menu-bar utility, or in hybrid mode. It can
      preserve searchable download history or use a private mode that suppresses new
      history and notifications.
