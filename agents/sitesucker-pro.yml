history:
  adoption-history:
    - >
      SiteSucker is distributed directly by its author and through Apple-oriented
      channels, while SiteSucker Pro is the separately licensed edition with additional
      features. The Homebrew cask supplies another installation route for macOS package
      users.
  package-nerd-significance:
    - >
      SiteSucker represents the polished native-GUI branch of the website-mirroring tool
      family. It is useful to package-oriented Mac users who want recursive retrieval
      and link localization without assembling command-line crawler options, while still
      offering automation and detailed request, path, file-type, script, and video
      controls.
  project-history:
    - >
      SiteSucker is a long-running macOS website downloader maintained by Rick Cranisky.
      Its central design is to retrieve a website's pages and supporting resources and
      modify links so the downloaded copy can be browsed locally.
    - >
      The Pro edition extends the application with licensed features. The official
      version history records sustained adaptation to new macOS releases, changing web
      behavior, embedded media, JavaScript-heavy pages, PDF creation, and specialized
      download workflows.
  related-projects:
    - >
      The broader tool category includes recursive website downloaders, offline
      browsers, and command-line mirroring utilities.
  sources:
    - https://ricks-apps.com/osx/sitesucker/archive/6.x/6.1.x/6.1/manuals/en/pgs/Settings.html
    - https://ricks-apps.com/osx/sitesucker/history.html
    - https://ricks-apps.com/osx/sitesucker/index.html
    - source_facts.package-manager.brew-cask
  summary:
    - >
      SiteSucker Pro is the licensed edition of Rick Cranisky's native macOS tool for
      recursively downloading websites and preparing their contents for offline
      browsing.
  timeline:
    - '2020: Version 4.0 updated the application for macOS 11 and expanded script handling.'
    - >
      2024: Version 5.4 added archive.org-oriented suggested settings and expanded video
      and PDF workflows.
    - '2025: Version 6.0 updated SiteSucker for macOS 26.'
    - '2026: The 6.x series continued with crawler, reliability, and media-handling updates.'
  usage:
    - >
      A user enters a starting URL, adjusts the active document's retrieval settings if
      necessary, and downloads the site. SiteSucker can localize links for offline
      browsing, honor or override selected crawl constraints, use saved settings files,
      automate downloads, and work with password-protected sites.
