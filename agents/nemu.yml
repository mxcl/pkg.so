history:
  adoption-history:
    - >
      nEMU is a niche virtualization tool rather than a broad platform. The README lists
      packages for Alpine, Debian/Ubuntu, Gentoo, FreeBSD, RPM-based systems, and
      Homebrew. The Homebrew formula API snapshot generated on 2026-07-01 reported 314
      installs over 365 days and 52 installs over 30 days, which fits a specialized
      console-VM workflow.
  package-nerd-significance:
    - >
      Its package interest is mostly about making QEMU manageable in headless and
      Unix-console environments. The signal is not mass adoption; it is that the same
      small C/ncurses tool is packaged across multiple Unix-like ecosystems and keeps
      following QEMU feature growth.
  project-history:
    - >
      The public GitHub repository was created on 2019-11-15. The visible release
      history shows continued maintenance through v3.5.0 on 2026-06-11, after v3.4.0 on
      2025-10-22 added VM preview support for terminals with the Kitty graphics protocol
      and related UI/configuration work.
  related-projects:
    - QEMU
    - SPICE
    - spice-kitten
    - nemu-droid
  sources:
    - https://api.github.com/repos/nemuTUI/nemu
    - https://api.github.com/repos/nemuTUI/nemu/releases?per_page=5
    - https://formulae.brew.sh/api/formula/nemu.json
    - https://github.com/nemuTUI/nemu/blob/master/README.md
  summary:
    - >
      nEMU is a small, focused terminal UI for managing QEMU virtual machines. Its
      upstream repository describes it as an ncurses UI for QEMU and lists everyday VM
      operations: install, delete, clone, rename, show status and CPU use, start, stop,
      connect through VNC or SPICE, handle snapshots, edit settings, import OVA files,
      and expose a remote-control API.
  timeline:
    - '2019-11-15: GitHub repository created.'
    - '2023-10-04: v3.3.0 release added MacOS snapshot support and remote API work.'
    - '2025-10-22: v3.4.0 release added VM preview support.'
    - '2026-06-11: v3.5.0 release shipped custom PID/socket locations and shortcut changes.'
  usage:
    - >
      Package-oriented users install it when they want a local or SSH-friendly TUI
      around QEMU without running a desktop manager. In practice it sits between raw
      qemu-system command lines and heavier GUI tools: useful for repeat VM lifecycle
      operations, snapshots, TAP/macvtap networking, VirtFS sharing, and occasional
      VNC/SPICE access from a terminal-first setup.
related-packages:
  - id: brew:qemu
    reason: >
      QEMU is the underlying emulator nEMU manages, so install it for the system
      emulation, disk-image, networking, and guest-console capabilities exposed through
      nEMU.
    rel: adjacent_workflow
    sources:
      - https://github.com/nemuTUI/nemu#readme
      - https://www.qemu.org/docs/master/
  - id: brew:virt-manager
    reason: >
      Choose virt-manager instead when a graphical libvirt-based interface with creation
      wizards, resource views, and embedded VNC or SPICE consoles is preferable to
      nEMU's terminal UI.
    rel: alternative
    sources:
      - https://github.com/nemuTUI/nemu#readme
      - https://virt-manager.org/
