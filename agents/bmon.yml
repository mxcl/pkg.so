id: brew:bmon
display-name: bmon
repo: null
docs:
  - https://github.com/tgraf/bmon
config-file-location:
  unix:
    - /etc/bmon.conf
    - ~/.bmonrc
credentials-file-location: null
history:
  adoption-history:
    - >
      bmon is small but broadly packaged: it appears in Homebrew and common Linux
      distribution package sets, which reflects its role as a lightweight alternative to
      heavier network-monitoring stacks.
  package-nerd-significance:
    - >
      bmon matters to package nerds as a classic single-purpose Unix network tool: tiny
      enough to install casually, useful enough to keep around, and dependent on
      platform network-statistics APIs that package maintainers must test across
      systems.
  project-history:
    - >
      Thomas Graf's bmon project presents itself as a monitoring and debugging tool that
      captures networking-related statistics and renders them visually. Its GitHub
      repository became the central upstream location for releases and source.
  related-projects:
    - >
      iftop, nload, vnstat, iproute2, and netstat-style tools occupy nearby
      bandwidth-monitoring and network-statistics niches.
  sources:
    - https://github.com/tgraf/bmon
    - https://github.com/tgraf/bmon/releases
    - source_facts.package-manager
  summary:
    - >
      bmon is a terminal bandwidth monitor and rate estimator for inspecting network
      interface statistics in a human-friendly curses UI or scriptable text output.
  timeline:
    - '2010s: bmon development consolidates around the tgraf/bmon GitHub repository.'
    - '2017-12: GitHub releases list bmon v4.0.'
    - '2020s: bmon remains available across Homebrew and mainstream Linux package managers.'
  usage:
    - >
      Users run bmon to watch per-interface traffic rates, packet counters, and related
      statistics from a terminal. It is handy over SSH, in minimal systems, or during
      quick diagnosis when a full metrics stack is unnecessary.
related-packages:
  - id: brew:iftop
    reason: >
      Choose iftop when the main question is which host-to-host conversations consume an
      interface; choose bmon for a broader per-interface statistics view with modular
      and scriptable outputs.
    rel: alternative
    sources:
      - https://github.com/Jafaral/bmon#readme
      - https://pdw.ex-parrot.com/iftop/
  - id: brew:nload
    reason: >
      Choose nload for a simpler incoming-versus-outgoing traffic graph; choose bmon
      when you need detailed counters, interface selection, or programmable output.
    rel: alternative
    sources:
      - https://github.com/Jafaral/bmon/blob/master/man/bmon.8
      - https://www.roland-riegel.de/nload/
  - id: brew:vnstat
    reason: >
      Choose vnStat for persistent historical traffic accounting from kernel interface
      counters; choose bmon for interactive inspection of current rates and statistics.
    rel: alternative
    sources:
      - https://github.com/Jafaral/bmon#readme
      - https://humdi.net/vnstat/
  - id: brew:bandwhich
    reason: >
      Choose bandwhich when local process and remote-connection attribution matters;
      choose bmon for interface-level counters and modular terminal or machine-readable
      output.
    rel: alternative
    sources:
      - https://github.com/Jafaral/bmon#readme
      - https://github.com/imsnif/bandwhich#readme
