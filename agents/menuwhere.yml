history:
  adoption-history:
    - >
      Many Tricks introduced Menuwhere as a small, supported replacement for an older
      class of Mac utilities that placed menus near the pointer. It was released as a
      universal application for both Intel and Apple-silicon Macs.
    - >
      Subsequent releases expanded the original single-menu concept with an
      all-applications meta menu, keyboard navigation, adjustable text size, appearance
      controls, mouse activation, and compatibility work for newer macOS releases.
  package-nerd-significance:
    - >
      Menuwhere is characteristic of focused commercial Mac utilities: it performs one
      desktop interaction enhancement, is distributed as a signed application bundle,
      and fits naturally into Homebrew Cask workflows despite having no command-line
      interface.
    - >
      Its design is of particular interest to users of large or multiple displays, where
      moving repeatedly between the pointer and the global macOS menu bar can be
      disruptive.
  project-history:
    - >
      Many Tricks released Menuwhere 1.0 on April 21, 2021 to display the frontmost
      application's menus at the mouse pointer. Version 2.0 followed the next day,
      adding a menu spanning all open applications, configurable text size, and
      independent light or dark appearance on Big Sur.
    - >
      The project has continued through compatibility and usability releases, including
      modifier-plus-right-click activation, fixes for macOS menu-item behavior, and a
      web edition of its in-app help.
  related-projects:
    - >
      Witch is Many Tricks' application and window switcher, referenced by Menuwhere's
      documentation as a fuller alternative when the goal is switching applications.
    - >
      Butler is another Many Tricks productivity utility with configurable pop-up menus
      and keyboard-driven actions.
  sources:
    - https://manytricks.com/blog/?p=3896
    - https://manytricks.com/menuwhere/
    - https://manytricks.com/menuwhere/help/
    - https://manytricks.com/menuwhere/releasenotes/
  summary:
    - >
      Menuwhere is a macOS productivity utility from Many Tricks that opens the
      frontmost application's menus at the current pointer location or through a
      configurable keyboard shortcut.
  timeline:
    - '2021-04-21: Menuwhere 1.0 was released.'
    - >
      2021-04-22: Menuwhere 2.0 added all-application menus, text sizing, and appearance
      controls.
    - '2022: Modifier-plus-right-click activation was added.'
    - '2026: Menuwhere added movable pop-up menus and published its redesigned help on the web.'
  usage:
    - >
      By default, users hold Command and right-click to open the frontmost application's
      menus at the pointer; they may instead configure a hot key. Menus can be navigated
      using the mouse, arrow keys, or first-letter typing.
    - >
      Settings can hide unwanted or disabled items, expose alternate menu items, change
      text size and appearance, create a separate all-applications menu, and choose
      menu-bar, standard, or faceless operation.
