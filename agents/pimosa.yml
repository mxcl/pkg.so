history:
  adoption-history:
    - >
      Pimosa began as a macOS desktop application, added an official Windows build in
      November 2024, and subsequently broadened its desktop tool set. An iPhone edition
      followed in July 2026 with a smaller set of on-device video and image workflows.
      The supplied metadata also records Homebrew cask distribution on macOS.
  package-nerd-significance:
    - >
      Pimosa packages several established media-processing components behind one desktop
      interface. Its official credits name FFmpeg, ImageMagick, ExifTool, pdfcpu,
      Flutter, and fvp, making it a useful example of a commercial GUI assembled around
      open-source media tooling.
  project-history:
    - >
      Pimosa was developed as an all-in-one, offline media utility. Its public changelog
      documents expansion from macOS to Windows and the gradual addition of GIF,
      subtitle, metadata, audio, PDF, batch-processing, and mobile capabilities.
  related-projects:
    - >
      Official credits identify FFmpeg, ImageMagick, ExifTool, pdfcpu, Flutter, and fvp
      as underlying or supporting projects.
  sources:
    - 'Official changelog: https://pimosa.app/changelog'
    - 'Official credits: https://pimosa.app/credits'
    - 'Official documentation: https://docs.pimosa.app/'
    - 'Official product site: https://pimosa.app/'
    - 'Official tools catalog: https://pimosa.app/tools'
  summary:
    - >
      Pimosa is a commercial, offline desktop toolkit for common video, audio, image,
      GIF, and PDF conversion and editing jobs on macOS and Windows, with a related
      iPhone edition.
  timeline:
    - "2024: The changelog records early macOS releases and Pimosa's first Windows release."
    - '2025: The desktop suite added broader GIF, audio, subtitle, metadata, and PDF tooling.'
    - '2026: Pimosa added further video tools and released an iPhone edition.'
  usage:
    - >
      Users drag local files into focused tools to compress, convert, resize, trim,
      merge, rotate, annotate, extract, or encrypt media. Processing occurs locally, and
      many tools support queues or batch jobs without uploading source files.
