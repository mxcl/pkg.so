history:
  adoption-history:
    - >
      The strongest adoption claim comes from Fresta's own tools page, which says the
      software was used in the past by the Italian Carabinieri. Older Italian
      Linux-community material also framed it as a tool for testing whether one's own
      Alice or Fastweb router still used a recoverable default password.
    - >
      Its adoption appears narrow and model-specific. As ISPs changed hardware,
      default-key algorithms, and provisioning practices, tools like this became more
      historical security artifacts than general-purpose daily utilities.
  package-nerd-significance:
    - >
      The package is interesting mainly because Homebrew and MacPorts preserved a tiny,
      specialized security utility from a very specific era of consumer-router research.
      It documents a moment when default WPA generation flaws were common enough that
      algorithmic key-recovery tools circulated as normal audit utilities.
    - >
      Its narrow model list is the point: this is not a framework, not a modern Wi-Fi
      suite, and not a broadly maintained ecosystem package. It is a fossil with just
      enough provenance to be cataloged.
  project-history:
    - >
      The tool belongs to the late-2000s and early-2010s wave of router default-key
      research, when security researchers and hobbyists reverse-engineered ISP
      algorithms that generated predictable wireless network names and default WPA keys.
      WiRouter KeyRec targeted specific Telecom Italia, Fastweb, Eircom, and TeleTu/Tele
      2 router families rather than being a general WPA cracking tool.
    - >
      Because the reliable public sources are mostly the author's own listing and older
      community writeups, there is not enough source-backed detail to describe a broad
      release history or stewardship story beyond Fresta's authorship and the 1.1.2
      release line.
  related-projects:
    - >
      RouterKeygen and hashcat-adjacent keyspace research occupy the broader
      default-router-key auditing niche, although WiRouter KeyRec itself is focused on
      its listed supported models.
  sources:
    - >
      https://www.dreamsnet.it/perche-cambiare-la-password-predefinita-del-vostro-router-alice-e-fastweb-wirouter-keyrec/
    - https://www.orvietolinux.it/guide-linux/66-sicurezza/132-test-passwd-wirouterkeyrec
    - https://www.salvatorefresta.net/tools
  summary:
    - >
      WiRouter KeyRec is a niche Wi-Fi security tool by Salvatore Fresta for recovering
      default WPA passphrases on a small set of supported ISP router models. The public
      history is thin, but the author's tools page identifies version 1.1.2, a December
      2012 last update, supported models, and past use by the Italian Carabinieri.
  timeline:
    - >
      2010: Italian community writeups discuss WiRouter KeyRec for Alice and Fastweb
      default-password testing.
    - "2012: Fresta's tools page lists WiRouter KeyRec 1.1.2 with a December 2012 last update."
    - >
      2010s: The tool remains packaged by ports systems despite limited upstream public
      activity.
  usage:
    - >
      The intended usage is defensive recovery or audit of default WPA passphrases for
      supported routers, using the network identity information required by the tool's
      algorithms. It should be understood as a default-credential exposure checker for
      specific router families, not as a universal password-recovery method.
    - >
      In package-manager terms, it is a small command-line security artifact: useful if
      you are studying old ISP router key algorithms or auditing a supported device,
      otherwise likely irrelevant.
