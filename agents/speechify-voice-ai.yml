history:
  adoption-history:
    - >
      Speechify's official Mac page describes the broader service as having more than 60
      million users and one million five-star reviews. These are vendor-reported
      adoption figures rather than independently audited package-manager statistics.
    - >
      The product is distributed across macOS, Windows, iOS, Android, the web, Chrome,
      and Edge. The Homebrew cask provides Mac package users with another installation
      and upgrade path for the vendor's signed desktop build.
  package-nerd-significance:
    - >
      For package users, Speechify is an example of a proprietary, account-backed AI
      service exposed as a conventional desktop cask. The cask packages the client,
      while voice processing, synchronization, and subscription capabilities remain part
      of the vendor-operated service.
  project-history:
    - >
      Speechify began as a text-to-speech accessibility and reading product and later
      expanded its desktop application into a broader Voice AI Assistant combining
      text-to-speech, voice typing, and rapid answers.
    - >
      An official Speechify article documents a Mac offering by September 2022. The
      current Mac product emphasizes system-wide dictation and reading selected text or
      screenshots aloud.
  related-projects:
    - >
      Speechify's official download page lists its web app, mobile applications, Windows
      client, Chrome extension, and Edge extension as sibling products.
  sources:
    - https://speechify.com/blog/speechify-for-mac/
    - https://speechify.com/download/
    - https://speechify.com/mac/
    - source_facts.version
  summary:
    - >
      Speechify Voice AI Assistant is the macOS client for Speechify's text-to-speech,
      voice-typing, and AI-assistant platform.
  timeline:
    - '2022-09-27: Speechify publishes its official guide to using Speechify on Mac.'
    - >
      2026: The official Mac product presents text-to-speech and system-wide voice
      typing as the desktop application's principal workflows.
  usage:
    - >
      Users can dictate into Mac applications, listen to selected text with Option-A, or
      capture a region for reading with Option-X. Voice, speed, and shortcut preferences
      are managed within the application.
    - >
      Installation requires downloading the macOS application, placing it in
      Applications, and signing in. No official filesystem location for application
      configuration or credentials is documented.
