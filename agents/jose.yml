history:
  adoption-history:
    - >
      The input package metadata records Jose across several Unix package families,
      including Homebrew, Debian, Fedora/DNF, Alpine, Arch, Nix, Ubuntu, and openSUSE.
      That breadth reflects a common packaging role: a compact CLI and C library for
      JWT, JWK, signing, encryption, and thumbprint tasks in scripts and system
      components.
  package-nerd-significance:
    - >
      For package maintainers, Jose is interesting because it maps web-token standards
      into a traditional Unix tool shape: a C codebase, Meson build, OpenSSL/Jansson
      dependencies, manpage-style CLI behavior, and distro packages. It is the kind of
      small utility that becomes valuable glue in security packaging even when end users
      mostly know higher-level JWT libraries.
  project-history:
    - >
      The JOSE RFC set was published as proposed standards in May 2015. The
      latchset/jose repository followed in 2016, after the standards had stabilized,
      with a README positioning the project as a C-language implementation tested
      against RFC test vectors.
    - >
      Early GitHub releases appeared in August 2016. Subsequent releases kept the
      project useful as a small, packaging-friendly crypto utility rather than a large
      application framework.
  related-projects:
    - >
      Jose belongs to the wider JOSE ecosystem alongside language-specific libraries
      such as go-jose, node-jose, and Python JOSE bindings. It is also tied directly to
      IETF standards work around JWS, JWE, JWK, JWA, JWT, and related examples and
      thumbprint specifications.
  sources:
    - https://datatracker.ietf.org/doc/rfc7515/
    - https://datatracker.ietf.org/doc/rfc7519/
    - https://formulae.brew.sh/formula/jose
    - https://github.com/latchset/jose
    - https://github.com/latchset/jose/releases
  summary:
    - >
      José is a C implementation and command-line utility for the IETF JSON Object
      Signing and Encryption family of standards, including JWS, JWE, JWK, JWA, JWT,
      JOSE examples, and JWK thumbprints. It gives systems programmers and shell users a
      native CLI for operations that are more often hidden inside web-framework
      libraries.
  timeline:
    - '2015-05: RFC 7515 through RFC 7519 standardized the core JOSE/JWT documents.'
    - '2016-06: The latchset/jose repository was created on GitHub.'
    - '2016-08: v1 was published as an early GitHub release.'
    - '2021-05: v11 was published after Jose had already reached multiple distro package sets.'
    - '2026-06: v15 was published on GitHub.'
  usage:
    - >
      The README documents key generation, extracting public JWKs, computing
      thumbprints, signing and verifying JWS payloads, and encrypting and decrypting JWE
      payloads from the shell. That makes Jose useful for testing identity-provider
      flows, debugging token material, and automating JOSE operations without writing an
      application.
related-packages:
  - id: brew:jwt-cli
    reason: >
      Choose jwt-cli for a focused, cross-platform JWT encode, decode, and verification
      workflow; choose José when you need the broader JWK, JWS, JWE, algorithm,
      thumbprint, or embeddable C-library surface.
    rel: alternative
    sources:
      - https://github.com/latchset/jose#readme
      - https://github.com/mike-engel/jwt-cli#readme
