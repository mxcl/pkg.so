history:
  adoption-history:
    - >
      The official company page reports more than two million global users. MindManager
      has expanded beyond individual mind maps into cross-platform team and enterprise
      workflows, with integrations and diagramming features for planning, communication,
      and knowledge organization.
  package-nerd-significance:
    - >
      MindManager is a long-lived commercial desktop application in the mind-mapping
      category. For package users, it represents the established proprietary end of a
      software class that also includes lighter outlining tools and open-source mind-map
      editors.
  project-history:
    - >
      MindManager originated as Mindjet's commercial mind-mapping and
      information-visualization product. In August 2016, Mindjet MindManager was
      acquired by Corel Corporation. The product continues under the MindManager name
      with desktop, web, Microsoft Teams, and Chromebook offerings.
  related-projects:
    - >
      The product was historically associated with Mindjet and later Corel. Its current
      family includes MindManager for Windows, Mac, Web, Microsoft Teams, and
      Chromebook.
  sources:
    - https://www.mindmanager.com/en/company/about/
    - https://www.mindmanager.com/en/support/
    - https://www.mindmanager.com/en/support/download-library/
  summary:
    - >
      MindManager is a commercial mind-mapping, diagramming, and visual work-management
      application used to organize ideas, projects, processes, and business information.
  timeline:
    - 'August 2016: Corel Corporation acquired Mindjet MindManager.'
    - >
      By 2026: MindManager reported more than two million global users and maintained
      desktop, web, Teams, and Chromebook editions.
  usage:
    - >
      Users create visual maps and diagrams for brainstorming, project planning, process
      documentation, meetings, and knowledge communication. Organizations can deploy
      licensed desktop releases, while the wider product family also supports web and
      collaborative workflows.
