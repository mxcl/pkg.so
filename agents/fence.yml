    - ~/.config/fence/fence.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Fence's official README emphasizes AI coding-agent workflows and names Claude
      Code, Codex, Amp, Gemini CLI, GitHub Copilot, OpenCode, and Factory CLI as
      compatible commands. Packaging is still young, with Homebrew tap, Nix, curl
      installer, Go install, and source builds documented by upstream.
  package-nerd-significance:
    - >
      Fence is significant as a post-agent-era CLI package: instead of being an agent,
      package manager, or container runtime, it wraps arbitrary developer commands with
      reusable policy. That makes it relevant to package installation scripts, build
      scripts, CI jobs, and coding-agent sessions.
  project-history:
    - >
      The official README states that Fence moved from github.com/Use-Tusk/fence to
      github.com/fencesandbox/fence, with migration instructions for Homebrew tap users
      and Go installs. GitHub releases show an initial v0.1.0 release in December 2025
      and frequent v0.1.x releases through June 2026.
    - >
      The documentation positions Fence as a host-native sandbox rather than a container
      or VM. On macOS it uses sandbox-exec; on Linux it uses bubblewrap with Landlock
      and seccomp.
  related-projects:
    - The README credits Anthropic's sandbox-runtime as inspiration.
    - >
      bubblewrap, Landlock, seccomp, and macOS sandbox-exec are underlying or related
      sandboxing technologies.
  sources:
    - https://github.com/fencesandbox/fence
    - https://raw.githubusercontent.com/fencesandbox/fence/main/README.md
    - https://fencesandbox.com/docs
    - https://github.com/fencesandbox/fence/releases
  summary:
    - >
      Fence is a command sandbox and permission layer for running semi-trusted commands
      with default-deny network access and configurable filesystem and command rules.
  timeline:
    - '2025: v0.1.0 released on 2025-12-19.'
    - '2026: Project README documents migration from Use-Tusk/fence to fencesandbox/fence.'
    - '2026: v0.1.61 released on 2026-06-22.'
  usage:
    - >
      Basic usage wraps a command with network access blocked by default. Users can
      apply templates, monitor blocked requests, deny dangerous commands, configure
      filesystem read/write rules, and inspect the merged config with fence config show.
related-packages:
  - id: brew:bubblewrap
    reason: >
      Fence invokes bubblewrap as part of its Linux sandbox implementation, so
      installing bubblewrap supplies the low-level namespace and mount isolation Fence
      composes with its higher-level policy.
    rel: adjacent_workflow
    sources:
      - https://github.com/fencesandbox/fence#readme
      - https://github.com/fencesandbox/fence/blob/main/ARCHITECTURE.md
      - https://github.com/containers/bubblewrap#readme
