id: brew:fastgron
display-name: fastgron
repo: null
docs:
  - https://github.com/adamritter/fastgron#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Arch, Homebrew, Nix, and downloadable
      release binaries for Ubuntu and Windows. Homebrew's formula currently tracks the
      upstream v0.7.7 release archive.
  package-nerd-significance:
    - >
      fastgron matters to CLI package users because it is a performance-oriented
      reimplementation of a familiar data-inspection workflow: flatten JSON, use
      ordinary text tools, and optionally round-trip back to JSON.
  project-history:
    - >
      The GitHub repository was created in May 2023. The official README presents
      fastgron as a high-performance implementation inspired by gron, using simdjson and
      offering conversion in both directions between JSON and gron-style assignment
      output.
  related-projects:
    - >
      The README directly compares fastgron with gron and mentions jq and jj in
      path-query benchmarks.
  sources:
    - https://api.github.com/repos/adamritter/fastgron
    - https://api.github.com/repos/adamritter/fastgron/releases
    - https://formulae.brew.sh/api/formula/fastgron.json
    - https://github.com/adamritter/fastgron#readme
  summary:
    - >
      fastgron is a C++20 JSON-to-GRON converter focused on making large JSON documents
      grep-friendly at high speed.
  timeline:
    - '2023: GitHub repository created.'
    - '2023: Early v0.1.x releases published.'
    - '2023: v0.7.7 published and tracked by Homebrew.'
  usage:
    - >
      Typical use pipes JSON from files, stdin, or URLs into fastgron, filters the
      assignment-style output with tools such as grep or ripgrep, and can reconstruct
      JSON with --ungron.
related-packages:
  - id: brew:gron
    reason: >
      Choose gron for the original, widely packaged GRON workflow; choose fastgron when
      its documented performance, streaming, path filtering, or faster reverse
      conversion matters.
    rel: alternative
    sources:
      - https://github.com/adamritter/fastgron#readme
      - https://github.com/tomnomnom/gron#readme
