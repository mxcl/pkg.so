history:
  adoption-history:
    - >
      DJ.Studio's 2023 launch followed a beta presented at the International Music
      Summit in Ibiza. Next subsequently became its public prerelease channel, allowing
      users to test upcoming changes alongside the stable application and feed results
      back to the product team.
  package-nerd-significance:
    - >
      The Next cask exposes DJ.Studio's rolling preview channel as a separately managed
      macOS application. It is useful to early adopters who want upcoming audio-engine
      and workflow changes without replacing the stable build, but its shared project
      database makes backups or a separate database prudent.
  project-history:
    - >
      DJ.Studio launched publicly in 2023 as a timeline-oriented digital audio
      workstation for DJs, emphasizing assisted track ordering, editable transitions,
      and exports to finished media or downstream DJ and production tools.
    - >
      DJ.Studio Next was introduced as a parallel prerelease channel rather than a
      permanent major version. Features mature there before entering the stable
      application; after stable releases ship, Next advances to preview the following
      changes.
  related-projects:
    - DJ.Studio
    - Mixxx
    - Ableton Live
    - rekordbox
    - Serato DJ Pro
    - Traktor
  sources:
    - https://dj.studio/DJStudio-%20PressRelease-EN-Aug-30-2023.pdf
    - https://dj.studio/blog/next-launch
    - https://help.dj.studio/en/articles/11207973-dj-studio-4-0
    - https://help.dj.studio/en/articles/16982266-dj-studio-next
  summary:
    - >
      DJ.Studio Next is the frequently updated prerelease channel of DJ.Studio, a
      timeline-based DAW for arranging, refining, and exporting DJ mixes and mashups.
  timeline:
    - "2023-04: DJ.Studio's beta was presented at the International Music Summit in Ibiza."
    - '2023-09: DJ.Studio announced its public launch.'
    - >
      2025: Next was established as the continuing prerelease channel for upcoming
      DJ.Studio builds.
    - '2026-02: Features tested through Next graduated into the official DJ.Studio 4.0 release.'
  usage:
    - >
      Next can run beside the stable application, but official guidance says not to run
      both simultaneously. Settings are separate, while projects use the same database
      by default; users testing changes they may later roll back should select a
      separate database under Settings > Folders > Database Location.
    - >
      The broader DJ.Studio workflow imports music libraries, uses timeline editing and
      Harmonize for set construction, and exports audio, video, DJ-software playlists,
      Mixcloud uploads, backups, or Ableton Live projects. Next receives features sooner
      but may contain unfinished behavior and has more limited support.
related-packages:
  - id: cask:djstudio
    reason: >
      Choose the stable DJ.Studio package for a more polished and fully supported
      workflow; the official Next guide recommends switching back to stable when a
      prerelease issue blocks work.
    rel: alternative
    sources:
      - https://help.dj.studio/en/articles/16982266-dj-studio-next
  - id: cask:mixxx
    reason: >
      Choose Mixxx for free, open-source, controller-oriented live mixing; DJ.Studio's
      official comparison recommends DJ.Studio for timeline creation and set preparation
      and Mixxx for real-time performance.
    rel: alternative
    sources:
      - https://dj.studio/blog/djstudio-vs-mixxx
      - https://mixxx.org/
