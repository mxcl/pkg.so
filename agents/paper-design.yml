history:
  adoption-history:
    - >
      Paper’s February 2025 seed announcement named a three-person founding team and a
      US$4.2 million round led by Accel. By July 2026, Paper said it served thousands of
      customers, including design teams at established software companies.
    - >
      The company reported that launching Paper Desktop and its MCP workflow increased
      annual recurring revenue twenty-five-fold in one month. A US$34 million Series A
      in July 2026 brought its reported total funding to US$38.5 million.
  package-nerd-significance:
    - >
      Paper is notable to package users because its desktop client makes the design
      canvas accessible to local IDE and command-line agents through MCP. Its HTML/CSS
      rendering model also narrows the traditional gap between interface mockups and
      production web code.
    - >
      The Homebrew cask provides a reproducible installation route for the rapidly
      evolving desktop client, while official downloads also cover Linux and Windows.
  project-history:
    - >
      Paper was founded by Stephen Haney, Vlad Moroz, and Ksenia Kondrashova as an
      interface-design platform built around web standards. Its early product emphasized
      an infinite multiplayer canvas and direct use of HTML and CSS.
    - >
      The project increasingly oriented itself around collaboration between designers
      and coding agents. Paper Desktop added a locally connected canvas and MCP
      integration, followed by a substantial Series A intended to expand the editor and
      agent infrastructure.
  related-projects:
    - Paper MCP connects coding agents and IDEs to Paper design files.
    - Paper Snapshot converts web components into editable Paper layers.
    - Paper Shaders and Paper Mono are related open-source projects maintained by the company.
  sources:
    - https://paper.design/
    - https://paper.design/blog/seed
    - https://paper.design/blog/series-a
    - https://paper.design/docs
    - https://paper.design/downloads
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Paper is a collaborative interface-design and prototyping platform whose canvas
      uses HTML and CSS and can connect to coding agents through MCP. The company
      positions it as a shared design surface linking teams, agents, application code,
      and live data.
  timeline:
    - '2025: Paper announced a US$4.2 million seed round led by Accel.'
    - '2026: Paper Desktop introduced a locally connected, MCP-enabled design workflow.'
    - '2026: Paper announced a US$34 million Series A and US$38.5 million in total funding.'
  usage:
    - >
      Designers use Paper to create interfaces and prototypes, collaborate on an
      infinite canvas, work with production-like HTML/CSS concepts, and connect coding
      agents to designs through MCP. Desktop users can start a local file and pair Paper
      with supported IDE or CLI agents.
