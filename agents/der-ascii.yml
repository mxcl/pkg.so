history:
  adoption-history:
    - >
      Official install instructions use Go's module-aware install command, while the
      input package facts show availability through Homebrew and Nix.
  package-nerd-significance:
    - >
      It is useful to package maintainers and security-tool developers because it makes
      binary DER and BER fixtures reviewable, editable, and round-trippable from the
      shell.
  project-history:
    - >
      The project is hosted under Google's GitHub organization, but its README
      explicitly says it is not an official Google project.
  related-projects:
    - ASN.1, DER, BER, Go command-line tooling.
  sources:
    - https://github.com/google/der-ascii#readme
    - https://github.com/google/der-ascii/blob/master/language.txt
    - source_facts.package-manager
  summary:
    - >
      der-ascii is a small reversible text format and pair of tools for converting ASN.1
      DER or BER data between bytes and a human-editable representation.
  timeline:
    - 'Current: README documents ascii2der and der2ascii as the public tools.'
    - 'Current: README documents backwards-compatibility intent for the command-line interface.'
  usage:
    - >
      The documented workflow is to disassemble DER or BER with der2ascii, edit the
      textual representation, and reassemble it with ascii2der, especially for test
      inputs.
