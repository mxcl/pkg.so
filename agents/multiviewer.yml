id: cask:multiviewer
display-name: MultiViewer
repo: null
docs:
  - https://multiviewer.app/docs
  - https://multiviewer.app/docs/troubleshooting/drm-playback-issues
  - https://multiviewer.app/docs/usage/authentication
config-file-location:
  linux:
    - ~/.config/MultiViewer
  macos:
    - ~/Library/Application Support/MultiViewer
  windows:
    - '%APPDATA%/MultiViewer'
credentials-file-location:
  macos:
    - macOS Keychain (only when “Remember me” is enabled)
  windows:
    - Windows DPAPI-protected local storage (only when “Remember me” is enabled)
history:
  adoption-history:
    - >
      MultiViewer is distributed as a desktop application and serves motorsport viewers
      who want synchronized multi-feed layouts beyond a streaming service's standard
      player. Watching F1 TV content requires a paid F1 TV subscription; the application
      does not circumvent service restrictions or content protection.
  package-nerd-significance:
    - >
      MultiViewer is notable as a specialized desktop front end that turns authenticated
      motorsport streams into synchronized, restorable multi-window workspaces with
      telemetry. Its documented cross-platform data directories and
      operating-system-backed credential handling are useful operational details for
      packagers and support tooling.
  project-history:
    - >
      MultiViewer began as an unofficial desktop client centered on F1 TV and developed
      into a community-built multi-view player for several motorsports. It remains
      independent of Formula 1 and the streaming providers it supports.
  related-projects:
    - F1 TV is a supported streaming service and requires its own paid account.
    - Widevine provides DRM playback support for protected streams.
  sources:
    - https://multiviewer.app/docs
    - https://multiviewer.app/docs/troubleshooting/drm-playback-issues
    - https://multiviewer.app/docs/usage/authentication
  summary:
    - >
      MultiViewer is an unofficial, community-built motorsport desktop client for
      synchronizing multiple video streams, restoring saved layouts, and displaying
      telemetry alongside live action.
  timeline:
    - '2026: The supplied Homebrew record packages MultiViewer 2.8.4.'
  usage:
    - >
      Users authenticate with a supported streaming provider, open several synchronized
      feeds, arrange player windows, restore layouts, and view live timing or telemetry.
      F1 TV use requires an active subscription. Session cookies and tokens are stored
      locally; remembered credentials receive operating-system encryption on supported
      platforms.
tags:
