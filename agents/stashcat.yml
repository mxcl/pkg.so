history:
  adoption-history:
    - >
      stashcat expanded into public authorities, police organizations,
      critical-infrastructure operators, schools, and businesses. An official 2021
      acquisition announcement reported more than one million users; the current product
      site reports use across more than 8,000 companies and over 1.3 million users
      worldwide.
    - >
      secunet acquired stashcat GmbH in May 2021 to add secure messaging and
      collaboration to its cybersecurity portfolio.
  package-nerd-significance:
    - >
      stashcat represents the managed, organization-oriented end of desktop messaging
      packages: its emphasis is controlled deployment, GDPR-aligned operation,
      end-to-end encryption, federation, branding, and cloud or on-premises hosting
      rather than a public source-code ecosystem.
  project-history:
    - >
      Christopher Bick and Felix Ferchland founded stashcat in 2012 as a
      privacy-oriented messenger. The product later added end-to-end encryption, file
      storage, video communication, and broader collaboration features for
      organizational use.
    - >
      The company became part of the secunet Security Networks group after secunet
      agreed to acquire it in 2021.
  related-projects:
    - stashcat is part of the secunet Security Networks group.
    - >
      The company positions the service as a secure organizational alternative to
      consumer messengers and general collaboration or file-sharing platforms.
  sources:
    - 'Official acquisition announcement: https://stashcat.com/en/blog/stories/secunet-stashcat'
    - >
      Official company-history article:
      https://stashcat.com/en/blog/stories/interoperable-but-secure-the-stashcat-way
    - 'Official product website: https://stashcat.com/en'
    - 'Official support and manual page: https://stashcat.com/en/download-support'
  summary:
    - >
      stashcat is an encrypted messaging and collaboration platform designed for
      companies, public authorities, and other organizations.
  timeline:
    - '2012: Christopher Bick and Felix Ferchland founded stashcat.'
    - '2015–2016: End-to-end encryption became a central product capability.'
    - '2021: secunet agreed to acquire stashcat GmbH.'
    - '2022: stashcat was operating as part of the secunet group.'
  usage:
    - >
      Organizations deploy stashcat in the cloud or on premises for chat, channels, file
      exchange, voice and video communication, surveys, calendars, and other modular
      workflows. Users register through their organization and sign in with account and
      encryption credentials.
