history:
  adoption-history:
    - >
      Sygyt positioned Overtone Analyzer as an accessible entry-level edition for
      singers, instrumentalists, teachers, and other users who need musical rather than
      purely physical interpretations of spectrum data. Beginning with version 5.0, it
      shared its code and interface with VoceVista Video while retaining a distinct
      feature tier.
  package-nerd-significance:
    - >
      The package is notable as specialist cross-platform audio-analysis software
      exposed through a macOS cask. Its merger with VoceVista illustrates how separately
      developed scientific and musical desktop tools can converge on a shared codebase
      while remaining separate editions.
  project-history:
    - >
      Overtone Analyzer 4 was created by Bodo Maass and Wolfgang Saus. It was originally
      separate from Don Miller and Richard Horne's VoceVista 3.3. Sygyt merged the
      product lines in 2017; Overtone Analyzer 5 and VoceVista Video 5 became editions
      of the same software with different feature sets.
  related-projects:
    - >
      VoceVista Video and VoceVista Video Pro share the same code and user interface.
      The higher editions add features such as frequency filters, comparative analysis,
      precision measurements, vibrato analysis, and electroglottograph support.
  sources:
    - https://www.sygyt.com/en/documentation/
    - https://www.sygyt.com/en/download-old/
    - https://www.sygyt.com/en/products/
    - https://www.sygyt.com/en/support/frequently-asked-questions/
  summary:
    - >
      Overtone Analyzer is Sygyt Software's entry-level application for recording sound
      and visualizing pitch, spectra, spectrograms, and harmonic overtones in real time.
  timeline:
    - '2017: Overtone Analyzer and VoceVista Video were merged onto a shared codebase.'
    - '2020–2025: Sygyt published successive 5.x releases for macOS and Windows.'
  usage:
    - >
      Users record voices or instruments, inspect fundamental pitch and overtone
      strength, edit recordings, arrange overtone sliders, and generate reference
      sounds. Common audiences include singers, voice teachers, therapists, musicians,
      instrument makers, and music educators.
