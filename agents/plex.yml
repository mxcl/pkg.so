history:
  adoption-history:
    - >
      Plex expanded from a desktop home-theater system into a server-and-client
      ecosystem spanning browsers, computers, mobile devices, televisions, streaming
      boxes, game consoles, and NAS hardware.
    - >
      The desktop application packages the Plex web-style interface with stronger local
      playback capabilities and offline downloads. It is commonly paired with a
      separately installed Plex Media Server, though it can also access Plex-provided
      streaming content.
  package-nerd-significance:
    - >
      Plex helped popularize the home-media-server pattern in which a continuously
      running server catalogs local files, enriches them with metadata, and transcodes
      them for heterogeneous clients.
    - >
      For package users, the important distinction is between this Plex desktop player
      cask and Plex Media Server. The client is a playback and download application;
      installing it does not itself replace the server used to manage a personal
      library.
  project-history:
    - >
      An official Plex post introduced the standalone Plex Media Server in November
      2008, describing access to iTunes and iPhoto media locally or across a network.
    - >
      The architecture matured into a broad ecosystem built around Plex Media Server,
      Plex accounts, web and native player applications, metadata-enriched libraries,
      remote streaming, sharing, downloads, and optional subscription features.
  related-projects:
    - Plex Media Server
    - Plex Web App
    - Plex Pass
    - Plex HTPC
  sources:
    - >
      Official 2008 Plex Media Server announcement:
      https://www.plex.tv/blog/plexseven-introducing-the-all-new-plex-media-server/
    - 'Official Plex overview: https://support.plex.tv/articles/200288286-what-is-plex/'
    - 'Official desktop downloads guide: https://support.plex.tv/articles/downloads-on-desktop/'
    - >
      Official desktop-app introduction:
      https://support.plex.tv/articles/windows-and-macos-intro-installation/
  summary:
    - >
      Plex is a desktop media player for accessing personal Plex Media Server libraries,
      Plex-hosted media, and downloaded offline content.
  timeline:
    - >
      2008: Plex introduced its standalone Plex Media Server for local and networked
      media access.
    - >
      Later development: Plex expanded into a multi-platform server-and-player ecosystem
      for personal and hosted media.
    - >
      Current desktop generation: Standalone Windows, macOS, and Linux apps combine the
      web-style interface with robust playback and offline downloads.
  usage:
    - >
      Users sign in to a Plex account and connect the desktop application to one or more
      Plex Media Servers, or use Plex-provided streaming sources.
    - >
      For personal media, Plex Media Server scans and organizes movie, television,
      music, photo, and home-video libraries; the desktop client browses and plays that
      catalog and can request server-side transcoding when needed.
    - >
      Supported desktop workflows include playback configuration, hardware decoding,
      audio-device selection, keyboard and media-key control, and Plex Pass-based
      offline downloads.
