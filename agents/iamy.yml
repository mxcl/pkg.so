history:
  adoption-history:
    - >
      IAMy remained a niche AWS operations tool rather than a broad cloud framework.
      Homebrew and Nix packaging made it easy for Unix-oriented infrastructure teams to
      install, and the GitHub repository accumulated a modest community of users around
      the YAML export/import workflow.
  package-nerd-significance:
    - >
      For package collectors, IAMy is a compact example of the
      pre-CloudFormation/Terraform tooling layer around AWS IAM: small Go binaries, YAML
      state, Homebrew distribution, and explicit links to neighboring tools such as
      iamer, Terraform, the AWS CLI, and aws-vault.
  project-history:
    - >
      The project grew out of the infrastructure-as-code practice of keeping IAM state
      in a reviewable repository. Its README describes the two-command model: `pull`
      syncs IAM resources into YAML and `push` turns YAML changes into an execution plan
      of AWS CLI commands.
  related-projects:
    - >
      The README names percolate/iamer and Terraform as inspiration or adjacent tools,
      and it points users to AWS CLI environment variables and 99designs/aws-vault for
      credential handling.
  sources:
    - https://formulae.brew.sh/formula/iamy
    - https://github.com/99designs/iamy
    - https://github.com/99designs/iamy/releases
  summary:
    - >
      IAMy is a Go command-line tool from 99designs for dumping AWS IAM users, groups,
      roles, and policies into YAML files and pushing YAML-backed IAM changes back
      through AWS CLI commands.
  timeline:
    - 'v1.0.0: The repository tagged a 1.0 line after early file-layout work.'
    - >
      v2.0.0: The release notes describe a layout-changing release that added S3 bucket
      ACL management and normalized AWS policy documents.
    - >
      v2.1.0: The release notes added a dry-run flag, policy and role descriptions, and
      cleanup for excess policy versions.
    - >
      2021: v2.4.0 added slower but more accurate CloudFormation filtering and fixed IAM
      role/instance-profile deletion ordering.
  usage:
    - >
      Operators use IAMy when they want AWS IAM represented as ordinary files that can
      be reviewed in pull requests. The tool deliberately prints AWS CLI commands for
      `push`, which makes destructive or privilege-changing operations visible before
      execution.
related-packages:
  - id: brew:awscli
    reason: >
      IAMy invokes AWS CLI commands to read and apply IAM changes, so the AWS CLI is its
      documented execution companion.
    rel: adjacent_workflow
    sources:
      - https://github.com/99designs/iamy
      - https://aws.amazon.com/cli/
  - id: brew:aws-vault
    reason: >
      IAMy's README recommends AWS Vault as a complementary way to supply and manage the
      AWS credentials used by its AWS CLI workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/99designs/iamy
      - https://github.com/ByteNess/aws-vault
