history:
  adoption-history:
    - >
      Website Watchman remains a specialized macOS utility rather than a general
      monitoring service. PeacockMedia distributes it directly with a trial and
      perpetual license, and the application performs scans locally so users retain
      their own archive data.
  package-nerd-significance:
    - >
      Website Watchman combines a scheduled web crawler, change detector, and versioned
      local archive in a native desktop package. Its locally managed proprietary archive
      and reuse of PeacockMedia's Integrity crawling engine distinguish it from hosted
      URL-monitoring services.
  project-history:
    - >
      PeacockMedia developed the application initially as Watchman. Beta releases
      appeared in late 2018, version 1.0 left beta in January 2019, and the commercial
      release followed in March 2019. The product was renamed Website Watchman to avoid
      a name collision and better describe its purpose.
  related-projects:
    - PeacockMedia Integrity
    - PeacockMedia Scrutiny
    - PeacockMedia WebArch
    - PeacockMedia WebScraper
  sources:
    - 'Official launch announcement: https://blog.peacockmedia.software/2019/03/'
    - 'Official manual: https://peacockmedia.software/mac/watchman/manual.html'
    - 'Official product page and version history: https://peacockmedia.software/mac/watchman/'
  summary:
    - >
      Website Watchman is a macOS application that monitors and archives a page, part of
      a site, or an entire website and alerts users to detected changes.
  timeline:
    - '2018: Public beta releases appeared under the name Watchman.'
    - '2019: Version 1.0 left beta.'
    - '2019: The commercial release launched and the product was renamed Website Watchman.'
    - '2020: Scheduled scans gained queuing, and rendered JavaScript pages could be archived.'
    - '2021: Change history moved to its own Application Support location.'
    - '2023: Users gained a preference for moving potentially large archives to another drive.'
  usage:
    - >
      Users configure one or more pages or sites, choose crawl boundaries, filters,
      schedules, and alert conditions, then allow the application to record changed
      pages and resources. Historical versions can be compared or exported as images,
      individual page files, or date-specific website snapshots.
