history:
  adoption-history:
    - >
      Witsy is distributed as a desktop application for macOS, Windows, and Linux, with
      a Homebrew cask for macOS. Its official repository has developed an active release
      stream and documentation wiki around multi-provider AI and MCP workflows.
  package-nerd-significance:
    - >
      Witsy represents the BYOK desktop-AI packaging model: one local client can connect
      to numerous commercial or local model providers while keeping provider choice and
      API credentials under user control. Its universal MCP-client role also places an
      emerging agent-tool protocol in a conventional desktop package.
  project-history:
    - >
      Witsy developed as an open-source, bring-your-own-keys desktop AI assistant. Its
      scope expanded beyond chat to document retrieval, transcription, image and video
      generation, reusable commands, local automation, an HTTP API, a CLI, and MCP
      server integration.
  related-projects:
    - >
      Witsy can use local runtimes such as Ollama and LM Studio, cloud model providers
      including OpenAI and Anthropic, and MCP servers that expose tools to supported
      models.
  sources:
    - 'Official README: https://github.com/Kochava-Studios/witsy#readme'
    - 'Official releases: https://github.com/Kochava-Studios/witsy/releases'
    - 'Official wiki: https://github.com/Kochava-Studios/witsy/wiki'
  summary:
    - >
      Witsy is an open-source cross-platform desktop AI assistant and universal MCP
      client built around user-supplied model-provider credentials or local models.
  timeline:
    - '2025: The official wiki documents local data locations and emerging agent workflows.'
    - >
      2026: The official release series reaches the 3.x line with packages for macOS,
      Windows, and Linux.
  usage:
    - >
      Users add API keys for chosen providers or configure local models, then use chat,
      Prompt Anywhere, AI commands, document RAG, dictation, media generation, MCP
      tools, the local HTTP API, or the bundled CLI.
