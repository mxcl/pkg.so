history:
  adoption-history:
    - >
      jcal appears in Homebrew, Debian, Ubuntu, Fedora, and Nix package metadata, which
      points to a narrow but real adoption pattern: systems that need a terminal Jalali
      calendar tool package it alongside other locale and date utilities.
  package-nerd-significance:
    - >
      jcal matters less as a large upstream and more as a representative Unix
      localization package: a tiny command-line utility that keeps a non-Gregorian
      calendar workflow available through standard package managers.
  project-history:
    - >
      The project is hosted on GNU Savannah/Nongnu and publishes documentation through
      nongnu.org. Its shape follows the traditional Unix model: separate small commands,
      manual pages, and source distribution from a free-software project host rather
      than a large application framework.
  related-projects:
    - >
      Related concepts include the Jalali/Persian calendar, Unix cal-style tools, date
      conversion utilities, GNU Savannah hosting, and distribution localization
      packages.
  sources:
    - https://formulae.brew.sh/formula/jcal
    - https://savannah.nongnu.org/projects/jcal
    - https://www.nongnu.org/jcal
    - https://www.nongnu.org/jcal/jcal.html
    - https://www.nongnu.org/jcal/jdate.html
  summary:
    - >
      jcal is a small Unix-style calendar package for the Jalali, or Persian, calendar.
      The package exposes jcal and jdate executables and is curated as a cal-like date
      conversion and calendar-display tool.
  timeline:
    - >
      2000s: The project was hosted on Savannah/Nongnu and documented through nongnu.org
      manual pages.
    - >
      Package metadata: Homebrew, Debian, Ubuntu, Fedora, and Nix package names preserve
      the jcal command-line tool for Jalali calendar workflows.
  usage:
    - >
      Users run jcal for Jalali calendar display and jdate for date conversion or
      Jalali-aware date output. The official documentation set includes separate jcal
      and jdate manual pages.
related-packages: []
