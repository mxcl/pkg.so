credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README documents packaging in Arch Linux, Fedora, Debian/Ubuntu, and
      Flatpak, plus stable and experimental downloads. It also says the project is the
      result of contributions from over 1000 volunteers, making it unusually large for a
      traditional roguelike packaged by Unix distributions.
  package-nerd-significance:
    - >
      CDDA is significant because it is both a game and a living data platform: huge
      JSON content, mods, experimental builds, curses and tiles packaging, and a
      long-lived open-source community all meet in one package. It is a stress test for
      game packaging because content, saves, mods, fonts, and releases all matter.
  project-history:
    - >
      The official development-process documentation describes CDDA as a fork of Whales'
      Cataclysm, started by Kevin Granade, TheDarklingWolf, and GlyphGryph to make a
      grittier, more realistic zombie-apocalypse game from the same general concept. The
      same document credits the project's survival since 2013 to consistent project
      direction.
  related-projects:
    - >
      Related projects include Whales' original Cataclysm, the Cataclysm-DDA launcher,
      the official docs site, and distribution-specific curses/tiles packages.
  sources:
    - https://api.github.com/repos/CleverRaven/Cataclysm-DDA
    - https://github.com/CleverRaven/Cataclysm-DDA
    - https://docs.cataclysmdda.org/
    - https://docs.cataclysmdda.org/JSON/OPTIONS.html
    - https://docs.cataclysmdda.org/user-guides/FONT_OPTIONS.html
    - https://github.com/CleverRaven/Cataclysm-DDA#readme
    - https://formulae.brew.sh/api/formula/cataclysm.json
    - https://docs.cataclysmdda.org/development_process.html
  summary:
    - >
      Cataclysm: Dark Days Ahead is a turn-based survival roguelike set in a
      post-apocalyptic world. The official docs and README emphasize a persistent,
      procedurally generated world, scavenging, monsters, vehicles, and survival
      systems.
  timeline:
    - >
      2013: Official docs identify 2013 as the start of CDDA's steady post-fork
      development era.
    - >
      2018-2020: Official history notes that some inherited original-Cataclysm material
      changed during this period.
    - '2026: The README describes the game as the work of over 1000 volunteers.'
  usage:
    - >
      Homebrew's formula installs the terminal-oriented cataclysm executable. Players
      configure persistent game options in config/options.json and fonts in
      config/fonts.json, while world-specific options live under
      save/world/worldoptions.json.
