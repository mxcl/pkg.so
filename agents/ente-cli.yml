history:
  adoption-history:
    - >
      Package-manager adoption is modest but real: Homebrew ships the `ente-cli`
      formula, and the input package facts also list Nix and Winget package names.
      Homebrew's formula analytics showed hundreds of annual installs when checked for
      this enrichment run, which fits a companion utility for an existing hosted service
      rather than a broad Unix staple.
  package-nerd-significance:
    - >
      For package maintainers, ente-cli is interesting as a small CLI carved out of a
      much larger encrypted-app monorepo. It brings a hosted consumer app workflow into
      the normal package-manager world: static binaries, Homebrew/Nix/Winget entries,
      and scriptable export commands.
  project-history:
    - >
      The CLI grew out of Ente's broader platform, which presents itself as a fully
      open-source, end-to-end encrypted service for photos, authenticator data, and
      related personal storage products. The monorepo README describes Ente Photos as
      the flagship product and Ente Auth as a later authenticator built from the same
      encrypted foundations.
    - >
      The CLI README documents it as a standalone Go command with prebuilt release
      binaries, source builds, and Docker usage. Its command set centers on account
      management and export workflows rather than being a general-purpose media tool.
  related-projects:
    - Ente Photos, Ente Auth, and Ente Locker are sibling products in the same monorepo.
    - >
      The CLI overlaps operationally with backup/export tools, but its encryption and
      account model are specific to Ente.
  sources:
    - https://github.com/ente-io/ente/blob/main/README.md
    - https://github.com/ente-io/ente/blob/main/cli/README.md
    - https://formulae.brew.sh/formula/ente-cli
  summary:
    - >
      ente-cli is the command-line export and decryption utility from Ente's
      open-source, end-to-end encrypted product monorepo. It is mainly useful to Ente
      Photos and Ente Auth users who want a scriptable way to add accounts, run exports,
      and decrypt authenticator exports outside the graphical apps.
  timeline:
    - '2020s: Ente publishes its client apps and server in an open-source monorepo.'
    - >
      2020s: Ente Auth is added as an end-to-end encrypted authenticator built on Ente's
      existing platform.
    - >
      2020s: The Ente CLI is documented as a standalone utility for exports, account
      management, and Auth export decryption.
  usage:
    - >
      Typical use starts with `ente account add`, optional account listing or
      export-directory changes, and then `ente export`. The CLI also has a documented
      Auth export decryption use case, making it relevant for users who need local
      backups or migration paths from encrypted Ente data.
    - >
      The tool stores local account/export state in its Ente CLI config directory and
      can be run as a static binary or in Docker, which matters for repeatable backup
      jobs and headless export automation.
