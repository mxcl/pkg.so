config-file-location:
  macos:
    - ~/Library/Application Support/Quicksilver/
    - ~/Library/Preferences/com.blacktree.Quicksilver.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Quicksilver describes itself as the original Mac launcher, having pioneered the
      launcher concept in 2003. It later became a free, open-source project maintained
      by volunteer contributors, preserving a power-user workflow that predates
      Spotlight and later launcher applications.
  package-nerd-significance:
    - >
      Quicksilver is a touchstone in macOS launcher culture: its object-action-argument
      model goes beyond merely starting applications. Its plugin architecture, learned
      abbreviations, catalog, triggers, clipboard history, and scriptable actions made
      it an influential example of keyboard-driven desktop automation.
  project-history:
    - >
      Quicksilver originated in 2003 as a Mac launcher associated with Blacktree; the
      historical `com.blacktree.Quicksilver` preference identifier remains visible in
      its configuration path. The application is now an Apache-2.0-licensed,
      community-maintained open-source project.
  related-projects:
    - >
      macOS Spotlight overlaps with Quicksilver's search and launch role, but
      Quicksilver additionally performs actions on selected objects.
    - Alfred and LaunchBar occupy the same broad macOS launcher and automation category.
    - >
      Quicksilver plugins integrate with applications, browsers, mail, calendars,
      contacts, and the macOS Keychain.
  sources:
    - 'Official FAQ: https://qsapp.com/faq'
    - 'Official homepage: https://qsapp.com/'
    - >
      Official installation and support-files documentation:
      https://qsapp.com/manual/getting-started/installation/
    - 'Official repository: https://github.com/quicksilver/Quicksilver'
  summary:
    - >
      Quicksilver is a free, open-source macOS launcher and productivity environment for
      finding objects and performing keyboard-driven actions on them.
  timeline:
    - '2003: Quicksilver pioneered its Mac launcher workflow.'
    - 'Later: Development transitioned to an open-source, volunteer-maintained project.'
    - >
      Present: The project remains actively maintained with a plugin-based architecture
      and modern macOS support.
  usage:
    - >
      Users invoke Quicksilver with a global shortcut, select an object, choose an
      action, and optionally provide a second object. Typical workflows launch
      applications, manipulate files, search bookmarks, send messages, run scripts,
      access clipboard history, and execute persistent triggers. Plugins add
      application-specific catalogs and actions.
