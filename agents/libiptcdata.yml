history:
  adoption-history:
    - >
      The project news records early desktop-adjacent adoption work: a March 2005 gThumb
      patch for JPEG comments and categories, and a March 2006 KDE kfile integration
      that let KDE applications use IPTC metadata. Later releases added Windows build
      support, internationalization improvements, Python binding fixes, and
      compatibility changes for Picasa.
  package-nerd-significance:
    - >
      The package is significant because it preserves a focused C implementation of
      legacy photo metadata handling without pulling in a full image-management
      application. For distributions, it is a tiny but useful bridge between libexif-era
      tooling and older IPTC/IIM metadata that still appears in archives and photo
      workflows.
  project-history:
    - >
      The project website describes libiptcdata as David Moore's portable C library for
      IPTC metadata, with an iptc command-line utility and Python bindings. The README
      says the implementation follows the IPTC Information Interchange Model and was
      inspired by libexif, pairing EXIF metadata support with IPTC metadata support for
      image files.
    - >
      The IPTC standards page says the Information Interchange Model was approved in
      1991, frozen in 1997, and still used mainly through IPTC fields for photo
      metadata. libiptcdata arrived in that long tail of IIM usage, with version 0.1.0
      released on March 1, 2005 and version 1.0.0 announced on March 21, 2007 after the
      API had remained stable for months.
  related-projects:
    - >
      Related projects include libexif, which inspired the code structure; IPTC IIM and
      IPTC Photo Metadata standards; gThumb and KDE kfile integrations; and metadata
      tools that read EXIF, IPTC, and XMP side by side.
  sources:
    - https://github.com/ianw/libiptcdata/tags
    - https://iptc.org/standards/iim/
    - https://libiptcdata.sourceforge.net/
    - https://raw.githubusercontent.com/ianw/libiptcdata/master/README
  summary:
    - >
      libiptcdata is a small C library and command-line utility for reading, editing,
      and saving IPTC metadata in multimedia files, especially JPEG images. It packages
      the older IPTC Information Interchange Model metadata world into a Unix-friendly
      library, CLI, and bindings.
  timeline:
    - '1991: IPTC approved version 1 of the Information Interchange Model.'
    - >
      1997: IPTC froze major IIM development, with later use centered largely on photo
      metadata fields.
    - '2005-03-01: libiptcdata 0.1.0 was released as the first project release.'
    - '2007-03-21: libiptcdata 1.0.0 was announced with Python bindings and a stable API.'
    - '2009-06-05: libiptcdata 1.0.4 added an Italian translation and packaging fixes.'
    - '2017-04-29: The GitHub mirror records the 1.0.5 version bump.'
  usage:
    - >
      Users most often encounter libiptcdata through the iptc command, photo-management
      integrations, or libraries that need to inspect or update captions, keywords,
      copyright fields, and other IPTC datasets embedded in JPEG files. The README notes
      that direct raw IPTC decoding can be used beyond JPEG when an application supplies
      the data.
related-packages:
  - id: brew:exiftool
    reason: >
      Choose ExifTool when the workflow needs one command-line tool that handles IPTC
      alongside EXIF, XMP, and many other metadata formats; libiptcdata is the narrower
      embeddable IPTC/IIM library.
    rel: alternative
    sources:
      - https://libiptcdata.sourceforge.net/
      - https://exiftool.org/
      - https://exiftool.org/TagNames/IPTC.html
