history:
  adoption-history:
    - >
      The official README says the tool is installable through package managers
      including Arch Linux AUR and conda-forge, and the supplied metadata records
      Homebrew, Debian, Nix, Pacman, and Ubuntu package names. The Cargo metadata
      documents `cargo install elfx86exts` as the direct Rust package-manager path.
  package-nerd-significance:
    - >
      elfx86exts sits at the intersection of binary analysis and packaging: maintainers
      care about which CPU features a built artifact actually requires, especially when
      distributing binaries across older x86 machines, Linux distributions, macOS
      systems, or heterogeneous build farms.
  project-history:
    - >
      The project began as an x86 ELF-oriented analyzer, but the official README now
      notes that the name is misleading because the tool supports ELF and Mach-O
      binaries and has preliminary ARM64 support as well as x86 and x86-64.
    - >
      The release branch ChangeLog records the first release in 2017, Mach-O and PE
      support in 2018, minimum Intel CPU generation reporting in 2018, Cranko-based
      release workflow changes in 2020, Capstone and object crate updates in 2021, and
      ARM64 support in 2023.
  related-projects:
    - >
      Related projects and libraries include Capstone, the Rust object crate, compiler
      toolchains, binary packaging systems, and CPU feature inspection tools.
  sources:
    - https://docs.rs/crate/elfx86exts/latest
    - https://raw.githubusercontent.com/pkgw/elfx86exts/master/Cargo.toml
    - https://raw.githubusercontent.com/pkgw/elfx86exts/master/README.md
    - https://raw.githubusercontent.com/pkgw/elfx86exts/release/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      elfx86exts is a Rust command-line tool that disassembles binaries and reports
      which instruction-set extensions they use.
  timeline:
    - '2017-09-29: Initial release.'
    - '2018-01-23: Version 0.2.0 added Mach-O and PE support.'
    - '2018-10-16: Version 0.3.0 added minimum Intel CPU generation reporting.'
    - '2021-10-18: Version 0.5.0 updated disassembly to Capstone 0.10 and object 0.27.'
    - '2023-10-12: Version 0.6.0 added preliminary ARM64 support.'
    - '2023-10-22: Version 0.6.2 fixed excessive memory consumption.'
  usage:
    - >
      The package-nerd workflow is to install the binary, point it at a compiled
      executable or library, and use its reported ISA-extension set to understand
      portability constraints, CPU-generation requirements, or unexpected compiler
      output.
