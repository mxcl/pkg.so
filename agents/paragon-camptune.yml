history:
  adoption-history:
    - >
      Paragon describes CampTune as a utility used by Mac dual-boot users for more than
      a decade. Its audience is inherently tied to Intel-based Macs running Windows
      through Boot Camp; the official requirements explicitly exclude Apple-silicon
      Macs.
    - >
      The product evolved alongside Mac storage technologies, adding support for Fusion
      Drive, System Integrity Protection, FileVault, and APFS. Paragon does not publish
      user or installation totals.
  package-nerd-significance:
    - >
      CampTune addresses a specialized systems-administration problem that once commonly
      required deleting and recreating a Boot Camp partition: changing the space
      allocation between macOS and Windows without reinstalling either operating system.
    - >
      For package users, it is a narrowly targeted proprietary disk utility whose
      usefulness depends on an Intel Mac and a supported Boot Camp layout. Because
      partition resizing can affect the system disk, compatibility requirements and
      backups matter more than they do for an ordinary desktop cask.
  project-history:
    - >
      Paragon developed CampTune for Macs configured to dual-boot macOS and Windows
      through Boot Camp. The application provides a slider or exact-size control for
      redistributing free space between the two partitions.
    - >
      The CampTune X generation was documented by 2012, and subsequent releases were
      updated for newer macOS storage and security technologies. A November 2017 update
      allowed system-disk resizing while System Integrity Protection remained enabled;
      later editions added full APFS support.
  related-projects:
    - >
      Apple Boot Camp Assistant creates and manages the underlying Windows installation
      and partition.
    - >
      Paragon's other Mac storage products include filesystem drivers and Backup and
      Recovery for Mac.
  sources:
    - >
      Official CampTune X announcement:
      https://www.paragon-software.com/export/sites/paragonsoftware.com/docs/pressroom/Camptune_X_13.2.12.pdf
    - >
      Official CampTune product document:
      https://dl.paragon-software.com/doc/Paragon_Camptune_OP.pdf
    - >
      Official CampTune product page and FAQ:
      https://www.paragon-software.com/us/home/camptune/
    - >
      Official Paragon product history page:
      https://www.paragon-software.com/paragon-camptune/
  summary:
    - >
      Paragon CampTune is a proprietary macOS disk-management utility for reallocating
      storage between macOS and Windows partitions on Intel Macs configured with Boot
      Camp.
  timeline:
    - '2012: Paragon documented the CampTune X generation for Mac.'
    - '2017: An update enabled resizing with System Integrity Protection active.'
    - >
      APFS era: CampTune added support for Apple's newer filesystem and continued
      supporting Intel-based Boot Camp Macs.
  usage:
    - >
      A user moves a partition-size slider or enters an exact size, then asks CampTune
      to resize the macOS and Windows Boot Camp partitions. The official demo limits
      resizing to 2 GB, while an activated license removes that restriction.
    - >
      The application supports Intel Macs only and should be used only with a supported
      Boot Camp configuration. Users should consult Paragon's compatibility requirements
      and protect important data before modifying disk partitions.
