history:
  adoption-history:
    - >
      Distill is distributed across desktop, browser, mobile, and cloud surfaces. Its
      official product page reports broad browser-extension adoption, while the desktop
      application remains positioned as a more capable local-monitoring client.
  package-nerd-significance:
    - >
      Distill is useful to package enthusiasts because it turns arbitrary web pages,
      feeds, PDFs, and structured documents into change signals without requiring each
      source to expose an API or feed.
  project-history:
    - >
      Distill developed into a cross-platform website-change monitoring service with
      local checks in browser extensions and desktop applications, plus hosted cloud
      checks. The desktop application is officially described as a public-beta client
      for macOS, Windows, and Linux.
  related-projects:
    - Distill browser extensions
    - Distill Web App
    - Distill mobile apps
  sources:
    - https://distill.io/apps/web-monitor/
    - https://distill.io/docs/web-monitor/change-history-and-highlighted-changes/
    - https://distill.io/docs/web-monitor/what-is-distill/
  summary:
    - >
      Distill Web Monitor is the desktop edition of Distill's website-change monitoring
      system. It periodically reads selected web content, records detected changes, and
      sends configured alerts.
  timeline:
    - >
      Public-beta era: Distill made its dedicated desktop monitor available for macOS,
      Windows, and Linux alongside its established browser, cloud, and mobile clients.
  usage:
    - >
      Users create local monitors for whole pages or selected elements, choose a
      checking schedule, and configure notification actions. Local monitors run on the
      user's device; cloud monitors continue running on Distill's servers when the
      device is off.
    - >
      Typical uses include watching product availability, prices, documents, feeds,
      uptime, and other pages whose publishers do not provide a convenient notification
      mechanism.
