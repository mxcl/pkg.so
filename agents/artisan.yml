history:
  adoption-history:
    - >
      The official project history says Artisan grew from a coffee-lover utility into
      widely used commercial roasting software over the following decade. Roaster
      manufacturers increasingly supported it, and the project expanded its hardware
      coverage and professional workflows.
    - >
      Artisan runs on Windows, macOS, Linux, and Raspberry Pi. Its cross-platform
      availability, open-source license, broad device support, and ability to exchange
      profiles with other roasting systems helped it become part of the specialty-coffee
      software ecosystem.
  package-nerd-significance:
    - >
      Artisan is a distinctive example of a long-lived, domain-specific Python and Qt
      desktop application packaged across conventional computers and Raspberry Pi. Its
      integrations span thermocouples, scales, industrial protocols, roaster
      controllers, and cloud services, making packaging and hardware compatibility
      central to its usefulness.
    - >
      Settings can be exported and loaded as files for backup or switching between
      roasters, but the official documentation does not define one universal default
      configuration-file pathname; the location is therefore left null.
  project-history:
    - >
      Computer scientists Rafael Cobo and Marko Luther started artisan scope in 2009 as
      a simple application for coffee enthusiasts to track roasts. Over time it
      developed roast profiling, analysis, device acquisition, automation,
      inventory-oriented integrations, and support for commercial roasting equipment.
    - >
      The project remains open source under the AGPLv3 and is maintained with
      contributions from developers, translators, support volunteers, and
      coffee-industry users.
  related-projects:
    - 'artisan.plus: Commercial cloud platform connected with Artisan workflows.'
    - >
      Cropster, Giesen, IKAWA, Stronghold, RoastLog, and RoastPath: Roasting systems or
      profile formats with which official material says Artisan can exchange data.
  sources:
    - 'Official documentation hub: https://artisan-scope.org/docs/'
    - 'Official project history and feature overview: https://artisan-scope.org/about/'
    - 'Official repository: https://github.com/artisan-roaster-scope/artisan'
    - 'Official setup guide: https://artisan-scope.org/docs/setup/'
  summary:
    - >
      Artisan is an open-source visual scope and control application for coffee
      roasters. It records temperature and event data, graphs roast profiles, computes
      roasting metrics, controls supported equipment, and helps users compare or
      reproduce roasts.
  timeline:
    - >
      2009: Rafael Cobo and Marko Luther started artisan scope as a simple
      roast-tracking application.
    - >
      Following decade: Artisan expanded into professional roast profiling and
      commercial-roaster workflows.
    - >
      Artisan 2 generation: Application settings moved to a new storage arrangement and
      the project advised users to export settings when upgrading.
  usage:
    - >
      A roaster connects supported probes, meters, scales, or a roasting machine;
      configures sampling and events; starts a roast; and records environmental
      temperature, bean temperature, rate of rise, milestones, and operator adjustments.
      Saved profiles can be analyzed, compared, used as backgrounds for later roasts, or
      exported to other systems.
