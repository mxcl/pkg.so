history:
  adoption-history:
    - >
      The official README documents installation from release binaries, Go source,
      Homebrew, and manual builds. The supplied package data also records packaging in
      Homebrew, MacPorts, and Nix.
  package-nerd-significance:
    - >
      fsql is notable as a small package-manager-friendly CLI that puts a relational
      query idiom over ordinary files. Its appeal is less about infrastructure scale and
      more about making ad hoc filesystem inspection scriptable.
  project-history:
    - >
      The fsql repository was created in 2017. Its README presents the tool as a
      filesystem search utility with a query language modeled on SELECT, FROM, and WHERE
      clauses rather than as a database server or indexer.
  related-projects:
    - >
      The tool sits in the same practical space as find, mdfind, and other filesystem
      search CLIs, but the official README frames it specifically around a SQL-esque
      query language.
  sources:
    - https://api.github.com/repos/kashav/fsql
    - https://github.com/kashav/fsql
    - https://raw.githubusercontent.com/kashav/fsql/master/README.md
  summary:
    - fsql is a Go command-line tool that searches a filesystem using SQL-like queries.
  timeline:
    - '2017: Public GitHub repository created.'
    - '2017: README documented binary, Go, Homebrew, and manual installation paths.'
    - '2024: Upstream repository metadata showed continued maintenance activity.'
  usage:
    - >
      fsql accepts a query on the command line or through stdin and can also run
      interactively. Queries select file attributes such as name, size, time, hash, and
      mode from one or more filesystem paths.
    - >
      The README documents SQL-like operators including equality, LIKE,
      regular-expression matching, numeric comparisons, boolean conjunctions, negation,
      and output modifiers for hashes, case, paths, sizes, and times.
related-packages:
  - id: brew:fselect
    reason: >
      Choose fselect when you need richer metadata, aggregation, archive searching, or
      structured output; choose fsql for a compact Go implementation with an interactive
      SQL-esque query mode.
    rel: alternative
    sources:
      - https://github.com/kashav/fsql#readme
      - https://fselect.rocks/
  - id: brew:findutils
    reason: >
      Choose GNU findutils for the established `find` and `xargs` expression model and
      conventional shell portability instead of an SQL-like filesystem query language.
    rel: alternative
    sources:
      - https://github.com/kashav/fsql#readme
      - https://www.gnu.org/software/findutils/manual/html_mono/find.html
