id: cask:terax
display-name: Terax
repo: null
docs:
  - https://terax.app/docs
  - https://terax.app/docs/ai/providers
  - https://terax.app/docs/reference/data
config-file-location:
  linux:
    - ~/.local/share/app.crynta.terax/terax-settings.json
  macos:
    - ~/Library/Application Support/app.crynta.terax/terax-settings.json
  windows:
    - '%APPDATA%\app.crynta.terax\terax-settings.json'
credentials-file-location:
  linux:
    - >
      Secret Service/libsecret where available; a file-based fallback may be used in
      headless environments
  macos:
    - macOS Keychain service `terax-ai`
  windows:
    - Windows Credential Manager target `terax-ai`
history:
  adoption-history:
    - >
      Terax is distributed through GitHub releases and supports macOS, Windows, and
      Linux. Its official project also supplies a Nix flake and documents community
      packaging through Arch's AUR.
    - >
      The project invites issues and pull requests and maintains public architecture,
      contribution, roadmap, and security documentation alongside the source.
  package-nerd-significance:
    - >
      Terax combines a native terminal, editor, Git interface, preview pane, and agentic
      AI in a small Tauri-based desktop package. It is notable for supporting both
      bring-your-own-key cloud providers and local model servers without requiring a
      Terax account.
    - >
      Its documented data layout, cross-platform packages, Nix support, Apache-2.0
      licensing, and absence of telemetry make it especially inspectable and
      automation-friendly for package enthusiasts.
  project-history:
    - >
      Terax emerged as an open-source, terminal-first AI-native development environment
      built with a Rust/Tauri backend and a React frontend. Its design treats the
      terminal as the center of an integrated development workspace rather than as an
      accessory to an editor.
    - >
      The project expanded the workspace around that terminal with code editing, file
      browsing, Git history and staging, web previews, language-server support,
      configurable agents, project memory, and local or cloud AI providers.
  related-projects:
    - Tauri
    - xterm.js
    - CodeMirror
    - Vercel AI SDK
    - Ollama
    - LM Studio
    - MLX
    - Git
  sources:
    - https://github.com/crynta/terax-ai
    - https://terax.app/docs
    - https://terax.app/docs/ai/providers
    - https://terax.app/docs/reference/data
  summary:
    - >
      Terax is an open-source, cross-platform, terminal-first development workspace that
      combines terminal, editing, source control, preview, and agentic AI features.
  timeline:
    - The initial public project established a lightweight Tauri and React terminal workspace.
    - >
      Subsequent development added integrated editing, source control, web preview,
      language servers, themes, local-model support, and agent orchestration.
  usage:
    - >
      Developers use Terax for terminal sessions, code editing, repository inspection,
      Git staging and commits, previewing local web applications, and AI-assisted work.
      Cloud AI uses user-supplied API keys stored in the operating-system credential
      store; local inference can use LM Studio, MLX, or Ollama.
tags:
