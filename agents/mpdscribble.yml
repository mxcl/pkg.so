id: brew:mpdscribble
display-name: mpdscribble
repo: https://github.com/MusicPlayerDaemon/mpdscribble
docs:
  - https://github.com/MusicPlayerDaemon/mpdscribble#readme
  - https://www.musicpd.org/clients/mpdscribble
config-file-location:
  unix:
    - ~/.mpdscribble/mpdscribble.conf
    - /etc/mpdscribble.conf
credentials-file-location:
  unix:
    - ~/.mpdscribble/mpdscribble.conf
    - /etc/mpdscribble.conf
history:
  project-history:
    - >
      Within the MPD ecosystem, mpdscribble fills the background-accounting niche: MPD
      remains responsible for playback, mpc and other clients control playback, and
      mpdscribble reports listening history. Its README shows the operational shape:
      build against libmpdclient, libcurl, libgcrypt, Meson, and Ninja, then configure
      account details in a per-user or system mpdscribble.conf file. With MPD 0.17 or
      later, it can also receive rating/love messages over MPD's client-to-client
      protocol before submitting the played track.
  sources:
    - https://en.wikipedia.org/wiki/Last.fm
    - https://github.com/MusicPlayerDaemon/mpdscribble
    - https://raw.githubusercontent.com/MusicPlayerDaemon/mpdscribble/master/NEWS
    - https://www.musicpd.org/clients/mpdscribble/
  summary:
    - >
      mpdscribble is the Music Player Daemon project's scrobbling client for MPD. Its
      job is to observe tracks played through MPD and submit them to a scrobbler such as
      Last.fm, the service descended from Audioscrobbler. The project page describes it
      as a C++ client with low memory and CPU use, full support for MPD's idle mode,
      support for the Last.fm 1.2 protocol including now-playing updates, and handling
      for seeking, crossfading, and repeated songs.
  usage:
    - >
      Packaged as mpdscribble across Homebrew and Linux distributions, it is one of the
      canonical MPD companion daemons rather than a general-purpose Last.fm client.
related-packages:
  - id: brew:mpdas
    reason: >
      Choose mpdas when AudioScrobbler 2.0, explicit offline caching, user switching, or
      configurable Libre.fm submission matters more than mpdscribble's MPD-project
      integration.
    rel: alternative
    sources:
      - https://www.musicpd.org/clients/mpdscribble/
      - https://github.com/hrkfdn/mpdas
  - id: brew:mpd
    reason: >
      mpdscribble observes tracks played by MPD and submits their listening information
      to the configured scrobbler.
    rel: adjacent_workflow
    sources:
      - https://www.musicpd.org/clients/mpdscribble/
      - https://mpd.readthedocs.io/en/stable/user.html
  - id: brew:mpc
    reason: >
      mpc can control the MPD session that mpdscribble monitors and can send the
      documented love message over MPD's client-to-client protocol.
    rel: adjacent_workflow
    sources:
      - https://github.com/MusicPlayerDaemon/mpdscribble
      - https://www.musicpd.org/clients/mpc/
