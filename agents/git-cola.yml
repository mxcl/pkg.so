id: brew:git-cola
display-name: git-cola
repo: https://github.com/git-cola/git-cola
docs:
  - https://git-cola.readthedocs.io/
config-file-location:
  unix:
    - ~/.gitconfig
    - .git/config
    - ~/.config/git-cola
    - ~/.config/git-cola/layouts
    - ~/.config/git-cola/language
    - ~/.config/git-cola/git-bindir
credentials-file-location: null
history:
  adoption-history:
    - >
      git-cola's adoption has been strongest through operating-system package channels.
      The official README says Linux distributions had already packaged it and documents
      installation through Debian, Ubuntu, Fedora, Gentoo, openSUSE, Slackware, FreeBSD,
      Homebrew, PyPI virtual environments, Windows installers, and source-tree
      execution.
  package-nerd-significance:
    - >
      For package catalogs, git-cola is notable because it bridges desktop application
      packaging and Git subcommand culture. It can run from a source tree, from Python
      packaging, from OS packages, or as a Git-style command, making it a useful test
      case for GUI dependencies in command-line package managers.
  project-history:
    - >
      The project is distributed by the git-cola organization and describes itself as a
      powerful Git GUI with a slick interface. Its release notes preserve a long 1.x to
      4.x line; early notes in the 1.3 series already mention Debian packaging, Windows
      and Mac OS X packaging work, saved layouts, branch review mode, and Git difftool
      integration.
  related-projects:
    - >
      git-cola relates to Git itself, Git DAG, Git difftool, QtPy, PyQt, and PySide
      through its GUI and packaging model.
  sources:
    - https://formulae.brew.sh/formula/git-cola
    - https://git-cola.readthedocs.io/
    - https://github.com/git-cola/git-cola
    - https://raw.githubusercontent.com/git-cola/git-cola/main/CHANGES.rst
    - https://raw.githubusercontent.com/git-cola/git-cola/main/README.md
    - https://raw.githubusercontent.com/git-cola/git-cola/main/docs/git-cola.rst
  summary:
    - >
      git-cola is a Python and Qt graphical interface for Git, with command-line entry
      points such as git cola and git dag. It represents the desktop-Git side of the Git
      tooling ecosystem: visual staging, commit preparation, history browsing, and
      common repository actions without leaving local Git.
  timeline:
    - >
      1.3.x: Release notes documented Debian packaging fixes, Mac OS X bundles, Windows
      installer work, and Git difftool integration.
    - >
      4.x: Release notes documented continued UI, Git DAG, packaging, and desktop
      integration work.
  usage:
    - >
      Practitioners use git-cola as a local Git GUI for staging and unstaging changes,
      editing commit messages, browsing history with git dag, diffing revisions,
      fetching, pulling, pushing, rebasing, stashing, tagging, and launching focused
      subcommands from the command line.
related-packages:
  - id: cask:sourcegit
    reason: >
      Choose SourceGit when you want another full desktop Git GUI with native
      cross-platform builds; Git Cola instead uses Python and Qt and exposes Git-style
      subcommands.
    rel: alternative
    sources:
      - https://git-cola.readthedocs.io/en/latest/git-cola.html
      - https://github.com/sourcegit-scm/sourcegit
  - id: brew:lazygit
    reason: >
      Choose lazygit when you want an interactive Git interface inside a terminal rather
      than Git Cola's Qt desktop application.
    rel: alternative
    sources:
      - https://git-cola.readthedocs.io/en/latest/git-cola.html
      - https://github.com/jesseduffield/lazygit
