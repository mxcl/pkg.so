    - https://www.freshports.org/net-p2p/mktorrent/
  summary:
    - >
      mktorrent is a focused command-line utility for producing BitTorrent metainfo
      files. The GitHub project describes it as a simple utility for creating BitTorrent
      metainfo files, while the Ubuntu man page explains its practical target: metainfo
      files used by trackers and torrent clients, created from single files or whole
      directories.
  usage:
    - >
      Its feature set maps closely to the torrent-publishing workflow. Users provide a
      target path and set announce URLs, comments, piece length, output filename,
      private-tracker mode, source strings, thread count for hashing, and web seed URLs.
      FreshPorts records the FreeBSD port in 2010 and summarizes the same niche:
      multiple trackers, private trackers, custom comments, and multithreaded hashing.
      Package coverage in Homebrew, Debian/Ubuntu, Alpine, Fedora, MacPorts, Nix, Arch,
      and SUSE suggests adoption as a small packaging-friendly CLI rather than a full
      BitTorrent client.
related-packages:
  - id: brew:transmission-cli
    reason: >
      Use mktorrent to create the .torrent metainfo, then use Transmission's
      command-line client to load and seed that torrent.
    rel: adjacent_workflow
    sources:
      - https://github.com/pobrn/mktorrent/wiki
      - https://github.com/transmission/transmission
