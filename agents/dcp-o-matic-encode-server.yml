id: cask:dcp-o-matic-encode-server
display-name: DCP-o-matic Encode Server
repo: https://github.com/cth103/dcpomatic
docs:
  - https://dcpomatic.com/manual/html
  - https://dcpomatic.com/manual/html/ch13.html
config-file-location:
  linux:
    - ~/.config/dcpomatic2/config.xml
  macos:
    - /Users/<user>/Library/Preferences/com.dcpomatic/2/config.xml
  windows:
    - C:\Users\<user>\AppData\Local\dcpomatic\config.xml
credentials-file-location:
  linux:
    - ~/.config/dcpomatic2/config.xml
  macos:
    - /Users/<user>/Library/Preferences/com.dcpomatic/2/config.xml
  windows:
    - C:\Users\<user>\AppData\Local\dcpomatic\config.xml
history:
  adoption-history:
    - >
      DCP-o-matic is used by independent film-makers, projectionists, festivals,
      subtitlers, and cinema technicians. Encode Server supports users with multiple
      computers by letting them pool encoding capacity over a local network.
  package-nerd-significance:
    - >
      Encode Server turns DCP-o-matic's computationally expensive JPEG 2000 encoding
      stage into a small distributed-computing workflow. Packaging it separately allows
      otherwise idle machines to act as workers without running the full authoring
      interface.
  project-history:
    - >
      DCP-o-matic began with its first repository commit in 2012 and expanded into a
      multi-application digital-cinema suite. Encode Server was developed to accelerate
      DCP creation by distributing frame encoding from a coordinating DCP-o-matic
      instance to other computers.
  related-projects:
    - DCP-o-matic
    - DCP-o-matic Batch Converter
    - DCP-o-matic Player
  sources:
    - https://dcpomatic.com/development
    - https://dcpomatic.com/manual/html/ch01s02.html
    - https://dcpomatic.com/manual/html/ch13.html
    - https://www.dcpomatic.com/
  summary:
    - >
      DCP-o-matic Encode Server is a network worker that accelerates Digital Cinema
      Package encoding by contributing another computer's processing capacity.
  timeline:
    - '2012: First commit to the DCP-o-matic repository.'
    - '2015: DCP-o-matic 1.83 was distributed for Windows and major Linux distributions.'
    - >
      2017: Encode Server was offered as a separate macOS application alongside
      DCP-o-matic 2.10.
  usage:
    - >
      Run Encode Server on one or more networked machines, configure the number of
      worker threads, and let the main DCP-o-matic application discover or explicitly
      address the servers. The manual documents a base port plus adjacent ports for
      encoding and server discovery.
