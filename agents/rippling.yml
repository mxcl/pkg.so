history:
  adoption-history:
    - >
      The application is deployed in organizations using Rippling's IT and
      device-management service. Its adoption is therefore tied to employer-managed
      fleets rather than independent consumer installation.
  package-nerd-significance:
    - >
      The Homebrew cask is useful to administrators who need a consistent macOS
      installer for Rippling's otherwise centrally managed endpoint agent.
  project-history:
    - >
      Rippling's device-management application is the endpoint component of Rippling IT,
      combining device inventory and management with organizational identity and
      employee data.
  related-projects:
    - Rippling IT
    - Rippling Identity and Access Management
    - Rippling Inventory Management
  sources:
