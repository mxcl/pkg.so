history:
  adoption-history:
    - >
      Noun Project began with a Kickstarter campaign in 2010 and launched in 2011 as a
      community-backed icon catalog. It grew into a large visual-asset service used for
      presentations, websites, applications, graphic design, and education.
    - >
      The macOS application brought the catalog into desktop workflows: users could
      search for an icon and drag it directly into another application. Noun Project
      later expanded beyond icons to professionally curated photography and additional
      creative tools.
  package-nerd-significance:
    - >
      The cask packages a native client for a hosted, creator-contributed asset catalog.
      It illustrates a common desktop-package pattern in which the installed application
      is a workflow bridge while search, licensing, accounts, and most content remain
      service-backed.
  project-history:
    - >
      Edward Boatman's early sketches of everyday objects inspired the idea of
      collecting a symbol for every noun. After losing his architecture job during the
      recession, he worked with Sofya Polyakov and Scott Thomas's design studio to turn
      the idea into a public visual-language project.
    - >
      The service's mission was to make high-quality symbols easier to find and visual
      communication more accessible to non-designers. It subsequently developed
      licensing and subscription offerings while supporting a global community of icon
      creators.
