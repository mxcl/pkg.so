  summary:
    - >
      Noun Project is a visual-asset platform centered on human-created icons. Its macOS
      application provides a desktop search-and-drag workflow for placing catalog icons
      into other applications.
  timeline:
    - '2010: Noun Project raised initial support through Kickstarter.'
    - '2011: The public Noun Project icon service launched.'
    - '2016: The team launched the related Lingo digital-asset-management product.'
    - '2020: Noun Project announced its curated photography collection.'
  usage:
    - >
      In the macOS app, users search for a concept, browse matching icons, and drag an
      icon into a preferred design or productivity application. Available formats,
      attribution requirements, recoloring, and royalty-free licensing depend on the
      asset and account plan.
