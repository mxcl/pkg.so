history:
  adoption-history:
    - >
      Rize launched on Product Hunt in May 2021, became profitable in 2022, and says it
      has served more than 20,000 paying customers. It expanded from individual focus
      analytics into team, agency, billing, profitability, integration, API, and
      agent-oriented workflows.
  package-nerd-significance:
    - >
      Rize represents the increasingly common category of background desktop telemetry
      tools whose useful state is primarily synchronized to a hosted service rather than
      maintained through a user-edited configuration file. Its Homebrew cask makes
      deployment of the macOS client reproducible, but tracking still depends on an
      account and operating-system permissions.
  project-history:
    - >
      Macgill Davis and Will Goto founded Rize in San Francisco in September 2020 after
      their earlier company, Humble Dot, closed. Interviews with engineers led them to
      build an automatic answer to the recurring question of where work time went. The
      company says it has remained bootstrapped and remote-first.
  related-projects:
    - >
      Rize positions itself against manual-timer products such as Toggl Track, Harvest,
      and Clockify, and against other automatic trackers such as Timely and Memtime. Its
      integrations connect tracked activity with calendars and project-management
      systems.
  sources:
    - 'Official Rize About page: https://rize.io/about'
    - 'Official Rize documentation: https://docs.rize.io/'
    - 'Official first-time setup guide: https://docs.rize.io/getting-started/first-time-setup'
    - 'source_facts.package-manager.brew-cask: "rize"'
  summary:
    - >
      Rize is a commercial automatic time-tracking application for macOS and Windows. It
      observes active-application metadata, turns activity into time entries, and
      provides focus, client, project, billing, and profitability workflows.
  timeline:
    - '2020: Macgill Davis and Will Goto founded Rize.'
    - '2021: Rize launched publicly on Product Hunt.'
    - '2022: Rize became profitable.'
    - >
      2026: Rize expanded its team, reporting, integration, API, MCP, and AI-assisted
      workflows.
  usage:
    - >
      After installing and signing in, macOS users grant Accessibility and Screen
      Recording permissions so Rize can read active application names, window titles,
      and browser URLs. Users configure a tracking schedule, review generated entries,
      correct tags, and use the accumulated data for focus analysis, timesheets,
      reports, or client billing. Rize states that it does not capture screenshots,
      keystrokes, or window contents.
