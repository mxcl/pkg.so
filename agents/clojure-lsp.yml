id: brew:clojure-lsp
display-name: clojure-lsp
repo: null
docs:
  - https://clojure-lsp.io/
  - https://clojure-lsp.io/settings
config-file-location:
  unix:
    - .lsp/config.edn
    - ~/.config/clojure-lsp/config.edn
    - $XDG_CONFIG_HOME/clojure-lsp/config.edn
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption followed the editor ecosystem rather than a single IDE. The project
      README describes clojure-lsp as the base for clients such as Emacs lsp-mode,
      VSCode Calva, vim, and other editors.
    - >
      The official installation docs document native binaries and distribution through a
      custom Homebrew tap, install script, Nix, Arch AUR, Scoop on Windows, and GitHub
      releases. The supplied input also lists brew, MacPorts, and Nix package-manager
      coverage.
    - >
      The README records Clojurists Together sponsorship in Q3 2021 and Q1 2022, a
      useful signal that the project had become shared Clojure tooling infrastructure
      rather than a one-editor plugin.
  package-nerd-significance:
    - >
      clojure-lsp matters to package-manager users because it turns a language ecosystem
      feature into a standalone, editor-neutral executable. The official installation
      page emphasizes GraalVM native binaries for Linux, macOS, and Windows, with
      Homebrew, Nix, AUR, Scoop, and GitHub release paths.
    - >
      For Clojure tooling maintainers, it is also a convergence point: the settings docs
      describe classpath scanning for deps.edn, project.clj, build.boot,
      shadow-cljs.edn, bb.edn, and squint.edn, making it a bridge across several Clojure
      project formats.
  project-history:
    - >
      The official repository was created in March 2018, and its GitHub releases include
      early release tags beginning in April 2018. The README describes the project as a
      Clojure and ClojureScript language server that takes a Cursive-like
      static-analysis approach to editor tooling.
    - >
      The project grew from editor integration into a broader tool surface: the official
      README says its goal is to bring editing tools to all editors and also expose
      functionality programmatically through a CLI and API.
  related-projects:
    - >
      Related Clojure tooling includes clj-kondo, which the settings docs say
      clojure-lsp uses for linting and analysis; editor clients such as Emacs lsp-mode,
      VSCode Calva, and vim integrations; and project tools including deps.edn,
      Leiningen, Boot, shadow-cljs, Babashka, and Squint.
  sources:
    - https://github.com/clojure-lsp/clojure-lsp#readme
    - https://clojure-lsp.io/
    - https://github.com/clojure-lsp/clojure-lsp/blob/master/docs/settings.md
    - https://github.com/clojure-lsp/clojure-lsp/blob/master/docs/installation.md
    - https://github.com/clojure-lsp/clojure-lsp/blob/master/docs/features.md
  summary:
    - >
      clojure-lsp is the Language Server Protocol implementation for Clojure and
      ClojureScript. It packages static analysis, editor navigation, refactoring,
      lint-backed diagnostics, formatting, semantic tokens, code lenses, and related
      commands behind the standard LSP interface.
  timeline:
    - '2018: GitHub repository created and early release tags published.'
    - '2021: Clojurists Together sponsored clojure-lsp during Q3.'
    - '2022: Clojurists Together sponsored clojure-lsp again during Q1.'
    - '2026: Latest checked GitHub release was 2026.05.05-12.58.26, published on 2026-05-05.'
  usage:
    - >
      Users install the clojure-lsp executable and connect it through an editor language
      client. Official settings docs describe project config in .lsp/config.edn, global
      config under ~/.config/clojure-lsp/config.edn or
      $XDG_CONFIG_HOME/clojure-lsp/config.edn, initialization options from clients, and
      classpath-provided config.
    - >
      The official feature docs cover definition and reference lookup, rename,
      completion, Java support, code actions, code lenses, formatting, signature help,
      semantic tokens, call hierarchy, test and project trees, and diagnostics.
related-packages:
  - id: brew:clojure
    reason: >
      Use the Clojure CLI alongside clojure-lsp for deps.edn projects because the
      language server invokes project tooling to build the classpath it analyzes.
    rel: adjacent_workflow
    sources:
      - https://clojure-lsp.io/settings/
      - https://clojure.org/reference/clojure_cli
  - id: brew:leiningen
    reason: >
      Use Leiningen with clojure-lsp when a project is defined by project.clj;
      clojure-lsp officially recognizes Leiningen projects when discovering their
      classpaths.
    rel: adjacent_workflow
    sources:
      - https://clojure-lsp.io/settings/
      - https://codeberg.org/leiningen/leiningen
