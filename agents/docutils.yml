id: brew:docutils
display-name: Docutils
repo: https://sourceforge.net/p/docutils/code/HEAD/tree
docs:
  - https://docutils.sourceforge.io/docs/index.html
  - https://docutils.sourceforge.io/FAQ.html
config-file-location:
  unix:
    - /etc/docutils.conf
    - ./docutils.conf
    - ~/.docutils
credentials-file-location: null
history:
  adoption-history:
    - >
      Docutils became the reference implementation for reStructuredText and a foundation
      for Python documentation tooling. The FAQ describes support for standalone files,
      PEPs, Python docstrings, and client code such as Sphinx extensions, while Homebrew
      and PyPI packaging keep the command-line tools widely available.
  package-nerd-significance:
    - >
      Docutils is package-nerd significant because it is infrastructure disguised as a
      text converter. It links Python docstring conventions, PEP publishing, Sphinx-era
      documentation, command-line document conversion, and a decades-long release
      history into one small but foundational package.
  project-history:
    - >
      The project's roots are in the Python documentation community. reStructuredText
      was designed by David Goodger as a revision and reinterpretation of StructuredText
      and Setext, with goals of readable plaintext markup, unambiguous parsing, and
      conversion into useful structured formats.
    - >
      Docutils grew out of Python Doc-SIG discussions around docstring processing.
      Goodger's history notes StructuredText's 1996 origins, his late-1999 encounter
      with it, a November 2000 first draft of a revised specification, a June 2001
      project web site and first release, and the 2002 merger of the reStructuredText
      and Docstring Processing System projects into Docutils.
  related-projects:
    - >
      Docutils is related to StructuredText, Setext, Python PEP tooling, Sphinx, and the
      wider Python documentation ecosystem. Its FAQ explicitly points to Sphinx as
      client code using reStructuredText for Python auto-documentation.
  sources:
    - https://docutils.sourceforge.io/FAQ.html
    - https://docutils.sourceforge.io/docs/ref/rst/introduction.html
    - https://docutils.sourceforge.io/docs/ref/rst/history.html
    - https://docutils.sourceforge.io/RELEASE-NOTES.html
    - https://sourceforge.net/p/docutils/code/HEAD/tree
    - https://formulae.brew.sh/api/formula/docutils.json
  summary:
    - >
      Docutils is the long-running Python documentation-processing system behind
      reStructuredText. It provides a Python library, parsers, writers, transforms, and
      front-end commands such as `rst2html`, `rst2latex`, `rst2man`, and `rst2xml`.
  timeline:
    - '1996: StructuredText first released in the Zope ecosystem.'
    - >
      1999: David Goodger discovered StructuredText while looking for Python module
      documentation tooling.
    - '2000: First reStructuredText draft posted to Python Doc-SIG.'
    - '2001: Project web site and first release rolled out.'
    - >
      2002: reStructuredText and Docstring Processing System projects merged and renamed
      Docutils.
    - '2026: Docutils 0.23 listed in release notes and packaged by Homebrew.'
  usage:
    - >
      Users run front-end tools to convert reStructuredText to HTML, LaTeX, man pages,
      ODT, XML, pseudoxml, and other formats, or call the `docutils` Python package as a
      library. Configuration can come from system, local, or user-level docutils config
      files.
related-packages:
  - id: brew:sphinx-doc
    reason: >
      Use Sphinx with Docutils when building multi-page documentation that needs
      cross-references, navigation, indexes, themes, and extensions; Sphinx officially
      documents Docutils as its reStructuredText foundation.
    rel: adjacent_workflow
    sources:
      - https://www.sphinx-doc.org/en/master/usage/restructuredtext/basics.html
      - https://www.docutils.org/
  - id: brew:pandoc
    reason: >
      Choose Pandoc when the main requirement is conversion between reStructuredText and
      a wider range of markup, word-processing, ebook, slide, and publication formats.
    rel: alternative
    sources:
      - https://pandoc.org/MANUAL.html
      - https://www.docutils.org/docs/
