history:
  adoption-history:
    - >
      The initial release supported a defined range of Elgato capture cards, including
      4K X, 4K Pro, Game Capture Neo, 4K60 Pro MK.2, HD60 S+, and HD60 X, positioning it
      as Elgato’s consolidated capture application for current hardware.
  package-nerd-significance:
    - >
      For package-manager users, Elgato Studio represents Elgato’s newer unified
      replacement-style workflow: capture, preview, firmware maintenance, and device
      configuration are delivered together as a vendor application rather than separate
      command-line components.
  project-history:
    - >
      Elgato introduced Studio as a new Windows and macOS capture application built
      around a single interface for previewing sources, recording, browsing captures,
      and configuring supported devices.
  related-projects:
    - Elgato capture cards
    - Elgato Game Capture software
    - Elgato Capture Device Utility
  sources:
    - >
      Elgato Studio 1.0 Release Notes:
      https://help.elgato.com/hc/en-us/articles/36773396230801-Elgato-Studio-1-0-Release-Notes
    - 'Elgato Studio Release Notes: https://help.elgato.com/hc/en-us/sections/36773146296465'
  summary:
    - >
      Elgato Studio is Elgato’s desktop capture and device-management application for
      supported capture cards. It combines live preview, recording, snapshots, a capture
      library, firmware updates, and device controls.
  timeline:
    - '2025-07-02: Elgato Studio 1.0 released for Windows and macOS.'
    - >
      2026-05-05: Elgato published the Studio 1.1 beta changelog, adding another
      documented development line.
  usage:
    - >
      Users connect a supported Elgato capture card, preview its input, configure video
      or audio behavior, record footage, take snapshots, and browse recent recordings
      from one interface.
