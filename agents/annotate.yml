history:
  adoption-history:
    - >
      Annotate is distributed through signed and notarized release archives and through
      Homebrew Cask. It supports both Apple Silicon and Intel Macs running macOS Sonoma
      or later.
  package-nerd-significance:
    - >
      Annotate is a compact example of a native SwiftUI utility packaged as a Homebrew
      Cask, with Sparkle-based signed automatic updates alongside conventional DMG and
      ZIP releases.
  project-history:
    - >
      Annotate was developed as an open-source macOS utility for keyboard-first,
      real-time drawing over the screen. The project expanded from basic pen and shape
      tools to text, counters, selection, fading annotations, boards, cursor
      highlighting, a floating toolbar, sounds, and configurable shortcuts.
  related-projects:
    - >
      The application uses the KeyboardShortcuts Swift package for shortcut handling and
      Sparkle for signed application updates.
  sources:
    - 'Official README: https://github.com/epilande/Annotate#readme'
    - 'Official project manifest: https://github.com/epilande/Annotate/blob/main/project.yml'
  summary:
    - >
      Annotate is a native macOS screen-annotation utility designed for presentations,
      live demonstrations, and teaching. It provides drawing tools, keyboard shortcuts,
      temporary or persistent annotations, boards, and cursor emphasis.
  timeline:
    - >
      Current distribution: Signed and notarized builds are offered as DMG or ZIP
      archives and through Homebrew Cask.
  usage:
    - >
      Launch Annotate and use its global shortcut to toggle the overlay. Keyboard
      shortcuts select pens, lines, highlighters, shapes, arrows, counters, text,
      selection, and erasing tools; fade mode removes marks automatically, while persist
      mode keeps them until cleared.
