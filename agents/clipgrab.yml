history:
  adoption-history:
    - >
      ClipGrab's official distribution covers Windows, macOS, and Linux, giving desktop
      users a graphical alternative to command-line video downloaders.
  package-nerd-significance:
    - >
      ClipGrab is notable in package-manager culture as a GPL-licensed desktop frontend
      in a field where extractors must keep pace with changing video sites. Packaging
      also brings codec, platform, and site-compatibility concerns that are less visible
      in ordinary desktop utilities.
  project-history:
    - >
      ClipGrab is a GPLv3-licensed downloader and converter for online video sites. Its
      official site distributes desktop builds and Linux source code, but does not
      publish enough reliable origin or authorship detail for a dated origin narrative.
  related-projects:
    - >
      FFmpeg is a related multimedia conversion tool; command-line downloaders such as
      yt-dlp serve an adjacent workflow.
  sources:
    - 'Official ClipGrab FAQs and support: https://clipgrab.org/support'
    - 'Official ClipGrab homepage: https://clipgrab.org/'
  summary:
    - >
      ClipGrab is a graphical downloader and converter for YouTube, Vimeo, Facebook, and
      other online video sites. It can save original media or convert downloads to
      formats including MPEG4, MP3, OGG Vorbis, OGG Theora, and WMV.
  timeline:
    - >
      The official site documents ongoing Windows, macOS, and Linux distribution, but
      does not provide a reliable dated project timeline.
  usage:
    - >
      Users supply a supported video URL, select an available quality and output format,
      and download or convert the media. The official support pages provide
      site-specific walkthroughs and lists of supported sites and formats.
