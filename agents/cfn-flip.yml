id: brew:cfn-flip
display-name: AWS CloudFormation Template Flip
repo: https://github.com/awslabs/aws-cfn-template-flip
docs:
  - https://aws-cloudformation.github.io/rain/rain_fmt.html
  - https://github.com/awslabs/aws-cfn-template-flip#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is packaged for Homebrew as `cfn-flip` and distributed as a Python
      package. Its README now deprecates CLI usage in favor of `rain fmt`, while
      explicitly saying the Python API may continue to be used.
  package-nerd-significance:
    - >
      cfn-flip is significant because it solved a very specific packaging annoyance:
      CloudFormation users wanted a reliable converter that preserved AWS
      intrinsic-function syntax instead of treating templates as generic JSON/YAML.
  project-history:
    - >
      The official README explains the name as an homage to the Unix `flip` utility and
      documents both the `cfn-flip` command and the `cfn_flip` Python package API. The
      repository metadata records the public repo creation in 2016.
  related-projects:
    - rain is the recommended replacement for CLI formatting and conversion.
    - cf2tf acknowledges cfn-flip as a parser used when converting CloudFormation templates.
  sources:
    - https://api.github.com/repos/awslabs/aws-cfn-template-flip
    - https://github.com/awslabs/aws-cfn-template-flip
    - https://aws-cloudformation.github.io/rain/rain_fmt.html
    - https://github.com/awslabs/aws-cfn-template-flip#readme
    - https://formulae.brew.sh/api/formula/cfn-flip.json
  summary:
    - >
      AWS CloudFormation Template Flip is an AWS Labs Python tool and library for
      converting CloudFormation templates between JSON and YAML while using short-form
      YAML intrinsic-function syntax where possible.
  timeline:
    - '2016: GitHub repository metadata records public repository creation.'
    - '2021: GitHub release metadata records cfn_flip 1.3.0.'
    - >
      Current README: CLI usage is deprecated in favor of `rain fmt`; package API
      remains available.
  usage:
    - >
      The documented CLI reads from stdin or files and converts JSON to YAML or YAML to
      JSON. The Python API exposes `flip`, `to_yaml`, and `to_json` for applications
      that need CloudFormation template serialization.
related-packages:
  - id: brew:cfn-format
    reason: >
      Choose cfn-format for a dedicated CloudFormation formatter that preserves YAML
      comments; unlike cfn-flip's Python API, it comes from the Go-based Rain codebase,
      though that upstream is also archived.
    rel: alternative
    sources:
      - https://github.com/awslabs/aws-cfn-template-flip#readme
      - https://aws-cloudformation.github.io/rain/rain_fmt.html
      - https://github.com/aws-cloudformation/rain
  - id: brew:cf2tf
    reason: >
      Use cf2tf after parsing or normalizing a CloudFormation template when the goal is
      migration to Terraform HCL; cf2tf explicitly documents using cfn-flip's parser in
      its conversion pipeline.
    rel: adjacent_workflow
    sources:
      - https://github.com/DontShaveTheYak/cf2tf
      - https://github.com/awslabs/aws-cfn-template-flip
