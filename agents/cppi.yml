      source_facts.repo is empty; GNU Cppi homepage points development sources to
      Savannah, and Savannah Git conventions use
      https://git.savannah.gnu.org/git/<group>.git for GNU project repositories; FSF
      directory lists the cppi Savannah repository webview.
  tags-sources:
    - >
      source_facts.description and GNU homepage describe indentation/regularization of C
      preprocessor directives.
