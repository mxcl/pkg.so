provenance:
  category-sources:
    - >
      source_facts.description says cppi indents C preprocessor directives to reflect
      nesting; official GNU page confirms that purpose.
  display-name-sources:
    - Official GNU page identifies the project as GNU Cppi.
  docs-sources:
    - >
      Official GNU Cppi homepage links online documentation; GNU Cppi manual page is the
      dedicated manual.
  history-sources:
    - https://www.gnu.org/software/cppi/
    - https://www.gnu.org/software/cppi/manual
    - https://savannah.gnu.org/projects/cppi/
    - https://ftp.gnu.org/gnu/cppi/
  repo-sources:
