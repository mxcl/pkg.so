id: brew:chart-testing
display-name: Chart Testing
repo: null
docs:
  - https://github.com/helm/chart-testing#readme
  - https://github.com/helm/chart-testing/tree/main/doc
config-file-location:
  unix:
    - ./ct.yaml
    - ~/.ct/ct.yaml
    - /etc/ct/ct.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Chart Testing spread with Helm chart repository CI. The README recommends the Quay
      Docker image because it bundles Helm, Git, yamllint, Yamale, and kubectl; it also
      documents binary releases and Homebrew installation, while the input facts list
      Homebrew, Nix, pacman, and zypper packaging.
  package-nerd-significance:
    - >
      Chart Testing is package infrastructure for packages-that-are-YAML: it gives Helm
      chart maintainers repeatable CI checks around chart metadata, dependency linting,
      schema validation, Kubernetes installation, and change detection. For chart
      repositories, it fills the role that language package ecosystems often get from
      their native test and lint commands.
  project-history:
    - >
      The Helm organization created the chart-testing repository in November 2017. Its
      README notes that v2.0.0 refactored the tool from a bash library to Go while
      keeping v1 parity, and GitHub release metadata shows v2.0.0 published in November
      2018 and the current v3.14.0 release in October 2025.
  related-projects:
    - Helm is the chart ecosystem that `ct` validates.
    - chart-releaser is a sibling Helm tool for publishing charts after testing.
    - >
      yamllint, Yamale, kubectl, Git, and Helm are documented prerequisites in the
      official README.
  sources:
    - https://github.com/helm/chart-testing
    - https://github.com/helm/chart-testing/tree/main/doc
    - https://api.github.com/repos/helm/chart-testing
    - https://api.github.com/repos/helm/chart-testing/releases
  summary:
    - >
      Chart Testing is the Helm project CLI, `ct`, for linting and testing Helm charts,
      especially in pull-request and CI workflows where changed charts need to be
      detected and validated.
  timeline:
    - '2017-11: Helm chart-testing repository created.'
    - '2018-11: v2.0.0 released after the refactor from bash library to Go.'
    - '2025-10: Latest upstream GitHub release metadata lists v3.14.0.'
  usage:
    - >
      `ct` is used to list changed charts, lint charts, install charts, and run combined
      lint-and-install checks. Configuration is supplied by CLI flags, `CT_` environment
      variables, or config files, and default config lookup includes the current
      directory, `$HOME/.ct`, and `/etc/ct`.
related-packages:
  - id: brew:helm
    reason: >
      Chart Testing invokes Helm-oriented linting and installation workflows, so Helm is
      the core companion for authoring and operating the charts under test.
    rel: adjacent_workflow
    sources:
      - https://github.com/helm/chart-testing#readme
      - https://helm.sh/docs/topics/chart_tests/
  - id: brew:chart-releaser
    reason: >
      After Chart Testing validates changed charts, Chart Releaser can package them,
      attach them to GitHub Releases, and update the repository index.
    rel: adjacent_workflow
    sources:
      - https://github.com/helm/chart-testing
      - https://github.com/helm/chart-releaser
