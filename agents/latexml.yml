history:
  adoption-history:
    - >
      LaTeXML found adoption where TeX is the authoring language but HTML, XML,
      accessibility, or machine-readable math is the delivery target. The project's own
      history emphasizes DLMF, mathematical publishing, authoring tools, and corpus
      conversion rather than a generic LaTeX-to-PDF workflow.
    - >
      Package-manager adoption reflects that niche but durable role: Homebrew, Debian,
      Ubuntu, Fedora, MacPorts, and openSUSE package it as a command-line conversion
      suite, exposing tools such as latexml, latexmlpost, latexmlmath, and latexmlc.
  package-nerd-significance:
    - >
      LaTeXML matters to package nerds because it sits at the intersection of TeX
      packaging, Perl dependencies, XML vocabularies, MathML, and reproducible document
      conversion. It is the sort of formula that reveals whether a package manager can
      handle a research-software stack with long-lived academic infrastructure and many
      format edges.
  project-history:
    - >
      Bruce R. Miller developed LaTeXML at NIST for the Digital Library of Mathematical
      Functions, where a large body of LaTeX-authored mathematical content needed a
      web-oriented representation. The project later moved into a public GitHub workflow
      under the brucemiller/LaTeXML repository, with Deyan Ginev also listed as an
      author in the repository metadata.
    - >
      The 2014 paper 'LaTeXML 2012 - A Year of LaTeXML' described the project as already
      established in mathematical-knowledge-management work, originally created for NIST
      DLMF and then used in publishing frameworks, authoring suites, and large TeX
      corpora. GitHub release tags show the 0.8 line continuing from at least 2015's
      v0.8.1 through the v0.8.8 release work dated 2024-02-26.
  related-projects:
    - >
      Related systems and standards include TeX, LaTeX, XML, HTML5, EPUB, JATS, TEI,
      MathML, the NIST Digital Library of Mathematical Functions, and arXiv-scale TeX
      corpus conversion efforts.
  sources:
    - https://arxiv.org/html/1404.6549v1
    - https://dlmf.nist.gov/LaTeXML
    - https://dlmf.nist.gov/LaTeXML/manual.pdf
    - https://formulae.brew.sh/formula/latexml
    - https://github.com/brucemiller/LaTeXML
    - https://github.com/brucemiller/LaTeXML/releases
  summary:
    - >
      LaTeXML is a public-domain Perl toolchain for translating TeX and LaTeX sources
      into structured XML and downstream formats such as HTML, EPUB, JATS, TEI, and
      MathML. Its package-manager identity is unusually tied to digital-math publishing
      rather than ordinary document rendering: it tries to preserve enough semantic
      structure for web presentation, search, accessibility, and corpus processing.
  timeline:
    - '2004: Public release date recorded for LaTeXML in secondary software metadata.'
    - >
      2012: The project was described as used beyond DLMF in publishing frameworks,
      authoring suites, and large-scale TeX corpora.
    - '2015: v0.8.1 release commit dated 2015-02-17.'
    - >
      2022: v0.8.7 release notes dated 2022-12-16 described broad usability, fidelity,
      robustness, portability, and output-quality work.
    - '2024: v0.8.8 release work dated 2024-02-26 updated the manual and release notes.'
  usage:
    - >
      Typical use is a pipeline: convert TeX-like input to LaTeXML's XML model, then
      postprocess it into web or interchange formats. The command family supports
      full-document conversion, daemon-style conversion, math fragments, postprocessing,
      and helper discovery.
