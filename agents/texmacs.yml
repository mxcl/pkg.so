config-file-location:
  unix:
    - ~/.TeXmacs
credentials-file-location: null
history:
  adoption-history:
    - >
      TeXmacs established a long-running niche among mathematicians, scientists,
      educators, and free-software users who want visual structured editing,
      publication-quality mathematics, and interactive sessions with scientific software
      in one application.
  package-nerd-significance:
    - >
      Despite its name and inspiration, TeXmacs is neither a TeX front end nor an Emacs
      derivative. It has its own structured document format, typesetting engine,
      Scheme-based extension system, styles and packages, and plugin interfaces. This
      makes it a distinctive alternative to both TeX source workflows and conventional
      word processors.
  project-history:
    - >
      Joris van der Hoeven designed and wrote TeXmacs beginning in 1998. Inspired by
      TeX's typography and GNU Emacs's extensibility, it developed into a GNU scientific
      editing platform for structured documents, mathematical typesetting,
      presentations, format conversion, and interfaces to computer-algebra systems.
    - >
      Later work broadened portability and the scientific-software ecosystem, including
      a Qt interface, improved macOS support, converters, plugins, and interfaces to
      computational systems.
  related-projects:
    - >
      TeX and GNU Emacs inspired the project without supplying its code. TeXmacs plugins
      and sessions connect it with computer-algebra and scientific systems, while
      tm-forge hosts user-contributed TeXmacs material.
  sources:
    - https://www.texmacs.org/tmdoc/main/faq/faq.en.html
    - https://www.texmacs.org/tmweb/about/about.en.html
    - https://www.texmacs.org/tmweb/manual/webman-about.en.html
    - https://www.texmacs.org/tmweb/manual/webman-plugins.en.html
  summary:
    - >
      GNU TeXmacs is a free structured WYSIWYG editor for scientific documents,
      mathematical typesetting, presentations, and interactive scientific-computing
      sessions.
  timeline:
    - '1998: TeXmacs development and its official manual record began.'
    - >
      2001: Early publications documented TeXmacs as a free structured technical editor
      and as an interface to computer-algebra systems.
    - >
      Later development: The project expanded its Qt interface, platform support,
      converters, plugins, and scientific-software integrations.
  usage:
    - >
      Users create articles, books, presentations, and mathematics-heavy notes; define
      styles and macros; export to formats including PDF, HTML, and LaTeX; and embed
      interactive sessions backed by supported scientific programs.
