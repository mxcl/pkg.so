config-file-location:
  macos:
    - ~/Library/Preferences/com.snoize.MIDIMonitor.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Snoize has maintained MIDI Monitor across more than two decades of Mac hardware
      and operating-system transitions. Releases added Universal PowerPC and Intel
      support, 64-bit support, modern macOS document behavior, Dark Mode, Apple Silicon
      support, and a Swift rewrite.
    - >
      Its enduring audience includes musicians troubleshooting equipment and software,
      plus developers testing MIDI drivers and applications. The application remains
      free to use, and its source has been available under a BSD license since 2004.
  package-nerd-significance:
    - >
      MIDI Monitor is a durable example of a focused diagnostic utility that complements
      digital audio workstations and command-line tools. It exposes CoreMIDI traffic
      directly, including traffic sent by other applications, making it useful when
      validating controllers, interfaces, virtual ports, drivers, and routing after
      software or system changes.
    - >
      Its repository is also notable because it contains MIDI Monitor, SysEx Librarian,
      the reusable SnoizeMIDI framework, and SnoizeMIDISpy's CoreMIDI monitoring driver.
  project-history:
    - >
      MIDI Monitor is a macOS MIDI diagnostic application by Kurt Revis under the Snoize
      name. It displays MIDI messages entering and leaving the Mac, with selectable
      sources, message filters, detailed hexadecimal data, document saving, and an
      optional driver for observing output sent to MIDI destinations.
    - >
      MIDI Monitor became open source in September 2004 after dependencies on the Omni
      frameworks were removed. The project continued through Intel and 64-bit
      migrations, modern macOS security changes, Apple Silicon support, and a
      substantial Swift rewrite in 2021.
  related-projects:
    - >
      The same official repository contains SysEx Librarian. Shared components include
      SnoizeMIDI for CoreMIDI processing and SnoizeMIDISpy for observing MIDI sent to
      destinations.
  sources:
    - https://github.com/krevis/MIDIApps
    - https://www.snoize.com/MIDIMonitor/
    - https://www.snoize.com/MIDIMonitor/docs
  summary:
    - >
      MIDI Monitor is a free, open-source macOS application for inspecting, filtering,
      saving, and troubleshooting MIDI traffic.
  timeline:
    - '2004: MIDI Monitor became open source.'
    - '2006: Version 1.1.8 became a Universal application for Intel and PowerPC Macs.'
    - >
      2012: Version 1.3 added expert mode, automatic updates, and combined 32-bit and
      64-bit support.
    - '2018: Version 1.4 added macOS Mojave and Dark Mode support.'
    - '2020: Version 1.4.1 added macOS Big Sur and Apple Silicon support.'
    - >
      2021: Version 1.5 rewrote the application in Swift and adopted disk-image
      distribution for modern macOS security.
    - '2023: Version 1.5.4 fixed a crash under heavy monitored MIDI traffic.'
  usage:
    - >
      Users open a document, select physical or virtual MIDI sources, choose message and
      channel filters, and inspect events in arrival order. The application can act as a
      MIDI destination, observe output sent by other applications, show raw event data,
      save captured events, and export System Exclusive data.
