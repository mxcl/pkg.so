id: brew:mpage
display-name: mpage
repo: null
docs:
  - https://mesa.nl/pub/mpage/README
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      mpage belongs to the classic Unix print-filter toolchain: it is useful in scripts
      and pipelines where a print dialog's n-up option is not available or where
      PostScript output must be transformed before printing.
  package-nerd-significance:
    - >
      Package nerds care about mpage because it preserves a small, scriptable
      PostScript-era workflow: text in, compact printable output out, with no desktop
      printing stack required.
  project-history:
    - >
      The official source README credits Mark P. Hahn for the original 1988 copyright
      and Marcel J. E. Mol for 1994-2004 maintenance. The MESA-hosted directory
      distributes release tarballs including 2.5.5, 2.5.7, and 2.5.8, plus short release
      metadata files.
  sources:
    - https://mesa.nl/pub/mpage/
    - https://mesa.nl/pub/mpage/README
    - https://mesa.nl/pub/mpage/mpage-2.5.7.tgz
    - source_facts.description
    - source_facts.homepage
  summary:
    - >
      mpage is a command-line printing utility that reduces and prints multiple pages of
      text on one physical sheet for PostScript-compatible printers, with limited
      support for doing the same to PostScript input files.
  timeline:
    - '1988: Original copyright credited to Mark P. Hahn.'
    - >
      1994: Marcel J. E. Mol maintenance period begins, according to the official README
      copyright notice.
    - '2017: MESA directory publishes mpage 2.5.7.'
    - '2023: MESA directory publishes mpage 2.5.8.'
  usage:
    - >
      The official README says a basic build is usually just make, while noting that
      maintainers may adjust Makefile defaults such as PAGESIZE. Example uses include
      printing source files, 8-up output, and piping formatted man-page output through
      mpage.
related-packages:
  - id: brew:psutils
    reason: >
      Choose PSUtils when you need n-up output plus page selection, rearrangement,
      booklet signatures, resizing, flipping, or rotation for PDF and PostScript
      documents.
    rel: alternative
    sources:
      - https://mesa.nl/pub/mpage/README
      - https://github.com/rrthomas/psutils#readme
