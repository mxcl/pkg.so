  summary:
    - >
      Loom is a cloud-connected asynchronous video communication platform whose desktop
      application records a screen, camera, and microphone and publishes the result for
      sharing and collaboration.
  timeline:
    - '2015: The product began as OpenVid.'
    - '2016: Loom launched publicly in June and began gaining workplace adoption.'
    - '2017–2018: The company rebranded from OpenTest to Loom.'
    - '2019: Loom raised its Series A and expanded beyond one million users.'
    - '2020: Loom launched a redesigned product and reached 100 employees.'
    - '2023: Loom redesigned its desktop recorder and announced its acquisition by Atlassian.'
    - '2023: Atlassian completed the Loom acquisition on November 30.'
  usage:
    - >
      Use the desktop menu-bar or system-tray application to capture a full screen,
      window, custom area, or camera. Users select camera and microphone sources, adjust
      recording settings, record, and then share or organize the uploaded video in a
      Loom workspace.
    - >
      A Loom or Atlassian account is normally used for the hosted library and
      collaboration features, but official documentation does not identify a credentials
      file.
