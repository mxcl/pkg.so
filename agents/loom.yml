history:
  adoption-history:
    - >
      Loom found adoption as distributed teams sought a quicker alternative to meetings
      and lengthy written explanations. Official company accounts report that Atlassian
      began using Loom within days of its June 2016 launch and later became the first
      company to buy a license for every employee.
    - >
      By October 2023, Loom reported more than 25 million registered users, about 1.5
      billion recorded minutes, and over 200,000 paying customers. Atlassian announced
      its agreement to acquire Loom that month and completed the acquisition on November
      30, 2023.
  package-nerd-significance:
    - >
      The desktop package makes screen, camera, microphone, and system-audio capture
      available outside the browser extension. It is representative of cloud-connected
      desktop casks whose local recorder is tightly coupled to a hosted collaboration
      and video library service.
    - >
      Loom helped establish short, instantly shareable screen recordings as a standard
      asynchronous-development and support workflow, including bug reports, design
      walkthroughs, code reviews, onboarding, and status updates.
  project-history:
    - >
      The product originated as OpenVid in 2015 and launched publicly in June 2016. It
      was subsequently known as OpenTest before adopting the Loom name.
    - >
      Loom evolved from an individual recording utility into a video communication and
      workspace platform, adding shared libraries, collaboration features,
      transcription, AI assistance, and integrations. A redesigned macOS desktop
      recorder was released in 2023, with Windows support following.
    - >
      Atlassian acquired Loom in November 2023 while continuing to offer it as a
      standalone product and integrating it with Atlassian workflows.
