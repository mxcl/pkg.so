history:
  adoption-history:
    - >
      Limine's adoption is strongest in hobby operating-system development, custom
      kernels, and boot-media workflows. Its packaging in Homebrew and several
      Linux-oriented package sets makes it easier to install the host-side limine tool
      without vendoring a bootloader tree into every OS project.
  package-nerd-significance:
    - >
      Limine matters to package nerds because it packages a low-level boot artifact with
      a normal userland CLI. That makes an unusually hardware-adjacent workflow
      reproducible through ordinary package managers, while still carrying protocol
      documentation, binary releases, and strict configuration-file semantics.
  project-history:
    - >
      Limine developed as a portable bootloader that supports BIOS and UEFI-style use
      cases across multiple architectures. Its README describes support for IA-32,
      x86-64, aarch64, riscv64, and loongarch64, plus boot protocols including Linux,
      Limine, Multiboot 1, Multiboot 2, and chainloading.
    - >
      The project is closely tied to its own boot protocol: Limine is both a boot
      manager for users and the reference implementation for OS developers targeting
      that protocol. The repository also documents configuration and protocol details in
      standalone files, which is typical for bootloader projects where the file format
      and ABI are as important as the executable.
  related-projects:
    - >
      Related projects and standards include the Limine boot protocol, Linux boot
      protocol support, Multiboot 1, Multiboot 2, UEFI booting, and other bootloaders
      such as GRUB and systemd-boot.
  sources:
    - https://github.com/limine-bootloader/limine
    - https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md
    - https://github.com/limine-bootloader/limine/blob/trunk/PROTOCOL.md
    - https://github.com/limine-bootloader/limine/blob/trunk/README.md
    - https://github.com/limine-bootloader/limine/issues/63
  summary:
    - >
      Limine is a bootloader, boot manager, and reference implementation of the Limine
      boot protocol. It is packaged for people building operating systems, custom boot
      media, and systems that need a modern multiprotocol loader rather than a
      general-purpose application.
  timeline:
    - '2021: Public issue traffic referenced Limine v1.0 in bootloader installation workflows.'
    - '7.x series: Limine releases began using Semantic Versioning for release naming.'
    - '2026-06-09: The GitHub repository release panel listed v12.3.3.'
  usage:
    - >
      Packaged usage generally means installing the limine host tool, placing Limine
      boot files on a target disk or image, and writing a limine.conf menu. The
      documented configuration search paths explain why the package is useful for
      repeatable image-building scripts as well as interactive boot-manager setups.
