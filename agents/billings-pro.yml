history:
  adoption-history:
    - >
      Billings gained users among freelancers and small businesses needing Mac-native
      time tracking and invoicing; an official customer history records continuous use
      beginning in 2007. Billings Pro later added synchronized multi-device and
      multi-user workflows.
    - >
      The current service supports Mac, iPhone, iPad, and Apple Watch workflows, with
      cloud synchronization and subscription-based accounts.
  package-nerd-significance:
    - >
      Billings Pro represents a long-lived class of proprietary Mac business software
      exposed through a package manager alongside open-source developer tools. The cask
      makes client installation reproducible, while business records and account state
      belong to the vendor's synchronized service rather than the package installation.
  project-history:
    - >
      Marketcircle developed the original Billings as a Mac invoicing and time-tracking
      application. It later evolved into Billings Pro, expanding from a primarily
      individual desktop workflow to cloud-synchronized, multi-device, and multi-user
      business operation.
  related-projects:
    - >
      Marketcircle also develops Daylite, a CRM and business-productivity application
      that has supported integration with Billings Pro workflows.
  sources:
    - 'Official FAQ: https://www.marketcircle.com/billingspro/faq/'
    - >
      Official account-management guide:
      https://www.marketcircle.com/billingspro/account-management/
    - >
      Official customer history:
      https://www.marketcircle.com/billingspro/stories/device-independent/
    - 'Official product page: https://www.marketcircle.com/billingspro/'
  summary:
    - >
      Billings Pro is Marketcircle's time-tracking, estimating, invoicing,
      payment-tracking, and client-account application for freelancers and small
      businesses.
  timeline:
    - >
      By 2007: Marketcircle's official customer history documents established use of the
      original Billings application.
    - >
      Later: Billings evolved into Billings Pro with cloud synchronization and
      multi-user, multi-device workflows.
    - >
      2020s: Billings Pro continued as a subscription service with native applications
      across Apple's device platforms.
  usage:
    - >
      Users track time, mileage, and expenses; prepare estimates; create recurring or
      one-off invoices; record payments and retainers; and review client, project, and
      account reports.
    - >
      A Billings Pro account synchronizes business data between authorized devices.
      Official sources do not document a standalone credentials file.
