history:
  adoption-history:
    - >
      librasterlite2 spread mainly through geospatial packaging stacks where SpatiaLite,
      GDAL-adjacent tooling, and desktop GIS utilities are packaged together. The input
      package-manager metadata lists Alpine, Homebrew, Debian, Fedora, MacPorts, Nix,
      and Ubuntu, which matches its role as infrastructure for GIS users rather than a
      standalone end-user application.
  package-nerd-significance:
    - >
      librasterlite2 is package-nerd significant because it is a specialized spatial
      database extension that turns heavyweight raster management into normal
      SQLite/SpatiaLite files. It is also a good example of a small upstream ecosystem
      using Fossil, tri-licensed libraries, and separate GPL tools.
  project-history:
    - >
      The Gaia-GIS project describes librasterlite2 as a new project intended to replace
      the older librasterlite while sharing only the same application area. It keeps
      raster coverages in a SpatiaLite DBMS and ships tools such as rl2tool and wmslite
      for administration and WMS-oriented access.
    - >
      RasterLite2 1.0.0 development was funded by Tuscany Region's territorial and
      environmental information system work, linking the package to regional GIS
      infrastructure rather than to a generic image-processing library. The project is
      maintained in a Fossil repository alongside other Gaia-GIS components.
  related-projects:
    - >
      The project is tightly related to libspatialite, spatialite_gui, SQLite,
      GDAL-style raster workflows, the superseded librasterlite project, and Gaia-SINS
      geospatial tooling.
  sources:
    - https://formulae.brew.sh/formula/librasterlite2
    - https://www.gaia-gis.it/fossil/librasterlite/index
    - https://www.gaia-gis.it/fossil/librasterlite2/index
    - https://www.gaia-gis.it/fossil/librasterlite2/timeline
    - https://www.gaia-gis.it/fossil/librasterlite2/wiki?name=planetEarth
    - https://www.gaia-gis.it/fossil/libspatialite/index
  summary:
    - >
      librasterlite2 is a Gaia-SINS geospatial library for storing and retrieving large
      raster coverages inside SpatiaLite databases.
  timeline:
    - >
      2013: The older librasterlite page marked librasterlite as obsolete and directed
      users to librasterlite2.
    - >
      2014: RasterLite2 tutorials and project artifacts documented 1.0.0
      release-candidate workflows.
    - >
      2017: The Fossil timeline records API changes for reading coverages from attached
      databases and MapView/spatialite_gui support.
    - '2018: Development resumed for the 1.1.0-beta0 cycle.'
    - '2020: The project page listed 1.1.0-beta1 released on 2020-08-24.'
    - '2023: The Fossil timeline records trusted_schema and SQLITE_INNOCUOUS support work.'
  usage:
    - >
      Users work with the package through the C library and helper programs such as
      rl2tool, rl2sniff, and wmslite. The official tutorials show RasterLite2 databases
      as full SpatiaLite database files and demonstrate raster coverage creation,
      import, pyramids, styling, and WMS access.
related-packages:
  - id: brew:spatialite-gui
    reason: >
      Use spatialite-gui to inspect and work interactively with SpatiaLite databases and
      Map views containing RasterLite2 coverages; its official Map tool is built on both
      libraries.
    rel: adjacent_workflow
