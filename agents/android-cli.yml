id: cask:android-cli
display-name: Android CLI
repo: null
docs:
  - https://developer.android.com/tools/agents/android-cli
config-file-location:
  unix:
    - ~/.androidrc
  windows:
    - '%USERPROFILE%\.androidrc'
credentials-file-location: null
history:
  adoption-history:
    - >
      Android CLI entered the Android developer-tooling ecosystem as an agent-oriented
      companion to established Android tools. Its official workflow supports
      human-operated terminals, scripts, CI and coding agents, and android init installs
      an official Android CLI skill for agents.
  package-nerd-significance:
    - >
      Android CLI is noteworthy because Google packages higher-level Android workflows
      behind one self-updating command while explicitly designing its interface for
      automation and coding agents. It complements rather than replaces the Android SDK,
      Android Studio, Gradle, and emulator tooling.
  project-history:
    - >
      Google's Android developer team introduced Android CLI as a standardized
      command-line entry point for agent-first Android development. The tool brings
      environment setup, project scaffolding, SDK and virtual-device management, testing
      journeys, and Android Studio interaction into a common command hierarchy.
  related-projects:
    - Android SDK command-line tools and Android Studio.
    - >
      The official android/skills repository, which provides the Android CLI skill and
      Android knowledge resources.
    - Gradle-based Android application projects.
  sources:
    - https://developer.android.com/tools/agents/android-cli
    - https://github.com/android/skills/tree/main/devtools/android-cli
  summary:
    - >
      Android CLI is Google's command-line interface for Android application
      development, automation, and agent-first workflows.
  timeline:
    - >
      2026: Official Android CLI documentation described the tool as an agent-first
      interface for Android development and automation.
  usage:
    - >
      Users invoke android commands to update the tool, inspect environments, create and
      run projects, manage SDK components and virtual devices, execute test journeys,
      and interact with Android Studio. The android init command installs agent
      guidance, while ~/.androidrc or %USERPROFILE%\.androidrc supplies default
      command-line flags.
tags:
