history:
  adoption-history:
    - >
      The official site reported in 2022 that JSON5 received more than 65 million npm
      downloads per week, ranked in the top 0.1 percent of depended-upon npm packages,
      and had been adopted by projects including Chromium, Next.js, Babel, Retool,
      WebStorm, and Apple platforms.
    - >
      Its wide adoption came less from command-line use than from dependency graphs:
      parsers, build tools, configuration loaders, and editors pulled JSON5 in as a
      friendlier format for files people edit by hand.
  package-nerd-significance:
    - >
      JSON5 is package-nerd significant because it became one of the few JSON-adjacent
      formats that escaped niche status. It is a reminder that tiny syntax conveniences
      in configuration files can create enormous dependency footprints once build
      systems and editors standardize around them.
  project-history:
    - >
      The JSON5 GitHub repository and npm package both date to May 2012. The official
      site describes JSON5 as `JSON for Humans`, positioning it for configuration and
      other hand-authored files rather than machine-to-machine interchange.
    - >
      In March 2018, the JSON5 specification was published as Standard JSON5 1.0.0. The
      spec frames JSON5 as a superset of JSON that expands syntax with selected
      ECMAScript 5.1 productions while keeping JSON's data model.
  related-projects:
    - >
      JSON5 sits beside JSON, YAML, TOML, HJSON, and JSONC as a configuration-oriented
      data format. Its reference implementation is also related to non-JavaScript ports
      listed by the JSON5 organization.
  sources:
    - https://formulae.brew.sh/formula/json5
    - https://github.com/json5/json5
    - https://json5.org/
    - https://registry.npmjs.org/json5
    - https://spec.json5.org/
    - https://www.npmjs.com/package/json5
  summary:
    - >
      JSON5 is both a data-format proposal and a JavaScript reference implementation for
      a more hand-editable superset of JSON. The format adds familiar ECMAScript 5.1
      syntax such as comments, trailing commas, single-quoted strings, unquoted object
      keys, and additional number forms.
  timeline:
    - '2012-05-27: The GitHub repository was created and npm recorded version 0.0.0.'
    - '2018-03: Standard JSON5 1.0.0 was published.'
    - '2021-02-01: GitHub recorded release v2.2.0.'
    - >
      2022: The official site reported more than 65 million npm downloads per week and
      major-project adoption.
    - '2022-12-31: GitHub recorded release v2.2.3.'
  usage:
    - >
      The JavaScript package exposes an API compatible with the standard JSON API,
      including `JSON5.parse()` and `JSON5.stringify()`, and the Homebrew formula
      provides the `json5` CLI. Typical usage is parsing configuration-like input that
      wants comments and trailing commas while preserving JSON-like data structures.
related-packages:
  - id: brew:hjson
    reason: >
      Choose Hjson when you want additional human-friendly syntax such as optional
      commas, quoteless strings, and multiline strings; choose JSON5 when compatibility
      with selected ECMAScript 5.1 syntax and its formal specification matters.
    rel: alternative
    sources:
      - https://json5.org/
      - https://spec.json5.org/
      - https://hjson.github.io/
