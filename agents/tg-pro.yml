history:
  adoption-history:
    - >
      TG Pro has been maintained for more than a decade across Intel and Apple Silicon
      Mac generations. Its release history tracks new Mac sensor mappings, processors,
      macOS releases, and changes in fan-control behavior.
    - >
      The product serves both individual users through its menu-bar interface and
      managed environments through documented silent licensing and preference
      deployment.
  package-nerd-significance:
    - >
      TG Pro is representative of the specialized Mac utility ecosystem in which
      low-level sensor access, privileged fan-control helpers, menu-bar presentation,
      and frequent hardware-specific updates are packaged into a desktop application.
    - >
      Its remote-deployment support and preference plist make an otherwise interactive
      hardware utility manageable by Mac administrators.
  project-history:
    - >
      Tunabelly Software developed TG Pro as a temperature-monitoring and fan-control
      utility for macOS. The vendor states that more than ten years of work have gone
      into the application.
    - >
      Development has continually followed new Mac hardware, adding detailed Intel and
      Apple Silicon temperature mappings, fan modes, alerts, diagnostics, logging, and
      support for successive processor generations.
  related-projects:
    - >
      TG Pro succeeded or absorbed upgrade paths from Tunabelly's earlier Temperature
      Gauge product.
    - A privileged TGFanHelper component performs fan-control operations.
    - Tunabelly Software also publishes other Mac utilities such as Folder Tidy and Disk Diet.
  sources:
    - https://www.tunabellysoftware.com/support/faq/
    - https://www.tunabellysoftware.com/support/remotely_deploy_tg_pro.php
    - https://www.tunabellysoftware.com/support/tgpro_tutorial/
    - https://www.tunabellysoftware.com/tgpro/
    - https://www.tunabellysoftware.com/tgpro/releasenotes/
  summary:
    - >
      TG Pro is a proprietary macOS hardware utility for monitoring temperatures and fan
      speeds, controlling cooling behavior, recording sensor data, and reporting
      diagnostic conditions.
  timeline:
    - '2010s: TG Pro begins its long-running development as a Mac temperature and fan utility.'
    - '2020: Development expands to support the first Apple Silicon Macs.'
    - >
      2023: The minimum supported system advances to macOS 10.13 as hardware and
      licensing support evolve.
    - '2023–2026: Releases add support for successive M3, M4, and M5 Mac families.'
  usage:
    - >
      TG Pro normally runs in the background and exposes temperatures, fan speeds,
      controls, and diagnostics through a menu-bar item and main window.
    - >
      Users can select system, manual, maximum, or temperature-rule-based fan behavior;
      configure local or email alerts; and log sensor and diagnostic data to CSV.
      Administrators can deploy the application, a preferences plist, its helper, and
      licensing information remotely.
