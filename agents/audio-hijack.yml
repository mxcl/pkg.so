  summary:
    - >
      Audio Hijack is Rogue Amoeba's macOS audio-capture and processing application. It
      builds reusable sessions from connected blocks that can capture applications or
      devices, process audio, record files, broadcast streams, and route output.
  timeline:
    - '2002: Original Audio Hijack released'
    - '2003-03-03: Audio Hijack Pro 1.0 released'
    - >
      2015-01-20: Audio Hijack 3 introduced the block-based interface and unified the
      product name
    - '2022-03-31: Audio Hijack 4.0 released'
  usage:
    - >
      Users create reusable sessions by connecting source, processing, recorder,
      streaming, and output blocks in an audio grid. Sessions can capture application or
      microphone audio, apply Audio Unit effects, record podcasts or calls, broadcast
      streams, and run on schedules or through JavaScript automation.
