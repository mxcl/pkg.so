history:
  adoption-history:
    - >
      Audio Hijack Pro became important to Rogue Amoeba's growth and continued to gain
      users through its ability to capture individual applications, devices, and
      internet audio. The 2015 redesign simplified complex routing through a visual
      block grid and, according to the official archive, helped the product reach a
      larger user base.
    - >
      The application is widely suited to podcast production, web-stream capture, VoIP
      recording, broadcasting, microphone processing, and other Mac audio workflows.
  package-nerd-significance:
    - >
      Audio Hijack is a longstanding specialist Mac utility and a representative example
      of software that depends on deep operating-system audio integration. Its evolution
      tracks major changes in macOS audio capture, permissions, and routing, making it
      especially interesting to Mac utility collectors and audio-tool users.
  project-history:
    - >
      Rogue Amoeba released the original Audio Hijack in 2002. Audio Hijack Pro 1.0
      followed on March 3, 2003 with MP3 recording, timers, live-application capture,
      pausing, effects patches, and plug-in support.
    - >
      In 2015, the original and Pro product lines were consolidated under the Audio
      Hijack name. Audio Hijack 3 introduced the visual, block-based audio pipeline.
      Audio Hijack 4 followed in 2022 and expanded the modern session workflow,
      automation, and streaming capabilities.
