id: brew:ddclient
display-name: ddclient
repo: null
docs:
  - https://ddclient.net/
  - https://github.com/ddclient/ddclient#readme
config-file-location:
  unix:
    - /etc/ddclient/ddclient.conf
credentials-file-location:
  unix:
    - /etc/ddclient/ddclient.conf
history:
  adoption-history:
    - >
      ddclient became a common distribution package because dynamic DNS is a recurring
      home-lab, small-server, and broadband-router need. The README explicitly
      recommends installing an operating-system package where available and lists many
      supported providers.
  package-nerd-significance:
    - >
      For package nerds, ddclient is a classic network daemon package: small,
      configurable, service-managed, and shaped by provider churn. Its changelog shows
      the maintenance burden of tracking DNS providers, protocol changes, TLS defaults,
      and distribution-friendly config migrations.
  project-history:
    - >
      The README credits Paul Burry as the original author and says the project is now
      maintained through GitHub. The GitHub repository was created in 2012, while the
      modern 4.x series moved the default configuration path into
      /etc/ddclient/ddclient.conf.
  related-projects:
    - inadyn, dnsupdate, nsupdate, systemd
  sources:
    - https://ddclient.net/
    - https://github.com/ddclient/ddclient
    - https://github.com/ddclient/ddclient#readme
    - https://github.com/ddclient/ddclient/blob/main/ChangeLog.md
    - https://github.com/ddclient/ddclient/releases/tag/v4.0.0
    - https://api.github.com/repos/ddclient/ddclient
  summary:
    - >
      ddclient is a Perl dynamic DNS update client for many DNS service providers. Its
      README says it updates dynamic DNS entries, uses curl for internet access, and
      supports Linux, macOS, and other Unix-like systems.
  timeline:
    - '2012: GitHub repository created'
    - '2025: v4.0.0 release changed the default config location to /etc/ddclient/ddclient.conf'
    - '2026: v4.0.1-rc.1 release published'
  usage:
    - >
      A typical install edits /etc/ddclient/ddclient.conf with provider credentials,
      hostnames, and IP-discovery settings, then runs ddclient as a daemon or service.
      The README includes systemd setup and troubleshooting commands such as ddclient
      --daemon=0 --debug --verbose.
related-packages:
  - id: brew:inadyn
    reason: >
      Inadyn performs the same dynamic-DNS update task with a small C daemon commonly
      used in routers and gateways, but its upstream repository was archived in October
      2025, making maintained ddclient the safer default for new deployments.
    rel: alternative
    sources:
      - https://ddclient.net/
      - https://github.com/troglobit/inadyn/blob/master/README.md
