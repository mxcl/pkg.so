history:
  adoption-history:
    - >
      VERO expanded from mobile platforms to iPad and desktop clients for macOS and
      Windows. The company positions membership, a reverse-chronological feed, and the
      absence of advertising-driven ranking as distinguishing features intended to
      attract users and creators seeking more direct control over their social
      experience.
  package-nerd-significance:
    - >
      The cask makes an otherwise mobile-centered social network available as a
      package-managed macOS desktop application. Its interest is primarily as a
      proprietary desktop client rather than as infrastructure or a developer
      dependency.
  project-history:
    - >
      VERO launched worldwide in 2015. According to its official FAQ, the US-based
      company is majority-owned by co-founders Ayman Hariri, Scott Birnbaum, and Motaz
      Nabulsi together with members of its team.
  related-projects:
    - >
      VERO Labs also operates creator-oriented projects including VERO Music and the
      CoFi community-finance offering, while the cask specifically packages the VERO
      social client.
  sources:
    - 'Official FAQ: https://vero.co/vero-faq'
    - 'Official Help Center: https://verohelp.zendesk.com/hc/en-us/'
    - 'Official company site: https://vero.co/'
    - 'Package identity: source_facts.applications and source_facts.package-manager'
  summary:
    - >
      VERO is an account-backed social-networking service built around an ad-free
      interface and a reverse-chronological, non-algorithmic feed. Its desktop client
      supports viewing, posting, messaging, and managing connections from macOS.
  timeline:
    - '2015: VERO launched worldwide.'
    - 'By 2022: VERO documented availability on mobile, iPad, macOS, and Windows.'
  usage:
    - >
      Members create an account, connect with people, discover content, publish photos,
      videos, music, and other posts, and exchange messages through the service.
      Registration uses identifying account information and phone verification, but the
      official documentation does not describe a local credentials file.
