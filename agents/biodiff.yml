provenance:
  category-sources:
    - >
      Official GitHub README describes biodiff as a tool for binary diffing and
      comparing binary files.
  display-name-sources:
    - Official GitHub README heading and repository name use biodiff.
  docs-sources:
    - >
      Official GitHub README documents features, usage, installation, settings storage,
      and BIODIFF_CONFIG_DIR.
  history-sources:
    - https://github.com/8051Enthusiast/biodiff
    - https://github.com/8051Enthusiast/biodiff/releases
    - https://raw.githubusercontent.com/8051Enthusiast/biodiff/main/README.md
    - source_facts.package-manager
  repo-sources:
    - >
      source_facts.repo already provides https://github.com/8051Enthusiast/biodiff;
      prompt requires repo null when present.
  tags-sources:
    - >
      Official GitHub README lists terminal use, aligned binary/hex views, search, diff
      output, and reverse-engineering topic.
category-confidence: high
category-path:
  - developer-tools
  - diff-tools
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
