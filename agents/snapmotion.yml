history:
  adoption-history:
    - >
      NeededApps distributes SnapMotion directly and through Apple's App Store. It is
      available as a universal purchase across Mac, iPhone, and iPad.
    - >
      The official site presents SnapMotion as part of NeededApps' suite for
      photographers and other media users, with support for high-resolution video, Apple
      Photos, remote HTTP sources, and batch processing.
  package-nerd-significance:
    - >
      SnapMotion occupies a focused media-utility niche: it extracts source-quality
      frames rather than relying on display-resolution screenshots. Its package combines
      video decoding, frame-accurate navigation, metadata handling, batch extraction,
      and GIF or MP4 creation in a native Apple-platform application.
  project-history:
    - >
      SnapMotion was developed by NeededApps as a dedicated tool for extracting still
      images from video. Official resource listings show the product was established by
      2016 and refer to SnapMotion 3 coverage from that period.
    - >
      The application expanded beyond individual frame capture to support batch
      extraction, high-resolution media, Apple Photos, HTTP video sources, metadata
      preservation, rotation, and GIF or MP4 generation.
  related-projects:
    - >
      SnapMotion is part of the NeededApps product family alongside MetaImage,
      MetaVideo, MetaRename, GlueMotion, and PhotosRevive.
  sources:
    - 'Official product page: https://neededapps.com/snapmotion/'
    - 'Official resources index: https://neededapps.com/resources/'
    - 'Official tutorials index: https://neededapps.com/tutorials/?search=SnapMotion'
  summary:
    - >
      SnapMotion is a commercial Mac, iPhone, and iPad application for extracting
      high-quality still frames from videos and performing batch frame-to-image, GIF, or
      MP4 workflows.
  timeline:
    - >
      2016: NeededApps' official resource index records contemporary coverage of
      SnapMotion and SnapMotion 3.
    - >
      Later releases broadened the application to Mac, iPhone, and iPad and added
      high-resolution, Photos, remote-video, metadata, and batch-processing workflows.
  usage:
    - >
      Users open a video from Finder, Files, Photos, or an HTTP address, navigate to a
      desired frame, and export it as a high-quality image.
    - >
      Batch mode can extract large frame sequences over a selected range and turn them
      into image sets, animated GIFs, or MP4 files.
