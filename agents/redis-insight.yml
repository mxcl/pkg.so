id: cask:redis-insight
display-name: Redis Insight
repo: https://github.com/redis/RedisInsight
docs:
  - https://redis.io/docs/latest/operate/redisinsight
  - https://redis.io/docs/latest/operate/redisinsight/configuration
config-file-location:
  unix:
    - $RI_PRE_SETUP_DATABASES_PATH
  windows:
    - '%RI_PRE_SETUP_DATABASES_PATH%'
credentials-file-location: null
history:
  adoption-history:
    - >
      Redis reported in 2021 that Redis Insight's active-user count had more than
      doubled during the preceding year. It is distributed as desktop software, a Docker
      image, and packages through several platform stores, broadening its use across
      local development and deployed environments.
  package-nerd-significance:
    - >
      Redis Insight gives Redis users an official graphical counterpart to redis-cli,
      combining data browsing with a command workbench, profiling, slow-log analysis,
      memory recommendations, and module-aware visualizations. Its Electron rewrite and
      Docker distribution make it relevant across both desktop-package and container
      ecosystems.
  project-history:
    - >
      Redis Insight grew out of RDBTools, a Redis visualization and memory-analysis
      product acquired by Redis Labs from HashedIn in April 2019. Redis introduced
      RedisInsight later in 2019 as a free, multi-platform interface built on RDBTools.
      Redis Insight 2.0 arrived in 2021 as a complete rewrite using Electron, with a
      redesigned browser, advanced CLI, visualizations, and embedded learning material.
  related-projects:
    - >
      Redis Insight complements redis-cli and Redis for VS Code. Its lineage begins with
      RDBTools, while its interfaces cover Redis Open Source, Redis Cloud, Redis
      Software, and Redis data structures and modules.
  sources:
    - https://github.com/redis/RedisInsight
    - https://redis.io/blog/introducing-redisinsight-2/
    - https://redis.io/blog/rdbtools/
    - >
      https://redis.io/press/redis-labs-delivers-new-innovations-to-radically-simplify-complete-redis-lifecycle-from-development-to-operations/
  summary:
    - >
      Redis Insight is Redis's official graphical developer tool for browsing, querying,
      visualizing, diagnosing, and managing data in Redis deployments.
  timeline:
    - 'April 2019: Redis Labs acquired RDBTools from HashedIn.'
    - 'November 2019: RedisInsight was introduced as a free multi-platform Redis GUI.'
    - 'November 2021: Redis Insight 2.0 delivered a complete Electron-based rewrite.'
  usage:
    - >
      Developers connect Redis databases, browse and modify keys, run commands in the
      Workbench, inspect slow operations and live command activity, analyze memory, and
      work with capabilities such as JSON, search, time series, streams, and vector
      data. Connections can be preconfigured through environment variables or a JSON
      file selected with RI_PRE_SETUP_DATABASES_PATH.
tags:
