history:
  adoption-history:
    - >
      Tencent maintains Foxmail for both Windows and macOS and integrates it closely
      with QQ Mail and Tencent Exmail. Official sources publish no audited user totals,
      so broader adoption cannot be quantified reliably.
  package-nerd-significance:
    - >
      Foxmail is a long-lived proprietary mail client with separate Windows and macOS
      release lines. For package users, its interest lies in combining conventional
      desktop mail workflows with Tencent-specific account provisioning, large
      attachments, enterprise directories, recall, contacts, and calendars.
  project-history:
    - >
      The official changelogs document active Foxmail release lines across Windows and
      macOS. The Mac line was already receiving substantial account, Gmail, attachment,
      and enterprise-mail features in 2013, followed by a redesigned multi-account
      interface in 2020, calendar functionality in 2021, and later Apple Silicon
      support.
  related-projects:
    - QQ Mail
    - Tencent Exmail
    - WeCom
  sources:
    - 'Official Foxmail Windows page and changelog: https://www.foxmail.com/'
    - 'Official Foxmail for Mac page and changelog: https://www.foxmail.com/mac/en/'
    - 'Official Foxmail help center: https://service.foxmail.com/'
  summary:
    - >
      Foxmail is Tencent's proprietary desktop email client for Windows and macOS, with
      general mail features and additional integration for QQ Mail and Tencent Exmail
      accounts.
  timeline:
    - >
      2013: The official Mac changelog documented Gmail, enterprise-mail,
      large-attachment, and local-import features.
    - >
      2020: The Mac client introduced a redesigned interface and simultaneous use of
      multiple mailboxes.
    - >
      2021: Calendar support and additional QQ Mail and Tencent Exmail sign-in workflows
      arrived on macOS.
    - '2026: The official Mac changelog recorded Apple Silicon support.'
  usage:
    - >
      Users add ordinary or Tencent-hosted mail accounts to send, receive, search,
      organize, and archive messages and attachments. The client also supports contacts
      and calendar-oriented workflows.
    - >
      Tencent Exmail users receive additional automatic account configuration,
      company-directory, message-recall, group, and cloud-service integrations. Some
      enterprise features require administrator authorization.
