id: cask:sqlcl
display-name: Oracle SQLcl
repo: null
docs:
  - https://docs.oracle.com/en/database/oracle/sql-developer-command-line/26.1/sqcug
config-file-location:
  unix:
    - ./login.sql
    - ~/login.sql
  windows:
    - .\login.sql
    - '%USERPROFILE%\login.sql'
credentials-file-location: null
history:
  adoption-history:
    - >
      Oracle positions SQLcl as the modern command-line interface for Oracle Database.
      It is used as an interactive SQL and PL/SQL shell and as a script runner in
      database administration, development, and automation workflows.
    - >
      Compatibility with familiar SQL*Plus commands and login scripts lowers migration
      friction, while additional formatting, scripting, history, and developer-oriented
      commands extend the older command-line workflow.
  package-nerd-significance:
    - >
      SQLcl gives command-line-focused Oracle users a vendor-supported alternative to
      SQL*Plus. Its Java distribution and cross-platform login.sql convention make it
      straightforward to package as a versioned command-line cask.
    - >
      Its significance lies in combining longstanding Oracle scripting conventions with
      newer interactive features without requiring the full graphical SQL Developer
      application.
  project-history:
    - >
      SQLcl was developed by Oracle as a newer command-line client for Oracle Database
      and is distributed alongside the broader SQL Developer product family. Oracle
      continues to publish versioned downloads and a dedicated User's Guide.
  related-projects:
    - Oracle Database is the target database system.
    - >
      SQL*Plus is the traditional Oracle command-line client whose commands and
      scripting conventions SQLcl substantially carries forward.
    - >
      Oracle SQL Developer and its Visual Studio Code extension provide graphical
      development environments in the same tool family.
  sources:
    - https://docs.oracle.com/en/database/oracle/sql-developer-command-line/26.1/sqcug/
    - https://www.oracle.com/database/sqldeveloper/technologies/sqlcl/
  summary:
    - >
      Oracle SQLcl is Oracle's Java-based command-line interface for Oracle Database. It
      runs SQL and PL/SQL, supports interactive database work, and extends familiar
      SQL*Plus-style scripting with modern commands and output formats.
  timeline:
    - >
      Current era: Oracle distributes SQLcl as the modern command-line member of the SQL
      Developer tool family and publishes independently versioned documentation and
      downloads.
  usage:
    - >
      Users connect to Oracle Database with a username and connect identifier, execute
      SQL or PL/SQL interactively, run script files, format results, and automate
      database tasks.
    - >
      SQLcl can load persistent settings from login.sql in the current working directory
      or the user's home directory. Oracle advises against exposing passwords directly
      on the command line; no dedicated credentials-file location is established by the
      cited product documentation.
