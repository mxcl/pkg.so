history:
  adoption-history:
    - >
      The project supports direct installation from GitHub releases and installation
      through Homebrew Cask. Its official GitHub repository has attracted a modest
      developer audience around a narrowly focused macOS menu-bar workflow.
  package-nerd-significance:
    - >
      ToolReleases is a package-enthusiast utility in a literal sense: it monitors
      Apple's developer-tool release feed, including betas, while itself being
      installable through Homebrew Cask.
  project-history:
    - >
      DeveloperMaris created ToolReleases as a free macOS status-bar application that
      reads Apple's public RSS feed and formats the latest Apple tool releases. The
      project is written primarily in Swift and released under the BSD 3-Clause License.
  related-projects:
    - >
      The application consumes Apple's public developer-tools RSS feed and complements
      Apple developer release pages and Xcode update workflows.
  sources:
    - 'Official releases: https://github.com/DeveloperMaris/ToolReleases/releases'
    - 'Official repository and README: https://github.com/DeveloperMaris/ToolReleases'
    - source_facts.description; source_facts.repo; source_facts.package-manager
  summary:
    - >
      ToolReleases is an open-source macOS menu-bar application for monitoring Apple
      tool releases.
  timeline:
    - 'Early releases: Established status-bar browsing and notification of Apple tool releases.'
    - '2022: Version 1.5.0 added local notifications and a new application-update mechanism.'
  usage:
    - >
      The application refreshes Apple's public feed in the background, lists recent
      releases in the macOS status bar, provides keyword search, and raises local
      notifications or a status-icon badge when releases appear.
