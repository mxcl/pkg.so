history:
  adoption-history:
    - >
      Official documentation presents iPlay as a multi-platform client spanning Apple
      platforms, Windows, Android, HarmonyOS, and Xbox. The macOS client supports Emby,
      Jellyfin, and other media servers.
  package-nerd-significance:
    - >
      iPlay is notable to package-manager users as a native, multi-platform media client
      whose macOS sideload build can integrate yt-dlp and select among VLC, MPV, and
      Apple-native playback engines.
  project-history:
    - >
      iPlay was developed as a multi-platform multimedia player using native platform
      technologies. Its design combines multiple playback engines, media-server access,
      route switching, and a custom URL protocol.
  related-projects:
    - VLC and MPV are supported playback engines.
    - Emby and Jellyfin are supported media-server families.
    - yt-dlp can extend playback of third-party streaming URLs in the sideloaded macOS build.
  sources:
    - https://iplay.saltpi.cn/en/
    - https://iplay.saltpi.cn/en/download
    - https://iplay.saltpi.cn/en/platform/iplay-protocol
    - https://iplay.saltpi.cn/en/platform/macos/
  summary:
    - >
      iPlay is a multi-platform multimedia player supporting several playback engines
      and media-server sources.
  timeline:
    - 'iPlay 1.2.8: Custom iPlay protocol documented as available on macOS and iOS.'
    - >
      Current documentation: Native clients are offered across desktop, mobile,
      television, and console platforms.
  usage:
    - >
      Users play local or network media, connect to Emby or Jellyfin servers, choose
      among supported playback engines, and invoke playback through iplay:// or
      iplays:// URLs. The macOS settings screen controls appearance, player-core
      behavior, and runtime behavior.
