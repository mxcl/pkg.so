id: brew:droast
display-name: droast
repo: null
docs:
  - https://github.com/immanuwell/dockerfile-roast/blob/main/DOCS.md
  - https://github.com/immanuwell/dockerfile-roast#readme
config-file-location:
  unix:
    - ./droast.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project supports installation through Homebrew and Cargo, direct binary
      releases, GHCR, Wasmer, VS Code, Neovim, and pre-commit. These surfaces let the
      same checks run locally, in editors, and in CI.
  package-nerd-significance:
    - >
      droast targets packaging mistakes that affect reproducible and secure container
      images, including unpinned packages and base images, unsafe secrets, cache misuse,
      and incorrect package-manager cleanup. Its small Rust binary and multiple
      packaging formats make it easy to insert into existing build pipelines.
  project-history:
    - >
      The official repository was created in April 2026. The project quickly expanded
      from a command-line linter into a shared rule engine offered through native
      binaries, a container image, WebAssembly, editor integrations, pre-commit, and a
      GitHub Action.
  related-projects:
    - >
      The project documents migration from Hadolint policies and optional ShellCheck
      integration, and it supports Docker and Podman build-context conventions.
  sources:
    - https://github.com/immanuwell/dockerfile-roast#readme
    - https://github.com/immanuwell/dockerfile-roast/blob/main/DOCS.md#configuration
    - https://github.com/immanuwell/dockerfile-roast/releases
  summary:
    - >
      droast is an opinionated Dockerfile and Containerfile linter written in Rust. It
      combines syntax-aware parsing with rules for correctness, security,
      reproducibility, maintainability, and container-image performance.
  timeline:
    - '2026-04: The official repository was created.'
    - >
      2026-07: Version 1.4.7 was released with native, container, editor, pre-commit,
      CI, and WASI installation paths.
  usage:
    - >
      Users can lint a single Dockerfile or recursively discover container build files
      across a repository. Output formats include terminal text, compact text, JSON,
      GitHub annotations, and SARIF; teams can commit a root-level droast.toml for
      shared defaults and policy.
related-packages:
  - id: brew:hadolint
    reason: >
      Hadolint is the established Haskell-based Dockerfile linter with ShellCheck-backed
      `RUN` analysis; droast is a Rust alternative that can import Hadolint policy or
      emulate common Hadolint flags and rule identities.
    rel: alternative
    sources:
      - https://github.com/immanuwell/dockerfile-roast#configuration
      - https://github.com/hadolint/hadolint#readme
  - id: brew:shellcheck
    reason: >
      Install ShellCheck alongside droast when shell-form `RUN` instructions and script
      heredocs should receive `SC####` diagnostics through droast's documented optional
      integration.
    rel: adjacent_workflow
    sources:
      - https://github.com/immanuwell/dockerfile-roast#configuration
      - https://github.com/koalaman/shellcheck#readme
tags:
