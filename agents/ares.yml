history:
  adoption-history:
    - >
      Homebrew keeps the formula name `ares`, builds from the bee-san/Ares release
      archive, and tests the installed `ares` binary by decoding a base64 string. The
      input record also notes packaging in Debian, Ubuntu, MacPorts, Nix, and winget,
      indicating broader CLI packaging despite the upstream branding ambiguity.
  package-nerd-significance:
    - >
      For package nerds, Ares is interesting less as a stable brand than as a packaging
      edge case: Homebrew exposes `ares`, while upstream source metadata now says
      `ciphey`. It is also a Rust rewrite/next-generation branch of a popular decoder
      idea, so package records need to preserve the formula identity without erasing the
      upstream rename signal.
  project-history:
    - >
      The GitHub repository was created in August 2021. Public releases begin with
      0.0.1, 'The Founding of Thebes', in July 2022, followed by a run of mythologically
      named 0.x releases through 2022 and later 0.10 and 0.11 releases. The Cargo
      manifest now names the package and binary `ciphey`, describes it as 'Ciphey but in
      Rust', and points at the same author ecosystem.
  related-projects:
    - >
      The README explicitly links the project to Ciphey and says it was built by the
      same people. It also mentions LemmeKnow, PyWhat, Rayon, cipher_identifier, and
      gibberish-or-not as parts of the decoding and plaintext-detection ecosystem.
  sources:
    - https://api.github.com/repos/bee-san/Ares
    - https://api.github.com/repos/bee-san/Ares/releases
    - https://github.com/bee-san/Ares#readme
    - https://raw.githubusercontent.com/Homebrew/homebrew-core/HEAD/Formula/a/ares.rb
    - https://raw.githubusercontent.com/bee-san/Ares/main/Cargo.toml
  summary:
    - >
      Ares is packaged by Homebrew as an automated decoder for encrypted or encoded
      text. The upstream repository currently presents the project as ciphey, a Rust
      successor in the Ciphey decoding-tool family, so the package history is best
      understood as a formula name and repository name that predate or diverge from the
      current upstream branding.
  timeline:
    - '2021: GitHub repository created.'
    - "2022: 0.0.1 release published as 'The Founding of Thebes'."
    - "2023: v0.10.0 'Amphitrite' release published."
    - '2025: 0.11.0 release published and packaged by Homebrew as Ares.'
  usage:
    - >
      The current README describes a decoder workflow aimed at automatically recovering
      plaintext without the user specifying every cipher step. It emphasizes a CLI plus
      library split, a timer to avoid endless searches, multi-level decoding, plaintext
      detection, and integrations such as a Discord bot.
