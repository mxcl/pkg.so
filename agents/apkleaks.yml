id: brew:apkleaks
display-name: APKLeaks
repo: https://github.com/dwisiswant0/apkleaks
docs:
  - https://github.com/dwisiswant0/apkleaks#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through PyPI, Docker, and source installation according
      to its README. The supplied package metadata also records Homebrew and Nix
      packages, showing that the tool crossed from Python security circles into general
      CLI package indexes.
    - >
      GitHub repository metadata showed more than 6k stars and hundreds of forks at
      research time, which is unusually high for a narrow APK scanner and reflects
      adoption in mobile-security and bug-bounty workflows.
  package-nerd-significance:
    - >
      APKLeaks is interesting as a small packaged security CLI because it composes other
      tools and pattern corpora behind a simple command. Package users care less about a
      library API and more about whether pipx, brew, nix, or Docker can put a scanner in
      PATH quickly during APK triage.
    - >
      Its release stream also shows maintenance for platform compatibility, including
      Python 3.12 and 3.13 support and a move to pyproject.toml in the 2.6.x series.
  project-history:
    - >
      The public GitHub repository was created in May 2020. Its README positions the
      tool around APK scanning and documents installation from PyPI, source, and Docker,
      with jadx used as the disassembler when available.
    - >
      The README credits apkurlgrep as an inspiration and acknowledges pattern sources
      and related tooling such as truffleHogRegexes, LinkFinder, gf patterns, dex2jar,
      and a standalone APK parser. That makes the project a packaging point for several
      mobile-reconnaissance ideas rather than a pure APK parser.
  related-projects:
    - >
      APKLeaks relies on jadx for APK decompilation and credits apkurlgrep,
      truffleHogRegexes, LinkFinder, gf, dex2jar, and a standalone APK parser as
      influences or resources.
  sources:
    - https://api.github.com/repos/dwisiswant0/apkleaks
    - https://api.github.com/repos/dwisiswant0/apkleaks/releases
    - https://github.com/dwisiswant0/apkleaks#readme
    - source_facts.package-manager
  summary:
    - >
      APKLeaks is a Python CLI for scanning APK files for URIs, endpoints, and secrets.
      It is part Android reverse-engineering helper, part bug-bounty reconnaissance
      tool, and part regex-based secret scanner.
  timeline:
    - '2020: Public dwisiswant0/apkleaks repository created on GitHub.'
    - >
      2021: 2.6.0 release added token and identifier patterns such as GitHub access
      tokens, Discord bot tokens, JWTs, and CTF flag patterns.
    - '2024: 2.6.2 added Python 3.12 support.'
    - '2024: 2.6.3 migrated to pyproject.toml and fixed Python 3.13 compatibility.'
  usage:
    - >
      The common invocation is apkleaks -f path/to/file.apk, with optional output file
      selection, JSON output, custom pattern JSON via --pattern, and disassembler
      arguments passed through with --args. If no output path is supplied, the README
      says it generates a result file automatically.
    - >
      APKLeaks does not document a fixed user config file. Pattern customization is an
      explicit per-run path to a JSON rules file, while the default regexes live inside
      the project repository.
related-packages:
  - id: brew:jadx
    reason: >
      Use jadx directly when you need interactive or general-purpose APK/DEX
      decompilation; APKLeaks invokes jadx as its decompilation stage before applying
      its focused endpoint and secret patterns.
    rel: adjacent_workflow
    sources:
      - https://github.com/dwisiswant0/apkleaks
      - https://github.com/skylot/jadx
