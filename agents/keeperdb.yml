history:
  adoption-history:
    - >
      KeeperDB entered distribution both as a free standalone desktop database client
      and as an embedded, governed session within KeeperPAM. Reliable official evidence
      for broader adoption is not yet available because the product is new.
  package-nerd-significance:
    - >
      KeeperDB is noteworthy among database-client packages for combining ordinary
      multi-database tooling with vault-delivered credentials, biometric access, session
      governance and an embedded AI assistant.
  project-history:
    - >
      Keeper Security introduced KeeperDB in June 2026 as a database-management client
      built into its zero-knowledge security platform and also offered it as a
      standalone application for macOS, Windows and Linux.
  related-projects:
    - KeeperPAM
    - Keeper Secrets Manager
    - DBeaver
    - pgAdmin
    - MySQL Workbench
  sources:
    - 'Official developer overview: https://www.keepersecurity.com/developer/'
    - >
      Official launch announcement:
      https://www.keepersecurity.com/blog/2026/06/04/whats-new-with-keeper-june-2026/
    - 'Official product page: https://www.keepersecurity.com/keeperdb'
  summary:
    - >
      KeeperDB is Keeper Security's multi-protocol desktop database client, combining
      SQL and schema tools with optional Keeper vault, privileged-access and AI
      integrations.
  timeline:
    - '2026: Keeper Security introduced KeeperDB'
  usage:
    - >
      Engineers and database administrators use KeeperDB to connect to PostgreSQL,
      MySQL, MongoDB, DynamoDB, SQL Server, Oracle, Amazon Redshift and SQLite; browse
      schemas; run SQL; inspect performance; and manage sessions. Standalone use is
      available, while KeeperPAM can supply governed or ephemeral credentials and record
      privileged sessions.
