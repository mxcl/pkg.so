history:
  adoption-history:
    - >
      Internxt reports that Drive expanded from its initial cloud-storage product into a
      cross-platform service with web, desktop, and mobile clients. The desktop
      application provides synchronization and scheduled folder backups, while the macOS
      implementation integrates with Apple's File Provider framework.
  package-nerd-significance:
    - >
      Internxt Drive is relevant to privacy-focused package users as an open-source
      desktop client for a zero-knowledge encrypted storage service. The macOS client
      exposes the service through a native File Provider extension rather than only a
      browser interface.
  project-history:
    - >
      Internxt was founded by Fran Villalba Segarra, and Internxt Drive launched in 2020
      as the company's first product. Drive subsequently became the central product in a
      broader privacy-focused software suite. The current macOS desktop codebase
      contains the application, File Provider synchronization extension, helper
      components, and backup service.
  related-projects:
    - >
      Internxt also provides web and mobile Drive clients and related command-line and
      WebDAV access. Drive belongs to Internxt's wider privacy-product ecosystem.
  sources:
    - 'Official Internxt About page: https://internxt.com/about'
    - 'Official Internxt Drive page: https://internxt.com/drive'
    - >
      Official backup guide:
      https://help.internxt.com/en/articles/6583477-how-do-backups-work-on-internxt-drive
    - 'Official macOS client repository: https://github.com/internxt/drive-desktop-macos'
  summary:
    - >
      Internxt Drive is an encrypted cloud-storage service with a native macOS client
      for file access, synchronization, and backups.
  timeline:
    - '2020: Internxt was founded and Internxt Drive launched as its first product.'
    - >
      2023: Internxt reported that the desktop application had advanced to its second
      major generation.
  usage:
    - >
      Install the desktop client, sign in with an Internxt account, and use the Drive
      integration to access and synchronize stored files. Backups are configured under
      Settings and Preferences by selecting folders and choosing a manual or periodic
      schedule; backed-up data can be managed through the web application.
