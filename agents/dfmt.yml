id: brew:dfmt
display-name: dfmt
repo: null
docs:
  - https://github.com/dlang-community/dfmt#readme
config-file-location:
  unix:
    - .editorconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      dfmt follows the formatter pattern familiar from other language communities: a
      small command-line tool that can be invoked directly, integrated into editors, or
      run by project scripts while reading shared formatting policy from
      `.editorconfig`.
  package-nerd-significance:
    - >
      For package nerds, dfmt is the D ecosystem's conventional formatting binary:
      packaging it gives editors and build scripts a reproducible formatter without
      requiring each project to vendor the formatter itself.
  project-history:
    - >
      The official tag history begins in 2015 with the 0.1.x series. The README
      describes the tool as beta quality and documents both DUB and source builds,
      reflecting its role inside the D language tooling ecosystem.
  related-projects:
    - >
      dfmt is related to DUB, D compiler toolchains such as DMD and LDC, EditorConfig,
      and libdparse.
  sources:
    - https://github.com/dlang-community/dfmt#readme
    - https://github.com/dlang-community/dfmt/blob/master/dub.json
    - https://github.com/dlang-community/dfmt/tags
  summary:
    - >
      dfmt is a formatter for D source code. It can read from stdin or a file, write
      formatted output to stdout, edit files in place, and use EditorConfig files for
      formatting settings.
  timeline:
    - '2015: v0.1.0 appears in the official tag history.'
    - '2023: v0.15.0 is tagged after beta releases.'
    - '2024: v0.15.2 is tagged.'
  usage:
    - >
      By default dfmt reads D source from stdin and writes to stdout. When given a file
      and `--inplace`, it rewrites that file, while command-line options can override
      settings discovered through applicable `.editorconfig` files.
related-packages:
  - id: brew:dub
    reason: >
      DUB complements dfmt by providing the official documented command for fetching,
      building, and running the formatter within the D package workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/dlang-community/dfmt#readme
      - https://dub.pm/
