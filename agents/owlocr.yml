history:
  adoption-history:
    - >
      OwlOCR evolved as an independent Mac utility with screen capture, editable
      results, PDF workflows, Finder Quick Actions, multiple languages, and increasingly
      automated document processing. A free core edition and optional Pro features
      broadened access while reserving batch, CLI, and local OCR-AI workflows for
      heavier users.
  package-nerd-significance:
    - >
      OwlOCR is interesting to Mac package users because it turns Apple's on-device
      Vision framework into a focused desktop, menu-bar, Finder, PDF, and command-line
      workflow. Its emphasis on local processing makes it a privacy-oriented alternative
      to web OCR services.
  project-history:
    - >
      The project began in January 2020 as Textify and was renamed OwlOCR the following
      month. Early releases concentrated on screen capture, editable OCR, language
      selection, PDF handling, and searchable-PDF export.
    - >
      OwlOCR 5 in 2022 brought a substantial concurrency, loading, and document-model
      refactor. OwlOCR 7 in 2026 rebuilt the main application around Electron and React
      while retaining native Swift helpers for Apple Vision, PDFKit, capture, Finder
      extensions, and export. It subsequently added optional local OCR AI and a
      supported CLI.
  related-projects:
    - >
      Apple Vision supplies the default on-device OCR engine; PDFKit, AppKit, and Core
      Graphics support native Mac document and capture workflows.
    - >
      The optional OCR AI path uses local model files and a native inference runtime
      rather than uploading documents to an online OCR service.
  sources:
    - https://owlocr.com/changelog/
    - https://owlocr.com/press/
    - https://owlocr.com/support/
  summary:
    - >
      OwlOCR is an independent macOS application for extracting and editing text from
      screen regions, images, scans, and PDFs, and for creating searchable PDFs using
      on-device OCR.
  timeline:
    - '2020: Textify began in January and was renamed OwlOCR in February.'
    - '2021: Finder Quick Actions, custom OCR words, and post-processing workflows were added.'
    - '2022: OwlOCR 5 introduced a major performance and architecture refactor.'
    - >
      2026: OwlOCR 7 rebuilt the application and added a free core edition, CLI
      automation, and optional local OCR AI.
  usage:
    - >
      Users capture part of the screen or open images and PDFs, run Apple Vision OCR,
      edit or copy recognized text, and export searchable PDFs or text. Finder Quick
      Actions support one-step file workflows; Pro users can process batches, use
      post-processing rules, invoke the CLI, and run the optional local OCR-AI engine.
