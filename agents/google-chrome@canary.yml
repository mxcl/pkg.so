  - https://support.google.com/chrome
  - https://support.google.com/chrome/a/answer/9027636
config-file-location:
  macos:
    - ~/Library/Application Support/Google/Chrome Canary
credentials-file-location: null
history:
  adoption-history:
    - >
      Google introduced Canary for users willing to test changes even earlier than the
      Dev channel. Its initial announcement emphasized very frequent builds, riskier
      changes, little or no human verification, and side-by-side installation so a
      broken Canary would not displace a dependable browser.
    - >
      Canary became the earliest public tier of Chrome's release pipeline. It is chiefly
      adopted by browser engineers, web developers, compatibility testers, and
      enthusiasts who value immediate access to changes over day-to-day stability.
  package-nerd-significance:
    - >
      Canary is Chrome's classic bleeding-edge package: rapidly rebuilt from current
      work, deliberately isolated from safer channels, and useful for finding
      regressions at their earliest public stage. Its dedicated cask and profile
      directory let testers keep this volatile build beside production browsers.
  project-history:
    - >
      Google launched Chrome and the open-source Chromium project in September 2008. The
      team initially used frequently updated Dev builds to gather early feedback.
    - >
      In 2010, Google added the Canary Build because even the Dev cadence was sometimes
      too slow for feedback. Canary was designed to update more frequently with riskier,
      lightly tested changes and later became part of the familiar
      Canary-to-Dev-to-Beta-to-Stable progression.
  related-projects:
    - Google Chrome Stable
    - Google Chrome Beta
    - Google Chrome Dev
    - Chromium
    - Chrome for Testing
  sources:
    - https://blog.chromium.org/2010/08/google-chrome-in-coal-mine.html
    - https://chromium.googlesource.com/chromium/src/+/HEAD/docs/user_data_dir.md
    - https://developers.googleblog.com/google-chrome-chromium-and-v8-launch-today/
    - https://support.google.com/chrome/a/answer/9027636
    - https://www.chromium.org/chrome-release-channels/
  summary:
    - >
      Google Chrome Canary is Google's most experimental public Chrome channel, exposing
      very recent changes with minimal testing and a correspondingly high risk of
      crashes or breakage.
  timeline:
    - '2008: Google launched Chrome and the Chromium open-source project.'
    - >
      2010: Google introduced Chrome Canary as a more frequently updated, riskier
      channel than Dev.
  usage:
    - >
      Use Canary for early web-platform experimentation, regression discovery, and
      checking changes that have not yet progressed to Dev or Beta. Google advises
      against using it as an everyday browser.
    - >
      The current macOS build keeps its profile in a Canary-specific Application Support
      directory, enabling side-by-side use with other Chrome channels.
