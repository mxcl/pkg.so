    - Proton VPN
    - Proton Docs
  sources:
    - 'Official Drive 2.0 announcement: https://proton.me/blog/proton-drive-macos-app-update'
    - 'Official Proton Drive update archive: https://proton.me/blog/proton-updates/proton-drive'
    - 'Official macOS guide: https://proton.me/support/drive-macos-guide'
    - 'Official macOS launch announcement: https://proton.me/blog/proton-drive-mac-app'
    - 'Official macOS source repository: https://github.com/ProtonDriveApps/mac-drive'
  summary:
    - >
      Proton Drive is Proton's end-to-end encrypted cloud-storage service. Its macOS
      client integrates with Finder to synchronize files, retain on-demand local copies,
      provide offline access, and expose transfer status from the menu bar.
  timeline:
    - '2020-08-31: Proton published the Drive security model'
    - '2022-09-22: Proton Drive launched for general availability'
    - '2022-11: Proton reported more than one million file uploads per day'
    - '2023-11-23: Proton Drive for macOS launched'
    - '2025-04-02: Proton Drive 2.0 for macOS launched'
  usage:
    - >
      After signing in with a Proton Account, users access a Proton Drive location in
      Finder. Files placed there synchronize to encrypted cloud storage; users can
      download items for offline access, remove local copies to reclaim space, and
      inspect synchronization activity from the menu-bar application.
