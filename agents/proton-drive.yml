history:
  adoption-history:
    - >
      Proton Drive moved from an early web service to general availability in September
      2022. Proton reported more than one million uploaded files per day less than two
      months after that launch. Native mobile and desktop clients subsequently broadened
      access, with the November 2023 macOS release completing Proton's coverage of the
      major consumer platforms.
  package-nerd-significance:
    - >
      The macOS client combines Finder-native, on-demand file synchronization with
      end-to-end encryption of file contents and metadata. Its published GPL-licensed
      source also gives privacy-focused users an inspectable alternative to proprietary
      cloud-drive clients.
  project-history:
    - >
      Proton introduced Drive as part of its privacy-focused service suite, publishing
      its security model in August 2020 and making the encrypted cloud-storage service
      generally available on September 22, 2022.
    - >
      After mobile clients and a Windows synchronization client, Proton released the
      first macOS app on November 23, 2023. Proton rebuilt that client as Proton Drive
      2.0 in April 2025 to improve synchronization, transfer performance, and status
      visibility.
