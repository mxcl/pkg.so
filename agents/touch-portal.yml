history:
  adoption-history:
    - >
      Touch Portal developed around the pairing of a desktop automation host with a
      phone or tablet used as a customizable control deck. Its built-in integrations,
      particularly streaming-oriented controls, positioned it as a software alternative
      to dedicated macro-pad hardware.
    - >
      Successive releases broadened the audience beyond basic streaming controls: secure
      device connections, onboarding, plugins, global events, values, sliders,
      connectors, embedded Java, Linux support, and multiple-device operation turned it
      into a general automation platform.
  package-nerd-significance:
    - >
      Touch Portal is a desktop-and-mobile system rather than a self-contained macOS
      application. Package users install the desktop host, keep its user-data directory
      during upgrades or migration, and pair it with a separately distributed mobile
      client.
    - >
      Its plugin API and locally stored actions make the user-data directory an
      important packaging concern. The official documentation explicitly distinguishes
      its location by operating system and documents backup and manual restoration.
  project-history:
    - >
      Touch Portal began as a configurable remote macro-control system aimed at
      streamers and content creators, with integrations for software such as OBS and
      Streamlabs Desktop.
    - >
      The 1.x line added richer OBS controls and secure connections. The 2.x line
      introduced onboarding, a plugin system, global events, values, and broader
      automation actions. Version 3 moved to an embedded OpenJDK 17 runtime and
      redesigned the application around connectors and sliders; version 4 added support
      for multiple connected devices.
  related-projects:
    - OBS Studio
    - Streamlabs Desktop
    - Touch Portal mobile app
    - Touch Portal plugin API
    - hardware macro decks
  sources:
    - https://www.touch-portal.com/
    - https://www.touch-portal.com/api/
    - https://www.touch-portal.com/blog/post/2019_08_29/New_in_release_version_1_9.php
    - https://www.touch-portal.com/blog/post/2019_12_01/New_in_release_version_2_0.php
    - https://www.touch-portal.com/blog/post/2020-03-09/New_in_release_version_2_1.php
    - https://www.touch-portal.com/docs/
  summary:
    - >
      Touch Portal is a cross-platform desktop automation host paired with a mobile
      control surface. Users build pages of buttons and sliders that run actions, react
      to events, control applications, and invoke integrations or plugins.
  timeline:
    - '2019: Version 1.9 adds secure connections and expands OBS automation.'
    - >
      2019: Version 2.0 adds onboarding, a redesigned grid, richer buttons, and broader
      integrations.
    - '2020: Version 2.1 introduces the plugin system and its developer API.'
    - >
      Version 3: Touch Portal adopts an embedded OpenJDK 17 runtime and adds sliders and
      connectors in a redesigned interface.
    - 'Version 4: Multiple-device support is introduced.'
  usage:
    - >
      Users install the desktop application on the computer being controlled and the
      mobile application on a phone or tablet. They pair the devices, design pages, and
      assign actions, events, flows, values, or connectors to controls.
    - >
      Typical workflows include changing streaming scenes, controlling audio, sending
      keystrokes, launching programs or scripts, making HTTP requests, and extending the
      system with plugins.
    - >
      The official FAQ recommends backing up the `TouchPortal` user-data folder because
      it contains pages, events, flows, and values.
