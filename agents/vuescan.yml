credentials-file-location:
  macos:
    - /Users/<username>/.vuescanrc
    - /Users/Shared/.vuescanrc
    - /Library/Application Support/VueScan/.vuescanrc
    - /Network/Library/Application Support/VueScan/.vuescanrc
history:
  adoption-history:
    - >
      Hamrick Software reports that VueScan has accumulated more than 600,000 users
      worldwide and supports more than 8,000 scanners.
    - >
      Its broad hardware support gives continued utility to scanners whose original
      vendor software or operating-system drivers are no longer maintained.
  package-nerd-significance:
    - >
      VueScan is notable for extending the useful life of scanning hardware across
      operating-system and vendor-support transitions. It is also an unusually
      long-lived, independently developed cross-platform desktop utility with
      conventional INI-based option persistence.
  project-history:
    - >
      Hamrick Software was founded by Ed Hamrick in 1991. After buying an HP PhotoSmart
      film scanner in 1997, Hamrick wrote VueSmart to obtain better scans than the
      bundled software produced.
    - >
      Support for additional scanners led to VueSmart being renamed VueScan, which
      Hamrick Software first released in 1998. Development later continued as a
      father-and-son business involving Ed and David Hamrick.
  related-projects:
    - VueSmart was the initial single-scanner program that evolved into VueScan.
    - VuePrint, Hamrick Software’s earlier JPEG viewer, was the company’s first product.
  sources:
    - https://www.hamrick.com/about-vuescan.html
    - https://www.hamrick.com/vuescan/html/vuesc27.htm
    - https://www.hamrick.com/vuescan/html/vuesc34.htm
    - https://www.hamrick.com/vuescan/html/vuescan-manual.pdf
  summary:
    - >
      VueScan is long-running proprietary scanning software from Hamrick Software,
      designed to work with a large range of flatbed, document, and film scanners on
      multiple operating systems.
  timeline:
    - '1991: Ed Hamrick founded Hamrick Software.'
    - '1997: Work began as VueSmart for an HP PhotoSmart film scanner.'
    - '1998: The multi-scanner application was released as VueScan.'
  usage:
    - >
      Users select a scanner and media type, preview and crop an image, adjust color and
      exposure options, and scan to formats such as JPEG, TIFF, or PDF. VueScan can
      automatically reload saved options from vuescan.ini.
    - >
      Registration information—email address, serial number, and customer number—is
      stored in .vuescanrc on macOS; the manual also documents shared and network-wide
      alternatives.
