history:
  adoption-history:
    - >
      PhotoSync's official site describes the product family as operating for more than
      14 years and spanning iOS, Android, macOS, Windows, Linux, NAS devices, and cloud
      services. The desktop Companion is offered as the native Mac and Windows component
      of that cross-platform workflow.
  package-nerd-significance:
    - >
      PhotoSync Companion represents the local-first end of the photo-transfer
      ecosystem: it discovers mobile devices over Wi-Fi and moves original media
      directly rather than requiring a cloud intermediary. Its Homebrew cask makes this
      otherwise conventional desktop utility reproducibly installable on macOS.
  project-history:
    - >
      PhotoSync is developed by touchbyte GmbH as a cross-platform photo and video
      transfer system. The Companion application supplies desktop integration for
      receiving media, sending files by drag and drop, and importing into Apple Photos.
  related-projects:
    - >
      PhotoSync for iOS and Android are the required mobile counterparts for native
      Companion transfers.
    - >
      The product also supports browser-based transfers and integrations with NAS, file,
      and cloud services.
  sources:
    - https://www.photosync-app.com/downloads
    - >
      https://www.photosync-app.com/photosync/en/help/general/answers/why-cant-i-see-my-photos-and-albums-in-photosync
    - https://www.photosync-app.com/support/mac
  summary:
    - >
      PhotoSync Companion is the free macOS and Windows desktop component of PhotoSync,
      a long-running system for transferring and backing up photos and videos between
      mobile devices, computers, storage services, and NAS systems.
  timeline:
    - >
      By 2025: PhotoSync's official site described the product as operating for more
      than 14 years.
    - '2022: The official downloads page records the macOS Companion 4.2 release.'
  usage:
    - >
      On macOS, users run PhotoSync on both devices and transfer over the same local
      Wi-Fi network. Files can be dragged onto the Companion's Dock or menu-bar icon,
      while incoming media can be directed to folders or the macOS Photos application.
