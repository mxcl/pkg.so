history:
  adoption-history:
    - >
      iODBC appears in long-running Unix and macOS packaging because many database
      clients and language bindings need a driver manager that can load vendor ODBC
      drivers. The official downloads page lists source builds, macOS SDK installers,
      and distro package names for Debian-family, Fedora, Gentoo, and FreeBSD systems.
  package-nerd-significance:
    - >
      libiodbc matters because ODBC is a cross-language, cross-database compatibility
      layer, and driver managers sit at an awkward boundary between system
      configuration, dynamic linking, GUI setup tools, and per-driver credentials. The
      package is also historically interesting on macOS because Apple shipped iODBC
      components while package managers continued to carry OpenLink-maintained builds.
  project-history:
    - >
      The iODBC source tree carries copyright attribution to Ke Jin in 1995 and OpenLink
      Software from 1996 onward. The official FAQ says iODBC stands for Independent Open
      Database Connectivity, is dual-licensed under BSD and LGPL terms, and is hosted by
      OpenLink for the wider community as a free ODBC driver-manager component for
      Linux, macOS, Unix-like systems, VMS, and other platforms.
    - >
      The README frames iODBC as a complete implementation of an ODBC driver manager
      plus the iodbctest command-line SQL interface. It also documents the Unix
      configuration model around ODBCINI, ~/.odbc.ini, system odbc.ini, and
      odbcinst.ini, which became the practical shape that packagers and administrators
      deal with.
  related-projects:
    - >
      Related projects include unixODBC as the other common open source ODBC driver
      manager, OpenLink ODBC drivers, Virtuoso, language bindings such as DBD::ODBC and
      Ruby/ODBC, and database-specific ODBC drivers for PostgreSQL, MySQL, and
      commercial databases.
  sources:
    - https://github.com/openlink/iODBC/releases
    - https://raw.githubusercontent.com/openlink/iODBC/develop/README.md
    - https://www.iodbc.org/dataspace/iodbc/wiki/iodbcWiki/ChangeNotes
    - https://www.iodbc.org/dataspace/iodbc/wiki/iodbcWiki/Downloads
    - https://www.iodbc.org/dataspace/iodbc/wiki/iodbcWiki/FAQ
  summary:
    - >
      iODBC is an open source ODBC driver manager for Unix-like systems and other
      platforms. In package-manager terms, libiodbc is the alternative ODBC
      driver-manager stack most often compared with unixODBC.
  timeline:
    - '1995: The source tree records the original iODBC copyright attribution to Ke Jin.'
    - >
      1996: OpenLink Software began the copyright period recorded by the project and
      later became custodian and sponsor according to the official FAQ.
    - >
      2009-09-11: iODBC 3.52.7 added the iODBC Graphical Administrator for Mac OS X and
      other driver-manager fixes.
    - >
      2016-07-12: iODBC 3.52.12 added Cocoa dialogs and a 64-bit iODBC Administrator for
      Mac OS X workflows.
    - '2023-05-02: OpenLink published the 3.52.16 release on GitHub.'
  usage:
    - >
      Users install libiodbc to provide libiodbc, iodbc-config, iodbctest, and related
      driver-manager pieces. It is used to define DSNs, load ODBC driver shared
      libraries, test database connectivity, and support applications that speak the
      ODBC API rather than a database-specific client API.
related-packages:
  - id: brew:unixodbc
    reason: >
      Choose unixODBC when an application or vendor driver expects that driver manager
      and its tooling; both packages provide the Unix ODBC driver-manager layer, but
      their libraries and administration stacks are distinct.
    rel: alternative
    sources:
