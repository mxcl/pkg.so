history:
  adoption-history:
    - >
      The README positions SAIL for image viewers, game developers, and applications
      that need a clean API for many image formats. It also documents installation
      through PyPI, Homebrew, Conan, and vcpkg, which is the main source-backed evidence
      for cross-platform packaging adoption.
  package-nerd-significance:
    - >
      SAIL is interesting to packagers because it tries to sit between tiny
      single-header image loaders and large desktop imaging stacks: codec plugins, C11
      portability, Python bindings, and package recipes all meet in one relatively young
      image-library package.
  project-history:
    - >
      The SAIL FAQ says SAIL is a rebranded ksquirrel-libs rewritten in C, improved, and
      enhanced with high-level APIs, and dates the SAIL/ksquirrel-libs lineage to 2003.
      The GitHub repository was created in March 2020 and the release tags show
      pre-release development through the 0.9.0 series before 1.0.0 tags in June 2026.
  related-projects:
    - >
      Related projects include ksquirrel-libs, KSquirrel, FreeImage, DevIL, SDL_image,
      stb_image, Boost.GIL, gdk-pixbuf, imlib2, CImg, Conan, vcpkg, and sailpy.
  sources:
    - https://api.github.com/repos/HappySeaFox/sail/releases?per_page=100
    - https://github.com/HappySeaFox/sail
    - https://github.com/HappySeaFox/sail/blob/master/FAQ.md
    - https://github.com/HappySeaFox/sail/releases
  summary:
    - >
      libsail is the library component of SAIL, the Squirrel Abstract Imaging Library, a
      cross-platform C11 image decoding and encoding library with C, C++, and Python
      APIs. Its history is thinner than older desktop libraries, but the project
      documents a predecessor relationship to ksquirrel-libs.
  timeline:
    - "2003: The project's FAQ dates the SAIL/ksquirrel-libs lineage to this year."
    - >
      2020: The GitHub repository was created in March and the v0.9.0-pre1 tag was made
      in June.
    - '2023: The v0.9.0 tag was made in November.'
    - '2026: The v1.0.0 tag was published in June.'
  usage:
    - >
      Users link libsail from C or C++, use the Python binding, or invoke the sail
      command-line utility for conversion, resizing, frame extraction, and codec-tuning
      operations. The library loads codecs on demand and exposes multiple API levels for
      simple and advanced image handling.
related-packages:
  - id: brew:gdk-pixbuf
    reason: >
      Choose gdk-pixbuf when image loading must integrate with GNOME's GObject-based
      desktop stack; SAIL lists it as a competitor but emphasizes its own codec plugins
      and tiered low-to-high-level APIs.
    rel: alternative
    sources:
      - https://sail.software/faq.html
      - https://docs.gtk.org/gdk-pixbuf/
  - id: brew:imlib2
    reason: >
      Choose imlib2 for an established image-loading and rendering library associated
      with the Enlightenment ecosystem; SAIL officially identifies it as an alternative
      image-decoding library.
    rel: alternative
    sources:
      - https://sail.software/faq.html
      - https://docs.enlightenment.org/api/imlib2/html/
