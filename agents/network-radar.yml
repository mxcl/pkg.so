history:
  adoption-history:
    - >
      Witt Software maintains Network Radar for macOS and a related iPhone and iPad
      edition. The publisher also provides legacy Mac builds for older operating-system
      generations, indicating a long-lived native application rather than a short-lived
      network utility.
  package-nerd-significance:
    - >
      Network Radar gives Mac users a graphical alternative to assembling discovery,
      ping, port-scan, traceroute, lookup, Whois, Wake-on-LAN, and SSH workflows from
      separate utilities. Its importable NETRADR format and XML, CSV, text, and PDF
      exports also make scans reusable as inventories and documentation.
  project-history:
    - >
      Network Radar was developed by Witt Software as a native device-discovery and
      monitoring application. Over successive major releases it grew beyond a basic IP
      scanner to include change monitoring, folders and smart folders, rules and
      actions, common network tools, remote commands, and an iOS companion edition.
  related-projects:
    - >
      Witt Software also publishes Network Radar for iPhone and iPad. The mobile edition
      covers device discovery and common tools such as ping, port scanning, Whois, and
      DNS lookup.
  sources:
    - https://www.witt-software.com/compatibility/
    - https://www.witt-software.com/netradar/
    - https://www.witt-software.com/networkradar/
  summary:
    - >
      Network Radar is Witt Software's graphical network scanner and monitor for macOS.
      It discovers devices, records changes, organizes hosts, and bundles common
      diagnostic and remote-management tools.
  timeline:
    - >
      Long-term development: Witt Software provides multiple generations of Network
      Radar for current and legacy macOS systems.
    - >
      Cross-platform expansion: A related Network Radar edition was released for iPhone
      and iPad.
  usage:
    - >
      Run a scan to enumerate devices and inspect addresses, names, vendors, services,
      open ports, and response times. Monitoring and rules can report devices joining,
      leaving, or changing; integrated tools support ping, traceroute, lookup, port
      scanning, Whois, Wake-on-LAN, SSH, and selected remote Mac commands.
