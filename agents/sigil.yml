history:
  adoption-history:
    - >
      The official project describes Sigil as one of the most popular EPUB editors. Its
      free-software licensing, Windows, macOS, and Linux support, and direct EPUB source
      editing have made it a durable tool for independent authors, professional editors,
      and ebook-production specialists.
    - >
      Sigil is distributed through official installers and application bundles as well
      as operating-system package ecosystems. The input identifies its macOS Homebrew
      Cask distribution.
  package-nerd-significance:
    - >
      Sigil is a mature GPL desktop application with a substantial Qt and QtWebEngine
      stack, embedded Python support for plugins, EPUB-specific parsers, spell-checking
      components, and platform-specific packaging.
    - >
      Its plugin system, companion PageEdit editor, reproducible source history, and
      availability through multiple package managers make it a useful case study in
      maintaining a cross-platform publishing application.
  project-history:
    - >
      Strahinja Marković created Sigil in 2009. The project subsequently passed through
      several volunteer maintainers and is now led by Doug Massay and Kevin Hendricks.
    - >
      Sigil evolved into a cross-platform EPUB 2 and EPUB 3 editor offering direct XHTML
      and metadata editing, previews, regular-expression search, checkpoints, plugins,
      and publication-structure tools.
  related-projects:
    - PageEdit, the Sigil project's companion XHTML visual editor.
    - EpubCheck, commonly used to validate EPUB publications.
    - >
      The Sigil User Guide and Plugin Framework API Guide, maintained as separate
      official documentation projects.
  sources:
    - 'Official changelog: https://github.com/Sigil-Ebook/Sigil/blob/master/ChangeLog.txt'
    - 'Official project overview and history: https://sigil-ebook.com/sigil/'
    - 'Official repository README: https://github.com/Sigil-Ebook/Sigil'
    - 'Official user guide: https://sigil-ebook.com/sigil-user-guide/'
    - source_facts.package-manager
  summary:
    - >
      Sigil is a free, volunteer-maintained, cross-platform EPUB 2 and EPUB 3 editor
      created in 2009.
  timeline:
    - '2009: Strahinja Marković created Sigil.'
    - '2010s: Project stewardship passed through successive volunteer developers.'
    - '2020: Sigil reached its 1.0 release series.'
    - '2023: Sigil 2.0 standardized official releases on Qt 6.'
  usage:
    - >
      Authors and editors use Sigil to assemble EPUB files, edit XHTML and CSS, manage
      metadata and tables of contents, inspect previews, and package books for
      publication.
    - >
      Advanced workflows use regular-expression search, checkpoints, configurable
      dictionaries, plugins, and companion tools such as PageEdit.
