history:
  adoption-history:
    - >
      The CLI is maintained inside the official LocalSend monorepo and is available as a
      Homebrew formula according to the supplied package-manager metadata. It
      interoperates with LocalSend applications across desktop and mobile platforms
      through the same protocol.
  package-nerd-significance:
    - >
      LocalSend CLI makes a primarily graphical, cross-platform local-transfer ecosystem
      usable from terminals and shell workflows while retaining LocalSend's serverless,
      local-network model.
  project-history:
    - >
      LocalSend began as a cross-platform application for sending files and messages
      over a local network without an Internet connection or third-party server. The
      official project later added a terminal client built on LocalSend Protocol v2.
  related-projects:
    - LocalSend
    - LocalSend Protocol
  sources:
    - https://github.com/localsend/localsend
    - https://github.com/localsend/localsend#command-line-interface
    - https://github.com/localsend/protocol
    - source_facts.package-manager
  summary:
    - >
      LocalSend CLI is the official terminal client for discovering nearby LocalSend
      devices and transferring files, directories, or text over the local network.
  timeline:
    - >
      Later project development: The official LocalSend monorepo added a Rust-based
      terminal client using LocalSend Protocol v2.
  usage:
    - >
      Running `localsend-cli send` opens an interactive device list. A destination may
      also be selected non-interactively by exact alias or IP address, making the client
      suitable for terminal-driven transfers and scripts.
