id: brew:diffoscope
display-name: diffoscope
repo: https://salsa.debian.org/reproducible-builds/diffoscope
docs:
  - https://diffoscope.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official website documents installation paths through pip, Debian, Fedora,
      Gentoo, openSUSE, Arch Linux, FreeBSD, OpenBSD, NixOS, Homebrew, Docker images,
      and source tarballs. That breadth reflects its role as a cross-distribution
      diagnostic tool rather than a Debian-only utility.
  package-nerd-significance:
    - >
      Package maintainers care about diffoscope because it turns opaque binary
      differences into reviewable structure: archives, filesystem images, language
      bytecode, package formats, and metadata can be unpacked and compared in one
      workflow. It is one of the canonical tools for explaining reproducible-build
      failures.
  project-history:
    - >
      diffoscope began in the Debian reproducible-builds project, was originally named
      debbindiff, and is now developed as part of the wider Reproducible Builds
      initiative. The official README describes its purpose as quickly understanding why
      two builds of the same package produce different outputs.
  related-projects:
    - >
      The official site lists pkgdiff and Open Build Service build-compare as similar
      software, and the project is closely tied to reproducible-builds.org
      infrastructure.
  sources:
    - https://diffoscope.org/
    - https://salsa.debian.org/reproducible-builds/diffoscope/-/raw/master/README.rst
  summary:
    - >
      diffoscope is a deep comparison tool for files, archives, directories, and build
      artifacts. It recursively unpacks many formats and normalizes binary data into
      more human-readable forms so package builders can understand why two outputs
      differ.
  timeline:
    - '2010s: Started by the Debian reproducible-builds project under the name debbindiff.'
    - '2010s: Renamed diffoscope and developed under the wider Reproducible Builds initiative.'
    - '2026: Official site lists release 322 on 26 Jun 2026.'
  usage:
    - >
      diffoscope is used from the command line to compare two inputs and produce text or
      HTML reports. It exits with 0 when inputs are the same, 1 when they differ, and 2
      on trouble, which makes it scriptable in package build, CI, and reproducibility
      workflows.
related-packages:
  - id: brew:pkgdiff
    reason: >
      Choose pkgdiff for a narrower compatibility report between Linux software
      packages; choose diffoscope when you need recursive, format-aware inspection of
      arbitrary build artifacts.
    rel: alternative
    sources:
      - https://diffoscope.org/
      - https://lvc.github.io/pkgdiff/
