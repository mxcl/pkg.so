id: brew:gascity
display-name: Gas City
repo: null
docs:
  - https://docs.gascityhall.com/
  - https://github.com/gastownhall/gascity/tree/main/docs
config-file-location:
  unix:
    - ./city.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is young, but its official README and installation docs already
      present package-manager distribution through Homebrew and direct release builds.
      It is aimed first at users coming from Gas Town and developers building
      multi-agent coding workflows.
  package-nerd-significance:
    - >
      Gas City is notable as an early package-manager entrant in the fast-moving
      multi-agent coding tooling space: it packages tmux, Git, Beads, Dolt, shell
      utilities, and optional AI coding CLIs behind one orchestration command.
  project-history:
    - >
      The public repository was created in February 2026. Its README says Gas City
      extracts reusable infrastructure from Gas Town into a configurable toolkit with
      runtime providers, work routing, formulas, orders, health patrol, and declarative
      city configuration.
  related-projects:
    - >
      Gas City is related to Gas Town, Beads, Dolt, tmux, herdr, Kubernetes, ACP, and AI
      coding CLIs such as codex, claude, and gemini.
  sources:
    - https://api.github.com/repos/gastownhall/gascity
    - https://api.github.com/repos/gastownhall/gascity/releases?per_page=100
    - https://docs.gascityhall.com/
    - https://github.com/gastownhall/gascity
    - https://raw.githubusercontent.com/gastownhall/gascity/main/README.md
  summary:
    - >
      Gas City is a Go CLI and SDK for building orchestration infrastructure for
      multi-agent coding workflows.
  timeline:
    - '2026: Public GitHub repository created.'
    - '2026: v1.0.0 released in April.'
    - '2026: v1.3.2 released in June with an edge rolling-main release channel.'
  usage:
    - >
      Users install the gc command, initialize a city, start the controller/supervisor
      loop, add project rigs, and route work through Beads-backed tracking and runtime
      providers such as tmux, subprocess, exec, ACP, Kubernetes, and herdr.
related-packages:
  - id: brew:gastown
    reason: >
      Choose Gas Town for its opinionated town-and-rig workspace model; choose Gas City
      when you want to compose the same class of multi-agent workflow from declarative
      packs, providers, formulas, and orders.
    rel: alternative
    sources:
      - https://docs.gascityhall.com/getting-started/coming-from-gastown
      - https://github.com/gastownhall/gastown#readme
  - id: brew:beads
    reason: >
      Gas City uses Beads providers for durable work, mail, convoys, waits, and workflow
      state, making `bd` a direct companion to the orchestrator.
    rel: adjacent_workflow
    sources:
      - https://github.com/gastownhall/gascity#readme
      - https://gastownhall.github.io/beads/
  - id: brew:dolt
    reason: >
      Gas City's default Beads setup uses Dolt-backed storage, so Dolt supplies the
      versioned database layer for its durable orchestration state.
    rel: adjacent_workflow
    sources:
      - https://github.com/gastownhall/gascity#readme
      - https://docs.dolthub.com/
  - id: brew:tmux
    reason: >
      tmux is Gas City's default local runtime and a required prerequisite for the
      standard quickstart, providing persistent sessions for managed agents.
    rel: adjacent_workflow
    sources:
      - https://github.com/gastownhall/gascity#readme
      - https://github.com/tmux/tmux/wiki
tags:
  - cli
  - go
  - multi-agent
  - orchestration
  - sdk
provenance:
  category-sources:
    - Official README describes an orchestration-builder SDK for multi-agent coding workflows.
  display-name-sources:
    - Official README uses the display name Gas City.
  docs-sources:
    - Official README links the Gas City documentation site and docs directory.
  history-sources:
    - https://api.github.com/repos/gastownhall/gascity
    - https://api.github.com/repos/gastownhall/gascity/releases?per_page=100
    - https://docs.gascityhall.com/
    - https://github.com/gastownhall/gascity
    - https://raw.githubusercontent.com/gastownhall/gascity/main/README.md
  repo-sources:
    - >
      source_facts.repo already provides the official repository; repo returned null per
      prompt.
  tags-sources:
    - >
      Official README describes CLI, Go source build, multi-agent orchestration, and
      SDK/toolkit usage.
category-confidence: high
category-path:
  - developer-tools
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: high
tags-confidence: high
