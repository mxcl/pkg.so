history:
  adoption-history:
    - >
      Expert reached the 0.1.0 release line in March 2026 after several release
      candidates. The official installation page includes Homebrew as a supported
      package-manager path, and the supplied package metadata confirms a Homebrew
      formula.
  package-nerd-significance:
    - >
      Expert is interesting to package maintainers because language servers are editor
      infrastructure: users expect repeatable binary installs, architecture-specific
      releases, and integration through Homebrew, Nix, Mason, Mise, and editor-managed
      downloads.
  project-history:
    - >
      The official GitHub repository was created in 2024 under expert-lsp/expert and
      describes Expert as the official Elixir language server implementation. Its
      documentation presents installation via editor extensions, Homebrew, Mason, Nix,
      Mise, GitHub releases, and source builds.
  related-projects:
    - Expert is related to the Elixir language and the Language Server Protocol ecosystem.
    - >
      Official docs mention editor extensions, Mason, Nix, Mise, GitHub releases, and
      just-based source builds.
  sources:
    - https://expert-lsp.org/docs/changelog/
    - https://expert-lsp.org/docs/configuration/
    - https://expert-lsp.org/docs/installation/
    - https://github.com/expert-lsp/expert
    - source_facts.package-manager
  summary:
    - >
      Expert is the official Language Server Protocol implementation for Elixir. It
      provides editor-facing language intelligence and ships as a standalone executable.
  timeline:
    - '2024: GitHub API reports expert-lsp/expert repository creation.'
    - '2026-02: Official changelog records 0.1.0 release candidates.'
    - '2026-03-27: Official changelog records Expert 0.1.0.'
    - '2026-07: GitHub tags list v0.1.6.'
  usage:
    - >
      Expert is typically installed on PATH and configured through an editor's LSP
      client. The official README notes that clients should pass --stdio when the editor
      does not do so automatically, and the configuration page documents settings such
      as workspaceSymbols.minQueryLength.
related-packages:
  - id: brew:elixir-ls
    reason: >
      Choose ElixirLS when you need the older, mature Elixir language server and debug
      adapter instead of the newer official Expert implementation.
    rel: alternative
    sources:
      - https://expert-lsp.org/
      - https://elixir-lsp.github.io/elixir-ls/
      - https://elixir-lang.org/blog/2024/08/15/welcome-elixir-language-server-team/
  - id: brew:elixir
    reason: >
      Install Elixir alongside Expert because the language server analyzes and compiles
      Elixir Mix projects using the Elixir and Erlang toolchain.
    rel: adjacent_workflow
    sources:
      - https://expert-lsp.org/docs/installation/
      - https://elixir-lang.org/docs.html
