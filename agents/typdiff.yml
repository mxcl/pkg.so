history:
  adoption-history:
    - >
      The official README supports installation through mise, crates.io, and source
      builds; the supplied metadata also records distribution as the Homebrew formula
      typdiff.
  package-nerd-significance:
    - >
      typdiff brings the familiar latexdiff workflow to Typst while producing ordinary
      Typst source that can be inspected, edited, or compiled. Its Rust implementation,
      prebuilt-binary workflow, and package-manager availability make it a compact
      example of tooling growing around the Typst ecosystem.
  project-history:
    - >
      typdiff was created as a Typst-oriented counterpart to latexdiff. It parses two
      Typst source files, compares block and word-level content, and renders additions
      and deletions back into compilable Typst markup.
  related-projects:
    - Typst is the document system consumed by typdiff.
    - latexdiff is the LaTeX tool explicitly cited as the project's conceptual analogue.
    - The implementation uses typst-syntax and the Patience diff algorithm.
  sources:
    - >
      https://github.com/sou1118/typdiff#readme — official project description,
      installation, usage, features, and implementation notes.
    - source_facts.package-manager — records the Homebrew formula name.
  summary:
    - >
      typdiff is a command-line differ for Typst source documents. It generates a new
      Typst document with visual markup for added and deleted material.
  timeline:
    - "2026: The official repository's release automation recorded the v0.1.1 release."
  usage:
    - >
      Run `typdiff OLD NEW` to write the generated Typst diff to standard output, or add
      `-o OUTPUT` to save it. The output can then be compiled with `typst compile` to
      produce a visually marked-up PDF.
