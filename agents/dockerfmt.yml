config-file-location:
  unix:
    - ./.editorconfig
  windows:
    - .\.editorconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      Because dockerfmt is new, public adoption evidence is still thin. Its
      package-manager footprint is nevertheless real: Homebrew reported stable version
      0.5.4, 69 installs in the previous 30 days, and 548 installs in the previous year
      as of June 30, 2026.
    - >
      Its adoption story is also a lineage story: it exists because Dockerfile
      formatting remained useful after `dockfmt`, while modern BuildKit syntax, shell
      formatting expectations, pre-commit workflows, and CI images needed a fresher
      implementation.
  package-nerd-significance:
    - >
      dockerfmt is package-nerd significant because formatters become part of project
      policy. By exposing a Go binary, Docker image, pre-commit hook, and JS/WASM
      bindings, it tries to make Dockerfile formatting usable from local editors, CI,
      JavaScript tooling, and ordinary package managers.
  project-history:
    - >
      The reteps/dockerfmt repository was created in April 2025 and published its
      initial alpha release the next day. The README presents it as a modern successor
      to Jessie Frazelle's earlier `dockfmt`, built on the Moby BuildKit parser and
      using `shfmt` for shell fragments inside Dockerfile `RUN` steps.
    - >
      The project quickly moved through 0.2.x releases in April 2025 and reached 0.5.4
      in June 2026. The README's feature set includes whitespace normalization,
      inline-comment preservation, legacy `ENV key value` conversion, deprecated
      `MAINTAINER` conversion to `LABEL`, heredoc support, stdin/file operation,
      pre-commit support, JS/WASM bindings, and a Docker image for CI.
  related-projects:
    - >
      dockerfmt is directly related to `dockfmt`, Moby BuildKit's Dockerfile parser, and
      `shfmt`.
    - >
      It also fits into pre-commit and CI formatting workflows, similar to
      language-specific formatters such as gofmt and prettier, but for Dockerfiles.
  sources:
    - https://github.com/reteps/dockerfmt#readme
    - https://api.github.com/repos/reteps/dockerfmt
    - https://github.com/reteps/dockerfmt/releases/tag/0.1.0-alpha
    - https://github.com/reteps/dockerfmt/releases/tag/v0.5.4
    - https://formulae.brew.sh/api/formula/dockerfmt.json
  summary:
    - >
      dockerfmt is a young, opinionated Dockerfile formatter that combines Dockerfile
      parsing with shell-command formatting for `RUN` instructions.
  timeline:
    - '2025: Repository created and 0.1.0-alpha initial release published.'
    - '2025: 0.2.x releases added JavaScript release work and bug fixes.'
    - '2026: 0.5.4 released and Homebrew formula reports stable 0.5.4.'
  usage:
    - >
      Users run `dockerfmt Dockerfile` to print formatted output, `dockerfmt -w
      Dockerfile` to rewrite files, `dockerfmt -c Dockerfile` to check formatting, or
      pipe Dockerfiles through stdin. It can read EditorConfig properties such as
      `indent_size` and `insert_final_newline` when formatting files by path.
related-packages:
  - id: brew:hadolint
    reason: >
      Run dockerfmt for deterministic Dockerfile layout and Hadolint afterward for
      Dockerfile best-practice rules and ShellCheck-backed analysis of `RUN`
      instructions.
    rel: adjacent_workflow
    sources:
      - https://github.com/reteps/dockerfmt#readme
      - https://github.com/hadolint/hadolint#readme
  - id: brew:pre-commit
    reason: >
      dockerfmt publishes an official pre-commit hook, allowing formatting checks or
      rewrites to run automatically before commits.
    rel: adjacent_workflow
    sources:
      - https://github.com/reteps/dockerfmt#pre-commit
      - https://pre-commit.com/
