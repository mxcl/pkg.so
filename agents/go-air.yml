id: brew:go-air
display-name: Air
repo: null
docs:
  - https://github.com/air-verse/air#readme
config-file-location:
  unix:
    - .air.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Air became popular with Go developers because it removes a repetitive
      edit-build-run loop without requiring a framework. Web services, APIs, command
      servers, and containerized development environments can all use the same
      watch-and-restart model.
    - >
      Its adoption surface is developer workstations and development containers rather
      than production runtime. Package managers carry it because it is a small workflow
      tool that developers expect to install globally or invoke inside project scripts.
  package-nerd-significance:
    - >
      Air is package-manager friendly because it is a single developer CLI with a
      project-local config file and no service state. The interesting packaging detail
      is the formula name go-air versus the executable name air, a common trick when a
      short upstream command name would be ambiguous.
  project-history:
    - >
      The Air README explains that the tool was written after using Gin for live reload
      and then Fresh, with Air intended as a better-fitting live-reload runner for Go
      applications. Its public repository became the canonical documentation surface,
      with installation, configuration, Docker, and command examples kept close to the
      source.
    - >
      The project later lived under the air-verse organization while retaining the
      familiar air command and configuration format. Its package identity in Homebrew is
      go-air, which avoids colliding with other software named Air while still
      installing the air executable.
  related-projects:
    - >
      Gin and Fresh are named by the README as earlier Go live-reload tools that
      influenced Air.
    - >
      Docker and Docker Compose workflows are documented as common ways to run Air in
      containers.
    - >
      Go web services and command servers are the usual projects wrapped by Air during
      development.
  sources:
    - https://formulae.brew.sh/formula/go-air
    - https://github.com/air-verse/air
    - https://github.com/air-verse/air#readme
  summary:
    - >
      Air is a Go development helper that watches project files, rebuilds an
      application, and restarts it during local development. It sits in the same
      practical niche as live-reload tools for web frameworks, but it stays focused on
      Go binaries and a small TOML configuration file.
  timeline:
    - '2010s: Air emerged from the Go live-reload tooling lineage that included Gin and Fresh.'
    - '2020s: The air-verse repository served as the main source and README documentation home.'
    - '2020s: Homebrew packaged the tool as go-air while installing the air command.'
  usage:
    - >
      Practitioners place an .air.toml file in a Go project, configure build and run
      commands, and let air watch source files. The README documents direct CLI use,
      initialization of the config file, Docker and Docker Compose use, and
      customization of watched directories and excluded paths.
    - >
      The tool is most useful during iterative development of long-running Go programs,
      especially HTTP services. It can also be used as a generic file-triggered rebuild
      loop when the build command is customized.
related-packages:
  - id: brew:reflex
    reason: >
      Choose Reflex when the watched command may use any language and you want explicit
      glob or regular-expression filtering instead of Air's Go-oriented build defaults.
    rel: alternative
    sources:
      - https://github.com/cespare/reflex
      - https://github.com/air-verse/air#readme
  - id: brew:watchexec
    reason: >
      Choose watchexec for a language-neutral, cross-platform command rerunner; choose
      Air when you want a Go-focused build-and-restart workflow driven by .air.toml.
    rel: alternative
    sources:
      - https://watchexec.github.io/
      - https://watchexec.github.io/docs/
      - https://github.com/air-verse/air#readme
  - id: brew:go-blueprint
    reason: >
      Go-Blueprint can scaffold projects with an .air.toml file and a Makefile watch
      target that invokes Air, providing a ready-made live-reload workflow.
    rel: adjacent_workflow
    sources:
      - https://docs.go-blueprint.dev/
      - https://docs.go-blueprint.dev/creating-project/makefile/
      - https://github.com/air-verse/air#readme
