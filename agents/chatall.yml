history:
  adoption-history:
    - >
      ChatALL was released for Windows, macOS, and Linux and is available on macOS
      through a Homebrew cask. Its audience includes LLM users comparing answers,
      researchers evaluating model behavior, and developers testing prompts across
      foundation models.
  package-nerd-significance:
    - >
      ChatALL packages a distinctly generative-AI-era workflow: one desktop client
      coordinating many independently operated chatbot services. Maintainers must track
      both the Electron application and integrations that can break when providers
      change their web interfaces or authentication requirements.
  project-history:
    - >
      ChatALL began under Sun Jian's GitHub account and is now maintained in the
      ai-shifu organization. It was inspired by ChatHub and developed as an open-source
      desktop client that submits a prompt to several AI bots concurrently.
  related-projects:
    - >
      The upstream project credits ChatHub as an inspiration. ChatALL integrates
      external chatbot websites and APIs rather than providing its own language model.
  sources:
    - https://github.com/ai-shifu/ChatALL#readme
    - source_facts.package-manager
    - source_facts.repo
  summary:
    - >
      ChatALL is a cross-platform desktop client for sending the same prompt to multiple
      AI chatbots and comparing their answers.
  timeline:
    - >
      The official repository moved from github.com/sunner/ChatALL to the ai-shifu
      organization.
  usage:
    - >
      Users enable selected bots, authenticate with the required provider accounts or
      API tokens, and submit prompts for parallel responses. ChatALL supports multiple
      conversations, prompt management, local chat history, and proxy configuration. The
      project warns that web-connected integrations may break when providers change
      their interfaces or security measures.
