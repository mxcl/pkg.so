history:
  adoption-history:
    - >
      TIDAL says the service is available in more than 60 countries. Its catalog and
      positioning emphasize lossless or high-fidelity listening, music video, editorial
      curation, and a closer artist-to-fan relationship.
    - >
      The desktop client gives macOS and Windows users a native route to the service
      alongside its web and mobile clients. Homebrew Cask packaging makes the macOS
      application reproducibly discoverable and installable from the command line.
  package-nerd-significance:
    - >
      For package-manager users, TIDAL represents a mainstream proprietary subscription
      application distributed as a cask rather than a build-from-source package. The
      cask automates installation of the vendor's signed desktop artifact while
      accounts, subscriptions, downloads, and playback state remain managed by TIDAL.
    - >
      Its value in a package catalog is primarily workstation bootstrapping: a user can
      restore the desktop music client alongside development tools and other
      applications using the same declarative Homebrew workflow.
  project-history:
    - >
      TIDAL states that the service launched in 2014. In 2015, a group of artists led by
      JAY-Z acquired the service and promoted an artist-first model built around fairer
      compensation and high-quality listening.
    - >
      Square acquired a majority stake in TIDAL in 2021; TIDAL subsequently became part
      of Block, Inc. The company continues to describe itself as an artist-first,
      fan-centered streaming platform.
  related-projects:
    - TIDAL web player and mobile applications
    - Block, Inc.
    - Homebrew Cask
  sources:
    - >
      Official TIDAL history discussion:
      https://tidal.com/magazine/article/not-just-better-different/1-81695
    - >
      Official TIDAL introduction:
      https://support.tidal.com/hc/en-us/articles/202992312-Introduction-to-Tidal
    - >
      Official TIDAL launch-history reference:
      https://tidal.com/magazine/article/what-were-working-on-and-why-3/1-98780
    - >
      Official desktop documentation:
      https://support.tidal.com/hc/en-us/sections/115001618769-Desktop
    - source_facts.package-manager and source_facts.provenance
  summary:
    - >
      TIDAL is a subscription music-streaming service launched in 2014 and distributed
      on macOS as a proprietary desktop application. It is known for high-fidelity
      playback, music video, editorial programming, and an artist-first business
      identity.
  timeline:
    - '2014: TIDAL says the streaming service launched.'
    - '2015: An artist group led by JAY-Z acquired TIDAL.'
    - >
      2021: Square acquired a majority stake, bringing TIDAL into the company later
      renamed Block.
    - '2026: TIDAL described itself as available in more than 60 countries.'
  usage:
    - >
      Users sign in with a TIDAL account to stream and organize music and video, search
      the catalog, create playlists, save favorites, and use listening-history features.
    - >
      The desktop application supports macOS and Windows. Linux is not officially
      supported according to TIDAL's system-requirements documentation.
