history:
  adoption-history:
    - >
      The project distributes builds for Windows, macOS, and Linux. Its official README
      documents installation through Homebrew and WinGet alongside direct releases, and
      its plugin system extends the client with synchronization and storage
      integrations.
  package-nerd-significance:
    - >
      Termora is notable as a comparatively young, open-source, Kotlin/JVM graphical
      terminal in a space dominated by older native clients and Electron applications.
      Its Homebrew cask makes the macOS build accessible through a conventional
      package-manager workflow.
  project-history:
    - >
      Termora began its public repository history in 2025 as a cross-platform terminal
      emulator and SSH client. It is implemented with Kotlin/JVM and partially
      implements the XTerm control-sequence protocol.
    - >
      The project broadened beyond interactive SSH sessions with SFTP file management,
      server-to-server transfers, an editor, host organization, SSH-agent and X11
      integration, and a plugin ecosystem. The 2.x line has been developed through
      public beta releases.
  related-projects:
    - Termora Marketplace is the project's official plugin catalog.
    - XTerm supplies the terminal-control-sequence model that Termora partially implements.
  sources:
    - 'Official product site: https://www.termora.app/'
    - 'Official project organization: https://github.com/TermoraDev'
    - 'Official project repository and README: https://github.com/TermoraDev/termora'
    - 'Official release history: https://github.com/TermoraDev/termora/releases'
  summary:
    - >
      Termora is an open-source, cross-platform terminal emulator and SSH client written
      with Kotlin/JVM. It combines remote shells, local terminals, SFTP, host
      organization, file editing, forwarding, and plugins.
  timeline:
    - "2025: Termora's public GitHub project history began."
    - '2025: Homebrew and WinGet installation were documented by the project.'
    - '2026: Development of the 2.x line continued through public beta releases.'
  usage:
    - >
      Users maintain a tree of tagged hosts, open SSH or local terminal sessions,
      transfer and edit files through SFTP, configure forwarding, use stored keys, and
      add integrations through plugins.
