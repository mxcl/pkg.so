config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Doxie distributes the desktop application as the required companion for Doxie Pro
      and as the import and document-management application for other Doxie scanner
      generations.
  package-nerd-significance:
    - >
      The Homebrew cask is useful because it makes a proprietary hardware companion
      application reproducibly discoverable and installable alongside ordinary Mac
      software, although the scanner remains the center of the ecosystem.
  project-history:
    - >
      Official quick-start material for the original Doxie was available by 2012, while
      current Doxie Pro documentation distributes Doxie 3.5.1 for macOS and Windows.
  related-projects:
    - >
      Doxie Pro, Doxie Q, Doxie Go, and Doxie One are scanner families supported by
      versions of the Doxie software and documentation ecosystem.
  sources:
    - https://help.getdoxie.com/content/originaldoxie/01_qsg/Doxie_Quick_Start.pdf
    - https://help.getdoxie.com/doxiepro/basics/setup/
    - https://help.getdoxie.com/doxiepro/software/
  summary:
    - >
      Doxie is the proprietary desktop companion for Apparent's Doxie document scanners.
      It imports or acquires scans, organizes and combines pages, performs OCR, and
      exports documents to local applications or cloud services.
  timeline:
    - >
      2012: Official original-Doxie quick-start documentation described the Mac and PC
      companion app.
    - '2017: Official Doxie Q API documentation covered the wireless scanner family.'
    - '2026: Doxie Pro documentation offered Doxie 3.5.1 for macOS and Windows.'
  usage:
    - >
      Install Doxie before initially connecting a Doxie Pro. The application guides
      scanner setup, imports or captures pages, supports scan adjustments and stacking,
      creates searchable PDFs with OCR, and sends results to files, applications, or
      cloud services.
tags:
