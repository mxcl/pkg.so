id: brew:betty
display-name: Betty
repo: null
docs:
  - https://github.com/pickhardt/betty#readme
config-file-location:
  unix:
    - ~/.bettyconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      Betty's package history is narrow compared with the other tools in this batch: the
      input records Homebrew packaging only. Its adoption belongs mostly to the 2010s
      wave of playful natural-language CLI helpers rather than to a broad multi-distro
      system package footprint.
  package-nerd-significance:
    - >
      Betty is package-nerd interesting as a small artifact of the pre-LLM
      natural-language CLI era: it packaged a phrase-to-command rule set as an
      installable Unix tool, showing how command discovery and shell ergonomics were
      explored before modern AI assistants.
  project-history:
    - >
      The GitHub repository was created in May 2014. Its README presents Betty as
      version 0.1.8, documents a broad set of command phrases, and notes that the
      original maintainer no longer has time to actively maintain it while remaining
      open to new maintainers.
  related-projects:
    - >
      Related projects include shell command explainers and natural-language assistants
      such as howdoi, tldr-style command discovery tools, and later AI-backed shell
      helpers.
  sources:
    - https://api.github.com/repos/pickhardt/betty
    - https://raw.githubusercontent.com/pickhardt/betty/master/README.md
    - source_facts.package-manager
  summary:
    - >
      Betty is a Ruby command-line assistant that translates English-like phrases into
      shell commands, pitched by its README as a friendly natural-language interface for
      users who do not remember exact commands.
  timeline:
    - '2014: Repository created in May.'
    - '2010s: README documents version 0.1.8 and an English-like command catalog.'
    - >
      2021: Repository metadata shows later maintenance activity, but the README asks
      for new maintainers.
  usage:
    - >
      Users invoke commands such as asking for word counts, dates, file searches,
      archive extraction, process lists, permissions changes, and music controls. Betty
      prints the command it is about to run and can ask users to choose among multiple
      matching commands.
related-packages: []
tags:
  - cli
  - command-runner
  - natural-language
  - shell
