id: cask:nova
display-name: Nova
repo: null
docs:
  - https://docs.nova.app/
  - https://help.nova.app/
config-file-location:
  macos:
    - <project-root>/.nova/
    - ~/Library/Application Support/Nova/Extensions
credentials-file-location:
  macos:
    - macOS Keychain
history:
  adoption-history:
    - >
      Nova principally attracted Mac developers who wanted a native editor with
      integrated Git, terminals, remote file access, tasks, debugging, language servers,
      and extensions. Panic explicitly positioned it as the path forward for users of
      Coda.
    - >
      Its extension library and project-local settings broadened Nova beyond Coda's
      original web-development focus while preserving a Mac-native workflow.
  package-nerd-significance:
    - >
      Nova is a prominent independently distributed proprietary developer tool for
      macOS. Its project-local .nova directory, command-line launcher, extensions, and
      language-server support connect traditional native Mac software with contemporary
      programmable-editor workflows.
  project-history:
    - >
      Panic announced Nova in July 2019 as a complete rewrite and replacement for its
      Coda editor. The announcement opened applications for a private beta and described
      Nova as a new native Mac editor.
    - >
      Nova was publicly released in September 2020, followed by Panic's launch
      announcement in October. It combined a native editor with projects, Git,
      terminals, remote file tools, tasks, debugging, and an extension system.
  related-projects:
    - Coda
    - Transmit
    - Language Server Protocol
    - Git
  sources:
    - 'Official announcement: https://blog.panic.com/nova-our-next-big-thing/'
    - 'Official launch article: https://blog.panic.com/nova-is-here/'
    - 'Official migration documentation: https://help.nova.app/faqs/moving-data/'
    - 'Official product documentation: https://help.nova.app/'
  summary:
    - Nova is Panic's proprietary native code editor for macOS and the successor to Coda.
  timeline:
    - "2007: Panic released Coda, Nova's predecessor."
    - '2019: Panic announced Nova and its private beta.'
    - '2020: Nova was publicly released and Coda 2 was discontinued.'
  usage:
    - >
      Developers use Nova to edit local or remote projects, work with Git repositories,
      run terminal sessions and project tasks, debug supported languages, and publish
      files to remote servers.
    - >
      Nova keeps project-specific settings and data in a hidden .nova directory at the
      project root. Server passwords are stored in the macOS Keychain; Nova can also use
      SSH keys and Panic Sync.
