history:
  adoption-history:
    - >
      Skim was designed specifically to help users read and annotate scientific papers.
      Its official feature set includes LaTeX, SyncTeX, PDFSync, BibDesk, and
      AppleScript integration, giving it a durable role in Mac-based academic and
      technical-document workflows.
    - >
      The SourceForge release archive documents continuous releases from early 0.x
      builds in 2007 through modern macOS versions.
  package-nerd-significance:
    - >
      Skim is a long-lived open-source native Mac utility built around a focused
      research workflow rather than a general office suite.
    - >
      Its scriptability, TeX synchronization, separate SkimNotes tooling, and Keychain
      integration make it especially interesting to users who combine GUI applications
      with automated scholarly workflows.
  project-history:
    - >
      Skim began as an open-source PDF reader and note-taking application for Mac OS X.
      Public 0.x releases appeared in 2007, followed by version 1.0 in December 2007.
    - >
      The project has continued to track macOS and PDFKit behavior while expanding
      annotation, presentation, automation, accessibility, and TeX synchronization
      features.
  related-projects:
    - >
      The SkimNotes framework and command-line tool support access to Skim annotations
      outside the main application.
    - >
      Skim integrates with LaTeX workflows through SyncTeX and PDFSync and with
      bibliography software such as BibDesk.
  sources:
    - https://skim-app.sourceforge.io/
    - https://skim-app.sourceforge.io/manual/
    - https://skim-app.sourceforge.io/relnotes.html
    - https://sourceforge.net/projects/skim-app/files/Skim/
  summary:
    - >
      Skim is an open-source macOS PDF reader and note-taking application oriented
      toward reading and annotating scientific papers.
  timeline:
    - '2007-04: Skim 0.2 appears in the official release archive.'
    - '2007-12: Skim 1.0 is released.'
    - '2021: Skim 1.6 is released.'
    - '2024: Skim 1.7 is released.'
  usage:
    - >
      Users view PDFs, add and edit notes, highlight text, create snapshots, search and
      bookmark documents, give presentations, and automate tasks with AppleScript.
    - >
      Research workflows can synchronize PDFs with LaTeX source through SyncTeX or
      PDFSync. Passwords for protected documents can be saved in the macOS Keychain.
