history:
  adoption-history:
    - >
      Aloha expanded from mobile platforms to desktop distribution on Windows and macOS,
      with the official download page now also offering Linux packages. The macOS
      application is distributed through Homebrew Cask as aloha-browser.
    - >
      The official help center maintains separate documentation sections for iPhone,
      iPad, Android, Aloha Lite, Windows, and macOS, reflecting adoption across multiple
      device classes rather than a macOS-only utility.
  package-nerd-significance:
    - >
      Aloha sits in the privacy-browser niche while bundling features commonly installed
      separately: VPN, tracker and advertisement blocking, private browsing, password
      management, file handling, and media tools. Package enthusiasts may also note that
      Aloha publishes its Chromium-derived engine separately as Aloha Core, although
      that engine repository is not treated here as the repository of the packaged
      desktop application.
    - >
      Its Homebrew Cask entry provides a repeatable installation route for a browser
      whose primary distribution is otherwise vendor-hosted disk images.
  project-history:
    - >
      Aloha Browser originated as a privacy-oriented browser and developed into a
      multi-platform product spanning mobile and desktop systems. Its official site
      emphasizes private browsing, an integrated VPN, advertisement and tracker
      blocking, application locking, and file-management features.
    - >
      The vendor publishes Aloha Core, its Chromium-derived browser engine, as open
      source. The packaged Aloha desktop application is a broader product, so the engine
      repository is related source code rather than a confidently identified repository
      for the entire cask project.
  related-projects:
    - >
      Aloha Core is the Chromium-derived engine published by the AlohaBrowser
      organization at https://github.com/AlohaBrowser/aloha-core.
    - Chromium is the upstream browser project from which Aloha Core is derived.
    - >
      Brave and Opera are compared with Aloha on the official product site as
      alternative browsers offering overlapping privacy or VPN features.
  sources:
    - 'Official Aloha Core repository: https://github.com/AlohaBrowser/aloha-core'
    - >
      Official desktop update, 10 September 2025:
      https://alohabrowser.com/posts-aloha-browser-desktop-gets-new-languages-and-updated-vpn/
    - >
      Official desktop update, 20 November 2024:
      https://alohabrowser.com/posts-top-features-of-the-aloha-browser-update-for-windows/
    - 'Official downloads page: https://alohabrowser.com/download.html'
    - 'Official help center: https://community.alohabrowser.com/knowledge-base/articles'
    - 'Official homepage: https://alohabrowser.com/'
    - source_facts.package-manager
  summary:
    - >
      Aloha Browser is a cross-platform, privacy-focused web browser with an integrated
      VPN, advertisement and tracker blocking, private browsing, password management,
      and download and file-management features.
  timeline:
    - >
      20 November 2024: Aloha published an official Windows update highlighting more
      interface languages and TrafficMask.
    - >
      10 September 2025: The desktop browser added Spanish, Portuguese, and Chinese
      localization, macOS automatic updates, and VPN improvements.
    - >
      22 October 2025: Aloha announced an enhanced, locally processed Snips feature for
      Windows and macOS.
  usage:
    - >
      Users employ Aloha as a general-purpose browser when they want privacy controls
      and VPN access integrated into the browser. The official knowledge base documents
      bookmarks, private mode, browsing settings, profile synchronization, password
      management, VPN operation, and downloads for desktop systems.
    - >
      On macOS, the Homebrew Cask installs Aloha.app. Premium features and cross-device
      synchronization can use an Aloha Profile, but no official standalone
      credentials-file path is documented.
