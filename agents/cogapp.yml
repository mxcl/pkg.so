id: brew:cogapp
display-name: Cog
repo: https://github.com/nedbat/cog
docs:
  - https://cog.readthedocs.io/en/latest
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Cog has remained a niche but durable tool in the package ecosystem because it
      solves a specific build-time problem: generating repetitive source or
      documentation fragments without introducing a full templating framework.
  package-nerd-significance:
    - >
      Cog is packaging-interesting because the install name and command name differ, and
      because it is often used as a source-tree generation helper rather than a runtime
      dependency.
  project-history:
    - >
      The official documentation records Cog as created in February 2004 and describes
      its model as finding embedded Python code, executing it, and inserting the
      generated text back into the original file.
    - >
      The changelog shows a long-running Python utility with early 2.x releases, Python
      3 support added in 2012, a 3.0.0 release in 2019, CI-oriented --check support in
      2021, and documentation moved to Read the Docs in 2024.
  related-projects:
    - >
      Cog overlaps with code generators, preprocessors, and templating tools, but its
      official docs frame it as a lightweight way to put small Python computations
      inside static files.
  sources:
    - https://cog.readthedocs.io/en/latest/
    - https://cog.readthedocs.io/en/latest/changes.html
    - https://github.com/nedbat/cog
  summary:
    - >
      Cog is a small Python-based content generation tool for embedding executable
      Python snippets inside otherwise static files and replacing marked regions with
      generated output.
  timeline:
    - '2004: Cog documentation records the project as created.'
    - '2012: Python 3 support is documented.'
    - '2019: Cog 3.0.0 is released.'
    - '2021: The --check option is added for continuous integration workflows.'
    - '2024: Documentation moves to Read the Docs.'
  usage:
    - >
      Users install the Python package as cogapp but receive a cog command. Typical
      usage is to keep generator code in comment-safe markers inside source or static
      files, then run cog to refresh generated regions.
related-packages: []
tags:
  - cli
  - code-generation
  - python
  - static-files
  - templating
provenance:
  category-sources:
    - Official GitHub README describes Cog as a content generation tool for static files.
    - >
      source_facts.description says cogapp provides small bits of Python computation for
      static files.
  display-name-sources:
    - Official GitHub README title uses Cog.
    - source_facts.homepage points to the Cog documentation site.
  docs-sources:
    - Official GitHub README links to cog.readthedocs.io for details.
    - source_facts.homepage is the official Read the Docs documentation URL.
  history-sources:
    - https://cog.readthedocs.io/en/latest/
    - https://cog.readthedocs.io/en/latest/changes.html
    - https://github.com/nedbat/cog
  repo-sources:
    - >
      Official GitHub repository nedbat/cog identifies itself as Cog and says the code
      repository and issue tracker are on GitHub.
  tags-sources:
    - source_facts.description mentions Python computation for static files.
    - source_facts.executables lists the cog CLI.
category-confidence: high
