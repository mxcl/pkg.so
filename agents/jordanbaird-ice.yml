history:
  adoption-history:
    - >
      Ice gained attention as a free, open-source macOS utility for organizing
      increasingly crowded menu bars. Homebrew Cask support made installation
      straightforward, while its roadmap expanded from basic hiding and showing toward
      an Ice Bar, search, appearance controls, custom spacing, hotkeys, and
      drag-and-drop arrangement.
  package-nerd-significance:
    - >
      Ice is representative of a popular Homebrew Cask niche: small, focused macOS
      utilities that alter daily desktop ergonomics but are easiest to install and
      update declaratively. Its GPL-licensed Swift codebase also offers an open-source
      option in a category containing several proprietary utilities.
  project-history:
    - >
      Jordan Baird created Ice as a macOS menu bar manager focused on hiding and
      revealing menu bar items. The project has remained under active development, with
      release work responding closely to changes in macOS menu bar behavior and
      permission models.
  related-projects:
    - Ice depends on macOS menu bar, screen-capture, accessibility, and event-handling APIs.
    - >
      Its official roadmap groups future work around menu bar profiles, triggers,
      widgets, spacing, and item management.
  sources:
    - https://github.com/jordanbaird/Ice
    - https://github.com/jordanbaird/Ice/blob/main/FREQUENT_ISSUES.md
    - https://github.com/jordanbaird/Ice/discussions/588
    - https://github.com/jordanbaird/Ice/releases
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      Ice is an open-source menu bar manager for modern macOS. It hides and reveals menu
      bar items and adds optional sections, the Ice Bar, search, hotkeys, layout tools,
      spacing controls, and appearance customization.
  timeline:
    - >
      2024: The 0.10 release series documented rapid expansion of Ice Bar and menu-bar
      management behavior.
    - >
      2025: Ice published development builds addressing the redesigned menu bar in macOS
      26 Tahoe.
  usage:
    - >
      Users place Ice's divider items in the menu bar, move other status items into
      visible, hidden, or always-hidden sections, and reveal those sections with clicks,
      hover behavior, scrolling, or hotkeys. Screen-recording and related macOS
      permissions are needed for parts of the layout-management feature set.
