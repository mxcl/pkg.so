history:
  adoption-history:
    - >
      TruHu initially launched for macOS in 2023 and added Windows support about a year
      later. It is distributed as paired desktop and iPhone applications and offered as
      a subscription product.
  package-nerd-significance:
    - >
      TruHu is unusual among display-calibration utilities because it substitutes a
      supported iPhone camera and per-model lookup data for a dedicated hardware
      colorimeter, while still producing an ICC profile for the desktop display.
  project-history:
    - >
      Color consultant Clark Omholt conceived TruHu after Apple exposed RAW camera data
      on iPhones. The project built lookup data for supported iPhone models so camera
      measurements could be converted into colorimetric information for monitor
      calibration.
  related-projects:
    - >
      TruHu presents itself as a software-based alternative to dedicated calibration
      products such as Datacolor Spyder and Calibrite display colorimeters.
  sources:
    - 'Official Windows-launch history: https://truhu.app/blog/?p=8310'
    - 'Official product site: https://truhu.app/'
    - 'Official usage guide: https://truhu.app/blog/using-truhu-intro/'
  summary:
    - >
      TruHu is a monitor-calibration system that pairs an iPhone camera with a macOS or
      Windows desktop companion to generate custom ICC display profiles.
  timeline:
    - '2023: TruHu launched for macOS'
    - '2024: TruHu launched for Windows'
  usage:
    - >
      Users run TruHu on both the computer and a supported iPhone, prepare the ambient
      lighting and display brightness, select a color temperature, and photograph
      displayed targets. The desktop application then generates and applies an ICC color
      profile.
