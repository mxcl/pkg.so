history:
  adoption-history:
    - >
      csvkit became a common package-manager fixture because it provides many small
      Unix-style commands under one distribution: in2csv, csvcut, csvgrep, csvjoin,
      csvjson, csvlook, csvsql, csvstack, csvstat, sql2csv, and others. The input
      package metadata records distribution through Homebrew, Debian, Nix, Arch, and
      Ubuntu.
    - >
      The README advertises PyPI download and version badges, while the documentation is
      hosted on Read the Docs. That combination made csvkit both a Python package and a
      system-package dependency for users who wanted spreadsheet and database conversion
      without opening a GUI.
  package-nerd-significance:
    - >
      csvkit is package-significant because it bundles a vocabulary of CSV subcommands
      into one installable toolchain. It is also a useful comparison point for newer
      single-purpose tools: csview's own README benchmarks against csvkit's csvlook,
      showing how csvkit remains a reference implementation even when leaner tools
      optimize a narrower job.
  project-history:
    - >
      The upstream README describes csvkit as a suite for working with CSV, inspired by
      pdftk, GDAL, and the original csvcut tool by Joe Germuska and Aaron Bycoffe. Its
      changelog begins in 2012 and records steady expansion from conversion and
      inspection utilities into SQL import/export, GeoJSON, compressed input, richer
      type inference, and Python-version maintenance.
    - >
      Version 1.0.0 arrived in December 2016. The 2.0.0 release in May 2024 was the
      first major release since 1.0.0 and included backwards-incompatible csvclean
      behavior changes, new checks, and a renewed focus on standard streams and explicit
      options.
  related-projects:
    - >
      csvkit is related to agate, which it uses internally, and to the original csvcut,
      pdftk, and GDAL inspirations named by upstream. It is commonly compared with xsv,
      Miller, q, and other command-line tabular-data tools.
  sources:
    - https://csvkit.readthedocs.io/
    - https://github.com/wireservice/csvkit#readme
    - https://github.com/wireservice/csvkit/blob/master/CHANGELOG.rst
  summary:
    - >
      csvkit is a Python suite of command-line tools for converting, inspecting,
      querying, and transforming CSV and other tabular data formats.
  timeline:
    - '2012: Changelog begins at 0.4.3.'
    - >
      2012: 0.5.0 adds csvpy, GeoJSON support, Windows scripts, and lower-memory
      multi-file handling.
    - '2014: 0.7.0 merges sql2csv and improves SQL-on-CSV workflows.'
    - '2016: 1.0.0 is released.'
    - '2024: 2.0.0 ships as the first major release since 2016.'
    - '2025: 2.2.0 adds Python 3.14 support and drops Python 3.9.'
  usage:
    - >
      Typical use is shell-oriented: convert Excel, JSON, DBF, or SQL data to CSV,
      select or filter columns, join files, pretty-print tables with csvlook, compute
      statistics with csvstat, or create/query database tables with csvsql. Its role
      overlaps with small Unix text tools but handles CSV dialects, quoting, encodings,
      and tabular types explicitly.
related-packages:
  - id: brew:qsv
    reason: >
      Choose qsv when csvkit's official documentation warns that performance or file
      size has become limiting and a faster, large-data-oriented CSV toolkit is needed.
    rel: alternative
    sources:
      - https://csvkit.readthedocs.io/en/latest/
      - https://qsv.dathere.com/
  - id: brew:csview
    reason: >
      Choose csview when the task is limited to fast, memory-efficient terminal
      formatting; csvkit remains the broader choice when viewing must accompany
      conversion, filtering, joins, statistics, or SQL work.
    rel: alternative
    sources:
      - https://github.com/wfxr/csview#benchmark
      - https://csvkit.readthedocs.io/en/latest/scripts/csvlook.html
