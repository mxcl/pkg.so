id: cask:geany
display-name: Geany
repo: https://github.com/geany/geany
docs:
  - https://www.geany.org/manual/current
  - https://wiki.geany.org/howtos
config-file-location:
  unix:
    - ~/.config/geany/geany.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Geany became widely packageable because it depends primarily on GTK rather than a
      full desktop environment. Its maintainers recommend distribution packages on Linux
      and BSD-like systems, while official bundles serve macOS and Windows.
    - >
      A separate Geany Plugins collection and a stable plugin interface broadened the
      editor beyond its deliberately small core. Synchronization with Universal Ctags
      and continued Scintilla/Lexilla updates expanded language and symbol support
      without turning Geany into a heavyweight language-specific IDE.
  package-nerd-significance:
    - >
      Geany sits between a plain text editor and a large IDE: it starts quickly, has few
      dependencies, yet includes symbol navigation, build commands, project support, an
      embedded terminal, and plugins. This makes it a recurring favorite in lightweight
      Linux desktop environments and on constrained machines.
    - >
      Its plain-text per-user configuration, filetype definitions, snippets, themes,
      templates, and overridable configuration directory also make it friendly to
      dotfile management and portable setups.
  project-history:
    - >
      Geany was started by Enrico Tröger in 2005 with the goal of creating a small, fast
      IDE that did not depend on KDE or GNOME. It used GTK for desktop portability and
      Scintilla for editing.
    - >
      Over time the project developed a community-maintained plugin ecosystem, added
      broad filetype support, moved its default builds to GTK 3, synchronized parsers
      with Universal Ctags, and continued modernizing Scintilla and Lexilla. The 2.x
      series retained the original lightweight-IDE design.
  related-projects:
    - Geany Plugins
    - Geany Themes
    - GTK
    - Scintilla
    - Lexilla
    - Universal Ctags
  sources:
    - https://github.com/geany/geany#readme
    - https://github.com/geany/geany/blob/master/doc/geany.txt
    - https://github.com/geany/geany/releases
  summary:
    - >
      Geany is a cross-platform GTK-based editor and lightweight IDE with syntax
      highlighting, completion, symbol navigation, build integration, project support,
      an embedded terminal, and plugins.
  timeline:
    - '2005: Geany development began.'
    - '2019: Geany 1.35 began synchronization with Universal Ctags.'
    - '2020: Geany 1.37 made GTK 3 the default build toolkit.'
    - >
      2023-10: Geany 2.0 required GTK 3.24 and separated session data from general
      preferences.
    - '2025-07: Geany 2.1 expanded filetype support and incorporated themes from Geany Themes.'
  usage:
    - >
      Developers use Geany for editing and navigating source code across many languages,
      running compiler or build commands, maintaining small projects, and working in its
      optional embedded terminal.
    - >
      The `-c` or `--config` option selects an alternate configuration directory, which
      is useful for isolated or portable setups. User preferences normally live in
      `geany.conf`, with related snippets, templates, themes, tags, and filetype
      overrides under the same configuration directory.
