history:
  adoption-history:
    - >
      Tight Studio entered invite-only testing in July 2025 and opened for public access
      later that month. The project has since followed a rapid release cadence,
      expanding from recording and basic editing into multi-clip projects,
      collaboration, sharing, captions, and AI-assisted media tools.
  package-nerd-significance:
    - >
      Tight Studio represents the newer class of polished, Apple-silicon-focused
      screen-recording tools distributed as macOS casks. Its all-in-one workflow and
      native project bundles distinguish it from general-purpose recorders and
      traditional nonlinear editors.
  project-history:
    - >
      Tight Studio was founded in 2025 by Ethan Jiang as a macOS screen recorder and
      video editor for Apple silicon. It was designed to turn rough captures into
      product demos, tutorials, presentations, and social videos without moving work
      between separate applications.
    - >
      Version 1.0 reached public access on July 28, 2025 with automatic zooms, cursor
      effects, captions, camera overlays, backgrounds, and export tooling. Subsequent
      releases added multi-clip recording, faster export, team workspaces, dynamic
      layouts, system-audio recording, annotations, AI narration, and integrations.
  related-projects:
    - Loom
    - Screen Studio
    - OBS Studio
  sources:
    - 'Official Help Center: https://tight.studio/help/'
    - 'Official company history: https://tight.studio/about/'
    - 'Official release history: https://tight.studio/changelog/'
  summary:
    - >
      Tight Studio is a proprietary screen recorder and video editor for Apple-silicon
      Macs. It combines capture, timeline editing, animated zoom and cursor effects,
      captions, narration, layouts, export, and hosted sharing.
  timeline:
    - '2025: Tight Studio was founded'
    - '2025-07-17: Invite-only testing launched'
    - '2025-07-28: Version 1.0 opened for public access'
    - '2026-02: Multi-clip recording and a new playback and export engine shipped'
    - '2026-05: Team Workspace collaboration shipped'
    - '2026-06: System-audio recording shipped'
  usage:
    - >
      Users record a full display, window, crop, camera, or connected iOS device;
      arrange multiple clips; add zooms, cursor effects, captions, layouts, narration,
      and annotations; then export locally or publish a controlled share link.
    - >
      Local editable work is stored as a complete .tightstudio project bundle. The
      official help center recommends copying the entire bundle for backup or transfer
      rather than extracting individual internal files.
