    - Profile folder reported by vivaldi://about, under Default\Login Data
history:
  adoption-history:
    - >
      Vivaldi began as a desktop browser for Windows, Linux, and macOS. The company
      reported a decade later that the browser had expanded to iOS, Android, and
      embedded automotive environments and had attracted millions of users.
  package-nerd-significance:
    - >
      Vivaldi appeals to browser enthusiasts and power users who value dense built-in
      functionality and extensive interface control. It is also technically notable for
      combining Chromium with Vivaldi-developed backend features and a largely HTML,
      CSS, and JavaScript desktop interface rather than shipping a simple Chromium
      reskin.
    - >
      For source-oriented package users, Vivaldi is an instructive mixed-source product:
      Chromium and Vivaldi's published C++ changes are open source, while the desktop
      user-interface layer is proprietary. Consequently, there is no single official
      public repository containing the complete browser product.
  project-history:
    - >
      Vivaldi launched its first public technical preview in January 2015. The project
      was created as a feature-rich alternative for users who felt other browsers had
      removed too much control and customization.
    - >
      The stable desktop browser launched in 2016. Vivaldi continued adding integrated
      tools such as Notes, advanced tab management, mail, calendar, translation, and
      unusually detailed browsing-history views.
  related-projects:
    - Chromium supplies Vivaldi's browser and rendering foundation.
    - Vivaldi Mail and Vivaldi Calendar are integrated productivity components.
    - Vivaldi Sync connects browser data across devices.
  sources:
    - https://help.vivaldi.com/desktop/install-update/full-reset-of-vivaldi/
    - >
      https://vivaldi.com/blog/ten-years-of-making-new-friends-by-building-a-browser-for-you-not-big-tech/
    - https://vivaldi.com/blog/vivaldi-browser-open-source/
    - https://vivaldi.com/blog/vivaldi-different-from-chrome/
    - https://vivaldi.com/blog/vivaldi-makes-history/
  summary:
    - >
      Vivaldi is a Chromium-based web browser developed by Vivaldi Technologies with an
      emphasis on customization, user control, privacy, and built-in productivity
      features. It emerged in 2015 as an alternative aimed especially at demanding
      browser users.
  timeline:
    - '2015: The first public Vivaldi technical preview launched for desktop systems.'
    - '2016: Vivaldi launched its stable desktop browser.'
    - '2017: Vivaldi 1.8 introduced expanded visual browsing-history tools.'
    - '2025: Vivaldi marked ten years since its first technical preview.'
  usage:
    - >
      Users commonly choose Vivaldi for configurable tabs, keyboard and mouse workflows,
      panels, Notes, privacy tools, and integrated mail and calendar features. The
      browser stores settings, history, bookmarks, sessions, and encrypted login data in
      its active profile folder, whose authoritative location is shown at
      vivaldi://about.
