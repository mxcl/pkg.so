history:
  adoption-history:
    - >
      Phocus became Hasselblad's free desktop workflow for its digital camera systems
      and is distributed for both macOS and Windows. Its tight coupling to Hasselblad
      camera and lens metadata distinguishes it from general-purpose RAW processors.
  package-nerd-significance:
    - >
      Phocus matters to photography-focused package users because it is the
      vendor-maintained path for processing Hasselblad 3FR and 3F files and operating
      supported cameras while tethered. The Homebrew Cask packages Hasselblad's
      proprietary macOS application rather than an open-source codebase.
  project-history:
    - >
      Hasselblad developed Phocus as its capture-processing and file-management
      application, primarily for Hasselblad RAW workflows. Official camera manuals
      documented it as part of the company's desktop workflow by the mid-2010s.
    - >
      The application has continued to add camera support and editing facilities,
      including local adjustment layers, lens corrections, focus-bracketing control,
      chromatic-aberration correction, and direct editing of 3FR files.
  related-projects:
    - Phocus Mobile extends parts of the Hasselblad workflow to supported mobile devices.
    - >
      Hasselblad X, H, and V System cameras supply the camera-specific metadata and
      tethering features used by Phocus.
  sources:
    - https://cdn.hasselblad.com/archive/2014/11/H5D-User-Manual-EN-v15-web.pdf
    - https://cdn.hasselblad.com/phocus/Phocus_UserManual_EN.pdf
    - https://www.hasselblad.com/phocus/phocus-for-pc-mac
  summary:
    - >
      Hasselblad Phocus is free proprietary software for processing Hasselblad RAW
      images, managing files, and controlling supported cameras during tethered capture.
  timeline:
    - >
      By 2014: Hasselblad camera manuals documented Phocus as the desktop processing
      workflow for 3FR and 3F files.
    - >
      2018: The official Phocus user guide documented macOS and Windows capture,
      processing, and file-management workflows.
    - >
      2020s: Hasselblad continued expanding Phocus with new camera support and
      non-destructive editing tools.
  usage:
    - >
      Photographers import or browse 3FR and 3F files, apply vendor-aware colour and
      optical corrections, organize captures, and export finished images to standard
      formats.
    - >
      In a studio workflow, a supported Hasselblad camera can be tethered to Phocus for
      remote exposure controls, live view, focusing, and direct storage into a selected
      capture folder.
