history:
  adoption-history:
    - >
      Cisdem distributes Duplicate Finder as a commercial desktop utility. The input
      records a Homebrew cask for the macOS application, giving package-manager users an
      alternative to manually installing the vendor's disk image; no reliable
      product-specific usage totals are published.
  package-nerd-significance:
    - >
      Duplicate Finder represents the proprietary macOS utility pattern: a
      vendor-distributed graphical application made reproducibly installable through a
      Homebrew cask. Its saved scan results, selection rules, and Photos-library
      handling distinguish it from basic checksum-only command-line deduplicators.
  project-history:
    - >
      Cisdem's documented Mac release line extends to at least 2017, when version 4
      added similar-image detection, smart selection, multiple result views, and
      exclusion rules. Later releases expanded Photos-library handling, deletion
      workflows, scan persistence, duplicate-folder detection, and the similar-image
      algorithm.
  related-projects:
    - >
      Cisdem also publishes Windows and mobile editions under the Duplicate Finder
      product family.
    - >
      The application overlaps functionally with file deduplication tools and
      photo-library cleanup utilities.
  sources:
    - 'Official product page: https://www.cisdem.com/duplicate-finder.html'
    - 'Official release notes: https://www.cisdem.com/duplicate-finder-mac/release-notes.html'
    - >
      Official user guide:
      https://www.cisdem.com/resource/cisdem-duplicate-finder-user-guide.html
    - source_facts.package-manager
  summary:
    - >
      Cisdem Duplicate Finder is a commercial file-management utility for finding exact
      duplicate files and similar images, reviewing the results, and removing unwanted
      copies. The reviewed package is the macOS application.
  timeline:
    - >
      2017: Version 4.0 added similar-image scanning, smart selection, result views, and
      exclusion rules.
    - '2019: Version 5.0 improved duplicate-photo, similar-image, and Music-library scanning.'
    - >
      2021: Version 5.9 added multiple Photos-library scanning, deletion history, custom
      destinations, and tag-based selection.
    - >
      2022: Version 6.0 revised similar-image detection and added saved scan results and
      duplicate-folder scanning.
  usage:
    - >
      Users add folders, drives, Music media, or Photos libraries; run a scan; review
      exact duplicates and similar images; adjust automatic selections; and move
      selected items to Trash, another folder, or permanent deletion.
    - >
      The application can save a scan as a project for later review. Cisdem advises
      users to inspect similar images manually because visual similarity does not
      necessarily mean that files are interchangeable.
