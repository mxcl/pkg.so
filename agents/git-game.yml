id: brew:git-game
display-name: git-game
repo: null
docs:
  - https://github.com/jsomers/git-game#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears niche and recreational rather than infrastructure-oriented.
      Homebrew packaging made it easy for macOS users to install, but the project
      remained a small utility centered on team culture and commit-history familiarity.
  package-nerd-significance:
    - >
      git-game is significant as an example of Git's porcelain-extension culture: any
      executable named `git-*` can become a `git foo` command, even when the result is a
      team game rather than a development workflow.
  project-history:
    - >
      The repository was created in 2015 and shipped a 1.0 GitHub release the same day.
      Its README presents the project as a lightweight social game for teams, with
      Homebrew installation, a standalone executable release, normal and hard difficulty
      modes, and support for filtering commits with git-log options.
  related-projects:
    - >
      git-game relates to git-log, commit analytics toys, and Git subcommand wrappers
      distributed through Homebrew.
  sources:
    - https://formulae.brew.sh/formula/git-game
    - https://github.com/jsomers/git-game
    - https://github.com/jsomers/git-game/blob/master/README.md
    - https://github.com/jsomers/git-game/releases
  summary:
    - >
      git-game is a small Ruby command-line game that turns a Git repository's commit
      history into a guessing game. Players inspect commit messages and guess which team
      member authored each commit.
  timeline:
    - '2015: Repository and 1.0 release appeared on GitHub.'
    - '2015: 1.1 and 1.2 releases followed in the same launch period.'
    - '2023: 1.3 release refreshed the packaged version line.'
  usage:
    - >
      Practitioners run `git game` inside an existing repository. The tool samples
      commits, shows commit messages, and lets the player build a streak by guessing
      authors; options such as `--hard` and git-log filters narrow or change the
      challenge.
