history:
  adoption-history:
    - >
      Adoption is centered on Apple-platform Scheme users, LispPad users, and Swift
      developers who want an embeddable scripting layer. The Homebrew package exposes
      the `lispkit` command-line tool, while the wider project remains tied to LispPad
      documentation and examples.
  package-nerd-significance:
    - >
      LispKit is notable because it packages a Scheme implementation as a Swift
      framework and CLI rather than as a C, JVM, or traditional Lisp implementation. For
      package managers, it brings Apple-platform framework concerns into the
      language-runtime category.
  project-history:
    - >
      LispKit grew out of the ObjectHub/LispPad ecosystem rather than from a traditional
      Unix Scheme lineage. Its repository positions the framework as a Swift-native way
      to add Scheme-like scripting to Apple-platform applications, while still exposing
      a large library surface for standalone use.
    - >
      The project evolved alongside LispPad, a lightweight macOS IDE, and LispPad Go on
      iOS. Release notes for the 2.x series show continuing expansion of libraries for
      images, maps, PDF generation, locations, HTTP, OAuth, system integration, SQLite,
      JSON, archives, graphics, and other application-facing tasks.
  related-projects:
    - >
      Related projects include LispPad, LispPad Go, NumericalScheme, the R7RS Scheme
      standard, and other embeddable Scheme implementations.
  sources:
    - https://github.com/objecthub/swift-lispkit
    - https://github.com/objecthub/swift-lispkit/releases
    - https://www.lisppad.app/libraries/lispkit/lispkit-core
    - https://www.r7rs.org/
  summary:
    - >
      LispKit is a Swift implementation of a Scheme system and framework for embedding
      Lisp-based extension and scripting languages in macOS and iOS applications. The
      project describes its core language as based on R7RS small Scheme, with a
      compiler, virtual machine, core libraries, and a command-line tool.
  timeline:
    - >
      2025-12-23: The 2.6.0 release notes documented bundled library documentation and
      new libraries for location, PDF, vision, image processing, maps, and web
      snapshots.
    - '2026-04-26: The 2.6.1 release notes recorded fixes for image handling and examples.'
  usage:
    - >
      Users can run Scheme code through the `lispkit` executable or embed the framework
      in Swift applications. The documented library set makes it useful as a scripting
      language, educational Scheme environment, and application-extension runtime.
