history:
  adoption-history:
    - >
      The input package facts show Homebrew packaging for `synscan`. Upstream also lists
      releases as tarballs and says the tool was known to compile on Linux, xBSD, Mac OS
      X, and Solaris, which explains why a portable Unix package manager would carry it.
  package-nerd-significance:
    - >
      Package nerds care about synscan because it is the kind of sharp, single-purpose
      network tool that package managers preserve even when its upstream surface is just
      a small project page and release tarballs.
    - >
      Its portability notes across Linux, BSD, macOS, and Solaris make it a good example
      of formula maintenance for low-level networking code.
  project-history:
    - >
      The official digit-labs page describes Synscan as an asynchronous half-open TCP
      port scanner that sends TCP packets with the SYN flag to blocks of destination
      addresses as fast as the host interface and kernel can support.
    - >
      The same page records a compact lineage: Synscan versions up to 3.9b6 were based
      on version 1.6 by psychoid/tCl, while Synscan 5.0 was a complete rewrite with a
      cleaner codebase, efficiency improvements, checksum fixes, adjustable scan timing,
      and a simpler design intended to allow future IPv6 support.
  related-projects:
    - >
      The official page points to the earlier bindshell.net synscan page and credits
      version 1.6 by psychoid/tCl as the base for older releases.
    - >
      In package taxonomies, synscan is adjacent to other TCP port scanners and
      packet-level security utilities.
  sources:
    - https://www.digit-labs.org/files/tools/synscan/
    - input source_facts.executables and source_facts.package-manager
  summary:
    - >
      synscan is a small security CLI: an asynchronous half-open TCP port scanner
      packaged by Homebrew for users who want a fast SYN-scan tool outside larger
      scanner suites.
  timeline:
    - 'Pre-5.0: Synscan versions through 3.9b6 were based on version 1.6 by psychoid/tCl.'
    - '5.0: Synscan was rewritten with efficiency, checksum, timing, and design changes.'
    - '5.02: The digit-labs page lists synscan-5.02.tar.gz as the newest non-beta release.'
  usage:
    - >
      synscan is used from the command line to perform half-open TCP port scans against
      ranges of destination addresses. Its companion executable `sslog` is also listed
      in the Homebrew-derived input facts.
    - >
      The tool sits in the older Unix security-tool tradition: focused source tarballs,
      direct packet behavior, and terse CLI usage rather than a large service or
      framework.
