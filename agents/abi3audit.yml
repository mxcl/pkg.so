id: brew:abi3audit
display-name: abi3audit
repo: https://github.com/pypa/abi3audit
docs:
  - https://github.com/pypa/abi3audit#readme
  - https://pypi.org/project/abi3audit
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      abi3audit emerged from security and packaging concerns around Python's stable ABI.
      Its transfer to PyPA made it part of the Python packaging tool ecosystem, and the
      Homebrew input facts show it packaged as a command-line tool for macOS users.
  package-nerd-significance:
    - >
      abi3audit is package-nerd significant because abi3 wheels promise compatibility
      across CPython minor versions, but that promise is not automatically enforced at
      install time. The tool gives maintainers and distribution builders a way to check
      whether wheel tags and actual exported symbols agree.
  project-history:
    - >
      The README says abi3audit was created by Trail of Bits and is now maintained as
      part of the Python Packaging Authority. GitHub release metadata for early versions
      still references the trailofbits repository, while current PyPI metadata points to
      the PyPA source repository.
  related-projects:
    - >
      Related projects and standards include CPython's stable ABI, abi3 wheel tags,
      PyPI, PyPA packaging tools, setuptools' py-limited-api option, auditwheel, and
      Kaitai Struct parsers used by the project.
  sources:
    - Official README, PyPI metadata, GitHub repository metadata, and GitHub release metadata.
  summary:
    - >
      abi3audit is a Python packaging audit tool for finding violations and
      inconsistencies in Python abi3 extension modules and wheels. It can inspect local
      shared objects, wheels, PyPI packages, and package release histories.
  timeline:
    - '2022-09-20: Current GitHub repository created.'
    - '2022-09-28: Earliest GitHub release in the current release list is v0.0.2.'
    - '2022: Early release notes reference the Trail of Bits repository.'
    - '2022-11: README links Trail of Bits writing about finding bugs with abi3audit.'
    - '2025: Release series continues under PyPA with packaging and Python-version maintenance.'
    - '2026-01-23: v0.0.26 released.'
  usage:
    - >
      Users run abi3audit against a shared object, a wheel file, or a PyPI package name.
      The README documents verbose output for mismatch details and a JSON report mode
      for tooling integration.
related-packages: []
