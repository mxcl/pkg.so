history:
  adoption-history:
    - >
      Pandora evolved from its Music Genome Project into a personalized internet-radio
      service and later added ad-supported and subscription listening. An official
      desktop app launched for macOS and Windows in 2019, providing the service outside
      a browser across Pandora's service tiers.
    - >
      SiriusXM announced its agreement to acquire Pandora in 2018, and Pandora became an
      indirect wholly owned SiriusXM subsidiary in February 2019. Pandora's official
      about page continues to describe it as a major U.S. ad-supported audio service
      available through apps, the web, and connected products.
  package-nerd-significance:
    - >
      The cask packages the native macOS front end for a historically important
      recommendation-driven streaming service. Unlike open media players, it is a
      proprietary client tied to Pandora's account, catalog, licensing territory, and
      service tiers.
  project-history:
    - >
      The company began in 2000 as Savage Beast, centered on Tim Westergren's Music
      Genome Project: human analysts cataloged musical attributes so software could
      build similarity-based listening stations. The consumer service adopted the
      Pandora name in 2005.
    - >
      Pandora's recommendation model combined the curated Music Genome Project with
      listener feedback. The later desktop client brought playback controls,
      notifications, Pandora Modes, and access to Free, Plus, and Premium service tiers
      to Mac and Windows.
  related-projects:
    - Pandora's Music Genome Project supplies music-analysis data for personalization.
    - Pandora is a subsidiary of SiriusXM.
  sources:
    - >
      https://community.pandora.com/t5/Community-Blog/New-Pandora-Desktop-App-Now-Available-for-Both-Windows-and-Mac/bc-p/424
    - https://investor.siriusxm.com/sec-filings/annual-reports/xbrl_doc_only/2104
    - https://www.pandora.com/about
    - https://www.pandora.com/corporate/index.shtml
  summary:
    - >
      Pandora is the native desktop client for Pandora's personalized music and podcast
      streaming service, whose recommendations grew out of the Music Genome Project.
  timeline:
    - '2000: The company and Music Genome Project began under the Savage Beast name.'
    - >
      2005: The company adopted the Pandora name and launched its personalized consumer
      service.
    - >
      2019: Pandora became a SiriusXM subsidiary and introduced its current Mac and
      Windows desktop experience.
  usage:
    - >
      Sign in with a Pandora account to play personalized stations, music, and podcasts.
      The desktop app supports media keys, keyboard commands, song notifications,
      auto-launch and login options, and service-dependent features such as Pandora
      Modes.
