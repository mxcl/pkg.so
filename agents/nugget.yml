history:
  adoption-history:
    - >
      Nugget attracted users interested in applying unsupported iOS customizations from
      a desktop computer without a conventional jailbreak. Its feature set expanded
      across animated PosterBoard wallpapers, status-bar changes, MobileGestalt flags,
      SpringBoard options, feature flags, daemon controls, and reusable customization
      templates.
    - >
      Successive releases tracked a narrow and changing matrix of iOS versions and
      restore techniques. The project's own documentation repeatedly emphasizes backups,
      exact compatibility checks, and the possibility of data loss or device problems.
  package-nerd-significance:
    - >
      Nugget packages a technically unusual desktop workflow around Apple-device
      pairing, backup and partial-restore behavior, private preference domains, and
      structured customization bundles. For package enthusiasts, its cross-platform
      Python/Qt application and tight coupling to particular iOS restore behaviors make
      compatibility metadata and release notes unusually important.
  project-history:
    - >
      Nugget began as an open-source desktop utility for altering otherwise unavailable
      iOS settings and assets. It applies supported tweaks through device-management and
      restore mechanisms rather than operating as a normal application installed on the
      iPhone.
    - >
      The project developed its own documented bundle formats: tendies files represent
      PosterBoard wallpaper structures, while batter templates contain restore payloads
      and a config.json schema describing customizable operations.
  related-projects:
    - >
      Nugget Mobile: The project's archived on-device counterpart for older compatible
      iOS versions.
    - >
      pymobiledevice3: An Apple-device communication dependency credited by and later
      integrated into Nugget.
    - >
      Cowabunga Lite: A related iOS customization utility referenced by the Nugget
      Mobile documentation.
    - >
      PosterBoard: The iOS wallpaper subsystem targeted by Nugget's animated-wallpaper
      workflows.
  sources:
    - >
      Official format documentation:
      https://github.com/leminlimez/Nugget/blob/main/documentation.md
    - 'Official release history: https://github.com/leminlimez/Nugget/releases'
    - 'Official repository and README: https://github.com/leminlimez/Nugget'
  summary:
    - >
      Nugget is an open-source desktop utility for applying unsupported customizations
      to compatible iOS devices, including wallpaper, status-bar, feature-flag,
      MobileGestalt, SpringBoard, and daemon changes.
  timeline:
    - '2024: Public project use and issue activity were established in the official repository.'
    - >
      Later releases: Nugget expanded its compatibility logic and moved device
      communication toward pymobiledevice3-backed workflows.
    - >
      Current era: Releases explicitly block unsupported iOS generations when Apple's
      restore behavior creates a serious data-loss risk.
  usage:
    - >
      Users connect and pair an iPhone or iPad, select compatible modifications, and
      apply them through Nugget's device-management and restore workflow. The
      maintainers instruct users to back up their devices first and to follow the
      README's version-specific warnings. Advanced users can author tendies wallpaper
      bundles or batter templates using the documented config.json format.
