history:
  adoption-history:
    - >
      The software is aimed at singers, musicians, voice teachers, students, and others
      who want musical interpretations of acoustic measurements. Sygyt also offers
      student and institutional licensing, indicating use in teaching and organized
      voice or music work.
  package-nerd-significance:
    - >
      VoceVista Video is notable as a specialist desktop application distributed through
      a general-purpose macOS package manager. It brings a comparatively niche
      voice-analysis workflow—spectrograms, overtone inspection, vowel charts, frequency
      filters, and recording comparison—into a reproducible cask installation.
  project-history:
    - >
      The present product combines two earlier lineages: Sygyt’s Overtone Analyzer,
      created by Bodo Maass and Wolfgang Saus, and the original VoceVista 3.3, created
      by Don Miller and Richard Horne. Beginning with the 5.0 generation, the products
      shared one codebase and interface while remaining separate feature editions.
    - >
      Version 5.0 extended the product line from Windows to macOS. The editions were
      renamed in May 2017 as part of the Overtone Analyzer and VoceVista merger.
  related-projects:
    - >
      VoceVista Video Pro is the higher-end edition with precision measurement, EGG,
      vibrato, marker, and advanced export features.
    - Overtone Analyzer is the entry edition of the shared software family.
    - >
      VoceVista LLC supplies related electroglottograph hardware, while Sygyt Software
      develops the applications.
  sources:
    - https://www.sygyt.com/en/order/
    - https://www.sygyt.com/en/products/
    - https://www.sygyt.com/en/releases/vocevista-video-5-0-2/
    - https://www.sygyt.com/en/support/frequently-asked-questions/
  summary:
    - >
      VoceVista Video is Sygyt Software’s voice and musical-acoustics analysis
      application, positioned between Overtone Analyzer and VoceVista Video Pro in a
      shared product family.
  timeline:
    - 'May 2017: Product editions were renamed as Overtone Analyzer and VoceVista converged.'
    - '2017: The 5.0 generation brought the shared product line to macOS as well as Windows.'
    - >
      2020: Version 5.4 added shared real-time pitch improvements while the Pro edition
      gained specialized vibrato and EGG analysis.
  usage:
    - >
      Users record or open audio, inspect pitch, spectra and spectrograms, compare
      takes, explore harmonics with overtone tools, apply frequency filters, and use the
      vowel chart to relate acoustic resonances to vowels.
