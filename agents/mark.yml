id: brew:mark
display-name: Mark
repo: null
docs:
  - https://github.com/kovetskiy/mark#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/mark.toml
    - ~/.config/mark.toml
  macos:
    - ~/Library/Application Support/mark.toml
  windows:
    - '%AppData%\mark.toml'
credentials-file-location:
  linux:
    - $XDG_CONFIG_HOME/mark.toml
    - ~/.config/mark.toml
  macos:
    - ~/Library/Application Support/mark.toml
  windows:
    - '%AppData%\mark.toml'
history:
  adoption-history:
    - >
      Mark has a visible open-source user base, with the official repository showing
      more than a thousand stars and hundreds of forks. The supplied package facts show
      it packaged for Homebrew and Nix, and the README also documents Docker usage for
      CI or reproducible publishing jobs.
  package-nerd-significance:
    - >
      Mark is significant as glueware: it lets teams keep docs reviewable in Git while
      publishing into a proprietary wiki. For package maintainers, it is a single binary
      CLI with CI-friendly flags and a clear target audience, rather than another
      general Markdown renderer.
  project-history:
    - >
      The project was created on GitHub in 2015. Its README frames the tool around a
      common engineering-docs problem: teams keep Markdown in Git but still need
      Confluence pages updated for an organization that uses Confluence as the visible
      documentation system.
    - >
      Mark developed beyond simple Markdown conversion into a Confluence-specific
      publisher. The README documents page metadata comments, parent and folder
      creation, attachments, Confluence macros, GitHub-style alerts, task lists, Mermaid
      rendering, D2 rendering, PlantUML support, and preservation of inline comments.
  related-projects:
    - Mark sits between Markdown tooling and Atlassian Confluence's REST/storage APIs.
    - >
      Its README references optional rendering integrations such as Mermaid, D2,
      PlantUML, and GitHub-style Markdown alerts.
  sources:
    - https://api.github.com/repos/kovetskiy/mark
    - https://github.com/kovetskiy/mark
    - https://github.com/kovetskiy/mark#usage
    - source_facts.package-manager
  summary:
    - >
      Mark is a command-line publisher that synchronizes Markdown files from a
      repository or local workspace into Atlassian Confluence pages.
  timeline:
    - '2015: GitHub repository created.'
    - '2026: Repository metadata shows ongoing activity and a large issue/PR history.'
    - '2026: Supplied package facts list Homebrew and Nix packaging.'
  usage:
    - >
      Users run mark against one or more Markdown files and provide Confluence
      connection details by flags, environment variables, or a TOML config file. The CLI
      can create pages, update existing pages, upload attachments, translate Markdown to
      Confluence storage HTML, and optionally run in dry-run or compile-only modes.
    - >
      Credentials are operationally important: the README documents username, password
      or token, base URL, and config-file options, and explicitly says credentials can
      be stored in the system-specific configuration file or supplied via
      CLI/environment variables.
related-packages:
  - id: brew:confluence-markdown-exporter
    reason: >
      Use Confluence Markdown Exporter alongside Mark when a docs-as-code workflow also
      needs to back up or migrate existing Confluence pages, hierarchies, and
      attachments into local Markdown.
    rel: adjacent_workflow
    sources:
      - https://github.com/kovetskiy/mark
      - https://spenhouet.com/confluence-markdown-exporter/features/
