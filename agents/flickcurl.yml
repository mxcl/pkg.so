config-file-location:
  unix:
    - ~/.flickcurl.conf
credentials-file-location:
  unix:
    - ~/.flickcurl.conf
history:
  adoption-history:
    - >
      flickcurl became a distro-style C API client rather than only a sample utility:
      the input package metadata lists it across Homebrew, Debian/Ubuntu documentation
      packages, Fedora, MacPorts, Arch, Alpine, and openSUSE packaging.
    - >
      Its usefulness followed the Flickr API era, when native tools and libraries needed
      authenticated access to photo metadata, tags, places, uploads, and RDF-style
      exports without embedding hand-written REST code.
  package-nerd-significance:
    - >
      flickcurl is a good example of the old Unix packaging pattern for web APIs: a C
      library, a -config helper, command-line utilities, generated API reference, and a
      dotfile holding OAuth tokens.
    - >
      For package maintainers, the notable dependencies are libcurl and libxml2, with
      optional raptor support for RDF output.
  project-history:
    - >
      The official site presents flickcurl as a full-coverage C interface to the Flickr
      API, including upload, browsing, search, comments, groups, notes, photosets,
      places, tags, machine tags, and metadata functions.
    - >
      The GitHub README points readers back to the official HTML documentation and is
      dated 2009, while the official download page advertises the 1.26 tarball as the
      current release.
  related-projects:
    - >
      flickcurl is related to Flickr's public API, libcurl for HTTP transport, libxml2
      for XML handling, and raptor for optional RDF serialization.
    - >
      The project lives under the same librdf.org umbrella as other Dave Beckett RDF and
      web data libraries.
  sources:
    - https://github.com/dajobe/flickcurl
    - https://librdf.org/flickcurl
    - https://librdf.org/flickcurl/NEWS.html
    - https://librdf.org/flickcurl/api
  summary:
    - >
      flickcurl is Dave Beckett's C library and command-line tooling for the Flickr API.
      It wraps request creation, OAuth signing and token management, REST calls through
      libcurl, and XML response handling through libxml2.
  timeline:
    - '2009: The GitHub README directed browser users to the official HTML documentation.'
    - >
      2012: Version 1.23 added full OAuth 1.0 support and migration from legacy Flickr
      authentication.
    - '2013: Version 1.25 updated Flickr API coverage and OAuth upload handling.'
    - >
      2014: Version 1.26 switched API endpoints and image URLs to HTTPS after Flickr's
      HTTPS-only announcement.
  usage:
    - >
      The library is used by C programs that need Flickr API access. The bundled
      flickcurl utility can perform OAuth authentication steps, call supported API
      commands, and write credentials to ~/.flickcurl.conf.
    - >
      The flickrdf utility converts Flickr photo metadata, tags, machine tags, and place
      data into RDF triples, using raptor when available for RDF serialization.
