id: brew:enscript
display-name: GNU Enscript
repo: https://git.savannah.gnu.org/git/enscript.git
docs:
  - https://www.gnu.org/software/enscript
config-file-location:
  unix:
    - ~/.enscriptrc
    - $prefix/etc/enscriptsite.cfg
    - $prefix/etc/enscript.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      Enscript became a familiar Unix packaging item because it filled a durable
      text-to-PostScript workflow for terminals, print queues, source listings, and
      documentation. The input metadata lists it across Homebrew, Debian, Ubuntu,
      Fedora, Alpine, Arch, Nix, MacPorts, and openSUSE.
  package-nerd-significance:
    - >
      GNU Enscript is a package-nerd staple because it sits at the intersection of
      classic Unix printing, PostScript, source-code pretty-printing, font metrics,
      locale encodings, and GNU release infrastructure. It is small by modern standards
      but touches many old-school system integration points.
  project-history:
    - >
      The official README calls GNU Enscript a drop-in replacement for the older
      enscript program and describes its core job as converting ASCII files to
      PostScript for files or printers. The AUTHORS file credits Markku Rossi as the
      author of GNU Enscript.
    - >
      The GNU FTP archive shows public GNU Enscript tarballs at least as far back as
      version 1.4.0 in 1996, followed by 1.5.0 in 1997, 1.6.0 in 1998, and later 1.6.x
      maintenance releases. The NEWS file documents major 1.6-era work around syntax
      highlighting, output options, encodings, and later security and maintenance fixes.
  related-projects:
    - >
      The project belongs to the GNU tool family and is related operationally to
      PostScript interpreters, Unix print spoolers such as lpr and lp, and source-code
      highlighters used in printing workflows.
  sources:
    - https://www.gnu.org/software/enscript
    - https://git.savannah.gnu.org/cgit/enscript.git
    - https://git.savannah.gnu.org/cgit/enscript.git/plain/README
    - https://git.savannah.gnu.org/cgit/enscript.git/plain/NEWS
    - https://git.savannah.gnu.org/cgit/enscript.git/plain/AUTHORS
    - https://ftp.gnu.org/gnu/enscript/
  summary:
    - >
      GNU Enscript is a GNU command-line program for converting text files to
      PostScript, and in later versions also to formats such as HTML and RTF, with
      layout control and language-sensitive highlighting.
  timeline:
    - '1996: GNU FTP archive lists enscript 1.4.0 tarball.'
    - '1998: GNU FTP archive lists enscript 1.6.0 and 1.6.1 tarballs.'
    - >
      2010: NEWS for 1.6.5 notes a new maintainer, GPLv3-or-later licensing, build
      fixes, security fixes, and syntax-highlighting fixes.
    - >
      2012: NEWS for 1.6.6 notes Translation Project updates, Debian sliceprint patch
      integration, and option/documentation fixes.
    - '2026: ChangeLog records release 1.7.0.'
  usage:
    - >
      Users invoke `enscript` to format plain text or source code for printing or
      generated output. Official documentation describes global and personal
      configuration through `enscript.cfg`, `enscriptsite.cfg`, and `$HOME/.enscriptrc`,
      plus helper commands such as `mkafmmap` and language-sensitive highlighting
      through the `states` program.
related-packages:
  - id: brew:ghostscript
    reason: >
      Use Ghostscript after Enscript when generated PostScript must be rendered,
      inspected, printed through another device, or converted to PDF or raster output.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/enscript/
      - https://ghostscript.readthedocs.io/
tags:
  - cli
  - gnu
  - html
  - postscript
  - rtf
  - syntax-highlighting
  - text-processing
