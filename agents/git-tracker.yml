config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears concentrated around Ruby and macOS/Homebrew users rather than a
      broad Git ecosystem. The project is published as the git_tracker RubyGem and as
      the git-tracker Homebrew formula, both pointing back to the same GitHub source
      repository.
  package-nerd-significance:
    - >
      The package is a compact example of Git's extension culture: a Ruby-distributed
      tool exposed as a `git tracker` subcommand, with most behavior implemented by
      installing a standard Git hook into each repository.
  project-history:
    - >
      The upstream git_tracker repository was created in 2012 by Steven Harman. Its
      README presents the tool as GitTracker or git-tracker, a small workflow bridge
      between local Git branches and Pivotal Tracker's commit-message conventions.
  related-projects:
    - >
      git-tracker is tied to Git hooks, Pivotal Tracker's source-control message syntax,
      RubyGems packaging, and Homebrew distribution.
  sources:
    - https://api.github.com/repos/stevenharman/git_tracker
    - https://formulae.brew.sh/formula/git-tracker
    - https://github.com/stevenharman/git_tracker
    - https://raw.githubusercontent.com/stevenharman/git_tracker/master/README.md
    - https://rubygems.org/gems/git_tracker
  summary:
    - >
      git-tracker is a Git hook helper for teams that name branches with Pivotal Tracker
      story numbers. It installs a prepare-commit-msg hook that detects a story ID in
      the branch name and adds the corresponding Tracker syntax to commit messages.
  timeline:
    - '2012: git_tracker repository created.'
    - '2.0.0: RubyGems and Homebrew package the tool under git_tracker and git-tracker names.'
  usage:
    - >
      Practitioners install the binary, run `git tracker init` inside each repository
      where the hook should be active, and include a Pivotal Tracker story number in
      branch names. On commit, the hook adds a Tracker-formatted story marker, or a
      keyword such as Fixes with the story number, unless the message already contains
      the marker.
related-packages:
  - id: brew:git
    reason: >
      Git supplies the prepare-commit-msg hook and external-subcommand behavior that
      GitTracker uses to modify commit messages inside each repository.
    rel: adjacent_workflow
    sources:
      - https://github.com/stevenharman/git_tracker#readme
      - https://git-scm.com/docs/githooks
