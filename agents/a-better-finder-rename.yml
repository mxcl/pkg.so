history:
  adoption-history:
    - >
      The developer says A Better Finder Rename has been used by tens of thousands of
      professionals, businesses, and hobbyists. Its long-running shareware model has
      funded continuous updates and major-version upgrades outside the Mac App Store as
      well as through other distribution channels.
  package-nerd-significance:
    - >
      A Better Finder Rename is a durable example of independent Mac shareware: a
      narrowly focused utility maintained across the transition from classic Mac OS and
      PowerPC to modern Intel and Apple Silicon macOS. Package users value it for
      repeatable presets, metadata-aware naming, regular expressions, sidecar-file
      pairing, conflict handling, and previews before committing large rename jobs.
  project-history:
    - >
      Developer Frank Reiff released A Better Finder Rename in 1996 as a contextual-menu
      plug-in for the classic Mac OS Finder on PowerPC-compatible Macs. The product has
      remained in continuous development and evolved into a standalone batch-renaming
      application; the current major line is version 12.
  related-projects:
    - Finder
    - A Better Finder Attributes
    - Big Mean Folder Machine
    - Nifty File Lists
  sources:
    - https://www.publicspace.net/ABetterFinderRename/index.html
    - https://www.publicspace.net/ABetterFinderRename/v12/index.html
    - https://www.publicspace.net/about/
  summary:
    - >
      A Better Finder Rename is a commercial macOS batch-renaming utility in continuous
      development since 1996.
  timeline:
    - '1996: First published as a contextual-menu plug-in for the classic Mac OS Finder.'
    - >
      2012: Version 9-era materials described sixteen years of continuous iterative
      development.
    - 'Current: Version 12 supports contemporary Intel and Apple Silicon Macs.'
  usage:
    - >
      Users drag files from Finder into the application, select one or more renaming
      actions, inspect the live preview, and perform the rename. Presets support
      repeatable workflows; advanced uses include EXIF and media-tag naming, regular
      expressions, spreadsheet-driven names, droplets, sidecar pairing, and large rename
      batches. The official guide recommends retaining backups for large jobs.
