credentials-file-location: null
history:
  adoption-history:
    - >
      Gossip has been distributed through GitHub releases with platform-specific
      artifacts including Debian packages, macOS disk images, MSI installers, Flatpak
      builds, and AppImage archives. The Homebrew formula also packages it for
      command-line installation, while the README points to an approved but separate
      fork for continued development when the original repository became idle.
  package-nerd-significance:
    - >
      Gossip is interesting to package nerds because it is a Rust desktop application
      shipped outside the usual browser-extension/web-app path, with native packages
      across several operating systems. It also maps an evolving protocol culture, where
      NIPs, relay behavior, local encrypted key storage, and GUI packaging all affect
      what the package actually delivers.
  project-history:
    - >
      The project emerged with the Nostr application wave as a desktop-first client
      focused on micro-blogging and chat-style social use. Its README says Gossip
      avoided the browser stack, used LMDB for storage, and kept private keys encrypted
      on disk, all choices that distinguished it from web clients.
    - >
      A central design idea is the 'Gossip Model': instead of using only a manually
      configured relay list, the client tries to find posts where followed people are
      likely to publish, based on relay lists and other heuristics. The README says that
      model influenced similar client behavior around NIP-65.
  related-projects:
    - Nostr is the relay-based protocol Gossip implements.
    - NIP-65 is related to the relay-list model highlighted in Gossip's README.
    - >
      YGGverse/gossipfork is named by the original README as a fork with continued
      development.
  sources:
    - https://formulae.brew.sh/formula/gossip
    - https://github.com/mikedilger/gossip
    - https://github.com/mikedilger/gossip/releases.atom
    - https://github.com/mikedilger/gossip/tree/master/docs
    - https://raw.githubusercontent.com/mikedilger/gossip/master/docs/CONFIGURATION.md
  summary:
    - >
      Gossip is a native desktop client for Nostr, written in Rust and aimed at Windows,
      macOS, and Linux users who prefer a non-browser client. Its README describes Nostr
      as a relay-based open social protocol and positions Gossip around desktop use,
      encrypted key handling, performance, user control, and relay-discovery behavior.
  timeline:
    - >
      2022: The GitHub repository metadata in the release pages identifies the
      mikedilger/gossip project line used for packaged releases.
    - >
      2024-10: 0.12.0 release notes add bookmarks, global and per-relay feeds,
      friends-of-friends scoring, and spam-filtering improvements.
    - >
      2024-12: 0.13.0 release notes add file metadata support, Blossom support, NIP-89
      handler recommendations, NIP-50 search, and follower/followed views.
    - >
      2025-03: 0.14.0 release notes describe a major release with search, UI, relay,
      media, protocol, and database changes.
  usage:
    - >
      Users run Gossip as a desktop Nostr client, configure identity and relays through
      the GUI, and can tune moderation, spam filtering, media handling, relay roles, and
      per-profile data directories. A Rhai script named filter.rhai in the gossip data
      directory can be used for programmable spam filtering.
related-packages:
  - id: brew:nak
    reason: >
      Use nak alongside Gossip to create, sign, inspect, query, publish, validate, or
      synchronize raw Nostr events and relays from scripts when the desktop UI is not
      sufficient.
    rel: adjacent_workflow
    sources:
      - https://github.com/mikedilger/gossip
      - https://github.com/fiatjaf/nak
