history:
  adoption-history:
    - >
      The project publishes prebuilt applications for Windows, macOS, and Linux. Its
      README also documents installation through Windows Package Manager, while the
      supplied facts identify a Homebrew cask for macOS.
    - >
      Its cross-platform packaging makes restic repositories accessible to users who
      prefer a graphical restore workflow while retaining restic as the underlying
      backup tool.
  package-nerd-significance:
    - >
      Restic Browser fills a deliberately narrow gap in the restic ecosystem: inspecting
      and restoring existing repositories without trying to replace restic's
      command-line backup workflow. That separation appeals to users who want scripted
      backups but a visual recovery tool.
    - >
      Its migration from Wails to Tauri also makes it a useful example of a small
      cross-platform desktop utility changing application frameworks while preserving
      its package identity.
  project-history:
    - >
      Restic Browser began as a graphical browser for restic repositories and was based
      on Leaanthony's Restoric proof of concept.
    - >
      Older releases used Wails 2; the official README identifies the last Wails-based
      release as 0.2.6. Subsequent development moved the application to Tauri.
  related-projects:
    - restic supplies the repository format and backup engine that Restic Browser invokes.
    - Restoric was the proof of concept on which the application was based.
    - Wails 2 powered older versions; Tauri powers the current application architecture.
  sources:
    - https://github.com/emuell/restic-browser
    - source_facts.package-manager
  summary:
    - >
      Restic Browser is an open-source, cross-platform graphical application for
      browsing, extracting, and restoring data from existing restic repositories.
  timeline:
    - >
      Early development: The application was based on the Restoric proof of concept and
      built with Wails 2.
    - 'After 0.2.6: Development moved from Wails 2 to Tauri.'
  usage:
    - >
      Users open a local or remote restic repository, browse snapshots and files, open
      individual files through the operating system, export selections as ZIP archives,
      or restore selected content.
    - >
      The application requires restic and can receive repository and password
      information through command-line options or the standard RESTIC_REPOSITORY,
      RESTIC_REPOSITORY_FILE, RESTIC_PASSWORD, RESTIC_PASSWORD_FILE, and
      RESTIC_PASSWORD_COMMAND environment variables.
