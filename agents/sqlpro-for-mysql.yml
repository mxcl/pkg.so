history:
  adoption-history:
    - >
      SQLPro for MySQL serves Mac and iOS users who prefer a native, focused alternative
      to Java-based or cross-platform MySQL administration tools. Homebrew cask
      packaging makes the independently distributed macOS application convenient to
      install and update alongside command-line database tooling.
  package-nerd-significance:
    - >
      The product occupies the native-client niche between broad database IDEs and older
      MySQL-specific Mac tools. It is especially relevant to users replacing the
      unmaintained Sequel Pro while retaining a focused interface for contemporary MySQL
      authentication, MariaDB, and managed-cloud databases.
  project-history:
    - >
      SQLPro for MySQL belongs to Kyle Hankinson's independently developed SQLPro family
      of database clients. The family has roots in his native macOS and iOS application
      development, which the developer dates to 2010.
    - >
      The application developed as a dedicated MySQL client and expanded to cover
      MariaDB and MySQL-compatible managed services while retaining a native Swift and
      Objective-C implementation.
  related-projects:
    - SQLPro Studio is the developer's broader multi-database client.
    - Other focused SQLPro products support Microsoft SQL Server, PostgreSQL, and SQLite.
    - >
      The official FAQ positions SQLPro for MySQL as a maintained alternative to Sequel
      Pro and a focused alternative to MySQL Workbench, TablePlus, and DBeaver.
  sources:
    - https://www.macsqlclient.com/blog/15-license-key-faq
    - https://www.mysqlui.com/
    - https://www.mysqlui.com/faq/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      SQLPro for MySQL is a proprietary native macOS and iOS client for querying and
      administering MySQL and MariaDB databases.
  timeline:
    - '2010: Developer Kyle Hankinson began building native macOS and iOS applications.'
    - >
      2021: The SQLPro licensing FAQ documented the independently developed family of
      focused database clients.
    - >
      Current generation: SQLPro for MySQL supports MySQL 5.0 and later, MariaDB, and
      major MySQL-compatible cloud services.
  usage:
    - >
      Users connect with database host, port, username, and password details; SSH
      tunneling with password or key authentication is available for servers behind a
      bastion host. The application provides syntax highlighting, schema-aware
      autocomplete, editable result grids, multiple result sets, and CSV, JSON, XML, and
      SQL import or export workflows.
