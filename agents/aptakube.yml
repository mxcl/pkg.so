id: cask:aptakube
display-name: Aptakube
repo: https://github.com/aptakube/aptakube
docs:
  - https://aptakube.com/docs
  - https://aptakube.com/docs/contexts
  - https://aptakube.com/docs/security
config-file-location:
  unix:
    - $APTAKUBECONFIG
    - $KUBECONFIG
    - ~/.kube/config
credentials-file-location:
  unix:
    - $APTAKUBECONFIG
    - $KUBECONFIG
    - ~/.kube/config
history:
  adoption-history:
    - >
      Aptakube is designed to fit existing kubectl workflows by discovering the same
      Kubernetes contexts and kubeconfig files rather than requiring a separate
      cluster-registration system.
  package-nerd-significance:
    - >
      Aptakube is notable as a packaged native GUI for operators who otherwise work
      primarily through kubectl. Its compatibility with standard kubeconfig conventions
      reduces setup friction for an additional desktop client.
  project-history:
    - >
      Aptakube is developed as a cross-platform commercial desktop client for
      Kubernetes. The available official documentation focuses on current operation
      rather than a dated project-origin narrative.
  related-projects:
    - Kubernetes
    - kubectl
    - kubeconfig
  sources:
    - https://aptakube.com/
    - https://aptakube.com/docs/contexts
    - https://aptakube.com/docs/security
  summary:
    - >
      Aptakube is a desktop Kubernetes client that connects directly to clusters using
      local kubeconfig data.
  timeline:
    - >
      The official sources document the current Aptakube desktop product but do not
      provide a reliable dated origin timeline.
  usage:
    - >
      Aptakube loads contexts first from APTAKUBECONFIG, then KUBECONFIG, and finally
      ~/.kube/config. Users browse and operate Kubernetes resources through the desktop
      interface; authentication is performed using credentials referenced by or stored
      in the local kubeconfig.
tags:
