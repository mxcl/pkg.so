history:
  adoption-history:
    - >
      Avast distributes Secure Browser on Windows, macOS, Android, and iOS. On the
      desktop it follows the familiar Chromium-style browser model while promoting a
      consolidated Security & Privacy Center and optional paid PRO functionality.
  package-nerd-significance:
    - >
      For package-manager users, Avast Secure Browser is an example of a proprietary
      Chromium-family browser maintained through vendor-controlled installers and an
      automatic updater. The Homebrew cask offers Mac users a reproducible installation
      entry point even though upstream development is not conducted in a public project
      repository.
  project-history:
    - >
      Avast Secure Browser developed as Avast's security- and privacy-oriented web
      browser, combining ordinary web browsing with vendor-integrated protection and
      privacy controls. Avast continues to ship platform-specific desktop and mobile
      builds and publishes installation, update, and troubleshooting material through
      its support site.
  related-projects:
    - >
      Avast Secure Browser PRO is the subscription-enhanced edition documented alongside
      the free browser.
    - >
      Avast Online Security & Privacy is an extension that can also run inside Avast
      Secure Browser.
    - >
      Homebrew Cask supplies the avast-secure-browser package-manager entry represented
      by this record.
  sources:
    - 'Official installation guide: https://support.avast.com/article/296/'
    - 'Official product page: https://www.avast.com/secure-browser'
    - >
      Official system requirements:
      https://support.avast.com/en-us/article/system-requirements/
    - >
      Official update guide:
      https://support.avast.com/en-us/article/updating-avast-secure-browser
    - 'source_facts.package-manager.brew-cask: "avast-secure-browser"'
  summary:
    - >
      Avast Secure Browser is a proprietary cross-platform web browser with integrated
      security and privacy features. Avast supplies separate desktop and mobile builds
      and maintains the browser through automatic updates.
  timeline:
    - >
      2020: Apple began its processor transition; Avast subsequently offered separate
      Intel and Apple-silicon Mac installers.
    - '2025: Avast documented automatic and manual update workflows for the desktop browser.'
    - >
      2026: Avast's installation documentation lists Windows, macOS, Android, and iOS
      editions.
  usage:
    - >
      Users browse the web with built-in privacy and security controls, manage those
      controls through the browser's Security & Privacy Center, and optionally activate
      Avast Secure Browser PRO.
    - >
      The desktop browser updates automatically, while users can manually check through
      Help and About Avast Secure Browser. Avast does not document a supported
      user-editable configuration file or credentials file in the reviewed official
      guides.
