history:
  adoption-history:
    - >
      Furtherance is distributed for Linux through Flathub and Debian packages, for
      macOS through Homebrew and disk images, and for Windows through the Microsoft
      Store and MSI installers.
    - >
      Furtherance Sync extended the local-first application with optional end-to-end
      encrypted synchronization. The sync service may be self-hosted or used through the
      project's hosted offering.
  package-nerd-significance:
    - >
      Furtherance occupies the privacy-focused, local-first end of the time-tracker
      ecosystem. Its cross-platform Rust implementation and availability through native
      package channels make it attractive to users who want a desktop tracker without
      making a hosted service the default system of record.
  project-history:
    - >
      Furtherance was created and is maintained by Ricky Kresslein. The application was
      originally GTK-based and was later rewritten with Rust and Iced, introducing a new
      database structure that required users of the older edition to back up and convert
      their data.
    - >
      The project uses calendar-oriented release numbers. Its December 2024 release
      added Furtherance Sync, and subsequent releases developed combined timer/history
      views, Wayland integration, reports, and built-in to-do support.
  related-projects:
    - Furtherance Sync
    - Iced
    - Flathub
  sources:
    - https://github.com/unobserved-io/Furtherance#readme
    - https://github.com/unobserved-io/Furtherance/releases
    - https://github.com/unobserved-io/furtherance-sync#readme
  summary:
    - >
      Furtherance is a free, cross-platform time tracker designed around local ownership
      of activity data, with optional encrypted synchronization.
  timeline:
    - '2024-12: Furtherance Sync support was added to the desktop application.'
    - '2025-01: Releases combined the history and timer views and improved Wayland behavior.'
    - '2025-03: A built-in to-do list was added.'
  usage:
    - >
      A user enters a task name and can annotate it with an `@Project`, `#tags`, and a
      `$rate` before starting the timer. The application also provides Pomodoro timing,
      editable history, reports, and configurable defaults.
    - >
      Synchronization is optional; users who enable it authenticate to either the
      official hosted service or a self-hosted Furtherance Sync server.
