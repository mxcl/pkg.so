history:
  adoption-history:
    - >
      Juicy expanded from a Mac battery-alert utility into a broader power-management
      dashboard. By version 1.4 it monitored connected Apple-device batteries; version
      1.5 added charge limiting, per-application energy history, iPhone and iPad battery
      diagnostics, and power-flow visualization.
    - >
      The official changelog records Homebrew distribution beginning with version 1.5.3
      in July 2026, giving command-line-oriented Mac users a package-managed
      installation and update path.
  package-nerd-significance:
    - >
      Juicy belongs to the long-running category of macOS menu-bar utilities that
      augment a narrowly scoped system feature. Its Homebrew cask, native Swift
      implementation, direct-download edition, Setapp edition, and sandbox-limited Mac
      App Store edition illustrate the distribution choices faced by modern Mac utility
      developers.
  project-history:
    - >
      Independent developer Dominik created Juicy after repeatedly having a Mac run out
      of power at inconvenient times. Version 1.0 was released on November 21, 2025 with
      customizable battery alerts, menu-bar monitoring, and battery-health statistics.
    - >
      Subsequent releases added custom sounds, persistent alerts, Low Power Mode
      controls, connected-device monitoring, charge limiting, energy-use history, and
      localized interfaces. The official site describes it as a native Swift application
      for Intel and Apple-silicon Macs.
  related-projects:
    - >
      The official FAQ positions Juicy alongside AirBuddy, coconutBattery, and iStat
      Menus while emphasizing its combination of connected-device monitoring,
      battery-health data, alerts, and menu-bar presentation.
  sources:
    - >
      https://getjuicy.app/ — official product features, developer account, platform
      details, privacy statement, and distribution information
    - https://getjuicy.app/changelog/ — official dated release history
  summary:
    - >
      Juicy is a commercial macOS menu-bar utility for configurable battery alerts,
      battery-health tracking, charge management, and per-application energy insights.
      It is independently developed and processes battery data locally.
  timeline:
    - '2025-11-21: Juicy 1.0 released'
    - '2026-04-12: Version 1.4 added monitoring and alerts for connected Apple devices'
    - '2026-06-15: Version 1.5 added charge limiting and application energy insights'
    - '2026-07-23: Version 1.5.3 added Homebrew distribution and broader localization'
  usage:
    - >
      Users run Juicy in the menu bar to create alerts at chosen charge levels, inspect
      health, temperature and cycle data, monitor connected devices, identify
      energy-hungry applications, and optionally manage charging behavior.
    - >
      The direct and Setapp editions expose capabilities restricted by the Mac App Store
      sandbox, including dismissing system battery notifications and directly toggling
      Low Power Mode. Homebrew users can install it with `brew install --cask juicy`.
