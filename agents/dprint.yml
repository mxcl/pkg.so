id: brew:dprint
display-name: dprint
repo: null
docs:
  - https://dprint.dev/config
  - https://dprint.dev/install
config-file-location:
  linux:
    - ~/.config/dprint/dprint.jsonc
    - $XDG_CONFIG_HOME/dprint/dprint.jsonc
  macos:
    - ~/.config/dprint/dprint.jsonc
    - $XDG_CONFIG_HOME/dprint/dprint.jsonc
    - ~/Library/Application Support/dprint/dprint.jsonc
  unix:
    - dprint.json
    - dprint.jsonc
    - .dprint.json
    - .dprint.jsonc
  windows:
    - '%APPDATA%\dprint\dprint.jsonc'
credentials-file-location: null
history:
  adoption-history:
    - >
      dprint grew in the same package-manager niche as other fast Rust developer tools:
      a single static-ish CLI distributed through crates.io, npm, Homebrew, Scoop,
      winget, and Linux package managers. Its official README badges and Homebrew
      metadata show it as both a Rust crate and a cross-platform command-line formatter.
  package-nerd-significance:
    - >
      dprint matters to package nerds because it treats formatting as a plugin
      distribution problem: the core executable, plugin registry, checksums, Wasm
      runtime choice, editor integration, and package-manager installs are all part of
      the user experience.
  project-history:
    - >
      The dprint/dprint repository was created in June 2019. The project framed itself
      as a monorepo for a configurable formatting platform rather than a single-language
      formatter, with a core CLI and separate plugins for TypeScript/JavaScript, JSON,
      Markdown, TOML, Dockerfile, Python, PHP, C#/VB, Prettier compatibility, and other
      ecosystems.
  related-projects:
    - Prettier
    - Biome
    - Ruff
    - rustfmt
    - dprint-plugin-typescript
    - dprint-plugin-markdown
  sources:
    - https://github.com/dprint/dprint
    - https://raw.githubusercontent.com/dprint/dprint/main/README.md
    - https://dprint.dev/overview
    - https://dprint.dev/plugins/
    - https://api.github.com/repos/dprint/dprint
    - https://api.github.com/repos/dprint/dprint/releases?per_page=5
  summary:
    - >
      dprint is a Rust-based, pluggable code-formatting platform that provides one CLI
      and configuration model for multiple language formatters.
  timeline:
    - '2019: dprint/dprint was created on GitHub.'
    - >
      2020s: the project expanded from core formatting CLI into a plugin catalog
      covering many languages and wrapper plugins.
    - '2026: releases such as 0.55.x show continuing active maintenance.'
  usage:
    - >
      A typical workflow is to initialize a dprint config, add formatting plugins, run
      dprint fmt locally, and run dprint check in continuous integration. The plugin
      system uses sandboxed Wasm plugins where possible and process plugins where a
      formatter cannot be packaged as a single Wasm file.
related-packages:
  - id: brew:prettier
    reason: >
      dprint provides an official Prettier wrapper plugin, allowing projects to run
      Prettier-supported languages through dprint's shared configuration and command
      workflow.
    rel: adjacent_workflow
    sources:
      - https://dprint.dev/plugins/
      - https://prettier.io/docs/
  - id: brew:biome
    reason: >
      dprint's official Biome wrapper brings Biome's JavaScript, TypeScript, and JSON
      formatting into a mixed-language dprint configuration.
    rel: adjacent_workflow
    sources:
      - https://dprint.dev/plugins/
      - https://biomejs.dev/formatter/
  - id: brew:ruff
    reason: >
      dprint's official Ruff wrapper lets Python formatting participate in the same
      dprint invocation used for other repository languages.
    rel: adjacent_workflow
    sources:
      - https://dprint.dev/plugins/
      - https://docs.astral.sh/ruff/formatter/
  - id: brew:clang-format
    reason: >
      dprint's official clang-format wrapper adds C, C++, and Objective-C formatting to
      dprint's multi-language workflow.
    rel: adjacent_workflow
    sources:
      - https://dprint.dev/plugins/
      - https://clang.llvm.org/docs/ClangFormat.html
tags:
  - cli
  - code-formatter
  - formatting
  - plugins
  - rust
