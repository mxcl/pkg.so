history:
  adoption-history:
    - >
      PixCake's official site says it is trusted by tens of thousands of professional
      photography organizations. Its adoption is oriented toward high-volume commercial
      photography businesses that benefit from consistent retouching, batch processing,
      and coordinated production workflows.
  package-nerd-significance:
    - >
      PixCake is notable to package users as a proprietary, account-based creative
      application in a category increasingly shaped by cloud computation and AI models.
      Packaging the desktop client offers a repeatable installation path for an
      otherwise service-connected commercial photography workflow.
  project-history:
    - >
      PixCake was developed by Xiamen Truesight Technology as an AI-assisted imaging
      product for commercial photography. Official materials describe an evolution
      beyond portrait retouching into RAW processing, AI image generation and
      correction, cloud collaboration, photo selection, delivery, and cross-product
      studio workflows.
    - >
      The broader product family now connects PixCake with tools for tethered capture,
      layout, selection and delivery, illustrating its development from a discrete
      retouching tool into part of an integrated photography-production system.
  related-projects:
    - >
      Official workflows integrate PixCake with sibling products 像素芝士 for capture and
      delivery, 像素苏打 for layout, and 像素曲奇 for photo selection.
  sources:
    - 'Official desktop guide: https://www.pixcakeai.com/guide/32445'
    - 'Official homepage: https://www.pixcakeai.com/'
    - 'Official integrated-workflow guide: https://www.pixcakeai.com/guide/166800'
  summary:
    - >
      像素蛋糕 PixCake is proprietary AI-assisted photo-editing and workflow software for
      commercial photography. It provides portrait and image retouching, RAW-oriented
      color work, batch processing, cloud collaboration, selection, and delivery
      features.
  timeline:
    - >
      By 2026: Official documentation described an integrated capture-to-delivery
      workflow spanning the PixCake product family.
  usage:
    - >
      Photographers and retouchers import shoots into local or cloud projects, use
      AI-assisted selection and batch retouching, refine portraits and color, and export
      finished images. Photography organizations can connect capture, quality control,
      retouching, layout, client selection, and delivery across the vendor's related
      products.
