    - https://www.transcribex.io/privacy_policy.html
    - source_facts.description
  summary:
    - >
      TranscribeX is a local-first macOS AI transcription application for imported
      media, meetings, live captions, and dictation, with optional external AI-service
      integrations.
  timeline:
    - >
      2025-10-09: Official changelog records version 1.4.5 with speaker diarization and
      a redesigned transcription interface.
    - '2025-11-28: Folder monitoring and bulk export were documented.'
    - '2025-12-11: Apple Foundation Models support was added.'
    - '2026-04-30: Real-time meeting and recording transcription was added.'
    - '2026-06-13: A redesigned dictation workflow was released.'
    - '2026-08-05: CLI and Model Context Protocol support were added.'
  usage:
    - >
      Users can import audio or video, monitor folders, record meetings or microphone
      input, produce live captions, dictate into Mac applications, identify speakers,
      edit transcripts, and export text or subtitle formats. Transcription can run
      locally; cloud AI services and their API keys are optional.
