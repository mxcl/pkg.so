history:
  adoption-history:
    - >
      TunnelBear expanded from its original service into applications for major desktop,
      mobile, and browser platforms, presenting VPN access through a consumer-oriented
      interface rather than manual VPN configuration.
  package-nerd-significance:
    - >
      TunnelBear represents the packaged, account-backed end of VPN software: users
      install a native client and let it manage tunnels, locations, and authentication
      instead of configuring a general-purpose VPN daemon.
  project-history:
    - >
      TunnelBear says it started in 2011 with the goal of making privacy protection easy
      to use. Its official writing emphasizes simple applications, limited activity
      logging, and user-facing privacy controls.
  related-projects:
    - >
      TunnelBear's browser extensions complement its native desktop and mobile clients
      but protect browser traffic rather than serving as equivalent system-wide clients.
  sources:
    - https://help.tunnelbear.com/
    - https://www.tunnelbear.com/
    - https://www.tunnelbear.com/about/
    - https://www.tunnelbear.com/blog/tunnelbear-and-the-gdpr/
  summary:
    - >
      TunnelBear is a consumer VPN service and collection of native clients designed to
      provide private browsing through a simple location-based interface.
  timeline:
    - '2011: TunnelBear began operating as an easy-to-use privacy service.'
    - >
      2018: TunnelBear introduced privacy-management tools alongside its GDPR-related
      policy changes.
  usage:
    - >
      Users create or sign in to a TunnelBear account, choose a tunnel location, and
      enable the connection. On macOS, installation also adds a privileged helper
      required to establish VPN connections.
