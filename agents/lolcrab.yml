history:
  adoption-history:
    - >
      `lolcrab` is distributed as a Rust crate and through package-manager channels. Its
      README points users to precompiled Linux, macOS, and Windows binaries on GitHub
      releases, documents `cargo install lolcrab`, and includes a Repology packaging
      badge; the batch input records Homebrew packaging.
  package-nerd-significance:
    - >
      `lolcrab` is small but package-catalog-friendly: it is a cross-platform terminal
      toy, a Rust binary crate, and a modern variant of the long-running `lolcat`
      terminal-filter idea. It is useful when testing packaging of Rust CLI tools with
      release binaries and Cargo installation paths.
  project-history:
    - >
      The official README says `lolcrab` is a fork of `lcat-rs`, placing it in the
      family of playful terminal color filters descended from `lolcat`. The GitHub
      repository was created in 2021, and GitHub releases show the public 0.2 through
      0.4 series continuing into 2025.
  related-projects:
    - `lcat-rs` is the upstream project named in the README as the fork source.
    - `lolcat` is the older terminal-colorizer concept that `lolcrab` explicitly references.
  sources:
    - https://api.github.com/repos/mazznoer/lolcrab
    - https://github.com/mazznoer/lolcrab#readme
    - https://github.com/mazznoer/lolcrab/releases/tag/v0.4.1
    - source_facts.package-manager-url
  summary:
    - >
      `lolcrab` is a Rust terminal colorizer that describes itself as like `lolcat` but
      with OpenSimplex-style noise and more color. It reads files or standard input and
      colorizes terminal output with gradients, animation, and configurable noise
      parameters.
  timeline:
    - '2021: `mazznoer/lolcrab` repository created on GitHub.'
    - '2022: v0.2.0 release published on GitHub.'
    - '2024: v0.4.0 release published on GitHub.'
    - '2025: v0.4.1 release published on GitHub.'
  usage:
    - >
      The CLI accepts files or standard input, defaults to a rainbow gradient, and
      exposes options for gradient selection, custom CSS gradients, noise scale, seed,
      inverted/background coloring, animation, and version/help output. The README also
      documents library use from Rust through `Lolcrab::new` and `colorize_str`.
related-packages:
  - id: brew:lolcat
    reason: >
      Choose lolcat for the older, simpler Ruby rainbow filter; lolcrab's own
      documentation identifies lolcat as the baseline while adding noise, custom
      gradients, and richer animation controls.
    rel: alternative
    sources:
      - https://github.com/mazznoer/lolcrab#readme
      - https://github.com/busyloop/lolcat#readme
