    - ~/.ditaotrc
    - <DITA-OT installation directory>/.ditaotrc
    - <DITA-OT installation directory>/local.properties
credentials-file-location: null
history:
  adoption-history:
    - >
      DITA-OT is tied to the DITA authoring standard and the OASIS DITA community rather
      than to a single vendor product. Its website links source code, issue tracking,
      documentation source, community discussions, user groups, Stack Overflow tags, and
      recurring DITA-OT Day events, all signs of a specialized but durable
      documentation-tool ecosystem.
  package-nerd-significance:
    - >
      DITA-OT is package-nerdy because it packages a fairly complex Java/XML publishing
      stack behind one command. For documentation teams, installing dita-ot from a
      package manager is the boring, reproducible way to put DITA builds on developer
      laptops and CI runners.
  project-history:
    - >
      The project maintains a long release history back to the 1.0 era and now publishes
      current documentation through dita-ot.org. Its README describes a Java-based
      toolkit distributed as installable packages and built from source with Gradle.
  related-projects:
    - OASIS DITA is the standard around which DITA-OT is built.
    - >
      Apache FOP and XML graphics tooling appear in DITA-OT's release notes as part of
      the PDF publishing stack.
  sources:
    - https://www.dita-ot.org/
    - https://www.dita-ot.org/dev/
    - https://github.com/dita-ot/dita-ot#readme
    - https://www.dita-ot.org/4.3/topics/release-history
    - https://www.dita-ot.org/4.3/release-notes/
  summary:
    - >
      DITA Open Toolkit, usually shortened to DITA-OT, is an open-source publishing
      engine for content authored in the Darwin Information Typing Architecture. In
      package-manager terms it is the command-line engine behind many XML documentation
      build pipelines.
  timeline:
    - '2000s: DITA-OT 1.x line establishes the toolkit for DITA publishing.'
    - '2013: DITA-OT 1.8 release appears in the modern GitHub release history.'
    - '2015: DITA-OT 2.x documentation era introduces the newer site structure.'
    - '2025: DITA-OT 4.3 release notes document continued Java 17-based releases.'
  usage:
    - >
      Users run the included dita command with an input DITA map or topic and an output
      format, often inside documentation build scripts or CI jobs. The toolkit supports
      plug-ins, transformations, project files, and multiple output formats, so it
      functions as both a CLI and an extension point for publishing systems.
