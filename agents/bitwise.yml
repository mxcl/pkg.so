history:
  adoption-history:
    - >
      The README documents installation across Ubuntu, Snap, openSUSE, Arch AUR, Void,
      Fedora, Buildroot, Yocto, MacPorts, Homebrew, and Nix. The input package-manager
      data also lists several mainstream Unix package managers.
    - >
      Its packaging footprint is broader than its small scope because bit/base
      conversion is useful in embedded, kernel, networking, and driver work where
      terminal tools are preferred.
  package-nerd-significance:
    - >
      Bitwise is a compact example of the sort of utility package that earns its place
      by replacing mental arithmetic and ad hoc shell snippets with one focused terminal
      UI.
    - >
      Its significance is not ecosystem size but shape: ncurses, readline, packaged
      across Unix systems, and aimed at people reading registers, masks, addresses, and
      wire-level values.
  project-history:
    - >
      The GitHub repository was created in 2019. Releases moved quickly through 0.3x and
      0.4x in 2019, with v0.50 published in July 2023 and reflected in the generated man
      page.
  related-projects:
    - vim-bitwise is linked by the README as editor integration.
    - ncurses and readline are build-time/runtime libraries used for the terminal interface.
    - >
      Buildroot and Yocto are relevant downstream environments because the README notes
      Bitwise availability there.
  sources:
    - https://github.com/mellowcandle/bitwise#readme
    - https://github.com/mellowcandle/bitwise/blob/master/bitwise.1
    - source_facts.package-manager
  summary:
    - >
      Bitwise is a terminal bit-manipulation calculator with an ncurses interface and a
      command-line expression mode. The README describes it as a multi-base interactive
      calculator for low-level hackers, kernel developers, and device-driver developers.
  timeline:
    - '2019: mellowcandle/bitwise repository created.'
    - '2019-07-10: v0.30 release published.'
    - '2021-11-01: v0.43 release published.'
    - '2023-07-20: v0.50 release published.'
  usage:
    - >
      Without arguments, bitwise starts in interactive mode, where users can toggle
      individual bits, change bit widths, reverse endianness, and evaluate expressions.
      With an expression argument, it prints results in multiple bases, including
      binary.
    - >
      The README also documents IPv4 address parsing and a Vim integration project,
      making it useful as both a standalone terminal tool and a helper for editor-driven
      low-level work.
