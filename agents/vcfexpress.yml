history:
  adoption-history:
    - >
      The official project supports installation with Cargo and publishes static Linux
      binaries; the input also records a Homebrew formula.
  package-nerd-significance:
    - >
      vcfexpress is a compact Rust bioinformatics utility that embeds Lua/Luau-style
      expressions rather than imposing a fixed query language. This makes it useful in
      Unix pipelines where researchers need fast, programmable filtering or custom
      textual output without building a larger application.
  project-history:
    - >
      vcfexpress was created as an experiment in using user expressions to filter and
      modify VCF data and to render optional output templates. The project developed a
      documented Lua-facing API for variants, genotypes, samples, and VCF headers.
  related-projects:
    - VCF and BCF are the variant-data formats processed by the tool.
    - >
      Lua provides filtering and mutation expressions, while Luau string templates
      provide formatted output.
  sources:
    - https://github.com/brentp/vcfexpress
    - https://github.com/brentp/vcfexpress/blob/main/lua-api.md
    - source_facts.package-manager.brew
  summary:
    - >
      vcfexpress is a Rust command-line utility for filtering and modifying VCF or BCF
      genomic variant files with Lua expressions and optionally formatting results with
      templates.
  timeline:
    - >
      The project expanded from expression-based VCF filtering to documented mutation,
      prelude scripting, templates, and a dedicated Lua API.
  usage:
    - >
      Typical commands run `vcfexpress filter` on a VCF or BCF file, supplying Lua
      boolean expressions, optional field-setting expressions, reusable prelude scripts,
      and an optional output template or output file.
