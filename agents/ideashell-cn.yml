id: cask:ideashell-cn
display-name: ideaShell CN
repo: null
docs:
  - https://docs.ideashell.cn/en
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official sources present ideaShell as a consumer productivity product spanning
      desktop, mobile, and Apple Watch workflows, but do not publish reliable adoption
      milestones or durable usage figures.
  package-nerd-significance:
    - >
      The Homebrew cask is the China-edition distribution of a modern AI note-taking
      application, representing the growing class of voice-first, AI-assisted personal
      knowledge tools packaged for macOS.
  project-history:
    - >
      ideaShell was created around the idea that notes should become an evolving
      personal memory rather than passive storage. Its official account explains the
      name through the metaphor of an idea being polished like a grain of sand inside a
      shell.
  related-projects:
    - Traditional note-taking and personal-knowledge-management applications
    - Voice transcription and AI-assistant tools
  sources:
    - Input source_facts.description and source_facts.homepage
    - 'Official ideaShell about page: https://www.ideashell.cn/about-en.html'
    - 'Official ideaShell documentation: https://docs.ideashell.cn/en/'
  summary:
    - >
      ideaShell is an AI-oriented note, voice-capture, and task application. The
      packaged variant is specifically identified as the China edition.
  timeline:
    - >
      Undated: ideaShell established its voice-first, AI-assisted personal-memory
      product direction.
  usage:
    - >
      Users capture speech, text, images, scans, and to-dos, then organize or transform
      the material with smart folders, tags, templates, transcription, and AI-assisted
      categorization.
tags:
  - ai-notes
  - personal-knowledge-management
  - task-management
  - transcription
  - voice-capture
provenance:
  category-sources:
    - >
      Official product and documentation pages describe voice capture, notes, smart
      folders, tags, templates, and AI-assisted organization:
      https://www.ideashell.cn/about-en.html and https://docs.ideashell.cn/en/
    - source_facts.description identifies an AI partner for notes, voice, and to-dos.
  display-name-sources:
    - current_curation.display-name
    - source_facts.description identifies this package as the China edition of ideaShell.
  docs-sources:
    - Official dedicated ideaShell help, tutorial, and documentation site.
  history-sources:
    - Input source_facts.description and source_facts.homepage
    - 'Official ideaShell about page: https://www.ideashell.cn/about-en.html'
    - 'Official ideaShell documentation: https://docs.ideashell.cn/en/'
  repo-sources:
    - >
      The official homepage and documentation expose no verified official HTTP(S)
      source-control repository.
    - source_facts.repo is empty.
  tags-sources:
