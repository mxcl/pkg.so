history:
  adoption-history:
    - >
      Texts expanded the unified-inbox model across major messaging networks, including
      iMessage, WhatsApp, Telegram, Signal, Messenger, Instagram, Slack, and Discord
      DMs. Automattic acquired Texts in 2023 and acquired Beeper in 2024, bringing the
      teams and technology together.
  package-nerd-significance:
    - >
      Texts is notable to desktop-software collectors as a proprietary, cross-platform
      messaging aggregator distributed on macOS through a Homebrew cask. Its on-device
      integration model distinguishes it from unified messengers whose bridges run
      primarily in the cloud.
  project-history:
    - >
      Kishan Bagaria founded Texts as a desktop client that combines multiple messaging
      services in one inbox. Automattic acquired the product in 2023. The Texts and
      Beeper efforts were subsequently combined, and the original Texts site now directs
      users toward the newer Beeper application.
  related-projects:
    - >
      Beeper is the successor-oriented related product produced by the combined Texts
      and Beeper organization.
    - >
      Homebrew Cask supplies the automattic-texts package-manager entry represented by
      this record.
  sources:
    - 'Official Texts FAQ: https://texts.com/faq'
    - 'Official Texts homepage: https://texts.com/'
    - 'Official Texts privacy policy: https://texts.com/privacy'
    - 'source_facts.package-manager.brew-cask: "automattic-texts"'
  summary:
    - >
      Texts is a proprietary unified messaging client founded by Kishan Bagaria and
      later acquired by Automattic. It presents conversations from numerous messaging
      services in a single desktop inbox while keeping message handling and service
      credentials on the user's device.
  timeline:
    - '2023: Automattic acquired Texts.'
    - '2024: Automattic acquired Beeper and combined the Texts and Beeper teams and technology.'
    - '2026: The Texts homepage presents Beeper as the next generation of the product.'
  usage:
    - >
      Users connect their existing messaging-service accounts and manage direct messages
      from one inbox. Texts supports inbox-oriented workflows such as archiving
      conversations and provides productivity features including chat summaries.
    - >
      The official privacy material says service credentials are stored locally using
      the operating system credential store, such as Apple Keychain on macOS; it does
      not document a user-managed credentials file.
