id: brew:exiftran
display-name: exiftran
repo: https://gitlab.com/kraxel/fbida
docs:
  - https://gitlab.com/kraxel/fbida/-/blob/master/README.md
  - https://gitlab.com/kraxel/fbida/-/blob/master/man/exiftran.1
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata lists exiftran packages in Homebrew, Debian,
      MacPorts, and Ubuntu, which reflects its role as a small Unix-style utility
      packaged across desktop and server-oriented systems.
  package-nerd-significance:
    - >
      Package maintainers care about exiftran because it is a narrow, scriptable image
      utility with behavior that jpegtran does not cover: it preserves and updates
      camera metadata and thumbnails during lossless JPEG transforms.
  project-history:
    - >
      The exiftran manual identifies the tool as EXIFTRAN 2.09 with copyright dates
      2002-2012. The fbida repository groups several photo-oriented image tools together
      because they share code, with fbi and ida giving the project its name and exiftran
      provided as the JPEG transformation utility.
  related-projects:
    - fbida bundles fbi, fbpdf, ida, exiftran, and thumbnail.cgi.
    - >
      The exiftran manual compares its lossless JPEG transforms with jpegtran and notes
      that exiftran also handles EXIF data.
  sources:
    - https://gitlab.com/kraxel/fbida/-/blob/master/README.md
    - https://gitlab.com/kraxel/fbida/-/blob/master/man/exiftran.1
    - https://www.kraxel.org/blog/linux/fbida/
    - source_facts.package-manager
  summary:
    - >
      exiftran is the command-line EXIF-aware JPEG transformation tool in Gerd
      Hoffmann's fbida project. It performs lossless rotations and flips like jpegtran
      while also updating EXIF orientation, image dimensions, and the embedded EXIF
      thumbnail.
  timeline:
    - '2002-2012: exiftran manual copyright range.'
    - '2012: fbida tag 2.09 includes the exiftran 2.09 manual.'
    - '2020: fbida project appears on GitLab under kraxel/fbida.'
    - '2026: GitLab tags show fbida-2.15-1 activity.'
  usage:
    - >
      The manual documents batch operation on one or more JPEG files, automatic rotation
      from the EXIF orientation tag, in-place editing with optional backups, timestamp
      preservation, JPEG comment editing, EXIF dumping, and thumbnail regeneration.
related-packages:
  - id: brew:jhead
    reason: >
      Choose jhead when you want a small JPEG metadata tool that can drive jpegtran for
      orientation-based rotation as part of a broader timestamp, rename, and metadata
      workflow.
    rel: alternative
    sources:
      - https://www.kraxel.org/blog/linux/fbida/
      - https://github.com/Matthias-Wandel/jhead
  - id: brew:jpeg
    reason: >
      Choose the IJG jpegtran supplied by this package for plain lossless JPEG
      transforms; choose exiftran when EXIF data and embedded thumbnails must be
      transformed consistently too.
    rel: alternative
    sources:
      - https://www.kraxel.org/blog/linux/fbida/
      - https://www.ijg.org/
  - id: brew:imagemagick
    reason: >
      Choose ImageMagick when resizing, format conversion, compositing, or general image
      editing matters more than exiftran's narrow lossless JPEG-and-EXIF workflow.
    rel: alternative
    sources:
      - https://www.kraxel.org/blog/linux/fbida/
      - https://imagemagick.org/command-line-processing
