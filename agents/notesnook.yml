history:
  adoption-history:
    - >
      Notesnook's developers reported that users' trust concerns were a major reason for
      opening the source in 2022. The project subsequently expanded its public clients,
      importer, web clipper, help center, education offering, and integrations while
      maintaining desktop, web, and mobile applications.
  package-nerd-significance:
    - >
      Notesnook is significant in privacy-oriented software circles because it combines
      end-to-end encrypted synchronization with open-source clients and server
      components. Its cross-platform monorepo and documented use of XChaCha20-Poly1305
      and Argon2 make its security claims inspectable rather than purely proprietary.
  project-history:
    - >
      Streetwriters developed Notesnook as a private, convenient alternative to
      mainstream note services. A 2021 project essay explained its aim to avoid
      advertising, tracking, and lock-in. In August 2022 the team announced that its
      clients, shared core, editor, and sync server would be open sourced. Version 3
      arrived in April 2024 after an eight-month architectural rewrite that introduced a
      new sync engine and SQLite-based storage.
  related-projects:
    - >
      The project positions itself as an alternative to Evernote, OneNote, Standard
      Notes, Obsidian, Joplin, and Google Keep. Separate official components include the
      Notesnook sync server and importer.
  sources:
    - https://github.com/streetwriters/notesnook
    - https://notesnook.com/blog/introducing-notesnook-v3
    - https://notesnook.com/blog/notesnook-is-going-open-source
    - https://notesnook.com/blog/why-another-note-taking-app
    - https://notesnook.com/help/
  summary:
    - >
      Notesnook is a cross-platform, open-source note-taking service built around
      end-to-end encryption, zero-knowledge synchronization, and user-controlled export
      and backup.
  timeline:
    - '2021: The team published its rationale for building Notesnook.'
    - '2022: Notesnook announced its transition to open source.'
    - '2024: Notesnook v3 introduced a rewritten sync engine and SQLite-based architecture.'
  usage:
    - >
      Users create and organize encrypted notes with notebooks, tags, links, tasks,
      tables, attachments, reminders, and a private vault. Notes synchronize across
      desktop, web, and mobile clients; official tools support importing from other note
      applications, backups, publishing selected notes, and web clipping.
