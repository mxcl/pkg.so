id: brew:cf2tf
display-name: cf2tf
repo: https://github.com/DontShaveTheYak/cf2tf
docs:
  - https://github.com/DontShaveTheYak/cf2tf#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as a PyPI package and is packaged by Homebrew as
      `cf2tf`. That makes it visible to both Python users and macOS/Linux
      package-manager users who need one-off CloudFormation-to-Terraform conversion
      during migration work.
  package-nerd-significance:
    - >
      Package nerds care about cf2tf because it is a narrow migration helper: not a
      Terraform provider, not an AWS deployment tool, just a packaged converter for an
      awkward infrastructure-as-code boundary.
  project-history:
    - >
      The public GitHub repository was created in 2022 and the README documents the
      project as Cloudformation 2 Terraform, a CLI that reads a CloudFormation template
      and emits Terraform resources. The README also notes that cfn-flip is used to
      parse YAML into a Python dictionary, placing cf2tf in the small ecosystem of
      CloudFormation template tooling.
  related-projects:
    - >
      AWS CloudFormation Template Flip is acknowledged by cf2tf as the parser used to
      convert templates from YAML to Python dictionaries.
    - Terraform and HashiCorp HCL are the target ecosystem for generated output.
  sources:
    - https://api.github.com/repos/DontShaveTheYak/cf2tf
    - https://github.com/DontShaveTheYak/cf2tf
    - https://github.com/DontShaveTheYak/cf2tf#readme
    - https://formulae.brew.sh/api/formula/cf2tf.json
  summary:
    - >
      cf2tf is a Python command-line converter for moving AWS CloudFormation templates
      toward Terraform HCL. Its own README frames the tool as an attempt rather than a
      perfect translator, because some CloudFormation data shapes do not map cleanly to
      HCL.
  timeline:
    - '2022: GitHub repository created.'
    - '2022: First GitHub release metadata published for tag 0.0.0.'
    - '2026: GitHub release metadata shows tag 0.9.2.'
  usage:
    - >
      The documented CLI usage is `cf2tf my_template.yaml`, optionally redirecting
      stdout to `main.tf` or using `-o` to split output into files by resource type.
related-packages:
  - id: brew:cfn-flip
    reason: >
      Use AWS CloudFormation Template Flip alongside cf2tf when you need standalone
      JSON/YAML template normalization; cf2tf itself documents using its `cfn_tools`
      parser during conversion.
    rel: adjacent_workflow
    sources:
      - https://github.com/DontShaveTheYak/cf2tf
      - https://github.com/awslabs/aws-cfn-template-flip
