history:
  adoption-history:
    - >
      errcheck became a familiar component of Go static-analysis workflows and is
      distributed through Go installation tooling as well as system package managers
      such as Homebrew and Nix, as recorded in source_facts.package-manager.
  package-nerd-significance:
    - >
      The tool captures a characteristic Go concern: returned errors are ordinary values
      and may be accidentally discarded. Package enthusiasts value errcheck as a focused
      Unix-style checker and as an early, recognizable member of the broader Go linting
      ecosystem.
  project-history:
    - >
      errcheck is maintained in the kisielk/errcheck repository as a focused
      static-analysis command for detecting unchecked Go error returns. Upstream also
      exposes an experimental Analyzer for integration with the go/analysis API.
  related-projects:
    - >
      The official README points users seeking deeper analysis toward Staticcheck.
      errcheck is also commonly encountered through multi-linter runners, although its
      standalone command remains useful.
  sources:
    - https://github.com/kisielk/errcheck
    - source_facts.package-manager
  summary:
    - >
      errcheck is a Go static-analysis command that reports error-valued results which
      are neither assigned nor explicitly discarded.
  timeline:
    - 'Current project: Distributed as a Go command and an experimental go/analysis Analyzer.'
  usage:
    - >
      Users run `errcheck` against one or more Go package patterns, commonly `./...`.
      Optional checks cover blank-identifier assignments and type assertions, while
      `-exclude` accepts an explicitly selected exclusions file. Because upstream
      documents no fixed default configuration path, the config-file-location is null.
related-packages:
  - id: brew:staticcheck
    reason: >
      Choose Staticcheck when you want a broader Go linter covering correctness,
      performance, simplification, and style issues; errcheck's own README recommends it
      for analysis beyond unhandled returns.
    rel: alternative
    sources:
      - https://github.com/kisielk/errcheck#readme
      - https://staticcheck.dev/docs/
