history:
  adoption-history:
    - >
      By May 2023, Raycast reported more than 100,000 daily users, a community of 13,000
      members, and over 1,000 extensions. In 2024 it said the product served hundreds of
      thousands of Mac users, and it subsequently expanded toward iOS and Windows.
  package-nerd-significance:
    - >
      Raycast is notable in macOS package collections because it combines application
      launching, window management, clipboard history, snippets, search, automation, and
      a package-like extension store in one keyboard-driven interface. Its extension
      ecosystem makes the launcher a programmable productivity platform rather than
      merely an application switcher.
  project-history:
    - >
      Raycast was founded and launched in 2020 with an initial focus on macOS. It grew
      from a launcher into a broader productivity platform with extensions, team tools,
      AI, notes, and cloud synchronization. Raycast Pro launched in 2023, iOS followed
      in 2025, and the company publicly expanded the client architecture to support
      Windows.
  related-projects:
    - Raycast Store distributes third-party extensions built with the official Raycast API.
    - Raycast Pro adds AI, synchronization, and other subscription features.
    - >
      The official raycast/extensions repository hosts store extensions, but it is not
      the source repository for the proprietary Raycast desktop application.
  sources:
    - >
      Official Raycast 2.0 technical history:
      https://www.raycast.com/blog/a-technical-deep-dive-into-the-new-raycast
    - 'Official Raycast Pro announcement: https://www.raycast.com/blog/introducing-raycast-pro'
    - >
      Official Series B and platform-expansion announcement:
      https://www.raycast.com/blog/series-b
    - 'Official manual: https://manual.raycast.com/'
  summary:
    - >
      Raycast is a keyboard-driven productivity launcher that began on macOS and
      developed into a platform for commands, extensions, search, window management,
      notes, clipboard workflows, and AI-assisted work.
  timeline:
    - '2020: Raycast was founded and first launched.'
    - '2023: Raycast Pro introduced AI and Cloud Sync.'
    - '2024: Raycast announced expansion to Windows and iOS.'
    - '2025: Raycast released iOS and opened the Windows public beta.'
    - '2026: Raycast announced a ground-up, cross-platform 2.0 rewrite.'
  usage:
    - >
      Users summon Raycast with a global shortcut, search for applications, files, and
      commands, and assign aliases or hotkeys to frequently used actions. Extensions
      integrate external services and developer workflows; settings can be exported and
      imported through the application UI.
