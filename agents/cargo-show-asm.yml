history:
  adoption-history:
    - >
      The crate is distributed through crates.io and batch package facts list Homebrew,
      MacPorts, Alpine, Nix, and Arch packaging. crates.io categorizes it as a Cargo
      plugin and debugging tool.
  package-nerd-significance:
    - >
      It gives Rust developers a convenient Cargo-native view into compiler output,
      useful for performance work, codegen inspection, and understanding exactly what a
      dependency or crate compiles down to.
  project-history:
    - >
      The GitHub repository was created in March 2022 and the crate was first published
      to crates.io in April 2022. Its README documents support for Linux and macOS,
      limited Windows support, stable and nightly Rust, multiple CPU architectures, and
      cross-compilation.
  related-projects:
    - The tool delegates to rustc/Cargo build outputs and supports llvm-mca analysis.
    - >
      The executable name in package facts is cargo-asm, matching the README's cargo asm
      usage.
  sources:
    - https://api.github.com/repos/pacak/cargo-show-asm
    - https://github.com/pacak/cargo-show-asm
    - https://github.com/pacak/cargo-show-asm#readme
    - https://crates.io/api/v1/crates/cargo-show-asm
    - https://formulae.brew.sh/api/formula/cargo-show-asm.json
  summary:
    - >
      cargo-show-asm is a Cargo subcommand, invoked as cargo asm, for displaying
      generated assembly, LLVM IR, MIR, WebAssembly, and llvm-mca analysis for Rust
      code.
  timeline:
    - '2022: Repository created and first crates.io release published.'
    - '2026: GitHub repository remained active and crates.io reported v0.2.62 as latest.'
    - '2026: README documented assembly, LLVM IR, MIR, WASM, and llvm-mca output modes.'
  usage:
    - >
      Users install cargo-show-asm and run cargo asm, narrowing by package, artifact,
      function name, output format, CPU target, profile, or source scope. The README
      also documents JSON output, call-graph filtering, shell completions, and color
      features.
