id: brew:activemq-cpp
display-name: ActiveMQ-CPP
repo: https://github.com/apache/activemq-cpp
docs:
  - https://activemq.apache.org/components/cms/documentation
  - https://activemq.apache.org/components/cms/documentation/api_docs/activemqcpp-3.9.0/html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official download list shows a long 1.x, 2.x, and 3.x release line from
      ActiveMQ-CPP 1.0 through 3.9.5, plus CMS API releases. Homebrew and distribution
      package records reflect its role as a packaged native client library for C++
      messaging applications.
  package-nerd-significance:
    - >
      ActiveMQ-CPP is packaging-relevant because it is a native C++ dependency with APR,
      APR-Util, OpenSSL, CppUnit, autotools, generated docs, test binaries, and
      platform-specific build notes, the kind of library where package recipes encode
      real build-system knowledge.
  project-history:
    - >
      Apache documents CMS as a C++ Messaging Service API and identifies ActiveMQ-CPP as
      its implementation. The library supports OpenWire and Stomp over TCP and SSL,
      failover transport, and auxiliary portable classes for threading, I/O, sockets,
      and synchronization.
  related-projects:
    - >
      The Apache CMS pages relate ActiveMQ-CPP to Apache ActiveMQ, the CMS API,
      OpenWire, Stomp, APR, APR-Util, CppUnit, and OpenSSL.
  sources:
    - >
      Official Apache ActiveMQ-CPP source README for build, test, platform, and
      dependency history.
    - >
      Official Apache CMS component, documentation, and download pages for project
      purpose and release line.
    - Official Apache GitHub tag metadata for release tag dates.
  summary:
    - >
      ActiveMQ-CPP is Apache ActiveMQ's C++ client library implementing the CMS API, a
      JMS-like interface for C++ applications talking to message brokers such as Apache
      ActiveMQ.
  timeline:
    - '2007: ActiveMQ-CPP 1.0 tag created.'
    - '2007: CMS API 1.0 tag created.'
    - '2009: ActiveMQ-CPP 3.0 tag created.'
    - '2013: ActiveMQ-CPP 3.7.0 tag created.'
    - '2019: ActiveMQ-CPP 3.9.5 release tag created.'
    - '2025: Apache CMS download page lists 3.9.5 as the current stable release.'
  usage:
    - >
      Developers link the library into C++ clients that need to connect to a message
      broker. The source README documents Unix builds with autogen.sh, ./configure,
      make, make install, Doxygen generation, unit tests, integration tests against a
      broker, and MSVC support on Windows.
related-packages:
  - id: brew:activemq
    reason: >
      ActiveMQ-CPP is client-only, so install or connect it to Apache ActiveMQ when C++
      producers and consumers need an actual broker for CMS messaging.
    rel: adjacent_workflow
    sources:
      - https://activemq.apache.org/components/cms/documentation
      - https://activemq.apache.org/components/classic/
tags:
