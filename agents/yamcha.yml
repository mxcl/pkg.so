history:
  adoption-history:
    - >
      YamCha's adoption came through NLP research and language-processing pipelines
      rather than general developer tooling. The companion ACL paper, Chunking with
      Support Vector Machines, connects the software to the 2001 NAACL work by Kudo and
      Matsumoto and to the then-current practice of comparing chunkers on shared tasks.
    - >
      The package remained relevant in Unix package managers because it bundled training
      and decoding commands plus a C/C++ library around TinySVM-era models. For users
      maintaining older NLP experiments, YamCha is a reproducibility and compatibility
      artifact as much as a current modeling choice.
  package-nerd-significance:
    - >
      YamCha is historically significant because it packages a specific research-era NLP
      method into a reusable Unix tool. It sits beside ChaSen, TinySVM, CaboCha, CRF++,
      and MeCab in Taku Kudo's ecosystem of compact Japanese/NLP-oriented C and C++
      tools that escaped academia into package managers.
  project-history:
    - >
      The official YamCha page describes it as a generic, customizable text chunker for
      POS tagging, named-entity recognition, base noun phrase chunking, and text
      chunking. It says the system used support vector machines and was the same system
      that performed best in the CoNLL-2000 shared task and a BaseNP chunking task.
    - >
      The YamCha news log records an initial 0.1 release in July 2001, followed by a
      steady 2002-2005 sequence that added multi-class strategies, memory savings for
      large models, C API support, PKE acceleration, experimental Perl/Python/Ruby
      modules, 64-bit support, and bug fixes. The project page was last revised in late
      2005, matching the period when SVM chunkers were a mainstream statistical NLP
      approach.
  related-projects:
    - TinySVM is a direct dependency named by the official installation instructions.
    - >
      ChaSen, CaboCha, CRF++, and MeCab are related Taku Kudo or Japanese NLP tools from
      the same broader ecosystem.
  sources:
    - http://chasen.org/~taku/software/yamcha/
    - https://aclanthology.org/N01-1025/
  summary:
    - >
      YamCha, Yet Another Multipurpose CHunk Annotator, is Taku Kudo's open-source text
      chunker built around support vector machines. It belongs to the pre-deep-learning
      generation of NLP packages where feature templates, chunk encodings, and SVM
      training pipelines were packaged as reusable command-line tools.
  timeline:
    - >
      2001: Kudo and Matsumoto published Chunking with Support Vector Machines at NAACL,
      and YamCha 0.1 was released in July.
    - >
      2002: YamCha 0.2 added multi-class strategy selection, memory savings for large
      model files, and broader compiler support.
    - >
      2004: YamCha 0.30 added PKE acceleration and a C API; 0.31 added experimental
      Perl, Python, and Ruby modules.
    - '2005: YamCha 0.33 added experimental 64-bit support and bag-of-words features.'
  usage:
    - >
      Typical use is to prepare token-per-line training or test data with feature
      columns and chunk labels, train a model with YamCha's template-driven SVM
      pipeline, and run the `yamcha` decoder or `yamcha-mkmodel` tooling. The official
      documentation emphasizes feature windows, parsing direction, pairwise versus
      one-vs-rest multiclass strategies, partial chunking, and model conversion for
      faster classification.
