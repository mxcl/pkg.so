credentials-file-location: null
history:
  adoption-history:
    - >
      karn reached package-manager visibility through Homebrew and the Arch User
      Repository, which fits its audience: developers who want a shell-friendly way to
      keep Git identities separated without remembering per-repository commands.
  package-nerd-significance:
    - >
      karn is a tidy example of a package-manager-sized developer convenience: a tiny
      binary, a dotfile, and a focused fix for a workflow footgun that Git itself leaves
      to local config discipline.
  project-history:
    - >
      The project began as a Go command-line tool in March 2015. Its README describes
      the core behavior: karn checks a directory tree, compares it with a user
      configuration, and updates only a repository's local Git identity rather than the
      global Git configuration.
    - >
      The release series stayed intentionally narrow. The v0.0.1 release was tagged from
      the initial implementation, and v0.1.0 in February 2021 added support for GPG
      signing keys.
  related-projects:
    - >
      Git local configuration, shell Git wrappers, and other per-repository identity
      helpers solve adjacent problems.
  sources:
    - https://formulae.brew.sh/formula/karn
    - https://github.com/prydonius/karn
    - https://github.com/prydonius/karn/commit/4d49400ffccd398cb3226a690102d58aeef26d93.patch
    - https://github.com/prydonius/karn/commit/884cdbe20b0aed1e8f3c4d0df8f76a58a5b72f55.patch
    - https://github.com/prydonius/karn/releases/tag/v0.0.1
    - https://github.com/prydonius/karn/releases/tag/v0.1.0
  summary:
    - >
      karn is a small Git identity helper for developers who use different user.name and
      user.email values across personal, work, and open-source repositories.
  timeline:
    - '2015-03-28: Initial commit for the Go implementation'
    - '2015-03-29: v0.0.1 release'
    - '2021-02-12: v0.1.0 release work added GPG signing-key support'
  usage:
    - >
      Typical use is to keep identity rules in ~/.karn.yml, then run karn manually or
      wrap Git commands so karn update runs before Git operations.
