history:
  adoption-history:
    - >
      The ESE format matters because upstream documents it as being used by Windows
      Search, Windows Mail, Exchange, and Active Directory. That makes libesedb useful
      to digital forensics, incident response, e-discovery, and data-migration workflows
      that need to inspect EDB files without Microsoft APIs.
  package-nerd-significance:
    - >
      For package nerds, libesedb is a representative libyal package: a low-level C
      library, Python bindings in the source tree, separate CLI tools, and pre-release
      tags that use date-based experimental versions rather than a conventional stable
      semantic-version series.
  project-history:
    - >
      The upstream README and wiki describe libesedb as an experimental library for the
      ESE Database File format. The project is part of the libyal family, which packages
      file-format libraries and forensic tooling around reverse-engineered or partially
      documented formats.
  related-projects:
    - >
      The README points to libyal documentation for forensic analysis of Windows Search
      databases and to the esedb-kb repository as related reference material.
  sources:
    - https://formulae.brew.sh/formula/libesedb
    - https://github.com/libyal/libesedb
    - >
      https://github.com/libyal/libesedb/blob/main/documentation/Extensible%20Storage%20Engine%20%28ESE%29%20Database%20File%20%28EDB%29%20format.asciidoc
    - https://github.com/libyal/libesedb/releases
    - https://github.com/libyal/libesedb/wiki
  summary:
    - >
      libesedb is a libyal library and tool set for reading Extensible Storage Engine
      database files, the EDB format used by several Microsoft applications.
  timeline:
    - >
      2024: GitHub releases list libesedb-experimental-20240202 as a February 2, 2024
      pre-release.
    - >
      2024: GitHub releases list libesedb-experimental-20240420 as an April 20, 2024
      pre-release.
    - >
      2026: The libesedb wiki page was edited on May 14, 2026 and still described the
      project status as experimental.
  usage:
    - >
      The package exposes command-line tools such as esedbinfo and esedbexport. Upstream
      documentation also links a formal ESE/EDB format document and a separate esedb
      knowledge base, so the package doubles as executable tooling and reference
      material.
