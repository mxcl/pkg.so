history:
  adoption-history:
    - >
      Fresh remains a specialist macOS utility distributed directly by Ironic Software.
      Official release posts document continued maintenance across modern macOS
      versions, including native Apple Silicon support in the Fresh 4 generation.
  package-nerd-significance:
    - >
      Fresh represents a distinct class of Mac utility that supplements Finder and
      Spotlight rather than replacing the filesystem. Its value lies in maintaining a
      transient, workflow-oriented view over files stored in many different directories.
  project-history:
    - >
      Ironic Software created Fresh to make recently downloaded, edited, or otherwise
      active files easier to recover than through repeated Finder searches. The
      application evolved through at least four major generations; official posts record
      Fresh 2 maintenance in 2012 and Fresh 4 releases with current macOS support.
  related-projects:
    - >
      Fresh is developed alongside Ironic Software's Leap and Yep file and
      document-management applications and uses macOS Spotlight for search.
  sources:
    - >
      Official 2012 release post:
      https://ironicsoftware.com/leap-screencast-leap-3-1-3-yep-3-1-3-fresh-2-0-8/
    - 'Official Fresh page: https://ironicsoftware.com/fresh/'
    - 'Official Ironic Software news: https://ironicsoftware.com/category/news/'
  summary:
    - >
      Fresh is a macOS file-workflow utility from Ironic Software that surfaces recently
      created or modified files and provides a temporary shelf called the Cooler.
  timeline:
    - '2012: Ironic Software released Fresh 2.0.8 with improved Spotlight searching.'
    - >
      2021: Fresh 4.0.4 added native Apple Silicon support and support for then-current
      macOS releases.
    - >
      2026: Ironic Software reported continued compatibility of its current Fresh
      release with the latest macOS generation.
  usage:
    - >
      Fresh watches for newly downloaded, saved, or edited files and lists pointers to
      them in Fresh Files. Users can drag important items to the Cooler, search through
      Spotlight, tag or rate files, exclude noisy locations or types, and invoke the
      window with a keyboard shortcut. Removing a pointer from Fresh does not remove the
      underlying file.
