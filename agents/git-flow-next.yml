id: brew:git-flow-next
display-name: git-flow-next
repo: null
docs:
  - https://git-flow.sh/docs
  - https://github.com/gittower/git-flow-next#readme
  - https://github.com/gittower/git-flow-next/blob/main/CONFIGURATION.md
config-file-location:
  unix:
    - <repository>/.git/config
    - ~/.gitconfig
  windows:
    - <repository>/.git/config
    - '%USERPROFILE%/.gitconfig'
credentials-file-location: null
history:
  adoption-history:
    - >
      The public story of git-flow-next is tied to the maintenance gap left by older
      implementations. GitTower's 2025 blog posts describe git-flow-avh as abandoned
      since 2023 and present git-flow-next as a revival that keeps compatibility while
      addressing criticisms about rigidity, CI/CD friction, and complex release merges.
      Version 1.0 was announced on February 9, 2026 as a stable foundation for migration
      from existing git-flow setups.
  package-nerd-significance:
    - >
      For package maintainers, git-flow-next is notable because it keeps the executable
      name `git-flow` while replacing a shell-era workflow tool with a single Go binary
      and formal documentation. It also links CLI usage with the Tower ecosystem,
      including the same Git-flow configuration model across command-line and graphical
      workflows.
  project-history:
    - >
      GitTower began git-flow-next in 2025 after years of integrating Git-flow
      operations into the Tower Git client. The project explicitly acknowledges Vincent
      Driessen's original git-flow and Peter van der Does' git-flow-avh as foundations,
      then recasts the model around configurable branch dependencies and a unified
      topic-branch implementation.
  related-projects:
    - >
      git-flow-next descends from the git-flow model and interoperates conceptually with
      original git-flow and git-flow-avh; it is also integrated with Tower and
      documented alongside GitHub Flow, GitLab Flow, and custom workflow examples.
  sources:
    - https://git-flow.sh/blog/posts/announcing-git-flow-next-1-0/
    - https://git-flow.sh/blog/posts/how-git-flow-next-improves-upon-git-flow-avh/
    - https://git-flow.sh/docs
    - https://github.com/gittower/git-flow-next
    - https://github.com/gittower/git-flow-next#readme
    - https://github.com/gittower/git-flow-next/blob/main/CONFIGURATION.md
  summary:
    - >
      git-flow-next is GitTower's Go implementation of the Git-flow branching model,
      designed as a successor to the original git-flow and git-flow-avh command families
      while preserving compatibility with existing Git-flow repositories.
  timeline:
    - '2010: Vincent Driessen introduced the Git-flow branching model.'
    - "2023: git-flow-avh maintenance lapsed, according to GitTower's migration article."
    - '2025: git-flow-next began as a public Go implementation.'
    - >
      2025: GitTower published articles explaining git-flow-next's improvements over
      git-flow-avh.
    - '2026: git-flow-next 1.0 was announced.'
  usage:
    - >
      Practitioners use git-flow-next through the familiar `git flow` command namespace:
      initializing a repository, starting and finishing feature, release, hotfix, and
      support branches, publishing topic branches, updating them from parents, and
      customizing branch types. Configuration lives in Git config under `gitflow.*`,
      with branch definitions, command-specific settings, and command-line flags forming
      a precedence hierarchy.
related-packages:
  - id: brew:git-flow
    reason: >
      The original git-flow implements the same feature, release, hotfix, and
      support-branch workflow; choose it only when reproducing the legacy
      implementation, while git-flow-next is the maintained, configurable successor.
    rel: alternative
    sources:
      - https://github.com/nvie/gitflow
      - https://git-flow.sh/blog/posts/announcing-git-flow-next-1-0/
  - id: brew:git-town
    reason: >
      Git Town is an alternative high-level Git workflow CLI with explicit support for
      Git Flow plus stacked changes and forge-oriented branch shipping, making it a
      better fit when pull-request and branch-stack automation matter more than legacy
      `git flow` compatibility.
    rel: alternative
    sources:
      - https://www.git-town.com/
      - https://git-flow.sh/docs/
