history:
  adoption-history:
    - >
      bup was noticed quickly in the Unix backup community because it combined Git's
      content-addressed storage ideas with backup-oriented behavior that plain Git does
      not handle well. The input metadata records packaging across Homebrew, Debian,
      Ubuntu, Nix, Arch, and openSUSE, which reflects its long-running availability in
      both source-based and distribution package ecosystems.
  package-nerd-significance:
    - >
      bup matters to package nerds because it is a durable example of borrowing a
      version-control storage primitive for system administration. It also represents an
      era when Git's object model inspired backup, archival, and deduplicating-storage
      tools, before later encrypted deduplicating backup tools such as Attic, Borg,
      Restic, and Bupstash became common comparisons.
  project-history:
    - >
      Avery Pennarun announced bup 0.01 on January 4, 2010 after writing it during a
      Christmas break. The original announcement and the current README emphasize the
      same core design: split input with an rsync-like rolling checksum, store data in
      Git packfiles, write packfiles directly for performance, and allow data to be
      addressed in a way Git tooling can still understand.
    - >
      The project later moved under the bup GitHub organization and retained its own
      documentation site, man pages, release notes, and mailing-list workflow. Its
      README still warns that backups are a serious domain while documenting broad
      Unix-like support, optional par2 redundancy, FUSE access, remote backup over SSH,
      and Python/C implementation details.
  related-projects:
    - >
      bup is directly related to Git, rsync-style rolling checksums, par2 recovery data,
      and FUSE mounting. In backup-tool discussions it is commonly compared with
      rdiff-backup, Duplicity, Borg, Restic, and Bupstash.
  sources:
    - https://apenwarr.ca/log/20100104
    - https://bup.github.io/
    - https://bup.github.io/man.html
    - https://github.com/bup/bup
    - source_facts.package-manager
  summary:
    - >
      bup is a Git-packfile-based backup system known for fast incremental backups,
      rolling-checksum chunking, and global deduplication. It became one of the classic
      examples of reusing Git's storage format outside source control, especially for
      large files such as virtual-machine images.
  timeline:
    - '2010-01-04: bup 0.01 announced by Avery Pennarun.'
    - '2012: The current bup/bup GitHub repository was created under the bup organization.'
    - >
      2015: The bup.github.io site described bup as an efficient backup system based on
      Git packfiles.
    - '2026: The project remains active with documented 0.33.x releases.'
  usage:
    - >
      Common usage follows a simple CLI flow: initialize a bup repository, index paths,
      save backups, then restore or browse snapshots. bup is especially associated with
      large mutable files because chunking lets later backups reuse most existing data
      even when the file as a whole has changed.
related-packages:
  - id: brew:bupstash
    reason: >
      Choose bupstash when client-side encryption, encrypted metadata, scoped subkeys,
      and SSH repositories are central requirements; choose bup when Git-format storage
      and Git interoperability matter more.
    rel: alternative
    sources:
      - https://bup.github.io/
      - https://bupstash.io/doc/guides/Getting%20Started.html
      - https://bupstash.io/doc/man/bupstash.html
  - id: brew:borgbackup
    reason: >
      Choose Borg when authenticated client-side encryption and compression should
      accompany content-defined deduplication and SSH-hosted repositories.
    rel: alternative
    sources:
      - https://bup.github.io/
      - https://borgbackup.readthedocs.io/en/stable/
  - id: brew:restic
    reason: >
      Choose restic for a security-focused repository workflow with a compact init,
      backup, snapshot, restore, and integrity-check command set.
    rel: alternative
    sources:
      - https://bup.github.io/
      - https://restic.readthedocs.io/en/stable/010_introduction.html
