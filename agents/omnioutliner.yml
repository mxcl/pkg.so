history:
  adoption-history:
    - >
      OmniOutliner became a long-running part of the Mac productivity ecosystem and
      expanded to iPad in 2011. The Omni Group reported 10,000 iPad copies sold in its
      first three weeks. Later editions added iPhone support and ultimately became
      universal across Mac, iPad, iPhone, and Apple Vision Pro.
  package-nerd-significance:
    - >
      OmniOutliner is a prominent native implementation of the classic outliner. Its
      hierarchy editing, columns, attachments, OPML support, and automation make it
      useful both as a writing tool and as a structured information workbench.
  project-history:
    - >
      The Omni Group describes OmniOutliner as originating around 2001 from a small
      cataloging tool created by Ken Case for his wife and adapted as the company moved
      to Mac OS X. Over roughly a quarter century it evolved into a cross-platform
      structured writing application.
  related-projects:
    - >
      OmniOutliner belongs to The Omni Group's productivity suite with OmniGraffle,
      OmniFocus, and OmniPlan. Its early use with the Kinkless GTD scripts helped inform
      workflows later served by OmniFocus.
  sources:
    - >
      Official OmniOutliner 6 introduction:
      https://www.omnigroup.com/blog/introducing-omnioutliner-6
    - >
      Official early adoption report:
      https://www.omnigroup.com/blog/omnioutliner_for_ipad_sells_10000_copies_in_first_three_weeks
    - >
      Official iPad launch:
      https://www.omnigroup.com/blog/omnioutliner_for_ipad_is_now_available
    - >
      Official iPhone release:
      https://www.omnigroup.com/blog/omnioutliner-for-ios-now-available-on-iphone-and-ipad
    - 'Official product page: https://www.omnigroup.com/omnioutliner/'
  summary:
    - >
      OmniOutliner is The Omni Group's structured outlining application for organizing
      hierarchical text, notes, columns, attachments, plans, and other information.
  timeline:
    - "2001: OmniOutliner emerged during The Omni Group's move to Mac OS X."
    - '2011: OmniOutliner launched on iPad and sold 10,000 copies in its first three weeks.'
    - '2014: OmniOutliner 4 shipped with a rebuilt architecture and redesigned interface.'
    - '2015: OmniOutliner expanded to iPhone.'
    - '2017: OmniOutliner 5 introduced Essentials and Pro editions.'
    - >
      2026: OmniOutliner 6 became a universal application across Apple's desktop,
      mobile, and spatial platforms.
  usage:
    - >
      Users arrange rows into collapsible hierarchies, add notes, attachments, styles,
      and typed columns, and reorganize material by moving branches. Common uses include
      manuscripts, class notes, agendas, budgets, inventories, and project planning.
