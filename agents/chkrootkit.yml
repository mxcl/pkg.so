config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README lists testing across Linux, FreeBSD, OpenBSD, NetBSD, Solaris, HP-UX,
      Tru64, BSDI, and Mac OS X, which explains why it became common in Unix security
      packaging. The input package facts show it in Homebrew, Debian, Ubuntu,
      Fedora/DNF, and MacPorts.
  package-nerd-significance:
    - >
      For package nerds, chkrootkit is a classic security-admin utility: small,
      scriptable, portable, and old enough to appear in many Unix package collections.
      It also shows why some security tools remain tarball-first rather than
      source-control-first in package metadata.
  project-history:
    - >
      The official README for version 0.59 credits Nelson Murilo as main author and
      Klaus Steding-Jessen as co-author. It describes chkrootkit as a shell-script front
      end plus C helpers including ifpromisc, chklastlog, chkwtmp, chkproc, chkdirs,
      check_wtmpx, chkutmp, and a strings replacement.
  related-projects:
    - >
      The README credits DFN-CERT tools chklastlog and chkwtmp and small portions of
      ifconfig by Fred N. van Kempen. It is often compared with other host compromise
      scanners, but its official documentation focuses on its bundled tests.
  sources:
    - https://www.chkrootkit.org/README
    - https://www.chkrootkit.org/
    - https://formulae.brew.sh/api/formula/chkrootkit.json
  summary:
    - >
      chkrootkit is a long-running Unix rootkit detector that locally checks for signs
      of modified system binaries, log tampering, promiscuous interfaces, and
      kernel-module trojans.
  timeline:
    - >
      2000s: README documents support for Linux 2.0 through 2.6, early BSD releases,
      Solaris, HP-UX, Tru64, BSDI, and Mac OS X.
    - '2026: Official README identifies version 0.59.'
    - '2026: Homebrew packages chkrootkit 0.59 from the official chkrootkit.org FTP tarball.'
  usage:
    - >
      chkrootkit is intended to be run as root, either as ./chkrootkit for all tests or
      with named tests such as ps, ls, and sniffer. Options include quiet mode, expert
      mode, an alternate root directory, and an alternate command path for checking
      mounted disks or avoiding possibly compromised system binaries.
related-packages:
  - id: brew:rkhunter
    reason: >
      Rootkit Hunter is the closest packaged alternative when you want a configurable
      shell-based local scanner that also checks known rootkits, modified commands,
      startup files, and network interfaces.
    rel: alternative
    sources:
      - https://www.chkrootkit.org/README
      - https://rkhunter.sourceforge.net/
