history:
  adoption-history:
    - >
      Blurb positioned BookWright as the successor to its original BookSmart
      application. By 2020, Blurb described BookSmart as unsupported and BookWright as
      its current tool for producing photo books, trade books, and magazines.
  package-nerd-significance:
    - >
      BookWright is notable in desktop package catalogs as a proprietary,
      vendor-integrated publishing application rather than a general-purpose layout
      editor. Installation through a cask provides a reproducible route to software
      otherwise distributed directly by Blurb.
  project-history:
    - >
      Blurb introduced BookWright on April 22, 2014 as a free precision book-design tool
      that could produce print and ebook editions from one project. Its launch
      accompanied Blurb's expansion into direct Amazon distribution and free ISBN
      options.
  related-projects:
    - BookSmart was Blurb's earlier desktop bookmaking application and is no longer supported.
    - >
      Blurb's Adobe InDesign creation tools serve users who prefer a professional
      external layout workflow.
  sources:
    - 'Blurb 2014 launch announcement: https://www.blurb.com/press-releases/2014-04-22'
    - 'Blurb BookWright-versus-BookSmart guidance: https://www.blurb.com/blog/qa-dan-milnor/'
    - 'Blurb company timeline: https://prod.blurb.com/company-profile'
    - 'Official BookWright page: https://www.blurb.com/bookwright'
  summary:
    - >
      BookWright is Blurb's free desktop book-layout and self-publishing application for
      macOS and Windows. It combines page design, templates, print preparation, and
      upload into Blurb's printing and distribution service.
  timeline:
    - >
      2014: Blurb introduced BookWright for creating print books and ebooks from a
      single project.
    - >
      2020: Blurb identified BookWright as its current bookmaking application and
      BookSmart as unsupported.
  usage:
    - >
      Users create photo books, novels, cookbooks, magazines, notebooks, portfolios, and
      other publications, then order printed copies or publish through Blurb. Publishing
      requires a Blurb account and an internet connection, although the desktop design
      workflow can be used offline.
