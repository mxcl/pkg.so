history:
  adoption-history:
    - >
      Roon began as a specialist product for collectors and audiophiles but expanded
      through the Roon Ready certification program, streaming-service integration,
      dedicated Nucleus hardware, Roon OS and ROCK, and the Roon ARC mobile experience.
      Roon reported that the partner ecosystem exceeded 1,000 products from more than
      200 manufacturers by 2021 and that hundreds of thousands of enthusiasts used the
      platform by its tenth anniversary.
  package-nerd-significance:
    - >
      Roon matters to audio enthusiasts because it combines local files and supported
      streaming catalogs, rich linked metadata, DSP, bit-perfect playback, and
      synchronized multi-room output behind a consistent interface. Its server-centric
      architecture and RAAT protocol have also made it an important interoperability
      layer between software libraries and high-end network audio hardware.
  project-history:
    - >
      Roon's lineage begins with the Sooloos music system launched in 2006. Meridian
      acquired Sooloos, and the team later adapted its rich-metadata and multi-zone
      experience into standalone software. In February 2015 the original team spun out
      of Meridian to form Roon Labs, launching Roon that May for macOS and Windows.
    - >
      Roon subsequently developed its Roon Advanced Audio Transport protocol and the
      Roon Ready hardware program, added dedicated server products and mobile access,
      and was acquired by Harman International in 2023. Under Harman, the product
      retained its focus on collectors, audiophiles, library management, metadata, and
      hardware integration.
  related-projects:
    - >
      Roon grew from the earlier Sooloos platform. Its ecosystem includes Roon Server,
      Roon Remote, Roon Bridge, Roon ARC, Roon OS, ROCK, Nucleus hardware, RAAT, and
      certified Roon Ready or Roon Tested audio products.
  sources:
    - 'Official RAAT guide: https://help.roonlabs.com/portal/en/kb/articles/raat'
    - >
      Official Roon Server architecture guide:
      https://help.roonlabs.com/portal/en/kb/articles/starting-with-roon-server
    - 'Official Roon history article: https://blog.roonlabs.com/what-a-journey/'
    - 'Official Roon milestones: https://blog.roonlabs.com/roon-milestones/'
    - >
      Official tenth-anniversary retrospective:
      https://blog.roonlabs.com/roon-celebrates-a-decade/
  summary:
    - >
      Roon is a subscription music-management and playback system that unifies local
      libraries and supported streaming services, enriches them with linked metadata,
      and distributes audio through a server-and-endpoint architecture.
  timeline:
    - '2006: The founding team launched the Sooloos music system.'
    - '2015: The team formed Roon Labs and launched Roon.'
    - '2016: The Roon Ready program brought RAAT integration to audio hardware.'
    - '2017: Roon introduced Nucleus server hardware.'
    - '2022: Roon 2.0 and Roon ARC extended the experience beyond the home.'
    - '2023: Harman International acquired Roon Labs.'
  usage:
    - >
      A Roon installation centers on Roon Server, which indexes local music, integrates
      supported streaming services, maintains the metadata-rich library, and performs
      audio processing. Desktop or mobile control clients select music and playback
      zones, while local outputs, Roon Bridge systems, and Roon Ready devices act as
      endpoints. Users should back up Roon's database because it contains edits,
      playlists, listening history, tags, device setup, DSP settings, and interface
      preferences but not the music files themselves.
