history:
  adoption-history:
    - >
      Memory became the companion capture engine for Timely's time-tracking service.
      Timely says its service is used by more than 5,000 businesses across 160
      countries, while its documentation supports Memory on desktop operating systems
      and emphasizes private, user-controlled activity timelines.
  package-nerd-significance:
    - >
      The cask packages the background desktop component rather than the main Timely web
      interface. That distinction matters operationally: Memory captures local activity
      metadata, while Timely turns the resulting private timeline into time entries and
      AI-generated suggestions.
  project-history:
    - >
      Timely introduced Memory on January 31, 2017 as an automatically generated
      timeline of a user's daily work. The company later renamed itself Memory while
      pursuing a broader product family, then returned to the Timely name in 2023;
      Memory remained the core automatic-capture feature and desktop companion
      application.
  related-projects:
    - Timely
    - Timely AutoSheet
    - Timely mobile apps
  sources:
    - https://www.timely.com/company-news/2017-01-31-this-is-a-big-one-introducing-memory/
    - https://www.timely.com/company-news/2026-04-15-we-re-timely-again/
    - https://www.timely.com/help/handbook/autosheet/memory-101/
    - https://www.timely.com/help/handbook/autosheet/memory-for-mac/
  summary:
    - >
      Memory is Timely's background activity-capture application for automatic and
      AI-assisted time tracking.
  timeline:
    - '2017: Timely introduced Memory as an automatically generated daily work timeline.'
    - >
      2023: The company changed its name back from Memory to Timely while retaining
      Memory as a core product feature.
    - "2026: Timely's handbook described Memory as the engine behind its AI time tracking."
  usage:
    - >
      Memory runs in the background and records metadata about active applications,
      websites, files, meetings, and calendar activity. Users review the private
      timeline in Timely, assign activities to projects and tasks, and turn them into
      accurate time entries.
