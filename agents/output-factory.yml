id: cask:output-factory
display-name: Output Factory
repo: null
docs:
  - https://zevrix.com/userguides/outputfactory
config-file-location:
  macos:
    - ~/Library/Application Support/Zevrix/Output Factory/
credentials-file-location: null
history:
  adoption-history:
    - >
      Output Factory evolved through regular compatibility releases for successive Adobe
      InDesign and macOS generations. Version 2 added custom scripts, variable output
      subfolders, and post-processing application actions, extending it from batch
      export into a more programmable production workflow.
  package-nerd-significance:
    - >
      Output Factory represents the specialist end of the macOS package ecosystem: a
      commercial automation utility distributed as a Homebrew cask for users maintaining
      Adobe InDesign production systems.
  project-history:
    - >
      Output Factory succeeded Zevrix's earlier BatchOutput product. Its official
      release record documents the 1.x line from at least 2014 and a later major version
      2 focused on scripting and more flexible workflow organization.
  related-projects:
    - >
      BatchOutput was its predecessor. Output Factory integrates with Adobe InDesign and
      with Zevrix Deliver for file delivery.
  sources:
    - https://www.zevrix.com/versioncontrol-OutputFactory.php
    - https://zevrix.com/userguides/outputfactory/install.php
    - https://zevrix.com/userguides/outputfactory/workflows.php
    - source_facts.package-manager
  summary:
    - >
      Output Factory is a macOS production-automation application for batch printing,
      exporting, and delivering Adobe InDesign documents.
  timeline:
    - >
      May 2014: Output Factory 1.5 introduced a major internal-engine upgrade and
      expanded workflow settings.
    - 'February 2017: Output Factory became a 64-bit application.'
    - >
      2017: The 1.6 series added history and queue improvements and support for InDesign
      CC 2018.
    - 'Version 2: Added custom scripts, variable subfolders, and post-processing actions.'
  usage:
    - >
      Publishing and prepress users queue InDesign documents or books, apply reusable
      workflows and actions, and batch-produce PDF, PostScript, EPS, image, EPUB, HTML,
      or print output. Workflows can also run AppleScript or JavaScript before or after
      processing.
tags:
