history:
  adoption-history:
    - >
      OmniFocus moved from a Mac application to iPhone, iPad, Apple Watch, Apple Vision
      Pro, the web, and a unified cross-device interface. Omni Sync Server and WebDAV
      support made its database portable across devices.
    - >
      The application became closely associated with Getting Things Done workflows,
      while retaining enough flexibility for other personal productivity methods.
      Long-term users also built automation around AppleScript, Shortcuts, URL schemes,
      Mail Drop, and Omni Automation.
  package-nerd-significance:
    - >
      OmniFocus is a canonical Mac power-user application: it combines a native
      outline-based interface with a structured task database, keyboard-heavy workflows,
      deep automation, and encrypted synchronization.
    - >
      For package enthusiasts, its Homebrew Cask availability makes a traditionally
      commercial Mac application reproducible in workstation bootstrap scripts. Its
      lineage from OmniOutliner scripts is also a distinctive example of an internal
      automation evolving into a standalone product.
  project-history:
    - >
      OmniFocus started as a collection of OmniOutliner scripts inspired by David
      Allen's Getting Things Done method before becoming a native Mac application. The
      Omni Group subsequently brought it to successive Apple platforms and the web.
    - >
      OmniFocus 4 rebuilt and unified the interface across supported Apple devices using
      SwiftUI while preserving the project's core model of inbox capture, projects,
      actions, tags, perspectives, forecasting, and review.
  related-projects:
    - >
      OmniOutliner supplied the outlining environment in which the earliest OmniFocus
      scripts were developed.
    - Omni Sync Server and compatible WebDAV servers synchronize OmniFocus databases.
    - >
      Omni Automation provides cross-platform JavaScript automation across Omni Group
      applications.
  sources:
    - https://support.omnigroup.com/documentation/omnifocus/universal/4.9.1/en/welcome/
    - https://support.omnigroup.com/documentation/omnifocus/universal/4/
    - https://support.omnigroup.com/omnifocus-and-gtd/
    - https://www.omnigroup.com/omnifocus
    - https://www.omnigroup.com/releasenotes/omnifocus
  summary:
    - >
      OmniFocus is The Omni Group's structured personal task manager, built around
      capturing actions, organizing projects, and presenting the work relevant to a
      particular context or time.
  timeline:
    - >
      2000s: OmniFocus began as a set of OmniOutliner scripts and became a native Mac
      application.
    - '2008: OmniFocus expanded to iPhone during the early App Store era.'
    - >
      Later releases added iPad, Apple Watch, web, Apple Vision Pro, and cross-platform
      automation support.
    - '2023: OmniFocus 4 introduced a modernized unified interface across Apple platforms.'
  usage:
    - >
      Capture unprocessed tasks in the Inbox, organize them into projects with tags and
      dates, and work from built-in or custom perspectives such as Forecast, Flagged,
      Nearby, and Review.
    - >
      Synchronize through Omni Sync Server or another supported WebDAV server when using
      multiple devices. The application can also be automated with Shortcuts, URL
      schemes, Mail Drop, AppleScript on Mac, and Omni Automation.
