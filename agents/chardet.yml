id: brew:chardet
display-name: chardet
repo: https://github.com/chardet/chardet
docs:
  - https://chardet.readthedocs.io/en/latest
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      chardet became a standard dependency in Python text-processing stacks because it
      solved the practical problem of guessing encodings for unknown byte streams. The
      supplied package facts show Homebrew packaging plus Debian and Ubuntu
      documentation packages, while the README documents normal installation with `pip
      install chardet`.
  package-nerd-significance:
    - >
      chardet is package-nerd significant because it sits at the messy boundary between
      package metadata, HTTP downloads, archives, and text decoding. It is also notable
      for a 2026 chardet 7 rewrite that kept the package name and public API while
      changing implementation and license.
  project-history:
    - >
      The official README says Mark Pilgrim originally created chardet in 2006 as a
      Python port of Mozilla's universal charset detection library. After Pilgrim
      disappeared from the web in 2011, maintenance continued under later Python
      maintainers.
  related-projects:
    - >
      Mozilla's universal charset detection library is the upstream idea chardet
      originally ported.
    - >
      charset-normalizer is a related Python encoding detector compared directly in the
      chardet 7 README.
  sources:
    - https://github.com/chardet/chardet#readme
    - https://chardet.readthedocs.io/en/latest
    - https://www-archive.mozilla.org/projects/intl/chardet.html
    - https://formulae.brew.sh/formula/chardet
  summary:
    - >
      chardet is Python's long-running universal character encoding detector, exposed as
      both a library and the `chardetect` command-line tool.
  timeline:
    - >
      2006: Mark Pilgrim created chardet as a Python port of Mozilla's universal charset
      detector.
    - '2008: chardet 1.0.1 released on PyPI according to the official README history.'
    - '2011: Project maintenance continued after Pilgrim deleted his online accounts.'
    - '2012: chardet/chardet public GitHub repository created.'
    - '2017: chardet 3.0.x releases published on GitHub.'
    - >
      2026: chardet 7.0 released as a ground-up 0BSD-licensed rewrite under the same
      package name.
  usage:
    - >
      Users call `chardet.detect`, `detect_all`, or `UniversalDetector` from Python, or
      run `chardetect` on files or stdin to print a guessed encoding and confidence.
related-packages:
  - id: brew:uchardet
    reason: >
      Choose uchardet when the same encoding-detection task needs a native C/C++ library
      or lightweight standalone CLI instead of a Python API.
    rel: alternative
    sources:
      - https://github.com/chardet/chardet
      - https://www.freedesktop.org/wiki/Software/uchardet/
  - id: brew:libchardet
    reason: >
      Choose libchardet when a C or C++ application needs a small Mozilla-derived
      detection API and build-time library integration rather than chardet's Python
      package.
    rel: alternative
    sources:
      - https://github.com/chardet/chardet
      - https://github.com/Joungkyun/libchardet
tags:
