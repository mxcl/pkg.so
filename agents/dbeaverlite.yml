id: cask:dbeaverlite
display-name: DBeaver Lite
repo: null
docs:
  - https://dbeaver.com/docs/dbeaver
config-file-location:
  macos:
    - /Applications/DBeaverLite.app/Contents/Eclipse/dbeaver.ini
    - ~/Library/DBeaverData/workspace6/General/.dbeaver/data-sources.json
    - ~/Library/DBeaverData/workspace6/General/.dbeaver/tasks.json
credentials-file-location:
  macos:
    - ~/Library/DBeaverData/secure/
history:
  adoption-history:
    - >
      DBeaver Lite targets individual users who want a streamlined graphical database
      client. Its official feature matrix places it below the administration-heavy
      commercial editions while retaining SQL editing, data browsing, diagrams, export,
      AI assistance, and support for numerous databases.
  package-nerd-significance:
    - >
      Edition-specific packaging matters because DBeaver Lite is a separately licensed
      application with its own application bundle, release artifacts, and upgrade stream
      rather than an interchangeable name for DBeaver Community or Ultimate.
  project-history:
    - >
      DBeaver Lite is a commercial desktop edition in the DBeaver product family.
      DBeaver Corporation presents it as a simplified database-management tool designed
      to reduce administrative complexity.
  related-projects:
    - DBeaver Community
    - DBeaver Enterprise
    - DBeaver Ultimate
    - DBeaver Team Edition
    - CloudBeaver
  sources:
    - https://dbeaver.com/dbeaver-lite/
    - https://dbeaver.com/docs/dbeaver/
    - https://dbeaver.com/docs/dbeaver/Configuration-files-in-DBeaver/
    - https://dbeaver.com/docs/dbeaver/Workspace-Location/
  summary:
    - >
      DBeaver Lite is a streamlined commercial desktop client for querying, browsing,
      analyzing, and exporting data from SQL, NoSQL, and cloud databases.
  timeline:
    - >
      Commercial product era: DBeaver Lite becomes the streamlined individual-user
      edition in DBeaver's product lineup.
  usage:
    - >
      Users create database connections, write and execute SQL, browse or edit records,
      visualize results, generate diagrams, and export data through a graphical desktop
      interface.
tags:
  - commercial
  - data-analysis
  - data-export
  - database
  - database-client
  - desktop
  - sql
provenance:
