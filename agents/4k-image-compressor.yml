history:
  adoption-history:
    - >
      4K Download distributes the application for Windows, macOS, and Ubuntu. It follows
      the company's freemium desktop-software model, with basic use and paid licensing
      for features such as unrestricted batch work.
  package-nerd-significance:
    - >
      The Homebrew cask offers a package-managed installation path for a proprietary GUI
      image optimizer. The application is useful when users want an interactive
      alternative to command-line codecs and optimizers, particularly for target-size
      and batch workflows.
  project-history:
    - >
      4K Download announced 4K Image Compressor as a new desktop product on September
      19, 2023. The initial workflow focused on reducing and converting PNG, JPEG, and
      WebP images, with lossless, automatic, and target-size optimization modes.
    - >
      Later official troubleshooting material documents a broader range of accepted
      input formats, including HEIC, HEIF, PDF, BMP, RAW, GIF, SVG, and EPS.
  related-projects:
    - 4K Image Compressor is part of 4K Download's desktop application family.
  sources:
    - 'Official launch guide: https://www.4kdownload.com/blog/2023/09/19/4k-image-compressor/'
    - 'Official licensing page: https://www.4kdownload.com/buy/imagecompressor'
    - >
      Official troubleshooting guide:
      https://www.4kdownload.com/troubleshooting/troubleshooting-howto-fix-errors-in-imagecompressor
  summary:
    - >
      4K Image Compressor is a graphical desktop application for reducing image file
      sizes and converting images between supported formats. It provides automatic,
      lossless, and target-size optimization workflows.
  timeline:
    - '2023: 4K Download announced the first public release on September 19.'
    - Subsequent releases expanded the set of accepted image and document formats.
  usage:
    - >
      Users add or drag images into the application, select an output format and
      optimization method, and retrieve the result from a configurable output folder.
      Batch processing is available under paid licensing.
