history:
  adoption-history:
    - >
      Alcove is sold directly as a native macOS application under a per-license device
      limit. The official FAQ documents license recovery and device deactivation,
      reflecting its commercial desktop distribution model.
  package-nerd-significance:
    - >
      Alcove typifies the highly focused native utilities found in Homebrew Cask: a
      proprietary macOS interface enhancement with direct distribution and licensing
      rather than a public source repository.
  project-history:
    - >
      Alcove was created to bring a Dynamic Island-style interactive area to the Mac
      display notch. Its official presentation emphasizes native performance, animated
      transitions, notifications, live activities, gestures, heads-up displays, and
      lock-screen widgets.
  related-projects:
    - macOS
    - Homebrew Cask
  sources:
    - 'Official FAQ: https://www.tryalcove.com/faqs'
    - 'Official website: https://www.tryalcove.com/'
  summary:
    - >
      Alcove is a commercial native macOS utility that turns the display-notch area into
      an interactive Dynamic Island-style interface.
  timeline:
    - >
      2025: The official FAQ documented Alcove's licensing, waveform behavior, and
      Spotify integration limitations
  usage:
    - >
      Users install Alcove on a notched Mac and customize its interactive notch
      interface for notifications, live activities, gestures, media information,
      heads-up displays, and widgets.
