credentials-file-location: null
history:
  adoption-history:
    - >
      NeoFinder has been continuously maintained across classic Mac OS and macOS
      generations, with older releases remaining available for systems as far back as
      Mac OS 9. An iOS companion and interoperability with abeMeda extend access beyond
      a single Mac.
    - >
      Its long-lived catalog format and import support make it part of the specialist
      disk-cataloging and digital-asset-management ecosystem. The product is commercial,
      with a limited demo and paid licenses for full use.
  package-nerd-significance:
    - >
      NeoFinder is an unusually long-lived Mac cataloging package whose history spans
      removable-media indexing, offline disk catalogs, rich photo and media metadata,
      and modern digital-asset-management workflows.
    - >
      Package historians may know it by its original name, CDFinder. The 2011 rename
      marks its evolution beyond CD cataloging while retaining continuity with catalogs
      and customers from earlier versions.
  project-history:
    - >
      Norbert M. Doerner began writing CDFinder on December 5, 1995 after a frustrating
      search across floppy disks and CD-ROMs for a particular file. The application grew
      from removable-media cataloging into a searchable store of file attributes and
      media metadata.
    - >
      CDFinder became NeoFinder 6.0 on December 12, 2011. That release brought a Cocoa
      rewrite, a new interface and icon, and a name that better reflected the
      application's scope beyond compact discs.
    - >
      Later releases expanded NeoFinder into a digital asset manager covering EXIF,
      IPTC, XMP and other metadata; photos, audio, video and fonts; duplicate search;
      geotagging; checksums; catalog sharing; cloud and NAS workflows; and automation.
  related-projects:
    - CDFinder, NeoFinder's name before version 6.0
    - abeMeda, the interoperable Windows cataloging application
    - DiskCatalogMaker and other catalog formats supported by NeoFinder importers
  sources:
    - https://www.cdfinder.de/guide/
    - https://www.cdfinder.de/guide/1/info.html
    - https://www.cdfinder.de/neofinder.30.years.html
    - https://www.cdfinder.de/versions.html
  summary:
    - >
      NeoFinder is a commercial macOS digital-asset manager and disk cataloger descended
      from CDFinder. It creates searchable offline catalogs of volumes and records
      extensive file, photo, audio, video, archive, and document metadata.
  timeline:
    - '1995: Development of CDFinder began on December 5'
    - '2011: CDFinder was renamed NeoFinder with version 6.0'
    - '2025: The project marked thirty years of continuous development'
  usage:
    - >
      Catalog disks, folders, removable media, network storage, and selected cloud
      services, then search and browse their contents even when the original volume is
      offline.
    - >
      Use NeoFinder as a media-management layer for thumbnails and metadata such as
      EXIF, IPTC, XMP, ID3, geotags, ratings, labels, keywords, and checksums.
      Cataloging preferences can be stored with individual catalogs.
    - >
      The database folder is user-selectable in Preferences and should be a dedicated
      folder. Advanced defaults are stored in the documented macOS preferences file.
