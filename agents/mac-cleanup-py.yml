id: brew:mac-cleanup-py
display-name: mac-cleanup-py
repo: https://github.com/mac-cleanup/mac-cleanup-py
docs:
  - https://github.com/mac-cleanup/mac-cleanup-py#readme
config-file-location:
  macos:
    - $XDG_CONFIG_HOME/mac_cleanup_py/config.toml
    - ~/.mac_cleanup_py
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through both Homebrew and PyPI, matching macOS users
      who prefer package-manager tools and Python users who install with pip. Homebrew
      formula analytics reported 1,845 installs over 365 days for mac-cleanup-py, while
      the GitHub repository showed about 2.4k stars and dozens of releases.
    - >
      Ongoing releases through 2024 and 2025 added modules such as Arc Browser support,
      new default cleanup modules, Python-version updates, and contribution-driven
      fixes.
  package-nerd-significance:
    - >
      mac-cleanup-py is interesting in package history because it bridges three
      packaging cultures: a Homebrew formula named mac-cleanup-py, a PyPI package named
      mac_cleanup/mac-cleanup, and a lineage from an older shell cleanup script. It is
      the more established Python counterpart to newer TUI cleanup tools.
  project-history:
    - >
      The README describes mac-cleanup-py as a rewrite of the original mac-cleanup-sh
      project in Python. The GitHub repository was created in June 2022, and PyPI
      records show the mac_cleanup package appearing in August 2022.
    - >
      The 3.0.0 release in April 2023 was a major redevelopment: release notes cite full
      code refactoring, faster and more precise dry-run behavior, risky-action prompts,
      runtime type checking for user-interactable custom modules, static checking,
      linting, modernized documentation, and a config migration step.
  related-projects:
    - >
      mac-cleanup-py is explicitly a rewrite of mac-cleanup-sh. mac-cleanup-go later
      listed it as an alternative in the same macOS cleanup-tool niche.
  sources:
    - https://formulae.brew.sh/api/formula/mac-cleanup-py.json
    - https://github.com/mac-cleanup/mac-cleanup-py#readme
    - https://github.com/mac-cleanup/mac-cleanup-py/releases
    - https://pypi.org/pypi/mac-cleanup/json
    - source_facts.homepage
  summary:
    - >
      mac-cleanup-py is a Python macOS cleanup script that empties Trash, removes logs
      and cache files, and includes modules for browsers, developer tools, package
      managers, media apps, and system caches.
  timeline:
    - '2022-06: Public GitHub repository created.'
    - '2022-08: mac_cleanup first appeared on PyPI as version 2.1.0.'
    - '2023-04: v3.0.0 shipped a major redevelopment and config migration.'
    - '2024-09: v3.1.0 added default modules and XDG_CONFIG_HOME-first config behavior.'
    - '2025-03: v3.3.0 added a verbose option and dependency updates.'
  usage:
    - >
      The documented command is `mac-cleanup`. The README's help output includes dry-run
      mode, Homebrew update during cleanup, module configuration, custom module paths,
      forced confirmation, and verbose folder printing.
    - >
      Default modules cover package-manager and developer caches such as Homebrew, npm,
      pnpm, Yarn, Go, Gradle, CocoaPods, Poetry, pyenv, Docker, Xcode, and iOS
      simulators, making it a cleanup script aimed at developer Macs as much as ordinary
      application caches.
related-packages:
  - id: brew:mac-cleanup-go
    reason: >
      Choose mac-cleanup-go for a compiled, preview-first terminal UI; choose
      mac-cleanup-py when its Python module system and custom-module workflow are more
      useful.
    rel: alternative
    sources:
      - https://github.com/mac-cleanup/mac-cleanup-py#readme
      - https://github.com/2ykwang/mac-cleanup-go#readme
  - id: brew:mole
    reason: >
      Choose Mole when cleanup must be combined with app uninstallation, visual disk
      analysis, project purging, or system-maintenance commands in one macOS tool.
    rel: alternative
    sources:
      - https://github.com/mac-cleanup/mac-cleanup-py#readme
      - https://github.com/tw93/Mole#readme
tags:
  - cache-cleaner
  - cleanup
  - cli
  - logs
  - macos
  - python
provenance:
  category-sources:
    - source_facts.description and official README describe a macOS cleanup script.
  display-name-sources:
    - source_facts.name and official README use mac-cleanup-py.
  docs-sources:
    - source_facts.homepage is the official GitHub repository and README documentation.
  history-sources:
    - https://formulae.brew.sh/api/formula/mac-cleanup-py.json
    - https://github.com/mac-cleanup/mac-cleanup-py#readme
    - https://github.com/mac-cleanup/mac-cleanup-py/releases
    - https://pypi.org/pypi/mac-cleanup/json
    - source_facts.homepage
  repo-sources:
    - >
      source_facts.homepage and official pyproject repository point to
      https://github.com/mac-cleanup/mac-cleanup-py.
  tags-sources:
    - >
      source_facts.description and official README identify Python macOS cleanup of
      logs, cache, and trash.
category-confidence: high
category-path:
  - system
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
