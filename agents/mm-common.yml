id: brew:mm-common
display-name: mm-common
repo: https://gitlab.gnome.org/GNOME/mm-common
docs:
  - https://gitlab.gnome.org/GNOME/mm-common/-/blob/master/README.md
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The project appeared as a shared infrastructure package in 2009: the NEWS file
      calls mm-common 0.5, released on 2009-08-17, the first tarball release of the
      shared build infrastructure for GNOME C++ binding modules. Later entries show the
      package filling the unglamorous but important maintainer-tool role: shared
      documentation tooling, Doxygen and Devhelp integration, skeleton binding projects,
      Autoconf macros, pkg-config helpers, and build-system support.
  sources:
    - https://formulae.brew.sh/formula/mm-common
    - https://github.com/GNOME/mm-common
    - https://github.com/GNOME/mm-common/blob/master/NEWS
    - https://gtkmm.gnome.org/
    - https://www.gtk.org/docs/language-bindings/cpp
  summary:
    - >
      mm-common is part of the GNOME C++ bindings effort around gtkmm and related
      libraries. Its upstream README describes it as the shared build infrastructure and
      utilities for GNOME C++ binding libraries, needed when building those bindings
      from the GNOME version-control repository and in maintainer-mode builds rather
      than for ordinary tarball consumers.
  usage:
    - >
      In practice, developers encounter mm-common when maintaining or building GNOME C++
      bindings such as gtkmm, glibmm, and sibling modules from source control. Its two
      commands reflect that niche: `mm-common-prepare` supports Autotools-based modules
      and `mm-common-get` supports Meson-based modules by copying installed common files
      into binding modules. Distribution packages keep it available because
      binding-library maintainers and source builds need it even though end-user GTK
      applications usually do not call it directly.
