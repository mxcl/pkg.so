config-file-location:
  unix:
    - ~/.murex_preload
    - ~/.murex_profile
credentials-file-location: null
history:
  project-history:
    - >
      The central technical idea is that pipeline data can carry type information rather
      than being treated only as byte streams. Murex documents native support for JSON,
      YAML, XML, CSV, tables, and related formats, and its language tour presents it as
      a typed shell that can still call existing CLI tools without special adapters. The
      project also emphasizes error handling, unit tests, autocomplete, and a more
      capable REPL, aiming at DevOps-style one-liners and scripts where Bash's stringly
      behavior becomes fragile.
  sources:
    - https://formulae.brew.sh/formula/murex
    - https://github.com/lmorg/murex
    - https://murex.rocks/
    - https://murex.rocks/commands/
    - https://murex.rocks/tour.html
    - https://pkg.go.dev/github.com/lmorg/murex
    - https://www.freshports.org/shells/murex/
  summary:
    - >
      Murex is an alternative command-line shell from the lmorg/murex project, written
      in Go and positioned as a Bash-like shell for safer scripts and more productive
      interactive use. Its public documentation describes it as a cross-platform shell
      that keeps compatibility with ordinary Unix commands while adding typed,
      content-aware pipelines and richer handling for structured data.
  usage:
    - >
      Its package-manager niche is the modern-shell lane beside fish, nushell, xonsh,
      and Oil: not a POSIX /bin/sh replacement, but a daily shell and scripting language
      for users who work heavily with structured command output. In practice it is
      installed as the murex executable, then used either interactively or for scripts
      that benefit from first-class JSON/YAML/table processing.
related-packages:
  - id: brew:nushell
    reason: >
      Choose Nushell for a data-first shell with a broad structured-value language and
      plugin model; choose Murex when Bash-like syntax and direct compatibility with
      traditional Unix CLI behavior are stronger priorities.
    rel: alternative
    sources:
      - https://murex.rocks/tour.html
      - https://www.nushell.sh/
      - https://www.nushell.sh/book/
