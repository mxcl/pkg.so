history:
  adoption-history:
    - >
      The official installation guide distributes the CLI through Arcane release
      artifacts, a curl installer, APT, YUM/DNF, Homebrew, and Go installation, making
      it usable on developer workstations and automation hosts.
  package-nerd-significance:
    - >
      Arcane CLI gives a Docker-management web platform a scriptable
      package-manager-installed client, including JSON output, shell completion,
      diagnostics, and unattended confirmation controls.
  project-history:
    - >
      Arcane CLI was introduced as Arcane's official terminal interface and remains part
      of the main Arcane project and release stream. Its documentation describes it as a
      new feature rather than a separate legacy client.
  related-projects:
    - Arcane
    - Docker
    - Docker Compose
  sources:
    - https://getarcane.app/docs/cli/commands
    - https://getarcane.app/docs/cli/config
    - https://getarcane.app/docs/cli/install
    - https://github.com/getarcaneapp/arcane/releases
  summary:
    - >
      Arcane CLI is the official command-line client for administering an Arcane server
      and its Docker resources.
  timeline:
    - '2026: Official documentation described Arcane CLI as a newly introduced Arcane feature.'
  usage:
    - >
      Users configure an Arcane server URL and authenticate through device-code login or
      an API key, then manage containers, images, projects, environments, registries,
      backups, vulnerabilities, and system updates. JSON output and noninteractive flags
      support shell scripts and CI jobs.
