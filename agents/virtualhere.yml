history:
  adoption-history:
    - >
      VirtualHere targets users who need physical USB hardware available to another
      computer without moving the device. Its official materials cover Windows, macOS,
      and Linux clients and describe operation across local networks, the Internet, and
      cloud environments.
    - >
      The project is distributed as self-contained client and server software. The
      client is free to install on multiple machines, while expanded server use is
      commercially licensed, a model that has supported deployments ranging from
      individual remote peripherals to embedded and OEM systems.
  package-nerd-significance:
    - >
      VirtualHere is notable to package users because it turns USB/IP-style
      remote-device access into a packaged desktop client rather than requiring manual
      kernel-level USB forwarding workflows. The macOS cask packages the universal
      client application, while configuration remains in a small text file.
    - >
      It also illustrates the boundary between package management and device
      infrastructure: installing the client is simple, but successful use can still
      depend on operating-system drivers, network discovery, firewalls, SSL
      configuration, and a separately running VirtualHere server.
  project-history:
    - >
      VirtualHere was developed as a proprietary USB-over-network system in which a
      server exports attached USB devices and a client presents them as locally
      connected hardware. Official configuration and authorization documentation was
      publicly available by 2013, followed by a documented client automation API in
      2014.
    - >
      The product expanded beyond basic LAN discovery to cover service operation,
      scripted authorization, SSL, reverse connections through NAT or firewalls, and
      embedded or OEM server deployments. The official project continues to publish
      separate client and server change histories.
  related-projects:
    - VirtualHere USB Server is the required server-side counterpart.
    - Linux USB/IP supplies the kernel-side client facilities used by VirtualHere on Linux.
    - >
      VirtualHere CloudHub and EasyFind extend the product toward appliance and
      simplified remote-network use.
  sources:
    - https://www.virtualhere.com/
    - https://www.virtualhere.com/authorization
    - https://www.virtualhere.com/client_api
    - https://www.virtualhere.com/client_configuration_faq
    - https://www.virtualhere.com/purchase
    - https://www.virtualhere.com/usb_client_software
    - https://www.virtualhere.com/usb_server_software
  summary:
    - >
      VirtualHere USB Client is the desktop side of a proprietary USB-over-IP system
      that makes devices attached to a remote VirtualHere server appear locally
      connected. It supports graphical, command-line, service, and automation-oriented
      operation.
  timeline:
    - '2013: Official server-configuration and user-authorization documentation was published.'
    - '2014: VirtualHere documented its client API for command-line and programmatic control.'
    - >
      2016: Official release announcements show an established, regularly updated
      client/server product line.
    - >
      2026: Client development continued with macOS, Linux, Windows, SSL, and
      KVM-over-IP improvements.
  usage:
    - >
      Users run the client, discover or manually specify a VirtualHere server, and
      select a shared USB device for exclusive local use. Common applications include
      remote access to printers, storage devices, license dongles, development hardware,
      and other peripherals.
    - >
      The client normally generates and maintains its own settings file. Advanced
      deployments can run it as a service, disable automatic discovery, specify hubs
      explicitly, configure SSL certificates, or control it through its named-pipe API.
