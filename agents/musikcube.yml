history:
  project-history:
    - >
      The project evolved from local library playback into a self-contained terminal
      music system. The official site describes a terminal music player, library, and
      streaming server, plus musikdroid, an Android client that connects to musikcube
      servers for streaming and remote control. The README emphasizes Raspberry Pi use
      with a home stereo, while the 3.0.0 release discussion highlights a redesigned
      plugin API for decoders, encoders, playback, play-queue manipulation, visualizers,
      data streams, indexers, DSP, and headless daemon operation.
  sources:
    - https://en.wikipedia.org/wiki/MusikCube
    - https://formulae.brew.sh/formula/musikcube
    - https://github.com/clangen/musikcube
    - https://github.com/clangen/musikcube/discussions/601
    - https://musikcube.com/
    - https://news.ycombinator.com/item?id=14853212
    - https://www.freshports.org/multimedia/musikcube
  summary:
    - >
      musikcube is Casey Langen's C++ music-player project in its modern terminal-based
      form: an audio engine, metadata library, player, and streaming server packaged as
      musikcube and musikcubed. Historical summaries trace the name back to a 2004
      Windows music player by Langen, while the modern GitHub project presents a
      cross-platform terminal application that runs on Windows, macOS, Linux, Raspberry
      Pi systems, and other Unix-like environments. In a 2017 launch discussion, Langen
      described the audio engine work as having started in 2007 with an interest in
      building a medium-sized C++ audio application from scratch.
  usage:
    - >
      In practice, musikcube is for users who want a keyboard-driven music library and
      server without a desktop GUI. It overlaps with cmus, Music Player Daemon plus
      ncmpcpp, and other terminal audio setups, but its niche is bundling metadata
      indexing, playback, plugins, streaming, and remote control into one C++ package.
      Package managers expose that as the musikcube terminal client and musikcubed
      daemon/server, making it useful on laptops, shells, and small always-on audio
      boxes.
related-packages:
  - id: brew:cmus
    reason: >
      Choose cmus for a smaller Unix-focused ncurses player with a scriptable
      remote-control command; choose musikcube when you want integrated indexing,
      streaming-server, and remote-client features.
    rel: alternative
    sources:
      - https://github.com/clangen/musikcube
      - https://cmus.github.io/
      - https://github.com/cmus/cmus
  - id: brew:mpd
    reason: >
      Choose Music Player Daemon when you want a dedicated background server with a
      large ecosystem of interchangeable network clients; musikcube instead bundles its
      terminal player, library, and server.
    rel: alternative
    sources:
      - https://github.com/clangen/musikcube
      - https://www.musicpd.org/
      - https://www.musicpd.org/clients/
