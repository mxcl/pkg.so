history:
  adoption-history:
    - >
      King used and developed Defold internally before releasing it publicly as a
      free-to-use engine at GDC in March 2016. The project reports use by independent
      creators, students, and studios shipping commercial games; its cross-platform
      targets, small runtime, documentation, and royalty-free model support that
      adoption.
  package-nerd-significance:
    - >
      Defold is notable as a complete engine-and-editor distribution whose source became
      publicly inspectable and whose ownership moved from a commercial game company to
      an independent foundation. It offers a compact, regularly released alternative to
      larger game-engine ecosystems without subscription or runtime fees.
  project-history:
    - >
      Christian Murray and Ragnar Svensson began work on the engine, editor, and servers
      in 2009. King partnered with Defold in 2013 and acquired it in 2014. After the
      public 2016 release and a new editor in 2017, King made the source available and
      transferred the project to the newly created Defold Foundation in May 2020.
  related-projects:
    - Defold projects primarily use Lua 5.1/LuaJIT for game logic.
    - >
      The Defold Asset Portal and native-extension ecosystem add reusable libraries and
      platform integrations.
    - King was Defold’s owner from 2014 until the 2020 transfer to the Defold Foundation.
  sources:
    - >
      Official 2020 source and foundation announcement:
      https://defold.com/2020/05/19/Defold-is-now-open-source/
    - 'Official FAQ: https://defold.com/faq/faq/'
    - 'Official foundation page: https://defold.com/foundation/'
    - 'Official history: https://defold.com/about/'
    - 'Official manuals: https://defold.com/manuals/'
  summary:
    - >
      Defold is a free-to-use, source-available cross-platform game engine and editor
      maintained by the Defold Foundation. It targets desktop, mobile, web, and
      supported consoles and uses Lua as its principal game-logic language.
  timeline:
    - >
      2009: Christian Murray and Ragnar Svensson began developing the engine, editor,
      and servers.
    - '2013: King and Defold began a partnership.'
    - '2014: King acquired Defold.'
    - '2016: King publicly released Defold as a free-to-use game engine at GDC.'
    - '2017: Defold released its new editor.'
    - '2020: King made the source available and transferred Defold to the Defold Foundation.'
  usage:
    - >
      Developers create or open a project in the Defold editor, assemble game objects
      and collections, write gameplay code in Lua, test with hot reload, and bundle for
      supported targets. Native extensions, editor scripts, build automation, and
      project settings support more specialized production workflows.
