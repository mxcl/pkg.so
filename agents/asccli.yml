id: brew:asccli
display-name: asc-cli
repo: null
docs:
  - https://github.com/tddworks/asc-cli/tree/main/docs
  - https://github.com/tddworks/asc-cli#readme
config-file-location:
  unix:
    - <project>/.asc/project.json
credentials-file-location:
  unix:
    - ~/.asc/credentials.json
    - ~/.asc/iris/session.json
history:
  adoption-history:
    - >
      The project is distributed through the Homebrew asccli formula and can also be
      built as a Swift package, fitting macOS developer workstations and
      continuous-delivery environments.
    - >
      Its command set has grown to cover builds, releases, TestFlight, metadata,
      screenshots, signing, subscriptions, reports, and other App Store Connect
      resources, with structured output intended for both scripts and coding agents.
  package-nerd-significance:
    - >
      asc-cli gives Apple-platform developers a package-managed, open-source command
      interface to a broad portion of App Store Connect. Its JSON-first and
      affordance-oriented output makes it useful in CI pipelines and emerging
      agent-driven release workflows.
  project-history:
    - >
      asc-cli is an open-source Swift command-line client developed by tddworks for
      managing iOS and macOS applications through App Store Connect.
    - >
      The project describes itself as an App Store Command Center and combines public
      App Store Connect API operations with optional workflows for tasks that require
      additional authentication.
  related-projects:
    - Apple App Store Connect API
    - TestFlight
    - Xcode
    - Homebrew
    - Swift Package Manager
  sources:
    - >
      Official authentication documentation:
      https://github.com/tddworks/asc-cli/blob/main/docs/features/asc-auth.md
    - 'Official changelog: https://github.com/tddworks/asc-cli/blob/main/CHANGELOG.md'
    - 'Official repository and README: https://github.com/tddworks/asc-cli'
  summary:
    - >
      asc-cli is a Swift command-line tool for automating App Store Connect
      administration and Apple application release workflows.
  timeline:
    - '2020s: asc-cli entered public development as an App Store Connect automation tool.'
    - >
      2026: The documented CLI includes multi-account authentication and broad release,
      TestFlight, signing, metadata, reporting, and agent-oriented workflows.
  usage:
    - >
      Users authenticate with an App Store Connect key ID, issuer ID, and private key,
      then invoke asc commands to manage application and release resources.
    - >
      Running asc init can store project-specific application context in
      .asc/project.json. Persistent App Store Connect credentials are stored in
      ~/.asc/credentials.json; optional iris authentication stores a session under
      ~/.asc/iris/.
tags:
  - app-store-connect
  - apple
  - cli
  - ios
  - macos
  - release-automation
  - swift
  - testflight
provenance:
  category-sources:
    - 'Official repository README: https://github.com/tddworks/asc-cli'
    - source_facts.description identifies an App Store Connect management CLI.
  display-name-sources:
    - 'Official repository title: https://github.com/tddworks/asc-cli'
    - source_facts.name
  docs-sources:
    - >
      Official repository README and documentation directory:
      https://github.com/tddworks/asc-cli
  history-sources:
    - >
      Official authentication documentation:
      https://github.com/tddworks/asc-cli/blob/main/docs/features/asc-auth.md
    - 'Official changelog: https://github.com/tddworks/asc-cli/blob/main/CHANGELOG.md'
    - 'Official repository and README: https://github.com/tddworks/asc-cli'
  repo-sources:
    - >
      source_facts.repo already contains an official repository URL, so repo is null as
      required.
  tags-sources:
    - 'Official repository README: https://github.com/tddworks/asc-cli'
    - source_facts.description
category-confidence: high
category-path:
  - developer-tools
  - mobile-development
  - app-store-connect
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: high
