history:
  project-history:
    - >
      Technically, MPlayerShell launches MPlayer as a background process, captures its
      output, and presents a new application interface while keeping a command-line
      interface that is essentially identical to MPlayer. It adds explicit full-screen
      and float-on-top menu commands, tunes MPlayer's cache and threading defaults for
      large video, and exposes the mps executable when installed through Homebrew.
  sources:
    - https://formulae.brew.sh/formula/mplayershell
    - https://github.com/lisamelton/MPlayerShell
  summary:
    - >
      MPlayerShell is Lisa Melton's small macOS wrapper around MPlayer and mplayer2. The
      project README says she wrote it because she was unhappy with the visual
      experience of using the command-line players on OS X, especially window behavior,
      menu handling, full-screen quirks, and other Cocoa-interface rough edges.
  usage:
    - >
      Its package-manager niche is therefore a wrapper niche rather than a codec or
      playback engine niche. Users install mplayershell when they want MPlayer's
      command-line power with a more native OS X visual shell, while still depending on
      the underlying MPlayer family for actual playback.
related-packages:
  - id: brew:mplayer
    reason: >
      Install and use MPlayer as the underlying playback engine that MPlayerShell
      launches, captures, and presents through its macOS interface.
    rel: adjacent_workflow
    sources:
