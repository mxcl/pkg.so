id: brew:klavaro
display-name: Klavaro
repo: https://sourceforge.net/p/klavaro/code/HEAD/tree
docs:
  - https://klavaro.sourceforge.io/en/help.html
  - https://klavaro.sourceforge.io/en/index.html
config-file-location:
  unix:
    - ~/.config/klavaro/
credentials-file-location: null
history:
  adoption-history:
    - >
      Klavaro entered distribution channels early for a desktop education application:
      the project news says Debian accepted it into the main archive on 2007-01-14,
      FreeBSD ports followed in 2007, and MacPorts carried it from version 1.1.1 in
      2008. That packaging spread is why it appears under the same name across Unix-like
      package managers and in Homebrew.
  package-nerd-significance:
    - >
      For package maintainers, Klavaro is a compact example of the classic
      SourceForge-era GTK desktop application that survived by being easy to package
      across distributions. Its significance is less about novel infrastructure and more
      about filling the practical education niche with GPL software and unusually wide
      keyboard-layout coverage.
  project-history:
    - >
      The project reached its first production release as Klavaro 1.0.0 in October 2006,
      after early Windows-port work in 2005. The SourceForge news archive shows the
      project moving from standalone tarball distribution into public Subversion
      development in 2008 and adding features such as semi-online and online typing
      contests during the 1.1 series.
    - >
      Later release notes show the project adapting its GTK base, translations, Windows
      builds, and ranking-server setup rather than changing its core purpose. The 2022
      project site still emphasizes broad keyboard-layout support, many interface
      translations, a keyboard-layout editor, progress charts, and simple exercises for
      basic memorization, adaptability, speed, and fluidness.
  related-projects:
    - >
      Klavaro sits alongside other free typing tutors such as GNU Typist, Tux Typing,
      and KTouch, but its own documentation highlights keyboard-layout independence and
      a layout editor as the differentiator.
  sources:
    - https://klavaro.sourceforge.io/en/
    - https://sourceforge.net/p/klavaro/code/HEAD/tree
    - https://sourceforge.net/p/klavaro/news/
  summary:
    - >
      Klavaro is a GTK touch-typing tutor built around keyboard-layout independence
      rather than training only a small set of national keyboard layouts. Its own site
      records the project as starting on 2005-04-03 and describes the design goal as
      libre software that saves users from layout-specific typing tutors.
  timeline:
    - "2005-04-03: Project site records Klavaro's start date."
    - '2006-10-13: Klavaro 1.0.0 announced as the first production release.'
    - >
      2007-01-14: Debian accepted Klavaro into its archive, according to project news
      posted on 2007-01-20.
    - '2008-06-02: Project news announced public Subversion repository access.'
    - '2008-07-24: Project news announced MacPorts packaging from version 1.1.1.'
    - >
      2021-04-17: Klavaro 3.12 release news described translation updates, a GTK3
      GtkDatabox link, and a win64 installer.
  usage:
    - >
      Users run Klavaro as a graphical tutor, usually through the `klavaro` executable,
      to practice touch typing with customizable keyboard layouts, imported text,
      progress charts, and ranking exercises. It is not a credentials-oriented program
      and the official materials do not document a stable user-editable configuration
      path.
related-packages:
  - id: brew:gnu-typist
    reason: >
      GNU Typist teaches touch typing in a curses terminal with editable text lessons,
      making it a lightweight alternative when Klavaro's GTK interface and graphical
      progress tools are unnecessary.
    rel: alternative
    sources:
      - https://klavaro.sourceforge.io/en/
      - https://www.gnu.org/software/gtypist/
      - https://www.gnu.org/software/gtypist/doc/
