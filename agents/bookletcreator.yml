history:
  adoption-history:
    - >
      The official vendor describes BookletCreator as serving more than 10,000 users. It
      is offered for both macOS and Windows, with a limited free mode and a paid
      lifetime license.
  package-nerd-significance:
    - >
      BookletCreator packages a specialized print-prepress operation into a small
      desktop utility, making booklet imposition accessible without a full publishing
      suite.
  project-history:
    - >
      BookletCreator was developed as a focused desktop utility for turning ordinary PDF
      documents into printable folded booklets. Official materials document Mac and
      Windows editions and a free-to-paid licensing model.
  related-projects:
    - >
      PDF viewers and printer drivers are used to print the imposed output, normally
      with duplex printing enabled.
  sources:
    - 'Official download page: https://www.bookletcreator.com/download/'
    - 'Official guide: https://www.bookletcreator.com/how-it-works/'
    - 'Official order page: https://www.bookletcreator.com/order/'
    - 'Official product site: https://www.bookletcreator.com/'
  summary:
    - >
      BookletCreator rearranges PDF pages into booklet order so the resulting document
      can be printed double-sided, folded, and bound.
  timeline:
    - >
      By 2026: The official site advertised Mac and Windows versions and reported more
      than 10,000 users.
  usage:
    - >
      Users add one or more PDFs, choose page ranges, paper size, booklet splitting,
      numbering, page orientation, and right-to-left options, then generate a reordered
      PDF. They print it duplex, fold the sheets, and staple or otherwise bind them.
