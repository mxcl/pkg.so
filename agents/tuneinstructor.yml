history:
  adoption-history:
    - >
      Tune•Instructor was built specifically for Mac users maintaining iTunes libraries.
      Its long official version history tracks compatibility with successive Mac OS X
      releases and additions such as Notification Center integration, Last.fm support,
      and Apple's Beats 1 metadata.
  package-nerd-significance:
    - >
      Tune•Instructor represents the extensive ecosystem of macOS utilities that grew
      around iTunes before Apple split its media applications. It combines menu-bar
      playback control with unusually deep batch maintenance of ID3 tags, artwork,
      filenames, folders, lyrics, playlists, and broken library links.
  project-history:
    - >
      Early Tune•Instructor releases concentrated on batch cleanup and completion of
      iTunes metadata. Version 2.0 introduced a new interface, multilingual support, and
      logging; version 3.0 was rewritten in Cocoa and Objective-C to improve performance
      and add a richer controller, navigation, ratings, lyrics, and Last.fm integration.
    - >
      Later 3.x releases added Notification Center controls, compatibility updates for
      newer OS X releases, favorites, and Beats 1 track information. The official site
      continues to present the application as a menu-bar controller and music-library
      organization utility.
  related-projects:
    - >
      Tune•Instructor integrates with Apple's iTunes or Music ecosystem and with Last.fm
      for scrobbling and favoriting.
  sources:
    - 'Official features: https://www.tune-instructor.de/en/features.html'
    - 'Official product site: https://www.tune-instructor.de/en/'
    - 'Official tutorials: https://www.tune-instructor.de/en/tutorials.html'
    - 'Official version history: https://www.tune-instructor.de/de/versions.html'
  summary:
    - >
      Tune•Instructor is a macOS menu-bar controller and library-maintenance utility for
      Apple's iTunes and Music ecosystem.
  timeline:
    - 'Version 2.0: New interface, multilingual support, and logging introduced'
    - 'Version 3.0: Application rewritten in Cocoa and Objective-C'
    - 'Version 3.5: Notification Center widget introduced'
    - 'Version 3.6: OS X El Capitan compatibility and Beats 1 metadata added'
  usage:
    - >
      Users can control playback and ratings without bringing iTunes to the foreground,
      view track information and lyrics, scrobble to Last.fm, and run batch workflows
      that edit ID3 tags, artwork, filenames, folders, playlists, and library links.
