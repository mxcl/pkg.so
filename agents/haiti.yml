history:
  adoption-history:
    - >
      haiti's adoption surface is narrower than the larger tools in this batch, but it
      is packaged through RubyGems and appears in security-oriented package sets such as
      Homebrew and Nix. The README's packaging-status badge and installation docs
      emphasize distribution packaging in addition to `gem install haiti-hash`.
    - >
      The tool appeals to password-auditing and CTF workflows because it maps candidate
      hashes to likely algorithms and references cracking-tool identifiers. The package
      is useful when a shell pipeline needs a quick noninteractive hash guesser rather
      than an interactive legacy script.
  package-nerd-significance:
    - >
      haiti is significant as a small security CLI that keeps a curated knowledge base
      of hash patterns close to package-manager users. It is the kind of tool that saves
      an install-from-GitHub step during CTFs, audits, and incident-response note
      taking.
    - >
      For package maintainers, its Ruby implementation matters: version support tracks
      Ruby lifecycle changes, and the published gem, CLI binary, and documentation all
      need to line up for users who install through system package managers instead of
      RubyGems.
  project-history:
    - >
      The project README says haiti was made by Alexandre ZANNI and forked from
      Orange-Cyberdefense/haiti. The documentation's comparison page explains the
      motivation: older tools such as hashID, hash-identifier, Dagon, and findmyhash had
      become unmaintained or incomplete, especially for modern hashes such as Keccak,
      SHA3, and Blake2.
    - >
      Release history shows a steady expansion of supported hash types and workflow
      features. Early 2021 releases established the CLI and library shape, later 1.x
      releases added many hash samples and John the Ripper or Hashcat references, 2.0
      added a `list` command and crossed 600 supported types, 2.1 added fzf-assisted
      helpers, and 4.0 documented 675 supported hash types plus Ruby 4.0 support.
  related-projects:
    - 'Hashcat: cracking tool whose mode references are reported by haiti.'
    - 'John the Ripper: cracking tool whose format references are reported by haiti.'
    - >
      hashID and hash-identifier: older hash identification tools discussed in haiti's
      comparison documentation.
    - "Name-That-Hash: another hash identification project compared by haiti's documentation."
  sources:
    - https://github.com/noraj/haiti
    - https://github.com/noraj/haiti/releases
    - https://noraj.github.io/haiti/
    - https://raw.githubusercontent.com/noraj/haiti/master/README.md
    - https://raw.githubusercontent.com/noraj/haiti/master/docs/CHANGELOG.md
    - https://raw.githubusercontent.com/noraj/haiti/master/docs/why.md
  summary:
    - >
      haiti is a Ruby command-line tool and library for identifying hash types. Its name
      expands to HAsh IdenTifIer, and its documentation positions it as a maintained
      alternative to older hash identification tools with better support for modern
      algorithms and references to Hashcat and John the Ripper formats.
  timeline:
    - "2019: haiti project activity began according to the project's comparison documentation."
    - '2021: v1.0.0 release established the CLI and library package.'
    - '2021: v1.1.0 added 66 hash types and improved compatibility.'
    - '2022: v1.4.1 documented 500 supported hash types.'
    - '2023: v2.0.0 documented more than 600 supported hash types and added the `list` command.'
    - >
      2023: v2.1.0 added fzf-oriented helper commands for Hashcat and John the Ripper
      workflows.
    - '2025: v3.0.0 documented 641 supported hash types and Ruby 3.4 support.'
    - '2026: v4.0.0 documented 675 supported hash types and Ruby 4.0 support.'
  usage:
    - >
      Typical use is passing an unknown hash string to the `haiti` CLI, using the
      library from Ruby, or asking haiti for Hashcat and John the Ripper references.
      Later releases added commands and helper binaries for listing supported hash types
      and selecting cracking modes or formats through fzf.
    - >
      The project deliberately avoids credentials or persistent local configuration in
      its documented core workflow. It is a lookup and classification tool rather than a
      password store or cracking engine.
related-packages:
  - id: brew:hashcat
    reason: >
      HAITI reports Hashcat mode references, letting users identify a candidate hash
      type before running an authorized Hashcat audit with the matching mode.
    rel: adjacent_workflow
    sources:
      - https://noraj.github.io/haiti/
      - https://hashcat.net/hashcat/
  - id: brew:john-jumbo
    reason: >
      HAITI reports John the Ripper format references, which can then select the
      appropriate Jumbo-format parser for an authorized password audit.
    rel: adjacent_workflow
    sources:
      - https://noraj.github.io/haiti/
      - https://www.openwall.com/john/
