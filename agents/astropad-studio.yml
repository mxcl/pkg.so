history:
  adoption-history:
    - >
      Astropad states that Studio is trusted by more than 100,000 digital artists and
      reports thousands of App Store ratings. It is positioned for individual artists as
      well as education and enterprise customers.
  package-nerd-significance:
    - >
      Studio represents the class of paired-device desktop software in which a macOS or
      Windows companion, an iPad client, networking, input translation, and account
      licensing operate as one product. For Mac package users, installing the desktop
      cask is only one part of the complete setup.
  project-history:
    - >
      Astropad Studio was developed by Astropad as its professional iPad drawing-tablet
      product. It builds on Astropad's proprietary LIQUID video technology to deliver
      color-corrected, Retina-resolution, low-latency desktop mirroring over USB, Wi-Fi,
      or peer-to-peer networking.
  related-projects:
    - >
      Astropad's related products include Luna Display, Astropad Slate, and Workbench.
      Studio is commonly used with creative applications such as Adobe products,
      Affinity, Clip Studio Paint, and Krita.
  sources:
    - >
      Official Help Center:
      https://support.astropad.com/en/collections/13737931-astropad-studio
    - 'Official product page: https://astropad.com/product/studio/'
  summary:
    - >
      Astropad Studio turns an iPad and Apple Pencil into a customizable drawing tablet
      for a Mac or Windows PC.
  timeline:
    - >
      Studio era: Astropad developed Studio as its subscription-oriented professional
      drawing product.
    - >
      2026: The official Help Center documents the current setup and feature set for the
      paired iPad and desktop applications.
  usage:
    - >
      Users install Studio on both the iPad and desktop computer, sign into an account,
      connect over USB or a supported network mode, and mirror a desktop creative
      application to the iPad. Studio adds configurable gestures, shortcut sidebars,
      quick keys, pressure curves, and pressure smoothing.
