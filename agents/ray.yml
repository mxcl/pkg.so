history:
  adoption-history:
    - >
      Ray began in the PHP and Laravel ecosystem around Spatie's open-source client
      packages, then expanded through official and community integrations for
      JavaScript, Node.js, Vue, React, WordPress, Bash, Ruby, Rust, Python, Go, and
      Dart. The application is distributed for macOS, Windows, and Linux, including
      installation through Homebrew on macOS.
    - >
      Spatie describes Ray as widely used in the Laravel and PHP community. Its shared
      syntax and dedicated desktop display let developers retain the immediacy of
      dump-style debugging while separating structured output from a browser page or
      terminal.
  package-nerd-significance:
    - >
      Ray pairs a proprietary desktop receiver with a constellation of
      package-manager-installed language clients. That split makes it especially visible
      to package users: the desktop cask is only one half of the workflow, while
      Composer, npm, gem, and other ecosystem packages instrument individual projects.
    - >
      The public spatie/ray repository is the PHP sender library rather than the source
      of the desktop application. Likewise, the public myray.app repository contains the
      product website and documentation, an important distinction when identifying the
      application's official repository.
  project-history:
    - >
      Spatie developed Ray as a dedicated desktop home for debugging output sent by
      small language and framework libraries. The product expanded from its PHP and
      Laravel roots into a cross-language debugging interface with formatted values,
      filtering, screens, IDE links, queries, performance measurements, and
      remote-server support.
    - >
      Spatie later rebuilt the desktop application for Ray 3.0 using Electron and React.
      A public beta opened in November 2025, and Ray 3.0 launched on January 28, 2026
      with lower memory use, message archives, a redesigned interface, and a Model
      Context Protocol server for AI-agent interaction.
  related-projects:
    - >
      spatie/ray and spatie/laravel-ray are official PHP and Laravel sender libraries,
      not the desktop application's source repository.
    - spatie/myray.app is the public source repository for Ray's website and documentation.
    - >
      Community-supported integrations connect Ray to JavaScript, Python, Ruby, Go,
      Bash, and additional frameworks.
  sources:
    - 'Official PHP integration repository: https://github.com/spatie/ray'
    - 'Official Ray 3 beta feedback repository: https://github.com/spatie/ray-app-v3-beta'
    - 'Official Ray 3.0 announcement: https://myray.app/blog/introducing-ray-30'
    - 'Official documentation: https://myray.app/docs/'
  summary:
    - >
      Ray is Spatie's cross-platform desktop debugging console. Language-specific
      libraries send structured dumps and diagnostic events to the application, which
      organizes them separately from the program being debugged.
  timeline:
    - "2023: Spatie moved and overhauled Ray's documentation on myray.app."
    - '2025: The rebuilt Ray 3.0 entered public beta in November.'
    - >
      2026: Ray 3.0 launched on January 28 with a new interface, archives, performance
      improvements, and MCP support.
  usage:
    - >
      Developers install Ray on the desktop and add the matching client package to a
      project. Calls such as ray('Hello world!') send structured payloads to the local
      application, where users can search, filter, color, archive, and inspect them or
      jump to the originating source line. The desktop settings UI controls IDE
      integration, shortcuts, appearance, and servers, but the official documentation
      does not publish a stable configuration-file or credentials-file path.
