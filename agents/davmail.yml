history:
  adoption-history:
    - >
      DavMail has stayed useful because Exchange and Office 365 deployments often
      outlive the mail clients or workflows developers prefer. The upstream README
      documents several distribution channels, including SourceForge downloads, Linux
      packages, Flatpak, Docker images, and Windows and macOS builds, which reflects a
      project used across workstation and service-style setups rather than a single
      platform niche.
  package-nerd-significance:
    - >
      For package maintainers, DavMail is interesting because it packages a
      compatibility layer rather than a single client: Java, OAuth and Exchange protocol
      behavior, daemon-style server mode, and desktop integration all meet in one tool.
      It is the kind of package that keeps old but reliable Unix mail workflows viable
      in corporate Microsoft environments.
  project-history:
    - >
      The project dates back to the SourceForge era, with the official GitHub mirror
      carrying an initial SourceForge import tag from December 2006. The README says the
      main project site remains on SourceForge and that the GitHub repository is
      synchronized from the main Subversion repository to make contributions easier for
      GitHub users.
  related-projects:
    - >
      DavMail sits beside mail clients, calendar clients, and address-book clients
      rather than replacing them, acting as an Exchange and Office 365 bridge for tools
      that already support open protocols.
  sources:
    - https://github.com/mguessan/davmail
    - >
      https://api.github.com/repos/mguessan/davmail/git/tags/1d806ba25d3c2107344ba900ddb841d9b290f889
    - https://davmail.sourceforge.net/serversetup.html
    - https://davmail.sourceforge.net/faq.html
  summary:
    - >
      DavMail is a desktop and server gateway that lets standard POP, IMAP, SMTP,
      CalDAV, CardDAV, and LDAP clients talk to Microsoft Exchange and Office 365. Its
      package-manager appeal is practical: it turns a vendor-specific groupware account
      into ordinary local network services that Unix mail, calendar, and address-book
      tools already understand.
  timeline:
    - '2006: Official GitHub mirror records the initial SourceForge project import tag.'
    - '2018: The synchronized GitHub mirror was created for easier GitHub-based contribution.'
    - '2026: Upstream documentation lists DavMail 6.8.0 and current server setup instructions.'
  usage:
    - >
      Users run DavMail as a local desktop gateway or as a standalone server. The server
      setup guide describes preparing a davmail.properties file and running a shared
      gateway for clients that speak POP, IMAP, SMTP, LDAP, CalDAV, or CardDAV while
      DavMail handles Exchange Web Services or Microsoft Graph on the other side.
related-packages:
  - id: cask:thunderbird
    reason: >
      DavMail's official guides document using Thunderbird with its IMAP, SMTP, CalDAV,
      CardDAV, and LDAP gateways, making Thunderbird a directly supported client for
      Exchange and Office 365 workflows.
    rel: adjacent_workflow
    sources:
