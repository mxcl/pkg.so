history:
  adoption-history:
    - >
      PingPlotter began as a Windows diagnostic program and developed Free, Standard,
      and Professional editions for home users, gamers, support staff, and network
      administrators. Version 5 broadened the modern product to Windows and macOS, with
      service operation, multi-target monitoring, alerts, and web-oriented features; the
      supplied package metadata records Homebrew cask distribution for macOS.
  package-nerd-significance:
    - >
      PingPlotter turned repeated ping and traceroute samples into persistent, navigable
      time-series evidence. Its practical appeal is the ability to correlate packet loss
      or latency with individual route hops and export a clear record for an ISP or
      operations team, filling a gap between one-shot command-line diagnostics and full
      infrastructure-monitoring suites.
  project-history:
    - >
      Founder Pete Ness wrote PingPlotter's first code in early 1998 using Borland
      Delphi. Public release notes document releases from July 1998 onward. A ground-up
      rewrite began at the end of 2013 alongside the transition to Pingman Tools,
      preserving continuous collection and graphing while replacing the original Delphi
      foundation for PingPlotter 5.
  related-projects:
    - >
      PingPlotter builds on the diagnostic concepts of ping and traceroute. The same
      company also publishes PingPlotter Cloud, Sidekick, and legacy MultiPing-related
      support material.
  sources:
    - 'Official Version 5 manual: https://www.pingplotter.com/manual/'
    - >
      Official founder's account:
      https://www.pingplotter.com/wisdom/article/v5-founder-letter/
    - >
      Official long-term monitoring guide:
      https://www.pingplotter.com/legacy-manual/interpretlongtermmonitoring/
    - 'Official release notes: https://www.pingplotter.com/download/release-notes/'
  summary:
    - >
      PingPlotter is a long-running network diagnostic application that continuously
      samples routes and presents latency, packet loss, and route changes as historical
      graphs for troubleshooting intermittent connectivity.
  timeline:
    - '1998: Pete Ness wrote the first PingPlotter code in Borland Delphi.'
    - >
      1998: Official release notes record early public releases, including a July
      release and version 2.03 in November.
    - '2013: A ground-up rewrite began as the company transitioned to Pingman Tools.'
    - >
      2016: The version 5 release line focused on continuous long-running collection and
      historical review.
  usage:
    - >
      Users trace a stable remote target continuously, inspect per-hop latency and
      packet loss, zoom into problem periods, compare route changes, and save graphs or
      trace data as evidence. Standard and Professional workflows add alerts, named
      configurations, multiple targets, service operation, and longer-term collection.
