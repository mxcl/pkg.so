history:
  adoption-history:
    - >
      Official documentation positions Vimcal particularly for executive assistants
      managing one or more executives' calendars. It supports delegated Google Calendar
      and Microsoft Outlook accounts.
  package-nerd-significance:
    - >
      For desktop-package users, Vimcal represents the keyboard-oriented,
      service-connected calendar category rather than a local-file calendar utility. Its
      value depends on integration with existing Google or Microsoft calendar accounts.
  project-history:
    - >
      The available official documentation describes the current product and workflows
      but does not provide a reliable dated account of the project's founding or release
      history.
  related-projects:
    - >
      Vimcal connects to Google Calendar and Microsoft Outlook accounts and can
      integrate Zoom, Microsoft Teams, and Google Meet.
  sources:
    - https://docs.vimcal.com/
    - https://docs.vimcal.com/getting-started/account-setup
    - https://docs.vimcal.com/getting-started/top-features-for-eas
    - https://vimcal.com/
  summary:
    - >
      Vimcal is a calendar and scheduling application oriented toward fast
      keyboard-driven scheduling and executive-assistant workflows.
  timeline:
    - >
      The official sources reviewed do not provide a sufficiently reliable public
      release timeline.
  usage:
    - >
      Users sign in with a Google or Microsoft account, import existing events and
      settings, and optionally add calendars for executives after receiving delegate
      access.
    - >
      Scheduling tools include text-based availability sharing, multi-time-zone
      conversion, temporary calendar holds, group availability collection, scheduling
      assistance, and calendar-audit exports.
