config-file-location:
  unix:
    - monika.yml
credentials-file-location:
  unix:
    - monika.yml
history:
  project-history:
    - >
      Monika's design is configuration-file driven. It reads a monika.yml file, builds
      HTTP or TCP probes from that configuration, checks assertions such as status code,
      response time, and response body, and sends incident or recovery notifications
      through configured channels including email, webhooks, Telegram, WhatsApp, and
      others. The GitHub project presents it as a Node.js/TypeScript CLI for monitoring
      web apps with a simple YAML file, alerting not only on downtime but also on slow
      responses.
  sources:
    - https://formulae.brew.sh/formula/monika
    - https://github.com/hyperjumptech/monika
    - >
      https://medium.com/hyperjump-tech/monika-v1-6-0-is-out-yaml-support-secondary-proof-advanced-alert-and-many-more-dedc3a0d0c7
    - https://monika.hyperjump.tech/guides/alerts
    - https://monika.hyperjump.tech/guides/configuration-file
    - https://monika.hyperjump.tech/overview
  summary:
    - >
      Monika is Hyperjump Technology's open-source synthetic monitoring CLI. Its
      documentation explains the name as an abbreviation of Monitoring Berkala,
      Indonesian for periodic monitoring, and describes the tool as a free command-line
      application for synthetic monitoring.
  usage:
    - >
      A visible milestone in the project's own writing was v1.6.0 in 2021, which
      highlighted YAML configuration support, alert improvements, periodic worker-status
      messages, and secondary proof checks. In the package-manager ecosystem, the
      Homebrew formula gives operators a native monika executable for local cron jobs,
      CI monitors, small self-hosted checks, or lightweight synthetic monitoring
      alongside heavier SaaS observability systems.
related-packages:
  - id: brew:prometheus
    reason: >
      Run Monika with its Prometheus endpoint enabled so Prometheus can scrape and
      retain the synthetic probe metrics exposed at /metrics.
    rel: adjacent_workflow
    sources:
      - https://monika.hyperjump.tech/guides/cli-options
      - https://github.com/hyperjumptech/monika
      - https://prometheus.io/docs/prometheus/latest/getting_started/
