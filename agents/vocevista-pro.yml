history:
  adoption-history:
    - >
      VoceVista developed within singing-voice research and pedagogy. Its official
      history describes use in wired masterclasses, National Association of Teachers of
      Singing presentations, academic research, and teaching by voice instructors.
    - >
      The software's adoption reflects a bridge between laboratory voice science and
      studio instruction: real-time spectra, formants, harmonics, vibrato, and
      electroglottograph data give singers and teachers immediate visual feedback.
  package-nerd-significance:
    - >
      VoceVista Pro is a specialized commercial counterpart to general-purpose
      audio-analysis packages. Package enthusiasts care about it because it combines
      voice-specific visualization, recording, video, vibrato analysis, and EGG hardware
      support in one desktop application.
  project-history:
    - >
      VoceVista grew out of Donald Miller's work in singing and voice acoustics,
      including earlier DOS and Windows tools that displayed microphone, spectral, and
      electroglottograph signals together.
    - >
      A parallel lineage began when Bodo Maass and Wolfgang Saus created Sygyt Software
      and Overtone Analyzer for overtone-singing instruction. The teams began combining
      their approaches in 2008, using Overtone Analyzer's platform for a rewritten
      VoceVista product.
    - >
      The combined work produced a cross-platform VoceVista Video release in 2017. With
      version 6.0 in 2026, the product families were unified under the VoceVista name
      and VoceVista Video Pro became VoceVista Pro.
  related-projects:
    - >
      Overtone Analyzer and the original VoceVista were initially separate products.
      Since version 5 they have shared code and an interface, and version 6 renamed
      Overtone Analyzer to VoceVista Basic while the top edition became VoceVista Pro.
  sources:
    - https://www.vocevista.com/en/about/
    - https://www.vocevista.com/en/about/history/don-millers-history/
    - https://www.vocevista.com/en/doc/home/
    - https://www.vocevista.com/en/support/frequently-asked-questions/
  summary:
    - >
      VoceVista Pro is commercial voice-analysis software for singers, teachers, and
      researchers, combining spectra, spectrograms, pitch and vibrato analysis, video,
      and electroglottograph support.
  timeline:
    - '2003: Sygyt Software began the parallel Overtone Analyzer lineage.'
    - >
      2007: VoceVista technology was used in a wired singing masterclass, and EGGs for
      Singers was co-founded.
    - '2008: The VoceVista and Overtone Analyzer teams began converging their products.'
    - '2017: The first cross-platform VoceVista Video release arrived for macOS and Windows.'
    - '2026: Version 6 unified product naming, with VoceVista Video Pro becoming VoceVista Pro.'
  usage:
    - >
      Users record or open voice audio and examine its waveform, spectrum, spectrogram,
      pitch, harmonics, formants, long-term average spectrum, and vibrato. The Pro
      edition also supports electroglottograph signals and video-oriented analysis.
    - >
      Sessions can reference external media or contain project media, while profiles can
      export selected settings and layouts as `.oapr` files. These user-created profile
      files are portable presets, not a documented application configuration-file
      location.
related-packages:
