history:
  adoption-history:
    - >
      The viewer is tied to the honto account and library ecosystem: signing in
      registers the device and exposes purchased titles. Its availability on Windows,
      macOS, iOS, and Android made it the reading layer for honto's cross-device
      electronic-book service.
    - >
      The official tenth-anniversary history records rapid early service adoption,
      including one million honto members in 2013 and two million in 2014. Those figures
      describe the overall honto service rather than the desktop viewer alone.
  package-nerd-significance:
    - >
      honto illustrates a service-coupled proprietary reader: the package manager can
      install the client, but authentication, entitlements, library synchronization, and
      book delivery remain controlled by the bookseller. The Mac application also
      supports a narrower set of content and annotation features than some other honto
      clients.
  project-history:
    - >
      honto launched in May 2012 as a hybrid bookstore integrating electronic books,
      online print-book sales, and participating physical bookstores. The viewer
      application supplies local access to electronic titles purchased through that
      service.
    - >
      The official feature guide documents platform-specific differences. On macOS, the
      viewer initially supported EPUB content while several bookmark, marker, search,
      and multimedia capabilities available elsewhere were absent or introduced
      separately.
  related-projects:
    - >
      The viewer is the client application for the honto electronic-book store, account,
      and online library.
    - >
      The broader honto service also connects online sales with participating DNP-group
      physical bookstores and the honto points program.
  sources:
    - >
      https://help.honto.jp/%E9%9B%BB%E5%AD%90%E6%9B%B8%E7%B1%8D%E3%82%92%E5%88%9D%E3%82%81%E3%81%A6%E8%AA%AD%E3%82%80-65aa7742b83dd00024ff56c4
    - >
      https://help.honto.jp/Windows%E7%89%88%E3%82%A2%E3%83%97%E3%83%AA%E3%81%AE%E6%A9%9F%E8%83%BD%E7%B4%B9%E4%BB%8B-65aa7742b83dd00024ff567c
    - https://honto.jp/cp/hybrid/campaign/anniversary-entry/history.html
  summary:
    - >
      hontoビューアアプリ is the proprietary reading client for electronic books purchased
      through the Japanese honto bookstore service.
  timeline:
    - >
      2012-05: honto opened as a hybrid bookstore combining electronic books, online
      sales, and physical-store cooperation.
    - '2013-02: The wider honto service reported one million members.'
    - '2014-03: The wider honto service reported two million members.'
    - '2014-07: honto removed download deadlines from all electronic-book products.'
  usage:
    - >
      Users install the viewer, sign in with their honto member ID and password,
      download purchased books from the displayed library, and open downloaded titles
      for reading.
    - >
      The official feature guide documents libraries and viewers on each supported
      platform. The Mac edition supports EPUB, but its feature set differs from the
      Windows and mobile editions.
