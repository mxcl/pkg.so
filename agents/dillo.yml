history:
  adoption-history:
    - >
      Dillo became a favorite in lightweight Linux, BSD, rescue, embedded, and
      old-machine circles because it could render many documents quickly without the
      cost of mainstream browser engines. Package-manager adoption across Homebrew,
      Debian, Fedora, Alpine, Arch, Ubuntu, and Nix reflects that role as a useful,
      inspectable browser for constrained or deliberately simple environments.
  package-nerd-significance:
    - >
      Dillo is package-nerd catnip because it embodies an alternative browser lineage:
      small C/C++ code, FLTK UI, no JavaScript requirement, static HTML friendly project
      infrastructure, and a modern revival after years of stalled development. Its 2025
      GitHub migration notice is also unusually self-referential: the project moved
      toward self-hosted cgit partly so Dillo itself could browse its own development
      infrastructure.
  project-history:
    - >
      According to the official 25-year history, Dillo began in 1999 when developers led
      by Jorge Arellano Cid forked the Gzilla/Armadillo code. The browser started in a
      GTK period, later moved toward FLTK to better match the project's goals of speed
      and small footprint, and eventually produced the 2.x and 3.x families.
  related-projects:
    - >
      Dillo descends from Gzilla/Armadillo and is related to lightweight browser and
      fork projects such as dillo-plus, dilloNG, D+ browser, and Mobilized Dillo, all
      listed by the official README as related forks.
  sources:
    - https://dillo-browser.org/
    - https://dillo-browser.org/25-years/
    - https://dillo-browser.org/user_help.html
    - https://dillo-browser.org/release/3.2.0
    - https://dillo-browser.org/news/migration-from-github/
    - https://dillo-browser.org/dillo.org.html
    - https://github.com/dillo-browser/dillo#readme
  summary:
    - >
      Dillo is a small, fast graphical web browser focused on personal security,
      privacy, and low resource use. The current official site describes support for
      Linux, BSD, macOS, Windows via Cygwin, and even Atari, with a custom rendering
      engine and a deliberately limited dependency stack.
  timeline:
    - '1999: Dillo begins as a fork of Gzilla/Armadillo.'
    - '2000: Dillo changes license to GPL with permission from the Gzilla/Armadillo author.'
    - '2004: Dillo 0.8.3 has HTTPS support via the DPI plugin mechanism.'
    - '2006: Last GTK1 release, 0.8.6.'
    - '2008: FLTK-based 2.0.0 release follows the porting effort.'
    - '2015: Dillo 3.0.5 released on the old project line.'
    - '2022: The old dillo.org domain expires, disrupting project infrastructure.'
    - '2024: New dillo-browser.org site documents the revival and 25-year history.'
    - >
      2025: Dillo 3.2.0 released and the project begins migration from GitHub to
      self-hosted git.
  usage:
    - >
      Users typically run Dillo as a graphical browser for local files, HTTP, HTTPS,
      FTP, and simple web pages. The user manual highlights its lack of JavaScript,
      support for a subset of HTML and CSS, local manual availability, configuration
      through files under `~/.dillo`, and privacy/network controls such as cookies,
      proxies, ad blocking, downloads, and image handling.
related-packages:
  - id: brew:lynx
    reason: >
      Choose Lynx when browsing must remain entirely inside a character-cell terminal;
      choose Dillo when a lightweight graphical interface and image rendering are
      useful.
    rel: alternative
    sources:
      - https://dillo-browser.org/user_help.html
      - https://invisible-island.net/lynx/
