  - https://goframe.org/en/docs/cli
config-file-location:
  unix:
    - ./hack/config.yaml
    - ./config.{toml,yaml,yml,json,ini,xml,properties}
    - ./config/config.{toml,yaml,yml,json,ini,xml,properties}
    - ./manifest/config/config.{toml,yaml,yml,json,ini,xml,properties}
credentials-file-location: null
history:
  adoption-history:
    - >
      The project evolved into a broad Go framework with modules for web services, ORM,
      configuration, validation, logging, resource management, service work, and
      microservice development. Its GitHub repository shows a large contributor and user
      footprint, and the docs describe use in enterprise-style production projects such
      as microservices, IoT, blockchain, e-commerce, and banking systems.
  package-nerd-significance:
    - >
      GoFrame is interesting to package maintainers because the formula name `gf`
      exposes a CLI, while the main project is also a Go library imported as
      `github.com/gogf/gf/v2`. That dual identity makes it both a developer tool and an
      application dependency in Go service stacks.
  project-history:
    - >
      GoFrame's release notes trace the public line back to v0.1 in April 2018, with
      early modules covering file monitoring, configuration reloads, template refreshes,
      conversion helpers, pagination, logging, Redis access, HTTP, and database
      functionality. The v1.x line followed later in 2018, and v2.0 appeared in March
      2022 as a major framework generation.
  related-projects:
    - >
      The repository links the official site, English documentation, API docs on
      pkg.go.dev, documentation source, and related demo projects in the GoFrame
      organization.
  sources:
    - https://github.com/gogf/gf
    - https://goframe.org/en/docs/cli/gen-ctrl
    - https://goframe.org/en/docs/micro-service
    - https://goframe.org/en/release/note
    - https://goframe.org/en/release/v0.1.0
    - https://goframe.org/en/release/v1.11.0
  summary:
    - >
      GoFrame is a Go application framework and command-line toolchain aimed at
      full-stack service development. In package-manager terms, the `gf` executable
      matters because it installs the framework's project scaffolding, code generation,
      build, and upgrade commands alongside the Go module.
  timeline:
    - '2018: v0.1 introduced the early public framework module set.'
    - '2018: v1.0 and v1.x releases expanded web, ORM, routing, and infrastructure features.'
    - '2022: v2.0 marked a major framework generation.'
    - >
      2025: The release documentation described Go modules as the preferred
      version-management path and `gf up -a` as a CLI upgrade path.
  usage:
    - >
      Practitioners use `gf` to create and maintain GoFrame applications, generate
      controllers and database/protobuf entities, build resource-aware binaries, and run
      framework upgrades. The recommended version-management path is Go modules, with
      the CLI available for full framework upgrades from a project root.
related-packages:
  - id: brew:go
    reason: >
      Go is the required toolchain for compiling GoFrame applications, managing their
      modules, and installing the `gf` CLI.
    rel: adjacent_workflow
    sources:
      - https://github.com/gogf/gf
      - https://go.dev/doc/
  - id: brew:protobuf
    reason: >
      Choose Protocol Buffers alongside GoFrame when using `gf gen pb` to generate Go
      interfaces and controller-related code from `.proto` definitions.
    rel: adjacent_workflow
    sources:
      - https://goframe.org/docs/cli/gen
      - https://protobuf.dev/overview/
