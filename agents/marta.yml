credentials-file-location: null
history:
  adoption-history:
    - >
      Marta is aimed at macOS power users who prefer keyboard-driven, dual-pane file
      management. Its Homebrew cask and optional command-line launcher integrate the
      graphical application into terminal-oriented installation and navigation
      workflows.
  package-nerd-significance:
    - >
      Marta brings the Norton Commander-style dual-pane tradition to a native macOS
      application while retaining unusually deep text-based customization. Its Marco
      configuration language, Lua plugin API, embedded terminal, archive handling, and
      command-line launcher make it particularly attractive to users who treat a file
      manager as an extensible part of their development environment.
  project-history:
    - >
      Yan Zhulanow introduced Marta in 2016 as a native, minimalistic dual-pane file
      manager for macOS. It was designed around fast file operations, configurable
      keyboard bindings, text-based configuration, and extensibility rather than a large
      conventional preferences interface.
    - >
      The project developed a documented Lua plugin API, an embedded terminal with
      directory synchronization, broad archive support, custom themes, and a launcher
      for opening one or two paths from the shell.
  related-projects:
    - >
      Marta belongs to the same dual-pane file-manager tradition as Norton Commander,
      Midnight Commander, and Total Commander, while using native macOS technologies and
      its own Marco configuration format.
  sources:
    - https://marta.sh/
    - https://marta.sh/blog/introducing-marta/
    - https://marta.sh/docs/
    - https://marta.sh/docs/advanced/cli/
    - https://marta.sh/docs/other/uninstall/
  summary:
    - >
      Marta is a native, keyboard-centric dual-pane file manager for macOS. It combines
      conventional file operations with archives, an embedded terminal, extensive
      configuration, themes, and Lua plugins.
  timeline:
    - '2016: Yan Zhulanow introduced Marta as a native dual-pane file manager for macOS.'
    - >
      2024: The official site continued to identify the product as native, extensible,
      and configurable.
    - '2026: Homebrew distributed Marta 0.8.2 in the supplied cask record.'
  usage:
    - >
      Users work with source and target directory panes side by side, switching the
      active pane with Tab and invoking actions for copying, moving, navigation,
      archives, and disk analysis. Keyboard bindings and interface behavior are
      customized through Marta's configuration editor.
    - >
      Terminal users can enable the optional `marta` launcher by linking the
      application-provided launcher into `/usr/local/bin`; commands such as `marta .`
      open paths directly in Marta.
