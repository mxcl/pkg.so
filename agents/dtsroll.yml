id: brew:dtsroll
display-name: dtsroll
repo: https://github.com/privatenumber/dtsroll
docs:
  - https://github.com/privatenumber/dtsroll#readme
config-file-location:
  unix:
    - ./package.json
credentials-file-location: null
history:
  adoption-history:
    - >
      dtsroll is early-stage but already has both npm and Homebrew distribution. Its npm
      registry metadata shows releases after the initial 2025 publication, and the
      Homebrew formula distributes the CLI from the npm tarball.
  package-nerd-significance:
    - >
      dtsroll is package-nerd bait because it exists to fix packaging metadata fallout:
      `.d.ts` files are part of the package interface, and bad declaration imports break
      consumers even when runtime JavaScript is fine. It sits near tools such as
      `pkgroll` and `unplugin-dts` in the TypeScript library-publishing toolchain.
  project-history:
    - >
      The public repository and npm package appeared in January 2025. The README frames
      the project around a common TypeScript publishing failure: emitted declarations
      can preserve imports from private or development-only packages, leaving consumers
      with unresolved type references.
  related-projects:
    - >
      The README explicitly lists `pkgroll` as a related zero-config JavaScript and DTS
      bundler and documents integration with `unplugin-dts` for Vite builds.
  sources:
    - https://github.com/privatenumber/dtsroll
    - https://github.com/privatenumber/dtsroll#readme
    - https://registry.npmjs.org/dtsroll
    - https://formulae.brew.sh/api/formula/dtsroll.json
  summary:
    - >
      dtsroll is a TypeScript declaration-file bundler aimed at package authors. It runs
      after `tsc` emits `.d.ts` files and bundles declaration dependencies so published
      package types work for downstream consumers.
  timeline:
    - '2025: Public privatenumber/dtsroll repository created.'
    - '2025: npm registry records initial dtsroll publication.'
    - '2025-2026: Homebrew formula distributes the CLI from npm release tarballs.'
  usage:
    - >
      The default workflow is to run `dtsroll` after `tsc`. With no explicit entries, it
      reads `package.json`, finds declaration entry points from `types` or `exports`,
      bundles devDependency type imports into the emitted declarations, and leaves
      runtime dependencies external.
related-packages:
  - id: brew:typescript
    reason: >
      TypeScript's `tsc` emits the `.d.ts` files that dtsroll subsequently consolidates,
      making the compiler and bundler consecutive stages of the documented publishing
      workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/privatenumber/dtsroll#readme
      - https://www.typescriptlang.org/docs/handbook/declaration-files/publishing.html
