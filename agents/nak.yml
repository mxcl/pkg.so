id: brew:nak
display-name: nak
repo: null
docs:
  - https://github.com/fiatjaf/nak#readme
config-file-location:
  unix:
    - ~/.config/nak/bunker/<profile>
credentials-file-location:
  unix:
    - ~/.config/nak/bunker/<profile>
history:
  adoption-history:
    - >
      nak's audience is narrower than mainstream networking tools, but it sits in an
      important niche for Nostr developers and power users. The repository metadata
      consulted on 2026-07-01 showed 389 GitHub stars and 46 forks, and the Homebrew
      page listed 673 installs over the prior 365 days.
    - >
      Its adoption is tied to Nostr's preference for simple event and relay primitives:
      a CLI that can emit JSON, sign events, query relays, manage keys, and script relay
      operations is useful for debugging clients, writing shell workflows, and testing
      protocol behavior.
  package-nerd-significance:
    - >
      nak is significant less as a mass-market CLI and more as a protocol workbench. It
      gives Nostr's event model a Unix-shaped interface, which is exactly what packagers
      and shell people want when a network protocol is still evolving.
  project-history:
    - >
      The GitHub repository was created on 2022-02-09, during the early growth period of
      the Nostr ecosystem. Its README presents it as a general-purpose command-line tool
      for Nostr work, installable via a shell installer, Go, binaries, Homebrew, Arch,
      and Nix.
    - >
      The release stream shows active maintenance through the 0.19 and 0.20 series,
      including v0.20.0 on 2026-06-21. That cadence fits a protocol utility that follows
      NIP additions and real relay/client usage rather than a one-off demo.
  related-projects:
    - Nostr
    - nostr-tools
    - noscl
  sources:
    - https://api.github.com/repos/fiatjaf/nak
    - https://api.github.com/repos/fiatjaf/nak/releases?per_page=5
    - https://formulae.brew.sh/formula/nak
    - https://github.com/fiatjaf/nak
    - https://stuff.fiatjaf.com/
  summary:
    - >
      nak is fiatjaf's "nostr army knife": a Go command-line tool for creating, signing,
      publishing, querying, validating, and otherwise plumbing Nostr protocol events.
  timeline:
    - '2022-02-09: GitHub repository created.'
    - '2026-06-21: v0.20.0 release published.'
    - >
      2026-07-01: Homebrew Formulae page listed version 0.20.0 and 673 installs over the
      prior 365 days.
  usage:
    - >
      The README examples show the core workflow: `nak event` creates a signed event;
      options can set secret keys, content, tags, timestamps, and relay targets; `nak
      req` queries relays and emits JSON that users commonly pipe to tools like `jq`.
    - >
      Package nerds reach for nak when they want a reproducible Nostr command in a
      script: publish a test note, inspect relay responses, validate an event, talk to
      relay management APIs, experiment with bunker/nsec flows, or use Nostr as a
      transport for other artifacts.
related-packages:
  - id: brew:jq
    reason: >
      nak's official examples pipe relay-event JSON into jq to extract content and
      transform encoded Nostr objects in shell workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/fiatjaf/nak#readme
      - https://github.com/jqlang/jq
