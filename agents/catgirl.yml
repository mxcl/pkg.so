id: brew:catgirl
display-name: catgirl
repo: https://git.causal.agency/catgirl
docs:
  - https://git.causal.agency/catgirl/about
  - https://git.causal.agency/catgirl/about/catgirl.1
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/catgirl
    - $XDG_CONFIG_DIRS/catgirl
    - ~/.config/catgirl
credentials-file-location: null
history:
  adoption-history:
    - >
      The README says catgirl and libtls may be packaged for the user's system, and the
      supplied package facts list Alpine, Homebrew, Debian, MacPorts, Nix, Scoop, and
      Ubuntu. That is broad adoption for a deliberately small IRC client.
  package-nerd-significance:
    - >
      catgirl is interesting to package people because it combines old IRC culture with
      modern packaging details: libtls portability, XDG paths, curses UI, optional macOS
      sleep/wake wrapper, and BSD sandboxing. It is small, opinionated, and unusually
      explicit about what it refuses to implement.
  project-history:
    - >
      The official README presents catgirl as part of June McEnroe's IRC suite and
      points to an IRC Suite essay dated June 19, 2020. The project deliberately keeps a
      narrow scope: no dynamic configuration, no built-in multi-network management, no
      reconnection loop, and limited IRCv3 support unless it improves the intended
      experience.
  related-projects:
    - >
      Related projects include pounce, which the README names as an IRC bouncer option,
      and sandman, the macOS wrapper shipped with catgirl.
  sources:
    - https://git.causal.agency/catgirl
    - https://git.causal.agency/catgirl/about/
    - https://git.causal.agency/catgirl/about
    - https://git.causal.agency/catgirl/about/catgirl.1
    - https://formulae.brew.sh/api/formula/catgirl.json
  summary:
    - >
      catgirl is a terminal IRC client with a curses interface for IRC over TLS. Its
      README emphasizes focused terminal usability: tab completion, split scroll, URL
      handling, stable nick coloring, topic diffing, ignore filters, and sandboxing on
      BSD systems.
  timeline:
    - "2020: The README references June McEnroe's IRC Suite essay dated June 19."
    - '2025: The generated README page is dated May 8.'
    - '2026: The cgit page identifies https://git.causal.agency/catgirl as the upstream URL.'
  usage:
    - >
      Users run catgirl with a host or load one or more config files from XDG config
      directories. The manual covers TLS certificates, SASL PLAIN, CertFP via SASL
      EXTERNAL, logging to XDG data directories, URL open/copy helpers, and IRC command
      handling.
related-packages:
  - id: brew:weechat
    reason: >
      Choose WeeChat when you want a more extensible terminal IRC client with scripting,
      plugins, relay interfaces, and multi-server operation built into one client.
    rel: alternative
    sources:
      - https://git.causal.agency/catgirl/about/
      - https://weechat.org/doc/
  - id: brew:irssi
    reason: >
      Choose Irssi when you prefer a mature modular terminal IRC client with Perl
      scripting, themes, persistent configuration, and built-in reconnection controls.
    rel: alternative
    sources:
      - https://git.causal.agency/catgirl/about/
      - https://irssi.org/documentation/
  - id: brew:tmux
    reason: >
      Use tmux to run separate catgirl processes for multiple networks and keep those
      terminal sessions available after detaching, a workflow explicitly recommended by
      catgirl.
    rel: adjacent_workflow
    sources:
      - https://git.causal.agency/catgirl/about/
      - https://github.com/tmux/tmux/wiki
