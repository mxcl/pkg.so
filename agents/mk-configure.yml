  - https://github.com/cheusov/mk-configure/tree/master/doc
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      Technically, mk-configure combines ordinary build rules with autoconf-like probes.
      The mkc.configure.mk layer and standalone mkc_check_* tools check headers,
      declarations, functions, libraries, sizeof values, compilers, and custom
      conditions. The upstream README emphasizes C, C++, Objective-C, libraries,
      scripts, documentation, DESTDIR installs, uninstall targets, dependency analysis,
      and regression-test hooks.
  sources:
    - https://github.com/cheusov/mk-configure
    - https://groups.google.com/g/comp.unix.programmer/c/jcoEAhrbxHE
    - https://lvee.org/media/presentations/2009/Cheusov-presentation.pdf
    - https://manpages.ubuntu.com/manpages/focal/man7/mk-configure.7.html
  summary:
    - >
      mk-configure is Aleksey Cheusov's bmake-centered build system, presented in the
      late-2000s Unix tooling world as a lighter replacement for the Autotools workflow.
      Its design rejects generated configure and Makefile blobs: projects use bmake
      include files, POSIX shell, awk, and small helper programs, with mkcmake serving
      as the top-level command.
  usage:
    - >
      Its package-manager niche is Unix and BSD-adjacent software that wants
      configure-style portability without the GNU Autotools stack or a larger meta-build
      system such as CMake. The upstream project lists binary packages for pkgsrc,
      FreeBSD ports, Debian and Ubuntu, Arch, openSUSE, Fedora, and other distributions,
      which fits a tool aimed at source builds and packagers rather than application end
      users.
related-packages:
  - id: brew:autoconf
    reason: >
      Choose GNU Autoconf when compatibility with the conventional generated
      configure-script ecosystem matters more than mk-configure's smaller bmake-library
      approach.
    rel: alternative
    sources:
      - https://github.com/cheusov/mk-configure#readme
      - https://www.gnu.org/software/autoconf/
  - id: brew:cmake
    reason: >
      Choose CMake when you need a broadly adopted cross-platform project generator and
      IDE integration; mk-configure is narrower and centered on bmake and Unix tools.
    rel: alternative
    sources:
      - https://github.com/cheusov/mk-configure#readme
      - https://cmake.org/documentation/
