id: cask:shottr
display-name: Shottr
repo: null
docs:
  - https://shottr.cc/
  - https://shottr.cc/kb/faq
config-file-location:
  macos:
    - ~/Library/Preferences/cc.ffitch.shottr.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Shottr is aimed particularly at designers, front-end engineers, mobile developers,
      and other macOS users who need pixel-level screenshot inspection. It can be used
      without payment, while activation unlocks additional capabilities and commercial
      use requires a license.
  package-nerd-significance:
    - >
      Shottr is a compact native macOS utility that combines capture, annotation, OCR,
      measurement, and color inspection in one package. Its small footprint and
      keyboard-oriented workflow make it characteristic of the focused desktop utilities
      commonly installed through Homebrew Cask.
  project-history:
    - >
      Shottr began with a private beta in September 2020. Its early releases focused on
      fast screen capture and measurement; a July 2021 rewrite added annotation and
      reduced the application's size.
    - >
      Subsequent releases added scrolling capture, OCR and QR recognition, object
      removal, pinned screenshots, overlays, image resizing, backgrounds, URL-scheme
      automation, and S3-compatible uploading.
  related-projects:
    - macOS Screenshot
    - Raycast
    - Alfred
  sources:
    - 'Official FAQ: https://shottr.cc/kb/faq'
    - 'Official advanced-settings documentation: https://shottr.cc/kb/friendsclub'
    - 'Official privacy policy: https://shottr.cc/kb/privacy'
    - 'Official product page and release notes: https://shottr.cc/'
  summary:
    - >
      Shottr is a native macOS screenshot utility offering capture, annotation,
      scrolling screenshots, OCR, measurement, color inspection, and related image
      tools.
  timeline:
    - '2020: Shottr entered private beta.'
    - '2021: Shottr was rewritten and expanded with annotation and scrolling capture.'
    - '2022: Pinned screenshots, overlays, and additional annotation tools were added.'
    - '2024: Backdrop styling and URL-scheme integrations were added.'
    - '2025: S3-compatible uploading was added.'
  usage:
    - >
      Users invoke captures with global shortcuts or the menu-bar application, then
      crop, measure, annotate, inspect, copy, upload, or save the resulting image.
    - >
      Preferences are managed through the application. Official advanced-settings
      documentation uses the defaults domain cc.ffitch.shottr, which maps to the
      standard macOS preferences plist listed here.
    - >
      Shottr validates paid license keys online, but its official documentation does not
      identify a user-managed credentials file.
tags:
  - annotation
  - color-picker
  - macos
  - ocr
  - screen-measurement
  - screenshots
  - scrolling-capture
