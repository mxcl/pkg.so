id: brew:crates-tui
display-name: crates-tui
repo: null
docs:
  - https://github.com/ratatui/crates-tui#readme
config-file-location:
  unix:
    - $CRATES_TUI_CONFIG_HOME/config.toml
    - $CRATES_TUI_CONFIG_HOME/color.yaml
    - ./.config/config.toml
    - ./.config/color.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation documentation is oriented first around cargo install, with
      an Arch Linux AUR example. Homebrew and Nix packaging in the supplied package
      facts indicate that it also moved into general-purpose package-manager
      distribution.
  package-nerd-significance:
    - >
      crates-tui is package-nerd software in two senses: it is a package browser for the
      Rust ecosystem, and its upstream README explicitly frames the repository as an
      opinionated reference for organizing Ratatui TUI applications.
  project-history:
    - >
      The ratatui/crates-tui repository was created in February 2024. Its README
      describes a simple crates.io explorer with clipboard support for cargo add
      commands, browser links for documentation and crates.io pages, configurable key
      chords, custom widgets, and async crate metadata fetching.
  related-projects:
    - >
      The project is built on Ratatui and targets crates.io workflows; its README points
      readers to ratatui.rs for related tutorial material.
  sources:
    - https://github.com/ratatui/crates-tui
    - https://github.com/ratatui/crates-tui#readme
    - https://github.com/ratatui/crates-tui/releases/tag/v0.1.3
    - https://github.com/ratatui/crates-tui/releases/tag/v0.1.7
  summary:
    - >
      crates-tui is a Ratatui-based terminal interface for exploring crates.io. It
      combines Rust package discovery with a reference implementation for small to
      medium Ratatui applications.
  timeline:
    - '2024: ratatui/crates-tui repository created.'
    - '2024: v0.1.3 release published.'
    - '2024: v0.1.7 release published.'
  usage:
    - >
      Users run crates-tui to search crates.io from the terminal, inspect crate
      summaries, copy cargo add commands, and open documentation or crates.io pages in a
      browser.
related-packages:
  - id: brew:rust
    reason: >
      Rust supplies Cargo, which installs crates-tui and executes the cargo add commands
      that crates-tui can copy for discovered packages.
    rel: adjacent_workflow
    sources:
      - https://github.com/ratatui/crates-tui#readme
      - https://doc.rust-lang.org/cargo/commands/cargo-add.html
