history:
  adoption-history:
    - >
      The README documents Linux, Windows, MacPorts, and Homebrew build paths, and the
      batch package metadata lists Alpine, Homebrew, Debian, Fedora, Nix, Arch, Ubuntu,
      and openSUSE packages. That distribution spread reflects adoption by Qt/C++
      developers who want analyzer checks packaged with their compiler toolchains.
    - >
      Release history shows ongoing updates for modern LLVM and Qt versions, including
      LLVM 19-22 compatibility work, Qt 6 porting changes, and integration into
      clang-tidy in the 1.16 series.
  package-nerd-significance:
    - >
      Clazy is a classic packaging edge case: it sits at the intersection of Qt,
      Clang/LLVM ABI compatibility, compiler plugins, IDE integration, and distro
      compiler versions. Package maintainers care because a clazy build must match
      supported LLVM/Clang ranges while still being useful across Qt 5 and Qt 6
      codebases.
  project-history:
    - >
      The upstream changelog records a 0.0.1 first release on 2015-06-10 and a 1.0
      release on 2016-09-12. Subsequent releases expanded platform support, check
      coverage, fix-its, and standalone compilation-database use.
    - >
      Clazy was originally associated with KDAB-oriented Qt development workflows and is
      now hosted under KDE's SDK namespace. The current KDE project description calls it
      a Qt-oriented static code analyzer based on the Clang framework.
  related-projects:
    - Clang and LLVM provide the compiler framework and plugin surface.
    - Qt is the target application framework whose idioms and APIs Clazy checks.
    - clang-tidy is a related analyzer integration point introduced by Clazy 1.16.
    - KDE hosts the active upstream repository under its SDK namespace.
  sources:
    - https://invent.kde.org/sdk/clazy/-/blob/master/README.md
    - https://invent.kde.org/sdk/clazy/-/blob/master/Changelog
    - https://invent.kde.org/api/v4/projects/sdk%2Fclazy
  summary:
    - >
      Clazy is a Qt-oriented static analyzer built as a Clang compiler plugin and
      standalone tool. Its upstream README describes it as giving Clang Qt semantics and
      adding more than 50 Qt-related warnings, including checks for unnecessary
      allocations, API misuse, and automatic fix-its.
  timeline:
    - '2015: Version 0.0.1 first release.'
    - '2016: Version 1.0 release.'
    - '2017: Version 1.1 adds macOS and Windows support.'
    - '2017: Version 1.2 adds clazy-standalone for JSON compilation databases.'
    - '2021: Version 1.10 requires C++17.'
    - '2025: Version 1.16 adds clang-tidy integration.'
    - '2026: Version 1.17 continues Qt and LLVM compatibility work.'
  usage:
    - >
      Clazy is used either as a compiler wrapper/plugin or via clazy-standalone against
      a JSON compilation database. The README shows CMake and qmake usage, check levels,
      environment-variable and compiler-argument selection of checks, fix-it support,
      and warning-noise controls.
related-packages:
  - id: brew:llvm
    reason: >
      LLVM supplies the Clang framework and compiler interfaces used by Clazy's plugin
      and standalone analyzer workflows.
    rel: adjacent_workflow
    sources:
      - https://invent.kde.org/sdk/clazy/-/blob/master/README.md
      - https://llvm.org/
  - id: brew:qt
    reason: >
      Use Qt with Clazy when developing Qt C++ applications, because Clazy's documented
      checks specifically analyze Qt APIs and programming idioms.
    rel: adjacent_workflow
    sources:
      - https://invent.kde.org/sdk/clazy/-/blob/master/README.md
      - https://www.qt.io/
