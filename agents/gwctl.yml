history:
  adoption-history:
    - >
      gwctl's adoption path is through the Kubernetes SIGs organization and the Gateway
      API community rather than through a standalone vendor. The README says discussion
      happens in the same Slack channel and community meetings as the rest of the
      Gateway API subproject.
    - >
      Homebrew packaging gives macOS and Linux users a short install path, while source
      builds use Go, Git, and make. For cluster operators, this places gwctl beside
      kubectl as a specialized inspection and analysis tool for Gateway API topologies.
  package-nerd-significance:
    - >
      gwctl is package-manager relevant because it packages a specialized Kubernetes API
      understanding into one CLI. Rather than being another generic kubectl wrapper, it
      encodes Gateway API relationships, policy inheritance, warnings, and graph output,
      which are hard to see from raw YAML alone.
  project-history:
    - >
      The public GitHub repository was created on 2024-09-12 under kubernetes-sigs. The
      README places the tool inside the Gateway API ecosystem and explicitly marks it as
      an experimental Gateway API feature, meaning incompatible changes are expected
      while the design settles.
    - >
      GitHub releases show v0.1.0 on 2024-11-01 and v0.2.0 on 2025-11-28. That release
      cadence and the experimental warning fit a young Kubernetes-adjacent CLI being
      iterated alongside Gateway API resource patterns.
  related-projects:
    - 'Kubernetes: gwctl manages resources in Kubernetes clusters.'
    - >
      Gateway API: gwctl is developed around Gateway API resource models and community
      channels.
    - >
      kubectl and kustomize: gwctl examples use Kubernetes-style resource operations and
      kustomize URLs.
  sources:
    - https://api.github.com/repos/kubernetes-sigs/gwctl
    - https://api.github.com/repos/kubernetes-sigs/gwctl/releases?per_page=100
    - https://gateway-api.sigs.k8s.io/community/
    - >
      https://gateway-api.sigs.k8s.io/concepts/versioning/#release-channels-eg-experimental-standard
    - https://github.com/kubernetes-sigs/gwctl
    - https://raw.githubusercontent.com/kubernetes-sigs/gwctl/main/README.md
  summary:
    - >
      gwctl is a Kubernetes SIGs command-line tool for managing and understanding
      Kubernetes Gateway API resources. Its README describes create, view, describe,
      analyze, delete, and graphing workflows for Gateway API resources and other
      Kubernetes objects.
  timeline:
    - '2024-09-12: Public kubernetes-sigs/gwctl repository created.'
    - '2024-11-01: v0.1.0 GitHub release published.'
    - '2025-11-28: v0.2.0 GitHub release published.'
    - '2026: README continues to describe gwctl as an experimental Gateway API feature.'
  usage:
    - >
      The README demonstrates applying Gateway API CRDs, loading sample resources,
      listing GatewayClasses, Gateways, HTTPRoutes, Services, policies, pods, and CRDs,
      and describing Gateway resources with related routes, backends, and policy
      information.
    - >
      gwctl also has analysis and graphing roles: gwctl analyze can evaluate resource
      definitions before creation, and gwctl get -o graph emits DOT graphs that
      visualize relationships among Gateway API resources.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Use kubectl alongside gwctl for general Kubernetes administration and
      kubeconfig-oriented cluster access, reserving gwctl for Gateway API relationships,
      policy analysis, and specialized descriptions.
    rel: adjacent_workflow
    sources:
      - https://github.com/kubernetes-sigs/gwctl#readme
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:graphviz
    reason: >
      Pipe gwctl's documented DOT graph output into Graphviz when Gateway API resource
      relationships need to be rendered as an image or document.
    rel: adjacent_workflow
    sources:
      - https://github.com/kubernetes-sigs/gwctl#readme
      - https://graphviz.org/documentation/
