    - source_facts.package-manager
  summary:
    - >
      Scratch is a block-based programming environment and online creative community
      designed primarily to help young people create interactive stories, games, and
      animations.
  timeline:
    - '2007: Scratch and its online community were publicly launched.'
    - '2013: Scratch 2.0 was launched.'
    - '2014: The Scratch Foundation was formed.'
    - '2016: The online community reached 10 million members.'
    - >
      2019: Scratch 3.0 launched, and the Scratch Team moved toward an independent
      organization.
  usage:
    - >
      Learners assemble visual blocks to control sprites, sounds, events, variables,
      animation, and interaction, then run, save, remix, or share the resulting
      projects.
    - >
      The downloadable application supports creating and saving projects offline; an
      account is needed for online sharing, commenting, and other community features.
