history:
  adoption-history:
    - >
      Scratch grew from an MIT Media Lab project into a global programming community
      used by children, educators, families, and informal learning organizations. The
      Scratch Foundation's official history records major community and organizational
      milestones.
    - >
      The downloadable desktop application supports offline creation, making Scratch
      usable where continuous internet access is unavailable.
      source_facts.package-manager records its distribution as a Homebrew Cask on macOS.
  package-nerd-significance:
    - >
      Scratch is a landmark visual-programming environment whose block-based editor made
      programming concepts approachable without requiring beginners to master textual
      syntax first.
    - >
      The desktop package is also an instructive modern application stack: the official
      repository describes Scratch 3 as a self-contained desktop application, while the
      wider project is split into reusable editor, virtual-machine, blocks,
      localization, and web components.
  project-history:
    - >
      Scratch publicly launched in 2007 at the MIT Media Lab with both a programming
      language and an online community. Scratch 2.0 followed in 2013, and the Scratch
      Foundation was formed in 2014 to support the project's long-term development.
    - >
      Scratch 3.0 launched in 2019 with a redesigned editor, an extension library,
      broader device support, and a corresponding self-contained desktop application.
      The Scratch Team subsequently became an independent organization.
  related-projects:
