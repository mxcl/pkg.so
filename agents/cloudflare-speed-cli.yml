  summary:
    - >
      cloudflare-speed-cli is a Rust command-line network speed test client that uses
      Cloudflare's speed test service and can run as a TUI or script-friendly text/JSON
      command.
  timeline:
    - '2026: GitHub releases list v1.0.6 as the latest visible release.'
