id: brew:googleworkspace-cli
display-name: Google Workspace CLI
repo: null
docs:
  - https://developers.google.com/workspace
  - https://github.com/googleworkspace/cli#readme
config-file-location: null
credentials-file-location:
  unix:
    - ~/.config/gws/client_secret.json
    - ~/.config/gws/credentials.json
    - $GOOGLE_WORKSPACE_CLI_CREDENTIALS_FILE
history:
  adoption-history:
    - >
      Because the project is young, its adoption history is mainly packaging and
      workflow positioning rather than a long ecosystem record. The official README
      documents Homebrew installation, npm installation, a Nix flake, Gemini CLI
      extension setup, and Skills installation from the repository.
  package-nerd-significance:
    - >
      For package nerds, gws is interesting because it packages a broad API family as a
      generated CLI rather than hand-written subcommands. It also reflects a 2026-era
      packaging pattern: one binary, npm bootstrap, Homebrew formula, Nix flake,
      structured JSON output, and agent skill bundles.
  project-history:
    - >
      The GitHub repository was created in March 2026 and began with rapid 0.x releases.
      The README explicitly says the project is not an officially supported Google
      product while placing it in the Google Workspace developer ecosystem.
    - >
      The tool is written for both human CLI users and AI-agent workflows. Its
      installation paths include prebuilt GitHub release binaries, npm distribution as
      `@googleworkspace/cli`, source builds with Cargo, Nix, and Homebrew.
  related-projects:
    - >
      The README relates gws to Google Workspace APIs, Google's Discovery Service,
      Google Cloud OAuth setup, the gcloud CLI, Gemini CLI extensions, and
      repository-provided agent skills.
  sources:
    - https://api.github.com/repos/googleworkspace/cli
    - https://developers.google.com/workspace
    - https://github.com/googleworkspace/cli
    - https://github.com/googleworkspace/cli#readme
    - https://github.com/googleworkspace/cli/releases
  summary:
    - >
      Google Workspace CLI, invoked as `gws`, is a command-line tool for Google
      Workspace APIs such as Drive, Gmail, Calendar, Sheets, Docs, Chat, and Admin. Its
      README describes a dynamic command surface built from Google's Discovery Service,
      structured JSON output, and included agent skills.
  timeline:
    - '2026: GitHub repository created under googleworkspace/cli.'
    - '2026: 0.1.2 published on GitHub Releases in March.'
    - '2026: 0.22.5 published on GitHub Releases in March after a rapid 0.x release series.'
    - '2026: Homebrew formula and npm installation documented in the README.'
  usage:
    - >
      Typical use starts with `gws auth setup` or `gws auth login`, then commands such
      as listing Drive files, creating Sheets resources, sending Chat messages, or
      inspecting generated schemas. The README documents OAuth credential files,
      exported credentials for headless use, pre-obtained access tokens, and
      environment-variable precedence.
related-packages:
  - id: brew:gemini-cli
    reason: >
      Install the official gws extension in Gemini CLI when you want an AI terminal
      agent to invoke Google Workspace commands and the bundled Workspace skills using
      gws authentication.
    rel: adjacent_workflow
    sources:
      - https://github.com/googleworkspace/cli#gemini-cli-extension
      - https://github.com/google-gemini/gemini-cli
