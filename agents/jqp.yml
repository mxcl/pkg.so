id: brew:jqp
display-name: jqp
repo: null
docs:
  - https://github.com/noahgorstein/jqp#readme
config-file-location:
  unix:
    - ~/.jqp.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      jqp moved quickly into package-manager channels after its first releases. The
      README lists Homebrew, MacPorts, Arch AUR, Snap, GitHub release binaries, and
      source builds. The v0.2.0 release notes included MacPorts documentation, clipboard
      support, and reverse section cycling; later releases added configuration, themes,
      cancellation of long-running queries, and input-panel toggling.
  package-nerd-significance:
    - >
      jqp matters in the jq ecosystem because it packages an exploratory workflow rather
      than another query language. It reflects the Charmbracelet-era wave of polished Go
      TUIs that made terminal tools feel closer to small interactive applications.
  project-history:
    - >
      The project published v0.1.0 on 2022-09-19. Its README says it uses itchyny's Go
      implementation of jq, gojq, and its UI stack is built with Bubble Tea, Bubbles,
      Lip Gloss, Chroma, and clipboard support.
  related-projects:
    - >
      jqp is directly tied to jq and gojq, and the README credits jqq as inspiration.
      Its TUI dependencies connect it to the Bubble Tea, Bubbles, Lip Gloss, and Chroma
      terminal UI ecosystem.
  sources:
    - https://github.com/itchyny/gojq
    - https://github.com/jcsalterego/jqq
    - https://github.com/noahgorstein/jqp
    - https://github.com/noahgorstein/jqp/releases/tag/v0.1.0
    - https://github.com/noahgorstein/jqp/releases/tag/v0.2.0
    - https://github.com/noahgorstein/jqp/releases/tag/v0.3.0
    - https://github.com/noahgorstein/jqp/releases/tag/v0.4.0
    - https://github.com/noahgorstein/jqp/releases/tag/v0.8.0
  summary:
    - >
      jqp is a terminal user interface for experimenting with jq filters against JSON
      and NDJSON input. It wraps jq exploration in an interactive Go TUI rather than
      asking users to iterate only through shell history.
  timeline:
    - '2022: v0.1.0 release on 2022-09-19.'
    - >
      2022: v0.3.0 release on 2022-10-02 added configuration, many themes, and query
      cancellation.
    - '2023: v0.4.0 release on 2023-01-07 added command history and Chroma style overrides.'
    - '2025: v0.8.0 release on 2025-09-28 added a Ctrl-t input-panel toggle.'
  usage:
    - >
      Users can pipe JSON into jqp, pass a jq query argument, or load JSON from a file.
      Inside the TUI, keybindings cycle between query, input, and output panes, run
      filters, copy queries, save output, hide the input panel, and manage query
      history.
related-packages:
  - id: brew:jq
    reason: >
      jqp provides an interactive playground for developing jq filters, which can then
      be reused directly with jq in scripts and pipelines.
    rel: adjacent_workflow
    sources:
      - https://github.com/noahgorstein/jqp
      - https://jqlang.org/manual/
  - id: brew:gojq
    reason: >
      jqp executes jq-compatible queries through gojq, making gojq the relevant
      standalone runtime when the same Go implementation is wanted without the TUI.
    rel: adjacent_workflow
    sources:
      - https://github.com/noahgorstein/jqp
      - https://github.com/itchyny/gojq
