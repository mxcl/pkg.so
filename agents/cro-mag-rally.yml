history:
  adoption-history:
    - >
      The original game was a Mac exclusive and was bundled with Macs of its era, giving
      it a recognizable place in classic Macintosh gaming. Updates later added Carbon
      and early Mac OS X compatibility, with the last PowerPC-era update appearing in
      2006.
    - >
      Jorio's authorized source port restored convenient access on current macOS,
      Windows, and Linux systems. It also expanded local split-screen play from two to
      four players and adapted the interface to modern widescreen displays.
  package-nerd-significance:
    - >
      Cro-Mag Rally is representative of community-maintained source ports that preserve
      commercial-era Macintosh games after their original binaries and APIs become
      impractical to run.
    - >
      The Homebrew cask makes the authorized modern port installable like contemporary
      Mac software, while the public repository retains build instructions, a detailed
      cross-era changelog, and licensing terms.
  project-history:
    - >
      Pangea Software released Cro-Mag Rally for Mac in 2000. The game follows the
      caveman Brog through races spanning the Stone, Bronze, and Iron Ages, with weapons
      and multiple local multiplayer modes.
    - >
      The original line received Carbon and Mac OS X compatibility work during the early
      2000s. Jorio later created a modern source port from the original OS 9 version
      with Pangea Software's permission.
    - >
      The modern port aims to preserve the original experience while fixing obstructive
      bugs and adding restrained enhancements such as widescreen presentation,
      four-player split-screen, race timers, and scoreboards.
  related-projects:
    - Bugdom
    - Nanosaur
    - Mighty Mike
    - Otto Matic
    - Pangea Software source ports
  sources:
    - https://github.com/jorio/CroMagRally#readme
    - https://github.com/jorio/CroMagRally/blob/master/CHANGELOG.md
    - https://github.com/jorio/CroMagRally/releases
  summary:
    - >
      Cro-Mag Rally is a prehistoric-themed 3D racing and combat game originally
      released by Pangea Software for Mac. This package distributes Jorio's authorized
      modern source port.
  timeline:
    - '2000: Pangea Software released Cro-Mag Rally as a Mac-exclusive game.'
    - '2001: The 2.0 beta line added Carbon and Mac OS X support.'
    - '2006: Version 2.2.1 became the last PowerPC Mac release.'
    - '2022-06-27: Version 3.0.0 was the first playable release of the modern source port.'
    - >
      2024-02-07: Version 3.0.1 added localization, input, Retina, Game Mode, Wayland,
      and platform fixes.
  usage:
    - >
      Players race through prehistoric-themed courses in single-player modes or use
      local split-screen multiplayer for racing, Tag, Capture the Flag, and Survival.
    - >
      The modern port supports macOS, Windows, and Linux and adds contemporary display
      and controller conveniences while retaining the original game's data and design.
    - >
      Network play from the original NetSprockets implementation has not been restored
      in the modern port.
