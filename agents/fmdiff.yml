config-file-location:
  unix:
    - ~/.subversion/config
    - ~/.hgrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Official evidence points to a niche, Mac-specific developer utility rather than a
      broad platform project. Its adoption surface is package-manager installation plus
      direct Makefile installation into `/usr/local/bin` for users who want FileMerge in
      Subversion or Mercurial.
  package-nerd-significance:
    - >
      fmdiff is package-nerd significant as the kind of glue utility Homebrew preserves
      well: a small script set that normalizes a GUI developer tool into classic Unix
      command contracts. It also reflects an era when Mac developers frequently bridged
      Xcode tools with Subversion and Mercurial command-line workflows.
  project-history:
    - >
      The official repository was created in 2015 and the README describes the
      motivation: FileMerge ships with Apple's developer tools and is useful
      interactively, but its `opendiff` command does not match the blocking argument
      conventions expected by tools such as Subversion. The scripts adapt FileMerge to
      those command-line interfaces.
  related-projects:
    - >
      Related official concepts and tools include Apple's FileMerge and `opendiff`,
      Subversion, Mercurial, `diff`, `diff3`, and the sibling fmscripts commands
      `fmdiff3`, `fmresolve`, `fmmerge`, and `filemerge`.
  sources:
    - https://api.github.com/repos/brunodefraine/fmscripts
    - https://github.com/brunodefraine/fmscripts
    - https://raw.githubusercontent.com/brunodefraine/fmscripts/master/README.md
  summary:
    - >
      fmdiff is part of the fmscripts collection, a small set of Bash wrapper scripts
      that make Apple's FileMerge usable as a command-line diff and merge tool for
      Subversion and Mercurial workflows on macOS.
  timeline:
    - '2015: The fmscripts repository was created.'
    - >
      2015: The repository README documented FileMerge wrappers for Subversion and
      experimental Mercurial support.
  usage:
    - >
      The README documents `fmdiff` as a `diff`-like command for `svn diff --diff-cmd`,
      `fmdiff3` as a `diff3`-like command for update and merge operations, `fmresolve`
      for resolving existing Subversion conflicts, and `fmmerge` as an external merge
      tool.
related-packages:
  - id: brew:subversion
    reason: >
      Subversion can invoke fmdiff and fmdiff3 directly through its external diff
      options or `~/.subversion/config`, making it fmdiff's primary documented workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/brunodefraine/fmscripts
      - https://subversion.apache.org/docs
  - id: brew:mercurial
    reason: >
      Mercurial can register fmdiff through its extdiff extension and fmmerge through
      merge-tool settings in `~/.hgrc`.
    rel: adjacent_workflow
    sources:
      - https://github.com/brunodefraine/fmscripts
      - https://www.mercurial-scm.org/help/topics/config.html
