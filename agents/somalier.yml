history:
  adoption-history:
    - >
      The project is distributed from its official releases as a static binary and
      container image and is also available through Bioconda and Homebrew, making it
      straightforward to place in reproducible sequencing pipelines.
  package-nerd-significance:
    - >
      Somalier turns a small set of informative sites into compact per-sample digest
      files. New samples can be extracted independently and compared with an existing
      cohort without reprocessing every source alignment, which is valuable in
      incremental and automated sequencing pipelines.
    - >
      Its focused executable, permissive license, static releases, container image, and
      package-manager availability make it a convenient Unix pipeline component for an
      otherwise expensive class of cohort QC checks.
  project-history:
    - >
      Brent Pedersen created Somalier for rapid sample-swap detection and relatedness
      checking directly from BAM, CRAM, VCF, and GVCF data. The repository credits
      discussions with Preeti Aahir and feedback from early users as motivation.
    - >
      The command set expanded beyond extraction and pairwise relatedness to include
      ancestry prediction, allele-balance visualization, contamination estimation,
      site-set generation, and pedigree inference.
  related-projects:
    - >
      Peddy and other pedigree/relatedness QC tools referenced by the project's official
      README.
    - HTSlib-based BAM, CRAM, VCF, and BCF workflows.
    - >
      Bioconda and the project's official container image, which provide alternative
      installation routes.
  sources:
    - https://github.com/brentp/somalier
    - https://github.com/brentp/somalier#readme
    - https://github.com/brentp/somalier/releases
  summary:
    - >
      Somalier is an open-source genomics quality-control tool for rapidly detecting
      sample swaps, measuring relatedness and concordance, predicting ancestry, and
      checking contamination from sequencing or variant-call data.
  timeline:
    - >
      Project evolution: The original extract-and-relate workflow was extended with
      ancestry, pedigree inference, allele-balance plotting, contamination checks, and
      site-set generation.
  usage:
    - >
      A common workflow runs `somalier extract` against selected polymorphic sites for
      each BAM, CRAM, VCF, or GVCF, then runs `somalier relate` over the resulting
      `.somalier` files. The relate step produces tabular and interactive HTML QC
      output.
    - >
      Expected pedigrees or tumor-normal groups can be supplied to expose sample swaps
      and relationship discrepancies. Separate commands cover ancestry prediction,
      contamination estimation, allele-balance plots, and creation of custom site sets.
