history:
  adoption-history:
    - >
      uTools developed an ecosystem around installable plugin applications. Its official
      site presents the plugin market as a central part of the product, while its
      developer documentation explains how third parties create applications using web
      technologies and platform APIs.
  package-nerd-significance:
    - >
      uTools is notable as a packageable desktop launcher that acts as another
      application-distribution layer: users install one host application and extend it
      with task-specific plugins. Its developer model combines an Electron-style preload
      environment, a manifest, and ordinary HTML, CSS, and JavaScript.
  project-history:
    - >
      uTools is developed by Fuzhou Yuanli Information Technology Co., Ltd. as an
      extensible desktop productivity platform. The official product surface combines
      global keyboard invocation, file and clipboard tools, automation, AI features, and
      a plugin application marketplace.
    - >
      The platform's official developer documentation defines plugin.json as the
      required plugin manifest and documents APIs through which plugins interact with
      windows, input, the clipboard, local storage, and native Node.js capabilities.
  related-projects:
    - >
      uTools occupies the same broad launcher-and-extension category as Raycast and Wox.
      Its distinguishing characteristic is a plugin ecosystem documented primarily for
      Chinese-speaking desktop users, together with built-in automation and AI-agent
      integration.
  sources:
    - https://www.u-tools.cn/
    - https://www.u-tools.cn/docs/
    - https://www.u-tools.cn/docs/developer/docs.html
    - https://www.u-tools.cn/docs/developer/information/file-structure.html
    - https://www.u-tools.cn/docs/developer/information/plugin-json.html
  summary:
    - >
      uTools is a desktop productivity platform and application launcher built around a
      searchable collection of built-in tools and installable plugin applications.
  timeline:
    - >
      The official product site identifies Fuzhou Yuanli Information Technology Co.,
      Ltd. as the company behind uTools.
    - >
      The platform subsequently expanded its documented scope to include user-created
      plugin applications, automation, AI-created applications, and AI-agent
      connectivity.
  usage:
    - >
      Users invoke uTools globally, search for a task or plugin, and operate utilities
      such as clipboard management, file search, text processing, image tools, and
      automation without navigating among separate applications.
    - >
      Plugin developers package a plugin.json manifest with HTML, CSS, JavaScript, and
      optional preload code. That plugin manifest is a development artifact rather than
      a documented configuration file for the installed uTools desktop application.
related-packages:
  - id: cask:raycast
    reason: >
      Choose Raycast for a keyboard-first extensible launcher with a large extension
      store and documented macOS and Windows support; uTools emphasizes its own plugin
      marketplace, automation, and AI-agent connectivity.
    rel: alternative
    sources:
      - https://www.u-tools.cn/
      - https://www.raycast.com/
      - https://www.raycast.com/store
  - id: cask:wox
    reason: >
      Choose Wox when you want an open-source cross-platform launcher, while uTools
      provides a commercially maintained platform with its own documented plugin runtime
      and marketplace.
    rel: alternative
    sources:
      - https://www.u-tools.cn/
      - https://github.com/Wox-launcher/Wox
