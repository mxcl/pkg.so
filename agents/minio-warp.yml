history:
  project-history:
    - >
      The tool's role is practical rather than architectural. Storage teams use it to
      generate repeatable PUT, GET, LIST, STAT, DELETE, multipart, mixed-workload, and
      distributed-client load against MinIO, Amazon S3, Google Cloud Storage's S3
      compatibility mode, Azure Blob Storage's S3 compatibility mode, and other S3 API
      implementations. Its documentation emphasizes throughput, latency, capacity
      planning, and application-fit testing; Intel's MinIO benchmark guide used Warp
      clients and servers as the S3 load generator for cluster testing.
  sources:
    - https://docs.min.io/warp/
    - https://docs.min.io/warp/administration/benchmarks/common-tests/
    - https://docs.min.io/warp/administration/distributed-benchmarking/
    - https://docs.min.io/warp/reference/
    - https://formulae.brew.sh/formula/minio-warp
    - https://github.com/minio/warp
    - >
      https://www.intel.com/content/www/us/en/developer/articles/technical/minio-cluster-benchmark-methods-and-tools.html
  summary:
    - >
      MinIO Warp is MinIO's companion benchmark program for S3-compatible object
      storage. It grew out of the same ecosystem as the MinIO object server: a Go
      command-line tool distributed as `warp`, released under AGPL-3.0-or-later, and
      packaged by Homebrew as `minio-warp` rather than plain `warp` to avoid confusion
      with unrelated Warp products.
  usage:
    - >
      Warp occupies the package-manager niche of a focused object-storage performance
      probe. It sits next to broader load-testing tools and older S3 benchmark scripts,
      but its MinIO-maintained defaults, S3 operation coverage, CSV output, YAML-driven
      runs, and distributed benchmarking mode make it a small operational utility for
      validating object-store behavior before or after deployment.
related-packages:
  - id: brew:minio
    reason: >
      Use Warp against a MinIO Server endpoint to establish performance baselines, plan
      capacity, and validate changes with S3-aware workloads.
    rel: adjacent_workflow
    sources:
      - https://docs.min.io/warp/
      - https://github.com/minio/minio#readme
