id: brew:cbindgen
display-name: cbindgen
repo: null
docs:
  - https://docs.rs/cbindgen
  - https://github.com/mozilla/cbindgen/blob/main/docs.md
  - https://github.com/mozilla/cbindgen#readme
config-file-location:
  unix:
    - cbindgen.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README lists production users and examples including WebRender, Stylo,
      maturin, tquic, and metatensor. The supplied package facts show broad packaging
      across Homebrew, Debian, Ubuntu, Fedora, Arch, Alpine, and MacPorts.
  package-nerd-significance:
    - >
      cbindgen sits at a practical packaging boundary: it lets Rust libraries ship
      C-family headers generated from the Rust source of truth. That makes it important
      for distributions carrying mixed Rust/C/C++ stacks, especially projects that
      expose stable FFI surfaces.
  project-history:
    - >
      The public Mozilla repository was created in 2017. The official user guide says
      cbindgen developed largely ad hoc as maintainers added features for their own use
      cases, with attention to matching Rust's actual layout and ABI guarantees.
  related-projects:
    - >
      The README points to production or ecosystem users including WebRender, Stylo,
      maturin, tquic, and metatensor, and the API documentation is published on docs.rs.
  sources:
    - https://api.github.com/repos/mozilla/cbindgen
    - https://github.com/mozilla/cbindgen
    - https://docs.rs/cbindgen
    - https://github.com/mozilla/cbindgen/blob/main/docs.md
    - https://github.com/mozilla/cbindgen#readme
    - https://formulae.brew.sh/api/formula/cbindgen.json
  summary:
    - >
      cbindgen is a Mozilla-hosted Rust developer tool that generates C, C++11, and
      Cython headers for Rust crates exposing a public C API.
  timeline:
    - '2017: Public GitHub repository created under Mozilla.'
    - '2025: 0.28.0 and 0.29.0 releases published on GitHub.'
    - '2026: 0.29.4 release published on GitHub.'
  usage:
    - >
      cbindgen can be run as a standalone CLI or called from a Rust `build.rs`. The
      quick start requires a Rust crate with a public C API and a `cbindgen.toml`
      configuration, then emits headers with commands such as `cbindgen --config
      cbindgen.toml --crate my_rust_library --output my_header.h`.
related-packages:
  - id: brew:bindgen
    reason: >
      Use bindgen for the complementary FFI direction—generating Rust declarations from
      C or C++ headers—while cbindgen generates C-family headers from Rust APIs.
    rel: adjacent_workflow
    sources:
      - https://rust-lang.github.io/rust-bindgen/
      - https://github.com/mozilla/cbindgen
