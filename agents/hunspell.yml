history:
  adoption-history:
    - >
      Hunspell became infrastructure rather than just a standalone command. The official
      site says it is used by LibreOffice, OpenOffice.org, Mozilla Firefox and
      Thunderbird, Google Chrome, macOS, InDesign, memoQ, Opera, SDL Trados, Linux
      distributions, and other tools. The batch metadata also shows broad
      package-manager coverage across Homebrew, Debian, Ubuntu, Fedora, Arch, openSUSE,
      MacPorts, Nix, Alpine, winget, and related ecosystems.
  package-nerd-significance:
    - >
      For package nerds, Hunspell is a deep dependency hiding in plain sight: a
      spell-checking engine packaged as both CLI and library, with dictionaries often
      shipped separately and consumed by office suites, browsers, editors, NLP tools,
      and operating systems. It is also a reminder that language support packages often
      matter as much as the executable package itself.
  project-history:
    - >
      Hunspell's code base descends from OpenOffice.org's MySpell library by Kevin
      Hendricks, which the Hunspell README describes as a C++ reimplementation of Geoff
      Kuenning's International Ispell spell checking and affixation work. László Németh
      developed Hunspell's main library and command-line features, extending the MySpell
      lineage with richer morphology, compounding, affix handling, suggestion logic, and
      language-specific behavior.
    - >
      The official site records project sponsorship history, including Budapest
      Technical University Media Research Centre support in 2003-2005 and FSF.hu
      Foundation sponsorship, and the AUTHORS file names László Németh as author, Kevin
      Hendricks as MySpell author, and Caolán McNamara as maintainer and distinguished
      contributor.
  related-projects:
    - >
      Related projects include MySpell, International Ispell, OpenOffice.org,
      LibreOffice, Firefox, Thunderbird, Chrome, macOS spelling services, Enchant,
      Weblate translations, and Hunspell/MySpell dictionary repositories.
  sources:
    - >
      Official Hunspell site, repository README, AUTHORS, NEWS, GitHub repository and
      release metadata, and Homebrew package metadata supplied in the batch input.
  summary:
    - >
      Hunspell is a spell checker, morphological analyzer, library, and command-line
      tool. Its official materials describe support for Unicode, compounding, complex
      morphology, stemming, morphological generation, custom dictionaries, an
      Ispell-like terminal interface, pipe mode, and C/C++ APIs.
  timeline:
    - '2003-2005: Official site records BME MOKK sponsorship of Hunspell development.'
    - '2015: hunspell/hunspell GitHub repository created.'
    - '2016: v1.4.0 release published in GitHub Releases metadata.'
    - >
      2018: v1.7.0 release published with suggestion, SPELLML, morphology, and
      compounding improvements.
    - >
      2026: v1.7.3 release notes record security, fuzzing, Unicode, build, and
      correctness fixes.
  usage:
    - >
      Command-line users run `hunspell` interactively, in pipe mode, or against files
      with dictionaries made of `.aff` and `.dic` files. Developers use libhunspell
      through C/C++ APIs and language bindings, while dictionary maintainers use
      companion tools such as affixcompress, unmunch, wordforms, wordlist2hunspell,
      analyze, and related utilities.
related-packages:
  - id: brew:enchant
    reason: >
      Choose Enchant when an application needs one stable spelling API that can select
      Hunspell, Nuspell, Aspell, or another language-specific backend.
    rel: adjacent_workflow
    sources:
      - https://rrthomas.github.io/enchant/
      - https://hunspell.github.io/
  - id: brew:nuspell
    reason: >
      Choose Nuspell as a modern C++ spelling-engine alternative when
      Hunspell-dictionary compatibility and ICU-backed Unicode handling are important.
    rel: alternative
    sources:
      - https://nuspell.github.io/
      - https://hunspell.github.io/
