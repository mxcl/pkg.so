credentials-file-location: null
history:
  adoption-history:
    - >
      dug's adoption appears narrow but real: its README documents Homebrew installation
      for macOS and Linux, AUR availability, Docker images, and platform binaries. The
      Homebrew formula keeps it visible to users who want a DNS propagation checker
      without manually downloading .NET binaries.
  package-nerd-significance:
    - >
      dug is package-nerd interesting because it packages a web-style DNS propagation
      checker as a local CLI. It also shows a less common Homebrew shape: a .NET
      single-file networking utility with internationalized output and scripted JSON
      modes.
  project-history:
    - >
      The public release history visible on GitHub starts in January 2021. The README
      states that the GitHub repository is a mirror of the primary Unfrl repository and
      marks the project as unmaintained, while still documenting usage, localization,
      packaging, Docker images, and .NET development.
    - >
      The tool's stated goal is to make DNS propagation checks easy, with templated
      output for scripts and monitoring. Release activity continued through 2024, ending
      at least publicly with the 0.0.94 release in October 2024.
  related-projects:
    - >
      dig, drill, and dog are related DNS CLIs, but dug focuses on propagation checks
      across resolvers.
    - >
      Web DNS propagation checkers are the closest product-style comparison; dug brings
      that workflow into the terminal.
  sources:
    - https://github.com/unfrl/dug
    - https://git.unfrl.com/Unfrl/dug
    - https://dug.unfrl.com/docs
    - https://api.github.com/repos/unfrl/dug/releases?per_page=100
    - https://formulae.brew.sh/formula/dug
  summary:
    - >
      dug is a .NET CLI for checking DNS propagation from multiple resolvers and
      presenting the results in pretty or machine-readable formats. It is a niche
      networking tool aimed at the moment after DNS changes, when operators want to see
      how records look around the world.
  timeline:
    - '2021: 0.0.60 release appears in the public GitHub release history.'
    - '2022: 0.0.90 released after many small 0.0.x increments.'
    - '2023: 0.0.92 released.'
    - '2024: 0.0.94 appears in the public GitHub release history.'
  usage:
    - >
      Typical use is running dug against a domain after changing DNS records, optionally
      selecting record type, choosing server counts, or emitting JSON and templated
      fields for scripts. This makes it closer to a propagation dashboard in a terminal
      than to a direct dig replacement.
