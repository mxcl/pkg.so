history:
  adoption-history:
    - >
      lazyssh published v0.1.0 on 2025-08-30 and v0.3.0 on 2025-10-08. GitHub metadata
      reported 3,629 stars by 2025-10-09.
  package-nerd-significance:
    - >
      lazyssh is package-nerd-friendly because it wraps OpenSSH rather than replacing
      it: the user's standard ssh binary and config remain the source of truth while the
      TUI adds navigation and editing.
  project-history:
    - >
      The GitHub repository was created on 2025-08-13. The README describes lazyssh as
      an interactive SSH manager inspired by lazydocker and k9s, built around a user's
      existing `~/.ssh/config` file.
  related-projects:
    - >
      The README names lazydocker and k9s as inspirations and explicitly depends on the
      system OpenSSH binary and OpenSSH config format.
  sources:
    - https://api.github.com/repos/Adembc/lazyssh
    - https://github.com/Adembc/lazyssh
    - https://github.com/Adembc/lazyssh/releases
  summary:
    - >
      lazyssh is a Go terminal UI for browsing, editing, and connecting to hosts defined
      in OpenSSH config.
  timeline:
    - '2025-08-13: GitHub repository created.'
    - '2025-08-30: Release v0.1.0 published.'
    - '2025-10-08: Release v0.3.0 published.'
  usage:
    - >
      The tool reads and displays servers from `~/.ssh/config`, offers fuzzy search,
      one-key SSH connection, tags, port-forwarding fields, proxy settings, key
      autocomplete, and non-destructive config writes with backups.
related-packages:
  - id: brew:openssh
    reason: >
      OpenSSH is lazyssh's documented execution and configuration layer: lazyssh manages
      `~/.ssh/config` and launches the native `ssh` binary supplied by OpenSSH.
    rel: adjacent_workflow
    sources:
      - https://github.com/Adembc/lazyssh
      - https://www.openssh.com/manual.html
