history:
  adoption-history:
    - >
      FilmCraft is distributed as a desktop application for macOS, Windows, and Linux,
      with a headless command-line tool and multiple native package formats. The
      supplied package metadata records its availability as the Homebrew cask
      `filmcraft`.
  package-nerd-significance:
    - >
      FilmCraft is notable as a native, permissively licensed Rust application
      attempting a clean-room reconstruction of a full nonlinear editing workflow. Its
      own codec, timeline, audio, rendering, CLI, control-channel, and packaging layers
      make it an unusually broad desktop package rather than a thin interface over an
      existing media stack.
  project-history:
    - >
      FilmCraft was created by the ArtCraft team as an open-source, clean-room video
      editor written in Rust. Its official materials emphasize a familiar professional
      editing model—source and program monitors, a multitrack timeline, trim modes,
      grading, effects, keyframes, audio mixing, and frame-exact timing—implemented
      without embedding FFmpeg.
  related-projects:
    - >
      FilmCraft belongs to ArtCraft's Crafting Apps family alongside PhotoCraft,
      VectorCraft, LightCraft, PdfCraft, EffectCraft, and DesignCraft. The projects
      share a native-Rust, local-first, open-source, and agent-controllable design
      philosophy.
  sources:
    - 'Official Crafting Apps overview: https://getartcraft.com/apps'
    - 'Official product page: https://getartcraft.com/apps/filmcraft'
    - 'Official releases: https://github.com/storytold/filmcraft/releases'
    - 'Official repository and README: https://github.com/storytold/filmcraft'
    - 'Package provenance: source_facts.package-manager and source_facts.provenance'
  summary:
    - >
      FilmCraft is an open-source nonlinear video editor built in Rust. It combines
      familiar professional editing conventions with native codecs, GPU compositing,
      color grading, effects, keyframes, and audio tooling.
  timeline:
    - '2026-10-02: The official GitHub release history records FilmCraft v0.1.0.'
    - >
      2026-10: Official releases expanded native distribution across macOS, Windows,
      Linux, and FreeBSD, alongside a headless CLI.
  usage:
    - >
      FilmCraft is used for timeline-based video editing, trimming, grading, effects
      work, audio mixing, captioning, and export. It can be operated as a desktop
      editor, built from source with Cargo, or driven headlessly through its CLI and
      automation interfaces.
