  - https://github.com/wlevine/clamz#readme
config-file-location:
  unix:
    - ~/.clamz/config
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager data lists Homebrew, Fedora/DNF, and Ubuntu
      packaging. Debian package metadata also preserves the old Google Code homepage and
      identifies clamz as a command-line program to download MP3s from Amazon.
  package-nerd-significance:
    - >
      Clamz is a useful historical example of package managers carrying a niche
      interoperability tool around a closed consumer service. It mattered less as a
      platform than as a tiny Unix-native bridge between desktop MIME handling,
      libcurl/libgcrypt/libexpat dependencies, and DRM-free MP3 purchases.
  project-history:
    - >
      The archived project README describes Clamz as a substitute for Amazon's official
      MP3 Downloader and states that it can download individual songs or albums
      purchased from Amazon. The upstream release history in the README runs from
      version 0.1 in 2008 through version 0.5 in 2011.
  related-projects:
    - >
      Related items include Amazon MP3 Downloader, AMZ file handlers, distribution
      desktop MIME integration, libcurl, libgcrypt, and libexpat.
  sources:
    - https://code.google.com/archive/p/clamz
    - https://github.com/wlevine/clamz#readme
    - https://raw.githubusercontent.com/wlevine/clamz/master/README
    - https://packages.debian.org/source/bookworm/clamz
  summary:
    - >
      Clamz is a small command-line downloader for Amazon MP3 purchases. Its
      package-nerd appeal comes from being a free-software replacement for a proprietary
      store downloader, packaged by distributions so Unix users could handle Amazon .amz
      files with normal CLI and desktop integration.
  timeline:
    - '2008: Version 0.1 first release.'
    - '2008: Version 0.2 fixed AMZ parsing and added raw XML dumping.'
    - '2010: Version 0.3 added MIME and desktop files for browser launch integration.'
    - >
      2010: Version 0.4 improved UK-store behavior, logging, and desktop music directory
      defaults.
    - '2011: Version 0.5 added support for unencrypted AMZ files used by Amazon Cloud Player.'
  usage:
    - >
      Users saved an Amazon AMZ file and ran clamz on it; by default it downloaded
      linked MP3 files into the current directory. The README documents ~/.clamz/config
      for output control, ~/.clamz/amzfiles for saved AMZ copies, and ~/.clamz/logs for
      server interaction logs.
