history:
  adoption-history:
    - >
      JiBA is distributed for macOS through a direct disk image and a Homebrew cask.
      Changes made in Music.app can propagate to other devices through iCloud Music
      Library.
    - >
      Traditional Mode uses local matching and requires no cloud activation. Enhanced
      Mode adds a cloud-backed matching path and is activated through the project's
      donation flow.
  package-nerd-significance:
    - >
      JiBA addresses a metadata-control problem created by streaming storefront
      localization: collectors may prefer the original Japanese, Chinese, or Korean
      scripts instead of romanized or translated titles. Its automation, review
      thresholds, rollback snapshots, and repair tools make bulk library mutation more
      manageable.
  project-history:
    - >
      JiBA, whose name expands to “Japanese is Back Again,” was created to restore
      original-language metadata in Apple Music libraries. The first documented 1.0
      release in February 2026 focused on Japanese, with Chinese and Korean support
      initially under test.
    - >
      During 2026 the project rapidly expanded its language-detection and matching
      pipelines, suspicious-change review, repair and rollback workflows, scheduled
      processing, drag-and-drop operation, change history, and documentation.
  related-projects:
    - Apple Music and Music.app are the library and synchronization surfaces JiBA modifies.
    - JiBA can use CLD3, fastlangid, or langdetect for ambiguous language detection.
  sources:
    - https://jiba.hee.ink/en/
    - https://jiba.hee.ink/en/docs/
  summary:
    - >
      JiBA is a macOS utility that repairs localized Apple Music metadata, restoring
      original-script titles and related fields for Japanese, Chinese, Korean, and other
      configured storefront languages.
  timeline:
    - >
      2026-02-08: Version 1.0.0 RC1 documented full Japanese support and experimental
      Chinese and Korean support.
    - >
      2026-03-26: Version 1.4.0 introduced a new language-decision pipeline and more
      complete rollback and repair support.
    - '2026-04-10: Version 1.4.3 added new-track automation and drag-and-drop processing.'
    - '2026-07-24: Version 1.5.0 added change history, undo, and a refactored matching engine.'
  usage:
    - >
      Users grant JiBA permission to control Music.app, select target languages and a
      processing mode, and run it over selected tracks or the entire library. Auto Write
      is the recommended default, while riskier candidates can be diverted to manual
      review.
    - >
      Scheduled runs can monitor newly added music. Repair tools scan damaged metadata,
      restore saved originals, regroup split compilations, and address stale Music.app
      or web-player presentation.
