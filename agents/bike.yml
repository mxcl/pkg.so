history:
  adoption-history:
    - >
      Bike was introduced into the established Mac outliner niche as a native,
      performance-focused writing application. The official site positions it for both
      large projects and lightweight notes, emphasizing standard file formats and
      integration with existing Mac workflows.
    - >
      Early releases rapidly added AppleScript, rich text, deep links, navigation, and
      Apple Shortcuts actions. Distribution through the developer, Mac App Store, and
      Setapp broadened its availability while its renewable-license model allowed
      purchased versions to remain usable indefinitely.
  package-nerd-significance:
    - >
      Bike is interesting to package enthusiasts because it combines a polished native
      Mac interface with inspectable and interoperable document formats. Its principal
      .bike format is HTML, and it also supports OPML and plain text, reducing
      dependence on a proprietary database.
    - >
      Its deep-link scheme, AppleScript dictionary, Shortcuts actions, Quick Look
      integration, and focus on large-document performance make it useful as an
      automation-friendly desktop component rather than only a standalone notes
      application.
  project-history:
    - >
      Hog Bay Software released Bike 1.0 in May 2022 after a preview period. It was
      designed as a fast, structured writing application that combines the freedom of a
      text editor with the hierarchy and navigation of an outliner.
    - >
      The 1.x series progressively added rich-text formatting, durable links into
      outlines, AppleScript and Shortcuts automation, navigation history and
      breadcrumbs, row types, printing, Quick Look previews, and continued macOS
      compatibility work.
  related-projects:
    - >
      Bike belongs to the Mac outliner tradition and uses OPML for interchange with
      other outlining applications.
    - Its .bike format is HTML, allowing documents to be inspected in a web browser.
    - >
      AppleScript and Apple Shortcuts provide its principal automation relationships
      with other macOS applications.
  sources:
    - 'Official product page: https://www.hogbaysoftware.com/bike/'
    - 'Official release notes: https://www.hogbaysoftware.com/bike/releases/'
    - 'Official user guide: https://bikeguide.hogbaysoftware.com/'
  summary:
    - >
      Bike Outliner is a native macOS application for structured writing, outlining,
      lists, notes, and long-form organization. It emphasizes responsiveness, fluid
      navigation, open document formats, deep links, and Mac-native automation.
  timeline:
    - '2022: Preview builds added AppleScript support ahead of the general release.'
    - '2022: Bike 1.0 was released on May 15.'
    - '2022: Version 1.4 added rich-text formatting.'
    - '2023: Version 1.11 added Apple Shortcuts actions.'
    - >
      2023: Version 1.12 added navigation history, breadcrumbs, and inline navigation
      controls.
    - '2024: Version 1.20 raised the minimum requirement to macOS 12.'
    - '2025: Version 1.22 refined document and window behavior and file-attribute handling.'
  usage:
    - >
      Bike is used to think, write, take notes, create lists, and organize large
      projects as nested rows. Users can focus on individual headings, fold branches,
      navigate with breadcrumbs and history, create task and ordered-list rows, and link
      directly to durable locations inside outlines.
    - >
      Documents can be stored as HTML-based .bike files, OPML, or plain text.
      AppleScript, Shortcuts, and the bike URL scheme allow other Mac applications and
      automated workflows to create, find, edit, open, or navigate outline content.
