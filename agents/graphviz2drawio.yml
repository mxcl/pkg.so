id: brew:graphviz2drawio
display-name: graphviz2drawio
repo: https://github.com/hbmartin/graphviz2drawio
docs:
  - https://github.com/hbmartin/graphviz2drawio#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is niche but useful: it appears in PyPI, conda-forge, and Homebrew
      packaging because teams often generate dependency graphs or architecture sketches
      with Graphviz but need an editable diagram for review, documentation, or handoff.
    - >
      The package is most relevant when Graphviz is already in a workflow and the final
      artifact must be modified in diagrams.net or Lucidchart instead of treated as a
      static SVG or PNG.
  package-nerd-significance:
    - >
      Package maintainers care about graphviz2drawio because it bridges generated and
      manually editable diagram ecosystems without replacing Graphviz. It is a small CLI
      where packaging metadata, Python version support, and the Graphviz dependency
      determine whether it feels frictionless.
    - >
      Its Homebrew formula is notable for a Python tool that is also useful to
      non-Python diagramming workflows.
  project-history:
    - >
      The project began as a Python command-line utility around 2018, with the PyPI
      release history listing 0.0.1 on August 19, 2018 and the GitHub README describing
      the goal as conversion from Graphviz DOT into editable draw.io and Lucid formats.
    - >
      Its 2024 release series added visible conversion improvements: edge layout work,
      clusters and subgraphs, image nodes, Graphviz shapes, stdout support, Homebrew
      installation, and then a 1.0.0 release. The 1.1.0 release in 2025 added stronger
      cluster/subgraph handling, cloud architecture diagram support, encoding handling,
      and Python 3.14 compatibility.
  related-projects:
    - >
      Graphviz: graphviz2drawio consumes Graphviz DOT input and depends on Graphviz
      concepts and layout output.
    - >
      draw.io / diagrams.net and Lucidchart: the editable diagram targets named by the
      project.
    - 'PyGraphviz: the PyPI documentation lists PyGraphviz as part of the conversion stack.'
  sources:
    - https://github.com/hbmartin/graphviz2drawio
    - https://github.com/hbmartin/graphviz2drawio/releases
    - https://pypi.org/project/graphviz2drawio/
  summary:
    - >
      graphviz2drawio is a focused converter for turning Graphviz DOT files into
      draw.io, diagrams.net, Lucidchart, or mxGraph-style editable diagrams. It sits in
      the practical space between generated diagrams and manual editing.
  timeline:
    - '2018: PyPI records the 0.0.1 release.'
    - '2020: PyPI records the 0.2.0 release after the first 2018 series.'
    - '2024: 0.3.0 through 1.0.0 releases expand conversion support and packaging.'
    - >
      2025: 1.1.0 adds cluster/subgraph improvements, Diagrams package support, encoding
      handling, and Python 3.14 compatibility.
  usage:
    - >
      The README and PyPI page document CLI usage that passes one or more DOT files and
      writes XML output, with options for output paths and stdout. The package can also
      be used as a Python library via its conversion function.
    - >
      Because Graphviz layout is upstream of the conversion, graphviz2drawio users
      typically install Graphviz itself first, then run the converter on DOT or
      PyGraphviz graph objects.
related-packages:
  - id: brew:graphviz
    reason: >
      Graphviz is the required upstream layout system: graphviz2drawio consumes DOT and
      uses Graphviz executables and native libraries before producing editable XML.
    rel: adjacent_workflow
    sources:
      - https://github.com/hbmartin/graphviz2drawio#readme
      - https://graphviz.org/documentation/
