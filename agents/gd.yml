history:
  adoption-history:
    - >
      GD spread through language bindings and web stacks: the official pages name Perl,
      PHP, Ruby, and other wrappers, and describe web development as its most common
      application area. Its package-manager life is tied to optional image-format
      libraries such as libpng, libjpeg, libwebp, libavif, libheif, libtiff, libXpm,
      FreeType, Fontconfig, libraqm, and libimagequant.
  package-nerd-significance:
    - >
      GD is a classic dependency package: small at the API surface, but connected to a
      wide graph of image codecs, language bindings, build systems, and security
      updates. Its history explains why many Unix package sets carry both libgd itself
      and a cluster of optional image/font libraries.
  project-history:
    - >
      The official README and About page state that GD was originally developed by
      Thomas Boutell and is now maintained by many contributors, with the About page
      placing maintenance under the PHP.net umbrella. The modern repository describes
      C99/C++-compatible builds through CMake or configure and broad platform support.
  related-projects:
    - PHP.net is the umbrella named by the official About page.
    - Perl, PHP, Ruby, and other bindings expose GD to language ecosystems.
    - >
      libpng, libjpeg or libjpeg-turbo, libwebp, libavif, libheif, libtiff, libXpm,
      FreeType, Fontconfig, libraqm, and libimagequant are adjacent optional
      dependencies.
  sources:
    - https://api.github.com/repos/libgd/libgd
    - https://api.github.com/repos/libgd/libgd/releases
    - https://github.com/libgd/libgd
    - https://libgd.github.io/
    - https://libgd.github.io/pages/about.html
    - https://libgd.github.io/pages/docs.html
    - https://raw.githubusercontent.com/libgd/libgd/master/CHANGELOG.md
    - https://raw.githubusercontent.com/libgd/libgd/master/README.md
  summary:
    - >
      GD Graphics Library, packaged as gd or libgd, is a C library for dynamic image
      creation. It is commonly used to generate charts, graphics, thumbnails, and image
      conversions, especially in web applications.
  timeline:
    - '2015: GitHub records the libgd repository creation.'
    - '2017: GD 2.2.5 is released with security fixes.'
    - '2020: GD 2.3.0 is released with multiple security fixes and test additions.'
    - '2021: GD 2.3.2 adds AVIF and HEIF support, followed by GD 2.3.3 build and bug fixes.'
    - >
      2026: The README lists GD 2.3 in bug-fix support, GD 2.4 as active development,
      and GD 3.0 as early vector/API work.
  usage:
    - >
      Applications link libgd to create or transform raster images on demand. Typical
      uses include chart generation, thumbnailing, format conversion, transparency and
      blending operations, image transformations, filters, and text rendering when
      optional font libraries are enabled.
related-packages:
  - id: brew:imagemagick
    reason: >
      Choose ImageMagick when you need a broad command-line image conversion and
      compositing suite; choose GD when embedding lightweight dynamic image generation
      in an application.
    rel: alternative
    sources:
      - https://libgd.github.io/pages/about.html
      - https://imagemagick.org/script/command-line-processing.php
