history:
  adoption-history:
    - >
      dcfldd spread as a forensic imaging utility because it retained dd-like
      command-line habits while adding evidence-handling conveniences. The input package
      facts show it packaged by Homebrew, Debian, Fedora, MacPorts, Nix, Ubuntu, and
      openSUSE, reflecting its role in Unix forensic tool collections.
  package-nerd-significance:
    - >
      dcfldd is significant as one of the better-known forensic forks of dd. For package
      maintainers, it is a small, scriptable utility with a durable niche: old-school
      Unix imaging semantics plus the auditability expected in forensic workflows.
  project-history:
    - >
      The official README says dcfldd was originally created by Nicholas Harbour from
      the DoD Computer Forensics Laboratory. The current volunteer-maintained repository
      imported the inactive upstream from tarballs, applied Debian and other discovered
      patches, and recorded initial restoration work in the ChangeLog from version 1.5
      onward.
  related-projects:
    - >
      GNU dd is the base lineage; dc3dd is the sibling forensic dd variant that occupies
      a similar package-manager niche.
  sources:
    - https://github.com/resurrecting-open-source-projects/dcfldd
    - >
      https://raw.githubusercontent.com/resurrecting-open-source-projects/dcfldd/master/README.md
    - https://api.github.com/repos/resurrecting-open-source-projects/dcfldd
  summary:
    - >
      dcfldd is an enhanced version of GNU dd for forensics and security. The official
      README describes features such as on-the-fly hashing, status output, flexible disk
      wiping, image/wipe verification, multiple outputs, split output, and native
      logging/piping.
  timeline:
    - 'Original era: Created by Nicholas Harbour from the DoD Computer Forensics Laboratory.'
    - >
      2019: Current GitHub repository created by the resurrecting-open-source-projects
      organization.
    - >
      Version 1.5 and later: Restoration work and applied patches recorded in the
      ChangeLog, according to the README.
    - '2025: Official GitHub API metadata shows repository activity continuing into June 2025.'
  usage:
    - >
      Users commonly choose dcfldd when disk imaging needs integrated hash calculation,
      progress, verification, split files, or simultaneous destinations. It keeps the
      operational feel of dd but makes common acquisition and wiping tasks less
      dependent on surrounding scripts.
related-packages:
  - id: brew:dc3dd
    reason: >
      Choose dc3dd as an alternative forensic dd when integrated evidence acquisition,
      multiple hashing options, pattern writing, and explicit file verification match
      the intended workflow.
    rel: alternative
    sources:
      - https://github.com/resurrecting-open-source-projects/dcfldd#readme
      - https://sourceforge.net/projects/dc3dd/
  - id: brew:ddrescue
    reason: >
      Choose GNU ddrescue instead for damaged media when resumable recovery and a
      persistent mapfile are more important than dcfldd's integrated hashing, wiping,
      and multiple-output features.
    rel: alternative
    sources:
      - https://github.com/resurrecting-open-source-projects/dcfldd#readme
      - https://www.gnu.org/software/ddrescue/manual/ddrescue_manual.html
  - id: brew:coreutils
    reason: >
      Choose GNU coreutils dd for routine block copying when forensic hashing,
      verification, wiping patterns, split images, and native logging are not required.
    rel: alternative
    sources:
      - https://github.com/resurrecting-open-source-projects/dcfldd#readme
      - https://www.gnu.org/software/coreutils/manual/html_node/dd-invocation.html
