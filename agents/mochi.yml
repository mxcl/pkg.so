history:
  adoption-history:
    - >
      An Anki importer announced in 2019 lowered migration friction for users with
      existing flashcard collections. Mochi subsequently expanded through desktop and
      mobile applications, synchronization, publishing, browser add-ons, and maintained
      import and export support.
  package-nerd-significance:
    - >
      Mochi occupies the intersection of Markdown knowledge management and
      spaced-repetition software. Package users may value its native desktop client,
      inspectable SQLite-backed local storage, portable export capabilities, and
      alternative workflow to established tools such as Anki.
  project-history:
    - >
      Founder Matt created Mochi around 2019 as a minimal way to turn Markdown notes
      into flashcards. Templates arrived in 2021, and local data was migrated from
      IndexedDB to SQLite in 2022 for more stable storage and a format users could
      inspect and query locally.
  related-projects:
    - >
      Anki: Mochi supports importing Anki decks, providing a migration path from the
      established spaced-repetition ecosystem.
    - 'Markdown: Mochi uses Markdown as the authoring format for notes and cards.'
  sources:
    - https://mochi.cards/blog/
    - https://mochi.cards/changelog
    - https://mochi.cards/docs/
    - https://mochi.cards/docs/reviewing
  summary:
    - >
      Mochi is a Markdown-based note-taking and flashcard application built around
      spaced repetition. It combines linked notes, decks, templates, tags, imports,
      exports, synchronization, and scheduled reviews in a cross-platform application.
  timeline:
    - >
      2019: Mochi was created as a minimal Markdown flashcard tool; an Anki importer was
      announced that October.
    - '2021: Templates were introduced.'
    - '2022: Local data storage migrated from IndexedDB to SQLite.'
    - '2025: Official Chrome and Firefox browser add-ons were announced.'
    - >
      2026: The maintained 1.21 series added new review workflows and continued frequent
      releases.
  usage:
    - >
      Users create Markdown cards and notes, organize them with decks, tags, templates,
      links, and views, then complete scheduled active-recall reviews. Import, export,
      backup, synchronization, and an API support more portable or automated workflows.
