config-file-location:
  linux:
    - ~/.local/share/diasurgical/devilution/diablo.ini
  macos:
    - ~/Library/Application Support/diasurgical/devilution/diablo.ini
  windows:
    - '%APPDATA%\diasurgical\devilution\diablo.ini'
credentials-file-location: null
history:
  adoption-history:
    - >
      The port expanded from desktop systems to numerous community-supported targets.
      Official installation documentation covers Windows, Linux, macOS, FreeBSD, mobile
      devices, handhelds, and consoles; the FreeBSD section documents both ports and
      binary-package installation.
  package-nerd-significance:
    - >
      DevilutionX turns a historically Windows-bound commercial game into a portable,
      maintainable engine while requiring users to supply original game data. That
      separation between redistributable engine code and proprietary assets is central
      to downstream packaging.
  project-history:
    - >
      DevilutionX grew from Devilution, a reconstruction of the original Diablo
      executable. The official changelog records Devilution 0.1.0 as publicly released
      on 6 June 2018 and notes binary-identical reconstruction of Diablo 1.09b in June
      2019. DevilutionX subsequently evolved the code into a portable engine with bug
      fixes and optional quality-of-life improvements.
  related-projects:
    - Devilution, Blizzard’s Diablo and Hellfire, and ports or mods based on DevilutionX.
  sources:
    - https://github.com/diasurgical/DevilutionX
    - https://github.com/diasurgical/DevilutionX/blob/master/docs/CHANGELOG.md
    - https://github.com/diasurgical/DevilutionX/blob/master/docs/installing.md
  summary:
    - >
      DevilutionX is a portable source port of Diablo and Hellfire focused on faithful
      gameplay, modern-platform support, engine fixes, and optional quality-of-life
      features.
  timeline:
    - '2018: Devilution 0.1.0 was released publicly.'
    - '2019: The reconstructed functions became binary-identical to Diablo 1.09b.'
    - >
      Later development: DevilutionX broadened platform support and added engine fixes
      and optional enhancements.
  usage:
    - >
      Users install DevilutionX and provide required MPQ data from a legitimate Diablo
      or Hellfire installation. The port supports the original campaign, Hellfire when
      its data is supplied, multiplayer, and shareware content through spawn.mpq.
