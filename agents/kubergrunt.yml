history:
  adoption-history:
    - >
      The tool's audience has primarily been Gruntwork users and teams consuming
      Gruntwork's Kubernetes infrastructure modules. Its package-manager presence
      matters because it lets module users install the matching helper binary through
      Homebrew, MacPorts, or Nix rather than treating it as an internal script.
  package-nerd-significance:
    - >
      kubergrunt is a classic package-nerd artifact: a small CLI born from glue code
      that proved useful enough to version, release, and package. It documents a period
      when production Kubernetes automation often required stitching Terraform, kubectl,
      Helm, and cloud-provider authentication together with dedicated helper binaries.
  project-history:
    - >
      The repository describes kubergrunt as a collection of commands for managing
      Kubernetes clusters where Terraform, Helm, and kubectl leave small operational
      gaps. Early release notes show v0.1.x commands for EKS configuration and token
      workflows, followed by Helm deployment, TLS, grant, configure, and revoke
      functionality.
  related-projects:
    - >
      kubergrunt is closely related to Terraform, Terragrunt, Gruntwork Kubernetes
      modules, AWS EKS, Helm, kubectl, and Kubernetes Secrets used for TLS material.
  sources:
    - https://docs.gruntwork.io/discussions/knowledge-base/684/
    - https://github.com/gruntwork-io/kubergrunt
    - https://github.com/gruntwork-io/kubergrunt/blob/master/README.md
    - https://github.com/gruntwork-io/kubergrunt/releases
  summary:
    - >
      kubergrunt is Gruntwork's standalone Go CLI for operational gaps between
      Terraform, Helm, and kubectl. It grew around the practical chores of running
      Kubernetes infrastructure as code, especially EKS authentication, Helm/Tiller-era
      certificate handling, and helper commands that did not fit cleanly into Terraform
      modules or kubectl alone.
  timeline:
    - >
      Initial v0.1.x releases: kubergrunt shipped EKS-related commands such as
      configure, token, and deploy.
    - 'v0.1.5: The project added Helm deploy, undeploy, configure, and grant commands.'
    - >
      v0.2.0: helm deploy began requiring an RBAC entity so the local Helm client could
      work immediately after deployment.
    - >
      v0.3.0: helm deploy bug fixes changed client certificate parameters and custom
      Helm home behavior.
  usage:
    - >
      Common usage is task-oriented: configure kubectl for an EKS cluster, generate
      authentication material, manage Helm-related TLS certificates, and run helper
      commands around cluster bootstrap. The README also points users to release
      binaries and the Gruntwork installer, reflecting its role as a companion binary to
      published infrastructure modules.
related-packages:
  - id: brew:awscli
    reason: >
      For EKS users, aws eks update-kubeconfig and aws eks get-token are the official
      AWS CLI alternatives to kubergrunt's configure and token commands.
    rel: alternative
    sources:
      - https://github.com/gruntwork-io/kubergrunt/blob/main/README.md
      - https://docs.aws.amazon.com/cli/latest/reference/eks/update-kubeconfig.html
      - https://docs.aws.amazon.com/cli/latest/reference/eks/get-token.html
  - id: brew:aws-iam-authenticator
    reason: >
      aws-iam-authenticator is a standalone alternative for producing the temporary EKS
      authentication token whose behavior kubergrunt embeds.
    rel: alternative
    sources:
      - https://github.com/gruntwork-io/kubergrunt/blob/main/README.md
      - https://github.com/kubernetes-sigs/aws-iam-authenticator
  - id: brew:kubernetes-cli
    reason: >
      kubergrunt's EKS configure command prepares kubectl contexts, and kubectl
      subsequently invokes its token command to authenticate to the cluster.
    rel: adjacent_workflow
    sources:
      - https://github.com/gruntwork-io/kubergrunt/blob/main/README.md
      - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
  - id: brew:helm
    reason: >
      kubergrunt documents helper commands for Helm deployment and TLS/access setup,
      complementing Helm's application-release workflow on Kubernetes.
    rel: adjacent_workflow
    sources:
      - https://github.com/gruntwork-io/kubergrunt/blob/main/README.md
      - https://helm.sh/docs/intro/introduction/
