history:
  adoption-history:
    - >
      Crunch remained a SourceForge-hosted utility rather than a larger platform
      project, but it became broadly packaged because its interface is simple and useful
      in security lab environments. The supplied package metadata lists it in Homebrew,
      Debian, Ubuntu, MacPorts, and Nix, which matches its role as a portable Unix-style
      CLI.
  package-nerd-significance:
    - >
      For packagers, Crunch is the classic kind of security formula: a C command-line
      program, a manpage/readme as the main documentation surface, and a stable
      executable name that matters more than a rich library API. Its SourceForge code
      and release files make provenance straightforward, while its use in potentially
      huge output pipelines makes predictable builds and path installation important.
  project-history:
    - >
      The upstream readme credits Crunch version 1.0 to mimayin and dates the initial
      release to 2004 based on copyright metadata. Later versions were maintained by
      bofh28, with the changelog showing the tool evolving through character-set files,
      output splitting, resume support, compression, pattern syntax, Unicode support,
      and archive-format support.
  related-projects:
    - >
      Crunch is commonly used alongside password-auditing and cracking tools that
      consume generated candidate lists, such as John the Ripper-style workflows
      mentioned in the upstream changelog.
  sources:
    - https://sourceforge.net/projects/crunch-wordlist/
    - https://sourceforge.net/projects/crunch-wordlist/files/crunch-wordlist/readme.txt
    - https://sourceforge.net/p/crunch-wordlist/code
  summary:
    - >
      Crunch is a small GPL wordlist generator used in password-auditing workflows. Its
      package-manager identity is tied less to a large upstream ecosystem than to its
      role as a compact command-line tool that can emit large, patterned candidate lists
      for other security tools.
  timeline:
    - '2004: Version 1.0 initial release is recorded in the upstream changelog.'
    - '2008-2012: Later copyrights and changelog entries show continued maintenance by bofh28.'
    - >
      2014: SourceForge file metadata shows the readme updated alongside the 3.x release
      series.
  usage:
    - >
      Users commonly run Crunch to generate all combinations or permutations from a
      standard or custom character set, often piping the output into password-auditing
      tools or writing very large wordlist files. The upstream changelog explicitly
      calls out work on output chunking, files larger than 2 GB, resume behavior,
      compression, and pattern handling, all of which are package-nerd details that
      matter when a formula is used in long-running shell pipelines.
related-packages:
  - id: brew:john-jumbo
    reason: >
      John the Ripper Jumbo can consume Crunch-generated candidate files in its
      documented wordlist mode, adding hash and cipher auditing plus word-mangling rules
      to the workflow.
    rel: adjacent_workflow
    sources:
      - https://sourceforge.net/projects/crunch-wordlist/files/crunch-wordlist/readme.txt
      - https://openwall.com/john/doc/MODES.shtml
      - https://github.com/openwall/john
  - id: brew:hashcat
    reason: >
      hashcat accepts one or more wordlists for dictionary and hybrid attacks, so it can
      test candidate lists generated and constrained with Crunch.
    rel: adjacent_workflow
    sources:
      - https://sourceforge.net/projects/crunch-wordlist/
      - https://hashcat.net/wiki/doku.php?id=frequently_asked_questions
