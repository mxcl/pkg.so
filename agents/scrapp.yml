history:
  adoption-history:
    - >
      The official site presents testimonials from designers and other visually oriented
      users who use Scrapp to preserve work discussions, inspiration, and research in a
      searchable collection.
    - >
      A Homebrew Cask record made the macOS application available through
      package-manager installation.
  package-nerd-significance:
    - >
      Scrapp illustrates the long tail of small, independently developed macOS
      applications preserved through Homebrew Cask even when their first-party
      documentation consists mainly of a product landing page.
  project-history:
    - >
      Scrapp originated with a first beta made in the Bureau Gorbunov School of Interns.
      It was conceived as a private visual knowledge collection rather than merely a
      transient screenshot utility.
  related-projects:
    - No closely related first-party software project is documented.
  sources:
    - 'Homebrew Cask provenance: source_facts.package-manager and source_facts.provenance'
    - 'Official product homepage: https://scrapp.me/'
  summary:
    - >
      Scrapp is a macOS screenshot and image-collection application that combines
      capture, private cloud galleries, descriptions, tags, search, sharing, and
      source-link retention.
  timeline:
    - 'Undated: The first Scrapp beta was created in the Bureau Gorbunov School of Interns.'
  usage:
    - >
      Users capture part of a website or drag an existing image onto the application,
      then add descriptions and tags. Scrapp stores the material in a private gallery,
      supports tag-based searching and sharing, and retains the source page link for
      captured images.
