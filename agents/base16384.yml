history:
  adoption-history:
    - >
      base16384 has crossed beyond a single Homebrew formula: the README documents
      installation from Debian Bookworm or higher, Homebrew, an Ubuntu PPA, OpenWrt
      packages, and Arch AUR. The input package metadata also lists Debian, Ubuntu, Nix,
      and Homebrew package names.
    - >
      The README lists ports and bindings in Go, Python, Android, TypeScript, Lua, C#,
      Rust, Swift, Dart, and MoonBit, which is unusual for a niche encoding experiment
      and suggests adoption by developers interested in the format itself rather than
      only the original CLI.
  package-nerd-significance:
    - >
      base16384 is package-nerd catnip because it is a concrete reminder that base-N
      encodings are constrained by transport assumptions, not just math. It asks what
      happens when the transport can carry a large printable Unicode alphabet rather
      than ASCII.
    - >
      Its packaging breadth is the notable part: a very specific encoding utility
      appears in general-purpose OS package indexes, language ports, and
      embedded/open-source package sets.
  project-history:
    - >
      The GitHub repository was created in April 2020. The README describes the format
      as using characters from U+4E00 through U+8DFF as the alphabet, with a remainder
      marker for incomplete final chunks.
    - >
      The project is written as a C/CMake command-line utility and library, and the
      current CMake metadata identifies version 2.3.2 with a September 2025 version
      date. The README also notes use of Cosmopolitan for cross-platform binary
      compilation.
  related-projects:
    - >
      base64 is the older and far more common binary-to-text encoding explicitly used as
      the comparison point in the README.
    - >
      Cosmopolitan is referenced by the README as the cross-platform binary compilation
      tool used by the project.
    - >
      The README lists related base16384 implementations for Go, Python, Android,
      TypeScript, Lua, C#, Rust, Swift, Dart, and MoonBit.
  sources:
    - https://api.github.com/repos/fumiama/base16384
    - https://github.com/fumiama/base16384#readme
    - https://raw.githubusercontent.com/fumiama/base16384/master/CMakeLists.txt
    - source_facts.package-manager
  summary:
    - >
      base16384 is a binary-to-text encoding tool and library that maps binary data into
      printable UTF-16BE text using 16,384 Chinese characters. It is intentionally
      framed by its README as a higher-radix cousin of base64.
  timeline:
    - '2020: Public GitHub repository created.'
    - >
      2020s: README documented package availability across Homebrew, Debian, Ubuntu PPA,
      OpenWrt, and Arch AUR.
    - '2020s: README accumulated ports and bindings in multiple languages.'
    - '2025: CMake metadata identified version 2.3.2 dated Sep 4th 2025.'
  usage:
    - >
      The command exposes encode and decode modes, can read from stdin and write to
      stdout, and includes options for timing, UTF-16BE byte-order marker behavior, and
      checksums. Examples in the README show piping through iconv so encoded UTF-16BE
      output can be displayed as UTF-8 text.
    - >
      There is no documented user configuration file or credentials store; behavior is
      controlled by command-line flags.
related-packages:
  - id: brew:base64
    reason: >
      Choose base64 for broadly interoperable ASCII text; choose base16384 when both
      ends support its denser UTF-16BE representation.
    rel: alternative
    sources:
      - https://github.com/fumiama/base16384#readme
      - https://www.fourmilab.ch/webtools/base64/
  - id: brew:base91
    reason: >
      Choose basE91 for compact ASCII armoring, while base16384 trades ASCII
      compatibility for a much larger Unicode alphabet.
    rel: alternative
    sources:
      - https://github.com/fumiama/base16384#readme
      - https://sourceforge.net/projects/base91/
