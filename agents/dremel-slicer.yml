history:
  adoption-history:
    - >
      The software is supplied for Dremel DigiLab printers and supports the Dremel 3D20,
      3D40, 3D40-FLX, and 3D45 families. Because it is Cura-based, the vendor also
      documents use with other Cura-integrated printers.
  package-nerd-significance:
    - >
      Dremel DigiLab 3D Slicer is an example of a hardware vendor adapting the
      open-source Cura slicing ecosystem into a branded, offline desktop workflow with
      preconfigured printer and material profiles.
    - >
      For package collectors, it illustrates how open-source 3D-printing engines are
      redistributed as vendor-specific desktop applications for particular printer
      fleets.
  project-history:
    - >
      Dremel DigiLab 3D Slicer was built from Cura's open-source slicing software and
      tailored to Dremel's DigiLab printer lineup. The product is now distributed and
      documented by 3PI Tech Solutions, which states that the Dremel and DigiLab names
      are used under license from Robert Bosch Tool Corporation.
  related-projects:
    - >
      Cura is the upstream open-source slicing software on which Dremel DigiLab 3D
      Slicer is based.
    - Simplify3D is documented by the vendor as a separate compatible commercial alternative.
  sources:
    - >
      Official product and usage documentation:
      https://3pitech.com/pages/desktop-slicer-software
  summary:
    - >
      Dremel DigiLab 3D Slicer is an offline Cura-based desktop slicer for preparing CAD
      models for Dremel DigiLab and other Cura-compatible 3D printers.
  timeline:
    - "Product lineage: The slicer was derived from Cura's open-source slicing software."
    - >
      Current distribution: 3PI Tech Solutions provides the desktop downloads and
      official usage guidance under license for the Dremel and DigiLab brands.
  usage:
    - >
      Users import models such as STL or OBJ files, select a printer, material, and
      quality profile, position and transform the model, configure infill, supports, and
      build-plate adhesion, preview the sliced layers, and save generated G-code to
      removable storage or send it to a printer over Ethernet.
