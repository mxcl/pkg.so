id: brew:ggh
display-name: ggh
repo: null
docs:
  - https://github.com/byawitz/ggh#readme
config-file-location:
  unix:
    - ~/.ssh/config
credentials-file-location: null
history:
  adoption-history:
    - >
      ggh spread through the ordinary small-CLI route: GitHub releases, `go install`,
      Homebrew packaging, Nix packaging, and AUR packages. Its appeal is practical
      rather than platform-defining: it gives terminal users a recall list for SSH
      targets without adopting a heavier connection manager.
  package-nerd-significance:
    - >
      The package is a good example of a small Go utility that turns shell history and
      SSH config conventions into a dedicated executable while still depending on the
      system SSH client.
  project-history:
    - >
      The byawitz/ggh repository was created in August 2024 and published its v0.1.0
      release the same day. The README identifies GGH as a small wrapper around SSH
      rather than a replacement for OpenSSH, and the repository later added install
      scripts and release binaries for Unix-like systems and Windows.
  related-projects:
    - >
      ggh is related to OpenSSH and to terminal fuzzy-selection workflows, but it
      deliberately stays a wrapper around the installed `ssh` executable.
  sources:
    - https://api.github.com/repos/byawitz/ggh
    - https://api.github.com/repos/byawitz/ggh/releases
    - https://aur.archlinux.org/packages/ssh-ggh
    - https://formulae.brew.sh/formula/ggh
    - https://github.com/byawitz/ggh
    - https://raw.githubusercontent.com/byawitz/ggh/master/readme.md
  summary:
    - >
      ggh is a lightweight SSH wrapper that remembers SSH invocations and searches
      entries from a user's SSH configuration.
  timeline:
    - '2024: The GitHub repository was created and v0.1.0 was published.'
    - '2024: v0.1.4 was published.'
    - '2025: v0.1.5 was published.'
  usage:
    - >
      Practitioners invoke `ggh` like `ssh` for direct connections, run it without
      arguments to select from previous sessions, run `ggh -` to browse `~/.ssh/config`,
      and use `--config` or `--history` for non-interactive listing.
related-packages:
  - id: brew:openssh
    reason: >
      ggh is a lightweight wrapper around the installed OpenSSH client and will not work
      unless `ssh` is available on the system path.
    rel: adjacent_workflow
    sources:
      - https://github.com/byawitz/ggh
      - https://www.openssh.com/manual.html
