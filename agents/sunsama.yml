history:
  adoption-history:
    - >
      Sunsama launched publicly on Product Hunt in 2018 and converted its early free
      users to a paid model when the company was close to shutting down. The founders
      joined Y Combinator's Winter 2019 batch and raised a seed round. Sunsama later
      expanded from a web-based daily planner into desktop and mobile applications with
      calendar, email, task-management, Slack, and Microsoft Teams integrations; the
      company reports reaching profitability in 2022.
  package-nerd-significance:
    - >
      Sunsama represents the subscription, cloud-backed end of desktop productivity
      packaging: the downloadable desktop client complements a web service rather than
      acting as a self-contained local planner. Homebrew users receive a convenient app
      installation, while account data, authentication, integrations, and most settings
      remain service-managed rather than living in documented dotfiles.
  project-history:
    - >
      Cofounders Ashutosh Priyadarshy and Travis Meyer began exploring intentional-work
      software in 2013 and launched several unsuccessful products before starting over
      with Sunsama in 2018. The initial product paired a per-day task list with a
      calendar. It subsequently developed a distinct workflow around guided daily
      planning, shutdown reflection, timeboxing, focus sessions, and weekly objectives.
  related-projects:
    - >
      The official manual documents integrations with Google and Microsoft calendars and
      email, Todoist, Asana, Notion, Linear, Trello, Jira, GitHub, Slack, Microsoft
      Teams, Zoom, and other work services.
  sources:
    - https://help.sunsama.com/
    - https://help.sunsama.com/docs/security/privacy-notes/
    - https://help.sunsama.com/docs/usage-guides/weekly-objectives/weekly-planning/
    - https://www.sunsama.com/about
    - https://www.sunsama.com/blog/sunsama-2025-task-manager-roadmap
    - source_facts.package-manager
  summary:
    - >
      Sunsama is a cloud-backed daily planner that brings tasks and calendars into a
      guided workflow for planning, timeboxing, focusing, and reviewing work.
  timeline:
    - >
      2013: The future cofounders began building products intended to improve how people
      organize their workdays.
    - >
      2018: The team created and launched the first Sunsama prototype, initially
      combining per-day task lists with a calendar.
    - 'Late 2018: Sunsama entered Y Combinator and subsequently raised a seed round.'
    - '2019: The company moved to a remote working model after Y Combinator.'
    - '2022: The company reports that it became profitable.'
  usage:
    - >
      Users bring tasks into a daily plan, estimate their duration, place timeboxes on
      connected calendars, work through focus sessions, and finish with shutdown or
      weekly-review rituals. Desktop-specific features include global task and focus
      shortcuts. The application supports browser, desktop, and mobile clients and can
      import work from numerous external services.
