config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      desktop-file-utils became part of the practical plumbing of Linux desktop
      packaging because application packages ship .desktop launchers and MIME handlers
      that need validation and cache updates. The freedesktop.org page documents
      development in the xdg/desktop-file-utils GitLab repository and release tarballs
      on freedesktop.org.
  package-nerd-significance:
    - >
      For package nerds, desktop-file-utils is classic Linux desktop infrastructure: it
      rarely appears in screenshots, but it enforces the metadata that makes launchers,
      menus, MIME associations, and desktop integration work consistently across
      distributions.
  project-history:
    - >
      The release archive starts with version 0.1 in September 2003, and the NEWS file
      describes that initial release as containing desktop-file-validate and
      desktop-file-install. Over time the project added update-desktop-database, support
      for newer desktop-entry specification versions, Meson builds, and a wider set of
      recognized desktop environments.
  related-projects:
    - >
      Related freedesktop.org standards include the Desktop Entry Specification and the
      broader XDG desktop integration specifications.
  sources:
    - https://www.freedesktop.org/wiki/Software/desktop-file-utils
    - https://www.freedesktop.org/software/desktop-file-utils/releases/
    - https://gitlab.freedesktop.org/xdg/desktop-file-utils/-/raw/master/NEWS
  summary:
    - >
      desktop-file-utils is a freedesktop.org utility collection for working with
      desktop entry files. Its commands validate .desktop files, install or edit them,
      and update the MIME-type cache derived from desktop entries.
  timeline:
    - >
      2003: Version 0.1 initial release contained desktop-file-validate and
      desktop-file-install.
    - '2004: Version 0.7 added update-desktop-database.'
    - '2020: Version 0.25 added Meson build support and deprecated Autotools.'
    - '2023: Version 0.27 removed Autotools support and added desktop spec 1.5 support.'
    - '2024: Version 0.28 was released.'
  usage:
    - >
      Packagers and desktop maintainers use desktop-file-validate to catch desktop-entry
      specification violations, desktop-file-install and desktop-file-edit to install or
      modify entries, and update-desktop-database to rebuild the cache of MIME types
      handled by desktop files.
related-packages:
  - id: brew:appstream
    reason: >
      Use AppStream alongside desktop-file-utils when packaging graphical applications:
      desktop-file-utils validates and installs launchers, while appstreamcli validates
      application metadata and can check a tree for associated desktop files.
    rel: adjacent_workflow
    sources:
      - https://www.freedesktop.org/wiki/Software/desktop-file-utils
      - https://www.freedesktop.org/software/appstream/docs/chap-Quickstart.html
