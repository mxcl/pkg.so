history:
  project-history:
    - >
      The release notes show a tool that broadened from authentication and configuration
      plumbing into more operational workflows. Version 1.2.0 stored login tokens in the
      XDG cache directory in 2019; 1.3.0 added macOS binary publication; 1.4.0 added
      two-factor login support; 1.5.0 added configuration-file lookup and shell
      completion; 1.6.0 added artifact listing and remote terminal access; later 1.8.x
      and 1.9.x entries added artifact deletion, raw device-list output, troubleshoot
      improvements, port-forward reliability work, and personal-access-token/JWT
      support.
  sources:
    - https://docs.mender.io/downloads/workstation-tools
    - https://docs.mender.io/release-information/release-notes-changelog/mender-cli
    - https://docs.mender.io/server-integration/using-the-apis
    - https://github.com/mendersoftware/mender-cli
  summary:
    - >
      mender-cli is a general-purpose command-line client for the Mender backend. The
      project README states its goal directly: simplify integration between the Mender
      server and cloud services such as CI and build automation, then expand toward
      common backend integration use cases. It belongs beside mender-artifact in the
      Mender workstation-tool set: mender-artifact prepares update files, while
      mender-cli talks to the server-side APIs and operational features.
  usage:
    - >
      In practice, teams use mender-cli in scripts and CI jobs to authenticate to hosted
      or self-hosted Mender, list and manage artifacts, interact with devices, and
      automate deployment-adjacent server tasks. Its configuration-file locations and
      credential options make it a package-manager-facing CLI rather than a library
      dependency.
related-packages:
  - id: brew:mender-artifact
    reason: >
      Use mender-artifact first to create, inspect, or sign the `.mender` update archive
      that mender-cli subsequently uploads to the Mender server.
    rel: adjacent_workflow
    sources:
      - https://docs.mender.io/artifact-creation/create-an-artifact
      - https://docs.mender.io/server-integration/using-the-apis
      - https://github.com/mendersoftware/mender-artifact#readme
