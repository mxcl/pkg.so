history:
  adoption-history:
    - >
      Cron developed a following as a productivity-focused calendar and was named
      Product Hunt's Productivity App of the Year before joining Notion. Notion Calendar
      subsequently became available free on the web, macOS, Windows, iOS, and Android.
  package-nerd-significance:
    - >
      For package-manager users, the cask reflects the continuity between Cron and
      Notion Calendar: the product was rebranded, but its documented local URL scheme
      still uses the cron:// protocol. It is a proprietary desktop client rather than an
      open-source calendar implementation.
  project-history:
    - >
      Notion acquired Cron and its team in June 2022, initially continuing it as a
      separate application. On January 17, 2024, Cron was relaunched as Notion Calendar,
      with deeper links to Notion pages and databases.
  related-projects:
    - Cron
    - Notion
    - Google Calendar
    - Apple iCloud Calendar
  sources:
    - https://www.notion.com/blog/introducing-notion-calendar
    - https://www.notion.com/blog/notion-acquires-cron
    - https://www.notion.com/help/category/notion-calendar
    - https://www.notion.com/help/notion-calendar-connections
  summary:
    - >
      Notion Calendar is a proprietary calendar and scheduling client descended from
      Cron. It combines external calendars, scheduling links, conferencing, and dated
      Notion database items in one interface.
  timeline:
    - '2022-06-09: Notion announced its acquisition of Cron.'
    - '2024-01-17: Cron was relaunched as Notion Calendar.'
  usage:
    - >
      Users connect supported calendar accounts, manage events, share one-off or
      recurring availability, join conferences, and display or edit dated Notion
      database items. The desktop application also provides menu-bar access and a local
      cron:// URL scheme.
