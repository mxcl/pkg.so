credentials-file-location: null
history:
  adoption-history:
    - >
      Technically, MiniZinc's major contribution is the separation between modeling and
      solving. Modelers write .mzn models with parameters, decision variables, global
      constraints, and objectives; the minizinc compiler flattens a particular
      model/data pair into FlatZinc or another solver-facing form. That lets users try
      different solvers from the same model, while solver authors can support MiniZinc
      by providing FlatZinc interfaces and global-constraint definitions.
  project-history:
    - >
      Its origins are unusually well documented. A history paper by Peter J. Stuckey,
      Guido Tack, and Maria Garcia de la Banda says MiniZinc was introduced in the
      CP2007 paper "MiniZinc: Towards a Standard CP Modelling Language" as a response to
      the lack of a common constraint-programming modeling language. The paper traces
      the language back to the G12 project, started in 2005, and to Zinc: MiniZinc was
      created as a stripped-down version of Zinc that compiled a model plus data
      instance into FlatZinc. The first MiniZinc version, 0.6, was released on September
      23, 2007, the first day of CP2007.
  sources:
    - https://docs.minizinc.dev/en/stable/flattening.html
    - https://docs.minizinc.dev/en/stable/index.html
    - https://formulae.brew.sh/formula/minizinc
    - https://freuder.me/wp-content/uploads/2019/09/2007.pdf
    - https://github.com/MiniZinc/libminizinc
    - https://www.minizinc.org/
    - https://www.minizinc.org/challenge/
  summary:
    - >
      MiniZinc is a free and open-source constraint modeling language for expressing
      constraint satisfaction and discrete optimization problems in a high-level,
      solver-independent form. The project is developed at Monash University with
      support from OPTIMA, and the libminizinc repository describes the compiler as
      translating MiniZinc models into FlatZinc, a solver input language understood by a
      wide range of solvers.
  usage:
    - >
      Adoption is tied strongly to the constraint-programming research and optimization
      communities. The MiniZinc Challenge has run every year since 2008 to compare
      constraint solvers on shared benchmarks, and the history paper notes that the
      challenge encouraged solver implementers to provide compliant FlatZinc interfaces
      while building a public benchmark library. The same paper cites deployed and
      applied MiniZinc use in ship scheduling, optimization consulting, mission
      planning, automated configuration, cloud deployment, mobile robot planning,
      building automation, data acquisition, and preference elicitation. In Homebrew,
      the formula brings in solver-related dependencies such as Gecode and COIN-OR
      components, reflecting the package's role as a modeling frontend plus compiler
      rather than a single solver.
related-packages:
  - id: brew:gecode
    reason: >
      Use Gecode as a constraint-programming backend for MiniZinc models; MiniZinc ships
      a Gecode-specific library and solver configuration, and Gecode has a long MiniZinc
      Challenge history.
    rel: adjacent_workflow
    sources:
      - https://docs.minizinc.dev/en/latest/installation.html
      - https://docs.minizinc.dev/en/stable/fzn-spec.html
      - https://www.gecode.dev/
  - id: brew:cbc
    reason: >
      Use COIN-OR Cbc as MiniZinc's bundled mixed-integer programming backend when a
      model is best handled as a MIP rather than by a finite-domain CP solver.
    rel: adjacent_workflow
    sources:
      - https://docs.minizinc.dev/en/latest/installation.html
      - https://coin-or.github.io/Cbc/
  - id: brew:highs
    reason: >
      Use HiGHS with MiniZinc for linear and mixed-integer optimization models; it is
      one of the solvers included in the official bundled MiniZinc distribution.
    rel: adjacent_workflow
    sources:
      - https://docs.minizinc.dev/en/latest/installation.html
      - https://ergo-code.github.io/HiGHS/
