history:
  adoption-history:
    - >
      The library's adoption follows tracker music itself: games, emulators, demos, and
      multimedia software used libmikmod to play compact pattern-and-sample music files
      on many operating systems. Its driver and loader history shows portability work
      for ALSA, PulseAudio, CoreAudio, Android OpenSL ES, AmigaOS variants, PSP, OS/2,
      and other targets.
    - >
      Homebrew, Debian, Ubuntu, Fedora, Arch, Alpine, MacPorts, Nix, and openSUSE
      package libmikmod, which keeps old module playback support available in modern
      Unix software stacks.
  package-nerd-significance:
    - >
      libmikmod is a museum piece that still compiles into real programs. Package
      maintainers care about it because tracker formats are full of legacy edge cases,
      and a shared library prevents every game or media app from carrying its own
      imperfect player.
    - >
      Its release notes are catnip for old-platform nerds: they mix modern security
      hardening with fixes for obscure module loaders and drivers for platforms that
      most packages stopped mentioning years ago.
  project-history:
    - >
      The MikMod homepage describes MikMod as originally an MS-DOS player that was
      ported to Unix, Macintosh, BeOS, Java, and other platforms. The page names
      Jean-Paul Mikkers, Jake Stine, and Frank Loemker as main authors, with a chain of
      Unix maintainers and later maintenance handoffs to Shlomi Fish and Ozkan Sezer.
    - >
      libmikmod separated the playback engine from the player interface, making it
      useful for games, media players, and software that wanted module playback without
      embedding a full tracker player. SourceForge release notes show two long-running
      release lines, including the old libmikmod2 series and the libmikmod3 series.
  related-projects:
    - >
      The mikmod player is the companion command-line/player application built around
      the library.
    - >
      Tracker formats such as MOD, S3M, IT, XM, MED, UMX, and 669 define much of the
      library's compatibility surface.
    - >
      Other module playback libraries and players, such as xmp, sit in the same
      preservation-oriented audio niche.
  sources:
    - https://formulae.brew.sh/formula/libmikmod
    - https://mikmod.sourceforge.net/
    - https://mikmod.sourceforge.net/doc/mikmod-3.3.13.html
    - https://sourceforge.net/p/mikmod/mikmod
    - https://sourceforge.net/p/mikmod/news/
    - https://sourceforge.net/projects/mikmod/files/libmikmod/
  summary:
    - >
      libmikmod is the library half of the MikMod sound system, a portable module-player
      stack for tracker music formats such as MOD, S3M, IT, and XM. It preserves a 1990s
      demo-scene audio format family in a packageable C library.
  timeline:
    - >
      1990s: MikMod begins as an MS-DOS module player before being ported to Unix and
      other platforms.
    - >
      2013: libmikmod 3.3.3 adds UMX module loading for music containers used by games
      such as Unreal and Deus Ex.
    - '2014: libmikmod 3.3.5 adds PulseAudio output and improves ALSA and build-system support.'
    - >
      2025: libmikmod 3.3.13 is released with a Sample_Free regression fix and a
      webaudio driver update.
  usage:
    - >
      Applications link libmikmod to load and play tracker modules through a unified
      API. The package also ships libmikmod-config for build scripts that need compiler
      and linker flags.
    - >
      The library is useful when software wants MOD/S3M/IT/XM playback without
      implementing many historical tracker quirks, file loaders, timing rules, and audio
      output drivers itself.
