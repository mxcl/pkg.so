history:
  adoption-history:
    - >
      GarageSale became established among Mac-based eBay sellers as a native alternative
      to browser-based listing workflows. GarageSale 2 was announced at Macworld San
      Francisco in January 2006 and was among the early desktop clients using eBay's
      then-new unified XML interface.
    - >
      The product has continued through numerous major versions while adapting to
      changes in eBay's APIs, listing policies, shipping features, and authentication.
      Its official manual and long-running support forum reflect use in recurring seller
      workflows rather than one-off auctions.
  package-nerd-significance:
    - >
      GarageSale is representative of durable commercial Mac software whose usefulness
      depends on continuous compatibility with an external platform API. Homebrew Cask
      provides a convenient installation route for a specialized application that
      otherwise uses the developer's direct-download channel.
    - >
      For automation-minded sellers, its value lies in keeping reusable listing
      templates, images, order information, inventory details, and relisting operations
      within a native desktop application.
  project-history:
    - >
      GarageSale is a commercial macOS eBay client developed by iwascoding. Official
      archives document GarageSale 1.9.6 in December 2005 and GarageSale 2 in January
      2006; version 2 adopted eBay's unified XML interface and shipped as a Universal
      Binary for PowerPC and Intel Macs.
    - >
      Later generations expanded listing design, revision, relisting, order management,
      reporting, and seller workflow features while tracking eBay platform changes.
  related-projects:
    - GarageBuy, another iwascoding application focused on finding and bidding on eBay items.
    - eBay, whose listing and order services GarageSale manages.
  sources:
    - https://manual.iwascoding.com/gs8/en/
    - https://www.iwascoding.com/GarageSale
    - https://www.iwascoding.com/category/garagesale/page/25/
    - source_facts.package-manager
  summary:
    - >
      GarageSale is a long-running commercial macOS application for preparing,
      launching, revising, relisting, and tracking eBay listings and orders.
  timeline:
    - '2005: Official archives recorded the GarageSale 1.9.6 release.'
    - >
      2006: GarageSale 2 debuted at Macworld San Francisco with eBay's unified XML
      interface and Universal Binary support.
    - '2008: GarageSale 4 was released as a major product update.'
  usage:
    - >
      Sellers create and organize listing templates, edit item descriptions and images,
      launch or schedule listings, revise active listings, relist ended items, and
      manage incoming orders. Reusable profiles, tags, custom footers, reports, and
      bulk-oriented workflows support frequent sellers.
