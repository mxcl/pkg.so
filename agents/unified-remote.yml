history:
  adoption-history:
    - >
      The initial Android release received several thousand downloads within its first
      days, encouraging its creators to expand the number of remotes and supported
      platforms. The official history says the product later approached ten million
      downloads worldwide.
    - >
      A free edition and paid full edition broadened adoption, while support for iOS and
      for controlling macOS and Linux machines extended the original Android-to-Windows
      design.
  package-nerd-significance:
    - >
      Unified Remote is unusual in packaging because the desktop package is only the
      server half of a mobile-and-desktop system. A working installation also depends on
      a separately installed phone client, network discovery or Bluetooth, firewall
      reachability, and optional password protection.
    - >
      Its public Remotes and Docs repositories expose an extensible layer built from
      metadata, layouts, settings, Lua actions, and shared libraries even though the
      complete commercial application is not published as a single open-source
      repository.
  project-history:
    - >
      Unified Remote began in 2010 as a hobby project by Swedish students Philip
      Bergqvist and Jakob Berglund. Their goal was to give smartphones familiar,
      application-specific controls for computer programs.
    - >
      The first Android release contained just over ten remotes for software and system
      functions including Spotify, VLC, Windows Media Player, PowerPoint, and power
      controls. A second generation in 2011 introduced improved free and paid editions,
      and version 3 in 2014 added a redesigned interface, iOS support, and servers for
      macOS and Linux.
  related-projects:
    - >
      The official unifiedremote/Remotes repository contains remote definitions, while
      unifiedremote/Docs documents the extension API.
    - >
      Unified Remote overlaps with presentation clickers, media-center remotes,
      remote-mouse applications, and remote-desktop tools, but emphasizes task-specific
      control layouts rather than continuous desktop streaming.
  sources:
    - https://github.com/unifiedremote/Docs
    - https://www.unifiedremote.com/about
    - https://www.unifiedremote.com/tutorials/how-to-get-started
    - source_facts.description
    - source_facts.homepage
  summary:
    - >
      Unified Remote is a client/server system that turns a phone or tablet into a
      network or Bluetooth remote for desktop applications and operating-system
      functions.
  timeline:
    - >
      2010: The project began as a hobby project by two Swedish students and shipped its
      first Android release.
    - '2011: Version 2 introduced an improved free app and a paid full edition.'
    - >
      2014: Version 3 added a redesigned interface, an iOS app, and support for
      controlling macOS and Linux computers.
    - >
      2010s: The official project history reports adoption approaching ten million
      downloads worldwide.
  usage:
    - >
      Users install Unified Remote Server on the computer, install the mobile app, place
      the devices on the same Wi-Fi network or pair them over Bluetooth, connect to the
      detected server, and select a purpose-built remote.
    - >
      Common remotes provide mouse, keyboard, media, presentation, and power controls.
      Official tutorials cover connection troubleshooting, firewall configuration,
      password protection, Wake-on-LAN, and custom remotes.
