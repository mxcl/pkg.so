history:
  adoption-history:
    - >
      By 2015, Alibaba described Youku Tudou as a leading Chinese multi-screen
      entertainment and internet-television platform. Youku subsequently became a key
      component of Alibaba's digital-media and entertainment business, distributing
      licensed, jointly produced, original, professional, and user-generated content.
  package-nerd-significance:
    - >
      The cask provides a package-managed installation route for the proprietary macOS
      client of a major Chinese long-form video platform, a category more commonly
      distributed through consumer download portals and app stores.
  project-history:
    - >
      Youku developed as a Chinese online video-sharing and streaming service. After
      operating as Youku Tudou, it entered a definitive acquisition agreement with
      Alibaba in 2015 and became part of Alibaba's digital-media portfolio.
  related-projects:
    - Tudou is historically linked to Youku through Youku Tudou.
    - Alibaba's related entertainment businesses include Alibaba Pictures and Damai.
  sources:
    - >
      Official 2015 Alibaba acquisition announcement:
      https://www.alibabagroup.com/en-US/document-1491492989552295936
    - >
      Official Alibaba Youku profile:
      https://www.alibabagroup.com/en-US/about-alibaba-businesses-1744508702247677952
    - 'Official Youku client center: https://pd.youku.com/'
    - source_facts.package-manager
  summary:
    - >
      Youku is Alibaba's proprietary Chinese long-form video, streaming, and
      content-distribution platform.
  timeline:
    - '2014: Alibaba made an initial strategic investment in Youku Tudou.'
    - '2015: Alibaba and Youku Tudou entered a definitive acquisition agreement.'
    - >
      2018: Alibaba described Youku as a key part of its Digital Media and Entertainment
      Group.
    - >
      Present: Youku operates as an Alibaba long-form video platform across multiple
      device classes.
  usage:
    - >
      Users search, watch, and share video across devices. The desktop client supports
      streaming as well as downloading content for offline viewing, according to Youku's
      official client center.
