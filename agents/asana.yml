history:
  adoption-history:
    - >
      Asana grew from an internal coordination concept into a work-management service
      used by teams for product launches, marketing campaigns, onboarding, resource
      planning, goals, and other cross-functional workflows. Official company filings
      reported more than 150,000 paying customers and millions of users across nearly
      200 countries.
    - >
      The desktop client extends the web product to macOS and Windows. It includes
      native notifications, quick access to My Tasks, recent-page history, focus timers,
      and notification controls.
  package-nerd-significance:
    - >
      Asana is primarily a hosted service rather than a traditional local package. Its
      cask matters to managed-Mac users because it provides repeatable deployment of the
      desktop shell while accounts, projects, and organizational data remain associated
      with the Asana service.
  project-history:
    - >
      Dustin Moskovitz and Justin Rosenstein founded Asana in 2008 after encountering
      coordination overhead while working at Facebook. They sought to replace status
      meetings, long email threads, and project-status spreadsheets with a shared
      representation of work.
    - >
      Asana subsequently developed its Work Graph data model and expanded from task
      coordination into organization-wide work management. The desktop application
      packages the service in a focused native environment while retaining the web
      version’s functionality.
  related-projects:
    - Asana’s mobile and web applications provide access to the same work-management service.
    - >
      The desktop application relies on the browser during account verification and uses
      browser cookies to maintain app-link behavior.
  sources:
    - 'Official Asana company history: https://asana.com/company'
    - 'Official Asana investor filing: https://investors.asana.com/node/10766/html'
    - 'Official co-founder biography: https://asana.com/leadership/justin-rosenstein'
    - >
      Official desktop and mobile features page:
      https://asana.com/features/project-management/mobile-desktop-apps
    - 'Official desktop-app guide: https://help.asana.com/s/article/asana-desktop-app'
  summary:
    - >
      Asana is a collaborative work-management platform founded by Dustin Moskovitz and
      Justin Rosenstein. The cask installs its macOS desktop client, which exposes the
      hosted service in a dedicated application with native productivity features.
  timeline:
    - '2008: Dustin Moskovitz and Justin Rosenstein co-founded Asana.'
    - '2009: Justin Rosenstein began serving as chief executive.'
    - '2010: Dustin Moskovitz became chief executive.'
    - >
      2020s: Asana expanded desktop productivity features and reported more than 150,000
      paying customers.
  usage:
    - >
      Teams use Asana to assign tasks, set due dates, coordinate projects and workflows,
      track goals, and report status. Desktop users authenticate through the Asana
      service; the app redirects to a browser to verify sign-in and then returns the
      session to the desktop client.
