config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The application is distributed directly by Mox Adventu and through Homebrew Cask.
      Its main shortcut-display feature is free, while a paid license unlocks advanced
      features.
  package-nerd-significance:
    - >
      ShowMeYourHotKeys belongs to the small but useful class of macOS
      shortcut-discovery utilities. It is especially relevant to keyboard-driven users,
      trainers, and presenters because it can both reveal application commands and
      display typed shortcuts on screen.
  project-history:
    - >
      ShowMeYourHotKeys began as a macOS utility for displaying the foreground
      application's menu shortcuts. Its early releases added favorites, a shortcut
      database, printable cheat sheets, multiple window layouts, and on-screen keystroke
      display.
    - >
      Later releases added custom shortcuts, system-hotkey inspection, French
      localization, conflict highlighting, and additional layout and filtering controls.
      Version 1.6 marked the end of its beta period.
  related-projects:
    - CheatSheet
    - KeyCue
  sources:
    - 'Official changelog: https://showmeyourhotkeys.moxadventu.com/changelog/'
    - 'Official product page: https://showmeyourhotkeys.moxadventu.com/index.html'
  summary:
    - >
      ShowMeYourHotKeys is a macOS utility that displays keyboard shortcuts for the
      active application and can maintain a shortcut database, generate cheat sheets,
      and show keystrokes on screen.
  timeline:
    - 'Version 1.0: Initial release and subsequent addition of a shortcut database.'
    - 'Version 1.2: On-screen hotkey display was added.'
    - 'Version 1.3: Custom hotkeys were added.'
    - 'Version 1.6: The application left beta.'
    - 'Version 1.10: Shortcut-conflict highlighting and additional layout controls were added.'
  usage:
    - >
      Pressing Command three times opens or closes a persistent shortcut window; holding
      Command displays a temporary window.
    - >
      Users can filter shortcuts, bookmark frequently used commands, redefine supported
      application menu shortcuts, inspect system hotkeys, and generate PDF cheat sheets.
    - >
      The official site documents an internal shortcut database and application settings
      but does not publish their filesystem locations.
