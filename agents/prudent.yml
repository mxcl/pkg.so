history:
  adoption-history:
    - >
      Official documentation positions Prudent for personal, family, and team finances,
      with transaction-import extensions that particularly cover Singaporean banks and
      institutions as well as general QIF data.
  package-nerd-significance:
    - >
      Prudent is of interest to package users who prefer local-first, plain-text
      accounting but want a graphical interface. Ledger-format journals remain readable
      without Prudent and work naturally with version control, backups, encryption,
      scripts, and the Ledger CLI.
  project-history:
    - >
      Prudent was developed as a desktop integrated environment around Ledger-format
      accounting journals. It combines journal editing and aggregation with calendars,
      account trees, reports, and an extension system rather than replacing the
      underlying plain-text format with a proprietary database.
  related-projects:
    - Ledger supplies journal parsing and text-reporting behavior.
    - Git can be used to version Prudent's plain-text journal files.
    - QIF and institution-specific extensions import transaction data.
  sources:
    - https://docs.prudent.me/docs/journal
    - https://docs.prudent.me/docs/ledger
    - https://docs.prudent.me/docs/samples
    - https://docs.prudent.me/docs/what
  summary:
    - >
      Prudent is a local desktop environment for maintaining personal, family, or team
      accounts in Ledger-compatible plain-text journals. It adds graphical reporting,
      account navigation, transaction import, and multi-commodity views around the
      Ledger model.
  timeline:
    - >
      Undated: Prudent established its desktop application and documentation around
      Ledger-compatible journals.
  usage:
    - >
      Users create or open local Ledger journals, navigate accounts graphically, review
      income, expenses, assets and liabilities, and import transactions through
      extensions. Journals remain ordinary user-controlled text files.
