config-file-location:
  unix:
    - dynomite.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Dynomite's adoption story is tied to Netflix infrastructure and the broader
      post-Dynamo ecosystem of eventually consistent key-value systems. In package
      managers, it is a specialized service binary rather than a general CLI; Homebrew
      keeps it available for local testing, experiments, and operators who need the
      daemon and helper tools.
  package-nerd-significance:
    - >
      Dynomite matters to package nerds because it packages the Dynamo paper lineage
      into a concrete Unix service around existing key-value stores. It is a good
      example of infrastructure software whose formula exposes a daemon, config file,
      test mode, and helper binaries rather than a developer-facing one-shot command.
  project-history:
    - >
      Netflix created the public Dynomite repository in 2013. The README says Dynomite
      was inspired by Amazon's Dynamo whitepaper and was designed as a thin distributed
      layer over storage engines that do not themselves provide high availability or
      cross-datacenter replication.
    - >
      The project documentation describes Redis and Memcached as supported protocols and
      emphasizes multi-datacenter replication, high availability, few moving parts, and
      performance. The README also records a branch workflow where version-numbered
      branches are considered stable while the `dev` branch is the active development
      branch.
  related-projects:
    - >
      Related projects include Amazon Dynamo, Redis, Memcached, Apache Cassandra, Riak,
      Netflix internal infrastructure projects, and other distributed key-value stores
      built around replication, partitioning, and high availability.
  sources:
    - https://github.com/Netflix/dynomite#readme
    - https://api.github.com/repos/Netflix/dynomite
    - https://netflix.github.io/dynomite
    - https://formulae.brew.sh/formula/dynomite
  summary:
    - >
      Dynomite is Netflix's distributed Dynamo-inspired layer for key-value storage
      engines and protocols such as Redis and Memcached, focused on high availability
      and cross-datacenter replication.
  timeline:
    - "2007: Amazon publishes the Dynamo paper that inspires Dynomite's design direction."
    - '2013: Netflix creates the public Dynomite repository.'
    - >
      2010s: Dynomite documents Redis and Memcached backends, multi-datacenter
      replication, and versioned stable branches.
    - '2026: Homebrew packages Dynomite 0.6.22.'
  usage:
    - >
      Operators run `dynomite` with a YAML configuration file, commonly `dynomite.yml`,
      specifying datacenter, rack, tokens, seeds, listen addresses, datastore protocol,
      server pools, gossip, encryption scope, and statistics settings. The package also
      includes hash and test helper tools.
related-packages:
  - id: brew:redis
    reason: >
      Run Redis beside Dynomite when you need Redis data structures and protocol
      compatibility with Dynomite-provided peer-to-peer replication and multi-datacenter
      availability.
    rel: adjacent_workflow
    sources:
      - https://netflix.github.io/dynomite/4.0%20Getting-Started/
      - https://netflix.github.io/dynomite/2.0%20Architecture/
      - https://redis.io/docs/latest/
  - id: brew:memcached
    reason: >
      Run Memcached as Dynomite's local datastore when a cache-oriented Memcached
      protocol is preferable to Redis data structures.
    rel: adjacent_workflow
    sources:
      - https://netflix.github.io/dynomite/4.0%20Getting-Started/
      - https://netflix.github.io/dynomite/7.0%20FAQ/
      - https://docs.memcached.org/
