history:
  adoption-history:
    - >
      The official site reports availability on macOS, Windows, Linux, iOS, and Android
      and says the application has more than 9.2 million downloads. This positions it as
      a cross-platform consumer utility rather than a macOS-only cask.
  package-nerd-significance:
    - >
      FreeYourMusic addresses service lock-in at the library-metadata layer. Package
      users care because it automates an otherwise manual migration of playlists and
      saved music while preserving ordering and other collection structure.
  project-history:
    - >
      FreeYourMusic was created as a dedicated music-library migration application. Its
      official materials describe an expansion beyond one-time playlist transfers into
      automatic synchronization, rematching, and cloud backup.
  related-projects:
    - >
      It interoperates with Spotify, Apple Music, YouTube Music, TIDAL, Amazon Music,
      Deezer, SoundCloud, Pandora, and other streaming services through their supported
      authorization flows.
  sources:
    - 'Official Help Center: https://support.freeyourmusic.com/'
    - 'Official download page: https://freeyourmusic.com/download'
    - 'Official product page: https://freeyourmusic.com/'
  summary:
    - >
      FreeYourMusic is a proprietary cross-platform utility for moving playlists, liked
      tracks, albums, followed artists, and related library metadata between
      music-streaming services.
  timeline:
    - >
      By 2026: Official distribution spans macOS, Windows, Linux, iOS, and Android, with
      automatic synchronization and cloud-backup features.
  usage:
    - >
      Users connect source and destination streaming accounts, select the collections to
      move, and start a transfer. The application uses official service sign-in flows;
      transfers are matched locally, and unmatched recordings can be reviewed with
      Rematch.
