history:
  adoption-history:
    - >
      DeepL expanded from a public web translator into paid DeepL Pro, API access,
      desktop and mobile applications, writing assistance, and enterprise language
      workflows. DeepL’s official company page says more than 200,000 business teams and
      millions of individuals use its services.
  package-nerd-significance:
    - >
      The desktop package brings a primarily cloud-backed translation service into
      system-wide workflows, letting users invoke translation while working in other
      applications. For package users, it represents the common modern pattern of a
      native client wrapping an account-aware hosted AI service.
  project-history:
    - >
      A team within Linguee began developing a neural-machine-translation system in 2016
      using the company’s existing linguistic data. DeepL Translator launched publicly
      in August 2017, DeepL Pro and its API followed in March 2018, and desktop
      applications for Windows and macOS launched in September 2019.
  related-projects:
    - >
      Linguee supplied the organizational and data background from which DeepL
      Translator emerged.
    - >
      DeepL Pro, the DeepL API, DeepL Write, and DeepL’s mobile apps extend the same
      language platform into paid, developer, writing, and mobile workflows.
  sources:
    - 'Official 2018 launch retrospective: https://www.deepl.com/en/blog/20180215'
    - 'Official company history: https://www.deepl.com/en/about-us'
    - 'Official company profile: https://www.deepl.com/files/press/companyProfile_EN.pdf'
    - >
      Official desktop-app help:
      https://support.deepl.com/hc/en-us/articles/18606772245916-Get-started-with-DeepL-desktop-apps
  summary:
    - >
      DeepL is a language-AI service and application family originating in Germany. Its
      desktop client provides translation from macOS and Windows and can be used with a
      DeepL account for plan-specific features.
  timeline:
    - '2016: A Linguee team began work on the first DeepL Translator.'
    - '2017: DeepL Translator was released publicly in August.'
    - '2018: DeepL Pro and API access launched in March.'
    - '2019: DeepL launched integrated Windows and macOS applications in September.'
    - '2021: DeepL released its iPhone and iPad application.'
  usage:
    - >
      Desktop users install the native app, optionally sign in to a DeepL account, and
      translate text or documents from their computer. DeepL notes that a browser login
      does not automatically sign the user into the desktop app and that managed
      networks may require proxy configuration.
