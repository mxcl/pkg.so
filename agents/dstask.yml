history:
  adoption-history:
    - >
      dstask has been packaged beyond its upstream releases, with the README listing
      Homebrew, Nix, Arch AUR, and FreeBSD packages. Homebrew packages the GitHub
      release tarball and records version 1.0.1 in 2026.
    - >
      The release history shows a long pre-1.0 life from early v0.x tags through a 1.0
      release in November 2025 and v1.0.1 in January 2026, which is typical for small
      terminal productivity tools that mature through steady personal use.
  package-nerd-significance:
    - >
      dstask matters to package nerds because it is a clean example of the single static
      binary plus Git repository pattern: simple install surface, no server, no database
      daemon, and data that can move across machines with normal Git tooling.
    - >
      It also demonstrates a familiar package-manager niche: a small alternative to a
      better-known tool, in this case Taskwarrior, optimized around one strong opinion
      rather than a broad collaboration platform.
  project-history:
    - >
      The GitHub repository was created in December 2018. The README frames dstask as
      similar to Taskwarrior, but with Git-based synchronization instead of a special
      sync protocol and with one Markdown note page per task.
    - >
      The project kept a deliberately personal scope: the README calls collaboration a
      non-feature and points users to other systems for multi-person projects. Its
      features instead center on contexts, task notes, URL opening, shell completions,
      import tools, and Git-backed undo and sync.
  related-projects:
    - Taskwarrior is the main comparison point and migration source named by the README.
    - password-store is named by the README as an inspiration for Git-powered sync and undo.
    - GitHub Issues can be imported through dstask's import tool.
  sources:
    - https://github.com/naggie/dstask
    - https://api.github.com/repos/naggie/dstask
    - https://api.github.com/repos/naggie/dstask/releases
    - https://formulae.brew.sh/api/formula/dstask.json
  summary:
    - >
      dstask is a single-binary terminal task and notes manager that stores personal
      tasks in a Git repository. It belongs to the terminal productivity lineage around
      Taskwarrior, todo.txt, password-store style Git sync, and plain-text-ish personal
      data.
  timeline:
    - '2018-12: The dstask GitHub repository is created.'
    - '2020-11: GitHub releases show the v0.23 series.'
    - '2025-11: GitHub releases show the 1.0 release.'
    - '2026-01: Homebrew and GitHub releases package v1.0.1.'
  usage:
    - >
      Users create or clone a `~/.dstask` Git repository for task data, then use
      commands such as `add`, `next`, `done`, `note`, `context`, `sync`, and `git`. The
      tool can import GitHub issues or Taskwarrior tasks.
    - >
      Because storage and sync are just Git, dstask is attractive to users who already
      trust command-line merge conflict resolution and want portable task state without
      a dedicated service.
related-packages:
  - id: brew:task
    reason: >
      Choose Taskwarrior for a broader and longer-established terminal task database
      with reports, hooks, recurrence, and its own ecosystem; dstask identifies it as
      the closest analogue and supports importing its tasks.
    rel: alternative
    sources:
      - https://github.com/naggie/dstask#readme
      - https://taskwarrior.org/docs/
  - id: brew:todo-txt
    reason: >
      Choose Todo.txt CLI when human-readable plain-text files and a minimal shell-based
      format matter more than dstask's Git repository and per-task Markdown notes.
    rel: alternative
    sources:
      - https://github.com/naggie/dstask#readme
      - https://github.com/todotxt/todo.txt-cli#readme
  - id: brew:fzf
    reason: >
      Use fzf with dstask to select task IDs interactively; dstask's README provides a
      shell wrapper and an advanced integration script for this workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/naggie/dstask#readme
      - https://github.com/junegunn/fzf#readme
