history:
  adoption-history:
    - >
      Pally distributes the Companion as an optional macOS component rather than the
      primary user interface. The main service is accessed through messaging channels,
      while the Companion extends it to locally granted Mac resources and LinkedIn,
      Apple Notes, terminal, and coding-agent workflows.
    - >
      The official changelog shows rapid service development during 2026, including work
      on Mac sleep controls, message synchronization, account connections, and isolated
      Cloud Macs.
  package-nerd-significance:
    - >
      The Homebrew cask is useful because it makes an otherwise optional desktop bridge
      reproducibly installable alongside command-line and GUI tools. The Companion is
      also a representative example of AI assistants moving from a standalone chat
      window toward permission-scoped access to local files, terminals, coding agents,
      and desktop automation.
    - >
      Its trust boundary matters to package users: the official privacy documentation
      says folder grants and discovered repository metadata remain associated with the
      local Mac workflow, LinkedIn sessions remain in macOS Keychain, and screen or
      accessibility access must be explicitly granted.
  project-history:
    - >
      Pally Technologies developed Pally around a text-first personal-assistant model
      intended to remember context, follow up, research, communicate, and act through
      connected services. The company presents messaging—not a desktop application—as
      the normal interface.
    - >
      The macOS Companion was introduced as an optional bridge for capabilities that
      require a user's Mac, including LinkedIn access, Apple Notes access,
      selected-folder and terminal operations, screen viewing, accessibility control,
      and local coding-agent sessions.
  related-projects:
    - >
      The Companion connects the Pally service to macOS facilities and can participate
      in workflows involving iMessage, Apple Notes, LinkedIn, local Git repositories,
      terminals, and third-party coding agents.
    - >
      Pally also offers an optional Cloud Mac, which is distinct from installing the
      Companion on the user's own Mac.
  sources:
    - https://pally.com/
    - https://pally.com/privacy
    - https://pally.com/recipes/your-mac-from-anywhere
    - https://pally.com/story
    - https://pally.com/whats-new
  summary:
    - >
      Pally Companion is the optional macOS bridge for Pally, a text-based AI personal
      assistant. It lets the service perform user-authorized work involving the Mac's
      screen, applications, selected folders, terminal, coding tools, LinkedIn, and
      Apple Notes.
  timeline:
    - >
      2026: Pally's official changelog documents active development of its assistant,
      Mac controls, message synchronization, and Cloud Mac facilities.
  usage:
    - >
      Users install the Companion and grant only the Mac capabilities they want Pally to
      use, such as Screen Recording, Accessibility, selected folders, Photos, Notes, or
      terminal control. Read-only inspection and state-changing actions have different
      approval behavior documented by Pally.
    - >
      The Companion is useful when a request cannot be completed solely through Pally's
      text and cloud integrations—for example checking an application on a remote Mac,
      running a command in an approved folder, operating a desktop interface, or
      searching locally mediated LinkedIn or Notes data.
