config-file-location:
  unix:
    - build.envd
credentials-file-location: null
history:
  adoption-history:
    - >
      envd is distributed through several developer channels: the README documents pip
      installation, direct GitHub release binaries, and bootstrap after installation,
      while Homebrew packages it as `envd`. Homebrew analytics showed low hundreds of
      annual installs during this run, consistent with a specialized AI/ML
      infrastructure tool.
  package-nerd-significance:
    - >
      envd is a packaging-adjacent tool because it treats development environments
      themselves as declarative artifacts. For package nerds, it sits at the
      intersection of language package managers, OCI images, BuildKit caching, and
      reproducible developer onboarding.
  project-history:
    - >
      The README presents envd as a reaction to fragile AI/ML development setups, where
      Python packages, CUDA, shell scripts, and Dockerfiles often break together. Its
      core promise is to replace hand-written environment assembly with a simple
      declaration plus `envd up`.
    - >
      The project builds OCI-compatible images and uses technologies such as Docker and
      BuildKit. Its documentation also covers local and Kubernetes-backed contexts,
      remote builds, package caches, Jupyter setup, and reusable build functions
      imported from Git repositories.
  related-projects:
    - >
      envd builds on Docker, BuildKit, OCI images, conda, Python packaging, Jupyter, and
      Kubernetes.
    - >
      envdlib is documented as a reusable library of envd build functions imported from
      Git repositories.
  sources:
    - https://github.com/tensorchord/envd/blob/main/README.md
    - https://envd.tensorchord.ai/guide/getting-started
    - https://formulae.brew.sh/formula/envd
  summary:
    - >
      envd is TensorChord's command-line tool for creating container-based development
      environments for AI and machine-learning work. It uses a Python-like `build.envd`
      declaration to turn Python, CUDA, shell, Jupyter, and container setup into a
      repeatable environment.
  timeline:
    - '2022: TensorChord copyright and envd documentation identify the project era.'
    - '2020s: envd documents pip, release-binary, and Homebrew installation paths.'
    - >
      2020s: envd expands beyond local containers with remote build, cache, and
      Kubernetes-oriented documentation.
  usage:
    - >
      A typical workflow installs envd, runs `envd bootstrap`, creates or clones a
      project with a `build.envd` file, and runs `envd up` to build and attach to the
      containerized environment. The example manifest installs conda, Python, Python
      packages, a shell, and optional Jupyter support.
    - >
      The package is especially relevant where reproducibility and GPU/container setup
      matter: local notebooks, remote build machines, Kubernetes clusters, and teams
      sharing environment definitions.
related-packages:
  - id: brew:docker
    reason: >
      Use Docker alongside envd because Docker is an upstream-documented requirement and
      provides the container ecosystem on which envd builds its reproducible development
      environments.
    rel: adjacent_workflow
    sources:
      - https://envd.tensorchord.ai/guide/getting-started
      - https://envd.tensorchord.ai/faq/comparison
      - https://docs.docker.com/get-started/docker-overview/
