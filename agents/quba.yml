history:
  adoption-history:
    - >
      Quba broadened from an initial Windows release to Linux and macOS during 2021.
      Later releases added multilingual support, drag-and-drop, command-line file
      opening, online validation, UBL credit notes, Order-X visualization, search, and a
      manual.
    - >
      The project's homepage identifies Quba as part of a small electronic-invoicing
      ecosystem alongside Mustangproject, whose focus is machine processing and
      validation rather than Quba's human-readable presentation.
  package-nerd-significance:
    - >
      Quba is useful in package catalogs because it provides a free, open-source desktop
      inspection tool for structured European invoice formats that otherwise often
      require accounting software or specialized validation services. Its
      Electron-based, cross-platform distribution also makes it available through
      multiple desktop packaging ecosystems.
  project-history:
    - >
      Quba began as a viewer for XRechnung invoices using UN/CEFACT CII. It subsequently
      added PDF and hybrid Factur-X/ZUGFeRD support, then expanded format coverage and
      validation features.
    - >
      The project is maintained in the ZUGFeRD organization and is related to
      Mustangproject. Its name follows an equine theme associated with the Forum
      elektronische Rechnung Deutschland, the initiator of Factur-X/ZUGFeRD.
  related-projects:
    - >
      Mustangproject is Quba's sister project for creating, reading, and validating
      electronic invoices.
    - Mustangserver exposes related electronic-invoice functionality as a hosted REST API.
  sources:
    - https://github.com/ZUGFeRD/quba-viewer
    - https://github.com/ZUGFeRD/quba-viewer/releases
    - https://quba-viewer.org/
  summary:
    - >
      Quba-Viewer is an open-source, cross-platform desktop application for presenting
      structured XML invoices and hybrid PDF/XML invoices in a human-readable form. It
      supports formats in the European electronic-invoicing ecosystem, including
      XRechnung, Factur-X/ZUGFeRD, UBL credit notes, and Order-X.
  timeline:
    - '2021-03-31: Initial Windows release with XRechnung CII support.'
    - '2021-04: Linux and macOS releases follow.'
    - '2021-07: PDF and Factur-X/ZUGFeRD support is added.'
    - '2022-09: Online validation through Mustangserver is added.'
    - '2023-04: UBL credit-note support is added.'
    - '2024-01: Order-X visualization and renewed online validation arrive.'
    - '2025-05: Search, ZUGFeRD 1 support, and a manual are added.'
  usage:
    - >
      Users open or drag electronic-invoice files into Quba to inspect their structured
      contents and, for hybrid invoices, compare the embedded invoice data with the PDF
      presentation.
    - >
      Quba is primarily a viewer; the official site distinguishes its human-readable
      presentation role from Mustangproject's machine-oriented creation, parsing, and
      validation work.
