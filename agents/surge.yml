history:
  adoption-history:
    - >
      Surge developed across separate macOS and iOS products sharing a core engine and
      profile format. The official legacy archive preserves Mac releases 2 through 5,
      while the current line continues with Surge Mac 6 and frequent feature releases.
  package-nerd-significance:
    - >
      Surge is unusual among packaged macOS network utilities because a polished native
      interface sits over a portable, plain-text profile format. Advanced users can
      combine rule-based routing, proxies, DNS control, HTTPS inspection, scripting, an
      HTTP API, and the bundled surge-cli.
    - >
      Its profiles and automation interfaces make it useful both as an interactive
      debugging application and as reproducible, scriptable network infrastructure on a
      workstation or gateway Mac.
  project-history:
    - >
      Surge evolved from a proxy and traffic-routing client into a broad network toolbox
      for developers and advanced users. Later Mac releases added virtual-interface
      capture, gateway and DHCP capabilities, Ponte connectivity, scripting, dashboards,
      and command-line automation.
    - >
      Surge Mac 6 replaced the earlier paid-major-upgrade model with an optional
      maintenance subscription while allowing customers to continue using versions
      already unlocked.
  related-projects:
    - >
      Surge iOS shares the core engine and most of the profile format with Surge Mac.
      The wider official ecosystem includes Surge Dashboard, surge-cli, Surge Ponte, and
      the Snell proxy server.
  sources:
    - https://kb.nssurge.com/surge-knowledge-base/release-notes/surge-mac-6
    - https://kb.nssurge.com/surge-knowledge-base/release-notes/surge-mac-legacy
    - https://manual.nssurge.com/
    - https://manual.nssurge.com/profile/format.html
    - https://nssurge.com/support/mac/release-notes
  summary:
    - >
      Surge Mac is a programmable network toolbox and web-debugging proxy for macOS,
      supporting traffic capture, rule-based routing, proxy protocols, DNS
      customization, HTTPS inspection, scripting, and gateway operation.
  timeline:
    - 'Before 2025: Surge Mac progressed through major versions 2, 3, 4, and 5.'
    - >
      2025-06-30: Surge Mac 6.0 was released with a redesigned interface and expanded
      gateway capabilities.
    - >
      2026: Surge Mac 6 added broader surge-cli automation and packaged instructions for
      AI-agent control.
  usage:
    - >
      Users create or import plain-text profiles that define general networking
      behavior, proxy policies, policy groups, DNS handling, rules, rewrites, scripts,
      and optional MITM behavior. Surge can capture the local Mac's traffic or operate
      in gateway mode for other devices, and its bundled CLI can inspect state, switch
      profiles, run diagnostics, and control the application.
