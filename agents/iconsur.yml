id: brew:iconsur
display-name: IconSur
repo: https://github.com/rikumi/iconsur
docs:
  - https://github.com/rikumi/iconsur#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project distributed through npm first and later became available through
      Homebrew. Its README documents both brew install iconsur and npm install -g
      iconsur as installation paths.
    - >
      Homebrew packages iconsur as a macOS-only formula with Node and Python-related
      support, reflecting the tool's hybrid shell, JavaScript, and macOS automation
      surface.
  package-nerd-significance:
    - >
      IconSur is a small but very package-manager-shaped tool: it packages a
      platform-specific aesthetic tweak as a repeatable CLI command. It matters less as
      a general image converter and more as a snapshot of the Big Sur icon-customization
      moment in Mac tooling.
  project-history:
    - >
      IconSur appeared during the macOS Big Sur design transition, when app icons moved
      toward rounded-square, depth-styled iconography. Its README describes a CLI that
      can search for a related iOS App Store icon or generate an icon locally from the
      original app icon with configurable background color and scaling.
    - >
      The npm package record shows the iconsur package created on 2020-06-27, matching
      the Big Sur-era demand for replacing or normalizing third-party macOS app icons.
  related-projects:
    - >
      The README credits LiteIcon as inspiration and fileicon by mklement0 for
      icon-customization scripting. It is also adjacent to macOS Big Sur replacement
      icon sets and other app-icon generators.
  sources:
    - >
      Homebrew metadata documents the brew formula, macOS-only packaging, dependencies,
      and source tarball.
    - >
      The project README documents purpose, installation, command examples, options, and
      credits.
    - npm registry metadata provides package creation and repository information.
  summary:
    - >
      IconSur is a macOS command-line tool for generating Big Sur-style adaptive app
      icons for third-party applications.
  timeline:
    - '2020: iconsur package is created on npm.'
    - >
      2020: README describes Big Sur-style adaptive icon generation using related iOS
      App Store icons or local source icons.
    - '2020s: Homebrew formula packages iconsur for macOS users.'
  usage:
    - >
      The documented workflow is to run iconsur set against a .app bundle, refresh the
      icon cache with iconsur cache, and optionally use flags for App Store region,
      local generation, input icon, scale, and color.
    - >
      The README also documents an unset command, making the tool reversible for users
      experimenting with app icon theming.
related-packages:
  - id: brew:fileicon
    reason: >
      Use fileicon alongside IconSur for lower-level setting, removing, extracting, or
      testing of macOS custom icons; IconSur explicitly credits its icon-customization
      script.
    rel: adjacent_workflow
    sources:
      - https://github.com/rikumi/iconsur#credits
      - https://github.com/mklement0/fileicon#readme
