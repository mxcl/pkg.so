id: brew:gnu-indent
display-name: GNU indent
repo: https://git.savannah.gnu.org/cgit/indent.git
docs:
  - https://www.gnu.org/software/indent/manual/indent.html
config-file-location:
  unix:
    - $INDENT_PROFILE
    - $PWD/.indent.pro
    - ~/.indent.pro
credentials-file-location: null
history:
  adoption-history:
    - >
      GNU indent became part of the long-lived GNU command-line toolchain for projects
      that wanted reproducible C formatting before newer formatters became widespread.
      Its homepage points users to GNU mirrors, Savannah development, Info and man
      documentation, and the GNU bug-tracking workflow, placing it in the same
      distribution culture as other standalone GNU utilities.
  package-nerd-significance:
    - >
      For package maintainers, GNU indent is a small but characteristic GNU utility:
      mostly invoked as a build or maintenance tool, sensitive to C dialect details, and
      useful when a project wants GNU formatting behavior rather than the indent variant
      supplied by another Unix.
  project-history:
    - >
      The GNU manual records Free Software Foundation copyright years beginning in 1989
      and describes behavioral changes across early GNU indent releases, including
      GNU-style indentation as the default from version 1.2 and a revised command format
      from version 1.3. The formatter retained compatibility concepts from older indent
      implementations, including an option preset for the original Berkeley style, while
      making GNU style a first-class default.
  related-projects:
    - >
      GNU indent belongs to the family of Unix source-formatting tools and is often
      compared with BSD indent and newer C-family formatters such as clang-format.
  sources:
    - https://git.savannah.gnu.org/cgit/indent.git/plain/NEWS
    - https://www.gnu.org/software/indent/
    - https://www.gnu.org/software/indent/manual/indent.html
  summary:
    - >
      GNU indent is the GNU Project's C source formatter, a command-line tool for
      changing whitespace and layout without changing program meaning. Its manual
      describes it as a formatter for C programs that can make code easier to read and
      convert between styles.
  timeline:
    - '1989: GNU indent manual copyright history begins in the Free Software Foundation manual.'
    - 'Version 1.2: GNU style became the default indentation style.'
    - 'Version 1.3: GNU indent adopted the command forms documented in later manuals.'
    - '2023: Release notes for version 2.2.13 describe fixes and translation updates.'
  usage:
    - >
      Practitioners use GNU indent to reformat C source files, write formatted output to
      a separate file or standard output, and select known style presets such as GNU,
      K&R, Berkeley, or Linux. It also supports a profile file mechanism, so teams or
      individual developers can keep repeated formatting options outside the command
      line.
related-packages:
  - id: brew:clang-format
    reason: >
      clang-format is a broader alternative for C-family and several other languages,
      with project configuration and editor integrations; choose GNU indent for
      traditional C-only formatting and its established style presets.
    rel: alternative
    sources:
      - https://www.gnu.org/software/indent/manual/indent.html
      - https://clang.llvm.org/docs/ClangFormat.html
  - id: brew:astyle
    reason: >
      Artistic Style is an alternative formatter for C, C++, Objective-C, C#, and Java
      that can also be embedded as a library, while GNU indent focuses on command-line C
      formatting.
    rel: alternative
    sources:
      - https://www.gnu.org/software/indent/manual/indent.html
      - https://astyle.sourceforge.net/
      - https://astyle.sourceforge.net/astyle.html
