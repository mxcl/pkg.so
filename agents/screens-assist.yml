history:
  adoption-history:
    - >
      Edovia positions Screens Assist as a free utility for occasional remote help,
      particularly assistance for family, friends, and clients. Unlike persistent
      Screens Connect installations, a person at the remote Mac must approve the
      incoming request.
  package-nerd-significance:
    - >
      Screens Assist provides a narrowly focused, native macOS alternative to
      configuring permanent VNC access: launch a small utility, share a generated link,
      and explicitly approve the session. Its Homebrew Cask availability makes that
      support-side setup reproducible.
  project-history:
    - >
      Edovia introduced Screens Assist alongside Screens 3.5 under the provisional name
      Screens Express before renaming it. Screens Assist 2 was released in April 2025
      after being redesigned to reduce setup friction and make its privileged helper
      optional.
  related-projects:
    - Screens is the Edovia remote-desktop client used by the assisting party.
    - >
      Screens Connect is Edovia's companion for persistent access to personally owned or
      regularly accessed computers.
    - macOS Screen Sharing supplies the underlying host capability.
  sources:
    - https://blog.edovia.com/en-GB/screens-assist-2-now-in-beta
    - https://blog.edovia.com/en/screens-3-5-for-mac-now-available/
    - https://edovia.com/en/screens-assist
    - https://help.edovia.com/en-GB/screens-connect-5/faq/scr-sc-sa
    - https://help.edovia.com/en/screens-assist/getting-started/quick-setup-guide-sa2
  summary:
    - >
      Screens Assist is Edovia's macOS utility for establishing temporary, user-approved
      remote-support sessions with the Screens client.
  timeline:
    - >
      2014: Screens Assist was introduced with Screens 3.5 after initially being called
      Screens Express.
    - '2025: Edovia released the redesigned Screens Assist 2 with an optional helper tool.'
  usage:
    - >
      The person receiving help launches Screens Assist, enables Screen Sharing when
      prompted, and shares its generated connection link. The helper opens that link in
      Screens, after which the remote Mac user approves or denies the request.
    - >
      An optional privileged helper can enable required sharing options and restore
      their prior state when the session ends. No permanent Screens Connect account is
      required, and Edovia says the remote Mac's login credentials do not need to be
      shared.
