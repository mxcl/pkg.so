history:
  project-history:
    - >
      The tool's model is intentionally opinionated. Its README documents a five-step
      flow: initialize a target set of repositories, clone them, run a script and
      preview diffs, push commits and open pull requests, then merge the resulting PRs.
      It supports GitHub and GitLab workflows and exposes the `mp` executable through
      package managers such as Homebrew.
  sources:
    - >
      https://engineering.clever.com/2017/12/11/mo-repos-mo-problems-how-we-make-changes-across-many-git-repositories/
    - https://formulae.brew.sh/formula/microplane
    - https://github.com/Clever/microplane
    - https://github.com/Clever/microplane/blob/master/docs/mp.md
    - https://www.jvt.me/posts/2023/01/21/bulk-git-repo-changes/
  summary:
    - >
      microplane is Clever's command-line tool for making coordinated Git changes across
      many repositories. It grew out of Clever's microservice-heavy engineering
      environment: a 2017 Clever Engineering post described more than 500 repositories
      and a Go 1.8 to 1.9 migration that touched nearly 200 of them. Nathan Leiby and
      Rafael Garcia designed microplane during a hackathon to make those broad edits
      less manual while preserving the pull-request workflow.
  usage:
    - >
      Its package-manager niche is multi-repository maintenance, especially for
      organizations that chose many service repositories instead of a monorepo. Related
      tools named by the upstream project include Skyscanner's Turbolift and Octoherd;
      all solve variations of the same problem of safely applying repetitive changes
      across repository fleets.
