history:
  adoption-history:
    - >
      SysEx Librarian became a durable utility for owners of synthesizers and other MIDI
      hardware that expose patch backups or firmware operations through System Exclusive
      messages. Its official release history shows support spanning the PowerPC-to-Intel
      transition and later modernization for current macOS APIs.
    - >
      The application is distributed as free software, its source is BSD-licensed, and
      Homebrew Cask packages the signed application as `sysex-librarian`.
  package-nerd-significance:
    - >
      SysEx Librarian preserves a specialized hardware-management workflow that
      general-purpose file tools cannot replace: moving vendor-specific binary state
      between a Mac and MIDI equipment, including older devices that require slower
      transfers. Its open-source MIDIApps codebase is also a practical CoreMIDI
      reference.
  project-history:
    - >
      Snoize developed SysEx Librarian as a focused Mac utility for sending and
      receiving MIDI System Exclusive messages. By its 2006 version 1.1 release it was a
      Universal PowerPC/Intel application, and its source code was publicly available.
    - >
      The project continued through multiple macOS generations. Version 1.5 in 2021
      modernized and rewrote the application in Swift and newer APIs, explicitly aiming
      to keep it working for another twenty years.
  related-projects:
    - >
      MIDI Monitor, the companion Snoize application maintained in the same MIDIApps
      repository.
    - SnoizeMIDI, the repository's framework for CoreMIDI device discovery and MIDI streams.
  sources:
    - 'Official documentation: https://www.snoize.com/SysExLibrarian/docs'
    - 'Official product and release-history page: https://www.snoize.com/SysExLibrarian/'
    - 'Official source repository: https://github.com/krevis/MIDIApps'
    - source_facts.package-manager
  summary:
    - >
      SysEx Librarian is a free, open-source macOS utility for recording, organizing,
      inspecting, and transmitting MIDI System Exclusive messages, most commonly to back
      up synthesizer patches or send device firmware.
  timeline:
    - >
      2006: Version 1.1 became a Universal PowerPC/Intel application and made source
      code available.
    - '2009: Version 1.2.1 improved MIDI-interface handling and incoming-message stability.'
    - '2021: Version 1.5 modernized the application and rewrote it in Swift.'
    - '2022: Version 1.5.1 updated platform support and repaired program-change listening.'
    - >
      2023: Version 1.5.2 improved launch behavior for libraries containing files on
      unavailable network volumes.
  usage:
    - >
      To back up a device, start recording in SysEx Librarian and initiate a SysEx dump
      on the hardware. To restore or transmit data, add a `.syx` or compatible MIDI
      file, choose the destination port, and play it.
    - >
      Recorded data is stored by default in `~/Documents/SysEx Librarian`, although the
      data-folder location is configurable. Transfer speed, pauses, receive timeout, and
      buffer size can be adjusted for older or sensitive devices.
