id: cask:eclipse-jee
display-name: Eclipse IDE for Enterprise Java and Web Developers
repo: https://github.com/eclipse-packaging/packages
docs:
  - https://help.eclipse.org/latest
config-file-location:
  macos:
    - <Eclipse.app>/Contents/MacOS/eclipse.ini
credentials-file-location:
  unix:
    - ~/.eclipse/org.eclipse.equinox.security
  windows:
    - '%USERPROFILE%\.eclipse\org.eclipse.equinox.security'
history:
  adoption-history:
    - >
      EPP made task-specific Eclipse installations available from the main download
      site. Its 2013 release review reported millions of downloads across EPP packages;
      that statement does not isolate the Java EE edition.
  package-nerd-significance:
    - >
      The package illustrates Eclipse's distribution model: independently developed
      features are assembled into a tested IDE product. EPP maintains product
      definitions and produces platform-specific distributions from the coordinated
      release.
  project-history:
    - >
      The Java EE developer download was among the profile-based packages EPP introduced
      with the 2007 Europa release.
    - >
      The package family is now presented as Eclipse IDE for Enterprise Java and Web
      Developers, reflecting its broader enterprise and web tooling.
  related-projects:
    - Eclipse Packaging Project; Eclipse Platform; Java Development Tools; Web Tools Platform.
  sources:
    - >
      [EPP 2013 release
      review](https://projects.eclipse.org/projects/technology.packaging/reviews/eclipse-packaging-project-2.0.0-release-review).
    - >
      [EPP historical release
      description](https://projects.eclipse.org/projects/technology.packaging/releases/1.3.0).
    - '[EPP product definitions](https://github.com/eclipse-packaging/packages).'
    - '[Official package listing](https://www.eclipse.org/downloads/packages/).'
  summary:
    - >
      This Eclipse distribution combines a Java IDE with tools for enterprise
      applications and web development.
  timeline:
    - '2007: EPP delivers a Java EE developer package with Europa.'
    - '2013: EPP reports millions of downloads across its package family.'
  usage:
    - >
      The bundle supports Java and web application work, including JavaScript,
      TypeScript, server-side Java technologies, persistence, data tooling and Maven
      integration.
tags:
  - eclipse
  - enterprise-java
  - ide
  - java
  - maven
  - web-development
provenance:
  category-sources:
    - >
      [Official Eclipse packages](https://www.eclipse.org/downloads/packages/):
      enterprise Java and web development bundle.
  display-name-sources:
    - >
      [Official package listing](https://www.eclipse.org/downloads/packages/) supplies
      the current name for the Java EE package family.
  docs-sources:
    - '[Eclipse Help](https://help.eclipse.org/latest/): official IDE and component manuals.'
    - >
      [Running
      Eclipse](https://help.eclipse.org/latest/topic/org.eclipse.platform.doc.user/tasks/running_eclipse.htm):
      documents Contents/MacOS/eclipse.ini within the macOS application bundle; the
      installation prefix varies.
    - >
      [Secure storage runtime
      options](https://help.eclipse.org/latest/topic/org.eclipse.platform.doc.user/reference/ref-securestorage-options.htm):
      home-relative Equinox storage, normalized here for Unix and Windows;
      -eclipse.keyring overrides the location. Path confidence is medium because
      installation/runtime choices can differ.
  history-sources:
    - >
      [EPP 2013 release
      review](https://projects.eclipse.org/projects/technology.packaging/reviews/eclipse-packaging-project-2.0.0-release-review).
    - >
      [EPP historical release
      description](https://projects.eclipse.org/projects/technology.packaging/releases/1.3.0).
    - '[EPP product definitions](https://github.com/eclipse-packaging/packages).'
    - '[Official package listing](https://www.eclipse.org/downloads/packages/).'
  repo-sources:
    - >
      [Official EPP repository](https://github.com/eclipse-packaging/packages) contains
      Eclipse IDE product definitions and explicitly lists epp.package.jee. This is the
      distribution repository; constituent tools have separate repositories.
  tags-sources:
    - >
      [Official package listing](https://www.eclipse.org/downloads/packages/): included
      development tools.
category-confidence: high
category-path:
  - developer-tools
  - ide
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
