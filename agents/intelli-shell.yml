history:
  adoption-history:
    - >
      IntelliShell spread through direct install scripts, standalone binaries, Homebrew,
      Nix, and Arch packaging. Its official README advertises support for Bash, Zsh,
      Fish, Nushell, and PowerShell, which helps explain why it is packaged as a
      cross-shell tool rather than as a plugin for one shell ecosystem.
  package-nerd-significance:
    - >
      For package nerds, IntelliShell is part of the post-Atuin wave of
      shell-history-adjacent tools: it does not replace chronological history, but turns
      repeated command lines into structured data. It is also a tidy Rust CLI packaging
      case because it ships one binary, cross-shell integration, completions, and
      prebuilt release assets.
  project-history:
    - >
      The GitHub repository was created in January 2023. Early public releases in March
      and May 2023 show the project beginning as a focused terminal productivity tool,
      while later 3.x releases expanded its template, suggestion, shell-integration, and
      AI features. The project documentation grew into an mdBook hosted on GitHub Pages.
  related-projects:
    - >
      The docs explicitly compare IntelliShell with built-in shell history and Atuin.
      Its TLDR import feature also places it near tldr-pages, cheatsheet tools, and
      command-snippet managers.
  sources:
    - >
      Official README, official mdBook, GitHub release metadata, GitHub repository
      metadata, and Homebrew formula metadata.
  summary:
    - >
      IntelliShell is a Rust command-template and snippet manager for shells. Its
      official docs position it as complementary to shell history: history recalls what
      a user already typed, while IntelliShell stores reusable command recipes with
      variables, aliases, sharing, TLDR imports, and optional AI-assisted generation.
  timeline:
    - '2023: The repository was created and early 0.1/0.2 releases were published.'
    - '2025: The 3.3 release series was published through GitHub releases.'
    - "2026: The 3.4 release series continued the tool's cross-shell command-library workflow."
  usage:
    - >
      The normal workflow is interactive: users bookmark commands from the terminal,
      search them through keybindings, fill `{{variables}}`, and import or export
      reusable command libraries. Project-local `.intellishell` files let teams share
      task recipes without adding a separate task runner.
related-packages:
  - id: brew:atuin
    reason: >
      Use Atuin to retain and search automatic chronological shell history alongside
      IntelliShell's curated templates; IntelliShell also documents importing Atuin
      history into its library.
    rel: adjacent_workflow
    sources:
      - https://github.com/lasantosr/intelli-shell#readme
      - https://lasantosr.github.io/intelli-shell/reference/import.html
      - https://docs.atuin.sh/
