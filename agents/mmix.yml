history:
  project-history:
    - >
      The software distributed as MMIXware makes the architecture usable as a teaching
      and research artifact. Knuth's MMIXware page describes CWEB programs for an
      assembler that converts symbolic MMIX code into object files, simulators for
      executing those object files, and the MMMIX meta-simulator for dynamic scheduling
      of a complex pipeline with configurable functional units, caches, branch
      prediction, and interrupts. The MMIX documentation specifies a 64-bit RISC machine
      with 256 general-purpose registers, fixed four-byte instructions, a 64-bit address
      space, and big-endian memory semantics.
  sources:
    - https://cs.stanford.edu/~knuth/mmixware.html
    - https://formulae.brew.sh/formula/mmix
    - https://mmix.cs.hm.edu/
    - https://mmix.cs.hm.edu/doc/mmix-doc.pdf
  summary:
    - >
      MMIX is Donald E. Knuth's 64-bit RISC architecture and accompanying software
      suite, created to replace MIX, the educational machine used in earlier volumes of
      The Art of Computer Programming. Knuth's documentation explains that by the 1990s
      MIX no longer represented modern architecture, so MMIX was designed as a cleaner
      RISC-style machine with help from figures including John Hennessy and Dick Sites.
      The Munich University of Applied Sciences MMIX site quotes Knuth's 2011 summary of
      the project: during the 1990s he designed a computer representative of modern
      machines yet easy to learn, completed preliminary software in 1999, and later
      froze MMIXware for use with TAOCP material.
  usage:
    - >
      In package-manager form, `mmix` is less an everyday developer dependency than a
      compact distribution of the TAOCP architecture tools: `mmix`, `mmixal`, `mmmix`,
      and `mmotype`. It is useful for readers working through Knuth's MMIX examples,
      educators teaching assembly language or architecture concepts, and hobbyists
      exploring a literate-programming implementation of a designed CPU rather than an
      industrial ISA.
