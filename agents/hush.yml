history:
  adoption-history:
    - >
      Hush has been distributed free of charge for Safari on Mac, iPhone, and iPad. Its
      official README records a public recommendation from John Gruber in January 2021,
      and development is conducted in a public repository.
  package-nerd-significance:
    - >
      Hush is notable as a tiny, open-source, native Safari content blocker whose main
      behavior is expressed through blocking rules. It focuses on cookie-consent and
      tracking nags rather than acting as a general-purpose advertisement blocker.
  project-history:
    - >
      Joel Arvidsson created Hush in 2020 as a privacy-oriented Safari content blocker.
      The project uses SwiftUI, supports Apple Silicon, and publishes its source under
      the MIT License.
    - >
      The project emphasizes local, declarative blocking: it reports no access to
      browsing habits or passwords, collects no behavior or crash telemetry, and does
      not require continuing configuration.
  related-projects:
    - >
      The repository credits the Fanboy List and distributes associated list material
      under the CC BY 3.0 license.
  sources:
    - 'Official project homepage: https://oblador.github.io/hush/'
    - 'Official repository and README: https://github.com/oblador/hush'
  summary:
    - >
      Hush is a free, open-source Safari content blocker for macOS, iPhone, and iPad
      that hides cookie-consent prompts and other privacy-invasive nags without
      collecting browsing data.
  timeline:
    - '2020: Joel Arvidsson began Hush and published it under the MIT License.'
    - '2021: The official README recorded a January recommendation by John Gruber.'
    - >
      2021: The project documented SwiftUI implementation and native support for Apple
      Silicon.
  usage:
    - >
      After installation, users enable Hush in Safari’s Extensions settings. It needs no
      ongoing configuration or maintenance.
    - >
      Hush hides selected scripts and page elements but does not accept or reject cookie
      consent on the user’s behalf. It intentionally does not block advertisements, and
      some sites cannot be filtered without breaking their functionality.
