history:
  adoption-history:
    - >
      The CommonMark site reports implementations for dozens of programming languages
      and lists adopters including Discourse, GitHub, GitLab, Reddit, Qt, Stack
      Overflow/Stack Exchange, and Swift. The batch input lists cmark packages across
      Homebrew, Alpine, Debian, Fedora, MacPorts, Nix, Arch, Ubuntu, and
      openSUSE/zypper.
  package-nerd-significance:
    - >
      cmark is important because it gives package ecosystems a small, fast, C99,
      dependency-light implementation of a standardized Markdown dialect. It is a common
      build or test dependency for projects that want Markdown rendering without
      inheriting each host language's quirks.
  project-history:
    - >
      CommonMark grew out of the need for an unambiguous Markdown specification after
      years of divergent Markdown implementations. The CommonMark site says the effort
      started in 2014 with implementers and large-scale Markdown users, and the cmark
      README credits John MacFarlane with the original library and program alongside
      contributors to parsing, optimization, links, emphasis, APIs, and tests.
  related-projects:
    - >
      cmark is related to the CommonMark spec, commonmark.js, cmark-gfm, Markdown.pl,
      Babelmark, and language bindings for Go, Haskell, Ruby, Lua, Perl, Python, R,
      Scala, and PHP listed in the README.
  sources:
    - https://commonmark.org/
    - https://spec.commonmark.org/
    - https://github.com/commonmark/cmark#readme
    - https://api.github.com/repos/commonmark/cmark
  summary:
    - >
      cmark is the C reference implementation of CommonMark, providing both a libcmark
      parsing/rendering library and a cmark command-line program. It exists to make
      Markdown behavior testable, portable, fast, and consistent across implementations.
  timeline:
    - >
      2004: Markdown is released by John Gruber with Aaron Swartz, providing the
      background problem CommonMark later addresses.
    - '2014: CommonMark publishes early spec versions, with 0.5 and 0.6 appearing in October.'
    - '2015: the current commonmark/cmark GitHub repository is created.'
    - >
      2024: CommonMark spec 0.31.2 is listed as the latest spec version on
      spec.commonmark.org.
  usage:
    - >
      The cmark program parses CommonMark documents and renders HTML, groff man, LaTeX,
      CommonMark, or XML AST output. The library exposes an AST for programmatic
      manipulation and is wrapped by bindings for multiple languages; the README also
      documents security behavior around raw HTML and unsafe links.
related-packages:
  - id: brew:cmark-gfm
    reason: >
      Choose cmark-gfm when output must follow GitHub Flavored Markdown extensions such
      as tables, task lists, strikethrough, and autolinks instead of baseline
      CommonMark.
    rel: alternative
    sources:
      - https://github.com/github/cmark-gfm#readme
      - https://github.github.com/gfm/
