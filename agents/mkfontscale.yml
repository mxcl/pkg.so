    - https://www.x.org/releases/current/doc/man/man1/mkfontscale.1.xhtml
  summary:
    - >
      mkfontscale is an X.Org command-line utility for the legacy X11 font system. Its
      manual states that the version shipped with X.Org was originally written by
      Juliusz Chroboczek for the XFree86 project and that its functionality was inspired
      by Joerg Pommnitz's ttmkfdir utility. The program scans scalable font files and
      writes index data that X11 font machinery can use; the related mkfontdir command
      creates fonts.dir files.
  usage:
    - >
      The package's role is infrastructural rather than application-facing. X.Org and
      downstream package managers keep it available for systems that still need X11 core
      font directories, scalable font indexes, or compatibility with older X font
      workflows. The freedesktop GitLab project describes it as utilities for creating
      the fonts.scale and fonts.dir index files used by the legacy X11 font system,
      while Homebrew packages it with freetype and libfontenc dependencies and installs
      both mkfontscale and mkfontdir.
related-packages:
  - id: brew:bdftopcf
    reason: >
      Use bdftopcf to compile BDF bitmap fonts into PCF files, then use mkfontscale's
      mkfontdir functionality to rebuild the legacy X11 font-directory index.
    rel: adjacent_workflow
    sources:
      - https://www.x.org/archive/X11R7.5/doc/man/man1/bdftopcf.1.html
      - https://www.x.org/releases/current/doc/man/man1/mkfontscale.1.xhtml
  - id: brew:xorg-server
    reason: >
      X.Org Server is the runtime environment that consumes traditional X font resources
      indexed by mkfontscale and mkfontdir.
    rel: adjacent_workflow
    sources:
      - https://www.x.org/wiki/Documentation
      - https://www.x.org/releases/current/doc/man/man1/mkfontscale.1.xhtml
