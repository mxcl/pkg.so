history:
  adoption-history:
    - >
      Trim Enabler served Mac owners using third-party SSDs across many macOS
      generations. Cindori's compatibility guidance maps Trim Enabler 2, 3, and 4 to
      releases from Snow Leopard through Big Sur, while directing Monterey-era users to
      the broader Sensei utility.
  package-nerd-significance:
    - >
      Trim Enabler represents a class of Mac system utilities made necessary when
      operating-system storage features were not automatically enabled for aftermarket
      hardware. Its evolution also tracks important macOS packaging constraints,
      including signed kernel extensions, privileged helper tools, runtime dependencies,
      and boot-time system changes.
  project-history:
    - >
      Cindori developed Trim Enabler to enable TRIM for SSDs on macOS. Early releases
      modified Apple's storage driver, but Yosemite's kernel-extension signing
      requirements made that approach unsafe; Cindori subsequently shipped a custom
      signed driver in Trim Enabler 3.4 and later.
    - >
      Trim Enabler 4 moved to Swift and, on older macOS releases, could require a
      separately installed Swift 5 runtime. The Big Sur-compatible generation
      streamlined activation to a switch-and-reboot workflow and applied TRIM
      system-wide across qualifying multiboot macOS installations. Cindori designated
      Big Sur as the final macOS release supported by Trim Enabler 4 and recommended
      Sensei for later systems.
  related-projects:
    - >
      Cindori's Disk Sensei and later Sensei products also provide TRIM enablement
      alongside broader disk and system monitoring.
    - >
      Apple's built-in trimforce facility addresses a related system-level use case,
      although Cindori's documentation focuses on its own supported applications.
  sources:
    - https://cindori.com/support/trim-enabler/general/choosing-your-version
    - https://cindori.com/support/trim-enabler/trim/trim-enabler-big-sur
    - https://cindori.com/support/trim-enabler/troubleshooting/enabling-trim-yosemite
    - https://cindori.com/support/trim-enabler/troubleshooting/installing-swift-runtime
  summary:
    - >
      Trim Enabler is a long-running Cindori system utility for enabling TRIM support on
      third-party SSDs installed in Macs.
  timeline:
    - >
      Yosemite era: Kernel-extension signing prompted a move from patching Apple's
      storage driver to a custom signed driver.
    - >
      2018: Retirement of TLS 1.0 on Cindori's servers disrupted online activation for
      legacy Trim Enabler 3, leading to an offline activation tool.
    - >
      Big Sur era: Trim Enabler 4 gained a streamlined system-wide activation method and
      reached its final supported macOS generation.
    - 'Monterey era: Cindori directed users to Sensei instead of Trim Enabler 4.'
  usage:
    - >
      Users select the Trim Enabler generation appropriate for their macOS release,
      enable TRIM in the application, and reboot. Because the utility changes low-level
      storage behavior, Cindori's version-specific compatibility and recovery guidance
      is operationally important.
