id: brew:forgejo-cli
display-name: Forgejo CLI
repo: https://codeberg.org/forgejo-contrib/forgejo-cli
docs:
  - https://codeberg.org/forgejo-contrib/forgejo-cli
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Forgejo CLI followed Forgejo's emergence as an independent software forge by
      filling the ecosystem gap for a first-class terminal client.
    - >
      The release API shows early 0.0.x releases in January 2024, v0.1.0 in August 2024,
      and continued releases through v0.5.0 in April 2026.
  package-nerd-significance:
    - >
      Forgejo CLI matters because every forge tends to accumulate a native command-line
      client: gh for GitHub, glab for GitLab, tea for Gitea, and fj for Forgejo.
    - >
      For package indexes, it is a good example of an ecosystem companion package whose
      identity is tied to a host application's API rather than to a standalone file
      format or runtime.
  project-history:
    - >
      The official Codeberg repository was created in July 2023 under forgejo-contrib.
      Its README describes a CLI that handles Forgejo-specific tasks alongside, rather
      than replacing, git.
    - >
      The project provides commands for issues, pull requests, repositories,
      organizations, teams, stars, watches, and releases, and points users to its
      Codeberg wiki for installation and usage details.
  related-projects:
    - >
      Forgejo CLI is related to Forgejo itself and to other forge CLIs named by its
      README: GitHub CLI gh, GitLab CLI glab, and Gitea's tea.
    - >
      It is hosted under forgejo-contrib, alongside other community-maintained Forgejo
      ecosystem projects.
  sources:
    - https://codeberg.org/api/v1/repos/forgejo-contrib/forgejo-cli
    - https://codeberg.org/api/v1/repos/forgejo-contrib/forgejo-cli/releases?limit=10
    - https://codeberg.org/forgejo-contrib/forgejo-cli
    - https://codeberg.org/forgejo-contrib/forgejo-cli/raw/branch/main/README.md
    - https://codeberg.org/forgejo-contrib/forgejo-cli/wiki/Installation
  summary:
    - >
      Forgejo CLI is fj, a command-line client for interacting with Forgejo instances.
      The README positions it as analogous to gh, glab, or tea, but for Forgejo.
  timeline:
    - '2023: The forgejo-contrib/forgejo-cli repository is created on Codeberg.'
    - '2024: v0.0.2 and v0.0.3 are published in January.'
    - '2024: v0.1.0 is published in August.'
    - '2025: v0.3.0 is published in May.'
    - '2026: v0.5.0 is published in April.'
  usage:
    - >
      Users install prebuilt binaries from the Codeberg releases tab or package-manager
      builds, then use fj to open, edit, comment on, close issues, create and merge pull
      requests, manage repositories and teams, and publish releases.
    - >
      The README explicitly says fj is not meant to replace git; it covers Forgejo API
      and hosting workflows that git itself does not handle.
related-packages:
  - id: brew:forgejo
    reason: >
      Forgejo CLI is a companion to Forgejo servers, providing terminal access to the
      server's collaboration and repository-management APIs.
    rel: adjacent_workflow
    sources:
      - https://codeberg.org/forgejo-contrib/forgejo-cli
      - https://forgejo.org/
  - id: brew:tea
    reason: >
      Choose Tea for the equivalent terminal workflow against Gitea instances; Forgejo
      CLI's README identifies Tea as the Gitea counterpart to `fj`.
    rel: alternative
    sources:
      - https://codeberg.org/forgejo-contrib/forgejo-cli/raw/branch/main/README.md
      - https://gitea.com/gitea/tea
  - id: brew:gh
    reason: >
      Choose GitHub CLI when the target forge is GitHub; it covers analogous issue,
      pull-request, release, repository, and API workflows.
    rel: alternative
    sources:
      - https://codeberg.org/forgejo-contrib/forgejo-cli/raw/branch/main/README.md
      - https://cli.github.com/manual/gh
  - id: brew:glab
    reason: >
      Choose GLab when the target forge is GitLab; it provides corresponding
      merge-request, issue, pipeline, release, and API commands.
    rel: alternative
    sources:
      - https://codeberg.org/forgejo-contrib/forgejo-cli/raw/branch/main/README.md
      - https://docs.gitlab.com/cli/
  - id: brew:git
    reason: >
      Use Git alongside `fj` for commits, branches, fetches, and pushes because Forgejo
      CLI explicitly handles forge APIs rather than replacing Git.
    rel: adjacent_workflow
    sources:
      - https://codeberg.org/forgejo-contrib/forgejo-cli/raw/branch/main/README.md
      - https://git-scm.com/docs
