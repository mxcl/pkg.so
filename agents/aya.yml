history:
  adoption-history:
    - >
      AYA packages graphical ADB operations into a cross-platform desktop interface,
      making Android device inspection and development tasks accessible to users who do
      not want to compose ADB commands manually. Official builds support macOS, Linux,
      and Windows.
  package-nerd-significance:
    - >
      AYA is useful to package enthusiasts as a desktop front end around the ubiquitous
      Android Debug Bridge. It brings device management, shell, Logcat, file,
      application, layout, process, and performance tools into one installable GUI.
  project-history:
    - >
      AYA was created as an open-source Electron desktop application and GUI wrapper for
      ADB. Its scope expanded beyond basic device control to include screen mirroring,
      application and file management, monitoring, layout inspection, Logcat, an
      interactive shell, and Android Virtual Device management.
  related-projects:
    - ADB is the underlying Android device-control tool.
    - >
      The official repository lists licia, luna, and vivy as supporting projects, and
      Echo as a related HarmonyOS-oriented project.
  sources:
    - 'Official documentation: https://aya.liriliri.io/guide/'
    - 'Official releases: https://github.com/liriliri/aya/releases'
    - 'Official repository: https://github.com/liriliri/aya'
  summary:
    - AYA is an open-source, cross-platform desktop GUI for Android Debug Bridge workflows.
  timeline:
    - >
      The public release series progressively added wireless-device workflows,
      virtual-device management, storage inspection, and broader Android development
      tooling.
  usage:
    - >
      Users connect Android devices and perform common ADB tasks through panels for
      device overview, files, installed applications, screenshots, Logcat, shell access,
      layout inspection, processes, performance, and WebView inspection.
