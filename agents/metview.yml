history:
  adoption-history:
    - >
      An ECMWF newsletter reported that by 1999 Metview was used in most ECMWF Member
      States as well as Brazil and Australia, including operational deployments on
      several Unix workstation families and Linux. Its current release notes continue to
      distinguish external releases from versions installed on ECMWF desktop and HPC
      systems.
  package-nerd-significance:
    - >
      Metview is notable in package collections because it is a full scientific
      workstation rather than a single-purpose command. Packaging it brings together a
      long-lived meteorological application and ECMWF libraries such as ecCodes and
      Magics for reproducible local weather-data workflows.
  project-history:
    - >
      ECMWF and Brazil's INPE/CPTEC developed Metview as a cooperative project, with
      assistance from Météo-France. Development began in 1991, the first internal ECMWF
      release arrived in December 1993, and Member States received it in October 1995.
    - >
      The workstation evolved with OpenGL graphics in Metview 2.0, a new user interface
      in Metview 3.0, and a substantially revised Metview 4. Later releases incorporated
      ecCodes and developed the Python interface alongside the original Macro language.
  related-projects:
    - >
      ECMWF's MARS provides meteorological archive access, ecCodes handles GRIB and BUFR
      data, and Magics supplies meteorological plotting capabilities used in the same
      software ecosystem.
  sources:
    - https://metview.readthedocs.io/en/latest/
    - https://metview.readthedocs.io/en/latest/overview.html
    - https://metview.readthedocs.io/en/latest/release_notes/version_5.2_updates.html
    - >
      https://www.ecmwf.int/en/elibrary/78551-metview-4-ecmwfs-next-generation-meteorological-workstation
    - >
      https://www.ecmwf.int/sites/default/files/elibrary/012000/14638-newsletter-no86-winter-199900_1.pdf
  summary:
    - >
      Metview is ECMWF's meteorological workstation for operational and research work.
      It combines data access, processing, and visualisation with an icon-based
      interface for interactive use and Python for batch processing.
  timeline:
    - '1991: Cooperative Metview development began.'
    - '1993: The first release became available to internal ECMWF users.'
    - '1995: Metview was released to ECMWF Member States.'
    - '2010: ECMWF presented Metview 4 as its next-generation meteorological workstation.'
    - '2018: Metview 5.2 was externally released with the Python interface in active use.'
  usage:
    - >
      Users retrieve or open GRIB, BUFR, MARS, ODB, NetCDF, ASCII, CSV, and geopoints
      data, then filter, process, inspect, and plot it interactively or from Python and
      Macro scripts.
related-packages:
  - id: brew:magics
    reason: >
      Use Magics with Metview because ECMWF documents that all Metview graphical output
      is generated through the Magics plotting library.
    rel: adjacent_workflow
    sources:
