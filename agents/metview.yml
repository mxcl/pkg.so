        https://metview.readthedocs.io/en/latest/tutorials/data_analysis_and_vis/working_with_graphical_output.html
      - https://confluence.ecmwf.int/display/MAGP/Magics
  - id: brew:eccodes
    reason: >
      Use ecCodes alongside Metview for the GRIB and BUFR decoding infrastructure
      required by its meteorological data workflows.
    rel: adjacent_workflow
