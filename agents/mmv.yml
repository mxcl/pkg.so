history:
  project-history:
    - >
      The distinctive feature is safety planning. The README and manpage both emphasize
      that mmv checks the whole multiple-file operation before doing it, avoiding
      unexpected deletion from target collisions and giving the user a chance to abort
      or skip offending parts. The installed command names also map to default tasks:
      `mmv` moves, `mcp` copies, `mad` appends, and `mln` links. That makes the Homebrew
      package a small POSIX-oriented file-management tool rather than a shell builtin
      replacement.
  sources:
    - https://formulae.brew.sh/formula/mmv
    - https://github.com/rrthomas/mmv
    - https://github.com/rrthomas/mmv/blob/master/AUTHORS
    - https://manpages.ubuntu.com/manpages/xenial/man1/mmv.1.html
    - https://unix.stackexchange.com/tags/mmv/info
  summary:
    - >
      mmv is a long-lived Unix command-line utility for moving, copying, appending, and
      linking groups of files by wildcard pattern. The maintained GitHub repository
      credits Vladimir Lanin as the original author and Reuben Thomas as maintainer. Its
      core idea is older and narrower than editor-driven bulk renamers: a source pattern
      captures wildcard groups, and a target pattern reuses them, so commands such as
      mass extension swaps or filename rearrangements can be expressed in one operation.
  usage:
    - >
      Its adoption is typical of classic Unix utilities: it appears in Linux
      distributions, MacPorts, Nix, Homebrew, and other package sets, and it is
      referenced in shell and Unix communities for batch renaming problems that plain
      `mv` does not solve. The package remains useful when a user wants predictable
      wildcard-based renaming without opening an editor or writing a one-off shell loop.
