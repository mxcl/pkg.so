history:
  adoption-history:
    - >
      Insync serves users seeking a native multi-account cloud-drive client, including
      Linux users for whom the vendor explicitly provides distribution support. Its
      selective-sync and external-drive features also target workflows beyond basic
      provider clients.
  package-nerd-significance:
    - >
      Insync is notable in package-manager culture as a proprietary application
      delivered through vendor packages and desktop casks rather than a public source
      repository. It is especially relevant to Linux users who need a desktop cloud-sync
      client.
  project-history:
    - >
      Insync developed as a third-party desktop synchronization client and now supports
      Google Drive, Microsoft OneDrive, and Dropbox across Linux, macOS, and Windows.
      Insync 3 represented a substantial redesign of the client.
  related-projects:
    - Google Drive
    - Microsoft OneDrive
    - Dropbox
  sources:
    - https://forums.insynchq.com/t/official-insync-3-formal-statement/15339
    - https://help.insynchq.com/
    - https://www.insynchq.com/
  summary:
    - >
      Insync is a proprietary cross-platform desktop client for synchronizing and
      managing files held in major cloud-storage services.
  timeline:
    - '2019: Insync published its formal statement concerning the redesigned Insync 3 client.'
  usage:
    - >
      Users authorize one or more cloud accounts, select files or folders to
      synchronize, and work with the resulting local copies through their normal file
      manager. Officially advertised workflows include selective sync, multiple
      accounts, network or external drives, and files located outside a single fixed
      sync folder.
