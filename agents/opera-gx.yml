  summary:
    - >
      Opera GX is Opera's gaming-oriented web browser, combining general browsing with
      resource controls, gaming services, and extensive interface customization.
  timeline:
    - '2019: Opera opened Opera GX early access for Windows during E3.'
    - '2021: Opera launched Opera GX Mobile for iOS and Android.'
    - '2022: Opera GX became available through the Epic Games Store.'
    - '2022: Opera reported that GX had passed twenty million monthly active users.'
  usage:
    - >
      Users employ GX as an everyday browser while using GX Control to limit CPU,
      memory, and network use, GX Corner to follow releases and deals, and Mods to
      customize appearance and sound. Built-in gaming and messaging integrations reduce
      switching between the browser and companion services.
