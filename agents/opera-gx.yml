history:
  adoption-history:
    - >
      Opera expanded GX from its initial Windows early-access release to macOS and, in
      June 2021, to iOS and Android. Opera reported more than nine million monthly
      active desktop users in March 2021 and more than twenty million monthly active
      users in December 2022, indicating substantial adoption beyond an experimental
      browser channel.
    - >
      Distribution through the Epic Games Store in 2022 further embedded GX in
      gaming-oriented software channels.
  package-nerd-significance:
    - >
      Opera GX is a prominent example of audience-specific browser packaging. It shares
      Opera's broader browser lineage while maintaining a separate application identity,
      release stream, feature set, and package-manager entry.
    - >
      Its resource limiters are also unusual among mainstream graphical browsers, giving
      users direct controls intended to reserve CPU, memory, and network capacity for
      games and streams.
  project-history:
    - >
      Opera opened early access to Opera GX for Windows during E3 on June 11, 2019. The
      initial release paired a gaming-inspired interface with CPU and memory controls,
      Twitch integration, customization, an ad blocker, and Opera's browser VPN.
    - >
      GX subsequently added network limiting, Discord and other sidebar integrations, GX
      Corner, extensive visual and audio customization, and a mod ecosystem. Opera
      launched a mobile edition during E3 in June 2021.
  related-projects:
