history:
  adoption-history:
    - >
      Kvazaar's adoption sits between video-coding research and practical media tooling.
      The official page notes support in FFmpeg and Libav, giving the encoder a route
      into de facto multimedia frameworks while preserving its role as an open research
      implementation.
  package-nerd-significance:
    - >
      Kvazaar is notable because video codecs often arrive as hard-to-package reference
      software or heavily optimized vendor stacks. Kvazaar gives package managers a
      BSD-licensed, cross-platform HEVC encoder with an academic provenance and ongoing
      benchmark-focused release notes.
  project-history:
    - >
      Ultra Video Group describes Kvazaar as an award-winning academic encoder developed
      since 2012. The project is implemented in C, optimized with SSE and AVX
      intrinsics, coordinated by Ultra Video Group, and developed on GitHub.
  related-projects:
    - >
      Kvazaar is related to the HEVC/H.265 standard, the HM reference encoder, FFmpeg,
      Libav, and other Ultra Video Group projects such as uvg266 and uvgKvazaarHW.
  sources:
    - https://github.com/ultravideo/kvazaar
    - https://github.com/ultravideo/kvazaar/releases/tag/v1.0.0
    - https://github.com/ultravideo/kvazaar/releases/tag/v2.1.0
    - https://github.com/ultravideo/kvazaar/releases/tag/v2.3.2
    - https://ultravideo.fi/kvazaar.html
  summary:
    - >
      Kvazaar is an academic open-source HEVC/H.265 video encoder developed by Ultra
      Video Group, aimed at portable, research-friendly, and high-performance encoding.
  timeline:
    - '2012: Development began on the academic HEVC/H.265 encoder.'
    - 'v1.0.0: Release notes reported major rate-distortion and speed improvements over v0.8.3.'
    - 'v2.1.0: License changed from LGPL-2.1 to BSD-3-Clause.'
    - >
      v2.3.2: Release focused on 10-bit encoding fixes and rate-control/cost-calculation
      improvements.
  usage:
    - >
      Kvazaar is used as a command-line HEVC encoder for YUV and Y4M-style workflows,
      targeting x86, x64, PowerPC, and ARM on Windows, Linux, and macOS. Its goals
      include coding efficiency close to HM, portability, real-time speed, and optimized
      compute and memory use.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Use FFmpeg with its `libkvazaar` encoder to add demuxing, filtering, audio
      processing, and container output around Kvazaar's HEVC encoding.
    rel: adjacent_workflow
    sources:
      - https://ffmpeg.org/ffmpeg-codecs.html#libkvazaar
      - https://ultravideo.fi/kvazaar.html
  - id: brew:x265
    reason: >
      Choose x265 as an alternative production-oriented H.265/HEVC encoder with a
      different implementation and tuning ecosystem; choose Kvazaar for its academic,
      research-friendly codebase.
    rel: alternative
    sources:
      - https://x265.readthedocs.io/en/stable/
      - https://ultravideo.fi/kvazaar.html
