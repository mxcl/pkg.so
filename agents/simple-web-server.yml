config-file-location:
  macos:
    - /Users/[USERNAME]/Library/Application Support/Simple Web Server/config.json
    - >
      /Users/[USERNAME]/Library/Containers/org.simplewebserver.simplewebserver/Data/Library/Application
      Support/Simple Web Server/config.json
  windows:
    - C:\Users\[USERNAME]\AppData\Roaming\Simple Web Server\config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The project retained the familiar graphical workflow of Web Server for Chrome
      while moving it into a standalone Electron application. Official releases provide
      desktop builds across macOS, Windows, and Linux, and community translation work
      has expanded the interface to numerous languages.
  package-nerd-significance:
    - >
      Simple Web Server is a GUI-oriented alternative to starting an ad hoc development
      server from a language runtime or configuring a production-grade server. Its
      continuation of a discontinued Chrome App also illustrates how developer utilities
      migrate between packaging ecosystems when a platform removes an application model.
  project-history:
    - >
      Terrence Eden's Simple Web Server was created as a continuation of Joe Kzahel's
      Web Server for Chrome in response to the retirement of Chrome Apps. The successor
      uses Electron and extends the earlier workflow with multiple simultaneous servers,
      background operation, SPA rewriting, HTTPS, authentication, plugins, and more
      granular request handling.
  related-projects:
    - >
      Web Server for Chrome is the predecessor whose workflow and code lineage Simple
      Web Server continues.
    - Electron supplies the cross-platform desktop runtime.
  sources:
    - https://github.com/terreng/simple-web-server
    - https://simplewebserver.org/
    - https://simplewebserver.org/docs/build
    - https://simplewebserver.org/docs/wsc
  summary:
    - >
      Simple Web Server is an open-source Electron desktop application for creating and
      managing local static-file web servers through a graphical interface.
  timeline:
    - >
      Chrome Apps retirement era: Simple Web Server was created to continue the Web
      Server for Chrome workflow.
    - >
      2025: Official releases continued expanding localization and server behavior
      across desktop platforms.
  usage:
    - >
      Users select a directory, choose a port, and start one or more local servers.
      Options cover directory listings, SPA fallback routing, LAN access, CORS, file
      uploads, custom error pages, HTTPS, HTTP Basic authentication, compression, and
      per-directory .swshtaccess rules.
