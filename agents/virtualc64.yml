history:
  adoption-history:
    - >
      VirtualC64 grew from an educational virtual-CPU environment into a complete C64
      emulator. Its portable core subsequently enabled browser-oriented spin-offs,
      including VC64Web and Neoartcr.
  package-nerd-significance:
    - >
      VirtualC64 combines a native Mac interface with a cycle-accurate emulation core
      and support for common disk, tape, program, and cartridge formats. It is relevant
      both to retro-computing users and developers embedding or testing a C64 core.
    - >
      The project separates the portable C++20 core from the app-facing experience and
      publishes an API reference, making it more reusable than a closed desktop-only
      emulator.
  project-history:
    - >
      Dirk W. Hoffmann originally conceived VirtualC64 as a virtual CPU environment for
      a one- or two-year computer-engineering course. Continued accuracy work expanded
      it into a full Commodore 64 emulator.
    - >
      The application is open source under the GNU General Public License. Its CPU core
      was later relicensed under the MIT license as the related Peddle project to permit
      broader reuse.
  related-projects:
    - Peddle is the separately reusable, MIT-licensed CPU core associated with VirtualC64.
    - VC64Web and Neoartcr are browser-focused spin-offs by other authors.
    - VICE ROM images are compatible, while free Mega65 replacement ROMs are also supported.
  sources:
    - https://dirkwhoffmann.github.io/VirtualC64/
    - https://dirkwhoffmann.github.io/VirtualC64/docs/index.html
  summary:
    - >
      VirtualC64 is an open-source, cycle-accurate Commodore 64 emulator for macOS with
      PAL and NTSC support, a portable C++ core, and broad C64 media-format
      compatibility.
  timeline:
    - 'Originally: Began as a virtual CPU environment for computer-engineering education.'
    - 'Later: Evolved into a full cycle-accurate Commodore 64 emulator.'
    - >
      Subsequently: The CPU core was relicensed under MIT terms as Peddle, enabling
      broader reuse.
  usage:
    - >
      On first launch, users supply the required C64 ROM images or install the bundled
      free Mega65 replacements. Programs and media can then be loaded from D64, T64,
      PRG, P00, G64, TAP, and CRT files.
    - >
      Users can emulate joysticks with the keyboard or attach supported USB controllers,
      including original Commodore joysticks through a RetroFun! adapter.
