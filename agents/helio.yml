id: cask:helio
display-name: Helio
repo: https://github.com/helio-fm/helio-sequencer
docs:
  - https://docs.helio.fm/
config-file-location:
  linux:
    - ~/.config/Helio
  macos:
    - ~/Library/Application Support/Helio
  windows:
    - '%APPDATA%\Helio'
credentials-file-location: null
history:
  adoption-history:
    - >
      Helio is distributed for major desktop and mobile systems, including macOS,
      Windows, Linux, iOS, and Android. Its official project description targets
      hobbyist composers, game developers, and independent artists seeking a compact
      composition environment.
  package-nerd-significance:
    - >
      Helio is unusual among packaged music applications because it is a small,
      open-source, composition-first sequencer rather than a recording-centered digital
      audio workstation. It combines MIDI editing, plugin hosting, microtonal features,
      and project version control in portable cross-platform builds.
  project-history:
    - >
      Helio began as an effort to rethink the music sequencer around a minimal,
      distraction-free interface and rapid work with musical ideas. Its initial
      generation was described by the developer as a proof of concept; substantial
      backend, stability, and performance work produced the 2.0 generation after 2018.
    - >
      Later development added and refined MIDI recording, quantization, arrangement
      tools, microtonal workflows, audio rendering, keyboard-oriented editing, and
      offline operation across desktop and mobile platforms.
  related-projects:
    - JUCE
    - MIDI
    - VST
    - Audio Unit
    - SoundFont
  sources:
    - 'Official Helio site: https://helio.fm/'
    - 'Official documentation: https://docs.helio.fm/'
    - 'Official release notes: https://docs.helio.fm/changelog.html'
    - 'Official repository: https://github.com/helio-fm/helio-sequencer'
    - source_facts.description
  summary:
    - >
      Helio is a free, open-source music sequencer for desktop and mobile platforms,
      designed around a lightweight piano-roll and composition workflow.
  timeline:
    - 'Initial generation: Helio began as a proof-of-concept composition sequencer.'
    - >
      2018: Development concentrated on rewriting and stabilizing the application for
      its 2.0 generation.
    - >
      Later releases: Helio added MIDI recording, quantization, microtonal features,
      audio rendering, and keyboard-oriented editing.
    - 'Subsequent development: Desktop and mobile builds moved to offline operation.'
  usage:
    - >
      Musicians use Helio to create and arrange note sequences, edit MIDI, work with
      virtual instruments and effects, explore scales and microtonal temperaments, apply
      arpeggiators and refactoring tools, and save project history.
