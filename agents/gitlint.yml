id: brew:gitlint
display-name: Gitlint
repo: https://github.com/jorisroovers/gitlint
docs:
  - https://jorisroovers.github.io/gitlint
config-file-location:
  unix:
    - .gitlint
credentials-file-location: null
history:
  adoption-history:
    - >
      Gitlint's adoption sits in the commit-quality niche rather than the broader
      code-linting market. It is packaged on PyPI and in several system package
      managers, and it appeals to projects that treat commit history as a reviewable
      interface for releases, changelogs, and audit trails.
  package-nerd-significance:
    - >
      Gitlint is notable as a classic Python CLI packaged across PyPI, Homebrew, Linux
      distributions, and MacPorts. For package maintainers, its dependency-management
      changes and gitlint-core split show the pressure small developer tools face when
      they need to support both hook-time speed and system-package constraints.
  project-history:
    - >
      The GitHub repository was created in September 2015 and the PyPI package history
      begins with the 0.1.0 release. The project grew as a small but durable Git add-on
      with documentation, built-in rules, user-defined rules, hooks, and CI usage
      patterns.
    - >
      The 0.14 and 0.15 releases marked the end of Python 2.7 and Python 3.5 support,
      while the 0.17 release split the package into gitlint and gitlint-core. The 0.19
      release modernized build and test tooling, adopted Hatch and Ruff, and improved
      development builds.
  related-projects:
    - pre-commit is a common integration point for running gitlint before commits or in CI.
    - >
      Conventional Commits is an adjacent convention supported through gitlint contrib
      rules and configuration.
  sources:
    - https://formulae.brew.sh/formula/gitlint
    - https://github.com/jorisroovers/gitlint
    - https://jorisroovers.github.io/gitlint/
    - https://pypi.org/pypi/gitlint/json
    - https://raw.githubusercontent.com/jorisroovers/gitlint/main/CHANGELOG.md
    - https://raw.githubusercontent.com/jorisroovers/gitlint/main/README.md
  summary:
    - >
      Gitlint is a Python command-line linter for Git commit messages. It gives teams a
      way to enforce subject length, body formatting, trailers, conventional-commit-like
      rules, and custom policies before commits or merge requests land.
  timeline:
    - '2015: The jorisroovers/gitlint repository was created.'
    - '2020: The 0.14 and 0.15 release line ended Python 2.7 and Python 3.5 support.'
    - '2021: The 0.17 release split gitlint and gitlint-core.'
    - '2023: The 0.19 release modernized project tooling and CI.'
  usage:
    - >
      Practitioners run gitlint against the commit message being written through a
      commit-msg hook, against selected commit ranges in CI, or through pre-commit.
      Configuration usually lives in .gitlint, with built-in rules tuned by project
      policy and custom Python rules added for organization-specific checks.
related-packages:
  - id: brew:commitlint
    reason: >
      Choose commitlint for a Node.js-centered workflow with shareable npm
      configurations and especially strong Conventional Commits integration; choose
      Gitlint for Python-based rules and its broader built-in style checks.
    rel: alternative
    sources:
      - https://jorisroovers.github.io/gitlint/
      - https://commitlint.js.org/
  - id: brew:pre-commit
    reason: >
      Gitlint officially supports pre-commit as the hook manager for commit-message
      checks and provides separate hook modes for developer commits and CI.
    rel: adjacent_workflow
    sources:
      - https://github.com/jorisroovers/gitlint/blob/main/docs/commit_hooks.md
      - https://pre-commit.com/
tags:
  - ci
  - cli
  - commit-messages
  - git
  - linter
