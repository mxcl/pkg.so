history:
  adoption-history:
    - >
      The service is operated in an official German telecommunications-regulatory
      context rather than as a community speed-test client. Its desktop application
      gives consumers a standardized measurement process backed by national reference
      systems.
    - >
      The supplied metadata records distribution of the macOS desktop application
      through the Homebrew Cask `breitbandmessung`.
  package-nerd-significance:
    - >
      Breitbandmessung is distinctive among speed-test packages because its desktop
      workflow can produce regulator-oriented evidence of fixed-line underperformance,
      not merely an informal throughput reading.
    - >
      For package users, it represents a government-backed, privacy-conscious
      alternative to commercial browser speed tests.
  project-history:
    - >
      Breitbandmessung was developed in Germany by zafaco GmbH on behalf of the
      Bundesnetzagentur. The desktop application extends the measurement service to
      fixed internet connections and supports comparison of measured performance with
      contractually agreed data rates.
    - >
      The project added a formal desktop evidence procedure for cases in which an
      individual measurement indicates that service may not conform to the user's
      contract.
  related-projects:
    - >
      The Breitbandmessung/Funkloch mobile application covers mobile-network
      measurements and dead-zone reporting.
    - >
      The browser measurement service and desktop evidence procedure are complementary
      parts of the Bundesnetzagentur's broadband-measurement program.
  sources:
    - >
      Official combined app description:
      https://download.breitbandmessung.de/bbm/Beschreibung-Die_Breitbandmessung_Funkloch_App_aus_Sicht_des_Nutzers.pdf
    - >
      Official desktop-app description:
      https://download.breitbandmessung.de/bbm/Beschreibung-Die_Desktop-App_der_Breitbandmessung_aus_Sicht_des_Nutzers.pdf
    - 'Official website: https://www.breitbandmessung.de/'
    - 'Package-manager adoption: source_facts.package-manager'
  summary:
    - >
      Breitbandmessung is the Bundesnetzagentur's official German broadband-measurement
      application for testing fixed internet access and documenting possible contractual
      underperformance.
  timeline:
    - >
      Desktop-app era: The service introduced installable software for fixed-line
      measurements and a formal evidence procedure.
  usage:
    - >
      Consumers use the desktop application to measure fixed-line download, upload, and
      related connection performance against their contracted rates.
    - >
      If an individual result suggests non-conforming service, users can follow the
      documented series-of-measurements procedure to create evidence for dealings with
      their provider.
