history:
  adoption-history:
    - >
      Realm Studio became the graphical companion to Realm SDK development across macOS,
      Windows, and Linux. Compatibility releases followed changes in the Realm file
      format, making the application's version relevant when inspecting databases
      produced by different SDK generations.
    - >
      The tool also supported server and synchronization workflows at different points
      in its history. Those capabilities changed with Realm Cloud, MongoDB Realm, Atlas
      Device Sync, and the eventual removal of Device Sync functionality from the
      current major line.
  package-nerd-significance:
    - >
      Realm Studio gives developers direct visibility into an embedded database format
      that is otherwise normally accessed through language SDKs. Package users care
      about matching Studio's supported file format to the Realm SDK that created a
      database, especially because some format upgrades cannot be reversed.
  project-history:
    - >
      Realm Studio was developed by Realm as a cross-platform desktop application for
      opening, browsing, querying, and modifying Realm database files and for
      administering the former Realm Mobile Platform.
    - >
      Following Realm's transition into MongoDB's product family, a 2020 major release
      became the first branded for MongoDB Realm and aligned with the corresponding
      Realm SDK file format. Later releases added support for newer file formats and
      data types while retiring legacy server functionality.
  related-projects:
    - Realm Database
    - Realm SDKs
    - MongoDB Atlas Device SDKs
    - Atlas Device Sync
    - MongoDB Compass
  sources:
    - 'Official MongoDB documentation: https://www.mongodb.com/docs/atlas/device-sdks/studio/'
    - >
      Official changelog:
      https://github.com/realm/realm-studio/blob/channel/major-15/CHANGELOG.md
    - 'Official releases: https://github.com/realm/realm-studio/releases'
    - 'Official repository README: https://github.com/realm/realm-studio#readme'
  summary:
    - >
      Realm Studio is an open-source desktop database browser and editor for Realm
      files, maintained in the Realm organization and documented by MongoDB.
  timeline:
    - >
      2018: The official changelog records established 3.x releases and Realm
      server-administration workflows.
    - >
      2020: The first MongoDB Realm major release aligned Studio with the contemporary
      Realm SDK file format and removed legacy Realm Cloud and Realm Object Server
      functions.
    - '2024: Studio added read/write support for Realm file format 24.'
    - >
      2026: The current major line removed Atlas Device Services and Device Sync
      functionality.
  usage:
    - >
      Developers open a local Realm file to inspect schemas and objects, run queries,
      import CSV data, modify or delete objects, and export data. Opening an encrypted
      Realm may prompt for its encryption key, but the official documentation does not
      specify a credentials file.
