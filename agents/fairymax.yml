id: brew:fairymax
display-name: Fairy-Max
repo: https://hgm.nubati.net/cgi-bin/gitweb.cgi?p=fairymax.git%3Ba%3Dsummary
docs:
  - https://home.hccnet.nl/h.g.muller/CVfairy.html
config-file-location:
  unix:
    - fmax.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      The official documentation says Fairy-Max became included in the standard WinBoard
      install as a ready-to-run engine. In package-manager culture it is notable because
      a small, configurable chess engine can be installed as a command-line program
      while still serving GUI users through the long-running WinBoard/XBoard engine
      ecosystem.
  package-nerd-significance:
    - >
      Fairy-Max is the sort of package that rewards distribution packaging: it is small,
      old-school, text-configurable, and useful only when installed together with the
      right data files and GUI protocol expectations. The fmax.ini file is part of the
      program's behavior, not just optional sample configuration.
  project-history:
    - >
      The project was created to empirically evaluate fairy pieces by letting them play
      in checkmating chess games against orthodox pieces. Its design keeps the engine
      textual and protocol-oriented rather than graphical: Fairy-Max communicates
      through the WinBoard protocol and expects a GUI such as WinBoard or XBoard to
      handle display and game interaction.
    - >
      Fairy-Max also produced or shipped alongside specialized variants such as ShaMax
      for Shatranj-like behavior and MaxQi for Xiangqi-specific constraints, reflecting
      the same small-engine approach applied to variants that do not fit the generic
      fmax.ini model.
  related-projects:
    - >
      Fairy-Max is closely related to micro-Max, WinBoard/XBoard, ShaMax, MaxQi, and
      other WinBoard-compatible chess-variant engines.
  sources:
    - https://www.chessvariants.com/index/msdisplay.php?itemid=MSfairy-max
    - https://home.hccnet.nl/h.g.muller/CVfairy.html
  summary:
    - >
      Fairy-Max is H.G. Muller's free, open-source chess-variant engine. It is derived
      from micro-Max and replaces fixed move tables with definitions loaded from
      fmax.ini, making it useful for experimenting with fairy pieces and variant rule
      sets.
  timeline:
    - 'Undated: H.G. Muller creates Fairy-Max as a chess-variant engine derived from micro-Max.'
    - >
      Undated: Fairy-Max is included with the standard WinBoard install as a
      ready-to-run engine.
    - >
      Undated: Dedicated variants such as ShaMax and MaxQi are distributed with the
      Fairy-Max downloads.
  usage:
    - >
      Users edit fmax.ini to define piece moves, board sizes, and variant setups, then
      run Fairy-Max as a WinBoard-compatible engine. The same package commonly exposes
      related binaries such as fairymax, maxqi, and shamax for the generic engine and
      dedicated variant engines.
related-packages:
  - id: brew:xboard
    reason: >
      XBoard is Fairy-Max's documented graphical front end and uses Fairy-Max as its
      default chess engine, providing board display and interactive play around the
      text-protocol engine.
    rel: adjacent_workflow
    sources:
      - https://home.hccnet.nl/h.g.muller/CVfairy.html
      - https://www.gnu.org/software/xboard/
      - https://www.gnu.org/software/xboard/FAQ.html
  - id: brew:fairy-stockfish
    reason: >
      Choose Fairy-Stockfish for stronger Stockfish-derived search, NNUE, larger-board
      support, and several engine protocols; choose Fairy-Max for a smaller engine with
      directly editable piece definitions in `fmax.ini`.
    rel: alternative
    sources:
      - https://home.hccnet.nl/h.g.muller/CVfairy.html
      - https://fairy-stockfish.github.io/
      - https://github.com/fairy-stockfish/Fairy-Stockfish
