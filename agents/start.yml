history:
  adoption-history:
    - >
      Tencent presented START as part of its cloud-gaming portfolio and highlighted
      smart-TV access, placing it in the company's effort to deliver remotely rendered
      games across device classes.
    - >
      The macOS client is represented by the Homebrew Cask `start`, exposing a
      China-focused game service through the macOS package-manager ecosystem.
  package-nerd-significance:
    - >
      START is notable in cask catalogs because the local package is primarily a client
      for a remotely operated game platform; most of the product's execution, catalog,
      and account state is service-side rather than represented by local package
      contents.
  project-history:
    - >
      START emerged from Tencent's investment in cloud-rendered gaming. Tencent
      announced a broader one-stop cloud-gaming solution with WeGame trials at ChinaJoy
      in 2019, and its 2020 reporting explicitly identified START as a cloud-gaming
      service.
  related-projects:
    - Tencent Cloud's cloud-gaming infrastructure provides related streaming technology.
    - >
      WeGame participated in Tencent's early cloud-gaming trials, but it is a distinct
      product rather than the START client.
  sources:
    - https://start.qq.com/
    - https://www.tencent.com/attachments/toolkit/2020/4Q20_earnings_presentation.pdf
    - https://www.tencent.com/en-us/articles/2200920.html
    - source_facts.package-manager
  summary:
    - >
      START is Tencent's consumer cloud-gaming platform. Its client streams games
      executed on remote infrastructure, reducing the need for the user's Mac or
      television to run the full game workload locally.
  timeline:
    - >
      2019: Tencent Cloud announced its cloud-gaming solution and game trials with
      WeGame at ChinaJoy.
    - >
      2020: Tencent identified START in its earnings materials as a cloud-gaming service
      supporting play on smart TVs.
  usage:
    - >
      Install the client, authenticate with a supported Tencent account, select an
      available title, and stream gameplay from Tencent's remote infrastructure. Service
      availability, game entitlements, and regional access are controlled by Tencent.
tags:
