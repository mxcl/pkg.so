id: brew:exomizer
display-name: Exomizer
repo: https://bitbucket.org/magli143/exomizer
docs:
  - https://bitbucket.org/magli143/exomizer/src/master/changelog.txt
  - https://bitbucket.org/magli143/exomizer/src/master/exo20info.txt
  - https://bitbucket.org/magli143/exomizer/src/master/exo31info.txt
  - https://bitbucket.org/magli143/exomizer/wiki/Home
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official changelog shows a long-lived release line through 2.x and 3.x,
      including 3.0.0 in 2018, 3.1.0 in 2020, 3.1.1 in 2021, and 3.1.2-era licensing and
      decruncher updates. The supplied package metadata lists Homebrew and Nix packages.
  package-nerd-significance:
    - >
      Exomizer matters to package and retro-toolchain users because it is both a
      host-side compressor and a bundle of target-side decruncher sources. The package
      is useful in build systems that produce C64, VIC-20, Atari 8-bit, Apple II, Oric,
      PET, and related binaries.
  project-history:
    - >
      The official Bitbucket repository is owned by Magnus Lind and uses Git with master
      as the main branch. Its documentation explains Exomizer 2.0 features such as sfx,
      mem, level, raw, and desfx modes, plus target support for Commodore, Atari 8-bit,
      Apple II, Oric, PET, and other systems.
  related-projects:
    - >
      Official documentation names exoopt, Doynamite, and subsizer as inspirations for
      Exomizer 3.1 bitstream and 6502 decruncher work.
    - >
      The package also includes exobasic, documented separately as a BASIC-program
      preprocessing tool.
  sources:
    - https://bitbucket.org/magli143/exomizer
    - https://bitbucket.org/magli143/exomizer/src/master/changelog.txt
    - https://bitbucket.org/magli143/exomizer/src/master/exo20info.txt
    - https://bitbucket.org/magli143/exomizer/src/master/exo31info.txt
    - source_facts.package-manager
  summary:
    - >
      Exomizer is a compressor for constrained 8-bit and retro-computing environments,
      with tooling for raw data, memory-oriented compressed files, and self-extracting
      targets.
  timeline:
    - '2011: Official changelog records Exomizer 2.0 source and binary release.'
    - '2017: Bitbucket API reports the repository created under magli143/exomizer.'
    - >
      2018: Official changelog records Exomizer 3.0.0 with a faster 6502 decruncher and
      changed bitstream format.
    - >
      2020: Official changelog records Exomizer 3.1.0 with split encoding and updated
      decrunchers.
    - '2021: Official changelog records Exomizer 3.1.1 with C65/MEGA65 support.'
    - '2023: Official documentation notes zlib licensing changes in the 3.1.2 line.'
  usage:
    - >
      The official exo20info documentation describes four compression subcommands,
      shared flags for tuning compression speed and format compatibility, and
      16-bit-address-space workflows that are natural for vintage-machine program
      images.
