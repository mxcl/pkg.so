history:
  adoption-history:
    - >
      Official packaging notes mention prebuilt compiler releases and Homebrew
      installation, indicating a distribution model aimed at command-line compiler use
      rather than only library embedding.
  package-nerd-significance:
    - >
      Colfer is notable as a small schema compiler package with no runtime configuration
      and a source-generation workflow similar to other IDL and serialization compilers.
  project-history:
    - >
      The official README describes Colfer as inspired by Protocol Buffers and centered
      on the colf compiler, which reads schema definitions and generates source code for
      marshaling and unmarshaling data structures.
  related-projects:
    - >
      The official manual lists protoc and flatc as related tools, placing Colfer in the
      same package-manager neighborhood as Protocol Buffers and FlatBuffers compilers.
  sources:
    - https://github.com/pascaldekloe/colfer
    - https://github.com/pascaldekloe/colfer/wiki/Spec
  summary:
    - >
      Colfer is a binary serialization format and schema compiler optimized for speed
      and size.
  timeline:
    - '2015: Official GitHub repository is created.'
    - '2010s: README documents C, Go, Java, and JavaScript code generation support.'
    - >
      2020s: README continues to document Homebrew installation and prebuilt compiler
      releases.
  usage:
    - >
      The colf command generates C, Go, Java, or JavaScript output from .colf schema
      files. The README recommends committing generated source code to version control
      to preserve build consistency and reduce compiler installation requirements.
related-packages:
  - id: brew:protobuf
    reason: >
      Choose Protocol Buffers when you need its broader language and tooling ecosystem;
      Colfer identifies protoc as a related schema compiler and states that its own
      format was inspired by Protocol Buffers.
    rel: alternative
    sources:
      - https://github.com/pascaldekloe/colfer
      - https://protobuf.dev/
  - id: brew:flatbuffers
    reason: >
      Choose FlatBuffers when direct access to serialized data without a separate
      unpacking step is important; Colfer's manual explicitly lists flatc as a related
      compiler.
    rel: alternative
    sources:
      - https://github.com/pascaldekloe/colfer
      - https://flatbuffers.dev/
