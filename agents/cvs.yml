      component.
  display-name-sources:
    - source_facts.name is cvs; official Savannah project name is Concurrent Versions System.
  docs-sources:
    - >
      Official nongnu homepage has a documentation section; GNU hosts the CVS manual for
      CVS 1.11.23.
  history-sources:
    - https://www.gnu.org/software/trans-coord/manual/cvs/cvs.html
    - https://www.nongnu.org/cvs/
  repo-sources:
