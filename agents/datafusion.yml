      Official site describes an extensible query engine written in Rust using Apache
      Arrow with SQL and DataFrame APIs.
    - source_facts.executables includes datafusion-cli.
category-confidence: high
category-path:
  - data
  - query-engine
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
