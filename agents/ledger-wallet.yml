history:
  adoption-history:
    - >
      Ledger Live consolidated the earlier collection of coin-specific Chrome
      applications into one cross-platform desktop interface. It became the principal
      companion software for Ledger hardware devices and later expanded to mobile,
      staking, swaps, portfolio tracking, and embedded third-party services.
    - >
      In 2026 Ledger renamed Ledger Live to Ledger Wallet, presenting the software as
      the connectivity and portfolio layer paired with a hardware device—now called a
      Ledger signer—that keeps private keys offline.
  package-nerd-significance:
    - >
      Ledger Wallet is a prominent example of an open-source desktop companion for
      hardware-backed cryptocurrency custody. Package users care about obtaining the
      authentic application, signed updates, device compatibility, and the distinction
      between locally stored portfolio data and private keys retained by the hardware
      signer.
  project-history:
    - >
      Ledger launched Ledger Live in July 2018 as an all-in-one Windows, macOS, and
      Linux companion for its hardware wallets. It replaced separate Chrome applications
      and combined onboarding, account management, balances, and transactions.
    - >
      The desktop and mobile code later moved into Ledger's ledger-live monorepo. The
      project grew into a broader platform for assets, device applications, staking,
      swaps, NFTs, and embedded Web3 services before adopting the Ledger Wallet name.
  related-projects:
    - >
      Ledger hardware signers provide offline private-key storage and transaction
      confirmation.
    - >
      The archived ledger-wallet-chrome project represents the coin-specific Chrome-app
      generation that Ledger Live replaced.
    - >
      Ledger's ledger-live monorepo contains the desktop, mobile, CLI, and shared
      library code for the modern application.
  sources:
    - https://developers.ledger.com/docs/ledger-live/introduction
    - https://github.com/LedgerHQ/ledger-live
    - >
      https://www.ledger.com/2018/07/09/ledger-launches-ledger-live-the-all-in-one-companion-app-to-your-ledger-device/
    - https://www.ledger.com/academy/topics/ledger-wallet/ledger-wallet-guide
  summary:
    - >
      Ledger Wallet, formerly Ledger Live, is Ledger's desktop and mobile companion for
      managing cryptocurrency accounts and preparing transactions that are verified and
      signed by Ledger hardware.
  timeline:
    - >
      2018: Ledger launched Ledger Live as an all-in-one replacement for its
      coin-specific Chrome applications.
    - '2026: Ledger Live was renamed Ledger Wallet as part of a broader product-naming change.'
  usage:
    - >
      Users connect and unlock a Ledger device, add cryptocurrency accounts, install
      device applications, track balances, and prepare send, receive, swap, buy, or
      staking operations. Sensitive transactions are confirmed on the hardware signer.
    - >
      Ledger states that the desktop data remains on the user's computer and that
      private keys remain offline in the Ledger signer. No official stable
      configuration-file or credential-file path was found, so both location fields are
      null.
