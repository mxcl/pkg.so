credentials-file-location: null
history:
  adoption-history:
    - >
      The official installation instructions put Homebrew first and also document npm
      and source builds, indicating a CLI-first distribution model aimed at developers
      running local agent workspaces. The README also lists Dolt, beads, tmux, Claude
      Code, Codex CLI, and GitHub Copilot CLI as surrounding tooling rather than
      treating Gas Town as a standalone binary.
  package-nerd-significance:
    - >
      Gas Town is notable as an early package-manager-distributed attempt to make
      multi-agent coding workflows reproducible with a conventional CLI, git worktrees,
      and installable dependencies. For package cataloging, it is interesting because it
      packages an AI-agent operating model rather than a narrow compiler, linter, or
      shell utility.
  project-history:
    - >
      The public repository was created in December 2025 and reached a 1.0.0 release in
      April 2026 after a sequence of pre-1.0 releases. The official README presents Gas
      Town as a workspace manager for Claude Code, GitHub Copilot, Codex, Gemini, and
      other agents, built around town, rig, crew, hook, convoy, and bead concepts.
    - >
      Version 1.0.0 was described by the project as a production-stability milestone
      after iterative development. The release notes called out Windows support,
      workflow formulas, a GitHub pull-request merge strategy for the refinery, security
      hardening, mayor approval gates, and a rate-limit watchdog plugin.
  related-projects:
    - >
      Gas Town integrates with beads for git-backed issue tracking and Dolt/DoltHub for
      some distributed coordination features. It is designed to orchestrate AI coding
      agents such as Claude Code, Codex CLI, GitHub Copilot CLI, and Gemini rather than
      replacing those runtimes.
  sources:
    - https://github.com/gastownhall/gastown
    - https://github.com/gastownhall/gastown/releases
    - https://github.com/gastownhall/gastown/releases/tag/v1.0.0
  summary:
    - >
      Gas Town is a Go-based multi-agent workspace manager for coordinating AI coding
      agents across git-backed workspaces. Its package interest comes from turning agent
      orchestration into a local CLI workflow, with persistent work state, agent
      identities, mailboxes, handoffs, and merge-queue-style project operations.
  timeline:
    - '2025: Public GitHub repository created.'
    - '2026: v0.5.0 through v0.13.0 pre-1.0 releases established the early release train.'
    - '2026: v1.0.0 released as a production-stability milestone.'
    - '2026: v1.2.x releases continued shortly after 1.0.'
  usage:
    - >
      Typical usage starts by installing `gt`, creating a town workspace, adding a
      git-backed rig, adding a crew workspace, and attaching the mayor session. From
      there the tool manages agent dispatch, persistent hooks, convoys, escalation,
      session discovery, and merge processing.
related-packages:
  - id: brew:gascity
    reason: >
      Choose Gas City when you want to assemble a custom multi-agent platform from
      declarative packs and runtime providers; retain Gas Town for its more opinionated,
      ready-made workspace and role model.
    rel: alternative
    sources:
      - https://docs.gascityhall.com/getting-started/coming-from-gastown
      - https://github.com/gastownhall/gastown#readme
  - id: brew:beads
    reason: >
      Gas Town uses Beads as its dependency-aware work and convoy system, so `bd` is
      part of the normal task creation, claiming, routing, and completion workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/gastownhall/gastown#readme
      - https://gastownhall.github.io/beads/
  - id: brew:dolt
    reason: >
      Dolt provides version-controlled SQL storage used by Gas Town's Beads-backed
      coordination state and distributed workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/gastownhall/gastown#readme
      - https://docs.dolthub.com/
  - id: brew:tmux
    reason: >
      Gas Town hosts and reconnects to persistent agent sessions through tmux, making
      the multiplexer part of its standard local workspace lifecycle.
    rel: adjacent_workflow
    sources:
      - https://github.com/gastownhall/gastown#readme
      - https://github.com/tmux/tmux/wiki
