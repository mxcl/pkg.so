history:
  adoption-history:
    - >
      Ghost Browser targets web professionals who manage multiple accounts, clients,
      roles, or testing personas. Its Chromium-compatible extension model and familiar
      browser interface lower the cost of adopting isolated cookie jars and workspace
      organization.
    - >
      Homebrew Cask provides a package-manager installation path for its macOS build,
      while the vendor distributes signed desktop installers directly.
  package-nerd-significance:
    - >
      Ghost Browser is interesting to browser and automation enthusiasts because it
      turns browser-profile isolation into a first-class tab-level concept. Its public
      extension API extends Chrome tab and cookie behavior with workspace and identity
      identifiers, making multi-account automation possible without mixing sessions.
  project-history:
    - >
      Ghost Browser was created by an international team headquartered in Denver to
      build a productivity-focused browser for people who work primarily on the web. Its
      central concepts evolved from Sessions to Temporary Identities in January 2021,
      clarifying the distinction between ephemeral and persistent isolated cookie jars.
      Version 2.4.1.1 added identity-scoped cookie access to its public API in April
      2025.
  related-projects:
    - Chromium
    - Google Chrome profiles
    - Firefox Multi-Account Containers
    - SessionBox
  sources:
    - >
      Official API announcement:
      https://ghostbrowser.com/blog/manage-cookies-per-identity-ghost-browser-public-api/
    - >
      Official Temporary Identities documentation:
      https://support.ghostbrowser.com/article/319-temporaryidentities
    - 'Official about page: https://ghostbrowser.com/about/'
    - >
      Official public API documentation:
      https://support.ghostbrowser.com/article/383-ghost-browser-api
  summary:
    - >
      Ghost Browser is a Chromium-based productivity browser organized around workspaces
      and isolated identities for simultaneously using multiple web accounts.
  timeline:
    - 'January 2021: Sessions renamed Temporary Identities'
    - 'April 2025: Version 2.4.1.1 added identity-scoped cookie access to the public API'
  usage:
    - >
      Users group tabs into workspaces and assign tabs to default, temporary, or
      persistent identities. Each identity provides a distinct cookie jar, allowing
      concurrent logins to the same service; identities can also be paired with proxy
      connections.
    - >
      Extension developers and automation tools can use Ghost Browser's public API to
      open tabs in chosen identities and work with cookies scoped to those identities.
