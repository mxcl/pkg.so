id: brew:cmigemo
display-name: C/Migemo
repo: https://github.com/koron/cmigemo
docs:
  - https://github.com/koron/cmigemo/blob/master/doc/README_j.txt
  - https://github.com/koron/cmigemo#readme
  - https://www.kaoriya.net/software/cmigemo
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      C/Migemo's adoption is concentrated in Japanese text-editing workflows, especially
      Vim and related incremental search integrations. The input package facts list it
      in Homebrew, Debian, Ubuntu, Fedora/dnf, and Nix, showing that it escaped a single
      editor bundle into Unix package repositories.
  package-nerd-significance:
    - >
      C/Migemo is package-nerd interesting because it packages an editor-adjacent
      Japanese input/search workflow as a reusable C library and CLI. It also has
      dictionary-generation and encoding concerns, which are exactly the kind of
      locale-specific details that package maintainers have to make reproducible across
      Unix systems.
  project-history:
    - >
      The official Japanese README dates C/Migemo to 2001-08-15, identifies MURAOKA Taro
      (KoRoN) as author, and describes it as a C reimplementation of Ruby/Migemo.
    - >
      The KaoriYa project page explains that Ruby/Migemo generates regular expressions
      for searching Japanese from romanized input, and that C/Migemo was published as a
      C library so it could be embedded in Vim.
  related-projects:
    - >
      C/Migemo is explicitly related to Ruby/Migemo, Vim, SKK dictionaries, and Japanese
      incremental search tooling.
  sources:
    - https://www.kaoriya.net/software/cmigemo
    - https://github.com/koron/cmigemo/blob/master/doc/README_j.txt
    - https://api.github.com/repos/koron/cmigemo
  summary:
    - >
      C/Migemo is a C implementation of Migemo, a Japanese incremental-search tool that
      lets users type romanized text and search Japanese text without first converting
      the query to kana or kanji.
  timeline:
    - '2001-08-15: C/Migemo documented as starting date in the official README.'
    - '2013-01: GitHub repository created.'
    - '2022: GitHub repository shows recent source updates in the current metadata.'
    - '2025: KaoriYa site still lists C/Migemo and points to the GitHub source repository.'
  usage:
    - >
      The official documentation describes building the library, generating or obtaining
      the dictionary, and using the `cmigemo` program with a Migemo dictionary. Its
      practical use is as a library or command that converts romanized Japanese search
      terms into regular expressions suitable for incremental search.
related-packages:
  - id: brew:percol
    reason: >
      percol has an officially documented Migemo matching mode that uses C/Migemo to
      search Japanese input interactively from ASCII queries.
    rel: adjacent_workflow
    sources:
      - https://github.com/mooz/percol#readme
      - https://github.com/koron/cmigemo#readme
  - id: brew:vim
    reason: >
      C/Migemo was created to embed Romaji-driven Japanese incremental search in Vim,
      and upstream now documents a dedicated Vim plugin for that workflow.
    rel: adjacent_workflow
    sources:
      - https://www.kaoriya.net/software/cmigemo/
      - https://github.com/koron/cmigemo#readme
      - https://www.vim.org/
