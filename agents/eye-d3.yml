id: brew:eye-d3
display-name: eyeD3
repo: https://github.com/nicfit/eyeD3
docs:
  - https://eyed3.readthedocs.io/en/latest
  - https://github.com/nicfit/eyeD3#readme
config-file-location:
  unix:
    - ~/.eyeD3/config.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      eyeD3's adoption path is typical of durable Python CLI utilities: it is
      installable as a Python package, exposes an importable library, and is also
      packaged by operating-system package managers. The official README points users to
      PyPI-style installation and GitHub source development.
    - >
      Its continued release history reflects maintenance for newer Python runtimes and
      real-world MP3 tag edge cases, including malformed frames, iTunes extensions,
      cover art, JSON/YAML output, and collection statistics.
  package-nerd-significance:
    - >
      eyeD3 is package-manager-friendly because it is both a Unix-style CLI and a
      reusable Python library. That makes it useful in scripts that batch-fix music
      libraries and in Python applications that need direct ID3 access.
    - >
      Its long release history is a catalog of boring but valuable media-tag edge cases:
      encodings, malformed frames, version conversion, iTunes quirks, cover art,
      recursive scanning, and output formats.
  project-history:
    - >
      The official release history starts with eyeD3 0.1.0 on 2002-07-31. Through the
      0.6 series, the project accumulated practical ID3 and MP3-handling fixes: Unicode
      handling, ID3v1/v2 frame support, URL frames, lyrics, genre handling, safe
      rewrites, and command-line behavior.
    - >
      Version 0.7.0 in 2012 was a larger internal shift: the command-line tool gained
      plugin support, the module name became the lower-case eyed3, the API was
      redesigned around tag properties, PyPI-friendly installation was added, and
      configuration-file support became part of the command-line workflow.
    - >
      The 0.8 and 0.9 lines modernized the project for Python 3, GitHub development,
      plugin output formats, and current Python versions. The 2025 0.9.8 release lists
      Python 3.11, 3.12, and 3.13 support.
  related-projects:
    - ID3 is the metadata format family eyeD3 reads and writes.
    - MP3 is the primary audio format exposed by eyeD3's command-line and library APIs.
    - >
      eyeD3 plugins such as classic, fixup, art, stats, JSON, YAML, and nfo form the
      project's extension surface.
  sources:
    - https://eyed3.readthedocs.io/en/latest/
    - https://eyed3.readthedocs.io/en/latest/history.html
    - https://github.com/nicfit/eyeD3
  summary:
    - >
      eyeD3 is a Python command-line tool and library for reading and writing ID3
      metadata in MP3 files. It serves both shell users editing tags and Python
      developers building metadata-aware audio workflows.
    - >
      The project has been released since 2002 and has evolved from a straightforward
      tag editor into a plugin-capable CLI and importable Python package.
  timeline:
    - '2002: eyeD3 0.1.0 is released.'
    - >
      2012: eyeD3 0.7.0 adds plugin-oriented CLI behavior and a redesigned lower-case
      eyed3 module.
    - '2017: eyeD3 0.8 adds Python 3 support and notes the project home on GitHub.'
    - '2020: eyeD3 0.9 drops Python 2.7 support and changes recursive scanning behavior.'
    - '2025: eyeD3 0.9.8 adds support for Python 3.11, 3.12, and 3.13.'
  usage:
    - >
      The default eyeD3 command edits common song fields such as artist, album, title,
      and track number, then displays the resulting ID3 tag. The same operations are
      available through Python by loading a file, mutating tag properties, and saving.
    - >
      The documented feature set includes ID3 1.x, read-only ID3 2.2, ID3 2.3, ID3 2.4,
      MP3 audio details, plugins for display/fixup/art/stats/output formats, and custom
      command-line plugins.
related-packages:
  - id: brew:id3lib
    reason: >
      Choose id3lib when a native C/C++ ID3 library and its small legacy command-line
      utilities fit better than eyeD3's Python API and plugin-oriented CLI.
    rel: alternative
    sources:
      - https://eyed3.readthedocs.io/en/latest/
      - https://id3lib.sourceforge.net/
      - https://id3lib.sourceforge.net/id3lib-manual.php
  - id: brew:taglib
    reason: >
      Choose TagLib for application development that needs a native library covering
      metadata in several audio formats, while eyeD3 is more focused on Python, MP3, and
      ID3-oriented command-line workflows.
    rel: alternative
    sources:
      - https://eyed3.readthedocs.io/en/latest/
      - https://taglib.org/
      - https://taglib.org/api/
