history:
  adoption-history:
    - >
      Overflow has been aimed at Mac users who want to keep the Dock small while
      retaining quick access to a larger collection of applications, files, folders, and
      websites. Its integration with familiar Finder, Dock, Quick Look, and keyboard
      behaviors reduces the need to adopt a separate organizational model.
  package-nerd-significance:
    - >
      Overflow represents the long-running class of focused macOS utilities that augment
      rather than replace built-in desktop conventions. Its version history spans major
      changes in Mac hardware and system behavior, including Universal Binary support,
      Spaces compatibility, Retina support, and modern Dock and menu-bar workflows.
  project-history:
    - >
      Stunt Software developed Overflow as a visual shelf and launcher for macOS. Early
      releases concentrated on customizable layouts and Finder integration; version 2.0
      added collections, a global hot key, keyboard control, contextual menus, and an
      integrated help book.
    - >
      Later 2.x releases added menu-bar access, custom item names, improved
      drag-and-drop behavior, and compatibility work for successive Mac OS X releases.
      Overflow 3 continues the concept with search, Quick Look previews, URL support,
      customizable collections, and a larger visual workspace outside the Dock.
  related-projects:
    - >
      Overflow complements the macOS Dock, Finder, Quick Look, Spaces, and menu bar
      rather than replacing those system components.
  sources:
    - https://www.staging.stuntsoftware.com/overflow/changelog.html
    - https://www.stuntsoftware.com/overflow/
  summary:
    - >
      Overflow is a proprietary visual launcher and organizer for macOS applications,
      documents, folders, and URLs.
  timeline:
    - 'Version 1.5: Overflow became a Universal Binary.'
    - >
      Version 2.0: Collections, a global hot key, keyboard navigation, contextual menus,
      and a help book were introduced.
    - >
      Version 2.5: Menu-bar access, custom names, and expanded drag-and-drop behavior
      were added.
    - >
      Version 3: The product is presented as a modern visual launcher with search and
      Quick Look integration.
  usage:
    - >
      Users drag Finder items or URLs into named collections, invoke Overflow with a
      configurable hot key, type to search, preview files with Quick Look, and launch or
      reveal items using the mouse or keyboard.
