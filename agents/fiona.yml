id: brew:fiona
display-name: Fiona
repo: https://github.com/Toblerity/Fiona
docs:
  - https://fiona.readthedocs.io/en/stable
config-file-location: null
credentials-file-location:
  unix:
    - ~/.aws/credentials
  windows:
    - '%USERPROFILE%\.aws\credentials'
history:
  adoption-history:
    - >
      Fiona adoption followed Python geospatial packaging. The documentation notes that
      binary wheels are available from PyPI to simplify installation, while also warning
      that production users who need optional GDAL drivers may need source builds or
      Conda/conda-forge packages.
    - >
      The project is also a dependency-shaped package: users often meet Fiona through
      higher-level geospatial Python workflows, but package managers still expose the
      `fio` command as a practical Unix-style interface for converting and inspecting
      vector datasets.
  package-nerd-significance:
    - >
      Fiona is package-nerd significant because it sits at the painful boundary between
      Python packaging and native geospatial libraries. Wheels, GDAL ABI compatibility,
      optional drivers, Conda packages, Homebrew formulas, and source builds all matter
      to whether a user can simply `import fiona`.
    - >
      It also demonstrates how a library can carry a CLI identity: the Homebrew formula
      installs `fio`, but that executable belongs to Fiona's broader role as Python's
      readable front door to vector geodata.
  project-history:
    - >
      The public Fiona repository was created at the end of 2011 under the Toblerity
      organization. The official documentation describes Fiona as a project that streams
      simple feature data to and from GIS formats such as GeoPackage and Shapefile,
      including multilayer formats, zipped and in-memory virtual filesystems, local
      files, and cloud storage.
    - >
      Fiona's identity is closely tied to GDAL but deliberately distinct from GDAL's own
      Python bindings. The official README says Fiona depends on GDAL while being
      designed for highly productive, readable Python code. That design made it part of
      the modern Python geospatial stack rather than just a thin binding layer.
  related-projects:
    - GDAL/OGR is Fiona's native geospatial dependency and main conceptual ancestor.
    - GeoJSON is the feature model Fiona exposes to Python users and CLI pipelines.
    - >
      Shapely is named in Fiona examples for geometry operations that Fiona itself
      intentionally does not provide.
    - Rasterio is a neighboring Toblerity geospatial project in the Python/GDAL ecosystem.
  sources:
    - https://fiona.readthedocs.io/en/stable/README.html
    - https://raw.githubusercontent.com/Toblerity/Fiona/master/README.rst
    - https://github.com/Toblerity/Fiona
    - https://api.github.com/repos/Toblerity/Fiona
    - https://api.github.com/repos/Toblerity/Fiona/releases
  summary:
    - >
      Fiona is a Python library and command-line interface for reading and writing
      geographic vector data. It wraps GDAL/OGR capabilities in a Pythonic API built
      around file-like collections and GeoJSON-like feature mappings, and it ships the
      `fio` CLI for streaming and transforming geospatial data.
  timeline:
    - '2011: Public Fiona repository is created on GitHub.'
    - '2018: GitHub releases show Fiona 1.8-era release artifacts in the official repository.'
    - >
      2020s: Documentation emphasizes wheels containing libgdal for simple applications
      and Conda/conda-forge for broader optional driver coverage.
    - >
      2024: Fiona 1.10 documentation states requirements of Python 3.8 or higher and
      GDAL 3.4 or higher.
    - '2025: GitHub repository metadata shows continued maintenance activity.'
  usage:
    - >
      In Python, users call `fiona.open()` to get collection objects, read features
      modeled on GeoJSON, inspect dataset profiles, and write new datasets with a chosen
      driver, schema, and coordinate reference system.
    - >
      On the command line, Fiona's `fio` command streams GeoJSON features from datasets
      and provides subcommands documented in the official CLI docs. That makes it useful
      in pipelines with tools such as jq and in quick format-inspection tasks where
      opening a full GIS application would be overkill.
related-packages:
  - id: brew:gdal
    reason: >
      GDAL is Fiona's underlying native geospatial library and is the better direct tool
      when you need its full driver and command-line surface rather than Fiona's
      Pythonic vector API.
    rel: adjacent_workflow
    sources:
      - https://fiona.readthedocs.io/en/stable/README.html
      - https://gdal.org/en/stable/
  - id: brew:jq
    reason: >
      Fiona's official CLI guide pipes `fio` output into jq to aggregate and transform
      streamed GeoJSON values.
    rel: adjacent_workflow
    sources:
      - https://fiona.readthedocs.io/en/stable/cli.html
      - https://jqlang.github.io/jq/manual/
