history:
  adoption-history:
    - >
      The fork continued the side-button-navigation concept after SensibleSideButtons
      became unmaintained. Beginning with version 1.0.7, Jan Hülsmann maintained
      SaneSideButtons and added native Apple Silicon support. The official README
      supports both direct downloads and Homebrew cask installation.
  package-nerd-significance:
    - >
      SaneSideButtons represents a common macOS package-manager niche: a small
      open-source menu-bar utility that repairs an input behavior the operating system
      does not consistently expose for generic mice. Homebrew installation makes the
      otherwise standalone app easy to deploy and update alongside other workstation
      utilities.
  project-history:
    - >
      SaneSideButtons began as a fork of Alexei Baboulevitch’s abandoned
      SensibleSideButtons. It preserved that project’s approach of translating mouse
      buttons 4 and 5 into simulated two-finger swipe gestures, allowing native history
      navigation across more macOS applications than simple keyboard-shortcut mapping.
    - >
      Maintenance transferred to Jan Hülsmann with version 1.0.7. Subsequent releases
      modernized compatibility, including Apple Silicon and newer macOS versions, while
      retaining the narrowly focused menu-bar design.
  related-projects:
    - SensibleSideButtons
    - macOS Login Items
    - Third-party mouse configuration utilities
  sources:
    - https://github.com/thealpa/SaneSideButtons
    - https://github.com/thealpa/SaneSideButtons/releases
    - https://janhuelsmann.com/sanesidebuttons
  summary:
    - >
      SaneSideButtons is an open-source macOS menu-bar application that turns the back
      and forward buttons on third-party mice into system-wide navigation gestures.
  timeline:
    - 'Original project: SaneSideButtons forked the abandoned SensibleSideButtons codebase.'
    - 'Version 1.0.7: Jan Hülsmann assumed maintenance and added native Apple Silicon support.'
    - 'Later releases: Compatibility was updated for newer macOS generations.'
  usage:
    - >
      Users run the menu-bar application and press mouse buttons M4 and M5 to simulate
      two-finger back and forward swipes in applications with navigation history.
    - >
      The README documents adding SaneSideButtons to macOS Login Items when automatic
      startup is desired.
