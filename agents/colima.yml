config-file-location:
  unix:
    - ~/.colima/default/colima.yaml
    - ~/.colima/<profile-name>/colima.yaml
    - ~/.colima/_templates/default.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Colima became popular in package-manager culture as a lightweight alternative path
      for local Docker-compatible development on macOS, especially after Docker Desktop
      licensing and resource-use concerns made VM-backed open tooling more attractive.
    - >
      The official installation docs list Homebrew, MacPorts, Nix, Mise, Arch/AUR,
      release binaries, and source builds, reflecting broad distribution across
      developer package ecosystems.
  package-nerd-significance:
    - >
      Colima is packaging-significant because it coordinates several separately packaged
      tools: Lima for virtual machines, Docker or containerd clients, kubectl for
      Kubernetes, and optional Incus or AI workload tooling.
  project-history:
    - >
      The official README states the project goal as providing container runtimes on
      macOS with minimal setup and explains the name as Containers on Lima. It also
      notes the transitive meaning Containers on Linux Machines because Lima is also
      described as Linux Machines.
    - >
      Colima grew from a Docker-oriented local runtime into a multi-runtime tool
      supporting Docker, containerd, Kubernetes, Incus, and newer GPU-accelerated AI
      workload support.
  related-projects:
    - >
      Official docs directly relate Colima to Lima, Docker, containerd, Kubernetes,
      nerdctl, Incus, and krunkit.
  sources:
    - https://colima.run/docs
    - https://github.com/abiosoft/colima
    - https://github.com/abiosoft/colima/blob/main/docs/INSTALL.md
    - https://github.com/abiosoft/colima/blob/main/docs/FAQ.md
  summary:
    - >
      Colima is a command-line tool for running container runtimes on macOS and Linux
      with minimal setup, built around Lima virtual machines.
  timeline:
    - '2020s: Colima emerges as Containers on Lima for macOS container runtimes.'
    - 'v0.7.0: Official README documents Incus runtime support.'
    - 'v0.10.0: Official README documents GPU-accelerated AI workload support using krunkit.'
    - >
      2020s: Official install docs list Homebrew, MacPorts, Nix, Mise, Arch/AUR,
      binaries, and source builds.
  usage:
    - >
      Typical usage is brew install colima followed by colima start, after which Docker,
      containerd/nerdctl, Kubernetes, or Incus clients can target the VM-backed runtime.
      Configuration is normally edited with colima start --edit or the colima template
      command.
related-packages:
  - id: brew:lima
    reason: >
      Lima is the virtual-machine layer underneath Colima; choose it directly when you
      need general-purpose configurable Linux VMs instead of Colima's higher-level
      container-focused setup.
    rel: adjacent_workflow
    sources:
      - https://github.com/abiosoft/colima
      - https://lima-vm.io/docs/
  - id: brew:docker
    reason: >
      Colima uses Docker as its default runtime and officially requires the Docker
      client for the standard colima start followed by docker command workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/abiosoft/colima
      - https://docs.docker.com/reference/cli/docker/
  - id: brew:nerdctl
    reason: >
      Use nerdctl to operate containers when Colima is started with the containerd
      runtime; Colima documents both its wrapper command and an optional PATH
      installation.
    rel: adjacent_workflow
    sources:
      - https://github.com/abiosoft/colima
      - https://github.com/containerd/nerdctl
  - id: brew:kubernetes-cli
    reason: >
      Install kubectl when enabling Colima's optional Kubernetes environment, as Colima
      documents kubectl as the client used to operate that cluster.
    rel: adjacent_workflow
    sources:
      - https://github.com/abiosoft/colima
      - https://kubernetes.io/docs/reference/kubectl/
