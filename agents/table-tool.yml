config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Table Tool is distributed through the Mac App Store, direct project releases, and
      Homebrew Cask as `table-tool`. Its narrowly defined feature set provides a
      lightweight alternative to opening CSV files in a full spreadsheet or database
      application.
    - >
      The public MIT-licensed repository accepts issue reports and contributions,
      although the maintainers explicitly keep formulas and presentation formatting
      outside the project's scope.
  package-nerd-significance:
    - >
      Table Tool exemplifies the small, composable desktop utilities favored by
      package-manager users: it does one format-oriented job, is open source, and
      handles the delimiter, encoding, decimal-separator, and quoting variations that
      make ostensibly simple CSV files troublesome.
  project-history:
    - >
      Table Tool was created by Sandro Peham, Andreas Aigner, and Jakob Egger as a
      simple native CSV editor for macOS. Early releases described it as both an editor
      and converter, with version 1.1 designated the first stable release.
    - >
      The project deliberately remained focused on CSV inspection, editing, and
      conversion. Its maintainers state that spreadsheet-style formulas and formatting
      are outside its intended scope.
  related-projects:
    - >
      Spreadsheet applications such as Microsoft Excel and Apple Numbers, which also
      exchange CSV data but provide a much broader feature set.
  sources:
    - 'Official releases: https://github.com/jakob/TableTool/releases'
    - 'Official repository README: https://github.com/jakob/TableTool#readme'
    - source_facts.package-manager
  summary:
    - >
      Table Tool is an open-source macOS CSV editor that detects file characteristics
      automatically and presents tabular data in a native grid for editing or
      conversion.
  timeline:
    - 'Version 1.0: First public release as a CSV editor and converter.'
    - 'Version 1.1: Declared the first stable release.'
    - 'Version 1.1.2: Added pipe-delimited-file support and improved MacRoman handling.'
    - 'Version 1.2: Added row reordering and GBK text-encoding support.'
    - 'Version 1.2.1: Improved handling of unrecognized formats and older macOS releases.'
  usage:
    - >
      Open a delimited-text file and let Table Tool detect its delimiter, encoding,
      decimal separator, and quoting rules, or override those settings manually.
    - >
      Edit cells, rows, and columns in the grid, then save or convert the file using a
      different CSV representation.
