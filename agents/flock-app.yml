history:
  adoption-history:
    - >
      Flock expanded beyond its web service through official desktop clients for macOS,
      Windows, and Linux, plus Android and iOS clients. Its synchronized history and
      notification behavior support teams working across devices.
  package-nerd-significance:
    - >
      The Homebrew cask packages the proprietary macOS desktop client, making Flock
      reproducible to install alongside other workplace communication tools without
      implying that its source code is public.
  project-history:
    - >
      Flock was developed as a team communication platform that brings conversations,
      calls, applications, and workplace tools into a shared service. Official materials
      place it within the family of channel-based collaboration products.
  related-projects:
    - >
      Comparable team-chat platforms include Slack and Microsoft Teams; Flock also
      integrates with development and project-management services such as GitHub, Jira,
      Asana, and Trello.
  sources:
    - https://flock.com/download/
    - https://support.flock.com/hc/en-us/articles/360008536933-Download-Flock
    - https://www.flock.com/
  summary:
    - >
      Flock is a proprietary cross-platform team messenger and collaboration service
      with desktop, mobile, and web clients.
  timeline:
    - '2010s: Flock emerged as a channel-based workplace collaboration platform.'
    - >
      2020: Official support documentation described desktop clients for macOS, Windows,
      and Linux alongside mobile and web access.
  usage:
    - >
      Teams use Flock for channels, direct messaging, voice and video calls, shared
      activity, and integrations. The desktop client synchronizes chat history and
      notifications with Flock's other clients.
