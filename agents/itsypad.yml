history:
  adoption-history:
    - >
      Itsypad is distributed as a free, MIT-licensed direct build through GitHub and
      Homebrew, while a paid App Store build supports development and provides automatic
      updates. The variants share the same codebase and CloudKit container.
    - >
      Its Homebrew installation is documented directly in the project README, making the
      open-source build convenient for package-manager-oriented Mac setups.
  package-nerd-significance:
    - >
      Itsypad combines two utilities often installed separately—a persistent scratchpad
      and searchable clipboard history—in a small native application.
    - >
      The repository documents the practical differences between direct and App Store
      builds, including sandbox entitlements and update behavior, which is useful to
      users who care about packaging and provenance.
  project-history:
    - >
      Nick Ustinov develops Itsypad as an open-source native macOS application. It
      evolved beyond a minimal scratchpad to include multiple tabs, split views, syntax
      highlighting, Markdown preview, clipboard history, global shortcuts, and iCloud
      synchronization.
  related-projects:
    - Bonsplit
    - Itsytv
    - Itsyhome
  sources:
    - https://github.com/nickustinov/itsypad-macos
    - source_facts.package-manager
  summary:
    - >
      Itsypad is a native macOS scratchpad, text editor, and clipboard manager designed
      for quick access and low resource use.
  timeline:
    - >
      The project expanded from a small scratchpad into a combined editor and 1,000-item
      clipboard manager with optional cross-device iCloud synchronization.
  usage:
    - >
      Use it for transient notes, Markdown-compatible lists, code snippets, multi-tab
      editing, and searchable clipboard history.
    - >
      It can remain in the menu bar or Dock, open at login, and appear through
      configurable global shortcuts. Tabs and editor state are restored between
      launches.
