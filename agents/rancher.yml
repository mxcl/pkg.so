credentials-file-location: null
history:
  adoption-history:
    - >
      The first public build shipped for macOS and Windows in May 2021, and Linux
      followed as a technology preview later that year. Demand broadened the application
      from a local Kubernetes environment into a general containers-and-Kubernetes
      desktop with selectable container engines and an option to disable Kubernetes.
    - >
      Users also adopted it for disposable development environments: factory reset and
      later snapshot support made it possible to recover from configuration drift
      without rebuilding a host machine.
  package-nerd-significance:
    - >
      Rancher Desktop is a prominent open-source alternative in the
      desktop-container-runtime category. It packages k3s, containerd or Moby, nerdctl
      or Docker-compatible workflows, kubectl, Helm, and virtualization integration
      behind a desktop application and the scriptable `rdctl` interface.
    - >
      Its architecture exposes the packaging challenge behind apparently simple desktop
      container tools: maintaining virtual machines, WSL distributions, networking,
      credential integration, Kubernetes versions, and command-line utilities
      consistently across operating systems.
  project-history:
    - >
      Rancher Desktop began in October 2020 as a nine-file macOS proof of concept that
      launched minikube from a tray icon. The project followed SUSE's acquisition of
      Rancher Labs and aimed to make Kubernetes easier to run on a developer laptop.
    - >
      The first public alpha arrived in May 2021 with macOS and Windows support, k3s,
      the kim image builder, and Kubernetes-version switching. The project later moved
      macOS from minikube and HyperKit-based machinery to Lima and QEMU, while Windows
      used a dedicated WSL distribution. Linux joined through the Lima backend.
    - >
      As users requested broader container compatibility, nerdctl replaced kim and Moby
      was added as another engine. Rancher Desktop consequently evolved from a
      Kubernetes launcher into a local container-and-Kubernetes platform with GUI and
      command-line management.
  related-projects:
    - k3s supplies the lightweight Kubernetes distribution.
    - Lima provides the virtual-machine foundation used on macOS and Linux.
    - >
      containerd with nerdctl and Moby with Docker-compatible tooling provide
      alternative container-engine workflows.
    - kubectl, Helm, and Docker Compose are installed as supporting utilities.
  sources:
    - https://docs.rancherdesktop.io/blog/history-of-rancher-desktop/
    - https://docs.rancherdesktop.io/getting-started/installation/
    - https://docs.rancherdesktop.io/how-to-guides/generating-deployment-profiles/
  summary:
    - >
      Rancher Desktop is an open-source desktop environment for running containers and
      local Kubernetes on macOS, Windows, and Linux.
  timeline:
    - 'October 2020: Began as a macOS minikube proof of concept.'
    - 'May 2021: First public alpha shipped for macOS and Windows.'
    - 'Late 2021: Linux support arrived as a technology preview.'
    - >
      Subsequent releases: Added Lima-based backends, nerdctl, Moby, optional
      Kubernetes, `rdctl`, factory reset, and snapshots.
  usage:
    - >
      Developers use Rancher Desktop to run a local Kubernetes cluster, build and run
      containers, switch between containerd and Moby workflows, and work with bundled
      tools such as kubectl, Helm, nerdctl, Docker Compose, and `rdctl`. Deployment
      profiles support managed defaults and locked settings.
