credentials-file-location: null
history:
  adoption-history:
    - >
      BBTools' adoption is anchored in genomics labs and sequencing pipelines rather
      than general developer workflows. Its official download paths include GitHub,
      SourceForge, and Docker, while Homebrew packages it for macOS and Linux users who
      want the command suite installed alongside other scientific CLI tools.
  package-nerd-significance:
    - >
      BBTools matters to package nerds because it is a dense scientific tool suite
      distributed as many small executables from one upstream project. It is a good
      example of why package managers sometimes need to expose an entire research
      toolkit rather than one binary.
    - >
      It also illustrates the packaging tension around bioinformatics software: users
      need reproducible versions, hundreds of entry points, Java runtime assumptions,
      documentation, and citation metadata, all for tools that may be critical to
      published scientific pipelines.
  project-history:
    - >
      The official site identifies BBMap and BBTools as the official suite created and
      maintained by Brian Bushnell. The GitHub README describes BBTools as fast,
      multithreaded bioinformatics tools for common sequencing formats including FASTQ,
      FASTA, SAM/BAM, GFF/GTF, VCF, and compressed files.
    - >
      The package grew from core read-mapping and read-processing utilities into a broad
      toolbox. The official site lists hundreds of tools, while the README highlights
      core workflows such as adapter trimming, read mapping, error correction, assembly,
      compression optimization, variant calling, and MinHash-style sketch comparison.
    - >
      The upstream README lists the current version as 39.93 and states that BBTools is
      used in production at JGI and cited in thousands of publications.
  related-projects:
    - >
      Related projects include BWA, Bowtie2, SAMtools, FastQC, Trimmomatic, Cutadapt,
      SPAdes, Kraken-style taxonomic tools, and other sequencing QC, alignment,
      assembly, and classification packages.
  sources:
    - https://bbmap.org/
    - https://bbmap.org/tools
    - https://github.com/bbushnell/BBTools#readme
    - input:source_facts.executables
  summary:
    - >
      BBTools is Brian Bushnell's large Java-based suite for DNA and RNA sequencing
      data. The suite includes BBMap, BBDuk, BBMerge, BBNorm, Tadpole, Clumpify,
      CallVariants, sketching tools, and many other command-line utilities.
  timeline:
    - '2014: README citation names `BBMap: A Fast, Accurate, Splice-Aware Aligner`.'
    - 'Current: Official README lists BBTools version 39.93.'
    - >
      Current: Official website describes BBMap/BBTools as Brian Bushnell's maintained
      suite and links GitHub, SourceForge, and Docker distribution paths.
  usage:
    - >
      Common usage is pipeline-oriented: run scripts such as `bbduk.sh` for adapter
      trimming and quality filtering, `bbmap.sh` for short-read alignment, `bbmerge.sh`
      for paired-read merging, `tadpole.sh` for correction or small assembly, and
      `sendsketch.sh` for rapid organism identification.
    - >
      Because it is Java-based and shell-script driven, BBTools is portable across
      Unix-like systems and easy to embed in HPC, workflow-manager, and lab automation
      environments.
related-packages:
  - id: brew:cutadapt
    reason: >
      Choose Cutadapt for a focused, Python-based and error-tolerant adapter/primer
      trimming workflow; BBTools provides the broader BBDuk filtering and preprocessing
      toolbox.
    rel: alternative
    sources:
      - https://bbmap.org/docs/guides/bbdukguide
      - https://cutadapt.readthedocs.io/en/stable/
  - id: brew:bwa
    reason: >
      Choose BWA for the established Burrows-Wheeler short-read mapping workflow; BBMap
      offers a Java-based aligner within a much larger read-processing suite.
    rel: alternative
    sources:
      - https://bbmap.org/docs/guides/bbmapguide
      - https://github.com/lh3/bwa#readme
  - id: brew:samtools
    reason: >
      BBMap can produce SAM alignments that SAMtools can then convert, sort, index,
      inspect, and otherwise process as SAM/BAM/CRAM data.
    rel: adjacent_workflow
    sources:
      - https://bbmap.org/docs/guides/bbmapguide
      - https://www.htslib.org/doc/samtools.html
