history:
  adoption-history:
    - >
      The desktop application extends remove.bg from single web uploads into a Windows,
      macOS, and Linux bulk-processing workflow. Its drag-and-drop queue and high-volume
      positioning are aimed at photographers, ecommerce teams, marketers, and other
      users processing many assets.
  package-nerd-significance:
    - >
      The package is a desktop front end to a hosted image-processing service rather
      than a self-contained offline background-removal engine. Package users should
      therefore account for authentication, service credits, and network access in
      addition to installing the local application.
  project-history:
    - >
      remove.bg developed the desktop application as a companion to its automatic
      background-removal service. The product combines local batch and output controls
      with processing performed through the remove.bg service; the official site now
      identifies remove.bg as a Canva Austria GmbH brand.
  related-projects:
    - >
      remove.bg also provides a web application, API, command-line tooling,
      integrations, and a Photoshop extension.
  sources:
    - 'Official desktop Help Center: https://www.remove.bg/help/remove-bg-for-desktop'
    - 'Official desktop app page: https://www.remove.bg/i/desktop-app'
    - 'Official login guide: https://www.remove.bg/help/a/log-in-to-the-desktop-app'
  summary:
    - >
      remove.bg is a cross-platform desktop client for automatically removing image
      backgrounds in bulk through the remove.bg service.
  timeline:
    - >
      Desktop-app era: remove.bg expanded its service with a Windows, macOS, and Linux
      client for queued bulk processing.
    - 'Current branding: The official site identifies remove.bg as a Canva Austria GmbH brand.'
  usage:
    - >
      Users drag images or folders into a queue, select backgrounds, templates, shadows,
      and output formats, and submit batches for processing.
    - >
      The client can authenticate through the user's remove.bg account or an API key.
      Credits and an internet connection are required for service-backed processing.
