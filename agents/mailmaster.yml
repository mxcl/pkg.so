history:
  adoption-history:
    - >
      NetEase distributes Mail Master across desktop and mobile platforms for users
      managing NetEase and third-party personal, educational, and enterprise mailboxes.
      Its account synchronization is intended to provide consistent contacts and
      mail-sorting rules across devices.
  package-nerd-significance:
    - >
      Mail Master is notable in Mac package catalogs as a proprietary, China-focused
      multi-account client supporting standard IMAP, POP3, SMTP, and Exchange services
      alongside NetEase's own cloud-assisted account configuration and synchronization.
  project-history:
    - >
      NetEase developed Mail Master as an all-purpose client extending its long-running
      email services beyond webmail. The Mac edition is distributed under the
      application name MailMaster.app and is also available through Homebrew as the
      mailmaster cask.
  related-projects:
    - NetEase Mail
    - Apple Mail
    - IMAP
    - POP3
    - SMTP
    - Microsoft Exchange
  sources:
    - https://apps.apple.com/cn/app/id1233593954?mt=12
    - source_facts.applications
    - source_facts.homepage
    - source_facts.package-manager.brew-cask
  summary:
    - >
      NetEase Mail Master is a multi-account email client for personal, educational, and
      enterprise mailboxes, with desktop/mobile synchronization and mail-management
      features.
  timeline:
    - >
      2024-01-08: NetEase's Mac App Store history records a stability and
      message-composition update for the Mac client.
  usage:
    - >
      Users add one or more mailboxes and let the client select an appropriate
      configuration, or manually use standard protocols such as IMAP, POP3, SMTP, or
      Exchange. NetEase accounts can use NetEase-specific synchronization, while other
      providers may require their own passwords or application-specific authorization
      codes.
    - >
      The official listing highlights conversation views, automatic organization rules,
      shared team address groups, templates, scheduled sending, invitations, and
      multiple signatures. No official filesystem location for client configuration or
      credentials is documented.
