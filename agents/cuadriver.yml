history:
  adoption-history:
    - >
      Cua Driver is distributed for macOS, Windows, and Linux and can connect to
      MCP-capable agent harnesses. Official documentation explicitly presents
      integrations for Codex, Claude Code, and other agents, plus Python and TypeScript
      SDK surfaces.
    - >
      It is developed inside the wider Cua monorepo, allowing the driver to share
      computer-use concepts, validation infrastructure, sandbox integrations, and
      release engineering with other Cua components.
  package-nerd-significance:
    - >
      Cua Driver packages operating-system accessibility trees, screenshots, input
      delivery, browser targeting, permission checks, and session management behind
      reusable CLI, MCP, and SDK interfaces.
    - >
      For agent-tooling users, its background-first interaction model is notable because
      it attempts to operate supported applications without taking over the human user's
      pointer or foreground window, while reporting platform limitations and side
      effects.
  project-history:
    - >
      The Cua repository was established in 2025 as an open-source computer-use
      automation platform. Cua Driver became its cross-platform layer for operating
      existing desktops through native accessibility and input facilities.
    - >
      The driver developed multiple integration surfaces: an executable for CLI and MCP
      use, a daemon model where operating-system identity must persist, and in-process
      Python and TypeScript SDK bindings backed by the same Rust contract.
  related-projects:
    - >
      Cua Sandbox and Cua Fleets provide isolated local or cloud computers, whereas Cua
      Driver operates applications on an existing desktop.
    - >
      MCP is one of the agent-facing transports exposed by the driver; typed Python and
      TypeScript SDKs serve application developers.
  sources:
    - https://cua.ai/docs/cua-driver/concepts/how-cua-driver-works
    - https://cua.ai/docs/cua-driver/quickstart
    - https://github.com/trycua/cua
    - https://github.com/trycua/cua/blob/main/libs/cua-driver/README.md
  summary:
    - >
      Cua Driver is Cua's cross-platform computer-use runtime for letting AI agents
      inspect and operate native desktop applications through CLI, MCP, or typed SDKs.
  timeline:
    - '2025: The public Cua repository was established.'
    - >
      2026: The Rust-backed Cua Driver shipped versioned stable releases for macOS,
      Windows, and Linux through the Cua monorepo.
  usage:
    - >
      Start the driver, grant the required operating-system accessibility and
      screen-capture permissions, then connect an agent through its MCP integration or
      use `cua-driver call` from the command line.
    - >
      Applications can embed the same runtime through Python or TypeScript bindings.
      Users should re-observe the desktop after sessions expire and verify resulting
      application state rather than treating a successful input call as proof of task
      success.
