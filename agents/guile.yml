  unix:
    - ~/.guile
credentials-file-location: null
history:
  adoption-history:
    - >
      Guile's adoption within GNU and free-software packaging rests on both policy and
      practicality: it is the official GNU extension language, but it is also a real
      Scheme implementation with batteries included for Unix programming. The project
      site names GNU Guix, GnuCash, Lepton-EDA, and GDB among applications using Guile.
    - >
      Package-manager adoption is broad because Guile is both a language runtime and a
      dependency for other GNU tools. The official download page recommends installing
      from system packages and gives examples for Guix, Debian-derived systems, and
      Parabola; the input metadata records packaging through Alpine, Homebrew,
      Fedora-family packages, MacPorts, Nix, Arch, and openSUSE.
  package-nerd-significance:
    - >
      Guile is a foundational package because it is both a language implementation and
      an extension substrate for other packages. When it changes ABI, compiler behavior,
      module paths, or supported Scheme standards, downstream build systems and runtime
      integrations can feel it.
    - >
      It is also historically important to package-manager culture through GNU Guix,
      which uses Guile as a configuration and extension language. That connection makes
      Guile unusually visible to users who care about declarative package management,
      reproducible builds, and Lisp-family tools in Unix distributions.
  project-history:
    - >
      The Guile manual frames Guile as an attempt to bring the Emacs extension-language
      model to the broader GNU system: a low-level application core paired with a
      powerful high-level language that users and developers can extend.
    - >
      Guile began from Tom Lord's GEL, the GNU Extension Language, which adapted Aubrey
      Jaffer's SCM Scheme implementation into a reusable embeddable library. The manual
      traces SCM itself to George Carrette's SIOD, making Guile part of a longer Scheme
      implementation lineage.
    - >
      GEL became Guile after a naming conflict, and Richard Stallman endorsed it as the
      official GNU extension language. Public discussion around Tcl made Guile visible
      during the 1990s extension-language debate, but the manual is careful to say Guile
      was not simply a reaction to Tcl; it came from a standing GNU need for a shared
      embeddable language runtime.
    - >
      The first maintainer era, from late 1994 through mid-1996, moved Guile from SCM as
      a standalone program toward an embeddable library and experimented broadly with
      modules, Tcl/Tk, Java tooling, C-like syntax, and POSIX interfaces. Later
      maintainers narrowed the focus toward depth, documentation, orthogonality, and a
      strong core language.
  related-projects:
    - >
      Guile is directly related to Scheme, SCM, SIOD, Emacs Lisp, Tcl/Tk debates, GNU
      Emacs as an extension-language model, GNU Guix, GnuCash, Lepton-EDA, GDB, Geiser,
      R5RS, R6RS, R7RS, SRFIs, GMP, and libunistring. Its ecosystem also includes many
      Guile libraries and applications maintained around GNU and Scheme communities.
  sources:
    - https://www.gnu.org/software/guile/
    - https://www.gnu.org/software/guile/download/
    - https://www.gnu.org/software/guile/manual/html_node/A-Scheme-of-Many-Maintainers.html
    - >
      https://www.gnu.org/software/guile/manual/html_node/A-Timeline-of-Selected-Guile-Releases.html
    - https://www.gnu.org/software/guile/manual/html_node/Early-Days.html
    - https://www.gnu.org/software/guile/manual/html_node/Guile-and-Scheme.html
    - https://www.gnu.org/software/guile/manual/html_node/History.html
    - https://www.gnu.org/software/guile/manual/html_node/The-Emacs-Thesis.html
  summary:
    - >
      GNU Guile is the GNU project's extension-language platform and an implementation
      of Scheme designed for embedding, scripting, and standalone programming. It
      packages an interpreter, compiler, virtual machine, module system, POSIX access,
      networking, dynamic linking, foreign-function support, and libraries under the
      Guile toolchain.
  timeline:
    - >
      1994-1996: Tom Lord maintains early Guile/GEL work, moving SCM toward an
      embeddable GNU extension library.
    - '1995-02-04: guile-i release turns SCM into a library.'
    - >
      1995-04-06: guile-ii adds a low-level module system, Tcl/Tk support, improved
      POSIX support, and experimental Java integration.
    - >
      1997-01-05: Guile 1.0 adds cooperative threading, improves debugging, begins
      manuals, and adds the high-level module interface.
    - '2002-09-06: Guile 1.6 gains R5RS support, SRFI modules, and merges GOOPS into core.'
    - >
      2006-02-20: Guile 1.8 moves arbitrary-precision arithmetic to GMP, adopts POSIX
      preemptive threads, and cleans up the C API.
    - >
      2010-02-16: Guile 2.0 adds a virtual machine, compiler, toolchain,
      Unicode-oriented internationalization, dynamic FFI, and partial R6RS support.
    - >
      2017-03-15: Guile 2.2 rewrites the virtual machine and much of the compiler and
      toolchain for speed and lower startup cost.
    - >
      2020-01: Guile 3.0 adds native code generation through a simple JIT compiler and
      improves R7RS/R6RS support.
  usage:
    - >
      Users run Guile scripts, work in a Scheme REPL, build command-line programs, embed
      Guile in C or C++ applications, and extend applications through Scheme modules.
      The project page emphasizes desktop, web, command-line, and game use, while also
      describing Guile as an extension-language platform with a compiler and virtual
      machine.
    - >
      For package users, the important executables are `guile`, `guild`, `guile-config`,
      `guile-snarf`, and `guile-tools`. For developers, Guile's appeal is a practical
      Scheme with R5RS, much of R6RS, R7RS support, SRFIs, modules, POSIX APIs,
      networking, threads, dynamic linking, and FFI.
related-packages:
  - id: brew:mit-scheme
    reason: >
      MIT/GNU Scheme is an alternative complete Scheme development environment with its
      own compiler, debugger, editor, and runtime library; choose Guile when GNU
      application embedding and extension-language integration are the priority.
    rel: alternative
    sources:
      - https://www.gnu.org/software/guile/manual/
      - https://www.gnu.org/software/mit-scheme/
  - id: cask:gnucash
    reason: >
      GnuCash embeds Guile to execute its Scheme report system, so Guile knowledge and
      tooling are directly useful when creating or modifying GnuCash reports.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/guile/
      - https://www.gnucash.org/docs/v5/C/gnucash-manual.pdf
      - https://wiki.gnucash.org/wiki/Custom_Reports
