id: brew:counts
display-name: counts
repo: null
docs:
  - https://github.com/nnethercote/counts#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation is through `cargo install counts`, with Homebrew adding a
      binary-package route for users who prefer system package managers.
  package-nerd-significance:
    - >
      For package nerds, `counts` is interesting because it deliberately packages a
      Unix-pipeline-shaped workflow as a fast single-purpose Rust binary: no daemon, no
      config, and no profiler integration required.
  project-history:
    - >
      The public repository was created in 2018. The README positions `counts` as an
      improved alternative to the Unix `sort | uniq -c` pipeline for profiling data
      gathered from logging print statements.
    - The project reached a 1.0.0 release in 2023 and continued with later 1.0.x releases.
  related-projects:
    - Rust
    - cargo install
    - sort
    - uniq
  sources:
    - https://github.com/nnethercote/counts
    - https://api.github.com/repos/nnethercote/counts
    - https://github.com/nnethercote/counts/releases
  summary:
    - >
      counts is a Rust command-line tool for ad hoc profiling by tallying repeated text
      lines and presenting frequency and weighted-frequency summaries.
  timeline:
    - '2018: Public GitHub repository created.'
    - '2020: 0.1.2 release published.'
    - '2023: 1.0.0 release published.'
    - '2026: 1.0.7 release published.'
  usage:
    - >
      The tool is commonly used by inserting temporary logging into a program, piping or
      saving those logs, and then using `counts` to aggregate hot paths, loop counts,
      allocation sizes, or other domain-specific measurements.
    - >
      The README includes a Firefox heap allocator instrumentation example, showing
      `counts` applied to millions of log lines and weighted byte totals.
