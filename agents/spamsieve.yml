id: cask:spamsieve
display-name: SpamSieve
repo: null
docs:
  - https://c-command.com/spamsieve/manual
  - https://c-command.com/spamsieve/help/version-history
config-file-location:
  macos:
    - ~/Library/Preferences/com.c-command.SpamSieve.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      SpamSieve expanded from its initial Mac OS X release to integrate with Apple Mail
      and numerous third-party mail clients through plug-ins, extensions, scripts, and
      direct application support.
    - >
      Its long-running version history tracks adaptations to successive macOS and
      mail-client changes. SpamSieve 3 replaced the older Apple Mail plug-in on macOS
      Sonoma with a Mail extension and migrated existing training data and statistics.
  package-nerd-significance:
    - >
      SpamSieve is a durable example of commercial Mac shareware maintained across
      decades of operating-system and mail-client API changes. For package-manager
      users, its Homebrew cask offers a repeatable installation path while the
      application retains locally trained data outside the app bundle.
    - >
      Its local Bayesian corpus, allowlist, blocklist, logs, and preferences also make
      it a useful case study in separating replaceable application binaries from
      user-specific state that should be backed up before upgrades or migration.
  project-history:
    - >
      Michael Tsai released SpamSieve 1.0 on September 10, 2002 through C-Command
      Software. It began as a trainable Bayesian spam filter integrated with Mac e-mail
      applications.
    - >
      Later releases broadened client integration, improved parsing and accuracy, added
      allowlists, blocklists, statistics, and detailed logging, and repeatedly revised
      integrations as Apple and Microsoft changed their mail clients.
  related-projects:
    - >
      C-Command Software also develops the Mac applications EagleFiler, DropDMG, and
      ToothFairy.
    - >
      SpamSieve integrates with Apple Mail, Microsoft Outlook, Airmail, MailMate,
      GyazMail, and other supported Mac mail clients.
  sources:
    - https://c-command.com/spamsieve/
    - https://c-command.com/spamsieve/help/version-history
    - https://c-command.com/spamsieve/manual
    - https://c-command.com/spamsieve/why
  summary:
    - >
      SpamSieve is a long-running macOS spam-filtering application that uses locally
      trained Bayesian classification and integrates with multiple desktop mail clients.
  timeline:
    - '2002: SpamSieve 1.0 received its first public release.'
    - "2003: Macworld honored SpamSieve with an Editors' Choice award."
    - >
      2023: SpamSieve 3 introduced a rewritten Apple Mail integration and new corpus,
      list, and log storage.
  usage:
    - >
      Users train messages as good or spam from their mail client; SpamSieve builds a
      personalized local corpus and combines it with allowlist, blocklist, contact, and
      message-content checks.
    - >
      The official manual recommends backing up both `~/Library/Application
      Support/SpamSieve/` and `~/Library/Preferences/com.c-command.SpamSieve.plist` when
      migrating training data and preferences to another Mac.
tags:
