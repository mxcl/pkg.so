id: brew:ripsecrets
display-name: ripsecrets
repo: null
docs:
  - https://github.com/sirwart/ripsecrets#readme
config-file-location:
  unix:
    - ./.secretsignore
  windows:
    - .\.secretsignore
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents distribution through Homebrew, prebuilt releases,
      Cargo, Nix flakes, and the pre-commit framework; source_facts.package-manager
      confirms Homebrew and Nix packaging.
  package-nerd-significance:
    - >
      ripsecrets represents the small, single-purpose Rust security utility: locally
      executed, dependency-free at runtime, and designed to fit directly into Git's
      pre-commit path without sending candidate secrets to a service.
  project-history:
    - >
      ripsecrets was developed as a local-first command-line secret scanner emphasizing
      pre-commit prevention, fast execution, probabilistic detection, and low
      false-positive rates.
  related-projects:
    - >
      Git pre-commit hooks and the pre-commit framework provide integration points. The
      tool supports detect-secrets-style inline allowlist comments.
  sources:
    - https://github.com/sirwart/ripsecrets#readme
    - https://github.com/sirwart/ripsecrets/blob/main/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      ripsecrets is a local command-line scanner intended to stop secret keys from
      entering source control, especially through pre-commit checks.
  timeline:
    - '2020s: ripsecrets emerged as a Rust-based, local-first pre-commit secret scanner.'
    - >
      2020s: Packaging expanded to Homebrew, Nix, Cargo, prebuilt binaries, and the
      pre-commit ecosystem.
  usage:
    - >
      Run `ripsecrets` to scan the current directory or pass files and directories
      explicitly. A nonzero exit status indicates detected secrets.
    - >
      Run `ripsecrets --install-pre-commit` to install its Git hook. `.secretsignore` is
      an ignore-policy file used by scans, not an application configuration or
      credential store.
