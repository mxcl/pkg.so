history:
  adoption-history:
    - >
      Bdash targets analysts and developers who want one graphical client for several
      data platforms. Its official compatibility list includes MySQL, PostgreSQL and
      Amazon Redshift, SQLite, Google BigQuery, Treasure Data, and Amazon Athena.
  package-nerd-significance:
    - >
      Bdash is notable as a lightweight, open-source alternative to larger database
      workbenches. Its multi-source support, charting, saved queries, and
      package-manager availability make it useful on data-oriented developer
      workstations.
  project-history:
    - >
      Bdash has been developed publicly as an MIT-licensed desktop SQL client. The
      project distributes application builds through its website and GitHub releases,
      with release automation maintained in the same source repository.
    - >
      The project later added a bundled Model Context Protocol server, allowing
      compatible AI coding tools to inspect configured data sources and manipulate
      queries in the Bdash editor.
  related-projects:
    - >
      Supported systems include MySQL, PostgreSQL, Amazon Redshift, SQLite, Google
      BigQuery, Treasure Data, and Amazon Athena.
    - >
      Query results can be shared through GitHub Gist, and the bundled MCP server can
      integrate with compatible AI coding tools.
  sources:
    - 'Official project website linked by the repository: https://bdash.hokaccha.dev/'
    - 'Official repository and README: https://github.com/bdash-app/bdash'
  summary:
    - >
      Bdash is an open-source desktop SQL client designed for lightweight data analysis
      across multiple database and cloud-query systems.
  timeline:
    - 'Public project: Bdash developed as an MIT-licensed SQL client.'
    - >
      Later development: Charting, result sharing, and support for multiple data sources
      became core features.
    - 'Recent development: The application gained a bundled Model Context Protocol server.'
  usage:
    - >
      Users configure one or more supported data sources, write and save SQL queries,
      inspect results, and turn query output into charts.
    - >
      Results can be shared using GitHub Gist. The optional MCP server exposes tools for
      listing data sources, queries, tables, and schemas, as well as creating or editing
      queries.
