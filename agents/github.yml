history:
  adoption-history:
    - >
      The unified Electron implementation replaced the earlier separate Mac and Windows
      codebases, giving GitHub a single open-source desktop client across both supported
      platforms. GitHub positioned it for newcomers who wanted Git without the command
      line as well as experienced users moving among many repositories.
    - >
      By 2020, GitHub reported more than one million monthly GitHub Desktop users and
      hundreds of direct contributors. The project continues as a community-supported
      open-source application closely integrated with GitHub and GitHub Enterprise.
  package-nerd-significance:
    - >
      GitHub Desktop is one of the most visible GUI layers over Git and a prominent
      example of an Electron application replacing separate native clients. For package
      enthusiasts, it illustrates the trade-off between a unified cross-platform release
      pipeline and native platform packaging.
    - >
      Its source repository is also the upstream reference point that distinguishes
      official macOS and Windows builds from community-maintained Linux forks. The
      Homebrew cask's historical token `github` is less explicit than the installed
      application's actual name, GitHub Desktop.
  project-history:
    - >
      GitHub originally maintained separate native desktop applications for Mac and
      Windows. In May 2017 it released a newly designed open-source beta rebuilt in
      Electron, consolidating the product into one TypeScript and React codebase.
    - >
      The rewritten GitHub Desktop reached version 1.0 on September 19, 2017. Later
      development expanded beyond basic cloning, commits, branches, and synchronization
      to include features such as line-level commit selection, image and split diffs,
      pull-request checkout, stashing, history manipulation, and deeper GitHub
      integration.
  related-projects:
    - Git, the underlying distributed version-control system
    - GitHub and GitHub Enterprise
    - Electron, the cross-platform desktop runtime
    - React and TypeScript, used by the open-source client
    - shiftkey/desktop, an unofficial community Linux fork
  sources:
    - https://docs.github.com/en/desktop/overview/about-github-desktop
    - >
      https://github.blog/engineering/architecture-optimization/how-four-native-developers-wrote-an-electron-app/
    - >
      https://github.blog/news-insights/announcing-git-integration-for-atom-and-github-desktop-beta/
    - https://github.blog/news-insights/announcing-github-desktop-1-0/
    - >
      https://github.blog/news-insights/product-news/introducing-split-diffs-in-github-desktop/
    - https://github.com/desktop/desktop
  summary:
    - >
      GitHub Desktop is GitHub's free, open-source graphical Git client for macOS and
      Windows. The current cross-platform application was introduced in 2017 as an
      Electron rewrite of GitHub's earlier separate native clients.
  timeline:
    - '2017: GitHub released the unified Electron-based Desktop beta'
    - '2017: GitHub Desktop 1.0 was released on September 19'
    - '2020: GitHub reported more than one million monthly users of the current application'
  usage:
    - >
      GitHub Desktop provides visual workflows for cloning and creating repositories,
      reviewing changes, selecting changes for commits, managing branches, fetching and
      pushing, resolving conflicts, viewing history, and opening pull requests. It is
      designed to make common Git operations accessible without requiring command-line
      use.
    - >
      The application works with GitHub and GitHub Enterprise and can also manage local
      repositories associated with other Git hosting services. Authentication and
      GitHub-specific collaboration features are integrated into the desktop interface.
