history:
  adoption-history:
    - >
      Cowsay became a familiar package-manager fixture because it is tiny, scriptable,
      harmless, and visually distinctive. The Homebrew formula data in this batch lists
      it across Homebrew, Debian, Ubuntu, Fedora, Arch, Alpine, MacPorts, Nix, Scoop,
      and openSUSE-style packaging, reflecting its broad life as a demonstration,
      shell-customization, and terminal-joke package.
  package-nerd-significance:
    - >
      For package maintainers, Cowsay is a classic low-risk novelty package: it
      exercises Perl script installation, data-file handling for cowfiles, manpage-style
      documentation, and cross-platform packaging while remaining easy to test by
      invoking a single executable.
  project-history:
    - >
      The current cowsay-org project preserves Tony Monroe's original Cowsay. The
      project README says Monroe first released Cowsay in 1999, after using it privately
      for some time. Early versions evolved from one cow and a fixed message template
      into arbitrary messages, multiple cowfiles, figlet support, and a Perl 5 rewrite.
    - >
      In 2016, Monroe published a final 3.04 version on GitHub and indicated that he was
      no longer interested in maintaining it. Andrew Janke later created the cowsay-org
      fork to provide maintenance, hosting, deployment support, random cow selection,
      and pluggable third-party cow collections.
  related-projects:
    - >
      The README explicitly compares Cowsay's spirit to figlet, and points to
      third-party cowfile collections plus cowsay-org's cows-offensive collection for
      historical cowfiles kept outside the main distribution.
  sources:
    - https://github.com/cowsay-org/cowsay#readme
  summary:
    - >
      Cowsay is a Perl terminal novelty program that prints a message in a speech
      balloon next to an ASCII cow. Its official maintained fork describes it as a
      small, deliberately silly Unix-style program in the spirit of figlet.
  timeline:
    - '1999: Tony Monroe first released Cowsay publicly.'
    - '2016: Monroe published a final 3.04 version on GitHub for others to use.'
    - >
      2016 onward: Andrew Janke's cowsay-org fork provided ongoing maintenance and
      modern hosting.
  usage:
    - >
      Typical use is as a command-line filter or generator: users run cowsay or cowthink
      with a message, often in login banners, demos, shell pipelines, CI jokes, or
      examples that need recognizable terminal output without real domain complexity.
related-packages:
  - id: brew:figlet
    reason: >
      FIGlet renders text as large terminal lettering, and Cowsay's official history
      documents direct support for cows speaking FIGlet output, making the two tools a
      natural ASCII-art pipeline.
    rel: adjacent_workflow
    sources:
      - https://github.com/cowsay-org/cowsay#readme
      - https://www.figlet.org/
