id: brew:juju
display-name: Juju
repo: null
docs:
  - https://documentation.ubuntu.com/juju/latest
config-file-location:
  unix:
    - $JUJU_DATA/clouds.yaml
    - $JUJU_DATA/controllers.yaml
    - $JUJU_DATA/models.yaml
    - ~/.local/share/juju/clouds.yaml
    - ~/.local/share/juju/controllers.yaml
    - ~/.local/share/juju/models.yaml
credentials-file-location:
  unix:
    - $JUJU_DATA/credentials.yaml
    - ~/.local/share/juju/credentials.yaml
history:
  adoption-history:
    - >
      By July 2015, Canonical was publishing Kubernetes 1.0 deployment workflows through
      Juju charms. In June 2016, Canonical announced additional storage and networking
      vendors in the Juju Charm Partner Program, showing an attempt to build an
      ecosystem around reviewed, reusable operations code.
  package-nerd-significance:
    - >
      Juju is notable in package-manager culture because the CLI is only the tip of a
      larger distributed control plane. Installing the package gives access to an
      ecosystem of charms, Charmhub, cloud credentials, controller state, and model data
      rather than a self-contained utility.
  project-history:
    - >
      Juju grew out of Canonical's effort to make operations code reusable. Official
      documentation describes charms as operators that package the instructions needed
      to deploy, configure, scale, integrate, and manage applications on supported
      clouds. The model/controller split became central: users bootstrap a controller,
      create models, deploy charms, and let agents reconcile desired state.
  related-projects:
    - Charmhub is the charm and bundle discovery surface for Juju users.
    - >
      The Operator Framework-style Ops library is the standard framework for modern
      charm authors.
    - >
      MAAS, LXD, Kubernetes, and OpenStack are common infrastructure contexts for Juju
      deployments.
  sources:
    - https://canonical.com/blog/vendors-embrace-juju-model-driven-operations
    - https://documentation.ubuntu.com/juju/3.6/explanation/juju-architecture/
    - https://documentation.ubuntu.com/juju/3.6/reference/charm/
    - https://documentation.ubuntu.com/juju/3.6/reference/model/
    - https://documentation.ubuntu.com/juju/latest
    - https://formulae.brew.sh/formula/juju
    - https://github.com/juju/juju
    - https://ubuntu.com/blog/launch-the-newly-released-kubernetes-1-0-0-with-juju
  summary:
    - >
      Juju is Canonical's model-driven operations and application orchestration tool. It
      uses charms, controllers, models, and relations to deploy, integrate, scale, and
      operate software across Kubernetes, virtual machines, bare metal, and public or
      private clouds.
  timeline:
    - '2014: GitHub tags show the 1.20.0 release line.'
    - '2015: Canonical documented Kubernetes 1.0 deployment through Juju charms.'
    - '2016: Canonical announced added vendors in the Juju Charm Partner Program.'
    - '2020: GitHub tags show the 2.8.0 release line.'
    - '2023: GitHub tags show a 3.0 end-of-life marker, reflecting the 3.x generation.'
  usage:
    - >
      The Homebrew package exposes the `juju` CLI and related metadata tooling for
      bootstrapping controllers, adding models, deploying charms, managing credentials,
      and integrating applications. The CLI is both a local client and the main entry
      point into Juju's controller-backed orchestration model.
related-packages: []
tags:
  - application-deployment
  - charms
  - cli
  - devops
  - infrastructure
  - kubernetes
  - orchestration
