history:
  adoption-history:
    - >
      Apprise's adoption came from the automation and self-hosting world: backup
      scripts, monitoring jobs, CI tasks, download managers, and home-lab tools can send
      alerts through whatever notification service a user already has. Package
      availability across Homebrew, Debian, Fedora, Arch, Alpine, Nix, and Ubuntu
      reflects that sysadmin-style use case.
    - >
      Because Apprise is both a library and a CLI, it fits into Python applications as
      an embedded notification backend and into shell scripts as a standalone `apprise`
      command.
  package-nerd-significance:
    - >
      Apprise is package-manager-friendly glue: it turns dozens of optional API
      integrations into one dependency with a stable CLI surface. That makes it
      attractive to packagers and downstream tools that want broad notification support
      without vendoring service-specific clients.
    - >
      The package is also a reminder that URL schemes can be a compact configuration
      language. For package nerds, Apprise's long service table is effectively a
      registry of notification transports encoded as CLI-friendly strings.
  project-history:
    - >
      PyPI records Apprise releases beginning with 0.0.1 in November 2017. The official
      README frames the project as a way for developers and operators to avoid writing
      one integration per notification provider.
    - >
      The 1.0.0 release appeared on PyPI in August 2022, and current releases continue
      to add providers and service syntax while keeping the central model: notification
      targets are encoded as URLs and can be supplied directly, through config files, or
      through environment variables.
  related-projects:
    - Apprise API is a companion service endpoint supported by Apprise URLs.
    - >
      The project overlaps operationally with provider-specific CLIs and webhook senders
      for Slack, Discord, Telegram, Gotify, ntfy, email, and SMS services.
  sources:
    - https://appriseit.com/
    - https://github.com/caronc/apprise#readme
    - https://github.com/caronc/apprise/blob/master/apprise/cli.py
    - https://pypi.org/pypi/apprise/json
  summary:
    - >
      Apprise is a Python notification library and CLI that sends messages to many
      notification services through one URL syntax. It wraps services such as Discord,
      Slack, Telegram, Gotify, email, SMS gateways, webhooks, and desktop notification
      systems behind one command and API.
  timeline:
    - '2017: PyPI records the first Apprise 0.0.1 release.'
    - '2022: PyPI records Apprise 1.0.0.'
    - '2026: PyPI records active 1.x releases, including 1.11.0.'
  usage:
    - >
      The most direct CLI usage is to pass one or more notification URLs and a message
      body. More durable setups store URLs in Apprise config files, which the CLI
      searches by default, or point to explicit config locations with `--config`.
    - >
      Apprise configuration files often contain provider tokens, webhook IDs, API keys,
      or passwords as part of service URLs. The project does not document a separate
      credentials file; secrets live in the notification URLs/configs users choose.
related-packages:
  - id: brew:ntfy
    reason: >
      Choose ntfy when the task is specifically phone or desktop push through an ntfy
      topic and you want a dedicated hosted-or-self-hosted service and CLI instead of
      Apprise's multi-provider abstraction.
    rel: alternative
    sources:
      - https://appriseit.com/services/ntfy/
      - https://docs.ntfy.sh/
  - id: brew:gotify
    reason: >
      Choose Gotify-CLI when notifications only need to target a self-hosted Gotify
      server and a focused first-party client with stored server and application-token
      configuration is preferable.
    rel: alternative
    sources:
      - https://appriseit.com/services/gotify/
      - https://github.com/gotify/cli
      - https://github.com/gotify/server
