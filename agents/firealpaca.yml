history:
  adoption-history:
    - >
      The official site reports several million users across more than 200 regions and
      countries and support for ten interface languages.
    - >
      FireAlpaca broadened its reach through Windows and macOS releases, later adding
      Linux distribution and the paid FireAlpaca SE edition while retaining the standard
      freeware edition.
  package-nerd-significance:
    - >
      FireAlpaca is a long-running example of freeware creative software that offers a
      lightweight alternative to larger painting suites and is readily installed on
      macOS through Homebrew Cask.
    - >
      Its native MDP format, PSD interoperability, customizable brushes,
      animation-oriented onion-skin tools, and separate enhanced Steam edition give it a
      distinct place among packaged desktop art applications.
  project-history:
    - >
      FireAlpaca was created by PGN Inc. as free digital-painting software. Its official
      update history begins with version 1.0.0 and records steady additions to brushes,
      layers, text, perspective, animation, time-lapse, and color-management workflows.
    - >
      The project later gained FireAlpaca SE, a paid edition with additional features
      and brushes, while the standard edition continued as sponsored freeware.
  related-projects:
    - FireAlpaca SE is the enhanced commercial edition.
    - openCanvas is another painting application from PGN Inc.
    - iLMiNA is PGN's related mobile painting application.
  sources:
    - https://firealpaca.com/
    - https://firealpaca.com/download/
    - https://firealpaca.net/category/manual/
    - https://firealpaca.net/frequently-asked-questions-about-firealpaca/
  summary:
    - >
      FireAlpaca is PGN Inc.'s cross-platform digital-painting application, offered as a
      free standard edition with an enhanced paid SE edition.
  timeline:
    - 'Version 1.0.0: First public release recorded in the official update history.'
    - >
      Version 1.5.0: Added pattern and bitmap brushes, onion-skin display, and
      sequential PNG output for animation workflows.
    - >
      Version 2.x: Continued expansion into time-lapse, deformation, color, reference,
      and brush-management features.
    - >
      2025: The official backup feature expanded to cover brushes, colors, gradients,
      and shortcut settings.
  usage:
    - >
      Artists use FireAlpaca for illustration, painting, comics, basic frame-by-frame
      animation, and layered image editing with brushes, selections, perspective aids,
      filters, and PSD-compatible workflows.
    - >
      The official license guidance permits personal and commercial use of artwork
      created with FireAlpaca.
