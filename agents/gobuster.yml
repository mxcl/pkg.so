history:
  adoption-history:
    - >
      Gobuster spread through security-oriented packaging because it solves a common
      reconnaissance task with a single compiled binary. The input package facts map it
      across Homebrew, Debian/Ubuntu, Fedora, Alpine, Arch, Nix, MacPorts, Scoop, and
      openSUSE-style packaging, and Homebrew provides a formula with binary bottles for
      macOS and Linux.
  package-nerd-significance:
    - >
      Gobuster matters to package nerds because it is one of the Go-era replacements for
      slower or interpreter-bound enumeration workflows. It packages cleanly as one
      binary, has no runtime language stack to manage, and has enough real-world
      security demand that it appears across many operating-system and cross-platform
      package collections.
  project-history:
    - >
      The public GitHub repository was created in November 2014, with the project
      description centered on directory/file, DNS, and virtual-host busting in Go.
      GitHub release records show a v2.0.1 release in September 2018 and the v3 series
      beginning in June 2019.
  related-projects:
    - >
      Gobuster sits alongside directory and content discovery tools such as dirb,
      dirsearch, ffuf, feroxbuster, and wfuzz.
    - >
      Its Go implementation and mode-based design make it part of the same packaging
      wave as other single-binary security CLIs.
  sources:
    - https://api.github.com/repos/OJ/gobuster
    - https://api.github.com/repos/OJ/gobuster/releases?per_page=100
    - https://formulae.brew.sh/formula/gobuster
    - https://github.com/OJ/gobuster
  summary:
    - >
      Gobuster is a Go security CLI for brute-force enumeration of web directories and
      files, DNS names, virtual hosts, cloud storage buckets, TFTP paths, and fuzzing
      targets. It is a staple-style package: simple to install, easy to script, and
      usually paired with wordlists during penetration testing and security assessment
      work.
  timeline:
    - '2014-11-14: Public GitHub repository created'
    - '2018-09-11: v2.0.1 release published'
    - '2019-06-19: v3.0.0 release published'
    - '2022-10-08: v3.2.0 release published'
    - '2025-09-04: v3.8.2 release published'
  usage:
    - >
      The README documents a mode-based interface: dir mode for web paths, dns mode for
      subdomains, vhost mode for virtual hosts, s3 and gcs modes for bucket names, tftp
      mode for TFTP paths, and fuzzing mode for custom placeholders. Typical usage
      combines a target URL or domain with a wordlist and optional extensions, headers,
      cookies, or concurrency settings.
related-packages:
  - id: brew:ffuf
    reason: >
      Choose ffuf when you need flexible FUZZ injection in URLs, headers, request
      bodies, or multiple inputs together with extensive response matching and
      filtering.
    rel: alternative
    sources:
      - https://github.com/OJ/gobuster#readme
      - https://github.com/ffuf/ffuf/wiki
  - id: brew:feroxbuster
    reason: >
      Choose feroxbuster when recursive content discovery and automatic link extraction
      are more important than Gobuster's DNS, virtual-host, bucket, and TFTP modes.
    rel: alternative
    sources:
      - https://github.com/OJ/gobuster#readme
      - https://epi052.github.io/feroxbuster/
