id: cask:sakura
display-name: SakuraFrp Launcher
repo: https://github.com/natfrp/launcher-macos
docs:
  - https://doc.natfrp.com/launcher/manual
  - https://doc.natfrp.com/launcher/usage.html
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/.config/natfrp-service/config.json
    - ~/.config/natfrp-service/config.json
    - /etc/natfrp/config.json
  macos:
    - >
      ~/Library/Containers/com.natfrp.launcher/Data/Library/Application
      Support/natfrp-service/config.json
  windows:
    - '%PROGRAMDATA%\SakuraFrpService\config.json'
credentials-file-location:
  linux:
    - $XDG_CONFIG_HOME/.config/natfrp-service/config.json
    - ~/.config/natfrp-service/config.json
    - /etc/natfrp/config.json
  macos:
    - >
      ~/Library/Containers/com.natfrp.launcher/Data/Library/Application
      Support/natfrp-service/config.json
  windows:
    - '%PROGRAMDATA%\SakuraFrpService\config.json'
history:
  adoption-history:
    - >
      The launcher is distributed for macOS, Windows, Android, Linux and FreeBSD, with
      additional deployment paths for Docker, OpenWrt, Synology DSM, and other
      appliance-style environments. This breadth reflects SakuraFrp's use for exposing
      services on machines without directly reachable public addresses.
  package-nerd-significance:
    - >
      SakuraFrp Launcher wraps frpc-style tunneling in a service and
      graphical-management layer. Its platform-specific working directories, headless
      core service, remote-management interface, and appliance packages make it relevant
      to users who treat tunneling as persistent infrastructure rather than an
      occasional command.
  project-history:
    - >
      SakuraFrp developed launchers around its managed FRP tunneling service. The 2.x
      Windows launcher source was published under the AGPL, but the official archived
      repository states that version 2.0 was its final open-source line and that the 3.0
      core service would no longer be open source. The 3.x design separates the platform
      user interface from a common natfrp-service core and supports local or remote web
      management.
  related-projects:
    - frp/frpc provides the underlying reverse-proxy and tunneling model.
    - >
      The natfrp organization maintains separate macOS, Windows, DSM, OpenWrt,
      documentation, and API repositories.
  sources:
    - https://doc.natfrp.com/launcher/manual
    - https://doc.natfrp.com/launcher/usage.html
    - https://github.com/natfrp/launcher-macos
    - https://github.com/natfrp/launcher-windows
  summary:
    - >
      SakuraFrp Launcher is the desktop and service client for managing SakuraFrp
      tunnels that expose services behind NAT or otherwise lacking direct public
      reachability.
  timeline:
    - The 2.x launcher line provided an open-source Windows interface and service.
    - >
      The 3.x launcher introduced a shared core service with platform-specific
      interfaces and remote or web-based management.
    - >
      2025: The official Windows 2.x source repository was archived after the project
      moved beyond that open-source line.
  usage:
    - >
      Users authenticate with a SakuraFrp access token, select or create tunnels in the
      management panel, and run them through the launcher. Advanced deployments can edit
      config.json, run the core as a daemon, configure automatic tunnel startup, or
      administer it through the remote-management or local web interface.
