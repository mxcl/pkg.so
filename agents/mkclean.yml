config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      mkclean's package-manager footprint is narrow but useful: Homebrew and Nix package
      it for users who want an installed command-line optimizer for Matroska and WebM
      files without building the Matroska release tarball manually.
  package-nerd-significance:
    - >
      mkclean is notable as one of the small Matroska ecosystem commands that package
      managers preserve even when most users know the larger MKVToolNix suite. It
      represents the Unix packaging pattern of shipping a focused maintenance utility
      around a media container format.
  project-history:
    - >
      mkclean belongs to the Matroska tooling family around Matroska and WebM container
      maintenance. The official Matroska page lists v0.9.0 from January 31, 2021 as the
      latest release and links release source packages through SourceForge.
    - >
      The project depends on libebml2 and libmatroska2, themselves part of the Matroska
      container implementation stack.
  related-projects:
    - >
      mkclean is related to Matroska, WebM, libebml2, libmatroska2, mkvalidator, and
      MKVToolNix.
  sources:
    - https://sourceforge.net/projects/matroska/files/mkclean/ChangeLog.txt/view
    - https://www.matroska.org/downloads/mkclean.html
    - https://www.matroska.org/source_code_repositories.html
  summary:
    - >
      mkclean is an official Matroska command-line utility for cleaning and optimizing
      already-muxed Matroska and WebM files. The official page describes it as a tool
      that reorders elements with Cues at the front for efficient streaming, removes
      elements outside the Matroska specs, and can optionally remux Cluster blocks
      around keyframes.
  timeline:
    - >
      2010: Changelog series shows active 0.3 through 0.8 development around
      Matroska/WebM cleanup and optimization behavior.
    - '2012-08: Changelog lists v0.8.10 with updated Matroska element support.'
    - '2021-01: Official page lists v0.9.0 as the latest release.'
  usage:
    - >
      mkclean is a post-processing tool. Users run it on existing .mkv, .mka, .mks,
      .mk3d, .webm, or .weba files to improve streaming layout, remove invalid elements,
      and optionally remux clusters around keyframes.
    - >
      It complements muxers and validators: it does not encode media, but adjusts
      container structure and metadata layout.
