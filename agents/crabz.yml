history:
  adoption-history:
    - >
      crabz is distributed through several package channels documented by the project
      itself, including Homebrew or Linuxbrew, Debian packages from GitHub releases,
      Cargo, and conda-forge.
  package-nerd-significance:
    - >
      crabz is notable in packaging circles as a Rust-era counterpart to classic Unix
      compression tools: one binary, package-manager friendly, and tuned for
      multi-threaded compression without requiring a custom zlib-ng pigz build.
  project-history:
    - >
      The project began as a proof-of-concept command-line wrapper around the author's
      `gzp` Rust crate. The README describes it as cross-platform and fast, with support
      for gzip, zlib, mgzip, BGZF, raw deflate, and snap formats.
  related-projects:
    - crabz is directly compared with pigz and is built on the `gzp` library.
  sources:
    - https://github.com/sstadick/crabz#readme
    - https://github.com/sstadick/crabz/releases
    - https://crates.io/crates/crabz
    - https://formulae.brew.sh/formula/crabz
  summary:
    - >
      crabz is a Rust compression and decompression CLI explicitly positioned as similar
      to pigz.
  timeline:
    - 'v0.1.0: Initial public release series on GitHub.'
    - >
      v0.10.0: Release series moved to updated Rust compression dependencies and
      packaging artifacts.
  usage:
    - >
      Users call `crabz` to compress or decompress files, select formats, control
      compression level, set thread counts, and optionally write in place or to standard
      output.
related-packages:
  - id: brew:pigz
    reason: >
      Choose pigz for the established zlib-based parallel gzip implementation; crabz's
      official benchmarks position crabz as a Rust, cross-platform alternative with
      additional formats.
    rel: alternative
    sources:
      - https://github.com/sstadick/crabz#readme
      - https://zlib.net/pigz/
  - id: brew:gzip
    reason: >
      Choose GNU Gzip when maximum availability and the conventional single-threaded
      gzip interface matter more than crabz's parallelism and extra formats.
    rel: alternative
    sources:
      - https://github.com/sstadick/crabz#readme
      - https://www.gnu.org/software/gzip/manual/gzip.html
  - id: brew:zstd
    reason: >
      Choose Zstandard when both endpoints can use the `.zst` format and modern
      compression-ratio and speed tradeoffs matter more than gzip compatibility.
    rel: alternative
    sources:
      - https://github.com/sstadick/crabz#readme
      - https://facebook.github.io/zstd/
