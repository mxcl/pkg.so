history:
  adoption-history:
    - >
      Musictube was distributed commercially for macOS, Windows, and Ubuntu from its
      introduction, giving it an unusual cross-platform presence among independent
      desktop YouTube clients. The current official page continues to offer builds for
      all three desktop platforms.
  package-nerd-significance:
    - >
      Musictube is notable to package-manager users as a proprietary, cross-platform
      desktop application from the developer of Minitube. It packages YouTube discovery
      and playback into a conventional music-player interface rather than exposing a
      general video browser.
  project-history:
    - >
      Developer Flavio Tordini introduced Musictube in October 2011 after combining
      ideas from his existing YouTube-player and music-player work. The initial release
      integrated YouTube music playback with album ordering, artwork, artist images,
      lyrics, and dedicated studio, live, and cover modes.
    - >
      The developer explicitly chose a commercial proprietary model, including for the
      Ubuntu build, while noting that Musictube shared code and improvements with
      related GPL projects such as Minitube and Minitunes.
  related-projects:
    - >
      Minitube, Minitunes/Musique, and Sofa are related applications by Flavio Tordini;
      the official site specifically presents Sofa as a remote control option for
      Musictube.
  sources:
    - 'Official introduction: https://flavio.tordini.org/introducing-the-musictube-app'
    - 'Official product page: https://flavio.tordini.org/musictube'
  summary:
    - >
      Musictube is a proprietary desktop music player by Flavio Tordini that streams
      music from YouTube while presenting albums, playlists, artwork, lyrics, and video
      in a traditional player-oriented interface.
  timeline:
    - '2011-10-04: Musictube was publicly introduced for Mac, Windows, and Ubuntu.'
  usage:
    - >
      Users search for artists or recordings, assemble editable playlists, play albums
      or discographies in track order, and switch among studio, live, and cover
      performances. Video can remain a thumbnail or expand to a full window.
