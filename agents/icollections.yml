history:
  adoption-history:
    - >
      iCollections occupies the established Mac utility niche of augmenting the desktop
      and Finder rather than replacing the file manager. Its manual documents workflows
      for multiple displays, configurable Collections, backups, storage switching, and
      differences affecting the Mac App Store edition.
  package-nerd-significance:
    - >
      For Mac package users, iCollections is representative of persistent
      Finder-adjacent utilities distributed outside the operating system. Its movable
      storage, single-file backup format, and direct-versus-App-Store feature
      differences are useful examples of how desktop utility state is packaged and
      migrated.
  project-history:
    - >
      Naarak Studio developed iCollections as a macOS desktop-organization application.
      Its official change documentation traces multiple major versions, including the
      3.0 transition to OS X 10.10 and Retina support and subsequent additions to
      collection management and appearance.
  related-projects:
    - macOS Finder remains the underlying file-management environment exposed by iCollections.
    - >
      The Mac App Store edition is a related distribution variant with some feature
      differences documented in the manual.
  sources:
    - https://naarakstudio.com/icollections/whats-new.pdf
    - https://www.naarakstudio.com/icollections/manual/
    - https://www.naarakstudio.com/icollections/manual/backup.html
    - https://www.naarakstudio.com/icollections/manual/collection.html
    - https://www.naarakstudio.com/icollections/manual/mainmenu.html
  summary:
    - >
      iCollections is a proprietary macOS utility from Naarak Studio that organizes
      files, folders, and other items into configurable desktop Collections.
  timeline:
    - >
      Version 3.0: Support moves to OS X 10.10 and later, with Retina display support
      and tabs.
    - >
      Later releases: Collection lists, storage switching, interface refinements, and
      performance improvements are added.
  usage:
    - >
      Users create Collections, place files and folders into them, and interact with
      those items much as they do in Finder. Collections can be arranged, hidden,
      locked, resized, styled, and moved between storage locations.
    - >
      The File Storage menu can reveal, move, switch, back up, or restore the active
      storage. Backups use the .icbackup extension and include Collections and settings,
      but the official manual does not document a fixed default configuration-file path.
    - No credentials file is documented.
