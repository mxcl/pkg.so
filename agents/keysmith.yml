credentials-file-location: null
history:
  adoption-history:
    - >
      Keysmith is distributed as a commercial macOS application and through Homebrew
      Cask. Its official examples emphasize automation across common web and desktop
      applications, while browser extensions integrate web-page actions with the Mac
      application.
  package-nerd-significance:
    - >
      Keysmith belongs to the long-running macOS automation tradition but emphasizes
      recording and editing user-interface actions instead of scripting. Its portable
      `.keysmithdb` database can be placed in a synchronized folder, including one
      managed by Git, which makes personal automation state unusually visible to power
      users.
  project-history:
    - >
      Otto Labs developed Keysmith as an approachable visual macro recorder for macOS
      and web workflows. By 2022 it supported Apple Shortcuts actions and URL-based
      macro invocation; later releases added menu-bar execution and compatibility
      updates for newer macOS versions.
  related-projects:
    - >
      Keyboard Maestro, Apple Shortcuts, Automator, AppleScript, and launcher utilities
      provide overlapping approaches to macOS workflow automation.
  sources:
    - https://www.keysmith.app/
    - https://www.keysmith.app/examples
    - https://www.keysmith.app/guides/quick-launcher
    - https://www.keysmith.app/release-notes
    - source_facts.package-manager
  summary:
    - >
      Keysmith is a macOS visual automation application from Otto Labs. It records mouse
      and keyboard activity as editable macros that can be invoked through hotkeys, a
      searchable launcher, URLs, or the menu bar.
  timeline:
    - >
      2021: Release notes document continued macro-editor improvements and macOS
      Monterey support.
    - >
      2022: Version 1.18 added Apple Shortcuts actions; version 1.18.1 added URL-based
      macro invocation.
    - >
      2023: Version 1.18.4 added menu-bar macro execution; version 1.18.6 added macOS
      Sonoma support.
    - '2024: Version 1.18.7 fixed an application-launching failure.'
  usage:
    - >
      Users record a workflow, edit the resulting actions, assign an
      application-specific or global hotkey, and replay or repeat the macro. The Quick
      Launcher runs macros by name, while synchronization works by moving the
      `.keysmithdb` macro database to a shared folder.
