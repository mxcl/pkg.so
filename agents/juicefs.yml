history:
  adoption-history:
    - >
      The project moved from an early open-source release line in 2021 to a 1.0.0
      release published on August 9, 2022. Packaging in Homebrew, Nix, and Scoop made
      the single `juicefs` CLI easy to install across developer laptops and automation
      environments.
  package-nerd-significance:
    - >
      JuiceFS is significant because it packages a distributed storage client as a
      normal CLI while depending on external services for durability and metadata. It
      sits at the intersection of FUSE filesystems, cloud object stores, Kubernetes CSI
      drivers, and database-backed metadata.
  project-history:
    - >
      JuiceFS project materials describe the system as started in 2017 and designed for
      unstructured data management across multi-cloud, cross-cloud, and hybrid-cloud
      environments. Its open-source Community Edition is released under Apache-2.0, and
      official architecture documentation explains the object-storage plus
      metadata-engine design.
  related-projects:
    - Kubernetes CSI drivers are a major deployment surface for JuiceFS.
    - Redis, TiKV, MySQL, PostgreSQL, and SQLite are documented metadata-engine options.
    - Amazon S3 and S3-compatible object stores are common backing stores.
  sources:
    - https://formulae.brew.sh/formula/juicefs
    - https://github.com/juicedata/juicefs
    - https://juicefs.com/docs/community/architecture/
    - https://juicefs.com/docs/community/release_notes/
    - https://juicefs.com/en/blog/release-notes/juicefs-v1
  summary:
    - >
      JuiceFS is a cloud-native distributed POSIX file system that separates file data
      from metadata: file data lives in object storage and metadata lives in a database
      or key-value engine. That split made it attractive for Kubernetes,
      machine-learning, big-data, and cloud migration workloads that need a familiar
      filesystem interface over elastic storage.
  timeline:
    - '2017: JuiceFS project materials describe the project as having started in this year.'
    - '2021: Public GitHub releases show the 0.x open-source release line.'
    - '2022: JuiceFS 1.0.0 was published on August 9.'
    - '2023: v1.1 documentation introduced directory statistics and directory quota behavior.'
  usage:
    - >
      Users format a JuiceFS volume against a metadata engine, mount it through the CLI,
      and back file data with S3-compatible or other object storage. In package-manager
      terms, it is a heavyweight CLI because the same binary is both an administration
      tool and the client that mounts the filesystem.
related-packages:
  - id: brew:s3fs
    reason: >
      Choose s3fs for a simpler direct FUSE view of an S3 bucket; choose JuiceFS when
      you need a separate metadata engine, stronger POSIX semantics, shared consistency,
      and optimized large-file updates.
    rel: alternative
    sources:
      - https://juicefs.com/docs/community/comparison/juicefs_vs_s3fs/
      - https://github.com/s3fs-fuse/s3fs-fuse
