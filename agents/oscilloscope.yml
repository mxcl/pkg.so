history:
  adoption-history:
    - >
      Official releases support macOS and Windows; an older Linux prerelease is also
      published. Homebrew Cask supplies a package-managed installation path on macOS.
  package-nerd-significance:
    - >
      Oscilloscope is a compact creative-coding application whose packaging combines
      native desktop builds, openFrameworks, audio decoding, and GPU-style waveform
      rendering. It is particularly associated with oscilloscope music rather than
      general electronic test-and-measurement work.
  project-history:
    - >
      Hansi Raber created Oscilloscope as an open-source software oscilloscope that
      recreates the appearance of analogue ray oscilloscopes. It is built with
      openFrameworks and uses FFmpeg-related components to decode audio.
    - >
      Successive releases added audio-file support, image-sequence export, live stereo
      input, time stretching, multichannel visualization, playlists, and H.264 export.
  related-projects:
    - OsciStudio is another oscilloscope-music tool presented on the project's official site.
    - >
      openFrameworks supplies the creative-coding foundation; FFmpeg-related libraries
      provide audio decoding.
  sources:
    - https://github.com/kritzikratzi/Oscilloscope
    - https://github.com/kritzikratzi/Oscilloscope/releases
    - https://oscilloscopemusic.com/software/oscilloscope/
  summary:
    - >
      Oscilloscope is an open-source desktop application for viewing music and audio
      with the visual aesthetic of an analogue ray oscilloscope.
  timeline:
    - '2016: A Linux 1.0.3 prerelease and early cross-platform builds were published.'
    - '2017: Version 1.0.8 added four-channel 3D visualization.'
    - >
      2022: Version 1.1.0 added H.264 export, playlists, Windows loopback support, and a
      Windows installer.
  usage:
    - >
      Users drag an audio file into the application or select an input device, then view
      the signal as an oscilloscope-style trace. Keyboard controls cover playback,
      fullscreen display, interface visibility, and image or video export.
