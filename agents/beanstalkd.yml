history:
  adoption-history:
    - >
      beanstalkd became a classic lightweight queue option because it was easy to
      package, run, and bind from application languages. The homepage links to client
      libraries and production-administration files, while the supplied metadata shows
      packages across Homebrew, Debian, Ubuntu, Fedora, Alpine, MacPorts, Nix, and
      related Unix distributions.
    - >
      Unlike heavier broker stacks, beanstalkd's no-config default and simple TCP
      protocol made it attractive for applications that needed a durable-ish work queue
      without adopting a full messaging platform.
  package-nerd-significance:
    - >
      beanstalkd is package-nerd catnip because it is tiny infrastructure: install one
      daemon, open one TCP port, speak a readable protocol, and you have a usable
      background-job queue.
    - >
      It represents a pre-cloud style of infrastructure package that still ages well: no
      service mesh, no cluster controller, no mandatory config file, just a small C
      daemon and a documented protocol.
  project-history:
    - >
      The official homepage says Philotic, Inc. developed Beanstalk to improve response
      time for the Causes on Facebook application, which had more than 9.5 million
      users. The original goal was reducing high-volume web-page latency by moving
      expensive work into asynchronous jobs.
    - >
      The project took inspiration from memcached for simple protocol design and
      documentation structure. Its core model stayed deliberately small: clients put
      jobs into tubes, workers reserve jobs, and jobs move through ready, delayed,
      reserved, and buried states.
  related-projects:
    - >
      memcached is explicitly credited by the homepage as inspiration for protocol
      simplicity and documentation style.
    - >
      The beanstalkd wiki tracks client libraries for application languages that speak
      the protocol.
  sources:
    - https://beanstalkd.github.io/
    - https://github.com/beanstalkd/beanstalkd#readme
    - https://github.com/beanstalkd/beanstalkd/blob/master/doc/protocol.txt
    - input.json source_facts.package-manager
  summary:
    - >
      beanstalkd is a simple, fast general-purpose work-queue daemon with an ASCII TCP
      protocol and a small command-line operational surface.
  timeline:
    - '2008: The official GitHub repository was created for beanstalkd.'
    - >
      Early project history: Philotic developed Beanstalk for Causes on Facebook to
      reduce latency by moving slow work out of page views.
    - '2023: The homepage links to beanstalkd 1.13 release notes.'
    - >
      2025: The official repository remained active with recent pushes visible in GitHub
      metadata.
  usage:
    - >
      The homepage states that beanstalkd has no configuration file and only a handful
      of command-line options. A common deployment starts one or more daemons listening
      on TCP port 11300.
    - >
      The protocol document defines producer and worker operations such as put, reserve,
      delete, release, bury, kick, use, watch, and ignore. Jobs live in tubes, and the
      server treats job bodies as opaque bytes.
