config-file-location:
  unix:
    - ${XDG_CONFIG_HOME:-$HOME/.config}/tuxedo/themes/*.toml
credentials-file-location:
  unix:
    - ${XDG_CONFIG_HOME:-$HOME/.config}/tuxedo/config.toml
history:
  adoption-history:
    - >
      The README already documents Homebrew installation, prebuilt binaries for Linux,
      macOS, and Windows, and source installation through Cargo. The supplied package
      metadata records Homebrew and Nix presence, which is notable for a young terminal
      productivity tool.
  package-nerd-significance:
    - >
      tuxedo is significant as a modern todo.txt package that keeps the old
      Unix-friendly text-file contract while adding a polished TUI and static-binary
      distribution story.
  project-history:
    - >
      The official repository was created in May 2026, making tuxedo a very new package.
      Its README positions it as a single static binary for todo.txt, combining an
      interactive TUI with a `todo.txt-cli`-compatible command surface, vim-style
      bindings, themes, atomic writes, external-edit detection, and plain-text storage.
  related-projects:
    - todo.txt
    - todo.txt-cli
    - terminal user interfaces
    - Rust
  sources:
    - 'GitHub API for webstonehq/tuxedo: repository created 2026-05-07 and 2026 release tags.'
    - >
      https://github.com/webstonehq/tuxedo README: todo.txt TUI description, Homebrew
      install, highlights, themes, file resolution, CLI compatibility, and atomic
      writes.
    - 'source_facts.package-manager: Homebrew and Nix package-manager presence.'
  summary:
    - tuxedo is a fast terminal UI and compatible command-line front end for todo.txt files.
  timeline:
    - '2026: GitHub repository created.'
    - >
      2026: README documents `brew install tuxedo`, prebuilt binaries, and Cargo source
      installation.
    - '2026: Official releases use date-based version tags such as v2026.6.x.'
  usage:
    - >
      Users run `tuxedo` to open an interactive todo.txt interface, or `tuxedo
      <command>` for one-shot commands such as add, list, complete, prioritize, and
      archive. It resolves todo files through explicit paths, `$TODO_FILE`,
      `$TODO_DIR/todo.txt`, a local `./todo.txt`, or a first-run/sample flow.
    - >
      Its package-manager niche is plain-text productivity: it is installable like a
      CLI, scriptable like todo.txt-cli, but also comfortable for keyboard-driven
      terminal users who want filtering, sorting, themes, undo, and atomic sync-friendly
      writes.
