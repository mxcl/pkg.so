history:
  adoption-history:
    - >
      TableFlip has remained a focused macOS application rather than expanding into a
      general spreadsheet suite. Later releases broadened interoperability from Markdown
      and CSV to HTML and JSON while preserving its plain-text, edit-in-place workflow.
  package-nerd-significance:
    - >
      TableFlip appeals to plain-text and Markdown users who want a visual grid without
      surrendering source-controlled text files to a proprietary spreadsheet format. Its
      live round-trip editing is particularly useful for documentation repositories and
      writing workflows in which table markup remains the canonical data.
  project-history:
    - >
      Christian Tietze began publishing TableFlip development builds in 2016. The
      earliest release notes show the core Markdown round-trip editor already working by
      version 0.1.0, followed by rapid additions such as structural editing,
      auto-growing tables, captions, file-change notifications, and online help.
    - >
      Subsequent releases added CSV round trips, sandbox-aware file handling, HTML
      export, JSON import and export, URL-scheme automation, and modernized macOS
      presentation.
  related-projects:
    - 'Markdown and MultiMarkdown: primary plain-text table formats handled by TableFlip.'
    - >
      Marked 2: a Markdown preview application integrated into the documented TableFlip
      workflow.
    - >
      Spreadsheet applications such as Excel and Numbers: sources and destinations for
      pasted tabular text.
  sources:
    - 'Official help center: https://tableflipapp.com/help/'
    - 'Official homepage: https://tableflipapp.com/'
    - 'Official release notes: https://tableflipapp.com/release-notes/'
  summary:
    - >
      TableFlip is a native macOS visual table editor centered on editing Markdown
      tables in place. It also supports CSV and JSON round trips and exports to formats
      including HTML and LaTeX.
  timeline:
    - '2016: Version 0.1.0 established the Markdown table-editing fundamentals.'
    - >
      2016: Online help, file-change notifications, captions, and broader structural
      editing arrived during the public 0.x series.
    - '2019: TableFlip adopted App Sandbox behavior and expanded CSV handling.'
    - '2023: Version 1.5 added HTML export and URL-scheme preference automation.'
    - '2024: Version 1.6 added JSON support and version 1.7 modernized the macOS interface.'
  usage:
    - >
      Users open Markdown, CSV, or JSON documents as editable grids, change cells
      without manually maintaining table syntax, and save changes back to the original
      plain-text file. Auto-growing rows and columns, clipboard import, live response to
      external file changes, and HTML or LaTeX export support documentation-oriented
      workflows.
