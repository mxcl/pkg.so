history:
  adoption-history:
    - >
      uniutils appears in the official page's package links for Debian, FreeBSD, SUSE,
      Ubuntu, and other older package indexes, and the input confirms availability
      through Homebrew, Debian, Ubuntu, and openSUSE. Its adoption is therefore mostly
      the long tail of Unix text-processing packages rather than a large upstream
      community.
  package-nerd-significance:
    - >
      uniutils is package-nerd significant as a classic small Unix toolbox: narrow
      executables, no daemon, no config, no credentials, and enough Unicode knowledge to
      solve problems that general-purpose text tools hide.
    - >
      Its niche status is also the point. A package manager keeps these old, sharp tools
      discoverable so users do not have to reinvent one-off scripts for codepoint
      inspection or malformed UTF-8 testing.
  project-history:
    - >
      The official page presents uniutils as a set of programs for Unicode text
      analysis. Its documented tools include uniname, unidesc, unihist, ExplicateUTF8,
      utf8lookup, unireverse, unifuzz, and unisurrogate.
    - >
      The last documented release on the official page is 2.28, last modified
      2009-04-25. The change log shows late releases adding Unicode range reporting,
      UTF-8 string reversal, fuzz input generation, Unicode 5.1 data updates, and UTF-16
      surrogate decomposition.
  related-projects:
    - >
      The toolkit overlaps with Unix text filters, Unicode database tools,
      iconv-adjacent workflows, and fuzzing utilities. The official utf8lookup script
      depends on the separate Ascii2binary utility.
  sources:
    - https://billposer.org/Software/unidesc.html
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      uniutils is a small POSIX C toolkit for inspecting, manipulating, and generating
      Unicode text from the command line. Its history is modest but source-backed: the
      author's page documents the tool set, release changes, language, environment,
      version, and package links.
  timeline:
    - '2000s: uniutils evolved as a POSIX C toolkit for Unicode text analysis.'
    - '2.24: Added Unirev, later renamed unireverse.'
    - '2.26: Added unifuzz and changed licensing to GPLv3 for that release line.'
    - '2.27: Updated character data to Unicode 5.1.'
    - >
      2009: Version 2.28 added unisurrogate and is listed as the current version on the
      official page.
  usage:
    - >
      The tools are for terminal-level Unicode forensics: naming code points, validating
      UTF-8, identifying script ranges, building character histograms, reversing strings
      by character instead of byte, looking up UTF-8 encodings, generating problematic
      Unicode input, and decomposing non-BMP characters into UTF-16 surrogates.
    - >
      Package users are likely to reach for uniutils when debugging mojibake, invisible
      characters, invalid UTF-8, unfamiliar scripts, font gaps, or parser behavior
      around odd Unicode input.
