history:
  adoption-history:
    - >
      Mesh expanded from a personal relationship manager into a product for individuals
      and teams. The official homepage reports availability on macOS, Windows, web,
      Android, and iOS and says that more than 100 million relationships have been
      entrusted to the service.
  package-nerd-significance:
    - >
      Mesh represents the modern personal-CRM category: a desktop-installed client
      backed by cloud synchronization and numerous external integrations.
      Package-manager users should note that its usefulness depends on an account and
      connected services rather than on local files alone.
  project-history:
    - >
      Mesh was created after its team found conventional contacts applications, social
      networks, and spreadsheets inadequate for maintaining meaningful relationships.
      The product was conceived as a digital successor to the personal Rolodex, first
      emphasizing individuals and later adding shared relationship management for teams.
  related-projects:
    - Apple Contacts
    - Google Contacts
    - LinkedIn
    - personal CRM software
    - team CRM software
  sources:
