credentials-file-location: null
history:
  adoption-history:
    - >
      Spectra broadened from a desktop viewer into a toolkit comprising a GUI, CLI, and
      installable skills for numerous coding agents. Official material names support for
      Codex, Claude Code, Cursor, GitHub Copilot, Gemini, and other agent environments.
    - >
      Homebrew distribution supplies the macOS desktop application, while an npm package
      provides a separate cross-platform CLI channel.
  package-nerd-significance:
    - >
      Spectra packages specification artifacts as repository files rather than keeping
      planning solely in chat history or a hosted issue tracker. For package and tooling
      enthusiasts, it is an example of the emerging ecosystem around agent-readable
      skills, Markdown specifications, structured change directories, and spec-driven
      coding workflows.
  project-history:
    - >
      Spectra began as a graphical frontend for the OpenSpec format. Its author found
      that OpenSpec's original workflow did not fully match his development habits and
      rewrote the workflow while retaining the core idea of file-based specifications.
    - >
      The resulting project developed its own discuss, propose, apply, ingest, verify,
      review, and archive lifecycle, along with task tracking, consistency analysis,
      search, worktree support, and skills for coding agents.
  related-projects:
    - >
      OpenSpec supplied the original format and workflow inspiration. Spectra also
      integrates with coding agents including Codex and Claude Code and can operate
      alongside Git worktrees.
  sources:
    - https://github.com/kaochenlong/spectra-app
    - https://github.com/kaochenlong/spectra-app/releases
    - https://spectra.5xcamp.us/
  summary:
    - >
      Spectra is a free Spec-Driven Development toolkit consisting of a desktop
      application, a CLI, and workflow skills for coding agents. It stores proposals,
      specifications, designs, tasks, and archives with the project being developed.
  timeline:
    - 'Origin: Spectra started as a GUI frontend for OpenSpec.'
    - >
      Later: The author rewrote and simplified the workflow around his own daily
      development process.
    - '2026: The project documented a broader toolkit of desktop, CLI, and multi-agent skills.'
  usage:
    - >
      A developer opens a project directory, configures its specification directory when
      needed, and uses agent skills to discuss work, create proposals, implement tasks,
      verify results, and archive completed changes. The desktop app browses
      specifications, tracks checklist progress, searches artifacts, and manages the
      change lifecycle.
