history:
  adoption-history:
    - >
      Official support centers on Keyboardio's Model 01, Model 100, and Atreus
      keyboards. Custom Kaleidoscope firmware can also work when it includes the Focus,
      EEPROM settings, keymap, and related plugins required by the desired editor
      features.
  package-nerd-significance:
    - >
      Chrysalis is notable as a user-facing configuration layer over the Kaleidoscope
      firmware ecosystem. It lets users change keymaps and lighting or flash firmware
      without treating keyboard customization solely as a compile-and-upload task.
  project-history:
    - >
      Keyboardio developed Chrysalis as a GPL-licensed graphical configurator for
      keyboards running Kaleidoscope firmware. Its capabilities grew around live keymap
      editing, per-key LED color maps, and bundled or custom firmware updates.
    - >
      The project is also offered as a WebSerial/WebUSB application, tying its
      hardware-management role to Chromium-family browser capabilities while retaining
      its public source repository.
  related-projects:
    - Kaleidoscope
    - Keyboardio Model 01
    - Keyboardio Model 100
    - Keyboardio Atreus
    - FocusSerial
    - EEPROM-Keymap
  sources:
    - 'Official releases: https://github.com/keyboardio/Chrysalis/releases'
    - 'Official repository and README: https://github.com/keyboardio/Chrysalis'
    - 'Official web application: https://chrysalis.keyboard.io/'
  summary:
    - >
      Chrysalis is Keyboardio's graphical configuration tool for Kaleidoscope-powered
      keyboards, providing keymap, lighting, and firmware-management interfaces.
  timeline:
    - >
      Public repository era: Chrysalis was developed openly under GPL-3.0 in
      Keyboardio's GitHub organization.
    - >
      v0.13.0: Added configuration support for additional Kaleidoscope behaviors,
      including AutoShift, TopsyTurvy, and OneShot Meta keys.
  usage:
    - >
      Users connect a supported keyboard, edit its layered keymap or LED color map, and
      write settings to the keyboard. Firmware-aware users can also flash bundled
      firmware or supply compatible custom Kaleidoscope builds.
