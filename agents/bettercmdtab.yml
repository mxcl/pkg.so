id: cask:bettercmdtab
display-name: BetterCmdTab
repo: null
docs:
  - https://bettercmdtab.app/docs
  - https://bettercmdtab.app/docs/config-reference
  - https://bettercmdtab.app/docs/configuration
config-file-location:
  macos:
    - ~/.config/bettercmdtab/config.json
    - $XDG_CONFIG_HOME/bettercmdtab/config.json when XDG_CONFIG_HOME is an absolute path
credentials-file-location: null
history:
  adoption-history:
    - >
      BetterCmdTab is distributed as a signed macOS disk image, through Homebrew Cask,
      and as GPL-licensed source code. Its public repository accepts issues and pull
      requests, giving Mac power users a transparent alternative to proprietary
      switchers.
    - >
      The project has expanded beyond application switching into window previews,
      browser-tab access, multi-display and Spaces awareness, tiling, scoped shortcuts,
      search, and settings synchronization.
  package-nerd-significance:
    - >
      BetterCmdTab replaces a core macOS keyboard interaction while remaining open
      source and cask-installable. That combination makes it attractive to users who
      want a reproducible, inspectable desktop workflow.
    - >
      Its optional JSON configuration is explicitly designed for dotfile repositories:
      changes synchronize in both directions with the settings interface, and a
      generated JSON Schema enables editor completion and validation.
  project-history:
    - >
      BetterCmdTab was created by rokartur as an open-source replacement for the
      built-in macOS Command-Tab switcher. The project credits AltTab, Witch, and
      Contexts as inspirations.
    - >
      Ongoing releases broadened the switcher into a window-management tool with
      alternative layouts, previews, filtering, multi-monitor behavior, browser-tab
      handling, keyboard actions, themes, and backup facilities.
  related-projects:
    - The project explicitly cites AltTab, Witch, and Contexts as inspirations.
    - It replaces and extends the built-in macOS Command-Tab application switcher.
  sources:
    - 'Official config reference: https://bettercmdtab.app/docs/config-reference/'
    - 'Official configuration guide: https://bettercmdtab.app/docs/configuration/'
    - 'Official quick start: https://bettercmdtab.app/docs/'
    - 'Official releases: https://github.com/rokartur/BetterCmdTab/releases'
    - 'Official repository README: https://github.com/rokartur/BetterCmdTab'
  summary:
    - >
      BetterCmdTab is an open-source macOS application and window switcher that replaces
      the system Command-Tab interface with searchable, configurable layouts and
      window-management features.
  timeline:
    - '2025: The public project is active as a Swift-based macOS switcher.'
    - >
      2026: Releases add richer multi-display, Spaces, browser-tab, appearance, and
      reliability features.
    - '2026: An optional live JSON configuration file and generated schema are introduced.'
  usage:
    - >
      After installation, users grant Accessibility permission so BetterCmdTab can
      intercept Command-Tab and inspect window lists. The switcher can present
      applications, windows, or previews and can perform actions such as focus, close,
      minimize, hide, quit, tile, and move windows.
    - >
      Users may opt into `~/.config/bettercmdtab/config.json`; an absolute
      `XDG_CONFIG_HOME` changes the base directory. The file synchronizes with the
      graphical settings in both directions and is suitable for version-controlled
      dotfiles. The app requires no account and documents no credentials file.
