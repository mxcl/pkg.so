history:
  adoption-history:
    - >
      Clzip is a niche member of the lzip ecosystem, but it is packaged across Unix-like
      systems because a C-only implementation is useful in bootstrap environments, small
      systems, and distributions that want lzip-format compatibility without requiring a
      C++ compiler for this tool.
  package-nerd-significance:
    - >
      Package nerds care about clzip because it is a small, source-portable route into
      an archive format designed for long-term preservation. It also inherits lzip's
      emphasis on well-defined exit statuses, decoder availability, and recovery
      tooling, which matter when compressors are used behind tar, zutils, package
      archives, or backup scripts.
  project-history:
    - >
      The official clzip page describes it as a C language version of lzip intended for
      systems lacking a C++ compiler. That places it inside Antonio Diaz Diaz's lzip
      family as the low-compiler-requirement implementation rather than the primary
      reference compressor.
    - >
      The Savannah release directory shows public clzip releases beginning with version
      1.5 in September 2013 and continuing through version 1.16 in March 2026. The clzip
      page ties the implementation to lzip's larger goals: interoperable .lz files,
      simple decoders, integrity checking, and archive recovery through related tools.
  related-projects:
    - Clzip sits beside lzip, plzip, tarlz, lziprecover, and zutils in the lzip ecosystem.
    - >
      plzip is the parallel compressor named by the clzip page for multiprocessor
      compression, while tarlz is the related tool for tar archive workflows.
  sources:
    - https://download.savannah.nongnu.org/releases/lzip/clzip/
    - https://www.nongnu.org/lzip/clzip.html
    - https://www.nongnu.org/lzip/manual/clzip_manual.html
  summary:
    - >
      Clzip is the C implementation of lzip, a lossless data compressor using the .lz
      format and a gzip- or bzip2-like command-line interface.
  timeline:
    - '2013: clzip 1.5 appears in the official Savannah release directory.'
    - '2018: clzip 1.10 is released.'
    - '2024: clzip 1.14 is released.'
    - '2025: clzip 1.15 is released.'
    - '2026: clzip 1.16 is released on 2026-03-15.'
  usage:
    - >
      Clzip is used as a compressor and decompressor for .lz files. The official page
      shows the common archive pipeline, extracting a tar.lz archive with clzip -cd
      piped into tar, while the manual documents invocation, file-format behavior,
      trailing-data handling, and the reference decompressor used to explain the format.
related-packages:
  - id: brew:lzip
    reason: >
      Choose lzip for the reference C++ implementation of the same interoperable `.lz`
      compression format; choose Clzip when a C-only implementation is preferable.
    rel: alternative
    sources:
      - https://www.nongnu.org/lzip/
      - https://www.nongnu.org/lzip/manual/clzip_manual.html
  - id: brew:plzip
    reason: >
      Choose Plzip when large `.lz` files should be compressed or decompressed across
      multiple processor cores rather than by Clzip's single-process implementation.
    rel: alternative
    sources:
      - https://www.nongnu.org/lzip/plzip.html
      - https://www.nongnu.org/lzip/manual/clzip_manual.html
  - id: brew:tarlz
    reason: >
      Tarlz complements Clzip when creating tar archives because it preserves alignment
      between tar and lzip members and supports parallel archive operations.
    rel: adjacent_workflow
    sources:
      - https://www.nongnu.org/lzip/tarlz.html
      - https://www.nongnu.org/lzip/manual/clzip_manual.html
  - id: brew:lziprecover
    reason: >
      Lziprecover complements Clzip by diagnosing, merging, and recovering data from
      damaged `.lz` files created by compatible lzip-family compressors.
    rel: adjacent_workflow
    sources:
      - https://www.nongnu.org/lzip/lziprecover.html
      - https://www.nongnu.org/lzip/manual/clzip_manual.html
