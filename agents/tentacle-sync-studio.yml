history:
  adoption-history:
    - >
      Tentacle Sync says its products grew from a crowdfunded prototype into a
      filmmaking system sold through dealers and used in more than 50 countries. Sync
      Studio forms the macOS post-production side of that hardware-and-software
      workflow.
    - >
      The application can also process compatible timecode from non-Tentacle devices,
      broadening its role beyond owners of the company's generators.
  package-nerd-significance:
    - >
      Sync Studio is a specialized bridge between production sound and picture
      editorial: it turns recorded timecode into automatically aligned media before
      editing.
    - >
      Its Homebrew cask is useful for repeatable installation on post-production Macs,
      although activation remains tied to a Tentacle device or a separately purchased
      license.
  project-history:
    - >
      Filmmakers Ulrich Esser and Max Kaiser began Tentacle Sync with a handmade
      prototype and an Indiegogo campaign in 2014. The first Tentacle timecode devices
      launched in 2015.
    - >
      Tentacle Sync Studio was developed for macOS to perform the actual synchronization
      made possible by recorded timecode, complementing the company's generators and
      recorders.
  related-projects:
    - Tentacle ORIGINAL
    - Tentacle SYNC E
    - Tentacle TRACK E
    - Tentacle Setup App
    - Tentacle Timecode Tool
  sources:
    - https://support.tentaclesync.com/hc/en-us/sections/25242891040029-SYNC-STUDIO
    - https://tentaclesync.com/about/our-story
    - https://tentaclesync.com/downloads/tentacle-sync-studio-macos
  summary:
    - >
      Tentacle Sync Studio is Tentacle Sync's macOS application for automatically
      aligning separately recorded video and audio through timecode.
  timeline:
    - '2014: The founders built a prototype and ran an Indiegogo campaign.'
    - '2015: The first Tentacle timecode devices launched.'
    - >
      Later: Sync Studio became the macOS synchronization component of the Tentacle
      production workflow.
  usage:
    - >
      Users add camera and audio clips, allow Sync Studio to align them by timecode, and
      export synchronized material for editorial workflows. A connected Tentacle device
      can provide a license, while standalone licensing is also available.
