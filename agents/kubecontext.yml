history:
  adoption-history:
    - >
      KubeContext was distributed through the Mac App Store, Homebrew cask, and direct
      GitHub releases. The App Store build offered optional paid features, while the
      project's README states that non-App-Store distributions unlocked all features.
  package-nerd-significance:
    - >
      KubeContext gives macOS users a visible menu-bar representation of otherwise
      command-line-oriented Kubernetes context state. Its ability to switch contexts and
      namespaces makes it useful to operators who regularly move among development,
      staging, and production clusters.
  project-history:
    - >
      KubeContext was created as an open-source Swift menu-bar application for macOS.
      Its initial feature set centered on switching Kubernetes contexts and later
      included importing and exporting kubeconfig files, context colors, renaming,
      namespace selection, and a management interface.
  related-projects:
    - Kubernetes
    - kubectl
    - kubeconfig
    - Minikube
  sources:
    - https://github.com/turkenh/KubeContext#readme
    - https://github.com/turkenh/KubeContext/releases
  summary:
    - >
      KubeContext is a native macOS menu-bar application for viewing, switching,
      importing, exporting, and editing Kubernetes contexts.
  timeline:
    - 'v1.0: First public release.'
    - 'v1.22: GitHub-distributed builds unlocked the pro feature set.'
    - 'v2.0: Project updated its Xcode and Swift baseline.'
    - 'v2.0.1: Patch release addressed a Minikube compatibility bug.'
  usage:
    - >
      Users select the active Kubernetes context from the menu bar, assign colors for
      visual identification, set namespaces, rename contexts, and import or export
      kubeconfig data.
