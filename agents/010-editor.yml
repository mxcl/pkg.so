config-file-location:
  windows:
    - '%APPDATA%\SweetScape\010 Editor\010Editor.cfg'
credentials-file-location: null
history:
  adoption-history:
    - >
      010 Editor established a specialist audience among reverse engineers, security
      analysts, developers, and file-format researchers who need structured
      interpretation in addition to ordinary hexadecimal editing. SweetScape's public
      template and script repository made parsers and automation reusable across that
      community.
  package-nerd-significance:
    - >
      Binary Templates are 010 Editor's defining package-nerd feature: a C-like
      description turns opaque bytes into named, editable data structures. Templates
      make file-format knowledge portable in a way that simple offset notes do not.
    - >
      The application is also a long-lived example of proprietary, cross-platform
      developer software distributed through desktop package managers while retaining
      vendor-managed licensing, updates, and extensions.
  project-history:
    - >
      SweetScape released 010 Editor 1.0 in September 2003 for Windows. It introduced
      Binary Templates as a structured way to understand and edit binary files rather
      than treating every format as an undifferentiated byte stream.
    - >
      Subsequent releases expanded the product with scripting, comparison, checksums,
      process and drive editing, Linux and macOS support, a public template repository,
      and importable or exportable application settings.
  related-projects:
    - >
      SweetScape maintains the official online repository of Binary Templates and
      Scripts, which is the main extension ecosystem for 010 Editor.
  sources:
    - https://www.sweetscape.com/010editor/manual/OptionsGeneral.htm
    - https://www.sweetscape.com/010editor/manual/ReleaseNotes.htm
    - https://www.sweetscape.com/press/BinaryFiles.html
  summary:
    - >
      010 Editor is SweetScape's commercial cross-platform text and hexadecimal editor.
      Its Binary Templates parse binary formats into named structures that users can
      inspect and modify.
  timeline:
    - '2003: SweetScape released 010 Editor 1.0 for Windows.'
    - >
      Later releases: 010 Editor added macOS and Linux support, a public template
      repository, and broader binary-analysis and automation features.
  usage:
    - >
      Users open files, disks, or process memory, inspect raw hexadecimal and textual
      representations, and apply Binary Templates to decode known formats. Scripts
      automate analysis and editing, while comparison, checksum, histogram, and
      data-inspector features support reverse engineering.
    - >
      The official release notes document the Windows configuration file under the
      user's roaming application-data directory. No official reusable credentials file
      is documented; product licensing is managed by the application.
related-packages:
  - id: cask:hex-fiend
    reason: >
      Choose Hex Fiend for a native open-source macOS hex editor optimized for very
      large files when you do not need 010 Editor's cross-platform Binary Template and
      scripting environment.
    rel: alternative
    sources:
      - https://github.com/HexFiend/HexFiend
      - https://www.sweetscape.com/010editor/
