history:
  adoption-history:
    - >
      The project crossed from source builds into package-manager use early in its life.
      The README documents Homebrew and Nix installation, and the supplied package
      metadata also lists Homebrew and Nix packaging.
    - >
      Its audience is the Unix desktop theming and 'rice' community: users who want one
      image or theme file to drive terminal, launcher, compositor, notification, editor,
      and shell color files.
  package-nerd-significance:
    - >
      hellwal is notable as a compact C entry in a space often occupied by Python
      scripts. That makes it attractive to packagers who want a fast, dependency-light
      theming utility with predictable build behavior.
    - >
      It is also a good example of desktop theming tools becoming package-manager
      artifacts: templates, cache paths, shell completions, and example themes matter
      almost as much as the binary.
  project-history:
    - >
      The repository was created in November 2024. The first public release, v1.0.0,
      described hellwal as a pywal-inspired color palette generator with support for
      templates, themes, and command-line arguments.
    - >
      Subsequent releases added cache support, JSON output, neon mode, preview flags,
      contrast checking, more templates, and fixes to parser and palette behavior. The
      README credits pywal as the inspiration.
  related-projects:
    - pywal is the direct inspiration credited by the README.
    - >
      swww, Themecord, terminal color scripts, and theme collections appear in project
      examples or release notes.
    - Homebrew and Nix are the package-manager channels present in the supplied metadata.
  sources:
    - https://api.github.com/repos/danihek/hellwal
    - https://github.com/danihek/hellwal
    - https://github.com/danihek/hellwal/releases
  summary:
    - >
      hellwal is a small color-palette generator for wallpaper-driven desktop theming.
      Its repository describes it as a Pywal-like generator that is faster and written
      in C, with templates, themes, JSON output, light and dark modes, and terminal
      color helpers.
    - >
      The available authoritative history is thin but useful: the GitHub repository and
      release notes show a young project that quickly accumulated practical theming
      features after its first public release.
  timeline:
    - '2024: Public GitHub repository created.'
    - '2024: v1.0.0 release published with templates, themes, and command-line options.'
    - '2024: v1.0.2 added palette caching under the user cache directory.'
    - '2025: v1.0.3 added JSON output and neon mode.'
    - '2025: v1.0.5 noted Homebrew packaging and additional templates, flags, and parser fixes.'
  usage:
    - >
      Users run `hellwal -i [image]` to generate a palette from a wallpaper image, or
      use `--theme` to apply a static palette. Generated templates are written under the
      user's cache directory, and theme files can live under `~/.config/hellwal/themes`.
    - >
      The tool can emit JSON for scripts, write terminal color scripts, run a
      post-generation command, choose light or dark modes, adjust brightness and
      grayscale, and fill template variables such as `color0.hex`, `background.rgb`, and
      alpha values.
