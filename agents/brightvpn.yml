history:
  adoption-history:
    - >
      Bright VPN is distributed for desktop, mobile, browser, and supported television
      environments. The official site does not publish reliable adoption figures, so
      broader uptake cannot be quantified from first-party material.
  package-nerd-significance:
    - >
      Bright VPN is unusual among packaged VPN clients because its free-service model is
      funded by opt-in access to the user's internet connection for Bright Data's
      public-web collection network. That operating model is a material consideration
      when evaluating the package.
  project-history:
    - >
      Bright VPN is operated by Bright Data as a free VPN product. Rather than charging
      a conventional subscription, it funds access by asking users to permit Bright Data
      to make controlled requests to public web pages through their IP address.
  related-projects:
    - Bright Data public-web data platform
    - Bright VPN browser extensions
    - Bright VPN mobile and television apps
  sources:
    - https://brightvpn.com/
    - https://brightvpn.com/faq
    - https://brightvpn.com/service-privacy-simplified
    - https://brightvpn.com/service-terms-simplified
  summary:
    - >
      Bright VPN is a free VPN service owned by Bright Data. It provides IP masking and
      location selection while using an opt-in, connection-sharing model to fund the
      service.
  timeline:
    - >
      Bright VPN expanded availability across desktop, Android, browser-extension, and
      supported television platforms; official sources reviewed do not provide dated
      launch milestones.
  usage:
    - >
      Users install the client, choose a VPN location, and enable the connection to
      route their traffic through the VPN.
    - >
      The free-service arrangement permits Bright Data to access public web pages
      through the device's IP address. The official privacy controls allow users to
      decide when connection sharing is enabled and to opt out.
