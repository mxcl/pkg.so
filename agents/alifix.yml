history:
  adoption-history:
    - >
      Alifix serves a specialized macOS maintenance niche rather than a broad consumer
      market. It is particularly relevant when copying or cloning large folder trees
      whose Finder aliases may need validation or refresh.
  package-nerd-significance:
    - >
      Alifix is notable to Mac package users as a narrowly focused graphical utility for
      Finder aliases, a macOS mechanism distinct from Unix symbolic links. Packaging it
      makes an otherwise obscure maintenance tool reproducibly discoverable and
      installable.
  project-history:
    - >
      The Eclectic Light Company introduced Alifix 1.0 as a tool for checking and
      repairing Finder aliases. Later releases improved its treatment of old broken
      aliases, moved to a Universal binary, and added compatibility with newer macOS
      generations through Tahoe.
  related-projects:
    - >
      alisma is the developer's companion command-line utility for creating Finder
      aliases and resolving them to filesystem paths.
    - Precize is a related Eclectic Light utility that inspects Finder aliases and bookmarks.
  sources:
    - >
      https://eclecticlight.co/2025/07/03/more-updates-for-tahoe-aliases-alifix-special-files-sparsity-file-types-utiutility-and-language-nalaprop/
    - https://eclecticlight.co/taccy-signet-precize-alifix-utiutility-alisma/
  summary:
    - >
      Alifix is a macOS maintenance utility from The Eclectic Light Company that
      recursively checks Finder aliases, refreshes resolvable aliases, identifies broken
      ones, and can write diagnostic details to adjacent text files.
  timeline:
    - 'Initial release: Alifix 1.0 introduced Finder-alias checking and repair.'
    - 'Universal-binary era: Alifix 1.2 added native support for Apple silicon and Intel Macs.'
    - '2025: Alifix 1.4 added compatibility with macOS Tahoe-era systems.'
  usage:
    - >
      Users select folders containing Finder aliases, scan them recursively, review
      aliases that can no longer be resolved, and refresh aliases that have become
      stale. The developer recommends it before and after cloning or copying large
      folders or volumes and for periodic housekeeping.
