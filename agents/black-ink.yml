history:
  adoption-history:
    - >
      Black Ink has served the Mac crossword niche since 2007. Support for Across Lite
      files, downloadable puzzle sources, premium New York Times puzzles, printing,
      Apple Silicon, and modern macOS features allowed it to remain useful across
      multiple generations of the platform.
  package-nerd-significance:
    - >
      Black Ink is notable to package users as a long-lived, independently developed Mac
      application whose lineage predates its Homebrew cask. Its continued support for an
      established interchange format, direct distribution, and native macOS conventions
      makes it representative of durable specialist Mac software.
  project-history:
    - >
      Developer Daniel Jalkut acquired the MacXword crossword application in February
      2007, substantially updated it, and released it as Black Ink the following month.
      Version 1 evolved through improvements to downloading, printing, authenticated
      puzzle sources, sandboxing, autosave, and document versioning.
    - >
      Black Ink 2 entered public beta in 2018 and received its official release in
      December 2019. Later releases added Apple Silicon support, a calendar-based
      archive browser, richer New York Times formatting, Dark Mode, Quick Look previews,
      and extensive printing and solving refinements.
  related-projects:
    - MacXword was the application's predecessor.
    - Across Lite supplies the puzzle-file format that Black Ink opens.
    - Red Sweater Software is the official developer and distributor.
  sources:
    - >
      Official Black Ink 2 beta history:
      https://redsweater.com/blog/3311/black-ink-2-public-beta
    - 'Official product page: https://redsweater.com/blackink/'
    - 'Official version history: https://redsweater.com/blackink/whatsnew.html'
  summary:
    - >
      Black Ink is a native crossword puzzle reader, solver, downloader, and printing
      application developed by Red Sweater Software for Apple platforms. It began as a
      reworked version of MacXword and has been maintained since 2007.
  timeline:
    - 'February 2007: Red Sweater acquired MacXword.'
    - 'March 20, 2007: Black Ink 1.0 was released.'
    - 'April 7, 2014: Version 1.6 added sandboxing, autosave, and document version browsing.'
    - 'April 5, 2018: Black Ink 2 entered public beta.'
    - 'December 3, 2019: Black Ink 2 received its official public release.'
    - 'November 16, 2020: Version 2.1 added Apple Silicon improvements.'
    - 'January 17, 2025: Version 2.4 added Quick Look and expanded printing controls.'
  usage:
    - >
      Users open Across Lite-compatible puzzle files or retrieve puzzles from configured
      online sources, solve them through a customizable keyboard-oriented interface, and
      optionally print book-style copies. Some publisher sources require their own
      subscriptions or accounts.
