history:
  adoption-history:
    - >
      electerm expanded across Linux, macOS, and Windows and is available through
      several packaging channels, including Homebrew, Snap, npm, winget, Scoop,
      distribution app stores, and a Debian repository.
  package-nerd-significance:
    - >
      electerm interests package users because one Electron application combines
      terminal emulation, remote shells, file transfer, remote desktops, serial access,
      and automation while maintaining broad operating-system and CPU support.
  project-history:
    - >
      electerm was developed by ZHAO Xudong as an MIT-licensed, cross-platform terminal
      and remote-connection client. Its scope grew beyond SSH and SFTP to include FTP,
      Telnet, serial ports, RDP, VNC, Spice, Zmodem, deep links, command-line
      automation, and MCP integration.
  related-projects:
    - >
      The project also provides electerm-web for browser and container use. Its protocol
      coverage overlaps with OpenSSH, SFTP clients, remote-desktop viewers, serial
      terminals, and file managers.
  sources:
    - https://github.com/electerm/electerm
    - https://github.com/electerm/electerm/wiki
    - https://github.com/electerm/electerm/wiki/Command-line-usage
  summary:
    - >
      electerm is an open-source, cross-platform terminal, file manager, and
      multi-protocol remote-access client.
  timeline:
    - '2017: electerm development began as a cross-platform terminal and SSH client.'
    - >
      2020s: Distribution expanded through desktop stores and package managers across
      Linux, macOS, and Windows.
    - >
      2026: Official command-line documentation covered batch operations, multiple
      connection protocols, and configurable data paths.
  usage:
    - >
      Users manage local terminals and SSH, SFTP, FTP, Telnet, serial, RDP, VNC, or
      Spice connections from one desktop application. The command line can open saved or
      ad hoc connections and run CSV batch operations.
