  linux:
    - ~/.config/electerm/users/default_user/electerm_data.db
    - ~/.config/electerm/users/default_user/electerm.data.nedb
  macos:
    - ~/Library/Application Support/electerm/users/default_user/electerm_data.db
    - ~/Library/Application Support/electerm/users/default_user/electerm.data.nedb
  windows:
    - '%APPDATA%\electerm\users\default_user\electerm_data.db'
    - '%APPDATA%\electerm\users\default_user\electerm.data.nedb'
credentials-file-location:
  linux:
    - ~/.config/electerm/users/default_user/electerm_data.db
    - ~/.config/electerm/users/default_user/electerm.data.nedb
  macos:
    - ~/Library/Application Support/electerm/users/default_user/electerm_data.db
    - ~/Library/Application Support/electerm/users/default_user/electerm.data.nedb
  windows:
