config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ansifilter appears in many Unix package managers because it solves a
      packaging-adjacent problem: converting colorized CLI output into archival or
      publishable text. Its changelog references contributions and fixes from distro and
      user communities, including Portage warning fixes, shell completion scripts, and
      issues from both its older GitHub tracker and current GitLab tracker.
  package-nerd-significance:
    - >
      Package nerds care about ansifilter because it lives at the boundary between
      terminals and documentation. It turns the color and formatting conventions emitted
      by Unix commands into artifacts suitable for web pages, bug reports, manuals, and
      forums without dragging in a full terminal emulator.
  project-history:
    - >
      The official changelog starts with ansifilter 0.1 on 25 October 2007. Early
      releases focused on terminal color escape handling, including xterm 256-color
      support by 1.0 in 2008 and license migration from GPLv2 to GPLv3 in 2009.
    - >
      The tool gradually expanded from a filter into a format bridge. LaTeX, TeX,
      BBCode, Pango, SVG, true color, OSC 8 hyperlinks, and ANSI-art formats were added
      over time, while the README documents a single CLI that can read stdin or files
      and produce multiple markup formats.
  related-projects:
    - >
      highlight is another Andre Simon project focused on source-code highlighting
      rather than ANSI escape conversion.
    - >
      Terminal log renderers and CI systems often need similar ANSI stripping or HTML
      conversion behavior.
  sources:
    - https://gitlab.com/saalen/ansifilter/-/raw/master/ChangeLog.adoc
    - https://gitlab.com/saalen/ansifilter/-/raw/master/README.adoc
    - source_facts.package-manager
  summary:
    - >
      ansifilter is a small command-line converter for text containing ANSI terminal
      escape sequences. It can strip escape codes or interpret them into formatted
      output such as HTML, RTF, TeX, LaTeX, BBCode, Pango Markup, and SVG.
  timeline:
    - '2007: Initial ansifilter 0.1 release.'
    - '2008: ansifilter 1.0 adds xterm 256-color sequence support.'
    - '2009: License changes from GPLv2 to GPLv3.'
    - '2016: ansifilter 2.0 adds a new CSI parser and ANSI/BIN/XBIN art options.'
    - '2019: ansifilter 2.14 adds SVG output.'
    - '2021: ansifilter 2.18 adds OSC 8 hyperlink support.'
    - '2025: ansifilter 2.22 adds tee and append-oriented CLI output features.'
  usage:
    - >
      Typical use is pipeline-oriented: pass colorized command output through ansifilter
      to strip ANSI escapes, or choose an output format such as --html, --latex, --rtf,
      --svg, or --bbcode. The README also documents --tail for following log files and
      ANSIFILTER_OPTIONS for default CLI options.
    - >
      For package users, ansifilter is a handy companion to grep, test logs, CI logs,
      terminal captures, and ANSI-art files. It is deliberately not a
      credentials-bearing tool and has no documented default config file.
related-packages:
  - id: brew:ansilove
    reason: >
      Choose Ansilove when the input is classic ANSI or ASCII art and the desired result
      is a compact PNG; choose ansifilter for stripping escapes or producing text and
      markup formats such as HTML, RTF, or SVG.
    rel: alternative
    sources:
      - https://gitlab.com/saalen/ansifilter
      - https://github.com/ansilove/ansilove
