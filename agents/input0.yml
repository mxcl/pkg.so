history:
  adoption-history:
    - >
      The project offers signed macOS releases and documents installation through
      Homebrew. Its model registry spans several speech-recognition families and many
      languages, positioning it as a local-first dictation option for Apple Silicon
      users.
  package-nerd-significance:
    - >
      Input 0 combines downloadable local speech models with a provider-configurable
      OpenAI-compatible refinement stage. Package enthusiasts can choose among
      model-size and accuracy tradeoffs while keeping raw audio transcription on the
      Mac.
  project-history:
    - >
      Input 0 was developed as a macOS push-to-talk voice-input application. Its design
      separates local speech-to-text processing from optional LLM polishing and can
      automatically paste the resulting text into the active application.
  related-projects:
    - >
      The official model list includes Whisper, SenseVoice, Paraformer, Moonshine,
      FireRedASR, and Zipformer CTC. The optional text-polishing stage supports OpenAI
      and other OpenAI-compatible providers.
  sources:
    - 'Official Input 0 README: https://github.com/10xChengTu/input0#readme'
    - 'Official releases page: https://github.com/10xChengTu/input0/releases'
  summary:
    - >
      Input 0 is a macOS dictation utility that transcribes speech locally, can refine
      the transcript through an LLM, and pastes the result into the current text field.
  timeline:
    - >
      The official releases page documents an incremental 0.x release series; the
      reviewed official sources do not state a definitive project-origin date.
  usage:
    - >
      Grant Microphone and Accessibility permissions, download a speech model, then hold
      the configured shortcut—Option-Space by default—while speaking. Releasing the
      shortcut transcribes, optionally refines, and pastes the text. LLM polishing
      requires an API key entered in the application's Settings interface; local
      transcription continues without it.
