history:
  adoption-history:
    - >
      Kopia grew into a recognizable package-manager backup tool because it combined
      repository-format features package users expect from backup software with a
      straightforward CLI binary. Homebrew, Scoop, Nix, APK, and zypper packaging in the
      input data show adoption across both workstation and server-oriented ecosystems.
    - >
      GitHub repository metadata observed on 2026-07-01 reported 13,555 stars and 674
      forks, which is substantial for a specialist backup utility and helps explain why
      it appears in multiple package indexes rather than only as a manual binary
      download.
  package-nerd-significance:
    - >
      Kopia matters to package nerds because it is a compact, cross-platform backup
      stack with encryption and deduplication built in, so one formula gives users a
      serious alternative to older backup systems without pulling in a large runtime.
    - >
      Its Go implementation, multi-backend storage model, and single-command
      installability make it fit neatly into Homebrew/Nix/Scoop-style package catalogs
      where users expect modern infrastructure tools to be portable and scriptable.
  project-history:
    - >
      The GitHub repository was created on 2015-12-19, while the public release stream
      visible in GitHub releases begins with v0.3.0 prereleases in 2019. The project
      settled into the same problem space as restic and BorgBackup: content-addressed,
      encrypted snapshot backups that can target local storage, NAS, and cloud object
      stores.
    - >
      Kopia's documentation and README emphasize user-controlled end-to-end encryption,
      compression, deduplication, and support for storage backends such as S3-compatible
      stores, Azure Blob Storage, Backblaze B2, Google Cloud Storage, WebDAV, SFTP,
      Rclone-backed locations, local disks, and Kopia's own repository server.
  related-projects:
    - >
      Kopia sits near restic, BorgBackup, Duplicacy, and rclone in package-manager
      culture: tools for encrypted personal and server backups, deduplicated
      repositories, and cloud-backed storage workflows.
    - >
      Rclone is also directly related because Kopia documentation lists Rclone-backed
      locations as a storage option, with Kopia managing and running Rclone for those
      backends.
  sources:
    - https://api.github.com/repos/kopia/kopia
    - https://api.github.com/repos/kopia/kopia/releases
    - https://github.com/kopia/kopia
    - https://kopia.io/docs
  summary:
    - >
      Kopia is a cross-platform open-source backup and restore tool built around
      encrypted, deduplicated, compressed snapshots. Its package-manager significance
      comes from being a modern Go backup system with both CLI and GUI workflows,
      installable as a single user-facing tool on macOS, Linux, and Windows.
  timeline:
    - '2015-12-19: GitHub repository created.'
    - '2019-05-10: v0.3.0 prerelease series appears in GitHub releases.'
    - >
      2020-03-08: Kopia 0.5.0 was announced as an early milestone release in
      community-facing project discussion.
    - '2026-06-16: GitHub showed v0.23.1 as a release on the repository page.'
  usage:
    - >
      Operators use Kopia to create repositories, snapshot selected directories, restore
      files, and connect repositories to cloud, remote, or local storage. It is not an
      image-backup tool; the official README frames it around backing up directories and
      files that users choose.
    - >
      For package users, the important split is CLI versus GUI: the `kopia` command
      supports automation and server use, while the same project also offers a
      desktop-facing experience for less shell-heavy backup workflows.
related-packages:
  - id: brew:rclone
    reason: >
      Kopia can use an Rclone remote as an experimental repository backend and then
      manage and invoke Rclone for supported cloud-storage workflows.
    rel: adjacent_workflow
    sources:
      - https://kopia.io/docs/repositories/
      - https://rclone.org/docs/
