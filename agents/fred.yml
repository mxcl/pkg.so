config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package is packaged for Homebrew as fred and for Python as fred-py-api on
      PyPI. Its README also documents shell completion snippets for zsh, bash, and fish,
      which is a sign that the CLI was intended for repeated terminal use rather than
      only occasional scripting.
  package-nerd-significance:
    - >
      Fred is interesting as a package because it turns a public economic-data web API
      into both importable Python modules and Unix-style subcommands. It packages a
      government-backed data source in a way that fits shell workflows, notebooks,
      finance scripts, and reproducible research pipelines.
  project-history:
    - >
      The GitHub repository was created in June 2022. The first pre-alpha release was
      published on June 23, 2022 as the first PyPI release, followed quickly by
      dependency fixes, full API stubs, a first full implementation of all APIs, and a
      test suite.
    - >
      The project metadata describes it as production/stable, intended for developers,
      finance users, and science/research users. The README documents installation
      through Homebrew and PyPI, Read the Docs API documentation, a GitHub wiki, FRED
      API documentation, and API key creation through the St. Louis Fed account site.
  related-projects:
    - >
      The project is directly related to the official FRED API, the FRED API key
      service, the fred-py-api Read the Docs site, and Python packaging through PyPI. It
      is also related to Click and Requests, which are listed as package dependencies.
  sources:
    - https://api.github.com/repos/zachspar/fred-py-api
    - https://fred-py-api.readthedocs.io/en/latest
    - https://fred.stlouisfed.org/docs/api/fred
    - https://github.com/zachspar/fred-py-api
    - https://github.com/zachspar/fred-py-api/releases
  summary:
    - >
      Fred CLI & Python API is a Python package and command-line interface for the
      Federal Reserve Bank of St. Louis FRED API. It wraps FRED data endpoints in Python
      modules and exposes separate CLI commands for major endpoint groups such as
      categories, releases, series, sources, and tags.
  timeline:
    - '2022: Repository created on June 22.'
    - '2022: v0.0.1-pre-alpha released as the first PyPI release.'
    - '2022: v0.0.5-pre-alpha marked the first full implementation of all APIs.'
    - '2022: v0.0.6-pre-alpha added a test suite with full coverage notes.'
    - '2022: v0.1.0-beta published after alpha releases.'
    - '2024: Read the Docs documentation generated for fred-py-api 1.2.0.'
    - '2026: Repository metadata shows active version 1.2.1 in pyproject.'
  usage:
    - >
      Users install the package with brew install fred or pip install fred-py-api. The
      pyproject defines console scripts named fred, categories, releases, series,
      sources, and tags; these map to the main FRED data domains exposed by the official
      St. Louis Fed API documentation.
