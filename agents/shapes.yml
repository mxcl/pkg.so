history:
  adoption-history:
    - >
      Shapes has remained a focused, lightweight Mac-native diagramming product rather
      than expanding into a broad collaborative suite. Continued releases added
      AppleScript, SVG improvements, multi-page documents, Quick Look, Dark Mode, and
      native Apple Silicon support.
  package-nerd-significance:
    - >
      Shapes appeals to users who prefer a compact native Mac application over a browser
      service or large diagramming suite. Its support for SVG, AppleScript, standard
      image exports, and a small application footprint makes it useful in developer and
      web-design workflows.
  project-history:
    - >
      Developer Todd Ditchendorf released Shapes 1.0 in January 2011. The application
      evolved through frequent early maintenance releases and later feature updates
      while retaining its single-window, Mac-native design.
    - >
      Shapes 5 arrived in October 2021 with Dark Mode and native support for Apple
      Silicon while continuing to support Intel Macs.
  related-projects:
    - Celestial Teapot
  sources:
    - 'Official changelog: https://shapesapp.com/changelog.html'
    - 'Official homepage: https://shapesapp.com/'
  summary:
    - >
      Shapes is a native macOS application for diagrams, charts, wireframes, vector
      drawings, and model-relationship visualizations.
  timeline:
    - 'January 2011: Shapes 1.0 was released.'
    - '2016: Shapes expanded AppleScript and SVG-related capabilities.'
    - '2017: Version 4.9 added resolution controls and selection export.'
    - 'October 2021: Shapes 5 added Dark Mode and native Apple Silicon support.'
  usage:
    - >
      Programmers, web designers, and other Mac users employ Shapes to build charts and
      wireframes, draw Bézier-based vector graphics, and visualize relationships.
      Documents can be exported as SVG, PNG, JPEG, TIFF, or multi-page PDF.
