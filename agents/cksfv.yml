id: brew:cksfv
display-name: cksfv
repo: https://gitlab.com/heikkiorsila/cksfv
docs:
  - https://gitlab.com/heikkiorsila/cksfv/-/blob/master/cksfv.1
  - https://zakalwe.fi/~shd/foss/cksfv
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The batch input records cksfv across many package managers: Homebrew, Alpine,
      Debian, Fedora/dnf, MacPorts, Nix, Arch/pacman, and Ubuntu. That breadth matches a
      small utility whose file-format compatibility made it worth carrying in Unix
      package collections.
  package-nerd-significance:
    - >
      cksfv is package-nerd significant as a classic small Unix compatibility utility:
      tiny surface area, old file-sharing checksum format, long distro shelf life, and a
      man page that clearly distinguishes integrity checking from cryptographic
      verification.
  project-history:
    - >
      The official changelog records cksfv 1.0 as released for public consumption in May
      2000 by Bryan Call, with FreeBSD 3.4 and Red Hat 6.1 working at release time. In
      2005 Heikki Orsila took over maintenance after Bryan Call became unreachable, and
      the current official page names Orsila as maintainer.
    - >
      The project history is mostly maintenance-oriented: portability fixes, recursive
      SFV checking, large-file support, man-page work, MinGW/Solaris/OpenBSD fixes, and
      signed release/tag practices.
  related-projects:
    - >
      The man page points users toward md5sum and sha1sum as stronger checksum tools for
      non-SFV use cases.
    - >
      The project exists around the SFV file format and CRC32 compatibility rather than
      as a general cryptographic checksum suite.
  sources:
    - https://zakalwe.fi/~shd/foss/cksfv
    - https://gitlab.com/heikkiorsila/cksfv/-/blob/master/cksfv.1
    - https://gitlab.com/heikkiorsila/cksfv/-/blob/master/ChangeLog
    - https://gitlab.com/api/v4/projects/heikkiorsila%2Fcksfv
  summary:
    - >
      cksfv is a Unix command-line tool for creating and verifying SFV files, which
      record CRC32 checksums for file-integrity checks.
  timeline:
    - '2000: Version 1.0 released publicly.'
    - '2004: Version 1.3.1 went into Gentoo Portage according to the changelog.'
    - '2005: Heikki Orsila took over maintenance.'
    - '2020: Version 1.3.15 released.'
  usage:
    - >
      The man page documents two main modes: create CRC32 checksum listings, usually
      redirected to an `.sfv` file, and verify files by recomputing checksums from an
      SFV listing. The page explicitly warns that CRC32 is not cryptographic and says
      cksfv should be used for compatibility rather than security.
related-packages:
  - id: brew:cfv
    reason: >
      Choose cfv when you need to create or verify SFV files alongside MD5, SHA, CRC,
      torrent, and other checksum-manifest formats.
    rel: alternative
    sources:
      - https://github.com/cfv-project/cfv/blob/python3/README.md
      - https://github.com/cfv-project/cfv/blob/python3/cfv.1
