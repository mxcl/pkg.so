id: cask:talon
display-name: Talon
repo: null
docs:
  - https://talonvoice.com/docs
  - https://talonvoice.com/docs/reference/guide.language.html
  - https://talonvoice.com/docs/reference/official.html
  - https://talonvoice.com/dl/latest/changelog.html
config-file-location:
  unix:
    - ~/.talon/user
  windows:
    - '%APPDATA%\Talon\user'
credentials-file-location: null
history:
  adoption-history:
    - >
      Talon developed a script-sharing culture around user-maintained `.talon` and
      Python files. The official onboarding guide recommends installing a community
      command set into the user directory, allowing the core application and personal
      command vocabulary to evolve separately.
    - >
      Cross-platform releases made the same customization model available on macOS,
      Windows, and Linux/X11. Talon is also distributed as the Homebrew cask `talon` for
      macOS users.
  package-nerd-significance:
    - >
      Talon treats accessibility automation as a programmable environment rather than a
      fixed voice-command product. Its embedded Python runtime, automatically reloaded
      user scripts, declarative `.talon` files, and APIs for applications, input, UI,
      audio, and eye tracking have supported an ecosystem of reusable command sets.
    - >
      The strict separation between the application and `~/.talon/user` is especially
      important to advanced users: custom commands can be version-controlled, shared,
      replaced, or backed up independently of the Talon installation.
  project-history:
    - >
      The official changelog identifies earlier Talon releases and betas from 2017
      through 2020, before the cross-platform 0.1 series standardized the newer
      scripting model and `.talon` command files.
    - >
      Subsequent releases expanded the accessibility and automation APIs, speech
      engines, noise recognition, eye tracking, user-interface inspection, and
      cross-platform behavior. Talon 1.0 in September 2026 introduced new
      GPU-accelerated speech models, a redesigned interface, an accessibility inspector,
      a command editor, and a new default command set.
  related-projects:
    - >
      The official `talonhub/community` command collection provides a commonly used
      starting configuration.
    - Dragon can be used as an alternative speech engine.
    - >
      Talon's embedded CPython runtime supports Python-based extensions alongside
      declarative `.talon` files.
  sources:
    - Input source_facts.package-manager.brew-cask.
    - https://talonvoice.com/
    - https://talonvoice.com/dl/latest/changelog.html
    - https://talonvoice.com/docs/reference/guide.language.html
    - https://talonvoice.com/docs/reference/official.html
  summary:
    - >
      Talon is a programmable, cross-platform hands-free input system combining voice
      commands, dictation, noises, eye tracking, and Python-based automation.
  timeline:
    - '2017–2020: Early Talon releases and beta versions established the project.'
    - >
      2020: The 0.1 series delivered a cross-platform public release and the newer
      user-script model.
    - '2022: The 0.3 series continued expanding APIs and platform support.'
    - >
      2026-09-20: Talon 1.0 introduced new speech models, a redesigned interface, and a
      new default command system.
  usage:
    - >
      Users install command scripts in Talon Home's `user` directory, then define voice
      commands, hotkeys, settings, modes, and application-specific behavior with
      `.talon` and Python files. Speech, noises, or an eye tracker can be used
      independently or together to write, code, browse, play games, and control the
      pointer.
tags:
