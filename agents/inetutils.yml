id: brew:inetutils
display-name: GNU Inetutils
repo: https://git.savannah.gnu.org/cgit/inetutils.git
docs:
  - https://www.gnu.org/software/inetutils/manual/inetutils.html
  - https://www.gnu.org/software/inetutils
config-file-location:
  unix:
    - /etc/inetd.conf
    - /etc/inetd.d/
    - /etc/syslog.conf
    - /etc/syslog.d/
credentials-file-location: null
history:
  adoption-history:
    - >
      Inetutils is adopted mostly through operating-system packaging rather than as a
      standalone app brand. GNU provides the source releases and manual, while
      distributions decide which binaries to install, rename, prefix, or split because
      many names overlap with platform-native tools. The Homebrew package prefixes
      several commands with g, reflecting the GNU-on-macOS convention used to avoid
      replacing BSD userland tools.
  package-nerd-significance:
    - >
      Inetutils is package-nerd bedrock: one source package produces a fleet of commands
      whose names collide with base-system tools, whose protocols carry decades of Unix
      history, and whose packaging choices reveal how each operating system balances GNU
      compatibility against native userland behavior.
    - >
      It also illustrates why package metadata can be weird: the package is one GNU
      project, but downstream formulas and distro packages may expose only clients, only
      daemons, prefixed commands, or individual subpackages.
  project-history:
    - >
      The GNU project presents Inetutils as a distribution of common networking
      utilities and servers. The manual says the individual utilities were originally
      derived from the 4.4BSD-Lite2 distribution, with later work integrating features
      from NetBSD, OpenBSD, FreeBSD, GNU/Linux, and GNU contributors.
    - >
      Inetutils preserves old Unix networking commands in GNU form. That history is
      visible in its command mix: some tools, such as telnet, rsh, rlogin, rexec, and
      talk, are mostly historical or controlled-environment tools, while others, such as
      ping, traceroute, hostname, logger, and inetd, remain useful in diagnostics,
      compatibility testing, and stripped-down systems.
    - >
      GNU release announcements continue to ship Inetutils as stable source tarballs
      with checksums, signatures, and mailing-list announcements. The 2.8 announcement
      in April 2026 described a release with 55 commits by five contributors since 2.7.
  related-projects:
    - >
      BSD userlands are the original lineage for many commands. NetBSD, OpenBSD,
      FreeBSD, and GNU/Linux contributed later feature ideas. net-tools, iputils,
      OpenSSH, syslog implementations, and platform inetd replacements are adjacent
      packages that often overlap or supersede parts of Inetutils.
  sources:
    - https://git.savannah.gnu.org/cgit/inetutils.git
    - https://lists.gnu.org/archive/html/info-gnu/2026-04/msg00012.html
    - https://www.gnu.org/software/inetutils/
    - https://www.gnu.org/software/inetutils/manual/inetutils.html
  summary:
    - >
      GNU Inetutils is the GNU collection of traditional network clients, servers, and
      small administrative tools. It includes programs such as ftp, telnet, inetd, rsh,
      rlogin, tftp, talk, syslogd, ping, traceroute, whois, hostname, dnsdomainname,
      ifconfig, logger, and uucpd.
  timeline:
    - '1990s: GNU Inetutils lineage derives many utilities from 4.4BSD-Lite2 code.'
    - '2000: The GNU Inetutils manual copyright range begins in the published manual.'
    - '2021: GNU project page update documents the package as common GNU network programs.'
    - '2026: GNU Inetutils 2.8 stable release announced on info-gnu.'
  usage:
    - >
      Users install Inetutils to get GNU implementations of classic network commands, to
      run inetd-style services, to test compatibility with legacy protocols, or to build
      environments that expect GNU command behavior. Security-sensitive deployments
      generally treat plaintext remote-login tools as legacy compatibility rather than
      preferred administration paths.
related-packages:
  - id: brew:iputils
    reason: >
      Choose iputils for a focused Linux-oriented set of modern diagnostics such as
      ping, arping, and tracepath; choose Inetutils when GNU implementations of the
      broader traditional client-and-server suite are required.
    rel: alternative
    sources:
      - https://www.gnu.org/software/inetutils/
      - https://github.com/iputils/iputils
  - id: brew:openssh
    reason: >
      Choose OpenSSH for encrypted remote login and file transfer instead of Inetutils'
      legacy plaintext rsh, rlogin, rexec, and telnet workflows.
    rel: alternative
    sources:
      - https://www.gnu.org/software/inetutils/manual/inetutils.html
      - https://www.openssh.com/
