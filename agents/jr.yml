id: brew:jr
display-name: JR
repo: null
docs:
  - https://jrnd.io/docs
config-file-location:
  unix:
    - ./jrconfig.json
    - $JR_SYSTEM_DIR/jrconfig.json
credentials-file-location: null
history:
  adoption-history:
    - >
      JR's packaging footprint is smaller than general JSON tools but targeted: its docs
      recommend Homebrew for macOS and Linux and Snap on Linux, and the release feed
      shows regular 0.3.x and 0.4.0 GitHub releases from 2023 through 2025. Homebrew
      analytics for the formula showed 153 installs over the 365-day window reported by
      the formula API on 2026-07-01.
  package-nerd-significance:
    - >
      JR belongs to the family of infrastructure demo generators: tools that package
      fake but structured events so developers can test streaming systems without
      hand-writing JSON. For package nerds, it is notable for combining Go templates,
      XDG-style template directories, Kafka-oriented output, and a CLI-first workflow.
  project-history:
    - >
      The JR documentation describes the project as a way to make quality random data
      for streaming applications without making Kafka test-data generation complex. Its
      documentation centers on reusable templates, embedded templates, data-generation
      functions, output templates, Kafka-friendly output, and producers.
  related-projects:
    - >
      JR is related to Kafka, kcat-style command-line streaming workflows, jq for
      inspecting generated JSON, and the broader category of fake-data generators used
      in demos and integration tests.
  sources:
    - https://formulae.brew.sh/api/formula/jr.json
    - https://github.com/jrnd-io/jr
    - https://github.com/jrnd-io/jr/releases/tag/v0.1.4
    - https://github.com/jrnd-io/jr/releases/tag/v0.3.0
    - https://github.com/jrnd-io/jr/releases/tag/v0.3.9
    - https://github.com/jrnd-io/jr/releases/tag/v0.4.0
    - https://jrnd.io/docs
  summary:
    - >
      JR is an open source CLI for generating random data for streaming applications,
      especially Kafka-oriented demos, tests, and pipelines.
  timeline:
    - '2023: GitHub release pages recorded v0.1.4 on 2023-04-11 and v0.3.0 on 2023-06-07.'
    - '2024: The release feed recorded v0.3.9 on 2024-08-22.'
    - '2025: The release feed recorded v0.4.0 on 2025-05-01.'
  usage:
    - >
      A common workflow is to run a named template, generate repeated rows with count,
      frequency, and duration options, and pipe JSON output to tools such as jq or Kafka
      command-line clients. JR also documents custom template directories, embedded
      templates, key/value output templates, and a built-in function manual.
related-packages:
  - id: brew:kcat
    reason: >
      JR documents a `--kcat` output mode and piping workflow for sending generated
      key/value records to Kafka with kcat.
    rel: adjacent_workflow
    sources:
      - https://jrnd.io/docs/kafka/
      - https://github.com/edenhill/kcat
  - id: brew:jq
    reason: >
      JR's official introduction recommends piping generated JSON to jq for syntax
      highlighting and inspection.
    rel: adjacent_workflow
    sources:
      - https://jrnd.io/docs/
      - https://jqlang.org/manual/
tags:
