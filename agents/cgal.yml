history:
  adoption-history:
    - >
      The project moved from an academic-use license model to an open source license in
      November 2003 and published open source project rules and procedures in October
      2005. The official repository notes that source tarballs, released twice a year,
      are the primary distribution vector.
  package-nerd-significance:
    - >
      For package maintainers, CGAL matters because it is a large, template-heavy C++
      geometry stack whose build and dependency behavior changed notably when version
      5.0 became header-only.
  project-history:
    - >
      The CGAL project started in 1996 as a consortium of seven sites in Europe and
      Israel, building on earlier internal geometry software such as PlaGeo, SpaGeo, the
      geometry part of LEDA, and INRIA Sophia-Antipolis's C++GAL.
  related-projects:
    - >
      The official history cites PlaGeo, SpaGeo, LEDA, and C++GAL as predecessor or
      contributing internal projects.
  sources:
    - https://api.github.com/repos/CGAL/cgal
    - https://github.com/CGAL/cgal
    - https://www.cgal.org/
    - https://doc.cgal.org/latest/Manual/index.html
    - https://www.cgal.org/documentation.html
    - https://formulae.brew.sh/api/formula/cgal.json
    - https://github.com/CGAL/cgal/blob/master/README.md
    - https://www.cgal.org/partners.html
  summary:
    - >
      CGAL, the Computational Geometry Algorithms Library, is a C++ library for reliable
      and efficient computational geometry algorithms.
  timeline:
    - '1996: CGAL started as a consortium project.'
    - '2003: CGAL adopted an open source license.'
    - '2005: CGAL published open source project rules and procedures.'
    - '5.0: CGAL became header-only according to the official repository README.'
  usage:
    - >
      CGAL is used as a library rather than a single end-user CLI. Its packages cover
      kernels, convex hulls, triangulations, Voronoi diagrams, mesh generation, geometry
      processing, spatial searching, interpolation, and visualization support.
