history:
  adoption-history:
    - >
      Keychron distributes Assistant for macOS and Windows as a required companion when
      customers enable Quick Start in the web-based Keychron Launcher.
  package-nerd-significance:
    - >
      The package is an example of a small native bridge installed to extend a
      browser-based hardware configurator with operating-system actions that a web
      application cannot perform alone.
  project-history:
    - >
      Keychron Assistant was introduced as a supplementary component of Keychron
      Launcher rather than as a standalone keyboard configurator. Official documentation
      centers it on the Launcher's Quick Start feature.
  related-projects:
    - >
      Keychron Launcher is the browser-based configuration application that exposes
      Quick Start and directs users to install Assistant.
  sources:
    - >
      Official Quick Start guide:
      https://www.keychron.com/blogs/news/how-to-use-quick-start-on-the-launcher
    - >
      Official installation guide:
      https://www.keychron.com/blogs/news/how-to-download-and-install-keychron-assist
  summary:
    - >
      Keychron Assistant is a companion application that enables Keychron Launcher's
      Quick Start feature to launch local applications and web pages from keyboard
      shortcuts.
  timeline:
    - >
      Current product generation: Keychron documents Assistant as a prerequisite for
      Launcher Quick Start.
  usage:
    - >
      Connect a supported Keychron device in Launcher, enable Quick Start, install
      Assistant, and assign keys to open selected desktop applications or web pages.
      Applications absent from Launcher's basket can be added manually through
      Assistant.
