history:
  adoption-history:
    - >
      Upstream documents installation through distribution package managers, snap,
      Homebrew, Windows installers, WSL2, and source builds. The package-manager
      metadata for this batch also shows availability in Homebrew, Debian, Fedora/DNF,
      Nix, and Ubuntu, which reflects its niche but real packaging footprint among
      lab-automation users.
  package-nerd-significance:
    - >
      For package maintainers, lxi-tools is notable because it packages a
      hardware-facing lab utility rather than another generic developer CLI. It has
      native dependencies, optional GUI pieces, shell completion, manpages, and
      hardware-plugin expectations, so it exercises the parts of package systems that
      deal with desktop integration and scientific/test-equipment workflows.
  project-history:
    - >
      The public Git history for lxi-tools begins in March 2016, followed immediately by
      early v0.x tags and a v1.0 tag in October 2017. The project describes itself as an
      independent open source community effort, separate from the LXI Consortium, with
      Martin Lund listed as creator and maintainer.
    - >
      The project is built around liblxi for instrument communication. Over time its
      scope grew from a CLI for VXI-11/raw TCP SCPI workflows into a broader toolkit
      with a GTK GUI, Lua scripting, screenshot plugins, mDNS discovery, and a
      maintained list of tested instruments from vendors such as Rigol, Keysight, Rohde
      & Schwarz, Siglent, Tektronix, and others.
  related-projects:
    - liblxi provides the communication layer used by lxi-tools.
    - >
      The LXI standard and SCPI command sets define much of the instrument-control
      context in which lxi-tools is used.
  sources:
    - https://github.com/lxi-tools/liblxi
    - https://github.com/lxi-tools/lxi-tools
    - https://github.com/lxi-tools/lxi-tools/releases
    - https://raw.githubusercontent.com/lxi-tools/lxi-tools/master/README.md
    - source_facts.package-manager
  summary:
    - >
      lxi-tools is an open source command-line and GUI toolkit for controlling
      LXI-compatible network test instruments. It is aimed at lab automation tasks such
      as discovering instruments, sending SCPI commands, taking screenshots,
      benchmarking request/response performance, and running Lua automation scripts.
  timeline:
    - '2016: Public Git history begins and v0.1 is tagged.'
    - '2017: v1.0 is tagged after the early release series.'
    - '2022: v2.x releases continue with expanded tooling.'
    - '2024: v2.8 is tagged in the official repository.'
  usage:
    - >
      Typical CLI usage starts with `lxi discover` to find instruments on the local
      network, then uses commands such as `lxi scpi --address ... "*IDN?"`, `lxi
      screenshot`, `lxi benchmark`, or `lxi run` for Lua scripts. The GUI exposes
      similar workflows for users who want interactive SCPI exploration, screenshot
      capture, live charts, and script execution.
