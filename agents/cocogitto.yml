id: brew:cocogitto
display-name: Cocogitto
repo: null
docs:
  - https://docs.cocogitto.io/
  - https://docs.cocogitto.io/guide/init.html
  - https://docs.cocogitto.io/reference/config.html
config-file-location:
  unix:
    - cog.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Cocogitto is distributed through Cargo and several OS package managers. crates.io
      lists more than 200 thousand downloads, while the input records packaging in
      Homebrew, apk, Debian, MacPorts, Nix, pacman, Scoop, and zypper.
    - >
      The official docs also advertise installation through Cargo, Arch Linux, NixOS,
      Void Linux, Homebrew, and Chocolatey, showing that the project deliberately
      supports both Rust-native and OS package-manager installation paths.
  package-nerd-significance:
    - >
      Cocogitto is a package-nerd tool about packages: it automates the release metadata
      loop around commits, changelogs, SemVer, tags, and CI. It is especially
      interesting for repos that want release automation without adopting a large hosted
      release platform.
    - >
      Its distribution story is also typical of modern Rust CLIs: a Cargo crate is the
      canonical package, but downstream OS packages make the same single binary
      available to non-Rust users.
  project-history:
    - >
      The GitHub repository was created in September 2020, and crates.io shows the
      `cocogitto` crate created later that month. The project README describes it as the
      Conventional Commits toolbox.
    - >
      Early changelog entries in 2020 show rapid construction of core features: commit
      creation, verification, logs, changelog generation, bumping, hooks, and the move
      to `cog.toml` configuration. Later releases expanded CI/CD, Docker, monorepo
      workflows, signing support, and generated configuration reference docs.
  related-projects:
    - Conventional Commits and SemVer are the standards Cocogitto is built around.
    - >
      cocogitto-action and cocogitto-bot are related GitHub integrations linked from the
      official docs.
    - >
      Adjacent changelog/release tools include git-cliff, release-plz, semantic-release,
      and commitlint.
  sources:
    - https://github.com/cocogitto/cocogitto
    - https://raw.githubusercontent.com/cocogitto/cocogitto/main/README.md
    - https://raw.githubusercontent.com/cocogitto/cocogitto/main/CHANGELOG.md
    - https://docs.cocogitto.io/
    - https://docs.cocogitto.io/reference/config.html
    - https://crates.io/crates/cocogitto
  summary:
    - >
      Cocogitto is a Rust CLI and GitOps toolbox for Conventional Commits and Semantic
      Versioning. It packages commit-message creation, commit-history checking,
      changelog generation, version bumping, hooks, and CI integrations into the `cog`
      command.
  timeline:
    - '2020: Repository created and first rapid series of 0.x changelog releases published.'
    - '2020: `cog.toml` configuration name introduced in the 0.32.1 era.'
    - '2021: 1.0.0 released.'
    - '2023: 6.0.0 adds Docker image support and other release-flow changes.'
    - '2024: 6.2.0 migrates docs to VitePress and expands configuration docs.'
    - '2026: 7.0.0 adds monorepo dependency resolver work and package updates.'
  usage:
    - >
      The main binary is `cog`. Users can run `cog commit` to create Conventional Commit
      messages, `cog check` to validate history, `cog changelog` to generate changelogs,
      and `cog bump` to derive semantic versions from commit history.
    - >
      Configuration lives in a repository-root `cog.toml`. The official config reference
      describes settings for version generation, changelog handling, commit conventions,
      hooks, and monorepo support.
related-packages:
  - id: brew:commitizen
    reason: >
      Choose Commitizen when you prefer a Python-based, configurable commit-and-release
      workflow with multiple version schemes; Cocogitto provides a native Rust toolbox
      focused specifically on Conventional Commits and SemVer.
    rel: alternative
    sources:
      - https://commitizen-tools.github.io/commitizen/commands/bump/
      - https://docs.cocogitto.io/
  - id: brew:git-cliff
    reason: >
      Choose git-cliff when highly customizable changelog generation is the main task,
      including regex-parsed non-conventional history; Cocogitto covers the broader
      commit-validation and version-bump workflow.
    rel: alternative
    sources:
      - https://git-cliff.org/docs/
      - https://github.com/cocogitto/cocogitto#similar-projects
tags:
