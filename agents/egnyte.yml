history:
  adoption-history:
    - >
      Egnyte grew as a business-focused alternative to consumer file-sync services,
      emphasizing centralized control, hybrid infrastructure, security, and compliance.
      In 2018 the company reported more than 14,000 paying customers, including large
      enterprises.
    - >
      The desktop client became a primary access method for users who wanted cloud
      content to appear in Finder or File Explorer without synchronizing the complete
      repository. Egnyte later introduced Desktop App Core for Mac to adopt Apple's File
      Provider framework and improve Apple Silicon deployment.
  package-nerd-significance:
    - >
      The cask is useful in managed Mac environments because it makes an enterprise
      content client reproducibly installable while authentication, domains, access
      policy, and offline-file selection remain organization-controlled.
    - >
      Its transition from a legacy filesystem integration to Apple's File Provider
      framework illustrates the platform work required to maintain cloud-drive clients
      across macOS architectural changes.
  project-history:
    - >
      Egnyte was founded in 2007 to help businesses replace or augment file servers with
      controlled cloud and hybrid content access. The broader platform evolved toward
      enterprise content collaboration, governance, and protection.
    - >
      Egnyte Desktop App exposes authorized cloud content as a drive or Finder location,
      downloading files as needed and optionally retaining selected folders for offline
      use. Desktop App Core for Mac was introduced as the newer File Provider-based
      implementation.
  related-projects:
    - Egnyte Web App
    - Egnyte Desktop App Core
    - Egnyte WebEdit
    - Egnyte Desktop Sync
  sources:
    - https://helpdesk.egnyte.com/hc/en-us/articles/202206920-Egnyte-Desktop-App-Overview
    - >
      https://helpdesk.egnyte.com/hc/en-us/articles/204881020-Which-Egnyte-desktop-client-should-I-use
    - https://helpdesk.egnyte.com/hc/en-us/articles/6688611695373-New-Desktop-App-Core-for-Mac
    - >
      https://www.egnyte.com/press-releases/2018-10-10-egnyte-secures-75m-series-e-from-goldman-sachs
  summary:
    - >
      Egnyte Desktop App is the macOS client for browsing, editing, and selectively
      synchronizing content managed by Egnyte's enterprise content platform.
  timeline:
    - '2007: Egnyte was founded.'
    - >
      2018: Egnyte reported more than 14,000 paying customers while expanding its
      enterprise content platform.
    - '2020: Support for the older Desktop Sync product ended.'
    - '2022: Egnyte documented the new File Provider-based Desktop App Core for Mac.'
  usage:
    - >
      Users authenticate to an organization's Egnyte domain and mount authorized content
      in Finder. Files are fetched when opened, changes are uploaded to the cloud, and
      selected folders can be synchronized for offline access.
    - >
      Administrators can deploy the client across managed Macs, while users can work
      with cloud files from ordinary desktop applications without storing the entire
      repository locally.
