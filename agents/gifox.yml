history:
  adoption-history:
    - >
      Gifox is available directly from its developer, through the Mac App Store, through
      Setapp, and as a Homebrew cask. The official site describes use by teams for
      exchanging ideas, reporting bugs, customer support, and presentations.
  package-nerd-significance:
    - >
      Gifox packages a complete GIF-production workflow into a macOS status-bar utility,
      combining capture, conversion, editing, compression, and cloud sharing. Its long
      compatibility history and availability across direct, store, subscription, and
      package-manager channels make it a recognizable specialist Mac utility.
  project-history:
    - >
      Gifox developed from a focused GIF screen recorder into a broader GIF production
      tool with video conversion, an integrated editor, interaction capture,
      configurable compression, media-library management, and sharing integrations.
    - >
      Gifox 2 arrived in 2019 with a redesigned editor and support for capturing mouse
      and keyboard interactions. Subsequent releases added video conversion, Apple
      Silicon support, additional import and export formats, cropping, and continuing
      workflow and performance improvements.
  related-projects:
    - Dropbox, Google Drive, and Imgur are supported sharing destinations.
    - >
      The Mac App Store and Setapp provide alternative official distribution and
      licensing channels.
  sources:
    - https://gifox.app/
    - https://gifox.app/changelog
    - https://gifox.app/docs/getting-started
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Gifox is a macOS status-bar application for recording, converting, editing,
      exporting, and sharing animated GIFs. It supports area and window capture,
      interaction overlays, detailed compression controls, and an integrated editor.
  timeline:
    - >
      2019: Gifox 2 introduced a new recording editor and mouse and keyboard interaction
      capture.
    - '2020: Version 2.2 added QuickTime video-to-GIF conversion.'
    - '2021: Version 2.3 added native Apple Silicon support.'
    - >
      2022: Version 2.4 expanded GIF, image-sequence, MP4, and MOV workflows; version
      2.5 added cropping.
    - >
      2025–2026: The 2.7–2.10 releases refreshed onboarding, selection, interaction
      capture, editing, performance, and current-macOS support.
  usage:
    - >
      Users select an arbitrary screen area or snap to an application window, record it,
      and then cut, trim, crop, rearrange, resize, compress, and export the result.
      Existing videos and image sequences can also be imported and converted.
    - >
      The free edition limits recordings and exports to ten seconds and adds a
      watermark; the Pro edition removes those restrictions. Direct, Mac App Store, and
      Setapp licenses use separate licensing mechanisms.
