history:
  adoption-history:
    - >
      The original project was released as freeware and later made its source available
      under GPL-2.0 through SourceForge. Subsequent ports preserved the game after
      PowerPC-era Mac binaries became impractical on modern systems; the repository
      packaged by this cask targets current macOS, Linux, and Windows and adds an
      optional widescreen mode.
  package-nerd-significance:
    - >
      Candy Crisis illustrates a common preservation path for classic Mac software:
      freeware distribution, publication of source code, and later community porting
      onto SDL and modern build systems so package managers can continue shipping it.
  project-history:
    - >
      John Stiles created Candy Crisis as a tile-matching action/puzzle game for classic
      Mac systems, with artwork and music contributed by several collaborators. The game
      presents twelve stages, competitive play with handicaps, and a solitaire practice
      mode.
  related-projects:
    - >
      The modern source port uses SDL and credits the original Candy Crisis project;
      contemporary accounts also connect the design lineage to the earlier game
      Skittles.
  sources:
    - https://candycrisis.sourceforge.net/
    - https://github.com/jorio/CandyCrisis
    - https://sourceforge.net/projects/candycrisis/files/
  summary:
    - >
      Candy Crisis is a tile-matching action/puzzle game in which groups of four
      matching candies disappear. The Homebrew cask follows a modern cross-platform
      source port of the older Mac game.
  timeline:
    - '2005: SourceForge hosted Windows builds of the open-source game.'
    - '2006: A Mac OS release was published through SourceForge.'
    - '2015: Later Intel Mac and Windows builds appeared on SourceForge.'
    - >
      Modern era: The jorio source port brought the game to current macOS, Linux, and
      Windows with optional widescreen support.
  usage:
    - >
      Players clear matching candy groups across twelve stages, compete locally against
      another player with optional handicaps, or practice in Solitaire Crisis mode. A
      tutorial is included in the game.
