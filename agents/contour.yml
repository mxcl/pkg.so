  windows:
    - '%LocalAppData%\contour\contour.yml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Contour is distributed for Linux, macOS, Windows, FreeBSD, and OpenBSD through
      upstream releases and platform package systems. Its cross-platform availability
      and focus on Unicode, GPU rendering, and terminal protocols place it among modern
      terminal emulators aimed at power users.
    - >
      The project has accumulated a substantial public development history and a
      multi-platform contributor community in its official GitHub organization.
  package-nerd-significance:
    - >
      Contour is notable for combining a modern C++ terminal frontend with a separately
      developed terminal-emulation core, Unicode-aware text handling, Sixel and ReGIS
      graphics, configurable profiles, Vi-like selection, and runtime configuration
      reload.
    - >
      Its human-readable YAML configuration honors XDG conventions on Unix. Recent
      daemon and tmux-control-mode features also position it as both a graphical
      terminal and an experimental persistent-session host.
  project-history:
    - >
      Contour was developed as an open-source, GPU-accelerated terminal emulator with an
      emphasis on correctness, performance, Unicode, and advanced terminal
      escape-sequence support. Its release metadata records public 0.3-series releases
      in 2022.
    - >
      Subsequent development added tabs, profiles, shell integration, extensive graphics
      and protocol support, cross-platform packaging, and persistent sessions. Version
      0.7.0 expanded Contour into a workspace with native tabs, split panes, saved
      layouts, and an optional daemon.
  related-projects:
    - >
      libterminal supplies terminal-emulation functionality within the Contour project
      ecosystem.
    - libunicode supports Unicode processing used by Contour.
    - tmux is interoperable with Contour's persistent-session daemon through control mode.
  sources:
    - https://contour-terminal.org/
    - https://contour-terminal.org/configuration/
    - https://contour-terminal.org/persistent-sessions/
    - https://github.com/contour-terminal/contour
    - https://github.com/contour-terminal/contour/blob/master/metainfo.xml
  summary:
    - >
      Contour is an open-source, cross-platform, GPU-accelerated terminal emulator aimed
      at power users and modern terminal workloads.
  timeline:
    - '2022: The official release metadata records Contour 0.3-series releases.'
    - >
      2026: Contour 0.7.0 added native tabs, split panes, saved layouts, and
      experimental persistent sessions.
  usage:
    - >
      Contour launches the user's configured shell and supports profiles for shells,
      colors, fonts, input mappings, history, and other terminal behavior. The generated
      YAML file can be edited directly or replaced with an explicitly selected
      configuration file.
    - >
      Power users can use Vi-like selection, inline graphics, hyperlinks, customizable
      key bindings, tabs, panes, layouts, and experimental daemon sessions.
