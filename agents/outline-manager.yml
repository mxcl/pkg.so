history:
  adoption-history:
    - >
      Outline Manager is distributed for macOS, Windows, and Linux and is the project's
      guided path for deploying Outline Server to supported cloud providers or
      user-controlled infrastructure.
    - >
      The Manager lowers the operational barrier to running a Shadowsocks-based server
      by turning deployment, key creation, sharing, revocation, and server
      administration into graphical workflows.
  package-nerd-significance:
    - >
      Outline Manager packages infrastructure deployment and credential-like access-key
      administration into a desktop application. It is therefore distinct from the
      Outline Client: the Manager provisions and administers servers, while clients
      consume the resulting access keys.
    - >
      For desktop package catalogs, it represents a security and networking
      control-plane application whose companion server and clients are separately
      developed and deployed.
  project-history:
    - >
      Outline Manager was developed by Jigsaw as the graphical administration
      application in the Outline project. It creates and manages Outline servers, which
      use Shadowsocks and expose an API for access-key management.
    - >
      Development of the Manager and Client is housed in the shared outline-apps
      repository. In 2026 the project updated its organizational and publishing identity
      from Jigsaw Operations to the Outline Foundation.
  related-projects:
    - Outline Server runs the managed Shadowsocks service and access-key API.
    - Outline Client connects end users to servers provisioned through the Manager.
    - Shadowsocks supplies the underlying proxy protocol and ecosystem.
  sources:
    - https://developer.getoutline.org/vpn/getting-started/server-setup-manager/
    - https://developer.getoutline.org/vpn/getting-started/share-access/
    - https://github.com/OutlineFoundation/outline-apps
    - https://github.com/OutlineFoundation/outline-apps/discussions/2753
    - https://github.com/OutlineFoundation/outline-server
  summary:
    - >
      Outline Manager is a cross-platform graphical application for deploying and
      administering Outline VPN servers and their access keys.
  timeline:
    - >
      2026: Outline Manager's publishing and organization identity transitioned from
      Jigsaw Operations to the Outline Foundation.
  usage:
    - >
      Administrators add a server in Outline Manager, select a cloud provider or
      self-managed host, and follow the guided deployment process.
    - >
      After deployment, they create, share, and revoke user access keys from the server
      details screen. Recipients use those keys with Outline Client.
