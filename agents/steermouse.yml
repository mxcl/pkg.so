history:
  adoption-history:
    - >
      Plentycom states that SteerMouse has attracted tens of thousands of users since
      its release and became an established Mac utility valued as an alternative to
      mouse-manufacturer drivers.
  package-nerd-significance:
    - >
      SteerMouse is notable among Mac utilities because it provides
      hardware-independent, per-application mouse customization across many USB and
      Bluetooth devices. It gives package-manager users a common replacement for
      fragmented vendor drivers and exposes controls beyond macOS's standard
      tracking-speed setting.
  project-history:
    - >
      SteerMouse was released in 2005 as a macOS mouse-customization utility. Over
      successive generations it expanded from button and cursor controls to modifier
      combinations, button chording, per-mouse and per-application profiles, scrolling
      controls, cursor snapping, system actions, and broad device compatibility.
    - >
      Version 5 was a major redesign that introduced up to 24 modifier-dependent
      functions per button, chording operations, per-mouse configuration, enhanced
      scrolling, recommended cursor settings, and additional system controls. Later
      releases added Apple Silicon support and eventually moved SteerMouse from System
      Settings into a standalone application.
  related-projects:
    - >
      Plentycom also develops CursorSense, a related cursor acceleration and sensitivity
      utility.
  sources:
    - 'Official SteerMouse product page: https://plentycom.jp/en/steermouse/'
    - 'Official SteerMouse support page: https://plentycom.jp/en/steermouse/support.html'
    - 'Official SteerMouse update history: https://plentycom.jp/en/steermouse/download.php'
  summary:
    - >
      SteerMouse is a long-running commercial macOS utility for customizing mouse
      buttons, chording, wheels, scrolling, cursor movement, and application-specific
      behavior.
  timeline:
    - '2005: SteerMouse was first released.'
    - >
      2016: SteerMouse 5 introduced chording, per-mouse configuration, expanded button
      assignments, and new system controls.
    - '2020: SteerMouse added support for Apple Silicon Macs.'
    - '2024: SteerMouse became a standalone application instead of a System Settings component.'
  usage:
    - >
      Users assign shortcuts, clicks, scrolling, zoom, application switching, Mission
      Control, media control, file or URL opening, and cursor-snapping actions to mouse
      controls. Settings can vary by application and mouse, while acceleration and
      sensitivity controls tune pointer and scroll behavior.
