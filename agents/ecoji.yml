history:
  adoption-history:
    - >
      Ecoji's adoption is niche but visible across language communities. The official
      README lists implementations or library packages for D, Gleam, Java, JavaScript,
      .NET, PHP, Python, Ruby, Rust, Swift, Zig, and Go, with the Go repository serving
      as the canonical implementation.
    - >
      Homebrew packages the `ecoji` CLI, while the README also supports installation
      through `go install`, giving both package-manager and Go-toolchain paths.
  package-nerd-significance:
    - >
      Ecoji is package-nerd candy: it is a serious base-1024 encoding wrapped in a
      memorable CLI, complete with a canonical standard, compatibility behavior,
      cross-language implementations, and a Homebrew formula.
    - >
      It also marks a small era of developer tools that used Unicode and emoji as data
      transport or display surfaces, testing the assumptions of terminals, fonts,
      shells, and package metadata.
  project-history:
    - >
      The GitHub repository was created in March 2018 and the first GitHub release,
      v1.0.0, was published the same month. The README describes Ecoji as encoding data
      with 1024 emojis and documents a command-line tool plus a Go library
      implementation.
    - >
      Version 2 of the Ecoji standard was released in 2022 with an improved emoji set.
      The README keeps compatibility with version 1 as the default behavior unless the
      newer encode flag is used.
  related-projects:
    - >
      Base64 is the conventional binary-to-text encoding Ecoji implicitly contrasts with
      in its examples.
    - >
      The official README lists third-party Ecoji implementations across several
      programming languages.
    - The Unicode emoji standard is the character repertoire Ecoji depends on.
  sources:
    - https://raw.githubusercontent.com/keith-turner/ecoji/master/README.md
    - https://api.github.com/repos/keith-turner/ecoji
    - https://api.github.com/repos/keith-turner/ecoji/releases
  summary:
    - >
      Ecoji is a deliberately playful binary-to-text encoding tool that represents data
      with emoji rather than Base64-style alphabets. The official README calls the Go
      repository the canonical implementation of the Ecoji standard.
  timeline:
    - '2018-03: GitHub repository created.'
    - '2018-03: Ecoji v1.0.0 released.'
    - '2022: Version 2 of the Ecoji standard released with an improved emoji set.'
    - '2025-10: GitHub release v2.0.2 published.'
  usage:
    - >
      Typical use is command-line encoding or decoding of stdin or a file. The README
      examples show data encoded as emoji text, decoded back to the original bytes, and
      used as a more visually distinctive representation of hashes or short identifiers.
    - >
      The README also warns that using emoji encodings for hashes or identifiers has
      practical risks on systems with poor UTF-8 emoji support, font differences, or
      similar-looking emoji.
related-packages:
  - id: brew:base64
    reason: >
      Choose base64 for broadly interoperable ASCII binary-to-text encoding; choose
      Ecoji when a distinctive emoji representation is more valuable than compatibility
      with conventional tooling.
    rel: alternative
    sources:
      - https://github.com/keith-turner/ecoji#examples
      - https://www.fourmilab.ch/webtools/base64/
