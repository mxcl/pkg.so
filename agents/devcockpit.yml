id: brew:devcockpit
display-name: Dev Cockpit
repo: null
docs:
  - https://devcockpit.app/getting-started
  - https://devcockpit.app/troubleshooting
config-file-location:
  unix:
    - ~/.devcockpit/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project documents a curl-based installer, manual binary installation, source
      builds, and Homebrew package-manager integration in the supplied package facts.
  package-nerd-significance:
    - >
      It matters to package-manager users because it detects and surfaces Homebrew, npm,
      Docker, and development services from a single terminal dashboard.
  project-history:
    - >
      The official documentation presents Dev Cockpit as a macOS and Linux tool, with
      Apple Silicon requirements called out for macOS and source builds from the
      caioricciuti/dev-cockpit repository.
  related-projects:
    - Homebrew, npm, Docker, terminal system monitors, macOS developer maintenance tools.
  sources:
    - https://devcockpit.app/getting-started
    - https://devcockpit.app/troubleshooting
    - source_facts.package-manager
  summary:
    - >
      Dev Cockpit is a terminal user interface for monitoring and maintaining
      development machines, with modules for system metrics, package managers, Docker,
      processes, services, diagnostics, logs, and security checks.
  timeline:
    - '2025: Official docs copyright names Caio Ricciuti and Ibero Data.'
    - 'Current: Getting Started documents macOS and Linux installation and first-run behavior.'
  usage:
    - >
      Users run devcockpit for the full TUI or subcommands such as status, diag, ps,
      services, security, cleanup list, and cleanup empty-trash.
related-packages:
  - id: brew:btop
    reason: >
      Choose btop for a mature, general-purpose resource and process monitor with deep
      CPU, memory, disk, network, and process views when Dev Cockpit's package-manager
      and workstation-maintenance modules are unnecessary.
    rel: alternative
    sources:
      - https://devcockpit.app/
      - https://github.com/aristocratos/btop
  - id: brew:bottom
    reason: >
      Choose bottom when you want a cross-platform, customizable terminal system monitor
      focused on resource graphs and process inspection rather than Dev Cockpit's
      developer-machine diagnostics and cleanup features.
    rel: alternative
    sources:
      - https://devcockpit.app/
      - https://clementtsang.github.io/bottom/
