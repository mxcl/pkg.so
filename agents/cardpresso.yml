history:
  adoption-history:
    - >
      cardPresso is offered in five scalable editions, from basic card design and
      printing to database, security, and encoding workflows. Official releases support
      Windows and macOS, while some advanced integrations remain platform-specific.
  package-nerd-significance:
    - >
      cardPresso is a specialist package whose value lies in its unusually broad
      hardware and data-integration surface: card printers, cameras, databases, magnetic
      encoding, smart cards, RFID, and network licensing all meet in one desktop
      application.
  project-history:
    - >
      cardPresso developed as commercial ID-card production software with tiered
      editions and support for professional printing and encoding hardware. Its official
      release history records continuing printer, encoder, database, licensing,
      translation, and security updates.
  related-projects:
    - ID-ALL
    - ID-card printers
    - MIFARE
    - RFID encoders
    - Homebrew Cask
  sources:
    - https://support.cardpresso.com/
    - https://www.cardpresso.com/cardpresso-software/documentation/
    - https://www.cardpresso.com/cardpresso-software/latest-release/
    - source_facts.package-manager
  summary:
    - >
      cardPresso is cross-platform commercial software for designing, encoding,
      managing, and printing professional identification cards.
  timeline:
    - >
      2026: cardPresso announced deprecation of versions earlier than 1.7.80 effective
      March 31.
    - >
      2026: The official release page lists version 1.7.140 with updated printer,
      encoder, network-license, and translation support.
  usage:
    - >
      Organizations use cardPresso to design card layouts, connect records and images
      from databases, print cards, and—depending on edition and platform—encode
      magnetic, contact, or contactless media. Licensing is available through USB
      devices or activation codes.
