history:
  adoption-history:
    - >
      PixelCut says PaintCode was adopted by organizations including Apple, Disney
      Pixar, Evernote, Hewlett Packard, and Qualcomm. Its niche was the boundary between
      interface design and application engineering, where generated vector drawing code
      could replace bundles of fixed-resolution image assets.
    - >
      The addition of Swift, Android Java, JavaScript, and multi-platform export
      broadened PaintCode beyond its initial Objective-C and Apple-platform audience.
  package-nerd-significance:
    - >
      PaintCode represents a distinctive design-to-source workflow: vector artwork
      becomes readable drawing code that can be versioned, reviewed, compiled, and
      parameterized like the rest of an application.
    - >
      StyleKits, variables, expressions, dynamic shapes, and symbols make generated
      assets reusable rather than one-off exports. This is especially attractive to
      developers maintaining resolution-independent controls, icons, and branded
      interface elements across platforms.
  project-history:
    - >
      PixelCut was founded in Bratislava in March 2012, and PaintCode was its first
      product. The team created it to solve its own need for a vector drawing tool that
      generated application code.
    - >
      PaintCode 2 emphasized StyleKits, parametric drawings, and improved drawing tools.
      PaintCode 2.1 added Swift generation soon after Swift's introduction, while
      subsequent 2.x releases added Smart Symbols, SVG generation, and broader import
      and export capabilities.
    - >
      PaintCode 3 arrived in November 2016 with Swift 3, Android Java and JavaScript
      generation, resizing methods, and Telekinesis. It also moved away from Mac App
      Store distribution to direct subscription sales.
  related-projects:
    - >
      Xcode consumes the generated Swift and Objective-C StyleKit source in
      Apple-platform projects.
    - Android Studio can consume PaintCode's generated Android Java code.
    - Sketch is served separately by PixelCut's PaintCode plugin.
    - >
      Drama was a later PixelCut design and prototyping application, but the company
      explicitly said it did not replace PaintCode or generate code.
  sources:
    - https://www.paintcodeapp.com/documentation
    - https://www.paintcodeapp.com/news/introducing-paintcode-2
    - https://www.paintcodeapp.com/news/paintcode-3
    - https://www.paintcodeapp.com/support
    - https://www.paintcodeapp.com/tutorials
  summary:
    - >
      PaintCode is a macOS vector drawing application that converts drawings into source
      code in real time. Its StyleKit workflow bridges visual design and application
      development across Swift, Objective-C, C#, Android Java, and JavaScript targets.
  timeline:
    - 'March 2012: PixelCut was founded, with PaintCode as its first product.'
    - >
      2014: PaintCode 2 introduced StyleKits, variables, expressions, and improved
      drawing tools.
    - '2014: PaintCode 2.1 added Swift code generation.'
    - >
      November 2, 2016: PaintCode 3 introduced broader cross-platform code generation
      and Telekinesis.
  usage:
    - >
      Designers and developers construct vector shapes, colors, gradients, shadows,
      images, and variables on canvases. PaintCode continuously generates drawing code,
      which can be copied or exported as a reusable StyleKit class.
    - >
      Parametric drawings and Smart Symbols let one asset respond to dimensions, colors,
      or other runtime inputs. Official tutorials cover integration with Xcode, Android
      Studio, and websites.
