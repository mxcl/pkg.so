id: brew:ddd
display-name: GNU DDD
repo: https://savannah.gnu.org/projects/ddd
docs:
  - https://www.gnu.org/s/ddd/manual/html_mono/ddd.html
  - https://www.gnu.org/software/ddd
config-file-location:
  unix:
    - ~/.ddd/init
    - ~/.ddd/sessions/<session>/init
credentials-file-location: null
history:
  adoption-history:
    - >
      For many years DDD was packaged by Unix and Linux distributions as the familiar
      GUI companion to GDB, DBX, XDB, and similar debuggers. The project had a long
      stable period around the 3.3.x line, with GNU's news page announcing 3.3.12 in
      2009, and later documentation and homepage updates describing the 3.4 series.
  package-nerd-significance:
    - >
      DDD is notable because it packages an older but still recognizable Unix GUI
      workflow: X11, Motif, GNU debugger tooling, and persistent per-user sessions. It
      is a reminder that command-line developer tools often acquired graphical front
      ends long before IDEs became the default package consumers.
  project-history:
    - >
      DDD grew out of 1990s work on graphical debugging interfaces for Unix debuggers
      and became part of the GNU Project. The GNU manual describes it as a front end to
      GDB and other inferior debuggers, while the official DDD paper emphasized
      graphical data display as its distinctive contribution over a plain source-level
      debugger UI.
  related-projects:
    - GDB and CUDA-GDB are the primary debuggers named by the current GNU DDD homepage.
    - >
      DBX, XDB, Bash, Python, Perl, and GNU Make debuggers are part of DDD's broader
      historical debugger-front-end role.
    - KDbg and IDE debuggers occupy adjacent graphical-debugger territory.
  sources:
    - https://www.gnu.org/software/ddd/
    - https://www.gnu.org/software/ddd/news.html
    - https://www.gnu.org/software/ddd/manual/html_mono/ddd.html
    - https://www.gnu.org/software/ddd/manual/pdf/ddd-paper.pdf
    - https://savannah.gnu.org/svn/?group=ddd
  summary:
    - >
      GNU DDD, the Data Display Debugger, is a graphical front end for command-line
      debuggers. Its package identity is tied to the classic Unix debugging stack:
      Motif/X11 UI, GDB underneath, and a visual data display for inspecting structures
      as graphs.
  timeline:
    - '1995: Official DDD paper describes the graphical data display approach.'
    - '2009: DDD 3.3.12 announced on the GNU DDD news page.'
    - '2023: GNU manual first edition updated for DDD 3.4.0.'
    - '2026: GNU homepage lists the 3.4 series as the current stable line.'
  usage:
    - >
      Package users typically install DDD when they want a graphical debugging session
      without moving to an IDE: breakpoints, watchpoints, call stacks, source display,
      and graph-style inspection of data structures while GDB or another debugger runs
      underneath.
related-packages:
  - id: brew:gdb
    reason: >
      GDB is DDD's recommended underlying debugger; install it when using DDD as a
      graphical front end for native-code debugging.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/ddd/manual/html_mono/ddd.html
      - https://www.gnu.org/software/gdb/
