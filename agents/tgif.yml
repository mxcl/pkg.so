credentials-file-location: null
history:
  adoption-history:
    - >
      Its adoption history is mostly package-archive based rather than GitHub based. The
      official download page explicitly points Linux users to apt-get and yum packages,
      and the Homebrew input records packaging in Homebrew, Debian, Fedora/DNF,
      MacPorts, and Ubuntu.
  package-nerd-significance:
    - >
      Tgif is a good example of older Unix desktop software kept alive by package
      systems: the useful artifact is not a modern repo workflow, but a stable tarball,
      a manpage-like interface, and downstream maintainers making an X11-era tool
      installable on current systems.
  project-history:
    - >
      The project predates modern source-hosting workflows and is distributed primarily
      through release tarballs and archive mirrors. The official download page
      identifies version 4.2 patchlevel 5 as the current release and publishes both QPL
      and free-of-charge source archives.
    - >
      Tgif also developed an unusual web-era role: its official page says version 2.16,
      released on Dec 3, 1994, made it a hyper-structured-graphics editor/browser for
      the World-Wide-Web.
  related-projects:
    - >
      The official Tgif site links to other free vector drawing tools on the X Window
      System and to tools that work with Tgif.
  sources:
    - 'Official Tgif download page: https://bourbon.usc.edu/tgif/download.html'
    - 'Official Tgif home page: https://bourbon.usc.edu/tgif/'
    - 'Official Tgif release notes index: https://bourbon.usc.edu/tgif/relnotes/'
    - >
      SourceForge project page from source_facts.homepage:
      https://sourceforge.net/projects/tgif
  summary:
    - >
      Tgif is a long-running X11 vector drawing program for Unix-like systems. Its
      official home page describes it as an Xlib-based interactive 2-D drawing tool
      using vector graphics, while SourceForge presents it as a vector-based drawing
      tool and hyper-structured-graphics browser.
  timeline:
    - >
      1994: Version 2.16 adds hyper-structured-graphics web browsing/editing, according
      to the official home page.
    - >
      2001: Version 4.1.41 begins parallel QPL and free-of-charge releases, according to
      the official download page.
    - '2011: Version 4.2 patchlevel 5 appears in the official release notes.'
    - >
      2013: SourceForge records the project as a vector drawing and
      presentation-graphics tool.
  usage:
    - >
      Package users install it as the `tgif` executable for interactive drawing under
      X11. The official page emphasizes Linux and most Unix platforms, including Mac OS
      X and Cygwin on Windows.
