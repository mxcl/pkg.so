history:
  adoption-history:
    - >
      CloudMounter is distributed as a native macOS application and through the Homebrew
      cask ecosystem. The vendor also offers a Windows version.
  package-nerd-significance:
    - >
      It packages a Finder-integrated alternative to separate synchronization clients
      and command-line filesystem mounts, covering both consumer cloud providers and
      server protocols in one desktop utility.
  project-history:
    - >
      Electronic Team develops CloudMounter as a commercial cloud-storage and
      remote-server mounting utility. The vendor continues to publish macOS releases and
      documents support for both Apple silicon and Intel Macs.
  related-projects:
    - >
      The vendor positions Commander One as a related local and remote file-management
      product.
  sources:
    - https://mac.eltima.com/mount-cloud-drive.html
    - https://mac.eltima.com/sftp-client-mac-windows/
    - source_facts.provenance
  summary:
    - >
      CloudMounter is a macOS system utility that exposes cloud accounts and remote
      servers as local Finder drives.
  timeline:
    - >
      2026: Official product pages document the 4.18 release and support for macOS 12.4
      or later.
  usage:
    - >
      Users add a cloud or server connection, supply the service or server details, and
      mount it for access through Finder. Supported surfaces include Google Drive,
      OneDrive, Dropbox, Amazon S3, WebDAV, FTP, FTPS, and SFTP. Passwords may be stored
      in macOS Keychain, but the vendor does not document a credentials file path.
