credentials-file-location: null
history:
  adoption-history:
    - >
      The release notes contain repeated feature requests, bug reports, and
      acknowledgements from working physicists. A 2010 note says a bug report could
      improve the lives of roughly 100 other theorists, indicating a small but active
      specialist user base rather than mass-market adoption.
    - >
      The application survived the transition from the original SPIRES service to
      INSPIRE, later adapted to the modern INSPIRE HEP API, added iCloud sidebar
      synchronization, and gained Apple Silicon support. The author reported in 2025
      that he still used it daily.
  package-nerd-significance:
    - >
      spires.app is a long-lived example of domain-specific research software packaged
      as a Mac cask. It combines literature search, local PDF management, citation
      navigation, BibTeX generation, and LaTeX-file watching in a workflow tailored to
      high-energy physicists.
    - >
      Its release history records continual repairs for upstream website and API
      changes, macOS transitions, arXiv identifier changes, and local database
      growth—the maintenance pressures package users commonly encounter with scholarly
      desktop clients.
  project-history:
    - >
      Yuji Tachikawa began publicly recording spires.app releases in October 2008. The
      program originally targeted the SPIRES high-energy-physics literature database
      while also integrating arXiv feeds, journal pages, local PDFs, and bibliography
      generation.
    - >
      Version 1.4 added INSPIRE as a backend in April 2011. After the original SPIRES
      website closed, the application continued around INSPIRE and arXiv; the name
      remained because development predated that transition.
    - >
      Later releases added iCloud sidebar synchronization in 2018, rewrote internals for
      the modern INSPIRE HEP site and API in 2020, added Apple Silicon compilation in
      2020, and continued receiving compatibility fixes through 2026.
  related-projects:
    - >
      inspire.app is the related iOS client maintained from the same official source
      repository.
    - >
      INSPIRE HEP succeeded the SPIRES literature database and supplies the
      application's principal research metadata.
    - >
      arXiv supplies preprints and new-paper feeds, while BibTeX and LaTeX integration
      connect the app to scholarly writing workflows.
  sources:
    - https://github.com/yujitach/inspire
    - https://member.ipmu.jp/yuji.tachikawa/spires/
    - https://member.ipmu.jp/yuji.tachikawa/spires/Release%20Notes.html
    - source_facts.package-manager
  summary:
    - >
      spires.app is a macOS literature-management client for high-energy physicists,
      integrating INSPIRE HEP, arXiv, local PDFs, citation searches, and BibTeX/LaTeX
      workflows.
  timeline:
    - '2008-10-13: First recorded barely usable public version.'
    - '2009-03-06: Version 1.0 is released.'
    - '2011-04-01: INSPIRE becomes a supported backend.'
    - '2012-05-22: The app adapts after the original SPIRES website closes.'
    - '2018-08-21: Sidebar content gains iCloud Drive synchronization.'
    - '2020-06-17: Internals are adapted to the modern INSPIRE HEP website and API.'
    - '2020-11-30: An Apple Silicon build is introduced.'
    - '2026-01-21: Version 2.0.12 restores category/recent functionality.'
  usage:
    - >
      Users run old-style INSPIRE queries, browse arXiv/new feeds, download and organize
      PDFs, inspect citations and references, and maintain BibTeX files from watched
      LaTeX documents.
    - >
      The PDF directory is chosen in Preferences; without a choice, the desktop is used.
      The local database is stored under `~/Library/Application Support/spires/`, which
      the official FAQ recommends including in backups.
