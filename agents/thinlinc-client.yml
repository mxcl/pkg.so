  - https://www.cendio.com/resources/docs/tag/client_config.html
  - https://www.cendio.com/resources/docs/tag/client_macos.html
config-file-location:
  linux:
    - /opt/thinlinc/etc/tlclient.conf
    - /opt/thinlinc/etc/tlclient_mandatory.conf
  macos:
    - /Library/Application Support/ThinLinc Client/tlclient.conf
    - /Library/Application Support/ThinLinc Client/tlclient_mandatory.conf
  unix:
    - ~/.thinlinc/tlclient.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      ThinLinc has been adopted for centralized Linux desktops in industrial,
      educational, healthcare, and high-performance-computing settings. Its client is
      available for Windows, macOS, and Linux, while browser access is provided
      separately through the ThinLinc web client.
  package-nerd-significance:
    - >
      ThinLinc is notable as a long-lived commercial Linux remote-desktop product built
      substantially on open-source components. Cendio’s stewardship of TigerVNC and
      noVNC links the product directly to two widely packaged remote-access projects.
  project-history:
    - >
      Cendio traces ThinLinc’s inception to the turn of the millennium and says the
      product became the company’s main focus in 2003. The official release archive
      documents an established release line by 2005, and Cendio marked the product’s
      twentieth anniversary in 2023 with a broad interface refresh.
  related-projects:
    - TigerVNC
    - noVNC
    - VirtualGL
    - PulseAudio
  sources:
    - https://www.cendio.com/ — official product overview and use cases
    - https://www.cendio.com/about-us/ — official company and ThinLinc history
    - >
      https://www.cendio.com/blog/introducing-thinlinc-4-15-0/ — official
      twentieth-anniversary account
    - https://www.cendio.com/thinlinc/docs/relnotes/ — official release archive
  summary:
    - >
      ThinLinc is Cendio’s multiuser Linux remote-desktop system. The packaged client
      connects Windows, macOS, or Linux endpoints to Linux desktops and applications
      hosted by a ThinLinc server.
  timeline:
    - '2003: ThinLinc became Cendio’s main product focus'
    - '2005: The surviving official release archive begins'
    - '2023: Cendio marked twenty years of ThinLinc and refreshed its interfaces'
  usage:
    - >
      Users install the client, enter a ThinLinc server hostname and their login
      credentials, and open a remote Linux session. Administrators can control client
      defaults through system-wide configuration while users retain per-user settings
      unless mandatory parameters override them.
