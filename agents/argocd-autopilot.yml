id: brew:argocd-autopilot
display-name: Argo CD Autopilot
repo: null
docs:
  - https://argocd-autopilot.readthedocs.io/en/stable
config-file-location:
  unix:
    - ~/.kube/config
credentials-file-location: null
history:
  adoption-history:
    - >
      Autopilot is distributed as a CLI through Homebrew, Scoop, Chocolatey, AUR, direct
      release tarballs, and Docker according to its README and Homebrew formula. Its
      adoption is tied to Argo CD and GitOps operators rather than to a standalone
      runtime: the tool creates or updates Git repositories, installs Argo CD, and
      relies on Kubernetes context plus Git credentials.
  package-nerd-significance:
    - >
      Autopilot is a useful package-manager artifact because it packages a GitOps
      workflow convention, not just an API client. Installing the binary gives operators
      a repeatable bootstrap path for repo layout and Argo CD self-management, which is
      exactly the kind of operational glue that becomes valuable as a named CLI.
  project-history:
    - >
      The GitHub repository was created in March 2021 and the first public release,
      v0.1.2, followed in April 2021. The project lives under argoproj-labs, which the
      official argoproj README describes as a separate organization for community
      contributions related to the Argo ecosystem, administered by individual project
      owners.
  related-projects:
    - >
      The project is explicitly built around Argo CD and the Argo ecosystem. It also
      installs the ApplicationSet controller during bootstrap according to its README,
      tying it to the GitOps app-generation workflow used by Argo CD users.
  sources:
    - https://api.github.com/repos/argoproj-labs/argocd-autopilot
    - https://api.github.com/repos/argoproj-labs/argocd-autopilot/releases
    - https://github.com/argoproj-labs/argocd-autopilot#readme
    - https://github.com/argoproj/argoproj#readme
    - >
      https://raw.githubusercontent.com/Homebrew/homebrew-core/HEAD/Formula/a/argocd-autopilot.rb
  summary:
    - >
      Argo CD Autopilot is an argoproj-labs CLI for bootstrapping Argo CD and managing a
      GitOps repository with an opinionated structure. It targets a common early Argo CD
      problem: users know they want GitOps, but not how to lay out repos, add apps,
      promote changes, or manage Argo CD itself through Git.
  timeline:
    - '2021: GitHub repository created under argoproj-labs.'
    - '2021: v0.1.2 published as the first GitHub release visible through the releases API.'
    - '2023: v0.4.x line continues with regular maintenance releases.'
    - '2025: v0.4.20 published and packaged by Homebrew.'
  usage:
    - >
      A typical session exports `GIT_TOKEN` and `GIT_REPO`, then runs `argocd-autopilot
      repo bootstrap` against the current Kubernetes context. After bootstrap, users
      create projects and applications; Autopilot commits manifests to the GitOps
      repository and lets Argo CD reconcile them into the cluster.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Autopilot's official getting-started guide requires kubectl and a kubeconfig
      before bootstrapping Argo CD into a Kubernetes cluster.
    rel: adjacent_workflow
    sources:
      - https://argocd-autopilot.readthedocs.io/en/stable/Getting-Started/
      - https://formulae.brew.sh/formula/kubernetes-cli
  - id: brew:argocd
    reason: >
      Use the Argo CD CLI to inspect and operate the Argo CD installation and
      applications that Autopilot bootstraps and manages through Git.
    rel: adjacent_workflow
    sources:
      - https://argocd-autopilot.readthedocs.io/en/stable/
      - https://argo-cd.readthedocs.io/en/stable/user-guide/commands/argocd/
      - https://formulae.brew.sh/formula/argocd
