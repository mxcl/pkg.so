history:
  adoption-history:
    - >
      SSDReporter targeted Macs with compatible internal SSD or flash storage and
      evolved alongside changes in drive interfaces, macOS releases, and Apple hardware.
      It gained native Apple Silicon support in 2021 and changed from commercial
      software to a free, promotion-supported application later that year; the supplied
      record identifies the free edition's Homebrew cask.
  package-nerd-significance:
    - >
      SSDReporter represents a specialized layer above raw S.M.A.R.T. data: it combines
      several vendor-dependent lifetime attributes into a simpler health percentage and
      configurable warning thresholds. Its extensive compatibility notes illustrate why
      storage-health tooling depends heavily on controller, enclosure, drive firmware,
      and operating-system support.
  project-history:
    - >
      CoreCode introduced SSDReporter in 2015 as a focused companion to SMARTReporter
      for monitoring SSD wear. Subsequent releases expanded drive compatibility, added a
      check-history view, supported NVMe-based Macs, adapted to Apple Silicon, and
      maintained compatibility with newer macOS releases.
  related-projects:
    - >
      SMARTReporter is CoreCode's broader disk-failure monitoring application.
      SSDReporter focuses specifically on SSD lifetime attributes and health-decrease
      notifications.
  sources:
    - 'Official FAQ: https://www.corecode.io/ssdreporter/faq.html'
    - 'Official Read Me: https://www.corecode.io/ssdreporter/readme.html'
    - 'Official version history: https://www.corecode.io/ssdreporter/history.html'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      SSDReporter is a free CoreCode macOS utility that monitors compatible SSD lifetime
      indicators and warns when drive health declines.
  timeline:
    - '2015: SSDReporter 1.0 was released on March 28.'
    - '2017: A history tab was added to record performed checks.'
    - '2018: Support expanded to NVMe-based Macs and some external SSD configurations.'
    - >
      2021: Native Apple Silicon support arrived; later that year SSDReporter became
      free and promotion-supported.
    - '2024: Compatibility work continued for macOS Sequoia and additional SSD models.'
  usage:
    - >
      Users keep SSDReporter running in the background, choose a polling interval and
      warning or error thresholds, and receive dialog, on-screen, or email notifications
      as calculated SSD health falls. Its status is also visible through a
      color-changing Dock or menu-bar icon. Compatibility should be checked because some
      drives do not expose useful S.M.A.R.T. lifetime attributes.
