history:
  adoption-history:
    - >
      Roblox grew into a large, community-driven platform containing millions of
      user-created experiences. Roblox says millions of users visit daily to play,
      connect, and collaborate.
  package-nerd-significance:
    - >
      The Homebrew cask provides a convenient macOS installation path for a proprietary,
      automatically updated game client whose upstream distribution otherwise comes from
      Roblox's CDN.
  project-history:
    - >
      Roblox launched approximately twenty years before the company's 2026
      retrospective, built around the proposition that users could make the games. It
      subsequently developed into an immersive gaming and creation platform centered on
      community-built experiences.
  related-projects:
    - >
      Roblox Studio is the companion creation environment used to build, test, and
      publish Roblox experiences.
  sources:
    - https://about.roblox.com/en-au/what-is-roblox
    - https://about.roblox.com/newsroom/2026/07/build-without-limits-on-roblox
    - source_facts.description
    - source_facts.source-archive
  summary:
    - >
      Roblox is the player-facing client for Roblox's online platform of
      community-created multiplayer experiences.
  timeline:
    - 'Circa 2006: Roblox launched with an emphasis on user-created games.'
    - >
      2026: Roblox described the platform as serving millions of daily users across
      millions of experiences.
  usage:
    - >
      Users install the client to discover and play interactive experiences, socialize
      through supported communication features, and use a persistent customizable
      avatar. The service is free to join and play, with optional purchases using Robux.
