history:
  adoption-history:
    - >
      ExcelCompare found a practical niche among developers who need spreadsheet diffs
      in shells, scripts, and version-control workflows. The README explicitly documents
      macOS installation via Homebrew and notes packaged shell and batch scripts.
    - >
      The project has remained recognizable enough for Homebrew packaging and GitHub
      issue-based maintenance, even though the core use case is narrow.
  package-nerd-significance:
    - >
      ExcelCompare packages a messy office-document problem into a scriptable Unix-style
      CLI with deterministic exit codes. That makes it useful in CI and review workflows
      where binary spreadsheet files otherwise resist normal diff tools.
  project-history:
    - >
      The GitHub repository was created on 2012-06-30, and release 0.3 was published on
      2013-12-13. The README describes it as a CLI for diffing Excel and ODS workbooks,
      built on Apache POI and OdfToolkit.
  related-projects:
    - >
      The README cites Apache POI for Excel parsing and OdfToolkit for OpenDocument
      spreadsheet parsing.
  sources:
    - https://github.com/na-ka-na/ExcelCompare
    - https://raw.githubusercontent.com/na-ka-na/ExcelCompare/master/README.md
    - https://api.github.com/repos/na-ka-na/ExcelCompare
    - https://api.github.com/repos/na-ka-na/ExcelCompare/releases?per_page=100
  summary:
    - >
      ExcelCompare is a Java command-line tool and API-oriented project for diffing
      Excel and OpenDocument spreadsheets.
  timeline:
    - '2012: GitHub repository created.'
    - '2013: Release 0.3 published.'
    - >
      Later README versions: Homebrew installation, ODS support, ignore rules, and
      unified-diff output documented.
  usage:
    - >
      The excel_cmp command compares two workbook files and exits 0 when workbooks match
      or 1 when they differ. It reports differing and extra cells, supports xls, xlsx,
      xlsm, and ods files, and can ignore sheets, rows, columns, or cell ranges
      independently for each input.
    - >
      The README also documents unified-diff output and using /dev/null or Windows NUL
      as an empty file, which makes the tool suitable for git diff-style workflows over
      spreadsheets.
