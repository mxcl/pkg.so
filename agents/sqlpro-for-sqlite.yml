history:
  adoption-history:
    - >
      Distributed as a native macOS application and packaged for Homebrew users as the
      sqlpro-for-sqlite cask.
  package-nerd-significance:
    - >
      It gives Mac-focused database users a native graphical alternative to command-line
      sqlite3 and cross-platform database IDEs.
  project-history:
    - >
      SQLPro for SQLite was created as a dedicated macOS interface for SQLite databases,
      emphasizing native platform integration and focused database editing.
  related-projects:
    - >
      SQLPro Studio is the same developer's multi-database product; SQLite itself
      supplies the embedded database format the application manages.
  sources:
    - 'Official product page: https://www.sqlitepro.com/'
    - source_facts.applications
    - source_facts.package-manager.brew-cask
  summary:
    - SQLPro for SQLite is a commercial native macOS SQLite editor and database manager.
  timeline:
    - 'Current product: Available as a direct-download macOS application and Homebrew cask.'
  usage:
    - >
      Users open SQLite database files, inspect and modify tables, keys and triggers,
      run custom SQL with autocomplete, filter data inline, save favorite queries,
      revisit query history, and view multiple result sets.
