history:
  adoption-history:
    - >
      Sharepod was an early solution for copying media back from Apple portable devices,
      including recovery when a computer-side music library was lost. Macroplant's
      acquisition brought it into a portfolio of utilities specializing in Apple-device
      data transfer.
  package-nerd-significance:
    - >
      Sharepod illustrates a long-lived class of proprietary utilities built around gaps
      in a vendor-managed device ecosystem. Its value historically came from enabling
      reverse transfer and recovery workflows that iTunes did not make straightforward.
  project-history:
    - >
      Sharepod launched in 2005 and was among the early applications able to copy music
      from an iPod, and later an iPhone or iPad, back to a computer and into iTunes.
    - >
      Macroplant, the developer of iExplorer, acquired Sharepod on March 20, 2013.
      Macroplant subsequently released Sharepod 4 for macOS and Windows.
  related-projects:
    - >
      iExplorer is Macroplant's broader utility for accessing and transferring content
      from Apple mobile devices.
    - Sharepod's workflow historically depended on Apple's iTunes device interface.
  sources:
    - https://www.getsharepod.com/
    - https://www.getsharepod.com/about
    - https://www.getsharepod.com/help
    - https://www.getsharepod.com/help/how-to-transfer-music-from-iphone
  summary:
    - >
      Sharepod is a proprietary Macroplant application for transferring music,
      playlists, videos, and other media from an iPhone, iPad, or iPod to a computer or
      iTunes.
  timeline:
    - '2005: Sharepod launched as an Apple-device music-transfer utility.'
    - '2013: Macroplant acquired Sharepod on March 20.'
    - '2013: Macroplant introduced Sharepod 4 for macOS and Windows.'
  usage:
    - >
      Connect an iPhone, iPad, or iPod by USB, allow Sharepod to scan its media library,
      and transfer selected tracks, playlists, or the full collection into iTunes or a
      local folder. Its automatic-transfer workflow avoids recopying tracks already
      present in iTunes.
