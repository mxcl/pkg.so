history:
  adoption-history:
    - >
      Doubao expanded across web, mobile app, PC client, browser-extension, and
      integrated-device surfaces. ByteDance's Seed organization identifies Doubao among
      the consumer products supported by its model family, while Doubao's account terms
      document a shared account system across its application, PC, web, and plugin
      variants.
  package-nerd-significance:
    - >
      The macOS cask represents a proprietary, service-backed AI assistant rather than a
      self-contained local model. It illustrates the growing package-manager category of
      desktop AI clients whose value comes from account-backed cloud models plus
      operating-system integration.
  project-history:
    - >
      Doubao is a generative-AI product operated by Beijing Chuntian Zhiyun Technology
      Co., Ltd. and affiliates. Official materials describe AI conversation as its core
      service and show its progression into a multi-surface assistant spanning web,
      mobile, desktop, browser, and API or SDK integrations.
  related-projects:
    - ByteDance Seed develops model technology used by consumer products including Doubao.
    - >
      The Doubao desktop client includes an AI browser and contextual tools for
      documents, screenshots, selected text, search, and translation.
  sources:
    - https://seed.bytedance.com/en/blog/seed-2-0-official-launch
    - https://www.doubao.com/download/desktop
    - https://www.doubao.com/legal/feature_intro
    - https://www.doubao.com/legal/terms
  summary:
    - >
      Doubao is a ByteDance-affiliated, account-backed AI assistant centered on
      conversational generation and available through web, mobile, and desktop clients.
  timeline:
    - >
      2026: Official terms documented Doubao across app, PC, web, plugin, SDK, and API
      delivery surfaces.
    - >
      2026: ByteDance Seed described its model series as supporting Doubao and other
      large-scale consumer products.
  usage:
    - >
      Users ask questions, draft or transform content, search, translate, converse by
      voice, and create customized agents. The desktop client adds screenshot questions,
      selected-text actions, document context, and an AI-enabled browser; official
      materials caution that generated answers can be inaccurate.
