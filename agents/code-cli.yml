id: brew:code-cli
display-name: Visual Studio Code CLI
repo: null
docs:
  - https://code.visualstudio.com/docs/configure/settings
  - https://code.visualstudio.com/docs/editor/command-line
config-file-location:
  linux:
    - ~/.config/Code/User/settings.json
    - .vscode/settings.json
  macos:
    - ~/Library/Application Support/Code/User/settings.json
    - .vscode/settings.json
  windows:
    - '%APPDATA%\Code\User\settings.json'
    - .vscode\settings.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Microsoft's 1.0 announcement reported 2 million installs and more than 500,000
      monthly active developers by April 2016. The CLI followed VS Code's adoption
      because `code .` became the normal bridge between shell workflows and the editor.
      The input also records package-manager distribution for the CLI through Homebrew,
      Nix, and pacman.
  package-nerd-significance:
    - >
      For package-manager users, `code-cli` matters because it splits the terminal
      command from the desktop app story. A working `code` executable is what lets
      editors participate in Unix-style workflows: scripts can open files, shells can
      jump into projects, and remote machines can expose VS Code access without starting
      from a GUI installer.
  project-history:
    - >
      VS Code was announced in 2015 as Microsoft's cross-platform editor. Later that
      year the November 2015 Beta release made the Code OSS project open source and
      added extension support. The `code` command became part of the product's developer
      workflow: the official CLI docs describe it as built in and document editor
      launch, file navigation, extension management, chat, diagnostics, and tunneling.
  related-projects:
    - >
      Related projects and surfaces include the microsoft/vscode Code OSS repository,
      the VS Code desktop product, VS Code Insiders, Remote Tunnels, the extension
      marketplace, and downstream open-source builds such as Code OSS packages.
  sources:
    - https://code.visualstudio.com/docs/configure/command-line
    - https://code.visualstudio.com/docs/configure/settings
    - https://code.visualstudio.com/blogs/2016/04/14/vscode-1.0
    - https://code.visualstudio.com/updates/vNovember
    - https://github.com/microsoft/vscode
  summary:
    - >
      The Visual Studio Code CLI is the command-line surface of VS Code, exposed as the
      `code` command. It lets users launch the editor, open files and folders, manage
      extensions, inspect status, and create remote tunnels from a terminal.
  timeline:
    - '2015: Visual Studio Code announced at Build.'
    - '2015: November Beta made VS Code open source and added extensions.'
    - >
      2016: Visual Studio Code 1.0 released with reported 2 million installs and 500,000
      monthly active developers.
    - >
      2026: Official CLI docs cover built-in `code` command workflows, chat subcommands,
      and remote tunnels.
  usage:
    - >
      Common usage includes `code .` to open the current directory, file arguments to
      open or create files, `--install-extension` and `--list-extensions` for extension
      workflows, `--user-data-dir` for isolated instances, and `code tunnel` for remote
      tunnel setup.
related-packages:
  - id: cask:vscodium
    reason: >
      VSCodium is a community-built, freely licensed distribution of the same VS Code
      codebase and is the strongest alternative when users want to avoid Microsoft's
      branding, telemetry defaults, and product licensing.
    rel: alternative
    sources:
      - https://github.com/VSCodium/vscodium
      - https://github.com/microsoft/vscode
