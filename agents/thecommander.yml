history:
  adoption-history:
    - >
      TheCommander is available as a free macOS download and through a Homebrew cask.
      Its intended audience is users accustomed to keyboard-driven orthodox file
      managers and two-panel workflows.
  package-nerd-significance:
    - >
      The application brings the Total Commander style of dual-panel file management to
      modern macOS while integrating Unix-adjacent tools such as an embedded terminal,
      checksums, archives, remote protocols, and directory synchronization.
  project-history:
    - >
      Norbert Gutbrod developed TheCommander as a German-and-English dual-panel file
      manager for macOS. It combines conventional file operations with remote access,
      archive browsing, search, comparison, synchronization, an integrated terminal, and
      extensive keyboard control.
  related-projects:
    - >
      TheCommander is explicitly inspired by Total Commander. Its settings can import
      configuration from ForkLift, another macOS file manager.
  sources:
    - 'Input package record: source_facts.version and source_facts.package-manager'
    - 'Official product and documentation page: https://die-gutbrods.de/thecommander/'
  summary:
    - >
      TheCommander is a free, keyboard-oriented dual-panel file manager for macOS with
      remote-file, archive, terminal, comparison, and synchronization features.
  timeline:
    - '2026: The supplied Homebrew cask record identifies version 1.9.0.'
    - '2026: The official site documents support for macOS 14 and newer.'
  usage:
    - >
      Users operate two independent file panels to copy, move, rename, compare, and
      synchronize files. The app also connects to SFTP, FTP/FTPS, and SMB servers,
      browses common archive formats, and runs commands in an embedded terminal.
