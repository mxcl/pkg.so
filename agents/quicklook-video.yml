history:
  adoption-history:
    - >
      The project has been packaged as a Homebrew cask and documented that installation
      route in its official guide. It serves Mac users who keep media in containers and
      codecs that Finder, Quick Look, Spotlight, or AVFoundation do not handle natively.
  package-nerd-significance:
    - >
      QuickLook Video fills a long-standing gap in the macOS desktop by making formats
      such as Matroska, WebM, AVI, Windows Media, Ogg, Flash Video, and RealMedia behave
      more like native media in Finder. It combines codec libraries with macOS extension
      points rather than requiring a separate media browser.
  project-history:
    - >
      Jonathan Harris has developed QuickLook Video since 2014. Earlier releases
      supplied traditional Quick Look and Spotlight integration. Version 3 adopted
      Apple's Media Extensions and AVFoundation for non-native formats and codecs while
      retaining Spotlight metadata support.
  related-projects:
    - FFmpeg and dav1d are included as media-processing components.
    - Perian previously extended the older QuickTime framework for a similar class of formats.
    - >
      VLC and IINA are complementary full media players recommended when interactive
      playback features exceed Quick Look's scope.
  sources:
    - 'Official README: https://github.com/Marginal/QuickLookVideo#readme'
    - >
      Official getting-started guide:
      https://github.com/Marginal/QuickLookVideo/wiki/Getting-Started
    - 'Official releases: https://github.com/Marginal/QuickLookVideo/releases'
  summary:
    - >
      QuickLook Video extends macOS Finder, Quick Look, Spotlight, and AVFoundation with
      thumbnails, previews, metadata, and codec support for many non-native media
      formats.
  timeline:
    - "2014: The project's documented copyright period begins."
    - >
      2017: The official wiki documented broad Finder preview and metadata support for
      non-native video formats.
    - >
      Version 3: The project moved from traditional Quick Look extensions to Media
      Extensions and AVFoundation integration.
  usage:
    - >
      After installation and one launch, Finder automatically generates supported
      thumbnails and previews; the app does not need to remain open. Users can press
      Space for Quick Look, inspect metadata in Get Info, refresh thumbnail caches, and
      manage embedded cover art for supported containers.
