history:
  adoption-history:
    - >
      The official installation instructions support both Homebrew Cask and MacPorts,
      alongside manual installation of the Core Audio driver.
    - >
      Later releases added notarization for macOS Catalina, a universal Intel/Apple
      Silicon build, and compatibility work for macOS Sonoma.
  package-nerd-significance:
    - >
      The project is a compact example of a package-manager-delivered macOS system
      extension: installation places a driver in the system-wide Core Audio HAL plug-in
      directory rather than merely copying an application bundle.
    - >
      It solves a distinctly macOS power-user problem by restoring system volume
      controls for external audio interfaces that do not expose compatible controls
      themselves.
  project-history:
    - >
      Proxy Audio Device was developed as a macOS Core Audio HAL virtual driver paired
      with a settings application. It forwards audio to a selected physical output and
      exposes controls that macOS can operate.
    - >
      Its release history records practical platform maintenance, including
      notarization, Apple Silicon support, sleep-related activation modes,
      audio-stability fixes, and Sonoma compatibility.
  related-projects:
    - >
      The package contains both the Proxy Audio Device driver and the Proxy Audio Device
      Settings application; it integrates with macOS Core Audio and a user-selected
      physical audio interface.
  sources:
    - https://github.com/briankendall/proxy-audio-device#readme
    - https://github.com/briankendall/proxy-audio-device/releases
  summary:
    - >
      Proxy Audio Device is an open-source virtual audio driver for macOS that sends
      sound to another output device while allowing macOS system volume and mute
      controls to manage that output.
  timeline:
    - 'v1.0.4: Driver and settings application were notarized for macOS Catalina.'
    - 'v1.0.6: A universal Intel and Apple Silicon build was released.'
    - 'v1.0.7: Compatibility with macOS Sonoma was added.'
    - >
      v1.1.0 beta 1: Added an availability-hiding option and an attempted fix for
      long-running audio cutouts.
  usage:
    - >
      After installation, users open Proxy Audio Device Settings to select the proxied
      output, choose the virtual device name and buffer size, and configure when the
      device should be active.
    - >
      The virtual driver is then selected as the Mac’s audio output, allowing menu-bar
      or keyboard volume controls to affect the external interface. Very small buffers
      can produce pops, distortion, or dropouts.
