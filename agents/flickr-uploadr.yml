history:
  adoption-history:
    - >
      Flickr released Uploadr clients for both Mac and Windows and positioned them as a
      way to back up large desktop photo collections. The service later made the desktop
      Uploadr exclusive to Flickr Pro subscribers.
  package-nerd-significance:
    - >
      Flickr Uploadr represents the class of desktop synchronization utilities that
      package managers preserve even when the core service is web-based. It is useful
      for reproducibly installing a background-oriented photo backup client instead of
      relying only on a browser uploader.
  project-history:
    - >
      Flickr has used the Uploadr name for several generations of upload software. An
      official 2008 release thread documents the 3.1 desktop line, including video
      support, improved EXIF handling, and cross-platform interface changes.
    - >
      In 2015 Flickr introduced a newer Mac and Windows Uploadr designed for automatic
      backup from computers, external drives, iPhoto, and other selected folders. Later
      updates added re-upload handling while retaining duplicate detection.
  related-projects:
    - >
      Flickr also provides its web uploader and mobile applications as alternative
      upload paths.
  sources:
    - https://flickr.com/features/apps/
    - https://www.flickr.com/help/forum/en-us/72157651969222007/
    - https://www.flickr.com/help/forum/en-us/72157652763269968/
    - https://www.flickr.com/help/forum/en-us/87503/
  summary:
    - >
      Flickr Uploadr is Flickr's desktop photo-upload and backup client for
      automatically copying selected photo collections into a Flickr account.
  timeline:
    - '2008: Flickr released the 3.1 generation of its desktop Uploadr.'
    - '2015: Flickr introduced a new automatic Uploadr for Mac and Windows.'
    - >
      2015: The Mac client added an explicit re-upload operation while continuing to
      de-duplicate uploads.
    - 'Later service era: Desktop Uploadr became a Flickr Pro benefit.'
  usage:
    - >
      Users select folders, drives, or supported photo libraries for monitoring, after
      which Uploadr scans and uploads eligible photographs to Flickr.
    - >
      The client de-duplicates previously seen photographs. The Mac re-upload operation
      was introduced for restoring Flickr copies of photographs that had been deleted
      from the service.
