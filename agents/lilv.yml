history:
  adoption-history:
    - >
      Lilv's adoption follows LV2 adoption in Linux and cross-platform audio software.
      Because LV2 represents plugins as bundles with RDF/Turtle metadata, hosts need
      reliable discovery, querying, instantiation, UI, and state handling; Lilv became
      the common package that distributions could provide for that job.
  package-nerd-significance:
    - >
      Lilv matters to package maintainers because it is a dependency hinge in the Linux
      audio stack: a small C library that can determine whether LV2 hosts and plugins
      discover each other correctly across filesystem layouts, plugin bundles, and
      platform-specific search paths.
  project-history:
    - >
      Lilv sits in the Drobilla/LV2 family of small C libraries that support the LV2
      plugin ecosystem. Its documentation describes it as the standard implementation
      used by nearly all LV2 hosts and as a portable API over the details of the LV2
      specification on POSIX, macOS, and Windows.
    - >
      The project was previously associated with SLV2 in distribution descriptions, then
      settled into the Lilv name as the LV2 host library. Public tags include early 0.x
      releases and later 0.24 and 0.28 series releases, reflecting a long-lived
      support-library role rather than a flashy application release cycle.
  related-projects:
    - >
      Lilv is related to LV2 itself, Suil for LV2 plugin UIs, Sratom for LV2 atoms, Serd
      and Sord for RDF handling, and Jalv as a simple LV2 host. It also sits
      historically near LADSPA and DSSI, older Linux audio plugin interfaces that LV2
      aimed to supersede.
  sources:
    - https://drobilla.net/2023/10/22/lilv-0-24-22.html
    - https://drobilla.net/docs/lilv/
    - https://drobilla.net/software/lilv.html
    - https://gitlab.com/lv2/lilv
    - https://gitlab.com/lv2/lilv/-/tags/v0.4.0
    - https://lv2plug.in/
  summary:
    - >
      Lilv is David Robillard's C library for discovering, inspecting, loading, running,
      and saving state for LV2 audio plugins. It is infrastructure rather than an
      end-user audio app: hosts use Lilv so they do not have to implement the LV2
      metadata and loading model themselves.
  timeline:
    - >
      2015-11-13: The GitLab tag page records the v0.4.0 Lilv tag after project-specific
      tag migration.
    - >
      2020: LV2 1.18.x release notes described the standard as a plugin system with C
      APIs and self-contained bundles.
    - '2023-10-22: Lilv 0.24.22 was announced on drobilla.net.'
    - >
      2026: Lilv documentation described it as the standard implementation used by
      nearly all LV2 hosts.
  usage:
    - >
      Developers link against Lilv from LV2 hosts, plugin test tools, and command-line
      utilities such as lv2ls, lv2info, lv2apply, and lv2bench. End users usually
      encounter it indirectly when a DAW, plugin host, or audio workstation package
      pulls it in.
related-packages:
  - id: brew:lv2
    reason: >
      Install LV2 alongside Lilv when developing hosts or plugins, because LV2 supplies
      the open plugin specification and headers that Lilv implements for host-side
      discovery and loading.
    rel: adjacent_workflow
    sources:
      - https://lv2plug.in/
      - https://lv2plug.in/pages/developing.html
      - https://drobilla.net/docs/lilv/
