history:
  adoption-history:
    - >
      Evidence for broad ecosystem adoption is thin, but the Homebrew package and GitHub
      repository show enough activity for developers who want a lightweight OpenGL text
      library without pulling in a full UI or game engine stack. Its appeal is strongest
      for demos, visualization programs, and small graphics tools that need text
      overlays.
  package-nerd-significance:
    - >
      libdrawtext is a classic small-library package: narrow scope, optional
      dependencies, C ABI, and a helper binary. For package maintainers, the interesting
      part is keeping a minimal OpenGL-era text utility available without dragging in
      larger graphics frameworks.
  project-history:
    - >
      The README describes libdrawtext as an OpenGL text-rendering helper that can also
      render into plain RGBA pixel buffers starting with version 0.3. Its copyright
      range begins in 2011, and the public tags show release_0.1 in August 2012,
      followed by release_0.2 and 0.2.1 in April 2014, release_0.3 in March 2016,
      release_0.4 in July 2016, v0.5 in February 2019, and v0.6 in February 2023.
    - >
      The 0.6 release notes are maintenance-oriented: glyph metric changes, GL backend
      fixes, Android/OpenGL ES compatibility adjustments, GCC 10 compatibility, and
      build fixes. That pattern fits a compact library maintained for embedding rather
      than a broad end-user application.
  related-projects:
    - >
      The README names FreeType as the glyph-rasterization dependency and OpenGL as the
      main rendering backend. The included `font2glyphmap` utility and example programs
      are the closest related project surfaces inside the repository.
  sources:
    - https://github.com/jtsiomb/libdrawtext
    - https://github.com/jtsiomb/libdrawtext/releases
    - https://github.com/jtsiomb/libdrawtext/tags
  summary:
    - >
      libdrawtext is John Tsiombikas's small C library for fast anti-aliased text
      rendering in OpenGL, with FreeType-backed glyph rasterization and an included
      `font2glyphmap` tool for pre-rendered glyph maps.
  timeline:
    - '2011: Copyright range begins for libdrawtext.'
    - '2012: release_0.1 tag published.'
    - '2014: release_0.2 and release_0.2.1 tags published.'
    - '2016: release_0.3 added RGBA pixel-buffer rendering; release_0.4 followed.'
    - '2019: v0.5 release published.'
    - '2023: v0.6 release published with GL, glyph metric, Android, GCC, and build fixes.'
  usage:
    - >
      The README points users to example programs and the heavily commented `drawtext.h`
      header. It supports Unix and MinGW builds through `./configure`, `make`, and `make
      install`, with FreeType and OpenGL both described as optional depending on whether
      glyphmaps or pixel-buffer rendering are used.
related-packages:
  - id: brew:freetype
    reason: >
      Pair FreeType with libdrawtext when text must be rasterized from font files at
      runtime; libdrawtext's official README identifies FreeType as its
      glyph-rasterization backend.
    rel: adjacent_workflow
    sources:
      - https://github.com/jtsiomb/libdrawtext#readme
      - https://freetype.org/freetype2/docs/index.html
