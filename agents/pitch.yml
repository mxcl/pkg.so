history:
  adoption-history:
    - >
      Pitch's official about page reports that more than four million teams use the
      service. The product has developed around remote, cross-functional collaboration
      and presentations used for sales, marketing, meetings, and other team
      communication.
  package-nerd-significance:
    - >
      For package-manager users, Pitch is a proprietary cloud-first presentation tool
      whose cask provides a convenient native desktop client. It represents the modern
      class of collaborative web applications that also ship installable macOS and
      Windows shells.
  project-history:
    - >
      Pitch says it was founded in Berlin in 2018 by eight friends who wanted to improve
      both presentations and the process of creating them. The product evolved into a
      collaborative presentation workspace combining branded content, team editing,
      sharing, deal-room workflows, and AI-assisted creation.
  related-projects:
    - >
      Pitch officially positions itself alongside or in comparison with presentation
      products such as Microsoft PowerPoint, Apple Keynote, Google Slides, and Figma
      Slides.
  sources:
    - 'Official Help Center: https://help.pitch.com/en/'
    - 'Official about page: https://pitch.com/about'
    - >
      Official desktop download guide:
      https://help.pitch.com/en/articles/3678495-download-the-pitch-desktop-app
  summary:
    - >
      Pitch is collaborative presentation software from Pitch Software GmbH. It combines
      deck creation, brand controls, teamwork, sharing, and AI-assisted presentation
      workflows across web and native clients.
  timeline:
    - '2018: Eight founders started Pitch in Berlin.'
    - >
      2025: Pitch's official Help Center documented native desktop installation for
      macOS and Windows.
    - '2026: Pitch reported more than four million teams using the product.'
  usage:
    - >
      Teams use Pitch to collaboratively create branded slide decks, gather feedback,
      present material, and share presentations or deal-room content. The desktop
      package installs the native Pitch application on macOS.
