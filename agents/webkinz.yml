history:
  adoption-history:
    - >
      Webkinz linked physical plush toys to online accounts through unique adoption
      codes. The official history describes a major popularity surge around 2007 and
      millions of accounts created after launch.
    - >
      Ganz introduced Deluxe Membership in 2009 as an alternative subscription path and
      changed the service to a freemium model in 2012, allowing players to retain
      limited access without an active paid membership.
    - >
      When a newer Webkinz game appeared in 2020, Ganz renamed the original service
      Webkinz Classic and committed to continuing it. The desktop application preserved
      access as browser support for Flash ended.
  package-nerd-significance:
    - >
      Webkinz is an early and influential toy-to-life service whose physical codes,
      persistent online inventory, and subscription transitions predate many later games
      built around linked merchandise.
    - >
      For package collectors, the Homebrew cask represents the desktop continuation of a
      game that began as a browser experience and had to outlive the retirement of its
      original browser runtime.
  project-history:
    - >
      Ganz launched Webkinz on April 29, 2005 as an online world connected to Webkinz
      plush pets. Registering a pet's adoption code originally opened a year of access.
    - >
      The service expanded its business model through Deluxe Membership in 2009 and free
      accounts in 2012. It later moved from the browser into a full desktop application.
    - >
      In 2020 the original game became Webkinz Classic to distinguish it from the newer
      Webkinz game. Ganz stated that the two are separate games, though a login can be
      used to create an account in either.
  related-projects:
    - Webkinz Next is the newer, separate Webkinz game.
    - Webkinz Newz is Ganz's official news and support site for Webkinz products.
  sources:
    - https://webkinznewz.ganzworld.com/announcements/all-new-webkinz-faq/comment-page-24/
    - https://webkinznewz.ganzworld.com/announcements/help/
    - >
      https://webkinznewz.ganzworld.com/announcements/special-report-with-steve-webkinz-23/comment-page-4/
    - https://www.webkinz.com/
    - source_facts.package-manager
  summary:
    - >
      Webkinz Classic is Ganz's original toy-to-life virtual-pet world, now delivered as
      a desktop application rather than its original browser game.
  timeline:
    - '2005-04-29: Webkinz launched.'
    - '2007: The official retrospective identifies this period as the Webkinz craze.'
    - '2009: Ganz introduced Deluxe Membership.'
    - '2012: Webkinz adopted a freemium membership model.'
    - '2020: The original game was renamed Webkinz Classic as the newer Webkinz game launched.'
  usage:
    - >
      Players create or recover an account, adopt virtual pets, furnish rooms, play
      arcade and tournament games, complete activities, and earn KinzCash for in-game
      purchases.
    - >
      The desktop application provides the full Classic experience on Windows and macOS;
      the mobile application offers only a subset of Classic features.
