id: brew:bashate
display-name: bashate
repo: https://opendev.org/openstack/bashate
docs:
  - https://docs.openstack.org/bashate/latest
  - https://docs.openstack.org/bashate/latest/readme.html
  - https://docs.openstack.org/bashate/latest/user/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bashate's adoption is tied to OpenStack's large shell-script surface, especially
      DevStack and project automation. The batch input shows Homebrew and Nix packaging;
      in practice, the tool is most valuable to contributors and CI jobs enforcing
      OpenStack-adjacent shell style.
    - >
      The release notes and official tag list show a 0.x line followed by 1.0.0 and 2.x
      releases, enough history to treat it as a maintained OpenStack utility rather than
      a one-off script.
  package-nerd-significance:
    - >
      bashate is package-nerd significant because it shows shell scripts becoming
      first-class reviewed artifacts in a large infrastructure project. It is not a
      general-purpose shell parser revolution; it is the small enforcement tool that
      makes a project's Bash style reproducible across laptops and CI workers.
    - >
      It also captures an OpenStack packaging pattern: a narrow Python CLI published as
      a standalone package, documented by Sphinx, hosted in Opendev, and installed by
      package managers for repeatable developer workflows.
  project-history:
    - >
      The official README calls bashate a pep8 equivalent for Bash scripts and says it
      attempts to fill the same automated code-review role for Bash that pep8 did in
      many OpenStack projects. It also states that bashate started in the DevStack
      project and would continue to evolve over time.
    - >
      The OpenStack documentation and Opendev source identify it as an Apache-licensed
      OpenStack project with docs, source, bugs, release notes, and contribution pages.
      Its documented checks cover whitespace, indentation, line endings, line length,
      structure rules, `bash -n` syntax errors, and obsolete or unsafe syntax.
  related-projects:
    - >
      Related projects include DevStack, OpenStack's broader CI/review tooling,
      pycodestyle/pep8, ShellCheck, shfmt, and Bash itself. bashate's own README
      explicitly compares its role to pycodestyle.
  sources:
    - Official Opendev tag list shows 0.1.0 through 2.1.1 tags.
    - >
      Official README says bashate is a pep8 equivalent for Bash scripts, started in
      DevStack, and follows pycodestyle output format.
    - >
      Official docs list project documentation, source, bug tracker, release notes,
      contributing docs, and supported checks.
    - Official release notes page documents 0.5.x, 0.6.0, and 1.0.0 notes.
    - input.source_facts.package-manager lists Homebrew and Nix packaging.
  summary:
    - >
      bashate is OpenStack's style checker for Bash scripts. It is essentially a
      pycodestyle-style lint gate for shell code, built for projects where Bash scripts
      are part of the reviewed and tested codebase.
  timeline:
    - '2010s: bashate starts in the DevStack project, according to the official README.'
    - '2010s: 0.x release tags establish the early style-checker line.'
    - '2020: OpenStack release-notes build documents the 0.5.x, 0.6.0, and 1.0.0 release notes.'
    - '2020s: Official tag list reaches the 2.x release line.'
    - '2020s: Homebrew and Nix package the `bashate` CLI.'
  usage:
    - >
      Users run `bashate` against shell scripts to catch style and safety issues before
      review or CI. Its output intentionally follows the default pycodestyle output
      format, making it familiar in OpenStack's Python-heavy review culture.
    - >
      The documented checks include trailing whitespace, hard tabs, non-multiple-of-four
      indents, missing final newline, missing shebang or `.sh` suffix, long lines,
      malformed control structures, heredoc termination, function declaration style,
      `bash -n` syntax errors, deprecated `$[` arithmetic, risky `local` declarations,
      and `[[` recommendations for comparisons.
related-packages:
  - id: brew:shellcheck
    reason: >
      Choose ShellCheck when the primary goal is broad bug and portability analysis;
      bashate is focused on OpenStack-style Bash conventions.
    rel: alternative
    sources:
      - https://docs.openstack.org/bashate/latest/user/index.html
      - https://www.shellcheck.net/
tags:
  - bash
  - cli
  - linting
  - openstack
  - style-checker
