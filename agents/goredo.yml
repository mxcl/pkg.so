config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      goredo occupies the smaller redo ecosystem rather than the mainstream
      make/CMake/Ninja ecosystem. Its official install page nevertheless documents
      packaging across distribution channels including Arch AUR, FreeBSD ports,
      Homebrew, NetBSD packages, NixOS, Fedora RPM Sphere, and container images.
  package-nerd-significance:
    - >
      For package-manager users, goredo is interesting because it packages an
      intentionally small but opinionated alternative build model: shell-script rules,
      explicit dependencies, POSIX portability, BLAKE3-based change checks, and Make
      jobserver interoperation without adopting a large build framework.
  project-history:
    - >
      The project began as a rewrite of redo-c and then grew to include many features
      from apenwarr/redo, another influential implementation of Bernstein's unreleased
      redo idea. Its public NEWS file records an initial tarballed release at 0.10.0,
      then a 1.0.0 series that changed state-file storage and out-of-date detection, and
      a later 2.0.0 release that replaced recfile dependency storage with a smaller
      binary dependency format.
  related-projects:
    - Daniel J. Bernstein's redo design is the conceptual origin.
    - redo-c was the initial implementation goredo rewrote.
    - apenwarr/redo supplied many feature and behavior references.
    - redo-sh supplies tests referenced by the goredo documentation.
  sources:
    - http://www.goredo.stargrave.org/
    - http://www.goredo.stargrave.org/Features.html
    - http://www.goredo.stargrave.org/INSTALL.html
    - http://www.goredo.stargrave.org/NEWS.html
  summary:
    - >
      goredo is Sergey Matveev's Go implementation of Daniel J. Bernstein's redo
      build-system design, positioned by its own documentation as a make replacement for
      POSIX-like systems.
  timeline:
    - '0.10.0: Initial tarballed release'
    - '1.0.0: State storage changed for faster out-of-date detection'
    - '1.7.0: Added optional GNU Make and NetBSD bmake jobserver compatibility'
    - '2.0.0: Introduced binary dependency files and performance optimizations'
    - '2.9.2: Changed Go module namespace to go.stargrave.org'
  usage:
    - >
      Users write redo .do scripts and invoke the goredo-provided redo commands to
      rebuild targets recursively. The project emphasizes dependency tracking,
      checksum-based change detection, parallel builds, serialized logs, jobserver
      compatibility with GNU Make and NetBSD bmake, and diagnostic commands such as
      redo-affects, redo-cleanup, redo-dot, and redo-inode.
related-packages:
  - id: brew:redo
    reason: >
      Choose redo for Avery Pennarun's extensively documented Python implementation of
      the same Bernstein build model; choose goredo for a Go implementation with its own
      checksum, logging, and diagnostic features.
    rel: alternative
    sources:
      - https://www.goredo.stargrave.org/
      - https://redo.readthedocs.io/en/latest/
