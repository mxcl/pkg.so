history:
  adoption-history:
    - >
      Contemporary reviews highlighted EagleFiler's open library design, which kept
      archived material accessible as ordinary files rather than locking it inside an
      opaque service. It has remained a long-lived Mac-native choice for local document
      and mail archives, receiving continuous 1.x maintenance since 2006.
  package-nerd-significance:
    - >
      EagleFiler appeals to users who value local ownership, standard file formats,
      searchable archives, AppleScript automation, and data that remains accessible
      outside the application. Homebrew Cask makes the proprietary Mac application
      convenient to deploy alongside other workstation tools.
  project-history:
    - >
      C-Command Software introduced EagleFiler 1.0 in 2006 as a macOS
      information-management application. It developed around libraries containing
      files, archived email, web pages, and notes, with indexing, tagging, encryption,
      and automation layered over an open on-disk structure.
  related-projects:
    - SpamSieve
    - DropDMG
    - DEVONthink
    - Apple Mail
  sources:
    - https://c-command.com/eaglefiler/
    - https://c-command.com/eaglefiler/help/version-history
    - https://c-command.com/eaglefiler/manual
    - https://c-command.com/eaglefiler/press
  summary:
    - >
      EagleFiler is a macOS document organizer and mail archiver developed by C-Command
      Software.
  timeline:
    - '2006: EagleFiler 1.0 was released.'
    - >
      2008: EagleFiler 1.3 expanded capture, tagging, import, and encrypted-library
      capabilities.
    - '2006–present: The 1.x line has received sustained feature and compatibility updates.'
  usage:
    - >
      Users create one or more libraries at locations they choose, then import email,
      web pages, notes, PDFs, and other files for browsing, tagging, archiving, and
      indexed search.
    - >
      Libraries can be encrypted, automated with AppleScript, and managed as ordinary
      files in Finder-compatible storage.
