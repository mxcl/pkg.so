history:
  adoption-history:
    - >
      Official materials position WorkBuddy for both individual office work and
      connected organizational workflows. Desktop, web, and mobile editions are
      documented, while connectors and messaging integrations extend tasks into services
      such as GitHub, Google Drive, Gmail, Notion, Slack, and other collaboration
      platforms.
    - >
      Public adoption figures are not supplied in the official documentation, so no
      quantitative adoption claim is made.
  package-nerd-significance:
    - >
      WorkBuddy reflects the movement from chat-only assistants toward desktop agents
      that can manipulate local files, execute multi-step tasks, use reusable skills,
      and connect to external services through MCP-style integrations.
    - >
      For package users, its most consequential characteristic is its ability to operate
      on the local filesystem and run tools. The official permission documentation
      therefore distinguishes guarded default permissions from full access and
      recommends isolated, recoverable workspaces.
  project-history:
    - >
      Tencent presents WorkBuddy as a general-purpose agentic office workstation. Its
      official 2026 documentation covers desktop, web, and mobile delivery, multiple
      third-party language models, skills, connectors, task automation, and
      messaging-platform control.
    - >
      The product's model configuration moved toward a graphical workflow. Official
      documentation retains compatibility with custom models previously configured in
      `~/.codebuddy/models.json`.
  related-projects:
    - >
      Tencent CodeBuddy shares the `.codebuddy` custom-model configuration convention
      documented by WorkBuddy.
  sources:
    - >
      https://www.workbuddy.ai/docs/workbuddy/From-Beginner-to-Expert-Guide/Function-Description/Model
    - >
      https://www.workbuddy.ai/docs/workbuddy/From-Beginner-to-Expert-Guide/Function-Description/Permission-Modes
    - https://www.workbuddy.ai/docs/workbuddy/Overview
    - https://www.workbuddy.ai/docs/workbuddy/Quickstart
    - https://www.workbuddy.ai/document/privacy-policy
  summary:
    - >
      Tencent WorkBuddy is an agentic productivity application that plans and performs
      multi-step office and coding tasks from natural-language instructions. It can
      generate documents, spreadsheets, presentations, and reports, analyze data, work
      with authorized local files, and connect to external tools.
  timeline:
    - >
      2026: Official service and privacy documentation described WorkBuddy across
      desktop, web, and mobile platforms.
  usage:
    - >
      Users create tasks in natural language, optionally select a working directory and
      supporting files, choose a model, and review generated artifacts and filesystem
      changes in the results panel.
    - >
      The application supports concurrent tasks, custom models, reusable skills,
      connectors, and remote control through supported messaging platforms. An internet
      connection and a signed-in account are required for the documented model service.
    - >
      The documented legacy custom-model file can contain provider configuration and API
      credentials. Users should treat it as both configuration and credential-bearing
      data when that feature is used.
