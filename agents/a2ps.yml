id: brew:a2ps
display-name: GNU a2ps
repo: https://git.savannah.gnu.org/git/a2ps.git
docs:
  - https://www.gnu.org/software/a2ps/manual
  - https://www.gnu.org/software/a2ps
config-file-location:
  unix:
    - $A2PS_CONFIG
    - ~/.a2ps/a2psrc
    - ./.a2psrc
    - /usr/local/etc/a2ps.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      a2ps became a familiar Unix packaging staple because it filled the practical gap
      between plain text, source code, and printer-ready PostScript. The input package
      data lists it across Homebrew, Debian, Ubuntu, Fedora, Alpine, Arch, MacPorts,
      Nix, and openSUSE, which matches its long-lived role as a small command-line
      printing utility.
  package-nerd-significance:
    - >
      Package nerds care about a2ps because it is the kind of GNU utility that exposes
      decades of Unix printing assumptions: PostScript pipelines, libpaper defaults,
      printer wrappers, generated documentation, legacy encodings, and
      security-sensitive parsers all in one small package.
  project-history:
    - >
      The project became a GNU package for command-line printing workflows where
      PostScript was the common interchange format. Its README describes the tool as
      highly configurable while still aiming to let novice users perform complex
      PostScript manipulations.
    - >
      After long maintenance gaps, release 4.14 in 2007 moved the package to
      GPLv3-or-later and modernized the build. A new maintenance cycle began in 2022,
      leading to the 4.15 stable release in 2023 with Reuben Thomas as maintainer,
      updated autotools/gnulib infrastructure, libpaper integration, CUPS-oriented lpr
      wrapper support, and security fixes.
  related-projects:
    - >
      a2ps delegates work to tools such as Ghostscript, groff, dvips, gzip, psutils, and
      libpaper, making it part of the classic Unix document-conversion and printing
      pipeline.
  sources:
    - https://git.savannah.gnu.org/cgit/a2ps.git/plain/NEWS
    - https://git.savannah.gnu.org/cgit/a2ps.git/plain/README
    - https://savannah.gnu.org/projects/a2ps
    - source_facts.package-manager
  summary:
    - >
      GNU a2ps is an Any-to-PostScript filter and pretty-printer: it turns text and many
      source formats into PostScript, with page layout, headers, style sheets,
      delegations to other tools, and printer-oriented output.
  timeline:
    - >
      2007: GNU a2ps 4.14 ships as a maintenance release, moves to GPLv3-or-later, and
      updates build tooling.
    - >
      2022: Alpha releases restart active maintenance with a new maintainer and
      modernized build system.
    - >
      2023: GNU a2ps 4.15 ships as a stable release with CUPS-oriented printing support,
      libpaper integration, and security fixes.
    - '2025: GNU a2ps 4.15.8 ships with bug fixes and build/documentation updates.'
  usage:
    - >
      Users run a2ps to format files for printing or previewing, especially source files
      that benefit from syntax-aware pretty-printing. Related tools in the package, such
      as fixps, card, pdiff, lp2, ogonkify, and composeglyphs, reflect the broader
      PostScript-cleanup and print-preparation workflow around it.
related-packages:
  - id: brew:enscript
    reason: >
      Choose Enscript when you want syntax-highlighted text output in HTML or RTF as
      well as PostScript.
    rel: alternative
    sources:
      - https://www.gnu.org/software/a2ps/
      - https://www.gnu.org/software/enscript/
  - id: brew:psutils
    reason: >
      Rearrange a2ps output into booklets or multiple pages per sheet with PSUtils; a2ps
      also delegates PostScript layout to its psnup tool.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/a2ps/manual/html_node/Using-Delegations.html
      - https://github.com/rrthomas/psutils
