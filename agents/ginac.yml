history:
  adoption-history:
    - >
      GiNaC has significance in high-energy-physics and symbolic-computation tooling
      because it was written to support Feynman-integral work while remaining a reusable
      C++ library. Its official download page notes packages in Debian, SuSE, Fedora,
      and FreeBSD, and the Homebrew metadata adds another Unix-like packaging channel.
    - >
      The library depends on CLN for number types and benefits from CLN's
      arbitrary-precision integer and rational arithmetic. That relationship made GiNaC
      part of a small but durable stack for C++ programs needing exact algebra without
      embedding a full external CAS.
  package-nerd-significance:
    - >
      GiNaC matters to package maintainers because it combines a library ABI, a CLI
      shell, generated documentation, CLN dependency management, and distribution
      packaging across Unix-like systems. Its long release log also shows the
      maintenance burden of keeping symbolic C++ libraries buildable across compiler,
      standard-library, and platform changes.
  project-history:
    - >
      The project was developed as a replacement symbolic engine for xloops, which had
      previously depended on Maple. Its official site describes the design as a
      deliberate departure from traditional computer algebra systems: GiNaC accepts C++
      as the programming language and adds symbolic expression types, functions,
      matrices, series, polynomial operations, and output facilities.
    - >
      GiNaC reached 1.0.0 in November 2001 after a sequence of 0.x releases. The authors
      published an article introducing the framework in the Journal of Symbolic
      Computation era, and the tutorial continues to present it as an open framework for
      symbolic computation within C++.
    - >
      The project has had long maintenance across changing C++ standards and
      scientific-computing needs. The news log records major API and implementation
      shifts such as C++11 adoption in the 1.7 series, iterated-integral work in the 1.8
      series, and a primary repository move to Codeberg in February 2026.
  related-projects:
    - >
      The official site links GiNaC with xloops, Maple, CLN, pyGiNaC, and broader
      computer-algebra-system practice.
  sources:
    - https://www.ginac.de/
    - https://www.ginac.de/About.html
    - https://www.ginac.de/Download.html
    - https://www.ginac.de/News.html
    - https://www.ginac.de/csSC-0004015.pdf
    - https://www.ginac.de/tutorial/
  summary:
    - >
      GiNaC is a C++ symbolic-computation library whose name expands recursively to
      GiNaC is Not a CAS. It embeds algebraic manipulation into C++ programs instead of
      presenting a separate computer-algebra language.
  timeline:
    - '1999: 0.4.0 appeared in the public news log.'
    - '2001: 1.0.0 was released.'
    - >
      2002: The introductory GiNaC framework paper was published in the Journal of
      Symbolic Computation period.
    - '2016: 1.7.0 adopted C++11 features and removed older C++98-era machinery.'
    - '2020: 1.8.0 added numerical routines for iterated integrals and improved CMake support.'
    - '2026: The primary Git repository moved to Codeberg.'
  usage:
    - >
      Practitioners include GiNaC headers in C++ programs, construct symbolic
      expressions, and use library calls for differentiation, expansion, series,
      polynomial factorization, GCD, symbolic matrices, linear solving, and generated
      output. The ginsh executable gives package users an interactive shell for
      exploring expressions without writing a full C++ program.
related-packages:
  - id: brew:cln
    reason: >
      CLN is GiNaC's required arbitrary-precision numeric foundation, so install or
      package it alongside GiNaC when building the symbolic-computation library.
    rel: adjacent_workflow
    sources:
      - https://www.ginac.de/Download.html
      - https://www.ginac.de/CLN/
