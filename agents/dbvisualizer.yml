id: cask:dbvisualizer
display-name: DbVisualizer
repo: null
docs:
  - https://www.dbvis.com/docs/ug
  - https://support.dbvis.com/
config-file-location:
  unix:
    - ~/.dbvis
  windows:
    - '%USERPROFILE%\.dbvis'
credentials-file-location:
  macos:
    - ~/Library/DBeaverData/workspace6/General/.dbeaver/credentials-config.json
    - ~/Library/DBeaverData/secure/
history:
  adoption-history:
    - >
      DbVisualizer is distributed as a commercial desktop application with Free and Pro
      usage paths and is available across Windows, macOS, and Linux/Unix. Its
      long-running, versioned user-guide archive reflects sustained use among developers
      and database administrators working across heterogeneous databases.
  package-nerd-significance:
    - >
      DbVisualizer is useful in package catalogs because one installation provides a
      JDBC-based interface to many database systems. Its portable user-preferences
      directory, command-line launcher, workspace support, and separately managed JDBC
      drivers make it practical in mixed-database and reproducible workstation setups.
  project-history:
    - >
      DbVisualizer developed into a cross-platform, multi-database client centered on
      JDBC connectivity. Over successive releases it accumulated SQL editing, schema
      browsing, data-management, export, monitoring, and command-line capabilities while
      retaining a shared interface across database vendors.
    - >
      Newer releases introduced first-class workspaces while preserving compatibility
      with the older user-preferences-directory model and its -prefsdir command-line
      option.
  related-projects:
    - >
      DbVisualizer works with JDBC drivers and many database products rather than being
      tied to one database engine. Related tool categories include SQL clients, database
      administration tools, JDBC driver managers, and schema browsers.
  sources:
    - >
      Official support article on settings storage:
      https://support.dbvis.com/support/solutions/articles/1000196578-use-alternative-folder-for-dbvisualizer-user-settings
    - 'Official user guide: https://www.dbvis.com/docs/ug/'
    - 'Official workspace guide: https://www.dbvis.com/docs/25.3/working-with-workspaces/'
  summary:
    - >
      DbVisualizer is a cross-platform graphical database client and administration tool
      designed to provide one interface across many database systems.
  timeline:
    - >
      Long-running release series: DbVisualizer maintains version-specific official user
      guides for numerous historical releases.
    - >
      Version 10.0: The application supported overriding its preferences directory
      through the GUI, VM options, and -prefsdir.
    - >
      Version 25.3: Official documentation describes first-class workspaces while
      retaining -prefsdir compatibility.
  usage:
    - >
      Users register or load JDBC drivers, define database connections, browse database
      objects, edit and execute SQL, inspect results, and export data. Pro editions also
      provide a command-line interface for scripted SQL execution.
    - >
      Settings, connection definitions, drivers, certificates, and related workspace
      state are kept in the preferences directory or a user-selected workspace.
