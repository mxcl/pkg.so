id: brew:dnstwist
display-name: dnstwist
repo: https://github.com/elceef/dnstwist
docs:
  - https://github.com/elceef/dnstwist#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dnstwist has unusually strong adoption for a command-line security tool. The
      README documents installation through pip, Git, Debian/Ubuntu/Kali, Fedora, AUR,
      Homebrew, and Docker, and says the scanner is used by SOC and incident-response
      teams, independent analysts, and many named security products and services.
  package-nerd-significance:
    - >
      dnstwist is package-nerd significant because it packages a security research
      workflow into a normal installable CLI while still offering optional heavyweight
      capabilities such as GeoIP databases, headless Chromium screenshots, fuzzy hashing
      libraries, Docker images, and a web scanner.
  project-history:
    - >
      The GitHub repository was created in June 2015, and the first GitHub release,
      v1.00, was published in October 2015. The official README presents the tool as a
      way to find lookalike domains that adversaries can use for typosquatting,
      phishing, fraud, and brand impersonation.
    - >
      Over time dnstwist grew beyond simple domain permutation. The README documents
      Unicode and homoglyph handling, dictionary and TLD permutation files,
      multithreaded lookups, fuzzy HTML similarity with ssdeep or TLSH, screenshot
      similarity with pHash, rogue MX detection, GeoIP, CSV/JSON export, a Python API,
      Docker images, and the dnstwist.it web scanner.
  related-projects:
    - >
      The README names ssdeep, TLSH, pHash, GeoIP2, and Chromium as optional analysis
      components. It also lists integrations or downstream use in Splunk, SpiderFoot,
      Maltego, Intel Owl, CISA Crossfeed, Rapid7 InsightConnect SOAR, Palo Alto Cortex
      XSOAR, Fortinet FortiSOAR, and other security platforms.
  sources:
    - https://github.com/elceef/dnstwist/blob/master/docs/README.md
    - https://dnstwist.it/
    - https://api.github.com/repos/elceef/dnstwist
    - https://api.github.com/repos/elceef/dnstwist/releases?per_page=100
    - https://formulae.brew.sh/formula/dnstwist
  summary:
    - >
      dnstwist is a domain permutation and phishing-domain scanner used for
      typosquatting, homograph, brand impersonation, and targeted threat-intelligence
      workflows. It turns the old manual question of 'what lookalike domains exist?'
      into a repeatable CLI, API, and web workflow.
  timeline:
    - '2015: GitHub repository created.'
    - '2015: First GitHub release, v1.00, published.'
    - '2025: Release 20250130 published.'
    - '2025: GitHub metadata shows continued repository activity.'
    - '2026: Homebrew still carries dnstwist as a packaged security CLI.'
  usage:
    - >
      Users run dnstwist against a domain, often with --registered to reduce the output
      to live domains, then inspect DNS, MX, GeoIP, web similarity, screenshot
      similarity, or exported CSV/JSON results. The tool can also be imported from
      Python through dnstwist.run for automated monitoring or enrichment pipelines.
