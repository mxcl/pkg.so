  - https://lifelines.github.io/lifelines
config-file-location:
  unix:
    - ~/.linesrc
    - ./.linesrc
  windows:
    - lines.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      LifeLines built a long-running user community around the LINES-L mailing list,
      which the project site says was established in 1992. Package managers kept it
      available for users who preferred a scriptable terminal genealogy database instead
      of GUI-first family-tree programs.
  package-nerd-significance:
    - >
      LifeLines is package-nerd interesting because it preserves a pre-web,
      terminal-first genealogy workflow in modern package systems. It is also a reminder
      that package managers carry cultural software, not only developer tools and
      servers.
  project-history:
    - >
      LifeLines grew from early-1990s Unix genealogy software into a
      community-maintained open-source project. The README credits Thomas T. Wetmore IV
      as the original author and says the open-source community maintains it.
    - >
      The project site emphasizes GEDCOM storage and scripting. Its report scripts
      generate ancestor and descendant reports, LaTeX books, PostScript charts, and
      other genealogy outputs.
    - >
      The NEWS file records later maintenance work: the 3.1.0 stable line moved from
      SourceForge to GitHub and improved build infrastructure, while the 3.2.0 line
      targeted a full 64-bit port and Mac OS X support.
  related-projects:
    - >
      Related projects and communities include GEDCOM genealogy data, RootsWeb, LINES-L,
      report-script collections, SourceForge-era LifeLines hosting, and packaged Unix
      genealogy tools.
  sources:
    - https://api.github.com/repos/lifelines/lifelines
    - https://formulae.brew.sh/formula/lifelines
    - https://github.com/lifelines/lifelines
    - https://lifelines.github.io/lifelines/
    - https://raw.githubusercontent.com/lifelines/lifelines/master/NEWS
    - https://raw.githubusercontent.com/lifelines/lifelines/master/README
  summary:
    - >
      LifeLines is a text-based genealogy system with its own report language and
      GEDCOM-oriented database model. It is much older than its GitHub repository: the
      project site says Tom Wetmore wrote it circa 1991-1994 and later placed it under
      an MIT-style license.
  timeline:
    - '1991-1994: Project site says Tom Wetmore wrote LifeLines during this period.'
    - '1992: Project site says the LINES-L discussion list was established.'
    - '3.0.29: Project site says native language support began for several languages.'
    - '3.1.0: NEWS records the move from SourceForge to GitHub.'
    - '3.2.0: NEWS records full 64-bit port and Mac OS X support work.'
  usage:
    - >
      Users import or maintain GEDCOM data, browse and edit family records in a text
      interface, verify databases with dbverify, and run LifeLines report scripts
      through tools such as llexec.
related-packages:
  - id: cask:gramps
    reason: >
      Gramps is a GUI-oriented, cross-platform genealogy application with structured
      source and citation management, while LifeLines is better suited to terminal users
      who value its report language.
    rel: alternative
    sources:
