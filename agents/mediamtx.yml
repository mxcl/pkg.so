history:
  adoption-history:
    - >
      MediaMTX became popular with self-hosters, camera users, home automation stacks,
      streaming experiments, and infrastructure teams that need a small relay between
      cameras, browsers, FFmpeg, GStreamer, OBS, VLC, and custom clients. Its official
      repository shows substantial public adoption, and the package input lists
      Homebrew, Nix, Scoop, and Winget packages.
    - >
      The project's adoption is helped by protocol bridging: streams can be published
      with one protocol and read with another. That makes it useful as glue in
      environments where cameras, browsers, media tools, and monitoring systems do not
      all speak the same media protocol.
  package-nerd-significance:
    - >
      For package nerds, MediaMTX is a compact alternative to assembling a larger
      streaming stack. A single packaged binary gives users RTSP, RTMP, WebRTC, SRT,
      HLS, recording, metrics, authentication, and proxying without installing a pile of
      media daemons.
  project-history:
    - >
      The official GitHub repository was created in December 2019 and its earliest
      GitHub releases are v0.1.x from December 2019. The project evolved from
      RTSP-focused roots into a broader real-time media router covering RTSP, RTMP, HLS,
      WebRTC, SRT, RTP, MPEG-TS, and Media-over-QUIC.
    - >
      The project is intentionally operational rather than framework-heavy: the README
      emphasizes a single executable with no external dependencies on Linux, Windows,
      and macOS, while the documentation exposes configuration, authentication,
      recording, metrics, hooks, control API, proxying, and protocol-specific behavior.
  related-projects:
    - >
      MediaMTX integrates with FFmpeg, GStreamer, OBS Studio, VLC, WebRTC clients, SRT
      clients, RTSP cameras, RTMP clients, HLS readers, and Prometheus-compatible
      monitoring.
  sources:
    - https://api.github.com/repos/bluenviron/mediamtx
    - https://api.github.com/repos/bluenviron/mediamtx/releases
    - https://github.com/bluenviron/mediamtx
    - https://mediamtx.org/docs/features/configuration
  summary:
    - >
      MediaMTX is a zero-dependency live media server and proxy for publishing, reading,
      proxying, recording, and playing back real-time audio and video streams. The
      official README describes it as a media router focused on efficiency and
      portability.
  timeline:
    - '2019: Repository created and v0.1.0 released.'
    - >
      2021: The project is widely used under the earlier rtsp-simple-server name in
      Docker and streaming workflows.
    - >
      2023: Executable and configuration migration to MediaMTX-era names is reflected in
      maintainer support discussions and user issues.
    - >
      2026: Active releases continue, with the repository showing thousands of commits
      and broad protocol support.
  usage:
    - >
      Users typically run the `mediamtx` binary with a `mediamtx.yml` file, edit
      configuration directly, override parameters with `MTX_` environment variables, or
      use the control API. The official configuration documentation says the release
      bundle includes the configuration file and that changes can be hot-reloaded when
      possible.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Use FFmpeg to publish files or devices into MediaMTX and to read or record its
      streams; the official basic-usage guide provides commands for both directions.
    rel: adjacent_workflow
    sources:
      - https://mediamtx.org/docs/features/basic-usage
      - https://ffmpeg.org/documentation.html
  - id: brew:gstreamer
    reason: >
      Choose GStreamer when a pipeline needs to publish to or consume MediaMTX through
      RTSP, RTMP, HLS, SRT, or WebRTC components.
    rel: adjacent_workflow
    sources:
      - https://mediamtx.org/docs/read/gstreamer
      - https://gstreamer.freedesktop.org/documentation/
  - id: cask:obs
    reason: >
      OBS Studio can publish live productions to MediaMTX and can also consume MediaMTX
      streams as part of a broadcasting workflow.
    rel: adjacent_workflow
    sources:
      - https://mediamtx.org/docs/features/publish-and-read
      - https://obsproject.com/kb/
  - id: cask:vlc
    reason: >
      VLC provides a convenient desktop and command-line reader for diagnosing and
      viewing MediaMTX network streams.
    rel: adjacent_workflow
    sources:
      - https://mediamtx.org/docs/features/basic-usage
      - https://docs.videolan.me/vlc-user/en/index.html
