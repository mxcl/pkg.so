history:
  adoption-history:
    - >
      Preference Manager broadened beyond its Final Cut-oriented roots to support
      workflows involving Final Cut Pro X, Avid Media Composer, Adobe Premiere Pro and
      After Effects, Pro Tools, Logic Pro X, and other post-production applications.
      Digital Rebellion described it as a free tool for editors and post-production
      professionals.
  package-nerd-significance:
    - >
      Preference Manager is a specialist recovery and migration utility rather than a
      general plist editor. For package curators, its interest lies in encoding
      knowledge of where multiple professional media applications store preferences,
      layouts, keyboard mappings, and related state.
  project-history:
    - >
      Digital Rebellion developed Preference Manager to trash, back up, restore, lock,
      and periodically autosave preference data for nonlinear editing and other
      professional media applications. Version 3.0 was released as a 64-bit rewrite in
      2011, while version 4.0 added cloud backup and expanded application support in
      2013.
  related-projects:
    - >
      Preference Manager is part of Digital Rebellion's collection of post-production
      utilities and has optional integration with Pro Maintenance Tools and Digital
      Rebellion's Kollaborate services.
  sources:
    - >
      Official 3.0 announcement:
      https://www.digitalrebellion.com/blog/posts/preference_manager_3.0_released_support_for_avid_premiere_fcpx_and_more
    - >
      Official 4.0 announcement:
      https://support.digitalrebellion.com/blog/posts/announcing_preference_manager_4_cloud_backups_pro_tools_support_and_more
    - >
      Official best-practices article:
      https://www.digitalrebellion.com/blog/posts/preference_manager_best_practices
    - 'Official product page: https://www.digitalrebellion.com/prefman'
    - >
      Official user manual:
      https://assets.digitalrebellion.com/docs/Preference%20Manager%20User%20Manual.pdf
  summary:
    - >
      Preference Manager is Digital Rebellion's macOS utility for troubleshooting,
      backing up, restoring, locking, and migrating preferences belonging to
      professional video and audio applications.
  timeline:
    - '2011: Preference Manager 3.0 delivered a 64-bit rewrite and expanded NLE support.'
    - >
      2012: Digital Rebellion documented backup-first recovery practices and introduced
      a Windows beta.
    - >
      2013: Preference Manager 4.0 added cloud backups, Pro Tools support, and broader
      Adobe workflows.
  usage:
    - >
      Editors can reset corrupted preferences to defaults, preserve a known-good backup,
      restore selected settings, move layouts and keyboard mappings between systems,
      lock supported settings, and retain periodic autosaves. Digital Rebellion
      recommends creating a stable baseline and restoring it when problems occur.
