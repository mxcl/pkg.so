config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Package-manager adoption is specialist and library-focused. The input
      package-manager facts list Homebrew, Fedora, and openSUSE packages, while Homebrew
      packages GPlugin with GLib, GTK4, PyGObject, Vala, Meson, and
      gobject-introspection related dependencies.
    - >
      Its audience is mostly developers building or packaging GLib/GObject applications
      that need a reusable plugin system rather than end users installing a standalone
      command.
  package-nerd-significance:
    - >
      GPlugin is notable as infrastructure: it is not a flashy CLI, but it lets
      distributions package one reusable plugin layer for GLib applications instead of
      each application owning a bespoke loader.
    - >
      For package maintainers, the interesting parts are introspection data,
      language-loader dependencies, and ABI/API versioning around a library that other
      desktop and messaging components can consume.
  project-history:
    - >
      The official docs identify the source and website as the keep.imfreedom.org
      GPlugin repository and name GPlugin Developers as the authors. The library exposes
      a manager, plugin metadata, plugin/source interfaces, loader abstractions, and
      command-line option integration.
    - >
      GPlugin is closely associated with libpurple and Pidgin-family development: IM
      Freedom's public discussion index describes it as a custom plugin library used by
      libpurple3.
  related-projects:
    - libpurple3 is the primary related consumer named by IM Freedom discussion metadata.
    - Pidgin and Finch are adjacent IM Freedom projects in the same ecosystem.
    - >
      GLib, GObject, GModule, and Gio are the platform libraries named in the generated
      GPlugin docs.
  sources:
    - https://discourse.imfreedom.org/
    - https://docs.imfreedom.org/gplugin/
    - https://formulae.brew.sh/formula/gplugin
    - https://keep.imfreedom.org/gplugin/gplugin
  summary:
    - >
      GPlugin is a GObject/GLib plugin library from the Instant Messaging Freedom
      ecosystem. Its generated API documentation describes the GPlugin namespace as a
      plugin library with GLib, GObject, GModule, and Gio dependencies.
  timeline:
    - '0.31: Core flags API is documented as present since version 0.31.'
    - '0.32: Manager API is documented as present since version 0.32.'
    - '0.39: Source interface documentation records a since marker for version 0.39.'
    - '0.43: FileSource documentation records a since marker for version 0.43.'
  usage:
    - >
      Applications embed GPlugin to discover plugin files on disk, query metadata, load
      and unload plugins through managers and loaders, and expose plugin-related
      command-line options. The documentation also includes examples and pages for
      native, Python 3, Lua, Vala, and Genie plugins.
    - >
      The Homebrew package includes gplugin-query and gplugin-gtk4-viewer executables,
      reflecting both inspection and graphical viewing workflows around plugin metadata.
related-packages:
  - id: brew:pidgin
    reason: >
      GPlugin is an adjacent development dependency for the Pidgin ecosystem because the
      official IM Freedom documentation says purple 3 uses it for plugin functionality
      and Pidgin 3 is built on purple 3.
    rel: adjacent_workflow
    sources:
      - https://docs.imfreedom.org/
      - https://docs.pidgin.im/
