id: brew:monocle
display-name: Monocle
repo: null
docs:
  - https://github.com/bgpkit/monocle#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/monocle/monocle.toml
    - ~/.config/monocle/monocle.toml
credentials-file-location: null
history:
  project-history:
    - >
      The tool's scope expanded from early parse, search, time-conversion, and whois
      utilities into a broader BGP analysis workstation. The project README and BGPKIT
      tool page describe commands for parsing local or remote MRT files, searching
      public archives, reconstructing RIB state at timestamps, inspecting ASNs and
      prefixes, validating routes with RPKI data, looking up country, IP, AS
      relationship, and prefix-to-ASN data, and running an HTTP/SSE server mode for
      programmatic access.
  sources:
    - https://bgpkit.com/blog/2022-year-in-review/
    - https://bgpkit.com/tools/monocle/
    - >
      https://blog.lacnic.net/en/command-line-routing-stats-with-bgpkit-monocle-and-cloudflare-radar-api/
    - https://github.com/bgpkit/monocle
  summary:
    - >
      Monocle is a Rust command-line and library tool in the BGPKIT family for working
      with public Border Gateway Protocol data. BGPKIT's 2022 year-in-review introduced
      it as the suite's first investigative tool, designed to tie together BGPKIT parser
      and broker work so users could quickly find relevant BGP announcements from public
      collector data.
  usage:
    - >
      Its package-manager niche is narrow but useful for network operators,
      routing-security researchers, and incident analysts who want a local CLI instead
      of stitching together Route Views, RIPE RIS, RPKI, WHOIS, and BGPKIT APIs by hand.
      The LACNIC republication of a BGPKIT article by Mingwei Zhang notes version 0.5
      support for Cloudflare Radar BGP routing statistics and prefix-to-origin APIs,
      illustrating how the tool fits into operational routing-analysis workflows.
related-packages:
  - id: brew:bgpstream
    reason: >
      Choose BGPStream when you need CAIDA's C/C++ and Python framework for streaming
      large live or historical BGP datasets; choose Monocle for an integrated
      investigative CLI with archive search, inspection, RPKI, and local database
      features.
    rel: alternative
    sources:
      - https://github.com/bgpkit/monocle#readme
      - https://dev.bgpstream.caida.org/
