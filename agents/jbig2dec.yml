history:
  adoption-history:
    - >
      The input metadata shows packaging across Homebrew, Alpine, Debian/Ubuntu, Fedora,
      MacPorts, Nix, Arch, and openSUSE. That broad packaging footprint matches a small
      C utility/library whose value is mostly as infrastructure for document conversion,
      PDF processing, and image decoding stacks.
  package-nerd-significance:
    - >
      jbig2dec is the kind of compact media package that earns its place by handling one
      difficult format well enough for bigger tools to depend on it. It is especially
      relevant to PDF pipelines because JBIG2 is referenced by PDF 1.4 and later, and
      because scanned monochrome documents can achieve very high compression ratios.
  project-history:
    - >
      The project README describes jbig2dec as a decoder library and example utility,
      with development source kept in the Ghostscript Git repository and a GitHub mirror
      under ArtifexSoftware. The README also notes that the GitHub repository is a
      mirror and that releases are hosted through GitHub tags.
    - >
      The SourceForge project page records that jbig2dec is no longer hosted there and
      points users to Ghostscript. That migration reflects the project's place in the
      Artifex/Ghostscript ecosystem, where JBIG2 decoding is part of broader PDF and
      page-description-language handling.
  related-projects:
    - >
      jbig2dec is related to JBIG2, ITU T.88, ISO/IEC 14492, PDF 1.4 and later,
      Ghostscript, Artifex, MuPDF, scanned-document compression, PNG, and PBM output
      tooling.
  sources:
    - https://github.com/ArtifexSoftware/jbig2dec
    - https://github.com/ArtifexSoftware/jbig2dec/blob/master/README
    - https://github.com/ArtifexSoftware/jbig2dec/blob/master/jbig2dec.1
    - https://sourceforge.net/projects/jbig2dec/
    - source_facts.package-manager
  summary:
    - >
      jbig2dec is a decoder library and command-line utility for the JBIG2 bi-level
      image compression format, also known as ITU T.88 and ISO/IEC 14492. Its practical
      niche is decoding monochrome scanned-document images, including JBIG2 streams
      embedded in PDF files.
  timeline:
    - 'SourceForge era: jbig2dec is hosted as a standalone open-source project.'
    - >
      Ghostscript era: Project hosting moves away from SourceForge and into the
      Ghostscript/Artifex ecosystem.
    - '2023: The man page identifies version 0.20 and documents the command-line interface.'
    - >
      Packaging era: Major Unix-like package managers carry jbig2dec as a small
      media/decoder dependency.
  usage:
    - >
      The command can decode a single JBIG2 stream to PNG or PBM output, or accept
      separate global and page streams used by embedded PDF organization. The man page
      documents diagnostic, dump, hash, quiet, verbose, and output-format options, while
      the README says the decoder remains useful in limited contexts and requests
      problematic files for testing.
related-packages:
  - id: brew:ghostscript
    reason: >
      Ghostscript is the broader alternative when JBIG2 decoding is needed as part of
      complete PDF, PostScript, or page-description-language rendering rather than as a
      dedicated stream-decoding utility.
    rel: alternative
    sources:
      - https://github.com/ArtifexSoftware/jbig2dec
      - https://github.com/ArtifexSoftware/ghostpdl/blob/master/README
  - id: brew:jbig2enc
    reason: >
      jbig2enc produces JBIG2 streams that jbig2dec can decode or inspect, making the
      pair useful for codec development and document-pipeline validation.
    rel: adjacent_workflow
    sources:
      - https://github.com/ArtifexSoftware/jbig2dec/blob/master/jbig2dec.1
      - https://github.com/agl/jbig2enc
