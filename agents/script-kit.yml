history:
  adoption-history:
    - >
      Script Kit was tested as a beta before its main-channel release. The project's
      December 2021 launch announcement thanked beta users and introduced the first
      Windows developer preview; its homepage now presents it as cross-platform and
      highlights community scripts and user automation workflows.
  package-nerd-significance:
    - >
      Script Kit occupies the space between a graphical command palette and a personal
      scripts directory. Its plain JavaScript and TypeScript files, dot-directory
      layout, command-line entry points, and version-control-friendly kenv make it
      particularly appealing to developers who want inspectable automation instead of
      opaque macros.
  project-history:
    - >
      John Lindquist created Script Kit as a desktop environment for quickly writing and
      invoking small automation scripts. After a public beta period, he announced its
      official release on 17 December 2021. The project later expanded beyond its
      original Mac focus with Windows and Linux builds and a TypeScript-oriented SDK.
  related-projects:
    - johnlindquist/kit contains the SDK, APIs, guide, and scripting runtime.
    - >
      johnlindquist/kitapp is the desktop application repository already recorded in
      source_facts.repo.
    - A kenv, or Kit Environment, stores a user's scripts and associated resources.
  sources:
    - >
      Official Windows preview announcement:
      https://github.com/johnlindquist/kit/discussions/654
    - 'Official guide: https://github.com/johnlindquist/kit/blob/main/GUIDE.md'
    - 'Official homepage: https://www.scriptkit.com/'
    - 'Official launch announcement: https://github.com/johnlindquist/kit/discussions/655'
  summary:
    - >
      Script Kit is an open-source desktop command palette and scripting environment
      created by John Lindquist. It lets users build automation commands in JavaScript
      or TypeScript and invoke them from a searchable prompt, shortcuts, the menu bar,
      or a terminal.
  timeline:
    - '2021: Public beta users exercise the emerging Script Kit workflow.'
    - '2021-12-17: Script Kit is officially released and the beta channel is retired.'
    - '2021-12-17: A Windows developer preview is announced.'
    - '2023: Script Kit 2.0 reaches its release cycle.'
  usage:
    - >
      Users create scripts under ~/.kenv/scripts, add metadata for names or shortcuts,
      and invoke them through the Script Kit prompt. The SDK supplies prompts, editors,
      filesystem and network helpers, shell-command integration, widgets, and other
      automation APIs. The env helper reads variables from ~/.kenv/.env and can prompt
      to save missing values there.
