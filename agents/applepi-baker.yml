history:
  adoption-history:
    - >
      The author reports that ApplePi-Baker became well known among Raspberry Pi users
      on macOS and was subsequently used for imaging devices beyond Raspberry Pi SD
      cards.
  package-nerd-significance:
    - >
      ApplePi-Baker packages a traditionally command-line-heavy disk-imaging workflow
      into a native Mac application. It is notable to package-manager users as a
      convenient GUI around established Unix and macOS storage utilities.
  project-history:
    - >
      The author created ApplePi-Baker in late 2013 for personal use after repeatedly
      looking up commands for tools such as dd, diskutil, and mount. Version 2 received
      a dedicated guide in May 2019.
  related-projects:
    - Raspberry Pi
    - dd
    - diskutil
    - mount
  sources:
    - https://www.tweaking4all.com/hardware/raspberry-pi/applepi-baker-v2/
  summary:
    - >
      ApplePi-Baker is a macOS disk-imaging utility for backing up and restoring SD
      cards, USB drives, and other removable storage.
  timeline:
    - "2013: ApplePi-Baker was created for the author's own disk-imaging workflow."
    - '2019: The ApplePi-Baker v2 guide was published.'
    - '2019: Stable version 2.2.3 was released.'
  usage:
    - >
      Users select one or more disks and perform backup or restore operations through
      the GUI. The application can also shrink or expand supported Linux partitions and
      work with compressed image formats. Direct disk access uses a privileged helper
      tool.
