history:
  adoption-history:
    - >
      FileMaker became established as a desktop and workgroup database for users who
      wanted to construct business applications without building a conventional software
      stack. The product expanded into a multi-product platform supporting desktop
      clients, servers, mobile use, and web access.
    - >
      Its enduring niche is departmental and line-of-business software: teams commonly
      use it to build inventory, CRM, scheduling, reporting, and other custom
      applications whose schema, layouts, scripts, and data live together in FileMaker
      files.
  package-nerd-significance:
    - >
      FileMaker Pro represents the long-lived commercial desktop-database tradition
      rather than the open-source server-package model. For package maintainers, it is
      notable as a large signed desktop application distributed through
      vendor-controlled downloads, with licensing, upgrade compatibility, and
      host/client version coordination affecting deployment.
  project-history:
    - >
      FileMaker Pro is a proprietary relational database and rapid application
      development environment now developed by Claris, an Apple company. Over successive
      releases it evolved from a desktop database into the authoring client for a
      broader platform of custom applications, hosted databases, mobile clients, and web
      access.
    - >
      Modern FileMaker Pro combines database schema design, layouts, calculations,
      scripting, security, and integration facilities in one visual development
      environment. In 2026 Claris aligned the major version number with the release
      year, advancing the product to version 26.
  related-projects:
    - FileMaker Server hosts shared FileMaker applications.
    - FileMaker Go provides access on iPhone and iPad.
    - FileMaker WebDirect exposes hosted applications through a web browser.
    - Claris Studio provides web-facing views and workflows within the wider Claris platform.
  sources:
    - >
      Official FileMaker Pro 2026 release notes:
      https://help.claris.com/en/pro-release-notes/content/index.html
    - 'Official FileMaker Pro Help: https://help.claris.com/en/pro-help/content/index.html'
    - 'Official FileMaker Pro basics: https://help.claris.com/en/pro-help/content/basics.html'
    - source_facts.description
  summary:
    - >
      FileMaker Pro is Claris's proprietary relational database and visual
      rapid-application-development environment. It is used to create and operate custom
      business applications that combine data, layouts, calculations, scripts, and
      access controls.
  timeline:
    - '1980s: The FileMaker product line emerged as a desktop database.'
    - '1990s: FileMaker expanded its relational, scripting, and workgroup capabilities.'
    - '2000s: Server, web, and mobile-oriented components broadened the platform.'
    - "2020: FileMaker's developer adopted the Claris company name."
    - '2026: FileMaker Pro advanced its major version to 26 to correspond with the year.'
  usage:
    - >
      Developers use FileMaker Pro to define tables and relationships, design forms and
      reports, automate workflows with scripts, and connect custom applications to
      external services or data sources. Shared deployments normally pair the authoring
      client with FileMaker Server or FileMaker Cloud.
    - >
      Application preferences are user-specific. Database-specific options and account
      definitions reside in each FileMaker database rather than in a single
      general-purpose credentials file; saved external authentication material may
      instead use the operating system Credential Manager or keychain.
