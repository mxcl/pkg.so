credentials-file-location: null
history:
  project-history:
    - >
      The Monitoring Plugins Development Team renamed the project in January 2014 after
      nagios-plugins.org was redirected to infrastructure controlled by Nagios
      Enterprises. The team described the move as a forced rename from "Nagios Plugins"
      to "Monitoring Plugins" and emphasized that the bundle had become useful beyond
      Nagios itself.
  sources:
    - https://assets.nagios.com/downloads/nagioscore/docs/nagioscore/4/en/plugins.html
    - https://www.monitoring-plugins.org/
    - https://www.monitoring-plugins.org/news/new-project-name.html
    - https://www.nagios.org/about/history/
    - https://www.nagios.org/downloads/nagios-plugins/
  summary:
    - >
      Monitoring Plugins is the continuation of the standard check-plugin bundle that
      grew out of the Nagios ecosystem. Nagios' own history says the plugins distributed
      with NetSaint were spun off into a separate Nagios Plugins project around the
      1999-2002 NetSaint-to-Nagios transition, establishing the small executable-check
      model that Nagios Core and compatible systems still use.
  usage:
    - >
      In practice the package is a collection of stand-alone command-line probes.
      Monitoring software runs a plugin to check a host or service, reads its status and
      output, and then handles state changes, notifications, or event handlers. The
      bundle covers common local and remote checks such as load, processes, disk usage,
      ICMP, SNMP, and HTTP, while the wider ecosystem adds thousands of community
      plugins for less common technologies. Its niche in package managers is therefore
      not a daemon but a shared vocabulary of executable checks for Nagios-compatible
      systems including Icinga, Naemon, Shinken, Sensu, and similar tools.
related-packages:
  - id: brew:nagios
    reason: >
      Nagios Core can schedule these stand-alone checks, interpret their status output,
      and turn state changes into notifications.
    rel: adjacent_workflow
    sources:
      - https://www.monitoring-plugins.org/
      - https://www.nagios.org/projects/nagios-core/features/
  - id: brew:nrpe
    reason: >
      NRPE complements the plugin bundle by remotely executing Nagios-compatible checks
      on Linux and Unix hosts.
    rel: adjacent_workflow
    sources:
      - https://www.monitoring-plugins.org/
      - https://www.nagios.org/projects/nagios-core-addons/
  - id: brew:nagios-plugins
    reason: >
      Choose Nagios Plugins when you specifically want the Nagios Enterprises-maintained
      branch; Monitoring Plugins is the independently maintained continuation that
      adopted a vendor-neutral name in 2014.
    rel: alternative
    sources:
      - https://www.monitoring-plugins.org/doc/faq/fork.html
      - https://www.nagios.org/downloads/nagios-plugins/
