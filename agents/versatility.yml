history:
  adoption-history:
    - >
      Versatility replaced the developer's earlier DeepTools utilities with a unified
      and improved drag-and-drop interface. It remains part of a small ecosystem of
      specialist utilities for working around the portability limitations of macOS
      document versions.
  package-nerd-significance:
    - >
      Versatility addresses an obscure but important macOS behavior: document versions
      normally live in a hidden per-volume database and can be lost when files cross
      storage boundaries. It exposes a portable archive representation that can traverse
      iCloud, external media, networks, and even non-macOS systems before being restored
      on a Mac.
  project-history:
    - >
      The Eclectic Light Company introduced Versatility in March 2024 as a simpler
      front-line utility for preserving macOS document versions. It built on version
      archiving previously available through Revisionist and the separate DeepTools
      applications.
  related-projects:
    - >
      Revisionist provides deeper inspection and management of macOS versions. DeepTools
      was Versatility's predecessor and separated copying, archiving, and unarchiving
      into multiple tools.
  sources:
    - >
      Official launch article:
      https://eclecticlight.co/2024/03/22/versatility-a-new-drag-and-drop-utility-to-archive-and-unarchive-file-versions/
    - >
      Official macOS-versioning explanation:
      https://eclecticlight.co/2025/04/29/document-versioning-unused-power-in-macos/
    - 'Official product page: https://eclecticlight.co/revisionist-deeptools/'
    - 'Package identity: source_facts.applications and source_facts.package-manager'
  summary:
    - >
      Versatility is a macOS utility that archives all saved versions of a document into
      a movable folder and later reconstructs a new copy with those versions restored.
      It leaves the original document and its version history unchanged.
  timeline:
    - >
      2018: Version archiving first appeared in the developer's Revisionist and
      DeepTools workflow.
    - '2024: Versatility launched as a unified drag-and-drop replacement for DeepTools.'
    - >
      2026: Its archive workflow was extended to accommodate documents with very large
      version histories.
  usage:
    - >
      To archive, users drag a document onto Versatility and choose a destination
      folder; each saved version is copied with its original timestamps. To restore,
      they drag the archive folder into the application and choose a destination for the
      reconstructed document. Archives can be compressed, moved between volumes or
      computers, or transported through operating systems that do not understand macOS
      version metadata.
