id: cask:wave
display-name: Wave Terminal
repo: https://github.com/wavetermdev/waveterm
docs:
  - https://docs.waveterm.dev/
  - https://docs.waveterm.dev/config
config-file-location:
  unix:
    - ~/.config/waveterm/settings.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Wave is distributed for macOS, Linux, and Windows, while the supplied package
      facts record its availability through the Homebrew cask named wave.
  package-nerd-significance:
    - >
      Wave combines a modern terminal emulator with workspace blocks, file and web
      previews, remote connections, durable sessions, and optional AI integrations. Its
      open-source codebase and JSON configuration make it inspectable and automatable.
    - >
      The v0.8 transition is notable to package maintainers because it was a clean break
      whose settings and history did not migrate from Wave Legacy.
  project-history:
    - >
      Wave Terminal is an Apache-2.0-licensed, open-source, cross-platform terminal
      developed by the Wave Terminal organization. Its current implementation combines a
      terminal with graphical workspace tools and optional AI support.
    - >
      The official release notes describe v0.8.0 in September 2024 as a fresh start
      separate from the legacy application. Later releases expanded Windows support,
      configuration tooling, AI-provider presets, and secrets management.
  related-projects:
    - >
      Wave Legacy is the separately maintained predecessor referenced by the official
      documentation.
    - >
      The project uses and maintains integrations around terminal tooling such as
      xterm.js and its wsh command-line helper.
  sources:
    - https://docs.waveterm.dev/
    - https://docs.waveterm.dev/config
    - https://docs.waveterm.dev/releasenotes
    - https://github.com/wavetermdev/waveterm
    - source_facts.package-manager
  summary:
    - >
      Wave Terminal is an open-source, cross-platform terminal emulator and workspace
      application with integrated previews, remote-session tooling, and optional AI
      features.
  timeline:
    - '2024-09-20: Wave Terminal v0.8.0 introduced a clean break from Wave Legacy.'
    - >
      2025-12-16: v0.13.1 expanded Windows integration, AI-provider configuration, and
      secrets management.
  usage:
    - >
      Users run local shells, connect to remote systems, arrange terminal and preview
      blocks, and customize behavior through JSON files under ~/.config/waveterm.
    - >
      The wsh helper exposes configuration editing and workspace-oriented terminal
      operations from the command line.
tags:
  - ai
  - cross-platform
  - developer-tool
  - open-source
  - ssh
  - terminal-emulator
  - workspace
provenance:
  category-sources:
    - >
      https://docs.waveterm.dev/ describes Wave as a terminal with integrated developer
      workflows.
    - source_facts.description identifies a terminal emulator.
  display-name-sources:
    - current_curation.display-name
    - https://docs.waveterm.dev/ uses the product name Wave Terminal.
  docs-sources:
