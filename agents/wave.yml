  history-sources:
    - https://docs.waveterm.dev/
    - https://docs.waveterm.dev/config
    - https://docs.waveterm.dev/releasenotes
    - https://github.com/wavetermdev/waveterm
    - source_facts.package-manager
  repo-sources:
    - >
      The official GitHub organization is verified as controlling waveterm.dev, and the
      official documentation links this repository.
  tags-sources:
    - https://docs.waveterm.dev/
    - https://github.com/wavetermdev/waveterm
    - source_facts.description
