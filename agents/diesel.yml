history:
  adoption-history:
    - >
      Diesel grew with the Rust ecosystem as one of the main answers for developers who
      wanted SQL databases without giving up Rust's compile-time checks. The project
      publishes crates, API docs, guides, and frequent GitHub releases, which makes it
      natural for both Cargo and system package managers.
  package-nerd-significance:
    - >
      For package nerds, Diesel is notable because the Homebrew formula exposes only the
      CLI, but that binary is the operational face of a larger Rust crate ecosystem and
      database-migration workflow.
  project-history:
    - >
      The Diesel repository was created in 2015 and describes the project as a safe,
      extensible ORM and query builder for Rust. Its README emphasizes reducing database
      boilerplate while using Rust's type system to catch query errors at compile time.
    - >
      The official guide places the CLI in the normal project workflow: set DATABASE_URL
      in .env, run diesel setup, generate migrations, and let diesel.toml guide
      generated schema output.
  related-projects:
    - >
      The diesel crate, diesel_cli, docs.rs API docs, and PostgreSQL, MySQL, and SQLite
      backends are the main adjacent pieces.
  sources:
    - https://github.com/diesel-rs/diesel
    - https://api.github.com/repos/diesel-rs/diesel
    - https://raw.githubusercontent.com/diesel-rs/diesel/master/README.md
    - https://diesel.rs/guides/getting-started
    - https://api.github.com/repos/diesel-rs/diesel/releases
  summary:
    - >
      Diesel is a Rust ORM, query builder, and migration toolchain with a
      Homebrew-packaged CLI. Its public identity is type-safe database interaction for
      PostgreSQL, MySQL, and SQLite.
  timeline:
    - '2015: The diesel-rs/diesel GitHub repository is created.'
    - '2025: Diesel 2.3.x releases continue active maintenance.'
    - '2026: Diesel 2.3.10 is published on GitHub releases.'
  usage:
    - >
      Developers use the diesel CLI to set up projects, manage migrations, and generate
      schema files, while application code uses Diesel's derive macros and query
      builder. The common local convention is a project diesel.toml plus a .env file
      containing DATABASE_URL.
