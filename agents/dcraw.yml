credentials-file-location: null
history:
  adoption-history:
    - >
      dcraw became important because camera vendors shipped proprietary Windows and Mac
      tools while Unix and open-source users needed a portable way to process raw files.
      The official page lists many applications and plugins that used dcraw, copied
      parts of dcraw.c, or treated the source as practical documentation for camera
      formats.
  package-nerd-significance:
    - >
      dcraw is package-manager folklore because it compressed a sprawling compatibility
      problem into one portable C program. For distributions, graphics stacks, and photo
      tools, it served as both an executable utility and a reference implementation for
      raw camera formats.
  project-history:
    - >
      The official dcraw page says the RCS history of dcraw.c begins with its conception
      on February 23, 1997. Instead of using a public forge as its primary home, dcraw
      has long been distributed from Coffin's own site as source files, an RCS file,
      tarballs, translations, and an official manpage.
  related-projects:
    - gPhoto, UFRaw, GIMP rawphoto, RawTherapee, Adobe Camera Raw
  sources:
    - https://dechifro.org/dcraw
    - https://dechifro.org/dcraw/dcraw.1.html
    - https://dechifro.org/dcraw/RCS/dcraw.c,v
  summary:
    - >
      dcraw is Dave Coffin's portable ANSI C decoder for raw digital camera photos. The
      official site describes its goal as decoding raw images from any digital camera on
      any operating system, and calls it a standard tool inside and outside open source.
  timeline:
    - '1997: dcraw.c history begins according to the official RCS file note'
    - "2003: Official page links Dave Coffin's Digital Outback Photo essay"
    - '2005: Official page links press and interview coverage around raw-photo decoding'
    - '2015: Official manpage updated March 3, 2015'
  usage:
    - >
      The manpage documents dcraw as a command-line decoder that can decode raw photos,
      display metadata, and extract thumbnails. Its options cover identifying files,
      outputting to stdout, controlling white balance, extracting embedded thumbnails,
      and producing image formats suitable for further processing.
related-packages:
  - id: brew:libraw
    reason: >
      Choose LibRaw when software needs an embeddable, thread-safer RAW decoding library
      with camera support maintained beyond dcraw's development lineage.
    rel: alternative
    sources:
      - https://dechifro.org/dcraw/
      - https://www.libraw.org/about
      - https://www.libraw.org/docs
  - id: cask:rawtherapee
    reason: >
      Choose RawTherapee for an interactive, nondestructive photographic-development
      workflow built on the RAW-decoding lineage that began with dcraw.
    rel: alternative
    sources:
      - https://dechifro.org/dcraw/
      - https://www.rawtherapee.com/
      - https://www.rawtherapee.com/2010/09/back-in-time-rawtherapee-from-2004-till-2010-today/
