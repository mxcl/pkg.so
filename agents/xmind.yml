history:
  adoption-history:
    - >
      Xmind's official company history describes a long-running, cross-platform product
      that has received mainstream recognition, including a 2013 mind-mapping popularity
      award and an Apple App of the Day distinction.
  package-nerd-significance:
    - >
      Xmind is a recognizable example of a polished proprietary desktop productivity
      application distributed through Homebrew Cask. It is useful to package users who
      want repeatable installation of a graphical mind-mapping tool without managing a
      downloaded installer manually.
  project-history:
    - >
      Xmind dates its founding to 2006. Its official retrospective shows the product's
      visual identity debuting in 2007 and records the introduction of XMind: ZEN in
      2017. The product subsequently expanded beyond conventional mind maps into
      outlining, presentations, collaboration, project-oriented features, and
      AI-assisted workflows.
  related-projects:
    - XMind 8 is maintained as a legacy product line.
    - Xmind AI capabilities were incorporated into the broader Xmind product experience.
  sources:
    - 'Official About page and company timeline: https://xmind.com/about'
    - 'Official User Guide: https://xmind.com/user-guide'
    - >
      Official logo and product retrospective:
      https://xmind.com/blog/the-evolution-of-xmind-logo
  summary:
    - >
      Xmind is a commercial mind-mapping and structured-thinking application founded in
      2006. It supports brainstorming, outlining, visual organization, presentation,
      collaboration, and related productivity workflows.
  timeline:
    - '2006: Xmind was founded.'
    - "2007: Xmind's first product logo debuted."
    - '2013: Xmind received a prominent mind-mapping popularity award.'
    - '2017: XMind: ZEN and its associated visual identity were introduced.'
  usage:
    - >
      Users create and organize mind maps, brainstorm ideas, outline information, track
      tasks, present maps, and export or share structured content. The desktop
      application is commonly installed on macOS through a cask and then used as a
      graphical document-oriented tool.
