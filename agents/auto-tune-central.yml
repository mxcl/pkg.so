history:
  adoption-history:
    - >
      Auto-Tune Central is the installation and activation path Antares directs current
      Auto-Tune customers to use. The official guide covers both subscription and
      perpetual-license users and supports activations on a computer or physical iLok.
  package-nerd-significance:
    - >
      The application packages vendor-specific acquisition, updates, entitlement checks,
      and iLok activation into one desktop manager. For package-management users, it is
      an example of a proprietary domain-specific package client distributed through a
      general-purpose Homebrew cask.
  project-history:
    - >
      Antares developed Auto-Tune Central as its download and license-management
      application for Auto-Tune and related vocal-effect plug-ins. Current Antares
      guidance presents it as the central workflow for installing plug-ins and managing
      their activations.
  related-projects:
    - >
      Auto-Tune Central manages Antares products including Auto-Tune Unlimited,
      Auto-Tune Pro, Auto-Tune Access, Auto-Tune EFX+, Auto-Tune Artist, Auto-Tune
      Hybrid, Auto-Key, and the company's vocal-effects plug-ins.
    - PACE iLok supplies the account and activation system linked by Auto-Tune Central.
  sources:
    - >
      https://help.antarestech.com/hc/en-us/articles/41076506074772-How-To-Activate-Your-License-With-Auto-Tune-Central
      — official product and activation description.
    - >
      https://www.antarestech.com/getting-started — official setup workflow and
      supported platforms.
    - source_facts.package-manager — records Homebrew cask distribution.
  summary:
    - >
      Auto-Tune Central is Antares' desktop download manager for installing, updating,
      and activating Auto-Tune and related audio plug-ins.
  timeline:
    - >
      2026: Antares' current support material documents Auto-Tune Central as the
      installation and activation manager for its plug-in range.
  usage:
    - >
      Sign in with the Antares account associated with a subscription or perpetual
      license, link an iLok account when prompted, install the licensed plug-ins, and
      activate them to a computer or physical iLok.
