id: brew:dotnet@9
display-name: .NET 9
repo: null
docs:
  - https://learn.microsoft.com/en-us/dotnet
  - https://learn.microsoft.com/en-us/dotnet/core/whats-new/dotnet-9/overview
config-file-location:
  unix:
    - <working-directory-or-ancestor>/global.json
  windows:
    - <working-directory-or-ancestor>/global.json
credentials-file-location: null
history:
  adoption-history:
    - >
      .NET 9 followed the annual cadence as an STS release, making it attractive for
      teams willing to pick up newer runtime, SDK, C# 13, ASP.NET Core, and library
      features before the next LTS. Versioned package-manager entries let those teams
      keep that train available even after newer unversioned packages advance.
  package-nerd-significance:
    - >
      dotnet@9 is a textbook example of package-manager lifecycle pinning for a runtime
      with annual major releases. Its STS status matters because catalogs must keep it
      installable for reproducible builds while also signaling that it is not the
      long-lived LTS baseline.
  project-history:
    - >
      Microsoft's release metadata lists .NET 9.0 as released on November 12, 2024, with
      support through November 10, 2026. Its preview cycle began in February 2024 and
      moved through release candidates before the general availability release.
  related-projects:
    - .NET
    - ASP.NET Core 9
    - Entity Framework Core 9
    - C# 13
    - NuGet
  sources:
    - https://github.com/dotnet/core/blob/main/release-notes/9.0/README.md
    - https://github.com/dotnet/core/blob/main/releases.md
    - https://learn.microsoft.com/en-us/dotnet/core/whats-new/dotnet-9/overview
    - https://formulae.brew.sh/formula/dotnet@9
  summary:
    - >
      .NET 9 is the November 2024 Standard Term Support release of modern .NET. The
      Homebrew dotnet@9 formula gives developers a pinned SDK/runtime family for
      projects that adopted the .NET 9 train before or alongside the later .NET 10 LTS
      line.
  timeline:
    - '2024: .NET 9.0 Preview 1 appeared in February.'
    - '2024: .NET 9.0 was released on November 12 as an STS release.'
    - '2026: Microsoft lists November 10, 2026 as the end of support for .NET 9.'
  usage:
    - >
      Developers install dotnet@9 to build, run, test, and publish projects targeting
      net9.0 and related ASP.NET Core, EF Core, MAUI, and SDK workloads. As with other
      .NET SDKs, project files and global.json are the usual controls for selecting it
      in multi-SDK environments.
related-packages:
  - id: brew:dotnet
    reason: >
      Choose the unversioned formula when the project can follow Homebrew's current .NET
      SDK instead of remaining pinned to the .NET 9 generation.
    rel: alternative
    sources:
      - https://learn.microsoft.com/en-us/dotnet/core/tools/global-json
      - https://github.com/dotnet/core/blob/main/releases.md
  - id: brew:dotnet@8
    reason: >
      Choose .NET 8 when the application requires that LTS generation and its `net8.0`
      compatibility baseline rather than .NET 9.
    rel: alternative
    sources:
      - https://github.com/dotnet/core/blob/main/release-notes/8.0/README.md
      - https://github.com/dotnet/core/blob/main/release-notes/9.0/README.md
  - id: brew:nuget
    reason: >
      Use the standalone NuGet client for dedicated package publication and repository
      operations around dependencies consumed by .NET 9 projects.
    rel: adjacent_workflow
    sources:
      - https://learn.microsoft.com/en-us/nuget/what-is-nuget
      - https://learn.microsoft.com/en-us/dotnet/core/tools/dotnet
tags:
  - cli
  - csharp
  - dotnet
  - runtime
  - sdk
provenance:
  category-sources:
    - >
      source_facts.description says .NET Core; Microsoft Learn describes .NET as the
      official cross-platform developer platform and documentation surface.
  display-name-sources:
    - source_facts.name is dotnet@9 and source_facts.homepage is the official .NET site.
  docs-sources:
    - >
      Microsoft Learn is the official .NET documentation site; the version-specific .NET
      9 overview is under learn.microsoft.com.
  history-sources:
    - https://github.com/dotnet/core/blob/main/release-notes/9.0/README.md
    - https://github.com/dotnet/core/blob/main/releases.md
    - https://learn.microsoft.com/en-us/dotnet/core/whats-new/dotnet-9/overview
    - https://formulae.brew.sh/formula/dotnet@9
  repo-sources:
    - >
      source_facts.repo already contains https://github.com/dotnet/dotnet; per
      instructions repo was not re-determined.
  tags-sources:
    - >
      source_facts.description identifies .NET Core and source_facts.executables lists
      the dotnet CLI.
category-confidence: high
category-path:
  - language-runtime
  - dotnet
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
