id: brew:gecode
display-name: Gecode
repo: null
docs:
  - https://www.gecode.dev/documentation.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Gecode's official news archive tracks its use in solver and modeling ecosystems:
      FlatZinc support was announced in 2007, repeated MiniZinc Challenge wins were
      reported from 2008 through 2012, Homebrew availability was announced in 2011, and
      SAP adoption for advanced variant configuration was reported in 2018.
  package-nerd-significance:
    - >
      Gecode is significant in package collections because it is both a library and a
      solver executable dependency for constraint-programming workflows, especially
      MiniZinc and FlatZinc users who care about solver availability, ABI compatibility,
      and platform packaging.
  project-history:
    - >
      The official Gecode site presents the project as a modular and extensible C++
      constraint solver with support for custom constraints, branching strategies,
      search engines, and variable domains. Its historical changelog records Gecode
      1.0.0 on 2005-12-06.
  related-projects:
    - >
      MiniZinc, FlatZinc, AMPL, ECLiPSe, YAP Prolog, and SAP advanced variant
      configuration are named in Gecode's official site or news archive as related
      interfaces, uses, or integrations.
  sources:
    - https://www.gecode.dev/
    - https://www.gecode.dev/doc/2.2.0/reference/PageChange.html
    - https://www.gecode.dev/news.html
  summary:
    - >
      Gecode is the Generic Constraint Development Environment, an open source C++
      toolkit for developing constraint-based systems and applications.
  timeline:
    - '2005: Gecode 1.0.0 released.'
    - '2007: FlatZinc for Gecode 1.0 released.'
    - '2008-2012: Gecode won MiniZinc Challenge gold medals across multiple years.'
    - '2011: Gecode became installable on Mac OS via Homebrew.'
    - '2018: SAP use of Gecode for advanced variant configuration was reported.'
    - '2019: Gecode 6.2.0 released.'
  usage:
    - >
      Developers use Gecode as a C++ toolkit and through command-line front ends such as
      FlatZinc and MiniZinc-related tooling. The official documentation emphasizes
      tutorial and reference material for modeling, search, installation, linking, and
      platform-specific builds.
related-packages:
  - id: brew:minizinc
    reason: >
      MiniZinc provides a solver-independent modeling language that can select Gecode as
      a backend and expose Gecode-specific constraints through `gecode.mzn`.
    rel: adjacent_workflow
    sources:
      - https://docs.minizinc.dev/en/stable/solvers.html
      - https://www.gecode.dev/
