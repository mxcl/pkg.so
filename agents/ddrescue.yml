id: brew:ddrescue
display-name: GNU ddrescue
repo: https://savannah.gnu.org/cvs?group=ddrescue
docs:
  - https://www.gnu.org/software/ddrescue/manual/ddrescue_manual.html
  - https://www.gnu.org/software/ddrescue/ddrescue.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool became a standard package in recovery-oriented Unix toolkits because it
      is scriptable, resumable, and cautious around damaged input. Official GNU release
      announcements continued through the 1.x line, including the 1.30 release
      announcement in January 2026.
  package-nerd-significance:
    - >
      ddrescue matters to package nerds because it is the recovery tool people hope they
      installed before hardware starts failing. It also sits in a confusing namespace
      with similarly named tools, so the GNU package name, executable names, manual, and
      Savannah source location are important for correct curation.
  project-history:
    - >
      GNU ddrescue was written by Antonio Diaz Diaz and became part of the GNU software
      collection. The official manual describes its automatic rescue operation,
      non-truncating output behavior, and mapfile-driven resume strategy, all of which
      distinguish it from simpler dd-style copying.
  related-projects:
    - ddrescuelog is distributed with GNU ddrescue for mapfile inspection and manipulation.
    - >
      dd_rescue and dd-rhelp are historically related names often contrasted with GNU
      ddrescue.
    - >
      GNU coreutils dd is the simpler block-copying tool whose limitations often
      motivate use of ddrescue.
  sources:
    - https://www.gnu.org/software/ddrescue/ddrescue.html
    - https://www.gnu.org/software/ddrescue/manual/ddrescue_manual.html
    - https://lists.gnu.org/archive/html/info-gnu/2026-01/msg00001.html
    - https://savannah.gnu.org/cvs?group=ddrescue
  summary:
    - >
      GNU ddrescue is a data-recovery command-line tool for copying data from failing
      disks, optical media, or files while tracking progress in a mapfile. Its package
      identity is built around one job: rescue readable blocks first, keep a resumable
      record, and return for the difficult areas later.
  timeline:
    - "2004: GNU ddrescue's early public release era begins."
    - >
      2007: GNU ddrescue is already established enough for public interviews and release
      announcements around the 1.x line.
    - '2024: GNU ddrescue 1.28 appears in downstream package-update announcements.'
    - '2026: GNU ddrescue 1.30 announced on the GNU info list.'
  usage:
    - >
      Typical usage images a damaged device to a safer target while writing a mapfile,
      then reruns the command to retry missing or bad areas. The companion ddrescuelog
      tool works with mapfiles for inspecting, converting, and managing rescue state.
related-packages:
  - id: brew:testdisk
    reason: >
      Use TestDisk after ddrescue creates a safer raw image when you need to recover
      partitions, repair filesystem structures, or copy files from the rescued image.
    rel: adjacent_workflow
    sources:
