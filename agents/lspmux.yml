config-file-location:
  unix:
    - ~/.config/lspmux/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      lspmux is a niche developer tool aimed at users who run multiple editor windows or
      clients against the same workspace. The README points users to Cargo installation
      and package-manager availability through Repology, while the supplied package
      facts list Homebrew, Alpine, and Nix.
  package-nerd-significance:
    - >
      lspmux matters to package nerds because it is a resource-control tool for the LSP
      era. Rather than replacing an editor or a language server, it sits in the middle
      and makes repeated editor sessions cheaper, especially for heavy servers such as
      rust-analyzer.
  project-history:
    - >
      The project started as ra-multiplex, focused on rust-analyzer. Its changelog shows
      early releases in January and February 2022 adding configuration, removing a
      nightly Rust requirement, improving client/server behavior, and adding initial
      support for language servers other than rust-analyzer.
    - >
      In 2024, the project added status and reload commands, native LSP
      initialize-message handshakes, Unix socket support, and environment filtering. In
      October 2025, it migrated to Codeberg, changed license to EUPL-1.2, and was
      renamed from ra-multiplex to lspmux to reflect its broader language-server scope.
  related-projects:
    - >
      Related projects include rust-analyzer, clangd, Neovim LSP clients, CoC, and the
      Language Server Protocol itself.
  sources:
    - https://codeberg.org/p2502/lspmux
    - https://codeberg.org/p2502/lspmux/raw/branch/main/CHANGELOG.md
    - https://codeberg.org/p2502/lspmux/raw/branch/main/README.md
    - source_facts.package-manager
  summary:
    - >
      lspmux is a Language Server Protocol multiplexer that lets multiple editor clients
      share one language-server instance per workspace. Its README describes it as a
      proxy and client shim that multiplexes editor connections onto the appropriate
      language server to save resources.
  timeline:
    - >
      2022: ra-multiplex 0.1.x releases add configuration and early support for
      non-rust-analyzer servers.
    - >
      2024: 0.2.x releases add status/reload commands, Unix sockets, native LSP
      handshake changes, and environment filtering.
    - '2025: Repository migrates to Codeberg and license changes to EUPL-1.2.'
    - '2025: Project is renamed from ra-multiplex to lspmux in v0.3.0.'
  usage:
    - >
      The usual setup is to run `lspmux server` as a user service and configure an
      editor to use `lspmux` as the language-server executable or connect directly to
      the lspmux socket. The README gives examples for rust-analyzer, CoC in Neovim,
      clangd, systemd user services on Linux, and launchd services on macOS.
    - >
      Configuration is optional and stored in a TOML file in the system default
      configuration directory, with `~/.config/lspmux/config.toml` given as the Unix
      example. The README documents defaults for instance timeout, garbage-collection
      interval, TCP or Unix-socket listen/connect addresses, logging filters, and
      environment-variable filtering.
