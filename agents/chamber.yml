id: brew:chamber
display-name: Chamber
repo: null
docs:
  - https://github.com/segmentio/chamber/wiki
  - https://github.com/segmentio/chamber#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Chamber is packaged by Homebrew and Nix according to the input package facts,
      while upstream GitHub releases provide the main release channel. The README also
      recommends use with aws-vault, showing how it fits into AWS operator workflows.
  package-nerd-significance:
    - >
      Chamber is significant because it made AWS SSM Parameter Store usable as a
      lightweight secrets backend from a single Go CLI. For package managers, it is the
      kind of small operational binary that replaced custom shell glue around AWS APIs.
  project-history:
    - >
      The public repository was created in June 2017 and v1.0.0 was released two days
      later. The README frames Chamber as a tool for managing secrets through SSM
      Parameter Store and documents AWS IAM and KMS requirements.
    - >
      The README records important compatibility milestones: version 2.0 moved to
      Parameter Store's path-based API by default, and version 3.0 reserved the _chamber
      service name for internal use.
  related-projects:
    - AWS SSM Parameter Store is the storage backend Chamber manages.
    - AWS KMS is used for encryption key configuration in the documented workflow.
    - aws-vault is recommended by the README as one way to provide AWS credentials safely.
  sources:
    - https://github.com/segmentio/chamber#readme
    - https://github.com/segmentio/chamber/releases
    - https://api.github.com/repos/segmentio/chamber
  summary:
    - >
      Chamber is Segment's CLI for managing secrets in AWS Systems Manager Parameter
      Store. It stores values under service/key paths and can inject them into process
      environments for application startup.
  timeline:
    - '2017: GitHub repository created.'
    - '2017: v1.0.0 published on GitHub releases.'
    - '2018: README documents version 2.0 path-based Parameter Store behavior.'
    - '2025: v3.1.x releases continue maintenance.'
    - '2026: v3.1.5 published on GitHub releases.'
  usage:
    - >
      Common commands write, read, list, tag, export, import, and show history for
      secrets. The exec command loads secrets from one or more services, converts secret
      keys to environment variable names, and runs a child process with those values.
related-packages:
  - id: brew:aws-vault
    reason: >
      Use AWS Vault alongside Chamber when you want long-lived AWS credentials kept in a
      secure local backend and temporary credentials supplied to `chamber`; Chamber's
      README explicitly documents the `aws-vault exec … -- chamber` workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/segmentio/chamber#authenticating
      - https://github.com/ByteNess/aws-vault#readme
tags:
