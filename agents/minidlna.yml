id: brew:minidlna
display-name: ReadyMedia / MiniDLNA
repo: https://sourceforge.net/p/minidlna/git
docs:
  - https://minidlna.sourceforge.net/
  - https://sourceforge.net/p/minidlna/wiki/Home
config-file-location:
  unix:
    - /etc/minidlna.conf
credentials-file-location: null
history:
  project-history:
    - >
      The practical job of minidlnad is to index local music, video, pictures, and
      playlists, advertise them on a home network, and serve them to DLNA-capable
      clients such as televisions, consoles, phones, and media players. The openSUSE
      page captures the user-facing role well: host media in one place and play it from
      compatible devices across the local network.
  sources:
    - https://en.opensuse.org/MiniDLNA
    - https://formulae.brew.sh/formula/minidlna
    - https://sourceforge.net/p/minidlna/wiki/Home/
    - https://sourceforge.net/projects/minidlna/
  summary:
    - >
      MiniDLNA, later branded ReadyMedia in some package and project pages, began as a
      small DLNA/UPnP-AV media server associated with NETGEAR's ReadyNAS line. The
      SourceForge wiki says it was developed by a NETGEAR employee for ReadyNAS, and
      lists Justin Maggard as the project admin; the SourceForge summary repeats the
      ReadyNAS origin and describes the software as a simple server aimed at
      DLNA/UPnP-AV client compatibility.
  usage:
    - >
      Its ecosystem role is deliberately narrower than full media-library systems such
      as Plex, Jellyfin, or Kodi backends. Package managers ship it as a lightweight
      daemon for machines that already hold media files and need standards-based
      discovery and streaming, especially NAS boxes, home servers, routers, and small
      Linux hosts.
related-packages:
  - id: cask:jellyfin
    reason: >
      Choose Jellyfin when you want accounts, rich library management, dedicated
      clients, remote access, and transcoding in addition to optional DLNA service;
      ReadyMedia remains the smaller choice for straightforward LAN DLNA serving.
    rel: alternative
    sources:
      - https://sourceforge.net/p/minidlna/wiki/Home/
      - https://jellyfin.org/docs/general/quick-start/
      - https://jellyfin.org/docs/general/post-install/networking/dlna/
