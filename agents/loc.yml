id: brew:loc
display-name: loc
repo: null
docs:
  - https://github.com/cgag/loc#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      loc's adoption is concentrated among developers who want a fast one-shot codebase
      counter and are comfortable with Rust-built CLI tools. Official evidence points to
      GitHub interest, release binaries, cargo install, and a Homebrew package rather
      than a large ecosystem of integrations.
  package-nerd-significance:
    - >
      loc is significant in the package-manager catalog as part of the Rust rewrite wave
      of classic Unix developer tools: a narrow utility, fast startup, static-ish
      binaries, and simple install paths through cargo or Homebrew. Its README also
      records the healthy package-nerd humility of pointing users at tokei when accuracy
      matters more than raw speed.
  project-history:
    - >
      The cgag/loc GitHub repository was created in July 2016. The README positions loc
      directly against cloc and tokei, with old benchmark examples showing loc as much
      faster on large source trees, while also warning readers that tokei may be smarter
      or more accurate for some cases.
  related-projects:
    - cloc is the older Perl tool that loc explicitly reimplements for speed.
    - >
      tokei is the related Rust code-counting tool that loc compares against and
      recommends checking for accuracy-sensitive work.
  sources:
    - https://api.github.com/repos/cgag/loc
    - https://github.com/cgag/loc
    - source_facts.package-manager
  summary:
    - >
      loc is a Rust command-line tool for quickly counting lines of code. Its README
      describes it as a Rust implementation of cloc focused on speed, reporting file,
      line, blank, comment, and code counts by language.
  timeline:
    - '2016: The cgag/loc repository is created.'
    - >
      2018: README note points users to tokei as a smarter and more accurate related
      Rust counter.
    - '2020s: loc remains available through Homebrew and source/release installation paths.'
  usage:
    - >
      By default, loc counts the current directory or a target path and prints a
      language table with files, total lines, blank lines, comments, and code. It is
      used for quick repository sizing, comparing implementation-language mix, and
      sanity-checking source tree growth.
related-packages:
  - id: brew:tokei
    reason: >
      Choose Tokei when correctness, library embedding, and structured output matter
      more than loc's narrow emphasis on raw counting speed; loc's own README recommends
      considering Tokei for accuracy.
    rel: alternative
    sources:
      - https://github.com/cgag/loc
      - https://github.com/XAMPPRocky/tokei
  - id: brew:cloc
    reason: >
      Choose cloc for its mature language coverage, archive and repository handling,
      diff features, and broad portability; choose loc for a small compiled Rust counter
      optimized for fast local scans.
    rel: alternative
    sources:
      - https://github.com/cgag/loc
      - https://github.com/AlDanial/cloc
  - id: brew:scc
    reason: >
      Choose scc when line counts should include complexity and COCOMO cost estimates;
      choose loc when a simpler language-and-line summary is sufficient.
    rel: alternative
    sources:
      - https://github.com/cgag/loc
      - https://github.com/boyter/scc
