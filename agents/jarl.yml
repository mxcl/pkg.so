id: brew:jarl
display-name: Jarl
repo: null
docs:
  - https://jarl.etiennebacher.com/
  - https://jarl.etiennebacher.com/getting-started
  - https://jarl.etiennebacher.com/reference/cli
config-file-location:
  unix:
    - <project-root>/jarl.toml
  windows:
    - <project-root>\jarl.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Official integrations cover continuous integration through setup-jarl, pre-commit
      hooks, and editor or language-server workflows in VS Code, Positron, Zed, Helix,
      and Neovim.
  package-nerd-significance:
    - >
      Jarl packages a fast, standalone R-focused linting workflow as a command-line
      executable, making it useful in reproducible developer environments without
      requiring lint execution inside an interactive R session.
  project-history:
    - >
      Jarl was created by Etienne Bacher as an R linter with command-line, editor,
      pre-commit, and continuous-integration use cases.
  related-projects:
    - >
      Jarl participates in the broader R static-analysis ecosystem and provides
      integrations for pre-commit and language-server-capable editors.
  sources:
    - 'CLI reference: https://jarl.etiennebacher.com/reference/cli'
    - 'Getting started: https://jarl.etiennebacher.com/getting-started'
    - 'Official documentation: https://jarl.etiennebacher.com/'
  summary:
    - >
      Jarl is a command-line linter for R source code, with configurable rules,
      suppression comments, automatic fixes, and machine-readable output.
  timeline:
    - >
      Jarl emerged as a standalone R linter with project configuration and editor,
      pre-commit, and CI integrations.
  usage:
    - >
      Users commonly run `jarl check` against R projects, select or ignore rules in
      `jarl.toml`, suppress individual findings with `# jarl-ignore`, apply fixes, or
      emit concise, GitHub, or JSON diagnostics.
related-packages:
  - id: brew:air
    reason: >
      Use Air alongside Jarl to format R code after linting; Jarl is built on Air and
      its documentation explicitly recommends Air for formatting because Jarl itself is
      not a formatter.
    rel: adjacent_workflow
    sources:
      - https://jarl.etiennebacher.com/
      - https://jarl.etiennebacher.com/getting-started
      - https://posit-dev.github.io/air/
  - id: brew:pre-commit
    reason: >
      Use pre-commit to run Jarl automatically on staged R files through Jarl's
      documented `jarl-pre-commit` hook.
    rel: adjacent_workflow
    sources:
      - https://jarl.etiennebacher.com/howto/precommit
      - https://pre-commit.com/
