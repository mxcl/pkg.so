history:
  adoption-history:
    - >
      Fastmarks targets keyboard-oriented users with large bookmark collections,
      including collections spread across multiple browsers. Later releases extended its
      searchable sources to Hook links, while custom bookmarks gained iCloud
      synchronization across Macs.
  package-nerd-significance:
    - >
      Fastmarks treats browser bookmarks as launcher data rather than browser chrome.
      Its bookmark templates, local dynamic start page, multi-browser indexing, and
      keyboard-first workflow appeal to users who build carefully automated navigation
      systems.
  project-history:
    - >
      Retina Studio developed Fastmarks as a native macOS bookmark launcher. Official
      release notes document Fastmarks 1.2 in July 2022, followed in August 2022 by
      support for searching Hook links alongside browser bookmarks.
  related-projects:
    - >
      Fastmarks integrates with Hook for Mac and reads bookmarks from multiple web
      browsers. Its custom bookmarks synchronize through Apple's iCloud service.
  sources:
    - 'Official Retina Studio blog: https://retina.studio/blog/'
    - 'Official help: https://retina.studio/fastmarks/help/'
    - 'Official product page: https://retina.studio/fastmarks/'
  summary:
    - >
      Fastmarks is a keyboard-driven macOS launcher for finding and opening browser
      bookmarks. It also supports custom bookmarks, parameterized bookmark templates,
      and a locally served browser home or new-tab page.
  timeline:
    - '2022-07: Fastmarks 1.2 documented by Retina Studio.'
    - '2022-08: Fastmarks added searching of Hook links.'
  usage:
    - >
      Users invoke Fastmarks with a hotkey, type part of a bookmark's name, and press
      Return to open it. Templates can prompt for values such as ticket or order
      numbers. An optional local page at the default localhost port 6210 can show
      recent, frequent, and templated bookmarks as a browser home page.
