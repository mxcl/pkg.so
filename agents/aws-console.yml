id: brew:aws-console
display-name: aws-console
repo: null
docs:
  - https://aws-cloudformation.github.io/rain
  - https://aws-cloudformation.github.io/rain/rain_console.html
config-file-location:
  unix:
    - ~/.aws/config
  windows:
    - '%USERPROFILE%\.aws\config'
credentials-file-location:
  unix:
    - ~/.aws/credentials
  windows:
    - '%USERPROFILE%\.aws\credentials'
history:
  adoption-history:
    - >
      As a standalone Homebrew formula, aws-console is a narrow convenience package
      rather than the main Rain distribution. Homebrew analytics showed 64 installs in
      30 days, 283 in 90 days, and 1,339 in 365 days at the time of this batch,
      consistent with a niche operator workflow rather than a broad AWS CLI replacement.
  package-nerd-significance:
    - >
      Package nerds care because it is a tiny subcommand exposed as its own Homebrew
      package: a focused wrapper around AWS federation and browser login, riding on
      Rain's CloudFormation-oriented release stream.
  project-history:
    - >
      Rain is maintained under the aws-cloudformation GitHub organization as a Go
      command-line tool for CloudFormation templates and stacks. Its command set covers
      formatting, packaging, deployment, logging, stack sets, template generation, and a
      `console` subcommand; the generated Rain documentation identifies `rain console`
      as the command that logs in to the AWS console.
  related-projects:
    - 'rain: the parent AWS CloudFormation workflow CLI.'
    - >
      AWS CLI and AWS SDK shared config files: the profile and credential source used by
      Rain's console workflow.
  sources:
    - https://aws-cloudformation.github.io/rain/rain_console.html
    - https://formulae.brew.sh/api/formula/aws-console.json
    - https://github.com/aws-cloudformation/rain
  summary:
    - >
      aws-console is the Homebrew-packaged entry point for Rain's `console` command, a
      small AWS-console launcher built into the AWS CloudFormation Rain CLI. It uses the
      caller's current AWS credentials to generate an AWS Console sign-in URL and open
      it in a browser, with options for profile, region, service home page, stack
      selection, logout, and URL-only output.
  timeline:
    - >
      2026: Rain's generated documentation lists `rain console` as the AWS console login
      command.
    - '2026: Homebrew formula metadata packages aws-console from Rain v1.24.4.'
  usage:
    - >
      The command is for IAM role sessions, not IAM users. Its documentation says it
      reads a profile from the AWS CLI configuration file, can target CloudFormation or
      another AWS service home page, and can print the generated sign-in URL instead of
      opening a browser.
related-packages:
  - id: brew:awscli
    reason: >
      Use AWS CLI to configure or refresh the named AWS profiles and role credentials
      that aws-console turns into a browser console session.
    rel: adjacent_workflow
    sources:
      - https://aws-cloudformation.github.io/rain/rain_console.html
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html
tags:
