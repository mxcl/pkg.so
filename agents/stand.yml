history:
  adoption-history:
    - >
      Stand is distributed directly for macOS and is also represented by the Homebrew
      Cask `stand`, allowing Mac package-manager users to install the small desktop
      utility alongside larger applications.
  package-nerd-significance:
    - >
      Stand exemplifies the long tail of highly focused macOS utilities captured by
      Homebrew Cask: one narrowly defined behavior, minimal setup, and native
      notification integration.
  project-history:
    - >
      The official site credits Fifth Floor, Red Davis, and Hector Simpson and says the
      application was built in their spare time. The product reached a second major
      generation and is presented as Stand 2.
  related-projects:
    - >
      It belongs to the broader class of break timers, posture reminders, and
      workplace-wellness utilities.
  sources:
    - https://getstandapp.com/
    - source_facts.package-manager
  summary:
    - >
      Stand is a small macOS wellness utility that reminds a user once per hour to leave
      the desk and stretch.
  timeline:
    - >
      2020: The official site copyright identifies Fifth Floor and credits Red Davis and
      Hector Simpson.
    - 'Stand 2: The official site presents the second major generation of the application.'
  usage:
    - >
      Choose a reminder time and leave the app running; while the user is at the Mac, it
      delivers an hourly notification to stand and stretch.
