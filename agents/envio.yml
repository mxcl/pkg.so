history:
  adoption-history:
    - >
      The input package facts list envio in Homebrew and Nix, while the official README
      documents installation through Cargo, Homebrew, release binaries, Linux packages,
      and a shell installer.
  package-nerd-significance:
    - >
      envio is notable for combining dotenv-style workflows, encrypted local state,
      profile-specific secrets, and packageable Rust CLI distribution across Cargo,
      Homebrew, binary releases, and Nix.
  project-history:
    - >
      The official repository was created in 2023. Its README presents envio as a secure
      CLI for managing environment variables, and the usage guide documents project
      initialization, profile creation, encryption modes, profile editing,
      import/export, key rotation, and a terminal UI.
  related-projects:
    - dotenv-style `.env` files
    - GPG
    - system keyrings
    - Cargo
    - Homebrew
  sources:
    - GitHub API for humblepenguinn/envio repository metadata.
    - Official envio README.
    - Official envio docs/usage.md.
    - Official envio source files src/bin/envio/config.rs, cmd/init.rs, and cmd/keyring.rs.
    - source_facts.package-manager
  summary:
    - >
      envio is a Rust command-line tool for creating encrypted environment-variable
      profiles and loading them into shells or one-off command executions.
  timeline:
    - '2023: Official GitHub repository created.'
    - '2026: Repository activity and official usage docs show ongoing development.'
  usage:
    - >
      Users run `envio init` in a project, create named profiles, store variables under
      `.envio/profiles`, and then use commands such as `envio shell`, `envio run`,
      `envio show`, `envio import`, and `envio export`.
related-packages:
  - id: brew:envelope
    reason: >
      Choose envelope when a single SQLite-backed project database with variable
      history, diff, revert, and whole-database locking is preferable to envio's
      independently encrypted profiles and keyring-oriented workflow.
    rel: alternative
    sources:
      - https://github.com/humblepenguinn/envio/blob/main/docs/usage.md
      - https://github.com/mattrighetti/envelope#readme
