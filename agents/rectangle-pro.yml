id: cask:rectangle-pro
display-name: Rectangle Pro
repo: null
docs:
  - https://rectangleapp.com/pro/docs/getting-started
  - https://rectangleapp.com/pro/docs/keyboard-shortcuts
  - https://rectangleapp.com/pro/docs/terminal-commands
config-file-location:
  macos:
    - ~/Library/Preferences/com.knollsoft.Hookshot.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Rectangle Pro is positioned for users who need more automation and customization
      than the free Rectangle application, including workspace layouts, custom snap
      targets, window throwing, stashing, and iCloud configuration sync.
    - >
      Its configuration can be imported from Rectangle, easing adoption by existing
      Rectangle users.
  package-nerd-significance:
    - >
      Rectangle Pro is a closed-source commercial companion to the popular open-source
      Rectangle window manager. Package users need to distinguish it from the separate
      rectangle cask and account for its trial and license activation.
    - >
      The retained Hookshot bundle identifier is a useful compatibility detail for
      shell-managed preferences, backups, and migrations.
  project-history:
    - >
      Rectangle Pro was initially named Hookshot and retains the bundle identifier
      com.knollsoft.Hookshot. It later became Rectangle Pro and is developed as a
      closed-source superset of Rectangle.
    - >
      The application builds on Rectangle's keyboard-driven window management while
      adding cursor-based Window Throw, custom layouts and positions, snap targets,
      stashing, and other power-user controls.
  related-projects:
    - Rectangle is the free, open-source window manager on which Rectangle Pro is based.
    - >
      Spectacle influenced Rectangle's shortcut conventions, which Rectangle Pro can
      optionally enable.
    - Charmstone is another macOS productivity application promoted by the same developer.
  sources:
    - https://rectangleapp.com/pro/
    - https://rectangleapp.com/pro/docs/general/
    - https://rectangleapp.com/pro/docs/getting-started/
    - https://rectangleapp.com/pro/docs/terminal-commands/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Rectangle Pro is Ryan Hanson's proprietary macOS window manager and a feature-rich
      superset of Rectangle. It originated under the name Hookshot and retains that name
      in its preferences domain.
  timeline:
    - 'Initial era: The application is released under the name Hookshot.'
    - >
      Later: Hookshot is renamed Rectangle Pro while retaining com.knollsoft.Hookshot as
      its bundle identifier.
    - >
      Current product: Rectangle Pro is distributed as a separate closed-source
      application and paid upgrade path alongside Rectangle.
  usage:
    - >
      Users move and resize windows with keyboard shortcuts, screen-edge snap areas,
      cursor gestures, custom positions, and saved multi-application layouts.
    - >
      Power users can manage hidden preferences with macOS defaults commands targeting
      com.knollsoft.Hookshot. The application can export and import JSON configuration
      and optionally sync configuration through iCloud.
