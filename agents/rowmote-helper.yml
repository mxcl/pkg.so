history:
  adoption-history:
    - >
      The developer maintains Rowmote Helper builds for a long span of Apple systems,
      from Mac OS X 10.4-era machines through modern macOS, as well as an archived build
      for first-generation Apple TV. This indicates long-lived support rather than a
      claim about user totals.
    - >
      The helper remains tied to the Rowmote and Rowmote Pro iOS clients, with the Pro
      client adding trackpad and keyboard input.
  package-nerd-significance:
    - >
      Rowmote Helper is a classic companion-app cask: the Mac-side helper is free, but
      its purpose is to serve a separately distributed mobile remote client.
    - >
      Its release archive reaching back to 2009 and its support for legacy Macs and
      Apple TV make it a small piece of Apple home-theater and Mac-mini remote-control
      history.
  project-history:
    - >
      Regular Rate & Rhythm has published Rowmote Helper release notes dating back to
      2009. The helper was designed to translate commands from the Rowmote iPhone and
      iPad clients into media, presentation, keyboard, and pointer actions on a Mac.
    - >
      Later releases adapted the helper to newer macOS security requirements, including
      Accessibility and Automation permissions, while retaining compatibility downloads
      for older systems.
  related-projects:
    - Rowmote Helper is the Mac companion to Rowmote and Rowmote Pro for iPhone and iPad.
    - >
      It supports interaction with applications such as VLC, Plex, Kodi, Keynote,
      PowerPoint, Spotify, Music, QuickTime, and Safari.
  sources:
    - https://regularrateandrhythm.com/apps/rowmote/
    - https://regularrateandrhythm.com/apps/rowmote/versions/
    - https://regularrateandrhythm.com/support/rowmote/
    - https://regularrateandrhythm.com/support/rowmote/mojave-trackpad--keyboard/
    - source_facts.description
  summary:
    - >
      Rowmote Helper is the macOS companion service that allows the Rowmote and Rowmote
      Pro iOS applications to control media, presentations, the pointer, and the
      keyboard over a local connection.
  timeline:
    - '2009: The official Rowmote Helper changelog archive begins.'
    - >
      Later releases: Compatibility builds were retained for Mac OS X 10.4 through newer
      macOS generations and first-generation Apple TV.
    - >
      2019-era macOS transition: The helper adopted Accessibility and Automation
      permission workflows required by newer macOS releases.
  usage:
    - >
      Install and run Rowmote Helper on the Mac to be controlled, then connect from
      Rowmote or Rowmote Pro on an iPhone or iPad. The helper normally starts at login
      and communicates over Wi-Fi, with Bluetooth tethering also documented.
    - >
      Media-style controls work with supported applications; Rowmote Pro additionally
      supplies a multitouch trackpad and keyboard. On modern macOS, those input features
      require Accessibility and Automation permission grants.
