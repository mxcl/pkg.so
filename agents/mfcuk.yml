id: brew:mfcuk
display-name: MFCUK
repo: https://github.com/nfc-tools/mfcuk
docs:
  - https://github.com/nfc-tools/mfcuk#readme
  - https://nfc-tools.github.io/projects/mfcuk
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The project occupies a narrow but recognizable place in the NFC research
      toolchain: it combines libnfc-compatible readers, crapto1-related cryptanalytic
      code, and MIFARE Classic attack demonstrations in a command-line package. The
      README credits researchers, Proxmark/libnfc contributors, and the Nethemba team,
      and it explicitly points to MFOC as the earlier open-source GPL
      nested-authentication key recovery implementation.
  sources:
    - https://formulae.brew.sh/formula/mfcuk
    - https://github.com/nfc-tools/mfcuk
    - https://nfc-tools.github.io/projects/mfcuk/
    - https://raw.githubusercontent.com/nfc-tools/mfcuk/master/AUTHORS
    - https://raw.githubusercontent.com/nfc-tools/mfcuk/master/README
  summary:
    - >
      MFCUK, the MiFare Classic Universal toolKit, is an nfc-tools project for MIFARE
      Classic security research. Its README identifies the main tool as a Mifare Classic
      DarkSide key recovery tool, previously known as zv_mf_dark_side, and lists a
      bibliography of MIFARE Classic cryptanalysis work from the late 2000s. The AUTHORS
      file names Andrei Costin as author, with Romuald Conty contributing libnfc ports
      and the Nethemba Core Team contributing core autoconf/automake/configure and
      packaging work.
  usage:
    - >
      In practice, MFCUK is used by security researchers and NFC auditors working with
      owned or authorized MIFARE Classic tags. It is packaged in Homebrew,
      Debian/Ubuntu, and Nix as a specialist CLI rather than a general NFC SDK; it sits
      beside libnfc, MFOC, Proxmark-oriented tooling, and other MIFARE Classic analysis
      utilities.
related-packages:
  - id: brew:mfoc
    reason: >
      Choose MFOC when one card key is already known and an offline nested attack is
      appropriate; choose MFCUK for its documented DarkSide-oriented recovery path.
    rel: alternative
    sources:
      - https://github.com/nfc-tools/mfcuk
      - https://github.com/nfc-tools/mfoc
  - id: brew:libnfc
    reason: >
      Install libnfc for the reader-access layer used by MFCUK's documented libnfc ports
      and NFC hardware workflow.
    rel: adjacent_workflow
    sources:
      - https://raw.githubusercontent.com/nfc-tools/mfcuk/master/AUTHORS
      - https://github.com/nfc-tools/libnfc
