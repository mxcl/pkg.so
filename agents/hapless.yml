id: brew:hapless
display-name: hapless
repo: https://github.com/bmwant/hapless
docs:
  - https://bmwant.link/hapless-easily-run-and-manage-background-processes
  - https://github.com/bmwant/hapless#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation with uv, pipx, pip, and Homebrew. That
      is a narrow but useful adoption surface for Python-oriented command-line users who
      want a lightweight process runner rather than a full supervisor.
  package-nerd-significance:
    - >
      hapless occupies the gap between ad hoc `nohup`/shell job control and full process
      managers such as Supervisor. It is package-manager-interesting mostly because it
      gives a short, memorable executable, `hap`, to a common local-automation task
      without requiring a service manager.
  project-history:
    - >
      The author introduced hapless in a 2022-11-13 post as a Python project for running
      and tracking background processes more conveniently than raw shell job-control
      patterns. The README defines the tool as the simplest way of running and tracking
      processes in the background.
  related-projects:
    - >
      The README explicitly points users to Rich for console UI ideas and Supervisor as
      the full-fledged process-manager alternative.
  sources:
    - https://bmwant.link/hapless-easily-run-and-manage-background-processes
    - https://formulae.brew.sh/formula/hapless
    - https://github.com/bmwant/hapless
  summary:
    - >
      hapless is a small Python CLI for launching and tracking background processes. It
      wraps the common shell need to detach long-running jobs, keep logs, and check
      status later.
  timeline:
    - '2022-11-13: Author blog post introduces hapless as a recently developed Python project.'
    - '2020s: Official README documents uv, pipx, pip, and Homebrew installation paths.'
  usage:
    - >
      The main command pattern is `hap run -- <command>`, followed by `hap`, `hap
      status`, `hap logs`, `hap pause`, `hap resume`, `hap signal`, and `hap clean` for
      monitoring and lifecycle actions. The blog post emphasizes detached execution,
      output redirection, generated IDs, custom names, and later log inspection.
related-packages:
  - id: brew:supervisor
    reason: >
      Choose Supervisor when processes need persistent client/server supervision,
      boot-time startup, automatic restarts, groups, or configured control interfaces;
      choose hapless for daemonless per-user background jobs with no required
      configuration.
    rel: alternative
    sources:
      - https://github.com/bmwant/hapless/blob/main/USAGE.md
      - https://supervisord.org/
