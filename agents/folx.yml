history:
  adoption-history:
    - >
      Folx has been maintained across many macOS generations, with the official release
      record documenting version 5 releases from 2016 through 2026. Later updates added
      compatibility for Apple silicon and successive macOS releases.
    - >
      The application follows a free-and-Pro model. Core download management is free,
      while Pro adds features such as scheduling, per-task speed controls, more download
      threads, built-in torrent search, password saving, and Music integration. It is
      also available through Homebrew Cask.
  package-nerd-significance:
    - >
      Folx occupies the Mac-specific niche between a browser downloader and a full
      BitTorrent client. Its Homebrew cask lets users manage a proprietary GUI
      networking utility through the same declarative workflow used for developer tools.
    - >
      Features such as browser link interception, magnet-link handling, proxy support,
      resumable transfers, torrent controls, and scheduled bandwidth use make it
      particularly relevant to users who treat downloads as managed jobs rather than
      one-off browser actions.
  project-history:
    - >
      Electronic Team developed Folx as a download manager and torrent client for macOS.
      By Folx 5.0 in May 2016, the application had a redesigned interface, a Pro
      password manager, per-task speed limits, enhanced torrent search, default-client
      support for torrent files and magnet links, and a reworked scheduler.
    - >
      The 5.x line continued to track browser and macOS changes. Its official release
      history records Big Sur support, browser-extension fixes, renewed torrent work,
      and optimization for Apple-silicon Macs.
  related-projects:
    - >
      Folx browser extensions integrate the download manager with Safari, Chrome,
      Firefox, and Opera.
    - Folx can integrate completed tagged media downloads with Apple's Music application.
  sources:
    - 'Official product page: https://mac.eltima.com/download-manager.html'
    - >
      Official release history:
      https://help.electronic.us/support/solutions/articles/44002276858-what-s-new-in-this-version-of-folx
    - 'Official user guide: https://help.electronic.us/support/solutions/folders/44001226321'
    - source_facts.package-manager identifies the Homebrew cask.
  summary:
    - >
      Folx is Electronic Team's macOS download manager and BitTorrent client. It
      combines resumable and multi-threaded direct downloads with smart tags, browser
      integration, proxy support, magnet links, and optional Pro scheduling and
      bandwidth features.
  timeline:
    - >
      2016-05-26: Folx 5.0 introduced a redesigned interface and expanded Pro download
      and torrent controls.
    - >
      2020: The 5.x line added Big Sur compatibility and continued improving torrent and
      browser integration.
    - '2021: Added macOS 11 compatibility fixes and browser-extension improvements.'
    - '2025–2026: Renewed torrent improvements and added optimized Apple-silicon support.'
  usage:
    - >
      Paste a direct URL into Folx, intercept a supported link through its browser
      extension, or open a torrent file or magnet link. Before starting, choose a
      destination and tags; Pro users can additionally schedule the task, apply speed
      controls, search for torrents, and split direct downloads into more threads.
