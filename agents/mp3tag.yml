history:
  adoption-history:
    - >
      The original Windows application accumulated an international user community over
      more than two decades. A native macOS edition broadened the project's reach, with
      its public alpha beginning in 2020 and regular releases continuing afterward.
  package-nerd-significance:
    - >
      Mp3tag is a durable specialist utility in desktop package collections because it
      handles metadata across many audio formats while supporting repeatable power-user
      workflows such as actions, converters, playlists, exports, and online tag sources.
    - >
      The macOS edition is a native Swift application rather than a direct packaging of
      the older Windows interface, making it an interesting example of a long-running
      utility being reimplemented for another platform.
  project-history:
    - >
      Florian Heidenreich created Mp3tag for Windows more than twenty years before the
      current macOS releases. He began actively considering a native Mac version in
      early 2017, learned Swift for the project, and published the first macOS alpha in
      May 2020.
  related-projects:
    - The macOS product shares its name and tagging concepts with Mp3tag for Windows.
    - >
      Its Tag Sources system commonly integrates metadata and artwork from services such
      as MusicBrainz and Discogs.
  sources:
    - https://docs.mp3tag.de/
    - https://mp3tag.app/about/
    - https://mp3tag.app/changelog/
  summary:
    - >
      Mp3tag is an audio and video metadata editor for macOS, designed for editing tags,
      artwork, filenames, playlists, and related library information individually or in
      batches.
  timeline:
    - 'Early 2017: Development planning began for a native macOS edition.'
    - '2020: The first public Mp3tag for Mac alpha was released.'
    - '2021: Version 1.2 added playlists, exports, and advanced filtering.'
    - '2023: Version 1.8 expanded configurable Tag Sources.'
    - '2026: The native Mac edition continued receiving feature and compatibility releases.'
  usage:
    - >
      Users load files or folders, edit metadata and cover artwork in the Tag Panel, and
      save changes back to supported media containers.
    - >
      Power users combine format strings, converters, action groups, exports, playlists,
      and configurable online Tag Sources for bulk library maintenance.
