history:
  adoption-history:
    - >
      GAMA grew from the Vietnamese-French MSI research team into a project maintained
      by a consortium of academic and industrial partners led by UMMISCO. The official
      project documentation describes use across urban mobility, epidemiology, disaster
      evacuation, climate adaptation, urban planning, visualization, and teaching.
    - >
      Its long release line, model library, tutorials, plugins, headless execution, and
      interoperability with tools such as R and Python have made it a reusable research
      platform rather than a single-purpose simulator.
  package-nerd-significance:
    - >
      GAMA combines an Eclipse-based IDE, the domain-specific GAML language, GIS-aware
      primitives, batch parameter exploration, and 2D/3D visualization in one
      distribution. The `gama-jdk` cask is especially useful because it supplies a
      compatible Java runtime with the desktop application, avoiding a common source of
      Java application packaging friction.
  project-history:
    - >
      GAMA development began in 2007 within the MSI team at IFI in Hanoi and the
      IRD/Sorbonne UMMISCO research unit. GAMA 1.1 in October 2009 was described by the
      project as its first real release and its first open-source release.
    - >
      The platform moved from an XML-oriented modeling language to an
      Eclipse/Xtext-based IDE and revamped language in GAMA 1.4. Later releases expanded
      performance, 3D support, batch exploration, plugins, server control, and
      cross-platform compatibility.
  related-projects:
    - GAML
    - Eclipse RCP
    - Xtext
    - GAMA Server
  sources:
    - https://gama-platform.org/wiki/
    - https://gama-platform.org/wiki/OlderVersions
    - https://gama-platform.org/wiki/Overview
  summary:
    - >
      GAMA is an open-source, cross-platform environment for writing, running,
      visualizing, and exploring spatially explicit agent-based models.
  timeline:
    - '2007: Development began in the MSI Vietnamese-French research team.'
    - '2009-10: GAMA 1.1 became the first open-source public release.'
    - '2011-12: GAMA 1.4 introduced an Eclipse/Xtext IDE and a redesigned modeling language.'
    - '2020-06: GAMA 1.8.1 became the last release based on JDK 8.'
    - >
      2022-05: GAMA 1.8.2 added JDK 17, Apple Silicon, macOS Monterey, and Windows 11
      compatibility.
    - '2024-01: GAMA 1.9.3 integrated GAMA Server into the normal interface.'
    - '2025-06: The project adopted date-based release naming.'
  usage:
    - >
      Modelers create GAML projects, define agent species and experiments, import
      spatial and tabular data, and run interactive or batch simulations. The IDE
      supplies editors, validation, parameter exploration, charts, maps, and 2D/3D
      displays.
    - >
      Headless tools and GAMA Server support automated experiments and integration with
      external workflows, while the desktop environment remains the primary interactive
      authoring surface.
