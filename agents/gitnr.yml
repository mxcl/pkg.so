history:
  adoption-history:
    - >
      gitnr targets the common bootstrapping moment when a developer starts a repository
      and wants a sensible ignore file without manually copying template snippets. Its
      documented installation paths include Homebrew, Cargo, cargo-binstall, NetBSD
      packages, platform install scripts, and binary releases.
  package-nerd-significance:
    - >
      For package catalogs, gitnr is notable as a thin wrapper around shared
      ignore-template ecosystems rather than a new ignore syntax. Its value is packaging
      the template lookup, duplicate filtering, caching, and cross-platform install
      story into one small executable.
  project-history:
    - >
      The project appeared on GitHub in August 2023 and published its v0.1.0 release the
      same day. Its README explains the origin plainly: the author wanted consistent
      `.gitignore` generation, modular template composition, and a small Rust learning
      project.
  related-projects:
    - >
      gitnr depends on the GitHub gitignore template collection and the TopTal gitignore
      collection as source material for generated files.
  sources:
    - https://api.github.com/repos/reemus-dev/gitnr
    - https://api.github.com/repos/reemus-dev/gitnr/releases
    - https://crates.io/api/v1/crates/gitnr
    - https://github.com/reemus-dev/gitnr
    - https://raw.githubusercontent.com/reemus-dev/gitnr/main/readme.md
  summary:
    - >
      gitnr is a Rust CLI for generating `.gitignore` files from reusable templates. It
      combines templates from the GitHub and TopTal collections with local files, remote
      URLs, or files from public GitHub repositories.
  timeline:
    - '2023: Repository created on GitHub.'
    - '2023: v0.1.0 release published.'
    - '2023: gitnr crate published on crates.io.'
  usage:
    - >
      Practitioners use `gitnr create` with template names such as `gh:Rust` or
      `tt:clion+all`, optionally combining several templates into one generated ignore
      file. The `gitnr search` mode provides an interactive browser for previewing and
      selecting templates.
related-packages:
  - id: brew:git-ignore
    reason: >
      git-ignore is an alternative .gitignore generator with offline caching,
      user-defined aliases, custom templates, and automatic template matching, while
      gitnr emphasizes composing GitHub and Toptal templates plus local or remote files.
    rel: alternative
    sources:
      - https://github.com/reemus-dev/gitnr#readme
      - https://github.com/sondr3/git-ignore#readme
