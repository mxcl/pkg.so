history:
  adoption-history:
    - >
      The official update history shows a long multi-major-version lifecycle, including
      sandboxing, standalone-app operation, localization, Apple-silicon support, and
      updates for successive macOS designs. Homebrew Cask also distributes the
      application.
  package-nerd-significance:
    - >
      DesktopUtility is representative of the small, focused macOS utilities commonly
      installed as casks: it exposes several Finder and desktop maintenance actions
      without requiring users to remember individual defaults commands or
      process-restart commands.
  project-history:
    - >
      DesktopUtility began as a compact SweetP Productions utility and evolved through
      at least six major version families. Version 2 adopted sandboxing, version 3 added
      standalone operation and separate preferences, version 4 added a redesigned
      interface and later native Apple-silicon support, and version 6 updated the
      application for macOS Tahoe.
  related-projects:
    - >
      DesktopUtility belongs to SweetP Productions' collection of focused Mac utilities,
      alongside ScreenSaver Start, Invisible, Hides, and USBclean.
  sources:
    - https://sweetpproductions.com/
    - https://sweetpproductions.com/products/desktoputility/updates.htm
    - source_facts.package-manager
  summary:
    - >
      DesktopUtility is a SweetP Productions macOS utility providing quick access to
      system and desktop tasks.
  timeline:
    - 'Version 1.0: Initial release'
    - 'Version 2.0: Sandboxed application introduced'
    - 'Version 3.0: Standalone operation and separate preferences added'
    - 'Version 4.4: Native Apple-silicon support added'
    - 'Version 6.0: Updated for macOS Tahoe'
  usage:
    - >
      The application can hide desktop items, toggle hidden-file visibility, reveal the
      user's Library folder, force-empty the Trash, and restart Finder, Dock, or the
      menu bar.
    - >
      It is suited to occasional interactive maintenance tasks rather than background
      system management.
