history:
  adoption-history:
    - >
      Its Java foundation made muCommander available across macOS, Windows, Linux, BSD,
      Solaris, and other Java-capable systems. The official site distributes native
      packages for major desktop platforms, while the supplied package metadata records
      availability through Homebrew Cask.
  package-nerd-significance:
    - >
      muCommander is notable as a graphical, dual-pane file manager that packages a
      broad collection of local, remote, cloud, and archive protocols behind one
      interface. Its portable distribution and human-readable XML customization files
      also suit users who move workflows between systems.
  project-history:
    - >
      muCommander developed as an open-source, GPL-licensed file manager built around
      the orthodox dual-pane interface. The project has continued to modernize its Java
      application and packaging while retaining portable and cross-platform editions.
  related-projects:
    - >
      Its interface belongs to the dual-pane file-manager tradition associated with
      commander-style tools. The project also integrates protocols and services
      including FTP, SFTP, SMB, NFS, Amazon S3, Hadoop HDFS, Dropbox, and Google Drive.
  sources:
    - https://github.com/mucommander/mucommander
    - https://github.com/mucommander/mucommander/wiki/Preference-Files
    - https://www.mucommander.com/
    - 'input: source_facts.package-manager.brew-cask'
  summary:
    - >
      muCommander is an open-source, cross-platform dual-pane file manager. It combines
      ordinary file operations with archive handling, remote filesystems, cloud
      services, bookmarks, saved credentials, and extensive interface customization.
  timeline:
    - >
      The project established a cross-platform Java application with portable and
      platform-specific distributions.
    - >
      Later development expanded remote-filesystem, cloud-storage, archive, and
      customization support.
  usage:
    - >
      Users commonly employ muCommander for side-by-side copying, moving, renaming,
      browsing archives, and working with remote filesystems. Advanced users can
      customize shortcuts, commands, toolbars, themes, bookmarks, associations, and
      saved connections through XML files in its preferences directory.
