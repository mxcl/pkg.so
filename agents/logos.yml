history:
  adoption-history:
    - >
      Logos grew from a home-based operation into a major developer of Christian-market
      software and multilingual electronic publishing. Its model joined a searchable
      digital library with increasingly sophisticated original-language, tagging, and
      research tools.
    - >
      The product developed a durable ecosystem of purchased libraries, free and
      subscription access, desktop, web, and mobile clients, training resources,
      publisher relationships, and synchronized personal study data.
  package-nerd-significance:
    - >
      Logos is an unusually long-lived commercial knowledge platform whose locally
      downloaded library, indexes, metadata, documents, and user data can occupy
      substantial storage. Installation is therefore followed by a potentially lengthy
      library download and indexing process.
    - >
      For package users, removing or replacing the application bundle is distinct from
      deleting the large Logos4 data directory. Preserving that directory can avoid
      downloading and rebuilding the entire local library and search index.
  project-history:
    - >
      Logos Research Systems was founded in 1992 by former Microsoft employees Bob
      Pritchett and Kiernon Reiniger with Dale Pritchett. Logos Bible Software for
      Windows 1.0 launched in January 1992 as an early commercial Windows Bible-study
      application.
    - >
      Version 2.0 followed in 1995 and was an early commercial adopter of Unicode. The
      Series X line launched in 2001 on the Libronix Digital Library System, and Logos
      Bible Software 3 followed in 2006 with features including reverse interlinear
      Bibles and syntactic tagging.
    - >
      Later generations expanded onto macOS, the web, and mobile devices while retaining
      the combination of licensed digital books, local indexing, linked resources,
      guides, notes, workflows, and specialist biblical-language research.
  related-projects:
    - Libronix Digital Library System was the architecture behind Logos Series X and Logos 3.
    - Verbum is a related Catholic-oriented application built on the Logos platform.
    - >
      The Logos web and mobile applications complement the full desktop application and
      synchronize through a Logos account.
  sources:
    - 'Official 30-year retrospective: https://www.logos.com/grow/30-years/'
    - 'Official company background: https://www.logos.com/media/mediakit/logos_backgrounder.pdf'
    - >
      Official getting-started guide:
      https://support.logos.com/hc/en-us/articles/20992955425549-Getting-Started-with-Logos
    - 'Official help center: https://support.logos.com/hc/en-us'
  summary:
    - >
      Logos Bible Study is a commercial digital-library and research platform for
      reading Scripture, searching theological resources, studying biblical languages,
      preparing sermons, taking notes, and managing study workflows.
  timeline:
    - >
      1992: Logos Research Systems was founded and Logos Bible Software 1.0 launched for
      Windows.
    - '1995: Logos 2.0 introduced an early commercial use of Unicode.'
    - '2001: Logos Bible Software Series X launched on the Libronix Digital Library System.'
    - >
      2006: Logos Bible Software 3 added reverse interlinear and syntactic-tagging
      capabilities.
    - '2009: Logos 4 began a newer generation of the desktop platform.'
    - '2022: Logos marked thirty years and released Logos 10.'
  usage:
    - >
      Users sign in with a Logos account, download all or part of their licensed
      library, and allow the desktop application to build local search indexes. Books,
      commentaries, lexicons, datasets, notes, guides, and workflows are then linked
      around passages and research topics.
    - >
      Common workflows include devotional reading, original-language study, passage and
      topic research, sermon preparation, citation and note management, reading plans,
      personal books, and searching an entire theological library.
