history:
  adoption-history:
    - >
      The project targets users and applications that want Bitcoin validation without
      the operational overhead of traditional full nodes. Its adoption path is therefore
      split between node operators using florestad and application developers embedding
      libfloresta.
    - >
      Official packaging in this batch is Homebrew, and the upstream README points users
      to Unix and macOS build instructions, API documentation, an mdBook, community
      channels, and a 2026 roadmap.
  package-nerd-significance:
    - >
      Floresta is package-nerd significant because it packages an experimental but
      practical Bitcoin validation stack as ordinary CLI artifacts, making
      Utreexo-oriented validation easier to try outside of source checkouts.
    - >
      It is also interesting as a Rust project that blends library crates, a daemon,
      Bitcoin Core validation components, and package-manager distribution into one
      installable client.
  project-history:
    - >
      The project identifies its name as a reference to the Utreexo accumulator, a
      forest of Merkle trees. Its architecture uses modern Bitcoin validation techniques
      including Utreexo, proof-of-work fraud proofs, and pruning to reduce resource
      requirements while preserving validation goals.
    - >
      Floresta is organized around libfloresta, a set of reusable client components, and
      florestad, a daemon that builds on those components to provide a full node,
      watch-only wallet, and Electrum server. Its first listed GitHub release is v0.1.0
      at the end of 2022, followed by regular 0.x releases.
  related-projects:
    - libfloresta provides reusable Rust client components.
    - florestad is the full-node daemon built on libfloresta.
    - >
      Bitcoin Core, rust-bitcoinkernel, Rust Bitcoin, Rust Miniscript, and Utreexo are
      identified by the upstream README as related technology.
  sources:
    - https://docs.getfloresta.sh/
    - https://getfloresta.github.io/floresta
    - https://github.com/getfloresta/Floresta
    - https://github.com/getfloresta/Floresta/releases
  summary:
    - >
      Floresta is a Rust Bitcoin client designed to provide strong validation with lower
      resource requirements than a traditional full node. It can run as a standalone
      validating node or be embedded as reusable client components.
  timeline:
    - '2022: Floresta v0.1.0 is released.'
    - >
      2023: 0.2 through 0.5 releases add and refine client components, including the p2p
      module release.
    - '2024: 0.6.0 and 0.7.0 releases continue the 0.x line.'
    - '2025: Floresta v0.8.0 is released.'
  usage:
    - >
      Users can run florestad as a validating node, while developers can link
      libfloresta components into Bitcoin applications. The daemon includes a watch-only
      wallet and Electrum server, making the CLI package useful both for node operation
      and integration testing.
    - >
      Floresta also uses rust-bitcoinkernel, a wrapper around Bitcoin Core's
      libbitcoinkernel, to validate blocks, transaction outputs, and block data with
      Bitcoin Core's validation engine.
related-packages:
  - id: brew:bitcoin
    reason: >
      Choose Bitcoin Core for the mature conventional full-node implementation and
      broader node ecosystem; choose Floresta when lower-resource Utreexo-based
      validation or embeddable Rust components are the priority.
    rel: alternative
    sources:
      - https://github.com/getfloresta/Floresta
      - https://bitcoincore.org/en/about/
