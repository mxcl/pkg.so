id: cask:reaper
display-name: REAPER
repo: null
docs:
  - https://www.reaper.fm/userguide.php
config-file-location:
  macos:
    - ~/Library/Application Support/REAPER/REAPER.ini
credentials-file-location:
  macos:
    - ~/Library/Application Support/REAPER/reaper-reginfo.dat
    - ~/Library/Application Support/REAPER/reaper-reginfo.ini
history:
  adoption-history:
    - >
      REAPER is offered as one full-featured edition for both hobbyists and professional
      studios, with a 60-day evaluation period. Its official site emphasizes an active
      user forum and frequent, lightweight updates.
  package-nerd-significance:
    - >
      REAPER is notable for combining a small installer and portable-install capability
      with unusually deep customization. Actions, macros, Lua, EEL, and Python
      ReaScripts make it attractive to users who treat a DAW as an extensible
      workstation rather than a fixed appliance.
    - >
      The Homebrew cask provides a reproducible macOS installation path for an otherwise
      conventionally distributed proprietary desktop application.
  project-history:
    - >
      REAPER is a proprietary digital audio workstation developed by Cockos. It evolved
      into a cross-platform production environment covering audio and MIDI recording,
      composition, editing, mixing, mastering, effects, automation, and scripting.
  related-projects:
    - Cockos ReaPlugs
    - ReaScript
    - SWS/S&M Extension
  sources:
    - https://www.reaper.fm/about.php
    - https://www.reaper.fm/userguide.php
    - source_facts.package-manager.brew-cask
    - source_facts.version
  summary:
    - >
      REAPER is a compact, cross-platform digital audio workstation distributed by
      Cockos. Package-oriented users value its small footprint, portable-install
      support, rapid release cadence, plain configuration resources, and extensive
      scripting and extension facilities.
  timeline:
    - '2026: The supplied Homebrew cask record tracks REAPER 7.79.'
  usage:
    - >
      Used to record and overdub audio or MIDI, arrange and edit projects, run effects,
      mix, render, and master finished work. Advanced workflows commonly use custom
      actions, controller mappings, scripts, screensets, templates, and third-party
      extensions.
tags:
