id: cask:ultimaker-cura
display-name: UltiMaker Cura
repo: null
docs:
  - https://github.com/Ultimaker/Cura/wiki
  - https://github.com/Ultimaker/Cura/wiki/Cura-Preferences-and-Settings-Locations
  - https://ultimaker.com/software/ultimaker-cura
config-file-location:
  linux:
    - ~/.config/cura/$CURA_VERSION/cura.cfg
    - ~/.local/share/cura/$CURA_VERSION/
  macos:
    - $USER/Library/Application Support/Cura/$CURA_VERSION/cura.cfg
    - $USER/Library/Application Support/Cura/$CURA_VERSION/
  windows:
    - '%APPDATA%\cura\$CURA_VERSION\cura.cfg'
    - '%APPDATA%\cura\$CURA_VERSION\'
credentials-file-location: null
history:
  adoption-history:
    - >
      Cura began as software for Ultimaker printers but expanded into a broadly
      compatible open-source slicer with community-maintained printer, material, and
      quality profiles.
    - >
      UltiMaker describes Cura as used and trusted at large scale, with support for many
      third-party printers and contributions incorporated through regular open-source
      releases.
    - >
      A plugin system available to community developers since 2015, together with the
      UltiMaker Marketplace, broadened Cura from a slicer into an extensible
      print-preparation platform.
  package-nerd-significance:
    - >
      Cura is a reference desktop package in hobbyist and professional fused-filament 3D
      printing. Its open profiles and extensive settings make it both a turnkey slicer
      and a common target for printer-definition, material-profile, and plugin
      packaging.
    - >
      Its architecture separates the Cura front end, the Uranium application framework,
      CuraEngine, profiles, plugins, and build artifacts. That modularity—and its
      cross-platform binary distribution—makes Cura especially relevant to maintainers
      interested in large Python, Qt, and C++ desktop applications.
  project-history:
    - >
      Cura was first released in 2011 and was developed by David Braam for Ultimaker's
      early printers. It subsequently evolved into an open-source slicer compatible with
      a wider range of printer vendors.
    - >
      The project grew around a Python and Qt front end, the Uranium framework, and
      CuraEngine. Community printer definitions, material profiles, translations,
      plugins, and code contributions became a continuing part of its development model.
    - >
      The product branding later changed from Ultimaker Cura to UltiMaker Cura following
      the Ultimaker–MakerBot combination, while the established Cura repository and
      open-source contribution workflow continued.
  related-projects:
    - CuraEngine performs the core slicing work.
    - Uranium supplies the reusable application framework underlying the Cura interface.
    - The UltiMaker Marketplace distributes Cura plugins and material profiles.
    - >
      Printer-definition, binary-data, and Conan-configuration repositories support
      Cura's broader build and profile ecosystem.
  sources:
    - https://github.com/Ultimaker/Cura
    - https://github.com/Ultimaker/Cura/wiki/Project-Overview
    - https://ultimaker.com/de/learn/evolution-of-3d-printing-applications/
    - https://ultimaker.com/learn/ultimaker-cura-5-5-stable-release-notes/
    - https://ultimaker.com/software/ultimaker-cura/
  summary:
    - >
      UltiMaker Cura is a free, open-source, cross-platform 3D-print preparation
      application. It turns models into printer instructions while managing printers,
      materials, quality profiles, plugins, and hundreds of slicing settings.
  timeline:
    - '2011: Cura was first released, initially for Ultimaker printers.'
    - "2015: Cura's community plugin capability was established."
    - '2022: Cura 5.0 introduced a new variable-line-width slicing engine.'
    - '2023: Product branding in the application moved from Ultimaker to UltiMaker.'
  usage:
    - >
      A typical workflow adds a printer, imports a 3D model, chooses material and
      quality profiles, adjusts recommended or custom settings, slices the model,
      previews the toolpath, and saves or sends the resulting print job.
    - >
      Users can install community plugins and material profiles through the Marketplace
      and can maintain reusable printer and quality profiles.
    - >
      For troubleshooting, Cura exposes Help → Show Configuration Folder; project files
      preserve printer and slicing settings for reproducibility and support reports.
