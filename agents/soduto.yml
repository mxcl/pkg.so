history:
  adoption-history:
    - >
      Soduto served macOS users who wanted KDE Connect-compatible interaction with
      phones and other computers. Its official repository also notes an unofficial
      Homebrew cask installation route. The original maintainers now state that the
      project is no longer under development and advise users to evaluate any forks
      carefully because the application can access private device data.
  package-nerd-significance:
    - >
      Soduto brought the KDE Connect protocol ecosystem to macOS as a native, sandboxed
      application. It is notable to package users as a cross-platform interoperability
      tool and as an example of Homebrew Cask distributing an independent open-source
      Mac application outside the Mac App Store.
  project-history:
    - >
      Soduto began with device pairing, clipboard sharing, file and URL transfer, phone
      and SMS notifications, SMS replies, and a find-my-phone function using KDE Connect
      protocol version 7. Later beta releases added desktop SMS sending, battery
      information, multiple-file transfer, and remote file browsing. Version 1.0 added a
      setup wizard, Swift 4 migration, macOS 10.13 support, and network and transfer
      improvements; version 1.0.1 followed with a link-sharing fix.
  related-projects:
    - KDE Connect
    - GSConnect
    - Valent
  sources:
    - https://github.com/soduto/Soduto
    - https://soduto.com/downloads/
  summary:
    - >
      Soduto is an open-source KDE Connect-compatible client for macOS. It links Macs
      with phones, tablets, and other computers for notifications, clipboard exchange,
      file sharing, remote browsing, SMS-related functions, and device status.
  timeline:
    - >
      v0.1 beta: Introduced pairing, clipboard and file sharing, notifications, SMS
      replies, and find-my-phone.
    - 'v0.2 beta: Added sending SMS messages from the desktop.'
    - 'v0.3 beta: Added battery status, low-battery notifications, and multiple-file sharing.'
    - 'v0.4 beta: Added remote file browsing.'
    - 'v1.0: Added the setup wizard, Swift 4 migration, and macOS 10.13 support.'
    - 'v1.0.1: Fixed link sharing from Chrome.'
    - 'Current status: The original repository is no longer under development.'
  usage:
    - >
      Install Soduto on macOS and pair it with a KDE Connect-compatible device on the
      same network. Features depend on the paired device and enabled plugins. The
      official release notes state that pairing certificates are stored in macOS
      Keychain and that the application uses macOS sandboxing.
