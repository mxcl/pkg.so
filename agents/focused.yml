history:
  adoption-history:
    - >
      Focused was sold as a commercial Mac writing application and later distributed
      through the Homebrew Cask named `focused`. The official developer forum records a
      second major version and a later transfer to Codebots.
  package-nerd-significance:
    - >
      Focused is a classic packaged Mac productivity application: a commercial GUI
      editor delivered as an application bundle, with Homebrew Cask providing
      command-line installation despite the absence of a public source repository.
  project-history:
    - >
      Focused originated from Typed, a writing application created by Realmac Software.
      71Squared acquired the application and repositioned it as Focused, emphasizing
      distraction-free Markdown writing.
    - >
      The developer later released Focused 2 as a free upgrade for existing users. An
      official forum announcement says the application was subsequently transferred to
      Codebots, a company founded by the same developer.
  related-projects:
    - Typed by Realmac Software was Focused's predecessor.
    - Codebots became the later home identified in the developer's forum announcement.
    - Deep Dreamer was acquired alongside Focused, according to the official forum.
  sources:
    - 'Official Focused forum: https://forum.71squared.com/category/6/focused'
    - 'Official product page: https://www.71squared.com/focused'
    - 'Package provenance: source_facts.package-manager and source_facts.provenance'
  summary:
    - >
      Focused is a commercial distraction-free Markdown editor for macOS, derived from
      Realmac Software's Typed application and developed under the Focused name by
      71Squared.
  timeline:
    - >
      After Typed: 71Squared acquired the application from Realmac Software and
      introduced it as Focused.
    - >
      Focused 2: 71Squared released a second major version as a free upgrade for
      existing users.
    - 'Later: The developer announced that Focused was moving to Codebots.'
  usage:
    - >
      Focused provides Markdown editing, word and character counts, macOS Auto Save and
      Versions, keyboard shortcuts, themes, typewriter mode, soundtracks, and HTML or
      RTF export.
    - >
      Users can open the built-in Markdown syntax reference from the Help menu.
      Preferences are available through the application, but official sources do not
      document a configuration-file path.
