id: brew:gitlogue
display-name: gitlogue
repo: null
docs:
  - https://github.com/unhappychoice/gitlogue/tree/main/docs
  - https://github.com/unhappychoice/gitlogue#readme
config-file-location:
  unix:
    - ~/.config/gitlogue/config.toml
    - .gitlogue-ignore
credentials-file-location: null
history:
  adoption-history:
    - >
      Because gitlogue is young, its adoption history is thinner than long-lived Git
      tools. Its early visibility comes from GitHub interest, crates.io distribution,
      Homebrew packaging, Arch and Nix entries, and terminal-tool showcases referenced
      by the README.
  package-nerd-significance:
    - >
      gitlogue is package-nerd interesting as a modern Rust TUI shipped through Cargo,
      Homebrew, Nix, Arch, and an install script soon after its initial repository
      creation. It shows how fast small terminal tools can become multi-channel packages
      when the binary is self-contained.
  project-history:
    - >
      The repository was created in November 2025 by unhappychoice. Its README presents
      the project as a cinematic Git commit replay tool with typing animation, syntax
      highlighting, file tree transitions, themes, and a screensaver mode.
    - >
      Early releases quickly added practical visualization features, including a diff
      subcommand, theme additions, file-specific speed rules, date filtering, and more
      language support through tree-sitter.
  related-projects:
    - >
      GitType, from the same author, is listed as a related Git visualization and coding
      project.
    - >
      Terminal screensaver projects such as cbonsai, cmatrix, and pipes.sh are named in
      the README as neighboring terminal-display tools.
  sources:
    - https://api.github.com/repos/unhappychoice/gitlogue
    - https://api.github.com/repos/unhappychoice/gitlogue/releases?per_page=5
    - https://formulae.brew.sh/formula/gitlogue
    - https://github.com/unhappychoice/gitlogue
    - https://github.com/unhappychoice/gitlogue/tree/main/docs
    - https://raw.githubusercontent.com/unhappychoice/gitlogue/main/README.md
  summary:
    - >
      gitlogue is a Rust terminal application that replays Git commit history as an
      animated, cinematic view of code changes. It belongs to the family of terminal
      visualization tools rather than build or release automation.
  timeline:
    - '2025: The unhappychoice/gitlogue repository was created.'
    - '2025: v0.5.0 added date filtering and additional language support.'
    - '2026: v0.7.0 added a diff subcommand for working tree changes.'
    - '2026: v0.9.0 added more syntax-highlighting support and language injection handling.'
  usage:
    - >
      Practitioners use gitlogue for demos, teaching, presentations, content creation,
      ambient terminal displays, and exploring how a repository changed over time.
      Common options select a commit, range, author, date window, theme, typing speed,
      or ignore file.
related-packages:
  - id: brew:gource
    reason: >
      Gource is an alternative repository-history visualizer with a graphical animated
      tree and support for multiple version-control systems, whereas gitlogue presents
      code changes in a terminal-native TUI.
    rel: alternative
    sources:
      - https://github.com/unhappychoice/gitlogue#readme
      - https://gource.io/
