history:
  adoption-history:
    - >
      ali has broad package-manager presence for a small load-testing tool. The README
      documents Homebrew, MacPorts, APT, RPM, Pacman, APK, Go, and Docker installation
      paths, and the input facts also list Homebrew, MacPorts, Nix, Pacman, and Alpine
      packages.
    - >
      Official GitHub metadata checked for this batch showed several thousand stars and
      more than a hundred forks, suggesting visible adoption among developers looking
      for terminal-first HTTP benchmarking tools.
  package-nerd-significance:
    - >
      ali is package-nerd-friendly because it is a single Go CLI that feels like a
      mashup of `vegeta` and terminal dashboards. Installing it through a package
      manager gives users a quick, reproducible load-test command without building a
      local observability stack.
    - >
      It also shows a common packaging pattern for developer CLIs: upstream release
      binaries, distro packages, Homebrew taps/formulae, Docker, and `go install` all
      coexist.
  project-history:
    - >
      The public GitHub repository was created in September 2020 by Ryo Nakao. The
      README describes ali as a load-testing tool capable of real-time analysis,
      inspired by vegeta and jplot.
    - >
      The project combines HTTP attack generation with a TUI that can plot metrics while
      the test is running. Its README also calls out export support for downstream
      processing, which gives it both interactive and script-adjacent workflows.
  related-projects:
    - >
      Related projects include vegeta for HTTP load testing, jplot for plotting
      inspiration, and termdash/termbox-go for terminal rendering.
  sources:
    - https://api.github.com/repos/nakabonne/ali
    - https://github.com/nakabonne/ali
    - https://raw.githubusercontent.com/nakabonne/ali/master/README.md
    - source_facts.package-manager
  summary:
    - >
      ali is a Go HTTP load-testing tool with a terminal UI for real-time charts. It is
      built for developers who want quick interactive load generation and immediate
      latency/throughput feedback without exporting data to a separate graphing tool
      first.
  timeline:
    - '2020: Public GitHub repository created.'
    - '2020s: README documents Homebrew, distro package, Go, and Docker installation paths.'
    - '2026: Repository metadata still shows active project visibility with thousands of stars.'
  usage:
    - >
      The simplest usage is `ali http://host.xz`, then launching the attack from the UI
      with default rate and duration. Users can tune rate, duration, workers, headers,
      request bodies, TLS settings, HTTP/2 behavior, DNS resolvers, and export directory
      through flags.
    - >
      Its real-time terminal charts make it useful during exploratory testing, quick
      endpoint smoke tests under load, and demos where immediate feedback matters more
      than a full benchmarking lab.
related-packages:
  - id: brew:vegeta
    reason: >
      Choose Vegeta when you need a scriptable constant-rate load-testing CLI,
      composable reporting pipeline, or Go library instead of ali's integrated real-time
      terminal UI.
    rel: alternative
    sources:
      - https://github.com/nakabonne/ali
      - https://github.com/tsenart/vegeta
