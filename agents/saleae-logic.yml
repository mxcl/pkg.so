history:
  adoption-history:
    - >
      Logic 2 is the companion application for Saleae’s Logic analyzer family and
      remains backward-compatible with the original Logic and Logic16 hardware. Saleae
      reports that more than 35,000 embedded developers actively use Logic each month.
  package-nerd-significance:
    - >
      Logic 2 is a notable Homebrew cask because it packages a proprietary,
      cross-platform hardware-development client whose usefulness is tied to USB test
      equipment. Its package-manager presence saves engineers from manually tracking
      Saleae’s desktop installer while keeping the analyzer workflow alongside other
      development tools.
  project-history:
    - >
      Saleae’s founders chose the company name in 2005 and began developing their logic
      analyzer three years later. The first Logic unit was sold on June 3, 2008. Logic 2
      is the newer software generation for Saleae’s analyzer line, replacing the legacy
      Logic 1.x experience while retaining support for older hardware.
    - >
      Saleae treats the desktop software as a central part of its product rather than an
      open-source accessory. Its official download page maintains a changelog of major
      updates, while separate extension and automation documentation supports protocol
      analyzers, measurements, scripting, and MCP control.
  related-projects:
    - Saleae Logic, Logic Pro, and Logic MSO hardware
    - Legacy Saleae Logic 1.x software
    - Saleae protocol-analyzer, measurement-extension, automation, and MCP APIs
  sources:
    - https://www.saleae.com/logic
    - https://www.saleae.com/support/community-contact/how-do-you-pronounce-saleae
    - https://www.saleae.com/support/logic-software/download-and-installation/sw-download
    - https://www.saleae.com/support/tutorials-learning/concepts/saleae-open-source-support
  summary:
    - >
      Saleae Logic 2 is the official signal-capture and analysis application for Saleae
      logic analyzers and mixed-signal hardware. It records digital and analog signals,
      displays timing data, decodes protocols, searches captures, and supports
      measurements and extensions.
  timeline:
    - '2005: Saleae’s founders chose the company name and formed the business.'
    - >
      2008: Development of the Logic analyzer began, and the first Logic unit was sold
      on June 3.
    - >
      Logic 2 era: Saleae introduced its newer cross-platform software while retaining
      compatibility with original Logic hardware.
  usage:
    - >
      Engineers use Logic 2 to capture board-level electrical activity, inspect timing,
      decode buses such as UART, SPI, I2C, CAN, and USB, and search long recordings for
      protocol events.
    - >
      Advanced workflows extend the application with custom low-level analyzers,
      high-level analyzers, measurements, automation APIs, and MCP-based
      natural-language control.
