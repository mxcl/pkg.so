id: brew:kickstart
display-name: kickstart
repo: null
docs:
  - https://github.com/Keats/kickstart#readme
config-file-location:
  unix:
    - template.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      kickstart is distributed as a crates.io package and as prebuilt GitHub release
      binaries. The Homebrew input record also lists Homebrew and Nix formulas,
      reflecting its use as a small standalone developer utility rather than a
      framework-bound generator.
  package-nerd-significance:
    - >
      kickstart is a neat package-manager-era scaffolder because it packages the
      generator as a single Rust binary while keeping templates language-agnostic and
      plain-file based.
  project-history:
    - >
      The GitHub repository was created in 2018, with early releases beginning at v0.1.6
      on 2018-08-02. The README frames kickstart as a more powerful Rust counterpart to
      Python Cookiecutter and as an alternative to Node.js scaffolders such as Yeoman
      and Slush.
  related-projects:
    - >
      The README compares kickstart with Cookiecutter, Yeoman, and Slush, and documents
      Tera as its template engine.
  sources:
    - https://crates.io/crates/kickstart
    - https://github.com/Keats/kickstart
    - https://github.com/Keats/kickstart/releases
    - https://keats.github.io/tera/docs/
  summary:
    - >
      kickstart is a Rust CLI for project scaffolding from templates, using
      `template.toml` metadata and Tera rendering to generate new project directories.
  timeline:
    - '2018: Repository created and v0.1.6 published.'
    - '2020: v0.2.x releases published.'
    - '2021: v0.3.0 release published.'
    - '2025: v0.6.0 release published on 2025-12-21.'
  usage:
    - >
      Users run kickstart against local or Git-hosted templates, answer prompts
      described in `template.toml`, and generate files whose contents, file names, and
      directory names can be rendered through Tera.
related-packages:
  - id: brew:cookiecutter
    reason: >
      Cookiecutter is the directly acknowledged Python alternative, with a much larger
      established template ecosystem; kickstart is attractive when a single Rust binary
      and its richer `template.toml` workflow are preferred.
    rel: alternative
    sources:
      - https://github.com/Keats/kickstart#readme
      - https://cookiecutter.readthedocs.io/en/stable/
  - id: brew:copier
    reason: >
      Choose Copier when generated projects must be updated or migrated as their
      template evolves; choose kickstart for straightforward generation from its
      Rust/Tera template format.
    rel: alternative
    sources:
      - https://github.com/Keats/kickstart#readme
      - https://copier.readthedocs.io/en/stable/comparisons/
