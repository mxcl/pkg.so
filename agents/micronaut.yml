history:
  project-history:
    - >
      Technically, Micronaut combined a Netty-based HTTP server and client, cloud-native
      configuration, service discovery, client-side load balancing, and
      serverless/microservice tooling with low startup time and memory use. That made it
      part of the same package-manager space as Spring Boot, Quarkus, Helidon, and
      Grails, but with a strong ahead-of-time and GraalVM-friendly identity.
  sources:
    - https://docs.micronaut.io/index.html
    - https://formulae.brew.sh/formula/micronaut
    - https://micronaut.io/2018/05/23/micronaut-open-sourced/
    - https://micronaut.io/2018/10/23/micronaut-1-0-ga-released/
    - https://micronaut.io/2022/10/04/announcing-our-new-engineering-partner-oracle/
    - >
      https://micronaut.io/2026/01/12/micronaut-announces-plans-to-join-the-commonhaus-foundation/
  summary:
    - >
      Micronaut is a JVM framework introduced by Graeme Rocher and the Object Computing
      team that built Grails. It was open sourced on May 23, 2018, with an explicit
      focus on microservices for Java, Groovy, and Kotlin, and reached 1.0 GA on October
      23, 2018. Its defining design choice is compile-time dependency injection, AOP,
      and metadata generation, avoiding the reflection-heavy runtime model used by many
      older JVM application frameworks.
  usage:
    - >
      The project later gained formal foundation backing and corporate support. Oracle
      joined the Micronaut Foundation as an engineering partner in 2022 after
      contributing since 2020, including work around Micronaut AOT and Serialization. In
      2026 the project announced plans to join the Commonhaus Foundation and described
      adoption across large corporations, small companies, private users, and more than
      900 contributors. The Homebrew formula packages the `mn` launcher, used to
      generate and manage Micronaut applications from the command line.
related-packages:
  - id: brew:graalvm
    reason: >
      Use GraalVM with Micronaut when you want to compile a generated Java or Kotlin
      application into a native executable with lower startup time and memory use.
    rel: adjacent_workflow
