history:
  project-history:
    - >
      The project's technical emphasis is speed on large Swift codebases. Its README
      contrasts Mockolo with slower third-party generators and describes a goal of
      producing mocks in seconds for codebases with millions of lines or thousands of
      protocols, using a lightweight command-line tool that can run in a build or linter
      workflow.
  sources:
    - https://api.github.com/repos/uber/mockolo
    - https://cocoapods.org/pods/MockoloFramework
    - https://formulae.brew.sh/formula/mockolo
    - https://github.com/uber/mockolo
    - https://swiftpackageregistry.com/uber/mockolo
  summary:
    - >
      Mockolo is a Swift mock generator published under Uber's GitHub organization. The
      repository was created in 2018, and its README says the project exists because
      Swift lacks built-in mocking support; Mockolo generates mock objects that can be
      used in tests.
  usage:
    - >
      Mockolo's package niche is narrower than general Swift formatting or build
      tooling: it is a dedicated test-code generator for protocol-heavy Swift projects.
      Homebrew packages it as `mockolo`, while Swift package and CocoaPods ecosystem
      pages mirror the same positioning for teams that want generated mocks without
      adopting a heavier runtime mocking framework.
