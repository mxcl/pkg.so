    - macOS Keychain (optional storage for banking PINs)
history:
  adoption-history:
    - >
      Pecunia is aimed primarily at German Mac users because its HBCI/FinTS banking
      interface is chiefly supported by German banks. The project is donationware under
      GPL-2.0 and can be used without feature restrictions.
    - >
      The project has continued adapting to changes in bank implementations and banking
      standards, including CAMT statement data and the 2025 SEPA Verification of Payee
      requirements.
  package-nerd-significance:
    - >
      Pecunia is a relatively unusual package-manager entry: a native, open-source Mac
      banking client built around Germany's HBCI/FinTS ecosystem rather than a
      browser-based banking portal.
    - >
      Its GPL licensing, native client repository, sandbox container, optional Keychain
      use, and dependence on frequently changing bank protocols make it an instructive
      example of packaging security-sensitive desktop software.
  project-history:
    - >
      Pecunia was developed as a native macOS online-banking client for maintaining
      accounts, retrieving transactions and statements, making transfers, categorizing
      activity, and producing financial reports. Its public repository identifies it as
      an open-source HBCI banking solution.
    - >
      The current 2.x line uses the open-source hbci4swift library. Official release
      notices document continuing compatibility work for individual banks and changes to
      German and European payment protocols.
  related-projects:
    - hbci4swift supplies the open-source HBCI/FinTS foundation used by Pecunia.
    - >
      The official pecunia-client GitHub wiki documents initial setup and Pecunia's
      plugin facilities.
  sources:
    - https://github.com/pecuniabanking/pecunia-client
    - https://pecuniabanking.de/
    - https://pecuniabanking.de/index.php/beschreibung/features
    - https://pecuniabanking.de/index.php/beschreibung/sicherheit
    - https://pecuniabanking.de/index.php/beschreibung/ueberblick
    - https://pecuniabanking.de/index.php/downloads
  summary:
    - >
      Pecunia is a native open-source macOS online-banking and personal-finance
      application. It uses HBCI/FinTS to communicate with supported banks and provides
      transfers, statement retrieval, categorization, budgets, reports, and CSV
      exchange.
  timeline:
    - '2014: The official GitHub wiki was established for setup and plugin documentation.'
    - >
      2018: The current official website published its Pecunia overview, feature,
      security, download, and help pages.
    - '2025: Pecunia 2.2 added support for SEPA Verification of Payee requirements.'
    - '2026: The 2.2 line continued receiving compatibility and transaction-retrieval fixes.'
  usage:
    - >
      Users configure a bank identity, synchronize the accounts advertised by the bank,
      and then retrieve balances, transactions, and statements or create supported SEPA
      orders.
    - >
      Pecunia does not store TANs. Banking PINs may optionally be stored in the macOS
      Keychain, and local financial data can be encrypted in the application's security
      settings. The developer recommends backing up
      `~/Library/Containers/de.pecuniabanking.pecunia`.
