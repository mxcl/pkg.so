id: cask:exo
display-name: Exo
repo: https://github.com/exo-explore/exo
docs:
  - https://github.com/exo-explore/exo/blob/main/docs/api.md
  - https://github.com/exo-explore/exo#readme
config-file-location:
  linux:
    - ${XDG_CONFIG_HOME:-~/.config}/exo/config.toml
  macos:
    - ~/.exo/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      By the end of 2024, Exo Labs reported more than 18,000 GitHub stars and nearly
      1,000 forks, indicating substantial early interest in consumer-hardware AI
      clustering.
    - >
      The project subsequently expanded from its Apple-silicon emphasis to heterogeneous
      local-AI setups and packaged macOS distribution, including a Homebrew cask.
  package-nerd-significance:
    - >
      Exo is notable to package enthusiasts because it turns several ordinary machines
      into one inference target and exposes familiar OpenAI, Claude, Responses, and
      Ollama-compatible APIs.
    - >
      Its use of XDG directories on Linux, a conventional dot-directory on macOS,
      environment-variable overrides, and Homebrew distribution makes it unusually
      approachable for experimental distributed-AI infrastructure.
  project-history:
    - >
      Exo began as infrastructure for university students who wanted to run larger AI
      experiments using the devices they already had. It evolved into an open-source
      distributed inference system maintained by Exo Labs.
    - >
      The project initially emphasized pipeline-parallel inference across consumer
      devices. Later work added topology-aware parallelism, Thunderbolt RDMA, multiple
      API-compatible interfaces, offline operation, and a macOS application.
  related-projects:
    - MLX is one of Exo's important Apple-silicon inference foundations.
    - Exo Gym is a related toolkit for distributed-training research.
    - local.ai is Exo Labs' companion hardware-and-model planning service.
  sources:
    - https://blog.exolabs.net/day-1/
    - https://blog.exolabs.net/day-7/
    - https://exolabs.net/
    - https://github.com/exo-explore/exo
  summary:
    - >
      Exo is an open-source local-AI runtime that combines multiple computers into a
      cluster for running models that may not fit, or run as quickly, on one device.
  timeline:
    - '2024: Exo emerged publicly as a consumer-hardware distributed-AI project.'
    - 'December 2024: Exo Labs reported more than 18,000 GitHub stars in its year-end review.'
    - >
      2025: Exo 1.0 demonstrated heterogeneous inference spanning NVIDIA DGX Spark and
      Apple Mac Studio hardware.
  usage:
    - >
      Users run Exo on one or more local machines, allow nodes to discover each other,
      then manage models through its dashboard or compatible HTTP APIs.
    - >
      Typical uses include private local inference, pooling memory across Macs, serving
      models to coding tools or chat interfaces, and benchmarking model performance on
      consumer hardware.
tags:
