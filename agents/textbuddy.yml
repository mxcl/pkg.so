history:
  adoption-history:
    - >
      TextBuddy is aimed at writers, developers, reviewers, and Mac power users who
      regularly perform small text-cleaning and conversion tasks but do not need a full
      editor or a custom command-line pipeline.
  package-nerd-significance:
    - >
      It packages operations familiar from Unix filters, editor commands, and short
      scripts into a searchable native Mac interface. Custom scripts, shell commands,
      URL workflows, clipboard actions, and macOS Services allow it to bridge graphical
      and automation-oriented workflows.
  project-history:
    - >
      TextBuddy was developed as a focused macOS workbench for temporary plain-text
      tasks. Its official product surface has expanded beyond basic conversion and
      sorting to include extraction, statistics, snapshots, automation, optical text
      capture, transcription, and integrations with other Mac applications.
  related-projects:
    - >
      Its workflow overlaps with command-line text filters, programming editors,
      clipboard managers, and macOS automation tools, while remaining a dedicated
      scratchpad rather than a long-term notes or writing application.
  sources:
    - https://retina.studio/textbuddy/
  summary:
    - >
      TextBuddy is a macOS utility for transforming, sorting, filtering, measuring,
      capturing, and cleaning plain text.
  timeline:
    - >
      Initial focus: TextBuddy provided a dedicated Mac interface for common plain-text
      transformations.
    - >
      Later expansion: The application added broader capture, transcription, automation,
      scripting, and application-integration workflows.
  usage:
    - >
      Users paste or open text, select a command, and perform tasks such as case
      conversion, whitespace cleanup, list reformatting, sorting, deduplication, data
      extraction, encoding, decoding, counting, and scripted transformation.
