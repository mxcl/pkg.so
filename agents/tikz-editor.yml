history:
  adoption-history:
    - >
      TikZ Editor is available as a web application and as native desktop builds for
      macOS, Linux, and Windows. Homebrew Cask provides a convenient installation path
      for its macOS build.
    - >
      The editor targets users who want direct manipulation without abandoning idiomatic
      TikZ source: it keeps the textual representation linked to editable scene objects
      and preserves formatting through localized source patches.
  package-nerd-significance:
    - >
      TikZ Editor bridges two cultures that often remain separate: visual diagram
      editors and source-controlled LaTeX documents. Its ability to edit existing .tex
      and .tikz files makes it relevant to reproducible academic-writing workflows.
    - >
      The application is MIT-licensed, its source is public, and releases provide native
      artifacts across major desktop platforms. For Homebrew users, the cask turns those
      releases into a standard macOS installation workflow.
  project-history:
    - >
      Dominik Peters built TikZ Editor as a WYSIWYG editor capable of parsing commonly
      used TikZ constructs into editable scene elements. The official project page says
      the initial codebase was produced over roughly three months with coding-agent
      assistance.
    - >
      The project was publicly released in 2026. It combines a TypeScript interface with
      a Tauri desktop backend and uses SVG for scene rendering, MathJax for text and
      mathematics, and CodeMirror for source editing.
  related-projects:
    - PGF/TikZ
    - LaTeX
    - TikZiT
    - MathJax
    - CodeMirror
    - Tauri
    - Homebrew Cask
  sources:
    - 'Official license: https://github.com/DominikPeters/tikz-editor/blob/master/LICENSE'
    - 'Official product page: https://tikz.dev/editor'
    - 'Official releases: https://github.com/DominikPeters/tikz-editor/releases'
    - 'Official repository: https://github.com/DominikPeters/tikz-editor'
    - source_facts.package-manager and source_facts.provenance
  summary:
    - >
      TikZ Editor is an open-source WYSIWYG editor for creating and modifying TikZ
      figures while retaining editable LaTeX source. It supports both visual
      manipulation and direct source editing.
  timeline:
    - '2026: TikZ Editor was publicly released under the MIT License.'
    - '2026: Native releases were published for macOS, Linux, and Windows.'
  usage:
    - >
      Users open .tex or .tikz files and manipulate nodes, paths, shapes, matrices,
      labels, styles, transforms, and multi-figure documents through a visual canvas.
    - >
      The editor can import SVG, Ipe, and PowerPoint content and export SVG, PNG, PDF,
      or standalone LaTeX. Its parser intentionally supports common TikZ constructs
      rather than arbitrary TeX.
    - >
      The desktop edition can optionally call an installed OpenAI Codex client to assist
      with figure edits; this optional feature uses the user's ChatGPT account.
