history:
  adoption-history:
    - >
      The adoption curve is unusually steep for a 2025 project. On July 1, 2026 the
      GitHub API showed 22,074 stars and 3,553 forks. npm reported 541,219 downloads for
      May 30, 2026 through June 28, 2026, and Homebrew reported 4,348 installs over 365
      days. Homebrew's package is a secondary distribution channel beside npm, Docker,
      Railway, hosted dashboard access, and IDE/client configuration snippets.
  package-nerd-significance:
    - >
      The package is significant because it turns n8n from a mostly UI-driven automation
      product into a schema-rich target for AI-assisted workflow generation. It also
      illustrates a new packaging pattern: a project that is simultaneously an npm
      package, Docker image, Homebrew formula, hosted API, and tool-specific instruction
      bundle. The main maintenance pressure is keeping pace with n8n's fast release and
      node-template ecosystem.
  project-history:
    - >
      The project started as an independent tool by Marcin Czlonkowski and evolved into
      a TypeScript MCP server with hosted and self-hosted paths. Its README describes
      coverage for 2,063 n8n nodes, 2,352 workflow templates, structured node
      properties, operations, official-doc coverage, AI-capable node variants, and
      real-world examples from templates. The same README says it began as a personal
      tool and now helps tens of thousands of developers.
  related-projects:
    - n8n
    - Model Context Protocol
    - Claude Desktop
    - Claude Code
    - Cursor
    - Windsurf
    - Codex
  sources:
    - https://api.github.com/repos/czlonkowski/n8n-mcp
    - https://api.github.com/repos/czlonkowski/n8n-mcp/releases/latest
    - https://api.npmjs.org/downloads/point/last-month/n8n-mcp
    - https://formulae.brew.sh/api/formula/n8n-mcp.json
    - https://formulae.brew.sh/formula/n8n-mcp
    - https://github.com/czlonkowski/n8n-mcp
    - https://github.com/czlonkowski/n8n-mcp/blob/main/docs/DEPENDENCY_UPDATES.md
    - https://registry.npmjs.org/n8n-mcp
  summary:
    - >
      n8n-mcp is a Model Context Protocol server that exposes n8n workflow, node,
      property, operation, template, and validation knowledge to AI coding and agent
      tools. The repository was created on June 7, 2025, and the npm package was created
      on July 6, 2025, making it a fast-rising package from the post-MCP boom rather
      than an old n8n core component.
  timeline:
    - '2025-06-07: GitHub repository created.'
    - '2025-07-06: npm package created.'
    - '2026-06-26: v2.61.0 published on GitHub and npm metadata updated.'
    - '2026-05-30 to 2026-06-28: npm reported 541,219 downloads.'
    - >
      2026-07-01: GitHub API showed 22,074 stars and Homebrew API showed 4,348 installs
      over 365 days.
  usage:
    - >
      Users connect n8n-mcp to Claude Desktop, Claude Code, VS Code/Copilot, Cursor,
      Windsurf, Codex, or similar MCP clients so the assistant can search n8n nodes,
      inspect node schemas, find templates, validate node configs, and create or update
      workflows. Its own prompt guidance pushes a practical workflow: search templates
      first, inspect nodes with examples, explicitly set parameters instead of trusting
      defaults, validate individual nodes, then validate whole workflows before
      deployment.
