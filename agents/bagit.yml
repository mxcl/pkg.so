history:
  adoption-history:
    - >
      RFC 8493 notes BagIt use across preservation organizations including the Library
      of Congress, Dryad Data Repository, NSF DataONE, the Rockefeller Archive Center,
      and university libraries including Cornell, Purdue, Stanford, Ghent University,
      New York University, and the University of California.
    - >
      In package-manager culture, `bagit` is a small but durable archival utility:
      Homebrew packages it as a formula, and the formula API reported stable version
      1.9.0 with 19 installs in the previous 30 days as of June 30, 2026.
  package-nerd-significance:
    - >
      bagit is a package nerd's preservation tool: it turns a normal directory tree into
      a self-describing, checksum-verifiable transfer object without forcing data into
      tar or zip. It is the kind of small CLI that matters in archives, data
      repositories, and reproducible handoffs precisely because its format is boring and
      inspectable with ordinary filesystem tools.
  project-history:
    - >
      The BagIt format was developed in the digital-preservation community and
      standardized as RFC 8493 in October 2018 by contributors from the California
      Digital Library, Stanford Libraries, the Library of Congress, and others. The RFC
      describes BagIt as a filesystem hierarchy with payload files, tag files,
      manifests, and checksum validation rather than as a compressed archive format.
    - >
      The bagit-python repository was created under the Library of Congress GitHub
      organization in 2013. Its README presents the package as both a Python module and
      a `bagit.py` command-line program for turning directories into bags, updating bag
      metadata, regenerating manifests, and validating bags.
  related-projects:
    - >
      RFC 8493 lists implementations in several languages, including Python, Ruby, Java,
      Perl, and PHP.
    - >
      The broader BagIt ecosystem includes archival repositories and preservation
      workflows that exchange bags between institutions.
  sources:
    - https://api.github.com/repos/LibraryOfCongress/bagit-python
    - https://formulae.brew.sh/api/formula/bagit.json
    - https://raw.githubusercontent.com/LibraryOfCongress/bagit-python/master/README.rst
    - https://www.rfc-editor.org/rfc/rfc8493.txt
  summary:
    - >
      bagit is the Library of Congress-maintained Python library and command-line
      utility for creating, reading, and validating BagIt packages. Its importance comes
      from the BagIt format more than from the code itself: BagIt is a simple directory
      layout for reliable transfer and preservation of arbitrary digital content.
  timeline:
    - '2013: LibraryOfCongress/bagit-python repository created on GitHub.'
    - '2018: BagIt File Packaging Format v1.0 published as RFC 8493.'
    - '2026: Homebrew formula reports stable bagit 1.9.0.'
  usage:
    - >
      Common CLI workflows are `bagit.py /path/to/dir` to create a bag, `bagit.py
      --validate /path/to/bag` to validate manifests and payloads, and checksum flags
      such as `--sha256` or `--sha512` to control manifest generation. The module API
      exposes the same ideas through `bagit.make_bag`, `bagit.Bag`, `save`, and
      `validate`.
