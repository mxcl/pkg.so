history:
  adoption-history:
    - >
      Sip developed from a small personal utility into a professional color-workflow
      application. Its makers say it is used by professionals around the world, while
      the current product supports palette organization, collaboration, shared
      synchronization, accessibility checking, and integration with other design tools.
    - >
      The project has been distributed directly with a trial and paid license and is
      also available through Setapp. Homebrew Cask offers an additional installation
      path for macOS package users.
  package-nerd-significance:
    - >
      Sip is representative of focused menu-bar utilities that grow into full workflow
      applications without abandoning quick keyboard-driven access. It is useful to
      designers and frontend developers who want color capture, reusable palettes,
      multiple output formats, contrast testing, and color-profile handling integrated
      into the desktop rather than scattered among browser tools.
  project-history:
    - >
      Brothers André Gonçalves and Rui Aureliano created Sip as a personal project for
      unobtrusively capturing colors and converting them into different formats. They
      turned it into a product in 2012 and continued developing it as a macOS
      color-management tool.
    - >
      The surviving official release archive begins with Sip 1.0 in March 2017 and
      records sustained development through major 2.x, 3.x, 4.x, and 5.x generations.
      Sip 5.0, released in July 2026, refreshed the interface and color-editing
      workflow; Sip 5.1 improved synchronization and offline license behavior.
  related-projects:
    - >
      Sip overlaps with system color pickers, digital-design applications, palette
      managers, contrast checkers, and developer-oriented color-format converters.
  sources:
    - https://docs.sipapp.io/getting-started
    - https://sipapp.io/
    - https://sipapp.io/about/
    - https://sipapp.io/updates/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Sip is a macOS color picker and palette-management application created by André
      Gonçalves and Rui Aureliano. It combines fast screen sampling with color editing,
      organization, sharing, accessibility checks, profiles, and workflow-oriented
      output formats.
  timeline:
    - >
      2012: André Gonçalves and Rui Aureliano turned their personal color-conversion
      tool into a product.
    - '2017: The official surviving update archive begins with Sip 1.0.'
    - '2019: Sip 2.0 began a new major release series.'
    - '2023: Sip 3.0 was released.'
    - '2025: Sip 4.0 was released.'
    - >
      2026: Sip 5.0 refreshed the interface and workflow; Sip 5.1 improved
      synchronization and offline licensing.
  usage:
    - >
      Users invoke Sip from the menu bar or main window, sample colors from the screen,
      edit values, and organize colors into palettes and sub-palettes. Sip can copy
      colors in workflow-specific formats, synchronize and share palettes, check
      contrast, simulate color-vision conditions, and apply suitable color profiles for
      different environments.
