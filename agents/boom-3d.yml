history:
  adoption-history:
    - >
      Boom 3D built on the established Boom and Boom 2 user base. At launch, Global
      Delight offered existing Boom 2 customers an upgrade discount and distributed Boom
      3D through both its web store and the Mac App Store.
    - >
      The product later expanded beyond its original Mac edition to Windows, while
      Global Delight continued adding features such as 5.1 support and automatic
      headphone equalization.
  package-nerd-significance:
    - >
      Boom 3D is notable in package catalogs as a proprietary system-audio utility whose
      operation extends beyond a normal media player. Its optional audio component,
      per-application volume control, licensing, and device-level integration are
      relevant to installation and troubleshooting.
  project-history:
    - >
      Global Delight released Boom 3D on June 7, 2017 as the next product after Boom 2.
      The new application centered on virtual 3D surround sound while retaining
      system-wide boosting, equalization, effects, and Mac-specific calibration.
  related-projects:
    - Boom and Boom 2 preceded Boom 3D in Global Delight's desktop audio-enhancement line.
    - Boom mobile applications apply related enhancement features on iOS and Android.
  sources:
    - >
      Official 2017 launch announcement:
      https://www.globaldelight.com/press-pages/2017/globaldelight-releases-boom3d.php
    - 'Official Boom 3D help: https://www.globaldelight.com/boom/help/mac'
    - 'Official Boom 3D press kit: https://www.globaldelight.com/press/Boom3DPressKit.pdf'
    - 'Official press-release archive: https://www.globaldelight.com/press_releases'
  summary:
    - >
      Boom 3D is Global Delight's desktop audio-enhancement application, combining
      system-wide volume boosting and equalization with virtual 3D surround sound.
  timeline:
    - '2017: Global Delight released Boom 3D for macOS.'
    - '2022: Global Delight announced 5.1 support for Boom 3D on Mac.'
    - '2024: Automatic Headphone EQ was introduced for Boom 3D.'
  usage:
    - >
      Users enable Boom 3D for system-wide enhancement, select equalizer presets and
      audio effects, simulate surround sound over headphones, control individual
      application volume, or play audio through its mini player. Some system-wide
      features use an optional audio component.
