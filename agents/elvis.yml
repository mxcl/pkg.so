    - 'source_facts.name: elvis'
  docs-sources:
    - Official elvis repository README documents commands and configuration
    - Official elvis_core RULES.md documents rule reference
    - Official elvis_core repository README documents configuration and rule engine details
  history-sources:
    - 'GitHub releases API: 0.1.1 published 2014-09-10 and 5.0.4 published 2026-05-29'
    - >
      GitHub repository API: created_at 2014-06-23, language Erlang, topics, and
      repository metadata
    - 'Homebrew formula API: stable version 5.0.4 and official source archive'
    - >
      Official elvis README: commands, --config behavior, git-hook usage, and reference
      to elvis_core
    - 'Official elvis_core README: configuration lookup and elvis.config example'
  repo-sources:
