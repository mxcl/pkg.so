id: brew:elvis
display-name: Elvis
repo: null
docs:
  - https://github.com/inaka/elvis#readme
  - https://github.com/inaka/elvis_core#readme
  - https://github.com/inaka/elvis_core/blob/main/RULES.md
config-file-location:
  unix:
    - elvis.config
credentials-file-location:
  unix:
    - elvis.config
history:
  adoption-history:
    - >
      The project is distributed through Homebrew, MacPorts, and Nix according to the
      input package metadata. The official README documents use as a command-line tool,
      a Git pre-commit hook, and a webhook-oriented component for pull request review.
  package-nerd-significance:
    - >
      Elvis matters to Erlang package users because it packages style checks into a CLI
      that can fail builds, run in hooks, and share elvis_core rules across command-line
      and rebar3-oriented workflows.
  project-history:
    - >
      The inaka/elvis repository was created in June 2014 and has continued as a
      standalone command-line tool around elvis_core, the core library that implements
      the rules and configuration mechanics.
  related-projects:
    - >
      elvis_core provides the underlying rule engine and configuration documentation;
      rebar3_lint uses elvis_core for Erlang project integration.
  sources:
    - 'GitHub releases API: 0.1.1 published 2014-09-10 and 5.0.4 published 2026-05-29'
    - >
      GitHub repository API: created_at 2014-06-23, language Erlang, topics, and
      repository metadata
    - 'Homebrew formula API: stable version 5.0.4 and official source archive'
    - >
      Official elvis README: commands, --config behavior, git-hook usage, and reference
      to elvis_core
    - 'Official elvis_core README: configuration lookup and elvis.config example'
  summary:
    - >
      Elvis is an Erlang style reviewer and command-line linter that checks Erlang
      source files against configurable rule sets.
  timeline:
    - '2014: GitHub repository created'
    - '2014: 0.1.1 published on GitHub releases'
    - '2026: 5.0.4 published on GitHub releases and tracked by Homebrew'
  usage:
    - >
      Users run elvis commands such as rock, git-branch, and git-hook. By default elvis
      looks for elvis.config, while the --config option allows a different path.
related-packages:
  - id: brew:rebar3
    reason: >
      Use rebar3 with the documented rebar3_lint plugin when you want Elvis rules
      exposed as the normal rebar3 lint task inside an Erlang application.
    rel: adjacent_workflow
    sources:
      - https://github.com/project-fifo/rebar3_lint#readme
      - https://github.com/inaka/elvis_core#readme
      - https://rebar3.org/docs/
tags:
  - cli
  - erlang
  - linter
  - static-analysis
  - style-review
geiger:
  category: appliance
  color: green
  confidence: low
  reason: narrow executable package without higher-risk signals
  reasons:
