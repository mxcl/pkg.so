history:
  adoption-history:
    - >
      Adoption evidence is narrow: the project has an official repository, tagged GitHub
      releases, a Homebrew formula, and AUR installation instructions. It appears to
      serve users who want a compact downloader rather than a broad ecosystem role.
  package-nerd-significance:
    - >
      For package users, getparty is mostly interesting as a single-purpose Go CLI that
      packages into one executable and exposes many downloader controls without
      depending on a larger download-suite stack.
  project-history:
    - >
      The public GitHub repository was created in December 2016. Its README presents the
      tool as an HTTP download manager with multi-part support and documents
      installation through Homebrew, the Arch User Repository, and source builds.
  related-projects:
    - >
      getparty overlaps with traditional command-line downloaders and segmented HTTP
      download managers, but its official sources do not identify a direct upstream
      lineage.
  sources:
    - https://api.github.com/repos/vbauerster/getparty
    - https://github.com/vbauerster/getparty
    - https://raw.githubusercontent.com/vbauerster/getparty/master/README.md
  summary:
    - >
      getparty is a small Go command-line HTTP download manager focused on multi-part
      downloads, resumable sessions, custom headers, proxy use, TLS options, and
      choosing the best mirror from a list.
  timeline:
    - '2016: The public GitHub repository for getparty was created.'
    - '2010s: README documents Homebrew, AUR, and source-build installation paths.'
    - '2026: Official GitHub metadata and releases showed continued 1.x maintenance.'
  usage:
    - >
      Practitioners use getparty to split a download into parts, retry failed parts,
      resume incomplete sessions from a JSON session file, set basic authentication or
      arbitrary HTTP headers, route through a proxy, adjust buffers and speed limits,
      and test mirrors before downloading.
related-packages:
  - id: brew:aria2
    reason: >
      Choose aria2 when you need FTP, SFTP, BitTorrent, Metalink, multi-source
      downloads, or RPC control; choose getparty for a smaller HTTP-focused multipart
      downloader with explicit session and mirror options.
    rel: alternative
    sources:
      - https://github.com/vbauerster/getparty#readme
      - https://aria2.github.io/
      - https://aria2.github.io/manual/en/html/
