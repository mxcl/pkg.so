id: cask:swiftformat-for-xcode
display-name: SwiftFormat for Xcode
repo: null
docs:
  - https://github.com/nicklockwood/SwiftFormat#readme
  - https://github.com/nicklockwood/SwiftFormat/blob/main/Rules.md
config-file-location:
  unix:
    - .swiftformat
credentials-file-location: null
history:
  adoption-history:
    - >
      SwiftFormat expanded from a command-line formatter into several integration paths,
      including an Xcode Source Editor extension, build phases, Git hooks, Swift Package
      Manager plugins, and CI workflows. The host application provides a graphical way
      to configure the Xcode extension and export configuration files.
  package-nerd-significance:
    - >
      SwiftFormat is notable for combining a reusable Swift library, a command-line
      utility, editor integration, and package-manager distribution in one project. Its
      checked-in .swiftformat files make formatting policy reproducible across local
      development and CI.
  project-history:
    - >
      Nick Lockwood released SwiftFormat in August 2016 as a formatter for Swift source.
      An Xcode Source Editor extension followed in October 2016, giving the formatter an
      editor-native interface alongside its command-line workflow.
  related-projects:
    - swiftlang/swift-format
    - SwiftLint
    - Xcode Source Editor extensions
  sources:
    - https://github.com/nicklockwood/SwiftFormat
    - https://github.com/nicklockwood/SwiftFormat/blob/main/CHANGELOG.md
    - https://github.com/nicklockwood/SwiftFormat/blob/main/Rules.md
  summary:
    - >
      SwiftFormat for Xcode is the macOS host application and Source Editor extension
      supplied by the SwiftFormat project, an open-source formatter for Swift code.
  timeline:
    - '2016-08-22: SwiftFormat 0.1 was released.'
    - '2016-10-17: SwiftFormat added an Xcode Source Editor extension.'
    - '2018-07-30: The Xcode extension gained configurable format options.'
    - '2019-02-15: The app became associated with .swiftformat files.'
  usage:
    - >
      Developers launch the host application to configure rules, enable the extension in
      macOS settings, and invoke it from Xcode's Editor menu. A project can commit a
      .swiftformat file containing shared rule and option settings; the app can export
      this format.
