credentials-file-location: null
history:
  adoption-history:
    - >
      OrcaSlicer developed a broad printer and profile ecosystem spanning Bambu, Prusa,
      Voron, VzBot, RatRig, Creality, and other FFF machines. Community-contributed
      machine profiles, calibration workflows, frequent releases, and packages for
      Windows, macOS, and Linux helped it become a common cross-vendor slicer.
    - >
      The application later expanded beyond interactive desktop slicing with headless
      command-line operation, profile synchronization, plugins, and publishing
      workflows.
  package-nerd-significance:
    - >
      OrcaSlicer matters to package enthusiasts because it sits in a long open-source
      slicer lineage while integrating modern printer ecosystems and calibration
      tooling. It packages a large C++ desktop stack, machine and filament profiles,
      geometry engines, networking features, and G-code generation into one
      cross-platform application.
  project-history:
    - >
      OrcaSlicer began as BambuStudio-SoftFever and was renamed as it grew into a
      distinct community slicer. It is derived from Bambu Studio, which is based on
      PrusaSlicer and ultimately Slic3r and the RepRap community.
    - >
      The project retained the upstream slicer's open-source lineage while adding
      calibration tools, wider printer support, profile management, workflow
      refinements, and independent release infrastructure.
  related-projects:
    - Bambu Studio is OrcaSlicer's immediate upstream foundation.
    - >
      PrusaSlicer and Slic3r form the earlier open-source lineage from which Bambu
      Studio and OrcaSlicer descend.
    - >
      OrcaSlicer maintains separate official repositories for its documentation wiki and
      machine profiles.
  sources:
    - https://github.com/OrcaSlicer/OrcaSlicer
    - https://github.com/OrcaSlicer/OrcaSlicer/wiki/user_profiles
    - https://www.orcaslicer.com/wiki/
  summary:
    - >
      OrcaSlicer is an open-source, cross-platform slicer that prepares 3D models as
      G-code for FFF/FDM printers and provides printer, filament, process, calibration,
      and device workflows.
  timeline:
    - '2022: The project lineage appeared as BambuStudio-SoftFever, derived from Bambu Studio.'
    - >
      2023: The project adopted the OrcaSlicer name and established itself as an
      independent multi-printer slicer.
    - >
      2026: Official documentation covered headless CLI use, OrcaCloud profile sync, and
      an emerging Python plugin system.
  usage:
    - >
      Users select or create printer, filament, and process profiles; arrange models on
      a build plate; calibrate flow, pressure advance, temperature, retraction, and
      motion settings; preview generated toolpaths; and export or send G-code or 3MF
      jobs to supported printers. The application can also run headlessly for batch
      processing and CI.
