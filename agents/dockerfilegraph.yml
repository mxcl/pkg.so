history:
  adoption-history:
    - >
      dockerfilegraph remains a specialist visualization tool rather than a default
      Docker workflow. Its install paths still matter to package users: the README
      documents Docker/ghcr usage, Homebrew installation from the author's tap, mise
      installation from GitHub, and source builds.
    - >
      The Homebrew formula API reported stable version 0.21.0, 16 installs in the
      previous 30 days, and 477 installs in the previous year as of June 30, 2026. That
      is modest adoption, but credible for a focused Dockerfile architecture/debugging
      utility.
  package-nerd-significance:
    - >
      The package is notable because it externalizes Docker build structure into
      ordinary graph artifacts. It is the kind of CLI package maintainers like: a single
      executable plus Graphviz turns opaque build-stage relationships into inspectable
      files for reviews, docs, and debugging.
  project-history:
    - >
      Patrick Hoefler's repository was created in February 2021 and released v0.1.0 the
      same day. The README frames the tool around a common Docker build problem:
      multi-stage Dockerfiles become hard to reason about once stages, external images,
      `COPY --from`, and mount-based dependencies accumulate.
    - >
      The project continued to receive regular releases through the 0.21.x line by March
      2026. Its output model matured around build-stage nodes, highlighted default
      targets, external-image nodes, and edge styles for `FROM`, `COPY --from`, and `RUN
      --mount ... from=` dependencies.
  related-projects:
    - >
      dockerfilegraph depends conceptually on Docker multi-stage builds and uses
      Graphviz for graph rendering.
    - >
      It overlaps with documentation and build-debugging workflows rather than with
      Docker runtime management tools.
  sources:
    - https://github.com/patrickhoefler/dockerfilegraph#readme
    - https://api.github.com/repos/patrickhoefler/dockerfilegraph
    - https://github.com/patrickhoefler/dockerfilegraph/releases/tag/v0.1.0
    - https://github.com/patrickhoefler/dockerfilegraph/releases/tag/v0.21.0
    - https://formulae.brew.sh/api/formula/dockerfilegraph.json
  summary:
    - >
      dockerfilegraph is a Go CLI that turns multi-stage Dockerfiles into Graphviz
      dependency diagrams.
  timeline:
    - '2021: Repository created and v0.1.0 released.'
    - '2025: 0.19.x releases show continuing maintenance.'
    - '2026: v0.21.0 released and Homebrew formula reports stable 0.21.0.'
  usage:
    - >
      Running `dockerfilegraph` in a project directory generates a graph for
      `Dockerfile`, with output formats including PDF, SVG, and PNG. Flags support
      legends, layer display, target filtering, scratch-image handling, separated
      external-image nodes, and Graphviz layout tuning.
related-packages:
  - id: brew:graphviz
    reason: >
      dockerfilegraph uses Graphviz to render its parsed Dockerfile dependency model, so
      a local Graphviz installation supports its documented native workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/patrickhoefler/dockerfilegraph#readme
      - https://graphviz.org/documentation/
