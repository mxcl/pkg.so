history:
  adoption-history:
    - >
      Automattic released the desktop application for macOS in November 2015 and
      followed with Windows in December 2015; Linux builds were also made available. The
      application supports WordPress.com sites and self-hosted WordPress sites connected
      through Jetpack.
    - >
      The desktop client is distributed directly by WordPress.com and through package
      catalogs including Homebrew Cask.
  package-nerd-significance:
    - >
      The client is a notable example of a major web publishing service packaging the
      same JavaScript application for web and desktop through Electron. Its
      cross-platform packaging and open development in the Calypso monorepo make it
      relevant to maintainers tracking Electron desktop applications.
  project-history:
    - >
      The WordPress.com desktop client grew out of Calypso, Automattic’s
      JavaScript-based redesign of the WordPress.com administration interface. By
      mid-2015, Calypso could run outside a browser, allowing Automattic to package it
      with Electron as native desktop clients.
    - >
      The older `wp-desktop` repository is now used for deployment, while active desktop
      source development takes place in the `desktop` directory of Automattic’s
      `wp-calypso` repository.
  related-projects:
    - Calypso supplies the shared WordPress.com application code.
    - >
      Jetpack connects self-hosted WordPress sites to WordPress.com services and the
      desktop client.
    - >
      WordPress.org is the separately distributed open-source content-management system
      underlying self-hosted sites.
  sources:
    - https://apps.wordpress.com/desktop/
    - https://apps.wordpress.com/support/
    - https://github.com/Automattic/wp-desktop
    - https://wordpress.com/blog/2015/11/23/the-story-behind-the-new-wordpress-com/
    - https://wordpress.com/blog/2015/12/09/the-new-wordpress-com-app-for-windows-is-here/
    - source_facts.package-manager
  summary:
    - >
      WordPress.com for Desktop is Automattic’s Electron-packaged client for writing,
      publishing, reading, and managing WordPress.com and Jetpack-connected sites.
  timeline:
    - >
      2015: Automattic open-sourced Calypso and released the WordPress.com desktop
      client for macOS.
    - '2015: A Windows edition followed the Mac release.'
    - '2016: The desktop application was available across macOS, Windows, and Linux.'
    - >
      2020s: Active desktop development moved into the WP-Calypso monorepo while
      `wp-desktop` remained the deployment repository.
  usage:
    - >
      Users sign in with a WordPress.com account to manage sites, write and preview
      posts, read followed sites, inspect statistics, and receive notifications in a
      dedicated desktop window. Self-hosted sites require a Jetpack connection.
