history:
  adoption-history:
    - >
      Within weeks of its Internet release, community contributors had ported Squeak
      from Macintosh to several Unix systems and Windows. It later became established in
      education, multimedia work, research, and Smalltalk application development across
      major desktop platforms.
  package-nerd-significance:
    - >
      Squeak predates many modern package-manager conventions and treats a live object
      image as a central runtime and persistence artifact. Its community traditionally
      distributes code through in-image systems such as Monticello and SqueakMap, while
      operating-system packages mainly deliver the virtual machine and starting image.
  project-history:
    - >
      Squeak was created at Apple in 1996 by Dan Ingalls, Ted Kaehler, John Maloney,
      Scott Wallace, and Alan Kay as a practical, portable Smalltalk-80 system written
      largely in itself. Apple released it for Internet collaboration; development later
      involved the team at Walt Disney Imagineering and ultimately a broader community.
      Modern Squeak bundles combine an image with the OpenSmalltalk virtual machine.
  related-projects:
    - Smalltalk-80 is Squeak's direct language and system lineage.
    - OpenSmalltalk VM is the standard virtual-machine family used for current Squeak bundles.
    - Monticello is Squeak's primary in-image source-code management system.
    - Squeak-derived and related systems include Etoys, Croquet, Cuis, and Pharo.
  sources:
    - https://ftp.squeak.org/docs/OOPSLA.Squeak.html
    - https://squeak.org/development/
    - https://squeak.org/documentation/
    - https://squeak.org/downloads/
    - https://wiki.squeak.org/squeak/1985
  summary:
    - >
      Squeak is an open, live Smalltalk programming system consisting of an object image
      and a portable virtual machine.
  timeline:
    - '1996: Squeak was created at Apple and released to the Internet community.'
    - '1996: Community contributors rapidly ported Squeak to Unix and Windows systems.'
    - >
      2003: Squeak 3.4 became the first community release independent of the earlier
      Apple and Disney stewardship.
    - '2026: Squeak 6.1 bundles were published for current desktop systems.'
  usage:
    - >
      Users launch a Squeak image in the virtual machine and program inside its live
      graphical environment using browsers, workspaces, inspectors, and debuggers.
      Application code, tools, and much session state live in the image; the
      accompanying changes and sources files preserve change history and source text.
