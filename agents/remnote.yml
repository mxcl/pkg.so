history:
  adoption-history:
    - >
      RemNote reports that it has served hundreds of thousands of users. Its desktop
      client extends the web application with offline use, local-only knowledge bases,
      multiple windows, local files, and automatic backups.
    - >
      The application is distributed to macOS package-manager users as the Homebrew cask
      `remnote`.
  package-nerd-significance:
    - >
      RemNote represents the convergence of linked, outline-oriented knowledge
      management and Anki-style spaced repetition in one desktop application.
    - >
      Its documented local SQLite knowledge-base files and backup archives are useful to
      users who care about offline access, inspectable storage, and recoverable personal
      data.
  project-history:
    - >
      RemNote was founded at MIT in 2020 to build tools for learning, thinking, and
      collaboration. The product combines networked note-taking with flashcard
      generation and scheduled review.
    - >
      The desktop application complements the browser version with offline operation and
      local knowledge bases. RemNote documents that a knowledge base is stored locally
      as `remnote.db`, with associated files and dated backup archives.
  related-projects:
    - Anki
    - Obsidian
    - Roam Research
  sources:
    - https://help.remnote.com/en/articles/6030835-desktop-app
    - https://help.remnote.com/en/articles/6301627-remnote-backups
    - https://www.remnote.com/about
    - source_facts.package-manager.brew-cask
  summary:
    - >
      RemNote is a learning-focused knowledge-management application that combines
      linked notes, flashcards, and spaced repetition. Founded at MIT in 2020, it is
      available as a web application and an offline-capable desktop client.
  timeline:
    - '2020: RemNote was founded at MIT.'
    - >
      2026: Official desktop documentation describes local-only knowledge bases, offline
      access, and automatic local backups.
  usage:
    - >
      Users write structured notes, turn material into flashcards, and review cards on a
      spaced-repetition schedule.
    - >
      Desktop users can work offline or create local-only knowledge bases. Local backups
      are managed from Settings > Backups, while the knowledge-base settings expose the
      user-selected Local Storage Location.
