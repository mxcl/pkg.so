history:
  adoption-history:
    - >
      The official page links a tarball, RPM packages, and CVS, and the supplied package
      facts show continued packaging in Homebrew, Debian, MacPorts, and Ubuntu.
    - >
      The project also seeded a small ecosystem around terminal recording. The official
      links list IPBT, TTYPLAYER, Term::TtyRec, x11rec, and related experiments; ttygif
      later used ttyrec files as its input format.
  package-nerd-significance:
    - >
      ttyrec is historically significant because it is one of the compact ancestors of
      terminal demo tooling: before browser terminals and asciinema-style casts, it gave
      Unix users a packageable format for recording and replaying terminal work.
    - >
      For package maintainers, it remains a small C utility with multiple executables
      (`ttyrec`, `ttyplay`, and `ttytime`) and a long tail of dependent or adjacent
      tools, especially converters and web players.
  project-history:
    - >
      The official 0xcc page records ttyrec 1.0 as released on 2000-12-27, calling it
      the first version. The same page was last modified in 2006 and lists ttyrec 1.0.8
      as the 2006-06-11 release.
    - >
      ttyrec's model was deliberately small: record terminal bytes plus timing, then
      play them back. The page says it can record programs running on a tty such as
      Emacs in terminal mode, vi, lynx, or arbitrary tty programs.
  related-projects:
    - >
      The official page lists IPBT, TTYPLAYER, Term::TtyRec, x11rec, and chatty as
      related links.
    - ttygif is a later converter that uses ttyrec recordings as input.
  sources:
    - http://0xcc.net/ttyrec
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      ttyrec is a tty recorder and playback tool for terminal sessions. The official
      page says recorded data can be replayed with `ttyplay`, and describes ttyrec as
      derived from the Unix `script` command with added timing information at
      microsecond accuracy.
  timeline:
    - '2000: ttyrec 1.0 released as the first version.'
    - '2003: TTYPLAYER added to the official links.'
    - '2005: IPBT added to the official links.'
    - '2006: ttyrec 1.0.8 released with a playback time-drift reduction hack.'
  usage:
    - >
      The basic documented workflow is `ttyrec` to record an interactive shell, `ttyrec
      -e command` to record a specific command, and `ttyplay ttyrecord` to replay the
      result. Playback can be sped up, slowed down, reset to normal speed, or watched in
      real time with `ttyplay -p`.
    - >
      The official page also documents `ttytime` for measuring recorded data duration,
      gzip/gunzip handling for large recordings, a uuencode-based file-transfer option,
      and an inetd-based `ttyplay` server for serving recordings over telnet.
