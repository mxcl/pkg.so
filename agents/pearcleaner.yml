history:
  adoption-history:
    - >
      Pearcleaner is distributed as a native macOS application and through Homebrew. Its
      package-manager integration extends beyond installation: the application can
      optionally keep Homebrew's installed-cask state synchronized when it removes an
      application.
    - >
      The project grew from a focused uninstaller into a broader Mac-maintenance suite
      covering orphan searches, package receipts, services, application updates,
      development caches, universal-binary thinning, and basic Steam cleanup.
  package-nerd-significance:
    - >
      Pearcleaner is notable to Mac package users because it treats application removal
      as a package-state problem rather than merely deleting an app bundle. It searches
      for related files, understands Homebrew-installed applications, exposes a CLI, and
      includes a self-uninstall facility.
    - >
      Its source-available implementation, automation URLs, Finder extension, optional
      privileged helper, and maintenance utilities make it useful for examining the many
      filesystem and permission details hidden behind macOS application installation and
      removal.
  project-history:
    - >
      The developer describes Pearcleaner as a Swift learning project inspired by
      Freemacsoft's AppCleaner and an app-cleaner script discussed by Sun Knudsen. It
      was created to explore how macOS installs and uninstalls applications.
    - >
      The 3.x line added semantic versioning, orphan-file cleaning, Homebrew cleanup,
      folder controls, a Finder extension, and a menu-bar mode. Later releases added a
      privileged helper and broader package and update management. The official
      repository now describes active development as on hold after development largely
      stopped at the end of 2025.
  related-projects:
    - >
      Freemacsoft AppCleaner and Sun Knudsen's app-cleaner script are identified by the
      developer as inspirations.
    - >
      Pearcleaner includes an optional Sentinel monitor for cleaning associated files
      when applications are moved to Trash.
  sources:
    - https://github.com/alienator88/Pearcleaner
    - https://github.com/alienator88/Pearcleaner/blob/main/announcements.json
    - https://github.com/alienator88/Pearcleaner/releases
    - https://github.com/alienator88/Pearcleaner/wiki
  summary:
    - >
      Pearcleaner is a source-available macOS application uninstaller and maintenance
      utility. It removes application bundles and associated files, searches for
      leftovers, and supplies optional automation, package-management, and
      system-cleanup features.
  timeline:
    - '2023: Pearcleaner began its public release history as a macOS app-cleaner project.'
    - >
      2024: The 3.x series expanded orphan scanning, Homebrew integration, Finder
      workflows, and interface options.
    - >
      2025: The 4.x and 5.x series broadened Pearcleaner into package, service, and
      application-update management.
    - >
      End of 2025: Active development largely stopped; the official repository
      subsequently marked the project on hold.
  usage:
    - >
      Users select or drag an application into Pearcleaner, review the associated files
      it finds, and approve their removal. Separate searches cover files left behind by
      applications that have already been uninstalled.
    - >
      Advanced users can enable the Finder extension, Sentinel Trash monitor, Homebrew
      cleanup, CLI, or `pear://` deep links. Full Disk Access and other macOS
      permissions are required only for operations that need them.
