history:
  adoption-history:
    - >
      LibDsk's adoption is concentrated in retrocomputing and emulator ecosystems. Its
      official page names CPMTOOLS integration, emulator tools that convert between real
      floppies and images, and floppy-controller emulation as intended uses, which
      explains why distributions package the command-line utilities even though the
      audience is specialized.
  package-nerd-significance:
    - >
      LibDsk matters because disk-image support is usually a graveyard of one-off
      converters. Packaging one maintained library with many obscure floppy formats
      keeps retrocomputing workflows reproducible and prevents every emulator or CP/M
      tool from carrying its own partial disk-format parser.
  project-history:
    - >
      The official LibDsk page positions the library between real floppy hardware,
      emulator disk-image formats, filesystem utilities, and floppy-controller
      emulation. It supports raw files and devices, CPCEMU/JOYCE-style .DSK images,
      MYZ80 hard-drive images, NanoWasp, CFI, CopyQM, TeleDisk, Compaq QRST, APRIDISK,
      LDBS, rcpmfs, serial-line LibDsk instances, and other formats.
    - >
      The documented 1.4.x and 1.5.x histories show continued maintenance for unusual
      formats and preservation edge cases: JV3, CP2, Commodore D64/D64CPM, QRST, SAP,
      Gotek layouts, Apple Disk Copy 4.2, D88, and the LDBS/LDBST formats. The page also
      documents Linux kernel FDRAWCMD deprecation as a practical constraint for direct
      floppy access after Linux 5.18.
  related-projects:
    - >
      The official page links LibDsk to CPMTOOLS, JOYCE, Lib765, Diskette Tools, AUXD,
      CPC/PCW/Spectrum +3 CP/M use cases, Gotek USB floppy images, and emulator .DSK
      formats.
  sources:
    - https://www.seasip.info/Unix/LibDsk
  summary:
    - >
      LibDsk is John Elliott's library and utility suite for accessing floppy disks and
      disk image files, especially formats used by emulators, CP/M tools, and
      retrocomputing workflows.
  timeline:
    - >
      2022: Official page notes Linux FDRAWCMD deprecation in Linux 5.18+ as a
      direct-access concern.
    - '2024: Official page lists 1.4.2 as stable and 1.5.22 as development downloads.'
    - '1.4.x: JV3 support and IMD driver fixes documented.'
    - >
      1.5.x: LDBS rewrite, D64/D64CPM, CP2, QRST, SAP, Gotek, dc42, LDBST, D88, and
      additional utilities documented.
  usage:
    - >
      Packaged utilities such as `dskdump`, `dskform`, `dskid`, `dskscan`, `dsktrans`,
      `dskutil`, and related tools make LibDsk useful for converting, scanning,
      formatting, identifying, and transferring disk images. The library side lets
      emulators and filesystem tools use the same format backends.
