history:
  adoption-history:
    - >
      Descript's early adopters included podcast teams such as NPR's Rough Translation
      and Planet Money. It subsequently broadened from podcast production into video
      editing, screen recording, collaboration, and AI-assisted media creation.
  package-nerd-significance:
    - >
      Descript is notable for making transcript-based editing the primary interface for
      recorded media. For package-manager users, the cask provides a convenient
      installation entry point for a proprietary, self-updating desktop application
      whose main projects and collaboration services are cloud-connected.
  project-history:
    - >
      Descript developed a document-like approach to media editing in which changing a
      transcript changes the underlying audio or video. Its 2019 release of Podcast
      Studio and Overdub was described by the company as Descript 1.0 and combined
      multitrack podcast production with typed voice correction.
    - >
      The company acquired the Lyrebird voice-synthesis team in 2019. Descript later
      expanded beyond audio and podcast production into full video editing, screen
      capture, publishing, collaboration, and generative-AI-assisted workflows.
  related-projects:
    - >
      Lyrebird, founded in 2017 and acquired by Descript in 2019, supplied research and
      technology for AI-generated speech and media synthesis.
    - >
      Descript Rooms is the company's browser-based remote recording and conferencing
      workflow connected to the editor.
  sources:
    - https://help.descript.com/hc/en-us/articles/10601763396493-Make-your-first-video
    - https://www.descript.com/about
    - https://www.descript.com/blog/article/introducing-descript-podcast-studio-overdub
    - https://www.descript.com/blog/article/introducing-descript-video-and-screen-recording
    - https://www.descript.com/research
  summary:
    - >
      Descript is a proprietary collaborative audio and video editor built around
      transcript-based editing. It combines recording, transcription, timeline editing,
      screen capture, publishing, and AI-assisted cleanup or generation in one desktop
      and web-oriented workflow.
  timeline:
    - '2019: Descript released Podcast Studio and Overdub as what it called Descript 1.0.'
    - '2019: Descript acquired the Lyrebird speech-synthesis team.'
    - '2020: Descript expanded into full video editing and screen recording.'
  usage:
    - >
      Users record or import audio and video, let Descript transcribe the material, and
      edit the recording by editing its text. Timeline tools, scenes, captions, layouts,
      AI audio cleanup, voice generation, collaboration, and local or hosted export
      support podcast, video, and business-communication workflows.
