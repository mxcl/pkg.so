history:
  adoption-history:
    - >
      grepcidr's niche is operational networking: mail filtering, network security, log
      analysis, and custom pipelines where a full IP-address database or firewall tool
      would be too heavy. Its adoption in package managers follows from being a
      single-purpose Unix filter with no documented configuration or credential state.
  package-nerd-significance:
    - >
      grepcidr is package-nerd significant because it is a tiny specialist filter that
      fills a gap between grep and heavier network-analysis tools. It lets shell users
      keep grep-like pipelines while making CIDR math correct enough for log and abuse
      workflows.
    - >
      The official fork note matters for packaging: downstreams need to know whether
      they are shipping Berkes' grepcidr 2.0 line or Levine's unrelated implementation.
  project-history:
    - >
      Jem Berkes identifies the pc-tools.net grepcidr as the original project, created
      in 2004 and released as grepcidr 2.0 on 2014-05-26. The official page emphasizes
      that the 2.0 line is distinct from John Levine's separately developed fork, even
      though both names can confuse users.
    - >
      Version 2.0 added IPv6 support, replaced a regex-based scanner with a hints
      scanner reported as faster on some platforms, enforced stricter IP text matching,
      added multiple file arguments, supported unlimited input line length, and improved
      CIDR validation.
  related-projects:
    - grep is the interface model for matching and inverted matching.
    - >
      John Levine's grepcidr-2 fork is called out by the official page as an unrelated
      implementation.
    - Spamhaus is credited on the official page for sponsorship and testing of features.
  sources:
    - https://www.pc-tools.net/unix/grepcidr
  summary:
    - >
      grepcidr is a small C command-line filter for matching IPv4 and IPv6 addresses
      against CIDR patterns. It borrows grep's interface style for a networking-specific
      job: select or reject log lines by address range.
  timeline:
    - '2004: Original grepcidr project created, according to the official project page.'
    - >
      2014: grepcidr 2.0 released with IPv6 support, faster scanning, stricter matching,
      and multiple-file support.
    - >
      2014: Official page documented the distinction between Berkes' project and the
      separately developed grepcidr-2 fork.
  usage:
    - >
      The official examples show grepcidr matching an IPv6 documentation prefix against
      a log file and matching a Googlebot-era IPv4 CIDR range against access.log.
      Options include count output, inverted matching, strict CIDR alignment, strict
      start-of-line matching, command-line patterns, and pattern files.
