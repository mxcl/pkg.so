id: cask:emacs-app
display-name: Emacs
repo: https://github.com/caldwell/build-emacs
docs:
  - https://www.gnu.org/software/emacs/documentation.html
  - https://www.gnu.org/software/emacs/manual/html_node/emacs
config-file-location:
  unix:
    - ~/.emacs
    - ~/.emacs.el
    - ~/.emacs.d/init.el
    - ~/.config/emacs/init.el
credentials-file-location: null
history:
  adoption-history:
    - >
      GNU Emacs became a standard editor in GNU and Unix-like development culture. GNU
      now documents support across GNU/Linux, BSD variants, macOS, Windows, Android,
      Solaris, Haiku, and other systems; its macOS download guidance explicitly
      recognizes packaged graphical builds.
    - >
      Emacs for Mac OS X packages the graphical application as a conventional Emacs.app,
      making upstream GNU Emacs convenient to install and launch in a native macOS
      environment.
  package-nerd-significance:
    - >
      Emacs is both an editor and an Emacs Lisp runtime with a long-lived package
      ecosystem. Its programmable editing model, major and minor modes, built-in Info
      manuals, and user-controlled initialization files make it a foundational package
      for reproducible developer workstations.
    - >
      The emacs-app cask is notable because it supplies a ready-made macOS application
      bundle while retaining the behavior and customization model of GNU Emacs.
  project-history:
    - >
      GNU Emacs was created as the GNU Project's extensible, freely distributable Emacs
      implementation. Its initial public release was announced in 1985, followed by
      decades of numbered releases and continuous maintenance.
    - >
      The Emacs for Mac OS X distribution builds macOS application bundles from GNU
      Emacs sources and adds distribution-specific launcher machinery for compatibility
      across supported macOS builds.
  related-projects:
    - GNU Emacs
    - Emacs Lisp
    - Emacs for Mac OS X
    - Homebrew Cask
  sources:
    - https://github.com/caldwell/build-emacs
    - https://www.gnu.org/software/emacs/documentation.html
    - https://www.gnu.org/software/emacs/download
    - https://www.gnu.org/software/emacs/history.html
  summary:
    - >
      Emacs for Mac OS X is a packaged macOS application distribution of GNU Emacs, the
      extensible text editor and Emacs Lisp environment.
  timeline:
    - '1985: GNU Emacs received its initial public release.'
    - >
      2012: Distribution-specific launcher code in the build-emacs project dates from
      this period.
    - '2025: GNU Emacs 30 reached its first stable releases.'
  usage:
    - >
      Users edit text and source code, run language-aware major modes, interact with
      shells and version-control tools, and extend the environment with Emacs Lisp
      packages. Persistent customization normally lives in an Emacs initialization file.
tags:
  - code-editor
  - emacs-lisp
  - extensible
  - gnu
  - macos
  - text-editor
