id: brew:molecule
display-name: Molecule
repo: https://github.com/ansible/molecule
docs:
  - https://docs.ansible.com/projects/molecule
  - https://github.com/ansible/molecule#readme
config-file-location:
  unix:
    - ~/.config/molecule/config.yml
    - ./config.yml
    - extensions/molecule/config.yml
    - molecule.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      In practice, Molecule gives role and collection authors a repeatable local and CI
      workflow: initialize a scenario, create or converge test instances, run Ansible
      content, then verify behavior through Ansible-native checks or external verifiers.
      The docs show CI use with GitHub Actions, Travis CI, GitLab CI, Azure Pipelines,
      and molecule test. Community adoption is visible in Ansible role maintainers
      replacing homegrown Docker-based test rigs with Molecule-based tests after the Red
      Hat adoption announcement.
  project-history:
    - >
      The major adoption turning point came in 2018, when Ansible announced that it
      would adopt molecule and ansible-lint as official Red Hat Ansible projects. The
      announcement said the tools were community-built and important to Ansible
      automation development, thanked Cisco and John Dewey for work on Molecule, and
      described migration of the repositories to the ansible GitHub organization while
      keeping the PyPI package name molecule. That move gave Molecule a formal place in
      the Ansible toolchain rather than leaving it as a separate community utility.
  sources:
    - >
      https://developers.redhat.com/articles/2023/09/13/introducing-ansible-molecule-ansible-automation-platform
    - https://docs.ansible.com/projects/molecule/
    - https://docs.ansible.com/projects/molecule/ci/
    - https://forum.ansible.com/t/ansible-to-adopt-molecule-and-ansible-lint-projects/28657
    - https://github.com/ansible/molecule/
    - https://www.jeffgeerling.com/blog/2018/testing-your-ansible-roles-molecule/
  summary:
    - >
      Molecule is an Ansible testing framework for developing and testing Ansible
      collections, playbooks, and roles. The Ansible project README credits Retr0h as
      the creator and describes the project as community-maintained as part of Ansible
      by Red Hat. Its official documentation presents Molecule as a framework that uses
      standard Ansible concepts such as inventory, playbooks, and collections to test
      systems reachable through containers, virtual machines, cloud infrastructure,
      APIs, databases, network devices, and other targets.
  usage:
    - >
      The project broadened from role-only testing toward playbooks and collections. Red
      Hat's 2023 Molecule 6 developer-preview article framed Molecule as part of the
      Ansible Automation Platform developer experience and emphasized functional testing
      for Ansible content, including collection-level testing and making the Testinfra
      verifier optional in favor of Ansible-native validation.
related-packages:
  - id: brew:ansible-lint
    reason: >
      Use ansible-lint for static rule and style checks alongside Molecule's
      execution-based testing of the same Ansible content.
    rel: adjacent_workflow
    sources:
