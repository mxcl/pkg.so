history:
  adoption-history:
    - >
      The official download page tracks support for newer macOS releases and growing
      Apple Silicon compatibility. Official sources provide no quantitative
      user-adoption figures.
  package-nerd-significance:
    - >
      Porting Kit packages Wine-based Windows software into a catalog-driven Mac
      workflow. It is notable to package enthusiasts because it combines compatibility
      engines, wrappers, application recipes, and downloadable releases behind a native
      launcher.
  project-history:
    - >
      Porting Kit was created to simplify installing Windows games and applications on
      macOS through preconfigured ports. Its official site explicitly relates the
      project to Wineskin and CrossOver, while its release infrastructure publishes the
      application and engine updates separately.
    - >
      The official changelog documents the 5.x series during 2022, including a move to
      Electron-related components, custom-port handling, Wine engine updates, and
      release publication through GitHub. The current official download surface
      distributes Porting Kit 7 for modern macOS.
  related-projects:
    - Wine
    - Wineskin
    - CrossOver
    - Porting Kit Engines
  sources:
    - 'Official changelog: https://www.portingkit.com/pub/portingkit/changelog.html'
    - >
      Official release repository supplied by source_facts.repo:
