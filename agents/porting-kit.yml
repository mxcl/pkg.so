    - 'Official site: https://www.portingkit.com/'
    - 'Official tutorial and download page: https://www.portingkit.com/app/download.html'
  summary:
    - >
      Porting Kit is a macOS application for installing and managing Windows games and
      applications through prepared compatibility ports.
  timeline:
    - '2022: The official changelog records the Porting Kit 5 release series'
    - >
      Current generation: The official download page distributes Porting Kit 7 for macOS
      12 and later
  usage:
    - >
      Users select a supported title or create a custom port, then let Porting Kit
      obtain and configure the required compatibility engine and wrapper. The official
      tutorial is recommended before installing game ports.
