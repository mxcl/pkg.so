history:
  adoption-history:
    - >
      Opera positioned Air as a specialized alternative within its desktop-browser
      family, aimed at people seeking fewer distractions and built-in support for focus
      and breaks. Reliable official sources do not yet provide enough evidence for a
      longer-term adoption assessment.
  package-nerd-significance:
    - >
      Opera Air illustrates the packaging of a Chromium-family browser as a separately
      installed, audience-specific desktop product rather than merely a feature mode in
      the standard Opera browser.
  project-history:
    - >
      Opera introduced Opera Air on February 4, 2025 as a desktop browser built around
      mindfulness and well-being. Its launch combined ordinary web browsing with a
      minimalist interface, guided breaks, breathing and meditation exercises,
      stretching, and configurable audio “Boosts” using music, nature sounds, and
      binaural beats.
  related-projects:
