    - https://www.opera.com/air — official features and FAQ.
    - source_facts.description
    - source_facts.homepage
  summary:
    - >
      Opera Air is Opera's mindfulness-oriented desktop web browser, designed to combine
      everyday browsing with focus and well-being tools.
  timeline:
    - '2025: Opera launched Opera Air as a mindfulness-focused browser.'
  usage:
    - >
      Users browse normally while optionally using Breaks for guided pauses and Boosts
      for focus, relaxation, or energy. Opera also supports importing passwords,
      bookmarks, and other browser data when switching.
