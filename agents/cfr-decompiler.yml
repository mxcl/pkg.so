history:
  adoption-history:
    - >
      CFR's adoption comes from the Java reverse-engineering and debugging niche:
      developers use it when they need readable Java-like output from class files or
      jars, especially for newer language features that older decompilers may not handle
      cleanly.
    - >
      Official distribution includes the benf.org jar downloads, GitHub release
      artifacts, and Maven Central. The Homebrew package wraps that Java tool in a
      package-manager-friendly executable for macOS users.
  package-nerd-significance:
    - >
      CFR matters to package people because decompilers are operational tools as much as
      developer tools: they are installed when source is missing, artifacts are
      suspicious, or bytecode behavior needs inspection.
    - >
      It is also a classic example of a small Java jar that package managers wrap into a
      named executable. The package value is not dependency complexity; it is putting a
      known decompiler on PATH.
  project-history:
    - >
      The official GitHub repository was created in May 2014 and points users to
      benf.org as the main CFR site. The README says CFR can decompile modern Java
      features, including Java 9, 12, and 14 features, and can make a reasonable attempt
      at JVM languages such as Kotlin, Scala, and Groovy.
    - >
      The benf.org project page records a long release history, including 0.146 in July
      2019, 0.147 in October 2019, 0.150 in May 2020, 0.151 in February 2021, and 0.152
      in December 2021. The README notes that since 0.145, binaries have also been
      published on GitHub releases.
  related-projects:
    - The Java compiler and JVM class-file format are the direct targets CFR decompiles.
    - >
      Kotlin, Scala, and Groovy are named in the README as JVM languages whose class
      files CFR may attempt to turn back into Java.
    - Maven Central is an official distribution channel for CFR artifacts.
  sources:
    - https://api.github.com/repos/leibnitz27/cfr
    - https://github.com/leibnitz27/cfr
    - https://www.benf.org/other/cfr/
    - https://github.com/leibnitz27/cfr#readme
    - https://www.benf.org/other/cfr
    - https://formulae.brew.sh/api/formula/cfr-decompiler.json
  summary:
    - >
      CFR is a Java bytecode decompiler distributed as the `cfr-decompiler` Homebrew
      formula. Its official site describes it as another Java decompiler that can handle
      modern Java features while being written in Java 6 for broad runtime
      compatibility.
  timeline:
    - '2014: The leibnitz27/cfr public repository is created on GitHub.'
    - '2019: CFR 0.146 and 0.147 add support and fixes for Java and Kotlin bytecode patterns.'
    - >
      2021: CFR 0.152 is published on benf.org with support and fixes for newer Java
      features including sealed classes.
    - >
      2026: The official site notes renewed tinkering and points users to the GitHub
      repository for a modern version.
  usage:
    - >
      The documented use is to run the versioned jar against class names or class files,
      or pass an entire jar and an `--outputdir` when emitting files. The README also
      documents `--help` for arguments.
    - >
      CFR supports an options file for decompilation tests, but the official user docs
      do not document a persistent application config path or credential file for normal
      CLI use, so both locations are null.
related-packages:
  - id: brew:procyon-decompiler
    reason: >
      Choose Procyon as another modern Java class-file decompiler when comparing
      reconstructed output or when its Java 5-and-later decompiler and API better fit
      the workflow; CFR's author explicitly identifies it as a strong peer with a shared
      test suite.
    rel: alternative
    sources:
      - https://www.benf.org/other/cfr/faq.html
      - https://github.com/mstrobel/procyon#readme
      - https://github.com/mstrobel/procyon/wiki/Decompiler-API
