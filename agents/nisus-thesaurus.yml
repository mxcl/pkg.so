history:
  adoption-history:
    - >
      Nisus Thesaurus was designed to work beyond Nisus's own word processors through
      the macOS Services system. This let users invoke it from Services-aware
      applications such as Safari, Mail, and TextEdit. Nisus continued maintaining it
      across major macOS transitions, including Snow Leopard, Catalina, dark mode, and
      Apple Silicon.
  package-nerd-significance:
    - >
      It is a long-lived, narrowly focused native Mac utility built around the open
      WordNet lexical database. Its Services integration reflects a distinctively macOS
      approach to composing small applications into system-wide writing workflows, while
      its Homebrew Cask entry makes the utility script-installable.
  project-history:
    - >
      Nisus Software released Nisus Thesaurus 1.0 in 2003 as a free OS X application. It
      combined a WordNet-based lexical database with native OS X Services integration
      and integration with Nisus Writer. Subsequent maintenance concentrated on
      compatibility with new Mac hardware and operating-system releases.
  related-projects:
    - >
      Nisus Writer Pro and Nisus Writer Express integrate directly with the thesaurus.
      WordNet supplies its underlying lexical reference data.
  sources:
    - 'Official Nisus Software history: https://nisus.com/about/history.php'
    - 'Official Nisus Thesaurus blog archive: https://nisus.com/blogs/category/nisus-thesaurus/'
    - 'Official product page: https://nisus.com/Thesaurus/'
    - source_facts.package-manager
  summary:
    - >
      Nisus Thesaurus is a free native macOS thesaurus from Nisus Software. It uses
      WordNet data and can operate as a standalone application, through macOS Services,
      or from Nisus writing applications.
  timeline:
    - '2003: Nisus Thesaurus 1.0 was released as a free OS X application.'
    - '2009: Nisus published compatibility updates for Snow Leopard.'
    - '2012: Nisus Thesaurus was updated for Mountain Lion.'
    - '2019: Dark Mode and Catalina compatibility were added.'
    - '2020: Nisus released native Apple Silicon support.'
  usage:
    - >
      Users select a word in a Services-aware application and invoke Nisus Thesaurus
      from the Services menu, or search directly in the standalone application. Results
      group related words by relationship and distinguish different meanings with a
      built-in glossary.
