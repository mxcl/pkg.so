id: brew:epr
display-name: epr
repo: https://github.com/wustho/epr
docs:
  - https://github.com/wustho/epr#readme
config-file-location:
  unix:
    - ~/.config/epr/config
    - ~/.epr
credentials-file-location: null
history:
  adoption-history:
    - >
      epr became popular enough for packaging across several ecosystems and accumulated
      notable GitHub attention for a niche terminal reader. The README also points users
      toward epy, the author's more featureful fork that supports more formats and
      reading features.
  package-nerd-significance:
    - >
      epr is the kind of package terminal users like because it turns a GUI-heavy
      activity into a shell command. Its small dependency footprint and plain
      config/state files make it easy to package and easy to reason about.
  project-history:
    - >
      The GitHub repository was created in March 2019. The project kept the classic Unix
      shape of a single-purpose command-line reader, with installation paths through
      PyPI, pip from Git, Homebrew, Chocolatey, AUR, or manual placement in PATH.
  related-projects:
    - epy is the author's more featureful fork of epr.
    - ebooklib and rupa/epub are listed as inspirations in the README.
  sources:
    - https://github.com/wustho/epr
    - https://raw.githubusercontent.com/wustho/epr/master/README.md
    - https://api.github.com/repos/wustho/epr
  summary:
    - >
      epr is a small Python terminal EPUB reader. Its README emphasizes a
      keyboard-oriented CLI experience: remembering the last book and per-file reading
      state, adapting to terminal resize, supporting EPUB3 text, opening embedded
      images, and providing simple dark and light color schemes.
  timeline:
    - '2019: The GitHub repository is created.'
    - '2023: The repository records a February 2023 push in the cited metadata.'
    - >
      2020s: The README documents installation through PyPI, Homebrew, Chocolatey, AUR,
      and manual PATH placement.
  usage:
    - >
      Users invoke epr with an EPUB path or without arguments to resume the last read
      file. It stores per-file reading state in $HOME/.config/epr/config or $HOME/.epr,
      and it can search reading history by passing words from a previous path.
related-packages:
  - id: brew:bk
    reason: >
      Choose bk for a Rust-based terminal EPUB reader with a single binary,
      wide-character support, bookmarks, links, and incremental search; its official
      comparison notes that epr instead provides images, regex search, and history-based
      file selection.
    rel: alternative
    sources:
      - https://github.com/aeosynth/bk#comparison
      - https://github.com/wustho/epr#readme
tags:
  - cli
  - ebook-reader
  - epub
  - python
  - terminal
