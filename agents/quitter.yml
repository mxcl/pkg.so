history:
  adoption-history:
    - >
      Arment released Quitter as a free direct-download Mac application. He explained
      that its inability to operate within Apple's application sandbox made Mac App
      Store distribution unlikely.
    - >
      The application is also available through Homebrew Cask, giving
      command-line-oriented Mac users a package-managed installation route.
  package-nerd-significance:
    - >
      Quitter is a small example of a personal automation script becoming a polished
      desktop utility. Its direct distribution outside the Mac App Store also
      illustrates why Homebrew Cask is useful for sandbox-incompatible Mac software.
  project-history:
    - >
      Marco Arment first described the underlying idea in October 2015 as Automatic
      Social Discipline, an AppleScript periodically run by launchd to quit distracting
      social and news applications.
    - >
      On May 2, 2016, Arment introduced Quitter as his first Mac application. It
      converted the script's idea into an interface where individual inactive
      applications could be hidden or quit after chosen delays.
  related-projects:
    - >
      Quitter grew from Marco Arment's Automatic Social Discipline AppleScript and
      launchd workflow.
    - QuitAll offers related manual and automatic application-quitting features.
  sources:
    - Homebrew distribution is identified by source_facts.package-manager.brew-cask.
    - 'Official apps page: https://marco.org/apps'
    - 'Official launch announcement: https://marco.org/2016/05/02/quitter'
    - 'Official origin article: https://marco.org/2015/10/30/automatic-social-discipline'
  summary:
    - >
      Quitter is a free macOS productivity utility by Marco Arment that automatically
      hides or quits selected applications after periods of inactivity.
  timeline:
    - >
      2015: Arment published the Automatic Social Discipline AppleScript that inspired
      Quitter.
    - "2016: Quitter launched as Arment's first Mac application."
  usage:
    - >
      Users add distracting applications such as chat clients, social clients, news
      readers, or email applications and assign an inactivity delay followed by either
      Hide or Quit.
    - >
      Quitter is intended to reduce ambient distraction while leaving applications
      available when actively used. Its preferences are managed in the application; no
      official configuration-file path is documented.
