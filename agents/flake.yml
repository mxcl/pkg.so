history:
  adoption-history:
    - >
      Upstream lists official source, Linux x86, and Windows binary downloads, plus an
      unofficial Win32 archive. It also notes that Winamp 5.35 used Flake revision 117
      as its FLAC encoder, a notable downstream adoption signal for a small codec
      project.
  package-nerd-significance:
    - >
      Flake is historically interesting because it was not just another frontend for
      libFLAC; it was an independent encoder implementation chasing speed and
      alternative compression-search behavior while still targeting the FLAC
      specification.
    - >
      For package collectors, it is a compact example of how codec experiments were
      distributed before GitHub dominance: SourceForge project page, tarballs, binary
      zips, SVN checkout command, and a small standalone command-line executable.
  project-history:
    - >
      The official site, copyright 2007, describes Flake as an independent
      implementation of the FLAC specification and an alternative to the reference
      encoder. It emphasizes command-line encoding, a libflake library, fast encoding,
      compression modes similar to the reference encoder, additional high-compression
      modes, and experimental variable block-size encoding.
    - >
      The official download page lists Flake 0.11 source and binary downloads, plus SVN
      checkout instructions for the development tree. The project therefore sits in the
      late-2000s SourceForge/SVN ecosystem rather than the later GitHub-centered FLAC
      tooling world.
  related-projects:
    - FLAC, libflake, Winamp, SourceForge, SVN, independent audio codec implementations.
  sources:
    - https://flake-enc.sourceforge.net/
    - https://flake-enc.sourceforge.net/download.html
  summary:
    - >
      Flake is an independent open-source FLAC encoder from the SourceForge era, built
      as a faster alternative to the official FLAC reference encoder.
  timeline:
    - >
      2007: Official site copyright and public project page describe Flake as an
      open-source FLAC encoder.
    - '2007: Flake 0.11 source archive and binaries published on the official download page.'
    - '2007: Winamp 5.35 noted by upstream as using Flake revision 117 as its FLAC encoder.'
  usage:
    - >
      Flake's package-manager use is straightforward: install the flake executable and
      run it as a command-line FLAC encoder. Developers could also use libflake as an
      encoding library, though the official page is clear that the project did not yet
      match all advanced features of the reference encoder.
related-packages:
  - id: brew:flac
    reason: >
      Choose FLAC for the official reference encoder, decoder, metadata tools, and
      maintained libraries; choose Flake when specifically evaluating its independent,
      speed-oriented encoder implementation.
    rel: alternative
    sources:
