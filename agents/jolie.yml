history:
  adoption-history:
    - >
      Jolie's adoption has been strongest in academia, research, and specialized
      microservice tooling. The official academia page lists universities, research
      collaborations, EU projects, and publications covering Jolie, service-oriented
      programming, microservices, Docker, refinement types, testing, and
      choreography-related work.
    - >
      Homebrew packages Jolie as a command-line language runtime with OpenJDK as a
      dependency, exposing tools such as jolie, joliec, joliedoc, jolie2java,
      jolie2openapi, jolie2wsdl, openapi2jolie, and wsdl2jolie.
  package-nerd-significance:
    - >
      Jolie is package-nerd-interesting because it packages a research language with
      many service-integration tools as a normal CLI formula. It is also a reminder that
      language runtimes in package managers are not only compilers and REPLs; sometimes
      they bundle protocol adapters, IDL converters, documentation tools, and
      microservice scaffolding commands.
  project-history:
    - >
      Jolie's published research roots go back to the 2006 paper JOLIE: a Java
      Orchestration Language Interpreter Engine by Fabrizio Montesi, Claudio Guidi,
      Roberto Lucchi, and Gianluigi Zavattaro. That work positioned Jolie as an
      interpreter and engine for orchestration programs with a C/Java-like syntax
      instead of XML-based orchestration languages such as WS-BPEL.
    - >
      The public GitHub repository was created in 2015, and early GitHub releases in
      2015 and 2016 show the project already publishing 1.x language/runtime versions.
      The official site names Claudio Guidi and Fabrizio Montesi as responsible for
      language vision, design, and evolution, with Montesi handling language development
      and releases.
  related-projects:
    - >
      Related projects and concepts include WS-BPEL, SOCK, service-oriented computing,
      microservices research, Choreographic Programming, jolie/docs,
      jolie/awesome-jolie, jpm, Jolie language-server work, OpenAPI and WSDL converters,
      and Java/JVM packaging.
  sources:
    - https://api.github.com/repos/jolie/jolie
    - https://api.github.com/repos/jolie/jolie/releases?per_page=100
    - https://docs.jolie-lang.org/
    - https://formulae.brew.sh/formula/jolie
    - https://github.com/jolie/jolie
    - >
      https://www.fabriziomontesi.com/publication/jolie-a-java-orchestration-engine-interpreter-engine
    - https://www.jolie-lang.org/
    - https://www.jolie-lang.org/about_jolie.html
    - https://www.jolie-lang.org/academia.html
  summary:
    - >
      Jolie is a service-oriented programming language implemented on the JVM and
      designed to make microservice and distributed-service abstractions native language
      features. The upstream repository describes it as a language for developing
      microservices, while the documentation and academic pages present it as both a
      practical tool and a research vehicle.
  timeline:
    - >
      2006: The JOLIE orchestration-language paper was presented in the CoOrg/MTCoord
      proceedings.
    - >
      2014: The official academia page lists Service-Oriented Programming with Jolie as
      a Web Services Foundations chapter.
    - '2015: The jolie/jolie GitHub repository was created.'
    - '2015: GitHub release metadata includes Jolie v1.4.'
    - >
      2016: Official publications described Jolie community growth and refinement-type
      research.
    - '2025: GitHub release metadata includes the v1.13 release line.'
  usage:
    - >
      Jolie is used to write services where communication ports, protocols, interfaces,
      deployment, and behavior are first-class concerns. Its bundled tools support
      compilation, documentation, tracing, mocking, Java/OpenAPI/WSDL interop, and
      service-surface generation.
