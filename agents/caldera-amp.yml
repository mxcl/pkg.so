history:
  adoption-history:
    - >
      Caldera Amp is available for macOS, Windows, and Linux, while the input records
      its macOS distribution through the Homebrew Cask `caldera-amp`. It forms the
      desktop member of a wider Caldera Music family that also includes television and
      headless Linux players.
  package-nerd-significance:
    - >
      Amp offers a cross-platform, audiophile-oriented alternative endpoint for Plex
      music libraries, emphasizing native desktop integration, high-resolution and
      multichannel output, MilkDrop visualization, and multi-room playback rather than
      library-server duties.
  project-history:
    - >
      Caldera Amp was developed as the desktop player in the Caldera Music family. The
      same product line extends the playback engine to television clients and a
      lightweight headless Linux daemon.
    - >
      Official 2026 materials describe Amp as a self-updating menu-bar or system-tray
      application for macOS, Windows, and Linux, with Plex-native control and an
      emphasis on lossless, gapless, and multichannel playback.
  related-projects:
    - Caldera Music for TV provides the living-room interface.
    - Caldera Music Headless provides a Linux audio daemon.
    - >
      Plex Media Server supplies the user's library, while Plexamp or another Plex
      client can act as Amp's remote control.
  sources:
    - https://caldera.homes/music/
    - https://caldera.homes/music/amp/
    - https://caldera.homes/music/headless/
    - https://caldera.homes/music/privacy/
    - source_facts.package-manager
  summary:
    - >
      Caldera Amp is a desktop music player for Plex libraries. It runs from the macOS
      menu bar or Windows and Linux system tray and supports high-resolution audio,
      native multichannel playback, gapless playback, parametric equalization, MilkDrop
      visualization, caching, and synchronized multi-room output.
  timeline:
    - >
      2026: Official Caldera materials document Amp as the desktop member of the
      cross-platform Caldera Music player family.
  usage:
    - >
      After signing in through Plex's standard flow, the user selects Amp as a Plex
      playback target and controls its queue from Plexamp or another Plex client. Amp
      can expose a pop-out visualizer and route audio to a local DAC or multichannel
      device.
    - >
      Settings, audio caches, artwork, the last session, and recent logs remain on the
      device, although the official documentation does not publish their filesystem
      paths. Plex credentials are handled by Plex and are not stored by Caldera Music.
