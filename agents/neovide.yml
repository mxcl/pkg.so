id: brew:neovide
display-name: Neovide
repo: null
docs:
  - https://neovide.dev/
  - https://neovide.dev/config-file.html
  - https://neovide.dev/configuration.html
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/neovide/config.toml
    - ~/.config/neovide/config.toml
  macos:
    - ~/Library/Application Support/neovide/config.toml
  windows:
    - '%APPDATA%\neovide\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The repository had 15,088 stars and 619 forks when queried on 2026-07-01, making
      it one of the visible Neovim GUI projects. Neovim's own website lists Neovide
      among popular third-party UIs, which is a strong ecosystem signal.
    - >
      Homebrew's formula API listed `neovide` stable 0.16.2 on 2026-07-01, with 195
      installs in 30 days, 1,783 in 90 days, and 6,618 in 365 days. Distribution is
      broader than Homebrew alone: the docs mention Scoop, Arch, Nix, source builds,
      GitHub releases, and platform-specific binaries.
  package-nerd-significance:
    - >
      Neovide is a good example of Neovim's architectural bet paying off. It is not a
      separate editor fork; it is a packaged GUI that exists because Neovim exposes UI
      and RPC surfaces stable enough for third-party clients.
  project-history:
    - >
      The `neovide/neovide` repository was created on 2019-12-06, and early public
      discussion in January 2020 described it as a Rust Neovim GUI that aimed to be
      pretty without changing the terminal editing experience. That goal still matches
      the README: graphical improvements where possible, but functionally close to the
      terminal UI.
    - >
      Release tags show an early 0.1.0 tag on 2020-01-24 and a long 0.x line through
      0.16.x in 2026. The project grew alongside Neovim's API/UI model rather than
      replacing it: Neovide starts or attaches to Neovim and relies on Neovim for
      editing semantics.
  related-projects:
    - Neovim
    - Neovim third-party GUIs
    - Scoop extras/neovide
    - winget Neovide.Neovide
  sources:
    - https://api.github.com/repos/neovide/neovide
    - https://api.github.com/repos/neovide/neovide/releases?per_page=8
    - https://formulae.brew.sh/api/formula/neovide.json
    - https://github.com/neovide/neovide
    - https://neovide.dev/
    - https://neovide.dev/features.html
    - https://neovide.dev/installation.html
    - https://neovim.io/
  summary:
    - >
      Neovide is a Rust graphical client for Neovim. Its pitch is deliberately
      conservative: keep Neovim's behavior and plugin model, but present it with a
      polished GPU-backed GUI, font shaping, animations, smooth scrolling, remote
      attachment, and cross-platform packaging.
  timeline:
    - "{'date': '2019-12-06', 'event': 'The `neovide/neovide` repository was created.'}"
    - "{'date': '2020-01-24', 'event': 'The 0.1.0 tag was created.'}"
    - "{'date': '2026-04-14', 'event': 'Release 0.16.2 was published.'}"
  usage:
    - >
      Users install Neovide as an app or executable and keep `nvim` on the PATH. It can
      launch a Neovim instance itself or connect to an existing one over TCP, Unix
      domain sockets, or Windows named pipes using `--server`.
    - >
      Power users reach for it when they want real GUI font rendering, ligatures, emoji
      fallback, smooth animations, WSL support, or a local GUI attached to a
      remote/headless Neovim process. The important package distinction is that Neovide
      is a client; Neovim remains the editor engine.
related-packages:
  - id: brew:neovim
    reason: >
      Neovide is a GUI client for Neovim and requires the Neovim editor engine for
      editing, configuration, and plugins.
    rel: adjacent_workflow
    sources:
      - https://neovide.dev/installation
      - https://neovide.dev/
      - https://neovim.io/
  - id: brew:neovim-qt
    reason: >
      Choose Neovim Qt for a lightweight Qt-based Neovim GUI; choose Neovide for
      GPU-rendered animation, font shaping, and its Rust-based interface.
    rel: alternative
    sources:
      - https://github.com/equalsraf/neovim-qt
      - https://neovide.dev/features.html
  - id: brew:neovim-remote
    reason: >
      neovim-remote can address running Neovim instances, and Neovide explicitly
      documents its focus command as useful with that tool.
    rel: adjacent_workflow
    sources:
      - https://neovide.dev/commands.html
      - https://github.com/mhinz/neovim-remote
