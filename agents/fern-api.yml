id: brew:fern-api
display-name: Fern
repo: https://github.com/fern-api/fern
docs:
  - https://buildwithfern.com/learn
  - https://buildwithfern.com/learn/cli-reference
config-file-location:
  unix:
    - fern/fern.config.json
    - fern/generators.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Fern's adoption story is tied to API-first developer experience teams that want
      SDKs and documentation from one source of truth. The README points to public
      documentation sites built with Fern, including ElevenLabs, LaunchDarkly, and Hume
      AI, which supports a narrative of production use beyond toy examples.
    - >
      The npm package is the primary CLI distribution channel, while Homebrew gives
      macOS and Linux users a package-manager-native install path. That combination fits
      the modern API-tooling pattern where Node-based CLIs are also wrapped for Homebrew
      users who prefer OS-level package workflows.
  package-nerd-significance:
    - >
      For package maintainers, Fern is a fast-moving Node-distributed CLI whose Homebrew
      formula follows npm release cadence. That makes it part of the modern class of API
      development tools where the package is small from the user's perspective but
      fronts a larger cloud and generator platform.
    - >
      Fern is also notable because its CLI repository documents both generated artifact
      workflows and the project's own reproducible development setup through DevBox,
      reflecting the packaging concerns of a polyglot generator stack.
  project-history:
    - >
      The public Fern repository was created in April 2022, and the `fern-api` npm
      package was also created in April 2022. Early package history shows rapid 0.0.x
      CLI publication, while the repository later grew into a monorepo containing CLI
      code, generators, documentation assets, and platform tooling.
    - >
      By 2026 the package had moved into the 5.x release line, with Homebrew packaging
      `fern-api` and npm publishing frequent CLI releases. The README frames Fern as a
      docs-and-SDK workflow rather than only a code generator: users initialize a
      `fern/` directory, configure generators, and run the CLI to produce SDKs and docs.
  related-projects:
    - >
      Fern belongs to the API specification and SDK generation ecosystem alongside
      OpenAPI, AsyncAPI, Protobuf, OpenRPC, AWS Smithy, Palantir Conjure, and
      Stripe-style developer documentation workflows.
  sources:
    - https://github.com/fern-api/fern
    - https://github.com/fern-api/fern/blob/main/README.md
    - https://api.github.com/repos/fern-api/fern
    - https://registry.npmjs.org/fern-api
    - https://formulae.brew.sh/formula/fern-api
  summary:
    - >
      Fern is an API tooling platform and CLI that turns API definitions into SDKs and
      documentation. The repository README describes support for OpenAPI, AsyncAPI,
      Protobuf, and OpenRPC, with generated SDKs in languages such as TypeScript,
      Python, Java, Go, Ruby, PHP, C#, Swift, and Rust.
  timeline:
    - '2022: Public GitHub repository and npm package created.'
    - '2023: Repository README identifies Fern as a Y Combinator 2023 startup.'
    - '2026: npm and Homebrew package metadata show the CLI in the 5.x release line.'
  usage:
    - >
      Typical use starts with `fern init --openapi`, which creates a `fern/` directory
      containing `fern.config.json`, `generators.yml`, and API definition files. Users
      then run commands such as `fern check`, `fern add`, and `fern generate`; local
      generation can run through Docker with `fern generate --local`.
    - >
      Fern is used when an API team wants generated client SDKs, reference
      documentation, hosted docs, and related developer-experience features to track the
      API specification. Its package history matters because the CLI is the local entry
      point to a larger hosted and generator ecosystem.
related-packages:
  - id: brew:openapi-generator
    reason: >
      OpenAPI Generator is a community-governed, locally runnable alternative for
      generating clients, server stubs, and documentation from OpenAPI; Fern
      additionally offers hosted docs and supports several API-definition formats.
    rel: alternative
    sources:
      - https://github.com/fern-api/fern#readme
      - https://openapi-generator.tech/docs/
  - id: brew:swagger-codegen
    reason: >
      Swagger Codegen is an established OpenAPI-focused alternative for generating
      client libraries, server stubs, and documentation without adopting Fern's broader
      hosted platform workflow.
    rel: alternative
    sources:
      - https://github.com/fern-api/fern#readme
      - https://swagger.io/docs/open-source-tools/swagger-codegen/codegen-v3/about/
