history:
  adoption-history:
    - >
      Progressive Downloader targets macOS users needing more control than a browser's
      built-in downloader. It is distributed both directly by its developer and through
      the Mac App Store, with some capabilities differing between those editions.
  package-nerd-significance:
    - >
      The application is notable for combining a native download queue with
      multithreaded transfers, mirror selection, browser interception, authenticated
      remote-file browsing, scheduling, scripting, and a documented command-line
      interface.
    - >
      Its CLI can add a task or synchronously wait for a download, which makes an
      otherwise graphical Mac application usable from shell scripts and automation
      tools.
  project-history:
    - >
      The official site documents an established macOS download manager that has
      expanded into browser integration, FTP/SFTP/WebDAV browsing, AppleScript,
      Automator, Shortcuts, scheduled active hours, and command-line control.
    - >
      The project offers a direct-download edition and a sandboxed Mac App Store
      edition. The official FAQ documents differences in updating, Power Nap scheduling,
      and service integrations between them.
  related-projects:
    - The Interceptor provides browser integration and shared browser-cookie access.
    - PD Link connects mobile devices to Progressive Downloader on a selected computer.
    - >
      AppleScript, Automator, Shortcuts, and the command-line interface provide
      automation surfaces.
  sources:
    - https://www.macpsd.net/
    - https://www.macpsd.net/pages/browser/
    - https://www.macpsd.net/pages/cli/
    - https://www.macpsd.net/pages/faq/
    - https://www.macpsd.net/pages/integration/
  summary:
    - >
      Progressive Downloader is a macOS download manager with multithreaded transfers,
      mirror support, browser integration, remote-file browsing, scheduling, and
      automation interfaces.
  timeline:
    - 'By version 2.2: Browser integration could reuse cookies from the integrated browser.'
    - >
      By version 7.5.7: The application provided selective reset controls for windows,
      history, and tasks.
    - 'By version 9.3: The documented synchronous command-line download workflow was available.'
  usage:
    - >
      Users add download URLs to a managed queue, supply mirrors, choose destinations,
      schedule active periods, and integrate the application with a supported browser.
    - >
      The built-in file browser handles HTTP(S), FTP(S), SFTP, local files, and selected
      network protocols. The CLI accepts URLs, destinations, filenames, cookies,
      referrers, usernames, passwords, and SFTP private-key paths.
    - >
      For protected web downloads, official guidance recommends signing in through the
      integrated browser so Progressive Downloader can use that browser session rather
      than maintaining a separate site login.
