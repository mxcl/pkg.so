history:
  adoption-history:
    - >
      The project is distributed directly for Windows, macOS, Linux, and several named
      Linux distributions. Its long-running release announcements document translations,
      distribution packaging, encrypted DCP and KDM support, DCP playback, and workflows
      contributed or tested by a geographically broad cinema community.
  package-nerd-significance:
    - >
      DCP-o-matic packages a specialized professional-media toolchain into an
      approachable desktop application while remaining buildable from source. Package
      maintainers care about its cross-platform builds, multimedia dependencies,
      command-line tools, encode-server component, and unusually specific digital-cinema
      standards requirements.
  project-history:
    - >
      Carl Hetherington develops DCP-o-matic as an open-source tool for generating
      Digital Cinema Packages. The project evolved through a 1.x line into a broader 2.x
      suite that added DCP import, subtitle workflows, advanced audio processing, a
      player, KDM tools, distributed encoding, verification, and related utilities.
  related-projects:
    - >
      DCP-o-matic’s suite includes Player, KDM Creator, Encode Server, Batch Converter,
      Playlist Editor, Disk Writer, Combiner, Editor, and Verifier.
    - >
      DVD-o-matic appears in the project’s early official announcement archive as a
      predecessor-era name.
  sources:
    - >
      Official announcement archive:
      https://lists.dcpomatic.com/hyperkitty/list/announce@lists.dcpomatic.com/latest
    - 'Official development page: https://dcpomatic.com/development'
    - 'Official downloads page: https://dcpomatic.com/download'
    - 'Official manual: https://dcpomatic.com/manual/html/'
  summary:
    - >
      DCP-o-matic is an open-source application suite for converting video, audio,
      images, and subtitles into standards-oriented Digital Cinema Packages and for
      inspecting or manipulating existing DCP material.
  timeline:
    - >
      2014–2015: Official announcements document the 1.x series, encrypted DCP creation,
      KDM generation, translations, and Linux packaging.
    - >
      2016: The 2.x series broadened DCP import, subtitle, audio-processing, and
      content-reuse workflows.
    - >
      Later 2.x releases: The suite gained a dedicated DCP player and additional export,
      verification, authoring, and cinema-management tools.
  usage:
    - >
      Users create a film project, add source media, select cinema container,
      resolution, frame-rate, audio, subtitle, and metadata settings, then encode a DCP.
      Advanced deployments can distribute JPEG 2000 encoding to encode servers, create
      KDMs for encrypted packages, or configure transfer to a theatre-management system.
