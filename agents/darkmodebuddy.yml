history:
  adoption-history:
    - >
      DarkModeBuddy is distributed as a free, open-source macOS utility and through
      Homebrew Cask. It targets Macs with built-in ambient-light sensors and documents
      compatibility beginning with macOS Catalina.
  package-nerd-significance:
    - >
      DarkModeBuddy is a narrowly focused native utility that replaces macOS's
      time-based automatic appearance switching with a hardware-sensor-driven policy.
      Its small scope and open-source distribution make it representative of the
      specialized menu-bar and background utilities commonly packaged as Homebrew casks.
  project-history:
    - >
      DarkModeBuddy was created to address a limitation in macOS's built-in automatic
      appearance mode: the system switches by time of day rather than measured room
      lighting. The project implements an ambient-light threshold and a configurable
      delay to avoid rapid theme flicker.
  related-projects:
    - >
      It integrates with macOS Light and Dark Mode and depends on a Mac's built-in
      ambient-light sensor.
  sources:
    - https://github.com/insidegui/DarkModeBuddy
    - source_facts.package-manager.brew-cask
  summary:
    - >
      DarkModeBuddy is an open-source macOS background utility that switches between
      Light and Dark Mode according to ambient-light readings.
  timeline:
    - >
      The official sources document the utility's purpose and compatibility but do not
      provide a reliable dated release chronology.
  usage:
    - >
      The app runs in the background, observes the Mac's built-in ambient-light sensor,
      switches to Dark Mode below a configured threshold, and returns to Light Mode when
      illumination rises.
    - >
      Users can configure both the light threshold and the persistence interval used to
      prevent flickering. External-display ambient-light sensors are not supported.
