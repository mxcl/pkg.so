history:
  adoption-history:
    - >
      Supaterm targets developers who run coding agents inside terminal sessions. Its
      official integrations cover Claude, Codex, and Pi, presenting their lifecycle and
      attention state through a common sidebar and agent panel.
  package-nerd-significance:
    - >
      Supaterm represents the emerging agent-aware terminal category: it combines
      conventional tabs and panes with structured agent status, session operations, and
      a scriptable command-line interface. Its Homebrew cask makes a young,
      independently distributed macOS application straightforward to install and
      automate.
  project-history:
    - >
      Supaterm was developed as a native macOS terminal built with libghostty. The
      project is maintained in the public supabitapp/supaterm repository and combines
      spaces, tabs, split panes, coding-agent awareness, and the sp automation CLI.
  related-projects:
    - Ghostty supplies the terminal technology on which Supaterm is built.
    - Supaterm officially integrates with Claude, Codex, and Pi coding agents.
  sources:
    - https://docs.supaterm.com/
    - https://docs.supaterm.com/guides/coding-agents/setup/
    - https://github.com/supabitapp/supaterm
    - https://supaterm.com/changelog
  summary:
    - >
      Supaterm is an open-source, agent-aware native terminal emulator for macOS, with
      workspace organization and command-line automation.
  timeline:
    - >
      2026-04-12: Supaterm 1.0 was released with agent integrations, spaces, panes, a
      CLI, and agent skills.
    - >
      2026-07-15: The project launched its dedicated documentation and expanded its
      agent-workflow tooling.
  usage:
    - >
      Users organize projects into spaces containing tabs and split panes, run coding
      agents inside those panes, and monitor agent activity from the sidebar and agent
      panel.
    - >
      The sp CLI can create and target spaces, tabs, and panes, inspect the workspace as
      JSON, send text, capture output, and install supported agent hooks and skills.
