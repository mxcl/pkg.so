history:
  adoption-history:
    - >
      Paparazzi! has been distributed directly from the developer's site since the early
      Mac OS X era and is also available as the `paparazzi` Homebrew cask. Its releases
      expanded from single-page captures to PDF output, URL-scheme integration,
      AppleScript, batch capture, browser services, Retina handling, and automation
      hooks.
  package-nerd-significance:
    - >
      Paparazzi! is a long-lived example of a focused native Mac utility: it turns
      WebKit webpage rendering into repeatable full-page image or PDF capture without
      requiring a browser extension or a larger automation stack. Its URL scheme,
      services, AppleScript support, and bundled command-line tooling also make it
      useful in lightweight capture workflows.
  project-history:
    - >
      Nate Weaver, also identified on the official site as Wevah or Derailer, created
      Paparazzi! as a Cocoa and WebKit application. The developer notes that only the
      idea came from `webkit2png`; Paparazzi! itself did not contain that project's
      Python code.
    - >
      Early releases added PDF output, a `paparazzi:` URL scheme, configurable filenames
      and capture delay, and basic AppleScript. Later versions developed batch capture,
      browser integration, authentication support, Retina-aware output, Dark Mode, and
      post-capture scripts.
  related-projects:
    - Built around Apple's Cocoa and WebKit frameworks.
    - >
      The project was conceptually inspired by the `webkit2png` webpage-capture utility
      but is an independent implementation.
    - Later releases used Sparkle for update checking.
  sources:
    - https://derailer.org/paparazzi/
    - https://derailer.org/paparazzi/downloads
    - https://derailer.org/paparazzi/faq
    - https://derailer.org/paparazzi/releasenotes
  summary:
    - >
      Paparazzi! is a native macOS utility by Nate Weaver for capturing full webpages as
      images or PDFs, with batch and automation features added over its long release
      history.
  timeline:
    - '2005-08-11: Version 0.2 was published on the official download archive.'
    - '2005-10-20: Version 0.3 added PDF output and the `paparazzi:` URL scheme.'
    - '2012-09-07: Version 0.6.5 added Chrome scripting integration and Sparkle-based updating.'
    - >
      Later 1.0 betas: Added modern WebKit workflows, batch automation, Retina and Dark
      Mode support.
  usage:
    - >
      Enter or pass a webpage URL, choose viewport, crop, delay, output, and optional
      thumbnail settings, then capture the rendered page. Advanced workflows can use
      batch capture, macOS services, AppleScript, the custom URL scheme, or a post-save
      shell script.
