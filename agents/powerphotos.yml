history:
  adoption-history:
    - >
      PowerPhotos was offered free to existing iPhoto Library Manager customers,
      providing a migration path as Apple replaced iPhoto with Photos. Its first release
      retained library creation, browsing, search, duplicate detection, and migration
      features while later releases restored copying and merging capabilities.
    - >
      PowerPhotos 3.0 arrived in 2025 with a substantially upgraded photo browser, batch
      metadata editing, multi-library search, and other features that brought more
      direct photo-management operations into the application.
  package-nerd-significance:
    - >
      PowerPhotos illustrates how specialist Mac utilities track Apple's application and
      library-format transitions. It succeeded iPhoto Library Manager without attempting
      to combine two incompatible generations of Apple's photo ecosystem in one
      interface.
    - >
      For package-manager users, the Homebrew cask supplies a repeatable installation
      method for a proprietary utility that otherwise updates through Fat Cat Software's
      direct distribution channel.
  project-history:
    - >
      Fat Cat Software announced PowerPhotos on April 8, 2015, the day Apple released
      Photos as iPhoto's replacement. Developer Brian Webster chose a separate
      application rather than adding Photos support to iPhoto Library Manager because
      the applications and their library capabilities differed substantially.
    - >
      PowerPhotos 1.0 was released in April 2015 for OS X Yosemite. Version 1.1 added
      photo copying and library merging in November 2015. The product continued evolving
      around multiple-library management, duplicate detection, metadata preservation,
      iCloud-aware workflows, search, and export.
  related-projects:
    - >
      PowerPhotos is the successor to Fat Cat Software's discontinued iPhoto Library
      Manager. It operates alongside Apple's Photos application rather than replacing
      the system photo library engine.
  sources:
    - >
      https://www.fatcatsoftware.com/comments/announcing_powerphotos/ — official
      announcement and design rationale dated 2015-04-08
    - >
      https://www.fatcatsoftware.com/comments/powerphotos_1.0_is_now_available/ —
      official 1.0 release announcement
    - https://www.fatcatsoftware.com/iplm/ — official predecessor-product page
    - https://www.fatcatsoftware.com/powerphotos/ — official current features
    - https://www.fatcatsoftware.com/powerphotos/VersionedDocs/v9/index.html — official manual
  summary:
    - >
      PowerPhotos is a commercial macOS companion to Apple Photos for managing multiple
      libraries, finding duplicates, merging and copying libraries, preserving metadata,
      searching across libraries, editing metadata, and exporting collections.
  timeline:
    - "2015-04-08: PowerPhotos announced alongside Apple's release of Photos"
    - '2015-04: PowerPhotos 1.0 released'
    - '2015-11-03: PowerPhotos 1.1 added photo copying and library merging'
    - >
      2025: PowerPhotos 3.0 released with an upgraded browser and expanded metadata and
      search tools
  usage:
    - >
      Users employ PowerPhotos to create and organize multiple Photos libraries,
      identify duplicate images, merge or split collections, copy albums while retaining
      edits and metadata, search across libraries, batch-edit metadata, and export
      albums into Finder folder hierarchies.
    - >
      It is especially useful during migrations from iPhoto or Aperture libraries and
      when a collection is too large or complex for a single Photos library. Operations
      generate persistent reports and diagnostic logs that can be reviewed within the
      application.
