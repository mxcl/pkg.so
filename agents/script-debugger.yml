history:
  adoption-history:
    - >
      Late Night Software describes Script Debugger as a long-standing standard for
      AppleScript automation development. Version 2 received a Macworld Editors' Choice
      award for development software in 2000, and version 3 was nominated in the utility
      and enabling category of the 2002 MacUser Awards.
    - >
      After ending commercial development in 2025, Late Night Software made historical
      versions available as unsupported free downloads and retained its community forum
      as a user resource.
  package-nerd-significance:
    - >
      Script Debugger occupied a distinctive niche in the classic Mac and macOS software
      ecosystem: a full debugger and application-dictionary explorer for a platform
      automation language that Apple's bundled Script Editor served more minimally. Its
      30-year run spans classic Mac OS, the transition to Mac OS X, and four processor
      architectures.
    - >
      For automation specialists it combined breakpoints, step-wise execution, live
      variable inspection, code completion, AppleScriptObjC support, and deployable
      applet creation in a single native environment.
  project-history:
    - >
      Late Night Software was established in 1995 by Mark Alldritt and Gerry Tubin to
      develop Script Debugger. The first release supported AppleScript 1.0 on classic
      Mac OS, and successive versions followed the Macintosh platform through Mac OS X
      and multiple CPU transitions.
    - >
      Script Debugger 8 added native Apple Silicon support, universal applet generation,
      Dark Mode, themes, revised code-signing and notarization workflows, and direct
      export. Late Night Software declared the product end-of-development in January
      2025 and withdrew it from sale and official support in June 2025.
  related-projects:
    - >
      AppleScript is the macOS automation language for which Script Debugger provides
      its integrated development environment.
    - Apple Script Editor is the operating system's bundled, more limited AppleScript editor.
    - >
      SD Notary is Late Night Software's companion tool for signing and notarizing
      script applications.
    - FaceSpan and Affrus were other development tools produced by Late Night Software.
  sources:
    - https://latenightsw.com/
    - https://latenightsw.com/company/
    - https://latenightsw.com/retiring-script-debugger/
    - https://latenightsw.com/sd8/feature-comparison/
    - https://latenightsw.com/sd8/support/
  summary:
    - >
      Script Debugger is Late Night Software's integrated development environment for
      writing, exploring, debugging, and packaging AppleScript automation on the
      Macintosh.
  timeline:
    - >
      1995: Late Night Software was established and Script Debugger began its classic
      Mac OS era.
    - >
      2000: Script Debugger 2 received a Macworld Editors' Choice award for development
      software.
    - >
      2021: Script Debugger 8 brought native Apple Silicon support and modernized applet
      deployment.
    - >
      January 2025: Script Debugger reached its 30th anniversary and was declared
      end-of-development.
    - >
      June 2025: Commercial sales and official support ended, and the product became a
      free unsupported download.
  usage:
    - >
      Developers use Script Debugger to inspect a scriptable application's live object
      model and dictionary, write AppleScript with language-aware completion, execute it
      statement by statement, set breakpoints, and inspect variables.
    - >
      Completed automations can be saved as standard scripts or exported as standalone
      applets, with tooling for dependency checks, code signing, notarization, and
      run-only distribution.
