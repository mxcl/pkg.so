history:
  adoption-history:
    - >
      CERN's CLHEP page explicitly ties a large fraction of contributions to use in
      BaBar, the Geant4 Collaboration, and Fermilab's ZOOM project, especially in the
      Random, Vector, Geometry, and Matrix packages.
    - >
      The same page notes that CERN LCG formally maintains CLHEP and that HepMC, HepPDT,
      and StdHep migrated out as standalone external LCG packages, placing CLHEP in the
      long-running HEP software stack rather than as a one-off library.
  package-nerd-significance:
    - >
      CLHEP matters to package maintainers because it is old scientific infrastructure
      with ABI, compiler, CMake, pkg-config, and downstream experiment compatibility
      concerns. It is less a flashy CLI than a dependency that makes physics software
      stacks build reproducibly on Unix-like systems.
    - >
      Its formula also illustrates a common scientific-packaging pattern: a library
      package ships many small `*-config` helper commands that bridge older build
      expectations and newer CMake/pkg-config workflows.
  project-history:
    - >
      The CLHEP project was proposed by Leif Lonnblad at CHEP 92. CERN's project page
      presents it as a set of independent HEP-specific foundation and utility packages,
      with inter-package dependencies allowed only under defined conditions.
    - >
      The project later moved to CERN GitLab and is maintained as a source-buildable
      CMake project. The official README documents a modern C++ build, package-config
      scripts, CMake imported targets, and pkg-config files for both the full library
      and component libraries.
  related-projects:
    - >
      Geant4, BaBar, and Fermilab ZOOM are named by the CLHEP project page as major
      sources of CLHEP contributions.
    - >
      HepMC, HepPDT, and StdHep are related HEP packages that the CLHEP project page
      says migrated to standalone external LCG packages.
  sources:
    - https://proj-clhep.web.cern.ch/proj-clhep/
    - https://gitlab.cern.ch/CLHEP/CLHEP/-/raw/master/README.md
  summary:
    - >
      CLHEP is CERN's Class Library for High Energy Physics, a C++ collection of
      foundation and utility classes for high-energy-physics software. Its official
      project page describes packages for random generators, physics vectors, geometry,
      linear algebra, units, and related HEP building blocks.
  timeline:
    - '1992: CLHEP is proposed by Leif Lonnblad at CHEP 92.'
    - '1996: CLHEP workshops are held at CERN.'
    - '2000: A CLHEP workshop is held at Fermilab.'
    - '2010: CLHEP 1.9.4.7 and 2.0.4.7 are released.'
    - '2014: CLHEP 2.1.4.2 is released.'
    - '2015: CLHEP 2.2.0.8 is released.'
    - '2018: CLHEP 2.3.4.6 is released.'
    - '2025: CLHEP 2.4.7.2 is released.'
  usage:
    - >
      Users typically consume CLHEP as a compiled C++ dependency, either linking the
      whole CLHEP library or individual packages such as Vector and Random. The README
      documents `clhep-config`, package-specific `*-config` scripts, CMake
      `find_package(CLHEP REQUIRED)`, imported targets, and pkg-config integration.
    - >
      The Homebrew package exposes the library's config helper executables, which is
      exactly the sort of package-manager surface used by downstream build systems to
      discover compiler and linker flags.
