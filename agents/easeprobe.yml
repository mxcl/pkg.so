id: brew:easeprobe
display-name: EaseProbe
repo: null
docs:
  - https://github.com/megaease/easeprobe/tree/main/docs
  - https://github.com/megaease/easeprobe#readme
config-file-location:
  unix:
    - $CWD/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through GitHub releases, Docker images, source builds,
      and Homebrew. Its adoption signal is strongest inside the MegaEase/open-source
      operations niche rather than as a universal monitoring standard.
    - >
      Homebrew packages release tarballs from the official GitHub repository, making
      EaseProbe a normal `brew install easeprobe` tool for users who want a small status
      checker without deploying a larger monitoring stack first.
  package-nerd-significance:
    - >
      EaseProbe is package-nerd-interesting because it sits between a shell script
      health check and a full monitoring platform. The appeal is one statically built Go
      CLI plus a YAML file, with enough output and notification integrations to be
      useful in small deployments.
    - >
      Its broad probe matrix also makes it a handy example of the modern Go ops binary:
      single executable, Docker image, Helm/Kubernetes path, Homebrew formula, and
      documentation colocated in the GitHub repo.
  project-history:
    - >
      The official repository was created in February 2022. Its README defines the
      project around three jobs: probing services, sending notifications, and reporting
      status or metrics.
    - >
      EaseProbe's scope expanded from simple HTTP/TCP checks into a broad probe catalog
      covering HTTP, TCP, ping, shell, SSH, TLS, host checks, and native clients for
      systems such as MySQL, Redis, Memcache, MongoDB, Kafka, PostgreSQL, and ZooKeeper.
      The release history shows a 2.0 line by late 2022 and a 2.3 line by 2025.
  related-projects:
    - MegaEase is the project organization behind EaseProbe.
    - Prometheus is a related metrics consumer supported by EaseProbe's exporter endpoint.
    - Kubernetes and Helm are related deployment surfaces documented by the project.
    - >
      Classic monitoring systems such as Nagios-style checks are conceptually adjacent,
      although the official sources frame EaseProbe as a simple standalone checker.
  sources:
    - https://github.com/megaease/easeprobe
    - https://github.com/megaease/easeprobe/tree/main/docs
    - https://formulae.brew.sh/api/formula/easeprobe.json
  summary:
    - >
      EaseProbe is MegaEase's Go-based standalone health/status checking tool. It
      packages probes, notifications, SLA reporting, Prometheus metrics, and deployment
      examples into a single `easeprobe` binary configured by YAML.
  timeline:
    - '2022-02: The official GitHub repository was created.'
    - '2022-12: GitHub releases show EaseProbe 2.0.0.'
    - '2023-03: GitHub releases include EaseProbe Helm chart artifacts.'
    - >
      2025-05: GitHub releases show EaseProbe 2.3.0, the version packaged by Homebrew at
      review time.
  usage:
    - >
      A typical setup creates a YAML config, then runs `easeprobe -f config.yaml` or
      points the `PROBE_CONFIG` environment variable at one or more config files. The
      README's sample config checks an HTTP URL, writes notifications to a log file, and
      sets global timeout and probe interval settings.
    - >
      EaseProbe can be run as a local binary, Docker container, systemd service, Docker
      Compose deployment, or Kubernetes deployment. It also exposes live SLA output and
      Prometheus metrics on its built-in report server.
related-packages:
  - id: brew:prometheus
    reason: >
      EaseProbe exposes probe and SLA measurements at a Prometheus-compatible metrics
      endpoint, allowing Prometheus to scrape, retain, query, and alert on those
      results.
    rel: adjacent_workflow
    sources:
      - https://github.com/megaease/easeprobe/blob/main/docs/Manual.md
      - https://prometheus.io/docs/introduction/first_steps/
