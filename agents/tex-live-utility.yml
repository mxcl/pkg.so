id: cask:tex-live-utility
display-name: TeX Live Utility
repo: null
docs:
  - https://amaxwell.github.io/tlutility
  - https://github.com/amaxwell/tlutility#readme
config-file-location:
  macos:
    - ~/Library/Preferences/com.googlecode.mactlmgr.tlu.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      TeX Live Utility provides MacTeX and other macOS TeX Live users with a native
      alternative to invoking tlmgr directly or using its cross-platform Perl/Tk
      interface.
  package-nerd-significance:
    - >
      The application is a graphical front end to a package manager rather than an
      independent TeX distribution. It exposes TeX Live repository selection, package
      installation and removal, updates, backups, and package documentation while
      leaving tlmgr and the TeX Live package database authoritative.
  project-history:
    - >
      Adam Maxwell began TeX Live Utility in 2008 as a native macOS graphical interface
      for TeX Live Manager. It was designed around the package-management facilities
      introduced with TeX Live 2008 and has continued to track later TeX Live and macOS
      releases.
  related-projects:
    - >
      TeX Live supplies the underlying distribution and tlmgr package manager. MacTeX is
      the principal TeX Live distribution for macOS and is a common environment for TeX
      Live Utility.
  sources:
    - https://amaxwell.github.io/tlutility/
    - https://github.com/amaxwell/tlutility
    - https://github.com/amaxwell/tlutility/blob/master/Info.plist
  summary:
    - >
      TeX Live Utility is a native macOS graphical interface for installing, removing,
      and updating packages in a TeX Live installation.
  timeline:
    - '2008: Development began alongside the TeX Live 2008 package-management infrastructure.'
    - '2010s: The utility continued as an open-source macOS front end to tlmgr.'
    - >
      Later releases: Maintenance continued to accommodate newer TeX Live and macOS
      environments.
  usage:
    - >
      Users select a TeX Live installation and repository, inspect available or
      installed packages, apply updates, install or remove packages, restore backups,
      and open package documentation through a native macOS interface.
