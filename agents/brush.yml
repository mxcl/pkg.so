credentials-file-location: null
history:
  adoption-history:
    - >
      The official installation section lists Homebrew, Arch Linux, MSYS2,
      cargo-binstall, GitHub release binaries, and Nix, while the provided package facts
      also list Homebrew, MacPorts, Nix, and pacman. That puts brush in the normal
      multi-distribution pipeline for shell tools despite being a young implementation.
    - >
      Adoption is still early compared with Bash, zsh, fish, or Oil/YSH, but the
      presence of distribution packages and a crates.io-oriented install path gives it
      several routes into developer workstations.
  package-nerd-significance:
    - >
      Shells are unusually package-sensitive because installing them is not enough:
      users may add them to login-shell databases, invoke them from scripts, and expect
      startup files and completions to work. brush is interesting because it tries to
      enter that old Unix contract while being implemented in Rust.
    - >
      For maintainers, brush is a compact example of the modern Rust reimplementation
      wave applied to one of the hardest compatibility targets: Bash.
  project-history:
    - >
      The project presents itself as a modern Bash- and POSIX-compatible shell written
      in Rust. Its README emphasizes compatibility with existing `.bashrc` files,
      aliases, functions, and completions, while the compatibility reference documents a
      test suite that compares behavior against Bash.
    - >
      Unlike experimental shells that define a new language first, brush starts from the
      existing shell ecosystem. Its published identity is conservative: preserve Bash
      behavior, add Rust implementation benefits and interactive features, and expose an
      embeddable `brush_core::Shell` for Rust programs.
  related-projects:
    - GNU Bash is the primary compatibility target and behavioral oracle.
    - POSIX shell is the standards baseline named by the project.
    - >
      reedline provides the line-editing experience cited by brush for highlighting and
      suggestions.
    - >
      Nushell, fish, zsh, and Oil/YSH are adjacent shells, though brush is more
      explicitly Bash-compatible than most of them.
  sources:
    - https://github.com/reubeno/brush
    - https://raw.githubusercontent.com/reubeno/brush/main/README.md
    - https://raw.githubusercontent.com/reubeno/brush/main/docs/reference/compatibility.md
    - source_facts.package-manager
  summary:
    - >
      brush, the Bourne RUsty SHell, is a Rust shell that aims to run existing Bash and
      POSIX shell scripts while adding modern interactive behavior such as syntax
      highlighting and autosuggestions. Its packaging story is notable because it is a
      new shell trying to be installable as a boring system command rather than only as
      a Rust crate.
  timeline:
    - >
      2025: brush documentation describes itself as Bash- and POSIX-compatible and ready
      for many daily-driver use cases.
    - >
      2025: Official README documents Homebrew, Arch Linux, MSYS2, cargo-binstall,
      GitHub release, and Nix installation routes.
    - >
      2026: Provided package facts show brush packaged in Homebrew, MacPorts, Nix, and
      pacman ecosystems.
  usage:
    - >
      brush can be launched as an interactive shell and is designed to read existing
      Bash startup files. The README says `.bashrc` should work unchanged, with optional
      `~/.brushrc` and TOML configuration for brush-specific behavior.
    - >
      Its current use case is compatibility testing, interactive daily-driver
      experimentation, and embedding shell behavior inside Rust programs. The
      compatibility reference marks many Bash features as supported while still
      documenting gaps such as `select`, `wait -n`, and some background-job details.
related-packages:
  - id: brew:bash
    reason: >
      Choose GNU Bash when complete compatibility and the mature reference
      implementation matter more than brush's Rust implementation and newer interactive
      interface.
    rel: alternative
    sources:
      - https://github.com/reubeno/brush
      - https://www.gnu.org/software/bash/manual/bash.html
  - id: brew:fish
    reason: >
      Choose fish for an intentionally user-friendly interactive shell when preserving
      Bash language and startup-file compatibility is not required.
    rel: alternative
    sources:
      - https://github.com/reubeno/brush
      - https://fishshell.com/docs/current/
  - id: brew:nushell
    reason: >
      Choose Nushell when structured-data pipelines are more important than brush's goal
      of running existing Bash scripts unchanged.
    rel: alternative
    sources:
      - https://github.com/reubeno/brush
      - https://www.nushell.sh/book/
