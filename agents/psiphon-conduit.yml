history:
  adoption-history:
    - >
      Conduit is distributed as a macOS application and also targets Android and a
      cross-platform command-line environment. Homebrew users can install the macOS
      release through the psiphon-conduit cask.
  package-nerd-significance:
    - >
      Conduit turns spare bandwidth and compute capacity into censorship-circumvention
      infrastructure. Its combination of a desktop application, CLI, container image,
      and Psiphon tunnel core makes it notable to self-hosters and networking
      enthusiasts.
  project-history:
    - >
      Psiphon developed Conduit as a client for running an inproxy node backed by
      psiphon-tunnel-core. The official repository covers a React Native application for
      Android, iOS, and macOS, plus a cross-platform CLI.
    - >
      The CLI release line made unattended and server-oriented operation practical,
      including configurable client and bandwidth limits, persistent state, and later
      operational metrics.
  related-projects:
    - Psiphon
    - psiphon-tunnel-core
  sources:
    - 'Official project repository and README: https://github.com/Psiphon-Inc/conduit'
    - 'Official releases: https://github.com/Psiphon-Inc/conduit/releases'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Psiphon Conduit is a volunteer-operated proxy-node application that relays traffic
      for Psiphon users. It exposes Psiphon's inproxy technology through desktop,
      mobile, command-line, and container-oriented forms.
  timeline:
    - '2025: The macOS release line was published through the official repository.'
    - '2026: The official repository introduced a dedicated Conduit CLI release line.'
  usage:
    - >
      A typical user runs Conduit to contribute bandwidth to the Psiphon network,
      choosing suitable capacity limits for the host and connection. Desktop users can
      use the graphical application, while operators can run the CLI or official
      container image for longer-lived nodes.
