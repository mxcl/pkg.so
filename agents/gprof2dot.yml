id: brew:gprof2dot
display-name: gprof2dot
repo: https://github.com/jrfonseca/gprof2dot
docs:
  - https://github.com/jrfonseca/gprof2dot#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      PyPI lists gprof2dot as a mature console package for developers, with Jose Fonseca
      and toutpt as maintainers and Python 3.8 or newer as the package requirement.
      Homebrew packages it with Graphviz and Python dependencies, and the input
      package-manager facts also list Fedora and Nix.
    - >
      The package is adopted where profiling workflows need portable artifacts: CI
      reports, command-line investigations, or sharing a rendered call graph with
      teammates who do not have the original profiler UI installed.
  package-nerd-significance:
    - >
      gprof2dot is a durable glue package: it connects many profilers to Graphviz
      through a small CLI and avoids being tied to a single language runtime or profiler
      UI.
    - >
      Package maintainers care about it because it is pure-Python-ish operationally but
      depends on Graphviz for the visible payoff; the package is most valuable when the
      executable and dot renderer are both easy to install from the same ecosystem.
  project-history:
    - >
      The project began as a single Python script oriented around gprof-style output and
      grew into a multi-format profiler converter. The GitHub repository contains the
      main gprof2dot.py script, examples, schema data, tests, packaging metadata, and
      sample images.
    - >
      The README records that the maintainer considers the tool to fulfill his needs and
      has limited maintenance time, which helps explain its conservative evolution: new
      profiler formats and compatibility work are added around a stable core rather than
      through a large application framework.
  related-projects:
    - Graphviz is the rendering backend for dot output.
    - xdot.py is recommended by the README as an interactive viewer for generated graphs.
    - >
      FlameGraph stackcollapse data is a related input format, bridging gprof2dot with
      flame-graph tooling.
    - >
      Linux perf, Valgrind callgrind, gprof, DTrace, VTune, Xperf, Sysprof, Python
      profilers, and Java HPROF are related profiler sources.
  sources:
    - https://formulae.brew.sh/formula/gprof2dot
    - https://github.com/jrfonseca/gprof2dot
    - https://pypi.org/project/gprof2dot/
    - https://raw.githubusercontent.com/jrfonseca/gprof2dot/main/README.md
  summary:
    - >
      gprof2dot is a Python command-line tool by Jose Fonseca that converts profiler
      output into Graphviz dot call graphs. The project README and PyPI page describe
      support for Linux perf, Valgrind callgrind, Sysprof, Xperf, VTune, Very Sleepy,
      Python profilers, Java HPROF, prof/gprof, DTrace, and stackcollapse data from
      FlameGraph.
    - >
      Its niche is performance visualization without a heavy IDE: collect profile data
      with an existing profiler, run gprof2dot to produce a dot graph, and render it
      with Graphviz.
  timeline:
    - '2025: PyPI records release 2025.4.14 and Python >=3.8 metadata.'
    - '2026: Homebrew metadata packages gprof2dot with Graphviz and Python dependencies.'
  usage:
    - >
      The canonical workflow pipes profiler data through gprof2dot and then through
      Graphviz, for example perf script output into gprof2dot -f perf and dot -Tpng. The
      README also documents workflows for Xperf, VTune, gprof, Python profile/cProfile,
      Java HPROF, DTrace, stackcollapse, and graph comparison.
    - >
      Options prune small nodes and edges, choose input format, pick color maps, strip
      C++ qualifiers, focus on roots or leaves, limit graph depth, and compare two
      similarly structured profiles.
related-packages:
  - id: brew:graphviz
    reason: >
      Graphviz is the required renderer used to turn gprof2dot's DOT stream into SVG,
      PNG, PDF, or other graph output.
    rel: adjacent_workflow
    sources:
      - https://github.com/jrfonseca/gprof2dot#requirements
      - https://graphviz.org/documentation/
  - id: brew:xdot
    reason: >
      Use xdot.py when gprof2dot's generated call graph needs interactive zooming and
      navigation instead of a static rendered image.
    rel: adjacent_workflow
    sources:
      - https://github.com/jrfonseca/gprof2dot#readme
      - https://github.com/jrfonseca/xdot.py
  - id: brew:flamegraph
    reason: >
      FlameGraph's stack-collapse tools can prepare folded stack data that gprof2dot
      accepts through its `collapse` input format.
    rel: adjacent_workflow
    sources:
      - https://github.com/jrfonseca/gprof2dot#readme
      - https://github.com/brendangregg/FlameGraph
