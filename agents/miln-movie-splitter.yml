history:
  adoption-history:
    - >
      Movie Splitter is distributed as a macOS application and is included in the Miln
      App Licence. The supplied package-manager facts also identify a Homebrew cask,
      providing a command-line installation route for Mac users.
  package-nerd-significance:
    - >
      Its distinguishing technical choice is lossless-style stream handling: exported
      sections are passed through without re-encoding, preserving source quality while
      avoiding a lengthy transcode.
    - >
      The application occupies a focused niche among media utilities by using embedded
      3GPP or QuickTime chapter tracks as split points.
  project-history:
    - >
      Miln developed Movie Splitter as a specialized macOS utility for dividing movies
      into smaller files. The official change log records continued refinement through
      the 1.7 series, including custom-section interchange and JPEG thumbnail export.
  related-projects:
    - Canon Hybrid Auto cameras produce the movie-digest files highlighted by the application.
    - QuickTime and 3GPP chapter tracks provide supported embedded chapter metadata.
  sources:
    - https://miln.eu/moviesplitter/
    - source_facts.package-manager
  summary:
    - >
      Movie Splitter is a Miln macOS utility that divides movies at chapter markers,
      selected boundaries, equal fractions, or regular time intervals.
  timeline:
    - >
      1.7.0: Added section import and export, JPEG thumbnail export, and additional
      custom-section controls.
    - '1.7.1–1.7.2: Follow-up releases corrected updating and time-entry behavior.'
  usage:
    - >
      Users open a movie, choose automatic chapters or manual time divisions, and export
      the resulting sections to a folder.
    - >
      It is particularly tailored to Canon Hybrid Auto movie digests, which can be
      separated into their component clips. Export work runs in the background and
      supports queues.
