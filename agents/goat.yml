id: brew:goat
display-name: goat
repo: null
docs:
  - https://github.com/bluesky-social/goat#readme
config-file-location: null
credentials-file-location:
  unix:
    - $XDG_STATE_HOME/goat/auth-session.json
    - ~/.local/state/goat/auth-session.json
history:
  adoption-history:
    - >
      goat serves the AT Protocol developer and operations community rather than end
      users of the Bluesky app. The surrounding ecosystem had already encouraged
      third-party work: by October 2023, Bluesky documentation described developers
      building bots, clients, feed generators, and future applications on atproto.
    - >
      The Homebrew formula packages goat as a direct CLI install path for users who want
      an atproto toolbox without building from source. Its README also documents
      prebuilt binaries, Debian/Ubuntu packages, and go install.
  package-nerd-significance:
    - >
      goat is interesting to package maintainers because it turns a fast-moving protocol
      stack into a reproducible local executable. For developers exploring atproto, it
      is the low-friction bridge between shell workflows, jq pipelines, Go-based SDK
      code, and network services such as PDSes, relays, PLC, Lexicon, and XRPC.
    - >
      Its presence in package managers is also a sign of the AT Protocol ecosystem
      maturing beyond one hosted application: protocol developers need inspection,
      migration, and admin tools just as much as client libraries.
  project-history:
    - >
      The AT Protocol project emerged from Bluesky's protocol work: Bluesky described
      its spring 2022 ADX work as the first iteration, then announced the Authenticated
      Transfer Protocol on October 18, 2022. The protocol centers on portable
      identities, signed repositories, federation, Lexicon schemas, and HTTP/WebSocket
      synchronization.
    - >
      goat was forked from the Bluesky indigo codebase in August 2025 and had its first
      tagged release, v0.1.0, on August 12, 2025. Subsequent releases added and
      reorganized account, PDS admin, lexicon, dependency, and XRPC capabilities while
      tracking the evolving indigo SDK.
  related-projects:
    - >
      goat is closely related to the AT Protocol, Bluesky, indigo, Personal Data
      Servers, relays, PLC identity infrastructure, Lexicon schemas, and the XRPC HTTP
      API model.
  sources:
    - https://atproto.com/guides/overview
    - https://bsky.social/about/blog/10-18-2022-the-at-protocol
    - https://docs.bsky.app/blog/building-on-atproto
    - https://docs.bsky.app/docs/advanced-guides/atproto
    - https://github.com/bluesky-social/goat
    - https://raw.githubusercontent.com/bluesky-social/goat/main/CHANGELOG.md
    - https://raw.githubusercontent.com/bluesky-social/goat/main/README.md
  summary:
    - >
      goat is the Bluesky Social Go command-line tool for the AT Protocol, described by
      its README as a general-purpose atproto CLI similar in spirit to curl. It gives
      developers and operators a shell-native way to inspect records, stream the
      firehose, work with PLC identity data, migrate accounts, administer PDS instances,
      and call XRPC endpoints.
  timeline:
    - '2022: Bluesky announced ADX had become the Authenticated Transfer Protocol.'
    - >
      2023: Bluesky documentation invited developers to build bots, clients, feeds, and
      other projects on atproto.
    - '2025: goat was forked from indigo and tagged v0.1.0.'
    - '2025: goat v0.2.0 added more lexicon management commands and required Go 1.25.'
    - '2026: goat v0.2.3 added the first version of the xrpc subcommand.'
  usage:
    - >
      goat is used to resolve identities, list and fetch at:// records, export
      repositories and blobs, inspect PLC history, tail PLC operations, subscribe to
      relay firehose events, post through Bluesky APIs, manage lexicons, and make XRPC
      query or procedure calls. Some commands are public; account-modifying commands
      require login with an app password.
related-packages:
  - id: brew:jq
    reason: >
      goat's official examples pipe JSON firehose events into jq to select handles, post
      text, languages, and other record fields.
    rel: adjacent_workflow
    sources:
      - https://github.com/bluesky-social/goat#readme
      - https://jqlang.org/manual/
