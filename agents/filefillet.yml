history:
  adoption-history:
    - >
      The official site highlights availability through both direct downloads and
      Homebrew Cask, positioning FileFillet for macOS power users who favor reproducible
      package-manager installation. It also reports that the product reached number five
      in Product Hunt's Product of the Day ranking.
  package-nerd-significance:
    - >
      FileFillet is representative of narrowly focused commercial macOS utilities that
      become easier to discover, install, and update through Homebrew Cask even though
      they are not traditional open-source command-line packages.
  project-history:
    - >
      FileFillet is a Swift-based macOS utility from LeanBytes in Stuttgart. Version 2
      developed into a configurable file-transfer panel supporting favorite folders,
      nested destinations, drag activation, and screen-edge activation.
  related-projects:
    - 'Finder: FileFillet supplements rather than replaces the macOS file manager.'
    - 'Homebrew Cask: Officially documented installation channel for FileFillet.'
  sources:
    - 'Official product page, FAQ, and changelog: https://www.filefillet.com/'
  summary:
    - >
      FileFillet is a commercial macOS file-organizing utility designed to reduce Finder
      window navigation when copying or moving files. Its package-manager relevance
      comes from the developer's explicit support for Homebrew Cask installation.
  timeline:
    - '2026-04-20: Version 2.10.0 added an option to hide the menu-bar icon.'
    - >
      2026-06-24: Version 2.11.0 shipped transfer, NAS, concurrency, and interface
      improvements.
    - '2026-06-26: Version 2.11.1 corrected license and trial state refresh behavior.'
  usage:
    - >
      Users keep frequently used folders in a configurable panel, then copy or move
      dragged files into those folders or their subdirectories. The panel can appear
      while holding Control during a drag or when hovering at a configured screen edge.
    - >
      The official site supports installation from a disk image, ZIP archive, or with
      `brew install --cask filefillet`.
