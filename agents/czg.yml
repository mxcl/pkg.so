id: brew:czg
display-name: czg
repo: https://github.com/Zhengqbbb/cz-git
docs:
  - https://cz-git.qbb.sh/cli
  - https://cz-git.qbb.sh/guide
config-file-location:
  unix:
    - ./package.json
    - ./.czrc
    - ./.cz.json
    - ./.cz.yaml
    - ./.cz.toml
    - ./cz.config.js
    - ./cz.config.cjs
    - ~/.config/.czrc
credentials-file-location:
  unix:
    - ~/.config/.czrc
history:
  adoption-history:
    - >
      The project sits in the Node.js Git tooling ecosystem: the README links the czg
      npm package and the Homebrew formula, while the docs show czg as a standalone
      command that extends normal git commit options.
  package-nerd-significance:
    - >
      For package-manager users, czg is interesting because it packages a JavaScript
      commit workflow as a small executable command, making Conventional Commits prompts
      available through npm and Homebrew rather than only through project-local dev
      dependencies.
  project-history:
    - >
      The cz-git repository was created in 2022 and describes itself as both a
      Commitizen adapter and a Git commit CLI. Its documentation presents czg as the
      direct CLI path for users who want the prompt without wiring the adapter through
      Commitizen first.
  related-projects:
    - cz-git is related to Commitizen, commitlint, Conventional Commits, and Git itself.
  sources:
    - https://github.com/Zhengqbbb/cz-git
    - https://api.github.com/repos/Zhengqbbb/cz-git
    - https://github.com/Zhengqbbb/cz-git/releases/tag/v1.13.1
    - https://cz-git.qbb.sh/cli/
    - https://cz-git.qbb.sh/config/
  summary:
    - >
      czg is the command-line front end in the cz-git project, aimed at developers who
      want an interactive Commitizen-style prompt that emits Conventional
      Commits-compatible Git messages.
  timeline:
    - '2022: cz-git repository created.'
    - '2026: v1.13.1 release published.'
  usage:
    - >
      Typical use is to run czg in a Git worktree, answer prompts for type, scope,
      subject, and related metadata, and let the tool call through to git commit. The
      CLI also documents subcommands and OpenAI-assisted commit-message options, with
      local API settings stored in the czg config file.
related-packages:
  - id: brew:commitizen
    reason: >
      Choose Commitizen for its broader guided-commit, version-bump, and changelog
      workflow; choose czg for the direct cz-git prompt client and its configuration
      model.
    rel: alternative
    sources:
      - https://commitizen-tools.github.io/commitizen/
      - https://commitizen-tools.github.io/commitizen/commands/bump/
      - https://cz-git.qbb.sh/cli/
  - id: brew:commitlint
    reason: >
      commitlint can validate the Conventional Commit messages that czg interactively
      creates, pairing guided authoring with hook or CI enforcement.
    rel: adjacent_workflow
    sources:
      - https://commitlint.js.org/guides/getting-started.html
      - https://cz-git.qbb.sh/config/
tags:
  - cli
  - commit-message
  - commitizen
  - conventional-commits
  - git
  - nodejs
