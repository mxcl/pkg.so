history:
  adoption-history:
    - >
      MenuBar Stats has remained a commercially distributed macOS utility through
      multiple operating-system and processor transitions. Its official notes document
      compatibility work for Big Sur, Apple Silicon, Monterey, Ventura, and later macOS
      releases.
    - The official site does not publish download totals or other durable adoption metrics.
  package-nerd-significance:
    - >
      MenuBar Stats belongs to the long-running macOS tradition of compact menu-bar
      system monitors. It is useful to package-manager users who want dense hardware and
      operating-system telemetry without keeping Activity Monitor open.
    - >
      Its modular design and optional privileged helper distinguish it from
      single-purpose menu extras: one installation can expose CPU, memory, disk,
      network, battery, GPU, Bluetooth, temperature, and fan information.
  project-history:
    - >
      MenuBar Stats was created by independent developer Fabrice Leyne under the seense
      label, which he started in 2011.
    - >
      MenuBar Stats 3 was rewritten around newer Apple APIs and introduced a modular
      architecture, Notification Center widgets, and additional Bluetooth and GPU
      modules. Later releases added Apple Silicon support, backup and restore,
      notifications, and continued macOS compatibility work.
  related-projects:
    - MenuBar Stats Plugins Manager
    - Mx Power Gadget
    - The Clock
  sources:
    - 'Official developer biography: https://www.seense.com/about/'
    - 'Official helper page: https://www.seense.com/menubarstats/plugins3/'
    - 'Official product page: https://www.seense.com/menubarstats/'
    - >
      Official release notes:
      https://seense.com/menubarstats/updateapp/versionnotes/notes.html
  summary:
    - >
      MenuBar Stats is a modular macOS system monitor from seense. It displays live
      resource and hardware information in the menu bar, Notification Center, combined
      windows, or separate module windows.
  timeline:
    - '2011: Fabrice Leyne started seense.'
    - >
      MenuBar Stats 3: The application was rewritten around newer Apple APIs with a
      modular design and Notification Center widgets.
    - '2020-2021: The 3.x series added Big Sur and Apple Silicon compatibility.'
    - '2026-09-16: The official product page recorded fixes for macOS 27.'
  usage:
    - >
      Users select modules for CPU, memory, disks, network, battery, GPU, Bluetooth,
      temperature, and fans, then place concise or detailed views in the macOS menu bar
      or Notification Center.
    - >
      Temperature and fan monitoring require the companion MenuBar Stats Plugins Manager
      and its SMC helper. Modules can be combined into one menu item or displayed
      separately, with graphs, top-process views, and notifications available where
      supported.
