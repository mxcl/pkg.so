history:
  adoption-history:
    - >
      BetterAudio is distributed to macOS users through a Homebrew cask according to the
      supplied package metadata. The project offers core functionality without charge
      and uses an optional support license for additional power-user features.
  package-nerd-significance:
    - >
      It occupies the utility niche between macOS's system-wide volume controls and
      professional audio-routing software, providing package-manager-installable
      per-application controls and equalization.
  project-history:
    - >
      BetterAudio was developed as a macOS menu-bar audio utility focused on finer
      control than the operating system's standard sound interface. Its public project
      materials emphasize per-application volume, muting, equalization, device control,
      and media-key behavior.
