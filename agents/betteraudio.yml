  summary:
    - >
      BetterAudio is a macOS audio-control application for managing volume,
      equalization, muting, and audio devices on a per-application basis.
  timeline:
    - >
      Current generation: Available as a macOS application with free core features and
      optional licensed power-user functionality.
  usage:
    - >
      BetterAudio runs as a Mac utility and is used to adjust individual applications
      independently, apply equalization, select audio devices, and refine media-key or
      muting behavior.
