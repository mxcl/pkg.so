history:
  adoption-history:
    - >
      The Chinese edition is distributed through Homebrew Cask as cleanmymac-zh, giving
      command-line-oriented Mac users a package-managed installation route.
  package-nerd-significance:
    - >
      CleanMyMac represents the commercial, GUI-oriented side of macOS maintenance
      software. Its Homebrew Cask packaging is useful to people who want reproducible
      installation even for proprietary desktop utilities.
  project-history:
    - >
      MacPaw founder Oleksandr Kosovan began developing CleanMyMac in 2008. CleanMyMac 3
      followed in 2015, and the substantially redesigned CleanMyMac X arrived in 2018 as
      the product's tenth-anniversary edition, adding malware removal, application
      updates, and performance tools.
    - >
      This cask packages a Chinese-language CleanMyMac X distribution rather than a
      separate open-source project.
  related-projects:
    - CleanMyMac
    - Setapp
  sources:
    - >
      Input fields source_facts.description, source_facts.homepage, and
      source_facts.package-manager.
    - 'MacPaw CleanMyMac X announcement: https://macpaw.com/news/cleanmymac-x-has-arrived'
    - 'MacPaw CleanMyMac anniversary history: https://macpaw.com/news/cleanmymac-anniversary'
    - 'MacPaw company history: https://macpaw.com/about'
  summary:
    - >
      CleanMyMac X Chinese is a Chinese-language edition of MacPaw's macOS cleanup and
      maintenance application, packaged for installation through Homebrew Cask.
  timeline:
    - >
      2008: Oleksandr Kosovan begins developing CleanMyMac and MacPaw is bootstrapped
      around the product.
    - '2015: CleanMyMac 3 is introduced.'
    - '2018: CleanMyMac X is released as the tenth-anniversary edition.'
  usage:
    - >
      Users run the graphical application to locate removable system data, reclaim disk
      space, improve performance, manage applications, and scan for malware. Because
      these operations can delete files or change system state, scan results should be
      reviewed before cleanup.
