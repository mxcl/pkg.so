history:
  adoption-history:
    - >
      Flowgrind has been packaged as a niche but durable network-measurement utility for
      operators and researchers who need controlled TCP experiments across multiple
      endpoints. Its official README emphasizes third-party tests, parallel flows,
      transport-layer metrics, and optional separation of control and test traffic.
  package-nerd-significance:
    - >
      Flowgrind is package-interesting because it sits beside iperf and netperf but
      exposes a more distributed RPC-style model. Packaging it means shipping both the
      controller and daemon binaries plus native dependencies such as xmlrpc-c, uuid,
      libpcap, and GSL.
  project-history:
    - >
      The project's NEWS file records an initial 0.1 release in November 2006. Its
      README positions Flowgrind as a distributed TCP measurement tool, similar in broad
      purpose to iperf and netperf but with a controller and daemon architecture.
    - >
      Through the 2010s, official release notes added traffic-generation features,
      libpcap dumping, FreeBSD support, IPv6 support, GPLv3 licensing, Mac OS X support,
      UUID-based daemon identification, and compatibility fixes. The project later moved
      its website to flowgrind.github.io.
  related-projects:
    - >
      The official README explicitly names iperf3 and netperf as related TCP measurement
      tools.
  sources:
    - https://flowgrind.github.io/
    - https://flowgrind.github.io/doxygen/index.html
    - https://github.com/flowgrind/flowgrind
    - https://raw.githubusercontent.com/flowgrind/flowgrind/next/NEWS
    - https://raw.githubusercontent.com/flowgrind/flowgrind/next/README.md
  summary:
    - >
      Flowgrind is an advanced TCP traffic generator and measurement tool for
      benchmarking TCP/IP stacks on Linux, FreeBSD, and macOS.
  timeline:
    - '2006: Flowgrind 0.1 initial release.'
    - '2010: Flowgrind 0.5 adds libpcap support and advanced traffic-generation dependencies.'
    - '2013: Flowgrind 0.6 adds full IPv6 support for control and test connections.'
    - '2014: Flowgrind 0.7.1 changes license to GPLv3; 0.7.5 re-adds Mac OS X support.'
    - '2016: Flowgrind 0.8.0 introduces UUID daemon identification and many bug fixes.'
    - >
      2021: Flowgrind 0.8.1 moves the website to flowgrind.github.io; 0.8.2 updates
      packaging and version fixes.
  usage:
    - >
      A normal test starts flowgrindd on endpoint machines and runs flowgrind from a
      controller host with source and destination hosts passed through -H. The
      controller can schedule multiple flows, collect periodic results, and display
      measurements from the daemons.
    - >
      Flowgrind measures throughput, interarrival time, round-trip time, block counts,
      transactions per second, and, where supported by the OS, TCP stack details such as
      congestion window and slow-start threshold.
related-packages:
  - id: brew:iperf3
    reason: >
      Choose iperf3 for simpler client/server TCP, UDP, or SCTP bandwidth tests and
      automation-friendly JSON output; choose Flowgrind when distributed multi-flow
      scheduling and detailed TCP-stack measurements matter.
    rel: alternative
    sources:
      - https://flowgrind.github.io/
      - https://github.com/esnet/iperf
      - https://software.es.net/iperf/
