history:
  adoption-history:
    - >
      The libexif project explicitly notes that it supplies source code while
      operating-system and package maintainers provide binaries. It points Linux and
      macOS users toward distribution package tools and package ecosystems such as
      Homebrew, MacPorts, Conan, and Conda-forge.
  package-nerd-significance:
    - >
      The package matters because it exposes libexif directly as a small Unix-style
      executable. It is a practical metadata inspection tool and a smoke test for the
      underlying library package.
  project-history:
    - >
      The libexif project maintains several related packages: libexif itself, exif as
      the simple command-line interface, GUI components, and a regression test suite.
      The exif README describes the tool as a small utility written to demonstrate
      libexif's ability to show EXIF information hidden in JPEG files.
    - >
      The project lived historically on SourceForge and moved its active source-code
      home to GitHub in 2017. Since then, the libexif homepage has continued to track
      both library and exif command-line releases, including security, stability, and
      bugfix updates.
  related-projects:
    - >
      exif is part of the libexif family alongside libexif, libexif-gtk, gexif, and
      libexif-testsuite.
  sources:
    - https://libexif.github.io/
    - https://github.com/libexif/exif
  summary:
    - >
      exif is the small command-line interface to libexif, the portable C library for
      reading and writing EXIF metadata in image files.
  timeline:
    - '2007: libexif 0.6.16 security release is listed in project news.'
    - '2017: The libexif project moves to GitHub.'
    - '2020: exif 0.6.22 stability and bugfix release is announced.'
    - '2026: libexif 0.6.26 security release is announced.'
  usage:
    - >
      exif is used when a user wants a compact C-based command-line reader for EXIF data
      in JPEG files. It is less expansive than ExifTool, but it is useful for scripts
      and systems that already depend on libexif.
related-packages:
  - id: brew:exiftool
    reason: >
      Choose ExifTool when you need batch editing or metadata support beyond JPEG EXIF;
      choose exif for a smaller libexif-based JPEG tool.
    rel: alternative
    sources:
      - https://libexif.github.io/man/exif.html
      - https://exiftool.org/exiftool_pod.html
  - id: brew:jhead
    reason: >
      Choose jhead for a similarly lightweight JPEG-focused tool with capture-time
      renaming, timestamp adjustment, metadata stripping, and rotation-oriented
      workflows.
    rel: alternative
    sources:
      - https://libexif.github.io/man/exif.html
      - https://github.com/Matthias-Wandel/jhead
