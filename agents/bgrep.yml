id: brew:bgrep
display-name: bgrep
repo: null
docs:
  - https://github.com/tmbinc/bgrep#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input metadata records Homebrew packaging for bgrep. Its adoption is
      correspondingly modest and toolbelt-oriented: useful enough to package, but
      intentionally small.
  package-nerd-significance:
    - >
      The package is significant in the classic Unix sense: one C file, one executable,
      one missing behavior from grep filled without pulling in a larger forensic suite.
      It is handy for firmware, image, dump, and protocol-payload spelunking.
  project-history:
    - >
      The README gives the origin story plainly: the author was annoyed that grep could
      not look for binary strings and wrote a tool for that job. The GitHub repository
      was created in 2010, has a small tag history, and remains a compact C utility
      rather than a broad search framework.
  related-projects:
    - >
      The obvious related tool is grep(1), which the README names as the motivation. It
      also overlaps with hex editors, hexdump/xxd workflows, and binary-analysis
      command-line tools.
  sources:
    - https://api.github.com/repos/tmbinc/bgrep
    - https://github.com/tmbinc/bgrep#readme
    - input.source_facts.package-manager
  summary:
    - >
      bgrep is a tiny binary-pattern search utility: grep-like in spirit, but aimed at
      byte sequences in binary files rather than text lines.
  timeline:
    - '2010: Initial GitHub commit.'
    - '2011: bgrep-0.2 tag appears.'
    - '2026: bgrep-0.3 tag updates README usage around context flags.'
  usage:
    - >
      bgrep searches for a hex byte pattern, can recurse through directories, can print
      before/after context bytes, can read a pattern from a file, and can apply a mask
      file for wildcard bytes. When no path is given, it reads standard input.
