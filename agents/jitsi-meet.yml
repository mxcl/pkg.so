history:
  adoption-history:
    - >
      Jitsi distributes self-updating desktop builds for macOS, Windows, and GNU/Linux.
      The application works with meet.jit.si as well as independently operated Jitsi
      Meet deployments, making it useful to both public-service users and self-hosting
      communities.
  package-nerd-significance:
    - >
      The desktop application packages the web-oriented Jitsi Meet experience as a
      cross-platform Electron app while adding desktop integration such as deep links,
      screen sharing, remote control, always-on-top windows, and automatic updates. It
      is a useful example of a web conferencing stack delivered as a native package.
  project-history:
    - >
      Jitsi Meet Electron began as a basic shell around meet.jit.si and a test bed for
      the Jitsi Electron SDK.
    - >
      During Google Summer of Code 2018, contributor Akshit Nagpal and the Jitsi project
      developed it into a fuller desktop application. Jitsi announced version 1.0.0 on
      September 11, 2018.
  related-projects:
    - Jitsi Meet
    - Jitsi Electron SDK
    - meet.jit.si
    - Electron
    - WebRTC
  sources:
    - https://github.com/jitsi/jitsi-meet-electron
    - https://jitsi.github.io/handbook/
    - >
      https://jitsi.org/blog/remote-desktop-control-and-always-on-top-view-with-the-new-jitsi-meet-desktop-app/
  summary:
    - >
      Jitsi Meet is the cross-platform Electron desktop client for the open-source Jitsi
      Meet video-conferencing system.
  timeline:
    - >
      Before 2018: The Electron project existed as a basic meet.jit.si shell and SDK
      playground.
    - '2018: Google Summer of Code work expanded the application.'
    - '2018-09-11: Jitsi announced Jitsi Meet Electron 1.0.0.'
  usage:
    - >
      Users join meetings on meet.jit.si or another Jitsi Meet deployment, share their
      screen, use deep links, and access desktop-oriented features such as remote
      control and an always-on-top meeting window.
