id: brew:jira-cli
display-name: jira-cli
repo: null
docs:
  - https://github.com/ankitpokhrel/jira-cli#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/.jira/.config.yml
    - ~/.config/.jira/.config.yml
credentials-file-location:
  unix:
    - ~/.netrc
history:
  adoption-history:
    - >
      jira-cli has adoption signals typical of a workhorse developer-productivity CLI:
      GitHub release binaries, Docker usage, Homebrew and other package-manager entries,
      sponsor/supporter badges, and README documentation for Jira Cloud and Jira Server.
      Its usefulness increases in organizations where developers live in terminals but
      still need to search, update, transition, and inspect Jira tickets.
  package-nerd-significance:
    - >
      jira-cli fills a packaging niche left by web-heavy enterprise tooling: it turns
      Jira into a scriptable and interactive terminal program. Package nerds care
      because it is a Go CLI with standalone releases, package-manager coverage, and a
      tight feedback loop with upstream API churn, all for a service many developers are
      required to use whether they like the browser UI or not.
  project-history:
    - >
      The project README says the tool began with the idea of making Jira issue search
      and navigation straightforward, then evolved into a fuller day-to-day Jira
      workflow tool with issue creation, cloning, linking, transitions, and more. It
      also states that the project was heavily inspired by GitHub CLI, which explains
      its command-group structure and terminal-first ergonomics.
    - >
      Public GitHub releases start in 2021. Version 1.0.0 in 2022 marked a major
      compatibility point and added or stabilized features such as custom fields,
      `.netrc`, keychain support, personal access tokens, issue deletion,
      non-interactive init, custom-field editing, and a broader contributor base. Later
      releases kept tracking Jira API changes and terminal automation needs, including
      CSV and raw JSON output in v1.7.0.
  related-projects:
    - >
      jira-cli is related to GitHub CLI by inspiration and to other terminal
      project-management tools such as gh, glab, linear-cli, and taskwarrior-style
      workflows. It is also adjacent to Atlassian's Jira Cloud and Jira Server/Data
      Center APIs.
  sources:
    - https://api.github.com/repos/ankitpokhrel/jira-cli/releases/tags/v1.0.0
    - https://api.github.com/repos/ankitpokhrel/jira-cli/releases/tags/v1.7.0
    - https://api.github.com/repos/ankitpokhrel/jira-cli/releases?per_page=100
    - https://github.com/ankitpokhrel/jira-cli
    - https://github.com/ankitpokhrel/jira-cli/wiki/Installation
  summary:
    - >
      jira-cli is an interactive command-line client for Atlassian Jira. It brings
      common issue, epic, sprint, board, project, and workflow actions into the terminal
      with interactive lists, POSIX-style flags, JQL support, browser opening, clipboard
      helpers, and machine-readable output modes.
  timeline:
    - '2021: v0.0.0 and v0.1.0 began the public release series.'
    - >
      2022: v1.0.0 marked a major release with custom fields, `.netrc`, keychains,
      personal access tokens, issue deletion, non-interactive init, and broader
      issue-editing support.
    - '2023: v1.3.0 and v1.4.0 continued the 1.x line of Jira workflow features.'
    - '2024: v1.5.x releases continued maintenance of the command suite.'
    - >
      2025: v1.7.0 added raw JSON and CSV issue-listing output and updated deprecated
      Jira endpoints.
  usage:
    - >
      The tool is initialized with `jira init`, uses `JIRA_API_TOKEN` for cloud or
      on-premise authentication, supports `.netrc` and keychains for credentials, and
      stores configuration under the XDG config path by default. Day-to-day use includes
      `jira issue list`, raw JQL through `--jql`, interactive navigation, issue view,
      transitions, browser opening, clipboard copying, issue creation and editing, and
      output in plain, raw JSON, or CSV forms.
related-packages:
  - id: brew:jiratui
    reason: >
      Choose JiraTUI when you prefer a full-screen Textual interface and YAML-based
      settings, while retaining CLI commands for Jira work items, comments, and users.
    rel: alternative
    sources:
      - https://github.com/ankitpokhrel/jira-cli
      - https://jiratui.readthedocs.io/en/latest/
