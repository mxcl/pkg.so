history:
  adoption-history:
    - >
      TripMode has been distributed directly by its developer, through the Mac App
      Store, and through Setapp. An official Windows edition existed but its sales and
      support were later discontinued, leaving macOS as the supported platform.
  package-nerd-significance:
    - >
      TripMode packages per-application traffic filtering into a desktop utility useful
      on metered hotspots, congested links, and travel connections. For package-oriented
      Mac users, it is a practical control against automatic updates, cloud
      synchronization, backups, and other background transfers consuming limited data.
  project-history:
    - >
      TripMode was developed as a per-application network-access controller and
      data-usage monitor. Earlier generations relied on macOS kernel networking
      extensions.
    - >
      Apple's networking changes for macOS Big Sur required the application to be
      rebuilt substantially. TripMode 3 launched on October 13, 2020 with a new
      licensing system, a live traffic monitor, historical reports, and a user-space
      network-filter architecture.
  related-projects:
    - >
      TripMode overlaps with application firewalls and bandwidth monitors but is
      oriented toward reducing usage on constrained or expensive connections.
    - >
      Its profile and hotspot-detection features complement macOS network-location and
      tethering workflows.
  sources:
    - https://tripmode.ch/
    - https://tripmode.ch/support/
  summary:
    - >
      TripMode is a macOS network utility that monitors data use and allows or blocks
      internet access on an application-by-application basis.
  timeline:
    - >
      2020: Apple announced the transition away from the legacy networking-extension
      approach used by TripMode 2.
    - '2020-10-13: TripMode 3 launched after a substantial Big Sur-focused rewrite.'
    - "Later: Sales and support for TripMode's Windows edition were discontinued."
  usage:
    - >
      Users enable TripMode on a constrained connection, allow only the applications
      that need network access, and inspect live or historical usage. Profiles can
      represent different network situations, while hotspot detection can activate
      blocking automatically.
