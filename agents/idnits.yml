config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      idnits is adopted because IETF authors, working-group chairs, reviewers, and
      automated build systems need early feedback on draft boilerplate, formatting,
      references, and submission expectations. The Datatracker submission instructions
      recommend checking an Internet-Draft with idnits before submission.
    - >
      The Node-based idnits3 packaging makes the tool easier to install in web services,
      CI jobs, and author workflows compared with the older shell-based generation.
  package-nerd-significance:
    - >
      idnits is package-nerd interesting because it encodes institutional publishing
      rules as a command-line tool. Its output can gate CI and submission preparation,
      so a package update can change what draft authors see as errors or warnings.
    - >
      It also marks the IETF tooling migration from older tools.ietf.org-hosted scripts
      into maintained GitHub and npm-distributed components under the ietf-tools
      organization.
  project-history:
    - >
      The IETF author resources describe document validation as an important step for
      Internet-Drafts and list idnits as the tool that validates plaintext I-Ds. The
      Author Tools web service also runs idnits behind the scenes alongside xml2rfc,
      kramdown-rfc, id2xml, and related tools.
    - >
      The GitHub repository history is explicit about the transition: the project began
      as a snapshot mirror of idnits 2.17 from the older tools.ietf.org site, with
      idnits2 preserved on a v2 branch and idnits3 developed as a JavaScript-based
      CLI/library.
  related-projects:
    - >
      idnits is used alongside xml2rfc, rfclint, kramdown-rfc, id2xml, Datatracker, and
      the Author Tools web service. These tools form the practical pipeline for writing,
      validating, converting, and submitting Internet-Drafts.
    - >
      DraftForge and other IETF authoring environments can surface idnits checks as part
      of an editor or web workflow.
  sources:
    - https://authors.ietf.org/author-tools-web-service
    - https://authors.ietf.org/document-validation
    - https://github.com/ietf-tools/idnits
    - https://github.com/ietf-tools/idnits/releases/tag/3.1.0
    - https://github.com/ietf-tools/idnits/tree/v2
    - https://raw.githubusercontent.com/ietf-tools/idnits/v3/README.md
  summary:
    - >
      idnits is an IETF Internet-Draft validation tool, shipped as both a CLI and a
      library in the idnits3 line. It checks draft documents for formatting and
      policy-related nits before submission or publication workflows.
  timeline:
    - >
      2.17: The GitHub repository began from a snapshot mirror of older tools.ietf.org
      idnits 2.17.
    - >
      2022-07-01: An idnits issue discussed boilerplate-string transition handling after
      a prior code change.
    - '2026-06-26: GitHub listed idnits 3.1.0 as a release.'
    - >
      v3 branch: The README describes idnits3 as a JavaScript-based CLI/library and
      points older shell-based users to the v2 branch.
  usage:
    - >
      The idnits3 README documents installation through npm, npx use without
      installation, CLI modes such as normal and submission, output formats including
      pretty, simple, json, and count, and a library API based around checkNits().
    - >
      Authors use idnits directly on RFCXML or plaintext drafts, or indirectly through
      the Author Tools service. Toolsmiths can use its library form to integrate draft
      checks into editors and publishing pipelines.
related-packages:
  - id: brew:xml2rfc
    reason: >
      Use xml2rfc to validate and render RFCXML, then idnits for policy and formatting
      checks; official IETF author and submission services run these tools in the same
      document pipeline.
    rel: adjacent_workflow
    sources:
      - https://authors.ietf.org/author-tools-web-service
      - https://authors.ietf.org/submitting-your-internet-draft
      - https://github.com/ietf-tools/xml2rfc
  - id: brew:mmark
    reason: >
      Mmark converts Markdown Internet-Drafts to RFCXML for xml2rfc, after which idnits
      can check the resulting draft as part of the pre-submission workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/mmarkdown/mmark/blob/master/README.md
      - https://authors.ietf.org/tools-catalog
      - https://authors.ietf.org/author-tools-web-service
