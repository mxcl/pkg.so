id: cask:scummvm-app
display-name: ScummVM
repo: https://github.com/scummvm/scummvm
docs:
  - https://docs.scummvm.org/
  - https://wiki.scummvm.org/
config-file-location:
  linux:
    - ~/.config/scummvm/scummvm.ini
    - ~/snap/scummvm/current/.config/scummvm/scummvm.ini
  macos:
    - ~/Library/Preferences/ScummVM Preferences
    - ~/.scummvmrc
  windows:
    - '%APPDATA%\ScummVM\scummvm.ini'
    - C:\WINDOWS\scummvm.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      ScummVM grew from a SCUMM interpreter for Linux and Windows into a large
      cross-platform compatibility project supporting hundreds of adventure and
      role-playing games across desktop, mobile, console, and hobbyist systems.
    - >
      Its compatibility work has also been used in commercial rereleases. The project
      documented official collaboration with Cyan on anniversary releases of Myst and
      Riven, illustrating how engine reimplementation can support both preservation
      communities and modern distribution.
  package-nerd-significance:
    - >
      ScummVM is a canonical game-preservation package: it replaces obsolete proprietary
      executables with maintained free software while relying on users' original game
      data. This differs from whole-machine emulation and permits engine-specific fixes,
      portability, scaling, audio improvements, and accessibility features.
    - >
      Its exceptionally broad platform support, long-lived source tree, plugin-style
      collection of engines, and availability through operating-system package managers
      and homebrew ecosystems make it a recurring reference point for
      compatibility-layer packaging.
  project-history:
    - >
      Ludvig Strigeus pushed the initial ScummVM 0.0.1 revision in October 2001. The
      early project interpreted LucasArts' SCUMM games, but it soon added more engines,
      games, contributors, and platform ports while retaining its established name.
    - >
      The project broadened beyond its original 2D point-and-click scope. In 2020, the
      related ResidualVM project merged into ScummVM, adding 3D-oriented engines and
      support work for games including Grim Fandango, Escape from Monkey Island, Myst
      III: Exile, and The Longest Journey.
  related-projects:
    - >
      ResidualVM developed support for 3D adventure games as a sister project before
      merging into ScummVM in 2020.
    - >
      ScummVM is often discussed alongside system emulators such as DOSBox, but ScummVM
      reimplements individual game engines rather than emulating a complete computer.
  sources:
    - 'Official ResidualVM merger announcement: https://www.scummvm.org/news/20201009/'
    - 'Official about page: https://www.scummvm.org/about/'
    - 'Official documentation: https://docs.scummvm.org/'
    - 'Official news archive: https://www.scummvm.org/news/archive/'
    - 'Official repository: https://github.com/scummvm/scummvm'
  summary:
    - >
      ScummVM is a free, cross-platform collection of reimplemented game engines that
      runs supported classic adventure and role-playing games using their original data
      files.
  timeline:
    - '2001: ScummVM 0.0.1 received its first public release.'
    - >
      2002: Early releases and ports expanded the project beyond its initial Linux and
      Windows interpreter.
    - '2020: ResidualVM merged into ScummVM, broadening support to 3D adventure engines.'
    - '2021: ScummVM marked its twentieth anniversary with the 2.5.0 release.'
    - >
      2026: The project reported more than five million lines of code and more than 900
      contributors.
  usage:
    - >
      Users install ScummVM, copy or extract data files from legally obtained supported
      games, add each game directory through the launcher, and then start games from
      ScummVM's library. The application executable normally replaces the game's
      original executable but not its copyrighted assets.
    - >
      Global and per-game graphics, audio, input, save, and engine-specific options can
      be managed through the launcher or configuration file. The official compatibility
      database and wiki identify required data files and known support status.
