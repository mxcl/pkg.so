id: brew:execline
display-name: execline
repo: https://git.skarnet.org/cgi-bin/cgit.cgi/execline
docs:
  - https://skarnet.org/software/execline
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      execline is part of the wider skarnet.org software ecosystem and depends on
      skalibs. It is packaged across Unix-like distributions and package managers,
      including Homebrew, Debian, Ubuntu, Alpine, MacPorts, and others in the supplied
      package facts.
    - >
      Its adoption is strongest among users of s6, runit-like supervision ideas, and
      minimal Unix service-management stacks, where explicit process state, file
      descriptor handling, and environment manipulation matter more than interactive
      shell convenience.
  package-nerd-significance:
    - >
      execline is package-nerd significant because it decomposes shell behavior into
      many small binaries with explicit process semantics. It fits the skarnet tradition
      of small composable tools for supervision and init-adjacent systems.
    - >
      It is also a good example of a package where the binary list is the product:
      installing execline adds a vocabulary of tiny command primitives rather than one
      large interactive shell.
  project-history:
    - >
      The official page describes execline as a scripting language like sh, but with
      substantially different syntax. Its design goal is predictable grammar and
      avoidance of shell-style security issues while retaining shell-level power through
      conditionals, loops, option handling, globbing, environment management, and
      process-control commands.
    - >
      The public git tag list shows the 2.x series beginning with v2.0.0.0 about twelve
      years before June 2026. The upgrade notes record a major build-system change in
      2.0.0.0 and continuing incremental additions through 2.9.x, including envfile,
      posix-cd, posix-umask, eltest, multicall support, and macOS shared-library
      support.
  related-projects:
    - skalibs is execline's required support library.
    - >
      The homepage lists official mirrors on Codeberg, GitHub, and SourceHut, and points
      users to skaware mailing-list discussion.
  sources:
    - https://skarnet.org/software/execline/
    - https://skarnet.org/software/execline/upgrade.html
    - https://git.skarnet.org/cgi-bin/cgit.cgi/execline/
    - https://git.skarnet.org/cgi-bin/cgit.cgi/execline/refs/tags
    - https://git.skarnet.org/cgi-bin/cgit.cgi/execline/log/
  summary:
    - >
      execline is a small non-interactive scripting language from skarnet.org, designed
      as a predictable shell alternative for process supervision, startup scripts, and
      command chaining.
  timeline:
    - '2.0.0.0: Build system changed to the standard configure, make, install flow.'
    - '2.5.1.0: envfile command added.'
    - '2.5.3.0: posix-cd added and wait made POSIX-compliant.'
    - '2.9.1.0: eltest added.'
    - '2.9.2.0: Experimental multicall feature added.'
    - '2.9.8.0: Shared libraries supported on macOS.'
    - '2026: v2.9.9.1 tagged in the official git repository.'
  usage:
    - >
      Users write execlineb scripts or compose the provided commands directly. The
      command set covers parser/launcher behavior, process state control, environment
      files, fd operations, redirection, pipelines, foreground/background blocks,
      conditionals, loops, positional parameters, and option parsing.
    - >
      The homepage includes example .profile replacement scripts and documents each
      command with consistent exit behavior: temporary errors exit 111, permanent
      misuse-style errors exit 100, failed exec lookup exits 127, and other exec
      failures exit 126.
related-packages:
  - id: brew:s6
    reason: >
      Use execline with s6 when writing supervision and service scripts; the default s6
      build uses execline for binaries that launch execlineb-interpreted scripts.
    rel: adjacent_workflow
    sources:
      - https://skarnet.org/software/execline/
      - https://skarnet.org/software/s6/
  - id: brew:s6-rc
    reason: >
      Use execline with s6-rc to build dependency-ordered service management on s6, for
      which execline is an explicit build-time and runtime requirement.
    rel: adjacent_workflow
    sources:
      - https://skarnet.org/software/execline/
      - https://skarnet.org/software/s6-rc/
