id: brew:bbot
display-name: BBOT
repo: https://github.com/blacklanternsecurity/bbot
docs:
  - https://www.blacklanternsecurity.com/bbot/Stable
  - https://www.blacklanternsecurity.com/bbot/Stable/scanning
  - https://www.blacklanternsecurity.com/bbot/Stable/scanning/configuration
config-file-location:
  unix:
    - ~/.config/bbot/bbot.yml
credentials-file-location:
  unix:
    - ~/.config/bbot/bbot.yml
history:
  adoption-history:
    - >
      BBOT's adoption follows the modern Python security-tool path: PyPI and pipx for
      primary installation, Docker for isolated runs, GitHub for development, and
      Homebrew/Nix formulas for users who expect security tooling in system package
      managers.
  package-nerd-significance:
    - >
      BBOT is interesting in package history because it is a high-churn security
      automation tool that still reaches general package managers. It shows how OSINT
      tooling has moved from one-off scripts toward modular scanners with presets, docs,
      containers, PyPI packages, and native package-manager entries.
  project-history:
    - >
      The upstream README describes BBOT as inspired by SpiderFoot and built to automate
      recon, bug bounties, and ASM. Its examples emphasize repeatable presets for
      subdomain enumeration, web crawling, email gathering, and web scanning.
    - >
      The PyPI release metadata shows a 1.0.0 package upload on 2022-08-18. By the
      current upstream README, the project has stable and development installation
      tracks, Docker distribution, a public documentation site, and a community Discord.
  related-projects:
    - >
      Related projects include SpiderFoot, Amass, Subfinder, httpx, Nuclei, and other
      reconnaissance and attack-surface-management tools.
  sources:
    - https://github.com/blacklanternsecurity/bbot#readme
    - https://pypi.org/pypi/bbot/json
    - https://www.blacklanternsecurity.com/bbot/Stable/
    - input:source_facts.package-manager
  summary:
    - >
      BBOT is Black Lantern Security's OSINT, reconnaissance, bug-bounty, and
      attack-surface-management automation tool. It packages many passive and active
      discovery modules behind a single `bbot` scanner and preset system.
  timeline:
    - '2022-08-18: PyPI metadata records BBOT 1.0.0 uploads.'
    - '2023: Upstream README advertises a DEF CON Recon Village/Demo Labs appearance.'
    - >
      Current: README documents stable installation with `pipx install bbot`, Docker,
      and the official documentation site.
    - '2026-06-09: PyPI metadata records 3.0.0.986rc0 release-candidate uploads.'
  usage:
    - >
      Operators use BBOT by giving it targets and presets such as `subdomain-enum`,
      `spider`, `email-enum`, `web-basic`, or `web-thorough`. Configuration stores
      module options and API keys, so the same scan recipes can be repeated across
      assessments.
related-packages:
  - id: brew:amass
    reason: >
      Choose OWASP Amass when the primary goal is deep attack-surface intelligence and
      asset-relationship mapping; BBOT is broader modular scan orchestration with active
      security modules.
    rel: alternative
    sources:
      - https://www.blacklanternsecurity.com/bbot/Stable/how_it_works/
      - https://owasp-amass.github.io/docs/
  - id: brew:subfinder
    reason: >
      Choose subfinder for a focused passive subdomain-enumeration CLI, while BBOT is
      appropriate when enumeration must feed a larger recursive reconnaissance scan.
    rel: alternative
    sources:
      - https://www.blacklanternsecurity.com/bbot/Stable/scanning/presets_list/
      - https://docs.projectdiscovery.io/opensource/subfinder/overview
  - id: brew:nuclei
    reason: >
      BBOT has an official Nuclei module that sends discovered URLs into template-driven
      vulnerability checks and returns the resulting findings to the scan.
    rel: adjacent_workflow
    sources:
      - https://www.blacklanternsecurity.com/bbot/Stable/modules/nuclei/
      - https://docs.projectdiscovery.io/opensource/nuclei
tags:
  - attack-surface-management
  - automation
  - cli
  - osint
  - reconnaissance
  - scanner
  - security
