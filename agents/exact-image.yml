history:
  adoption-history:
    - >
      The project page explicitly mentions deployment in production solutions by partner
      companies and lists distribution packaging for T2 SDE, FreeBSD ports, Debian, and
      Ubuntu.
    - >
      Its adoption story is strongest in scanner, OCR, barcode, and document-processing
      pipelines rather than desktop image editing.
  package-nerd-significance:
    - >
      ExactImage is interesting because it bundles several specialized document-image
      tools around a performance-oriented C++ library: conversion, identification,
      barcode recognition, and OCR-to-PDF assembly.
    - >
      It also represents an older open-source style: project homepage documentation, SVN
      trunk, release snapshots, and distro packages instead of a GitHub-centered
      workflow.
  project-history:
    - >
      The official page says ExactCODE began the project in the mid-2000s after finding
      ImageMagick too CPU-heavy for certain tasks. A C++ prototype reportedly cut
      processing time to roughly one twentieth of the ImageMagick baseline for the
      needed workloads.
    - >
      ExactImage developed through numbered release series. Version 0.2 added a stable
      SWIG-exported API; 0.3 added per-codec accelerated rotation, flipping, scaling,
      color conversion, and on-demand decoding; 0.5 added open-source barcode
      recognition and faster pixel iteration; 0.6 rewrote the PDF codec and introduced
      hocr2pdf for searchable PDFs.
  related-projects:
    - >
      The project page positions ExactImage as a possible alternative to ImageMagick for
      selected image-processing tasks.
    - It embeds dcraw code for camera RAW support and compares fast JPEG scaling with EPEG.
  sources:
    - https://exactcode.com/opensource/exactimage
    - http://svn.exactcode.de/exact-image/trunk
    - http://dl.exactcode.de/oss/exact-image/
  summary:
    - >
      ExactImage is a C++ image-processing library and CLI suite from ExactCODE, created
      as a faster, more generic alternative to ImageMagick for selected production image
      workflows.
  timeline:
    - 'Mid-2000s: ExactCODE started the C++ prototype after reviewing ImageMagick performance.'
    - '0.2 series: Stable external SWIG API introduced.'
    - '0.3 series: Accelerated JPEG-oriented operations and on-demand decoding added.'
    - '0.5 series: Barcode recognition and faster pixel iteration added.'
    - '0.6 series: PDF codec rewritten and hocr2pdf introduced.'
    - '0.8 series: Multiple images per file supported in TIFF and econvert.'
  usage:
    - >
      The econvert command is the ImageMagick convert-like frontend for reading images,
      applying operations, and writing outputs. The page documents pipelines such as
      scaling, rotating JPEGs losslessly, changing color spaces, and producing
      thumbnails.
    - >
      Other included tools include edentify for image identification, hocr2pdf for
      searchable PDF generation from hOCR input, bardecode for barcode recognition, and
      edisplay for image viewing.
related-packages:
  - id: brew:imagemagick
    reason: >
      Choose ImageMagick for the broader, widely documented general-purpose image CLI
      ecosystem; ExactImage's own project page presents its faster specialized library
      and `econvert` frontend as an alternative for selected workloads.
    rel: alternative
    sources:
      - https://exactcode.com/opensource/exactimage/
      - https://imagemagick.org/command-line-processing.php
  - id: brew:tesseract
    reason: >
      Tesseract can produce hOCR from scanned images, which ExactImage's `hocr2pdf`
      consumes to build searchable PDFs with the recognized text layer.
    rel: adjacent_workflow
    sources:
      - https://exactcode.com/opensource/exactimage/
      - https://tesseract-ocr.github.io/tessdoc/Command-Line-Usage.html
