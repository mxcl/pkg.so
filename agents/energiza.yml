history:
  adoption-history:
    - >
      Energiza Pro targets MacBook, MacBook Pro, and MacBook Air models later than 2010.
      The official support center documents compatibility with macOS 10.13 and later,
      while discharging is limited to Apple-silicon MacBooks.
  package-nerd-significance:
    - >
      Energiza Pro belongs to the specialist macOS battery-management niche: utilities
      that expose fixed charge thresholds and manual charging behavior beyond Apple's
      automated Optimized Battery Charging feature.
  project-history:
    - >
      Energiza Pro was developed and distributed by appgineers and Dr. Jan Linxweiler as
      a macOS battery charging and monitoring utility. The official page documents
      version 1.3.5 and offers free monitoring features alongside paid charge-control
      features.
  related-projects:
    - >
      Apple Optimized Battery Charging is the built-in macOS feature most directly
      compared with Energiza Pro by its developer.
  sources:
    - 'Official EULA: https://appgineers.de/energiza/eula.html'
    - 'Official appgineers product listing: https://appgineers.de/'
    - 'Official product and support page: https://appgineers.de/energiza/'
  summary:
    - >
      Energiza Pro is a macOS menu-bar utility for monitoring MacBook batteries and
      controlling their charging limits. It combines free battery telemetry with paid
      automatic charging, discharging, notification, and heat-protection features.
  timeline:
    - '2022: The official EULA was last updated on 5 November.'
    - 'Version 1.3.5 era: Official product page documented support for macOS 10.13 and later.'
  usage:
    - >
      Users select lower and upper charge thresholds so a plugged-in MacBook does not
      remain continuously near 100 percent. They can also request a full charge, and
      supported Apple-silicon systems can actively discharge.
    - >
      The app reports charge, health, cycle count, temperature, remaining time, and
      wattage. Its helper app can be removed from the General section of the preferences
      window.
