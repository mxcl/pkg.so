history:
  adoption-history:
    - >
      decompose is packaged for Homebrew and also distributed upstream as release
      binaries, deb and rpm packages, and a Docker image. That makes it usable both as a
      local terminal tool and as a throwaway container for infrastructure inspection.
  package-nerd-significance:
    - >
      decompose is interesting to package people because it sits between Docker
      introspection, graph tooling, and documentation recovery. It is a small CLI that
      packages a messy operational task - discovering what containers actually talk to -
      into reproducible text outputs.
  project-history:
    - >
      The project README explains the origin in a practical operations problem: the
      author needed to visualize and inspect a large dockerized legacy system with more
      than 470 containers and little documentation. That origin shaped the tool as a
      reverse-engineering utility rather than a deployment orchestrator.
    - >
      The official release stream shows decompose reaching v0.9.1 in August 2023 and
      v1.0.0 the next day, with later 1.x releases continuing through 2026.
  related-projects:
    - >
      The README compares decompose with docker-autocompose, dockviz,
      docker-network-graph, and Weave Scope, while also exporting to ecosystems such as
      Graphviz, PlantUML, Structurizr DSL, and Docker Compose.
  sources:
    - https://github.com/s0rg/decompose
    - https://github.com/s0rg/decompose/releases/tag/v0.9.1
    - https://github.com/s0rg/decompose/releases/tag/v1.0.0
    - https://github.com/s0rg/decompose/releases/tag/v1.11.8
    - https://formulae.brew.sh/formula/decompose
  summary:
    - >
      decompose is a Go command-line tool for inspecting live Docker environments and
      turning observed container network connections into graph, tree, JSON, CSV,
      PlantUML, Structurizr DSL, and Compose-style output.
  timeline:
    - '2023: v0.9.1 release appears on GitHub.'
    - '2023: v1.0.0 is published.'
    - '2026: v1.11.8 is published.'
  usage:
    - >
      Package users run decompose when they need an observed map of an existing Docker
      estate. The README emphasizes stdout-oriented Unix behavior, sorted output for
      version control, offline processing from saved JSON streams, metadata enrichment,
      and multiple graph/export formats.
related-packages:
  - id: brew:dockviz
    reason: >
      Choose Dockviz for compact Docker image, container, and layer visualizations;
      choose decompose when observed live network connections and broader export formats
      are required.
    rel: alternative
    sources:
      - https://github.com/s0rg/decompose#analogs
      - https://github.com/justone/dockviz
  - id: brew:graphviz
    reason: >
      decompose can emit Graphviz DOT, which Graphviz renders into visual architecture
      diagrams such as SVG.
    rel: adjacent_workflow
    sources:
      - https://github.com/s0rg/decompose
      - https://graphviz.org/documentation/
  - id: brew:plantuml
    reason: >
      decompose exports PlantUML text that PlantUML can turn into a rendered,
      text-maintained architecture diagram.
    rel: adjacent_workflow
    sources:
      - https://github.com/s0rg/decompose
      - https://plantuml.com/starting
  - id: brew:structurizr-cli
    reason: >
      decompose can export Structurizr DSL, after which Structurizr CLI can validate,
      export, or publish the resulting workspace.
    rel: adjacent_workflow
    sources:
      - https://github.com/s0rg/decompose
      - https://docs.structurizr.com/cli
  - id: brew:docker-compose
    reason: >
      decompose can generate Compose-style YAML as an overview of an observed estate,
      which can then be reviewed with Docker Compose while respecting decompose's
      warning that the output may need repair before deployment.
    rel: adjacent_workflow
    sources:
      - https://github.com/s0rg/decompose
      - https://docs.docker.com/compose/
