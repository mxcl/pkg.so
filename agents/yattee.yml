history:
  adoption-history:
    - >
      Yattee is distributed across Apple's platforms, including macOS, iOS, and tvOS.
      Its official installation instructions cover GitHub releases, TestFlight,
      AltStore, source builds, and the Homebrew cask for macOS.
    - >
      The project has grown around privacy-oriented alternatives to direct YouTube use,
      supporting Invidious and Piped and later adding the self-hosted Yattee Server
      backend.
  package-nerd-significance:
    - >
      Yattee combines a native SwiftUI interface with open, replaceable video backends.
      That makes it notable to users who want a package-managed macOS video client
      without being locked to the official YouTube application or website.
    - >
      Its Homebrew cask complements the project's direct, notarized GitHub releases and
      built-in update mechanism.
  project-history:
    - >
      Yattee began as an AGPL-licensed, privacy-oriented video player for Apple
      platforms. Its first-generation client emphasized alternative YouTube frontends,
      custom playback, Picture in Picture, background audio, and SponsorBlock.
    - >
      The Yattee 2 effort broadened the design around a self-hosted yt-dlp-powered
      Yattee Server and added more media sources, synchronization, downloads, and native
      interfaces across Apple devices.
  related-projects:
    - Yattee Server
    - Invidious
    - Piped
    - SponsorBlock
    - DeArrow
    - yt-dlp
  sources:
    - 'Official documentation: https://docs.yattee.stream/'
    - >
      Official installation wiki:
      https://github.com/yattee/yattee/wiki/Installation-Instructions
    - 'Official releases: https://github.com/yattee/yattee/releases'
    - 'Official repository: https://github.com/yattee/yattee'
  summary:
    - >
      Yattee is an open-source, privacy-oriented video player for macOS and other Apple
      platforms. It can consume video through alternative and self-hosted backends
      instead of requiring the official YouTube client.
  timeline:
    - >
      First generation: Yattee established a native Apple-platform client around
      Invidious and Piped.
    - '2026: The Yattee 2 rewrite entered public testing with Yattee Server integration.'
    - '2026: Yattee 2 public betas expanded to Apple TV and macOS.'
  usage:
    - >
      Users configure one or more content sources, then browse, search, subscribe,
      queue, and play videos. The player supports high-resolution playback, Picture in
      Picture, background audio, SponsorBlock, playlists, history, and configurable
      controls.
    - >
      Newer builds also support local files, SMB and WebDAV sources, offline downloads,
      and iCloud synchronization.
