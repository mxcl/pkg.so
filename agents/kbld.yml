history:
  adoption-history:
    - >
      Carvel's public materials describe the suite as born from frustration with
      monolithic Kubernetes deployment tools and built around Unix-style composition.
      kbld's adoption follows that pattern: it appears in Homebrew, Nix, and Carvel
      install flows as one small command in a larger Kubernetes delivery toolchain.
  package-nerd-significance:
    - >
      kbld is package-nerd interesting because it makes image immutability a CLI
      transformation step. Instead of hiding build metadata in a platform service, it
      keeps the artifact graph visible in YAML and lock files that can be piped into
      other tools.
  project-history:
    - >
      The kbld repository began in April 2019. Its README and Carvel site describe a
      tool that delegates image building to mature tools such as Docker and Buildpacks
      pack, then rewrites YAML configuration to immutable digest references.
    - >
      kbld grew as part of the k14s/Carvel family rather than as a standalone monolith.
      Carvel documentation presents ytt, kbld, and kapp as composable tools: ytt
      structures and overlays YAML, kbld handles images, and kapp deploys and diffs
      Kubernetes resources.
  related-projects:
    - >
      kbld is closely related to Carvel ytt, kapp, imgpkg, vendir, kapp-controller,
      Docker, Buildpacks pack, Kubernetes manifests, Helm, and kustomize.
  sources:
    - https://blogs.vmware.com/opensource/2022/10/25/carvel-sets-sail-for-the-cncf-sandbox/
    - https://carvel.dev/blog/deploying-apps-with-ytt-kbld-kapp/
    - https://carvel.dev/blog/introduction-to-carvel-blog-post/
    - https://carvel.dev/kbld/
    - https://carvel.dev/kbld/docs/develop/building/
    - https://formulae.brew.sh/formula/kbld
    - https://github.com/carvel-dev/kbld
    - https://github.com/carvel-dev/kbld/commit/bc8118ca3ad7ecb7b2e3825d517a121c9c767cde.patch
  summary:
    - >
      kbld is a Carvel CLI for Kubernetes and YAML workflows that builds, pushes,
      resolves, locks, packages, and relocates container image references.
  timeline:
    - '2019-04-19: Repository initialized'
    - '2019: k14s tools including kbld were released as composable Kubernetes workflow tools'
    - '2020-08: k14s was rebranded as Carvel'
    - "2022-10: VMware announced Carvel's move into the CNCF Sandbox"
    - '2026-06-17: v0.49.1 release appeared in the GitHub release list'
  usage:
    - >
      Typical kbld usage pipes or reads YAML, finds image references, builds or resolves
      them, and emits YAML with digest-pinned images. Its docs also cover lock files,
      registry pushes, packaging images into tarballs, and relocation between
      registries.
related-packages:
  - id: brew:ytt
    reason: >
      Use ytt before kbld when manifests need structure-aware templating or overlays;
      Carvel's documented pipeline sends ytt output into kbld for image processing.
    rel: adjacent_workflow
    sources:
      - https://carvel.dev/blog/deploying-apps-with-ytt-kbld-kapp/
      - https://carvel.dev/kbld/
  - id: brew:kapp
    reason: >
      Use kapp after kbld to diff, apply, converge, and wait for the digest-pinned
      Kubernetes resources emitted by kbld.
    rel: adjacent_workflow
    sources:
      - https://carvel.dev/blog/deploying-apps-with-ytt-kbld-kapp/
      - https://carvel.dev/kbld/
