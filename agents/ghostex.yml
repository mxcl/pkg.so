history:
  adoption-history:
    - >
      Ghostex developed from a native macOS-oriented agent manager into a workspace with
      macOS, Linux, Windows/WSL2, Android, and iOS clients. Its agent-neutral design
      supports Claude Code, Codex, OpenCode, Gemini CLI, Cursor, and other
      terminal-based coding agents.
  package-nerd-significance:
    - >
      Ghostex reflects the emergence of orchestration layers above command-line coding
      agents. Package-minded developers care about its native Rust and GPUI shell,
      persistent Ghostty-based terminals, command-line control surface, remote daemon,
      worktree support, and ability to mix agent implementations without moving projects
      between separate applications.
  project-history:
    - >
      Ghostex was created as an open-source native workspace for running and reviewing
      multiple coding-agent CLIs. Rather than implementing its own coding model, it
      combines persistent terminals, graphical chat views, an embedded browser and
      editor, project organization, and remote-control clients.
    - >
      The project evolved rapidly into a cross-platform client/server architecture.
      Official 2026 releases added standardized per-platform data locations, expanded
      Linux and Windows packaging, mobile control, remote machines, cross-agent
      orchestration, and a Beads-backed project board.
  related-projects:
    - >
      Ghostex integrates with agent CLIs including Claude Code, Codex, OpenCode, Gemini
      CLI, Cursor Agent, and Copilot CLI.
    - >
      Its interface and runtime build on Ghostty, Zed's GPUI, Chromium Embedded
      Framework, VS Code or code-server, Beads, and mobile terminal components.
  sources:
    - https://ghostex.dev/
    - https://github.com/maddada/Ghostex
    - https://github.com/maddada/Ghostex/releases
  summary:
    - >
      Ghostex is an open-source, cross-platform workspace for running, monitoring,
      reviewing, and remotely controlling multiple CLI coding-agent sessions.
  timeline:
    - '2020s: Ghostex began as a native desktop manager for persistent coding-agent sessions.'
    - >
      2026: The project expanded packaging and runtime support across macOS, Linux,
      Windows/WSL2, and mobile clients.
    - >
      2026: Version 7.1 moved settings, application data, caches, logs, and runtime
      files to standard operating-system locations.
    - >
      2026: Later releases expanded onboarding, remote workflows, project boards,
      embedded documentation, and cross-agent orchestration.
  usage:
    - >
      Developers open projects and run several agent CLIs side by side, inspect diffs or
      web output in embedded panes, send follow-up prompts, manage worktrees and task
      boards, resume persistent sessions, and monitor or steer work from another
      computer or mobile device.
