history:
  adoption-history:
    - >
      BitMuse is positioned for Mac listeners with substantial local or NAS-hosted
      libraries, particularly those using external DACs and lossless or high-resolution
      formats. The official site says ordinary use includes libraries containing tens of
      thousands of tracks and reports testing its database with one million tracks.
  package-nerd-significance:
    - >
      BitMuse represents the specialist end of macOS audio packaging: a native
      local-library player centered on observable signal paths, exclusive and integer
      output, DSD handling, DSP bypass, and DAC behavior rather than streaming-service
      integration.
    - >
      The official site explicitly documents Homebrew Cask installation, giving
      audiophile Mac setups a repeatable command-line installation path.
  project-history:
    - >
      BitMuse was created by an independent developer identified as Serhii after he
      found existing players insufficiently native, fast, or suited to a long-maintained
      music collection. The official 2026 release history shows rapid development of
      library management, network-drive scanning, audio analysis, DSP, output-mode
      reporting, and remote control.
  related-projects:
    - >
      The official comparison material places BitMuse alongside Audirvāna, Roon,
      Swinsian, HQPlayer, JRiver, VOX, and foobar2000.
    - >
      MusicBrainz is used as an artwork source, while Last.fm scrobbling is supported as
      an optional listening-history integration.
  sources:
    - >
      https://bitmuse.app/ — official origin statement, product design, supported
      formats, installation command, and usage model.
    - https://bitmuse.app/changelog — official dated release history.
    - https://bitmuse.app/guides — official operational and audio-format guides.
    - >
      https://github.com/alternativshik/bitmuse — repository linked by the official site
      for issue reporting.
  summary:
    - >
      BitMuse is a native Apple-silicon music player for local and NAS libraries. It
      emphasizes bit-perfect playback, transparent signal-path reporting,
      high-resolution and DSD formats, library analysis, configurable DSP, and direct
      control of compatible DACs.
  timeline:
    - '2026: Public release history documents the BitMuse 1.x series.'
    - >
      2026-08: Releases improved external-drive and NAS scanning, library safety, DSP
      controls, and gapless playback.
    - >
      2026-09: Releases added redesigned audio analysis, broader format handling, and
      expanded remote control.
  usage:
    - >
      Users add existing music folders without relocating their files, then browse them
      by artist, album, playlist, or original folder tree. Supported material includes
      common lossless and lossy formats, cue sheets, and DSD files.
    - >
      For an untouched path, users select a compatible output device, enable exclusive
      or integer output where available, and bypass processing; the Signal Path view
      reports what reaches the DAC. Optional DSP includes headphone correction, graphic
      and parametric equalization, room correction, crossfeed, ReplayGain, and other
      effects.
