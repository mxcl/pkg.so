history:
  package-nerd-significance:
    - >
      Its package significance is modest but real: Vilistextum is one of the tiny,
      stable, old-school text-conversion utilities that remain useful in scripts, mail
      readers, and archival workflows because they do one narrow job without a browser
      runtime.
  project-history:
    - >
      The upstream homepage identifies release 2.6.9 as dated October 22, 2006 and
      describes Vilistextum as GPLv2 free software. The tool predates today's
      browser-based HTML-to-text converters and sits in the older Unix tradition of
      command filters that read from files or standard input and write transformed text
      to files or standard output.
  sources:
    - https://bhaak.net/vilistextum/htmlmail.html
    - https://bhaak.net/vilistextum/index.html
    - https://bhaak.net/vilistextum/manual.html
    - https://directory.fsf.org/wiki/Vilistextum
  summary:
    - >
      Vilistextum is a small command-line converter from HTML to plain ASCII/text,
      written by Patric Mueller. Its niche is fault-tolerant conversion of imperfect or
      quirky HTML into readable terminal, mail, or ebook-oriented text.
  timeline:
    - '2006-10-22: Upstream release 2.6.9 is published.'
    - >
      2006-era documentation: The project documents HTML mail conversion workflows for
      gnus and mutt and manual options for link footnotes, line shrinking, character
      conversion, PDA-oriented output, and UTF-8 output when built with multibyte
      support.
  usage:
    - >
      Vilistextum is used to strip HTML into readable text while preserving useful
      structure such as link footnotes, image alt text, selected character/entity
      conversions, line wrapping, and multibyte character handling. The manual
      explicitly compares link-footnote output to `lynx -dump`, and the upstream site
      includes instructions for using it to read HTML mail in gnus or mutt.
