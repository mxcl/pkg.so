id: brew:git-workspace
display-name: git-workspace
repo: null
docs:
  - https://github.com/orf/git-workspace#readme
config-file-location:
  unix:
    - $GIT_WORKSPACE/workspace*.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      git-workspace is distributed through Homebrew, Nix, AUR, GitHub release binaries,
      and Cargo. That packaging spread reflects its audience: developers with many
      personal and work repositories who want one local workspace layout across
      providers.
  package-nerd-significance:
    - >
      The tool is significant in the Git-extension ecosystem because it treats
      repository layout itself as state to reconcile. It sits between a simple clone
      script and a full developer-environment manager.
  project-history:
    - >
      Tom Forbes created the git-workspace repository in July 2019. The README presents
      the tool as a response to the repeated work of browsing a provider, copying clone
      URLs, and choosing local paths for many repositories.
    - >
      The project matured from a personal Rust utility into a cross-platform
      repository-fleet tool. Its releases added packaged binaries across operating
      systems, while the README documents provider configuration, archiving, fetching,
      listing, and shell integration.
  related-projects:
    - GitHub GraphQL API, GitLab API, Gitea, fzf, Homebrew, Nix, AUR
  sources:
    - https://crates.io/crates/git-workspace
    - https://formulae.brew.sh/formula/git-workspace
    - https://github.com/orf/git-workspace
    - https://github.com/orf/git-workspace/releases
    - https://raw.githubusercontent.com/orf/git-workspace/master/README.md
  summary:
    - >
      git-workspace is a Rust Git extension for syncing a local projects directory with
      repositories from GitHub, GitLab.com, self-hosted GitLab, self-hosted GitHub, and
      Gitea.
  timeline:
    - '2019: Repository created.'
    - '2022: v1.0.0 release provided packaged binaries.'
    - '2024: v1.5.0 release continued the cross-platform release line.'
  usage:
    - >
      Practitioners set GIT_WORKSPACE to the managed directory, add providers with git
      workspace add, store provider rules in workspace*.toml files, and export GitHub or
      GitLab tokens for API access. Daily use centers on update, fetch, list, archive,
      run, and switch-and-pull.
related-packages:
  - id: brew:ghorg
    reason: >
      Choose ghorg when the main task is rapidly cloning or backing up an entire user or
      organization across GitHub, GitLab, Bitbucket, Gitea, or SourceHut rather than
      continuously reconciling a rule-based workspace.
    rel: alternative
    sources:
      - https://github.com/orf/git-workspace
      - https://github.com/gabrie30/ghorg
  - id: brew:ghq
    reason: >
      Choose ghq when you primarily want individually fetched repositories organized
      into predictable host-and-path directories with strong shell and fuzzy-finder
      workflows, rather than provider-wide synchronization.
    rel: alternative
    sources:
      - https://github.com/orf/git-workspace
      - https://github.com/x-motemen/ghq
