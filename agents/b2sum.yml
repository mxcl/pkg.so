id: brew:b2sum
display-name: b2sum
repo: null
docs:
  - https://github.com/BLAKE2/BLAKE2#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      `b2sum` adoption is tied to users who want a standalone BLAKE2 checksum utility
      from the reference implementation. The input package facts list Homebrew, Nix, and
      Scoop packages, which is typical for small cryptographic command-line utilities
      that package managers make easy to install across platforms.
    - >
      The broader BLAKE2 family became notable because it offered high performance while
      retaining cryptographic-hash use cases. For CLI users, `b2sum` is the simple
      artifact: install a tiny package, hash files, and compare output in scripts.
  package-nerd-significance:
    - >
      For package nerds, `b2sum` is the satisfying opposite of a cloud CLI: tiny,
      C-based, stateless, and useful anywhere checksums are useful. Its main packaging
      questions are license expression, CPU-optimized source selection, and making the
      reference utility available without pulling a larger suite.
    - >
      It also shows how package names can be misleading beside cloud tooling:
      `brew:b2sum` is BLAKE2 checksum software, not related to Backblaze B2.
  project-history:
    - >
      BLAKE2 is a cryptographic hash function family derived from the BLAKE SHA-3
      finalist lineage. The official BLAKE2 repository packages portable C
      implementations, optimized implementations for several CPU families, benchmark
      code, and the `b2sum` command-line utility.
    - >
      The `b2sum` source file carries a 2012 copyright notice for the BLAKE2 reference
      source package, and the BLAKE2 specification was later published as RFC 7693 in
      2015. The repository's sparse tag history reflects a small reference-code package
      rather than a continuously shipped application.
  related-projects:
    - BLAKE2b and BLAKE2s are the main BLAKE2 hash variants in the reference package.
    - BLAKE was the SHA-3 competition finalist lineage from which BLAKE2 descends.
    - >
      `sha256sum` and other coreutils-style checksum tools are the closest command-line
      analogs.
  sources:
    - BLAKE2 official website
    - BLAKE2/BLAKE2 README and b2sum source
    - RFC 7693
    - source_facts.package-manager
  summary:
    - >
      `b2sum` is the command-line checksum utility shipped with the BLAKE2 reference
      source package. It hashes files with BLAKE2 implementations and occupies the same
      command-line niche as tools such as `sha256sum`, but for BLAKE2.
  timeline:
    - '2012: The BLAKE2 reference package includes the `b2sum` tool source.'
    - '2015: RFC 7693 publishes the BLAKE2 cryptographic hash specification.'
    - '2016: The BLAKE2 repository has a public `20160619` tag.'
    - '2019: The BLAKE2 repository has a public `20190724` tag.'
  usage:
    - >
      `b2sum` reads files and emits BLAKE2 digests for verification or scripting. The
      source notes compatibility concerns with coreutils-style checksum behavior, which
      explains the familiar package-manager naming and command-line shape.
    - >
      There is no project-level configuration file or credentials file; `b2sum` is a
      stateless local hashing utility.
related-packages:
  - id: brew:b3sum
    reason: >
      Choose b3sum when you want the BLAKE2 project's recommended faster successor and a
      multithreaded checksum CLI rather than the BLAKE2 reference utility.
    rel: alternative
    sources:
      - https://www.blake2.net/
      - https://github.com/BLAKE3-team/BLAKE3#the-b3sum-utility
  - id: brew:coreutils
    reason: >
      Choose GNU Coreutils when you want b2sum as part of a broad, consistently packaged
      suite of GNU checksum and file utilities rather than as a standalone reference
      binary.
    rel: alternative
    sources:
      - https://www.gnu.org/software/coreutils/
      - https://www.gnu.org/software/coreutils/manual/coreutils.html
