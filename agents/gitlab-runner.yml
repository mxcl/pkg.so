history:
  adoption-history:
    - >
      GitLab Runner became significant because GitLab supports both hosted and
      self-managed runner models. Organizations can use GitLab-hosted runners for
      managed capacity or install self-managed runners on their own machines,
      containers, virtual machines, or Kubernetes clusters.
    - >
      Its ecosystem reach is visible in packaging and deployment channels: GitLab
      documents installation across operating systems, the project publishes helper
      images, and package managers such as Homebrew distribute the runner for local and
      service-based setups.
  package-nerd-significance:
    - >
      For package-minded users, GitLab Runner is a rare CI component that is both a
      service daemon and a developer workstation tool. The Homebrew formula and other
      package-manager entries matter because local runners are useful for testing CI
      behavior, while production installations often run as long-lived services.
  project-history:
    - >
      The runner project began in the GitLab CI era under the name GitLab CI Multi
      Runner. The repository README records the older name and credits Kamil Trzcinski
      for the 2014-2015 authorship period before GitLab Inc. and contributors took over
      maintenance.
    - >
      Early public tags in the GitLab Runner repository date to January 2015. The
      project evolved from a CI worker into a cross-platform runner manager written in
      Go, distributed as a single binary, and paired with GitLab's major/minor release
      rhythm for compatibility.
  related-projects:
    - >
      GitLab CI/CD provides the pipeline coordinator and .gitlab-ci.yml configuration
      consumed by runners.
    - >
      GitLab Release CLI and other CI helper tools rely on runner-provided job context
      when used inside pipelines.
  sources:
    - https://docs.gitlab.com/runner/
    - https://docs.gitlab.com/runner/configuration/advanced-configuration/
    - https://formulae.brew.sh/formula/gitlab-runner
    - https://gitlab.com/api/v4/projects/gitlab-org%2Fgitlab-runner
    - https://gitlab.com/gitlab-org/gitlab-runner
    - https://gitlab.com/gitlab-org/gitlab-runner/-/raw/main/README.md
    - https://gitlab.com/gitlab-org/gitlab-runner/-/raw/main/docs/_index.md
  summary:
    - >
      GitLab Runner is the open-source agent that executes GitLab CI/CD jobs and reports
      their results back to GitLab. It is a core piece of GitLab's automation model
      because pipelines defined in .gitlab-ci.yml need one or more runners to perform
      the actual work.
  timeline:
    - >
      2014-2015: Kamil Trzcinski authored the runner project during its GitLab CI Multi
      Runner period.
    - '2015: Early v0.1.x tags appeared in the repository.'
    - '2015 onward: GitLab Inc. and contributors maintained the project as GitLab Runner.'
    - >
      2026: The v19 release line reflected GitLab Runner's continued alignment with
      GitLab release numbering.
  usage:
    - >
      Practitioners register runner instances with a GitLab project, group, or instance,
      choose an executor such as shell, Docker, SSH, Kubernetes, or autoscaling modes,
      and tune config.toml for job limits, caching, network settings, and
      executor-specific behavior.
    - >
      Administrators treat the runner as infrastructure: they size worker capacity,
      isolate sensitive workloads, attach tags to route jobs, monitor logs and metrics,
      and keep runner versions aligned with GitLab releases so pipeline features behave
      as expected.
related-packages:
  - id: brew:glab
    reason: >
      GLab can run inside GitLab Runner jobs to manage GitLab resources, and GitLab's
      documented release workflow uses it from `.gitlab-ci.yml` jobs.
    rel: adjacent_workflow
    sources:
      - https://docs.gitlab.com/runner/
      - https://docs.gitlab.com/user/project/releases/release_cli/
      - https://docs.gitlab.com/cli/
