id: cask:perforce
display-name: Perforce Helix Core Server
repo: null
docs:
  - https://help.perforce.com/helix-core
config-file-location: null
credentials-file-location:
  unix:
    - ~/.p4tickets
  windows:
    - '%USERPROFILE%\p4tickets.txt'
history:
  adoption-history:
    - >
      Perforce positions P4 as especially common in game development and large
      digital-content production, citing adoption by 19 of the top 20 AAA game studios.
  package-nerd-significance:
    - >
      P4 matters in package collections because it is a long-lived proprietary SCM
      system with Unix-friendly server binaries, environment-variable-driven clients,
      and a distinct operational model from Git-centered tooling.
  project-history:
    - >
      Perforce's current product page identifies P4 as the renamed Helix Core product
      and presents it as the server foundation for the broader P4 platform.
  related-projects:
    - >
      P4V, P4 Proxy, P4 Broker, P4 DAM, and P4 Plan are related Perforce tools around
      the same version-control platform.
  sources:
    - >
      https://help.perforce.com/helix-core/server-apps/cmdref/current/content/CmdRef/P4TICKETS.html
    - https://www.perforce.com/blog/vcs/introducing-the-p4-platform
    - https://www.perforce.com/products/helix-core
    - https://www.perforce.com/release-notes/helix-core
  summary:
    - >
      Perforce P4 is Perforce's centralized version-control platform, formerly branded
      Helix Core, aimed at teams that need scalable source and digital-asset management.
  timeline:
    - '1997: Perforce release notes track changes from Release 97.3 onward.'
    - '2025: Perforce announced Helix Core was rebranded as P4.'
  usage:
    - >
      Package-manager users install server-side components such as p4d, p4p, and
      p4broker, then administer repositories through Perforce's command-line and server
      documentation.
tags:
  - cli
  - helix-core
  - perforce
  - scm
  - server
  - version-control
provenance:
  category-sources:
    - source_facts.description says version control
  display-name-sources:
    - source_facts.source-archive path identifies Helix Core Server
  docs-sources:
    - 'Official Perforce Helix Core documentation: https://help.perforce.com/helix-core/'
  history-sources:
    - >
      https://help.perforce.com/helix-core/server-apps/cmdref/current/content/CmdRef/P4TICKETS.html
    - https://www.perforce.com/blog/vcs/introducing-the-p4-platform
    - https://www.perforce.com/products/helix-core
    - https://www.perforce.com/release-notes/helix-core
  repo-sources:
    - >
      Perforce distributes P4 as a proprietary product; no official public
      source-control project repository is identified by its product or documentation
      pages.
  tags-sources:
    - source_facts.description and executables p4d, p4broker, p4p
category-confidence: high
category-path:
  - developer-tools
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: high
tags-confidence: high
