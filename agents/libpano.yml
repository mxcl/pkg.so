history:
  adoption-history:
    - >
      libpano13 is most visible through Hugin and other panorama front ends, but it
      remains valuable as a scriptable command-line stack. Hugin documentation explains
      that PanoTools project files remain useful with Hugin, PTGui, PTAssembler, and
      related tools, and that command-line scripting helps automate repeated panorama
      work.
  package-nerd-significance:
    - >
      libpano13 is package-nerd catnip because it is the quiet geometry engine under a
      familiar GUI application. It carries old-school Unix virtues into photography:
      text project files, small tools, repeatable batch processing, and a library ABI
      that Hugin and other front ends depend on.
  project-history:
    - >
      Panorama Tools originated with Helmut Dersch's work at the University of Applied
      Sciences Furtwangen. The libpano13 README still identifies the library as part of
      Dersch's Panorama Tools and lists command-line tools such as PToptimizer and
      PTmender.
    - >
      Community development continued on SourceForge, where the project describes
      libpano13 as the cross-platform library behind the Hugin photo stitcher.
      Development moved from Subversion to Mercurial in February 2011, and SourceForge
      repository paths changed again in May 2013.
  related-projects:
    - Hugin is the main graphical panorama stitcher associated with libpano13.
    - PTGui, PTAssembler, and related tools use PanoTools-style project files and workflows.
    - >
      Panotools::Script, GIMP plugin, Photoshop filters, and MPRemap are sibling
      projects in the Panorama Tools SourceForge area.
  sources:
    - https://hugin.sourceforge.io/docs/manual/Panorama_scripting_in_a_nutshell.html
    - https://panotools.sourceforge.net/
    - https://sourceforge.net/p/panotools/libpano13/ci/default/tree/
    - https://sourceforge.net/projects/panotools/files/libpano13/libpano13-2.9.22/
    - https://wiki.panotools.org/Development_of_Open_Source_tools
  summary:
    - >
      libpano13 is the Panorama Tools library for panoramic imaging: the C library and
      command-line tool set behind workflows that remap, optimize, blend, crop, and
      assemble overlapping photographs into panoramas.
  timeline:
    - >
      2009: libpano13 2.9.14 added projections, a command-line tool, documentation,
      cleanups, and fixes.
    - '2010: libpano13 2.9.17 added a projection, mosaic mode, cleanups, and fixes.'
    - '2011: libpano13 development moved from Subversion to Mercurial.'
    - '2011: libpano13 2.9.18 added the Thoby projection and was needed for Hugin 2011.0.0.'
    - >
      2023: libpano13 2.9.22 removed or stubbed insecure command-tool data-handling
      paths while keeping ABI compatibility.
  usage:
    - >
      A typical libpano13 command-line workflow uses PTmender to map images, PTblender
      or PTmasker for color and mask work, PTroller to merge TIFFs, PTcrop or PTuncrop
      for canvas adjustment, and panoinfo or PTinfo for inspection. That makes the
      package useful both as a library dependency and as a toolbox for batch panorama
      processing.
