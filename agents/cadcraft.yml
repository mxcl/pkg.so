history:
  adoption-history:
    - >
      CADCraft is published for macOS, Windows, Linux, FreeBSD, and the browser, with
      both desktop and command-line builds. Its official README describes the project as
      being in early, rapid development rather than claiming mature AutoCAD
      compatibility.
  package-nerd-significance:
    - >
      CADCraft is unusual among desktop CAD packages for using a native pure-Rust and
      egui architecture rather than Electron or a browser shell. It also treats commands
      as a shared interface for people, scripts, a CLI, JSON control, and MCP-based
      agents, making packaging useful beyond the graphical application.
  project-history:
    - >
      CADCraft was created by the ArtCraft team as an open-source, clean-room
      reimplementation of an AutoCAD-style drafting workflow. The project aims to
      preserve familiar command-line drafting habits while rebuilding the application in
      Rust.
    - >
      The project developed support for DXF and DWG workflows, layers, dimensions,
      hatches, layouts, plotting, object snaps, and agent-accessible commands while
      documenting remaining compatibility gaps openly.
  related-projects:
    - >
      CADCraft is part of the ArtCraft team's Crafting Apps collection. Its official
      documentation also references acadrust for open-source DWG handling.
  sources:
    - https://github.com/storytold/cadcraft#readme
    - https://github.com/storytold/cadcraft/blob/main/ROADMAP.md
    - https://github.com/storytold/cadcraft/tree/main/docs
  summary:
    - >
      CADCraft is an open-source, native computer-aided design and drafting application
      that recreates an AutoCAD-style command and drawing workflow in Rust.
  timeline:
    - >
      2026: Official project documentation presents CADCraft as an early, fast-moving
      open-source CAD implementation with desktop, CLI, and WebAssembly builds.
  usage:
    - >
      Users create and edit technical drawings through familiar commands, snapping,
      layers, dimensions, layouts, and plotting tools; files can be exchanged through
      DXF and supported DWG workflows or exported to formats such as SVG, PNG, and PDF.
      Automation is available through `cadcraft-cli`, JSON commands, and MCP.
