id: brew:hexapoda
display-name: hexapoda
repo: null
docs:
  - https://simonomi.dev/hexapoda
  - https://simonomi.dev/hexapoda/config
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/hexapoda.toml
    - ~/.config/hexapoda.toml
  windows:
    - '%APPDATA%\hexapoda.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The install page recommends Homebrew and also documents Cargo, cargo-binstall, and
      manually downloaded release binaries. The Homebrew formula packages GitHub release
      archives, while the input package metadata records Homebrew as the package-manager
      entry for this batch.
  package-nerd-significance:
    - >
      hexapoda is a compact example of the newer Rust terminal-editor wave: modal
      editing ideas applied to binary data, shipped with a project website, generated
      schema-backed configuration, release binaries, and Homebrew/Cargo installation
      routes.
  project-history:
    - >
      The GitHub repository was created in March 2026 and describes hexapoda as a
      colorful modal hex editor. The README explains that the name comes from the
      Hexapoda subphylum and points to the website for fuller documentation.
  related-projects:
    - >
      hexapoda sits closer to interactive hex editors such as hexedit and hexcurse than
      to one-shot dumpers such as hexdump, xxd, hx, or hexd.
  sources:
    - https://api.github.com/repos/simonomi/hexapoda/releases
    - https://formulae.brew.sh/formula/hexapoda
    - https://github.com/simonomi/hexapoda
    - https://simonomi.dev/hexapoda
    - https://simonomi.dev/hexapoda/config
    - https://simonomi.dev/hexapoda/install
  summary:
    - >
      hexapoda is a colorful modal hex editor written in Rust and documented through its
      project website.
  timeline:
    - '2026-03: GitHub repository created.'
    - '2026-05: 0.2.x releases published on GitHub.'
    - '2026-06: v0.2.4 release published and packaged by Homebrew.'
  usage:
    - >
      hexapoda is a full-screen modal editor for binary files. Its documentation
      emphasizes color-coding bytes by value and a TOML config file that can remap modal
      commands, including movement, selection, repeat, goto, replace, and delete
      actions.
related-packages:
  - id: brew:hexedit
    reason: >
      Choose hexedit for a traditional non-modal terminal editor that can modify regular
      files or devices and offers familiar direct hex/ASCII editing.
    rel: alternative
    sources:
      - https://simonomi.dev/hexapoda/
      - https://rigaux.org/hexedit.html
  - id: brew:hexcurse
    reason: >
      Choose Hexcurse for a classic ncurses interface with EBCDIC mode, decimal
      addressing, and conventional shortcut-driven editing instead of selection-first
      modal commands.
    rel: alternative
    sources:
      - https://simonomi.dev/hexapoda/
      - https://github.com/LonnyGomes/hexcurse#readme
tags:
  - binary
  - cli
  - hex-editor
  - modal-editor
  - rust
