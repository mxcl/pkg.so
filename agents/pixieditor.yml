history:
  adoption-history:
    - >
      PixiEditor is available across desktop platforms and is distributed through native
      installers and package ecosystems, including Homebrew cask on macOS. Its public
      repository, issue tracker, contribution guide, and documentation support community
      development.
    - >
      The project migrated its early GitHub wiki documentation to its own documentation
      site by 2021. The documentation now covers user workflows, node graphs, brushes,
      layers, troubleshooting, extension-oriented concepts, compilation, and the
      codebase.
  package-nerd-significance:
    - >
      PixiEditor is notable among open-source graphics packages for combining pixel-art,
      painting, vector, and animation workflows in a single editor rather than
      specializing in only one medium.
    - >
      Its node-based renderer exposes document structure and effects as a graph,
      enabling procedural graphics and animation. That makes it interesting to users who
      want an approachable graphics editor with concepts usually associated with
      compositing or game-content pipelines.
  project-history:
    - >
      PixiEditor began as an open-source 2D graphics editor and expanded from
      pixel-oriented editing into a broader universal editor. Its current architecture
      combines raster, vector, animation, and procedural node workflows.
    - >
      The 2.x generation introduced three interoperable toolsets—pixel art, painting,
      and vector—alongside a timeline, node-based rendering, and broader export support.
      The 2.1 series expanded the brush engine, smart layers, extension browsing,
      stabilizers, animation workflow, and renderer.
  related-projects:
    - PixiEditor documentation repository
    - PixiEditor Extensions
    - Drawie
    - PixiDocks
    - PixiEditor ColorPicker
  sources:
    - 'Official documentation: https://pixieditor.net/docs/'
    - 'Official organization repositories: https://github.com/PixiEditor'
    - 'Official releases: https://github.com/PixiEditor/PixiEditor/releases'
    - 'Official repository and README: https://github.com/PixiEditor/PixiEditor'
  summary:
    - >
      PixiEditor is an open-source, cross-platform 2D graphics editor combining pixel
      art, painting, vectors, animation, and procedural node graphs.
  timeline:
    - '2021: The official GitHub wiki announced that documentation had moved to pixieditor.net.'
    - >
      2023: The public 1.1 roadmap tracked localization, palette support, file
      association, and workflow improvements.
    - >
      2026: The 2.1 release series added a configurable brush engine, smart layers, an
      extension browser, stabilizers, and a revised renderer.
  usage:
    - >
      Artists can create sprites, illustrations, logos, edited images, vectors, and
      frame-based or procedural animations. Pixel-art, painting, and vector toolsets can
      be mixed on the same canvas, with export to common image, vector, animation, and
      video formats.
    - >
      Advanced users can manipulate the document's node graph, build procedural effects
      and animations, create custom brushes and toolsets, and contribute to or compile
      the editor from source.
