history:
  adoption-history:
    - >
      KtoBLZCheck's adoption is strongest in accounting, finance, and personal-finance
      software stacks that need offline validation of German account identifiers. Its
      packaging across Homebrew, MacPorts, Linux distributions, and SourceForge tarballs
      reflects a stable library dependency rather than a fashionable end-user CLI.
    - >
      The project also exposed web checkers for bank accounts and IBANs, and the
      documentation names related bindings and implementations such as rbktoblzcheck and
      konto_check.
  package-nerd-significance:
    - >
      KtoBLZCheck is package-nerd interesting because it is code plus regulated
      reference data. Releases are not just API changes; they also track bank-data
      validity periods, Bundesbank source-file changes, and build-system support for
      downstream distributors.
  project-history:
    - >
      The SourceForge project was registered on 2002-08-17, making it a long-running
      finance-oriented open source library from the SourceForge era. The project page
      describes it as based on Deutsche Bundesbank specifications for German bank codes.
    - >
      The Doxygen documentation identifies Fabian Kaiser as the original author, with
      Christian Stimming and Alexander Kurz listed as maintainers. Over time the package
      grew beyond a single checker into a library, CLI tools, IBAN checking, Python
      bindings, CMake build support, and conversion of Bundesbank bank-data files into
      ktoblzcheck's compact runtime format.
  related-projects:
    - >
      KtoBLZCheck is tied to Deutsche Bundesbank bank-code data, IBAN validation,
      KMyMoney-style personal finance applications, rbktoblzcheck, and konto_check.
  sources:
    - https://ktoblzcheck.sourceforge.net/
    - https://ktoblzcheck.sourceforge.net/html/index.html
    - https://sourceforge.net/p/ktoblzcheck/code/feed.atom
    - https://sourceforge.net/projects/ktoblzcheck/
    - https://sourceforge.net/projects/ktoblzcheck/rss?path=/ktoblzcheck
  summary:
    - >
      KtoBLZCheck is a C/C++ library and set of command-line tools for checking German
      and other bank account numbers, bank codes, and IBANs. Its documentation explains
      the name as a combination of Konto, the German abbreviation for account number,
      and BLZ, the German bank-code abbreviation.
  timeline:
    - '2002-08-17: KtoBLZCheck registered on SourceForge.'
    - >
      2007-11-07: ktoblzcheck 1.16 release appeared in the SourceForge file feed and
      introduced the documented multiple-validity-period bank-data behavior.
    - >
      2017-03-02: SourceForge file listing identified ktoblzcheck-1.49.tar.gz as the
      download-page version.
    - '2025-05-20: SourceForge code feed recorded the commit titled Release version 1.59.'
  usage:
    - >
      The package provides the `ktoblzcheck`, `ibanchk`, and `ktoblzupdate` executables.
      The documented CLI checks a bank-code/account-number pair, can emit single-line
      tab-delimited output for batch processing, and uses bank-data files derived from
      Deutsche Bundesbank BLZ data.
