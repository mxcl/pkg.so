history:
  adoption-history:
    - >
      Integrity is distributed as a native macOS application. Its free edition serves
      users needing straightforward link checking, while PeacockMedia positions
      Integrity Plus, Integrity Pro, and Scrutiny as progressively more capable related
      products.
  package-nerd-significance:
    - >
      Integrity is notable to macOS package users as a native graphical website crawler
      with a free entry-level edition, complementing command-line link checkers and
      broader cross-platform web-auditing suites.
  project-history:
    - >
      PeacockMedia developed Integrity as a native macOS website link checker. The
      product subsequently became the entry-level member of a family that includes
      Integrity Plus, Integrity Pro, and Scrutiny.
  related-projects:
    - >
      Integrity Plus and Integrity Pro add capabilities such as exporting, multiple-site
      management, sitemap generation, and SEO checks; Scrutiny is PeacockMedia’s broader
      website-auditing application.
  sources:
    - https://peacockmedia.software/mac/integrity/
    - https://peacockmedia.software/mac/integrity/free.html
    - https://peacockmedia.software/mac/integrity/manual/v12/index.html
  summary:
    - >
      Integrity is PeacockMedia’s free native macOS application for crawling websites,
      identifying broken or redirected links, and inspecting crawl results.
  timeline:
    - >
      Integrity became the free entry-level application in PeacockMedia’s
      Integrity/Scrutiny website-auditing family.
    - 'Version 12: PeacockMedia publishes the current official manual series for Integrity.'
  usage:
    - >
      Users enter a starting URL and run a crawl. Integrity follows internal links,
      checks internal and external targets, and highlights errors and warnings such as
      failed responses and redirects. Preferences control crawl limits, concurrency,
      user-agent behavior, and link-handling rules.
