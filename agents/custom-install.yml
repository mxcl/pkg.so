history:
  adoption-history:
    - >
      The project sits in the homebrew utility niche rather than the general gaming-tool
      mainstream. Its adoption is driven by users who already understand 3DS SD-card
      workflows, CIA files, and companion tools such as SeedDB, save3ds, and the
      finalize release.
  package-nerd-significance:
    - >
      For package maintainers, custom-install is notable because it packages a
      console-homebrew workflow as a host-side CLI. It has unusual runtime expectations
      for a normal Unix package, including user-supplied console keys, SD-card access,
      and a companion finalizer used on the 3DS itself.
  project-history:
    - >
      The public repository was created in September 2019, shortly after the README's
      stated June 2019 origin. The tool grew around a practical workflow: provide
      3DS-specific files such as boot9.bin and movable.sed, run the installer against
      CIA files and an SD root, then finish the install on the console with
      custom-install-finalize.
  related-projects:
    - >
      The README credits pyctr from ninfs, uses save3ds for Title Database interaction,
      and points users to custom-install-finalize releases.
  sources:
    - https://raw.githubusercontent.com/ihaveamac/custom-install/master/README.md
    - https://api.github.com/repos/ihaveamac/custom-install
    - https://api.github.com/repos/ihaveamac/custom-install/tags?per_page=20
  summary:
    - >
      custom-install is a focused Nintendo 3DS utility for installing CIA files directly
      to an SD card. Its README describes it as an experimental script that automates a
      manual title-install process and says it was originally created in late June 2019.
  timeline:
    - '2019: Originally created in late June, according to the README.'
    - '2019: Public GitHub repository created in September.'
    - '2019: 2.0 tag appears in the upstream tag history.'
    - '2026: Repository still showed upstream activity.'
  usage:
    - >
      Users run the command with explicit paths for boot9, movable.sed, an SD-card root,
      and one or more CIA files. The README documents platform-specific search paths for
      boot9.bin and seeddb.bin, but it does not define a persistent application
      configuration file.
