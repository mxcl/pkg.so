credentials-file-location: null
history:
  adoption-history:
    - >
      dep-tree is distributed through Homebrew on macOS and Linux, plus pip and npm for
      broader platform access. That multi-channel packaging fits the tool's audience:
      teams may want the same architecture check available in local shells, Python-heavy
      repos, JavaScript-heavy repos, and CI.
    - >
      The GitHub release feed shows active 0.23.x releases through March 2025, and the
      README links generated graphs for well-known projects across TypeScript, Python,
      Rust, and Go.
  package-nerd-significance:
    - >
      dep-tree is notable because it packages architecture boundaries as a small CLI
      instead of a platform-specific IDE feature. That makes dependency hygiene
      scriptable in package test phases and CI jobs.
    - >
      It also shows a modern packaging pattern: one upstream tool ships through brew,
      pip, and npm so different ecosystems can install the same executable in the way
      their automation already understands.
  project-history:
    - >
      The official repository was created in December 2022. Its README presents dep-tree
      as a tool for visualizing codebase entropy and keeping modules decoupled by
      analyzing local file imports from one or more entrypoints.
    - >
      The project grew around a few focused commands: entropy for browser-based 3D
      graphs, tree for terminal exploration, explain for showing dependencies between
      glob-selected areas, and check for enforcing allow or deny rules.
  related-projects:
    - >
      Graph visualization tools and force-directed layouts are related to dep-tree's
      entropy view.
    - Import linters and architecture-test tools are related to dep-tree check.
    - >
      Language parsers for JavaScript, TypeScript, Python, Rust, and Go are part of the
      supported-language story documented by the README.
  sources:
    - https://github.com/gabotechs/dep-tree
    - https://github.com/gabotechs/dep-tree#readme
    - https://api.github.com/repos/gabotechs/dep-tree
    - https://api.github.com/repos/gabotechs/dep-tree/releases
  summary:
    - >
      dep-tree is a CLI for visualizing file dependency graphs and enforcing dependency
      rules. It renders codebase structure as a tree or 3D force-directed graph and can
      fail CI when imports violate rules in .dep-tree.yml.
  timeline:
    - '2022: The gabotechs/dep-tree repository is created on GitHub.'
    - '2024: dep-tree v0.23.0 is released.'
    - '2025: dep-tree v0.23.4 is released.'
  usage:
    - >
      Users point dep-tree at one or more entry files to build a local dependency graph.
      dep-tree entropy opens a browser visualization, dep-tree tree shows a navigable
      terminal tree, and dep-tree explain reports whether files matching one glob depend
      on files matching another.
    - >
      For CI, dep-tree check reads .dep-tree.yml and verifies allow, deny, and
      circular-dependency rules. That makes it a lightweight architecture-linting tool
      rather than only a visualization toy.
