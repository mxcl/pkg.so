id: brew:mdv
display-name: mdv
repo: https://github.com/axiros/terminal_markdown_viewer
docs:
  - https://github.com/axiros/terminal_markdown_viewer#readme
config-file-location:
  unix:
    - ~/.mdv
    - ~/.mdv.py
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents `pip install mdv`, a MacPorts entry, and FreeBSD package
      availability. The input package-manager facts show Homebrew packaging for the same
      executable name.
    - >
      GitHub metadata showed sustained attention for a terminal Markdown renderer, with
      more than a thousand stars and over a hundred forks by 2026.
  package-nerd-significance:
    - >
      mdv matters in package-manager culture as one of the older terminal Markdown
      viewers that made README rendering, colored CLI docs, and remote-server Markdown
      inspection feasible without Node, Pandoc, or a browser.
    - >
      Its README's own alternatives section places it among JavaScript terminal
      renderers, Pandoc-to-browser or man-page pipelines, and vimcat, while arguing for
      a Python package that handles tables, admonitions, and themes in a terminal.
  project-history:
    - >
      The public GitHub repository was created on 2015-07-12. The README explains the
      motivation as avoiding browser context switches while editing Markdown remotely,
      especially in larger mkdocs projects or constrained hop-machine environments.
    - >
      The project began as a proof-of-concept hack, and the README is candid that
      complex Markdown and inline HTML are outside its strongest use cases. Over time it
      added themes, tables, admonitions, file and directory monitoring, source-code
      highlighting, library usage, and Python 3 support.
  related-projects:
    - >
      The README discusses msee, ansidown, ansimd, nd, Pandoc with terminal browsers or
      groff/man output, and vimcat as alternatives.
    - The README credits Pygments, tabulate, and Python Markdown as supporting projects.
  sources:
    - https://api.github.com/repos/axiros/terminal_markdown_viewer
    - https://github.com/axiros/terminal_markdown_viewer#readme
    - source_facts.homepage
    - source_facts.package-manager
  summary:
    - >
      mdv, from the terminal_markdown_viewer repository, is a Python styled Markdown
      viewer for terminals. It targets remote editing, browserless environments, CLI
      help output, and colored reading of Markdown in 256-color terminals.
  timeline:
    - '2015: Public GitHub repository created.'
    - >
      2016: README update noted pip installation, setup.py-based dependencies,
      light-theme work, stdin support, wrapping fixes, and test additions.
    - >
      2018: README update noted merged PRs, Python 3 support, header numbering, and
      simpler config handling.
    - '2023: README update noted release 1.7.5 and a mailto link fix.'
  usage:
    - >
      CLI users run `mdv [OPTIONS] MDFILE` to render Markdown with themes, link styles,
      source-code highlighting, width control, file monitoring, directory monitoring,
      and optional HTML output.
    - >
      The README also documents inline library use from Python, environment variables
      `MDV_THEME` and `MDV_CODE_THEME`, YAML CLI-argument defaults in `$HOME/.mdv`, and
      executable Python customization in `$HOME/.mdv.py`.
related-packages:
  - id: brew:mdcat
    reason: >
      Choose mdcat for a maintained Rust-based terminal renderer with modern CommonMark
      extensions, images, math, Mermaid diagrams, live preview, and a documented man
      page.
    rel: alternative
    sources:
      - https://github.com/axiros/terminal_markdown_viewer#readme
      - https://github.com/BIRSAx2/mdcat#readme
  - id: brew:glow
    reason: >
      Choose Glow when you prefer a terminal Markdown reader with an interactive TUI and
      pager-oriented browsing rather than mdv's Python renderer and file-monitoring
      workflow.
    rel: alternative
    sources:
      - https://github.com/axiros/terminal_markdown_viewer#readme
      - https://github.com/charmbracelet/glow#readme
tags:
