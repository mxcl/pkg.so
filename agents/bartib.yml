id: brew:bartib
display-name: Bartib
repo: null
docs:
  - https://github.com/nikolassv/bartib#readme
  - https://github.com/nikolassv/bartib/blob/master/doc/bartib-file-format.md
  - https://github.com/nikolassv/bartib/blob/master/doc/bartib.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Bartib spread through developer-oriented distribution channels: GitHub releases,
      cargo install from crates.io, Homebrew, Alpine testing packages, MacPorts, and
      Nix. Its adoption is modest but healthy for a focused terminal productivity tool.
  package-nerd-significance:
    - >
      Bartib is package-nerd significant as a modern Rust CLI that keeps state in
      transparent text instead of a service or database. It is easy to package, easy to
      audit, and useful as a small example of terminal-first personal productivity
      software.
  project-history:
    - >
      The upstream repository describes Bartib as an easy-to-use time tracking tool for
      the command line. GitHub metadata shows the repository was created in 2021, and
      the changelog records version 1.0.0 in November 2021 with the basic tracking,
      reporting, and listing features.
    - >
      Bartib's design has stayed intentionally file-centered. The documented file format
      is one activity per line with ISO-style local timestamps, project, and optional
      description fields, while the CLI can start, stop, continue, list, report, edit,
      and check activities.
  related-projects:
    - >
      Bartib is related to terminal time trackers such as timewarrior, watson, and
      ledger-style plaintext workflows, but its own format is simpler: start and stop
      timestamps, project, and description in a single editable text file.
  sources:
    - https://api.github.com/repos/nikolassv/bartib
    - https://github.com/nikolassv/bartib/blob/master/CHANGELOG.md
    - https://github.com/nikolassv/bartib/blob/master/README.md
    - https://github.com/nikolassv/bartib/blob/master/doc/bartib-file-format.md
    - source_facts.package-manager
  summary:
    - >
      Bartib is a Rust command-line time tracker that stores activities in a
      human-readable plaintext log and generates lists and reports from that file.
  timeline:
    - '2021-02-04: The GitHub repository is created.'
    - >
      2021-11-15: Bartib 1.0.0 is released with basic tracking, reporting, and listing
      features.
    - '2021-11-25: Bartib 1.0.1 adds weekly report arguments and documentation fixes.'
    - >
      2024-02-29: Bartib 1.1.0 adds changelog tracking, rounding, change, sanity checks,
      compact project listing, and CI updates.
  usage:
    - >
      A user records work with bartib start and bartib stop, reviews recent activity
      with list or report, and can point Bartib at a specific log file with --file or
      the BARTIB_FILE environment variable. Because the log is plaintext, manual edits
      and version-control-friendly workflows are practical.
related-packages:
  - id: brew:timewarrior
    reason: >
      Choose Timewarrior for richer tag-and-interval reporting, extensibility, and
      documented Taskwarrior integration; choose Bartib for a simpler
      project-and-description log stored in one editable plaintext file.
    rel: alternative
    sources:
      - https://github.com/nikolassv/bartib
      - https://timewarrior.net/docs/what/
      - https://timewarrior.net/docs/taskwarrior/
  - id: brew:watson
    reason: >
      Choose Watson when project-and-tag frames, JSON/CSV-style reporting workflows, or
      optional remote synchronization are more useful than Bartib's deliberately simple
      plaintext activity log.
    rel: alternative
    sources:
      - https://github.com/nikolassv/bartib
      - https://jazzband.github.io/Watson/
