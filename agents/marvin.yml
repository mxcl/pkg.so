config-file-location:
  macos:
    - ~/Library/Application Support/Marvin/window-state.json
    - ~/Library/Application Support/Marvin/topOfMind-state.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Amazing Marvin developed from a personal solution into a cross-platform
      subscription product for the web, macOS, Windows, Linux, iOS, and Android. Its
      audience increasingly includes users seeking customizable or ADHD-oriented
      productivity systems rather than a fixed task-management methodology.
    - >
      The product supports importing open tasks from many established task managers,
      including Todoist, TickTick, Things, OmniFocus, Asana, and Microsoft To Do.
      Ready-made workflows can also approximate several familiar applications.
  package-nerd-significance:
    - >
      Marvin stands out among task-manager packages because most of its behavior is
      assembled from optional strategies. Users can combine conventional lists and
      calendars with GTD, time blocking, Pomodoro timers, gamification, procrastination
      interventions, habits, and custom smart lists.
    - >
      The desktop application can retain task data locally with cloud synchronization
      disabled, and it exposes an API, webhooks, direct database access, a command-line
      interface, and a local API server for automation-minded users.
  project-history:
    - >
      Founder Christina created Marvin after existing task applications failed to
      address her own overwhelm and procrastination. That origin shaped a product based
      on selectable strategies rather than a single prescribed workflow.
    - >
      The application accumulated more than one hundred optional features across
      planning, focus, prioritization, time management, habits, and motivation. In
      September 2026 the team launched rebuilt iPhone and Android applications intended
      to bring more of the desktop and web feature set to mobile.
  related-projects:
    - >
      The official importer and workflow library provide explicit migration paths from
      Todoist and TickTick, among many other task managers.
    - >
      The public API can be inspected with tools such as Swagger UI or Postman, while
      Zapier and email integrations support no-code task creation.
  sources:
    - https://amazingmarvin.com/
    - https://help.amazingmarvin.com/
    - https://help.amazingmarvin.com/amazing-marvin/api-getting-started
    - https://help.amazingmarvin.com/amazing-marvin/import-your-tasks-from-another-app
    - https://help.amazingmarvin.com/amazing-marvin/welcome-to-the-new-marvin-mobile-app
  summary:
    - >
      Amazing Marvin is a deeply customizable personal task manager and day planner
      designed to help users organize work, choose what to do next, and address
      procrastination.
  timeline:
    - >
      The project began as founder Christina's personal response to task overload and
      procrastination.
    - >
      2026-09: Rebuilt iPhone and Android applications launched with a redesigned mobile
      workflow.
  usage:
    - >
      Users organize a Master List into categories, projects, and tasks, then schedule
      selected work into My Day. Optional strategies add calendars, smart lists, time
      blocking, timers, habits, rewards, focus modes, and procrastination aids as
      needed.
    - >
      Automation users can enable API credentials in the application's API feature
      settings; the official documentation does not identify a credentials file on disk.
related-packages:
  - id: cask:todoist-app
    reason: >
      Choose Todoist for a more streamlined task manager with extensive integrations and
      collaboration; Marvin officially imports Todoist data and offers a familiar-app
      workflow for switchers.
    rel: alternative
    sources:
      - https://help.amazingmarvin.com/amazing-marvin/import-your-tasks-from-another-app
      - https://help.amazingmarvin.com/amazing-marvin/find-a-workflow-that-fits-you
      - https://www.todoist.com/features
  - id: cask:ticktick
    reason: >
      Choose TickTick for an integrated task, calendar, habit, and Pomodoro experience
      with less setup; Marvin officially imports TickTick backups and can emulate a
      familiar TickTick-style workflow.
    rel: alternative
    sources:
      - https://help.amazingmarvin.com/amazing-marvin/import-your-tasks-from-another-app
      - https://help.amazingmarvin.com/amazing-marvin/find-a-workflow-that-fits-you
      - https://ticktick.com/features
