history:
  adoption-history:
    - >
      The official README documents Homebrew Cask as an installation route. The project
      targets macOS podcast listeners and proposes support for libraries stored on
      local, internal, or network-shared drives.
  package-nerd-significance:
    - >
      Doughnut is notable as a small native macOS application that replaced an earlier
      Electron implementation with Swift, explicitly citing Electron's memory use. It
      also illustrates Homebrew Cask's role in distributing independent desktop
      applications.
  project-history:
    - >
      Doughnut was created as a macOS podcast client whose three-column interface was
      inspired by Instacast for Mac after that application was discontinued in 2015. The
      project was initially built with Electron and was subsequently rewritten as a
      native Swift application.
  related-projects:
    - Instacast for Mac inspired Doughnut's interface.
    - Homebrew Cask provides the installation route documented by the project.
  sources:
    - 'Official project README: https://github.com/dyerc/Doughnut#readme'
  summary:
    - >
      Doughnut is an open-source native macOS podcast client written in Swift, with an
      interface inspired by the discontinued Instacast for Mac.
  timeline:
    - >
      2015: Instacast for Mac was discontinued, providing the stated inspiration for
      Doughnut's interface.
    - 'Later development: Doughnut moved from Electron to a native Swift implementation.'
  usage:
    - >
      Users install the application with `brew install --cask doughnut`, subscribe to
      and manage podcasts, favourite episodes, and can create entries for podcasts that
      no longer have a feed.
