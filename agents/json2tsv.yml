id: brew:json2tsv
display-name: json2tsv
repo: https://git.codemadness.org/json2tsv
docs:
  - https://codemadness.org/json2tsv.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool is packaged in Homebrew, Alpine Linux, MacPorts, and Nix, which suggests
      practical adoption among users who prefer small native filters over larger JSON
      query languages.
  package-nerd-significance:
    - >
      For package nerds, json2tsv is the opposite of a sprawling data platform: about a
      few hundred lines of C, C99 plus libc, and a format intended to compose with old
      Unix text tools.
  project-history:
    - >
      The project follows the codemadness style of compact Unix tools: a plain HTML
      manual page, a public git repository, and tarball releases with checksums. Its
      release index begins with version 0.1 on October 13, 2019 and reaches version 1.2
      on August 5, 2024.
  related-projects:
    - >
      json2tsv belongs with jq, gron, Miller, xsv, and other tools that turn structured
      data into streams that are easier to process with Unix pipelines.
  sources:
    - https://codemadness.org/json2tsv.html
    - https://codemadness.org/releases/json2tsv/
    - https://formulae.brew.sh/formula/json2tsv
    - https://git.codemadness.org/json2tsv
  summary:
    - >
      json2tsv is a small C command-line program from codemadness that converts JSON
      read from standard input into tab-separated, line-oriented output.
  timeline:
    - '2019-10-13: Version 0.1 tarball appeared in the official release directory.'
    - '2021-09-25: The project page recorded its last modification date.'
    - '2022-09-01: Version 1.0 tarball appeared.'
    - '2024-08-05: Version 1.2 tarball appeared.'
  usage:
    - >
      json2tsv reads JSON from stdin and prints rows containing a node name, a type
      byte, and a value. Its documentation emphasizes filtering the first field with
      existing Unix tools such as awk and grep.
related-packages:
  - id: brew:jq
    reason: >
      Choose jq when you want a self-contained filter and transformation language;
      choose json2tsv when you prefer converting nodes to TSV and composing them with
      awk or grep.
    rel: alternative
    sources:
      - https://codemadness.org/json2tsv.html
      - https://jqlang.org/
