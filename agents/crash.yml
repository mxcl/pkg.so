history:
  adoption-history:
    - >
      The project targeted embeddable and deployable JVM environments rather than only a
      local terminal binary. Its official build outputs show distribution formats for
      standalone Java execution and web/container deployment.
  package-nerd-significance:
    - >
      For package managers, CRaSH is notable as a JVM-era shell distributed from a Maven
      project but exposed by Homebrew as a command. Its package shape is less a single
      native binary and more a Java distribution with multiple runtime forms.
  project-history:
    - >
      The crashub/crash repository was created in 2011. Its README presents CRaSH as a
      Java-platform shell and documents Maven-based builds that produce standalone jars,
      web application archives, Spring and Mule distributions, and documentation
      archives.
  related-projects:
    - >
      The README links the project website, JIRA, documentation site, and historical CI
      service as part of the CRaSH project infrastructure.
  sources:
    - https://github.com/crashub/crash
    - https://github.com/crashub/crash#readme
    - https://github.com/crashub/crash/tags
    - https://github.com/crashub/crash/commit/a9cf0b6e0cba92081226d3149be4bf034f875044
    - https://github.com/crashub/crash/commit/23ae95e7aabfbef061a375082d7b3ffd2e67a37d
  summary:
    - >
      CRaSH, the Common Reusable SHell, is a shell for extending Java programs and the
      Java Virtual Machine. Homebrew packages it as the crash command-line tool.
  timeline:
    - '2011: crashub/crash repository created.'
    - '2011: 1.0.0-beta2 release-preparation commit present in the official repository.'
    - '2015: 1.3.2 release-preparation commit present in the official repository.'
  usage:
    - >
      CRaSH is used when a Java application or JVM needs an extensible shell surface.
      The README emphasizes building the source with Maven and producing archives
      suitable for direct use or application-server packaging.
