id: brew:libvirt
display-name: libvirt
repo: https://gitlab.com/libvirt/libvirt
docs:
  - https://libvirt.org/docs
config-file-location:
  unix:
    - /etc/libvirt/libvirtd.conf
    - /etc/libvirt/libvirt.conf
    - $XDG_CONFIG_HOME/libvirt/libvirt.conf
credentials-file-location:
  unix:
    - /etc/pki/CA/cacert.pem
    - /etc/pki/libvirt/servercert.pem
    - /etc/pki/libvirt/private/serverkey.pem
history:
  adoption-history:
    - >
      The adoption story is unusually broad for a system library. The official
      applications page lists command-line tools, desktop applications, provisioning
      tools, monitoring systems, web applications, configuration-management
      integrations, backup tools, and infrastructure-as-a-service stacks using the
      libvirt API.
    - >
      For package managers, libvirt is not just a library dependency; it is an ecosystem
      root. Installing it can bring daemons such as libvirtd or modular virt* daemons,
      virsh, validation tools, NSS integration packages, storage and network drivers,
      language bindings, and downstream tools such as virt-manager, virt-install,
      Vagrant providers, and cloud or CI integrations.
  package-nerd-significance:
    - >
      libvirt is package-nerd famous because it sits at the junction of init systems,
      daemon socket activation, TLS and PKI material, kernel capabilities, QEMU/KVM
      feature flags, storage pools, virtual networking, and language bindings. It is the
      sort of dependency whose packaging details define whether virtualization feels
      boring or impossible.
    - >
      It also illustrates why stable C APIs matter in infrastructure: a large ecosystem
      of frontends can keep working while hypervisors, host operating systems, and
      security models change underneath.
  project-history:
    - >
      The project was created to provide a common and stable layer for managing
      virtualized domains on local or remote nodes. Its own goals page emphasizes API
      stability, secure remote management, resource enumeration, and the ability to
      insulate applications from frequent changes in lower-level virtualization
      frameworks.
    - >
      libvirt became especially important as Linux virtualization consolidated around
      QEMU and KVM while still needing to interoperate with Xen, LXC, bhyve, VMware,
      VirtualBox, Hyper-V, and other backends. The project website describes a portable
      C API, stateful host daemons for some hypervisors, and language bindings layered
      on top of the core API.
  related-projects:
    - QEMU and KVM are among the most common backends managed through libvirt.
    - >
      Xen, LXC, bhyve, VMware ESX/vCenter, Hyper-V, VirtualBox, Virtuozzo, and POWER
      Hypervisor are supported or related virtualization targets.
    - >
      virt-manager, virt-install, guestfish, vagrant-libvirt, and many monitoring and
      provisioning tools sit above the libvirt API.
  sources:
    - https://gitlab.com/libvirt/libvirt
    - https://libvirt.org/
    - https://libvirt.org/apps.html
    - https://libvirt.org/downloads.html
    - https://libvirt.org/goals.html
    - https://libvirt.org/news.html
  summary:
    - >
      libvirt is the long-lived virtualization management API and daemon stack that
      gives tools a common way to manage domains, networks, storage, and host resources
      across hypervisors.
  timeline:
    - >
      2005: Early libvirt releases began the public release history recorded by the
      project news archive.
    - '2012: The 1.0 series marked libvirt as a mature cross-hypervisor management layer.'
    - >
      2021-01-15: libvirt 7.0.0 release notes recorded a formal handover of release
      tarball signing.
    - >
      2026-07-01: The project website listed support for QEMU/KVM, Xen, LXC, bhyve,
      VMware, Hyper-V, VirtualBox, macOS Hypervisor.framework, and other drivers.
  usage:
    - >
      Administrators commonly use virsh and libvirt daemons to define, start, stop,
      migrate, inspect, and automate virtual machines and container-like domains.
      Application developers use the API and bindings to build higher-level management
      tools while avoiding direct hypervisor-specific control protocols.
    - >
      On developer workstations it is often the package behind local KVM/QEMU workflows;
      on servers it is the control plane layer used by provisioning, monitoring, and
      orchestration software that needs stable VM lifecycle operations.
related-packages:
  - id: brew:virt-manager
    reason: >
      Choose virt-manager when you want a graphical libvirt frontend plus virt-install,
      virt-clone, and virt-xml command-line workflows for creating and managing guests.
    rel: adjacent_workflow
    sources:
      - https://libvirt.org/apps.html
      - https://github.com/virt-manager/virt-manager
  - id: brew:qemu
    reason: >
      Use QEMU as the machine emulator and virtualizer backend while libvirt supplies
      its higher-level lifecycle, storage, networking, and remote-management interface.
    rel: adjacent_workflow
    sources:
      - https://libvirt.org/drvqemu.html
      - https://www.qemu.org/docs/master/system/index.html
  - id: brew:terraform-provider-libvirt
    reason: >
      Use the Terraform provider to manage libvirt domains, networks, storage pools, and
      volumes declaratively through the libvirt API.
    rel: adjacent_workflow
    sources:
      - https://github.com/dmacvicar/terraform-provider-libvirt
      - https://libvirt.org/docs.html
