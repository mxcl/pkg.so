  summary:
    - >
      快贴 is a local-first clipboard history and cloud-synchronization application for
      Windows, macOS, iOS, Android, and Linux.
  timeline:
    - '2014: Official site dates the start of continuous 快贴 operation to this year.'
    - 'Later development: Native clients expanded across desktop, mobile, and Linux.'
    - 'Linux edition: The project adopted a per-user daemon and clipctl command-line interface.'
  usage:
    - >
      Copying content records it in local clipboard history for later search and paste,
      while signed-in devices can synchronize recent content. The Linux client uses
      clipd and clipctl for text and image history, login, synchronization, search,
      removal, and data-safe operations.
