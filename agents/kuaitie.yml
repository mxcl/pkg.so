history:
  adoption-history:
    - >
      The official site says 快贴 has operated continuously since 2014 and supports
      Windows, macOS, iOS, Android, and Linux. Native clients, offline operation,
      clipboard history, and multi-device synchronization position it for users who move
      short pieces of text or images across a mixed-device workspace.
  package-nerd-significance:
    - >
      快贴 is notable as a long-running, local-first clipboard utility with native clients
      across five operating-system families. Its Linux edition exposes a
      daemon-and-control-tool design, while desktop editions also support Lua-based
      clipboard-processing plugins.
  project-history:
    - >
      快贴 began operating in 2014 as a cloud clipboard synchronization service. It
      subsequently developed native clients for major desktop and mobile platforms, a
      privacy module and cloud data safe, a Linux daemon and CLI, and an extension
      system based on Lua.
