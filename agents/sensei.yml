history:
  adoption-history:
    - >
      Cindori states that Sensei is used by more than 50,000 people. The application
      serves both casual Mac owners seeking guided cleanup and advanced users who want
      detailed CPU, GPU, thermal, battery, disk, and storage information.
    - >
      Sensei originally supported macOS Catalina and has continued to follow new macOS
      and Apple Silicon generations. Cindori maintains older downloads for users whose
      operating systems no longer meet the current release's requirements.
  package-nerd-significance:
    - >
      Sensei consolidates categories often served by separate Mac utilities—menu-bar
      telemetry, S.M.A.R.T. diagnostics, battery health, thermal monitoring, disk
      benchmarking, storage cleanup, application removal, and SSD Trim management—into
      one native desktop package.
  project-history:
    - >
      Cindori was founded in 2013 and developed a family of Mac utilities informed by
      its work on storage and SSD tooling. Sensei brought that experience into a broader
      monitoring and maintenance application for macOS.
    - >
      Over time Sensei gained Apple Silicon support, newer macOS compatibility,
      customizable menu-bar monitoring, hardware-health dashboards, storage analysis and
      cleanup, application removal, and a simplified background-helper architecture.
      Sensei 1.6 replaced its legacy helper with a unified application and LaunchDaemon
      design.
  related-projects:
    - >
      Trim Enabler is Cindori's dedicated SSD Trim utility and shares part of the
      company's storage-tool lineage.
    - >
      Sensei includes capabilities that overlap with standalone disk-health,
      battery-health, fan-monitoring, cleanup, uninstaller, and benchmark utilities.
    - Backdrop is another current Cindori macOS application.
  sources:
    - https://cindori.com/news
    - https://cindori.com/news/website-announcement
    - https://cindori.com/sensei
    - https://cindori.com/support
    - https://cindori.com/support/sensei/general/download-older-sensei
  summary:
    - >
      Sensei is Cindori's macOS system-monitoring and maintenance suite, combining
      real-time performance telemetry with hardware diagnostics, storage cleanup,
      application removal, benchmarking, and SSD tools.
  timeline:
    - '2013: Cindori was founded as a Mac-software company.'
    - >
      Launch era: Sensei supported macOS Catalina and combined monitoring with
      optimization and hardware tools.
    - >
      2022: Cindori launched a new company website and support center for products
      including Sensei.
    - >
      2025: Sensei 1.6 introduced a unified application and new LaunchDaemon
      architecture, replacing the legacy helper tool.
  usage:
    - >
      Users keep Sensei's configurable monitor in the menu bar for live CPU, GPU,
      battery, storage, and other statistics, then open the main application for deeper
      diagnostics or maintenance. Common workflows include reviewing S.M.A.R.T. status,
      checking battery and thermal health, benchmarking a drive, finding large or
      leftover files, uninstalling applications, and managing supported SSD Trim
      settings.
