history:
  adoption-history:
    - >
      The supplied package metadata records packages in Homebrew and DNF-based
      distributions. Its adoption is therefore best understood as a compact reference
      implementation and hashing utility preserved by package collections rather than a
      broad end-user application.
  package-nerd-significance:
    - >
      The package captures an early open-source implementation of the SHA-2 family close
      to the algorithms' introduction. It remains interesting as small, auditable C code
      and as a historical alternative to the hashing commands bundled with larger
      cryptographic toolkits.
  project-history:
    - >
      Gifford dates the original implementation to a weekend in autumn 2000,
      specifically 14 October, when the SHA-256, SHA-384, and SHA-512 algorithms were
      newly described. The author distributes the implementation from his own
      cryptographic-hashing pages as source archives rather than through a public
      source-control forge.
  related-projects:
    - >
      The author's cryptographic code collection also includes SHA-1 and HMAC-SHA1
      implementations; modern general-purpose toolkits provide overlapping digest
      commands and libraries.
  sources:
    - https://aarongifford.com/computers/
    - https://aarongifford.com/computers/sha.html
    - source_facts.description
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      SHA-2 is Aaron D. Gifford's BSD-licensed C implementation of the SHA-224, SHA-256,
      SHA-384, and SHA-512 secure hash algorithms, accompanied by a small `sha2`
      command-line program.
  timeline:
    - >
      2000: Aaron D. Gifford implemented the newly described SHA-256, SHA-384, and
      SHA-512 algorithms in C.
    - >
      Later: SHA-224 and SHA-1 support appeared on the author's consolidated
      BSD-licensed implementation page.
  usage:
    - >
      The `sha2` executable computes SHA-2 message digests for files or input, while the
      C sources can also be embedded by developers who need the covered hash functions.
      It requires no persistent configuration or credentials.
