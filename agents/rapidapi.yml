history:
  adoption-history:
    - >
      Paw developed a following among macOS API developers as a native alternative to
      browser-based or cross-platform HTTP clients. Its documentation supports importing
      Postman, Swagger/OpenAPI, API Blueprint, cURL, and Charles data, while Paw for
      Teams added synchronized collaborative workflows.
    - >
      The product joined RapidAPI in 2021. Paw accounts were migrated to RapidAPI
      accounts on September 1, 2021, while the native Mac application and existing Paw
      data continued to work. The application bundle was renamed from Paw.app to
      RapidAPI.app in January 2023.
  package-nerd-significance:
    - >
      RapidAPI for Mac is notable for combining a native Mac HTTP client with a
      programmable extension system, reusable environments, request chaining,
      authentication helpers, and code generation. Package users may still encounter the
      Paw name throughout documentation and file formats even though the installed
      application is branded RapidAPI.
  project-history:
    - >
      The application was originally named Paw and was built as a native macOS HTTP
      client. The official update archive records Paw 2 releases in 2014 and Paw 3 in
      2016, followed by collaboration, GraphQL, and Apple-silicon work.
    - >
      Paw announced that it was joining forces with RapidAPI in February 2021. Account
      migration followed in September, and the desktop application subsequently adopted
      RapidAPI branding while retaining Paw's workflows and documentation.
  related-projects:
    - RapidAPI's broader API platform provides the account system used by the application.
    - >
      Paw extensions include code generators, importers, exporters, and dynamic values
      implemented through the documented JavaScript API.
  sources:
    - >
      Official account-migration FAQ:
      https://paw.cloud/docs/getting-started/account-migration-rapidapi
    - 'Official documentation: https://paw.cloud/docs/'
    - 'Official update history: https://paw.cloud/updates'
  summary:
    - >
      RapidAPI for Mac is the renamed continuation of Paw, a native macOS client for
      composing, testing, documenting, and sharing HTTP and API requests.
  timeline:
    - '2014: The official update archive records Paw 2.x releases.'
    - '2016: Paw 3 introduced team workflows, a dark theme, and a redesigned interface.'
    - '2021: Paw joined RapidAPI and migrated user accounts to RapidAPI identities.'
    - '2023: Version 4.1.1 renamed the application bundle from Paw.app to RapidAPI.app.'
  usage:
    - >
      Developers use the application to build and send HTTP, REST, SOAP, and GraphQL
      requests; inspect responses; manage cookies and environments; exercise
      authentication flows; import API descriptions; generate client code; and
      synchronize projects with a team. Environments and secrets can be stored inside
      individual .paw documents, but the official documentation does not establish a
      fixed global configuration or credentials-file path.
