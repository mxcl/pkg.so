history:
  adoption-history:
    - >
      OpenRocket developed from an academic project into a community-maintained,
      cross-platform desktop application. Official distributions support packaged
      applications and a Java archive, while its documentation addresses hobbyists
      designing rockets before construction and flight.
  package-nerd-significance:
    - >
      OpenRocket is a notable open-source scientific desktop package: it combines
      component-based design, six-degree-of-freedom flight simulation, optimization,
      plotting, and interoperable rocket formats in a Java application. Its long release
      history and reproducible `.ork` design files make it useful in technical and
      educational package collections.
  project-history:
    - >
      OpenRocket originated as Sampo Niskanen’s master’s thesis at Helsinki University
      of Technology. The first public release, 0.9.0, appeared in May 2009, followed by
      version 1.0.0 in March 2010.
    - >
      Subsequent community development added RockSim interoperability, optimization,
      internationalization, 3D design views, custom simulation expressions, packaged
      installers, and expanded component and staging support.
  related-projects:
    - RockSim
    - RASAero II
    - ThrustCurve.org
    - orhelper
  sources:
    - 'Official documentation: https://openrocket.readthedocs.io/'
    - >
      Official project history and technical documentation:
      https://openrocket.info/documentation.html
    - 'Official release notes: https://openrocket.info/release_notes.html'
    - 'Official repository: https://github.com/openrocket/openrocket'
  summary:
    - >
      OpenRocket is a free, open-source model-rocket design and flight-simulation
      application originally created by Sampo Niskanen and subsequently maintained by a
      wider contributor community.
  timeline:
    - '2009: OpenRocket 0.9.0 became the first public release.'
    - '2010: Version 1.0.0 was released; RockSim design import followed.'
    - '2011: Design optimization, internationalization, and expanded printing support arrived.'
    - >
      2012: The project adopted year-and-month version numbers and added 3D design views
      and custom simulation expressions.
    - >
      2022: Packaged installers and major component, staging, and simulation
      improvements debuted in the 22.02 series.
  usage:
    - >
      Users construct a rocket from modeled components, assign motors and recovery
      systems, configure launch conditions, and run simulations before building or
      flying it. Results include stability, altitude, velocity, acceleration, flight
      events, and plots; designs and simulation settings are saved in `.ork` files.
