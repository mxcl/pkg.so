history:
  adoption-history:
    - >
      Telari entered free public beta as a direct-download macOS application. Homebrew
      subsequently made it available through the telari cask.
  package-nerd-significance:
    - >
      Telari is notable for treating Markdown primarily as typeset reading material
      rather than as an editing format. Its native AppKit/CoreText implementation,
      Knuth–Plass line breaking, CJK-aware typography, OpenType mathematics, and
      hand-editable TOML settings distinguish it from browser-engine Markdown viewers.
  project-history:
    - >
      HexUp introduced Telari in 2026 as a native macOS Markdown reader focused on
      high-quality typography. The initial public-testing build included mixed CJK and
      Latin justification, mathematical typesetting, Markdown rendering, and PDF and PNG
      export. Later beta releases added Quick Look integration, source reading,
      workspaces, reading-position persistence, richer export, and an expanded settings
      interface.
  related-projects:
    - >
      Telari can hand the current document to an external Markdown editor rather than
      editing it itself.
    - Its Finder Quick Look extension uses the same typesetting approach as the main reader.
  sources:
    - 'Official changelog: https://telari.app/en/changelog/'
    - 'Official homepage: https://telari.app/en/'
    - source_facts.package-manager
  summary:
    - >
      Telari is a native macOS Markdown reader from HexUp, designed around book-like
      typography, mathematical typesetting, and mixed CJK and Latin text.
  timeline:
    - '2026-06-28: First public testing build released.'
    - >
      2026-07: Quick Look previews, source-reading mode, and reading-position memory
      were added.
    - '2026-08: Telari exposed its hand-editable settings.toml through the settings panel.'
    - '2026-09: The settings interface was reorganized into dedicated configuration pages.'
  usage:
    - >
      Open Markdown or plain-text documents for native typeset reading, searching,
      copying, and export to PDF or image.
    - >
      Use the workspace sidebar and tabs for collections of local files, or send the
      current document to a separately configured Markdown editor.
    - >
      Adjust fonts, typography, Markdown behavior, appearance, shortcuts, and Quick Look
      behavior in Settings; advanced options are stored in a hand-editable settings.toml
      whose active path is shown inside the application.
