id: brew:automysqlbackup
display-name: AutoMySQLBackup
repo: https://github.com/mattanja/automysqlbackup
docs:
  - https://github.com/mattanja/automysqlbackup#readme
  - https://sourceforge.net/projects/automysqlbackup
config-file-location:
  unix:
    - /etc/automysqlbackup/automysqlbackup.conf
    - /etc/automysqlbackup/myserver.conf
credentials-file-location:
  unix:
    - /etc/automysqlbackup/automysqlbackup.conf
    - /etc/automysqlbackup/myserver.conf
history:
  adoption-history:
    - >
      The batch input lists packages for Homebrew, Debian, Ubuntu, and Nix. That is
      modest but real adoption for a narrowly scoped backup script.
    - >
      Its GitHub metadata shows a small repository with a low star/fork count compared
      with general developer tools, so the history should be read as practical sysadmin
      utility adoption rather than broad developer-culture prominence.
  package-nerd-significance:
    - >
      AutoMySQLBackup is significant as an example of a package-manager-distributed
      cron-era admin script. Packaging matters because users expect the executable,
      sample config, cron integration, and filesystem permissions to land in predictable
      places.
  project-history:
    - >
      The official GitHub README says the script was originally developed by a team on
      SourceForge and that the GitHub repository was created as a clone for further
      maintenance after the SourceForge project appeared unmaintained. GitHub metadata
      dates the mattanja/automysqlbackup repository to October 2012.
    - >
      The README emphasizes operational responsibility and restore procedures as much as
      installation. That is typical for backup tooling: the script can automate
      mysqldump runs, but users still need offline copies, permissions, encryption
      choices, and tested restores.
  related-projects:
    - >
      mysqldump is the underlying MySQL dump tool commonly used by scripts like
      AutoMySQLBackup.
    - cron is the traditional scheduler used in the README examples.
    - >
      Modern alternatives include database-native backup tooling, Percona XtraBackup,
      and managed-database snapshot systems.
  sources:
    - https://api.github.com/repos/mattanja/automysqlbackup
    - https://github.com/mattanja/automysqlbackup#readme
    - source_facts.package-manager
  summary:
    - >
      AutoMySQLBackup is a shell-script utility for scheduled MySQL backup rotation. It
      is small, old-school ops software: edit a root-owned config, call the script from
      cron, and rotate daily, weekly, and monthly dumps.
  timeline:
    - 'Pre-2012: Original AutoMySQLBackup project maintained on SourceForge.'
    - >
      2012: mattanja/automysqlbackup GitHub repository created as a
      continued-maintenance clone.
    - >
      2020s: Package remains available in a small set of package managers for users who
      want a simple MySQL dump rotation script.
  usage:
    - >
      The README documents installing to /usr/local/bin, creating /etc/automysqlbackup,
      copying automysqlbackup.conf to myserver.conf, then running automysqlbackup with
      that config path or from cron.daily.
    - >
      Credentials live in the same configuration files as the backup settings: the
      documented defaults include CONFIG_mysql_dump_username,
      CONFIG_mysql_dump_password, host, socket, and encryption settings.
related-packages:
  - id: brew:mydumper
    reason: >
      Choose MyDumper when you still want portable logical backups but need
      multithreaded export and restore for databases too large for a serial dump
      workflow.
    rel: alternative
    sources:
      - https://mydumper.github.io/mydumper/docs/html/index.html
      - https://mydumper.github.io/mydumper/docs/html/examples.html
  - id: brew:percona-xtrabackup
    reason: >
      Choose Percona XtraBackup for supported MySQL-family servers when you need online
      physical hot backups, incremental operation, or lower disruption than a
      logical-dump script.
    rel: alternative
    sources:
      - https://docs.percona.com/percona-xtrabackup/8.4/
      - https://docs.percona.com/percona-xtrabackup/8.4/about-xtrabackup.html
