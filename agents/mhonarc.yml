id: brew:mhonarc
display-name: MHonArc
repo: https://savannah.gnu.org/projects/mhonarc
docs:
  - https://www.mhonarc.org/
  - https://www.mhonarc.org/MHonArc/doc/faq
  - https://www.mhonarc.org/MHonArc/doc/mhonarc.html
config-file-location:
  unix:
    - ~/.mhonarc.mrc
  windows:
    - <user-home-path>\mhonarc.mrc
credentials-file-location: null
history:
  project-history:
    - >
      Its historical role is tied to the early web's mailing-list archives. MHonArc
      generates HTML indexes, message pages, and thread links, with MIME support and
      extensive resource-file customization. The 1995 announcement already listed
      features that became central to mailing-list archive maintenance: thread indexes,
      removing messages, archive size limits, detection of already archived messages,
      and customization variables.
  sources:
    - https://formulae.brew.sh/formula/mhonarc
    - https://metacpan.org/dist/MHonArc/view/mhonarc
    - https://www.mhonarc.org/
    - https://www.mhonarc.org/MHonArc/doc/contacts.html
    - https://www.w3.org/Tools/MHonArc.html
  summary:
    - >
      MHonArc is Earl Hood's Perl mail-to-HTML converter for turning mail and news
      messages into web archives. The project's contact page identifies Hood as creator
      and developer, and an archived W3C announcement for MHonArc 1.1 shows the tool
      already being distributed in April 1995 as a Perl 4 program for RFC 822 and MIME
      email conversion.
  usage:
    - >
      In practice, administrators run `mhonarc` over mailbox files, MH folders, or
      incoming mail/news messages to produce static HTML archives; companion tools such
      as `mha-dbedit`, `mha-dbrecover`, and `mha-decode` support archive database and
      decoding tasks. Its presence in Homebrew, Debian, Fedora, Nix, and Ubuntu reflects
      a mature Perl utility niche: less a general email client than a durable
      static-site generator for list archives and message collections.
related-packages:
  - id: brew:vim
    reason: >
      MHonArc's official FAQ includes a bundled Vim syntax file and autocommand recipe
      for editing `.mrc` resource files with syntax highlighting.
    rel: adjacent_workflow
    sources:
      - https://www.mhonarc.org/MHonArc/doc/faq/usage.html
      - https://www.vim.org/about.php
