credentials-file-location: null
history:
  adoption-history:
    - >
      Gwyddion was packaged early by Unix-like systems used by scientific users. The
      project news records Gentoo adding it to Portage in 2005 and FreeBSD accepting a
      science/gwyddion port in 2006. The official download page later documented
      availability through Ubuntu universe, Gentoo, Arch AUR, OpenSuSE science
      repositories, MacPorts, Fink, Homebrew, Flatpak, and Windows installers.
    - >
      The supplied package-manager facts show the same cross-distribution footprint from
      the package index side: Homebrew, Debian, Ubuntu, MacPorts, and Nix all carry
      packages named gwyddion. That mix is significant because SPM researchers often
      need the same tool on lab Windows machines, Linux workstations, and macOS laptops.
  package-nerd-significance:
    - >
      Gwyddion matters to package nerds because it is a niche scientific application
      with all the classic packaging pressure points: GTK and scientific-library
      dependencies, GUI and command-line entry points, data files, documentation,
      scripting hooks, optional platform behavior, and frequent support for new
      instrument file formats.
    - >
      It is also a useful example of a long-lived SourceForge-hosted scientific project
      that did not disappear when centralized forge fashion changed. The continued
      Subversion repository, signed source tarballs, distro package notes, and
      multi-platform binaries make it a good case study in durable scientific software
      distribution.
  project-history:
    - >
      The project was public by 2004, when its news log records Gwyddion 1.6 and the
      registration of Gwyddion as a SourceForge project with its CVS repository moved
      there. Development moved from CVS to Subversion in 2006, and version 2.0 was
      announced in September 2006 as the start of a new stable series.
    - >
      Gwyddion evolved from a GTK-based SPM data viewer into a broad analysis workbench.
      The project documentation includes a user guide, Unix manual pages for Gwyddion
      commands, Python scripting material, and developer API references for libraries
      such as libgwyddion, libgwyprocess, libgwydraw, libgwydgets, libgwymodule, and
      libgwyapp. The news archive also shows adjacent tooling such as gwydump and
      libgwyfile, reflecting a project that treats its native GWY data format and
      reusable libraries as part of the ecosystem.
    - >
      The 2010s and 2020s brought steady domain-specific growth rather than a
      rewrite-driven history. The project news highlights support for volume data as a
      first-class type in 2013, a standalone libgwyfile effort in 2014, continuing
      file-format support improvements, curve maps, XYZ and volume processing modules,
      and a 3.x development line focused on GTK and internal modernization.
  related-projects:
    - >
      Gwyddion is related to gwydump, libgwyfile, and Gwyscope in its own project orbit.
      It also lives alongside microscopy and scientific-analysis packages that appear in
      distribution science categories, while its GTK, Python scripting, and library
      documentation connect it to the broader Unix desktop and scientific packaging
      stack.
  sources:
    - https://gwyddion.net/
    - https://gwyddion.net/documentation/
    - https://gwyddion.net/download.php
    - https://gwyddion.net/project-news.php
    - https://sourceforge.net/p/gwyddion/code/HEAD/tree/trunk/gwyddion/
  summary:
    - >
      Gwyddion is a free software application and library set for scanning probe
      microscopy data visualization and analysis. In package-manager culture it sits in
      the small but important class of specialist scientific desktop tools that are
      distributed like Unix software: source tarballs, command-line helpers, man pages,
      distribution packages, and optional scripting support around a GUI core.
  timeline:
    - >
      2004: Gwyddion 1.6 was released and the project was registered on SourceForge with
      a public CVS repository.
    - '2005: Gentoo added Gwyddion to Portage; version 1.13 added Mac OS X support.'
    - >
      2006: Gwyddion moved from CVS to Subversion; version 2.0 began a new stable
      series; FreeBSD accepted a science/gwyddion port.
    - '2007: Version 2.7 and Windows executables were distributed through the project site.'
    - '2013: Version 2.32 added volume data as a first-class data type.'
    - >
      2014: Work started on libgwyfile, a small embeddable library for reading and
      writing GWY files.
    - '2022: SourceForge recognized the project with an Open Source Excellence award.'
    - >
      2024: Version 3.0 was published as a development milestone for GTK and internal
      modernization.
  usage:
    - >
      Gwyddion is used to open, inspect, process, measure, and export scanning probe
      microscopy data such as AFM, STM, MFM, SNOM/NSOM, and related surface-measurement
      formats. Its package includes the gwyddion GUI and gwyddion-thumbnailer, and its
      documentation also exposes command manual pages, scripting, plug-in, and library
      interfaces for automated or extensible workflows.
    - >
      The project is especially practical for package-managed scientific workflows
      because it supports many vendor and research data formats while keeping analysis
      reproducible through documented modules, a native GWY format, and supporting tools
      such as gwydump and libgwyfile.
