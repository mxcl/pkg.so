config-file-location:
  unix:
    - ~/.config/Subtitle Edit/Settings.json
  windows:
    - '%APPDATA%\Subtitle Edit\Settings.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Subtitle Edit became a mature open-source Windows subtitle workstation with
      extensive format support and workflows for timing, waveform editing, OCR, spell
      checking, and conversion.
    - >
      Subtitle Edit 5.0.0, released in June 2026, brought the project to Windows, Linux,
      and macOS through one Avalonia-based codebase. The project continued to offer
      Subtitle Edit 4 for older Windows systems and specialized workflows not yet
      present in the rewrite.
  package-nerd-significance:
    - >
      Subtitle Edit combines work often split among several media tools: format
      conversion, timing repair, waveform synchronization, OCR, speech recognition,
      translation, and subtitle rendering.
    - >
      The fifth-generation rewrite is especially notable to packagers because it
      replaced the Windows Forms architecture with a cross-platform application and
      added native macOS and Linux distributions while retaining portable builds.
  project-history:
    - >
      Subtitle Edit was developed as a free, open-source editor for video subtitles and
      accumulated support for hundreds of text, binary, and image-based subtitle
      formats.
    - >
      The project later undertook a ground-up Avalonia rewrite. Subtitle Edit 5 retained
      the core editing workflow while adding a shared cross-platform codebase, a JSON
      settings format, and bundled media components in selected packages.
  related-projects:
    - >
      FFmpeg supplies media inspection and audio/video processing used by many Subtitle
      Edit workflows.
    - mpv supplies the default video-player backend on Linux and macOS.
    - >
      Tesseract, Whisper-family implementations, and other optional engines support OCR
      and speech-to-text workflows.
    - >
      SeConv is the project's related headless subtitle conversion utility built from
      the same core libraries.
  sources:
    - https://github.com/SubtitleEdit/subtitleedit/blob/main/README.md
    - https://github.com/SubtitleEdit/subtitleedit/blob/main/docs/third-party-components.md
    - https://github.com/SubtitleEdit/subtitleedit/discussions/11744
    - https://subtitleedit.github.io/subtitleedit/
    - https://subtitleedit.github.io/subtitleedit/features/whats-new-in-se5.html
  summary:
    - >
      Subtitle Edit is a free, open-source application for creating, editing,
      synchronizing, converting, transcribing, translating, and OCR-processing video
      subtitles.
  timeline:
    - >
      Before 2026: Subtitle Edit developed into a feature-rich Windows subtitle editor
      with broad format and media-tool support.
    - >
      2026: Subtitle Edit 5.0.0 introduced a rewritten Avalonia application for Windows,
      Linux, and macOS.
    - >
      2026: Subsequent Subtitle Edit 5 releases continued expanding the new
      cross-platform generation while Subtitle Edit 4 remained available.
  usage:
    - >
      Users open or create subtitle files, align text with video or waveforms, repair
      timing and formatting, convert among more than 380 formats, and save or export the
      result.
    - >
      Optional workflows can generate subtitles through speech recognition, translate
      text, OCR image-based subtitle streams, or burn subtitles into video. Some
      integrations use third-party online providers, but the core editor operates
      offline.
    - >
      Subtitle Edit 5 stores settings in Settings.json within its platform data folder.
      Official documentation provides an in-application shortcut for opening that
      folder.
