history:
  adoption-history:
    - >
      The official README supports installation from a release archive or through
      Homebrew, making the utility accessible both to ordinary Mac users and
      command-line-oriented package users.
  package-nerd-significance:
    - >
      Bluesnooze is representative of a focused macOS menu-bar utility: it solves one
      operating-system behavior with a small native application and is conveniently
      distributable through Homebrew despite being ineligible for the Mac App Store
      because it uses a private Bluetooth API.
  project-history:
    - >
      Bluesnooze was developed as a small open-source macOS utility for preventing a
      sleeping Mac from taking Bluetooth audio connections away from another paired
      device. Its scope deliberately remains limited to toggling Bluetooth power rather
      than managing individual devices.
  related-projects:
    - Whisper, another macOS utility referenced by the Bluesnooze author
  sources:
    - https://github.com/odlp/bluesnooze#readme
  summary:
    - >
      Bluesnooze is a macOS menu-bar utility that switches Bluetooth off when the Mac
      sleeps and restores it on wake, preventing sleeping Macs from reconnecting to
      shared headphones or speakers.
  timeline:
    - >
      The project added release-archive and Homebrew installation paths as its principal
      distribution methods.
  usage:
    - >
      Run Bluesnooze in the background and optionally launch it at login. It toggles the
      Mac's overall Bluetooth state on sleep and wake.
    - >
      The menu-bar icon can be hidden with the documented defaults key
      com.oliverpeate.Bluesnooze hideIcon. The app is not compatible with Apple Watch
      unlock, and it does not selectively disconnect individual devices.
