history:
  adoption-history:
    - >
      Wallpaper Wizard was distributed to macOS users as a curated alternative to
      manually finding and rotating desktop backgrounds. The cask packages the desktop
      application as Wallpaper Wizard.app.
    - >
      MacPaw ended sales and sunset Wallpaper Wizard 2 on March 23, 2026. Users were
      instructed to save uploaded wallpaper collections locally before access ended.
  package-nerd-significance:
    - >
      Wallpaper Wizard is an example of a proprietary desktop package whose installable
      artifact became unusable after a vendor-operated service was retired. That
      distinction matters to package maintainers deciding whether an obsolete cask
      should remain available.
  project-history:
    - >
      MacPaw developed Wallpaper Wizard as a macOS desktop-customization product and
      later marketed its second major generation as Wallpaper Wizard 2.
    - >
      In February 2026, MacPaw announced that the product would be sunset the following
      month so the company could concentrate on other Mac products.
  related-projects:
    - >
      MacPaw named 24 Hour Wallpaper on Setapp as a time-aware wallpaper alternative for
      former users.
  sources:
    - https://macpaw.com/news/wallpaper-wizard-sunset
    - source_facts.applications
    - source_facts.description
  summary:
    - >
      Wallpaper Wizard was a MacPaw application for selecting and changing curated macOS
      desktop wallpapers. The service and application were sunset in March 2026.
  timeline:
    - 'February 23, 2026: MacPaw announced the sunset of Wallpaper Wizard 2.'
    - >
      March 23, 2026: MacPaw sunset the product and ended access to the application and
      legacy versions.
  usage:
    - >
      Users selected wallpaper collections for automatic desktop customization. Before
      shutdown, MacPaw advised users to save any uploaded collections to their devices.
    - >
      The application should now be treated as discontinued: MacPaw says neither the
      current app nor legacy versions remain accessible.
