history:
  adoption-history:
    - >
      SwiftBar deliberately adopted the BitBar/xbar plugin API, allowing existing
      scripts from that ecosystem to run with little or no modification. It also bundles
      a plugin repository and supports user-authored scripts in any executable language.
  package-nerd-significance:
    - >
      SwiftBar turns small scripts into visible macOS menu-bar tools with almost no
      application scaffolding. It is especially attractive to package and automation
      enthusiasts because shell, Python, Ruby, compiled programs, and other executables
      can all expose status and actions through the same text protocol.
  project-history:
    - >
      SwiftBar emerged as a native macOS menu-bar host for scriptable plugins. The
      project retained compatibility with the established BitBar/xbar output and
      metadata formats while adding its own environment variables, URL scheme,
      streamable and ephemeral plugin modes, and packaged plugins.
  related-projects:
    - BitBar and xbar define the plugin lineage and compatible output API.
    - The awesome BitBar plugin collection can supply compatible plugins.
  sources:
    - https://github.com/swiftbar/SwiftBar#readme
    - https://github.com/swiftbar/SwiftBar/blob/main/README-PACKAGED-PLUGINS.md
    - https://github.com/swiftbar/SwiftBar/releases
  summary:
    - >
      SwiftBar is an open-source macOS application that runs executable plugins and
      renders their text output as interactive menu-bar items.
  timeline:
    - '2020: Public project activity and BitBar-compatible plugin development were underway.'
    - >
      Later releases: Streamable, ephemeral, and packaged-plugin models expanded the
      original script workflow.
  usage:
    - >
      On first launch, select a plugin folder. Add an executable named with an optional
      refresh interval, such as date.1m.sh, and print the menu-bar title followed by
      optional dropdown content. SwiftBar supplies plugin-specific environment variables
      and can refresh or invoke plugins through its URL scheme.
