id: brew:licensor
display-name: licensor
repo: null
docs:
  - https://github.com/raftario/licensor#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      licensor is distributed through Homebrew, crates.io, and GitHub release binaries.
      Its audience is developers who want a quick, offline-capable way to generate
      standard license text by SPDX ID.
  package-nerd-significance:
    - >
      licensor is package-nerd useful because it treats SPDX IDs as executable package
      metadata: the stable identifier becomes the input, and the canonical license body
      becomes a reproducible build artifact.
  project-history:
    - >
      The public repository was created on 2019-09-19. The README says the author made
      it after getting tired of looking for license files for new projects.
    - >
      The project is built around SPDX License List data. Its README says licenses are
      parsed from SPDX license-list-data, compressed, generated into Rust code, and
      included in the final CLI binary.
  related-projects:
    - >
      Related projects include SPDX license-list-data, crates.io Rust CLIs, Homebrew
      developer-tool formulae, and repository bootstrapping tools that create LICENSE
      files.
  sources:
    - https://api.github.com/repos/raftario/licensor
    - https://crates.io/crates/licensor
    - https://formulae.brew.sh/formula/licensor
    - https://github.com/raftario/licensor
    - https://github.com/spdx/license-list-data
    - https://raw.githubusercontent.com/raftario/licensor/master/README.md
  summary:
    - >
      licensor is a Rust CLI that prints license texts to standard output from SPDX
      identifiers. It is deliberately small: license and exception data are compiled
      into the binary, and users redirect output into a LICENSE file.
  timeline:
    - '2019-09-19: GitHub repository created.'
    - '2019: README describes SPDX-backed license generation and WITH exception support.'
    - '2026: Repository metadata identifies Rust, CLI, license, licensing, and SPDX topics.'
  usage:
    - >
      Users run commands such as licensor MIT "Name" > LICENSE, list available licenses,
      or print expressions with SPDX WITH exceptions while optionally skipping optional
      text.
related-packages:
  - id: brew:licensee
    reason: >
      After licensor generates a standard LICENSE file, Licensee can inspect the project
      and report which license that file represents, making it useful as a verification
      step.
    rel: adjacent_workflow
    sources:
      - https://github.com/raftario/licensor/blob/master/README.md
      - https://licensee.github.io/licensee/command-line-usage/
