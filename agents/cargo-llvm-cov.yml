id: brew:cargo-llvm-cov
display-name: cargo-llvm-cov
repo: https://github.com/taiki-e/cargo-llvm-cov
docs:
  - https://github.com/taiki-e/cargo-llvm-cov/tree/main/docs
  - https://github.com/taiki-e/cargo-llvm-cov#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The tool became part of common Rust CI coverage workflows because it can emit
      text, HTML, JSON, lcov, Cobertura, and Codecov-compatible reports. It is packaged
      by Homebrew, Nix, and Arch according to the input package-manager facts; crates.io
      reported 6,323,980 downloads when checked on 2026-06-30.
  package-nerd-significance:
    - >
      It matters to Rust package maintainers because it standardizes coverage collection
      around the compiler's LLVM instrumentation rather than a separate test harness,
      making coverage easier to reproduce locally and in package CI.
  project-history:
    - >
      The crate was first published on crates.io in January 2021 as version 0.0.0. Its
      official README emphasizes precise line, region, and optional branch coverage
      while avoiding extra layers between rustc, cargo, and llvm-tools.
  related-projects:
    - >
      Related projects include rustc's -C instrument-coverage support, llvm-tools,
      cargo-nextest, Codecov, and Cobertura-compatible coverage consumers.
  sources:
    - https://api.github.com/repos/taiki-e/cargo-llvm-cov
    - https://github.com/taiki-e/cargo-llvm-cov
    - https://github.com/taiki-e/cargo-llvm-cov/tree/main/docs
    - https://github.com/taiki-e/cargo-llvm-cov#readme
    - https://crates.io/api/v1/crates/cargo-llvm-cov
    - https://formulae.brew.sh/api/formula/cargo-llvm-cov.json
  summary:
    - >
      cargo-llvm-cov is a Cargo subcommand for LLVM source-based coverage in Rust
      projects. Its README says it wraps rustc -C instrument-coverage and supports cargo
      test, cargo run, and cargo nextest flows.
  timeline:
    - '2021: First crates.io release 0.0.0.'
    - '2026: Crates.io latest version 0.8.7 and Homebrew stable version 0.8.7.'
  usage:
    - >
      Typical usage is cargo llvm-cov for test coverage, cargo llvm-cov --html or --open
      for local reports, cargo llvm-cov --lcov for CI uploads, and cargo llvm-cov
      nextest when running tests through cargo-nextest.
related-packages:
  - id: brew:cargo-nextest
    reason: >
      cargo-llvm-cov officially supports running tests through nextest and producing
      coverage from those runs, making cargo-nextest a direct companion when a project
      wants nextest's runner and LLVM coverage together.
    rel: adjacent_workflow
    sources:
      - https://github.com/taiki-e/cargo-llvm-cov#readme
      - https://nexte.st/docs/integrations/llvm-cov/
