history:
  adoption-history:
    - >
      Official installation instructions cover pip, pipx, and Homebrew, which is the
      usual adoption path for a Python CLI that wants to be convenient both for Python
      users and macOS command-line users.
    - >
      The repository has tags from 0.1.0 through 0.1.6, but it exposes less public
      release narrative than larger projects. The safe history is therefore about its
      documented packaging surfaces and feature set, not a detailed organizational
      chronology.
  package-nerd-significance:
    - >
      Airshare is a tidy example of the Python CLI packaging stack meeting Homebrew. The
      same tool is installable with pip, pipx, and brew, while its runtime behavior
      depends on Python async networking libraries and host-level local-network
      discovery.
    - >
      For package maintainers, the interesting parts are less about compilation and more
      about cross-platform behavior: mDNS support, clipboard integration, browser
      fallback, and large-file streaming all affect whether the packaged CLI feels
      native.
  project-history:
    - >
      The official README describes Airshare as a Python-based CLI tool and module built
      with aiohttp and zeroconf. Its repository metadata and license text place the
      project in 2020 under the KuroLabs/Airshare GitHub repository.
    - >
      Airshare's design centers on a small command-line interaction: one machine
      publishes content under a short code word and another uses the same code word to
      receive it. The HTTP gateway broadens the tool beyond CLI-to-CLI transfer, letting
      browsers and mobile devices fetch the shared content when local name resolution
      permits.
  related-projects:
    - aiohttp and zeroconf are named by the README as implementation building blocks.
    - >
      Avahi and Bonjour are related platform services for multicast-DNS name resolution
      in Airshare's documented local-network workflow.
  sources:
    - https://airshare.readthedocs.io/en/latest
    - https://github.com/KuroLabs/Airshare
    - https://github.com/KuroLabs/Airshare/tags
    - source_facts.package-manager
  summary:
    - >
      Airshare is a Python CLI and module for peer-to-peer local-network content
      transfer. It uses multicast DNS service discovery and an HTTP gateway so files,
      directories, text, and clipboard content can move across nearby machines without
      an internet service.
  timeline:
    - '2020: README license and project authorship identify the public Airshare project era.'
    - '2020: Repository tags include the 0.1.x series from 0.1.0 through 0.1.6.'
    - '2020s: Official install docs list pip, pipx, and Homebrew installation paths.'
  usage:
    - >
      A typical send operation is `airshare codeword file-or-directory`; the receiver
      runs `airshare codeword` or visits the advertised `.local` HTTP URL. Airshare can
      also transfer plain text, interact with clipboards, stream large files in chunks,
      and be imported as a Python module.
    - >
      Its practical edge is local, offline sharing: it avoids accounts and cloud
      storage, but depends on multicast DNS support such as Bonjour or Avahi for
      friendly `.local` discovery on some platforms.
related-packages:
  - id: brew:localsend-cli
    reason: >
      Choose LocalSend CLI when you want encrypted local-network transfers that
      interoperate with LocalSend's desktop and mobile applications, rather than
      Airshare's mDNS code-word and browser-gateway workflow.
    rel: alternative
    sources:
      - https://airshare.readthedocs.io/en/latest/
      - https://github.com/localsend/localsend#command-line-interface
  - id: brew:magic-wormhole
    reason: >
      Choose Magic Wormhole when peers may be on different networks and you want
      one-time human-readable codes with end-to-end encryption and relay fallback.
    rel: alternative
    sources:
      - https://airshare.readthedocs.io/en/latest/
      - https://magic-wormhole.readthedocs.io/en/latest/welcome.html
