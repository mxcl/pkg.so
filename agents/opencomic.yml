history:
  adoption-history:
    - >
      OpenComic is distributed across Windows, macOS, and Linux through native
      installers, portable archives, application stores, and Linux package formats. The
      supplied package facts also identify a Homebrew Cask, giving macOS users a
      package-managed installation path.
  package-nerd-significance:
    - >
      OpenComic is notable for combining comic-archive, image, PDF, and ebook handling
      in one cross-platform Electron application. Its unusually broad release
      matrix—including portable, sandboxed, ARM, and conventional package formats—makes
      it relevant to desktop package maintainers.
  project-history:
    - >
      OpenComic is an open-source comic and manga reader developed in the ollm/OpenComic
      repository. Its scope has expanded from local image and comic-archive reading to
      include ebooks, network servers, OPDS catalogs, tracking services, multi-window
      operation, and image-processing tools.
  related-projects:
    - >
      OpenComic occupies the same package niche as other desktop comic-library readers,
      while its support for OPDS and server protocols also connects it to self-hosted
      comic and ebook ecosystems.
  sources:
    - https://github.com/ollm/OpenComic/blob/master/CHANGELOG.md
    - https://opencomic.app/
    - https://opencomic.app/docs/guides/features/
    - source_facts.package-manager
  summary:
    - >
      OpenComic is a cross-platform comic and manga reader with library management,
      manga and webtoon reading modes, and support for images, comic archives, PDFs,
      ebooks, OPDS catalogs, and remote servers.
  timeline:
    - '2024: Version 1.2.0 added features including background music and S3 server support.'
    - >
      2020s: The project expanded its packaging to Windows, macOS, Linux, and ARM
      release formats.
  usage:
    - >
      Users open local files, archives, or directories; maintain a library; and read
      using page, manga, webtoon, or scrolling layouts. It can also browse OPDS catalogs
      and connect to remote storage through protocols such as SMB, SFTP, S3, and WebDAV.
