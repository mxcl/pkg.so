id: brew:jed
display-name: JED
repo: https://github.com/jedsoft/jed
docs:
  - https://www.jedsoft.org/jed/docs.html
config-file-location:
  unix:
    - ~/.jedrc
credentials-file-location: null
history:
  adoption-history:
    - >
      JED became a durable package-manager editor because it is small,
      terminal-friendly, multi-platform, and scriptable without requiring Emacs or Vim.
      The batch input records packages in Homebrew, Debian, Fedora, MacPorts, Nix,
      Ubuntu, and openSUSE, reflecting its long tail in Unix-like distributions.
  package-nerd-significance:
    - >
      JED is package-nerd significant as a survivor from the older cross-platform editor
      ecosystem: it supports systems far beyond mainstream Unix, embeds its own
      scripting language stack, and provides an alternative for users who want a
      programmable editor without the weight or habits of larger editor families.
  project-history:
    - >
      JED grew out of Davis's long-running open-source software work alongside S-Lang,
      slrn, and most. Its defining technical choice is deep use of the S-Lang library
      and scripting language, which gives the editor programmable modes and an extension
      model.
    - >
      The official GitHub organization says the GitHub repositories are mirrors of the
      main repositories at jedsoft.org. The repository README points readers back to the
      jedsoft JED pages, S-Lang documentation, and the JED mailing list, so the
      canonical project identity remains tied to jedsoft.org.
  related-projects:
    - >
      Related projects include S-Lang, which supplies the scripting language and
      terminal-oriented library facilities, plus other Davis tools such as slrn and most
      that share the same small, portable Unix-tool sensibility.
  sources:
    - https://formulae.brew.sh/formula/jed
    - https://github.com/jedsoft/jed
    - https://github.com/jedsoft/jed/blob/master/README
    - https://github.com/jedsoft/jed/blob/master/changes.txt
    - https://www.jedsoft.org/
    - https://www.jedsoft.org/jed/
    - https://www.jedsoft.org/jed/docs.html
    - https://www.jedsoft.org/slang/
  summary:
    - >
      JED is John E. Davis's scriptable programmer's editor. The official homepage
      describes it as a freely available editor for Unix, VMS, MSDOS, OS/2, BeOS, QNX,
      and Windows platforms, designed for programmers but friendly enough for simple
      text editing.
  timeline:
    - '1990s: The changes file records the long-running 0.99 snapshot and beta series.'
    - '2006: The changes file records B0.99.17 snapshot activity.'
    - '2017: The official homepage for JED version 0.99-19 was updated by John E. Davis.'
    - '2020: The official documentation page was updated by John E. Davis.'
  usage:
    - >
      Users install JED as a console or lightweight graphical editor, configure it with
      ~/.jedrc on Unix-like systems, and extend it through S-Lang modes. The homepage
      highlights programmer editing, menus, email composition, and language-specific
      editing as normal use cases.
related-packages:
  - id: brew:s-lang
    reason: >
      Install and learn S-Lang when extending JED, because JED uses it as its embedded
      scripting language for configuration, modes, and editor commands.
    rel: adjacent_workflow
    sources:
      - https://www.jedsoft.org/jed/
      - https://www.jedsoft.org/slang/
