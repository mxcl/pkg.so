history:
  adoption-history:
    - >
      GoodSync expanded from a desktop synchronization utility into a cross-platform
      family covering Windows, macOS, Linux, NAS, server, workstation, and centrally
      managed deployments.
    - >
      GoodSync Connect extended the product with direct computer-to-computer
      synchronization, mediator-based discovery, and optional forwarding, avoiding a
      requirement to keep synchronized data in cloud storage.
  package-nerd-significance:
    - >
      GoodSync is notable for exposing both a polished desktop workflow and substantial
      automation machinery: command-line operation, readable TIX job descriptors,
      customizable profile locations, mass deployment, and a distinct server protocol.
    - >
      Its explicit distinction between bidirectional synchronization and one-way backup,
      plus retained saved/history copies under _gsdata_, makes it useful when evaluating
      sync semantics rather than merely file-copy behavior.
  project-history:
    - >
      Siber Systems released GoodSync in 2006 as a bidirectional and multi-directional
      file synchronization product. It subsequently added command-line operation,
      enterprise editions, remote filesystems, and GoodSync Connect.
    - >
      GoodSync 9 introduced an expanded Connect workflow for direct synchronization
      among computers. Later releases developed a broader ecosystem including storage,
      server, control-center, and NAS components.
  related-projects:
    - GoodSync Connect
    - GoodSync Server
    - GoodSync Control Center
    - GoodSync Storage
    - GSYNC
    - GSCP
  sources:
    - https://www.goodsync.com/goodsync-connect-manual
    - https://www.goodsync.com/manual
    - https://www.goodsync.com/press-releases/20060206_GoodSync-Product-Release.pdf
    - https://www.goodsync.com/press-releases/20122102-GS-9-Release.pdf
  summary:
    - >
      GoodSync is a commercial cross-platform file synchronization and backup system
      developed by Siber Systems and first released in 2006.
  timeline:
    - >
      2006: Siber Systems released GoodSync as a bidirectional and multi-directional
      synchronization product.
    - '2007: GoodSync 6 documented command-line job creation and execution.'
    - '2009: GoodSync Enterprise was marketed for managed organizational synchronization.'
    - '2012: GoodSync 9 expanded GoodSync Connect for direct synchronization between computers.'
  usage:
    - >
      Users define jobs by selecting left and right folders, choose synchronization or
      one-way backup direction, analyze proposed changes, and then run synchronization
      manually or automatically.
    - >
      GoodSync supports local files, network shares, SFTP, cloud-storage providers, and
      its GSTP-based Connect service. Deleted or replaced files can be retained in
      _gsdata_ saved or history directories.
    - >
      Advanced users can invoke the GUI or GSYNC command line, relocate the profile
      containing accounts and jobs, automate jobs, and deploy clients or runners
      centrally.
