id: brew:git-graph
display-name: git-graph
repo: null
docs:
  - https://github.com/git-bahn/git-graph/blob/main/MANUAL.md
  - https://github.com/git-bahn/git-graph#readme
config-file-location:
  linux:
    - ~/.config/git-graph/models/*.toml
  macos:
    - ~/Library/Application Support/git-graph/models/*.toml
  windows:
    - '%APPDATA%\git-graph\models\*.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      git-graph occupies a narrower visualization niche than full terminal Git
      interfaces, but it has package visibility through Homebrew and crates.io. The
      README also points users who need an interactive terminal application to
      `git-igitt`, which was built on top of git-graph.
  package-nerd-significance:
    - >
      git-graph is package-manager interesting because it packages a specialized view of
      repository topology as a standalone binary rather than a large Git client. It is
      useful when developers want a predictable, scriptable terminal visualization
      aligned with their branch model.
  project-history:
    - >
      The project started in late 2020 and produced a rapid sequence of early releases
      around text-based graph rendering, branch models, styles, and formatting. The
      README presents the tool as a structured graph viewer for GitFlow, simple, and
      custom branching models, while the manual documents model selection, styles,
      commit formatting, SVG output, and persistent per-repository model settings.
  related-projects:
    - >
      git-graph relates to `git log --graph`, graphical Git clients, GitFlow-oriented
      visualization tools, and `git-igitt`, an interactive terminal application based on
      git-graph.
  sources:
    - https://crates.io/crates/git-graph
    - https://formulae.brew.sh/formula/git-graph
    - https://github.com/git-bahn/git-graph
    - https://github.com/git-bahn/git-graph/blob/master/README.md
    - https://github.com/git-bahn/git-graph/blob/master/docs/manual.md
    - https://github.com/git-bahn/git-graph/releases
  summary:
    - >
      git-graph is a Rust command-line tool for rendering Git history graphs in a
      terminal with branch ordering based on a chosen branching model. It aims to make
      histories such as GitFlow easier to read than raw graph output from generic
      clients.
  timeline:
    - '2020: Repository created on GitHub.'
    - '2020: 0.1.0 release began the release series.'
    - '2021: 0.5.0 release followed the initial burst of graph-rendering releases.'
    - '2022: crates.io package appeared.'
    - '2025: 0.7.0 release line was packaged by Homebrew.'
  usage:
    - >
      Practitioners run `git-graph` inside a repository, choose a model with `--model`,
      set a repository's preferred model with `git-graph model`, and tune output with
      styles or Git-like format strings. Custom branching models live under the platform
      app-data directory as TOML files.
related-packages:
  - id: brew:tig
    reason: >
      Choose Tig when you want an interactive ncurses repository browser with staging
      and pager modes; choose git-graph for non-interactive, branching-model-aware graph
      rendering.
    rel: alternative
    sources:
      - https://github.com/git-bahn/git-graph#readme
      - https://github.com/jonas/tig
      - https://github.com/jonas/tig/blob/master/doc/manual.adoc
tags:
