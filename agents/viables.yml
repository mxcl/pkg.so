history:
  adoption-history:
    - >
      The developer created ViableS after users requested a version suitable for keeping
      research VMs more completely isolated from the host. It is positioned for
      investigation of untrusted software, documents, or other workloads where host
      filesystem exchange is undesirable.
    - >
      ViableS and Viable deliberately use identical VM formats. A user can prepare a
      guest with Viable's convenient sharing features, shut it down, and reopen it with
      ViableS for the isolated phase of the work.
  package-nerd-significance:
    - >
      ViableS is a useful example of defense-in-depth around Apple's lightweight
      virtualization: the guest boundary is supplemented by macOS App Sandbox
      restrictions and removal of host integration features. Its compatibility with
      Viable VM bundles also separates convenient provisioning from locked-down
      execution.
  project-history:
    - >
      ViableS debuted publicly on December 28, 2022 as the sandboxed and locked-down
      sibling of Viable. It uses the same underlying code and VM format but removes
      shared-folder and clipboard support while retaining NAT networking and the other
      supported Virtio and macOS devices.
    - >
      The application remains part of Howard Oakley's family of small Apple-silicon
      virtualization utilities and follows Viable's evolution and the capabilities
      exposed by Apple's Virtualization framework.
  related-projects:
    - Viable is the less restricted creator and runner with optional host shared folders.
    - Vimy runs VM bundles created by Viable, while Liviable targets Linux guests.
    - >
      All these tools ultimately depend on Apple's Virtualization framework for
      supported devices and guest operation.
  sources:
    - >
      Official VM-building guide:
      https://eclecticlight.co/2023/09/07/how-to-build-a-custom-macos-vm-on-apple-silicon/
    - >
      Official ViableS announcement:
      https://eclecticlight.co/2022/12/28/macos-virtualisation-refactored-and-sandboxed-in-viable-updates/
    - 'Official product page: https://eclecticlight.co/virtualisation-on-apple-silicon/'
  summary:
    - >
      ViableS is the sandboxed, locked-down edition of Viable for running macOS virtual
      machines on Apple-silicon Macs. It removes host shared-folder and clipboard
      integration to improve isolation for research workloads.
  timeline:
    - "2022-12-28: ViableS beta 7 was announced as Viable's sandboxed and locked-down sibling."
    - >
      2023: Official guidance documented using Viable and ViableS in custom, disposable
      macOS VM workflows.
  usage:
    - >
      Users can build and provision a VM with Viable, shut it down, and then open the
      same bundle in ViableS when stronger separation from the host is wanted.
    - >
      ViableS is intended for research and other isolated workloads. It retains NAT
      networking, so its locked-down design specifically reduces host file and clipboard
      integration rather than making the guest networkless.
