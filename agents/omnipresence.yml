history:
  adoption-history:
    - >
      OmniPresence supplied document synchronization for OmniOutliner, OmniGraffle and
      other Omni document apps, with a background Mac utility and integration inside iOS
      applications.
  package-nerd-significance:
    - >
      Its use of WebDAV and published framework code makes it an example of a commercial
      Mac developer offering synchronization that users could host themselves.
  project-history:
    - >
      The Omni Group developed OmniPresence to bring automatic document synchronization
      to its Mac and iOS applications. Its launch announcement emphasized document
      coordination, preservation of conflicting edits and operation on ordinary WebDAV
      servers.
  related-projects:
    - Omni Sync Server, OmniOutliner, OmniGraffle and OmniPlan.
  sources:
    - https://support.omnigroup.com/documentation/omnipresence/mac/1.4.1/en/introduction/
    - https://www.omnigroup.com/blog/omnipresence-document-syncing-ships-this-week
    - https://www.omnigroup.com/more
  summary:
    - >
      OmniPresence is The Omni Group's legacy document synchronization utility for macOS
      and iOS.
  timeline:
    - >
      Launch announcement: Omni announced shipment for May 22 and publication of the
      source within its open-source frameworks.
  usage:
    - >
      Configure a local synchronized folder and an Omni Sync Server or WebDAV account.
      The Mac application watches the folder from the menu bar. Omni now recommends
      iCloud Drive for current versions of its document apps.
