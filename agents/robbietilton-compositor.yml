history:
  adoption-history:
    - >
      Compositor is distributed as signed and notarized macOS releases, through GitHub
      Releases, and through the Homebrew cask named robbietilton-compositor. Its
      MIT-licensed source also supports building directly with Xcode.
  package-nerd-significance:
    - >
      Compositor is notable as a native, open-source macOS image editor built around a
      familiar Photoshop-style compositing workflow. Its `.comp` project is a directory
      containing PNG layers and a manifest, which makes projects accessible to scripts
      and AI agents rather than confining them to an opaque binary format.
  project-history:
    - >
      Robbie Tilton created Compositor after finding Photoshop too expensive and
      alternatives such as GIMP insufficiently familiar for his compositing workflow.
      The project targets Apple silicon Macs and uses native Apple technologies,
      including AppKit and Metal.
  related-projects:
    - >
      Compositor is positioned as an alternative to Adobe Photoshop and GIMP. Its
      documented project format also supports external scripts and automation tools that
      generate or modify layered image projects.
  sources:
    - 'Official Compositor README: https://github.com/robbietilton/Compositor#readme'
    - >
      Official Compositor documentation directory:
      https://github.com/robbietilton/Compositor/tree/main/docs
    - 'Official Compositor releases: https://github.com/robbietilton/Compositor/releases'
    - 'source_facts.package-manager.brew-cask: "robbietilton-compositor"'
  summary:
    - >
      Compositor is a free, MIT-licensed image editor for Apple silicon Macs, designed
      around layered compositing and post-processing workflows familiar to Photoshop
      users.
  timeline:
    - >
      2026: Compositor 1.0 and its initial maintenance releases were published through
      the official GitHub repository.
  usage:
    - >
      Users create layered image projects with masks, adjustment layers, effects,
      selections, painting tools, and GPU-rendered blend modes. Projects can be edited
      interactively or generated programmatically through the documented `.comp`
      directory format.
