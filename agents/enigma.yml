history:
  adoption-history:
    - >
      Enigma has unusually broad package-manager coverage for an open-source game: the
      input metadata lists packages for Homebrew, Debian, Ubuntu, Fedora, Alpine, Arch,
      Nix, MacPorts, openSUSE, and more. That breadth matches its cross-platform README,
      which discusses Windows, Mac OS X, Unix builds, and distribution packaging
      differences.
  package-nerd-significance:
    - >
      For package maintainers, Enigma is a classic open-source game package: it combines
      native code, SDL dependencies, large data and level packs, translations, and
      cross-platform build concerns. Its continued presence across many package managers
      makes it a useful example of a durable desktop game outside the usual
      terminal-tool ecosystem.
  project-history:
    - >
      The official README describes Enigma as a volunteer-developed puzzle game with
      influences from many game genres and more than 1000 original levels. The project
      is hosted on nongnu.org and in an official GitHub repository, with GPL licensing
      and a development mailing list for contributions.
    - >
      The change log shows Enigma reaching version 1.00 with major level-pack, scoring,
      translation, and cross-platform work, followed by later releases that added
      levels, translations, new game objects, level-author tools, and internal engine
      rewrites. Version 1.30 moved the project from SDL 1.2 to SDL 2.0 and listed 2606
      total bundled level variants across main levels, tutorials, Sokoball, Pentomino,
      Dejavu, and training content.
  related-projects:
    - >
      The official description connects Enigma to Oxyd on the Atari ST and Rock'n'Roll
      on the Amiga as design inspirations.
  sources:
    - https://www.nongnu.org/enigma
    - https://github.com/Enigma-Game/Enigma
    - https://raw.githubusercontent.com/Enigma-Game/Enigma/master/README
    - https://raw.githubusercontent.com/Enigma-Game/Enigma/master/CHANGES
    - https://formulae.brew.sh/formula/enigma
  summary:
    - >
      Enigma is a long-running free software puzzle game inspired by Oxyd on the Atari
      ST and Rock'n'Roll on the Amiga, centered on guiding a marble through landscapes
      to uncover matching Oxyd stones.
  timeline:
    - >
      2000s: Enigma established its 1.00 release line with cross-platform Unix, Windows,
      and Mac OS support, level-pack organization, translations, and score features.
    - '2015: Official GitHub repository created.'
    - >
      2020s: Version 1.30 change log lists the move to SDL 2.0, new translations, new
      objects, and 2606 total bundled level variants.
  usage:
    - >
      Players run the `enigma` executable and use the mouse to control the marble
      through puzzle landscapes. Developers and packagers build it from source with the
      Autotools flow described in the README and the project documentation.
