history:
  adoption-history:
    - >
      VectorCraft is distributed for macOS, Windows, and Linux and also has a browser
      build, command-line tooling, and native package formats. The supplied package
      metadata records its availability as the Homebrew cask `vectorcraft`.
  package-nerd-significance:
    - >
      VectorCraft is notable as an ambitious native Rust graphics package with an open
      JSON document format, exact curve booleans, multithreaded rendering, broad import
      and export support, and first-class automation. Its CLI, JSON control channel, and
      MCP server make desktop illustration functionality available to scripts and agents
      as well as GUI users.
  project-history:
    - >
      VectorCraft was created by the ArtCraft team as an open-source, clean-room vector
      editor built in Rust. Its design follows familiar professional illustration
      workflows while implementing drawing tools, path operations, live effects,
      typography, image tracing, artboards, and rendering in an independent codebase.
  related-projects:
    - >
      VectorCraft is the vector-illustration member of ArtCraft's Crafting Apps family,
      alongside PhotoCraft, FilmCraft, LightCraft, PdfCraft, EffectCraft, and
      DesignCraft. Its official materials identify SVG and PDF as first-class
      interchange formats and describe PDF-compatible AI import and export.
  sources:
    - 'Official Crafting Apps overview: https://getartcraft.com/apps'
    - 'Official product page: https://getartcraft.com/apps/vectorcraft'
    - 'Official releases: https://github.com/storytold/vectorcraft/releases'
    - 'Official repository and README: https://github.com/storytold/vectorcraft'
    - 'Package provenance: source_facts.package-manager and source_facts.provenance'
  summary:
    - >
      VectorCraft is an open-source vector-illustration editor written in Rust. It
      provides familiar pen and selection tools, path booleans, artboards, typography,
      live effects, tracing, and open-format import and export in desktop and browser
      builds.
  timeline:
    - '2026-10-02: The official GitHub release history records VectorCraft v0.1.0.'
    - >
      2026-10: The project advanced through several packaged releases while remaining
      under active development toward a stable professional vector workflow.
  usage:
    - >
      Users create and edit vector artwork through the desktop interface, exchange work
      through the native JSON-based format, SVG, and PDF, and export raster images for
      screens. Developers and automation systems can use the headless CLI, JSON control
      channel, or MCP server to draw, modify, render, and export documents.
