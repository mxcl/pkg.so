history:
  adoption-history:
    - >
      Impactor is distributed for macOS, Linux, and Windows, with the official README
      also documenting Homebrew and Flatpak availability. Its integrations target the
      broader alternative iOS application ecosystem, including SideStore, LiveContainer,
      AppSync, and pairing-file consumers.
  package-nerd-significance:
    - >
      Impactor packages a normally Xcode-centered signing and provisioning workflow into
      an open-source cross-platform utility. It is notable to package users because it
      joins Apple-account authentication, provisioning, code signing, device
      communication, tweak injection, and IPA installation in one desktop tool.
  project-history:
    - >
      Impactor began under the name PlumeImpactor and was subsequently renamed. The
      project implements iOS-family application signing and sideloading by reproducing
      the relevant parts of Xcode's certificate, provisioning-profile, entitlement, and
      device-registration workflow.
  related-projects:
    - >
      The official documentation describes interoperability with SideStore, AltStore,
      LiveContainer, AppSync, ipatool, ElleKit, apple-codesign-rs, and idevice.
  sources:
    - 'Official Impactor README: https://github.com/claration/impactor#readme'
    - >
      Official repository metadata notes that the project was formerly known as
      PlumeImpactor: https://github.com/claration/impactor
  summary:
    - >
      Impactor is an open-source, cross-platform utility for signing and sideloading
      applications onto iOS, iPadOS, tvOS, and supported Macs.
  timeline:
    - >
      The project was originally named PlumeImpactor; the official source does not give
      a reliable rename date.
  usage:
    - >
      Connect an Apple device, authenticate with an Apple account, and select an IPA to
      register the device, obtain signing material and a provisioning profile, sign the
      application, and install it. Free Apple developer accounts remain subject to
      Apple's seven-day signing and app-registration limits. The utility can also create
      pairing files and export P12 material for compatible applications.
