config-file-location:
  linux:
    - ~/.config/tropy
  macos:
    - ~/Library/Application Support/Tropy
  windows:
    - '%APPDATA%\Tropy'
credentials-file-location: null
history:
  adoption-history:
    - >
      Tropy is distributed for macOS, Windows, and Linux, including through Homebrew,
      winget, AUR, and Flatpak. Its training materials, institutional partnerships, and
      plugin ecosystem reflect adoption in archival and humanities-research workflows.
  package-nerd-significance:
    - >
      Tropy is notable as an open-source, Electron-based desktop application whose local
      project files, SQLite-backed data model, structured metadata, and plugin system
      make it useful beyond simple photo browsing. It occupies a specialized place
      alongside reference managers without attempting to be one.
  project-history:
    - >
      Tropy was developed as a separate application for organizing archival research
      photographs rather than adding that workflow to Zotero. The project was created at
      the Roy Rosenzweig Center for History and New Media at George Mason University
      with funding from the Andrew W. Mellon Foundation.
    - >
      The first public beta appeared in May 2017, followed by Tropy 1.0 in October 2017.
      Development continued with expanded metadata, media-format, project-portability,
      and plugin capabilities.
  related-projects:
    - >
      Zotero is closely related institutionally and historically, but Tropy focuses on
      describing and organizing research photographs rather than managing bibliographic
      references. Official plugins connect Tropy workflows with systems such as Omeka
      and IIIF.
  sources:
    - 'Official 1.0 announcement: https://tropy.org/blog/tropy-1-0-released'
    - 'Official documentation: https://docs.tropy.org/'
    - >
      Official project history:
      https://tropy.org/blog/platforms-and-audiences-or-why-tropy-is-not-zotero
    - 'Official repository: https://github.com/tropy/tropy'
  summary:
    - >
      Tropy is a free, open-source desktop application for organizing, describing, and
      annotating photographs taken during archival and other research.
  timeline:
    - '2017-05: First public beta released'
    - '2017-10: Tropy 1.0 released'
    - '2023: Tropy 1.13 introduced standard and advanced project types'
  usage:
    - >
      Researchers import photographs, group them into items and lists, attach structured
      metadata and notes, search their collections, and export material for use in other
      research systems. Projects remain locally managed, and backups should include the
      project, photographs, and Tropy user-data directory.
