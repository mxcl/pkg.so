history:
  adoption-history:
    - >
      BentoBox is distributed directly by its developer and through Homebrew Cask. Its
      official site describes a 14-day trial followed by a one-time license for two
      Macs.
  package-nerd-significance:
    - >
      BentoBox is notable to macOS package users as a native, commercially distributed
      answer to Microsoft PowerToys FancyZones, with reproducible installation through
      Homebrew.
  project-history:
    - >
      BentoBox's official release history begins with the public v0.7.0 release in July
      2024. Subsequent releases added multiple per-monitor layouts, keyboard navigation,
      free-form overlapping zones, per-Space layouts, localization, and more resilient
      display identification.
  related-projects:
    - >
      Microsoft PowerToys FancyZones is the explicitly cited inspiration and comparison
      point, although BentoBox is an independent macOS product.
  sources:
    - https://bentoboxapp.com/
    - https://bentoboxapp.com/fancyzones-for-mac
    - https://bentoboxapp.com/releases
  summary:
    - >
      BentoBox is a proprietary macOS window manager for drawing tiled or overlapping
      zones and snapping application windows into them.
  timeline:
    - '2024-07-28: Initial public v0.7.0 release'
    - '2025-12-18: BentoBox 1.0 released with free-form Windowed Mode and per-zone shortcuts'
    - '2025-12-24: Version 1.1.0 added per-Space layouts'
  usage:
    - >
      Users create layouts for individual displays and macOS Spaces, then place the
      focused window with drag gestures or keyboard shortcuts. The application requires
      macOS Accessibility permission to find, move, resize, and raise windows.
