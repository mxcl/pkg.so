id: brew:committed
display-name: committed
repo: null
docs:
  - https://github.com/crate-ci/committed/tree/master/docs
  - https://github.com/crate-ci/committed#readme
config-file-location:
  unix:
    - <git repo directory>/committed.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      committed is distributed as a Rust crate, as prebuilt binaries from GitHub
      releases, and as a pre-commit hook. The Homebrew input also records packaging
      across apk, MacPorts, Nix, and pacman, which is typical for small Rust CLIs that
      package managers can ship as single executables.
  package-nerd-significance:
    - >
      committed is package-nerdy because it treats commit history as a machine-checkable
      artifact. That is useful for projects whose release tooling, changelog generation,
      or review process depends on predictable commit messages.
  project-history:
    - >
      The project describes itself as enforcing commit standards for readability,
      consistent styling, and compatibility with programmatic processing. Its crates.io
      package history starts in 2019, and the README positions it as both a local CLI
      and an automation tool for pull requests and hooks.
  related-projects:
    - >
      committed overlaps with commitlint, Commitizen, Conventional Commits workflows,
      and pre-commit hook packaging.
  sources:
    - https://github.com/crate-ci/committed
    - https://raw.githubusercontent.com/crate-ci/committed/master/README.md
    - https://crates.io/api/v1/crates/committed
    - https://github.com/crate-ci/committed/releases/tag/v0.1.2
  summary:
    - >
      committed is a Rust CLI for checking Git commit history against style and
      processing rules.
  timeline:
    - '2019: crates.io records the first public `committed` release.'
    - '2019: GitHub releases include early 0.1.x binaries.'
    - '2026: crates.io records continuing 1.x releases.'
  usage:
    - >
      Common usage is to verify the latest commit, a branch range, or the commits in a
      pull request. The official README documents pre-commit integration, including a
      commit-msg hook that can use prebuilt release binaries.
related-packages:
  - id: brew:commitlint
    reason: >
      commitlint is the closest alternative when a JavaScript-based workflow and
      npm-distributed shareable commit conventions are preferable to committed's
      standalone Rust CLI.
    rel: alternative
    sources:
      - https://commitlint.js.org/
      - https://github.com/crate-ci/committed
  - id: brew:commitizen
    reason: >
      Commitizen complements committed by interactively creating standardized commits
      and deriving versions and changelogs, while committed can remain the independent
      history check in hooks or CI.
    rel: adjacent_workflow
    sources:
      - https://commitizen-tools.github.io/commitizen/
      - https://github.com/crate-ci/committed
tags:
  - cli
