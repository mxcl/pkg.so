id: brew:apache-polaris
display-name: Apache Polaris
repo: null
docs:
  - https://polaris.apache.org/docs
config-file-location:
  unix:
    - $PWD/config/application.properties
credentials-file-location: null
history:
  adoption-history:
    - >
      Early adoption centers on organizations and developers standardizing Apache
      Iceberg catalogs across multiple engines. The Homebrew package exposes
      `polaris-server` and `polaris-admin`, which makes local evaluation and development
      workflows easier for macOS and Linux users.
    - >
      Its package-manager footprint is still narrow in the supplied data: Homebrew is
      the only listed manager. That matches the project's early-stage history and keeps
      the adoption story focused on developer trials, local catalog testing, and Apache
      Iceberg ecosystem integration.
  package-nerd-significance:
    - >
      For package nerds, Polaris is interesting because it packages an infrastructure
      service from the modern lakehouse stack as a local CLI/server formula. It is not
      just a library dependency: the installed executables let users stand up the
      metadata layer that query engines need.
    - >
      It also shows Apache Iceberg's ecosystem maturing beyond table format libraries
      into independently packaged operational components.
  project-history:
    - >
      Polaris began as a vendor-originated Iceberg REST catalog implementation and
      entered the Apache ecosystem as Apache Polaris. Its project site describes the
      goal as an interoperable, open source catalog for Apache Iceberg, and the Apache
      repository hosts the server and admin CLI used by the Homebrew formula.
    - >
      Because Polaris targets the Iceberg REST catalog model, its history is tied to the
      wider move from single-engine table catalogs toward shared lakehouse metadata
      services. The project is young compared with Spark or Pulsar, so the reliable
      public history is still mostly about its Apache launch, Iceberg alignment, and
      early packaging.
  related-projects:
    - Apache Iceberg defines the table format and catalog APIs that Polaris targets.
    - >
      Apache Spark, Trino, Flink, and other Iceberg-capable engines are common clients
      for REST catalog deployments.
  sources:
    - https://github.com/apache/polaris
    - https://polaris.apache.org/
    - https://polaris.apache.org/docs
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      Apache Polaris is an open source catalog server for Apache Iceberg tables. In
      package-manager terms it is the server-side counterpart to Iceberg-aware engines:
      installing it gives administrators a local or deployable catalog service plus
      admin tooling rather than another query engine.
  timeline:
    - '2024: Apache Polaris emerges publicly as an Apache Iceberg catalog project.'
    - >
      2025: Homebrew formula data lists `apache-polaris` with `polaris-server` and
      `polaris-admin` executables.
    - >
      2026: Polaris remains a young Apache project with package history concentrated
      around Iceberg catalog evaluation.
  usage:
    - >
      Polaris is typically used to run an Iceberg REST catalog service and manage
      catalog entities through administrative tooling. Package users care most about
      quick local startup, reproducible server binaries, and compatibility with
      Iceberg-capable engines.
    - >
      The package installs two command-line entry points, `polaris-server` and
      `polaris-admin`, reflecting the split between running the service and
      administering it.
related-packages:
  - id: brew:lakekeeper
    reason: >
      Choose Lakekeeper when you want another standards-compatible Iceberg REST catalog
      with a Rust-native core; Polaris instead runs on Quarkus and is governed as an
      Apache project.
    rel: alternative
    sources:
      - https://polaris.apache.org/
      - https://polaris.apache.org/releases/1.8.0/configuration/configuring-polaris/
      - https://docs.lakekeeper.io/
  - id: brew:nessie
    reason: >
      Choose Nessie when Git-like branches and transactional catalog semantics are
      central; Polaris emphasizes Iceberg REST interoperability, governance, and
      credential vending.
    rel: alternative
    sources:
      - https://polaris.apache.org/
      - https://projectnessie.org/nessie-latest/
  - id: brew:apache-spark
    reason: >
      Spark is a documented Polaris client for creating, transforming, and querying
      Iceberg tables through a Polaris catalog.
    rel: adjacent_workflow
    sources:
      - https://polaris.apache.org/in-dev/unreleased/polaris-spark-client/
      - https://spark.apache.org/docs/latest/
  - id: brew:trino
    reason: >
      Trino can use Polaris as its Iceberg REST catalog while providing the distributed
      SQL query layer.
    rel: adjacent_workflow
    sources:
      - https://polaris.apache.org/guides/jdbc/
      - https://trino.io/docs/current/connector/iceberg.html
