id: cask:signal@beta
display-name: Signal Beta
repo: https://github.com/signalapp/Signal-Desktop
docs:
  - https://github.com/signalapp/Signal-Desktop#readme
  - https://support.signal.org/
  - https://support.signal.org/hc/en-us/articles/360007318471-Signal-Beta
config-file-location:
  macos:
    - ~/Library/Application Support/Signal Beta/
credentials-file-location:
  macos:
    - ~/Library/Application Support/Signal Beta/
history:
  adoption-history:
    - >
      Signal Desktop's initial invitation program opened as a public beta in April 2016.
      Signal continues to operate an official beta channel for people willing to accept
      service discontinuity while testing changes and reporting defects.
    - >
      The desktop beta installs separately from production and uses its own data
      directory, allowing testers to run stable and beta installations without replacing
      the production client.
  package-nerd-significance:
    - >
      Signal Beta exposes forthcoming desktop changes through an officially signed,
      separately packaged channel. It is particularly relevant to maintainers and
      testers who want early compatibility feedback without replacing their stable
      Signal installation.
    - >
      Because deleting the beta clears its separate message history, its distinct local
      profile is an important operational detail for upgrades, troubleshooting, and
      removal.
  project-history:
    - >
      Signal Desktop was announced in December 2015 as a linked Chrome application and
      moved from an invitation program to a public beta in April 2016. It became a
      standalone desktop application in 2017.
    - >
      The beta remains part of the same open-source Signal Desktop codebase as
      production, receiving changes earlier so feedback can improve their stability
      before general release.
  related-projects:
    - >
      The production Signal Desktop client is the stable channel built from the same
      official project.
    - >
      Signal's Android and iOS clients provide the primary mobile account to which the
      desktop beta is linked.
  sources:
    - https://github.com/signalapp/Signal-Desktop
    - https://signal.org/blog/signal-desktop
    - https://signal.org/blog/standalone-signal-desktop/
    - https://support.signal.org/hc/en-us/articles/360007318471-Signal-Beta
  summary:
    - >
      Signal Beta is the official prerelease channel of Signal Desktop, the open-source
      linked computer client for Signal's end-to-end-encrypted messaging and calling
      service.
  timeline:
    - '2015: The first Signal Desktop beta was announced.'
    - '2016: The desktop beta opened for public access.'
    - '2017: Signal Desktop became a standalone application independent of Chrome.'
    - 'Present: The separate beta channel continues to deliver changes before production.'
  usage:
    - >
      Users install Signal Beta separately, link it to Signal on Android or iOS, test
      forthcoming desktop behavior, and submit beta-specific feedback with debug logs or
      crash reports. Signal warns that beta users should tolerate possible service
      discontinuity.
related-packages:
  - id: cask:telegram
    reason: >
      Choose Telegram for cloud-synchronized chats, channels, bots, and a native
      open-source macOS client rather than a prerelease Signal testing channel.
    rel: alternative
    sources:
      - https://telegram.org/apps
      - https://telegram.org/faq
      - https://support.signal.org/hc/en-us/articles/360007318471-Signal-Beta
  - id: cask:whatsapp
    reason: >
      Choose WhatsApp when compatibility with its account ecosystem and native group
      calling is more important than testing Signal's prerelease privacy-focused client.
    rel: alternative
    sources:
      - https://www.whatsapp.com/download
      - https://faq.whatsapp.com/
      - https://support.signal.org/hc/en-us/articles/360007318471-Signal-Beta
  - id: brew:signal-cli
    reason: >
      Use signal-cli as a linked Signal device when automation through a command line,
      JSON-RPC, or D-Bus is needed alongside beta testing.
    rel: adjacent_workflow
    sources:
      - https://github.com/AsamK/signal-cli
      - https://github.com/AsamK/signal-cli/wiki
      - https://support.signal.org/hc/en-us/articles/360007320551-Linked-Devices
