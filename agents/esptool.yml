id: brew:esptool
display-name: esptool
repo: https://github.com/espressif/esptool
docs:
  - https://docs.espressif.com/projects/esptool/en/latest
config-file-location:
  linux:
    - /home/<user>/.config/esptool/esptool.cfg
  macos:
    - /Users/<user>/.config/esptool/esptool.cfg
  unix:
    - ./esptool.cfg
    - ~/esptool.cfg
    - ./setup.cfg
    - ./tox.ini
  windows:
    - c:\Users\<user>\AppData\Local\esptool\esptool.cfg
    - c:\Users\<user>\esptool.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      As ESP8266 and ESP32 boards became common in hobbyist, IoT, and embedded
      development, esptool became the packaging target for the host-side operation
      everyone needed: moving firmware images onto chips over serial. Its distribution
      through Homebrew and many Linux package managers mirrors its role as
      infrastructure rather than as an application.
    - >
      Espressif's documentation and repository describe a tool that spans flashing,
      provisioning, secure operations, eFuse management, remote serial ports, scripting,
      and chip-specific targets. That breadth made it a dependency under higher-level
      build systems as well as a direct CLI for firmware developers.
  package-nerd-significance:
    - >
      esptool is one of those packages that quietly defines an ecosystem: if an OS
      package set wants embedded developers to flash ESP boards without a vendor IDE, it
      ships esptool. Its Python implementation, cross-platform serial behavior, and
      explicit config-file search paths make it easy to package and script.
  project-history:
    - >
      The official repository says esptool was initially created by Fredrik Ahlberg and
      later maintained by Angus Gratton; it is now supported by Espressif Systems and
      has received community improvements. That history reflects its move from community
      ESP8266 tooling into the vendor-supported flashing utility for the broader
      Espressif chip family.
  related-projects:
    - >
      espflash cites esptool.py as an influence; ESP-IDF build and monitor workflows
      commonly sit next to esptool in Espressif development setups.
  sources:
    - https://github.com/espressif/esptool
    - https://docs.espressif.com/projects/esptool/en/latest/esp32/esptool/index.html
    - https://docs.espressif.com/projects/esptool/en/latest/esp32/esptool/basic-commands.html
    - >
      https://docs.espressif.com/projects/esptool/en/latest/esp32/esptool/configuration-file.html
  summary:
    - >
      esptool is Espressif's Python-based, platform-independent serial utility for
      flashing, provisioning, and interacting with Espressif SoCs.
  timeline:
    - >
      2010s: Community-created esptool becomes the standard serial bootloader utility
      for ESP8266 and ESP32 development.
    - '2016: Espressif-hosted documentation copyright period begins for the current docs site.'
    - >
      2020s: Espressif maintains esptool as the official multi-chip flashing,
      provisioning, and interaction utility.
  usage:
    - >
      The core workflow is `esptool write-flash`, where users provide a serial port and
      flash offsets plus one or more binary files. The documentation notes automatic
      chip detection for writing, serial transfer compression by default, erase behavior
      before writes, and options for skipping unchanged content or fast reflashing.
    - >
      The Homebrew package also installs companion commands such as `espefuse`,
      `espsecure`, and `esp_rfc2217_server`, so package users get both everyday flashing
      and lower-level provisioning, security, and remote serial helpers from the same
      source package.
related-packages:
  - id: brew:espflash
    reason: >
      Choose espflash when you prefer a Rust-native Espressif flasher and Cargo
      integration; its official project describes it as loosely based on esptool.py.
    rel: alternative
    sources:
      - https://github.com/esp-rs/espflash
      - https://github.com/espressif/esptool
  - id: brew:platformio
    reason: >
      PlatformIO invokes esptool underneath its Espressif upload workflow, so the two
      tools are useful together when diagnosing or reproducing the exact low-level flash
      command.
    rel: adjacent_workflow
    sources:
      - >
        https://docs.espressif.com/projects/esptool/en/latest/esp32/esptool/flashing-firmware.html
      - https://docs.platformio.org/en/latest/core/index.html
  - id: brew:esphome
    reason: >
      ESPHome generates firmware that can be installed with esptool, making esptool
      useful for manual first flashes and recovery outside ESPHome's normal upload
      command.
    rel: adjacent_workflow
    sources:
      - https://esphome.io/guides/getting_started_command_line/
      - https://docs.espressif.com/projects/esptool/en/latest/esp32/esptool/basic-commands.html
