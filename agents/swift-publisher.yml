history:
  adoption-history:
    - >
      Swift Publisher is distributed as a native commercial Mac application. Its
      official manual centers on template-assisted design and print-oriented workflows
      rather than a command-line or plugin ecosystem.
  package-nerd-significance:
    - >
      For package collectors, Swift Publisher represents the long-running class of
      Mac-only commercial productivity applications delivered as self-contained app
      bundles and curated through graphical cask managers.
  project-history:
    - >
      BeLight Software develops Swift Publisher as a page-layout and desktop-publishing
      application for macOS. The official documentation reviewed establishes the product
      lineage and vendor but provides too little reliable dated release history for a
      detailed chronology.
  related-projects:
    - >
      The application is part of BeLight Software's family of Mac design and publishing
      products.
  sources:
    - https://www.swiftpublisher.com/
    - https://www.swiftpublisher.com/support/manuals/Swift%20Publisher%20User%20Manual.pdf
  summary:
    - >
      Swift Publisher is BeLight Software's macOS application for designing and printing
      page-layout projects such as brochures, flyers, newsletters, and other
      publications.
  timeline:
    - >
      Swift Publisher 5: The application adopted the current major-version product
      identity shown by its app bundle and manual.
  usage:
    - >
      Choose a template or blank document, arrange text and graphical objects on pages,
      and export or print the finished publication. It targets users who need
      desktop-publishing controls without a full professional prepress suite.
