history:
  adoption-history:
    - >
      The project gained attention in the Next.js tooling niche because it encoded
      popular stack decisions around Drizzle, Prisma, Auth.js, Clerk, Lucia, Kinde,
      Shadcn UI, tRPC, Stripe, and Resend. Its README noted in 2026 that only critical
      bugs were being addressed while a rewrite was planned, which makes it more of a
      snapshot of the 2023-2024 full-stack Next.js scaffolding moment than a general
      framework.
  package-nerd-significance:
    - >
      Kirimase is package-nerd interesting because it is not just a generator: it is a
      curated map of what a TypeScript web stack looked like when Next.js App Router,
      Drizzle, tRPC, Shadcn UI, and Auth.js-style choices were converging.
  project-history:
    - >
      Kirimase's documentation describes the motivation as bringing some of the Ruby on
      Rails CLI feeling to Next.js, where the framework's flexibility can leave
      developers choosing and wiring many packages before application work begins. The
      GitHub repository was initialized on August 4, 2023, and early public releases
      followed in September 2023.
  related-projects:
    - >
      Kirimase is closely tied to Next.js, Drizzle ORM, Prisma, Auth.js, Clerk, Lucia,
      Kinde, Shadcn UI, tRPC, Stripe, and Resend.
  sources:
    - https://api.github.com/repos/vercel/kirimase/commits?per_page=1&page=434
    - https://api.github.com/repos/vercel/kirimase/releases?per_page=100
    - https://formulae.brew.sh/formula/kirimase
    - https://github.com/vercel/kirimase
    - https://github.com/vercel/kirimase/releases
    - https://kirimase.dev/
  summary:
    - >
      Kirimase is a TypeScript CLI for scaffolding full-stack Next.js applications and
      wiring common application choices such as ORMs, authentication, tRPC, UI
      components, payments, and email.
  timeline:
    - "2023-08-04: The GitHub repository's initial commit was authored."
    - '2023-09-01: GitHub release 0.0.4 was published.'
    - '2023-09-05: GitHub release 0.0.8 was published.'
    - '2024-06-23: GitHub release v0.0.58 was published.'
  usage:
    - >
      Developers run Kirimase inside a Next.js app to initialize project choices, add
      packages, or generate CRUD-oriented models, controllers, and views. The docs also
      describe headless command-line options introduced by v0.0.23 for non-interactive
      `init` and `add` workflows.
