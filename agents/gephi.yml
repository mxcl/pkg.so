config-file-location:
  linux:
    - <Gephi installation directory>/etc/gephi.conf
  macos:
    - /Applications/Gephi.app/Contents/Resources/gephi/etc/gephi.conf
  windows:
    - C:\Program Files\Gephi\etc\gephi.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Gephi is distributed as a desktop application for Windows, macOS, and Linux. Its
      official repository also documents community packaging through formats such as
      Homebrew, Flatpak, and Snap.
  package-nerd-significance:
    - >
      Gephi is notable in package ecosystems because it packages a substantial Java and
      OpenGL graph-analysis workstation rather than a small command-line utility. It
      also exposes a plugin platform and a reusable Gephi Toolkit for automated
      graph-processing applications.
  project-history:
    - >
      Gephi developed as an open-source, modular graph-visualization platform. Its
      desktop application is built on the Apache NetBeans Platform, while its
      visualization engine uses OpenGL and its functionality is divided into extensible
      modules.
    - >
      The project grew beyond interactive visualization to include graph import and
      export, layouts, filters, statistics, plugins, and the Gephi Toolkit, which makes
      core capabilities available to Java applications and command-line workflows.
  related-projects:
    - Gephi Lite provides a browser-oriented member of the Gephi project family.
    - Gephi Toolkit packages core Gephi modules for programmatic use.
    - Apache NetBeans Platform supplies Gephi's modular desktop foundation.
  sources:
    - https://docs.gephi.org/desktop/
    - https://gephi.org/
    - https://gephi.org/developers/
    - https://github.com/gephi/gephi#readme
  summary:
    - >
      Gephi is an open-source desktop platform for exploring, analyzing, and visualizing
      networks and other large graphs.
  timeline:
    - Gephi established a cross-platform desktop application and extensible plugin ecosystem.
    - >
      Gephi 0.9.3: Java began shipping with the application, removing the normal
      requirement for a separate Java installation.
  usage:
    - >
      Users import graph data, apply layouts and filters, calculate network statistics,
      inspect data interactively, and export visualizations. Developers can extend the
      desktop application with plugins or use Gephi Toolkit to automate graph-processing
      tasks.
