history:
  project-history:
    - >
      Technically, MLT provides a toolkit for broadcasters, video editors, media
      players, transcoders, web streamers, and related applications through ready-to-use
      tools, XML authoring components, and an extensible plugin API. Meltytech describes
      MLT as an engine that can author a multimedia composition, manipulate it, save it,
      reload it, and execute it for playback, streaming, or non-realtime encoding. That
      design gives MLT a package-manager niche broader than a single CLI: installing it
      supplies the `melt` renderer plus shared framework pieces used by desktop editors
      and headless media pipelines.
  sources:
    - https://formulae.brew.sh/formula/mlt
    - https://github.com/mltframework/mlt
    - https://raw.githubusercontent.com/mltframework/mlt/master/README.md
    - https://www.meltytech.com/
    - https://www.mltframework.org/
    - https://www.mltframework.org/projects/
  summary:
    - >
      MLT, the Media Lovin' Toolkit, is an open-source multimedia framework designed for
      television broadcasting and packaged for command-line and library use around the
      `melt` executable. The project site describes it as a framework for authoring,
      managing, and running multitrack audio/video compositions, and as the engine of
      non-linear video editors and other media applications.
  usage:
    - >
      Adoption is strongest in video-editing and broadcast-style workflows. The MLT
      projects page lists Flowblade, Kdenlive, Shotcut, Synfig Studio, OpenShot 1.x,
      Melted, and other applications or services using MLT. Meltytech also documents
      case-study deployments for video souvenirs, Wikimedia-oriented rendering, ETV
      India, SLAM!FM playout, and broadcast graphics. In practice, users encounter MLT
      directly through `melt` commands and indirectly when editors serialize projects to
      MLT XML and hand rendering or playback to the framework.
related-packages:
  - id: cask:shotcut
    reason: >
      Shotcut provides a full cross-platform nonlinear editing interface built on MLT,
      making it the strongest desktop companion for users who do not want to author
      `melt` pipelines directly.
    rel: adjacent_workflow
    sources:
      - https://www.mltframework.org/projects/
      - https://www.shotcut.org/FAQ/
  - id: cask:kdenlive
    reason: >
      Kdenlive uses MLT as its multimedia editing framework and adds a comprehensive KDE
      timeline, asset-management, effects, and rendering interface.
    rel: adjacent_workflow
    sources:
      - https://www.mltframework.org/projects/
      - https://kdenlive.org/about/
  - id: brew:ffmpeg
    reason: >
      FFmpeg supplies the codec, container, and conversion layer commonly used around
      MLT workflows for inspecting, transcoding, and preparing media before or after
      composition rendering.
    rel: adjacent_workflow
    sources:
      - https://www.mltframework.org/docs/
      - https://ffmpeg.org/documentation.html
