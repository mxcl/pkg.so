history:
  adoption-history:
    - >
      The benchmark expanded from Android and iOS in its preview era to macOS, Windows,
      and Linux in Geekbench ML 0.6. Primate Labs reported that companies including
      Samsung and NVIDIA were already using Geekbench AI by the 1.0 release.
  package-nerd-significance:
    - >
      Geekbench AI gives hardware enthusiasts and engineers a standardized way to
      compare inference performance across CPUs, GPUs, and dedicated accelerators. Its
      reporting of both speed and accuracy is important because reduced-precision AI can
      trade output quality for throughput; package users must also track benchmark
      versions and frameworks when comparing results.
  project-history:
    - >
      Primate Labs began developing a machine-learning benchmark around 2019. The first
      public preview, Geekbench ML 0.5, appeared in 2021 for Android and iOS and focused
      on cross-platform inference workloads.
    - >
      Geekbench ML 0.6 added Windows, macOS, and Linux in 2023. After further testing
      and community feedback, the suite was renamed Geekbench AI and reached version 1.0
      in August 2024.
  related-projects:
    - Geekbench
    - Geekbench Browser
    - Geekbench ML
  sources:
    - https://www.geekbench.com/ai/
    - https://www.geekbench.com/blog/2021/05/geekbench-ml-05/
    - https://www.geekbench.com/blog/2023/12/geekbench-ml-06/
    - https://www.geekbench.com/blog/2024/08/geekbench-ai/
    - https://www.geekbench.com/doc/geekbench-ai-workloads.pdf
  summary:
    - >
      Geekbench AI is Primate Labs’ cross-platform inference benchmark for measuring the
      speed and accuracy of machine-learning, deep-learning, and other AI workloads.
  timeline:
    - '2019: Work on the machine-learning benchmark began.'
    - '2021: Geekbench ML 0.5 became the first public preview on Android and iOS.'
    - '2023: Geekbench ML 0.6 added Windows, macOS, and Linux.'
    - '2024: The benchmark was renamed Geekbench AI and reached version 1.0.'
  usage:
    - >
      Developers use Geekbench AI to compare application performance across platforms;
      hardware engineers use it to evaluate architectural changes; enthusiasts use its
      browser database and charts to compare devices. Results cover multiple AI
      frameworks and execution backends and include per-test accuracy measurements
      alongside performance.
