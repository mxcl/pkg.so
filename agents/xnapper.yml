history:
  adoption-history:
    - >
      Xnapper is distributed as a free-to-use macOS application with a watermark and a
      one-time paid license to remove it. The product subsequently expanded to a
      browser-based editor and cloud-sharing workflow.
  package-nerd-significance:
    - >
      Xnapper is representative of polished indie macOS utilities that package
      screenshot capture, presentation styling, OCR-assisted redaction, and annotation
      into a focused native application. It is useful when raw operating-system
      screenshots need to become shareable assets with minimal manual layout work.
  project-history:
    - >
      Xnapper was established as a native macOS screenshot utility focused on
      automatically producing presentation-ready images. Its public changelog documents
      an active desktop release line by 2022, when annotation, window capture, automatic
      sensitive-data redaction, and configurable filenames were already present.
    - >
      The project later added a web editor, mockup frames, cloud storage, link sharing,
      and reusable web presets while continuing development of the macOS capture
      application.
  related-projects:
    - >
      Xnapper Web provides browser-based screenshot styling and sharing alongside the
      native macOS application.
  sources:
    - https://xnapper.com/
    - https://xnapper.com/blog/annotate-screenshot
    - https://xnapper.com/changelog
  summary:
    - >
      Xnapper is a native macOS screenshot application that automatically adds balanced
      backgrounds, padding, shadows, and presentation styling, with annotation and
      sensitive-text redaction tools.
  timeline:
    - >
      2022-10-15: The earliest entry retained in the official macOS changelog documents
      Xnapper 1.15.5 and its annotation, capture, and redaction features.
    - '2024-09-12: Xnapper Web received its initial release.'
    - '2024-12-18: The web product added cloud storage, shareable links, and custom presets.'
  usage:
    - >
      Users capture a region or window, then adjust the background, aspect ratio,
      padding, inset, corner treatment, shadows, and annotations before copying or
      exporting the result. Presets retain commonly used visual treatments.
    - >
      On-device text recognition can help redact email addresses and other sensitive
      text. Screen Recording permission is required for capture on macOS; the official
      changelog documents guidance and recovery behavior for that permission.
