history:
  adoption-history:
    - >
      Official installation docs list Homebrew, winget, source builds, and binary
      releases. The README also badges an npm package for @stacks/clarinet-sdk and an
      Open VSX extension, showing adoption beyond the standalone CLI.
    - >
      Homebrew reported 988 installs over the prior 365 days for clarinet, and the input
      metadata also lists winget packaging as HiroSystems.Clarinet.
  package-nerd-significance:
    - >
      Clarinet is a useful package-manager case because a blockchain developer workflow
      is distributed through multiple channels: Homebrew for Unix-like CLI installs,
      winget and binary archives for direct installs, npm for the SDK, and editor
      marketplaces for the VS Code integration.
  project-history:
    - >
      The public repository was created in 2020. Official Stacks documentation describes
      Clarinet as a development framework and Clarity runtime packaged as a command-line
      tool for smart contract understanding, development, testing, and deployment.
    - >
      The project expanded from a CLI into a suite that includes local devnet support,
      an interactive REPL, a JavaScript SDK/testing framework, and VS Code integration.
      By June 2026, GitHub releases had reached v3.21.0.
  related-projects:
    - Clarinet is tied to the Clarity smart contract language and the Stacks blockchain.
    - >
      The official docs point to LabSTX as a browser-based alternative and document
      Clarinet's SDK and VS Code extension as companion projects.
  sources:
    - https://github.com/stx-labs/clarinet#readme
    - https://docs.stacks.co/clarinet/overview.md
    - https://docs.stacks.co/reference/clarinet/cli-reference.md
    - https://api.github.com/repos/stx-labs/clarinet
    - https://api.github.com/repos/stx-labs/clarinet/releases
    - https://formulae.brew.sh/api/formula/clarinet.json
  summary:
    - >
      Clarinet is the Stacks ecosystem's command-line development framework and Clarity
      runtime for writing, testing, debugging, and deploying Stacks smart contracts.
  timeline:
    - '2020: GitHub repository created.'
    - '2026: v3.18.0 through v3.21.0 releases published in May and June.'
    - '2026: Homebrew formula metadata lists v3.21.0 as the stable version.'
    - '2026: Official docs list Homebrew, winget, source, and binary installation paths.'
  usage:
    - >
      Clarinet is used to create projects, add contracts, check syntax and types, run a
      console REPL, launch a local devnet, manage deployments, and write unit tests with
      the Clarinet SDK.
