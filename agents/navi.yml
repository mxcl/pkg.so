id: brew:navi
display-name: navi
repo: null
docs:
  - https://github.com/denisidoro/navi#readme
config-file-location:
  unix:
    - $NAVI_CONFIG
    - ~/.config/navi/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      navi has stronger adoption signals than most small terminal helpers in this batch:
      GitHub repository metadata consulted on 2026-07-01 showed more than 17,000 stars,
      and Homebrew analytics listed 4,169 installs over the preceding 365 days. It is
      packaged across several ecosystems, including Homebrew, Alpine, Fedora, MacPorts,
      Nix, Arch, and Scoop in the input package record.
  package-nerd-significance:
    - >
      navi is notable because it packages personal operational knowledge as versionable
      text. For package maintainers and terminal-tool collectors, it is an example of a
      CLI whose value is partly the binary and partly the shared data format and
      repositories around it.
  project-history:
    - >
      The GitHub repository was created on 2019-09-20. The README describes navi as an
      interactive cheatsheet tool for the command line and says it can be used as a
      command, shell widget, tmux widget, alias helper, or shell scripting tool.
    - >
      The project grew around an ecosystem of cheatsheet repositories. The companion
      `denisidoro/cheats` repository was created on 2020-03-15 and its README says navi
      prompts first-time users to download `.cheat` files from it.
  related-projects:
    - >
      fzf, skim, tldr pages, cheat.sh, cheat/cheat, shell widgets, and tmux integrations
      are the main adjacent tools and content sources.
  sources:
    - https://api.github.com/repos/denisidoro/cheats
    - https://api.github.com/repos/denisidoro/navi
    - https://formulae.brew.sh/formula/navi
    - https://github.com/denisidoro/cheats
    - https://github.com/denisidoro/navi
    - https://github.com/denisidoro/navi/blob/master/docs/cheatsheet/README.md
    - https://github.com/denisidoro/navi/releases
    - https://news.ycombinator.com/item?id=30925843
  summary:
    - >
      navi is a Rust command-line cheatsheet browser that lets users search command
      snippets, fill arguments interactively, and execute the result. It sits between
      shell history, snippet managers, and TLDR-style examples.
  timeline:
    - '2019-09-20: GitHub repository created.'
    - '2020-03-15: `denisidoro/cheats` community cheatsheet repository created.'
    - >
      2022-04-05: navi reached a Hacker News discussion with 132 points, reflecting
      broader terminal-tool visibility.
    - '2023-12-10: v2.23.0 released.'
    - '2025-01-29: v2.24.0 released.'
    - '2025-04-09: v2.25.0-beta1 prerelease published.'
  usage:
    - >
      Users run `navi` to browse cheatsheets, bind it as a shell widget for editable
      command insertion, or use tmux integration. The docs describe manually adding
      cheatsheets to the platform cheats path, using cheatsheet repositories, and
      querying TLDR or cheat.sh content with `navi --tldr <query>` and `navi --cheatsh
      <query>`.
related-packages:
  - id: brew:fzf
    reason: >
      Use fzf to build general-purpose fuzzy-selection pipelines; use navi when you want
      the documented cheatsheet format, prompted command arguments, and execution
      workflow built on top of fzf or skim.
    rel: adjacent_workflow
    sources:
      - https://github.com/denisidoro/navi#readme
      - https://github.com/junegunn/fzf#readme
  - id: brew:tlrc
    reason: >
      Choose tlrc for concise community-maintained tldr pages fetched through an
      official tldr client; choose navi for editable personal repositories, interactive
      variables, and direct command execution.
    rel: alternative
    sources:
      - https://github.com/denisidoro/navi#readme
      - https://github.com/tldr-pages/tlrc#readme
      - https://tldr.sh/tlrc/
  - id: brew:cheat
    reason: >
      Choose cheat for a focused personal and community cheatsheet viewer with its own
      sheet hierarchy; choose navi when fuzzy selection, prompted placeholders, and
      shell-widget insertion are central to the workflow.
    rel: alternative
    sources:
      - https://github.com/denisidoro/navi#readme
      - https://github.com/cheat/cheat#readme
