    - https://www.navicat.com/en/products/navicat-premium-lite
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Navicat Premium Lite is PremiumSoft's free, reduced-feature edition of its
      multi-database Navicat Premium desktop client.
  timeline:
    - '2024: PremiumSoft announced Navicat Premium Lite as a free edition of Navicat.'
    - '2026: Premium Lite remains available for Windows, macOS, and Linux.'
  usage:
    - >
      It is intended for basic graphical connection management, database browsing, data
      editing, and SQL work across supported database systems, with advanced Premium
      functionality omitted or limited.
