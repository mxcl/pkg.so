history:
  adoption-history:
    - >
      PremiumSoft made Premium Lite available without a paid license, lowering the entry
      barrier to the Navicat interface for basic multi-database work. It is distributed
      for Windows, macOS, and Linux.
  package-nerd-significance:
    - >
      Premium Lite gives package-manager users a no-cost entry in a product family
      otherwise associated with commercial licenses, while the Homebrew cask provides a
      repeatable macOS installation path.
  project-history:
    - >
      PremiumSoft announced Navicat Premium Lite in 2024 as a free edition of Navicat
      Premium. It retains a reduced set of the flagship application's
      database-management and development capabilities.
  related-projects:
    - Navicat Premium
    - Navicat for PostgreSQL
    - Navicat for SQL Server
    - Navicat for SQLite
  sources:
