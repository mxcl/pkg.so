history:
  adoption-history:
    - >
      Lab spread through developer package managers such as Homebrew, Nix, Scoop,
      Alpine, and MacPorts because it solved a practical terminal gap for GitLab users:
      creating and reviewing merge requests, issues, and CI state without switching to
      the browser.
    - >
      Its GitHub repository retained a modest but real community footprint, with more
      than a thousand stars and release artifacts for multiple platforms on the public
      release page.
  package-nerd-significance:
    - >
      Lab is useful package-manager history because it captures a period when Git
      hosting sites had uneven first-party CLI support. GitHub had hub and later gh;
      GitLab users often reached for community tools like lab before GitLab's own glab
      project became prominent.
    - >
      The package also shows how CLI tools track hosted-service APIs: a small local
      binary becomes valuable only when it keeps up with merge-request, issue, token,
      and CI behavior on a remote platform.
  project-history:
    - >
      The project presents itself as `git + GitLab`: a Go command-line utility designed
      to make GitLab repository work feel close to normal Git usage. The README
      emphasizes a simple interface for GitLab API commands and WebUI-like messages and
      errors.
    - >
      Lab originally described itself as wrapping Git or Hub, but later release notes
      document removal of hub support and references to `glab`, showing the project
      adjusting as GitLab CLI tooling matured around it.
  related-projects:
    - GitLab's `glab` is the closest related project and became the official GitLab CLI line.
    - >
      GitHub's `hub` is historically relevant because Lab described itself as wrapping
      Git or Hub and later removed hub support.
    - >
      python-gitlab and go-gitlab are adjacent API-client ecosystems used by GitLab
      automation tools.
  sources:
    - https://github.com/zaquestion/lab
    - https://github.com/zaquestion/lab/releases
    - https://gitlab.com/gitlab-org/cli
    - https://raw.githubusercontent.com/zaquestion/lab/master/README.md
    - https://zaquestion.github.io/lab/
  summary:
    - >
      Lab is a community GitLab command-line tool that wraps Git and GitLab API
      workflows. It focuses on merge requests, issues, milestones, snippets, CI
      pipelines, repository cloning, and forking from the terminal.
    - >
      Its appeal was giving GitLab users a hub-like workflow before the GitLab-owned
      `glab` CLI became the obvious official comparison point.
  timeline:
    - >
      Pre-2022: Lab established itself as a community GitLab CLI distributed through
      multiple package managers.
    - '2021: Release notes for v0.20.0 referenced glab and tracked GitLab workflow fixes.'
    - '2021: Release notes for v0.21.0 documented dropping hub support.'
    - '2022: The GitLab-owned glab project was created on GitLab on March 21.'
    - '2022: Lab v0.25.x releases focused on merge-request lookup and Homebrew-related fixes.'
  usage:
    - >
      Users configure GitLab host and token details in lab.toml files, with user,
      worktree, and local-project locations. Commands can be run directly as `lab` or
      wired into Git aliases such as `git lab mr list`.
    - >
      Common workflows include cloning GitLab repositories, creating or listing merge
      requests, working with issues, viewing CI pipelines and jobs, and browsing project
      resources from the terminal.
related-packages:
  - id: brew:glab
    reason: >
      Choose GLab for GitLab's official, more opinionated CLI with current support for
      GitLab.com, Dedicated, and Self-Managed; choose Lab for the community tool's
      lighter, Git- and Hub-like workflow.
    rel: alternative
    sources:
      - https://github.com/zaquestion/lab#readme
      - https://docs.gitlab.com/editor_extensions/gitlab_cli/
