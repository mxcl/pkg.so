history:
  adoption-history:
    - >
      ScreenKite entered public beta by late 2025 and was initially positioned as a
      fast, native Mac alternative for people producing product demonstrations,
      tutorials, lessons, and client updates. It subsequently moved through a 1.0
      release and rapid feature expansion documented in its official changelog.
    - >
      The application is available through its developer’s signed and notarized download
      and through the Homebrew cask recorded in source_facts.package-manager. Official
      sources present it as a local-first application whose recordings remain on the Mac
      unless the user invokes sharing or an optional cloud-backed feature.
  package-nerd-significance:
    - >
      ScreenKite combines the polish of a commercial Mac recorder with tooling of
      particular interest to developers: native Swift and Metal implementation, project
      bundles, command-line and MCP-based agent editing, Final Cut Pro XML export, and
      Homebrew cask installation. It reflects the recent convergence of media
      applications with programmable AI-agent workflows.
  project-history:
    - >
      ScreenKite originated from its founders’ need to make frequent, quickly exported
      demonstrations of their own software. They built a native Mac recorder after
      finding existing products too costly, slow, or heavy for that workflow.
    - >
      A December 2025 official post described ScreenKite as a free beta focused on fast
      recording, fast export, low resource use, and automatic zoom. Its later 1.x
      releases broadened the product into a recorder, screenshot tool, multitrack
      editor, transcription system, and AI-assisted editing environment.
    - >
      The official guide now documents screen, window, region, audio-only, iOS-device,
      and camera capture; editing and caption workflows; screenshot utilities; agentic
      editing; sharing; and multiple export paths.
  related-projects:
    - Screen Studio
    - Final Cut Pro
    - WhisperKit
    - Claude Code
    - Codex
    - Homebrew Cask
  sources:
    - >
      Official AI workflow guide:
      https://www.screenkite.com/blog/how-to-use-screenkite-ai-editing
    - 'Official About page: https://www.screenkite.com/about'
    - >
      Official beta-era post:
      https://www.screenkite.com/blog/screenkite-fast-affordable-alternative-screen-studio
    - 'Official guide: https://www.screenkite.com/guide'
    - 'Official homepage: https://www.screenkite.com/'
    - source_facts.package-manager
  summary:
    - >
      ScreenKite is a native screen recorder and video editor created for fast
      production of demonstrations, lessons, tutorials, and other screen-based videos,
      with screenshot tools and optional AI-assisted editing.
  timeline:
    - '2025: ScreenKite was publicly documented as a free macOS beta.'
    - '2026: The 1.0 line established the post-beta editor and recording workflow.'
    - >
      2026: Subsequent releases added richer screenshots, transcription editing, agent
      integrations, sharing, and expanded export tooling.
  usage:
    - >
      Users choose a display, window, region, system-audio-only source, iOS device, or
      camera; optionally add microphone and webcam capture; record; then edit clips,
      zooms, captions, audio, backgrounds, and overlays before exporting or sharing.
    - >
      For optional ElevenLabs-backed transcription, ScreenKite’s official AI workflow
      guide instructs users to put ELEVEN_LABS_API_KEY in a `.env` file in the project
      directory. Local WhisperKit transcription is the documented key-free alternative.
