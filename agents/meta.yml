history:
  adoption-history:
    - >
      Meta is offered as a direct download and through commercial Mac distribution
      channels, while Homebrew users can install it through the `meta` cask. Its
      audience includes DJs, musicians, podcasters, and users maintaining local music
      collections.
  package-nerd-significance:
    - >
      Meta packages a TagLib-based metadata engine in a polished native Mac interface.
      It is notable to package users who need batch tagging across heterogeneous audio
      formats without constructing command-line pipelines, while still exposing advanced
      operations such as regular-expression replacement, filename-to-tag derivation, and
      CSV import.
  project-history:
    - >
      Nightbirdsevolve develops Meta as a native macOS music-tag editor. Official
      release notes document the 1.6 series in 2016, continued 1.x maintenance, the 2.x
      line by 2021, Discogs-backed Tag Finder integration in 2.1, and ongoing 2.x
      development.
  related-projects:
    - >
      Uses the open-source TagLib engine and integrates with Discogs for metadata
      lookup. It can refresh metadata in Apple Music and Doppler libraries.
  sources:
    - https://www.nightbirdsevolve.com/meta/
    - https://www.nightbirdsevolve.com/meta/releasenotes/
    - https://www.nightbirdsevolve.com/meta/support/
    - source_facts.package-manager
  summary:
    - >
      Meta is a native macOS editor for batch-editing audio tags, artwork, filenames,
      and directory layouts across common music and spoken-audio formats.
  timeline:
    - '2016: Meta 1.6 expanded editable tags and added Ogg Opus and WAV INFO support.'
    - '2021: Meta 2.1 introduced Discogs-backed Tag Finder functionality.'
    - '2023: Meta 2.2 added batch artwork importing based on filename patterns.'
    - '2025: Meta 2.3 introduced a more expressive field-oriented filter syntax.'
  usage:
    - >
      Users open one or more audio files, select tracks, and edit shared metadata in
      batches. Meta automatically commits field edits and supports undo.
    - >
      Common workflows include fetching tags and cover art from Discogs, renaming files
      from metadata patterns, deriving tags from paths or CSV files, numbering tracks,
      applying regular-expression replacements, and refreshing a music library after
      edits.
