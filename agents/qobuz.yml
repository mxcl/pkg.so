history:
  adoption-history:
    - >
      Qobuz expanded from its French origins into an international service aimed at
      listeners interested in lossless and high-resolution audio. Its official press
      material emphasizes partnerships with hi-fi hardware ecosystems and certification
      by the Japan Audio Society.
    - >
      The service broadened access through desktop, mobile, television, automotive,
      web-player, AirPlay, Chromecast, manufacturer integrations, and Qobuz Connect
      support.
  package-nerd-significance:
    - >
      Qobuz is a proprietary subscription client rather than an open-source package.
      Package-manager users care primarily about repeatable installation of the official
      desktop application and avoiding unofficial download sources.
    - >
      For audio enthusiasts, Qobuz is notable for combining lossless and high-resolution
      streaming with downloadable purchases, offline playback, editorial metadata, and
      integration with dedicated hi-fi equipment.
  project-history:
    - >
      Qobuz was founded in France by Yves Riesel and Alexandre Leforestier and launched
      in September 2007 as a commercial music download and streaming service.
    - >
      The company differentiated its service around sound quality, editorial curation,
      digital booklets, and artist and album documentation. Its official 2017 press book
      described CD-quality and high-resolution streaming and downloads as central to the
      product.
  related-projects:
    - >
      Qobuz integrates with third-party playback ecosystems including Sonos, AirPlay,
      Chromecast, Android Auto, Apple CarPlay, and compatible Qobuz Connect devices.
    - >
      Its service spans the Qobuz desktop and mobile applications, web player, download
      store, and supported hi-fi hardware.
  sources:
    - >
      https://help.qobuz.com/en/articles/10133-is-it-possible-to-listen-to-music-without-internet-connection
    - https://help.qobuz.com/en/articles/602448-how-to-listen-to-qobuz
    - https://static.qobuz.com/uploads/cms/files/presse/EN/Qobuz-PressBook_2017-EN.pdf
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Qobuz is a French-origin commercial music service focused on lossless and
      high-resolution streaming, downloads, and editorial music information.
  timeline:
    - '2007: Yves Riesel and Alexandre Leforestier found Qobuz.'
    - 'September 2007: Qobuz launches in France.'
    - >
      2017: Qobuz marks its tenth anniversary while promoting international
      high-resolution streaming.
  usage:
    - >
      On Mac and Windows, users stream through the desktop application or web player;
      supported subscriptions can download albums, tracks, and playlists in the
      application for offline listening.
    - >
      Qobuz also supports mobile, television, automotive, AirPlay, Chromecast,
      manufacturer-native, and Qobuz Connect playback. Users sign in with a Qobuz
      account, but no official local credential-file location is documented.
