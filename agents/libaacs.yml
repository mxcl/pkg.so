id: brew:libaacs
display-name: libaacs
repo: https://code.videolan.org/videolan/libaacs
docs:
  - https://www.videolan.org/developers/libaacs.html
config-file-location: null
credentials-file-location:
  unix:
    - ~/.config/aacs/KEYDB.cfg
history:
  adoption-history:
    - >
      The library was adopted by Unix media stacks because VLC, FFmpeg-adjacent
      workflows, and Blu-ray playback tools needed a packaged AACS implementation. Its
      no-keys policy made it easier for repositories to carry the library while leaving
      key databases and certificates outside the package.
  package-nerd-significance:
    - >
      libaacs is a classic packaging boundary case: the code is useful and free, but the
      practical playback story depends on data the project intentionally does not
      distribute.
  project-history:
    - >
      VideoLAN presents libaacs as a research project for understanding AACS through an
      open-source library, developed mainly by an international group of Doom9
      developers. The project sits near libbluray in the VideoLAN media stack, filling
      the AACS layer needed by players and tools.
  related-projects:
    - >
      Related projects include VLC, libbluray, libbdplus, Doom9 community research, and
      the AACS specification maintained by AACS LA.
  sources:
    - https://code.videolan.org/videolan/libaacs
    - https://download.videolan.org/pub/videolan/libaacs/0.11.0/
    - https://download.videolan.org/pub/videolan/libaacs/0.11.1/
    - https://www.videolan.org/developers/libaacs.html
  summary:
    - >
      libaacs is VideoLAN's free-software research implementation of the Advanced Access
      Content System used by Blu-ray media. It deliberately ships code, not title keys
      or device certificates, which is central to how distributions package it.
  timeline:
    - >
      2010s: VideoLAN hosted libaacs as an open implementation of AACS and linked it
      from the VideoLAN projects list.
    - '2020-07-23: VideoLAN published the 0.11.0 source tarball.'
    - '2022-02-27: VideoLAN published the 0.11.1 source tarball.'
  usage:
    - >
      Users normally install libaacs as a runtime support library for Blu-ray playback
      or diagnostics, while packagers expose aacs_info for inspection. Encrypted-disc
      playback still depends on separately supplied legal keys or certificates.
related-packages:
  - id: brew:libbluray
    reason: >
      Use libbluray alongside libaacs when an application needs Blu-ray navigation,
      playlists, menus, or BD-J in addition to AACS processing.
    rel: adjacent_workflow
    sources:
      - https://www.videolan.org/developers/libaacs.html
      - https://www.videolan.org/developers/libbluray.html
