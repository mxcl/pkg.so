history:
  adoption-history:
    - >
      ASF has one of the stronger adoption stories in this batch: the official
      repository had many thousands of stars and forks by 2026, official releases,
      Docker images, a winget package, and a Homebrew formula. The README also links a
      Steam group, Discord, statistics, WebConfigGenerator, localization, and a large
      GitHub wiki, all signs of a long-running user community.
    - >
      The package-manager appeal is direct: Steam card farming and account automation
      are long-running tasks, so a packaged CLI that can be installed, configured once,
      and run as a service is more useful than a one-off desktop helper.
  package-nerd-significance:
    - >
      ASF is a package-nerd classic because it turns an unofficial but highly practical
      gaming workflow into a daemon-like, cross-platform CLI/service package.
    - >
      It also shows how a niche automation project evolves packaging gravity: config
      schema, generated config UI, wiki, Docker, winget, Homebrew, plugin templates, and
      persistent per-bot state all orbit the core executable.
  project-history:
    - >
      The public GitHub repository was created on 2015-10-25. Its README describes the
      original purpose as farming Steam cards from multiple accounts simultaneously and
      explicitly contrasts ASF with Idle Master: ASF does not require the Steam client,
      does not launch fake game processes, and is intended to run on servers or
      desktop-less machines.
    - >
      Over time ASF grew beyond card idling into a larger Steam power-user daemon, with
      Steam authenticator support, chat logging, trading helpers, a plugin system,
      IPC/UI configuration, and broad Windows, Linux, and macOS support on .NET.
  related-projects:
    - The README credits SteamKit2 as the library that makes ASF possible.
    - >
      The README contrasts ASF with Idle Master as a single-account,
      Steam-client-dependent predecessor in the Steam card-idling space.
  sources:
    - https://api.github.com/repos/JustArchiNET/ArchiSteamFarm
    - https://api.github.com/repos/JustArchiNET/ArchiSteamFarm/releases
    - https://github.com/JustArchiNET/ArchiSteamFarm
    - https://github.com/JustArchiNET/ArchiSteamFarm/wiki/Configuration
  summary:
    - >
      ArchiSteamFarm, usually ASF, is a cross-platform C#/.NET Steam automation tool
      best known for farming Steam trading cards across many accounts without running
      the Steam client.
  timeline:
    - '2015-10-25: GitHub repository created.'
    - >
      2024-08-08: Earliest release returned in the current GitHub releases API page for
      this batch, 6.0.6.2.
    - '2026-05-24: Latest GitHub release observed for this batch, 6.3.6.1.'
  usage:
    - >
      Users configure ASF through a `config` directory. The wiki says global process
      configuration is `ASF.json`, while each bot account has a `BotName.json`; a bot
      represents one Steam account. The same directory also stores bot databases such as
      `BotName.db`.
    - >
      Credential-sensitive fields include `SteamLogin` and `SteamPassword` in bot
      config, while login keys are stored in `BotName.db`. The wiki explicitly notes
      that login keys let ASF avoid repeatedly asking for password, Steam Guard, or 2FA
      after a successful login.
