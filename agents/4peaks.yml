history:
  adoption-history:
    - >
      Nucleobytes describes 4Peaks as an award-winning application and records an Apple
      Design Award in 2004, indicating early recognition among scientific Mac
      applications.
  package-nerd-significance:
    - >
      4Peaks represents a specialized class of macOS scientific desktop software
      distributed as a Homebrew cask: a narrow laboratory tool made reproducibly
      discoverable and installable through a general-purpose package manager.
  project-history:
    - >
      4Peaks was developed as a native Mac application for viewing and editing DNA
      sequencing trace files. Its official page identifies version 1.8 and records an
      Apple Design Award in 2004.
  related-projects:
    - >
      The application integrates a workflow for submitting nucleotide sequences to NCBI
      BLAST, but it is not an NCBI project.
  sources:
    - 'Official 4Peaks product page: https://nucleobytes.com/4peaks/'
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      4Peaks is a macOS DNA sequence trace viewer and editor from Nucleobytes, aimed at
      molecular-biological inspection of sequencing output.
  timeline:
    - '2004: Received an Apple Design Award.'
    - 'Version 1.8: Official product page lists support for OS X 10.7 and later.'
  usage:
    - >
      Researchers use 4Peaks to open AB1 and SCF trace files, inspect quality data, edit
      base calls, trim low-quality regions, translate nucleotide sequences, find motifs,
      initiate BLAST searches, and export publication-quality PDF figures.
