id: brew:pipx
display-name: pipx
repo: https://github.com/pypa/pipx
docs:
  - https://pipx.pypa.io/stable
config-file-location:
  unix:
    - ./pipx.toml
  windows:
    - .\pipx.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      pipx is distributed through multiple operating-system package ecosystems,
      including Homebrew, Debian, Ubuntu, Fedora/DNF, Alpine, MacPorts, Nix, and Scoop.
  package-nerd-significance:
    - >
      pipx applies Python virtual-environment isolation to command-line application
      installation. It gives package enthusiasts a clean alternative to globally
      installing Python applications with pip and avoids dependency conflicts between
      unrelated tools.
  project-history:
    - >
      pipx became a Python Packaging Authority project and developed into a
      cross-platform application installer centered on one isolated environment per
      package.
  related-projects:
    - >
      pip supplies Python packages and dependencies; venv provides the isolation
      primitive used by pipx; PyPI is pipx's default package source.
  sources:
    - https://github.com/pypa/pipx
    - https://pipx.pypa.io/stable/
    - source_facts.package-manager
  summary:
    - >
      pipx installs and runs Python command-line applications in isolated virtual
      environments while exposing their commands on the user's PATH.
  timeline:
    - 'PyPA era: pipx is maintained under the Python Packaging Authority.'
    - >
      Current releases: pipx supports persistent installs, temporary execution with
      `pipx run`, package injection, upgrades, and global-user operation.
  usage:
    - >
      Users commonly run `pipx install PACKAGE` for persistent command-line tools and
      `pipx run PACKAGE` for temporary execution. pipx accepts PyPI packages as well as
      other package sources supported by pip.
tags:
  - cli
  - package-management
  - pypa
  - python
  - virtual-environments
