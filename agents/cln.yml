history:
  adoption-history:
    - >
      CLN is closely associated with GiNaC, whose website lists CLN as related software
      and whose symbolic-computation focus explains why an arbitrary-precision numeric
      substrate mattered. CLN's own manual notes that its numeric subtypes match Common
      Lisp number types, so CLN can serve Common Lisp implementations as well as C++
      mathematical software.
    - >
      The official CLN page points users to Debian, Fedora, openSUSE, and other
      distribution packages, while the batch input records packaging across Alpine,
      Homebrew, Debian/Ubuntu as `libcln-dev`, Fedora, MacPorts, Nix, Arch, Winget, and
      openSUSE.
  package-nerd-significance:
    - >
      CLN matters to package maintainers because it is a compiled C++ numeric library
      with ABI, compiler, architecture, and GMP concerns. The NEWS history repeatedly
      calls out portability fixes for CPU architectures, GCC versions, MinGW, ARM,
      AArch64, MIPS64, RISC-V, LoongArch, and cross-compilation.
    - >
      Its 1.1.0 move into namespace `cln`, separate headers, and dependence on installed
      GMP version 3 or newer are classic downstream packaging events: they changed
      include paths, source compatibility, and dependency expectations.
  project-history:
    - >
      CLN was written by Bruno Haible and is maintained by Richard B. Kreckel. The
      manual copyright history reaches back to Haible's 1988 work, and the official NEWS
      file records public 1.0-era releases beginning in January 1999.
    - >
      The library was designed around efficient numeric computation in C++: immediate
      small numbers, garbage collection, assembly kernels on selected CPUs, optional GMP
      low-level routines, Karatsuba multiplication, very-large-number algorithms, and
      binary splitting.
  related-projects:
    - >
      Related projects include GiNaC, GNU GMP, Common Lisp numeric systems, LiDIA, and
      mathematical C++ software that needs arbitrary-precision arithmetic.
  sources:
    - https://www.ginac.de/CLN/
    - https://www.ginac.de/CLN/cln.html
    - https://codeberg.org/ginac/cln
    - https://codeberg.org/ginac/cln/src/branch/master/NEWS
    - https://www.ginac.de/
  summary:
    - >
      CLN, the Class Library for Numbers, is a C++ library for arbitrary-precision
      integers, rationals, floats, complex numbers, modular integers, and univariate
      polynomials.
  timeline:
    - "1988: Manual copyright history begins with Bruno Haible's work."
    - '1999: CLN 1.0 released.'
    - '2000: CLN 1.1.0 moves identifiers into namespace `cln` and relies on installed GMP.'
    - '2008: CLN 1.2.0 adds huge-number support and C++ exceptions.'
    - '2009: CLN 1.3.0 switches to GNU autotools.'
    - >
      2019: CLN 1.3.5 adds build support for 64-bit MinGW, Elbrus 2000, RISC-V64, and
      MIPS release 6.
    - '2024: CLN 1.3.7 adds LoongArch support and ARM compilation fixes.'
    - '2026: Official Codeberg repository metadata is created for ginac/cln.'
  usage:
    - >
      Developers link CLN into C++ programs that need arbitrary-precision numeric types
      with algebraic operator syntax. The manual documents building with a C++11
      compiler, optional GMP support, namespace `cln`, and integration hooks for memory
      allocation and exceptions.
    - >
      The Homebrew package exposes the sample `pi` executable, but CLN's primary value
      is as a development library rather than an end-user CLI.
related-packages:
