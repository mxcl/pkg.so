credentials-file-location: null
history:
  adoption-history:
    - >
      PremiumSoft says the broader Navicat product family serves more than 180,000
      registered customers in 138 countries. Public product-specific adoption figures
      for Data Modeler are not provided.
  package-nerd-significance:
    - >
      The Homebrew cask makes a proprietary, cross-platform database-modeling
      application reproducibly discoverable and installable alongside open-source schema
      and migration tools.
  project-history:
    - >
      Navicat is developed by PremiumSoft, a company founded in 1999. Data Modeler
      emerged as the family’s specialized visual database-design product; version 3.0
      entered beta in 2019 with database synchronization, dark mode, and native Linux
      support, while the current version 4 documentation adds relational, dimensional,
      and Data Vault modeling.
  related-projects:
    - Navicat database clients
    - Navicat Cloud
    - Navicat On-Prem Server
  sources:
    - https://www.navicat.com/en/company/aboutus.html
    - >
      https://www.navicat.com/en/company/aboutus/blog/1251-introducing-navicat-data-modeler-3-0
    - https://www.navicat.com/en/products/navicat-data-modeler
    - https://www.navicat.com/manual/online_manual/en/navicat_data_modeler_4/mac_manual/
    - source_facts.package-manager
  summary:
    - >
      Navicat Data Modeler is PremiumSoft’s proprietary GUI for conceptual, logical, and
      physical database modeling, reverse and forward engineering, schema comparison,
      and SQL or DDL generation.
  timeline:
    - '1999: PremiumSoft, the developer of Navicat, was founded.'
    - '2019: Navicat Data Modeler 3.0 entered beta.'
    - '2025–2026: Navicat Data Modeler 4 is the documented current generation.'
  usage:
    - >
      Users visually design database structures, reverse-engineer existing databases,
      forward-engineer models, compare workspaces, and generate SQL, scripts, diagrams,
      and data dictionaries.
