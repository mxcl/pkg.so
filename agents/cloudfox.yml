history:
  adoption-history:
    - >
      CloudFox's adoption is concentrated in cloud offensive-security and assessment
      workflows rather than general cloud administration. Bishop Fox materials present
      it as a tool used in cloud penetration tests, and the public GitHub project shows
      a specialist but visible user base, with packaged distribution through Homebrew
      and Nix recorded in the batch input.
  package-nerd-significance:
    - >
      For package-manager users, CloudFox is a good example of a modern security
      assessment tool shipped as a cross-platform Go CLI: it is easy to bottle,
      distribute, and keep close to upstream releases. Its value in Homebrew is that a
      practitioner can install a cloud-enumeration toolkit without cloning a repository
      or managing language-specific runtime setup.
  project-history:
    - >
      Bishop Fox introduced CloudFox in September 2022 as a way to turn repeated shell,
      JSON, and cloud-API enumeration work from cloud penetration tests into a portable
      CLI. The official tool page describes the inspiration as something like PowerView
      for cloud infrastructure: a set of enumeration commands that reveal practical
      attack paths.
    - >
      The project kept the operational model simple for package users: a Go command-line
      executable with modular commands and GitHub-hosted documentation. By 2026, the
      CloudFox wiki described AWS, Azure, and GCP support, and Bishop Fox separately
      announced CloudFox GCP as a purpose-built module suite for Google Cloud
      attack-path identification.
  related-projects:
    - >
      CloudFox sits near other cloud security enumeration and attack-path projects, but
      its official materials particularly connect it to Bishop Fox's FoxMapper and to
      NCC Group's Principal Mapper, because CloudFox GCP can use graph-analysis data for
      privilege-escalation, lateral-movement, and data-exfiltration paths.
  sources:
    - https://bishopfox.com/blog/introducing-cloudfox
    - https://bishopfox.com/tools/cloudfox-tool
    - https://github.com/BishopFox/cloudfox#readme
    - https://github.com/BishopFox/cloudfox/wiki
    - >
      https://bishopfox.com/blog/introducing-cloudfox-gcp-attack-path-identification-for-google-cloud
    - https://github.com/BishopFox/cloudfox/releases
  summary:
    - >
      CloudFox is Bishop Fox's open-source command-line tool for cloud penetration-test
      situational awareness. It began as an AWS-focused offensive-security enumerator
      and later grew into a multi-cloud tool covering AWS, Azure, and GCP.
  timeline:
    - '2022: Bishop Fox introduced CloudFox as an AWS-focused cloud penetration-testing CLI.'
    - '2024: The GitHub wiki documented AWS command usage and examples.'
    - >
      2026: Bishop Fox announced CloudFox GCP, and the wiki described AWS, Azure, and
      GCP support.
    - '2026: GitHub releases listed CloudFox 2.x builds for Linux, macOS, and Windows.'
  usage:
    - >
      Users run CloudFox from the terminal against cloud environments to enumerate
      identities, permissions, resources, and likely attack paths. The official wiki
      documents provider-specific command families, including AWS command help and
      examples, while the README frames the tool as situational awareness for unfamiliar
      cloud environments.
related-packages:
  - id: brew:principalmapper
    reason: >
      Use Principal Mapper to build an AWS IAM graph that CloudFox's pmapper-aware
      commands can consume when reporting privilege-escalation paths.
    rel: adjacent_workflow
    sources:
      - https://github.com/BishopFox/cloudfox#readme
      - https://github.com/nccgroup/PMapper/wiki
  - id: brew:awscli
    reason: >
      Use AWS CLI profiles to establish the AWS authentication contexts that CloudFox
      can enumerate during an assessment.
    rel: adjacent_workflow
    sources:
      - https://github.com/BishopFox/cloudfox#readme
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html
