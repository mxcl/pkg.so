history:
  adoption-history:
    - >
      BootloadHID's adoption was mainly in the AVR hobbyist and small-device firmware
      world, where V-USB made USB possible on microcontrollers without dedicated USB
      hardware. The project was attractive on Windows because HID devices could use
      built-in OS support rather than a custom kernel driver.
  package-nerd-significance:
    - >
      BootloadHID is package-nerd significant as a tiny embedded tool that package
      managers keep alive after upstream release activity slowed. It represents the era
      of software-only USB on AVR parts and the practical value of HID-class protocols
      for avoiding driver installation.
  project-history:
    - >
      The official page presents BootloadHID as a USB boot loader for AVRs with at least
      a 2 kB bootloader section, including popular chips such as the ATmega8. The
      bootloader occupies the upper flash area, starts after reset, and either waits for
      USB upload when a configured hardware condition is met or jumps to the target
      firmware.
    - >
      Objective Development's release table shows public BootloadHID archives from June
      2007 through December 2012. Release notes mention code-size optimizations, fixes
      for larger flash devices, improvements ported from USBaspLoader, updates to the
      V-USB driver, and compatibility fixes for newer gcc/avr-libc.
  related-projects:
    - >
      Related projects include Objective Development's V-USB firmware-only USB stack,
      Thomas Fischl's avrusbboot, USBaspLoader, and third-party HID boot flash tools for
      Windows.
  sources:
    - https://www.obdev.at/products/vusb/bootloadhid.html
    - https://www.obdev.at/products/vusb/index.html
    - source_facts.package-manager
  summary:
    - >
      BootloadHID is Objective Development's HID-class USB bootloader for AVR
      microcontrollers using the V-USB software USB stack. Its history is narrow but
      useful: it solved the practical problem of updating small AVR firmware over USB
      without requiring custom kernel drivers on Windows.
  timeline:
    - '2007: First listed BootloadHID archive published by Objective Development.'
    - '2008: Releases add USBaspLoader improvements and code-size work.'
    - '2010: Release adds gcc 4 optimizations and a command-line utility option.'
    - '2012: Latest listed release updates the driver and fixes newer gcc/avr-libc builds.'
  usage:
    - >
      Users configure the boot condition and firmware settings in the source tree, flash
      the bootloader into the AVR boot section, reset the board into bootloader mode,
      and upload an Intel HEX file with the `bootloadHID` command-line tool. The
      host-side tool accepts the firmware image as its main argument.
related-packages:
