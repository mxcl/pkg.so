history:
  adoption-history:
    - >
      LGOGDownloader is packaged by Homebrew, Debian, Ubuntu, Fedora/DNF, Alpine, Nix,
      and related distro ecosystems. That adoption follows a clear Linux desktop niche:
      users with GOG libraries needed a non-Galaxy, non-browser way to list, download,
      verify, and archive purchased game files.
  package-nerd-significance:
    - >
      LGOGDownloader is significant because it turns a commercial game library into a
      package-like archive workflow: list metadata, select platforms/languages, fetch
      artifacts, verify or repair them, and keep them under user control. It is
      especially attractive to Linux users and preservation-minded game collectors.
  project-history:
    - >
      The project README describes LGOGDownloader as an unofficial downloader for
      GOG.com that uses the same API as GOG Galaxy. Its command set grew around
      practical ownership-library tasks: login, list games, filter by
      game/platform/language, download installers and extras, repair files, and inspect
      or install Galaxy builds.
    - >
      The tagged release line visible in the project repository runs from 2.x through
      3.x, with GitHub releases documenting continued maintenance through the 2020s. The
      3.x series reflects the ongoing need to track service-side changes in GOG/Galaxy
      while keeping a CLI workflow available.
  related-projects:
    - >
      LGOGDownloader is related to GOG.com, GOG Galaxy, libcurl, jsoncpp, librhash,
      tidy, tinyxml2, Boost, zlib, Qt WebEngine builds, and distro packages that expose
      game-library management tools.
  sources:
    - https://formulae.brew.sh/formula/lgogdownloader
    - https://github.com/Sude-/lgogdownloader
    - https://github.com/Sude-/lgogdownloader/releases
    - https://raw.githubusercontent.com/Sude-/lgogdownloader/master/README.md
    - https://sites.google.com/site/gogdownloader
  summary:
    - >
      LGOGDownloader is an unofficial open-source command-line downloader for GOG.com
      games. It exists for users who want scriptable access to purchased installers,
      extras, repair operations, and Galaxy API build metadata from Unix-like
      environments.
  timeline:
    - >
      Version 2.2: The repository contains tagged 2.x releases by this point in the
      public tag history.
    - '2021-08-25: LGOGDownloader 3.8 was published as a GitHub release.'
    - '2023-10-23: LGOGDownloader 3.12 was published as a GitHub release.'
    - '2024-12-22: LGOGDownloader 3.16 was published as a GitHub release.'
    - '2025-11-03: LGOGDownloader 3.18 was published as a GitHub release.'
  usage:
    - >
      Typical usage starts with `lgogdownloader --login`, then `--list`, `--download`,
      `--download-file`, `--repair`, or Galaxy build commands. Its config and credential
      state live under the XDG config directory, which makes it fit batch download and
      backup scripts.
