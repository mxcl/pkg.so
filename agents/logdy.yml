credentials-file-location: null
history:
  adoption-history:
    - >
      Logdy is young compared with the other packages in this batch. Official project
      materials frame it around local developer productivity rather than fleet-scale log
      aggregation: piping `tail -f`, Node.js, Docker, Kubernetes, journalctl, or
      application output into a browser UI.
    - >
      Package adoption is still narrow but visible: the supplied metadata records
      Homebrew and Nix packages, while the README documents Homebrew installation and
      direct binary downloads from GitHub releases.
  package-nerd-significance:
    - >
      Logdy represents the modern single-binary developer-tool pattern: a Go executable
      embeds a browser UI, ships cross-platform binaries, and becomes useful immediately
      through a pipe. Package managers make that workflow feel like installing grep or
      jq, even though the tool launches a local web app.
  project-history:
    - >
      The official README presents Logdy as a local, zero-dependency single binary with
      an embedded web UI. Its release history in GitHub begins in early 2024, and the
      README identifies v0.17.0 as the June 2025 release line.
    - >
      The project is implemented as a Go backend with embedded UI assets and can also be
      used as a Go library. Its release process publishes precompiled binaries for
      Linux, macOS, and Windows-style targets from GitHub releases.
  related-projects:
    - >
      tail, grep, awk, sed, jq, and less: command-line tools used by Logdy's README as
      workflow comparisons.
    - 'logdy-ui: the UI project embedded into the logdy-core binary.'
  sources:
    - https://github.com/logdyhq/logdy-core
    - https://github.com/logdyhq/logdy-core/releases
    - https://logdy.dev/docs/quick-start
    - https://logdy.dev/docs/reference/cli
    - source_facts.package-manager
  summary:
    - >
      Logdy is a lightweight single-binary log viewer that pipes terminal logs into a
      local web UI for real-time viewing, filtering, parsing, and exploration.
  timeline:
    - >
      2024: Early public GitHub releases begin, including v0.5.0 in February and v0.13.0
      in July.
    - '2025: v0.14.x, v0.15.0, v0.16.0, and v0.17.x releases are published.'
    - '2025: README identifies v0.17.0 as the June 1, 2025 latest-version announcement.'
  usage:
    - >
      Typical use is `tail -f file.log | logdy`, `logdy follow app-out.log --full-read`,
      or `logdy stdin "npm run dev"`. The web UI defaults to localhost port 8080, and
      the CLI supports modes for stdin, files, sockets, REST forwarding, demos, and
      utility operations.
    - >
      Logdy can accept an optional JSON UI config path with `--config`, but the path is
      user supplied rather than a documented default config-file location. It also
      exposes flags for an API key, UI password, append-to-file behavior, message buffer
      size, and analytics/update opt-outs.
related-packages:
  - id: brew:lnav
    reason: >
      Choose lnav for an entirely terminal-based interactive viewer with automatic
      format recognition and SQLite-backed analysis; choose Logdy when a local browser
      UI and streamed inputs are preferable.
    rel: alternative
    sources:
      - https://logdy.dev/docs/quick-start
      - https://docs.lnav.org/en/latest/
