history:
  adoption-history:
    - >
      Opal Composer serves owners of Opal C1 and Tadpole cameras who want processed
      video in conferencing and recording applications. Official migration guidance
      presents Composer as the successor to the original Opal application.
  package-nerd-significance:
    - >
      Opal Composer is a hardware companion package that installs a processed
      virtual-camera output in addition to controlling camera settings. Its preset
      storage, permissions, firmware interaction, and conferencing integration make it
      more than a simple device settings panel.
  project-history:
    - >
      Opal developed Composer as the macOS companion application for its webcams. It
      replaced the original Opal application and combines camera configuration, presets,
      image processing, firmware management, and a virtual video feed for other
      applications.
  related-projects:
    - >
      Opal Composer is designed for Opal C1 and Tadpole cameras. Video applications can
      choose either the camera's raw hardware feed or the processed Opal Composer feed.
  sources:
    - >
      Official conferencing guide:
      https://support.opalcamera.com/getting-started/fkAzVQUCbZUpDSf1awyP3k/using-your-opal-camera-in-video-conferencing-apps/rcqJpScnUj1ZXmE5KK9knb
    - 'Official help center: https://support.opalcamera.com/'
    - >
      Official migration guide:
      https://support.opalcamera.com/troubleshooting/8yMHf2r5pRgeudCv7Tieh8/uninstalling-the-original-opal-app-/45RztBqzifm4UvaFC7dAQd
    - >
      Official settings guide:
      https://support.opalcamera.com/getting-started/fkAzVQUCbZUpDSf1awyP3k/opal-composer-app-settings/ohDfrU174FBc7rMj1YBTbN
    - source_facts.description
  summary:
    - >
      Opal Composer is the macOS control and video-processing application for Opal
      webcams, including the C1 and Tadpole.
  timeline:
    - >
      2020s: Opal Composer replaced the original Opal application as the company's
      current webcam companion software.
    - >
      2026: Opal Camera became Opal Electronics and said its camera line would leave
      sale while receiving continued service and support.
  usage:
    - >
      Users connect an Opal camera, adjust resolution, framing behavior, antibanding,
      and other image settings, then select the Opal Composer virtual camera in
      conferencing or recording software to receive the processed feed. Selecting the
      hardware camera directly provides its raw feed.
