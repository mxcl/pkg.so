config-file-location:
  unix:
    - .darklua.json
    - .darklua.json5
    - .luaurc
credentials-file-location: null
history:
  adoption-history:
    - >
      The changelog shows an early 0.x evolution from basic processing rules into Luau
      support, bundling, sourcemap work, typed Luau handling, file watching, content
      loaders, and richer code-generation options. README badges point to crates.io
      packaging and GitHub release downloads.
  package-nerd-significance:
    - >
      darklua is notable in package catalogs because it connects Rust-distributed CLI
      tooling with the Roblox/Luau ecosystem, giving Lua projects a packageable
      transformer/minifier/bundler workflow similar to what JavaScript developers expect
      from build tools.
  project-history:
    - >
      The official README presents darklua as a configurable Lua and Luau transformer
      with a documentation site, browser try-it page, prebuilt GitHub releases, and
      installation instructions for Roblox-oriented toolchains such as Rokit and
      Foreman.
  related-projects:
    - >
      The README and docs connect darklua to Luau, Roblox, Rokit, Foreman, crates.io,
      full-moon, and Rojo-style sourcemap workflows.
  sources:
    - https://darklua.com/docs
    - https://github.com/seaofvoices/darklua
    - https://github.com/seaofvoices/darklua/blob/main/CHANGELOG.md
    - https://github.com/seaofvoices/darklua/releases
  summary:
    - >
      darklua is a Rust command-line tool for transforming Lua 5.1 and Roblox Luau code
      with configurable rules.
  timeline:
    - '0.1.0: Initial changelog entry.'
    - '0.5.0: Added Luau syntax support through full-moon.'
    - '0.10.0: Added path-require bundling and snake_case configuration.'
    - '0.16.0: Added .luaurc path alias reading for Luau configuration.'
    - '2026: v0.19.0 added content loaders and expanded file-processing support.'
  usage:
    - >
      Users run darklua to process or bundle Lua and Luau source trees. The docs say
      darklua auto-detects .darklua.json or .darklua.json5 in the current working
      folder, accepts an explicit --config path, and reads .luaurc data for Luau alias
      handling in relevant bundling modes.
related-packages:
  - id: brew:luau
    reason: >
      Use Luau to execute and statically analyze the Lua-derived source code that
      darklua transforms and bundles.
    rel: adjacent_workflow
    sources:
      - https://darklua.com/docs/
      - https://luau.org/getting-started/
  - id: brew:wally
    reason: >
      Use Wally to install Roblox packages, then map its generated Packages directory
      into darklua's documented bundling configuration.
    rel: adjacent_workflow
    sources:
      - https://darklua.com/docs/config/
      - https://github.com/UpliftGames/wally
