history:
  adoption-history:
    - >
      pgen launched as a free desktop client with no required account and optional
      bring-your-own-key AI. Its official material positions a future Pro offering
      around team synchronization and managed inference while keeping the core client
      free.
  package-nerd-significance:
    - >
      pgen represents the newer generation of database clients that combine traditional
      local SQL tooling with schema-aware AI while allowing users to supply their own
      model-provider credentials. Homebrew Cask offers a reproducible installation route
      for its macOS disk-image distribution.
  project-history:
    - >
      The Tragen team created pgen because it considered existing SQL clients too
      cumbersome and insufficiently keyboard-oriented. The product was designed around a
      real SQL editor, rapid schema navigation, visual query plans, searchable history,
      and optional AI grounded in the connected database's live catalog.
    - >
      The official 2026 field manual describes pgen as actively developed and available
      for macOS and Windows.
  related-projects:
    - >
      pgen connects to standard PostgreSQL services, including Supabase, Neon, AWS RDS,
      Google Cloud SQL, Azure Database, Timescale Cloud, Crunchy Bridge, DigitalOcean,
      and self-hosted installations.
    - >
      Optional AI integrations include OpenAI, Anthropic, Google Gemini, Ollama, and
      OpenAI-compatible endpoints.
  sources:
    - https://pgendb.com/
    - https://pgendb.com/docs
  summary:
    - >
      pgen is a keyboard-first desktop PostgreSQL client from Tragen with schema
      browsing, SQL editing, visual query analysis, import and export tools, and
      optional schema-aware AI.
  timeline:
    - >
      2026: pgen's public field manual documented the initial desktop product and active
      development.
  usage:
    - >
      Users connect with a PostgreSQL URL or individual connection fields, optionally
      through an SSH tunnel, then browse schemas and run SQL through a shortcut-oriented
      editor.
    - >
      AI assistance is optional and uses user-supplied provider keys. Prompts go
      directly from the local application to the selected provider, and database queries
      are not proxied through pgen's servers.
