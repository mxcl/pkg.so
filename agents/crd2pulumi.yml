history:
  adoption-history:
    - >
      The official installation section points users to repository-hosted binary
      releases and Pulumi's Homebrew tap. Supplied package facts also show Nix and
      Homebrew packaging, matching the tool's role in local infrastructure-development
      workflows.
  package-nerd-significance:
    - >
      crd2pulumi is packaging glue between Kubernetes API extension, language package
      generation, and Pulumi IaC projects. It matters because it turns CRD YAML, usually
      shipped by Kubernetes projects, into language-native SDK surfaces.
  project-history:
    - >
      Pulumi created crd2pulumi in 2020 to address a gap in its Kubernetes support:
      CustomResources were usable, but custom schemas meant users did not get strong
      typing, IDE checks, or autocomplete for popular CRDs.
    - >
      The README positions the tool around real-world CRD-heavy projects such as
      cert-manager and Istio, whose schemas can run to thousands of lines. The tool
      generates language-specific Pulumi bindings for .NET, Go, Java, Node.js, and
      Python.
  related-projects:
    - >
      The README ties crd2pulumi to Pulumi Kubernetes CustomResources and cites
      cert-manager and Istio as examples of complex CRD producers.
  sources:
    - https://github.com/pulumi/crd2pulumi
    - https://github.com/pulumi/crd2pulumi#readme
    - https://github.com/pulumi/crd2pulumi/releases/tag/v1.0.3
    - https://github.com/pulumi/crd2pulumi/releases/tag/v1.6.2
  summary:
    - >
      crd2pulumi is Pulumi's CLI for generating strongly typed Pulumi CustomResource
      classes from Kubernetes CustomResourceDefinition YAML.
  timeline:
    - '2020: pulumi/crd2pulumi repository created.'
    - '2020: v1.0.3 release published.'
    - '2026: v1.6.2 release published.'
  usage:
    - >
      Users pass one or more CRD YAML files or URLs to crd2pulumi and select target
      languages or output paths. The generated packages let Pulumi programs instantiate
      custom Kubernetes resources with typed arguments instead of untyped object maps.
related-packages:
  - id: brew:pulumi
    reason: >
      Pulumi consumes the typed resources generated by crd2pulumi and now provides the
      recommended provider-extension replacement through pulumi package add.
    rel: adjacent_workflow
    sources:
