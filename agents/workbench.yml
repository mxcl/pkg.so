history:
  adoption-history:
    - >
      Workbench was released as a notarized, automatically updating macOS application
      and later packaged as a Homebrew cask. Its scope remained deliberately focused on
      a single Mac and iCloud account rather than general multi-computer
      synchronization.
  package-nerd-significance:
    - >
      Workbench applies consumer cloud storage to a classic package-nerd concern:
      preserving dotfiles across clean operating-system installations. It is also
      historically interesting because its author, Max Howell, created Homebrew.
  project-history:
    - >
      Max Howell created Workbench as a macOS utility for continuously backing up
      selected home-directory dotfiles to private iCloud storage and restoring them
      after a clean installation.
  related-projects:
    - >
      Workbench addresses the same configuration-preservation problem as dotfile
      repositories and synchronization managers, but uses Apple's iCloud and does not
      provide revision control.
  sources:
    - 'Official README: https://github.com/mxcl/Workbench#readme'
    - source_facts.package-manager
  summary:
    - >
      Workbench is an open-source macOS utility for continuously backing up and
      restoring dotfiles through iCloud.
  timeline:
    - 'Project era: Released as a signed, notarized macOS application with automatic updates.'
  usage:
    - >
      Users select home-directory dotfiles for continuous iCloud backup and later
      restoration. The documented implementation is limited to one computer, requires
      manual conflict resolution, does not preserve permissions or revisions, and limits
      files to 1 MB.
