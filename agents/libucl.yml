history:
  adoption-history:
    - >
      UCL found its strongest adoption in systems and infrastructure software where
      maintainers wanted structured configuration without strict JSON's editing
      friction. Rspamd documents UCL as its configuration language, and the FreeBSD
      Handbook notes that some applications such as pkg(8) started using UCL.
    - >
      The library's package presence across Unix-like package managers reflects that
      adoption pattern: it is a small C parser and utility package that other software
      can embed or link for configuration parsing.
  package-nerd-significance:
    - >
      libucl is package-nerd interesting because it sits at the crossroads of
      config-language taste, Unix administration, FreeBSD tooling, and embeddable C
      libraries. It is a pragmatic alternative to forcing strict JSON into files humans
      edit by hand.
  project-history:
    - >
      The libucl README describes UCL as a configuration language heavily influenced by
      nginx-style configuration while remaining compatible with JSON. The library parses
      UCL and can also operate with JSON, MessagePack, S-expressions, and limited YAML
      output.
    - >
      Public tags show early 0.2.x releases in December 2013 and 0.7.x by February 2015.
      After a long 0.8-era gap, GitHub releases show renewed release activity in 2023
      and a 0.9 series beginning in February 2024.
  related-projects:
    - Rspamd is a major user and documentation source for the UCL syntax.
    - FreeBSD pkg(8) is cited by the FreeBSD Handbook as an application family using UCL.
    - >
      JSON, YAML, MessagePack, and nginx-style configuration are adjacent formats or
      influences named by the project documentation.
  sources:
    - https://docs.freebsd.org/en/books/handbook/config/
    - https://docs.rspamd.com/configuration/ucl/
    - https://github.com/vstakhov/libucl
    - https://github.com/vstakhov/libucl/releases
    - https://www.freshports.org/textproc/libucl
  summary:
    - >
      libucl is Vsevolod Stakhov's C library for Universal Configuration Language, a
      configuration syntax designed to be easier for humans to edit than strict JSON
      while remaining machine-readable and JSON-compatible.
  timeline:
    - '2013: Public tag 0.2.0 was created in December 2013.'
    - "2014: FreeBSD's ports tree added textproc/libucl in November 2014."
    - '2015: Public tag 0.7.2 was created in February 2015.'
    - '2023: GitHub releases page lists libucl 0.8.2 on January 8, 2023.'
    - '2024: GitHub releases page lists libucl 0.9.0 on February 1, 2024.'
  usage:
    - >
      Developers use libucl to parse configuration files with comments, unquoted keys,
      optional separators, implicit arrays, variables, macros, includes, human-friendly
      numeric suffixes, and validation. The README cautions that full-featured parsing
      with macros, includes, file I/O, and URL includes is intended for trusted
      administrator-controlled configuration rather than hostile input.
