history:
  adoption-history:
    - >
      Longplay expanded from its Apple-platform album-listening concept into a broader
      companion for Apple Music and locally synchronized libraries, with iCloud
      synchronization, CarPlay, Siri, Spotlight, Shortcuts, and later a native macOS
      edition.
  package-nerd-significance:
    - >
      Longplay is notable for rejecting the track-first and playlist-first conventions
      of most digital music software. Its artwork wall, whole-album filtering, unusual
      sorting metrics, automation hooks, and smart collections make it interesting to
      collectors and Apple-platform automation enthusiasts.
  project-history:
    - >
      Developer Adrian Schönig describes Longplay as a personal project rooted in his
      love of music and a family tradition of sharing favorite albums. It was designed
      to restore the experience of browsing and playing complete records inside modern
      Apple music libraries.
  related-projects:
    - Apple Music and the macOS Music app supply the underlying library.
    - >
      Apple Shortcuts, Siri, Spotlight, CarPlay, Last.fm, and ListenBrainz are supported
      integration surfaces.
  sources:
    - https://apps.apple.com/us/mac/story/id1882853976
    - https://longplay.rocks/
    - https://longplay.rocks/faq/
    - https://longplay.rocks/guide/ios/
  summary:
    - >
      Longplay is an album-oriented music player for Apple platforms. It filters a
      user's library toward complete or nearly complete albums and emphasizes visual
      browsing, rediscovery, collections, and uninterrupted full-album playback.
  timeline:
    - "2021: The copyright period shown on Longplay's official App Store listing begins."
    - '2.0: Collections, album queues, and infinite album shuffle were introduced.'
    - '2.2: Shortcuts actions and release-year sorting were introduced.'
    - '2.4: Smart Collections were introduced.'
    - >
      macOS edition: Longplay was reworked as a native desktop album player with
      AppleScript and automation support.
  usage:
    - >
      Users connect Longplay to an Apple Music, iTunes, or manually synchronized music
      library; browse the album-art wall; organize records into collections; and play or
      queue complete albums. It does not include music itself.
    - >
      Power users can automate playback and library queries with Shortcuts, Siri,
      Spotlight, AppleScript, or the macOS integration surfaces.
