id: brew:stern
display-name: stern
repo: null
docs:
  - https://github.com/stern/stern#readme
config-file-location:
  unix:
    - ~/.config/stern/config.yaml
credentials-file-location:
  unix:
    - ~/.kube/config
    - $KUBECONFIG
history:
  adoption-history:
    - >
      stern is distributed through direct GitHub releases, Go install, asdf, Homebrew,
      Krew, and WinGet according to its README, while the input package metadata also
      lists Linux and Windows package managers. That spread reflects its role as a
      routine Kubernetes operator tool rather than a single-platform utility.
  package-nerd-significance:
    - >
      Package maintainers care about stern because it is a classic CLI that wraps a
      noisy platform workflow into one executable, has shell-completion and config-file
      behavior, and is also a kubectl-plugin ecosystem citizen through Krew.
  project-history:
    - >
      The current stern project identifies itself as a friendly fork of the discontinued
      wercker/stern project. Its GitHub repository was created in 2020, and the README
      keeps the original purpose visible: tail matching Kubernetes pods, colorize
      output, and automatically follow pods as they appear or disappear.
  related-projects:
    - wercker/stern is the discontinued upstream named by the current fork.
    - kubectl and Kubernetes client-go are the surrounding command-line ecosystem.
    - Krew packages stern as a kubectl plugin.
  sources:
    - https://api.github.com/repos/stern/stern
    - https://github.com/stern/stern#readme
    - source_facts.package-manager
  summary:
    - >
      stern is a Kubernetes log-tailing CLI for following multiple pods and containers
      at once. In package-manager culture it is the small, sharp alternative to
      repeating kubectl logs commands while debugging workloads.
  timeline:
    - >
      2020: The current stern/stern GitHub repository was created as a fork of
      discontinued wercker/stern.
    - >
      2020s: The README documents installation through GitHub releases, Go install,
      asdf, Homebrew, Krew, and WinGet.
    - >
      2020s: stern standardizes on ~/.config/stern/config.yaml as the default config
      file path.
  usage:
    - >
      Typical use is interactive cluster debugging: users pass a pod regex or resource
      name such as deployment/nginx, optionally select namespaces or containers, and
      stream logs with colored pod/container labels. Its config file lets users set
      default flag values such as tail count, concurrency, timestamps, and colors.
tags:
  - cli
  - kubernetes
  - logs
  - observability
