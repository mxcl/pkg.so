history:
  adoption-history:
    - >
      Sherlock served iOS developers working with applications in Apple's Simulator. The
      official closing notice credits the people who tried the product and supplied
      feedback, but does not publish detailed adoption figures.
  package-nerd-significance:
    - >
      Sherlock is notable as a packaged macOS developer utility coupled closely to Xcode
      and iOS Simulator compatibility. Its closure demonstrates the maintenance burden
      borne by tools that must track changes in Apple's development environment.
  project-history:
    - >
      Inspired Code created Sherlock as an iOS Simulator visual debugger. The team later
      announced that the project was winding down because maintaining compatibility,
      particularly with Xcode 26, had become too complex for the resources available.
  related-projects:
    - >
      Sherlock operated alongside Apple's Xcode and iOS Simulator rather than replacing
      the application build toolchain.
  sources:
    - https://sherlock.inspiredcode.io/
    - source_facts.description
    - source_facts.homepage
  summary:
    - >
      Sherlock was an Inspired Code visual-debugging application for inspecting iOS
      applications running in Simulator. The official project site now states that
      development is winding down.
  timeline:
    - 'Product era: Inspired Code offered Sherlock as an iOS Simulator visual debugger.'
    - >
      2026: The official site announced that Sherlock was winding down, citing the cost
      of keeping pace with changes including Xcode 26.
  usage:
    - >
      Developers used Sherlock alongside an iOS application running in Simulator to
      investigate its visual interface. Because the official site now marks the project
      as winding down, compatibility with current or future Xcode releases should not be
      assumed.
