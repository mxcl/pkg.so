id: brew:icann-rdap
display-name: ICANN RDAP
repo: null
docs:
  - https://icann.github.io/icann-rdap
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/rdap/rdap.env
    - ~/.config/rdap/rdap.env
  macos:
    - ~/Library/Application Support/rdap/rdap.env
  windows:
    - '{FOLDERID_RoamingAppData}\rdap\config\rdap.env'
credentials-file-location: null
history:
  adoption-history:
    - >
      The wiki documents distribution through Homebrew for the `rdap` and `rdap-test`
      commands, prebuilt release binaries for mainstream Linux, macOS, and Windows
      targets, and `cargo install icann-rdap-cli` for Rust users. Homebrew, Debian,
      MacPorts, Nix, and openSUSE package mappings in the input show packaging beyond
      the ICANN repository itself.
  package-nerd-significance:
    - >
      This is notable because it packages a standards-body-adjacent network protocol
      client rather than a generic lookup script. It sits at the intersection of DNS
      operations, registrar data access, Rust CLI distribution, and the long transition
      from WHOIS-style text services to structured RDAP responses.
  project-history:
    - >
      The repository README says the software is written by the Internet Corporation for
      Assigned Names and Numbers for use with RDAP, an IETF-standard protocol whose
      extensions are handled in the IETF REGEXT working group. The legacy project wiki
      describes four Rust packages: `icann-rdap-cli`, `icann-rdap-client`,
      `icann-rdap-common`, and `icann-rdap-srv`.
    - >
      The project documentation moved from the GitHub wiki to a generated online user's
      manual. That migration reflects the tool's growth from repository notes into a
      documented CLI and library suite with installation, usage, and testing guidance.
  related-projects:
    - >
      Related work includes RDAP itself, the IETF REGEXT working group, ICANN's RDAP
      program, WHOIS tooling, and Rust crates used to build domain-registration data
      clients and tests.
  sources:
    - https://formulae.brew.sh/formula/icann-rdap
    - https://github.com/icann/icann-rdap
    - https://github.com/icann/icann-rdap/wiki
    - https://icann.github.io/icann-rdap/
    - https://www.icann.org/rdap
  summary:
    - >
      ICANN RDAP is ICANN's open-source implementation for the Registry Data Access
      Protocol, with command-line tools and Rust crates for RDAP clients, common data
      structures, and server work. In package-manager terms it is a modern
      successor-side tool for the domain registration lookup workflows historically
      associated with WHOIS.
  timeline:
    - >
      2015: IETF published RDAP's core RFC series, establishing the protocol family that
      this tool implements.
    - >
      2020s: ICANN RDAP appears as a Rust workspace with CLI, client, common, and server
      crates.
    - >
      2020s: Documentation moved from the project wiki to the generated ICANN RDAP Users
      Manual.
    - '2020s: Tags from v0.0.1 through v0.0.29 record ongoing packaged releases.'
  usage:
    - >
      The Homebrew formula installs the `rdap` client and `rdap-test` command. The
      intended use is querying RDAP services for domain and registry data, testing RDAP
      endpoints, and developing tooling around the ICANN-maintained Rust libraries.
related-packages:
  - id: brew:whois
    reason: >
      Choose whois when a registry or legacy workflow still requires the older port-43
      protocol; choose ICANN RDAP for standardized structured responses, HTTPS,
      internationalization, and authoritative bootstrapping.
    rel: alternative
    sources:
      - >
        https://www.icann.org/en/contracted-parties/registry-operators/resources/registration-data-access-protocol
      - https://github.com/rfc1036/whois
