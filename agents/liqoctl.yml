id: brew:liqoctl
display-name: liqoctl
repo: null
docs:
  - https://docs.liqo.io/en/latest/usage/liqoctl/liqoctl.html
config-file-location: null
credentials-file-location:
  unix:
    - ~/.kube/config
  windows:
    - '%USERPROFILE%\.kube\config'
history:
  adoption-history:
    - >
      Liqo's adoption evidence is clearest in Kubernetes-native contexts where teams
      want cluster peering and virtual-node style offloading without rewriting
      applications. Its public repository, documentation, Slack community, adopters
      file, and release assets show a project aimed at cloud, edge, research, and
      multi-cloud operators.
    - >
      Homebrew packages the CLI as liqoctl, separating the operator-facing command from
      the broader Liqo repository and making the tool easy to install on macOS and Linux
      workstations used to administer Kubernetes clusters.
  package-nerd-significance:
    - >
      liqoctl is one of the newer wave of Kubernetes administrative CLIs that package
      managers carry so users can manage cloud-native infrastructure from a local shell.
      It sits near kubectl plugins, cluster lifecycle tools, and service-mesh CLIs in
      the package taxonomy.
    - >
      For Homebrew users, it is notable because the formula packages a project-specific
      Kubernetes control plane tool rather than the server components themselves.
  project-history:
    - >
      Liqo describes itself as an open-source project for dynamic and seamless
      Kubernetes multi-cluster topologies across on-premise, cloud, and edge
      infrastructures. The project states that it was kicked off at the Polytechnic
      University of Turin and is maintained by the Liqo community.
    - >
      The CLI grew as the operational front door for that system: the documentation
      describes liqoctl as the tool used to install and manage Liqo-enabled clusters,
      with subcommands for install, peer, authenticate, offload, network, test,
      uninstall, and related cluster operations.
  related-projects:
    - >
      Liqo's repository notes code from Virtual Kubelet, which is conceptually related
      because Liqo represents remote cluster capacity through Kubernetes-native
      abstractions.
    - >
      The broader neighborhood includes kubectl, Kubernetes Cluster API, service-mesh
      and multi-cluster networking projects, and GitOps tooling used to manage
      declarative multi-cluster topologies.
  sources:
    - https://docs.liqo.io/en/latest/
    - https://docs.liqo.io/en/latest/usage/liqoctl/liqoctl.html
    - https://formulae.brew.sh/formula/liqoctl
    - https://github.com/liqotech/liqo
    - https://github.com/liqotech/liqo/releases
    - https://liqo.io/
  summary:
    - >
      liqoctl is the command-line entry point for installing and managing Liqo, an
      open-source Kubernetes multi-cluster project focused on resource sharing, workload
      offloading, inter-cluster networking, and storage across heterogeneous clusters.
  timeline:
    - >
      2019: Liqo project copyright notices begin at 2019 on the official site and
      documentation.
    - >
      2021: Public Liqo discussion and early release activity centered on Kubernetes
      multi-cluster resource sharing.
    - >
      2026: Liqo v1.1.2 was published on GitHub on March 3, 2026, with liqoctl release
      assets for Linux and macOS.
  usage:
    - >
      Operators use liqoctl to bootstrap Liqo into clusters, establish peerings,
      authenticate clusters, offload namespaces, inspect state, and remove Liqo
      resources. Its docs emphasize making multi-cluster behavior transparent to
      standard Kubernetes workloads.
    - >
      The CLI is package-manager-friendly because it is a single Go-built executable
      that talks to Kubernetes APIs and controls cluster-side components rather than
      embedding a long-lived desktop service.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Use kubectl alongside liqoctl to inspect and manage the Kubernetes resources and
      clusters that liqoctl configures; both use the standard kubeconfig access model.
    rel: adjacent_workflow
    sources:
      - https://docs.liqo.io/en/stable/installation/liqoctl.html
      - https://kubernetes.io/docs/reference/kubectl/
      - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
  - id: brew:helm
    reason: >
      Helm complements liqoctl when operators need to inspect or customize the
      chart-based installation that liqoctl orchestrates for Liqo components.
    rel: adjacent_workflow
    sources:
      - https://docs.liqo.io/en/v0.9.3/installation/install.html
      - https://helm.sh/docs/
