history:
  adoption-history:
    - >
      The official site positions PDFKey Pro for individuals and systems administrators
      on macOS and Windows. It is distributed as shareware and uses an emailed
      activation code to enable complete document processing.
  package-nerd-significance:
    - >
      PDFKey Pro is a narrowly focused security utility that combines a drag-and-drop
      desktop interface with command-line automation. It is relevant to package-manager
      users who need repeatable PDF permission and password-processing workflows without
      installing a full PDF editor.
  project-history:
    - >
      Bitgamma developed PDFKey Pro as a utility for removing PDF printing and copying
      restrictions, producing unlocked copies when the required opening password is
      supplied, and applying passwords and usage restrictions to PDFs. The product
      evolved through multiple major releases and added native Mac and Windows
      distributions plus automation tools.
  related-projects:
    - >
      PDFExtractor is another Bitgamma PDF utility using a similar desktop,
      batch-processing, command-line, and shareware model. General-purpose PDF editors
      and command-line PDF transformation tools offer overlapping protection features.
  sources:
    - https://pdfkey.com/en/
    - https://pdfkey.com/en/support/
  summary:
    - >
      PDFKey Pro is a commercial Mac and Windows utility for unlocking eligible
      password-protected PDFs, applying password protection and usage restrictions, and
      processing documents in batches.
  timeline:
    - '2022: PDFKey Pro 4.5.0 was released for Intel and Apple-silicon Macs as well as Windows.'
  usage:
    - >
      Users drag files or folders onto the Lock or Unlock controls. Unlocking printing
      or copying restrictions does not require the permissions password, but a PDF
      protected against opening requires its opening password. Locking allows users to
      set viewing and permissions passwords. Bundled command-line tools support scripted
      and bulk workflows, and the product explicitly does not remove ebook DRM.
