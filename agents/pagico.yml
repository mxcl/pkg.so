history:
  adoption-history:
    - >
      Pagico began as a Mac desktop application and expanded to Windows and Ubuntu with
      version 4 in 2009. The company announced an iPad companion, Pagico Plus, in 2011
      and later supported iOS and Android, creating a desktop-and-mobile workflow.
    - >
      Personal Cloud and team workspaces extended the locally stored database model with
      optional synchronization and collaboration. Pagico's broad desktop support,
      including Ubuntu, distinguishes it from many proprietary personal-productivity
      applications.
  package-nerd-significance:
    - >
      Pagico is notable to desktop package users as a long-running proprietary
      productivity application available across macOS, Windows, and Ubuntu. It combines
      a local database with optional cloud synchronization rather than requiring an
      exclusively web-hosted workflow.
    - >
      Its history also reflects the evolution of desktop organizers into cross-device
      project systems while retaining user-selectable local databases.
  project-history:
    - >
      NOTES 17 traces its application development to 2006, and a 2011 company
      retrospective said Pagico had begun nearly five years earlier. Early Pagico
      combined topics, contacts, schedules, notes, and linked information in a desktop
      organizer.
    - >
      Pagico 3 arrived for Mac in January 2008 with multiple databases,
      database-specific settings, file linking, AppleScript support, and schedule
      visualizations. Pagico 4 followed in September 2009 for Mac, Windows, and Ubuntu
      with a rewritten data layer, an Inbox, collections, a command-line component, and
      improved linking and calendar export.
    - >
      Later releases developed Pagico into an integrated task, note, document, project,
      and client manager with dashboards, timelines, day planning, automation, optional
      synchronization, and team workspaces.
  related-projects:
    - Pagico Mobile
    - Pagico Plus
    - Pagico Personal Cloud
    - Pagico for Teams
  sources:
    - https://help.pagico.com/ — official usage documentation.
    - https://www.pagico.com/ — official current product overview.
    - >
      https://www.pagico.com/blog/pagico-30-is-released.html — official Pagico 3 release
      history.
    - >
      https://www.pagico.com/blog/pagico-v4-0-is-now-officially-released-for-mac-windows-and-ubuntu.html
      — official cross-platform version 4 announcement.
    - >
      https://www.pagico.com/blog/pagicos-mobile-add-on-pagico-plus.html — official
      mobile history.
    - source_facts.description
  summary:
    - >
      Pagico is a proprietary cross-platform productivity application from NOTES 17 that
      organizes tasks, notes, files, projects, schedules, and contacts in local
      databases with optional synchronization and collaboration.
  timeline:
    - '2006: Development of Pagico began.'
    - '2008: Pagico 3 was released for Mac.'
    - '2009: Pagico 4 was released for Mac, Windows, and Ubuntu.'
    - '2011: NOTES 17 introduced the Pagico Plus mobile companion for iPad.'
    - '2019: Pagico 9 expanded visual planning and project-sharing workflows.'
    - '2024: Pagico added automated workflows.'
  usage:
    - >
      Individuals use Pagico to collect tasks, notes, documents, projects, contacts, and
      schedules, then review them through dashboards, timelines, tags, and a day
      planner. Users choose where to create each desktop database and can keep work
      local or enable Pagico's synchronization features.
    - >
      Teams can selectively share projects and contacts through workspaces. Pagico's
      official guidance warns against placing a database in Dropbox or Google Drive
      while simultaneously using its built-in synchronization, because competing
      synchronization mechanisms can corrupt data.
