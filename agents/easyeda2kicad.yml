history:
  adoption-history:
    - >
      The project is distributed as a Python package and is also packaged by Homebrew
      and Nix in the input metadata, reflecting adoption by users who want the converter
      available as a normal CLI rather than only as a cloned script.
  package-nerd-significance:
    - >
      Package maintainers care about easyeda2kicad because it sits at the boundary
      between web-hosted component catalogs and local EDA library files. Its
      dependencies, KiCad-version assumptions, and generated file layout all affect
      whether a packaged CLI actually drops useful artifacts into a designer's workflow.
  project-history:
    - >
      The public GitHub repository was created in January 2022 and describes the tool as
      converting LCSC and EasyEDA components into KiCad libraries. The README documents
      support for KiCad v6 and newer, generated symbol libraries, footprint directories,
      and 3D model output in WRL and STEP formats.
    - >
      By the 1.0.1 release in April 2026, release notes show a maturing converter with
      fixes for EasyEDA geometry edge cases, STEP 3D import, KiCad symbol naming,
      polygon/pad handling, and CI/tooling updates.
  related-projects:
    - >
      KiCad, EasyEDA, LCSC, and JLCPCB SMT assembly workflows are the adjacent ecosystem
      named by the project README.
  sources:
    - https://github.com/uPesy/easyeda2kicad.py
    - https://github.com/uPesy/easyeda2kicad.py/releases/tag/v1.0.1
  summary:
    - >
      easyeda2kicad is a Python command-line bridge between EasyEDA/LCSC component data
      and KiCad libraries. It matters in the KiCad packaging ecosystem because it
      automates the otherwise repetitive symbol, footprint, and 3D-model import work
      common in JLCPCB/LCSC-centered PCB workflows.
  timeline:
    - '2022: Public GitHub repository created.'
    - '2026: v1.0.1 release published with STEP import and numerous converter fixes.'
  usage:
    - >
      Typical use is to pass one or more LCSC part IDs and request symbols, footprints,
      3D models, or the full set. The README documents default output under a
      KiCad/easyeda2kicad library directory and optional project-relative 3D model paths
      for portable KiCad projects.
