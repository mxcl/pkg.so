history:
  adoption-history:
    - >
      Objective-See distributes TaskExplorer as an open-source macOS application, while
      Homebrew Cask supplies a package-managed installation route. Legacy releases
      remain available for older supported macOS generations.
    - >
      The application is aimed at security practitioners, administrators, developers,
      and advanced Mac users who need a richer live process view than the standard
      Activity Monitor provides.
  package-nerd-significance:
    - >
      TaskExplorer combines process inspection with code-signing status, loaded-library
      enumeration, open files, network connections, hashes, and optional VirusTotal
      lookups, making it useful for incident response and malware triage.
    - >
      Its command-line mode emits JSON and can enumerate or scan tasks programmatically.
      Version 3's system extension removes the earlier need to run command-line
      inspection as root after the extension has been installed and approved.
  project-history:
    - >
      TaskExplorer was created by Objective-See as an open-source visual
      process-inspection utility for macOS. Earlier versions enumerated tasks and
      associated artifacts through a traditional privileged workflow.
    - >
      Version 3 was a near-complete rewrite based on Apple's Endpoint Security
      framework. It added live process events, a Swift interface, expanded filtering and
      export, a system extension, and an optional assistant that can use Apple
      Intelligence or user-supplied model-provider credentials.
  related-projects:
    - >
      TaskExplorer belongs to Objective-See's collection of open-source macOS security
      utilities.
    - >
      VirusTotal integration can check executable hashes for known-malware detections;
      the optional assistant can instead use Apple Intelligence, Anthropic, or OpenAI.
  sources:
    - https://github.com/objective-see/TaskExplorer
    - https://github.com/objective-see/TaskExplorer/releases
    - https://objective-see.org/products/taskexplorer.html
  summary:
    - >
      TaskExplorer is Objective-See's open-source macOS utility for live inspection of
      running processes and their security-relevant resources.
  timeline:
    - >
      2022: The official release history records continued modernization of the version
      2 code line.
    - '2026: Version 3 is released as a near-complete Endpoint Security-based rewrite.'
  usage:
    - >
      After installation in `/Applications`, users approve the TaskExplorer system
      extension and grant it Full Disk Access. The interface can then inspect live
      processes, signatures, libraries, open files, network connections, and optional
      VirusTotal results.
    - >
      TaskExplorer supports text and token filters, JSON export, and a command-line
      interface inside the application bundle. VirusTotal, Anthropic, and OpenAI keys
      are optional and are stored securely in the macOS Keychain.
