history:
  adoption-history:
    - >
      Legba's adoption trail is mostly security-tool packaging rather than mainstream
      application development. Official materials show precompiled releases, Docker
      distribution, Homebrew installation through the author's tap, and later broader
      package-manager exposure through Homebrew, Nix, Arch packaging, and similar
      channels.
  package-nerd-significance:
    - >
      Legba is notable to package nerds as an example of security tooling moving from C
      and Python heritage into single-binary Rust distribution. The interesting
      packaging angle is not just speed; it is a no-native-dependency binary shipped
      through releases, Docker, cargo, and OS package managers while carrying a large
      protocol surface.
  project-history:
    - >
      The author presented Legba on 2023-11-02 as a project that began as Rust and Tokio
      practice and quickly became a replacement candidate for older credential attack
      tools such as THC-Hydra, Medusa, Patator, and related utilities. The official
      README and docs kept that framing: Rust, async execution, many protocol plugins,
      resumable sessions, rate controls, YAML recipes, a REST API, and an MCP server.
  related-projects:
    - >
      Related tools include THC-Hydra, Medusa, Ncrack, Patator, and protocol-specific
      credential auditing tools. Related distribution surfaces include Docker Hub,
      crates.io/lib.rs metadata, Homebrew taps, Arch packages, and security
      distributions such as Kali.
  sources:
    - https://bugs.kali.org/view.php?id=8682
    - https://github.com/evilsocket/legba
    - https://github.com/evilsocket/legba/releases
    - https://legba.evilsocket.net/
    - https://legba.evilsocket.net/faq/
    - >
      https://www.evilsocket.net/2023/11/02/Enumerate-Bruteforce-Attack-All-The-Things-Presenting-Legba/
  summary:
    - >
      Legba is Simone Margaritelli's Rust credential-testing CLI for authorized security
      work: a multi-protocol bruteforcer, password sprayer, and enumerator built around
      Tokio concurrency.
  timeline:
    - '2023-11-02: The author published the introductory Legba article.'
    - '2024-03-20: A Kali packaging request noted Arch package availability for Legba 0.8.0.'
    - >
      2025-08-22: The author noted static linking, precompiled binaries, and .deb assets
      in the Kali packaging thread.
    - '2026-05-19: GitHub releases showed Legba 1.3.0.'
  usage:
    - >
      The CLI is used for authorized credential auditing across services such as SMB,
      SSH, HTTP forms, databases, LDAP, Kerberos, MQTT, and other supported plugins. The
      docs emphasize rate limiting, delays, jitter, session save/restore, recipes, and
      legal authorization, which are the practical controls that separate testing
      workflows from reckless brute forcing.
related-packages:
  - id: brew:hydra
    reason: >
      Choose THC-Hydra for the established, widely packaged credential-auditing tool;
      choose legba when Rust memory safety, Tokio-based concurrency, resumable sessions,
      or newer automation surfaces are more important.
    rel: alternative
    sources:
      - >
        https://www.evilsocket.net/2023/11/02/Enumerate-Bruteforce-Attack-All-The-Things-Presenting-Legba/
      - https://github.com/vanhauser-thc/thc-hydra
