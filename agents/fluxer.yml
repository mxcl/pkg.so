history:
  adoption-history:
    - >
      Fluxer is available as a hosted chat service and as a self-hostable platform. The
      project publishes desktop builds and Linux repositories, while its official
      organization also develops a Flutter mobile client. Its public repository has
      attracted a substantial contributor and user audience within open-source chat
      software.
  package-nerd-significance:
    - >
      Fluxer packages a full modern chat stack rather than only a desktop client: the
      monorepo covers the web and desktop application, messaging services, gateway,
      media proxy, administration, documentation, and deployment assets. Its
      self-hosting support and AGPL licensing make it notable to users seeking an
      inspectable alternative to proprietary community-chat platforms.
  project-history:
    - >
      Fluxer emerged as a free and open-source instant-messaging and VoIP application
      for friends, groups, and communities. It subsequently expanded into a
      self-hostable platform with a documented HTTP API, real-time gateway, voice and
      screen-sharing support, media services, administration interfaces, and official
      mobile-client development.
  related-projects:
    - >
      The official `fluxerapp/flutter_client` repository contains the Fluxer mobile and
      tablet client.
    - >
      Fluxer's documented protocol surfaces include its HTTP API, Gateway, Media Proxy,
      Voice service, and Admin API.
    - Docker Compose deployment assets support self-hosted installations.
  sources:
    - >
      https://docs.fluxer.app/ — official architecture, API, downloads, and self-hosting
      documentation.
    - https://github.com/fluxerapp — verified official organization and project portfolio.
    - https://github.com/fluxerapp/fluxer — official project repository and README.
    - source_facts.package-manager — records Homebrew cask distribution.
  summary:
    - >
      Fluxer is a free and open-source chat and VoIP platform with text, voice, video,
      community features, desktop clients, APIs, and a self-hosting option.
  timeline:
    - >
      2026: Fluxer published extensive operator and API documentation alongside rapidly
      updated desktop, service, and mobile builds.
    - '2026: The official Flutter mobile client entered a sequence of public beta releases.'
  usage:
    - >
      End users use Fluxer for direct messages and community chat with voice, video, and
      screen sharing. Developers can build bots or clients against its HTTP API and
      Gateway, while operators can deploy an independent instance using the project's
      self-hosting stack.
