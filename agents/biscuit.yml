history:
  adoption-history:
    - >
      Biscuit is positioned for people who keep many app-like web services open
      throughout the day and need separation between projects, clients, work, personal
      contexts, or multiple accounts.
    - >
      The project distributes builds for macOS, Windows, and Linux. Its official site
      emphasizes that the core application is free, requires no Biscuit account for
      ordinary local use, and does not track usage.
  package-nerd-significance:
    - >
      Biscuit occupies the space between a conventional browser and a desktop
      application launcher: web services remain organized as persistent, isolated
      applications instead of mingling in a single tab strip. Package users gain a
      reproducible way to install this workspace-oriented browser shell across desktop
      platforms.
  project-history:
    - >
      Biscuit developed as a desktop browser organized around groups, web apps, and
      their associated tabs. Its central design is persistent workspace organization
      with optional separation or sharing of session state.
    - >
      Later releases expanded the model with local password management, notification
      controls, an app directory, cloud-sync foundations, an ad blocker, onboarding, and
      broader cross-platform packaging.
  related-projects:
    - >
      Biscuit serves web applications rather than replacing them; its app directory
      provides prepared entries for commonly used online services.
    - >
      Its session-isolation model is conceptually related to browser profiles and
      site-specific browsers, while presenting those concepts through persistent
      workspace groups.
  sources:
    - 'Official help center: https://eatbiscuit.com/help/'
    - 'Official product page: https://eatbiscuit.com/'
    - 'Official release history: https://github.com/agata/dl.biscuit/releases'
  summary:
    - >
      Biscuit is a cross-platform desktop browser for organizing frequently used web
      applications and tabs into persistent workspaces with controllable session
      isolation.
  timeline:
    - >
      Initial project era: Biscuit established its groups-and-apps workspace model for
      web services.
    - >
      Later development: The application added richer tab handling, notifications,
      password management, and cross-platform releases.
    - >
      2026: Major releases introduced cloud-sync foundations, a built-in ad blocker, and
      a first-run onboarding flow.
  usage:
    - >
      Users add supported or custom web apps, arrange them into groups, and keep related
      tabs attached to each app. Groups can represent projects, clients, or separate
      work and personal contexts.
    - >
      Sessions are isolated by default, enabling multiple accounts for the same service.
      Shared Session can be enabled for a group when its apps should share sign-in
      state. Credentials, cookies, saved passwords, and sign-in state remain local
      rather than being included in cloud synchronization.
