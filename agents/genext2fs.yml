history:
  adoption-history:
    - >
      The SourceForge homepage notes that many Linux users obtain genext2fs through
      distribution packages. Homebrew, Debian-family, Alpine, Fedora-family, MacPorts,
      and Nix packaging in the input record reflect its long-running role as a
      build-time utility rather than an end-user application.
  package-nerd-significance:
    - >
      genext2fs matters because it avoids privileged mounts in build systems. That makes
      it attractive for package builders, embedded distributions, and CI jobs that need
      filesystem artifacts but should not require root.
  project-history:
    - >
      The project homepage describes the original design goal plainly: generate an ext2
      filesystem as a normal user, including ownership, permissions, and device nodes,
      without mounting the image. The GitHub repository later became the source and
      issue-tracking home for bug fixes and feature work.
  related-projects:
    - >
      Related tools and concepts include ext2, device tables, reproducible-build
      SOURCE_DATE_EPOCH handling, and embedded Linux root filesystem image generation.
  sources:
    - https://formulae.brew.sh/formula/genext2fs
    - https://genext2fs.sourceforge.net/
    - https://github.com/bestouff/genext2fs
    - https://raw.githubusercontent.com/bestouff/genext2fs/master/README.md
  summary:
    - >
      genext2fs is a small filesystem-image builder for creating ext2 filesystems
      without mounting an image and without running as root. Its niche is especially
      visible in embedded and image-building workflows, where reproducible creation of
      root filesystems matters more than interactive disk administration.
  timeline:
    - '2017: the GitHub repository used by the project homepage was created.'
    - >
      2026: Homebrew packaged the 1.6.x line while the upstream README documented
      reproducible-build timestamp support.
  usage:
    - >
      Practitioners use genext2fs to assemble ext2 images from directories, tarballs,
      and device-table specifications. The README documents image sizing, inode control,
      device node creation, stdin pipelines, fake timestamps, SOURCE_DATE_EPOCH support,
      and examples for flash or floppy-style images.
