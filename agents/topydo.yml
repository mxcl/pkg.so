credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts show topydo packaged across Homebrew, Debian, MacPorts,
      Nix, and Ubuntu, which is broad for a console todo.txt tool. That distribution
      pattern reflects adoption by users who want a portable plain-text task file but
      prefer a richer Python CLI/TUI than the original shell-oriented todo.txt tools.
  package-nerd-significance:
    - >
      topydo is a representative package-manager-friendly productivity CLI:
      Python-based, plain-text-first, and interoperable with the wider todo.txt format.
      Its significance is strongest for users who value editable files, Unix-style tool
      chaining, and terminal UI ergonomics.
  project-history:
    - >
      The project sits in the todo.txt ecosystem rather than inventing its own database
      format. The README says its CLI was originally inspired by Gina Trapani's todo.txt
      CLI, while topydo adds native support for extensions such as due dates, start
      dates, dependencies, recurring items, sorting, grouping, aliases, and stable
      text-based identifiers.
    - >
      The official documentation is published as a TiddlyWiki-style site, matching the
      project's hacker-friendly niche: a single-file text-task workflow with command
      references, configuration tiddlers, output format notes, and UI documentation.
  related-projects:
    - >
      The README links the todo.txt format and Gina Trapani's todo.txt CLI as direct
      context, and also references bram85/todo.txt-tools.
  sources:
    - https://github.com/topydo/topydo#readme
    - https://topydo.github.io/topydo
    - source_facts.package-manager
  summary:
    - >
      topydo is a console-oriented todo.txt application. Its README describes it as a
      powerful todo list application using the todo.txt format, with command-line,
      prompt, and column/TUI interfaces.
  timeline:
    - >
      Project docs: Official README presents topydo as a todo.txt-compatible application
      with CLI, prompt, and column modes.
    - >
      Package adoption: Input package facts list Homebrew, Debian, MacPorts, Nix, and
      Ubuntu packages.
    - >
      Current docs: Official documentation is published at topydo.github.io/topydo as a
      TiddlyWiki containing command, configuration, output, and UI topics.
  usage:
    - >
      Typical use is to install with pip3, then run topydo in one of three interfaces:
      direct CLI commands, topydo prompt for a command loop, or topydo columns for a
      vim-like text UI with customizable columns. The README emphasizes that the
      todo.txt file remains compliant and can still be processed by other todo.txt
      tools.
    - >
      Package nerds tend to care about topydo because it keeps the durable artifact as
      plain text while offering scriptable outputs such as iCalendar, JSON, and Graphviz
      Dot. That makes it useful for terminal-first personal workflows, backups, sync,
      and small automations without adopting a hosted task service.
