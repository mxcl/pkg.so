history:
  adoption-history:
    - >
      The README points users to PyPI, pipx, Poetry, uv, Docker, and documentation, and
      the official tool center lists CycloneDX for Python as an open-source generator.
      That broad packaging footprint matters because Python SBOMs are often needed from
      whatever artifact a project already has: an environment, a lockfile, or a
      requirements file.
  package-nerd-significance:
    - >
      For package nerds, cyclonedx-python is where Python packaging diversity meets SBOM
      standardization: it has to interpret several Python dependency sources while
      producing a single CycloneDX document suitable for CI, auditing, and vulnerability
      tooling.
  project-history:
    - >
      The cyclonedx-python repository was created in November 2018, shortly after
      CycloneDX v1.0 introduced a security-focused BOM format. Over time the tool grew
      from Python dependency SBOM generation into a broader Python packaging surface
      covering virtual environments, requirements.txt, Poetry, and Pipenv, with older
      versions retaining support for Python 2.7 while current releases require Python
      3.9 or newer.
  related-projects:
    - >
      The tool uses the CycloneDX Python library and complements cyclonedx-cli and other
      language-specific generators in the CycloneDX project.
  sources:
    - https://github.com/CycloneDX/cyclonedx-python/blob/main/README.md
    - https://api.github.com/repos/CycloneDX/cyclonedx-python
    - https://github.com/CycloneDX/cyclonedx-python/releases
    - https://cyclonedx-bom-tool.readthedocs.io/
    - https://cyclonedx.org/tool-center/
    - https://cyclonedx.org/about/history/
  summary:
    - >
      CycloneDX Python is the official CycloneDX SBOM generator for Python projects,
      manifests, lockfiles, requirements files, and environments.
  timeline:
    - '2018: Repository created after the first CycloneDX specification release.'
    - '2021: v1.x releases were published under the CycloneDX Python tool line.'
    - >
      2024: CycloneDX v1.6 became ECMA-424, increasing the standardization backdrop for
      generators.
    - >
      2026: v7.x releases continued support for current Python environments and project
      formats.
  usage:
    - >
      The cyclonedx-py command generates SBOMs from Python virtual environments,
      requirements files, Pipenv projects, and Poetry projects. It uses CycloneDX Python
      libraries for data structures, serialization, and validation while keeping its own
      public surface centered on the CLI.
related-packages:
  - id: brew:cyclonedx-cli
    reason: >
      Use CycloneDX CLI after cyclonedx-python when a Python BOM needs format
      conversion, validation, merging, comparison, signing, or signature verification.
    rel: adjacent_workflow
    sources:
      - https://cyclonedx-bom-tool.readthedocs.io/
      - https://github.com/CycloneDX/cyclonedx-cli/blob/main/README.md
  - id: brew:cdxgen
    reason: >
      Choose cdxgen for polyglot repositories, containers, or broader BOM variants;
      choose cyclonedx-python for focused analysis of Python environments, requirements,
      Poetry, and Pipenv inputs.
    rel: alternative
    sources:
      - https://github.com/cdxgen/cdxgen#readme
      - https://cyclonedx-bom-tool.readthedocs.io/
      - https://cyclonedx.org/tool-center/
