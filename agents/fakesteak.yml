history:
  adoption-history:
    - >
      The README points to package availability status and compares fakesteak with other
      terminal rain programs. Its package-manager appeal is narrow but real: it is a
      tiny buildable terminal toy with no runtime library dependency beyond a capable
      Unix-like terminal.
  package-nerd-significance:
    - >
      fakesteak is mostly significant as a minimalist terminal-demo package: small C
      source, no ncurses, documented resource comparisons, and a single command that is
      easy for package repositories to expose.
  project-history:
    - >
      The GitHub repository was created in November 2020. The README describes the
      project as the author's take on digital character rain from The Matrix, with basic
      command-line customization and public-domain licensing.
  related-projects:
    - >
      The README compares fakesteak with cmatrix, tmatrix, unimatrix, cxxmatrix,
      rusty-rain, and neo.
  sources:
    - https://github.com/domsson/fakesteak
    - https://github.com/domsson/fakesteak#readme
    - https://api.github.com/repos/domsson/fakesteak
    - https://api.github.com/repos/domsson/fakesteak/releases?per_page=5
  summary:
    - >
      fakesteak is a small C terminal demo that recreates Matrix-style digital rain with
      a focus on low CPU, low RAM, and no ncurses dependency.
  timeline:
    - '2020-11: The GitHub repository is created.'
    - '2020-11: v0.2.4 is published on GitHub releases.'
  usage:
    - >
      Users build with make, run bin/fakesteak or install it system-wide, and adjust
      density, glitch ratio, seed, speed, background color, and version/help output
      through command-line options.
related-packages:
  - id: brew:cmatrix
    reason: >
      Choose CMatrix for ncurses-based Matrix rain with interactive controls, multiple
      colors, console-font modes, and broader visual options; choose fakesteak for a
      smaller dependency-free implementation.
    rel: alternative
    sources:
