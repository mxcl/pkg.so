    - https://ericschmar.github.io/moribito/
    - https://formulae.brew.sh/formula/moribito
    - https://github.com/ericschmar/moribito
    - https://news.ycombinator.com/item?id=45102664
  summary:
    - >
      Moribito is a small terminal LDAP explorer by Eric Schmar, published as a Go
      application built with Bubble Tea. Its README describes it as a terminal-based
      LDAP server explorer for browsing directory trees, viewing LDAP records, and
      running custom queries, with features such as paginated result browsing, clipboard
      support, SSL/TLS authentication, and multiple saved LDAP server configurations.
  usage:
    - >
      The project fits a narrow administrator and identity-engineering niche: it sits
      between raw ldapsearch-style command output and heavier graphical LDAP browsers.
      In the author's Show HN post, the motivation was daily LDAP query and validation
      work on macOS, where Apache Directory Studio was described as the main alternative
      but cumbersome for that workflow. In package-manager terms, the Homebrew formula
      exposes a single moribito executable for users who want an interactive TUI LDAP
      client rather than an LDAP server.
related-packages:
  - id: brew:openldap
    reason: >
      Choose OpenLDAP's ldapsearch-style clients for scriptable, noninteractive LDAP
      queries; choose Moribito when an interactive tree and record viewer are more
      useful.
    rel: alternative
    sources:
      - https://github.com/ericschmar/moribito
      - https://www.openldap.org/doc/admin26/guide.html
  - id: brew:ldapvi
    reason: >
      Use ldapvi after exploring a directory with Moribito when you need an editor-based
      workflow for reviewing and applying LDAP entry changes.
    rel: adjacent_workflow
    sources:
      - https://github.com/ericschmar/moribito
      - http://www.lichteblau.com/ldapvi/manual/
