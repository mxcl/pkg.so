credentials-file-location: null
history:
  adoption-history:
    - >
      TangleGuard is early-stage and distributed through binaries, the official CLI
      download path, Homebrew cask packaging, a desktop app, a VS Code extension, and a
      GitHub Action. The official GitHub organization was created in 2025, and the
      GitHub Action repository was created in October 2025.
    - >
      For package users, the notable adoption path is the small installable CLI that can
      run locally, in Git hooks, and behind the official GitHub Action for pull-request
      validation.
  package-nerd-significance:
    - >
      TangleGuard is interesting as a modern packaged developer tool because the package
      is a thin binary CLI around a proprietary Rust/WebAssembly architecture analyzer,
      with Homebrew cask, IDE, and GitHub Action entry points all invoking the same
      scanner workflow.
    - >
      Its packaging model reflects a common current pattern: a hosted or proprietary
      developer platform exposes a local CLI for reproducible project scans and CI
      integration, while source availability is intentionally separate from binary
      distribution.
  project-history:
    - >
      The official site identifies TangleGuard as a 2025 software application created by
      Jan Arends for Rust architecture analysis and architecture-erosion prevention. The
      official GitHub organization describes the product as a code analysis tool and
      structural linter for application-level software architecture.
    - >
      The public organization profile says Archwise Solutions UG is working on making
      the TangleGuard source code publicly available for auditing. The official GitHub
      Action README also states that the action code is MIT licensed while the
      TangleGuard CLI tool is proprietary software subject to a separate EULA, so there
      is no official public CLI source repository to report.
  related-projects:
    - >
      The official docs list the GitHub Action, CLI, desktop app, VS Code extension, and
      cloud app as related TangleGuard surfaces.
    - >
      The official organization also hosts documentation, feedback, agent-skill, and
      graph-layout repositories related to the wider TangleGuard project.
  sources:
    - https://github.com/TangleGuard
    - https://github.com/TangleGuard/.github/blob/main/profile/README.md
    - https://github.com/TangleGuard/GitHub-Action
    - https://github.com/TangleGuard/GitHub-Action/blob/main/README.md
    - https://github.com/TangleGuard/docs
    - https://raw.githubusercontent.com/TangleGuard/docs/main/src/content/docs/apps/cli.mdx
    - >
      https://raw.githubusercontent.com/TangleGuard/docs/main/src/content/docs/features/linter.mdx
    - https://tangleguard.com/
    - source_facts.version
  summary:
    - >
      TangleGuard CLI is the command-line part of TangleGuard, a developer tool for
      software architecture monitoring, dependency graph inspection, and architectural
      rule enforcement.
  timeline:
    - '2025: Official site structured data identifies TangleGuard founding date as 2025.'
    - '2025-08-27: Official GitHub organization and docs repository are created.'
    - '2025-10-21: Official GitHub Action repository is created.'
    - '2026: Homebrew cask input records TangleGuard CLI version 0.9.0.'
  usage:
    - >
      The official CLI docs document `tangleguard-cli -l <language> [-p <path>]
      [--ignore-paths <ignore-paths>] [-q] <command> [<args>]`, with `scan`, `validate`,
      and `upload` commands.
    - >
      The validation docs document `tangleguard-rules.yaml` in the project root for
      dependency rules. The GitHub Action docs and README show CI usage for validating
      circular dependencies and rule violations, optionally uploading results to
      TangleGuard Cloud.
