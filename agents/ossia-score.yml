history:
  adoption-history:
    - >
      ossia score is available on macOS, Windows, Linux, FreeBSD, embedded ARM systems,
      and WebAssembly-related targets. Official installation documentation lists
      Homebrew Cask, AppImage, Flatpak, WinGet, MSYS2, Nix, and other ecosystem
      channels.
    - >
      The project is used in intermedia art, live performance, installations, creative
      coding, and audiovisual production where one timeline must coordinate multiple
      protocols, media types, and devices.
  package-nerd-significance:
    - >
      ossia score is notable for combining a graphical creative application with an
      unusually broad dependency and protocol surface: audio, video, OSC, MIDI, DMX,
      scripting languages, IoT protocols, sensors, and GPU media processing.
    - >
      Its cross-platform binaries, embedded targets, plug-in architecture, and presence
      in several package ecosystems make it an instructive packaging target for
      multimedia and creative-coding maintainers.
  project-history:
    - >
      ossia score emerged from the OSSIA ecosystem as an open-source interactive
      sequencer for intermedia art. Its first 1.0 prereleases appeared in 2016, followed
      by sustained 1.x, 2.x, and 3.x development.
    - >
      The application expanded from interactive scenario sequencing into a broad
      audiovisual environment supporting sound, video, lighting, external hardware,
      scripting, live coding, networking protocols, and GPU processing.
  related-projects:
    - >
      libossia provides libraries and interoperability components within the broader
      OSSIA ecosystem.
    - >
      Pure Data, Faust, JavaScript, OSC, MIDI, DMX, MQTT, CoAP, and numerous media and
      sensor protocols can participate in score workflows.
  sources:
    - https://github.com/ossia/score
    - https://ossia.io/score-docs/
    - https://ossia.io/score-docs/quick-start/installation.html
    - https://ossia.io/score-docs/reference/changelog.html
  summary:
    - >
      ossia score is an open-source interactive sequencer for composing and running
      intermedia and audiovisual works.
  timeline:
    - '2016: The documented 1.0 alpha series and first beta release appeared.'
    - '2018: Version 2.0 prereleases were published.'
    - '2021: Version 3.0 release candidates were published.'
    - '2026: The 3.8 series continued the current major release line.'
  usage:
    - >
      Artists arrange processes, states, automation, media, and device messages on an
      interactive timeline, then execute the score for performances or installations.
    - >
      Projects can sequence OSC, MIDI, DMX, audio, video, scripts, web APIs, IoT
      devices, sensors, and external creative software. Command-line options also
      support autoplay and headless execution.
