history:
  adoption-history:
    - >
      AirBuild is currently presented as an early-access product with limited
      invitations rather than a mature, generally available development platform. Its
      Mac and iPhone clients share project context between local and cloud-based agent
      workflows.
  package-nerd-significance:
    - >
      AirBuild packages an unusually broad Apple-development workflow into a desktop
      client: AI-assisted native SwiftUI development, local or cloud builds, TestFlight
      delivery, App Store metadata preparation, review handling, and resubmission.
  project-history:
    - >
      AirBuild was created as an AI-agent workspace for building native iOS
      applications. Its official material subsequently expanded the product story beyond
      code generation to cover TestFlight distribution, App Store Connect operations,
      review automation, landing pages, and hosted backends.
  related-projects:
    - >
      Official documentation describes an MCP server that connects AirBuild teams to
      clients including Claude, ChatGPT, Cursor, and Codex.
  sources:
    - https://air.build/
    - https://air.build/blog/retro-airbuild-setup/
    - https://air.build/blog/xcode-27-can-still-build-for-the-iphone-3g/
    - https://air.build/docs/
  summary:
    - >
      AirBuild is an AI-assisted workspace whose product, design, and engineering agents
      turn a natural-language brief into a native iOS application and help carry it
      through testing and App Store review.
  timeline:
    - >
      2026: Official guides documented account linking and project creation on Mac,
      modern iPhone, and a retro iPhone client.
    - >
      2026: AirBuild documented an experimental on-device development environment for
      iPhone 3G and 3GS hardware.
  usage:
    - >
      A user creates a project, describes the intended application in chat, reviews
      generated builds, and requests changes. Paid workflows can prepare screenshots and
      store metadata, distribute builds through TestFlight, submit to App Review,
      respond to feedback, and resubmit fixes.
    - >
      The free workflow supports bringing an API key from a supported AI provider, but
      official documentation does not publish a filesystem location for that credential.
