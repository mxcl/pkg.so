id: brew:git-cal
display-name: git-cal
repo: null
docs:
  - https://github.com/k4rthik/git-cal#readme
config-file-location:
  unix:
    - .git/config
    - $XDG_CONFIG_HOME/git/config
    - ~/.gitconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption evidence is modest: the official README documents Homebrew installation,
      and the repository shows a niche but visible audience for a terminal
      contribution-calendar tool. That points to a utility used by command-line Git
      users rather than a broad ecosystem platform.
  package-nerd-significance:
    - >
      For package catalogs, git-cal is notable mostly as a tiny Unix-style Git
      companion: one executable Perl script, no CPAN dependencies declared in
      Makefile.PL, and behavior driven by Git log output.
  project-history:
    - >
      The project is distributed from Karthik Katooru's GitHub repository and packaged
      as a single executable Perl script. The repository exposes v0.9 and v0.9.1
      releases, with v0.9.1 described as a no-external-dependencies release.
  related-projects:
    - >
      git-cal relates to contribution graphs in hosted Git forges, especially GitHub's
      contribution calendar, and to other terminal Git summary tools.
  sources:
    - https://github.com/k4rthik/git-cal
    - https://raw.githubusercontent.com/k4rthik/git-cal/master/Makefile.PL
    - https://raw.githubusercontent.com/k4rthik/git-cal/master/git-cal
    - source_facts.repo
  summary:
    - >
      git-cal is a small Perl command-line tool that renders a GitHub-style
      contributions calendar from local Git history.
  timeline:
    - '2013: v0.9-era releases published in the official GitHub repository.'
    - '2013: v0.9.1 listed as the latest release with no external dependencies.'
    - '2010s: Homebrew installation documented in the official README.'
  usage:
    - >
      Practitioners run git-cal inside or against a repository to inspect commit
      activity over roughly a year. Options support ANSI color, ASCII, Unicode output,
      author filtering, all-branch history, period selection, and path-limited history.
related-packages: []
