history:
  adoption-history:
    - >
      The client is offered for desktop operating systems as the local synchronization
      component of Twake Workplace and Twake Drive. Official support material presents
      it as the way to keep a computer folder synchronized with a user's hosted files.
  package-nerd-significance:
    - >
      Twake Desktop is relevant to open-source and self-hosting users because it
      provides an AGPL-licensed desktop synchronization client rather than only a web
      interface. Its repository also reflects the product's Cozy heritage through the
      long-standing cozy-desktop project name.
  project-history:
    - >
      Twake Desktop is developed by LINAGORA in the cozy-labs/cozy-desktop repository.
      The application evolved as the desktop file-synchronization client for the Cozy
      ecosystem and is now presented as the client that replicates files between a local
      computer and Twake Workplace's online Twake Drive.
  related-projects:
    - >
      Twake Drive is the server-side file surface synchronized by the client. Twake
      Workplace is the wider productivity environment, while the Cozy developer
      documentation and cozy-desktop repository retain the project's earlier technical
      naming.
  sources:
    - https://docs.cozy.io/en/cozy-desktop/usage/limitations/
    - https://github.com/cozy-labs/cozy-desktop
    - https://support.twake.app/533-how-to-use-the-selective-sync/
    - https://support.twake.app/synchronize-your-computer-and-or-smartphone-with-your-cozy/
  summary:
    - >
      Twake Desktop is LINAGORA's open-source desktop client for synchronizing files
      between a local computer and Twake Drive in Twake Workplace.
  timeline:
    - >
      Cozy era: The cozy-desktop project served as a desktop synchronization client for
      files stored in a Cozy instance.
    - >
      Twake era: The client was branded Twake Desktop and connected to Twake Workplace
      and Twake Drive.
    - >
      2025: Twake's official help center continued documenting desktop installation,
      supported systems, and synchronization workflows.
  usage:
    - >
      Users connect the client to a Twake account, choose a local synchronization
      folder, and optionally exclude server folders through selective synchronization.
      The client then propagates file changes between the local folder, other
      synchronized devices, and Twake Drive.
