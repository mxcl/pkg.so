history:
  adoption-history:
    - >
      fakecloud's adoption story is explicitly tied to developers and teams that wanted
      local AWS integration tests without an account, token, paid tier, or Docker-only
      workflow. Its README lists Homebrew, Cargo, Docker, Docker Compose, source builds,
      GHCR images, crates.io, and first-party SDK packages as distribution surfaces.
  package-nerd-significance:
    - >
      fakecloud is package-manager-relevant because it intentionally collapses a large
      local cloud stack into a single installable binary. That makes Homebrew and Cargo
      installation part of the value proposition, especially for CI and developer
      machines that do not want to bootstrap a large Docker image before tests.
  project-history:
    - >
      The repository was created in April 2026. The project README states that fakecloud
      was started after LocalStack replaced its open-source Community Edition with a
      proprietary image requiring an account and auth token in March 2026.
    - >
      The documentation emphasizes fakecloud's role as a standalone binary with optional
      persistent storage, container-backed stateful services, service parity pages, and
      first-party SDKs for test assertions.
  related-projects:
    - >
      fakecloud is framed by its own documentation as an alternative to LocalStack
      Community for local AWS integration testing.
  sources:
    - https://github.com/faiscadev/fakecloud
    - https://github.com/faiscadev/fakecloud#readme
    - https://fakecloud.dev/docs/reference/configuration/
    - https://api.github.com/repos/faiscadev/fakecloud
    - https://api.github.com/repos/faiscadev/fakecloud/releases?per_page=5
  summary:
    - >
      fakecloud is a free, open-source local AWS cloud emulator for integration testing
      and local development. It presents itself as a single binary that listens on
      localhost and accepts normal AWS SDK, CLI, Terraform, CDK, and CI traffic pointed
      at its endpoint.
  timeline:
    - >
      2026-03: LocalStack Community Edition licensing change is cited by the project as
      the motivation.
    - '2026-04: The GitHub repository is created.'
    - '2026-06: v0.29.0 is published on GitHub releases.'
  usage:
    - >
      Typical use is to run fakecloud, then configure AWS SDKs or the AWS CLI to use
      http://localhost:4566 with dummy credentials. Configuration is through CLI flags
      and FAKECLOUD_* environment variables rather than a documented config file.
related-packages:
  - id: brew:localstack
    reason: >
      Choose LocalStack when its established container-oriented AWS development platform
      and commercial feature tiers fit your workflow; fakecloud documents a direct
      migration path for users preferring its free single-binary model.
    rel: alternative
    sources:
      - https://fakecloud.dev/localstack-alternative/
      - https://docs.localstack.cloud/overview/
  - id: brew:moto
    reason: >
      Choose Moto for Python-native mocks and decorators or its standalone test server;
      choose fakecloud when a language-neutral single-binary AWS endpoint is the better
      fit.
    rel: alternative
    sources:
      - https://docs.getmoto.org/en/latest/docs/getting_started.html
      - https://docs.getmoto.org/en/latest/docs/server_mode.html
      - https://fakecloud.dev/docs/
  - id: brew:awscli
    reason: >
      AWS CLI commands can target fakecloud with --endpoint-url, providing a direct way
      to create and inspect resources during local tests.
    rel: adjacent_workflow
    sources:
      - https://fakecloud.dev/sqs-emulator/
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-endpoints.html
