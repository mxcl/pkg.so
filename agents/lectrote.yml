history:
  adoption-history:
    - >
      Lectrote made several established interactive-fiction virtual machines available
      through one cross-platform desktop interface. Its format coverage lets players
      open games produced by Inform, Hugo, TADS, ADRIFT, and Ink without choosing a
      separate interpreter for each ecosystem.
    - >
      The project also supports bound games, allowing authors to distribute an
      individual work together with Lectrote's Chromium shell and selected interpreter
      engines.
  package-nerd-significance:
    - >
      Lectrote is a packaging layer over a family of interpreters rather than a new
      story format. It illustrates how Electron and JavaScript ports can bundle
      historically distinct interactive-fiction virtual machines into a consistent
      desktop application, while also supporting self-contained releases of individual
      games.
  project-history:
    - >
      Andrew Plotkin created Lectrote in 2016 as an Electron-based interactive-fiction
      interpreter. It combines Chromium with engines including Quixe, ZVM, emglken,
      inkjs, and other bundled interpreters.
    - >
      By August 2020, release 1.3.6 added support for the operating system's dark theme.
      Continued releases expanded and maintained support for multiple story formats and
      desktop platforms.
  related-projects:
    - Quixe supplies Glulx interpretation.
    - ZVM supplies Z-machine support.
    - emglken wraps native-style interpreters including Glulxe, Hugo, TADS, and Scare.
    - inkjs supplies Ink story support.
    - Inform 7 produces common Z-code and Glulx inputs for Lectrote.
  sources:
    - https://github.com/erkyrath/lectrote
    - https://github.com/erkyrath/lectrote/blob/master/CHANGES.md
  summary:
    - >
      Lectrote is a cross-platform Electron application for playing interactive-fiction
      story files through several bundled interpreter engines.
  timeline:
    - '2016: Andrew Plotkin created Lectrote.'
    - '2020-08: Lectrote 1.3.6 added operating-system dark-theme support.'
  usage:
    - >
      On launch, users select a story file; multiple games can run in separate windows,
      and supported games automatically save and resume the last play session.
    - >
      Supported inputs include Glulx, Z-code, Hugo, TADS 2 and 3, ADRIFT 4, and compiled
      Ink stories. Developers can also package a single story as a standalone bound-game
      application.
