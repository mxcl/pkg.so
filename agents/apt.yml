  unix:
    - /etc/apt/auth.conf
    - /etc/apt/auth.conf.d/*.conf
history:
  adoption-history:
    - >
      APT's adoption tracks Debian's growth. Debian's own history says apt addressed
      issues from Debian's continuing expansion and established a new paradigm for
      package acquisition and installation on open source operating systems.
    - >
      Ubuntu inherited APT as a core system interface, and the supplied metadata records
      apt packages or compatibility packages across Homebrew, Debian, Ubuntu,
      Fedora/dnf, Arch/pacman, Alpine/apk, and Nix. Some non-Debian entries exist for
      compatibility or tooling rather than as the native system package manager.
    - >
      APT also shaped the UX expectations for later package managers: update an index,
      install by name, resolve dependencies, upgrade the system, pin repositories, and
      use signed repository metadata.
  package-nerd-significance:
    - >
      APT is one of the defining package-manager designs. It made repository metadata,
      dependency solving, local package archives, upgrade planning, and signed
      distribution channels normal parts of Linux administration.
    - >
      For package nerds, APT is also the origin point for countless secondary tools:
      mirror managers, repository publishers, pinning front ends, unattended-upgrade
      systems, PPA tooling, and fleet update wrappers. Understanding APT explains a
      large fraction of Debian and Ubuntu packaging behavior.
    - >
      Its split between dpkg as the local package database/installer and APT as the
      repository-aware resolver remains one of the clearest examples of layered
      package-management architecture.
  project-history:
    - >
      Debian's early package management centered on dpkg and dselect. The official
      Debian project history names Debian 2.1 Slink, released March 9, 1999, as the
      release that introduced apt as a new package-management interface and describes it
      as a key technical innovation.
    - >
      APT grew into a family of tools and libraries. The Debian Administrator's Handbook
      describes apt-get as the first command-line front end developed within the APT
      project, with apt later added as a more interactive command-line front end while
      apt-get retained a stable scripted interface.
    - >
      The system's configuration model also became part of Debian culture:
      /etc/apt/sources.list and sources.list.d define repositories, apt.conf and
      apt.conf.d define behavior, preferences files define pinning, and auth.conf
      carries machine credentials for authenticated repositories.
  related-projects:
    - dpkg is the lower-level Debian package installer and database underneath APT.
    - >
      aptitude, Synaptic, wajig, and other front ends build around APT or the Debian
      package model.
    - >
      aptly and apt-dater are downstream tools in this batch that manage repositories or
      remote updates for apt-based systems.
  sources:
    - https://manpages.debian.org/unstable/apt/apt.conf.5.en.html
    - https://manpages.debian.org/unstable/apt/apt_auth.conf.5.en.html
    - https://manpages.debian.org/unstable/apt/sources.list.5.en.html
    - https://www.debian.org/doc/manuals/apt-guide/index.en.html
    - https://www.debian.org/doc/manuals/debian-handbook/sect.apt-get.en.html
    - https://www.debian.org/doc/manuals/project-history/releases.en.html
    - source_facts.package-manager
  summary:
    - >
      APT, the Advanced Package Tool, is Debian's high-level package acquisition,
      dependency resolution, and installation interface. It turned dpkg-based systems
      from local package installers into repository-driven operating systems.
  timeline:
    - '1995: Debian 0.93R5 uses dpkg after base-system installation.'
    - '1999: Debian 2.1 Slink introduces apt as a new package-management interface.'
    - >
      2000s: apt-get becomes the standard command-line front end for scripted Debian
      package operations.
    - >
      2010s: apt becomes the recommended interactive front end while apt-get remains the
      stable scripting interface.
  usage:
    - >
      The everyday flow is apt update to refresh package indexes, apt install package to
      install dependencies and packages, apt remove or apt purge to remove software, and
      apt upgrade or apt full-upgrade for system updates.
    - >
      Scripts and maintainer tooling often use apt-get because Debian documents its
      public interface as stable for automation. Humans often use apt because it has
      interactive defaults and output tuned for direct terminal use.
    - >
      Repository configuration is text-file driven: sources.list controls where packages
      come from, apt.conf controls acquisition and dpkg behavior, and auth.conf stores
      credentials for authenticated archive access.
related-packages:
  - id: brew:dpkg
    reason: >
      Use dpkg for low-level inspection or installation of local .deb packages; APT
      builds repository-aware dependency and upgrade workflows on top of it.
    rel: adjacent_workflow
    sources:
      - https://www.debian.org/doc/manuals/debian-handbook/sect.apt-get.en.html
      - https://www.dpkg.org/
  - id: brew:aptly
    reason: >
      aptly creates, snapshots, and publishes deterministic Debian repositories that APT
      clients can add as package sources.
    rel: adjacent_workflow
    sources:
      - https://www.aptly.info/doc/overview/
      - https://manpages.debian.org/testing/apt/sources.list.5.en.html
  - id: brew:apt-dater
    reason: >
      apt-dater coordinates apt-get updates across remote Debian hosts over SSH, making
      it an operational fleet companion to APT.
    rel: adjacent_workflow
    sources:
      - https://github.com/DE-IBH/apt-dater#readme
      - https://manpages.debian.org/testing/apt/apt.8.en.html
