history:
  adoption-history:
    - >
      webfs became a small distribution package rather than a large upstream platform.
      Its continued presence in Debian, Ubuntu, MacPorts, Nix, and Homebrew reflects a
      specific utility: administrators and developers still occasionally want a minimal
      static file server with Unix permissions and simple daemon behavior.
    - >
      The package's longevity comes from being boring in the best sense. It does not
      compete with modern reverse proxies or app servers; it survives because a tiny
      static HTTP daemon remains handy for tests, rescue environments, old hardware,
      package repositories, and temporary file sharing.
  package-nerd-significance:
    - >
      webfs is significant as a fossil that still works: a compact pre-container HTTP
      daemon with the Unix philosophy plainly visible. For package nerds, it represents
      the era when a useful server could be a tens-of-kilobytes binary plus a man page,
      and still earn a slot in modern package indexes.
  project-history:
    - >
      Gerd Knorr's webfs dates to the late 1990s. Debian's man page credits copyright
      years 1999 and 2000, and a Freshmeat-era announcement for webfs 1.5 appeared in
      November 2000, describing it as a simple static HTTP server tested on Linux and
      FreeBSD.
    - >
      The 2000 announcement already shows the shape that made the tool last: a very
      small binary, sendfile support with a userspace fallback, IPv6, chroot-to-docroot,
      basic authentication, and virtual hosts. The current homepage keeps the same
      theme, presenting webfs as a quick way to serve static files or expose FTP-server
      content via HTTP.
  related-projects:
    - >
      Related tools include thttpd, darkhttpd, busybox httpd, Python's `http.server`,
      nginx static serving, Apache httpd, and other small daemons used when static file
      export is the whole job.
  sources:
    - https://directory.fsf.org/wiki/Webfs
    - https://groups.google.com/g/fm.announce/c/hgjdjEuYMxM
    - https://linux.bytesex.org/misc/webfs.html
    - https://manpages.debian.org/unstable/webfs/webfsd.1.en.html
    - https://www.kraxel.org/releases/webfs/
  summary:
    - >
      webfs, usually run as `webfsd`, is a tiny HTTP server for mostly static content.
      It was built for the old but still useful job of exporting a directory tree over
      HTTP quickly, without configuring a full Apache, nginx, or application server.
  timeline:
    - >
      1999: Debian manpage copyright history identifies Gerd Knorr's authorship
      beginning in 1999.
    - >
      2000-11: Freshmeat announced webfs 1.5 with IPv6, chroot, basic auth, virtual
      hosts, and sendfile fallback support.
    - >
      2014: Debian jessie carried a webfsd man page, showing long-running distribution
      packaging.
    - '2025: The upstream release directory listed webfs 1.21-era release artifacts.'
    - >
      2026: Homebrew and other package managers still carried webfs as a static HTTP
      server package.
  usage:
    - >
      Typical use is to point `webfsd` at a directory and let it serve regular files and
      directory listings. Access control relies primarily on Unix file permissions, and
      the daemon can drop privileges after binding privileged ports or entering a chroot
      when installed and configured for that mode.
    - >
      webfs is most appropriate for static content: quick exports, LAN file drops,
      read-only mirrors, or lightweight development fixtures. It is not a dynamic web
      stack, and that limitation is exactly why the package remains easy to reason
      about.
