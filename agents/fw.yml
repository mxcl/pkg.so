config-file-location:
  linux:
    - ~/.config/fw
  macos:
    - ~/Library/Application Support/fw
  windows:
    - '{FOLDERID_RoamingAppData}\fw'
credentials-file-location: null
history:
  adoption-history:
    - >
      fw has a small but real package-manager footprint: the upstream README advertises
      a crates.io package badge, while the input package metadata records availability
      in Homebrew and Nix. Its adoption is best understood as a niche command-line
      workflow tool rather than a broad ecosystem standard.
  package-nerd-significance:
    - >
      fw is interesting to package nerds because it sits between dotfiles, shell
      navigation, Git workspace bootstrapping, and editor integration. It is a small
      example of a personal workflow script becoming a packaged CLI with cross-platform
      config-directory behavior.
    - >
      Its README is unusually explicit about what the tool is not: it encodes the
      author's workflow and lists assumptions such as git-only repositories and
      ssh-agent authentication.
  project-history:
    - >
      The GitHub repository was created in March 2017. Early releases reached 1.x during
      2017, and later releases moved into the 2.x series, with releases continuing
      through at least 2025.
    - >
      The README presents fw as a tool for describing a workspace, cloning git projects,
      running setup commands, generating editor/projectile configuration, and reducing
      project-switching overhead.
  related-projects:
    - >
      fw overlaps with shell `CDPATH`, project switcher scripts, editor project indexes
      such as Projectile, and language environment managers such as nvm or virtualenv
      when used as setup hooks.
    - It depends culturally on Git and ssh-agent based developer workflows.
  sources:
    - https://api.github.com/repos/brocode/fw
    - https://github.com/brocode/fw
    - https://github.com/brocode/fw/releases
    - https://raw.githubusercontent.com/brocode/fw/master/README.md
  summary:
    - >
      fw is a Rust command-line workspace manager for cloning projects, switching among
      them, and running setup commands across a developer workspace. Its upstream README
      frames it as a personal productivity tool with explicit workflow assumptions
      rather than a general-purpose project manager.
  timeline:
    - '2017: Public GitHub repository created.'
    - '2017: 1.x releases published.'
    - '2023: 2.18.0 and 2.19.x releases published.'
    - '2025: 2.20.0 and 2.21.0 releases published.'
  usage:
    - >
      Users maintain a configuration directory under the platform config directory, or
      override it with `FW_CONFIG_DIR`. The tool assumes git repositories, ssh-based
      cloning, and ssh-agent authentication by default.
    - >
      Typical usage is to define projects once, let fw clone or locate them, and use
      shell integration to jump into a project with setup actions such as running build
      commands or activating language environments.
