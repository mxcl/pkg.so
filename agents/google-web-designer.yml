id: cask:google-web-designer
display-name: Google Web Designer
repo: null
docs:
  - https://support.google.com/webdesigner?hl=en
config-file-location:
  linux:
    - ~/.local/share/google-web-designer/preferences/settings.conf
  macos:
    - ~/Library/Preferences/com.google.WebDesigner.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Google distributes Web Designer at no cost for business use on macOS, Windows, and
      Linux. Its publishing workflows support Google Ads, Display & Video 360, and AdMob
      environments as well as non-Google ads.
  package-nerd-significance:
    - >
      The package is notable as a proprietary, cross-platform visual HTML5-authoring
      tool delivered outside traditional language package ecosystems. Package managers
      mainly automate installation of Google's binary distribution rather than build the
      application from source.
  project-history:
    - >
      Google Web Designer evolved as an integrated visual-and-code authoring environment
      for responsive HTML5 advertising and other web content. Its feature set combines
      drawing tools, a timeline, CSS/JavaScript/XML editing, reusable components, and
      ad-platform validation and publishing workflows.
  related-projects:
    - Google Ads
    - Google AdMob
    - Display & Video 360
    - Ads Creative Studio
  sources:
    - 'Official Help Center: https://support.google.com/webdesigner/?hl=en'
    - 'Official banner-ad guide: https://support.google.com/webdesigner/answer/3261498?hl=en'
    - 'Official overview: https://support.google.com/webdesigner/answer/3184833?hl=en'
  summary:
    - >
      Google Web Designer is Google's desktop authoring application for interactive
      HTML5 designs, motion graphics, advertisements, images, and videos.
  timeline:
    - '2022: Version 15.2 release notes document the continuing automatic-update release line.'
    - >
      2026: Official support documentation lists macOS, Windows, and Linux system
      requirements.
  usage:
    - >
      Users work in visual Design view or the syntax-aware Code view, animate content on
      a timeline, add interactive components, preview projects in a browser, and publish
      advertising or general web content.
