history:
  adoption-history:
    - >
      Session launched publicly in January 2020 after alpha and beta development.
      Official project accounts describe uptake among users seeking an encrypted
      messenger that does not require a telephone number and can run across mobile and
      desktop platforms.
    - >
      Desktop packages are published for macOS, Windows, and Linux, with signed release
      artifacts and a Debian repository complementing mobile distribution. The clients
      and protocol are developed in public under open-source licenses.
  package-nerd-significance:
    - >
      Session is an unusual messenger package because identity is based on randomized
      Session IDs and self-managed keys rather than telephone numbers. It combines
      end-to-end encryption with onion-routed transport and decentralized offline
      message storage, making network metadata protection a central packaging and
      architecture concern.
    - >
      For package maintainers and security-conscious users, the desktop project provides
      signed multi-platform artifacts, reproducible source access, and explicit
      verification instructions. Recovery phrases restore a Session identity, but
      contacts and message history remain local rather than being reconstructed from a
      central cloud account.
  project-history:
    - >
      The idea that became Session originated in 2018 within the Loki Project. Early
      clients were based substantially on Signal's client and encryption work, while
      replacing phone-number identity and centralized delivery with the Loki
      service-node network.
    - >
      After roughly a year of alpha and beta development, the application—originally
      known as Loki Messenger—made its public debut as Session in January 2020. The
      project soon adopted a simpler three-hop onion-request design for messaging rather
      than depending directly on a full Lokinet client on mobile platforms.
    - >
      In December 2020 the project announced a purpose-built Session Protocol intended
      to better fit decentralized messaging than the inherited Signal protocol.
      Stewardship later moved to the Swiss-based Session Technology Foundation.
  related-projects:
    - Signal
    - Loki Messenger
    - Lokinet
    - Session Network
    - Session Protocol
    - Oxen
  sources:
    - https://docs.getsession.org/
    - https://getsession.org/blog/introducing-the-session-protocol
    - https://getsession.org/blog/introducing-the-session-technology-foundation
    - https://getsession.org/blog/onion-requests-session-new-message-routing-solution
    - https://github.com/session-foundation/session-desktop
  summary:
    - >
      Session is an open-source, cross-platform private messenger built around
      end-to-end encryption, onion-routed connections, decentralized message storage,
      and identifiers that do not require telephone numbers.
  timeline:
    - '2018: Work began on the vision that became Session.'
    - '2020: Session made its public debut after alpha and beta development.'
    - '2020: The project moved messaging toward three-hop onion requests.'
    - '2020: A purpose-built Session Protocol was announced.'
    - '2024: Stewardship transitioned to the Session Technology Foundation.'
  usage:
    - >
      Users create or restore a pseudonymous Session ID, exchange that identifier with
      contacts, and send encrypted messages and attachments without registering a phone
      number. The recovery phrase restores the identity on another installation, while
      locally held contacts and message history require separate device handling.
    - >
      Desktop users can install a native client and verify signed release artifacts.
      Messages are stored for offline delivery by distributed Session Nodes and routed
      so that the service infrastructure does not directly learn both ends of a
      conversation.
