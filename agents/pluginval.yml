history:
  adoption-history:
    - >
      pluginval is distributed as a graphical desktop application and a headless
      command-line tool. The latter makes it suitable for continuous-integration checks
      in audio plug-in projects.
    - >
      Its Homebrew cask provides a convenient macOS installation path alongside the
      precompiled releases published by the project.
  package-nerd-significance:
    - >
      pluginval packages a specialized compatibility test suite into a repeatable tool.
      It is useful to package maintainers and audio developers because validation can
      run outside a full digital audio workstation and can return conventional success
      or failure exit codes.
    - >
      Its support for VST, VST3, Audio Unit and other plug-in formats makes it a
      practical interoperability check across the fragmented audio plug-in ecosystem.
  project-history:
    - >
      Tracktion developed pluginval as an open-source, cross-platform validator for
      audio plug-ins and hosts. Validation runs in a separate process so a crashing
      plug-in does not take down the main application.
    - >
      The project grew beyond its graphical interface to support headless validation, CI
      integration and use as a CMake target inside JUCE projects.
  related-projects:
    - JUCE, the application framework used by pluginval.
    - Steinberg VST3 Validator and Apple's auval, related format-specific validation tools.
  sources:
    - https://github.com/Tracktion/pluginval/blob/develop/README.md
    - https://www.tracktion.com/develop/pluginval
    - source_facts.package-manager
  summary:
    - >
      pluginval is Tracktion's open-source application and command-line tool for testing
      the stability and host compatibility of audio plug-ins.
  timeline:
    - The project added graphical and headless workflows for repeatable plug-in validation.
    - >
      Later integration support allowed pluginval tests to be incorporated into
      JUCE/CMake projects and CI pipelines.
  usage:
    - >
      In graphical mode, users scan or drag in plug-ins, select them and run the test
      suite while reviewing results in the console tab.
    - >
      In headless mode, users pass a plug-in path and an optional strictness level. Exit
      status 0 indicates clean completion and status 1 indicates failed tests, enabling
      CI enforcement.
