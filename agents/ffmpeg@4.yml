id: brew:ffmpeg@4
display-name: FFmpeg 4
repo: https://git.ffmpeg.org/ffmpeg.git
docs:
  - https://ffmpeg.org/documentation.html
config-file-location:
  unix:
    - $FFMPEG_DATADIR/*.ffpreset
    - ~/.ffmpeg/*.ffpreset
    - PREFIX/share/ffmpeg/*.ffpreset
credentials-file-location: null
history:
  adoption-history:
    - >
      The versioned Homebrew formula exists because FFmpeg is both an end-user command
      and a dependency surface for applications that link libav* libraries. Keeping
      ffmpeg@4 alongside newer ffmpeg formulae lets package users pin older ABI behavior
      while the unversioned package moves on.
  package-nerd-significance:
    - >
      For package maintainers, ffmpeg@4 is mostly about ABI containment: FFmpeg exposes
      many shared libraries, so parallel major-version formulae prevent older dependents
      and workflows from being forced onto newer decode, encode, and filter APIs all at
      once.
  project-history:
    - >
      FFmpeg is the upstream multimedia toolkit that provides the ffmpeg, ffplay, and
      ffprobe command-line tools plus libraries such as libavcodec, libavformat,
      libavfilter, libswscale, and libswresample. The 4.4 branch was cut from master on
      2021-04-08; Homebrew's ffmpeg@4 formula follows the 4.4.x source tarballs,
      including 4.4.8.
  related-projects:
    - >
      FFmpeg 5, FFmpeg 6, and FFmpeg 7 are newer parallel FFmpeg release lines.
      ffmpegthumbnailer and FFMS2 are downstream tools built around FFmpeg libraries.
  sources:
    - https://ffmpeg.org/about.html
    - https://ffmpeg.org/download.html
    - https://ffmpeg.org/documentation.html
    - https://formulae.brew.sh/formula/ffmpeg@4
  summary:
    - >
      FFmpeg 4 in Homebrew tracks the long-lived FFmpeg 4.4 release line, a
      compatibility branch for installations that need the older libav* ABI while still
      receiving upstream maintenance releases.
  timeline:
    - '2021: FFmpeg 4.4 release branch cut from master.'
    - '2026: FFmpeg 4.4.8 released and packaged by Homebrew as ffmpeg@4.'
  usage:
    - >
      Users install ffmpeg@4 when they need the FFmpeg CLI or libraries from the 4.4
      line for transcoding, probing, playback, filters, or build compatibility with
      software that has not moved to newer FFmpeg APIs.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Choose the current unversioned FFmpeg formula when FFmpeg 4 ABI compatibility is
      unnecessary and access to newer upstream formats, codecs, and filters is
      preferred.
    rel: alternative
    sources:
      - https://formulae.brew.sh/formula/ffmpeg
      - https://formulae.brew.sh/formula/ffmpeg@4
      - https://ffmpeg.org/index.html
tags:
  - audio
  - cli
  - ffmpeg
  - streaming
  - transcoding
  - video
provenance:
  category-sources:
    - >
      source_facts.description says FFmpeg can play, record, convert, and stream audio
      and video; official FFmpeg homepage describes a cross-platform solution to record,
      convert, and stream audio and video.
  display-name-sources:
    - source_facts.name is ffmpeg@4; official download page lists FFmpeg 4.x releases.
  docs-sources:
    - >
      Official FFmpeg documentation page lists command-line tools, components, and
      library documentation.
  history-sources:
    - https://ffmpeg.org/about.html
    - https://ffmpeg.org/download.html
    - https://ffmpeg.org/documentation.html
    - https://formulae.brew.sh/formula/ffmpeg@4
  repo-sources:
    - >
      source_facts.repo is empty; official FFmpeg download page says to clone
      https://git.ffmpeg.org/ffmpeg.git and labels it the main FFmpeg Git repository.
  tags-sources:
    - >
      source_facts.description and executables ffmpeg, ffplay, and ffprobe support
      audio/video conversion, playback, probing, streaming, and CLI tags.
category-confidence: high
category-path:
  - media
  - video
  - conversion
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
