history:
  adoption-history:
    - >
      The Mac edition carries the established Clibor clipboard workflow to macOS,
      including clipboard history, reusable template text, keyboard-driven operation,
      and FIFO/LIFO queues. Its official site provides localized instructions and a
      direct download rather than relying on third-party redistribution.
  package-nerd-significance:
    - >
      Clibor appeals to clipboard power users because it goes beyond recalling recent
      copies: templates, macros, formatting, search, hotkeys, and FIFO/LIFO modes
      support repetitive text-entry workflows. The Homebrew cask offers a convenient
      installation route for a utility distributed from the developer’s own site.
  project-history:
    - >
      Clibor is a personal project by developer Chigusa and originated as a
      clipboard-history utility on Windows. Clibor for Mac subsequently adapted its
      clipboard history, templates, and queue-oriented features to a native menu-bar
      workflow. The Mac changelog begins with version 1.0 and records later
      localization, hotkey, customization, and macOS compatibility work.
  related-projects:
    - >
      Clibor for Windows is the original sibling application; the developer also
      maintains Quipha and TXT-Crypter.
  sources:
    - https://chigusa-web.com/clibor-for-mac-en/history/ — official Mac release history.
    - >
      https://chigusa-web.com/clibor-for-mac-en/howto/ — official usage guide and
      developer description.
    - source_facts.homepage — supplied official Mac product page.
  summary:
    - >
      Clibor for Mac is a menu-bar clipboard-history and reusable-text utility. It
      combines searchable clipboard recall with templates, keyboard control, formatting
      aids, and FIFO/LIFO copying workflows.
  timeline:
    - 'Version 1.0: Initial Clibor for Mac application release.'
    - 'Version 1.1: English-language support was added.'
    - '2025: Version 1.6 added support for macOS Tahoe 26.'
  usage:
    - >
      After launch, Clibor remains in the menu bar rather than the Dock. Users can open
      it from the menu-bar icon or a hotkey, retrieve clipboard history, insert saved
      templates, and use FIFO/LIFO mode for sequential copying and pasting.
