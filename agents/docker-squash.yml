config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project was packaged for installation from source, PyPI, and Homebrew. Its
      relevance is strongest in the legacy Docker builder era, before BuildKit and
      multi-stage builds reduced the need for post-processing images to remove
      build-time artifacts.
  package-nerd-significance:
    - >
      docker-squash is notable because it packages image-layer surgery as a normal CLI
      command. It is a useful historical artifact for understanding how Docker users
      handled layer bloat before modern Dockerfile patterns and BuildKit made the
      problem less central.
  project-history:
    - >
      The README describes docker-squash as a tool that can squash the last n layers of
      an image or squash from a selected layer to the end, then load the result back
      into the Docker daemon or store it as a tar archive. It explicitly frames
      squashing as a way to organize images into more logical layers and avoid carrying
      temporary files.
  related-projects:
    - >
      Related projects include Docker Engine, Docker's legacy builder, BuildKit,
      multi-stage Dockerfiles, and the docker history command used to inspect image
      layers.
  sources:
    - https://github.com/goldmann/docker-squash#readme
    - https://docs.docker.com/engine/deprecated/#legacy-builder-for-linux-images
  summary:
    - >
      docker-squash is a Python CLI for squashing Docker image layers. It grew out of a
      practical image-size problem: Dockerfile instructions create layers, temporary
      build artifacts can remain in earlier layers, and pushing, saving, or loading
      those images can cost unnecessary time and storage.
  timeline:
    - 'Docker 1.9 era: The README documents Docker 1.9 or newer support.'
    - 'Python 3 era: The README documents Python 3.6 and newer support.'
    - >
      BuildKit era: Docker documents the legacy Linux image builder as deprecated,
      making squashing tools more historical and niche.
  usage:
    - >
      A typical command selects an image, optionally sets --from-layer or a number of
      layers, tags the new image with --tag, writes an archive with --output-path, or
      controls whether the result is loaded back into Docker. The README examples
      compare docker history before and after squashing to show layer changes.
related-packages:
  - id: brew:docker-buildx
    reason: >
      Choose Docker Buildx with a multi-stage Dockerfile for new builds that should
      exclude build-time artifacts up front; docker-squash instead rewrites the layers
      of an existing image afterward.
    rel: alternative
    sources:
      - https://github.com/goldmann/docker-squash#readme
      - https://docs.docker.com/build/building/multi-stage/
      - https://docs.docker.com/reference/cli/docker/buildx/
