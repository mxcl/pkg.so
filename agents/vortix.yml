history:
  adoption-history:
    - >
      The project distributes through several package cultures: Homebrew, Arch Linux,
      Cargo, npm, Nix, a shell installer, and static Linux binaries. Its release assets
      cover both macOS architectures and Linux GNU and musl targets.
  package-nerd-significance:
    - >
      Vortix is notable for wrapping the established WireGuard and OpenVPN command-line
      implementations rather than replacing their protocols. It adds a keyboard-driven
      TUI, structured JSON and NDJSON output, multi-tunnel control, telemetry,
      DNS-policy checks, and kill-switch management.
  project-history:
    - >
      Vortix is a Rust terminal application created to give WireGuard and OpenVPN users
      a common operational interface. Its official releases document an active 0.x
      series during 2026, with release 0.1.8 published in March 2026 and later releases
      expanding lifecycle reliability and platform behavior.
  related-projects:
    - WireGuard
    - OpenVPN
    - wg-quick
    - Ratatui
  sources:
    - https://github.com/Harry-kp/vortix#readme
    - https://github.com/Harry-kp/vortix/releases
  summary:
    - >
      Vortix is a cross-platform terminal UI and CLI for controlling WireGuard and
      OpenVPN tunnels while observing network health and possible traffic leaks.
  timeline:
    - >
      2026-03-19: Release 0.1.8 provided packaged binaries for macOS and Linux alongside
      Homebrew and npm installation.
    - "2026: The 0.4 release series continued the project's pre-1.0 development."
  usage:
    - >
      Users import WireGuard `.conf` or OpenVPN `.ovpn` profiles, then connect and
      disconnect them from the TUI or CLI. Read-only inspection can run unprivileged,
      while tunnel, route, DNS, and firewall changes require elevated privileges.
    - >
      The tool is suited to local terminals, SSH sessions, scripts consuming JSON
      output, and systems where native VPN tools are preferred over a provider-specific
      desktop client.
