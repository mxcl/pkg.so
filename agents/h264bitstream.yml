history:
  adoption-history:
    - >
      h264bitstream adoption is narrower than end-user video tools because it is a
      developer library and analyzer. Its package-manager presence in Homebrew exposes
      the h264_analyze executable and library for developers who need to inspect Annex B
      bitstreams, headers, SPS/PPS data, SEI data, AVCC records, and related syntax.
    - >
      Its SourceForge and GitHub history also show why it appears in package collections
      despite a niche audience: H.264 is a widely deployed video standard, and a small
      portable C parser is useful for debugging, research, conformance exploration, and
      media tooling.
  package-nerd-significance:
    - >
      h264bitstream matters to package nerds because it is a small C library with a CLI
      probe, pkg-config metadata, CMake and Autotools support, and a stable niche in
      media-development workflows. It is the kind of dependency that appears when
      someone needs to inspect the exact shape of H.264 packets rather than play video.
    - >
      It also illustrates the difference between packaging media codecs and packaging
      media bitstream tooling. h264bitstream avoids being a codec implementation while
      still touching a patented and standards-heavy media domain, so distribution
      attention tends to focus on license, headers, build systems, and developer
      utility.
  project-history:
    - >
      The project's CHANGES file records version 0.1.3 as the first public release on
      October 12, 2005. The README and source headers identify Alex Izvorski as the
      author, with copyright lineage through Auroras Entertainment, Alex Izvorski, Alex
      Giladi, and contributors.
    - >
      The project began on SourceForge and later moved its main source presence to
      GitHub. SourceForge's project page states that the project is on GitHub and
      describes libh264bitstream as a complete set of functions to read and write video
      bitstreams conforming to ITU-T H.264 / ISO/IEC 14496-10 AVC. GitHub repository
      metadata records the public GitHub repository as created in April 2014.
    - >
      The 0.2.0 release in April 2017 was a significant maintenance and modernization
      point: the change log lists code generation, conversion of much code to generated
      macroized code, multiple PPS/SPS handling, AVCC read/write support, SEI work,
      slice-data handling, automake/libtool integration, CI, and tests.
  related-projects:
    - >
      h264bitstream is related to the ITU-T H.264 / ISO/IEC 14496-10 AVC standard, Annex
      B byte-stream tooling, AVCC/MP4 workflows, FFmpeg-adjacent debugging, and other
      H.264 analyzers. It also has downstream and fork activity where developers wrap or
      adapt the parser for specific inspection tools.
  sources:
    - https://api.github.com/repos/aizvorski/h264bitstream
    - https://github.com/aizvorski/h264bitstream
    - https://raw.githubusercontent.com/aizvorski/h264bitstream/master/CHANGES
    - https://raw.githubusercontent.com/aizvorski/h264bitstream/master/README.md
    - https://raw.githubusercontent.com/aizvorski/h264bitstream/master/h264_analyze.c
    - https://sourceforge.net/projects/h264bitstream/
  summary:
    - >
      h264bitstream is a C library and command-line analyzer for reading and writing
      H.264 video bitstreams, especially headers and NAL-unit syntax. Its history is
      modest but useful: it gives developers a small LGPL library for inspecting and
      modifying H.264 structure without being a full encoder or decoder.
  timeline:
    - '2005: Version 0.1.3 was published as the first public release.'
    - >
      2006: Version 0.1.5 added README, CHANGES, TODO, Doxygen public API documentation,
      and public allocation helpers.
    - >
      2007: Version 0.1.6 added initial SEI support, public RBSP/NAL conversion helpers,
      AUD support, and large-file handling in h264_analyze.
    - '2014: The public GitHub repository was created.'
    - >
      2017: Version 0.2.0 added generated-code infrastructure, AVCC support, better
      PPS/SPS handling, more SEI parsing, CI, and tests.
  usage:
    - >
      The README shows the public API around h264_new, h264_free, find_nal_unit,
      read_nal_unit, write_nal_unit, rbsp_to_nal, nal_to_rbsp, and debug_nal. The
      h264_analyze program reads H.264 bitstreams in Annex B format and can print stream
      information, including codec information for HTML5 video tag use.
    - >
      The project is explicit that it is not an encoder or decoder. It understands H.264
      syntax but not full picture semantics, making it a building block for analyzers,
      validators, format converters, and header-manipulation tools rather than a media
      player.
