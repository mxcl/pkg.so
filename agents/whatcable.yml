history:
  adoption-history:
    - >
      WhatCable is distributed as a signed and notarized macOS application and through
      its own Homebrew tap. The Homebrew cask also installs the bundled command-line
      tool.
    - >
      The free, open-source application covers current-connection diagnostics, while an
      optional Pro license adds saved-cable history, live measurements, and deeper
      negotiation and display analysis. The project also accepts explicitly submitted
      diagnostic observations for a public cable database.
  package-nerd-significance:
    - >
      WhatCable exposes low-level USB-C, USB Power Delivery, USB4, Thunderbolt, and
      display-link information that macOS normally leaves difficult to interpret. Its
      bundled CLI can emit structured JSON for scripts and supports watch-style
      workflows, making the project useful beyond its menu-bar interface.
    - >
      It is particularly useful when validating whether a nominally identical USB-C
      cable is limiting charging, data throughput, or display performance.
  project-history:
    - >
      WhatCable was created by Darryl Morley as a focused macOS utility for explaining
      what connected USB-C cables, chargers, devices, and ports actually negotiated. It
      is published as an MIT-licensed Bitmoor product.
    - >
      The project expanded from a menu-bar readout into a diagnostic suite with a CLI,
      cable identity and certification checks, display and power analysis,
      community-contributed observations, and optional Pro investigation tools.
  related-projects:
    - >
      The developer also publishes related macOS hardware utilities including
      WhatBattery and WhatPort.
    - >
      The separate WhatCable Android project applies a similar charging-diagnostics idea
      on Android.
  sources:
    - 'Official guide: https://www.whatcable.uk/instructions'
    - 'Official homepage: https://www.whatcable.uk/'
    - 'Official repository: https://github.com/darrylmorley/whatcable'
  summary:
    - >
      WhatCable is an open-source macOS menu-bar application and CLI that explains USB-C
      cable identity, charging capability, negotiated data speed, connected-device
      topology, and display bottlenecks.
  timeline:
    - >
      The official documentation records the addition of a bundled command-line tool and
      later diagnostic features such as cable history, live power metering, and display
      analysis.
  usage:
    - >
      Connect a cable, charger, display, dock, or USB device and open the menu-bar
      popover to see a plain-language assessment for each port.
    - >
      Run `whatcable` for terminal summaries or structured JSON suitable for jq and
      automation. The official guide states that the application needs no account or
      initial configuration.
    - >
      WhatCable requires Apple Silicon and macOS 14 or later because the relevant
      port-controller data is not exposed on Intel Macs.
