credentials-file-location: null
history:
  adoption-history:
    - >
      Reveal states that it has formed part of the development and debugging workflow of
      thousands of iOS developers since 2013. It followed Apple's platform changes by
      adding device, app-extension, tvOS, layout, and accessibility inspection
      capabilities.
  package-nerd-significance:
    - >
      Reveal is a specialist macOS companion to Xcode that makes an application's live
      view hierarchy visually inspectable. Its integration through LLDB and an embedded
      Reveal Server framework is especially relevant to developers and package
      maintainers because installation can modify the user's debugger startup file.
  project-history:
    - >
      Reveal began serving iOS developers in 2013 as a runtime interface-inspection
      tool. Reveal 2 arrived in 2016 with a redesigned interface, USB connections,
      app-extension inspection, and a faster release model. Reveal 25 changed new
      licenses to a subscription model in 2020; the product later broadened its emphasis
      to mobile accessibility inspection and testing.
  related-projects:
    - >
      Reveal integrates with Xcode and LLDB and loads Reveal Server into iOS or tvOS
      applications under inspection. It complements, rather than replaces, Xcode's own
      view-debugging and accessibility tools.
  sources:
    - https://revealapp.com/
    - https://revealapp.com/news/reveal-2/
    - https://revealapp.com/news/reveal-25-announcement/
    - https://support.revealapp.com/article/14-reveal-server-debugger-support
  summary:
    - >
      Reveal is a proprietary macOS runtime UI inspector and accessibility-testing tool
      for developers of Apple-platform applications.
  timeline:
    - '2013: Reveal began serving iOS developers.'
    - >
      2016: Reveal 2 introduced USB inspection, app-extension support, filtering, and a
      redesigned interface.
    - '2020: Reveal 25 moved new licenses to a 12-month subscription.'
    - >
      2026: Reveal is marketed as a combined mobile UI inspection, layout-debugging, and
      accessibility-testing suite.
  usage:
    - >
      Developers run an iOS or tvOS application, load or embed Reveal Server, and
      connect the Reveal Mac application to inspect view hierarchies, constraints,
      layouts, and accessibility behavior at runtime. Reveal's optional debugger-command
      installer adds its LLDB import directive to ~/.lldbinit.
