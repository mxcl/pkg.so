history:
  adoption-history:
    - >
      Epstool has a quiet but durable packaging footprint because EPS preview and
      bounding-box repair are recurring needs in TeX, publishing, and PostScript
      workflows. In this dataset it is packaged by Homebrew, Debian, Fedora, MacPorts,
      Nix, and Ubuntu.
  package-nerd-significance:
    - >
      Epstool is a classic small Unix-style graphics utility: it does a narrow EPS
      repair/conversion job, depends on Ghostscript for bitmap generation, and remains
      useful to people keeping older PostScript publishing workflows reproducible.
  project-history:
    - >
      The official page distributes epstool 3.09 as Windows zip and Unix tar.gz archives
      and was updated on August 11, 2018. It fits the Ghostscript/GSview ecosystem of
      practical PostScript tools maintained by Russell Lang.
  related-projects:
    - Ghostscript is used by Epstool to create preview bitmaps.
    - GSview is part of the same Ghostgum/PostScript tooling context.
  sources:
    - https://www.ghostgum.com.au/software/epstool.htm
  summary:
    - >
      Epstool is a Ghostgum utility for Encapsulated PostScript files. Its official page
      describes it as a tool to create or extract preview images in EPS files, fix
      bounding boxes, and convert EPS content to bitmaps.
  timeline:
    - '2018: Official Epstool page updated and epstool 3.09 offered for Windows and Unix.'
  usage:
    - >
      Documented examples include adding TIFF previews, extracting previews, calculating
      a corrected BoundingBox from a Ghostscript bitmap, and copying an EPS file while
      adjusting its BoundingBox. The page says it works on Win32, Win64, OS/2, and Unix.
related-packages:
  - id: brew:ghostscript
    reason: >
      Ghostscript is Epstool's documented rendering engine for creating preview bitmaps,
      so installing it enables Epstool's preview-generation and bounding-box calculation
      workflows.
    rel: adjacent_workflow
    sources:
      - https://www.ghostgum.com.au/software/epstool.htm
      - https://ghostscript.readthedocs.io/
