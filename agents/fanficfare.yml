  history-sources:
    - https://api.github.com/repos/JimmXinu/FanFicFare
    - https://github.com/JimmXinu/FanFicFare#readme
    - https://github.com/JimmXinu/FanFicFare/releases/tag/v4.59.0
    - https://github.com/JimmXinu/FanFicFare/wiki
    - https://github.com/JimmXinu/FanFicFare/wiki/INI-File
    - source_facts.package-manager
  repo-sources:
    - >
      source_facts.homepage points to the official JimmXinu/FanFicFare project page,
      whose README identifies FanFicFare and its official distribution channels.
  tags-sources:
    - >
      The official README documents the Python CLI, calibre plugin, supported story
      sites, and EPUB-oriented workflow.
