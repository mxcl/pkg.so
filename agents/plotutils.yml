id: brew:plotutils
display-name: GNU Plotutils
repo: null
docs:
  - https://www.gnu.org/software/plotutils/manual
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GNU positions Plotutils as a replacement for traditional Unix graph, plot, and
      spline utilities, with command-line programs intended for shell scripts and
      technical workflows.
  package-nerd-significance:
    - >
      Plotutils is package-manager-relevant because it preserves the Unix plotting-tool
      lineage while shipping a reusable graphics library, many small CLI front ends, and
      broad output-format support in one GNU tarball.
  project-history:
    - >
      The GNU project page says Plotutils' current release is 2.6 from September 2009
      and names Robert Maier and Nick Tufillaro as primary authors.
  related-projects:
    - >
      Related tools and formats include traditional Unix plot utilities, GNU graph,
      libplot, xfig, idraw, SVG, PNG, PostScript, and gnuplot as a neighboring plotting
      culture.
  sources:
    - https://www.gnu.org/software/plotutils/
    - https://www.gnu.org/software/plotutils/manual/
    - https://www.gnu.org/software/plotutils/manual/en/html_node/graph.html
    - https://www.gnu.org/software/plotutils/manual/en/html_node/index.html
  summary:
    - >
      GNU Plotutils is a GNU package of command-line plotting tools and the libplot
      C/C++ library for device-independent 2-D vector graphics.
  timeline:
    - '2000: GNU Plotutils project page copyright begins.'
    - '2009: Plotutils 2.6 released.'
    - '2019: GNU project page last updated.'
  usage:
    - >
      Users commonly invoke tools such as graph, plot, pic2plot, tek2plot, plotfont,
      spline, and ode to produce or convert 2-D graphics in formats including SVG, PNG,
      PostScript, HP-GL, Fig, Tektronix, and GNU Metafile.
