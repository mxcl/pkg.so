id: brew:mariadb@12.3
display-name: MariaDB 12.3
repo: https://github.com/MariaDB/server
docs:
  - https://mariadb.com/docs/server
  - >
    https://mariadb.com/docs/server/server-management/install-and-upgrade-mariadb/configuring-mariadb/configuring-mariadb-with-option-files
config-file-location:
  unix:
    - /etc/my.cnf
    - /etc/mysql/my.cnf
    - $MARIADB_HOME/my.cnf
    - $MYSQL_HOME/my.cnf
    - ~/.my.cnf
  windows:
    - System Windows Directory\my.ini
    - System Windows Directory\my.cnf
    - Windows Directory\my.ini
    - Windows Directory\my.cnf
    - C:\my.ini
    - C:\my.cnf
    - INSTALLDIR\my.ini
    - INSTALLDIR\my.cnf
    - INSTALLDIR\data\my.ini
    - INSTALLDIR\data\my.cnf
    - '%MARIADB_HOME%\my.ini'
    - '%MARIADB_HOME%\my.cnf'
    - '%MYSQL_HOME%\my.ini'
    - '%MYSQL_HOME%\my.cnf'
credentials-file-location:
  unix:
    - ~/.my.cnf
history:
  adoption-history:
    - >
      MariaDB retained broad compatibility with MySQL clients and application
      conventions, easing migration and allowing distributions and package managers to
      offer it as a MySQL-compatible server. The MariaDB Foundation identifies
      Wikipedia, WordPress.com, and Google among notable users and describes uses
      spanning transactional systems, analytics, and embedded deployments.
  package-nerd-significance:
    - >
      MariaDB is one of the defining database forks in open-source package ecosystems.
      It preserves familiar MySQL protocols, tools, option-file conventions, and SQL
      workflows while being independently governed and GPLv2-licensed, making it a
      common distribution-level alternative to MySQL.
  project-history:
    - >
      MariaDB began in 2009 when MySQL founder Michael “Monty” Widenius forked MySQL
      following Oracle's acquisition of Sun and concerns about future stewardship. It
      was named after Widenius's daughter Maria, continuing MySQL's family-name
      convention.
    - >
      Many members of the original MySQL team joined the new project. In 2012, Michael
      Widenius, David Axmark, and Allan Larsson announced the nonprofit MariaDB
      Foundation to safeguard the interests of MariaDB users and developers as the
      server evolved beyond its initial MySQL-fork role.
  related-projects:
    - MySQL
    - MariaDB Foundation
    - Galera Cluster
    - MariaDB Connector/C
    - Percona Server
  sources:
    - https://github.com/MariaDB/server
    - https://mariadb.com/docs/server/
    - https://mariadb.org/en/
    - https://mariadb.org/mariadb-foundation-to-safeguard-leading-open-source-database/
  summary:
    - >
      MariaDB Server is an open-source relational database management system derived
      from MySQL. It supports transactional, analytical, embedded, replication, and
      high-availability workloads while retaining extensive MySQL ecosystem
      compatibility.
  timeline:
    - >
      2009: Michael “Monty” Widenius and other original MySQL developers created and
      first released MariaDB.
    - >
      2012: The nonprofit MariaDB Foundation was announced to safeguard the project's
      users, developers, and open development model.
  usage:
    - >
      Install and initialize the server, run `mariadbd` as a service, and connect with
      the `mariadb` command-line client or a compatible connector. Server and client
      settings are read from ordered `my.cnf` files on Unix-like systems or
      `my.ini`/`my.cnf` files on Windows; `mariadbd --help --verbose` prints the exact
      paths for a particular build.
    - >
      Client credentials may be placed in a restricted-permission `~/.my.cnf` option
      file, although prompting for a password or using an external secret store avoids
      keeping a plaintext password in a broadly readable file. MariaDB does not support
      MySQL's `.mylogin.cnf` credential format.
tags:
  - cli
  - client-server
  - database
  - database-server
  - mysql-compatible
  - open-source
  - relational-database
  - sql
provenance:
  category-sources:
    - >
      MariaDB Foundation describes MariaDB Server as a general-purpose open-source
      relational database management system: https://mariadb.org/en/
  display-name-sources:
    - >
      Official project branding is MariaDB Server; the versioned Homebrew package name
      is supplied by source_facts.name as `mariadb@12.3`.
  docs-sources:
    - >
      MariaDB's official Server documentation is the authoritative documentation
      surface; its option-file guide documents default Unix-like and Windows search
      paths.
  history-sources:
    - https://github.com/MariaDB/server
    - https://mariadb.com/docs/server/
    - https://mariadb.org/en/
    - https://mariadb.org/mariadb-foundation-to-safeguard-leading-open-source-database/
  repo-sources:
    - >
      The official MariaDB organization hosts the MariaDB Server source repository at
      https://github.com/MariaDB/server; repository determination was required because
      source_facts.repo is empty.
  tags-sources:
    - >
      MariaDB Foundation and official Server documentation describe MariaDB as an
      open-source relational database server compatible with established MySQL
      workflows: https://mariadb.org/en/
category-confidence: high
category-path:
  - data
  - databases
  - relational-databases
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
