id: brew:efm-langserver
display-name: efm-langserver
repo: null
docs:
  - https://github.com/mattn/efm-langserver#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/efm-langserver/config.yaml
    - ~/.config/efm-langserver/config.yaml
  windows:
    - '%APPDATA%\efm-langserver\config.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The project grew with the editor shift toward LSP clients. Its README includes
      setup examples for vim-lsp, coc.nvim, Emacs Eglot, Neovim built-in LSP via
      nvim-lspconfig, Helix, and VSCode, showing adoption across several editor
      families.
  package-nerd-significance:
    - >
      efm-langserver matters in package metadata because it is glue: one binary can
      expose many existing command-line tools to any LSP-capable editor, reducing the
      need for per-editor integrations.
  project-history:
    - >
      The public repository was created in 2019 by mattn. Its README describes a
      language server that parses error-message formats from configured commands, which
      lets editors consume ordinary CLI linting and formatting tools through LSP.
  related-projects:
    - >
      Related projects are the Language Server Protocol itself, vim-lsp, coc.nvim,
      Eglot, nvim-lspconfig, Helix, VSCode, and the many external linters and formatters
      configured behind efm-langserver.
  sources:
    - https://github.com/mattn/efm-langserver
    - https://raw.githubusercontent.com/mattn/efm-langserver/master/README.md
    - https://api.github.com/repos/mattn/efm-langserver
    - https://github.com/mattn/efm-langserver/releases/tag/v0.0.56
  summary:
    - >
      efm-langserver is a general-purpose Language Server Protocol bridge for external
      linters, formatters, hover commands, completion commands, and other command-line
      tools.
  timeline:
    - '2019: Public GitHub repository created.'
    - '2026: v0.0.56 published.'
  usage:
    - >
      Users install efm-langserver, create config.yaml, and map languages to external
      commands. The server does not bundle the linters or formatters; users install
      tools such as yapf, isort, markdownlint-cli, jq, eslint, black, mypy, or prettier
      separately.
    - >
      Configuration can come from a config.yaml file or from LSP DidChangeConfiguration
      notifications, with documented Unix and Windows default paths.
related-packages:
  - id: brew:neovim
    reason: >
      Neovim's built-in LSP client can configure and launch efm-langserver directly,
      including sending settings that make config.yaml optional.
    rel: adjacent_workflow
    sources:
      - https://github.com/mattn/efm-langserver
      - https://neovim.io/doc/user/lsp.html
  - id: brew:helix
    reason: >
      Helix can register efm-langserver for selected language features such as
      diagnostics and formatting alongside language-specific servers.
    rel: adjacent_workflow
    sources:
      - https://github.com/mattn/efm-langserver
      - https://docs.helix-editor.com/languages.html
  - id: brew:prettier
    reason: >
      efm-langserver's official configuration examples invoke Prettier as a formatting
      backend for web-language files.
    rel: adjacent_workflow
    sources:
      - https://github.com/mattn/efm-langserver
      - https://prettier.io/docs/
  - id: brew:shellcheck
    reason: >
      efm-langserver's official example configuration uses ShellCheck as the diagnostic
      backend for shell scripts.
    rel: adjacent_workflow
    sources:
      - https://github.com/mattn/efm-langserver
      - https://www.shellcheck.net/
