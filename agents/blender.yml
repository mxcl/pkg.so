id: cask:blender
display-name: Blender
repo: https://projects.blender.org/blender/blender
docs:
  - https://docs.blender.org/api/current
  - https://docs.blender.org/manual/en/latest
config-file-location:
  linux:
    - ~/.config/blender/<version>/config/startup.blend
    - ~/.config/blender/<version>/config/userpref.blend
    - $XDG_CONFIG_HOME/blender/<version>/config/startup.blend
    - $XDG_CONFIG_HOME/blender/<version>/config/userpref.blend
  macos:
    - /Users/$USER/Library/Application Support/Blender/<version>/config/startup.blend
    - /Users/$USER/Library/Application Support/Blender/<version>/config/userpref.blend
  windows:
    - '%USERPROFILE%\AppData\Roaming\Blender Foundation\Blender\<version>\config\startup.blend'
    - '%USERPROFILE%\AppData\Roaming\Blender Foundation\Blender\<version>\config\userpref.blend'
credentials-file-location: null
history:
  adoption-history:
    - >
      Blender moved from an in-house studio tool to freely distributed software and then
      to a community-governed GPL project. The successful 2002 Free Blender campaign
      transferred its source and intellectual property into an open-source future.
    - >
      Open Movies and other production projects have repeatedly exercised Blender in
      real pipelines while funding and guiding improvements. Blender 2.8's redesigned
      interface, EEVEE renderer, sculpting improvements, and expanded 2D animation
      workflow marked its broad acceptance as an alternative to proprietary 3D suites.
    - >
      Today the Blender Foundation coordinates a worldwide contributor community, while
      individuals, studios, and corporate Development Fund members support continued
      development.
  package-nerd-significance:
    - >
      Blender is one of the flagship examples of professional creative software
      distributed as free and open source. It combines a large native application, an
      embedded Python environment, a public extension ecosystem, command-line rendering,
      and a reproducible source tree.
    - >
      For package maintainers it is a demanding but culturally important desktop
      package: builds span graphics APIs, rendering backends, codecs, Python
      integration, GPU support, and platform-specific packaging. For users,
      package-manager installation makes a complete 3D and media-production workstation
      readily accessible.
  project-history:
    - >
      Ton Roosendaal created Blender at the Dutch animation studio NeoGeo. The first
      source files bearing the Blender name date to January 1994, and Blender 1.0 became
      an in-house production tool in 1995.
    - >
      Not a Number was founded in 1998 to develop and market Blender, distributing it
      using a freemium model. After the company closed in 2002, Roosendaal formed the
      Blender Foundation and launched the Free Blender campaign. The community raised
      the required funds in seven weeks, and Blender was released under the GNU GPL on
      13 October 2002.
    - >
      The project subsequently used open productions to drive development. Elephants
      Dream began this pattern, while later landmarks included the Cycles path-tracing
      engine and the major Blender 2.8 interface and workflow redesign.
  related-projects:
    - >
      Blender's official ecosystem includes the Blender Manual, Python API, Blender
      Extensions, Blender Studio, and the projects and issue tracker hosted at
      projects.blender.org.
    - >
      Open productions such as Elephants Dream, Big Buck Bunny, Tears of Steel, Spring,
      and Sprite Fright have served both as creative works and as development test beds.
  sources:
    - >
      Official directory-layout documentation:
      https://docs.blender.org/manual/en/latest/advanced/blender_directory_layout.html
    - 'Official history: https://www.blender.org/about/history/'
    - 'Official project overview: https://www.blender.org/about/'
    - 'Official repository: https://projects.blender.org/blender/blender'
  summary:
    - >
      Blender is a free and open-source 3D creation suite spanning modeling, sculpting,
      rigging, animation, simulation, rendering, compositing, motion tracking, and video
      editing. The Blender Foundation coordinates its community-led development.
  timeline:
    - '1994: The first Blender source files were created at NeoGeo.'
    - '1995: Blender 1.0 entered use as an in-house production tool.'
    - '1998: Not a Number was founded to develop and distribute Blender.'
    - "2002: The Free Blender campaign funded recovery of the project's rights."
    - '2002: Blender was released under the GNU GPL on 13 October.'
    - '2005: The first Open Movie project began, leading to Elephants Dream.'
    - '2011: Cycles entered Blender as its production path-tracing renderer.'
    - '2019: Blender 2.8 delivered a major interface and workflow overhaul.'
  usage:
    - >
      Artists use Blender interactively for asset creation, sculpting, texturing,
      rigging, animation, simulation, lighting, rendering, compositing, motion tracking,
      and video editing.
    - >
      Technical users automate it through the Python API or run it from the command line
      for background rendering and pipeline work. Preferences, startup state, presets,
      extensions, and related user resources live beneath an operating-system-specific,
      versioned Blender user directory.
