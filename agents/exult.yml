id: brew:exult
display-name: Exult
repo: null
docs:
  - https://exult.sourceforge.io/docs.html
  - https://exult.sourceforge.io/faq.html
config-file-location:
  linux:
    - ~/.exult.cfg
    - ~/.var/apps/info.exult.exult/config/exult.cfg
  macos:
    - ~/Library/Preferences/exult.cfg
  windows:
    - '%LOCALAPPDATA%\Exult\exult.cfg'
credentials-file-location: null
history:
  adoption-history:
    - >
      Exult's audience is the long-lived Ultima VII fan community. The project
      documentation explicitly frames Ultima VII as an early-1990s RPG with a large
      following and a nonstandard DOS memory manager that makes it difficult to run on
      current computers.
    - >
      The project has repeatedly followed users onto new platforms: its history mentions
      Windows, Mac OS X, Linux distributions, Sharp Zaurus, PocketPC, iOS, Android, and
      later GitHub-based development. In 2016, source control moved to Git on GitHub
      while the website and community infrastructure stayed on SourceForge.
    - >
      Exult also became a base for mods and tooling. Exult Studio, usecode tooling, map
      editing, the Keyring mod, Serpent Isle fixes, audio packs, and later the Ultima VI
      remake mod are all part of its official project history.
  package-nerd-significance:
    - >
      Exult is a classic example of how open-source package managers preserve old
      commercial software ecosystems without shipping the commercial software itself.
      The package contains the replacement engine; the user supplies the data.
    - >
      It is also a useful case study in long-running portability work: SDL backends,
      audio driver changes, old operating-system support, platform-specific config
      paths, and helper tools all show up in the release history.
  project-history:
    - >
      Exult emerged from fan reverse-engineering work around Ultima VII's data formats
      and game behavior. The official README credits earlier work decoding Ultima VII
      data files and describes the goal as running the games on modern hardware as close
      to their original presentation as possible.
    - >
      The project reached a 1.0 release in November 2002 after four years of coding,
      followed by the major 1.2 release in June 2004. After 1.2, Exult entered a long
      experimental period focused on Exult Studio, mod support, decoded game details,
      graphics/audio rewrites, and gameplay correctness.
    - >
      Long release gaps became part of the project's story. The official history
      describes 1.4.9rc1 in 2010, years of bug hunting, and a renewed stable release
      cadence with 1.6 in 2020, 1.8 in 2022, 1.10 in 2024, and 1.12/1.12.1 in 2025-2026.
  related-projects:
    - >
      Ultima VII: The Black Gate and Ultima VII Part 2: Serpent Isle are the original
      games Exult runs.
    - Exult Studio is the project's editing and modding companion.
    - >
      Pentagram is a related Ultima VIII engine effort mentioned in Exult's development
      history.
    - >
      Mods such as Keyring, Serpent Isle Fixes, and the Ultima VI remake show how Exult
      became a platform for fan restoration and expansion.
  sources:
    - https://exult.sourceforge.io/
    - https://exult.sourceforge.io/history.html
    - https://exult.sourceforge.io/docs.html
    - https://github.com/exult/exult
  summary:
    - >
      Exult is an open-source recreation of the Ultima VII engine for modern operating
      systems. It lets owners of Ultima VII: The Black Gate and Ultima VII Part 2:
      Serpent Isle play those DOS-era games using the original data and graphics files.
    - >
      The project matters in package-manager culture because it packages game
      preservation as a native executable rather than as a DOS compatibility wrapper.
      Installing Exult gives users a maintained SDL-based engine plus
      command-line/helper tools, while the copyrighted game data remains outside the
      package.
  timeline:
    - '2001: Exult beta is released.'
    - '2002: Exult 1.0 is released after four years of coding.'
    - '2004: Exult 1.2 is released as a major bugfix and gameplay-improvement version.'
    - '2010: Exult 1.4.9rc1 is released after more than six years.'
    - '2016: Source code versioning moves to Git on GitHub.'
    - '2020: Exult 1.6 is released after a long stable-release gap.'
    - "2022: Exult 1.8 is released for Ultima VII's 30th birthday."
    - '2024: Exult 1.10 is released.'
    - '2026: Exult 1.12.1 is released as a hotfix.'
  usage:
    - >
      Users need a legal copy of Ultima VII data files, then configure Exult to find the
      Black Gate and/or Serpent Isle folders. The setup and game menus cover most
      options, while exult.cfg handles paths and advanced settings.
    - >
      Exult can be launched directly into supported games, mods, or map-editing mode. It
      stores per-platform configuration paths, save data, logs, screenshots, audio
      settings, and optional mod paths, making it feel like a native port even though it
      depends on the original assets.
    - >
      For package users, the Homebrew formula is the engine and tools, not the game.
      That split is important: the package can be freely distributed, but the user's
      original game files provide the copyrighted content.
related-packages:
  - id: cask:dosbox
    reason: >
      Use DOSBox to run the original Ultima VII floppy installers and extract their game
      data before pointing Exult at the installed files.
    rel: adjacent_workflow
    sources:
      - https://exult.sourceforge.io/docs.html
      - https://www.dosbox.com/DOSBoxManual.html
  - id: brew:scummvm
    reason: >
      Use ScummVM for the related Pentagram-based Ultima VIII engine work; Exult's FAQ
      explains that Pentagram was merged into ScummVM while Exult remains focused on
      Ultima VII.
    rel: alternative
    sources:
      - https://exult.sourceforge.io/faq.html
      - https://www.scummvm.org/
      - https://docs.scummvm.org/
