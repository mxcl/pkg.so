history:
  adoption-history:
    - >
      Doppler CLI adoption follows the growth of secrets management in local development
      and CI/CD. Its README explicitly targets local setup, CI jobs, package-manager
      installs, and applications launched with secrets injected into their environment.
  package-nerd-significance:
    - >
      Doppler CLI is package-nerd significant because it is a security-sensitive vendor
      CLI with unusually broad install paths and signature-aware packaging. It is the
      kind of package where update channels, shell installers, OS package repositories,
      and CI friendliness all matter.
  project-history:
    - >
      The public DopplerHQ/cli repository was created in October 2019. The README
      presents it as the official CLI for the Doppler service, and the docs describe it
      as an open-source lightweight binary available across major operating systems,
      package managers, and Docker.
    - >
      The CLI matured into a broad distribution surface: Homebrew for macOS, winget and
      Scoop for Windows, apk, apt, yum, Docker, shell script installation, standalone
      binaries, and a GitHub Action. GitHub release metadata shows the 3.x line
      continuing through at least 3.76.0 in April 2026.
  related-projects:
    - >
      Related projects include Doppler, Doppler CLI Action, Doppler package
      repositories, Docker images, shell-script installers, winget, Scoop, Homebrew,
      apk, apt, and yum.
  sources:
    - https://github.com/DopplerHQ/cli#readme
    - https://github.com/DopplerHQ/cli/blob/master/INSTALL.md
    - https://docs.doppler.com/docs/cli
    - https://api.github.com/repos/DopplerHQ/cli
    - https://api.github.com/repos/DopplerHQ/cli/releases
    - https://formulae.brew.sh/formula/doppler
  summary:
    - >
      Doppler CLI is the official command-line client for Doppler secrets and
      configuration. It manages projects, environments, secrets, audit data, and process
      execution with injected environment variables.
  timeline:
    - '2019: The public DopplerHQ/cli repository is created.'
    - >
      2020s: The CLI gains package-manager, shell-script, Docker, standalone binary, and
      GitHub Action install paths.
    - '2025: Release metadata shows active 3.75.x releases.'
    - '2026: Release metadata shows 3.76.0 published in April.'
  usage:
    - >
      Typical usage begins with `doppler login` to create auth credentials and `doppler
      setup` to select a project and config for the current directory. Users then run
      commands or applications through the CLI so secrets are supplied as environment
      variables.
