history:
  adoption-history:
    - >
      envchain is a niche but established package-manager tool. Its README documents
      Homebrew installation, and Homebrew formula analytics showed hundreds of annual
      installs during this enrichment run. The input package facts also list Nix
      packaging.
  package-nerd-significance:
    - >
      envchain is part of a family of small Unix secret-handling wrappers that try to
      make environment variables less dangerous without changing the tools that consume
      them. Its package value is in bridging native desktop secret stores with ordinary
      CLI workflows.
  project-history:
    - >
      The README positions envchain as a response to the common practice of putting
      credentials such as AWS access keys in shell initialization files. Instead of
      writing those secrets to `.bashrc` or `.zshrc`, envchain stores them in a secure
      vault under namespaced entries.
    - >
      The project supports macOS Keychain and Linux Secret Service backends such as
      GNOME Keyring and KeePassXC. Its documented platform requirements include macOS
      versions from the OS X era and Linux systems with readline, libsecret, and D-Bus
      Secret Service support.
  related-projects:
    - >
      envchain relates to macOS Keychain, GNOME Keyring, KeePassXC, libsecret, and the
      D-Bus Secret Service specification.
    - >
      It overlaps with dotenv-style workflows, but stores values in platform secret
      stores rather than in project files.
  sources:
    - https://github.com/sorah/envchain/blob/master/README.md
    - https://formulae.brew.sh/formula/envchain
  summary:
    - >
      envchain is a security-focused CLI for storing secret environment variables in the
      macOS Keychain or a D-Bus Secret Service provider, then exposing them only for
      explicitly launched commands.
  timeline:
    - '2010s: envchain documents OS X Keychain support and later Linux Secret Service support.'
    - '2010s: Homebrew installation is documented in the upstream README.'
    - '2020s: The tool remains packaged as a small credential wrapper for macOS and Linux.'
  usage:
    - >
      Users create a namespace with `envchain --set NAMESPACE ENV ...`, enter secret
      values interactively, and then run commands as `envchain namespace command`. The
      tool injects only the variables from the requested namespace into that child
      process.
    - >
      Multiple namespaces can be combined, which supports workflows such as separating
      AWS credentials from chatbot or service credentials while still composing them for
      a particular command.
related-packages:
  - id: cask:keepassxc
    reason: >
      On Linux, KeePassXC can provide the D-Bus Secret Service vault that envchain uses
      to store and retrieve namespaced environment-variable credentials.
    rel: adjacent_workflow
    sources:
      - https://github.com/sorah/envchain#readme
      - https://keepassxc.org/docs/KeePassXC_UserGuide#_secret_service_integration
