id: brew:mecab
display-name: MeCab
repo: https://github.com/taku910/mecab
docs:
  - https://taku910.github.io/mecab
config-file-location:
  unix:
    - /usr/local/etc/mecabrc
    - ~/.mecabrc
    - /usr/local/lib/mecab/ipadic/dicrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Official downloads separate the engine from dictionaries such as IPA, Juman, and
      UniDic, and list bindings for Perl, Ruby, Python, and Java. The input package
      facts show broad package-manager coverage across Homebrew, Debian, Ubuntu, Fedora,
      MacPorts, and Nix, reflecting MeCab's long-lived role as infrastructure for
      Japanese NLP.
  package-nerd-significance:
    - >
      MeCab is a classic package-manager NLP dependency: small native engine, separate
      dictionaries, command-line interface, C/C++ library, and bindings. It is
      especially important because many downstream Japanese text tools depend on the
      stable `mecab` executable and dictionary layout rather than embedding an analyzer.
  project-history:
    - >
      MeCab was designed to be independent of language, dictionary, and corpus, using
      Conditional Random Fields for parameter estimation. Its documentation contrasts
      this with ChaSen's hidden Markov model and states that MeCab is faster on average
      than ChaSen, Juman, and KAKASI.
    - >
      The release history in the official documentation starts with MeCab 0.90 as the
      initial release on 2006-03-26. Version 0.93 in July 2006 changed the license to a
      GPL, LGPL, or BSD triple-license model, and later releases added faster dictionary
      compilation, HMM training support, partial parsing APIs, retraining, and user
      dictionary cost estimation.
  related-projects:
    - ChaSen, Juman, KAKASI, IPA dictionary, Juman dictionary, UniDic, mecab-ko.
  sources:
    - https://github.com/taku910/mecab
    - https://raw.githubusercontent.com/taku910/mecab/master/mecab/doc/index.html
    - https://taku910.github.io/mecab/
    - source_facts.package-manager
  summary:
    - >
      MeCab is a Japanese part-of-speech and morphological analyzer. The official
      documentation describes it as an open-source engine developed through the Kyoto
      University Graduate School of Informatics and NTT Communication Science
      Laboratories joint research unit project.
  timeline:
    - '2006: MeCab 0.90 initial release.'
    - '2006: MeCab 0.93 changes licensing to GPL, LGPL, or BSD.'
    - '2012: MeCab 0.994 adds retraining and automatic user-dictionary cost estimation.'
    - >
      2013: MeCab 0.996 fixes iconv linking and adds user-dictionary CSV cost/context
      generation.
  usage:
    - >
      The docs cover direct parsing, wakati output, output-format customization,
      character-set changes, N-best output, adding words, dictionary format details,
      unknown-word handling, partial parsing, soft-wakati output, the C/C++ library
      interface, and script-language bindings. The command-line tools `mecab` and
      `mecab-config` expose those capabilities to packages and build scripts.
related-packages:
  - id: brew:kytea
    reason: >
      Choose KyTea when you need trainable word segmentation and tagging for Japanese,
      Chinese, or other unsegmented languages instead of MeCab's CRF-and-dictionary
      workflow.
    rel: alternative
    sources:
      - https://www.phontron.com/kytea/
      - https://taku910.github.io/mecab/
  - id: brew:cabocha
    reason: >
      CaboCha accepts MeCab-tagged text and uses MeCab plus a compatible dictionary to
      extend morphological analysis into Japanese dependency parsing.
    rel: adjacent_workflow
    sources:
      - https://taku910.github.io/cabocha/
      - https://taku910.github.io/mecab/
