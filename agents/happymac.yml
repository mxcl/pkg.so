history:
  adoption-history:
    - >
      HappyMac was distributed as a ready-to-install macOS disk image, as source code
      runnable from the command line, and through a Homebrew cask. Public official
      material does not document broader adoption.
  package-nerd-significance:
    - >
      HappyMac is a niche example of a macOS utility that manages process scheduling
      directly rather than merely reporting CPU activity. It is also a compact
      Python-based status-bar application with source available under the MIT license.
    - >
      Because suspending processes can alter application behavior, its appeal is
      strongest for technically confident users who understand which background
      workloads may safely be paused.
  project-history:
    - >
      Frank Lantz developed HappyMac as a Python macOS application for controlling
      CPU-intensive background processes. Its official repository contains the
      application, source, build and signing scripts, and installation helpers.
    - >
      The published documentation focuses on its process-family logic rather than a
      dated release history, so precise origin milestones are not established by the
      official sources reviewed.
  related-projects:
    - >
      The project relies on macOS process-management facilities and presents its
      controls through a menu-bar application.
  sources:
    - https://github.com/laffra/happymac
    - source_facts.package-manager.brew-cask
    - source_facts.repo
  summary:
    - >
      HappyMac is a macOS menu-bar utility that watches CPU load and can suspend
      background processes, resuming them when their application returns to the
      foreground.
  timeline:
    - >
      Public project era: HappyMac was published as an MIT-licensed Python macOS
      application with DMG, source, and Homebrew installation options.
  usage:
    - >
      The status-bar icon reflects total CPU load, while its menu separates
      current-application tasks, active background tasks, and suspended tasks.
    - >
      Users can manually suspend or resume processes. HappyMac also remembers suspension
      choices and resumes a process family when its application becomes active;
      suspending another user's process may require administrator authorization.
