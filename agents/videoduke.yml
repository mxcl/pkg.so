history:
  adoption-history:
    - >
      VideoDuke has been positioned as a commercial macOS utility with a two-download
      demonstration mode and an unlimited paid edition. Its support model includes paid
      major upgrades, free minor updates under the published policy, and perpetual use
      of purchased versions when users retain their installer and registration code.
    - >
      Its supported workflow broadened beyond individual video downloads to playlists,
      audio extraction, subtitles, images, and resources discovered within web pages.
      Release notes show continued adaptation to changes made by large media sites.
  package-nerd-significance:
    - >
      VideoDuke typifies a proprietary desktop utility distributed through a
      package-manager cask: Homebrew provides repeatable application installation while
      the vendor retains licensing, activation, and compatibility maintenance.
    - >
      Downloader packages are unusually sensitive to upstream website changes.
      VideoDuke's release history repeatedly records repairs for YouTube and other
      services, illustrating why such casks can remain installable even when individual
      extraction features temporarily regress.
  project-history:
    - >
      VideoDuke was developed as a macOS-focused graphical downloader with Simple and
      Advanced modes. The former emphasizes selecting a format and resolution, while the
      latter exposes video, audio, image, subtitle, and other page resources.
    - >
      The documented 2.x series added and maintained compatibility with services
      including YouTube, Vimeo, TikTok, Reddit, Twitter, Twitch, Tumblr, and SoundCloud.
      The vendor's 2023 and 2024 release notes are dominated by compatibility fixes as
      those services changed.
  related-projects:
    - >
      The video-sharing and social platforms that VideoDuke supports, including YouTube,
      Vimeo, TikTok, Twitter, Twitch, and Dailymotion.
    - >
      Browser bookmarks, which the application can use as a lightweight integration for
      sending pages to VideoDuke.
  sources:
    - 'Official knowledge base: https://wiki.video-downloader-mac.com/'
    - 'Official product site and usage guide: https://www.video-downloader-mac.com/'
    - >
      Official upgrade policy:
      https://wiki.video-downloader-mac.com/policies/upgrade-policy.html
    - >
      Official version history:
      https://wiki.video-downloader-mac.com/user-guides/videoduke/videoduke-for-mac-version-history.html
  summary:
    - >
      VideoDuke is a proprietary macOS application for saving video, audio, subtitles,
      images, and related resources from supported websites. It combines an embedded
      browser and URL-based workflow with selectable formats and resolutions.
  timeline:
    - 'March 2023: Version 2.11 expanded support for Twitter, Twitch, and Tumblr.'
    - >
      2023: The 2.x series continued adding site-specific capabilities and compatibility
      repairs.
    - 'April 2024: Version 2.15.2 was released with another YouTube compatibility fix.'
  usage:
    - >
      Users paste a media-page URL or navigate with the built-in browser, choose Simple
      or Advanced mode, select the desired format and resolution, and start the
      download.
    - >
      Downloaded videos default to `~/Downloads/VideoDuke`, although the destination can
      be changed in Preferences. This is an output directory, not a configuration-file
      location.
    - >
      The demonstration edition permits two downloads. Activation unlocks unlimited
      downloads under the vendor's commercial licensing terms. Users remain responsible
      for respecting copyright and the source site's terms.
