credentials-file-location: null
history:
  adoption-history:
    - >
      Arduino IDE is the conventional desktop entry point for programming Arduino
      boards, combining sketch editing with board-core and library management,
      compilation, upload, and serial tools. IDE 2 preserved the familiar Arduino
      workflow while modernizing the editor, helping existing users move from the 1.x
      generation.
    - >
      The public beta began in spring 2021, and feedback from the Arduino community
      informed the stable release. Arduino distributes the application for major desktop
      systems and supports it with official tutorials, a Help Center, forums, and an
      open-source repository.
  package-nerd-significance:
    - >
      Arduino IDE sits at the intersection of desktop application packaging, embedded
      toolchains, board-support packages, and language libraries. Its frontend bundles
      Electron and Theia while backend operations are delegated to Arduino CLI, so one
      installed application coordinates several independently packaged ecosystems.
    - >
      The `.arduinoIDE` directory is operationally important to package maintainers and
      advanced users because it contains both IDE settings and the Arduino CLI
      configuration consumed by the application.
  project-history:
    - >
      Arduino IDE 2 is a complete rewrite of the older Arduino IDE 1.x and shares no
      source code with it. The official repository states that it is based on the
      Eclipse Theia framework, built with Electron, and delegates compilation, upload,
      and related backend work to Arduino CLI running in daemon mode.
    - >
      The rewrite retained the recognizable Arduino interface and workflow while adding
      a more responsive editor, code completion, navigation, debugging support,
      concurrent Serial Monitor and Serial Plotter views, and in-application updates.
  related-projects:
    - 'Arduino IDE 1.x: The earlier Java-based IDE generation.'
    - 'Arduino CLI: Provides IDE 2 backend operations in daemon mode.'
    - 'Eclipse Theia: The extensible IDE framework underlying the user interface.'
    - 'Arduino Cloud Editor: Arduino’s browser-based alternative for editing sketches.'
  sources:
    - >
      Official configuration-location article:
      https://support.arduino.cc/hc/en-us/articles/4415103213714-Find-sketches-libraries-board-cores-and-other-files-on-your-computer
    - 'Official repository README: https://github.com/arduino/arduino-ide#readme'
    - >
      Official stable-release announcement:
      https://blog.arduino.cc/2022/09/14/its-here-please-welcome-arduino-ide-2-0/
  summary:
    - >
      Arduino IDE is Arduino’s desktop integrated development environment for creating
      sketches, managing boards and libraries, compiling code, uploading it to
      microcontrollers, and inspecting serial output.
  timeline:
    - 'Spring 2021: Arduino IDE 2 entered public beta.'
    - '2022-09-14: Arduino announced Arduino IDE 2.0 as stable.'
    - >
      IDE 2 generation: The application became a Theia/Electron frontend backed by
      Arduino CLI.
  usage:
    - >
      Users create or open Arduino sketches, select a board and port, install board
      platforms and libraries, verify or compile code, upload it to hardware, and
      inspect device communication through the Serial Monitor or Serial Plotter.
