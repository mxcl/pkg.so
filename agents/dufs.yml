history:
  adoption-history:
    - >
      Dufs is distributed through Cargo, Docker, Homebrew, GitHub release binaries, and
      package-manager entries such as Alpine, MacPorts, Nix, Scoop, and Winget. That
      spread reflects the usual adoption path for modern Rust CLIs: crate first, then
      binary and package-manager convenience.
  package-nerd-significance:
    - >
      Dufs is notable because it packages a surprising amount of ad hoc file-sharing
      behavior into one portable binary. For package users, it is the kind of tool that
      replaces a quick Python http.server, a temporary nginx config, or a small WebDAV
      daemon when convenience matters more than full server infrastructure.
  project-history:
    - >
      The release stream began in May 2022 and moved rapidly from v0.1.0 through a long
      0.x series. The README describes a utility file server focused on static serving,
      uploading, searching, access control, WebDAV, and straightforward CLI invocation.
    - >
      Dufs kept accumulating practical file-sharing features without becoming a general
      reverse proxy or application server. Its CLI exposes direct flags for binding,
      ports, auth, path prefixes, TLS files, logging, SPA rendering, CORS, archive
      downloads, and shell completions.
  related-projects:
    - Python's http.server is the minimal built-in comparison for quick static serving.
    - miniserve and darkhttpd are adjacent lightweight file/static servers.
    - WebDAV servers overlap with Dufs when upload and remote filesystem access matter.
  sources:
    - https://github.com/sigoden/dufs
    - https://api.github.com/repos/sigoden/dufs/releases?per_page=100
    - https://formulae.brew.sh/formula/dufs
  summary:
    - >
      Dufs is a Rust utility file server that turns a directory into an HTTP/WebDAV file
      surface with upload, search, access control, resumable transfers, ZIP downloads,
      HTTPS, and curl-friendly APIs. It sits in the modern single-binary file-server
      niche rather than the full web-server niche.
  timeline:
    - '2022: v0.1.0 published and early releases shipped rapidly.'
    - >
      2024: v0.42.0 and v0.43.0 showed the project had become a mature feature-rich
      utility server.
    - '2025: v0.44.0 and v0.45.0 continued active releases.'
    - '2026: v0.46.0 released with the project still maintained.'
  usage:
    - >
      A common workflow is running dufs in a directory for read-only serving, then
      adding -A for full upload/delete/search/create/edit operations or --auth rules for
      per-path permissions. The built-in HTTP API also supports curl uploads, downloads,
      deletes, directory creation, moves, hashes, health checks, and resumable transfer
      patterns.
related-packages:
  - id: brew:miniserve
    reason: >
      Choose miniserve for a comparable single-binary file-sharing server whose
      documented workflow emphasizes quick serving, QR-code access, uploads,
      authentication, archive downloads, and WebDAV.
    rel: alternative
    sources:
      - https://github.com/sigoden/dufs#readme
      - https://github.com/svenstaro/miniserve#readme
  - id: brew:darkhttpd
    reason: >
      Choose darkhttpd when you need a much smaller static-only server without Dufs's
      upload, search, editing, access-control, and WebDAV features.
    rel: alternative
    sources:
      - https://github.com/sigoden/dufs#readme
      - https://unix4lyfe.org/darkhttpd/
