history:
  adoption-history:
    - >
      goyacc is part of a long Unix parser-generator tradition adapted for Go. The Go
      project used goyacc as an example in the Go 1.4 `go generate` announcement,
      showing how generated parsers fit into Go package maintenance even though
      generation is run explicitly by package authors.
  package-nerd-significance:
    - >
      For package maintainers, goyacc is a compact bridge between old
      compiler-construction workflows and Go modules: grammars can live beside Go
      source, generation can be driven by `go generate`, and the installed binary is
      small enough to package directly in Homebrew.
  project-history:
    - >
      The modernc.org implementation begins in public history in November 2014. Its
      source comments state that it uses portions of code previously published in the Go
      tool `yacc` program, while the Go tools documentation describes that upstream
      goyacc as largely transliterated from Inferno's Limbo version, itself largely
      transliterated from the Plan 9 C version.
    - >
      The project moved its import path and repository root to modernc.org in 2018, and
      pkg.go.dev records `gitlab.com/cznic/goyacc` as the repository for the modernc.org
      module.
  related-projects:
    - >
      golang.org/x/tools/cmd/goyacc is the Go tools implementation in the same
      yacc-for-Go lineage.
    - >
      Plan 9 yacc and Inferno yacc are earlier implementations named in the Go tools
      documentation.
    - >
      modernc.org/y and modernc.org/parser/yacc are related modernc parser packages used
      by the command.
  sources:
    - https://gitlab.com/cznic/goyacc
    - https://go.dev/blog/generate
    - https://pkg.go.dev/golang.org/x/tools/cmd/goyacc
    - https://pkg.go.dev/modernc.org/goyacc
  summary:
    - >
      modernc.org/goyacc is Jan Mercl's Go parser-generator command derived from the Go
      toolchain's goyacc lineage. It reads yacc grammars and emits Go parsers, while
      adding compatibility and diagnostics features beyond the older `go tool yacc`
      style.
  timeline:
    - '2014: modernc.org/goyacc public history begins and records the initial release work.'
    - '2014: Go 1.4 introduces `go generate`, with goyacc used as a code-generation example.'
    - '2015: The modernc.org command adds generated error-message support via examples.'
    - '2017: The command adds follow-set reporting.'
    - '2018: The project moves its repository root to modernc.org and tags v1.0.0.'
    - '2023: v1.0.3 tag updates dependencies.'
  usage:
    - >
      The command accepts a yacc input file or standard input and writes a Go parser,
      defaulting to `y.go`, with options for the symbol prefix, parser report output,
      follow sets, conflict explanations, and generated error examples. Generated
      parsers use a Go lexer interface instead of C yacc globals.
related-packages:
  - id: brew:antlr
    reason: >
      Choose ANTLR when you want its cross-language grammar ecosystem and generated Go
      lexer/parser runtime; choose goyacc for a smaller yacc-style Go workflow.
    rel: alternative
    sources:
