id: brew:ccm
display-name: CCM
repo: https://github.com/apache/cassandra-ccm
docs:
  - https://github.com/apache/cassandra-ccm#readme
config-file-location:
  unix:
    - ~/.ccm/<cluster_name>/
credentials-file-location: null
history:
  adoption-history:
    - >
      The official install document points users to PyPI and Homebrew packages, so CCM
      has been distributed both as a Python package and as a Unix package-manager
      formula. The input package facts also list Homebrew and MacPorts package names.
  package-nerd-significance:
    - >
      CCM is a good example of a package-manager utility whose value is not a single
      algorithm but a reproducible local topology. It turns Cassandra cluster setup into
      a developer-facing CLI workflow and is especially useful for tests, demos,
      compatibility checks, and package maintainers who need disposable Cassandra
      environments.
  project-history:
    - >
      The official Apache repository describes CCM as a script and library for creating,
      managing, and destroying a small Cassandra cluster on a local box for testing. The
      GitHub repository was created in 2011 and is now hosted under the Apache
      organization as apache/cassandra-ccm.
    - >
      The install documentation notes that CCM predates the modern Python packaging
      defaults and then explains current Python 3, virtualenv, and editable-install
      workflows, which reflects the project's long life across Cassandra and Python
      eras.
  related-projects:
    - Apache Cassandra is the database system CCM manages locally.
    - >
      DataStax Enterprise and Hyper Converged Database are mentioned by the README as
      third-party cluster types supported through CCM extensions.
  sources:
    - https://api.github.com/repos/apache/cassandra-ccm
    - https://github.com/apache/cassandra-ccm
    - https://github.com/apache/cassandra-ccm#readme
    - https://formulae.brew.sh/api/formula/ccm.json
  summary:
    - >
      CCM, the Cassandra Cluster Manager, is a Python command-line tool for creating,
      launching, testing, and destroying local Apache Cassandra clusters. It matters in
      package-manager catalogs because it packages a repeatable local Cassandra lab into
      a single executable rather than leaving users to hand-wire several Cassandra
      nodes.
  timeline:
    - '2011: Official GitHub repository created.'
    - >
      2010s: README documents local multi-node Cassandra cluster creation and versioned
      Cassandra downloads.
    - >
      2020s: Install guide documents Python 3, virtualenv, Apple Silicon, and modern
      macOS caveats.
  usage:
    - >
      Typical usage creates a named Cassandra cluster for a given Cassandra release or
      source tree, populates it with local nodes, starts the nodes, inspects rings or
      logs, and later removes the cluster. By default, node data and configuration live
      under ~/.ccm/<cluster_name>/, while downloaded Cassandra releases are cached under
      ~/.ccm/repository/.
related-packages:
  - id: brew:cassandra
    reason: >
      Apache Cassandra supplies the database server and cqlsh that CCM instantiates into
      disposable local multi-node clusters for testing.
    rel: adjacent_workflow
    sources:
      - https://github.com/apache/cassandra-ccm/blob/trunk/README.md
      - https://cassandra.apache.org/doc/latest/
tags:
