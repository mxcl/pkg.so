id: brew:lazydocker
display-name: lazydocker
repo: null
docs:
  - https://github.com/jesseduffield/lazydocker#readme
config-file-location:
  linux:
    - ~/.config/lazydocker/config.yml
  macos:
    - ~/Library/Application Support/jesseduffield/lazydocker/config.yml
  windows:
    - C:\Users\<User>\AppData\Roaming\lazydocker\config.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Homebrew, Scoop, Chocolatey, asdf,
      binary releases, Go, Arch AUR, Docker, and other routes. GitHub repository
      metadata recorded 51,545 stars on July 1, 2026, and the README displayed sponsor
      and contributor sections, signs of a mature community-maintained developer tool
      rather than a one-off helper script.
  package-nerd-significance:
    - >
      For package nerds, lazydocker is a canonical Homebrew-era TUI: it does not replace
      Docker, it makes an existing command ecosystem navigable. It is also a companion
      study to lazygit in how Go TUIs became popular package-manager staples for daily
      developer operations.
  project-history:
    - >
      The public GitHub repository was created on May 18, 2019. Public releases include
      v0.1.3 on June 18, 2019, v0.23.0 on October 11, 2023, v0.24.0 on November 23,
      2024, and v0.25.2 on April 19, 2026.
  related-projects:
    - >
      Docker and Docker Compose are the core tools lazydocker wraps. lazygit is the
      sibling Jesse Duffield project that established the same style of terminal UI for
      Git.
  sources:
    - https://api.github.com/repos/jesseduffield/lazydocker
    - https://api.github.com/repos/jesseduffield/lazydocker/releases
    - https://github.com/jesseduffield/lazydocker
    - https://github.com/jesseduffield/lazygit
    - https://www.docker.com
  summary:
    - >
      lazydocker is Jesse Duffield's terminal UI for Docker and Docker Compose. It
      extends the same keyboard-first, command-wrapping philosophy as lazygit into
      container management.
  timeline:
    - '2019: Public GitHub repository created'
    - '2019: v0.1.3 release published'
    - '2023: v0.23.0 release published'
    - '2024: v0.24.0 release published'
    - '2026: v0.25.2 release published'
  usage:
    - >
      lazydocker gives one terminal window for container state, logs, restarts, shell
      access, and Docker Compose workflows. Its README frames the tool as an answer to
      juggling `docker compose ps`, logs, restarts, and multiple terminal windows.
related-packages:
  - id: brew:docker
    reason: >
      Docker supplies the daemon, objects, contexts, and commands that lazydocker
      exposes through its terminal interface.
    rel: adjacent_workflow
    sources:
      - https://github.com/jesseduffield/lazydocker
      - https://docs.docker.com/reference/cli/docker/
  - id: brew:docker-compose
    reason: >
      lazydocker integrates Docker Compose service status, logs, starts, stops,
      restarts, rebuilds, and project commands into its project-oriented panels.
    rel: adjacent_workflow
    sources:
      - https://github.com/jesseduffield/lazydocker
      - https://github.com/jesseduffield/lazydocker/blob/master/docs/Config.md
      - https://docs.docker.com/compose/
  - id: brew:ctop
    reason: >
      Choose ctop when compact real-time container metrics are the main goal; choose
      lazydocker when you also need Docker Compose awareness and broader management
      commands.
    rel: alternative
    sources:
      - https://github.com/jesseduffield/lazydocker
      - https://github.com/bcicen/ctop
tags:
