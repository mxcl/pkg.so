id: cask:sloth
display-name: Sloth
repo: https://github.com/sveinbjornt/Sloth
docs:
  - https://github.com/sveinbjornt/Sloth#readme
  - https://sveinbjorn.org/sloth
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Sloth is distributed directly by its developer and through Homebrew Cask.
      Continued maintenance since 2004 has made it a longstanding macOS utility for
      users who need an approachable view of Unix process resources.
  package-nerd-significance:
    - >
      Sloth turns the output of the classic Unix lsof utility into a searchable native
      interface. It is useful when a package installer cannot replace a file, a volume
      cannot be unmounted, a port appears occupied, or a user needs to identify which
      process owns a socket or pipe.
  project-history:
    - >
      Sveinbjörn Þórðarson began Sloth in 2004 and has maintained it as free,
      open-source macOS software. The application is written as a native
      Objective-C/Cocoa frontend to lsof and is released under the BSD 3-Clause license.
  related-projects:
    - 'lsof: The Unix command-line utility whose output Sloth parses and presents graphically.'
    - 'Homebrew Cask: An officially documented installation route for Sloth on macOS.'
  sources:
    - 'Official project homepage: https://sveinbjorn.org/sloth'
    - 'Official source repository and README: https://github.com/sveinbjornt/Sloth'
  summary:
    - >
      Sloth is a native macOS system-inspection application that shows the files,
      directories, devices, pipes, and network or Unix sockets used by running
      processes.
  timeline:
    - '2004: Sloth development began.'
    - >
      Later distribution: The developer added Homebrew Cask as an installation option
      alongside direct downloads.
  usage:
    - >
      Users filter or sort the resource list by process, path, access mode, volume,
      socket characteristics, or regular expression, then inspect details or perform
      contextual file operations. Sloth can authenticate within the application when a
      scan requires root privileges.
