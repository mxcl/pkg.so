credentials-file-location: null
history:
  adoption-history:
    - >
      Neovide publishes prebuilt releases for Linux, macOS, and Windows and is also
      packaged by operating-system package managers, including the supplied Homebrew
      Cask. Its official installation guide supports packaged binaries as well as
      Cargo-based source installation.
  package-nerd-significance:
    - >
      Neovide is notable as a focused GUI shell rather than a forked editor: Neovim
      remains the editing engine while Neovide supplies a cross-platform graphical
      renderer, animated cursor and scrolling, native window behavior, and GPU-oriented
      presentation. This separation appeals to users who want one Neovim configuration
      across terminal and desktop clients.
  project-history:
    - >
      Neovide grew as a Rust graphical client for Neovim, presenting itself as a
      no-nonsense frontend rather than a separate Vim implementation. Over successive
      releases it expanded its rendering and platform integration, added a dedicated
      TOML configuration file in 0.11.0, and continued to expose most editor behavior
      through standard Neovim options and variables.
  related-projects:
    - Neovim, the editor process and remote UI API that Neovide presents.
    - >
      Other Neovim graphical clients, which share the model of placing a native
      interface around the Neovim core.
  sources:
    - 'Official config-file guide: https://neovide.dev/config-file.html'
    - 'Official configuration guide: https://neovide.dev/configuration.html'
    - 'Official documentation: https://neovide.dev/'
    - 'Official installation guide: https://neovide.dev/installation.html'
    - 'Official project repository: https://github.com/neovide/neovide'
  summary:
    - >
      Neovide is a cross-platform graphical client for Neovim, implemented in Rust and
      designed to preserve the Neovim editing model while adding a polished native
      window and animated rendering.
  timeline:
    - '0.9: Floating-window blur controls were available.'
    - '0.10: Idle refresh-rate configuration was available.'
    - '0.11.0: Neovide introduced its TOML configuration file.'
    - >
      0.14.0: Releases highlighted rounded floating windows, cursor selection, Apple
      signing, and first-class Metal rendering on macOS.
    - >
      0.16.0: The NeovideConfig command made the configuration file directly
      discoverable from the editor.
  usage:
    - >
      Launch Neovide with files or a working directory while retaining the user's normal
      Neovim configuration, plugins, mappings, and commands. Neovide-specific behavior
      can be set through Neovim variables, command-line options, environment variables,
      or config.toml.
