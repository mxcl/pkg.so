history:
  adoption-history:
    - >
      The GFM spec says GitHub Flavored Markdown is the Markdown dialect supported for
      user content on GitHub.com and GitHub Enterprise. The batch input lists cmark-gfm
      packages for Homebrew, Debian, MacPorts, Nix, Arch/pacman, and Ubuntu, reflecting
      its role as the packaged local implementation of GitHub's Markdown dialect.
  package-nerd-significance:
    - >
      cmark-gfm matters when a package needs GitHub-style Markdown rendering rather than
      plain CommonMark. The -gfm suffixing is package-manager friendly because it avoids
      collisions with upstream cmark while exposing GitHub's dialect as a reproducible
      command-line and library dependency.
  project-history:
    - >
      GitHub created the cmark-gfm repository in December 2016. The README states that
      the project adds GitHub Flavored Markdown extensions to the upstream CommonMark
      implementation, as defined by the GFM spec, while preserving much of the upstream
      cmark README.
  related-projects:
    - >
      cmark-gfm is directly related to upstream cmark, the CommonMark spec, the GitHub
      Flavored Markdown spec, and libraries that wrap libcmark-compatible parsers.
  sources:
    - https://github.com/github/cmark-gfm#readme
    - https://github.github.com/gfm/
    - https://api.github.com/repos/github/cmark-gfm
    - https://api.github.com/repos/github/cmark-gfm/releases
  summary:
    - >
      cmark-gfm is GitHub's fork of cmark, extending the CommonMark C reference
      implementation with GitHub Flavored Markdown extensions. It provides GFM-specific
      libraries and binaries suffixed with -gfm so they can coexist with upstream cmark.
  timeline:
    - '2016: GitHub creates the cmark-gfm repository.'
    - '2017: tag 0.27.1.gfm.0 marks an early public GFM release line.'
    - '2019: the GFM spec version 0.29-gfm is published.'
    - '2023: GitHub release 0.29.0.gfm.13 is published.'
  usage:
    - >
      Users run cmark-gfm or link against its library to parse Markdown with GitHub
      extensions such as tables, task list items, strikethrough, autolinks, and
      disallowed raw HTML behavior. The README also documents the inherited cmark AST,
      renderer, security, build, and test workflows.
related-packages:
  - id: brew:cmark
    reason: >
      Choose upstream cmark when strict CommonMark compatibility is desired without
      GitHub-specific syntax extensions.
    rel: alternative
    sources:
      - https://github.com/commonmark/cmark#readme
      - https://github.github.com/gfm/
