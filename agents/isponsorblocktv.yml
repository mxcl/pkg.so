id: brew:isponsorblocktv
display-name: iSponsorBlockTV
repo: https://github.com/dmunozv04/iSponsorBlockTV
docs:
  - https://github.com/dmunozv04/iSponsorBlockTV/wiki
  - https://github.com/dmunozv04/iSponsorBlockTV#readme
config-file-location:
  unix:
    - $iSPBTV_data_dir/config.json
    - appdirs user_data_dir('iSponsorBlockTV', 'dmunozv04')/config.json
credentials-file-location:
  unix:
    - $iSPBTV_data_dir/config.json
    - appdirs user_data_dir('iSponsorBlockTV', 'dmunozv04')/config.json
history:
  adoption-history:
    - >
      Adoption is centered on self-hosting and home-media users who want SponsorBlock
      behavior on devices such as Apple TV, Samsung TV, LG WebOS, Android TV,
      Chromecast, Roku, Fire TV, game consoles, and other YouTube TV clients listed by
      the project. The README also points to a Home Assistant add-on, showing use as
      part of a home automation stack.
    - >
      Package-manager exposure through Homebrew and Nix made the tool easier to install
      outside Docker, while the upstream README also advertises container images and
      GitHub Container Registry/Docker Hub badges.
  package-nerd-significance:
    - >
      For package nerds, iSponsorBlockTV is an example of a browser-extension idea
      escaping into a daemon-like CLI package. It wraps a web-community data source,
      YouTube lounge-style device control, SSDP discovery, async Python networking, and
      a Textual configurator into something that can be installed like a normal Unix
      tool.
    - >
      The package is also interesting because it targets consumer TV clients rather than
      desktop browsers, so its value comes from bridging mismatched ecosystems instead
      of providing a large API surface.
  project-history:
    - >
      The project was published by dmunozv04 on GitHub and describes itself as a
      self-hosted application that connects to a YouTube TV app, skips SponsorBlock
      segments, can mute ads, and can press the YouTube ad skip button when it appears.
      Its first GitHub release tag, v0.1, was published on 2022-04-11.
    - >
      Version 2.0.0 was published on 2023-10-13 and marked a major project transition.
      Later 2.x releases focused on configurator fixes, logging, segment handling,
      binary distribution, reliability, pairing, and discovery improvements, which fits
      the package's role as a small always-on household service rather than a library.
  related-projects:
    - SponsorBlock supplies the crowd-sourced segment data that gives the project its purpose.
    - >
      pyytlounge is used to interact with YouTube TV clients, while aiohttp, asyncio,
      async-cache, Textual, and ssdp support the network service, configurator, and
      discovery pieces.
    - A Home Assistant add-on builds on the project for appliance-style deployment.
  sources:
    - https://formulae.brew.sh/formula/isponsorblocktv
    - https://github.com/dmunozv04/iSponsorBlockTV
    - https://github.com/dmunozv04/iSponsorBlockTV/releases
    - https://github.com/dmunozv04/iSponsorBlockTV/wiki
  summary:
    - >
      iSponsorBlockTV is a self-hosted companion for YouTube TV clients that applies
      SponsorBlock segment data outside the browser extension environment. Its niche is
      living beside television and casting clients where the standard SponsorBlock
      browser-extension model does not apply.
  timeline:
    - '2022: v0.1 was published on GitHub.'
    - '2023: v2.0.0 marked the V2 release.'
    - '2024: v2.2.0 added binary availability and reliability work.'
    - >
      2025: v2.3.x and v2.5.x releases continued pairing, configurator, and
      device-connection fixes.
    - '2026: v2.9.0 included pairing and Chromecast discovery improvements.'
  usage:
    - >
      The normal usage pattern is to run iSponsorBlockTV on a machine with access to
      youtube.com, pair it with a YouTube TV client through auto discovery or a manual
      TV code, and let it watch playback state so it can skip SponsorBlock segments or
      handle YouTube ad prompts.
    - >
      Its configuration and credentials are intentionally the same local JSON file
      because pairing data and device settings are part of the same long-running service
      setup.
related-packages:
  - id: cask:yattee
    reason: >
      Choose Yattee on macOS or tvOS when you prefer a replacement privacy-oriented
      video client with SponsorBlock integrated directly into the player instead of
      controlling the stock YouTube TV application.
    rel: alternative
    sources:
      - https://github.com/yattee/yattee#features
      - https://github.com/dmunozv04/iSponsorBlockTV#readme
      - https://docs.yattee.stream/
