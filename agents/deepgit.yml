history:
  adoption-history:
    - >
      DeepGit is available for Windows, macOS, and Linux and can be integrated as an
      external tool with IDEs and editors. syntevo permits free use, including in
      commercial environments.
    - >
      Its Homebrew cask supplies a package-managed macOS installation path for
      developers already managing Git tooling through Homebrew.
  package-nerd-significance:
    - >
      DeepGit addresses a deeper archaeological question than ordinary line attribution:
      it tries to identify where code originated even after blocks have moved between
      files or changed slightly. This fuzzy origin analysis is useful when conventional
      git blame stops at a refactoring commit.
  project-history:
    - >
      syntevo developed DeepGit as a specialized graphical tool for investigating
      source-code history. It builds on Git blame data but adds repeated origin analysis
      and fuzzy matching to follow code through movements and modifications.
    - >
      The product sits alongside syntevo's broader developer-tool portfolio, which
      includes SmartGit and SmartSynchronize.
  related-projects:
    - >
      DeepGit complements conventional Git clients and git blame. It is related by
      vendor to SmartGit and can be launched from IDEs such as Eclipse, Visual Studio,
      and IntelliJ IDEA or editors such as Sublime Text.
  sources:
    - https://docs.syntevo.com/DeepGit/Latest/
    - https://www.syntevo.com/deepgit/
    - https://www.syntevo.com/deepgit/tour/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      DeepGit is syntevo's cross-platform graphical Git archaeology tool for tracing the
      origins of lines and code blocks.
  timeline:
    - '2010s: syntevo introduced DeepGit as a specialized Git-history analysis tool.'
    - >
      2026: syntevo continued distributing DeepGit for Windows, macOS, and Linux with
      official documentation and Homebrew-cask availability.
  usage:
    - >
      Users open a tracked file, inspect its blame information, and repeatedly follow
      likely origins. DeepGit's fuzzy matching can identify moved or modified blocks
      across files and commits, and the application can be integrated with editors and
      IDEs as an external tool.
