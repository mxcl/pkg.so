id: brew:flarectl
display-name: flarectl
repo: null
docs:
  - https://github.com/cloudflare/cloudflare-go/tree/v0/cmd/flarectl#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README's installation path uses Go's module-aware install command from the
      cloudflare-go repository. Homebrew packages flarectl separately, which is typical
      for small command trees that live inside a larger library repository.
  package-nerd-significance:
    - >
      flarectl is notable as a packaged subdirectory CLI: the source of truth is a
      command inside a Go client library repository, but package managers expose it as
      its own executable for DNS and account automation workflows.
  project-history:
    - >
      The official v0 branch git history shows the CLI being renamed from goflare to
      flarectl on 2015-12-06, followed by README and usage updates. The tool grew as a
      small CLI companion to the Go API client rather than as a separate platform.
  related-projects:
    - >
      flarectl is directly related to cloudflare-go, the Go Cloudflare API library that
      powers the CLI.
  sources:
    - https://formulae.brew.sh/formula/flarectl
    - https://github.com/cloudflare/cloudflare-go/tree/v0/cmd/flarectl
    - https://raw.githubusercontent.com/cloudflare/cloudflare-go/v0/cmd/flarectl/README.md
  summary:
    - >
      flarectl is Cloudflare's command-line tool for interacting with a Cloudflare
      account. It lives under the cloudflare-go repository and the README describes it
      as powered by the cloudflare-go library.
  timeline:
    - '2015: goflare is renamed to flarectl in the v0 branch history.'
    - >
      2016: DNS, IP range, page-rule, and zone-related command work appears in the v0
      branch history.
    - '2017: The README usage output identifies a 2017.10.0 CLI version.'
  usage:
    - >
      flarectl authenticates with Cloudflare through environment variables for either an
      API token or an API key plus email. Its documented commands cover account and zone
      information, DNS records, firewall rules, page rules, user-agent blocking,
      Cloudflare IP ranges, Railgun information, and origin CA root certificates.
related-packages: []
