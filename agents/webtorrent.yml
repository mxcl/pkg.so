history:
  adoption-history:
    - >
      The official changelog records rapid cross-platform expansion during 2016,
      including Windows, Debian/Ubuntu, magnet-link handling, subtitles, casting, and
      external-player support.
    - >
      Its Homebrew cask gives macOS package-manager users a maintained command-line
      installation path alongside upstream installers.
  package-nerd-significance:
    - >
      WebTorrent Desktop packages an unusual bridge between conventional BitTorrent
      peers and browser peers using WebRTC. Its Electron and JavaScript implementation
      also makes it a notable example of a substantial peer-to-peer desktop application
      built from the Node.js ecosystem.
    - >
      For package enthusiasts, it combines media playback, torrent creation, seeding,
      magnet handling, and casting in one cross-platform application, with upstream
      publishing platform-specific release artifacts.
  project-history:
    - >
      WebTorrent Desktop is the graphical desktop client in the WebTorrent project. The
      first official alpha release appeared on 21 March 2016, initially with an OS X
      binary while targeting OS X, Windows, and Linux.
    - >
      The project subsequently expanded its installers and desktop integration and
      adopted the WebTorrent Desktop name. It is built around the WebTorrent JavaScript
      library and distributed as an open-source Electron application.
  related-projects:
    - WebTorrent, the underlying JavaScript torrent client.
    - webtorrent-cli, the related command-line client.
    - instant.io, the WebTorrent browser application.
  sources:
    - https://github.com/webtorrent/webtorrent
    - https://github.com/webtorrent/webtorrent-desktop
    - https://github.com/webtorrent/webtorrent-desktop/blob/master/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      WebTorrent Desktop is an open-source, cross-platform BitTorrent client focused on
      playing audio and video while torrent data is still downloading.
  timeline:
    - '2016-03-21: First official WebTorrent Desktop alpha release.'
    - >
      2016-03-29: The project adopted the WebTorrent Desktop name and added broader
      desktop behavior.
    - '2016-04-06: Ubuntu and Debian support arrived.'
    - '2016-05-24: Preferences for the download folder and playback-resume support were added.'
  usage:
    - >
      Users open magnet links or torrent files to download and play media, can seek
      before a download completes, and can create and seed torrents by dragging files
      into the application.
    - >
      The desktop client can communicate with traditional BitTorrent peers as well as
      WebTorrent-compatible WebRTC peers, and supports playback or casting through
      integrations such as VLC, AirPlay, Chromecast, and DLNA.
