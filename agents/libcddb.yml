history:
  adoption-history:
    - >
      libcddb became useful because many Unix audio tools wanted CDDB lookups without
      embedding network protocol code. The libcdio manual explicitly points to libcddb
      as the CDDB library used by libcdio applications such as cd-info when album
      metadata is needed.
    - >
      Package-manager adoption kept the library available long after the original
      CDDB/freedb era: the batch input lists packages for Homebrew, Debian and Ubuntu as
      libcddb2, Fedora and openSUSE, Arch, Alpine, MacPorts, Nix, and others.
  package-nerd-significance:
    - >
      For package nerds, libcddb is a fossil from a specific layer of the desktop media
      stack: online audio-CD metadata before MusicBrainz, before ubiquitous tags, and
      before streaming catalogs. It also explains why old multimedia packages often have
      optional CDDB support toggles and why libcdio, cdparanoia, and CD ripping tools
      tended to accrete small companion libraries.
  project-history:
    - >
      The project was registered on SourceForge on 2002-10-20 and describes itself as a
      cross-platform C API for CDDBP and HTTP access to CDDB servers. Its own project
      site documents support for searching for possible CD matches, retrieving detailed
      entries, submitting new entries, HTTP tunneling, proxy use, and a built-in cache.
    - >
      The visible project news shows a mature maintenance phase by the late 2000s:
      version 1.2.2 was announced on 2006-09-29, version 1.3.0 on 2006-10-15, a
      maintainer handoff was announced on 2007-07-14, and version 1.3.2 was announced on
      2009-04-06.
  related-projects:
    - >
      Related projects include libcdio, which can use libcddb for CDDB lookups in
      cd-info, freedb/GnuDB-style CD metadata services, older CD rippers and players,
      and libcdaudio-style libraries from the same audio-CD era.
  sources:
    - https://formulae.brew.sh/formula/libcddb
    - https://libcddb.sourceforge.net/
    - https://libcddb.sourceforge.net/download.html
    - https://sourceforge.net/projects/libcddb/
    - https://www.gnu.org/software/libcdio/libcdio.html
  summary:
    - >
      libcddb is a small C library for applications that need to query, read, cache, and
      submit Compact Disc metadata through CDDB-compatible services. It belongs to the
      older Unix audio-CD stack: the layer that let rippers, players, and media
      utilities discover album and track names before embedded metadata and streaming
      catalogs became normal.
  timeline:
    - '2002-10-20: libcddb project registered on SourceForge.'
    - '2006-09-29: libcddb 1.2.2 announced with a submission character-set fix.'
    - '2006-10-15: libcddb 1.3.0 announced with freedb2 album-command support.'
    - '2007-07-14: Project site announced Justin C. as new day-to-day maintainer.'
    - '2009-04-06: libcddb 1.3.2 announced with Haiku build support fixes.'
  usage:
    - >
      Typical use is as a link-time library behind a media player, CD ripper, or
      diagnostic tool. The package also ships cddb_query, a small command-line client
      useful for testing a disc ID query path without writing an application.
related-packages:
  - id: brew:libcdio
    reason: >
      Pair libcddb with libcdio when an audio-CD application needs CDDB album and track
      metadata in addition to optical-disc access and identification.
    rel: adjacent_workflow
    sources:
      - https://libcddb.sourceforge.net/
      - https://www.gnu.org/software/libcdio/libcdio.html
