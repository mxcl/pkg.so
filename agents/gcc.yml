id: brew:gcc
display-name: GCC
repo: https://gcc.gnu.org/git/gcc.git
docs:
  - https://gcc.gnu.org/onlinedocs
  - https://gcc.gnu.org/onlinedocs/gcc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The GCC mission statement frames the project as part of GNU and explicitly targets
      the GNU system, GNU/Linux, multiple architectures, and diverse platforms. This
      open-development and multi-target mission is why GCC became a default compiler in
      many Unix-like operating systems and remains a package-manager anchor: large parts
      of a distribution are either built by it, bootstrap it, or carry compatibility
      logic for it.
  package-nerd-significance:
    - >
      GCC is package-manager infrastructure, not just another package. It drives ABI
      compatibility, bootstrap chains, language standard defaults, libstdc++ behavior,
      cross-compilation targets, build flags, sanitizer support, and the difference
      between a distribution that can rebuild itself and one that cannot.
  project-history:
    - >
      The official release timeline lists GCC 0.9 as the first beta release in March
      1987 and GCC 1.0 in May 1987. The project later absorbed the EGCS line: the
      timeline records EGCS 1.0 in December 1997, EGCS 1.1.x through March 1999, and GCC
      2.95 in July 1999, the release family generally associated with the reunited GCC
      project.
  related-projects:
    - >
      GCC is tied to the GNU Project, GNU/Linux distributions, libstdc++, binutils, GDB,
      the GNU build toolchain, and competing or complementary compilers such as
      Clang/LLVM. Its own official Git documentation also treats release branches and
      tags as first-class package artifacts.
  sources:
    - https://gcc.gnu.org/
    - https://gcc.gnu.org/gccmission.html
    - https://gcc.gnu.org/git.html
    - https://gcc.gnu.org/onlinedocs/
    - https://gcc.gnu.org/releases.html
  summary:
    - >
      GCC, the GNU Compiler Collection, is the GNU project's long-running compiler suite
      and one of the central packages in free-software toolchains. It is both a
      user-facing compiler driver family and a distribution-building dependency for C,
      C++, Fortran, Objective-C, Ada, Go-related runtime pieces, and other GCC-supported
      languages and targets.
  timeline:
    - '1987: GCC 0.9 first beta release.'
    - '1987: GCC 1.0 released.'
    - '1997: EGCS 1.0 released as a parallel compiler line.'
    - '1999: GCC 2.95 released after the EGCS era.'
    - '2001: GCC 3.0 released.'
    - '2005: GCC 4.0.0 released.'
    - '2015: GCC 5.1 released under the modern major-version release scheme.'
    - '2025: GCC 15.1 released.'
    - '2026: GCC 16.1 released.'
  usage:
    - >
      Package users normally invoke compiler drivers such as gcc, g++, cpp, gfortran,
      gcov, and lto-dump, while packagers care about release branches, source tarballs,
      bootstrapping requirements, generated files in Git checkouts, and runtime-library
      licensing. The official Git page documents cloning from
      https://gcc.gnu.org/git/gcc.git, release branches under releases/gcc-N, and
      release tags such as releases/gcc-X.Y.0.
related-packages:
  - id: brew:llvm
    reason: >
      Choose LLVM when a GCC-compatible C-family compiler with Clang's modular tooling,
      diagnostics, and LLVM-based optimizer ecosystem better fits the development
      workflow.
    rel: alternative
    sources:
      - https://gcc.gnu.org/
      - https://clang.llvm.org/docs/UsersManual.html
      - https://clang.llvm.org/features.html
  - id: brew:binutils
    reason: >
      Install GNU Binutils alongside GCC when builds need the GNU assembler, linker,
      archive tools, or object-file inspection utilities documented as companion
      toolchain components.
    rel: adjacent_workflow
    sources:
      - https://gcc.gnu.org/install/download.html
      - https://sourceware.org/binutils/
      - https://sourceware.org/binutils/docs/
