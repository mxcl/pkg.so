history:
  adoption-history:
    - >
      MyCard's official site reported 1,521,293 online YGOPro duels during July 2019 and
      describes recurring ranked and recreational competitions. No current cumulative
      user count is published.
  package-nerd-significance:
    - >
      MyCard packages a community-operated YGOPro ecosystem—client, automatic card
      updates, matchmaking, bots, rankings, and replay-derived statistics—behind a
      desktop application. The Homebrew cask makes this Chinese-language gaming stack
      installable through a conventional macOS package workflow.
  project-history:
    - >
      MyCard, also known in Chinese as 萌卡, developed around YGOPro as a complete
      Yu-Gi-Oh! card simulator and online-dueling service. The organization maintains
      numerous supporting components for card data, scripts, server operation, accounts,
      analytics, and the MoeCube client ecosystem.
  related-projects:
    - 'YGOPro: the open card-simulation engine underlying the ecosystem.'
    - "SRVPro: MyCard's public YGOPro server software."
    - 'MoeCube: a newer client and distribution platform maintained by the MyCard organization.'
  sources:
    - https://github.com/mycard
    - https://mycard.moe/
    - https://mycard.moe/dev/
    - source_facts.package-manager
  summary:
    - >
      MyCard is a Yu-Gi-Oh! card simulator and online-dueling ecosystem built around
      YGOPro, with automatic updates, deck construction, bots, matchmaking, rankings,
      and tournament play.
  timeline:
    - '2019: The official site reported more than 1.5 million online duels during July.'
  usage:
    - >
      Players build decks from the available card pool and use the client for AI,
      casual, competitive, and 2v2 duels. The associated website exposes rankings and
      aggregate card and deck usage data.
