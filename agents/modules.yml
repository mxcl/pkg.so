config-file-location:
  unix:
    - /etc/environment-modules/initrc
    - /etc/environment-modules/modulespath
    - /etc/environment-modules/siteconfig.tcl
    - /etc/environment-modules/rc
    - ~/.modulerc
    - <modulepath>/.modulerc
credentials-file-location: null
history:
  adoption-history:
    - >
      Its role is strongest in high-performance computing and multi-user Unix
      environments. Modulefiles let sites publish many versions of compilers, MPI
      stacks, libraries, tools, and data endpoints while users keep a consistent command
      interface across shells. The project documentation shows typical use through
      commands such as module load, module switch, and module unload, and the HPSF
      announcement describes the module command as a familiar interface for
      supercomputer users accessing a software catalog.
  project-history:
    - >
      The project moved through several implementations. Project history presented by
      the Environment Modules maintainers describes versions 1 and 2 under Furlani,
      version 3.0 under Peter W. Osel and Jens Hamisch, the Linux/GPL 3.1 and 3.2 line
      under R.K. Owen at NERSC, and the pure Tcl modulecmd.tcl work by Mark Lakata and
      Kent Mein. Xavier Delaruelle at CEA became project leader in 2017 and led the
      version 4 and version 5 line based on the Tcl implementation.
  sources:
    - https://envmodules.io/
    - https://envmodules.io/docs/Modules-Paper.pdf
    - https://envmodules.io/docs/modules_eum25.pdf
    - https://github.com/envmodules/modules
    - >
      https://hpsf.io/blog/2025/high-performance-software-foundation-welcomes-modules-as-hpsf-project/
    - https://modules.readthedocs.io/en/v5.1.1/
  summary:
    - >
      Environment Modules began in 1991 with John L. Furlani's paper "Modules: Providing
      a Flexible User Environment," written at Sun Microsystems to solve a practical
      Unix administration problem: users and admins needed a cleaner way to add, remove,
      and switch application-specific environment settings without constantly editing
      shell startup files. The original design wrapped environment changes into named
      modulefiles and exposed them through a single module command, so software setup
      could be loaded, unloaded, or swapped during a shell session.
  usage:
    - >
      Environment Modules shares its niche with Lmod, the Lua-based module
      implementation that became especially prominent while Environment Modules
      development was on hiatus. The revived Tcl-based project added collections,
      dependency handling, advanced version specifiers, module variants, Lmod Tcl
      modulefile compatibility, Windows shell support, linting, logging, and cache
      support. In 2025, Modules moved under the High Performance Software Foundation
      within the Linux Foundation, giving the long-running HPC environment tool a formal
      neutral governance home.
