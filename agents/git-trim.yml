id: brew:git-trim
display-name: Git Trim
repo: null
docs:
  - https://github.com/foriequal0/git-trim#readme
config-file-location:
  unix:
    - <repository>/.git/config
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption followed normal Git-extension channels: GitHub release binaries, cargo
      install, Homebrew, and other package-manager formulas. The package fits
      repositories where pull-request branches accumulate faster than developers want to
      prune them by hand.
  package-nerd-significance:
    - >
      git-trim matters to package and tooling users because it turns a fragile shell
      one-liner into a named Git subcommand that understands merged, stray,
      squash-merged, rebased, and triangular-workflow branches.
  project-history:
    - >
      The project appeared on GitHub in January 2020. Its README frames the tool as a
      safer companion to git fetch --prune, because fetch pruning removes
      remote-tracking refs but leaves local tracking branches for the user to inspect
      and delete.
    - >
      The project evolved around Git workflow edge cases rather than a large feature
      surface. Release notes for the 0.4 series describe base-branch detection from
      remote HEAD refs, worktree branch preservation, richer branch classification, and
      detailed skip messages.
  related-projects:
    - git fetch --prune, git branch --merged, git2, cargo, Homebrew
  sources:
    - https://crates.io/crates/git-trim
    - https://formulae.brew.sh/formula/git-trim
    - https://github.com/foriequal0/git-trim
    - https://github.com/foriequal0/git-trim/releases
    - https://raw.githubusercontent.com/foriequal0/git-trim/master/README.md
  summary:
    - >
      git-trim is a Rust Git extension for cleaning local tracking branches whose
      upstream branches have been merged, deleted, or left behind after pull-request
      work.
  timeline:
    - >
      2020: Repository created and 0.4 releases added workflow-oriented branch detection
      improvements.
    - '2022: v0.4.3 release shipped dependency updates and packaged binaries.'
  usage:
    - >
      Practitioners run git trim after reviews or after synchronizing a repository. The
      README recommends dry-run mode for cautious use and trim.bases configuration for
      workflows with base branches such as develop and master.
related-packages:
  - id: brew:git-delete-merged-branches
    reason: >
      git-delete-merged-branches is the closest dedicated alternative, emphasizing
      interactive and dry-run cleanup of merged local and remote branches, while
      git-trim classifies tracking branches against configured bases and multiple merge
      styles.
    rel: alternative
    sources:
      - https://github.com/hartwork/git-delete-merged-branches#readme
      - https://github.com/foriequal0/git-trim#readme
  - id: brew:git
    reason: >
      git-trim operates on standard Git branches, remotes, tracking relationships, and
      repository-local configuration supplied by Git.
    rel: adjacent_workflow
    sources:
      - https://github.com/foriequal0/git-trim#readme
      - https://git-scm.com/docs/git-branch
      - https://git-scm.com/docs/git-config
tags:
  - branch-cleanup
