history:
  adoption-history:
    - >
      Squirrels says its screen-mirroring technology is used in millions of homes,
      schools, and businesses. Reflector developed a particularly visible education
      niche, with official case studies describing classroom presentation, mobile-device
      collaboration, and alternatives to dedicated receiver hardware.
  package-nerd-significance:
    - >
      Reflector helped establish the desktop computer as a software AirPlay receiver
      rather than requiring Apple TV hardware. Later generations combined AirPlay,
      Google Cast, and Miracast reception in one cross-platform desktop package, making
      it a useful interoperability tool for classrooms, demonstrations, recording,
      streaming, and support work.
  project-history:
    - >
      Squirrels first released the product as Reflection for macOS in early 2012 and
      brought it to Windows in June that year. The company subsequently renamed it
      Reflector and expanded beyond AirPlay: Reflector 2 added Google Cast-era workflows
      and richer recording features, Reflector 3 added Miracast reception on Windows and
      a rewritten interface, and Reflector 4 introduced another new core and modernized
      macOS and Windows experience in 2021.
  related-projects:
    - >
      AirParrot sends desktop audio and video to compatible receivers and is frequently
      bundled with Reflector. Reflector Director provides remote management, Reflector
      Student assists classroom connectivity, and Ditto is Squirrels' centrally managed
      collaboration and signage platform.
  sources:
    - https://help.airsquirrels.com/reflector/getting-started
    - >
      https://press.airsquirrels.com/2012/06/reflection-and-airparrot-launch-on-windows-xpvista7
    - https://press.airsquirrels.com/2017/11/reflector-3-from-squirrels-llc-is-now-available
    - >
      https://press.airsquirrels.com/squirrels-boosts-airplay-miracast-and-google-cast-with-all-new-reflector-4
    - https://www.airsquirrels.com/about-us
  summary:
    - >
      Reflector 4 is commercial receiver software from Squirrels that mirrors and
      records AirPlay, Google Cast, and Miracast devices on a macOS or Windows computer.
  timeline:
    - 'Early 2012: Reflection launched for macOS.'
    - 'June 2012: Reflection and AirParrot launched on Windows.'
    - 'April 2015: Reflector 2 launched with expanded mirroring and recording workflows.'
    - >
      November 2017: Reflector 3 launched with a rewritten interface and Miracast
      support on Windows.
    - 'March 2021: Reflector 4 launched for macOS and Windows with a new core and interface.'
  usage:
    - >
      Users run Reflector on a Mac or Windows PC connected to the same local network as
      the sending device, select the computer as an AirPlay, Google Cast, or Miracast
      receiver, and optionally frame, emphasize, secure, or record one or more mirrored
      devices.
