credentials-file-location: null
history:
  adoption-history:
    - >
      FITS adoption is strongest in digital preservation and repository operations,
      where repeatable file characterization matters more than a single detector's
      answer. Its documentation points to command-line use, a Java API, Docker
      workflows, and a separate FITS Web Service for deployment in application servers.
  package-nerd-significance:
    - >
      Package maintainers care about FITS because it bundles and coordinates heavyweight
      external tools such as ExifTool, JHOVE, Tika, MediaInfo, file, and jpylyzer. That
      makes versioning, Java compatibility, native helper binaries, and reproducible
      output part of the package story.
  project-history:
    - >
      The official project description presents FITS as a wrapper that invokes and
      manages output from several open source characterization tools, converts their
      outputs into a common format, compares them, and consolidates the result into one
      XML output file.
    - >
      The current GitHub repository was created in 2013. The release line visible on
      GitHub includes the late 0.8.x series, 1.0.x releases in 2016 and 2017, 1.2 and
      1.3 in 2017-2018, 1.4 and 1.5 in 2018-2019, and 1.6.0 in January 2023.
  related-projects:
    - >
      Related tools include ExifTool, JHOVE, Apache Tika, MediaInfo, file, jpylyzer, the
      FITS Web Service, and digital preservation repository systems.
  sources:
    - https://harvard-lts.github.io/fits/
    - https://github.com/harvard-lts/fits
    - https://github.com/harvard-lts/fits/releases
    - http://fitstool.org/user-manual
    - http://fitstool.org/developer-manual
  summary:
    - >
      FITS, the File Information Tool Set, is a Java command-line tool from Harvard
      Library Technology Services for identifying, validating, and extracting technical
      metadata from many file formats.
  timeline:
    - '2013: Current GitHub repository created.'
    - '2016: 1.0.2 release published.'
    - '2018: 1.3.0 release moved builds to Maven according to the README.'
    - '2019: 1.5.0 release published.'
    - '2023: 1.6.0 release published.'
  usage:
    - >
      Common usage runs FITS against a file or directory, optionally writing XML output
      to a file. Operators can use the bundled scripts, Docker image builds from release
      artifacts, custom FITS XML configuration, and Java API integration.
related-packages:
  - id: brew:exiftool
    reason: >
      Choose ExifTool for focused, scriptable metadata reading and writing; FITS invokes
      it as one input when a consolidated multi-tool preservation report is needed.
    rel: alternative
    sources:
      - https://www.fitstool.org/user-manual
      - https://exiftool.org/
  - id: brew:tika
    reason: >
      Choose Apache Tika for direct content-type detection and text or metadata
      extraction, while FITS uses Tika alongside other engines to compare and
      consolidate characterization results.
    rel: alternative
    sources:
      - https://www.fitstool.org/user-manual
      - https://tika.apache.org/
