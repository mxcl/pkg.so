history:
  adoption-history:
    - >
      Vrew broadened from transcription-led editing into an all-in-one creation
      environment for vlogs, shorts, long-form video, education, and business marketing.
      It is distributed for macOS, Windows, and Linux and offers both free and paid
      usage tiers.
  package-nerd-significance:
    - >
      Vrew helped popularize transcript-as-timeline editing in an approachable desktop
      tool: spoken content can be cut and rearranged through text rather than only
      through a conventional video timeline. Its packaging is also notable as a
      proprietary, cross-platform AI application distributed through a Homebrew cask on
      macOS.
  project-history:
    - >
      VoyagerX developed Vrew as an AI-based video-editing program combining speech
      recognition, automatic subtitle generation, text-driven editing, speech synthesis,
      and cloud-backed features. Archived official terms show the service had public
      terms by September 2019; subsequent releases expanded into generative images,
      video, scripts, voice cloning, dubbing, and speech editing.
  related-projects:
    - Vrew is developed by VoyagerX, which also develops the vFlat scanning application.
    - >
      Vrew projects can export subtitles for use with editors such as Premiere Pro,
      DaVinci Resolve, and Final Cut Pro.
  sources:
    - 'Archived official terms chronology: https://usertest.vrew.ai/en/terms-of-service/'
    - 'Official Vrew product page: https://vrew.ai/en/'
    - 'Official generative-AI feature page: https://vrew.ai/en/feature/generative-ai-tools/'
    - 'Official terms describing the service: https://vrew.ai/en/terms-of-service/'
  summary:
    - >
      Vrew is VoyagerX's cross-platform AI video editor, centered on automatic
      transcription and document-like editing while also providing captions, synthetic
      speech, generative media, and conventional production tools.
  timeline:
    - '2019: Official Vrew terms were announced in September and took effect in October.'
    - >
      2020s: Vrew expanded from transcription-based editing into a broader generative-AI
      video-production suite.
  usage:
    - >
      Creators import or record footage, generate a transcript, and edit the video by
      changing or moving text. They can add automatic captions, remove silence and
      noise, translate or dub content, generate scripts and media, add AI voices, and
      export finished video or subtitle files.
