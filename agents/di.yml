history:
  adoption-history:
    - >
      di's official homepage documents long-term packaging and user attention: it links
      current package-manager availability, MacPorts and Homebrew entries for macOS, and
      articles ranging from a 1995 HP-UX/USR mention through later Linux magazine
      coverage. Version 5 added a shared library for retrieving disk-space information
      programmatically.
  package-nerd-significance:
    - >
      di matters to package nerds because it is a decades-old portability play: one
      command that behaves consistently across many Unix variants where df output and
      filesystem details differ. It is the kind of small sysadmin tool that earns
      packages in many distributions by smoothing over platform differences.
  project-history:
    - >
      The official homepage identifies di as a disk information utility and notes
      copyright from 1994 through 2021 by Brad Lanam. It emphasizes portability across
      heterogeneous networks and lists a large set of Unix and non-Unix systems to which
      di has been ported.
  related-projects:
    - df is the standard command-line tool di extends and competes with.
    - The SourceForge wiki documents the version 5 library API.
  sources:
    - https://diskinfo-di.sourceforge.io/
    - https://diskinfo-di.sourceforge.io/di.html
    - https://sourceforge.net/p/diskinfo-di/wiki/Home/
    - https://sourceforge.net/p/diskinfo-di/code
  summary:
    - >
      di is a portable disk information utility that expands on the traditional df
      command. It reports disk usage in configurable formats and accounts for quotas so
      users can see space available to them rather than only system-wide filesystem
      capacity.
  timeline:
    - "1994: Official license notice begins Brad Lanam's copyright period for di."
    - '1995: Official homepage lists HP-UX/USR article coverage.'
    - '2002: Official homepage lists Linux Journal coverage.'
    - 'Version 5: di adds a shared library API for disk-space information.'
    - '2026: Official man page generation date shows continued documentation maintenance.'
  usage:
    - >
      The manual documents df-like reporting, file-specific filesystem lookup,
      selectable block and display sizes, custom output formats, CSV/tabular output,
      sorting, filesystem include/exclude lists, and quota-aware reporting.
related-packages:
  - id: brew:duf
    reason: >
      Choose duf for colorful, width-aware tables and JSON output on modern systems;
      choose di for extensive portable formatting and quota-aware reporting across
      heterogeneous Unix hosts.
    rel: alternative
    sources:
      - https://diskinfo-di.sourceforge.io/
      - https://github.com/muesli/duf
