id: brew:actions-batch
display-name: actions-batch
repo: null
docs:
  - https://blog.alexellis.io/github-actions-timesharing-supercomputer
  - https://github.com/alexellis/actions-batch#readme
config-file-location: null
credentials-file-location:
  unix:
    - ~/pat.txt
    - ~/batch
    - .secrets/*
history:
  adoption-history:
    - >
      The README targets GitHub-hosted runners, private repositories, self-hosted
      runners, and Actuated runners, so adoption is mostly in the GitHub Actions and
      self-hosted runner niche rather than as a general batch scheduler.
  package-nerd-significance:
    - >
      For package-manager users, actions-batch is interesting because it packages GitHub
      Actions as an ad hoc batch-compute backend: a single local CLI wraps repository
      creation, workflow generation, token handling, secrets, and artifact download.
  project-history:
    - >
      The project appeared as a public GitHub repository in October 2022 and was
      documented by the author in a blog post that explains the time-sharing analogy,
      disposable repository workflow, and artifact retrieval model. Public releases
      began in December 2023 with v0.0.1.
  related-projects:
    - >
      The README points readers to alexellis/run-job for one-shot Kubernetes jobs and
      OpenFaaS for portable functions.
  sources:
    - Author blog post linked from the README for project framing.
    - GitHub repository and releases API for creation and release dates.
    - Official README for usage, supported runners, secrets, artifacts, and related projects.
  summary:
    - >
      actions-batch is a small Go CLI by Alex Ellis for submitting shell scripts to
      disposable GitHub Actions workflows and collecting logs or artifacts. Its own
      description frames it as a time-sharing supercomputer built on GitHub Actions.
  timeline:
    - '2022: Public GitHub repository created.'
    - '2023: README examples show artifact download and secret injection workflows.'
    - '2023: v0.0.1 initial release published on GitHub.'
    - '2023: v0.0.3 followed the next day with logging changes.'
  usage:
    - >
      Users pass a script with --file, identify an owner with --owner, provide a GitHub
      token via --token-file, and optionally pass secrets via --secrets-from. The tool
      creates a temporary workflow, runs it, and can download files placed in an uploads
      directory.
related-packages:
  - id: brew:faas-cli
    reason: >
      The official actions-batch README demonstrates submitting a job that installs
      faas-cli, logs into an OpenFaaS gateway using injected secrets, and invokes a
      function.
    rel: adjacent_workflow
    sources:
      - https://github.com/alexellis/actions-batch#consume-secrets-for-a-job
      - https://github.com/openfaas/faas-cli#readme
