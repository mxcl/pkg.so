credentials-file-location: null
history:
  adoption-history:
    - >
      The project is adopted by privacy-conscious Chromium users and downstream
      packagers who want Chromium without built-in dependence on Google web services.
      Platform-specific repositories package the shared patch set for operating systems
      such as macOS.
    - >
      The macOS repository publishes binaries and build instructions and documents
      installation through Homebrew Cask. This packaging layer is important because
      compiling Chromium locally is unusually resource-intensive.
  package-nerd-significance:
    - >
      ungoogled-chromium is a prominent example of de-vendoring through a maintained
      patch stack rather than a browser-engine fork. Package maintainers must coordinate
      Chromium source revisions, domain substitutions, feature patches, build flags, and
      platform-specific packaging.
    - >
      Its separation between the core patch project and platform binary repositories
      makes source provenance and the identity of a binary builder especially important.
  project-history:
    - >
      ungoogled-chromium originated as a collection of patches, configuration, and
      scripts applied to Chromium to remove or inhibit integration with Google services
      while preserving the Chromium browsing experience.
    - >
      The core project tracks Chromium releases, while platform repositories such as
      ungoogled-chromium-macos handle platform-specific builds, signing, notarization,
      and distribution.
  related-projects:
    - Chromium is the upstream browser codebase.
    - >
      ungoogled-chromium-macos is the official platform repository supplied in
      source_facts.repo.
    - >
      The official ungoogled-chromium wiki centralizes user, building, and
      troubleshooting guidance shared across platform builds.
  sources:
    - https://github.com/ungoogled-software/ungoogled-chromium
    - https://github.com/ungoogled-software/ungoogled-chromium-macos
    - https://ungoogled-software.github.io/
    - source_facts.description
    - source_facts.repo
  summary:
    - >
      Ungoogled Chromium is a Chromium-derived web browser assembled with patches and
      configuration that reduce Google service integration and emphasize privacy,
      control, and transparency.
  timeline:
    - >
      2015: The core project's license begins its copyright history for the
      ungoogled-chromium authors.
    - >
      2020s: Platform repositories continue tracking Chromium and distributing
      community-built packages.
    - >
      2025–2026: The macOS project documents signed and notarized builds funded through
      community sponsorship.
  usage:
    - >
      Users run it as a general-purpose Chromium browser, but some conveniences tied to
      Google services are disabled or require explicit configuration. The official wiki
      documents extension installation, media components, spell-check dictionaries,
      casting, and WebRTC behavior.
    - >
      On macOS, browser profile data and settings are kept under `~/Library/Application
      Support/Chromium`; the official wiki uses this location when documenting
      dictionary installation.
