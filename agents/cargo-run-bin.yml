id: brew:cargo-run-bin
display-name: cargo-run-bin
repo: null
docs:
  - https://github.com/dustinblackman/cargo-run-bin#readme
config-file-location:
  unix:
    - Cargo.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      crates.io metadata lists it as a Cargo plugin and command-line utility. Batch
      package facts show packaging across Homebrew, Alpine, Nix, and Arch, and the
      README also documents distro-package installation paths.
  package-nerd-significance:
    - >
      It gives Rust projects a lightweight, Cargo-native answer to pinned developer
      tooling: tool versions live with the project manifest, which makes onboarding and
      CI behavior less dependent on whatever happens to be globally installed.
  project-history:
    - >
      The GitHub repository was created in May 2021 and the first crates.io release
      followed later that month. The README positions the tool as similar to npm run and
      gomodrun, aimed at preventing team and CI tool-version drift.
  related-projects:
    - README compares the workflow to npm run and gomodrun.
    - README says cargo-binstall can be used for prebuilt binary installs when available.
  sources:
    - https://api.github.com/repos/dustinblackman/cargo-run-bin
    - https://github.com/dustinblackman/cargo-run-bin
    - https://github.com/dustinblackman/cargo-run-bin#readme
    - https://crates.io/api/v1/crates/cargo-run-bin
    - https://formulae.brew.sh/api/formula/cargo-run-bin.json
  summary:
    - >
      cargo-run-bin is a Cargo-oriented tool for building, caching, and running
      project-scoped CLI binaries declared in Cargo.toml instead of installing those
      tools globally.
  timeline:
    - '2021: Repository created and first crates.io release published.'
    - '2024: v1.7.x releases documented on GitHub.'
    - '2026: crates.io reported v1.7.5 as the latest release.'
  usage:
    - >
      Users declare tools under [package.metadata.bin] or [workspace.metadata.bin] in
      Cargo.toml, then run cargo bin CRATE to install/cache and execute the requested
      binary. The README also documents cargo bin --install and cargo bin --sync-aliases
      for Cargo-extension aliases.
related-packages:
  - id: brew:cargo-binstall
    reason: >
      Use cargo-binstall alongside cargo-run-bin when you want project-pinned tools to
      be installed from prebuilt binaries when available instead of compiled locally.
    rel: adjacent_workflow
    sources:
      - https://github.com/dustinblackman/cargo-run-bin#readme
      - https://github.com/cargo-bins/cargo-binstall/blob/main/README.md
