history:
  adoption-history:
    - >
      UMS broadened the device-specific PS3 Media Server model into a general-purpose
      server for televisions, consoles, phones, streaming devices, and other DLNA/UPnP
      or HTTP-capable clients.
    - >
      Its continued availability on Windows, Linux, and macOS, plus distribution through
      direct downloads, Homebrew, Chocolatey, AppImage, and Docker, made it a familiar
      self-hosted option for households needing automatic transcoding and wide renderer
      compatibility.
  package-nerd-significance:
    - >
      UMS is a notable survivor of the DLNA media-server era: a Java application that
      bundles or integrates mature media utilities such as FFmpeg, MediaInfo, MEncoder,
      tsMuxeR, AviSynth, and VLC behind renderer-specific compatibility profiles.
    - >
      It appeals to package and homelab enthusiasts who want local-network streaming,
      on-demand transcoding, and explicit control over renderer profiles without
      adopting a fully hosted media ecosystem.
  project-history:
    - >
      Universal Media Server began in 2012 as a fork of PS3 Media Server. Founder
      SubJunk had contributed to the parent project and created UMS to emphasize
      stability, file compatibility, and support beyond the PlayStation 3.
    - >
      Early releases expanded renderer support, introduced live subtitles and plugin
      management, and then diverged more substantially with playback resuming,
      recent-media views, filename cleanup, and a startup wizard. Later releases added
      richer metadata, user accounts, access controls, casting, and web-interface
      improvements.
  related-projects:
    - UMS descends from PS3 Media Server, which began in 2008.
    - >
      FFmpeg, MediaInfo, MEncoder, tsMuxeR, AviSynth, and VLC supply important probing,
      transcoding, and playback capabilities.
  sources:
    - https://github.com/UniversalMediaServer/UniversalMediaServer#readme
    - https://support.universalmediaserver.com/history/
    - https://support.universalmediaserver.com/whats-new-in-v15/
    - https://www.universalmediaserver.com/about/
  summary:
    - >
      Universal Media Server is a free, open-source DLNA, UPnP, and HTTP(S) server that
      streams or transcodes video, audio, and images to a broad range of playback
      devices.
  timeline:
    - '2008: The predecessor PS3 Media Server project began.'
    - '2012: Universal Media Server launched as a PS3 Media Server fork.'
    - >
      2012: Version 1 emphasized broad device support; version 2 added plugin management
      and live subtitles.
    - >
      2013: Version 3 marked substantial divergence with new media-management and
      playback features.
    - '2022: Version 14 added stronger account, access-control, metadata, and casting features.'
  usage:
    - >
      Users select local media folders, run the server on a computer or NAS-like host,
      and browse or play the exposed library from compatible televisions, consoles,
      phones, and media-player applications. UMS can stream compatible files directly or
      transcode unsupported formats.
    - >
      The main configuration file is UMS.conf inside the active profile directory. The
      application reports that directory near the top of its logs, which is the
      authoritative way to locate a particular installation's configuration and local
      database.
