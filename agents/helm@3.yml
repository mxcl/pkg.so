id: brew:helm@3
display-name: Helm
repo: null
docs:
  - https://helm.sh/docs
  - https://v3.helm.sh/docs/helm/helm
  - https://v3.helm.sh/docs/helm/helm_registry_login
config-file-location:
  linux:
    - ~/.config/helm/repositories.yaml
    - ~/.config/helm/registry/config.json
  macos:
    - ~/Library/Preferences/helm/repositories.yaml
    - ~/Library/Preferences/helm/registry/config.json
  windows:
    - '%APPDATA%\helm\repositories.yaml'
    - '%APPDATA%\helm\registry\config.json'
credentials-file-location:
  linux:
    - ~/.config/helm/registry/config.json
  macos:
    - ~/Library/Preferences/helm/registry/config.json
  windows:
    - '%APPDATA%\helm\registry\config.json'
history:
  adoption-history:
    - >
      Helm entered the CNCF after building a large multi-company contributor base, and
      later graduated as a CNCF project. Its adoption followed Kubernetes adoption:
      charts became a common distribution format for cluster add-ons, databases, ingress
      controllers, observability stacks, and internal platform services.
    - >
      The Helm 3 line became important in package-manager ecosystems because it removed
      the Helm 2 server component while preserving the command name and most everyday
      chart operations. Versioned packages such as `helm@3` let Homebrew users pin the
      operational era of Helm separately from future major-line changes.
  package-nerd-significance:
    - >
      Helm matters to package nerds because it made Kubernetes applications feel
      package-manager-like: a chart has metadata, versions, dependencies, values,
      repositories, provenance features, and install/upgrade/rollback semantics. It also
      created an ecosystem of chart repositories, chart-testing tools, chart indexers,
      and wrappers such as Helmfile and Helmsman.
    - >
      The `helm@3` package role is specifically about major-version compatibility.
      Scripts, CI images, and plugins written for Helm 3 can declare that track without
      implying anything about a later unqualified Helm package.
  project-history:
    - >
      Helm began as Helm Classic, a Deis project started in 2015 and shown publicly at
      the inaugural KubeCon. Kubernetes Helm later combined Helm Classic with the
      Kubernetes port of Google Cloud Deployment Manager, creating the chart-and-release
      workflow that became familiar to Kubernetes operators.
    - >
      Helm 2 introduced Tiller, a server-side in-cluster component that coordinated
      release operations for teams sharing a cluster. That architecture fit early
      Kubernetes usage but became awkward once RBAC became a default Kubernetes security
      expectation.
    - >
      Helm 3 removed Tiller and moved permissions back to the user's Kubernetes
      credentials, while keeping the chart format and release-management workflow. It
      also changed release names to be namespace-scoped, used Secrets as the default
      release storage driver, changed Go import paths to `helm.sh/helm/v3`, and added
      experimental OCI registry support at the 3.0.0 release.
  related-projects:
    - Helm Classic was the pre-merge Deis project that led into Kubernetes Helm.
    - >
      Google Cloud Deployment Manager influenced the Kubernetes-side deployment-manager
      work that merged into Helm.
    - >
      Chart repositories, OCI registries, Artifact Hub, Helmfile, Helmsman, helm-diff,
      and helmify are adjacent tools in the Helm packaging ecosystem.
  sources:
    - https://formulae.brew.sh/formula/helm@3
    - https://helm.sh/blog/celebrating-helms-cncf-graduation/
    - https://helm.sh/blog/helm-3-preview-pt1/
    - https://helm.sh/blog/helm-3-released/
    - https://helm.sh/blog/helm-enters-the-cncf/
    - https://helm.sh/community/history/
    - https://helm.sh/docs/v3/faq/changes_since_helm2/
  summary:
    - >
      Helm is the Kubernetes package manager and chart tool: it packages Kubernetes
      manifests into versioned charts, installs them as releases, and records release
      history in the cluster. The Homebrew `helm@3` formula represents the Helm 3 major
      line, useful where users or automation want the Helm 3 command-line behavior and
      plugin/API expectations rather than an unqualified moving major.
  timeline:
    - '2015: Helm Classic began at Deis and was introduced at the inaugural KubeCon.'
    - >
      2016: Kubernetes Helm emerged from the merge of Helm Classic and the Kubernetes
      Deployment Manager work.
    - '2018: Helm entered the CNCF after broad growth in contributors and releases.'
    - >
      2019: Helm 3.0.0 was released, removing Tiller and changing release
      storage/security behavior.
    - '2020: Helm graduated in the CNCF.'
  usage:
    - >
      Typical usage is `helm repo add`, `helm install`, `helm upgrade`, `helm rollback`,
      and `helm history` against charts stored in chart repositories or OCI registries.
      Chart authors use templates, values files, dependencies, and linting to ship
      repeatable Kubernetes application installs.
    - >
      Helm stores repository and registry state in per-user configuration files and uses
      kubeconfig-based Kubernetes identity for cluster operations. That makes it fit
      both laptops and CI runners, while keeping authentication boundaries in Kubernetes
      and registry tooling.
related-packages:
  - id: brew:helmfile
    reason: >
      Use Helmfile when multiple Helm releases and environment-specific values should be
      managed together from declarative, version-controlled state.
    rel: adjacent_workflow
    sources:
      - https://helmfile.readthedocs.io/en/stable/
      - https://helm.sh/docs/
  - id: brew:helmsman
    reason: >
      Use Helmsman when Helm releases should converge from one desired-state file with
      planning, ordering, and release-protection controls.
    rel: adjacent_workflow
    sources:
      - https://github.com/mkubaczyk/helmsman
      - https://helm.sh/docs/
  - id: brew:helmify
    reason: >
      Use Helmify to generate a chart from existing Kubernetes YAML, then lint, package,
      and install that chart with Helm.
    rel: adjacent_workflow
    sources:
      - https://github.com/arttor/helmify
      - https://helm.sh/docs/topics/charts/
