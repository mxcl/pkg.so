history:
  adoption-history:
    - >
      libftdi became common in hardware development because it avoided vendor-only
      driver stacks for FTDI adapters while still supporting popular serial, FIFO, and
      bitbang use cases. Its package presence across Homebrew, Debian, Ubuntu, Fedora,
      Arch, MacPorts, Nix, and other distributions reflects broad embedded, lab, and
      board-bringup usage.
  package-nerd-significance:
    - >
      libftdi is a small but important hardware-enablement package: it gives
      distributions a Free Software path for FTDI chips without forcing every
      electronics tool to vendor its own USB code. It is also a packaging reminder that
      command-line EEPROM utilities, Python bindings, libusb transitions, and
      kernel-driver detach behavior are part of the real ABI users care about.
  project-history:
    - >
      The official libFTDI page describes the library as a way to talk to FTDI chips
      from userspace with no kernel driver required, supporting chip families from
      FT8U232/FT8U245 through FT230X, FT232R, FT245R, FT2232, and FT4232H. Intra2net’s
      repository page identifies master as the libusb 1.0 development branch and
      libftdi-0.x as the legacy libusb 0.x branch.
    - >
      The project’s official news records libftdi 1.3 on 2016-05-20, 1.4 on 2017-08-07,
      and 1.5 on 2020-07-07. Those releases added USB string APIs, transfer
      cancellation, EEPROM configuration improvements, FT230X baud-rate handling, kernel
      driver auto attach and detach, tcflush-style APIs, SPDX identifiers, Python
      wrapper improvements, and CMake improvements.
  related-projects:
    - libusb provides the portable USB access layer used by libftdi.
    - >
      The Linux ftdi_sio kernel driver is the kernel-space counterpart that many libftdi
      workflows deliberately bypass or detach from.
  sources:
    - http://developer.intra2net.com/git/?p=libftdi;a=tags
    - https://www.intra2net.com/en/developer/libftdi/
    - https://www.intra2net.com/en/developer/libftdi/repository.php
  summary:
    - >
      libftdi is Intra2net’s open-source userspace library for communicating with FTDI
      USB serial and FIFO chips through libusb, including bitbang and EEPROM tooling.
  timeline:
    - '2016-05-20: Intra2net news records libftdi 1.3.'
    - '2017-08-07: Intra2net news records libftdi 1.4.'
    - '2020-07-07: Intra2net news records libftdi 1.5.'
    - >
      2026: The official repository page still documents master for libusb 1.0
      development and libftdi-0.x for legacy libusb 0.x code.
  usage:
    - >
      Applications link libftdi to enumerate and communicate with FTDI devices through
      libusb. The package also ships ftdi_eeprom for EEPROM decoding and programming,
      with release notes calling out repeated EEPROM handling improvements.
