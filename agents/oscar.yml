credentials-file-location: null
history:
  adoption-history:
    - >
      OSCAR is distributed without charge for Windows, macOS, and Linux, with additional
      documented builds for ChromeOS and Raspberry Pi OS. Its official materials say it
      is used by sleep-therapy patients, clinicians, therapists, and medical researchers
      to inspect detailed machine data across multiple manufacturers.
  package-nerd-significance:
    - >
      OSCAR preserves an open, cross-platform route to high-resolution sleep-therapy
      data that would otherwise often remain inside manufacturer-specific applications.
      Its importers, graphical reports, profile migration, exports, and open source make
      it important to users who need reproducible access to their own CPAP data.
  project-history:
    - >
      OSCAR began in 2019 as a community continuation and fork of the abandoned
      SleepyHead project. The OSCAR team maintained the Qt-based application and
      expanded device support, reporting, profile management, and cross-platform
      packaging.
    - >
      OSCAR 2.0 introduced an SQL-backed data store, profile backup and sharing,
      configurable CSV reporting, external program access to data, time correction, and
      additional device loaders. The official release notes describe this as the
      foundation for future development.
  related-projects:
    - SleepyHead is OSCAR's predecessor and original code base.
    - Apnea Board hosts the official help system and community support material.
    - >
      CPAP, bilevel, ventilator, oximeter, and sleep-monitor devices supply the data
      OSCAR imports and analyzes.
  sources:
    - https://gitlab.com/CPAPreporter/oscar-code
    - https://gitlab.com/CrimsonNape/OSCAR-SQL
    - https://www.apneaboard.com/wiki/index.php/OSCAR_Installation
    - https://www.apneaboard.com/wiki/index.php?title=OSCAR_Help
    - https://www.sleepfiles.com/OSCAR/
  summary:
    - >
      OSCAR, the Open Source CPAP Analysis Reporter, is a free cross-platform
      application for importing, visualizing, and exploring detailed data recorded by
      supported sleep-therapy devices.
  timeline:
    - '2019: OSCAR was created as a community fork and continuation of SleepyHead.'
    - '2019: The original OSCAR Team GitLab project was established.'
    - >
      2026: OSCAR 2.0 moved its data to SQL and added profile sharing, expanded export,
      and programmatic data-access features.
  usage:
    - >
      Users create a profile, import detailed data from a therapy machine's SD card, and
      review daily graphs, overview trends, statistics, events, and breath-level flow
      information. OSCAR reports can support discussion with clinicians, but the project
      presents the software as an analysis and reporting tool rather than a substitute
      for professional medical care.
    - >
      OSCAR 2.0 asks the user to accept or choose its data directory on first launch.
      The official installation guide names the recommended folder `OSCAR20_Data`; this
      directory contains profiles, settings, and imported medical data. OSCAR 2.0
      removed the profile-password feature, so no credentials file applies.
