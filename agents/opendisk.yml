history:
  adoption-history:
    - >
      OpenDisk is distributed as a downloadable macOS application, through GitHub
      releases, and as a Homebrew cask. Its official positioning is a free, open-source
      alternative to commercial visual disk analyzers.
  package-nerd-significance:
    - >
      OpenDisk is notable to macOS package users because it combines a native SwiftUI
      interface with low-level APFS-aware scanning and an MIT-licensed codebase. It
      offers a package-manageable alternative in a category often dominated by
      proprietary utilities.
  project-history:
    - >
      OpenDisk was created as a fast, free, open-source disk-usage analyzer for modern
      macOS. The project emphasizes APFS-aware accounting, streaming scan results, and
      an interactive sunburst visualization.
  related-projects:
    - >
      The project explicitly positions itself as an open alternative to DaisyDisk and
      compares its scanning approach with DaisyDisk and GNOME Disk Usage Analyzer
      (Baobab).
    - Sparkle supplies the application's built-in update mechanism.
  sources:
    - https://github.com/137137137/OpenDisk
    - https://opendisk.app/
    - source_facts.package-manager
  summary:
    - >
      OpenDisk is a native macOS storage analyzer that maps filesystem usage as an
      interactive sunburst chart and provides folder browsing, search, rescans, and file
      collection for cleanup.
  timeline:
    - '2026: OpenDisk was distributed as an open-source macOS application and Homebrew cask.'
  usage:
    - >
      Users grant Full Disk Access for complete totals, choose a drive or folder,
      explore the live sunburst and folder list, search the scanned tree, inspect
      purgeable space, and collect files for deletion. Incremental rescans reuse prior
      results and filesystem events.
