history:
  adoption-history:
    - >
      MacDroid developed from a USB-oriented Android mounting utility into a broader
      transfer tool. The official history records continuing improvements to ADB and MTP
      operation, native Apple-silicon support, Finder integration, and eventually
      wireless transfers.
    - >
      The 2.x generation added Wi-Fi connectivity, a native mount type on supported
      macOS versions, file previews, and continuing improvements to large-file and
      device compatibility.
  package-nerd-significance:
    - >
      MacDroid fills the interoperability gap created by macOS lacking native Android
      filesystem mounting. Its support for both the standard MTP workflow and
      developer-oriented ADB makes it useful across ordinary media transfer and more
      technical Android setups.
    - >
      Mounting a phone as a Finder-visible disk makes device transfer behave more like
      conventional filesystem work than a separate media-import workflow.
  project-history:
    - >
      Electronic Team first released MacDroid in February 2020 as a macOS application
      for connecting and transferring files to Android devices. Its official user guide
      describes three connection approaches: MTP, ADB, and Wi-Fi.
  related-projects:
    - Android File Transfer and OpenMTP address similar Mac-to-Android transfer needs.
    - >
      Android Debug Bridge supplies MacDroid's ADB connection mode; MTP provides its
      more broadly compatible device-transfer mode.
  sources:
    - >
      https://help.electronic.us/support/solutions/articles/44001895298-macdroid-version-history
    - https://help.electronic.us/support/solutions/folders/44001203643
    - https://help.electronic.us/support/solutions/folders/44001203750
    - https://www.macdroid.app/
  summary:
    - >
      MacDroid is Electronic Team's macOS utility for mounting Android devices and
      transferring files through MTP, ADB, or Wi-Fi connections.
  timeline:
    - '2020-02-12: MacDroid 1.0.85 was the first release.'
    - >
      2020-11-26: Version 1.3 added AppleScript support and Android 11 compatibility
      improvements.
    - '2021-12-30: Version 1.4 added native Apple-silicon support.'
    - '2024-05-23: Version 2.0 added Wi-Fi transfer and a native mount type.'
    - '2025-07-09: Version 2.5 added an Activity Log and expanded transfer diagnostics.'
  usage:
    - >
      Users connect an Android device by USB for MTP or ADB, or configure a wireless
      connection, then mount the device so its storage can be managed from the Mac.
    - >
      ADB mode requires USB debugging on the Android device. MTP is the more universal
      mode, while preferences control mounting, caching, refresh behavior, and transfer
      options.
