id: brew:cvsync
display-name: CVSync
repo: https://github.com/cvsync/cvsync
docs:
  - https://www.cvsync.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CVSync belongs to the era when public CVS mirrors mattered: it offered
      repository-level synchronization over a dedicated cvsync protocol and included
      tools for mirror operators who were also dealing with CVSup-style distribution.
  package-nerd-significance:
    - >
      For package archaeology, CVSync is a mirror-maintenance tool: it reflects the
      operational side of old source distributions, where keeping RCS-backed CVS
      repositories synchronized was as important as using the version-control client.
  project-history:
    - >
      The official site presents CVSync as a BSD-licensed CVS repository synchronization
      utility and now points all CVSync materials to GitHub. The project copyright line
      covers MAEKAWA Masahide from 2003 through 2026.
  related-projects:
    - CVSync is related to CVS, RCS repository files, and CVSup-style repository distribution.
  sources:
    - https://www.cvsync.org/
    - https://github.com/cvsync/cvsync
    - https://raw.githubusercontent.com/cvsync/cvsync/master/doc/ChangeLog.2003
  summary:
    - >
      CVSync is a portable utility suite for synchronizing and mirroring CVS
      repositories, with client, server, scanner, comparison, and CVSup-conversion
      tools.
  timeline:
    - '2003: CVSync documentation and copyright history begin.'
    - '2003: The ChangeLog records rapid 0.19.x through 0.24.x development.'
    - >
      The official site lists 0.24.20 as a distribution release and points development
      activity to GitHub.
  usage:
    - >
      Users run cvsync against a cvsync:// host to list or retrieve collections, while
      cvsyncd serves collections and companion tools scan RCS files, compare
      repositories, and convert between CVSup and CVSync metadata.
related-packages:
  - id: brew:cvs
    reason: >
      CVS is the version-control system used to create and administer the repositories
      that CVSync distributes and mirrors.
    rel: adjacent_workflow
    sources:
