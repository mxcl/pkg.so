history:
  adoption-history:
    - >
      Overview is distributed as free, open-source beta software for macOS. Its official
      materials emphasize EVE Online users, while its live previews, layouts, and
      switching controls work with windows from any application.
  package-nerd-significance:
    - >
      Overview fills a platform-specific gap by implementing an Eve-O Preview-style
      workflow natively with SwiftUI and Apple's ScreenCaptureKit. For package users, it
      is a compact example of an open-source macOS menu-bar utility distributed both
      from its own site and through Homebrew Cask.
  project-history:
    - >
      William Pierce created Overview as a native macOS window-preview and
      task-switching utility. The project explicitly credits Eve-O Preview as the
      inspiration for its design and purpose and remains publicly developed under the
      MIT license.
  related-projects:
    - >
      Eve-O Preview is the principal inspiration. Overview also uses the
      KeyboardShortcuts and Sparkle libraries and derives portions from Apple's
      ScreenRecorder sample.
  sources:
    - https://github.com/williamcpierce/Overview
    - https://github.com/williamcpierce/Overview/blob/main/FUNDING.md
    - https://williampierce.io/overview/
  summary:
    - >
      Overview creates live previews of macOS application windows and lets users
      activate source applications through previews or keyboard shortcuts.
  timeline:
    - >
      2024: Overview appeared publicly as a native macOS alternative inspired by Eve-O
      Preview.
    - >
      2026: The official project site continued to present Overview as a free,
      open-source beta.
  usage:
    - >
      Users grant Screen Recording permission, create previews from the menu-bar
      application, arrange them into saved layouts, and click previews or use shortcuts
      to focus source windows. Appearance, frame rate, hiding behavior, overlays, source
      filtering, and update channels are configurable.
