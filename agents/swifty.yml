history:
  adoption-history:
    - >
      Swifty is distributed as a cross-platform desktop password manager for macOS,
      Windows, and Linux. Optional Google Drive synchronization provides movement
      between installations while the default workflow remains local-first.
  package-nerd-significance:
    - >
      Swifty is notable to package users as an open-source, offline-first password
      manager with a locally encrypted SQLCipher vault. Its release process publishes
      provenance attestations and software bills of materials, making build provenance
      inspectable by technically inclined users.
  project-history:
    - >
      Swifty was developed as a free, open-source, offline-first password manager. Its
      current implementation uses a Tauri 2 Rust backend with a TypeScript and React
      interface, and protects its local vault with SQLCipher plus additional
      application-level authenticated encryption.
  related-projects:
    - SQLCipher
    - Tauri
    - Google Drive
  sources:
    - https://github.com/swiftyapp/swifty
  summary:
    - >
      Swifty is a cross-platform, offline-first password manager for logins,
      payment-card details, secure notes, generated passwords, and time-based one-time
      passwords.
  timeline:
    - 'Current generation: Swifty uses Tauri 2 and a Rust backend.'
    - >
      Current release workflow: Packaged builds include provenance attestations,
      CycloneDX software bills of materials, and signed updates.
  usage:
    - >
      Users create a locally encrypted vault, store login credentials, payment-card data
      and secure notes, generate passwords, and obtain TOTP codes. They can move data
      with backup files or enable optional Google Drive synchronization using their own
      OAuth client configuration.
