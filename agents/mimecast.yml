  summary:
    - >
      Mimecast for Mac is an enterprise desktop client for reaching Mimecast-hosted
      email archives and related email services from macOS.
  timeline:
    - >
      2025: Current official support documentation described standalone and managed
      installation paths
    - >
      2026: Official prerequisites listed support through macOS 15 alongside Apple Mail
      and Outlook
  usage:
    - >
      An administrator first enables the Mac application for the user. The user installs
      the DMG, signs in with an email address and an applicable network or Mimecast
      Cloud password, and can search archived mail and compose messages through Mimecast
      for Mac, Apple Mail, or Outlook.
