history:
  adoption-history:
    - >
      Mimecast documents both standalone installation and centrally managed deployment
      through third-party endpoint-management systems, reflecting its use in managed
      enterprise environments.
  package-nerd-significance:
    - >
      The cask makes an enterprise email-continuity and archive client available through
      a consumer-oriented macOS package workflow, although activation and policy
      normally remain controlled by an organization's Mimecast administrator.
  project-history:
    - >
      Mimecast for Mac is the macOS desktop client for accessing services supplied
      through an organization's Mimecast account. Official documentation focuses on
      deployment and supported environments rather than a detailed product chronology.
  related-projects:
    - Mimecast cloud services
    - Apple Mail
    - Microsoft Outlook
  sources:
