history:
  adoption-history:
    - >
      Beamer established a niche among Mac users who wanted to play locally stored
      formats such as MKV and AVI on Apple TV without first converting them. Chromecast
      support broadened it beyond the Apple ecosystem, while Homebrew cask packaging
      offers a repeatable macOS installation path.
  package-nerd-significance:
    - >
      Beamer is a specialist bridge between desktop media files and living-room
      receivers. Its appeal is direct playback of formats and subtitle tracks that
      otherwise invite conversion, media-server setup, or screen mirroring.
  project-history:
    - >
      Beamer evolved through several major versions as Apple TV and casting protocols
      changed. Version 3 added Chromecast support and a redesigned interface. Softorino
      acquired the product by 2022 and later moved users toward Beamer 4, which added
      AirPlay 2, newer tvOS compatibility, improved subtitle handling, queues, and
      broader high-resolution casting support.
  related-projects:
    - Apple TV
    - AirPlay 2
    - Google Cast
    - Chromecast
  sources:
    - >
      Official Beamer 3 feature history:
      https://help.softorino.com/help/what-s-new-in-beamer-3-0
    - >
      Official Beamer 4 transition article:
      https://softorino.com/blog/saying-goodbye-to-beamer-3
    - 'Official help collection: https://help.softorino.com/help/beamer'
    - 'Official product page: https://softorino.com/beamer'
  summary:
    - >
      Beamer is a commercial macOS application that streams local video files directly
      to Apple TV, Chromecast, Google Cast, and compatible AirPlay devices. It
      emphasizes drag-and-drop playback, broad codec support, subtitles, playlists, and
      remote control.
  timeline:
    - 'Version 3 era: Chromecast support and a redesigned interface were introduced.'
    - >
      2022: Softorino's official support material identifies the company as Beamer's new
      owner by this period.
    - '2024: Softorino announced Beamer 4 support for Apple Vision Pro.'
    - '2025: Softorino formally directed Beamer 3 users toward Beamer 4.'
  usage:
    - >
      Users place the Mac and receiver on the same network, select the target device,
      then drag a movie into Beamer. The application streams or converts as needed and
      supports embedded or external subtitles, multiple audio formats, playlists, and
      receiver remote controls.
