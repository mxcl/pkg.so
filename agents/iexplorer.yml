history:
  adoption-history:
    - >
      Macroplant reports that the original iPhone Explorer received several million
      downloads during its first two years. The product continued as iExplorer after the
      2011 rename and has been distributed for macOS and Windows.
  package-nerd-significance:
    - >
      iExplorer is a long-running example of packaging a proprietary device-management
      utility through Homebrew Cask. It fills the space between Finder or iTunes-style
      synchronization and direct inspection or extraction of device and backup data.
  project-history:
    - >
      Macroplant created the application in 2009 under the name iPhone Explorer. In
      August 2011, after Apple objected to use of “iPhone” in the product title,
      Macroplant renamed it iExplorer.
  related-projects:
    - >
      Macroplant’s product history also includes iExplorer Mobile and other
      media-transfer utilities.
  sources:
    - >
      https://helpdesk.macroplant.com/hc/en-us/articles/360019028933-What-happened-with-the-program-s-name
    - https://macroplant.com/iexplorer
    - https://macroplant.com/press
    - source_facts.package-manager.brew-cask
  summary:
    - >
      iExplorer is Macroplant’s desktop utility for browsing, transferring, and backing
      up data from iPhones, iPads, iPods, and their backups.
  timeline:
    - '2009: Released as iPhone Explorer.'
    - '2011: Renamed iExplorer after two years and several million downloads.'
  usage:
    - >
      Users connect an iOS device or open a local backup to browse and transfer files,
      messages, media, and other supported data, and to create or work with device
      backups.
