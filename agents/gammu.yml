id: brew:gammu
display-name: Gammu
repo: null
docs:
  - https://docs.gammu.org/
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/gammu/config
    - ~/.config/gammu/config
    - ~/.gammurc
    - /etc/gammurc
    - /etc/gammu-smsdrc
  windows:
    - '%PROFILE%\Application Data\gammurc'
    - .\gammurc
credentials-file-location: null
history:
  adoption-history:
    - >
      Gammu's adoption is rooted in the pre-smartphone and GSM-modem era, where scripts,
      servers, and desktop tools needed a portable way to talk to phones. The official
      site maintains a phone database and documentation for Gammu, SMSD, Wammu,
      python-gammu, and libGammu.
    - >
      The input package facts show Gammu packaged across Alpine, Homebrew, Debian,
      Fedora, Nix, Arch, and Ubuntu, reflecting its long life as a Unix-friendly
      hardware and SMS utility.
  package-nerd-significance:
    - >
      Gammu is historically important to system packagers because it packages a
      hardware-facing CLI, daemon, shared library, Python bindings, documentation,
      config-file conventions, and many phone protocols. It is a classic example of a
      Unix hardware bridge whose usefulness depends on distribution integration as much
      as upstream code.
  project-history:
    - >
      The official manual describes Gammu as a project providing an abstraction layer
      for cell-phone access. It was initiated by Marcin Wiacek and others, originally
      based on the Gnokii and MyGnokii projects, and was formerly called MyGnokii2 up to
      version 0.58.
    - >
      The project later became the Gammu and Wammu family: Gammu for the command-line
      utility and core library, libGammu for C API access, python-gammu for Python
      bindings, Wammu for the graphical frontend, and SMSD for SMS daemon use. The
      documentation identifies Michal Cihar as current project lead with help from
      contributors.
  related-projects:
    - Gnokii and MyGnokii were predecessors that influenced Gammu.
    - Wammu is the graphical frontend in the same project family.
    - libGammu exposes the C API.
    - python-gammu exposes Gammu functionality to Python.
    - Gammu SMSD is the related SMS daemon.
  sources:
    - https://docs.gammu.org/
    - https://docs.gammu.org/project/index.html
    - https://github.com/gammu/gammu
    - https://github.com/gammu/gammu/releases
    - https://wammu.eu/gammu/
  summary:
    - >
      Gammu is a command-line utility and library family for controlling mobile phones,
      especially AT-compatible and Nokia phones, with features for calls, SMS, MMS,
      phonebooks, calendars, files, and SMS daemon operation.
  timeline:
    - 'Pre-0.58: Project known as MyGnokii2.'
    - '2003: Wammu/Gammu website copyright history begins.'
    - '2009: Sphinx manual copyright history begins.'
    - '2026: Gammu 1.43.x releases published on GitHub.'
  usage:
    - >
      Users configure a phone connection in gammurc-style files, then run gammu to list
      or initiate calls, retrieve and send SMS, back up data, manage phonebooks, work
      with calendars, and use supported phone features. SMSD provides a daemon mode for
      SMS gateway workflows.
related-packages: []
