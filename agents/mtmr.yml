id: cask:mtmr
display-name: MTMR
repo: https://github.com/Toxblh/MTMR
docs:
  - https://github.com/Toxblh/MTMR#readme
config-file-location:
  macos:
    - ~/Library/Application Support/MTMR/items.json
credentials-file-location: null
history:
  adoption-history:
    - >
      MTMR was distributed through GitHub releases and the Homebrew cask recorded in
      source_facts.package-manager.
    - >
      Its JSON configuration and extensible widget catalog encouraged users to publish
      and exchange personalized Touch Bar presets.
  package-nerd-significance:
    - >
      MTMR is a characteristic package-manager utility for hardware Apple later
      discontinued: a small open-source application that turns a fixed vendor interface
      into a user-programmable surface.
    - >
      Its plain JSON configuration makes Touch Bar layouts inspectable,
      version-controllable, and reproducible across machines.
  project-history:
    - >
      MTMR, short for My TouchBar. My Rules., was created by Toxblh with contributions
      credited to ReDetection as an open-source customization application for Touch
      Bar-equipped MacBook Pro models.
    - >
      The project evolved from configurable buttons into a broad collection of native
      widgets, AppleScript and shell integrations, gestures, groups, media controls,
      weather displays, and application-aware items.
  related-projects:
    - macOS Touch Bar
    - AppleScript
    - Homebrew Cask
  sources:
    - https://github.com/Toxblh/MTMR
    - https://github.com/Toxblh/MTMR/releases
    - https://mtmr.app/
  summary:
    - >
      MTMR is an open-source macOS application that replaces the standard MacBook Pro
      Touch Bar layout with a user-defined JSON configuration.
  timeline:
    - '2018: The official project site dates the beginning of MTMR to 2018.'
    - >
      Later releases: MTMR added gestures, groups, application conditions, Dock
      integration, calendar widgets, and multiple tap actions.
  usage:
    - >
      Users edit items.json to arrange built-in controls, native plugins, scripts,
      AppleScript actions, groups, gestures, and conditional items on the Touch Bar.
    - >
      Accessibility permission is required for system-key actions such as Escape,
      brightness, and volume controls.
tags:
  - apple-script
  - customization
  - input-customization
  - json-config
  - macos
  - touch-bar
  - widgets
provenance:
  category-sources:
    - >
      https://mtmr.app/ and the official repository describe customization of the
      MacBook Pro Touch Bar.
    - source_facts.description identifies a Touch Bar customization application.
  display-name-sources:
    - The official repository uses MTMR as the project name.
    - https://mtmr.app/ expands the name as “My TouchBar. My Rules.”
  docs-sources:
    - >
      The official README is the primary documentation surface and describes
      installation, permissions, configuration, item types, gestures, and plugins.
  history-sources:
    - https://github.com/Toxblh/MTMR
    - https://github.com/Toxblh/MTMR/releases
    - https://mtmr.app/
  repo-sources:
    - https://mtmr.app/ links directly to the official GitHub repository.
  tags-sources:
    - https://github.com/Toxblh/MTMR
    - https://mtmr.app/
    - source_facts.description
category-confidence: high
category-path:
  - system
  - input-devices
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
