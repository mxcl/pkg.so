history:
  adoption-history:
    - >
      SolveSpace's 2.0 release was published for Windows in 2013 with GPLv3 source.
      Subsequent releases added Unix compatibility and broadened official builds to
      Linux and macOS; the official download page now also directs Linux users to
      distribution package managers and Snap.
    - >
      Its adoption niche is lightweight parametric CAD: users can obtain a packaged
      application without deploying a large mechanical-product-lifecycle stack, while
      developers can build the same GPL codebase on the major desktop platforms.
  package-nerd-significance:
    - >
      SolveSpace is valued as a compact, cross-platform, open-source parametric CAD
      application with relatively few moving parts. It covers sketch constraints,
      solids, assemblies, drawing export, CAM interchange, and linkage simulation
      without the footprint of a larger CAD suite.
    - >
      The geometric constraint solver is also exposed through a library interface. That
      makes the project interesting beyond its desktop UI, although its GPLv3 licensing
      matters to distributors and applications that link the solver.
  project-history:
    - >
      SolveSpace was begun by Jonathan Westhues in May 2008. An official-site history
      discussion records that he developed it through version 2.0, which was released as
      open source in 2013; the project inherited ideas from his earlier SketchFlat
      constraint-based 2D drawing program.
    - >
      After the open-source release, community maintainers continued the project. The
      official release record shows the progression from 2.0 through the Unix-capable
      2.1 series, the 2.3 maintenance line, and the 3.x releases, while preserving
      SolveSpace's focus on constraint-driven 2D sketches, solid modeling, and
      assemblies.
  related-projects:
    - >
      SketchFlat: Jonathan Westhues's earlier 2D constraint-based drawing application,
      identified in the official-site history discussion as a predecessor.
    - >
      SolveSpace constraint-solver library: an interface exposing the solver used by the
      desktop application for embedding in other GPL-compatible software.
  sources:
    - https://github.com/solvespace/solvespace/releases
    - https://solvespace.com/download.pl
    - https://solvespace.com/features.pl
    - https://solvespace.com/forum.pl?action=viewthread&parent=4146&tt=1639595791
    - https://solvespace.com/library.pl
    - https://solvespace.com/tutorial.pl
  summary:
    - >
      SolveSpace is a free, GPLv3 parametric 2D/3D CAD application. It combines
      geometric constraints, solid modeling, assemblies, technical drawing, common
      manufacturing exports, and mechanism simulation in a comparatively small
      cross-platform package.
  timeline:
    - '2008: Jonathan Westhues began developing SolveSpace.'
    - '2013: Version 2.0 was released with GPLv3 source.'
    - '2016: Version 2.3 established an official Windows, Linux, and macOS release line.'
    - '2021: Version 3.0 became the stable 3.x release.'
    - '2022: Version 3.1 was released.'
    - >
      2026: Version 3.2 added usability and multi-constraint improvements, an optional
      Qt front end for Linux, and the experimental web version.
  usage:
    - >
      Users create dimensioned 2D sketches, apply geometric constraints, and generate 3D
      geometry with extrusions, revolutions, helixes, and Boolean operations. Parts may
      be linked into parametric assemblies whose constraints preserve their relative
      placement as source parts change.
    - >
      Common downstream uses include exporting DXF, PDF, or SVG for drawings and
      cutting; STEP or mesh formats for CAM and 3D printing; and simulating planar or
      spatial mechanisms with the constraint solver.
