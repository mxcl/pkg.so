history:
  adoption-history:
    - >
      The Python implementation is installable through pip and pipx, and the supplied
      package facts record a Homebrew formula. Its command set and support for
      passwords, NTLM hashes, AES keys, and Kerberos make it useful in both routine
      administration and authorized security-assessment workflows.
    - >
      The original repository now directs users to a newer Go implementation under
      TheManticoreProject, described by the maintainers as faster and cross-platform by
      default.
  package-nerd-significance:
    - >
      smbclient-ng offers a modern interactive shell around SMB operations, with remote
      and local file commands, recursive transfers, metadata inspection, ACL access,
      session management, and scriptable command execution.
    - >
      Package maintainers should distinguish the established Python repository
      represented by this record from the newer Go rewrite linked by its maintainer.
  project-history:
    - >
      smbclient-ng was developed by p0dalirius as a faster, more user-friendly
      interactive alternative for working with SMB shares. The original implementation
      is Python-based and exposes an extensive shell-like command vocabulary.
    - >
      Development subsequently produced a Go rewrite in TheManticoreProject
      organization. The original project's README explicitly redirects users toward that
      implementation while preserving the Python code and documentation.
  related-projects:
    - TheManticoreProject/smbclient-ng, the official successor implementation written in Go.
    - >
      Impacket, whose SMB protocol support underpins the Python security-tool ecosystem
      associated with the original client.
    - >
      Samba's `smbclient`, the long-established command-line SMB client with which the
      project shares a problem domain.
  sources:
    - https://github.com/TheManticoreProject/smbclient-ng
    - https://github.com/p0dalirius/smbclient-ng
    - https://github.com/p0dalirius/smbclient-ng/tree/main/documentation
    - source_facts.package-manager
  summary:
    - >
      smbclient-ng is an interactive command-line client for browsing, inspecting,
      transferring, and managing files on SMB shares.
  timeline:
    - >
      Python implementation: The p0dalirius project established the interactive
      smbclient-ng command set.
    - >
      Go rewrite: The original repository began directing users to the faster,
      cross-platform TheManticoreProject implementation.
  usage:
    - >
      Connect by supplying a target host and authentication options, then use shell-like
      commands such as `shares`, `use`, `ls`, `get`, `put`, `mkdir`, and `rm`.
    - >
      Authentication can be provided interactively or through command-line password,
      NTLM hash, AES-key, or Kerberos options. The official documentation does not
      define a dedicated credentials file.
    - >
      For automation, pass individual commands or a startup script and select
      non-interactive operation. No fixed configuration-file path is documented.
