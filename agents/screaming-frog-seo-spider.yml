history:
  adoption-history:
    - >
      Screaming Frog says the initial public release received an immediate response from
      the SEO community and passed 100,000 downloads through word of mouth. It
      subsequently became a familiar desktop tool for technical-SEO audits.
  package-nerd-significance:
    - >
      SEO Spider packages a specialized web crawler and a large collection of
      technical-SEO checks into a desktop application. For package-manager users, the
      cask is a convenient way to install and update a tool otherwise distributed
      directly by its vendor.
  project-history:
    - >
      Screaming Frog began developing SEO Spider in 2010 as a crawler for experienced
      SEO practitioners to collect site data, identify technical problems, and support
      onsite recommendations. The company released it publicly that year in free 'lite'
      and paid editions.
  related-projects:
    - >
      Screaming Frog Log File Analyser is a separate vendor product for analysing
      search-bot and other server-log traffic.
  sources:
    - 'Official company history: https://www.screamingfrog.co.uk/our-story/'
    - 'Official product page: https://www.screamingfrog.co.uk/seo-spider/'
    - 'Official user guide: https://www.screamingfrog.co.uk/seo-spider/user-guide/'
    - 'Package-manager availability: source_facts.package-manager.brew-cask'
  summary:
    - >
      Screaming Frog SEO Spider is a proprietary cross-platform desktop crawler for
      technical website auditing. It is developed by the UK search-marketing company
      Screaming Frog and is offered in limited free and licensed editions.
  timeline:
    - '2010: Screaming Frog begins developing SEO Spider.'
    - '2010: SEO Spider is publicly released in free and paid editions.'
    - '2010: The initial release passes 100,000 downloads, according to the company.'
  usage:
    - >
      Users enter a website or a supplied URL list, crawl it, and inspect or export
      findings such as broken links, redirects, metadata, directives, duplicate content,
      structured data, and crawl-depth information. Licensed workflows can save crawl
      files and configuration profiles, schedule crawls, and connect external analytics
      or SEO services.
