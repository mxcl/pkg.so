    - https://formulae.brew.sh/formula/llama.cpp
    - https://github.com/ggml-org/ggml
    - https://github.com/ggml-org/llama.cpp
    - https://github.com/ggml-org/llama.cpp/discussions/205
    - https://github.com/ggml-org/llama.cpp/issues/9289
    - https://github.com/ggml-org/llama.cpp/issues/9291
    - https://github.com/ggml-org/llama.cpp/pull/12898
    - https://github.com/ggml-org/llama.cpp/releases
    - https://raw.githubusercontent.com/ggml-org/llama.cpp/master/README.md
  summary:
    - >
      llama.cpp is one of the defining packages of the local-LLM era: a C/C++ inference
      stack that made it practical to run quantized transformer models on laptops,
      desktops, servers, and small devices without a heavyweight Python runtime.
  timeline:
    - '2023: ggml-org/llama.cpp repository created on March 10.'
    - >
      2023: The project manifesto discussion documented goals and direction for the
      early community.
    - >
      2024: llama.cpp issue trackers began maintaining separate API changelogs for
      libllama and llama-server.
    - >
      2025: Multimodal support reached llama-server through the upstream pull request
      and documentation referenced from the README.
    - >
      2026: Homebrew, Nix, winget, conda-forge, Docker, and release binaries were
      documented installation paths in the upstream README.
  usage:
    - >
      Users run llama-cli for local prompts, llama-server for an OpenAI-compatible HTTP
      API, llama-bench for performance testing, llama-quantize for smaller model files,
      and many auxiliary tools for embeddings, perplexity, retrieval, tokenization, and
      model-file manipulation.
    - >
      The package is especially useful when a developer wants a self-contained inference
      engine: compile once, point it at a model, and choose a CPU/GPU backend without
      adopting a full ML framework stack.
related-packages:
  - id: brew:ollama
    reason: >
      Choose Ollama for higher-level named-model management and a persistent local
      service; choose llama.cpp for direct GGUF conversion and quantization, granular
      backend control, and the full native utility suite.
    rel: alternative
    sources:
      - https://docs.ollama.com/
      - https://github.com/ollama/ollama
      - https://github.com/ggml-org/llama.cpp#readme
  - id: brew:localai
    reason: >
      Choose LocalAI when you need a broader OpenAI-compatible local service that can
      orchestrate multiple inference backends; choose llama.cpp for the upstream native
      GGUF runtime and its specialized model tools.
    rel: alternative
    sources:
      - https://localai.io/
      - https://github.com/mudler/LocalAI
      - https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md
