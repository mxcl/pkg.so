history:
  adoption-history:
    - >
      4K Download describes its applications as cross-platform products used by a large
      consumer audience. The product's permanent free tier and availability on macOS,
      Windows, and Linux lower the barrier to adoption, while paid features address
      larger download workloads and protected content.
    - >
      The Plus generation added richer download management, including content-type tabs,
      search, sorting, and JSON-based import and export. These features target users
      maintaining substantial offline media collections.
  package-nerd-significance:
    - >
      The application represents the proprietary desktop-binary side of package
      management: Homebrew Cask supplies installation metadata and lifecycle convenience
      while the executable is built and distributed by the vendor.
    - >
      Its frequent need to track changes made by video platforms makes timely vendor
      updates operationally important. The documented legacy and current macOS
      preference files also illustrate state carried across product generations.
  project-history:
    - >
      4K Video Downloader began as the flagship product of the 4K Download multimedia
      suite. The company's official history describes more than a decade of multimedia
      application development and subsequent expansion across platforms and related
      download products.
    - >
      4K Video Downloader+ is the newer product generation. Official material
      distinguishes it from its predecessor through revised download management, a
      built-in browser, Smart Mode, and consolidated JSON import and export.
  related-projects:
    - 4K YouTube to MP3 focuses on extracting and organizing audio.
    - >
      Other official 4K Download products cover TikTok media, Instagram content, image
      compression, and related media-management tasks.
  sources:
    - https://www.4kdownload.com/about/1
    - >
      https://www.4kdownload.com/blog/2024/05/17/all-about-downloads-management-in-4k-video-downloader-plus/
    - https://www.4kdownload.com/faq/faq-use-the-in-app-browser
    - https://www.4kdownload.com/faq/faq-what-are-smart-mode-and-manual-mode
    - https://www.4kdownload.com/products/videodownloader
  summary:
    - >
      4K Video Downloader+ is 4K Download's cross-platform desktop application for
      saving video, audio, playlists, channels, and subtitles from supported online
      services.
  timeline:
    - >
      2010s: The original 4K Video Downloader launches and later expands to all major
      desktop operating systems.
    - '2020s: 4K Video Downloader+ succeeds the original application generation.'
    - >
      2024: Official guidance documents Plus-specific JSON export and expanded download
      management.
  usage:
    - >
      Users paste media URLs or browse within the application, then select formats,
      quality, subtitles, audio tracks, and destinations. Smart Mode applies a reusable
      preference set to later downloads.
    - >
      The application can organize downloads by content type, search and sort its local
      history, subscribe to supported channels, and access authorized private media
      through its built-in browser. Users remain responsible for applicable content
      rights and service rules.
