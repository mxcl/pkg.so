id: brew:mandown
display-name: mandown
repo: null
docs:
  - https://github.com/Titor8115/mandown#readme
config-file-location:
  unix:
    - ~/.config/mdn/mdnrc
credentials-file-location: null
history:
  adoption-history:
    - >
      mandown's adoption is niche but visible: the README documents Homebrew
      installation, and package-manager metadata shows availability in Homebrew and
      several Linux-oriented package collections. The GitHub repository has a few
      hundred stars, consistent with a small terminal utility rather than core system
      infrastructure.
    - >
      Its appeal is strongest among users who like the `man` reading model and want
      Markdown to feel like local terminal documentation rather than a browser format.
  package-nerd-significance:
    - >
      mandown is package-nerd interesting because it occupies a tiny terminal niche:
      render Markdown like a manual page without pulling in a browser, Electron app, or
      large documentation stack.
    - >
      For packagers, the important details are the executable rename to `mdn`, the
      ncurses/libxml2/libconfig dependencies, and the user config path under XDG-style
      config.
  project-history:
    - >
      The public GitHub tag history shows early 0.x releases in May 2020, a 1.0.0 tag in
      June 2020, a 1.0.4 tag in October 2021, and renewed 1.0.5.x maintenance tags in
      2025. The README notes a name change in which the executable became `mdn`.
    - >
      Development has focused on a small C terminal application with ncurses, libxml2,
      and libconfig dependencies, plus a static/shared library embedding interface for
      applications that want to render Markdown.
  related-projects:
    - mandown overlaps with terminal pagers, Markdown renderers, and man-page-style viewers.
    - >
      Its package-manager neighbors include tools such as `glow`, `mdless`, `less`, and
      traditional `man`, though mandown's official sources describe it specifically as a
      C, man-page-inspired Markdown viewer.
  sources:
    - https://github.com/Titor8115/mandown
    - https://github.com/Titor8115/mandown/releases
    - https://github.com/Titor8115/mandown/tags
    - source_facts.package-manager
  summary:
    - >
      mandown is a man-page-inspired Markdown pager written in C. Its installed command
      is `mdn`, and the README positions it as a terminal viewer for README files,
      manual-like Markdown, and local Markdown documents.
  timeline:
    - '2020: Early 0.2 and 0.3 tags were published in May.'
    - '2020: v1.0.0 was tagged in June.'
    - '2021: v1.0.4 was tagged with a DEBUG-section fix.'
    - >
      2025: v1.0.5.x tags updated README/dependencies and fixed Fedora/libxml2 and
      return-code issues.
  usage:
    - >
      The normal usage is `mdn sample.md` or `mdn <file>`, with keyboard controls
      inspired by pagers such as `less` and `vim`: movement with arrows or `j`/`k`, page
      movement with space/backspace or page keys, hyperlink inspection, mouse scrolling,
      and `q` to exit.
    - >
      The README documents a user customization file at `~/.config/mdn/mdnrc` and
      control schemes including mdn, vim, and less, with less being the default at the
      time described.
related-packages:
  - id: brew:glow
    reason: >
      Choose Glow when you want a polished TUI that discovers local Markdown and can
      also fetch Markdown from GitHub, GitLab, or HTTP, rather than mandown's compact
      man-page-style reader.
    rel: alternative
    sources:
      - https://github.com/Titor8115/mandown
      - https://github.com/charmbracelet/glow
  - id: brew:mdless
    reason: >
      Choose mdless when you need a pager-oriented Markdown viewer with tables, syntax
      highlighting, inline-image support, themes, or TaskPaper handling.
    rel: alternative
    sources:
      - https://github.com/Titor8115/mandown
      - https://github.com/ttscoff/mdless
