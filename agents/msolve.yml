history:
  project-history:
    - >
      The project website summarizes the implementation goals: plain C, exact
      polynomial-system solving, algebraic encodings of solutions, advanced
      Gröbner-basis algorithms such as F4 and change of orderings, and performance work
      through multithreading and vectorization. The LIP6 PolSys software page adds that
      it supports Gröbner-basis computations, rational parametrization, real-root
      isolation, signature-based algorithms, and modern change-of-order algorithms.
  sources:
    - https://arxiv.org/pdf/2104.03572
    - https://doc.sagemath.org/html/en/reference/spkg/msolve.html
    - https://formulae.brew.sh/formula/msolve
    - https://github.com/algebraic-solving/msolve
    - https://msolve.lip6.fr/
    - https://polsys.team.lip6.fr/software/software.html
  summary:
    - >
      msolve is an open-source C library and command-line tool for solving multivariate
      polynomial systems through exact computer-algebra methods. The 2021 ISSAC paper by
      Jérémy Berthomieu, Christian Eder, and Mohab Safey El Din presents it as a library
      for zero-dimensional polynomial systems, built around Gröbner bases, linear
      algebra, conversion to lexicographical order, and real solving of univariate
      polynomials.
  usage:
    - >
      msolve's ecosystem role is as a high-performance engine underneath larger
      computer-algebra systems. The project README documents use from SageMath's
      `Variety` function for polynomial systems with real coefficients and an msolve
      package for Macaulay2; the LIP6 page also lists interfaces from Oscar, SageMath,
      and Macaulay2. In package managers it is therefore both a research library and a
      CLI for users who want direct polynomial-system solving without invoking a full
      CAS.
