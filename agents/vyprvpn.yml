history:
  adoption-history:
    - >
      VyprVPN expanded from a personal desktop VPN to mobile applications in 2012, a
      native Mac application and business service in 2013, and a wider range of
      protocols and privacy features.
    - >
      The company says Reddit selected VyprVPN for Business in 2014. In 2018, VyprVPN
      changed to a publicly audited no-log service.
  package-nerd-significance:
    - >
      VyprVPN is part of the generation of consumer VPN services that wrapped OpenVPN
      and later WireGuard-era protocol choices in approachable cross-platform clients.
      Its proprietary Chameleon protocol is historically notable as a response to
      deep-packet-inspection-based VPN blocking.
  project-history:
    - >
      Golden Frog was established in December 2009 and launched a VyprVPN beta in
      response to its founders’ concerns about surveillance and an open Internet. The
      personal VPN service launched in July 2010.
    - >
      The product later added mobile and desktop clients, business service, NAT
      Firewall, VyprDNS, a kill switch, and the Chameleon obfuscation protocol. A
      redesigned 3.0 client arrived in 2019 with a more consistent cross-platform
      interface.
  related-projects:
    - Golden Frog also developed Dump Truck secure storage and Cyphr encrypted messaging.
    - >
      VyprVPN’s protocol lineup has included OpenVPN and its derived Chameleon
      obfuscation technology.
  sources:
    - https://www.vyprvpn.com/blog/post/how-far-vyprvpn-has-come
    - https://www.vyprvpn.com/blog/post/no-log-vpn-service
    - https://www.vyprvpn.com/blog/post/today-golden-frog-celebrates-five-years
    - https://www.vyprvpn.com/our-commitment
  summary:
    - >
      VyprVPN is a commercial personal VPN service and cross-platform client originally
      developed by Golden Frog to provide encrypted Internet access and resist
      surveillance and censorship.
  timeline:
    - '2009: Golden Frog was established and VyprVPN entered beta.'
    - '2010: VyprVPN’s personal VPN service launched.'
    - '2012: Android and iOS applications were released.'
    - '2013: The Mac client and VyprVPN for Business launched.'
    - '2014: Chameleon, VyprDNS, and a desktop kill switch were introduced.'
    - '2018: VyprVPN announced its transition to a publicly audited no-log service.'
    - '2019: VyprVPN 3.0 introduced a redesigned, more consistent client.'
  usage:
    - >
      Users sign in to the client, select a server location and VPN protocol, and
      establish an encrypted network tunnel. The applications expose features such as
      automatic connection behavior, kill switch, DNS selection, protocol choice, and
      per-app connection rules where supported.
