credentials-file-location: null
history:
  adoption-history:
    - >
      Sonic Pi began as a Cambridge University Computer Laboratory research project
      developed with the Raspberry Pi organization. Its classroom-oriented design
      subsequently grew into an independent, community-supported project used for
      education, composition, and professional live performance.
    - >
      The official project highlights use in schools, festivals, a Royal Albert Hall
      production involving 1,000 young musicians, Codebus Africa workshops for nearly
      2,000 children, and a student composition played aboard the International Space
      Station.
  package-nerd-significance:
    - >
      Sonic Pi is a prominent bridge between programming education and laptop music. It
      bundles a purpose-built Ruby-like live-coding language, synthesis and sampling
      engines, an editor, and extensive tutorial material into an approachable
      workstation.
    - >
      Its Raspberry Pi origins, cross-platform packaging, networked OSC and MIDI
      support, Ableton Link integration, and unusually large open-source contributor
      community make it relevant to educators, electronic musicians, creative coders,
      and small-computer enthusiasts.
  project-history:
    - >
      Sam Aaron created Sonic Pi, with early educational design work carried out with
      teachers and Raspberry Pi collaborators. The project has been in open-source
      development since 2012.
    - >
      It was conceived in response to changes in the United Kingdom computing curriculum
      and refined through classroom trials. Over time, it expanded from a teaching
      environment into a performance-ready live-coding instrument while retaining its
      educational focus.
  related-projects:
    - Raspberry Pi
    - SuperCollider
    - Ruby
    - Ableton Link
  sources:
    - https://github.com/sonic-pi-net/sonic-pi
    - >
      https://github.com/sonic-pi-net/sonic-pi/blob/dev/etc/doc/tutorial/01-Welcome-to-Sonic-Pi.md
    - https://sonic-pi.net/
    - https://sonic-pi.net/tutorial-a.html
  summary:
    - >
      Sonic Pi is a free, open-source environment for composing and performing music by
      writing code. It is designed to be accessible in classrooms while remaining
      capable enough for live electronic performance.
  timeline:
    - >
      2012: Open-source development began as a Cambridge research project created with
      Raspberry Pi collaborators.
    - >
      2014: Sonic Pi's educational direction responded to the United Kingdom's new
      computing curriculum.
    - >
      2016: Sam Aaron performed with Sonic Pi at Moogfest, helping establish it as a
      live-performance instrument.
    - >
      2017: Codebus Africa used Sonic Pi in creative-coding workshops across ten African
      countries.
  usage:
    - >
      Users write short programs containing notes, samples, synths, effects, loops, and
      timing instructions, then alter the code while it plays. The environment is used
      for self-guided learning, computing and music lessons, algorithmic composition,
      and synchronized stage performance.
