id: brew:git-ignore
display-name: git-ignore
repo: null
docs:
  - https://github.com/sondr3/git-ignore#readme
config-file-location:
  unix:
    - ~/.config/git-ignore/config.toml
    - ~/.config/git-ignore/templates/
credentials-file-location: null
history:
  adoption-history:
    - >
      git-ignore serves a small but recognizable developer workflow: generating ignore
      files at project creation time. Its README lists distribution through Cargo,
      Homebrew, Nix, and Arch packaging, which reflects modest cross-platform adoption
      among command-line users who prefer templates over hand-written `.gitignore`
      files.
  package-nerd-significance:
    - >
      The package is useful catalog glue around two ecosystems: Git's subcommand
      convention and the community `.gitignore` template catalog. The Rust crate name
      `git-ignore-generator` and the Homebrew formula `git-ignore` also show the naming
      compromises needed for command-oriented packages.
  project-history:
    - >
      The project was created on GitHub in November 2018. Its README explains the origin
      plainly: the author was tired of visiting gitignore.io for templates and automated
      the task, adding offline caching, aliases, custom templates, and automatic project
      matching.
  related-projects:
    - >
      git-ignore is closely related to gitignore.io and to the template collections that
      feed generated `.gitignore` files. It also parallels simpler web and shell
      workflows that fetch templates on demand.
  sources:
    - https://api.github.com/repos/sondr3/git-ignore/releases
    - https://github.com/sondr3/git-ignore
    - https://raw.githubusercontent.com/sondr3/git-ignore/master/README.md
  summary:
    - >
      git-ignore is a Rust command-line helper for listing, fetching, and generating
      `.gitignore` templates. It wraps the gitignore.io template workflow in a local
      `git ignore` command.
  timeline:
    - '2018: GitHub repository created.'
    - '2022: Release v1.2.2 published.'
    - '2024: v1.3.x and v1.4.0 releases published.'
  usage:
    - >
      Practitioners run `git ignore --update` to cache templates, `git ignore --list` to
      browse or search them, `git ignore rust node` to print templates, and `git ignore
      --write` to write output to the working directory. The `init` command creates a
      TOML config file and a templates directory for aliases and custom ignore
      templates.
