history:
  adoption-history:
    - >
      Objective-See distributes ProcessMonitor as a notarized application bundle, but
      users invoke its executable from Terminal. Its line-oriented JSON output makes it
      useful in shell pipelines, log collectors, incident-response tooling, and
      malware-analysis labs.
  package-nerd-significance:
    - >
      ProcessMonitor provides a compact command-line view of Apple's Endpoint Security
      event stream, including ancestry, arguments, environment information,
      architecture, and code-signing metadata. It exposes security telemetry in
      machine-readable JSON without requiring a larger endpoint product.
    - >
      The application-bundle packaging is operationally significant: the executable must
      remain inside its signed bundle, requires Full Disk Access, and must run as root.
  project-history:
    - >
      Patrick Wardle introduced the Endpoint Security-based process-monitoring
      implementation in a September 2019 Objective-See technical article accompanying
      the source and application.
    - >
      The implementation became an Objective-See utility and reusable open-source
      library for observing process execution, fork, and exit events on macOS Catalina
      and later.
  related-projects:
    - Apple Endpoint Security provides the underlying event framework.
    - Objective-See's ProcInfo library supplies related process and code-signing information.
    - >
      Objective-See's FileMonitor applies a similar command-line and JSON-oriented
      approach to filesystem activity.
  sources:
    - https://github.com/objective-see/ProcessMonitor
    - https://objective-see.org/blog/blog_0x47.html
    - https://objective-see.org/products/utilities.html
  summary:
    - >
      ProcessMonitor is an Objective-See command-line macOS security utility that emits
      detailed system-wide process events as JSON.
  timeline:
    - '2019: Patrick Wardle published the Endpoint Security process-monitor design and source.'
    - >
      2020: Objective-See's documented examples showed the packaged CLI workflow on
      macOS Catalina-era systems.
  usage:
    - >
      Grant Terminal Full Disk Access, keep `ProcessMonitor.app` intact, and run
      `ProcessMonitor.app/Contents/MacOS/ProcessMonitor` with root privileges.
    - >
      Options can pretty-print JSON, suppress Apple platform processes, or filter events
      by process name. Output is written as JSON records suitable for inspection or
      downstream processing.
