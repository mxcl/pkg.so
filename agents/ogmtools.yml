history:
  adoption-history:
    - >
      The supplied package metadata records OGMtools in Homebrew, Debian, Fedora/dnf,
      MacPorts, Nix, Arch/pacman, Ubuntu, and zypper, showing a long-lived compatibility
      niche for old OGM media workflows.
  package-nerd-significance:
    - >
      OGMtools is useful package-history material because it preserves a transitional
      command-line media-container workflow between raw AVI/DVD ripping and later
      container formats.
  project-history:
    - >
      The official OGMtools page describes the tools as providing information about,
      extraction from, and creation of OGG media streams, with OGM used as shorthand for
      OGG media streams. The README for OGMtools 1.5 says the base code was taken from
      the Ogg/Vorbis CVS repository at Xiph.Org.
    - >
      The project belongs to the early-2000s Linux video-tooling era around Ogg Vorbis
      audio, mencoder, mplayer, subtitle streams, and Ogg-based multimedia containers.
  related-projects:
    - >
      Related projects and tools include Ogg/Vorbis, mencoder, mplayer, oggenc, and
      Bunkus's later Matroska tooling.
  sources:
    - https://www.bunkus.org/videotools/ogmtools/
    - https://www.bunkus.org/videotools/ogmtools/ChangeLog
    - https://www.bunkus.org/videotools/ogmtools/README
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      OGMtools is Moritz Bunkus's command-line suite for OGG media streams, including
      tools to inspect, extract from, split, concatenate, and create OGM files.
  timeline:
    - >
      2002-10-01: the official ChangeLog has an entry for v0.951, showing public
      releases by this date.
    - '2003-03-01: v1.0.0 was released.'
    - '2004-11-07: v1.5 was released.'
  usage:
    - >
      The suite includes ogminfo for stream information, ogmdemux for extracting
      component streams, ogmsplit for splitting files, ogmcat for concatenation, and
      ogmmerge for joining media streams into an OGM file.
    - >
      The official README gives a DVD-ripping workflow using mencoder and mplayer to
      prepare streams, oggenc to encode audio, and ogmmerge to produce an OGM file.
