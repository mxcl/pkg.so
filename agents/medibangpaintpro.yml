history:
  adoption-history:
    - >
      MediBang reported rapid international adoption after expanding the software across
      desktop and mobile platforms. The company reported 50 million downloads in
      November 2020, 60 million in 2021, and 67 million downloads with 22 million
      registered users by the seventh anniversary.
    - >
      The official anniversary material stated that 86 percent of users were outside
      Japan and that the application was available in 17 languages, reflecting an
      unusually international audience for a Japanese illustration package.
  package-nerd-significance:
    - >
      MediBang Paint Pro is notable as a free, cross-platform digital-art package whose
      native MDP format, cloud synchronization, collaborative projects, manga materials,
      fonts, and mobile companions form a broader creative ecosystem. For package users,
      it provides a lighter-weight alternative to large commercial illustration suites
      while retaining manga-specific production features.
  project-history:
    - >
      The project began in Tokyo in 2014. Its desktop software first appeared as
      CloudAlpaca in November 2014 and was renamed MediBang Paint Pro in June 2015 as
      MediBang expanded the product across desktop and mobile platforms.
    - >
      MediBang combined illustration and manga tools with cloud storage, downloadable
      brushes and materials, collaborative group projects, and publishing through its
      online services. MediBang Premium was introduced in 2021 while the core creation
      features remained available without a subscription.
  related-projects:
    - >
      The broader product family includes MediBang Paint on iPad, iPhone, and Android,
      MediBang's cloud services, ART street, and MediBang Library. CloudAlpaca was the
      direct predecessor of the desktop application.
  sources:
    - >
      https://download.medibang.com/download/pdf/pr_20211217_Opening_MediBangPaint7thAnniversary_Campaign_EN.pdf
    - https://medibangpaint.com/en/9-years-of-medibang-paint/
    - https://medibangpaint.com/en/news/2015/06/mbp_release/
    - https://medibangpaint.com/en/pc/releasenote/
  summary:
    - >
      MediBang Paint Pro is the desktop edition of MediBang's illustration and
      manga-creation software. It combines raster drawing, comic-production tools, cloud
      projects, materials, fonts, and cross-device workflows.
  timeline:
    - "2014-11: CloudAlpaca, the desktop project's predecessor, was released."
    - '2015-06: The desktop software was renamed MediBang Paint Pro.'
    - '2020-11: MediBang reported 50 million downloads across the product series.'
    - '2021: MediBang Premium and MediBang Library expanded the surrounding service ecosystem.'
    - '2021-11: The product marked seven years and 67 million downloads.'
  usage:
    - >
      Artists use MediBang Paint Pro for illustration, comics, and manga, organizing
      artwork into layers and using brushes, guides, panels, tones, and manuscript
      templates. Work can be stored locally in the native MDP format or synchronized
      through MediBang's cloud features.
    - >
      An account is recommended for cloud storage, additional fonts and materials, group
      projects, settings synchronization, and publishing, but the official introductory
      tutorial says basic desktop use does not require an account.
