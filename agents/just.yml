credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through package managers, prebuilt
      binaries, and Cargo. The input package metadata shows broad packaging across
      Alpine, Homebrew, Chocolatey, Debian, Fedora, MacPorts, Nix, Arch, Scoop, Ubuntu,
      winget, and openSUSE-family packages.
    - >
      Adoption has been helped by `just` being a single Rust-built CLI with no runtime
      dependency on a language-specific project stack. It fits repositories that want a
      shared entry point for testing, linting, formatting, release tasks, Docker
      commands, or local development setup.
  package-nerd-significance:
    - >
      just is significant because it became the package-manager-friendly version of a
      tiny team convention. A single binary plus a plain text `justfile` gives projects
      a predictable command surface without requiring contributors to learn an entire
      build system.
    - >
      For package nerds, it is also interesting as a Rust CLI that is packaged almost
      everywhere and competes with decades of Make muscle memory by being intentionally
      less powerful in the build-system sense.
  project-history:
    - >
      Casey Rodarmor created the `just` repository on 2016-06-17. The project grew from
      a practical frustration with using `make` for non-build automation: developers
      wanted named commands, arguments, helpful errors, directory search, completions,
      and readable syntax without Make's build-system semantics.
    - >
      The official manual frames `just` as a command runner, not a build system. Recipes
      live in a file named `justfile`, `Justfile`, `.justfile`, or one of the documented
      fallback locations, and users invoke them as `just RECIPE`.
    - >
      Version 1.0.0 was published on GitHub on 2022-02-22. By 2026-07-01, the repository
      metadata showed more than 34,000 GitHub stars and regular release activity,
      indicating that `just` had moved well beyond a niche Rust utility.
  related-projects:
    - >
      GNU Make is the historical comparison point and the tool whose command-runner
      misuse just often replaces.
    - Taskfile and npm scripts are adjacent ways to publish project commands.
    - just-lsp provides Language Server Protocol support for editing justfiles.
    - Cargo is the Rust package manager used to install just from source or crates.io.
  sources:
    - https://api.github.com/repos/casey/just
    - https://api.github.com/repos/casey/just/releases
    - https://github.com/casey/just
    - https://github.com/casey/just/releases/tag/1.0.0
    - https://just.systems/man/en/
    - https://raw.githubusercontent.com/casey/just/master/README.md
  summary:
    - >
      just is a cross-platform command runner for saving project-specific commands in a
      `justfile`. It borrows the familiar recipe shape of Makefiles but deliberately
      avoids being a timestamp-based build system.
  timeline:
    - '2016-06-17: The just GitHub repository is created.'
    - '2022-02-22: just 1.0.0 is published on GitHub.'
    - '2022-02-28: just 1.0.1 is published on GitHub with prebuilt release artifacts.'
    - '2026-06-30: just 1.55.1 is published on GitHub.'
  usage:
    - >
      A repository usually stores recipes in `justfile`; running `just` lists available
      recipes, and running `just name args...` executes one recipe. The manual documents
      shell selection, dotenv loading, parameters, aliases, imports, modules,
      completions, and recipes written in arbitrary languages.
    - >
      The key usage boundary is that `just` does not replace Make for dependency-aware
      incremental builds. It replaces the common pattern of using Makefiles or ad hoc
      scripts as a menu of project commands.
related-packages:
  - id: brew:go-task
    reason: >
      Choose Task when YAML configuration and source-based up-to-date checks are
      preferable; choose just for its concise Make-inspired command-runner language.
    rel: alternative
    sources:
      - https://just.systems/man/en/alternatives-and-prior-art.html
      - https://taskfile.dev/
  - id: brew:make
    reason: >
      Choose GNU Make when dependency-aware incremental builds are required; just
      explicitly targets project command execution instead of functioning as a build
      system.
    rel: alternative
    sources:
      - https://just.systems/man/en/
      - https://www.gnu.org/software/make/manual/
  - id: brew:just-lsp
    reason: >
      Install just-lsp alongside just to add justfile completion, diagnostics,
      navigation, refactoring, and editor-driven recipe execution.
    rel: adjacent_workflow
    sources:
      - https://github.com/terror/just-lsp
      - https://just.systems/man/en/
