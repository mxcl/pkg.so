history:
  adoption-history:
    - >
      Langdock is positioned for organizational AI adoption through centrally managed
      workspaces, model access, integrations, agents, and workflows. The desktop
      application brings existing workspace chats, agents, and workflows into a native
      macOS or Windows surface.
    - >
      The official product materials emphasize enterprise tool integration and EU-hosted
      model options, reflecting adoption requirements such as centralized
      administration, data controls, and access to multiple model providers.
  package-nerd-significance:
    - >
      Langdock illustrates the shift from installing a single-model chat client to
      packaging an enterprise AI workspace that fronts multiple models, agents,
      knowledge sources, integrations, and automations.
    - >
      For desktop package users, the application is primarily a native entry point to a
      managed service: accounts and workspace policy remain central, while the desktop
      package supplies dock or taskbar access, tabs, and keyboard shortcuts.
  project-history:
    - >
      Langdock developed as an enterprise AI platform spanning chat, agents, model APIs,
      integrations, workflows, reusable skills, and organizational knowledge. Its
      documentation presents these capabilities as coordinated areas of one workspace
      rather than independent developer tools.
    - >
      The native desktop application extended the web platform to macOS and Windows
      while retaining access to a user's existing Langdock workspace content.
  related-projects:
    - >
      Langdock integrates third-party workplace and developer services through its
      integration platform and MCP support.
    - >
      The platform provides access to models from multiple AI vendors rather than
      representing a single foundation-model family.
  sources:
    - 'Official desktop product page: https://langdock.com/products/desktop'
    - 'Official integrations page: https://langdock.com/products/integrations'
    - 'Official product changelog: https://langdock.com/changelog'
    - 'Official product documentation: https://docs.langdock.com/'
  summary:
    - >
      Langdock is a managed enterprise AI platform offering multi-model chat, agents,
      workflows, integrations, reusable skills, organizational knowledge, and APIs. Its
      desktop application provides native macOS and Windows access to an existing
      Langdock workspace.
  timeline:
    - >
      2026-09-07: Langdock announced general availability of its desktop application for
      macOS and Windows.
  usage:
    - >
      Users sign in with a Langdock account to access workspace chats, agents,
      workflows, knowledge, integrations, and enabled AI models. The desktop application
      supports multiple concurrent tabs and keyboard shortcuts without a separate local
      setup flow.
    - >
      Workspace administrators control model and feature availability, while users build
      chats, agents, integration-backed workflows, and reusable skills within the
      managed platform.
