history:
  adoption-history:
    - >
      The product is offered across Windows, macOS, and Linux and supports SQL Server
      deployments hosted by major cloud vendors. Official release notes show native
      Linux support arriving in the Navicat 15 generation.
  package-nerd-significance:
    - >
      Its Homebrew cask gives macOS users a package-managed route to a proprietary SQL
      Server GUI, complementing Microsoft's and the open-source ecosystem's database
      tools.
  project-history:
    - >
      Navicat for SQL Server is the SQL Server-focused member of PremiumSoft's Navicat
      database-client family. It shares Navicat's graphical administration, query,
      modeling, transfer, synchronization, and automation framework.
  related-projects:
    - Navicat Premium
    - Navicat for PostgreSQL
    - Microsoft SQL Server
    - Azure SQL Database
  sources:
    - https://www.navicat.com/en/products/navicat-for-sqlserver
    - https://www.navicat.com/en/products/navicat-for-sqlserver-release-note
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Navicat for SQL Server is PremiumSoft's proprietary graphical administration and
      development client for Microsoft SQL Server and compatible hosted services.
  timeline:
    - '2019: Navicat 15 introduced native Linux support for the SQL Server edition.'
    - '2025: Version 17.3 added additional authentication and AI-assisted query features.'
    - '2026: Maintenance of the 17.3 line continued on supported desktop platforms.'
  usage:
    - >
      It is used to create and edit SQL Server objects, run and analyze queries, model
      databases, transfer and synchronize data, generate test data, administer backups,
      and automate recurring jobs.
