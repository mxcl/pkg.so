history:
  adoption-history:
    - >
      ShurePlus MOTIV Desktop accompanied Shure's MOTIV microphones and interfaces,
      including devices used for podcasting, streaming, music recording, conferencing,
      and mobile content production. Its role was tied to ownership of compatible Shure
      hardware rather than use as a general-purpose audio editor.
    - >
      Shure subsequently redirected the former product page to MOTIV Mix, its expanded
      desktop application for recording, mixing, streaming, and controlling supported
      MOTIV hardware.
  package-nerd-significance:
    - >
      ShurePlus MOTIV is representative of vendor-supplied hardware companion software:
      generic operating-system audio controls expose the device, while the vendor
      application provides access to gain, monitoring, equalization, compression,
      limiting, presets, and firmware-related features.
    - >
      The transition to MOTIV Mix also matters to package maintainers because the
      established ShurePlus MOTIV package identity outlived the branding and scope of
      the vendor's current desktop application.
  project-history:
    - >
      Shure developed ShurePlus MOTIV Desktop as the desktop control application for
      compatible MOTIV-series microphones and audio interfaces. Shure's official archive
      records the 1.0.x line in 2020 and continued releases through version 1.5.4 in
      2024.
    - >
      The application allowed users to configure device-specific digital signal
      processing and monitoring behavior. Shure later replaced its primary product
      surface with MOTIV Mix, which broadened the workflow to multichannel recording,
      mixing, streaming, system-audio routing, and management of newer MOTIV devices.
  related-projects:
    - MOTIV Mix
    - ShurePlus MOTIV Audio
    - ShurePlus MOTIV Video
    - Shure Update Utility
  sources:
    - 'Official MOTIV Mix product page: https://www.shure.com/en-US/products/software/motiv-mix'
    - 'Official MOTIV Mix user guide: https://www.shure.com/en-US/docs/guide/MOTIV-Mix'
    - 'Official MOTIV user guides: https://www.shure.com/en-US/docs/guide/MOTIV'
    - >
      Official ShurePlus MOTIV Desktop archive:
      https://www.shure.com/en-US/support/downloads/software-firmware-archive/shure_plus_motiv_desktop
  summary:
    - >
      ShurePlus MOTIV is Shure's former desktop companion application for configuring
      compatible MOTIV microphones and audio interfaces; its current successor is MOTIV
      Mix.
  timeline:
    - "2020: Shure's archive records ShurePlus MOTIV Desktop 1.0.9."
    - '2021: The 1.1 and 1.2 release lines were published.'
    - '2022: Versions 1.3.0 and 1.3.1 were released.'
    - '2023: The 1.5 release line expanded through version 1.5.3.'
    - '2024: ShurePlus MOTIV Desktop 1.5.4 was released.'
    - "Later: Shure's former product URL was redirected to the successor MOTIV Mix application."
  usage:
    - >
      Users connect a supported Shure MOTIV microphone or interface and use the desktop
      application to adjust available gain, monitor mix, equalization, compression,
      limiter, tone, and preset controls.
    - >
      Device support and available controls vary by hardware model. The successor MOTIV
      Mix adds recording, streaming, multichannel mixing, and system-audio routing.
    - >
      Official Shure documentation does not identify a user-managed configuration file
      or credentials file.
