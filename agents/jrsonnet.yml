history:
  adoption-history:
    - >
      Adoption is niche and mostly package-manager driven: the README documents NixOS
      packaging, Homebrew packaging on macOS, release binaries for Windows and Linux,
      crates.io publication, and language bindings including Python and WebAssembly/JSR.
      Homebrew packages the 0.4.2 release from the GitHub tag archive.
  package-nerd-significance:
    - >
      jrsonnet matters to package-tooling people because Jsonnet is common in
      infrastructure configuration, and alternative implementations change the
      performance, embedding, and distribution story. A Rust Jsonnet implementation with
      crates.io, Nix, Homebrew, Python, and WebAssembly surfaces is exactly the sort of
      cross-ecosystem packaging knot that nerds notice.
  project-history:
    - >
      The public GitHub repository was created in May 2020 under CertainLach's project
      namespace and later appeared under the deltarocks organization while retaining
      redirects from the original URL. The README describes the project as an experiment
      in implementing Jsonnet in Rust, with additional syntax experiments and bindings
      beyond the CLI.
  related-projects:
    - >
      Related projects include Google's original Jsonnet implementation, go-jsonnet,
      sjsonnet, rsjsonnet, and rjsonnet-py, the Python bindings built on jrsonnet.
  sources:
    - https://api.github.com/repos/deltarocks/jrsonnet
    - https://crates.io/crates/jrsonnet
    - https://formulae.brew.sh/formula/jrsonnet
    - https://github.com/CertainLach/jrsonnet
    - https://github.com/deltarocks/jrsonnet
    - https://github.com/deltarocks/jrsonnet/releases
  summary:
    - >
      jrsonnet is a Rust implementation of Jsonnet, the data-templating language used to
      generate JSON and configuration data. It packages both a Jsonnet library and a
      command-line executable, positioning itself as an alternative to the original C++
      implementation and the Go and Scala implementations.
  timeline:
    - '2020: Public GitHub repository created for the Rust Jsonnet implementation.'
    - '2022: Pre-release builds in the v0.5.0 series began appearing on GitHub releases.'
    - '2026: Homebrew packaged jrsonnet 0.4.2 from the GitHub tag archive.'
  usage:
    - >
      Users reach for jrsonnet when they want a Rust-native Jsonnet evaluator, a
      drop-in-style libjsonnet shared library, or bindings that expose Jsonnet
      evaluation inside other Rust, Python, JavaScript, or C/C++ environments.
related-packages:
  - id: brew:go-jsonnet
    reason: >
      Choose go-jsonnet when you prefer Jsonnet's official, production-oriented Go
      implementation and its linter; choose jrsonnet for a Rust-native, embeddable
      implementation that advertises drop-in compatibility.
    rel: alternative
    sources:
      - https://delta.rocks/jrsonnet
      - https://jsonnet.org/learning/getting_started.html
      - https://github.com/google/go-jsonnet
  - id: brew:jsonnet-bundler
    reason: >
      Use jsonnet-bundler alongside jrsonnet to fetch and vendor reusable Jsonnet
      libraries, then expose its vendor tree through the interpreter's library search
      path.
    rel: adjacent_workflow
    sources:
      - https://github.com/jsonnet-bundler/jsonnet-bundler
      - https://delta.rocks/jrsonnet
