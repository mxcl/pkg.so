history:
  adoption-history:
    - >
      PremiumSoft reports more than 180,000 registered Navicat customers across 138
      countries. The MySQL edition is positioned for both MySQL and MariaDB
      administration, although edition-specific adoption figures are not published.
  package-nerd-significance:
    - >
      Navicat for MySQL is a long-running commercial counterpart to open-source MySQL
      clients. Its Homebrew cask is useful to developers and database administrators who
      want reproducible installation of the database-specific edition rather than
      Navicat Premium.
  project-history:
    - >
      Navicat is produced by PremiumSoft, founded in 1999. The MySQL edition became one
      of the family’s database-specific graphical administration clients and now
      supports MySQL, MariaDB, OceanBase, and managed MySQL services across several
      cloud providers.
  related-projects:
    - MySQL
    - MariaDB
    - Navicat for MariaDB
    - Navicat Premium
    - Navicat Data Modeler
