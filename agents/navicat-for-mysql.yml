    - source_facts.package-manager
  summary:
    - >
      Navicat for MySQL is PremiumSoft’s proprietary graphical database administration
      and development client for MySQL-compatible systems.
  timeline:
    - '1999: PremiumSoft, the developer of Navicat, was founded.'
    - '2008: Official company materials document Navicat for MySQL 8 updates.'
    - '2024: Navicat 17 became the current major product generation.'
  usage:
    - >
      Users manage connections and database objects, browse and edit data, build and
      execute queries, profile data, transfer or synchronize databases, model schemas,
      and secure remote access with SSH or SSL/TLS.
