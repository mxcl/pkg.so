credentials-file-location:
  macos:
    - >
      ~/Library/Containers/com.criminalbird.typeface.standalone/Data/Library/Application
      Support/license.typeface-license
history:
  adoption-history:
    - >
      Typeface is aimed at designers and other Mac users managing local font libraries.
      Its official release history shows growth from a focused font viewer into a full
      manager with tags, imported locations, activation, duplicate handling, detailed
      metadata, and design-application workflows.
  package-nerd-significance:
    - >
      Typeface links to fonts in their existing folders instead of copying them into a
      proprietary vault. The font files, Typeface's indexed metadata and settings,
      exported tag backups, and the standalone license file are therefore distinct
      assets with different backup and migration needs.
  project-history:
    - >
      Typeface 1.0 was released in December 2015 as a native macOS font browser
      emphasizing accurate previews, comparison, Unicode inspection, and a minimal
      interface. Early updates added Font Book collection integration, filters, and
      batch actions.
    - >
      Typeface 2, released in April 2018, expanded the application into a more capable
      font manager with nested tags, synced directories, a redesigned interface, and
      early automatic activation. Typeface 3 followed in April 2021, and subsequent
      releases continued to expand inspection, organization, activation, and
      font-pairing workflows.
  related-projects:
    - Typeface automatically imports fonts and collections from macOS Font Book.
    - >
      It can import libraries from FontExplorer X and Suitcase Fusion and can link to
      folders synchronized by services such as iCloud, Dropbox, Google Drive, or
      OneDrive.
  sources:
    - https://typefaceapp.com/
    - https://typefaceapp.com/changelog
    - https://typefaceapp.com/help/articles/font-library
    - https://typefaceapp.com/help/troubleshooting/uninstalling
    - https://typefaceapp.com/news/introducing-typeface-2
  summary:
    - >
      Typeface is a native macOS font manager for previewing, organizing, comparing,
      activating, and maintaining local font libraries.
  timeline:
    - 'December 2015: Typeface 1.0 is released.'
    - 'April 2018: Typeface 2 introduces extensive tagging and font-management features.'
    - 'April 2021: Typeface 3.0 is released.'
    - >
      2020s: Typeface continues adding deeper font inspection, activation, organization,
      and design workflows.
  usage:
    - >
      Typeface discovers Font Book fonts and user-selected folders, presents
      customizable previews, organizes fonts with tags and collections, and activates
      selected fonts in place for other applications. Imported font files remain in
      their original locations.
    - >
      The standalone edition stores settings, backups, logs, and other application data
      in `~/Library/Containers/com.criminalbird.typeface.standalone`. A purchased
      standalone license is stored as `license.typeface-license` inside that container;
      Mac App Store purchases instead use the user's Apple ID.
