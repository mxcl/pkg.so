history:
  adoption-history:
    - >
      Blocs has been maintained through at least six major generations. The vendor
      preserves downloads and knowledge bases for older generations, supporting
      continued access to legacy projects and workflows.
  package-nerd-significance:
    - >
      Blocs is notable in macOS package-manager culture as a commercial, GUI-first
      web-authoring application that can be installed alongside command-line
      web-development tools. Archived major releases matter to users maintaining older
      Blocs projects.
  project-history:
    - >
      Blocs began as a Mac visual website builder and evolved through multiple major
      versions. Official archives retain releases from Blocs 1 through Blocs 5, while
      the current knowledge base documents Blocs 6 workflows.
  related-projects:
    - Blocs projects produce websites using standard web technologies.
    - Homebrew Cask provides the macOS package-manager entry.
  sources:
    - https://help.blocsapp.com/article-categories/getting-started/
    - https://help.blocsapp.com/knowledge-base/download-old-versions-of-blocs/
    - source_facts.package-manager
  summary:
    - >
      Blocs is a visual website-design application for macOS aimed at building
      responsive sites without requiring a code-first workflow.
  timeline:
    - "Blocs 1–5: Official legacy releases are retained in the vendor's archive."
    - 'Blocs 6: The current knowledge base documents the sixth major generation.'
  usage:
    - >
      Users compose pages from visual sections and elements, manage assets and custom
      classes, preview the result, and export or publish the generated website.
