id: brew:http-server-rs
display-name: http-server
repo: null
docs:
  - https://github.com/http-server-rs/http-server#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is modest but visible in Rust packaging channels: crates.io metadata
      points to the official repository and documentation site, while the input metadata
      records Homebrew and Nix packaging. Its niche is the Rust-flavored version of the
      familiar local static-server package.
  package-nerd-significance:
    - >
      The package is notable as a Rust-native entry in the crowded 'serve this directory
      over HTTP' space. It matters less as a protocol invention and more as a packaging
      tradeoff: a compiled single-purpose CLI with static serving, TLS, proxy, and auth
      features.
  project-history:
    - >
      crates.io records the http-server crate beginning in December 2017, while the
      http-server-rs/http-server GitHub repository was created in October 2020. The
      repository's release instructions use semver-prefixed tags and show v0.1.0 as the
      example first release tag.
    - >
      The GitHub README says the main branch contains code for version 1.0.0, indicating
      the project has been moving from the earlier 0.x release series toward a larger
      stabilized line.
  related-projects:
    - >
      Related tools include Node's http-server package, Python's simple HTTP server
      module, Caddy, miniserve, and other local static-file servers. The project is also
      tied to crates.io and Rust CLI packaging.
  sources:
    - >
      Official GitHub README, official project site, crates.io metadata, and GitHub
      release metadata.
  summary:
    - >
      http-server-rs is a Rust command-line HTTP server for serving static files and
      proxying requests. The project site emphasizes a single-command workflow with
      static serving, configuration, HTTPS, authentication, proxying, and Rust
      performance.
  timeline:
    - '2017: The http-server crate appeared on crates.io.'
    - '2020: The http-server-rs/http-server repository was created on GitHub.'
    - '2020: A v0.0.9 GitHub release was published.'
    - '2021: A v0.1.0 GitHub release was published.'
    - '2024: The GitHub repository listed v0.8.9 among its releases.'
  usage:
    - >
      Users run the command to serve files from a directory, proxy requests to another
      server, use HTTPS, or protect access with authentication. The project site
      presents configuration files and command-line arguments as the two setup paths.
related-packages:
  - id: brew:miniserve
    reason: >
      Choose miniserve for the same quick file-serving task when you also want uploads,
      WebDAV, QR-code sharing, or serving a single file.
    rel: alternative
    sources:
      - https://github.com/http-server-rs/http-server#readme
      - https://github.com/svenstaro/miniserve#readme
  - id: brew:caddy
    reason: >
      Choose Caddy when the server should become a long-running site or reverse proxy
      with automatic HTTPS rather than a lightweight ad hoc development server.
    rel: alternative
    sources:
      - https://github.com/http-server-rs/http-server#readme
      - https://caddyserver.com/docs/
