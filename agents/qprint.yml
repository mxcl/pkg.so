history:
  adoption-history:
    - >
      qprint is packaged across Homebrew, Debian, Ubuntu, Arch, Nix, MacPorts, and
      openSUSE according to source_facts.package-manager, giving the small standalone
      utility unusually broad Unix-like package-manager coverage.
  package-nerd-significance:
    - >
      qprint represents the classic Unix-filter approach to an Internet mail encoding: a
      small public-domain executable, usable in pipelines, with no service, account, or
      dependency-heavy runtime. Its cross-distribution availability makes it useful when
      scripts need a named quoted-printable filter rather than a language-specific
      library.
  project-history:
    - >
      John Walker published qprint through Fourmilab as a public-domain command-line
      utility. The official page documents version 1.1, revised on 17 December 2014, and
      distributes source plus Unix build instructions and a Windows executable.
  related-projects:
    - >
      The official manual points to base64 as the more economical MIME encoding for
      largely binary data.
    - >
      Quoted-Printable is defined by the MIME standards; the qprint manual references
      RFC 1521 and its successors.
  sources:
    - 'Official literate source document: https://www.fourmilab.ch/webtools/qprint/qprint.pdf'
    - 'Official project manual and release page: https://www.fourmilab.ch/webtools/qprint/'
    - 'Package coverage: source_facts.package-manager'
  summary:
    - >
      qprint is John Walker’s public-domain command-line encoder and decoder for MIME
      Quoted-Printable data. It is designed as a serial file filter and is commonly
      suited to automated mail-processing pipelines.
  timeline:
    - '2014-12-17: qprint 1.1 documentation was revised and published by Fourmilab.'
  usage:
    - >
      Run qprint in encode or decode mode with optional input and output files; a
      missing filename or “-” selects standard input or output, making the program
      pipeline-friendly.
    - >
      The binary option preserves exact byte sequences, while the manual recommends
      Base64 instead when mostly binary input would make Quoted-Printable excessively
      large.
