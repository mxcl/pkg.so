id: brew:bgpdump
display-name: bgpdump
repo: null
docs:
  - https://github.com/RIPE-NCC/bgpdump/wiki
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bgpdump's adoption is mostly in network-operations and routing-research packaging
      rather than general developer tooling. The input records Homebrew, Debian, Ubuntu,
      Fedora, and Nix packages, consistent with a utility needed wherever MRT archives
      and BGP dump files are processed.
  package-nerd-significance:
    - >
      bgpdump is package-nerd significant as infrastructure plumbing: small, old,
      format-specific, and kept alive because many routing datasets and analysis scripts
      depend on stable MRT parsing. Its history is less glamorous than newer CLIs, but
      it is exactly the kind of package that keeps network measurement tooling
      reproducible.
  project-history:
    - >
      The official README describes libBGPdump as a C library for analyzing Zebra/Quagga
      or MRT dump files. The ChangeLog shows maintenance history back to at least 2005,
      with work on IPv6 output, ASN32 support, TABLE_DUMP_V2, 32-bit ASN output, Darwin
      fixes, Add-Path support, BGP Large Communities, and later GitHub release/tag
      migration.
    - >
      The current GitHub repository was created in October 2019 after earlier history on
      RIPE NCC infrastructure and Bitbucket, which the ChangeLog notes became the
      development home in 2011.
  related-projects:
    - >
      Related projects include RIPE RIS tooling, CAIDA BGPStream, Route Views data
      tools, Zebra/Quagga and FRRouting, and other MRT/BGP parsers used in routing
      research.
  sources:
    - https://api.github.com/repos/RIPE-NCC/bgpdump
    - https://raw.githubusercontent.com/RIPE-NCC/bgpdump/master/ChangeLog
    - https://raw.githubusercontent.com/RIPE-NCC/bgpdump/master/README
    - source_facts.package-manager
  summary:
    - >
      bgpdump is a RIPE NCC-maintained command-line utility and C library for parsing
      MRT files and dumps produced by Zebra or Quagga, used in BGP routing analysis
      workflows.
  timeline:
    - '2005: ChangeLog records IPv6-prefix output fixes.'
    - '2006: ASN32 support added.'
    - '2007: TABLE_DUMP_V2 support added.'
    - '2011: Development moved to Bitbucket according to the ChangeLog.'
    - '2016: v1.5.0 released with security, crash, memory-leak, and thread-safety fixes.'
    - '2018: v1.6.0 released with large-record and quiet-mode fixes.'
    - '2019: GitHub repository created.'
    - '2020: v1.6.1/v1.6.2 release/tag migration and version fixes.'
  usage:
    - >
      Users run bgpdump to decode MRT/BGP data into readable or machine-processable
      output, or link against the C library in routing-analysis software. It is
      especially relevant around Route Views, RIS, Zebra/Quagga-derived dumps, and
      archived BGP update/table data.
related-packages:
  - id: brew:bgpstream
    reason: >
      Use BGPStream alongside or instead of direct bgpdump parsing when a workflow needs
      unified access to live or historical collector data, time-window filtering, and
      library or CLI analysis rather than decoding individual MRT files alone.
    rel: adjacent_workflow
    sources:
      - https://github.com/RIPE-NCC/bgpdump
      - https://bgpstream.caida.org/docs
      - https://github.com/CAIDA/libbgpstream
