history:
  adoption-history:
    - >
      Apple integrated the Icon Composer file format with Xcode so one layered icon can
      be included in an application project and rendered for multiple platforms,
      appearances, and deployment targets.
  package-nerd-significance:
    - >
      Icon Composer packages a specialized part of Apple's design toolchain as a
      standalone macOS application. It is relevant to reproducible developer setups
      because the generated icon file feeds directly into Xcode builds rather than
      serving only as exported artwork.
  project-history:
    - >
      Apple introduced Icon Composer at WWDC25 for producing layered Liquid Glass
      application icons from source artwork. It addresses the expanding matrix of Apple
      platforms and default, dark, tinted, clear, and monochrome appearances.
    - >
      The tool imports SVG or PNG artwork, organizes it into groups and layers, applies
      material properties, previews platform variants, and saves a single file for use
      by Xcode.
  related-projects:
    - Xcode
    - Apple Human Interface Guidelines
    - Apple Design Resources
    - Liquid Glass
  sources:
    - >
      Official Apple documentation:
      https://developer.apple.com/documentation/xcode/creating-your-app-icon-using-icon-composer
    - 'Official Icon Composer page: https://developer.apple.com/icon-composer/'
    - 'WWDC25 session: https://developer.apple.com/videos/play/wwdc2025/361/'
  summary:
    - >
      Icon Composer is Apple's design utility for creating a single layered application
      icon that adapts across iPhone, iPad, Mac, and Apple Watch.
  timeline:
    - '2025: Apple presented Icon Composer at WWDC25.'
    - '2025: Apple documented direct integration of Icon Composer files with Xcode projects.'
  usage:
    - >
      Designers prepare flat SVG or PNG layers, import and organize them, configure
      Liquid Glass effects and appearance variants, preview the icon for supported
      platforms, and add the saved Icon Composer file to an Xcode target.
