history:
  adoption-history:
    - >
      CrystalDiffract expanded from a Macintosh scientific application to a Windows
      edition in 2006. Later releases adopted native 64-bit implementations,
      Apple-silicon support, and integration with contemporary CrystalMaker document
      formats.
    - >
      The product is used as part of CrystalMaker Software's interoperable
      crystallography suite, particularly where changes in CrystalMaker structures need
      to be reflected directly in simulated diffraction patterns.
  package-nerd-significance:
    - >
      CrystalDiffract represents specialist proprietary scientific software made
      accessible through a desktop package manager. Its value is not a Unix-style
      command-line interface but reproducible installation of a substantial native macOS
      crystallography application.
    - >
      Its long-lived file-format and suite integration illustrates why scientific
      desktop packages often preserve legacy downloads and compatibility paths longer
      than mainstream consumer applications.
  project-history:
    - >
      CrystalDiffract began as a Macintosh powder-diffraction application in 1995. It
      evolved through multi-pattern simulation, Mac OS X modernization, a separate
      Windows line, 64-bit native interfaces, and tighter integration with CrystalMaker.
    - >
      CrystalDiffract 7 arrived in 2024 with phase identification and Rietveld
      refinement, extending the product from diffraction simulation and visualization
      into observed-pattern analysis and refinement.
  related-projects:
    - >
      CrystalMaker supplies and edits crystal structures and can exchange structural
      data with CrystalDiffract.
    - >
      SingleCrystal is the vendor's companion application for single-crystal and
      reciprocal-space diffraction work.
  sources:
    - 'Official company history: https://crystalmaker.com/about/history/'
    - >
      Official documentation overview:
      https://crystalmaker.com/support/advice/pages/cd-documentation.html
    - 'Official introduction: https://crystalmaker.com/crystaldiffract/'
    - 'Official specifications: https://crystalmaker.com/crystaldiffract/specs/index.html'
  summary:
    - >
      CrystalDiffract is proprietary macOS and Windows software for simulating,
      visualizing, identifying, and refining X-ray and neutron powder-diffraction
      patterns.
  timeline:
    - '1995: CrystalDiffract 1.0 was released for Macintosh.'
    - '2002: CrystalDiffract 4.0 adopted a Mac OS X Carbon architecture.'
    - '2005: CrystalDiffract 5.0 added multi-pattern diffraction.'
    - '2006: CrystalDiffract 1.0 for Windows was released.'
    - '2013: CrystalDiffract 6.0 introduced a 64-bit Cocoa design on Mac.'
    - '2021: CrystalDiffract 6.9 added support for Apple-silicon Macs.'
    - '2024: CrystalDiffract 7 added Rietveld refinement and phase identification.'
  usage:
    - >
      Scientists can load crystal structures or observed powder data, simulate X-ray or
      neutron patterns, compare multiple phases, identify phases, and refine models with
      Rietveld methods.
    - >
      New users are directed to the bundled self-guided tutorial. The definitive user
      guide and concise online help are accessed from the application's Help menu.
