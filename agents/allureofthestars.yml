id: brew:allureofthestars
display-name: Allure of the Stars
repo: https://github.com/AllureOfTheStars/Allure
docs:
  - https://allureofthestars.com/
  - https://github.com/AllureOfTheStars/Allure/blob/master/GameDefinition/PLAYING.md
config-file-location:
  linux:
    - ~/.Allure/
  windows:
    - '%APPDATA%\Allure\'
credentials-file-location: null
history:
  adoption-history:
    - >
      Allure of the Stars is niche rather than mass-market: its official channels
      include Hackage, GitHub releases, a browser build, Homebrew for macOS binaries,
      public issue tracking, Discord, and Matrix. Its adoption is mostly within the
      Haskell, roguelike, and procedural-generation communities rather than mainstream
      game stores.
    - >
      For package managers, the game is unusual because it is both a playable roguelike
      and a showcase for the LambdaHack engine. Homebrew packaging matters because the
      README explicitly calls out Mac OS X binaries via `brew install allureofthestars`,
      with Homebrew handling dependencies.
  package-nerd-significance:
    - >
      Allure of the Stars is package-nerd catnip because it is a Haskell game shipped
      through Hackage, GitHub releases, browser builds, and Homebrew rather than the
      usual app-store channel. It also exercises real native dependencies such as SDL2
      while retaining terminal-oriented frontends.
    - >
      The package name collision is memorable: `allureofthestars` avoids conflict with
      `allure`, while the upstream executable and Hackage package are named `Allure`.
      That makes it a good example of why package-manager names often diverge from
      upstream binary names.
  project-history:
    - >
      The README credits Andres Loeh for 2008-2011 copyright and Mikolaj Konarski and
      others from 2010 onward, placing the game in the long-running Haskell roguelike
      lineage that also produced LambdaHack. The project is distributed as source,
      native binaries, a browser-playable build, and a Hackage package named `Allure`.
    - >
      The homepage frames the game as a departure from classic single-character
      roguelikes: the player controls a squad, time and factions operate across
      persistent levels, and combat uses deterministic mechanics with procedural world
      generation and AI decisions providing variation. The README names long-term goals
      of replayability and auto-balancing through procedural content generation and
      persistent content modification based on player behavior.
  related-projects:
    - LambdaHack is the Haskell roguelike game engine used by Allure of the Stars.
    - Hackage distributes the `Allure` package for cabal users.
    - >
      SDL2 is used for the standard native frontend, while ANSI and Teletype frontends
      support terminal-oriented use cases.
  sources:
    - https://allureofthestars.com/
    - https://raw.githubusercontent.com/AllureOfTheStars/Allure/master/CHANGELOG.md
    - https://raw.githubusercontent.com/AllureOfTheStars/Allure/master/README.md
  summary:
    - >
      Allure of the Stars is a near-future science-fiction roguelike and tactical squad
      combat game written in Haskell on the LambdaHack roguelike engine. It is
      intentionally text-first, emphasizing imagination, procedural content,
      replayability, and squad tactics rather than graphical assets.
  timeline:
    - '2008-2011: README copyright credits Andres Loeh for early work.'
    - '2010-2021: README copyright credits Mikolaj Konarski and others for ongoing development.'
    - >
      v0.10.3.0: Changelog records a move from Travis CI to GitHub Actions and removal
      of older terminal frontends in favor of SDL2 plus ANSI/Teletype support.
    - 'v0.11.0.0: Changelog records substantial UI, testing, gameplay, and content changes.'
  usage:
    - >
      Users can play in the browser, install prebuilt binaries, install from Hackage
      with `cabal install Allure`, or install the Homebrew formula on macOS. The README
      documents SDL2 and ANSI terminal frontends, keyboard and mouse controls,
      screen-reader-oriented work in the ANSI frontend, and configuration through a
      generated user data directory.
    - >
      The game's configuration is written on first run to `~/.Allure/` on Linux or the
      roaming AppData Allure directory on Windows. Users can edit screen fonts, scaling,
      fullscreen behavior, key setup, and other UI options there.
related-packages:
  - id: brew:brogue
    reason: >
      Brogue CE is a focused single-character alternative with a randomly generated
      dungeon and minimalist strategy; choose it for a more traditional solo roguelike
      rather than Allure's persistent squad tactics.
    rel: alternative
    sources:
      - https://allureofthestars.com/
      - https://github.com/tmewett/BrogueCE#readme
  - id: brew:angband
    reason: >
      Angband is a traditional single-player dungeon-exploration alternative with
      randomly generated levels and a long variant culture; choose it for classic
      character progression and a mature roguelike lineage rather than squad combat.
    rel: alternative
    sources:
      - https://allureofthestars.com/
      - https://rephial.org/
      - https://angband.readthedocs.io/en/latest/
