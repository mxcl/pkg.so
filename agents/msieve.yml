history:
  project-history:
    - >
      Technically, Msieve's niche is high-performance general integer factorization
      rather than a broad computer-algebra environment. It implements a
      self-initializing quadratic sieve for ordinary use and includes number-field-sieve
      code, especially postprocessing, that the author says helped complete large public
      factorization efforts. Its CLI can factor numbers supplied directly, from files,
      or as arithmetic expressions, while the library can be embedded by other programs.
  sources:
    - https://formulae.brew.sh/formula/msieve
    - https://github.com/bbuhrow/yafu
    - https://github.com/radii/msieve
  summary:
    - >
      Msieve is Jason Papadopoulos's public-domain C library and command-line program
      for integer factorization. Its README frames the project as an effort to
      understand and optimize modern factoring algorithms, with a self-contained
      implementation intended to be fast, portable, and simple to use. The library
      combines trial division and Pollard Rho for small cases, optional GMP-ECM for P-1,
      P+1, and ECM work, then sieve-based methods for harder inputs.
  usage:
    - >
      In the factoring ecosystem, Msieve sits beside tools such as GGNFS, CADO-NFS, and
      YAFU. Its README describes using GGNFS for earlier NFS stages and Msieve for later
      stages on very large problems, and YAFU's build notes document bundling msieve as
      part of YAFU 3.0. Package-manager records for Homebrew, MacPorts, and Nix place it
      as a specialist science/cryptography utility rather than a general-purpose math
      suite.
related-packages:
  - id: brew:gmp-ecm
    reason: >
      Use GMP-ECM alongside Msieve when you want dedicated ECM, P-1, or P+1
      preprocessing; Msieve's official source supports GMP-ECM as an optional component
      before its sieve-based stages.
    rel: adjacent_workflow
    sources:
      - https://sourceforge.net/p/msieve/code/HEAD/tree/trunk/
      - https://gitlab.inria.fr/zimmerma/ecm
