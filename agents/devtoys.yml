history:
  adoption-history:
    - >
      The project became cross-platform across Windows, macOS, and Linux. DevToys 2.0
      introduced an extension SDK and extension manager, changing the application from a
      fixed utility bundle into an extensible developer-tool platform.
  package-nerd-significance:
    - >
      DevToys consolidates tasks developers often perform with one-off command-line
      snippets or web tools. Its local desktop implementation, smart clipboard
      detection, cross-platform packaging, and extension model make it especially
      relevant to developer-workstation curation.
  project-history:
    - >
      DevToys began as a desktop “Swiss Army knife” for developers: a collection of
      focused converters, encoders, formatters, generators, testers, and text or
      graphics utilities. The 2.0 generation adopted a cross-platform architecture and
      public SDK for third-party extensions.
  related-projects:
    - >
      DevToys CLI, DevToys extensions, and the separate DevToys.Tools collection used by
      the application.
  sources:
    - https://devtoys.app/doc/articles/introduction.html
    - https://github.com/DevToys-app/DevToys
    - https://github.com/DevToys-app/DevToys/releases
  summary:
    - >
      DevToys is a cross-platform desktop toolbox that bundles frequently needed
      developer utilities and can select tools based on clipboard content.
  timeline:
    - 'Initial generation: Established as a Windows-focused collection of developer utilities.'
    - >
      DevToys 2.0: Reworked as a cross-platform, extensible application for Windows,
      macOS, and Linux.
    - >
      2.0 era: Extension distribution and additional community tools became part of the
      product model.
  usage:
    - >
      Developers use DevToys for JSON and YAML conversion, Base64 and URL encoding,
      formatting, hashing, regular-expression testing, image compression, text
      comparison, and similar short tasks. Smart Detection can select a suitable tool
      for clipboard data.
