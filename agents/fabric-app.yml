history:
  adoption-history:
    - >
      Fabric targets individuals and teams that need to collect, search, annotate, and
      connect material spread across files, notes, links, recordings, and external
      services.
    - >
      The product's official materials position it as both a personal second brain and a
      collaborative workspace. Desktop, mobile, browser, integration, and API surfaces
      support capture and retrieval across different workflows.
  package-nerd-significance:
    - >
      Fabric's cask packages a service-backed knowledge-management client whose primary
      data model is a synchronized workspace rather than a collection of conventional
      local configuration files.
    - >
      Its API, integrations, semantic search, and support for many content formats make
      it relevant to users building automated personal-knowledge or team-documentation
      workflows.
  project-history:
    - >
      Fabric was presented publicly in 2023 as an AI-native, multiplayer workspace and
      file explorer intended to unify scattered information and organize it by meaning.
    - >
      The product subsequently broadened its positioning from personal knowledge
      management toward an AI workspace for files, notes, ideas, meetings,
      collaboration, integrations, and automated agents.
  related-projects:
    - >
      Fabric provides an official REST API and TypeScript SDK. It also integrates with
      storage, productivity, communication, and design services to bring external
      material into a searchable workspace.
  sources:
    - https://developers.fabric.so/developer-guide/getting-started
    - https://fabric.so/
    - https://fabric.so/blog/meet-fabric
    - https://fabric.so/use-cases/second-brain
    - source_facts.description
  summary:
    - >
      Fabric is an AI-assisted knowledge workspace for collecting, searching,
      connecting, and collaborating around files, notes, ideas, and meetings.
  timeline:
    - >
      2023: Fabric publicly described its AI-native multiplayer workspace and announced
      early funding.
    - >
      2020s: Fabric expanded across personal knowledge management, team collaboration,
      integrations, APIs, and agents.
  usage:
    - >
      Users place or connect files, notes, links, recordings, and other material in
      Fabric, then retrieve it through semantic search, annotations, visual
      organization, and an AI assistant.
    - >
      Fabric API clients authenticate with personal or developer API keys, but the
      official documentation instructs callers to supply keys through request headers
      and does not define a desktop credentials file.
