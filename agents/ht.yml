id: brew:ht
display-name: HT Editor
repo: https://github.com/sebastianbiallas/ht
docs:
  - https://github.com/sebastianbiallas/ht#readme
  - https://hte.sourceforge.net/doc.html
config-file-location:
  unix:
    - ~/.htcfg2
    - FILENAME.htcfg
  windows:
    - ht.cfg2 (where ht.exe resides)
    - FILENAME.htcfg
credentials-file-location: null
history:
  adoption-history:
    - >
      HT is packaged across Unix-like systems because it fills a niche between a hex
      editor, file-format browser, disassembler, and lightweight reverse-engineering
      workbench. The input metadata records packages in Homebrew, Debian, MacPorts, Nix,
      Ubuntu, and openSUSE.
    - >
      Its SourceForge-era documentation also names GNU/Linux, FreeBSD, and Win32 as
      target systems, which explains why package recipes often need to preserve both
      Unix and Windows configuration behavior.
  package-nerd-significance:
    - >
      HT matters to package nerds because it is a classic terminal reverse-engineering
      utility with deep file-format support and a long SourceForge-to-GitHub lineage. It
      is the kind of tool that remains useful even when newer GUI reverse-engineering
      platforms exist, because it is small enough to ship as a command-line package.
    - >
      It also illustrates a packaging edge case: a project homepage, historical release
      notes, generated documentation, and a moved official repository all matter when
      identifying the authoritative source.
  project-history:
    - >
      The HT site credits Stefan Weyergraf and Sebastian Biallas and describes the
      project goal as combining the low-level functionality of a debugger with IDE-style
      usability. Its documentation and README describe support for formats such as ELF,
      PE, Mach-O, MZ, NE, LE, Java class files, XBE, COFF/XCOFF, and others.
    - >
      The SourceForge-hosted site records a long 2.0.x release line from the 2000s into
      the early 2010s. In September 2014 the project announced that the official source
      repository moved to GitHub, and in January 2015 HT 2.1.0 added PE relocation
      handling, PE checksum calculation, AVR disassembly, broken-ELF crash fixes, and an
      updated minilzo.
  related-projects:
    - >
      Related tools include hex editors, objdump/readelf-style binary inspection tools,
      disassemblers, debuggers, and reverse-engineering suites used for executable
      analysis.
  sources:
    - https://github.com/sebastianbiallas/ht
    - https://hte.sourceforge.net/
    - https://hte.sourceforge.net/doc.html
    - https://hte.sourceforge.net/readme.html
  summary:
    - >
      HT Editor is a console file viewer, editor, and analyzer for text, binary files,
      and especially executable formats, combining hex editing with disassembly and
      executable-structure inspection.
  timeline:
    - >
      1999-2004: Project copyright range appears on the official site footer for the
      original authorship era.
    - '2007: HT 2.0.10 release notes mention SSE5 opcode support.'
    - '2008: HT 2.0.13 release notes mention Intel AVX opcodes.'
    - '2013: HT 2.0.22 release notes mention editor scroll-offset work and bug fixes.'
    - '2014: Official source repository moved to GitHub.'
    - '2015: HT 2.1.0 released with PE, AVR, ELF-crash, and minilzo updates.'
  usage:
    - >
      Users open files in HT to inspect executable headers, sections, imports, exports,
      relocations, resources, disassembly, xrefs, labels, comments, and evaluator
      expressions. Analyzer state is stored beside the analyzed file as FILENAME.htcfg.
    - >
      The documentation records global configuration in ~/.htcfg2 on Unix and ht.cfg2
      next to ht.exe on Windows, plus per-file analyzer state that restores labels,
      comments, and analysis metadata.
related-packages:
  - id: brew:radare2
    reason: >
      Choose radare2 when you need a broader scriptable reverse-engineering framework
      with debugging, emulation, plugins and reusable libraries; choose HT for a compact
      console editor centered on direct executable inspection and modification.
    rel: alternative
    sources:
      - https://github.com/sebastianbiallas/ht#readme
      - https://book.rada.re/
