history:
  adoption-history:
    - >
      MassReplaceIt has remained available as a free macOS utility for more than two
      decades. Its releases span early PowerPC-era Mac OS X, Universal Binary support,
      64-bit and code-signing modernization, and current Apple Silicon and Intel builds.
    - >
      The utility's Homebrew cask gives contemporary macOS users a package-managed
      installation route alongside the developer's direct disk-image download.
  package-nerd-significance:
    - >
      MassReplaceIt is a long-lived example of a focused native Mac utility surviving
      several architecture and platform transitions. Package enthusiasts may appreciate
      that a tool first released in 2004 still has a current universal build and retains
      automation-oriented features such as regular expressions, macros, reusable
      searches, and AppleScript support.
    - >
      Its preview and undo mechanisms distinguish it from terse command-line
      substitution tools when a user needs interactive review of changes across large,
      heterogeneous file sets.
  project-history:
    - >
      HexMonkey Software first released MassReplaceIt 1.0 in October 2004 as a graphical
      utility for bulk modifications to filenames and file contents. Early 2.x releases
      rapidly added previews, per-change confirmation, AppleScript automation, macros,
      reusable queries, filters, and reversal of recent searches.
    - >
      Version 3.0 arrived in 2018 with a 64-bit, code-signed build, an ICU
      regular-expression engine, Retina artwork, revised terminology, and redesigned
      management of saved searches. Versions 3.1 and 3.1.2 added dark mode and
      maintenance fixes.
    - >
      After a six-year gap in the official release history, version 4.0 was released in
      April 2026. It added native Apple Silicon support, hierarchical file lists,
      folders for saved searches, new filters, improved alias handling, a refreshed
      interface, and substantial performance work.
  related-projects:
    - >
      MassReplaceIt overlaps with command-line tools such as sed, Perl, and
      ripgrep-based replacement workflows, but provides graphical file selection,
      previews, confirmations, saved searches, and undo support tailored to macOS.
  sources:
    - https://www.hexmonkeysoftware.com/
    - https://www.hexmonkeysoftware.com/history.html
    - source_facts.package-manager.brew-cask
  summary:
    - >
      MassReplaceIt is a free native macOS utility from HexMonkey Software for
      performing and previewing bulk replacements in filenames and file contents. It
      supports reusable searches, filters, regular expressions, macros, AppleScript
      automation, and reversal of recent changes.
  timeline:
    - '2004: MassReplaceIt 1.0 was released.'
    - >
      2005: The 2.x series added scripting, macros, reusable queries, confirmations, and
      change reversal.
    - '2006: Version 2.9 added regular expressions and a Universal Binary.'
    - >
      2018: Version 3.0 added 64-bit support, code signing, ICU regular expressions, and
      a redesigned interface.
    - '2019: Version 3.1 added dark mode.'
    - '2020: Version 3.1.2 delivered maintenance fixes.'
    - >
      2026: Version 4.0 added native Apple Silicon support and major interface,
      search-management, and performance improvements.
  usage:
    - >
      Users assemble one or more replacement actions, add files or folders, and
      optionally restrict the target set with filters. They can search either contents
      or filenames, preview proposed changes, approve changes at several levels, save
      searches for reuse, and undo tracked changes from recent searches.
    - >
      Advanced workflows use regular expressions, replacement macros, and AppleScript.
      Typical tasks include renaming batches of files, removing unwanted filename text,
      numbering files, or replacing text throughout a website source tree.
