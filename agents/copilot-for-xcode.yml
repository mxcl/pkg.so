history:
  adoption-history:
    - >
      The extension brought Copilot-style assistance to Xcode before GitHub maintained
      its own Xcode extension. GitHub's later official repository explicitly credits the
      original project's author and says its implementation is based on this work.
  package-nerd-significance:
    - >
      It is notable in macOS package culture as an early community solution for
      installing AI-assisted completion and chat into Xcode, distributed as a desktop
      application and Source Editor Extension rather than a conventional command-line
      developer tool.
  project-history:
    - >
      Copilot for Xcode began as a community-developed Xcode Source Editor Extension and
      describes itself as the first extension of its kind to support GitHub Copilot,
      Codeium, and ChatGPT in Xcode.
    - >
      GitHub subsequently created github/CopilotForXcode and acknowledged intitni's
      original project as its basis. The cask in this record refers to the original
      intitni project, not that later GitHub-maintained package.
  related-projects:
    - >
      GitHub Copilot for Xcode: GitHub's later official Xcode extension, based on and
      crediting the original project.
    - 'Codeium and ChatGPT: additional services supported by the original extension.'
  sources:
    - https://github.com/github/CopilotForXcode
    - https://github.com/intitni/CopilotForXcode
  summary:
    - >
      Copilot for Xcode is an early community-built AI coding extension for Xcode,
      combining code suggestions, chat, prompt-to-code workflows, and customizable
      commands.
  timeline:
    - >
      Original project: Introduced a community Xcode extension supporting GitHub
      Copilot, Codeium, and ChatGPT.
    - >
      Later development: GitHub published its own Copilot for Xcode project and credited
      the original author and codebase.
  usage:
    - >
      Users install the macOS application, enable its Xcode Source Editor Extension,
      grant the documented permissions, and configure one or more supported AI services.
      It can provide inline suggestions, chat informed by the active editor,
      prompt-driven code changes, and custom commands.
