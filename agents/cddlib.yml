config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      cddlib is packaged broadly because computational geometry and polyhedral libraries
      often need a shared backend. The Homebrew input records packages across Alpine,
      Homebrew, Debian/Ubuntu, Fedora, MacPorts, Nix, Arch, and openSUSE-family
      packaging.
  package-nerd-significance:
    - >
      cddlib matters in packaging because it is a small but important scientific
      dependency: a C library with optional GMP exact arithmetic, command-line
      utilities, and a long-lived mathematical niche. Its presence in many distributions
      reflects the way specialized academic algorithms become infrastructure for larger
      mathematics systems.
  project-history:
    - >
      The upstream README describes cddlib as a C implementation of the double
      description method of Motzkin et al. for generating all vertices and extreme rays
      of a convex polyhedron from linear inequalities, and for the reverse convex-hull
      computation. The ETH-hosted manual by Komei Fukuda provides the project
      documentation lineage and remains the detailed reference for the library and
      command-line programs.
    - >
      The current GitHub repository was created in 2018 and is now the official source
      repository. Its releases show the modern packaged series: 0.94j in 2018, 0.94k and
      0.94l in 2020, 0.94m in 2020, and 0.94n in 2025.
  related-projects:
    - >
      The README points to GMP for rational arithmetic and describes cddlib's
      relationship to convex-hull computation, linear programming, and
      double-description polyhedral algorithms.
  sources:
    - https://api.github.com/repos/cddlib/cddlib
    - https://github.com/cddlib/cddlib
    - https://www.inf.ethz.ch/personal/fukudak/cdd_home/
    - https://github.com/cddlib/cddlib#readme
    - https://people.inf.ethz.ch/fukudak/cdd_home/cddlibman2021.pdf
    - https://formulae.brew.sh/api/formula/cddlib.json
    - https://github.com/cddlib/cddlib/releases
  summary:
    - >
      cddlib is a C implementation of the double description method for convex
      polyhedra. It converts between inequality and generator representations, computes
      adjacency and faces, and includes linear-programming support.
  timeline:
    - '2018: Current official GitHub repository created and release 0.94j published.'
    - '2020: Releases 0.94k, 0.94l, and 0.94m published.'
    - '2021: ETH-hosted cddlib manual version referenced by current curation.'
    - '2025: Release 0.94n published.'
  usage:
    - >
      Users link against cddlib or cddgmp from C programs, use the GMP rational build
      for exact arithmetic, and run tools such as cddexec, lcdd, scdd, fourier,
      adjacency, allfaces, projection, and redcheck for polyhedral computations.
related-packages:
  - id: brew:qhull
    reason: >
      Choose Qhull for convex hulls, Delaunay triangulations, Voronoi diagrams, and
      related floating-point geometry; choose cddlib when general H/V polyhedral
      conversion or GMP-backed exact arithmetic is required.
    rel: alternative
    sources:
      - http://www.qhull.org/
      - https://github.com/cddlib/cddlib/blob/master/README.md
      - https://people.inf.ethz.ch/fukudak/polyfaq/node41.html
