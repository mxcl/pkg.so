config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project page emphasizes embedded and document-imaging adoption: the main
      library implements nearly all JBIG1 options, while the later jbig85 variant
      targets the ITU-T T.85 fax profile with low memory use. Package managers including
      Homebrew, Debian, Fedora, Arch, MacPorts, Nix, Alpine, and openSUSE carry it
      because it is the small canonical toolkit for JBIG1 files.
  package-nerd-significance:
    - >
      For package maintainers, JBIG-KIT is the reference-style tiny C package that keeps
      JBIG1 support available without a large image-processing stack. Its 2014 security
      release for CVE-2013-6369 is a reminder that small archival codecs still sit on
      untrusted document-ingestion paths.
  project-history:
    - >
      The revision history shows development dating back to the mid-1990s, with version
      0.7 in 1995 and version 1.0 in 1998. The package combined a reusable C library
      with command-line converters, giving Unix users pbmtojbg and jbgtopbm tools
      similar in style to Netpbm converters.
  related-projects:
    - >
      The project documentation relates JBIG-KIT to the JBIG committee, ISO/IEC 11544,
      ITU-T T.82, ITU-T T.85, Netpbm-style converters, TIFF-FX, fax formats, printer
      firmware, and document-management systems.
  sources:
    - https://formulae.brew.sh/formula/jbigkit
    - https://www.cl.cam.ac.uk/~mgk25/git/jbigkit
    - https://www.cl.cam.ac.uk/~mgk25/jbigkit/
    - https://www.cl.cam.ac.uk/~mgk25/jbigkit/CHANGES
  summary:
    - >
      JBIG-KIT is Markus Kuhn's portable C implementation of the JBIG1 bi-level image
      compression standard, ITU-T T.82 and ISO/IEC 11544:1993. The project page
      describes it as widely used in fax products, printer firmware, printer drivers,
      document-management systems, and imaging software.
  timeline:
    - '1995: Version 0.7 appeared in the revision history.'
    - '1998: Version 1.0 added grayscale handling helpers and PGM support.'
    - '2003: Version 1.5 improved support for ITU-T T.85 fax applications.'
    - >
      2008: Version 2.0 added the lightweight jbig85 library and converter tools for
      embedded and fax use.
    - >
      2014: Version 2.1 fixed decoder security issues while preserving API and ABI
      compatibility with 2.0.
  usage:
    - >
      JBIG-KIT is used either as a library linked into imaging software or through the
      pbmtojbg, jbgtopbm, pbmtojbg85, and jbgtopbm85 command-line tools. Its
      documentation frames the tools as simple converters for PBM and JBIG streams,
      while the library API is intended for document and image applications.
related-packages:
  - id: brew:libtiff
    reason: >
      libtiff can be built with JBIG-KIT support, making the library relevant when TIFF
      workflows must read or write JBIG-compressed image data.
    rel: adjacent_workflow
    sources:
      - https://www.cl.cam.ac.uk/~mgk25/jbigkit/
      - https://libtiff.gitlab.io/libtiff/
  - id: brew:netpbm
    reason: >
      Netpbm complements JBIG-KIT because its PBM image format is the native interchange
      used by JBIG-KIT's pbmtojbg and jbgtopbm converters.
    rel: adjacent_workflow
    sources:
      - https://www.cl.cam.ac.uk/~mgk25/jbigkit/
      - https://netpbm.sourceforge.net/
  - id: brew:jbig2dec
    reason: >
      jbig2dec is the alternative for decoding the newer JBIG2 standard, which targets
      stronger monochrome-document compression rather than JBIG-KIT's JBIG1 streams.
    rel: alternative
    sources:
      - https://www.cl.cam.ac.uk/~mgk25/jbigkit/
      - https://github.com/ArtifexSoftware/jbig2dec
