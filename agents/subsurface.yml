id: cask:subsurface
display-name: Subsurface
repo: https://github.com/subsurface/subsurface
docs:
  - https://subsurface-divelog.org/documentation
config-file-location:
  linux:
    - ~/.config/Subsurface/Subsurface.conf
  macos:
    - ~/Library/Preferences/org.hohndel.subsurface.Subsurface.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Subsurface expanded from a Linux application to support macOS, Windows, Android,
      and iOS, with import support for numerous dive computers and other dive-log
      formats.
  package-nerd-significance:
    - >
      Subsurface is notable as a long-lived, GPL-licensed specialist desktop application
      started by a prominent open-source developer. Its packaging spans conventional
      desktop builds, AppImage, Snapcraft, and distribution build services.
    - >
      Its integration with libdivecomputer and ability to migrate data from competing
      logbook formats make it an important interoperability tool in the diving-software
      ecosystem.
  project-history:
    - >
      Linus Torvalds began Subsurface in autumn 2011 after becoming dissatisfied with
      the dive-log software available on Linux. A broader developer team subsequently
      grew the project into a cross-platform application.
    - >
      Dirk Hohndel became the project's maintainer in autumn 2012. Later development
      added cloud storage, mobile clients, broad dive-computer support, mapping, dive
      planning, and visualization.
  related-projects:
    - libdivecomputer supplies support for downloading records from many dive computers.
    - >
      Subsurface-mobile and Subsurface cloud storage extend the desktop logbook to
      mobile devices and synchronized data.
  sources:
    - 'Official project history and feature overview: https://subsurface-divelog.org/'
    - >
      Official release notes:
      https://github.com/subsurface/subsurface/blob/master/ReleaseNotes/ReleaseNotes.txt
    - 'Official upstream README: https://github.com/subsurface/subsurface#readme'
  summary:
    - >
      Subsurface is a free, open-source dive-log application created in 2011 by Linus
      Torvalds and subsequently maintained by Dirk Hohndel and a wider contributor
      community. It records, imports, visualizes, plans, and synchronizes scuba and
      freediving data.
  timeline:
    - '2011: Linus Torvalds began Subsurface during a lull in Linux kernel development.'
    - '2012: Dirk Hohndel took over as maintainer.'
    - >
      2014: The developers discussed adopting a Git-backed save format for synchronized
      dive data.
    - 'Subsurface 4.5 era: Cloud storage and a mobile-oriented workflow were introduced.'
    - 'Subsurface 6: The project moved to an automated CI/CD release process.'
  usage:
    - >
      Divers use Subsurface to download dives from supported computers, import existing
      electronic logbooks, enrich dives with sites and media, inspect profiles and
      decompression information, and plan future dives.
    - >
      Users may keep logs in local files or use Subsurface cloud storage to share the
      same data between desktop and mobile installations.
