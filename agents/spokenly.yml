history:
  adoption-history:
    - >
      Spokenly expanded across macOS, Windows, Linux, and iOS, combining free local
      transcription with optional managed cloud service or bring-your-own-key providers.
      The official changelog says the macOS sideload and Windows builds self-update, iOS
      is delivered through the App Store, and the older Mac App Store build is frozen.
    - >
      The input records distribution of the current macOS application through the
      Homebrew Cask `spokenly`.
  package-nerd-significance:
    - >
      Spokenly combines desktop-wide dictation with a choice between local inference and
      several cloud providers. Its BYOK support, Local Only Mode, coding-agent MCP
      server, and voice-controlled macOS automation make it notable where speech input
      intersects with developer tooling and privacy-conscious local AI.
  project-history:
    - >
      Indie developer Vadim Ahmerov created Spokenly after finding existing dictation
      tools expensive, account-dependent, or insufficiently private. The project was
      designed to offer on-device transcription in more than 100 languages while letting
      users control how audio is processed.
    - >
      The product developed into a proprietary cross-platform application supporting
      local Whisper and Parakeet models, OpenAI, Deepgram, and Groq cloud transcription,
      AI editing modes, meeting transcription on macOS, an iOS keyboard, and
      agent-oriented macOS integrations.
  related-projects:
    - Whisper and Parakeet provide supported local speech-to-text models.
    - >
      OpenAI, Deepgram, and Groq are supported cloud or bring-your-own-key transcription
      providers.
    - The macOS sideload build includes an MCP server for AI coding agents.
  sources:
    - https://spokenly.app/about
    - https://spokenly.app/changelog
    - https://spokenly.app/docs
    - https://spokenly.app/open-source
    - source_facts.package-manager
  summary:
    - >
      Spokenly is a proprietary AI dictation and transcription application for macOS,
      Windows, Linux, and iOS. It can type speech into other applications, process audio
      locally or through selected cloud providers, and apply AI instructions to clean
      up, rewrite, or generate text.
  timeline:
    - >
      Origins: Vadim Ahmerov begins Spokenly to provide faster, more private dictation
      with an on-device option.
    - >
      2026: Official materials document cross-platform desktop and iOS editions, local
      and cloud models, settings sync, and agent-oriented macOS features.
  usage:
    - >
      On desktop systems, the user holds a shortcut, speaks, and releases it to insert
      the transcription at the active cursor. On iOS, dictation is available through the
      application and a system keyboard.
    - >
      Users can work offline with local models, subscribe to managed cloud processing,
      or supply their own OpenAI, Deepgram, or Groq API keys. Local Only Mode blocks
      network requests. Official documentation explains optional synchronization of API
      keys and provider settings but does not publish their local filesystem location.
