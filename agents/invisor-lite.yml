history:
  adoption-history:
    - >
      Invisor Lite provides the inspection output of the full Invisor application
      without its export and comparison functions. It has remained available as a free,
      lower-capability edition for Mac users who only need to inspect individual media
      files.
  package-nerd-significance:
    - >
      Invisor Lite gives macOS package users a small graphical front end for
      MediaInfo-derived stream and container metadata plus photographic metadata. Its
      Lite/full split is important when choosing between simple inspection and batch
      comparison or export workflows.
  project-history:
    - >
      Developer Max Pozdeev released Invisor Lite as a reduced edition of Invisor. The
      initial Lite release was based on Invisor 1.1, and later releases tracked changes
      in the underlying MediaInfo library before the Lite line moved alongside the full
      application's version history.
  related-projects:
    - >
      Invisor is the full edition with comparison and export functions; MediaInfo
      supplies the underlying technical analysis for video and audio files; Invisor
      QuickLook provides Finder-oriented previews for selected formats.
  sources:
    - https://invisorapp.com/
    - https://invisorapp.com/changelog-lite.php
  summary:
    - >
      Invisor Lite is the free edition of Invisor, a native Mac inspector for technical
      video, audio, and photo metadata.
  timeline:
    - '2011: Invisor Lite 1.1 was released as the initial Lite edition based on Invisor 1.1.'
    - '2011: Version 2.0 added the system-wide “Analyze with Invisor Lite” service.'
    - '2013: The 2.x line continued updating its bundled MediaInfo analysis library.'
    - 'Version 3: Lite releases began sharing the full Invisor changelog.'
  usage:
    - >
      Users open supported video, audio, or photo files to inspect containers, streams,
      subtitles, chapters, EXIF, IPTC, XMP, GPS, and MakerNote metadata. Unlike the full
      edition, Lite does not provide comparison or export functionality.
