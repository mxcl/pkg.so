history:
  adoption-history:
    - >
      LockRattler serves Mac administrators and technically minded users who want a
      quick visual check that core protections are enabled and Apple's background
      security data is current.
    - >
      It later became part of a family of complementary Eclectic Light tools:
      LockRattler for detailed checks, SilentKnight for automated checking and updating,
      `silnite` for command-line workflows, and SystHist for update history.
  package-nerd-significance:
    - >
      LockRattler exposes security state that macOS normally distributes across
      command-line tools, system databases, and configuration files. Homebrew cask
      installation makes this diagnostic freeware easy to deploy and update on supported
      Macs.
    - >
      Package users care about operating-system compatibility because Apple's security
      mechanisms and update formats change between macOS releases. LockRattler's release
      listings therefore retain older builds for older systems.
  project-history:
    - >
      Howard Oakley developed LockRattler at The Eclectic Light Company as a macOS
      utility for checking whether basic security systems are active, reporting
      security-configuration versions and installed updates, and helping users trigger
      updates.
    - >
      In 2019 LockRattler gained a dedicated product and support page and was migrated
      to Swift 5. Later releases added awareness of newer Apple security components and
      Apple-silicon-era hardware while maintaining older downloads for legacy macOS
      versions.
  related-projects:
    - >
      SilentKnight automates many security checks and update operations that LockRattler
      presents in greater detail.
    - >
      SystHist reports macOS system and security update history, while `silnite`
      provides related command-line and JSON-oriented workflows.
  sources:
    - >
      https://eclecticlight.co/2019/04/08/new-versions-of-lockrattler-and-systhist-with-product-and-support-pages/
    - https://eclecticlight.co/lockrattler-systhist/
  summary:
    - >
      LockRattler is a freeware macOS diagnostic application that checks the state of
      system protections and reports versions and update status for Apple's security
      data.
  timeline:
    - '2019: LockRattler 4.19 gained a dedicated product and support page and moved to Swift 5.'
    - '2022: Updates added support for Ventura, M2 Macs, and XProtect Remediator checks.'
    - '2023: LockRattler 4.37 was published for High Sierra through Ventura.'
  usage:
    - >
      Users run LockRattler to inspect protections such as System Integrity Protection
      and to compare installed security-configuration data with available updates. The
      application can also help check for and install missing silent security updates.
    - >
      It is primarily a diagnostic tool; users wanting automatic checking or
      command-line output are directed toward related tools such as SilentKnight and
      `silnite`.
