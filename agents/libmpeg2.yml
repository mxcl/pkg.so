repo: https://code.videolan.org/videolan/libmpeg2
docs:
  - https://libmpeg2.sourceforge.io/
  - https://libmpeg2.sourceforge.io/downloads.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libmpeg2 became a reusable decoder dependency because it was portable C code with
      a narrow library purpose and a bundled test program. The batch input lists broad
      package-manager coverage across Homebrew, Debian-family, Fedora-family, Arch,
      MacPorts, Nix, and openSUSE ecosystems.
    - >
      Upstream lists projects using libmpeg2, including xine, VideoLAN, MPlayer,
      GStreamer, XBMC, HandBrake, and other media tools, showing its historical role as
      a shared MPEG decoder component.
  package-nerd-significance:
    - >
      For package maintainers, libmpeg2 is notable as a compact codec library with
      hand-written CPU optimizations, GPL licensing, pkg-config metadata, and a long
      tail of reverse dependencies. It persists because legacy media formats and decoder
      dependencies remain relevant long after newer codecs appear.
  project-history:
    - >
      The official download page lists mpeg2dec 0.1.7 on November 2, 2000 with MPEG-1
      and MPEG-2 support, an integrated demuxer, and standards-compliance work. Later
      releases added a new libmpeg2 API, 4:2:2-profile decoding, robustness
      improvements, and platform optimizations.
    - >
      The 2008 libmpeg2 0.5.x releases brought newer compiler and system support, SSE2
      and ARM optimizations, aspect-ratio handling, and installation/pkg-config fixes.
      The official project page also notes VideoLAN maintainers joining the project.
  related-projects:
    - >
      Related projects include mpeg2dec, VideoLAN, xine, MPlayer, GStreamer, HandBrake,
      and liba52, all connected by the upstream site or project navigation.
  sources:
    - https://code.videolan.org/videolan/libmpeg2
    - https://libmpeg2.sourceforge.io/
    - https://libmpeg2.sourceforge.io/downloads.html
    - source_facts.package-manager
  summary:
    - >
      libmpeg2 is a free GPL C library for decoding MPEG-1 and MPEG-2 video streams,
      distributed with the mpeg2dec test program. It represents the small, focused
      multimedia libraries that predate the dominance of larger codec frameworks.
  timeline:
    - '2000-11-02: mpeg2dec 0.1.7 release with MPEG-1 and MPEG-2 support.'
    - '2002-11-27: mpeg2dec 0.3.0 release with a new libmpeg2 API.'
    - '2003-12-23: mpeg2dec 0.4.0 release with 4:2:2-profile decoding and robustness work.'
    - '2006-09-19: mpeg2dec 0.4.1 portability and bugfix release.'
    - '2008-07-12: libmpeg2 0.5.0 release with SSE2 and ARM optimizations.'
    - '2008-07-19: libmpeg2 0.5.1 release fixing header installation and pkg-config files.'
  usage:
    - >
      Downstream software uses libmpeg2 to decode MPEG-1 and MPEG-2 streams. Packagers
      and developers can use mpeg2dec as a simple test program and rely on the official
      conformance test-suite notes on the download page.
related-packages:
