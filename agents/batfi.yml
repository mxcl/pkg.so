history:
  adoption-history:
    - >
      BatFi is distributed directly by micropixels and through a Homebrew cask. It is a
      licensed application rather than an account-based service, and the official page
      says it requires Apple Silicon and macOS Sonoma or newer.
  package-nerd-significance:
    - >
      BatFi belongs to the ecosystem of Mac battery-limit tools that expose charging
      controls more directly than macOS. Its native menu-bar implementation, privileged
      helper, automation rules, global shortcuts, and Homebrew installation make it
      attractive to users who treat charging behavior as configurable system policy.
  project-history:
    - >
      The changelog documents a steady expansion from charge limiting into battery
      history, charts, localization, power-mode controls, Siri Shortcuts, global
      hotkeys, and improved helper reliability. Version 2.0 was presented as a major
      redesign of both core functionality and interface; later releases added
      compatibility updates for newer macOS versions.
  related-projects:
    - >
      The official FAQ contrasts BatFi with macOS Optimised Battery Charging, which
      automatically delays charging but offers less direct control.
  sources:
    - 'Official changelog: https://files.micropixels.software/batfi/BatFi-latest.html'
    - 'Official product and support page: https://micropixels.software/apps/batfi'
  summary:
    - >
      BatFi is a native macOS menu-bar application by micropixels for setting and
      automating Apple Silicon Mac battery charge limits, deliberately running on
      battery, switching power modes, and inspecting battery and energy information.
  timeline:
    - 'Version 1.2.0: Added sleep-related charge control and on-disk charging history'
    - >
      Version 2.0.0: Major redesign added global hotkeys, Siri Shortcuts, and on-demand
      discharge
    - 'Version 3.0.0: Added support for newer macOS releases and license removal'
  usage:
    - >
      Users choose a charging limit, optionally create time- and location-based rules,
      temporarily charge to 100%, force battery use, switch power modes, and inspect
      health, cycle count, temperature, remaining time, and energy-intensive
      applications. The app requires administrator authorization to control charging.
