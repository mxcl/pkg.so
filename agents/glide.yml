credentials-file-location: null
history:
  adoption-history:
    - >
      Glide is distributed for macOS and its official getting-started guide documents
      Homebrew installation. It integrates with macOS through Accessibility permissions
      and the operating system's Spaces model.
  package-nerd-significance:
    - >
      Glide belongs to the small ecosystem of macOS tiling window managers. Its
      text-based TOML configuration, command interface, and tree-oriented layouts make
      it particularly relevant to users who prefer keyboard-driven, reproducible desktop
      setups.
  project-history:
    - >
      Glide was developed as an open-source tiling window manager for macOS. It manages
      windows using tree layouts and also provides an experimental scrolling layout.
    - >
      The project exposes a command-oriented workflow and a TOML configuration system,
      allowing users to customize key bindings, layout behavior, animation, focus rules,
      gaps, and per-application window rules.
  related-projects:
    - macOS Spaces supplies the desktop-space model with which Glide integrates.
  sources:
    - https://github.com/tmandry/glide#readme
    - https://glidewm.org/
    - https://glidewm.org/guides/getting-started/
    - https://glidewm.org/reference/config/
  summary:
    - >
      Glide is a keyboard-oriented tiling window manager for macOS with tree layouts and
      declarative configuration.
  timeline:
    - Glide introduced tree-based tiling for macOS.
    - An experimental scrolling layout was added alongside the original tree layout.
  usage:
    - >
      Users launch Glide, grant Accessibility access, and toggle window management for
      individual macOS Spaces. Configuration can be reloaded with `glide config update`,
      including a watch mode that applies edits as the configuration file changes.
