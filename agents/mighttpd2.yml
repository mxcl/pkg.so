id: brew:mighttpd2
display-name: Mighttpd2
repo: https://github.com/kazu-yamamoto/mighttpd2
docs:
  - https://kazu-yamamoto.github.io/mighttpd2
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The project's technical identity is Haskell web-server experimentation made usable
      as a daemon: the home page lists static file serving, CGI GET and POST handling,
      redirection, language negotiation, reverse proxying, URL rewriting via HTTP
      redirects, and performance comparisons against nginx in a httperf ping-pong
      benchmark. Its documentation links to articles and slides about high-performance
      web servers, WAI/Warp, and the architecture of Mighttpd, tying the package to the
      Haskell networking ecosystem.
  sources:
    - https://formulae.brew.sh/formula/mighttpd2
    - https://github.com/kazu-yamamoto/mighttpd2
    - https://kazu-yamamoto.github.io/mighttpd2/
    - https://www.mew.org/~kazu/material/2011-mighttpd.pdf
  summary:
    - >
      Mighttpd2, invoked as mighty, is Kazu Yamamoto's Haskell HTTP server. Its home
      page describes it as a simple but practical file and CGI web server written in
      Haskell, implemented as a WAI application on Warp. The project is packaged with
      helper executables such as mighty-mkindex and mightyctl, reflecting its focus on
      serving static files, prebuilt directory indexes, and CGI workloads rather than
      being a broad application framework.
  usage:
    - >
      In package-manager terms, mighttpd2 is a niche web server for users who want a
      Warp/WAI-based standalone server for static and CGI content. It is much narrower
      than nginx, Apache httpd, or Caddy, but useful as a small Haskell-native server
      and as an example of deploying Haskell's high-concurrency HTTP stack.
related-packages:
  - id: brew:caddy
    reason: >
      Caddy is a broader web-server alternative for static files and reverse proxying
      when automatic HTTPS and a streamlined production configuration are more important
      than a Haskell/WAI-native server.
    rel: alternative
    sources:
      - https://kazu-yamamoto.github.io/mighttpd2/
      - https://caddyserver.com/docs/quick-starts/https
      - https://caddyserver.com/docs/quick-starts/reverse-proxy
  - id: brew:nginx
    reason: >
      nginx is an alternative for established high-traffic static-serving and
      reverse-proxy deployments with an extensive directive and module ecosystem.
    rel: alternative
    sources:
      - https://kazu-yamamoto.github.io/mighttpd2/
      - https://nginx.org/en/docs/beginners_guide.html
      - https://nginx.org/en/docs/http/ngx_http_proxy_module.html
