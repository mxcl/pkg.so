history:
  adoption-history:
    - >
      QuickSupport became TeamViewer’s standard attended-support endpoint for one-time
      assistance, machines where the user lacks administrator rights, and users who do
      not need persistent unattended access. TeamViewer offers it across desktop and
      mobile platforms and permits licensed customers to distribute branded modules.
  package-nerd-significance:
    - >
      QuickSupport is a canonical portable support utility: it deliberately avoids a
      permanent service and full installation while still providing a packaged,
      discoverable application. Keeping it separate from the full TeamViewer client lets
      managed macOS fleets install only the attended-support endpoint.
  project-history:
    - >
      TeamViewer created QuickSupport as a run-only module that accepts incoming
      remote-control connections but cannot initiate outgoing connections. It evolved to
      support customized branding, service cases, and deployment links generated through
      TeamViewer’s management tooling.
    - >
      In TeamViewer’s newer attended-support flow, an end user can still download
      QuickSupport from a shared session link and explicitly approve access, preserving
      the module’s user-present security model.
  related-projects:
    - TeamViewer
    - TeamViewer Host
    - TeamViewer QuickJoin
  sources:
    - >
      Official QuickSupport documentation:
      https://www.teamviewer.com/en/global/support/knowledge-base/teamviewer-classic/modules/quicksupport/
    - >
      Official attended-support documentation:
      https://www.teamviewer.com/en/global/support/knowledge-base/teamviewer-remote/remote-control/provide-attended-remote-support/
    - source_facts.description
    - source_facts.package-manager.brew-cask
  summary:
    - >
      TeamViewer QuickSupport is TeamViewer’s lightweight attended-support client. It
      allows a technician to connect to a user-present device without installing
      TeamViewer as a persistent service.
  timeline:
    - >
      2024: TeamViewer documents QuickSupport as its attended-access module for one-time
      remote support.
    - >
      2026: TeamViewer’s current workflow continues to use QuickSupport for end users
      joining shared remote-support sessions.
  usage:
    - >
      The recipient opens QuickSupport and shares the displayed session information or
      follows a supporter’s session link. The recipient must remain present and approve
      access; administrators needing unattended access are directed to TeamViewer Host
      instead.
