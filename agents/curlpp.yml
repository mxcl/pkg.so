history:
  adoption-history:
    - >
      cURLpp's adoption is mostly as a development library package, especially where C++
      applications prefer packaged headers and a small wrapper library over hand-written
      libcurl handle management. The supplied package-manager facts show it available in
      Homebrew, Debian and Ubuntu as libcurlpp-dev, Fedora, and Nix.
  package-nerd-significance:
    - >
      cURLpp is package-nerd significant as a thin binding package: it tracks libcurl
      compatibility, ships headers and build metadata such as curlpp-config, and sits in
      the common distro category of language-level wrappers around a core C networking
      library.
  project-history:
    - >
      The official site and README describe cURLpp as a wrapper for libcURL and
      explicitly frame it as an optional C++ layer rather than a replacement for direct
      libcurl use. The GitHub tags page shows release tags from 0.7.1 in 2007 through
      0.8.1 in 2017.
  related-projects:
    - >
      libcurl is the underlying library; curl and other libcurl language bindings are
      the closest ecosystem neighbors.
  sources:
    - https://www.curlpp.org/
    - https://github.com/jpbarrette/curlpp
    - https://github.com/jpbarrette/curlpp/tags
  summary:
    - >
      cURLpp is a C++ wrapper around libcurl, intended for projects that want an
      object-oriented, type-safe, exception-safe layer over the C libcurl API.
  timeline:
    - '2007: GitHub tags show v0.7.1.'
    - '2008: GitHub tags show v0.7.2.'
    - '2009: GitHub tags show v0.7.3.'
    - '2017: GitHub tags show v0.8.1.'
  usage:
    - >
      Developers use cURLpp when they want libcurl capabilities through C++ standard
      library structures, exceptions, and type-safe options. The official documentation
      points users to a programming guide and examples directory, while also warning
      that direct libcurl is sufficient when the wrapper's features are not needed.
related-packages:
  - id: brew:curl
    reason: >
      Choose curl/libcurl when direct access to the maintained C API is preferable to
      cURLpp's optional object-oriented C++ wrapper.
    rel: alternative
    sources:
      - https://www.curlpp.org/
      - https://curl.se/libcurl/
