history:
  adoption-history:
    - >
      Typinator developed a long-running macOS following around system-wide text
      expansion, automatic correction, reusable snippet sets, and GUI-based automation.
      Homebrew Cask provides a package-manager installation route alongside the vendor's
      direct download.
    - >
      The product later expanded beyond one Mac through shared sets and optional
      synchronization using user-chosen storage. Typinator 10 added an iOS companion app
      and rebuilt its storage and synchronization architecture.
  package-nerd-significance:
    - >
      Typinator represents the polished proprietary side of text-expander culture: a
      native GUI and vendor-supported workflow rather than editable configuration files
      and a background daemon.
    - >
      It is also an instructive Homebrew Cask package because installation is
      package-managed while snippet data, licensing, accessibility permission,
      synchronization, and application updates remain desktop-application concerns.
  project-history:
    - >
      Typinator is developed by Austrian software vendor ergonis, founded in 2002. The
      product automates repetitive typing by replacing abbreviations with text,
      formatted content, images, dates, calculations, scripts, or other reusable
      expansions.
    - >
      The official version history documents years of macOS development, including
      Typinator 7.9 in 2019, a redesigned Typinator 9 in 2023, and Typinator 10's new
      storage architecture and iOS companion in 2026.
  related-projects:
    - >
      Espanso is an open-source, cross-platform text-expansion alternative configured
      with YAML files; Typinator instead emphasizes a native graphical interface, vendor
      support, and Mac/iOS workflows.
  sources:
    - >
      https://blog.ergonis.com/hc/en-us/articles/27897272054684-Typinator-vs-Espanso-2026-App-or-Config-File-The-Choice-Decides-Everything-Else
    - https://ergonis.com/en/about/
    - https://ergonis.com/en/typinator/
    - https://ergonis.com/en/typinator/version-history/mac/
    - https://help.typinator.ergonis.com/hc/en-us
    - source_facts.package-manager
  summary:
    - >
      Typinator is a native productivity application from ergonis that expands short
      abbreviations into frequently used text, formatted content, images, and dynamic
      material across applications.
  timeline:
    - '2019: The official version history records Typinator 7.9 for macOS.'
    - '2023: Typinator 9.0 introduced a redesigned interface and expanded localization.'
    - >
      2026: Typinator 10.0 introduced an iOS companion, new storage architecture, and
      broader synchronization options.
  usage:
    - >
      Users create abbreviations and expansions in Typinator's graphical interface,
      organize them into sets, and then type those abbreviations in other applications
      to insert the stored content.
    - >
      Common workflows include email templates, automatic typo correction, code or
      boilerplate insertion, reusable AI prompts, dynamic dates and fields, and shared
      organizational snippet libraries.
related-packages:
  - id: cask:espanso
    reason: >
      Choose Espanso when you want a free, open-source text expander with YAML
      configuration and Windows/Linux support; choose Typinator for a native Mac/iOS GUI
      and vendor-supported team workflows.
    rel: alternative
