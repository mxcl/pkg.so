config-file-location:
  unix:
    - ~/.config/fabric/config.yaml
credentials-file-location:
  unix:
    - ~/.config/fabric/.env
history:
  adoption-history:
    - >
      Fabric's adoption followed the broader CLI-and-LLM trend: users wanted prompt
      workflows they could pipe text into, version in Git, and invoke from shells
      instead of only using web chat interfaces. The README points to intro videos and a
      large set of patterns for summarization, paper analysis, code explanation, social
      posts, and other repeatable tasks.
    - >
      The project has kept widening provider support. The README update log lists
      additions for OpenAI Codex, Azure AI Gateway, Microsoft 365 Copilot, DigitalOcean
      GenAI, GitHub Models, Venice AI, Z AI, Abacus, Anthropic model updates,
      internationalization, Windows ARM and Linux ARM binaries, and Swagger API docs.
  package-nerd-significance:
    - >
      Fabric is package-nerd significant because it turns prompts into installable,
      inspectable command-line artifacts. It is part of the 2024-2026 wave of LLM
      tooling where package managers distribute not only compilers and CLIs, but also
      opinionated prompt workflows.
    - >
      The `fabric-ai` Homebrew naming detail is also notable: it avoids colliding with
      the older Python `fabric` package while preserving the upstream tool's identity
      through a recommended alias.
  project-history:
    - >
      Fabric was created after the late-2022 surge in modern AI tools. Its README argues
      that AI had an integration problem rather than a capabilities problem, and
      presents Fabric as a way to organize prompts by real-world task so they can be
      reused across workflows.
    - >
      The project started publicly in early 2024 and grew rapidly around the idea that
      prompt collections could be packaged like command-line tools. The README describes
      Fabric as both a pattern library and, for command-line-focused users, an interface
      for running those patterns directly.
    - >
      The current project is implemented and distributed as a fast-moving CLI with
      release binaries, shell completions, a REST API server, provider integrations, and
      package-manager installs. Its README notes that Homebrew and Arch Linux package
      the executable as `fabric-ai`, with an alias suggested for users who want to type
      `fabric`.
  related-projects:
    - >
      Fabric integrates with LLM providers and backends such as OpenAI, Anthropic, Azure
      OpenAI, Google Vertex AI, AWS Bedrock, Ollama, GitHub Models, and others.
    - The Homebrew package is named `fabric-ai` to distinguish it from Python Fabric.
  sources:
    - https://api.github.com/repos/danielmiessler/fabric
    - https://github.com/danielmiessler/fabric
    - https://github.com/danielmiessler/fabric/blob/main/README.md
    - https://github.com/danielmiessler/fabric/releases
    - https://github.com/danielmiessler/fabric/tree/main/docs
  summary:
    - >
      Fabric is Daniel Miessler's open-source framework for organizing reusable AI
      prompts, called patterns, and running them from a CLI or related interfaces.
  timeline:
    - '2024: The Fabric repository is created.'
    - >
      2025: Releases add new binary targets, provider integrations,
      internationalization, and REST API documentation.
    - >
      2026: README update log lists Microsoft 365 Copilot, Azure AI Gateway, OpenAI
      Codex backend, and Anthropic model support updates.
  usage:
    - >
      The core usage model is to select a pattern and feed it content. Users can run
      Fabric from the CLI, install or update patterns, create custom patterns, map
      patterns to models, add shell aliases, or run its REST API server for local
      integrations.
    - >
      Because Fabric treats prompts as named assets, it behaves like a package of
      workflows rather than a single chatbot. That makes it useful for people who want
      repeatable LLM operations in shell pipelines, note-taking systems, coding
      workflows, or personal knowledge processes.
related-packages:
  - id: brew:ollama
    reason: >
      Use Ollama alongside Fabric when you want Fabric Patterns to run against locally
      served models instead of a hosted model API.
    rel: adjacent_workflow
    sources:
      - https://github.com/danielmiessler/fabric/blob/main/README.md
      - https://docs.ollama.com/
