history:
  adoption-history:
    - >
      Faker became common infrastructure for Python tests, fixtures, demos,
      anonymization workflows, and sample-data generation. The official docs call out
      direct Python use, command-line invocation, pytest fixture support, bundled
      providers, community providers, and localization.
    - >
      The input package facts show it packaged for Homebrew, Debian, and Ubuntu, which
      reflects adoption beyond PyPI into operating-system and developer workstation
      package channels.
  package-nerd-significance:
    - >
      Package maintainers care about Faker because it sits at the intersection of
      libraries and CLI tooling: it exposes a Python API, a command-line executable,
      localization datasets, pytest integration, and a large provider surface that
      changes as real-world formats evolve.
    - >
      Its package-history details matter during dependency curation because older
      ecosystems may still reference fake-factory, Python 2 compatibility ended at the
      3.x/4.x transition, and modern releases continuously add locale data and provider
      behavior.
  project-history:
    - >
      The project presents itself as a Python fake-data generator inspired by PHP Faker,
      Perl Faker, and Ruby Faker. PyPI metadata has an archived 0.0.2 upload in 2010,
      while the repository changelog records 0.1 as the first release in 2012;
      subsequent history shows years of provider, locale, CLI, and compatibility work.
    - >
      Faker was previously distributed under the fake-factory name; the official README
      says that package name was deprecated by the end of 2016, and the changelog
      records the PyPI package rename to Faker in 2016.
  related-projects:
    - >
      The official README credits PHP Faker, Perl Faker, and Ruby Faker as inspirations,
      and the docs list bundled and community providers as extension points around the
      core generator.
  sources:
    - >
      https://faker.readthedocs.io/en/master/ - official documentation for purpose,
      usage, providers, localization, pytest fixture, and CLI.
    - >
      https://pypi.org/pypi/Faker/json - official PyPI metadata for package name,
      summary, project URLs, and release metadata.
    - >
      https://raw.githubusercontent.com/joke2k/faker/master/CHANGELOG.md - official
      changelog for first release, package rename, major releases, multiple-locale
      support, and Python support changes.
    - >
      https://raw.githubusercontent.com/joke2k/faker/master/README.rst - official README
      for project description, inspirations, compatibility notes, fake-factory
      deprecation, and basic usage.
    - >
      source_facts.package-manager - supplied input lists Homebrew, Debian, and Ubuntu
      packaging.
  summary:
    - >
      Faker is a Python package and command-line tool for generating fake data such as
      names, addresses, text, localized values, and provider-specific test fixtures.
  timeline:
    - '2010: PyPI metadata has an archived Faker 0.0.2 upload.'
    - '2012: Official changelog records Faker 0.1 as the first release.'
    - '2016: PyPI package was renamed to Faker and fake-factory was deprecated.'
    - '2018: Faker 1.0.0 was released.'
    - '2019: Faker 3.0.0 added multiple-locale data generation.'
    - '2020: Faker 4.0.0 removed Python 2.7 support; Faker 5.0.0 dropped Python 3.5 support.'
  usage:
    - >
      Typical use starts with installing Faker and constructing a faker.Faker()
      generator, then calling provider methods such as name(), address(), text(), or
      locale-specific providers. The installed faker CLI can emit generated values
      directly and supports output files, locales, repeat counts, separators, and custom
      provider imports.
