history:
  adoption-history:
    - >
      Capacities expanded beyond its web experience to dedicated desktop applications
      for macOS, Windows, and Linux, plus companion applications for iOS and Android.
      The official site describes a community of thousands of thinkers, while the
      documentation recommends the desktop application for its performance and native
      integrations.
  package-nerd-significance:
    - >
      Capacities is representative of a newer generation of knowledge-management
      applications distributed as proprietary desktop casks while retaining a
      cloud-backed, cross-device model. Its object-first organization contrasts with
      file-and-folder note applications and makes it relevant to users comparing
      personal knowledge-base paradigms.
  project-history:
    - >
      Capacities developed as an object-oriented personal knowledge-management service:
      notes are modeled as connected objects with properties rather than as files placed
      in folders. The product subsequently grew into a cross-platform suite spanning
      web, desktop, and mobile clients, with official user documentation and a REST API
      for integrations.
  related-projects:
    - >
      Capacities occupies the same broad personal-knowledge-management space as object-,
      graph-, and backlink-oriented note systems, while differentiating itself through
      typed objects, spaces, collections, and a hosted cross-device service.
  sources:
    - 'Official developer documentation: https://developers.capacities.io/'
    - 'Official product site: https://capacities.io/'
    - 'Official user documentation: https://docs.capacities.io/'
  summary:
    - >
      Capacities is a cross-platform personal knowledge-management application built
      around connected, typed objects. It combines writing, organization, search, daily
      notes, media, and optional AI features in a hosted workspace.
  timeline:
    - >
      The official sources reviewed do not provide a dependable founding or
      first-release date.
    - >
      2026: Capacities offered web, macOS, Windows, Linux, iOS, and Android clients
      together with official user and developer documentation.
  usage:
    - >
      Users capture ideas as objects, customize their properties, connect them through
      links and tags, organize them into collections, and work with daily notes. Spaces
      separate knowledge bases, while the desktop application adds stronger local file,
      download, backup, and native-integration behavior. Developers can use the official
      REST API to read and write workspace objects and content.
