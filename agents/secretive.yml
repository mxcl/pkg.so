history:
  adoption-history:
    - >
      Secretive developed an active open-source user and contributor community around
      hardware-backed SSH authentication on macOS. The project supports direct downloads
      and Homebrew installation, community localization, and integrations with standard
      SSH and Git workflows.
    - >
      Later releases strengthened the auditable distribution model with GitHub Actions
      builds and, beginning with Secretive 3.0, GitHub Artifact Attestation. Version 3
      also expanded the design with enhanced process isolation, Swift concurrency
      checks, newer key types, and a dedicated integrations interface.
  package-nerd-significance:
    - >
      Secretive gives Mac users an alternative to ordinary exportable private-key files:
      signing remains available through familiar SSH-agent interfaces while private key
      material remains hardware-backed and non-exportable. Its open source,
      dependency-conscious, auditable-build approach makes it especially interesting to
      security-minded package users.
  project-history:
    - >
      Max Goedjen created Secretive as a macOS interface for generating and using SSH
      keys backed by the Secure Enclave. The project credits the earlier `sekey` project
      as an inspiration.
    - >
      The application evolved beyond Secure Enclave keys to support smart cards,
      public-key file representations, SSH agent forwarding, signing workflows,
      notifications when keys are used, and stronger build and runtime isolation. The
      security policy deliberately emphasizes a small, auditable design with no
      third-party runtime dependencies.
  related-projects:
    - Secretive was inspired by the `sekey` project.
    - >
      It interoperates with OpenSSH and Git through the SSH-agent protocol and
      `SSH_AUTH_SOCK`.
    - Smart cards such as YubiKey can be used on Macs without a suitable Secure Enclave.
  sources:
    - https://github.com/maxgoedjen/secretive
    - https://github.com/maxgoedjen/secretive/blob/main/FAQ.md
    - https://github.com/maxgoedjen/secretive/blob/main/SECURITY.md
    - https://github.com/maxgoedjen/secretive/releases
  summary:
    - >
      Secretive is an open-source macOS SSH-agent application that creates and uses
      hardware-backed keys through the Secure Enclave or a smart card, keeping private
      key material non-exportable.
  timeline:
    - >
      Early project era: Secretive established a Secure Enclave-backed SSH-agent
      workflow inspired by `sekey`.
    - >
      Secretive 2.2: Public-key file representations made it easier to select individual
      Secretive keys from SSH configuration.
    - >
      Secretive 3.0: The project added an updated interface, newer key support, enhanced
      isolation and security checks, and attested builds.
  usage:
    - >
      Users create a key in Secretive, copy its public half to the relevant server or
      code host, and configure SSH-aware tools to use Secretive's agent. The official
      FAQ documents `~/.ssh/config` for selecting keys or enabling agent forwarding.
      Private keys cannot be imported, exported, backed up, or transferred, so a new Mac
      normally requires newly generated keys.
