history:
  adoption-history:
    - >
      The application became a long-lived macOS workflow utility and is distributed
      through Homebrew as the cd-to cask. Its upstream history documents support for
      multiple shells and, in earlier releases, several terminal applications through
      plugins.
  package-nerd-significance:
    - >
      cd to is characteristic of focused macOS utility packages: it removes a small but
      frequent context switch between Finder and the shell. Its documented history from
      AppleScript to Objective-C also follows the evolution of macOS automation and
      application packaging.
  project-history:
    - >
      Jay Tuley created cd to as a Finder toolbar application that opens a terminal at
      the directory currently shown or selected in Finder. The first release was written
      in AppleScript; version 2.0 was ported to Objective-C and appscript for faster
      execution and better alias handling. Later releases adopted Apple Events, hardened
      runtime support, notarization, and a universal binary for Apple Silicon and Intel.
  related-projects:
    - >
      Earlier releases supplied plugins for Terminal, iTerm, X11/xterm, and Path Finder.
      Version 3.0 simplified the application to Terminal.app support.
  sources:
    - https://github.com/jbtule/cdto#readme
    - source_facts.package-manager
  summary:
    - >
      cd to is a macOS Finder toolbar application that opens Terminal in the current
      Finder directory.
  timeline:
    - '2003: Version 1.0 targeted Mac OS X Panther and was implemented in AppleScript.'
    - '2005: Version 2.0 was ported to Objective-C using appscript.'
    - 'Version 3.0: The application was rewritten around Apple Events, hardened, and notarized.'
    - 'Version 3.1.3: The application became a universal binary for Apple Silicon and Intel.'
  usage:
    - >
      Users copy the application into Applications, Command-drag it into the Finder
      toolbar, and click it while browsing a folder. It opens a terminal window at that
      location and works independently of whether the user's shell is Bash, Fish, or
      Zsh. Optional behavior is configured with documented macOS defaults commands.
