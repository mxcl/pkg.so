id: brew:comtrya
display-name: Comtrya
repo: null
docs:
  - https://comtrya.dev/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its package-manager significance is mostly as a niche Homebrew-packaged CLI rather
      than a broadly adopted platform; the official sources do not provide enough
      release or user-adoption narrative for a fuller chronology.
  package-nerd-significance:
    - >
      Comtrya is notable for package catalogs because it represents the
      dotfiles/configuration-management pattern in a small Rust CLI with declarative
      manifests and cross-platform ambitions.
  project-history:
    - >
      The public documentation describes Comtrya around declarative manifests, actions,
      variants, privilege escalation, and package operations, placing it in the same
      practical space as dotfile managers and lightweight configuration-management
      tools.
  sources:
    - https://comtrya.dev/
    - https://github.com/comtrya/comtrya
  summary:
    - >
      Comtrya is a Rust-based system provisioning and configuration tool whose official
      mdBook presents it as a way to configure machines with YAML or TOML manifests.
  usage:
    - >
      Users write manifests in YAML or TOML and run the CLI to apply system, file,
      directory, package, user, and macOS-specific actions.
related-packages:
  - id: brew:ansible
    reason: >
      Ansible is the stronger alternative for agentless automation across remote hosts
      and managed fleets, while Comtrya's own rationale focuses on simpler localhost and
      personal-machine provisioning.
    rel: alternative
    sources:
      - https://github.com/comtrya/comtrya
      - https://docs.ansible.com/projects/ansible/latest/index.html
