credentials-file-location: null
history:
  adoption-history:
    - >
      Before open sourcing, Mako was used internally at Ant Group. The official site
      says it had been used in hundreds of production projects at Ant Group and tested
      across thousands of older projects and npm package versions for compatibility.
    - >
      For public users, the documented entry points are `npm create mako`, direct docs
      usage, and Umi integration. The open-source announcement explicitly targeted Umi
      users by showing how to enable Mako in Umi 4.2.0 or later, which made adoption
      easiest for projects already in that framework family.
  package-nerd-significance:
    - >
      Mako matters to package-tooling watchers because it is part of the Rust rewrite
      wave in frontend infrastructure, but with an enterprise migration story rather
      than a purely greenfield one. It competes in the same problem space as Webpack,
      Vite, Rspack, Farm, Turbopack, SWC, and esbuild while emphasizing compatibility
      with existing Umi and Webpack-shaped projects.
  project-history:
    - >
      The Mako team says the project began in March 2023 as Ant Group explored
      Rust-based build tooling to solve frontend build-speed problems. The official
      open-source announcement gives the core timeline: project kickoff in 2023.3, first
      usable version in 2023.7, internal Ant Group release on 2023.11.24, and public
      open source release in June 2024.
    - >
      Mako was originally presented from the UmiJS ecosystem and later surfaced through
      the Utoo repository, a unified toolchain for web development. The Utoo README
      describes a Rust and Turbopack-based toolchain with package management, bundling,
      and command execution components; Mako/utoopack is the bundler side of that
      ecosystem.
  related-projects:
    - >
      Related projects include Umi, Ant Design, Webpack, Vite, Rspack, Farm, Turbopack,
      SWC, Oxc, and Utoo's `@utoo/pack` toolchain.
  sources:
    - https://api.github.com/repos/utooland/utoo
    - https://github.com/utooland/utoo
    - https://makojs.dev/
    - https://makojs.dev/blog/mako-open-sourced
    - https://makojs.dev/docs
    - https://makojs.dev/docs/config
  summary:
    - >
      Mako is a Rust-based web bundler for JavaScript and TypeScript applications,
      libraries, and frameworks. The official site describes it as extremely fast and
      production-grade, with zero-config defaults, HMR, code splitting, TypeScript,
      Less, CSS Modules, React support, and Umi integration.
  timeline:
    - '2023-03: Mako project work begins.'
    - '2023-07: The team reaches a first usable version.'
    - '2023-11-24: Mako is officially released internally at Ant Group.'
    - '2024-06-28: Mako is announced as open source.'
    - '2026: The Utoo repository continues development of the wider toolchain.'
  usage:
    - >
      Mako can be tried with `npm create mako` and configured with a `mako.config.json`
      file at a project root. The config docs show entry points, output behavior, dev
      server settings, code splitting, externals, CSS handling, and other bundler
      options; when used through Umi, the docs recommend configuring the bundler through
      `.umirc.ts` or `config/config.ts` instead.
related-packages:
  - id: brew:vite
    reason: >
      Choose Vite for its mature plugin-oriented development-server and build ecosystem;
      choose Mako when Rust-backed bundling, built-in Webpack-shaped features, or Umi
      integration is the priority.
    rel: alternative
    sources:
      - https://makojs.dev/
      - https://vite.dev/guide/why.html
