history:
  adoption-history:
    - >
      The project sits in the OpenFeature ecosystem and advertises provider support
      across backend, frontend, and mobile languages. Its adopters list includes
      organizations and open-source projects using it for backend services, frontend
      applications, OpenFeature-based flagging, and relay-proxy deployments.
  package-nerd-significance:
    - >
      For package maintainers, the relay proxy is the packaged operational face of a
      library-first Go project. Shipping it as a Homebrew formula gives developers a
      database-free feature-flag daemon they can install locally for testing, wire into
      containers, or run as infrastructure beside services.
  project-history:
    - >
      The parent GO Feature Flag repository was created in 2020 as a Go-oriented feature
      flag library. Its README explains that the project began as a solution for the Go
      language and later expanded through OpenFeature standardization, with the relay
      proxy providing an API layer over the Go module so non-Go applications could share
      the same evaluation logic.
  related-projects:
    - OpenFeature
    - GO Feature Flag Go module
    - GO Feature Flag OpenFeature providers
  sources:
    - https://github.com/thomaspoignant/go-feature-flag
    - https://github.com/thomaspoignant/go-feature-flag/blob/main/ADOPTERS.md
    - https://github.com/thomaspoignant/go-feature-flag/releases
    - https://gofeatureflag.org/
    - https://gofeatureflag.org/docs/getting-started
    - https://gofeatureflag.org/docs/relay-proxy
  summary:
    - >
      GO Feature Flag Relay Proxy is the server component of GO Feature Flag, an
      open-source feature flag system written in Go. The relay proxy exposes
      feature-flag evaluation APIs so applications in several languages can use GO
      Feature Flag through OpenFeature providers or direct HTTP calls.
  timeline:
    - '2020: The GO Feature Flag repository was created.'
    - "2024: v1.29.x and later releases appeared on GitHub's release stream."
    - >
      2026: v1.54.x releases showed the relay-proxy and provider ecosystem under active
      release management.
  usage:
    - >
      Practitioners run the relay proxy as the central flag-evaluation service, usually
      with a YAML configuration file passed through `--config` or mounted into a
      container. The proxy loads flag definitions from retrievers such as files, HTTP,
      S3, or Kubernetes, stores them in memory, polls for changes, and exposes APIs that
      OpenFeature SDK providers call from application code.
related-packages:
  - id: brew:flagd
    reason: >
      Choose flagd when you want a smaller OpenFeature-native evaluation daemon centered
      on flag-definition sources and provider protocols; choose GO Feature Flag when its
      retrievers, exporters, notifications, and rollout tooling better fit the
      deployment.
    rel: alternative
    sources:
      - https://flagd.dev/
      - https://gofeatureflag.org/docs/relay-proxy
