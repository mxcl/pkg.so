credentials-file-location: null
history:
  adoption-history:
    - >
      xtitle spread because xterm title escape sequences are useful but annoying to
      remember. It appears in distro package sets mostly as a tiny convenience command
      for shell prompts, scripts, and users who keep many terminal windows open.
  package-nerd-significance:
    - >
      xtitle is a tiny-package example: a one-purpose script became package-worthy
      because it captured a common X11 terminal idiom, documented it, and made it
      portable enough for package managers to ship.
  project-history:
    - >
      Stephen B. Kinzler's page describes xtitle as a tool so straightforward he
      originally would not have expected to package it, but it escaped into wider use
      and was given a man page, Imakefile, and companion `xtctl` script. The copyright
      span starts in 1993, and the manpage author line records updates in 1993, 1998,
      2000, and 2009.
  related-projects:
    - 'xterm: the terminal whose title/icon-name control sequences xtitle emits.'
    - 'dtterm: listed by the manpage as another terminal known to work.'
    - 'xtermcontrol: a broader command-line controller for xterm properties.'
  sources:
    - https://kinzler.com/me/xtitle/
    - https://kinzler.com/me/xtitle/src/xtitle.html
    - https://kinzler.com/me/xtitle/src/xtitle.man
    - https://tldp.org/HOWTO/Xterm-Title-3.html
  summary:
    - >
      xtitle is a compact shell-script utility for setting the window title and icon
      name of an xterm or xterm-like terminal by emitting the appropriate xterm control
      sequence.
  timeline:
    - "1993: xtitle's copyright and manpage history begin."
    - '1998: Manpage author line records a November 1998 update.'
    - '2000: Manpage author line records a March 2000 update.'
    - >
      2009: Manpage author line records a December 2009 update; current manual page
      reports version 1.0.4.
    - '2014: Upstream page copyright range extends through 2014.'
  usage:
    - >
      Run `xtitle build logs`, `xtitle -t name`, or `xtitle -i icon-name` inside an
      xterm-like terminal to update the window title and/or icon name. The tool prints
      OSC title-control sequences rather than talking to Xlib directly.
