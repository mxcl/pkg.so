history:
  adoption-history:
    - >
      Chipmunk is distributed as a native desktop application for macOS, Windows, and
      Linux, including installer and portable builds. The project serves general
      log-analysis work while providing specialized support for automotive diagnostic
      and network trace formats.
  package-nerd-significance:
    - >
      Chipmunk is notable for treating very large and live-streamed logs as structured,
      searchable data rather than ordinary text files. Its move to a Rust-native
      application, cross-platform installers, CLI, and WebAssembly-based plugin
      facilities gives package maintainers a project spanning desktop, command-line, and
      extensibility ecosystems.
  project-history:
    - >
      ESR Labs developed Chipmunk as an open-source log analyzer and viewer. The current
      application is written in Rust and emphasizes opening very large files without
      unnecessary copying while also collecting live logs over TCP, UDP, serial
      connections, or child-process output.
  related-projects:
    - >
      Chipmunk operates in the log-viewer and trace-analysis space and supports DLT,
      SOME/IP, pcap, and pcapng workflows. Its plugin system permits additional parsers
      and input sources.
  sources:
    - https://esrlabs.github.io/chipmunk/
    - https://esrlabs.github.io/chipmunk/cli/
    - https://esrlabs.github.io/chipmunk/installation/
    - https://github.com/esrlabs/chipmunk
    - source_facts.package-manager
  summary:
    - >
      Chipmunk is a cross-platform, Rust-based desktop application for viewing,
      searching, filtering, collecting, and visualizing large log and trace files.
  timeline:
    - >
      2020: The project documented its focus on interactive analysis of multi-gigabyte
      log files.
    - >
      The current generation adopted a native Rust architecture and provides a companion
      command-line tool.
  usage:
    - >
      Developers and analysts open large logs, build reusable color-coded filters,
      bookmark or annotate entries, merge files by timestamp, extract metrics with
      regular expressions, and graph values over time. Automotive users can inspect DLT
      and SOME/IP traces, while live sessions can collect data from sockets, serial
      ports, or command output.
