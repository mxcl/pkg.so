id: cask:qt-creator
display-name: Qt Creator
repo: https://code.qt.io/cgit/qt-creator/qt-creator.git
docs:
  - https://doc.qt.io/qtcreator
config-file-location:
  linux:
    - ~/.config/QtProject
    - ~/.local/share/data/QtProject/qtcreator
  macos:
    - ~/.config/QtProject
    - ~/Library/Application Support/QtProject/Qt Creator
  windows:
    - '%APPDATA%\QtProject'
    - '%LOCALAPPDATA%\QtProject'
credentials-file-location: null
history:
  adoption-history:
    - >
      Qt Creator launched alongside the Qt 4.5 era in 2009 and became the first-party
      IDE distributed for Qt development. Its integration with Qt kits, qmake, CMake,
      QML tooling, debuggers, and device targets made it a standard entry point for Qt
      application developers.
    - >
      It remains available as a standalone IDE and through Qt installation workflows,
      while package managers provide an alternative installation path for developers who
      manage tools independently.
  package-nerd-significance:
    - >
      Qt Creator is important in developer-tool packaging because it is both a
      substantial cross-platform C++ application and the reference IDE for the Qt
      ecosystem. Packagers must distinguish the IDE from the Qt SDK and toolchains it
      discovers, since installing Qt Creator alone does not necessarily install Qt, a
      compiler, or every build tool.
  project-history:
    - >
      The IDE began inside Trolltech as a Creative Friday project called Workbench, was
      subsequently called Project Greenhouse, and was renamed Creator shortly before
      release. An official retrospective says work had begun more than two years before
      the Qt Creator 1.2 release in June 2009.
    - >
      Qt Creator 1.0 was publicly released in early March 2009. The project subsequently
      expanded beyond its original Qt-focused editing workflow to support multiple build
      systems, debuggers, version-control systems, devices, plugins, and QML
      development.
  related-projects:
    - >
      Qt, the cross-platform framework for which Qt Creator provides first-party
      development tooling.
    - qmake and CMake, build systems supported in Qt Creator workflows.
    - Qt Design Studio, a related Qt product focused on user-interface design.
  sources:
    - https://doc.qt.io/qtcreator/
    - https://wiki.qt.io/Qt_History
    - https://www.qt.io/blog/2009/04/09/working-hard-on-qtcreator-11
    - https://www.qt.io/blog/2009/06/25/qt-creator-12-released
  summary:
    - >
      Qt Creator is the Qt project's cross-platform integrated development environment
      for C++, QML, and application development. It originated inside Trolltech and
      became part of the official Qt development-tool stack in 2009.
  timeline:
    - >
      Circa 2007: Development begins internally under the names Workbench and Project
      Greenhouse.
    - >
      2009: Qt Creator 1.0 is publicly released and Qt Creator launches with the Qt 4.5
      generation.
    - '2009: Qt Creator 1.2 adds further debugger and editor integration.'
  usage:
    - >
      Developers use Qt Creator to edit, build, run, debug, profile, and deploy
      applications. Projects are configured through kits that associate Qt
      installations, compilers, debuggers, devices, and build systems.
