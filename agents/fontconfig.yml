  unix:
    - /etc/fonts/fonts.conf
    - /etc/fonts/conf.d
    - $XDG_CONFIG_HOME/fontconfig/fonts.conf
    - $XDG_CONFIG_HOME/fontconfig/conf.d
    - ~/.fonts.conf
    - ~/.fonts.conf.d
credentials-file-location: null
history:
  adoption-history:
    - >
      fontconfig became infrastructure rather than an end-user application. Its value
      came from being shared by many applications and toolkits, independent of the X
      Window System, with command-line utilities such as `fc-cache`, `fc-list`,
      `fc-match`, `fc-query`, and related inspection tools.
    - >
      The release directory and tag history show a long-running 2.x series, from early
      `fcpackage` and 2.2-era releases through current stable releases documented on the
      freedesktop project page.
  package-nerd-significance:
    - >
      fontconfig is one of the packages that makes desktop Linux font behavior feel
      coherent. Package maintainers care about it because bad cache handling, misplaced
      config snippets, or mismatched defaults can affect text rendering across a whole
      system.
  project-history:
    - >
      The freedesktop project page describes fontconfig as a library for configuring and
      customizing font access. Its README and user documentation emphasize automatic
      font discovery, font-name substitution, language coverage matching, XML
      configuration, and cooperation with FreeType and the X Render Extension.
    - >
      The user documentation explains the core architecture: a configuration module
      builds internal state from XML files, while a matching module accepts font
      patterns and returns the nearest matching font. The design goal was to centralize
      font installation and customization so applications would not each invent private
      font configuration systems.
  related-projects:
    - >
      fontconfig is explicitly related to FreeType and the X Render Extension, and it
      sits alongside freedesktop.org desktop plumbing used by font-aware applications
      and toolkits.
  sources:
    - https://gitlab.freedesktop.org/fontconfig/fontconfig/-/raw/main/README.md
    - https://wiki.freedesktop.org/www/Software/fontconfig
    - https://www.freedesktop.org/software/fontconfig/fontconfig-user.html
    - https://www.freedesktop.org/software/fontconfig/release/
  summary:
    - >
      fontconfig is the freedesktop.org font discovery, matching, and configuration
      library used by Unix-like desktop and application stacks to centralize font
      access.
  timeline:
    - >
      2000s: Early fontconfig 2.x and `fcpackage` tags appear in the freedesktop release
      history.
    - '2012: The release directory lists fontconfig 2.10.0.'
    - '2018: The release directory lists fontconfig 2.13.0.'
    - '2025: The release directory lists fontconfig 2.16.0.'
    - >
      2026: The project page identifies the current stable series as 2.17.1, while
      repository tags show later 2.18.x tags.
  usage:
    - >
      Administrators and users configure fontconfig through XML files such as
      `/etc/fonts/fonts.conf`, `/etc/fonts/conf.d`,
      `$XDG_CONFIG_HOME/fontconfig/fonts.conf`, and per-user legacy files. Applications
      use the library to locate fonts, substitute missing families, and obtain file and
      rendering metadata.
    - >
      The command-line tools form a practical maintenance layer: `fc-cache` refreshes
      caches, `fc-list` enumerates fonts, `fc-match` shows matching decisions, and
      `fc-query` or `fc-scan` inspect font files.
related-packages:
  - id: brew:freetype
    reason: >
      Fontconfig discovers and selects font files but intentionally leaves glyph
      rendering to engines such as FreeType, making the two libraries complementary
      parts of a Unix text-rendering stack.
    rel: adjacent_workflow
    sources:
      - https://wiki.freedesktop.org/www/Software/fontconfig/
      - https://freetype.org/freetype2/docs/index.html
