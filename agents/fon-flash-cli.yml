history:
  adoption-history:
    - >
      Fon Flash targeted a narrow but active router-hacking niche: original La Fonera
      2100/2200 devices, Fon+, Fon 2.0, and compatible Atheros devices. The official
      page notes support across Windows, Linux, and Mac OS X, which was unusual and
      useful for a firmware flashing helper.
  package-nerd-significance:
    - >
      fon-flash-cli is package-nerd interesting because it preserves a tiny,
      hardware-specific utility from the La Fonera/OpenWrt era. It is not a general
      system tool; its value is that it captures a particular bootstrapping path for
      Atheros router firmware experimentation.
  project-history:
    - >
      The Gargoyle wiki describes Fon Flash as a program based on AP51 Flash. Its
      purpose was to improve firmware flashing for La Fonera-class devices by handling
      several firmware layouts rather than only Gargoyle/OpenWrt images.
    - >
      The surrounding Gargoyle project is a third-party router firmware based on
      OpenWrt. Its README describes Gargoyle as separate firmware with a user-friendly
      interface focus, rather than a set of packages installed on top of an existing
      OpenWrt system.
  related-projects:
    - >
      Fon Flash is related to AP51 Flash, Gargoyle, OpenWrt, DD-WRT, Fon NG firmware,
      and the La Fonera/Fon router hardware line.
  sources:
    - https://github.com/ericpaulbishop/gargoyle
    - https://raw.githubusercontent.com/ericpaulbishop/gargoyle/master/README.md
    - https://www.gargoyle-router.com/wiki/doku.php?id=fon_flash
  summary:
    - >
      fon-flash-cli packages the Fon Flash utility, a router flashing tool associated
      with Gargoyle for La Fonera and Atheros-chipset compatible devices.
  timeline:
    - >
      2008-2019: The Gargoyle README copyright line identifies Eric Bishop's
      long-running Gargoyle authorship period.
    - '2013: The Gargoyle wiki page for Fon Flash was last modified on May 21, 2013.'
    - >
      2010s: Fon Flash is documented as a successor to AP51 Flash with Windows, Linux,
      and Mac OS X support.
  usage:
    - >
      Users run `fon-flash` to flash compatible routers with Gargoyle/OpenWrt, Fon NG,
      or DD-WRT firmware images. The official page emphasizes that it can handle
      firmware sets that require one file or three files, depending on target firmware.
