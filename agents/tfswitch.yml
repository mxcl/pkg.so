id: brew:tfswitch
display-name: Terraform Switcher
repo: null
docs:
  - https://tfswitch.warrensbox.com/
  - https://tfswitch.warrensbox.com/usage/config-files
config-file-location:
  unix:
    - ~/.tfswitch.toml
    - ./.tfswitchrc
    - ./.terraform-version
credentials-file-location: null
history:
  adoption-history:
    - >
      The project distributes binaries directly and through package managers. Its
      official README specifically documents Homebrew on macOS and Linux and AUR
      packages on Arch Linux; the supplied package metadata records the Homebrew formula
      `tfswitch`.
  package-nerd-significance:
    - >
      tfswitch brings language-version-manager ergonomics to infrastructure tooling.
      Compatibility with `.terraform-version`, alongside native `.tfswitchrc` and TOML
      configuration, lets it fit existing repositories and workflows.
    - >
      Support for choosing Terraform or OpenTofu makes it useful where teams need to
      test or migrate between closely related infrastructure-as-code toolchains.
  project-history:
    - >
      Terraform Switcher was created as a small command-line utility for selecting
      Terraform releases. It downloads and verifies a requested release when that
      version is not already installed.
    - >
      The project later adopted conventional Go-style `v`-prefixed semantic versions
      beginning with v1.0.0 and expanded its configuration to cover installation paths,
      fallback versions, architectures, mirrors, and Terraform or OpenTofu selection.
  related-projects:
    - 'Terraform: the infrastructure-as-code CLI whose versions tfswitch originally managed.'
    - >
      OpenTofu: an alternative infrastructure-as-code CLI supported through tfswitch's
      `product` setting.
    - >
      tfenv: another Terraform version manager whose `.terraform-version` convention
      tfswitch supports.
  sources:
    - https://github.com/warrensbox/terraform-switcher#readme
    - https://tfswitch.warrensbox.com/usage/config-files/
    - source_facts.package-manager
  summary:
    - >
      Terraform Switcher, commonly invoked as `tfswitch`, is a cross-platform
      command-line version manager for Terraform and OpenTofu.
  timeline:
    - >
      v1.0.0: The project changed from its older numeric identifier to Go-style
      `v`-prefixed semantic versions.
  usage:
    - >
      Run `tfswitch` interactively to choose a version, pass a version on the command
      line, or let it infer constraints from Terraform files and repository-local
      version files.
    - >
      Use `$HOME/.tfswitch.toml` for user-level defaults such as the target binary,
      fallback version, product, log level, architecture, and installation directory.
