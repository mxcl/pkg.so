history:
  adoption-history:
    - >
      SmoothScroll targets mouse users who prefer animated, accelerated scrolling across
      desktop applications rather than only inside a browser. The official site
      distributes separate macOS and Windows editions and documents per-application
      customization.
  package-nerd-significance:
    - >
      SmoothScroll represents the small proprietary system-enhancement utilities
      commonly installed through desktop package managers. It modifies a low-level,
      system-wide interaction detail and consequently cannot be distributed through the
      Mac App Store under the platform restrictions described by its developer.
  project-history:
    - >
      Developer Balázs Galambosi describes SmoothScroll as a one-person project created
      to provide a more fluid scrolling experience. It grew from browser-oriented smooth
      scrolling into native macOS and Windows applications that operate across supported
      desktop software.
  related-projects:
    - >
      The official site also discusses SmoothScroll's browser-extension lineage.
      Mouse-driver and input-customization tools occupy an adjacent category, but
      SmoothScroll focuses specifically on wheel scrolling.
  sources:
    - https://www.smoothscroll.net/
    - https://www.smoothscroll.net/help/
    - https://www.smoothscroll.net/privacy/
  summary:
    - >
      SmoothScroll is a proprietary macOS and Windows background utility that adds
      configurable animation and acceleration to mouse-wheel scrolling across
      applications.
  timeline:
    - '2018: The official privacy policy documented native macOS and Windows editions.'
    - >
      Present: The project continues to offer system-wide scrolling customization with
      per-application controls.
  usage:
    - >
      Users open SmoothScroll from the macOS menu bar, adjust step size, acceleration,
      and animation behavior, and optionally customize or disable it for individual
      applications. The macOS edition requires Accessibility permission to modify
      low-level input events.
