id: brew:apm
display-name: APM
repo: https://github.com/microsoft/apm
docs:
  - https://microsoft.github.io/apm
  - https://microsoft.github.io/apm/consumer/authentication
  - https://microsoft.github.io/apm/quickstart
  - https://microsoft.github.io/apm/reference/cli/config
  - https://microsoft.github.io/apm/reference/cli/install
config-file-location:
  unix:
    - ./apm.yml
    - ~/.apm/apm.yml
    - ~/.apm/config.json
credentials-file-location:
  unix:
    - ~/.apm/config.json
history:
  adoption-history:
    - >
      The official documentation targets GitHub Copilot, Claude Code, Cursor, OpenCode,
      Codex, Gemini, Windsurf, and Kiro. The supplied package metadata records
      distribution through Homebrew, Scoop, and WinGet, while the official README also
      documents platform installers and pip.
  package-nerd-significance:
    - >
      APM applies familiar manifest, lockfile, transitive-resolution, integrity, and
      policy concepts to agent configuration, an ecosystem that has otherwise relied
      heavily on manually copied files. Its cross-harness targeting and multiple
      installation channels make it notable as an attempt to turn agent context into a
      conventional package-management domain.
  project-history:
    - >
      Microsoft's public repository was created in September 2025 and published v0.4.0
      that month. The project describes itself as open source and community driven, and
      credits Daniel Meppiel as creator with Daniel Meppiel and Sergio Sisternes as
      maintainers.
  related-projects:
    - >
      The official project relates its workflow to npm, pip, and Cargo and builds on
      AGENTS.md, Agent Skills, and the Model Context Protocol. The companion
      microsoft/apm-action project brings installation and bundle restoration into
      GitHub Actions.
  sources:
    - >
      https://api.github.com/repos/microsoft/apm — official GitHub repository metadata
      and creation date.
    - >
      https://api.github.com/repos/microsoft/apm/releases?per_page=100 — official GitHub
      release history.
    - >
      https://github.com/microsoft/apm — official README, project purpose, maintainers,
      supported agent harnesses, installation methods, and usage.
    - >
      https://microsoft.github.io/apm/ — official documentation for the manifest,
      lockfile, installation, security, and policy model.
    - >
      input source_facts.package-manager — supplied Homebrew, Scoop, and WinGet package
      records.
  summary:
    - >
      APM, the Agent Package Manager, is a dependency manager for AI-agent context. It
      gives skills, prompts, instructions, plugins, and MCP servers a project manifest
      and lockfile workflow analogous to established language package managers.
  timeline:
    - '2025-09: Public GitHub repository created and v0.4.0 published.'
    - '2026-07: v0.26.0 published.'
  usage:
    - >
      A project declares agent dependencies in a repository-root apm.yml. Running apm
      install resolves those dependencies and produces a lockfile so collaborators and
      CI can reproduce the same agent context; additional commands cover compilation,
      packaging, auditing, marketplaces, and policy enforcement.
related-packages:
  - id: cask:codex
    reason: >
      APM has a documented Codex target that deploys agents, skills, hooks, and MCP
      configuration into locations consumed by the Codex coding-agent CLI.
    rel: adjacent_workflow
    sources:
      - https://microsoft.github.io/apm/reference/targets-matrix/
      - https://github.com/openai/codex#readme
  - id: brew:github-mcp-server
    reason: >
      APM can declare and install GitHub's official MCP Server as a locked MCP
      dependency and route its configuration into supported agent harnesses.
    rel: adjacent_workflow
    sources:
      - https://github.com/microsoft/apm#readme
      - https://github.com/github/github-mcp-server#readme
