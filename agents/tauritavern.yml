history:
  adoption-history:
    - >
      The project distributes native builds across Windows, macOS, Linux, Android, and
      iOS. Its official repository documents package-manager installation through
      Homebrew, WinGet, Scoop, AUR, Nix, and Flatpak.
  package-nerd-significance:
    - >
      TauriTavern packages a traditionally web-and-Node-oriented AI character-chat
      workflow as a cross-platform native application. Its broad package-manager
      coverage, Rust backend, local-data model, and compatibility with SillyTavern data
      and extensions make it notable to users who prefer reproducible native
      installation.
  project-history:
    - >
      TauriTavern began as an independently maintained effort to port the SillyTavern
      user experience to Tauri. It retained the upstream frontend behavior and data
      layout while replacing the Node.js backend with a Rust implementation organized
      around Clean Architecture. It is not an official SillyTavern client.
  related-projects:
    - >
      SillyTavern supplies the upstream user experience and compatible data model. Tauri
      provides the native application runtime.
  sources:
    - 'Official documentation: https://tauritavern.github.io/en/guide/introduction'
    - 'Official repository: https://github.com/Darkatse/TauriTavern'
  summary:
    - >
      TauriTavern is an open-source native client that ports the SillyTavern experience
      to a Tauri v2 and Rust runtime for desktop and mobile platforms.
  timeline:
    - >
      Early development: The project ported SillyTavern's frontend experience to a
      native Tauri runtime.
    - >
      Current architecture: The frontend remains SillyTavern-compatible while the
      backend is implemented in Rust.
  usage:
    - >
      Users install a native client and work with SillyTavern-compatible character
      cards, chats, presets, world information, and frontend extensions without
      separately installing Node.js. The project also provides local data storage,
      migration, synchronization, and an evolving agent workflow.
