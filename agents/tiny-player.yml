history:
  adoption-history:
    - >
      Tiny Player for Mac occupies the niche of lightweight local-file music players for
      users who prefer a compact native application over a library-centric service.
      Homebrew Cask provides an additional installation and upgrade route for macOS
      package users.
  package-nerd-significance:
    - >
      The application is a small native alternative to larger media-library applications
      and supports common lossy, lossless, playlist, and audiobook formats. Its 2021
      Objective-C-to-Swift rewrite and continued support for older macOS releases make
      it an interesting example of a long-lived independent Mac utility.
  project-history:
    - >
      Developer Tomáš Andrle of Catnap Games publicly released Tiny Player for Mac in
      January 2018 as a deliberately simple music player with drag-and-drop playback and
      a persistent playlist.
    - >
      The Mac application was completely rewritten from Objective-C to Swift in 2021.
      Subsequent releases added quick search, expanded file-format support, playlist and
      metadata improvements, Apple-silicon support, and updated playback internals.
  related-projects:
    - Tiny Player for iOS
    - Tiny Loader
    - Apple Music
    - iTunes
  sources:
    - 'Official changelog: https://www.catnapgames.com/tiny-player-for-mac-changelog/'
    - >
      Official launch announcement:
      https://www.catnapgames.com/2018/01/01/tiny-player-for-mac/
    - 'Official product page: https://www.catnapgames.com/tiny-player-for-mac/'
    - 'Official release archive: https://www.catnapgames.com/category/tiny-player-for-mac/'
  summary:
    - >
      Tiny Player for Mac is a free minimalist native macOS music player developed by
      Tomáš Andrle of Catnap Games.
  timeline:
    - '2018: Tiny Player for Mac was publicly released.'
    - '2020: The application added support for Apple-silicon Macs.'
    - '2021: The Mac codebase was rewritten in Swift and later gained quick search.'
    - '2023: Updates improved playlist handling and added MP4 support.'
    - '2025: M4B audiobook support was added.'
    - '2026: Updated playback and metadata engines were released.'
  usage:
    - >
      Users drag audio files into the application to play them and maintain a compact
      playlist. The player supports MP3, FLAC, AAC, AIFF, WAV, MP4, M4B, and M3U-related
      workflows documented by the product page and changelog.
    - >
      Quick search can index user-selected music folders without copying or modifying
      the underlying files. Compact mode, cover art, media-key support, appearance
      controls, and Winamp-style keyboard shortcuts support lightweight desktop
      listening.
