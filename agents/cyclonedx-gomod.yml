history:
  adoption-history:
    - >
      The official CycloneDX tool center lists CycloneDX for Go modules as an
      open-source command-line utility and Go library, and the README documents
      Homebrew, GitHub release binaries, and go install as installation paths. That
      combination made it a natural fit for CI, GoReleaser, and distribution workflows.
  package-nerd-significance:
    - >
      For package managers and release engineers, cyclonedx-gomod is interesting because
      Go's module graph, build tags, and embedded module metadata affect what should
      appear in an SBOM; the tool encodes those Go-specific rules instead of treating Go
      projects as generic source trees.
  project-history:
    - >
      The repository was created in March 2021, during the period when CycloneDX was
      moving from its original SBOM format toward richer supply-chain metadata. Its
      early releases established the Go-specific generator role, while later versions
      tracked newer CycloneDX specification versions and Go build-model details.
  related-projects:
    - >
      Related CycloneDX tools include cyclonedx-cli for BOM manipulation and
      cyclonedx-python for Python environments and manifests.
  sources:
    - https://github.com/CycloneDX/cyclonedx-gomod/blob/main/README.md
    - https://api.github.com/repos/CycloneDX/cyclonedx-gomod
    - https://github.com/CycloneDX/cyclonedx-gomod/releases
    - https://cyclonedx.org/tool-center/
    - https://cyclonedx.org/about/history/
  summary:
    - >
      cyclonedx-gomod is the CycloneDX command-line generator for Go modules,
      applications, and Go binaries.
  timeline:
    - '2021: Repository created and v0.1.0 released.'
    - '2024: Releases tracked CycloneDX 1.6-era output support.'
    - '2026: v1.10.0 release line remained active.'
  usage:
    - >
      cyclonedx-gomod offers app, mod, and bin subcommands so users can choose between
      SBOMs for built applications, whole modules, or existing Go binaries. It accounts
      for Go build constraints such as GOARCH, GOOS, CGO_ENABLED, and GOFLAGS when
      producing application SBOMs.
related-packages:
  - id: brew:cyclonedx-cli
    reason: >
      Use CycloneDX CLI after cyclonedx-gomod when a generated Go BOM needs conversion,
      validation, merging, comparison, signing, or signature verification.
    rel: adjacent_workflow
    sources:
      - https://github.com/CycloneDX/cyclonedx-gomod#readme
      - https://github.com/CycloneDX/cyclonedx-cli/blob/main/README.md
  - id: brew:cdxgen
    reason: >
      Choose cdxgen when one scan must cover Go alongside other languages, containers,
      or additional BOM types; choose cyclonedx-gomod for Go-specific app, module, and
      binary semantics.
    rel: alternative
    sources:
      - https://github.com/cdxgen/cdxgen#readme
      - https://github.com/CycloneDX/cyclonedx-gomod#readme
