id: brew:fuzzy-find
display-name: fuzzy-find
repo: null
docs:
  - https://github.com/silentbicycle/ff#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew packages the tool as fuzzy-find with executable ff and stable version
      0.6.0. MacPorts also has a fuzzy-find port in the sysutils category with homepage
      set to the official GitHub repository.
  package-nerd-significance:
    - >
      fuzzy-find is package-nerd-relevant because it is intentionally tiny, builds from
      one C file, and gives users a fast-installable fuzzy filename search command long
      before broader fuzzy-finder ecosystems became common defaults.
  project-history:
    - >
      The official README says ff was written because find -name only scans filenames
      and regular expressions for fuzzy completion are cumbersome. The GitHub repository
      was created in 2012 and identifies the project as fuzzy-completion for finding
      files.
  related-projects:
    - >
      The README references SLIME fuzzy completion and compound completion as conceptual
      relatives.
  sources:
    - https://api.github.com/repos/silentbicycle/ff
    - https://formulae.brew.sh/api/formula/fuzzy-find.json
    - https://github.com/silentbicycle/ff
    - https://ports.macports.org/port/fuzzy-find/summary
    - https://raw.githubusercontent.com/silentbicycle/ff/master/README.md
  summary:
    - >
      fuzzy-find is the packaged name for ff, a small C command-line program that
      searches directory trees using basic fuzzy completion.
  timeline:
    - '2012: GitHub repository created.'
    - '2013: GitHub repository last pushed according to GitHub metadata.'
    - '2026: Homebrew formula reports stable version 0.6.0.'
    - '2026: MacPorts lists fuzzy-find version 0.6 in sysutils.'
  usage:
    - >
      ff recursively searches from the current directory by default, with options for
      root directory, dotfiles, directories-only output, case-insensitive matching,
      symlink following, nonrecursive mode, and a consecutive-match toggle character.
related-packages:
  - id: brew:fzf
    reason: >
      Choose fzf when you want an interactive, general-purpose fuzzy-selection interface
      over arbitrary input; fuzzy-find is a smaller noninteractive command specialized
      in recursively matching filesystem paths.
    rel: alternative
    sources:
      - https://github.com/silentbicycle/ff
      - https://github.com/junegunn/fzf
tags:
  - c
  - cli
  - file-search
  - fuzzy-completion
  - fuzzy-finder
