  windows:
    - <repository-root>\.dvignore
    - <nested-directory>\.dvignore
credentials-file-location: null
history:
  adoption-history:
    - >
      Diversion targets teams working with large assets and game-development workflows
      and provides desktop, command-line, web, and Unreal Engine interfaces. Its
      documentation positions automatic cloud synchronization and background change
      tracking as simpler alternatives to explicit Git staging, pushing, and pulling.
  package-nerd-significance:
    - >
      Diversion is notable as a packaged desktop client for a proprietary cloud-native
      version-control system rather than a graphical front end to Git. Package users
      receive the client software, while repositories and collaboration depend on the
      Diversion service.
  project-history:
    - >
      Diversion was developed as a cloud version-control platform with its own
      repository model. The desktop client became one of several official interfaces
      alongside a CLI, WebUI, and Unreal Engine plugin.
  related-projects:
    - >
      Diversion's documentation compares its workflow implicitly with Git concepts such
      as repositories, commits, branches, merges, cloning, and syncing, while
      implementing them through the Diversion service.
  sources:
    - 'Official documentation: https://docs.diversion.dev/'
    - 'Official homepage: https://www.diversion.dev/'
    - 'Official quickstart: https://docs.diversion.dev/quickstart'
  summary:
    - >
      Diversion Desktop is the macOS and Windows graphical client for Diversion's
      cloud-backed version-control service.
  timeline:
    - >
      Desktop-client era: Diversion documents native clients for macOS and Windows
      alongside CLI and web workflows.
    - >
      Current workflow: Official quickstart centers account login, repository creation
      or cloning, automatic tracking, commits, and cloud synchronization.
  usage:
    - >
      Users sign into the desktop application, create or clone a Diversion repository,
      place project files in its working folder, review automatically tracked changes,
      and commit them. Commits synchronize through the Diversion service without a
      separate push or pull step by default.
