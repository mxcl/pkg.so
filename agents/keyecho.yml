id: cask:keyecho
display-name: KeyEcho
repo: null
docs:
  - https://github.com/ZacharyL2/KeyEcho/blob/main/docs/guides/custom-sounds.md
  - https://github.com/ZacharyL2/KeyEcho#readme
config-file-location:
  macos:
    - ~/Library/Application Support/app.keyecho.keyecho/sounds/<sound-pack>/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      KeyEcho is distributed as a macOS Homebrew cask in addition to the upstream
      project's direct release builds. The upstream project also publishes builds for
      Windows and Linux.
  package-nerd-significance:
    - >
      KeyEcho is a small open-source desktop utility built with Tauri, Rust, and Solid
      rather than a bundled browser runtime. It is notable to package enthusiasts as a
      cross-platform keyboard-audio utility with local input handling and user-defined
      sound packs.
  project-history:
    - >
      The project emerged as an open-source utility for adding mechanical-keyboard-style
      audio feedback to ordinary keyboards. Its early releases added more sound choices,
      separate input and playback threads, volume control, and automatic launch support.
    - >
      The current project emphasizes local processing: global keyboard events are mapped
      to local audio playback, with no account, cloud synchronization, or typing-content
      analytics required.
  related-projects:
    - Tauri
    - Rust
    - SolidJS
    - Homebrew Cask
  sources:
    - https://github.com/ZacharyL2/KeyEcho — official README and project documentation.
    - https://github.com/ZacharyL2/KeyEcho/releases — official release history.
    - >
      source_facts.package-manager and source_facts.package-manager-url — Homebrew Cask
      distribution.
  summary:
    - >
      KeyEcho is an open-source desktop application that plays configurable sounds for
      global keyboard events.
  timeline:
    - >
      2024: Early public releases added expanded sound choices and threaded input and
      playback handling.
    - Later releases added volume control and an automatic-launch option.
  usage:
    - >
      Users run KeyEcho in the background and grant the operating-system permission
      needed for global keyboard-event listening. Optional custom packs place an OGG
      sound file and a config.json mapping file under the documented application-support
      directory.
tags:
