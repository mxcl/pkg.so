history:
  adoption-history:
    - >
      Revisionist is aimed at Mac users who need more control over document versions
      than the standard Revert To interface provides. Continued builds have carried the
      utility from Intel-era versions of OS X through Universal builds for Apple Silicon
      and recent macOS releases.
  package-nerd-significance:
    - >
      Revisionist exposes an otherwise obscure operating-system database,
      .DocumentRevisions-V100, through a focused graphical utility. It is useful for
      recovery, forensics, version cleanup, and preservation workflows, while also
      illustrating the distinction between application-managed versions, filesystem
      snapshots, and backups.
  project-history:
    - >
      Howard Oakley publicly developed Revisionist in beta during early 2018 and
      released version 1.0 in May of that year with tooltips, a Help book, and PDF
      documentation. It grew beyond inspecting versions to previewing and removing
      selected versions, finding heavily versioned documents, and making deep copies
      that preserve version history.
  related-projects:
    - >
      Revisionist is distributed alongside the developer's other version-management
      utilities. DeepTools supplied separate copy and archive helpers and was later
      superseded by Versatility, which archives and restores complete sets of document
      versions.
  sources:
    - >
      https://eclecticlight.co/2018/02/22/make-accessible-copies-of-versions-with-revisionist-1-0b2/
    - >
      https://eclecticlight.co/2018/05/25/revisionist-version-1-is-now-released-with-an-extensive-help-book-and-more/
    - https://eclecticlight.co/2025/04/29/document-versioning-unused-power-in-macos/
    - https://eclecticlight.co/revisionist-deeptools/
  summary:
    - >
      Revisionist is a free macOS utility by Howard Oakley for inspecting, previewing,
      copying, and deleting document versions stored by the operating system.
  timeline:
    - >
      2018: Public beta releases added detailed version inspection and accessible copies
      of saved versions.
    - '2018: Revisionist 1.0 was released on May 25.'
    - '2019: Revisionist was updated for macOS Catalina-era versioning behavior.'
    - >
      2020s: Universal builds added Apple Silicon support and continued compatibility
      with newer macOS releases.
  usage:
    - >
      Users select documents or scan folders to find saved versions, inspect version
      metadata, preview contents with Quick Look, make version-preserving copies, and
      selectively remove unwanted versions. The tool is particularly useful when
      ordinary application interfaces cannot expose or transport the required version
      history.
