id: brew:confluence-markdown-exporter
display-name: Confluence Markdown Exporter
repo: https://github.com/Spenhouet/confluence-markdown-exporter
docs:
  - https://spenhouet.com/confluence-markdown-exporter
config-file-location:
  linux:
    - >
      $CME_CONFIG_PATH (when set; otherwise use `cme config path` to print the
      platform-specific path)
  macos:
    - >
      $CME_CONFIG_PATH (when set; otherwise use `cme config path` to print the
      platform-specific path)
  windows:
    - >
      %CME_CONFIG_PATH% (when set; otherwise use `cme config path` to print the
      platform-specific path)
credentials-file-location:
  linux:
    - $CME_CONFIG_PATH (when set; otherwise the path printed by `cme config path`)
  macos:
    - $CME_CONFIG_PATH (when set; otherwise the path printed by `cme config path`)
  windows:
    - '%CME_CONFIG_PATH% (when set; otherwise the path printed by `cme config path`)'
history:
  adoption-history:
    - >
      The project is available as a packaged command-line application, Python package,
      container image, and Homebrew formula, supporting workstation, scripted, and
      CI-oriented use.
    - >
      Its documented output targets include Obsidian, Gollum, Azure DevOps wikis, Foam,
      Dendron, and generic Markdown consumers, reflecting its role in wiki migration and
      docs-as-code workflows.
  package-nerd-significance:
    - >
      The exporter turns content held in a hosted or self-managed wiki into ordinary
      Markdown and attachment files that can be searched, diffed, backed up, or
      committed to version control.
    - >
      Its support for Confluence Cloud, Server, and Data Center, incremental exports,
      target-specific presets, and non-interactive operation makes it useful for both
      one-time migrations and repeatable archival jobs.
  project-history:
    - >
      Confluence Markdown Exporter is an open-source project maintained by Sebastian
      Penhouet for exporting Atlassian Confluence pages through the Confluence APIs.
    - >
      The project expanded from basic page conversion to support page trees, complete
      spaces and organizations, attachments, macros, incremental exports, target-system
      presets, containers, and CI workflows.
  related-projects:
    - Atlassian Confluence
    - Obsidian
    - Gollum
    - Azure DevOps Wiki
    - Foam
    - Dendron
  sources:
    - >
      Official configuration documentation:
      https://spenhouet.com/confluence-markdown-exporter/configuration/
    - 'Official documentation: https://spenhouet.com/confluence-markdown-exporter/'
    - 'Official repository: https://github.com/Spenhouet/confluence-markdown-exporter'
  summary:
    - >
      Confluence Markdown Exporter is a command-line utility that exports individual
      Confluence pages, page hierarchies, spaces, or organizations into Markdown and
      related local assets.
  timeline:
    - '2020s: The project developed as an open-source Confluence-to-Markdown exporter.'
    - >
      2026: The official documentation describes packaged installation, Docker and CI
      workflows, incremental export, and presets for several Markdown-based target
      systems.
  usage:
    - >
      Users configure a Confluence URL, username, and API token or personal access
      token, then run cme commands against page, space, or organization URLs.
    - >
      Configuration and authentication share one application-managed JSON file. `cme
      config path` prints its resolved platform-specific location, while CME_CONFIG_PATH
      selects a custom file.
    - >
      Exports default to the configured output directory and can preserve page
      hierarchy, attachments, links, and target-specific conventions.
