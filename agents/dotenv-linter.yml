history:
  adoption-history:
    - >
      Adoption has mostly followed the package-manager and CI-tooling route. The project
      documents GitHub Actions, CircleCI, Super-Linter, reviewdog, pre-commit hooks, and
      package-manager installation paths, which made it easy to add to existing
      repositories without changing application code.
  package-nerd-significance:
    - >
      For package maintainers, dotenv-linter is a compact example of the modern Rust CLI
      pattern: a single executable, fast startup, prebuilt install script,
      Homebrew/Nix/APK packaging, and direct CI integration. Its significance is not
      broad platform history but the way it packages a tiny quality gate as a
      reproducible CLI tool.
  project-history:
    - >
      The project reached a public 1.0.0 release on January 1, 2020, and its README
      presents the Rust rewrite as the fast successor to an earlier dotenv-linter
      implementation. The official documentation grew around checks, fix mode, diff
      mode, installation options, and CI integrations rather than a large application
      framework.
  related-projects:
    - dotenv
    - reviewdog
    - pre-commit
    - GitHub Super-Linter
  sources:
    - https://github.com/dotenv-linter/dotenv-linter
    - https://dotenv-linter.github.io/
    - https://api.github.com/repos/dotenv-linter/dotenv-linter/releases?per_page=100
  summary:
    - >
      dotenv-linter is a Rust command-line linter for dotenv-style .env files. It
      occupies a small but practical niche in developer tooling: catching duplicate
      keys, formatting mistakes, missing values, and other problems in configuration
      files before an application fails at runtime.
  timeline:
    - '2020: v1.0.0 was published on GitHub releases.'
    - '2020: v2.x releases added to the project during the broader Rust CLI rewrite period.'
    - '2021: v3.0.0 was published, reflecting continued maintenance of the Rust implementation.'
  usage:
    - >
      Developers use dotenv-linter locally or in CI to scan one or more .env files,
      automatically fix some warnings, or compare .env and .env.example files for
      missing keys. It is language-agnostic because dotenv files are used across many
      ecosystems.
related-packages:
  - id: brew:pre-commit
    reason: >
      Use pre-commit to install and run dotenv-linter automatically during commits using
      the hook manifest published in dotenv-linter's official repository.
    rel: adjacent_workflow
    sources:
      - https://github.com/dotenv-linter/dotenv-linter#pre-commit
      - https://pre-commit.com/
