credentials-file-location: null
history:
  adoption-history:
    - >
      Valkey Admin was created within the Valkey organization as a native administration
      experience for both standalone servers and clusters. It is distributed as an
      Electron desktop application and as a web/container deployment, supporting
      individual workstations as well as Docker and Kubernetes-oriented operations.
    - >
      The project serves users seeking a Valkey-focused alternative to generic
      Redis-compatible administration interfaces, with cluster discovery, metrics, key
      browsing, command execution, and multiple-connection workflows.
  package-nerd-significance:
    - >
      Valkey Admin is part of the tooling ecosystem that formed around the
      community-governed Valkey database. It matters to package enthusiasts because it
      supplies an official graphical operational surface rather than requiring
      administrators to assemble third-party Redis-compatible tooling.
    - >
      Its split frontend, server, and metrics-process architecture exposes useful
      deployment choices: a self-contained Electron application for local work and web
      or Kubernetes modes for shared infrastructure.
  project-history:
    - >
      The first release series established separate frontend and metrics applications,
      multiple-connection handling, cluster support, key browsing, dashboards, and
      packaged desktop builds.
    - >
      Subsequent releases expanded deployment beyond Electron, added Docker and basic
      Kubernetes support, cluster discovery, IAM authentication, broader command
      coverage, monitoring controls, and security hardening.
  related-projects:
    - Valkey Admin manages Valkey, the community-governed in-memory key-value database.
    - >
      The official project uses Valkey GLIDE as part of its client stack and is
      distributed alongside other valkey-io packages and deployment tooling.
  sources:
    - https://github.com/valkey-io/valkey-admin
    - https://github.com/valkey-io/valkey-admin/releases
    - https://valkey-admin.valkey.io/
    - https://valkey-admin.valkey.io/configuration/
  summary:
    - >
      Valkey Admin is the Valkey project's graphical administration and observability
      tool for standalone Valkey instances and clusters.
  timeline:
    - >
      2026: The initial 0.1 release established desktop packaging, connection
      management, cluster support, key browsing, and dashboards.
    - >
      2026: The 1.x series added web, Docker, Kubernetes, discovery, IAM, monitoring,
      and security improvements.
    - '2026: A dedicated official documentation website was added.'
  usage:
    - >
      Operators add or discover a standalone Valkey instance or cluster, inspect health
      and metrics, browse and edit keys, monitor activity, and send commands through the
      graphical interface.
    - >
      The server is configured with environment variables and has no server config file.
      Metrics defaults live in apps/metrics/config.yml, optionally redirected with
      CONFIG_PATH. Connection addresses, authentication, TLS, and AWS/IAM settings are
      supplied through VALKEY_* environment variables rather than stored in the YAML
      file.
