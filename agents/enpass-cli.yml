history:
  adoption-history:
    - >
      The input package metadata lists Homebrew and Nix packages. Homebrew currently
      tracks the v1.12.0 GitHub source archive.
  package-nerd-significance:
    - >
      The package is notable for password-manager users who want scriptable terminal
      access to Enpass data while keeping the vault path explicit rather than storing a
      documented global configuration file.
  project-history:
    - >
      The hazcod/enpass-cli repository was created in September 2016. The README
      describes it as a command-line utility for Enpass and documents compiled binaries
      from the GitHub releases page.
  related-projects:
    - >
      The project is specifically a client for the Enpass password manager and is
      documented as a Go package on pkg.go.dev.
  sources:
    - 'GitHub releases API: v1.0 published 2020-12-08 and v1.12.0 published 2026-06-21'
    - 'GitHub repository API: created_at 2016-09-03, language Go, topics, and metadata'
    - 'Homebrew formula API: stable version 1.12.0 and official source archive'
    - 'Official README: installation, CLI usage, commands, and flags'
  summary:
    - >
      enpass-cli is a Go command-line client for the Enpass password manager, exposing
      vault listing, password display, copy, creation, editing, trash, restore, and
      delete operations.
  timeline:
    - '2016: GitHub repository created'
    - '2020: v1.0 published on GitHub releases'
    - '2026: v1.12.0 published on GitHub releases and tracked by Homebrew'
  usage:
    - >
      Users point the CLI at an Enpass vault with -vault=PATH and can pass -keyfile=PATH
      for a vault keyfile. Commands include list, show, copy, pass, create, edit, trash,
      restore, delete, dryrun, version, and help.
related-packages:
  - id: brew:bitwarden-cli
    reason: >
      Choose Bitwarden CLI when the vault is hosted by Bitwarden and you need its
      official login, synchronization, import, export, and automation commands rather
      than direct access to an Enpass vault.
    rel: alternative
    sources:
      - https://github.com/hazcod/enpass-cli#readme
      - https://bitwarden.com/help/cli/
  - id: cask:keepassxc
    reason: >
      Choose KeePassXC when you prefer a local KDBX database with an officially
      supported desktop application and bundled `keepassxc-cli` instead of Enpass's
      vault format.
    rel: alternative
    sources:
      - https://github.com/hazcod/enpass-cli#readme
      - https://keepassxc.org/docs/KeePassXC_UserGuide
