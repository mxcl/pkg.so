credentials-file-location: null
history:
  adoption-history:
    - >
      Shotcut became available across Windows, macOS, and Linux and developed into a
      general-purpose editor with native timeline editing, broad media-format support,
      proxy workflows, filters, keyframes, and 4K support.
  package-nerd-significance:
    - >
      Shotcut is notable to package users as a substantial cross-platform creative
      application built from open-source multimedia components, especially MLT and
      FFmpeg, while remaining usable without a proprietary editing ecosystem.
  project-history:
    - >
      Charlie Yates, an MLT co-founder, originally announced Shotcut in November 2004.
      The present application is a complete rewrite led by Dan Dennedy, another MLT
      co-founder, and grew from the January 2011 MLT BuildOnMe demonstration project for
      cross-platform Qt development.
  related-projects:
    - MLT multimedia framework
    - FFmpeg
    - Glaxnimate
  sources:
    - https://www.shotcut.org/
    - https://www.shotcut.org/FAQ/
    - https://www.shotcut.org/features/
    - https://www.shotcut.org/tutorials/
  summary:
    - >
      Shotcut is a free, open-source, cross-platform nonlinear video editor based on the
      MLT multimedia framework.
  timeline:
    - '2004: The original Shotcut was announced by Charlie Yates.'
    - >
      2011: Dan Dennedy created MLT BuildOnMe, from which the current Shotcut rewrite
      developed.
  usage:
    - >
      Users import media directly, arrange and trim clips on a multitrack timeline,
      apply audio and video filters or keyframes, and export rendered media. Proxy
      editing and preview scaling support work on demanding footage.
