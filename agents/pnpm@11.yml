id: brew:pnpm@11
display-name: pnpm 11
repo: https://github.com/pnpm/pnpm
docs:
  - https://pnpm.io/
  - https://pnpm.io/cli/config
config-file-location:
  unix:
    - <workspace-root>/pnpm-workspace.yaml
    - <project>/.npmrc
    - $XDG_CONFIG_HOME/pnpm/config.yaml
    - $XDG_CONFIG_HOME/pnpm/rc
  windows:
    - <workspace-root>\pnpm-workspace.yaml
    - <project>\.npmrc
    - ~/AppData/Local/pnpm/config/config.yaml
    - ~/AppData/Local/pnpm/config/rc
credentials-file-location:
  unix:
    - <project>/.npmrc
    - $XDG_CONFIG_HOME/pnpm/rc
  windows:
    - <project>\.npmrc
    - ~/AppData/Local/pnpm/config/rc
history:
  adoption-history:
    - >
      The official repository says pnpm has been used in production by teams of all
      sizes since 2016 and cites Microsoft's use with Rush repositories. The input also
      maps it across Homebrew, Chocolatey, Scoop, winget, MacPorts, Nix, and several
      Linux package managers.
  package-nerd-significance:
    - >
      pnpm is notable for challenging the convention that every project needs
      independent physical copies of dependency files. Its content-addressable store and
      linked node_modules layout make disk use, dependency isolation, lockfile behavior,
      and monorepo performance visible package-management design choices.
  project-history:
    - >
      pnpm emerged as an alternative Node.js package manager and has been used in
      production since 2016. It developed around a content-addressable global store, a
      strict dependency layout, deterministic pnpm-lock.yaml files, and first-class
      workspace support.
    - >
      The pnpm@11 Homebrew formula is a major-version-pinned distribution of the same
      pnpm project, useful when compatibility requirements prevent an immediate move to
      the newest major release.
  related-projects:
    - npm and Yarn are the principal JavaScript package managers with which pnpm is compared.
    - Rush supports pnpm for large JavaScript monorepos.
    - Corepack can provision package-manager versions declared by Node.js projects.
  sources:
    - https://github.com/pnpm/pnpm
    - https://pnpm.io/
    - https://pnpm.io/cli/config
    - source_facts.package-manager
  summary:
    - >
      pnpm is a cross-platform JavaScript package manager optimized for fast,
      space-efficient, deterministic dependency installation. The pnpm@11 package keeps
      users on the version 11 release line.
  timeline:
    - '2016: pnpm was in production use by teams, according to the official repository.'
    - '2026: The official pnpm security policy continued to list the 11.x line as supported.'
  usage:
    - >
      Developers use pnpm to install and update JavaScript dependencies, run package
      scripts, manage workspaces and monorepos, publish packages, and maintain
      pnpm-lock.yaml.
    - >
      Global settings live in config.yaml, registry and authentication settings use rc
      or project .npmrc files, and workspace settings live in pnpm-workspace.yaml.
tags:
  - cli
  - content-addressable-storage
  - dependency-management
  - javascript
  - monorepo
  - nodejs
  - package-manager
provenance:
  category-sources:
    - >
      Official repository describes pnpm as a fast, disk-space-efficient JavaScript
      package manager: https://github.com/pnpm/pnpm
    - source_facts.description
  display-name-sources:
    - >
      Official project name from https://pnpm.io/; major version derived from
      source_facts.name and id.
  docs-sources:
    - 'Official configuration reference: https://pnpm.io/cli/config'
    - Official documentation domain supplied by source_facts.homepage.
  history-sources:
    - https://github.com/pnpm/pnpm
    - https://pnpm.io/
    - https://pnpm.io/cli/config
    - source_facts.package-manager
  repo-sources:
    - >
      Official pnpm GitHub organization is verified for pnpm.io and identifies pnpm/pnpm
      as its primary project: https://github.com/pnpm
    - 'Official repository: https://github.com/pnpm/pnpm'
  tags-sources:
    - 'Official repository features and topics: https://github.com/pnpm/pnpm'
    - source_facts.description
    - source_facts.executables
category-confidence: high
category-path:
  - developer-tools
  - package-management
  - javascript
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
