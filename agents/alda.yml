history:
  adoption-history:
    - >
      Alda is distributed through several package managers in the supplied package
      facts, including Homebrew, apk, and Nix. Its official README points users to the
      website for installation, while also documenting source builds for the Go client
      and Kotlin/Java player.
    - >
      The project also maintains community surfaces for package users rather than only
      library consumers: official docs, examples, a cheat sheet, a Slack group, a
      subreddit, and a REPL workflow. That makes it recognizable in CLI package indexes
      as a real end-user tool, not merely a language experiment.
  package-nerd-significance:
    - >
      Alda is package-nerd interesting because it packages a whole creative runtime as a
      pair of CLI executables rather than as a GUI application. It depends on the host
      audio stack, JVM/player behavior, architecture-specific binaries, and
      language-level compatibility, all of which show up in changelog entries that
      matter to distro maintainers.
    - >
      It also demonstrates the classic text-tool value proposition: a domain that is
      normally graphical, music notation and playback, becomes inspectable, diffable,
      scriptable, and automatable.
  project-history:
    - >
      The project is presented by its maintainers as a language for composing and
      playing music using only a text editor and the command line. The official site and
      README emphasize a markup-like syntax, General MIDI playback, examples, and an
      interactive REPL, positioning Alda as a music language that is approachable to
      musicians and still scriptable enough for programmers.
    - >
      Alda's repository and site carry a 2012-2026 copyright notice for Dave Yarwood and
      contributors. The modern codebase is split into an `alda` client and `alda-player`
      playback process. Alda 2.0.0, released in June 2021, was a from-scratch rewrite in
      Go and Kotlin after the first generation had been mostly Clojure with a small Java
      client. The migration guide says Alda 2 kept the language mostly compatible while
      removing inline Clojure evaluation and introducing the separate player process.
    - >
      Subsequent Alda 2 releases show ongoing package-maintainer concerns:
      player-process recovery, log4j security updates, `alda doctor`, MusicXML import,
      deterministic MIDI channel assignment, ARM Linux support, and memory reductions
      for lower-RAM devices such as Raspberry Pi.
  related-projects:
    - >
      Alda's own migration guide identifies Alda 1 as the mostly Clojure predecessor and
      `alda-clj` as a Clojure DSL for algorithmic music that preserves part of the
      earlier Clojure-oriented workflow.
    - >
      The docs connect Alda to General MIDI, MusicXML import, editor plugins, and the
      nREPL-inspired REPL client/server model.
  sources:
    - https://alda.io/
    - https://github.com/alda-lang/alda/blob/master/CHANGELOG.md
    - https://github.com/alda-lang/alda/blob/master/README.md
    - https://github.com/alda-lang/alda/blob/master/doc/alda-2-migration-guide.md
    - https://github.com/alda-lang/alda/blob/master/doc/index.md
    - source_facts.package-manager
  summary:
    - >
      Alda is a text-based music programming language and command-line toolchain for
      writing, playing, and experimenting with musical scores from plain text. Its niche
      is the overlap between music notation, live coding, algorithmic composition, and
      Unix-style text workflows.
  timeline:
    - '2012: Project copyright period begins in official site and README notices.'
    - "2015: Official docs link Dave Yarwood's text-based music composition manifesto."
    - '2021-06-30: Alda 2.0.0 released as a Go and Kotlin rewrite.'
    - '2023-05-07: Alda 2.2.5 added MusicXML import.'
    - '2024-06-22: Alda 2.3.0 reworked MIDI channel assignment.'
    - '2025-09-19: Alda 2.3.3 added broader Linux ARM support.'
    - '2026-05-12: Alda 2.4.3 reduced player memory usage.'
  usage:
    - >
      Typical use is `alda play --file score.alda`, `alda play --code "piano: c6 d12 e6
      g12~4"`, or `alda repl` for interactive composition. Scores are text files, so
      users naturally keep them in version control, edit them with ordinary editors, and
      run them from scripts.
    - >
      Alda's more advanced usage includes programmatic composition, MIDI export/import
      workflows, and multi-process playback. In Alda 2, the CLI starts `alda-player` as
      needed and provides diagnostic commands such as `alda doctor` to help with audio
      and player-process setup.
