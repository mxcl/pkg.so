id: cask:deepseek-harness
display-name: DeepSeek Harness
repo: https://github.com/deepseek-ai/deepseek-harness
docs:
  - https://deepseek-harness.github.io/deepseek-harness
  - https://deepseek-harness.github.io/deepseek-harness/en/guide/providers
  - https://deepseek-harness.github.io/deepseek-harness/en/guide/quickstart
config-file-location:
  macos:
    - $DSH_HOME/profiles/web/cordis.patch.yml
credentials-file-location:
  macos:
    - $DSH_HOME/.credentials.yaml
history:
  adoption-history:
    - >
      DeepSeek introduced Harness as a worldwide developer preview rather than a stable
      compatibility target. The project is source-available under the MIT license and
      invites developers to build and share dsh plugins.
  package-nerd-significance:
    - >
      Harness treats models, tools, skills, sessions, sandboxes, storage, loops,
      scheduling, and UI as replaceable plugins. That unusually broad application of a
      package-and-plugin architecture makes dependency composition itself part of the
      agent runtime design.
  project-history:
    - >
      DeepSeek Harness was introduced in 2026 as an open-source agent harness built on
      the Cordis plugin system. Its initial developer preview emphasized composability,
      local operation, and complete, replayable session trajectories.
    - >
      The project ships a desktop/Web UI experience as well as an npm-distributed dsh
      command, with source development organized as a pnpm workspace.
  related-projects:
    - Cordis supplies the plugin kernel and dependency model.
    - >
      The dsh plugin ecosystem extends Harness with models, tools, storage, interfaces,
      and workflows.
    - >
      DeepSeek model services are one supported model provider; the provider system also
      supports third-party model APIs.
  sources:
    - https://deepseek-harness.github.io/deepseek-harness/en/guide/providers
    - https://deepseek-harness.github.io/deepseek-harness/en/guide/quickstart
    - https://deepseek.com/harness/en/
    - https://github.com/deepseek-ai/deepseek-harness
  summary:
    - >
      DeepSeek Harness is a local-first, extensible coding agent and agent-development
      runtime in which essentially every capability is supplied by a plugin.
  timeline:
    - '2026: DeepSeek released Harness as an open-source developer preview.'
  usage:
    - >
      Users can start the Web UI with `npx @deepseek-ai/dsh web`, configure a model,
      select a workspace, and run coding or repository tasks.
    - >
      The standard runtime provides file editing, shell and search tools, skills, plans,
      goals, subagents, and workflows; alternate modes expose smaller or differently
      orchestrated tool sets.
    - >
      Model settings are written to the active profile's cordis.patch.yml, while API
      keys are stored separately in $DSH_HOME/.credentials.yaml.
