history:
  adoption-history:
    - >
      KyTea's adoption is mostly academic and language-tooling oriented. It appears in
      package managers such as Homebrew, MacPorts, and Nix because Japanese and Chinese
      text-processing workflows often need a reproducible segmenter that can be scripted
      from Unix pipelines.
  package-nerd-significance:
    - >
      KyTea is a nice package-manager artifact because it packages research NLP into
      classic Unix form: a small binary, a training command, headers, and docs. It is
      especially useful in multilingual text-analysis stacks where tokenization is a
      prerequisite rather than the final task.
  project-history:
    - >
      The KyTea NEWS file records version 0.0.1 on 2009-11-05 as the initial release of
      KyWs and KyPe. The public GitHub repository and README describe the later project
      as a general text-analysis toolkit focused on Japanese and languages requiring
      segmentation.
    - >
      KyTea's design sits in the statistical NLP toolkit tradition before
      transformer-based tokenizers became dominant. It gives researchers and
      language-processing users a trainable analyzer with command-line tools and a
      library API rather than a closed dictionary-only analyzer.
  related-projects:
    - >
      Related tools and concepts include Japanese morphological analyzers, Chinese word
      segmentation, MeCab-style tokenization workflows, statistical NLP, corpus
      preparation, and trainable language-specific text-analysis pipelines.
  sources:
    - https://github.com/neubig/kytea
    - https://github.com/neubig/kytea/blob/master/ChangeLog
    - https://raw.githubusercontent.com/neubig/kytea/master/NEWS
    - https://www.phontron.com/kytea
    - https://www.phontron.com/kytea/api.html
    - https://www.phontron.com/kytea/train.html
  summary:
    - >
      KyTea is the Kyoto Text Analysis Toolkit, a C++ toolkit by Graham Neubig for word
      segmentation, pronunciation estimation, and other analysis tasks, especially for
      Japanese and other languages where word or morpheme boundaries are not explicit in
      raw text.
  timeline:
    - '2009-11-05: KyTea 0.0.1 was released as the initial release of KyWs and KyPe.'
    - >
      2009-11-16: The ChangeLog records version 0.0.2 with Shift-JIS support and an
      Autotools build-system change.
    - >
      2026-07-01: The GitHub releases page for neubig/kytea listed no packaged GitHub
      releases, so the historical anchor remains the repository NEWS and source
      documentation.
  usage:
    - >
      The package installs kytea for analysis and train-kytea for model training. Users
      run it to segment text, estimate pronunciations, prepare corpora, or build custom
      models for domains where default Japanese tokenizers are not enough.
related-packages:
  - id: brew:mecab
    reason: >
      Choose MeCab for its established dictionary-backed Japanese morphological-analysis
      ecosystem; choose KyTea when trainable segmentation, partial annotation, or
      pronunciation estimation is more important.
    rel: alternative
    sources:
