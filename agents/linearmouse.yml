id: cask:linearmouse
display-name: LinearMouse
repo: https://github.com/linearmouse/linearmouse
docs:
  - https://github.com/linearmouse/linearmouse/blob/main/Documentation/Configuration.md
  - https://linearmouse.app/
config-file-location:
  macos:
    - ~/.config/linearmouse/linearmouse.json
credentials-file-location: null
history:
  adoption-history:
    - >
      LinearMouse found a niche among Mac users who want different scrolling and pointer
      behavior for mice and trackpads or who use third-party pointing devices. Homebrew
      Cask installation and an editable JSON configuration make it especially convenient
      for technical users and dotfile workflows.
  package-nerd-significance:
    - >
      The application exposes macOS input behavior that is otherwise scattered across
      system settings and vendor utilities. Its documented JSON configuration,
      per-device schemes, and ability to restore system defaults make it unusually
      automation-friendly for a graphical input utility.
  project-history:
    - >
      LinearMouse is an open-source macOS utility created to customize mouse and
      trackpad behavior. The project dates to 2021 and is developed publicly in the
      linearmouse/linearmouse repository.
    - >
      Development expanded from scrolling direction and pointer acceleration controls to
      per-device, per-application, and per-display profiles, button remapping, gestures,
      smooth scrolling, and support for additional input hardware.
  related-projects:
    - >
      The project credits Mac Mouse Fix as inspiration for its pointer-speed
      modification technique.
    - >
      macOS System Settings supplies the underlying system defaults that LinearMouse can
      override or restore.
  sources:
    - https://github.com/linearmouse/linearmouse
    - https://github.com/linearmouse/linearmouse/blob/main/Documentation/Configuration.md
    - https://linearmouse.app/
  summary:
    - >
      LinearMouse is an open-source macOS utility for customizing scrolling, pointer
      acceleration and speed, and mouse-button behavior, with profiles that can target
      particular devices, applications, or displays.
  timeline:
    - "2021: LinearMouse's public project and release history began."
    - >
      Later releases added increasingly granular profiles, button mappings, gestures,
      smooth scrolling, and broader device support.
  usage:
    - >
      Users configure scrolling direction, acceleration, pointer speed, and button
      actions through the menu-bar application's graphical interface.
    - >
      Advanced users can edit ~/.config/linearmouse/linearmouse.json. The official
      documentation recommends the GUI for ordinary changes and documents the JSON
      schema for advanced configuration.
