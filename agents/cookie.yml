history:
  adoption-history:
    - >
      Cookie evolved alongside macOS browsers, expanding from traditional HTTP-cookie
      management to cover local storage, IndexedDB, cache, history, downloads, and other
      browser data. Successive major releases added support for more Safari, Firefox,
      Chromium, and independent browser variants.
    - >
      The application remains a commercial macOS utility distributed through both SweetP
      and Apple's Mac App Store. Cookie 7 was the first paid major upgrade since 2019,
      and Cookie 8 modernized the interface and extended support to newer browsers.
  package-nerd-significance:
    - >
      Cookie appeals to privacy-conscious Mac users who want more selective behavior
      than a browser's delete-all-data command. Its favorites, per-browser policies,
      tracking definitions, schedules, and optional browser helper make it a specialized
      local data-maintenance tool.
    - >
      The Homebrew cask offers a scriptable installation path for a traditionally
      GUI-distributed commercial utility, while configuration remains managed through
      the application rather than a documented user-editable file.
  project-history:
    - >
      Cookie grew out of SweetP Productions' earlier Safari-focused cookie-management
      work and became the company's multi-browser privacy manager. The product shifted
      from handling cookies alone to managing a broad range of website storage and
      browsing artifacts.
    - >
      Cookie 6 received continuous browser-compatibility and database-processing work.
      Cookie 7 introduced a major refactor and broader browser support, while Cookie 8
      refreshed the interface and continued adding support for emerging browsers.
  related-projects:
    - >
      Safari Cookies was SweetP Productions' earlier Safari-specific cookie manager; its
      official page now directs users to Cookie.
    - >
      Privatus is SweetP Productions' simpler automatic browser-cleanup utility, whereas
      Cookie provides fine-grained control.
    - >
      Cookie Helper is the optional Chrome- and Firefox-family extension that uses
      browser-native cleanup methods.
  sources:
    - https://cookieapp.com/
    - https://sweetpproductions.com/products/cookie7/upgrade.htm
    - https://sweetpproductions.com/products/cookie8/help/index.htm
    - https://sweetpproductions.com/products/cookie8/updates.htm
    - https://sweetpproductions.com/safaricookies/
  summary:
    - >
      Cookie is SweetP Productions' macOS privacy utility for selectively retaining
      useful browser data while removing tracking cookies and other unwanted browsing
      artifacts.
  timeline:
    - >
      2009: SweetP Productions released Safari Cookies, the Safari-focused predecessor
      in its cookie-management line.
    - >
      2019: The developer's upgrade material identifies this as the previous
      paid-upgrade period before Cookie 7.
    - '2023: Cookie 7 delivered a major refactor and broader browser support.'
    - >
      2026: Cookie 8 continued the product with a refreshed interface and support for
      additional browsers.
  usage:
    - >
      Users enable the browsers Cookie should manage, mark domains or individual cookies
      as favorites, choose unwanted data types, and configure manual or automatic
      removal schedules.
    - >
      Simple View applies a privacy-level policy across enabled browsers. Advanced View
      allows per-browser favorites, cleanup selections, schedules, timers, tracking
      definitions, and whitelists. Aggressive cleanup can remove login state or browsing
      artifacts, so important domains should be favorited or whitelisted first.
