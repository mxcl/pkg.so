history:
  adoption-history:
    - >
      The project grew around a community-maintained plugin collection covering system
      status, developer services, personal automation, and online data. The official
      site advertises hundreds of pre-built plugins, while the deliberately simple text
      protocol lets users write plugins in any executable language.
    - >
      Existing BitBar plugins remained usable after the xbar transition, and the project
      documented small metadata and parameter changes for authors wishing to adopt
      xbar-specific capabilities.
  package-nerd-significance:
    - >
      xbar turns ordinary executable files into native menu-bar interfaces without
      requiring developers to build or sign a complete GUI application. Refresh
      intervals encoded in filenames, a line-oriented output protocol, environment
      variables, and URL controls make it a compact bridge between shell scripting and
      desktop UI.
    - >
      The package is also notable for its ecosystem model: the application, plugin
      catalog, documentation generator, and executable plugins are maintained as
      open-source projects, while each plugin can bring its own language runtime and
      service integrations.
  project-history:
    - >
      Mat Ryer originally developed the project as BitBar, a macOS utility that rendered
      script output in the menu bar. xbar is described by its maintainers as the BitBar
      reboot: a ground-up rewrite in Go, built with Wails and a web-based interface
      while preserving the script-driven plugin model.
    - >
      The xbar generation added an in-application plugin browser, structured plugin
      variables, expanded command parameters, keyboard shortcuts, and dedicated control
      URLs. An official March 2021 migration guide announced that xbar had shipped and
      explained compatibility with legacy BitBar plugins.
  related-projects:
    - BitBar
    - xbar-plugins
    - Wails
    - SwiftBar
    - Argos
  sources:
    - https://github.com/matryer/xbar
    - https://github.com/matryer/xbar-plugins
    - https://xbarapp.com/
    - https://xbarapp.com/docs/2021/03/13/upgrade-legacy-bitbar-plugins.html
  summary:
    - >
      xbar is an open-source macOS menu-bar application that periodically executes
      scripts or programs and turns their text output into interactive menu items.
  timeline:
    - 'BitBar era: The original application established the script-to-menu-bar plugin model.'
    - >
      2021: The rewritten xbar generation shipped with compatibility guidance for legacy
      BitBar plugins.
    - >
      xbar era: The project added a plugin browser, variables, keyboard shortcuts, and
      an expanded community catalog.
  usage:
    - >
      Users install or write an executable plugin and place it in `~/Library/Application
      Support/xbar/plugins/`. A filename suffix such as `5m` controls its refresh
      interval, while output lines define the menu-bar title, dropdown hierarchy,
      colors, links, commands, and other behavior.
    - >
      Advanced application behavior can be set in `/Library/Application
      Support/xbar/xbar.config.json`, which does not exist by default. Plugin variables
      are stored in JSON files alongside their plugins. Individual plugins may require
      API keys or other secrets, but xbar itself documents no single credentials file.
