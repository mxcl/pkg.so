history:
  adoption-history:
    - >
      The official site presents EnzymeX as a laboratory companion for molecular
      biologists and records an Apple Design Award in 2006. Its focus on a native Mac
      interface distinguished it from older scientific sequence tools.
  package-nerd-significance:
    - >
      EnzymeX is notable in Mac package collections as specialized scientific desktop
      software rather than a command-line bioinformatics package. It combines reference
      data and experiment planning in a self-contained native application.
  project-history:
    - >
      Nucleobytes created EnzymeX as a macOS DNA sequence editor built around
      restriction-enzyme analysis. The application accumulated data for nearly 700
      commercial restriction enzymes and buffers from 15 manufacturers.
  related-projects:
    - >
      The application can import common sequence formats and obtain sequence data from
      NCBI Entrez.
  sources:
    - https://www.nucleobytes.com/enzymex/
  summary:
    - >
      EnzymeX is a macOS DNA sequence editor and restriction-enzyme reference tool for
      molecular biology and cloning workflows.
  timeline:
    - '2006: EnzymeX received an Apple Design Award.'
    - >
      2010s: EnzymeX 3 expanded the product's sequence editing, virtual digestion, motif
      search, and molecular-biology reference features.
  usage:
    - >
      Researchers use EnzymeX to edit DNA sequences, locate restriction sites, generate
      restriction maps, simulate digests, compare enzyme and buffer compatibility,
      translate sequences, search motifs, calculate reaction mixtures, and plan cloning
      experiments.
