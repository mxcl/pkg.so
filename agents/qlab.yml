history:
  adoption-history:
    - >
      QLab's official documentation positions it around theatrical, broadcast, and
      cinematic conventions while supporting uses beyond those fields. Its feature set
      grew from sequential media cueing into audio, video, lighting, MIDI, timecode,
      OSC, scripting, and networked show control.
    - >
      The continuing availability of manuals and downloads for multiple major
      generations reflects the operational need to maintain established show systems
      instead of forcing immediate upgrades.
  package-nerd-significance:
    - >
      QLab is proprietary, Mac-only production software rather than a source package.
      Package-manager users value the cask as a repeatable way to provision rehearsal,
      playback, and show-control Macs while retaining workspaces and media as separately
      managed production assets.
    - >
      Version pinning and compatibility matter more than novelty in live-show
      environments: official documentation recommends avoiding disruptive updates during
      a production, and the official archive retains many earlier releases.
  project-history:
    - >
      QLab is made and supported by Figure 53. Official documentation from the QLab 2
      era was published by 2010, and successive major generations expanded the program's
      cue-based model across audio, video, lighting, networking, MIDI, scripting, and
      automation.
    - >
      QLab 5 was released in August 2022 with live collaboration, autosave and
      snapshots, playlist groups, and expanded auditioning. Its account-based licensing
      can be installed online, remotely through an activation file, or on supported USB
      drives.
  related-projects:
    - QLab Remote is Figure 53's iOS remote-control application for QLab.
    - Go Button is Figure 53's iOS-oriented show-control application.
    - >
      QLab integrates with OSC, MIDI Show Control, timecode, NDI, Syphon, and Stream
      Deck workflows.
  sources:
    - https://downloads.qlab.app/docs/v2/downloads/QLab-v2-Documentation.pdf
    - https://qlab.app/
    - https://qlab.app/docs/v5/
    - https://qlab.app/docs/v5/general/change-log/
    - https://qlab.app/docs/v5/general/licenses/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      QLab is Figure 53's macOS application for cue-based live media playback and show
      control.
  timeline:
    - '2010: Official QLab 2 documentation is published by Figure 53.'
    - '2016: QLab 4 is released.'
    - '2022: QLab 5 is released with collaboration, autosave, snapshots, and playlist groups.'
  usage:
    - >
      A QLab production is organized as a workspace containing cue lists or cue carts,
      cues, and workspace-specific settings. Users sequence and trigger audio, video,
      lighting, MIDI, timecode, network, and script actions during rehearsals and
      performances.
    - >
      Workspace files and associated media are saved wherever the user chooses; QLab can
      create a project folder containing the workspace and copied media. Because
      official documentation does not specify one fixed filesystem location for
      application-wide preferences, no config-file path is asserted here.
