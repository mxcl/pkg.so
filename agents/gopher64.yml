history:
  adoption-history:
    - >
      Gopher64 publishes builds for Windows, macOS, Linux, and Android. Its official
      README documents Homebrew installation on macOS and Flatpak installation on Linux.
    - >
      The maintainer of simple64 archived that earlier emulator in 2025 and directed
      users toward Gopher64 for future development, giving Gopher64 a direct place in
      the lineage of actively packaged Nintendo 64 emulators.
  package-nerd-significance:
    - >
      Gopher64 is notable as a Rust-based, cross-platform Nintendo 64 emulator that
      combines original implementation work with selected ideas or code adapted from
      established emulator projects. It packages modern features such as netplay,
      RetroAchievements, savestates, homebrew support, and Vulkan-oriented rendering
      into a standalone desktop application.
  project-history:
    - >
      Gopher64 was created by the maintainer of simple64 as a new Nintendo 64 emulator.
      The official project documentation characterizes it as a highly compatible,
      cross-platform emulator rather than merely a new interface for simple64.
    - >
      The codebase combines original research with portions adapted from Mupen64Plus and
      ares, while parallel-rdp handles low-level graphics emulation. Development has
      added netplay, upscaling, a CRT shader, CPU-overclock emulation, cheats,
      savestates, homebrew support, and RetroAchievements.
  related-projects:
    - simple64 is the maintainer's archived predecessor project.
    - Mupen64Plus and ares informed or supplied portions of the emulator implementation.
    - parallel-rdp supplies low-level Nintendo 64 RDP emulation.
  sources:
    - https://github.com/gopher64/gopher64#readme
    - https://github.com/gopher64/gopher64/discussions/386
    - https://github.com/gopher64/gopher64/wiki
    - https://github.com/simple64/simple64#project-future
  summary:
    - >
      Gopher64 is an open-source, cross-platform Nintendo 64 emulator written primarily
      in Rust.
  timeline:
    - '2025: simple64 was archived after its maintainer shifted future work to Gopher64.'
    - >
      Gopher64 expanded across Windows, macOS, Linux, and Android and added packaged
      distribution through Homebrew and Flatpak.
  usage:
    - >
      Users open Nintendo 64 ROM images through the graphical application or pass a ROM
      path on the command line. The emulator provides configurable keyboard and gamepad
      controls, netplay, savestates, cheats, graphics enhancements, and optional
      portable operation.
