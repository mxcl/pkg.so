history:
  adoption-history:
    - >
      libfyaml’s adoption is narrower than older C YAML libraries, but package records
      in the input show it in Homebrew, Debian, Ubuntu, Fedora, Arch, MacPorts, Nix,
      Alpine, and openSUSE. It appeals to projects that need a modern C YAML parser with
      event, document-tree, path, JSON, and command-line tooling in one package.
  package-nerd-significance:
    - >
      libfyaml matters to package maintainers because YAML parsing is deceptively hard,
      security-sensitive, and specification-heavy. A compact C implementation with
      test-suite emphasis, JSON interop, command-line tools, and optional Python
      bindings gives distributions another choice besides older libyaml-style stacks.
  project-history:
    - >
      GitHub repository metadata records pantoniou/libfyaml creation on 2019-09-16, and
      the project documentation copyright spans 2019-2026. The README describes the
      library as a high-performance YAML 1.2 and JSON parser/emitter with zero-copy
      operation, full document and event APIs, and no artificial key or document size
      limits.
    - >
      GitHub release metadata records v0.9 on 2023-09-25, v0.9.6 on 2026-03-15, and a
      1.0.0-alpha series beginning on 2026-03-16. The alpha series added generics,
      reflection/meta-type support, Python binding work, parse caching, optimized
      generic emission, and wider binary packaging.
  related-projects:
    - The YAML test suite is part of libfyaml’s correctness story.
    - >
      The Python binding in python-libfyaml bridges the C generic runtime into Python
      workflows.
    - >
      libyaml is the older C YAML library against which newer C YAML parsers are often
      compared.
  sources:
    - https://api.github.com/repos/pantoniou/libfyaml
    - https://api.github.com/repos/pantoniou/libfyaml/releases?per_page=100
    - https://github.com/pantoniou/libfyaml
    - https://pantoniou.github.io/libfyaml/
  summary:
    - >
      libfyaml is Pantelis Antoniou’s MIT-licensed C library and tool suite for YAML 1.2
      and JSON parsing and emitting, emphasizing zero-copy parsing, document and event
      APIs, diagnostics, and YAML test-suite coverage.
  timeline:
    - '2019-09-16: GitHub repository metadata records creation of pantoniou/libfyaml.'
    - '2023-09-25: GitHub release metadata records v0.9.'
    - '2026-03-15: GitHub release metadata records v0.9.6.'
    - '2026-03-16: GitHub release metadata records v1.0.0-alpha1.'
    - '2026-05-28: GitHub release metadata records v1.0.0-alpha7.'
  usage:
    - >
      The package ships utilities such as fy-tool, fy-dump, fy-compose, fy-filter,
      fy-join, fy-ypath, and fy-testsuite. Developers can link it through CMake or
      pkg-config and use core, generic, or reflection APIs depending on whether they
      need streaming events, document manipulation, schema-light values, or typed C
      structure serialization.
