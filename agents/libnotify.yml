id: brew:libnotify
display-name: libnotify
repo: https://gitlab.gnome.org/GNOME/libnotify
docs:
  - https://gnome.pages.gitlab.gnome.org/libnotify
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libnotify became the common packaging surface for scripts and desktop programs
      that need cross-desktop notification popups. Its notify-send executable is
      especially visible because it lets shell scripts and CLI tools trigger the same
      notification service used by graphical applications.
  package-nerd-significance:
    - >
      libnotify is package-nerd significant because it is a small library with a very
      visible command-line tool and a cross-desktop D-Bus contract. It often appears as
      a light dependency in desktop stacks, test scripts, and system hooks where
      notify-send is the public face of the library.
  project-history:
    - >
      The GNOME documentation identifies Notify API version 0.7 and library version
      0.8.8, with authors including Marco Trevisan, Logan Rathbone, Christian Hammond,
      Mike Hearn, and John Palmieri. The README describes libnotify as a library for
      sending notifications defined by the freedesktop.org Desktop Notifications
      specification.
    - >
      Over the 0.7 series, libnotify modernized its build and command-line tooling: NEWS
      records Meson support in 0.7.8, a notify-send man page and autotools removal in
      0.7.9, and richer notify-send behavior in 0.7.10 such as replacement, wait,
      actions, responses, and failure exit codes.
  related-projects:
    - >
      Related standards and APIs include org.freedesktop.Notifications, D-Bus, XDG
      Portal Notification API, and GLib GNotification.
    - >
      Related implementations include desktop notification daemons used by GNOME and
      other freedesktop-compatible desktops.
  sources:
    - https://github.com/GNOME/libnotify
    - https://github.com/GNOME/libnotify/blob/master/NEWS
    - https://gnome.pages.gitlab.gnome.org/libnotify/
    - https://specifications.freedesktop.org/notification-spec/latest/
  summary:
    - >
      libnotify is the GNOME library and notify-send tool for sending passive desktop
      notifications to a notification daemon. It implements the freedesktop.org
      org.freedesktop.Notifications model through a small GLib/GObject-facing C API.
  timeline:
    - >
      0.7.8: NEWS records Meson build-system support and notify-send support for full
      URLs as hint values.
    - '0.7.9: NEWS records a notify-send man page, Darwin linking fixes, and autotools removal.'
    - >
      0.7.10: NEWS records notify-send support for replacement, waiting, actions,
      responses, and failing exit codes.
    - >
      0.7.13: NEWS records use of Desktop Portal Notification when running confined
      under snap or flatpak.
    - >
      2024-08-18: The freedesktop.org Desktop Notifications Specification was published
      as version 1.3.
  usage:
    - >
      Programs initialize libnotify, create NotifyNotification objects, set hints such
      as urgency, category, image, sound, transient, and desktop-entry, and submit
      notifications through a notification daemon. The README notes that sandboxed
      applications can use the XDG Portal Notification API path, and that GLib
      applications should prefer GNotification.
related-packages:
  - id: brew:glib
    reason: >
      For a GLib application, use GLib's GNotification API instead of calling libnotify
      directly; libnotify's own README explicitly recommends that application-integrated
      interface.
    rel: alternative
    sources:
      - https://gitlab.gnome.org/GNOME/libnotify
      - https://docs.gtk.org/gio/class.Notification.html
