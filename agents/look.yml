credentials-file-location: null
history:
  adoption-history:
    - >
      Look is distributed through several package-oriented channels documented by the
      project, including a Homebrew cask for macOS, AUR and Debian packages for Linux,
      Scoop for Windows, and a Nix flake. That unusually broad packaging footprint
      supports its cross-platform positioning.
  package-nerd-significance:
    - >
      Look is notable to package enthusiasts because one launcher project documents
      native installation paths across Homebrew, AUR, Debian, Scoop, AppImage, and Nix.
      Its declarative text configuration and command-oriented launcher workflows also
      make it more inspectable than many GUI-only launchers.
  project-history:
    - >
      Look is a community-driven, open-source launcher developed as a lightweight
      alternative to Spotlight and Raycast. The project expanded beyond macOS into Linux
      and Windows implementations while retaining a shared launcher concept and
      configuration surface.
  related-projects:
    - The project explicitly positions Look as an alternative to Apple Spotlight and Raycast.
    - >
      The official Lookbook repository supplies recipes for user-declared Look sources:
      https://github.com/kunkka19xx/lookbook
  sources:
    - 'Input package identity: source_facts.package-manager.brew-cask'
    - 'Official repository and README: https://github.com/kunkka19xx/look'
    - 'Official user guide: https://github.com/kunkka19xx/look/blob/main/docs/user-guide.md'
  summary:
    - >
      Look is an open-source, keyboard-first application and file launcher for macOS,
      Linux, and Windows, with built-in commands, user-defined sources, and text-based
      configuration.
  timeline:
    - >
      The official project documentation currently describes supported distribution
      paths for macOS, Linux, Windows, and NixOS.
  usage:
    - >
      Users summon Look with a global shortcut, search for applications or files, invoke
      command modes, and perform actions such as opening a terminal or editor at the
      selected location.
    - >
      The main configuration is stored in ~/.look/config. User-defined super actions are
      stored in ~/.look/super-actions.toml and can be reloaded without rebuilding the
      application.
