history:
  adoption-history:
    - >
      Missive says that, ten years after its creation, more than 5,000 companies and
      30,000 daily users relied on the service. Its adoption centers on teams wanting
      shared email, assignment, chat, and customer-support workflows in one inbox.
  package-nerd-significance:
    - >
      The Homebrew cask gives macOS administrators and automation users a reproducible
      way to install a proprietary collaborative email client. Missive is notable for
      combining a conventional mail client with shared-inbox and internal-chat behavior
      instead of treating support email as a separate ticketing system.
  project-history:
    - >
      Missive originated inside Conference Badge, where its three-person team needed to
      coordinate customer email without separating support messages from internal
      discussion. The founders turned their collaborative-inbox solution into their
      primary bootstrapped business and publicly launched it in 2016.
    - >
      By April 2021, Missive reported reaching US$1 million in annual recurring revenue
      with a small, self-funded team. The company subsequently broadened the product
      into a team communications hub spanning email, chat, tasks, and shared accounts.
  related-projects:
    - >
      Conference Badge was the founders’ earlier business and the operational setting
      from which Missive emerged.
    - >
      The product occupies the same general shared-inbox market as help desks and team
      email clients, while retaining a conventional inbox-oriented workflow.
  sources:
    - https://missiveapp.com/about
    - https://missiveapp.com/blog/how-we-built-1m-arr-email-client
    - https://missiveapp.com/docs
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Missive is a proprietary collaborative inbox and team chat application created by
      a small Quebec City team. It grew from an internal tool for handling Conference
      Badge customer email into a standalone, bootstrapped service for shared
      communication workflows.
  timeline:
    - '2016: First public version of Missive launched.'
    - '2021: Missive reported reaching US$1 million in annual recurring revenue.'
    - '2026: Missive reported serving more than 5,000 companies and 30,000 daily users.'
  usage:
    - >
      Teams use Missive to manage individual and shared email accounts, assign
      conversations, discuss messages internally, and coordinate customer support from a
      common inbox. Homebrew users install the macOS desktop application with the
      `missive` cask.
