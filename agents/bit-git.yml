config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Homebrew as `brew install bit-git`,
      MacPorts, Go, Chocolatey, zinit, and other routes. The Homebrew formula name
      avoids colliding with the unrelated Bit component manager package.
    - >
      The repository's linked news items show a 2020 developer-tooling splash across
      Hacker News, Go newsletters, Reddit, and other programming communities, but the
      project remained a focused Git porcelain rather than becoming a replacement for
      Git itself.
  package-nerd-significance:
    - >
      bit-git is notable mostly because of naming pressure in package ecosystems:
      Homebrew has both `bit-git` for this Git helper and `bit` for Teambit's component
      manager. The formula name is itself a packaging artifact.
    - >
      It also captures a wave of post-2010s Git porcelain experiments: small CLIs that
      wrap Git without replacing its storage model, trying to make common workflows
      friendlier while leaving the underlying tool intact.
  project-history:
    - >
      The official repository was created in 2020 and describes Bit as a modernized Git
      CLI built on top of Git. Its README presents it as an experiment in happy
      defaults: command and flag suggestions, branch and file autocomplete, automatic
      fetch and fast-forwarding, and commands inspired by git-extras.
    - >
      The project reached a 1.x release line in 2021. Its README changelog shows a rapid
      early sequence of usability features, including single-binary distribution, GitHub
      pull-request viewing through the GitHub CLI, interactive prompt mode, and a
      security fix for a Windows executable-search issue.
  related-projects:
    - Git is the underlying version-control system that bit-git wraps.
    - >
      git-extras is named by the README as an inspiration and source of related
      convenience commands.
    - Gitless is another Git workflow experiment credited by the README.
    - go-prompt is credited by the README for the interactive prompt library.
  sources:
    - https://api.github.com/repos/chriswalz/bit
    - https://api.github.com/repos/chriswalz/bit/releases
    - https://github.com/chriswalz/bit
    - https://raw.githubusercontent.com/chriswalz/bit/master/README.md
    - input.json source_facts.package-manager
  summary:
    - >
      bit-git is the Homebrew-packaged form of Chris Walz's Bit, an experimental modern
      Git CLI written in Go. It wraps Git with suggestions, autocomplete, safer
      defaults, and convenience commands while preserving compatibility with ordinary
      Git commands.
  timeline:
    - >
      2020: The chriswalz/bit repository is created and publicized as an experimental
      modern Git CLI.
    - '2020: Homebrew installation appears in the README as `brew install bit-git`.'
    - >
      2021: The project publishes 1.0 and 1.1 releases with more completions,
      interactive mode, and security fixes.
    - >
      2023: The repository remains available, with later activity tapering compared with
      the initial release burst.
  usage:
    - >
      Users call `bit` where they would normally call `git`, with commands such as `bit
      save`, `bit sync`, `bit switch`, and `bit pr` layered over existing Git behavior.
      The README emphasizes that all Git commands remain available through Bit.
    - >
      The package is useful for interactive terminal workflows where suggestions, branch
      autocomplete, and happy-path commands are more valuable than strict minimalism.
related-packages:
  - id: brew:git
    reason: >
      Git is the required underlying version-control system; bit-git wraps its
      repositories and commands rather than replacing it.
    rel: adjacent_workflow
    sources:
      - https://github.com/chriswalz/bit
      - https://git-scm.com/docs
  - id: brew:git-extras
    reason: >
      git-extras is a mature collection of additional Git subcommands and is explicitly
      credited as the source of convenience commands such as release and info in
      bit-git.
    rel: alternative
    sources:
      - https://github.com/chriswalz/bit
      - https://github.com/tj/git-extras#readme
  - id: brew:gh
    reason: >
      GitHub CLI complements bit-git by providing the `gh pr list` capability required
      by bit-git's documented pull-request feature.
    rel: adjacent_workflow
    sources:
      - https://github.com/chriswalz/bit
      - https://cli.github.com/manual/gh_pr_list
