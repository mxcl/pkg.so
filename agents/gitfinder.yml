credentials-file-location:
  macos:
    - ~/.git-credentials
    - $XDG_CONFIG_HOME/git/credentials
history:
  adoption-history:
    - >
      GitFinder occupies a specialized niche among macOS Git clients by integrating
      status badges and commands directly into Finder instead of requiring users to
      remain in a standalone repository window. Its official support material describes
      a commercial trial-and-license model aimed at regular Git users.
    - >
      The product expanded from local repository operations to Git LFS, hooks,
      hosting-service accounts, pull requests, self-hosted service support, and Apple
      Silicon. Its release history shows continued compatibility work across successive
      macOS releases.
  package-nerd-significance:
    - >
      GitFinder is interesting as a native, sandboxed macOS Git client that uses a
      Finder Sync extension and its own Git library rather than shelling out to the
      command-line Git executable. That architecture makes it a useful contrast with
      cross-platform Electron clients and terminal-centered Git workflows.
    - >
      It also exposes the practical boundary between application packaging and user Git
      configuration: GitFinder honors conventional global and XDG Git configuration and
      credential files while layering Finder integration and hosted-service features on
      top.
  project-history:
    - >
      The idea for GitFinder arose after macOS 10.10 Yosemite appeared in November 2014,
      with the goal of placing Git status and operations inside Finder. ZigZag developed
      the application as a native commercial macOS tool, and its official release record
      identifies version 1.0 on February 13, 2018.
    - >
      Subsequent releases broadened it into a fuller Git client. Version 1.3 added Git
      LFS and hook support in 2019; version 1.5 added GitHub, GitLab, and Bitbucket
      integration in 2020; version 1.6 added native Apple Silicon support; and version
      1.7 added pull-request workflows in 2021.
  related-projects:
    - Git, whose repositories and configuration GitFinder manages
    - macOS Finder and Finder Sync extensions
    - GitHub, GitLab, and Bitbucket hosting services
    - Git LFS
  sources:
    - https://gitfinder.com/
    - https://gitfinder.com/about
    - https://gitfinder.com/blog/gitfinder-turns-two/38
    - https://gitfinder.com/blog/why-gitfinder/34
    - https://gitfinder.com/release-notes
    - https://gitfinder.com/support
  summary:
    - >
      GitFinder is a commercial native Git client from ZigZag that integrates repository
      status and operations into macOS Finder while also providing a standalone
      repository browser.
  timeline:
    - '2014: The idea for a Finder-integrated Git client followed the release of OS X Yosemite'
    - '2018: GitFinder 1.0 was released'
    - '2019: Version 1.3 added Git LFS and Git-hook support'
    - '2020: Version 1.5 added GitHub, GitLab, and Bitbucket integration'
    - '2020: Version 1.6 added native Apple Silicon support'
    - '2021: Version 1.7 added pull-request workflows'
  usage:
    - >
      GitFinder displays staged, unstaged, conflicted, and ignored states as Finder
      badges and exposes Git operations through Finder contextual and toolbar menus. Its
      repository browser handles branches, tags, remotes, histories, diffs, blame,
      staging, commits, merges, rebases, stashes, and submodules.
    - >
      Users can connect hosting accounts, work with pull requests, use SSH or HTTPS
      authentication, configure identities, and hand diffs or conflicts to supported
      external tools. Repository roots must be granted to its sandboxed Finder
      extension, and some cloud-synchronized folders conflict with Apple's Finder Sync
      mechanism.
