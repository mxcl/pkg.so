history:
  adoption-history:
    - >
      HiGHS gained a major scientific-Python adoption point when SciPy 1.6.0 added HiGHS
      methods to `scipy.optimize.linprog` for large sparse problems. SciPy 1.9.0 then
      made `method='highs'` the default for `linprog` and added mixed-integer linear
      programming support.
    - >
      The JuMP ecosystem documents `HiGHS.jl` as a wrapper around the HiGHS solver with
      both a thin C API wrapper and a MathOptInterface implementation. That gives Julia
      modelers access to the same solver family through JuMP models.
    - >
      Packaging now spans both system package managers and language package channels.
      The README badges and text point to PyPI `highspy`, NuGet `Highs.Native`, release
      binaries, and source builds, while the input package map shows Homebrew, Debian,
      MacPorts, Nix, Arch, and Scoop packaging.
  package-nerd-significance:
    - >
      HiGHS matters to package nerds because it is a serious permissively licensed
      optimization solver with no required third-party dependencies for the core build.
      That makes it unusually friendly to distributions compared with solver stacks that
      depend on proprietary binaries or complex external libraries.
    - >
      It also sits at an important boundary between command-line packages and language
      ecosystems: the same solver is shipped as a Unix executable, a C/C++ library, a
      Python package, a Julia solver backend, and a NuGet package.
  project-history:
    - >
      HiGHS grew from high-performance research solvers for linear optimization,
      especially the dual revised simplex work by Qi Huangfu and Julian Hall. The
      official site describes the codebase as C++11 software with no required
      third-party utilities for source builds.
    - >
      The README describes a solver suite rather than a single algorithm: primal and
      dual revised simplex solvers, an LP interior-point solver, a QP active-set solver,
      and a MIP branch-and-cut solver. The documentation adds PDLP first-order LP
      support and explains the executable/library split.
    - >
      The public tag line shows 1.x releases starting in 2021, then steady expansion
      through Python packaging, NuGet packaging, interface documentation, MIP work,
      GPU/PDLP-related development, and HiPO-related builds.
  related-projects:
    - >
      SciPy is a major downstream consumer through `scipy.optimize.linprog` and
      `scipy.optimize.milp`.
    - JuMP and MathOptInterface use HiGHS through HiGHS.jl.
    - >
      COIN-OR Clp, GLPK, commercial solvers, and other LP/MIP solvers are common
      benchmark and package-set neighbors.
  sources:
    - 'Documentation: https://ergo-code.github.io/HiGHS/dev/'
    - 'JuMP HiGHS.jl docs: https://jump.dev/JuMP.jl/stable/packages/HiGHS/'
    - 'Project site: https://highs.dev/'
    - 'README: https://github.com/ERGO-Code/HiGHS#readme'
    - 'Repository tags: https://github.com/ERGO-Code/HiGHS/tags'
    - 'SciPy 1.6.0 notes: https://docs.scipy.org/doc/scipy/release/1.6.0-notes.html'
    - 'SciPy 1.9.0 notes: https://docs.scipy.org/doc/scipy/release/1.9.0-notes.html'
  summary:
    - >
      HiGHS is open-source linear optimization software for large-scale sparse LP,
      MILP/MIP, and convex QP models. It provides a standalone `highs` executable, a C++
      library, and interfaces for C, C#, Fortran, Julia, Python, and other ecosystems.
    - >
      The project is rooted in the University of Edinburgh optimization group and the
      ERGO-Code organization. Its README credits solver components to Qi Huangfu, Julian
      Hall, Lukas Schork, Michael Feldmeier, Leona Gottwald, and Ivet Galabova.
  timeline:
    - >
      2018: The dual revised simplex work by Huangfu and Hall appears as the key
      citation used by HiGHS documentation.
    - '2021: v1.1.1 appears in the public tag line.'
    - '2021: SciPy 1.6.0 documents HiGHS methods for `linprog`.'
    - >
      2022: SciPy 1.9.0 makes `method='highs'` the default for `linprog` and adds MILP
      support.
    - '2024: HiGHS workshops begin appearing on the official site as community events.'
    - >
      2025: v1.10.0 appears in the public tag line during continued solver/interface
      development.
    - '2026: v1.15.0 appears in the public tag line.'
  usage:
    - >
      From the command line, HiGHS reads MPS and CPLEX LP files and solves them with
      options such as presolve, solver choice, parallel mode, thread count, time limit,
      and output solution/basis files. A minimal run is `highs model.mps`.
    - >
      As a library, users can build, modify, solve, and inspect optimization models
      through the native C++ API or through language bindings. Python users often meet
      HiGHS through SciPy's `linprog` and `milp` APIs or through the `highspy` wrapper;
      Julia users commonly meet it through JuMP and HiGHS.jl.
related-packages:
  - id: brew:cbc
    reason: >
      Choose Cbc when you specifically want the established COIN-OR branch-and-cut MILP
      stack and its integrations; choose HiGHS for its broader modern LP, MIP, and
      convex-QP solver suite.
    rel: alternative
    sources:
      - https://ergo-code.github.io/HiGHS/stable/
      - https://coin-or.github.io/Cbc/
  - id: brew:glpk
    reason: >
      Choose GLPK when GNU MathProg modeling and a GNU-licensed C toolkit are
      priorities; choose HiGHS for permissive licensing and its high-performance LP/MIP
      focus.
    rel: alternative
    sources:
      - https://ergo-code.github.io/HiGHS/stable/
      - https://www.gnu.org/software/glpk/
  - id: brew:clp
    reason: >
      Choose Clp for an established COIN-OR linear-programming library and executable;
      choose HiGHS when mixed-integer and convex-quadratic solving are also required.
    rel: alternative
    sources:
      - https://ergo-code.github.io/HiGHS/stable/
      - https://coin-or.github.io/Clp/
