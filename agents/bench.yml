id: brew:bench
display-name: Bench
repo: https://github.com/Gabriella439/bench
docs:
  - https://github.com/Gabriella439/bench#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation via Homebrew on macOS, DNF on Fedora or Red
      Hat-based distributions, Stack, and Nix. That cross-package-manager footprint is
      the main adoption signal for a small benchmarking utility.
    - >
      Bench's appeal is strongest for users who want Criterion-style repeated runs,
      confidence intervals, CSV/JUnit/raw outputs, and HTML reports without writing a
      Haskell benchmark harness.
  package-nerd-significance:
    - >
      Bench is notable as a package-manager-friendly bridge from the Haskell Criterion
      ecosystem to everyday shell benchmarking. It is small, stable, and very Unix in
      spirit: one command that makes a deeper library useful outside its home language.
    - >
      Its significance is modest but real for developers comparing command-line tools,
      compiler flags, scripts, and small pipelines from a terminal.
  project-history:
    - >
      The GitHub repository was created in March 2016, and the README copyright dates
      the project to 2016. Public GitHub releases began with 1.0.1 in May 2016 and
      reached 1.0.9 in May 2018.
    - >
      The README describes the project as a simple utility that wraps Criterion and
      notes that it is not expected to change much, which matches the small, stable
      command-line-tool profile.
  related-projects:
    - Criterion is the Haskell benchmarking library used underneath Bench.
    - Stack and Nix are documented installation routes.
    - Homebrew and DNF package the command for non-Haskell-specific installation.
  sources:
    - https://github.com/Gabriella439/bench
    - https://github.com/Gabriella439/bench/releases
    - source_facts.package-manager
    - source_facts.package-manager-url
  summary:
    - >
      Bench is Gabriella Gonzalez's command-line benchmarking wrapper around Haskell's
      Criterion library. It turns the statistical benchmarking machinery used by Haskell
      developers into a shell command for timing arbitrary programs.
  timeline:
    - '2016: Repository created and 1.0.1 released.'
    - '2016: 1.0.2 released.'
    - '2017: 1.0.8 released.'
    - '2018: 1.0.9 released.'
    - >
      2020s: Packaged by Homebrew, DNF, and Nix according to supplied package facts and
      README installation notes.
  usage:
    - >
      Users run commands such as `bench 'sleep 1'`, pass one or more command lines, and
      optionally emit reports with flags such as `--output`, `--csv`, `--junit`, or
      `--raw`. Output from the command under test is discarded while timing statistics
      are collected.
    - >
      It sits between shell built-ins like `time` and larger benchmarking frameworks:
      lightweight enough for ad hoc CLI comparisons, but statistically richer than a
      single wall-clock measurement.
related-packages:
  - id: brew:hyperfine
    reason: >
      Choose hyperfine for a newer cross-platform command benchmarker with warm-up
      phases, direct multi-command comparisons, parameter scans, and JSON/Markdown
      exports; its official documentation explicitly names Bench as an inspiration.
    rel: alternative
    sources:
      - https://github.com/Gabriella439/bench
      - https://github.com/sharkdp/hyperfine
      - https://github.com/sharkdp/hyperfine/blob/master/README.md
