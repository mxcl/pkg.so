history:
  adoption-history:
    - >
      mold's technical niche is compatibility plus parallel performance. It competes
      directly with GNU ld, GNU gold, and LLVM lld, with FOSDEM material describing it
      as a fast portable ELF linker and arguing that it gained importance for GNU
      toolchain users because it supports GCC features that matter for large projects.
      The README documents support across many architectures and explains usage as
      either invoking mold directly or selecting it through compiler flags.
  project-history:
    - >
      The 1.0 release was published as the first stable, production-ready release for
      Linux-based systems and described mold as a faster replacement for the default GNU
      linker for many user-land programs. That release also framed Ueyama's linker
      background as part of the project's credibility. Toolchain adoption followed
      quickly: GCC 12 gained -fuse-ld=mold support, putting mold alongside BFD, gold,
      and lld as an explicit compiler-driver linker choice.
  sources:
    - >
      https://archive.fosdem.org/2024/schedule/event/fosdem-2024-2606-can-the-mold-linker-be-usr-bin-ld-/
    - https://github.com/rui314/mold
    - https://github.com/rui314/mold/releases/tag/v1.0.0
    - https://github.com/rui314/mold/releases/tag/v2.0.0
    - https://www.phoronix.com/news/GCC-12-Mold-Linker
  summary:
    - >
      mold is Rui Ueyama's high-speed linker, positioned as a drop-in replacement for
      existing Unix linkers. The project README says Ueyama had earlier developed LLVM
      lld and presents mold as several times faster than lld on large debuginfo-enabled
      binaries, targeting shorter debug-edit-rebuild cycles for C, C++, Rust, and other
      compiled-language projects.
  usage:
    - >
      The 2.0.0 release changed the license from AGPL to MIT after the AGPL/commercial
      dual-licensing approach failed to meet the project's goals. That license change
      expanded mold's packaging and adoption path, making it easier for distributions,
      build systems, and commercial users to choose it without copyleft-linking
      concerns.
related-packages:
  - id: brew:lld
    reason: >
      Choose lld when LLVM integration, built-in LTO, PE/COFF, or mature WebAssembly
      support matters; both are fast GNU-compatible linker replacements directly
      compared by mold.
    rel: alternative
    sources:
      - https://github.com/rui314/mold
      - https://lld.llvm.org/
  - id: brew:wild
    reason: >
      Choose Wild for a Rust-based high-speed linker focused on Linux and WebAssembly;
      mold's official benchmarks compare it directly with Wild and document differing
      workload compatibility.
    rel: alternative
    sources:
      - https://github.com/rui314/mold
      - https://github.com/wild-linker/wild
