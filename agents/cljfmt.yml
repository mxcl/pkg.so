credentials-file-location: null
history:
  adoption-history:
    - >
      cljfmt's adoption follows Clojure's build-tool culture: the README documents
      standalone binaries, Homebrew installation, Clojure CLI tools, Leiningen plugin
      usage, library usage, Babashka tasks, and editor integrations. The batch input
      records packages in Homebrew and Nix.
    - >
      Editor integrations listed by upstream include Calva, CIDER, clojureVSCode, and
      vim-cljfmt, indicating that cljfmt became a formatting backend used beyond direct
      terminal invocation.
  package-nerd-significance:
    - >
      cljfmt matters to package nerds because it packages Clojure style policy into a
      repeatable CLI used in CI, editors, and build tools. The move to prebuilt native
      binaries also made it friendlier to Homebrew-style formulae, where startup time
      and dependency weight matter.
    - >
      For Clojure ecosystems, cljfmt is a representative example of a tool that must
      straddle Maven coordinates, Git-based Clojure tools, Leiningen plugins, Babashka
      tasks, standalone binaries, and editor integrations.
  project-history:
    - >
      cljfmt is maintained under James Reeves's weavejester namespace. The project
      presents itself as both a standalone CLI and a Clojure library for detecting and
      fixing formatting errors in Clojure source.
    - >
      The changelog shows a long 0.x evolution from Leiningen-era plugin usage toward
      modern Clojure tooling. Version 0.10.0 added support for `clj -T` tools and
      Babashka use, 0.10.2 added prebuilt native binaries, 0.11.0 moved important CLI
      options into configuration, and 0.16.x continued tightening configuration and
      indentation behavior.
  related-projects:
    - >
      Related projects include zprint, the Clojure Style Guide, Leiningen, the official
      Clojure CLI tools, Babashka, Calva, CIDER, clojureVSCode, and vim-cljfmt.
  sources:
    - https://github.com/weavejester/cljfmt#readme
    - https://github.com/weavejester/cljfmt/blob/master/CHANGELOG.md
    - https://github.com/weavejester/cljfmt/blob/master/docs/INDENTS.md
  summary:
    - >
      cljfmt is a formatter and checker for Clojure code, designed to fix formatting
      errors with minimal structural changes while following defaults based on the
      Clojure Style Guide.
  timeline:
    - '2014: GitHub repository created.'
    - '2023: 0.10.0 adds Clojure CLI tool support and partial Babashka support.'
    - '2023: 0.10.2 adds prebuilt native binaries for the CLI.'
    - '2023: 0.11.0 splits indentation configuration and removes old CLI configuration keys.'
    - >
      2026: 0.16.0 ignores `.clj` config files by default and adds additional formatting
      options.
    - '2026: 0.16.4 adds user-configuration validation.'
  usage:
    - >
      Users run `cljfmt check` to detect formatting errors and `cljfmt fix` to rewrite
      files. Projects can configure behavior through `.cljfmt.edn`, `cljfmt.edn`, or a
      `:cljfmt` key in Leiningen's `project.clj`.
    - >
      The indentation documentation explains Clojure-specific rules for macros and forms
      through `:indents` and `:extra-indents`, which is the core reason cljfmt is more
      than a generic pretty-printer.
related-packages:
  - id: brew:leiningen
    reason: >
      Use Leiningen with cljfmt when the project already uses `project.clj`; upstream
      provides the `lein-cljfmt` plugin, `lein cljfmt check` and `fix` tasks, and
      `:cljfmt` project configuration.
    rel: adjacent_workflow
    sources:
      - https://github.com/weavejester/cljfmt#readme
      - https://leiningen.org/
  - id: brew:clojure
    reason: >
      Use the official Clojure CLI with cljfmt when you prefer tool installation and
      `clj -Tcljfmt` invocations over a standalone binary or Leiningen plugin.
    rel: adjacent_workflow
    sources:
      - https://github.com/weavejester/cljfmt#readme
      - https://clojure.org/guides/deps_and_cli
