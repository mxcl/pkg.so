credentials-file-location: null
history:
  adoption-history:
    - >
      Publii has been distributed for Windows, macOS, and Linux and presents a graphical
      CMS workflow intended to make static-site generation accessible to users who do
      not want a command-line toolchain.
    - >
      The official project reports more than a decade of use. Its publishing targets
      grew to include ordinary HTTP/HTTPS or FTP hosting, SFTP, GitHub Pages, Netlify,
      Amazon S3, and Google Cloud.
  package-nerd-significance:
    - >
      Publii is notable for wrapping the static-site-generator model in a local Electron
      desktop CMS: authors receive a familiar editing interface while deployment
      produces portable static files without a server-side database or PHP runtime.
    - >
      Its local-first separation of application files, site sources, previews, and
      deployable output makes it attractive to users who want the performance and
      reduced attack surface of static hosting without assembling a conventional
      generator toolchain.
  project-history:
    - >
      Publii was created as a local desktop application for writers and site owners who
      wanted independent publishing without maintaining a server-side CMS.
    - >
      The application’s interface and editors were substantially rebuilt around Vue.js
      in 2022. The project later established its official GitHub repository so
      development and contributions could occur publicly; it is released under GPL-3.0.
  related-projects:
    - >
      Publii uses Electron and Vue.js for its desktop application and Handlebars for
      themes. It publishes to services including GitHub Pages, Netlify, Amazon S3,
      Google Cloud, and conventional web servers.
  sources:
    - https://getpublii.com/
    - https://getpublii.com/about/
    - https://getpublii.com/blog/publii-github-repository.html
    - https://getpublii.com/blog/publii-revamped-with-vue-js.html
    - https://github.com/GetPublii/Publii
  summary:
    - >
      Publii is a free, open-source, local-first desktop CMS that generates static
      websites and publishes them to conventional servers or cloud hosting without
      requiring a live database-backed administration system.
  timeline:
    - '2022: Publii documented a major Vue.js-based rewrite of its interface and editors.'
    - >
      Public-repository milestone: Publii opened its official GitHub repository for
      collaborative development.
    - >
      2026: The project described itself as trusted by creators for more than ten years
      and continued shipping cross-platform desktop builds.
  usage:
    - >
      Users create and edit sites locally, select a theme, preview the generated result,
      and synchronize static output to a configured hosting target.
    - >
      By default, site content, themes, and active configuration are kept under the
      user’s Documents/Publii directory. Publii’s App Settings can relocate site files,
      backups, and previews.
