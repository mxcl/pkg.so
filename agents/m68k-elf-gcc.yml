history:
  adoption-history:
    - >
      GCC is widely adopted because it targets many architectures and supports both
      native and cross compilation. The GCC mission statement explicitly calls out
      multiple architectures, diverse environments, new targets, and an open development
      model.
    - >
      The supplied package facts show Homebrew and MacPorts packages for `m68k-elf-gcc`,
      placing it in the small but important family of retrocomputing, embedded, and
      bare-metal cross compilers available through desktop package managers.
  package-nerd-significance:
    - >
      Cross-GCC packages are more than a compiler binary: they encode a target triplet,
      ABI assumptions, binutils pairing, runtime-library choices, and build-system
      expectations.
    - >
      For package maintainers, `m68k-elf-gcc` is notable because it makes a non-host
      architecture feel native to build systems while keeping all tools target-prefixed
      and isolated from the host GCC or Clang.
  project-history:
    - >
      GCC began as the GNU system's compiler and grew into the GNU Compiler Collection.
      The current project includes front ends for many languages and runtime libraries,
      and it is developed as free software under the GNU Project.
    - >
      The `m68k-elf-gcc` package is a target build of upstream GCC rather than an
      independent compiler project. Its executables are prefixed with `m68k-elf-` so
      they can live beside the host compiler and other cross compilers.
    - >
      GCC's official documentation includes M680x0 and ColdFire target options for
      generating and tuning code for processors such as 68000, 68010, 68020, 68030,
      68040, 68060, CPU32, and ColdFire families.
  related-projects:
    - m68k-elf-binutils supplies the matching assembler, linker, and object utilities.
    - >
      GNU Binutils, GNU Make, and Autoconf-era build systems are common neighbors in
      source builds using GCC cross compilers.
    - Other GCC cross packages follow the same target-triplet executable convention.
  sources:
    - https://gcc.gnu.org/
    - https://gcc.gnu.org/gccmission.html
    - https://gcc.gnu.org/git.html
    - https://gcc.gnu.org/onlinedocs/
    - https://gcc.gnu.org/onlinedocs/gcc/Invoking-GCC.html
    - https://gcc.gnu.org/onlinedocs/gcc/M680x0-Options.html
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      m68k-elf-gcc is a target-prefixed GCC cross compiler for building code for
      Motorola 68000-family ELF targets.
  timeline:
    - '1987: GCC first emerged as the GNU C Compiler era began'
    - >
      2024: GCC mission statement page documents open development, multiple
      architectures, and new targets
    - '2026: GCC 16.1 listed as a supported release on the official GCC site'
    - '2026: Homebrew package facts list GCC 16.1.0 target-prefixed m68k-elf executables'
  usage:
    - >
      The GCC manual describes the usual executable as `gcc`, `machine-gcc` when
      cross-compiling, or `machine-gcc-version` for a versioned driver. This package
      follows that convention with commands such as `m68k-elf-gcc`, `m68k-elf-g++`,
      `m68k-elf-cpp`, and related GCC helper tools.
    - >
      Developers use it with `m68k-elf-binutils` to compile C and C++ code, assemble
      generated output, and link ELF binaries for bare-metal 68k targets. Target options
      such as `-march`, `-mcpu`, `-mtune`, `-m68000`, and `-m68020-60` control generated
      code for different 680x0 and ColdFire variants.
related-packages:
  - id: brew:m68k-elf-binutils
    reason: >
      Use m68k-elf-binutils alongside this compiler to assemble generated code, link
      m68k ELF binaries, and inspect or transform the resulting objects.
    rel: adjacent_workflow
    sources:
      - https://gcc.gnu.org/install/download.html
      - https://sourceware.org/binutils/
      - https://gcc.gnu.org/onlinedocs/gcc/Invoking-GCC.html
