history:
  adoption-history:
    - >
      CloudNet targets both individuals and enterprises, with documented use cases
      including remote work, branch-office networking, cross-cloud VPC connectivity,
      personal-device networking, remote development, and multiplayer gaming.
  package-nerd-significance:
    - >
      It represents the managed mesh-VPN/SD-WAN class of packages: a cross-platform
      client combines WireGuard-based encrypted links, NAT traversal, optional relays,
      subnet routing, and access-control policy without requiring users to operate a
      conventional central VPN server.
  project-history:
    - >
      CloudNet is developed by Yunwang Information Technology as a distributed Full Mesh
      network-security product. Its official site presents the service as operating
      since the early 2020s, while its documentation records a product overview revision
      in 2024.
  related-projects:
    - >
      The official documentation also uses the names cnetVPN and 云网 VPN. WireGuard
      supplies the underlying VPN protocol described by the vendor.
  sources:
    - https://cloudnet.world/
    - https://cloudnet.world/kb/docs/faqs/
    - https://cloudnet.world/kb/docs/overview/
  summary:
    - >
      CloudNet is a managed, cross-platform mesh VPN and SD-WAN service for securely
      connecting devices, private networks, and cloud VPCs.
  timeline:
    - >
      2020: Beginning of the operating-period range shown in the official site copyright
      notice.
    - '2024: Official product overview was last modified on June 18.'
    - '2025: Official FAQ was updated with current troubleshooting and relay guidance.'
  usage:
    - >
      Users sign in, install a client, and authorize devices by browser, key, or QR
      code. Devices preferentially establish peer-to-peer links through NAT traversal
      and can fall back to relays. The official FAQ documents the `cnet` command for
      status, ping, and logs; on macOS the packaged command is under
      `/usr/local/cloudnet/bin/cnet`.
