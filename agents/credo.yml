credentials-file-location: null
history:
  adoption-history:
    - >
      Credo became part of normal Elixir project hygiene because it fits the Mix
      workflow and publishes documentation on HexDocs. The README also documents editor
      and automated-code-review integrations, which helped make it useful both locally
      and in CI.
  package-nerd-significance:
    - >
      For package maintainers, Credo is the Elixir ecosystem's familiar lint-style
      dependency: it ships through Hex, exposes a Mix task, can fail CI through exit
      status, and has enough formatter and integration surface to appear in editor, CI,
      and code-review pipelines.
  project-history:
    - >
      The official changelog identifies version 0.1.0 as the initial release. Early
      releases added CLI behavior, issue categories, per-function lint support, custom
      checks, generated configuration, and support for project-specific .credo.exs
      files.
  related-projects:
    - >
      The README lists editor integrations for JetBrains Elixir support, Atom, VS Code,
      flycheck, Kakoune, and Neovim/null-ls, plus Codacy for automated code review.
  sources:
    - https://github.com/rrrene/credo#readme
    - https://hexdocs.pm/credo
    - https://github.com/rrrene/credo/blob/master/CHANGELOG.md
  summary:
    - >
      Credo is an Elixir static analysis tool focused on teaching and code consistency.
      It is commonly added as a Mix development/test dependency and run with mix credo
      to report refactoring opportunities, complex code, common mistakes, naming
      inconsistencies, and style issues.
  timeline:
    - '0.1.0: Initial release'
    - '0.2.0: Added non-zero exit status when issues are found'
    - '0.3.0: Added per-function lint support'
    - '0.4.0: Added custom check support and changed .credo.exs merging behavior'
    - '1.0.0: Stabilized the 1.x line with documentation and breaking changes for custom checks'
    - '1.7.0: Added SARIF output and check IDs'
  usage:
    - >
      The README recommends adding {:credo, "~> 1.7", only: [:dev, :test], runtime:
      false} to mix.exs, running mix deps.get, and then running mix credo. Configuration
      is usually generated or maintained in .credo.exs.
related-packages:
  - id: brew:elixir
    reason: >
      Credo is installed as an Elixir dependency and executed with Mix, so the Elixir
      toolchain is its required adjacent development workflow.
