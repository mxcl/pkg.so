history:
  adoption-history:
    - >
      The desktop app serves the established CurseForge mod and add-on ecosystem and
      supports several games across macOS, Windows, and Linux, with the precise
      supported set varying by platform. Its guided installation, profile management,
      and automatic-update features provide a mainstream graphical alternative to
      manually managing game modifications.
  package-nerd-significance:
    - >
      CurseForge matters to package-oriented users as a domain-specific dependency and
      profile manager: it resolves compatible game versions and mod loaders, maintains
      isolated modding environments, and applies updates to collections of third-party
      content.
  project-history:
    - >
      CurseForge’s current desktop application is published as an Overwolf product and
      provides access to the CurseForge catalog through both an Overwolf-based client
      and standalone variants on supported platforms.
  related-projects:
    - >
      The Minecraft workflow integrates with mod loaders including Forge, Fabric,
      NeoForge, and Quilt, as documented by CurseForge support.
  sources:
    - https://curseforge.overwolf.com/
    - https://support.curseforge.com/support/solutions/articles/9000193488
    - https://support.curseforge.com/support/solutions/articles/9000218572-getting-started
  summary:
    - >
      CurseForge is a desktop manager for discovering, installing, updating, and
      organizing game mods, add-ons, custom profiles, and modpacks.
  timeline:
    - '2020: Overwolf announced its acquisition of the CurseForge platform from Twitch.'
    - >
      2020s: CurseForge expanded its standalone desktop application and cross-platform
      game-management documentation.
  usage:
    - >
      Users add or scan for installed games, install mods from the app or CurseForge
      website, create profiles, select compatible mod loaders, and configure update
      checks. For Minecraft, the documented default macOS modding directory is
      /Users/[user]/Documents/curseforge/minecraft/.
