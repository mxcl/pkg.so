id: brew:keyring
display-name: keyring
repo: https://github.com/jaraco/keyring
docs:
  - https://keyring.readthedocs.io/en/latest
config-file-location:
  unix:
    - keyringrc.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      keyring became infrastructure in the Python packaging and developer-tools
      ecosystem because tools can use it for credentials without inventing their own
      password storage. PyPI release history, Read the Docs documentation, and
      downstream packages show a long-lived library with regular maintenance across
      Python and operating-system changes.
  package-nerd-significance:
    - >
      keyring is small but central because it connects Python packaging, CLIs, desktop
      secret stores, and enterprise artifact repositories. It is also a useful example
      of packaging security posture: plaintext and weaker backends were moved to an
      alternate package rather than silently remaining first-class defaults.
  project-history:
    - >
      The project began as python-keyring-lib and later settled into the jaraco/keyring
      repository. A 2014 maintainer announcement moved hosting from Bitbucket to GitHub,
      preserving issues and source history while aligning development with GitHub and
      Travis CI workflows of that period.
    - >
      The project steadily narrowed and modularized its backend surface. Less preferred
      or risky backends were split into keyrings.alt, while the main package
      concentrated on recommended system keyrings and a CLI/API that applications could
      call safely.
  related-projects:
    - >
      Related projects include keyrings.alt for alternate backends,
      SecretStorage/libsecret for Linux Secret Service integration, pywin32-ctypes for
      Windows credential access, KWallet bindings, pip/twine-style packaging clients,
      and cloud artifact-registry keyring plugins.
  sources:
    - https://github.com/jaraco/keyring
    - https://groups.google.com/g/python-keyring/c/m62BwNm5Wc8
    - https://keyring.readthedocs.io/en/latest
    - https://keyring.readthedocs.io/en/latest/history.html
    - https://pypi.org/project/keyring/
    - https://pypi.org/project/keyrings.alt/
  summary:
    - >
      Python keyring is the common Python library and command-line tool for storing and
      retrieving secrets through the operating system credential store. It gives Python
      applications one API over macOS Keychain, Freedesktop Secret Service/libsecret,
      KDE KWallet, Windows Credential Manager, and extension backends.
  timeline:
    - '2014: The maintainer announced the move from Bitbucket to GitHub under jaraco/keyring.'
    - >
      2010s: The project supported the major desktop credential stores through a unified
      Python API.
    - >
      2017: Legacy and less preferred backends were split toward keyrings.alt, reducing
      the default backend surface.
    - >
      2024: v24 removed older macOS and utility modules while retaining the main
      credential-store API.
    - '2025: v25 releases continued backend and CLI maintenance, including KWallet 6 support.'
  usage:
    - >
      Applications call keyring.set_password, get_password, or credential APIs, while
      users can invoke the keyring command to inspect or manage secrets. The package
      chooses a viable backend for the environment, and users can configure explicit
      backends through keyringrc.cfg when automatic selection is not enough.
related-packages:
  - id: brew:pass
    reason: >
      The documented keyring_pass backend lets Python keyring clients store credentials
      through pass, making pass a useful adjacent workflow for users who prefer a
      GPG-encrypted, Git-friendly Unix password store.
    rel: adjacent_workflow
    sources:
      - https://keyring.readthedocs.io/en/stable/
      - https://www.passwordstore.org/
