history:
  adoption-history:
    - >
      apfel's official site reports rapid GitHub adoption in 2026 and the repository
      lists thousands of stars. Homebrew packaging made the command available as a
      one-command install for macOS users.
  package-nerd-significance:
    - >
      apfel is package-nerd significant because it packages an operating-system model
      API as a composable command-line tool and localhost API backend. It gives Homebrew
      users an immediately scriptable local LLM endpoint without a model artifact,
      daemon setup, or cloud credential path.
  project-history:
    - >
      The official site presents apfel as a zero-configuration way to use the language
      model included with Apple Intelligence on Apple Silicon Macs. The GitHub README
      describes it as a UNIX tool, local OpenAI-compatible server, and interactive chat
      interface with no cloud service, no API keys, and no model download.
    - >
      The project is implemented in Swift and targets macOS 26 Tahoe and Apple Silicon.
      Its documentation emphasizes shell composition, JSON output, stdin/stdout
      behavior, local HTTP compatibility with OpenAI SDKs, and on-device inference.
  related-projects:
    - >
      The official site lists related apfel-family tools such as apfel-chat, apfel-gui,
      apfel-mcp, apfel-run, apfel-server-kit, auge, and translate.
  sources:
    - https://apfel.franzai.com/
    - https://github.com/Arthur-Ficial/apfel#readme
    - https://github.com/Arthur-Ficial/apfel/blob/main/docs/openai-api-compatibility.md
    - source_facts.package-manager
  summary:
    - >
      apfel is a macOS command-line tool and local OpenAI-compatible server for Apple's
      on-device FoundationModels language model.
  timeline:
    - '2026: Official documentation describes macOS 26 Tahoe and Apple Silicon as requirements.'
    - '2026: v1.8.0 documented on the official site and GitHub release metadata.'
    - >
      2026: Official site reports thousands of GitHub stars and Homebrew installation as
      the primary quick start.
  usage:
    - >
      Users run apfel directly as a UNIX filter, start a local server with apfel
      --serve, or use apfel --chat for an interactive REPL. The documented server
      exposes a localhost OpenAI-compatible API at /v1 for chat completions, responses,
      model listing, health checks, tool calling, and structured output.
    - >
      The official site states that apfel needs no YAML, environment variables, model
      selection, subscriptions, or API keys for its core local model use.
related-packages:
  - id: brew:ollama
    reason: >
      Choose Ollama when you need an OpenAI-compatible local server with downloadable,
      selectable models or non-macOS support; apfel instead uses the model already
      supplied by Apple Intelligence on compatible Macs.
    rel: alternative
    sources:
      - https://apfel.franzai.com/
      - https://docs.ollama.com/api/openai-compatibility
      - https://docs.ollama.com/api/introduction
