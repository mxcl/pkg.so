config-file-location:
  unix:
    - ~/.kawarc.scm
  windows:
    - '%USERPROFILE%\kawarc.scm'
credentials-file-location: null
history:
  adoption-history:
    - >
      Kawa has long occupied a niche among JVM languages: it is valuable to Scheme users
      who want Java interop, to language implementers studying JVM compilation, and to
      package maintainers who care about Lisp-family runtimes outside the more common C
      or native-code implementations.
  package-nerd-significance:
    - >
      Kawa is significant because it is both a language runtime and a compiler framework
      packaged like a Unix tool. It sits at the intersection of GNU packaging, Scheme
      standards, JVM bytecode, and the long history of alternative languages on Java.
  project-history:
    - >
      The official Kawa internals paper, started from a November 1998 presentation,
      describes Kawa as a set of Java classes for implementing dynamic languages and as
      a near-R5RS Scheme implementation that compiles to JVM bytecode.
    - >
      Kawa evolved beyond a Scheme interpreter into a language framework. The internals
      documentation describes it as both an implementation of Scheme and a toolkit that
      also incorporated projects such as Qexo for XQuery and JEmacs for Emacs Lisp.
    - >
      The official news page records major language-runtime milestones: Kawa 2.0 in
      December 2014 brought R7RS compatibility work, Kawa 2.3 in January 2017 moved the
      source repository to GitLab, Kawa 3.0 in October 2017 updated the codebase for
      Java 8 and Java 9-era changes, and Kawa 3.1.1 was documented in January 2020.
  related-projects:
    - >
      Kawa is related to Scheme standards such as R5RS and R7RS, GNU Guile, other JVM
      languages, Qexo, JEmacs, SRFI libraries, and Java bytecode tooling.
  sources:
    - https://formulae.brew.sh/formula/kawa
    - https://gitlab.com/kashell/Kawa
    - https://www.gnu.org/software/kawa/
    - https://www.gnu.org/software/kawa/internals/index.html
    - https://www.gnu.org/software/kawa/news.html
    - https://www.gnu.org/software/kawa/pt01.html
  summary:
    - >
      Kawa is a GNU Scheme implementation and language framework for the Java Virtual
      Machine, combining a Scheme REPL and compiler with close access to Java classes
      and bytecode.
  timeline:
    - '1998-11: Kawa internals material began as a presentation on compiling Scheme to Java'
    - '2014-12-02: Kawa 2.0 news entry highlighted R7RS compatibility'
    - '2017-01-13: Kawa 2.3 moved source hosting to GitLab'
    - '2017-10-02: Kawa 3.0 updated the project for Java 8 and Java 9-era changes'
    - '2020-01-16: Kawa 3.1.1 documented packaging and browse-manual fixes'
  usage:
    - >
      Users run Kawa as an interactive language, a compiler to Java bytecode, or a
      Java-integrated scripting system. Its documentation emphasizes REPL use, static
      checking, modularity, and direct Java method and class access.
related-packages:
  - id: brew:guile
    reason: >
      GNU Guile is an alternative Scheme runtime optimized for embedding in C and C++
      applications and for GNU extension-language work; choose Kawa when JVM bytecode
      and Java-library interoperability are central.
    rel: alternative
    sources:
      - https://www.gnu.org/software/kawa/Features.html
      - https://www.gnu.org/software/guile/
      - https://www.gnu.org/software/guile/manual/guile.html
  - id: brew:mit-scheme
    reason: >
      MIT/GNU Scheme is an alternative complete Scheme development environment with its
      own compiler, debugger, editor, and runtime library; choose Kawa for Java
      integration and portable JVM deployment.
    rel: alternative
    sources:
      - https://www.gnu.org/software/kawa/Features.html
      - https://www.gnu.org/software/mit-scheme/
