id: brew:chainloop-cli
display-name: Chainloop CLI
repo: null
docs:
  - https://docs.chainloop.dev/
  - https://docs.chainloop.dev/command-line-reference/cli-reference
config-file-location:
  unix:
    - ~/.config/chainloop/config.toml
credentials-file-location:
  unix:
    - ~/.config/chainloop/config.toml
history:
  adoption-history:
    - >
      The official README and docs emphasize use across CI/CD pipelines, with developers
      using the CLI while security and compliance teams define workflow contracts,
      policies, storage, and integrations. Chainloop documentation and changelogs show
      the platform expanding from attestation capture into policies, compliance
      frameworks, vulnerability management, integrations, AI coding-session evidence,
      and enterprise platform features.
  package-nerd-significance:
    - >
      Package nerds care about chainloop-cli because it is a modern supply-chain CLI
      that wraps several packaging-era concerns: SBOMs, provenance, signatures, OCI
      storage, SLSA, in-toto, Sigstore, policy-as-code, and CI/CD evidence capture.
      Homebrew packaging gives developers a local install path for a tool meant to be
      embedded in automated delivery pipelines.
  project-history:
    - >
      Chainloop was introduced on May 22, 2023 as an API for an organization's software
      supply chain, built around a SLSA level 3 provenance-compliant control plane and a
      contract-based attestation process. The README describes Chainloop as an
      open-source evidence store for attestations, SBOMs, VEX, SARIF, QA reports, and
      related software-delivery evidence.
  related-projects:
    - >
      Chainloop is built around or integrates with SLSA, in-toto, Sigstore, OCI
      registries, OPA/Rego policies, Dependency-Track, GUAC, CycloneDX, SPDX, OpenVEX,
      SARIF, CSAF, GitHub Actions, GitLab CI, and Kubernetes/Helm deployment paths.
  sources:
    - https://chainloop.dev/blog/introducing-chainloop/
    - https://github.com/chainloop-dev/chainloop/blob/main/README.md
    - https://docs.chainloop.dev/welcome.md
    - https://docs.chainloop.dev/quickstart.md
    - https://docs.chainloop.dev/command-line-reference/cli-reference.md
    - https://docs.chainloop.dev/llms.txt
  summary:
    - >
      Chainloop CLI is the developer-facing command-line interface for Chainloop's
      software supply-chain evidence store and attestation platform. It is used to
      initialize attestations, add evidence such as SBOMs or vulnerability reports, sign
      metadata, and push it into Chainloop for validation and storage.
  timeline:
    - >
      2023: Chainloop was introduced publicly as an early-access software supply-chain
      attestation platform.
    - >
      2024: Chainloop changelogs added contract-less attestations, material
      auto-discovery, broader evidence types, policies, and Prometheus-oriented
      monitoring.
    - >
      2026: Documentation presents Chainloop as a centralized evidence store with
      real-time visibility, automated compliance, policy evaluation, and CLI-driven
      attestation workflows.
  usage:
    - >
      The quickstart guides users through installing the CLI, logging in, initializing
      an attestation, adding a container image, SBOM, and vulnerability report, then
      pushing the signed attestation. The CLI reference documents commands for applying
      YAML resources, uploading/downloading artifacts, creating attestations, and
      passing configuration through ~/.config/chainloop/config.toml or environment
      variables such as CHAINLOOP_TOKEN.
related-packages:
  - id: brew:dagger
    reason: >
      Chainloop provides an official Dagger module that collects evidence and creates
      attestations directly from Dagger pipelines.
    rel: adjacent_workflow
    sources:
      - https://docs.chainloop.dev/guides/dagger-integration
      - https://docs.dagger.io/
