history:
  project-history:
    - >
      Version 2.0, announced on July 15, 2014, was the project's early public milestone.
      Mozilla said it reduced baseline and progressive JPEG file sizes by about five
      percent on average compared with libjpeg-turbo output, added trellis quantization
      for both baseline and progressive JPEGs, and drew Facebook testing plus a $60,000
      donation toward continued development. The repository README explains the
      technical relationship: MozJPEG is a patch on libjpeg-turbo, stays compatible with
      the libjpeg API and ABI, and can behave as a drop-in replacement when
      MozJPEG-specific improvements are disabled.
  sources:
    - https://formulae.brew.sh/formula/mozjpeg
    - https://github.com/mozilla/mozjpeg
    - https://libjpeg-turbo.org/About/Mozjpeg
    - https://research.mozilla.org/2014/03/05/introducing-the-mozjpeg-project/
    - https://research.mozilla.org/2014/07/15/mozilla-advances-jpeg-encoding-with-mozjpeg-2-0/
  summary:
    - >
      MozJPEG is Mozilla's JPEG encoder project, announced by Mozilla Research on March
      5, 2014 with the goal of improving JPEG compression while retaining compatibility
      with deployed decoders. Mozilla's announcement positioned it as a pragmatic
      web-performance project: JPEG remained universally compatible, photos dominated
      page weight, and replacing JPEG outright would require a long compatibility
      transition.
  usage:
    - >
      In practice MozJPEG is used by image-optimization pipelines, build systems, and
      graphics tools that need standard JPEG output with better size-quality tradeoffs.
      The package ships familiar JPEG utilities such as `cjpeg`, `djpeg`, and
      `jpegtran`, but the README explicitly encourages linking against the C API for
      serious application use. Its package-manager niche is therefore a web/image
      optimization encoder rather than a new image format.
related-packages:
  - id: brew:jpeg-turbo
    reason: >
      Choose libjpeg-turbo for a general-purpose, high-performance JPEG implementation;
      choose MozJPEG when offline compression efficiency matters more than encoding
      speed.
    rel: alternative
    sources:
      - https://github.com/mozilla/mozjpeg#readme
      - https://www.libjpeg-turbo.org/About/Mozjpeg
  - id: brew:jpegoptim
    reason: >
      jpegoptim provides a file-oriented optimization CLI and officially documents
      compatibility with MozJPEG as its underlying JPEG library.
    rel: adjacent_workflow
    sources:
      - https://github.com/tjko/jpegoptim#readme
      - https://github.com/mozilla/mozjpeg#readme
  - id: brew:guetzli
    reason: >
      Choose Guetzli as a standalone, computation-heavy JPEG encoder experiment; choose
      MozJPEG for libjpeg-compatible library integration and progressive JPEG
      optimization.
    rel: alternative
    sources:
      - https://github.com/google/guetzli#readme
      - https://github.com/mozilla/mozjpeg#readme
