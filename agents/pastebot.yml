history:
  adoption-history:
    - >
      Pastebot became part of Tapbots' family of focused Apple-platform utilities. Its
      macOS edition supports iCloud synchronization and Apple's Universal Clipboard,
      fitting it into multi-Mac and Mac-to-iOS workflows.
  package-nerd-significance:
    - >
      Pastebot represents the mature, automation-friendly end of the macOS
      clipboard-manager category. Shell-script filters, exportable filters, keyboard
      shortcuts, blacklisting, and sequential paste give power users more control than
      the operating system's single-item clipboard.
  project-history:
    - >
      Pastebot is developed by Tapbots, an independent Apple-platform software studio
      that has produced utility applications since 2008. The current Mac application
      applies the studio's focused utility design to persistent clipboard history and
      transformation workflows.
  related-projects:
    - Tapbots also develops Ivory and Calcbot and previously developed Tweetbot.
    - >
      Pastebot works alongside macOS Universal Clipboard and can synchronize its main
      clipboard, pasteboards, and filters through iCloud.
  sources:
    - 'Official Help Guide: https://tapbots.com/pastebot/help/'
    - 'Official Tapbots company page: https://tapbots.com/'
    - 'Official product page: https://tapbots.com/pastebot'
  summary:
    - >
      Pastebot is a macOS clipboard manager from Tapbots that records copied items and
      provides reusable pasteboards, filters, search, keyboard-driven recall, and queued
      sequential pasting.
  timeline:
    - '2008: Tapbots began developing focused applications for Apple platforms.'
    - >
      Current generation: Pastebot for Mac provides clipboard history, custom
      pasteboards, filters, sequential paste, and iCloud synchronization.
  usage:
    - >
      Pastebot runs in the background and records copied material for later recall.
      Users can search clippings, assign shortcuts, organize permanent items into custom
      pasteboards, transform text through filters, or queue several clippings for
      sequential pasting.
    - >
      Users handling sensitive information can blacklist applications. The official
      guide says macOS Keychain and 1Password are blacklisted by default.
