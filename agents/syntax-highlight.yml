id: cask:syntax-highlight
display-name: Syntax Highlight
repo: null
docs:
  - https://github.com/sbarex/SourceCodeSyntaxHighlight#readme
config-file-location:
  macos:
    - ~/Library/Preferences/org.sbarex.SourceCodeSyntaxHighlight.plist
    - ~/Library/Application Support/Syntax Highlight
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through Homebrew Cask as `syntax-highlight`, giving
      macOS users a package-managed alternative to downloading the signed application
      manually.
  package-nerd-significance:
    - >
      Syntax Highlight fills a distinctly macOS-oriented developer-tool niche: package
      managers can install a GUI application whose primary value appears inside Finder's
      Quick Look workflow. Its embedded Highlight engine, command-line converter,
      file-type associations, and documented preference files also make it unusually
      inspectable for a desktop preview extension.
  project-history:
    - >
      Syntax Highlight was created as a macOS Quick Look extension for rendering source
      files with syntax highlighting. Its standalone application manages preferences,
      while an embedded Highlight engine performs rendering.
    - >
      The project evolved with Apple's Quick Look platform: its documentation
      distinguishes the older rendering behavior used around Catalina and Big Sur from
      the data-based Quick Look API adopted for macOS Monterey and later.
  related-projects:
    - Highlight, the syntax-highlighting engine embedded by the application.
    - >
      QLMarkdown, a related Quick Look extension by the same developer for rendered
      Markdown previews.
  sources:
    - 'Official README: https://github.com/sbarex/SourceCodeSyntaxHighlight#readme'
    - >
      Official changelog:
      https://github.com/sbarex/SourceCodeSyntaxHighlight/blob/master/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      Syntax Highlight is an open-source macOS application and Quick Look extension that
      renders previews of source-code and other text-based formats without requiring the
      files to be opened in an editor.
  timeline:
    - >
      macOS 10.15 Catalina era: The project targets Apple's extension-based Quick Look
      architecture.
    - "macOS 12 Monterey era: The extension adopts Apple's newer data-based Quick Look API."
  usage:
    - >
      Launch the application at least once so macOS discovers the Quick Look extension,
      then enable it in the system's Extensions settings if necessary. Finder can
      subsequently preview supported source files through Quick Look.
    - >
      The application configures themes, fonts, wrapping, line numbers, preprocessors,
      version-control annotations, and optional language-server behavior. A bundled
      `syntax_highlight_cli` can also perform batch HTML or RTF conversion.
tags:
  - developer-utility
