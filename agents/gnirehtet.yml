id: brew:gnirehtet
display-name: Gnirehtet
repo: https://github.com/Genymobile/gnirehtet
docs:
  - https://github.com/Genymobile/gnirehtet#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Gnirehtet spread through developer package managers because it solves a specific
      lab and testing problem: giving USB-connected Android devices network access from
      the host. Homebrew, Nix, and Scoop packaging make it easy to install alongside adb
      on macOS, Linux, and Windows workstations.
  package-nerd-significance:
    - >
      Gnirehtet is a classic package-manager utility: tiny scope, awkward to replace
      with built-in OS features, and useful only when the exact networking edge case
      appears. Its value is that it turns adb reverse-tethering setup into a
      reproducible installable command.
  project-history:
    - >
      The project grew out of Genymobile's Android tooling work and presents itself as a
      small, cross-platform utility rather than a desktop network manager. Its README
      documents Java and Rust distributions, adb requirements, an APK installed on the
      device, and a relay process on the host.
  related-projects:
    - >
      Gnirehtet sits near Android SDK Platform Tools, adb reverse, Genymotion's Android
      tooling ecosystem, and host-side network testing workflows.
  sources:
    - https://formulae.brew.sh/formula/gnirehtet
    - https://github.com/Genymobile/gnirehtet
  summary:
    - >
      Gnirehtet is Genymobile's reverse-tethering tool for Android devices. The project
      routes a connected Android device through a computer's network connection over adb
      without requiring root access on either side.
  timeline:
    - '2017: Arch User Repository metadata shows third-party packaging for Gnirehtet.'
    - >
      2022: Forum and support references show users applying Gnirehtet to airplane-mode
      and USB reverse-tethering cases.
    - >
      2024: Homebrew test discussion records the formula using the installed binary for
      validation.
  usage:
    - >
      Practitioners use gnirehtet when an Android device needs internet access through a
      development machine, especially during testing on controlled networks or devices
      without usable Wi-Fi or cellular data. The simple path is `gnirehtet run`; split
      commands let users run the relay, install the APK, and start or stop clients per
      device.
related-packages:
  - id: cask:android-platform-tools
    reason: >
      Android SDK Platform-Tools provides the recent adb binary that Gnirehtet
      officially requires for installing its client and creating the reverse connection.
    rel: adjacent_workflow
    sources:
      - https://github.com/Genymobile/gnirehtet#adb
      - https://developer.android.com/tools/adb
