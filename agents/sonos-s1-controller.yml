history:
  adoption-history:
    - >
      S1 remains necessary for Sonos systems containing certain early products that
      cannot use the current Sonos app. Households with mixed generations can maintain
      separate S1 and current-generation systems, although products controlled by the
      two apps cannot be grouped together.
    - >
      Sonos continues to distribute S1 Controller for macOS, Windows, iOS, Android, and
      FireOS as a legacy compatibility application.
  package-nerd-significance:
    - >
      S1 Controller is a notable compatibility package: it preserves control of
      otherwise functional network-audio hardware after the Sonos software platform
      split. Its continued availability illustrates how package maintenance can extend
      the practical life of connected devices even when a vendor's primary client moves
      to a newer platform generation.
  project-history:
    - >
      Sonos S1 Controller is the legacy branch of the Sonos controller software. In May
      2020, Sonos divided its software ecosystem between S1, retained for early
      hardware, and the newer platform then known as S2.
    - >
      Rather than upgrading every household as one indivisible system, Sonos documented
      migration, downgrade, and split-system paths. Compatible products can move to the
      current app, while S1-only products remain in a separate system controlled by S1
      Controller.
  related-projects:
    - Sonos app
    - Sonos S2
    - Sonos system software
  sources:
    - >
      https://support.sonos.com/en-us/article/downgrade-a-sonos-product-to-s1 — official
      downgrade workflow.
    - >
      https://support.sonos.com/en-us/downloads — official S1 purpose, platforms, and
      compatibility links.
    - >
      https://support.sonos.com/en/article/set-up-separate-s1-and-s2-sonos-systems —
      official split-system guidance and limitations.
    - >
      https://www.sonos.com/pdfs/productguides/en-us/sonos-user-guide.pdf — official
      guide documenting the May 2020 compatibility boundary.
  summary:
    - >
      Sonos S1 Controller is the legacy controller application for Sonos systems
      containing the company's earliest network-audio products.
  timeline:
    - >
      2020-05: Sonos established the S1/current-platform compatibility boundary;
      products released after this point do not support S1 Controller.
    - >
      After 2020: Sonos maintained S1 downloads and documented migration, downgrade, and
      separate-system workflows for mixed-generation households.
  usage:
    - >
      S1 Controller browses and plays audio, groups compatible rooms, and manages an S1
      Sonos system. Users with mixed hardware generations may split their equipment into
      two independent systems and use S1 Controller for older products and the current
      Sonos app for newer products.
