id: brew:git-pkgs-forge
display-name: forge
repo: null
docs:
  - https://github.com/git-pkgs/forge#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/forge/config
    - ~/.config/forge/config
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/forge/config
    - ~/.config/forge/config
history:
  adoption-history:
    - >
      The input records a Homebrew package for this project. The official README
      presents both a reusable Go library and a command-line interface, allowing
      adoption in programs as well as shell workflows.
  package-nerd-significance:
    - >
      forge offers one interface over several otherwise incompatible forge APIs. It is
      useful to package-tool authors who need repository, issue, release, or
      authentication operations without binding their code to a single hosting provider.
  project-history:
    - >
      The git-pkgs organization developed forge as a Go library and CLI for interacting
      with GitHub, GitLab, Gitea, Forgejo, Bitbucket Cloud, and other Git hosting
      services through a unified model. Its CLI follows the compact workflow style of
      provider-specific tools while detecting the target host from a repository's Git
      remote.
  related-projects:
    - GitHub CLI and GitLab CLI provide provider-specific alternatives.
    - Gitea and Forgejo are supported self-hosted forge platforms.
  sources:
    - https://github.com/git-pkgs/forge#readme
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      forge is a Go library and CLI that provides a common interface for working with
      multiple Git forge services.
  timeline:
    - >
      2026: Official documentation lists support for GitHub, GitLab, Gitea, Forgejo,
      Bitbucket Cloud, and additional forge types.
  usage:
    - >
      Users invoke `forge` commands from a Git checkout, where the host can be inferred
      from the remote, or select a host explicitly with `--host` or `FORGE_HOST`.
    - >
      Authentication tokens can come from flags, provider-specific environment
      variables, literal entries in the configuration file, or `token-cmd` commands that
      retrieve secrets from a password manager.
related-packages:
  - id: brew:gh
    reason: >
      Choose GitHub CLI for a first-party, GitHub-only interface with extensive commands
      for pull requests, Actions, releases, repositories, and other GitHub services;
      choose forge when one workflow must span several forge implementations.
    rel: alternative
    sources:
      - https://github.com/git-pkgs/forge#readme
      - https://cli.github.com/manual/gh
  - id: brew:glab
    reason: >
      Choose GLab for GitLab-specific issues, merge requests, pipelines, releases, and
      self-managed GitLab workflows; choose forge for a provider-neutral interface that
      also supports GitHub, Gitea, Forgejo, and other forges.
    rel: alternative
    sources:
      - https://github.com/git-pkgs/forge#readme
      - https://docs.gitlab.com/cli/
