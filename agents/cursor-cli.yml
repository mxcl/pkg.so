config-file-location:
  unix:
    - ~/.cursor/cli-config.json
    - .cursor/cli.json
  windows:
    - $env:USERPROFILE\.cursor\cli-config.json
    - .cursor\cli.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The cask package turns Cursor's agent CLI into a package-manager-installable
      developer tool. That matters for teams standardizing AI coding tools across
      shells, CI jobs, and workstation bootstrap scripts.
  package-nerd-significance:
    - >
      Cursor CLI is significant as a proprietary AI coding agent distributed like a Unix
      command: installable, scriptable, configurable, and usable headlessly.
  project-history:
    - >
      Cursor's official CLI docs describe terminal-based agent sessions, non-interactive
      print mode, Cloud Agent handoff, resumable sessions, sandbox controls, and
      configuration through cli-config.json.
  related-projects:
    - >
      Cursor editor, Cursor Cloud Agent, MCP servers, and other terminal coding agents
      are adjacent tools.
  sources:
    - https://cursor.com/docs/cli/headless
    - https://cursor.com/docs/cli/installation
    - https://cursor.com/docs/cli/overview
    - https://cursor.com/docs/cli/reference/authentication
    - https://cursor.com/docs/cli/reference/configuration
    - source_facts.version
  summary:
    - >
      Cursor CLI is the command-line interface for Cursor Agent, letting developers
      interact with AI coding agents from a terminal for interactive work, scripts, and
      CI automation.
  timeline:
    - '2026: The Homebrew cask input records a dated packaged build, 2026.07.01-777f564.'
  usage:
    - >
      Users install the CLI, authenticate with browser login or CURSOR_API_KEY, then run
      agent interactively or in print mode with prompts, models, and output formats. The
      config file stores CLI settings and permissions; API keys are supplied through
      environment variables or command flags.
