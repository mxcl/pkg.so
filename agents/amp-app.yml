history:
  adoption-history:
    - >
      Amp became publicly available without a waitlist in May 2025. It subsequently
      added a dedicated CLI, SDK, free-use experiments, agentic code review, and
      interfaces for supervising multiple concurrent agents.
    - >
      In 2026 the product moved away from editor extensions toward a rebuilt CLI and
      distributed, durable agent execution. Web, mobile, CLI, orb, and connected-runner
      interfaces became different control surfaces for the same agent system.
  package-nerd-significance:
    - >
      Amp is notable to development-tool users as a packaged coding agent that treats
      the shell and repository as its working environment rather than limiting itself to
      inline completion. It supports repository instruction files, settings at user and
      workspace scope, plugins, skills, remote execution, and noninteractive invocation.
    - >
      The product's rapid migration from editor extensions to a CLI-centered distributed
      architecture illustrates how AI development tooling can change its installation
      and workflow model while preserving the same command name and account-backed
      service.
  project-history:
    - >
      Amp emerged publicly in 2025 as an agentic programming environment spanning editor
      and command-line workflows. Early features included repository guidance through
      AGENTS.md, an in-editor completion engine, and a CLI for interactive terminal use.
    - >
      During 2026, Amp retired its VS Code and Cursor extensions, rebuilt the CLI on a
      remotely controllable and plugin-capable architecture, and introduced a unified
      interface for observing and driving agents across local machines and hosted
      execution environments.
  related-projects:
    - >
      Amp CLI, the terminal client used by the packaged macOS application and other
      supported platforms.
    - Amp orbs and runners, which provide hosted or connected-machine execution.
    - >
      The official ampcode GitHub organization, which publishes integrations and
      examples but not an official public repository for the core Amp application.
  sources:
    - https://ampcode.com/docs/cli
    - https://ampcode.com/news/agents-everywhere
    - https://ampcode.com/news/amp-is-now-available
    - https://ampcode.com/news/neo
    - https://ampcode.com/news/the-coding-agent-is-dead
    - https://ampcode.com/news/towards-a-new-cli
  summary:
    - >
      Amp is an account-backed AI coding agent and development environment. It can work
      from the terminal, desktop or web interface, hosted orbs, and connected runners,
      with durable threads that users can observe and steer remotely.
  timeline:
    - '2025-05-15: Amp became available to everyone without a waitlist.'
    - '2025-07-23: Amp released a new terminal-oriented CLI.'
    - >
      2026-03-05: Amp ended its VS Code and Cursor editor extensions in favor of
      CLI-centered operation.
    - >
      2026-05-06: The rebuilt Neo CLI began rolling out with remote control, compaction,
      and plugins.
    - >
      2026-06-04: Amp introduced a unified web, mobile, and CLI interface for
      distributed agents.
  usage:
    - >
      Developers start `amp` in a project directory for an interactive agent or use
      execute mode for scripted work. User settings live under `~/.config/amp`, while a
      repository can carry `.amp/settings.json` or `.amp/settings.jsonc` workspace
      overrides.
    - >
      Amp can inspect and edit code, run development commands, review changes, and
      continue work on local machines, connected runners, or hosted orbs. Threads can be
      monitored and steered from Amp's other interfaces.
