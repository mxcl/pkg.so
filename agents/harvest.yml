history:
  adoption-history:
    - >
      Harvest expanded from a small-business web timesheet into a broader time-tracking
      and billing platform. Its official history records online-payment support in 2010
      and an expanding collection of integrations and native applications by 2015.
    - >
      Harvest reports that its customers had tracked more than two billion hours and
      sent or received over $63 billion through invoices and payments by 2024. The
      company describes adoption across freelancers, professional-services firms, small
      businesses, and departments within large enterprises.
  package-nerd-significance:
    - >
      Harvest exemplifies the shift from locally installed timesheet software to
      synchronized web services with native desktop companions, integrations, and APIs.
      The Mac app keeps timers and daily entries close to the desktop while the browser
      remains the full administrative interface.
  project-history:
    - >
      Harvest was created by two New York web-design-agency owners who wanted a simpler
      way to understand and bill their own company’s time. The web service launched on
      March 14, 2006, emphasizing uncomplicated timesheets and reports for small
      companies and teams.
    - >
      Early development added detailed daily entries, notes, a stopwatch-style timer,
      approval workflows, a Basecamp integration, an API, and a Mac OS X Dashboard
      widget. These additions established the combination of centralized business data
      and lightweight time-entry clients that still characterizes Harvest.
  related-projects:
    - Harvest Forecast is the company’s related team-scheduling and capacity-planning product.
    - >
      Harvest publishes an API and integrations that connect its time-entry workflow
      with project-management and collaboration tools.
  sources:
    - 'Official 2006 release announcement: https://www.getharvest.com/blog/2006/03/first-post'
    - >
      Official Mac app overview:
      https://support.getharvest.com/hc/en-us/articles/4407357867277-Mac-app-Overview
    - 'Official company history: https://www.getharvest.com/about'
    - >
      Official early API and Mac widget announcement:
      https://www.getharvest.com/blog/2006/11/api-and-widgets
    - >
      Official early feature history:
      https://www.getharvest.com/blog/2006/04/harvest-improvements
  summary:
    - >
      Harvest is a time-tracking and billing service launched in 2006 for small
      companies and professional teams. The macOS application is a focused desktop
      client for recording time, while reporting, administration, and other complete
      functionality remain available through the web service.
  timeline:
    - '2006: Harvest launched as a web-based time-tracking and reporting service.'
    - >
      2006: Daily entries, timers, Basecamp integration, an API, and a Mac OS X
      Dashboard widget followed the initial release.
    - '2010: Harvest added an online-payments integration.'
    - >
      2015: Native applications and integrations made Harvest available across more
      devices and work tools.
    - >
      2024: Harvest reported more than two billion hours tracked and over $63 billion
      handled through invoices and payments.
  usage:
    - >
      Users sign in to the Mac app, choose an assigned project and task, and either run
      a timer or enter completed work manually. The app also provides favorites,
      idle-time handling, daily and weekly totals, menu-bar controls, and customizable
      global keyboard shortcuts.
    - >
      The desktop application requires an internet connection and is optimized for time
      entry. Users open Harvest in a browser for full functionality such as timesheet
      submission and broader account management.
