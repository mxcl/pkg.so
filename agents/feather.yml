id: cask:feather
display-name: Feather Wallet
repo: null
docs:
  - https://docs.featherwallet.org/
config-file-location:
  linux:
    - ~/.config/feather/settings.json
  macos:
    - ~/Library/Preferences/settings.json
  windows:
    - C:/Users/<USER>/AppData/Local/FeatherWallet/settings.json
credentials-file-location:
  linux:
    - ~/Monero/wallets/
  macos:
    - ~/Monero/wallets/
  windows:
    - C:/Users/<USER>/Documents/Monero/wallets/
history:
  adoption-history:
    - >
      Feather progressed through public beta releases in 2020 and 2021 before its 1.0
      release in October 2021. It is available on Linux, macOS, Windows, Raspberry Pi,
      and other supported architectures.
    - >
      Development has been funded through the Monero Community Crowdfunding System and
      donations. Later releases added reproducible and bootstrappable builds, an
      official Flatpak, hardware-wallet support, and compatibility updates for Monero
      protocol changes.
  package-nerd-significance:
    - >
      Feather is notable to packaging and security enthusiasts for treating distribution
      integrity as part of the wallet's threat model. Official releases are signed,
      major builds are reproducible, and the project adopted a Guix-based bootstrappable
      build system to reduce supply-chain trust.
    - >
      Its explicit documentation of program-data paths, wallet paths, portable mode, Tor
      integration, and release verification makes it unusually transparent for a desktop
      cryptocurrency wallet.
  project-history:
    - >
      Feather Wallet was created by dsc, tobtoht, and contributors as a small, fast,
      beginner-friendly graphical Monero wallet that could also expose capabilities
      comparable to the official command-line wallet.
    - >
      The project became a venue for experimenting with privacy and wallet features that
      might later be adopted by reference Monero wallets. It uses the Monero wallet
      implementation with project-specific modifications and includes privacy-oriented
      features such as built-in Tor support.
  related-projects:
    - >
      Feather is built for the Monero network and is closely related to the official
      Monero CLI and GUI wallets. It also supports selected Ledger and Trezor hardware
      wallets.
  sources:
    - https://docs.featherwallet.org/guides/about
    - https://docs.featherwallet.org/guides/features
    - https://docs.featherwallet.org/guides/paths
    - https://featherwallet.org/changelog/
  summary:
    - >
      Feather Wallet is a free and open-source desktop wallet for Monero. It combines a
      lightweight graphical interface with advanced privacy, transaction,
      hardware-wallet, and release-verification features.
  timeline:
    - '2020: Public beta releases began.'
    - '2021: Feather Wallet 1.0 was released.'
    - >
      2022: Version 2.0 prepared Feather for a Monero network upgrade and expanded
      privacy controls.
    - '2023: The project documented bootstrappable, reproducible builds based on Guix.'
    - >
      2024: Feather issued its first emergency releases after transaction construction
      was disrupted by a wallet-library check.
  usage:
    - >
      Users create or restore a Monero wallet, synchronize it with a node, receive and
      send XMR, manage subaddresses and transaction history, and optionally use Tor,
      offline signing, or supported hardware wallets.
    - >
      Wallet files contain sensitive cryptographic material and are stored separately
      from the program's settings. The documented paths can be changed, and portable
      mode places both settings and wallet files in a `feather_data` directory beside
      the program.
