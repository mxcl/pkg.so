id: brew:contentful-cli
display-name: Contentful CLI
repo: https://github.com/contentful/contentful-cli
docs:
  - https://github.com/contentful/contentful-cli/tree/main/docs
config-file-location:
  unix:
    - ~/.contentfulrc.json
credentials-file-location:
  unix:
    - ~/.contentfulrc.json
history:
  adoption-history:
    - >
      Its adoption tracks Contentful's API-first CMS workflow: the README and docs
      emphasize global Node package installation, Homebrew provides a bottled formula,
      and the command set covers the day-to-day operations a team would otherwise
      perform through the Contentful web app or APIs.
  package-nerd-significance:
    - >
      For package managers, Contentful CLI is a representative SaaS automation CLI: a
      fast-moving npm-origin tool with a stable executable name, a home-directory
      credentials file, and an official upstream that also ships
      standalone/package-manager-friendly releases.
  project-history:
    - >
      The npm package was first published in May 2017, and the official GitHub
      repository was created later that year. Contentful maintains it as an MIT-licensed
      Node.js CLI distributed through npm/yarn and also packaged by Homebrew.
  related-projects:
    - >
      The CLI references Contentful's Migration DSL and Content Management API, and it
      sits beside Contentful SDKs as the terminal-oriented automation surface for the
      service.
  sources:
    - https://www.npmjs.com/package/contentful-cli
    - https://github.com/contentful/contentful-cli
    - https://github.com/contentful/contentful-cli/tree/main/docs
    - https://github.com/contentful/contentful-cli/blob/main/docs/login/README.md
    - https://github.com/contentful/contentful-cli/releases/tag/v4.0.2
    - https://formulae.brew.sh/formula/contentful-cli
  summary:
    - >
      Contentful CLI is the official command-line interface for Contentful, aimed at
      developers who want to automate Contentful spaces, migrations, imports, exports,
      extensions, and organization checks from a terminal or CI system.
  timeline:
    - '2017-05-24: npm package created.'
    - '2017-08-31: Official GitHub repository created.'
    - '2026-06-05: v4.0.2 release published.'
  usage:
    - >
      Typical use is `contentful login` to create or store a Content Management API
      token, then commands such as `contentful init`, `contentful space`, import/export,
      migration generation and execution, extension management, and organization
      security checks. The token is stored in `.contentfulrc.json` in the user's home
      directory.
related-packages: []
