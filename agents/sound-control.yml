history:
  adoption-history:
    - >
      Sound Control is sold directly by Static Z and is also offered through the Mac App
      Store, with the vendor noting that the two purchase channels are not
      interchangeable.
    - >
      Its feature set grew beyond per-app volume to cover Audio Unit effects, routing,
      per-app balance, MIDI control, headphone calibration, and automatic
      input/output-device priorities.
  package-nerd-significance:
    - >
      Sound Control fills gaps in macOS audio management that are especially visible
      with HDMI displays, external interfaces, Bluetooth devices, and multi-application
      production or conferencing setups.
    - >
      For package-manager users, it represents the class of native utilities that expose
      audio-routing and per-process controls normally absent from the operating system’s
      standard UI.
  project-history:
    - >
      Static Z Software developed Sound Control as a macOS utility for controlling
      application and device audio from a unified interface. Public vendor release
      records show the second major generation in active maintenance by 2018.
    - >
      Sound Control 3 arrived in 2023 with independent device effects and balance,
      broader Audio Unit support, MIDI integration, and AutoEQ presets. Later releases
      adapted its audio components and sandboxing to successive macOS security and
      audio-system changes.
  related-projects:
    - >
      Sound Siphon is Static Z’s companion application for capturing and redirecting Mac
      audio.
    - AutoEQ calibration data can be loaded through Sound Control’s equalizer integration.
  sources:
    - https://staticz.com/sound-control-2-2-0-release-notes/
    - https://staticz.com/sound_control_3_0_0_release_notes/
    - https://staticz.com/sound_control_3_2_0_release_notes/
    - https://staticz.com/soundcontrol/
    - https://staticz.zendesk.com/hc/en-us/categories/16305732747021-Sound-Control-3
  summary:
    - >
      Sound Control is a commercial macOS audio utility from Static Z Software. It
      provides per-application volume, effects, equalization, balance and output
      routing, plus device switching and automation controls.
  timeline:
    - '2018: Sound Control 2.2 was released as a free upgrade for Sound Control 1 owners.'
    - >
      2020: Version 2.5 added input-device priorities, AirPlay support, and expanded
      AppleScript control.
    - >
      2023: Sound Control 3.0 added independent output-device processing, broader Audio
      Unit hosting, MIDI control, and AutoEQ presets.
    - >
      2024: Version 3.2 made the application sandboxed and revised its system-audio
      processing architecture.
  usage:
    - Adjust or mute individual applications without changing the Mac’s master output volume.
    - >
      Apply Audio Unit effects or headphone equalization, route applications to
      different outputs, control audio through hotkeys or MIDI, and prioritize preferred
      input and output devices.
