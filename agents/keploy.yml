config-file-location:
  unix:
    - ./keploy.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Keploy developed visible adoption signals beyond a small CLI: the README linked to
      Slack, LinkedIn, YouTube, X, documentation, community materials, and the CNCF
      Landscape entry. On 2026-07-01, GitHub API metadata reported 17,843 stars and
      2,252 forks, and Homebrew metadata listed v3.5.82 with 243 installs in the
      previous 30 days.
  package-nerd-significance:
    - >
      Keploy represents the packaging of eBPF-backed test capture as a normal developer
      CLI. That puts it in the same package-nerd conversation as tools that turn runtime
      behavior into reproducible artifacts: recorders, mock generators, and CI-friendly
      local infrastructure substitutes.
  project-history:
    - >
      The keploy/keploy repository was created on GitHub on 2022-01-19. The official
      README describes Keploy as a developer-centric testing tool that auto-generates
      tests and data mocks from real API calls, database queries, and streaming events.
    - >
      By the 2026 README, Keploy emphasized code-less, language-agnostic capture at the
      network layer using eBPF. The documentation also split the project into
      installation, quickstart, record-replay, CI/CD, coverage, and cloud features.
  related-projects:
    - >
      The official docs and README position Keploy around API testing, integration
      testing, mocks, CI/CD, OpenAPI-driven coverage, and infrastructure virtualization.
    - >
      The README links Keploy to the CNCF Landscape under application definition and
      development tooling.
  sources:
    - https://api.github.com/repos/keploy/keploy
    - https://api.github.com/repos/keploy/keploy/releases?per_page=10
    - https://formulae.brew.sh/api/formula/keploy.json
    - https://github.com/keploy/keploy
    - https://keploy.io/docs
    - https://raw.githubusercontent.com/keploy/keploy/main/README.md
  summary:
    - >
      Keploy is an open-source API and integration testing platform that records real
      traffic, database calls, and streaming events, then replays them as deterministic
      tests and mocks.
    - >
      The project is significant in the package-manager ecosystem because it ships a
      developer-facing CLI for a modern record-and-replay testing workflow, including
      eBPF-based traffic capture and CI usage.
  timeline:
    - '2022-01-19: keploy/keploy repository created on GitHub.'
    - '2026-06-29: v3.5.82 release published on GitHub.'
    - '2026-07-01: Homebrew formula metadata listed Keploy v3.5.82.'
    - '2026-07-01: GitHub API metadata reported 17,843 stars and 2,252 forks.'
  usage:
    - >
      The core CLI workflow is to install the Keploy agent, run an application with
      keploy record, exercise real API flows, then run keploy test to replay the
      captured traffic offline with mocks. The README describes support across languages
      because capture happens below application SDK boundaries.
    - >
      Package users usually care about Keploy when they want integration tests without
      hand-writing large mock suites, especially for services that depend on databases,
      queues, or external APIs.
related-packages:
  - id: cask:docker-desktop
    reason: >
      Use Docker Desktop for Keploy's officially documented container workflow when
      recording applications and dependencies that run in Docker on macOS or Windows.
    rel: adjacent_workflow
    sources:
      - https://keploy.io/docs/concepts/installation/
      - https://docs.docker.com/desktop/
  - id: brew:jenkins
    reason: >
      Use Jenkins to run Keploy's documented CI replay workflow and inject the required
      Keploy API key through Jenkins credentials.
    rel: adjacent_workflow
    sources:
      - https://keploy.io/docs/ci-cd/jenkins/
      - https://www.jenkins.io/doc/
