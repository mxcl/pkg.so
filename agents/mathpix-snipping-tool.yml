history:
  adoption-history:
    - >
      Mathpix expanded Snip into a synchronized family of web, desktop, mobile,
      browser-extension, and command-line tools. Mathpix's official site reports
      millions of global users and substantial organizational usage, although those
      figures are vendor claims.
  package-nerd-significance:
    - >
      The Snipping Tool is notable in scientific-computing workflows because it turns
      screen regions into reusable LaTeX, MathML, Markdown, table data, and chemistry
      notation. For package users, it bridges graphical OCR with text-based authoring
      systems such as LaTeX and Markdown.
  project-history:
    - >
      Mathpix developed the Snipping Tool as the desktop capture component of its Snip
      product family. Its scope grew beyond equation capture to text, tables, chemistry
      diagrams, PDFs, searchable snip history, and synchronized scientific-document
      workflows across desktop, web, and mobile clients.
  related-projects:
    - Mathpix Snip Web
    - Mathpix Snip Mobile
    - Mathpix CLI
    - Mathpix Chrome Extension
    - Mathpix OCR and conversion APIs
  sources:
    - https://mathpix.com/
    - https://website.mathpix.com/docs/snip/create-snips
    - https://website.mathpix.com/docs/snip/macos-overview
    - https://website.mathpix.com/snipping-tool
  summary:
    - >
      Mathpix Snipping Tool is Mathpix's desktop OCR application for macOS, Windows, and
      Linux. It captures equations, text, tables, and scientific material from the
      screen and converts them into formats suited to technical writing and data reuse.
  timeline:
    - 'Early product role: Snipping Tool focused on screenshot-to-LaTeX conversion.'
    - >
      Current product generation: Snipping Tool supports broader OCR, document
      conversion, synchronized cloud history, chemistry recognition, and desktop clients
      on macOS, Windows, and Linux.
  usage:
    - >
      Users trigger a configurable global shortcut, select a screen region, and copy the
      recognized result into an editor or document. Supported outputs include LaTeX,
      text, MathML, AsciiMath, SVG, HTML and TSV tables, PNG, and TIFF. A Mathpix
      account is required to sign in, and snips can be saved and synchronized through
      Mathpix's service.
