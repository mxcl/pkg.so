id: brew:changie
display-name: Changie
repo: null
docs:
  - https://changie.dev/
  - https://changie.dev/cli/changie
  - https://changie.dev/config
  - https://changie.dev/guide
  - https://github.com/miniscruff/changie#readme
config-file-location:
  unix:
    - ./.changie.yaml
    - ./.changie.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official installation docs list broad distribution: Homebrew for macOS, AUR,
      Docker images on GitHub Packages, a GitHub Action, npm, Go install, UBI, Scoop,
      Winget, and Mise. The input package facts also record Homebrew, Nix, and Winget
      mappings.
  package-nerd-significance:
    - >
      Changie is package-nerd significant because it represents the changelog-fragment
      approach as a small compiled CLI with many distribution channels. It gives
      non-Node and monorepo users an alternative to commit-message-only changelog
      generators.
  project-history:
    - >
      The public repository was created in December 2020 and v0.1.0 was released later
      that month. The README describes Changie as a tool for separating changelog
      content from commit messages while keeping release notes in version-controlled
      files.
    - >
      The project remains active in the 1.x line, with GitHub release metadata showing
      v1.25.0 in June 2026.
  related-projects:
    - miniscruff/changie-action is the official GitHub Action linked from the README.
    - >
      The documentation references Keep a Changelog-style output through the default
      generated changelog header.
    - GoReleaser integration is part of the official documentation navigation.
  sources:
    - https://github.com/miniscruff/changie#readme
    - https://changie.dev/guide/
    - https://changie.dev/config
    - https://github.com/miniscruff/changie/releases
    - https://api.github.com/repos/miniscruff/changie
  summary:
    - >
      Changie is a Go CLI for file-based changelog management. Instead of deriving
      release notes entirely from commit messages, it stores change fragments in the
      repository and batches them into release changelogs.
  timeline:
    - '2020: GitHub repository created.'
    - '2020: v0.1.0 published on GitHub releases.'
    - '2021: Early 0.x releases established the fragment, batch, and merge workflow.'
    - '2026: v1.25.0 published on GitHub releases.'
  usage:
    - >
      The quick-start flow is changie init to create project files, edit the generated
      .changie.yaml configuration, run changie new for user-impacting changes, run
      changie batch for a release version or semver bump, and run changie merge to
      update the parent changelog.
related-packages:
  - id: brew:changelogen
    reason: >
      Choose changelogen when a JavaScript-oriented project wants release notes inferred
      from Conventional Commits; Changie instead records explicit change fragments
      throughout development.
    rel: alternative
    sources:
      - https://changie.dev/guide/
      - https://unjs.io/packages/changelogen/
  - id: brew:goreleaser
    reason: >
      GoReleaser can consume the version and release-notes file produced by Changie, and
      Changie's official integration guide documents the exact handoff.
    rel: adjacent_workflow
    sources:
      - https://changie.dev/integrations/goreleaser/
      - https://goreleaser.com/
tags:
  - changelog
  - cli
  - configuration
  - go
  - release-automation
  - versioning
geiger:
  category: appliance
  color: green
  confidence: low
  reason: narrow executable package without higher-risk signals
  reasons:
    - narrow executable package without higher-risk signals
  signals:
    - metadata:no-higher-risk-signals
provenance:
  category-sources:
    - >
      Official README describes Changie as file-based changelog management for releases,
      with configuration options and a single Go binary.
  display-name-sources:
    - Official README heading and changie.dev site title use Changie.
  docs-sources:
    - >
      Official README https://github.com/miniscruff/changie#readme links to user
      documentation at https://changie.dev/ and the configuration docs.
    - >
      Official source core/config.go defines default config paths .changie.yaml and
      .changie.yml and CHANGIE_CONFIG_PATH for custom config files.
  history-sources:
    - https://github.com/miniscruff/changie#readme
    - https://changie.dev/guide/
    - https://changie.dev/config
    - https://github.com/miniscruff/changie/releases
    - https://api.github.com/repos/miniscruff/changie
  repo-sources:
    - source_facts.repo is already populated, so repo is null per prompt.
  tags-sources:
    - >
      Official README and changie.dev docs describe changelog management, release
      preparation, CLI commands, configuration, and Go implementation.
category-confidence: high
category-path:
  - developer-tools
  - release-automation
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
