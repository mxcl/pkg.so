id: brew:lutgen
display-name: Lutgen
repo: null
docs:
  - https://github.com/ozwaldorf/lutgen-rs#readme
  - https://lut.sh
config-file-location:
  linux:
    - $LUTGEN_DIR
    - $XDG_CONFIG_HOME/lutgen
    - ~/.config/lutgen
  macos:
    - $LUTGEN_DIR
    - ~/Library/Application Support/lutgen
  windows:
    - '%LUTGEN_DIR%'
    - '%APPDATA%\lutgen'
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata lists Lutgen across Alpine APK, Homebrew, Nix, and
      Scoop, and the README adds crates.io and Nix flake installation paths. This makes
      it a package-manager-friendly desktop theming utility rather than only a Rust
      crate.
    - >
      Repository metadata shows a few hundred stars and active maintenance into 2026,
      which fits a focused but visible audience in color-scheme, wallpaper, and Linux
      desktop customization communities.
  package-nerd-significance:
    - >
      Lutgen is significant for package nerds because it turns a desktop-rice workflow
      into a small reproducible command-line tool: generate a LUT, apply a palette, and
      integrate it with package-managed themes or wallpapers.
    - >
      Its multi-surface packaging, including CLI, GUI, crate, and flake, is a modern
      Rust packaging pattern where the repository is simultaneously an application, a
      library, and a theme-tool distribution point.
  project-history:
    - >
      The ozwaldorf/lutgen-rs repository was created in 2023 and developed as a Rust
      workspace containing CLI, Studio, and library components. The README centers the
      project on recoloring images to desktop color schemes, with examples for Hald
      CLUTs and color corrections.
    - >
      Lutgen's documentation has a dedicated wiki at lut.sh, while the repository README
      documents source installation, crates.io packages, a Nix flake, and
      development-shell commands.
  related-projects:
    - Hald CLUT workflows are a documented source and output model.
    - Catppuccin, Gruvbox, and Nord appear in README example outputs.
    - >
      Nix flakes, crates.io, docs.rs, and Lutgen Studio are related packaging or project
      surfaces.
  sources:
    - https://api.github.com/repos/ozwaldorf/lutgen-rs
    - https://api.github.com/repos/ozwaldorf/lutgen-rs/releases/latest
    - https://github.com/ozwaldorf/lutgen-rs#readme
    - https://lut.sh/
    - source_facts.package-manager
  summary:
    - >
      Lutgen is a Rust project for generating and applying interpolated lookup tables
      for color palettes. The upstream README describes it as a fast LUT utility for
      arbitrary and popular color palettes, with both CLI and Studio packaging.
  timeline:
    - '2023: ozwaldorf/lutgen-rs repository created.'
    - '2026: GitHub metadata and release listing show continued activity.'
    - '2026: Lutgen Studio v0.4.0 published as the latest GitHub release.'
  usage:
    - >
      Users can install the CLI from source with `cargo install --path crates/cli`, from
      crates.io as `lutgen-cli`, or through package managers. The project also ships
      Lutgen Studio and a Rust library documented through docs.rs.
    - >
      The README emphasizes applying palettes to images and producing Hald CLUT-style
      outputs, and the Nix flake supports running both `lutgen` and `lutgen-studio`
      directly.
related-packages:
  - id: brew:imagemagick
    reason: >
      Use ImageMagick to apply Lutgen-generated Hald CLUT images in broader scripted
      conversion and compositing pipelines using its documented `-hald-clut` operation.
    rel: adjacent_workflow
    sources:
      - https://lut.sh/examples
      - https://imagemagick.org/command-line-options/
