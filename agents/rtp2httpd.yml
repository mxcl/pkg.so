history:
  adoption-history:
    - >
      Official installation documentation covers static binaries, Docker,
      OpenWrt-oriented deployments, and availability through several router and
      embedded-firmware software repositories or app stores.
  package-nerd-significance:
    - >
      rtp2httpd is useful on routers, set-top environments, home servers, and IPTV
      gateways where multicast streams must be exposed to ordinary HTTP clients. Its
      static-binary and OpenWrt distribution options make it particularly relevant to
      embedded-networking package users.
  project-history:
    - >
      rtp2httpd was developed as a lightweight C daemon for converting multicast RTP and
      RTSP sources into HTTP-accessible streams. It later incorporated a status
      dashboard, browser player, playlist and EPG handling, reverse-proxy features, and
      container deployment.
  related-projects:
    - >
      The project offers UDPxy-compatible URLs and is commonly deployed alongside
      OpenWrt-derived firmware, Docker, reverse proxies, IPTV playlists, and HTTP media
      players.
  sources:
    - 'Official configuration reference: https://rtp2httpd.com/reference/configuration'
    - 'Official installation guide: https://rtp2httpd.com/en/guide/installation'
    - 'Official quick start: https://rtp2httpd.com/en/guide/quick-start'
  summary:
    - >
      rtp2httpd is a multicast RTP and RTSP-to-HTTP streaming daemon with an embedded
      web player and status interface, designed especially for IPTV and network-gateway
      deployments.
  timeline:
    - >
      rtp2httpd expanded from multicast-to-HTTP conversion into a streaming service with
      RTSP support, a web player, operational dashboards, playlist features, and
      container deployment.
  usage:
    - >
      The daemon normally listens on port 5140 and serves stream URLs, status
      information, a player, playlists, and EPG data. Operators select upstream
      interfaces and tune multicast, buffering, concurrency, authentication-token, and
      reverse-proxy behavior through command-line options or an INI configuration file.
    - >
      The default Unix configuration path is `/etc/rtp2httpd.conf`; `--config` selects
      another path and `--noconfig` disables file loading. OpenWrt packaging may
      additionally use `/etc/config/rtp2httpd`, but that is packaging-specific rather
      than the shared Unix default.
