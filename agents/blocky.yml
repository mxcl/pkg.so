credentials-file-location: null
history:
  adoption-history:
    - >
      blocky's adoption tracks the home-network and homelab move from appliance-style ad
      blockers to packaged, containerized, and declarative DNS services. The input
      metadata records packages in Alpine apk, Homebrew, and Nix, while the README
      advertises Docker pulls and multi-architecture deployment.
    - >
      The release stream is active: official releases include v0.32.1 on June 20, 2026,
      with several 0.30-plus releases earlier in 2026.
  package-nerd-significance:
    - >
      blocky is interesting to package people because it packages an infrastructure
      service like a normal CLI: one Go binary, config schema, validation command,
      system-service-friendly behavior, and no mandatory database. That makes it easy to
      slot into Homebrew, Nix, Alpine, containers, routers, and homelab automation.
    - >
      It also sits in the same practical category as Pi-hole and AdGuard Home while
      keeping a config-file-first shape that appeals to users who prefer declarative
      package-managed systems.
  project-history:
    - >
      GitHub metadata dates blocky's repository to November 2019. The official README
      describes it as a fast, lightweight DNS proxy and ad blocker for local networks,
      written in Go, with blocking lists, allowlists, conditional forwarding, caching,
      DNSSEC-related features, Prometheus/Grafana integration, REST endpoints, and a
      CLI.
    - >
      The README emphasizes simple operation: stateless behavior, no required database,
      Docker multi-arch images, a single binary, and support for x86-64, ARM, and MIPS.
      The docs describe YAML configuration, folder-based multi-file config merging, and
      generated JSON schema validation.
  related-projects:
    - Pi-hole and AdGuard Home are related local-network DNS blocking projects.
    - Prometheus and Grafana are named integrations in the README.
    - >
      DNS-over-HTTPS, DNS-over-TLS, DNS-over-QUIC, DNSSEC, and OpenWrt/Raspberry Pi
      deployments are adjacent ecosystem pieces named by the official docs and README.
  sources:
    - GitHub repository metadata via gh api repos/0xerr0r/blocky
    - https://0xerr0r.github.io/blocky/latest
    - https://0xerr0r.github.io/blocky/latest/configuration
    - https://0xerr0r.github.io/blocky/latest/installation
    - https://github.com/0xERR0R/blocky#readme
    - https://github.com/0xERR0R/blocky/releases
    - source_facts.package-manager
  summary:
    - >
      blocky is a Go DNS proxy and ad blocker for local networks. It belongs to the
      self-hosted DNS-adblocking family, but its package identity is a single binary
      with YAML configuration, modern encrypted DNS protocols, metrics, and
      router/Raspberry Pi friendly deployment.
  timeline:
    - '2019: Official GitHub repository created.'
    - 'Early release line: Tags begin with v0.2.0 in the public repository.'
    - '2026: v0.32.1 released on June 20 after several active 2026 releases.'
  usage:
    - >
      Operators run blocky as a DNS service and configure upstream resolvers,
      blocklists, allowlists, ports, logging, privacy options, and protocol support in
      YAML. The official configuration docs explain `config.yaml`, `config.yml`, and
      using `--config` to point at a folder of `.yml` or `.yaml` files that are merged
      in lexical order.
related-packages:
  - id: brew:technitium-dns
    reason: >
      Choose Technitium DNS Server when you need an integrated authoritative and
      recursive DNS server with a browser-based administration console, rather than
      blocky's lightweight configuration-file-first proxy.
    rel: alternative
    sources:
      - https://0xerr0r.github.io/blocky/latest/
      - https://technitium.com/dns/
