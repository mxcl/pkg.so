history:
  adoption-history:
    - >
      Official JANDI material describes the service as serving more than 400,000 teams.
      Its localized support, guest roles, integrations, administrative controls, and
      paid enterprise plans position it primarily for organizational adoption,
      especially in its Asian markets.
  package-nerd-significance:
    - >
      JANDI represents the proprietary hosted-collaboration clients commonly shipped
      through desktop package managers: the local package supplies a native desktop
      access point, while accounts, team data, and most behavior remain part of the
      vendor-operated service.
  project-history:
    - >
      JANDI is a workplace collaboration service developed by Toss Lab. Official company
      material from 2015 already presented JANDI under the Toss Lab name, while the
      current service combines team messaging, file sharing, integrations,
      administration, projects, and AI-assisted collaboration across web, desktop, and
      mobile clients.
  related-projects:
    - Slack
    - Microsoft Teams
  sources:
    - https://blog.jandi.com/ko/category/news/
