    - https://support.jandi.com/en
    - https://support.jandi.com/en/articles/Downloading-JANDI-app-54505bb8
    - https://www.jandi.com/landing
  summary:
    - >
      JANDI is Toss Lab's hosted workplace communication and collaboration platform,
      offered through web, desktop, and mobile clients.
  timeline:
    - '2015: Official Toss Lab material presented JANDI as its teamwork product'
    - '2025: JANDI announced integrated project-management capabilities'
    - '2026: JANDI expanded project and AI-assisted collaboration features'
  usage:
    - >
      Teams use JANDI for topic-based conversations, direct and group chat, file sharing
      and search, notifications, external-service integrations, member roles,
      administrative controls, and project work. An account and membership in a JANDI
      team are required for ordinary use.
