credentials-file-location: null
history:
  adoption-history:
    - >
      Livebook was announced as part of an effort to make the Erlang VM ecosystem more
      suitable for numerical and scientific computing. It subsequently grew beyond
      exploratory notebooks into a tool for collaborative development, data work,
      internal tools, and deployable notebook applications.
    - >
      Official desktop builds, Docker images, a Hex-installed escript, embedded-device
      support through Nerves, and integrations with the Nx and Kino ecosystems made
      Livebook accessible across local, server, and embedded environments.
  package-nerd-significance:
    - >
      Livebook brought a first-class notebook workflow to Elixir while retaining the
      BEAM's concurrency and distribution model. Package users can add dependencies
      interactively with Mix.install, build rich interfaces through Kino, connect
      notebooks to running Erlang nodes, and package notebooks as applications.
  project-history:
    - >
      Livebook was publicly announced on April 13, 2021 as an open-source web
      application for interactive and collaborative Elixir notebooks, implemented with
      Phoenix LiveView. Its launch was tied closely to the emerging numerical-Elixir
      ecosystem and demonstrated libraries such as Axon.
    - >
      The project developed into a multi-environment platform with desktop applications,
      Docker images, direct Elixir installation, remote runtimes, secrets, file-system
      integrations, and notebook deployment features.
  related-projects:
    - Elixir
    - Erlang/OTP
    - Phoenix LiveView
    - Kino
    - Nx
    - Axon
    - Nerves
    - Mix
  sources:
    - https://github.com/livebook-dev/livebook
    - https://livebook.dev/blog/announcing-livebook/
    - https://livebook.hexdocs.pm/
    - https://livebook.hexdocs.pm/phoenix_integration.html
    - https://livebook.hexdocs.pm/shared_secrets.html
  summary:
    - >
      Livebook is an open-source environment for writing, executing, and collaborating
      on Elixir notebooks. It combines Markdown and executable code, supports rich
      interactive output and multiple runtimes, and can deploy notebooks as
      applications.
  timeline:
    - '2021: Livebook was publicly announced on April 13.'
    - >
      2021: The initial release showcased collaborative Elixir notebooks and the
      emerging numerical-Elixir stack.
    - >
      Later releases: Desktop builds, Docker deployment, remote runtimes, secrets, and
      deployable notebook applications expanded its scope.
  usage:
    - >
      Developers use Livebook for interactive Elixir exploration, data analysis, machine
      learning, documentation, operational runbooks, and internal tools. It can run as a
      desktop application, an escript, a Docker service, or firmware on supported
      embedded devices; notebooks may connect to separate or existing BEAM runtimes.
