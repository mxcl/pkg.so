history:
  adoption-history:
    - >
      LASTZ is packaged in Homebrew, Debian, and Ubuntu and appears in
      high-performance-computing genomics documentation because pairwise whole-genome
      and read-to-reference alignment remain recurring batch-computing tasks. Its BLASTZ
      compatibility helped existing workflows migrate without rewriting every command
      line.
    - >
      The adoption pattern is typical of scientific command-line tools: a stable
      executable, long HTML manual, tagged source releases, and distribution packages
      matter more than a polished end-user application interface.
  package-nerd-significance:
    - >
      LASTZ is package-nerd significant because it is a specialized scientific CLI whose
      real value is reproducibility: exact versions, tagged releases, and
      package-manager availability let genomics pipelines rerun large alignments with
      known behavior.
    - >
      It also illustrates a common packaging problem in bioinformatics: preserving old
      command-line compatibility while fixing algorithmic bugs and adding formats needed
      by newer workflows.
  project-history:
    - >
      The official documentation presents LASTZ as a drop-in replacement for BLASTZ that
      preserves BLASTZ command-line syntax while adding options and correcting
      behavioral problems. Its documentation includes an explicit section on differences
      from BLASTZ, such as fixes to alignment-boundary behavior, premature termination,
      chaining overflow, ambiguity handling, and additional output formats.
    - >
      The GitHub repository was created on 2016-08-11 and is described by the project as
      the official working branch, with users encouraged to use tagged releases. Tagged
      1.04.x releases continued the project's bioinformatics-maintenance role after the
      BLASTZ era.
  related-projects:
    - >
      LASTZ is directly related to BLASTZ, the Miller Lab alignment tools, and
      downstream genome-alignment formats and pipelines that consume LAV, AXT, MAF, SAM,
      CIGAR, or PAF output.
  sources:
    - https://api.github.com/repos/lastz/lastz
    - https://api.github.com/repos/lastz/lastz/tags?per_page=20
    - https://github.com/lastz/lastz
    - https://lastz.github.io/lastz/
    - https://raw.githubusercontent.com/lastz/lastz/master/README.lastz.html
  summary:
    - >
      LASTZ is a pairwise DNA sequence aligner and the successor-style,
      command-line-compatible replacement for BLASTZ. It is used for comparing genomic
      sequences and can emit formats used by genome-alignment pipelines, including LAV,
      AXT, MAF, SAM, CIGAR, PAF, and human-readable output.
  timeline:
    - '2016-08-11: Official GitHub repository created.'
    - '2017-04-12: Tag 1.04.00 appears in the public GitHub tag set.'
    - '2022-01-11: Tag 1.04.52 appears in the public GitHub tag set.'
    - '2026-05-20: GitHub repository metadata records activity on the official repository.'
  usage:
    - >
      Users run `lastz` with target and query sequences plus scoring, seeding, masking,
      chaining, and output-format options. The manual's examples cover comparing
      chromosomes, aligning shotgun reads to a chromosome, self-alignment, and working
      with seed, HSP, gapped-alignment, and chaining stages.
related-packages:
  - id: brew:minimap2
    reason: >
      Choose minimap2 when one fast aligner must cover long reads, spliced transcripts,
      short reads, and assembly-to-assembly alignment; choose LASTZ when
      BLASTZ-compatible controls and its established whole-genome workflow are
      important.
    rel: alternative
    sources:
      - https://lastz.github.io/lastz/
      - https://github.com/lh3/minimap2
  - id: brew:mummer
    reason: >
      Choose MUMmer for a suite centered on large-genome and assembly comparison with
      tools such as nucmer, dnadiff, and mummerplot; LASTZ is a focused pairwise aligner
      with BLASTZ-compatible syntax and broader output-format controls.
    rel: alternative
    sources:
      - https://lastz.github.io/lastz/
      - https://github.com/mummer4/mummer
