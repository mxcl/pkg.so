history:
  adoption-history:
    - >
      The vendor provides no public PortX adoption figures. The succeeding Xcasca
      product is offered across macOS, Windows, Linux, iOS, iPadOS, and Android.
  package-nerd-significance:
    - >
      PortX represents the desktop SSH-client category in graphical package managers:
      saved sessions, terminal access, file transfer, tunneling, and key-based
      authentication are delivered as a desktop application rather than assembled from
      separate command-line tools.
  project-history:
    - >
      PortX was distributed as NetSarang Computer's graphical SSH client. Its official
      portx.online homepage now redirects to a PortX-to-Xcasca transition route, and the
      vendor presents Xcasca as its cross-platform terminal and file-transfer client.
