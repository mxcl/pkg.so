  summary:
    - >
      PortX is a graphical SSH client whose official web presence has transitioned to
      NetSarang's Xcasca terminal and file-transfer product.
  timeline:
    - >
      Current: The official PortX homepage redirects to the vendor's PortX-to-Xcasca
      transition route
  usage:
    - >
      Users maintain remote-server sessions, authenticate with passwords or public keys,
      open SSH terminals, transfer files over SFTP, and configure capabilities such as
      port forwarding. The successor also supports session import and export and
      optional encrypted synchronization.
