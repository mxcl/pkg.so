history:
  adoption-history:
    - >
      SwiftPM Catalog was built as a native macOS front end to the Swift Package Index,
      turning the index's package data into a browsable catalog. Its supplementary
      metadata repository accepts contributions for categorization, icons, snapshots,
      and promoted package sections.
  package-nerd-significance:
    - >
      The app addresses a distinction familiar to package-manager users: dependency
      resolution and package discovery are separate problems. Swift Package Manager
      installs dependencies, while SwiftPM Catalog helps users find a repository URL
      suitable for Package.swift or Xcode.
  project-history:
    - >
      ZeeZide created SwiftPM Catalog as a small macOS browser for Swift Package Manager
      packages. The application obtains search data from the Swift Package Index and
      augments it with community-maintained catalog metadata from an official ZeeZide
      repository.
  related-projects:
    - Swift Package Manager
    - Swift Package Index
    - ZeeZide/SwiftPMCatalog metadata repository
  sources:
    - https://github.com/ZeeZide/SwiftPMCatalog
    - https://zeezide.com/en/products/swiftpmcatalog/
  summary:
    - >
      SwiftPM Catalog is a ZeeZide macOS application for browsing and searching packages
      indexed by the Swift Package Index.
  timeline:
    - >
      Initial design: SwiftPM Catalog was released as a native front end to Swift
      package-index data.
    - >
      Catalog expansion: ZeeZide opened the supplementary categorization and
      presentation metadata to pull requests.
  usage:
    - >
      Users search or browse Swift packages, copy or share a selected package's Git
      repository URL, drag that URL into an editor, or use a macOS service to resolve a
      package name such as Alamofire to its package URL.
