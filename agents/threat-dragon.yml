history:
  adoption-history:
    - >
      Threat Dragon became an OWASP project and migrated from founder Mike Goodwin’s
      repository into the OWASP GitHub organization during June and July 2020; version
      1.3 completed that transition in September 2020.
    - >
      The project supplies desktop installers for macOS, Windows, and Linux as well as a
      configurable self-hosted web application and container images. Its web variant can
      integrate with several source-control and storage providers.
  package-nerd-significance:
    - >
      Threat Dragon packages threat modeling into a cross-platform graphical tool that
      can keep models as portable JSON files. It is particularly useful in developer and
      security workflows because those model files can live alongside source code, while
      self-hosters can run the web variant in containers.
    - >
      The transition from the AngularJS-based 1.x line to a Vue-based 2.x implementation
      is a notable example of an established OWASP desktop/web tool replacing an
      end-of-life frontend stack.
  project-history:
    - >
      Mike Goodwin created Threat Dragon, with the original repository receiving its
      first commit on 9 October 2015. The project was designed to make
      data-flow-diagram-based threat modeling accessible and to record threats,
      mitigations, and countermeasures.
    - >
      After moving into the OWASP organization in 2020, the project continued as a free
      Apache-2.0 application. The 1.x line entered maintenance mode after AngularJS
      reached end of life, while the 2.x line was rewritten using Vue.js.
  related-projects:
    - OWASP Threat Modeling Project
    - OWASP pytm
    - OWASP Threat Model Library
  sources:
    - >
      OWASP Developer Guide:
      https://devguide.owasp.org/en/04-design/01-threat-modeling/03-threat-dragon/
    - 'Official OWASP project page: https://owasp.org/projects/threat-dragon'
    - 'Official documentation: https://www.threatdragon.com/docs/'
    - 'Official repository README: https://github.com/OWASP/threat-dragon#readme'
  summary:
    - >
      OWASP Threat Dragon is a free, open-source threat-modeling application for drawing
      data-flow diagrams and recording threats and mitigations.
  timeline:
    - '2015: Mike Goodwin made the first commit to the original Threat Dragon repository.'
    - '2020: The project migrated to the OWASP GitHub organization.'
    - 'September 2020: Version 1.3 completed the OWASP repository migration.'
    - >
      After AngularJS reached end of life: The 1.x line entered maintenance mode and the
      2.x application was rewritten with Vue.js.
  usage:
    - >
      Desktop users create and save threat models as local JSON files. The web
      application can use local storage or configured integrations such as GitHub,
      GitLab, Bitbucket, and Google Drive. Teams use its diagrams and threat records
      with frameworks including STRIDE, CIA, LINDDUN, and PLOT4ai.
