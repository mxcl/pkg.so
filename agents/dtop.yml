    - ~/.config/dtop/config.yml
    - ~/.dtop.yaml
    - ~/.dtop.yml
credentials-file-location:
  unix:
    - $DOCKER_CERT_PATH/key.pem
    - $DOCKER_CERT_PATH/cert.pem
    - $DOCKER_CERT_PATH/ca.pem
history:
  adoption-history:
    - >
      dtop is young, but it entered several distribution channels quickly: Homebrew,
      GitHub release installers, Docker images, Nix, and Cargo. The README explicitly
      recommends Homebrew for macOS or Linux because the project is in active
      development with frequent updates.
  package-nerd-significance:
    - >
      dtop matters to package nerds as part of the current wave of single-binary Rust
      TUIs: it overlaps with Docker dashboards, log viewers, and terminal observability
      tools, while still being distributed through classic package managers and
      container images.
  project-history:
    - >
      The public repository was created in 2025 by Amir Salihefendic, the same developer
      behind Dozzle. The README positions dtop as a terminal companion to Docker
      operations, with multi-host support over local sockets, SSH, TCP, and TLS, plus
      integration points for Dozzle log views.
  related-projects:
    - >
      The README explicitly connects dtop to Docker and Dozzle. Its feature set also
      overlaps with terminal monitor dashboards and container log viewers.
  sources:
    - https://github.com/amir20/dtop
    - https://dtop.dev/
    - https://github.com/amir20/dtop/blob/master/README.md
    - https://crates.io/api/v1/crates/dtop
    - https://formulae.brew.sh/api/formula/dtop.json
  summary:
    - >
      dtop is a Rust terminal dashboard for Docker container monitoring. It focuses on
      real-time CPU, memory, network, status, and log visibility across local and remote
      Docker hosts.
  timeline:
    - '2025: Public amir20/dtop repository created.'
    - '2025: Crates.io package metadata records the `dtop` crate.'
    - '2025-2026: Homebrew formula distributes tagged upstream releases.'
  usage:
    - >
      A typical user runs `dtop` against the local Docker daemon or passes one or more
      `--host` values for remote hosts. The optional YAML config lets users persist
      hosts, Dozzle URLs, filters, icon mode, and display preferences.
related-packages:
  - id: brew:ctop
    reason: >
      Choose ctop for its established single-host, top-like container view; choose dtop
      when one dashboard must combine multiple local or remote Docker hosts and
      integrate with Dozzle.
    rel: alternative
    sources:
      - https://github.com/amir20/dtop#readme
      - https://bcicen.github.io/ctop/
tags:
