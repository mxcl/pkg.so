history:
  adoption-history:
    - >
      Resilio states that millions of end users depend on its software. Sync became a
      cross-platform option for users who wanted direct device-to-device synchronization
      without placing the synchronized data in a conventional cloud-storage account.
    - >
      The product expanded from simple folder synchronization to linked-device
      identities, read-only and read-write access, owner permissions, selective
      synchronization, encrypted nodes, mobile clients, NAS packages, and headless or
      configuration-file-driven deployments.
  package-nerd-significance:
    - >
      Resilio Sync is a prominent proprietary descendant of BitTorrent Sync and packages
      peer-to-peer data movement as a desktop application. It appeals to users who want
      multi-device synchronization without making a central cloud copy the authoritative
      store.
    - >
      Its package-manager relevance extends beyond desktops: the same software family is
      used on Linux hosts and NAS devices, while sync.conf and command-line switches
      support reproducible headless deployments.
  project-history:
    - >
      Sync originated as BitTorrent Sync, created by technical leaders at BitTorrent. In
      2016 those leaders founded Resilio and continued the technology as Resilio Sync,
      retaining a peer-to-peer design derived from their BitTorrent experience.
    - >
      Resilio subsequently separated the personal Sync product from its enterprise
      data-movement offerings while continuing to maintain Sync for desktop, mobile,
      Linux, and NAS platforms.
  related-projects:
    - BitTorrent Sync is the project's predecessor.
    - >
      Resilio Connect and Resilio Active Everywhere apply related data-movement
      technology to enterprise deployments.
    - >
      The hidden .sync directory inside each synchronized folder stores share metadata,
      archive data, and ignore rules; it is distinct from the application's main storage
      directory.
  sources:
    - >
      https://help.resilio.com/hc/en-us/articles/204754939-Comprehensive-guide-to-syncing-Desktop-Desktop
    - >
      https://help.resilio.com/hc/en-us/articles/205451105-Can-Resilio-team-see-and-block-remove-any-Sync-folders
    - https://help.resilio.com/hc/en-us/articles/206178884-Running-Sync-in-configuration-mode
    - https://help.resilio.com/hc/en-us/articles/206664690-Sync-Storage-folder
    - https://www.resilio.com/about/
  summary:
    - >
      Resilio Sync is proprietary peer-to-peer file synchronization and sharing software
      descended from BitTorrent Sync. It keeps authoritative content on participating
      devices and normally transfers data directly between peers rather than storing it
      in a Resilio-hosted cloud.
  timeline:
    - >
      2016: Technical leaders from BitTorrent founded Resilio and carried forward the
      BitTorrent Sync technology.
    - >
      Sync 2.x: Linked identities, access roles, selective synchronization, and
      encrypted-node workflows became core parts of the product.
    - >
      Sync 3.x: Resilio made the former Sync Pro feature set available without a paid
      Pro upgrade.
  usage:
    - >
      Users link their own devices under a private identity or share individual folders
      through links, keys, or QR codes. Folders may be fully synchronized, selectively
      synchronized with placeholders, or left disconnected until needed.
    - >
      At least one peer containing the requested data must be online. Direct peer
      connections are preferred, with trackers assisting discovery and encrypted relay
      traffic available when direct connectivity is impossible.
    - >
      Advanced and headless deployments can launch Sync with a JSON-format sync.conf,
      specifying storage, network, proxy, Web UI, and shared-folder behavior.
