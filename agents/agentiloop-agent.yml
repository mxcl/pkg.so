history:
  adoption-history:
    - >
      The project gained early interest as a Mac-specific agent harness and added
      Homebrew Cask installation alongside downloadable releases. Its README emphasizes
      a broad provider matrix, local-model support, desktop automation, coding tools,
      MCP integration, and concurrent sub-agents.
  package-nerd-significance:
    - >
      Agent! represents the emerging class of native desktop agent harnesses: it
      combines bring-your-own-model credentials, local inference, software-development
      tools, macOS automation, MCP, and privilege-separated helpers in one package.
      Homebrew Cask makes this otherwise fast-moving GitHub application reproducibly
      discoverable and installable.
  project-history:
    - >
      The official README dates Agent!'s birth to April 1, 2026 and describes it as the
      product of earlier Mac automation experience spanning AppleScript-era tooling
      through Swift and modern accessibility APIs.
    - >
      The application was built as a native Swift/SwiftUI agent rather than an Electron
      or command-line wrapper. It developed into a multi-provider harness capable of
      editing code, building Xcode projects, running shell commands, controlling Mac
      applications, invoking MCP servers, and accepting approved iMessage commands.
  related-projects:
    - Model Context Protocol
    - AppleScript
    - SwiftUI
    - Ollama
    - LM Studio
  sources:
    - 'Official README and origin statement: https://github.com/AgentiLoop/Agent#readme'
