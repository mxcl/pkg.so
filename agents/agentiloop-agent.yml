      Official security architecture:
      https://github.com/AgentiLoop/Agent/blob/main/docs/SECURITY.md
    - >
      Official technical documentation:
      https://github.com/AgentiLoop/Agent/blob/main/docs/TECHNICAL.md
  summary:
    - >
      Agent! is an open-source, native macOS autonomous-agent harness for coding, shell
      work, application automation, and MCP tools across numerous local and cloud LLM
      providers.
  timeline:
    - "2026-04-01: The project identifies this as Agent!'s birth date."
    - >
      2026: Homebrew Cask installation and downloadable GitHub releases were documented
      in the official quick start.
  usage:
    - >
      Users choose an AI provider in Settings, supply an API key or select a
      local/on-device provider, optionally choose a project folder, and submit
      natural-language tasks.
    - >
      More powerful automation may require macOS Accessibility, Automation, Full Disk
      Access, or user-approved background-helper permissions. Cloud-provider API keys
      are stored using the macOS Keychain, but the official documentation does not
      expose a filesystem credential path.
