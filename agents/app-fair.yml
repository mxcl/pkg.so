history:
  adoption-history:
    - >
      The project supports installation through its own releases and through a Homebrew
      tap, placing it within the macOS package-manager ecosystem it also exposes through
      its graphical catalog.
  package-nerd-significance:
    - >
      App Fair is interesting to package-management users because it presents federated
      application catalogs and Homebrew casks through a native graphical browser,
      combining discovery, installation, and updating.
    - >
      The application is intentionally not sandboxed because installing other
      applications requires broader filesystem capabilities, a packaging tradeoff
      documented by its maintainers.
  project-history:
    - >
      App Fair was developed as an open-source macOS application browser and installer
      built with the App Fair project's publishing system.
    - >
      Its official README describes support for multiple app-source catalogs and
      Homebrew cask repositories, automatic self-updates, localization through Weblate,
      and signed and notarized macOS distribution.
  related-projects:
    - >
      The wider App Fair project maintains Fair and fairtool for constructing and
      operating federated app-distribution catalogs.
  sources:
    - 'Official App Fair project organization: https://github.com/appfair'
    - 'Official App Fair repository: https://github.com/App-Fair/App'
  summary:
    - >
      App Fair is a native macOS catalog for finding, installing, and updating
      applications from federated app sources and Homebrew cask repositories.
  timeline:
    - >
      Project development: App Fair was built as a native client for the broader App
      Fair catalog and publishing ecosystem.
    - >
      Later distribution: The project documented direct releases and installation
      through its Homebrew tap.
  usage:
    - >
      Users browse or search configured application catalogs, install selected
      applications, and use the same interface to refresh catalogs and obtain updates.
