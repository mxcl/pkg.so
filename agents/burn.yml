history:
  adoption-history:
    - >
      The SourceForge project was registered on June 12, 2006 and has served as Burn's
      official download, source, issue, and support hub. Burn is also distributed to
      macOS package-manager users through the Homebrew Cask recorded in
      source_facts.package-manager.
  package-nerd-significance:
    - >
      Burn is characteristic of an earlier generation of macOS utilities that wrapped
      established Unix multimedia and disc-authoring programs in a native Cocoa
      interface. It remains useful where optical-media workflows must be handled without
      a commercial authoring suite.
  project-history:
    - >
      Burn emerged as a free, open-source Mac OS X application for optical-disc
      authoring. Its SourceForge project was registered in 2006, and its source is
      maintained in the project's official Git repository.
    - >
      Rather than reimplementing every codec and authoring function, Burn assembles
      established open-source utilities such as FFmpeg, LAME, VCDImager, dvdauthor,
      spumux, and mkisofs behind a Mac interface.
  related-projects:
    - >
      The official site credits FFmpeg, LAME, VCDImager, dvdauthor, spumux, and mkisofs
      as underlying utilities.
  sources:
    - https://burn-osx.sourceforge.io/Pages/English/development.html
    - https://burn-osx.sourceforge.io/Pages/English/home.html
    - https://sourceforge.net/projects/burn-osx/
    - source_facts.package-manager
  summary:
    - >
      Burn is a free, open-source optical-disc authoring application for macOS. It
      creates data, audio, MP3, DVD-Audio, Video CD, DVD-Video, and DivX discs and can
      copy existing discs or recreate them from images.
  timeline:
    - '2006: The Burn project is registered on SourceForge.'
    - >
      Later development: The project adopts an official Git repository alongside its
      SourceForge downloads and support infrastructure.
  usage:
    - >
      Users add files or media to the appropriate data, audio, video, or copy workspace.
      Burn performs required conversions and exposes advanced controls such as
      filesystems, permissions, CD-Text, tags, disc icons, and DVD menus.
    - >
      The application is intended for local optical-media creation and copying; it does
      not require an account or credential store.
