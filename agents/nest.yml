history:
  adoption-history:
    - >
      NEST is used mainly in computational neuroscience, especially for large networks
      of point neurons, plasticity models, cortical-network examples, and reproducible
      simulator benchmarks. The project site describes a large developer community and
      support for systems ranging from laptops to clusters and supercomputers.
    - >
      Homebrew analytics show a specialist but active macOS/Linux package audience: the
      formula listed 806 installs in the 365-day window visible on the formula page, all
      on request.
  package-nerd-significance:
    - >
      NEST is significant less as a general CLI and more as a packaged scientific
      runtime: it pulls together a C++ simulator, Python bindings, numerical
      dependencies, and examples into something reproducible enough for papers,
      workshops, and neuroscience teaching.
  project-history:
    - >
      The NEST project traces its public history to a 1994 release under the name SYNOD
      and later became the NEural Simulation Tool. The project is coordinated by the
      NEST Initiative and distributed under GPL-2.0-or-later.
    - >
      A major adoption shift was PyNEST: the 2008 PyNEST paper describes NEST as a C++
      simulation kernel designed for large systems and explains why the project moved
      from its native SLI simulation language toward Python as the user-facing workflow.
  related-projects:
    - PyNEST
    - NEST Desktop
    - NESTML
    - NESTGPU
    - PyNN
    - Elephant
  sources:
    - https://formulae.brew.sh/formula/nest
    - https://nest-simulator.readthedocs.io/en/stable/
    - >
      https://nest-simulator.readthedocs.io/en/v3.9/tutorials/pynest_tutorial/part_1_neurons_and_simple_neural_networks.html
    - >
      https://www.frontiersin.org/journals/neuroinformatics/articles/10.3389/neuro.11.012.2008/full
    - https://www.nest-simulator.org/
  summary:
    - >
      NEST is a long-running open source simulator for spiking neural-network models.
      Its niche is computational neuroscience models where the dynamics, scale, and
      connectivity of neuron populations matter more than detailed single-neuron
      morphology.
  timeline:
    - '1994: first released under the name SYNOD, according to the NEST project site.'
    - >
      2007: Gewaltig and Diesmann published the Scholarpedia NEST citation used for
      older NEST versions.
    - >
      2008: PyNEST paper published, documenting the Python interface and the motivation
      for moving beyond SLI.
    - >
      June 2026: NEST 3.10 listed as the current release on the NEST homepage and
      Homebrew formula.
  usage:
    - >
      Package users normally install it to get the `nest` command and PyNEST bindings.
      In practice, researchers write Python scripts or notebooks that import `nest`,
      create neuron/device nodes, connect populations, run `nest.Simulate(...)`, and
      analyze spike or voltage traces with Python scientific tooling.
    - >
      The package-nerd angle is that the Python bindings are tied to the Homebrew Python
      used by the formula; the formula notes that PyNEST is installed with the
      `python@3.14` dependency and points users at that interpreter path.
