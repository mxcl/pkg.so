history:
  adoption-history:
    - >
      Gemmi's adoption is anchored in crystallography infrastructure. The README names
      CCP4 and Global Phasing as institutional homes, while the JOSS paper and project
      documentation frame it as reusable infrastructure for programs that need fast,
      standards-aware handling of CIF-family files, structural models, maps, and
      reflection data.
    - >
      Package availability in Homebrew, Debian, Ubuntu, MacPorts, and Nix makes Gemmi
      accessible outside specialist crystallography distributions, which matters for
      reproducible pipelines and notebooks that mix command-line conversion with Python
      analysis.
  package-nerd-significance:
    - >
      Gemmi is package-nerd interesting because it turns hard scientific file-format
      support into one installable toolkit. It is small compared with full
      crystallography suites but intersects with many of them, so it often appears in
      environments where users need command-line conversion, Python bindings, and
      citation-grade provenance.
  project-history:
    - >
      Gemmi's repository begins in 2017 and its documentation identifies it as a joint
      project of Global Phasing Ltd and CCP4. The project name is both a reference to
      Gemmi Pass and an expansion of General MacroMolecular I/O, reflecting its emphasis
      on file formats and data structures used by crystallographers.
    - >
      The project matured from a parser and utility collection into a broad
      structural-biology library. Its README and documentation describe C++14 code,
      Python bindings, a developing Fortran interface, partial WebAssembly bindings, web
      tools, and the `gemmi` command with many subcommands for validation, conversion,
      map handling, reflection data, and model analysis.
    - >
      In 2022, Gemmi was published in the Journal of Open Source Software as 'GEMMI: A
      library for structural biology,' giving the project a citable software reference
      for scientific users.
  related-projects:
    - >
      Gemmi is related to CCP4, Global Phasing software, wwPDB/mmCIF tooling, MTZ and
      CCP4/MRC map workflows, GemmiMOL, and scientific Python pipelines for structural
      biology.
  sources:
    - https://formulae.brew.sh/formula/gemmi
    - https://gemmi.readthedocs.io/
    - https://gemmi.readthedocs.io/en/latest/program.html
    - https://github.com/project-gemmi/gemmi
    - https://joss.theoj.org/papers/10.21105/joss.04200
  summary:
    - >
      Gemmi is a C++ library and command-line toolkit for structural biology, especially
      macromolecular crystallography. It handles mmCIF, PDB, MTZ, CCP4/MRC maps,
      crystallographic symmetry, reflection data, and related file formats, with Python
      bindings and additional interfaces around the same core library.
  timeline:
    - '2017: Initial public repository commits.'
    - '2018: Early 0.1.x releases appear.'
    - '2022-05-04: Gemmi is published in the Journal of Open Source Software.'
    - >
      2020s: Documentation expands around the `gemmi` command, Python API, C++ API,
      WebAssembly tools, and structural-biology workflows.
  usage:
    - >
      Practitioners use Gemmi as a library when writing structural-biology software and
      as a CLI when inspecting, validating, converting, or extracting data from
      coordinate, CIF, MTZ, and CCP4/MRC files. The `gemmi` program includes subcommands
      such as `validate`, `grep`, `convert`, `cif2mtz`, `mtz2cif`, `map`, `sfcalc`, and
      `xds2mtz`.
    - >
      Python users use the bindings for scripting and data analysis, while package
      maintainers care about the shared C++ core because it supports both standalone
      utilities and embedded scientific workflows.
