id: brew:arf
display-name: arf console
repo: null
docs:
  - https://github.com/eitsupi/arf/blob/main/docs/configuration.md
  - https://github.com/eitsupi/arf/blob/main/docs/ipc.md
  - https://github.com/eitsupi/arf#readme
config-file-location:
  linux:
    - ~/.config/arf/arf.toml
  macos:
    - ~/Library/Application Support/arf/arf.toml
  windows:
    - '%APPDATA%\arf\arf.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is early but already package-manager oriented. The README documents
      GitHub release binaries, a shell installer, winget, Scoop, cargo-binstall,
      Homebrew, AUR, and source installation. The Homebrew formula builds the
      `arf-console` crate, installs shell completions, and tests config initialization
      plus history and IPC commands.
  package-nerd-significance:
    - >
      arf is notable because R console frontends are often Python- or IDE-adjacent,
      while arf packages a modern terminal REPL as a single Rust binary with no runtime
      dependencies. Its explicit Homebrew, winget, Scoop, AUR, and release-binary paths
      make it a good example of a young language-tooling project designed for
      cross-platform package distribution from the start.
  project-history:
    - >
      The GitHub repository was created in January 2026, and v0.1.0 was released later
      that month. The README warns that arf is under active development and that the
      configuration and history file formats may still change, which is consistent with
      its fast early release cadence through the 0.3 and 0.4 series in spring 2026.
  related-projects:
    - >
      The README documents integration with rig for R version switching and Air for
      reprex auto-formatting, placing arf in the modern R tooling ecosystem rather than
      as a standalone R implementation.
  sources:
    - https://api.github.com/repos/eitsupi/arf
    - https://api.github.com/repos/eitsupi/arf/releases
    - https://github.com/eitsupi/arf#readme
    - https://github.com/eitsupi/arf/blob/main/docs/configuration.md
    - https://raw.githubusercontent.com/Homebrew/homebrew-core/HEAD/Formula/a/arf.rb
  summary:
    - >
      arf console, short for Alternative R Frontend, is a new Rust-written
      cross-platform console for R. It focuses on interactive terminal ergonomics:
      syntax highlighting, fuzzy history search, meta commands, shell mode, configurable
      prompts, persistent SQLite-backed history, and an IPC mode for automation.
  timeline:
    - '2026: GitHub repository created.'
    - '2026: v0.1.0 published as the first GitHub release.'
    - >
      2026: v0.4.x releases add to the early active-development line and reach Homebrew
      packaging.
  usage:
    - >
      Users run `arf` as an alternative R console, optionally selecting an R version
      through rig or enabling reprex mode. Configuration lives in a platform-specific
      TOML file, generated with `arf config init`, and runtime usage includes R meta
      commands such as `:help`, `:shell`, `:history`, `:restart`, and `:quit`.
related-packages:
  - id: brew:r-rig
    reason: >
      arf officially integrates with rig to select or switch R installations, making rig
      the natural companion for managing the R versions that arf launches.
    rel: adjacent_workflow
    sources:
      - https://github.com/eitsupi/arf#readme
      - https://github.com/r-lib/rig#readme
  - id: brew:air
    reason: >
      arf can invoke Air to format reprex output, while Air also provides standalone and
      editor-based R formatting.
    rel: adjacent_workflow
    sources:
      - https://github.com/eitsupi/arf#readme
      - https://posit-dev.github.io/air/
