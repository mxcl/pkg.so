id: cask:notebooks
display-name: Notebooks
repo: null
docs:
  - https://www.notebooksapp.com/mac/help
config-file-location:
  macos:
    - <user-selected Notebooks Home folder>/**/*.plist
    - ~/Library/Mobile Documents/iCloud~com~aschmid~notebooks/Documents/**/*.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      The developer reported that the initial iPhone release quickly found an audience
      beyond his own note-taking needs. During the later Mac beta, thousands of users
      downloaded monthly builds before the desktop 1.0 release.
    - >
      Notebooks has remained oriented toward users who value ordinary files,
      user-selected storage, and access from multiple platforms or synchronization
      services.
  package-nerd-significance:
    - >
      Notebooks is notable among personal knowledge-management applications because its
      documents remain in standard formats inside a user-controlled folder. This design
      permits access through Finder, editors, backup software, and other file-oriented
      tools.
  project-history:
    - >
      Alfons Schmid began Notebooks as a personal note-taking project and released
      Notebooks 1.0 for iPhone in December 2008.
    - >
      After more than two years of development and 15 public betas, Notebooks for Mac
      1.0 reached the Mac App Store in April 2014. Later releases expanded Markdown,
      rich-text, wiki, task-management, and cross-platform workflows.
  related-projects:
    - Markdown
    - Dropbox
    - WebDAV
    - iCloud Drive
  sources:
    - >
      Official Mac 1.0 announcement:
      https://www.notebooksapp.com/notebooks-mac-1-0-available-app-store/
    - 'Official Mac documentation: https://www.notebooksapp.com/mac/help/'
    - 'Official storage-location documentation: https://www.notebooksapp.com/storage-locations/'
    - >
      Official tenth-anniversary history:
      https://www.notebooksapp.com/celebrating-notebooks-10th-anniversary/
  summary:
    - >
      Notebooks is a commercial writing, note-taking, personal wiki, task-management,
      and document-organization application created by Alfons Schmid.
  timeline:
    - '2008: Notebooks 1.0 was released for iPhone.'
    - '2012: Public development of the Mac and Windows editions was underway.'
    - '2014: Notebooks for Mac 1.0 was released.'
    - '2019: Notebooks for Mac 2.0 was released.'
  usage:
    - >
      Users choose a Notebooks Home folder and organize plain-text, Markdown, formatted,
      PDF, and other documents into nested books. Books can also act as task lists or
      parts of a personal wiki or Zettelkasten.
    - >
      Notebooks stores document metadata in .plist files alongside the documents. The
      Home folder can be local, on iCloud Drive or Dropbox, or on another mounted
      location.
