history:
  adoption-history:
    - >
      Open Sound Meter is available for macOS, Windows, and Linux, giving audio
      practitioners a cross-platform open-source measurement option. The project also
      offers separately licensed mobile editions for iPhone and iPad.
    - >
      Its remote API allows measurements to be shared between Open Sound Meter instances
      and consumed by third-party applications, supporting configurations such as a
      mobile device acting as a wireless remote for a desktop measurement system.
  package-nerd-significance:
    - >
      Open Sound Meter brings specialized FFT-based acoustic-analysis software into
      ordinary desktop package workflows. That is valuable on macOS, where measurement
      applications often depend on proprietary distribution and licensing systems.
    - >
      The codebase is a GPL-licensed Qt and C++ application spanning audio I/O,
      real-time signal processing, graphical analysis, calibration data, and
      platform-specific packaging.
  project-history:
    - >
      Pavel Smokotnin developed Open Sound Meter as cross-platform measurement software
      for tuning sound systems. Its public codebase uses Qt and C++ and targets macOS,
      Windows, and Linux.
    - >
      Successive releases broadened it beyond basic FFT measurements with
      calibration-file import, real-time analyzer and spectrum views, impulse and
      frequency response tools, weighting filters, SPL monitoring, impedance
      measurements, signal generation, target traces, and a remote API.
  related-projects:
    - SubAlign is a related open-source alignment calculator maintained by the same developer.
    - Third-party tools can consume measurement data through Open Sound Meter's remote API.
  sources:
    - https://github.com/psmokotnin/osm
    - https://github.com/psmokotnin/osm/releases
    - https://opensoundmeter.com/static/manuals/v1.5.pdf
    - https://opensoundmeter.com/support
  summary:
    - >
      Open Sound Meter is an open-source, FFT-based acoustic measurement application for
      analyzing and tuning sound systems in real time on macOS, Windows, and Linux.
  timeline:
    - >
      Version 1.4: Added groups, generator remote control, expanded spectrum analysis,
      target-trace presets, and additional calibration support.
    - 'Version 1.4.1: Added calibration-file import and maintenance fixes.'
    - 'Version 1.5: Documented an expanded measurement workflow and startup update checking.'
  usage:
    - >
      Audio engineers and enthusiasts use Open Sound Meter with an audio interface and
      measurement microphone to inspect spectra, transfer functions, impulse responses,
      phase, sound-pressure levels, and related system behavior.
    - >
      Calibration files and reference levels improve measurement accuracy, while
      generators, target traces, weighting filters, stored measurements, and remote data
      sharing support loudspeaker alignment and room or system tuning.
