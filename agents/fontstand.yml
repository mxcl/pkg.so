history:
  adoption-history:
    - >
      Fontstand extended its original macOS offering to Windows in late 2017 and later
      added iPad and iOS workflows. Fontstand 3.0 was rebuilt as a universal macOS
      application for Intel and Apple silicon and introduced subscriptions to individual
      type foundries alongside the existing rental model.
  package-nerd-significance:
    - >
      Fontstand is notable as a distribution client for commercial fonts rather than a
      conventional font-file package. It treats activation rights, rental periods, and
      foundry subscriptions as managed entitlements, making installation inseparable
      from licensing and account state.
  project-history:
    - >
      Fontstand launched in 2015 with a rent-to-own approach to font licensing: users
      could test fonts, rent them by the month, and eventually receive a permanent
      license after paying the equivalent of the full price. The service positioned its
      desktop application as the front end to a catalog and font-delivery network
      operated with participating type foundries.
  related-projects:
    - >
      Fontstand works alongside the operating system's font activation facilities and
      desktop design applications. Fonts remain products of their respective independent
      type foundries.
  sources:
    - >
      Official Fontstand 3 press release:
      https://static.fontstand.com/assets/Uploads/Press/Fontstand-3-press-release.pdf
    - 'Official help center: https://fontstand.com/help'
    - 'Official homepage: https://fontstand.com/'
  summary:
    - >
      Fontstand is a commercial font-discovery, testing, rental, and streaming platform
      with desktop and mobile applications.
  timeline:
    - '2015: Fontstand launches with font testing and rent-to-own licensing.'
    - '2017: A Windows desktop version becomes available.'
    - '2023: Fontstand 3 launches with native Apple-silicon support and foundry subscriptions.'
  usage:
    - >
      Designers use the app to browse and test fonts in ordinary desktop applications,
      rent selected families, activate or deactivate them as needed, and subscribe to
      participating foundry catalogs. Activated rentals can be used offline until their
      rental period expires.
