history:
  adoption-history:
    - >
      The official README lists packages or ports for Fedora, Arch Linux AUR, Gentoo,
      Nix/NixOS, FreeBSD ports, OpenBSD ports, Homebrew on macOS, and Cygwin. That list
      explains why a joke command still has cross-platform package metadata: it is cheap
      to build and memorable to install.
  package-nerd-significance:
    - >
      gti belongs to the lineage of terminal whimsy packages such as sl, but its
      package-manager hook is practical: unlike sl, it forwards to git after the joke.
      It is a good example of how tiny C utilities with manpages, completions, and
      portable Makefiles can become distro trivia.
  project-history:
    - >
      Richard Wossal's project page describes gti as a program that displays a badly
      made ASCII-art animation as punishment for the typing error and then launches the
      command the user meant to run. The official README calls it a silly git launcher
      inspired by sl.
    - >
      The repository's initial commit dates to 2012-08-15. The code is small C with a
      Makefile, a manual page, and shell completions, which matches the old-school Unix
      joke-tool pattern.
  related-projects:
    - git is the command gti wraps after the animation.
    - sl is the inspiration named by both the author page and README.
  sources:
    - https://api.github.com/repos/rwos/gti/commits/789bea8c6e330c75390ec4d38f8718b957d0084f
    - https://api.github.com/repos/rwos/gti/commits?per_page=1&page=98
    - https://github.com/rwos/gti
    - https://r-wos.org/hacks/gti
    - https://raw.githubusercontent.com/rwos/gti/master/README.md
  summary:
    - >
      gti is a deliberately silly git typo launcher: when a user types gti instead of
      git, it plays an ASCII-art animation and then runs the intended git command. It is
      tiny, but it survives in package managers because it turns a common developer typo
      into a harmless joke.
  timeline:
    - '2012: Initial commit added gti.'
    - '2012: The author page described the typo-correcting ASCII-art behavior.'
    - '2023: v1.9.1 tag was cut with a Homebrew build fix noted in the commit message.'
  usage:
    - >
      The intended invocation is accidental: type gti when trying to type git. After the
      animation, gti dispatches to git. The README documents GTI_SPEED as an environment
      variable for changing the animation speed.
related-packages:
  - id: brew:sl
    reason: >
      Choose sl for the classic steam-locomotive typo joke; choose gti when you want the
      joke to continue by executing the intended git command afterward.
    rel: alternative
    sources:
      - https://r-wos.org/hacks/gti
      - https://github.com/mtoyoda/sl
  - id: brew:git
    reason: >
      Install Git because gti forwards the user's arguments to the real git command
      after playing its animation.
    rel: adjacent_workflow
    sources:
      - https://r-wos.org/hacks/gti
      - https://git-scm.com/docs/git
