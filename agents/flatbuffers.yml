history:
  adoption-history:
    - >
      FlatBuffers broadened from C++ into a multi-language serialization ecosystem. The
      official README lists code generation and runtime support for languages including
      C, C++, C#, Dart, Go, Java, JavaScript, Kotlin, Lua, PHP, Python, Rust, Swift,
      TypeScript, and others, with package surfaces on registries such as NuGet,
      pub.dev, go.dev, Maven, npm, PyPI, crates.io, and Swift Package Index.
  package-nerd-significance:
    - >
      FlatBuffers is significant because one source package feeds many language package
      ecosystems. It combines a native compiler, schema files, generated code, and
      runtime libraries, and its README explicitly notes that the project uses
      date-style versioning rather than traditional SemVer.
  project-history:
    - >
      The public repository began in January 2014, followed by a v1.0.0 tag in June
      2014. The project centers on the flatc compiler, schemas, generated language code,
      and runtime libraries rather than a single runtime format implementation.
  related-projects:
    - >
      The official README points to language-specific FlatBuffers packages and
      ecosystems, while flatc is the compiler used to generate language bindings from
      schemas.
  sources:
    - https://flatbuffers.dev/
    - https://formulae.brew.sh/formula/flatbuffers
    - https://github.com/google/flatbuffers
    - https://raw.githubusercontent.com/google/flatbuffers/master/README.md
  summary:
    - >
      FlatBuffers is Google's cross-platform serialization library designed for maximum
      memory efficiency. Its core promise is direct access to serialized data without a
      separate parsing or unpacking step while preserving forwards and backwards
      compatibility.
  timeline:
    - '2014: Initial public repository and FlatBuffers code commit.'
    - '2014: v1.0.0 release tag.'
    - '2021: v2.0.0 release tag.'
    - '2025: v25.2.10 release tag using the date-style versioning scheme.'
  usage:
    - >
      The documented workflow is to write a .fbs schema, build or install flatc,
      generate language-specific code, serialize data with generated builders, and read
      buffers through generated accessors. The package manager executable flatc is
      therefore central to most FlatBuffers workflows.
related-packages:
  - id: brew:flatcc
    reason: >
      Choose flatcc when the producer and consumer must remain pure C while retaining
      the FlatBuffers format; it supplies a C-written schema compiler and C runtime.
    rel: alternative
    sources:
      - https://flatbuffers.dev/
      - https://github.com/dvidelabs/flatcc
  - id: brew:protobuf
    reason: >
      Choose Protocol Buffers when broad language support, conventional
      parse-and-serialize APIs, and integration with gRPC are more important than
      FlatBuffers' direct buffer access.
    rel: alternative
    sources:
      - https://flatbuffers.dev/
      - https://protobuf.dev/overview/
  - id: brew:capnp
    reason: >
      Choose Cap'n Proto when you want a serialization system with direct in-memory
      access plus a built-in capability-based RPC model.
    rel: alternative
    sources:
      - https://flatbuffers.dev/
      - https://capnproto.org/
