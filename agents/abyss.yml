history:
  adoption-history:
    - >
      ABySS became part of bioinformatics packaging culture because it exposed a
      substantial Unix-style command suite around a reproducible assembly pipeline and
      was packaged by Homebrew, Debian, Ubuntu, MacPorts, and Bioconda.
    - >
      The project page notes a 2015 International Bioinformatics Resource Award from the
      Swiss Institute of Bioinformatics, reflecting broader scientific use beyond the
      original BC Cancer group.
  package-nerd-significance:
    - >
      ABySS matters to package maintainers because it combines compiled C++ code,
      MPI/OpenMP, optional scientific dependencies, many installed executables, and
      large-memory workloads in one formula.
    - >
      It is a good example of a scientific CLI whose packaging value is not just the
      top-level binary but a coordinated toolchain used inside reproducible
      bioinformatics pipelines.
  project-history:
    - >
      The official changelog records ABySS 1.0 on 2008-08-07. Its 2009 Genome Research
      paper described ABySS as a parallel assembler for short-read sequence data, and
      the project page identifies it as a parallel, paired-end assembler using MPI for
      larger genomes.
    - >
      ABySS 2.0, released in 2016 and described in a 2017 Genome Research paper, added a
      Bloom filter assembly mode to reduce memory use for large genomes. Later releases
      continued to tune Bloom filter assembly, linked-read scaffolding, RResolver
      integration, and compiler/platform support.
  related-projects:
    - >
      Related projects in the official README include Trans-ABySS, ARCS, Tigmint,
      Konnector, Sealer, btllib, Open MPI, Boost, and samtools.
  sources:
    - https://github.com/bcgsc/abyss#readme
    - https://raw.githubusercontent.com/bcgsc/abyss/master/ChangeLog
    - https://www.bcgsc.ca/resources/software/abyss
    - source_facts.package-manager
  summary:
    - >
      ABySS is a de novo genome sequence assembler for short paired-end reads, developed
      at the BC Cancer Genome Sciences Centre and distributed as command-line tools such
      as abyss-pe and ABYSS-P.
  timeline:
    - '2008: ABySS 1.0 released.'
    - >
      2009: Genome Research paper presents ABySS as a parallel assembler for short-read
      sequence data.
    - >
      2015: ABySS wins the Swiss Institute of Bioinformatics International
      Bioinformatics Resource Award.
    - '2016: ABySS 2.0 introduces Bloom filter assembly mode.'
    - >
      2017: ABySS 2.0 paper describes resource-efficient large-genome assembly using a
      Bloom filter.
    - '2021: ABySS 2.3.0 makes RResolver part of the default pipeline.'
  usage:
    - >
      Typical use is batch-oriented: users install ABySS through Conda, Homebrew, or
      from source, then run abyss-pe with parameters such as k and Bloom filter memory
      settings for paired-end short-read assembly.
    - >
      The README documents cluster-oriented MPI mode, Bloom filter mode, scaffolding,
      linked-read workflows, and related tools such as ARCS, Tigmint, Konnector, Sealer,
      and abyss-bloom.
related-packages:
  - id: brew:samtools
    reason: >
      Install samtools when an ABySS workflow must read BAM inputs, which upstream
      documents as an optional integration.
    rel: adjacent_workflow
    sources:
      - https://github.com/BirolLab/abyss#readme
      - https://www.htslib.org/doc/samtools.html
  - id: brew:open-mpi
    reason: >
      Use Open MPI when running ABySS's legacy MPI assembly mode across processes or
      machines; the official build and cluster instructions document this integration.
    rel: adjacent_workflow
    sources:
      - https://github.com/BirolLab/abyss#readme
      - https://docs.open-mpi.org/
