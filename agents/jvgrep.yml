history:
  adoption-history:
    - >
      jvgrep's adoption appears narrow and language-community-specific. The input
      package metadata lists Homebrew packaging, and the README documents `brew install
      jvgrep` for macOS along with Go installation commands.
    - >
      Its value is strongest for Vim users and Japanese text workflows where ordinary
      grep behavior can be uncomfortable around legacy encodings and multibyte regular
      expressions.
  package-nerd-significance:
    - >
      jvgrep is package-nerd interesting because it preserves a local need that generic
      Unix tools often flatten: Japanese encodings, Vim integration, and grep ergonomics
      in one small Go command.
    - >
      It also reflects a common Homebrew pattern: small, durable utilities with a very
      specific audience can still be worth packaging because they solve one awkward
      workflow cleanly.
  project-history:
    - >
      The jvgrep repository was created on 2011-08-19. Its README describes a focused
      problem: searching text in files written with Japanese encodings such as
      ISO-2022-JP, EUC-JP, Shift_JIS/CP932, UTF-8, and UTF-16.
    - >
      The project has long stayed small and utilitarian. Its public releases show
      continued maintenance across Go toolchain eras, including v5-series releases and a
      v5.8.16 release on 2026-04-13.
  related-projects:
    - Vim is the editor integration target documented by jvgrep.
    - grep is the Unix search interface that jvgrep specializes for Japanese text.
    - Go is the implementation and installation toolchain documented by the project.
  sources:
    - https://api.github.com/repos/mattn/jvgrep
    - https://api.github.com/repos/mattn/jvgrep/releases
    - https://github.com/mattn/jvgrep
    - https://github.com/mattn/jvgrep/releases
    - https://raw.githubusercontent.com/mattn/jvgrep/master/README.md
  summary:
    - >
      jvgrep is a grep-like command-line search tool by Yasuhiro Matsumoto for Japanese
      Vim users. It searches files written in Japanese encodings and can be set as Vim's
      `grepprg`.
  timeline:
    - '2011-08-19: The jvgrep GitHub repository is created.'
    - '2018-04-24: jvgrep v5.6.0 is published on GitHub.'
    - '2020-06-14: jvgrep v5.8.8 is published on GitHub.'
    - '2026-04-13: jvgrep v5.8.16 is published on GitHub.'
  usage:
    - >
      jvgrep is used like grep with options for recursive search, fixed-string or
      regular-expression matching, color, line numbers, match counts, and encoding
      selection. Users can set `JVGREP_ENCODINGS` and `JVGREP_OUTPUT_ENCODING` to tune
      input and output encoding behavior.
    - >
      In Vim, adding `set grepprg=jvgrep` makes Vim's grep integration call jvgrep
      instead of the platform grep.
related-packages:
  - id: brew:vim
    reason: >
      Use jvgrep as Vim's `grepprg` to search Japanese-encoded files and load matching
      locations into Vim's quickfix workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/mattn/jvgrep#readme
      - https://github.com/vim/vim/blob/master/runtime/doc/quickfix.txt
