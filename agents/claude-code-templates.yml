id: brew:claude-code-templates
display-name: Claude Code Templates
repo: https://github.com/davila7/claude-code-templates
docs:
  - https://docs.aitmpl.com/
  - https://docs.aitmpl.com/installation
  - https://github.com/davila7/claude-code-templates#readme
config-file-location:
  unix:
    - .claude/config.json
    - .claude/settings.json
    - .claude/settings.local.json
    - ~/.claude/settings.json
    - .mcp.json
credentials-file-location:
  unix:
    - .env
  windows:
    - .env
history:
  adoption-history:
    - >
      The package is distributed as `claude-code-templates` on npm and as a Homebrew
      formula that packages the npm tarball. Its official README also points users to
      docs.aitmpl.com and aitmpl.com for browsing and installation.
    - >
      The README documents third-party and official upstream sources used in the
      collection, including Anthropic's official skills and Claude Code examples,
      scientific skills, community agent repositories, and command collections. That
      source attribution is a stronger adoption signal than download claims because it
      shows the catalog curating across multiple Claude ecosystem projects.
  package-nerd-significance:
    - >
      For package nerds, Claude Code Templates is a clear example of the package-manager
      instinct moving from binaries and libraries into AI-agent configuration. Prompts,
      hooks, agent roles, MCP endpoints, and settings become catalog entries that can be
      searched, attributed, installed, and updated.
    - >
      The project is also notable because its package wraps a living catalog. The
      Homebrew formula points to an npm tarball, while the docs and website provide a
      higher-level registry experience for components that are not traditional
      executable packages.
  project-history:
    - >
      The npm package was first published in July 2025 and grew quickly by version
      count, with the npm registry recording 155 versions by the 1.29.2 release. The
      project emerged after Claude Code made `.claude` directories, slash commands, MCP
      servers, hooks, and agent definitions valuable reusable artifacts.
    - >
      The README frames the project as a comprehensive collection rather than a single
      template. It includes install commands for individual agents, commands, MCPs,
      settings, hooks, and broader development stacks, plus additional tools for
      analytics, conversation monitoring, health checks, and plugin dashboards.
  related-projects:
    - >
      Claude Code is the runtime whose agents, commands, settings, hooks, skills, and
      MCP integrations the templates target.
    - >
      Anthropic's official skills and anthropics/claude-code examples are credited by
      the README as upstream sources.
    - >
      awesome-claude-code, awesome-claude-skills, wshobson/agents, obra/superpowers, and
      K-Dense-AI/claude-scientific-skills are named by the README as related source
      collections.
  sources:
    - https://github.com/davila7/claude-code-templates
    - https://registry.npmjs.org/claude-code-templates
    - https://formulae.brew.sh/api/formula/claude-code-templates.json
    - https://docs.aitmpl.com/
  summary:
    - >
      Claude Code Templates is a catalog and CLI for installing reusable Claude Code
      agents, commands, MCP integrations, settings, hooks, skills, and project
      templates. The official README presents it as both an npm CLI and the
      backend/catalog for the aitmpl.com browsing experience.
  timeline:
    - '2025-07: npm registry records the first `claude-code-templates` publication.'
    - '2026-06: npm registry records published version 1.29.2 after 155 published versions.'
    - >
      2026: Homebrew formula `claude-code-templates` packages version 1.29.2 from the
      npm registry.
  usage:
    - >
      Users can run `npx claude-code-templates@latest` interactively or pass flags such
      as `--agent`, `--command`, `--mcp`, `--setting`, `--hook`, and `--yes` to install
      selected components into Claude Code configuration locations.
    - >
      The project is also used as a discovery layer: the README directs users to
      aitmpl.com to browse more than 100 agents, commands, settings, hooks, and MCPs,
      then install selected components through the CLI.
related-packages:
  - id: cask:claude-code
    reason: >
      Claude Code loads and runs the agents, commands, hooks, settings, skills, and MCP
      components installed by Claude Code Templates.
    rel: adjacent_workflow
    sources:
      - https://docs.aitmpl.com/installation
      - https://github.com/anthropics/claude-code#readme
