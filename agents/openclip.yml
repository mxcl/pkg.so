credentials-file-location: null
history:
  adoption-history:
    - >
      OpenClip is distributed as a signed and notarized macOS application and through
      Homebrew. Its onboarding guides users through Accessibility permission and
      optional extension installation.
    - >
      The project encourages an extension ecosystem: users can browse an in-app catalog
      or create actions in JavaScript, AppleScript, shell, URL-template, keyboard,
      Shortcut, and macOS service forms.
  package-nerd-significance:
    - >
      OpenClip combines a native macOS text-selection utility with a file-based
      extension format. An extension can be installed by placing a directory containing
      an openclip.json manifest under ~/.openclip/extensions, making the customization
      layer easy to inspect and package.
    - >
      It is also notable as a free, open-source alternative to PopClip with documented
      extension runtimes and a Homebrew installation path.
  project-history:
    - >
      OpenClip was introduced as an open-source macOS floating action bar by Ganesh M
      and contributors. The project presents itself as an independent alternative to
      PopClip and is released under the MIT License.
    - >
      The application grew from contextual text actions into a broader keyboard-driven
      platform with a fuzzy action palette, custom extensions, an extension store,
      inline AI providers, and detailed developer documentation.
  related-projects:
    - OpenClip explicitly identifies itself as an independent PopClip alternative.
    - >
      Its official extension catalog is maintained separately in the openclip-extensions
      repository.
  sources:
    - 'Official documentation: https://www.getopenclip.app/docs/getting-started'
    - 'Official homepage: https://www.getopenclip.app/'
    - 'Official manifest specification: https://www.getopenclip.app/docs/manifest-spec'
    - 'Official repository README: https://github.com/ganeshmshetty/openclip'
  summary:
    - >
      OpenClip is a free, open-source macOS utility that presents contextual actions for
      selected text and supports a keyboard palette, custom extensions, and inline AI
      workflows.
  timeline:
    - >
      2026: Official project materials identify OpenClip as an MIT-licensed open-source
      macOS project.
  usage:
    - >
      Select text in any application to expose contextual actions such as copying,
      transforming, calculating, searching, or running an extension. The default global
      palette shortcut is Option-Command-C.
    - >
      Extensions conventionally live beneath ~/.openclip/extensions. Each extension may
      use an openclip.json manifest and optional scripts or assets; legacy manifest.json
      and Config.json names are also accepted.
    - >
      OpenClip requires macOS Accessibility permission to detect and read the current
      selection. Cloud AI providers are optional; the base text actions do not require
      credentials.
