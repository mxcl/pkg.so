config-file-location: null
credentials-file-location:
  unix:
    - ~/.miln/
history:
  adoption-history:
    - >
      Homebrew Cask packages Keysafe for macOS users who prefer package-manager
      installation of a standalone binary. Beyond that packaging signal and Miln's
      product page, evidence of broad open-source ecosystem adoption is thin.
  package-nerd-significance:
    - >
      For package-history purposes, Keysafe is interesting because it packages a narrow
      forensic and migration workflow - legacy Apple Keychain file access - as a
      cross-platform CLI binary rather than a macOS-only GUI workflow.
  project-history:
    - >
      The public Miln documentation describes Keysafe as a single executable for reading
      Keychain files, looking up encrypted password records, exporting Keychain
      contents, and extracting password-recovery material. The package is distributed
      from Miln rather than through a public source repository, so detailed development
      history is not visible from source-control metadata.
  related-projects:
    - >
      Apple Keychain Access and the macOS `security` command cover native macOS Keychain
      workflows; Bitwarden and Vaultwarden are documented export targets for Keysafe's
      Bitwarden-format JSON output.
  sources:
    - https://miln.eu/keysafe/
    - https://miln.eu/keysafe/download/
    - https://miln.eu/keysafe/format/
    - https://miln.eu/keysafe/recover/
    - https://miln.eu/keysafe/system-keychain/
    - source_facts.package-manager
    - source_facts.version
  summary:
    - >
      Miln Keysafe is a proprietary command-line utility from Miln for reading and
      decrypting legacy Apple Keychain files on Linux, macOS, and Windows. Its niche is
      portability: it lets users inspect or export Keychain data without using Apple's
      Keychain Access application on Apple hardware.
  timeline:
    - >
      2022: Sample output in Miln's documentation shows Keychain record creation and
      modification dates in April 2022.
    - '2026: Input metadata records Homebrew Cask version 1.9.2 for this batch.'
  usage:
    - >
      Keysafe is used from a terminal with a Keychain file path, can filter listed
      records, can export decrypted Keychain contents to archive formats, and requires
      the Keychain password to decrypt protected data. Miln documents System.keychain
      handling through a SystemKey file and password input through an interactive
      prompt, environment variable, or user-specified file.
    - >
      Miln documents Keysafe output suitable for importing password records into
      Bitwarden, Vaultwarden, Apple Passwords, and other software, along with exported
      certificates, private keys, public keys, and secure notes.
