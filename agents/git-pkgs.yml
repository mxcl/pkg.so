id: brew:git-pkgs
display-name: git-pkgs
repo: https://github.com/git-pkgs/git-pkgs
docs:
  - https://github.com/git-pkgs/git-pkgs#readme
config-file-location:
  unix:
    - .git/config
    - ~/.gitconfig
    - $XDG_CONFIG_HOME/git/config
credentials-file-location: null
history:
  adoption-history:
    - >
      git-pkgs fits the supply-chain tooling ecosystem around OSV, Package URLs,
      CycloneDX, SPDX, and ecosyste.ms. Its package-manager coverage in the input
      includes Homebrew, Nix, and Scoop, and the README documents GitHub Actions
      workflows for dependency diffs, vulnerability reports, and license checks in pull
      requests.
  package-nerd-significance:
    - >
      git-pkgs is notable because it treats dependency manifests as historical data
      rather than only static files. Its support for many package managers, Package
      URLs, OSV, ecosyste.ms, and SBOM formats makes it a package-nerd tool for
      answering provenance and maintenance questions across language ecosystems from
      inside ordinary Git workflows.
  project-history:
    - >
      The project began as a Ruby implementation by Andrew Nesbitt and was later
      rewritten in Go under the git-pkgs organization. Both READMEs describe the same
      core idea: lockfiles and manifests show dependency state, but a queryable
      Git-history database explains how that state came to exist.
    - >
      The Go repository began in January 2026 and kept the Git-subcommand interface
      while broadening the command set around vulnerability history, SBOM export,
      licenses, package-manager operations, changelog lookup, plugin support, structured
      help output, and CI actions.
  related-projects:
    - The original Ruby repository is github.com/andrew/git-pkgs.
    - git-pkgs/actions provides reusable GitHub Actions for CI use.
    - ecosyste.ms and OSV provide registry and vulnerability data used by enrichment commands.
  sources:
    - https://git-pkgs.dev
    - https://github.com/andrew/git-pkgs
    - https://github.com/git-pkgs/actions
    - https://github.com/git-pkgs/git-pkgs
  summary:
    - >
      git-pkgs is a Git subcommand for indexing dependency changes across repository
      history into SQLite, so teams can ask when packages were added, changed, removed,
      or linked to vulnerability and license events.
  timeline:
    - '2026: Original Ruby repository tagged v0.1.0.'
    - '2026: Go rewrite repository began under github.com/git-pkgs/git-pkgs.'
    - '2026: v0.9.0 tag published for the Go implementation.'
    - >
      2026: v0.17.0 tag published after additions around package-management and
      supply-chain workflows.
  usage:
    - >
      Practitioners run git pkgs init inside a repository to build .git/pkgs.sqlite3,
      then use subcommands such as list, history, blame, diff, stale, vulns, licenses,
      sbom, and changelog. The tool is designed to work offline for Git-history queries
      and to use external services only for enrichment such as vulnerabilities, registry
      metadata, and changelogs.
    - >
      Security and platform teams use it to explain who introduced a dependency or
      vulnerability, compare branches semantically instead of reading lockfile noise,
      generate SBOMs, and add CI checks that focus reviewers on dependency changes.
related-packages:
  - id: brew:osv-scanner
    reason: >
      Choose OSV-Scanner for dedicated vulnerability scanning of source trees,
      manifests, SBOMs, or containers; choose git-pkgs when Git-history attribution and
      exposure timelines are the priority.
    rel: alternative
    sources:
      - https://git-pkgs.dev/
      - https://google.github.io/osv-scanner/
  - id: brew:syft
    reason: >
      Choose Syft for dedicated SBOM generation from container images, registries,
      filesystems, and archives; git-pkgs is better suited to SBOMs and package analysis
      rooted in a repository's dependency history.
    rel: alternative
    sources:
      - https://git-pkgs.dev/
      - https://oss.anchore.com/docs/guides/sbom/
  - id: brew:git-pkgs-brief
    reason: >
      Run brief first to inventory a repository's languages, package managers, and tool
      configuration, then use git-pkgs when you need historical dependency queries and
      supply-chain analysis.
    rel: adjacent_workflow
    sources:
      - https://github.com/git-pkgs/brief#readme
      - https://git-pkgs.dev/
