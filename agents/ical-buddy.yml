id: brew:ical-buddy
display-name: icalBuddy
repo: null
docs:
  - https://hasseg.org/icalBuddy
config-file-location:
  macos:
    - ~/.icalBuddyConfig.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      The original site explicitly points users to examples, manual pages, configuration
      and localization manuals, and a blog post about displaying icalBuddy output on the
      desktop, showing adoption among users who wanted calendar data in scripts,
      widgets, and status displays.
    - >
      Homebrew packaging made the tool installable as `ical-buddy`, preserving access
      for command-line Mac users even though the tool is platform-specific and depends
      on macOS calendar APIs.
  package-nerd-significance:
    - >
      icalBuddy is a classic Homebrew-only productivity formula: small, Mac-specific,
      script-friendly, and tied to private Apple frameworks rather than a cross-platform
      ecosystem. Its significance is less about broad portability and more about
      exposing a GUI application's data model to Unix-style pipelines.
  project-history:
    - >
      Ali Rantakari published icalBuddy as a native OS X command-line tool and
      documented it with a homepage, examples, FAQ, and manual pages. The author's usage
      text identifies the program as version 1.8.8 and gives a 2008-2012 copyright
      range, while the page's version log records 1.8.8 on March 09, 2013.
    - >
      After the original project line, Homebrew tracks a maintained 64-bit continuation
      from the `dkaluta/icalBuddy64` repository, with tags that extend the release
      sequence beyond the original 1.8.x series. The package therefore represents both
      the original Mac automation tool and the later packaging work needed to keep it
      usable on newer macOS systems.
  related-projects:
    - >
      The project is related to Apple's iCal/Calendar database, Ali Rantakari's
      CalStoreHelper, and Mac desktop/status-display automation that consumes terminal
      output.
  sources:
    - https://formulae.brew.sh/formula/ical-buddy
    - https://github.com/dkaluta/icalBuddy64
    - https://hasseg.org/icalBuddy
  summary:
    - >
      icalBuddy is a macOS command-line utility for reading events and tasks from the
      Calendar database used by iCal/Calendar. It occupies a small but durable niche in
      Mac automation: turning personal calendar data into scriptable terminal output.
  timeline:
    - "2008-2012: Original usage text carries Ali Rantakari's copyright range."
    - >
      2010-2013: The author's changelog records frequent 1.7.x and 1.8.x releases with
      relative dates, localization, installer, and macOS compatibility fixes.
    - "2013: Version 1.8.8 appears in the author's changelog."
    - >
      2019-2021: The `icalBuddy64` continuation tags versions from 1.8.9 through 1.10.1
      for maintained Homebrew builds.
  usage:
    - >
      The command set includes date-bounded event queries, task queries, calendar
      listing, custom formatting, calendar inclusion/exclusion, property selection,
      config editing, and localization support. Typical uses are shell scripts, desktop
      overlays, status bars, and other local automations that need Calendar data without
      opening the Calendar app.
