id: brew:apachetop
display-name: ApacheTop
repo: null
docs:
  - https://github.com/tessus/apachetop#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager data lists ApacheTop in Homebrew, Debian, Ubuntu,
      Fedora/dnf, and MacPorts. That distribution footprint is the strongest
      source-backed adoption signal: it has survived as a useful sysadmin utility across
      Unix-like packaging ecosystems.
  package-nerd-significance:
    - >
      ApacheTop is the sort of package that persists because it does one operational
      task with minimal ceremony. It is interesting to package nerds as a compact C-era
      monitoring utility that still appears in mainstream OS repositories.
  project-history:
    - >
      ApacheTop predates the modern observability stack and comes from the era when
      command-line log monitors were often the fastest way to understand a busy web
      server. The maintained GitHub repository describes it as a top-like display of
      Apache log activity.
    - >
      The project is comparatively small and its official history is thin. The current
      repository and README are the reliable source of identity, usage, and maintainer
      continuity.
  related-projects:
    - Apache HTTP Server produces the access logs ApacheTop monitors.
    - >
      `top`, `tail -f`, `goaccess`, and log-analysis tools occupy nearby command-line
      monitoring territory.
  sources:
    - https://github.com/tessus/apachetop
    - https://github.com/tessus/apachetop#readme
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      ApacheTop is a small terminal monitor that gives Apache HTTP Server access logs a
      `top`-like live display. Its package value is direct and old-school: install it,
      point it at a log, and watch request, URL, referrer, and host activity update in
      real time.
  timeline:
    - '2000s: ApacheTop circulates as a terminal log-monitoring utility for Apache access logs.'
    - >
      2010s: The project remains available through Linux distributions and macOS package
      managers.
    - >
      2020s: The maintained GitHub repository continues to serve as the official source
      and documentation surface.
  usage:
    - >
      ApacheTop is used from a shell against Apache access logs, usually during live
      troubleshooting or quick traffic inspection. It appeals when a full metrics
      pipeline is unnecessary or unavailable.
    - >
      Because it works directly with logs and has no documented credentials file or
      required config file, it fits the classic single-purpose Unix tool model.
related-packages:
  - id: brew:goaccess
    reason: >
      Choose GoAccess when you need terminal analytics plus generated real-time HTML
      reports; ApacheTop is the smaller, strictly `top`-style live monitor.
    rel: alternative
    sources:
      - https://github.com/tessus/apachetop
      - https://goaccess.io/
  - id: brew:httpd
    reason: >
      Apache HTTP Server produces the Common or Combined Format access logs that
      ApacheTop monitors.
    rel: adjacent_workflow
    sources:
      - https://github.com/tessus/apachetop
      - https://httpd.apache.org/docs/current/en/logs.html
