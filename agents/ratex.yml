history:
  adoption-history:
    - >
      Ratex is distributed through Homebrew and the project's native Linux, macOS, and
      Windows packages. Its official documentation also lists Arch User Repository
      packages.
  package-nerd-significance:
    - >
      Ratex is notable as an attempt to package a self-contained TeX-compatible
      toolchain without requiring a conventional TeX Live installation. It combines
      typesetting, dependency tracking, bibliography passes, package resources, fonts,
      and compatibility command names in one Rust workspace.
  project-history:
    - >
      Ratex was developed as a pure-Rust TeX engine and typesetting toolchain. Its
      workspace separates the core engine, package resolver, BibTeX interpreter, and
      command-line driver while exposing compatibility entry points such as `pdflatex`,
      `xelatex`, `lualatex`, and `texmk`.
    - >
      The project published several 0.4-series releases in September 2026. Official
      release notes emphasize offline font and package resources, native Unicode
      handling, reproducible corpus testing, and cross-platform installers.
  related-projects:
    - >
      TeX Live and latexmk are the conventional tools against which Ratex documents
      compatibility and corpus results.
    - >
      The command suite includes latexdiff-compatible document revision workflows and an
      embedded BibTeX implementation.
  sources:
    - 'Official releases: https://github.com/leoliu0/ratex/releases'
    - 'Official repository and README: https://github.com/leoliu0/ratex'
    - source_facts.package-manager
  summary:
    - >
      Ratex is a self-contained TeX engine and typesetting toolchain written in Rust. It
      aims to compile LaTeX projects, manage multi-pass builds and bibliographies, and
      provide familiar TeX command aliases without invoking traditional TeX engines.
  timeline:
    - >
      2026-09-20: Ratex 0.4.0 introduced an expanded offline TEXMF and native
      Unicode/font support.
    - >
      2026-09-20: Ratex 0.4.3 published additional compatibility, resource, and
      concurrency fixes.
  usage:
    - >
      Users compile a document with `ratex paper.tex`, optionally select an output
      directory, or configure editors such as TeXstudio and LaTeX Workshop to call
      Ratex. The package also supplies familiar TeX-related executable names for
      existing workflows.
