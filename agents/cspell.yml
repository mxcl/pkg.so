id: brew:cspell
display-name: CSpell
repo: https://github.com/streetsidesoftware/cspell
docs:
  - https://cspell.org/docs
config-file-location:
  unix:
    - ./cspell.json
credentials-file-location: null
history:
  adoption-history:
    - >
      CSpell moved from editor-extension infrastructure into a standalone CLI used in
      local projects and CI. The official docs document npm, Yarn, pnpm, Bun, npx, and
      GitHub Action use, while the repository lists packages for the CLI, library,
      bundled dictionaries, ESLint plugin, glob handling, trie tools, and related
      support libraries.
  package-nerd-significance:
    - >
      CSpell is interesting to packagers because it is both a user-facing CLI and a
      dependency graph of dictionary and parser packages. Homebrew packaging gives
      non-Node users a simple cspell executable, while npm remains the canonical
      upstream distribution channel.
  project-history:
    - >
      The package README says cspell is a command-line tool and library for spell
      checking code, and that it was initially built as the spell-checking service for
      the Code Spell Checker extension for Visual Studio Code. The top-level README
      describes the current repository as the CSpell mono-repo.
  related-projects:
    - >
      The package README links CSpell to the Code Spell Checker extension for VS Code,
      and the repository lists cspell-dicts as the place for dictionary word changes.
  sources:
    - https://github.com/streetsidesoftware/cspell#readme
    - https://github.com/streetsidesoftware/cspell/tree/main/packages/cspell#readme
    - https://cspell.org/docs/getting-started
    - https://cspell.org/docs/Configuration
    - https://cspell.org/docs/installation
    - https://registry.npmjs.org/cspell
    - https://formulae.brew.sh/formula/cspell
  summary:
    - >
      CSpell is a spell checker for code, distributed as a Node-based CLI and library.
      Its niche is checking identifiers, comments, documentation, and source trees with
      dictionaries tuned for programming languages.
  timeline:
    - '2017: npm package cspell 1.0.0 was published.'
    - '2023: GitHub releases show v7.3.1 in the available releases page.'
    - '2026: npm and Homebrew metadata list cspell 10.0.1 as current.'
  usage:
    - >
      Official docs show typical CLI usage such as cspell . or cspell lint patterns,
      plus configuration discovery from JSON, YAML, JavaScript, TypeScript, TOML,
      package.json, and .vscode files. The package README emphasizes code-aware parsing,
      CamelCase and snake_case handling, language-specific dictionaries, and custom word
      lists.
related-packages:
  - id: brew:codespell
    reason: >
      Choose codespell for a narrower typo-substitution checker based on curated common
      misspellings; choose CSpell for code-aware tokenization, configuration imports,
      and extensible project dictionaries.
    rel: alternative
    sources:
      - https://github.com/codespell-project/codespell
      - https://cspell.org/docs/
  - id: brew:vale
    reason: >
      Use Vale alongside CSpell when documentation needs configurable terminology and
      prose-style enforcement in addition to source-oriented spelling checks.
    rel: adjacent_workflow
    sources:
      - https://docs.vale.sh/
      - https://cspell.org/docs/
tags:
