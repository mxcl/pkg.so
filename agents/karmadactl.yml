history:
  adoption-history:
    - >
      Karmada entered CNCF as a sandbox project on September 14, 2021 and moved to CNCF
      Incubating on December 12, 2023. The CNCF project page records a first commit on
      November 10, 2020, and Karmada documentation states that v1.0.0 was released in
      December 2021.
  package-nerd-significance:
    - >
      karmadactl matters because it packages a multi-cluster control-plane interface as
      a familiar single binary. For package maintainers and Kubernetes operators, it is
      another example of the kubectl-adjacent CLI pattern: one executable exposes a
      large API surface generated by Cobra docs and tied to a fast-moving controller
      project.
  project-history:
    - >
      Karmada was built to let users run Kubernetes-native applications across multiple
      clusters and clouds without changing the applications. karmadactl is the
      operator-facing CLI for that control plane, covering installation, member-cluster
      registration, resource inspection, propagation, and lifecycle commands.
  related-projects:
    - Kubernetes is the API and workload model Karmada extends across clusters.
    - kubectl is the command-style reference point for karmadactl.
    - >
      Flux and Helm appear in Karmada ecosystem workflows for multi-cluster GitOps and
      package rollout.
  sources:
    - https://github.com/karmada-io/karmada
    - https://karmada.io/
    - https://karmada.io/docs/reference/karmadactl/karmadactl-commands/karmadactl/
    - https://karmada.io/docs/releases/
    - https://www.cncf.io/projects/karmada/
  summary:
    - >
      karmadactl is the command-line interface for Karmada, the Kubernetes Armada
      multi-cluster and multi-cloud control plane.
  timeline:
    - "2020-11-10: CNCF project metadata records Karmada's first commit."
    - '2021-09-14: Karmada was accepted into CNCF.'
    - '2021-12: Karmada documentation records v1.0.0 as released in December 2021.'
    - '2023-12-12: Karmada moved to CNCF Incubating.'
    - >
      2026-05-29: karmadactl reference documentation listed commands for cluster
      federation control, including init, join, register, apply, promote, and top.
  usage:
    - >
      Operators use karmadactl init to install a Karmada control plane, join or register
      member clusters, apply resources into the control plane, inspect resources across
      member clusters, and promote resources from legacy clusters. Its command surface
      mirrors kubectl-style administration but targets a federated control plane.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      kubectl operates the Kubernetes clusters and APIs that Karmada federates, while
      karmadactl adds Karmada-specific control-plane and cluster-registration commands.
    rel: adjacent_workflow
    sources:
      - https://karmada.io/docs/installation/
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:fluxcd
    reason: >
      Karmada officially documents using Flux controllers on member clusters to
      reconcile HelmRelease and Kustomization resources propagated through Karmada.
    rel: adjacent_workflow
    sources:
      - https://karmada.io/docs/userguide/cicd/working-with-flux/
      - https://fluxcd.io/flux/
  - id: brew:helm
    reason: >
      Karmada's documented Flux workflow propagates applications packaged as Helm charts
      across member clusters and customizes them with Karmada policies.
    rel: adjacent_workflow
    sources:
      - https://karmada.io/docs/userguide/cicd/working-with-flux/
      - https://helm.sh/docs/
