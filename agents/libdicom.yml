history:
  adoption-history:
    - >
      The package's adoption story is tightly connected to DICOM WSI and OpenSlide. The
      README states that OpenSlide 4.0 and later use libdicom to implement DICOM
      support, making libdicom a small but important bridge between medical-imaging
      standards and common open-source slide tooling.
  package-nerd-significance:
    - >
      libdicom is package-nerd interesting because it is a specialized C dependency
      created for a standards-heavy domain, has no broad dependency stack of its own,
      and lets larger imaging tools support DICOM WSI without each implementing frame
      indexing and parsing independently.
  project-history:
    - >
      The upstream README describes libdicom as a free, MIT-licensed, fast,
      cross-platform, dependency-light C library and command-line toolkit for DICOM WSI
      files. It returns compressed frame data rather than RGB pixel arrays, and points
      users who want image processing toward OpenSlide 4.0 and later.
    - >
      GitHub release notes show 1.0.x, 1.1.0, and 1.2.0 release-candidate work with
      fixes for memory use, thread-safety documentation, pointer ownership, DICOM
      catenation support, faster reads for files with an Extended Offset Table, and
      command-line behavior improvements.
  related-projects:
    - >
      Imaging Data Commons is the upstream organization. OpenSlide 4.0 and later are the
      most important adjacent consumer named by upstream, while pylibdicom provides
      Python access to the C library.
  sources:
    - https://github.com/ImagingDataCommons/libdicom
    - https://github.com/ImagingDataCommons/libdicom/releases
    - https://libdicom.readthedocs.io/en/latest
    - https://raw.githubusercontent.com/ImagingDataCommons/libdicom/main/README.md
  summary:
    - >
      libdicom is an Imaging Data Commons C library and command-line tool set for
      reading DICOM whole-slide imaging files. It is a newer, focused medical-imaging
      package built around fast metadata/frame access rather than general image
      rendering.
  timeline:
    - >
      2023: OpenSlide 4.0 adoption of libdicom for DICOM WSI support was described in
      the libdicom README image/context.
    - >
      2024: libdicom 1.1.0 release notes recorded memory-use, docs, pointer-ownership,
      and thread-safety improvements.
    - >
      2025: libdicom 1.2.0-rc1 release notes added DICOM catenation support and faster
      reads for files with an Extended Offset Table but no fragmented-pixel-data
      sequence.
    - '2026: The README build example referenced libdicom 1.3.0 source-tree naming.'
  usage:
    - >
      Developers use the C API or Python bindings to inspect metadata and read
      compressed frame payloads from DICOM WSI files. Command-line users get dcm-dump
      for structured inspection and dcm-getframe for frame extraction workflows.
related-packages:
  - id: brew:openslide
    reason: >
      OpenSlide uses libdicom to parse and load DICOM files and adds rendered-image APIs
      for whole-slide imaging workflows.
    rel: adjacent_workflow
    sources:
