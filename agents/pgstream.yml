history:
  adoption-history:
    - >
      The maintainers state that pgrx is used in production by many users, while
      retaining a pre-1.0 version because unresolved safety and ergonomics questions may
      require breaking changes.
    - >
      Its development environment supports Linux, macOS, and Windows targets and can
      manage several PostgreSQL versions from one extension codebase.
  package-nerd-significance:
    - >
      pgrx joins the Rust and PostgreSQL ecosystems: cargo-pgrx provides a Cargo-native
      workflow while the framework exposes PostgreSQL extension facilities through Rust
      types, macros, and guarded interfaces.
    - >
      It is notable to package users because installation involves more than placing a
      binary on PATH: initialization builds or registers PostgreSQL installations and
      records them under PGRX_HOME.
  project-history:
    - >
      pgrx developed as a Rust framework and associated Cargo tooling for building
      PostgreSQL extensions with more idiomatic and safer interfaces than direct use of
      PostgreSQL's C extension API.
    - >
      The project is maintained under the PgCentral Foundation organization and combines
      the pgrx library, procedural macros, generated bindings, examples, tests, and the
      cargo-pgrx development command.
  related-projects:
    - PostgreSQL provides the extension API and server installations managed by cargo-pgrx.
    - >
      Rust, Cargo, rustup, bindgen, and libclang form the principal development
      toolchain around pgrx.
  sources:
    - >
      https://github.com/pgcentralfoundation/pgrx#readme — official overview, supported
      platforms, features, production-use note, and workflow.
    - >
      https://github.com/pgcentralfoundation/pgrx/blob/develop/cargo-pgrx/README.md —
      official cargo-pgrx initialization, configuration, and command documentation.
  summary:
    - >
      pgrx is an open-source Rust framework and Cargo toolchain for creating, testing,
      running, and packaging PostgreSQL extensions.
  timeline:
    - >
      Pre-1.0 era: The maintainers intentionally retain a pre-1.0 version while safety
      and ergonomics questions remain.
    - >
      Current development: pgrx supports building one extension codebase against
      multiple supported PostgreSQL major versions.
  usage:
    - >
      Users install cargo-pgrx, run `cargo pgrx init` to download or register PostgreSQL
      installations, create an extension with `cargo pgrx new`, and use commands such as
      `run`, `test`, and `package` during development.
    - >
      `cargo pgrx init` creates `${PGRX_HOME}/config.toml`, which records PostgreSQL
      `pg_config` locations and configurable development ports.
