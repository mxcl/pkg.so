history:
  adoption-history:
    - >
      App Tamer has been maintained across both Intel and Apple Silicon generations of
      macOS. The current 2.x line supports modern systems, while an older 2.7.6 build
      remains available for macOS 10.9–10.12.
  package-nerd-significance:
    - >
      App Tamer turns low-level process controls—pausing tasks, limiting CPU
      consumption, changing priority, and favoring efficiency cores—into per-application
      automation. It is notable to Mac utility users as a graphical, policy-driven
      complement to tools such as nice, Activity Monitor, and manual process suspension.
  project-history:
    - >
      St. Clair Software developed App Tamer as a commercial Mac utility for
      automatically reducing background CPU use. Version 2 introduced the product
      generation represented by the current manual, and the vendor is publicly testing a
      major version 3 update.
  related-projects:
    - >
      App Tamer complements macOS Activity Monitor and command-line process-priority
      tools. It is produced by St. Clair Software, also known for Default Folder X.
  sources:
    - https://stclairsoft.com/AppTamer/help/index.html
    - https://www.stclairsoft.com/AppTamer/
    - https://www.stclairsoft.com/AppTamer/beta.html
    - https://www.stclairsoft.com/AppTamer/help/pages/managing.html
    - source_facts.package-manager
  summary:
    - >
      App Tamer is a commercial macOS process-management utility that automatically
      pauses or throttles background applications to reduce CPU use, heat, fan noise,
      and battery drain.
  timeline:
    - 'Before July 2013: App Tamer 1 licenses were already being sold.'
    - '2013: Purchases from July onward qualified for a free upgrade to version 2.'
    - 'Apple Silicon era: App Tamer added efficiency-core controls.'
    - '2026: St. Clair Software publicly tested App Tamer 3 betas.'
  usage:
    - >
      Users inspect processes from App Tamer's menu-bar window, then configure selected
      applications to stop in the background, run on efficiency cores, or stay within a
      CPU limit. Built-in policies cover common browsers, Adobe applications, Spotlight,
      and Time Machine.
