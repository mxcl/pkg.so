id: brew:daemonize
display-name: daemonize
repo: null
docs:
  - https://software.clapper.org/daemonize
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      daemonize spread through Unix package managers because it solves a narrow
      operational problem with very little surface area. The official page explicitly
      documents Homebrew installation for macOS and source builds for other Unix-like
      systems.
  package-nerd-significance:
    - >
      daemonize is a classic tiny-admin-tool package: stable C source, autoconf build,
      BSD licensing, a manpage, and a job that remains useful whenever a service process
      lacks its own daemon mode.
  project-history:
    - >
      The daemonize GitHub repository was created in 2010, while the official project
      page describes the tool in the tradition of W. Richard Stevens' Unix daemon
      definition. The page links the GitHub repository, release downloads, and a
      manpage.
  related-projects:
    - >
      daemonize is related to daemon, Unix daemon(3), FreeBSD daemon(1), init scripts,
      and process-supervision tools.
  sources:
    - https://software.clapper.org/daemonize
    - https://software.clapper.org/daemonize/daemonize.html
    - https://github.com/bmc/daemonize
    - https://api.github.com/repos/bmc/daemonize
  summary:
    - >
      daemonize is a small C command-line utility for running another command as a Unix
      daemon when that program does not daemonize itself correctly.
  timeline:
    - '2010: daemonize repository created.'
    - '2010s: 1.6 and 1.7 release-tag series published.'
    - '2026: repository still maintained with recent activity.'
  usage:
    - >
      Users wrap a foreground command with daemonize so it detaches, runs in the
      background, and can redirect stdin, stdout, stderr, pidfiles, and
      working-directory behavior according to the manpage.
related-packages:
  - id: brew:daemon
    reason: >
      Choose daemon when you need reusable service definitions, syslog routing, or
      automatic respawning; daemonize is the leaner choice for simply detaching a
      command with optional redirection and locking.
    rel: alternative
    sources:
      - https://software.clapper.org/daemonize/daemonize.html
      - https://www.libslack.org/daemon/manual/daemon.1.html
