history:
  adoption-history:
    - >
      The project has been maintained across several eras: founder Ciro Mattia Gonano
      was active from 2012 to 2014, Paweł Jastrzębski from 2013 to 2019, and Alex Xu
      from 2023 onward, according to the official README.
    - >
      Its scope expanded beyond Kindle-oriented output to profiles and formats for Kobo,
      reMarkable, and other E-ink readers, with distribution for Windows, macOS, Linux,
      Flatpak, Docker, and AppImage workflows.
  package-nerd-significance:
    - >
      KCC occupies the specialized gap between general ebook converters and device-aware
      comic preprocessing. It resizes, crops, splits spreads, adjusts image
      characteristics, and emits fixed-layout formats tailored to particular E-ink
      screens.
    - >
      It is notable to packagers because the project offers both a desktop GUI and
      power-user command-line tools while depending on a changing ecosystem of ebook
      formats and vendor utilities.
  project-history:
    - >
      Kindle Comic Converter began in 2012 as a cross-platform alternative to Dc5e's
      KindleComicParser. It was founded by Ciro Mattia Gonano and later maintained by
      successive contributors.
    - >
      Although its name emphasizes Kindle, the project evolved into a general comic and
      manga conversion tool for multiple E-ink reader families.
  related-projects:
    - KindleComicParser inspired KCC's original cross-platform implementation.
    - KOReader is an optional target reading environment discussed by the project.
    - >
      Calibre is a related ebook tool, although KCC warns that modifying its
      fixed-layout output in Calibre can break formatting and page numbers.
  sources:
    - https://github.com/ciromattia/kcc
    - https://github.com/ciromattia/kcc/wiki
  summary:
    - >
      Kindle Comic Converter, commonly called KCC, preprocesses comics and manga for
      E-ink devices and produces formats including MOBI/AZW3, EPUB, KEPUB, CBZ, PDF, and
      image folders.
  timeline:
    - '2012: Ciro Mattia Gonano founded KCC as an alternative to KindleComicParser.'
    - '2013–2019: Paweł Jastrzębski participated in maintaining the project.'
    - '2023: Alex Xu began the current maintenance era.'
  usage:
    - >
      A typical GUI workflow is to add an image folder, comic archive, EPUB, or PDF;
      choose a device profile and output format; convert it; and copy the result to the
      reader.
    - >
      Power users can run the standalone conversion commands for device profiles, manga
      direction, spread handling, cropping, image format, metadata, batch splitting, and
      custom screen dimensions.
