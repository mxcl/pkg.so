history:
  adoption-history:
    - >
      libgig's adoption is bound to the LinuxSampler suite. The LinuxSampler downloads
      page places libgig as a mandatory dependency for LinuxSampler and gigedit, and the
      libgig page names qsampler-related metadata use and third-party access to
      GigaSampler files.
    - >
      Package managers often expose the command-line tools under names such as gigtools,
      making libgig useful even outside the full sampler stack for dumping, extracting,
      merging, and converting sampler-file data.
  package-nerd-significance:
    - >
      libgig is a good example of a package that exists because file formats outlive
      products. GigaSampler and GigaStudio-era sample libraries remain useful, and
      libgig gives free-software audio stacks a maintained way to read and manipulate
      them.
    - >
      For packagers, it is part of a small LinuxSampler constellation: libgig below
      LinuxSampler and gigedit, with qsampler and JSampler as frontends around the
      sampler engine.
  project-history:
    - >
      The LinuxSampler project page says libgig was written by Christian Schoenebeck and
      released as source under the GPL, with AKAI classes under the LGPL. The release
      list reaches back to libgig 0.6.0 on 20 December 2003 and shows a 1.0.0 release on
      26 November 2004.
    - >
      Over time libgig expanded beyond GigaSampler/GigaStudio and DLS Level 1/2 files to
      include KORG sample-based instruments, SoundFont v2 files, and AKAI sampler data.
      The same page records platform evolution: POSIX-oriented development, Windows
      support since 3.1.1, file resizing work since 3.0.0, and C++11 plus UUID
      requirements since 4.3.0.
  related-projects:
    - >
      LinuxSampler is the main consuming sampler engine. gigedit edits .gig instruments,
      qsampler and JSampler are frontends in the same suite, and liblscp provides
      LinuxSampler Control Protocol support.
  sources:
    - https://download.linuxsampler.org/doc/libgig/html
    - https://formulae.brew.sh/formula/libgig
    - https://svn.linuxsampler.org/svn/libgig/trunk
    - https://www.linuxsampler.org/downloads.html
    - https://www.linuxsampler.org/libgig/
  summary:
    - >
      libgig is the LinuxSampler project's C++ library for GigaSampler/GigaStudio .gig
      files and related sampler formats. It packages the unglamorous but essential
      file-format work behind LinuxSampler, gigedit, and command-line sample-library
      inspection and conversion tools.
  timeline:
    - '2003: libgig 0.6.0 source package released on 20 December 2003.'
    - '2004: libgig 1.0.0 released on 26 November 2004.'
    - >
      2006: libgig 3.0.0 released, with later documentation noting file-resizing
      implementation changes from this line.
    - >
      2007: libgig 3.1.1 released, with project documentation noting Windows support
      since this release.
    - '2015: libgig 4.0.0 released.'
    - >
      2021: libgig 4.3.0 released, requiring a C++11 compiler and an OS-provided UUID
      function.
    - '2025: libgig 4.5.2 source package listed with a 17 December 2025 timestamp.'
  usage:
    - >
      Users use libgig directly as a library or indirectly through tools such as
      gigdump, gigextract, gigmerge, gig2mono, gig2stereo, korgdump, korg2gig, sf2dump,
      sf2extract, akaidump, akaiextract, dlsdump, and rifftree.
    - >
      The project is especially useful around legacy and proprietary sampler media,
      where preserving, inspecting, or converting instrument libraries matters more than
      creating new audio synthesis code.
