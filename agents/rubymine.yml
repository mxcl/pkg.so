id: cask:rubymine
display-name: RubyMine
repo: null
docs:
  - https://www.jetbrains.com/help/ruby
config-file-location:
  linux:
    - ~/.config/JetBrains/RubyMine<version>
  macos:
    - ~/Library/Application Support/JetBrains/RubyMine<version>
  windows:
    - '%APPDATA%\JetBrains\RubyMine<version>'
credentials-file-location: null
history:
  adoption-history:
    - >
      JetBrains reported roughly 25,000 downloads between the November 2008 public
      preview and the April 2009 general release. The current product site describes
      RubyMine as serving more than 100,000 Ruby professionals.
    - >
      RubyMine became an established integrated alternative to editor-centered Ruby
      development, particularly for Rails teams wanting code analysis, refactoring,
      debugging, testing, database tools, and version-control support in one
      application.
  package-nerd-significance:
    - >
      RubyMine understands dependency and toolchain conventions across Ruby, Rails,
      Bundler, Rake, RuboCop, RSpec, databases, and version control. Its versioned
      per-user configuration directories also make settings migration and backup
      relevant to desktop-package maintenance.
  project-history:
    - >
      JetBrains developed Ruby language support first as an IntelliJ IDEA plugin.
      Community interest in that plugin led the company to create RubyMine as a
      dedicated IDE built on the IntelliJ Platform.
    - >
      A public preview appeared in November 2008, followed by RubyMine 1.0 on April 28,
      2009. Subsequent releases tracked changes in Ruby and Rails while adding broader
      web, database, testing, deployment, and remote-development capabilities.
  related-projects:
    - >
      RubyMine is built on the IntelliJ Platform and shares technology with JetBrains
      products including IntelliJ IDEA, WebStorm, and DataGrip. It commonly works with
      Rails, Bundler, Rake, RuboCop, RSpec, and Git.
  sources:
    - https://blog.jetbrains.com/ruby/2008/11/rubymine-new-ruby-and-rails-ide-from-jetbrains/
    - >
      https://blog.jetbrains.com/ruby/2009/04/meet-jetbrains-rubymine-10-a-brand-new-ide-for-ruby-and-rails/
    - https://www.jetbrains.com/help/ruby/
    - https://www.jetbrains.com/ruby/
  summary:
    - >
      RubyMine is JetBrains' cross-platform integrated development environment for Ruby
      and Ruby on Rails development.
  timeline:
    - '2005: JetBrains begins work on Ruby support for IntelliJ IDEA.'
    - '2008-11: JetBrains releases the RubyMine public preview.'
    - '2009-04-28: RubyMine 1.0 becomes generally available.'
  usage:
    - >
      Developers use RubyMine to navigate and refactor Ruby code, manage project
      dependencies, run and debug applications and tests, develop Rails applications,
      inspect databases, and work with integrated version control and terminal tools.
