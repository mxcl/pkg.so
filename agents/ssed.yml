history:
  adoption-history:
    - >
      ssed's standalone package survives mainly through distribution and package-manager
      channels such as Debian, Ubuntu, MacPorts, and Homebrew rather than a live
      upstream repository.
    - >
      Homebrew's current formula uses Debian's source tarball because the original
      website is down, and its analytics show small but continuing install-on-request
      usage.
  package-nerd-significance:
    - >
      ssed is package-nerd significant because it is both a packaged fork/enhancement
      and a feeder project: features from Super sed were explicitly merged into GNU sed
      3.95 on the path to GNU sed 4.
    - >
      It is also a preservation case. The original upstream site is gone, but Debian and
      Homebrew continue carrying source-package metadata and build recipes for a small
      historical Unix text-processing tool.
  project-history:
    - >
      The Free Software Directory describes Super-sed as an enhanced sed text editor
      maintained by Paolo Bonzini, with Philip Hazel listed as a contributor. Debian
      describes the package as an enhanced version of GNU sed 3.02 with new features,
      extended regular expression syntax, new commands, and bug fixes.
    - >
      GNU's 2002 sed 3.95 release announcement says GNU sed 3.95 merged most of the
      changes from the free-software super-sed project, making ssed historically
      relevant to the transition toward GNU sed 4.
  related-projects:
    - GNU sed is the base project and the later recipient of many super-sed changes.
    - >
      Perl regular expressions and the Bourne shell are called out in official
      descriptions of ssed's added behavior.
  sources:
    - https://directory.fsf.org/wiki/Super-sed
    - https://formulae.brew.sh/api/formula/ssed.json
    - https://lists.gnu.org/archive/html/info-gnu/2002-10/msg00000.html
    - https://packages.debian.org/sid/ssed
  summary:
    - >
      ssed, or Super sed, is an enhanced version of GNU sed oriented around command-line
      stream editing with extra features such as Perl-style regular expressions and
      in-place editing.
  timeline:
    - '2001: Free Software Directory records GPLv2 license verification for Super-sed.'
    - '2002: GNU sed 3.95 release announcement says most super-sed changes were merged.'
    - '2026: Debian sid carries ssed 3.62-8.1.'
    - "2026: Homebrew formula packages ssed 3.62 from Debian's source tarball."
  usage:
    - >
      Like sed, ssed reads files or standard input, applies editing commands, and writes
      transformed text to standard output. Debian emphasizes this stream-editor model in
      the package description.
    - >
      The FSF entry highlights features package users cared about at the time: Perl
      regular expressions, faster behavior than older GNU sed, in-place editing, and
      piping command output through the Bourne shell.
