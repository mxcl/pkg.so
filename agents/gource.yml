history:
  adoption-history:
    - >
      Gource spread as much through demos and conference/project videos as through
      ordinary CLI usage. Its official site links a videos page and documents video
      capture through raw PPM streams, making it easy to turn repository history into
      shareable media. The input package-manager metadata lists it across many packaging
      ecosystems, including Homebrew, Debian, Ubuntu, Fedora, Arch, Nix, MacPorts,
      Scoop, winget, and zypper, which matches its cross-platform positioning in the
      official releases and README.
    - >
      The tool also became a useful cultural artifact for open-source projects: a
      maintainer can point Gource at a repository and produce a compact visual narrative
      of contributors, churn, directory growth, and long-running maintenance. That made
      it common in release retrospectives, project anniversary videos, dashboards, and
      presentation interludes where a normal `git log` would be too dry.
  package-nerd-significance:
    - >
      Gource is package-nerd catnip because it makes package history itself visible. It
      turns the normally invisible work of maintainers, translators, vendors, and
      drive-by contributors into a watchable artifact, so it often shows up wherever
      people want to celebrate or explain an open-source repository's life.
    - >
      It is also a packaging stress test in miniature: OpenGL, SDL, Boost/GLM, fonts,
      image loading, Windows builds, ffmpeg piping, and VCS detection all cross paths in
      one CLI. That gives downstream packagers plenty to care about even though the
      user-facing command is simple.
  project-history:
    - >
      Gource appeared publicly in 2009 on the author's Alpha Blenders site as a
      visualization for source-control history. The project emphasized Git first, but
      its official documentation grew to include built-in log generation for Git,
      Mercurial, Bazaar, and SVN, plus a custom pipe-delimited log format for other
      systems. The official README and site describe the same core metaphor across
      releases: an OpenGL-rendered animated tree, with contributors and files moving
      according to repository events.
    - >
      The project moved through a long sequence of small releases rather than one large
      platform shift. Its ChangeLog records the early 0.1 first release, later additions
      such as video-oriented PPM output, Mercurial and Bazaar support, SVN support,
      custom logs, configuration files, screenshots, and many display controls. The
      official site notes that downloads moved to GitHub in 2014 after Google Code
      stopped accepting new downloads, which also marks Gource's migration from its
      older hosting era into the GitHub-centered packaging era.
    - >
      Later releases kept the tool relevant to changing desktops and toolchains: SDL2
      support and date-range filtering in 2014, 64-bit Windows builds and direct stdout
      streaming for ffmpeg workflows in 2017, font and display controls in the 0.50
      line, Retina/HiDPI work and ISO 8601 timestamp support in 2022, experimental
      Wayland support in 2023, and additional author-time/build updates in 2026.
  related-projects:
    - >
      Logstalgia, another visualization tool by Andrew Caudwell, is linked from the
      official Gource site as related software for web server access logs.
    - >
      Git, Mercurial, Bazaar, SVN, and CVS-style logs are the version-control ecosystems
      documented by Gource's official site, README, and custom log support.
    - >
      ffmpeg is commonly paired with Gource through raw PPM output when users want to
      render repository visualizations as video.
  sources:
    - https://gource.io/
    - https://raw.githubusercontent.com/acaudwell/Gource/master/ChangeLog
    - https://raw.githubusercontent.com/acaudwell/Gource/master/README.md
    - https://thealphablenders.com/2009/12/gource-software-version-control-visualization/
  summary:
    - >
      Gource is Andrew Caudwell's software version-control visualization tool: it turns
      a repository log into an animated tree where directories become branches, files
      become leaves, and contributors move through the history as they modify files. It
      became a durable package-manager favorite because it is both a serious
      source-history visualizer and a visually memorable demo of what a repository has
      been doing over time.
  timeline:
    - >
      2009: Gource was publicly introduced by Andrew Caudwell as a source-control
      visualization tool.
    - '0.1: The ChangeLog records the first release.'
    - >
      2014: Gource 0.41 added SDL2-related multi-monitor support and moved downloads to
      GitHub after Google Code download hosting changed.
    - >
      2014: Gource was nominated for the New Zealand Open Source Awards people's choice
      category.
    - >
      2017: Gource 0.47 added new filtering/display options, 64-bit Windows builds, and
      stdout streaming for ffmpeg-style workflows on Windows.
    - >
      2019: Gource 0.50 added multiple display/font/user options and included
      community-contributed fixes.
    - >
      2022: Gource 0.52 and 0.53 added Retina/HiDPI-oriented rendering improvements and
      ISO 8601/custom timestamp handling.
    - '2023: Gource 0.54 added experimental Wayland support.'
    - '2026: Gource 0.56 added an `--author-time` option and build compatibility updates.'
  usage:
    - >
      Basic usage is intentionally small: run `gource` in a supported repository, pass a
      path to a repository or pre-generated log, or feed custom logs on stdin. The
      README documents command-line controls for viewports, fullscreen/windowed mode,
      date filtering, user and file display, logos, screenshots, PPM output, custom
      logs, and other visualization parameters.
    - >
      For package users, the important operational details are graphical rather than
      configuration-driven: Gource needs OpenGL/3D acceleration, can generate logs from
      supported VCS formats, and can pipe frames to encoders such as ffmpeg. It does not
      require a persistent config file for ordinary package-manager installation.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Gource's official video guide documents piping its PPM frame stream into FFmpeg to
      encode repository visualizations as video.
    rel: adjacent_workflow
    sources:
      - https://github.com/acaudwell/Gource/wiki/Videos
      - https://ffmpeg.org/
  - id: brew:git
    reason: >
      Gource can directly generate and visualize logs from Git repositories, making Git
      history a primary input to its visualization workflow.
    rel: adjacent_workflow
    sources:
      - https://gource.io/
      - https://git-scm.com/
  - id: brew:mercurial
    reason: >
      Gource includes built-in Mercurial log generation, allowing Mercurial repositories
      to be visualized without an intermediate conversion tool.
    rel: adjacent_workflow
    sources:
      - https://gource.io/
      - https://www.mercurial-scm.org/
  - id: brew:subversion
    reason: >
      Gource includes built-in Subversion log support for visualizing the history of SVN
      repositories.
    rel: adjacent_workflow
    sources:
      - https://gource.io/
      - https://subversion.apache.org/
