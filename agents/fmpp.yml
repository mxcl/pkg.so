id: brew:fmpp
display-name: FMPP
repo: https://github.com/freemarker/fmpp
docs:
  - https://fmpp.sourceforge.net/manual.html
  - https://fmpp.sourceforge.net/api
config-file-location:
  unix:
    - ./config.fmpp
    - ./fmpp.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      FMPP was used heavily according to its official homepage, especially for recursive
      directory processing and static generation tasks built around FreeMarker. Its
      adoption is rooted in Java-era build tooling: the official docs advertise
      command-line use, Ant integration, and embeddability rather than a modern plugin
      ecosystem.
  package-nerd-significance:
    - >
      FMPP is significant as a preserved Java CLI from the pre-Maven mainstream era that
      still solves a narrow templating problem with very little ceremony. For package
      maintainers it combines a command-line executable, Ant task, embedded API, bundled
      documentation, and a dependency relationship with Apache FreeMarker.
  project-history:
    - >
      The official homepage states that FMPP was mostly written in 2003 by a single
      author to automate work tasks, and that it later entered maintenance mode. The
      project predates Java generics and Maven-like dependency management, which helps
      explain its older Java packaging style.
    - >
      FMPP's version history records a long 0.8 and 0.9 series. In 2014, version 0.9.15
      moved source code from SourceForge to GitHub, changed the license to Apache
      License 2.0, and aligned copyright and contribution handling with FreeMarker.
      Version 0.9.16 followed in 2018 with newer FreeMarker defaults, JSON-loader
      improvements, and Java 5 as the minimum runtime.
  related-projects:
    - >
      Related official projects and technologies include Apache FreeMarker, Apache Ant,
      SourceForge, GitHub, BeanShell, and Java.
  sources:
    - https://api.github.com/repos/freemarker/fmpp
    - https://fmpp.sourceforge.net/
    - https://fmpp.sourceforge.net/manual.html
    - https://fmpp.sourceforge.net/versions.html
    - https://github.com/freemarker/fmpp
  summary:
    - >
      FMPP, the FreeMarker-based file PreProcessor, is a Java text preprocessing tool
      for generating websites, source code, configuration files, and other text from
      FreeMarker templates. It can be used as a Unix-style command-line tool, an Ant
      task, or an embedded Java API.
  timeline:
    - '2003: FMPP was mostly written to automate work tasks.'
    - '2006: The 0.9.11 release updated bundled FreeMarker and BeanShell dependencies.'
    - '2007: The project switched from CVS to SVN.'
    - >
      2014: Version 0.9.15 moved source code to GitHub and changed licensing to Apache
      License 2.0.
    - >
      2018: Version 0.9.16 updated FreeMarker support and raised the minimum Java
      version to Java 5.
  usage:
    - >
      Users point FMPP at a source tree and configuration file, expose data such as XML,
      CSV, JSON, Java properties, Ant properties, or custom Java data loaders, and
      render outputs through FreeMarker templates. Its documented use cases include
      static websites, source generation, and configuration-file generation.
related-packages:
  - id: brew:ant
    reason: >
      FMPP provides a documented Ant task that runs template processing directly from
      `build.xml`, making Apache Ant a concrete companion for automated Java-era builds.
    rel: adjacent_workflow
    sources:
      - https://fmpp.sourceforge.net/ant.html
      - https://ant.apache.org/manual/
