id: brew:direvent
display-name: GNU Direvent
repo: https://git.savannah.gnu.org/cgit/direvent.git
docs:
  - https://www.gnu.org.ua/software/direvent/manual/direvent.html
  - https://www.gnu.org.ua/software/direvent/direvent.html
config-file-location:
  unix:
    - /etc/direvent.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The project sits in the Unix systems-administration tradition rather than the
      application-framework world. Its official documentation targets Linux and
      BSD-style systems, including FreeBSD, NetBSD, OpenBSD, and Darwin, where
      filesystem event APIs differ but automation needs are similar.
  package-nerd-significance:
    - >
      Direvent is interesting to package maintainers because it packages a portable
      daemon around a notoriously non-portable problem: reacting to filesystem changes
      across Unix kernels.
  project-history:
    - >
      GNU Direvent is maintained in Sergey Poznyakoff's GNU software area and documented
      as a daemon for reacting to events in preconfigured directories. Its manual
      emphasizes a uniform command-level interface over system-specific filesystem
      notification mechanisms.
  related-projects:
    - >
      Direvent belongs near other filesystem event tools and init-adjacent automation
      daemons, but its official documentation focuses on its own watcher configuration
      model.
  sources:
    - https://www.gnu.org.ua/software/direvent/direvent.html
    - https://www.gnu.org.ua/software/direvent/manual/direvent.html
    - https://git.savannah.gnu.org/cgit/direvent.git
  summary:
    - >
      GNU Direvent is a directory event monitoring daemon that runs configured commands
      when filesystem changes occur.
  timeline:
    - '2013: Documentation copyright period begins for GNU Direvent.'
    - '2019: Manual updated for GNU Direvent 5.2.'
    - '2026: Official project page remains maintained under the GNU Ukrainian software site.'
  usage:
    - >
      Users define watchers in /etc/direvent.conf or pass an alternate config file on
      the command line. Each watcher maps filesystem events to external commands, making
      the tool useful for immediate reactions to changes in important files or
      directories.
related-packages:
  - id: brew:watchexec
    reason: >
      Choose watchexec for an interactive, cross-platform command runner that
      recursively restarts commands as files change, instead of configuring a persistent
      system daemon.
    rel: alternative
    sources:
      - https://www.gnu.org.ua/software/direvent/manual/direvent.html
      - https://watchexec.github.io/docs/
  - id: brew:entr
    reason: >
      Choose entr for a small foreground Unix pipeline where the watched files arrive on
      standard input and one command should run when they change.
    rel: alternative
    sources:
      - https://www.gnu.org.ua/software/direvent/manual/direvent.html
      - https://eradman.com/entrproject/
