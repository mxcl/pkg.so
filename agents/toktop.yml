id: brew:toktop
display-name: toktop
repo: null
docs:
  - https://github.com/htin1/toktop#readme
config-file-location: null
credentials-file-location:
  unix:
    - ./.env
history:
  adoption-history:
    - >
      Available history is limited to the official project repository and package
      metadata. Homebrew carries the tool as `toktop`, and the upstream README documents
      `cargo install toktop --locked`, so adoption appears centered on Rust/Cargo and
      Homebrew users who want terminal-native LLM account monitoring.
  package-nerd-significance:
    - >
      For package nerds, toktop is interesting less as infrastructure history and more
      as a marker of a new CLI niche: local, terminal-first accounting for metered LLM
      APIs. Its packaging surface is intentionally small: one binary, MIT license, Cargo
      install path, and a Homebrew formula.
  project-history:
    - >
      The official repository is a compact Rust project with a README, Cargo metadata,
      and a short changelog. The changelog records early 0.1.x releases in November and
      December 2025, with work focused on cost API fixes, chart rendering, filtering,
      grouping by model or API key, and richer usage summaries.
  related-projects:
    - >
      The README explicitly compares the experience to htop and notes that it is built
      with Ratatui, aligning it with terminal UI observability tools.
  sources:
    - https://github.com/htin1/toktop#readme
    - https://raw.githubusercontent.com/htin1/toktop/main/CHANGELOG.md
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      toktop is a small terminal dashboard for monitoring OpenAI and Anthropic token
      usage and costs. Its own README frames it as "htop but for llm tokens", placing it
      in the recent wave of developer tools that turn cloud AI spend into a live
      terminal workflow.
  timeline:
    - >
      2025: Changelog records early 0.1.x releases focused on LLM usage and cost
      dashboard behavior.
    - 'Current: README documents OpenAI and Anthropic admin-key based terminal monitoring.'
  usage:
    - >
      The README documents running `toktop` after setting `OPENAI_ADMIN_KEY` and
      `ANTHROPIC_ADMIN_KEY`, passing an env file with `toktop -e .env`, or letting the
      program prompt for API keys. In package-manager terms, it is a single executable
      meant to sit beside other terminal observability tools.
