    - https://www.fourmilab.ch/webtools/midicsv/
  summary:
    - >
      MIDICSV is John Walker's Fourmilab pair of command-line tools for translating
      Standard MIDI files to a textual CSV representation and back. The Fourmilab manual
      page dates the work to February 2004, with a January 2008 revision, and places the
      software in the public domain.
  usage:
    - >
      The package is aimed at programmers and musicians who want to manipulate MIDI with
      ordinary text tools instead of a sequencer or a MIDI-specific library. The midicsv
      program decodes a MIDI file into CSV while preserving the information needed to
      reconstruct an equivalent MIDI file; csvmidi performs the reverse conversion.
      Fourmilab's examples show pipelines that transpose notes, duplicate events for a
      chorus effect, extract channels, or generate simple MIDI material from scripts. In
      package-manager form, the package is mostly a small Unix utility pair for batch
      MIDI editing, testing, data extraction, and scriptable music transformations.
