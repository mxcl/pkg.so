id: brew:forgejo
display-name: Forgejo
repo: https://codeberg.org/forgejo/forgejo
docs:
  - https://forgejo.org/docs
config-file-location:
  unix:
    - custom/conf/app.ini
    - /etc/forgejo/app.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      Forgejo adoption is strongly linked to self-hosting and Free Software
      infrastructure. The project homepage emphasizes easy installation, low
      maintenance, a familiar GitHub-like environment, and Codeberg as a prominent
      Forgejo user.
    - >
      Forgejo's FAQ says most users are developers of free and open source software and
      points to a community-maintained list of public instances with open registration.
    - >
      The project moved through compatibility-oriented 1.x releases, adopted
      semantic-versioned v7.0 as its first LTS release in April 2024, and later changed
      licensing so v9.0 and newer releases are GPL-3.0-or-later.
  package-nerd-significance:
    - >
      Forgejo is significant for package-history work because it is both a packaged
      server application and a fork that carries compatibility, migration, release
      policy, and licensing implications.
    - >
      It is also part of the broader software-forge family that includes Gitea, Gogs,
      GitLab, SourceHut, and GitHub-like hosting workflows, while deliberately
      emphasizing community governance and Free Software infrastructure.
  project-history:
    - >
      Forgejo launched publicly on December 15, 2022 after work by former Gitea
      maintainers and FOSS community members. The launch post describes it as a drop-in
      replacement for Gitea, started in reaction to governance changes around Gitea Ltd.
    - >
      The project is hosted on Codeberg and its FAQ says Codeberg e.V. holds the Forgejo
      domains, provides resources, and cooperates closely with the project while Forgejo
      governance remains independent.
    - >
      In February 2024, Forgejo announced the decision to become a hard fork, explaining
      that its governance, testing requirements, feature work, and goals had diverged
      from Gitea.
  related-projects:
    - >
      Forgejo is directly related to Gitea, from which it began as a soft fork, and to
      the earlier Gogs lineage through Gitea.
    - >
      Forgejo ecosystem projects include forgejo-runner, Forgejo Actions, Forgejo CLI,
      Forgejo Helm chart, and forge federation work based around ForgeFed and
      ActivityPub.
  sources:
    - https://codeberg.org/api/v1/repos/forgejo/forgejo
    - https://codeberg.org/forgejo/forgejo/raw/branch/forgejo/README.md
    - https://forgejo.org/
    - https://forgejo.org/2022-12-15-hello-forgejo/
    - https://forgejo.org/2024-02-forking-forward/
    - https://forgejo.org/docs/latest/admin/config-cheat-sheet/
    - https://forgejo.org/faq/
    - https://forgejo.org/releases/
  summary:
    - >
      Forgejo is a self-hosted lightweight software forge for Git hosting, issues, pull
      requests, wikis, releases, packages, and related collaboration workflows. It began
      as a community-driven soft fork of Gitea and later became a hard fork.
  timeline:
    - >
      2022: Forgejo launches publicly on December 15 as a community-driven Free Software
      project and Gitea-compatible soft fork.
    - '2023: Forgejo celebrates its first year and publishes v1.21 as its fourth major release.'
    - '2024: Forgejo announces a hard-fork path in February.'
    - >
      2024: Forgejo v7.0 is released in April as the first LTS release and adopts
      semantic versioning.
    - >
      2024: Forgejo v9.0 is released in October as the first copyleft release under
      GPL-3.0-or-later.
    - '2025: Forgejo v11.0 is released in April as an LTS release.'
    - >
      2026: Forgejo v15.0 is released in April as an LTS release supported until July
      15, 2027.
  usage:
    - >
      Admins install Forgejo as a server application and manage it through app.ini. The
      official configuration cheat sheet says local changes belong in
      custom/conf/app.ini and packaged installations commonly use /etc/forgejo/app.ini.
    - >
      Users interact with Forgejo through the web UI, Git over SSH or HTTP, issues, pull
      requests, releases, package registries, and optionally Forgejo Actions.
related-packages:
  - id: brew:gitea
    reason: >
      Choose Gitea when you prefer the upstream lineage and its independently governed
      ecosystem; Forgejo began as a compatible Gitea fork but now develops separately.
    rel: alternative
    sources:
      - https://forgejo.org/2024-02-forking-forward/
      - https://about.gitea.com/
  - id: brew:forgejo-cli
    reason: >
      Forgejo CLI complements a Forgejo server by exposing its issues, pull requests,
      repositories, organizations, teams, and releases from the terminal.
    rel: adjacent_workflow
    sources:
      - https://codeberg.org/forgejo-contrib/forgejo-cli
      - https://forgejo.org/
  - id: brew:forgejo-runner
    reason: >
      Forgejo Runner connects to a Forgejo instance to fetch and execute the Actions
      jobs scheduled by the server.
    rel: adjacent_workflow
    sources:
      - https://forgejo.org/docs/latest/admin/actions/
      - https://code.forgejo.org/forgejo/runner
