id: brew:blastem
display-name: BlastEm
repo: https://www.retrodev.com/repos/blastem
docs:
  - https://www.retrodev.com/blastem
  - https://www.retrodev.com/repos/blastem/file/tip/README
config-file-location:
  unix:
    - ~/.config/blastem/blastem.cfg
  windows:
    - '%localappdata%\blastem\blastem.cfg'
credentials-file-location: null
history:
  adoption-history:
    - >
      BlastEm's package adoption is modest but broad for an emulator: the input package
      facts list Homebrew, Debian, Nix, and Ubuntu. That pattern fits emulator tooling
      that is useful on desktops and in reproducible retro-development setups, even
      without the mass visibility of larger emulator suites.
  package-nerd-significance:
    - >
      The interesting packaging angle is that BlastEm is not just a game launcher. It
      ships as a small native emulator with debug-oriented features, making it useful
      for retro-game development and validation where command-line launch and stable
      config paths matter.
  project-history:
    - >
      The official site presents BlastEm as a fast and accurate Genesis emulator. The
      upstream README for the 0.6.x series documents both a GUI menu and command-line
      use, plus configuration, lock-on support, VDP debugging views, oscilloscope
      visualization, screenshots, video recording, and VGM logging.
  related-projects:
    - >
      Related projects include other Genesis/Mega Drive emulators, Sega CD emulation
      tooling, VGM logging tools, and retro-development workflows for testing ROMs.
  sources:
    - https://www.retrodev.com/blastem
    - https://www.retrodev.com/blastem/changes.html
    - https://www.retrodev.com/repos/blastem/file/tip/README
    - input source_facts.package-manager
  summary:
    - >
      BlastEm is a Sega Genesis/Mega Drive emulator packaged as a native command-line
      and GUI-capable emulator. Its niche is fast, accurate emulation with enough
      low-level tooling to appeal to both players and homebrew/debugging users.
  timeline:
    - 'Pre-0.4.1: BlastEm used Unix-style config and save-file locations on Windows.'
    - >
      0.6.x: README documents GUI menu access, command-line operation, lock-on support,
      and debugging/video/VGM features.
  usage:
    - >
      Users can launch BlastEm with no ROM to enter the menu, pass a ROM path on the
      command line, or use command-line options for operations that are not exposed
      through the GUI. Configuration is read from `~/.config/blastem/blastem.cfg` on
      Unix-like systems.
related-packages:
  - id: brew:mednafen
    reason: >
      Choose Mednafen when one command-line emulator must cover Genesis/Mega Drive
      alongside many non-Sega systems; choose BlastEm for its deeper Sega focus,
      debugging facilities, and Sega CD and 32X support.
    rel: alternative
    sources:
      - https://www.retrodev.com/blastem/
      - https://mednafen.github.io/
      - https://mednafen.github.io/documentation/md.html
