    reason: >
      Install fzf to enable arttime's documented optional fuzzy interface for selecting
      text art interactively from its collection.
    rel: adjacent_workflow
    sources:
      - https://github.com/poetaman/arttime#readme
      - https://github.com/junegunn/fzf#readme
