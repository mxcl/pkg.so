config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README supports three distribution paths: downloadable release
      binaries, installation with Go's module-aware go install command, and Homebrew.
      The supplied metadata additionally records a Nix package.
  package-nerd-significance:
    - >
      md2pdf provides a single Go binary for document conversion and builds PDFs through
      gomarkdown and fpdf instead of requiring a browser-based rendering stack. That
      makes it attractive for shell scripts, CI jobs, and reproducible document
      toolchains.
  project-history:
    - >
      The public repository began in January 2018. Its tagged release line reached v1.3
      in 2023, v2 in the following development period, and v2.2.18 in 2025; the v2.2.18
      change also adjusted references after the project moved under the solworktech
      GitHub organization.
  related-projects:
    - >
      The official README identifies gomarkdown/markdown as the parser, go-pdf/fpdf as
      the PDF generator, and gohighlight as the syntax-highlighting component.
  sources:
    - https://github.com/solworktech/md2pdf#readme
    - https://github.com/solworktech/md2pdf/blob/master/md2pdf.1.md
    - https://github.com/solworktech/md2pdf/commits/master/
    - https://github.com/solworktech/md2pdf/tags
    - source_facts.package-manager
  summary:
    - >
      md2pdf is a Go command-line utility that renders Markdown as PDF, with syntax
      highlighting, light and dark themes, custom themes, tables, generated tables of
      contents, pagination controls, footers, and non-Latin font support.
  timeline:
    - '2018: The public md2pdf repository is created.'
    - '2023: The v1.3 release line is tagged.'
    - '2025: The v2.2 release line reaches v2.2.18 under the solworktech organization.'
  usage:
    - >
      Users pass a Markdown file, a directory of Markdown files, an HTTP(S) URL, or
      standard input and select an output PDF. Options control page size and
      orientation, themes, fonts, syntax highlighting, generated contents, page breaks,
      and footer metadata.
related-packages:
  - id: brew:pandoc
    reason: >
      Choose Pandoc when you need many input and output formats, filters, citations, or
      selectable PDF engines; choose md2pdf for a focused Go-based Markdown-to-PDF
      command with built-in themes and pagination controls.
    rel: alternative
    sources:
      - https://github.com/solworktech/md2pdf#readme
      - https://pandoc.org/MANUAL.html
