id: brew:git-review
display-name: git-review
repo: https://opendev.org/opendev/git-review
docs:
  - https://docs.opendev.org/opendev/git-review/latest
  - https://docs.opendev.org/opendev/git-review/latest/usage.html
config-file-location:
  unix:
    - .gitreview
    - ~/.config/git-review/git-review.conf
    - /etc/git-review/git-review.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      git-review became significant in the OpenStack/OpenDev ecosystem because it turned
      Gerrit's `refs/for/*` push workflow into a repeatable Git subcommand. Package
      availability through PyPI, system packages, and Homebrew made it convenient for
      contributors joining Gerrit-hosted projects.
  package-nerd-significance:
    - >
      The package is notable because it encodes a whole hosted-review convention in a
      small command-line client. For package maintainers and contributors, it reduces
      Gerrit onboarding friction and keeps repository-specific review metadata versioned
      alongside the project.
  project-history:
    - >
      The project grew out of the OpenStack and OpenDev review workflow, where Gerrit is
      the central code-review system. Its repository has a long 1.x tag series and a 2.x
      series documented through OpenDev release notes, reflecting years of adaptation to
      Gerrit, Git, OpenSSH, and Python changes.
    - >
      The 2.0.0 release marked a major maintenance boundary by dropping Python 2.7
      support and removing Gerrit draft-change options after Gerrit itself removed that
      state. Later releases added safer hook installation, support for newer Git and
      OpenSSH behavior, and upload options such as hashtags, patchset messages, and
      carbon-copy recipients.
  related-projects:
    - >
      Related projects and systems include Gerrit, OpenDev, OpenStack, Git, and the
      `.gitreview` metadata convention used by Gerrit-hosted repositories.
  sources:
    - https://formulae.brew.sh/formula/git-review
    - https://opendev.org/opendev/git-review
    - https://opendev.org/opendev/git-review/raw/branch/master/README.rst
    - https://opendev.org/opendev/git-review/raw/branch/master/doc/source/installation.rst
    - https://opendev.org/opendev/git-review/raw/branch/master/doc/source/releasenotes.rst
    - https://opendev.org/opendev/git-review/raw/branch/master/doc/source/usage.rst
  summary:
    - >
      git-review is an OpenDev tool for submitting Git branches to Gerrit. It
      standardizes the client-side workflow around `.gitreview` project metadata, Gerrit
      remotes, Change-Id hooks, and patchset upload/download commands.
  timeline:
    - '1.0: Early public tag in the OpenDev repository.'
    - '1.28.0: OpenStack-specific topic-name automation removed.'
    - '2.0.0: Python 2.7 support and Gerrit draft-change upload options removed.'
    - '2.4.0: Gerrit commit-msg hook embedded for safer setup.'
    - '2.5.0: CC upload option and branch-filtered review listing added.'
  usage:
    - >
      Practitioners run `git review` to upload the working branch to Gerrit, use options
      for target branch, topic, reviewers, and CCs, and use `git review -d` to download
      changes or patchsets for local review. On first run, it can read `.gitreview`,
      create the Gerrit remote, and install the commit-msg hook used for Change-Id
      generation.
related-packages: []
tags:
