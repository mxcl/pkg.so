history:
  adoption-history:
    - >
      SoqlXplorer became a long-lived native macOS utility for Salesforce developers who
      wanted a graphical alternative to browser tools and Windows-oriented clients. Its
      continued maintenance followed changes in Salesforce APIs, macOS requirements,
      authentication, and developer workflows.
    - >
      The application adopted browser-based OAuth in 2021, improving compatibility with
      single sign-on and multi-factor authentication.
  package-nerd-significance:
    - >
      SoqlXplorer is a focused example of a durable, platform-native developer tool
      built around a hosted proprietary API. It combines query editing, schema
      discovery, data inspection, mutation, CSV export, and anonymous Apex execution
      without requiring a full integrated development environment.
    - >
      Its open-source Objective-C codebase also preserves a substantial history of
      native macOS Salesforce tooling and SOAP API integration.
  project-history:
    - >
      Simon Fell created SoqlX around 2005 after moving from Windows to macOS and
      missing Dave Carroll's Salesforce Explorer utility. The original Explorer exposed
      Salesforce tables and columns and executed SOQL queries; SoqlX brought a similar
      workflow to macOS.
    - >
      The project later gained syntax highlighting, completion for SOQL and SOSL, schema
      visualization, data editing, anonymous Apex execution, OAuth login, and support
      for newer Salesforce API generations.
  related-projects:
    - Salesforce Explorer
    - Salesforce
    - SOQL
    - SOSL
    - Apex
  sources:
    - https://github.com/superfell/SoqlX
    - https://www.pocketsoap.com/osx/soqlx/
  summary:
    - >
      SoqlXplorer, also called SoqlX, is an open-source macOS client for Salesforce
      developers. It provides SOQL and SOSL querying, schema exploration, data editing,
      CSV export, and anonymous Apex execution.
  timeline:
    - >
      Circa 2005: Simon Fell began SoqlX as a macOS counterpart to Dave Carroll's
      Salesforce Explorer.
    - '2021: The 4.0 generation added redesigned SOQL and SOSL highlighting and completion.'
    - "2021: Version 4.2 moved login to Salesforce's browser-based OAuth flow."
    - >
      2023: Version 4.6 updated the maintained macOS application and corrected SOSL CSV
      export behavior.
  usage:
    - >
      Developers authenticate to a Salesforce organization, browse SObjects and fields,
      construct and execute SOQL or SOSL queries, inspect or edit returned records,
      export results to CSV, generate schema reports, and run anonymous Apex while
      viewing debug output.
