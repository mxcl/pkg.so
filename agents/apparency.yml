history:
  adoption-history:
    - >
      Apparency occupies a specialist niche among Mac developers, administrators, and
      security-conscious users who need a graphical view of information otherwise
      obtained through several command-line tools.
    - >
      Successive releases followed changes in the Mac platform, adding or refining
      inspection of notarization, hardened runtime, entitlements, nested components,
      Apple Silicon executables, application extensions, and newer macOS security
      behavior.
  package-nerd-significance:
    - >
      Apparency exposes properties package maintainers commonly inspect when evaluating
      macOS software: bundle identifiers, executable architectures, code-signing
      identities, designated requirements, notarization, entitlements, Gatekeeper
      assessment, linked frameworks, and nested code.
    - >
      It is especially useful when validating downloaded application bundles or
      investigating why a cask behaves differently across Mac hardware or macOS
      releases.
  project-history:
    - >
      Mother's Ruin Software released Apparency 1.0 on June 27, 2020. It was designed as
      an application that opens and explains macOS application bundles, concentrating on
      their internal structure and security properties.
    - >
      The project subsequently gained folder browsing, broader executable inspection,
      improved Quick Look support, deeper component searches, and adaptations for
      successive macOS releases.
  related-projects:
    - >
      Mother's Ruin Software also develops Suspicious Package, which inspects macOS
      installer packages rather than application bundles.
    - >
      Apparency presents information associated with Apple's codesign and spctl tools,
      Gatekeeper, notarization, the hardened runtime, application entitlements, and
      Mach-O executables.
  sources:
    - https://www.mothersruin.com/software/Apparency/
    - https://www.mothersruin.com/software/Apparency/faq.html
    - https://www.mothersruin.com/software/Apparency/relnotes.html
    - https://www.mothersruin.com/software/Apparency/use.html
  summary:
    - >
      Apparency is a macOS application-bundle inspection utility that presents metadata,
      nested components, executable details, code signatures, notarization,
      entitlements, and Gatekeeper results.
  timeline:
    - '2020: Apparency 1.0 was released.'
    - '2021: The application added refinements for newer signing and Apple Silicon behavior.'
    - '2025: Version 3.1 expanded system-application and executable inspection.'
    - '2026: Version 3.3 added macOS 26 appearance and shared-cache handling improvements.'
  usage:
    - >
      Users open an application or folder in Apparency through its Open command, drag
      and drop, Finder services, or Open With. They can browse bundle components and
      inspect Info.plist data, executable properties, signatures, notarization,
      entitlements, frameworks, and Gatekeeper-related status.
