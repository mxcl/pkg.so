history:
  adoption-history:
    - >
      Trend Micro distributes Cleaner One Pro directly for macOS and Windows, with
      Homebrew Cask providing an additional package-managed installation route for Mac
      users. The commercial edition uses device- and term-based subscriptions.
  package-nerd-significance:
    - >
      Cleaner One Pro represents the commercial GUI side of the macOS system-cleaner
      ecosystem. Its Homebrew cask is useful to package-manager users who want
      reproducible installation and upgrades for a traditionally direct-download desktop
      utility.
  project-history:
    - >
      Cleaner One Pro is Trend Micro's consumer disk-cleaning and system-maintenance
      application, succeeding earlier Cleaner One branding and editions. By 2020, Trend
      Micro documented its combined menu-bar optimizer and main system-management
      console.
    - >
      The product developed into a cross-platform Mac and Windows offering centered on
      storage visualization, junk removal, application management, diagnostics, and
      one-click maintenance.
  related-projects:
    - Cleaner One is the product family and support-center name used by Trend Micro.
    - >
      Trend Micro's broader consumer-security portfolio shares the same vendor and
      support infrastructure.
  sources:
    - >
      Official Trend Micro product article:
      https://news.trendmicro.com/2020/07/09/cleaner-one-pro-speeds-up-your-mac-part-1-2/
    - >
