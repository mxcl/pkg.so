      https://helpcenter.trendmicro.com/en-us/product-support/cleaner-one/
    - source_facts.provenance
  summary:
    - >
      Cleaner One Pro is Trend Micro's commercial system-cleaning and storage-management
      application for macOS and Windows. It combines storage visualization, junk-file
      removal, application management, and system-health tools.
  timeline:
    - >
      2020: Trend Micro documented Cleaner One Pro's Quick Optimizer, cleaning tools,
      application management, and privacy features.
    - >
      2026: Version 6.7.7 was distributed by the Homebrew cask represented in the input
      record.
  usage:
    - >
      Users run Smart Scan for a combined view of storage, system health, and unused
      applications, then review recommended cleaning and optimization actions.
    - >
      On macOS, the menu-bar Quick Optimizer exposes memory and junk-file actions, while
      the main console provides detailed storage and application management.
