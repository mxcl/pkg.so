history:
  adoption-history:
    - >
      Forel is available as signed, notarized macOS disk images and through both the
      project's Homebrew tap and the main Homebrew Cask catalog. Universal builds
      broadened availability across Apple Silicon and Intel Macs.
    - >
      The project positions itself as a privacy-focused, community-driven, open-source
      alternative to Hazel, addressing an established Mac automation workflow with a
      freely inspectable implementation.
  package-nerd-significance:
    - >
      Forel matters to Mac package users as an open-source entrant in the traditionally
      proprietary folder-automation niche. It packages a native Swift application,
      embedded SQLite persistence, FSEvents-based watching, and an automatic updater
      into a conventional menu-bar utility.
    - >
      Its Homebrew distribution, source-build instructions, signed universal releases,
      and local-only operation make it straightforward to install, audit, and automate
      without a service account.
  project-history:
    - >
      Forel was developed as a native, on-device macOS folder-automation application.
      Its rule engine watches selected directories, matches files by metadata or
      contents, and executes actions such as moving, copying, renaming, tagging,
      trashing, running scripts, or invoking Shortcuts.
    - >
      Version 1.0.0 marked the project's exit from beta. The initial stable series
      rapidly added OCR-based content matching, native-library imports, archive
      extraction, stronger rule validation, notifications, universal binaries, and
      improved watcher reliability.
  related-projects:
    - >
      Hazel is the proprietary Mac utility Forel explicitly identifies as its main point
      of comparison.
    - >
      Forel integrates with macOS facilities including FSEvents, Finder tags and labels,
      Vision OCR, Shortcuts, and the Music, Photos, and TV libraries.
  sources:
    - Homebrew adoption is supplied by source_facts.package-manager["brew-cask"].
    - 'Official project site: https://forel-app.github.io/'
    - 'Official release history: https://github.com/lab421/forel/releases'
    - 'Official repository README: https://github.com/lab421/forel#readme'
  summary:
    - >
      Forel is an open-source, privacy-focused macOS application that watches folders
      and applies user-defined rules to matching files. It is designed as an on-device
      alternative to Hazel.
  timeline:
    - "2026-06-20: Version 1.0.0 marked Forel's transition out of beta."
    - >
      2026: The 1.0 series added OCR, native-library import, archive extraction,
      notifications, broader macOS support, and universal binaries.
  usage:
    - >
      Users add one or more watched folders, create ordered conditions based on
      filename, extension, kind, size, date, tags, labels, or extracted contents, and
      attach file actions. Rules can run automatically, manually, or in a dry-run
      preview.
    - >
      Forel runs from the macOS menu bar, processes data on-device, records activity for
      review and undo, and can call scripts or Shortcuts for workflows beyond its
      built-in actions.
