history:
  adoption-history:
    - >
      The README documents Homebrew installation for macOS and an AUR package for Arch
      users, which is the main official adoption signal for this intentionally tiny
      tool.
  package-nerd-significance:
    - >
      Emojify is package-manager candy: one shell script, one executable, and a very
      visible terminal effect. It represents the class of tiny Unix filters that are too
      small to feel like infrastructure but pleasant enough to keep packaged.
  project-history:
    - >
      The official README frames Emojify as a shell script rather than a compiled
      application, emphasizing easy placement on a user's PATH and simple use in
      pipelines.
  related-projects:
    - The README points to `pyemojify`, a Python port, as a related implementation.
  sources:
    - https://github.com/mrowa44/emojify
  summary:
    - >
      Emojify is a small command-line text filter that replaces GitHub-style emoji
      aliases with Unicode emoji characters.
  usage:
    - >
      Users pass text to `emojify` directly or pipe existing command output through it.
      The README highlights a terminal-culture use case: piping `git log --oneline
      --color` through `emojify` and `less -r`, with an optional `.gitconfig` alias.
