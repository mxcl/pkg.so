id: brew:is-fast
display-name: is-fast
repo: null
docs:
  - https://github.com/Magic-JD/is-fast#readme
config-file-location:
  linux:
    - ~/.config/is-fast/config.toml
  macos:
    - ~/Library/Application Support/is-fast/config.toml
  windows:
    - '%APPDATA%\is-fast\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The input metadata shows package-manager adoption in Homebrew and Nix. That is
      meaningful for a small CLI because it lets users install a browser-adjacent
      terminal search tool without building the Rust project manually.
  package-nerd-significance:
    - >
      For package collections, is-fast is a neat example of the newer wave of Rust TUIs
      that wrap web workflows in terminal UX. Its significance is mostly packaging
      convenience and CLI ergonomics rather than a broad ecosystem role.
  project-history:
    - >
      The public GitHub repository was created on 2025-02-24. Homebrew packages it from
      tagged GitHub archives, and the formula metadata describes the package as a way to
      check the internet as fast as possible.
    - >
      The release feed shows a compact 0.x series during 2025, including v0.17.x
      releases. The project is therefore best treated as a young terminal-search utility
      rather than as a long-lived network client with a deep historical record.
  related-projects:
    - >
      is-fast is adjacent to terminal browsers, web-search CLIs, Rust TUI applications,
      and command-line tools that render web or HTML content without launching a
      graphical browser.
  sources:
    - >
      GitHub repository and release metadata provide the public project and 0.x release
      chronology.
    - Homebrew formula metadata documents package-manager distribution.
    - >
      The official README documents purpose, usage, terminal UI behavior, configuration
      features, and Rust build requirements.
  summary:
    - >
      is-fast is a small Rust terminal application for quick web searching and page
      viewing from a text interface. Its README describes a TUI workflow for searching
      the internet, navigating results, viewing content, opening URLs, rendering local
      HTML, tracking history, and customizing styling and extraction behavior.
  timeline:
    - '2025: Public GitHub repository created.'
    - '2025: 0.17.x release tags published on GitHub.'
    - '2025: Homebrew formula packages the tagged Rust CLI release.'
  usage:
    - >
      The README documents direct query usage such as `is-fast "search query"` or
      `is-fast search query`, then browsing results and rendered content inside the
      terminal.
related-packages:
  - id: brew:ddgr
    reason: >
      Choose ddgr for a lightweight, script-friendly DuckDuckGo command-line interface
      with JSON output and browser integration; choose is-fast when you want an
      interactive TUI that can render and navigate result pages inside the terminal.
    rel: alternative
    sources:
      - https://github.com/Magic-JD/is-fast#readme
      - https://github.com/jarun/ddgr#readme
