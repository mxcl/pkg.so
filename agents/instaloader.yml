id: brew:instaloader
display-name: Instaloader
repo: https://github.com/instaloader/instaloader
docs:
  - https://instaloader.github.io/
config-file-location: null
credentials-file-location:
  unix:
    - ~/.config/instaloader/session-YOUR-USERNAME
history:
  adoption-history:
    - >
      Instaloader's package-manager reach is broad for a Python CLI. The input metadata
      records Homebrew, Debian, Ubuntu, Nix, and Winget packages, while the official
      docs recommend pip and also point to AUR, standalone Windows executables, source
      downloads, pre-release installs, and Termux on Android.
    - >
      Homebrew packages Instaloader from PyPI, and the formula records notable
      installation activity. The GitHub repository has a large user-facing footprint for
      this batch, with thousands of stars and a documentation site aimed at both CLI
      users and library users.
  package-nerd-significance:
    - >
      Instaloader is significant because it sits at the intersection of Python
      packaging, social-media scraping, local backup workflows, credential/session
      storage, and fast-moving upstream web behavior. It is also packaged across both
      language and OS package managers.
    - >
      For package maintainers, it is a useful example of a CLI whose binary behavior
      depends on web-service policy, authentication state, rate limits, and user data
      layout rather than only on local dependencies.
  project-history:
    - >
      The GitHub repository was created in 2016, and PyPI records the first published
      package line in 2016. The official documentation describes Instaloader as free
      open-source Python software for downloading Instagram media and metadata.
    - >
      The project evolved from profile downloads into a broader archival tool. The docs
      list support for public and private profiles, hashtags, stories, highlights,
      tagged posts, reels, IGTV, feed and saved targets, profile-name-change detection,
      resumable interrupted downloads, customizable filters, and use as a Python module.
    - >
      The release stream continued through the 4.x series, with the documentation site
      linking to tagged releases and PyPI distributing a large release history. This
      matters because Instagram scraping tools often have to react to platform-side
      changes and authentication/rate-limit behavior.
  related-projects:
    - >
      Instaloader is related to PyPI, Homebrew, Debian/Ubuntu/Nix/Winget packaging, AUR,
      Termux, Python web scraping libraries, Instagram archival scripts, and older or
      alternative tools such as InstaLooter.
  sources:
    - https://formulae.brew.sh/api/formula/instaloader.json
    - https://github.com/instaloader/instaloader
    - https://instaloader.github.io/
    - https://pypi.org/pypi/instaloader/json
  summary:
    - >
      Instaloader is a Python command-line and library tool for downloading Instagram
      photos, videos, captions, comments, geotags, stories, feeds, saved media, and
      related metadata. It is one of the more widely packaged Instagram media archiving
      tools in Unix-like package managers.
  timeline:
    - '2016: GitHub repository created and Instaloader appears on PyPI.'
    - >
      2020s: Documentation covers profile, hashtag, story, feed, saved-media, metadata,
      cron, and Python-module workflows.
    - '2024: v4.14 release line published.'
    - '2026: v4.15.1 release published and packaged by Homebrew.'
  usage:
    - >
      The basic documented workflow is instaloader profile, with options for fast
      incremental updates and timestamp-based archive updates. Login enables private
      profile, stories, feed, saved, and other authenticated targets, and the docs
      describe reusable session-cookie storage for non-interactive runs.
    - >
      The docs also cover post filtering, filename templates, metadata text and JSON
      files, exit codes, cron-style operation, Python API usage, and troubleshooting for
      rate limits and login errors, which makes the package more of an archival toolkit
      than a one-command downloader.
related-packages: []
