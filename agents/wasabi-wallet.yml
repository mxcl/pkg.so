history:
  adoption-history:
    - >
      Wasabi became a notable specialist wallet among privacy-conscious Bitcoin users by
      combining non-custodial key management with built-in CoinJoin workflows. Its
      open-source implementation also made it inspectable by users who prefer verifiable
      wallet software.
    - >
      The project marked its early releases on dates important to Bitcoin culture: the
      first 1.0 beta appeared on the first anniversary of UASF, and version 1.0 appeared
      on the tenth anniversary of the Bitcoin white paper.
  package-nerd-significance:
    - >
      Wasabi is important to package and security enthusiasts because it packages
      Bitcoin wallet management, Tor-mediated networking, coin control, and
      CoinJoin-oriented privacy into a cross-platform desktop client.
    - >
      Its wallet JSON files contain encrypted key material and extensive public-key,
      label, and transaction metadata. That makes filesystem backup practices and
      protection of both the wallet file and its separate BIP39 passphrase especially
      important.
  project-history:
    - >
      Ádám Ficsor and collaborators began work on the privacy-oriented Hidden Wallet in
      December 2015. Wasabi was subsequently rewritten and presented under its present
      name at the 2018 Building on Bitcoin conference.
    - >
      Wasabi 2.0 reached testnet in March 2022 and production in June 2022. zkSNACKs
      shut down its CoinJoin coordinator on June 1, 2024, an important change in the
      project's service history, while the wallet remained open-source software.
  related-projects:
    - Hidden Wallet was Wasabi's direct precursor.
    - >
      Wasabi operates in the Bitcoin ecosystem and uses CoinJoin techniques to improve
      transaction privacy.
  sources:
    - https://docs.wasabiwallet.io/FAQ/FAQ-Introduction.html
    - https://docs.wasabiwallet.io/FAQ/FAQ-UseWasabi.html
    - https://docs.wasabiwallet.io/using-wasabi/StartupParameters.html
  summary:
    - >
      Wasabi Wallet is an open-source, non-custodial desktop Bitcoin wallet built around
      financial privacy. It protects network-level metadata and supports
      CoinJoin-oriented transaction workflows while leaving control of private keys with
      the user.
  timeline:
    - '2015: Development began on the precursor project, Hidden Wallet.'
    - '2018-08-01: Wasabi Wallet 1.0 beta was released.'
    - '2018-10-31: Wasabi Wallet 1.0 was released.'
    - '2022-03-01: Wasabi Wallet 2.0 reached testnet.'
    - '2022-06-15: Wasabi Wallet 2.0 was released.'
    - '2024-06-01: The zkSNACKs CoinJoin coordinator was shut down.'
  usage:
    - >
      Users create or restore Bitcoin wallets, receive and send bitcoin, manage
      individual coins, and inspect ordinary and CoinJoin transactions from the desktop
      interface.
    - >
      The application's data directory contains configuration, logs, and per-wallet JSON
      files. The official documentation recommends backing up wallet files when users
      want to preserve labels and privacy metadata, while separately safeguarding the
      recovery words and passphrase.
    - >
      Most settings are managed through the graphical interface. Advanced users can use
      startup arguments, environment variables, configuration files, a daemon mode, and
      an RPC server.
