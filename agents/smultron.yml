history:
  adoption-history:
    - >
      Smultron is distributed both through the Mac App Store and directly through the
      Smultron Store. The official site targets beginners and experts, emphasizes
      accessibility, and lists broad interface localization.
  package-nerd-significance:
    - >
      For Mac package users, Smultron is a long-running native editor that occupies the
      space between a minimal writing application and a programming editor. Its
      direct-store and sandboxed Mac App Store editions also illustrate how distribution
      channel affects filesystem access and application state on macOS.
  project-history:
    - >
      Smultron has progressed through numerous macOS-specific generations. The official
      compatibility table retains versions 7 through 14 for different macOS releases,
      while current development continues to add syntax support, editing tools,
      accessibility improvements, and operating-system integration.
  related-projects:
    - Smultron is one of the macOS utilities published by Peter Borg Apps.
  sources:
    - 'Official Peter Borg Apps support page: https://www.peterborgapps.com/support/'
    - >
      Official Smultron product page, manual, FAQ, and release notes:
      https://www.peterborgapps.com/smultron/
  summary:
    - >
      Smultron is a native macOS text and code editor from Peter Borg Apps, designed for
      both quick writing and larger programming projects.
  timeline:
    - >
      Smultron 7–14: Official compatibility documentation records successive generations
      tracking macOS releases from Yosemite through Sonoma and later.
    - >
      Smultron 14: Introduced a modernized sidebar interface, inspector, bookmarks,
      notes, broader syntax support, and Sonoma optimization.
  usage:
    - >
      Smultron is used to edit plain text and source code, organize files and folders,
      compare text, search with regular expressions, preview content, run commands, and
      apply language-aware syntax coloring. It can also be launched from a shell with
      macOS's `open -a` command.
