history:
  adoption-history:
    - >
      Launchpad Manager served Mac users who wanted bulk controls that Apple's Launchpad
      did not provide, including alphabetical sorting, group operations, layout backup
      and restoration, and removing icons without uninstalling applications.
    - >
      The developer now marks the original application as no longer updated and limited
      to macOS Sequoia and earlier. The official site directs users of newer systems to
      AppGrid, described as its rebuilt successor for macOS Tahoe.
  package-nerd-significance:
    - >
      Launchpad Manager is an example of a narrowly focused Mac utility built around
      manipulating system-managed desktop state that Apple did not publicly document.
    - >
      Its retirement after the removal of Launchpad illustrates the maintenance risk
      faced by packages that depend on undocumented operating-system databases and
      behaviors.
  project-history:
    - >
      Developer Attila Miklosi created Launchpad Manager to reorganize Apple's Launchpad
      beyond its built-in controls. It was offered in Free and Pro editions with
      additional operations such as groups, page movement, and saved layouts.
    - >
      Following Apple's removal of Launchpad in macOS Tahoe, the developer ended updates
      for Launchpad Manager and introduced AppGrid as a replacement retaining its
      principal organization features.
  related-projects:
    - Apple Launchpad
    - AppGrid, the developer's successor for macOS Tahoe and later
  sources:
    - https://launchpadmanager.com/
    - https://launchpadmanager.com/faq.php
    - https://launchpadmanager.com/features.php
    - https://launchpadmanager.com/help.php
  summary:
    - >
      Launchpad Manager is a legacy macOS utility for deleting, renaming, moving,
      grouping, sorting, saving, and restoring items in Apple's Launchpad layout.
  timeline:
    - '2012 era: Official compatibility guidance covered OS X Mountain Lion.'
    - '2025: The macOS Tahoe generation removed Launchpad.'
    - 'Tahoe era: The developer retired Launchpad Manager and directed users to AppGrid.'
  usage:
    - >
      Users select Launchpad icons or groups, perform operations such as delete, rename,
      cut, paste, group, reorder, or move, and then apply the changes. Deleting an icon
      does not uninstall the underlying application.
    - >
      Pro users can save a Launchpad layout to a file and restore it later. The official
      FAQ warns that Apple's undocumented Launchpad behavior may regenerate the database
      or make layouts unreliable across different computers.
