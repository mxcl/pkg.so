history:
  adoption-history:
    - >
      Polymail joined Y Combinator's Spring 2016 batch and gained early use among
      founders, operators, and teams. Its official history says it passed 10,000 active
      users by 2019.
    - >
      Leadership changed in 2022 with an emphasis on stability and continuity. A 2025
      acquisition began a new phase focused on rebuilding core workflows and introducing
      AI-assisted features while retaining the product's established productivity model.
  package-nerd-significance:
    - >
      Polymail is representative of subscription-backed email clients whose desktop
      package is only one part of a hosted synchronization, tracking, scheduling, and
      collaboration service.
    - >
      Its packaging matters to desktop users, but account authentication, message
      indexing, delayed actions, notifications, and team features depend on Polymail's
      online infrastructure rather than purely local state.
  project-history:
    - >
      Brandon Foo, Shahan Khan, and Brandon Shin founded Polymail as a modern power
      inbox. The product emerged publicly in 2016 with read tracking, snoozing, shared
      thread context, and a streamlined multi-account interface.
    - >
      Over time Polymail added templates, reminders, contact context, scheduling, team
      collaboration, outreach features, and clients for desktop and iOS. The company
      describes its current direction as an operator-focused, AI-aware email platform.
  related-projects:
    - >
      Polymail connects to services including Gmail, Google Workspace, Outlook,
      Microsoft 365, iCloud, and generic IMAP providers.
    - Its calendar and meeting workflows integrate email with scheduling and follow-up tasks.
  sources:
    - https://help.polymail.io/
    - https://help.polymail.io/help/how-to-manage-your-inbox-in-polymail
    - https://help.polymail.io/help/your-emails-and-data-in-polymail
    - https://polymail.io/about-us
  summary:
    - >
      Polymail is a hosted email productivity client for individuals and teams,
      combining a unified inbox with tracking, snoozing, scheduling, templates, and
      collaboration workflows.
  timeline:
    - "2016: Polymail emerged publicly and joined Y Combinator's Spring batch."
    - '2019: Polymail reported more than 10,000 active users.'
    - '2022: Leadership transitioned with a focus on product stability and continuity.'
    - >
      2025: Polymail entered a new ownership phase centered on rebuilding and
      AI-assisted workflows.
  usage:
    - >
      Users connect one or more email accounts, manage them through a unified inbox,
      archive or snooze conversations, schedule messages, track engagement, and use
      templates or reminders.
    - >
      Teams can share conversation context and use administrative and collaboration
      features. Authentication normally uses provider-issued OAuth tokens;
      password-based IMAP accounts are handled through the hosted service.
