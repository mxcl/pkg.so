history:
  adoption-history:
    - >
      goshs is packaged for Homebrew and is also advertised by the project for
      Kali/Parrot, Arch AUR, BlackArch, Alpine, Snap, Fedora/RHEL COPR, openSUSE,
      Nix/NixOS, Scoop, winget, Chocolatey, Docker, Go install, and GitHub Releases.
      That spread matches a tool meant to be dropped quickly onto operator workstations,
      lab VMs, and disposable engagement environments.
  package-nerd-significance:
    - >
      Package maintainers care about goshs because it is a feature-dense single binary
      with a Go module path, release artifacts, shell completions, container images, and
      many optional behaviors hidden behind flags rather than separate services. It also
      carries security-sensitive behavior, so packaging and upgrade cadence matter more
      than for a plain static file server.
  project-history:
    - >
      The project grew from the familiar local-file-server niche into a
      penetration-testing utility. The README explicitly credits updog as inspiration,
      which places goshs in the lineage of small engagement-friendly servers that trade
      web-server configuration for a single command.
    - >
      The 2.x documentation and release notes show a broadening scope: v2.0.0 emphasized
      SMB, DNS, SMTP, redirects, ACLs, and share links; later 2.1 releases added a TUI,
      self-destruct timers, payload templating, range downloads, TFTP, and reverse-shell
      payload generation. The project also moved to the goshs-labs GitHub organization
      during the v2.1.0 line.
  related-projects:
    - updog is credited by goshs as project inspiration.
    - Python's SimpleHTTPServer/http.server is the baseline goshs positions itself beyond.
    - >
      ConPtyShell appears in goshs release notes as an on-demand helper for Windows
      shell upgrades.
  sources:
    - https://docs.goshs.de/
    - https://formulae.brew.sh/formula/goshs
    - https://github.com/advisories/GHSA-rwj2-w85g-5cmm
    - https://github.com/goshs-labs/goshs
    - https://github.com/goshs-labs/goshs/releases.atom
  summary:
    - >
      goshs is a Go single-binary file server aimed at situations where Python's
      SimpleHTTPServer style sharing is too limited. Its project materials frame it for
      red-team, pentest, CTF, and quick file-transfer workflows, combining HTTP/S with
      protocols and security-oriented helpers such as WebDAV, FTP/SFTP, SMB, LDAP/S, DNS
      and SMTP callbacks, NTLM hash capture, share links, authentication, and a terminal
      dashboard.
  timeline:
    - >
      2025: Security advisory GHSA-rwj2-w85g-5cmm documents a command-execution exposure
      tested against goshs 1.0.4 and notes the command feature was introduced in 0.3.4.
    - >
      2026-05: v2.1.0 release notes record the move to github.com/goshs-labs/goshs and
      several security fixes.
    - >
      2026-06: 2.1 releases add a TUI, TTL shutdown, payload templating, resumable
      downloads, TFTP, reverse-shell payload generation, and packaging/CI updates.
  usage:
    - >
      Typical usage starts a web server for the working directory, then enables only the
      pieces needed for a task: HTTPS and basic auth for protected sharing, SMB or LDAP
      for credential and hash capture, DNS/SMTP callbacks for interaction tracking,
      WebDAV/FTP/SFTP/TFTP for protocol-specific transfer, TTL for temporary servers, or
      the TUI for SSH sessions without a browser.
related-packages:
  - id: brew:filebrowser
    reason: >
      Choose File Browser when the main need is a persistent browser-based file manager
      with users and a database; choose goshs for temporary multi-protocol transfer and
      security-testing workflows.
    rel: alternative
    sources:
      - https://docs.goshs.de/
      - https://github.com/filebrowser/filebrowser
      - https://filebrowser.org/
  - id: brew:darkhttpd
    reason: >
      Choose darkhttpd when a tiny command-line-only static HTTP server is sufficient
      and goshs's uploads, authentication, transfer protocols, and red-team features are
      unnecessary.
    rel: alternative
    sources:
      - https://docs.goshs.de/
      - https://unix4lyfe.org/darkhttpd/
      - https://github.com/emikulic/darkhttpd
