history:
  adoption-history:
    - >
      BYACC became popular because it was fast, BSD/public-domain-friendly, and
      yacc-compatible. The official page quotes John Levine's later account that
      Corbett's implementation was faster than AT&T yacc and quickly became the most
      popular yacc variant.
    - >
      The official related-links section points to Debian packages, FreeBSD and NetBSD
      sources or package collections, and notes that FreeBSD imported this maintained
      version into its vendor tree in 2012. The supplied package facts show broad
      packaging across Homebrew, Alpine, Debian, Fedora, MacPorts, Nix, Pacman, Scoop,
      Ubuntu, and zypper.
  package-nerd-significance:
    - >
      byacc is package-nerd significant because it is one of the classic parser
      generators that still matters in modern ports trees. It is tiny but strategically
      important: swapping yacc implementations can change generated C, expose build
      assumptions, or avoid a dependency on GNU bison.
    - >
      Its public-domain status and generated-parser licensing are part of why it
      persists in base systems, embedded build environments, and conservative packaging
      stacks.
  project-history:
    - >
      Thomas E. Dickey's official BYACC page says Robert Corbett wrote byacc around 1990
      and notes Corbett was also the original author of bison. The page cites its
      compatibility with original yacc and records that Dickey later converted the
      original K&R C source to ANSI C and continued maintaining it.
    - >
      The original README, preserved in the maintained source tree, states that Berkeley
      Yacc accepts input conforming to AT&T yacc documentation, is distributed in the
      public domain, and allows generated parsers to be distributed freely.
  related-projects:
    - AT&T yacc is the compatibility baseline.
    - GNU bison is the major alternative yacc-family parser generator.
    - >
      Perl-Byacc, BYACC/J, and BtYacc are related derivatives or extensions named by the
      official related-links section.
    - flex and lex are commonly paired lexical-scanner tools in yacc-based workflows.
  sources:
    - https://github.com/ThomasDickey/byacc-snapshots
    - https://invisible-island.net/byacc/CHANGES
    - https://invisible-island.net/byacc/byacc.html
    - source_facts.package-manager
  summary:
    - >
      Berkeley Yacc, usually packaged as byacc, is a public-domain yacc-compatible
      LALR(1) parser generator. It is valued as a small, portable yacc implementation
      that avoids the heavier dependencies and dialect assumptions of some alternatives.
  timeline:
    - >
      1990: Robert Corbett writes Berkeley Yacc around this period, according to the
      official history page.
    - >
      1992: O'Reilly's Lex & Yacc notes byacc compatibility with original yacc, as
      summarized by the official page.
    - '2000: Thomas E. Dickey begins ANSI C portability work while porting software to VMS.'
    - '2005: Dickey notes reviewing FreeBSD versus bison YYPARSE_PARAM compatibility.'
    - >
      2012: FreeBSD imports Dickey's maintained version into its vendor tree, according
      to the official related-links section.
    - '2026: The official CHANGES file shows continuing maintenance.'
  usage:
    - >
      byacc is used as a yacc replacement in build systems and compiler-toolchain work:
      it reads a grammar and emits C parser source. It is often chosen when projects
      want yacc compatibility, small generated output, permissive/public-domain
      licensing, and portability to non-GCC or older C environments.
related-packages:
  - id: brew:bison
    reason: >
      Choose GNU Bison when you need its broader grammar-language features and
      multi-language output; choose BYACC for a smaller, highly portable implementation
      closely focused on traditional yacc compatibility.
    rel: alternative
    sources:
      - https://invisible-island.net/byacc/
      - https://www.gnu.org/software/bison/
  - id: brew:flex
    reason: >
      flex generates lexical scanners that feed tokens to yacc-style parsers, making it
      the conventional companion to a BYACC-generated parser.
    rel: adjacent_workflow
    sources:
      - https://invisible-island.net/byacc/manpage/yacc.html
      - https://westes.github.io/flex/manual/
