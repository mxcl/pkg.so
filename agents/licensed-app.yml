history:
  adoption-history:
    - >
      Licensed remained a deliberately small, Mac-only utility. In 2014 its author
      observed that license-code management was becoming less relevant as distribution
      shifted toward mechanisms such as the Mac App Store, and planned only an export
      facility before ending support.
    - >
      After a fourteen-year gap, the developer modernized the application in 2022 so
      long-time users could run it on newer macOS releases and export their records. A
      small Dark Mode fix followed in 2023.
  package-nerd-significance:
    - >
      Licensed captures an older shareware and independently distributed Mac-software
      culture in which users accumulated product names, owners, email addresses, and
      license codes. Its later CSV export acknowledges the move away from dedicated
      local license-code databases and helps users avoid lock-in.
  project-history:
    - >
      Amar Sagoo introduced Licensed in 2006 as a narrowly focused place to record
      software licenses. The application emphasized quick entry and lookup rather than
      broader asset or subscription management.
    - >
      Development became largely dormant after its early releases. Licensed 1.5 revived
      the application in 2022 for modern macOS versions and added CSV export and a
      command to reveal the local data file for manual backup.
  related-projects:
    - >
      The developer discussed Licensed alongside Tofu, another long-lived free Mac
      application that was revived after an extended maintenance gap.
  sources:
    - 'Official 2006 developer archive: https://blog.amarsagoo.info/2006/'
    - 'Official 2014 status post: https://blog.amarsagoo.info/2014/01/5-years-later.html'
    - 'Official 2023 developer archive: https://blog.amarsagoo.info/2023/'
    - >
      Official Licensed 1.5 announcement:
      https://blog.amarsagoo.info/2022/11/licensed-15-and-tofu-news.html
  summary:
    - >
      Licensed is a free, single-purpose macOS application by Amar Sagoo for storing and
      looking up software-license details locally.
  timeline:
    - '2006: Amar Sagoo introduced Licensed.'
    - >
      2014: The developer announced that no major improvements were planned, while
      proposing an export feature.
    - >
      2022: Licensed 1.5 restored compatibility with modern macOS and added CSV export
      and easier manual backup.
    - '2023: Licensed 1.5.1 fixed Notes-field legibility in Dark Mode.'
  usage:
    - >
      Users record software-license details in a searchable local database. Licensed 1.5
      can export records as comma-separated data for use in spreadsheets or other tools
      and can reveal its data file in Finder for manual backup.
