history:
  adoption-history:
    - >
      Thorium targets general readers, library patrons, students, and people with print
      disabilities. EDRLab distributes it across desktop platforms and positions it as a
      reference application for EPUB 3, Readium LCP, and accessible digital reading.
  package-nerd-significance:
    - >
      Thorium is a visible end-user application built on the Readium Desktop toolkit,
      making it useful both as a reader and as a real-world demonstration of open
      publishing standards. Its combination of EPUB 3, OPDS, DAISY, audiobooks,
      accessibility tooling, and vendor-neutral LCP support is unusually broad for a
      desktop package.
  project-history:
    - >
      EDRLab developed Thorium to fill a gap for a modern, accessible, cross-platform
      EPUB 3 reader with OPDS browsing and Readium LCP support. It was presented in 2019
      as the first Readium Desktop application and subsequently expanded its formats,
      localization, text-to-speech, and accessibility capabilities.
  related-projects:
    - Readium Desktop
    - Readium Mobile
    - Readium LCP
    - EPUB 3
    - OPDS
  sources:
    - https://github.com/edrlab/thorium-reader — official source repository
    - https://www.edrlab.org/2021/06/21/thorium-reader-1-7-1/ — official development milestone
    - >
      https://www.edrlab.org/events/dpub-summit-2019/dps-program/ — official 2019
      presentation program
    - >
      https://www.edrlab.org/software/thorium-reader/ — official rationale, features,
      and technology
  summary:
    - >
      Thorium Reader is EDRLab’s free, open-source, multilingual reading application. It
      supports EPUB, PDF, DAISY, audiobooks, comics and manga, OPDS catalogs,
      accessibility features, and Readium LCP-protected publications.
  timeline:
    - '2019: Presented publicly as the first Readium Desktop application'
    - '2021: Expanded localization, text-to-speech, format support, and its internal database'
    - '2025: Localization work moved to the project’s Weblate instance'
  usage:
    - >
      Readers import local publications or browse OPDS catalogs, then customize
      typography, spacing, colors, columns, and read-aloud behavior. Library users can
      open Readium LCP loans, while keyboard navigation and screen-reader support serve
      accessible-reading workflows.
