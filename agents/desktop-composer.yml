history:
  adoption-history:
    - >
      Apptorium offered a public beta for several months before the 1.0 release. The
      finished product became available through both direct download and Setapp.
  package-nerd-significance:
    - >
      Desktop Composer packages a broad set of otherwise scattered macOS and application
      appearance controls into reusable profiles. Its Homebrew Cask availability gives
      command-line-oriented Mac users a reproducible installation route for a graphical
      customization tool.
  project-history:
    - >
      Apptorium introduced Desktop Composer as a public beta in October 2025. Beta
      development expanded its profiles beyond wallpapers and system appearance to cover
      Dock behavior, Stage Manager, automation, and themes in development tools and
      other applications.
    - >
      Version 1.0 was released in February 2026 for macOS Tahoe. It adopted a one-time
      purchase model per major version while also being distributed through Setapp.
  related-projects:
    - >
      Apptorium applications supported by its profiles include SideNotes, FiveNotes, and
      ForkLift. It also integrates with Xcode, Terminal, iTerm, Visual Studio Code,
      Alfred, Obsidian, Bear, and NotePlan.
  sources:
    - https://www.apptorium.com/blog/desktop-composer-1.0
    - https://www.apptorium.com/blog/meet-desktop-composer-beta
    - https://www.apptorium.com/desktop-composer
    - source_facts.package-manager
  summary:
    - >
      Desktop Composer is a macOS appearance-profile manager developed by Apptorium. It
      saves coordinated system settings and application themes so users can switch an
      entire working environment at once.
  timeline:
    - '2025-10-15: Public beta announced'
    - '2026-02-04: Desktop Composer 1.0 released'
  usage:
    - >
      Users create profiles containing wallpapers, appearance and accent settings, Dock
      and menu-bar behavior, Stage Manager choices, and themes for supported
      applications. Profiles can be activated manually or through scheduling, Focus
      Filters, Spotlight, Shortcuts, or AppleScript.
    - >
      Profiles remain local to the Mac and may synchronize through the user's private
      iCloud account.
