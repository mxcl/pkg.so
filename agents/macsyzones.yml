history:
  adoption-history:
    - >
      MacsyZones is available by direct download and as a Homebrew cask. The project
      accepts community contributions and has expanded from basic zones into onboarding,
      improved hotkeys, quick snapping, per-screen and per-workspace preferences, grid
      layouts, multi-screen behavior, and extensive customization.
  package-nerd-significance:
    - >
      MacsyZones brings the zone-layout model popularized by Microsoft's FancyZones to
      macOS in an open-source native application. It is especially relevant to
      keyboard-centric and multi-monitor users who want reproducible layouts without
      adopting a tiling window manager.
  project-history:
    - >
      Oğuzhan Eroğlu created MacsyZones as a FancyZones-style window manager for macOS.
      The application lets users design arbitrary layouts, reveal zones while dragging,
      snap and resize windows, select layouts by screen and workspace, and operate a
      keyboard-driven Quick Snapper.
    - >
      Later releases strengthened the hotkey and snapping systems, added onboarding,
      improved multi-monitor operation, and introduced a grid-layout mode alongside
      traditional freeform zones.
  related-projects:
    - >
      Microsoft PowerToys FancyZones is the window-layout concept to which the official
      repository compares MacsyZones.
    - QuakeNotch and GDBFrontend are other projects promoted by the same developer.
  sources:
    - 'Official homepage and usage overview: https://macsyzones.com/'
    - 'Official releases: https://github.com/rohanrhu/MacsyZones/releases'
    - 'Official repository README: https://github.com/rohanrhu/MacsyZones#readme'
    - 'Official user guide: https://macsyzones.com/user-guide/getting-started'
  summary:
    - >
      MacsyZones is an open-source macOS window manager for designing layouts and
      snapping windows into reusable zones. It supports custom and grid layouts,
      keyboard control, multiple displays, and workspace-specific preferences.
  timeline:
    - >
      Version 1.9: Added a redesigned hotkey system, onboarding, Quick Snapper, and
      broader window-management refinements.
    - >
      Version 2.0: Improved snapping of applications with custom window-management
      behavior and expanded layout editing.
    - 'Version 2.2: Added grid layouts alongside traditional zone layouts.'
  usage:
    - >
      Users grant macOS Accessibility permission, create or select a layout, and drag a
      window while holding the configured snap key—Shift by default—to reveal zones.
      Windows can also be placed through right-click snapping, shake gestures, or the
      keyboard-driven Quick Snapper.
