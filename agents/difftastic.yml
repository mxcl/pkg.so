id: brew:difftastic
display-name: Difftastic
repo: null
docs:
  - https://difftastic.wilfred.me.uk/
config-file-location:
  unix:
    - ~/.gitconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      The official installation documentation covers multiple package-manager routes,
      and the README highlights compatibility with Git and other version-control
      systems. The manual provides specific Git aliases, `diff.external`, and `difftool`
      configuration, which made the tool easy to adopt incrementally.
  package-nerd-significance:
    - >
      Difftastic is interesting to package nerds because it packages tree-sitter-backed
      structural comparison as a normal CLI. It lets maintainers review source changes
      in languages where reformatting, delimiters, and nested syntax can obscure the
      real change in a traditional unified diff.
  project-history:
    - >
      The project README defines Difftastic as a syntax-aware diff tool and explicitly
      contrasts it with line-oriented diffing. Its changelog shows rapid development
      from the 0.1 series in 2021 through regular parser, display, Git-integration, and
      performance improvements.
  related-projects:
    - >
      Difftastic is related to traditional `diff`, Git external diff drivers, Git
      difftool integration, and tree-sitter parsers; its README also points users
      interested in AST merging to mergiraf.
  sources:
    - https://github.com/Wilfred/difftastic#readme
    - https://difftastic.wilfred.me.uk/git.html
    - https://github.com/Wilfred/difftastic/blob/master/CHANGELOG.md
  summary:
    - >
      Difftastic is a structural diff tool that compares files using syntax rather than
      only lines, producing human-oriented output for code review and version-control
      workflows.
  timeline:
    - '2021: 0.1 series began, followed by frequent early releases.'
    - >
      2022: Changelog shows continued language, parser, and display expansion through
      the 0.30 series.
    - '2025: 0.63 taught directory diffs to ignore `.git` directories.'
    - '2026: 0.69 released with punctuation-aware syntactic comparison improvements.'
  usage:
    - >
      Difftastic is commonly invoked as `difft` directly or wired into Git so `git
      diff`, `git show`, or `git log -p` can display syntax-aware differences. When
      files are unrecognized or parsing fails, the README documents fallback behavior to
      line-oriented diffing.
related-packages:
  - id: brew:diffutils
    reason: >
      Choose GNU diffutils for portable, conventional line-oriented output and patch
      generation; choose Difftastic when syntax-aware matching is more important than
      standard patch format.
    rel: alternative
    sources:
      - https://difftastic.wilfred.me.uk/introduction
      - https://www.gnu.org/software/diffutils/manual/diffutils.html
  - id: brew:git-delta
    reason: >
      Choose git-delta when you want a feature-rich pager that decorates Git's existing
      unified diffs; choose Difftastic when you want the comparison algorithm itself to
      understand syntax trees.
    rel: alternative
    sources:
      - https://difftastic.wilfred.me.uk/introduction
      - https://dandavison.github.io/delta/
  - id: brew:git
    reason: >
      Difftastic officially integrates with Git as an external diff command, alias
      target, or difftool configured through `~/.gitconfig`.
    rel: adjacent_workflow
    sources:
      - https://difftastic.wilfred.me.uk/git.html
      - https://git-scm.com/docs/git-difftool
  - id: brew:mergiraf
    reason: >
      Use Mergiraf alongside Difftastic when syntax awareness is also needed for
      resolving Git merge conflicts, rather than only displaying differences.
    rel: adjacent_workflow
    sources:
      - https://github.com/Wilfred/difftastic#readme
      - https://mergiraf.org/
