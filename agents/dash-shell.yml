id: brew:dash-shell
display-name: dash
repo: https://git.kernel.org/pub/scm/utils/dash/dash.git
docs:
  - https://git.kernel.org/pub/scm/utils/dash/dash.git/tree/src/dash.1
config-file-location:
  unix:
    - /etc/profile
    - ~/.profile
credentials-file-location: null
history:
  adoption-history:
    - >
      Debian's dash-as-bin-sh effort made dash part of everyday Linux packaging culture:
      maintainer scripts and `/bin/sh` scripts needed to stop relying on Bash-only
      behavior. The result was not just adoption of a shell, but pressure toward cleaner
      POSIX shell scripting across packages.
    - >
      Homebrew packages it as `dash-shell` to avoid name ambiguity while still exposing
      the `dash` executable. Other Unix-like distributions package it simply as `dash`,
      often as a system scripting shell rather than an interactive login shell.
  package-nerd-significance:
    - >
      dash matters because it catches accidental Bashisms. If a package maintainer
      script works under dash, it is more likely to be genuinely portable `/bin/sh`; if
      it breaks, the package has probably encoded an undeclared Bash dependency.
  project-history:
    - >
      dash descends from NetBSD's ash, the Almquist shell, and is maintained as a
      lightweight command interpreter for POSIX shell scripts. Its manual documents a
      shell focused on command execution, scripts, redirection, expansions, and
      built-ins rather than interactive user features.
    - >
      The project became especially visible through Debian and Ubuntu system-shell work,
      where dash's speed and small size made it a candidate for `/bin/sh`. That history
      turned a modest shell implementation into an important compatibility test for
      shell scripts.
  related-projects:
    - >
      dash is related to ash, NetBSD sh, BusyBox ash, Bash in POSIX mode, and the
      broader family of `/bin/sh` implementations used by Unix package scripts.
  sources:
    - http://gondor.apana.org.au/~herbert/dash
    - https://git.kernel.org/pub/scm/utils/dash/dash.git/tree/src/dash.1
    - https://wiki.debian.org/DashAsBinSh
  summary:
    - >
      dash is a small POSIX shell descended from the Almquist shell lineage. In
      package-manager culture it is the fast, minimal `/bin/sh` candidate: less
      interactive shell comfort than Bash, but a tighter target for scripts that claim
      POSIX portability.
  timeline:
    - 'Almquist shell era: ash provided the small POSIX shell lineage that dash descends from.'
    - >
      Debian dash-as-bin-sh era: dash became a prominent `/bin/sh` implementation for
      package scripts.
    - >
      Present: dash is maintained in the kernel.org source tree and packaged across
      Unix-like systems.
  usage:
    - >
      Typical use is running POSIX shell scripts directly with `dash` or using it as
      `/bin/sh` on systems configured that way. It normally has no package-specific user
      config or credential store; shell startup behavior and scripts are governed by
      POSIX shell conventions and the system configuration.
related-packages:
  - id: brew:bash
    reason: >
      Choose Bash for interactive use or scripts requiring Bash-specific features;
      choose dash for fast POSIX `/bin/sh` execution and portability testing.
    rel: alternative
    sources:
      - https://sources.debian.org/src/dash/0.5.2-5/debian/control
      - https://www.gnu.org/software/bash/manual/bash.html
  - id: brew:mksh
    reason: >
      Choose mksh when Korn-shell-compatible interactive features and scripting
      extensions are useful; choose dash for a smaller, deliberately POSIX-focused
      system shell.
    rel: alternative
    sources:
      - https://packages.debian.org/stable/dash
      - https://www.mirbsd.org/man1/mksh
tags:
