history:
  adoption-history:
    - >
      hyx's adoption pattern is that of a small Unix utility: downstream package
      managers track the upstream tarball, and users get a single terminal command
      rather than a larger editor suite. Homebrew analytics show modest use, which fits
      an editor aimed at people who occasionally inspect or patch binary data from the
      shell.
  package-nerd-significance:
    - >
      hyx is package-nerd interesting because it is a deliberately tiny C utility that
      still offers quality-of-life features often missing from minimalist hex dump
      tools. It sits between non-interactive tools such as hexdump or xxd and heavier
      full-screen binary editors.
  project-history:
    - >
      The project is published as dated source tarballs from yx7.cc rather than as an
      advertised public source-control repository. The author describes it as a
      minimalistic but powerful terminal hex editor, with hex and ASCII views, insert
      and replace modes, copy and paste, undo and redo, search, colors, and vim-inspired
      controls.
    - >
      Ubuntu's packaged manpage documents the same command-line identity: hyx opens an
      optional filename, supports command input on standard input, and exposes
      editor-style commands for movement, saving, searching, and toggling color.
  related-projects:
    - >
      Related tools include hexdump, xxd, hexyl, bvi, and graphical hex editors; hyx is
      closest to small terminal editors that prioritize direct byte editing over
      analysis features.
  sources:
    - https://formulae.brew.sh/formula/hyx
    - https://manpages.ubuntu.com/manpages/stonking/man1/hyx.1.html
    - https://yx7.cc/code
  summary:
    - >
      hyx is a small terminal hex editor distributed from the author's yx7.cc code page
      and packaged by Homebrew, Debian-family distributions, Nix, and Alpine. Its niche
      is the familiar package-manager slot occupied by compact command-line tools: a
      single executable, written in C, with vim-like editing for binary files.
  timeline:
    - >
      2021: Ubuntu packaged hyx 2021.06.09 with a manpage describing its vim-like
      terminal workflow.
    - '2026: Homebrew tracked the 2026.01.11 upstream tarball from yx7.cc.'
  usage:
    - >
      The tool is used when a developer or systems operator wants an interactive hex
      editor without opening a graphical application. Its command set favors users who
      already understand modal terminal editors and need byte-level editing, offset
      jumps, hex-string searches, and quick save/quit commands.
related-packages:
  - id: brew:bvi
    reason: >
      Choose bvi when you want a documented vi-style binary editor with startup
      configuration support; choose hyx for a smaller console editor with a compact
      modal workflow.
    rel: alternative
    sources:
      - https://yx7.cc/code
      - https://bvi.sourceforge.net/
      - https://bvi.sourceforge.net/man_bvi.html
