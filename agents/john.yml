id: brew:john
display-name: John the Ripper
repo: https://github.com/openwall/john
docs:
  - https://github.com/openwall/john
  - https://www.openwall.com/john/doc
config-file-location:
  unix:
    - $JOHN/john.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      John became part of Unix security practice because it automated weak-password
      detection against common crypt(3) hashes and later gained support for
      Kerberos/AFS, Windows LM, DES tripcodes, and many additional formats. Openwall
      notes that John is included in Owl, Debian, Fedora, Gentoo, Mandriva, SUSE, and
      BSD ports or packages.
    - >
      Homebrew keeps a separate john formula for the core package, conflicting with
      john-jumbo so users choose between the conservative package and the enhanced
      branch.
  package-nerd-significance:
    - >
      John is one of the packages that makes Unix security tooling feel like a
      package-manager canon item: tiny command name, long history, distro ubiquity, and
      a split between core stability and Jumbo reach. For maintainers, it is also a
      reminder that packaging security tools means preserving documentation, wordlists,
      CPU optimizations, and legal/licensing details alongside the executable.
  project-history:
    - >
      According to Solar Designer on the Openwall john-users list, John the Ripper 1.0
      was released in 1996 as a DOS replacement for Cracker Jack, built with DJGPP and
      optimized for 486 and Pentium systems. The same account says the incremental-mode
      prototypes date to 1995, the project became open source in 1997, and the 1.5
      rewrite in 1998 formed the basis of later releases.
    - >
      Openwall's project page separates core John from Jumbo: the core release is the
      smaller, more conservative line, while Jumbo carries broader community
      functionality. The openwall/john GitHub repository was created in 2011 and serves
      the development source referenced from the official homepage.
  related-projects:
    - >
      Related projects include John the Ripper Jumbo, John the Ripper Pro, Openwall
      wordlists, yescrypt, crypt_blowfish, passwdqc, Hash Suite, Hash Suite Droid, and
      Johnny, the Openwall GUI frontend.
  sources:
    - https://api.github.com/repos/openwall/john
    - https://formulae.brew.sh/formula/john
    - https://github.com/openwall/john
    - https://www.openwall.com/john/
    - https://www.openwall.com/john/doc/
    - https://www.openwall.com/lists/john-users/2015/09/10/4
  summary:
    - >
      John the Ripper is a classic open-source password security auditing and recovery
      tool. Its core identity is a fast Unix password cracker, but the Openwall
      documentation also presents it as a cross-platform tool for many Unix-like
      systems, macOS, Windows, DOS, BeOS, and OpenVMS.
  timeline:
    - '1995: Incremental-mode prototypes were written on Unix-like systems.'
    - '1996: John the Ripper 1.0 was released for DOS.'
    - '1997: John the Ripper became open source.'
    - '1998: Version 1.5 rewrote the codebase used by later versions.'
    - '2002: The code was imported into CVS for further maintenance as part of Owl.'
    - '2011: The openwall/john GitHub repository was created.'
    - '2019: Openwall released John the Ripper 1.9.0 core.'
  usage:
    - >
      The core workflow is to feed John password hashes, let it identify or be told a
      format, crack with wordlist, single, or incremental modes, and save cracked values
      to john.pot. Related tools such as unshadow and unique support the Unix
      password-auditing workflow around the main john executable.
related-packages:
  - id: brew:john-jumbo
    reason: >
      Choose John the Ripper Jumbo when you need hundreds of additional hash and cipher
      formats or broader CPU/GPU support; choose core John for the smaller, more
      conservative upstream feature set.
    rel: alternative
    sources:
      - https://www.openwall.com/john/
      - https://github.com/openwall/john#readme
  - id: brew:hashcat
    reason: >
      Choose hashcat when GPU-oriented, multi-device password recovery and its extensive
      optimized hash-mode catalog are the priority.
    rel: alternative
    sources:
      - https://www.openwall.com/john/
      - https://hashcat.net/hashcat/
