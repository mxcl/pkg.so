id: brew:hotbuild
display-name: hotbuild
repo: null
docs:
  - https://github.com/wandercn/hotbuild#readme
  - https://hotbuild.rustpub.com/
config-file-location:
  unix:
    - <project-directory>/.hotbuild.toml
  windows:
    - <project-directory>\.hotbuild.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      hotbuild has a narrow package footprint compared with larger Go live-reload tools,
      but Homebrew packages it as `hotbuild` and builds from the upstream GitHub release
      archive. That makes it discoverable to macOS and Linux developers who install
      small Go CLIs through Homebrew.
  package-nerd-significance:
    - >
      For package-manager people, hotbuild is an example of the file-watcher hot-reload
      pattern packaged as a tiny standalone Go command. It is less important as an
      ecosystem standard than as a representative of many small development-loop
      accelerators that package managers preserve.
  project-history:
    - >
      The project is published by Wander/rustpub under the wandercn GitHub account, with
      the documentation site carrying rustpub branding and a 2021 copyright. The README
      examples show the tool creating a project-local `.hotbuild.toml` file and running
      a Go build command into a temporary binary before launching it.
  related-projects:
    - >
      Go's own `go build` remains the underlying compilation command in the documented
      examples.
    - >
      Other Go development-loop tools such as air, reflex, and fresh occupy the same
      file-watch-and-rerun niche, though hotbuild keeps its own simple configuration
      format.
  sources:
    - https://formulae.brew.sh/formula/hotbuild
    - https://github.com/wandercn/hotbuild
    - https://hotbuild.rustpub.com/
    - https://hotbuild.rustpub.com/about/
  summary:
    - >
      hotbuild is a small Go development utility for automatically rebuilding and
      rerunning a project when files change. Its upstream site and README present it as
      a cross-platform hot compilation tool for Go projects.
  timeline:
    - >
      2021: The project site and README examples document hotbuild as a Go
      hot-compilation tool with `.hotbuild.toml` project configuration.
    - >
      v1.0.5: README run output shows the tool banner and rebuild/run loop around a Go
      application.
    - 'v1.0.9: Homebrew builds the formula from the upstream GitHub release archive.'
  usage:
    - >
      The documented workflow is to run `hotbuild initconf` inside a Go project, edit
      the generated build and run commands, then use `hotbuild run` while developing.
      The tool watches recursive subdirectories under the configured project path and
      can separate the watched directory from the command working directory.
related-packages:
  - id: brew:go-air
    reason: >
      Choose Air when you prefer its `.air.toml`-based Go live-reload workflow; hotbuild
      offers a smaller `.hotbuild.toml` model centered on explicit build and run
      commands.
    rel: alternative
    sources:
      - https://github.com/wandercn/hotbuild#readme
      - https://github.com/air-verse/air#readme
