history:
  adoption-history:
    - >
      The Theia platform is used to build customized browser and desktop development
      tools, while Eclipse Theia IDE provides a directly usable reference product and
      downloadable Electron application.
    - >
      The IDE also serves as a template and showcase for downstream products. Its
      extension model supports Theia extensions and compatible VS Code extensions,
      reducing the cost of assembling specialized development environments.
  package-nerd-significance:
    - >
      Eclipse Theia is important in developer-tool packaging because it separates an
      extensible IDE platform from a concrete reference distribution. The cask packages
      the Electron-based Eclipse Theia IDE product, not merely the underlying framework.
    - >
      The project offers an open alternative for organizations that want VS Code-like
      browser or desktop tooling while retaining control over product composition,
      hosting, extensions, and AI-provider integration.
  project-history:
    - >
      Theia developed as an open framework for building cloud and desktop IDEs with web
      technologies and became an Eclipse Foundation project. The separate reference
      desktop product was originally called Theia Blueprint.
    - >
      Theia Blueprint was later rebranded as Eclipse Theia IDE. Its official repository
      packages a selected set of Theia features and extensions into downloadable
      Electron applications and an experimental browser container.
  related-projects:
    - The Eclipse Theia platform supplies the IDE framework used by the product.
    - Electron supplies the packaged desktop runtime.
    - VS Code extensions are an important part of Theia's extension ecosystem.
    - Theia AI provides extensible AI-agent and language-model integration.
  sources:
    - 'Official IDE repository: https://github.com/eclipse-theia/theia-ide'
    - >
      Official extending and adoption guide:
      https://theia-ide.org/docs/blueprint_documentation/
    - 'Official platform documentation: https://theia-ide.org/docs/'
    - 'Official preferences documentation: https://theia-ide.org/docs/preferences/'
  summary:
    - >
      Eclipse Theia IDE is the downloadable reference IDE built on the Eclipse Theia
      cloud-and-desktop development-tool platform.
  timeline:
    - >
      Theia platform era: The project established an extensible web-technology framework
      for browser and desktop IDEs.
    - >
      Theia Blueprint era: A reference desktop product was assembled from Theia features
      and extensions.
    - 'Theia IDE era: Theia Blueprint was rebranded as Eclipse Theia IDE.'
  usage:
    - >
      Use Eclipse Theia IDE as a general desktop development environment, or use its
      repository as a template for a custom Electron-based IDE. The broader platform
      also supports browser-hosted tools.
    - >
      Preferences can be applied globally, per workspace, or per folder. Current
      releases also expose configurable AI agents and providers, with API keys supplied
      through environment variables or preferences.
