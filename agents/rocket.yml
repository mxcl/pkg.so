id: cask:rocket
display-name: Rocket
repo: null
docs:
  - https://matthewpalmer.net/rocket
  - https://matthewpalmer.net/rocket/help.html
  - https://matthewpalmer.net/rocket/privacy.html
config-file-location:
  macos:
    - ~/Library/Preferences/net.matthewpalmer.Rocket.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Rocket's official site records coverage by The Verge, Tools & Toys, Lifehacker,
      and iMore, reflecting interest in bringing Slack-style colon shortcuts to ordinary
      macOS applications. It is distributed as a free application with a paid Pro
      feature set.
  package-nerd-significance:
    - >
      Rocket is representative of macOS menu-bar utilities that use Accessibility access
      to extend text input across otherwise unrelated applications. Packaging and
      migration are affected by the separate preferences property list and
      application-support database.
    - >
      The official help page documents a concrete recovery procedure involving
      `rocket.db`, making the location of application state especially relevant when
      troubleshooting, backing up custom shortcuts, or reinstalling the cask.
  project-history:
    - >
      Rocket was created by Matthew Palmer as a keyboard-first macOS emoji picker. The
      free application supplies Slack-style emoji completion, while Rocket Pro expanded
      the same shortcut system to custom emoji, GIFs, images, symbols, and reusable text
      snippets.
  related-projects:
    - >
      Slack popularized the colon-delimited emoji-name interaction that Rocket applies
      across macOS applications.
    - Rocket Pro's snippets overlap with the broader text-expander software category.
  sources:
    - 'Official help: https://matthewpalmer.net/rocket/help.html'
    - 'Official privacy and storage notes: https://matthewpalmer.net/rocket/privacy.html'
    - 'Official product page: https://matthewpalmer.net/rocket/'
  summary:
    - >
      Rocket is a macOS menu-bar utility that completes emoji names entered with
      Slack-style shortcuts in other applications. Its Pro edition adds custom emoji,
      GIFs, images, symbols, snippets, and usage statistics.
  timeline:
    - >
      Initial era: Rocket was introduced by Matthew Palmer as a free Slack-style emoji
      picker for macOS.
    - >
      Pro era: A paid feature set added custom media, shortcuts, text expansion, and
      shortcut statistics.
  usage:
    - >
      Users grant Rocket macOS Accessibility permission and type a trigger character
      followed by an emoji name; Rocket displays matching choices and inserts the
      selected item into the active application.
    - >
      Rocket Pro users can maintain custom emoji and snippets. The official help warns
      that deleting `~/Library/Application Support/Rocket/rocket.db` resets that
      database and requires custom items to be added again.
