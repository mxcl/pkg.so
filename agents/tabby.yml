config-file-location:
  linux:
    - ~/.config/tabby/config.yaml
  macos:
    - ~/Library/Application Support/tabby/config.yaml
  windows:
    - '%APPDATA%\Tabby\config.yaml'
credentials-file-location:
  linux:
    - ~/.config/tabby/config.yaml (encrypted vault data under the vault attribute)
  macos:
    - >
      ~/Library/Application Support/tabby/config.yaml (encrypted vault data under the
      vault attribute)
  windows:
    - '%APPDATA%\Tabby\config.yaml (encrypted vault data under the vault attribute)'
history:
  adoption-history:
    - >
      Tabby is published for Windows, macOS, and Linux and supports platform-specific
      local shells alongside SSH, Telnet, serial, and SFTP workflows. Official releases
      include native packages and portable artifacts, while its plug-in system supports
      extensions and themes.
  package-nerd-significance:
    - >
      Tabby sits at the intersection of terminal emulator, SSH connection manager,
      serial console, and Electron desktop application. Its cross-platform packaging,
      plug-in APIs, YAML configuration, and encrypted in-file credential vault make it
      particularly relevant to desktop package maintainers and users who synchronize
      development environments.
  project-history:
    - >
      The application was originally named Terminus. In June 2021, its maintainer
      announced the Tabby name to avoid confusion with Termius and another Terminus
      package already present in Linux distributions. The migration copied existing
      configuration into Tabby's new data directory and preserved plug-in compatibility.
    - >
      Tabby has continued as a configurable terminal workspace with local-shell
      profiles, SSH and Telnet connections, serial support, split panes, themes, file
      transfer, and a plug-in ecosystem.
  related-projects:
    - Terminus is Tabby's former name; configuration migration was provided during the rename.
    - Tabby Web exposes related SSH, SFTP, and Telnet functionality through a web application.
  sources:
    - https://github.com/Eugeny/tabby#readme
    - https://github.com/Eugeny/tabby/discussions/4087
    - https://github.com/Eugeny/tabby/releases
    - https://github.com/Eugeny/tabby/wiki/Config-file
    - https://github.com/Eugeny/tabby/wiki/Vault-Encryption
  summary:
    - >
      Tabby is an open-source, cross-platform terminal emulator with integrated SSH,
      Telnet, serial, SFTP, profile, and plug-in functionality.
  timeline:
    - >
      2021: The project was renamed from Terminus to Tabby, with automatic configuration
      migration.
    - '2021: Official vault documentation recorded encrypted secret storage inside config.yaml.'
  usage:
    - >
      Users create profiles for local shells and remote or serial connections, arrange
      sessions in tabs and split panes, customize shortcuts and themes, and install
      plug-ins. SSH passwords and private-key passphrases can be kept in an encrypted
      vault embedded in the YAML configuration.
