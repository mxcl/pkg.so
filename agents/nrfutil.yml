credentials-file-location: null
history:
  adoption-history:
    - >
      Nordic distributes the current nRF Util for Windows, Linux, and macOS. Its central
      command registry lets developers add only the Nordic workflows they need, while
      package managers such as Homebrew provide an additional installation route.
  package-nerd-significance:
    - >
      nRF Util consolidates several Nordic development workflows behind an extensible
      command-line interface. Its installable-command model and support for version
      pinning, offline bundles, and CI environments make it particularly relevant to
      reproducible embedded-development toolchains.
  project-history:
    - >
      The current nRF Util succeeded Nordic's Python-based pc-nrfutil utility. Nordic
      retained older DFU, cryptographic-key, and bootloader-settings functionality
      through the `nrf5sdk-tools` command while expanding the new utility with
      separately installable commands for devices, toolchains, tracing, completion, and
      packet sniffing.
  related-projects:
    - >
      The archived `NordicSemiconductor/pc-nrfutil` project is the predecessor to the
      current utility, not its source repository.
    - >
      nRF Connect SDK, nRF Command Line Tools, SEGGER J-Link, and Nordic development
      kits are commonly used alongside nRF Util.
  sources:
    - https://docs.nordicsemi.com/bundle/nrfutil/
    - https://github.com/NordicSemiconductor/pc-nrfutil
    - https://www.nordicsemi.com/Products/Development-tools/nRF-Util
  summary:
    - >
      nRF Util is Nordic Semiconductor's extensible command-line utility for installing
      and running tools used with Nordic products.
  timeline:
    - "Before 2023: Nordic's Python-based pc-nrfutil supplied DFU and cryptographic tooling."
    - >
      2023: Nordic archived pc-nrfutil after replacing its functionality with the newer
      nRF Util command system.
    - >
      2023: Nordic's documentation recorded the addition of commands including trace and
      completion.
  usage:
    - >
      Users install the core `nrfutil` executable, run `nrfutil search` to discover
      commands, and install capabilities such as `device`, `toolchain-manager`, `trace`,
      or `ble-sniffer`. Typical uses include programming and recovering devices,
      managing SDK toolchains, creating DFU packages, and capturing diagnostic data.
