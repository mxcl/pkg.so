provenance:
  category-sources:
    - Official Calico docs describe calicoctl as managing Calico network and security policy.
  display-name-sources:
    - Official Calico docs title and command reference use the executable name calicoctl.
  docs-sources:
    - >
      Official Calico command reference
      https://docs.tigera.io/calico/latest/reference/calicoctl/apply documents --config
      as connection configuration in YAML or JSON with default
      /etc/calico/calicoctl.cfg.
    - >
      Official Calico docs page
      https://docs.tigera.io/calico/latest/reference/calicoctl/overview is the calicoctl
      user reference and describes calicoctl as the CLI for managing Calico network and
      security policy.
  history-sources:
    - https://docs.tigera.io/calico/latest/reference/calicoctl/overview
    - https://github.com/projectcalico/calico/blob/master/README.md
    - https://github.com/projectcalico/calico/releases
    - https://github.com/projectcalico/calico/tags
