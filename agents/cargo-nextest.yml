id: brew:cargo-nextest
display-name: cargo-nextest
repo: null
docs:
  - https://nexte.st/docs
config-file-location:
  unix:
    - .config/nextest.toml
    - $XDG_CONFIG_HOME/nextest/config.toml
    - ~/.config/nextest/config.toml
  windows:
    - .config\nextest.toml
    - '%APPDATA%\nextest\config.toml'
    - '%XDG_CONFIG_HOME%\nextest\config.toml'
    - '%HOME%\.config\nextest\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      cargo-nextest has broad package-manager reach in the input facts: apk, Homebrew,
      Nix, Arch, and winget. Crates.io reported 11,087,886 downloads when checked on
      2026-06-30, reflecting heavy use in Rust CI and local test loops.
  package-nerd-significance:
    - >
      It is significant because it rethinks the default cargo test experience around
      fast execution, structured configuration, CI behavior, and machine-readable
      metadata, making test running a first-class package workflow rather than a fixed
      Cargo subcommand behavior.
  project-history:
    - >
      The cargo-nextest crate first appeared on crates.io in February 2022 as version
      0.9.0. The repository README says the project is derived from diem-devtools, while
      the documentation positions it as a replacement runner for Rust test workflows.
  related-projects:
    - >
      Related projects include Cargo's built-in test runner, nextest-runner,
      nextest-metadata, nextest-filtering, cargo-llvm-cov integration, and the earlier
      diem-devtools codebase.
  sources:
    - https://api.github.com/repos/nextest-rs/nextest
    - https://github.com/nextest-rs/nextest
    - https://nexte.st/docs
    - https://crates.io/api/v1/crates/cargo-nextest
    - https://formulae.brew.sh/api/formula/cargo-nextest.json
  summary:
    - >
      cargo-nextest is the cargo-facing binary for Nextest, a next-generation Rust test
      runner. The official repository README describes cargo-nextest as a newer, faster
      Cargo test runner and points users to nexte.st for documentation.
  timeline:
    - '2022: First crates.io release 0.9.0.'
    - '2026: Crates.io latest version 0.9.138 and Homebrew stable version 0.9.138.'
  usage:
    - >
      Users run cargo nextest run to execute tests, configure repository behavior in
      .config/nextest.toml, and optionally use user config for personal UI preferences.
      The docs cover profiles, retries, timeouts, test groups, per-test overrides,
      archives, and integrations.
related-packages:
  - id: brew:cargo-mutants
    reason: >
      cargo-mutants can run mutation-test workloads through Nextest when a suite
      requires it or benefits from faster failure detection.
    rel: adjacent_workflow
    sources:
      - https://nexte.st/docs/integrations/cargo-mutants/
      - https://mutants.rs/changelog.html
  - id: brew:cargo-llvm-cov
    reason: >
      cargo-llvm-cov directly supports `cargo llvm-cov nextest` for collecting LLVM
      coverage while Nextest runs the test binaries.
    rel: adjacent_workflow
    sources:
      - https://nexte.st/docs/integrations/test-coverage/
      - https://github.com/taiki-e/cargo-llvm-cov#readme
tags:
  - cargo
  - ci
  - cli
  - rust
  - test-runner
  - testing
geiger:
  category: appliance
  color: green
  confidence: low
  reason: no executable entrypoint in the package index
  reasons:
    - no executable entrypoint in the package index
  signals:
    - metadata:no-indexed-executables
provenance:
  category-sources:
    - 'source_facts.description: Next-generation test runner for Rust.'
  display-name-sources:
    - 'source_facts.name: cargo-nextest.'
  docs-sources:
    - >
      Official nextest documentation at nexte.st/docs documents repository config
      .config/nextest.toml and user config under XDG/AppData locations.
  history-sources:
    - https://api.github.com/repos/nextest-rs/nextest
    - https://github.com/nextest-rs/nextest
    - https://nexte.st/docs
    - https://crates.io/api/v1/crates/cargo-nextest
    - https://formulae.brew.sh/api/formula/cargo-nextest.json
  repo-sources:
    - source_facts.repo is populated, so the prompt requires returning repo as null.
  tags-sources:
    - >
      Official nextest documentation describes cargo-nextest as a Rust test runner for
      local and CI workflows.
category-confidence: high
category-path:
  - developer-tools
  - testing
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
