history:
  project-history:
    - >
      The project is shaped by Moodle's API and institutional-learning-management
      quirks. The README says it uses the Moodle mobile API, stores configuration in
      config.json, can handle SSO/token flows, and can maintain cookies for modules not
      exposed through the mobile API. It also supports notification channels including
      Telegram, Discord, XMPP, and mail, and reruns avoid redownloading files already
      saved locally. That makes it a personal archival and synchronization tool rather
      than a replacement for Moodle's built-in course export feature, which Moodle
      documentation describes as an administrator-enabled "Download course content"
      option.
  sources:
    - https://docs.moodle.org/en/Download_course_content
    - https://github.com/C0D3D3V/Moodle-DL
  summary:
    - >
      Moodle-DL is a student-oriented Moodle downloader developed in the
      C0D3D3V/Moodle-DL GitHub project. Its README presents the origin problem plainly:
      repeatedly downloading course files by hand is inefficient. The tool answers that
      with a Python console application that downloads Moodle course materials needed
      for study routines, including files, assignments and submissions, books, calendar
      events, forums, workshops, lessons, quizzes, descriptions, external links, and
      video/file integrations such as OpenCast, YouTube, Sciebo, Owncloud, Kaltura,
      Helixmedia, and Google Drive.
  usage:
    - >
      In package-manager terms, moodle-dl is a niche CLI for students and university
      users whose Moodle instance allows the needed API access. Its README compares it
      with adjacent Moodle downloaders such as webeep-sync, syncMyMoodle, edu-sync,
      tum-moodle-downloader, moodle-buddy, and Discord notification bots, reflecting a
      small ecosystem of institution-specific tools around the same pain point.
