id: brew:mailutils
display-name: GNU Mailutils
repo: https://git.savannah.gnu.org/git/mailutils.git
docs:
  - https://mailutils.org/manual/mailutils.html
config-file-location:
  unix:
    - ${sysconfdir}/mailutils.conf
    - ~/.<program>
credentials-file-location:
  unix:
    - ~/.mu-tickets
history:
  adoption-history:
    - >
      The upstream homepage identifies Mailutils as official GNU software and lists it
      as useful to regular users, system administrators, and developers. It also names
      other free software packages using it, including MH-E and Mailfromd, which is a
      useful signal that Mailutils is both a user-facing toolbox and a reusable mail
      framework.
    - >
      In package-manager culture, Mailutils matters because it is the GNU-flavored
      provider of familiar commands such as mail, frm, from, messages, movemail,
      readmsg, and sieve, while also shipping POP3, IMAP4, LMTP, and related services.
      That makes one package cover many mail-adjacent command names that otherwise vary
      by Unix lineage.
  package-nerd-significance:
    - >
      Mailutils is a dense GNU package in the best and worst senses: one formula brings
      in a pile of historically loaded mail commands plus servers, libraries, and
      protocol glue. It is especially interesting when comparing which implementation of
      mail, movemail, or sieve a distribution chooses to expose.
    - >
      Because the suite understands UNIX maildrops, Maildir, MH, POP3, IMAP4, SMTP, TLS,
      SASL, and related mechanisms, it sits at the crossroads of old local Unix mail and
      network-era mail protocols. That makes it a frequent dependency, conflict, or
      alternative in mail tooling stacks.
  project-history:
    - >
      The Mailutils manual describes the package as having started from a practical need
      to handle large mailbox files more gracefully than the POP3 servers available to
      its authors at the time. That origin explains the library-centered design:
      programs built on Mailutils are meant to work across mailbox formats through one
      interface rather than carrying separate mailbox-specific code.
    - >
      Public GNU source archives show Mailutils 0.1 available in September 2002, 1.0 in
      July 2006, and the 3.x line continuing through Mailutils 3.21 in December 2025.
      Over that span the package accumulated classic Unix mail commands, protocol
      daemons, Sieve support, MH-compatible tools, and libmailutils APIs for mailbox,
      MIME, authentication, and protocol work.
  related-projects:
    - GNU Emacs movemail is a historical reference point for Mailutils movemail.
    - MH-E is listed by the upstream homepage as free software using Mailutils.
    - Mailfromd is listed by the upstream homepage as free software using Mailutils.
  sources:
    - https://ftp.gnu.org/gnu/mailutils/
    - https://mailutils.org/
    - https://mailutils.org/manual/html_node/History.html
    - https://mailutils.org/manual/html_node/configuration.html
    - https://mailutils.org/manual/mailutils.html
  summary:
    - >
      GNU Mailutils is the GNU Project's general-purpose mail package: a set of
      command-line utilities, daemons, and libraries for handling electronic mail across
      local and remote mailbox formats.
  timeline:
    - '2002: Mailutils 0.1 appears in the official GNU FTP archive.'
    - '2006: Mailutils 1.0 appears in the official GNU FTP archive.'
    - '2025: Mailutils 3.21 is released and documented by the upstream manual.'
  usage:
    - >
      Users install Mailutils for traditional command-line mail reading and sending,
      mailbox inspection, message extraction, MIME viewing, movemail-style retrieval,
      and Sieve filtering. Administrators use its daemons and delivery tools for POP3,
      IMAP4, LMTP, local delivery, and mailbox conversion.
    - >
      Mailutils reads a site-wide configuration file named ${sysconfdir}/mailutils.conf
      and, for client utilities, per-user files named after the program such as
      ~/.sieve. Its wicket command looks up matching URLs in the default ticket file
      ~/.mu-tickets, allowing credentials to be kept out of command lines and ordinary
      examples.
related-packages:
  - id: brew:mutt
    reason: >
      Choose Mutt when the primary need is a dedicated terminal mail user agent rather
      than Mailutils' broader collection of clients, servers, delivery tools, and
      libraries.
    rel: alternative
    sources:
      - https://mailutils.org/manual/mailutils.html
      - https://www.mutt.org/doc/manual/
tags:
  - cli
  - email
  - imap
  - mail-client
  - mail-server
  - pop3
  - sieve
geiger:
  category: appliance
  color: green
  confidence: low
  reason: narrow executable package without higher-risk signals
  reasons:
