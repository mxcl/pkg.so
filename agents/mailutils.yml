provenance:
  category-sources:
    - >
      GNU Mailutils Savannah summary describes mail libraries, clients, servers, POP3,
      IMAP4, Sieve, and mail utilities.
    - source_facts.description says "Swiss Army knife of email handling".
  display-name-sources:
    - GNU Mailutils manual and Savannah summary use the name GNU Mailutils.
    - source_facts.homepage is mailutils.org, the GNU Mailutils site.
  docs-sources:
    - >
      Official GNU Mailutils manual documents GNU Mailutils 3.21 and its utilities,
      libraries, and configuration.
  history-sources:
    - https://ftp.gnu.org/gnu/mailutils/
    - https://mailutils.org/
    - https://mailutils.org/manual/html_node/History.html
    - https://mailutils.org/manual/html_node/configuration.html
    - https://mailutils.org/manual/mailutils.html
  repo-sources:
    - >
      Official Mailutils download page links the development version to the Git
      repository at git.savannah.gnu.org.
    - >
      Savannah project summary identifies GNU Mailutils as official GNU software with a
      Git repository.
  tags-sources:
