config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GLPK's adoption is strongest in academic, operations-research, reproducible-build,
      and scripting settings where a GPL solver can be installed from ordinary system
      package managers. Homebrew, Debian and Ubuntu package names, MacPorts, Nix,
      Pacman, Chocolatey, and other package-manager records show broad distribution.
  package-nerd-significance:
    - >
      GLPK is important to package maintainers because it gives a complete optimization
      stack as portable C source plus a CLI solver. It is often the default free solver
      dependency that higher-level modeling tools can detect before users install
      commercial or heavier open-source solvers.
  project-history:
    - >
      The GNU FTP archive shows GLPK tarballs dating back to the 1.x line in 2000 and
      rapid 2.x and 3.x releases in 2001 and 2002. The 5.0 source package identifies
      GLPK as part of the GNU Project and describes it as ANSI C routines organized as a
      callable library.
    - >
      GLPK evolved around a small but durable solver toolkit: primal simplex, dual
      simplex, exact rational simplex, primal-dual interior point, branch-and-cut, an
      API, the GNU MathProg modeling language, and the glpsol standalone solver. The 5.0
      NEWS file records a long release history through the 4.x series before the 5.0
      release in 2020.
  related-projects:
    - >
      GLPK is related to GNU MathProg, AMPL-style model files, MPS and CPLEX LP
      interchange formats, and higher-level optimization packages that call external
      LP/MIP solvers.
  sources:
    - https://cvs.savannah.gnu.org/viewvc/glpk
    - https://formulae.brew.sh/formula/glpk
    - https://ftp.gnu.org/gnu/glpk/
    - https://ftp.gnu.org/old-gnu/glpk/
    - https://www.gnu.org/software/glpk
  summary:
    - >
      GLPK, the GNU Linear Programming Kit, is a GNU Project library and solver suite
      for large-scale linear programming, mixed-integer programming, and related
      optimization problems.
  timeline:
    - '2000: glpk-1.1.1 appeared in the old GNU FTP archive.'
    - '2001: GLPK 2.x and 3.0 tarballs appeared in the old GNU FTP archive.'
    - >
      2017: GLPK 4.61 added support for building a re-entrant package for multithreaded
      environments.
    - '2018: GLPK 4.65 added LP/MIP preprocessing API routines and cover-cut work.'
    - >
      2020: GLPK 5.0 was released and copyright was transferred to the Free Software
      Foundation.
  usage:
    - >
      Practitioners use GLPK as a C library from applications or through glpsol for
      command-line solving. Typical inputs include MathProg models, LP files, MPS files,
      and mixed-integer models, with outputs used for teaching, prototyping, batch
      optimization jobs, and integration tests for modeling layers.
related-packages:
  - id: brew:highs
    reason: >
      HiGHS is an MIT-licensed, high-performance alternative for large sparse LP and MIP
      workloads, while GLPK is attractive when GNU MathProg support and a GNU C library
      are priorities.
    rel: alternative
    sources:
      - https://www.gnu.org/software/glpk/
      - https://github.com/ERGO-Code/HiGHS
      - https://ergo-code.github.io/HiGHS/
  - id: brew:cbc
    reason: >
      Cbc is a COIN-OR branch-and-cut alternative focused on mixed-integer linear
      programming and offers both a standalone executable and callable C++ library.
    rel: alternative
    sources:
      - https://www.gnu.org/software/glpk/
      - https://github.com/coin-or/Cbc
      - https://coin-or.github.io/Cbc/
