credentials-file-location: null
history:
  adoption-history:
    - >
      WhatRoute's official history says Apple included it with Mac OS 9 in 2001. After
      Mac OS X introduced Apple's own Network Utility, user requests led to WhatRoute
      being updated for the Unix-based macOS generation and successive Mac hardware
      architectures.
  package-nerd-significance:
    - >
      WhatRoute preserves a distinctly Macintosh strand of networking-tool history: it
      brought traceroute and ping to classic Mac OS before Apple bundled comparable
      tools, then evolved into a graphical macOS front end for diagnostics, traffic
      inspection, and geographic route visualization. Its Homebrew cask makes this
      long-running native utility installable through a modern package-manager workflow.
  project-history:
    - >
      Bryan Christianson originally developed WhatRoute in 1996 for Mac OS 7.5.3 and its
      then-new Open Transport TCP/IP stack. The official history describes it as the
      first Macintosh software to provide traceroute and ping.
    - >
      The application subsequently crossed the Motorola 68K, PowerPC, Intel, and modern
      macOS eras. Its scope expanded beyond traceroute to DNS and Whois queries, port
      and network scans, tcpdump, flow and bandwidth monitoring, Wi-Fi inspection, and
      geographic visualization of network paths.
  related-projects:
    - >
      Related technologies include macOS Network Utility, traceroute, ping, tcpdump, DNS
      tools, Whois, Apple Maps, and IP geolocation services.
  sources:
    - https://www.whatroute.net/
    - https://www.whatroute.net/Documentation/helper.html
    - https://www.whatroute.net/Documentation/overview.html
    - https://www.whatroute.net/faq.html
    - source_facts.package-manager
  summary:
    - >
      WhatRoute is a native macOS network diagnostic and monitoring application whose
      history reaches back to classic Mac OS. It combines familiar Unix networking
      functions with a graphical interface, traffic monitoring, and geographic route
      visualization.
  timeline:
    - '1996: WhatRoute was originally developed for Mac OS 7.5.3.'
    - '2001: Apple included WhatRoute with Mac OS 9.'
    - '2013: Version 1.12 introduced a new privileged helper and improved DNS timeout handling.'
    - '2016: Version 2.0.0 began the documented 2.x release line.'
    - '2025: The official site announced WhatRoute 2.7.1.'
  usage:
    - >
      Users run traceroute, ping, DNS, Whois, ASN, port-scan, network-scan, interface,
      netstat, tcpdump, and network-quality operations from a macOS GUI. The application
      also monitors flows, bandwidth, Wi-Fi, and DNS-server performance and can plot
      routes or flows on a world map.
    - >
      WhatRoute installs a signed privileged helper after requesting an administrator
      password. The helper opens raw sockets and network interfaces, runs tcpdump, and
      clears DNS or neighbour caches; the password is an authorization prompt rather
      than an application credential.
