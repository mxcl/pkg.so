id: cask:devin-desktop@next
display-name: Devin Desktop Next (Beta)
repo: null
docs:
  - https://docs.devin.ai/get-started/devin-intro
  - https://docs.devin.ai/release-notes/overview
  - https://docs.devin.ai/work-with-devin/devin-session-tools
config-file-location:
  unix:
    - ~/.codeium/user_settings.pb
    - ~/.codeium/mcp_config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The next channel gives package-manager users a separately installable preview
      build alongside the stable Devin Desktop cask. Such channels are primarily adopted
      by users willing to test upcoming IDE changes before they reach the stable stream.
  package-nerd-significance:
    - >
      A versioned @next cask is useful to package enthusiasts because it makes the
      vendor's preview update stream explicit and independently installable. It also
      preserves a clean distinction between stable and prerelease desktop builds.
  project-history:
    - >
      Devin's desktop experience grew from the interactive VS Code-based IDE introduced
      with Devin 1.5 in March 2025 and the agent-native Devin 2.0 interface released in
      April 2025. This package tracks the vendor's next or beta desktop distribution
      rather than its stable channel.
  related-projects:
    - cask:devin-desktop is the corresponding stable package.
    - Devin Review and DeepWiki are related services in the broader Devin product family.
  sources:
    - current_curation.display-name
    - https://docs.devin.ai/release-notes/2025
    - https://docs.devin.ai/work-with-devin/devin-session-tools
    - source_facts.homepage
    - source_facts.source-archive
  summary:
    - Devin Desktop Next is the beta update channel of the packaged Devin agentic IDE client.
  timeline:
    - '2025-03-25: Devin 1.5 introduced the interactive VS Code-based IDE.'
    - '2025-04-03: Devin 2.0 launched as an agent-native IDE.'
    - >
      2026: The input package records a distinct next-channel build distributed as Devin
      - Next.app.
  usage:
    - >
      Users install the next channel to evaluate prerelease Devin Desktop builds while
      retaining the same core workflow: delegating engineering work, observing agent
      progress, reviewing code, using the shell, and taking over the IDE when needed.
tags:
  - agentic-ide
  - ai-agent
  - beta
  - coding-assistant
  - desktop-app
  - prerelease-channel
  - software-engineering
provenance:
  category-sources:
    - current_curation.display-name identifies this as the beta/next channel of Devin Desktop.
    - 'source_facts.description: "Agentic IDE with AI agent command center".'
  display-name-sources:
    - current_curation.display-name.
    - >
      source_facts.homepage contains the official download-next channel, and
      source_facts.applications identifies Devin - Next.app.
  docs-sources:
    - >
      Official Devin documentation; no separate official documentation set was found for
      the next channel.
  history-sources:
    - current_curation.display-name
    - https://docs.devin.ai/release-notes/2025
    - https://docs.devin.ai/work-with-devin/devin-session-tools
    - source_facts.homepage
    - source_facts.source-archive
  repo-sources:
    - >
      [Official desktop documentation](https://docs.devin.ai/desktop/getting-started)
      and [download page](https://devin.ai/download?next=true) did not establish an
      official public repository for this application.
  tags-sources:
    - current_curation.display-name.
    - source_facts.description.
    - source_facts.homepage.
category-confidence: high
category-path:
  - developer-tools
  - ai-coding
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: medium
tags-confidence: high
