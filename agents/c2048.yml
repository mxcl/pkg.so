history:
  adoption-history:
    - >
      The README documents Debian-based installation with `sudo apt install 2048`, and
      source_facts records Homebrew, Debian, and Ubuntu package names. That combination
      is typical for small terminal games: distro packages provide discoverability,
      while source compilation remains a single-command path.
  package-nerd-significance:
    - >
      c2048 is a neat example of the package-manager afterlife of a viral browser game:
      once a simple ruleset becomes popular, ports appear in every environment,
      including tiny ncurses-like terminal packages.
    - >
      It also shows why minimal C programs package well: no service, no state, no
      credentials, tiny dependency surface, and easy build-from-source instructions.
  project-history:
    - >
      The upstream Git history starts on 26 March 2014, shortly after the 2048 puzzle
      became widely cloned and ported. The README describes the project as a console
      version of 2048 for GNU/Linux, tested on GNU/Linux, FreeBSD, and OpenBSD.
    - >
      The project stayed minimal but maintained: later tags include v1.0.0 in 2023, and
      the repository continued to receive color-scheme and keyboard-input updates
      through 2025 and 2026.
  related-projects:
    - '2048: the original puzzle game family that 2048.c ports to the terminal.'
    - 'Debian and Ubuntu 2048 packages: distro packaging channels recorded in source_facts.'
    - >
      Other terminal game ports: adjacent tiny packages that turn browser or mobile
      games into CLI programs.
  sources:
    - https://github.com/mevdschee/2048.c
    - https://github.com/mevdschee/2048.c#readme
    - source_facts.package-manager
  summary:
    - >
      c2048 packages 2048.c, a compact terminal version of the 2048 puzzle game written
      in C. It is intentionally small: a console game that can be built with a C
      compiler and run in ANSI-capable terminals.
  timeline:
    - '2014-03-26: Upstream Git history begins with initial commits.'
    - '2023-10-20: v1.0.0 tag appears.'
    - '2024-05-21: v1.0.1 tag appears.'
    - '2025-01-27: v1.0.2 and v1.0.3 tags appear.'
    - '2025-07-20: Keypad key support is added upstream.'
    - '2026-04-02: Whiteblack color scheme work lands upstream.'
  usage:
    - >
      Users run the `2048` executable in a terminal and move tiles with arrow keys. The
      README documents alternate color schemes, `--version`, `--help`, and a built-in
      test mode invoked as `./2048 test`.
    - >
      The package has no configuration or credential model; its package-manager value is
      simply making the terminal game available from PATH.
