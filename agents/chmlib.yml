config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README credits portability work across Linux, Win32, OS X, Solaris, IRIX,
      Windows CE, MinGW32, x86-64, and ia64, plus Debian package maintainers. The input
      package facts show modern distribution through Homebrew, Debian/Ubuntu,
      Fedora/DNF, MacPorts, Nix, Arch, and openSUSE.
  package-nerd-significance:
    - >
      chmlib matters to package maintainers because it is old, small infrastructure for
      a proprietary documentation container format. Its utilities and library bindings
      let Unix systems index, extract, and view legacy Windows help files without the
      Microsoft runtime.
  project-history:
    - >
      The upstream README for CHMLIB 0.40a says the library was designed for accessing
      MS ITSS files, the format used by Microsoft Html Help .chm documentation, and
      supports archive lookup and reading but not writing. The GitHub source tree was
      imported in 2006 at version 0.37, while the NEWS file records earlier 0.2, 0.3,
      0.32, and 0.35 release history.
  related-projects:
    - >
      The README names Microsoft Html Help, ITSS, IStorage-style archive access, Stuart
      Caie's LZX decompression code, and chm_http as an included helper utility.
  sources:
    - https://raw.githubusercontent.com/jedwing/CHMLib/master/README
    - https://raw.githubusercontent.com/jedwing/CHMLib/master/NEWS
    - https://formulae.brew.sh/api/formula/chmlib.json
  summary:
    - >
      chmlib is a small C library and set of utilities for reading Microsoft ITSS/CHM
      Html Help files.
  timeline:
    - '2002: README credits Solaris and IRIX portability work.'
    - '2006: Official GitHub source tree imported at 0.37.'
    - '2006: NEWS records security fixes around 0.36 and 0.37 and later 0.40 maintenance fixes.'
    - '2026: Homebrew packages chmlib 0.40 from the jedrea.com source tarball.'
  usage:
    - >
      The package provides library functionality and command-line utilities such as
      chm_http, enum_chmLib, enumdir_chmLib, extract_chmLib, and test_chmLib for
      inspecting, serving, and extracting CHM archives.
