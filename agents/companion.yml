history:
  adoption-history:
    - >
      Bitfocus describes Companion as common in AV and broadcast environments, while its
      support page points to a community numbering more than 15,000 members. Its
      device-neutral module ecosystem helped it spread beyond Elgato Stream Deck
      hardware to web buttons, touch screens, and other control surfaces.
  package-nerd-significance:
    - >
      Companion is notable to package users because it turns an inexpensive programmable
      controller—or even a browser—into an extensible automation surface. The Homebrew
      cask provides a convenient installation path for an application otherwise
      distributed through Bitfocus downloads.
    - >
      Its open module ecosystem, headless deployment options, web administration,
      network APIs, and Raspberry Pi companion project make it relevant to broadcast
      engineers, live-event technicians, and automation-oriented homelab users.
  project-history:
    - >
      Companion originated as an open-source Bitfocus project by William Viker and Håkon
      Nessjøen; its repository license dates the project to 2018. It developed from a
      Stream Deck-oriented shotbox into a broader, brand-agnostic control platform for
      professional audiovisual equipment and software.
    - >
      Later releases expanded automation, network APIs, custom variables, triggers,
      additional control surfaces, downloadable connection modules, and headless
      operation. Connection modules became separately downloadable plugins beginning
      with Companion 4.0, followed by surface modules in 4.3.
  related-projects:
    - >
      CompanionPi supplies Raspberry Pi and Debian/Ubuntu deployment tooling for
      headless Companion installations.
    - Companion Satellite connects remote control surfaces to a Companion host.
    - >
      Companion's connection and surface modules provide integrations with supported
      hardware and software.
  sources:
    - https://bitfocus.io/companion
    - https://bitfocus.io/companion/support
    - https://github.com/bitfocus/companion
    - https://github.com/bitfocus/companion-pi
    - https://github.com/bitfocus/companion/blob/main/CHANGELOG.md
  summary:
    - >
      Bitfocus Companion is an open-source, cross-platform control-surface and
      automation application centered on live production, broadcast, presentation, and
      audiovisual workflows.
  timeline:
    - "2018: The Companion repository's copyright and license history begins."
    - >
      2022: Companion 2.2 introduced a new web interface, triggers, custom variables,
      expanded APIs, and native Apple Silicon builds.
    - >
      2024–2025: Companion 4.x moved connections and then surfaces to independently
      updateable modules.
  usage:
    - >
      Users configure Companion through its web administration interface, add
      connections for equipment or software, and assign actions and feedback to physical
      or virtual buttons.
    - >
      It can directly drive supported control surfaces, expose web buttons, and trigger
      actions through OSC, TCP, UDP, HTTP, WebSocket, and Art-Net. Configuration should
      be exported or backed up through Companion's documented backup facilities before
      migration or major upgrades.
