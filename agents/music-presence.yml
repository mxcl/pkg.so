config-file-location:
  linux:
    - ~/.local/share/Music Presence/settings.json
  macos:
    - ~/Library/Application Support/Music Presence/settings.json
  windows:
    - '%APPDATA%\Music Presence\settings.json'
credentials-file-location:
  linux:
    - ~/.local/share/Music Presence/stats.json
  macos:
    - ~/Library/Application Support/Music Presence/stats.json
  windows:
    - '%APPDATA%\Music Presence\stats.json'
history:
  adoption-history:
    - >
      Music Presence broadened a player-specific Discord integration pattern into one
      application supporting many desktop players. The official project documents
      Homebrew installation on macOS and an unofficial AUR package on Arch Linux,
      alongside direct application releases.
  package-nerd-significance:
    - >
      The application is notable for replacing separate per-player Rich Presence plugins
      with one cross-platform tray application. Its package-manager story also
      illustrates the distinction between an upstream-endorsed command and a
      community-maintained distribution package.
  project-history:
    - >
      Music Presence was developed by Jonas van den Berg as an independent, open-source
      desktop application for publishing currently playing media through Discord Rich
      Presence. Its scope expanded from basic status reporting into per-player controls,
      album artwork, playback position, external music APIs, and broad media-player
      support.
  related-projects:
    - >
      Music Presence complements Discord's built-in activity system and can coexist with
      Discord's official Spotify integration. It also interacts with desktop players and
      services such as Apple Music, Spotify, TIDAL, Deezer, foobar2000, VLC, and
      MusicBee.
  sources:
    - https://docs.musicpresence.app/
    - https://github.com/ungive/discord-music-presence
    - https://github.com/ungive/discord-music-presence/blob/master/CHANGELOG.md
    - >
      https://github.com/ungive/discord-music-presence/blob/master/documentation/music-presence-files.md
    - 'input: source_facts.package-manager.brew-cask'
  summary:
    - >
      Music Presence is an independent cross-platform application that detects media
      playback and exposes it as a customizable Discord status. It centralizes Rich
      Presence behavior across many music and media players.
  timeline:
    - >
      2024: The project's official copyright and media chronology document its public
      activity under the Music Presence name.
    - >
      Later releases expanded platform coverage, player support, customization,
      music-service metadata, and package-manager installation options.
  usage:
    - >
      Users run Music Presence alongside the desktop Discord client and a supported
      media player. Its settings control which players and Discord accounts may publish
      activity, what metadata appears, album artwork, playback position, and optional
      external music APIs. The official file-location guide warns that stats.json can
      contain Discord account identifiers and entered music-API credentials and should
      not be shared.
