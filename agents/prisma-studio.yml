history:
  adoption-history:
    - >
      Studio became a standard companion to Prisma ORM through its inclusion with the
      Prisma CLI. Prisma reported thousands of users by 2025 and also embedded Studio in
      the Prisma Data Platform for PostgreSQL and MySQL databases.
  package-nerd-significance:
    - >
      Prisma Studio adds a graphical data browser and editor to a schema- and
      CLI-centered TypeScript database toolchain. It is useful to package users because
      it supplies an immediately accessible database interface without requiring a
      separate administration suite.
  project-history:
    - >
      Prisma introduced Studio as a browser-based visual database editor around 2020,
      describing its original role as a modern counterpart to phpMyAdmin. It
      subsequently evolved from a Prisma-schema-dependent ORM tool into a SQL-driven
      editor that can introspect supported databases directly.
    - >
      In 2025 Prisma renewed development of Studio and integrated it into the Prisma
      Data Platform. Later releases added standalone database connections and
      visualization of Prisma migration history.
  related-projects:
    - Prisma ORM
    - Prisma CLI
    - Prisma Data Platform
    - Prisma Postgres
  sources:
    - https://docs.prisma.io/docs/studio/getting-started
    - https://www.prisma.io/blog/prisma-studio-migrations-view
    - https://www.prisma.io/blog/we-made-prisma-studio-even-better
  summary:
    - >
      Prisma Studio is Prisma's visual database editor for browsing, filtering, and
      changing records through a local browser interface or Prisma's hosted platform.
  timeline:
    - '2020: Prisma released the original Prisma Studio experience.'
    - '2025: Studio received renewed development and Prisma Data Platform integration.'
    - '2026: Studio added a migration-history view for Prisma 8 databases.'
  usage:
    - >
      Developers launch Studio from the Prisma CLI inside an ORM project or pass a
      database URL for standalone use. Studio provides table browsing, filtering, record
      editing, and, for supported Prisma 8 databases, migration-history inspection.
