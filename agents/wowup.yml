history:
  adoption-history:
    - >
      WowUp is distributed for Windows, macOS, and Linux, with stable downloads on its
      website and preview builds through GitHub. It supports multiple World of Warcraft
      installations and addon sources.
    - >
      The project offers separate builds integrating with Wago and CurseForge services
      and is also distributed through system package channels including Homebrew Cask
      and WinGet.
  package-nerd-significance:
    - >
      WowUp is part of the ecosystem of specialized package managers built around game
      modifications rather than operating-system packages. Provider aggregation,
      release-channel selection, automatic updates, import/export, and
      per-game-installation targeting closely parallel features found in general-purpose
      package managers.
  project-history:
    - >
      WowUp developed as a community-centered, open-source World of Warcraft addon
      updater. Its Electron client grew to discover addons across providers, detect
      multiple WoW installations, display changelogs, and manage alpha, beta, and stable
      addon channels.
    - >
      The project later maintained provider-specific distributions for Wago and
      CurseForge while retaining a common workflow and cross-platform desktop client.
  related-projects:
    - Wago and CurseForge are addon distribution providers supported by WowUp.
    - >
      World of Warcraft stores addon preferences under each client’s `WTF` directory;
      WowUp can back up and restore that separate game-managed data.
    - The optional WowUp companion addon adds in-game integration.
  sources:
    - https://github.com/WowUp/WowUp
    - https://wowup.io/
    - https://wowup.io/guide/my-addons/addon-import
    - https://wowup.io/guide/my-addons/addon-settings
    - https://wowup.io/guide/my-addons/addons
    - https://wowup.io/guide/wowup/overview
    - source_facts.package-manager
  summary:
    - >
      WowUp is an open-source, cross-platform manager for discovering, installing,
      updating, and backing up World of Warcraft addons.
  timeline:
    - >
      2020s: WowUp established its cross-platform Electron addon-management client and
      public GitHub project.
    - >
      2022: Provider-specific WowUp distributions emerged as addon-platform integrations
      changed.
    - '2026: The project continued issuing 2.x releases for current World of Warcraft clients.'
  usage:
    - >
      WowUp scans for World of Warcraft installations and their installed addons,
      matches them to supported providers, and installs or updates selected release
      channels. Users can enable automatic updates, export addon lists, and back up the
      game’s addon-settings directory.
