history:
  adoption-history:
    - >
      PyPy grew through recurring international development sprints and later became a
      practical alternative Python runtime. The input records packages for Alpine,
      Debian, Fedora-family systems, Nix, Arch, Scoop, Ubuntu, and Homebrew, reflecting
      broad package-manager availability.
  package-nerd-significance:
    - >
      PyPy is notable for combining a Python interpreter written largely in Python with
      the RPython translation toolchain and a tracing JIT. It gives runtime-focused
      users a materially different performance and garbage-collection profile from
      CPython while retaining substantial Python compatibility.
  project-history:
    - >
      PyPy began at development sprints in 2003, initially implementing the interpreter
      in Python. From 2005, work intensified on RPython type inference and the C
      backend, enabling the interpreter to be translated into a self-contained
      executable. PyPy 0.7.0 was announced in 2005 as an early self-contained release.
  related-projects:
    - >
      CPython is the reference Python implementation against which PyPy compatibility is
      commonly discussed.
    - RPython is PyPy's restricted Python subset and translation toolchain.
    - CFFI, ctypes, and cppyy are documented routes for native interoperability.
  sources:
    - https://doc.pypy.org/
    - https://doc.pypy.org/dev_method.html
    - https://doc.pypy.org/eventhistory.html
    - https://pypy.org/posts/2018/09/the-first-15-years-of-pypy-3412615975376972020.html
    - source_facts.package-manager
  summary:
    - >
      PyPy is an alternative implementation of Python built around the RPython
      translation toolchain and a tracing just-in-time compiler.
  timeline:
    - '2003: The project began with its first interpreter-development sprints.'
    - '2005: Work on RPython type inference and the C backend accelerated.'
    - '2005: PyPy 0.7.0 provided an early self-contained translated interpreter.'
  usage:
    - >
      PyPy is used as a Python interpreter for workloads that benefit from its JIT,
      subject to compatibility and warm-up considerations. Users invoke `pypy3` and its
      associated pip entry points much as they would another Python installation.
