config-file-location:
  unix:
    - ~/.kube/config
credentials-file-location:
  unix:
    - ~/.kube/config
history:
  adoption-history:
    - >
      kubent became a familiar checklist tool for Kubernetes platform teams because
      deprecated APIs are easy to miss in stored manifests and Helm release data.
      Homebrew, Scoop, Nix, and container-image distribution made it convenient to drop
      into upgrade runbooks and CI jobs without building from source.
  package-nerd-significance:
    - >
      For package-maintainer culture, kubent is a compact example of the Kubernetes
      ecosystem producing tiny CLIs around version-skew pain. It matters less as a
      framework than as a practical binary that turns upstream API-removal policy into a
      package-manager-installable preflight check.
  project-history:
    - >
      The project appeared publicly as Kube No Trouble in April 2020 with release 0.1.0.
      Its README ties the original motivation to the Kubernetes 1.16 wave of API
      deprecations, and its early releases quickly added static-file scanning and
      collector fixes so it could work outside a live cluster as well as against kubectl
      and Helm-maintained resources.
  related-projects:
    - >
      kubent is closely tied to kubectl, Helm, kubeconfig files, Open Policy Agent
      rules, and the Kubernetes deprecated API migration guidance.
  sources:
    - https://github.com/doitintl/kube-no-trouble
    - https://github.com/doitintl/kube-no-trouble/releases/tag/0.1.0
    - https://github.com/doitintl/kube-no-trouble/releases/tag/0.3.0
    - https://kubernetes.io/docs/reference/using-api/deprecation-guide/
  summary:
    - >
      kubent is the Homebrew-packaged command name for Kube No Trouble, a Go CLI created
      to find Kubernetes objects that still use API versions scheduled for removal. It
      sits in the upgrade-preparation niche: operators run it before a cluster version
      jump so they can fix manifests, Helm releases, or last-applied kubectl state
      before the Kubernetes API server stops serving old versions.
  timeline:
    - '2020-04-09: Kube No Trouble 0.1.0 was published as the initial public release of kubent.'
    - >
      2020-08-11: Release 0.3.0 added support for reading manifests from local files and
      stdin.
    - '2024-08-30: Release 0.7.3 was listed by the repository as a later tagged release.'
  usage:
    - >
      Typical use points kubent at the active kubeconfig or an explicit kubeconfig path,
      then asks it to collect live resources, Helm manifests, or local YAML/JSON files
      and report API versions that match its deprecation rules. The project also
      documents JSON and CI-friendly output modes for automated gates.
related-packages:
  - id: brew:pluto
    reason: >
      Pluto is an alternative deprecated-API scanner with an especially explicit
      workflow for code repositories, Helm charts, and distinguishing deprecated APIs
      from APIs already removed.
    rel: alternative
    sources:
      - https://github.com/doitintl/kube-no-trouble
      - https://github.com/FairwindsOps/pluto
  - id: brew:kubernetes-cli
    reason: >
      kubent uses kubectl's current context and kubeconfig conventions to authenticate
      to and inspect a live Kubernetes cluster.
    rel: adjacent_workflow
    sources:
      - https://github.com/doitintl/kube-no-trouble
      - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
  - id: brew:helm
    reason: >
      kubent's Helm v3 collector examines manifests stored with Helm releases, so it can
      find deprecated APIs in applications managed by Helm.
    rel: adjacent_workflow
    sources:
      - https://github.com/doitintl/kube-no-trouble
      - https://helm.sh/docs/intro/introduction/
