history:
  adoption-history:
    - >
      Originally associated with the Scarlett 4th Generation range, Focusrite later
      extended Control 2 support to ISA C8X and introduced public-beta compatibility for
      selected Scarlett 2nd and 3rd Generation, Clarett+, and Clarett USB interfaces.
  package-nerd-significance:
    - >
      The Homebrew cask provides a reproducible installation route for proprietary
      audio-interface control software that would otherwise be obtained from Focusrite's
      device-oriented download pages. It is particularly useful when provisioning
      recording workstations alongside DAWs, plug-ins, and other studio tools.
  project-history:
    - >
      Focusrite introduced Focusrite Control 2 for Scarlett 4th Generation interfaces in
      release 1.21.0 on 31 August 2023. It succeeded the earlier Focusrite Control
      application for supported newer hardware and combined interface configuration,
      firmware updates, metering, routing, direct monitoring, and headphone-mix control.
    - >
      Subsequent releases added localization, accessibility improvements, session
      recall, mobile remote control, broader interface support, and continuing
      operating-system and bundled-driver updates.
  related-projects:
    - >
      Focusrite Control, the preceding control application used by earlier Focusrite
      interfaces.
    - >
      Focusrite Control 2 mobile apps for iOS and Android, which pair with the desktop
      application for wireless control.
  sources:
    - 'Focusrite Control 2 product page: https://focusrite.com/software/focusrite-control-2'
    - >
      Official compatibility guide:
      https://support.focusrite.com/hc/en-gb/articles/13208891471250-Which-interfaces-are-compatible-with-Focusrite-Control-2
    - >
      Official release notes:
      https://support.focusrite.com/hc/en-gb/articles/13289679039378-Focusrite-Control-2-Release-Notes
  summary:
    - >
      Focusrite Control 2 is Focusrite's proprietary desktop controller for supported
      Scarlett, Clarett, and ISA audio hardware. It configures preamps, gain-assistance
      features, monitoring mixes, routing, firmware, and related device behavior on
      macOS and Windows.
  timeline:
    - >
      2023-08-31: Focusrite Control 2 1.21.0 launched for Scarlett 4th Generation Solo,
      2i2, and 4i4.
    - >
      2023-09-20: Version 1.51.0 added 12-language localization and accessibility
      improvements.
    - >
      2026: Focusrite documented broader support, including ISA C8X and public-beta
      support for selected older Scarlett and Clarett interfaces.
  usage:
    - >
      Users install the desktop application, connect a supported Focusrite interface,
      and use it to configure input gain, Auto Gain, Clip Safe, Air modes, direct
      monitoring, headphone mixes, routing, and firmware updates. Supported mobile apps
      can pair over the same network for remote control.
