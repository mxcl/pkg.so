id: brew:cruft
display-name: cruft
repo: https://github.com/cruft/cruft
docs:
  - https://cruft.github.io/cruft
config-file-location:
  unix:
    - .cruft.json
    - pyproject.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      cruft's adoption is strongest among teams that maintain many repositories from the
      same Cookiecutter template. Its documentation includes a GitHub Actions workflow
      that checks for template updates and opens pull requests, indicating the tool's
      role in repository-fleet maintenance rather than one-off project creation.
  package-nerd-significance:
    - >
      cruft matters to package maintainers because it treats boilerplate as an updatable
      dependency. That makes template updates closer to dependency upgrades: visible in
      diffs, enforceable in CI, and distributable through Python package managers and
      Homebrew.
  project-history:
    - >
      The project was created to balance the convenience of project generators with the
      maintenance burden they create. Its documentation explains that cruft uses
      Cookiecutter as the template expansion engine, then records template metadata in
      `.cruft.json` so a project can later be checked, diffed, linked, or updated.
    - >
      The Git tag history starts at 2.0.0 in 2020 and reaches 2.16.0 in 2024. The
      repository and documentation remain centered on Python packaging workflows, with
      badges for PyPI, conda-forge, tests, and downloads.
  related-projects:
    - >
      cruft is built around Cookiecutter compatibility and commonly appears with Python
      packaging, PyPI, conda-forge, Poetry, pipenv, and GitHub Actions workflows.
  sources:
    - https://github.com/cruft/cruft#readme
    - https://cruft.github.io/cruft
    - https://github.com/cruft/cruft/tags
    - https://github.com/cruft/cruft/releases
    - https://formulae.brew.sh/formula/cruft
  summary:
    - >
      cruft is a Python command-line tool for creating projects from Cookiecutter
      templates and keeping the generated boilerplate synchronized with later template
      changes. It addresses a common packaging problem: generated project skeletons
      drift after the first copy.
  timeline:
    - '2020: 2.0.0 public tag'
    - '2023: 2.15.0 release'
    - '2024: 2.16.0 release'
  usage:
    - >
      Common commands include `cruft create` for generating a project, `cruft update`
      for pulling template changes, `cruft check` for CI drift detection, `cruft link`
      for attaching an existing Cookiecutter-generated project to its template, and
      `cruft diff` for inspecting changes.
    - >
      cruft stores template URL, commit, answers, and skip settings in `.cruft.json`; it
      can also read skip configuration from `tool.cruft` in `pyproject.toml`.
related-packages:
  - id: brew:cookiecutter
    reason: >
      Cookiecutter supplies the template format and rendering engine that cruft uses,
      while cruft adds persistent template linkage, drift checks, and updates.
    rel: adjacent_workflow
    sources:
      - https://cruft.github.io/cruft/
      - https://cookiecutter.readthedocs.io/
