credentials-file-location: null
history:
  adoption-history:
    - >
      GNU APL serves the small but persistent APL community that wants a free software
      implementation available through GNU mirrors, source repositories, Debian
      packages, and ports for GNU/Linux, BSD, macOS, and Windows environments. The
      project also hosts a community page that collects contributed workspaces,
      libraries, editor modes, bindings, SQL interfaces, plotting tools, and ports.
    - >
      Its ecosystem significance comes less from mass adoption and more from
      preservation: it gives package managers and free software distributions a
      maintained, source-available APL implementation with Unicode support and
      documented extensions.
  package-nerd-significance:
    - >
      For package maintainers, GNU APL is notable because it packages a historically
      specialized language in the familiar GNU Autotools and Savannah ecosystem. It also
      carries practical platform concerns that package builders care about, including
      APL glyph fonts, keyboard mappings, terminal behavior, and optional integrations.
  project-history:
    - >
      Juergen Sauermann announced GNU APL 1.0 on the GNU info list in September 2013
      after several years of development, describing it as a GNU implementation of the
      ISO 13751 APL standard with nested arrays, complex numbers, and shared variables.
      The project kept its source on GNU Savannah and later shifted from occasional
      tarball releases to repository-based bug-fix distribution after the 1.9 release
      line.
    - >
      The interpreter evolved as a large C++ codebase rather than a minimal language
      experiment. Its manual frames GNU APL as an APL interpreter plus GNU-specific
      extensions, and the home page points users to a quick tour, a reference manual,
      Doxygen-generated source documentation, and Savannah repositories for routine
      development use.
  related-projects:
    - APL2 and ISO/IEC 13751 define the language family and standard GNU APL targets.
    - GNU Savannah hosts the project's official source repositories.
    - >
      Community projects include GNU APL editor integrations, APL package/library
      collections, SQL bindings, plotting tools, Android porting work, and keyboard
      helpers.
  sources:
    - https://lists.gnu.org/archive/html/info-gnu/2013-09/msg00014.html
    - https://www.gnu.org/software/apl/
    - https://www.gnu.org/software/apl/Community.html
    - https://www.gnu.org/software/apl/apl.html
  summary:
    - >
      GNU APL is the GNU Project's free interpreter for APL, aimed at ISO/IEC 13751
      Extended APL compatibility while adding practical Unix-style features such as
      scripting, shared variables, file I/O, SQL access, plotting, JSON handling, and
      GTK integration.
  timeline:
    - '2013: GNU APL 1.0 announced on the GNU info list.'
    - '2014: GNU APL community page documented contributed libraries, ports, and workspaces.'
    - 'After 1.9: GNU APL release practice moved toward repository-delivered bug fixes.'
  usage:
    - >
      Practitioners use GNU APL interactively from a terminal, as a script interpreter,
      and as a host for APL workspaces. Typical uses include exploring array-oriented
      algorithms, running old or portable APL code, writing compact data-processing
      scripts, testing ISO APL behavior, and using GNU APL's non-standard system
      functions for files, databases, graphics, JSON, and native integrations.
