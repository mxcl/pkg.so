history:
  adoption-history:
    - >
      Wooshy is distributed as a native macOS application and through the Homebrew Cask
      catalog as `wooshy`.
  package-nerd-significance:
    - >
      Wooshy belongs to the small family of macOS keyboard-navigation tools that expose
      accessibility metadata as a searchable command surface. It is useful to automation
      enthusiasts who want mouse-free interaction without scripting each application
      separately.
  project-history:
    - >
      Wooshy was introduced publicly in 2022 as a keyboard-driven way to search the
      macOS accessibility hierarchy and act on matching interface elements. Its official
      documentation later expanded beyond clicking to navigation, pointer movement, text
      copying, custom mappings, URLs, and distributed-notification integrations.
  related-projects:
    - >
      The developer identifies Shortcat, Vimac, Homerow, Superkey, Scoot, and similar
      keyboard-driven macOS utilities as alternatives.
    - >
      The developer also publishes a related open-source Alfred workflow for bringing
      macOS windows to the foreground.
  sources:
    - https://docs.wooshy.app/
    - https://github.com/godbout/Wooshy.blahblah
    - https://wooshy.app/
    - source_facts.package-manager
  summary:
    - >
      Wooshy is a macOS accessibility and keyboard-navigation utility that searches
      visible user-interface elements and lets users click, navigate, move the pointer,
      or copy text by typing.
  timeline:
    - '2022: The developer announced that Wooshy’s public alpha had started.'
    - >
      2026: The official site documents support for current macOS releases and a
      dedicated documentation site.
  usage:
    - >
      Users invoke Wooshy, type text identifying an interface element, and press Return
      to act on it. The search covers application windows as well as macOS surfaces such
      as the Dock, menu bar, and status items.
