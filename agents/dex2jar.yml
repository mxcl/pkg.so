history:
  adoption-history:
    - >
      dex2jar became a familiar package in Android reverse-engineering and
      security-analysis workflows because it bridged Android .dex bytecode and Java
      tooling. Even when users later inspect output with decompilers or bytecode tools,
      the package often provides the first conversion step from an APK or dex file to a
      jar-shaped artifact.
  package-nerd-significance:
    - >
      dex2jar is notable as a package because it installs a family of narrowly named
      command-line tools rather than a single binary. That makes it a classic
      reverse-engineering formula: many small entry points, stable scripts, and a README
      that doubles as the packaging-facing interface.
  project-history:
    - >
      The official README describes dex2jar as tools for Android .dex and Java .class
      files and notes the project move to GitHub. It preserves links to older
      SourceForge, Bitbucket, and Google Code project homes, which reflects the common
      migration path of early Android reverse-engineering tools into GitHub-era
      maintenance.
    - >
      The current repository organizes the project as multiple tools: dex-reader/writer,
      d2j-dex2jar, smali/baksmali-compatible assembly and disassembly, and additional
      utilities such as string decryption helpers.
  related-projects:
    - >
      smali/baksmali is directly related because dex2jar includes compatible assembly
      and disassembly tools.
    - >
      Java bytecode and Android APK analysis tools are downstream or adjacent consumers
      of dex2jar output.
  sources:
    - https://github.com/pxb1988/dex2jar
    - https://github.com/pxb1988/dex2jar/releases/tag/v2.4
  summary:
    - >
      dex2jar is a command-line toolkit for working with Android Dalvik Executable files
      and Java class or jar files. Package users usually encounter it through
      d2j-dex2jar and the companion d2j-* utilities.
  timeline:
    - >
      Early project era: README records historical homes on Google Code, SourceForge,
      and Bitbucket.
    - 'GitHub era: README marks the project move to GitHub.'
    - '2023-10-03: GitHub release v2.4 was published.'
  usage:
    - >
      The README's example workflow builds the distribution, unpacks dex-tools, and runs
      d2j-dex2jar.sh against an APK path. The output is a jar file named after the
      input, such as apk_to_decompile-dex2jar.jar.
related-packages:
  - id: brew:jadx
    reason: >
      Choose jadx when you want direct APK/DEX-to-Java decompilation and an interactive
      GUI; choose dex2jar when you specifically need JAR/class conversion or its
      lower-level d2j-* utilities.
    rel: alternative
    sources:
      - https://github.com/pxb1988/dex2jar#readme
      - https://github.com/skylot/jadx#readme
  - id: brew:apktool
    reason: >
      Use Apktool alongside dex2jar when an APK workflow also needs decoded Android
      resources and a rebuildable resource tree, while dex2jar handles DEX and Java
      bytecode conversion.
    rel: adjacent_workflow
    sources:
      - https://github.com/pxb1988/dex2jar#readme
      - https://apktool.org/wiki/the-basics/intro
