history:
  adoption-history:
    - >
      By 2019, the founder reported that users had saved 50 million bookmarks in 3
      million collections. Raindrop.io subsequently continued expanding across browsers,
      desktop systems, and mobile platforms while retaining a free tier and optional
      premium capabilities.
  package-nerd-significance:
    - >
      Raindrop.io is notable to package users because it bridges browser-native
      bookmarking with installable desktop and mobile clients, browser extensions,
      import/export tooling, an API, and cloud synchronization. The Homebrew cask
      provides a straightforward installation path for its macOS desktop client.
  project-history:
    - >
      Rustem Mussabekov started Raindrop.io as a personal side project in 2013. At the
      end of 2018 he committed to working on it full-time and forming a company around
      the service.
    - >
      During that transition, the service's original monolithic backend was being broken
      into distributed components for import/export, link parsing, broken-link checking,
      thumbnails, screenshots, and storage. Later product development added richer
      annotation, backup, collaboration, and cross-device features.
  related-projects:
    - Browser extensions provide capture workflows for Chrome, Firefox, Safari, and Edge.
    - The public Raindrop.io API supports third-party integrations.
    - Dropbox and Google Drive can be used for additional backups.
  sources:
    - https://blog.raindrop.io/the-state-of-raindrop-io-2019/
    - https://help.raindrop.io/
    - https://raindrop.io/
  summary:
    - >
      Raindrop.io is a cloud-synchronized bookmark manager for collecting, organizing,
      searching, annotating, and sharing web content across browsers, desktop
      applications, and mobile devices.
  timeline:
    - "2013: Began as Rustem Mussabekov's personal side project."
    - >
      2019: Founder announced a full-time commitment to the product and reported 50
      million saved bookmarks.
    - >
      2023: Official releases added features including reminders, two-factor
      authentication, Markdown bookmark notes, and a rewritten native iOS/iPadOS app.
    - '2025: Official releases added PDF preview/highlighting and a macOS share extension.'
  usage:
    - >
      Users save links and files into collections, classify them with tags, search by
      content or metadata, annotate material, find duplicates or broken links, and
      optionally share collections with collaborators or the public. Import, export, web
      archiving, backups, and browser extensions support migration and capture
      workflows.
