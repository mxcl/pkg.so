history:
  adoption-history:
    - >
      BrightAuthor:connected became BrightSign's primary cross-platform authoring and
      player-management application, replacing the legacy Windows-oriented BrightAuthor
      Classic workflow. BrightSign recommends the desktop application for most users
      while also offering a browser edition through BSN.Cloud.
    - >
      The application supports multiple generations of BrightSign players and publishing
      modes ranging from removable-media and local-network delivery to web folders,
      partner content-management systems, and BrightSign's cloud services.
  package-nerd-significance:
    - >
      The application is important in digital-signage deployment because it joins media
      authoring, device provisioning, content publishing, and fleet management in one
      vendor tool. For Mac package users, the ba-connected cask provides a managed
      installation route for software that is otherwise distributed as a vendor DMG.
  project-history:
    - >
      BrightSign created BrightAuthor:connected as the successor to BrightAuthor
      Classic, adding macOS support, a web application, and direct integration with
      BSN.Cloud. The product has since been rebranded as BrightSign Author, although
      official documentation and release material continue to use BrightAuthor:connected
      where needed for continuity.
  related-projects:
    - >
      BrightAuthor Classic is the legacy authoring application that BrightSign Author
      supersedes.
    - >
      BSN.Cloud provides browser access, cloud provisioning, content storage, and
      network-management services used by the application.
    - >
      BrightSign players are the dedicated digital-signage devices configured and
      supplied with presentations by the application.
    - >
      Homebrew Cask supplies the ba-connected package-manager entry represented by this
      record.
  sources:
    - 'Official general FAQ: https://docs.brightsign.biz/faqs/ucA4-general'
    - 'Official latest releases: https://docs.brightsign.biz/releases/latest'
    - 'Official player quickstart: https://docs.brightsign.biz/player-quickstart'
    - 'Official release history: https://docs.brightsign.biz/releases/brightauthorconnected'
    - >
      Official user guide:
      https://docs.brightsign.biz/user-guides/brightsign-author-brightauthorconnected
  summary:
    - >
      BrightSign Author, formerly BrightAuthor:connected, is BrightSign's desktop and
      web application for configuring players, authoring digital-signage presentations,
      publishing content, and managing devices. The desktop edition is available for
      macOS and Windows and can work with local or cloud-connected publishing workflows.
  timeline:
    - >
      2019: BrightSign product material presented BrightAuthor:connected as a connected
      authoring and BSN.Cloud management environment.
    - '2023: The 1.19 release series expanded localization and Series 5 presentation support.'
    - >
      2025: Product terminology and branding began changing from BrightAuthor:connected
      to BrightSign Author.
    - '2026: Version 1.85.0 added authoring and scripting support for new EV-series players.'
  usage:
    - >
      Operators use the application to provision BrightSign players, create
      presentations containing video, images, audio, HTML, and text, and publish those
      presentations by removable storage, local network, web folder, partner CMS, or
      BSN.Cloud.
    - >
      BSN.Cloud credentials are entered interactively when cloud features are used.
      Official documentation identifies application-support directories for complete
      uninstallation but does not identify a particular supported configuration file or
      credentials file, so no file location is asserted here.
