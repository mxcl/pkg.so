history:
  adoption-history:
    - >
      XRG has persisted as a free, open-source Mac utility across major hardware and
      operating-system transitions. Community patches and acknowledgements throughout
      its changelog show contributions to sensor support, compatibility, performance,
      and presentation.
  package-nerd-significance:
    - >
      XRG is a survivor from the early Mac OS X utility ecosystem. It combines classic
      compact graph-based monitoring with unusually broad coverage—hardware sensors,
      CPU, GPU, memory, storage, network, battery, weather, and market data—and remains
      available as GPL-licensed source.
  project-history:
    - >
      Mike Piatek-Jimenez began X Resource Graph while studying computer science and
      released its first public version on October 24, 2002. He describes it as his
      effort to contribute back to the open-source community from which he had learned
      FreeBSD and Linux.
    - >
      XRG evolved from early CPU, memory, disk, and network graphs through battery, fan,
      temperature, weather, stock, multicore, GPU, and Apple-silicon support. The
      project later became part of Gaucho Software, founded by its author in 2004.
  related-projects:
    - >
      Gaucho Software is the independent Mac software company founded by XRG's author
      after the project's initial release.
  sources:
    - https://gaucho.software/about.html
    - https://gaucho.software/pop-xrg-changelog.html
    - https://gaucho.software/xrg.html
    - https://github.com/mikepj/XRG
  summary:
    - >
      XRG, originally X Resource Graph, is an open-source graphical system monitor for
      macOS created by Mike Piatek-Jimenez.
  timeline:
    - '2002-10-24: First public release of X Resource Graph.'
    - "2004: The developer founded Gaucho Software, which became XRG's product home."
    - '2019: XRG added macOS Catalina support in the 2.7 line.'
    - '2020: XRG 3.0 added Apple-silicon support and a redesigned sensor window.'
    - '2022: XRG 3.1 expanded temperature support for M1 Pro and M1 Max Macs.'
  usage:
    - >
      Users select and arrange compact graphs for CPU, GPU, memory, battery, disk I/O,
      network activity, temperatures and fans, weather, and stock data. Display options
      allow the monitor to remain visible without occupying a conventional dashboard
      window.
    - >
      XRG is especially useful for observing long-running load, bandwidth, battery draw,
      or thermal behavior at a glance. Its source can be built from the official Xcode
      project for users who want to audit or modify the monitor.
