id: brew:doxymacs
display-name: doxymacs
repo: https://sourceforge.net/p/doxymacs/git/ci/master/tree
docs:
  - https://doxymacs.sourceforge.net/
config-file-location:
  unix:
    - ~/.emacs
credentials-file-location: null
history:
  adoption-history:
    - >
      doxymacs' adoption appears niche and editor-specific. Its packaging in Homebrew
      preserves a small workflow tool for developers who used Doxygen tags and Emacs key
      bindings rather than a standalone documentation system.
  package-nerd-significance:
    - >
      doxymacs is package-nerd interesting because it captures a pre-LSP
      editor-integration pattern: a small editor mode, an optional C helper for XML
      parsing, and a dependency on generated Doxygen tag data. It is less important as a
      modern tool than as packaging sediment around Doxygen and Emacs workflows.
  project-history:
    - >
      The official homepage describes doxymacs as Doxygen plus Emacs/XEmacs and says its
      purpose is to create a Lisp package that makes using Doxygen from within those
      editors easier. Version 1.8.0 was released on 10 June 2007.
    - >
      SourceForge file-release metadata shows a release line from at least the 1.1.0
      tarball in June 2001 through 1.8.0 in June 2007. The public evidence points to a
      small, focused editor-extension project from the period when Doxygen, XEmacs, and
      Emacs Lisp helpers were commonly distributed as separate packages.
  related-projects:
    - >
      doxymacs is directly related to Doxygen, GNU Emacs, XEmacs, libxml2, W3, and
      tempo. Its value comes from connecting generated Doxygen documentation and tags
      back into the editor.
  sources:
    - >
      https://doxymacs.sourceforge.net/ - official homepage for project purpose, 1.8.0
      release date, features, dependencies, installation, and usage.
    - >
      https://sourceforge.net/projects/doxymacs/rss?path=/ - official SourceForge file
      feed for release dates from 2001 through 2007.
    - https://sourceforge.net/projects/doxymacs/ - official SourceForge project metadata.
  summary:
    - >
      doxymacs is an Emacs/XEmacs helper package for Doxygen. It makes Doxygen-created
      documentation easier to use from the editor and helps insert Doxygen-style
      comments into source files.
  timeline:
    - '2001: SourceForge file feed lists doxymacs 1.1.0.'
    - '2003: 1.4.0 and 1.5.0 tarballs published.'
    - '2006: 1.7.0 tarball published.'
    - >
      2007: 1.8.0 released with documentation lookup, comment insertion, optional
      external XML parser, and Doxygen keyword fontification.
  usage:
    - >
      Users install the Lisp files into an Emacs load path, require doxymacs from their
      .emacs, enable doxymacs-mode, customize Doxygen root and tag-file variables, and
      use key bindings to look up documentation, rescan tags, or insert Doxygen comment
      templates.
related-packages:
  - id: brew:doxygen
    reason: >
      Doxygen generates the documentation and tag information that doxymacs exposes and
      helps author from inside the editor.
    rel: adjacent_workflow
    sources:
      - https://doxymacs.sourceforge.net/
      - https://www.doxygen.nl/
  - id: brew:emacs
    reason: >
      doxymacs is loaded into GNU Emacs as a Lisp package to provide its documentation
      lookup and comment-insertion commands.
    rel: adjacent_workflow
    sources:
      - https://doxymacs.sourceforge.net/
      - https://www.gnu.org/software/emacs/
