credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents Cargo, Homebrew, binary-release, and Python SDK
      installation paths, and the input package facts also list Homebrew and Nix
      packaging. That distribution pattern is typical for Rust CLIs that serve both
      terminal users and automation workflows.
    - >
      The repository metadata gathered from GitHub showed several thousand stars and
      hundreds of forks by the enrichment date, which is notable for a project started
      in 2024 and consistent with the rapid spread of LLM-context utilities among
      developers.
  package-nerd-significance:
    - >
      Code2Prompt is a representative package from the post-2023 wave of small, fast
      CLIs built to bridge traditional repositories and LLM context windows. Package
      maintainers care about it because it sits at the intersection of Rust CLI
      distribution, language-model workflow automation, and cross-registry publishing
      through Cargo, Homebrew, Nix, PyPI bindings, and binary releases.
    - >
      Its significance is less about a long legacy and more about crystallizing a new
      packaging pattern: a native CLI with a core library, optional SDK bindings, and
      editor or agent-adjacent surfaces.
  project-history:
    - >
      The public GitHub repository was created on 2024-03-09, and the first tagged 1.0.0
      release followed on 2024-03-16. The official README describes the project as a CLI
      for converting a codebase into a single LLM prompt, while later project materials
      frame it as a broader context-engineering tool with a Rust core library, CLI/TUI,
      Python SDK, and MCP server.
    - >
      By the 2025 release line, the project had moved beyond a single command into a
      small tooling family around local code ingestion: respecting ignore rules,
      generating source trees, applying Handlebars templates, counting tokens, reading
      formats such as notebooks and CSV, and including git diffs or logs.
  related-projects:
    - >
      Related tools include other repository-to-prompt utilities, code ingestion CLIs,
      and agent-context servers. Within the project itself, related components include
      `code2prompt-core`, the `code2prompt` CLI/TUI, the `code2prompt-rs` Python SDK,
      and the MCP server described in the official README.
  sources:
    - https://github.com/mufeedvh/code2prompt
    - https://code2prompt.dev/docs/how_to/config/
  summary:
    - >
      Code2Prompt is a Rust-based CLI and companion ecosystem for turning a source tree
      into structured context for large language models. Its niche is the practical
      developer workflow of packaging repository files, source trees, token counts,
      templates, and git context into one promptable artifact.
  timeline:
    - '2024-03-09: Public GitHub repository created.'
    - '2024-03-16: v1.0.0 release published.'
    - '2024: Homebrew and Cargo installation documented in the official README.'
    - '2025: v3 and v4 release lines published, reflecting continued active development.'
  usage:
    - >
      Typical use is running `code2prompt .` against a project directory, optionally
      writing to a file or clipboard, filtering paths, using a `.c2pconfig` TOML file,
      and selecting output formats or tokenizers. The official docs state that
      Code2Prompt looks for `.c2pconfig` in the current working directory and applies
      its rules automatically.
    - >
      The project also targets agentic and programmatic usage: the README describes a
      Python SDK and local MCP server alongside the human-oriented CLI and TUI.
related-packages:
  - id: brew:repomix
    reason: >
      Choose Repomix when you want a repository packer with remote-repository
      processing, code compression, secret detection, and XML, Markdown, or plain-text
      output; Code2Prompt emphasizes prompt templates and its Rust-based CLI, SDK, and
      MCP toolkit.
    rel: alternative
    sources:
      - https://repomix.com/guide/
      - https://code2prompt.dev/docs/welcome/
  - id: brew:gitingest
    reason: >
      Choose Gitingest for a lightweight hosted, Python, or CLI workflow that turns a
      Git repository into a text digest; choose Code2Prompt when you need configurable
      prompt templating and token-aware local processing.
    rel: alternative
    sources:
      - https://gitingest.com/docs
      - https://code2prompt.dev/docs/welcome/
