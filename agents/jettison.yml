history:
  adoption-history:
    - >
      Jettison has been distributed both directly by St. Clair Software and through the
      Mac App Store. Current direct releases support Intel and Apple Silicon Macs.
  package-nerd-significance:
    - >
      Jettison automates a small but consequential macOS ritual: safely ejecting
      external storage before sleep and remounting it after wake. Its support for APFS,
      encrypted volumes, network mounts, NFS, NTFS, extFS, SD cards, and troublesome
      system processes makes it useful on storage-heavy Mac setups.
  project-history:
    - >
      St. Clair Software developed Jettison as a menu-bar utility for automatically
      ejecting external disks when a Mac sleeps and remounting them when it wakes.
      Successive releases expanded the original workflow with shutdown and restart
      handling, keyboard shortcuts, per-disk rules, AppleScript support,
      encrypted-volume handling, Apple Silicon support, and compatibility updates for
      newer macOS releases.
  related-projects:
    - >
      macOS Disk Utility and the diskutil command provide lower-level manual
      disk-management functions.
    - Jettison is one of several macOS utilities published by St. Clair Software.
  sources:
    - https://www.stclairsoft.com/Jettison/faq.html
    - https://www.stclairsoft.com/Jettison/index.html
    - https://www.stclairsoft.com/Jettison/release_notes.html
  summary:
    - >
      Jettison is a proprietary macOS menu-bar utility from St. Clair Software that
      ejects external disks before sleep and remounts them after wake, reducing the risk
      of unplugging storage while writes remain cached.
  timeline:
    - >
      Version 1.4: Added shutdown and restart ejection, hotkeys, and explicit per-disk
      controls.
    - 'Version 1.8: Became a universal application with native Apple Silicon support.'
    - >
      Version 1.9: Added Full Disk Access guidance and expanded APFS and system-volume
      handling.
    - >
      2026: Version 1.9.7 improved rapid remount/eject cycles and menu-bar drive-count
      responsiveness.
  usage:
    - >
      Users normally leave Jettison running in the menu bar, choose which disk types or
      individual volumes it should manage, and let it eject them automatically when the
      Mac sleeps. Menu commands and shortcuts can also eject or mount disks on demand.
    - >
      Advanced behavior can be adjusted through documented macOS defaults keys, while
      ordinary options are exposed in Jettison's Settings or Preferences window.
