history:
  adoption-history:
    - >
      autobrr adoption is visible in seedbox and home-server distribution channels
      rather than only in source-code metrics. The official README and Linux docs list
      installation paths for Swizzin, Saltbox, QuickBox, shared seedbox providers,
      Docker, Windows, macOS and generic Linux, while the input package facts show
      packaging in Homebrew, apk and nix.
    - >
      The project's GitHub metadata showed thousands of stars and hundreds of forks in
      June 2026, which fits its role as a widely recognized tool in the private-tracker
      and media-automation niche.
  package-nerd-significance:
    - >
      For package users, autobrr is interesting because it packages a web service, CLI
      companion, config file, database and service integration into the same
      formula/package. It is not a single fire-and-forget CLI: the package has to land
      in a sensible service layout and preserve state.
    - >
      It also documents the cultural shift from older IRC bots and Perl-era tracker
      automation toward a self-hosted Go binary with a browser UI, Docker images and
      package-manager installs.
  project-history:
    - >
      The official introduction says autobrr development started in early 2020 and
      entered rapid development in summer 2021 after dissatisfaction with using multiple
      tools for one download-automation job. Its own README frames the project as a
      modern replacement influenced by trackarr, autodl-irssi and FlexGet.
    - >
      The public GitHub repository was created on 2021-08-11, and by 2026 it was still
      releasing frequently, with v1.81.0 published on 2026-06-28. The docs and README
      emphasize a web UI, Go backend, React frontend, container support,
      SQLite/PostgreSQL storage, and integrations with torrent clients, Usenet clients,
      notifications, and the *arr ecosystem.
  related-projects:
    - autobrr names trackarr, autodl-irssi and FlexGet as inspirations.
    - >
      The docs position autobrr alongside Radarr, Sonarr, Lidarr, Readarr, Whisparr,
      qBittorrent, Deluge, rTorrent, Transmission, SABnzbd, Torznab, Newznab and
      Prowlarr.
  sources:
    - https://api.github.com/repos/autobrr/autobrr
    - https://api.github.com/repos/autobrr/autobrr/releases
    - https://autobrr.com/installation/linux
    - https://autobrr.com/installation/macos
    - https://autobrr.com/introduction
    - https://github.com/autobrr/autobrr#readme
  summary:
    - >
      autobrr is a Go-and-React download automation service for torrent and Usenet
      workflows, especially private-tracker workflows where reacting to IRC announces
      quickly can matter more than periodically polling RSS feeds.
  timeline:
    - '2020: Development begins, according to the official introduction.'
    - >
      2021: Rapid development begins in summer; the GitHub repository is created on
      2021-08-11.
    - '2026: v1.81.0 is published on GitHub releases on 2026-06-28.'
  usage:
    - >
      A typical autobrr setup creates a config directory, runs the daemon, opens the web
      UI, then configures indexers, IRC channels, filters and actions. On Linux the
      official docs use ~/.config/autobrr and systemd; on macOS the docs show Homebrew
      and /opt/homebrew/var/autobrr as the service config directory.
    - >
      The key usage pattern is event-driven release handling: autobrr listens to IRC
      announce channels or feeds, applies filters, then forwards matching torrents or
      NZBs to qBittorrent, Deluge, rTorrent, Transmission, SABnzbd, Sonarr, Radarr and
      related services.
related-packages:
  - id: brew:flexget
    reason: >
      Choose FlexGet when you need a general YAML-and-plugin content automation engine
      rather than autobrr's tracker-announcement-first workflow.
    rel: alternative
    sources:
      - https://autobrr.com/introduction
      - https://www.flexget.com/
      - https://flexget.readthedocs.io/en/stable/
  - id: cask:sabnzbd
    reason: autobrr can send matching Usenet releases directly to SABnzbd as a configured action.
    rel: adjacent_workflow
    sources:
      - https://autobrr.com/introduction
      - https://sabnzbd.org/wiki/
