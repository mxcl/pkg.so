history:
  adoption-history:
    - >
      SessionWatcher developed from a single-purpose rate-limit monitor into a
      multi-provider tool covering Claude, Codex, Cursor, Copilot, Gemini, OpenCode, and
      other AI services. Later releases added multiple-account support, widgets,
      provider comparisons, and broader cost and quota tracking.
  package-nerd-significance:
    - >
      SessionWatcher represents a new class of developer utility created around metered
      AI coding tools. It makes otherwise scattered quota, reset, token, and cost
      information visible in the macOS menu bar and is available as a Homebrew cask.
  project-history:
    - >
      Founder Soren Starck says he created SessionWatcher after repeatedly losing
      working time to unexpected AI-tool rate limits. The official release record
      documents a major OAuth-based rewrite in March 2026, followed by rapid expansion
      to additional providers and account types.
  related-projects:
    - Claude Code
    - OpenAI Codex
    - Cursor
    - GitHub Copilot
    - Gemini CLI
    - OpenCode
  sources:
    - 'Official homepage: https://sessionwatcher.com/'
    - 'Official release notes: https://sessionwatcher.com/releases'
    - 'Official setup guide: https://sessionwatcher.com/guides/sessionwatcher-setup-guide'
  summary:
    - >
      SessionWatcher is a native macOS menu-bar utility for observing AI
      coding-assistant quotas, reset windows, token consumption, and estimated costs.
  timeline:
    - 'March 2026: Version 4.0 introduced an OAuth-based rewrite and automatic updates.'
    - >
      April 2026: Version 6.0 expanded monitoring to Cursor, GitHub Copilot, and Gemini
      Code Assist.
    - 'July 2026: Version 6.5 broadened support to additional AI providers.'
    - 'September 2026: The 7.4 series expanded multi-account monitoring and widgets.'
  usage:
    - >
      Developers keep SessionWatcher running in the menu bar to see approaching rate
      limits, receive threshold notifications, compare available tools, and inspect
      token or cost history without repeatedly opening provider dashboards. The official
      setup documentation says no configuration file is required.
