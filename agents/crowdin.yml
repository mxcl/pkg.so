history:
  adoption-history:
    - >
      Crowdin's own documentation and README emphasize CI/CD and integration with
      GitHub, GitLab, Jenkins, CircleCI, Docker, npm, Homebrew, Chocolatey, and release
      assets. The README also advertises package download badges and a GitHub dependents
      badge, reflecting use both as a local binary and as automation infrastructure.
  package-nerd-significance:
    - >
      Crowdin CLI is significant because localization becomes part of the package build
      and release loop. A package maintainer can treat translations as artifacts
      synchronized by a repeatable CLI rather than a manual web-console step, which is
      why distribution through Homebrew, npm, Docker, Chocolatey, and Winget matters.
  project-history:
    - >
      The official repository describes Crowdin CLI as an open source, cross-platform
      terminal tool for managing and synchronizing localization resources. The public
      tag history begins with the 2.x series, and the current 4.x line is distributed
      through GitHub releases and common package channels.
  related-projects:
    - >
      Crowdin CLI is tied to Crowdin and Crowdin Enterprise APIs, the Crowdin
      configuration-file format, and automation systems such as GitHub, GitLab, Jenkins,
      and CircleCI.
  sources:
    - https://github.com/crowdin/crowdin-cli#readme
    - https://crowdin.github.io/crowdin-cli/
    - https://developer.crowdin.com/configuration-file/
    - https://github.com/crowdin/crowdin-cli/releases
    - https://formulae.brew.sh/formula/crowdin
  summary:
    - >
      Crowdin CLI is the official command-line client for synchronizing localization
      resources between a source tree and Crowdin projects. It is a developer-tools
      package because it moves translation upload, download, status, and
      project-resource management into scripts, CI jobs, and terminal workflows.
  timeline:
    - '2020s: 2.x public tag series'
    - '2023: 4.x line established by release history'
    - '2026: 4.14.x releases'
  usage:
    - >
      Typical use is to keep source files and translations in sync: upload source
      content, download translations into configured paths, upload existing
      translations, check status, and manage files, branches, strings, glossaries,
      translation memories, tasks, distributions, screenshots, labels, apps, and
      context.
    - >
      The CLI uses a configuration file for project mapping and authentication details
      such as token, project ID, base URL, base path, and file patterns. Command-line
      config options can override file values, which makes the tool friendly to CI
      environments that inject credentials.
related-packages:
  - id: brew:phrase-cli
    reason: >
      Choose Phrase CLI when the localization project is hosted on Phrase Strings; like
      Crowdin CLI it pushes and pulls translation files, but it targets Phrase's API and
      `.phrase.yml` workflow rather than Crowdin projects.
    rel: alternative
    sources:
      - https://support.crowdin.com/cli-tool/
      - https://support.phrase.com/hc/en-us/articles/5822548113436-Libraries-and-Tools-Strings
      - https://support.phrase.com/hc/en-us/articles/5784093863964-CLI-Installation-Strings
