history:
  adoption-history:
    - >
      jcode is distributed as a Homebrew formula and through project-provided builds and
      an installation script. Its provider support spans hosted model services,
      OAuth-based coding subscriptions, and local OpenAI-compatible runtimes such as
      Ollama and LM Studio.
  package-nerd-significance:
    - >
      jcode is notable to package users as a Rust-native terminal agent designed around
      low memory use and concurrent agent sessions. Its broad provider abstraction and
      editable TOML configuration make it attractive to users who want to move between
      cloud subscriptions, direct APIs, and local models without replacing the terminal
      workflow.
  project-history:
    - >
      jcode emerged as an open-source terminal coding-agent harness written in Rust. The
      project subsequently expanded from interactive coding assistance into
      parallel-agent workflows, provider profiles, MCP integration, headless
      authentication, and support for self-hosted OpenAI-compatible endpoints.
  related-projects:
    - >
      Claude Code, Codex CLI, OpenCode, Ollama, LM Studio, and GitHub Copilot are
      adjacent tools or services documented as authentication, migration, or provider
      surfaces.
  sources:
    - https://github.com/1jehuang/jcode#readme
    - https://github.com/1jehuang/jcode/tree/master/docs
    - https://jcode.sh/
    - source_facts.package-manager
  summary:
    - >
      jcode is an open-source, Rust-based AI coding-agent harness for terminal use,
      emphasizing low memory consumption, parallel sessions, and compatibility with
      numerous hosted and local model providers.
  timeline:
    - Project established as an open-source Rust terminal coding agent.
    - >
      Provider support expanded to subscription logins, direct APIs, and local
      OpenAI-compatible services.
    - Named provider profiles and secret-safe configuration workflows were added.
  usage:
    - >
      Users launch jcode in a terminal for interactive coding work or invoke its
      run-oriented commands from scripts. Provider login commands configure hosted
      services, while provider profiles in `~/.jcode/config.toml` support custom and
      self-hosted endpoints. MCP servers can be configured in `~/.jcode/mcp.json`.
related-packages:
  - id: brew:opencode
    reason: >
      Choose OpenCode as an alternative open-source terminal coding agent when its
      terminal, IDE, desktop, and broad provider workflow better matches your
      environment.
    rel: alternative
    sources:
      - https://jcode.sh/docs
      - https://opencode.ai/docs/
  - id: brew:ollama
    reason: >
      Run Ollama alongside jcode when you want jcode's agent interface to use a locally
      hosted model through its documented Ollama provider login.
    rel: adjacent_workflow
    sources:
      - https://jcode.sh/docs
      - https://docs.ollama.com/
