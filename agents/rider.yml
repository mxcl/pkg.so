id: cask:rider
display-name: JetBrains Rider
repo: null
docs:
  - https://www.jetbrains.com/help/rider
config-file-location:
  linux:
    - ~/.config/JetBrains/Rider<version>/
  macos:
    - ~/Library/Application Support/JetBrains/Rider<version>/
  windows:
    - '%APPDATA%\JetBrains\Rider<version>\'
credentials-file-location: null
history:
  adoption-history:
    - >
      Rider progressed from private previews to a public Early Access Program in
      November 2016. JetBrains later reported that it had become a successful
      cross-platform .NET IDE and cited its recognition among well-liked developer
      tools.
  package-nerd-significance:
    - >
      Rider combines several established JetBrains technology stacks in one proprietary
      desktop package. For package-manager users, its cask provides a repeatable
      installation path for an otherwise large, independently released IDE.
  project-history:
    - >
      JetBrains conceived Rider by combining ReSharper's .NET analysis engine with the
      IntelliJ Platform. The company revealed Project Rider in January 2016, opened its
      preview publicly that November, and released Rider 2017.1 as the first production
      version on August 3, 2017.
  related-projects:
    - >
      Rider is closely related to ReSharper and IntelliJ IDEA. It also incorporates
      technology associated with dotPeek, dotCover, dotTrace, dotMemory, DataGrip, and
      WebStorm.
  sources:
    - https://blog.jetbrains.com/dotnet/2017/08/03/rider-2017-1-jetbrains-net-ide-hits-rtm/
    - https://blog.jetbrains.com/dotnet/2022/08/03/happy-5th-birthday-rider/
    - https://www.jetbrains.com/rider/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      JetBrains Rider is a cross-platform IDE for .NET and game development, built from
      JetBrains' ReSharper and IntelliJ technologies.
  timeline:
    - '2016: JetBrains revealed Project Rider and later opened its public preview.'
    - '2017: Rider 2017.1 reached general availability on August 3.'
  usage:
    - >
      Developers use Rider to edit, build, test, debug, profile, and refactor .NET
      applications on Windows, macOS, and Linux, including ASP.NET and Unity projects.
