history:
  adoption-history:
    - >
      Tartelet emerged from Shape's need to operate isolated macOS GitHub Actions jobs
      on its own Apple hardware. The project publishes signed application releases and
      documents both a basic runner setup and advanced workflows for iOS and Kotlin
      Multiplatform builds.
  package-nerd-significance:
    - >
      Tartelet packages a normally bespoke CI-infrastructure pattern into a native macOS
      application: recycling ephemeral Tart virtual machines as self-hosted GitHub
      Actions runners. This gives teams isolation and parallelism while retaining
      control of Apple hardware and build environments.
  project-history:
    - >
      Tartelet was created at the Danish company Shape, later represented by the
      framna-dk GitHub organization. It builds on Tart and Apple's Virtualization
      framework and was heavily inspired by Cilicon.
    - >
      The project initially transferred runner setup resources through a shared folder.
      Later releases switched runner configuration and startup to SSH, and subsequent
      releases added lifecycle scripting and other fleet controls.
  related-projects:
    - >
      Tart performs the underlying creation, cloning, execution, and deletion of macOS
      virtual machines.
    - >
      GitHub Actions supplies the self-hosted runner software registered inside each
      virtual machine.
    - Cilicon is acknowledged by the maintainers as an inspiration.
  sources:
    - https://github.com/framna-dk/tartelet#readme
    - https://github.com/framna-dk/tartelet/releases
    - https://github.com/framna-dk/tartelet/wiki
    - https://github.com/framna-dk/tartelet/wiki/Configuring-Tartelet
  summary:
    - >
      Tartelet is a native macOS application that manages self-hosted GitHub Actions
      runners inside ephemeral Tart virtual machines.
  timeline:
    - >
      2023: The official installation and configuration wiki documented the public
      deployment workflow.
    - '2024: The 0.8 series changed runner setup and startup to use SSH.'
    - '2026: The 0.12 series continued development of runner and Tart integration.'
  usage:
    - >
      An operator installs Tart and Tartelet on a Mac host, creates a prepared macOS
      virtual-machine image, configures a GitHub App and SSH access, and starts a fleet.
      For each job, Tartelet clones and boots a virtual machine, registers a runner,
      executes the job, unregisters the runner, and destroys the machine.
    - >
      GitHub App private keys are imported into the host's macOS Keychain rather than
      retained as a documented standalone credentials file. Other settings are
      configured through the application UI; the official user documentation does not
      specify a configuration-file path.
