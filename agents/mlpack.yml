history:
  project-history:
    - >
      The project grew into a broader scientific-computing library and community. A 2018
      OpenReview workshop paper described mlpack as emphasizing speed and flexibility
      and implementing a wide variety of machine-learning algorithms. The 2023 JOSS
      paper for mlpack 4 marked a major technical milestone: a fast, header-only C++
      library release with authorship spanning the expanded contributor community.
  sources:
    - https://formulae.brew.sh/formula/mlpack
    - https://github.com/mlpack/mlpack
    - https://jmlr.org/papers/v14/curtin13a.html
    - https://joss.theoj.org/papers/10.21105/joss.05026
    - https://openreview.net/forum?id=rJxx0Y6NhX
    - https://raw.githubusercontent.com/mlpack/mlpack/master/README.md
    - https://www.mlpack.org/
  summary:
    - >
      mlpack is an open-source C++ machine-learning library whose published history
      traces back to an original inception in 2007 and a public late-2011 release. The
      2013 JMLR paper by Ryan R. Curtin, James R. Cline, N. P. Slagle, William B. March,
      Parikshit Ram, Nishant A. Mehta, and Alexander G. Gray presented MLPACK as a
      scalable, multi-platform C++ library with a simple API for new users and
      high-performance flexibility for expert users.
  usage:
    - >
      In practice mlpack is used either as a C++ library, commonly by including
      `<mlpack.hpp>` and linking against Armadillo, or through command-line programs and
      bindings for Python, Julia, Go, and R. Its own README describes the project as a
      machine-learning analogue to LAPACK and as a "swiss army knife" for
      machine-learning researchers, while the homepage names Armadillo, ensmallen, and
      cereal as core foundations. In package-manager ecosystems it occupies the
      intersection of scientific C++ development library and installed algorithm CLI
      suite, with Homebrew exposing many `mlpack_*` executables for common methods such
      as k-means, PCA, nearest-neighbor search, random forests, regression, and
      preprocessing.
