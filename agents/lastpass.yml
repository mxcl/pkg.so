history:
  adoption-history:
    - >
      LastPass grew from a small Virginia startup into a multi-platform password manager
      for consumers, families, teams, and enterprises. It added Xmarks through
      acquisition in 2010 and was itself acquired by LogMeIn in 2015.
    - >
      LogMeIn's ownership expanded LastPass's organizational reach and product family.
      LastPass later separated from GoTo and completed its transition to an
      independently operated company in 2024.
    - >
      The Mac application is one client in a wider ecosystem that also includes browser
      extensions, mobile applications, web access, authentication tools, and business
      administration products.
  package-nerd-significance:
    - >
      LastPass helped normalize cloud-synchronized password vaults and browser autofill
      as everyday developer and power-user infrastructure. Its cross-browser and
      cross-device model made it a common way to carry many generated credentials
      between workstations.
    - >
      For Homebrew Cask users, the package provides a scripted installation route for
      the native macOS client. The security-sensitive vault remains managed by LastPass
      rather than exposed as a conventional plaintext credentials file.
  project-history:
    - >
      Four developers founded LastPass in Virginia in 2008 with the goal of making
      logins secure and easier to use. The product centered on an encrypted vault that
      could synchronize across devices while performing encryption and decryption
      locally.
    - >
      LastPass acquired the cross-browser synchronization service Xmarks in 2010.
      LogMeIn acquired LastPass in 2015, and the product subsequently added offerings
      such as LastPass Authenticator and a family plan.
    - >
      In 2021, LogMeIn announced plans to establish LastPass as a standalone company.
      The separation from the renamed GoTo organization was completed in May 2024, with
      LastPass continuing under its own leadership and infrastructure.
  related-projects:
    - >
      Xmarks was acquired by LastPass in 2010 and brought cross-browser synchronization
      experience into the company.
    - LastPass Authenticator complements the password manager with multifactor authentication.
    - >
      GoTo, formerly LogMeIn, owned LastPass from the 2015 acquisition until the
      completed 2024 separation.
  sources:
    - https://blog.lastpass.com/posts/celebrating-10-years-lastpass
    - >
      https://blog.lastpass.com/posts/lastpass-investing-even-more-in-your-password-security-in-2022
    - https://www.lastpass.com/
    - https://www.lastpass.com/company/about-us
    - https://www.lastpass.com/company/newsroom/b948ad48-3268-4c9e-8b45-0d6d02d0b4e7
    - https://www.lastpass.com/password-manager/apple-safari
  summary:
    - >
      LastPass is a password and access-management service founded in 2008, offered
      through native applications, browser extensions, mobile clients, and a web vault.
  timeline:
    - '2008: Four developers founded LastPass in Virginia.'
    - '2010: LastPass acquired Xmarks.'
    - '2015: LogMeIn acquired LastPass.'
    - '2017: LastPass added an authenticator application and a family plan.'
    - '2021: LogMeIn announced plans to establish LastPass as a standalone company.'
    - '2024: LastPass completed its separation from GoTo.'
  usage:
    - >
      Users create or sign in to a LastPass account, store credentials and other
      sensitive records in an encrypted vault, and use the Mac application or browser
      extension to generate, retrieve, and autofill logins.
    - >
      The service synchronizes vault data across supported clients. Business deployments
      add shared vaults, access controls, onboarding and offboarding, policies,
      reporting, and multifactor or passwordless authentication features.
