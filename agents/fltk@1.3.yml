history:
  adoption-history:
    - >
      FLTK's adoption has been tied to its small static-linkable footprint,
      cross-platform API, and FLUID UI builder. The 1.3 documentation notes that FLTK is
      included with several Linux distributions, reflecting its role as a packaged GUI
      toolkit rather than only an upstream source tarball.
  package-nerd-significance:
    - >
      FLTK is package-nerd interesting because it represents the old-school Unix
      GUI-toolkit ideal: small source tree, optional static linking, low dependency
      surface, portable C++ headers, and helper binaries that make it easy for package
      managers to expose build flags to downstream software.
    - >
      The versioned fltk@1.3 package matters because FLTK 1.3 became a compatibility
      branch after newer 1.4 and 1.5 development moved on, so distributions and build
      systems can keep software targeting the 1.3 ABI/API alive without forcing an
      immediate toolkit migration.
  project-history:
    - >
      FLTK was originally developed by Bill Spitzak after earlier work on lightweight
      GUI ideas, Forms-style widgets, OpenGL/GLX portability, and a C++ rewrite. The
      official 1.3 manual describes FLTK as a toolkit for Unix/Linux, Windows, and
      macOS, maintained by a small developer group with its central repository on
      GitHub.
    - >
      The 1.3 line modernized the stable FLTK 1.x API with UTF-8 Unicode handling,
      international input methods, printing support, and new widgets such as Fl_Tree and
      Fl_Table while preserving broad source compatibility with the prior FLTK 1.1 API.
  related-projects:
    - >
      FLTK grew out of ideas related to the Forms Library on SGI systems and keeps
      compatibility headers for both XForms-style code and GLUT-style OpenGL use.
    - >
      FLTK 1.4 and FLTK 1.5 are the successor lines for new FLTK development, while
      dormant FLTK 2.0 and FLTK 3 efforts are part of the project's version history.
  sources:
    - https://www.fltk.org/articles.php?L1086=
    - https://www.fltk.org/articles.php?L825=
    - https://www.fltk.org/doc-1.3/intro.html
  summary:
    - >
      FLTK 1.3 is the long-lived 1.x branch of the Fast Light Toolkit, a small
      cross-platform C++ GUI toolkit that ships both a library and developer tools such
      as fltk-config and FLUID.
  timeline:
    - '1987: Bill Spitzak developed early GUI toolkit ideas on NeXT systems.'
    - '2001: FLTK 1.0.11 was released as an early stable 1.x release.'
    - '2009: FLTK 1.1.10 was released and became the established pre-1.3 branch.'
    - >
      2011: FLTK 1.3.0 was released with UTF-8, international input, printing, and new
      widgets.
    - >
      2025: FLTK 1.3.11 was released; upstream later described FLTK 1.3 development as
      stopped in favor of 1.4 maintenance and 1.5 development.
  usage:
    - >
      Developers use FLTK to build native GUI applications in C++, often using
      fltk-config for compiler/linker flags and FLUID to generate editable C++ interface
      code. FLTK 1.3 is specifically useful for projects that want the mature 1.x API
      with Unicode and modern platform fixes.
related-packages:
