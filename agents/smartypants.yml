history:
  adoption-history:
    - >
      SmartyPants became useful wherever plain text was converted to web output. The
      official history added Blosxom, BBEdit, command-line use, and automatic
      integration with Markdown in Movable Type; the supplied package metadata shows
      later packaging in Homebrew, Alpine, Debian, and Ubuntu variants.
  package-nerd-significance:
    - >
      Package maintainers care because SmartyPants is a classic tiny text filter: old
      Perl, web-publishing conventions, command-line use, and compatibility behavior all
      matter more than churn. It is also historically adjacent to Markdown, which makes
      it familiar to documentation and static-site toolchains.
  project-history:
    - >
      The official project page records SmartyPants 1.0 as released on November 13,
      2002. It began as a free web publishing plug-in for Movable Type and later
      supported Blosxom, BBEdit, and Unix-style command-line use.
  related-projects:
    - >
      The official page discusses Movable Type, Blosxom, BBEdit, MT-Textile, Textile,
      and Markdown integration.
  sources:
    - >
      https://daringfireball.net/projects/smartypants/: official description, version
      history, supported tools, command-line note, and release dates.
    - 'input source_facts.package-manager: Homebrew, Alpine, Debian, and Ubuntu package names.'
  summary:
    - >
      SmartyPants is John Gruber's typography filter for turning plain ASCII punctuation
      into typographic HTML entities. In package-manager culture it is a small but
      durable text-processing command, tied to early weblog tooling and the same Daring
      Fireball ecosystem that produced Markdown.
  timeline:
    - '2002: SmartyPants 1.0 initial release.'
    - >
      2003: Version 1.2 became a combination plug-in for Movable Type, Blosxom, BBEdit,
      and standalone command-line use.
    - '2004: Version 1.5 added automatic Markdown integration for Movable Type.'
    - '2004: Version 1.5.1 was published as the downloadable release on the official page.'
  usage:
    - >
      The tool converts straight quotes, backtick quote notation, dash sequences, and
      three dots into smart quote, dash, and ellipsis HTML entities while avoiding
      code-like HTML blocks such as `pre`, `code`, `kbd`, and `script`.
