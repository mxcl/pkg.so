history:
  adoption-history:
    - >
      Its adoption profile is typical of niche terminal games: it is interesting enough
      to be packaged by Unix-like distributions, but it remains a focused package rather
      than a broad gaming platform. The official page emphasizes quick command-line
      starts, local play, and multiplayer server/client commands.
  package-nerd-significance:
    - >
      For package-history work, Curse of War is a useful example of the long tail of
      ncurses games: small upstream, simple executable, GPL licensing, and enough Unix
      packaging interest to survive as a formula even though the project is not a
      mainstream game.
  project-history:
    - >
      The public GitHub repository was created in 2013 and the official project page
      presents the game as an RTS influenced by Globulation2, Liquidwar, Settlers,
      StarCraft, tty games, and roguelikes. Version tags show a compact release line
      through the 1.x series, including v1.2.0, the release line associated by the
      project page with the SDL graphical version.
  related-projects:
    - >
      The project page names Globulation2, Liquidwar, Settlers, StarCraft, tty games,
      and roguelikes as influences.
  sources:
    - https://a-nikolaev.github.io/curseofwar/
    - https://api.github.com/repos/a-nikolaev/curseofwar
    - https://api.github.com/repos/a-nikolaev/curseofwar/tags?per_page=20
  summary:
    - >
      Curse of War is a small terminal-first real-time strategy game that treats the
      command line as the game surface rather than just a launcher. Its official site
      describes it as a fast-paced action strategy game for Linux, originally
      implemented with ncurses, with an SDL graphical version added later.
  timeline:
    - '2013: Public GitHub repository created.'
    - '2013: Early 1.x release tags appear in the upstream repository.'
    - '2014: v1.3.0 tagged in the upstream release history.'
    - '2024: Repository still received upstream activity.'
  usage:
    - >
      Users run `curseofwar` directly, tune maps and game conditions with command-line
      options, and can start a multiplayer server or client from the terminal. The
      appeal is immediate play from a package-manager install without a large asset
      pipeline or desktop launcher.
