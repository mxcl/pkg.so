history:
  adoption-history:
    - >
      kogiQA is available as a desktop application for macOS, Windows, and Linux, as an
      npm SDK named `kogi`, and through platform package managers including Homebrew,
      WinGet, and apt.
  package-nerd-significance:
    - >
      kogiQA combines a desktop recorder, an npm automation SDK, and hosted browser
      execution. Its distinctive package-level feature is natural-language element
      targeting instead of exposing CSS or XPath selectors as the normal test interface.
  project-history:
    - >
      kogiQA was developed as an independent UI-automation product focused on expressing
      interactions in natural language and making tests less dependent on changing DOM
      selectors. The official site describes its team as small and independent.
  related-projects:
    - >
      The `kogi` npm package is kogiQA's JavaScript SDK and is used to run exported
      automation code.
    - >
      The kogiQA cloud runner executes sessions in hosted Chrome, Firefox, or Safari
      environments.
  sources:
    - 'Official JavaScript SDK documentation: https://www.kogiqa.com/sdks/javascript'
    - 'Official getting-started guide: https://kogiqa.com/howToGetStarted/'
    - 'Official product page: https://www.kogiqa.com/'
  summary:
    - >
      kogiQA is a cross-platform UI automation and testing system that identifies
      interface elements through natural-language descriptions rather than conventional
      CSS or XPath selectors.
  timeline:
    - >
      Current distribution: Desktop packages are published for macOS, Windows, and Linux
      alongside the `kogi` npm SDK.
  usage:
    - >
      Users can record browser interactions in the desktop interface and export runnable
      JavaScript, or write tests directly with the `kogi` SDK. Sessions can control a
      local browser or run in kogiQA's cloud.
    - >
      An API token is created in the desktop application's Settings → API Keys area and
      supplied to `Browser.start`. Cloud-run recordings can be replayed, inspected, and
      downloaded from the desktop application.
