history:
  adoption-history:
    - >
      The README frames tries as useful for lexical analyzers and spelling dictionaries,
      and the NEWS file explicitly mentions LibThai word-breaking performance
      improvements in 2015. Its package availability across Homebrew, Debian, Fedora,
      Arch, Nix, MacPorts, and other systems reflects its role as a low-level dependency
      rather than a widely invoked application.
  package-nerd-significance:
    - >
      libdatrie is the kind of package that shows why distro dependency graphs matter: a
      tiny C library, an old but useful data structure, a command-line utility, and
      years of portability fixes that keep language and dictionary packages building
      cleanly.
  project-history:
    - >
      The upstream README traces libdatrie to an earlier C++ library named midatrie and
      to Junichi Aoe's double-array trie structure. The project page says the
      implementation was simplified and rewritten from scratch in C, with libdatrie
      0.1.0 released on 18 September 2006.
    - >
      Release notes show a conservative library-maintenance rhythm: ABI and file-format
      changes before 0.2.0, portability fixes for Mac, Cygwin, MinGW, NetBSD, and
      Windows, Doxygen documentation updates, serialization APIs, and build-system
      cleanup. The package has stayed intentionally focused on the data structure rather
      than becoming a broad NLP toolkit.
  related-projects:
    - >
      midatrie is the direct predecessor. LibThai is a notable downstream
      text-processing user, and Aoe's double-array trie paper is the algorithmic
      reference cited by upstream.
  sources:
    - https://github.com/tlwg/libdatrie
    - https://linux.thai.net/~thep/datrie/datrie.html
    - https://raw.githubusercontent.com/tlwg/libdatrie/master/NEWS
    - https://raw.githubusercontent.com/tlwg/libdatrie/master/README
  summary:
    - >
      libdatrie is Theppitak Karoonboonyanan's C implementation of a double-array trie,
      packaged as a small LGPL library plus the trietool command. It occupies a durable
      niche in text-processing stacks that need compact dictionary lookup.
  timeline:
    - '2001: The older midatrie C++ releases appeared on the original project page.'
    - >
      2006: libdatrie 0.1.0 was released as a C rewrite with a BASE-TAIL double-array
      trie structure.
    - '2009: libdatrie 0.2.0 added performance APIs and started the 0.2 series.'
    - >
      2015: libdatrie 0.2.9 renamed trietool-0.2 to trietool and documented LibThai
      performance improvements.
    - >
      2018: libdatrie 0.2.11 and 0.2.12 focused on correctness, C90 portability, and
      compiler-warning fixes.
    - >
      2021: libdatrie 0.2.13 added memory-buffer serialization APIs and more portability
      fixes.
    - >
      2025: libdatrie 0.2.14 cleaned up build dependencies, parallel-build issues, and
      error handling.
  usage:
    - >
      Users can link the C library for trie storage and lookup or use trietool to create
      and inspect trie data. The alphabet-map detail in the original project notes is
      important: applications define a compact character mapping before building trie
      storage.
