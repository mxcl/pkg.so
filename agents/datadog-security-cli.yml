id: cask:datadog-security-cli
display-name: Datadog Security CLI
repo: null
docs:
  - https://docs.datadoghq.com/security/cloud_security_management/setup
  - https://docs.datadoghq.com/security/cloud_security_management/setup/ci_cd
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The CLI is distributed through Datadog package repositories and Homebrew cask. Its
      package-manager role is to make image scanning easy to add to Debian/Ubuntu, Red
      Hat/CentOS, macOS, and common CI providers.
  package-nerd-significance:
    - >
      The package is notable as a vendor security scanner packaged for CI shells: small
      installation surface, environment-variable credentials, and direct fit with
      pipeline scripts.
  project-history:
    - >
      Datadog's official Cloud Security documentation says the CLI is provided for
      CI/CD-based container image scanning, runs directly inside CI jobs, and is in
      Preview.
  related-projects:
    - >
      Datadog Cloud Security Vulnerabilities, Datadog Agent, container registries,
      Docker, and CI systems are adjacent parts of the workflow.
  sources:
    - https://docs.datadoghq.com/security/cloud_security_management/setup/
    - https://docs.datadoghq.com/security/cloud_security_management/setup/ci_cd/
    - source_facts.version
  summary:
    - >
      Datadog Security CLI is a Datadog-provided command-line tool for scanning
      container images for vulnerabilities in CI/CD pipelines and during local
      development.
  timeline:
    - '2026: The Homebrew cask input records packaged version 0.0.6-1.'
    - '2026: Official docs describe the Datadog Security CLI as Preview software.'
  usage:
    - >
      Users configure DD_API_KEY, DD_APP_KEY, and DD_SITE, then run datadog-security-cli
      image against a container image. Options include --no-persist for local scans,
      --fail-on severity thresholds, and --output json.
tags:
  - ci
  - cli
  - container-image-scanning
  - datadog
  - security
  - vulnerability-scanning
provenance:
