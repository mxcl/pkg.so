  summary:
    - >
      Yandex Telemost is Yandex's hosted video-meeting platform, available through a
      native desktop application as well as web and mobile clients.
  timeline:
    - >
      Desktop era: Yandex published native Telemost applications for macOS and Windows
      alongside its browser client.
  usage:
    - >
      Users create or join meetings by link, manage microphones and cameras, share
      screens, exchange chat messages, and optionally record meetings. A Yandex account
      supplies the user's profile, but some meeting participation is possible without
      signing in.
