history:
  adoption-history:
    - >
      Yandex offers Telemost through desktop, browser, and mobile surfaces. The desktop
      documentation describes meetings of up to 40 participants without a time limit,
      while Yandex 360 business documentation adds organization-oriented administration
      and live-stream capabilities.
  package-nerd-significance:
    - >
      The Homebrew cask provides a package-manager installation path for the native
      macOS client of an otherwise vendor-operated conferencing service.
  project-history:
    - >
      Telemost was developed as Yandex's video-conferencing service and is documented as
      part of the broader Yandex 360 product family.
  related-projects:
    - Yandex 360
    - Yandex Calendar
  sources:
