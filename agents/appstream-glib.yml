history:
  adoption-history:
    - >
      AppStream-Glib was closely tied to GNOME Software and Fedora-style metadata
      generation. Its appstream-builder documentation describes extracting application
      metadata from package trees, writing XML archives and icon tarballs, and injecting
      that data into repository metadata with modifyrepo.
    - >
      The tool was adopted by Linux distributions because software centers needed
      app-centric metadata that traditional package metadata did not provide: icons,
      screenshots, localized descriptions, release notes, content ratings, and
      validation rules.
  package-nerd-significance:
    - >
      AppStream-Glib is one of the utilities that made package repositories feel less
      like file indexes and more like app stores. It matters to package nerds because it
      bridges distro package metadata, desktop files, AppData/MetaInfo XML, screenshots,
      icons, and software-center UX.
    - >
      Its maintenance-mode status is also significant: modern packagers should usually
      prefer the main AppStream project, but historical build scripts and distribution
      metadata pipelines may still contain appstream-glib commands.
  project-history:
    - >
      The upstream NEWS file records AppStream-Glib 0.1.0 in March 2014. The README
      describes a library for compressed AppStream XML, Debian DEP-11 YAML,
      application-store search, screenshot and release metadata, and locale-aware
      application data.
    - >
      The repository now warns that appstream-glib is in heavy maintenance mode and
      recommends using the AppStream reference implementation instead. That warning
      captures the project's historical role: important infrastructure while AppStream
      metadata practices were settling, but no longer the preferred new dependency.
  related-projects:
    - >
      AppStream is the specification and current reference implementation recommended by
      upstream.
    - >
      GNOME Software and distribution software centers are primary consumers of the
      metadata AppStream-Glib helped generate.
    - DEP-11 is the Debian-style YAML metadata format the README says appstream-glib can read.
  sources:
    - https://github.com/hughsie/appstream-glib#readme
    - https://github.com/hughsie/appstream-glib/blob/main/NEWS
  summary:
    - >
      AppStream-Glib is a GLib/GObject library and tool suite for reading, writing,
      validating, and composing AppStream metadata. It historically provided
      appstream-util, appstream-compose, and appstream-builder workflows used by Linux
      software-center metadata pipelines.
  timeline:
    - '2014: NEWS records AppStream-Glib 0.1.0.'
    - '2015: 0.5.x releases show rapid development around metadata and builder behavior.'
    - '2022: 0.8.0 ports from libsoup to libcurl and continues validation updates.'
    - '2024: 0.8.3 release continues maintenance fixes.'
  usage:
    - >
      Packagers and distribution maintainers used appstream-util for
      validation/conversion and appstream-builder or appstream-compose-style flows to
      generate repository metadata from packages and upstream AppData/MetaInfo files.
    - >
      The README's builder example shows a package-directory scan producing AppStream
      XML, failed/ignored metadata reports, and icon archives that can be installed into
      repository metadata so software-center applications can display richer package
      information.
related-packages:
  - id: brew:appstream
    reason: >
      Choose AppStream for the maintained freedesktop.org specification, `appstreamcli`,
      catalog composition, and new library integrations; AppStream-Glib upstream
      explicitly recommends it as the replacement.
    rel: alternative
    sources:
      - https://github.com/hughsie/appstream-glib
      - https://github.com/ximion/appstream
      - https://www.freedesktop.org/software/appstream/docs/
