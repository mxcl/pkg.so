history:
  adoption-history:
    - >
      ncmdump's adoption is concentrated in the NetEase Cloud Music ecosystem and
      Chinese-language toolchains. The GitHub page observed for this batch showed about
      4.1k stars and 488 forks, while Homebrew, MacPorts, and winget packaging make the
      CLI available outside ad-hoc binary downloads. The Homebrew formula API response
      consulted for this July 2026 batch reported 68 install-on-request events in 30
      days and 649 in 365 days.
  package-nerd-significance:
    - >
      ncmdump is a format-escape utility: valuable when a user's music files are locked
      in NetEase's `.ncm` wrapper and they want normal player/library compatibility. It
      is niche, but the packaging story matters because users often need a trusted
      binary instead of random converter sites.
  project-history:
    - >
      The GitHub repository was created on 2021-10-06. The README says this C++ version
      was a cross-platform port and reproduction of the earlier anonymous5l/ncmdump
      project, which the README says had been deleted, and claims it was the earliest
      C++ version and first program on the market to support NCM conversion. Version
      1.3.0 is called out in the README for fixing filenames containing UTF-8 characters
      such as Chinese, Japanese, Korean, and emoji, and for adding DLL builds for use
      from other languages.
  related-projects:
    - anonymous5l/ncmdump, ncmdump-go, ncmdump-gui, NetEase Cloud Music
  sources:
    - https://api.github.com/repos/taurusxin/ncmdump
    - https://formulae.brew.sh/api/formula/ncmdump.json
    - https://github.com/taurusxin/ncmdump
    - https://github.com/taurusxin/ncmdump/discussions/66
  summary:
    - >
      ncmdump is a small C++ command-line converter for NetEase Cloud Music `.ncm` cache
      files. Its README describes converting downloaded NCM cache files to MP3 or FLAC
      and the Homebrew formula packages the same purpose.
  timeline:
    - '2021-10-06: GitHub repository created.'
    - '1.3.0: README notes full UTF-8 filename fixes and DLL build support.'
    - '2025-10-05: GitHub page observed release 1.5.1 as latest in the rendered releases panel.'
  usage:
    - >
      The README documents single-file conversion, multiple input files, directory mode
      with `-d`, recursive traversal with `-r`, output selection with `-o`, source
      deletion after successful processing with `-m`, and version/help flags. The
      maintainer has clarified in GitHub Discussions that the tool decrypts and extracts
      the original MP3 or FLAC data from the `.ncm` file rather than transcoding between
      formats.
