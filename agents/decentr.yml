history:
  adoption-history:
    - >
      Decentr distributed browser builds for macOS, Windows, Linux, and Android. The
      supplied record documents its additional availability through the Homebrew cask
      ecosystem on macOS.
  package-nerd-significance:
    - >
      Decentr is notable to package users as a Chromium-style browser combining privacy
      features with blockchain-era ideas such as a wallet, decentralized applications,
      and assigning value to user-generated data.
  project-history:
    - >
      Decentr originated as a decentralized platform and web-browser project intended to
      give users greater control over personal data. Its whitepapers framed personal
      data as an economic asset and connected browsing with a blockchain-backed wallet
      and application platform.
    - >
      The current official site emphasizes privacy software and distributes desktop and
      mobile browser builds, with the desktop browser including VPN and ad-blocking
      functionality.
  related-projects:
    - >
      The official materials compare its wallet-browser concept with browser-integrated
      cryptocurrency wallets and describe support for decentralized applications and
      blockchain services.
  sources:
    - https://decentr.net/
    - https://decentr.net/files/Decentr_Technical_Whitepaper_Data_As_Economic_Currency.pdf
    - https://decentr.net/files/Decentr_Whitepaper_V1.7.pdf
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Decentr is a cross-platform privacy-oriented web browser associated with the
      Decentr decentralized-data ecosystem.
  timeline:
    - >
      Circa 2020: Decentr published early technical material describing its
      decentralized platform and browser.
    - >
      2022: Decentr Whitepaper version 1.7 documented the browser, wallet, and
      personal-data-value model.
    - >
      2026: The official site continued to distribute Decentr browser builds for desktop
      and mobile platforms.
  usage:
    - >
      Users install Decentr as an alternative browser when they want integrated VPN and
      ad blocking or access to Decentr's blockchain-oriented features. On macOS, the
      supplied package record installs Decentr.app.
