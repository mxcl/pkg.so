history:
  adoption-history:
    - >
      Commander One has been offered in free and paid PRO forms, with the PRO Pack
      extending the local file manager into a client for FTP-family protocols, cloud
      storage, mobile devices, and other remote systems. The developer presents it as a
      macOS counterpart to classic dual-pane managers such as Total Commander.
  package-nerd-significance:
    - >
      Commander One belongs to the enduring orthodox-file-manager tradition: two panes,
      extensive keyboard control, archive handling, queued operations, and power-user
      access to local and remote files. Its Homebrew Cask is useful for automating
      installation of an otherwise conventional proprietary Mac application.
  project-history:
    - >
      Eltima's official material dates the first Commander One release to 4 August 2015.
      The application was written natively in Swift and designed as a more capable
      alternative to Finder, combining a dual-pane interface with tabs, search,
      archives, hotkeys, and a built-in viewer.
  related-projects:
    - Finder
    - Total Commander
    - Homebrew Cask
  sources:
    - >
      Official Total Commander comparison and FAQ:
      https://mac.eltima.com/totalcommander-mac.html
    - 'Official product page: https://mac.eltima.com/file-manager.html'
    - source_facts.package-manager
  summary:
    - >
      Commander One is a proprietary dual-panel file manager for macOS. Its base
      functionality covers local file operations, tabs, search, archives, viewing, and
      customizable hotkeys; its PRO features add remote servers, cloud storage, mobile
      devices, and a terminal emulator.
  timeline:
    - '2015-08-04: First Commander One version released.'
    - >
      Later: PRO integrations expanded the application into a multi-protocol and cloud
      file manager.
  usage:
    - >
      Users operate two directory panels side by side to copy, move, rename, search,
      inspect, or archive files. PRO users can mount and manage FTP, SFTP, FTPS, WebDAV,
      S3, cloud-storage, iOS, Android, and MTP resources from the same interface.
