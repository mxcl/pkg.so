history:
  adoption-history:
    - >
      imagejs remained a niche security package rather than a broad media utility.
      GitHub repository metadata shows far more stars than package-manager breadth, and
      the input metadata lists Homebrew as the only package-manager mapping for this
      batch.
  package-nerd-significance:
    - >
      The package is interesting because it lives at the boundary between file-format
      polyglots and web security demonstrations. It is not a general steganography
      suite; it is a compact package for showing how MIME assumptions, image upload
      policies, and script execution contexts can collide.
  project-history:
    - >
      The project appeared on GitHub in 2014 and credits Ajin Abraham's work on GIFs
      serving JavaScript as the idea that inspired the C implementation. The README says
      imagejs added bitmap support, and the changelog shows later support for GIF
      injection, BMP injection, WebP injection, and additional output formats.
  related-projects:
    - >
      The README names Ajin Abraham's GIF/JavaScript work as the source idea.
      Conceptually, imagejs is related to polyglot-file demos, browser XSS testing, and
      image steganography tools, although its stated goal is executable
      JavaScript-in-image proof of concept rather than secret-message hiding.
  sources:
    - >
      Project README, changelog, GitHub repository metadata, GitHub tags, and Homebrew
      formula metadata.
  summary:
    - >
      imagejs is a small proof-of-concept command-line tool for packaging JavaScript
      into files that remain valid image files. The README presents it as a way to
      create image files that can execute JavaScript and explicitly connects the idea to
      extending XSS vulnerabilities.
  timeline:
    - '2014: GitHub repository is created.'
    - '0.4.1: GIF, BMP, WebP, PNM, and PGF output support is documented in the changelog.'
    - '0.5.0: GIF injection support is added.'
    - '0.6.0: BMP injection support is added.'
    - '0.7.0: WebP injection support is added.'
  usage:
    - >
      Users run imagejs with an output type and a JavaScript file, producing an
      image-like file named after the input. The README documents BMP, GIF, WebP, PNM,
      and PGF outputs, a line-viewable BMP mode, and injection into existing GIF files.
