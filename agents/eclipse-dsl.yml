id: cask:eclipse-dsl
display-name: Eclipse IDE for Java and DSL Developers
repo: https://github.com/eclipse-packaging/packages
docs:
  - https://help.eclipse.org/latest/index.jsp
  - https://www.eclipse.org/downloads/packages
config-file-location:
  macos:
    - /Applications/Eclipse.app/Contents/Eclipse/eclipse.ini
    - /Applications/Eclipse.app/Contents/Eclipse/configuration/config.ini
credentials-file-location:
  unix:
    - ~/.eclipse/org.eclipse.equinox.security/secure_storage
history:
  adoption-history:
    - >
      The DSL edition is one of the curated Eclipse Packaging Project profiles assembled
      from the Eclipse Simultaneous Release. It gives language-tooling developers a
      ready-made installation instead of requiring them to assemble Java, Xtend, Xtext,
      Git, XML, and Maven components individually.
  package-nerd-significance:
    - >
      This package demonstrates Eclipse's distribution model: one extensible platform is
      materialized as audience-specific products from declarative EPP profiles. Package
      maintainers care about it as a reproducible, cross-platform bundle of tightly
      coordinated plug-ins.
  project-history:
    - >
      Eclipse originated at IBM and its source was published in November 2001. The
      Eclipse Foundation became its independent, vendor-neutral steward in 2004.
    - >
      The Eclipse Packaging Project was created in 2007 to define entry-level download
      profiles and released its first 1.0 series in 2008. The Java and DSL profile is
      built by that project as the `epp.package.dsl` product from the quarterly Eclipse
      Simultaneous Release.
  related-projects:
    - Eclipse Platform supplies the workbench and plug-in infrastructure.
    - Eclipse JDT supplies Java development tooling.
    - Eclipse Xtext and Xtend supply the principal DSL-oriented tooling.
    - Eclipse Packaging Project defines and builds the downloadable product.
  sources:
    - https://github.com/eclipse-packaging/packages
    - https://projects.eclipse.org/projects/technology.packaging
    - https://www.eclipse.org/about/
    - https://www.eclipse.org/downloads/packages/
  summary:
    - >
      Eclipse IDE for Java and DSL Developers is the Eclipse Packaging Project's
      preassembled distribution for Java developers and creators of domain-specific
      languages, notably users of Xtext and Xtend.
  timeline:
    - '2001: IBM published the Eclipse Platform and Java Development Tools source.'
    - '2004: The independent Eclipse Foundation was established.'
    - '2007: The Eclipse Packaging Project was created.'
    - '2008: Eclipse Packaging reached its 1.0 release series.'
    - 'Present: The DSL profile is produced with the quarterly Eclipse Simultaneous Release.'
  usage:
    - >
      It is commonly used to develop Java applications and define textual languages with
      Xtext and Xtend. The distribution also includes source-control, XML, and Maven
      integration, while Eclipse's plug-in system permits further language and build
      tooling to be installed.
