history:
  adoption-history:
    - >
      unpkg has remained useful to Mac administrators, developers, and curious users who
      want to inspect an installer before allowing it to modify the system or who need
      to recover a particular file without running the installer.
    - >
      Long-lived support for both legacy and modern package formats, PowerPC and Intel
      transitions, Apple silicon, and successive macOS releases has kept the small
      utility relevant across several generations of Mac packaging.
  package-nerd-significance:
    - >
      unpkg separates archive extraction from installation. It lets users see what a PKG
      contains without executing installer scripts or granting administrator privileges,
      making opaque macOS installer packages easier to audit.
    - >
      Its history mirrors changes in the Mac ecosystem: universal binaries, the
      transition from older package layouts, Python runtime removals, Apple silicon, and
      eventually a Swift rewrite.
  project-history:
    - >
      The first listed unpkg release dates to June 2005. Version 2.0 introduced a
      graphical interface and a universal binary in 2006, while version 4.0 was
      rewritten in Python in 2009 and added support for multiple and nested modern
      packages.
    - >
      Later releases added metapackage extraction, 64-bit and Apple silicon
      compatibility, and a Python 3 migration. Version 5.0 replaced the Python
      implementation with Swift.
  related-projects:
    - >
      unpkg complements command-line package tools and archive utilities, but its
      purpose is narrowly focused on extracting Apple PKG and MPKG payloads without
      installing them.
  sources:
    - https://github.com/timdoug/unpkg
    - https://www.timdoug.com/unpkg/
  summary:
    - >
      unpkg is a graphical macOS utility that extracts the contents of PKG and MPKG
      installers without running their installation process.
  timeline:
    - '2005-06-27: The earliest listed PowerPC release was published.'
    - '2006-06-14: Version 2.0 introduced a graphical interface and universal binary.'
    - '2009-01-16: Version 4.0 was rewritten in Python and added modern nested-package support.'
    - '2010-08-26: Version 4.5 added metapackage extraction.'
    - '2021-03-14: Version 4.7 added native Apple silicon support.'
    - '2022-03-20: Version 4.8 migrated from Python 2 to Python 3.'
    - '2025-11-19: Version 5.0 was rewritten in Swift.'
  usage:
    - >
      Users drag a `.pkg` or `.mpkg` onto the application or choose one through the file
      interface. unpkg extracts into a directory beside the package when possible,
      otherwise onto the Desktop.
    - >
      Because it extracts rather than installs, unpkg does not require an administrator
      password and should not be used as a substitute for installing incremental macOS
      updates or other packages whose installer logic is required.
