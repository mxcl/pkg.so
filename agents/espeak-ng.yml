history:
  adoption-history:
    - >
      eSpeak NG's adoption comes from accessibility and speech tooling rather than from
      frontend-style package churn. It ships command-line programs, a C library, Windows
      SAPI5 support, and compatibility symlinks for older eSpeak command names, which
      helps it fit into screen-reader, scripting, and embedded speech workflows.
    - >
      Its package-manager footprint is broad: the input package facts list Homebrew,
      major Linux distributions, BSD-style systems, Windows package managers, and Nix.
      That spread matches the upstream project's cross-platform emphasis and its value
      as a small, redistributable speech engine.
  package-nerd-significance:
    - >
      For package nerds, eSpeak NG is interesting because it is both a CLI utility and a
      system library with legacy command compatibility. It also carries a large set of
      language data in a relatively small package, making it common in accessibility
      stacks, test fixtures, and environments that need speech output without cloud
      services.
  project-history:
    - >
      The upstream README gives eSpeak NG a long lineage: the original program was known
      as speak, written for Acorn/RISC OS computers starting in 1995 by Jonathan
      Duddington, then rewritten in 2007 as eSpeak with relaxed memory and processor
      constraints and broader language support.
    - >
      Reece H. Dunn began maintaining a GitHub-oriented version of eSpeak in 2010,
      including POSIX build improvements and an autotools port in 2012. In late 2015
      that work was officially forked into eSpeak NG, with the stated goal of cleaning
      up the codebase, adding features, and improving supported languages.
  related-projects:
    - >
      Related projects include the original eSpeak, MBROLA voices used as an optional
      backend, screen-reader integrations, and SAPI5 speech engines.
  sources:
    - https://github.com/espeak-ng/espeak-ng
    - https://github.com/espeak-ng/espeak-ng/blob/master/docs/guide.md
    - https://github.com/espeak-ng/espeak-ng/blob/master/ChangeLog.md
    - https://formulae.brew.sh/formula/espeak-ng
  summary:
    - >
      eSpeak NG is a compact open source text-to-speech synthesizer for Linux, Windows,
      Android, macOS, and other systems. It supports more than 100 languages and accents
      and is available both as command-line programs and as a shared library.
  timeline:
    - '1995: Original speak program begins on Acorn/RISC OS.'
    - '2007: Program rewritten as eSpeak with broader language support.'
    - '2010: Reece H. Dunn starts maintaining a GitHub-oriented eSpeak version.'
    - '2012: POSIX build system work includes an autotools port.'
    - '2015: eSpeak NG officially forks from eSpeak.'
    - >
      2020s: Releases continue adding languages, build-system changes, Android work, and
      language updates.
  usage:
    - >
      Typical CLI use is speaking text from a file or standard input, writing speech to
      a WAV file, selecting voices, or producing phoneme data. Library users integrate
      the shared library into other programs, while Windows users may use
      SAPI5-compatible builds.
    - >
      The project uses formant synthesis, which keeps the program and language data
      small. The tradeoff documented upstream is that speech is clear and can run at
      high speeds, but is less natural than larger engines based on recorded human
      speech.
related-packages:
  - id: brew:espeak
    reason: >
      Choose the original eSpeak only when a deployment specifically requires its legacy
      commands, library build, or data formats; eSpeak NG is the maintained continuation
      and its data files are not interchangeable.
    rel: alternative
    sources:
      - https://github.com/espeak-ng/espeak-ng#history
      - https://github.com/espeak-ng/espeak-ng#readme
      - https://espeak.sourceforge.net/
