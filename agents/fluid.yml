history:
  adoption-history:
    - >
      Fluid established the site-specific browser pattern on macOS: users package a
      frequently used web application as a distinct app with its own Dock presence and
      focused browsing rules. Later releases followed macOS platform changes, including
      support for successive OS X versions, Mojave Dark Mode, and WebKit2 process
      separation.
  package-nerd-significance:
    - >
      Fluid is a long-standing Mac utility for converting web services into first-class
      desktop launch targets. Package users value it as a lightweight alternative to
      vendor-provided wrappers and as an example of the site-specific browser model.
  project-history:
    - >
      Fluid was created as a macOS utility that generates site-specific applications
      from webpages. The 2.0 series was substantially rewritten around Apple's newer
      WebKit2 API, and the 2.1 series restored and refined features including local-file
      loading, full-screen behavior, downloads, and persistent browsing settings.
  related-projects:
    - >
      Fluid belongs to the broader site-specific browser and progressive-web-app wrapper
      family. Similar concepts appear in browser-installed web apps and Electron-based
      wrappers, though Fluid uses macOS WebKit.
  sources:
    - https://fluidapp.com/
    - https://fluidapp.com/changelog.html
    - https://fluidapp.com/list/
  summary:
    - >
      Fluid is a macOS site-specific browser utility that turns a webpage or web
      application into a separate Mac app.
  timeline:
    - '2010s: Fluid became an established macOS utility for creating site-specific browsers.'
    - '2017: Fluid 1.8.6 added improved macOS Sierra support.'
    - '2018: Fluid 2.0 introduced a substantial WebKit2-based rewrite.'
    - '2018: Fluid 2.1 added Mojave Dark Mode and restored several application behaviors.'
    - 'Later 2.1 releases: Fluid refined full-screen support and bookmark handling.'
  usage:
    - >
      A user supplies a website URL, name, and icon to create a dedicated application.
      Per-app preferences control browsing behavior, while whitelist and blacklist URL
      patterns determine whether links remain inside the Fluid app or open in the
      default browser.
