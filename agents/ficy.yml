history:
  adoption-history:
    - >
      fIcy stayed a niche Unix command-line tool rather than a mainstream media
      application. Its package-manager footprint in the supplied metadata includes
      Homebrew and openSUSE, which matches the project's portable shell and C utility
      style.
  package-nerd-significance:
    - >
      For package-maintainer audiences, fIcy is interesting as a compact example of the
      old Unix media-tool pattern: one command for grabbing streams, one for playlist
      driving, and one for post-processing damaged MPEG output.
  project-history:
    - >
      The project began in late 2002 as a very small shell pipeline built around netcat
      and sed, according to its official release notes. It was rewritten in C for the
      1.0.0 line in 2003, gained Linux support in 1.0.1, and had a public release in
      1.0.2 in March 2004.
    - >
      The suite grew from the core fIcy grabber into a small tool family. fResync was
      added in 2004 to clean up badly cut MPEG files, and fPls was added later that year
      as a playlist handler and retry frontend.
  related-projects:
    - >
      fIcy is built around Icecast/Shoutcast-compatible ICY streams and sits near
      command-line media tools, playlist handlers, and MPEG repair utilities.
  sources:
    - https://www.thregr.org/wavexx/software/fIcy/
    - https://www.thregr.org/wavexx/software/fIcy/NEWS.html
    - https://gitlab.com/wavexx/fIcy
  summary:
    - >
      fIcy is a small shell-oriented suite for grabbing Icecast and Shoutcast streams,
      splitting or piping the audio while preserving ICY metadata-driven workflows.
  timeline:
    - '2002: Original shell/netcat/sed prototype appears in the release notes.'
    - '2003: 1.0.0 rewrites the tool in C.'
    - '2004: 1.0.2 is marked as the public release.'
    - '2004: fResync and fPls join the suite.'
    - '2017: 1.0.21 adds direct append support and clearer flag errors.'
  usage:
    - >
      The official documentation describes fIcy as useful for unattended recording of
      radio programs and stream debugging. The main command accepts a stream URL or
      server parameters, can write to standard output, dump files, enumerate files as
      ICY title metadata changes, filter titles by regular expression, and pipe audio to
      a media player.
    - >
      The companion fPls command reads local or remote playlists and manages fIcy
      retries, timeouts, and errors. fResync operates on dumped or broken MPEG files to
      realign frame headers for decoders or editing tools.
