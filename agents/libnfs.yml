history:
  adoption-history:
    - >
      libnfs is useful to media applications, backup tools, embedded systems, emulators,
      test programs, and cross-platform software that needs NFS URL access without a
      kernel mount. The README documents platform coverage for Linux, Cygwin, macOS,
      iOS, FreeBSD, Solaris, Windows, Android, AROS, PlayStation 2, and PlayStation 3.
  package-nerd-significance:
    - >
      libnfs is package-nerd interesting because it turns a traditionally kernel-mounted
      network filesystem into a linkable userspace protocol library. That makes it
      attractive in sandboxed, portable, or media-heavy software, but it also brings
      protocol-version, credential, TLS, and platform-build details into ordinary
      dependency graphs.
  project-history:
    - >
      The sahlberg/libnfs repository presents the library around three APIs: a raw
      asynchronous RPC interface, an asynchronous high-level NFS interface, and a
      synchronous high-level interface. The README also documents a version 2 API break
      with changed async task functions and read/write signatures.
    - >
      The project broadened from NFSv3-oriented client access into NFSv4, server-side
      RPC examples, Windows and macOS build fixes, and later zero-copy read/write
      support for NFS v3/v4. Its changelog is organized by version transitions rather
      than narrative release notes.
  related-projects:
    - >
      Related protocol pieces include ONC RPC, XDR, NFSv3, NFSv4, portmapper, mount,
      NLM, NSM, and rquota support.
    - >
      The repository includes examples for raw RPC access, asynchronous NFS access,
      synchronous NFS access, RPC servers, and an LD_PRELOAD experiment for NFS-aware
      command-line utilities.
  sources:
    - https://github.com/sahlberg/libnfs
    - https://github.com/sahlberg/libnfs/blob/master/CHANGELOG
  summary:
    - >
      libnfs is a C client library for accessing NFS shares over a network. It packages
      NFS and related RPC protocol handling into reusable APIs instead of requiring
      callers to mount a filesystem through the operating system.
  timeline:
    - >
      1.11.0 era: The changelog records support for RPC timeouts, low-level NFSv4 work,
      and building RPC servers.
    - >
      2.0.0 era: The changelog records NFSv4 support, lockf and fcntl locking support
      for NFSv4, CMake support, URL arguments for NFS version selection, and a
      testsuite.
    - >
      4.0.0 era: The changelog records multithread support for Linux and Windows and
      fixes for NFSv4 chmod, chown, and utimes behavior.
    - >
      5.0.2 era: The changelog records zero-copy write/read work, NFS 4.1 structure
      additions, and notes that new development had shifted to a libnfs-next-gen branch.
  usage:
    - >
      Applications can use nfs:// URLs, choose sync or async APIs, select NFS versions
      through URL arguments or API calls, and tune behavior such as timeouts, retries,
      mount traversal, directory caching, TLS transport security, and UID/GID handling.
      The package also provides small tools such as nfs-cat, nfs-cp, nfs-ls, and
      nfs-stat.
