history:
  adoption-history:
    - >
      The author recommends Homebrew installation so users receive updates and clean
      uninstallation behavior. The application can start at login and exposes its
      settings window when launched a second time.
    - >
      Later releases added brightness support, multi-display placement choices,
      fine-grained key adjustments and optional suppression of the replacement system
      HUD.
  package-nerd-significance:
    - >
      volumeHUD is a focused example of the small native utilities that appear when an
      operating-system redesign removes or weakens a long-standing interaction. Its
      Homebrew distribution turns a personal Swift application into an easily installed
      and updated system customization.
    - >
      It also demonstrates the maintenance burden of utilities built around input
      interception and system UI behavior: accessibility permissions, event monitoring
      and macOS compatibility matter as much as the visible HUD.
  project-history:
    - >
      Danny Stewart created volumeHUD in 2025 after macOS Tahoe replaced the prominent
      volume and brightness overlays used by earlier macOS releases with smaller Control
      Center popovers.
    - >
      The project expanded from volume indication to optional brightness support and, in
      version 3, direct interception of media keys so it could hide the system HUD. The
      author subsequently described the application as feature-complete, with future
      work limited to bug fixes and macOS compatibility.
  related-projects:
    - macOS Control Center and the pre-Tahoe system volume and brightness HUDs.
    - Homebrew, the installation method recommended by the author.
  sources:
    - https://github.com/dannystewart/volumeHUD
    - https://github.com/dannystewart/volumeHUD/blob/main/CHANGELOG.md
  summary:
    - >
      volumeHUD is an open-source macOS menu-bar utility that restores the large,
      centered volume and brightness overlays used before macOS Tahoe.
  timeline:
    - '2025: volumeHUD was created in response to the macOS Tahoe HUD redesign.'
    - '2025: Version 2 added experimental brightness support.'
    - 'Later: Version 3 added media-key interception to suppress the system HUD.'
    - >
      The author later declared the project feature-complete while retaining
      compatibility and bug-fix maintenance.
  usage:
    - >
      Users launch the application and then adjust volume normally; launching it again
      opens settings for login startup and HUD preferences. Brightness support is
      optional and applies to built-in displays.
    - >
      Accessibility permission is optional but recommended. Without it, the system HUD
      may remain visible beside volumeHUD and some boundary or brightness-change
      detection features are less reliable.
