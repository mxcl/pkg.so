id: brew:choose-rust
display-name: Choose
repo: null
docs:
  - https://github.com/theryangeary/choose#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The upstream README documents installation through Cargo, Homebrew as choose-rust,
      MacPorts, Arch AUR, and a Fedora/CentOS COPR. Homebrew's formula API reports
      stable version 1.3.7 and ongoing installs.
  package-nerd-significance:
    - >
      It is a classic modern CLI package-manager entry: a Rust rewrite/rethink of a
      POSIX-era text utility, distributed through Cargo plus system package managers,
      and intentionally overlapping with familiar tools rather than replacing them
      completely.
  project-history:
    - >
      The GitHub repository was created in September 2019. The README frames the tool
      around shell ergonomics: Python-like slice syntax, negative indexing, regex
      separators using Rust regex syntax, and faster behavior than `cut` on sufficiently
      long inputs.
    - >
      A v0.1.0 tag appears in September 2019, v1.0.0 in April 2020, and later release
      lines continued through v1.3.7 in August 2025.
  related-projects:
    - >
      Directly related tools are `cut` and `awk`, which the README uses as its
      comparison points. The Rust regex crate is part of its documented separator model,
      and Cargo is one of its official distribution channels.
  sources:
    - https://github.com/theryangeary/choose#readme
    - https://github.com/theryangeary/choose/releases
    - https://formulae.brew.sh/api/formula/choose-rust.json
  summary:
    - >
      Choose is a Rust command-line text-field selector positioned as a fast, friendlier
      alternative to common `cut` invocations and some simple `awk` one-liners.
  timeline:
    - '2019: Repository created and v0.1.0 tag appears.'
    - '2020: v1.0.0 tag appears and v1.3.x releases begin.'
    - '2024: v1.3.5 and v1.3.6 releases published.'
    - '2025: v1.3.7 release published; Homebrew stable version reports 1.3.7.'
  usage:
    - >
      Users invoke `choose` with one or more field selectors, ranges, or slice-like
      expressions, optionally changing field separators or selecting characters rather
      than fields. It is aimed at quick interactive and scripted shell data extraction
      where `awk '{print $1}'` or `cut` syntax feels too heavy.
related-packages:
  - id: brew:hck
    reason: >
      Choose hck when you prefer cut-compatible field syntax plus header selection,
      field reordering, automatic decompression, and an implementation whose official
      benchmarks directly compare against Choose.
    rel: alternative
    sources:
      - https://github.com/theryangeary/choose#readme
      - https://github.com/sstadick/hck#readme
  - id: brew:coreutils
    reason: >
      GNU Coreutils supplies cut for portable, conventional byte, character, and
      delimiter-based field selection when POSIX-style syntax and script familiarity
      matter more than Choose's slice syntax.
    rel: alternative
    sources:
      - https://github.com/theryangeary/choose#readme
      - https://www.gnu.org/software/coreutils/manual/html_node/The-cut-command.html
  - id: brew:gawk
    reason: >
      GNU Awk is the better alternative when field selection must grow into
      calculations, conditions, record transformations, or a complete text-processing
      program.
    rel: alternative
    sources:
      - https://github.com/theryangeary/choose#readme
      - https://www.gnu.org/software/gawk/manual/gawk.html
