history:
  adoption-history:
    - >
      Parallels says the product grew from an Intel Mac utility into a virtualization
      platform used by developers, IT professionals, students, creators, businesses, and
      enterprises. Its official history records retail distribution beginning in 2006,
      enterprise deployment support in 2011, native Apple silicon support in 2021, and
      Microsoft recognition for virtualized Windows 11 on Apple silicon in 2023.
  package-nerd-significance:
    - >
      Parallels Desktop is a prominent proprietary Mac virtualization package. Its cask
      offers repeatable installation, while virtual-machine bundles, guest operating
      systems, licenses, and host-level networking preferences remain separately managed
      state.
  project-history:
    - >
      Parallels Desktop launched on June 15, 2006, soon after Apple introduced Intel
      Macs. It let users run Windows beside macOS without rebooting; Coherence mode
      subsequently integrated Windows application windows into the Mac desktop.
    - >
      The product later added professional and enterprise editions, developer and
      testing features, and support for Apple's second processor transition. Parallels
      demonstrated Windows on an M1 prototype in 2020 and shipped native Apple silicon
      support in 2021.
  related-projects:
    - >
      Parallels Toolbox supplies separate desktop utilities, while Parallels Access
      extends remote access to applications. VMware Fusion and VirtualBox occupy the
      same broad desktop-virtualization ecosystem.
  sources:
    - https://docs.parallels.com/parallels-desktop-for-mac
    - https://kb.parallels.com/
    - https://www.parallels.com/blogs/parallels-desktop-20-years
    - https://www.parallels.com/products/desktop
  summary:
    - >
      Parallels Desktop is a commercial desktop hypervisor for running Windows, Linux,
      and other guest systems alongside macOS.
  timeline:
    - '2006: Parallels Desktop launched for Intel Macs.'
    - '2007: Coherence mode and a Macworld Best in Show award helped establish the product.'
    - '2011: Parallels added volume licensing and enterprise deployment support.'
    - '2021: Native Apple silicon support shipped.'
    - >
      2023: Microsoft recognized Parallels Desktop as an authorized way to run Arm
      editions of Windows 11 on Apple silicon Macs.
    - '2024: Parallels Desktop Enterprise Edition launched.'
  usage:
    - >
      Users create virtual machines to run Windows-only applications, test software
      across operating systems, isolate development environments, and support managed
      enterprise application delivery on Macs.
