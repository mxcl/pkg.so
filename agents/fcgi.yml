history:
  adoption-history:
    - >
      FastCGI was adopted because it offered CGI's language-agnostic deployment model
      without forcing every request to spawn a new process. The official docs include
      integration material for Perl, Tcl, and Java as well as C library documentation.
    - >
      Its long-term package-manager role is legacy infrastructure: modern web stacks
      often hide FastCGI behind application servers or language-specific process
      managers, but `fcgi` remains the small C SDK and bridge tool that many systems
      keep available for compatibility.
  package-nerd-significance:
    - >
      FastCGI is package-nerd archaeology that still matters: a 1990s web protocol whose
      ABI, headers, and helper binary continue to be packaged because web servers,
      wrappers, and legacy applications still know how to speak it.
    - >
      The package is also the dependency behind tools like fcgiwrap, making it part of
      the compatibility layer that lets old CGI programs survive behind newer web-server
      configurations.
  project-history:
    - >
      Open Market published the FastCGI 1.0 specification on April 29, 1996. The spec
      defines the interface between FastCGI applications and supporting web servers from
      the application's perspective.
    - >
      The Developer's Kit dates to the same 1996 Open Market codebase. The current
      FastCGI-Archives repository preserves a fork of the original FastCGI SDK after the
      historical FastCGI.com site disappeared.
  related-projects:
    - CGI is the predecessor interface that FastCGI extends.
    - >
      fcgiwrap, spawn-fcgi, web-server FastCGI modules, and language runtimes such as
      PHP-FPM are part of the surrounding FastCGI ecosystem.
  sources:
    - https://fastcgi-archives.github.io/FastCGI_Specification.html
    - https://fastcgi-archives.github.io/fcgi2/doc/overview.html
    - https://github.com/FastCGI-Archives/fcgi2
    - https://raw.githubusercontent.com/FastCGI-Archives/fcgi2/master/README.md
  summary:
    - >
      FastCGI is an open extension to CGI that keeps application processes alive and
      communicates with them over a simple protocol, avoiding the
      one-process-per-request model of traditional CGI.
    - >
      The `fcgi` package is the FastCGI Developer's Kit: headers, libraries, examples,
      language integration material, and the `cgi-fcgi` tool used to develop and test
      FastCGI applications.
  timeline:
    - '1996: Open Market published FastCGI specification 1.0.'
    - >
      1996: The FastCGI Developer's Kit documented libraries, examples, language
      integrations, and `cgi-fcgi`.
    - >
      2016: The FastCGI-Archives/fcgi2 GitHub repository was created to preserve the SDK
      after the original FastCGI.com material moved offline.
  usage:
    - >
      Developers use the library to write FastCGI applications that accept requests over
      a listening socket and exchange FastCGI records with a web server. The SDK
      includes examples, headers, `libfcgi`, and language-specific documentation.
    - >
      The `cgi-fcgi` command is useful for development and testing because it can bridge
      CGI-style invocation and FastCGI applications, including when a web server lacks
      direct FastCGI support.
related-packages:
