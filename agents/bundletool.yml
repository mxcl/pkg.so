history:
  adoption-history:
    - >
      bundletool became foundational Android packaging infrastructure because Android
      Studio, the Android Gradle plugin, and Google Play use it to construct App Bundles
      and convert them into APKs for deployment. Its command-line interface gives
      developers and CI systems the same underlying operations for local testing and
      release validation.
  package-nerd-significance:
    - >
      bundletool is package-nerd significant because it separates the published Android
      package from the device-specific install artifact. It is the practical machinery
      behind App Bundles, split APK generation, dynamic delivery, code transparency
      checks, and SDK bundle packaging, so it changed what an Android 'package' means
      after the APK-only era.
  project-history:
    - >
      bundletool grew out of the Android App Bundle distribution model introduced at
      Google I/O 2018. The official Android Developers blog described App Bundles and
      Google Play Dynamic Delivery as a way to publish all code and resources while
      letting Google Play deliver only the pieces matching a user's device.
    - >
      The GitHub README defines bundletool's responsibilities around building app
      bundles from precompiled modules, generating APK Set archives for possible
      devices, extracting device-compatible APKs, installing those APKs, extracting
      device specs, and handling code transparency. It later also gained Android SDK
      Bundle responsibilities for runtime-enabled SDKs.
  related-projects:
    - >
      Related projects and systems include Android Studio, the Android Gradle plugin,
      Google Play, APKs, Android App Bundles, APK Set archives, dynamic feature modules,
      R8, and Android SDK Bundles.
  sources:
    - >
      https://android-developers.googleblog.com/2018/05/google-io-2018-whats-new-in-android.html
    - https://developer.android.com/studio/command-line/bundletool
    - https://developer.android.com/tools/bundletool
    - https://github.com/google/bundletool
    - https://github.com/google/bundletool/releases
    - https://raw.githubusercontent.com/google/bundletool/master/README.md
  summary:
    - >
      bundletool is Google's command-line tool for building, inspecting, generating,
      extracting, and installing Android App Bundles, Android SDK Bundles, and the APK
      sets derived from them.
  timeline:
    - '2018-05: Android App Bundle and Google Play Dynamic Delivery announced at Google I/O.'
    - >
      2018: bundletool repository and command-line workflow became the reference tooling
      for App Bundles.
    - '2024: 1.17.x releases added runtime-enabled SDK bundle validations and commands.'
    - '2025-01: 1.18.0 added device group targeting support.'
    - '2025-12: 1.18.3 release notes show ongoing bundle and SDK packaging maintenance.'
  usage:
    - >
      Typical direct use includes generating an `.apks` archive from an `.aab`,
      extracting APKs compatible with a connected or described device, installing those
      APKs for testing, dumping bundle metadata, and creating device spec JSON. Most
      developers encounter it indirectly through Android Studio or Gradle, while release
      engineers use it explicitly in build pipelines.
related-packages:
