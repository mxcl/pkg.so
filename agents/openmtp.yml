history:
  adoption-history:
    - >
      OpenMTP became a prominent open-source macOS alternative to Google's former
      Android File Transfer utility. The project attributes its uptake to remaining
      free, open source, and advertising-free while supporting a broad range of MTP
      hardware.
    - >
      Although Android phones are the most familiar use case, official documentation now
      covers tablets, e-readers, cameras, music players, recorders, VR headsets, and
      other devices that expose storage over MTP.
  package-nerd-significance:
    - >
      OpenMTP fills a platform-integration gap: MTP devices do not mount in Finder like
      ordinary disks, so macOS users need a dedicated userspace application. A Homebrew
      cask makes that hardware-facing GUI utility reproducibly installable and
      updatable.
    - >
      The project is also interesting as an Electron application carrying a
      purpose-built transfer engine. OpenMTP 3 introduced the Kalam MTP kernel, written
      from scratch to improve throughput and device support while retaining a legacy
      mode for older systems.
  project-history:
    - >
      Ganesh Rathinavel created OpenMTP after finding existing macOS MTP tools limited,
      unreliable, slow, or expensive. The repository dates the project to 2018 and
      describes its goal as providing a smooth, free file-transfer experience for the
      community.
    - >
      The application evolved from an Android-focused transfer utility into a two-pane
      MTP file manager with large-file transfers, internal-storage and SD-card
      selection, drag and drop, queueing, dark mode, and keyboard navigation.
  related-projects:
    - >
      Google Android File Transfer was the proprietary utility OpenMTP set out to
      improve upon.
    - go-mtpx is the author's Go package used to build the Kalam MTP kernel.
    - android-file-transfer-linux supplied the legacy MTP kernel acknowledged by the project.
  sources:
    - https://github.com/ganeshrvel/openmtp
    - https://openmtp.ganeshrvel.com/
    - https://openmtp.ganeshrvel.com/how-to-connect-devices
  summary:
    - >
      OpenMTP is a free, open-source macOS file manager for transferring files over USB
      between a Mac and Android or other Media Transfer Protocol devices.
  timeline:
    - '2018: The OpenMTP project began.'
    - 'OpenMTP 3.0: The project introduced its from-scratch Kalam MTP kernel.'
  usage:
    - >
      Users connect and unlock an MTP device, select File Transfer or MTP mode on the
      device, and use OpenMTP's two panes to move files between the Mac and the device.
    - >
      Only one application can control an MTP device at a time. The official guide
      recommends closing applications such as Photos, Image Capture, Android File
      Transfer, cloud-drive clients, or device-management tools when detection fails.
