credentials-file-location: null
history:
  adoption-history:
    - >
      RunJS is distributed for macOS, Windows, and Linux under commercial perpetual and
      lifetime licenses, with licensing for two devices. The developer also offers
      licenses to qualifying non-commercial open-source maintainers.
    - >
      Its official GitHub repository serves as the public release and issue surface,
      while the application itself is positioned as a ready-to-run desktop tool rather
      than a package that users assemble from source.
  package-nerd-significance:
    - >
      RunJS compresses the JavaScript scratch-file workflow into a desktop package:
      bundled runtimes, automatic evaluation, inline results, TypeScript support,
      npm-package installation, browser APIs, and Node APIs are available without
      scaffolding a project.
    - >
      For package-oriented developers, its built-in npm package manager and support for
      `.npmrc` authentication, proxies, and private registries make it more than a toy
      REPL while preserving fast exploratory use.
  project-history:
    - >
      RunJS was developed by Luke Haas and is published by Haas Labs Ltd as a
      cross-platform JavaScript and TypeScript playground. Its core interaction
      evaluates code and displays results alongside the editor.
    - >
      Version 3 introduced an OpenAI-powered coding assistant in November 2024. Version
      4 followed in April 2026 with dedicated Browser, Node.js, and combined runtime
      environments, logpoints, a web view, and a rebuilt output panel.
  related-projects:
    - >
      RunJS builds on the JavaScript ecosystem, including Node.js, Chromium, V8,
      Electron, npm, and community-maintained packages.
    - >
      Its role overlaps with browser developer consoles, Node.js REPLs, online
      playgrounds, and scratch-file features in full IDEs.
  sources:
    - https://github.com/lukehaas/RunJS
    - https://runjs.app/blog/introducing-ai-chat-in-runjs-v3
    - https://runjs.app/blog/whats-new-in-runjs-v4
    - https://runjs.app/docs
    - https://runjs.app/open-source
  summary:
    - >
      RunJS is a cross-platform desktop playground for rapidly evaluating JavaScript,
      TypeScript, JSX, and TSX with inline output, selectable browser and Node.js
      runtimes, npm packages, and debugging aids.
  timeline:
    - >
      2021: The published RunJS end-user license agreement identified Haas Labs Ltd as
      the publisher.
    - '2024: RunJS 3 added an integrated AI coding assistant.'
    - >
      2026: RunJS 4 added dedicated runtime environments, logpoints, a web view, and a
      rebuilt output panel.
  usage:
    - >
      Developers use RunJS to test language features, prototype functions or UI
      components, transform data, call HTTP APIs, inspect npm packages, debug isolated
      logic, and run one-off scripts without creating a full project.
    - >
      Code can run in combined Browser and Node.js, Node.js-only, or Browser-only
      environments. Tabs support JavaScript, TypeScript, JSX, and TSX, while a working
      directory can provide access to local modules and files.
