history:
  adoption-history:
    - >
      The project belongs to the era when many open-source and enterprise projects used
      Gerrit review flows that required pushing to special refs and handling patch sets.
      Its adoption signal is narrow but concrete: the README names TYPO3 review needs,
      and Homebrew packaging made the scripts available to macOS developers.
  package-nerd-significance:
    - >
      git-gerrit shows how package managers carried local workflow glue for code-review
      systems before richer Gerrit integrations became common in IDEs and hosting
      platforms.
  project-history:
    - >
      The README says the project was forked from `gerrit-tools`, which itself passed
      through work by André Arko, Steffen Gebert, and Philipp Gampe before Robin Zhong
      adapted it for the TYPO3 review workflow. The 0.1.0 line marked the fork, while
      0.2.0 and 0.3.0 added patchset commands, bash completion, installation scripts,
      approval options, and workflow fixes.
  related-projects:
    - >
      git-gerrit descends from gerrit-tools and relates to Gerrit Code Review, Git
      refs-for-review workflows, and shell completion packages for Git subcommands.
  sources:
    - https://formulae.brew.sh/formula/git-gerrit
    - https://github.com/fbzhong/git-gerrit
    - https://github.com/fbzhong/git-gerrit/blob/master/README.md
    - https://github.com/fbzhong/git-gerrit/tags
  summary:
    - >
      git-gerrit is a collection of helper scripts for teams using Gerrit Code Review
      with Git. It wraps common review actions such as pushing changes, listing changes,
      applying patch sets, reviewing, submitting, and abandoning changes.
  timeline:
    - '2012: Repository created on GitHub with BSD-licensed helper scripts.'
    - '2012: 0.1.0 forked from earlier gerrit-tools work.'
    - '2012: 0.2.0 added patchset support, bash completion, and installation scripts.'
    - '2012: 0.3.0 added review-branch push behavior and approval-list options.'
  usage:
    - >
      Practitioners use `git gerrit push` to send review changes, `git gerrit changes`
      to inspect review items, `git gerrit apply` to check out a change for review, and
      `git gerrit review` or `git gerrit submit` to complete review actions. The
      companion `gerrit` and `gerrit-cherry-pick` scripts wrap Gerrit SSH commands and
      patch cherry-picking.
related-packages:
  - id: brew:git-review
    reason: >
      Choose git-review for a currently documented, configuration-driven command that
      submits Git branches to Gerrit, rather than Git-Gerrit's older collection of
      review and patch-set helper scripts.
    rel: alternative
    sources:
      - https://docs.opendev.org/opendev/git-review/latest/
      - https://github.com/fbzhong/git-gerrit#readme
