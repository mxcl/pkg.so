config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Kepubify found a niche among Kobo users who prefer command-line conversion or
      batch workflows instead of GUI ebook-management software. On 2026-07-01, GitHub
      API metadata reported 878 stars and 58 forks, and Homebrew metadata listed v4.0.4
      with 35 installs in the previous 30 days.
  package-nerd-significance:
    - >
      Kepubify is package-nerd bait because it is a small, fast, single-purpose
      replacement for heavier ebook-conversion workflows. It is also a good example of
      packaging device-specific media behavior as a cross-platform CLI.
  project-history:
    - >
      The pgaskin/kepubify repository was created on GitHub on 2017-07-27. Its README
      describes a fast converter that also works as a Go library and web app, handles
      malformed HTML/XHTML, and includes covergen and seriesmeta companion tools.
    - >
      The project website presents Kepubify as a command-line converter for Kobo's
      enhanced KEPUB format, with downloads, documentation, and a browser-based
      converter.
  related-projects:
    - Kobo eReaders and Kobo EPUB are the target device and format ecosystem.
    - Calibre is a common comparison point named by the Kepubify README.
    - covergen and seriesmeta are companion CLIs shipped from the same repository.
  sources:
    - https://api.github.com/repos/pgaskin/kepubify
    - https://api.github.com/repos/pgaskin/kepubify/releases?per_page=10
    - https://formulae.brew.sh/api/formula/kepubify.json
    - https://github.com/pgaskin/kepubify
    - https://pgaskin.net/kepubify/
    - https://pgaskin.net/kepubify/docs
    - https://raw.githubusercontent.com/pgaskin/kepubify/master/README.md
  summary:
    - >
      Kepubify is a standalone EPUB-to-Kobo-EPUB conversion tool for Kobo eReaders, with
      companion utilities for cover generation and series metadata.
  timeline:
    - '2017-07-27: pgaskin/kepubify repository created on GitHub.'
    - '2021-07-03: v4.0.0 release published.'
    - '2022-03-09: v4.0.4 release published.'
    - '2026-07-01: Homebrew formula metadata listed Kepubify v4.0.4.'
  usage:
    - >
      Users run kepubify to convert EPUB files or directories into Kobo-compatible KEPUB
      files. The included covergen utility pre-generates cover images for faster library
      browsing, while seriesmeta updates Kobo database metadata from EPUB3 or Calibre
      series data.
related-packages:
  - id: cask:calibre
    reason: >
      Choose calibre for a full graphical library manager and broad format/device
      support; Kepubify's official documentation also explains how to pre-convert a
      Calibre library when its faster, Kobo-focused conversion is preferable.
    rel: alternative
    sources:
      - https://pgaskin.net/kepubify/docs/
      - https://calibre-ebook.com/about
