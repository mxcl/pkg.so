id: brew:mednafen
display-name: Mednafen
repo: null
docs:
  - https://mednafen.github.io/documentation
  - https://mednafen.github.io/documentation/mednafen.html
config-file-location:
  unix:
    - ~/.mednafen/mednafen.cfg
    - $MEDNAFEN_HOME/mednafen.cfg
  windows:
    - mednafen.cfg in the mednafen.exe directory
credentials-file-location: null
history:
  adoption-history:
    - >
      Mednafen is adopted by users who prefer a scriptable emulator backend and by
      frontends that want a reliable command-line emulator core. The package input lists
      it in Homebrew, Debian, Ubuntu, Fedora, Arch, MacPorts, Nix, Scoop, Winget, and
      other packaging ecosystems, reflecting its role as a portable retro-gaming tool.
    - >
      Its adoption is also tied to accuracy and breadth: the official docs expose many
      emulation modules and low-level configuration settings, making it attractive to
      users who want repeatable emulator launches rather than only a GUI experience.
  package-nerd-significance:
    - >
      Mednafen matters in package-manager culture because it is a frontend-friendly
      emulator core with extensive official documentation and a long release history.
      Its config and firmware-directory conventions are predictable, which makes it easy
      to package while leaving UI choices to wrappers and frontends.
  project-history:
    - >
      The official Mednafen site dates its page design and original content to 2005, and
      the changelog shows a long sequence of releases from the 0.x series through modern
      1.x releases. Its documentation lists emulation modules for systems including
      NES/Famicom, Game Boy, Game Boy Advance, PC Engine/TurboGrafx, PC-FX, PlayStation,
      Sega Saturn, Genesis/Mega Drive, Master System, Game Gear, SNES/Super Famicom,
      Lynx, Neo Geo Pocket, WonderSwan, Virtual Boy, and Apple II.
    - >
      Over time, Mednafen accumulated features important to emulator users and
      packagers: compressed game loading, CD image handling, M3U multi-disc workflows,
      per-system configuration, save paths, screenshots, netplay, debugger
      documentation, and detailed per-module manuals.
  related-projects:
    - >
      Mednafen relates to emulator frontends and to the many console modules it
      incorporates, including PC Engine, PlayStation, Saturn, SNES, NES, Game Boy,
      Genesis, and other retro systems.
  sources:
    - https://mednafen.github.io/documentation/
    - https://mednafen.github.io/releases/
    - https://mednafen.github.io/releases/ChangeLog
    - source_facts.package-manager
  summary:
    - >
      Mednafen is a command-line-oriented multi-system emulator whose official
      documentation covers console, handheld, CD, debugger, and netplay modules. It is
      packaged as a compact emulator core rather than a full frontend.
  timeline:
    - >
      2005: Mednafen site copyright and early release history establish the long-running
      project era.
    - '2014: Mednafen-Server 0.5.2 is listed on the official releases page.'
    - '2021: Mednafen 1.27.1 is released.'
    - '2022: Mednafen 1.29.0 is released.'
    - '2024: Mednafen 1.32.1 is released.'
  usage:
    - >
      Users launch Mednafen from the command line with a game or disc image, then tune
      settings in `mednafen.cfg` under the base directory. The official documentation
      says the base directory is normally `~/.mednafen`, can be overridden with
      `MEDNAFEN_HOME`, and contains the primary configuration file.
related-packages:
  - id: brew:mame
    reason: >
      Choose MAME when broad hardware documentation, arcade preservation, or systems
      outside Mednafen's module set matter more than Mednafen's compact command-line
      core.
    rel: alternative
    sources:
      - https://mednafen.github.io/documentation/
      - https://docs.mamedev.org/whatis.html
