history:
  adoption-history:
    - >
      Unshaky was adopted by owners of affected MacBook, MacBook Air, and MacBook Pro
      models as a software mitigation for costly or disruptive keyboard repair.
      Community translations expanded the interface across numerous languages.
    - >
      Apple's 2018 keyboard service program and its 2019 expansion provided a
      hardware-repair route, but Unshaky remained useful as an immediate or temporary
      mitigation. The project is now in maintenance mode and accepts primarily bug
      fixes.
  package-nerd-significance:
    - >
      Unshaky packages a classic keyboard-debouncing technique as a native macOS
      menu-bar utility. Its per-key delay controls expose the central tradeoff: a longer
      interval suppresses more accidental repeats but can also block intentional
      repeated letters.
    - >
      The utility also demonstrates the deployment constraints of low-level desktop
      tools: it needs Accessibility permission, and later macOS releases additionally
      required Input Monitoring permission.
  project-history:
    - >
      Unshaky was created in response to unintended repeated keystrokes on Apple's
      butterfly keyboards. It suppresses a second event for a configured key when that
      event arrives within the chosen delay after the preceding accepted press.
    - >
      Development added per-key configuration, diagnostics, an aggressive mode,
      community localization, updated icons, and controls for statistics and temporary
      disabling. The maintainer later placed the project into maintenance mode.
  related-projects:
    - >
      Unshaky is a software mitigation rather than a replacement for Apple's keyboard
      service program. Its filtering approach is related to hardware and firmware key
      debouncing, while macOS remapping tools such as Karabiner can conflict with its
      event handling.
  sources:
    - https://github.com/aahung/Unshaky
    - https://github.com/aahung/Unshaky/releases
    - https://github.com/aahung/Unshaky/wiki
  summary:
    - >
      Unshaky is an open-source macOS menu-bar utility that filters rapid duplicate key
      events to mitigate double presses from Apple's butterfly keyboards.
  timeline:
    - '2018: Unshaky emerged during widespread reports of butterfly-keyboard repeat failures.'
    - '2018-06: Apple introduced a keyboard service program referenced by the project.'
    - >
      2019-05: Apple expanded service-program coverage to third-generation
      butterfly-keyboard models.
    - >
      2019: Unshaky's documentation and community wiki expanded with configuration
      guidance and compatibility notes.
    - 'Later development: The maintainer placed Unshaky into maintenance mode.'
  usage:
    - >
      Users install the application in `/Applications`, grant Accessibility permission,
      and—on affected newer macOS versions—grant Input Monitoring permission. Optional
      login-item setup starts it with the user session.
    - >
      Users configure a debounce delay for each defective key. The maintainer recommends
      beginning around 40 milliseconds and increasing gradually; higher values can
      suppress legitimate repeated letters when typing quickly.
