history:
  adoption-history:
    - >
      Axure reports that its organically grown product is used by more than 25,000
      organizations and by a majority of the Fortune 100. Its role expanded from
      standalone prototype and specification authoring into publishing, review,
      developer handoff, and team collaboration through Axure Cloud.
    - >
      Successive major releases refined the desktop authoring environment while
      preserving Axure's emphasis on interaction-rich prototypes and documentation. Team
      and Enterprise editions added centrally stored team projects with local working
      copies, check-in workflows, and revision history.
  package-nerd-significance:
    - >
      Axure RP is a long-lived proprietary desktop tool in a field increasingly
      dominated by browser-based design services. Package-manager installation is useful
      for designers, product teams, and managed Mac fleets that want repeatable
      installation of the native authoring application.
    - >
      Its `.rp` project files, reusable widget libraries, generated prototype output,
      and `.rpteam` collaboration files form a distinctive artifact ecosystem for
      high-fidelity interaction specifications and handoff.
  project-history:
    - >
      Axure began in 2002 after its founders encountered repeated communication failures
      between product, design, and development teams. They created RP—short for Rapid
      Prototyping—so non-programmers could build interactive prototypes accompanied by
      documentation.
    - >
      The product evolved to add richer interactivity, visual documentation, publishing
      and sharing, and team collaboration. Axure RP 9 and Axure Cloud were presented as
      a combined platform in 2019, and Axure RP 11 arrived in 2024.
  related-projects:
    - Axure Cloud, the official service for publishing, reviewing, and sharing prototypes.
    - Axure RP Team and Enterprise editions, which add collaborative team projects.
    - Axure Whiteboards and Documents, other products in the Axure collaboration platform.
  sources:
    - https://docs.axure.com/
    - https://docs.axure.com/axure-rp/reference/creating-and-sharing-team-projects/
    - https://www.axure.com/blog/welcome-to-the-new-axure
    - https://www.axure.com/changelog/2024-10-07
    - https://www.axure.com/company
    - https://www.axure.com/release-history/rp8
  summary:
    - >
      Axure RP is a proprietary desktop application for planning, diagramming,
      documenting, and building interaction-rich software prototypes. It is designed to
      help product, UX, and development teams test behavior and communicate
      specifications before implementation.
  timeline:
    - "2002: Axure's founders began developing RP, short for Rapid Prototyping."
    - '2016-04-14: Axure RP 8 became available.'
    - '2019-04-25: Axure launched RP 9 alongside the new Axure Cloud platform.'
    - '2024-10-07: Axure RP 11 was released.'
  usage:
    - >
      Users arrange widgets on pages, style them, and attach interactions to build
      browser-previewable prototypes without implementing the final application.
      Projects can be published to Axure Cloud for stakeholder review and sharing.
    - >
      Team and Enterprise users can create centrally stored team projects while each
      contributor works in a local `.rpteam` copy. Check-in, update, and
      revision-history workflows coordinate collaborative editing.
