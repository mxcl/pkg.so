history:
  adoption-history:
    - >
      Tablecruncher began as a commercial macOS application and later expanded into a
      cross-platform project with builds for macOS, Windows, and Linux. Its 2025
      transition to GPL-licensed open source broadened its role from a packaged desktop
      utility to a tool users can inspect, build, and contribute to.
  package-nerd-significance:
    - >
      Tablecruncher occupies the focused-tool niche between text editors, spreadsheets,
      and command-line CSV processors. Package users value its ability to open very
      large CSV files, recognize common delimiters and encodings, and automate cell
      transformations with embedded JavaScript without importing data into a full
      spreadsheet or database.
  project-history:
    - >
      Tablecruncher was originally released in 2017 as a commercial CSV editor. Its
      early public releases concentrated on macOS and on responsive handling of
      unusually large delimited files.
    - >
      Version 1.0 was published in June 2019. The developer continued adding format
      handling, JSON export, macros, themes, and native Apple Silicon support.
    - >
      In April 2025 the developer announced that Tablecruncher was becoming open source.
      Version 1.8 became the first open-source release under GPL-3.0-or-later and
      supplied builds for macOS and Windows, with Linux support also introduced.
  related-projects:
    - "Tablecruncher Web: the developer's browser-based CSV editor."
    - 'FLTK: the cross-platform GUI toolkit used by Tablecruncher.'
    - 'Duktape: the embedded JavaScript engine used for Tablecruncher macros.'
  sources:
    - 'Official documentation: https://tablecruncher.com/docs/doc.html'
    - 'Official download and release history: https://tablecruncher.com/download/'
    - 'Official project homepage: https://tablecruncher.com/'
    - 'Official project repository and README: https://github.com/Tablecruncher/tablecruncher'
  summary:
    - >
      Tablecruncher is a cross-platform, open-source desktop CSV editor designed for
      fast interaction with large delimited files. It combines a grid interface with
      encoding and delimiter detection, JSON export, regular-expression search, and
      JavaScript macros.
  timeline:
    - '2017: Tablecruncher was originally released as a commercial application.'
    - '2019: Version 1.0 was published.'
    - '2024: Version 1.7 added dedicated Apple Silicon and Intel macOS builds.'
    - '2025: Tablecruncher became open source under GPL-3.0-or-later.'
    - >
      2025: Version 1.8 delivered the first open-source release and expanded
      cross-platform availability.
  usage:
    - >
      Users open CSV or other supported delimited-text files, review or override
      detected encoding and separator settings, edit cells in a grid, sort or rearrange
      data, flag selected rows, and export data to CSV or JSON. JavaScript macros
      support repeatable transformations over cells and ranges.
