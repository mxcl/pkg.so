history:
  adoption-history:
    - >
      Caire achieved broad visibility for a single-purpose media CLI: the GitHub project
      has far more stars than most Homebrew image utilities in this batch, and the
      README documents installation by go install and Homebrew. The project also
      advertises Snap and OpenFaaS integrations.
  package-nerd-significance:
    - >
      Caire is interesting because it packages a visually demonstrable computer-vision
      algorithm as a simple Go binary. For package managers it is the kind of niche CLI
      that proves image-processing research can become a one-command install.
  project-history:
    - >
      The public repository was created in January 2018. The README defines Caire as a
      content-aware image resize library based on the Seam Carving for Content-Aware
      Image Resizing paper and documents the algorithmic flow: energy-map generation,
      dynamic-programming seam selection, and repeated seam removal.
    - >
      Caire grew beyond a minimal seam-carving demo into a CLI-oriented package with
      shrinking and enlarging, horizontal and vertical resizing, face detection through
      the author's Pigo library, stdin/stdout support, recursive concurrent directory
      processing, protective and removal masks, multiple image formats, and a GUI
      preview mode.
  related-projects:
    - The README names the original seam-carving paper as the algorithmic basis.
    - >
      Pigo, another project by the same author, is used for face detection to avoid face
      deformation.
    - The README links Caire integrations for OpenFaaS and Snap.
  sources:
    - https://api.github.com/repos/esimov/caire
    - https://api.github.com/repos/esimov/caire/releases
    - https://github.com/esimov/caire#readme
  summary:
    - >
      Caire is a Go content-aware image resizing tool and library based on seam carving,
      with command-line, batch, mask, face-detection, and preview features.
  timeline:
    - '2018: Public Caire repository created.'
    - '2021: 1.4.0 release published.'
    - '2023: 1.4.6 release published.'
    - '2025: 1.5.0 release published.'
  usage:
    - >
      Users resize images with caire -in input.jpg -out output.jpg, optionally setting
      width, height, percentage, square output, masks, blur and Sobel thresholds, debug
      seam visualization, face protection, or directory input. It can also work in Unix
      pipelines by reading from stdin and writing to stdout.
related-packages:
