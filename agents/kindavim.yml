id: cask:kindavim
display-name: kindaVim
repo: https://github.com/godbout/kindaVim.blahblah
docs:
  - https://docs.kindavim.app/
  - https://docs.kindavim.app/integrations/json-file
  - https://docs.kindavim.app/sync-your-preferences
config-file-location:
  macos:
    - ~/Library/Preferences/mo.com.sleeplessmind.kindaVim.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      kindaVim is distributed directly by its developer and through Homebrew Cask. Its
      unlimited-trial model lets users evaluate all features, while a subscription keeps
      the application active throughout the day.
  package-nerd-significance:
    - >
      kindaVim applies editor-style modal navigation at the operating-system level
      rather than inside one editor. That makes it notable to Vim users who want
      consistent keyboard behavior across native macOS applications and other accessible
      interface elements.
    - >
      Its documented preferences plist can be carried in a dotfiles workflow, although
      the developer notes that macOS Ventura and later prevent the old symlink-based
      preference-syncing approach.
  project-history:
    - >
      The developer says kindaVim was conceived in 2020 and released in 2022. It was
      implemented specifically for macOS, using the Accessibility API where applications
      expose suitable controls and falling back to keyboard remapping elsewhere.
    - >
      The application is not a port of Vim's editing buffer. Its motions are implemented
      against macOS behavior, with separate accessibility and keyboard strategies
      documented by the project.
  related-projects:
    - Vim supplies the modal-editing conventions that kindaVim brings to macOS applications.
    - >
      The official project page identifies Karabiner-Elements, VimMode.spoon,
      SketchyVim, ti-vim, and ShadowVim as related alternatives.
  sources:
    - https://docs.kindavim.app/
    - https://docs.kindavim.app/install
    - https://docs.kindavim.app/sync-your-preferences
    - https://github.com/godbout/kindaVim.blahblah
    - https://kindavim.app/
  summary:
    - >
      kindaVim is a macOS utility that brings Vim-style modes, motions, and commands to
      text controls and other interface elements across applications.
  timeline:
    - '2020: Development began, according to the official homepage.'
    - '2022: kindaVim was publicly released.'
  usage:
    - >
      Users grant the application macOS Accessibility access and then use Vim-like
      motions in supported applications. The software can work through
      accessibility-aware controls or a key-remapping fallback.
    - >
      Preferences are configured in the application. Integrations can also consume
      environment state written to ~/Library/Application
      Support/kindaVim/environment.json; this environment file is runtime state rather
      than the primary preferences file.
tags:
