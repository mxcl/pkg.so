history:
  adoption-history:
    - >
      From the early 1980s through the mid-1990s, Lawrence Livermore National Laboratory
      distributed the original Fortran SAC to the seismological community. A C
      conversion called SAC2000 followed in the mid-1990s but was generally difficult to
      obtain.
    - >
      IRIS began distributing derivative SAC2000 versions in 2004 under a negotiated
      license. EarthScope later became the community host, and the Community Edition
      continues the code as an openly licensed project.
    - >
      The package remains oriented toward research workflows involving seismic time
      series and the SAC binary file format, with command help, macros, plotting, signal
      processing, and companion file utilities.
  package-nerd-significance:
    - >
      SAC is a long-lived example of specialist scientific software moving from
      laboratory distribution, through institutionally licensed releases, into
      community-maintained open source. Its packaging carries decades of file-format and
      command compatibility expectations.
    - >
      The installation still exposes its scientific-workstation heritage: it uses X11,
      auxiliary data located through `SACAUX`, shell initialization scripts, and an
      interactive command environment, while modern releases provide source and prebuilt
      Linux and macOS artifacts.
  project-history:
    - >
      SAC began at Lawrence Livermore National Laboratory as a Fortran program for
      seismic analysis. It was converted to C and renamed SAC2000 in the mid-1990s.
    - >
      IRIS negotiated distribution rights and began releasing derivative versions in
      2004. After that agreement ended, EarthScope made the derivative Community Edition
      available under the Apache License 2.0 and hosts its community repository.
  related-projects:
    - SAC2000 is the LLNL code base from which the EarthScope line branched.
    - SAC/BRIS is a separate Macintosh-oriented descendant of the original Fortran version.
    - sacio is a library for reading and writing SAC-format data.
  sources:
    - https://ds.iris.edu/files/sac-manual/index.html
    - https://github.com/EarthScope/sac-community#getting-help
    - https://github.com/EarthScope/sac-community#history
  summary:
    - >
      SAC is an interactive seismic-data analysis system and file-format ecosystem used
      primarily in seismological research. The Community Edition is the
      community-maintained continuation of the LLNL and IRIS lineage.
  timeline:
    - >
      Early 1980s: LLNL began distributing the original Fortran SAC to the seismological
      community.
    - 'Mid-1990s: The source was converted to C and renamed SAC2000.'
    - '2004: IRIS began distributing derivative SAC2000 releases under a negotiated license.'
    - >
      2026: EarthScope released the Community Edition under the Apache License 2.0 after
      termination of the earlier LLNL–IRIS agreement.
  usage:
    - >
      Researchers use SAC to read and write seismic time-series files, inspect headers,
      filter signals, perform deconvolution and other processing, run macros, and create
      plots.
    - >
      Installations locate auxiliary data through `SACAUX` or conventional installation
      paths. The official README recommends shell initialization and optionally a
      user-created startup macro, but it does not define a standard SAC
      configuration-file location.
