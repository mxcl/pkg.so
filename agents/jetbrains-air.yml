credentials-file-location: null
history:
  adoption-history:
    - >
      Air initially targeted individual developers using multiple coding agents.
      JetBrains subsequently added Windows support, more ACP-compatible agents,
      local-model workflows, and team-oriented cloud environments and automations.
  package-nerd-significance:
    - >
      Air is notable to package and development-tool enthusiasts as JetBrains'
      agent-agnostic desktop environment for coordinating Codex, Claude Agent, Gemini
      CLI, Junie, and ACP-compatible agents. It combines agent sessions with Git
      worktrees, Docker isolation, code navigation, and change review.
  project-history:
    - >
      JetBrains launched Air as a public preview in March 2026, presenting it as an
      agentic development environment built around task delegation and review rather
      than a conventional editor-centered IDE.
    - >
      In September 2026, JetBrains expanded Air into a broader family spanning IDE
      integration, team workflows, automation, cloud execution, and organizational
      governance.
  related-projects:
    - JetBrains IDEs
    - Junie
    - Agent Client Protocol
    - Codex
    - Claude Agent
    - Gemini CLI
  sources:
    - >
      https://blog.jetbrains.com/air/2026/03/air-launches-as-public-preview-a-new-wave-of-dev-tooling-built-on-26-years-of-experience/
    - >
      https://blog.jetbrains.com/air/2026/07/what-s-new-air-gets-more-agents-local-models-and-java-kotlin-code-intelligence/
    - https://blog.jetbrains.com/blog/2026/09/22/introducing-jetbrains-air/
    - https://www.jetbrains.com/help/air/settings.html
  summary:
    - >
      JetBrains Air is an agentic development environment for delegating
      software-development tasks to multiple AI agents, isolating their work, and
      reviewing the resulting changes.
  timeline:
    - '2026-03: JetBrains launched Air as a public preview for macOS.'
    - '2026-06: JetBrains released Air for Windows.'
    - >
      2026-07: Air added more ACP-compatible agents, local-model workflows, and
      Java/Kotlin code intelligence.
    - >
      2026-09: JetBrains presented Air as a broader system for developers, teams, and
      organizations.
  usage:
    - >
      Developers open or clone a repository, choose an agent and execution environment,
      delegate tasks, inspect agent activity, and review or apply the resulting changes.
    - >
      Shareable workspace configuration can be committed under the project-root .air
      directory, while personal and sensitive settings remain local.
