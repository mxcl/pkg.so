history:
  adoption-history:
    - >
      The official README documents Homebrew installation on macOS, Debian and Ubuntu
      packages, the project's own APT repository, Solus packaging, Windows binaries, pip
      installation, and a generic Unix curl install. The input package-manager facts
      additionally list Homebrew, Debian, Nix, Scoop, Ubuntu, and winget, showing
      cross-platform packaging around the CLI.
  package-nerd-significance:
    - >
      svtplay-dl matters to package nerds because streaming-site downloaders are
      operationally sensitive: a stale package can break when a provider changes its
      site, while a fresh package can restore a simple scripted workflow. Its
      distribution through Homebrew, apt, pip, Windows package managers, and direct
      binaries makes it a good example of a niche media CLI with broad packaging
      pressure.
  project-history:
    - >
      The upstream repository describes svtplay-dl as a small command-line program to
      download videos from some streaming sites. GitHub repository metadata records
      spaam/svtplay-dl as created on 2011-03-01, and the official site footer credits
      copyright from 2011 through 2025.
  related-projects:
    - >
      svtplay-dl is commonly used alongside FFmpeg for post-processing, remuxing, DASH
      streams, and subtitle/audio merging.
  sources:
    - https://api.github.com/repos/spaam/svtplay-dl
    - https://github.com/spaam/svtplay-dl
    - https://svtplay-dl.se/config/
    - https://svtplay-dl.se/usage/
    - source_facts.package-manager
  summary:
    - >
      svtplay-dl is a small command-line program for downloading videos from streaming
      sites, especially Nordic public and commercial streaming services. In
      package-manager culture it fills the familiar role of a specialized downloader
      that users want as a fresh CLI binary because supported sites change over time.
  timeline:
    - '2011: GitHub repository created for spaam/svtplay-dl.'
    - '2016: README documents Ubuntu 16.04 and later package availability.'
    - '2025: Official site footer credits project copyright through 2025.'
  usage:
    - >
      The normal workflow is `svtplay-dl [options] URL`. The official usage page shows
      downloading one video, downloading subtitles, downloading all episodes, listing
      available qualities, choosing protocols such as DASH or HLS, and remuxing with
      FFmpeg. The config page documents YAML configuration and per-service settings.
