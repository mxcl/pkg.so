      Eclipse](https://help.eclipse.org/latest/topic/org.eclipse.platform.doc.user/tasks/running_eclipse.htm):
      macOS application-bundle eclipse.ini location; installation prefix varies.
    - >
      [Secure storage runtime
      options](https://help.eclipse.org/latest/topic/org.eclipse.platform.doc.user/reference/ref-securestorage-options.htm):
      shared home-relative Equinox credentials storage, normalized for Unix and Windows.
      -eclipse.keyring overrides it; path confidence is medium.
  history-sources:
    - >
      [EPP historical release
      description](https://projects.eclipse.org/projects/technology.packaging/releases/1.3.0).
    - '[EPP product definitions](https://github.com/eclipse-packaging/packages).'
    - >
      [Official Modeling Tools
      description](https://www.eclipse.org/downloads/packages/release/2025-12/r/eclipse-modeling-tools).
  repo-sources:
    - >
      [Official EPP repository](https://github.com/eclipse-packaging/packages)
      explicitly lists epp.package.modeling. It contains distribution definitions;
      individual modeling components have separate repositories.
  tags-sources:
