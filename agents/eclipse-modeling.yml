id: cask:eclipse-modeling
display-name: Eclipse Modeling Tools
repo: https://github.com/eclipse-packaging/packages
docs:
  - https://help.eclipse.org/latest
config-file-location:
  macos:
    - <Eclipse.app>/Contents/MacOS/eclipse.ini
credentials-file-location:
  unix:
    - ~/.eclipse/org.eclipse.equinox.security
  windows:
    - '%USERPROFILE%\.eclipse\org.eclipse.equinox.security'
history:
  adoption-history:
    - >
      Modeling Tools is distributed through Eclipse's official package catalog. EPP's
      historical reports describe adoption of the package family collectively and do not
      establish modeling-specific usage figures.
  package-nerd-significance:
    - >
      The distribution packages modeling tools and runtimes into an installable Eclipse
      product. Its definitions live beside other EPP editions, showing how specialized
      IDEs can share a platform and coordinated packaging infrastructure.
  project-history:
    - >
      Eclipse Modeling Tools belongs to the Eclipse Packaging Project's family of
      specialized IDE distributions. EPP has coordinated profile-based downloads since
      the 2007 Europa release; that date describes EPP's origin, not a verified first
      release of Modeling Tools.
    - >
      The modeling package focuses on developing applications around domain models,
      including graphical model design and using models during development.
  related-projects:
    - Eclipse Packaging Project; Eclipse Platform; Eclipse Modeling Project.
  sources:
    - >
      [EPP historical release
      description](https://projects.eclipse.org/projects/technology.packaging/releases/1.3.0).
    - '[EPP product definitions](https://github.com/eclipse-packaging/packages).'
    - >
      [Official Modeling Tools
      description](https://www.eclipse.org/downloads/packages/release/2025-12/r/eclipse-modeling-tools).
  summary:
    - >
      Eclipse Modeling Tools is a specialized Eclipse distribution for building
      model-based applications.
  timeline:
    - '2025: The official release catalog documents the Modeling Tools distribution.'
  usage:
    - >
      Developers use the package to design domain models graphically and build
      applications using modeling tools and runtimes.
tags:
  - domain-modeling
