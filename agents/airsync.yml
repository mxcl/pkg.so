history:
  adoption-history:
    - >
      AirSync is distributed through GitHub releases and Homebrew and is paired with an
      Android application. Its feature set grew from continuity basics into notification
      actions, media controls, clipboard exchange, mirroring, file transfer, widgets,
      and optional encrypted communication.
  package-nerd-significance:
    - >
      AirSync is notable to package users as a native, open-source attempt to bridge
      Apple's closed continuity ecosystem with Android. It also exposes a documented
      WebSocket protocol, making the project more inspectable and extensible than a
      purely opaque device-integration utility.
  project-history:
    - >
      The author started AirSync after finding KDE Connect unsatisfactory on Apple
      Silicon Macs and used the project as a first substantial Swift application. The
      Mac client is written with SwiftUI and the Android side with Jetpack Compose.
    - >
      An initial public beta was announced in 2025 with notification synchronization,
      clipboard sharing, media status and controls, device status, and local-network
      communication. The later protocol documentation describes WebSocket messaging,
      file transfer, and optional AES-256-GCM encryption.
  related-projects:
    - AirSync Android
    - KDE Connect
    - scrcpy
    - media-control
  sources:
    - >
      Official initial-beta announcement:
      https://github.com/sameerasw/airsync-mac/discussions/1
    - 'Official product documentation and origin account: https://airsync.notion.site/'
    - >
      Official protocol specification:
      https://github.com/sameerasw/airsync-mac/blob/main/DOCUMENTATION.md
    - 'Official repository README: https://github.com/sameerasw/airsync-mac'
  summary:
    - >
      AirSync is a macOS companion for connecting Android devices to a Mac with
      continuity-like notification, media, clipboard, mirroring, and file-transfer
      features.
  timeline:
    - '2025-07-31: The project announced its initial beta release.'
    - >
      2026: Official documentation described native macOS and Android clients plus a
      documented encrypted WebSocket protocol.
  usage:
    - >
      Install the Mac client and its Android companion, pair them on the local network,
      and enable the desired synchronization features. Optional tools such as `scrcpy`,
      `adb`, and `media-control` support additional functionality.
    - >
      The protocol uses port 5297 and the `/socket` WebSocket endpoint by default. Its
      symmetric encryption key is stored in macOS UserDefaults, but the official
      documentation does not specify a stable filesystem pathname.
