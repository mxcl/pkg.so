id: brew:imagemagick
display-name: ImageMagick
repo: null
docs:
  - https://imagemagick.org/command-line-processing
  - https://imagemagick.org/command-line-tools
config-file-location:
  unix:
    - $MAGICK_CONFIGURE_PATH
    - $PREFIX/etc/ImageMagick-7
    - $PREFIX/share/ImageMagick-7
    - $XDG_CACHE_HOME/ImageMagick
    - ~/.config/ImageMagick
    - <client path>/etc/ImageMagick
  windows:
    - $MAGICK_CONFIGURE_PATH
    - <windows registry>
    - $PREFIX/config
    - $USERPROFILE/.config/ImageMagick
    - <client path>
credentials-file-location: null
history:
  adoption-history:
    - >
      ImageMagick's adoption came from automation: it lets shell scripts, web
      applications, build systems, scientific workflows, and media pipelines perform
      image operations without a GUI. The upstream README names web development, graphic
      design, video editing, scientific research, medical imaging, and astronomy as
      usage areas.
    - >
      Package-manager adoption is broad. The input metadata lists Alpine, Homebrew,
      Chocolatey, Debian, Fedora, MacPorts, Nix, Arch, Scoop, Ubuntu, winget, and
      openSUSE mappings, and Homebrew analytics show far larger usage for the main
      imagemagick formula than for the full or versioned variants.
  package-nerd-significance:
    - >
      ImageMagick is one of the canonical examples of a package that is both a CLI and a
      library dependency. Package maintainers care about delegate libraries, codec
      support, security policy defaults, ABI compatibility, and the version 6 to version
      7 command transition because tiny build choices can alter what image formats users
      can process.
  project-history:
    - >
      ImageMagick began at DuPont when John Cristy needed to display 24-bit
      computer-generated images on monitors that could show only 256 colors. The
      official history describes Usenet as an early source of algorithms and technical
      help, and says DuPont transferred copyright so ImageMagick Studio LLC could
      release the software freely.
    - >
      After the 1990 comp.archives posting, ImageMagick accumulated enhancements, bug
      reports, and source contributions. By the mid-1990s, version 4.2.9 had become the
      culmination of the early toolset and was appearing in the freely distributed Linux
      ecosystem.
    - >
      Version 5 emphasized APIs and language/script integration after Bob Friesenhahn
      pushed for a stronger programming interface and wrote Magick++. Version 6
      reorganized command-line handling after Anthony Thyssen highlighted confusion
      around processing multiple images. Version 7 then used lessons from version 6 to
      redesign pixel-channel handling around arbitrary colorspaces and floating-point
      channel values.
  related-projects:
    - >
      Related projects include GraphicsMagick, which originated as an ImageMagick fork,
      the ImageMagick 6 legacy branch, Magick++, Magick.NET, Fred's ImageMagick Scripts,
      and Anthony Thyssen's ImageMagick Usage examples.
  sources:
    - >
      Official ImageMagick history page, ImageMagick README, command-line tools
      documentation, resources documentation, GitHub repository metadata, and Homebrew
      formula metadata.
  summary:
    - >
      ImageMagick is a long-lived open-source suite for creating, editing, composing,
      converting, and inspecting raster images from command-line tools and libraries.
      The Homebrew imagemagick formula tracks the ImageMagick 7 line and is the
      mainstream package-manager entry for the suite on Homebrew.
  timeline:
    - >
      1987: John Cristy begins the work at DuPont after a request to display 24-bit
      images on 256-color monitors.
    - "1990: ImageMagick is posted to Usenet's comp.archives group."
    - >
      Mid-1990s: ImageMagick 4.2.9 marks the early mature public toolset and appears in
      the Linux ecosystem.
    - >
      Version 5: Magick++, module loading, automatic file identification, and stronger
      APIs expand the project.
    - 'Version 6: Command-line behavior is redesigned for multi-image processing.'
    - >
      Version 7: Pixel-channel internals are redesigned for arbitrary colorspaces,
      arbitrary channels, and floating-point storage.
  usage:
    - >
      Typical command-line use includes converting formats, resizing, cropping,
      compositing, comparing images, identifying metadata, creating montages, importing
      windows, and streaming pixel data. The resources documentation also makes
      policy.xml and other configuration files central to production use, especially
      where untrusted images or resource limits matter.
related-packages:
  - id: brew:graphicsmagick
    reason: >
      Choose GraphicsMagick when compatibility with its stable `gm` interface, fewer
      external dependencies, or a smaller installation footprint matters more than
      ImageMagick's newer feature set.
    rel: alternative
    sources:
      - https://graphicsmagick.sourceforge.io/FAQ.html
      - https://graphicsmagick.sourceforge.io/GraphicsMagick.html
  - id: brew:vips
    reason: >
      Choose libvips for high-throughput or memory-sensitive batch image processing
      where its demand-driven, horizontally threaded architecture is a better fit.
    rel: alternative
    sources:
      - https://github.com/libvips/libvips
      - https://www.libvips.org/
