history:
  adoption-history:
    - >
      The supplied package-manager facts show this implementation packaged broadly as
      `bc` across APK, Debian, Fedora/dnf, MacPorts, Nix, Arch/pacman, Scoop, Ubuntu,
      zypper, and as `bc-gh` in Homebrew. That breadth reflects both the historical
      importance of `bc` and package-manager interest in a maintained replacement with
      GNU/BSD compatibility.
  package-nerd-significance:
    - >
      This package is significant because `bc` is a classic Unix utility and POSIX
      language, but many systems rely on aging or divergent implementations. A portable
      maintained version with GNU, BSD, and `dc` compatibility gives package managers a
      practical way to standardize behavior across platforms.
    - >
      Homebrew's `bc-gh` name is itself package-nerd metadata: it distinguishes Gavin
      Howard's implementation from other `bc` providers while still installing the
      historically expected `bc` and `dc` executables.
  project-history:
    - >
      The upstream README positions the project as a POSIX `bc` implementation that also
      implements GNU and BSD-flavor extensions. It builds on Unix calculator tradition:
      `bc` as an infix arbitrary-precision language and `dc` as the older reverse-Polish
      calculator model.
    - >
      Unlike many small Unix replacements, this implementation explicitly targets
      portability across POSIX systems and Windows. The README lists Linux, BSDs, macOS,
      Solaris, AIX, HP-UX, and Windows support, and documents a C99/POSIX 2008-oriented
      build.
  related-projects:
    - >
      Related projects include GNU bc, BSD bc variants, traditional Unix `dc`, POSIX
      shell utilities that call `bc`, and other arbitrary-precision calculators such as
      calc.
  sources:
    - https://github.com/gavinhoward/bc#readme
    - https://github.com/gavinhoward/bc/blob/master/NEWS.md
    - https://github.com/gavinhoward/bc/releases.atom
    - input:source_facts.package-manager
  summary:
    - >
      Gavin D. Howard's `bc` is a modern implementation of the POSIX arbitrary-precision
      calculator, with GNU `bc` extensions, the BSD period extension, a bundled `dc`,
      and an optional C math library named `bcl`.
  timeline:
    - '2025-07-25: GitHub releases feed records release 7.1.0.'
    - 'Current: README documents POSIX `bc`, bundled `dc`, and `bcl` library support.'
  usage:
    - >
      `bc` is used in shell scripts and interactive terminals for arbitrary-precision
      decimal math, while `dc` serves stack-based calculator workflows and compatibility
      needs. This implementation also exposes `bcl` for C programs that want the
      calculator's math library.
related-packages:
  - id: brew:bc
    reason: >
      Choose GNU bc when GNU's canonical implementation, documentation, and traditional
      GNU userland behavior are more important than bc-gh's added portability and
      extensions.
    rel: alternative
    sources:
      - https://github.com/gavinhoward/bc#readme
      - https://www.gnu.org/software/bc/
