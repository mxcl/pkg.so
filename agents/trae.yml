history:
  adoption-history:
    - >
      TRAE entered the rapidly growing AI-editor field as an IDE combining code
      completion, conversational assistance, and agentic software-development workflows.
      Its official first-anniversary material places its launch on January 20, 2025.
    - >
      During 2025 TRAE expanded its agent-oriented features through Builder, Rules,
      tools, Model Context Protocol integration, repository-aware Cue predictions, and
      SOLO workflows. Official 2026 material stated that hundreds of thousands of
      developers had used TRAE since launch.
  package-nerd-significance:
    - >
      The Homebrew cask offers a reproducible installation route for a proprietary,
      frequently updated AI IDE. It belongs to the newer class of developer tools whose
      package is local but whose most distinctive functionality depends on hosted
      models, accounts, quotas, and evolving service plans.
    - >
      TRAE is distinct from the official open-source Trae Agent project: the cask
      installs the desktop IDE, not the separate command-line agent repository. This
      distinction matters when mapping packages to source repositories.
  project-history:
    - >
      TRAE began as 'The Real AI Engineer,' an AI-powered coding environment intended to
      move beyond completion toward adaptive collaboration. The early product paired
      Chat mode, where developers lead, with Builder mode, where the agent undertakes
      larger implementation and debugging tasks.
    - >
      In 2025 TRAE added broader agent customization and introduced SOLO as an
      end-to-end coding agent. During 2026 the product family expanded further, while
      the traditional IDE remained available for developers wanting a full
      editor-centered workflow.
  related-projects:
    - Trae Agent
    - TRAE SOLO
    - TRAE Cue
    - Visual Studio Code
    - Model Context Protocol
  sources:
    - 'Official SOLO announcement: https://www.trae.ai/blog/new_solo_beta_0331'
    - 'Official agent and MCP article: https://www.trae.ai/blog/product_thought_0428'
    - 'Official product site: https://www.trae.ai/'
    - 'Official product vision: https://www.trae.ai/blog/product_thought_0416'
  summary:
    - >
      TRAE is a proprietary AI-focused development environment that combines a
      conventional code editor with completion, chat, codebase-aware predictions, and
      agents that can plan, edit files, run commands, and build software.
  timeline:
    - '2025-01-20: TRAE launched.'
    - >
      2025-04: TRAE described its Chat and Builder collaboration modes and announced
      deeper Rules, tools, and MCP-based agent customization.
    - '2025-07: TRAE introduced SOLO as an end-to-end software-building mode.'
    - '2025-12: Cue-Pro added repository-level edit-sequence predictions.'
    - '2026-03: TRAE announced a standalone SOLO beta alongside the continuing IDE experience.'
  usage:
    - >
      Open an existing codebase or create a project, then use conventional editing
      alongside AI completion, Chat for targeted assistance, or agent-led modes for
      multi-step implementation, debugging, command execution, and preview.
    - >
      Review generated diffs and execution results before accepting them. Account
      sign-in and network access are required for hosted AI features, and users should
      apply appropriate privacy and code-review controls when granting agents access to
      private repositories or command execution.
