id: cask:qcad
display-name: QCAD
repo: https://github.com/qcad/qcad
docs:
  - https://www.qcad.org/doc/qcad/latest/reference/en/qcad_reference_manual_en.html
config-file-location:
  linux:
    - ~/.config/QCAD/QCAD3.conf
  macos:
    - ~/.config/QCAD/QCAD3.ini
  windows:
    - '%APPDATA%\QCAD\QCAD3.ini'
credentials-file-location: null
history:
  adoption-history:
    - >
      QCAD 1 reportedly reached an estimated 70,000 users within roughly two years and
      was translated into 20 languages. Later releases established Windows, macOS, and
      Linux support, while Community and Professional editions provided open-source and
      commercial distribution paths.
    - >
      The supplied package record shows contemporary macOS adoption through Homebrew
      Cask as `qcad`.
  package-nerd-significance:
    - >
      QCAD is notable to package maintainers because its GPL-licensed Community Edition
      and proprietary Professional plugins share a product lineage but have different
      redistribution implications. Its long-lived DXF focus and cross-platform Qt
      architecture also make it a recognizable lightweight alternative in CAD software
      catalogs.
  project-history:
    - >
      QCAD began in October 1999 as a spin-off from the CAD functionality in CAM Expert,
      an engraving and laser-cutting system. QCAD 2 followed after a major redesign
      aimed at modularity and extensibility.
    - >
      The first QCAD 3 beta appeared in August 2011 with a new CAD engine, improved
      property handling, an ECMAScript extension interface, and broader DXF and DWG
      support. Starting with QCAD 3.1, the core source was distributed under GPLv3 with
      exceptions that permit proprietary plugins.
  related-projects:
    - CAM Expert, from which QCAD originated.
    - dxflib and vec2web, libraries that emerged from QCAD 2 development.
    - Qt, the cross-platform application framework used by QCAD.
  sources:
    - https://github.com/qcad/qcad
    - https://www.qcad.org/en/78-qcad/81-about-qcad
    - https://www.qcad.org/en/license
    - source_facts.package-manager
  summary:
    - >
      QCAD is a cross-platform 2D computer-aided drafting application developed by
      RibbonSoft. It combines an open-source Community Edition with commercial
      Professional extensions and has been developed continuously from a 1999
      CAM-software spin-off.
  timeline:
    - '1999: QCAD project begins as a spin-off from CAM Expert.'
    - '2002: Development of the redesigned QCAD 2 begins.'
    - '2003: QCAD 2 is first released.'
    - '2011: First QCAD 3 beta is released.'
    - '2013: QCAD 3.1 establishes the modern GPLv3-with-exceptions licensing model.'
  usage:
    - >
      Users create and edit 2D technical drawings, especially DXF files; the
      Professional edition adds proprietary capabilities including stronger DWG support.
      Developers can extend QCAD with C++ plugins or ECMAScript code.
tags:
