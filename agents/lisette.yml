history:
  adoption-history:
    - >
      Lisette's adoption evidence is early-stage and concentrated around source
      distribution, crates.io releases, the hosted playground, and package-manager
      entries. By June 2026, the repository showed dozens of tagged releases and
      Homebrew, Nix, Fedora, and MacPorts metadata had appeared in the package facts for
      the tool.
  package-nerd-significance:
    - >
      For package maintainers, Lisette is interesting because it packages a young
      language toolchain as a Rust-distributed compiler whose output depends on Go. It
      sits in the niche where language runtimes, compiler front ends, editor tooling,
      and generated-code workflows all meet.
  project-history:
    - >
      The project was published as a Rust crate in December 2025 and developed rapidly
      through the first half of 2026. The repository and project site present Lisette as
      an experiment in bringing ML- and Rust-flavored safety features to Go-oriented
      programs without abandoning Go's deployment model.
    - >
      The language's early design mixed familiar Rust surface syntax with Go-specific
      affordances such as imports from Go packages, Go-style interfaces, channels,
      goroutines, and readable generated Go. That combination makes it part compiler
      project, part language-design prototype, and part bridge into the Go ecosystem.
  related-projects:
    - >
      Lisette is related to Rust through its syntax and safety vocabulary, to Go through
      its generated output and runtime interoperation, and to ML-family languages
      through Hindley-Milner type inference and algebraic data types.
  sources:
    - https://crates.io/crates/lisette
    - https://github.com/ivov/lisette
    - https://lisette.run/
  summary:
    - >
      Lisette is a small compiled programming language by Ivan Ovejero that uses
      Rust-like syntax while targeting Go as its runtime and output ecosystem. Its
      public materials emphasize algebraic data types, pattern matching, Hindley-Milner
      type inference, immutable-by-default values, Go interoperation, diagnostics, and
      editor tooling.
  timeline:
    - '2025-12-28: Lisette 0.0.1 was published on crates.io.'
    - '2026-03-21: Lisette 0.1.0 was published on crates.io.'
    - >
      2026-06-28: Lisette 0.6.0 was published, matching the repository's June 28, 2026
      release marker.
  usage:
    - >
      Users install the `lis` command and compile `.lis` programs to Go. The examples in
      the README and site focus on pattern matching, `Result` and `Option`-style error
      handling, typed channels, pipelines, and direct calls into Go packages.
