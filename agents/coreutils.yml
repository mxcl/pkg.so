id: brew:coreutils
display-name: GNU Coreutils
repo: https://git.savannah.gnu.org/cgit/coreutils.git
docs:
  - https://www.gnu.org/software/coreutils/manual/coreutils.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Coreutils became a normal dependency surface for GNU/Linux distributions and a
      compatibility package on non-GNU systems. The Homebrew formula exposes many
      commands with a g-prefix on macOS so users can opt into GNU semantics without
      replacing the platform-provided BSD userland.
  package-nerd-significance:
    - >
      Coreutils is one of the canonical examples of packaging a userland as a coherent
      compatibility layer. Its release cadence, prefixing strategy on macOS, GPL
      licensing, and overlap with POSIX and BSD utilities make it a frequent
      packaging-policy test case.
  project-history:
    - >
      The package sits in the GNU system layer: its official description presents it as
      the GNU file, shell, and text utilities, and the GNU FTP archive shows coreutils
      release tarballs from the 5.x series onward, including coreutils 5.0 in April
      2003. That release trail made the name 'coreutils' the umbrella package users and
      distributors expect when they want GNU behavior for the traditional small
      utilities.
  related-projects:
    - >
      Related userland packages include BusyBox, Toybox, uutils coreutils, BSD userland
      utilities, and GNU findutils, grep, sed, and tar.
  sources:
    - https://www.gnu.org/software/coreutils/
    - https://www.gnu.org/software/coreutils/manual/coreutils.html
    - https://ftp.gnu.org/gnu/coreutils/
    - https://formulae.brew.sh/formula/coreutils
  summary:
    - >
      GNU Coreutils is the GNU Project's distribution of the standard command-line file,
      shell, and text utilities used throughout Unix-like systems. In package-manager
      practice it is treated less as a single application than as a portable baseline
      for commands such as cat, chmod, cp, date, ls, sort, tail, tr, and many checksum
      and text-processing tools.
  timeline:
    - '2003: GNU FTP archive lists coreutils 5.0 release tarballs.'
    - >
      2009: GNU FTP archive lists coreutils 8.x release tarballs, reflecting continued
      maintenance under the coreutils package name.
    - >
      Present: Homebrew packages GNU Coreutils as a system utility collection with
      GNU-prefixed commands on macOS.
  usage:
    - >
      Users normally install coreutils for scripts and interactive shell workflows that
      rely on GNU options or GNU extensions. On macOS the package is especially common
      in development environments where cross-platform shell scripts assume commands
      such as gdate, gsort, greadlink, or gtimeout.
related-packages:
  - id: brew:uutils-coreutils
    reason: >
      Choose uutils-coreutils when you want a cross-platform Rust implementation aiming
      for GNU-compatible behavior, including support for Windows and WASI, while
      accepting that some options or edge behavior may still differ.
    rel: alternative
    sources:
      - https://www.gnu.org/software/coreutils/
      - https://github.com/uutils/coreutils#readme
