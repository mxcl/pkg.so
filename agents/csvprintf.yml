history:
  adoption-history:
    - >
      csvprintf has a narrower package footprint than the larger CSV toolkits in this
      batch, but the input package facts identify it in Homebrew and openSUSE zypper.
      Its appeal is the traditional Unix model: a compact filter that can sit in shell
      pipelines and produce formatted text or machine-readable output.
  package-nerd-significance:
    - >
      csvprintf matters as an example of the single-purpose C/Unix utility lineage
      applied to CSV. It is not a spreadsheet replacement or SQL layer; it is a
      formatter and converter that fits package-manager ecosystems because it builds and
      installs like a conventional command-line program.
  project-history:
    - >
      The project's official change log records an initial 1.0 release on November 30,
      2010. Its early 1.0.x line focused on CSV edge cases and XML conversion, while
      later releases added named column accessors, Bash output, JSON text sequences, and
      fixes for column-name handling.
  related-projects:
    - >
      csvprintf is adjacent to csvkit-style conversion tools and shell formatters, but
      its official documentation emphasizes printf-style row formatting rather than a
      broad subcommand suite.
  sources:
    - https://github.com/archiecobbs/csvprintf#readme
    - https://github.com/archiecobbs/csvprintf/blob/master/CHANGES
    - https://github.com/archiecobbs/csvprintf/wiki/ManPage
    - https://formulae.brew.sh/formula/csvprintf
  summary:
    - >
      csvprintf is a small Unix-style command-line utility for parsing CSV records and
      formatting each record through printf-like format strings. It also includes XML,
      JSON text sequence, Bash assignment, and XML-to-CSV workflows.
  timeline:
    - '2010: Version 1.0 initial release.'
    - '2013: Version 1.0.3 added XML back-to-CSV conversion.'
    - '2021: Versions 1.2.0 and 1.3.0 added JSON text sequence and Bash output modes.'
    - '2026: Version 1.3.4 added column-name format accessors.'
  usage:
    - >
      The upstream README shows csvprintf being used like printf for CSV rows: users
      provide a format string, reference columns by position or name, and stream CSV
      from stdin. The same tool can emit XML and other structured forms when a pipeline
      needs a quick conversion step.
