history:
  adoption-history:
    - >
      bcoin's adoption is more specialized than general Bitcoin Core tooling. Its README
      names Purse.io as a production user and frames bcoin as a library/backend for
      services that want Bitcoin protocol behavior inside a Node.js stack.
    - >
      In package-manager terms, Homebrew packaging made the node and wallet CLIs easy to
      install on developer workstations, but the supplied package facts show a narrower
      package-manager footprint than older Unix utilities.
  package-nerd-significance:
    - >
      bcoin is package-nerd interesting because it packages a cryptocurrency full-node
      stack as a Node.js developer tool, rather than as the canonical C++ Bitcoin Core
      lineage.
    - >
      It represents a period when alternative protocol implementations mattered for
      ecosystem diversity, service integration, and testing assumptions against more
      than one codebase.
  project-history:
    - >
      The GitHub repository was created in 2014. The README describes bcoin as an
      alternative implementation of the Bitcoin protocol in JavaScript and C/C++ for
      Node.js, aware of known consensus rules and usable as a production consensus
      backend and wallet system.
    - >
      The project reached a 1.0.0 tag after a beta series and later published 2.x
      releases, while retaining command-line entry points such as bcoin, bcoin-cli,
      bcoin-node, bwallet, and bwallet-cli.
  related-projects:
    - >
      Bitcoin Core is the canonical Bitcoin implementation that bcoin contrasts with as
      an alternative implementation.
    - Node.js and npm-style application stacks are the natural integration environment.
    - >
      Wallet, SPV, mining, and Lightning/layer-2 systems are listed upstream as bcoin
      use cases.
  sources:
    - https://bcoin.io/api-docs
    - https://bcoin.io/docs
    - https://github.com/bcoin-org/bcoin
    - https://github.com/bcoin-org/bcoin/blob/master/README.md
    - source_facts.package-manager
  summary:
    - >
      bcoin is an alternative Bitcoin protocol implementation written for Node.js, with
      full-node, SPV-node, wallet, mining-backend, layer-2-backend, and library use
      cases.
  timeline:
    - '2014: GitHub repository created.'
    - >
      2017: README copyright range includes Christopher Jeffrey through 2017 and
      documents production use.
    - '2018: v1.0.0-era release tags established after beta tags.'
    - '2020s: v2.x tags published; Homebrew continues to package the CLI.'
  usage:
    - >
      Developers use bcoin as a full node, SPV node, wallet backend, mining backend with
      getblocktemplate support, layer-2 backend, or general-purpose Bitcoin library.
    - >
      Configuration and API credentials are commonly placed in bcoin and wallet config
      files under ~/.bcoin, including network-specific subdirectories.
related-packages:
  - id: brew:bitcoin
    reason: >
      Choose Bitcoin Core for the canonical C++ full-node implementation and its mature
      operator ecosystem; choose bcoin when embedding an independent Bitcoin node,
      wallet, or protocol library in Node.js is the priority.
    rel: alternative
    sources:
      - https://github.com/bcoin-org/bcoin
      - https://bitcoincore.org/en/doc/
