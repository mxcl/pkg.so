history:
  adoption-history:
    - >
      Camo expanded from its original iPhone-and-Mac pairing to Windows and Android,
      later adding iPad and Apple Vision platforms. Reincubate's official materials
      describe both a limited free edition and paid licensing, supporting use from
      routine calls through more elaborate recording and streaming setups.
  package-nerd-significance:
    - >
      Camo became notable during the rapid growth of remote video by turning existing
      phone cameras into configurable webcams. Its cross-platform pairing,
      virtual-camera integration, image controls, and later support for ordinary webcams
      and cameras place it between a webcam driver, capture utility, and lightweight
      production studio.
  project-history:
    - >
      Reincubate released Camo publicly on July 16, 2020, following a beta that began on
      May 22, 2020. The product combines Camo Studio on a computer with camera sources
      such as phones, webcams, and dedicated cameras.
    - >
      Subsequent releases broadened the supported host and camera platforms. Camo 1.3
      added features and eleven-language support in 2021, while Camo 1.9 added Wi-Fi
      pairing across macOS, Windows, iOS, and Android in 2022. The 2.x generation
      further developed Camo as a video-production environment.
  related-projects:
    - >
      Camo Studio works with Camo Camera on iOS and Android. It also interoperates with
      video-conferencing, recording, and streaming applications that accept its camera
      output.
  sources:
    - https://reincubate.com/about/press-kit/
    - https://reincubate.com/blog/camo-screen-curtain-translations-release/
    - https://reincubate.com/blog/camo-wifi-release/
    - https://reincubate.com/support/camo/release-notes/
  summary:
    - >
      Camo Studio is Reincubate's cross-platform video application for using phones,
      webcams, and cameras as high-quality, tunable video sources.
  timeline:
    - '2020-05-22: Public beta began.'
    - '2020-07-16: First public release.'
    - >
      2021-04-15: Camo 1.3 launched with new capture, energy-saving, and localization
      features.
    - '2022-10-20: Camo 1.9 introduced Wi-Fi device pairing.'
    - '2023: Camo reached the Microsoft Store and Camo Studio launched on iPad.'
    - '2024: Reincubate launched Camo Studio for Apple Vision.'
  usage:
    - >
      Users run Camo Studio on a Mac or PC, connect or pair a supported phone or camera,
      tune framing and image characteristics, and select Camo as the camera source in
      conferencing, streaming, or recording software. Official guidance recommends a
      wired connection when the lowest latency and most robust video path are
      priorities.
