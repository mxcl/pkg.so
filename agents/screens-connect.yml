history:
  adoption-history:
    - >
      Screens Connect was distributed as a free companion utility for macOS and Windows.
      Edovia later integrated its functionality directly into Screens for Mac 5.8.8 and
      later on macOS 14 and later, while continuing to offer the standalone utility for
      older or separate installations.
  package-nerd-significance:
    - >
      Screens Connect packages the otherwise fiddly work of VNC reachability, account
      association, and router port mapping into a menu-bar companion. It is especially
      relevant to Mac package users because Homebrew Cask installs the standalone helper
      even as newer Screens versions absorb the feature.
  project-history:
    - >
      Edovia developed Screens Connect as the connectivity companion to its Screens
      remote-desktop clients. It automatically configures remote reachability for a Mac
      or Windows PC using compatible NAT-PMP or UPnP routers, with manual configuration
      available when automatic mapping is unavailable.
    - >
      The utility evolved alongside Screens and remains documented separately for setup,
      networking, troubleshooting, and legacy standalone installations.
  related-projects:
    - >
      Screens is Edovia's client application for connecting to computers configured
      through Screens Connect.
    - Screens Assist is Edovia's related temporary support and connection product.
    - >
      VNC Screen Sharing and SSH are underlying remote-access technologies used by the
      Screens ecosystem.
  sources:
    - https://edovia.com/en/screens-connect/
    - https://help.edovia.com/en/screens-connect-5/faq/supported-routers
    - https://support.edovia.com/en/screens-5/getting-started/connecting
    - https://support.edovia.com/en/screens-connect-5
    - source_facts.provenance
  summary:
    - >
      Screens Connect is Edovia's companion utility for making a Mac or Windows PC
      reachable by the Screens remote-desktop client.
  timeline:
    - >
      Standalone era: Screens Connect was released as a free companion utility for
      Screens clients.
    - >
      Screens Connect 5: Edovia documented automatic NAT-PMP/UPnP setup, manual
      configuration, account connectivity, and extensive troubleshooting.
    - >
      Screens 5.8.8 and later: Screens Connect became built into Screens for Mac on
      macOS 14 and later, reducing the need for a standalone installation.
  usage:
    - >
      Users install Screens Connect on the computer to be controlled, sign in to their
      Screens Connect account, and enable the required macOS or Windows remote-access
      services. The utility attempts to configure the router automatically; manual port
      mapping is available for unsupported network equipment.
    - >
      The Screens client then uses the account-linked computer entry to establish local
      or remote connections.
