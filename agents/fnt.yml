id: brew:fnt
display-name: fnt
repo: null
docs:
  - https://github.com/alexmyczko/fnt#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata lists Homebrew, Debian, and Ubuntu packages. The
      README also points users to Repology for native package-manager availability and
      notes official Debian stable backports.
  package-nerd-significance:
    - >
      fnt is interesting to package-manager users because it treats fonts as
      CLI-installable packages across operating systems, bridging Debian font packages,
      Google Fonts, terminal previews, and local font installation. It makes font
      discovery and installation look like ordinary Unix package work.
  project-history:
    - >
      The project was created around the packaging gap between operating-system package
      repositories and font distribution. The README specifically calls out Debian
      stable lagging newer fonts and macOS package managers lacking a large font list.
  related-projects:
    - >
      fnt is related to Debian sid font packages, Google Fonts, Repology, chafa,
      screenshots.debian.net, FontForge, Birdfont, TruFont, and Google woff2, all of
      which are referenced by the official README as sources, helpers, or adjacent font
      tools.
  sources:
    - https://formulae.brew.sh/api/formula.json
    - https://formulae.brew.sh/formula/fnt
    - https://github.com/alexmyczko/fnt
    - https://github.com/alexmyczko/fnt#readme
  summary:
    - >
      fnt is a command-line font manager for macOS and Linux. Its official README
      describes it as 'apt for fonts' and positions it as a way to install fonts from
      Debian sid and Google Fonts when native platform package managers do not provide a
      broad or current font catalog.
  timeline:
    - 'Current: Official README describes fnt as an apt-like font manager for macOS and Linux.'
    - 'Current: Official README lists Debian sid and Google Fonts as font repositories.'
    - 'Current: Supplied package metadata lists Homebrew, Debian, and Ubuntu packages.'
  usage:
    - >
      fnt users run `fnt update`, inspect available fonts with `fnt info`, search with
      `fnt search`, preview fonts in the terminal, install a chosen font, and list
      installed font files. The README includes bulk-install examples for Debian and
      Google font sources.
related-packages:
  - id: brew:fontforge
    reason: >
      After using fnt to discover and install fonts, use FontForge to create, inspect,
      convert, or edit their outlines; fnt's official README explicitly recommends it
      for font editing.
    rel: adjacent_workflow
    sources:
      - https://github.com/alexmyczko/fnt#readme
      - https://fontforge.org/
