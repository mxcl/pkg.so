id: brew:facad
display-name: facad
repo: null
docs:
  - https://github.com/yellow-footed-honeyguide/facad#readme
  - https://yellow-footed-honeyguide.github.io/facad
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is packaged for Homebrew, and its README also points Arch users to an
      AUR install path. Homebrew's formula currently tracks the upstream GitHub release
      archive for the stable version.
  package-nerd-significance:
    - >
      Package-manager users care about facad as part of the modern ls-alternative
      family: a small native executable that changes everyday shell ergonomics without
      pulling in a large runtime.
  project-history:
    - >
      The GitHub repository was created in July 2024. Its official README describes a
      pure C implementation with sorted directory-first output, Unicode-aware
      formatting, symlink and executable-file handling, and optional long-listing and
      analytics modes.
  related-projects:
    - >
      facad sits near other terminal directory-listing and ls-replacement tools, while
      keeping its implementation in C and its documented dependency surface minimal.
  sources:
    - https://api.github.com/repos/yellow-footed-honeyguide/facad
    - https://api.github.com/repos/yellow-footed-honeyguide/facad/releases
    - https://formulae.brew.sh/api/formula/facad.json
    - https://github.com/yellow-footed-honeyguide/facad#readme
    - https://yellow-footed-honeyguide.github.io/facad/
  summary:
    - >
      facad is a C command-line directory listing tool positioned as a modern, colorful
      alternative to traditional file listing workflows.
  timeline:
    - '2024: GitHub repository created.'
    - '2024: v1.1.0 published on GitHub Releases.'
    - '2025: v2.20.16 published and tracked by Homebrew.'
  usage:
    - >
      facad is run as a terminal command for default grid file listings, with documented
      flags for help, version output, long listing, and directory analytics.
related-packages:
  - id: brew:eza
    reason: >
      Choose eza when you want a mature `ls` replacement with Git status, tree views,
      hyperlinks, extended metadata, and configurable themes.
    rel: alternative
    sources:
      - https://github.com/yellow-footed-honeyguide/facad
      - https://github.com/eza-community/eza
  - id: brew:lsd
    reason: >
      Choose lsd when icons, themes, and extensive YAML configuration are more important
      than facad's dependency-free C implementation.
    rel: alternative
    sources:
      - https://github.com/yellow-footed-honeyguide/facad
      - https://github.com/lsd-rs/lsd
