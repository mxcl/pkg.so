history:
  adoption-history:
    - >
      Yandex extended Music from its desktop web service to mobile applications and then
      built discovery around listening history and preferences. The official desktop
      application is now offered for macOS, Windows, and supported Linux distributions.
    - >
      The service's continuing emphasis on recommendations, collections, charts,
      podcasts, and audiobooks reflects its evolution from a music catalog into a
      broader personalized audio platform.
  package-nerd-significance:
    - >
      The cask provides package-managed installation of Yandex's proprietary desktop
      streaming client. It is relevant to package users who prefer a dedicated
      application over a browser tab and want upgrades handled through their
      package-manager workflow.
  project-history:
    - >
      Yandex introduced enhanced legal music streaming in 2010, allowing listeners to
      explore albums and artist discographies. An updated iPhone application followed in
      2012.
    - >
      In September 2014 Yandex relaunched Yandex.Music around daily personal
      recommendations derived from listening preferences and other discovery signals.
      The modern service centers recommendations in My Vibe and offers dedicated desktop
      applications.
  related-projects:
    - Yandex Plus supplies the subscription used for listening in the desktop application.
    - My Vibe is Yandex Music's personalized recommendation stream.
    - Yandex's Alice-enabled devices can control playback through the same service ecosystem.
  sources:
    - 'Official 2010 announcement: https://yandex.com/company/news/2010-2010-09-22'
    - 'Official 2012 mobile-app announcement: https://yandex.com/company/news/2012-2012-11-29'
    - 'Official 2014 recommendations relaunch: https://yandex.com/company/news/2014-2014-09-17'
    - 'Official documentation: https://yandex.ru/support/music/en/index-mobile'
  summary:
    - >
      Yandex Music is a licensed music and audio streaming service built around
      playback, personal collections, and algorithmic discovery. This cask installs
      Yandex's official desktop client.
  timeline:
    - '2010: Yandex introduced expanded music streaming for tracks, albums, and discographies.'
    - '2012: Yandex released an updated Yandex Music application for iPhone.'
    - '2014: Yandex Music was relaunched with daily personal recommendations.'
  usage:
    - >
      Listeners use the desktop client to stream music, maintain a collection, explore
      artists and charts, and receive personalized recommendations. Application
      listening requires an eligible Yandex Plus subscription in supported markets.
