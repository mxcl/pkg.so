history:
  adoption-history:
    - >
      The project maintains official documentation, a Web IDE, and a public format
      gallery generated from an open repository of file-format and protocol
      specifications. The website lists open-source users such as Veles, mitmproxy,
      Kismet, Beat Link Trigger, and Hobbits, showing adoption in reverse engineering,
      network inspection, wireless analysis, and binary tooling.
  package-nerd-significance:
    - >
      Kaitai Struct Compiler is package-nerd catnip because it converts binary-format
      archaeology into reproducible build artifacts: one declarative source file can
      generate parsers for many language ecosystems, and the format gallery makes
      specifications browseable like package docs.
  project-history:
    - >
      The Kaitai project presents Kaitai Struct as a language-neutral way to describe
      binary layouts once and generate parsers for many target languages. The compiler
      is the package-manager-facing executable in that ecosystem, turning format
      specifications into code that reads binary files, memory layouts, and network
      packet structures.
  related-projects:
    - >
      Related projects include the Kaitai Struct Web IDE, the formats.kaitai.io gallery,
      the kaitai_struct_formats repository, Veles, mitmproxy, Kismet, and other
      binary-analysis tools.
  sources:
    - https://api.github.com/repos/kaitai-io/kaitai_struct_compiler/releases?per_page=100
    - https://doc.kaitai.io/
    - https://github.com/kaitai-io/kaitai_struct_compiler/releases
    - https://kaitai.io/
    - https://kaitai.io/news/2020/10/16/kaitai-struct-v0.9-released.html
  summary:
    - >
      Kaitai Struct Compiler turns declarative .ksy descriptions of binary formats into
      parser source code for multiple programming languages.
  timeline:
    - '2015: Kaitai Project copyright period begins on the official site.'
    - >
      2020-10-16: Kaitai Struct v0.9 release notes announced a major release and
      documentation/CI changes.
    - '2022-07-08: Compiler release 0.10 published.'
    - '2025-09-07: Compiler release 0.11 published.'
  usage:
    - >
      Developers write a .ksy schema, run kaitai-struct-compiler, and import the
      generated parser into a target language. The result is especially useful when a
      binary format is fixed by someone else and the developer needs a maintainable
      parser rather than hand-written byte-offset code.
