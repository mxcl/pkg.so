credentials-file-location: null
history:
  adoption-history:
    - >
      kubectl-ai sits at the intersection of two high-adoption operator habits:
      kubectl-centric cluster work and AI-assisted terminal workflows. The README
      documents Gemini, Vertex AI, Azure OpenAI, OpenAI, Grok, Bedrock, Ollama, and
      llama.cpp support, which made the tool usable across hosted and local model
      setups.
    - >
      The repository metadata observed on 2026-07-01 showed more than 7000 GitHub stars,
      a strong early signal for a project created in 2025.
  package-nerd-significance:
    - >
      For package nerds, kubectl-ai is a marker of the 2025 shift from Kubernetes CLIs
      that only wrap APIs to CLIs that broker human intent through LLM providers. The
      package is interesting because it carries both classic kubectl-plugin distribution
      and newer MCP integration in one small binary workflow.
  project-history:
    - >
      The GitHub repository was created on 2025-01-20 under the GoogleCloudPlatform
      organization. Its README framed the tool around making Kubernetes management more
      accessible by turning user intent into precise operations, while still requiring
      kubectl to be installed and configured.
    - >
      The project evolved quickly through many 0.0.x releases during 2025 and early
      2026, adding provider breadth and integration modes rather than presenting itself
      as a stable, long-lived Kubernetes subcommand.
  related-projects:
    - >
      kubectl, Krew, MCP, Gemini, Vertex AI, OpenAI-compatible APIs, Bedrock, Ollama,
      and llama.cpp form the surrounding ecosystem. Unlike kubectl plugins that expose
      one Kubernetes resource domain, kubectl-ai is a general assistant layered over
      Kubernetes operations.
  sources:
    - https://api.github.com/repos/GoogleCloudPlatform/kubectl-ai
    - https://github.com/GoogleCloudPlatform/kubectl-ai
    - https://github.com/GoogleCloudPlatform/kubectl-ai#readme
    - https://github.com/GoogleCloudPlatform/kubectl-ai/tree/main/docs
    - https://krew.sigs.k8s.io/docs/user-guide/setup/install/
    - https://kubernetes.io/docs/tasks/extend-kubectl/kubectl-plugins/
  summary:
    - >
      kubectl-ai is Google's AI-assisted Kubernetes command-line assistant. It
      translates natural-language intent into Kubernetes operations and can run as an
      interactive shell, stdin-driven command, kubectl plugin via Krew, MCP client, or
      MCP server.
  timeline:
    - '2025-01-20: GitHub repository created.'
    - >
      2025: README documented Krew installation as `kubectl krew install ai` and
      invocation as `kubectl ai`.
    - '2025-11-03: Release v0.0.27 published.'
    - '2026-01-21: Release v0.0.29 published.'
    - '2026-03-27: Release v0.0.31 published.'
  usage:
    - >
      Users run `kubectl-ai` interactively, pass a task as an argument with quiet mode,
      pipe prompt text through stdin, or install it as the `kubectl ai` plugin via Krew.
      The README also describes environment-variable API keys for hosted providers and
      local model options for Ollama and llama.cpp.
    - >
      Its package-manager role is to put an AI command generator and executor beside
      kubectl rather than inside the cluster, so installation is a developer-workstation
      concern.
related-packages:
  - id: brew:k8sgpt
    reason: >
      Choose K8sGPT for analyzer-driven cluster diagnosis and optional AI explanations;
      choose kubectl-ai for broader conversational Kubernetes operations, custom tools,
      and MCP client/server workflows.
    rel: alternative
    sources:
      - https://github.com/GoogleCloudPlatform/kubectl-ai
      - https://k8sgpt.ai/docs/reference/cli
      - https://k8sgpt.ai/docs/getting-started/installation
  - id: brew:kubernetes-cli
    reason: >
      kubectl-ai requires an installed and configured kubectl and uses it as a built-in
      tool for carrying out the Kubernetes operations inferred from user requests.
    rel: adjacent_workflow
    sources:
      - https://github.com/GoogleCloudPlatform/kubectl-ai
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:krew
    reason: >
      Krew installs kubectl-ai as the `ai` kubectl plugin, after which users invoke it
      through `kubectl ai`.
    rel: adjacent_workflow
    sources:
      - https://github.com/GoogleCloudPlatform/kubectl-ai
      - https://krew.sigs.k8s.io/
