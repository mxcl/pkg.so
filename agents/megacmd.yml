history:
  adoption-history:
    - >
      megacmd remained a small but packaged utility rather than a large ecosystem
      project. The supplied package facts list packages in Homebrew, Nix, Scoop, and
      Alpine, showing that it was kept useful enough for package managers even after
      upstream maintenance became light.
  package-nerd-significance:
    - >
      For package maintainers, megacmd is interesting as an early third-party Mega CLI
      written in Go, with vendored protocol/client code and a small release history. It
      also illustrates the packaging problem of cloud-service CLIs whose upstream API
      can change while the client itself is only lightly maintained.
  project-history:
    - >
      The project emerged during the early Mega.co.nz era, when Mega offered a web
      interface but relatively few Unix-style command-line clients. The README links its
      design to go-mega and compares its transfer-oriented workflow to s3cmd,
      positioning megacmd as a familiar CLI layer over a cloud-storage API.
    - >
      Maintenance later slowed. The upstream README states that the project is no longer
      fully maintained, with light maintenance focused mostly on the underlying go-mega
      library, which is also used for Mega support in rclone.
  related-projects:
    - 'go-mega: the Go Mega client library used underneath megacmd.'
    - >
      rclone: the upstream README notes Mega work in go-mega is also used for rclone's
      Mega backend.
    - 'Megatools: another independent command-line suite for Mega.nz.'
  sources:
    - https://github.com/t3rm1n4l/megacmd
    - https://github.com/t3rm1n4l/megacmd/releases
    - source_facts.package-manager-url
  summary:
    - >
      megacmd is a Go command-line client for the Mega cloud storage service. Its README
      describes it as a tool for file and directory transfer between local directories
      and Mega, with commands for listing, uploading, downloading, deleting, moving,
      making directories, and syncing.
  timeline:
    - >
      2013: README examples and the linked protocol blog place early megacmd usage in
      the first wave of Mega command-line tooling.
    - '2019: GitHub lists release 0.016 as the latest release.'
    - 'Later: Upstream README notes the project is no longer fully maintained.'
  usage:
    - >
      Typical usage centers on scripted file transfer to and from Mega paths such as
      mega:/foo/bar. The README documents put, get, list, delete, mkdir, move, and sync
      operations, plus parallel upload and download workers configured in
      ~/.megacmd.json.
    - >
      Because ~/.megacmd.json stores the Mega username and password alongside transfer
      settings, package users should treat the file as both configuration and credential
      material.
related-packages:
  - id: cask:megacmd-app
    reason: >
      Choose MEGA's official MEGAcmd for a maintained client with interactive and
      scriptable modes, synchronization, backup, and WebDAV or streaming support.
    rel: alternative
    sources:
      - https://github.com/t3rm1n4l/megacmd
      - https://github.com/meganz/MEGAcmd
      - https://mega.nz/cmd
  - id: brew:rclone
    reason: >
      Choose rclone when you want a maintained Mega backend plus the same copy and sync
      vocabulary across many other storage providers.
    rel: alternative
    sources:
      - https://github.com/t3rm1n4l/megacmd
      - https://rclone.org/mega/
      - https://rclone.org/docs/
  - id: brew:megatools
    reason: >
      Choose Megatools for an independently maintained Mega-focused command suite with
      public-link, streaming, account, and remote-filesystem operations.
    rel: alternative
    sources:
      - https://github.com/t3rm1n4l/megacmd
      - https://xff.cz/megatools/
      - https://xff.cz/megatools/man/
