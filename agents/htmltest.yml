id: brew:htmltest
display-name: htmltest
repo: null
docs:
  - https://github.com/wjdp/htmltest#readme
config-file-location:
  unix:
    - .htmltest.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts record Homebrew, Nix, and Fedora development packaging.
      The official GitHub Action gives another adoption route: users can run the binary
      in CI without managing a local install, while package managers serve developers
      who want the same check available on laptops and build hosts.
  package-nerd-significance:
    - >
      For package nerds, htmltest is interesting because it packages a documentation QA
      pattern as a portable Go binary. It is not a browser and not a general validator;
      it is the small CI-friendly check that catches the boring broken-output mistakes
      before release.
  project-history:
    - >
      The README introduces htmltest by comparing it with html-proofer: if a generated
      site needs checking but the user wants to avoid a Ruby environment or wants a
      faster standalone tool, htmltest is the Go-based option. The repository exposes
      `.htmltest.yml` configuration and release tags that show the project maturing
      through repeated 0.x releases.
    - >
      The tag stream includes v0.8.1 in March 2018 and v0.17.0 in November 2022. A
      companion `htmltest-action` repository and GitHub Marketplace action show the
      project moving naturally into CI workflows where generated documentation and
      static sites are checked after builds.
  related-projects:
    - >
      htmltest is related to html-proofer, link checkers, static-site test steps, and
      GitHub Actions that validate generated documentation. Its practical neighbors are
      documentation build pipelines rather than browser-based HTML validators.
  sources:
    - >
      https://api.github.com/repos/wjdp/htmltest/commits/91ffb25a2a211de20da425cf21c584afd358a2c6
    - >
      https://api.github.com/repos/wjdp/htmltest/commits/ec73febdcb639acbeb983089db2df6732e8199bd
    - https://api.github.com/repos/wjdp/htmltest/tags?per_page=20
    - https://github.com/marketplace/actions/htmltest-action
    - https://github.com/wjdp/htmltest
    - https://github.com/wjdp/htmltest-action
    - https://github.com/wjdp/htmltest/releases
  summary:
    - >
      htmltest is a Go command-line checker for generated HTML sites. It tests links,
      images, scripts, alt text, and related generated-output problems, giving
      static-site and documentation projects a single binary alternative to heavier
      runtime stacks.
  timeline:
    - '2018: v0.8.1 was tagged in March.'
    - '2022: v0.17.0 was tagged in November.'
    - >
      CI era: The companion `htmltest-action` repository documents running htmltest from
      GitHub Actions.
    - 'Package-manager era: The input package facts record Homebrew, Fedora, and Nix packaging.'
  usage:
    - >
      htmltest is typically pointed at a generated output directory and optionally
      configured with `.htmltest.yml`. Its job is to catch broken internal or external
      references and markup hygiene issues before a static site, docs tree, or generated
      HTML artifact is published.
related-packages:
  - id: brew:lychee
    reason: >
      Choose lychee when the job is primarily fast asynchronous link checking across
      Markdown, HTML, plaintext, and websites; choose htmltest for broader
      generated-site checks such as images, scripts, doctypes, and alt attributes.
    rel: alternative
    sources:
      - https://lychee.cli.rs/overview/
      - https://github.com/wjdp/htmltest
  - id: brew:vnu
    reason: >
      Run the Nu Html Checker alongside htmltest when generated-site reference checks
      must be complemented by standards validation of HTML, CSS, and SVG markup.
    rel: adjacent_workflow
    sources:
      - https://validator.github.io/validator/
      - https://github.com/wjdp/htmltest
