id: brew:gedit
display-name: gedit
repo: https://gitlab.gnome.org/World/gedit/gedit
docs:
  - https://gedit-text-editor.org/developer-docs/gedit
  - https://gedit-text-editor.org/user-manuals/gedit
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package facts list gedit across many package managers, including apk,
      Homebrew, Debian, Fedora dnf, MacPorts, Nix, pacman, Scoop, Ubuntu, and zypper.
      That breadth matches gedit's long role as a familiar GTK/GNOME editor available
      through desktop Linux and cross-platform packaging channels.
  package-nerd-significance:
    - >
      gedit is significant to package-manager users because it is a long-lived GUI
      editor that carries GTK, GNOME, plugin, syntax-highlighting, and cross-platform
      desktop packaging concerns in a single application.
  project-history:
    - >
      The official gedit site and README state that development started in 1998 at the
      beginnings of the GNOME project. The current project describes gedit as easy to
      learn, comfortable to use, and suitable for simple notes as well as
      software-development-oriented editing.
  related-projects:
    - >
      GTK, Gedit Technology, GtkSourceView, libpeas, gspell, and GNOME are related
      projects named by the official gedit site and technology pages.
  sources:
    - https://gedit-text-editor.org/
    - https://gedit-text-editor.org/technology.html
    - https://gitlab.gnome.org/World/gedit/gedit
  summary:
    - >
      gedit is a general-purpose text editor associated with GNOME and built on GTK and
      Gedit Technology libraries.
  timeline:
    - '1998: gedit development started near the beginning of the GNOME project.'
    - >
      2024: gedit 47 release notes highlighted improved API documentation for plugin
      developers.
    - >
      2026: The official site copyright and release posts show ongoing maintenance by
      the gedit team.
  usage:
    - >
      Users run gedit as a desktop text editor for notes, documents, source code, and
      structured text. Developers and plugin authors use the official developer
      documentation and the main Git repository README and CONTRIBUTING files as entry
      points.
related-packages: []
