id: brew:terraform-provider-libvirt
display-name: terraform-provider-libvirt
repo: null
docs:
  - https://github.com/dmacvicar/terraform-provider-libvirt#readme
config-file-location:
  unix:
    - ~/.terraformrc
    - ~/.ssh/config
credentials-file-location:
  unix:
    - ~/.ssh/id_ed25519
    - ~/.ssh/id_rsa
history:
  adoption-history:
    - >
      The provider has long occupied a practical niche for homelab, workstation, CI, and
      private-cloud users who want Terraform workflows without a public cloud control
      plane. The GitHub repository has a large star count for a community provider, and
      Homebrew packages current releases as a convenient way to install the provider
      binary outside Terraform's normal provider installer paths.
    - >
      Its documentation now points users to both the Terraform Registry and the OpenTofu
      registry, reflecting the post-Terraform-fork packaging world where provider
      consumers may use either registry ecosystem.
  package-nerd-significance:
    - >
      For package nerds, terraform-provider-libvirt is a classic non-cloud Terraform
      provider with awkward packaging edges: it is both a Terraform registry provider
      and a Homebrew formula, depends on libvirt concepts, and bridges the Terraform
      provider installation model with local virtualization workflows.
  project-history:
    - >
      The project dates to February 2016, making it one of the older community Terraform
      providers for local virtualization. Its purpose is to let Terraform manage Linux
      KVM/libvirt infrastructure through provider resources rather than ad hoc shell
      scripts or virt-manager workflows.
    - >
      The current README describes v0.9.0 and later as a complete rewrite of the legacy
      provider. The legacy v0.8 branch remains available, while the rewritten provider
      is built on the Terraform Plugin Framework and models libvirt XML schemas more
      directly through libvirtxml.
  related-projects:
    - libvirt, KVM, and QEMU are the virtualization stack managed by the provider.
    - >
      Terraform Registry and OpenTofu Registry are the documented provider distribution
      surfaces.
  sources:
    - https://api.github.com/repos/dmacvicar/terraform-provider-libvirt
    - https://formulae.brew.sh/api/formula/terraform-provider-libvirt.json
    - https://github.com/dmacvicar/terraform-provider-libvirt#readme
    - https://registry.terraform.io/providers/dmacvicar/libvirt/latest/docs
  summary:
    - >
      terraform-provider-libvirt is a Terraform provider for managing local or remote
      libvirt virtualization resources such as virtual machines, networks, storage
      pools, and volumes.
  timeline:
    - '2016: GitHub repository created.'
    - '2026: v0.9.x releases continue the rewritten Terraform Plugin Framework provider line.'
    - '2026: Homebrew packages v0.9.8.'
  usage:
    - >
      Users declare `dmacvicar/libvirt` as a required provider and configure a libvirt
      URI such as `qemu:///system`, `qemu+ssh://.../system`, `qemu+sshcmd://.../system`,
      or `qemu+tls://.../system`. The provider then manages domains, networks, pools,
      and volumes using HCL that maps closely to libvirt XML.
    - >
      The README also documents local development installation under
      `~/.terraform.d/plugins/registry.terraform.io/dmacvicar/libvirt/dev/linux_amd64/`
      with a Terraform CLI dev override, which matters to packagers and provider
      developers testing local builds.
