history:
  adoption-history:
    - >
      bluetuith is distributed through Homebrew and other operating-system package
      collections, while the official documentation also supports release archives and
      Go-based installation. The project describes itself as alpha-stage software.
  package-nerd-significance:
    - >
      bluetuith brings Bluetooth discovery, pairing, device control, media control,
      networking, and OBEX transfers into a terminal-native workflow, filling a niche
      normally served by graphical managers such as Blueman.
  project-history:
    - >
      The project originated under the `darkhz/bluetuith` identity and is now maintained
      through the `bluetuith-org` organization. Its official README says development has
      received funding from NLnet's NGI Zero Core program.
  related-projects:
    - >
      The official README positions bluetuith as an alternative to Blueman and links its
      platform functionality to the bluetuith-org Bluetooth Classic library.
  sources:
    - https://bluetuith-org.github.io/bluetuith/
    - https://bluetuith-org.github.io/bluetuith/Configuration.html
    - https://github.com/bluetuith-org/bluetuith#readme
    - source_facts.package-manager
  summary:
    - >
      bluetuith is a cross-platform terminal UI for managing Bluetooth adapters,
      devices, connections, pairing, media, networking, and file transfers.
  timeline:
    - 'Early releases: Project developed under the `darkhz/bluetuith` module path.'
    - >
      Later development: Project moved to the `bluetuith-org` organization and gained
      dedicated documentation.
    - >
      Current development: Official materials describe the project as alpha-stage and
      funded through NGI Zero Core.
  usage:
    - >
      bluetuith generally works without configuration. Advanced users can supply HJSON
      settings for the adapter, receive directory, keybindings, and theme; the official
      documentation instructs users to run `bluetuith --help` to discover the
      platform-specific config path and use `--generate` to create it.
related-packages:
  - id: brew:bluez
    reason: >
      On Linux, BlueZ is bluetuith's required Bluetooth stack and supplies the daemon
      and D-Bus interfaces that the TUI manages.
    rel: adjacent_workflow
    sources:
      - https://bluetuith-org.github.io/bluetuith/Installation/Linux.html
      - https://www.bluez.org/about/
  - id: brew:pulseaudio
    reason: >
      Install PulseAudio alongside bluetuith on Linux when the TUI must manage Bluetooth
      device audio profiles, which the official requirements list as an optional
      integration.
    rel: adjacent_workflow
    sources:
      - https://bluetuith-org.github.io/bluetuith/Installation/Linux.html
      - https://www.freedesktop.org/wiki/Software/PulseAudio/Documentation/
  - id: brew:blueutil
    reason: >
      Choose blueutil for scriptable macOS Bluetooth state and device operations with
      JSON output rather than an interactive cross-platform TUI.
    rel: alternative
    sources:
      - https://github.com/bluetuith-org/bluetuith#readme
      - https://github.com/toy/blueutil#readme
  - id: brew:bluetoothconnector
    reason: >
      Choose BluetoothConnector on macOS when the only requirement is a compact command
      for connecting, disconnecting, or toggling one paired device, including Automator
      shortcuts.
    rel: alternative
    sources:
      - https://github.com/bluetuith-org/bluetuith#readme
      - https://github.com/lapfelix/BluetoothConnector#readme
