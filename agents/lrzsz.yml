history:
  adoption-history:
    - >
      The supplied package-manager facts list lrzsz across Homebrew, Debian, Ubuntu,
      Fedora, Arch, Nix, MacPorts, Scoop, WinGet, and openSUSE. That packaging
      persistence reflects how `rz` and `sz` remained useful for terminal-based file
      transfer, serial links, embedded consoles, BBS-era workflows, and recovery
      environments.
    - >
      The project page's latest release is 0.12.20 from December 1998, so modern
      adoption is mostly maintenance packaging of a stable old tool rather than a
      fast-moving upstream.
  package-nerd-significance:
    - >
      lrzsz is package-nerd archaeology that still earns its keep: a compact
      compatibility package for protocols older than many current distributions, but
      still handy when the transport is a shell, modem-like terminal, or serial console
      instead of SSH/SCP.
  project-history:
    - >
      The official lrzsz page describes it as a Unix communication package providing
      XMODEM, YMODEM, and ZMODEM protocols. It says lrzsz is a heavily reworked version
      of the last public-domain release of Omen Technologies' rzsz package, relicensed
      as free software under the GNU GPL.
    - >
      The official changelog on the same page records active 0.12.x development from
      August 1996 through December 1998, focused on portability, syslog support, TCP
      options, performance, security fixes, Dejagnu tests, and platform support
      including BeOS and older SCO.
  related-projects:
    - >
      lrzsz descends from Omen Technologies' rzsz and implements the XMODEM, YMODEM, and
      ZMODEM protocol family used by terminal programs and serial-transfer workflows.
  sources:
    - https://www.ohse.de/uwe/software/lrzsz.html
    - source_facts.package-manager
  summary:
    - >
      lrzsz is Uwe Ohse's free Unix implementation of the XMODEM, YMODEM, and ZMODEM
      file-transfer tools, including the familiar `rz` and `sz` commands.
  timeline:
    - '1996: Official changelog begins the visible 0.12.x release series.'
    - >
      1997: Releases add portability work, TCP options, gettext/autoconf updates, and
      performance improvements.
    - '1998: Version 0.12.20 becomes the latest official release.'
    - >
      2026: Supplied package-manager facts list broad packaging across Unix-like and
      Windows package managers.
  usage:
    - >
      Users typically invoke `rz` to receive files and `sz` to send files through a
      terminal or serial session that supports ZMODEM-style transfers. The package also
      includes prefixed variants such as `lrz`, `lsz`, `lrx`, and `lsx`.
    - >
      No official config file or credential store is documented; transfer behavior is
      controlled with command-line options and the surrounding terminal or serial
      connection.
related-packages:
