history:
  adoption-history:
    - >
      Quip developed as a cloud and mobile productivity platform for teams and joined
      Salesforce in 2016. Salesforce subsequently integrated Quip documents and
      collaboration workflows with customer and business data.
  package-nerd-significance:
    - >
      The macOS cask provides a convenient desktop client for a primarily cloud-hosted
      collaboration service. Package managers can automate client installation, while
      documents, identity, sharing policy, and most operational state remain
      service-managed.
  project-history:
    - >
      Quip began work in 2012 on a connected, collaborative productivity platform. It
      combined documents, spreadsheets, conversations, mentions, tasks, and revision
      history in a shared workspace. Salesforce completed its acquisition of Quip in
      August 2016 and continued developing it as an enterprise collaboration product.
  related-projects:
    - Salesforce integrates Quip with CRM records and business workflows.
    - Slack conversion features provide a path from eligible Quip documents to Slack canvases.
  sources:
    - 'Official Quip acquisition announcement: https://quip.com/blog/salesforce'
    - 'Official Quip release notes: https://quip.com/release-notes'
    - >
      Salesforce Help:
      https://help.salesforce.com/s/articleView?id=quip.htm&language=en_US&type=5
  summary:
    - >
      Quip is Salesforce's collaborative document, spreadsheet, chat, and lightweight
      project-management workspace.
  timeline:
    - "2012: Work began on Quip's collaborative productivity platform."
    - '2016: Salesforce agreed to acquire Quip and closed the acquisition in August.'
    - '2020: Quip support documentation moved to Salesforce Help.'
    - >
      2024: Quip retired its Windows and Android applications while continuing its web,
      macOS, and iOS surfaces.
  usage:
    - >
      Teams create continuously updated documents and spreadsheets, discuss work in
      context, assign tasks with mentions, and review change history. Administrators use
      Salesforce documentation for deployment, access, and integration guidance.
