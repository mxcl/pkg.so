config-file-location:
  unix:
    - ~/.config/amfora/config.toml
    - $XDG_CONFIG_HOME/amfora/config.toml
  windows:
    - '%APPDATA%\amfora\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Amfora quickly became one of the better-known Gemini clients because it combined
      terminal-native packaging with a polished UI at a time when Gemini was
      intentionally small and client choice mattered. The README documents packaging
      across many Linux distributions, Homebrew, MacPorts, Scoop, Termux caveats, binary
      releases, and source builds.
    - >
      The project entered maintenance mode after the author's 2023 blog post about
      stepping back from Gemini, but official releases continued later, with v1.10.0 in
      2024 and v1.11.0 in 2025. That makes it both a historical Gemini-boom package and
      still a maintained-enough terminal client for users who remain in geminispace.
  package-nerd-significance:
    - >
      Amfora is a neat package-manager artifact because the Gemini ecosystem was small,
      decentralized, and protocol-first. A distro package for Amfora often served as a
      user's first practical Gemini client.
    - >
      It also illustrates how a niche protocol client can have serious packaging
      breadth: Linux distro packages, Homebrew, MacPorts, Scoop, Termux workarounds,
      direct binaries, and source builds all appear in the official install story.
  project-history:
    - >
      The makew0rld/amfora repository was created in June 2020, during the early wave of
      Gemini protocol clients. The README's demo notes v1.0.0 and describes a goal of
      being the best-looking Gemini client with the most features in the terminal, while
      remaining cross-platform with full Windows support.
    - >
      Amfora built on Go terminal and content libraries such as cview, tcell, Viper,
      go-gemini, gofeed, Chroma, and termenv. Its feature list grew beyond basic Gemini
      browsing to tabs, TOFU certificate handling, bookmarks, downloads, theming,
      proxying, client certificates, subscriptions, feed support, and syntax
      highlighting for preformatted blocks.
  related-projects:
    - Gemini is the protocol and geminispace is the network/community Amfora targets.
    - >
      Bombadillo is named by Amfora as an alternative for users who want Gopher or other
      non-Web protocols.
    - >
      go-gemini, cview, tcell, Viper, Chroma, gofeed, and termenv are important
      implementation dependencies named in the README.
  sources:
    - https://api.github.com/repos/makew0rld/amfora
    - https://api.github.com/repos/makew0rld/amfora/releases?per_page=8
    - https://raw.githubusercontent.com/makew0rld/amfora/master/README.md
    - https://raw.githubusercontent.com/wiki/makew0rld/amfora/Configuration.md
  summary:
    - >
      Amfora is a terminal browser for the Gemini protocol, written in Go and packaged
      as a single CLI/TUI application. Its README presents it as a featureful,
      attractive Gemini client rather than a multi-protocol browser, explicitly
      directing users who want Gopher or other non-Web protocols to Bombadillo.
  timeline:
    - '2020-06-18: makew0rld/amfora repository is created.'
    - '2020: README demo references v1.0.0-era Amfora.'
    - '2021-12-10: v1.9.2 release is published.'
    - '2023: Project enters maintenance mode according to the README.'
    - '2024-03-18: v1.10.0 release is published.'
    - '2025-07-14: v1.11.0 release is published.'
  usage:
    - >
      Users run amfora as an interactive terminal browser. Configuration is TOML-based,
      with the official wiki stating that config.toml is stored at
      ~/.config/amfora/config.toml by default, $XDG_CONFIG_HOME/amfora/config.toml when
      XDG_CONFIG_HOME is set, and %APPDATA%\amfora\config.toml on Windows.
    - >
      Package-manager users care about terminal capabilities, Unicode behavior,
      config-file bootstrapping, desktop-entry installation on Unix systems, and whether
      the build tracks releases or HEAD. The README explicitly documents Homebrew
      release installs and brew --HEAD installs for macOS users.
related-packages:
  - id: brew:bombadillo
    reason: >
      Choose Bombadillo when terminal browsing must include Gopher, Finger, local files,
      or optional web handling in addition to Gemini; Amfora's README explicitly
      recommends it for non-Web protocols.
    rel: alternative
    sources:
      - https://github.com/makew0rld/amfora#readme
      - https://bombadillo.colorfield.space/
