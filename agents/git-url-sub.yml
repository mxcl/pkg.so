id: brew:git-url-sub
display-name: git-url-sub
repo: null
docs:
  - https://github.com/gosuri/git-url-sub#readme
  - https://gosuri.github.io/git-url-sub
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project had a Homebrew installation path early enough to be documented in the
      README. Homebrew's formula packages version 1.0.1 in homebrew/core and also
      exposes a HEAD build, indicating small but durable package-manager presence.
  package-nerd-significance:
    - >
      git-url-sub is notable as a Unix-style Git helper: a single-purpose command that
      automates a repetitive repository-maintenance chore without building a broader
      synchronization system.
  project-history:
    - >
      Greg Osuri published git-url-sub as a compact Git helper aimed at changing
      repository remotes in bulk rather than editing each repository by hand. The
      official generated man page identifies it as a Git URL substitution utility and
      dates the man page to August 2011.
  related-projects:
    - >
      git-url-sub is related to `git remote set-url`, shell scripting around Git, and
      Homebrew-packaged Git helpers.
  sources:
    - https://formulae.brew.sh/formula/git-url-sub
    - https://github.com/gosuri/git-url-sub#readme
    - https://gosuri.github.io/git-url-sub
  summary:
    - >
      git-url-sub is a small shell Git utility for recursively substituting remote URLs
      across multiple repositories.
  timeline:
    - '2011: Official man page date records August 2011.'
    - '1.0.1: Homebrew packages git-url-sub as the current stable release.'
  usage:
    - >
      Practitioners use git-url-sub with a pattern and replacement to rewrite remote
      URLs, for example after a GitHub organization rename, a hosting migration, or a
      switch between URL styles. The `-c` option commits changes and `-s` suppresses
      output.
related-packages:
  - id: brew:git
    reason: >
      Git's `remote set-url` command is the underlying single-repository alternative,
      while git-url-sub adds recursive discovery and pattern-based replacement across
      multiple repositories.
    rel: alternative
    sources:
      - https://github.com/gosuri/git-url-sub#readme
      - https://git-scm.com/docs/git-remote
tags:
  - cli
  - git-extension
  - repository-management
  - url-rewriting
