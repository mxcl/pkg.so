id: cask:prismlauncher
display-name: Prism Launcher
repo: null
docs:
  - https://prismlauncher.org/wiki
config-file-location:
  linux:
    - ~/.local/share/PrismLauncher/prismlauncher.cfg
    - ~/.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/prismlauncher.cfg
  macos:
    - ~/Library/Application Support/PrismLauncher/prismlauncher.cfg
  windows:
    - '%APPDATA%\PrismLauncher\prismlauncher.cfg'
credentials-file-location:
  linux:
    - ~/.local/share/PrismLauncher/accounts.json
    - ~/.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/accounts.json
  macos:
    - ~/Library/Application Support/PrismLauncher/accounts.json
  windows:
    - '%APPDATA%\PrismLauncher\accounts.json'
history:
  adoption-history:
    - >
      Prism Launcher attracted users seeking isolated Minecraft installations,
      integrated mod and modpack discovery, and packaging-friendly open-source
      governance. Its official site emphasizes support for popular loaders and
      distribution sources including Forge, Fabric, Quilt, CurseForge, Modrinth,
      Technic, and FTB.
  package-nerd-significance:
    - >
      The launcher is a prominent example of open-source projects forking over
      redistribution and governance policy. Its lineage also matters to Linux package
      maintainers because third-party packaging and the availability of Microsoft
      authentication API credentials were central issues behind the original MultiMC
      fork.
  project-history:
    - >
      Prism Launcher descends from PolyMC, which was created from MultiMC in late 2021
      after disagreements concerning third-party packaging and redistribution. Former
      PolyMC contributors created Prism Launcher following the removal of maintainers
      and governance changes in October 2022.
    - >
      The community-run project continued the instance-management model while expanding
      integrated installation of loaders, mods, resource packs, shaders, and modpacks.
  related-projects:
    - Minecraft
    - MultiMC
    - PolyMC
    - Modrinth
    - CurseForge
  sources:
    - https://prismlauncher.org/about/
    - https://prismlauncher.org/wiki/getting-started/data-location/
    - https://prismlauncher.org/wiki/overview/faq/
  summary:
    - >
      Prism Launcher is a community-developed, cross-platform Minecraft launcher for
      maintaining multiple isolated game installations and their associated
      modifications.
  timeline:
    - '2021: PolyMC forked from MultiMC amid packaging and redistribution disagreements.'
    - >
      2022: Former PolyMC contributors established Prism Launcher following a governance
      dispute.
  usage:
    - >
      Users create independent Minecraft instances, choose game and mod-loader versions,
      manage Java and memory settings, authenticate game accounts, and install mods or
      modpacks from supported services. Isolated instances prevent configurations and
      content from interfering with one another.
