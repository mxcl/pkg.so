credentials-file-location: null
history:
  adoption-history:
    - >
      Hyper attracted users who wanted a graphical terminal whose interface, themes, and
      extensions could be implemented with familiar JavaScript, CSS, React, and Electron
      tooling. The official project documents distribution through native downloads as
      well as Homebrew Cask, Chocolatey, the AUR, Nix, and other packaging ecosystems.
  package-nerd-significance:
    - >
      Hyper became a prominent example of Electron and web technologies being applied to
      a foundational developer tool. Its plugin and theme model made the terminal itself
      resemble a package-extensible application, while also illustrating the size,
      startup, and native-integration tradeoffs of shipping a terminal through a
      browser-derived runtime.
  project-history:
    - >
      Hyper emerged in 2016 under Vercel's former Zeit organization as an open-source,
      cross-platform terminal. Its stated goal was to provide a beautiful and extensible
      command-line interface built on open web standards. Development continued through
      stable 2.x and 3.x lines and later 4.x canary work.
  related-projects:
    - >
      The official Hyper organization links a sample extension, sample theme, and
      Awesome Hyper catalog.
    - >
      Hyper uses Electron for its desktop shell and xterm.js-style web terminal
      technology for terminal presentation.
  sources:
    - https://github.com/vercel/hyper
    - https://github.com/vercel/hyper/blob/canary/PLUGINS.md
    - https://github.com/vercel/hyper/releases
    - https://hyper.is/
    - source_facts.package-manager
  summary:
    - >
      Hyper is an open-source, cross-platform terminal emulator built with web
      technologies. It emphasizes visual customization and extensibility through
      JavaScript plugins, local plugins, themes, and a user-editable .hyper.js file.
  timeline:
    - "2016: Hyper's early public releases established the web-technology terminal project."
    - '2023: Hyper 3.4.1 became the stable release documented by the official release page.'
    - >
      Later development: The project began publishing 4.x canary builds with
      configuration migration work.
  usage:
    - >
      Users install the desktop application, select their preferred shell, and customize
      fonts, colors, key behavior, shell arguments, plugins, and local plugins in
      .hyper.js. It is commonly used as a visually customizable front end for ordinary
      shells and command-line development workflows.
