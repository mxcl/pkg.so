history:
  adoption-history:
    - >
      The software was developed and tested primarily for GNU/Linux and was packaged as
      a C library plus console, curses, and Qt applications. Later releases added
      PulseAudio support and build portability work for FreeBSD and OpenBSD.
    - >
      Its SourceForge distribution has provided release archives and project
      infrastructure since 2011, while downstream Unix package managers make the
      command-line programs convenient to install without building their audio and
      user-interface dependencies manually.
  package-nerd-significance:
    - >
      unixcw is characteristic of durable Unix hobbyist software: a reusable C library
      sits beneath small composable command-line and terminal applications, with
      optional graphical and hardware-keying capabilities.
    - >
      It also preserves an intersection of Unix audio stacks, terminal interfaces,
      amateur-radio practice, and external keying hardware that is rarely represented by
      mainstream desktop packages.
  project-history:
    - >
      Simon Baldwin developed unixcw until the middle of 2006. With Baldwin's
      permission, Kamil Ignacak took over the project on 10 September 2011 and continued
      it through the official SourceForge project.
    - >
      The suite centers on libcw and includes `cw`, `cwgen`, `cwcp`, and `xcwcp`. Its
      capabilities cover Morse translation and timing, audio sidetones, sending and
      receiving, speed tracking, iambic keying, and straight-key emulation.
  related-projects:
    - libcw is the core library shared by the unixcw applications.
    - >
      cw is the stdin-driven Morse sending engine; cwgen produces practice characters;
      cwcp and xcwcp provide terminal and Qt-based tutoring interfaces.
  sources:
    - https://sourceforge.net/p/unixcw/home/Home/
    - https://sourceforge.net/projects/unixcw/
    - https://unixcw.sourceforge.net/
    - https://unixcw.sourceforge.net/about.html
    - https://unixcw.sourceforge.net/news.html
  summary:
    - >
      unixcw is a GNU/Linux-oriented Morse-code software suite. It combines the libcw C
      library with command-line, curses, and Qt tools for learning, practicing,
      generating, sending, and receiving continuous-wave Morse code.
  timeline:
    - "Mid-2006: Original developer Simon Baldwin's period of development ended."
    - >
      2011-09-10: Kamil Ignacak took over maintenance, and the SourceForge project was
      registered.
    - '2012-06-30: Version 3.1.0 added PulseAudio support.'
    - '2014-11-11: Version 3.4.0 refreshed cwcp and improved FreeBSD and OpenBSD build support.'
    - '2015-10-06: Version 3.5.0 moved xcwcp to Qt 5.'
    - '2021-01-17: Version 3.6.0 was released.'
    - '2023-11-18: Version 3.6.1 was released.'
  usage:
    - >
      Learners can pipe generated practice text from `cwgen` into `cw`, use the
      curses-based `cwcp`, or use `xcwcp` for graphical sending and receiving practice.
    - >
      libcw supports application developers who need Morse timing, tone generation,
      decoding, adaptive speed tracking, iambic keying, or control of an external keying
      device. The official web documentation does not identify a standard per-user
      configuration-file or credentials-file location.
