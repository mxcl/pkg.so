id: brew:lxsplit
display-name: lxSplit
repo: http://lxsplit.cvs.sourceforge.net/lxsplit
docs:
  - https://lxsplit.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official distribution artifacts included source, source RPM, i386 and x86_64 RPMs,
      and an i386 Debian package. In this batch metadata it is still packaged for
      Homebrew and Ubuntu, which is consistent with a small stable utility whose format
      compatibility remains useful despite slow upstream activity.
  package-nerd-significance:
    - >
      lxSplit is package-nerd interesting because it is the sort of tiny,
      format-compatible Unix tool that persists in package collections long after active
      upstream churn stops. It is a simple C-era utility with no config surface, no
      daemon model, and a stable command-line contract.
  project-history:
    - >
      The official lxSplit homepage says the tool was originally written by Richard
      Stellingwerff and later maintained at its SourceForge home. The page was last
      updated on 17 October 2008 and lists 0.2.4 as the latest version.
    - >
      The project belongs to the late-2000s SourceForge era of compact single-purpose
      Unix utilities: a simple homepage, downloadable source tarball, RPMs and a Debian
      package, forums and trackers for support, and a CVS repository exposed by
      SourceForge.
  related-projects:
    - HJSplit is the compatible split-file utility referenced by the lxSplit homepage.
  sources:
    - https://lxsplit.sourceforge.net/
    - https://sourceforge.net/p/lxsplit/code/
    - https://sourceforge.net/projects/lxsplit/
    - source_facts.package-manager
  summary:
    - >
      lxSplit is a small Unix-like command-line tool for splitting files into pieces and
      joining them back together. Its distinguishing feature is compatibility with
      HJSplit-style split files.
  timeline:
    - >
      2008: Official homepage lists 0.2.4 as latest and notes the page was last updated
      on 17 October 2008.
    - >
      2008: SourceForge project page and CVS repository are the official upstream
      project surfaces.
  usage:
    - >
      The documented interface is deliberately minimal: `lxsplit -s hugefile.bin 15M`
      creates numbered chunks, while `lxsplit -j smallfiles.bin.001` joins pieces back
      into the original file. Sizes can be given in megabytes, kilobytes, or bytes, and
      version 0.2.1 added support for files of 4 GB or larger.
related-packages:
  - id: brew:coreutils
    reason: >
      Choose GNU Coreutils for a maintained, script-oriented `split` plus `cat` workflow
      with extensive chunking options; choose lxSplit when HJSplit-compatible numbered
      pieces are required.
    rel: alternative
    sources:
      - https://lxsplit.sourceforge.net/
      - https://www.gnu.org/software/coreutils/manual/html_node/split-invocation.html
      - https://www.gnu.org/software/coreutils/manual/html_node/cat-invocation.html
