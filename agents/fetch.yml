history:
  adoption-history:
    - >
      Official installation guidance treats Homebrew packages as third-party convenience
      packages and recommends GitHub Releases for release binaries. The tool's adoption
      story is therefore centered on infrastructure teams consuming versioned assets
      from Git hosting services rather than a large ecosystem of plugins or libraries.
  package-nerd-significance:
    - >
      fetch is package-manager-adjacent: it is not a package manager, but it solves the
      same reproducibility itch for teams distributing small tools out of Git releases.
      Package nerds care because it codifies a common bootstrap pattern without
      requiring every installer script to hand-roll GitHub or GitLab API plumbing.
  project-history:
    - >
      The README explains the tool's origin in Gruntwork's need to publish scripts and
      binaries that clients could install at a specific version. The public repository
      was created in 2016, and the tool grew around the practical cases that were
      awkward with a bare curl or wget command: private repositories, JSON API
      responses, release assets, authentication, checksums, and semantic-version tag
      constraints.
  related-projects:
    - >
      fetch overlaps with curl, wget, GitHub Releases, GitLab releases, and
      semantic-version tooling, but focuses on authenticated, version-selected
      repository and release-asset downloads.
  sources:
    - https://github.com/gruntwork-io/fetch
    - https://raw.githubusercontent.com/gruntwork-io/fetch/master/README.md
    - https://api.github.com/repos/gruntwork-io/fetch
  summary:
    - >
      Gruntwork's fetch is a release-asset and repository-content downloader for GitHub
      and GitLab repositories. It exists to turn a versioned repository reference into
      an installable file, directory, or binary asset with less shell scripting around
      API calls and authentication.
  timeline:
    - '2016: Public GitHub repository created.'
    - >
      2016 onward: README positions fetch around downloading versioned scripts, folders,
      and release assets from GitHub repositories.
    - >
      README status note: GitLab support covers public, private, nested-group, and
      self-hosted repositories.
  usage:
    - >
      Common usage is a one-liner such as fetch --repo=... --tag=... --source-path=...
      /tmp/path. The CLI can select a branch, commit, tag, or tag constraint, download
      selected paths or release assets, verify SHA256 or SHA512 checksums, and use
      environment variables such as GITHUB_OAUTH_TOKEN or GITLAB_TOKEN for private
      repositories.
related-packages:
  - id: brew:gh
    reason: >
      Choose GitHub CLI when the workflow is GitHub-only and should combine
      release-asset downloads with GitHub authentication and the platform's broader
      issue, pull-request, API, and repository commands.
    rel: alternative
    sources:
      - https://cli.github.com/manual/gh_release_download
      - https://github.com/gruntwork-io/fetch#readme
  - id: brew:glab
    reason: >
      Choose GLab when the workflow is GitLab-only and should combine release downloads
      with the broader GitLab CLI rather than fetch's cross-host, installer-focused
      interface.
    rel: alternative
    sources:
      - https://docs.gitlab.com/cli/release/download/
      - https://github.com/gruntwork-io/fetch#readme
