history:
  adoption-history:
    - >
      dvd+rw-tools spread because it solved a boring hardware problem in a scriptable
      way. Distributions, backup recipes, DVD authoring how-tos, and GUI burners could
      rely on growisofs or the smaller media utilities instead of teaching every user
      the low-level optical drive details.
    - >
      The package survived long after optical drives stopped being default laptop
      hardware because old media workflows, lab machines, archival scripts, and
      DVD-Video authoring chains still expected these commands to exist.
  package-nerd-significance:
    - >
      dvd+rw-tools is a fossil worth keeping sharp: it encodes the awkward hardware era
      when optical media, kernel device behavior, firmware quirks, and Unix pipelines
      all had to meet. The package is small, but many old burn scripts and HOWTOs assume
      growisofs is in PATH.
  project-history:
    - >
      The project is associated with Andy Polyakov and the original DVD+RW for Linux
      pages at Chalmers. Public source-package records and manpage references preserve
      the original project URL even though the live page currently redirects to a 404.
      The early packaging record dates the initial dvd+rw-tools package to November
      2002, with the combined version number reflecting growisofs, dvd+rw-format, and
      dvd+rw-booktype versions.
    - >
      growisofs became the centerpiece because it coordinated optical-disc writing with
      ISO filesystem generation. Source and manual summaries describe it as a user-space
      SCSI/MMC-style recording tool originally meant to grow ISO9660 filesystems on
      DVD+RW media, later expanding across DVD formats and Blu-ray media.
  related-projects:
    - >
      Related projects and tools include mkisofs, genisoimage, cdrtools, cdrkit,
      dvdauthor, cdrecord or wodim, and GUI burning front ends that wrapped growisofs
      for everyday desktop users.
  sources:
    - https://fy.chalmers.se/~appro/linux/DVD+RW
    - https://github.com/rbrito/pkg-dvd-rw-tools/blob/master/dvd%2Brw-tools.spec
    - https://man.archlinux.org/man/dvd%2Brw-format.1.en
    - https://man.archlinux.org/man/growisofs.1.en
  summary:
    - >
      dvd+rw-tools is the classic Unix optical-disc toolkit around growisofs and
      companion utilities for recordable DVD, DVD-RAM, and later Blu-ray-style media. It
      is practical package history: a small command-line layer that let scripts burn,
      format, and inspect discs without a GUI.
  timeline:
    - >
      2002-11: Early spec history records the initial dvd+rw-tools packaging and
      versions derived from growisofs, dvd+rw-format, and dvd+rw-booktype.
    - >
      2003: Release notes in package records show additions for DVD-R/RW support,
      write-speed control, overburn protection, and BSD portability work.
    - >
      2004: Package records show ports and drive-compatibility fixes across Solaris,
      HP-UX, IRIX, and specific DVD hardware behavior.
    - '2008: Public package summaries record dvd+rw-tools 7.1 as the later stable release line.'
  usage:
    - >
      Common commands include growisofs for burning an image or filesystem tree,
      dvd+rw-format for formatting or blanking rewritable media, dvd+rw-mediainfo for
      drive and disc status, dvd+rw-booktype for book type settings, and dvd-ram-control
      for DVD-RAM behavior.
    - >
      In package-nerd workflows it often appears after tools such as mkisofs,
      genisoimage, or dvdauthor: one tool builds a filesystem or VIDEO_TS tree, and
      dvd+rw-tools writes the result to physical media.
related-packages:
  - id: brew:cdrtools
    reason: >
      Choose Cdrtools when you need a broader premastering and recording suite spanning
      CD, DVD, and Blu-ray with tools such as mkisofs and cdrecord; choose dvd+rw-tools
      for growisofs-centered DVD writing and its focused DVD media utilities.
    rel: alternative
    sources:
      - https://cdrtools.sourceforge.net/private/cdrecord.html
      - https://cdrtools.sourceforge.net/private/man
      - https://fy.chalmers.se/~appro/linux/DVD+RW
  - id: brew:dvdauthor
    reason: >
      Use dvdauthor to assemble menus, titles, chapters, subtitles, and the DVD-Video
      directory structure, then use growisofs from dvd+rw-tools to record that structure
      to disc.
    rel: adjacent_workflow
    sources:
      - https://dvdauthor.sourceforge.net/
      - https://dvdauthor.sourceforge.net/doc
      - https://fy.chalmers.se/~appro/linux/DVD+RW
