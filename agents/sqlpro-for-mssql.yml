history:
  adoption-history:
    - >
      SQLPro for MSSQL targets users who need SQL Server administration from macOS
      without running SQL Server Management Studio in a Windows virtual machine. It
      later became available on iOS and Windows as well. Homebrew cask installation
      integrates the independently distributed Mac build into package-managed setups.
  package-nerd-significance:
    - >
      The application is part of the native-client alternative to Java, Electron, and
      virtual-machine-based database tools. Package users may particularly value a
      dedicated SQL Server client with a small platform-native footprint and direct
      support for Azure SQL and hosted SQL Server services.
  project-history:
    - >
      SQLPro for MSSQL is part of Kyle Hankinson's independently developed SQLPro
      family. The developer states that he has built native macOS and iOS applications
      since 2010.
    - >
      The product evolved as a focused SQL Server client offering an SSMS-like workflow
      on Apple platforms, later adding Windows availability and support for major hosted
      SQL Server services.
  related-projects:
    - >
      SQLPro Studio is the same developer's multi-database client and shares the SQL
      Server query, autocomplete, tunneling, and execution components.
    - Other SQLPro editions target MySQL, PostgreSQL, and SQLite.
  sources:
    - https://www.macsqlclient.com/
    - https://www.macsqlclient.com/blog/15-license-key-faq
    - https://www.macsqlclient.com/compare/sqlpro-studio
    - https://www.macsqlclient.com/faq/
    - https://www.macsqlclient.com/features
  summary:
    - >
      SQLPro for MSSQL is a proprietary native client for querying and managing
      Microsoft SQL Server from macOS, iOS, and Windows.
  timeline:
    - '2010: Developer Kyle Hankinson began building native macOS and iOS applications.'
    - >
      2021: The official licensing FAQ documented the independently developed SQLPro
      product family and cross-platform licensing.
    - >
      Current generation: SQLPro for MSSQL supports SQL Server 2005 and later plus Azure
      SQL, Amazon RDS, and Google Cloud-hosted SQL Server.
  usage:
    - >
      Users create a SQL Server connection, optionally configure SSH tunneling or TLS,
      browse database objects, write T-SQL with autocomplete, execute multiple result
      sets, and import or export data. The official features page says saved connection
      credentials are secured through iCloud Keychain on Apple platforms.
