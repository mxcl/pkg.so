credentials-file-location: null
history:
  adoption-history:
    - >
      Digdag became most visible in data engineering and operations environments that
      needed a self-hosted workflow scheduler with a CLI, server mode, REST API, and
      pluggable operators. Homebrew and Scoop packaging made the CLI convenient for
      local workflow development, while the Java server and documented APIs made it
      suitable for team deployments.
  package-nerd-significance:
    - >
      For package nerds, Digdag is an example of a JVM-based data scheduler shipped as a
      command-line tool and maintained with formal release notes. It sits in the lineage
      of cron replacements and DAG workflow engines, but with a compact CLI-first
      install story that made it easy to package for developer machines.
  project-history:
    - >
      The public repository dates to September 2015, and the official release notes
      preserve a long 0.x line from early releases through the 0.10 series. Digdag's
      model packages workflow definitions with scripts, SQL, and other files into
      projects, then stores project revisions so past runs can be inspected or retried.
  related-projects:
    - >
      Digdag belongs to the workflow-orchestration family alongside cron-style
      schedulers, DAG engines, and data pipeline tools. Its own docs highlight operators
      and plugins as the extension surface rather than tying the project to one cloud or
      data warehouse.
  sources:
    - https://api.github.com/repos/treasure-data/digdag
    - https://docs.digdag.io/
    - https://docs.digdag.io/concepts.html
    - https://docs.digdag.io/releases.html
    - https://github.com/treasure-data/digdag#readme
  summary:
    - >
      Digdag is Treasure Data's workload automation system for building, running,
      scheduling, and monitoring task pipelines. The official documentation presents it
      as a DAG-based tool for cron replacement, operations automation, data analytics
      batch jobs, and machine-learning pipelines.
  timeline:
    - '2015: Public GitHub repository created.'
    - '2016: Early 0.6, 0.7, and 0.8 release notes appear in the official documentation.'
    - >
      2017: Documentation describes projects, revisions, sessions, attempts, scheduled
      execution, operators, and plugins.
    - '2020s: The 0.10 release line remains documented as the current public documentation set.'
  usage:
    - >
      A typical Digdag workflow defines tasks and dependencies in project files, runs
      them locally during development, then pushes the project to a Digdag server for
      scheduled or monitored execution. The documentation emphasizes session time,
      retries, stored parameters, operators, plugins, and project revisions as core
      operational concepts.
