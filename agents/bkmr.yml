id: brew:bkmr
display-name: bkmr
repo: null
docs:
  - https://github.com/sysid/bkmr/wiki
  - https://github.com/sysid/bkmr/wiki/Configuration
  - https://github.com/sysid/bkmr#readme
config-file-location:
  unix:
    - ~/.config/bkmr/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      bkmr remains a relatively small but active package, distributed through crates.io
      and Homebrew. Its README notes appearance as This Week in Rust crate of the week
      482, which helped place it in the Rust CLI ecosystem.
  package-nerd-significance:
    - >
      bkmr is interesting because it combines older bookmark-manager and snippet-manager
      ideas with newer local embeddings and AI-agent memory conventions. For package
      watchers it is a compact Rust example of the 'local knowledge base as CLI
      primitive' trend.
  project-history:
    - >
      The GitHub repository was created in 2023, and the crate was published on
      crates.io soon after. The README describes bkmr as 'Knowledge Management for
      Humans and Agents' and highlights local full-text and semantic search, JSON
      output, a built-in LSP server, and structured agent-memory workflows.
  related-projects:
    - >
      bkmr overlaps with bookmark managers, snippet managers, local note systems, and
      command launchers, but differs by exposing its store through a scriptable CLI and
      JSON output.
    - >
      The README positions its agent-memory mode as a reusable protocol, including a
      bundled bkmr-memory skill.
  sources:
    - https://crates.io/crates/bkmr
    - https://github.com/sysid/bkmr#readme
    - https://github.com/sysid/bkmr/wiki
    - source_facts.package-manager
  summary:
    - >
      bkmr is a local-first CLI for bookmarks, snippets, shell commands, markdown notes,
      files, and agent memory. In package terms it sits between personal knowledge
      management and developer workflow tooling.
  timeline:
    - '2023: bkmr repository is created on GitHub.'
    - '2023: bkmr crate is published on crates.io.'
    - '2023: The project is featured as This Week in Rust crate of the week 482.'
    - '2020s: bkmr adds agent-memory, semantic-search, JSON, and LSP-oriented workflows.'
  usage:
    - >
      Users add URLs, snippets, shell commands, markdown, text, local files, or agent
      memories with tags, then search or dispatch them through commands such as search,
      hsearch, sem-search, add, open, import-files, tags, and lsp. Configuration is
      generated to ~/.config/bkmr/config.toml, with a local database created by the
      user.
related-packages:
  - id: brew:buku
    reason: >
      Choose buku for a mature, bookmark-focused CLI with browser import/export and an
      optional web UI; choose bkmr when the same local store must also handle snippets,
      notes, files, semantic search, or agent memory.
    rel: alternative
    sources:
      - https://github.com/sysid/bkmr#readme
      - https://github.com/jarun/buku#readme
  - id: brew:pet
    reason: >
      Choose pet for a narrowly focused shell-snippet workflow with parameterized
      commands and optional Gist or GitLab synchronization; choose bkmr for broader
      local knowledge types and offline semantic search.
    rel: alternative
    sources:
      - https://github.com/sysid/bkmr#readme
      - https://github.com/knqyf263/pet#readme
