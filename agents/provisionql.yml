history:
  adoption-history:
    - >
      ProvisionQL became a specialized macOS utility for developers who regularly
      inspect IPA packages, Xcode archives, app extensions, and provisioning profiles.
      Its Homebrew cask provides a reproducible installation path outside the Mac App
      Store.
  package-nerd-significance:
    - >
      ProvisionQL turns opaque Apple application archives and signed provisioning data
      into Finder previews and structured inspection output. It is useful when auditing
      entitlements, certificates, device lists, platform metadata, and signing failures
      without opening Xcode or manually decoding profiles.
  project-history:
    - >
      Evgeny Aleksandrov created and maintains ProvisionQL, initially basing it on Craig
      Hockenberry's Provisioning project. Successive releases added app-extension and
      Xcode-archive support, entitlement parsing, signing information, dark mode, and
      broader metadata extraction. Version 2.0 rewrote previews for modern macOS, added
      a standalone file inspector, expanded archive support, and hardened parsing of
      malformed input.
  related-projects:
    - Craig Hockenberry's Provisioning project supplied the initial basis.
    - macOS Finder Quick Look provides the preview surface.
    - Xcode produces several of the archive and provisioning formats inspected by ProvisionQL.
  sources:
    - 'Official README: https://github.com/ealeksandrov/ProvisionQL#readme'
    - 'Official changelog: https://github.com/ealeksandrov/ProvisionQL/blob/main/CHANGELOG.md'
  summary:
    - >
      ProvisionQL is an open-source macOS file inspector and Quick Look extension for
      Apple application archives and provisioning profiles.
  timeline:
    - 'Version 1.0.0: Initial release.'
    - 'Version 1.2.0: Added app-extension support.'
    - 'Version 1.4.0: Added entitlement parsing and Xcode archive support.'
    - 'Version 2.0.0: Reworked the project for modern macOS and added a standalone inspector.'
  usage:
    - >
      Users open or drop supported files into ProvisionQL for full inspection, or invoke
      Finder Quick Look for previews and thumbnails. Supported inputs include IPA and
      TIPA packages, Xcode archives, app extensions, and iOS or macOS provisioning
      profiles.
