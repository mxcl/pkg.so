id: brew:fastqc
display-name: FastQC
repo: https://github.com/s-andrews/FastQC
docs:
  - https://www.bioinformatics.babraham.ac.uk/projects/fastqc
  - https://www.bioinformatics.babraham.ac.uk/projects/fastqc/Help
config-file-location:
  unix:
    - <FastQC installation>/Configuration/limits.txt
credentials-file-location: null
history:
  adoption-history:
    - >
      FastQC became a standard first-pass QC tool for high-throughput sequencing because
      it works both as an interactive GUI and as a non-interactive pipeline step. The
      project page emphasizes permanent HTML report export and example reports for
      Illumina, RNA-Seq adapter contamination, small RNA, RRBS, PacBio, and 454
      datasets.
    - >
      Its release history shows long maintenance from 2010 through the 0.12.x releases
      in 2023, adapting to new sequencing formats and operational needs such as NovaSeq
      tile handling, Nanopore format changes, SVG output, and memory options.
  package-nerd-significance:
    - >
      FastQC is a canonical bioinformatics package-manager resident: a Java GUI that is
      also a CLI pipeline tool, a project website that predates the GitHub source repo,
      and output reports recognizable across sequencing workflows.
  project-history:
    - >
      FastQC was created by Simon Andrews at Babraham Bioinformatics and had public
      releases by April 2010, according to the official project changelog. The project
      page describes it as stable, mature Java software released under GPL v3 or later.
    - >
      The GitHub repository was created in 2017 as the public source-code home for
      developers and bug tracing, while the Babraham project page remains the canonical
      place for users to download compiled packages and read documentation.
  related-projects:
    - >
      FastQC is commonly paired with FASTQ preprocessing tools such as fastp; fastp's
      own README describes its HTML report as FastQC-like.
  sources:
    - https://www.bioinformatics.babraham.ac.uk/projects/fastqc
    - https://www.bioinformatics.babraham.ac.uk/projects/fastqc/Help
    - https://github.com/s-andrews/FastQC
    - https://github.com/s-andrews/FastQC#readme
    - https://api.github.com/repos/s-andrews/FastQC/releases
  summary:
    - >
      FastQC is Babraham Bioinformatics' quality-control application for high-throughput
      sequencing data. It analyzes FASTQ, BAM, and SAM inputs and produces graphical and
      HTML reports that flag unusual properties before downstream analysis.
  timeline:
    - '2010: Version 0.1 is released.'
    - '2017: The public GitHub source repository is created.'
    - '2018: v0.11.8 is released with performance and behavior fixes.'
    - '2023: v0.12.x releases add modern report and runtime improvements.'
  usage:
    - >
      Users run FastQC before deeper analysis to get a quick overview of raw sequence
      quality. Its modules summarize base quality, sequence content, duplication,
      adapter content, and other signals, then mark modules as pass, warning, or fail.
    - >
      FastQC can process multiple files in the graphical application, or run headlessly
      in pipelines to generate one report per input file. It documents no persistent
      package configuration file or credential store.
related-packages:
  - id: brew:fastp
    reason: >
      Choose fastp when quality reporting should be combined with read filtering,
      adapter trimming, and cleaned FASTQ output; FastQC is the more focused standalone
      quality-analysis application.
    rel: alternative
    sources:
      - https://github.com/OpenGene/fastp
      - https://www.bioinformatics.babraham.ac.uk/projects/fastqc/
