credentials-file-location: null
history:
  adoption-history:
    - >
      LanguageTool's adoption is unusually broad for an open-source writing tool because
      it serves both end users and developers. It is packaged by Homebrew, Nix,
      MacPorts, Arch, Scoop, Chocolatey, and other ecosystems in the input facts, while
      the HTTP API and self-hosted server have made it a backend for editor plugins,
      browser integrations, CI checks, and third-party libraries.
    - >
      The dev site maintains documentation for supported languages, plugin/add-on usage,
      LaTeX checking, n-gram data, the public HTTP server, and running a private server.
      That split between application, server, and API is the main reason package
      ecosystems carry it even when users never launch the GUI.
  package-nerd-significance:
    - >
      For package nerds, LanguageTool is the canonical open-source grammar-checker
      package: big Java application, language-rule corpus, HTTP server, and enough
      downstream clients that packaging the core project unlocks many workflows. It is
      also a common comparison point for smaller tools such as `languagetool-rust` and
      editor-specific checkers.
  project-history:
    - >
      LanguageTool's upstream repository describes it as proofreading software for
      English, Spanish, French, German, Portuguese, Polish, Dutch, and more than 20
      other languages, with checks that go beyond a simple spell checker. The project
      exposes both standalone tooling and a server/API surface, which made it reusable
      by editors, browser extensions, command-line wrappers, and language-specific
      clients.
    - >
      The official roadmap records a long 1.x-to-6.x release train. Version 1.2 was
      released on 2011-01-02, version 2.0 on 2012-12-30, version 3.0 on 2015-06-29,
      version 4.0 on 2017-12-29, version 5.0 on 2020-06-27, and version 6.0 on
      2022-12-29. Release-manager documentation states that in March 2025 LanguageTool
      switched to a snapshot-based release model.
  related-projects:
    - >
      Related projects include LanguageTool browser and editor integrations, the
      LanguageTool HTTP API, n-gram data resources, and client libraries such as
      LanguageTool-Rust.
  sources:
    - https://dev.languagetool.org/
    - https://dev.languagetool.org/how-to-make-a-languagetool-release.html
    - https://github.com/languagetool-org/languagetool
    - https://github.com/languagetool-org/languagetool-org.github.io/blob/master/roadmap.md
    - https://languagetool.org/http-api
  summary:
    - >
      LanguageTool is an open-source proofreading system for grammar, style, and
      spelling checks across many languages, distributed as a Java application, server,
      HTTP API, browser/editor integrations, and package-manager builds.
  timeline:
    - '2011-01-02: Version 1.2 release recorded in the official roadmap.'
    - '2012-12-30: Version 2.0 release recorded in the official roadmap.'
    - '2015-06-29: Version 3.0 release recorded in the official roadmap.'
    - '2017-12-29: Version 4.0 release recorded in the official roadmap.'
    - '2020-06-27: Version 5.0 release recorded in the official roadmap.'
    - '2022-12-29: Version 6.0 release recorded in the official roadmap.'
    - >
      2025-03: Release-manager documentation says LanguageTool switched to a
      snapshot-based release model.
  usage:
    - >
      Homebrew installs executables for the command-line checker, GUI, and server.
      Server users configure behavior with `server.properties`, while API users send
      text to the documented HTTP endpoints or run their own server for local/private
      checking.
related-packages:
  - id: brew:languagetool-rust
    reason: >
      Choose LanguageTool-Rust when a Rust library or lightweight ltrs client is needed
      to call either the public API or a self-hosted LanguageTool server.
    rel: adjacent_workflow
    sources:
      - https://dev.languagetool.org/public-http-api.html
      - https://github.com/jeertmans/languagetool-rust
  - id: brew:harper
    reason: >
      Choose Harper for an English-only, privacy-first grammar checker that runs
      entirely on-device and integrates through a language server; choose LanguageTool
      for broader language coverage and its HTTP service.
    rel: alternative
    sources:
      - https://dev.languagetool.org/
      - https://writewithharper.com/
      - https://writewithharper.com/docs/integrations/language-server
