credentials-file-location: null
history:
  adoption-history:
    - >
      ddcutil became a distribution-facing tool because Linux desktops and automation
      scripts needed a standard way to address monitor controls exposed through /dev/i2c
      devices. Its documentation maintains package-status material and maintainer notes,
      and recent release notes call out KDE PowerDevil integration work around display
      connection handling and transient I2C permission loss.
  package-nerd-significance:
    - >
      ddcutil matters to package nerds because it wraps a hardware-adjacent protocol in
      a scriptable Unix tool while still needing udev, kernel module, I2C permission,
      and monitor quirk handling. It is the sort of package where a formula is only half
      the story; post-install configuration and distro integration determine whether it
      works.
  project-history:
    - >
      The project was created and maintained by Sanford Rockowitz, and its official
      documentation says the use case that inspired development was color profile
      management: saving monitor color settings during calibration and restoring them
      when the profile is applied. The public GitHub release history goes back to 0.5.0
      in 2016 and the project has continued through the 2.x series with both the ddcutil
      CLI and libddcutil shared library.
  related-projects:
    - ddcui provides a Qt graphical interface built around ddcutil.
    - >
      KDE PowerDevil is a desktop power-management consumer called out by the ddcutil
      release notes.
    - >
      The Monitor Control Command Set and DDC/CI standards define much of the
      monitor-control surface ddcutil exposes.
  sources:
    - https://www.ddcutil.com/
    - https://www.ddcutil.com/release_notes/
    - https://github.com/rockowitz/ddcutil
    - https://github.com/rockowitz/ddcutil/releases
  summary:
    - >
      ddcutil is a Linux command-line utility and C library for reading and changing
      external monitor settings through DDC/CI over I2C, with USB support for some
      monitor classes. In package-manager culture it fills the practical gap between
      desktop display settings panels and scriptable monitor control.
  timeline:
    - '2015: Public GitHub repository created.'
    - '2016: Release 0.5.0 published.'
    - '2025: Release 2.2.0 published in the modern libddcutil series.'
    - >
      2026: Release 2.2.7 published with fixes relevant to KDE PowerDevil and display
      connection handling.
  usage:
    - >
      Typical package usage is small but powerful: detect attached displays, query VCP
      capabilities, get and set values such as brightness or input source, and integrate
      those commands into desktop power, color-management, or hotkey workflows. The same
      project also exposes libddcutil for applications that need monitor control without
      shelling out.
related-packages:
  - id: brew:ddcctl
    reason: >
      Choose ddcctl when the monitor-control host is macOS; it exposes comparable
      brightness, contrast, and input controls through Apple's display APIs, whereas
      ddcutil targets Linux I2C and USB interfaces.
    rel: alternative
    sources:
      - https://www.ddcutil.com/
      - https://github.com/kfix/ddcctl#readme
