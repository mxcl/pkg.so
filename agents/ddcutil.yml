id: brew:ddcutil
display-name: ddcutil
repo: https://github.com/rockowitz/ddcutil
docs:
  - https://www.ddcutil.com/
  - https://www.ddcutil.com/api_main
  - https://www.ddcutil.com/options_main
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/ddcutil/ddcutilrc
