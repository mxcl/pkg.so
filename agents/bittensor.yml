id: brew:bittensor
display-name: Bittensor
repo: https://github.com/RaoFoundation/bittensor
docs:
  - https://www.bittensor.com/docs
  - https://www.bittensor.com/docs/cli
  - https://www.bittensor.com/docs/concepts/wallets
  - https://www.bittensor.com/docs/migration
config-file-location:
  unix:
    - ~/.bittensor/config.yml
credentials-file-location:
  unix:
    - ~/.bittensor/wallets/<wallet-name>/coldkey
    - ~/.bittensor/wallets/<wallet-name>/hotkeys/<hotkey-name>
history:
  adoption-history:
    - >
      The SDK became the standard official Python and shell interface for participants
      operating wallets, querying network state, staking, registering subnets, and
      writing subnet software. Its packaging evolved from a multi-distribution Python
      stack in v9/v10 to a single generated SDK-and-CLI package in v11.
  package-nerd-significance:
    - >
      Bittensor is notable as a package-management case study because an SDK, CLI, and
      cryptographic wallet moved from three interdependent Python distributions back
      into one package and monorepo. The official migration guide documents executable
      ownership conflicts during upgrades, Python-version resolution pitfalls, native
      Rust build requirements, and compatibility of existing on-disk keyfiles.
    - >
      Its official wallet security guide also records a compromised PyPI release of
      legacy `bittensor` 6.12.2 in July 2024 and consequently recommends exact version
      pins and signed source tags for high-value systems. That incident makes provenance
      and upgrade discipline unusually important for this package.
  project-history:
    - >
      The Bittensor SDK repository was created in 2020 and developed alongside the
      network's blockchain and subnet model. Bittensor's official academic history
      records the network's launch in November 2021. The SDK exposed Python APIs for
      Subtensor and installed `btcli` for wallet, subnet, staking, and chain operations.
    - >
      In 2026, Bittensor 11 replaced the legacy 10.x SDK, separate 9.x CLI, and separate
      wallet package with one unified `bittensor` distribution. SDK, CLI, documentation,
      and chain development then moved into the `RaoFoundation/subtensor` monorepo,
      while the legacy SDK repository was archived in July 2026.
  related-projects:
    - >
      RaoFoundation/subtensor is the active Bittensor monorepo containing the chain,
      Python SDK, `btcli`, documentation, and website.
    - >
      Legacy `bittensor-cli` supplied the v9 `btcli` executable bundled by the 10.x
      formula, and legacy `bittensor-wallet` supplied its keyfile implementation.
  sources:
    - https://github.com/RaoFoundation/bittensor
    - https://github.com/RaoFoundation/subtensor
    - https://www.bittensor.com/academia
    - https://www.bittensor.com/docs/concepts/wallets
    - https://www.bittensor.com/docs/migration
  summary:
    - >
      Bittensor is the Python SDK and command-line tooling used to read from, transact
      with, and build applications for the Bittensor network. The legacy 10.x package
      represented by this Homebrew formula combines the `bittensor` SDK with the
      separately distributed `bittensor-cli` and `bittensor-wallet` packages.
  timeline:
    - '2020: The Bittensor SDK repository was created.'
    - '2021: The Bittensor network officially launched in November.'
    - >
      2024: A compromised PyPI release of legacy bittensor 6.12.2 triggered a network
      safe-mode response.
    - '2026: Bittensor 11 unified the SDK, CLI, and wallet packages in the Subtensor monorepo.'
    - '2026: The legacy Bittensor SDK repository was archived in July.'
  usage:
    - >
      The legacy formula installs the Python SDK plus `btcli`. Users commonly select a
      network, configure a coldkey wallet and hotkey, inspect balances and subnets, and
      submit signed staking or registration operations. Configuration is stored by the
      legacy CLI at `~/.bittensor/config.yml`, while wallet keys live under
      `~/.bittensor/wallets/`.
    - >
      Current upstream guidance installs `bittensor` with `uv` or pip, uses `btcli
      query` for reads and `btcli tx` for transactions, and recommends previewing
      mutations with `--dry-run`. Existing v10 wallet files remain compatible with v11,
      but scripts and CLI invocations require migration because the client API and
      command organization changed substantially.
