id: cask:rcmd
display-name: rcmd
repo: null
docs:
  - https://files.lowtechguys.com/rcmd/changelog.html
  - https://lowtechguys.com/rcmd
config-file-location:
  macos:
    - ~/.config/rcmd/config.yaml
credentials-file-location:
  macos:
    - ~/Library/Application Support/rcmd/
history:
  adoption-history:
    - >
      rcmd was initially distributed through the Mac App Store in a now-designated
      classic edition. The developer later introduced a directly distributed edition
      with a free tier, optional Pro features, expanded window and Spaces control, and
      migration that preserves the old App Store settings.
    - >
      The current application is also distributed through Homebrew Cask, as recorded by
      source_facts.package-manager and source_facts.package-manager-url.
  package-nerd-significance:
    - >
      rcmd turns the physically distinct Right Command key into a mnemonic
      application-launching namespace while leaving normal Left Command shortcuts
      intact. Later releases added a readable YAML configuration and a command-line
      interface, making the graphical switcher unusually amenable to dotfile management
      and scripting.
  project-history:
    - >
      The low-tech guys created rcmd as a keyboard-first alternative to repeatedly
      cycling through macOS Command-Tab. Its core interaction maps the first letter of
      an application's name to Right Command plus that letter, with dynamic and
      user-defined assignments.
    - >
      The product later grew into an application and window searcher, Command-Tab
      replacement, Spaces controller, workspace restorer through Stages, and companion
      to the Keylume on-screen keyboard. Its directly distributed edition introduced a
      free mode alongside a lifetime Pro license.
  related-projects:
    - >
      Keylume is the developer's companion on-screen keyboard and can display rcmd's
      active bindings.
    - The classic Mac App Store edition is retained as a separately documented predecessor.
  sources:
    - 'Official changelog: https://files.lowtechguys.com/rcmd/changelog.html'
    - 'Official classic-edition documentation: https://lowtechguys.com/rcmd/classic'
    - 'Official press kit: https://www.lowtechguys.com/rcmd/presskit'
    - 'Official product page and FAQ: https://lowtechguys.com/rcmd/'
  summary:
    - >
      rcmd is a macOS application and window switcher from the low-tech guys. It uses
      the Right Command key with mnemonic letters to focus or launch applications and
      also provides fuzzy search, Spaces navigation, window operations, and saved
      workspaces.
  timeline:
    - >
      Initial era: rcmd was distributed as a Mac App Store application, now documented
      as rcmd classic.
    - >
      Later direct-distribution era: A free tier and optional Pro feature set replaced
      the App Store-only model.
    - >
      By 2026: rcmd includes a companion command-line interface and readable YAML
      configuration at ~/.config/rcmd/config.yaml.
  usage:
    - >
      Users hold Right Command and press an application's initial to focus or launch it.
      They can assign a custom letter with Right Command, Right Option, and the desired
      key, search applications and windows by typing, switch Spaces numerically, and
      save window groups as Stages.
    - >
      Advanced users can edit or synchronize ~/.config/rcmd/config.yaml and automate the
      running application with its companion rcmd command. The official troubleshooting
      instructions identify ~/Library/Application Support/rcmd/ as the location of
      license files.
