history:
  adoption-history:
    - >
      libcap-ng was adopted by Linux distributions because it gives application
      developers and packagers a smaller API for privilege dropping, while giving
      administrators tools to inspect capability exposure across a running system.
  package-nerd-significance:
    - >
      In package-manager terms, libcap-ng is a security plumbing package: it is rarely
      user-facing, but it makes least-privilege patches shorter and more reviewable.
      That is exactly the kind of small library that changes whether downstream packages
      actually drop privileges.
  project-history:
    - >
      The libcap-ng site states the design goal directly: make programming with POSIX
      capabilities easier than the traditional libcap library. Its README demonstrates
      common use cases such as dropping all capabilities, keeping selected capabilities,
      checking capability state, and retaining capabilities across UID changes.
    - >
      The project paired the C library with administrative tools. netcap reports
      listening network processes and their capabilities, pscap reports privileged
      processes, filecap searches for files with file capabilities, and cap-audit can
      audit capability checks when built with the optional eBPF-based tooling.
  related-projects:
    - >
      Related projects include libcap, Linux capabilities, file capabilities, procfs
      capability inspection, systemd ambient capabilities, and eBPF-based capability
      auditing.
  sources:
    - https://formulae.brew.sh/formula/libcap-ng
    - https://github.com/stevegrubb/libcap-ng
    - https://people.redhat.com/sgrubb/libcap-ng
    - https://people.redhat.com/sgrubb/libcap-ng/ChangeLog
    - https://raw.githubusercontent.com/stevegrubb/libcap-ng/master/README.md
  summary:
    - >
      libcap-ng is Steve Grubb's Linux capability library and utility suite, designed to
      make POSIX capability programming easier than the older libcap API.
  timeline:
    - '0.4: Initial public release, according to the upstream ChangeLog.'
    - '0.6: Added Python bindings and an m4 macro for autotools consumers.'
    - '0.8: Added ambient capability support and V3 filesystem capability support.'
    - '2024-04-09: The project site listed libcap-ng 0.8.5 release files.'
    - >
      0.9: The README documents a distribution move away from people.redhat.com release
      hosting to the GitHub page.
  usage:
    - >
      Developers use capng_clear, capng_update, capng_apply, and related calls to drop
      or retain Linux capabilities. Administrators use pscap, netcap, and filecap to
      find over-privileged processes and files.
related-packages:
  - id: brew:libcap
    reason: >
      Choose libcap for the canonical low-level Linux capability API and standard tools
      such as setcap and getcap; libcap-ng favors simpler set construction and auditing
      utilities.
    rel: alternative
    sources:
      - https://people.redhat.com/sgrubb/libcap-ng/
      - https://git.kernel.org/pub/scm/libs/libcap/libcap.git/plain/README
