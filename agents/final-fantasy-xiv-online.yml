history:
  adoption-history:
    - >
      A Realm Reborn established the continuing version of FINAL FANTASY XIV on August
      27, 2013. Square Enix's official anniversary retrospective explicitly
      distinguishes that launch from the original FFXIV development effort and presents
      the rebuilt game as a long-running shared world.
    - >
      The Lodestone grew alongside the game as its official operational and community
      surface, combining news, character and Free Company profiles, an item database,
      patch archives, play guides, community discovery, rankings, and account-service
      links.
  package-nerd-significance:
    - >
      FINAL FANTASY XIV is an unusual Homebrew Cask entry: it is a proprietary,
      subscription-based MMO launcher rather than a conventional standalone utility. The
      cask is useful because it makes acquisition of the official macOS client
      reproducible through the same package workflow used for other Mac applications.
    - >
      Its long-lived launcher, continuously patched client, locally stored per-user
      settings, and server-backed character state illustrate the boundary between
      package installation and live-service content management: Homebrew installs the
      client shell, while Square Enix's launcher and servers manage the game itself.
  project-history:
    - >
      FINAL FANTASY XIV is Square Enix's massively multiplayer entry in the Final
      Fantasy series. The current service emerged from a comprehensive rebuilding of the
      original game under producer and director Naoki Yoshida.
    - >
      FINAL FANTASY XIV: A Realm Reborn launched on August 27, 2013. It retained
      familiar Final Fantasy elements while presenting an evolving online world designed
      for cooperative play, persistent characters, and continued content updates.
  related-projects:
    - >
      The Lodestone: Official news, community, database, and play-guide portal for FINAL
      FANTASY XIV.
    - 'Mog Station: Official account, subscription, and optional-service management surface.'
    - 'FINAL FANTASY XIV Companion: Official mobile companion application.'
    - >
      Final Fantasy series: Parent role-playing game franchise whose creatures, jobs,
      visual motifs, and terminology recur in XIV.
  sources:
    - >
      Official A Realm Reborn overview:
      https://na.finalfantasyxiv.com/a_realm_reborn/sp/world/about/
    - 'Official Play Guide: https://na.finalfantasyxiv.com/lodestone/playguide/'
    - >
      Official fifth-anniversary developer retrospective:
      https://na.finalfantasyxiv.com/5th_anniversary/message/
    - >
      Official macOS support notice:
      https://support.na.square-enix.com/ff14mac_update.php?h=uIG9Ll8347mvCz17&id=5382
  summary:
    - >
      FINAL FANTASY XIV Online is Square Enix's story-driven massively multiplayer
      role-playing game. Its modern service dates from the 2013 launch of A Realm
      Reborn, a comprehensive reconstruction of the original FINAL FANTASY XIV.
  timeline:
    - '2010: Development era of the original FINAL FANTASY XIV began.'
    - '2013-08-27: FINAL FANTASY XIV: A Realm Reborn launched.'
    - >
      2018-08: Square Enix marked the fifth anniversary of A Realm Reborn with a
      developer retrospective.
  usage:
    - >
      Players install the client, authenticate with a Square Enix service account,
      create a character on a selected World, and progress through story quests,
      instanced duties, jobs, crafting, gathering, player-versus-player modes, housing,
      and social systems.
    - >
      The official Play Guide and game manual cover installation, controls, interface
      navigation, classes and jobs, and feature-specific rules. Subscriptions and
      additional services are managed through Square Enix's account surfaces.
    - >
      On macOS, hotbars, macros, and other client-side settings are retained under
      `~/Library/Application Support`, according to the official Support Center.
