history:
  adoption-history:
    - >
      Slab reported in 2020 that more than 7,000 companies used the service, including
      organizations such as Asana, Discord, and Glossier. Its current company materials
      describe it as the source of truth for thousands of companies.
    - >
      Its adoption centers on teams seeking a hosted internal wiki that integrates with
      the rest of their collaboration stack rather than replacing every specialized
      tool.
  package-nerd-significance:
    - >
      Slab's cask represents the desktop client for a hosted software-as-a-service
      knowledge system, so installing the application does not provide a self-hosted
      Slab server.
    - >
      The official desktop repository is a release-distribution repository rather than
      the proprietary product's source tree, an important distinction when cataloging
      repository metadata.
  project-history:
    - >
      Jason Chen started Slab in August 2016, using Elixir and Phoenix to build a
      real-time collaborative knowledge application. The service entered private beta
      with a small group of companies.
    - >
      In February 2018 Slab announced early access and a $2.2 million seed round,
      presenting the product as a central home for organizational knowledge. It
      subsequently expanded its editor, Topics, unified search, integrations, version
      history, and desktop access.
  related-projects:
    - Slab integrates with services including Slack, GitHub, Google products, Asana, and Okta.
    - The desktop application accompanies the primary web-based Slab service.
    - Slab identified the open-source Quill editor as part of its early product lineage.
  sources:
    - https://help.slab.com/en
    - https://slab.com/
    - https://slab.com/blog/a-worthy-home-for-your-teams-knowledge/
    - https://slab.com/blog/why-slab-chose-elixir/
    - https://slab.com/careers/
  summary:
    - >
      Slab is a proprietary hosted knowledge base and internal-wiki service with web and
      desktop clients for creating, organizing, searching, and sharing organizational
      knowledge.
  timeline:
    - '2016-08: Jason Chen starts Slab.'
    - '2018-02: Slab announces early access and a $2.2 million seed round.'
    - '2020: Slab reports use by more than 7,000 companies.'
  usage:
    - >
      Organizations use Slab posts and Topics to document policies, procedures,
      technical knowledge, decisions, onboarding material, and other institutional
      information.
    - >
      Teams collaborate in real time, search Slab and integrated services, review post
      history, import existing documentation, and use integrations to connect knowledge
      stored elsewhere.
