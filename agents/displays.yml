history:
  adoption-history:
    - >
      Displays was formerly distributed through the Mac App Store. Jibapps moved it to
      direct distribution because App Store technical restrictions would have broken
      support for Retina resolutions, and offered existing App Store purchasers a free
      direct-sale license.
  package-nerd-significance:
    - >
      Displays represents a class of macOS menu-bar tools that exposes display modes and
      controls beyond the normal System Settings interface. Its departure from the Mac
      App Store also illustrates how sandbox and platform restrictions can shape
      distribution of low-level Mac utilities.
  project-history:
    - >
      Jibapps developed Displays as a monitor-resolution manager and expanded it into a
      broader multi-monitor utility with night mode, screenshot tools, mirroring,
      rotation, brightness controls, and display information.
  related-projects:
    - >
      The application overlaps functionally with macOS display-resolution switchers,
      blue-light tools, screenshot utilities, and multi-monitor managers.
  sources:
    - 'Official product page: https://www.jibapps.com/apps/displays/'
  summary:
    - >
      Displays is a commercial Jibapps menu-bar application for changing macOS monitor
      resolutions and managing related display features.
  timeline:
    - "Mac App Store era: Displays was sold through Apple's store."
    - >
      Direct-distribution era: Jibapps moved Displays to its own webstore to preserve
      Retina-resolution support.
    - 'Version 1.9.10: Official page lists support for Intel and Apple silicon Macs.'
  usage:
    - >
      Users choose resolutions—including modes hidden by macOS—from a menu-bar icon,
      manage multiple displays and mirroring, schedule night mode, adjust brightness and
      color presentation, and capture or annotate screenshots.
