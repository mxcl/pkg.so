history:
  adoption-history:
    - >
      The package became a standard small networking utility across Unix-like package
      managers. The Homebrew formula packages versioned GitHub tag archives and bottles
      it for macOS and Linux targets, while the input package metadata also lists iodine
      in Debian, Ubuntu, Fedora, Alpine, Arch, Nix, MacPorts, and openSUSE-style
      ecosystems.
  package-nerd-significance:
    - >
      For package nerds, iodine is the classic example of a small C networking tool
      whose packaging value is not just the binary but the platform glue around TUN/TAP
      devices, resolver behavior, DNS record quirks, and optional OS integration. Its
      formula is a compact package-manager artifact for a famously odd transport layer.
  project-history:
    - >
      The project published version 0.3.0 as its first public release on 2006-06-24 with
      Linux, FreeBSD, and OpenBSD support. Subsequent releases added Mac OS X support,
      authentication, multiuser operation, manpages, several DNS response encodings,
      Windows support, raw UDP mode, SELinux and systemd-related support, and IPv6
      transport support for parts of the connection path while keeping tunneled payloads
      IPv4.
    - >
      iodine's development history is especially visible in its changelog because many
      features correspond to real-world DNS-relay behavior: fragment-size probing,
      alternative record types, Base32/Base64/Base128 encodings, hostname-length
      controls, and workarounds for relays that rewrite or time out unusual DNS traffic.
  related-projects:
    - >
      iodine belongs to the DNS-tunnel family of tools and is commonly compared by
      function rather than code lineage with utilities that tunnel IP or proxy traffic
      through constrained network egress paths. Its own docs recommend layering SSH or a
      VPN over the tunnel when confidentiality matters.
  sources:
    - https://code.kryo.se/iodine
    - https://code.kryo.se/iodine/README.html
    - https://formulae.brew.sh/formula/iodine
    - https://github.com/yarrick/iodine
    - https://raw.githubusercontent.com/yarrick/iodine/master/CHANGELOG
  summary:
    - >
      iodine is a DNS tunneling client/server pair for carrying IPv4 traffic through DNS
      queries and responses. Its upstream documentation frames it as useful in networks
      where broader Internet access is firewalled but DNS queries are still allowed.
  timeline:
    - '2006: First public release, version 0.3.0.'
    - '2007: Version 0.4.0 added multiuser support, authentication, and a manpage.'
    - >
      2009: Version 0.5.x added Windows support and downstream fragmentation/autoprobing
      improvements.
    - '2010: Version 0.6.0-rc1 added raw UDP mode and more query-type support.'
    - >
      2014: Version 0.7.0 added partial IPv6 path support, systemd socket activation,
      and an authentication-bypass fix.
    - >
      2023: Version 0.8.0 added native Mac OS X utun support, server-side IPv6 listening
      support, wildcard-domain handling, and other portability updates.
  usage:
    - >
      iodine is normally used as an iodined server bound to a delegated DNS subdomain
      and an iodine client that opens a TUN-style interface. The README emphasizes that
      the server and client should speak the same protocol version, that users need
      control over a real domain for routed use, and that tunneled traffic is not
      encrypted by iodine itself.
related-packages:
  - id: brew:dns2tcp
    reason: >
      Choose dns2tcp for named TCP-service tunnels that do not require an IP-level TUN
      interface; choose iodine when routing arbitrary IPv4 traffic through the DNS
      tunnel is required.
    rel: alternative
    sources:
      - https://github.com/alex-sector/dns2tcp
      - https://code.kryo.se/iodine/README.html
  - id: brew:openvpn
    reason: >
      Iodine's official documentation recommends running a VPN through its unencrypted
      DNS tunnel when confidentiality is needed, and OpenVPN supplies that encrypted VPN
      layer.
    rel: adjacent_workflow
    sources:
      - https://code.kryo.se/iodine/README.html
      - https://openvpn.net/community-docs/
