history:
  adoption-history:
    - >
      HoudahSpot has remained a commercial macOS power-user utility through multiple
      major releases and changes to Spotlight and macOS. Houdah Software continues to
      publish current documentation alongside legacy downloads for older
      operating-system releases.
  package-nerd-significance:
    - >
      HoudahSpot is notable among Mac utilities because it exposes considerably more of
      Spotlight’s metadata-querying capabilities than Apple’s standard Spotlight and
      Finder interfaces while reusing the system index rather than maintaining another
      index.
  project-history:
    - >
      Houdah Software developed HoudahSpot as an advanced search interface built on the
      macOS Spotlight engine. It evolved around composable search criteria, explicit
      search locations, configurable result columns, previews, and reusable templates.
    - >
      Later major releases added richer text previews and filtering, Finder
      integrations, faster tagging, saved snippets, AppleScript automation, a redesigned
      interface for macOS Big Sur, and native Apple Silicon support.
  related-projects:
    - >
      Houdah Software also develops Tembo, another Spotlight-based search utility, as
      well as HoudahGeo and Photos Workbench.
  sources:
    - >
      Official HoudahSpot 5 release notes:
      https://www.houdah.com/houdahSpot/releaseNotes5.html
    - >
      Official HoudahSpot 6 user guide:
      https://www.houdah.com/houdahSpot/help/6.7/HoudahSpot%20Help%20EN.pdf
    - 'Official product page: https://www.houdah.com/houdahSpot/'
    - 'Official support and version archive: https://www.houdah.com/support/'
  summary:
    - >
      HoudahSpot is a long-running macOS file-search application from Houdah Software.
      It builds advanced, reusable searches on Apple’s Spotlight index for users who
      need more control than Finder or the standard Spotlight interface provides.
  timeline:
    - >
      2018: HoudahSpot 5 introduced a major power-user update with richer previews,
      filtering, tagging, templates, and Finder integrations.
    - >
      2020: HoudahSpot 5 updates prepared users for macOS Big Sur while HoudahSpot 6
      entered preview and beta distribution.
    - >
      2020: HoudahSpot 6 adopted the Big Sur interface style and added native Apple
      Silicon support.
  usage:
    - >
      Users combine criteria such as name, content, kind, date, tags, author, and image
      metadata; include or exclude search locations; inspect matches with Quick Look and
      text previews; and save recurring searches as templates. Spotlight indexing must
      be enabled.
