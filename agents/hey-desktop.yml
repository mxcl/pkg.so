    reason: >
      Choose Mimestream when you want a native macOS client that preserves an existing
      Gmail account; choose HEY when you want to replace the provider and adopt HEY's
      Screener, Imbox, Feed, and Paper Trail model.
    rel: alternative
    sources:
      - https://help.hey.com/article/716-do-i-need-gmail-outlook-apple-etc-to-use-hey
      - https://mimestream.com/
