history:
  adoption-history:
    - >
      HEY launched as a paid replacement for conventional consumer email services rather
      than another client layered over an existing mailbox. It later expanded across
      web, native desktop and mobile applications, domain-hosted email, publishing
      through HEY World, and an integrated calendar.
    - >
      Its deliberately opinionated workflows—screening first-time senders and separating
      important, transactional, and casual mail—attracted users looking for an
      alternative to the traditional inbox-and-archive model.
  package-nerd-significance:
    - >
      HEY is an example of a service-bound desktop cask: installing the application is
      simple to automate, but useful operation requires a HEY account and the vendor's
      hosted mail platform.
    - >
      The package is also notable because the desktop application exposes a deliberately
      redesigned email model rather than acting as a generic IMAP client. The desktop
      app can coexist with HEY's web and progressive-web-app interfaces.
  project-history:
    - >
      37signals launched HEY in June 2020 after designing a new hosted email service
      around sender screening, the Imbox, The Feed, and Paper Trail instead of a
      conventional undifferentiated inbox.
    - >
      The product subsequently added native Apple Silicon support, multi-account use,
      HEY for Domains, HEY World publishing, expanded search and workflow features, and
      an integrated calendar.
  related-projects:
    - >
      Unlike clients such as Mimestream or Superhuman Mail, HEY supplies the mailbox and
      email service itself. Existing addresses can forward into HEY, but HEY is not a
      general-purpose client for reading an existing Gmail or Outlook mailbox.
  sources:
    - https://help.hey.com/
    - https://help.hey.com/article/716-do-i-need-gmail-outlook-apple-etc-to-use-hey
    - https://www.hey.com/
    - https://www.hey.com/new/
  summary:
    - >
      HEY is 37signals' subscription email and calendar service, available through web,
      desktop, and mobile applications.
  timeline:
    - '2020: HEY launched as a hosted email service.'
    - >
      2020s: HEY expanded with domain email, native-platform improvements, publishing,
      additional workflows, and an integrated calendar.
  usage:
    - >
      Users receive mail into a HEY account, approve or reject new senders with The
      Screener, route wanted mail among the Imbox, Feed, and Paper Trail, and use
      dedicated reply-later, attachment, search, and calendar workflows.
    - >
      The desktop application can be selected as the operating system's default email
      handler. Authentication uses a HEY email address and password, optionally with
      two-factor authentication, but no official fixed local credential or
      configuration-file location is documented.
related-packages:
