  - id: cask:superhuman
    reason: >
      Choose Superhuman Mail for a keyboard-driven client layered over supported Gmail
      or Outlook accounts; HEY instead provides its own mailbox and opinionated email
      workflow.
    rel: alternative
    sources:
      - https://help.hey.com/article/716-do-i-need-gmail-outlook-apple-etc-to-use-hey
      - https://superhuman.com/
      - https://help.superhuman.com/hc/en-us
