history:
  adoption-history:
    - >
      duti's adoption is mostly in macOS automation circles: users install it through
      package managers or build it from source, then use it in setup scripts to make
      browser, editor, document, and URL-scheme defaults reproducible. The README also
      labels the project unsupported, which makes its persistence in package managers
      part of its history.
  package-nerd-significance:
    - >
      duti matters because macOS developer machines are often rebuilt from scripts, and
      default application bindings are otherwise awkward to automate. It gives
      Homebrew/MacPorts/Nix users a small, scriptable bridge into Apple's UTI and
      handler database.
  project-history:
    - >
      The README says duti was originally released into the public domain by Andrew
      Mortensen in 2008. The current GitHub repository was created in September 2012 and
      hosts the README, man page, and tagged releases.
    - >
      The tool is built around Apple's Uniform Type Identifiers and related handler
      metadata. It can read settings from stdin, a settings file, an XML plist, or
      command-line arguments, making it easy to script default-app policy on macOS.
  related-projects:
    - >
      The README links `dutis` as an interactive wrapper around duti. Conceptually, duti
      also sits next to macOS Launch Services tooling and Apple's UTI documentation.
  sources:
    - https://github.com/moretension/duti
    - https://github.com/moretension/duti/blob/master/duti.1
    - https://api.github.com/repos/moretension/duti
  summary:
    - >
      duti is a macOS command-line utility for setting default applications for document
      types, URL schemes, extensions, and MIME types. It is one of those small macOS
      plumbing tools that became package-manager-relevant because Apple exposes the
      concept through Launch Services and UTIs but not through a friendly shell command.
  timeline:
    - '2008: README says duti was originally released into the public domain.'
    - '2012-09-25: GitHub repository created.'
    - '2018-04: README license note dated April 2018.'
    - '2023-07-09: GitHub repository last pushed according to the GitHub API snapshot.'
  usage:
    - >
      The man page documents `duti -s` for setting handlers, `duti -x` for printing the
      default app for an extension, and file/plist input for bulk settings. A settings
      file contains bundle ID, UTI or URL scheme, and role fields such as viewer,
      editor, shell, all, or none.
