credentials-file-location: null
history:
  adoption-history:
    - >
      The official quickstart centers the CLI as the easiest way to experience Fn:
      install it with Homebrew or the shell installer, run `fn start`, initialize a
      function, create an app, deploy, and invoke. The project also maintains
      documentation, tutorials, Slack/community links, Stack Overflow guidance, and
      subprojects for Flow, UI, and load balancing.
  package-nerd-significance:
    - >
      fn is significant as a cloud-native CLI that packages local container
      orchestration, serverless deployment, and provider-specific behavior into one
      executable. It reflects the late-2010s wave of FaaS tooling where a local
      developer command had to bridge Docker, remote registries, open-source servers,
      and managed cloud functions.
  project-history:
    - >
      The Fn CLI repository was created in 2017. Its README links the CLI to the wider
      Fn Project and directs users to the Fn server quickstart, detailed installation
      instructions, CLI command reference, tutorials, and docs.
    - >
      The Fn server README describes Fn as a Docker-native FaaS platform written in Go
      that can run in public, private, and hybrid cloud environments, supports any
      language through containers, and can import Lambda functions. Later CLI
      documentation includes OCI Functions features such as provisioned concurrency,
      detached invocations, subnet-aware app creation, tags, and pre-built functions.
  related-projects:
    - >
      Related official projects include fnproject/fn, fnproject/docs, fnproject/flow,
      fnproject/ui, fnproject/lb, Oracle Cloud Infrastructure Functions, Docker, and
      Podman.
  sources:
    - https://api.github.com/repos/fnproject/cli
    - https://github.com/fnproject/cli
    - https://github.com/fnproject/fn
    - https://raw.githubusercontent.com/fnproject/cli/master/README.md
    - https://raw.githubusercontent.com/fnproject/docs/master/cli/README.md
    - https://raw.githubusercontent.com/fnproject/fn/master/README.md
  summary:
    - >
      fn is the command-line client for the Fn Project, an open-source, event-driven
      Functions-as-a-Service platform. The CLI is used to start local servers, create
      applications, initialize functions, deploy them, invoke them, manage contexts, and
      work with Oracle Cloud Infrastructure Functions settings.
  timeline:
    - '2017: The Fn CLI repository was created.'
    - >
      2018: The Fn Project README advertised regular community planning meetings as
      upcoming in Q1 2019.
    - >
      2025: The CLI README documented OCI Functions features such as provisioned
      concurrency, detached mode, tags, and pre-built functions.
    - '2026: The CLI repository remained active according to official repository metadata.'
  usage:
    - >
      A typical local workflow is `fn start`, `fn init --runtime go hello`, `fn create
      app myapp`, `fn deploy --app myapp --local`, and `fn invoke myapp hello`. The CLI
      docs list command groups for build, config, create, deploy, inspect, invoke, list,
      start, stop, update, and context management.
related-packages:
  - id: brew:faas-cli
    reason: >
      Choose OpenFaaS CLI for an actively documented template-driven build, push, and
      cluster-deployment workflow; choose Fn CLI when targeting Fn servers or OCI
      Functions contexts.
    rel: alternative
    sources:
      - https://github.com/fnproject/cli
      - https://docs.openfaas.com/cli/templates/
  - id: brew:kn
    reason: >
      Choose kn when functions should become Knative Services on Kubernetes and you also
      need native Knative Serving and Eventing resource management.
    rel: alternative
    sources:
      - https://github.com/fnproject/fn
      - https://knative.dev/docs/client/
      - https://knative.dev/docs/functions/deploying-functions/
