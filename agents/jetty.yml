history:
  adoption-history:
    - >
      Jetty spread because it could be embedded in applications while also serving as a
      traditional servlet container. The official site says developers have used it in
      production for more than 20 years, embedded it in devices, tools, frameworks,
      application servers, and cloud services, and relied on it in high-profile
      operational environments.
    - >
      Homebrew, Chocolatey, Fedora, MacPorts, and Nix metadata in the input show that
      Jetty became a package-manager staple across Unix-like systems and Windows. Its
      package identity matters because it exposes Java web infrastructure as a normal
      installable developer tool rather than only as Maven dependencies.
  package-nerd-significance:
    - >
      Jetty is important to package nerds because it sits at the boundary between
      library, server, and command-line distribution. The same project can be a Maven
      dependency in an embedded app, a Homebrew-installed server, a servlet container
      for WAR deployment, or the underlying runtime behind smaller artifacts such as
      jetty-runner.
  project-history:
    - >
      Jetty began in 1995 when Greg Wilkins of Mort Bay Consulting developed the Java
      HTTP server as part of an issue-tracking application. The official Jetty site says
      versions 1.x through 6.1.x used org.mortbay packaging and that Mort Bay directly
      hosted the project until version 3.x.
    - >
      The project moved through several homes: SourceForge from 2000 to 2005, Codehaus
      in 2005, Eclipse Foundation governance for core components in 2009, and GitHub as
      the canonical source and issue repository in 2016. Those moves mirror the larger
      history of Java server-side open source moving from small project hosts into
      foundation-managed infrastructure.
    - >
      Commercial and development sponsorship also changed over time. The official site
      records Mort Bay, Webtide, Intalio, and then Webtide again as organizations
      funding or leading development, with Webtide describing itself as developer-owned
      support for the open-source releases.
  related-projects:
    - >
      Jetty is related to the Eclipse Foundation runtime project family, Webtide
      support, the Jakarta Servlet and WebSocket ecosystems, Maven Central artifacts,
      and Jetty Runner.
  sources:
    - https://api.github.com/repos/jetty/jetty.project
    - https://formulae.brew.sh/formula/jetty
    - https://github.com/jetty/jetty.project
    - https://github.com/jetty/jetty.project/releases
    - https://jetty.org/docs/jetty/12.1/operations-guide/start/index.html
    - https://jetty.org/index.html
  summary:
    - >
      Eclipse Jetty is a Java-based web server and servlet engine with a long history as
      both an embeddable library and a standalone distribution. Its README describes a
      lightweight, scalable server for HTTP/1, HTTP/2, HTTP/3, WebSocket, servlets, and
      related Java web technologies.
  timeline:
    - '1995: Greg Wilkins began the Java HTTP server that became Jetty at Mort Bay Consulting.'
    - '2000: Jetty hosting moved to SourceForge for the 3.x, 4.x, and 5.x era.'
    - '2005: Jetty moved to Codehaus hosting.'
    - '2009: Core Jetty components moved to the Eclipse Foundation.'
    - '2016: Canonical source and issue tracking moved to GitHub.'
    - '2023: Jetty 12.0.0 release line published, reflecting the Jakarta EE-era restructuring.'
  usage:
    - >
      Jetty can be run from a distribution with `$JETTY_HOME/start.jar` and a separate
      `$JETTY_BASE` directory, or embedded directly in Java code with server and handler
      APIs. The operations guide documents persistent module configuration through
      `$JETTY_BASE/start.d/*.ini` files and transient module activation through
      command-line options.
related-packages:
  - id: brew:tomcat
    reason: >
      Choose Apache Tomcat when you want a conventional Jakarta Servlet/JSP container;
      choose Jetty when embedded-library use and a highly modular standalone server are
      priorities.
    rel: alternative
    sources:
      - https://tomcat.apache.org/tomcat-11.0-doc/
      - https://jetty.org/docs/jetty/12.1/index.html
