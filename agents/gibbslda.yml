config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GibbsLDA++ was useful because LDA had become a common model for hidden topic
      structures while many researchers still wanted a small command-line
      implementation. The supplied package metadata shows it carried by Homebrew and
      MacPorts, reflecting a preservation-style package footprint for older scientific
      workflows.
  package-nerd-significance:
    - >
      For package maintainers, GibbsLDA++ is a small legacy scientific CLI whose main
      value is reproducibility. Keeping it packaged lets old scripts and papers continue
      to depend on a stable `lda` executable rather than a broad machine-learning
      framework.
  project-history:
    - >
      The official SourceForge project identifies GibbsLDA++ as a beta C/C++
      Gibbs-sampling LDA implementation by pxhieu. The project was registered in July
      2007, and its file area shows the manual, case-study material, and 0.2 source
      distribution published in July and August 2007.
  related-projects:
    - >
      GibbsLDA++ is related to JGibbLDA from the same topic-modeling lineage, LDA
      research implementations, and other C/C++, Java, Matlab, and Python topic-modeling
      packages.
  sources:
    - https://gibbslda.sourceforge.net/
    - https://sourceforge.net/projects/gibbslda/
    - https://sourceforge.net/projects/gibbslda/files/
    - source_facts.package-manager
  summary:
    - >
      GibbsLDA++ is a C/C++ implementation of Latent Dirichlet Allocation using Gibbs
      sampling for parameter estimation and inference. It belongs to the late-2000s
      generation of compact research toolkits for topic modeling.
  timeline:
    - '2007: SourceForge project registered.'
    - '2007: Documents published on SourceForge.'
    - '2007: GibbsLDA++ 0.2 source and case-study files published.'
    - '2013: SourceForge project page records a later project update.'
  usage:
    - >
      Practitioners use the `lda` executable to estimate LDA models and infer topic
      distributions from text corpora. The official project description emphasizes
      large-scale text data collections, Gibbs sampling, and console/terminal use.
related-packages:
  - id: brew:mallet
    reason: >
      MALLET is a broader Java NLP toolkit with scalable Gibbs-sampling LDA, multiple
      topic-model variants, import tools, and hyperparameter optimization; choose it for
      larger or more feature-rich topic-modeling workflows.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/gibbslda/
      - https://mimno.github.io/Mallet/topics
      - https://github.com/mimno/Mallet
