history:
  adoption-history:
    - >
      Maintain has published separate Cocktail editions for successive macOS
      generations. Its official archive lists editions covering Mac OS X 10.5 through
      current macOS releases, reflecting a long-running maintenance model tied closely
      to operating-system compatibility.
  package-nerd-significance:
    - >
      Cocktail is a characteristic macOS power-user package: it collects cache cleaning,
      maintenance scripts, system settings, log management, and repair operations behind
      a graphical interface. Its OS-specific editions illustrate the maintenance burden
      faced by utilities that depend on macOS internals.
  project-history:
    - >
      Cocktail is a proprietary macOS maintenance and customization utility developed by
      Maintain. Official materials describe it as a general-purpose toolkit for
      cleaning, repairing, and optimizing macOS.
    - >
      The project has repeatedly issued editions named for supported macOS releases.
      Official archives retain downloads from the Leopard edition onward, while current
      release notes track compatibility fixes and changes to maintenance and
      cache-cleaning procedures.
  related-projects:
    - Apple Automator is supported for building workflows around Cocktail operations.
    - >
      macOS maintenance scripts and built-in system utilities provide the underlying
      class of operations that Cocktail presents through its interface.
  sources:
    - https://www.maintain.se/blog/tags/cocktail/
    - https://www.maintain.se/cocktail/
    - https://www.maintain.se/downloads/tahoe/ReleaseNotes.html
  summary:
    - >
      Cocktail is a commercial macOS utility that combines system maintenance, cleaning,
      repair, optimization, and customization functions.
  timeline:
    - "Mac OS X 10.5 era: Maintain's official archive includes a Leopard Edition."
    - >
      2019: Cocktail 12.5 was notarized by Apple according to official Mojave Edition
      release notes.
    - '2026: Tahoe Edition releases continue to track macOS 26 compatibility.'
  usage:
    - >
      Users run Cocktail to clear system and user caches, remove temporary files,
      execute maintenance procedures, adjust macOS settings, inspect logs, and automate
      recurring work through its Pilot and Automator support.
    - >
      Cocktail performs privileged system-maintenance operations, so package users
      commonly select the edition corresponding to their macOS release and consult its
      release notes for compatibility changes.
