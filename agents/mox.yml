history:
  project-history:
    - >
      Mox's major technical milestone is its integrated design. The README describes one
      secure mail server for low-maintenance self-hosted email, with SMTP for receiving,
      submission, and delivery; IMAP4 for mail clients; webmail; SPF, DKIM, and DMARC;
      DMARC aggregate reports; reputation tracking; junk filtering; and setup flows that
      print the DNS records an administrator must add. The project site also describes a
      quickstart path and a `mox localserve` mode for local SMTP, IMAP, and webmail
      testing without a full public-domain setup.
  sources:
    - https://formulae.brew.sh/formula/mox
    - https://github.com/mjl-/mox
    - https://pkg.go.dev/github.com/mjl-/mox
    - https://www.xmox.nl/
    - https://www.xmox.nl/features/
  summary:
    - >
      Mox is an all-in-one mail server project whose site says work started in 2021 in
      response to email administration becoming concentrated around large cloud and
      hosting providers and to the operational burden of assembling many separate mail
      components. The project frames that burden as both usability and safety work:
      modern email requires SMTP, IMAP, authentication, TLS, DNS records, filtering, and
      policy protocols, often spread across several daemons.
  usage:
    - >
      In package-manager terms, Mox competes less with a single package than with stacks
      such as Postfix plus Dovecot plus filtering and policy tools. Its appeal is to
      self-hosters and small-domain administrators who want one Go program, one
      configuration model, and built-in modern mail hygiene instead of composing a mail
      system from many long-lived Unix services.
