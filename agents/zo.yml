history:
  adoption-history:
    - >
      Zo is delivered primarily as a hosted personal-cloud service, with access through
      the web and desktop applications for macOS, Windows, and Linux. The desktop client
      adds file synchronization between a local computer and the user's Zo workspace.
    - >
      Its official documentation presents a broad integration surface spanning
      messaging, cloud storage, calendars, development agents, model providers, MCP
      applications, hosting, and a public API.
  package-nerd-significance:
    - >
      Zo is notable in package culture because the desktop package is a client for a
      persistent personal server rather than a self-contained desktop application.
      Installing the app provides local access and synchronization while computation,
      hosting, files, and agent workflows live in the user's cloud computer.
    - >
      It also functions as a host for other packaged software: the official site
      specifically describes running services such as Plex Media Server and OpenClaw
      inside a Zo environment.
  project-history:
    - >
      Zo Computer was founded by Rob and Ben as a personal-cloud platform intended to
      make an always-on server and AI agent approachable without requiring users to
      configure a VPS. The official site states that Zo launched in June 2025.
    - >
      The product expanded around persistent files, AI-assisted building and research,
      messaging, automations, websites, managed services, APIs, integrations, and
      desktop access. Its public GitHub repository serves as an official product
      overview rather than the full application source tree.
  related-projects:
    - >
      Zo's official site compares its agent experience with OpenClaw and Hermes while
      explaining that either can run inside a Zo computer.
    - >
      The platform also documents hosting conventional long-running services, websites,
      APIs, databases, bots, and media servers.
  sources:
    - https://github.com/zocomputer/Zo
    - https://www.zo.computer/
    - https://www.zo.computer/guide
    - https://www.zo.computer/guide/hosting
    - https://www.zo.computer/reference
  summary:
    - >
      Zo is an AI-enabled personal cloud computer for storing and synchronizing files,
      building and hosting software, running persistent services, connecting external
      tools, and interacting with an always-on agent.
  timeline:
    - '2025-06: Zo launched as a personal cloud computer and agent platform.'
    - >
      2026: Official guides documented desktop clients, hosting, integrations, tools,
      skills, MCP, and a public API.
  usage:
    - >
      Users access their Zo through a browser or desktop client, work with the resident
      agent, synchronize selected local folders, connect services, and build or host
      websites, APIs, automations, and long-running processes.
    - >
      Hosting choices include a personal `zo.space`, project-oriented Sites, managed
      Services, and `zo.pub` file sharing. The reference documentation covers exact tool
      parameters and API endpoints.
