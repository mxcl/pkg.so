history:
  adoption-history:
    - >
      The project originated as intitni's independent Copilot for Xcode extension.
      GitHub's maintained repository explicitly credits intitni for the original project
      on which the official extension is based.
    - >
      GitHub distributes the extension from its official repository and documents it as
      the supported way to add Copilot suggestions to Xcode. It can be installed
      manually or as the Homebrew cask represented by this record.
  package-nerd-significance:
    - >
      It gives Xcode users a native route to Copilot capabilities that are commonly
      delivered as extensions in other IDEs. The open repository, Homebrew cask
      installation, macOS permission requirements, and background helper also make it an
      instructive example of packaging an AI assistant around Xcode's extension system.
  project-history:
    - >
      The original open-source project integrated AI code completion and chat with
      Xcode. GitHub subsequently established its official CopilotForXcode repository
      while retaining an acknowledgement of the original author.
    - >
      The maintained GitHub edition provides completions, chat, code review,
      agent-oriented features, and support for Swift, Objective-C, and broader iOS and
      macOS development workflows.
  related-projects:
    - GitHub Copilot
    - Xcode
    - The original intitni/CopilotForXcode project
  sources:
    - https://docs.github.com/en/copilot/how-tos/get-code-suggestions/get-ide-code-suggestions
    - https://docs.github.com/en/copilot/how-tos/set-up/install-copilot-extension
    - https://github.com/github/CopilotForXcode
    - https://github.com/intitni/CopilotForXcode
  summary:
    - >
      GitHub Copilot for Xcode is GitHub's open-source macOS extension and companion
      application for bringing Copilot-assisted completion, chat, code review, and
      related AI development features into Xcode.
  timeline:
    - 'Origin: intitni created the original independent Copilot for Xcode project.'
    - >
      Current project: GitHub maintains the official GitHub Copilot for Xcode repository
      and distribution.
  usage:
    - >
      Install the application, enable its Xcode Source Editor extension, grant the
      documented macOS permissions, and sign in to GitHub. In Xcode, developers use
      inline suggestions while typing or open Copilot Chat from the Editor menu.
    - >
      The official instructions recommend restarting Xcode after installation or an
      extension update. Users may also disable Xcode's native predictive completion to
      avoid overlapping suggestions.
