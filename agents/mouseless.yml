history:
  adoption-history:
    - >
      Mouseless is documented for macOS, Windows, and Linux, with its Linux distribution
      using Flatpak paths. This record also establishes availability through Homebrew
      Cask for macOS package-manager users.
  package-nerd-significance:
    - >
      Mouseless belongs to the keyboard-driven desktop-tool tradition: it exposes mouse
      positioning, clicking, dragging, and scrolling as configurable key commands rather
      than requiring a conventional pointer workflow.
    - >
      Its human-readable YAML configuration and documented per-platform locations make
      keymaps and behavior suitable for backup, comparison, and dotfile-style
      management.
  project-history:
    - >
      The available official material primarily documents the current cross-platform
      application rather than a detailed origin chronology. The product combines a
      coordinate-grid overlay with a relative free-movement mode and globally assignable
      mouse-button commands.
  related-projects:
    - keyboard-driven launchers
    - accessibility utilities
    - window-management utilities
  sources:
    - https://mouseless.click/docs/
    - https://mouseless.click/docs/customizing_mouseless.html
    - https://mouseless.click/docs/using_mouseless.html
    - source_facts.package-manager
  summary:
    - >
      Mouseless is a cross-platform productivity utility that replaces common mouse
      actions with keyboard-driven grid selection, free movement, clicking, dragging,
      and scrolling.
  timeline:
    - >
      Current generation: Mouseless documents native workflows and configuration for
      macOS, Windows, and Linux
  usage:
    - >
      Users invoke an overlay and select screen coordinates with keys, or enter free
      mode for relative cursor movement. Keybindings, grid behavior, timing, scrolling,
      appearance, and multi-monitor behavior are editable in the application or in
      `config.yaml`.
