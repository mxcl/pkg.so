  - https://www.sparklabs.com/support/kb/article/getting-started-with-viscosity-windows
  - https://www.sparklabs.com/support/kb/article/using-viscosity
config-file-location:
  macos:
    - ~/Library/Preferences/com.viscosityvpn.Viscosity.plist
    - ~/Library/Application Support/Viscosity
  windows:
    - '%APPDATA%\Viscosity\Settings.xml'
    - '%APPDATA%\Viscosity\OpenVPN'
credentials-file-location:
  macos:
    - macOS Keychain (Viscosity application-password items)
  windows:
    - '%APPDATA%\Viscosity\LoginInfo.xml'
history:
  adoption-history:
    - >
      SparkLabs says Viscosity has been used for more than a decade by audiences ranging
      from home users to large enterprises. Its deployment features—including connection
      bundles, MDM and Group Policy workflows—also position it as a managed OpenVPN
      client for organizational environments.
  package-nerd-significance:
    - >
      Viscosity is notable in desktop package catalogs as a long-lived, commercially
      supported graphical OpenVPN client. It combines an approachable native interface
      with configuration access, scripting, multiple simultaneous connections, split
      DNS, hardware-token authentication, and enterprise deployment controls.
  project-history:
    - >
      SparkLabs released Viscosity in 2008 as its premier VPN client. The application
      was designed to expose OpenVPN functionality through native macOS and Windows
      interfaces while retaining advanced controls for experienced users and
      administrators.
    - >
      Continued releases have tracked operating-system changes and updates to embedded
      networking and cryptographic components, while legacy builds remain available for
      older platforms.
  related-projects:
    - OpenVPN supplies the VPN protocol and client engine underlying Viscosity connections.
    - >
      SparkLabs also develops Ovpngen, a configuration generator for OpenVPN servers and
      Viscosity clients.
  sources:
    - https://www.sparklabs.com/company/
    - https://www.sparklabs.com/support/kb/
    - https://www.sparklabs.com/viscosity/
    - https://www.sparklabs.com/viscosity/releasenotes/mac/
  summary:
    - >
      Viscosity is a proprietary graphical OpenVPN client from SparkLabs for macOS and
      Windows. It is intended to make importing, creating, monitoring, and automating
      OpenVPN connections accessible without removing the advanced controls expected by
      networking specialists.
  timeline:
    - '2008: SparkLabs releases Viscosity.'
    - '2008-10-28: The official macOS release-note history records early public releases.'
    - >
      More than a decade after release: SparkLabs describes continuing use from home
      environments through large enterprises.
  usage:
    - >
      Users import provider- or administrator-supplied OpenVPN profiles, or create
      connections in Viscosity's graphical editor, then connect and inspect traffic and
      diagnostic information from its status interface.
    - >
      Power users employ advanced OpenVPN commands, split routing and DNS, AppleScript
      or Windows scripts, shared credentials, simultaneous connections, and
      connection-event automation. Administrators can bundle settings and profiles for
      managed deployment.
