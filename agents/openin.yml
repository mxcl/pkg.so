history:
  adoption-history:
    - >
      OpenIn has been distributed through the Mac App Store, Setapp, and direct
      download. The direct and Setapp builds are not sandboxed, while some advanced
      features of the App Store build use the separate OpenIn Helper.
    - >
      The application developed from a browser and application chooser into a general
      rule-driven handler for links, mail addresses, phone links, files, browser
      profiles, Focus modes, and custom scripts.
  package-nerd-significance:
    - >
      OpenIn belongs to the macOS default-handler and browser-routing niche alongside
      Choosy, Bumpr, Velja, Finicky, and Browserosaurus. It is useful to people who
      separate work and personal browsers, use several browser profiles, or want
      deterministic routing rules.
    - >
      Its ordered rules, regular-expression URL rewriting, JavaScript hooks, and
      zsh-script targets give a traditionally graphical utility an automation surface
      attractive to advanced macOS users.
  project-history:
    - >
      OpenIn began as a macOS utility for choosing which installed application should
      receive a link or file. Version 2 substantially rewrote the interface and
      configuration storage while adding browser profiles, source-application rules,
      modifiers, rewriting, and optional local history.
    - >
      Version 3 reorganized routing around ordered rules and expanded JavaScript
      customization. Version 4 adopted a newer macOS settings design, improved file-type
      grouping and history tools, and added deeper integrations such as Focus hints and
      Safari profiles. Later 4.x work added browser extensions, automatic profile
      discovery, and zsh scripts as target applications.
  related-projects:
    - OpenIn Helper supplies capabilities restricted by Mac App Store sandboxing.
    - >
      Comparable macOS routing utilities listed by the official documentation include
      Choosy, Bumpr, Velja, Finicky, and Browserosaurus.
  sources:
    - https://loshadki.app/blog/2021-04-20-openin-v2/
    - https://loshadki.app/blog/2021-12-01-openin-v3/
    - https://loshadki.app/blog/2022-09-22-public-beta-openin-v4/
    - https://loshadki.app/blog/2025-07-14-betas/
    - https://loshadki.app/openin4/
    - source_facts.package-manager
  summary:
    - >
      OpenIn is a macOS routing utility that selects applications for URLs, email and
      phone links, and files. Ordered rules can consider domains, paths, the source
      application, key modifiers, browser profiles, and the active Focus.
  timeline:
    - >
      2021: OpenIn 2 introduced rewritten configuration storage, browser profiles,
      source-app rules, URL rewriting, and optional local history.
    - '2021: OpenIn 3 introduced an ordered rule format and expanded custom scripting.'
    - >
      2022: OpenIn 4 entered public beta with a redesigned settings interface and
      expanded history tools.
    - >
      2025: OpenIn 4.3 beta added browser extensions, broader automatic profile
      discovery, and zsh-script targets.
  usage:
    - >
      Users make OpenIn the default handler for selected schemes or file types, register
      possible target applications, and arrange rules from specific to general. A
      request opens immediately when one target remains or shows a chooser when several
      remain.
    - >
      Advanced users can rewrite URLs with regular expressions, inspect or modify
      routing with JavaScript, invoke OpenIn through its URL scheme, or send requests to
      zsh scripts.
