history:
  adoption-history:
    - >
      ProNotes is aimed at people who prefer to keep their notes in Apple's built-in
      application but want interaction patterns commonly associated with Markdown
      editors and networked-note tools.
  package-nerd-significance:
    - >
      ProNotes is notable because it augments Apple Notes in place instead of
      introducing another note database or proprietary editor. It brings Markdown-like
      input, slash commands, backlinks, templates, and keyboard search to the native
      Notes workflow.
  project-history:
    - >
      Dexter Leng developed ProNotes as a macOS enhancement for Apple Notes. The
      official site presents a free core application with optional paid AI
      functionality.
    - >
      Its documented feature set grew around faster formatting and navigation: a
      contextual formatting bar, Markdown-style line conversion, slash commands,
      backlinks, templates, and a command-palette search interface.
  related-projects:
    - Apple Notes remains the underlying note-taking application and data surface.
    - ProNotes Gold adds AI-assisted writing features to the free core application.
  sources:
    - https://www.pronotes.app/
  summary:
    - >
      ProNotes is a macOS extension by Dexter Leng that adds power-user editing and
      navigation features to Apple Notes.
  timeline:
    - >
      2024: The official site identifies Dexter Leng as the project's author and
      copyright holder.
    - >
      Current product: The free core includes formatting, Markdown-style input, slash
      commands, backlinks, and templates, with AI tools offered separately.
  usage:
    - >
      While working in Apple Notes, users can format selected text from a contextual
      bar, type Markdown-like prefixes, invoke slash commands, insert templates, inspect
      backlinks, and search notes from a keyboard-driven command palette.
    - >
      ProNotes operates as an enhancement to Apple Notes, so users continue keeping and
      editing their notes through Apple's application.
