history:
  adoption-history:
    - >
      EPUBCheck is unusually central for a validator because EPUB itself is a publishing
      interchange and distribution format: retailers, aggregators, publishers,
      accessibility specialists, and production vendors need a shared answer to whether
      a file conforms. The W3C README's fundraising and donor list shows institutional
      support from publishers, digital publishing vendors, and accessibility-oriented
      organizations.
  package-nerd-significance:
    - >
      For package-maintainer culture, EPUBCheck is the boring-but-critical kind of tool:
      one command encapsulates a standards conformance suite that would otherwise
      require scattered schema and spec knowledge. It appears across Homebrew,
      Debian-family systems, MacPorts, Nix, and Arch packaging because EPUB validation
      is needed on developer workstations as well as publishing build machines.
  project-history:
    - >
      The project traces its early implementation to Adobe, then became part of the
      standards-centered EPUB ecosystem around IDPF, W3C, and DAISY. The current W3C
      repository states that the DAISY Consortium maintains EPUBCheck on behalf of W3C
      and that parts of its validation functionality build on Jing, Nu HTML Checker
      schemas, IDPF schemas, and DAISY work.
    - >
      The public GitHub repository was created in 2013 and lists EPUBCheck 3.0 as an
      early release that year. Current releases validate EPUB 2 and EPUB 3 content, with
      the production README noting EPUB 3.3 validation support.
  related-projects:
    - >
      Jing, Nu HTML Checker, IDPF schemas, DAISY schemas, and W3C EPUB specifications
      are important adjacent pieces of the EPUBCheck validation stack.
  sources:
    - https://github.com/w3c/epubcheck
    - https://github.com/w3c/epubcheck/releases
    - https://api.github.com/repos/w3c/epubcheck
    - https://www.w3.org/publishing/epubcheck
  summary:
    - >
      EPUBCheck is the official conformance checker for EPUB publications. It is
      distributed as both a standalone command-line tool and a Java library, which makes
      it useful in publisher QA pipelines, continuous integration, and ad hoc validation
      by ebook producers.
  timeline:
    - >
      2013: The W3C GitHub repository was created and EPUBCheck 3.0 was published on
      GitHub releases.
    - >
      2017: The project README points to W3C public mailing-list archives after older
      Google Group discussions.
    - >
      2020s: DAISY maintains EPUBCheck on behalf of W3C, with fundraising support for
      continued development and maintenance.
    - '2024: EPUBCheck 5.x validates EPUB 2 and EPUB 3 publications, including EPUB 3.3.'
  usage:
    - >
      Typical use is the `epubcheck` command against an `.epub` file, with optional
      machine-readable output for automation. The project also documents Docker use and
      Java-library use, so package managers mostly provide the CLI entry point while
      Java builds and CI systems can use the same validator deeper in tooling.
related-packages:
