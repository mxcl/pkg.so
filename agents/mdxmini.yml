history:
  adoption-history:
    - >
      Official README adoption evidence is niche but concrete: it lists MDXPLAYER for
      Android, ruby-mdxplay, Paula, and Modizer as programs using mdxmini. The Homebrew
      input facts package it as `mdxmini` with an `mdxplay` executable, making the
      library accessible to users who want quick playback rather than embedding the C
      API.
  package-nerd-significance:
    - >
      For package collectors, mdxmini is the kind of tiny multimedia formula that
      preserves a specific historical computer-music format behind a normal Unix build.
      It matters less for breadth than for making X68000 MDX files playable and
      scriptable on modern machines.
  project-history:
    - >
      The project sits in a lineage of MDX players rather than starting as a new file
      format. The official credits name the original X68000 MXDRV authors, Daisuke
      Nagano's Unix mdxplay, BouKiCHi's mdxmini library and Android player, and Misty De
      Meo as the current maintainer for bug fixes and improvements.
    - >
      The public GitHub tags show a v1.0.0 tag in January 2016 and a v2.0.0 tag in July
      2022 whose commit message notes SDL2 by default. That matches mdxmini's role as a
      preservation-oriented library that modern package managers can build as a
      conventional Unix command.
  related-projects:
    - >
      MXDRV, Unix mdxplay, MDXPLAYER for Android, ruby-mdxplay, Paula, Modizer, X68000
      MDX archives.
  sources:
    - https://github.com/mistydemeo/mdxmini#readme
    - https://github.com/mistydemeo/mdxmini/tags
    - source_facts.package-manager-url
  summary:
    - >
      mdxmini is a small C library and command-line playback package for MDX chiptunes
      from Sharp X68000 music culture. Its README frames the project around the X68000's
      YM2151 FM sound chip, PCM support, and the MDX archive ecosystem.
  timeline:
    - '2016: v1.0.0 tag appears in the official GitHub repository.'
    - '2022: v2.0.0 tag switches the build toward SDL2 by default.'
  usage:
    - >
      The README documents using `mdx_open`, `mdx_set_rate`, `mdx_get_length`,
      `mdx_get_title`, `mdx_get_tracks`, and `mdx_calc_sample` to decode an MDX file
      into PCM buffers. It also notes that song titles are usually Shift-JIS and that
      current-note data can support visualizers.
