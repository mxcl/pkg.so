history:
  adoption-history:
    - >
      The README says the REPL can be downloaded from frege-repl releases and, later, is
      included in Frege releases. Homebrew packages frege-repl separately and declares
      openjdk@17 as a dependency.
  package-nerd-significance:
    - >
      For package-manager users, frege-repl is the interactive front door to a JVM
      language toolchain: it packages a language REPL plus JDK dependency rather than a
      standalone text utility, making dependency metadata and language-runtime
      classification important.
  project-history:
    - >
      The frege-repl repository was created in 2012 under the Frege organization. Its
      README documents interactive Frege evaluation, REPL commands, Gradle-based source
      builds, and the requirement for a JDK because Frege compiles through Java.
  related-projects:
    - >
      Related official Frege projects include the Frege compiler, standard library,
      online REPL, FregeFX REPL, Eclipse plugin, VS Code plugin, and documentation tool.
  sources:
    - https://api.github.com/repos/Frege/frege-repl
    - https://formulae.brew.sh/api/formula/frege-repl.json
    - https://github.com/Frege/frege
    - https://github.com/Frege/frege-repl
    - https://raw.githubusercontent.com/Frege/frege-repl/master/README.md
    - https://www.frege-lang.org/doc/fregedoc.html
  summary:
    - >
      Frege REPL is the command-line read-eval-print loop for Frege, a Haskell-like
      purely functional language for the JVM.
  timeline:
    - '2012: frege-repl GitHub repository created.'
    - '2015-2017: Frege README reports JavaOne Emerging Languages Bowl wins for Frege.'
    - '2019: frege-repl repository last pushed according to GitHub metadata.'
    - '2026: Homebrew formula reports stable version 1.4-SNAPSHOT with openjdk@17 dependency.'
  usage:
    - >
      Users run frege-repl to evaluate snippets and use commands such as :type, :browse,
      :java, :load, :history, :reset, :version, :help, and :quit. The broader Frege
      README positions Frege as Haskell for the JVM with Java interoperability.
related-packages:
  - id: brew:frege
    reason: >
      Install the main Frege compiler and standard library when moving from interactive
      REPL experiments to building complete Frege programs; the REPL is documented as
      part of the wider Frege toolchain.
    rel: adjacent_workflow
    sources:
      - https://github.com/Frege/frege-repl
      - https://github.com/Frege/frege
