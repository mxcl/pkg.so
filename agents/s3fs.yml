id: brew:s3fs
display-name: s3fs
repo: null
docs:
  - https://github.com/s3fs-fuse/s3fs-fuse/wiki
  - https://github.com/s3fs-fuse/s3fs-fuse#readme
config-file-location:
  unix:
    - /etc/fstab
credentials-file-location:
  unix:
    - ${HOME}/.aws/credentials
    - ${HOME}/.passwd-s3fs
    - /etc/passwd-s3fs
history:
  adoption-history:
    - >
      s3fs is packaged across Homebrew, Debian, Ubuntu, Arch Linux, Nix, MacPorts, and
      openSUSE according to source_facts.package-manager. The official README also
      documents packages for Fedora, Gentoo, RHEL/CentOS, FreeBSD, and macOS, indicating
      broad Unix-like distribution adoption.
  package-nerd-significance:
    - >
      s3fs is a longstanding example of translating object storage into a familiar Unix
      filesystem interface. Package enthusiasts care about its interaction with FUSE
      implementations, platform-specific packaging, credential-file permissions,
      boot-time mounts, and the semantic gap between S3 objects and POSIX files.
  project-history:
    - >
      The project emerged by at least 2010, the copyright year stated by its official
      repository, as a FUSE-based way to mount Amazon S3 buckets. It developed support
      for the standard AWS credential file, its own passwd-s3fs format, S3-compatible
      services, multipart transfers, and mounting through fstab.
  related-projects:
    - >
      The official README identifies goofys, s3backer, s3ql, YAS3FS, and CSI for S3 as
      related approaches. FUSE supplies the userspace filesystem layer, while Amazon S3
      and compatible object stores supply storage.
  sources:
    - https://github.com/s3fs-fuse/s3fs-fuse
    - https://github.com/s3fs-fuse/s3fs-fuse/wiki
    - source_facts.package-manager
  summary:
    - >
      s3fs is a FUSE filesystem client that exposes an Amazon S3 bucket through a mount
      point. It favors filesystem convenience and compatibility while documenting that
      S3 cannot provide all local-filesystem performance or POSIX semantics.
  timeline:
    - '2010: Copyright date recorded in the official repository.'
    - '2025: Official release 1.97 published.'
  usage:
    - >
      Users typically create or reuse an AWS credential file, secure it with owner-only
      permissions, and run `s3fs bucket /path/to/mountpoint`. Mounts can also be
      declared in `/etc/fstab`; non-AWS endpoints generally require an explicit URL and
      path-style requests. The official documentation warns about costly random writes,
      network-bound metadata operations, non-atomic renames, and the absence of hard
      links or cross-client coordination.
