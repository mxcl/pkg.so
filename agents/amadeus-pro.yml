history:
  adoption-history:
    - >
      Amadeus Pro has persisted as a specialist macOS audio utility across major
      platform transitions, including PowerPC-to-Intel migration, 32-to-64-bit
      migration, Dark Mode, Metal rendering, and Apple silicon.
  package-nerd-significance:
    - >
      The package appeals to Mac software collectors because it is a long-lived, native
      audio editor available outside subscription-heavy production suites. The vendor
      continues to make compatibility-specific older releases available, which is useful
      when maintaining older Macs.
  project-history:
    - >
      HairerSoft's official version history documents the major feature progression of
      Amadeus Pro from version 1.0 onward. Version 2 expanded the editor with multitrack
      documents, batch processing, repair tools, Audio Unit support, and broader format
      handling.
  related-projects:
    - Amadeus Lite
    - Apple Audio Units
    - VST
  sources:
    - https://www.hairersoft.com/forum/viewtopic.php?t=547
    - https://www.hairersoft.com/manual.pdf
    - https://www.hairersoft.com/pro.html
  summary:
    - >
      Amadeus Pro is a native macOS sound recorder, waveform editor, converter, and
      batch processor developed by HairerSoft.
  timeline:
    - >
      2008: HairerSoft published an official major-version history covering releases
      since Amadeus Pro 1.0.
    - '2018: Version 2.5 added macOS Mojave Dark Mode support.'
    - '2019: Version 2.6 completed the transition to 64-bit operation for macOS Catalina.'
    - >
      Later 2.x releases: Added RF64, CAF metadata, Apple silicon compatibility work,
      and other modern macOS improvements.
  usage:
    - >
      Users record or import audio, edit waveforms and tracks, apply effects, repair
      recordings, convert formats, edit metadata, and automate collections of files with
      the batch processor. The application supports Apple Audio Units and VST plug-ins.
