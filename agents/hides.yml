  package-nerd-significance:
    - >
      Hides represents the small, single-purpose macOS utilities commonly curated
      through Homebrew Cask: it exposes native window-hiding behavior through an
      installable menu-bar application and configurable shortcuts.
  project-history:
    - >
      SweetP Productions developed Hides as a focused macOS utility for hiding open
      applications. Its defining Focus Mode automatically hides every application except
      the active one.
