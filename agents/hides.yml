  summary:
    - >
      Hides is a macOS menu-bar productivity utility that removes desktop distractions
      by hiding applications other than the one currently in use.
  timeline:
    - 'By 2013: User reports reproduced on the official site document established use of Hides.'
    - >
      Current product generation: Hides supports global or application-specific Focus
      Mode and configurable keyboard shortcuts.
  usage:
    - >
      Users enable Focus Mode globally or for selected applications, invoke hide actions
      from the menu bar, or assign global keyboard shortcuts. The publisher does not
      document a filesystem location for its preferences.
