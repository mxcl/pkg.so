    - /etc/fpc.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      FPC's adoption is closely tied to Pascal compatibility and cross-platform reach.
      It gave Pascal and Object Pascal users a free compiler path for Linux, Windows,
      BSD, macOS, DOS, OS/2, embedded platforms, and later mobile and unusual targets.
    - >
      In August 2021, the project announced that all SVN repositories had been converted
      to Git and moved to GitLab, with the Mantis bug tracker also converted. That move
      is a clear package-history milestone because it changed how downstream packagers,
      contributors, and distribution maintainers track source.
  package-nerd-significance:
    - >
      FPC is package-nerd significant because it is both a compiler package and a
      bootstrap ecosystem. Packaging it means managing compiler binaries, RTL units,
      packages, tools, documentation, target support, and the usual self-hosting
      concerns.
    - >
      It also anchors Lazarus and a broader Object Pascal open-source stack, making it a
      key dependency for desktop GUI development, legacy Pascal migration,
      cross-compilation, and Pascal-to-JavaScript workflows.
  project-history:
    - >
      The compiler was originally named FPK-Pascal. The official FAQ gives a compact
      project history: it started in June 1993, small programs worked by October 1993,
      the compiler compiled its own sources by March 1995, it was released on the
      Internet in March 1996, and version 1.0 arrived in July 2000.
    - >
      FPC grew from a Turbo Pascal-compatible compiler into a broad language-runtime
      project with compiler, RTL, packages, utilities, tests, installer, documentation,
      and release-building repositories. The home page lists targets across x86, AMD64,
      PowerPC, SPARC, ARM, AArch64, MIPS, Motorola 68k, AVR, JVM, and more, with
      development support for RISC-V, Xtensa, Z80, WebAssembly, LLVM, and pas2js.
  related-projects:
    - Lazarus is the most visible adjacent project in the Free Pascal ecosystem.
    - >
      Related FPC subprojects and tools include the Free Component Library, RTL, fpdoc,
      fpcmake, h2pas, pas2js, and target-specific compiler backends.
  sources:
    - https://gitlab.com/freepascal.org/fpc/source
    - https://www.freepascal.org/
    - https://www.freepascal.org/develop.var
    - https://www.freepascal.org/docs-html/current/user/usersu10.html
    - https://www.freepascal.org/docs.html
    - https://www.freepascal.org/faq.var
  summary:
    - >
      Free Pascal Compiler, commonly FPC, is a mature open-source compiler for Pascal
      and Object Pascal. Its official site describes it as a 16-, 32-, and 64-bit Turbo
      Pascal and Delphi-compatible compiler with many CPU and operating-system targets.
  timeline:
    - '1993: FPK-Pascal project started.'
    - '1995: Compiler compiled its own sources.'
    - '1996: Released on the Internet.'
    - '2000: Version 1.0 released.'
    - '2015: Version 3.0.0 released.'
    - '2020: Version 3.2.0 released.'
    - '2021: Version 3.2.2 released and repositories moved from SVN to GitLab.'
  usage:
    - >
      Users compile Pascal and Object Pascal programs with fpc and related
      target-specific ppcXYZ compiler binaries. The distribution also includes
      documentation, tools such as fpcmake, fpdoc, h2pas, ppudump, and package sources
      including the Free Component Library.
    - >
      The user guide documents fpc.cfg as the compiler configuration file. On Unix-like
      systems, the compiler looks in the current directory, the user's home directory as
      .fpc.cfg, PPC_CONFIG_PATH, an etc directory above the compiler directory, and /etc
      unless -n disables config lookup.
related-packages: []
