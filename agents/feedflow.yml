history:
  adoption-history:
    - >
      FeedFlow is available on Android, iOS, macOS, Windows, and Linux. Official
      distribution channels include mobile and desktop app stores, F-Droid, Flathub,
      Homebrew, and upstream release artifacts.
    - >
      The application can remain entirely local or synchronize through cloud-storage
      providers and reader services including iCloud, Dropbox, Google Drive, FreshRSS,
      Miniflux, Feedbin, and BazQux Reader.
  package-nerd-significance:
    - >
      FeedFlow is part of the continuing RSS ecosystem built around open feed formats,
      chronological reading, OPML portability, and user-selected synchronization rather
      than a centralized algorithmic feed.
    - >
      Its codebase is also a substantial Kotlin Multiplatform example: shared logic
      serves Android and desktop Compose applications, while the iOS interface uses
      SwiftUI. SQLDelight provides local storage.
  project-history:
    - >
      Marco Gomiero created FeedFlow as a minimal, open-source RSS reader. Public
      repository activity dates to 2023, and the project grew into a five-platform
      application using Kotlin Multiplatform, Compose Multiplatform, and SwiftUI.
    - >
      Development expanded the original reading workflow with multiple reading modes,
      offline content, filtering, bookmarks, keyword blocking, OPML and CSV interchange,
      and optional synchronization backends.
  related-projects:
    - >
      FeedFlow supports RSS and Atom feeds and OPML subscription exchange. FreshRSS,
      Miniflux, Feedbin, and BazQux Reader can act as synchronization services, while
      the developer's RSS-Parser library provides feed parsing.
  sources:
    - https://github.com/prof18/feed-flow
    - https://www.feedflow.dev/
  summary:
    - >
      FeedFlow is a free and open-source RSS reader focused on a clean chronological
      timeline, portable subscriptions, flexible article viewing, and optional
      synchronization.
  timeline:
    - '2023: The public FeedFlow project and repository were active.'
    - >
      Later development: FeedFlow expanded across Android, iOS, macOS, Windows, and
      Linux and added multiple local, cloud-storage, and feed-service synchronization
      choices.
  usage:
    - >
      Users subscribe to RSS or Atom feeds, import and export subscriptions with OPML,
      organize sources into categories, filter or bookmark articles, and read through
      Reader Mode, an in-app browser, or an external browser.
    - >
      An account is not required for local use. People who want multiple-device
      continuity can select a supported cloud-storage provider or connect a compatible
      hosted or self-hosted feed service.
