history:
  adoption-history:
    - >
      The utility found a niche among Mac users who prefer traditional wheel scrolling
      while retaining Apple's natural direction on a trackpad. Homebrew Cask
      installation and signed release artifacts made it convenient to deploy alongside
      other macOS utilities.
    - >
      Community contributions later added Apple silicon builds, notarization,
      launch-at-login support, mouse-acceleration controls, and compatibility fixes for
      newer macOS releases.
  package-nerd-significance:
    - >
      UnnaturalScrollWheels is a focused example of a small native utility filling a
      macOS settings gap: the operating system exposes mouse and trackpad direction
      controls in separate panels but couples their behavior.
    - >
      It is also relevant to desktop package users because it requires macOS
      Accessibility permission to intercept and transform scroll events, an operational
      detail that ordinary command-line packages rarely encounter.
  project-history:
    - >
      Theron Tjapkes created UnnaturalScrollWheels in 2020 to reverse physical
      scroll-wheel input without changing natural trackpad scrolling. The implementation
      distinguishes line-oriented wheel events from continuous trackpad events and
      transforms the former through a macOS event tap.
    - >
      Later releases added alternative device detection, a universal Intel and Apple
      silicon build, mouse-acceleration controls, notarization, and launch-at-login
      support. Community maintenance subsequently supplied compatibility and signing
      improvements.
  related-projects:
    - >
      The official release notes mention LinearMouse as a broader modern alternative.
      Other macOS input-remapping utilities address similar gaps but may combine
      scrolling with pointer acceleration and button customization.
  sources:
    - https://github.com/ther0n/UnnaturalScrollWheels/blob/main/README.md
    - >
      https://github.com/ther0n/UnnaturalScrollWheels/blob/main/UnnaturalScrollWheels/ScrollInterceptor.swift
    - https://github.com/ther0n/UnnaturalScrollWheels/releases
  summary:
    - >
      UnnaturalScrollWheels is an open-source macOS menu-bar utility that reverses
      physical mouse-wheel scrolling while leaving natural trackpad scrolling intact.
  timeline:
    - '2020: Theron Tjapkes created the project and published its first release.'
    - '2021: A universal Intel and Apple silicon build was released.'
    - >
      Later releases: Mouse-acceleration controls, notarization, and launch-at-login
      support were added.
    - >
      2026: Community releases added macOS Tahoe compatibility and further signing
      improvements.
  usage:
    - >
      Users grant the application Accessibility permission so it can intercept scroll
      events, then select direction and related behavior in its preferences. Reopening
      the application restores the preferences window and menu-bar icon if the icon has
      been hidden.
