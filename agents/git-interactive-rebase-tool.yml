history:
  adoption-history:
    - >
      The README and install guide show the tool moving beyond a Rust crate into
      ordinary package-manager channels: release binaries and packages for Debian-style
      and RPM systems, Homebrew on macOS, Cargo, and community packages for Alpine,
      Arch, Fedora, FreeBSD, Guix, Chocolatey, and Scoop. That packaging spread made it
      usable as a daily Git sequence editor without asking users to build Rust code by
      hand.
  package-nerd-significance:
    - >
      For package nerds, it is a good example of a single-purpose Rust CLI gaining
      cross-platform distribution by respecting Git's existing sequence-editor hook. It
      avoids replacing Git's rebase machinery; it improves the one user-facing edit
      surface that Git deliberately delegates.
  project-history:
    - >
      Maro Miguel published the repository in December 2016 and released version 0.1.0
      the next day. The changelog records a rapid early rewrite in version 0.2.0,
      followed by scrolling, man-page, color, exec-action, and configuration work
      through the 0.x line.
    - >
      The project reached 1.0.0 in April 2019 with Unicode support and overflow
      handling. Version 2.0.0 in January 2021 was a larger terminal rewrite, replacing
      Curses with Crossterm while adding commit diff views, richer key handling,
      external-editor error handling, and improved macOS color support.
  related-projects:
    - >
      The tool relates directly to Git's built-in interactive rebase and
      `GIT_SEQUENCE_EDITOR` interface. It also overlaps with editor-specific Git
      workflows, but keeps the core interaction inside a portable terminal UI.
  sources:
    - https://api.github.com/repos/MitMaro/git-interactive-rebase-tool
    - https://github.com/MitMaro/git-interactive-rebase-tool#readme
    - https://github.com/MitMaro/git-interactive-rebase-tool/blob/master/CHANGELOG.md
    - https://github.com/MitMaro/git-interactive-rebase-tool/blob/master/readme/install.md
    - https://gitrebasetool.mitmaro.ca/
  summary:
    - >
      Git Interactive Rebase Tool is a Rust terminal sequence editor for `git rebase
      -i`. It replaces the plain text todo-file edit step with a keyboard-driven
      interface for changing actions, reordering commits, inspecting diffs, and writing
      the rebase plan back to Git.
  timeline:
    - '2016: Public repository created and 0.1.0 released.'
    - '2019: 1.0.0 added Unicode and overflow support.'
    - '2021: 2.0.0 replaced Curses with Crossterm and expanded diff and keybinding support.'
    - '2024: 2.4.0 added NO_COLOR support and post-modified-line exec command support.'
  usage:
    - >
      Users configure Git with `git config --global sequence.editor
      interactive-rebase-tool`, then run ordinary interactive rebases. Inside the tool
      they set actions such as pick, squash, fixup, edit, reword, and drop; reorder
      lines; select multiple commits; inspect commit summaries and diffs; toggle break
      actions; and write or abort the todo file.
    - >
      The tool also supports direct invocation on a rebase todo file and temporary
      overrides through `GIT_SEQUENCE_EDITOR`, which makes it fit both persistent
      personal Git configuration and one-off rebase sessions.
related-packages:
