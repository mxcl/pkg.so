history:
  adoption-history:
    - >
      The README documents use in the NVDA and Orca open source screen readers and in
      commercial assistive technology from ViewPlus. Software Freedom Conservancy's
      March 17, 2025 announcement described liblouis as embedded in assistive
      technologies including screen readers, braille displays, Android devices, and
      iPhone devices.
    - >
      A May 6, 2014 maintainership-succession announcement says John Boyer and ViewPlus
      initiated the Liblouis project twelve years earlier, and that Boyer built a
      community around it before passing maintainership to younger volunteers.
  package-nerd-significance:
    - >
      Liblouis is significant because it turns braille translation into portable,
      inspectable data files plus a C ABI. For packagers, the table data, CLI validation
      tools, and library are inseparable: shipping the package means shipping both
      accessibility infrastructure and the tools to keep language-specific braille rules
      correct.
  project-history:
    - >
      The Liblouis README says the project began in 2002 through ViewPlus, which wanted
      high-quality braille support as an open source effort and supported John Boyer
      with a monthly stipend so he could work with sighted assistants. The project was
      based on translation routines from the BRLTTY Linux screen reader but grew beyond
      those routines into a standalone shared library and Windows DLL.
    - >
      Liblouis supports computer and literary braille, contracted and uncontracted
      translation, hyphenation, math braille, and a rule- or dictionary-based table
      system. Its manual is aimed both at people writing translation tables and
      programmers embedding the library.
  related-projects:
    - BRLTTY provided the translation-routine foundation for Liblouis.
    - NVDA and Orca are documented downstream screen-reader users.
    - >
      liblouisutdml and BrailleBlaster are adjacent braille formatting and transcription
      projects associated with the broader Liblouis ecosystem.
  sources:
    - https://api.github.com/repos/liblouis/liblouis
    - https://github.com/liblouis/liblouis
    - https://liblouis.io/2014/05/06/maintainership-succession.html
    - https://liblouis.io/documentation/liblouis
    - https://raw.githubusercontent.com/liblouis/liblouis/master/README
    - https://sfconservancy.org/news/2025/mar/17/liblouis-joins-software-freedom-conservancy/
  summary:
    - >
      Liblouis is an open source braille translator and back-translator named for Louis
      Braille. It provides a C library, translation tables for many languages and
      braille codes, and command-line tools for checking, debugging, and testing braille
      translation tables.
  timeline:
    - '2002: ViewPlus and John Boyer began Liblouis.'
    - '2012: GitHub repository created on July 21, 2012.'
    - '2014: Maintainership succession announced on May 6, 2014.'
    - '2025: Liblouis joined Software Freedom Conservancy on March 17, 2025.'
    - '2026: Repository metadata recorded active development on July 1, 2026.'
  usage:
    - >
      Users commonly interact with Liblouis through programs such as lou_checktable,
      lou_debug, lou_translate, lou_trace, and lou_allround, or by linking the library
      from screen readers, embossing software, document converters, and mobile
      accessibility stacks. Table authors write text files with opcodes, includes,
      display rules, hyphenation support, and metadata.
