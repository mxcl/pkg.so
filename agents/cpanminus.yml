id: brew:cpanminus
display-name: cpanminus
repo: https://github.com/miyagawa/cpanminus
docs:
  - https://github.com/miyagawa/cpanminus#readme
  - https://metacpan.org/pod/App::cpanminus
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README explicitly notes distribution through package management
      systems, including Debian packages, RPMs, FreeBSD ports, and other
      operating-system packages. The batch source facts also list Homebrew, Debian,
      Ubuntu, Fedora-family, Arch, and openSUSE-style package names.
    - >
      It became popular in Perl packaging culture because it reduced CPAN installation
      to a small command-line tool, avoiding the heavier interactive configuration
      experience associated with older CPAN clients.
  package-nerd-significance:
    - >
      cpanminus matters to package nerds because it is both a package and a package
      installer: distributions package it so users can install Perl modules, while Perl
      users use it to bridge CPAN, local::lib, system package policies, and
      self-contained language-runtime workflows.
  project-history:
    - >
      The official README presents cpanminus as a dependency-free, zero-configuration,
      standalone script that can bootstrap itself and run with a small memory footprint.
      Its copyright notice begins in 2010 under Tatsuhiko Miyagawa.
    - >
      The project repository and MetaCPAN documentation identify cpanminus as
      App::cpanminus, with cpanm as the user-facing executable.
  related-projects:
    - >
      The README compares its scope with CPAN and CPANPLUS, and points to local::lib,
      perlbrew, plenv, CPAN Meta DB, MetaCPAN, App::cpanoutdated, cpan-listchanges, and
      App::cpanminus::reporter as adjacent tools.
  sources:
    - https://github.com/miyagawa/cpanminus#readme
    - https://metacpan.org/pod/App::cpanminus
  summary:
    - >
      cpanminus, commonly invoked as cpanm, is a minimal Perl CPAN installer whose
      official description is to get, unpack, build, and install modules from CPAN and
      do nothing else.
  timeline:
    - '2010: Copyright start year for App::cpanminus in the official README.'
    - >
      1.6004: The README notes CPAN Meta DB and MetaCPAN query behavior for cpanm 1.6004
      or later.
    - >
      Current packaging: The README documents availability through Debian packages,
      RPMs, FreeBSD ports, and other operating-system package systems.
  usage:
    - >
      The common usage is `cpanm Module`, with installation options for system Perl,
      local Perl environments such as perlbrew or plenv, and standalone executable
      placement. cpanminus fetches and unpacks files under ~/.cpanm by default and
      allows PERL_CPANM_HOME to change that working area.
related-packages:
  - id: brew:cpm
    reason: >
      Choose cpm when parallelism and faster dependency installation are priorities; its
      upstream documentation explicitly presents cpanminus as a related CPAN installer.
    rel: alternative
    sources:
      - https://github.com/skaji/cpm#readme
      - https://metacpan.org/pod/App::cpanminus
  - id: brew:carton
    reason: >
      Use Carton with cpanminus when an application needs version-controlled cpanfile
      snapshots, project-local installs, cached bundles, and repeatable deployment.
    rel: adjacent_workflow
    sources:
      - https://metacpan.org/pod/Carton
      - https://metacpan.org/pod/App::cpanminus
