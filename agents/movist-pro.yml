history:
  adoption-history:
    - >
      Movist Pro is distributed directly for macOS and is also available through
      Homebrew Cask. The official site additionally describes an upgrade path for
      purchasers of the earlier App Store edition.
  package-nerd-significance:
    - >
      The cask provides a package-manager installation path for a polished,
      proprietary-style macOS media player that is otherwise distributed from the
      developer's update infrastructure.
  project-history:
    - >
      Movist Pro is the feature-expanded edition of the Movist media player for macOS.
      Its official release notes document continuing maintenance across successive macOS
      versions.
  related-projects:
    - Movist
    - Homebrew Cask
    - AirPlay
  sources:
