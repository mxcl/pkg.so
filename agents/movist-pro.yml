  summary:
    - >
      Movist Pro is a macOS media player focused on native presentation, subtitle
      handling, and convenient playback controls.
  timeline:
    - 'Ongoing: The official release-notes page records maintained Movist Pro releases.'
    - >
      Current distribution: Direct downloads and Homebrew Cask provide installation
      outside the Mac App Store.
  usage:
    - >
      Use Movist Pro for local video playback on macOS, including subtitle-heavy viewing
      and AirPlay playback. Preferences are managed through the application's interface;
      no official filesystem path for them was documented.
