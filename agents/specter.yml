history:
  adoption-history:
    - >
      Specter Desktop grew around self-hosted Bitcoin users who wanted a graphical
      interface for Bitcoin Core, PSBT workflows, multisignature wallets, and air-gapped
      or USB hardware signers.
    - >
      The project expanded beyond direct Bitcoin Core connections: official
      documentation says Specter 2.0 can use Electrum infrastructure and no longer
      requires a Bitcoin Core node. Official releases are distributed as desktop
      applications, server binaries, Python packages, and containers.
  package-nerd-significance:
    - >
      Specter Desktop combines a local web service, cross-platform desktop wrapper,
      Python package, container image, and hardware-wallet tooling in one project. This
      makes it notable to package users interested in reproducible self-hosted Bitcoin
      infrastructure.
    - >
      Its state lives under `~/.specter`, separate from replaceable binaries. That
      directory can contain device records, wallet metadata, node settings,
      authentication configuration, logs, and optionally substantial managed-node data,
      so backups and permissions matter.
  project-history:
    - >
      Specter Desktop originated alongside the Specter DIY hardware-wallet effort as a
      small Python Flask server providing a friendlier interface to Bitcoin Core. Its
      goal was to make PSBT and multisignature hardware-wallet workflows less dependent
      on command-line operation.
    - >
      The project evolved into a cross-platform watch-only wallet coordinator supporting
      Bitcoin Core or Electrum backends and numerous hardware wallets. It emphasizes
      standard descriptors, derivation paths, PSBTs, and exportability so users retain
      recovery and interoperability options.
  related-projects:
    - >
      Specter DIY is the related do-it-yourself air-gapped hardware wallet; Specter
      Desktop coordinates transactions but does not replace the signer's security role.
    - >
      Bitcoin Core supplies node, wallet, and RPC functionality; HWI provides
      hardware-wallet integration; Electrum-compatible servers provide an alternative
      backend.
  sources:
    - https://docs.specter.solutions/desktop/
    - https://docs.specter.solutions/desktop/faq/
    - https://docs.specter.solutions/diy/
    - https://github.com/cryptoadvance/specter-desktop
  summary:
    - >
      Specter Desktop is an open-source, watch-only Bitcoin wallet coordinator and
      graphical interface for Bitcoin Core or Electrum, designed around hardware
      wallets, PSBTs, and multisignature setups.
  timeline:
    - >
      2019: The Specter project publicly demonstrated its air-gapped hardware-wallet
      prototype and related desktop tooling.
    - >
      2020s: Specter Desktop expanded into packaged desktop, server, Python, and
      container distributions.
    - 'Specter 2.0: Electrum support removed the requirement to operate a Bitcoin Core node.'
  usage:
    - >
      Users connect a Bitcoin Core node or Electrum backend, import hardware-wallet
      public keys, create single-signature or multisignature watch-only wallets, compose
      transactions, and pass PSBTs to signing devices by USB, QR code, or removable
      media.
    - >
      The default data directory is `~/.specter`; the official CLI permits overriding it
      with `--specter-data-folder`. The official FAQ warns that wallet metadata in this
      folder is not wholly encrypted at rest.
    - >
      Node RPC usernames and passwords may be entered in Specter's settings or obtained
      from `bitcoin.conf`; remote unencrypted RPC connections can expose those
      credentials, so the official documentation recommends appropriate secure
      transport.
