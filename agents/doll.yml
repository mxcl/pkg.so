history:
  adoption-history:
    - >
      Doll is distributed as a native macOS application and through Homebrew Cask. It
      serves users who hide the Dock, work full-screen, or use secondary displays where
      Dock badges are not continuously visible.
  package-nerd-significance:
    - >
      Doll is a focused example of a macOS utility that turns otherwise transient
      desktop state into persistent menu-bar information. Its open Swift source also
      makes its Accessibility-based polling behavior inspectable.
  project-history:
    - >
      Doll was created as an open-source macOS utility that copies application badge
      text from Dock items into the menu bar. Its design arose from the difficulty of
      noticing unread messages while the Dock is hidden or another application is
      full-screen.
  related-projects:
    - macOS Dock
    - macOS Accessibility API
    - Homebrew Cask
  sources:
    - https://github.com/xiaogdgenuine/Doll#readme
    - https://github.com/xiaogdgenuine/Doll/releases
    - source_facts.package-manager
  summary:
    - >
      Doll monitors selected macOS Dock applications and displays their icons and badge
      counts in the menu bar.
  timeline:
    - >
      2023: The 0.0.9 series added inactive-icon dimming and improved badge capture in
      non-English environments.
  usage:
    - >
      Users add applications to monitor and grant Doll Accessibility permission. Doll
      then polls their Dock elements and synchronizes badge text into menu-bar icons;
      clicking an icon opens its application, while an Option-click or right-click
      exposes management controls.
