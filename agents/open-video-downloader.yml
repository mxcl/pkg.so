history:
  adoption-history:
    - >
      The application became available across Windows, macOS, and Linux, with the
      official README documenting GitHub releases, Homebrew Cask, WinGet, and Microsoft
      Store distribution. Its graphical workflow made youtube-dl and later yt-dlp
      features accessible without requiring users to learn command-line options.
    - >
      The project has continued through multiple major release lines; its security
      policy identifies the 3.x line as the supported generation and treats 1.x and 2.x
      as legacy.
  package-nerd-significance:
    - >
      Open Video Downloader is a prominent example of a GUI package whose usefulness
      depends on a fast-moving command-line extractor ecosystem. Packagers care about
      the bundled or updated downloader engine, FFmpeg integration, platform packaging,
      and the distinction between the long-standing youtube-dl-gui repository name and
      the user-facing Open Video Downloader name.
  project-history:
    - >
      The project began under the descriptive name youtube-dl-gui as a cross-platform
      graphical frontend for downloading online media. In 2021 the maintainer adopted
      Open Video Downloader as the visible application name while retaining the
      repository and package identifiers to avoid disrupting updates.
    - >
      The modern application uses yt-dlp for extraction, with a Vue interface and
      Rust/Tauri backend. It supports video, audio, subtitles, metadata, playlists,
      format selection, queues, and authenticated downloads.
  related-projects:
    - yt-dlp
    - youtube-dl
    - FFmpeg
    - Tauri
  sources:
    - https://github.com/jely2002/youtube-dl-gui#readme
    - https://github.com/jely2002/youtube-dl-gui/blob/main/SECURITY.md
    - https://github.com/jely2002/youtube-dl-gui/issues/130
    - https://github.com/jely2002/youtube-dl-gui/wiki
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Open Video Downloader is an open-source, cross-platform graphical frontend for
      yt-dlp that downloads video, audio, subtitles, and metadata from supported sites.
  timeline:
    - '2021-05: The official settings wiki documented the 2.x youtube-dl-gui interface.'
    - >
      2021-07: The maintainer changed the visible product name to Open Video Downloader
      while retaining the youtube-dl-gui repository name.
    - >
      3.x generation: The application uses a Vue frontend and Rust/Tauri backend and is
      the project's supported release line.
  usage:
    - >
      Users paste or import media URLs, choose quality, format, subtitles, metadata,
      filename, and output options, then manage downloads through a queue.
      Authentication options include browser cookie files, basic authentication, and
      video passwords; users remain responsible for applicable laws and platform terms.
