credentials-file-location:
  unix:
    - ./.env
history:
  adoption-history:
    - >
      Reshape is distributed through Homebrew and Nix according to
      source_facts.package-manager. The official project also publishes release
      binaries, a Cargo package, and a Docker image.
    - >
      Official GitHub project metadata reports substantial community interest, while
      helper libraries are documented for Rust, Ruby/Rails, Python/Django, and Go
      application integration.
  package-nerd-significance:
    - >
      Reshape addresses a difficult deployment problem: changing a live PostgreSQL
      schema while old and new application versions overlap. Its declarative TOML/JSON
      migrations and staged start/complete/abort lifecycle make that technique available
      as a standalone package.
    - >
      Its use of views and triggers is operationally distinctive compared with
      traditional migration runners that apply schema changes in a single deployment
      step.
  project-history:
    - >
      Fabian Lindfors created Reshape as an open-source PostgreSQL migration tool
      focused on avoiding application downtime and excessive database locking.
    - >
      The project developed a three-phase migration model: prepare compatible old and
      new schema views, deploy the application gradually, then complete or abort the
      migration.
  related-projects:
    - >
      The project provides integration helpers for Rust, Ruby and Rails, Python and
      Django, and Go applications.
  sources:
    - 'Input package coverage: source_facts.package-manager'
    - 'Official repository and README: https://github.com/fabianlindfors/reshape'
  summary:
    - >
      Reshape is a PostgreSQL schema migration tool designed to let old and new
      application deployments operate concurrently during a rollout.
  timeline:
    - >
      Initial project: Published by Fabian Lindfors as a Rust-based PostgreSQL migration
      utility.
    - >
      Later development: Added helper libraries, Docker and binary distribution,
      built-in agent-oriented documentation, and machine-readable status output.
  usage:
    - >
      Migration files are stored by default under `migrations/` in TOML or JSON format.
      Operators run `reshape migration start`, roll out the new application, and then
      run `reshape migration complete`; failed deployments can be rolled back with
      `reshape migration abort`.
    - >
      Database connection settings can be supplied through flags, `DB_*` environment
      variables, or a `.env` file automatically loaded from the working directory.
