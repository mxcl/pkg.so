history:
  adoption-history:
    - >
      The official sqlmap history records acceptance into Debian on May 8, 2009 and
      Ubuntu on June 2, 2009. The supplied Homebrew-derived input also lists packaging
      across Homebrew, Debian, Ubuntu, Alpine, Arch, MacPorts, Nix, and openSUSE-style
      zypper ecosystems.
    - >
      The sqlmap homepage presents it as a mature project with decades of active
      development and a large contributor base, while the GitHub repository remains the
      public source and issue-tracking center.
  package-nerd-significance:
    - >
      Package maintainers care about sqlmap because it is a high-profile security CLI
      with fast-moving detection logic, many optional capabilities, and a long history
      of distro packaging. Its presence in common package managers makes authorized
      web-application testing reproducible without vendoring a checkout.
  project-history:
    - >
      The project history maintained in the official wiki traces sqlmap to a SourceForge
      registration on July 25, 2006, with an initial MySQL-focused skeleton, PostgreSQL
      support and version 0.1 later that year, and Bernardo Damele taking over the
      project in September 2006.
    - >
      The same official history records a long sequence of security-research-driven
      releases, including database takeover work presented publicly in 2009, version 0.9
      in 2011 with a rewritten detection engine, relocation from SourceForge/Subversion
      to GitHub on June 26, 2012, stable version 1.0 on February 27, 2016, Python 3
      support completed in 2019, and annual stable releases through 1.10 on January 1,
      2026.
  related-projects:
    - >
      The official history and README connect sqlmap workflows to SQL injection testing,
      database fingerprinting, Metasploit integration, and supported database systems
      rather than to one single language ecosystem.
  sources:
    - https://github.com/sqlmapproject/sqlmap/wiki/History
    - https://github.com/sqlmapproject/sqlmap/wiki/Usage
    - https://sqlmap.org/
    - source_facts.package-manager
  summary:
    - >
      sqlmap is an open-source command-line penetration-testing tool for automating SQL
      injection detection, exploitation, and database-server takeover workflows.
  timeline:
    - '2006: Project registered on SourceForge; version 0.1 released.'
    - '2009: Accepted into Debian and Ubuntu repositories.'
    - '2012: Development relocated to GitHub and a new homepage was deployed.'
    - '2016: Stable version 1.0 released.'
    - '2019: Python 3 support completed.'
    - '2026: Stable version 1.10 released.'
  usage:
    - >
      In package-manager and CLI culture, sqlmap is typically installed as a
      ready-to-run security tool and driven through many command-line switches. The
      official wiki's usage page documents verbosity, request logging, detection,
      enumeration, takeover, and bug-reporting workflows.
