history:
  adoption-history:
    - >
      LLD became a practical alternative to platform linkers by accepting familiar GNU
      and vendor-linker command lines. Official documentation reports production use for
      large projects including Firefox and Chromium, while package-manager availability
      makes it straightforward to select in reproducible toolchains.
  package-nerd-significance:
    - >
      Package enthusiasts care about LLD because changing one linker flag can materially
      reduce build times. The package also supplies distinct drivers for ELF, Mach-O,
      PE/COFF, and WebAssembly, making it useful in cross-compilation and multi-target
      toolchains.
  project-history:
    - >
      LLD was developed as the linker component of the LLVM toolchain. It shares LLVM
      libraries and is maintained in the unified llvm-project source tree alongside
      LLVM, Clang, and related projects.
  related-projects:
    - LLVM provides the underlying compiler infrastructure and object-file libraries.
    - Clang commonly selects LLD through the -fuse-ld=lld option.
    - >
      GNU ld, GNU gold, Microsoft link.exe, and Apple ld64 are the platform linkers
      whose interfaces its drivers broadly emulate.
  sources:
    - https://lld.llvm.org/
    - https://lld.llvm.org/MachO/index.html
    - https://lld.llvm.org/windows_support.html
    - https://llvm.org/
  summary:
    - >
      LLD is LLVM's high-performance, cross-target linker suite. The versioned lld@22
      formula packages release line 22 separately for users who need a stable toolchain
      generation.
  timeline:
    - >
      2017: Official documentation described the ELF implementation as a compact linker
      and published comparative performance results.
    - >
      2019: LLD moved into LLVM's unified llvm-project repository with the other LLVM
      subprojects.
    - >
      2026: The lld@22 formula provides the LLVM 22 linker generation as an explicitly
      versioned package.
  usage:
    - >
      On Unix-like systems, users normally invoke LLD through a compiler driver,
      commonly with -fuse-ld=lld, rather than calling ld.lld directly. The package also
      exposes lld-link for Windows-style linking, ld64.lld for Mach-O, and wasm-ld for
      WebAssembly.
    - >
      LLD is useful for faster native builds, cross-linking, link-time optimization
      workflows, and toolchains that need linker behavior compatible with established
      platform conventions.
related-packages:
  - id: brew:llvm@22
    reason: >
      Install the matching LLVM 22 package for Clang, LLVM libraries, and related
      utilities aligned with this linker; Homebrew declares it as lld@22's versioned
      dependency.
    rel: adjacent_workflow
    sources:
      - https://formulae.brew.sh/formula/lld@22
      - https://releases.llvm.org/22.1.0/docs/GettingStarted.html
  - id: brew:binutils
    reason: >
      Choose GNU Binutils when exact GNU ld compatibility or its accompanying assembler
      and binary utilities are required instead of LLD.
    rel: alternative
    sources:
      - https://lld.llvm.org/
      - https://www.gnu.org/software/binutils/binutils.html
