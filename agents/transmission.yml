credentials-file-location: null
history:
  adoption-history:
    - >
      Transmission grew from a native macOS client into a family of interoperable
      clients: native macOS, GTK and Qt desktop interfaces, a Windows-compatible Qt
      application, a headless daemon, command-line tools, and a web interface.
    - >
      Its low resource footprint made it suitable for home NAS devices, routers, and
      media servers. The official project site states that hardware vendors including
      Western Digital, Zyxel, and Belkin have used Transmission.
  package-nerd-significance:
    - >
      Transmission is a package-manager staple because the same project serves graphical
      desktops, headless servers, embedded hardware, and remote-control workflows. Its
      daemon, transmission-remote client, human-editable JSON configuration, and RPC
      interface make it particularly useful in automation and self-hosted systems.
  project-history:
    - >
      Transmission is an open-source, volunteer-developed BitTorrent client emphasizing
      a small resource footprint and platform-appropriate interfaces. The project
      maintains separate native or toolkit-based front ends while sharing a common
      BitTorrent engine and remote-control facilities.
    - >
      The project evolved beyond its native macOS interface to include GTK, Qt, Windows,
      daemon, command-line, and web variants. Its documentation now recommends
      transmission-remote over the older single-torrent transmission-cli utility.
  related-projects:
    - transmission-daemon
    - transmission-remote
    - Transmission Web Interface
    - transmission-gtk
    - transmission-qt
  sources:
    - >
      Official configuration documentation:
      https://github.com/transmission/transmission/blob/main/docs/Configuration-Files.md
    - >
      Official project site source:
      https://github.com/transmission/transmission.github.io/blob/master/index.html
    - >
      Official repository README:
      https://github.com/transmission/transmission/blob/main/README.md
  summary:
    - >
      Transmission is a free, open-source BitTorrent client available as a native macOS
      application, Linux and Windows graphical clients, a headless daemon, command-line
      utilities, and a remotely controlled web interface.
  timeline:
    - The project expanded from its native macOS interface to GTK and Qt desktop clients
    - >
      Headless daemon, RPC, command-line, and web interfaces made Transmission common on
      servers and embedded devices
    - >
      Modern releases use platform-specific configuration directories and recommend
      transmission-remote as the primary CLI client
  usage:
    - >
      Desktop users add torrent or magnet metadata and manage downloading, seeding,
      bandwidth, peers, and queues through a graphical interface. Server users commonly
      run transmission-daemon and control it through transmission-remote, RPC, or the
      web UI.
    - >
      On macOS, application preferences are stored in
      $HOME/Library/Preferences/org.m0k.transmission.plist and per-torrent state under
      $HOME/Library/Application Support/Transmission. Other clients use their documented
      platform-specific configuration directories.
