history:
  adoption-history:
    - >
      Mixing Station is available on iOS, Android, Windows, macOS, and Linux. Its
      official compatibility table spans digital consoles from Allen & Heath, Behringer,
      Midas, Mackie, PreSonus, QSC, Soundcraft, TASCAM, Yamaha, and other manufacturers,
      giving users a common control surface across otherwise separate mixer ecosystems.
  package-nerd-significance:
    - >
      For package users, Mixing Station is unusual because one desktop application
      abstracts numerous proprietary digital-mixer protocols. Cross-mixer scenes and
      presets, reusable layouts, and a unified desktop API make it useful both as an
      operator interface and as an automation bridge in live-audio systems.
  project-history:
    - >
      Mixing Station developed as a cross-platform remote-control application for
      professional digital audio mixers. The official documentation now treats desktop,
      Android, and iOS as distinct supported editions and maintains a detailed matrix of
      compatible console models and firmware.
    - >
      Its scope has grown beyond a replacement control surface to include custom
      layouts, cross-mixer scenes and presets, MIDI integration, community sharing,
      settings backup, and desktop OSC, REST, and WebSocket APIs.
  related-projects:
    - >
      Mixing Station interoperates with supported hardware mixer families rather than
      replacing their audio engines. The official compatibility list includes console
      lines from Allen & Heath, Behringer, Midas, Soundcraft, Yamaha, PreSonus, QSC, and
      others.
  sources:
    - https://mixingstation.app/
    - https://mixingstation.app/ms-docs/
    - https://mixingstation.app/ms-docs/feature-list/
    - https://mixingstation.app/ms-docs/use-cases/apis/
  summary:
    - >
      Mixing Station is a cross-platform remote-control and workflow application for a
      broad range of professional digital audio mixers.
  timeline:
    - >
      Current product era: Mixing Station supports mobile and desktop platforms plus a
      broad, maintained matrix of mixer models and firmware.
  usage:
    - >
      Operators use Mixing Station to connect to a supported mixer on the local network,
      control channel and bus parameters, build custom layouts, recall scenes and
      presets, analyze levels, and manage personal-monitor mixes. Desktop users can also
      automate supported console parameters through OSC, REST, and WebSocket interfaces.
