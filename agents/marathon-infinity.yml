history:
  adoption-history:
    - >
      The Aleph One project maintains Marathon Infinity as a ready-to-run cross-platform
      release with classic and high-definition assets. The official site identifies
      Infinity as the most popular trilogy entry for online play and notes compatibility
      with hundreds of community maps.
    - >
      The dedicated Homebrew cask recorded in source_facts.package-manager lets
      package-manager users install Infinity alongside the other two all-in-one trilogy
      applications, with its own scenario-specific preferences and data.
  package-nerd-significance:
    - >
      Marathon Infinity is especially important to the Marathon modding and multiplayer
      ecosystem: the official project presents it as the community's principal
      online-play entry and a host for hundreds of maps. Packaging it separately
      preserves that identity while sharing Aleph One's maintained codebase.
  project-history:
    - >
      Marathon Infinity is the third game in Bungie's original Marathon trilogy. Its
      Blood Tides of Lh'owon scenario expanded the series with a nonlinear,
      timeline-shifting story, new content, and durable multiplayer and mapmaking
      appeal. Aleph One subsequently carried it onto contemporary platforms.
  related-projects:
    - 'Marathon and Marathon 2: Durandal are the preceding trilogy entries.'
    - >
      Aleph One supplies the shared engine, while the wider community contributes
      compatible maps, scenarios, plugins, Lua scripts, and MML customizations.
  sources:
    - Input field source_facts.package-manager
    - 'Official Aleph One homepage: https://alephone.lhowon.org/'
    - 'Official Aleph One wiki: https://github.com/Aleph-One-Marathon/alephone/wiki'
    - 'Official Marathon Infinity page: https://alephone.lhowon.org/games/infinity.html'
    - 'Official engine repository: https://github.com/Aleph-One-Marathon/alephone'
    - >
      Official file-location documentation:
      https://github.com/Aleph-One-Marathon/alephone/wiki/File-Locations
  summary:
    - >
      Marathon Infinity is the third entry in Bungie's Marathon first-person-shooter
      trilogy. The current Aleph One release includes its Blood Tides of Lh'owon
      campaign, classic and enhanced graphics, and strong support for multiplayer and
      community maps.
  timeline:
    - "Original era: Bungie released Marathon Infinity as the trilogy's third installment."
    - >
      Open-source era: Aleph One continued support for Infinity's engine and content
      ecosystem.
    - >
      Modern distribution: The official project supplies ready-to-run macOS, Windows,
      and Linux packages.
  usage:
    - >
      Players use the standalone application for the solo or cooperative Blood Tides of
      Lh'owon campaign and for peer-to-peer multiplayer. Infinity is the trilogy's
      principal online-play choice and supports a large catalog of community maps
      alongside Aleph One plugins and scripting.
