history:
  adoption-history:
    - >
      nteract became known as a desktop-oriented member of the Jupyter ecosystem,
      offering notebook editing outside the browser. Its current distribution supports
      macOS and Linux and combines the desktop editor, command-line client, background
      runtime daemon, and Python bindings.
    - >
      The current project also targets AI-assisted notebook work: its MCP server lets
      compatible assistants inspect and modify cells, execute code, manage dependencies,
      and share the same live notebook state as the desktop user.
  package-nerd-significance:
    - >
      nteract is notable in interactive-computing packaging because it turns the Jupyter
      notebook model into a native desktop application while bundling runtime management
      around it. The modern application crosses several packaging ecosystems—native app
      bundles, Rust crates, Node packages, Python bindings, per-user services, and agent
      plugins.
  project-history:
    - >
      nteract originated as an open-source desktop environment for Jupyter notebooks and
      grew into a broader collection of interactive-computing components.
    - >
      The current codebase presents nteract as a local-first notebook environment. It
      uses Automerge-backed documents for realtime synchronization and a separate
      runtimed daemon for kernels, execution queues, output capture, environments, and
      notebook state.
  related-projects:
    - 'Jupyter: The notebook format and kernel protocol ecosystem underlying nteract workflows.'
    - 'runt: The bundled command-line interface for notebooks, kernels, and daemon management.'
    - >
      runtimed: The per-user background daemon responsible for environments,
      synchronization, and kernel execution.
    - 'Automerge: The document model used for synchronized notebook content.'
  sources:
    - 'Official release history: https://github.com/nteract/nteract/releases'
    - 'Official repository and README: https://github.com/nteract/nteract'
    - 'Official repository documentation: https://github.com/nteract/nteract/tree/main/docs'
  summary:
    - >
      nteract is an open-source, local-first native notebook environment in which users,
      Jupyter kernels, command-line clients, and AI agents can work against the same
      synchronized document.
  timeline:
    - >
      Early project era: nteract emerged as a native desktop application for Jupyter
      notebooks.
    - >
      Current generation: The project adopted a local-first Automerge document model and
      the runtimed execution daemon.
    - >
      2026: The 2.7 desktop release line was distributed for macOS through the official
      release channel.
  usage:
    - >
      Users open or create Jupyter notebooks in the native application and execute cells
      through local kernels. The bundled runt command can open notebooks, list live
      sessions, manage the daemon, stream logs, and start the MCP server for notebook
      automation.
