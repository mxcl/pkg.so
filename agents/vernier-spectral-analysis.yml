history:
  adoption-history:
    - >
      Vernier distributes Spectral Analysis across macOS, Windows, iOS, Android,
      ChromeOS, and the web, aligning it with mixed-device science classrooms. Its
      guided workflows are designed to make spectrophotometry approachable without
      removing common analytical tools such as curve fitting, interpolation, statistics,
      and calculated columns.
    - >
      The application is closely tied to Vernier's Go Direct spectrometers and supports
      Bluetooth or USB collection, allowing the same classroom workflow to move between
      native applications and a browser-based PWA.
  package-nerd-significance:
    - >
      The macOS cask packages a specialized scientific instrument client rather than a
      general plotting application. Its value lies in combining device communication,
      calibration, spectrum acquisition, and educational analysis workflows in one
      cross-platform tool.
    - >
      Version 5.0's PWA release is notable for managed laboratories because it offers a
      browser-delivered alternative to locally installed clients while retaining
      supported Web Bluetooth and WebUSB workflows.
  project-history:
    - >
      Spectral Analysis developed as Vernier's dedicated application for classroom
      spectroscopy and spectrophotometry, covering full spectra, Beer’s law experiments,
      reaction kinetics, fluorescence, and emission measurements.
    - >
      The application expanded across native desktop and mobile platforms. Version 5.0
      introduced its Progressive Web App and added multi-wavelength collection
      capabilities.
  related-projects:
    - Vernier Graphical Analysis handles general sensor data collection and graphing.
    - Vernier Instrumental Analysis supports other analytical instruments.
    - >
      The application works with Go Direct SpectroVis Plus, visible, UV-VIS,
      fluorescence/UV-VIS, and emissions spectrometers.
  sources:
    - https://turbo.vernier.com/sa-manual
    - https://www.vernier.com/downloads/
    - https://www.vernier.com/product/spectral-analysis/
    - https://www.vernier.com/support/sa4/
  summary:
    - >
      Vernier Spectral Analysis is a cross-platform educational application for
      collecting and analyzing absorbance, transmittance, fluorescence, and emission
      spectra from supported spectrometers.
  timeline:
    - '2024: The version 4.12 user manual documented the mature cross-platform application.'
    - >
      2024: Version 5.0 added multi-wavelength collection and the first Progressive Web
      App release.
  usage:
    - >
      Students connect a compatible spectrometer through Bluetooth or USB, choose a
      spectrum, Beer’s law, kinetics, fluorescence, or emission workflow, calibrate the
      instrument, and collect measurements.
    - >
      The application provides selection tools, curve fitting, interpolation,
      statistics, multiple-data-set plotting, and calculated columns for classroom
      analysis.
