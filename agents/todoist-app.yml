id: cask:todoist-app
display-name: Todoist
repo: null
docs:
  - https://www.todoist.com/help
config-file-location:
  macos:
    - ~/Library/Application Support/Todoist
    - ~/Library/Preferences/com.todoist.mac.Todoist
    - ~/Library/Containers/com.todoist.mac.Todoist
credentials-file-location: null
history:
  adoption-history:
    - >
      Todoist expanded from a student's personal tool into a cross-platform task manager
      used by tens of millions of people and teams, according to the company's official
      About page. The macOS client is also distributed through Homebrew Cask.
  package-nerd-significance:
    - >
      Todoist demonstrates Homebrew Cask's role in reproducible workstation setup: a
      mainstream hosted productivity client can be installed and maintained alongside
      developer tools.
  project-history:
    - >
      Todoist began when founder Amir Salihefendić, then a computer-science student,
      built a simple tool to organize his work and studies. The product and the company
      that became Doist grew together around that tool.
  related-projects:
    - Doist also developed Twist, an asynchronous team-communication product.
  sources:
    - 'Official About page: https://www.todoist.com/about-us'
    - 'Official Help Center: https://www.todoist.com/help'
    - >
      Official macOS uninstall article:
      https://www.todoist.com/help/todoist/troubleshooting/uninstall-todoist-for-macos-lbRQFrz5Y
    - source_facts.description; source_facts.package-manager
  summary:
    - Todoist is Doist's cross-platform task and project-management service and application.
  timeline:
    - 'Origins: Amir Salihefendić created Todoist while studying computer science.'
    - >
      2011: The company adopted remote and asynchronous work, according to its official
      About page.
    - 'Later adoption: Todoist grew to tens of millions of users and teams.'
  usage:
    - >
      People use Todoist to capture tasks, organize them into projects, assign dates and
      priorities, and collaborate across synchronized web, desktop, and mobile clients.
tags:
  - collaboration
  - macos
  - productivity
  - project-management
  - tasks
  - todo-list
provenance:
  category-sources:
    - >
      source_facts.description says "To-do list"; Todoist's official site describes a
      task-management tool.
  display-name-sources:
    - current_curation.display-name; official Todoist site and Help Center.
  docs-sources:
    - Official Todoist Help Center.
  history-sources:
    - 'Official About page: https://www.todoist.com/about-us'
    - 'Official Help Center: https://www.todoist.com/help'
    - >
      Official macOS uninstall article:
      https://www.todoist.com/help/todoist/troubleshooting/uninstall-todoist-for-macos-lbRQFrz5Y
    - source_facts.description; source_facts.package-manager
  repo-sources:
    - >
      source_facts.repo is empty; Todoist's official product and help surfaces do not
      identify an official public repository for the macOS client.
  tags-sources:
    - source_facts.description; official Todoist site and Help Center.
category-confidence: high
category-path:
