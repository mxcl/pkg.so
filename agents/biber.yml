id: brew:biber
display-name: Biber
repo: null
docs:
  - >
    https://sourceforge.net/projects/biblatex-biber/files/biblatex-biber/current/documentation/biber.pdf/download
  - https://biblatex-biber.sourceforge.net/
config-file-location:
  linux:
    - ./biber.conf
    - ~/.biber.conf
    - $XDG_CONFIG_HOME/biber/biber.conf
    - kpsewhich biber.conf
  macos:
    - ./biber.conf
    - ~/.biber.conf
    - $XDG_CONFIG_HOME/biber/biber.conf
    - ~/Library/biber/biber.conf
    - kpsewhich biber.conf
  windows:
    - ./biber.conf
    - '%APPDATA%\biber.conf'
    - kpsewhich biber.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Biber became a standard part of modern TeX workflows because biblatex users select
      it with the biblatex backend option and because TeX distributions package
      binaries, so most users install it through TeX Live, MacTeX, MiKTeX, or OS package
      managers rather than as a Perl application.
    - >
      The Homebrew, Debian, Ubuntu, Fedora, Arch, Nix, apk, and Scoop package records in
      the input show that Biber crossed from TeX distribution tooling into general
      system package-manager culture.
    - >
      Its adoption is driven by biblatex documents that need capabilities classic BibTeX
      cannot comfortably provide, especially multilingual bibliographies, UTF-8
      citekeys, custom sorting, source mapping, validation, and multiple bibliography
      sections.
  package-nerd-significance:
    - >
      Biber is a classic example of a package-manager-visible CLI whose real home is an
      ecosystem contract: the executable, biblatex macros, TeX engines, Unicode
      collation data, and .bcf/.bbl file formats all have to line up by version.
    - >
      It is one of the packages that exposes why TeX packaging is hard: upstream
      distributes Perl source and platform binaries, TeX Live and MiKTeX carry
      coordinated versions, and OS package managers must preserve compatibility with the
      matching biblatex release.
    - >
      The package is also a useful marker of the post-BibTeX era in TeX: installing
      biber means a LaTeX system is ready for modern bibliography features rather than
      just the original BibTeX pipeline.
  project-history:
    - >
      The upstream README describes Biber as a sophisticated bibliography processing
      backend for biblatex, written in Perl to provide customized data preparation for
      biblatex and maintained by Philip Kime after being originally conceived by
      Francois Charette.
    - >
      The release history shows an initial beta release in March 2009, rapid
      coordination with biblatex 0.9 in early 2010, and a first non-beta release as 0.6
      in November 2010.
    - >
      Biber's later history is tightly coupled to biblatex feature growth: the changelog
      records additions for XML-based .bcf communication, Unicode collation, XDATA,
      remote data sources, name templates, annotations, tool-mode output, and
      platform-specific binary distribution.
  related-projects:
    - biblatex is the front-end LaTeX package whose advanced bibliography model Biber serves.
    - >
      BibTeX is the older bibliography processor that Biber replaces in biblatex
      workflows when users need modern data-model and Unicode features.
    - >
      TeX Live, MacTeX, and MiKTeX are the main TeX distributions through which many
      users receive matching Biber binaries.
  sources:
    - https://biblatex-biber.sourceforge.net/
    - https://github.com/plk/biber/blob/dev/Changes
    - https://github.com/plk/biber/blob/dev/README.md
    - source_facts.package-manager
  summary:
    - >
      Biber is the Perl-based bibliography backend for biblatex, the LaTeX citation
      package that moved advanced bibliography work beyond classic BibTeX's fixed data
      model, 8-bit assumptions, and limited sorting model.
    - >
      For TeX package nerds, Biber matters because it is not just a replacement
      executable: it is the engine that lets biblatex expose Unicode-aware sorting,
      per-entry options, sourcemaps, validation, XDATA, related entries, and a richer
      BibLaTeX data model.
  timeline:
    - '2009-03-27: Biber 0.4 appears as the initial beta release.'
    - >
      2010-02-13: Biber 0.5 adds support for biblatex 0.9 and the XML-based .bcf
      control-file workflow.
    - '2010-11-20: Biber 0.6 is marked as the first non-beta release.'
    - '2018-10-30: Biber 2.12 adds support for newer biblatex annotation and sorting features.'
    - '2022-06: Biber 2.18 adds universal x86_64/ARM64 binary support.'
    - >
      2025-07: Biber 2.21 tightens collate-options handling after a code-injection
      vulnerability and discontinues 32-bit Windows support.
  usage:
    - >
      In normal use, LaTeX writes a .bcf control file through biblatex, Biber reads the
      .bcf and .bib data sources, and then writes the .bbl data consumed by the next
      LaTeX run.
    - >
      Biber can also be used in tool mode to transform bibliography data, inspect or
      validate data models, and produce BibTeX or other output formats, making it useful
      outside the final typesetting pass.
    - >
      Configuration can be supplied through biber.conf locations and through
      command-line options; most users encounter it indirectly through latexmk, arara,
      editor integrations, or TeX distribution build recipes.
related-packages:
  - id: brew:bib-tool
    reason: >
      Use BibTool to normalize, select, merge, or rewrite the .bib databases that Biber
      subsequently consumes through a biblatex document build.
    rel: adjacent_workflow
    sources:
      - https://www.gerd-neugebauer.de/software/TeX/BibTool/en
      - https://github.com/plk/biblatex/blob/dev/doc/latex/biblatex/biblatex-quickstart.tex
  - id: brew:bibutils
    reason: >
      Use bibutils to convert RIS, EndNote, PubMed, Word, or MODS records into BibTeX or
      BibLaTeX data before processing them with Biber.
    rel: adjacent_workflow
    sources:
      - https://sourceforge.net/p/bibutils/home/Bibutils/
      - https://github.com/plk/biber/blob/dev/README.md
