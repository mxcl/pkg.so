history:
  adoption-history:
    - >
      Io never became a mainstream application language, but it became memorable among
      programming-language enthusiasts because its tiny syntax exposes prototypes,
      messages, futures, actors, and code-as-data ideas directly. Its package-manager
      presence in Homebrew, MacPorts, and Nix reflects that role as a language runtime
      people install to explore or preserve a distinctive design.
    - >
      Adoption is best understood as educational and exploratory. Io is the kind of
      package that appears in language surveys, polyglot exercises, and prototype-object
      discussions because it shows a coherent alternative to class-based object systems
      and keyword-heavy syntax.
  package-nerd-significance:
    - >
      Io matters to package nerds because it preserves a compact, radical language
      design in executable form. It also has the classic packaging shape of a niche
      language runtime: VM, interpreter, standard library, historical native addons,
      documentation, tags, branches, and compatibility questions across Unix-like
      systems.
    - >
      Its significance is disproportionate to install counts. A package manager carrying
      Io lets users reproduce examples from programming-language books and discussions,
      inspect a prototype-based VM, and compare the packaging demands of small language
      runtimes against larger ecosystems.
  project-history:
    - >
      The official timeline says Steve Dekorte began Io in March 2002 as a minimal
      prototype-based language, with early public releases and a programming guide
      appearing through the Yahoo Group community shortly afterward. In its first year,
      Io gained actors, coroutines, incremental garbage collection, weak links,
      networking, and a quickly expanding addon system.
    - >
      Io entered programming-language culture through its compact object model and
      message-tree semantics. The official timeline records a Lua Workshop talk and an
      ACM Dynamic Languages Symposium presentation in 2005, then source-history moves
      from email patches to a public DARCS repository, git hosting, and GitHub.
    - >
      The project continued to evolve through build-system and runtime changes,
      including a CMake transition in 2010, Eerie package-manager work under the
      IoLanguage organization from 2017, and a later WebAssembly/WASI direction with
      JavaScript bridging. The Homebrew package is therefore attached to a language with
      a long experimental runtime history, not just a frozen curiosity.
  related-projects:
    - Self and Smalltalk are core influences on Io's object and message model.
    - NewtonScript, Act1, Lisp, and Lua are cited by the project as design influences.
    - Eerie is the related Io package manager recorded in the official timeline.
  sources:
    - https://github.com/IoLanguage/io
    - https://iolanguage.org/
    - https://iolanguage.org/Timeline/index.html
    - https://iolanguage.org/guide/guide.html
    - https://iolanguage.org/reference/index.html
  summary:
    - >
      Io is a small dynamic prototype-based programming language built around message
      passing, prototype objects, runtime-inspectable code, and a compact VM. Its
      official materials place it in the lineage of Smalltalk, Self, NewtonScript, Act1,
      Lisp, and Lua, with an emphasis on conceptual unification rather than surface
      syntax.
  timeline:
    - '2002-03: Steve Dekorte begins work on Io.'
    - >
      2002-04: Early public releases and a programming guide appear through the early
      community.
    - '2005-07: Io is presented at the Lua Workshop.'
    - '2005-10: Io is presented at the ACM Dynamic Languages Symposium.'
    - '2007-03: Source history moves from DARCS to git.'
    - '2008-02: The Io repository appears on GitHub.'
    - '2010-05: The build moves to CMake.'
    - '2017-11: Eerie package-manager work is rewritten under the IoLanguage organization.'
    - >
      2026: WASM/WASI work, stackless evaluation, resumable exceptions, and JavaScript
      bridging are recorded in the official timeline.
  usage:
    - >
      Users run the `io` interpreter or build the runtime to experiment with message
      sends, prototype cloning, slots, blocks, addons, and concurrency constructs. The
      official guide and reference are central because the language's unusual semantics
      are easier to understand through examples than through command flags alone.
