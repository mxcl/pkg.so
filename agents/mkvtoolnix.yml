history:
  project-history:
    - >
      The suite is centered on command-line tools that map to common container
      workflows. mkvmerge joins streams from media files into a Matroska file; mkvinfo
      reports track and element information; mkvextract extracts tracks and data to
      other formats; and mkvpropedit edits header, chapter, and attachment properties
      without remuxing. MKVToolNix GUI sits on top of those command-line tools for users
      who prefer a graphical workflow.
  sources:
    - https://mkvtoolnix.download/
    - https://mkvtoolnix.download/doc/mkvmerge.html
    - https://mkvtoolnix.download/downloads.html
    - https://www.matroska.org/downloads/mkvtoolnix.html
  summary:
    - >
      MKVToolNix is Moritz Bunkus's long-running suite for Matroska media containers.
      The project site says the Matroska libraries and Bunkus's Matroska tools became
      officially available on May 1, 2003, and describes MKVToolNix as tools for
      creating, altering, and inspecting Matroska files on Linux, other Unix systems,
      and Windows. Matroska.org calls it the de-facto reference implementation of a
      Matroska multiplexer.
  usage:
    - >
      Its ecosystem role is broader than most MKV-related packages in this batch. Tools
      such as mkvdts2ac3 and mkvtomp4 depend on MKVToolNix for Matroska inspection or
      remuxing, while mkvalidator handles conformance checking beside it. Distribution
      support spans Homebrew, Chocolatey, Debian/Ubuntu, Fedora, MacPorts, Nix, Scoop,
      Winget, SUSE, and Alpine in the input record, matching its role as the standard
      packaging target for Matroska muxing and editing.
related-packages:
  - id: brew:mkvdts2ac3
    reason: >
      mkvdts2ac3 uses MKVToolNix's inspection, extraction, and remuxing commands to
      replace or supplement DTS audio with AC-3.
    rel: adjacent_workflow
    sources:
      - https://github.com/JakeWharton/mkvdts2ac3#readme
      - https://mkvtoolnix.download/doc/README.md
  - id: brew:mkvtomp4
    reason: >
      mkvtomp4 uses MKVToolNix for the Matroska side of its no-video-reencode MKV-to-MP4
      workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/gavinbeatty/mkvtomp4#readme
      - https://mkvtoolnix.download/doc/README.md
