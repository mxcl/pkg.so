id: brew:commitlint
display-name: commitlint
repo: https://github.com/conventional-changelog/commitlint
docs:
  - https://commitlint.js.org/
config-file-location:
  unix:
    - ./commitlint.config.js
    - ./commitlint.config.cjs
    - ./commitlint.config.mjs
    - ./commitlint.config.ts
    - ./commitlint.config.cts
    - ./commitlint.config.mts
    - ./.commitlintrc
    - ./.commitlintrc.json
    - ./.commitlintrc.yaml
    - ./.commitlintrc.yml
    - ./.commitlintrc.js
    - ./.commitlintrc.cjs
    - ./.commitlintrc.mjs
    - ./.commitlintrc.ts
    - ./.commitlintrc.cts
    - ./.commitlintrc.mts
    - ./package.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The npm package history for `@commitlint/cli` dates to 2017. The official README
      describes commitlint as stable and used in various projects, with setup paths for
      local Git hooks and CI. The project also documents shareable npm configurations,
      which made commit rules reusable across JavaScript monorepos and organizations.
  package-nerd-significance:
    - >
      For package maintainers, commitlint matters because it turns release-note and
      versioning conventions into a lintable contract. It is often paired with
      conventional-changelog, release automation, and Commitizen-style prompts.
  project-history:
    - >
      The project is part of the conventional-changelog GitHub organization and presents
      itself as the linting half of the Conventional Commits workflow. Its README
      describes three core package-culture concerns: being a good Commitizen companion,
      sharing configuration through npm, and integrating with conventional-changelog.
  related-projects:
    - >
      commitlint is closely related to Conventional Commits, conventional-changelog,
      Commitizen, Husky, and npm shareable configuration packages.
  sources:
    - https://commitlint.js.org/
    - https://github.com/conventional-changelog/commitlint
    - https://raw.githubusercontent.com/conventional-changelog/commitlint/master/README.md
    - https://registry.npmjs.org/@commitlint%2Fcli
  summary:
    - >
      commitlint is a Node.js CLI and library family for checking commit messages
      against a convention, most commonly Conventional Commits.
  timeline:
    - '2017: npm records public `@commitlint/cli` releases.'
    - '2020s: Official docs describe local-hook, CI, shared-config, and prompt workflows.'
    - '2026: npm continues to publish 21.x releases.'
  usage:
    - >
      commitlint is usually run as a commit-msg hook through tools such as Husky, or in
      CI against commit ranges. Its configuration files and package.json field make it
      fit naturally into Node package workflows.
related-packages:
  - id: brew:commitizen
    reason: >
      Choose Commitizen when contributors need guided commit creation together with
      version bumping and changelog generation; choose commitlint for focused, highly
      configurable validation in Node-based hooks and CI.
    rel: alternative
    sources:
      - https://commitlint.js.org/reference/prompt.html
      - https://commitlint.js.org/reference/configuration.html
      - https://commitizen-tools.github.io/commitizen/
      - https://commitizen-tools.github.io/commitizen/commands/bump/
tags:
  - cli
  - commit-messages
  - conventional-commits
  - git
  - linting
geiger:
