config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dpic's adoption is specialized: it serves users of pic-style diagram source who
      want output for LaTeX picture, pict2e, TikZ-pgf, PSTricks, MetaPost, SVG, xfig,
      PDF, and PostScript workflows. Its packaging in Homebrew, Debian/Ubuntu, Nix, and
      openSUSE reflects a small but durable technical-documentation niche.
  package-nerd-significance:
    - >
      dpic is package-nerd significant because it keeps an old Unix documentation
      language useful in modern TeX and web-output pipelines. It is also a nice example
      of a tiny compiler-like tool whose packaging value is mostly compatibility: if a
      document build expects pic-derived diagrams, the right dpic backend matters more
      than novelty.
  project-history:
    - >
      The official README describes dpic as an implementation of pic for creating line
      drawings and illustrations for documents, web pages, and other uses. The official
      distribution page points to source downloads and a GitLab repository, with the
      2025.08.01 source date visible on the page.
    - >
      The CHANGES file shows a major 2019 source-distribution shift: the previous
      distribution included compilable C code together with original Pascal source,
      while the newer package includes C source only with parsing automated by GNU
      bison. The note says the Pascal had been translated to C with p2c and that the
      change was intended to keep correct-input behavior functionally identical.
  related-projects:
    - >
      dpic is related to GNU pic/gpic, TeX and LaTeX picture workflows, pict2e,
      TikZ-pgf, PSTricks, mfpic, MetaPost, SVG, xfig, GNU bison, and the older p2c
      translation path mentioned in CHANGES.
  sources:
    - >
      https://ece.uwaterloo.ca/~aplevich/dpic/ - official distribution page for source
      date, repository, downloads, and manual.
    - >
      https://ece.uwaterloo.ca/~aplevich/dpic/README - official README for purpose,
      usage, output formats, safe mode, and version model.
    - >
      https://ece.uwaterloo.ca/~aplevich/dpic/CHANGES - official change history for
      2019-2025 project milestones.
    - https://gitlab.com/api/v4/projects/aplevich%2Fdpic - official GitLab project metadata.
  summary:
    - >
      dpic is J. D. Aplevich's implementation of the pic little language for line
      drawings and technical illustrations, with output backends for TeX-adjacent and
      graphics formats.
  timeline:
    - '2018: GitLab project metadata records the dpic repository creation.'
    - >
      2019: Major source-distribution change moved to C-only source with parsing
      automated by GNU bison.
    - >
      2020-2024: CHANGES records portability, SVG, robustness, arrowhead, and
      text-offset fixes.
    - '2025: Official distribution page lists source downloads for 2025.08.01.'
  usage:
    - >
      Users pass an input file to dpic and redirect the selected output format, for
      example dpic -p quick.pic > quick.tex for PSTricks or dpic -g quick.pic >
      quick.tex for TikZ-pgf. The -z safe mode disables sh and copy behavior.
related-packages:
  - id: brew:groff
    reason: >
      GNU groff supplies gpic, the documented alternative pic interpreter; choose it for
      an integrated troff pipeline, while dpic is preferable when direct TikZ, PSTricks,
      SVG, PDF, MetaPost, or xfig output is needed.
    rel: alternative
    sources:
      - https://ece.uwaterloo.ca/~aplevich/dpic/dpic-doc.pdf
      - https://www.gnu.org/software/groff/manual/groff.html
