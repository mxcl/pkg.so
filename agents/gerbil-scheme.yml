history:
  adoption-history:
    - >
      Gerbil occupies a specialized place in the Scheme ecosystem: it appeals to
      programmers who want Scheme syntax and macros while keeping access to native
      compilation, FFI-oriented systems work, packages, networking libraries, and
      command-line tooling.
  package-nerd-significance:
    - >
      For package-manager users, Gerbil is notable because it packages an entire
      language stack rather than a single executable. Installing it through Homebrew,
      MacPorts, or Nix gives Scheme users a repeatable way to obtain the interpreter,
      compiler, package tooling, and supporting runtime.
  project-history:
    - >
      The Gerbil README traces the language to Dimitris Vyzovitis, also known as vyzo,
      who kept Gerbil as a private Scheme for many years. It evolved from shared macros
      across implementations into a PLT-style macro language for actor-oriented
      distributed programming before being released with a source-based bootstrap.
    - >
      The public implementation standardized on Gambit because the maintainer considered
      it a portable, performant, low-level Scheme kernel. The repository metadata
      records the public GitHub project opening in 2016, while the README copyright
      notice covers work from 2007 through 2023.
  related-projects:
    - Gambit Scheme, Racket, Chibi, SRFI 115, SRFI 159
  sources:
    - https://api.github.com/repos/mighty-gerbils/gerbil
    - https://cons.io/guide
    - https://cons.io/reference
    - https://github.com/mighty-gerbils/gerbil
    - https://raw.githubusercontent.com/mighty-gerbils/gerbil/master/README.md
  summary:
    - >
      Gerbil Scheme is an opinionated Scheme dialect for systems programming, built on
      the Gambit runtime and compiler. It combines a macro system, a module system,
      ahead-of-time compilation, and a broad standard library for developers who want a
      Scheme environment with practical systems tooling.
  timeline:
    - >
      2007: The README copyright range begins for Gerbil work by Dimitris Vyzovitis and
      contributors.
    - '2016: The public GitHub repository was opened.'
    - 'After private development: Gerbil was released with a source-based bootstrap on Gambit.'
  usage:
    - >
      Users interact with Gerbil through tools such as `gxi` for the interpreter and
      `gxc` for compilation. Practitioners build modules, compile programs ahead of time
      through Gambit, use the standard library, and manage Gerbil projects through the
      included command-line tools.
related-packages:
  - id: brew:gambit-scheme
    reason: >
      Choose standalone Gambit Scheme when you want the lower-level compiler and runtime
      directly; choose Gerbil when you want its additional macro, module, package, and
      standard-library environment.
    rel: alternative
    sources:
      - https://github.com/mighty-gerbils/gerbil#readme
      - https://gambitscheme.org/
