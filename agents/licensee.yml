history:
  adoption-history:
    - >
      Licensee is distributed as a Ruby gem and can also be run from its official Docker
      image. The supplied package metadata records availability through both Homebrew
      and Nix.
  package-nerd-significance:
    - >
      Licensee turns a normally manual packaging concern—identifying the license
      actually represented by a project's files—into repeatable CLI or library output.
      Its stable JSON mode is especially useful in package audits and automated metadata
      pipelines.
  project-history:
    - >
      Licensee originated as a Ruby project for detecting the license under which
      software is distributed. Its matching strategy grew around recognizable license
      files, exact normalized matches, and similarity matching against known license
      texts; it also uses license metadata maintained by Choose a License and
      SPDX-oriented conventions.
  related-projects:
    - Choose a License supplies crowdsourced license content and metadata used by Licensee.
    - >
      SPDX identifiers and REUSE-style LICENSES directories are related standards and
      conventions recognized by its matching workflow.
  sources:
    - https://github.com/licensee/licensee
    - https://licensee.github.io/licensee/
    - https://licensee.github.io/licensee/command-line-usage/
    - https://licensee.github.io/licensee/what-we-look-at/
    - source_facts.package-manager
  summary:
    - >
      Licensee is a Ruby library and command-line utility for identifying a project's
      license from its repository contents. It can inspect local paths, individual
      files, and remote GitHub repositories.
  timeline:
    - >
      2014: The project's documented copyright history identifies Licensee as an
      established open-source license-detection project by this period.
    - >
      2026: The official release series reached version 10, reflecting continued
      maintenance of its matchers and license corpus.
  usage:
    - >
      Users commonly run `licensee detect` against a source tree, license file, or
      GitHub repository. It supports human-readable output and a more stable JSON form
      for automation.
    - >
      An `OCTOKIT_ACCESS_TOKEN` environment variable can be supplied when scanning
      private GitHub repositories or avoiding API rate limits; the official
      documentation does not identify a credentials file.
