history:
  adoption-history:
    - >
      PDF Technologies reports more than 90 million worldwide downloads and says PDF
      Reader Pro has remained among leading PDF applications in app-store rankings.
      These are first-party adoption claims.
    - >
      The product expanded from Apple's platforms to Windows and Android, positioning
      one PDF workflow across desktop and mobile systems.
  package-nerd-significance:
    - >
      PDF Reader Pro represents the large commercial PDF-suite category available
      through desktop package managers: a single install covers viewing, annotation,
      conversion, OCR, forms, signing, redaction, security, and page manipulation. Its
      longevity and cross-platform expansion make it notable among proprietary
      alternatives to Adobe Acrobat.
  project-history:
    - >
      PDF Technologies was established in 2013 and launched PDF Reader Pro in the App
      Store in 2014. A directly distributed DMG edition and online store followed in
      2018.
    - >
      The company began upgrading the product's underlying library in 2020, redesigned
      its user experience and launched a Windows version in 2021, then broadened its
      business offerings after creating the related ComPDF technology line in 2022.
    - >
      PDF Reader Pro subsequently expanded across macOS, Windows, iOS, and Android and
      added AI-assisted document workflows alongside its established PDF editing
      toolkit.
  related-projects:
    - PDF Technologies also develops the ComPDF SDK and AI products.
    - >
      LynxPDF is the company's related enterprise PDF solution, offering offline
      deployment, self-hosting, batch processing, and single sign-on.
  sources:
    - 'Official Help Center: https://www.pdfreaderpro.com/help'
    - >
      Official Mac Quick Start Guide:
      https://www.pdfreaderpro.com/downloads/Quick%20Start%20Guide%20Mac.pdf
    - 'Official company history: https://www.pdfreaderpro.com/about'
    - 'Official product page: https://www.pdfreaderpro.com/product'
  summary:
    - >
      PDF Reader Pro is a proprietary cross-platform PDF reader and editor from PDF
      Technologies, Inc. It combines reading, annotation, editing, conversion, OCR,
      forms, signing, redaction, organization, and document-protection tools.
  timeline:
    - '2013: PDF Technologies was established.'
    - '2014: PDF Reader Pro launched in the App Store.'
    - '2018: The online store opened and a directly distributed DMG edition was released.'
    - '2020: Work began on upgrading the underlying library.'
    - '2021: The product received a UX redesign and launched on Windows.'
    - '2022: The related ComPDF technology line was created.'
    - '2023: The company expanded its business-oriented offerings.'
  usage:
    - >
      Users open PDFs to read, search, annotate, edit text and images, fill forms,
      create signatures, redact content, perform OCR, or convert documents to formats
      such as Word, Excel, PowerPoint, images, and text.
    - >
      Page-management tools support inserting, replacing, extracting, splitting,
      reversing, copying, rotating, and deleting pages. Additional tools cover merging,
      compression, watermarks, headers and footers, Bates numbering, and password
      protection.
