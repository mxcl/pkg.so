id: brew:gnu-tar
display-name: GNU tar
repo: https://git.savannah.gnu.org/cgit/tar.git
docs:
  - https://www.gnu.org/software/tar/manual/html_node
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      tar began as a tape archiver, but GNU tar helped make tar archives a routine
      interchange format for free software. The GNU manual explicitly notes that the GNU
      Project distributes software bundled into tar archives so related files can move
      as a single unit, a practice that made tarballs central to source distribution and
      package building.
  package-nerd-significance:
    - >
      GNU tar is package-nerd bedrock: release artifacts, distro build recipes,
      reproducible archives, vendor source bundles, and backup scripts all depend on tar
      behavior. Details such as pax headers, sparse files, compression integration, path
      handling, and incremental metadata are small options with large consequences for
      reproducibility and restore safety.
  project-history:
    - >
      The GNU tar README says GNU tar is derived from John Gilmore's public-domain tar.
      The GNU tar manual credits John Gilmore as the original author, Jay Fenlason and
      Joy Kendall for GNU enhancements, and later maintenance by Thomas Bushnell, n/BSG,
      Francois Pinard, Paul Eggert, and Sergey Poznyakoff with many contributors.
    - >
      GNU tar development also reflects the long evolution of archive formats and
      recovery needs. The manual notes that active development and maintenance resumed
      after the project was put on CVS at Savannah in July 2003, and it credits Sergey
      Poznyakoff with POSIX archive support.
  related-projects:
    - >
      GNU tar is tightly related to gzip, bzip2, xz, cpio, rmt, POSIX pax archives,
      source-release tooling, and package-manager build systems.
  sources:
    - https://git.savannah.gnu.org/cgit/tar.git/plain/NEWS
    - https://git.savannah.gnu.org/cgit/tar.git/plain/README
    - https://www.gnu.org/software/tar/
    - https://www.gnu.org/software/tar/manual/html_node/Authors.html
    - https://www.gnu.org/software/tar/manual/html_node/Incremental-Dumps.html
    - https://www.gnu.org/software/tar/manual/html_node/What-tar-Does.html
  summary:
    - >
      GNU tar is the GNU archiving program for creating, listing, updating, and
      extracting tar archives. It is one of the package ecosystem's foundational tools
      because source releases, backups, and portable file bundles often travel as tar
      archives.
  timeline:
    - >
      1980s: GNU tar grew from John Gilmore's public-domain tar into a GNU-maintained
      archiver.
    - '2003: GNU tar was put on CVS at Savannah and active maintenance resumed.'
    - '2021: Version 1.34 notes record extraction and permission-handling fixes.'
    - '2023: Version 1.35 notes include compatibility and backup-related fixes.'
    - >
      2026: Git NEWS for 1.35.90 describes reproducibility work, extraction safety
      fixes, and performance improvements.
  usage:
    - >
      Practitioners use GNU tar to create and extract source tarballs, preserve
      directory trees, list archive contents, append or update members, stream archives
      through pipes, and combine archiving with compression tools. System administrators
      also use GNU tar for full and incremental backups, including snapshot-file
      workflows with --listed-incremental.
related-packages:
  - id: brew:libarchive
    reason: >
      Choose libarchive when you need a reusable multi-format library or its bsdtar
      implementation rather than GNU tar's GNU-focused command-line behavior.
    rel: alternative
    sources:
      - https://github.com/libarchive/libarchive
      - https://www.gnu.org/software/tar/manual/tar.html
  - id: brew:gzip
    reason: >
      GNU tar invokes gzip with -z to create or read the widely supported .tar.gz
      format, and GNU gzip explicitly describes itself as tar's compression complement.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/tar/manual/html_node/gzip.html
      - https://www.gnu.org/software/gzip/manual/gzip.html
  - id: brew:xz
    reason: >
      GNU tar invokes XZ with -J and recognizes .tar.xz archives, pairing tar's archive
      structure with XZ compression.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/tar/manual/html_node/gzip.html
      - https://tukaani.org/xz/
  - id: brew:bzip2
    reason: >
      GNU tar invokes bzip2 with -j and recognizes .tar.bz2 archives for established
      bzip2-compressed source and backup workflows.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/tar/manual/html_node/gzip.html
      - https://sourceware.org/bzip2/
