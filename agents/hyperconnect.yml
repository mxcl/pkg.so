history:
  adoption-history:
    - >
      Xiaomi expanded HyperConnect from coordination within its own phone, tablet,
      computer, wearable, vehicle, and smart-home ecosystem to cross-ecosystem
      compatibility. Official HyperOS 2 material promotes an Apple-device client for
      file transfer and Home screen+ on Mac, while the mainland-China documentation
      covers iPhone, iPad, and Mac interoperability.
  package-nerd-significance:
    - >
      The macOS package is the desktop endpoint of a vendor ecosystem rather than a
      standalone file-transfer tool. It is notable because it brings Xiaomi's continuity
      layer to Apple hardware, with capability depending on device models,
      operating-system versions, region, network state, and the Xiaomi account shared by
      participating devices.
  project-history:
    - >
      Xiaomi unveiled HyperConnect as the self-developed cross-device connectivity
      framework within Xiaomi HyperOS, the operating-system initiative announced in
      2023.
    - >
      In October 2024, Xiaomi introduced HyperOS 2 with HyperConnect positioned
      alongside HyperCore and HyperAI as one of its three core technology groups.
      Subsequent HyperOS material expanded cross-ecosystem support, including Xiaomi
      Interconnectivity Services for Apple devices.
  related-projects:
    - 'Xiaomi HyperOS: The operating-system platform that incorporates HyperConnect.'
    - >
      Xiaomi Interconnectivity Services / 小米互联服务: The Apple-platform client represented
      by this package.
    - >
      Xiaomi PC Manager: The Windows and Xiaomi-notebook counterpart for supported
      continuity features.
    - "Home screen+: Xiaomi's cross-screen phone interaction feature."
  sources:
    - >
      Xiaomi 2023 annual report:
      https://ir.mi.com/static-files/12ee7d1f-a38f-49e5-b088-f1d376c6dc76
    - >
      Xiaomi 2024 third-quarter announcement:
      https://ir.mi.com/system/files-encrypted/nasdaq_kms/assets/2024/11/18/5-32-31/24Q3_Announcement.pdf
    - >
      Xiaomi Apple-device interoperability guide:
      https://hyperos.mi.com/continuity/abilities/ab0016
    - 'Xiaomi HyperConnect overview: https://hyperos.mi.com/continuity'
    - 'Xiaomi HyperOS 2 overview: https://www.mi.com/global/hyperos'
  summary:
    - >
      Xiaomi HyperConnect is Xiaomi's cross-device continuity framework. Its macOS
      client connects supported Apple computers with Xiaomi devices for functions such
      as file transfer, notification or content continuity, and cross-screen
      interaction.
  timeline:
    - '2023: Xiaomi unveiled HyperOS and its HyperConnect cross-device framework.'
    - >
      2024: Xiaomi introduced HyperOS 2 in October with HyperConnect as a core
      technology group.
    - >
      2025: Xiaomi's global HyperOS 2 rollout promoted Apple-device connectivity through
      Xiaomi Interconnectivity Services.
  usage:
    - >
      Install Xiaomi Interconnectivity Services on the Mac, enable Bluetooth, sign in
      with the same Xiaomi account used on the supported Xiaomi phone, and place the
      devices on the same network or hotspot. Available functions vary by device, system
      version, region, and client version.
