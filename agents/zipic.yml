history:
  adoption-history:
    - >
      Zipic is distributed as a native macOS application and is installable through
      Homebrew Cask as zipic. Its documentation also describes integrations with
      Raycast, Shortcuts, App Intents, URL schemes, and shell automation.
  package-nerd-significance:
    - >
      Zipic is notable to package users as a GUI-first image optimizer that also exposes
      automation surfaces. The built-in command-line client added in version 1.9.5 lets
      scripts and CI jobs reuse the desktop application's presets, compression pipeline,
      and license state.
  project-history:
    - >
      Zipic was developed as a native macOS image-compression and conversion application
      emphasizing local processing. Its documented feature set grew to include batch
      processing, presets, folder monitoring, clipboard workflows, and automation
      integrations.
    - >
      Version 1.9.5 introduced the built-in zipic command-line client, extending the
      application from interactive desktop use into scripts, CI pipelines, and
      agent-driven workflows.
  related-projects:
    - >
      Official integrations include Raycast, macOS Shortcuts, App Intents, and the Zipic
      agent skill.
  sources:
    - https://docs.zipic.app/
    - https://docs.zipic.app/ai/overview/
    - https://docs.zipic.app/guides/image-compression-basic/
    - source_facts.package-manager
  summary:
    - >
      Zipic is a native macOS application for local image compression, conversion, and
      workflow automation.
  timeline:
    - '1.9.5: Zipic introduced its built-in command-line client.'
    - '1.10.0: The supplied package facts identify this release artifact.'
  usage:
    - >
      Users can compress or convert individual images and folders through drag and drop,
      Finder, the menu bar, clipboard handling, folder monitoring, or Raycast. The
      optional zipic command can drive presets and batch operations from scripts while
      the desktop application is running.
