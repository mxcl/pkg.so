history:
  adoption-history:
    - >
      duf's README documents packaging across Arch, Debian and Ubuntu, Fedora, Nix,
      Void, Gentoo, Solus, FreeBSD, OpenBSD, Homebrew, MacPorts, Chocolatey, Scoop, and
      Termux. Its broad package-manager footprint and GitHub popularity made it a common
      recommendation in terminal-tool lists.
  package-nerd-significance:
    - >
      duf is package-nerd shorthand for the wave of polished, single-purpose Go and Rust
      replacements for classic Unix commands. It keeps df's job but adds terminal-aware
      output and packaging for every major desktop and server environment.
  project-history:
    - >
      The public release series started in September 2020 and moved quickly through
      several 0.x releases. The README positions duf as a better df alternative for
      Linux, BSD, macOS, and Windows, with color, sorting, grouping, filtering, and JSON
      output.
    - >
      Later releases kept the same core shape instead of expanding into a full disk
      analyzer. That stable scope is part of its appeal: it modernizes the one command
      people already know without replacing larger tools such as ncdu.
  related-projects:
    - df is the direct command-line ancestor and comparison point.
    - >
      ncdu is adjacent in disk-usage inspection, but duf focuses on mounted filesystem
      summaries rather than interactive directory analysis.
    - Other modern CLI rewrites, such as dust and dua-cli, occupy nearby disk-usage territory.
  sources:
    - https://github.com/muesli/duf
    - https://api.github.com/repos/muesli/duf/releases?per_page=100
    - https://formulae.brew.sh/formula/duf
  summary:
    - >
      duf, short for Disk Usage/Free Utility, is a Go-based replacement for df that
      presents disk and inode usage in a friendlier terminal table. It became one of the
      recognizable modern Unix-tool rewrites: small scope, nicer defaults, JSON output,
      and cross-platform packages.
  timeline:
    - '2020: v0.1.0 published and the project entered a rapid early release cycle.'
    - '2021: 0.6.x releases continued cross-platform packaging.'
    - '2022: v0.8.x shipped as the project matured.'
    - '2025: v0.9.x releases refreshed the package after a quieter period.'
  usage:
    - >
      Typical use is simply running duf to inspect mounted filesystems, then adding
      filters for mount points, filesystem types, table groups, columns, or sorting.
      JSON output makes it useful in scripts and monitoring checks where df's human
      output is awkward.
