      Official repository README describes Morphe Desktop as a CLI and GUI application
      that patches Android apps.
    - source_facts.description identifies a desktop and CLI tool for patching Android apps.
  display-name-sources:
    - 'Official repository README title: Morphe Desktop.'
  docs-sources:
    - Official repository README links to docs/documentation.md as the complete documentation.
  history-sources:
    - https://github.com/MorpheApp/morphe-desktop
    - https://github.com/MorpheApp/morphe-desktop/blob/main/docs/documentation.md
    - source_facts.package-manager.brew
  repo-sources:
    - source_facts.repo is already populated; returned null as required.
  tags-sources:
