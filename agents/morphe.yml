id: brew:morphe
display-name: Morphe Desktop
repo: null
docs:
  - https://github.com/MorpheApp/morphe-desktop/blob/main/docs/documentation.md
config-file-location:
  unix:
    - $MORPHE_DATA_DIR/config.json
    - <JAR directory>/morphe-data/config.json
    - ~/morphe/config.json
credentials-file-location:
  unix:
    - $MORPHE_DATA_DIR/morphe.keystore
    - <JAR directory>/morphe-data/morphe.keystore
    - ~/morphe/morphe.keystore
history:
  adoption-history:
    - >
      Morphe is distributed as the Homebrew formula `morphe`; the official project also
      publishes a runnable JAR for GUI and CLI use.
  package-nerd-significance:
    - >
      Morphe packages an Android patching workflow into both an approachable desktop
      interface and an automation-friendly CLI. Its shared data directory keeps patch
      bundles, logs, temporary files, GUI libraries, preferences, and the default
      signing key together.
  project-history:
    - >
      Morphe Desktop was developed by the Morphe team as a GUI and command-line front
      end to Morphe Patcher. Its CLI acknowledges prior work by ReVanced, while the GUI
      is described as Morphe-developed.
  related-projects:
    - Morphe Patcher provides the underlying patching machinery.
    - Morphe Patches supplies the project's official patch bundles.
    - ReVanced is credited as prior work for the CLI.
  sources:
    - https://github.com/MorpheApp/morphe-desktop
    - https://github.com/MorpheApp/morphe-desktop/blob/main/docs/documentation.md
    - source_facts.package-manager.brew
  summary:
    - >
      Morphe Desktop is an open-source GUI and CLI for applying Morphe patches to
      Android APK-family packages and optionally installing the result through ADB.
  timeline:
    - >
      The project evolved from a command-line patching workflow into a combined GUI and
      CLI maintained by the Morphe team.
  usage:
    - >
      Users provide an APK or app bundle and a Morphe patch bundle, select or configure
      patches, then produce a patched application. The CLI supports repeatable
      automation through commands, flags, and JSON patch-option files.
tags:
  - adb
  - android
  - apk
  - app-patching
  - automation
  - cli
  - desktop-gui
  - java
provenance:
  category-sources:
