history:
  adoption-history:
    - >
      httping has remained a small systems utility, but the batch input records
      packaging across Homebrew, Debian, Fedora, MacPorts, Nix, Arch, Scoop, and Ubuntu.
      The author page also documents FreeBSD ports usage and 2006 Linux magazine
      coverage.
  package-nerd-significance:
    - >
      httping is package-nerd bait because it is exactly the kind of tiny Unix tool that
      fills one missing measurement: not a crawler, not a benchmark suite, just repeated
      HTTP request timing that packages cleanly on many systems.
  project-history:
    - >
      Folkert van Heusden's project page presents httping as `ping` for HTTP requests
      and carries an older changelog covering early 0.x and 1.x work. That changelog
      shows the tool growing from basic request timing into SSL support, status-code
      reporting, Nagios plugin use, transfer-speed display, OpenBSD compilation,
      authentication, cookies, IPv6, and persistent connections.
    - >
      The GitHub repository later became the download and source home. Its README
      documents a CMake build with optional OpenSSL, ncurses TUI, FFTW3 performance
      graphics, and gettext support, while repository tags show later v2.x through v4.x
      releases.
  related-projects:
    - >
      Related tools include `ping`, curl timing, Nagios HTTP checks, ApacheBench, and
      MultiTail, which the author page mentions as a companion for watching output in a
      separate log view.
  sources:
    - https://api.github.com/repos/folkertvanheusden/HTTPing
    - https://api.github.com/repos/folkertvanheusden/HTTPing/tags
    - https://github.com/folkertvanheusden/HTTPing
    - https://raw.githubusercontent.com/folkertvanheusden/HTTPing/master/README.md
    - https://www.vanheusden.com/httping/
  summary:
    - >
      httping is a ping-like utility for HTTP URLs. Instead of measuring ICMP
      reachability, it times the HTTP path: connect, send a request, and retrieve the
      reply headers.
  timeline:
    - '0.0.9: SSL support was added according to the author changelog.'
    - '1.0.0: OpenBSD compilation support was added according to the author changelog.'
    - '1.4.0: IPv6 support was added according to the author changelog.'
    - '2006: Linux Magazin and Linux Magazine coverage was listed on the author page.'
    - '2021: The public GitHub repository was created.'
    - '2022: Git tag v2.9 was created.'
    - '2025: Git tag v4.4.0 was created.'
  usage:
    - >
      The practical use case is checking HTTP latency and behavior from the command
      line, especially where ICMP ping is blocked or irrelevant. The project page
      includes a Nagios command example, and the README's optional TLS and TUI features
      show its fit for monitoring and terminal diagnostics.
related-packages:
  - id: brew:httptap
    reason: >
      Choose httptap for a one-request DNS/TCP/TLS/TTFB waterfall and structured
      exports; choose httping for repeated ping-like HTTP latency checks and
      Nagios-style monitoring.
    rel: alternative
    sources:
      - https://www.vanheusden.com/httping/
      - https://docs.httptap.dev/
  - id: brew:multitail
    reason: >
      The httping author specifically recommends MultiTail for watching log files while
      displaying httping output in a separate window.
    rel: adjacent_workflow
    sources:
      - https://www.vanheusden.com/httping/
      - https://www.vanheusden.com/multitail/links.html
