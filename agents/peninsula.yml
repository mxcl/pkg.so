history:
  adoption-history:
    - >
      Peninsula is distributed as a macOS application and through the Homebrew cask
      ecosystem. Its official installation instructions also provide signed release
      archives through GitHub Releases.
  package-nerd-significance:
    - >
      Peninsula belongs to the macOS utility tradition of replacing or augmenting
      built-in interface behavior. It combines ideas normally supplied by separate
      window switchers, notch utilities, notification helpers, and temporary file
      shelves in one open-source application.
  project-history:
    - >
      Peninsula was created as an open-source, Dynamic-Island-style utility for notched
      Macs. Its README credits AltTab for part of its window-switching implementation
      and NotchDrop for part of its notch interface, placing it within a recognizable
      family of community-built macOS interface tools.
  related-projects:
    - AltTab for macOS
    - NotchDrop
    - Doll
  sources:
    - Homebrew distribution is recorded in source_facts.package-manager.
    - 'Official repository and README: https://github.com/Celve/Peninsula'
  summary:
    - >
      Peninsula is an open-source macOS notch utility focused on application and window
      switching, notifications, timers, and temporary file storage.
  timeline:
    - The official sources reviewed do not document a reliable first-release date.
  usage:
    - >
      Users grant Accessibility permission so Peninsula can inspect applications and
      notification counts. It can replace the standard Command-Tab switcher, provide
      searchable window switching, show selected notification applications around the
      notch, hold temporary files, and run timers. Most customization is performed
      through the application's Settings interface.
