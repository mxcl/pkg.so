history:
  adoption-history:
    - >
      Trailer developed into a family of GitHub clients spanning macOS, iOS,
      command-line, and Android environments. Homebrew Cask provides a package-manager
      installation route for its macOS client.
  package-nerd-significance:
    - >
      Trailer is a durable example of a focused native developer utility: it converts
      GitHub review activity into ambient desktop notifications and can be installed
      reproducibly alongside other macOS development tools.
  project-history:
    - >
      Trailer is an open-source application by Paul Tsochantaris for monitoring GitHub
      and GitHub Enterprise pull requests, issues, comments, merges, and status changes.
      Copyright notices in its official repository date the codebase to 2013–2014.
    - >
      The project later began separating reusable functionality into Swift packages
      including TrailerQL, TrailerJson, Lista, Semalot, KeyVine, Maintini, and PopTimer.
  related-projects:
    - GitHub
    - GitHub Enterprise
    - Trailer CLI
    - TrailerQL
    - KeyVine
  sources:
    - https://github.com/ptsochantaris/trailer
    - https://ptsochantaris.github.io/trailer/
    - source_facts.description
    - source_facts.homepage
  summary:
    - >
      Trailer is an open-source family of applications centered on tracking GitHub and
      GitHub Enterprise pull requests and issues; the cask installs its macOS client.
  timeline:
    - >
      2013–2014: Copyright notices in the official repository date the early Trailer
      codebase to this period.
    - >
      Later development: Reusable portions of Trailer began moving into independent
      Swift packages.
  usage:
    - >
      Users supply a GitHub API token, choose watched repositories, and configure which
      pull requests and issues appear. Trailer then surfaces comments, merges, status
      changes, labels, and other activity through its interface and macOS Notification
      Center.
