history:
  adoption-history:
    - >
      Zapier positions Zappy as a lightweight visual-collaboration utility for remote
      teams. The application is free to download, while automatic cloud uploads and
      shareable hosted URLs are tied to paid Zapier accounts.
  package-nerd-significance:
    - >
      Zappy is a focused macOS utility that reduces screenshot, annotation, GIF, and
      recording workflows to a keyboard-driven capture loop. Its cask makes that
      proprietary remote-work tool reproducibly installable through a package manager.
  project-history:
    - >
      Zapier developed Zappy as a macOS screen-capture application centered on fast
      visual communication. Its feature set grew around annotated screenshots, GIFs,
      recordings, audio, a selfie view, layered captures, and optional Zapier-hosted
      sharing.
  related-projects:
    - Zapier
  sources:
    - 'Official product and usage page: https://zapier.com/zappy'
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      Zappy is Zapier's macOS application for capturing, annotating, recording, and
      sharing visual explanations with teammates.
  timeline:
    - >
      Current product generation: Zappy combines local screenshot and recording tools
      with optional Zapier-hosted sharing.
  usage:
    - >
      Users invoke a configurable keyboard shortcut, select a screen region, add text,
      arrows, or drawings, and press Enter to save the capture. The app can also produce
      GIFs and recordings with audio and a selfie view; paid Zapier users can
      automatically upload captures and copy a shareable URL.
