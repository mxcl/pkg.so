history:
  adoption-history:
    - >
      git-format-staged sits in the ecosystem around Prettier, Husky, lint-staged,
      pre-commit, pretty-quick, and language-specific hook managers. It distinguishes
      itself by formatting blobs from the Git index and then attempting to patch the
      working tree afterward, rather than stashing user edits before formatting.
  package-nerd-significance:
    - >
      The package is notable because it solves a small but sharp Git-index problem
      without tying users to one language ecosystem. That makes it attractive for
      polyglot repositories and hook setups where the important boundary is Git's staged
      content rather than a particular formatter.
  project-history:
    - >
      The repository began in March 2018. Its README explains the project as a response
      to pre-commit formatting hooks that run a formatter over working-tree files and
      then restage the result, a pattern that can accidentally commit unrelated unstaged
      edits or disrupt `git add -p` workflows.
  related-projects:
    - >
      git-format-staged is commonly compared with lint-staged, pre-commit, pretty-quick,
      precise-commits, Husky, and formatter tools such as Prettier.
  sources:
    - https://formulae.brew.sh/formula/git-format-staged
    - https://github.com/hallettj/git-format-staged
    - https://github.com/hallettj/git-format-staged#readme
  summary:
    - >
      git-format-staged is a Python Git helper that runs a formatter or linter against
      the staged version of files, preserving unstaged working-tree edits.
  timeline:
    - '2018: The repository began with an initial commit.'
    - '2018: The v1.0.0 tag established the installable Git helper.'
    - 'Later releases: Packaging expanded across npm, Nix, and Homebrew usage paths.'
  usage:
    - >
      Practitioners install it through Nix, npm, Homebrew, or by copying the script,
      then call it from pre-commit hooks with a formatter command that reads from stdin
      and writes to stdout. Typical use passes file patterns and a formatter
      placeholder, such as running Prettier with `--stdin-filepath` for staged
      JavaScript, TypeScript, or CSS files.
related-packages:
  - id: brew:prettier
    reason: >
      Prettier is a documented formatter companion: git-format-staged pipes each staged
      blob to `prettier --stdin-filepath`, preserving unstaged edits while applying
      Prettier's language-aware formatting.
    rel: adjacent_workflow
    sources:
      - https://github.com/hallettj/git-format-staged#readme
      - https://prettier.io/docs/cli/
