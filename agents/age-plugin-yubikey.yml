history:
  adoption-history:
    - >
      The upstream README lists Cargo, Homebrew, Arch Linux, Debian packages from
      releases, NixOS, Ubuntu, OpenBSD, and prebuilt binaries for Windows, Linux, and
      macOS. The supplied package metadata additionally records Homebrew, MacPorts, Nix,
      and pacman coverage. This is a wider packaging footprint than many age plugins
      because hardware-token support is a common operational need.
  package-nerd-significance:
    - >
      This package matters in the age ecosystem because it turns the plugin protocol
      into real hardware-backed daily use. It also shows the messy package-manager side
      of security tooling: Rust binary distribution, PC/SC middleware, distro packages,
      and USB-token platform support all have to line up before the simple age CLI flow
      feels simple.
  project-history:
    - >
      The project was created by str4d in August 2020, during the early period of the
      age ecosystem. Its first stable public release, v0.1.0, was published in May 2021,
      before age 1.0. The README presents it as a plugin for age clients such as age and
      rage, enabling files to be encrypted to age identities stored on YubiKeys.
    - >
      The plugin matured alongside age's plugin support. age 1.1.0 was released in
      December 2022 with plugin and YubiKey support, while age-plugin-yubikey had
      already reached the 0.3.x series. Later releases continued through 0.5.x, with
      official packages and prebuilt binaries making it less of a from-source Rust tool
      and more of a normal installable CLI.
  related-projects:
    - age is the reference age client and file encryption tool.
    - rage is the Rust age client named by the README as a supported client.
    - >
      yubikey-agent is mentioned by the README as a possible integration point for
      future agent-style decryption support.
  sources:
    - age official releases API
    - official GitHub releases API
    - official GitHub repository metadata
    - source_facts.package-manager
    - upstream README
  summary:
    - >
      age-plugin-yubikey is the YubiKey/PIV hardware-token plugin for age clients,
      storing key material on supported YubiKeys while giving age and rage a normal
      identity-file interface.
  timeline:
    - '2020: GitHub repository created.'
    - '2021: v0.1.0 released.'
    - '2022: v0.3.0 released; age v1.1.0 added plugin and YubiKey support.'
    - '2024: v0.5.0 released.'
    - '2026: v0.5.1 released.'
  usage:
    - >
      Users configure a YubiKey identity either interactively by running
      `age-plugin-yubikey` or programmatically with `--generate`, then save the
      resulting age identity text to a file. Encryption uses recipients printed by
      `--list`; decryption works by ensuring the plugin is on `PATH` and passing the
      identity file to an age client with `-i`.
    - >
      The README documents platform dependencies such as `pcscd` and `pcsc-lite`, WSL
      usage, PIN-cache behavior, supported YubiKey 4 and 5 variants, PIV slot details,
      and security management for default PIN and management-key handling.
related-packages:
  - id: brew:age
    reason: >
      Use age as the reference encryption client that discovers age-plugin-yubikey on
      PATH and encrypts or decrypts with its YubiKey recipients and identities.
    rel: adjacent_workflow
    sources:
      - https://github.com/FiloSottile/age/blob/main/README.md
      - https://github.com/str4d/age-plugin-yubikey#readme
  - id: brew:rage
    reason: >
      Use rage when you prefer the interoperable Rust age client; its official
      documentation explicitly supports age-plugin-yubikey.
    rel: adjacent_workflow
    sources:
      - https://github.com/str4d/rage#readme
      - https://github.com/str4d/age-plugin-yubikey#readme
  - id: brew:age-plugin-se
    reason: >
      Choose age-plugin-se instead when decryption should be bound to a Mac's Secure
      Enclave and protected by Touch ID or a passcode rather than a removable YubiKey.
    rel: alternative
    sources:
      - https://github.com/remko/age-plugin-se#readme
      - https://github.com/str4d/age-plugin-yubikey#readme
