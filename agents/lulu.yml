credentials-file-location: null
history:
  adoption-history:
    - >
      LuLu became part of Objective-See's collection of free, open-source macOS security
      utilities. Objective-See regularly uses it in malware analyses to demonstrate
      behavior-based detection of previously unknown command-and-control traffic.
    - >
      The project evolved with macOS: modern releases use Apple's system-extension and
      network-filter mechanisms, while profiles added support for switching among
      separate sets of rules and settings.
  package-nerd-significance:
    - >
      LuLu is a prominent open-source alternative to commercial macOS outbound
      firewalls. It is particularly relevant to package-manager users because
      installation is easy to automate, while activation still requires macOS approval
      of privileged security components.
    - >
      Its persistent system-wide rules also make upgrade and uninstall behavior
      important: replacing a security tool is not equivalent to replacing an ordinary
      application bundle.
  project-history:
    - >
      Security researcher Patrick Wardle developed LuLu within Objective-See. An
      Objective-See malware analysis from August 2017 described it as a
      soon-to-be-released macOS firewall.
    - >
      LuLu focuses on unknown outgoing connections, complementing the built-in macOS
      firewall's incoming-connection controls. It creates persistent allow or block
      rules from alerts and supports finer endpoint-scoped and temporary decisions.
  related-projects:
    - Objective-See BlockBlock
    - Objective-See KnockKnock
    - Objective-See Netiquette
    - macOS application firewall
  sources:
    - https://github.com/objective-see/LuLu
    - https://objective-see.org/blog/blog_0x20.html
    - https://objective-see.org/products/lulu.html
  summary:
    - >
      LuLu is Objective-See's free, open-source macOS firewall for detecting and
      controlling unknown outgoing network connections.
  timeline:
    - '2017-08: Objective-See publicly describes LuLu as a forthcoming macOS firewall.'
    - "2020: LuLu 2 development adapts the project for macOS Big Sur's Network Extension model."
    - 'Later: LuLu adds profiles containing independent rules and settings.'
  usage:
    - >
      After installation, users approve LuLu's System Extension and Network Filter in
      macOS settings. LuLu then alerts when an unauthorized process initiates an
      outgoing connection, allowing the user to permit or block it.
    - >
      Users can create process-wide or remote-endpoint rules, make decisions temporary,
      import or export rules, configure allow and block lists, and select passive or
      block modes. LuLu does not replace an inbound firewall.
