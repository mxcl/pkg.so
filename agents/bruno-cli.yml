id: brew:bruno-cli
display-name: Bruno CLI
repo: https://github.com/usebruno/bruno
docs:
  - https://docs.usebruno.com/bru-cli/overview
config-file-location:
  unix:
    - <collection>/bruno.json
    - <collection>/opencollection.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Bruno CLI's adoption follows Bruno's larger appeal to developers who want API
      collections in git and local files instead of a cloud-synced service. The provided
      package facts show Homebrew and Nix packaging, which is enough to make `bru`
      convenient on macOS/Linux developer machines and in reproducible environments.
    - >
      The official docs position the CLI for automated API testing, report generation,
      and CI/CD integration, making it the part of Bruno most likely to appear in build
      logs and package manifests.
  package-nerd-significance:
    - >
      For package nerds, `bruno-cli` is interesting because it packages an API-client
      workflow as a normal Unix command. It is part of the broader shift from GUI-only
      API tools toward repository-native collections that can be reviewed, diffed, and
      executed in CI.
    - >
      Its significance is not that it invented HTTP scripting, but that it makes Bruno's
      local collection format viable outside the desktop app, giving package managers a
      clean hook into API regression testing.
  project-history:
    - >
      The CLI tracks the main Bruno project in the usebruno/bruno monorepo. Its
      changelog shows an early 0.x period adding operational features such as custom CA
      support, insecure TLS mode, environment-variable loading, output capture, proxy
      support, and authentication fixes before the 1.0.0 stable CLI release.
    - >
      On 6 Feb 2024 the project changed release practice so that a new CLI version would
      be released with every Bruno application release. That tied the
      package-manager-facing `bruno-cli` artifact more closely to Bruno's
      desktop/API-client release cadence.
  related-projects:
    - Bruno desktop app is the authoring environment and main upstream project for the CLI.
    - >
      Postman and Insomnia are adjacent API-client ecosystems; Bruno CLI occupies the
      package-manager-friendly lane for Bruno collections.
    - Newman is a useful comparison point as the command-line runner for Postman collections.
  sources:
    - https://docs.usebruno.com/bru-cli/overview
    - https://github.com/usebruno/bruno
    - https://raw.githubusercontent.com/usebruno/bruno/main/packages/bruno-cli/changelog.md
    - source_facts.package-manager
  summary:
    - >
      Bruno CLI is the command-line runner for Bruno, an open-source API client whose
      collections live as local files rather than in a hosted workspace. In
      package-manager terms it gives the Bruno collection format a scriptable interface:
      the GUI remains useful for authoring, while the `bru` executable runs requests,
      collections, and tests from terminals and CI systems.
  timeline:
    - >
      2023: Early 0.x CLI releases add TLS, environment, output, proxy, and
      authentication features.
    - '2023: Bruno CLI 1.0.0 is marked as the stable release in the CLI changelog.'
    - >
      2024-02-06: The project announces that each Bruno app release will also have a
      matching CLI release.
    - >
      2026: Official CLI documentation describes collection execution, report
      generation, CI/CD integration, and the v3.0.0 Safe Mode default.
  usage:
    - >
      Common usage is to run Bruno requests or collections from a project checkout,
      select environments, pass environment variables, and emit machine-readable reports
      such as JSON, JUnit, or HTML for test pipelines.
    - >
      The CLI became more security-conscious over time: the official docs note that
      Bruno CLI v3.0.0 changed the default runtime from Developer Mode to Safe Mode,
      requiring an explicit sandbox flag for filesystem or external-package behavior.
related-packages:
  - id: brew:hurl
    reason: >
      Choose Hurl when you want HTTP requests and assertions in its compact plain-text
      format instead of executing Bruno collection files.
    rel: alternative
    sources:
      - https://docs.usebruno.com/bru-cli/overview
      - https://hurl.dev/docs/manual.html
  - id: brew:newman
    reason: >
      Choose Newman when the API test suite is maintained as Postman collections rather
      than Bruno collections.
    rel: alternative
    sources:
      - https://docs.usebruno.com/bru-cli/overview
      - >
        https://learning.postman.com/docs/collections/using-newman-cli/command-line-integration-with-newman/
tags:
