history:
  adoption-history:
    - >
      The project targets Windows, macOS, and Linux and is distributed through native
      installers and desktop package channels, including the supplied Homebrew cask.
    - >
      Its adoption is tied to the wider OpenList ecosystem: it provides a graphical way
      to install, run, monitor, and update OpenList and Rclone rather than replacing
      either underlying service.
  package-nerd-significance:
    - >
      OpenList Desktop is an example of a package that wraps several independently
      distributed components into one desktop workflow. Packagers must account for the
      GUI, the OpenList core, Rclone, background service integration, filesystem
      mounting, and platform-specific permissions.
    - >
      For Homebrew users, the cask turns a multi-component cloud-storage and WebDAV
      mounting setup into a conventional macOS application install.
  project-history:
    - >
      OpenList Desktop was developed by the OpenList team as a cross-platform Tauri
      desktop front end for the OpenList service. The official README identifies the
      project as early-stage software in the 0.x release line.
    - >
      The application expanded the basic service wrapper into a control surface for
      OpenList, Rclone mounts, logs, updates, startup behavior, and system-tray
      operation.
  related-projects:
    - OpenList supplies the managed file-listing and storage service.
    - Rclone performs local filesystem mounts.
    - WebDAV is the protocol used for configured remote mounts.
  sources:
    - https://github.com/OpenListTeam/OpenList-Desktop/blob/main/README_en.md
    - https://github.com/OpenListTeam/OpenList-Desktop/blob/main/release_notes.md
  summary:
    - >
      OpenList Desktop is a cross-platform graphical manager for OpenList, with
      integrated Rclone-based mounting, service monitoring, configuration, logs,
      updates, and system-tray operation.
  timeline:
    - >
      2025: Public 0.x releases documented the application as an early-stage OpenList
      desktop manager.
  usage:
    - >
      On first launch, users complete the initial setup, install the managed OpenList
      service, and configure storage. The dashboard then starts, stops, and monitors
      OpenList and Rclone.
    - >
      A mount definition contains a remote name, WebDAV endpoint, username and password,
      and local mount point. Advanced users can pass additional Rclone flags for
      caching, buffering, and transfer concurrency.
