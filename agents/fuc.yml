history:
  adoption-history:
    - >
      Official project surfaces distribute fuc through GitHub releases and Rust crates
      for the individual commands. The Homebrew package facts also show distribution
      through Homebrew, Nix, and zypper, indicating that the package crossed from Rust
      ecosystem packaging into general operating-system package managers.
  package-nerd-significance:
    - >
      fuc is interesting to package maintainers because it packages focused Rust
      rewrites of familiar Unix primitives while being clear about the compatibility
      boundary. That makes it a benchmark-and-alternative package rather than a
      transparent coreutils replacement.
  project-history:
    - >
      The GitHub repository was created in November 2021 and the official README frames
      the project around performance, efficiency, and usability. Rather than attempting
      to replace all of coreutils, the project explicitly limits its scope to selected
      modern Unix commands and treats portability and full option compatibility as
      non-goals.
  related-projects:
    - >
      GNU coreutils is the traditional command suite whose cp and rm commands fuc
      compares against.
    - >
      uutils coreutils is the Rust reimplementation that the fuc README names as the
      broader, more compatible Rust coreutils option.
  sources:
    - https://api.github.com/repos/supercilex/fuc
    - https://github.com/SUPERCILEX/fuc
    - https://github.com/SUPERCILEX/fuc#readme
    - https://github.com/SUPERCILEX/fuc/releases
  summary:
    - >
      fuc, short for Fast Unix Commands, is a Rust project that provides
      performance-focused replacements for selected Unix file commands. Its public tools
      are cpz, a faster alternative to cp, and rmz, a faster alternative to rm.
  timeline:
    - '2021: Repository created on GitHub.'
    - '2023: 1.0.0 release appears in the official GitHub releases.'
    - '2024: 2.0.0 release appears in the official GitHub releases.'
    - '2025: 3.0.0 release appears in the official GitHub releases.'
    - '2026: 3.1.7 release appears in the official GitHub releases.'
  usage:
    - >
      Users install or package the cpz and rmz commands when they want faster copy and
      remove operations than traditional coreutils on modern Linux systems. The README
      points benchmark-minded users to comparison material and tells
      compatibility-focused users to prefer GNU coreutils or uutils coreutils.
related-packages:
  - id: brew:coreutils
    reason: >
      Choose GNU Coreutils when scripts need the established cp and rm interfaces, broad
      option coverage, and mature compatibility instead of fuc's narrower performance
      focus.
    rel: alternative
    sources:
      - https://github.com/SUPERCILEX/fuc#readme
      - https://www.gnu.org/software/coreutils/manual/coreutils.html
  - id: brew:uutils-coreutils
    reason: >
      Choose uutils-coreutils for a Rust implementation covering the broader GNU
      coreutils command set and aiming for drop-in compatibility across more platforms.
    rel: alternative
    sources:
      - https://github.com/SUPERCILEX/fuc#readme
      - https://uutils.github.io/coreutils/docs/
      - https://uutils.org/coreutils/
