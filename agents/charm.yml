id: brew:charm
display-name: charm
repo: null
docs:
  - https://github.com/juju/charmstore-client#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package facts show the `charm` CLI distributed by Homebrew, MacPorts,
      Nix, and Arch/Pacman. Its GitHub releases show an active 2.x line from 2016
      through 2021, after which the repository metadata indicates no recent pushes.
  package-nerd-significance:
    - >
      charm is package-nerd significant as a specialized registry client: it treated
      Juju charms and bundles like publishable artifacts with login, push, release,
      permission, and resource commands, similar in shape to language package-manager
      CLIs.
  project-history:
    - >
      The charmstore-client README says the repository holds client-side code for
      interacting with the Juju Charm Store. Installing the Go package produces the
      `charm` executable.
  related-projects:
    - Juju charms and bundles are the artifacts managed by the command.
    - >
      juju/charm-tools covers authoring and validation workflows adjacent to
      charmstore-client's store operations.
    - Charmhub and Charmcraft are newer Canonical surfaces in the charm ecosystem.
  sources:
    - https://github.com/juju/charmstore-client#readme
    - https://formulae.brew.sh/formula/charm
  summary:
    - >
      charm is the command-line client from juju/charmstore-client for interacting with
      the Juju Charm Store.
  timeline:
    - '2016: juju/charmstore-client public GitHub repository created.'
    - '2016: 2.1.x and 2.2.0 GitHub releases published.'
    - '2020: charmstore-client 2.5.0 and 2.5.1 released.'
    - >
      2021: 2.5.2 release published; repository push activity ended shortly afterward
      according to repository metadata.
  usage:
    - >
      The README documents Charm Store operations including login/logout, listing
      charms, pulling, pushing, releasing, granting and revoking permissions, attaching
      resources, showing metadata, and checking `whoami`.
related-packages:
  - id: brew:charmcraft
    reason: >
      Choose Charmcraft for current Charmhub workflows; it replaces legacy Charm Store
      publishing with supported commands for packing, registering, uploading, and
      releasing charms.
    rel: alternative
    sources:
      - https://github.com/juju/charmstore-client
      - https://github.com/canonical/charmcraft
      - https://documentation.ubuntu.com/charmcraft/stable/howto/manage-charms/
  - id: brew:juju
    reason: >
      Use Juju after obtaining or publishing a charm because Juju deploys charms from
      Charmhub and manages the resulting applications and infrastructure.
    rel: adjacent_workflow
    sources:
      - https://github.com/juju/charmstore-client
      - https://documentation.ubuntu.com/juju/latest/reference/index.html
  - id: brew:charm-tools
    reason: >
      Charm Tools complements the store client in legacy workflows by creating,
      building, and validating the charms that `charm` pushes and releases.
    rel: adjacent_workflow
    sources:
      - https://github.com/juju/charmstore-client
      - https://charm-tools.readthedocs.io/en/latest/
