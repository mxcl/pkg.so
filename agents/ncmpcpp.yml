history:
  adoption-history:
    - >
      ncmpcpp became one of the iconic MPD terminal clients because it adds the features
      many MPD users want beyond a minimal queue browser: library views, tag editing,
      lyrics, visualizer support, and deep theming. The GitHub page observed for this
      batch showed about 2.5k stars and 237 forks. The Homebrew formula API response
      consulted for this July 2026 batch reported 45 install-on-request events in 30
      days and 1,602 in 365 days.
  package-nerd-significance:
    - >
      ncmpcpp is significant because it became the expressive counterpart to ncmpc. In
      MPD setups, it is the client people screenshot, theme, and wire into
      terminal-based desktops, while still speaking the same MPD model: a persistent
      daemon with replaceable clients.
  project-history:
    - >
      The release notes on the upstream site show rapid 0.1-0.5 growth during 2008-2010:
      media library, lyrics, playlist editor, tag editor, local browser, Last.fm artist
      info, visualizer, alternative UI, libmpdclient2, idle support, and many
      configuration options. The 0.6 beta series in 2014 redesigned keybindings, added
      readline support, removed polling mode, and required MPD >= 0.16; the 0.7 line in
      2015-2016 added richer visualizer modes, 256-color/background customization,
      multiple config files, action chains, and compatibility with newer MPD.
  related-projects:
    - Music Player Daemon, ncmpc, libmpdclient, TagLib, FFTW, Last.fm
  sources:
    - https://formulae.brew.sh/api/formula/ncmpcpp.json
    - https://github.com/ncmpcpp/ncmpcpp
    - https://raw.githubusercontent.com/ncmpcpp/ncmpcpp/master/CHANGELOG.md
    - https://rybczak.net/ncmpcpp/
    - https://www.musicpd.org/clients/
  summary:
    - >
      ncmpcpp, NCurses Music Player Client Plus Plus, is a featureful ncurses client for
      Music Player Daemon inspired by ncmpc. Its upstream README says the project is in
      maintenance mode, feature-complete for maintainer Andrzej Rybczak, with serious
      bugs and dependency breakage still in scope.
  timeline:
    - >
      2008-08-07: 0.1.1 appeared in the release notes with example config and
      customization improvements.
    - '2008-09-20: 0.2.3 added the complex tag editor and Last.fm artist info.'
    - '2009-09-09: 0.4 added visualizer modes and an alternative UI.'
    - '2014-09-03: 0.6_beta1 redesigned keybindings and required MPD >= 0.16.'
    - '2021-01-24: 0.9.2 fixed regressions around external commands and password prompts.'
    - '2024-10-24: 0.10.1 fixed libc++ compilation and an empty-playlist reverse crash.'
  usage:
    - >
      Package nerds use ncmpcpp as the full-screen MPD cockpit: keyboard-driven queue
      control, database browsing, media-library navigation, playlist editing, tag
      cleanup with TagLib, lyrics fetching, optional FFTW-backed visualizer output, and
      heavily customized config/bindings under `~/.ncmpcpp` or XDG config paths. It is
      especially associated with riced terminal desktops where MPD handles playback and
      ncmpcpp provides the visible music UI.
related-packages:
  - id: brew:ncmpc
    reason: >
      Choose ncmpc for a smaller, more conservative MPD terminal client when tag
      editing, elaborate theming, and visualization are unnecessary.
    rel: alternative
    sources:
      - https://www.musicpd.org/clients/ncmpc/
      - https://github.com/ncmpcpp/ncmpcpp
  - id: brew:mpc
    reason: >
      Use mpc alongside ncmpcpp when scripts, hotkeys, or automation need a
      non-interactive command-line interface to the same MPD server.
    rel: adjacent_workflow
    sources:
      - https://www.musicpd.org/clients/mpc/
      - https://mpd.readthedocs.io/en/stable/user.html
