history:
  adoption-history:
    - >
      Luban became Snapmaker's unified desktop workflow for its modular fabrication
      machines. Snapmaker's compatibility documentation covers the Original and 2.0
      product families and their modules, while the official wiki provides
      machine-specific onboarding for later systems such as the J1 and J1s.
  package-nerd-significance:
    - >
      Snapmaker Luban is notable as an open-source, cross-platform Electron application
      that combines workflows normally split among a slicer, laser CAM software, CNC CAM
      software, and a machine sender. Its AGPL licensing and public source make it
      unusually inspectable for vendor-supplied fabrication software.
  project-history:
    - >
      Snapmaker created Snapmaker3D and Snapmakerjs in 2017, then merged the two
      applications to provide one workflow across the company's 3D-printing, laser, and
      CNC functions. After 26 iterations, the combined application was renamed Snapmaker
      Luban and released as open source on GitHub in 2020.
    - >
      The project was built on ideas and infrastructure from cncjs and has used
      dedicated slicing engines underneath its user interface. Development subsequently
      continued through the 3.x and 4.x release lines, adding new machines, fabrication
      modes, profile controls, and workflow improvements.
  related-projects:
    - Snapmaker3D and Snapmakerjs were Luban's predecessor applications.
    - cncjs inspired Luban's machine-control architecture.
    - >
      Snapmaker firmware projects provide the controllers and modules with which Luban
      communicates.
    - >
      LunarSlicer is identified by the current official README as Luban's 3D slicing
      component.
  sources:
    - >
      Official manual overview:
      https://support.snapmaker.com/hc/en-us/articles/4406229926935-1-Overview
    - >
      Official open-source announcement:
      https://forum.snapmaker.com/t/snapmaker-luban-is-open-source-now-on-github/5601
    - >
      Official release index:
      https://forum.snapmaker.com/t/snapmaker-luban-downloads-and-updates/4949
    - 'Official repository README: https://github.com/Snapmaker/Luban'
  summary:
    - >
      Snapmaker Luban is Snapmaker's open-source, cross-platform workspace for preparing
      and sending 3D-printing, laser-engraving, laser-cutting, and CNC-milling jobs to
      Snapmaker machines.
  timeline:
    - >
      2017: Snapmaker3D and Snapmakerjs originated as separate applications for the
      Snapmaker ecosystem.
    - >
      2020: Snapmaker merged and rebranded the software as Snapmaker Luban and published
      it on GitHub.
    - >
      2021: The official release index records the transition from the 3.x series to
      Luban 4.0.
    - >
      2024: Snapmaker announced a substantially expanded Luban wiki with quick starts,
      toolbar tours, parameter references, and tutorials.
  usage:
    - >
      Users choose a Snapmaker machine, import models or artwork, configure material and
      process parameters, generate G-code, preview the toolpath, and transfer or send
      the job to the machine. The same application supports additive printing, laser
      work, and CNC carving, reducing the need to switch among separate preparation
      tools.
