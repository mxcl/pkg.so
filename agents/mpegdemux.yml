    - https://manpages.ubuntu.com/manpages/noble/man1/mpegdemux.1.html
    - https://packages.debian.org/bullseye/i386/mpegdemux
  summary:
    - >
      mpegdemux is a small MPEG-1/MPEG-2 system stream demultiplexer by Hampa Hug. Its
      documented purpose is to inspect an MPEG system stream and extract elementary
      streams. The Ubuntu man page describes four modes: scan for streams, list stream
      contents in text form, demux selected elementary streams, and remux while
      preserving the system-stream structure except for removed streams.
  usage:
    - >
      Its package-manager niche is an old-school command-line media utility rather than
      a full transcoder. Debian classifies it as a command-line utility for converting
      that works with audio and video, and lists similar packages such as mpgtx, vamps,
      libmpeg3, VLC, and streamripper. Homebrew carries it as a tiny GPL-licensed
      formula, useful when someone needs this specific MPEG systems-stream operation
      instead of a larger multimedia suite.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Choose FFmpeg when demultiplexing must be part of a broader workflow with many
      formats, stream mapping, remuxing, decoding, filtering, or transcoding; mpegdemux
      is the narrower MPEG-1/2 systems-stream tool.
    rel: alternative
    sources:
      - http://www.hampa.ch/mpegdemux
      - https://ffmpeg.org/ffmpeg.html
      - https://www.ffmpeg.org/ffmpeg-formats.html
