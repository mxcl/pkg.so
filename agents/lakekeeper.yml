history:
  adoption-history:
    - >
      Lakekeeper's README advertises integration testing or support badges for engines
      and clients including Spark, PyIceberg, Trino, and StarRocks, and its quickstart
      centers on Docker Compose with example notebooks and a UI. GitHub releases in June
      2026 show a project moving quickly through authorization, storage, UI, and Iceberg
      REST compatibility work.
  package-nerd-significance:
    - >
      Lakekeeper is notable because it packages the Iceberg REST catalog layer as a
      self-hostable Rust service. For Homebrew and CLI/package watchers, it is a sign
      that lakehouse infrastructure tools are becoming small installable services, not
      only cloud-managed components.
  project-history:
    - >
      The project README describes Lakekeeper as a secure, fast, and easy-to-use
      implementation of the Apache Iceberg REST Catalog specification based on
      apache/iceberg-rust. Its docs present a split between the Iceberg REST API, served
      under /catalog for external query engines, and a management API under /management
      for Lakekeeper-specific entities such as projects, users, roles, warehouses,
      permissions, and multi-tenant setup.
  related-projects:
    - >
      Lakekeeper is closely tied to Apache Iceberg, apache/iceberg-rust, Spark,
      PyIceberg, Trino, StarRocks, S3-compatible object stores, and broader
      open-lakehouse catalog projects.
  sources:
    - https://docs.lakekeeper.io/
    - https://docs.lakekeeper.io/docs/0.10.x/concepts/
    - https://github.com/lakekeeper/lakekeeper
    - https://github.com/lakekeeper/lakekeeper/releases
  summary:
    - >
      Lakekeeper is an Apache-licensed Apache Iceberg REST Catalog implementation
      written in Rust. Its package history sits in the newer lakehouse control-plane
      ecosystem, where catalogs expose standard Iceberg metadata APIs to engines rather
      than being tied to one query system.
  timeline:
    - >
      2026-06-17: Lakekeeper v0.12.4 included multi-OIDC support and OneLake/Fabric
      private endpoint work.
    - >
      2026-06-30: Lakekeeper v0.13.0 included role, authorization, storage layout,
      generic table API, and Iceberg 1.11 signer property changes.
    - >
      2026-06-30: Lakekeeper v0.13.1 followed as a bug-fix release for the UI client ID
      handling.
  usage:
    - >
      Operators deploy Lakekeeper as a catalog service, point Iceberg-capable engines at
      the /catalog endpoint, and manage warehouses, storage profiles, credentials, and
      permissions through Lakekeeper's management layer. The project also implements an
      S3 remote signing API for warehouse access.
related-packages:
  - id: brew:apache-polaris
    reason: >
      Apache Polaris is the closest catalog alternative: it also implements the Iceberg
      REST API and emphasizes Apache-governed, multi-engine interoperability, while
      Lakekeeper offers a Rust-native binary and its own access-control stack.
    rel: alternative
    sources:
      - https://docs.lakekeeper.io/
      - https://polaris.apache.org/
      - https://polaris.apache.org/releases/1.4.0/
  - id: brew:trino
    reason: >
      Lakekeeper officially documents Trino as a query-engine client, including REST
      catalog setup, OAuth, vended credentials, nested namespaces, and an OPA bridge for
      shared authorization.
    rel: adjacent_workflow
    sources:
      - https://docs.lakekeeper.io/docs/latest/engines/
      - https://docs.lakekeeper.io/docs/latest/opa/
      - https://trino.io/docs/current/connector/iceberg.html
  - id: brew:openfga
    reason: >
      OpenFGA is a supported Lakekeeper authorization backend for enforcing fine-grained
      relationship-based permissions across projects, warehouses, namespaces, and
      tables.
    rel: adjacent_workflow
    sources:
      - https://docs.lakekeeper.io/docs/latest/authorization/
      - https://docs.lakekeeper.io/docs/latest/authorization-openfga/
      - https://openfga.dev/docs
