credentials-file-location: null
history:
  adoption-history:
    - >
      The developer reported testing Liviable with Arm64 releases of Debian, Fedora,
      Gentoo, Kali, Rocky Linux, and Ubuntu on M1 Max and M3 Pro Macs. Its adoption is
      oriented toward users wanting a small native front end to Apple's virtualization
      facilities rather than a full cross-platform virtualization suite.
  package-nerd-significance:
    - >
      Liviable is notable to package users as a compact, free macOS virtualizer
      distributed as a standalone application and Homebrew cask. Its VM-local
      property-list settings and reliance on Apple's native Virtualization framework
      give it a distinctly Mac-native operational model.
  project-history:
    - >
      Liviable was created by Howard Oakley as a lightweight application for running GUI
      Linux distributions on Apple silicon Macs. It complements the developer's Viable
      family of macOS virtualization tools while retaining a separate interface for
      Linux-specific features.
    - >
      Beta 4 aligned much of its code with Viable, added bridged networking and VM
      settings files, and reduced the minimum guest-memory setting. Beta 5 fixed
      settings persistence and replaced the earlier help document with a 13-page PDF
      help book.
  related-projects:
    - Viable and ViableS, related applications for macOS virtual machines.
    - Vimy, another virtualization application from the same developer.
    - >
      Apple Virtualization framework, the host technology used for lightweight virtual
      machines.
  sources:
    - >
      https://eclecticlight.co/2024/01/01/virtualise-linux-on-apple-silicon-with-liviable-beta-4/
    - https://eclecticlight.co/2024/01/09/liviable-version-1-0-5-beta-5/
    - https://eclecticlight.co/downloads/
  summary:
    - >
      Liviable is a free, lightweight macOS application for creating and running Arm64
      Linux virtual machines on Apple silicon using Apple's native virtualization
      facilities.
  timeline:
    - '2023: Liviable gains shared-folder support and work toward Rosetta 2 support.'
    - '2024-01-01: Version 1.0.4 beta 4 adds bridged networking and VM settings files.'
    - '2024-01-09: Version 1.0.5 beta 5 fixes settings persistence and adds a PDF help book.'
  usage:
    - >
      Users supply a bootable Arm64 Linux ISO, choose CPU, memory, display, networking,
      and sharing options, then create or run a VM bundle.
    - >
      VM-specific choices are stored as Settings.plist inside the VM bundle. When
      settings are overwritten, the previous values are retained as
      SettingsPrevious.plist. Shared host folders must be mounted manually inside the
      Linux guest.
