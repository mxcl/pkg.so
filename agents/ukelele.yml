history:
  adoption-history:
    - >
      Ukelele has remained a specialist macOS tool across multiple operating-system
      generations. SIL continues to publish builds and documentation, while the source
      is now maintained openly under the sillsdev organization.
    - >
      Its longevity reflects a persistent need among language communities, typographers,
      and power users to create keyboard layouts that Apple's standard settings cannot
      express directly.
  package-nerd-significance:
    - >
      Ukelele is a long-lived piece of macOS keyboard tooling and a practical editor for
      Apple's XML .keylayout format. It is especially relevant to Unicode, localization,
      and input-method enthusiasts because it exposes modifier maps, dead-key states,
      bundles, scripts, languages, and physical keyboard types through a graphical
      editor.
    - >
      The project also illustrates unusually durable Mac software packaging: it spans
      PowerPC-era releases, a major Cocoa rewrite, Gatekeeper signing, Retina
      adaptation, and current notarized-style disk-image distribution.
  project-history:
    - >
      John Brownie of SIL developed Ukelele as a graphical tool for creating custom
      macOS keyboard layouts; the official product page dates its copyright from 2003.
      Early releases evolved through the 1.x line before a substantial 2.0 rewrite
      modernized the interface and architecture in 2010.
    - >
      Later releases added keyboard-layout bundles, support for newer macOS input
      behavior, improved Unicode data, installation management, and tools for importing
      or inspecting layouts. The project is now open source in SIL's official GitHub
      organization.
  related-projects:
    - Keyboard Juggler
    - Keyman
    - Nano framework
    - Apple .keylayout format
    - Unicode
  sources:
    - https://github.com/sillsdev/Ukelele
    - https://software.sil.org/ukelele/
    - https://software.sil.org/ukelele/ukelele-version-history/
  summary:
    - >
      Ukelele is SIL's macOS editor for creating, inspecting, and installing Unicode
      keyboard layouts.
  timeline:
    - "2003: Ukelele's official copyright history begins."
    - '2009: The final 1.x release was published.'
    - '2010: Ukelele 2.0 introduced a major rewrite and modernized interface.'
    - '2012: Version 2.2 added layout bundles compatible with macOS press-and-hold behavior.'
    - '2019: Version 3.3 incorporated Keyboard Juggler-style installation management.'
    - '2026: Version 3.6.1 updated compatibility and Unicode handling.'
  usage:
    - >
      Users create a layout from a template, an existing layout, or the current macOS
      input source; assign characters and dead-key behavior across modifier
      combinations; save the result as a .keylayout file or bundle; and install it as a
      macOS input source. The official instructions place installed layouts under
      /Library or ~/Library, but these are output installation directories rather than
      Ukelele's own configuration-file location.
