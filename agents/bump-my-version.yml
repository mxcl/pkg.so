id: brew:bump-my-version
display-name: Bump My Version
repo: https://github.com/callowayproject/bump-my-version
docs:
  - https://callowayproject.github.io/bump-my-version
config-file-location:
  unix:
    - '--config-file <FILE>'
    - $BUMPVERSION_CONFIG_FILE
    - .bumpversion.cfg
    - .bumpversion.toml
    - setup.cfg
    - pyproject.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is concentrated among Python projects that want a maintained
      bumpversion-compatible tool without building custom release scripts. Homebrew and
      Nix packaging make it available outside Python-only installation paths, but its
      main audience remains developers standardizing release bumps in source-controlled
      projects.
  package-nerd-significance:
    - >
      Bump My Version matters because version bumpers sit at the boundary between
      package metadata and Git history. They encode how maintainers synchronize package
      versions, changelogs, tags, and source files, which is one of the least glamorous
      but most failure-prone parts of publishing packages.
  project-history:
    - >
      The project appeared publicly in April 2023 as a continuation of the long-running
      bumpversion-style workflow for Python projects. Its repository description calls
      it a small command-line tool for updating all version strings in source code by
      the correct increment and optionally committing and tagging the change.
    - >
      The documentation keeps compatibility with legacy `.bumpversion.cfg` and
      `setup.cfg` configuration while recommending TOML configuration such as
      `.bumpversion.toml` and `pyproject.toml`. That places it in the Python packaging
      transition from setup.cfg-era projects toward pyproject.toml-era tooling.
  related-projects:
    - >
      Related projects include the original bumpversion family, bump2version, Python
      build backends that read `pyproject.toml`, and release automation tools such as
      semantic-release, towncrier, and conventional changelog generators.
  sources:
    - https://callowayproject.github.io/bump-my-version
    - https://callowayproject.github.io/bump-my-version/reference/configuration/
    - https://github.com/callowayproject/bump-my-version
    - https://github.com/callowayproject/bump-my-version/releases
  summary:
    - >
      Bump My Version is a Python release-automation CLI for changing version strings
      across project files, then optionally committing and tagging the result.
  timeline:
    - '2023-04: Public GitHub repository created.'
    - '2023-06: Early 0.x releases established the CLI and replacement behavior.'
    - '2023-08: 0.9.x releases expanded documentation and regular-expression support.'
    - '2026-06: 1.4.x releases show ongoing maintenance.'
  usage:
    - >
      A typical workflow defines the current version, parsing rules, files to edit, and
      optional commit/tag settings in configuration. Developers then run the CLI to bump
      major, minor, patch, calendar, or custom version components and let the tool
      update matching files consistently.
related-packages:
  - id: brew:commitizen
    reason: >
      Choose Commitizen when version increments should be derived from Conventional
      Commits and coupled to changelog generation; choose Bump My Version for explicit,
      configurable version parsing and replacement across arbitrary files.
    rel: alternative
    sources:
      - https://callowayproject.github.io/bump-my-version/
      - https://commitizen-tools.github.io/commitizen/commands/bump/
  - id: brew:release-it
    reason: >
      Choose release-it when the workflow must extend beyond file updates into package
      publication, forge releases, hooks, and CI automation; Bump My Version is more
      focused on version-string transformation and VCS tagging.
    rel: alternative
    sources:
      - https://callowayproject.github.io/bump-my-version/
      - https://github.com/release-it/release-it#readme
