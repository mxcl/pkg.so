id: cask:nvalt
display-name: nvALT
repo: https://github.com/ttscoff/nv
docs:
  - https://brettterpstra.com/projects/nvalt
  - https://github.com/ttscoff/nv#readme
config-file-location:
  macos:
    - ~/Library/Application Support/Notational Velocity/template.html
    - ~/Library/Application Support/Notational Velocity/custom.css
credentials-file-location: null
history:
  adoption-history:
    - >
      nvALT became a familiar tool among Mac power users, Markdown writers, and
      automation enthusiasts because it combined instant keyboard-driven retrieval with
      ordinary text files. Folder-based storage and Simplenote synchronization made it
      useful in multi-application and multi-device writing systems.
    - >
      The project is now officially marked retired. Its workflow survives in other
      plain-text note applications and in nvUltra, which Brett Terpstra presents as its
      replacement.
  package-nerd-significance:
    - >
      nvALT is a canonical Mac package-nerd application: small, keyboard-first, friendly
      to plain files, and composable with editors, scripts, launchers, and
      synchronization tools.
    - >
      Its unified search-or-create field demonstrated an unusually low-friction note
      workflow, while Markdown files reduced lock-in and made backup, migration, and
      command-line processing straightforward.
  project-history:
    - >
      nvALT was developed by David Halter of Elastic Threads and Brett Terpstra as a
      fork of Zachary Schneirov's Notational Velocity. It retained the upstream
      application's single-field search-and-create model while adding MultiMarkdown
      preview, richer Markdown editing, tagging, external-editor support, visual
      customization, and additional synchronization features.
    - >
      The source was published through Brett Terpstra's official GitHub repository. The
      project page now identifies nvALT as retired and points users toward nvUltra as
      its replacement.
  related-projects:
    - >
      Notational Velocity is the upstream application from which nvALT was forked.
      Simplenote provided a documented synchronization workflow, while nvUltra is Brett
      Terpstra's later replacement for the same style of rapid plain-text note
      management.
  sources:
    - https://brettterpstra.com/projects/nvalt/
    - https://github.com/ttscoff/nv
    - https://nvultra.com/
  summary:
    - >
      nvALT is a retired open-source macOS plain-text and Markdown note application
      derived from Notational Velocity. Its central field searches existing notes as the
      user types and creates a new note when the entered title does not exist.
  timeline:
    - '2010–2011: nvALT emerged as a feature-rich fork of Notational Velocity.'
    - '2012: Official release notes documented the nvALT 2.2 public beta.'
    - '2013: The official project page published nvALT 2.2.8.'
    - 'Later: The project was marked retired and nvUltra was introduced as its replacement.'
  usage:
    - >
      Users invoke nvALT from the keyboard, type to filter their note collection, and
      press Return to edit a match or create a note. Notes can be stored as individual
      plain-text or Markdown files, tagged, previewed as rendered Markdown,
      synchronized, and opened in external editors.
    - >
      The official project page documents `template.html` and `custom.css` under the
      Notational Velocity application-support directory for preview customization. No
      separate credentials file is documented.
related-packages:
  - id: cask:simplenote
    reason: >
      Choose Simplenote when built-in synchronization across current desktop, mobile,
      and web clients matters more than nvALT's retired macOS-only, local-file-centered
      workflow.
    rel: alternative
    sources:
      - https://simplenote.com/help/
      - https://brettterpstra.com/projects/nvalt/
