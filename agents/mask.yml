id: brew:mask
display-name: mask
repo: null
docs:
  - https://github.com/jacobdeichert/mask#readme
config-file-location:
  unix:
    - maskfile.md
    - file supplied with --maskfile
credentials-file-location: null
history:
  adoption-history:
    - >
      mask has modest but real adoption for a specialized developer tool, with GitHub
      showing around 1.6k stars and packaging in Homebrew, MacPorts, Nix, and Scoop
      according to the supplied package metadata.
    - >
      Its adoption is concentrated among users who prefer checked-in project task files
      that read like documentation, especially where a `Makefile` or ad hoc scripts feel
      too terse for onboarding.
  package-nerd-significance:
    - >
      mask is interesting to package users because it competes in the same ergonomic
      space as `make`, `just`, and npm scripts while using Markdown as the configuration
      language.
    - >
      The single-binary Rust distribution model makes it easy to install through general
      package managers, which fits its pitch as a low-friction project automation tool.
  project-history:
    - >
      The mask repository was created in July 2019, and the earliest GitHub releases
      followed within the same month. Its initial release introduced the core
      Markdown-driven task-runner idea; later early releases added shell executors and
      adjusted argument syntax so required arguments would not conflict with Markdown
      rendering.
    - >
      The README explains the author's motivation: mask grew from frustration with
      Makefile syntax, interest in `just`, and inspiration from `maid`, while choosing a
      single Rust binary instead of an npm package with many dependencies. That origin
      is central to its package identity: a lightweight executable with docs-as-commands
      semantics.
  related-projects:
    - mask is conceptually related to `make`, `just`, and `maid`.
    - >
      Its parser is also exposed as the `mask-parser` crate, though the README says it
      is not yet documented or stable.
  sources:
    - https://api.github.com/repos/jacobdeichert/mask
    - https://github.com/jacobdeichert/mask
    - https://github.com/jacobdeichert/mask/releases?page=3
    - source_facts.package-manager-url
  summary:
    - >
      mask is a Rust CLI task runner whose commands are defined in a Markdown file. It
      treats `maskfile.md` as both human-readable project documentation and executable
      command metadata.
  timeline:
    - '2019: GitHub repository created.'
    - '2019: v0.2.0 initial public release.'
    - '2019: v0.2.1 adds bash, zsh, and fish executors.'
    - '2026: GitHub lists mask v0.11.7 as the latest release in January 2026.'
  usage:
    - >
      A project defines headings, blockquotes, options, and code blocks in
      `maskfile.md`; running `mask build` or another subcommand executes the associated
      script. The README documents support for positional arguments, named flags,
      multiple runtimes, nested commands, and injected helper variables.
    - >
      By default mask searches the current directory for `maskfile.md`, but `--maskfile
      <path_to_maskfile>` lets users run a project or global task file from another
      location.
related-packages:
  - id: brew:just
    reason: >
      Choose just for its purpose-built justfile syntax and mature command-runner
      workflow; choose mask when the task definition should also render as ordinary
      Markdown documentation with nested subcommands.
    rel: alternative
    sources:
      - https://github.com/jacobdeichert/mask#where-did-the-inspiration-come-from
      - https://just.systems/man/en/
  - id: brew:make
    reason: >
      Choose GNU Make when dependency graphs, targets, and incremental builds are
      central; choose mask for documentation-oriented project commands without Makefile
      syntax.
    rel: alternative
    sources:
      - https://github.com/jacobdeichert/mask#use-cases
      - https://www.gnu.org/software/make/manual/
