id: brew:gaze
display-name: Gaze
repo: null
docs:
  - https://github.com/wtetsu/gaze#readme
config-file-location:
  unix:
    - ~/.config/gaze/gaze.yml
    - ~/.gaze.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Official adoption evidence is light, but the project is packaged in Homebrew and
      published with cross-platform binaries. The README also positions Gaze for modern
      AI-assisted development workflows, where an agent edits files and a watcher reruns
      checks automatically.
  package-nerd-significance:
    - >
      Gaze belongs to the family of small developer-loop CLIs where the package is
      valuable because it removes shell glue from everyday workflows. It is
      package-manager relevant as a single binary alternative to language-specific
      watchers, with defaults for many languages and no project-specific dependency
      stack.
  project-history:
    - >
      The official repository was created in 2019 and is maintained as a Go CLI. The
      project emphasizes out-of-the-box defaults, language-agnostic command execution,
      pattern matching, restart behavior, timeouts, multi-command runs, and a YAML
      configuration view.
  related-projects:
    - >
      Gaze is related to file-watching command runners and developer-loop automation
      tools. Its README explicitly compares the workflow to running tests, linters,
      builds, scripts, and server restarts after source changes.
  sources:
    - https://github.com/wtetsu/gaze
    - https://github.com/wtetsu/gaze#readme
    - https://github.com/wtetsu/gaze/releases
  summary:
    - >
      Gaze is a command-line file watcher that runs commands when files change. Its
      README describes the tool as a way to stay focused on code while Gaze reruns
      tests, linters, builds, scripts, or servers after saves.
  timeline:
    - '2019: The official GitHub repository was created.'
    - '2020s: The project published tagged releases and cross-platform binaries.'
    - >
      2020s: The README added AI-agent workflow examples alongside traditional
      save-and-run usage.
  usage:
    - >
      The simplest use is `gaze .` or `gaze a.py`; Gaze watches matching files and runs
      a default or user-specified command. Users can pass glob patterns, set a custom
      command with `-c`, restart previous processes with `-r`, set timeouts with `-t`,
      and inspect default YAML with `gaze -y`.
related-packages:
  - id: brew:watchexec
    reason: >
      Choose watchexec when you need recursive cross-platform watching with ignore-file
      support, event filtering, process supervision, or structured change events; choose
      Gaze for built-in language command defaults and a compact YAML configuration.
    rel: alternative
    sources:
      - https://github.com/wtetsu/gaze#readme
      - https://github.com/watchexec/watchexec#readme
      - https://watchexec.github.io/
  - id: brew:entr
    reason: >
      Choose entr for a minimal Unix pipeline where another command supplies the exact
      watched-file list on standard input; choose Gaze for glob discovery, built-in
      language defaults, and YAML configuration.
    rel: alternative
    sources:
      - https://github.com/wtetsu/gaze#readme
      - https://github.com/eradman/entr#readme
      - https://eradman.com/entrproject/
