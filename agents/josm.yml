history:
  adoption-history:
    - >
      JOSM became a long-running companion to OpenStreetMap and is maintained with
      tested releases, development builds, installers, and package-manager distribution.
      Its official help describes rapid growth since 2005.
    - >
      A broad extension ecosystem of plugins, presets, validation rules, map-paint
      styles, and imagery sources has made it especially useful for experienced and
      specialized OpenStreetMap contributors.
  package-nerd-significance:
    - >
      JOSM is one of the archetypal power-user applications in the OpenStreetMap
      ecosystem: a cross-platform Java desktop tool with monthly tested builds,
      development snapshots, extensive plugins, editable presets, validation rules, and
      configurable data directories. Package maintainers must account for both the Java
      application and native platform packaging.
  project-history:
    - >
      JOSM has accompanied OpenStreetMap since 2005. The project marked its twentieth
      anniversary in September 2025.
    - >
      It evolved into an extensible offline editor capable of loading OSM data, GPX
      tracks, and imagery; editing nodes, ways, relations, and tags; validating changes;
      and uploading changesets to OpenStreetMap.
  related-projects:
    - OpenStreetMap
    - Vespucci
    - iD editor
    - Potlatch
    - JOSM plugins
  sources:
    - https://josm.openstreetmap.de/
    - https://josm.openstreetmap.de/wiki/Help
    - https://josm.openstreetmap.de/wiki/Introduction
    - https://josm.openstreetmap.de/wiki/Plugins
    - https://josm.openstreetmap.de/wiki/VersionHistory
  summary:
    - >
      JOSM is an open-source, extensible Java desktop editor for creating and
      maintaining OpenStreetMap data.
  timeline:
    - '2005: JOSM began serving as a desktop editor for OpenStreetMap.'
    - '2006: The project published early video tutorials for installation and first edits.'
    - >
      2016: New Linux installations adopted XDG-based configuration directories
      beginning with revision 11162.
    - '2025-09-27: JOSM marked its twentieth anniversary.'
  usage:
    - >
      Mappers download a manageable area of OSM data, compare it with imagery or GPS
      traces, create or edit map objects and tags, validate the changes, and upload them
      in a documented changeset.
    - >
      Plugins, presets, map styles, imagery definitions, and validator rules adapt JOSM
      to specialized mapping workflows.
