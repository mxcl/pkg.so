history:
  adoption-history:
    - >
      RoslynPad is available through GitHub releases and multiple package channels,
      including the Microsoft Store, winget, and Homebrew Cask. Its cross-platform
      Avalonia application supports Windows, macOS, and Linux, while a supported .NET
      SDK supplies the compilation toolchain.
  package-nerd-significance:
    - >
      RoslynPad gives .NET developers a lightweight place to experiment with C# while
      retaining compiler-grade completion, diagnostics, fixes, package references, and
      execution. Its use of Roslyn makes the editor especially useful for exploring
      compiler behavior and APIs without creating a full IDE project.
  project-history:
    - >
      RoslynPad was created as an open-source C# editor and runner powered by
      Microsoft's Roslyn compiler platform. The project evolved from platform-specific
      editor components to an Avalonia-based cross-platform application.
    - >
      The Version 22 development line replaced AvalonEdit and AvaloniaEdit with
      Morgania, a new Avalonia editor based on the Visual Studio editor API, and ended
      the separate WPF application line.
  related-projects:
    - >
      RoslynPad is built around Microsoft Roslyn and the .NET SDK. Its current editor,
      Morgania, is implemented with Avalonia and is based on the Visual Studio editor
      API.
  sources:
    - 'Official RoslynPad README: https://github.com/roslynpad/roslynpad#readme'
    - 'Official RoslynPad releases: https://github.com/roslynpad/roslynpad/releases'
    - 'Official RoslynPad website: https://roslynpad.net/'
    - 'source_facts.package-manager.brew-cask: "roslynpad"'
  summary:
    - >
      RoslynPad is an MIT-licensed, cross-platform C# editor and runner that exposes
      Roslyn-powered completion, diagnostics, code fixes, package support, and real-time
      execution in a smaller environment than a full IDE.
  timeline:
    - >
      2026: The Version 22 line introduced the Morgania editor, consolidated the
      application on Avalonia, and ended the WPF version.
  usage:
    - >
      Developers use RoslynPad to write and execute C# file-based applications, inspect
      diagnostics and quick information, apply code fixes, navigate definitions, and add
      NuGet packages. A supported .NET SDK must be installed because RoslynPad relies on
      it to compile programs.
