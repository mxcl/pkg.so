history:
  adoption-history:
    - >
      Novabench has been available since 2007 and is distributed for Windows, macOS, and
      Linux. Its short guided benchmark and single comparative score make it
      approachable for individual users, while later paid functionality added stress
      testing, monitoring, portable operation, and fleet-oriented performance baselines.
  package-nerd-significance:
    - >
      Novabench is a long-lived proprietary cross-platform benchmark with a
      consumer-friendly composite score. Package-manager installation is useful when
      preparing repeatable test environments, although meaningful comparisons still
      require stable conditions and consistent benchmark generations.
  project-history:
    - >
      Novabench originated in 2007 as a computer performance benchmark. It evolved from
      a compact CPU, graphics, memory, and disk test into a broader performance suite
      with component comparisons, stress tests, sensors, network tests, and hardware
      diagnostics.
    - >
      Novabench 6, released in April 2026, was described by the project as its largest
      update since the original release. It redesigned reporting and test customization,
      expanded existing workloads, and added NPU, network, application, and explanatory
      analysis features.
  related-projects:
    - Geekbench
    - Cinebench
    - Phoronix Test Suite
  sources:
    - https://novabench.com/docs
    - https://novabench.com/docs/changelog
    - https://novabench.com/docs/novabench-6
    - https://novabench.com/docs/understanding-scores
  summary:
    - >
      Novabench is a proprietary cross-platform system benchmark that measures CPU, GPU,
      memory, storage, and supported NPU performance and combines the results into
      comparable component and overall scores.
  timeline:
    - '2007: Novabench was originally released.'
    - '2026-04-07: Novabench 6.0.0 introduced a redesigned interface and expanded test suite.'
    - '2026-09-18: Version 6.2.0 added local AI tests and expanded system inspection.'
  usage:
    - >
      Users close unnecessary background applications, run the three-to-four-minute
      benchmark, and inspect overall and component scores. Repeated runs help identify
      unstable performance, thermal issues, bottlenecks, or the effect of hardware and
      configuration changes. Optional online submission supplies comparisons and
      percentile rankings.
