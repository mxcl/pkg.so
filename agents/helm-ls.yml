history:
  adoption-history:
    - >
      helm-ls entered editor and package-manager workflows through Homebrew, mise, Nix,
      Arch/AUR, Scoop, Mason for Neovim, manual downloads, and editor-specific
      integrations documented in the README.
    - >
      The project is especially visible to Neovim, VS Code, Zed, and Emacs users because
      Helm templates are hard to edit well as plain YAML: Go template syntax, chart
      objects, values files, and generated Kubernetes resources all overlap.
  package-nerd-significance:
    - >
      helm-ls is packaging infrastructure for people who package Kubernetes
      applications. It makes charts feel like typed, navigable source code instead of
      loosely connected YAML, Go templates, and values files.
    - >
      For package managers, it is also a clean example of an LSP server distributed as a
      standalone CLI: the binary is useful only when editors can find it, so package
      names, executable names, and editor integration docs matter.
  project-history:
    - >
      The public repository was created in April 2022. GitHub release metadata shows the
      first tagged releases in March 2023, with the executable named `helm_ls`.
    - >
      The README shows a design centered on Helm template files, values files, chart
      dependencies, `helm lint`, and optional yaml-language-server integration. That
      puts the tool between Helm's chart semantics and general-purpose editor LSP
      clients.
  related-projects:
    - Helm supplies the chart and template model.
    - >
      yaml-language-server provides optional YAML diagnostics, hover, completion, and
      schema support.
    - >
      Neovim LSP clients, coc.nvim, VS Code, Zed, and Emacs Eglot are documented editor
      integration targets.
    - >
      helm-docs is a neighboring chart-authoring tool focused on generated README
      documentation rather than live editor assistance.
  sources:
    - https://api.github.com/repos/mrjosh/helm-ls
    - https://github.com/mrjosh/helm-ls
    - https://github.com/mrjosh/helm-ls/releases
  summary:
    - >
      helm-ls is a language server for Helm chart development. Its README describes it
      as a Helm Language Server Protocol implementation, with editor setup examples and
      integration with yaml-language-server for additional YAML capabilities.
    - >
      The project reflects a shift in Kubernetes packaging from command-line-only chart
      authoring toward editor-assisted workflows with completion, hover, diagnostics,
      references, and values-file awareness.
  timeline:
    - '2022: Public GitHub repository created.'
    - '2023: v0.0.1 release published.'
    - '2023: Early v0.0.x releases establish the standalone `helm_ls` binary.'
    - >
      2020s: README documents package-manager installs, yaml-language-server
      integration, and editor configuration examples.
  usage:
    - >
      Users install the `helm_ls` binary and configure an editor LSP client to run it,
      often with `helm_ls serve`. For some editors, the README provides filetype
      detection and client configuration examples.
    - >
      helm-ls can use yaml-language-server to process rendered or converted template
      content, generate schemas for values files, expose completion and hover data, run
      diagnostics from `helm lint`, and process dependency charts after `helm dependency
      build`.
related-packages:
  - id: brew:helm
    reason: >
      helm-ls invokes Helm-aware workflows such as chart dependency processing and `helm
      lint`, so the Helm CLI is its core chart-authoring companion.
    rel: adjacent_workflow
    sources:
      - https://github.com/mrjosh/helm-ls#readme
      - https://helm.sh/docs/helm/helm_lint/
  - id: brew:yaml-language-server
    reason: >
      helm-ls has a documented optional integration with YAML Language Server for
      schema-backed completion, hover information, symbols, and diagnostics in chart
      templates and values files.
    rel: adjacent_workflow
    sources:
      - https://github.com/mrjosh/helm-ls#readme
      - https://github.com/redhat-developer/yaml-language-server#readme
