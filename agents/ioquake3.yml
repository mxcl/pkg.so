credentials-file-location: null
history:
  adoption-history:
    - >
      ioquake3 became a maintained modern distribution of the Quake III engine and a
      base for ports, standalone games, and other projects. The project moved its active
      source development from icculus.org-hosted Subversion to GitHub in 2013, making
      forks and pull requests part of its development workflow.
    - >
      Its continuing portability work supports Windows, macOS, Linux, and other systems,
      while retaining compatibility with Quake III Arena, Team Arena, and most
      established mods.
  package-nerd-significance:
    - >
      ioquake3 is a canonical example of a proprietary game's engine becoming a
      long-lived free-software platform after a source release. It separates the GPL
      engine from the still-proprietary Quake III game data, a distinction that
      downstream packages and users must preserve.
    - >
      Its modern per-user filesystem layout, dedicated-server support, extensive
      console-variable configuration, mod compatibility, and use as a foundation for
      standalone games make it important to game-engine packagers and source-port
      enthusiasts.
  project-history:
    - >
      id Software released the Quake III Arena and Team Arena engine source under GPL
      version 2 on August 20, 2005. The earliest ioquake3 commits followed at
      icculus.org on August 25, 2005, establishing a community effort to clean up, port,
      secure, and extend the engine.
    - >
      The name reflects the project's origin in the icculus.org software incubator: ioq3
      is the abbreviated form, while ioquake3 is the full project name. Development
      continued after the original commercial client stopped receiving fixes, with the
      community maintaining modern platform support and carefully adding features.
  related-projects:
    - >
      ioquake3 is derived from the Quake III Arena and Quake III: Team Arena engine
      source. It runs their games and mods when users provide the proprietary data, and
      it also serves as a source base for independent games and ports.
  sources:
    - >
      Official 2013 GitHub migration announcement:
      https://ioquake3.org/ioquake3/happy-new-year-ioquake3-and-github/
    - 'Official About page: https://ioquake3.org/about/'
    - "Official Player's Guide: https://ioquake3.org/help/players-guide/"
    - 'Official repository README: https://github.com/ioquake/ioq3/blob/main/README.md'
    - >
      Official twentieth-anniversary history:
      https://ioquake3.org/ioquake3/20-years-of-ioquake3/
  summary:
    - >
      ioquake3 is the community-maintained free-software continuation of the Quake III
      Arena engine, used to play the original games and mods and to build new games.
  timeline:
    - '2005-08-20: id Software released the Quake III engine source under GPL version 2.'
    - '2005-08-25: Initial ioquake3 commits were made in Subversion at icculus.org.'
    - >
      2013: Active source development moved from Subversion to the ioquake organization
      on GitHub.
    - '2025: The project marked twenty years of ioquake3 development.'
  usage:
    - >
      Players install the engine and supply the legally obtained Quake III data file
      pak0.pk3; the engine itself is free software, but the original game's assets are
      not. Users can play Arena, Team Arena, and compatible mods, while administrators
      can run dedicated servers using the official Sys Admin Guide. Developers can fork
      the engine to create ports or standalone games.
