history:
  adoption-history:
    - >
      Lasso entered the crowded macOS window-management category with an interaction
      model centered on drawing a window's desired area on a configurable grid. Later
      releases broadened the workflow with layouts, global shortcuts, multi-display
      behavior, and modifier-key mouse movement.
    - >
      The official changelog records continuing development through version 1.8.2 and
      notes that Lasso joined Setapp in version 1.8.1, expanding its distribution beyond
      direct licensing and Homebrew Cask.
  package-nerd-significance:
    - >
      Lasso is notable to Mac package users as a polished, proprietary alternative to
      shortcut-centric tiling utilities. Its presence in Homebrew Cask makes a normally
      GUI-driven commercial utility reproducibly installable alongside command-line
      tooling.
  project-history:
    - >
      The official privacy policy identifies Ivan Sapozhnik as the operator of the Lasso
      application. The site's changelog documents releases across multiple years,
      including version 1.7.0 in April 2024 and version 1.8.0 in March 2025.
  related-projects:
    - >
      Rectangle and Magnet are neighboring macOS window managers; Lasso's official site
      provides importable layouts and shortcuts intended to ease migration from them.
  sources:
    - 'Official changelog: https://www.thelasso.app/changelog'
    - 'Official homepage: https://www.thelasso.app/'
    - 'Official privacy policy: https://www.thelasso.app/privacy-policy'
    - 'source_facts.package-manager: brew-cask/lasso-app'
  summary:
    - >
      Lasso is a macOS window manager built around a visual grid for moving and resizing
      windows. It also supports saved layouts, keyboard shortcuts, multiple displays,
      layout import and export, and iCloud preference synchronization.
  timeline:
    - "2023: The official privacy policy took effect and identified the app's operator."
    - '2024: Version 1.7.0 added switching between grid and layout modes.'
    - >
      2025: Version 1.8.0 added modifier-key mouse movement and improved cross-display
      workflows.
    - "2025: Version 1.8.1 marked Lasso's addition to Setapp."
    - >
      2025: Version 1.8.2 delivered performance, window-detection, and reliability
      improvements.
  usage:
    - >
      Users invoke Lasso over a target window, draw the desired region on a configurable
      grid, or apply a saved layout or global shortcut. It is aimed particularly at
      multi-window and multi-monitor desktop workflows.
    - >
      Homebrew users can install the packaged application with `brew install --cask
      lasso-app`; licensing remains managed through Lasso's own service.
