history:
  adoption-history:
    - >
      Cork has attracted Homebrew users who prefer a native graphical interface for
      browsing and maintaining formulae, casks, taps, caches, and services. Its official
      GitHub repository has accumulated thousands of stars, indicating substantial
      visibility within the macOS package-management community.
    - >
      The project permits free self-compilation while distributing current precompiled
      builds through the developer's Homebrew tap, including access obtained through
      purchase or project contribution.
  package-nerd-significance:
    - >
      Cork is directly concerned with package-manager culture: it visualizes Homebrew
      state, distinguishes intentionally installed packages from dependencies, supports
      selective upgrades, exposes reverse-dependency information, manages services, and
      adds package tagging.
    - >
      It demonstrates a recurring ecosystem pattern—a native GUI layered over a
      command-line package manager and distributed through that same package
      manager—while remaining open source and independently developed.
  project-history:
    - >
      David Bureš created Cork as an open-source, native macOS interface for Homebrew,
      implemented primarily with SwiftUI. Development, issues, source-build
      instructions, and releases are maintained publicly in the official GitHub
      repository.
    - >
      The project grew beyond basic install and uninstall operations to include tap
      inspection, cache maintenance, service management, package previews, dependency
      information, tagging, and menu-bar updates. Version 2.0.0, released in August
      2026, was described by its developer as a comprehensive rewrite affecting every
      major subsystem.
  related-projects:
    - >
      Cork is a graphical companion to Homebrew and works with Homebrew formulae, casks,
      taps, caches, and services. It does not replace Homebrew's repositories or package
      definitions.
  sources:
    - https://blog.corkmac.app/archive
    - https://blog.corkmac.app/p/cork-200-is-out-everything-changed
    - https://corkmac.app/
    - https://github.com/buresdv/Cork
    - https://github.com/buresdv/Cork/releases
  summary:
    - >
      Cork is an open-source native macOS GUI for Homebrew. It provides graphical
      workflows for installing, removing, inspecting, updating, and organizing Homebrew
      packages and taps, along with maintenance and service controls.
  timeline:
    - >
      2024: Cork 1.4 expanded licensing, service management, and package-preview
      functionality.
    - >
      2025: Cork 1.6 introduced a new bundle identifier and major internal changes; the
      1.7 series followed later that year.
    - '2026: Cork 2.0.0 completed a broad rewrite and was released on August 23.'
  usage:
    - >
      Users run Cork with an existing Homebrew installation to search for formulae and
      casks, add taps, install or uninstall packages, inspect dependencies and package
      metadata, update selected packages, clear caches, and manage Homebrew services.
    - >
      Cork remains a front end to Homebrew: packages, taps, installation prefixes, and
      most underlying state continue to be owned by Homebrew. Developers can also clone
      the official repository and follow its documented Tuist/Xcode build process.
