history:
  adoption-history:
    - >
      CleanClip is distributed as a native macOS application and through Homebrew Cask.
      Later releases added iCloud synchronization with an iOS edition, extending saved
      clipboard items, groups, and presets across Apple devices.
  package-nerd-significance:
    - >
      CleanClip belongs to the long-running macOS clipboard-manager category but
      emphasizes keyboard-driven quick menus, paste queues, pinboards, structured
      history, and Apple-platform synchronization. Its direct-download Homebrew cask
      offers a package-managed alternative to manual application installation.
  project-history:
    - >
      CleanClip emerged in 2023 as a clipboard-history utility for macOS. Early releases
      rapidly added search, image and file capture, history previews, configurable
      retention, ignored applications, and a paste stack.
    - >
      Version 2.0 in January 2024 expanded the application with desktop pinned windows,
      batch management, favorites, smart lists, filters, drag-and-drop workflows, and
      foreground-application following. Subsequent releases continued adding workflow
      customization and cross-device synchronization.
  related-projects:
    - >
      CleanClip for iOS synchronizes clipboard items, groups, and presets with the Mac
      edition through iCloud.
    - Homebrew Cask provides package-managed installation of the macOS application.
  sources:
    - 'Official documentation: https://www.cleanclip.cc/gb/docs/'
    - 'Official release notes: https://cleanclip.cc/docs/changelog'
    - source_facts.homepage
    - source_facts.provenance
  summary:
    - >
      CleanClip is a native clipboard-history and paste-workflow application for macOS.
      It records multiple content types and provides search, quick access, paste stacks,
      pinboards, lists, and synchronization features.
  timeline:
    - >
      2023: Early public releases added search, image and file recording, previews,
      paste stacks, ignored applications, and pinboards.
    - >
      2024: CleanClip 2.0 introduced pinned desktop windows, batch management,
      favorites, smart lists, filters, and expanded drag-and-drop support.
    - >
      2026: The release line represented by the input had reached version 2.4.7 and
      included continued performance and iCloud-sync work.
  usage:
    - >
      Users invoke CleanClip's quick menu to search clipboard history and paste previous
      items without repeatedly switching applications.
    - >
      Paste Stack supports queued pasting, while pinboards, favorites, smart lists,
      filters, and pinned windows organize frequently reused content.
