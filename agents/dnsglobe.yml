credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through Homebrew, crates.io, Arch User
      Repository packages, Nix, and prebuilt GitHub releases. This gives the young
      project several package-oriented distribution paths across macOS and Linux.
  package-nerd-significance:
    - >
      dnsglobe packages DNS-propagation checking as a local, scriptable terminal program
      rather than a browser service. Its Rust implementation, single executable, TUI,
      watch mode, ECS support, and optional Nix flake make it particularly congenial to
      terminal-focused operators.
  project-history:
    - >
      514 Labs developed dnsglobe as a Rust terminal interface for comparing DNS records
      across public resolvers worldwide. It combines a compact resolver table with an
      adaptive map or globe and can repeatedly poll until a record converges.
    - >
      The project also supports noninteractive output, custom resolvers, EDNS Client
      Subnet probes, resolver-site discovery, and user-defined themes. These features
      move it beyond a decorative TUI into a practical DNS deployment diagnostic.
  related-projects:
    - >
      The official README presents dnsglobe as a terminal-oriented counterpart to web
      propagation checkers such as dnschecker.org and whatsmydns.net. Related
      command-line DNS diagnostics include dig and doggo.
  sources:
    - https://github.com/514-labs/dnsglobe#readme
  summary:
    - >
      dnsglobe is a Rust TUI and command-line DNS propagation checker that queries
      public resolvers in parallel and visualizes agreement, latency, TTLs, and
      geographic distribution.
  timeline:
    - '2020s: 514 Labs publishes dnsglobe as an open-source Rust project.'
    - '2020s: Distribution expands to Homebrew, crates.io, AUR, Nix, and prebuilt releases.'
  usage:
    - >
      Users provide a domain and optional record type, then watch answers converge
      across public resolvers. The --once mode supports scripts, while configuration can
      add private resolvers, replace the built-in resolver set, select the
      visualization, configure ECS networks, and customize colors.
