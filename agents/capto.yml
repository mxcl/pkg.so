history:
  adoption-history:
    - >
      Global Delight offered an upgrade path from its earlier Voila capture application,
      describing Capto as an all-new successor with a broader capture, editing,
      organization, and sharing workflow.
    - >
      Capto initially targeted macOS users and was expanded to Windows in 2024,
      broadening the product beyond its original Mac-focused audience.
  package-nerd-significance:
    - >
      Capto represents the commercial, integrated end of the screen-capture package
      spectrum: capture, recording, annotation, lightweight editing, asset organization,
      and sharing are bundled in one desktop application.
    - >
      For Mac package users, the cask provides a reproducible installation path for a
      product otherwise distributed through Global Delight and the Mac App Store.
  project-history:
    - >
      Global Delight announced Capto on April 27, 2016 as a newly built end-to-end
      screen-capture and video-editing application for Mac.
    - >
      The product inherited the use case and upgrade audience of Global Delight's Voila
      while adding HD recording, a video-editing timeline, image annotation, smart
      organization, and sharing services.
    - >
      Global Delight introduced a Windows edition on September 25, 2024, retaining the
      core screen-capture, recording, and editing model.
  related-projects:
    - Voila is Capto's predecessor in Global Delight's screen-capture product line.
    - Global Delight also develops media applications such as Boom and Vizmato.
  sources:
    - https://www.globaldelight.com/capto/user-guide.php
    - https://www.globaldelight.com/pd/upgrade-capto
    - >
      https://www.globaldelight.com/press-pages/2016/capto-a-new-screen-capture-app-that-combines-powerful-video-recording-and-editing
    - >
      https://www.globaldelight.com/press-pages/2024/GlobalDelight-Screen-Capture-and-Recording-for-Windows-Capto.php
  summary:
    - >
      Capto is Global Delight's desktop application for capturing screenshots and screen
      recordings, editing and annotating the results, organizing them in a library, and
      exporting or sharing them.
  timeline:
    - '2016: Global Delight announces Capto for Mac.'
    - '2023: A full-feature trial becomes available through the Mac App Store.'
    - '2024: Global Delight introduces Capto for Windows.'
  usage:
    - >
      Typical workflows capture a full screen, window, region, webpage, camera, or
      connected iOS device; users then annotate images or trim, crop, join, and annotate
      video.
    - >
      Capto stores work in a user-selected library whose location can be changed in
      Preferences. Because the official guide does not document a fixed settings-file
      path, config-file-location is null.
