history:
  adoption-history:
    - >
      GIFLIB's own history records that the Unix port was incorporated into NCSA Mosaic
      in 1994, making it part of the early web's image stack. The project describes the
      code as deployed across browsers, graphics applications, operating systems,
      smartphones, game consoles, and embedded devices.
  package-nerd-significance:
    - >
      GIFLIB matters to package maintainers because it is small, mature image
      infrastructure with a large reverse-dependency surface. ABI changes, security
      hardening, fuzzing fixes, and utility packaging decisions carry ecosystem weight
      beyond the package's size.
  project-history:
    - >
      GIFLIB traces its code lineage to a DOS library and command-line tool set written
      by Gershon Elber between the GIF87 and GIF89 specifications, with version 1.0
      dated June 1989. Eric S. Raymond ported the code to System V Unix by the end of
      1989 and reworked parts of the API between 1989 and 1992.
    - >
      During the LZW patent era, part of the code base traveled as libungif with GIF
      compression removed. Compression support was merged back after the blocking patent
      expired in 2004, and the project resumed the giflib name. In 2012, Raymond
      returned to project leadership and released 4.2 and 5.0, with 5.0 addressing
      thread safety, GIF89 control blocks, and obsolete utility cleanup.
  related-projects:
    - >
      libungif is part of GIFLIB's patent-era history. Gifsicle, ImageMagick, browser
      engines, and many image-processing stacks occupy adjacent or dependent parts of
      the GIF ecosystem.
  sources:
    - https://giflib.sourceforge.net/
    - https://giflib.sourceforge.net/gif_lib.html
    - https://giflib.sourceforge.net/history.html
    - https://sourceforge.net/p/giflib/code/ci/master/tree/
  summary:
    - >
      GIFLIB is the long-lived C service library and utility collection for reading,
      writing, inspecting, and transforming GIF images.
  timeline:
    - '1989: GIFLIB 1.0 dated in the original DOS lineage.'
    - '1994: GIFLIB-derived code used in NCSA Mosaic.'
    - '1998: Toshio Kuratomi shipped 4.0.'
    - '2004: Compression support merged back after patent expiry.'
    - '2012: Version 5.0 released with thread-safety and GIF89 API work.'
    - '2026: Upstream SourceForge code browser shows active 6.x maintenance.'
  usage:
    - >
      Practitioners use GIFLIB through its C API and through utilities such as gifbuild,
      gifclrmp, giffix, giftext, and giftool. The library supports sequential GIF I/O
      and whole-image in-memory workflows, while the utility set helps inspect, repair,
      compose, and transform GIF files.
related-packages:
  - id: brew:gifsicle
    reason: >
      Choose Gifsicle when the goal is high-level command-line animation editing and
      optimization rather than embedding GIF read/write support in an application.
    rel: alternative
    sources:
      - https://giflib.sourceforge.net/gif_lib.html
      - https://www.lcdf.org/gifsicle/
      - https://www.lcdf.org/gifsicle/man.html
  - id: brew:imagemagick
    reason: >
      Choose ImageMagick for a broader multi-format command-line and library suite when
      GIF processing is only one part of the required image workflow.
    rel: alternative
    sources:
      - https://giflib.sourceforge.net/gif_lib.html
      - https://imagemagick.org/command-line-processing/
      - https://imagemagick.org/formats/
