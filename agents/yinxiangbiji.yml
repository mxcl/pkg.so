history:
  adoption-history:
    - >
      印象笔记 entered China in May 2012 as Evernote's independent Chinese brand. Its
      service, application, accounts, and data remained separate from the international
      Evernote service.
    - >
      Following its 2018 reorganization, the independently operated company adapted the
      platform for Chinese users with features including Markdown, templates, desktop
      notes, mind maps, OCR, collaboration, and locally oriented integrations.
  package-nerd-significance:
    - >
      印象笔记 is notable as a regionally independent branch of the Evernote lineage,
      sharing historical product foundations while maintaining separate accounts, data,
      applications, infrastructure, and subsequent feature development. The Homebrew
      Cask packages the Chinese Mac client distinctly from international Evernote.
  project-history:
    - >
      印象笔记 began serving China in 2012 as the independent Chinese Evernote brand. In
      June 2018, its management, Evernote, and investors completed an independent
      reorganization and formed a joint venture that inherited shared source code and
      intellectual property while operating the Chinese service independently.
    - >
      The company states that it migrated the service to Tencent Cloud during the first
      half of 2018. Later Mac releases added capabilities such as mind maps, real-time
      collaborative editing, materials management, and expanded note-history features.
  related-projects:
    - >
      Related products in the 印象 ecosystem include 印象笔记·剪藏, Verse, 扫描宝, 印象清单, 印象录音机, and
      印象TEAMS. Evernote is the historically related but operationally separate
      international service.
