  summary:
    - >
      印象笔记 is a Chinese note-taking and knowledge-management service descended from
      Evernote's China operation but independently operated with separate applications,
      accounts, data, infrastructure, and China-focused features.
  timeline:
    - "2012: 印象笔记 entered China as Evernote's independent Chinese brand."
    - >
      2018: 印象笔记 completed an independent reorganization and migrated its service to
      Tencent Cloud.
    - '2019: The Mac client introduced mind-map notes in a beta release.'
    - '2021: The Mac client added real-time collaborative editing and enhanced note history.'
  usage:
    - >
      Users capture, organize, search, synchronize, annotate, and share notes and
      attachments across devices. The Mac client supports desktop capture, shortcuts,
      offline work, templates, Markdown-oriented workflows, and collaboration;
      account-backed synchronization is central to multi-device use.
