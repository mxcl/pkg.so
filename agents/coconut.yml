history:
  adoption-history:
    - >
      Coconut's adoption has been strongest in Python package and language-experiment
      circles rather than as a mainstream application runtime. Official install guidance
      leads with pip, while the Homebrew input records distribution through Homebrew and
      Nix, showing that it also reached system package-manager catalogs used by
      CLI-oriented developers.
  package-nerd-significance:
    - >
      For package nerds, Coconut is interesting as a small language toolchain that rides
      on Python packaging while also appearing in OS package managers. It shows the
      common pattern where an experimental language compiler starts with PyPI
      distribution and later becomes convenient to install through Homebrew or Nix for
      shell-first workflows.
  project-history:
    - >
      The public GitHub repository was created in 2014, and the project positions itself
      as a language variant rather than a standalone runtime: Coconut source is compiled
      into Python code. The README and documentation emphasize GitHub development, PyPI
      hosting, and a language design centered on functional programming constructs such
      as pipes, pattern matching, partial application, and enhanced lambdas.
  related-projects:
    - >
      Coconut is related to Python itself, PyPI packaging, IPython/Jupyter integration,
      xonsh integration, and the broader family of Python-compatible language extensions
      that compile down to Python.
  sources:
    - https://github.com/evhub/coconut
    - https://coconut-lang.org/
    - https://coconut.readthedocs.io/en/latest/DOCS.html
    - https://github.com/evhub/coconut/releases
    - https://pypi.org/project/coconut/
  summary:
    - >
      Coconut is a Python-family functional programming language and compiler. Its
      official documentation describes it as a strict superset of Python syntax that
      compiles to Python, adding functional features while remaining close to the Python
      ecosystem.
  timeline:
    - '2014: GitHub repository for evhub/coconut created.'
    - '2016: Public documentation and PyPI distribution were already central to the project.'
    - '2024: Coconut 3.1.x releases continued active maintenance.'
    - '2025: Coconut 3.2.0 added Python 3.14 support, according to the official release notes.'
  usage:
    - >
      Users install Coconut as a command-line compiler and run it to compile or execute
      Coconut source files. The official docs cover installation through pip, conda, and
      Homebrew, plus integrations for IPython/Jupyter, type checking, numpy, and xonsh.
related-packages:
  - id: brew:xonsh
    reason: >
      Coconut integrates with xonsh so Coconut syntax can be used directly in the shell,
      including command-pipeline workflows.
    rel: adjacent_workflow
    sources:
      - https://coconut.readthedocs.io/en/latest/DOCS.html#xonsh-support
      - https://xon.sh/
  - id: brew:ipython
    reason: >
      Coconut can run as an IPython extension or kernel, making IPython the strongest
      companion for an interactive Coconut console.
    rel: adjacent_workflow
    sources:
      - https://coconut.readthedocs.io/en/latest/DOCS.html#ipython-jupyter-support
      - https://ipython.org/
  - id: brew:jupyterlab
    reason: >
      Coconut installs a Jupyter kernel and documents a JupyterLab extra for running
      Coconut code in notebooks.
    rel: adjacent_workflow
    sources:
      - https://coconut.readthedocs.io/en/latest/DOCS.html#ipython-jupyter-support
      - https://jupyter.org/
