credentials-file-location: null
history:
  adoption-history:
    - >
      FS-UAE spread through both emulator-user channels and OS package managers because
      it provided a portable Amiga emulator with game-focused defaults and a
      database-driven launcher. The official download page lists Windows, macOS, Linux,
      Ubuntu, Debian, Fedora, and openSUSE targets.
    - >
      Homebrew packages the CLI-oriented emulator binary on macOS, while other
      distributions package FS-UAE for retro-gaming and preservation workflows.
  package-nerd-significance:
    - >
      FS-UAE is significant for package people because it packages decades of UAE/WinUAE
      emulator lineage into a cross-platform Unix-friendly command while still tracking
      a complex upstream codebase. Its repo structure and WinUAE superset note are a
      reminder that emulator packages often carry large imported cores, platform glue,
      and frontend-adjacent tooling together.
  project-history:
    - >
      FS-UAE is based on WinUAE's Amiga emulation code, which itself builds on the
      original UAE lineage. The official site states that FS-UAE is copyright 2011-2025
      Frode Solheim and contributors, and the GitHub README notes that the repository is
      now a superset of the WinUAE repository to make shared code comparison, merging,
      and test builds easier.
    - >
      The project has a long source history, with thousands of commits in the upstream
      repository and a large option surface documented on the official site. Recent
      official news shows the 3.2.x line continuing in 2025 alongside early FS-UAE 5
      alpha releases.
  related-projects:
    - WinUAE is the direct emulation-code ancestor and ongoing comparison point.
    - >
      The original UAE project is the older emulator lineage referenced by the official
      FS-UAE site.
    - >
      OpenRetro is linked from the official site as an online game database related to
      FS-UAE usage.
  sources:
    - https://fs-uae.net/
    - https://fs-uae.net/docs
    - https://fs-uae.net/docs/options
    - https://fs-uae.net/download
    - https://github.com/FrodeSolheim/fs-uae
  summary:
    - >
      FS-UAE is a cross-platform Amiga emulator for Windows, macOS, and Linux, with a
      particular focus on games. The project also offers a launcher and arcade frontend,
      while the `fs-uae` package exposes the emulator command-line program.
  timeline:
    - '2011: FS-UAE copyright history begins according to the official site.'
    - '2012: The official website copyright period begins.'
    - '2025: FS-UAE 3.2.35 was released.'
    - '2025: Early FS-UAE 5 alpha releases were announced.'
  usage:
    - >
      Users run FS-UAE with configuration files and options that describe the Amiga
      model, ROMs, floppy and hard-drive images, controllers, display behavior, JIT
      settings, save states, and many lower-level UAE options. The official options
      documentation maps FS-UAE-specific option names and UAE-compatible low-level
      options.
    - >
      The package is especially useful for scripted launches, emulator frontends, and
      reproducible configurations where a user or launcher can point `fs-uae` at a
      specific configuration file.
related-packages:
  - id: cask:amiberry
    reason: >
      Choose Amiberry when you want a WinUAE-derived Amiga emulator with especially
      strong ARM and appliance-style support; FS-UAE emphasizes its own cross-platform
      game and launcher workflow.
    rel: alternative
    sources:
      - https://amiberry.com/
      - https://github.com/BlitterStudio/amiberry#readme
      - https://fs-uae.net/
