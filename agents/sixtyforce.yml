history:
  adoption-history:
    - >
      sixtyforce became a long-running Mac-specific N64 emulator, spanning classic
      PowerPC Macs, Intel Macs, and later Rosetta operation on Apple silicon. Its
      official archive retains builds for older macOS and PowerPC systems.
  package-nerd-significance:
    - >
      It is notable as a survivor of the classic Mac emulation scene and for its
      architecture-specific dynamic recompilers. The official news archive says it was
      the first N64 emulator to dynamically recompile for both PowerPC and Intel.
  project-history:
    - >
      The project's official news says portions of its interface descended from code
      written in 1998. The site has carried a sixtyforce copyright since 2000, and
      development proceeded through a long 0.x series before 1.0.
    - >
      Version 2.0 completed a substantial Swift conversion in 2020. The developer
      subsequently described further recompiler work as necessary for native
      Apple-silicon performance.
  related-projects:
    - >
      Nintendo 64 emulators such as Mupen64Plus and Project64 occupy the same broader
      emulation ecosystem, while sixtyforce is distinguished by its Mac-focused history.
  sources:
    - https://sixtyforce.com/
    - https://sixtyforce.com/download/
    - https://sixtyforce.com/news.html
    - https://sixtyforce.com/version_history.html
  summary:
    - >
      sixtyforce is a proprietary Nintendo 64 emulator created by Gerrit Goossen for
      macOS. It translates N64 game code at runtime and supplies Mac-native interfaces
      for cartridges, saved states, controllers, graphics, and audio.
  timeline:
    - '1998: Roots of the original interface code, according to the official news archive.'
    - >
      2000: The project was publicly established by this period, reflected in its
      official copyright notice.
    - "2020: sixtyforce 2.0 completed the application's Swift conversion."
    - '2020: Version 2.0.2 improved the automatic updater.'
  usage:
    - >
      Users open legally obtained N64 cartridge images, configure keyboard or USB game
      controllers, and use game freezes and emulated cartridge storage for saved state.
      Compatibility and performance vary by game and Mac architecture.
