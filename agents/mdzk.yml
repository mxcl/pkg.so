credentials-file-location: null
history:
  adoption-history:
    - >
      The official documentation lists installation through Cargo, AUR, Homebrew, Nix,
      and GitHub release binaries. The 0.5.2 GitHub release repeats the package-manager
      install commands, making mdzk unusually package-manager-friendly for a personal
      knowledge-base tool.
  package-nerd-significance:
    - >
      mdzk is interesting to package nerds because it packages a Zettelkasten graph
      workflow as a single CLI, with explicit support across Cargo, Homebrew, Nix, AUR,
      and prebuilt release assets. Its history also shows the common Rust CLI pattern of
      shipping a static-site feature first, then narrowing into a composable backend.
  project-history:
    - >
      The original 0.4 and 0.5 releases were close to the mdBook/static-site-generator
      world: release notes describe mdBook-oriented configuration, rendering,
      preprocessors, CSS customization, and generated sites. The current README says the
      project is under heavy development and advises users who want a usable static-site
      generator to use the previous-generation 0.5.2 release.
    - >
      The unreleased 1.0.0 changelog marks a major pivot: static site generation is
      removed, regular Markdown links replace wikilinks, and mdzk becomes a CLI or
      library for querying note vaults for forward and backward links.
  related-projects:
    - mdBook, Hugo, Zola, Rust, Cargo, Zettelkasten note systems.
  sources:
    - https://github.com/mdzk-rs/mdzk#readme
    - https://github.com/mdzk-rs/mdzk/releases
    - https://mdzk.app/docs
    - https://raw.githubusercontent.com/mdzk-rs/mdzk/main/CHANGELOG.md
  summary:
    - >
      mdzk is a Rust command-line tool for plain-text Zettelkasten notes. Its official
      README calls it a backend for connected notes that can process Markdown folders
      into a directed graph.
  timeline:
    - '2021: Version 0.4.0 adds precompiled x86 Linux binaries and mdzk table configuration.'
    - '2022: Version 0.5.0 expands preprocessor controls and performance improvements.'
    - '2022: Version 0.5.2 becomes the documented previous-generation static-site release.'
    - >
      Unreleased: Version 1.0.0 removes built-in static site generation and focuses on
      querying note vault links.
  usage:
    - >
      mdzk operates on a vault, where a filesystem directory contains Markdown notes and
      internal links create graph edges. Documentation says mdzk recursively finds
      Markdown files, loads them as graph nodes, and builds relationships from links.
related-packages:
  - id: brew:zk
    reason: >
      Choose zk when you need a mature plain-text Zettelkasten CLI with templates,
      advanced search, editor/LSP integrations, and interactive browsing while mdzk's
      next-generation backend remains under development.
    rel: alternative
    sources:
      - https://github.com/mdzk-rs/mdzk#readme
      - https://github.com/zk-org/zk#readme
      - https://zk-org.github.io/zk
