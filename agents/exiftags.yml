history:
  adoption-history:
    - >
      The project is niche, but its homepage documents the kind of adoption common to
      early photo-management tools: ports and packages, Windows binaries, and a list of
      other small applications that used exiftags for gallery generation, thumbnailing,
      viewing, and EXIF access.
  package-nerd-significance:
    - >
      For package collectors, exiftags is a snapshot of the pre-smartphone
      digital-camera era: a tiny C-style utility focused on JPEG camera metadata, maker
      notes, captions, and timestamp repair.
  project-history:
    - >
      Eric Johnston originally wrote exiftags to support his photoweb script. The
      project page lists version 1.01 as the current release, under a BSD license, with
      source, RPM, Windows, FreeBSD, Debian, and other package links.
  related-projects:
    - >
      exiftags ships with exifcom and exiftime, and was originally written for the
      author's photoweb script.
  sources:
    - https://johnst.org/sw/exiftags/
  summary:
    - >
      exiftags is a compact JPEG EXIF inspection utility with companion tools for EXIF
      comments and image timestamps.
  timeline:
    - '1.01: The project page lists exiftags 1.01 as the current version.'
    - '2007: The project page was last modified with version 1.01 and package links.'
  usage:
    - >
      exiftags reads JPEG APP1 EXIF metadata from a file or standard input and prints
      properties to standard output. exifcom reads or writes UserComment metadata, while
      exiftime displays, adjusts, and sorts by EXIF date and time tags.
related-packages:
  - id: brew:exiftool
    reason: >
      Choose ExifTool for actively maintained, cross-format metadata reading and batch
      editing; choose exiftags for its small JPEG-camera-oriented tool trio.
    rel: alternative
    sources:
      - https://johnst.org/sw/exiftags/
      - https://exiftool.org/exiftool_pod.html
  - id: brew:jhead
    reason: >
      Choose jhead when JPEG timestamp renaming, metadata stripping, thumbnail handling,
      or orientation-based rotation matters more than exiftags' separate comment and
      time utilities.
    rel: alternative
    sources:
      - https://johnst.org/sw/exiftags/
      - https://github.com/Matthias-Wandel/jhead
  - id: brew:exif
    reason: >
      Choose exif for libexif-backed reading and direct creation, modification, or
      removal of recognized JPEG EXIF tags.
    rel: alternative
    sources:
      - https://johnst.org/sw/exiftags/
      - https://libexif.github.io/man/exif.html
