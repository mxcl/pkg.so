config-file-location:
  macos:
    - ~/Library/Application Support/abnerworks.Typora/
    - ~/Library/Preferences/abnerworks.Typora.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Typora gained a broad user community during its long public-beta period by
      offering a single live editing surface rather than separate Markdown source and
      preview panes. Its official GitHub organization hosts issue tracking, support
      content, translations, themes, and other customization resources even though the
      application itself is closed source.
    - >
      After version 1.0, continued use required a purchased license. Typora remained
      cross-platform on macOS, Windows, and Linux and retained its plain-text Markdown
      workflow, theme ecosystem, mathematical notation, diagrams, export tools, and
      optional Pandoc integration.
  package-nerd-significance:
    - >
      Typora is a common example of a proprietary desktop application delivered through
      binary package channels while surrounding documentation, themes, translations, and
      issue tracking remain public on GitHub. Its plain Markdown files reduce data
      lock-in, but the application binary is not represented by any public source
      repository.
  project-history:
    - >
      Typora was developed as a minimal Markdown editor that merges writing and rendered
      presentation into one continuous interface. It spent several years in public beta
      while expanding its Markdown, mathematics, diagramming, file-management, theming,
      and export capabilities.
    - >
      Version 1.0 was released on November 23, 2021, ending the public beta and changing
      Typora to paid commercial software requiring license activation.
  related-projects:
    - Pandoc
    - Typora themes
    - typora-issues
    - support.typora.io
  sources:
    - https://github.com/typora
    - https://github.com/typora/typora-issues
    - https://support.typora.io/
    - https://support.typora.io/What%27s-New-1.0/
  summary:
    - >
      Typora is a commercial, cross-platform Markdown editor known for presenting
      formatted content directly in the editing surface instead of using a conventional
      split source-and-preview view.
  timeline:
    - 'Pre-2021: Typora developed through an extended public beta.'
    - '2021-11-23: Typora 1.0 ended the beta period and introduced paid license activation.'
  usage:
    - >
      Users write Markdown in a live rendered editor, organize files and folders, apply
      CSS themes, create tables, mathematical notation and diagrams, and export
      documents to formats such as HTML or PDF. Optional Pandoc integration broadens
      import and export support.
