history:
  adoption-history:
    - >
      VirtualBuddy found a niche among Apple-platform developers who need to test
      applications against multiple macOS releases and betas without dedicating separate
      hardware. Homebrew cask packaging provides a convenient installation route
      alongside GitHub releases and the developer's supported download offering.
  package-nerd-significance:
    - >
      VirtualBuddy is a focused, open-source example of software built directly around
      Apple's Virtualization framework. Unlike general emulators, it emphasizes Apple
      Silicon macOS guests, automated restore-image installation, APFS-efficient VM
      duplication, and host/guest integration.
  project-history:
    - >
      VirtualBuddy was created as a native macOS frontend for running macOS virtual
      machines on Apple Silicon, particularly for developers testing against multiple
      macOS versions. It later broadened its hardware configuration, library management,
      networking, shared-folder, save-state, and Linux-guest capabilities.
    - >
      Version 1.2 moved new installations to a default library under
      ~/Library/Application Support/VirtualBuddy and expanded VM management and
      configurable virtual hardware.
  related-projects:
    - Apple Virtualization framework provides the underlying virtualization APIs.
    - >
      VirtualBuddyGuest supplies clipboard and shared-folder integration for supported
      macOS guests.
    - >
      UTM is a broader Apple-platform virtualization and emulation project with a
      different scope.
  sources:
    - https://github.com/insidegui/VirtualBuddy#readme
    - >
      https://github.com/insidegui/VirtualBuddy/blob/main/ReleaseNotes/VirtualBuddy%201.2%20Release%20Nodes.md
    - https://github.com/insidegui/VirtualBuddy/releases
  summary:
    - >
      VirtualBuddy is an open-source, native macOS virtualization application centered
      on running macOS 12 and later on Apple Silicon. Its design targets developers and
      testers who regularly need multiple macOS environments.
  timeline:
    - >
      Early releases established guided installation of Apple restore images and native
      macOS virtualization on Apple Silicon.
    - >
      Version 1.2: Expanded library management, configurable virtual hardware, shared
      folders, bridged networking, and the default Application Support library.
    - >
      Version 2.x: Continued development added further platform integration, save-state,
      guest, and device-management capabilities.
  usage:
    - >
      Users select an Apple restore image supplied by the application, provide a local
      IPSW or URL, or install a supported ARM Linux image. Virtual machines can be
      configured with custom CPU, memory, storage, network, display, and shared-folder
      settings.
    - >
      The companion VirtualBuddyGuest application enables clipboard sharing and
      automatic mounting of configured shared folders in supported macOS guests.
