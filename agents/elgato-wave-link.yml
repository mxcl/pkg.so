history:
  adoption-history:
    - >
      Early Wave Link releases were closely associated with Elgato Wave microphones and
      Wave XLR hardware, while also integrating with Stream Deck for physical control.
    - >
      Wave Link 3 broadened the product beyond Elgato-only microphone workflows. Elgato
      states that version 3 is free, supports third-party USB microphones and XLR
      interfaces, and no longer requires Elgato hardware.
  package-nerd-significance:
    - >
      Wave Link is significant to desktop-package users because it installs a complete
      virtual-audio routing environment rather than a simple foreground mixer. Its
      evolution from hardware companion to free, hardware-agnostic application makes it
      relevant to streaming, conferencing, recording, and per-application audio
      management.
  project-history:
    - >
      Elgato created Wave Link as creator-oriented mixing and routing software,
      initially centered on its Wave microphone ecosystem. Successive releases added
      channel organization, window improvements, effects, and Stream Deck integration.
    - >
      Version 3 reworked the application around flexible source-to-mix routing, up to
      five virtual mixes, third-party input support, and platform-native effect formats.
      Elgato marked Wave Link 2 end-of-life while retaining it for download.
  related-projects:
    - Elgato Wave microphones
    - Wave XLR
    - Stream Deck
    - Elgato Marketplace
    - OBS Studio
    - VST3
    - Audio Units
  sources:
