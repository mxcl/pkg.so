      https://help.elgato.com/hc/en-us/sections/4913442828941-Wave-Link-Release-Notesadresinden
  summary:
    - >
      Elgato Wave Link is a creator-focused virtual audio mixer and router for macOS and
      Windows. It combines hardware and application inputs, multiple destination mixes,
      monitoring, effects, and Stream Deck control.
  timeline:
    - >
      2020-era product generation: Wave Link established Elgato’s software mixing
      workflow around Wave hardware.
    - '2026-03-03: Wave Link 3.0 released on Windows.'
    - >
      2026: Wave Link 3 expanded availability to third-party microphones and made the
      mixer free without ecosystem lock-in.
    - '2026: Wave Link 2 reached end of life as development shifted to version 3.'
  usage:
    - >
      Users add microphone, hardware, and application sources, route them into separate
      mixes for streaming, recordings, voice chat, or monitoring, adjust levels, and
      apply VST3 effects on Windows or Audio Units on macOS.
