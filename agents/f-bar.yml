history:
  adoption-history:
    - >
      F-Bar targets Laravel Forge users who want frequent operational actions outside
      the web dashboard. The official site describes support for unlimited Forge
      accounts, servers, and sites, while the documentation covers multi-account
      synchronization and menu-bar access.
    - >
      Version 6 was a compatibility-driven rebuild for Forge's newer API. The vendor
      states that older F-Bar versions would cease working after retirement of the
      previous Forge API, making the rebuild an important migration point for existing
      users.
  package-nerd-significance:
    - >
      F-Bar is a native Swift alternative to keeping a full Forge browser session open
      for routine work. It is especially interesting to macOS package users because it
      combines menu-bar ergonomics with operational tasks such as SSH, deployment, log
      viewing, service restarts, configuration editing, and local uptime checks.
    - >
      Its history illustrates a common dependency risk for API-client packages: a
      third-party service API retirement forced a substantial application rebuild and
      made older packaged releases unusable.
  project-history:
    - >
      F-Bar began as a macOS menu-bar client for Laravel Forge and reached a non-beta
      1.0 release after early monitoring and account-management work. Later releases
      added deployment notifications, terminal integration, configuration editors,
      service control, site monitoring, log viewers, and Apple Silicon support.
    - >
      Version 6 rebuilt the application around Forge's replacement API. It also
      introduced a global action bar, native push notifications, secure Keychain
      credential storage, improved rate-limit-aware caching, and stronger error
      recovery. The official product now also has an iOS companion.
  related-projects:
    - Laravel Forge
    - Laravel
    - macOS Keychain
  sources:
    - https://laravel-forge-menubar.com/
    - https://laravel-forge-menubar.com/change-log
    - https://laravel-forge-menubar.com/docs
  summary:
    - >
      F-Bar is a native macOS menu-bar companion for Laravel Forge, designed for quick
      server, site, deployment, SSH, log, and monitoring actions.
  timeline:
    - '1.0: F-Bar left beta.'
    - '2.0: Added push notifications, Hyper support, and updated Swift foundations.'
    - '4.0: Moved site monitoring to a separate process and added Catalina notarization work.'
    - '5.0: Added a universal Intel/Apple Silicon binary and broader log and service tooling.'
    - >
      6.0: Rebuilt for Forge's new API and added the action bar, native notifications,
      and Keychain-backed credential storage.
  usage:
    - >
      Users create a dedicated Laravel Forge API token, paste it into F-Bar, and let the
      app synchronize their servers and sites. Common actions include triggering
      deployments, opening SSH sessions, restarting services, reading logs, editing
      deployment scripts, editing .env and Nginx configuration, and opening resources in
      Forge.
    - >
      The local monitor sends periodic HTTP requests and raises desktop notifications
      for non-success responses. F-Bar can also configure deployment notifications
      through a Forge webhook and Apple Push Notification delivery.
