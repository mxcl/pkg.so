history:
  adoption-history:
    - >
      Wheel Wizard packages a workflow that otherwise requires users to assemble Mario
      Kart Wii mods and Retro Rewind manually. Its official releases support desktop
      platforms, and later releases added Flathub distribution and consolidated macOS
      artifacts into the main repository.
    - >
      The supplied package facts record a Homebrew cask, while the official organization
      also maintains its own Homebrew tap.
  package-nerd-significance:
    - >
      Wheel Wizard turns a multi-component emulation and mod-installation workflow into
      a desktop package with automatic update checks. It is representative of community
      package tooling built around legally dumped game media rather than distributing
      the base game.
    - >
      Its cross-platform .NET/Avalonia codebase, GPL licensing, Homebrew tap, Flathub
      availability, and release automation make it notable beyond its relatively
      specialized Mario Kart audience.
  project-history:
    - >
      Wheel Wizard was created by Patchzy and WantToBeeMe as a free, open-source
      convenience tool for installing and launching Mario Kart Wii mods, especially
      Retro Rewind.
    - >
      The project developed from a Retro Rewind updater into a broader mod manager and
      launcher. Platform packaging expanded to include a native universal macOS build
      and Linux distribution through Flathub.
  related-projects:
    - Retro Rewind is the principal Mario Kart Wii mod managed and launched by Wheel Wizard.
    - Dolphin is the emulator used for the standard Retro Rewind workflow.
    - >
      WiiCompiled is an alternative supported runtime with more restrictive game-region
      requirements.
  sources:
    - https://github.com/TeamWheelWizard
    - https://github.com/TeamWheelWizard/WheelWizard#readme
    - https://github.com/TeamWheelWizard/WheelWizard-Mac/releases
    - https://github.com/TeamWheelWizard/WheelWizard/releases
    - source_facts.package-manager
  summary:
    - >
      Wheel Wizard is a GPL-licensed, cross-platform Mario Kart Wii mod manager and
      Retro Rewind launcher created to automate installation, updating, and game launch
      workflows.
  timeline:
    - '2025-02: The separate macOS project published a beta and then a native v1.0.0 build.'
    - '2025-03: macOS releases moved into the main Wheel Wizard repository.'
    - >
      2026: The main release series added broader Linux, macOS, WiiCompiled,
      offline-play, and mod-management improvements.
  usage:
    - >
      Users supply their own Mario Kart Wii game backup, choose a supported runtime,
      install or update Retro Rewind and other supported mods, and launch them through
      Wheel Wizard.
    - >
      The official README accepts ISO, GCM, GCZ, CISO, WBFS, WIA, and RVZ backups;
      supported region requirements depend on whether Dolphin or WiiCompiled is used.
