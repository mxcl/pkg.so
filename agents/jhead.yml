history:
  adoption-history:
    - >
      jhead spread through Unix package collections because it filled an everyday
      digital-camera need with one C executable. The README notes availability in many
      Linux distributions and ports trees, and the Homebrew formula preserves it as a
      compact image-metadata command.
    - >
      Its adoption belongs to the early digital photography era, when users wanted shell
      tools to rename photos by capture time, fix camera clock mistakes, rotate JPEGs
      according to orientation tags, and strip or inspect metadata in batches.
  package-nerd-significance:
    - >
      jhead is a classic package-manager utility: tiny, scriptable, portable C, no
      service dependency, and useful in pipelines. It is the kind of tool that persists
      in distro archives because it solves a narrow job with little operational weight.
    - >
      It also documents a useful package-design tradeoff. Rather than absorb every EXIF
      feature, it keeps a stable small-tool identity while coexisting with heavier
      metadata projects.
  project-history:
    - >
      The official README says Wandel first wrote jhead in 1999, when there was not much
      software for looking inside EXIF headers. The source file header records
      development from December 1999 through March 2026, and the repository preserves
      the author's long-running public-domain C utility.
    - >
      The project's own notes explain its design goal: stay small, simple, and
      understandable rather than compete with larger metadata suites. Wandel explicitly
      points users who need broad metadata coverage to ExifTool or Exiv2, while
      positioning jhead as a fast utility and readable codebase for understanding EXIF
      internals.
  related-projects:
    - >
      ExifTool is the larger metadata utility that jhead's README recommends for broader
      feature coverage.
    - >
      Exiv2 is another metadata tool named by the jhead README as a more sophisticated
      alternative.
    - >
      jpegtran is commonly paired with jhead for lossless rotation driven by EXIF
      orientation data.
  sources:
    - https://formulae.brew.sh/formula/jhead
    - https://github.com/Matthias-Wandel/jhead
    - https://raw.githubusercontent.com/Matthias-Wandel/jhead/master/jhead.c
    - https://raw.githubusercontent.com/Matthias-Wandel/jhead/master/readme.txt
    - https://raw.githubusercontent.com/Matthias-Wandel/jhead/master/usage.html
  summary:
    - >
      jhead is Matthias Wandel's small command-line utility for displaying and modifying
      metadata in digital-camera image files. It began as an EXIF inspection tool for
      JPEGs and later grew practical metadata operations such as timestamp adjustment,
      thumbnail handling, comment editing, metadata stripping, and orientation-based
      rotation.
  timeline:
    - >
      1999: Matthias Wandel wrote jhead to inspect EXIF headers from digital-camera JPEG
      files.
    - '2020: The GitHub repository was created as an official public source location.'
    - >
      2026: The source header records the maintained version line as jhead 3.3 and a Dec
      1999 to Mar 2026 development span.
  usage:
    - >
      jhead is commonly used to print camera settings, set file timestamps from EXIF
      dates, adjust EXIF time fields, rename files using photo timestamps, remove
      metadata sections, edit comments, and invoke jpegtran for lossless rotation
      according to EXIF orientation.
    - >
      The tool is deliberately not a general metadata framework. Its docs tell users to
      reach for ExifTool or Exiv2 when they need broader format or tag coverage.
related-packages:
  - id: brew:exiftool
    reason: >
      Choose ExifTool when you need much broader file-format and metadata-tag coverage
      than jhead's deliberately compact JPEG-focused feature set.
    rel: alternative
    sources:
      - https://github.com/Matthias-Wandel/jhead#readme
      - https://exiftool.org/exiftool_pod2.html
  - id: brew:exiv2
    reason: >
      Choose Exiv2 when you need a fast native tool and library that reads and writes
      EXIF, IPTC, XMP, ICC profiles, previews, and metadata across many image formats.
    rel: alternative
    sources:
      - https://github.com/Matthias-Wandel/jhead#readme
      - https://exiv2.org/manpage.html
  - id: brew:jpeg
    reason: >
      jhead can call the jpegtran executable supplied by the IJG JPEG tools to rotate or
      mirror JPEG image data losslessly according to EXIF orientation.
    rel: adjacent_workflow
    sources:
      - https://github.com/Matthias-Wandel/jhead/blob/master/usage.html
      - https://www.ijg.org/
