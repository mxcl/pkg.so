history:
  adoption-history:
    - >
      Bunster's package-manager adoption is still early but visible: the input metadata
      records Homebrew and Nix packaging. That adoption matches the tool's intended
      audience of command-line users who want to distribute scripts as portable binaries
      without requiring a shell runtime on the target machine.
  package-nerd-significance:
    - >
      Bunster is interesting to package nerds because it sits at the boundary between
      shell scripting, static binary distribution, and language transpilation. It is
      also part of a long-running packaging itch: making scripts installable like normal
      binaries while avoiding the fragility of interpreter paths and wrapper-based
      script hiding.
  project-history:
    - >
      The public GitHub repository was created in July 2024, and the README and
      introduction describe the project as early-stage software with Bash compatibility
      as the first target. The project roadmap in the documentation emphasizes a pre-1.0
      path toward broader Bash compatibility, a module system, a built-in package
      manager, static assets, .env support, and static analysis.
  related-projects:
    - >
      Bunster relates to Bash as its initial compatibility target, to Go as its
      transpilation and build backend, and to shc as a contrasting
      shell-script-to-binary approach that Bunster explicitly distinguishes itself from.
  sources:
    - https://github.com/yassinebenaid/bunster
    - https://raw.githubusercontent.com/yassinebenaid/bunster/master/README.md
    - https://raw.githubusercontent.com/yassinebenaid/bunster/master/docs/introduction.md
    - source_facts.package-manager
  summary:
    - >
      Bunster is a newer developer tool that compiles shell scripts into standalone
      static binaries by transpiling shell code to Go and then using the Go toolchain.
      Its upstream documentation positions it as different from wrapper-style tools such
      as shc: Bunster aims to produce shell-independent programs rather than embedding a
      script inside a launcher.
  timeline:
    - '2024: Public GitHub repository created.'
    - >
      2024-2026: Documentation describes Bunster as early-stage and pre-1.0, with Bash
      compatibility as the initial target.
    - '2026: Homebrew metadata includes Bunster as a packaged CLI.'
  usage:
    - >
      Typical usage is to compile Bash-like scripts with the `bunster` CLI, relying on
      the Go compiler underneath for final binary output. The project is most relevant
      for distributing operational scripts, small internal tools, or self-contained
      command-line programs where requiring Bash and a pile of external files is
      undesirable.
related-packages:
  - id: brew:shc
    reason: >
      Choose shc when broad traditional shell compatibility or its encode-and-launch
      model is acceptable; choose Bunster when the goal is a shell-independent
      executable produced through Go transpilation.
    rel: alternative
    sources:
      - https://bunster.netlify.app/introduction
      - https://github.com/neurobin/shc
