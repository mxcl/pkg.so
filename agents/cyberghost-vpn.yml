history:
  adoption-history:
    - >
      CyberGhost expanded from a desktop VPN service into a cross-platform consumer
      subscription covering macOS, Windows, mobile devices, televisions, and other
      platforms. Its adoption is centered on simplified encrypted tunneling, location
      selection, streaming-oriented servers, and privacy protection for non-specialist
      users.
  package-nerd-significance:
    - >
      The macOS package provides a turnkey commercial VPN client with IKEv2 and
      WireGuard support, server-selection features, leak protection, and Keychain
      integration. Advanced users can alternatively generate OpenVPN configurations and
      per-configuration credentials for third-party clients such as Tunnelblick.
  project-history:
    - >
      CyberGhost developed its VPN service and client applications as a consumer privacy
      product. The company subsequently unified its user experience across platforms
      with the CyberGhost 7 generation, launched across Windows, macOS, iOS, Android,
      and television platforms in 2018.
  related-projects:
    - >
      CyberGhost supports manual OpenVPN connections through third-party clients such as
      Tunnelblick in addition to its native macOS application.
    - >
      Its native macOS client supports IKEv2 and WireGuard, while manual configurations
      extend use to routers and other OpenVPN-compatible systems.
  sources:
    - 'Official CyberGhost 7 history: https://www.cyberghostvpn.com/privacyhub/cyberghost-7/'
    - >
      Official CyberGhost macOS support:
      https://support.cyberghostvpn.com/hc/en-us/sections/360005555420-CyberGhost-VPN-for-MacOS
    - >
      Official OpenVPN-on-macOS guide:
      https://support.cyberghostvpn.com/hc/en-us/articles/214239925-How-to-Set-Up-OpenVPN-on-macOS-Tunnelblick
  summary:
    - >
      CyberGhost VPN is a commercial consumer VPN service and cross-platform client for
      encrypting network traffic and routing it through selectable remote locations.
  timeline:
    - >
      2018: CyberGhost launched its version 7 application generation across desktop,
      mobile, and television platforms.
    - >
      2020s: The macOS client offered native IKEv2 and WireGuard connections alongside
      manual OpenVPN setup options.
    - '2026: CyberGhost continued distributing and documenting its dedicated macOS VPN client.'
  usage:
    - >
      Users sign in with a CyberGhost subscription, choose a server or optimized
      location, and establish an encrypted VPN tunnel. The macOS application offers
      favorites, streaming- and torrent-oriented server choices, protocol settings, and
      advanced protection features.
