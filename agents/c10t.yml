history:
  adoption-history:
    - >
      c10t's adoption was mostly within the Minecraft tooling community rather than
      broad system administration. The README points users to GitHub issues, a debug
      mode, and a separate Java/SWT GUI wrapper, showing a small ecosystem around a
      command-line renderer.
    - >
      Homebrew packaging made it easy for macOS users to install a native Minecraft map
      renderer without building Boost, libpng, zlib, and FreeType manually.
  package-nerd-significance:
    - >
      For package nerds, c10t is a snapshot of early Minecraft-native tooling in C++:
      external renderers, NBT parsing, region file inspection, Boost-era dependency
      stacks, and optional GUI wrappers.
    - >
      It also illustrates why game-adjacent CLIs appear in Unix package managers: a game
      creates a data format and a community quickly wants command-line batch tools for
      rendering, inspection, and automation.
  project-history:
    - >
      The README says c10t was written because the author liked ZomBuster's Cartograph
      but wanted different rendering behavior. Upstream Git history starts on 6
      September 2010, close to Minecraft's early modding/tooling boom, and the
      repository tagged 1.0 later that month.
    - >
      The tool's design centered on a pipelined multithreaded rendering process, memory
      limits with file-backed caching, proper command-line options, and a CMake build
      that could target Windows and macOS as well as Linux.
  related-projects:
    - 'Cartograph by ZomBuster: the Minecraft mapper the README names as inspiration.'
    - 'Firemark: Linux port of Cartograph credited by the README.'
    - 'c10t-swt: Java/SWT GUI wrapper linked from the README.'
    - >
      Minecraft NBT and region-file tools: adjacent utilities represented by c10t's
      nbt-inspect and region-inspect targets.
  sources:
    - https://github.com/udoprog/c10t
    - https://github.com/udoprog/c10t#readme
    - source_facts.package-manager
  summary:
    - >
      c10t is a Minecraft cartography tool for rendering world data into maps. It
      belongs to the early wave of external Minecraft world tools, built for
      command-line rendering, memory-aware processing, and cross-platform builds.
  timeline:
    - '2010-09-06: Initial upstream Git commit.'
    - '2010-09-18: 1.0 tag appears.'
    - '2010-10-10: 1.1 tag appears.'
    - '2011-03-11: 1.7 tag appears.'
    - >
      2020-12-13: Palette overhaul updates old numeric ID handling toward modern
      namespaced palette data.
    - '2024-07-11: Upstream commit fixes deprecated Boost usage.'
  usage:
    - >
      Users run c10t against Minecraft world data to render map images. Supporting tools
      in the build include nbt-inspect and region-inspect for inspecting Minecraft NBT
      and region files.
    - >
      The README emphasizes debug output, version reporting in bug reports,
      platform/architecture details, and memory-friendly rendering options, all pointing
      to usage on large or fragile world saves.
related-packages:
