history:
  adoption-history:
    - >
      ShedWorx distributes Smart Converter Pro through its website and Apple's Mac App
      Store. Official support material distinguishes those channels because store rules
      can affect supported conversions.
  package-nerd-significance:
    - >
      Smart Converter Pro packages media conversion behind device-oriented presets and
      avoids transcoding streams that are already suitable for the destination. Its
      batch conversion, metadata lookup, subtitle handling, and watched-folder workflow
      distinguish it from the free Smart Converter edition.
  project-history:
    - >
      Smart Converter Pro is ShedWorx's expanded edition of Smart Converter. Both
      editions use the same conversion engine, while the Pro edition adds batch
      processing, output selection, metadata and subtitle features, multiple audio
      tracks, surround-sound support, and folder monitoring.
    - >
      ShedWorx updated its device definitions after Apple added native HEVC support in
      2017, allowing suitable HEVC media to be rewrapped rather than unnecessarily
      transcoded for newer Apple devices.
  related-projects:
    - >
      Smart Converter: The free edition, which shares the same conversion engine but
      omits several Pro workflow features.
    - 'Smart Player: A related ShedWorx product for organizing and playing media.'
  sources:
    - >
      Official HEVC guidance:
      https://support.shedworx.com/support/solutions/articles/6000178219-hevc-and-smart-converter-pro
    - >
      Official edition comparison:
      https://support.shedworx.com/support/solutions/articles/6000084568-what-s-the-difference-between-smart-converter-and-smart-converter-pro-
    - 'Official knowledge base: https://support.shedworx.com/support/solutions'
    - 'Official product page: https://shedworx.com/smart-converter-pro/'
  summary:
    - >
      Smart Converter Pro is a macOS video and audio conversion application focused on
      simple device presets, selective transcoding, batch work, metadata, subtitles, and
      automated folder monitoring.
  timeline:
    - >
      2015: ShedWorx's official knowledge base documented the core select-format-convert
      workflow.
    - >
      2017: The conversion profiles were updated for Apple's native HEVC-capable
      operating systems.
    - >
      2020: Official documentation detailed the Pro edition's expanded feature set
      relative to Smart Converter.
  usage:
    - >
      Users drag files into the application, choose a target device or format, and start
      conversion; queued files are processed as a batch. Pro workflows can set an output
      location, add converted media to Apple media applications, retrieve metadata or
      subtitles, retain multiple audio tracks, and monitor folders for new media.
