config-file-location:
  macos:
    - ~/Library/Application Support/Postgres/var-XX/postgresql.conf
    - ~/Library/Application Support/Postgres/var-XX/pg_hba.conf
    - ~/Library/Preferences/com.postgresapp.Postgres2.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Postgres.app established a simple macOS distribution model for local PostgreSQL
      development: place one application in /Applications, initialize a server, and use
      the bundled command-line tools. Support for multiple simultaneous server versions
      made it useful across projects with different database requirements.
    - >
      The distribution broadened beyond the core database by bundling commonly requested
      extensions such as PostGIS, pgRouting, pgvector, wal2json, PL/JS, and PL Debugger.
  package-nerd-significance:
    - >
      Postgres.app packages a database server, versioned binaries, extensions,
      command-line tools, and a native controller as a conventional Mac application. It
      is a useful alternative to a service-oriented package-manager installation when
      developers want isolated local clusters and straightforward removal.
    - >
      Its data directories remain outside the application bundle, so replacing the app
      and managing database clusters are distinct operations. This separation is
      particularly relevant during PostgreSQL major-version upgrades.
  project-history:
    - >
      Postgres.app was created to make running PostgreSQL locally on macOS require
      minimal setup. The project pairs versioned PostgreSQL distributions with a native
      Swift interface for initializing, starting, stopping, and managing server
      clusters.
    - >
      Over time it added parallel support for multiple PostgreSQL major versions and
      maintained bundled builds of popular spatial, routing, replication,
      procedural-language, and vector extensions.
  related-projects:
    - PostgreSQL
    - PostGIS
    - pgRouting
    - pgvector
    - wal2json
    - PL/JS
    - PL Debugger
  sources:
    - https://github.com/PostgresApp/PostgresApp
    - https://postgresapp.com/
    - https://postgresapp.com/documentation/
    - https://postgresapp.com/documentation/install.html
  summary:
    - >
      Postgres.app is a self-contained PostgreSQL distribution and native server manager
      for macOS. It is designed to provide a quick local database environment while
      retaining access to standard PostgreSQL tools and configuration.
  timeline:
    - 'Initial project: Postgres.app packaged PostgreSQL as a native Mac application.'
    - >
      Later releases: Multiple concurrent PostgreSQL server versions became a supported
      workflow.
    - >
      Recent releases: The bundle includes widely used extensions such as PostGIS and
      pgvector alongside standard PostgreSQL tools.
  usage:
    - >
      Users drag Postgres.app into /Applications, initialize one or more server
      clusters, and optionally add its versioned bin directory to PATH. Each cluster has
      its own data directory and standard PostgreSQL configuration files. The default
      local authentication permits same-machine connections without a password; the
      official guide recommends SCRAM authentication when password protection is
      required.
