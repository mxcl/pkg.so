history:
  project-history:
    - >
      The tool's main milestone is support for the RFC 7991 XML vocabulary used by
      xml2rfc v3. Mmark takes an extended Markdown dialect with title blocks, special
      sections, citations, XML references, BCP14 keyword handling, captions, figures,
      includes, indexes, and cross references, then emits RFCXML, HTML5, or manual-page
      output. The generated RFCXML is meant to be passed to xml2rfc for final text,
      HTML, PDF, or other RFC outputs.
  sources:
    - https://formulae.brew.sh/formula/mmark
    - https://github.com/ietf/authors.ietf.org/blob/main/tools-catalog.md
    - https://github.com/mmarkdown/mmark
    - https://mmark.miek.nl/post/start/
    - https://mmark.miek.nl/post/syntax/
  summary:
    - >
      Mmark is Miek Gieben's Go-based Markdown processor for IETF authoring. Its
      upstream material describes it as a powerful Markdown processor geared toward IETF
      documents, but also usable for books and technical documentation. The IETF
      authors' tools catalog lists mmark as a Markdown-to-RFCXML tool, credits Miek
      Gieben as author and maintainer, and classifies it as a maintained
      command-line/build tool.
  usage:
    - >
      Mmark belongs to the small ecosystem of tools that let IETF authors write
      Internet-Drafts in lightweight text formats instead of raw XML. It sits near
      kramdown-rfc and metanorma-ietf, with a package-manager niche as a single CLI for
      authors who want local Markdown-to-RFCXML conversion in scripts, Makefiles, and
      continuous document builds.
related-packages:
  - id: brew:xml2rfc
    reason: >
      Mmark generates RFCXML, and xml2rfc is the documented next step for producing
      validated text, HTML, PDF, and other IETF document renderings.
    rel: adjacent_workflow
    sources:
      - https://github.com/mmarkdown/mmark/blob/master/README.md
      - https://authors.ietf.org/rendering-and-converting
      - https://github.com/ietf-tools/xml2rfc
  - id: brew:idnits
    reason: >
      Use idnits after rendering an Internet-Draft to catch IETF formatting and policy
      issues before submission; the official Author Tools workflow supports both Mmark
      input and idnits validation.
    rel: adjacent_workflow
    sources:
      - https://authors.ietf.org/author-tools-web-service
      - https://authors.ietf.org/document-validation
      - https://github.com/mmarkdown/mmark/blob/master/README.md
