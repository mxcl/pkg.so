history:
  adoption-history:
    - >
      libmwaw's adoption is concentrated in office-suite and conversion workflows that
      need to recover files from classic Mac applications. The wiki documents
      batch-conversion utilities for macOS and an online conversion experiment that
      emits OpenDocument-family output for LibreOffice and related tools.
    - >
      In 2017, The Document Foundation reported new libmwaw work for PowerPoint 2,
      PowerPoint 4, and PowerPoint for Windows 95 import filters, showing that the
      library expanded beyond its initial Mac-writing focus into adjacent legacy
      presentation formats.
  package-nerd-significance:
    - >
      libmwaw is significant because it preserves the ability to read forgotten
      personal-computing formats without requiring the original classic Mac
      applications. For packagers, it is one of the more charming DLP libraries: narrow,
      strange, and invaluable when a user turns up with a decades-old document.
  project-history:
    - >
      The SourceForge wiki describes libmwaw as a project for converting many pre-OSX
      Mac text formats plus some graphics and spreadsheet formats. Its supported-format
      table covers applications such as MacWrite, ClarisWorks/AppleWorks, Microsoft Word
      for Mac, Nisus Writer, WriteNow, RagTime, and others.
    - >
      The project fits into the Document Liberation Project's broader strategy of
      extracting proprietary and obsolete document parsers into standalone libraries.
      The Document Foundation's 2015 DLP retrospective says Laurent Alonso added support
      for more than twenty legacy Mac formats to libmwaw.
  related-projects:
    - >
      libmwaw is part of the same Document Liberation ecosystem as libmspub, libwps,
      libvisio, libpagemaker, libqxp, and libfreehand. The wiki also points to
      librevenge as the common framework used by these document-conversion libraries.
  sources:
    - https://blog.documentfoundation.org/blog/2017/08/28/updates-document-liberation-project/
    - https://formulae.brew.sh/formula/libmwaw
    - https://lwn.net/Articles/640198/
    - https://sourceforge.net/p/libmwaw/libmwaw/ci/master/tree
    - https://sourceforge.net/p/libmwaw/wiki/Home/
    - https://sourceforge.net/projects/libmwaw/
    - https://www.documentliberation.org/about/
  summary:
    - >
      libmwaw is a Document Liberation Project library for converting many pre-OSX Mac
      document formats, including old word-processing, graphics, spreadsheet, and
      presentation formats.
  timeline:
    - >
      2014-04: The Document Liberation Project is born within The Document Foundation
      framework.
    - >
      2015-04-09: The Document Foundation reports more than twenty legacy Mac formats
      added to libmwaw.
    - >
      2017-08-28: The Document Foundation reports libmwaw import-filter work for old
      PowerPoint formats.
    - '2018-06-13: The libmwaw wiki notes an update to its browser-based conversion experiment.'
    - >
      2020s: libmwaw remains packaged across Unix package managers as a legacy-document
      conversion library.
  usage:
    - >
      Packaged builds expose tools such as mwaw2html, mwaw2raw, mwaw2svg, mwaw2text,
      mwaw2csv, mwawFile, and mwawZip. The practical workflow is forensic: identify a
      legacy file, parse whatever structure is recoverable, and export text, graphics,
      or OpenDocument-compatible content.
related-packages:
  - id: brew:writerperfect
    reason: >
      Use writerperfect with libmwaw and libodfgen when the desired workflow is
      conversion of parsed legacy Mac documents into OpenDocument output.
    rel: adjacent_workflow
    sources:
      - https://sourceforge.net/p/libmwaw/wiki/Developers/
      - https://sourceforge.net/p/libmwaw/wiki/Home/
  - id: brew:libwps
    reason: >
      Choose libwps for Microsoft Works documents across its supported platforms; choose
      libmwaw for the much broader collection of legacy Macintosh application formats.
    rel: alternative
    sources:
      - https://www.documentliberation.org/projects/
      - https://sourceforge.net/p/libmwaw/wiki/Home/
      - https://libwps.sourceforge.net/
