history:
  adoption-history:
    - >
      The official distribution is a source tarball that requires a C compiler and a
      Unix-like environment. The input package facts show that Homebrew and Alpine
      package it, which fits its niche as a compact test-data generator used from shell
      scripts and packaging systems.
  package-nerd-significance:
    - >
      Package maintainers care about abnfgen because it is a focused C utility with no
      documented runtime service or credentials, and it solves a practical
      standards-testing problem: generating concrete examples from ABNF grammars
      commonly used in RFCs and protocol specifications.
  project-history:
    - >
      The official page presents abnfgen as an alpha tool, copyrighted but free for any
      use, with version 0.21 offered as the current tarball release. Its bundled manual
      page is dated 4 March 2002, reflecting the tool's long-standing role in ABNF
      test-case generation.
  related-projects:
    - >
      The official page and manual connect abnfgen to ABNF as used in RFC 4234-era
      Internet standards grammar descriptions and mention RFC 7405 string-literal
      handling.
  sources:
    - >
      Official quut.com abnfgen(1) manual: options, grammar behavior, and 4 March 2002
      manpage date.
    - >
      Official quut.com project page: purpose, use cases, alpha status, current tarball,
      Unix-like build requirement.
    - 'input source_facts.package-manager: Homebrew and Alpine package names.'
  summary:
    - >
      abnfgen is a small Unix-style command-line generator that reads ABNF grammars and
      produces random documents matching those grammars for parser and protocol testing.
  timeline:
    - '2002: Official manual page date for abnfgen(1).'
    - '2026: Official page lists abnfgen 0.21 as the current version.'
  usage:
    - >
      abnfgen takes one or more grammar files and generates text from the selected start
      symbol. Its options include coverage-oriented generation, deterministic random
      seeds, output file counts, recursion depth limits, tentative definitions, and
      strict modes for rejecting extensions beyond the referenced ABNF syntax.
