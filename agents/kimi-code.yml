id: brew:kimi-code
display-name: Kimi Code CLI
repo: https://github.com/MoonshotAI/kimi-code
docs:
  - https://github.com/MoonshotAI/kimi-code#readme
  - https://moonshotai.github.io/kimi-code/en
config-file-location:
  unix:
    - ~/.kimi-code/config.toml
    - ~/.kimi-code/tui.toml
    - ~/.kimi-code/mcp.json
    - <project-root>/.kimi-code/local.toml
    - <project-root>/.kimi-code/mcp.json
credentials-file-location:
  unix:
    - ~/.kimi-code/config.toml
    - ~/.kimi-code/credentials/<name>.json
    - ~/.kimi-code/credentials/mcp/<key>-<suffix>.json
history:
  adoption-history:
    - >
      By July 1, 2026, the repository showed thousands of GitHub stars, Homebrew
      packaging in this batch, and a public release stream in the 0.18 to 0.21 range.
      That is early but visible adoption for a newly separated terminal-agent package.
    - >
      Its adoption story is tied to the broader AI coding-agent packaging moment:
      package managers need to ship not only a binary called kimi, but also the
      configuration, credential, MCP, and editor-integration conventions that make
      long-running agent sessions portable across machines.
  package-nerd-significance:
    - >
      Kimi Code CLI is package-nerd significant because it marks the move from
      language-runtime-installed agent tools toward single-binary distribution, while
      still being developed as a large TypeScript workspace.
    - >
      It also has the messy but important successor-package problem: the same executable
      name, migrated user state, Homebrew and Windows packaging, and a rapidly changing
      agent feature surface all have to line up without stranding users of the older
      Kimi CLI.
  project-history:
    - >
      Kimi Code CLI split the successor experience from the earlier Kimi CLI project.
      The Kimi CLI README explicitly points users to Kimi Code CLI and says installation
      migrates prior Kimi CLI configuration and sessions, making Kimi Code both a new
      package and a continuity path for existing users.
    - >
      The Kimi Code repository is organized as a TypeScript/Node development project
      while distributing an end-user CLI that does not require Node.js for normal
      installation. Its README highlights a purpose-built TUI, video input, MCP
      configuration, plugins, subagents, lifecycle hooks, and ACP editor integration.
  related-projects:
    - Kimi CLI is the predecessor package and migration source named by MoonshotAI.
    - >
      Agent Client Protocol, MCP servers, the Kimi Code VS Code extension, and the
      pi-tui TUI library are related integration or implementation pieces referenced by
      the project.
    - >
      Moonshot AI's Kimi models are the default model family, while the README states
      that compatible providers can also be configured.
  sources:
    - https://github.com/MoonshotAI/kimi-cli
    - https://github.com/MoonshotAI/kimi-code
    - https://github.com/MoonshotAI/kimi-code/releases
    - https://moonshotai.github.io/kimi-code/en
  summary:
    - >
      Kimi Code CLI is MoonshotAI's successor terminal coding agent. Its README presents
      it as a single-binary, terminal-first AI coding agent that can read and edit code,
      run shell commands, search files, fetch web pages, and work with Moonshot Kimi
      models or compatible providers.
  timeline:
    - >
      2026: Kimi CLI documentation announced Kimi Code CLI as the successor and
      migration path.
    - >
      2026: Kimi Code CLI documented official script, Homebrew, Windows PowerShell, and
      npm installation paths.
    - '2026: Kimi Code release 0.21.1 was listed on GitHub releases on 2026-07-01.'
  usage:
    - >
      Users open a project, run kimi, authenticate with either Kimi Code OAuth or a
      Moonshot AI Open Platform API key, and then drive code-reading, editing, shell,
      MCP, and web-fetching workflows from the terminal UI.
    - >
      The CLI also exposes kimi acp for ACP-compatible editors and IDEs. That makes the
      package useful both as a direct terminal application and as a backend agent
      process for editor frontends.
related-packages:
  - id: cask:zed
    reason: >
      Kimi Code CLI documents Zed as an ACP client that can launch `kimi acp`, providing
      an editor interface over the locally installed agent.
    rel: adjacent_workflow
    sources:
      - https://github.com/MoonshotAI/kimi-code#use-it-in-your-editor-acp
      - https://zed.dev/docs/ai/external-agents
