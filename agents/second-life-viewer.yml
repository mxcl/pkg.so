id: cask:second-life-viewer
display-name: Second Life Viewer
repo: https://github.com/secondlife/viewer
docs:
  - https://community.secondlife.com/knowledgebase/english
  - https://wiki.secondlife.com/wiki/Open_source
  - https://wiki.secondlife.com/wiki/Source_downloads
config-file-location:
  linux:
    - ~/.secondlife/user_settings/settings.xml
  macos:
    - ~/Library/Application Support/SecondLife/user_settings/settings.xml
  windows:
    - '%APPDATA%\SecondLife\user_settings\settings.xml'
credentials-file-location: null
history:
  adoption-history:
    - >
      Second Life developed a large resident and creator community around user-built
      environments, social activity, and a virtual economy. Linden Lab reported at the
      platform's twentieth anniversary that more than 73 million accounts had been
      created and that the service had about 750,000 monthly active users at that time.
    - >
      Open-sourcing the viewer enabled community participation and an ecosystem of
      policy-governed third-party viewers. Linden Lab's Project Snowstorm process
      provides the route for community viewer contributions to reach official
      development.
  package-nerd-significance:
    - >
      The viewer is the installable client for one of the longest-running large-scale
      virtual worlds. Its open-source code, multi-platform history, third-party viewer
      ecosystem, and long-lived local settings format make it notable beyond ordinary
      game launchers.
  project-history:
    - >
      Linden Lab developed the world initially known as LindenWorld and launched Second
      Life publicly in June 2003. The viewer is the client through which residents
      connect to the service, render its shared 3D world, communicate, create content,
      and participate in its economy.
    - >
      Linden Lab open-sourced the client in January 2007. Current official releases are
      built from the public secondlife/viewer repository, with controlled integration
      and release processes for project branches, release candidates, and the stable
      viewer.
  related-projects:
    - Project Snowstorm coordinates open-source contributions to the official viewer.
    - Third-party viewers may connect to Second Life subject to Linden Lab's viewer policy.
    - >
      The Second Life Grid is the separately operated server-side service; the public
      viewer repository does not represent the full server infrastructure.
  sources:
    - 'Official Linden Lab overview: https://lindenlab.com/about'
    - 'Official Second Life history: https://wiki.secondlife.com/wiki/History'
    - >
      Official integration process:
      https://wiki.secondlife.com/wiki/Viewer_Integration_and_Release_Processes
    - >
      Official twentieth-anniversary release:
      https://lindenlab.com/press-release/original-metaverse-second-life-celebrates-20th-birthday
    - 'Official viewer source instructions: https://wiki.secondlife.com/wiki/Source_downloads'
  summary:
    - >
      Second Life Viewer is Linden Lab's official desktop client for Second Life, a
      persistent user-created 3D virtual world. The viewer is open source, while the
      hosted grid and its economy remain services operated by Linden Lab.
  timeline:
    - '2002: Second Life enters closed beta.'
    - '2003-06: Linden Lab publicly launches Second Life.'
    - '2007-01: Linden Lab open-sources the viewer client.'
    - '2010: Project Snowstorm formalizes a route for open-source viewer contributions.'
    - "2023: Second Life and its viewer ecosystem mark the platform's twentieth anniversary."
  usage:
    - >
      Residents use the viewer to log into Second Life, navigate regions, communicate,
      customize avatars, create and edit virtual objects, manage inventory, and take
      part in the platform's marketplace and virtual economy. Developers can compile the
      official viewer source or build compliant third-party viewers.
