id: brew:cmdshelf
display-name: cmdshelf
repo: null
docs:
  - https://github.com/toshi0383/cmdshelf/blob/master/docs/getting-started.md
  - https://github.com/toshi0383/cmdshelf#readme
config-file-location:
  unix:
    - ~/.cmdshelf.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents Homebrew installation on macOS and Cargo
      installation from source, while the input facts show Homebrew packaging.
  package-nerd-significance:
    - >
      cmdshelf sits in the shell tooling niche of turning version-controlled script
      collections into executable command namespaces without hand-editing PATH.
  project-history:
    - >
      The official README presents cmdshelf as a new way of scripting, emphasizing
      directory-separated namespaces, no PATH configuration, shell completion, inherited
      standard streams, and a portable .cmdshelf.toml environment.
  related-projects:
    - >
      The official docs position cmdshelf around Git-hosted script repositories rather
      than a larger related-project family.
  sources:
    - https://github.com/toshi0383/cmdshelf#readme
    - https://github.com/toshi0383/cmdshelf/blob/master/docs/getting-started.md
    - source_facts.package-manager
  summary:
    - >
      cmdshelf is a Rust command-line script manager that treats executables in
      repositories as runnable commands.
  timeline:
    - '2018: GitHub releases page lists 1.0.2 as latest on August 18, 2018.'
  usage:
    - >
      Users add a repository as a remote, after which cmdshelf records it in
      ~/.cmdshelf.toml and lazily clones it under ~/.cmdshelf/remote/ when commands are
      needed.
