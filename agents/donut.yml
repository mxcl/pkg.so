history:
  adoption-history:
    - >
      Donut is distributed for macOS, Windows, Linux, and Nix and is positioned for
      users who need many isolated browser identities. Its later feature set expanded
      beyond profile management to proxy and WireGuard integration, encrypted
      synchronization, profile import, and programmatic control.
  package-nerd-significance:
    - >
      Donut combines a desktop anti-detect browser with packaging concerns normally
      spread across several tools: managed browser engines, per-profile state, proxy and
      VPN configuration, a local REST API, an MCP server, and optional self-hosted
      synchronization. Its open-source AGPL licensing also distinguishes it from many
      proprietary multi-profile browsers.
  project-history:
    - >
      Donut Browser is an open-source anti-detect browser built around isolated profiles
      and the Wayfern Chromium fork. The public project evolved rapidly during 2026,
      with its changelog documenting browser-engine work, networking changes, cookie
      tooling, sync hardening, and a growing automation surface.
  related-projects:
    - Wayfern is the privacy-focused Chromium-derived engine used by Donut profiles.
    - Donut Sync is the project's optional self-hostable synchronization service.
    - >
      Playwright-compatible control and the bundled MCP server expose profiles to
      automation tools and AI clients.
  sources:
    - https://donutbrowser.com/docs/
    - https://donutbrowser.com/docs/profile-import/
    - https://github.com/zhom/donutbrowser/blob/main/CHANGELOG.md
    - https://github.com/zhom/donutbrowser/blob/main/README.md
  summary:
    - >
      Donut Browser is an AGPL-licensed anti-detect browser for maintaining isolated
      browser profiles with separate fingerprints, cookies, extensions, proxies, and
      data.
  timeline:
    - >
      2026: The public changelog records rapid development of Wayfern integration,
      networking, cookie, synchronization, and automation features.
    - >
      2026: Dedicated REST API and MCP documentation described programmatic management
      and browser control.
  usage:
    - >
      Users create isolated profiles, optionally assign per-profile HTTP or SOCKS
      proxies or WireGuard configurations, and launch the bundled browser engine with a
      distinct fingerprint. Advanced workflows can manage profiles through the loopback
      REST API or bundled MCP server, while profile import supports migration from
      Chromium-family browsers.
