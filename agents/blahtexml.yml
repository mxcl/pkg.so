history:
  adoption-history:
    - >
      Its adoption is mostly in distribution packaging rather than a large public
      application ecosystem: the input package facts list Homebrew, Debian, MacPorts,
      Nix, and Ubuntu package names. That is typical for a niche document-conversion
      helper kept available for build pipelines and legacy publishing workflows.
  package-nerd-significance:
    - >
      The package is interesting because it preserves a very specific pre-Markdown,
      pre-client-side-MathJax era of math publishing: command-line TeX parsing that
      emits XML-friendly MathML for systems such as MediaWiki.
  project-history:
    - >
      The upstream README describes blahtex as a TeX-to-MathML converter designed with
      MediaWiki in mind, created by David Harvey. blahtexml was added by Gilles Van
      Assche as a source-level extension that processes entire XML files and converts
      embedded blahtex equations into MathML.
    - >
      The README's copyright range records the handoff from the 2006 blahtex work to
      Gilles Van Assche's maintenance from 2007 through 2023, with a v1.0 tag present in
      the upstream repository.
  related-projects:
    - >
      Related projects include blahtex, MediaWiki math rendering, MathML, TeX/LaTeX
      equation tooling, and browser-side renderers such as MathJax.
  sources:
    - https://github.com/gvanas/blahtexml/blob/master/README
    - https://github.com/gvanas/blahtexml/tree/master/Documentation
    - input source_facts.package-manager
  summary:
    - >
      blahtexml is a small command-line bridge between TeX-style equation input and
      MathML/XML output. It sits in the lineage of tools built for publishing systems
      that needed math rendering before browser-native MathML was dependable everywhere.
  timeline:
    - "2006: David Harvey's blahtex copyright begins."
    - "2007: Gilles Van Assche's blahtexml maintenance copyright begins."
    - '2023: Upstream README copyright range still includes Gilles Van Assche maintenance.'
    - 'v1.0: Upstream repository exposes a v1.0 tag.'
  usage:
    - >
      Users invoke `blahtex` for TeX-to-MathML conversion or `blahtexml` when the input
      is an XML document containing equations. Building `blahtexml` requires Xerces-C
      according to the upstream README.
related-packages:
  - id: brew:latexml
    reason: >
      Choose LaTeXML when you need full TeX or LaTeX document conversion into XML, HTML,
      EPUB, JATS, or MathML rather than blahtexml's focused conversion of embedded
      equations.
    rel: alternative
    sources:
      - https://github.com/gvanas/blahtexml/blob/master/README
      - https://dlmf.nist.gov/LaTeXML/
      - https://github.com/brucemiller/LaTeXML#readme
