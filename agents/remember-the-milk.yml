history:
  adoption-history:
    - >
      Remember The Milk expanded from a web task manager into a service spanning
      desktop, mobile, wearable, calendar, email, and third-party integrations. Its
      long-running free service and paid Pro tier helped it persist through several
      generations of productivity software.
  package-nerd-significance:
    - >
      Remember The Milk is a durable example of the mid-2000s web-productivity wave
      becoming a multi-platform packaged application. Its natural-language Smart Add
      syntax, Smart Lists, API, and integrations make it interesting to
      automation-minded users as well as conventional to-do-list users.
  project-history:
    - >
      The team worked on Remember The Milk for a year before launching the service in
      October 2005. A major rebuild introduced new web, Mac, iPhone, iPad, Android,
      BlackBerry 10, and Fire applications in 2016, followed by Windows and Linux
      desktop applications. The Mac desktop client was subsequently rebuilt around
      Electron to share more code across desktop platforms.
  related-projects:
    - >
      The service integrates with calendars, email, Siri, Alexa, and other applications,
      and exposes an API. MilkSync historically connected Remember The Milk with
      Microsoft Outlook.
  sources:
    - >
      https://blog.rememberthemilk.com/new-desktop-apps-introducing-remember-the-milk-for-windows-and-linux/
    - https://blog.rememberthemilk.com/the-new-remember-the-milk-is-here/
    - https://blog.rememberthemilk.com/why-we-rebuilt-our-mac-desktop-app/
    - https://www.rememberthemilk.com/about/
    - https://www.rememberthemilk.com/help/
  summary:
    - >
      Remember The Milk is a task-management service and family of applications built
      around lists, reminders, tags, Smart Lists, synchronization, and quick
      natural-language task entry.
  timeline:
    - '2005: Remember The Milk launched in October after a year of development.'
    - '2016: A rebuilt service and new web, Mac, and mobile applications launched.'
    - '2016: Official Windows and Linux desktop applications joined the Mac client.'
    - >
      Later 2010s: The desktop client moved to Electron for performance and shared
      cross-platform code.
  usage:
    - >
      Users capture tasks through the application, email, or integrations; organize them
      with lists, tags, locations, priorities, dates, and recurrence; and construct
      Smart Lists from saved searches. Account synchronization keeps the same task
      collection available across supported platforms.
