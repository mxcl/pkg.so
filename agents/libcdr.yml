history:
  adoption-history:
    - >
      libcdr's main adoption path is through office and graphics applications that need
      CorelDRAW import without embedding a private reverse-engineered parser. The
      Document Liberation Project lists users of its import libraries including
      LibreOffice, Inkscape, Scribus, Calligra, AbiWord, and CorelDRAW File Viewer.
    - >
      A 2017 Document Foundation community post announced libcdr 0.1.4 alongside other
      DLP releases and noted OSS-Fuzz-related security hardening and build fixes. That
      is the kind of maintenance work that made these small parser libraries valuable to
      distributions: they are format-compatibility code, but also attack surface for
      untrusted documents.
  package-nerd-significance:
    - >
      libcdr is significant because it shows the Unix packaging model applied to
      document import filters: one reverse-engineered parser, maintained outside a
      single office suite, shared by multiple applications and distributions. It also
      represents the quiet infrastructure behind 'LibreOffice can open this old
      proprietary file' release notes.
  project-history:
    - >
      The libcdr README describes the project as a library and set of tools for reading
      and converting binary files produced by CorelDRAW, with the primary source in
      LibreOffice Gerrit and a mirror on freedesktop/GitHub. Its build dependencies,
      including librevenge, place it in the Document Liberation Project import-library
      pattern.
    - >
      The Document Liberation Project explains the broader origin: after LibreOffice
      forked in 2010, contributors and file-format specialists worked on proprietary
      format interoperability, beginning with libvisio in Google Summer of Code 2011 and
      expanding to formats including CorelDraw, MS Publisher, Apple Keynote, and old
      Macintosh formats. In April 2014 the family became the Document Liberation Project
      under The Document Foundation.
  related-projects:
    - >
      Related projects include LibreOffice, librevenge, libvisio, libfreehand, libzmf,
      libwpd, libwpg, Inkscape, Scribus, Calligra, AbiWord, and other Document
      Liberation Project import libraries.
  sources:
    - >
      https://blog.documentfoundation.org/blog/2017/09/20/document-liberation-project-new-releases/
    - https://formulae.brew.sh/formula/libcdr
    - https://gerrit.libreoffice.org/gitweb?p=libcdr.git%3Ba%3Dsummary
    - https://github.com/LibreOffice/libcdr/blob/master/README
    - https://www.documentliberation.org/about/
  summary:
    - >
      libcdr is a Document Liberation Project library and tool set for reading and
      converting binary CorelDRAW documents. It belongs to the LibreOffice-adjacent
      family of import libraries that turn proprietary office and graphics formats into
      reusable parsers.
  timeline:
    - >
      2010: LibreOffice project began, creating the community context described by the
      Document Liberation Project.
    - >
      2011: libvisio emerged as an early LibreOffice file-format interoperability
      library through Google Summer of Code.
    - '2014-04: The Document Liberation Project was founded under The Document Foundation.'
    - '2017-09-20: TDF blog announced libcdr 0.1.4 with OSS-Fuzz hardening and build fixes.'
  usage:
    - >
      The package exposes conversion utilities such as cdr2raw, cdr2text, cdr2xhtml,
      cmx2raw, cmx2text, and cmx2xhtml. In normal desktop use, the library is more often
      pulled in by applications that need to import CorelDRAW or CMX documents.
related-packages:
  - id: cask:inkscape
    reason: >
      Use Inkscape with libcdr when you want to open and edit CorelDRAW files in a
      graphical vector editor; Inkscape officially documents libcdr as the dependency
      providing that import feature.
    rel: adjacent_workflow
    sources:
      - https://wiki.inkscape.org/wiki/Tracking_Dependencies
      - https://www.documentliberation.org/projects/
