history:
  adoption-history:
    - >
      Gloomberb is distributed as a macOS desktop cask, a Windows desktop application,
      and a cross-platform terminal interface. The official installer and Bun package
      make it usable outside the desktop bundle, while the same command language and
      local data model span both interfaces.
  package-nerd-significance:
    - >
      Gloomberb combines a keyboard-driven market terminal, structured CLI output, local
      state, and an extensible plug-in system in one open-source package. Its
      desktop-and-TUI pairing is particularly relevant to package users who want an
      interactive financial workstation that also fits shell automation and reproducible
      machine setup.
  project-history:
    - >
      Gloomberb was developed as an open-source financial research terminal with desktop
      and terminal interfaces. Its scope grew to include quotes, charts, filings,
      portfolios, watchlists, alerts, notes, plug-ins, optional broker connections, and
      optional Gloomberb Cloud services.
    - >
      The project keeps core portfolios, watchlists, layouts, notes, configuration, and
      compatible provider data usable locally. Cloud accounts add synchronization, chat,
      hosted data, and command assistance rather than replacing the local application.
  related-projects:
    - >
      Gloomberb Cloud supplies optional account-backed synchronization, chat, and hosted
      data services.
    - >
      The separate Gloom News API and Gloom MCP server expose hosted financial data to
      software and agent clients.
    - >
      External Gloomberb plug-ins can be installed from GitHub into the application's
      local plug-in directory.
  sources:
    - 'Official changelog: https://gloom.sh/changelog'
    - 'Official cloud overview: https://gloom.sh/docs/cloud-and-data'
    - 'Official documentation: https://gloom.sh/docs'
    - 'Official repository: https://github.com/gloom-sh/gloomberb'
  summary:
    - >
      Gloomberb is an open-source, keyboard-driven financial research terminal with
      native desktop and terminal interfaces. It combines market-data panes with local
      portfolios, watchlists, layouts, notes, automation-oriented CLI output, and a
      plug-in architecture.
  timeline:
    - >
      2026: Public documentation describes a cross-platform desktop and terminal
      application with optional cloud services.
    - >
      2026: The 0.14 series adds configurable keybindings, safer plug-in loading, and
      relocation of the local data directory through GLOOMBERB_HOME.
  usage:
    - >
      Users launch the desktop application or run `gloomberb` for the terminal UI, then
      open research, charting, news, portfolio, watchlist, alert, and note workflows
      through its command bar.
    - >
      Shell users can invoke headless commands and request JSON, CSV, or NDJSON output.
      `gloomberb doctor` checks local configuration, cache, plug-ins, and capabilities,
      while `gloomberb config` manages editable settings.
    - >
      An account is optional for local workflows. Signing in enables supported
      synchronization, chat, command assistance, and hosted data. The official
      documentation does not identify a stable standalone configuration filename or
      on-disk credential file, so no such paths are asserted here.
