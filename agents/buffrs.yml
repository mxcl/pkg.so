history:
  adoption-history:
    - >
      Buffrs has a focused adoption profile: it is available through Cargo, Homebrew,
      and Nix, and its own documentation highlights Artifactory-backed registries rather
      than a large public central registry. That makes it most relevant to organizations
      managing internal Protobuf APIs.
    - >
      Its public roadmap shows the project evolving from package manifests and
      Artifactory distribution toward additional Protobuf tooling such as bindgen,
      linting, validation, and formatting.
  package-nerd-significance:
    - >
      Buffrs is package-nerd bait because it applies familiar package-manager
      primitives, manifests, lock files, registry login, dependency graphs, checksums,
      and publish/install commands, to raw Protobuf schema files.
    - >
      It overlaps conceptually with Buf modules but comes from a Rust/Helsing tooling
      angle and explicitly supports Artifactory-backed package distribution.
  project-history:
    - >
      Helsing created Buffrs to address a Protobuf distribution problem: raw `.proto`
      files are language-independent, but sharing them between projects often becomes ad
      hoc vendoring or generated-code publication. Buffrs treats Protobuf schemas as
      first-class packages.
    - >
      The README and book describe a package-manager workflow with `Proto.toml`
      manifests, recursive local dependencies, workspaces, Artifactory integration,
      reproducible lock files, and planned self-hosted registry work.
  related-projects:
    - Buf is the neighboring Protobuf module and registry ecosystem.
    - `protoc` and tonic are documented Buffrs generation backends.
    - >
      Artifactory is a supported registry backend for publishing and consuming Buffrs
      packages.
  sources:
    - https://blog.helsing.ai/posts/buffrs-a-package-manager-for-protocol-buffers-12
    - https://docs.rs/buffrs
    - https://github.com/helsing-ai/buffrs
    - https://helsing-ai.github.io/buffrs
    - source_facts.package-manager
  summary:
    - >
      Buffrs is a Rust CLI for package-based Protocol Buffers distribution, designed
      around manifests, lock files, registry login, dependency installation, packaging,
      and publishing.
  timeline:
    - '2020s: Helsing announced Buffrs as a package manager for Protocol Buffers.'
    - >
      2020s: The README documented support for project manifests, dependency
      declaration, Artifactory package distribution, tonic generation, and protoc
      generation.
    - >
      2020s: The roadmap listed a future self-hostable S3-based `buffrs-registry` and
      additional Protobuf tooling.
  usage:
    - >
      The documented quickstart is `buffrs login`, `buffrs init --api`, `buffrs add
      <dependency>`, and `buffrs install`. The CLI also supports creating packages,
      linting, removing dependencies, packaging, publishing, listing managed protobuf
      files, and lockfile operations.
    - >
      `Proto.toml` is the project manifest. Credentials are stored under
      `~/.buffrs/credentials.toml` according to the existing curation.
related-packages:
  - id: brew:buf
    reason: >
      Buf is the stronger alternative when users want a broader Protobuf toolchain with
      formatting, linting, breaking-change detection, code generation, dependency
      management, and the Buf Schema Registry rather than Buffrs'
      package-and-Artifactory-centered workflow.
    rel: alternative
    sources:
      - https://helsing-ai.github.io/buffrs/
      - https://buf.build/docs/
