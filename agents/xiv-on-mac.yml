config-file-location:
  macos:
    - XIV on Mac install folder/FFXIV Config (open with File > Open Install Folder)
credentials-file-location:
  macos:
    - macOS Passwords app
    - 'Keychain Access entry: secure.square-enix.com'
history:
  adoption-history:
    - >
      The project targets Final Fantasy XIV players on Apple Silicon who want an
      alternative to Square Enix's native macOS launcher. Its integrated setup,
      patching, repair, mod support, benchmark support, and community help reduced the
      amount of manual Wine and CrossOver assembly previously needed.
  package-nerd-significance:
    - >
      XIV on Mac is notable as a community-maintained compatibility stack distributed
      like a conventional Mac application. It combines a native Swift launcher with
      Wine, graphics translation components, game patching, and optional plugin
      integrations, hiding a complex Windows-game runtime behind a Mac-oriented setup
      flow.
  project-history:
    - >
      XIV on Mac grew from earlier files and scripts for running Final Fantasy XIV
      through CrossOver and XIVLauncher into a self-contained native macOS launcher and
      Wine wrapper.
    - >
      The 2022 v3.0 release introduced a native Apple Silicon launcher, initial setup
      wizard, custom installer and patcher, live settings, automatic updates, and
      integrated plugin support. Later releases improved repair, logging, patch
      reliability, graphics translation, and integrations such as IINACT and Dalamud.
  related-projects:
    - >
      The stack draws on Wine, XIVLauncher, DXVK or DXMT, and MoltenVK. Optional
      integrations include Dalamud and IINACT; the project explicitly states that it is
      not affiliated with Square Enix.
  sources:
    - 'Official FAQ: https://www.xivmac.com/frequently-asked-questions'
    - 'Official releases: https://github.com/marzent/XIV-on-Mac/releases'
    - 'Official repository: https://github.com/marzent/XIV-on-Mac'
    - 'Official website: https://www.xivmac.com/'
  summary:
    - >
      XIV on Mac is an open-source Wine-based setup tool and alternative launcher for
      playing Final Fantasy XIV on Apple Silicon Macs.
  timeline:
    - >
      2022: Version 3.0 introduced the native Apple Silicon launcher, installer,
      patcher, automatic updates, and integrated plugin support.
    - >
      2022: Version 4.1.6 added game repair, more reliable patching and logging, and a
      custom XIVLauncher backend.
    - >
      Later development: The project added updated graphics translation, MetalFX-related
      features, benchmark support, and expanded mod and overlay integrations.
  usage:
    - >
      Users install XIV on Mac, complete its setup wizard, sign in to their Final
      Fantasy XIV account, and let the launcher install, patch, repair, and start the
      Windows game through its managed Wine environment.
    - >
      Launcher settings are available from XIV on Mac > Settings. File > Open Install
      Folder reveals game data, FFXIV configuration, the Wine prefix, Dalamud data, and
      logs. Saved login and optional OTP data appear under secure.square-enix.com in
      macOS Passwords or Keychain Access.
