history:
  adoption-history:
    - >
      bchunk spread because BIN/CUE images were common from non-Unix CD-writing software
      while many Unix CD tools wanted ISO, CDR, or WAV tracks. The upstream page
      explicitly notes Debian packaging and BSD ports, and the supplied package-manager
      facts show broad packaging across Homebrew and Linux distributions.
    - >
      A 2017 security update fixed several malformed-CUE handling issues and CVEs,
      giving old distro packages a clear reason to converge on 1.2.2.
  package-nerd-significance:
    - >
      bchunk is a classic preservation-and-interoperability package: tiny, old, and very
      useful exactly when an archive arrives in a format your Unix tools do not want.
    - >
      Its package-manager persistence says a lot about long-tail media tooling.
      Optical-disc images faded from everyday use, but package collections keep the
      converter one install away for archival, retro-computing, and recovery work.
  project-history:
    - >
      Heikki Hannikainen released bchunk 1.0.0 on 1998-10-11. The README and homepage
      describe it as a Unix/C rewrite of Bob Marietta's BinChunker Pascal/Delphi
      implementation.
    - >
      The project grew through compatibility patches for MODE2/2352, PlayStation-style
      tracks, WAV output, raw extraction, and portability across older Unix systems.
      Development later moved around the official GitHub repository linked from the
      homepage.
  related-projects:
    - Bob Marietta's original BinChunker is the upstream ancestor.
    - >
      FireBurner is mentioned by the README as the later non-Unix tool that obsoleted
      the original BinChunker.
    - cdrecord, sox, and mount workflows consume the ISO, CDR, and WAV outputs.
  sources:
    - http://he.fi/bchunk
    - https://github.com/hessu/bchunk
    - https://github.com/hessu/bchunk/blob/master/ChangeLog
    - https://github.com/hessu/bchunk/blob/master/README
    - source_facts.package-manager
  summary:
    - >
      bchunk, short for binchunker, converts BIN/CUE or RAW/CUE CD images into ISO data
      tracks and CDR or WAV audio tracks.
  timeline:
    - '1998: 1.0.0 initial release.'
    - >
      2001: 1.1.0 added MODE2/2352, PSX-oriented handling, WAV output, a man page, and
      make install.
    - '2004: 1.2.0 added raw MODE2/2352 extraction.'
    - '2017: 1.2.2 security update fixed malformed-CUE CVEs and track-size calculation.'
  usage:
    - >
      The normal command form is bchunk <image.bin> <image.cue> <basename>, with
      switches for verbose output, PSX handling, raw MODE2/2352 extraction, WAV audio
      output, and sample byte swapping.
    - >
      Its output ISO tracks can be mounted or burned, while CDR/WAV tracks can be
      handled by audio or CD-writing tools.
related-packages:
  - id: brew:cdrtools
    reason: >
      bchunk's official manual documents using cdrecord from cdrtools to write the ISO
      and CDR tracks produced from a BIN/CUE image.
    rel: adjacent_workflow
    sources:
      - https://github.com/hessu/bchunk/blob/master/bchunk.1
      - https://cdrtools.sourceforge.net/private/cdrecord.html
  - id: brew:sox
    reason: >
      bchunk's official manual documents using SoX to convert its native CDR audio-track
      output into WAV or other audio formats.
    rel: adjacent_workflow
    sources:
      - https://github.com/hessu/bchunk/blob/master/bchunk.1
      - https://sox.sourceforge.net/
