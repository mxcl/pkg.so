id: brew:firefoxpwa
display-name: PWAsForFirefox
repo: null
docs:
  - https://pwasforfirefox.filips.si/
  - https://pwasforfirefox.filips.si/user-guide
  - https://pwasforfirefox.filips.si/user-guide/console
config-file-location:
  linux:
    - ${XDG_DATA_HOME:-$HOME/.local/share}/firefoxpwa/
  macos:
    - ~/Library/Application Support/firefoxpwa/
  windows:
    - '%APPDATA%\FirefoxPWA\'
credentials-file-location: null
history:
  adoption-history:
    - >
      Its adoption is mostly among Firefox users who want Chromium-style site-specific
      app workflows without leaving Firefox. The official README points to AMO users and
      Repology/package badges, and the Homebrew input records packages across Homebrew,
      Chocolatey, Nix, Arch, Scoop, and winget.
  package-nerd-significance:
    - >
      Package maintainers care about PWAsForFirefox because it is not just a small CLI
      wrapper: native runtime, extension, Firefox compatibility, per-platform packaging,
      and code-signing all have to line up for the same versioned release.
  project-history:
    - >
      The project appeared publicly on GitHub in 2021 and frames itself around a gap in
      Firefox: the browser supports many PWA-related web APIs, but not installation of
      sites as standalone system apps. PWAsForFirefox answers that by maintaining a
      modified Firefox runtime plus native helper tooling and an extension.
  related-projects:
    - >
      Related technologies include Firefox, Mozilla WebExtensions, Progressive Web Apps,
      site-specific browser tools, and Firefox chrome-customization projects cited by
      the upstream README.
  sources:
    - https://github.com/filips123/PWAsForFirefox
    - https://github.com/filips123/PWAsForFirefox/releases
    - https://pwasforfirefox.filips.si/
  summary:
    - >
      PWAsForFirefox is a companion native runtime, command-line tool, and Firefox
      extension for installing web sites as Progressive Web Apps even though Firefox
      itself does not provide a built-in standalone PWA installation flow.
  timeline:
    - '2021: GitHub repository created.'
    - '2024: 2.12.x and 2.13.x releases continued active packaging work.'
    - '2026: 2.18.4 published with ongoing Firefox/runtime maintenance.'
  usage:
    - >
      Typical use starts by installing the browser extension and native runtime, then
      using the extension or `firefoxpwa` console tool to install, launch, and manage
      standalone web apps and their isolated Firefox profiles.
related-packages: []
