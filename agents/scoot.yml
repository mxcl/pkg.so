history:
  adoption-history:
    - >
      Scoot is distributed both as a downloadable macOS application bundle and through
      Homebrew Cask. Its official repository accepts contributions and serves as the
      application's help documentation.
    - >
      The project complements built-in macOS facilities such as Mouse Keys and
      keyboard-firmware mouse emulation rather than attempting to replace pointing
      devices entirely.
  package-nerd-significance:
    - >
      Scoot is a compact open-source macOS utility whose Homebrew Cask installation,
      Swift/AppKit implementation, accessibility permissions, and extensive keyboard
      customization make it especially relevant to keyboard-centric and
      automation-oriented setups.
  project-history:
    - >
      Michael Russo began Scoot as an experiment in making keyboard-driven mouse
      movement efficient enough for regular use. The application is implemented
      primarily in Swift with AppKit, with some Carbon code, and is released under the
      BSD 3-Clause License.
  related-projects:
    - The element-label navigation design is explicitly inspired by avy.
    - >
      The README discusses using Scoot alongside macOS Mouse Keys, QMK keyboard
      firmware, Karabiner-Elements, and system Emacs-style keybindings.
  sources:
    - 'Homebrew Cask provenance: source_facts.package-manager and source_facts.provenance'
    - 'Official repository and comprehensive README: https://github.com/mjrusso/scoot'
  summary:
    - >
      Scoot is an open-source macOS utility for moving, clicking, dragging, and
      scrolling the pointer with keyboard commands.
  timeline:
    - '2021: The copyright period recorded by the project begins.'
  usage:
    - >
      Global shortcuts activate element-based, grid-based, or freestyle navigation.
      Users type generated labels to jump to interface elements or grid cells, then use
      keyboard commands to click, drag, scroll, or make fine cursor movements.
    - >
      Scoot requires macOS Accessibility permission. Its shortcuts, vi mode, movement
      behavior, and visual appearance are customized through the in-app Preferences
      window.
