config-file-location:
  macos:
    - ~/Library/Containers/com.tunabellysoftware.diskdiet
credentials-file-location: null
history:
  adoption-history:
    - >
      Tunabelly describes Disk Diet as one of the earliest Mac App Store applications
      and reports more than 100,000 downloads. It has remained available through major
      macOS transitions, including sandboxing, hardened runtime, Intel-to-Apple-silicon
      migration, and newer privacy controls.
    - >
      The application is distributed through both the Mac App Store and Tunabelly's
      website. The two channels differ in licensing and helper-tool handling because App
      Store sandbox rules restrict privileged cleanup operations.
  package-nerd-significance:
    - >
      Disk Diet represents the long-running class of focused, native Mac maintenance
      utilities sold outside and through the Mac App Store. Its sandbox permissions,
      Full Disk Access requirements, and separately installed privileged helper
      illustrate how macOS security boundaries shape system-cleaning software.
  project-history:
    - >
      Tunabelly Software originally released Disk Diet in 2011 as a Mac disk-cleaning
      utility. The company describes it as the first disk-cleaning application for macOS
      and one of the first applications on the Mac App Store.
    - >
      Across more than a decade of updates, Disk Diet added cleanup categories,
      unused-application detection, Apple-silicon support, modern macOS appearance,
      privacy-permission handling, and security-hardening changes. A 2019 update
      replaced its privileged-helper approach to resolve a reported privilege-escalation
      vulnerability.
  related-projects:
    - >
      The Disk Diet Helper enables system-log and unused-translation cleanup that the
      Mac App Store build cannot bundle under store rules.
    - Tunabelly Software also develops other Mac utilities, including TG Pro and Folder Tidy.
  sources:
    - https://www.tunabellysoftware.com/disk_diet/
    - https://www.tunabellysoftware.com/disk_diet/releasenotes/
    - https://www.tunabellysoftware.com/support/diskdiethelper/
    - https://www.tunabellysoftware.com/support/faq/
  summary:
    - >
      Disk Diet is a proprietary macOS storage-cleanup utility from Tunabelly Software.
      It scans selected cleanup areas such as caches, logs, trash, downloads, obsolete
      iOS updates, unused applications, and Xcode build files.
  timeline:
    - >
      2011: Disk Diet was originally released and became one of the early Mac App Store
      applications.
    - >
      2017: Disk Diet added broader unused-application selection and macOS High Sierra
      support.
    - '2019: An updated helper resolved a reported privilege-escalation vulnerability.'
    - >
      2025: Disk Diet 5.6 added faster scanning and updated macOS privacy and
      folder-permission handling.
  usage:
    - >
      Users select a drive and cleanup categories, review the space Disk Diet says can
      be reclaimed, and run a cleanup. App Store builds require users to grant access to
      relevant folders, while Full Disk Access and the optional helper are needed for
      some protected areas.
    - >
      Tunabelly's FAQ documents resetting the application preferences by removing
      ~/Library/Containers/com.tunabellysoftware.diskdiet. The helper, when installed,
      uses /Library/PrivilegedHelperTools/com.tunabellysoftware.DiskDietHelper and
      /Library/LaunchDaemons/com.tunabellysoftware.DiskDietHelper.plist.
