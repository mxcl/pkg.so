id: brew:modal
display-name: Modal
repo: https://github.com/modal-labs/modal-client
docs:
  - https://modal.com/docs/cli
  - https://modal.com/docs/guide
config-file-location:
  unix:
    - ~/.modal.toml
credentials-file-location:
  unix:
    - ~/.modal.toml
history:
  adoption-history:
    - >
      Modal packages its Python SDK and CLI together, allowing developers to install a
      local client and submit workloads to Modal's hosted infrastructure. The Homebrew
      formula provides the `modal` executable as a system-level alternative to
      installing it inside each Python environment.
  package-nerd-significance:
    - >
      The package bridges local Python development and managed serverless
      infrastructure. It is notable as both a language SDK and an operational CLI, with
      authentication and deployment commands exposed through the same installation.
  project-history:
    - >
      Modal developed its client as the local interface to its serverless compute
      platform. The official modal-labs/modal-client repository now contains Python,
      JavaScript/TypeScript, and Go SDK code, while Python remains the primary language
      for defining and deploying Modal applications.
  related-projects:
    - >
      The official modal-labs/modal-client repository houses the Modal SDK
      implementations for Python, JavaScript/TypeScript, and Go.
  sources:
    - https://github.com/modal-labs/modal-client
    - https://modal.com/docs/guide
    - https://modal.com/docs/sdk/py/latest/config
  summary:
    - >
      Modal is the official client library and command-line interface for Modal's
      serverless AI infrastructure. It runs and deploys code to managed containers used
      for inference, batch jobs, training, sandboxes, notebooks, and web endpoints.
  timeline:
    - >
      2022: Modal's public client repository began serving as the open-source SDK
      surface for the platform.
    - >
      2026: The repository hosts official Python, JavaScript/TypeScript, and Go SDK
      implementations.
  usage:
    - >
      After installation, users run `modal setup` or `modal token set` to authenticate,
      then use commands such as `modal run`, `modal serve`, and `modal deploy` with
      Python application files. Tokens can be stored in `~/.modal.toml` or supplied
      through `MODAL_TOKEN_ID` and `MODAL_TOKEN_SECRET`.
