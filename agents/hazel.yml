history:
  adoption-history:
    - >
      Hazel became a long-running macOS automation utility used by power users to
      organize Downloads, Desktop, document, media, and archival workflows. Direct
      vendor distribution and Homebrew Cask make it available to both conventional Mac
      users and package-managed workstation setups.
  package-nerd-significance:
    - >
      Hazel brings persistent, rule-based automation directly to the filesystem without
      requiring users to maintain a general-purpose script or daemon. Its rules can
      classify, rename, move, copy, tag, archive, upload, and remove files based on
      metadata and contents.
  project-history:
    - >
      Noodlesoft developed Hazel around a folder-and-rule model resembling mail rules:
      users select monitored folders, define conditions, and attach actions. Successive
      major versions expanded its matching, preview, automation, and file-management
      capabilities while preserving that core model.
    - >
      Hazel 5 moved from a System Preferences pane to a standalone application.
      Noodlesoft continues to maintain the product; its official release notes list
      Hazel 6.1.2 in February 2026.
  related-projects:
    - >
      Hazel complements Finder tags, Spotlight metadata, AppleScript, Automator,
      Shortcuts, and shell scripts rather than replacing the Finder itself.
  sources:
    - 'Official Hazel User Guide: https://www.noodlesoft.com/manual/hazel/'
    - 'Official Hazel overview: https://www.noodlesoft.com/manual/hazel/hazel-overview/'
    - 'Official release notes: https://www.noodlesoft.com/release_notes'
  summary:
    - >
      Hazel is a commercial macOS file-automation utility from Noodlesoft. It watches
      folders and applies user-defined rules to matching files and folders.
  timeline:
    - '2000s: Hazel emerged as a macOS folder-automation utility.'
    - '2020: Hazel 5 adopted a standalone application interface.'
    - '2026: Noodlesoft released Hazel 6.1.2.'
  usage:
    - >
      Users add one or more folders, define conditions based on names, dates, sizes,
      contents, tags, or metadata, and configure actions that Hazel runs automatically
      when items match.
    - >
      Typical workflows include cleaning Downloads, filing documents, renaming scans,
      applying Finder tags, processing media, archiving old items, and managing Trash.
