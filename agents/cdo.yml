id: brew:cdo
display-name: Climate Data Operators
repo: https://gitlab.dkrz.de/mpim-sw/cdo
docs:
  - https://code.mpimet.mpg.de/projects/cdo/embedded/cdo.pdf
  - https://code.mpimet.mpg.de/projects/cdo/wiki/Cdo
  - https://mpim-sw.gitlab-pages.dkrz.de/cdo
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CDO became a standard command-line utility in climate and weather data workflows
      because it provides hundreds of operators over GRIB, NetCDF, SERVICE, EXTRA, and
      IEG data. Official docs emphasize fast processing, chaining multiple operators,
      and availability on Unix/Linux systems, Cygwin, and macOS.
    - >
      Package-manager adoption is broad for a science CLI: Homebrew, Debian, Ubuntu,
      MacPorts, and Nix all package it according to the input facts, reflecting its role
      in reproducible climate-data pipelines.
  package-nerd-significance:
    - >
      CDO is significant for package maintainers because it sits at the intersection of
      scientific file formats, HPC-style Unix workflows, and fast-moving climate data
      standards. Its packaging pulls in format libraries and exposes a stable CLI
      expected by scripts, notebooks, and institutional workflows.
  project-history:
    - >
      The official contributors page says CDO was originally developed by Uwe
      Schulzweida at the Max Planck Institute for Meteorology, with the first public
      release available since 2003. It was inspired by earlier MPI-M and DKRZ
      climate-data tools, including PINGO and GRIB-Modules.
    - >
      The project is now hosted under the mpim-sw group at DKRZ GitLab, with official
      documentation generated for CDO 2.6.3 and active releases noted on the MPI-M
      Redmine project page in June 2026.
  related-projects:
    - >
      CDO is related to CDI, PINGO, GRIB-Modules, SCRIP, YAC, GRIB, NetCDF, and the
      climate-model postprocessing tools used around MPI-M and DKRZ.
  sources:
    - https://gitlab.dkrz.de/mpim-sw/cdo
    - https://code.mpimet.mpg.de/projects/cdo
    - https://code.mpimet.mpg.de/projects/cdo/embedded/cdo.pdf
    - https://code.mpimet.mpg.de/projects/cdo/wiki/Cdo
    - https://mpim-sw.gitlab-pages.dkrz.de/cdo
    - https://formulae.brew.sh/api/formula/cdo.json
  summary:
    - >
      Climate Data Operators, or CDO, is a command-line suite for manipulating and
      analyzing climate and numerical weather prediction data in formats such as GRIB
      and NetCDF.
  timeline:
    - "1991: MPI-M GRIB-Modules developed, later influencing CDO's module structure."
    - '1995: DKRZ develops PINGO, whose interface and operators influence CDO.'
    - '2003: First public CDO release available.'
    - '2026: Official project page lists CDO 2.6.x releases and generated 2.6.3 documentation.'
  usage:
    - >
      Users run cdo commands to select, transform, remap, aggregate, and inspect climate
      model and forecast datasets. The docs highlight more than 700 operators, a simple
      Unix command-line interface, and support for large datasets with missing values.
related-packages:
  - id: brew:nco
    reason: >
      NetCDF Operators is a focused alternative when the workflow is specifically
      NetCDF-centric and needs dedicated arithmetic, averaging, concatenation,
      extraction, or metadata operations.
    rel: alternative
    sources:
      - https://mpim-sw.gitlab-pages.dkrz.de/cdo/
      - https://nco.sourceforge.net/nco.pdf
  - id: brew:netcdf
    reason: >
      The NetCDF utilities complement CDO by inspecting file structure with ncdump and
      generating or converting the NetCDF datasets that CDO processes.
    rel: adjacent_workflow
    sources:
      - https://mpim-sw.gitlab-pages.dkrz.de/cdo/
      - https://docs.unidata.ucar.edu/netcdf-c/current/netcdf_working_with_netcdf_files.html
