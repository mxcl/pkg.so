id: cask:ppsspp-emulator
display-name: PPSSPP
repo: https://github.com/hrydgard/ppsspp
docs:
  - https://www.ppsspp.org/docs
config-file-location:
  unix:
    - ~/.config/ppsspp/PSP/SYSTEM/ppsspp.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      PPSSPP expanded from early Windows and Android builds into a cross-platform
      emulator available for Windows, macOS, Linux, Android, iOS, and additional
      community-supported systems. Its official distribution includes conventional
      desktop installers, portable builds, mobile app-store releases, Flatpak, and
      AppImage options.
  package-nerd-significance:
    - >
      PPSSPP is notable to package maintainers because it combines a
      performance-sensitive C++ emulator core, multiple CPU and graphics backends,
      platform-specific packaging, and a persistent emulated Memory Stick layout. Its
      portable and installed modes also make user-data placement an important packaging
      concern.
  project-history:
    - >
      PPSSPP is an open-source, GPL-licensed high-level emulator for software written
      for Sony's PlayStation Portable. Its official release archive documents active
      development by late 2012, followed by the milestone 1.0 release in 2015 and
      continuing compatibility, performance, and platform work.
  related-projects:
    - >
      PPSSPP belongs to the open-source console-emulation ecosystem. Its official
      documentation distinguishes PSP software from PlayStation 1 titles and UMD Video,
      which it does not emulate.
  sources:
    - 'Official 0.4 release announcement: https://www.ppsspp.org/news/release-0.4/'
    - 'Official 1.0 release announcement: https://www.ppsspp.org/news/release-1.0/'
    - >
      Official development introduction:
      https://www.ppsspp.org/docs/development/getting-started/
    - 'Official introduction: https://www.ppsspp.org/docs/getting-started/introduction/'
    - 'Official repository: https://github.com/hrydgard/ppsspp'
  summary:
    - >
      PPSSPP is an open-source, cross-platform emulator that runs games and other
      software made for the Sony PlayStation Portable.
  timeline:
    - '2012: The official site announced PPSSPP 0.4 for Windows and Android.'
    - '2015: PPSSPP 1.0 was released.'
    - >
      Later development: Releases expanded compatibility, rendering backends, device
      support, and desktop and mobile distribution options.
  usage:
    - >
      Users supply their own PSP software as ISO, CSO, or supported homebrew files.
      PPSSPP provides configurable graphics, audio, controls, save states, multiplayer
      features, and an emulated Memory Stick directory for saved data and settings.
