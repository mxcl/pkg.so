history:
  adoption-history:
    - >
      The changelog documents early Windows support in 2002, continuing Unix
      development, and completion of macOS support during the Qt 4 port in 2007. Later
      releases supplied native macOS binaries and broader cross-platform database and
      cryptographic-token support.
  package-nerd-significance:
    - >
      XCA gives administrators and developers a graphical, database-backed alternative
      to assembling small certification-authority workflows from individual OpenSSL
      commands. Its support for templates, certificate chains, CRLs, smart cards,
      standard import/export formats, and multiple SQL backends makes it useful for lab
      PKI and internal certificate work.
  project-history:
    - >
      XCA's official changelog reaches back to version 0.1.11 in July 2002, when it
      could generate RSA keys and store them in a local Berkeley DB. The 0.x series
      added certificate signing, templates, CRLs, Windows support, translations, and
      eventually Qt 4 and macOS support.
    - >
      Version 2.0 replaced the legacy store with an SQL-based design supporting SQLite,
      MySQL, and PostgreSQL. Subsequent releases added OpenSSL 3 and Qt 6 support,
      followed the XDG base-directory specification, and expanded algorithms, formats,
      and database-driver options.
  related-projects:
    - >
      XCA builds certificate-management workflows around OpenSSL-compatible formats and
      concepts. It can use SQLite locally or MySQL, MariaDB, PostgreSQL, and
      ODBC-accessible databases remotely, and it integrates with PKCS#11 smart cards and
      hardware tokens.
  sources:
    - 'Official XCA changelog: https://hohnstaedt.de/xca-doc/html/changelog.html'
    - 'Official XCA tutorial: https://www.hohnstaedt.de/xca/index.php/documentation/tutorial'
    - 'Official database documentation: https://hohnstaedt.de/xca-doc/html/database.html'
    - >
      Official object-ID file documentation:
      https://www.hohnstaedt.de/xca-doc/html/object-ids.html
  summary:
    - >
      XCA is a long-running, cross-platform graphical application for managing X.509
      certificates, keys, signing requests, templates, and revocation lists. It combines
      a PKI-oriented interface with encrypted database storage and standard
      cryptographic interchange formats.
  timeline:
    - '2002: Early public 0.1.x releases generated RSA keys and stored them in Berkeley DB.'
    - '2007: The Qt 4 port completed macOS support and expanded key and certificate handling.'
    - '2009: Version 0.8 added elliptic-curve keys and smart-card support.'
    - '2018: Version 2.0 moved XCA to SQL storage with SQLite, MySQL, and PostgreSQL support.'
    - >
      2023: Version 2.5 added Qt 6 and OpenSSL 3 support and adopted XDG base-directory
      conventions.
    - >
      2025: Version 2.9 updated the cryptographic and UI foundations and expanded macOS
      database-driver support.
  usage:
    - >
      Users create or open an XCA database, protect it with a password, and manage keys,
      certificates, signing requests, templates, and CRLs through the GUI. The official
      guide covers building a root CA, issuing CA-signed or self-signed certificates,
      defining reusable templates, and revoking certificates.
    - >
      XCA also provides command-line operations for inspecting and importing PKI
      material, generating keys and CRLs, and working with local or remote databases.
