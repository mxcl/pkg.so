history:
  adoption-history:
    - >
      UTM is distributed for macOS through the Mac App Store and project downloads,
      while iOS users can obtain App Store, TestFlight, GitHub, and sideloadable builds
      depending on platform restrictions. Its availability as a Homebrew cask gives
      macOS package-manager users a reproducible installation path.
  package-nerd-significance:
    - >
      UTM packages the mature QEMU ecosystem behind an Apple-native interface, making
      cross-architecture emulation and same-architecture virtualization unusually
      accessible on macOS and iOS. It is especially relevant to package enthusiasts who
      need disposable Windows, Linux, classic operating-system, or
      alternate-architecture environments on Apple hardware.
  project-history:
    - >
      UTM began as an Apple-platform frontend for QEMU and developed into a full system
      emulator and virtual-machine manager for macOS and iOS. It supports QEMU-based
      emulation, Hypervisor.framework acceleration on macOS, and Apple's
      Virtualization.framework for supported macOS guests.
    - >
      The project also maintains UTM SE, a slower interpreter-based edition intended for
      iOS environments where just-in-time code generation is unavailable. Its release
      automation produces macOS, iOS, sideloading, and alternative-distribution
      artifacts from the same project.
  related-projects:
    - QEMU supplies UTM's primary emulation and virtualization engine.
    - SPICE and QXL underpin parts of its graphical-console implementation.
    - UTM SE is the interpreter-based edition for constrained iOS distribution environments.
  sources:
    - https://docs.getutm.app/
    - https://github.com/utmapp/UTM#readme
    - https://github.com/utmapp/UTM/blob/main/Documentation/Architecture.md
    - https://github.com/utmapp/UTM/blob/main/Documentation/Release.md
  summary:
    - >
      UTM is an open-source system emulator and virtual-machine host for macOS and iOS.
      It combines an Apple-native management interface with QEMU and Apple
      virtualization technologies.
  timeline:
    - The project established QEMU-based virtual machines on iOS and macOS.
    - >
      macOS 12+: UTM added support for booting supported macOS guests through
      Virtualization.framework.
    - >
      Later releases expanded automation through Shortcuts, AppleScript, and the utmctl
      command-line interface.
  usage:
    - >
      Users create and manage Windows, Linux, macOS, and other guest systems through the
      graphical application. QEMU enables cross-architecture emulation, while Apple and
      Hypervisor frameworks accelerate supported same-architecture guests.
    - >
      Each virtual machine is stored as a .utm package containing its configuration and
      virtual storage. Power users can automate common lifecycle operations through
      Shortcuts, AppleScript, or utmctl.
