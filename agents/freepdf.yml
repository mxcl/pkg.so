history:
  adoption-history:
    - >
      FreePDF is distributed for Windows and Apple-silicon macOS, with the macOS
      application also available through Homebrew. Its scope is oriented toward
      multilingual academic and technical PDF reading rather than general-purpose PDF
      editing.
  package-nerd-significance:
    - >
      FreePDF packages several moving parts—PDF layout detection, translation services,
      local or hosted language models, fonts, and a desktop interface—behind a single
      application. Its explicit JSON configuration is useful to users who want to
      inspect or control the translation and question-answering backends.
  project-history:
    - >
      The project builds on PDFMathTranslate and DocLayout-YOLO and uses PyQt6 and
      PDF.js. It combines translated-PDF generation with optional document question
      answering through hosted services, local Ollama models, or custom
      OpenAI-compatible endpoints.
  related-projects:
    - PDFMathTranslate provides the underlying PDF translation approach.
    - DocLayout-YOLO supplies document-layout detection.
    - Ollama can provide a local language-model backend.
  sources:
    - 'Official FreePDF README: https://github.com/zstar1003/FreePDF/blob/main/README.md'
  summary:
    - >
      FreePDF is a desktop PDF reader focused on translating documents between supported
      languages and optionally answering questions about their contents.
  timeline:
    - >
      The official documentation does not provide a reliable project-origin or
      first-release date.
  usage:
    - >
      Users open text-based PDFs and select a translation engine; translated output is
      written beside the source document with a `-mono.pdf` suffix. Bing and Google
      require no extra parameters, while SiliconFlow, Ollama, and custom services are
      configured in `pdf2zh_config.json`. Scanned image-only PDFs and tables have
      documented limitations.
