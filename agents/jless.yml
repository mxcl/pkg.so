config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The input package metadata records `jless` in Homebrew, MacPorts, Nix, apk,
      pacman, and zypper. The project README also lists Homebrew, MacPorts, Arch, Void,
      NetBSD, FreeBSD, Cargo, and prebuilt release binaries, showing the package fits
      the common 'single fast CLI binary' distribution pattern.
  package-nerd-significance:
    - >
      `jless` occupies a recognizable niche in the terminal data-toolchain: it is less a
      transformer like `jq` and more an interactive pager specialized for structured
      data. That makes it attractive for package collections because it pairs well with
      curl, `jq`, logs, and API debugging without requiring a language runtime at use
      time.
  project-history:
    - >
      The GitHub repository was created in April 2021. The project developed as a
      standalone binary with a dedicated site at jless.io and a mascot/logo identity,
      while its user guide expanded beyond simple viewing into navigation, search,
      copying, printing, YAML handling, and newline-delimited JSON support.
    - >
      The release stream visible in the repository tags includes 0.7.x through 0.9.0,
      with the 0.9.0 GitHub release adding line numbers, deeper collapse and expand
      commands, print commands, and search/scrolling fixes.
  related-projects:
    - >
      The README explicitly names `less`, `jq`, `cat`, and editors as tools `jless` can
      replace for viewing JSON. The user guide also documents interoperability with `jq`
      output and refers to the Rust regex engine used for searching.
  sources:
    - >
      Project README, jless user guide, GitHub repository metadata, GitHub release
      metadata, and Homebrew formula metadata.
  summary:
    - >
      `jless` is a Rust command-line viewer for JSON data. Its README positions it as a
      replacement for combinations of `less`, `jq`, `cat`, and an editor when the task
      is reading, exploring, and searching JSON at the terminal.
  timeline:
    - '2021: The GitHub repository is created.'
    - >
      2023: Release v0.9.0 adds line numbers, print commands, deeper collapse and expand
      commands, and several interaction fixes.
    - >
      2023: The README documents distribution through multiple OS package managers plus
      Cargo and prebuilt binaries.
  usage:
    - >
      `jless` reads JSON from files or standard input, including data piped from APIs,
      `jq`, or log streams. It focuses on interactive exploration: users expand and
      collapse objects, move with vim-inspired commands, search across pretty-formatted
      data, copy JSON paths or values, and switch between data and line display modes.
    - >
      The user guide also documents YAML input and newline-delimited JSON, which makes
      the tool useful for structured logs and command-line data inspection beyond
      one-off pretty printing.
related-packages:
  - id: brew:fx
    reason: >
      Choose fx when you want an interactive JSON viewer that can also transform data
      with embedded JavaScript expressions.
    rel: alternative
    sources:
      - https://jless.io/user-guide
      - https://fx.wtf/getting-started
  - id: brew:jq
    reason: >
      Use jq to filter or transform JSON first, then pipe its output into jless for
      interactive navigation and search.
    rel: adjacent_workflow
    sources:
      - https://jless.io/user-guide
      - https://jqlang.org/manual/
