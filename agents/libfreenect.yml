history:
  adoption-history:
    - >
      libfreenect was adopted by hackers, artists, robotics users, and computer-vision
      experimenters who wanted raw access to Kinect sensors on Linux, macOS, and
      Windows. Distribution packages in Homebrew, Debian, Ubuntu, and Fedora made that
      access available without requiring users to build the USB stack from source.
  package-nerd-significance:
    - >
      libfreenect is a classic package-manager artifact from the 2010 hardware-hacking
      wave: a reverse-engineered userspace driver that turned a mass-market console
      peripheral into a general-purpose depth camera. Its packaging also illustrates how
      fragile USB device access, udev rules, OpenGL demos, language bindings, and
      optional audio support can be for cross-platform formulae.
  project-history:
    - >
      The OpenKinect repository was created on GitHub on 2010-11-12, days after the
      Kinect hardware reached consumers. The README credits original code and
      engineering to Hector Martin, community leadership to Josh Blake, and integration
      to Kyle Machulis, and marks the copyright year as 2010 for individual OpenKinect
      contributors.
    - >
      The project later settled into a long-lived cross-platform hardware support
      library. GitHub release metadata records public libfreenect releases from v0.2.0
      through v0.6.4 between 2014-02-15 and 2022-09-20, while the repository README
      points users of the newer Kinect v2 hardware to OpenKinect/libfreenect2.
  related-projects:
    - OpenKinect/libfreenect2 is the related driver stack for Kinect v2 hardware.
    - >
      Higher-level projects such as OpenNI and robotics or vision frameworks consume
      Kinect streams after libfreenect exposes the device.
  sources:
    - https://api.github.com/repos/OpenKinect/libfreenect
    - https://api.github.com/repos/OpenKinect/libfreenect/releases?per_page=100
    - https://github.com/OpenKinect/libfreenect
  summary:
    - >
      libfreenect is the OpenKinect community userspace driver and library for the
      original Xbox Kinect, exposing RGB, depth, motor, accelerometer, LED, and audio
      access outside Microsoft’s Xbox stack.
  timeline:
    - '2010-11-12: GitHub repository metadata records creation of OpenKinect/libfreenect.'
    - '2014-02-15: GitHub release metadata records v0.2.0, v0.2.1, v0.3.0, and v0.4.0 releases.'
    - '2017-11-20: GitHub release metadata records libfreenect v0.5.7.'
    - '2020-02-16: GitHub release metadata records libfreenect v0.6.0.'
    - '2022-09-20: GitHub release metadata records libfreenect v0.6.4.'
  usage:
    - >
      The package provides libraries and utilities such as freenect-glview,
      freenect-regview, freenect-micview, fakenect, and recording or test tools. It is
      used for capturing depth and color streams, testing Kinect hardware, and feeding
      higher-level vision or robotics frameworks.
