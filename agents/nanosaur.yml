history:
  adoption-history:
    - >
      The original game was bundled with early iMacs, giving it visibility beyond
      conventional retail distribution and making it a recognizable artifact of
      late-1990s Macintosh gaming. The modern port provides releases for macOS, Windows,
      and Linux, and the supplied metadata records a Homebrew Cask for macOS
      installation.
  package-nerd-significance:
    - >
      Nanosaur matters to preservation-minded package users because the modern package
      is both a playable game and a source port of a historically Mac-only QuickDraw 3D
      title. It demonstrates how released legacy source, a compatibility layer, and
      modern packaging can keep classic proprietary-platform software usable.
  project-history:
    - >
      Pangea Software released Nanosaur for Mac in 1998 as a showcase for QuickDraw 3D.
      The company released the source code publicly in 1999. Iliyas Jorio later created
      a permissioned modern source port, using the Pomme compatibility layer and
      initially a Quesa-based renderer before moving to a purpose-built renderer.
  related-projects:
    - >
      The port belongs to Iliyas Jorio's family of modernized Pangea Software games,
      alongside Nanosaur II, Bugdom, Cro-Mag Rally, Mighty Mike, Billy Frontier, and
      Otto Matic. Pomme, the port's Macintosh Toolbox compatibility layer, was
      subsequently useful for several of those projects.
  sources:
    - https://github.com/jorio/Nanosaur
    - https://github.com/jorio/Nanosaur/blob/master/docs/Nanosaur%20Instructions.pdf
    - https://github.com/jorio/Nanosaur/releases
    - https://jorio.itch.io/nanosaur
    - 'input: source_facts.package-manager.brew-cask'
  summary:
    - >
      Nanosaur is Pangea Software's 1998 third-person action game about a cybernetic
      dinosaur sent into the prehistoric past to recover dinosaur eggs. Iliyas Jorio's
      authorized source port makes the formerly Mac-exclusive game playable on modern
      macOS, Windows, and Linux systems.
  timeline:
    - '1998: Pangea Software released Nanosaur for Mac.'
    - "1999: Pangea Software released the game's source code publicly."
    - "2020: The modern port's initial playable release became available."
    - '2021: The authorized port was published on itch.io for modern desktop systems.'
    - A later renderer rewrite replaced the port's original Quesa-based rendering path.
  usage:
    - >
      Players explore the landscape under a 20-minute time limit, collect five dinosaur
      egg species, fight hostile dinosaurs, and traverse the world with weapons, a jet
      pack, compass, and GPS. Modern releases support configurable controls and gamepads
      while aiming to preserve the original game's design.
