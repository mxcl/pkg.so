id: brew:gotify
display-name: Gotify-CLI
repo: null
docs:
  - https://github.com/gotify/cli#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/gotify/cli.json
    - ~/.config/gotify/cli.json
    - ~/.gotify/cli.json
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/gotify/cli.json
    - ~/.config/gotify/cli.json
    - ~/.gotify/cli.json
history:
  adoption-history:
    - >
      Gotify-CLI adoption follows the self-hosted-notification audience for
      gotify/server. The README documents manual binary installation, Arch AUR
      packaging, and Homebrew installation, while also noting that curl or HTTPie can
      push messages directly for users who do not need the dedicated client.
  package-nerd-significance:
    - >
      For package nerds, Gotify-CLI is a tidy example of a self-hosted service exposing
      a first-party CLI while still keeping the HTTP API simple enough for curl. Its
      package value is convenience, credential storage, and script ergonomics rather
      than protocol exclusivity.
  project-history:
    - >
      The gotify/server repository began in January 2018 and published its initial 1.0.0
      release in February 2018. The gotify/cli repository followed in November 2018,
      with v1.2.0 published days later, giving the Gotify ecosystem a dedicated terminal
      client.
    - >
      The CLI README describes a focused feature set: storing the server URL and
      application token in a config file, an initialization wizard, piping support,
      simple push commands, and a watch command that sends notifications when command
      output changes.
  related-projects:
    - gotify/server is the required backend service for Gotify-CLI.
    - curl and HTTPie are documented alternatives for direct HTTP message submission.
  sources:
    - https://formulae.brew.sh/formula/gotify
    - https://github.com/gotify/cli
    - https://github.com/gotify/cli#readme
    - https://github.com/gotify/cli/releases
    - https://github.com/gotify/server
  summary:
    - >
      Gotify-CLI is the official command-line companion for gotify/server, a self-hosted
      push-notification system. It lets shell scripts and terminal users push messages
      to a Gotify server without writing raw HTTP requests.
  timeline:
    - '2018: gotify/server repository created.'
    - '2018: gotify/server v1.0.0 released.'
    - '2018: gotify/cli repository created and v1.2.0 released.'
    - '2019: gotify/cli v2.0.0 and v2.1.x releases published.'
    - '2023: v2.2.3 added GOTIFY_TOKEN override support and fixed a no-config push panic.'
    - '2024: v2.3.2 added SSL_CERT_FILE support for TLS verification.'
  usage:
    - >
      Users initialize the CLI with gotify init, then send messages with gotify push,
      pipe standard input into push, or use gotify watch around another command. The
      config stores the Gotify URL and an application token, so scripts can push
      notifications without repeating credentials on every command line.
    - >
      Release notes show maintenance around operational details such as dependency
      updates, environment-token overrides, and TLS trust configuration. That fits the
      CLI's role in scripts, cron jobs, and local monitoring workflows where reliability
      and noninteractive operation matter.
related-packages:
  - id: brew:curl
    reason: >
      Choose curl when a script only needs to submit directly to Gotify's HTTP endpoint
      and does not need Gotify-CLI's initialization, stored defaults, or watch command.
    rel: alternative
    sources:
      - https://github.com/gotify/cli#alternatives
      - https://curl.se/docs/
  - id: brew:httpie
    reason: >
      Choose HTTPie for readable ad hoc HTTP requests to Gotify when a general-purpose
      API client is more useful than a Gotify-specific configuration and command set.
    rel: alternative
    sources:
      - https://github.com/gotify/cli#alternatives
      - https://httpie.io/docs/cli
