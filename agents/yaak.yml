history:
  adoption-history:
    - >
      Yaak began 2024 as a side project. The maintainer's official year-in-review
      reported approximately 6,000 monthly active users and 25,000 total installations
      by the end of that year.
    - >
      The project added Homebrew support during 2024, was released as open source in
      September 2024, and developed a commercial-use licensing model for official
      prebuilt binaries while keeping the MIT-licensed source available.
  package-nerd-significance:
    - >
      Yaak occupies the local-first, open-source end of the API-client ecosystem.
      Requests, environments, response history, and settings remain in a local SQLite
      database, and desktop requests go directly to their target servers rather than
      through a hosted proxy.
    - >
      It appeals to developers who want REST, GraphQL, and gRPC in one native desktop
      client, with import compatibility, environment templating, encrypted secrets,
      plugins, command-line automation, and optional directory/Git synchronization.
  project-history:
    - >
      Yaak's initial public desktop release appeared in January 2024. During its first
      year it added Windows and Linux builds, gRPC, cURL and OpenAPI import, Homebrew
      distribution, and a plugin system.
    - >
      The project became open source in September 2024. In December 2024, the project
      introduced a paid license requirement for commercial use of official prebuilt
      binaries; personal use and building the MIT-licensed source remained free.
    - >
      Later releases deepened Git-friendly directory synchronization, authentication
      support, import compatibility, large-workspace performance, and agent-oriented
      command-line workflows.
  related-projects:
    - >
      Yaak presents itself as an alternative to API clients such as Postman and Insomnia
      and supports importing data from established API-tool formats.
  sources:
    - https://github.com/mountain-loop/yaak
    - https://yaak.app/blog/2024-review
    - https://yaak.app/changelog
    - https://yaak.app/docs/getting-started/security-and-privacy
    - https://yaak.app/docs/getting-started/troubleshooting
  summary:
    - >
      Yaak is a cross-platform, local-first desktop API client for REST, GraphQL, and
      gRPC. It combines request authoring and response inspection with environments,
      authentication workflows, import/export, plugins, Git-friendly synchronization,
      and command-line automation.
  timeline:
    - '2024-01-08: Initial public desktop release.'
    - '2024-01-19: Windows and Linux support followed the initial launch.'
    - '2024-07-23: Homebrew installation support was announced.'
    - '2024-09: Yaak became open source.'
    - '2024-12: Commercial-use licensing was introduced for official prebuilt binaries.'
    - '2025-01: Directory and Git synchronization was released.'
  usage:
    - >
      Developers organize requests into workspaces, define environment variables, send
      REST, GraphQL, and gRPC calls, inspect responses, and retain local response
      history.
    - >
      Yaak can import formats such as cURL, OpenAPI, and Postman collections. Directory
      synchronization can materialize workspace data as plain-text files suitable for
      Git or file-synchronization tools.
    - >
      The desktop application stores its operational data in an application data
      directory and protects designated secrets with keys held by the operating-system
      keychain. The official documentation does not identify a standalone configuration
      or credentials file, so both locations are returned as null.
