history:
  adoption-history:
    - >
      Plasticity is positioned for individual artists, designers, and studios through
      trial, Indie, and Studio licensing tiers. The official site specifically
      identifies makers, game artists, industrial designers, and mechanical engineers
      among its users.
    - >
      Its Blender Bridge and support for established CAD interchange formats have
      encouraged workflows in which Plasticity handles precise solid and surface
      modeling while another digital-content-creation application handles downstream
      rendering or production.
  package-nerd-significance:
    - >
      Plasticity occupies an unusual niche between artist-oriented polygonal modelers
      and conventional engineering CAD, combining a streamlined creative interface with
      a professional geometry kernel and NURBS-oriented tools.
    - >
      The public official repository exposes a substantial part of the application's
      development history, while distributed desktop builds and commercial features
      follow the project's licensing tiers.
  project-history:
    - >
      Plasticity developed as a CAD-oriented 3D modeling application for concept artists
      and designers, emphasizing direct, fluid solid and surface modeling.
    - >
      The product progressed through numbered 1.x releases and later year-based release
      trains. Its official manual documents an expanding set of sketch, NURBS, solid,
      surfacing, analysis, import/export, Blender, and Cinema 4D workflows.
  related-projects:
    - Blender
    - Cinema 4D
    - Parasolid
    - xNURBS
  sources:
    - 'Official manual: https://doc.plasticity.xyz/'
    - 'Official product site: https://www.plasticity.xyz/'
    - 'Official repository: https://github.com/nkallen/plasticity'
  summary:
    - >
      Plasticity is a cross-platform, CAD-oriented 3D modeler designed for concept
      artists and designers.
  timeline:
    - >
      Early releases: Plasticity established its artist-focused CAD workflow through the
      1.x release series.
    - '2024: The official manual records 2024.1 and 2024.2 release lines.'
    - >
      2025: Successive 2025 releases expanded the documented modeling workflow and
      integrations.
    - '2026: The official manual documents the 2026.1 release line and migration guidance.'
  usage:
    - >
      Users create precise curves, sheets, and solids with sketching, direct-modeling,
      NURBS, fillet, loft, sweep, boolean, measurement, and analysis tools.
    - >
      Common production workflows exchange STEP, OBJ, STL, Parasolid, IGES, ACIS, Rhino,
      FBX, or other plan-dependent formats and can pass models into Blender through the
      supported bridge.
    - >
      Preferences control navigation presets, rendering quality, language, appearance,
      backups, bridge-server settings, web publishing, SpaceMouse behavior, and session
      restoration.
