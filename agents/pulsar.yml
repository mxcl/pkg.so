id: cask:pulsar
display-name: Pulsar
repo: null
docs:
  - https://docs.pulsar-edit.dev/
config-file-location:
  unix:
    - ~/.pulsar/config.cson
  windows:
    - '%USERPROFILE%\.pulsar\config.cson'
credentials-file-location: null
history:
  adoption-history:
    - >
      Pulsar retained Atom's package-oriented customization model and built-in package
      manager, allowing Atom users and package authors to carry familiar workflows into
      a community-maintained successor. It is distributed for Linux, macOS, and Windows,
      including through the Homebrew pulsar cask.
  package-nerd-significance:
    - >
      Pulsar preserves the unusually hackable editor culture associated with Atom:
      behavior is assembled from packages, configuration is kept in approachable CSON
      files, and JavaScript and CSS can reshape the editor. Its stewardship also
      illustrates how a package ecosystem can survive the retirement of its original
      host project.
  project-history:
    - >
      Pulsar descends from GitHub's Atom editor, launched in 2014 and built on the
      framework that became Electron. After Atom entered maintenance decline and was
      scheduled for retirement, contributors associated with the atom-community
      organization organized a successor.
    - >
      Atom's official sunset at the end of 2022 coincided with Pulsar's first beta
      release. The project continued Atom's community-led, extensible-editor philosophy
      under new maintainership.
  related-projects:
    - Atom
    - Electron
    - atom-community
  sources:
    - >
      Official configuration documentation:
      https://docs.pulsar-edit.dev/customizing-pulsar/global-configuration-settings/
    - 'Official history: https://docs.pulsar-edit.dev/getting-started/what-is-pulsar/'
    - 'Official homepage: https://pulsar-edit.dev/'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Pulsar is a community-maintained, cross-platform text editor derived from Atom. It
      emphasizes deep customization, installable packages, web technologies, integrated
      Git tooling, and optional IDE features.
  timeline:
    - "2014: GitHub launched Atom, Pulsar's predecessor."
    - '2022: Atom reached its official sunset and Pulsar issued its first beta on the same day.'
  usage:
    - >
      Users employ Pulsar for general programming and text editing, then extend it
      through community packages, themes, keymaps, snippets, language support, and
      language-server integrations. Global settings are stored in config.cson inside the
      Pulsar home directory.
