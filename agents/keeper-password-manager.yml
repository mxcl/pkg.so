config-file-location:
  unix:
    - ~/.keeper/desktop.config.json
  windows:
    - '%USERPROFILE%\.keeper\desktop.config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Keeper says its security products are trusted by millions of individuals and
      thousands of organizations. The desktop application is offered for Windows, macOS,
      and Linux and complements Keeper's browser-based vault, mobile applications,
      browser extensions, and enterprise administration services.
  package-nerd-significance:
    - >
      Keeper represents the cloud-synchronized, cross-platform class of password
      managers in desktop package catalogs. Its packaging concerns include
      Electron-style desktop distribution, biometric integration, offline vault access,
      native-application autofill, managed JSON configuration, and frequent
      security-sensitive updates.
  project-history:
    - >
      Keeper Security was founded in 2011 by Darren Guccione and Craig Lurey. Keeper
      developed from a password and digital-vault product into a broader zero-knowledge
      security platform covering password management, secrets management, privileged
      access, secure remote access, and encrypted messaging.
  related-projects:
    - Keeper Web Vault provides browser-based access to the same vault ecosystem.
    - KeeperFill supplies browser and native-application autofill features.
    - Keeper Commander is Keeper's command-line and SDK-oriented administration tool.
    - >
      Keeper Secrets Manager and KeeperPAM address infrastructure secrets and privileged
      access.
  sources:
    - >
      https://docs.keeper.io/enterprise-guide/deploying-keeper-to-end-users/desktop-application
    - https://docs.keeper.io/user-guides/web-vault
    - https://www.keepersecurity.com/assets/pdf/en_GB/Keeper_Media_Snapshot.pdf
    - https://www.keepersecurity.com/company/about/
  summary:
    - >
      Keeper Password Manager is Keeper Security's native desktop vault for storing and
      using passwords and other sensitive records. It supports offline access, biometric
      login on compatible systems, imports, and native-application autofill through
      KeeperFill for Apps.
  timeline:
    - '2011: Keeper Security founded by Darren Guccione and Craig Lurey.'
    - '2018: Keeper expanded its product family with KeeperChat and BreachWatch.'
    - >
      2020s: The desktop vault was distributed across Windows, macOS, and Linux
      alongside Keeper's broader security platform.
  usage:
    - >
      Users sign in to an encrypted vault, organize credentials and sensitive records,
      generate and retrieve passwords, and autofill websites or native applications.
      Enterprise administrators can deploy the desktop app and control defaults through
      `desktop.config.json`.
