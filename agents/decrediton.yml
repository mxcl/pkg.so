history:
  adoption-history:
    - >
      The official repository supports Windows, Linux, and macOS and documents Homebrew
      installation on macOS. Decrediton became the approachable desktop front end for
      users who prefer not to operate Decred’s command-line wallet components directly.
  package-nerd-significance:
    - >
      Decrediton packages a cryptocurrency wallet, node integration, ticket workflows,
      and transaction history into an Electron desktop application. It is also an
      example of a GUI orchestrating separately developed blockchain daemons.
  project-history:
    - >
      Decrediton is the Decred project’s cross-platform Electron GUI. Its repository
      explains that release builds start the Decred node and wallet components while
      remaining separate from existing command-line wallet files.
  related-projects:
    - Decred, dcrd, dcrwallet, dcrlnd, and the Decred block explorer.
  sources:
    - https://docs.decred.org/wallets/decrediton/decrediton-troubleshooting/
    - https://docs.decred.org/wallets/decrediton/using-decrediton/
    - https://github.com/decred/decrediton
  summary:
    - >
      Decrediton is Decred’s cross-platform graphical wallet, combining wallet setup,
      balances, transactions, ticket activity, and related network functions in a
      desktop interface.
  timeline:
    - 'Early project: Created as a Node.js and Electron cross-platform GUI for Decred.'
    - >
      Ongoing adoption: Distributed for Windows, Linux, and macOS, including through
      Homebrew on macOS.
  usage:
    - >
      Users create or restore a wallet, receive and send DCR, inspect transaction and
      ticket activity, and export transaction history. The application automatically
      handles basic configuration that command-line Decred users would otherwise manage
      themselves.
