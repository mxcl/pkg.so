history:
  adoption-history:
    - >
      LaunchOS was created in response to the removal of the classic Launchpad
      experience in macOS 26. The developers report that user feedback shaped its
      hot-corner, gesture, keyboard, layout, and interaction refinements.
    - >
      After 26 public releases in its first months, the application was rebuilt for
      version 2.0 to improve launch speed, runtime efficiency, animation performance,
      drag-and-drop behavior, and support for high-refresh-rate displays.
  package-nerd-significance:
    - >
      LaunchOS is representative of the ecosystem of small native utilities that appears
      when macOS removes or substantially changes a familiar system feature. Its
      Homebrew cask offers a reproducible installation route for an otherwise directly
      distributed commercial Mac application.
  project-history:
    - >
      Remix Design Studio began building LaunchOS in 2025 as a native replacement for
      the classic macOS Launchpad. The first public beta appeared on September 30, 2025,
      followed by version 1.0 on October 31 after roughly six weeks of full-time
      development.
    - >
      Version 2.0, released on May 26, 2026, was rebuilt from the ground up. It retained
      the Launchpad-style grid and folders while improving performance and adding
      features such as Dock integration, larger configurable grids, custom application
      sources, and high-refresh-rate support.
  related-projects:
    - >
      LaunchOS is explicitly modeled on Apple's former Launchpad interface and exists
      alongside other third-party macOS Launchpad replacements.
  sources:
    - >
      https://launchosapp.com/blog/en/introducing-launchos/ — official origin and
      initial-release account
    - https://launchosapp.com/blog/en/launchos-v2-rebuild/ — official development history
    - https://launchosapp.com/features/ — official feature catalog
    - https://launchosapp.com/release.en — official dated release notes
  summary:
    - >
      LaunchOS is a native macOS application launcher designed to preserve and refine
      the full-screen grid, paging, folders, gestures, and visual organization
      associated with Apple's classic Launchpad.
  timeline:
    - '2025-09-30: First public beta released'
    - '2025-10-31: LaunchOS 1.0 released'
    - '2026-05-26: Rebuilt LaunchOS 2.0 released'
    - '2026-06-05: Version 2.1 added application uninstallation'
    - '2026-07-13: Version 2.2 added window mode'
  usage:
    - >
      Users invoke LaunchOS from the Dock, menu bar, a global shortcut, function key,
      trackpad gesture, or hot corner, then browse or search a configurable grid of
      installed applications.
    - >
      It can import a native Launchpad layout, organize applications into pages and
      folders, scan custom application directories, back up and restore layouts, place
      applications in the Dock, and uninstall applications. Some advanced functions
      require a Pro license.
