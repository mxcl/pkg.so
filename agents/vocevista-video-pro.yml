history:
  adoption-history:
    - >
      The Pro edition targets demanding measurement work in voice research, education,
      clinical or studio contexts, and workflows involving electroglottograph hardware.
      Sygyt explicitly offers multi-user licenses for educational institutions and
      academic departments.
  package-nerd-significance:
    - >
      VoceVista Video Pro is an unusually specialized Homebrew cask: it packages
      commercial, cross-platform scientific audio software rather than a typical
      consumer media player or editor. Its EGG, high-resolution spectrum, vibrato, LTAS,
      marker, and spreadsheet-export facilities distinguish it from general audio
      utilities.
  project-history:
    - >
      The modern Pro edition joins two earlier product traditions: Sygyt’s Overtone
      Analyzer, created by Bodo Maass and Wolfgang Saus, and the original VoceVista 3.3,
      created by Don Miller and Richard Horne. From version 5.0 onward, the editions
      used the same code and interface with different feature sets.
    - >
      The 5.0 generation added macOS support. Version 5.4 made vibrato analysis and EGG
      wavegrams major Pro features, and subsequent releases expanded its measurement,
      visualization, and export tools.
  related-projects:
    - >
      VoceVista Video is the mid-tier edition with comparison, frequency-filter,
      vowel-chart, and resonance tools.
    - Overtone Analyzer is the entry edition built from the same application family.
    - VoceVista LLC’s electroglottograph hardware complements the Pro edition’s EGG analysis.
  sources:
    - https://www.sygyt.com/en/order/
    - https://www.sygyt.com/en/products/
    - https://www.sygyt.com/en/releases/vocevista-video-5-0-2/
    - https://www.sygyt.com/en/releases/vocevista-video-5-4-0/
    - https://www.sygyt.com/en/support/frequently-asked-questions/
  summary:
    - >
      VoceVista Video Pro is the measurement-oriented edition of Sygyt Software’s voice
      and musical-acoustics analysis suite.
  timeline:
    - 'May 2017: The editions were renamed during the Overtone Analyzer and VoceVista merger.'
    - '2017: Version 5.0 extended the shared application family to macOS.'
    - >
      2020: Version 5.4 introduced Pro-focused vibrato analysis and formal EGG wavegram
      support.
    - '2025: Version 5.9 expanded analysis and sound-generation workflows.'
    - '2026: Version 5.11 refined spectrum, filter, marker, and EGG analysis.'
  usage:
    - >
      Users record or load sound, make high-resolution spectral measurements, analyze
      pitch and vibrato, examine EGG signals and wavegrams, calculate long-term average
      spectra, mark passages, compare recordings, and export measurements for
      spreadsheet analysis.
