history:
  adoption-history:
    - >
      5ire grew from an independently developed open-source application into a
      community-oriented project. Cross-platform release artifacts and integrations with
      numerous hosted and local model providers broadened its audience among desktop AI
      and MCP users.
  package-nerd-significance:
    - >
      5ire packages several fast-moving AI application patterns into one desktop client:
      multi-provider chat, local knowledge-base retrieval, prompt management, usage
      accounting, and Model Context Protocol tools. The Homebrew cask gives macOS users
      a package-manager installation path for this Electron application.
  project-history:
    - >
      5ire was created as an open-source, cross-platform desktop assistant for
      interacting with multiple large-language-model providers. It later emphasized
      Model Context Protocol support, including local and remote servers, alongside a
      local knowledge base and user-controlled data storage.
    - >
      Later development expanded MCP tool handling and added support for MCP resources
      and prompts while reworking the local data layer.
  related-projects:
    - MCPSvr is the MCP-server directory promoted by the project.
    - >
      The application connects to providers including OpenAI, Anthropic, Google,
      Mistral, DeepSeek, Ollama, Azure, and others.
  sources:
    - Input field source_facts.package-manager
    - https://5ire.app/
    - https://5ire.app/docs
    - https://5ire.app/privacy-policy
    - https://docs.5ire.app/dev/contribution-guide
    - https://github.com/nanbingxyz/5ire
    - https://github.com/nanbingxyz/5ire/releases
  summary:
    - >
      5ire is an open-source desktop AI assistant and Model Context Protocol client with
      multi-provider chat, tools, local knowledge bases, prompt management, bookmarks,
      search, and usage analytics.
  timeline:
    - The official sources reviewed do not state a reliable first-public-release date.
    - >
      2025: The project documented its transition toward community-driven open-source
      development.
    - >
      2026: Release notes documented a rewritten local data layer and broader MCP
      resource and prompt support.
  usage:
    - >
      Users configure one or more model providers, converse with their selected models,
      and optionally attach MCP servers that expose tools and contextual resources.
      Python, Node.js, and uv are needed for tool-server workflows but not for basic
      chat use.
    - >
      The local knowledge base can parse and vectorize common office-document, PDF,
      text, and CSV formats for retrieval-augmented conversations. The privacy policy
      says API keys, chat histories, prompts, bookmarks, knowledge bases, and usage
      statistics remain on the device, but it does not document their filesystem
      locations.
