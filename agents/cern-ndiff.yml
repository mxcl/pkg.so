config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Ndiff's primary adoption path is scientific regression testing around MAD-X and
      related accelerator-model workflows. The package facts show it also appears in
      general-purpose package managers including Homebrew, Debian, Ubuntu, MacPorts, and
      Arch/Pacman.
  package-nerd-significance:
    - >
      For scientific packaging, ndiff is the small sharp tool that keeps floating-point
      output tests portable across compilers and platforms. Its no-external-dependency C
      implementation also makes it easy to package beside simulation software.
  project-history:
    - >
      The CERN reference manual says ndiff was initially developed for the MAD-X test
      system and later extended for data validation. The August 2013 CERN note, revised
      in April 2014, is the canonical project reference.
  related-projects:
    - MAD-X is the accelerator-design application whose test system originally drove ndiff.
    - >
      numdiff and another ndiff are named in the CERN manual as related numeric
      comparison tools, but CERN's ndiff was designed for the flexibility required by
      MAD-X tests.
  sources:
    - https://api.github.com/repos/MethodicalAcceleratorDesign/MAD-X
    - https://github.com/MethodicalAcceleratorDesign/MAD-X
    - https://mad.web.cern.ch/mad/
    - >
      https://github.com/MethodicalAcceleratorDesign/MAD-X/blob/master/tools/numdiff/doc/CERN-ACC-NOTE-2013-0005.pdf
    - >
      https://github.com/MethodicalAcceleratorDesign/MAD-X/blob/master/tools/numdiff/doc/ndiff.tex
    - https://madx.web.cern.ch/madx
    - https://formulae.brew.sh/api/formula/cern-ndiff.json
  summary:
    - >
      Ndiff is CERN's numeric diff tool for comparing unformatted text files containing
      numerical output, especially regression-test output where ordinary diff is too
      strict.
  timeline:
    - '2013: CERN-ACC-NOTE-2013-0005 published as the Ndiff Reference Manual.'
    - '2014: CERN reference manual revision dated April 15, 2014.'
    - >
      2017: Public MAD-X GitHub repository created with ndiff documentation under
      tools/numdiff.
  usage:
    - >
      Users compare two text files with ndiff and can optionally add a configuration
      file defining row, column, and numeric tolerance rules. The tool accepts
      user-defined numerical differences and representation variations that ordinary
      Unix diff tools report as changes.
related-packages:
  - id: brew:numdiff
    reason: >
      GNU Numdiff is an alternative for general numeric-file comparisons with absolute
      and relative tolerances, while CERN Ndiff is especially tailored to flexible
      MAD-X-style regression and validation rules.
    rel: alternative
    sources:
      - >
        https://github.com/MethodicalAcceleratorDesign/MAD-X/blob/master/tools/numdiff/doc/CERN-ACC-NOTE-2013-0005.pdf
      - https://www.nongnu.org/numdiff/numdiff.html
