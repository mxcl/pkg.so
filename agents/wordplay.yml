history:
  package-nerd-significance:
    - >
      wordplay is package-manager archaeology: a compact 1990s command-line word tool
      that survived because it is simple, portable C and useful enough for word-game and
      text-play workflows.
  project-history:
    - >
      The author says the first version was written in FORTRAN for Microsoft FORTRAN 5.0
      on OS/2 and could only produce two-word anagrams with a brute-force approach. It
      was converted to C as version 4.00 on 1993-04-30, and version 5.00 introduced a
      recursive approach on 1993-11-08 that removed the fixed word-count limit.
  sources:
    - https://hsvmovies.com/static_subpages/personal_orig/wordplay/
    - https://packages.debian.org/sid/wordplay
  summary:
    - >
      wordplay is a small ANSI C anagram generator by Evans A. Criswell. Its own
      homepage records version 1.00 as created on 1991-03-29, version 7.22 as released
      on 1996-03-20, and describes Unix, DOS, and OS/2 distributions.
  timeline:
    - '1991-03-29: Version 1.00 is created.'
    - '1993-04-30: Version 4.00 converts the program from FORTRAN to C.'
    - '1993-11-08: Version 5.00 introduces recursive multi-word anagram generation.'
    - '1996-03-20: Version 7.22 is released for Unix.'
  usage:
    - >
      The program anagrams an input string using its bundled word file, while allowing a
      different dictionary file to be supplied. Debian's package description preserves
      the same niche: a command-line anagram generator that can use language wordlists.
