history:
  adoption-history:
    - >
      Buildin targets individual and team knowledge-work use cases and provides desktop,
      mobile, and browser-extension surfaces. Its official site also promotes migration
      from Notion and imports from CSV, HTML, and DOCX.
  package-nerd-significance:
    - >
      Buildin combines a packaged desktop knowledge workspace with a documented HTTP API
      and MCP-oriented integration surface. That combination is relevant to users who
      want both a graphical workspace and automatable access to structured content.
  project-history:
    - >
      Buildin developed into an AI-oriented collaborative workspace spanning documents,
      notes, wikis, projects, mind maps, databases, calendars, and paid content. Its V2
      developer API exposes pages, blocks, databases, mind maps, users, search,
      Markdown, and file-transfer workflows.
  related-projects:
    - >
      The official product material positions Buildin as an alternative or migration
      target for Notion-style workspaces.
    - Its developer surface includes an HTTP API and MCP-related integration features.
  sources:
    - https://buildin.ai/ — official product capabilities and supported client surfaces.
    - >
      https://buildin.ai/developer-api/v2/getting-started/overview — official API scope,
      authentication, and recommended integration workflow.
    - source_facts.package-manager — records Homebrew cask distribution.
  summary:
    - >
      Buildin is an AI-enabled collaborative workspace for notes, documents, wikis,
      projects, databases, mind maps, and content publishing.
  timeline:
    - >
      2026: Buildin's official V2 API documentation describes a unified integration
      surface under `/v2`.
  usage:
    - >
      Use the desktop or web application to create and organize workspace content,
      collaborate through comments and mentions, manage projects, and publish paid
      material. Developers can use bearer-token-authenticated V2 endpoints for content
      automation and integrations.
