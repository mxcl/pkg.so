id: brew:corkscrew
display-name: Corkscrew
repo: https://github.com/patpadgett/corkscrew
docs:
  - https://github.com/patpadgett/corkscrew#readme
config-file-location:
  unix:
    - ~/.ssh/config
credentials-file-location:
  unix:
    - ~/.ssh/myauth
history:
  adoption-history:
    - >
      Corkscrew spread through Unix package managers because it solved a narrow
      operational problem: connecting SSH through an HTTP proxy with minimal moving
      parts. Its presence in multiple package-manager ecosystems reflects the long tail
      of proxy-heavy corporate and campus networks.
  package-nerd-significance:
    - >
      Corkscrew is a package-manager survivor: tiny, stable, and useful when a network
      environment requires exactly its protocol trick. It matters less for feature churn
      than for preserving a known CLI building block.
  project-history:
    - >
      The public GitHub repository was created in 2009 and the upstream README
      identifies GitHub as the primary distribution site. The README also records older
      portability work by listing HPUX, Solaris, BSD systems, Linux, Cygwin/Win32, and
      macOS as compiled targets.
  related-projects:
    - >
      Related tools and features include OpenSSH ProxyCommand, netcat-style proxy
      helpers, HTTP CONNECT proxies, and SSH ProxyJump for other tunneling scenarios.
  sources:
    - https://github.com/patpadgett/corkscrew
    - https://raw.githubusercontent.com/patpadgett/corkscrew/master/README.md
    - https://api.github.com/repos/patpadgett/corkscrew
    - https://api.github.com/repos/patpadgett/corkscrew/tags
  summary:
    - >
      Corkscrew is a small networking utility for tunneling SSH through HTTP proxies.
      Its upstream README frames OpenSSH ProxyCommand usage as the normal path, making
      it a classic single-purpose helper for locked-down networks.
  timeline:
    - '2009: Public GitHub repository created.'
    - 'v2.0: Upstream repository exposes a v2.0 tag.'
    - >
      Present: README continues to document OpenSSH ProxyCommand integration and
      proxy-auth file usage.
  usage:
    - >
      Typical usage adds a ProxyCommand line to ~/.ssh/config. For proxies requiring
      authentication, the README documents a separate username:password file, commonly
      placed under ~/.ssh with restrictive permissions.
related-packages:
  - id: brew:openssh
    reason: >
      OpenSSH launches Corkscrew through its ProxyCommand directive, so it is the client
      that turns Corkscrew's HTTP relay into an SSH connection.
    rel: adjacent_workflow
    sources:
      - https://github.com/bryanpkc/corkscrew#readme
      - https://man.openbsd.org/ssh_config#ProxyCommand
  - id: brew:connect
    reason: >
      Choose connect when the SSH proxy helper must support SOCKS 4, 4a, or 5 in
      addition to HTTP CONNECT, or when interactive and askpass-based proxy
      authentication is preferable to Corkscrew's credential file.
    rel: alternative
    sources:
      - https://github.com/bryanpkc/corkscrew#readme
      - https://github.com/gotoh/ssh-connect#readme
  - id: brew:proxytunnel
    reason: >
      Choose proxytunnel when you need advanced HTTPS-proxy features such as TLS to the
      proxy, certificate validation controls, NTLM, chained proxies, or a wget-format
      password file.
    rel: alternative
    sources:
      - https://github.com/bryanpkc/corkscrew#readme
      - https://github.com/proxytunnel/proxytunnel/blob/master/docs/proxytunnel.1.adoc
