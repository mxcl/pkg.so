config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LWTOOLS adoption is concentrated in retrocomputing and 6809/6309 cross-development
      communities rather than broad mainstream package use. It is packaged by Homebrew
      and Fedora-family packaging, and the official homepage provides source releases,
      contributed binaries, and an active Mercurial repository.
    - >
      The upstream release list shows continued maintenance through LWTOOLS 4.24 in
      April 2025, while the Mercurial log showed new toolchain and GCC 6809-related
      commits in June 2026.
  package-nerd-significance:
    - >
      LWTOOLS is package-nerd significant as a maintained retro cross-toolchain with a
      narrow but serious audience. It packages old-CPU development knowledge into normal
      Unix build/install conventions, which is exactly the kind of niche tool that
      package managers keep discoverable.
  project-history:
    - >
      The official homepage says LWTOOLS began in 2006 when William Astle wanted an
      assembler with features missing from the alternatives available for his Color
      Computer 3 operating-system work. The manual history says LWASM grew out of that
      need for macros and correct forward-reference handling, with LWASM 1.0 released in
      October 2008.
    - >
      As the operating-system project grew, assembling everything through a single
      source file became impractical. That led to object-file support in LWASM and the
      LWLINK project. The homepage records the first combined LWTOOLS release on January
      29, 2009 after separate LWASM and LWLINK releases.
  related-projects:
    - LWASM is the assembler component.
    - LWLINK is the linker component.
    - LWAR is the archiver component.
    - gcc6809-related patches and scripts appear in the upstream Mercurial history.
  sources:
    - http://lwtools.projects.l-w.ca/hg
    - https://www.lwtools.ca/
    - https://www.lwtools.ca/manual/manual.html
  summary:
    - >
      LWTOOLS is a cross-development toolchain for Motorola 6809 and Hitachi 6309
      systems. It includes the LWASM assembler, LWLINK linker, LWAR archiver,
      object-dump tooling, and related support for raw binaries, CoCo LOADM/DECB
      formats, object files, and later linking.
  timeline:
    - '2006: LWASM work begins for Color Computer 3 operating-system development.'
    - '2008: LWASM 1.0 released.'
    - '2009: Initial combined LWTOOLS release published.'
    - '2025: LWTOOLS 4.24 release published.'
    - '2026: Official Mercurial repository shows active commits.'
  usage:
    - >
      The usual source build is simply `make` at the top of the source tree, with
      binaries produced in the lwasm, lwlink, and lwar directories and installed with
      `make install`. The manual documents output formats including raw binaries, DECB
      binaries, ASCII hex, Motorola S-record, Intel Hex, OS-9 modules, and object files.
    - >
      Typical package-manager users install it to obtain `lwasm`, `lwlink`, `lwar`, and
      related inspection tools for assembling and linking 6809/6309 programs on a modern
      host.
related-packages:
  - id: brew:asm6809
    reason: >
      Choose asm6809 for a focused 6809/6309 cross-assembler with its own dialect and
      outputs; choose LWTOOLS when you also need a linker, object libraries, and a
      multi-program toolchain.
    rel: alternative
    sources:
      - https://www.lwtools.ca/manual/manual.html
      - https://www.6809.org.uk/asm6809/doc/asm6809.shtml
  - id: brew:xroar
    reason: >
      XRoar provides a Dragon and Tandy Color Computer emulator in which CoCo-targeted
      binaries produced by LWTOOLS can be run and tested.
    rel: adjacent_workflow
    sources:
      - https://www.lwtools.ca/
      - https://www.6809.org.uk/xroar/doc/xroar.shtml
