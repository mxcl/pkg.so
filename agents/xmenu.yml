    - source_facts.package-manager
  summary:
    - >
      XMenu is a free macOS menu-bar launcher from DEVONtechnologies. It exposes
      applications, folders, documents, arbitrary user-defined items, and reusable text
      snippets through configurable hierarchical menus.
  timeline:
    - >
      2007: DEVONtechnologies highlighted XMenu as an alternative after Leopard replaced
      Dock folder menus with stacks.
    - '2011: XMenu continued to receive feature and bug-fix updates.'
    - '2021: XMenu was updated with native optimization for Apple Silicon.'
    - >
      2024: DEVONtechnologies published a modern overview of its launcher, custom-menu,
      and snippet workflows.
    - '2025: The company documented additional keyboard and modifier-click interactions.'
  usage:
    - >
      Users enable one or more menu-bar menus for applications, developer tools, their
      home folder, Documents, custom items, or snippets. Items can be opened with
      keyboard navigation and type-ahead search.
    - >
      The User-Defined menu can hold aliases, bookmarks, templates, and other files
      under ~/Library/Application Support/XMenu/Custom. Choosing a Snippets item inserts
      its text into the active document.
