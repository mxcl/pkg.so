history:
  adoption-history:
    - >
      DEVONtechnologies describes XMenu as a must-have utility for many of its users.
      The application has remained part of the company's freeware collection across
      major macOS transitions, including the move from classic Dock folder menus to
      stacks and later the Apple Silicon transition.
  package-nerd-significance:
    - >
      XMenu appeals to Mac utility enthusiasts because it restores dense, hierarchical
      folder and application menus in the menu bar with very little ceremony. Its
      filesystem-backed Custom and Snippets folders also make user-defined menus easy to
      populate with ordinary files, aliases, and text documents.
  project-history:
    - >
      XMenu was already an established DEVONtechnologies utility by 2007, when the
      company highlighted its usefulness after Leopard changed Dock folders into stacks.
      Official update posts show continued maintenance in 2011 and an Apple
      Silicon-optimized release in 2021.
    - >
      Later official articles documented XMenu as both a launcher and a lightweight
      workflow tool, with menus for applications, the home and Documents folders,
      developer tools, arbitrary user-defined content, and reusable text snippets.
  related-projects:
    - >
      DEVONtechnologies' other freeware utilities, including EasyFind, PhotoStickies,
      ThumbsUp, CalcService, and WordService
    - macOS Finder, Dock, and menu bar
  sources:
