history:
  adoption-history:
    - >
      Tyme's official site reports more than 50,000 users across fields including
      design, architecture, IT, marketing, and legal services. It expanded from an
      individual freelancer's timer into workflows for freelancers, employees, agencies,
      and teams.
  package-nerd-significance:
    - >
      Tyme is a long-running native Apple-platform application with migration support
      for earlier major releases, local data storage, optional iCloud synchronization,
      automatic backups, and multiple export formats. Package users should distinguish
      the application bundle from its sandboxed time database and cloud state when
      reinstalling or migrating.
  project-history:
    - >
      Founder Lars Gerckens created a small personal time-tracking prototype called
      Simple Timer in 2008 for his freelance software work. When a macOS update made
      discontinuation likely, he and UI/UX designer Margit rebuilt it as Tyme; the first
      version was released in September 2013.
    - >
      The application grew from timer and statistics features into project budgets,
      planning, reports, calendar integration, expenses, shortcuts, team
      synchronization, and clients for Mac, iPhone, iPad, and Apple Watch. In 2023 Lars
      Gerckens and Margit founded Unit Numberfive oHG, which took over distribution.
  related-projects:
    - >
      Tyme provides importers for other time-tracking systems and integrations or
      exporters for invoicing products.
    - Unit Numberfive also develops Shortery and Soonie.
  sources:
    - https://www.tyme-app.com/en/
    - https://www.tyme-app.com/en/all-features/
    - https://www.tyme-app.com/en/faq/
    - https://www.tyme-app.com/en/who-we-are/
  summary:
    - >
      Tyme is a time-tracking and project-planning application developed by Unit
      Numberfive for individuals and teams, with native clients across Apple's
      platforms.
  timeline:
    - '2008: Lars Gerckens creates the Simple Timer prototype for his freelance work.'
    - 'September 2013: Lars Gerckens and Margit release the first version of Tyme.'
    - >
      2023: The founders establish Unit Numberfive oHG to distribute and continue
      developing Tyme.
  usage:
    - >
      Users organize work into categories, projects, tasks, and subtasks; record time
      with timers or manual entries; monitor budgets and deadlines; and export reports
      in formats such as PDF, CSV, and JSON. Optional iCloud synchronization shares
      individual data across devices, while team data uses Tyme's team service.
    - >
      The current Mac application stores its working database under
      `~/Library/Containers/com.tyme-app.Tyme3-macOS/Data/Library/Application Support/`,
      but official documentation identifies this as application data rather than a
      configuration-file location. Licensing is managed through the App Store, the
      application, or an emailed purchase license; no current reusable credentials-file
      path is documented.
