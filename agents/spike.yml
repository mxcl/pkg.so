history:
  adoption-history:
    - >
      SPIKE Prime was introduced for middle-school classrooms and was also approved for
      use in FIRST LEGO League alongside MINDSTORMS Education EV3, placing its app in
      both curriculum and robotics-competition workflows.
    - >
      LEGO Education later extended the app's coding progression from Scratch-derived
      icon and word blocks to text-based Python. The SPIKE hardware portfolio retired in
      2026, but LEGO says the app and related teaching resources will remain supported
      through June 30, 2031.
  package-nerd-significance:
    - >
      The SPIKE cask packages a vendor-maintained educational programming environment
      whose useful target is physical LEGO hardware. It is notable to package users
      because installation and classroom deployment can be managed like other desktop
      software even though lessons, firmware, motors, sensors, and hubs form the larger
      product.
    - >
      Its progression from Scratch-style blocks to Python makes it a bridge between
      visual educational programming and conventional text-based coding.
  project-history:
    - >
      LEGO Education announced SPIKE Prime in April 2019 as a new hands-on STEAM system
      combining LEGO elements, a programmable multi-port hub, sensors, motors,
      standards-aligned lessons, and a Scratch-based application.
    - >
      The worldwide launch followed in January 2020. The application evolved into a
      shared environment for SPIKE Prime and SPIKE Essential, combining lessons,
      building instructions, tutorials, block coding, and Python.
    - >
      LEGO Education retired the SPIKE product portfolio in 2026 while committing to
      continued application support through June 2031.
  related-projects:
    - >
      SPIKE Prime and SPIKE Essential are the hardware-and-curriculum families
      programmed by the app.
    - >
      LEGO MINDSTORMS Education EV3 preceded SPIKE Prime in many classroom and FIRST
      LEGO League robotics workflows.
    - >
      The SPIKE web application is the browser-based sibling of the packaged desktop
      application.
  sources:
    - https://education.lego.com/en-au/downloads/spike-app/software/
    - https://education.lego.com/en-us/spike-update-2026/
    - >
      https://www.lego.com/en-us/aboutus/news/2019/august/lego-education-spike-prime-a-new-hands-on-learning-approach-for-classrooms-announced-today
    - https://www.lego.com/en-us/aboutus/news/2020/january/spikeprimeavailable
    - source_facts.package-manager
  summary:
    - >
      The LEGO Education SPIKE App is the programming, lesson, and building-instruction
      environment for the SPIKE Prime and SPIKE Essential educational robotics systems.
  timeline:
    - '2019-04-02: LEGO Education announces SPIKE Prime and its Scratch-based app.'
    - '2020-01-14: SPIKE Prime launches worldwide.'
    - '2026-06-30: The SPIKE hardware portfolio retires.'
    - "2031-06-30: LEGO Education's announced support period for the SPIKE App ends."
  usage:
    - >
      Students connect to a SPIKE hub and program motors and sensors through
      Scratch-derived blocks or Python. The app also supplies tutorials, building
      instructions, lessons, and troubleshooting help.
    - >
      The app supports guided classroom work as well as open-ended robotics and
      competition projects. Official sources reviewed do not document stable filesystem
      paths for configuration or credentials.
