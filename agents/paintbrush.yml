history:
  adoption-history:
    - >
      Paintbrush occupied the lightweight end of the macOS graphics ecosystem: a native,
      approachable alternative for users who wanted the immediacy of MacPaint or
      Microsoft Paint rather than a full professional editor.
    - >
      The project remained available through multiple macOS transitions, including
      64-bit support, newer SDKs, Mojave compatibility, and Dark Mode work. Its
      continued SourceForge distribution also kept both binaries and source accessible.
  package-nerd-significance:
    - >
      Paintbrush is a compact example of a long-lived Cocoa desktop application
      distributed as open source. It is useful when a package user wants a fast raster
      editor without installing a much larger creative suite.
    - >
      Its deliberate restraint is the point: basic drawing, cropping, text,
      transparency, and common image formats cover quick edits and doodling while
      preserving a distinctly Mac-native workflow.
  project-history:
    - >
      Paintbrush was registered as a SourceForge project in 2007 and positioned itself
      as the missing simple paint program for macOS, drawing explicit inspiration from
      Apple's MacPaint and Microsoft's Paint.
    - >
      The 2.x line began in 2009. Later updates added improved color accuracy, 64-bit
      operation, better transparency, performance work, modern scrolling behavior,
      Mojave compatibility, and Dark Mode support. The official download archive records
      the 2.6 release in 2021.
  related-projects:
    - MacPaint is the historical Macintosh application that inspired Paintbrush's role.
    - Microsoft Paint is the project's stated point of comparison for a simple raster editor.
    - >
      Adobe Photoshop is explicitly outside Paintbrush's intended scope; the project
      emphasizes a streamlined alternative.
  sources:
    - https://paintbrush.sourceforge.io/
    - https://paintbrush.sourceforge.io/changelog/
    - https://paintbrush.sourceforge.io/contribute/
    - https://paintbrush.sourceforge.io/downloads/
    - https://sourceforge.net/projects/paintbrush/
  summary:
    - >
      Paintbrush is an open-source, Cocoa-based raster image editor for macOS. It
      focuses on quick, uncomplicated drawing and image edits and supports common
      formats including BMP, PNG, JPEG, TIFF, and GIF.
  timeline:
    - '2007: The Paintbrush project was registered on SourceForge.'
    - '2009: The Paintbrush 2.x release line began.'
    - '2015: Paintbrush 2.1.2 delivered stability and crash fixes after a long interval.'
    - '2019: Paintbrush 2.3 improved Mojave compatibility and Dark Mode support.'
    - '2021: The official archive published Paintbrush 2.6.'
  usage:
    - >
      Paintbrush is suited to quick crops, annotations, text additions, simple drawings,
      and casual doodling. Users choose a tool and color, edit a raster canvas, and save
      to a common image format.
    - >
      The project explicitly does not aim to replace high-end editors. Its value is a
      small, native application for jobs where layers and advanced photographic
      workflows are unnecessary.
