history:
  adoption-history:
    - >
      The game grew from its mobile origins to wider desktop distribution with its March
      2022 Steam release. GOG and itch.io releases followed in April 2023, alongside
      continued GitHub distribution.
  package-nerd-significance:
    - >
      Shattered Pixel Dungeon illustrates how an open-source game fork can develop an
      independent identity while retaining public source and multiple distribution
      channels. Its GPL-3.0 codebase supports desktop and mobile builds; the supplied
      record also documents Homebrew Cask packaging.
  project-history:
    - >
      Evan Debenham began Shattered Pixel Dungeon in 2014 as a rebalancing project based
      on Watabou's Pixel Dungeon. It gradually developed into a distinct game with
      expanded mechanics and content.
  related-projects:
    - >
      Pixel Dungeon by Watabou is the upstream game from which Shattered Pixel Dungeon
      originated.
  sources:
    - https://github.com/00-Evan/shattered-pixel-dungeon#readme
