    - https://shatteredpixel.com/shatteredpd/
    - source_facts.package-manager
  summary:
    - >
      Shattered Pixel Dungeon is an open-source roguelike descended from Pixel Dungeon,
      with randomized dungeon runs and character progression.
  timeline:
    - '2014: Development began as a Pixel Dungeon rebalancing project.'
    - '2022: Steam release broadened desktop distribution.'
    - '2023: GOG and itch.io releases added desktop distribution channels.'
  usage:
    - >
      Choose a hero, explore procedurally generated floors, manage equipment and
      consumables, and learn enemy and item interactions across repeated runs. Desktop
      interfaces support mouse, keyboard, and controller input.
