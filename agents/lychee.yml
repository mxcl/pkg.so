history:
  adoption-history:
    - >
      Upstream documents many install paths: Arch, openSUSE, Ubuntu snap, Alpine,
      Homebrew, MacPorts, Docker, Nix, FreeBSD, Termux, Conda, Scoop, WinGet,
      Chocolatey, prebuilt binaries, cargo-binstall, Cargo, and GitHub Actions. The
      README also lists notable users including OpenSearch, papers-we-love, PingCAP
      docs, Microsoft WhatTheHack, HashiCorp Consul, Fastify, Nuxt, containerd, Gradle,
      and tldr-pages.
  package-nerd-significance:
    - >
      lychee is a package-nerd favorite because it is the modern static Rust binary
      version of a classic maintenance chore: keep every link in your docs alive. Its
      broad install matrix, GitHub Action, Docker image, library crate, config file, and
      stable CI exit codes make it easy for distributions and automation platforms to
      carry.
  project-history:
    - >
      The official README says the first prototype was built in episode 10 of Hello
      Rust. The public Git history for the standalone repository begins in August 2020,
      and early tags followed in December 2020. Since then the project has developed
      into a lycheeverse-maintained CLI plus `lychee-lib` library.
    - >
      The project emphasizes Rust async execution, stream-oriented checking, static
      binaries, and CI-oriented output formats. Its feature table compares it with other
      link checkers such as awesome_bot, muffet, broken-link-checker, linkinator,
      linkchecker, markdown-link-check, and fink, positioning lychee in the
      cross-language ecosystem of documentation-quality tooling.
  related-projects:
    - lychee-action provides the GitHub Actions integration.
    - lychee-lib exposes the Rust library used by the CLI.
    - >
      The README compares lychee with awesome_bot, muffet, broken-link-checker,
      linkinator, linkchecker, markdown-link-check, and fink.
  sources:
    - https://github.com/lycheeverse/lychee
    - https://lychee.cli.rs/
    - https://lychee.cli.rs/guides/cli/
    - https://lychee.cli.rs/guides/config/
    - https://raw.githubusercontent.com/lycheeverse/lychee/master/README.md
    - source_facts.package-manager
  summary:
    - >
      lychee is a fast, asynchronous Rust link checker for websites, Markdown, HTML, and
      other text-like files. It is distributed as a CLI, a Rust library, Docker image,
      prebuilt binaries, and a GitHub Action.
  timeline:
    - >
      2020: Standalone repository history begins after extraction from the Hello Rust
      show repository.
    - '2020: v0.2.0, v0.3.0, and v0.4.0 are tagged.'
    - '2021: v0.5 and v0.6 alpha releases follow.'
    - '2026: v0.24.x releases are tagged, with docs noting lychee-v0.24.2.'
  usage:
    - >
      Common usage is `lychee [OPTIONS] [inputs]...`, either locally over documentation
      files and websites or in CI through the GitHub Action. The official config guide
      says `lychee.toml` is used by default when present in the current working
      directory, and `--config <PATH>` can point at another TOML config.
    - >
      For GitHub-heavy link sets, lychee can use a GitHub token through `GITHUB_TOKEN`,
      `--github-token`, or the config file. The docs frame this as a way to avoid GitHub
      API rate limiting when checking public repository links.
related-packages:
  - id: brew:muffet
    reason: >
      Choose Muffet for a compact Go crawler focused on recursively checking a published
      website; choose lychee when repository files, multiple markup formats,
      configuration, and first-party GitHub Actions integration matter.
    rel: alternative
    sources:
      - https://github.com/lycheeverse/lychee#features
      - https://github.com/raviqqe/muffet#readme
