credentials-file-location: null
history:
  adoption-history:
    - >
      Rambox developed through frequent Electron-based Community Edition releases
      spanning Windows, macOS, and Linux. Its account synchronization, custom-service
      support, unread counters, notifications, and broad catalog made it useful to
      people managing many web communication tools.
    - >
      The Community Edition reached end of life in 2022. Its final release directed
      users to migrate to the newer Rambox application, which retained a free plan and
      expanded the workspace model.
  package-nerd-significance:
    - >
      Rambox is part of the Electron-era tradition of wrapping many web applications in
      one desktop shell. Package users care about it as a single install that can
      replace numerous separate chat and email clients, while its Community Edition
      history illustrates the transition from an open-source desktop aggregator to a
      centrally synchronized commercial product with a free tier.
  project-history:
    - >
      Rambox began as an Electron desktop application for aggregating messaging and
      email services. Early releases added custom services, synchronization,
      do-not-disturb and lock modes, notification counters, proxies, and an expanding
      catalog of web applications.
    - >
      The original Community Edition was archived in April 2022 after its final 0.8.0
      release. The maintainers recommended migration to the redesigned current Rambox
      application, which organizes web apps into workspaces and profiles.
  related-projects:
    - The archived Rambox Community Edition is the predecessor to the current application.
    - >
      Electron supplies the desktop web-runtime model used by the historical Community
      Edition.
  sources:
    - https://github.com/ramboxapp/community-edition/releases
    - https://github.com/ramboxapp/community-edition/wiki/CHANGELOG
    - https://support.rambox.app/support/solutions
  summary:
    - >
      Rambox is a cross-platform workspace application that consolidates messaging,
      email, collaboration, and other web applications into one desktop interface.
  timeline:
    - '2016: Rambox 0.1.0 was released as the first Community Edition release.'
    - >
      2022: Community Edition 0.8.0 marked that edition's end of life and provided
      migration to the new Rambox.
    - >
      2022 onward: The current Rambox line expanded the workspace, profile, extension,
      and synchronized-account model.
  usage:
    - >
      Users add supported or custom web applications to workspaces, sign into services
      within embedded sessions, and use profiles to share or isolate sessions. Rambox
      supports notifications, unread counters, per-app settings, custom CSS or
      JavaScript, proxies, hibernation, and cross-device workspace synchronization.
