history:
  adoption-history:
    - >
      Monal is published for both iOS and macOS, with stable releases available through
      Apple's App Stores and the macOS build also packaged as a Homebrew cask. The
      project additionally operates beta, TestFlight, and alpha distribution channels.
    - >
      Its adoption niche is the Apple-platform XMPP community: users can select any
      compatible XMPP provider rather than joining a proprietary messaging network.
  package-nerd-significance:
    - >
      Monal is a long-lived native client for a federated protocol, making it relevant
      to users interested in open messaging standards and alternatives to centralized
      chat platforms.
    - >
      For package-manager users, the maintained Homebrew stable and beta casks provide a
      command-line installation route for an otherwise App-Store-oriented Apple
      application.
  project-history:
    - >
      Monal originated in 2002 as a fork of SworIM and was developed by Anu Pokharel
      until 2019. Thilo Molitor then took over development and was joined by Friedrich
      Altheide in 2020; the maintainers substantially rewrote the backend around a
      modern XMPP engine.
    - >
      The current project is volunteer-developed and open source. It targets iOS and
      macOS and implements modern XMPP capabilities including federated messaging,
      OMEMO-encrypted chats, message archives, media sharing, and audio/video calls.
  related-projects:
    - SworIM was the project from which Monal originated.
    - >
      Monal participates in the wider XMPP ecosystem and documents its supported XMPP
      Extension Protocols.
    - The Monal organization also maintains fpush, a scalable push server for XMPP.
  sources:
    - 'Official history: https://monal-im.org/about/'
    - 'Official installation and feature documentation: https://monal-im.org/install/'
    - 'Official repository: https://github.com/monal-im/Monal'
  summary:
    - >
      Monal is a native, open-source XMPP client for iOS and macOS with federated
      messaging, group chat, OMEMO encryption, file sharing, and calling support.
  timeline:
    - '2002: Monal originated as a fork of SworIM.'
    - '2019: Thilo Molitor took over development from Anu Pokharel.'
    - '2020: Friedrich Altheide joined the development effort.'
  usage:
    - >
      Users add an account from an XMPP provider, then use Monal for private or group
      conversations across the federated XMPP network.
    - >
      Stable macOS users may install Monal from the Mac App Store or with `brew install
      --cask monal`; official beta and alpha channels are also documented.
