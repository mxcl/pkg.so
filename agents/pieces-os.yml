credentials-file-location: null
history:
  adoption-history:
    - >
      PiecesOS became the common local dependency for the Pieces Desktop App and its
      editor, browser, CLI, and MCP integrations. It installs automatically with the
      Desktop App and can also be installed independently for integrations that do not
      require the desktop interface.
    - >
      The official 2022 year-end review reported tens of thousands of installations
      across the Pieces suite and beta Linux compatibility for PiecesOS and the Desktop
      App. Its role later grew from snippet storage and enrichment to coordinating
      long-term memory, AI models, and MCP access.
  package-nerd-significance:
    - >
      Despite its name, PiecesOS is not a general-purpose operating system. It is a
      separately packaged background service, local datastore, API layer, and
      machine-learning runtime on which multiple Pieces clients depend.
    - >
      Package users care about its service lifecycle, storage footprint, client
      compatibility, and local database because updating or removing this shared
      dependency affects every Pieces integration on the machine.
  project-history:
    - >
      PiecesOS was created by Mesh Intelligent Technologies as the local foundation for
      the Pieces product suite. Early versions supported storage, metadata enrichment,
      and APIs used by the desktop and editor clients.
    - >
      As Pieces moved into contextual AI, PiecesOS acquired responsibility for on-device
      capture, indexing, long-term-memory storage, AI model coordination, and MCP
      hosting. The service retains captured data locally by default while sending only
      scoped request context when a cloud model is selected.
  related-projects:
    - Pieces Desktop
    - Pieces MCP
    - Pieces CLI
    - PiecesOS client SDKs
  sources:
    - https://docs.pieces.app/products/core-dependencies/on-device-storage
    - https://docs.pieces.app/products/core-dependencies/pieces-os
    - https://docs.pieces.app/products/core-dependencies/pieces-os/manual-installation
    - https://pieces.app/changelog/pieces-for-developers-22-biggest-achievements-of-2022
    - https://pieces.app/updates
  summary:
    - >
      PiecesOS is the background service and local runtime that powers capture, storage,
      AI processing, long-term memory, and MCP integrations throughout the Pieces
      ecosystem.
  timeline:
    - >
      2022: PiecesOS powered the growing Pieces desktop and extension suite, with Linux
      support entering beta.
    - '2023: Its role expanded with live workflow context and on-device generative features.'
    - >
      2025: PiecesOS powered LTM-2 and connections between workflow memory and external
      AI tools.
    - >
      2026: The runtime added further long-term-memory, audio-capture, summary, and
      local-model capabilities.
  usage:
    - >
      PiecesOS normally runs in the background and is controlled through the Pieces
      Desktop App or its menu-bar or system-tray interface. Clients call the service to
      capture, enrich, store, search, and retrieve workflow context.
    - >
      It installs automatically with Pieces Desktop, but users can install it
      independently for MCP and other integrations. Its `com.pieces.os` directory
      contains settings, the production database, long-term-memory context, and
      diagnostic logs.
