credentials-file-location: null
history:
  adoption-history:
    - >
      An official Intuit retrospective states that customers quickly made QuickBooks the
      best-selling small-business accounting software. The product subsequently
      developed into a family of desktop, online, payroll, payments, and enterprise
      offerings.
    - >
      The Mac edition retained a local company-file workflow and gained backup,
      multiuser, migration, and connected-account features. Intuit's current desktop
      positioning emphasizes QuickBooks Desktop Enterprise while its support library
      continues to document QuickBooks Desktop for Mac.
  package-nerd-significance:
    - >
      QuickBooks is a canonical proprietary desktop package whose locally stored,
      versioned company files and long upgrade history create practical compatibility
      and migration concerns. The Mac cask preserves access to a product line rooted in
      pre-cloud small-business software.
    - >
      Its combination of application preferences, registration state, company data,
      attachments, backups, and Keychain-held passwords illustrates why backing up a
      business application involves more than copying an app bundle.
  project-history:
    - >
      Intuit introduced QuickBooks in April 1992 to give small-business users
      bookkeeping capabilities without requiring familiarity with traditional
      double-entry accounting terminology. It borrowed the approachable design
      philosophy that had helped establish Quicken.
    - >
      QuickBooks expanded into a broad accounting platform covering invoicing, expenses,
      inventory, payroll, reporting, and multiuser workflows. Desktop editions coexist
      with QuickBooks Online and Intuit's newer business-platform products.
  related-projects:
    - >
      QuickBooks Online is Intuit's cloud-based accounting service and provides
      migration paths from supported Desktop company files.
    - >
      QuickBooks Desktop Enterprise is the currently promoted desktop product for
      businesses with more complex inventory and multiuser requirements.
    - >
      Quicken preceded QuickBooks and influenced its approachable financial-software
      design, but is now owned by a separate company.
  sources:
    - >
      https://investors.intuit.com/sec-filings/all-sec-filings/content/0000891618-96-002383/0000891618-96-002383.pdf
    - >
      https://investors.intuit.com/sec-filings/all-sec-filings/content/9999999997-03-037480/9999999997-03-037480.pdf
    - https://quickbooks.intuit.com/desktop/
    - >
      https://quickbooks.intuit.com/learn-support/en-us/help-article/banking/file-types-extensions-used-quickbooks-desktop/L3vuO2X4c_US_en_US
  summary:
    - >
      QuickBooks Desktop for Mac is Intuit's proprietary small-business accounting
      application for maintaining company books, transactions, customers, vendors,
      reports, and related business records in local company files.
  timeline:
    - '1992-04: Intuit introduces QuickBooks for small-business accounting.'
    - '1998-06: Intuit launches QuickBooks and QuickBooks Pro 6.0.'
    - '2023: The packaged Homebrew cask application is QuickBooks 2023 for Mac.'
    - >
      2024: The Mac product adopts enhanced AES-256 company-data encryption, according
      to Intuit support.
  usage:
    - >
      Users create or open a versioned company file, record income and expenses, invoice
      customers, manage bills and accounts, reconcile transactions, and produce
      financial reports. Backup folders and filenames are configurable from the
      application's Backup settings.
    - >
      Preferences are managed in the application. Intuit documents property-list files
      named like com.intuit.QuickBooks20XX under the user's Library/Preferences
      directory. Company-file passwords may be stored as a “QuickBooks User Password”
      item in macOS Keychain, so there is no documented standalone credentials file.
