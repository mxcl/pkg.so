id: brew:b4n
display-name: b4n
repo: null
docs:
  - https://github.com/fioletoven/b4n#readme
config-file-location:
  unix:
    - ~/.b4n/config.yaml
    - ~/.b4n/history.yaml
    - ~/.b4n/plugins/*.yaml
    - ~/.b4n/themes/*.yaml
credentials-file-location:
  unix:
    - ~/.kube/config
  windows:
    - '%USERPROFILE%\.kube\config'
history:
  adoption-history:
    - >
      The official repository presents b4n as a relatively young learning-oriented
      project rather than an established Kubernetes standard. Its Homebrew formula gives
      macOS and Linux users a conventional package-manager installation path.
  package-nerd-significance:
    - >
      b4n is notable to package enthusiasts as a Rust and Ratatui interpretation of the
      keyboard-driven Kubernetes TUI pattern popularized by k9s.
  project-history:
    - >
      b4n was created mainly as a vehicle for learning Rust. Its official README
      explicitly credits k9s as a major influence and identifies kube-rs and Ratatui as
      its core implementation foundations.
  related-projects:
    - The official README identifies k9s, kube-rs, and Ratatui as closely related projects.
  sources:
    - https://github.com/fioletoven/b4n#readme
    - source_facts.description
    - source_facts.package-manager
  summary:
    - b4n is a Rust terminal interface for inspecting and operating Kubernetes resources.
  timeline:
    - >
      2025: Public project documentation described b4n as a Rust learning project
      inspired by k9s.
    - '2026: Distributed through Homebrew as the `b4n` formula.'
  usage:
    - >
      Users navigate Kubernetes resources from a terminal, view and edit YAML, inspect
      events and logs, enter containers, forward ports, transfer files, and invoke
      YAML-defined plugins. It uses the active Kubernetes context, while application
      preferences and history live under `$HOME/.b4n`.
related-packages:
  - id: brew:k9s
    reason: >
      Choose K9s when you want the established Kubernetes TUI that directly inspired
      b4n, with its own mature documentation and cluster-navigation workflow.
    rel: alternative
    sources:
      - https://github.com/fioletoven/b4n#readme
      - https://k9scli.io/
  - id: brew:kubernetes-cli
    reason: >
      Use kubectl alongside b4n for scriptable and automation-friendly Kubernetes
      operations while b4n provides the interactive resource browser over the same
      kubeconfig contexts.
    rel: adjacent_workflow
    sources:
      - https://github.com/fioletoven/b4n#readme
      - https://kubernetes.io/docs/reference/kubectl/
      - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
tags:
  - cli
  - cluster-management
  - devops
  - kubernetes
  - rust
  - terminal
  - tui
provenance:
  category-sources:
    - The official README describes b4n as a terminal UI for the Kubernetes API.
  display-name-sources:
    - 'Official repository README heading: b4n.'
  docs-sources:
    - The official repository README is the project's primary documentation surface.
  history-sources:
    - https://github.com/fioletoven/b4n#readme
    - source_facts.description
    - source_facts.package-manager
  repo-sources:
    - source_facts.repo already contains a value; per task rules the returned repo is null.
  tags-sources:
    - Official README description, features, implementation notes, and repository topics.
category-confidence: high
category-path:
  - cloud-infrastructure
  - kubernetes-tools
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: high
tags-confidence: high
