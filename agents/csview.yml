history:
  adoption-history:
    - >
      The official README documents installation through Homebrew, Arch AUR, NetBSD
      pkgsrc, Scoop, prebuilt GitHub releases, and cargo. That spread is meaningful for
      a small terminal viewer because users often install it as a standalone binary on
      machines where Python-heavy CSV tools are too slow or too large.
  package-nerd-significance:
    - >
      For package nerds, csview is a compact example of the Rust single-binary CLI
      pattern: published to crates.io, distributed through system package managers, and
      aimed at replacing heavier table viewers in shell pipelines.
  project-history:
    - >
      The README positions csview as a formatter and viewer rather than an analysis
      tool, explicitly distinguishing it from xsv. The changelog shows a 1.0.0 release
      in February 2022 after the 0.3 series, followed by packaging and usability work
      such as Homebrew documentation, line numbers, alignment options, pager support,
      and additional Apple Silicon release targets.
  related-projects:
    - >
      csview is compared upstream with xsv, util-linux column, and csvkit csvlook; it
      complements CSV transformation tools by focusing on display.
  sources:
    - https://github.com/wfxr/csview#readme
    - https://github.com/wfxr/csview/blob/master/CHANGELOG.md
    - https://github.com/wfxr/csview/releases
  summary:
    - >
      csview is a Rust command-line CSV viewer focused on fast, memory-efficient table
      rendering with CJK and emoji alignment support.
  timeline:
    - '2020: 0.3.x releases are published on GitHub.'
    - '2022: 1.0.0 is released.'
    - '2022: Changelog notes csview entering Homebrew core documentation.'
    - '2024: 1.3.0 adds pager support.'
    - '2024: 1.3.2 adds an aarch64-apple-darwin target.'
  usage:
    - >
      csview formats CSV, TSV, and custom-delimited data into aligned terminal tables,
      with styles including markdown table output. The README benchmarks it against xsv
      table, util-linux column, and csvkit's csvlook, emphasizing startup speed and
      memory use for viewing rather than transformation.
related-packages:
  - id: brew:csvkit
    reason: >
      Choose csvkit when viewing with csvlook is only one step in a broader workflow
      that also needs conversion, filtering, joins, statistics, or SQL integration;
      choose csview for a smaller display-focused tool.
    rel: alternative
    sources:
      - https://github.com/wfxr/csview#benchmark
      - https://csvkit.readthedocs.io/en/latest/
