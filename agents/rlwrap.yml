credentials-file-location: null
history:
  adoption-history:
    - >
      rlwrap has broad package-manager coverage across Alpine, Debian, Fedora, Homebrew,
      MacPorts, Nix, Arch, Ubuntu, and openSUSE ecosystems. The project explicitly aims
      to remain portable across old and current Unix-like systems, including Linux,
      macOS, FreeBSD, HP-UX, AIX, Solaris, QNX, and Cygwin.
  package-nerd-significance:
    - >
      rlwrap is a classic composable Unix utility: it improves an existing interactive
      program without modifying that program. It remains useful for legacy REPLs,
      database clients, network tools, and language shells that lack modern line editing
      or persistent history.
  project-history:
    - >
      Hans Lub wrote rlwrap around GNU Readline, with pseudo-terminal handling derived
      from rxvt and completion-list management using Damian Ivereigh's libredblack. Its
      design combines Readline editing with a pseudo-terminal wrapper and optional
      programmable filters.
  related-projects:
    - GNU Readline provides the editing and history engine.
    - rlfe and socat are identified by the project as related wrappers.
    - rxvt supplied much of the original pseudo-terminal handling code.
  sources:
    - https://github.com/hanslub42/rlwrap#readme
    - source_facts.package-manager
  summary:
    - >
      rlwrap wraps an interactive command with GNU Readline facilities, adding editable
      input, command recall, persistent per-command history, and optional completion to
      programs that do not provide those features themselves.
  timeline:
    - '2025: The official README identifies release 0.48.'
  usage:
    - >
      Run rlwrap followed by the target command and its arguments. Common uses include
      adding arrow-key history to a REPL, wrapping netcat, supplying completion words
      with -f, and using filters to transform prompts, completion, input, or output. It
      is not a terminal emulator and is generally unnecessary for programs that already
      have sophisticated terminal handling.
