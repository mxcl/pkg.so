history:
  adoption-history:
    - >
      Rhino became established in industrial design, architecture, jewelry, marine
      design, digital fabrication, and other disciplines requiring accurate free-form
      geometry and broad file interoperability. Grasshopper broadened adoption among
      computational designers by embedding visual algorithmic modeling in Rhino.
  package-nerd-significance:
    - >
      Rhino is a major commercial CAD application with a mature plug-in and scripting
      ecosystem. Its versioned settings, RhinoCommon SDK, Grasshopper environment, and
      3DM interoperability tooling are especially relevant to managed installations and
      developer workflows.
  project-history:
    - >
      Robert McNeel & Associates developed Rhinoceros as a NURBS-based modeling system.
      The product first matured on Windows and later gained a native macOS edition.
      Successive major versions expanded rendering, mesh and subdivision modeling,
      scripting, and cross-platform plug-in development.
  related-projects:
    - >
      Grasshopper is Rhino's integrated visual programming environment. RhinoCommon is
      its cross-platform .NET SDK, while openNURBS provides tools for reading and
      writing the 3DM format.
  sources:
    - https://developer.rhino3d.com/
    - https://docs.mcneel.com/rhino/8mac/help/en-us/index.htm
    - https://www.rhino3d.com/
    - https://www.rhino3d.com/features/
  summary:
    - >
      Rhinoceros, commonly called Rhino, is commercial NURBS-based CAD and 3D-modeling
      software from Robert McNeel & Associates.
  timeline:
    - '1990s: McNeel developed the NURBS modeling system that became Rhino.'
    - '1998: Rhino 1.0 established the commercial Windows product.'
    - '2015: Rhino 5 for Mac became the first commercial Mac edition.'
    - '2023: Rhino 8 was released.'
  usage:
    - >
      Rhino creates, edits, analyzes, renders, documents, and translates curves,
      surfaces, solids, subdivision objects, point clouds, and polygon meshes. Users
      extend it through plug-ins, scripts, RhinoCommon, and Grasshopper definitions.
