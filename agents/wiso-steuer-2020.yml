history:
  adoption-history:
    - >
      Buhl offered WISO steuer:Mac 2020 alongside Web, Windows, Start, Office, and
      adviser-oriented editions in its annual tax-software family.
    - >
      The Mac edition participated in a recurring yearly release model in which users
      transfer prior-year data forward while retaining the matching application for
      older tax cases.
  package-nerd-significance:
    - >
      The year in this cask's identity is functional rather than cosmetic: Buhl explains
      that each annual release can edit only its corresponding tax year.
    - >
      That makes parallel, version-specific package entries useful for users maintaining
      historical German tax returns, even after a newer edition exists.
  project-history:
    - >
      WISO steuer:Mac 2020 was Buhl's macOS tax-preparation edition for the 2019
      assessment year.
    - >
      Its official handbook organized the workflow from installation and prior-data
      transfer through the income-tax declaration and additional tools. Buhl's update
      center retains the edition among its legacy updates.
  related-projects:
    - >
      Other 2020 editions included WISO steuer:Sparbuch, WISO steuer:Start, WISO
      steuer:Office, WISO steuer:Berater, and steuer:Web.
    - WISO Steuer-Mac 2021 succeeded this edition for the 2020 assessment year.
  sources:
    - https://forum.buhl.de/wcf/index.php?file-download%2F23386%2F=
    - https://www.buhl.de/kundencenter/updates
    - https://www.buhl.de/shop/faqs?article=655
  summary:
    - >
      WISO steuer:Mac 2020 is Buhl's proprietary macOS application for preparing the
      German income-tax declaration for assessment year 2019.
  timeline:
    - '2019–2020: Buhl distributed WISO steuer:Mac 2020 for the 2019 tax declaration.'
    - '2020: WISO Steuer-Mac 2021 followed for the next assessment year.'
    - >
      Later releases: Buhl retained the 2020 edition in its legacy update center because
      annual releases remain tied to their corresponding tax years.
  usage:
    - >
      Users install the Mac application, transfer applicable prior-year data, enter tax
      information through guided subject or life-situation workflows, review the
      calculation, and prepare the return for submission.
    - >
      The edition should be retained for its matching assessment year because later
      annual applications cannot directly open and edit older tax-case files.
