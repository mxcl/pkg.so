history:
  adoption-history:
    - >
      Codespace was sold as a one-time-purchase desktop application for macOS, Windows,
      and Ubuntu. Its offline-first storage, menu-bar access, global quick search, and
      library import and export targeted developers who wanted a local alternative to
      web-dependent snippet services.
  package-nerd-significance:
    - >
      Codespace is representative of the cross-platform desktop snippet managers of the
      Electron era: local-first application data, broad syntax highlighting,
      clipboard-oriented workflows, and portable library exports. Homebrew Cask gives
      macOS users a reproducible installation path for an otherwise directly distributed
      commercial application.
  project-history:
    - >
      Developer Tristan, known as t4t5, released Codespace publicly in April 2020 as a
      desktop code-snippet organizer. Subsequent releases added library import and
      export, faster global search, menu-bar operation, more language definitions,
      SnippetsLab JSON import, and web-based snippet sharing.
  related-projects:
    - >
      The official release history identifies SnippetsLab as an import source. Codespace
      also occupies the same general tool category as other local code-snippet libraries
      and clipboard-oriented developer utilities.
  sources:
    - "Creator's official site: https://t4t5.com/"
    - 'Official product page: https://codespace.app/'
    - 'Official release history: https://codespace.app/releases'
  summary:
    - >
      Codespace is a commercial, offline-first code-snippet manager for macOS, Windows,
      and Ubuntu, with folders, search, clipboard access, library export, and link-based
      sharing.
  timeline:
    - '2020-04-29: Codespace became publicly available.'
    - '2020-05-18: Whole-library import and export arrived through .codespace files.'
    - '2021-02-22: A faster global Quicksearch workflow was introduced.'
    - '2021-07-24: SnippetsLab JSON import was added.'
  usage:
    - >
      Users organize snippets into branded folders, find them with the main search or
      global Quicksearch shortcut, and copy code from the desktop or menu-bar interface.
      Libraries can be exported as .codespace files, while individual snippets can be
      prepared on the official sharing site and published as unique links.
