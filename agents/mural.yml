history:
  adoption-history:
    - >
      Mural reported in 2021 that its platform supported nearly 80 percent of the
      Fortune 100, after remote work accelerated demand for distributed visual
      collaboration.
    - >
      Mural has offered desktop and mobile clients alongside its browser-based service,
      making the same collaborative canvases available across workplace environments.
  package-nerd-significance:
    - >
      The Homebrew cask packages the desktop front end of an otherwise cloud-centered
      collaboration service. It exemplifies how package managers distribute native
      clients for SaaS products whose documents and account data remain online.
  project-history:
    - >
      Tactivos, Inc., doing business as Mural, was founded in 2011 to provide teams with
      a shared digital workspace for visual collaboration.
    - >
      In 2022 Mural acquired LUMA Institute and expanded its positioning from online
      whiteboarding toward a broader system of collaborative intelligence and
      facilitated problem solving.
  related-projects:
    - LUMA Institute
    - Mural web application
    - Mural mobile applications
  sources:
    - https://support.mural.co/s/
    - https://www.mural.co/apps
    - https://www.mural.co/press-releases/ey-entrepreneur-of-the-year-2021-finalist
    - >
      https://www.mural.co/press-releases/mural-acquires-luma-launches-collaborative-intelligence
  summary:
    - >
      Mural is a cloud-based visual collaboration platform built around shared canvases
      for brainstorming, planning, workshops, diagramming, and distributed teamwork.
  timeline:
    - '2011: Tactivos, Inc. founded Mural as a digital visual-collaboration workspace.'
    - '2021: Mural reported adoption by nearly 80 percent of the Fortune 100.'
    - '2022: Mural acquired LUMA Institute.'
  usage:
    - >
      Teams use Mural synchronously or asynchronously to arrange sticky notes, diagrams,
      drawings, images, and workshop materials on shared canvases.
    - >
      The macOS application provides desktop access to the Mural service; an account and
      network connection are central to normal use.
