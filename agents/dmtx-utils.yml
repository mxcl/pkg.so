history:
  adoption-history:
    - >
      The utilities have stayed attractive to Unix package managers because they turn
      barcode read/write functionality into normal pipeline components. That makes Data
      Matrix generation and scanning available to packaging scripts, QA jobs, labels,
      and batch image workflows without writing against the C API.
  package-nerd-significance:
    - >
      dmtx-utils is notable because it packages a graphics/barcode library as small
      composable CLI tools. For distro maintainers, it is a tidy example of a
      library-plus-utils split where the tools are both useful to users and a reference
      for library behavior.
  project-history:
    - >
      The project split the utility programs from the core libdmtx library while keeping
      the same ecosystem: libdmtx provides the native library, and dmtx-utils provides
      command-line programs for the modern ECC200 Data Matrix barcode format. The
      libdmtx site now points maintainers and users to the dmtx GitHub organization.
  related-projects:
    - libdmtx is the underlying Data Matrix library.
    - dmtx-wrappers provides language bindings around the same library family.
  sources:
    - https://github.com/dmtx/dmtx-utils
    - https://libdmtx.org/
    - https://github.com/dmtx/libdmtx
  summary:
    - >
      dmtx-utils is the command-line companion package for libdmtx, the open-source Data
      Matrix barcode library. It gives shell scripts and terminal users direct access to
      libdmtx encoding, decoding, and query behavior through tools such as dmtxread and
      dmtxwrite.
  timeline:
    - '0.7.x: dmtx-utils is maintained as the utility package for the libdmtx ecosystem.'
    - '2019: The libdmtx site notes maintenance by the dmtx GitHub team.'
  usage:
    - >
      The README shows dmtxwrite taking messages from standard input or files and
      producing barcode images, while dmtxread reverses images back into messages. It
      also demonstrates chaining the two tools in a pipeline, which is exactly the kind
      of shell-native workflow package maintainers like.
related-packages:
  - id: brew:zxing-cpp
    reason: >
      Choose ZXing-C++ when an application needs an embeddable, thread-safe C++ library
      with Data Matrix ECC200 plus many other readable and writable barcode formats
      rather than libdmtx-focused shell utilities.
    rel: alternative
    sources:
      - https://github.com/dmtx/dmtx-utils
      - https://github.com/zxing-cpp/zxing-cpp
  - id: brew:zint
    reason: >
      Choose Zint when the main task is generating Data Matrix and a much broader range
      of barcode symbologies through a CLI, GUI, or embeddable library.
    rel: alternative
    sources:
      - https://github.com/dmtx/dmtx-utils
      - https://github.com/zint/zint
      - https://zint.org.uk/manual/
