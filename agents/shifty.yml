history:
  adoption-history:
    - >
      Shifty is distributed as a Homebrew Cask, placing the small GUI utility in
      reproducible macOS setup workflows. Its public repository also attracted community
      participation through issues, translations, and pull requests.
  package-nerd-significance:
    - >
      Shifty represents the package-manager-friendly class of focused macOS menu-bar
      utilities: it turns a limited built-in operating-system feature into a
      configurable power-user tool while remaining free and open source.
  project-history:
    - >
      Shifty was developed as a free, GPL-licensed macOS application that expands
      Apple's built-in Night Shift feature. Its official repository documents
      per-application, per-website, and custom-period exclusions, color-temperature
      adjustment, dark-mode scheduling, and global shortcuts.
  related-projects:
    - Apple Night Shift
    - Homebrew Cask
  sources:
    - https://github.com/thompsonate/Shifty
    - https://github.com/thompsonate/Shifty/issues/20
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Shifty is an open-source macOS menu-bar utility for more granular control of Night
      Shift.
  timeline:
    - >
      2017: The official issue tracker described Shifty as being in beta while its Night
      Shift scheduling behavior was refined.
  usage:
    - >
      Users run Shifty from the menu bar to toggle Night Shift, adjust color
      temperature, define application or website exclusions, set custom time periods,
      and assign global shortcuts. Website-specific behavior supports Safari, Chrome,
      and Vivaldi according to the official README.
