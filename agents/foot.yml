id: brew:foot
display-name: foot
repo: https://codeberg.org/dnkl/foot
docs:
  - https://codeberg.org/dnkl/foot
  - https://codeberg.org/dnkl/foot/wiki
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/foot/foot.ini
    - ~/.config/foot/foot.ini
    - $XDG_CONFIG_DIRS/foot/foot.ini
    - /etc/xdg/foot/foot.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      foot became notable in Wayland-oriented Linux packaging because it is designed as
      a native Wayland terminal with its own terminfo. The installation guide notes that
      ncurses has included a version of foot's terminfo since the 2021-07-31 ncurses
      release, while still documenting packaging choices for foot-specific or separately
      packaged terminfo definitions.
  package-nerd-significance:
    - >
      Package maintainers care about foot because it sits at the intersection of
      Wayland, terminal capability databases, optional runtime integrations, and small C
      dependencies. Its docs explicitly discuss whether to use ncurses' bundled terminfo
      or package foot's own terminfo, a detail that affects remote shells, tmux, and
      TERM/TERMINFO behavior.
  project-history:
    - >
      The project is developed on Codeberg by dnkl and is written for Wayland rather
      than for X11 compatibility. Its README presents foot as a focused terminal
      emulator, while its installation guide documents Meson-based builds and the
      author's related libraries fcft and tllist as part of the build ecosystem.
    - >
      The name is explained by the maintainer as a contraction from 'foo terminal'
      through 'footerm' to 'foot', matching the small, utilitarian naming style of the
      project.
  related-projects:
    - >
      foot's installation guide identifies fcft and tllist as related libraries by the
      same maintainer. Its README also links terminal features to related protocol
      ecosystems such as kitty underlines, synchronized updates, and sixel.
  sources:
    - https://codeberg.org/dnkl/foot
    - https://codeberg.org/dnkl/foot/raw/branch/master/CHANGELOG.md
    - https://codeberg.org/dnkl/foot/raw/branch/master/INSTALL.md
    - https://codeberg.org/dnkl/foot/raw/branch/master/README.md
    - https://codeberg.org/dnkl/foot/releases
  summary:
    - >
      foot is a fast, lightweight Wayland-native terminal emulator whose own README
      emphasizes low dependency, disk, and memory footprint; desktop-environment
      independence; a server/daemon mode; searchable scrollback; URL handling; color
      emoji; true color; sixel images; and modern terminal protocol support.
  timeline:
    - >
      2021: ncurses 2021-07-31 includes a version of foot's terminfo, according to
      foot's install guide.
    - '2025: foot 1.27.0 adds configurable URL underline styles in the project changelog.'
    - '2026: the Codeberg releases page lists a 1.27.0 release dated 2026-05-15.'
  usage:
    - >
      Users run foot directly or use footclient with the server mode. Configuration is
      read from XDG-style foot.ini paths, and packagers can tune Meson options for
      documentation, tests, IME, grapheme clustering, terminfo, systemd units, and utmp
      backends.
