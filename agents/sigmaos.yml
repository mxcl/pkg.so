history:
  adoption-history:
    - >
      SigmaOS is distributed as a macOS application and is also represented by the
      Homebrew Cask record supplied in the input. Its official documentation supports
      migration from several established browsers, including Safari, Chrome, Firefox,
      Brave, Edge, Opera, Vivaldi, and Sidekick.
  package-nerd-significance:
    - >
      SigmaOS is notable among alternative browser packages for combining a WebKit
      engine and native SwiftUI interface with support for many extensions from the
      Chrome Web Store.
    - >
      Its Homebrew Cask presence gives Mac users a package-manager installation path for
      a proprietary, account-enabled browser whose synchronized state and
      Keychain-protected passwords remain outside Homebrew's control.
  project-history:
    - >
      SigmaOS was developed as a macOS-first browser organized around persistent
      workspaces and vertical pages rather than conventional browser windows and tab
      strips.
    - >
      Later product development added features such as split-screen browsing,
      Chrome-extension compatibility, synchronized browser state, and the Airis browsing
      assistant.
  related-projects:
    - WebKit, the browser engine identified by SigmaOS as its underlying engine.
    - Apple Keychain, used by SigmaOS to protect passwords.
    - Chrome Web Store extensions, many of which SigmaOS supports.
  sources:
    - 'Official FAQ: https://docs.sigmaos.com/common-questions'
    - 'Official documentation: https://docs.sigmaos.com/'
    - 'Official product page: https://sigmaos.com/'
    - 'Official release notes: https://docs.sigmaos.com/release-notes'
    - source_facts.package-manager
  summary:
    - >
      SigmaOS is a macOS web browser centered on workspaces, vertical pages, keyboard
      navigation, and side-by-side browsing.
  timeline:
    - >
      2023: The official documentation site documented SigmaOS tutorials, knowledge-base
      material, and release notes.
    - >
      Later development added the Airis assistant and expanded workspace-oriented
      browsing features.
  usage:
    - >
      Users organize pages into workspaces, mark pages as completed, search pages and
      commands from Lazy Search, and display two pages with Split Screen.
    - >
      SigmaOS can migrate browser state from other browsers, synchronize a user's setup
      between Macs, and use Apple Keychain or supported password-manager extensions for
      credentials.
