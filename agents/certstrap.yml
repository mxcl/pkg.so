id: brew:certstrap
display-name: certstrap
repo: null
docs:
  - https://github.com/square/certstrap#readme
config-file-location: null
credentials-file-location:
  unix:
    - out/
history:
  adoption-history:
    - >
      certstrap became a packaged PKI helper across multiple ecosystems. The supplied
      package facts list APK, Homebrew, MacPorts, Nix, and Scoop packages, matching its
      role as a small standalone executable for development and internal PKI workflows.
  package-nerd-significance:
    - >
      certstrap matters in package catalogs because it turns the brittle OpenSSL
      local-CA bootstrap routine into a reproducible CLI. It is especially visible to
      developers who need throwaway or internal TLS material without adopting a larger
      PKI system.
  project-history:
    - >
      The public repository was created in 2015 and the release history includes
      v1.0.0/v1.0.1 in 2016, later 1.1 and 1.2 releases, and v1.3.0 in 2022. The project
      documents building from source with Go and contributing through the upstream
      repository.
  related-projects:
    - >
      The README says certstrap was adapted from etcd-ca and explicitly frames itself as
      an alternative to direct OpenSSL configuration.
  sources:
    - https://api.github.com/repos/square/certstrap
    - https://github.com/square/certstrap
    - https://github.com/square/certstrap#readme
    - https://formulae.brew.sh/api/formula/certstrap.json
  summary:
    - >
      certstrap is Square's Go-based CLI for bootstrapping certificate authorities,
      certificate requests, and signed certificates. Its README describes it as a simple
      certificate manager adapted from etcd-ca and intended as a friendlier alternative
      to hand-writing OpenSSL commands and config files.
  timeline:
    - '2015: Public GitHub repository created.'
    - '2016: v1.0.0 and v1.0.1 releases published.'
    - '2017: v1.1.x releases published.'
    - '2019: v1.2.0 released.'
    - '2022: v1.3.0 released.'
  usage:
    - >
      Typical certstrap usage starts by initializing a CA, then generating identity keys
      and CSRs, and finally signing certificate requests. By default, generated keys,
      CSRs, certificates, and CRLs are placed in the depot directory, documented as
      out/.
related-packages:
  - id: brew:cfssl
    reason: >
      Choose CFSSL when you need a larger PKI toolkit with JSON-driven CSR generation,
      certificate bundling, scanning, OCSP tooling, or an online CA API rather than
      certstrap's local bootstrap workflow.
    rel: alternative
    sources:
      - https://github.com/cloudflare/cfssl/blob/master/README.md
      - https://github.com/cloudflare/cfssl/blob/master/doc/cmd/cfssl.txt
      - https://github.com/square/certstrap#readme
  - id: brew:step
    reason: >
      Choose step when you want a broader user-oriented PKI CLI that can create and
      inspect certificates and also act as the client for an online step-ca deployment.
    rel: alternative
    sources:
      - https://smallstep.com/docs/step-cli/
      - https://smallstep.com/docs/step-cli/reference/ca/certificate/
      - https://github.com/square/certstrap#readme
  - id: brew:openssl@3
    reason: >
      Choose OpenSSL for low-level control and extensive format and protocol operations;
      choose certstrap when a guided CA, CSR, and signing workflow is more important
      than OpenSSL's breadth.
    rel: alternative
    sources:
      - https://github.com/square/certstrap#readme
      - https://docs.openssl.org/3.6/man1/openssl/
tags:
  - certificate-authority
  - certificates
  - cli
  - csr
  - pki
  - tls
geiger:
  category: appliance
  color: green
  confidence: low
  reason: narrow executable package without higher-risk signals
  reasons:
    - narrow executable package without higher-risk signals
  signals:
    - metadata:no-higher-risk-signals
provenance:
  category-sources:
    - >
      Official README describes certstrap as a certificate manager for certificate
      authorities and PKI.
  display-name-sources:
    - source_facts.name and official README title use certstrap.
  docs-sources:
    - Official GitHub README at https://github.com/square/certstrap documents certstrap usage.
  history-sources:
    - https://api.github.com/repos/square/certstrap
    - https://github.com/square/certstrap
    - https://github.com/square/certstrap#readme
    - https://formulae.brew.sh/api/formula/certstrap.json
  repo-sources:
    - >
      source_facts.repo already provides https://github.com/square/certstrap; prompt
      requires repo null when supplied.
  tags-sources:
    - >
      Official README documents CA initialization, certificate requests, signing, CSR
      generation, and TLS/PKI files.
category-confidence: high
category-path:
  - security
  - certificates
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
