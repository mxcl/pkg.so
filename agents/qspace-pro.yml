history:
  adoption-history:
    - >
      QSpace is distributed in Mac App Store and Pro editions. The Pro edition adds
      deeper macOS integration and automation features, while optional extensions cover
      server connections, archive handling, batch renaming, and a temporary file shelf.
  package-nerd-significance:
    - >
      QSpace Pro appeals to users who want a scriptable and highly configurable Finder
      replacement with multi-pane navigation, remote protocols, archive browsing,
      checksums, custom shortcuts, and terminal integration. Its Homebrew cask makes the
      direct-distribution edition easy to bootstrap on managed Macs.
  project-history:
    - >
      The official changelog records active development from at least early 2020. The
      application grew from a multi-pane local file browser into a broader
      file-management environment with remote-server support, Apple Silicon
      compatibility, archive tools, desktop replacement features, configurable services,
      and cloud-storage integrations.
  related-projects:
    - macOS Finder is the system file manager that QSpace supplements.
    - QSpace MAS is the Mac App Store edition with a different feature set.
    - MacZip technology supplies integrated archive browsing.
  sources:
    - 'Official FAQ: https://qspace.awehunt.com/en-us/faq/differences-between-mas-and-pro.html'
    - 'Official changelog: https://qspace.awehunt.com/en-us/changelog.html'
    - 'Official product site: https://qspace.awehunt.com/en-us/'
  summary:
    - >
      QSpace Pro is a customizable multi-pane file manager for macOS and an alternative
      interface to Finder.
  timeline:
    - '2020: The official changelog records the 1.7 and 1.8 release series.'
    - '2020: Version 2.0 expanded remote access through SFTP, FTP, FTPS, and WebDAV.'
    - '2020: Version 2.4 added Apple Silicon and macOS Big Sur support.'
    - >
      2026: The 6.3 beta redesigned settings and expanded pane, desktop, and
      cloud-service controls.
  usage:
    - >
      Users navigate and manipulate local files in as many as twelve pane layouts,
      search with Spotlight, launch terminals or editors for the current directory,
      calculate hashes, browse archives, and connect to remote or cloud storage.
