history:
  adoption-history:
    - >
      Ironclad developed Rivet for its own contract-focused AI work, then worked with
      external development teams before releasing it as open source. Ironclad
      subsequently documented production use by teams building legal, educational, RFP,
      and other AI applications.
  package-nerd-significance:
    - >
      Rivet combines a desktop visual editor with version-controllable project files and
      TypeScript packages that execute the resulting graphs. This makes visual prompt
      and agent development compatible with code review, testing, application embedding,
      and package-manager installation.
  project-history:
    - >
      Rivet began as an internal Ironclad tool for visualizing recursive prompt chains
      after conventional debugging became unwieldy. Ironclad expanded the prototype with
      remote debugging, collaboration, code review, and testing, then released it as an
      open-source project.
  related-projects:
    - Rivet Core and Rivet Node execute projects produced by the desktop editor.
    - Rivet CLI runs or serves Rivet projects from a terminal.
    - >
      Its origin story cites LangChain, LlamaIndex, AutoGPT, and BabyAGI as related
      tools explored by Ironclad.
  sources:
    - https://github.com/Ironclad/rivet
    - https://ironcladapp.com/resources/articles/meet-rivet
    - https://ironcladapp.com/resources/articles/rivet-six-months-later
    - https://rivet.ironcladapp.com/docs
  summary:
    - >
      Rivet is an open-source, graph-based IDE and TypeScript library for designing,
      debugging, testing, and embedding LLM chains and AI agents.
  timeline:
    - >
      Initial development: Ironclad built Rivet internally to visualize and debug
      complex prompt chains.
    - >
      Public release: Ironclad open-sourced Rivet as a visual programming environment
      for generative AI.
    - >
      Six months after release: Ironclad reported broader model support, plugins, and
      use by external development teams.
  usage:
    - >
      Developers arrange typed nodes into executable graphs, inspect intermediate
      values, test prompt behavior, and save projects for execution through the desktop
      application, TypeScript libraries, or CLI. Provider keys can be entered through
      the settings interface or supplied with documented environment variables.
