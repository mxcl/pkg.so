id: brew:flock
display-name: flock(1)
repo: null
docs:
  - https://github.com/discoteq/flock#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The package is especially relevant on macOS and other non-Linux Unix-like systems
      because the README gives Homebrew and MacPorts installation paths. The supplied
      package facts also list Alpine, Nix, and other package-manager entries.
    - >
      Its adoption pattern is practical rather than framework-driven: shell scripts,
      cron jobs, backups, and deploy tasks use flock to serialize work with a lock file.
  package-nerd-significance:
    - >
      For package maintainers, discoteq flock is a good example of packaging a small
      compatibility utility to make Unix scripts more portable across distributions and
      operating systems.
    - >
      It matters in package-manager culture because the command name overlaps with a
      util-linux tool: correct formula naming, conflict handling, and platform behavior
      are the interesting parts, not a large dependency graph.
  project-history:
    - >
      The project README explicitly frames the package as an answer to the question of
      why another flock(1) exists when util-linux already includes one. Its
      distinguishing goals are support across Linux, Illumos, Darwin, and FreeBSD,
      testing of major behavior and edge cases, an ISC license, and public source and
      issue tracking.
    - >
      The GitHub release history dates the public package line at least to v0.1.1 in
      2014, with later v0.2.x releases in 2014 and 2015 and a v0.4.0 release in 2020.
  related-projects:
    - >
      util-linux provides the well-known Linux flock(1) implementation that this project
      compares itself with.
    - bats-core is used by the project test suite.
  sources:
    - https://github.com/discoteq/flock
    - https://github.com/discoteq/flock/releases
  summary:
    - >
      discoteq flock(1) is a portable command-line implementation of the Unix
      file-locking utility. It exists for systems where the util-linux flock(1) command
      is absent, inconvenient, or not portable enough.
  timeline:
    - '2014: Public GitHub releases include v0.1.1 and v0.2.0.'
    - '2015: The v0.2.x release series continues.'
    - >
      2020: v0.4.0 is released with source tarball installation instructions referenced
      by the README.
  usage:
    - >
      The common usage is to run flock with a lock-file path followed by a command, such
      as protecting an echo or rsync invocation so only one instance proceeds at a time.
    - >
      Because it is a small system utility, its value is in predictable process
      coordination from shell scripts without embedding lock handling into each script.
related-packages:
  - id: brew:util-linux
    reason: >
      Choose util-linux on Linux for the platform's established flock implementation;
      choose this package when you need the separately maintained portable
      implementation documented for Darwin, FreeBSD, Illumos, and Linux.
    rel: alternative
    sources:
      - https://github.com/discoteq/flock#wait-isnt-there-already-a-flock1
      - >
        https://git.kernel.org/pub/scm/utils/util-linux/util-linux.git/tree/sys-utils/flock.1.adoc
