id: brew:geeqie
display-name: Geeqie
repo: null
docs:
  - https://www.geeqie.org/help
config-file-location:
  unix:
    - /etc/geeqie/geeqierc.xml
    - $XDG_CONFIG_HOME/geeqie/geeqierc.xml
    - ~/.config/geeqie/geeqierc.xml
credentials-file-location: null
history:
  adoption-history:
    - >
      Geeqie's official site lists availability across Linux distributions, BSD systems,
      macOS package channels, Flatpak, AppImage, Snap, and Windows 11. The input package
      facts likewise show broad package-manager coverage across apk, Homebrew, Debian,
      Fedora dnf, MacPorts, Nix, pacman, Ubuntu, and zypper.
  package-nerd-significance:
    - >
      Geeqie is package-nerd-relevant because it is a long-lived desktop image viewer
      with XDG configuration paths, metadata behavior, plugins, Lua extension hooks, and
      cross-distribution GUI packaging.
  project-history:
    - >
      The official Geeqie site says Geeqie is the successor to GQView, which was first
      released in 1998, and that GQView was renamed Geeqie in 2007. The site also states
      that many features have been implemented over the years and that the project
      remains actively maintained.
  related-projects:
    - >
      GQView is Geeqie's predecessor; GTK, XDG desktop paths, Lua extensions, and
      metadata tooling are adjacent technologies documented by Geeqie.
  sources:
    - https://www.geeqie.org/
    - https://www.geeqie.org/help/GuideReferenceConfig.html
  summary:
    - >
      Geeqie is a lightweight GTK-based image viewer and photo-management tool descended
      from GQview.
  timeline:
    - "1998: GQView, Geeqie's predecessor, was first released."
    - '2007: GQView was renamed Geeqie.'
    - '2024: Geeqie user manual configuration reference was updated by The Geeqie Team.'
  usage:
    - >
      Users run Geeqie for browsing, viewing, tagging, searching, and managing image
      collections. The official configuration reference documents XDG-style per-user
      configuration, system defaults under /etc/geeqie, layouts, plugin desktop files,
      Lua scripts, history, keyboard accelerators, collections, thumbnails, metadata,
      similarity files, and safe-delete settings.
related-packages: []
tags:
  - cli
  - gtk
  - image-viewer
  - linux-desktop
  - metadata
  - photo-management
