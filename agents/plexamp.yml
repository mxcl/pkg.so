history:
  adoption-history:
    - >
      Plexamp began as an experimental Plex Labs desktop application and grew into
      Plex's dedicated music client. It expanded beyond its original compact desktop
      experience to a broader cross-platform application with automotive integration,
      casting, offline playback, and headless Raspberry Pi use among its features.
    - >
      Plex cited Plexamp's success when announcing a strategy of moving music and photos
      into specialized companion applications, giving it a more central role in the Plex
      ecosystem.
  package-nerd-significance:
    - >
      Plexamp appeals to self-hosting and music-library enthusiasts because it combines
      a polished audio player with a user-controlled Plex Media Server library rather
      than treating the local collection as a simple folder tree.
    - >
      Its gapless playback, loudness leveling, pre-caching, visualizers,
      sonic-similarity features, remote streaming, and optional headless mode make it a
      distinctive client package in the Plex server ecosystem.
  project-history:
    - >
      Plexamp was introduced through Plex Labs in 2017 as a small dedicated desktop
      music player inspired in spirit by compact players such as Winamp. Plex
      subsequently used it as a laboratory for music discovery and radio features.
    - >
      The application matured into Plex's primary focused music experience.
      Server-assisted Sonic Analysis added similarity-based radios, mixes, and
      discovery, while free and Plex Pass feature tiers broadened its audience.
  related-projects:
    - Plex Media Server hosts the personal music libraries consumed by Plexamp.
    - >
      Plex Pass unlocks selected Plexamp features, including downloads and advanced
      sonic-discovery functions.
    - >
      Plex's general player applications share the server ecosystem, while Plexamp
      specializes in music.
  sources:
    - https://forums.plex.tv/t/plexamp-frequently-asked-questions/217457
    - https://plexamp.com/
    - https://www.plex.tv/blog/plex-loves-music-and-vice-versa/
    - https://www.plex.tv/blog/super-sonic-get-closer-to-your-music-in-plexamp/
    - https://www.plex.tv/blog/the-future-of-plex-focused-streamlined-and-ready-for-feedback/
  summary:
    - >
      Plexamp is Plex's dedicated music player for streaming and exploring a personal
      music library hosted on Plex Media Server, with features aimed at continuous
      playback, visual presentation, library discovery, and offline listening.
  timeline:
    - '2017: Plexamp debuted through Plex Labs as an experimental dedicated music player.'
    - '2018: Plex described Plexamp as a laboratory for music-radio and discovery features.'
    - >
      2021: Sonic Analysis introduced neural-network-assisted similarity and discovery
      features.
    - >
      2024: Plex identified Plexamp as the successful model for its focused
      companion-app strategy.
  usage:
    - >
      Users connect Plexamp to a Plex account and select a music library hosted by Plex
      Media Server. The app provides albums, playlists, radios, mixes, visualizers,
      casting, automotive interfaces, and continuous-playback features.
    - >
      A core feature set is free, while selected capabilities such as downloads, Guest
      DJ, advanced sonic discovery, lyrics, equalization, and headless Raspberry Pi
      operation require Plex Pass.
