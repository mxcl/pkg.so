history:
  adoption-history:
    - >
      The project is distributed as native applications for Windows, macOS, and Linux
      with a consistent interface and feature set. Its emphasis on responsiveness and
      uncomplicated editing positions it for users who need waveform editing and
      analysis without adopting a full digital audio workstation.
  package-nerd-significance:
    - >
      ocenaudio occupies a practical niche between basic trimming utilities and full
      music-production suites. Its native cross-platform builds, large-file handling,
      VST support, multi-selection, and real-time analysis make it a compact desktop
      tool worth packaging independently.
  project-history:
    - >
      ocenaudio began when a Brazilian research group needed an easy-to-use audio editor
      with support for multiple formats, spectral analysis, and signal generation. The
      application was built on the Ocen Framework, a library created to standardize
      cross-platform audio-manipulation and analysis development, and it also uses Qt.
  related-projects:
    - Ocen Framework is the audio-development library underlying ocenaudio.
    - VST plugins extend the editor with additional effects.
  sources:
    - https://www.ocenaudio.com/en/features
    - https://www.ocenaudio.com/en/whatis
  summary:
    - >
      ocenaudio is a cross-platform waveform editor and audio-analysis application
      designed to remain responsive and straightforward to use.
  timeline:
    - >
      Undated: Development began in response to a Brazilian research group's need for a
      capable, easy-to-use audio editor.
  usage:
    - >
      Users open audio files to select, cut, copy, paste, analyze, and process waveform
      regions. The application supports multiple simultaneous selections, real-time
      effect previews, VST effects, large files, and a configurable spectrogram view.
