history:
  adoption-history:
    - >
      Elemental is distributed as a macOS Homebrew cask and as an official Docker image.
      Its upstream project also directs users to the eXist-db package repository,
      reflecting compatibility inherited from its eXist-db foundation.
  package-nerd-significance:
    - >
      Elemental is notable as a modern native XML database in an ecosystem where XQuery,
      XSLT, XML:DB, and XML application servers remain important to digital publishing,
      archives, and XML-heavy data systems.
    - >
      Its origin as a history-preserving fork of eXist-db makes it relevant to
      maintainers tracking lineage, compatibility, and packaging changes across related
      database distributions.
  project-history:
    - >
      Elemental is a Fair Source native XML database and NoSQL application platform
      built around XML technologies, including XQuery and XSLT.
    - >
      The project was seeded from eXist-db's develop branch at a commit dated October
      25, 2024. Its maintainers then rewrote the imported history to remove files that
      were not needed by the new project.
  related-projects:
    - >
      Elemental is derived from eXist-db and continues to reference the eXist-db
      application package repository. Its official distribution surfaces also include
      Docker and Homebrew Cask.
  sources:
    - https://github.com/evolvedbinary/elemental
    - https://www.elemental.xyz/documentation
    - source_facts.description
    - source_facts.repo
  summary:
    - >
      Elemental is a native XML database and application platform derived from eXist-db,
      with first-class XQuery and XSLT support.
  timeline:
    - '2024: Elemental was seeded from an October 25 eXist-db development commit.'
    - >
      2024–present: The project developed as a separately branded native XML database
      with Homebrew and Docker distribution.
  usage:
    - >
      Users run Elemental to store and query XML documents and to host applications
      built around XML technologies. Official resources cover binaries, Docker images,
      source builds, and application packages.
    - >
      No stable user-level configuration or credentials-file location was established by
      the reviewed official sources; installation-relative server configuration should
      not be represented as a universal per-user path.
