history:
  adoption-history:
    - >
      VK expanded group calling during the 2020 shift toward remote work and study. By
      the end of 2021, VK reported 13 million monthly VK Calls users within VKontakte
      and 20 million across VKontakte and Odnoklassniki.
    - >
      The service grew from calls embedded in VKontakte into dedicated desktop and
      mobile applications plus a standalone web experience. VK also commercialized its
      calling technology through an SDK and business integrations.
  package-nerd-significance:
    - >
      VK Calls is notable as a regionally prominent, cross-platform conferencing client
      tied to the wider VK ecosystem while still permitting link-based participation
      without a VK account. Its desktop package represents the service's transition from
      an embedded social-network feature to a standalone conferencing product.
  project-history:
    - >
      VK introduced group calls for up to 128 participants in 2020, with screen sharing,
      no time limit, and anonymous link participation. In 2021 it released a desktop
      application and subsequently removed participant-count restrictions.
    - >
      In 2022 VK launched separate iOS and Android applications and the calls.vk.com web
      version. Later additions included breakout rooms, meeting transcription, live
      subtitles, gesture recognition, and other conferencing and moderation tools.
  related-projects:
    - VKontakte and Odnoklassniki integrated VK's calling technology.
    - VK Messenger provides messaging and calling within the same broader ecosystem.
    - VK Calls SDK exposes calling capabilities to third-party products.
  sources:
    - https://corp.vkcdn.ru/media/files/1q22-ir-presentation_final_eng_IGk1aUb.pdf
    - https://corp.vkcdn.ru/media/files/3q21-presentation_final_IVZzklM.pdf
    - https://corp.vkcdn.ru/media/files/mail.rugrouparfy2020.pdf
    - https://vk.company.ru/ru/investors/info/11553/
    - https://vk.company.ru/ru/investors/info/11642/
    - https://vk.company.ru/ru/investors/ir_blog/11092/
  summary:
    - >
      VK Calls is VK's free cross-platform video-conferencing service for meetings,
      lessons, webinars, presentations, and personal communication.
  timeline:
    - '2020: VK launched group calls for up to 128 participants.'
    - '2021: A standalone desktop application was released and participant limits were removed.'
    - '2022: Separate mobile apps and the calls.vk.com web application launched.'
    - '2023: Breakout rooms, live transcription, subtitles, and gesture recognition were added.'
  usage:
    - >
      Users create or schedule meetings, share invitation links, join from the desktop
      app or browser, present their screens, record or stream sessions, and moderate
      large calls with waiting rooms and raised hands. Official materials state that
      link invitees can participate anonymously without a VK account when the organizer
      permits it.
