history:
  adoption-history:
    - >
      Prizmo developed as an Apple-platform scanning workflow for users who need
      document capture, OCR, searchable exports, automation, and accessibility support.
      Creaceed expanded it from the Mac to iPhone and iPad and added both local and
      cloud-assisted recognition options.
  package-nerd-significance:
    - >
      Prizmo represents the long-lived class of proprietary macOS productivity utilities
      installed as application bundles but integrated with scanners, cameras, iCloud,
      PDF workflows, Core ML, and VoiceOver.
  project-history:
    - >
      Belgian developer Creaceed released Prizmo 1.0 for Mac in April 2009 as a
      document-photo correction and OCR application. Early updates added scanner input,
      multilingual recognition, searchable PDF output, camera tethering, and multi-page
      PDF support.
    - >
      The product later expanded to iOS and accumulated richer image correction, export,
      automation, cloud OCR, and accessibility capabilities while retaining a Mac
      edition.
  related-projects:
    - Prizmo Go
    - Creaceed Scanner SDK
  sources:
    - https://creaceed.com/prizmo/faq
    - https://creaceed.com/prizmo/history
    - https://creaceed.com/prizmo/specs
  summary:
    - >
      Prizmo is Creaceed's commercial document-scanning and
      optical-character-recognition application for Mac, iPhone, and iPad.
  timeline:
    - '2009: Creaceed released Prizmo 1.0 for Mac.'
    - >
      2010: Prizmo 1.5 added camera tethering, multi-page PDF support, and improved
      scanner workflows.
    - >
      2019: Prizmo 5 for iOS introduced a redesigned scanning workflow and expanded OCR
      and export features.
  usage:
    - >
      Users import pages from a camera, scanner, screenshot, or file; correct
      perspective and readability; recognize printed text; and export searchable PDF,
      DOCX, or text. Accessibility features support VoiceOver and spoken guidance, while
      optional cloud OCR broadens recognition capabilities.
