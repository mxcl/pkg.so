history:
  adoption-history:
    - >
      Coda developed from an experimental combination of documents, tables, views, and
      formulas into a collaborative work platform supporting connected data,
      automations, templates, and third-party Packs.
    - >
      Teams adopted it for documents, project tracking, knowledge hubs, structured
      workflows, and internal tools. Its desktop client provides nearly the same
      functionality as the web application while adding tabbed documents, multiple
      account windows, and quick access to starred documents.
    - >
      After joining the unified Superhuman suite, existing Coda documents, formulas,
      tables, Packs, workflows, and links were carried forward into Superhuman Docs
      rather than migrated to a separate replacement product.
  package-nerd-significance:
    - >
      Coda helped popularize the programmable-document model: prose, relational tables,
      formulas, buttons, automations, integrations, and application-like interfaces
      coexist in one collaborative surface.
    - >
      Superhuman Docs is noteworthy to desktop package users because the cask installs a
      dedicated macOS client for a cloud-backed workspace whose functionality otherwise
      lives primarily on the web. Its Packs, Slack integration, and MCP endpoint also
      make it an integration surface rather than only a word processor.
  project-history:
    - >
      The product that became Superhuman Docs began as Coda. Its official product
      chronology records an initial table in 2014, connected views and formulas in 2015,
      and a document canvas in 2016. Coda 1.0 launched in 2019.
    - >
      Coda subsequently expanded toward team workspaces, an integration ecosystem called
      Packs, automation, and AI-assisted work. Grammarly acquired Coda in 2025 as part
      of the organization that adopted the Superhuman name.
    - >
      On July 8, 2026, Coda became Superhuman Docs. The rebrand introduced a new
      identity, updated infrastructure, expanded Docs AI capabilities, and a new macOS
      desktop application while retaining existing customer documents and workflows.
  related-projects:
    - Coda is the former product name and direct predecessor of Superhuman Docs.
    - >
      Grammarly is part of the same Superhuman suite and has an officially documented
      writing-assistance integration inside Docs.
    - >
      The official Slack integration provides rich link previews, sharing controls,
      notifications, and the ability to create Docs table rows from Slack messages.
  sources:
    - https://apple.coda.io/blog/about-coda/grammarly-acquires-coda
    - https://coda.io/product/whats-new
    - >
      https://help.superhuman.com/hc/en-us/articles/46210093285773-What-s-changing-Coda-becomes-Superhuman-Docs
    - https://help.superhuman.com/hc/en-us/articles/46875595711117-Superhuman-Docs-desktop-app
    - https://superhuman.com/company/about
  summary:
    - >
      Superhuman Docs is the successor to Coda, combining collaborative documents with
      structured tables, formulas, automations, integrations, project-management
      workflows, knowledge hubs, and embedded AI.
  timeline:
    - '2014: Coda created its first table'
    - '2015: Added connected views and formulas'
    - '2016: Introduced the document canvas'
    - '2019: Coda 1.0 launched'
    - '2023: Coda expanded its business platform with integrated AI'
    - '2025: Grammarly acquired Coda as part of the unified Superhuman company'
    - '2026-07-08: Coda became Superhuman Docs and launched its new macOS client'
  usage:
    - >
      Teams use Docs to write collaboratively, maintain project trackers and knowledge
      hubs, connect external data through Packs, build automations, and create
      interactive workflows from text, tables, formulas, and buttons.
    - >
      The macOS client offers near-identical functionality to the web application with
      tabbed documents, multiple signed-in accounts, starred-document access, and
      support for Docs AI.
