history:
  adoption-history:
    - >
      The official README documents installation through Cargo, Homebrew, Debian/Ubuntu
      as rust-doxx, Arch Linux, Nix, NetBSD, Conda-Forge, prebuilt GitHub release
      binaries, and a planned Scoop bucket. That unusually broad package-manager
      footprint came very early in the project's life.
  package-nerd-significance:
    - >
      doxx matters to package nerds as a fresh example of Rust terminal tooling reaching
      many ecosystems quickly: a desktop-office format becomes a small CLI, with
      binaries and distro packages turning a GUI-heavy workflow into something
      scriptable.
  project-history:
    - >
      The GitHub repository was created in August 2025. Its README describes a
      terminal-native .docx viewer with interactive navigation, formatting, table
      rendering, search, image support for capable terminals, and exports to Markdown,
      CSV, JSON, plain text, and ANSI-colored text.
    - >
      The public release history listed by GitHub starts with v0.1.1 in August 2025 and
      continues through v0.1.4 in May 2026. The project is young, so its history is
      mostly the rapid packaging and feature-growth phase of a new terminal utility.
  related-projects:
    - >
      doxx sits near terminal document viewers, Rust TUIs, and Office-document
      conversion tools. Its README specifically frames it around .docx files and
      terminal workflows rather than as a general office suite.
  sources:
    - >
      https://github.com/bgreenwell/doxx#readme - official README for purpose, features,
      usage, and install channels.
    - >
      https://api.github.com/repos/bgreenwell/doxx - official GitHub repository metadata
      for creation date, description, homepage, and topics.
    - >
      https://api.github.com/repos/bgreenwell/doxx/releases?per_page=100 - official
      GitHub release metadata.
  summary:
    - >
      doxx is a Rust command-line viewer for Microsoft Word .docx files, aimed at people
      who want to inspect, search, and export documents without leaving a terminal.
  timeline:
    - '2025: GitHub repository created for bgreenwell/doxx.'
    - '2025: v0.1.1 published as the earliest GitHub release listed by the repository.'
    - >
      2026: v0.1.4 published, with the README documenting Homebrew, Debian/Ubuntu, Arch,
      Nix, NetBSD, Conda-Forge, and prebuilt binary install paths.
  usage:
    - >
      Users run doxx on a .docx file to view it in the terminal, search text, start in
      outline mode, render colors and supported terminal images, or export document
      contents into text-oriented formats for scripts and pipes.
