history:
  adoption-history:
    - >
      RIG became a long-lived package-manager utility because it is tiny, has no service
      dependency, and solves a common testing and privacy-adjacent command-line need.
      Debian continues to package it as a misc utility, and Homebrew ships version 1.11
      for macOS and Linux.
  package-nerd-significance:
    - >
      Package maintainers keep RIG around as an example of the old Unix single-purpose
      data generator: a compiled CLI, a handful of text data files, and a manpage. It is
      also a useful package-name collision case, since unrelated modern projects use
      similar names while the original RIG package remains tied to the SourceForge
      random-identity generator.
  project-history:
    - >
      The upstream project describes RIG as Ian Turner's GPL replacement for an older
      closed-source MS-DOS program named fake. The manpage records the first Unix
      version as written from scratch in 1999, with release 1.00 following on January
      27, 2000.
    - >
      RIG 1.10 added the modern option shape, multiple-identity output, male and female
      name selection, and a names list based on U.S. Census data. Version 1.11, released
      April 23, 2006, is still the upstream version published by the official site.
  related-projects:
    - >
      RIG was written as a replacement for the earlier MS-DOS fake program. Its niche
      overlaps with later fake-data generators such as Faker, but RIG remains a much
      smaller command-line-only utility.
  sources:
    - https://downloads.sourceforge.net/project/rig/rig/1.11/rig-1.11.tar.gz
    - https://formulae.brew.sh/formula/rig
    - https://manpages.ubuntu.com/manpages/resolute/man6/rig.6.html
    - https://packages.debian.org/sid/rig
    - https://rig.sourceforge.net/
    - https://sourceforge.net/projects/rig/
  summary:
    - >
      RIG, the Random Identity Generator, is a small command-line utility for generating
      fake but geographically consistent U.S.-style names, addresses, ZIP codes, area
      codes, and phone-number placeholders.
  timeline:
    - '1999: First Unix version written from scratch.'
    - '2000: RIG 1.00 initial release.'
    - '2001: RIG 1.04 cleaned up the makefile and manpage.'
    - '2002: RIG 1.10 added multiple output and male/female selection options.'
    - '2006: RIG 1.11 released with portability and option fixes.'
    - '2026: Debian and Homebrew still package RIG 1.11.'
  usage:
    - >
      Users run `rig` to print one identity, `rig -c num` to print several, `rig -f` or
      `rig -m` to limit names by gender, and `rig -d datadir` to point at alternate data
      files. The documented default data files are the locdata, street, first-name,
      male-name, and last-name index files installed under the package data directory.
