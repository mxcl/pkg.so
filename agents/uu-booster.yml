  summary:
    - >
      NetEase UU Booster is a game-focused network accelerator intended to reduce
      latency, packet loss, disconnections, and routing instability for online play.
  timeline:
    - '2012: NetEase announced the UU online-game accelerator.'
    - >
      Later development: UU expanded from its original PC service to macOS, mobile,
      console, handheld, and hardware-based acceleration.
  usage:
    - >
      Players install the client, sign in when required, select a game or service, and
      start an acceleration route before playing. The client uses NetEase-operated
      network paths and routing technology to improve stability and latency, including
      for players connecting between overseas locations and Chinese game services.
