history:
  adoption-history:
    - >
      UU expanded beyond its original Windows game accelerator into a broader product
      family serving macOS, mobile devices, consoles, handhelds, and dedicated
      acceleration hardware. Its official materials present it as a way to improve
      access to both domestic and overseas game services.
    - >
      The macOS client is distributed directly by NetEase and through Homebrew Cask,
      making the native application installable alongside other Mac gaming utilities.
  package-nerd-significance:
    - >
      UU Booster is notable in package-manager culture as a proprietary, regionally
      focused networking utility whose value lies in its vendor-operated relay and
      routing infrastructure rather than locally inspectable source code. The cask
      packages the client, while acceleration routes and service policy remain
      controlled by NetEase.
  project-history:
    - >
      NetEase announced the UU game accelerator in 2012 as a lightweight service
      intended to reduce latency and improve connection stability for online games. It
      was initially presented as requiring neither installation nor account
      registration.
    - >
      The product later evolved into a multi-platform game-network service with Windows
      and macOS clients, mobile and console support, overseas-to-China acceleration,
      cloud-save features, and companion hardware.
  related-projects:
