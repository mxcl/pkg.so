id: brew:hstr
display-name: HSTR
repo: null
docs:
  - https://github.com/dvorka-oss/hstr
  - https://github.com/dvorka-oss/hstr/blob/master/CONFIGURATION.md
  - https://github.com/dvorka-oss/hstr/blob/master/TIPS.md
config-file-location:
  unix:
    - ~/.bashrc
    - ~/.zshrc
    - ~/.hstr_blacklist
credentials-file-location: null
history:
  adoption-history:
    - >
      The README lists installation documentation for many distributions and package
      systems, including Ubuntu, Debian, Fedora, CentOS, openSUSE, Gentoo, Alpine, Arch,
      FreeBSD, Slackware, Void, Haiku, macOS, Nix, Guix, and others. The input metadata
      also records packages in Alpine, Homebrew, Debian, Fedora, MacPorts, Nix, and
      Ubuntu.
    - >
      The project page collects coverage from Linux Magazine, UbuntuGeek, DebianAdmin,
      Tuxdiary, Softpedia, OSTechNix, videos, and community posts, which fits its role
      as a discoverable shell workflow enhancer.
  package-nerd-significance:
    - >
      HSTR is significant in package-manager culture because it is a shell-history tool
      that crosses the boundary between a packaged executable and user dotfile
      integration. A package can install the binary, but value comes when the user wires
      it into readline or zsh keybindings.
    - >
      It is also one of the better-known examples in the family of TUI shell-history
      searchers, alongside tools such as fzf-based history widgets and newer history
      managers.
  project-history:
    - >
      The README expands HSTR as HiSToRy and presents it as a more efficient alternative
      to Ctrl-r for shell history completion. It combines search, navigation, deletion
      of sensitive or obsolete commands, and bookmarking of favorite commands.
    - >
      The project evolved into a broadly packaged shell productivity tool, with
      documentation for bash and zsh bindings, aliases, environment-driven
      configuration, blacklist behavior, color and layout settings, and shell-history
      tuning.
  related-projects:
    - >
      Related projects include bash, zsh, readline, fzf history bindings, shell history
      managers, and terminal bookmark or snippet workflows.
  sources:
    - https://github.com/dvorka-oss/hstr
    - https://github.com/dvorka-oss/hstr/blob/master/CONFIGURATION.md
    - https://github.com/dvorka-oss/hstr/blob/master/TIPS.md
    - https://github.com/dvorka-oss/hstr/releases
  summary:
    - >
      HSTR is a terminal user-interface for viewing, searching, curating, and reusing
      bash and zsh command history, with the hh command as a common shortcut.
  timeline:
    - '0.2: Early upstream tag appears in the repository.'
    - '1.x: The project accumulated a long sequence of tagged releases.'
    - '2.x: Later tags continued the shell-history TUI series.'
    - '3.x: The v3.2 tag appears after the 3.0 and 3.1 tags.'
  usage:
    - >
      Users typically add generated bash or zsh configuration to ~/.bashrc or ~/.zshrc,
      bind HSTR to a key such as Ctrl-r, and optionally define alias hh=hstr.
    - >
      Configuration is intentionally shell-native: HSTR reads HISTFILE, HSTR_PROMPT,
      HSTR_IS_SUBSHELL, and HSTR_CONFIG, with options for color, prompt placement,
      matching mode, duplicate handling, favorites, and blacklists.
related-packages:
  - id: brew:atuin
    reason: >
      Choose Atuin when you want database-backed, context-rich history with optional
      encrypted synchronization across machines; choose HSTR for a lighter interface
      over existing Bash or Zsh history files.
    rel: alternative
    sources:
      - https://github.com/dvorka-oss/hstr#readme
      - https://docs.atuin.sh/
  - id: brew:fzf
    reason: >
      Choose fzf when you want a general-purpose fuzzy selector whose shell integration
      also searches history; choose HSTR for dedicated history deletion, favorites,
      ranking and blacklist behavior.
    rel: alternative
    sources:
      - https://github.com/dvorka-oss/hstr#readme
      - https://junegunn.github.io/fzf/shell-integration/
