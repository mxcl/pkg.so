config-file-location:
  macos:
    - ~/Library/Preferences/com.QotoQot.Qbserve.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Qbserve is a Mac-specific commercial application from the independent QotoQot
      team. Its official material emphasizes privacy-conscious local storage rather than
      a cloud-account-centered tracking service.
  package-nerd-significance:
    - >
      Qbserve is proprietary rather than an open-source utility, so package-manager
      interest centers on reproducible installation of the official Mac application and
      preserving its local database and preferences during migrations.
    - >
      Its documented SQLite data store and standard macOS property-list preferences make
      backup and machine-migration behavior unusually transparent for a desktop
      productivity application.
  project-history:
    - >
      Qbserve was created by QotoQot, an independent team that says it has built
      software since 2009. Qbserve is implemented as a native Objective-C and AppKit
      application.
    - >
      The product combines automatic activity observation through the macOS
      accessibility API with productivity classification, project-hour tracking,
      timesheets, and invoicing. Its official support material states that tracked
      history remains on the user's Mac.
  related-projects:
    - >
      Qbserve uses open-source components including FMDB, Core Plot, DateTools,
      CocoaLumberjack, GCDWebServer, and MASShortcut, while the application itself is
      proprietary.
    - RescueTime is discussed by QotoQot as a comparable time-tracking service.
  sources:
    - https://qotoqot.com/about/
    - https://qotoqot.com/qbserve/articles/tracking-work-hours/
    - https://qotoqot.com/qbserve/support/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Qbserve is a native macOS automatic time tracker from QotoQot, oriented toward
      productivity feedback, project accounting, timesheets, and invoices.
  timeline:
    - '2009: QotoQot says its independent team began building software.'
    - '2014: The QotoQot/Qbserve site copyright history begins.'
  usage:
    - >
      Qbserve watches the frontmost macOS application through accessibility APIs and
      classifies activity locally. Users can create matching rules from window titles,
      web addresses, file paths, and chats to assign time to projects.
    - >
      Tracked history is stored in ~/Library/Application
      Support/Qbserve/UserDatabase.sqlite. Preferences can be migrated separately using
      ~/Library/Preferences/com.QotoQot.Qbserve.plist, and the backup destination can be
      changed in the application.
