credentials-file-location: null
history:
  adoption-history:
    - >
      Gluon's adoption belongs to the embeddable-language niche rather than mainstream
      application deployment. Repository metadata shows several thousand stars, and the
      project is packaged by Homebrew, but its practical audience is Rust developers
      evaluating a statically typed scripting layer with lower embedding boilerplate
      than writing an entire domain language from scratch.
    - >
      Its package-manager presence gives experimenters a quick way to run programs and
      the REPL, while the Rust crates make the language more relevant as a library than
      as a standalone general-purpose language.
  package-nerd-significance:
    - >
      Gluon is notable for package users because it represents a specific Rust ecosystem
      idea: embed a typed functional language rather than a dynamic scripting language.
      Installing the package exposes the REPL, while the deeper value remains in the
      crates and documentation for host-application integration.
  project-history:
    - >
      The public `gluon-lang/gluon` repository was created in 2015, during the early
      expansion of Rust-based language experiments. The README presents the project's
      central design goal: combine static typing, type inference, Unicode support,
      garbage-collected execution, and simple Rust interoperation for application
      scripting.
    - >
      The project evolved as both a language implementation and an embeddable Rust
      library. Its documentation includes a book, Rust API documentation,
      standard-library documentation, examples, an online try page, release downloads,
      and Cargo installation of the `gluon_repl` crate.
  related-projects:
    - Rust is the implementation language and host ecosystem for Gluon embedding.
    - `gluon_repl` provides the command-line REPL path documented by the project.
    - The online try_gluon project provides browser-based experimentation.
  sources:
    - https://api.github.com/repos/gluon-lang/gluon
    - https://github.com/gluon-lang/gluon
    - https://gluon-lang.org/doc/crates_io/book/index.html
    - https://raw.githubusercontent.com/gluon-lang/gluon/master/README.md
  summary:
    - >
      Gluon is a small, statically typed, type-inferred functional language written in
      Rust and designed for embedding in applications. Package users mainly encounter it
      through its command-line REPL and through Rust crates that embed the language
      runtime.
  timeline:
    - '2015: Public GitHub repository created.'
    - >
      2016: The `gluon-lang` GitHub organization was created after the repository's
      initial public life.
    - >
      Later development: Documentation expanded into a book, Rust API docs,
      standard-library docs, and an online try page.
  usage:
    - >
      Practitioners use Gluon to run scripts, open an interactive REPL with the `-i`
      flag, or embed the VM in Rust applications. The README emphasizes direct passing
      of Rust-defined functions into Gluon, separate heaps per executing thread,
      thread-safe execution guarantees from Rust, and parser-combinator examples in the
      standard library.
    - >
      Common exploratory uses include application scripting, typed configuration-like
      logic, language experimentation, and teaching examples that benefit from ML-style
      syntax, type inference, and Rust-hosted embedding.
related-packages:
  - id: brew:rhai
    reason: >
      Choose Rhai when a Rust application benefits from familiar JavaScript-like dynamic
      typing or no-std support; choose Gluon for an ML-style functional language with
      static type inference.
    rel: alternative
    sources:
      - https://github.com/gluon-lang/gluon
      - https://rhai.rs/
      - https://github.com/rhaiscript/rhai
