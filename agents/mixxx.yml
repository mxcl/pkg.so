id: cask:mixxx
display-name: Mixxx
repo: https://github.com/mixxxdj/mixxx
docs:
  - https://manual.mixxx.org/
config-file-location:
  linux:
    - ~/.mixxx/mixxx.cfg
    - ~/.var/app/org.mixxx.Mixxx/.mixxx/mixxx.cfg
  macos:
    - ~/Library/Containers/org.mixxx.mixxx/Data/Library/Application Support/Mixxx/mixxx.cfg
  windows:
    - '%LOCALAPPDATA%\Mixxx\mixxx.cfg'
credentials-file-location: null
history:
  adoption-history:
    - >
      After Mixxx was released as open source, contributors expanded it across
      GNU/Linux, Windows, and macOS. The project reports participation in Google Summer
      of Code in 2007, 2008, and 2010–2014 and more than 100 developers and artists
      contributing by Mixxx 2.0.
    - >
      Mixxx is distributed through native downloads and package ecosystems, including
      the Homebrew cask represented by this record. Its open controller-mapping and skin
      systems have encouraged use with a broad range of DJ hardware.
  package-nerd-significance:
    - >
      Mixxx is a prominent example of a substantial, cross-platform creative application
      distributed through open-source package ecosystems. It combines a C++/Qt desktop
      application with hardware mappings, skins, an SQLite music library, and
      user-editable configuration.
    - >
      For reproducible workstation setups, its documented settings directory is
      especially valuable: it contains preferences, controller mappings, effects,
      analysis data, playlists, crates, and the library database, and can be copied when
      migrating machines.
  project-history:
    - >
      Mixxx originated in 2002 in Tue Haste Andersen's PhD work on new interfaces for
      DJing and was subsequently released as open source.
    - >
      In 2006, a development team led by Adam Davison and Albert Santoni reorganized the
      project to support growth in the codebase and contributor community. RJ Ryan
      became lead developer in 2011.
  related-projects:
    - Mixxx Manual
    - libkeyfinder
    - PortMidi
    - Qt
    - SQLite
  sources:
    - https://github.com/mixxxdj/mixxx
    - https://manual.mixxx.org/
    - https://manual.mixxx.org/2.6/en/chapters/appendix/settings_directory
    - https://mixxx.org/discover/
    - source_facts.package-manager
  summary:
    - >
      Mixxx is a free, open-source DJ application for live mixing on GNU/Linux, Windows,
      and macOS.
  timeline:
    - "2002: Mixxx originated as part of Tue Haste Andersen's PhD research"
    - '2006: A new team reorganized development for project and community growth'
    - '2007–2014: Mixxx participated in multiple Google Summer of Code programs'
    - '2011: RJ Ryan became lead developer'
    - 'Mixxx 2.0: The project reported contributions from more than 100 developers and artists'
  usage:
    - >
      DJs use Mixxx to organize a music library, analyze tracks, control decks and
      effects, beatmatch, record mixes, broadcast, run Auto DJ, and operate supported
      MIDI or HID controllers.
tags:
  - audio
  - beatmatching
