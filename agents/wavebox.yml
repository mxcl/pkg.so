history:
  adoption-history:
    - >
      Wavebox is distributed as a desktop application for macOS, Windows, and Linux and
      is also available to macOS package users through Homebrew Cask.
    - >
      Its adoption niche is users and teams that operate many web applications,
      identities, dashboards, and browser tabs throughout the workday.
  package-nerd-significance:
    - >
      Wavebox is notable as a specialized Chromium-based productivity browser rather
      than a conventional general-purpose browser. It packages webmail, SaaS
      applications, account isolation, dashboards, and Chrome extensions into a unified
      workspace.
    - >
      The transition away from Electron to a native Chromium build illustrates the
      maintenance and performance tradeoffs faced by desktop applications that package
      web services.
  project-history:
    - >
      Wavebox began with an Electron-based application originally known as WMail. The
      team later expanded the product beyond email into a broader workspace for web
      applications.
    - >
      After encountering Electron-related technical limitations, the project announced
      in November 2019 that Wavebox would move to a native Chromium foundation.
  related-projects:
    - WMail was the original name and email-focused predecessor of Wavebox.
    - Chromium supplies the browser foundation used by current Wavebox releases.
    - Chrome Web Store extensions can be installed within Wavebox.
  sources:
    - https://blog.wavebox.io/blog/station-desktop-1-the-technical-back-story/
    - https://kb.wavebox.io/
    - https://kb.wavebox.io/kb/how-do-i-install-wavebox-using-a-share-code/
    - https://wavebox.io/
  summary:
    - >
      Wavebox is a Chromium-based productivity browser designed to organize web
      applications, accounts, dashboards, and browser workflows in one desktop
      environment.
  timeline:
    - '2010s: The product originated as the Electron-based WMail application.'
    - 'November 2019: Wavebox announced a move from Electron to a native Chromium build.'
    - '2020: Wavebox publicly discussed the completed architectural transition to Chromium.'
  usage:
    - >
      Users organize webmail, messaging, productivity, and other SaaS applications into
      groups and isolated account workflows, while retaining browser features such as
      tabs and Chrome extensions.
    - >
      Teams can distribute prepared Wavebox layouts with share codes containing groups,
      applications, tabs, and optionally passwords. Application logins and stored web
      credentials are managed through the browser experience; official documentation
      does not identify a standalone credentials file.
