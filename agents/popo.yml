history:
  adoption-history:
    - >
      NetEase reported 25 million registered POPO accounts by the end of 2004 after
      introducing frequent-user incentive programs. By the end of 2005, it reported more
      than 42 million registered accounts and over 350,000 peak concurrent users.
    - >
      The product later evolved from a consumer-oriented community messenger toward a
      multi-platform workplace communications service. Its current official site
      emphasizes synchronized messages, voice meetings, organizational directories,
      tasks, and access to internal business services.
  package-nerd-significance:
    - >
      POPO illustrates the early-2000s generation of Chinese portal-company instant
      messengers that combined desktop chat with SMS, media, community, and gaming
      ecosystems.
    - >
      For package maintainers, the macOS cask represents one client in a broader
      proprietary, account-backed service spanning macOS, Windows, Linux, iOS, and
      Android. There is no public application source repository or documented portable
      configuration format.
  project-history:
    - >
      NetEase was publicly listing POPO as an instant-messaging product by the first
      quarter of 2003. Later that year it promoted POPO as a community-oriented
      communications platform with PC-to-PC and PC-to-mobile messaging.
    - >
      By 2005, POPO supported individual and group messaging, SMS, video and audio chat,
      file transfer, online radio presets, and an MP3 player plug-in. NetEase also
      integrated POPO with its casual-game platform.
    - >
      The modern product is branded NetEase POPO and focuses heavily on workplace
      communication, including multi-device message synchronization, meetings,
      company-directory search, task handling, and enterprise service entry points.
  related-projects:
    - >
      POPO has historically been connected to NetEase's portal, email, mobile messaging,
      and casual-game services. The current client exposes NetEase workplace services
      including OA, KM, and UData.
  sources:
    - >
      https://ir.netease.com/node/8656 — official 2003 NetEase release listing POPO
      among its communication products
    - >
      https://ir.netease.com/static-files/21e75ef7-4f47-45d1-9f44-360fa6e28778 —
      official 2005 adoption and feature figures
    - >
      https://ir.netease.com/static-files/40874514-737f-4641-9a61-f0f679f6cdea —
      official 2004 adoption figure
    - >
      https://ir.netease.com/static-files/550d8fbb-9422-41aa-8afd-9d647c0a4b01 —
      official account of POPO promotion and messaging capabilities in 2003
    - https://popo.netease.com/ — current official product overview
  summary:
    - >
      NetEase POPO is a proprietary multi-platform instant-messaging and workplace
      collaboration service. Its current features include synchronized messaging, voice
      meetings, tasks, organizational search, and access to NetEase business services.
  timeline:
    - '2003: NetEase publicly listed and promoted POPO as an instant-messaging service'
    - '2004: NetEase reported 25 million registered POPO users'
    - >
      2005: NetEase reported more than 42 million registered accounts and over 350,000
      peak concurrent users
    - "2020s: POPO's official positioning emphasizes cross-platform workplace collaboration"
  usage:
    - >
      Users sign into the POPO service to exchange messages, participate in voice
      meetings, locate colleagues through an organizational directory, manage tasks, and
      open connected workplace services.
    - >
      The service supports simultaneous use across multiple devices and a synchronized
      message window. Its official privacy policy documents server-side handling of
      account, interaction, device, and log information.
