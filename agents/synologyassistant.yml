history:
  adoption-history:
    - >
      Synology has long documented Assistant as a desktop route for discovering and
      provisioning DiskStation systems. Current documentation presents it alongside the
      browser-based Web Assistant, while hardware guides continue to reference it for
      local-network discovery.
  package-nerd-significance:
    - >
      Synology Assistant represents the vendor-utility class of package: a small desktop
      discovery and bootstrap tool that remains useful before a NAS has a known address
      or a working DSM installation.
  project-history:
    - >
      Synology Assistant has accompanied Synology's NAS ecosystem for many hardware
      generations. Official guides from at least the early 2010s document it as a way to
      locate DiskStations and initiate DSM installation; current Knowledge Center
      material retains those roles.
  related-projects:
    - >
      DiskStation Manager is the NAS operating system that Synology Assistant can help
      install.
    - >
      Web Assistant at finds.synology.com provides a browser-based alternative for
      device discovery.
  sources:
    - >
      https://global.download.synology.com/download/Document/Hardware/HIG/DiskStation/13-year/DS213%2B/enu/Syno_QIG_2bay3_enu.pdf
    - https://kb.synology.com/DSM/tutorial/How_to_install_DSM
    - https://kb.synology.com/DSM/tutorial/Unable_to_Locate_NAS
    - https://www.synology.com/en-global/support/download
  summary:
    - >
      Synology Assistant is Synology's desktop utility for finding Synology storage
      systems on a local network and assisting with initial DSM setup.
  timeline:
    - '2013: Synology hardware documentation described Assistant-based DSM installation.'
    - >
      2026: Synology's current Knowledge Center continued to document Assistant
      alongside Web Assistant for device discovery.
  usage:
    - >
      Run the utility on a computer connected to the same local network as the storage
      system. It scans for Synology devices, shows their installation state, and can
      hand off to the DSM installation and setup workflow.
