id: brew:minisign
display-name: Minisign
repo: null
docs:
  - https://jedisct1.github.io/minisign
config-file-location: null
credentials-file-location:
  unix:
    - $MINISIGN_CONFIG_DIR/minisign.key
    - ~/.minisign/minisign.key
history:
  project-history:
    - >
      Operationally, minisign creates a key pair, signs one or more files into .minisig
      signature files, and verifies a file using either a public-key file or a public
      key supplied directly on the command line. A notable part of its format is the
      trusted comment, which can bind metadata such as filenames, resource identifiers,
      timestamps, or version numbers to the signature and helps prevent downgrade-style
      mistakes. Its documented signature format moved toward pre-hashed Ed25519
      signatures using Blake2b-512, while retaining awareness of a legacy non-prehashed
      format.
  sources:
    - https://formulae.brew.sh/formula/minisign
    - https://jedisct1.github.io/minisign/
  summary:
    - >
      Minisign is Frank Denis's portable file-signing and signature-verification tool.
      It follows the same broad idea as OpenBSD signify: keep release signing small,
      scriptable, and based on public-key signatures rather than a large certificate or
      web-of-trust system. The project page describes it as lightweight and built around
      Ed25519 keys; Homebrew summarizes the package as a tool to sign files and verify
      signatures that works with OpenBSD signify.
  usage:
    - >
      Minisign's ecosystem role is release-integrity plumbing: projects can publish a
      small public key and detached signatures without adopting a heavier
      package-signing infrastructure. Its packaging footprint in the input record spans
      Homebrew, Alpine, Debian, Fedora, MacPorts, Nix, Arch, Scoop, Ubuntu, WinGet, and
      openSUSE, which fits that role as a small security utility expected to be present
      across many operating systems.
related-packages:
  - id: brew:minizign
    reason: >
      Choose minizign for the maintainer-recommended Zig implementation, zero-dependency
      cross-compilation, and newer feature development while retaining the Minisign
      signing workflow.
    rel: alternative
    sources:
      - https://github.com/jedisct1/minisign#readme
      - https://github.com/jedisct1/zig-minisign#readme
  - id: brew:signify-osx
    reason: >
      On macOS, signify-osx provides an audit-oriented port of OpenBSD signify; choose
      it for direct signify behavior, while Minisign adds its signed trusted-comment
      convention and can produce signatures that signify verifies.
    rel: alternative
    sources:
      - https://jedisct1.github.io/minisign/
      - https://github.com/jpouellet/signify-osx#readme
      - https://man.openbsd.org/signify.1
