history:
  adoption-history:
    - >
      OmniGraffle became a durable native diagramming application in the Mac ecosystem.
      The Omni Group expanded it to iPad in 2010 and iPhone in 2015; current editions
      share projects, stencils, and JavaScript automation across Mac, iPad, and iPhone.
  package-nerd-significance:
    - >
      OmniGraffle is significant to Mac package users as a long-running native
      diagramming and vector-design application with scriptable workflows, reusable
      stencils, and established document formats.
  project-history:
    - >
      The Omni Group released OmniGraffle 1.0 on May 7, 2001. It grew from a Mac OS X
      diagramming tool into software for diagrams, rapid prototypes, wireframes, and
      precise vector graphics.
  related-projects:
    - >
      OmniGraffle is part of The Omni Group's productivity suite with OmniOutliner,
      OmniFocus, and OmniPlan. Stenciltown is The Omni Group's associated
      stencil-sharing service.
  sources:
    - >
      Official birthday history:
      https://www.omnigroup.com/blog/entry/Happy_birthday_OmniGraffle
    - >
      Official iPad launch record:
      https://www.omnigroup.com/blog/omnigraphsketcher_omnigraffle_for_ipad_now_available
    - >
      Official iPhone release record:
      https://www.omnigroup.com/blog/omnigraffle-for-ios-now-available-on-iphone-and-ipad
    - 'Official product page: https://www.omnigroup.com/omnigraffle/'
    - 'Official reference manual: https://support.omnigroup.com/documentation/omnigraffle/mac/'
  summary:
    - >
      OmniGraffle is The Omni Group's visual communication application for diagrams,
      rapid prototypes, wireframes, and vector graphics.
  timeline:
    - '2001: OmniGraffle 1.0 was released for Mac OS X.'
    - '2010: OmniGraffle launched on iPad.'
    - '2015: OmniGraffle became a universal iPad and iPhone application.'
    - '2016: OmniGraffle 7 was released for Mac.'
  usage:
    - >
      Users construct diagrams from shapes, lines, labels, layers, canvases, templates,
      and reusable stencils. The application also supports wireframing, vector design,
      imports and exports, presentation workflows, and automation.
