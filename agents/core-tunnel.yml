history:
  adoption-history:
    - >
      Core Tunnel reached its initial public release in April 2018 and subsequently
      became available through the Mac App Store without giving up the
      direct-distribution edition needed for less restricted SSH integration.
    - >
      The application continued alongside Core Shell, gaining shared profiles, import
      and export, synchronization, AppleScript automation, Apple-silicon support, and
      updates to its OpenSSH base.
  package-nerd-significance:
    - >
      Core Tunnel packages OpenSSH tunneling behavior in a native macOS manager while
      retaining access to advanced directives, certificates, agent forwarding, proxy
      jumps, and several forwarding modes. It is especially relevant where repeatable
      graphical tunnel profiles are preferred to manually maintained shell commands.
    - >
      Its sandboxed and direct-download editions expose an instructive macOS packaging
      distinction: containerized configuration paths and permissions differ from access
      to the user's conventional SSH configuration.
  project-history:
    - >
      Codinn developed Core Tunnel as a replacement for its earlier SSH Tunnel
      application. A closed beta appeared in February 2018, followed by the 1.0 public
      release in April 2018.
    - >
      The redesign used OpenSSH as its underlying implementation and added a
      profile-oriented interface, advanced option editing, automatic reconnection,
      tagging, Keychain integration, and import/export facilities.
  related-projects:
    - >
      Core Shell, Codinn's related SSH client, can share hosts, imported identities, and
      synchronized profiles with Core Tunnel.
    - >
      SSH Tunnel was Codinn's preceding tunnel-management application and is supported
      as an import source.
  sources:
    - 'Official 1.0 announcement: https://community.codinn.com/t/core-tunnel-1-0/347'
    - >
      Official SSH configuration guidance:
      https://community.codinn.com/t/use-system-default-ssh-config-and-known-hosts-configuration/742
    - 'Official how-to index: https://community.codinn.com/t/howtos-core-tunnel/346'
    - 'Official product page: https://codinn.com/tunnel/'
    - 'Official release plan: https://community.codinn.com/t/core-tunnel-1-0-release-plan/317'
    - >
      Official storage guidance:
      https://community.codinn.com/t/where-are-my-profiles-and-imported-identities-stored/3038/
  summary:
    - >
      Core Tunnel is a native macOS manager for OpenSSH-compatible local, remote, and
      dynamic port-forwarding profiles.
  timeline:
    - 'February 2018: First closed beta release.'
    - 'April 2018: Core Tunnel 1.0 became the initial public release.'
    - >
      June 2018: The Mac App Store edition reached functional parity with the original
      direct edition.
    - '2021: Core Tunnel 3 added Apple-silicon support.'
  usage:
    - >
      Users create persistent SSH tunnel profiles, select local, remote, or dynamic
      forwarding, and let the application monitor and reconnect sessions from either its
      main window or menu-bar interface.
    - >
      Advanced workflows include ProxyJump, certificates, agent forwarding,
      Unix-domain-socket forwarding, JSON-based profile transfer, shared Core Shell
      hosts, synchronization, and AppleScript automation.
    - >
      Passphrases can be stored through macOS Keychain. Imported identity files are kept
      in the shared Core Shell/Core Tunnel group container.
