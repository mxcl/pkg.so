credentials-file-location: null
history:
  adoption-history:
    - >
      LavinMQ's adoption path is tied to CloudAMQP's managed messaging background and to
      packaging for ordinary service deployment. The official README documents
      Debian/Ubuntu, Fedora, Arch Linux AUR, Homebrew, Docker, Docker Compose, Windows
      via WSL, and source builds, which places it in the same operational lane as other
      infrastructure daemons distributed through both OS packages and containers.
  package-nerd-significance:
    - >
      For package nerds, LavinMQ is notable because it turns a message broker into a
      small Crystal-built formula with service-style configuration rather than a
      sprawling JVM-era broker install. Its Homebrew formula is especially useful for
      local AMQP/MQTT development and for testing queue behavior without pulling in a
      heavier stack.
  project-history:
    - >
      The public GitHub repository was created on May 3, 2017. Early public release
      artifacts include v0.3.2 on August 23, 2018, followed by a long pre-1.0 series
      before v1.0.0 was published on March 31, 2023. The project reached v2.9.1 on July
      1, 2026.
  related-projects:
    - >
      RabbitMQ is the obvious protocol-adjacent reference point for AMQP 0-9-1
      workflows. CloudAMQP also maintains a LavinMQ Kubernetes operator and LavinMQ
      benchmark repository, both linked from the official README.
  sources:
    - https://api.github.com/repos/cloudamqp/lavinmq
    - https://api.github.com/repos/cloudamqp/lavinmq/releases
    - https://github.com/cloudamqp/lavinmq
    - https://github.com/cloudamqp/lavinmq-benchmark
    - https://github.com/cloudamqp/lavinmq-operator
    - https://lavinmq.com/documentation
  summary:
    - >
      LavinMQ is an Apache-2.0 message broker from CloudAMQP, written in Crystal and
      aimed at AMQP 0-9-1 and MQTT workloads. It belongs to the practical
      RabbitMQ-adjacent world of queue servers, but its package-manager appeal is that
      it packages a comparatively small, fast broker with a CLI and benchmarking tool.
  timeline:
    - '2017: Public GitHub repository created'
    - '2018: v0.3.2 release published'
    - '2023: v1.0.0 release published'
    - '2026: v2.9.1 release published'
  usage:
    - >
      The server runs as `lavinmq` with a data directory, while `lavinmqctl` talks to
      its control socket and `lavinmqperf` supports benchmarking. Official docs and
      README material emphasize AMQP client compatibility, MQTT support, Docker
      deployment, and minimal setup.
related-packages:
  - id: brew:rabbitmq
    reason: >
      Choose RabbitMQ for its mature Erlang-based broker ecosystem; choose LavinMQ when
      you want another AMQP 0-9-1 implementation that also documents MQTT support and a
      compact Crystal-based server.
    rel: alternative
    sources:
      - https://lavinmq.com/documentation/amqp-the-protocol
      - https://www.rabbitmq.com/docs
