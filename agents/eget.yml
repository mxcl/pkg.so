  tags-sources:
    - >
      source_facts.description describes installing prebuilt binaries from GitHub;
      current_curation.tags marks it as CLI tooling.
category-confidence: high
category-path:
  - developer-tools
  - package-management
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
