id: brew:eget
display-name: eget
repo: null
docs:
  - https://github.com/zyedidia/eget#readme
config-file-location:
  unix:
    - ~/.eget.toml
    - $XDG_CONFIG_HOME/eget/eget.toml
    - ./eget.toml
    - $EGET_CONFIG
  windows:
    - '%USERPROFILE%\.eget.toml'
    - '%LOCALAPPDATA%\eget\eget.toml'
    - .\eget.toml
    - '%EGET_CONFIG%'
credentials-file-location:
  unix:
    - ~/.eget.toml
    - $XDG_CONFIG_HOME/eget/eget.toml
    - ./eget.toml
    - $EGET_CONFIG
  windows:
    - '%USERPROFILE%\.eget.toml'
    - '%LOCALAPPDATA%\eget\eget.toml'
    - .\eget.toml
    - '%EGET_CONFIG%'
history:
  adoption-history:
    - >
      eget's adoption pattern is package-manager-adjacent: it is itself packaged in
      Homebrew, Nix, Scoop, and winget, but its main value is installing other
      GitHub-release tools before or outside those package managers. The README even
      notes that maintainers with GitHub release binaries can list eget as a one-line
      install method.
  package-nerd-significance:
    - >
      eget is package-nerd bait because it automates the messy part of modern CLI
      distribution: release asset naming. It codifies common conventions around OS and
      architecture names, archive formats, checksums, and destination directories
      without trying to become a general package manager.
  project-history:
    - >
      The first public GitHub release was v0.1.0 in August 2021. The README describes a
      focused tool: provide a repository or URL, let eget inspect release assets, pick a
      matching binary for the current system, download it, and extract it.
    - >
      The v1.0.0 release in January 2022 added support for extracting multiple files and
      directories, making eget usable for projects distributed as archives rather than
      just one naked executable. The project later continued through the v1.3 series
      with cross-platform release assets.
  related-projects:
    - GitHub Releases are the primary upstream distribution surface that eget automates.
    - >
      zyedidia/micro appears in the README examples and is a natural companion project
      from the same author.
    - >
      Comparable single-binary install helpers include curl scripts, go install, and
      package-manager formulas, but eget focuses on release assets.
  sources:
    - https://github.com/zyedidia/eget#readme
    - https://github.com/zyedidia/eget/blob/master/DOCS.md
    - https://github.com/zyedidia/eget/releases
  summary:
    - >
      eget is Zachary Yedidia's small Go CLI for installing prebuilt binaries from
      GitHub releases. It occupies the practical space between curl scripts, manual
      release downloads, and full package-manager formulas.
  timeline:
    - '2021-08-18: v0.1.0 is published.'
    - '2021-08-25: v0.2.0 follows during early feature work.'
    - '2022-01-03: v1.0.0 adds multi-file and directory extraction.'
    - '2022-07-22: v1.2.0 is published.'
    - '2024-06-07: v1.3.4 is published.'
  usage:
    - >
      Users run commands such as `eget owner/repo --to /usr/local/bin`, optionally
      filtering assets, selecting tags, extracting a specific file, or using a GitHub
      token through environment variables or configuration. The README documents TOML
      configuration for global and per-repository defaults.
related-packages:
  - id: brew:gh
    reason: >
      GitHub CLI's gh release download command is an alternative when users want
      explicit release and asset selection as part of a broader authenticated GitHub
      workflow.
    rel: alternative
    sources:
      - https://github.com/zyedidia/eget#readme
      - https://cli.github.com/manual/gh_release_download
tags:
  - binary-installer
  - cli
  - developer-tools
  - github-releases
  - package-management
geiger:
