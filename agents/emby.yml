history:
  adoption-history:
    - >
      Media Browser initially attracted Windows Media Center users and contributors
      seeking a customizable interface for personal media collections. Its transition to
      Emby broadened the audience to users running a central server with clients on
      computers, phones, televisions, consoles, and streaming devices.
    - >
      The multi-device client ecosystem, automatic metadata, transcoding, and optional
      Premiere features positioned Emby among the established self-hosted personal-media
      platforms.
  package-nerd-significance:
    - >
      Emby represents the server-plus-client pattern common in home-lab media stacks: a
      separately managed server indexes and transcodes a private library while
      lightweight clients provide playback across devices.
    - >
      For package-manager users, this cask installs the macOS client rather than Emby
      Server, an important distinction when composing a reproducible media setup.
  project-history:
    - >
      Emby began as Media Browser, an open-source Windows Media Center plugin for
      browsing digital media collections.
    - >
      In 2014, Media Browser was renamed Emby as the project shifted toward a standalone
      media server capable of library management, metadata retrieval, transcoding, and
      multi-device streaming. The project moved from open-source development to a
      proprietary model in 2018.
  related-projects:
    - Media Browser
    - Emby Server
    - Emby Premiere
    - Emby apps
  sources:
    - https://docs.emby.media/
    - https://emby.media/community/blogs/entry/576-the-history-and-evolution-of-emby/
    - https://support.emby.media/support/articles/Home.html
  summary:
    - >
      Emby is the desktop client for a personal-media platform built around a central
      Emby Server and playback apps on many device classes.
  timeline:
    - >
      2014: Media Browser was rebranded as Emby and refocused around a standalone media
      server.
    - '2018: Emby moved from an open-source project to a proprietary model.'
    - "2024: Emby published an official retrospective covering the project's evolution."
  usage:
    - >
      Users connect the app to an Emby Server to browse and play personal video, music,
      photo, and live-TV libraries. Hosting and library administration belong to Emby
      Server; this package supplies a client player.
