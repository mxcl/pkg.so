history:
  adoption-history:
    - >
      WizNote has been distributed across desktop and mobile platforms and combines
      personal note management with the company's synchronized cloud backend.
    - >
      The official client repository invited community contributions and alternative
      backend support, giving the desktop client a place in open-source
      personal-knowledge-management culture even though the hosted service remained
      central to normal use.
  package-nerd-significance:
    - >
      WizNote is notable as a long-running, Qt-based, cross-platform note client whose
      official macOS and Linux client source was published under GPLv3 for personal use,
      with separate commercial terms for company use.
    - >
      Its mix of an open desktop client and a service-backed synchronization model
      illustrates a common packaging challenge: the application can be built and
      distributed independently, while much of its everyday value depends on an online
      account and backend.
  project-history:
    - >
      WizNote developed as a cloud-based note-taking and personal-knowledge-management
      system. The official WizQTClient repository contains the cross-platform macOS and
      Linux client implemented with Qt.
    - >
      The official repository records a tagged v2.0.64 release in 2013 and continued
      development through thousands of commits, build scripts, translations, and
      platform packaging support.
  related-projects:
    - 'WizNote cloud service: the synchronization backend used by the official client.'
    - 'WizNote Lite Mobile: an official WizTeam mobile-client project.'
  sources:
    - https://github.com/WizTeam/WizNoteLiteMobile
    - https://github.com/WizTeam/WizQTClient
    - https://www.wiz.cn/
  summary:
    - >
      WizNote is a cross-platform note-taking and personal-knowledge-management
      application with cloud synchronization and collaboration features.
  timeline:
    - '2013: The official WizQTClient repository publishes the v2.0.64 tagged release.'
    - >
      Later development: The Qt client gains build and packaging support for macOS,
      Linux, and Windows.
  usage:
    - >
      Users organize notes and attachments into synchronized personal or team knowledge
      collections, using folders, tags, search, editing, and sharing features.
    - >
      The packaged macOS application is the desktop client for the WizNote service; an
      account is normally used for cloud synchronization.
