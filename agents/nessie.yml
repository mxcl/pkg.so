    - >
      https://www.dremio.com/blog/project-nessie-transactional-catalog-for-data-lakes-with-git-like-semantics/
  summary:
    - >
      Project Nessie is an Apache-licensed transactional catalog for data lakes with
      Git-like semantics. It was created in 2020 and applies branches, tags, commits,
      merges, and consistent multi-table visibility to Apache Iceberg-centered lakehouse
      workflows.
  timeline:
    - '2020-04-09: GitHub repository created.'
    - '2020-10-01: 0.1.0 initial release.'
    - >
      2021-10-08: 0.10.1 release notes mention client/API work, storage backend
      consolidation, and Spark SQL extension changes.
    - >
      2023-07-03: GitHub releases API page of the latest 100 releases reaches Nessie
      0.64.0, showing sustained release cadence.
    - '2026-06-24: Nessie 0.108.1 release published.'
  usage:
    - >
      Package nerds install the `nessie` CLI to interact with a Nessie server:
      inspecting references, creating branches and tags, committing catalog changes, and
      supporting Iceberg/Spark workflows. Server-side users run Nessie via a Docker
      image or Kubernetes deployment, wire engines such as Spark, Trino, Hive, or Dremio
      to the catalog, and use branches to isolate ETL or experimentation before merging
      into production.
related-packages:
  - id: brew:apache-spark
    reason: >
      Use Apache Spark with Nessie for SQL and data-processing workflows over Iceberg
      tables; Nessie's official quickstart documents the required Spark catalog and
      extension settings.
    rel: adjacent_workflow
    sources:
      - https://projectnessie.org/guides/try-nessie/
      - https://spark.apache.org/docs/latest/
  - id: brew:trino
    reason: >
      Use Trino with Nessie when interactive distributed SQL should query Iceberg tables
      through a Nessie-backed catalog.
    rel: adjacent_workflow
    sources:
      - https://projectnessie.org/guides/trino/
      - https://trino.io/docs/current/connector/iceberg.html
