history:
  adoption-history:
    - >
      Granola broadened from a macOS meeting notepad to Windows and iOS clients,
      workspaces, shared folders, integrations, and programmatic access. Official
      documentation positions it for individual, business, and enterprise use.
  package-nerd-significance:
    - >
      Granola exemplifies the modern proprietary AI desktop cask: the package installs a
      native capture client, while transcription, note enhancement, collaboration, and
      account data depend on hosted services.
  project-history:
    - >
      Granola was developed by Granola Labs as an AI-enhanced meeting notepad. Unlike
      meeting assistants that join calls as visible bots, its desktop application
      captures microphone and system audio locally and uses the resulting transcript,
      calendar metadata, and the user's raw notes to generate structured notes.
    - >
      The product later added Windows and iOS applications, shared workspaces, Granola
      Chat, reusable prompt recipes, integrations, and APIs for accessing meeting notes
      and transcripts.
  related-projects:
    - >
      Granola works with meetings conducted through Zoom, Google Meet, Microsoft Teams,
      and other audio sources. It integrates with services including Slack, Notion,
      HubSpot, Attio, Affinity, and Zapier.
  sources:
    - https://docs.granola.ai/help-center/consent-security-privacy/security-privacy-data-faqs
    - >
      https://docs.granola.ai/help-center/getting-started/setting-up-granola-for-the-first-time
    - https://docs.granola.ai/help-center/taking-notes/ai-enhanced-notes
    - https://www.granola.ai/
  summary:
    - >
      Granola is a proprietary AI meeting notepad that captures device audio,
      transcribes conversations, and enhances user notes without adding a bot to the
      meeting.
  timeline:
    - '2023: Granola began offering its AI meeting-notes product.'
    - '2020s: Availability expanded from macOS to Windows and iOS.'
    - >
      2026: Granola documented chat, recipes, integrations, and workspace APIs alongside
      its desktop notepad.
  usage:
    - >
      Users sign in with a Google or Microsoft account, connect a calendar, grant audio
      permissions, and manually start transcription for meetings or other computer
      audio. Afterward, Granola generates editable notes that can be queried, exported,
      or selectively shared.
