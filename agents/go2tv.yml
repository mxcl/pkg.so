history:
  adoption-history:
    - >
      Go2TV is distributed as a portable executable and through platform-native channels
      including a Homebrew cask on macOS and Flathub on Linux. The project also
      publishes Windows, Linux, macOS, and Android builds.
  package-nerd-significance:
    - >
      Go2TV provides a lightweight alternative to maintaining a full media-server stack
      when the goal is to send a local file or URL to a nearby receiver. Its combination
      of GUI, CLI, pipes, and headless server mode makes it useful in both desktop and
      automation-oriented package collections.
  project-history:
    - >
      Go2TV was developed as an open-source application for sending video, audio, and
      images directly to televisions and media receivers over DLNA/UPnP or Google Cast.
    - >
      The project expanded beyond its desktop interface to include a command-line
      client, playlists, optional FFmpeg transcoding, subtitles, a browser-controlled
      server mode, RTMP input, and experimental desktop casting.
  related-projects:
    - FFmpeg supplies optional probing and transcoding capabilities.
    - mcp-beam is an official companion project built on Go2TV's core packages.
  sources:
    - https://github.com/alexballas/go2tv#readme
    - https://github.com/alexballas/mcp-beam#readme
  summary:
    - >
      Go2TV is an open-source media-casting application for DLNA/UPnP televisions,
      Chromecast devices, and compatible receivers.
  timeline:
    - Go2TV began as a direct media-casting utility.
    - >
      The project added CLI operation, transcoding, playlists, web-server control, RTMP
      input, and broader platform packaging.
  usage:
    - >
      Desktop users select or drag in a media file, choose a discovered receiver, and
      start playback. Command-line users can list receivers and cast local files, remote
      URLs, subtitles, or piped media. Server mode exposes approved media directories
      through a browser interface.
