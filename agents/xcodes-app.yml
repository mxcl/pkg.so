history:
  adoption-history:
    - >
      The official project recommends its signed and notarized Homebrew cask for
      installation, while also publishing downloadable application archives.
      Localization contributed by community members and support for Apple ID,
      security-key, federated-login, platform, and runtime workflows broadened its
      usefulness beyond simply switching Xcode installations.
  package-nerd-significance:
    - >
      Xcodes packages an awkward bootstrap problem into a dedicated tool: obtaining
      Xcode without first needing a working Xcode toolchain. It also makes side-by-side
      compiler and SDK testing practical for developers who maintain projects across
      Apple platform releases.
  project-history:
    - >
      Xcodes.app developed as a graphical counterpart to the Xcodes command-line tool,
      automating the discovery, download, installation, and activation of multiple Xcode
      releases. Its README credits xcode-install and fastlane's spaceship for earlier
      work on the underlying problem.
    - >
      The project later moved under XcodesOrg and expanded from Xcode-version management
      into platform and runtime installation, Apple Silicon architecture selection,
      stronger authentication flows, and shared XcodesKit infrastructure.
  related-projects:
    - >
      The companion Xcodes CLI provides similar workflows from the terminal. Xcode
      Releases supplies release metadata, aria2 accelerates downloads, and Apple's
      xcode-select performs active-developer-directory switching.
  sources:
    - 'Official XcodesApp README: https://github.com/XcodesOrg/XcodesApp#readme'
    - 'Official XcodesApp releases: https://github.com/XcodesOrg/XcodesApp/releases'
    - 'Official companion CLI repository: https://github.com/XcodesOrg/xcodes'
  summary:
    - >
      Xcodes is an open-source macOS application for downloading, installing, and
      switching among multiple Xcode versions through a graphical interface.
  timeline:
    - >
      v1.x: Established the graphical Xcode installation and switching workflow on macOS
      11 and later.
    - >
      v2.x: Raised the base system requirement to macOS 13 and continued expanding
      authentication and runtime management.
    - >
      v3.x: Added Xcode and runtime architecture variants, including Apple
      Silicon-specific downloads.
    - >
      v4.x: Consolidated functionality around shared XcodesKit and XcodesLoginKit
      components and added grouped, architecture-aware release views.
  usage:
    - >
      Users select an available Xcode release, authenticate with Apple when required,
      let Xcodes download and install it, and make a chosen version active through
      xcode-select. The application can also install Apple platform runtimes and display
      release notes, SDKs, compilers, and OS compatibility.
    - >
      Signed and notarized builds can be installed with Homebrew or downloaded from the
      official GitHub releases page.
