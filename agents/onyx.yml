history:
  adoption-history:
    - >
      OnyX developed a long-lived following among Mac administrators and power users
      seeking a graphical interface for maintenance commands and hidden system settings.
      Titanium Software distributes a distinct build for each major macOS generation, so
      operating-system compatibility is central to installation and upgrades.
  package-nerd-significance:
    - >
      OnyX packages many system-maintenance commands and preference controls behind a
      native interface. Its separate build line for each macOS generation also makes it
      an unusual and recognizable package-management case.
  project-history:
    - >
      Titanium Software has developed OnyX since 2003 as a free multifunction macOS
      utility. It verifies system structures, performs maintenance and cleaning, removes
      applications, changes otherwise hidden settings, clears caches, and rebuilds
      databases and indexes.
  related-projects:
    - >
      Titanium Software describes Maintenance, Deeper, Uninstaller, CalHash, and
      Schedulizer as component applications whose features are included in OnyX.
  sources:
    - 'Official OnyX page: https://www.titanium-software.fr/en/onyx.html'
    - >
      Official Titanium Software overview:
      https://www.titanium-software.fr/en/applications.html
    - 'Official site history statement: https://www.titanium-software.fr/en/index'
  summary:
    - >
      OnyX is Titanium Software's free macOS utility for system verification,
      maintenance, cleaning, application removal, database rebuilding, and hidden
      preference controls.
  timeline:
    - '2003: Titanium Software began developing OnyX.'
    - >
      2003–2026: Titanium Software issued separate OnyX generations for successive major
      Mac OS X and macOS releases.
    - '2026: OnyX continued its per-operating-system release model for macOS Golden Gate 27.'
  usage:
    - >
      Users install the OnyX build made for their exact macOS generation, then select
      verification, maintenance, cleaning, rebuilding, uninstallation, or parameter
      tasks. Some operations require administrative access because they modify
      system-managed data.
