id: brew:aarch64-elf-gcc
display-name: GNU Compiler Collection
repo: https://gcc.gnu.org/git/gcc.git
docs:
  - https://gcc.gnu.org/onlinedocs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GCC's portability and target support made it a common base for cross-compilers in
      embedded, operating-system, and bare-metal development. Package managers often
      expose that pattern as triplet-prefixed formulae so a developer can install host
      and target compilers side by side.
    - >
      Homebrew analytics in the official formula API show aarch64-elf-gcc as an actively
      installed but specialized package, consistent with cross-toolchain usage rather
      than general desktop compiler use.
  package-nerd-significance:
    - >
      This formula matters because GCC cross-compilers are where package management,
      compiler configuration, target triplets, runtime libraries, and Binutils
      compatibility all meet. A small formula name encodes a large amount of toolchain
      policy.
    - >
      For package nerds, aarch64-elf-gcc is also a useful signal that the package is for
      bare-metal or freestanding ELF work, not the host's native AArch64
      operating-system ABI.
  project-history:
    - >
      GCC development is part of the GNU Project and is aimed at improving the compiler
      used in GNU systems while supporting many architectures and environments. The
      official GCC release timeline lists early GCC 1.x releases in the late 1980s, EGCS
      releases beginning in 1997, GCC 3.0 in 2001, GCC 4.0 in 2005, and GCC 16.1 on
      April 30, 2026.
    - >
      The official GCC git page publishes the HTTPS source repository and notes that the
      public repository includes versions and releases. Homebrew's aarch64-elf-gcc
      formula packages the GNU GCC release source for the aarch64-elf target rather than
      maintaining a separate compiler project.
  related-projects:
    - >
      GNU Binutils provides the assembler, linker, and object utilities commonly paired
      with GCC cross-compilers.
    - >
      GDB is the debugger commonly paired with GCC and Binutils in GNU cross-development
      toolchains.
    - >
      The aarch64-elf-binutils and aarch64-elf-gdb Homebrew formulae are target-matched
      companions.
  sources:
    - https://formulae.brew.sh/api/formula/aarch64-elf-gcc.json
    - https://gcc.gnu.org/gccmission.html
    - https://gcc.gnu.org/git.html
    - https://gcc.gnu.org/releases.html
  summary:
    - >
      aarch64-elf-gcc is Homebrew's AArch64 ELF cross-target build of GCC, the GNU
      Compiler Collection. It provides target-prefixed compiler drivers such as
      aarch64-elf-gcc, aarch64-elf-g++, aarch64-elf-cpp, and GCC support tools.
  timeline:
    - '1988: The official GCC release timeline lists GCC 1.27.'
    - '1997: EGCS 1.0 appears in the GCC release timeline.'
    - '2001: GCC 3.0 appears in the GCC release timeline.'
    - '2026: GCC 16.1 is released on April 30, 2026.'
    - >
      2026: Homebrew's aarch64-elf-gcc formula packages GCC 16.1.0 for aarch64-elf cross
      development.
  usage:
    - >
      Users install aarch64-elf-gcc to compile C, C++, and preprocessed sources for
      AArch64 ELF targets. The package is typically used with a matching
      aarch64-elf-binutils install so GCC can invoke the correct assembler, linker,
      archiver, and object tools.
    - >
      The executable prefix is the important user-facing contract: build systems can
      select aarch64-elf-gcc or aarch64-elf-g++ explicitly and avoid confusing the
      target compiler with the host system compiler.
related-packages:
  - id: brew:aarch64-elf-binutils
    reason: >
      This is the required target-matched assembler, linker, and object-tool package;
      the official Homebrew GCC formula declares it as a dependency.
    rel: adjacent_workflow
    sources:
      - https://formulae.brew.sh/formula/aarch64-elf-gcc
      - https://sourceware.org/binutils/
  - id: brew:aarch64-elf-gdb
    reason: >
      Use the matching GDB package to debug AArch64 ELF programs produced by this
      compiler, including remote and bare-metal targets.
    rel: adjacent_workflow
    sources:
      - https://formulae.brew.sh/formula/aarch64-elf-gdb
      - https://sourceware.org/gdb/
