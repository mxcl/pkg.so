  history-sources:
    - 'Official documentation portal: https://www.smartgit.dev/learn/documentation/'
    - 'Official enterprise overview: https://www.smartgit.dev/for-you/enterprises/'
    - >
      Official installation and settings reference:
      https://docs.syntevo.com/SmartGit/Latest/Manual/Installation/Installation-and-Files
    - 'Official manual: https://docs.syntevo.com/SmartGit/Latest/Manual/'
  repo-sources:
