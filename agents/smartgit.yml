id: cask:smartgit
display-name: SmartGit
repo: null
docs:
  - https://docs.syntevo.com/SmartGit/Latest/Manual
  - https://www.smartgit.dev/learn/documentation
config-file-location:
  linux:
    - ${XDG_CONFIG_HOME}/smartgit/<major-smartgit-version>/preferences.yml
    - >
      ~/.config/smartgit/<major-smartgit-version>/preferences.yml (when XDG_CONFIG_HOME
      is unset)
    - ${XDG_CONFIG_HOME}/smartgit/<major-smartgit-version>/smartgit.properties
  macos:
    - ~/Library/Preferences/SmartGit/<major-smartgit-version>/preferences.yml
    - ~/Library/Preferences/SmartGit/<major-smartgit-version>/smartgit.properties
  windows:
    - '%APPDATA%\syntevo\SmartGit\<major-smartgit-version>\preferences.yml'
    - '%APPDATA%\syntevo\SmartGit\<major-smartgit-version>\smartgit.properties'
credentials-file-location:
  linux:
    - ${XDG_CONFIG_HOME}/smartgit/<major-smartgit-version>/license
    - ${XDG_CONFIG_HOME}/smartgit/<major-smartgit-version>/passwords
    - ${XDG_CONFIG_HOME}/smartgit/<major-smartgit-version>/credentials.yml
    - ${XDG_CONFIG_HOME}/smartgit/<major-smartgit-version>/hosting-providers.yml
    - ~/.config/smartgit/<major-smartgit-version>/license (when XDG_CONFIG_HOME is unset)
    - ~/.config/smartgit/<major-smartgit-version>/passwords (when XDG_CONFIG_HOME is unset)
    - >
      ~/.config/smartgit/<major-smartgit-version>/credentials.yml (when XDG_CONFIG_HOME
      is unset)
    - >
      ~/.config/smartgit/<major-smartgit-version>/hosting-providers.yml (when
      XDG_CONFIG_HOME is unset)
  macos:
    - ~/Library/Preferences/SmartGit/<major-smartgit-version>/license
    - ~/Library/Preferences/SmartGit/<major-smartgit-version>/passwords
    - ~/Library/Preferences/SmartGit/<major-smartgit-version>/credentials.yml
    - ~/Library/Preferences/SmartGit/<major-smartgit-version>/hosting-providers.yml
  windows:
    - '%APPDATA%\syntevo\SmartGit\<major-smartgit-version>\license'
    - '%APPDATA%\syntevo\SmartGit\<major-smartgit-version>\passwords'
    - '%APPDATA%\syntevo\SmartGit\<major-smartgit-version>\credentials.yml'
    - '%APPDATA%\syntevo\SmartGit\<major-smartgit-version>\hosting-providers.yml'
history:
  adoption-history:
    - >
      Syntevo describes SmartGit as trusted in enterprise use for more than 15 years. It
      is available across macOS, Windows, and Linux and provides both individual and
      centrally managed commercial licensing options.
  package-nerd-significance:
    - >
      SmartGit offers a full graphical Git workflow without replacing the underlying
      repository format or command-line ecosystem. Package-oriented developers value its
      visual history, staging and commit tools, branch operations, three-way conflict
      solver, submodule support, and integrations with major code-hosting services.
  project-history:
    - >
      SmartGit is a long-running graphical Git client developed by syntevo GmbH. Over
      successive major releases it has maintained version-specific per-user settings
      directories, enabling preview and stable installations to run independently.
    - >
      The product grew beyond basic repository operations to include visual history,
      configurable branching processes, conflict resolution, pull-request and
      hosting-provider integrations, Git LFS, issue-tracker connections, and enterprise
      license management.
  related-projects:
    - 'Git: The distributed version-control system operated by SmartGit.'
    - "SmartSVN: Syntevo's related graphical Subversion client."
    - >
      GitHub, GitLab, Bitbucket, Azure DevOps, and Gerrit: Hosting services documented
      as SmartGit integrations.
  sources:
    - 'Official documentation portal: https://www.smartgit.dev/learn/documentation/'
    - 'Official enterprise overview: https://www.smartgit.dev/for-you/enterprises/'
    - >
      Official installation and settings reference:
      https://docs.syntevo.com/SmartGit/Latest/Manual/Installation/Installation-and-Files
    - 'Official manual: https://docs.syntevo.com/SmartGit/Latest/Manual/'
  summary:
    - >
      SmartGit is syntevo's cross-platform graphical Git client for repository
      management, history exploration, branching, committing, merging, rebasing,
      conflict resolution, and code-hosting integrations.
  timeline:
    - >
      More than 15 years of use: Syntevo describes SmartGit as a long-established
      enterprise Git client.
    - >
      Later development: SmartGit added integrated hosting-provider, pull-request, Git
      LFS, issue-tracker, and centrally managed licensing workflows.
  usage:
    - >
      Developers use SmartGit to clone and organize repositories, inspect working-tree
      changes, stage and commit selected edits, visualize history, manage branches and
      remotes, and resolve conflicts. Optional hosting-provider accounts enable
      integrated cloning, pull requests, comments, and authentication.
tags:
  - branching
  - conflict-resolution
  - cross-platform
  - git
  - gui-client
  - merge
  - rebase
  - repository-management
  - version-control
