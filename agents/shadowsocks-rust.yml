history:
  adoption-history:
    - >
      The official repository supplies release binaries for Linux, macOS, and Windows,
      container images for multiple CPU architectures, and Kubernetes and Helm
      deployment material. The input package metadata also records packaging across
      Homebrew, Alpine, MacPorts, Nix, Pacman, Scoop, and Zypper.
  package-nerd-significance:
    - >
      shadowsocks-rust matters to package users as the actively developed successor to
      the C/libev implementation. It combines portable Rust binaries with a family of
      focused commands and supports contemporary deployment formats ranging from native
      packages to containers and Kubernetes.
  project-history:
    - >
      shadowsocks-rust reimplements the Shadowsocks client and server ecosystem in Rust.
      The official shadowsocks-libev project now directs future development to this
      implementation while retaining libev in bug-fix-only maintenance.
  related-projects:
    - >
      It follows the original Shadowsocks protocol and shadowsocks-libev, and shares
      compatible concepts such as local and server modes, JSON configuration, ACL files,
      SIP003 plugins, and `ss://` URLs.
  sources:
    - https://github.com/shadowsocks/shadowsocks-libev
    - https://github.com/shadowsocks/shadowsocks-rust
    - https://github.com/shadowsocks/shadowsocks-rust/releases
    - https://shadowsocks.org/
    - source_facts.package-manager
  summary:
    - >
      shadowsocks-rust is the Rust implementation of the Shadowsocks secured proxy
      system and the official development successor to shadowsocks-libev. It provides
      local-client, server, manager, service, and URL utilities.
  timeline:
    - >
      Early development: The project established Rust implementations of the Shadowsocks
      local client and server.
    - >
      Successor era: shadowsocks-libev designated shadowsocks-rust as the destination
      for future development.
    - >
      2025: The 1.24.0 release added file and syslog logging and continued dependency
      and platform maintenance.
  usage:
    - >
      Users create a JSON or JSON5 configuration containing server address, port,
      password, cipher, and optional local listener settings, then run `sslocal -c
      config.json` or `ssserver -c config.json`. The project also supports ACLs,
      containers, Kubernetes, Helm, and standalone release binaries.
