history:
  adoption-history:
    - >
      The project drew substantial attention soon after appearing in 2018 and was
      featured in GitHub's 2018 State of the Octoverse project report. Continued
      releases and community issue activity turned what began as a playful demonstration
      into a maintained, readily installable retro-computing application.
  package-nerd-significance:
    - >
      windows95 became a memorable example of Electron's ability—and perceived excess—to
      package an entire legacy operating system as an ordinary desktop application. Its
      availability through desktop package managers turns a historically elaborate
      emulator setup into a conventional app installation, making it both a technical
      curiosity and a package-culture joke with lasting appeal.
  project-history:
    - >
      Felix Rieseberg created windows95 as an Electron wrapper around a complete Windows
      95 environment. The application relies chiefly on Fabian Hemmer's v86 x86
      emulator; Rieseberg's README explicitly credits v86 and explains that the
      redistributable disk image is kept outside the public source repository.
    - >
      The project has continued to ship packaged builds for macOS, Linux, and Windows.
      Later development retained the original nostalgic premise while improving
      saved-state handling, host architecture coverage, and the tooling used to build
      the embedded system image.
  related-projects:
    - 'v86: the browser-oriented x86 emulator that performs most of the underlying emulation.'
    - 'Electron: the cross-platform desktop framework used to package and present the emulator.'
    - "macintosh.js: Felix Rieseberg's related Electron-packaged classic Macintosh project."
  sources:
    - https://github.com/felixrieseberg/windows95
    - https://github.com/felixrieseberg/windows95/blob/main/HELP.md
    - https://github.com/felixrieseberg/windows95/blob/main/README.md
    - https://github.com/felixrieseberg/windows95/releases
    - https://octoverse.github.com/2018/projects
  summary:
    - >
      windows95 is Felix Rieseberg's cross-platform Electron application that packages a
      complete emulated Windows 95 environment for macOS, Linux, and Windows. It is an
      educational and nostalgic project, not a Microsoft product or a replacement for a
      general-purpose virtualization platform.
  timeline:
    - >
      2018: The public project attracted early community activity and appeared in
      GitHub's State of the Octoverse project report.
    - >
      2026: The 5.x release generation continued the project with broader packaged
      builds and improved restoration of saved virtual-machine state.
  usage:
    - >
      Users launch Windows 95 like a normal desktop app to explore the operating system
      and run bundled or added legacy software and games. The README notes that Doom can
      run, while cautioning that a dedicated virtualization product is usually the
      better choice for serious use.
    - >
      Developers can run the project from source after extracting the separately
      distributed disk image into the documented source-tree layout and installing its
      JavaScript dependencies.
