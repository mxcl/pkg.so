history:
  adoption-history:
    - >
      Baidu's official product material says the service surpassed 400 million users by
      2016. Clients have been released for the web and major desktop and mobile
      platforms, with an official Linux client joining the lineup in 2019.
  package-nerd-significance:
    - >
      Baidu Netdisk is a central package in the Chinese personal-cloud ecosystem. Mac
      package users encounter it as the official desktop route to a service widely used
      for cloud backup, cross-device access, and link-based file distribution.
    - >
      Its history also illustrates a recurring packaging boundary: the service directs
      users toward official clients, while unofficial download clients exist separately
      and are not interchangeable with the vendor-supported application.
  project-history:
    - >
      The service began in 2012 under the Baidu Cloud branding as personal online
      storage. In October 2016 it was renamed Baidu Netdisk and refocused on personal
      storage and backup.
    - >
      Baidu later extended the product beyond basic storage with cross-device
      synchronization, online document and media access, scanning and OCR features, and
      an open platform for third-party applications.
  related-projects:
    - >
      Baidu Netdisk Open Platform supplies APIs and SDKs for applications that integrate
      Baidu-hosted user storage.
  sources:
    - https://developer.baidu.com/article/details/295516
    - https://so.baidu.com/m/wiki/help/3539.html
    - https://wangpan.baidu.com/
    - https://wangpan.baidu.com/disk/help
  summary:
    - >
      Baidu Netdisk is Baidu's personal cloud-storage service for uploading, backing up,
      synchronizing, viewing, and sharing files across desktop, mobile, and web clients.
  timeline:
    - "2012: Baidu's personal cloud-storage service launched."
    - >
      2016: Baidu Cloud was renamed Baidu Netdisk and refocused on personal storage and
      backup.
    - '2016: Official product material reported more than 400 million users.'
    - >
      2019: An official Linux client and the Baidu Netdisk Open Platform expanded the
      service's reach.
  usage:
    - >
      Users sign in with a Baidu account to upload and download files, synchronize
      content between devices, create public or password-protected shares, preview
      supported media and documents, and back up personal data.
    - >
      The Mac client is appropriate for routine Finder-based access and large uploads;
      the web interface remains available for browser-based file management and sharing.
related-packages:
