history:
  project-history:
    - >
      Technically, ModSecurity evolved from an Apache module into a cross-platform WAF
      engine. The v3/libmodsecurity architecture separated the core library from
      web-server connectors, removing Apache dependencies and allowing connectors for
      environments such as Nginx and Apache to feed traffic into the same SecRules
      processing engine. The upstream README describes libmodsecurity as the component
      that loads and interprets SecRules and applies traditional ModSecurity processing
      to HTTP content supplied by connectors.
  sources:
    - https://formulae.brew.sh/formula/modsecurity
    - https://github.com/owasp-modsecurity/ModSecurity
    - https://owasp.org/www-project-modsecurity/
    - >
      https://www.helpnetsecurity.com/2006/09/25/breach-acquires-modsecurity-open-source-vendor-thinking-stone/
    - https://www.levelblue.com/blogs/spiderlabs-blog/modsecurity-version-3.0-announcement
    - >
      https://www.levelblue.com/security-resources/software-updates/end-of-sale-and-trustwave-support-for-modsecurity-web-application-firewall/
  summary:
    - >
      ModSecurity is an open-source web application firewall engine that began in 2002
      and became one of the most widely known defensive layers for inspecting HTTP
      traffic with configurable rules. Ivan Ristic created the original Apache-focused
      project; later stewardship passed through commercial and community hands,
      including Thinking Stone, Breach Security, Trustwave SpiderLabs, and OWASP.
      OWASP's project page records the 2024 transfer from Trustwave to OWASP and frames
      the project as the WAF engine commonly paired with the OWASP Core Rule Set.
  usage:
    - >
      Its adoption history is tied to both open-source infrastructure and commercial WAF
      support. Breach Security described the project in 2006 as having more than 10,000
      deployments, and Trustwave later provided commercial rules and support before
      announcing end-of-sale in 2021 and end-of-life for Trustwave support on July 1,
      2024. Distribution through Homebrew and Linux development packages such as
      `libmodsecurity-dev` reflects its dual identity as both an installable
      command-line/dev library package and a component embedded by web-server modules,
      reverse proxies, hosting panels, and security stacks.
related-packages:
  - id: brew:nginx
    reason: >
      Choose nginx as the serving or reverse-proxy layer when deploying libmodsecurity
      through the project's official nginx connector.
    rel: adjacent_workflow
    sources:
      - https://github.com/owasp-modsecurity/ModSecurity-nginx
      - https://nginx.org/en/docs/
  - id: brew:httpd
    reason: >
      Choose Apache HTTP Server when deploying ModSecurity through its official Apache
      connector, continuing the project's original integration model.
    rel: adjacent_workflow
    sources:
      - https://github.com/owasp-modsecurity/ModSecurity-apache
      - https://httpd.apache.org/docs/
