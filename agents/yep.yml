history:
  adoption-history:
    - >
      Yep has been maintained through multiple macOS generations, with the vendor
      continuing to offer downloads for older systems. Yep 4 added a modernized
      interface and Dark Mode while preserving tags from earlier Yep and Leap
      installations.
  package-nerd-significance:
    - >
      Yep represents the long-running class of independent Mac utilities that build on
      native filesystem metadata instead of creating a proprietary document silo. The
      Homebrew cask makes the directly distributed application reproducible to install
      alongside other Mac tooling.
  project-history:
    - >
      Ironic Software developed Yep as a focused manager for PDFs and Office/iWork
      documents. By version 4 it combined automatic document discovery with visual
      browsing, search, tagging, scanning, and optional date-based filing.
    - >
      The project shares a tagging model with Ironic Software's broader Leap file-search
      utility, allowing tags to carry between the two applications.
  related-projects:
    - Leap
    - Fresh
  sources:
    - 'Official manual: https://www.ironicsoftware.com/downloads/YepManual.pdf'
    - 'Official product page: https://ironicsoftware.com/yep/'
    - 'Official support page: https://ironicsoftware.com/support/'
  summary:
    - >
      Yep is a macOS document manager from Ironic Software. It discovers documents
      already stored on the filesystem and adds visual browsing, search, tags, scanning,
      and filing workflows.
  timeline:
    - 'Early releases: Yep established a document-centered browser for PDFs and office files.'
    - >
      Yep 4: The application added a refreshed management interface and Dark Mode while
      retaining compatibility with existing Yep and Leap tags.
  usage:
    - >
      On first launch, Yep indexes supported documents in locations such as Documents,
      Desktop, and Downloads. Users can browse them visually, search without remembering
      their folders, assign tags and ratings, scan paper into multipage PDFs, and create
      files by dragging in text or images.
    - >
      Yep keeps ordinary files on the filesystem rather than importing them into a
      proprietary database. Its optional filing workflow can organize newly created
      documents into date-based folders.
