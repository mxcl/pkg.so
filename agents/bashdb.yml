id: brew:bashdb
display-name: BASH Debugger
repo: https://github.com/Trepan-Debuggers/bashdb
docs:
  - https://bashdb.readthedocs.io/
  - https://bashdb.sourceforge.net/
  - https://bashdb.sourceforge.net/bashdb.html
config-file-location:
  unix:
    - ~/.bashdbrc
    - <project>/.bashdbrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The THANKS file records distribution and platform work from packagers for Cygwin,
      SuSE RPMs, Debian, and NetBSD, as well as Emacs, JetBrains, and VS Code
      integration work. The README also links a Repology packaging badge, reflecting its
      long life as a small but widely packaged Unix developer tool.
    - >
      BashDB has been useful where shell programs became large enough to need
      breakpoints, stepping, stack traces, and debugger command files, especially
      generated configure scripts and complex administrative shell code.
  package-nerd-significance:
    - >
      BashDB is package-nerd significant because it is one of the rare tools that treats
      shell scripts as debuggable programs rather than disposable glue. It also mirrors
      a classic packaging pattern: separate branches and release lines track interpreter
      ABI and behavior changes across Bash versions.
    - >
      Its history is a reminder that debugger support often depends on cooperation from
      the language runtime. The project credits Chet Ramey and Bash changes that made
      call stacks, source lines, and command tracking practical.
  project-history:
    - >
      The project grew out of earlier work to make Bash itself expose enough line,
      source-file, call-stack, and command information for a real debugger. The NEWS
      file describes an initial release of something worthy of being called a debugger
      after earlier ksh/bash debuggers lacked reliable line reporting through loops,
      conditionals, functions, and sourced files.
    - >
      BashDB's release history tracks the Bash runtime closely: first public releases
      targeted Bash 2.x-era debugging support, version 3.00 was the first release for
      Bash 3.0 in 2004, the 4.0 series was a major rewrite for Bash 4.0 in 2008, and
      later branches followed Bash 4.1, 4.2, 4.3, 4.4, 5.0, 5.1, and 5.2.
  related-projects:
    - >
      The README explicitly relates BashDB to zshdb, the Trepan debuggers, and GNU gdb.
      The THANKS file also names shunit2 for tests and points to Emacs dbgr work after
      older bundled Emacs Lisp was removed.
  sources:
    - https://bashdb.sourceforge.net/
    - https://github.com/Trepan-Debuggers/bashdb/blob/bash-5.2/NEWS.md
    - https://github.com/Trepan-Debuggers/bashdb/blob/bash-5.2/README.md
    - https://github.com/Trepan-Debuggers/bashdb/blob/bash-5.2/THANKS.md
  summary:
    - >
      BASH Debugger, usually packaged as bashdb, is a source-level debugger for Bash
      scripts. Its own README describes it as a debugger for Bash 5.2 and later, with
      older repository branches supporting older Bash releases, and says its command
      syntax follows the zsh debugger, the Trepan family of debuggers, and GNU gdb.
  timeline:
    - >
      2003: Early 0.x releases add gdb-like commands, DDD and Emacs support, call-stack
      handling, and Bash debugger patches.
    - '2004: Version 3.00 0.01 is released as the first Bash 3.0 release.'
    - >
      2008: Version 4.0-0.1 is a major rewrite for Bash 4.0 and adds aliases, autoeval,
      shunit2 tests, and improved Emacs support.
    - >
      2010: Version 4.1-0.4 changes the startup file from `.bashdbinit` to
      `$HOME/.bashdbrc` and requires Bash 4.1 or later.
    - '2019: Version 5.0-0.1.1.0 revises the debugger for Bash 5.0.'
    - >
      2020s: The bash-5.2 branch documents Bash 5.2-and-newer support while older
      branches support older Bash releases.
  usage:
    - >
      The README documents three entry points: running a script under `bash --debugger`,
      invoking the `bashdb` executable directly, or sourcing debugger support from
      inside a running script and entering the debugger lazily. It also documents
      command-file and tty setup for debugging configure scripts whose stdin is closed.
    - >
      The debugger exposes gdb-like commands for breakpoints, stepping, stack
      inspection, display/watch expressions, command history, aliases, tty control,
      source listing, and conditional breakpoints.
related-packages:
  - id: brew:zshdb
    reason: >
      Choose zshdb for the same gdb-like source-debugging workflow when the program
      being debugged is written for Zsh rather than Bash.
    rel: alternative
    sources:
      - https://bashdb.sourceforge.net/
      - https://github.com/Trepan-Debuggers/zshdb
tags:
  - bash
  - cli
  - debugger
  - gdb-like
  - shell
geiger:
  category: escape-surveillance-offensive
  color: red
  confidence: medium
  reason: escape, surveillance, or offensive capability signal
  reasons:
    - escape, surveillance, or offensive capability signal
    - generalized runtime or code generation signal
  signals:
    - text:debugger
    - text:shell
provenance:
  category-sources:
    - >
      Official bashdb homepage describes a source-code debugger for bash following gdb
      command syntax.
  display-name-sources:
    - Official bashdb SourceForge homepage title is "BASH Debugger".
  docs-sources:
    - Official bashdb SourceForge homepage links ReadTheDocs and the bashdb manual page.
    - ReadTheDocs landing page describes bashdb as a gdb-like debugger for bash.
  history-sources:
    - https://bashdb.sourceforge.net/
    - https://github.com/Trepan-Debuggers/bashdb/blob/bash-5.2/NEWS.md
    - https://github.com/Trepan-Debuggers/bashdb/blob/bash-5.2/README.md
    - https://github.com/Trepan-Debuggers/bashdb/blob/bash-5.2/THANKS.md
  repo-sources:
    - Official GitHub repository page is Trepan-Debuggers/bashdb.
    - Official bashdb SourceForge homepage links the GitHub repository under Source Code.
  tags-sources:
    - >
      Official bashdb homepage and ReadTheDocs describe bash, shell, debugger, CLI, and
      gdb-like behavior.
category-confidence: high
category-path:
  - developer-tools
  - debuggers
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
