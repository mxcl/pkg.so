history:
  adoption-history:
    - >
      ossapp gave desktop users a graphical route into the pkgx package ecosystem and
      was distributed as a self-updating application. Its source repository was archived
      in January 2025, leaving the project as a historical component of that ecosystem.
  package-nerd-significance:
    - >
      ossapp represented an effort to present an open-source package catalog through an
      app-store-style GUI while delegating installation and package management to pkgx.
      Its Svelte-and-Electron implementation also makes it a useful example of a desktop
      frontend built around a command-line package engine.
  project-history:
    - >
      pkgxdev developed ossapp as the graphical companion to pkgx, describing it as an
      App Store for Open Source. The application exposed extra package information and
      graphical workflows while using pkgx underneath to install and manage software.
    - >
      The project was implemented with Electron and Svelte and released under the
      Apache-2.0 license. The official repository is now archived and read-only.
  related-projects:
    - pkgx is the package runner and management engine used by ossapp.
    - The wider pkgx ecosystem includes dev, pkgm, pantry, mash, and pkgo.
  sources:
    - https://docs.pkgx.sh/
    - https://github.com/pkgxdev/ossapp
    - https://pkgx.app/
  summary:
    - >
      ossapp was the graphical package-management companion to pkgx and presented
      open-source software through an app-store-style desktop interface.
  timeline:
    - '2025: The official ossapp repository was archived and made read-only.'
  usage:
    - >
      Users browsed packages in the graphical application and installed or managed them
      through the underlying pkgx engine. The application handled its own updates.
