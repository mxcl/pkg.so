history:
  adoption-history:
    - >
      Scribus expanded from a Linux page-layout program to a cross-platform application
      available on BSD variants, macOS, Windows, and other systems. Its combination of
      free-software licensing, an open XML document format, and professional prepress
      functions established it as a prominent open-source desktop-publishing package.
  package-nerd-significance:
    - >
      Scribus is a major creative application in free-software package collections.
      Packagers must account for Qt, color management, fonts, hyphenation dictionaries,
      documentation licensing, and optional scripting support. Its native SLA format is
      XML-based, which aids inspection and recovery and distinguishes it from
      proprietary binary publishing formats.
  project-history:
    - >
      Franz Schmid began Scribus in spring 2001 as a GPL page-layout program for Linux.
      The project developed into a cross-platform desktop-publishing system with CMYK
      and spot colors, ICC color management, vector tools, scripting, broad import and
      export support, and professional PDF production.
    - >
      Development is maintained in the project's official Subversion repository. Public
      GitHub and GitLab repositories describe themselves as community-maintained
      mirrors, reflecting the project's long-running SVN-centered workflow.
  related-projects:
    - Qt supplies Scribus's cross-platform user interface.
    - Ghostscript is commonly used alongside Scribus for PostScript and related workflows.
    - Python support lets users automate layout and publishing operations.
    - The Scribus template repository distributes reusable layouts.
  sources:
    - >
      Official manual introduction:
      https://github.com/scribusproject/scribus/blob/master/doc/en/index.html
    - >
      Official packaging notes:
      https://github.com/scribusproject/scribus/blob/master/PACKAGING
    - >
      Official project forum configuration guidance:
      https://forums.scribus.net/index.php?topic=2975.0
    - 'Official project site: https://www.scribus.net/'
  summary:
    - >
      Scribus is a free, open-source, cross-platform desktop-publishing application for
      page layout and professional print or PDF output.
  timeline:
    - '2001: Franz Schmid began Scribus development.'
    - '2003: Project metadata described Scribus as a GPL page-layout program for Linux.'
    - >
      2010s: The project maintained stable and development release lines while expanding
      professional PDF and complex-text support.
    - >
      2024: Community work began on a modernized manual while the established manual and
      wiki remained available.
  usage:
    - >
      Users build books, magazines, brochures, newsletters, posters, and other
      print-ready layouts with linked text and image frames, styles, master pages, color
      management, bleeds, and PDF export. Python scripting supports repeatable
      publishing workflows.
