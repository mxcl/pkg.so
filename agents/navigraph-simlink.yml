history:
  adoption-history:
    - >
      Navigraph's 2022 FlightSim Community Survey reported Simlink/Moving Maps among the
      two most-used visual flight-tracking products in its respondent population, with
      28.3% selecting it. This is vendor-run survey evidence rather than a measurement
      of the entire flight-simulation market.
  package-nerd-significance:
    - >
      Simlink is a small but important integration package: a background desktop bridge
      and simulator plugin can supply live position data to chart clients running on
      another computer, a tablet, or a phone. The package therefore connects locally
      installed simulator software with Navigraph's hosted chart ecosystem.
  project-history:
    - >
      Navigraph developed Simlink as the position bridge for the moving-map feature in
      Navigraph Charts. Official documentation from 2018 already required Simlink on the
      simulator computer, and later releases added Microsoft Flight Simulator support
      through SimConnect while retaining plugins for FSX, Prepar3D, and X-Plane.
  related-projects:
    - Navigraph Charts, which displays the position transmitted by Simlink.
    - >
      Microsoft Flight Simulator, X-Plane, Prepar3D, and FSX, the simulator families
      described by Navigraph's official material.
  sources:
    - >
      Official 2022 community survey:
      https://download.navigraph.com/docs/flightsim-community-survey-by-navigraph-2022-final.pdf
    - >
      Official Charts guide:
      https://download.navigraph.com/docs/guides/charts/introduction_to_navigraph_charts.pdf
    - >
      Official Simlink category description:
      https://forum.navigraph.com/t/about-the-simlink-moving-map-category/55
    - 'Official Simlink support category: https://forum.navigraph.com/c/charts/simlink/9'
  summary:
    - >
      Navigraph Simlink is a flight-simulator companion that sends the simulated
      aircraft's position to Navigraph servers so Charts clients can display a live
      moving map.
  timeline:
    - >
      2018: Navigraph's official Charts guide documented Simlink as the component
      enabling moving maps.
    - >
      2020: Simlink 1.1.16.0818 or later added moving-map support for Microsoft Flight
      Simulator.
    - >
      2022: Navigraph's community survey reported 28.3% respondent use for
      Simlink/Moving Maps.
  usage:
    - >
      Run Simlink on the computer hosting the flight simulator, sign in with the same
      Navigraph account used by Charts, and keep it running during the flight. Simlink
      uses simulator plugins for FSX, Prepar3D, and X-Plane and SimConnect for Microsoft
      Flight Simulator; Charts clients then render the transmitted position.
