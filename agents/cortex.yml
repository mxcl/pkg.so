history:
  adoption-history:
    - >
      Cortex's adoption history is tied to Prometheus remote write and cloud-native
      observability. The official documentation's further-reading section traces public
      talks from PromCon 2016 through KubeCon sessions, and lists managed or
      production-oriented material from Grafana Labs, AWS, CNCF, and other operators.
  package-nerd-significance:
    - >
      Cortex matters to package and infrastructure maintainers because it turns
      Prometheus from a single-node time-series database into a multi-tenant distributed
      system. Packaging is only a small part of the story; configuration, Kubernetes
      deployment, storage backends, ring state, and service topology dominate real-world
      distribution.
  project-history:
    - >
      The official Cortex documentation states that the project was started by Tom
      Wilkie and Prometheus co-founder Julius Volz in June 2016. The public GitHub
      repository was created later in 2016, and the README describes a system built for
      scale, high availability, multi-tenancy, and long-term object storage.
  related-projects:
    - >
      Related projects include Prometheus, OpenTelemetry Metrics, Thanos, Grafana Mimir,
      Alertmanager, and cloud object stores used for long-term metrics storage.
  sources:
    - https://github.com/cortexproject/cortex
    - https://raw.githubusercontent.com/cortexproject/cortex/master/README.md
    - https://cortexmetrics.io/docs/
    - https://cortexmetrics.io/docs/architecture/
    - https://api.github.com/repos/cortexproject/cortex
    - https://api.github.com/repos/cortexproject/cortex/releases
  summary:
    - >
      Cortex is a horizontally scalable, highly available, multi-tenant long-term
      storage system for Prometheus and OpenTelemetry metrics. It is normally deployed
      as a server-side observability backend rather than used as a local CLI tool.
  timeline:
    - '2016: Cortex project started in June by Tom Wilkie and Julius Volz.'
    - '2016: Public GitHub repository created in September.'
    - >
      2018: Official documentation lists CNCF and KubeCon materials presenting Cortex as
      scalable Prometheus.
    - '2026: Official GitHub releases include the v1.21.x series.'
  usage:
    - >
      Operators deploy Cortex as single-binary or microservices components. Prometheus
      instances push samples via remote write, while Cortex distributes, ingests,
      stores, and queries data across long-term storage backends such as S3, GCS, Swift,
      and Azure.
related-packages:
  - id: brew:prometheus
    reason: >
      Prometheus scrapes targets and sends samples to Cortex through remote_write,
      making it Cortex's primary documented ingestion companion.
    rel: adjacent_workflow
    sources:
      - https://cortexmetrics.io/docs/architecture/
      - https://prometheus.io/docs/prometheus/latest/configuration/configuration/#remote_write
  - id: brew:grafana
    reason: >
      Cortex's getting-started guide configures Grafana to query Cortex as a
      Prometheus-compatible data source.
    rel: adjacent_workflow
    sources:
      - https://cortexmetrics.io/docs/getting-started/single-binary/
      - https://grafana.com/docs/grafana/latest/datasources/prometheus/
  - id: brew:thanos
    reason: >
      Thanos is an alternative long-term Prometheus metrics architecture centered on
      composable components and sidecar-based object-storage uploads; Cortex documents
      migration from Thanos into its multi-tenant blocks storage.
    rel: alternative
    sources:
      - https://cortexmetrics.io/docs/blocks-storage/migrate-storage-from-thanos-and-prometheus/
      - https://github.com/thanos-io/thanos
      - https://github.com/thanos-io/thanos/blob/main/docs/components/sidecar.md
