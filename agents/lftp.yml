id: brew:lftp
display-name: lftp
repo: null
docs:
  - https://lftp.yar.ru/
  - https://lftp.yar.ru/lftp-man.html
config-file-location:
  unix:
    - /etc/lftp.conf
    - ~/.lftprc
    - ~/.lftp/rc
    - ~/.config/lftp/rc
credentials-file-location:
  unix:
    - ~/.netrc
    - ~/.local/share/lftp/bookmarks
    - ~/.lftp/bookmarks
history:
  adoption-history:
    - >
      lftp is widely packaged across Unix-like systems and Windows-oriented package
      ecosystems, including Homebrew, Debian, Ubuntu, Fedora/DNF, Arch, Alpine,
      MacPorts, Nix, Scoop, Chocolatey, and openSUSE. That breadth reflects its role as
      a standard scripting and mirroring client for administrators who need more than a
      minimal FTP command.
  package-nerd-significance:
    - >
      lftp is package-nerd catnip because it compresses a surprising amount of transfer
      machinery into one CLI: protocol clients, retry semantics, queueing, shell
      grammar, mirroring, and background detachment. It is often the package people
      install when `ftp`, `sftp`, `wget`, or `curl` are each almost, but not quite, the
      right tool.
  project-history:
    - >
      The official manual describes lftp as a sophisticated file transfer program with a
      shell-like command language, background jobs, queues, conditionals, bookmarks, and
      automatic retry/resume behavior. Its evolution has been incremental and durable:
      the events log records active releases from the 2.x era through the 4.x era.
    - >
      Milestones in the official events log show the tool expanding beyond FTP: WebDAV
      support appeared in 2005, GNU TLS support was added in 2005, SFTP appeared in
      development snapshots in 2003, BitTorrent support reached the 4.0.0 release in
      2009, and DHT plus other BitTorrent extensions appeared in 2012.
  related-projects:
    - >
      lftp overlaps with ftp clients, OpenSSH sftp, curl, wget, rsync-style mirroring
      workflows, BitTorrent clients, GNU TLS/OpenSSL, WebDAV clients, and Unix
      job-control shells.
  sources:
    - https://formulae.brew.sh/formula/lftp
    - https://github.com/lavv17/lftp
    - https://lftp.yar.ru/
    - https://lftp.yar.ru/events.html
    - https://lftp.yar.ru/lftp-man.html
    - https://raw.githubusercontent.com/lavv17/lftp/master/NEWS
  summary:
    - >
      lftp is a long-running command-line file transfer client with FTP, FTPS, HTTP,
      HTTPS, HFTP, FISH, SFTP, file, mirror, queue, job-control, and BitTorrent
      features. It is one of the richer Unix-style transfer shells packaged by
      general-purpose package managers.
  timeline:
    - '1999-11-12: The official events log notes lftp 2.1-era development.'
    - '2003-11-20: SFTP protocol support was implemented in a development snapshot.'
    - '2005-02-25: lftp 3.1.0 added WebDAV support.'
    - '2005-05-16: lftp 3.2.0 added GNU TLS support.'
    - '2009-09-11: lftp 4.0.0 added a BitTorrent client.'
    - '2012-09-27: lftp 4.4.0 added DHT and other BitTorrent extensions.'
    - >
      2024-11-08: lftp 4.9.3 was released with fixes for SFTP, UDP tracker looping,
      crashes, compilation, and translations.
  usage:
    - >
      Common use centers on interactive sessions, scripted transfers, backgrounded jobs,
      `mirror` for directory synchronization, reverse mirroring for upload workflows,
      parallel transfers, bookmarks, and URL-based access to multiple protocols. The
      startup configuration paths and `.netrc` support make it fit naturally into Unix
      automation.
related-packages:
  - id: brew:ncftp
    reason: >
      Choose NcFTP for a traditional FTP-focused client and its dedicated get, put,
      listing, batch, and spooler utilities; choose lftp when you need SFTP, HTTP,
      queues, or its richer mirror shell.
    rel: alternative
    sources:
      - https://www.ncftp.com/ncftp/
      - https://lftp.yar.ru/features.html
  - id: brew:wget
    reason: >
      Choose GNU Wget for non-interactive HTTP/FTP retrieval and recursive website
      downloads; choose lftp for interactive remote sessions, uploads, job control, and
      bidirectional mirroring.
    rel: alternative
    sources:
      - https://www.gnu.org/software/wget/
      - https://lftp.yar.ru/features.html
  - id: brew:rsync
    reason: >
      Choose rsync for efficient local or remote-shell directory synchronization with
      delta transfers; lftp's mirror command is better suited to directory
      synchronization over FTP-family and other URL protocols.
    rel: alternative
    sources:
      - https://rsync.samba.org/
      - https://lftp.yar.ru/features.html
