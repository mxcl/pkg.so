history:
  adoption-history:
    - >
      The tool spread through package-manager ecosystems because it solved a common
      deployment problem for Go services before Go added native file embedding.
      Homebrew, Debian-family packages, Nix, MacPorts, and other distributions carried
      go-bindata or its original jteeuwen package name, which made it a familiar
      build-time dependency for Go web services and single-binary CLIs.
  package-nerd-significance:
    - >
      For package maintainers, go-bindata is notable as a maintained fork of a once
      widely packaged Go asset tool. Its presence in Homebrew under Kevin Burke's fork
      records the practical packaging move from an older upstream identity to a
      maintained distribution target.
  project-history:
    - >
      The project lineage began with jteeuwen/go-bindata, whose README described
      conversion of arbitrary files into manageable Go source code. Kevin Burke's fork
      became the Homebrew-trusted version and documented maintenance changes such as
      atomic writes, SHA-256 hashes for embedded files, generated code formatting, size
      reporting, and safer file-mode handling.
  related-projects:
    - jteeuwen/go-bindata
    - elazarl/go-bindata-assetfs
    - Go embed package
  sources:
    - https://formulae.brew.sh/formula/go-bindata
    - https://github.com/jteeuwen/go-bindata
    - https://github.com/kevinburke/go-bindata
    - https://github.com/kevinburke/go-bindata/releases
  summary:
    - >
      go-bindata is a Go code-generation utility for embedding files into Go programs.
      It belongs to an older pre-embed generation of Go asset tooling: developers ran a
      command over static assets, committed or built the generated Go file, and accessed
      assets through generated helper functions.
  timeline:
    - "2016: Kevin Burke's fork was created on GitHub."
    - '2017: The fork began publishing GitHub releases.'
    - '2023: v4 releases continued the module-era maintenance line.'
  usage:
    - >
      Practitioners use go-bindata by pointing the CLI at one or more directories, often
      with recursive `...` patterns, and then importing the generated `bindata.go`
      output into an application. The README highlights common production and
      development patterns: debug mode loads assets from disk during iteration, release
      mode embeds them into the binary, and flags such as `-o`, `-ignore`, `-prefix`,
      `-nocompress`, and `-nomemcopy` tune output shape and runtime tradeoffs.
related-packages:
  - id: brew:go
    reason: >
      For new Go projects, the standard embed package and //go:embed directive provide
      toolchain-native compile-time asset embedding without a separate go-bindata
      generation step.
    rel: alternative
    sources:
      - https://pkg.go.dev/embed
      - https://go.dev/blog/go1.16
      - https://github.com/kevinburke/go-bindata
