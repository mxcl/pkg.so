history:
  adoption-history:
    - >
      Sæga entered public release in 2026 as a macOS-only product aimed particularly at
      Swedish and Norwegian speakers. Its distribution includes a perpetual free tier, a
      one-time Pro license, and a Homebrew cask.
  package-nerd-significance:
    - >
      Sæga is notable as a locally transcribing, Nordic-language-focused alternative to
      generic Whisper dictation products. It uses KB-Whisper for Swedish and NB-Whisper
      for Norwegian, while keeping raw transcription on the Mac.
  project-history:
    - >
      Developer Fredrik Carlsson says he built Sæga to dictate in Swedish without
      sending recorded speech away from the computer. Version 1.0.0 launched in May 2026
      with local Whisper transcription, six output modes, rewriting, a personal
      dictionary, and history features.
  related-projects:
    - KB-Whisper supplies the Swedish-focused speech-recognition model.
    - NB-Whisper supplies the Norwegian-focused model.
    - OpenAI Whisper and whisper.cpp underpin recognition for additional languages.
    - Anthropic Claude is used for optional text-only cleanup modes.
  sources:
    - 'Official acknowledgements: https://saega.app/acknowledgements'
    - 'Official changelog: https://saega.app/changelog'
    - 'Official privacy policy: https://saega.app/privacy'
    - 'Official product page: https://saega.app/'
  summary:
    - >
      Sæga is a Swedish-built macOS voice-to-text application centered on private,
      on-device transcription and strong Swedish and Norwegian recognition.
  timeline:
    - '2026-05-05: Version 1.0.0 released.'
    - '2026-06-15: A fully local operating mode was added.'
    - '2026-06-22: Session mode was added.'
    - '2026-08-15: Version 1.0.17 added adaptive personal-dictionary suggestions.'
  usage:
    - >
      Users start and stop dictation with a global shortcut, after which Sæga inserts
      the resulting text into the active application. Raw mode remains local; optional
      cleanup, email, translation, prompt, and rewrite modes can process transcribed
      text.
    - >
      The app is suited to Nordic-language email, notes, chat, terminal input, and other
      workflows where accurate compound words and regional proper nouns matter.
