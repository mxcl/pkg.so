history:
  adoption-history:
    - >
      Its adoption is narrower than core multimedia codecs, but it filled a recognizable
      packaging niche for applications that wanted visualization effects without each
      player inventing its own plugin API. Distribution packages often keep the 0.4 line
      available for older consumers.
  package-nerd-significance:
    - >
      libvisual is interesting as old-school Linux desktop media plumbing: a shared ABI
      and plugin model for visualizers, with separate historical tags for core, plugins,
      and XMMS integration.
  project-history:
    - >
      The project presents itself as Libvisual, with a homepage tagline of making music
      visual and a GitHub repository that distinguishes the maintained 0.4.x branch from
      master development toward 0.5.x and later. The repository tag list preserves older
      libvisual, plugin, and XMMS-era release tags, reflecting its roots in classic
      desktop music-visualization plugin stacks.
  related-projects:
    - libvisual-plugins provided visualization plugins for the core library.
    - libvisual-xmms connected the stack to the XMMS player ecosystem.
  sources:
    - https://github.com/Libvisual/libvisual
    - https://libvisual.org/
    - https://raw.githubusercontent.com/Libvisual/libvisual/master/README.md
  summary:
    - >
      libvisual is an audio-visualization framework that lets applications feed audio
      streams into visualization plugins and display the resulting graphics through
      supported output paths.
  timeline:
    - '2005-2013: Project homepage copyright range covers the original public project era.'
    - >
      0.1.x and 0.2.x: Early public tags for libvisual, plugins, and XMMS integration
      appear in the repository.
    - '0.4.x: Long-lived maintenance branch using C99, C++11, and Autotools.'
    - '0.5.x: Master branch development moved toward C11, C++20, and CMake.'
  usage:
    - >
      Applications link the library to host visual plugins, and the package also
      includes lv-tool-0.4 for command-line interaction with the 0.4 stack.
