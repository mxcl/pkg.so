id: brew:infat
display-name: infat
repo: null
docs:
  - https://github.com/philocalyst/infat#readme
config-file-location:
  macos:
    - $XDG_CONFIG_HOME/infat/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is narrow but natural for the Homebrew audience: infat is aimed at macOS
      power users, administrators, and dotfile maintainers who want repeatable
      default-app settings across machines. The input package metadata shows Homebrew
      and Nix packaging.
  package-nerd-significance:
    - >
      infat is interesting as a small package because it wraps a very platform-specific
      macOS preference surface in a package-manager-friendly CLI. It sits beside older
      tools such as duti, but adds URL schemes and a declarative TOML workflow that fits
      dotfiles culture.
  project-history:
    - >
      The project appeared publicly in 2025 and moved quickly through alpha, beta, and
      1.x releases. The README describes it as a single-binary macOS-first tool built
      around NSWorkspace, Launch Services, and UTType, with TOML configuration for
      extensions, types, and schemes.
    - >
      The release notes show a notable rewrite at version 3.0.0 in September 2025,
      moving the implementation to Rust and adding URL-scheme inspection support. The
      README later notes that GitHub became a mirror while development management moved
      to Tangled.
  related-projects:
    - >
      duti is named by the README as an inspiration. macOS Launch Services, NSWorkspace,
      and Uniform Type Identifiers are the platform APIs that define the problem space.
      Nix and Homebrew are the package-manager channels reflected in the input metadata.
  sources:
    - https://github.com/philocalyst/infat
    - https://github.com/philocalyst/infat/blob/main/CHANGELOG.md
    - https://github.com/philocalyst/infat/releases
  summary:
    - >
      infat is a macOS-native CLI for declaratively managing file-extension, Uniform
      Type Identifier, and URL-scheme opener associations. It turns a Finder preference
      chore into a scriptable dotfiles-style command.
  timeline:
    - '2025: Public repository created for infat.'
    - '2025: Alpha, beta, and 1.0 releases published in March and April.'
    - '2025: Version 3.0.0 release notes describe a complete rewrite to Rust.'
    - '2026: Version 3.1 release published.'
  usage:
    - >
      Users run infat info to inspect openers, infat set to bind an app to an extension,
      type, or URL scheme, or provide a TOML config at
      $XDG_CONFIG_HOME/infat/config.toml. That makes it useful in setup scripts for
      default browsers, editors, image viewers, mail handlers, and other app-association
      preferences.
related-packages:
  - id: brew:duti
    reason: >
      duti is the established file-, UTI-, and URL-handler CLI that inspired infat;
      choose infat for its declarative TOML workflow and inspection-oriented interface.
    rel: alternative
    sources:
      - https://github.com/philocalyst/infat
      - https://github.com/moretension/duti
