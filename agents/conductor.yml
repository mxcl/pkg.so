history:
  adoption-history:
    - >
      Conductor broadened beyond its initial Claude Code association to support Claude
      Code, Codex, Cursor, and OpenCode. In 2026 the company announced a $22 million
      Series A and the acquisition of cmd, signaling expansion from a macOS desktop
      utility toward a broader agent-development platform.
  package-nerd-significance:
    - >
      Conductor packages an opinionated worktree-and-agent workflow into a desktop
      application. It is notable to developer-tool users because it coordinates
      branches, terminals, diffs, checks, pull requests, and multiple agent runtimes
      without requiring each task to share one checkout.
  project-history:
    - >
      Conductor emerged as a macOS application for running coding agents in parallel,
      giving each independent task its own Git worktree, branch, terminal, files, and
      review path.
    - >
      By 2026 its official documentation treated several agent harnesses as first-class
      options, while the product's blog described continued expansion toward cloud and
      team workflows.
  related-projects:
    - >
      Claude Code, Codex, Cursor, OpenCode, Git worktrees, GitHub, and Linear are
      directly integrated with or discussed by Conductor.
  sources:
    - https://www.conductor.build/blog
    - https://www.conductor.build/docs
    - https://www.conductor.build/docs/concepts/workflow
    - https://www.conductor.build/docs/reference/harnesses
  summary:
    - >
      Conductor is a macOS developer tool for running coding agents in parallel inside
      isolated Git-backed workspaces and carrying their changes through review and
      pull-request workflows.
  timeline:
    - '2026-03-30: Conductor announced a $22 million Series A.'
    - '2026-04-02: Conductor announced that cmd was joining the company.'
    - >
      2026: Official documentation listed Claude Code, Codex, Cursor, and OpenCode as
      supported agent harnesses.
  usage:
    - >
      Developers add a Git repository, create one workspace per independent task, run
      one or more coding-agent sessions, test each workspace separately, inspect diffs
      and checks, and then open or merge pull requests.
