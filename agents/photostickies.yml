history:
  adoption-history:
    - >
      PhotoStickies has remained part of DEVONtechnologies' collection of free Mac
      utilities for more than two decades. The company continues to distribute it
      without charge alongside tools such as EasyFind and XMenu.
    - >
      A 2021 maintenance release added native Apple Silicon support, refreshed the
      Inspector palette for contemporary macOS, and reduced webcam-update bandwidth
      through conditional HTTP requests.
  package-nerd-significance:
    - >
      PhotoStickies is a long-lived example of the small, single-purpose utilities
      associated with classic Mac software culture. Homebrew Cask keeps the
      independently distributed application accessible through a command-line package
      workflow.
  project-history:
    - >
      PhotoStickies was already in public use by 2004, when its developer discussed
      webcam compatibility in the official support community. DEVONtechnologies later
      incorporated it into its freeware collection.
    - >
      The application evolved from placing images and network camera views on the
      desktop to include automatic refreshing, camera recording, desktop-background
      creation, saved states, and support for modern Mac processors.
  related-projects:
    - >
      PhotoStickies is distributed with DEVONtechnologies' freeware family, which also
      includes EasyFind, XMenu, ThumbsUp, CalcService, and WordService.
    - DEVONthink exposes commands for opening compatible images and links in PhotoStickies.
  sources:
    - https://www.devontechnologies.com/apps/freeware
    - https://www.devontechnologies.com/blog/20210817-summer-freeware-updates
    - https://www.devontechnologies.com/blog/deletefavoritesorstatesinphotostickies
    - https://www.devontechnologies.com/download
  summary:
    - >
      PhotoStickies is a free macOS utility from DEVONtechnologies that places local
      pictures, web images, webcams, and connected-camera feeds directly on the desktop.
  timeline:
    - >
      2004: Official support discussions show PhotoStickies already in active use for
      network-camera viewing.
    - >
      2006: DEVONtechnologies documented management of PhotoStickies favorites and saved
      states.
    - >
      2021: Version 6.0.1 added Apple Silicon support, a refreshed Inspector, and more
      bandwidth-efficient webcam updates.
  usage:
    - >
      Users open local or remote images as borderless desktop items and can have
      internet-hosted images or webcams refresh automatically.
    - >
      Connected camera and webcam feeds can be displayed, recorded, or turned into the
      desktop background.
