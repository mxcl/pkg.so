config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      go-md2man found a durable niche in Go CLI release workflows, where maintainers
      often write documentation in Markdown but still need man pages for Unix packages.
      Homebrew and Linux package listings make it available as a standalone build-time
      or packaging helper.
  package-nerd-significance:
    - >
      For package users, go-md2man is valuable because it bridges developer-authored
      Markdown and distribution-friendly man pages without a larger documentation stack.
  project-history:
    - >
      The public repository was created in 2014. Its README gives the enduring scope of
      the project: use the blackfriday Markdown processor to turn Markdown source into
      man-page roff output.
  related-projects:
    - blackfriday supplies the Markdown processing layer used by go-md2man.
  sources:
    - https://api.github.com/repos/cpuguy83/go-md2man
    - https://formulae.brew.sh/formula/go-md2man
    - https://github.com/cpuguy83/go-md2man
    - https://github.com/cpuguy83/go-md2man/releases
  summary:
    - >
      go-md2man is a small Go utility that converts Markdown into roff-formatted Unix
      manual pages.
  timeline:
    - '2014: Public GitHub repository created.'
    - '2019: v2.0.0 tag line established module-aware releases.'
    - '2025: v2.0.7 release published.'
  usage:
    - >
      Practitioners run go-md2man with an input Markdown file and an output path for the
      generated man page. Go module users can install it with go install, and Go
      1.24-era projects can add it as a go tool entry for repeatable documentation
      generation.
related-packages:
  - id: brew:pandoc
    reason: >
      Pandoc also converts Markdown to roff man pages and is preferable when the same
      source must target many document formats, while go-md2man is a smaller
      single-purpose converter.
    rel: alternative
    sources:
      - https://github.com/cpuguy83/go-md2man
      - https://pandoc.org/MANUAL.html
      - https://pandoc.org/demos.html
