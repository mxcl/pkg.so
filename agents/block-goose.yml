id: cask:block-goose
display-name: goose
repo: null
docs:
  - https://goose-docs.ai/docs/getting-started/providers
  - https://goose-docs.ai/docs/guides/config-files
  - https://goose-docs.ai/docs/quickstart
config-file-location:
  unix:
    - ~/.config/goose/config.yaml
  windows:
    - '%APPDATA%\Block\goose\config\config.yaml'
credentials-file-location:
  unix:
    - ~/.config/goose/secrets.yaml
  windows:
    - '%APPDATA%\Block\goose\config\secrets.yaml'
history:
  adoption-history:
    - >
      Block reported that goose became an everyday tool for teams across the company,
      while the project later attracted an external developer and extension community.
    - >
      In 2026 Block donated goose to the Agentic AI Foundation at the Linux Foundation,
      moving it toward vendor-neutral community governance.
  package-nerd-significance:
    - >
      goose is notable as a locally run, provider-flexible agent available as both a
      graphical application and command-line tool. Its early and extensive use of MCP
      made it a useful reference point in the packaging of extensible AI agents.
    - >
      For package users, the shared CLI/Desktop configuration, headless-friendly secret
      fallback, cross-platform releases, and recipe-based automation make it useful
      beyond interactive coding assistants.
  project-history:
    - >
      goose began inside Block as an on-machine agent intended to automate engineering
      maintenance and repetitive work. Its earliest implementation was a Python terminal
      application; the project subsequently adopted a Rust CLI and an Electron desktop
      client.
    - >
      Block released codename goose as open source in 2024. The project expanded from
      engineering automation into a general-purpose agent for research, writing, data
      analysis, and other tool-driven workflows.
    - >
      In April 2026 goose moved from Block to the Agentic AI Foundation. Its
      documentation and source organization moved with it, while the project retained
      its open-source mission.
  related-projects:
    - Model Context Protocol (MCP)
    - Agent Client Protocol (ACP)
    - Agentic AI Foundation (AAIF)
  sources:
    - https://goose-docs.ai/
    - https://goose-docs.ai/blog/2025/04/21/mcp-in-enterprise/
    - https://goose-docs.ai/blog/2026/04/07/goose-moves-to-aaif/
    - https://goose-docs.ai/blog/2026/04/08/goose-acp-and-new-tui/
    - >
      https://investors.block.xyz/files/doc_financials/2024/q4/Shareholder-Letter_Block-4Q24pdf.pdf
  summary:
    - >
      goose is an open-source, local AI agent created at Block and later donated to the
      Agentic AI Foundation. It supports desktop, terminal, and API use and can connect
      models to tools through MCP extensions.
  timeline:
    - '2024: Block publicly released codename goose as an open-source on-machine agent.'
    - '2025: Block documented company-wide use of goose and MCP-based integrations.'
    - '2026: Block donated goose to the Agentic AI Foundation.'
    - >
      2026: The project began a goose 2.0 architecture centered on ACP and new TUI and
      desktop clients.
  usage:
    - >
      Users configure an LLM provider, then run goose through its desktop interface or
      CLI for coding, research, writing, automation, and data-oriented tasks.
    - >
      Extensions connect goose to local tools and external services through MCP. Recipes
      capture repeatable workflows as portable YAML definitions.
    - >
      The primary settings file is config.yaml. Provider secrets normally use the
      operating-system keyring; secrets.yaml is used only when file-based secret storage
      is selected or the keyring is unavailable.
