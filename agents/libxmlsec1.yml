history:
  adoption-history:
    - >
      xmlsec entered packaging systems because XML signatures are part of
      standards-heavy environments: SAML, document signing, SOAP-era security stacks,
      identity federation, and government or enterprise XML workflows. The project also
      published interoperability reports for XML Digital Signature and XML Encryption,
      which helped it function as a reference-quality implementation rather than a
      private library.
  package-nerd-significance:
    - >
      libxmlsec1 is significant because it connects the XML parser stack to the
      cryptographic stack. Its ABI, crypto backend defaults, and security hardening
      choices can affect language bindings and applications that validate signed XML, so
      distributions treat it as security-sensitive plumbing rather than a casual XML
      helper.
  project-history:
    - >
      Aleksey Sanin released XML Security Library 0.0.1 on 2002-03-17. Within weeks the
      project added online XML signature verification, test-suite work, a mailing list,
      RPM packages, and XML Encryption support.
    - >
      The 1.0.0 release on 2003-04-17 was a major upgrade from the 0.0.x series, adding
      multiple crypto engines with support for OpenSSL, GnuTLS, and NSS, plus cleaned-up
      internals, documentation, tutorials, and examples. The project later maintained
      crypto-backend support for platform engines such as Microsoft CryptoAPI and MSCNG.
  related-projects:
    - >
      xmlsec is built around libxml2 and related XML standards such as XML Signature,
      XML Encryption, Canonical XML, and Exclusive Canonical XML. Its crypto backends
      include OpenSSL, GnuTLS, NSS, and Windows crypto providers.
  sources:
    - https://raw.githubusercontent.com/lsh123/xmlsec/master/README.md
    - https://www.aleksey.com/xmlsec/
    - https://www.aleksey.com/xmlsec/documentation.html
    - https://www.aleksey.com/xmlsec/news.html
  summary:
    - >
      XML Security Library, packaged by Homebrew as libxmlsec1, is the C implementation
      of XML Signature and XML Encryption workflows built on libxml2. Its command-line
      tool, xmlsec1, made XML digital-signature verification and signing scriptable on
      Unix-like systems.
  timeline:
    - '2002: XML Security Library 0.0.1 was released on 2002-03-17.'
    - '2002: XML Encryption support appeared in the 0.0.3 release on 2002-04-16.'
    - >
      2003: XML Security Library 1.0.0 was released on 2003-04-17 with multiple
      crypto-engine support.
    - >
      2023: XML Security Library 1.3.0 introduced ABI and API breaking changes for newer
      XML Signature and Encryption behavior.
    - >
      2026: XML Security Library 1.3.12 was announced on 2026-06-23 with additional
      crypto-algorithm support and transform-depth controls.
  usage:
    - >
      The package provides both a C library and the xmlsec1 CLI. Users sign, verify,
      encrypt, and decrypt XML documents, usually while selecting a crypto backend and
      supplying keys, certificates, or trust material through command-line options or
      application code.
related-packages:
  - id: brew:libxml2
    reason: >
      Use libxml2 alongside XML Security Library for the underlying XML parsing and
      canonicalization layer on which xmlsec is explicitly based.
    rel: adjacent_workflow
    sources:
      - https://github.com/lsh123/xmlsec/wiki
      - https://github.com/lsh123/xmlsec/blob/master/docs/md/tutorial/install.md
      - https://gnome.pages.gitlab.gnome.org/libxml2/devhelp/
  - id: brew:openssl@3
    reason: >
      Choose OpenSSL 3 as xmlsec's cryptographic backend when OpenSSL-compatible key,
      certificate, and algorithm support is required; upstream lists it as a supported
      and recommended backend.
    rel: adjacent_workflow
    sources:
      - https://github.com/lsh123/xmlsec/blob/master/docs/md/tutorial/install.md
      - https://docs.openssl.org/3.0/
