id: brew:maven
display-name: Apache Maven
repo: https://gitbox.apache.org/repos/asf/maven.git
docs:
  - https://maven.apache.org/guides
  - https://maven.apache.org/users/index.html
config-file-location:
  unix:
    - ~/.m2/settings.xml
credentials-file-location:
  unix:
    - ~/.m2/settings.xml
history:
  adoption-history:
    - >
      Maven became a default packaging and dependency idiom for Java because its
      repository model is shared beyond Maven itself. Apache's Maven Central
      documentation explicitly addresses both projects that use Maven for builds and
      projects that only want their releases added to the central repository.
    - >
      Homebrew, Debian-family, RPM-family, Chocolatey, Scoop, Nix, Pacman, and other
      package-manager entries in the input show Maven's broad CLI distribution footprint
      outside Java IDEs.
  package-nerd-significance:
    - >
      Maven matters to package nerds because it standardized much of the vocabulary of
      Java artifact packaging: groupId, artifactId, version, POM metadata, transitive
      dependency resolution, local caches, and central remote repositories. Even tools
      that compete with Maven frequently consume Maven repositories and Maven metadata.
  project-history:
    - >
      Maven's official site describes it as a build tool for Java projects that uses a
      Project Object Model to manage compilation, testing, and documentation. The Apache
      Maven source page also shows that the project is not a single repository in
      practice: full Maven sources span Maven core, plugins, components, skins, and
      related repositories, with a manifest repository used to check out the whole
      source tree.
    - >
      The release history documents Maven 3 as the maintained general-availability line
      and Maven 4 as a long-running alpha, beta, and release-candidate effort. That
      makes Maven unusual among CLI build tools: the user-facing command is compact, but
      the surrounding ecosystem of plugins, resolver components, repository layout, and
      site tooling is large and separately versioned.
  related-projects:
    - >
      Maven Central, Maven Resolver, Maven plugins, Maven Wrapper, Maven Daemon, Gradle,
      Apache Ant, Apache Ivy
  sources:
    - https://maven.apache.org/
    - https://maven.apache.org/configure.html
    - https://maven.apache.org/docs/history.html
    - https://maven.apache.org/guides/mini/guide-encryption.html
    - https://maven.apache.org/ref/3.9.16/maven-settings/settings.html
    - https://maven.apache.org/repository/index.html
    - https://maven.apache.org/scm.html
    - source_facts.package-manager-url
  summary:
    - >
      Apache Maven is the Apache Software Foundation's long-running Java build and
      project-management tool, centered on a project object model, dependency
      coordinates, plugins, and repository metadata.
  timeline:
    - '2002: Apache Maven site copyright history begins.'
    - '2010: Maven 3 line begins and later becomes the long-lived GA family.'
    - '2023: Maven 4 alpha releases appear in the official release history.'
    - '2024: Maven 4 beta and release-candidate series begins.'
    - >
      2026: Maven 3.9.x remains a maintained GA release line while Maven 4 release
      candidates continue.
  usage:
    - >
      Typical CLI use is `mvn` in a project containing a `pom.xml`, with per-user
      settings in `~/.m2/settings.xml` and project-local runner options in
      `.mvn/maven.config`, `.mvn/jvm.config`, and `.mvn/extensions.xml`. Credentials for
      remote repositories and mirrors live in the Maven settings model's `servers`
      entries, with encrypted-password support via `settings-security.xml`.
related-packages:
  - id: brew:gradle
    reason: >
      Choose Gradle when you want a flexible task-graph build model, build caching, and
      an official migration path from existing Maven POMs.
    rel: alternative
    sources:
      - https://maven.apache.org/what-is-maven.html
      - https://docs.gradle.org/current/userguide/migrating_from_maven.html
  - id: brew:ant
    reason: >
      Choose Apache Ant when you need an explicitly scripted target-and-task build with
      few imposed project conventions, optionally adding Ivy for dependency management.
    rel: alternative
    sources:
      - https://maven.apache.org/what-is-maven.html
      - https://ant.apache.org/
