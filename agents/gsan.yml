id: brew:gsan
display-name: GSAN
repo: https://github.com/franccesco/getaltname
docs:
  - https://franccesco.github.io/getaltname
  - https://github.com/franccesco/getaltname#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GSAN's adoption evidence is narrow but clear: it is packaged for Homebrew and Nix
      and documented for pipx and Docker use. Its audience is security practitioners
      doing subdomain enumeration, especially in cases where direct certificate
      inspection is useful for internal servers, self-signed certificates, or targets
      not covered by public Certificate Transparency logs.
  package-nerd-significance:
    - >
      GSAN is package-manager interesting as a tiny Python security CLI whose value
      comes from composing with other tools. It takes certificate metadata, emits target
      lists, and fits into Unix pipelines with Shodan, xargs, Docker, and Nmap.
  project-history:
    - >
      The GitHub repository was created in November 2017, and early releases appeared in
      March 2018. The release stream moved quickly through 0.x and 1.x versions in 2018,
      reached 3.x during 2018 and 2019, published 4.2.3 in October 2020, and published
      5.0.0 in August 2024.
    - >
      The README and GitHub Pages site present a focused tool: pass a domain or pipe
      domain and IP:PORT lists into `gsan`, extract DNS names from the certificate SAN
      extension, and optionally write output for other tools.
  related-projects:
    - Shodan is shown in the README as a source of HTTPS targets for GSAN.
    - Nmap is shown as a downstream consumer of GSAN output files.
    - >
      Certificate Transparency log tools are related but differ from GSAN's direct
      TLS-connection approach.
  sources:
    - https://api.github.com/repos/franccesco/getaltname
    - https://api.github.com/repos/franccesco/getaltname/releases?per_page=50
    - https://franccesco.github.io/getaltname/
    - https://github.com/franccesco/getaltname
  summary:
    - >
      GSAN, from the getaltname project, is a small reconnaissance CLI for extracting
      Subject Alternative Names from HTTPS certificates. Its distinctive point is that
      it connects directly to servers rather than relying on Certificate Transparency
      logs.
  timeline:
    - '2017: GitHub repository created.'
    - '2018: 0.2.0 through 2.0.0 releases published in March.'
    - '2018: 3.0.3 release published in July.'
    - '2019: 3.0.13 and v3.0.14 releases published.'
    - '2020: v4.2.3 release published.'
    - '2024: v5.0.0 release published.'
  usage:
    - >
      Basic usage is `gsan example.com`, producing the SAN DNS names found in the HTTPS
      certificate. The documentation also shows piping many targets with xargs, using
      Docker, combining results from Shodan, applying timeouts, writing an output file,
      and passing that output to Nmap.
related-packages:
  - id: brew:nmap
    reason: >
      Feed GSAN's output file to Nmap to scan the certificate-derived hostnames, a
      pipeline documented by GSAN itself.
    rel: adjacent_workflow
    sources:
      - https://github.com/franccesco/getaltname
      - https://franccesco.github.io/getaltname/
      - https://nmap.org/book/man-target-specification.html
tags:
