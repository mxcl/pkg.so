id: brew:goread
display-name: goread
repo: null
docs:
  - https://github.com/TypicalAM/goread#readme
config-file-location:
  unix:
    - ~/.config/goread/urls.yml
    - ~/.config/goread/colorscheme.json
    - ~/.config/goread/goread.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears modest and package-oriented. The README documents installation
      through `go install`, Homebrew, and the Arch User Repository, while the input
      facts also list Nix packaging.
    - >
      The README's install instructions and dependency credits place goread in the
      terminal-reader and Go TUI audience rather than in a broad desktop RSS-reader
      market.
  package-nerd-significance:
    - >
      goread is a compact example of the Charmbracelet-era Go TUI package ecosystem: a
      small single-user terminal app assembled from Bubble Tea, Lip Gloss, Cobra, and a
      domain library.
    - >
      Its documented config files are also package-manager useful because maintainers
      and users can smoke-test the binary without external services beyond feed URLs.
  project-history:
    - >
      The TypicalAM/goread repository was created in 2022. The README describes it as an
      RSS/Atom feed reader for the terminal that categorizes feeds, downloads articles
      for later use, supports offline mode, imports OPML, and uses a Bubble Tea TUI.
    - >
      The project follows the modern Go CLI/TUI pattern: Cobra for command flags, Bubble
      Tea and Lip Gloss for terminal UI, and gofeed for RSS/Atom parsing.
  related-projects:
    - Bubble Tea provides the TUI runtime.
    - Lip Gloss provides terminal styling.
    - Cobra provides command-line flag handling.
    - gofeed parses RSS and Atom feeds.
  sources:
    - https://github.com/TypicalAM/goread
    - https://github.com/TypicalAM/goread#readme
    - https://github.com/charmbracelet/bubbletea
    - https://github.com/mmcdole/gofeed
  summary:
    - >
      goread is a terminal RSS/Atom reader written in Go. Its package history is small
      but clear: a Bubble Tea TUI feed reader distributed through Go install, Homebrew,
      AUR, and Nix.
  timeline:
    - '2022: TypicalAM/goread repository created.'
    - '2024: README license text identifies Adam Piaseczny and GPL terms.'
    - '2020s: README documents Homebrew, AUR, Go install, and generated config-file paths.'
  usage:
    - >
      Users run goread to manage feed categories and read RSS/Atom articles in a
      terminal UI. The README documents generated configuration under
      `~/.config/goread`, including `urls.yml`, `colorscheme.json`, and `goread.yml`.
    - >
      The tool supports editing feeds through `goread edit urls`, custom keybindings
      through `goread edit config`, pywal-derived colors, OPML support, article
      downloads, and offline reading.
related-packages:
  - id: brew:newsboat
    reason: >
      Choose Newsboat for a mature, extensively documented terminal feed reader with
      query feeds, podcast handling, and remote synchronization; choose goread for a
      simpler Bubble Tea-based Go TUI.
    rel: alternative
    sources:
      - https://github.com/TypicalAM/goread#readme
      - https://newsboat.org/releases/2.44/docs/newsboat.html
