id: brew:bookloupe
display-name: bookloupe
repo: http://project.juiblex.co.uk/hg/bookloupe
docs:
  - http://project.juiblex.co.uk/hg/bookloupe/raw-file/tip/doc/bookloupe.txt
  - http://www.juiblex.co.uk/pgdp/bookloupe
config-file-location:
  unix:
    - bookloupe.ini in the current working directory
    - bookloupe.ini in the directory containing the bookloupe program
    - $XDG_CONFIG_HOME/bookloupe.ini
    - ~/.config/bookloupe.ini
  windows:
    - bookloupe.ini in the current working directory
    - bookloupe.ini in the directory containing the bookloupe program
    - '%LOCALAPPDATA%\bookloupe.ini'
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears narrow and community-specific. The input package metadata lists
      Homebrew as the only package manager, suggesting that bookloupe is packaged mainly
      for users who already know the Project Gutenberg proofreading workflow and want
      the CLI available on macOS.
  package-nerd-significance:
    - >
      bookloupe is interesting as a preservation-workflow package: a tiny,
      domain-specific CLI that exists because a volunteer text-production process needed
      repeatable local checks. Its package-manager footprint is small, but that is
      exactly the kind of niche tool package indexes keep discoverable.
  project-history:
    - >
      The supplied official homepage and documentation identify bookloupe with Project
      Gutenberg candidate-file checking. Its Mercurial repository URL in the current
      curation points to the author's project host, which fits the older small-tool
      pattern of a personal website plus lightweight source-control browser.
  related-projects:
    - Project Gutenberg is the target publication ecosystem named in the package description.
    - >
      Distributed Proofreaders is implied by the official pgdp homepage path and the
      candidate-file proofreading workflow.
  sources:
    - current_curation.config-file-location
    - current_curation.repo
    - source_facts.description
    - source_facts.executables
    - source_facts.homepage
    - source_facts.package-manager
  summary:
    - >
      bookloupe is a small proofreading helper for Project Gutenberg and Distributed
      Proofreaders workflows. It scans candidate text files for common formatting
      mistakes rather than acting as a general prose linter.
  timeline:
    - >
      Unknown: Project originated as a Project Gutenberg or Distributed Proofreaders
      formatting checker.
    - 'Unknown: Official documentation and Mercurial repository hosted under juiblex.co.uk.'
    - >
      Current input: Homebrew packages bookloupe with the `bookloupe` and `loupe-test`
      executables.
  usage:
    - >
      Users run bookloupe on a candidate text file to list likely formatting errors. The
      current curation records an ini-file search path that starts in the working
      directory and program directory, then falls back to XDG-style Unix config paths or
      a Windows local application-data file.
