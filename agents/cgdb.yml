id: brew:cgdb
display-name: CGDB
repo: https://github.com/cgdb/cgdb
docs:
  - https://cgdb.github.io/docs/cgdb.html
  - https://cgdb.github.io/docs/cgdb.pdf
config-file-location:
  unix:
    - $CGDB_DIR/cgdbrc
    - ~/.cgdb/cgdbrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The project ships official source releases and is packaged broadly in Unix package
      managers. Its NEWS file shows long-running portability work across Unix variants,
      macOS, Cygwin, and newer GDB releases.
  package-nerd-significance:
    - >
      CGDB is a classic terminal-packaging example: small, curses-based, tied to
      readline/ncurses/GDB behavior, and useful for developers who want source-level
      debugging without a graphical IDE.
  project-history:
    - >
      CGDB grew as a terminal debugger interface focused on keeping the familiar GDB
      prompt while adding a source window, syntax highlighting, breakpoints, and vi-like
      navigation. The manual identifies CGDB 0.8.0 as the GNU ncurses based front end to
      GDB.
  related-projects:
    - CGDB is built around GNU GDB and includes gdbwire for communicating with GDB.
  sources:
    - https://api.github.com/repos/cgdb/cgdb
    - https://github.com/cgdb/cgdb
    - https://cgdb.github.io/
    - https://cgdb.github.io/docs/cgdb.html
    - https://cgdb.github.io/docs/cgdb.pdf
    - https://formulae.brew.sh/api/formula/cgdb.json
    - https://github.com/cgdb/cgdb/blob/master/NEWS
    - https://github.com/cgdb/cgdb/blob/master/README.md
  summary:
    - >
      CGDB is a lightweight curses-based front end to GDB with a split source/GDB
      terminal interface modeled after vi.
  timeline:
    - '2003: NEWS records cgdb-0.4.0.'
    - '2006: cgdb-0.6.0 added a new manual and tab completion support.'
    - >
      2017: cgdb-0.7.0 added vertical/horizontal splitting, assembly support, and Rust
      syntax highlighting.
    - '2022: cgdb-0.8.0 moved to GDB/MI and implemented a virtual terminal in the GDB window.'
  usage:
    - >
      Users launch cgdb as a GDB front end, pass commands through the GDB window,
      navigate source in CGDB mode, and configure behavior through cgdbrc files under
      CGDB_DIR or ~/.cgdb.
related-packages:
  - id: brew:gdb
    reason: >
      Install GNU GDB as CGDB's underlying command-line debugger, or use GDB directly
      when scripting and a split-screen terminal interface are unnecessary.
    rel: adjacent_workflow
    sources:
      - https://cgdb.github.io/docs/cgdb.html
      - https://www.gnu.org/software/gdb/
  - id: brew:ddd
    reason: >
      Choose GNU DDD when you want a graphical debugger front end with interactive
      data-structure visualization; CGDB instead provides a lightweight curses-and-vi
      terminal workflow over GDB.
    rel: alternative
    sources:
      - https://cgdb.github.io/docs/cgdb.html
      - https://www.gnu.org/software/ddd/
tags:
  - cli
  - curses
  - debugger
  - gdb
  - terminal
