history:
  adoption-history:
    - >
      Canva grew from an Australian startup into a global visual-communication platform
      spanning web, desktop, iOS, and Android. In 2022, Canva announced that it had
      exceeded 100 million monthly users in more than 190 countries.
    - >
      Its adoption extends across individuals, businesses, schools, and nonprofit
      organizations. Canva attributes much of this reach to an accessible
      template-driven interface, collaboration features, a free tier, and dedicated
      Education, Nonprofits, Pro, and Enterprise offerings.
  package-nerd-significance:
    - >
      The desktop package provides an installed shell for a service whose primary
      identity is cloud-based. For package-manager users, it offers dock and
      file-manager integration, desktop link handling, multiple design tabs, and a
      familiar native launch point while retaining Canva's account-backed collaborative
      workflow.
  project-history:
    - >
      Canva launched in 2013 with a mission to make design accessible without requiring
      expensive software or extensive professional training. It developed from an online
      template-based design tool into a broad visual-communication suite for
      presentations, social media graphics, documents, websites, video, whiteboards, and
      collaborative work.
    - >
      The desktop application brings the Canva editor and workspace into a dedicated
      macOS or Windows application. Official help material documents desktop-specific
      tab management, operating-system file opening, dock integration on macOS, link
      handling, and restoration of recent work.
  related-projects:
    - >
      Canva's broader platform includes its web editor, mobile applications, Design
      School, and specialized Education, Nonprofits, Pro, and Enterprise offerings.
  sources:
    - https://www.canva.com/help/pagecanva-desktop-app-basics/
    - https://www.canva.com/newsroom/news/canva-reaches-100-million-users/
    - >
      https://www.canva.com/newsroom/news/canva-recognized-overall-design-collaboration-company-year-2021-remotetech-breakthrough-awards/
  summary:
    - >
      Canva is a visual-communication and collaborative design platform; this package
      installs its desktop application.
  timeline:
    - '2013: Canva launched as an Australian visual-design startup.'
    - '2021: Canva described its platform as available on desktop, web, iOS, and Android.'
    - '2022: Canva announced more than 100 million monthly users across over 190 countries.'
  usage:
    - >
      Users sign in to create or edit designs from templates or blank canvases,
      collaborate with others, manage projects in tabs, and export or share the results.
      The desktop application can open Canva links and supported files, restore recently
      used design tabs, and integrate with the macOS Dock or operating-system file
      manager.
