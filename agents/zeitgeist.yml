history:
  adoption-history:
    - >
      Zeitgeist is distributed as an Apple-platform client for Vercel users who want a
      dedicated view of projects and deployments. The project also provides widgets and
      background updates suited to monitoring deployments away from the Vercel web
      dashboard.
  package-nerd-significance:
    - >
      Zeitgeist is a small, open-source native client built around a hosted deployment
      platform's API. It is notable to package users as an example of cloud operations
      moving into a focused desktop or mobile status application rather than a browser
      tab or general-purpose CLI.
  project-history:
    - >
      Daniel Eden created Zeitgeist as a native SwiftUI client for monitoring Vercel
      projects and deployments. The application has evolved around refreshable
      deployment views, server-side filtering, background push notifications, and Lock
      Screen and Home Screen widgets.
  related-projects:
    - Vercel
    - SwiftUI
