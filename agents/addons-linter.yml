id: brew:addons-linter
display-name: addons-linter
repo: https://github.com/mozilla/addons-linter
docs:
  - https://github.com/mozilla/addons-linter#readme
  - https://mozilla.github.io/addons-linter
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official adoption is unusually direct: Mozilla documents that addons-linter is
      used by web-ext and addons.mozilla.org. That makes it part of the normal Firefox
      extension development and submission path, not just an optional local lint
      command.
    - >
      The package is published for Node users and packaged by Homebrew in the supplied
      metadata. The repository API shows an active Mozilla project with GitHub Pages
      documentation and regular tags through the 9.x and 10.x series.
  package-nerd-significance:
    - >
      addons-linter matters to package people because it is validation tooling at the
      boundary between a source tree and a distributable browser add-on. It encodes
      platform policy, extension packaging expectations, and submission-time checks in a
      reusable CLI that downstream package managers can install like any other
      development tool.
  project-history:
    - >
      The official GitHub repository was created in September 2015 under Mozilla. The
      README frames the linter as infrastructure for validating packaged or unpacked
      WebExtensions, with output suitable for developers and for automation.
    - >
      The linter's implementation is organized around scanners, rules, collectors, and
      reporters. The README says it relies heavily on ESLint for JavaScript, cheerio for
      HTML parsing, and Fluent tooling for language packs. As of November 2021,
      Mozilla's dispensary library-detection work was merged into the project and
      exposed through a CLI script.
  related-projects:
    - web-ext is documented as a consumer.
    - addons.mozilla.org / addons-server is documented as a consumer.
    - dispensary was merged into the repository.
  sources:
    - https://api.github.com/repos/mozilla/addons-linter
    - https://api.github.com/repos/mozilla/addons-linter/tags?per_page=20
    - https://github.com/mozilla/addons-linter#readme
    - https://mozilla.github.io/addons-linter/
    - source_facts.package-manager
  summary:
    - >
      addons-linter is Mozilla's JavaScript linter for Firefox add-ons and
      WebExtensions. It is both a standalone CLI and a library, and the README says it
      is used by web-ext and addons.mozilla.org.
  timeline:
    - '2015-09: GitHub repository created.'
    - '2021-11: dispensary was merged into addons-linter, according to the README.'
    - 'Current README: Node.js v22 or greater is required for development.'
  usage:
    - >
      Developers install it globally from npm or use the packaged binary, then run
      addons-linter against an XPI/ZIP file or an extension source directory. It reports
      errors, warnings, notices, metadata, and JSON output for automation.
    - >
      Library users can create a linter instance directly from JavaScript, pass config
      that mirrors CLI options, and consume structured linter results. The README also
      documents privileged-extension behavior behind the --privileged flag.
related-packages:
  - id: brew:web-ext
    reason: >
      Use web-ext alongside addons-linter to run, build, and sign Firefox extensions;
      Mozilla documents that web-ext consumes addons-linter for its lint command.
    rel: adjacent_workflow
    sources:
      - https://github.com/mozilla/addons-linter#readme
      - https://extensionworkshop.com/documentation/develop/web-ext-command-reference/
