history:
  adoption-history:
    - >
      jxl-oxide matters because JPEG XL support often depends on embeddable decoder
      libraries. The README documents a blanket `jxl-oxide` crate for library users and
      a `jxl-oxide-cli` crate that installs the command-line binary, while the crates.io
      and docs.rs badges show it is distributed through Rust's normal package
      infrastructure.
  package-nerd-significance:
    - >
      For package nerds, jxl-oxide is a signal package: it turns a modern image format
      with complicated browser and platform politics into a Rust-native decoder that can
      be packaged, audited, fuzzed, and embedded without C++ runtime assumptions.
  project-history:
    - >
      The project emerged during the broader JPEG XL adoption debate as an independent
      Rust implementation rather than a binding to the C++ libjxl reference
      implementation. Its changelog marks version 0.1.0 on May 17, 2023 as the first
      official release and says frequently used features were mostly implemented at that
      point.
    - >
      The project then expanded from a basic decoder into a set of smaller crates and
      integrations. The changelog records cropped decoding and output-format options in
      0.4.0, parallel decoding and SIMD work in 0.5.0, HDR tone mapping and external
      color-management hooks in 0.6.0, WebAssembly bindings in 0.7.0, image crate
      integration work in 0.10.0 and 0.12.5, JPEG bitstream reconstruction in 0.11.0,
      and Rust 2024 adoption in 0.12.0.
  related-projects:
    - >
      Related projects include the JPEG XL standard and libjxl reference implementation,
      Rust image-processing crates that can consume decoder hooks, and color-management
      libraries such as lcms2 and moxcms.
  sources:
    - https://crates.io/crates/jxl-oxide
    - https://docs.rs/crate/jxl-oxide/
    - https://github.com/tirr-c/jxl-oxide
    - https://github.com/tirr-c/jxl-oxide/blob/main/CHANGELOG.md
    - https://jpeg.org/jpegxl/
  summary:
    - >
      jxl-oxide is a pure-Rust, spec-conforming JPEG XL decoder distributed both as Rust
      crates and as a command-line decoder binary named `jxl-oxide`.
  timeline:
    - '2023-05-17: 0.1.0 first official release.'
    - '2023-11-21: 0.5.0 introduces parallelism and a pushed-data decoder API.'
    - '2024-01-13: 0.6.0 adds HDR tone mapping and color-management integration points.'
    - '2024-02-24: 0.7.0 adds WebAssembly bindings.'
    - '2024-12-28: 0.11.0 implements JPEG bitstream reconstruction.'
    - '2025-09-30: 0.12.5 adds an `image` crate decoding hook.'
    - '2026-05-29: 0.12.6 fixes several security and correctness issues.'
  usage:
    - >
      Library users add the `jxl-oxide` crate to `Cargo.toml`; command-line users
      install `jxl-oxide-cli` with Cargo and run the `jxl-oxide` binary. Feature flags
      expose choices such as Rayon multithreading, Little CMS 2 integration, pure-Rust
      moxcms integration, and integration with the Rust `image` crate.
related-packages:
  - id: brew:jpeg-xl
    reason: >
      Choose the libjxl-based JPEG XL package when you need the official reference
      implementation and both encoding and decoding; choose jxl-oxide for a Rust-native
      decoder.
    rel: alternative
    sources:
      - https://jpeg.org/jpegxl/software.html
      - https://github.com/libjxl/libjxl
      - https://github.com/tirr-c/jxl-oxide
