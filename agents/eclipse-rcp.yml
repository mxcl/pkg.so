id: cask:eclipse-rcp
display-name: Eclipse IDE for RCP and RAP Developers
repo: https://github.com/eclipse-packaging/packages
docs:
  - https://eclipse.dev/eclipse
  - https://help.eclipse.org/latest/index.jsp
  - https://www.eclipse.org/downloads/packages
config-file-location:
  macos:
    - /Applications/Eclipse.app/Contents/Eclipse/eclipse.ini
    - /Applications/Eclipse.app/Contents/Eclipse/configuration/config.ini
credentials-file-location:
  unix:
    - ~/.eclipse/org.eclipse.equinox.security/secure_storage
history:
  adoption-history:
    - >
      The RCP and RAP edition is a curated Eclipse Packaging Project profile. By
      bundling PDE and related tooling, it became a convenient starting point for
      developers producing desktop Eclipse plug-ins, standalone rich-client products,
      and RAP applications rather than assembling those components manually.
    - >
      Official Eclipse package catalogs have carried an RCP/RAP developer profile since
      at least the Indigo release era, reflecting the established use of Eclipse
      technology beyond the Java IDE itself.
  package-nerd-significance:
    - >
      This package highlights Eclipse as a platform for shipping other applications, not
      merely as an IDE. For packaging specialists it exposes product definitions, target
      platforms, OSGi bundles, native SWT fragments, p2 repositories, and the
      distinction between a development IDE and the application being built.
  project-history:
    - >
      The Eclipse Platform was open-sourced in 2001 and placed under the independent
      Eclipse Foundation in 2004. Its extensible workbench and plug-in model became the
      basis for the Eclipse Rich Client Platform.
    - >
      The Eclipse Packaging Project, created in 2007, assembles the RCP/RAP developer
      product as the `epp.package.rcp` profile from coordinated Simultaneous Release
      content.
  related-projects:
    - Eclipse Platform and Equinox provide the workbench, services, and OSGi runtime.
    - Eclipse PDE supplies plug-in, feature, product, and target-platform tooling.
    - Eclipse RCP is the desktop application model built on the Platform.
    - >
      Eclipse RAP supports remotely delivered applications using an RCP-like programming
      model.
    - Eclipse Packaging Project builds the downloadable distribution.
  sources:
    - https://github.com/eclipse-packaging/packages
    - https://projects.eclipse.org/projects/eclipse.platform
    - https://projects.eclipse.org/projects/technology.packaging
    - https://www.eclipse.org/about/
    - https://www.eclipse.org/downloads/packages/
  summary:
    - >
      Eclipse IDE for RCP and RAP Developers is the preassembled Eclipse distribution
      for building plug-ins, desktop Rich Client Platform applications, and Remote
      Application Platform applications.
  timeline:
    - '2001: The Eclipse Platform was released as open source.'
    - '2004: The Eclipse Foundation became its independent steward.'
    - '2007: The Eclipse Packaging Project was created.'
    - >
      2011: The official Indigo package catalog included an RCP and RAP Developers
      distribution.
    - >
      Present: The `epp.package.rcp` profile is built from quarterly Eclipse
      Simultaneous Releases.
  usage:
    - >
      Developers use this edition to create and test Eclipse plug-ins, define features
      and products, manage target platforms, launch runtime workbenches, and package RCP
      or RAP applications. Maven and Gradle tooling and an XML editor support typical
      product-build workflows.
