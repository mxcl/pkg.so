history:
  adoption-history:
    - >
      RescueTime grew from a desktop activity-measurement service into a cross-device
      productivity platform used by millions of people. Its product scope expanded
      beyond retrospective reports to include distraction blocking, goals, alerts, Focus
      Sessions, mobile applications, team reporting, and automated timesheets.
    - >
      The company has repeatedly refined the balance between its original detailed
      analytics and a more active focus-oriented product. Official product-history
      commentary describes the present platform as an effort to combine historical time
      detail, focus tools, goal setting, forecasting, and timesheets.
  package-nerd-significance:
    - >
      RescueTime is an early and durable example of background quantified-work software.
      Installing its desktop package turns application and website activity into a
      long-running personal dataset rather than requiring manual timer operation.
    - >
      For package users, the important operational detail is that installing the app
      alone is insufficient: the Assistant must be activated, remain running, and
      receive the required operating-system permissions for detailed tracking.
  project-history:
    - >
      The idea for RescueTime was incubated around 2007 by Joe Hruska, Tony Wright, and
      Brian Fioca and taken through Y Combinator. The project was motivated by a desire
      to give people a clearer picture of how they spend time on computers.
    - >
      Over the following years RescueTime established its identity around
      high-resolution digital-life statistics and distraction management. It later added
      FocusTime, now called Focus Sessions, and broadened into mobile views, goals,
      alerts, team features, and timesheets.
  related-projects:
    - >
      The RescueTime Assistant is the desktop component that records activity and
      exposes real-time focus controls.
    - >
      RescueTime's web dashboard provides reports, activity categorization, goals,
      privacy settings, and account management.
    - >
      Browser extensions supplement website tracking, with Firefox requiring an
      extension on macOS.
  sources:
    - >
      https://blog.rescuetime.com/joe-hruska-founder-and-ceo-of-rescuetime-passed-away-july-4th-2017/
    - https://blog.rescuetime.com/remote-work-is-under-attack-but-were-standing-our-ground/
    - >
      https://community.rescuetime.com/t/recent-product-history-and-hopes-going-forward-2025/1311
    - https://help.rescuetime.com/article/413-the-rescuetime-assistant
    - https://help.rescuetime.com/article/455-navigating-the-rescuetime-website
  summary:
    - >
      RescueTime is a long-running productivity service whose desktop Assistant records
      application and website activity, classifies time, builds reports, and supports
      goals, alerts, Focus Sessions, and timesheets.
  timeline:
    - 'Around 2007: The RescueTime idea was incubated and taken to Y Combinator.'
    - '2010s: Detailed activity reporting expanded with distraction-management and focus tools.'
    - >
      2018: RescueTime introduced new iOS and Android experiences for a broader
      cross-device view.
    - >
      2020s: The product worked toward unifying analytics, Focus Sessions, goals,
      forecasting, team features, and timesheets.
  usage:
    - >
      Install and activate the desktop Assistant, leave it running during periods to be
      measured, and review categorized activity through the web dashboard. Users can
      adjust productivity scores, work schedules, privacy detail, ignored activities,
      goals, and alerts.
    - >
      On macOS, Accessibility and Automation permissions enable detailed app and browser
      tracking. Firefox additionally requires RescueTime's browser extension. Tracking
      can be paused, but activity omitted during a pause cannot be recovered.
