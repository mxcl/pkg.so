id: brew:dnsperf
display-name: dnsperf
repo: https://codeberg.org/DNS-OARC/dnsperf
docs:
  - https://codeberg.org/DNS-OARC/dnsperf/src/branch/develop/README.md
  - https://www.dns-oarc.net/tools/dnsperf
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      dnsperf has long been packaged as an operator tool rather than an application
      platform. DNS-OARC publishes release tarballs and checksums, the Homebrew formula
      distributes it on macOS, and the upstream page points users to sample query data
      for repeatable benchmark workloads.
  package-nerd-significance:
    - >
      dnsperf matters to package nerds because it is the boring, standard DNS benchmark
      that shows up when resolver performance claims need numbers. It also carries a
      useful lineage: commercial DNS tooling from Nominum/Akamai became
      community-maintained DNS-OARC infrastructure, with release tarballs, checksums,
      man pages, and sample data.
  project-history:
    - >
      The official DNS-OARC page and README describe dnsperf and resperf as free tools
      developed by Nominum/Akamai from 2006 through 2018 and by DNS-OARC since 2019. The
      archived downloads on the DNS-OARC page preserve the older Nominum/Akamai
      releases, while the current source repository lives under DNS-OARC on Codeberg.
    - >
      The project evolved around realistic DNS benchmarking: dnsperf self-paces query
      load to simulate network conditions, records latency, supports IPv6 query files,
      and added multithreaded operation for multicore clients. resperf covers the
      related caching-recursive case by increasing query rate and watching response
      rate.
  related-projects:
    - >
      resperf ships with dnsperf and covers recursive caching DNS performance. DNS-OARC
      sample-query-data is the companion data set for benchmark input. LDNS, OpenSSL,
      nghttp2, json-c, and Concurrency Kit appear in the README as build or feature
      dependencies.
  sources:
    - https://www.dns-oarc.net/tools/dnsperf
    - https://codeberg.org/DNS-OARC/dnsperf/src/branch/main/README.md
    - https://codeberg.org/DNS-OARC/dnsperf/src/branch/main/CHANGES
    - https://formulae.brew.sh/formula/dnsperf
  summary:
    - >
      dnsperf is a DNS load and latency measurement tool, usually paired with resperf.
      It is part of the operational DNS toolkit: less a casual diagnostic command than a
      benchmark tool for operators who need repeatable throughput and latency numbers
      from authoritative or recursive DNS infrastructure.
  timeline:
    - '2006: Nominum era begins for dnsperf and resperf.'
    - '2018: Akamai era ends according to the current DNS-OARC README.'
    - >
      2019: DNS-OARC stewardship begins and 2.2.x/2.3.x release tarballs appear on the
      official release list.
    - '2021: dnsperf 2.5.x through 2.9.0 releases are published by DNS-OARC.'
    - '2026: dnsperf 2.15.1 is published on the DNS-OARC release list.'
  usage:
    - >
      Operators feed dnsperf or resperf a file of DNS queries and target DNS servers,
      then use the results to compare latency, throughput, cache behavior, and upgrade
      capacity. The README points users to the dnsperf(1) and resperf(1) manual pages,
      and the upstream page emphasizes using latency output for graphs and planning.
related-packages:
  - id: brew:dnspyre
    reason: >
      Choose dnspyre when the benchmark must cover modern encrypted transports such as
      DoT, DoH, and DoQ or produce built-in plots; dnsperf remains the established
      DNS-OARC suite with separate authoritative and caching-oriented tools.
    rel: alternative
    sources:
      - https://www.dns-oarc.net/tools/dnsperf
      - https://tantalor93.github.io/dnspyre/
