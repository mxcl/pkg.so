history:
  adoption-history:
    - >
      iwdp became a bridge package for teams wanting browser-style remote debugging of
      iOS web content outside Safari's native workflow. Homebrew and Nix packaging in
      the input metadata, Scoop packaging in the README and input metadata, and Linux
      build instructions in the README show its cross-platform package footprint.
  package-nerd-significance:
    - >
      For package nerds, ios-webkit-debug-proxy is significant because it packages an
      awkward protocol bridge: Apple device discovery through usbmuxd and
      libimobiledevice on one side, WebKit Inspector and DevTools-style WebSocket
      clients on the other. It is the kind of dependency that unlocks automation stacks,
      mobile web testing, and cross-browser debugging workflows.
  project-history:
    - >
      Google's repository dates to 2013 and carries a 2012 Google copyright notice in
      the README and design document. The design document lays out a C codebase split
      into a main proxy, WebInspector translator, device listener, WebSocket layer, port
      configuration, and single-threaded non-blocking socket manager.
    - >
      The project evolved around the moving boundary between WebKit Inspector Protocol,
      Chrome DevTools, Safari Web Inspector, libimobiledevice, and usbmuxd. The README
      documents support across Linux, macOS, and Windows, dependency builds for
      libplist/libusbmuxd/libimobiledevice/usbmuxd, and troubleshooting for iOS and
      browser-protocol changes.
  related-projects:
    - >
      The README directly names libplist, libusbmuxd, libimobiledevice, usbmuxd, Chrome
      DevTools, WebKit Inspector Protocol, Safari Web Inspector frontends, and Mozilla
      Valence as related technologies. Those relationships explain why the package
      appears in both developer-tool and mobile-web debugging contexts.
  sources:
    - https://formulae.brew.sh/formula/ios-webkit-debug-proxy
    - https://github.com/google/ios-webkit-debug-proxy
    - https://raw.githubusercontent.com/google/ios-webkit-debug-proxy/master/README.md
    - https://raw.githubusercontent.com/google/ios-webkit-debug-proxy/master/design.md
  summary:
    - >
      iOS WebKit Debug Proxy, also known as iwdp, proxies requests from usbmuxd over
      WebSocket so developer tools can send commands to MobileSafari and UIWebViews on
      real or simulated iOS devices. Its upstream README describes it as a DevTools
      proxy for iOS Safari Remote Web Inspector.
  timeline:
    - '2012: README and design document carry Google copyright notices.'
    - '2013: GitHub repository created and version 1.0 tag appears in the Git history.'
    - >
      2015: README notes the Chrome DevTools frontend URL changed from devtools.html to
      inspector.html in Chrome 45-era tooling.
    - '2025: Version v1.9.2 tag used by Homebrew as the stable source archive.'
  usage:
    - >
      Users start an iOS simulator or attach a device, enable Safari's Web Inspector,
      run ios_webkit_debug_proxy, and open the local device list or JSON endpoints. The
      proxy assigns ports beginning with a device-list page and then per-device DevTools
      endpoints, allowing WebSocket clients and browser frontends to inspect pages.
related-packages:
  - id: brew:libimobiledevice
    reason: >
      Install libimobiledevice for the native iOS service communication and device
      utilities that the proxy's Linux build and troubleshooting workflow explicitly
      requires.
    rel: adjacent_workflow
    sources:
      - https://github.com/google/ios-webkit-debug-proxy
      - https://github.com/libimobiledevice/libimobiledevice
  - id: brew:libusbmuxd
    reason: >
      libusbmuxd supplies the client-side USB multiplexing layer used to reach iOS
      device services through the usbmuxd socket.
    rel: adjacent_workflow
    sources:
      - https://github.com/google/ios-webkit-debug-proxy
      - https://github.com/libimobiledevice/libusbmuxd
