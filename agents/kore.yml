id: brew:kore
display-name: Kore
repo: https://git.kore.io/kore.git
docs:
  - https://docs.kore.io/4.2.0
config-file-location:
  unix:
    - conf/kore.conf
    - conf/build.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Kore did not become a mainstream web framework in the way higher-level language
      frameworks did, but it found a niche among developers who want a compact C/Python
      server with explicit TLS, worker, and security controls. The official site says it
      has been used in high-assurance cryptographic devices, machine-learning stacks,
      and aerospace applications.
    - >
      Its package-manager adoption is specialist: Homebrew, Nix, and Ubuntu packaging in
      the input data put it in reach of systems programmers who want to experiment with
      or deploy C-based web services without manually building from upstream tarballs.
  package-nerd-significance:
    - >
      Kore is package-nerd significant because it keeps alive a specific kind of Unix
      tool: a lean, source-available web platform with first-class TLS, privilege
      separation, and explicit server controls.
    - >
      For Homebrew users, it is the kind of formula that exposes a lesser-known systems
      framework without needing language-specific package managers or application
      scaffolding.
  project-history:
    - >
      The official site describes Kore as a platform for scalable, concurrent web
      processes in C or Python, with privilege separation and operating-system security
      features such as seccomp, pledge, and unveil. The official source browser lists
      Joris Vink as the dominant author across release tags and commits.
    - >
      Kore's tagged release history reaches at least 1.1-release on 2014-03-01. The
      project moved through 2.0.0 in 2016, 3.x in 2018 and 2019, and 4.x beginning with
      4.0.0 on 2020-08-26. The 4.2.0 documentation series was tagged on 2022-03-18, and
      the public site lists 4.2.3 as the release displayed on its front page.
  related-projects:
    - >
      Kore belongs near other C or systems-oriented HTTP stacks such as nginx modules,
      libevent/libev-based servers, h2o, facil.io, civetweb, and embedded HTTP
      frameworks.
    - >
      Its security model also relates it to OpenBSD-originated ideas such as pledge and
      unveil, and to Linux seccomp-based service hardening.
  sources:
    - https://docs.kore.io/4.2.0/
    - https://git.kore.io/kore/
    - https://git.kore.io/kore/refs.html
    - https://kore.io/
  summary:
    - >
      Kore is a C and Python web application platform centered on high-concurrency
      servers and secure-by-default operating-system isolation. In package catalogs it
      represents the small but enduring tradition of C-native web frameworks and
      application servers.
  timeline:
    - '2014-03-01: 1.1-release tag appears in the official source browser.'
    - '2016-08-01: 2.0.0-release tag appears.'
    - '2018-07-09: 3.0.0-release tag appears.'
    - '2020-08-26: 4.0.0 tag appears.'
    - '2022-03-18: 4.2.0 tag appears.'
    - '2022-08-22: 4.2.3 tag appears.'
  usage:
    - >
      Kore applications are built around project files such as `conf/kore.conf` and
      `conf/build.conf`, with `kodev` helping create and build projects. Users choose it
      when they want a self-contained server/application framework rather than a library
      embedded inside a larger HTTP server.
    - >
      The Python runtime work visible in the source history shows Kore evolving beyond
      pure C services while retaining its operating-system-level security posture.
related-packages: []
tags:
  - c
  - cli
  - http-server
  - python
  - tls
  - web-framework
