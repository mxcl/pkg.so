id: brew:fish
display-name: fish
repo: null
docs:
  - https://fishshell.com/docs/current
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/fish/config.fish
    - ~/.config/fish/config.fish
credentials-file-location: null
history:
  adoption-history:
    - >
      fish is widely packaged across Unix-like systems. The upstream README documents
      Homebrew, MacPorts, official installers, Linux packages through openSUSE Build
      Service and Ubuntu PPAs, WSL, Cygwin, and MSYS2; the Homebrew input also records
      packages for apk, Debian, Fedora, Nix, pacman, Ubuntu, and zypper.
  package-nerd-significance:
    - >
      fish matters in package-manager culture because it is both an application and a
      shell integration target. Packages often ship fish completions, prompts and plugin
      managers target its function/completion layout, and distributors track changes
      such as fish 4.x moving more implementation and packaging work into Rust/Cargo-era
      build requirements.
  project-history:
    - >
      fish grew as an alternative to traditional POSIX-family interactive shells by
      choosing user experience over strict POSIX compatibility. Official documentation
      still calls out that fish is not the default shell and that some behavior differs
      from bash-like shells, which is central to its identity.
    - >
      The current upstream repository was created on GitHub in 2012, while the release
      notes preserve a longer line of 2.x, 3.x, and 4.x releases. Version 3.0.0 arrived
      in December 2018, 3.7.0 in January 2024, and 4.0.0 in February 2025, after a beta
      in December 2024.
  related-projects:
    - >
      Related projects include bash, zsh, POSIX sh, shell completion packages, prompt
      frameworks, fish-lsp, and editor integrations for fish scripts.
  sources:
    - https://fishshell.com/
    - https://fishshell.com/docs/current/
    - https://fishshell.com/docs/current/relnotes.html
    - https://github.com/fish-shell/fish-shell
    - https://github.com/fish-shell/fish-shell/releases
  summary:
    - >
      fish, the friendly interactive shell, is a Unix command-line shell focused on
      interactive ergonomics: syntax highlighting, autosuggestions, rich completions, a
      clean scripting language, and useful defaults without extensive configuration.
  timeline:
    - '2012: Current GitHub repository created.'
    - '2018: fish 3.0.0 released.'
    - '2024: fish 3.7.0 released.'
    - '2025: fish 4.0.0 released.'
    - '2026: fish 4.8.0 released.'
  usage:
    - >
      Users commonly install fish alongside their system shell, run `fish` from an
      existing shell to try it, then make it their login shell if the syntax and
      interactive model fit. Configuration centers on `config.fish`, functions,
      completions, universal variables, and prompt/theme customization.
related-packages:
  - id: brew:fish-lsp
    reason: >
      fish-lsp adds completion, diagnostics, navigation, rename, formatting, and other
      editor-language features specifically for fish scripts.
    rel: adjacent_workflow
    sources:
      - https://www.fish-lsp.dev/
      - https://fishshell.com/docs/current/language.html
  - id: brew:bash
    reason: >
      Bash is the more portable Bourne-family choice for environments that require
      POSIX-adjacent scripting, while fish deliberately prioritizes interactive
      ergonomics and uses different syntax.
    rel: alternative
    sources:
      - https://fishshell.com/docs/current/fish_for_bash_users.html
      - https://www.gnu.org/software/bash/
