history:
  adoption-history:
    - >
      MeetMic evolved from a focused local transcription application into a broader
      capture and productivity tool. Releases during 2024 added meeting recording,
      speaker detection, transcript search, labels, and editing; releases in 2025 added
      projects, multi-track and batch transcription, dictation, automation, and AI
      summaries.
    - >
      The official site states that thousands of people use the application. Its
      adoption pitch emphasizes private on-device processing, support for more than 100
      languages, and a one-time-purchase model rather than per-minute cloud billing.
  package-nerd-significance:
    - >
      MeetMic is notable for packaging modern speech models and transcription workflows
      as a local-first Mac application. Its command-line client, local REST API, MCP
      server, webhooks, watch folders, numerous export formats, and bring-your-own-key
      AI integrations make it useful beyond its graphical interface.
    - >
      The local processing model appeals to privacy-conscious users and avoids the
      upload queues and usage-metered billing common to hosted transcription services.
  project-history:
    - >
      MeetMic 1.0 was released in July 2024 as an on-device transcription application
      for macOS. Rapid subsequent releases added online-meeting capture, speaker
      diarization, editing, search, project organization, and batch and multi-track
      processing.
    - >
      During 2025 and 2026, the product expanded into system-wide dictation,
      calendar-aware meeting capture, AI summaries, automation integrations, a
      command-line interface, a local API, and MCP support. The application continued to
      offer local transcription while allowing optional cloud summarization through
      users' own provider keys.
  related-projects:
    - >
      MeetMic can connect to Obsidian, Notion, Zapier, Make, n8n, webhooks, and REST
      clients. It can optionally use OpenAI, Anthropic, Google, and other model
      providers through bring-your-own-key integrations, while local speech and language
      models support offline workflows.
  sources:
    - https://meetmic.app/
    - https://meetmic.app/changelog
    - https://meetmic.app/press-kit
    - https://meetmic.app/use-cases/engineering
  summary:
    - >
      MeetMic is a local-first macOS and iOS application for recording meetings,
      dictating text, transcribing media, editing transcripts, and generating summaries.
      Its defining design is on-device transcription without a meeting bot.
  timeline:
    - '2024-07: MeetMic 1.0 was released.'
    - '2024-08: Online-meeting recording was added.'
    - '2024-09: Speaker diarization entered beta.'
    - '2025-02: Projects and multi-track transcription were added.'
    - '2025-08: System-wide dictation and additional on-device models were introduced.'
    - '2025-10: Automation and system integrations expanded.'
    - '2026-02: Custom models, a local API server, and agent integrations were added.'
    - >
      2026-08: Command-line and additional on-device transcription capabilities were
      introduced.
  usage:
    - >
      Users record system or per-application audio from conferencing tools, dictate into
      other applications, or import individual files and folders. MeetMic produces
      timestamped, speaker-labelled transcripts that can be searched, edited,
      summarized, and exported in formats including text, Markdown, subtitles, JSON,
      HTML, PDF, DOCX, and CSV.
    - >
      Transcription runs locally by default. Summaries can use a local model or an
      optional cloud provider configured with the user's own API key. Developers can
      automate work through the bundled CLI, local REST API, MCP server, watch folders,
      and webhooks.
