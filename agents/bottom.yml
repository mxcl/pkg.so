id: brew:bottom
display-name: bottom
repo: null
docs:
  - https://bottom.pages.dev/stable
  - https://bottom.pages.dev/stable/configuration/config-file
config-file-location:
  linux:
    - ~/.config/bottom/bottom.toml
    - $XDG_CONFIG_HOME/bottom/bottom.toml
  macos:
    - ~/Library/Application Support/bottom/bottom.toml
    - ~/.config/bottom/bottom.toml
    - $XDG_CONFIG_HOME/bottom/bottom.toml
  windows:
    - C:\Users\<USER>\AppData\Roaming\bottom\bottom.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      bottom is packaged across Homebrew, MacPorts, Debian/Ubuntu as `btm`, Arch, Nix,
      Chocolatey, Scoop, winget, and other ecosystems in the supplied package facts. Its
      GitHub repository metadata shows substantial community interest for a terminal
      monitor, with more than ten thousand stars by 2026.
    - >
      The first GitHub release was 0.1.0-alpha-1 in September 2019; by 2026 the project
      had a continuing nightly release stream and stable documentation.
  package-nerd-significance:
    - >
      bottom is part of the Rust rewrite wave in classic Unix terminal tools: a single
      static-feeling cross-platform binary, polished TUI, Cargo upstream, and broad
      downstream packaging. It matters less as a new monitoring primitive than as a
      successful packaging story for a modern terminal UX.
  project-history:
    - >
      Clement Tsang created the public bottom repository in August 2019. The README
      describes it as a customizable cross-platform graphical process/system monitor for
      the terminal, inspired by gtop, gotop, and htop.
    - >
      The project ships stable and nightly documentation, release binaries, Cargo
      installation, and many OS package-manager entries, making it a typical Rust CLI
      that escaped the Cargo-only ecosystem into native system package managers.
  related-projects:
    - htop is the long-running terminal process monitor that bottom cites as inspiration.
    - gtop and gotop are graphical terminal system monitors cited by bottom's README.
    - btop is another modern terminal resource monitor often considered by the same users.
  sources:
    - https://api.github.com/repos/ClementTsang/bottom
    - https://bottom.pages.dev/stable
    - https://bottom.pages.dev/stable/configuration/config-file
    - https://github.com/ClementTsang/bottom
    - source_facts.package-manager
  summary:
    - >
      bottom, invoked as `btm`, is a Rust terminal system monitor that packages the
      modern TUI system-dashboard experience for Linux, macOS, and Windows.
  timeline:
    - '2019: Public GitHub repository created.'
    - '2019: 0.1.0-alpha-1 published as the initial GitHub release.'
    - >
      2020s: Packaged by Homebrew, Linux distributions, Nix, Windows package managers,
      and Cargo.
    - '2026: Nightly release stream and stable docs remain active.'
  usage:
    - >
      Users run `btm` for interactive CPU, memory, network, disk, temperature, battery,
      and process views. The README emphasizes sorting, searching, tree mode, process
      termination, widget expansion, themes, and configurable layouts.
    - >
      Configuration is TOML-based and documented per platform; package users often
      install it as a friendlier alternative to combinations of `top`, `htop`, `iotop`,
      and ad hoc shell monitoring.
related-packages:
  - id: brew:htop
    reason: >
      Choose htop for a more traditional interactive process-table workflow; bottom
      explicitly names it as an inspiration and adds broader dashboard-style resource
      graphs.
    rel: alternative
    sources:
      - https://github.com/ClementTsang/bottom
      - https://htop.dev/
  - id: brew:btop
    reason: >
      Choose btop when you want another visually rich terminal resource monitor,
      implemented in C++ and continued from bashtop and bpytop.
    rel: alternative
    sources:
      - https://github.com/ClementTsang/bottom
      - https://github.com/aristocratos/btop
