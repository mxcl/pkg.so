history:
  adoption-history:
    - >
      XLISP-STAT found an audience in 1990s statistical computing, especially where
      interactive graphics and teaching mattered. Linux Journal introduced it in 1995 as
      a powerful, interactive, object-oriented statistical environment used for
      scientific work, statistical computation, matrix manipulation, hypertext
      illustrations, and teaching tasks.
    - >
      Its influence also spread through projects built on top of it. ViSta described
      itself as written in Lisp using XLispStat extensions and presented XLisp-Stat as
      open, extensible, freely available, and meant for high-level statistical
      programming and dynamic graphics.
    - >
      Usage declined as R and other environments took over statistical computing. The
      Journal of Statistical Software published both Tierney's retrospective and Jan de
      Leeuw's account of abandoning XLISP-STAT, making the package a documented case
      study in how research software can be influential yet lose ground to a broader
      ecosystem.
  package-nerd-significance:
    - >
      XLISP-STAT matters to package nerds because it is a fossil with fingerprints
      everywhere: an installable scientific environment that anticipated programmable
      statistics, object-oriented model objects, and linked interactive graphics.
    - >
      It is also a reminder that scientific package history is not only a straight line
      toward Python and R. Lisp-Stat explored many of the same questions earlier: what
      should a statistical language look like, how should graphics and models be
      objects, and how much extensibility should users have?
  project-history:
    - >
      Tierney's Lisp-Stat information page describes the system as an extensible
      statistical computing environment with an emphasis on dynamic graphical methods.
      It is based on Lisp, extends arithmetic over lists and vectors, adds statistical
      and linear-algebra functions, and uses a prototype-based object system for
      graphics and statistical model representations.
    - >
      Tierney's 2005 retrospective says Lisp-Stat began in the mid-1980s as a framework
      for experimenting with dynamic graphics in statistics. The initial motivation was
      to go beyond point-cloud rotation and experiment with linked brushing, interactive
      scatterplot matrices, and displays integrated with a language for data
      manipulation.
    - >
      The system was documented in Tierney's 1990 Wiley book, LISP-STAT: An
      Object-Oriented Environment for Statistical Computing and Dynamic Graphics. By the
      mid-1990s, public articles described it as running across Microsoft Windows,
      Macintosh, and Unix/X11 systems with a relatively uniform interface.
  related-projects:
    - >
      XLISP and XLISP-PLUS are the Lisp-family substrate. ViSta and Arc are major
      statistical systems associated with XLISP-STAT. R is the later statistical
      environment most often discussed as the ecosystem that displaced it for mainstream
      statistical computing.
