    - https://www.jstatsoft.org/article/view/v013i09
    - https://www.linuxjournal.com/article/1064
    - https://www.stat.umn.edu/arc/xlispstat.html
    - https://www.visualstats.org/vista-frames/xls.html
  summary:
    - >
      XLISP-STAT, also called Lisp-Stat, is Luke Tierney's Lisp-based statistical
      computing environment for data analysis, statistical instruction, research, and
      dynamic graphics. It is historically important because it joined an extensible
      programming language, statistical modeling, and interactive graphics before R
      became dominant.
  timeline:
    - >
      Mid-1980s: Tierney began Lisp-Stat while experimenting with dynamic statistical
      graphics on Macintosh hardware.
    - >
      1990: Wiley published Tierney's LISP-STAT book documenting the object-oriented
      statistical environment.
    - >
      1995: Linux Journal introduced Lisp-Stat to Linux users as a cross-platform
      statistical computing environment.
    - >
      1998: Tierney's Lisp-Stat information page summarized the system and linked
      documentation, projects, bibliography, and future directions.
    - >
      2002: Journal of Statistical Software examples still used Lisp-Stat/ViSta for
      interactive statistical analysis extensions.
    - >
      2005: JSS published retrospective and migration-era papers discussing the past,
      future, and abandonment of XLISP-STAT.
  usage:
    - >
      Users worked interactively in a Lisp environment, using vectorized arithmetic,
      statistical functions, linear algebra, regression model objects, generalized
      linear models, and plotting facilities. Dynamic plots supported operations such as
      rotation, brushing, linking, mouse interaction, menus, and dialogs.
    - >
      For package users today, XLISP-STAT is mostly historical or archival. It remains
      useful for understanding statistical graphics history, old course material, and
      software such as Arc or ViSta that built on Lisp-Stat ideas.
