history:
  adoption-history:
    - >
      Vienna's official site reports more than 450,000 historical downloads from
      SourceForge alone. SourceForge previously hosted the project, while GitHub has
      also supported it and now hosts its repository.
    - >
      The project remains community-maintained and is distributed through GitHub
      releases, SourceForge, and Homebrew Cask.
  package-nerd-significance:
    - >
      Vienna is a long-lived native Mac feed reader whose source history reaches back to
      2005. Its survival across SourceForge, Subversion, GitHub, and Homebrew reflects
      several eras of Mac open-source distribution.
    - >
      It is also unusually extensible for a desktop feed reader, supporting custom
      HTML/CSS article styles, AppleScript, XML-based plug-ins, and synchronization with
      Open Reader-compatible services.
  project-history:
    - >
      Steve Palmer started Vienna as an open-source native macOS newsreader. The project
      supports RSS, Atom, and JSON Feed and is published under Apache License 2.0.
    - >
      In 2011, development moved from Subversion to GitHub, with commit history dating
      to 2005 migrated into Git. The project marked its twentieth anniversary in 2025
      and continues to receive contributions.
  related-projects:
    - >
      Open Reader-compatible services supported by Vienna include FreshRSS, BazQux,
      FeedHQ, Inoreader, and The Old Reader.
    - Homebrew Cask provides a package-manager installation route for the macOS application.
  sources:
    - https://github.com/ViennaRSS/vienna-rss
    - https://github.com/ViennaRSS/vienna-rss/blob/master/CHANGELOG.md
    - https://www.vienna-rss.com/about.html
    - >
      https://www.vienna-rss.com/blog/news/programming/2011/08/29/vienna-development-moves-to-github.html
    - https://www.vienna-rss.com/faq
  summary:
    - >
      Vienna is a free, open-source, native macOS reader for RSS, Atom, and JSON feeds.
      It combines local feed reading with optional Open Reader service synchronization
      and supports styles, scripts, and plug-ins.
  timeline:
    - '2005: Earliest source history later migrated from Subversion to Git.'
    - '2011: Development and the migrated history moved to GitHub.'
    - '2025: Vienna published a twentieth-anniversary release.'
  usage:
    - >
      Users subscribe directly to websites or synchronize through a compatible Open
      Reader service, then organize, search, read, flag, and expire articles locally.
    - >
      The default article database is ~/Library/Application Support/Vienna/messages.db.
      The official FAQ documents relocating it with the DefaultDatabase preference; this
      is application data rather than a standalone configuration file.
