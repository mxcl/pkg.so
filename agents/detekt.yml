credentials-file-location: null
history:
  adoption-history:
    - >
      detekt grew with Kotlin's move from Android-focused adoption into broader JVM and
      multiplatform use. Its README highlights Maven Central, the Gradle plugin,
      third-party plugins, IDE and CI integrations, SARIF output for code scanning, and
      a marketplace for custom rules.
  package-nerd-significance:
    - >
      detekt matters in package-manager culture because it is one of the canonical
      Kotlin quality gates: language-specific, rule-driven, CI-friendly, and packaged
      across CLI, Maven Central, Gradle, Homebrew, Scoop, and Nix-style workflows.
  project-history:
    - >
      The detekt GitHub repository was created in October 2016. Early release tags used
      milestone and release-candidate names, while the modern project documents stable
      1.x releases and 2.0.0 alpha documentation on detekt.dev.
  related-projects:
    - >
      The official README names Kotlin, Gradle, ktlint, PMD, Checkstyle, SARIF,
      SonarQube, Codacy, and third-party detekt plugins as nearby tools and integration
      surfaces.
  sources:
    - https://github.com/detekt/detekt
    - https://github.com/detekt/detekt/blob/main/README.md
    - https://detekt.dev/changelog
    - https://api.github.com/repos/detekt/detekt
  summary:
    - >
      detekt is a static-analysis and linting tool for Kotlin. Its official README
      describes code smell analysis, configurable rule sets, baselines for legacy
      projects, multiple report formats, Gradle integration, and extension points for
      custom rules and reports.
  timeline:
    - '2016: GitHub repository created for detekt/detekt.'
    - '2018: Release-candidate era visible in official GitHub releases.'
    - >
      2023: detekt 1.23.0 added the experimental detekt compiler plugin and expanded
      rule coverage.
    - '2025: detekt 1.23.8 shipped as a point release with Kotlin 2.0.21 support.'
  usage:
    - >
      Package users typically install the CLI jar, Homebrew formula, or Gradle plugin,
      then point detekt at Kotlin sources with a YAML config and optional baseline XML.
      In Gradle builds, teams commonly configure reports such as HTML, Checkstyle XML,
      SARIF, and Markdown.
related-packages:
  - id: brew:ktlint
    reason: >
      Use ktlint directly for a focused Kotlin style checker and formatter, or add its
      rules to detekt through detekt's officially documented ktlint wrapper when one
      combined quality gate is preferable.
    rel: adjacent_workflow
    sources:
      - https://detekt.dev/docs/next/intro/
      - https://pinterest.github.io/ktlint/latest/
