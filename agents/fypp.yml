config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Fypp's official install instructions document conda-forge, pip/PyPI, MSYS2 pacman,
      GitHub release archives, and development installs from the repository. Supplied
      package-manager facts additionally list Homebrew, Debian, Nix, and Ubuntu
      packaging, reflecting use in both Python and Fortran build environments.
  package-nerd-significance:
    - >
      Fypp is package-nerd interesting because it is a small Python CLI that lives at
      the boundary between scientific Fortran build systems and Python packaging. It is
      not a general template engine packaged as an application; its significance is the
      deliberate adaptation of Python expression evaluation to Fortran preprocessing
      workflows.
  project-history:
    - >
      The GitHub repository was created in April 2016, with release 1.0 published the
      same day. Official documentation says Fypp was inspired by the pyratemp templating
      engine, but was written from scratch for source-code preprocessing needs such as
      compiler line-number markers and source-oriented line folding.
    - >
      The project has continued through the 3.x line; release 3.0 was published in 2020,
      3.1 in 2021, and 3.2 in 2023. The stable documentation identifies itself as Fypp
      3.2.
  related-projects:
    - >
      The official documentation names pyratemp as an inspiration and compares Fypp with
      cpp/fpp-like preprocessors and the coco preprocessor. Its build-system examples
      place it beside Make, Waf, CMake, and Python-driven build tooling.
  sources:
    - https://api.github.com/repos/aradi/fypp
    - https://fypp.readthedocs.io/en/stable/fypp.html
    - https://github.com/aradi/fypp
    - https://github.com/aradi/fypp/releases
    - https://raw.githubusercontent.com/aradi/fypp/main/README.rst
  summary:
    - >
      Fypp is a Python-powered preprocessor aimed primarily at Fortran source
      preprocessing. Its documentation presents it as a way to add conditional compiling
      and template metaprogramming to modern Fortran while using Python expressions in
      directives rather than inventing a separate expression language.
  timeline:
    - '2016: GitHub repository created.'
    - '2016: Release 1.0 published.'
    - '2020: Release 3.0 published.'
    - '2023: Release 3.2 published.'
  usage:
    - >
      Users run the `fypp` command-line tool or import `fypp.py` directly from Python
      scripts. The documentation covers Make, Waf, and CMake integration, and notes that
      Python-driven build systems can use the API instead of shelling out to the
      executable.
related-packages:
  - id: brew:cmake
    reason: >
      CMake is an adjacent workflow because Fypp’s official documentation provides a
      CMake custom-command pattern for generating Fortran sources and supports
      dependency files that CMake can track.
    rel: adjacent_workflow
    sources:
      - https://fypp.readthedocs.io/en/stable/fypp.html
      - https://fypp.readthedocs.io/en/stable/various-features.html
      - https://cmake.org/cmake/help/latest/command/add_custom_command.html
