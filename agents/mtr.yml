history:
  project-history:
    - >
      Technically, mtr repeatedly probes the path from the local host to a destination
      with increasing time-to-live values, discovers intermediate hops from router
      responses, and prints running latency and loss statistics for each hop. The
      official README warns that routers can suppress or rate-limit ICMP responses, so
      apparent loss at an intermediate hop does not automatically mean forwarded traffic
      is being dropped there. The project also splits privileged packet work into
      mtr-packet, which must have raw-socket privileges on Unix-like systems.
  sources:
    - https://formulae.brew.sh/formula/mtr
    - https://github.com/traviscross/mtr
    - https://packages.debian.org/sid/mtr
    - https://www.bitwizard.nl/mtr/
  summary:
    - >
      mtr began as Matt Kimball's network diagnostic program and was later maintained by
      Roger Wolff at BitWizard; the BitWizard history page says Wolff took over
      maintenance in October 1998. The name is commonly expanded as My Traceroute,
      preserving its origin as Matt's Traceroute while emphasizing the combined
      traceroute-and-ping behavior that made the tool distinctive.
  usage:
    - >
      Its adoption is broad because it turns an intermittent network path into a live
      table that operators can watch while troubleshooting. Distribution packaging for
      Unix-like systems, a GitHub-maintained upstream, WSL instructions for Windows
      users, and long-standing Homebrew/Linux packages place it alongside ping,
      traceroute, and pathping-style tools, but with the advantage of continuous per-hop
      statistics.
related-packages:
