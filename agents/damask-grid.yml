id: brew:damask-grid
display-name: DAMASK Grid
repo: https://github.com/damask-multiphysics/DAMASK
docs:
  - https://damask-multiphysics.org/documentation/usage.html
  - https://damask-multiphysics.org/dev/installation/source_code.html
config-file-location:
  unix:
    - material.yaml
    - numerics.yaml
    - <loadcase>.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The grid solver is important to users who want FFT/spectral-style or
      structured-grid workflows with YAML material and load-case descriptions. DAMASK
      documentation and examples expose a Python-assisted workflow around material.yaml,
      numerics.yaml, VTK ImageData geometry, and generated load cases.
  package-nerd-significance:
    - >
      For package nerds, damask-grid is a scientific CLI where the package is only a
      small front door into a heavyweight solver stack: compilers, MPI/OpenMP, YAML
      inputs, HDF5-style result handling, and research reproducibility all matter.
  project-history:
    - >
      DAMASK grew as an open materials-science codebase for modeling crystal plasticity,
      thermal effects, damage, and related multiphysics behavior from microstructure up
      to component scale. The official literature page lists a 2012 DAMASK publication
      and a broader 2019 Computational Materials Science paper as core references.
  related-projects:
    - >
      DAMASK Grid is part of the wider DAMASK suite alongside mesh-solver workflows,
      Python preprocessing/postprocessing helpers, material configuration tooling, and
      research codes for crystal plasticity and microstructure analysis.
  sources:
    - https://damask-multiphysics.org/
    - https://damask-multiphysics.org/documentation/usage.html
    - https://damask-multiphysics.org/documentation/file_formats/grid_solver.html
    - https://damask-multiphysics.org/3.0.0-alpha7/documentation/literature.html
    - https://damask-multiphysics.org/dev/installation/source_code.html
  summary:
    - >
      DAMASK Grid is the regular-grid solver entry point for DAMASK, the Duesseldorf
      Advanced Material Simulation Kit, a multiphysics crystal-plasticity simulation
      package used in computational materials science.
  timeline:
    - '2012: DAMASK literature records an early publication on FE and spectral solver use.'
    - '2019: The multiphysics DAMASK paper summarized the broader package architecture.'
    - '2024: Official documentation examples describe modern DAMASK 3-era grid workflows.'
  usage:
    - >
      A typical package-manager install exposes DAMASK_grid for running simulations with
      a geometry file, load-case YAML, and material.yaml, with OpenMP or MPI used for
      parallel execution when available.
related-packages: []
