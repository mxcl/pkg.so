  - https://www.ibiblio.org/pub/Linux/utils/file/%21INDEX.html
  - https://www.ibiblio.org/pub/Linux/utils/file/ren-1.0.tar.gz
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      ren persisted mostly as a source tarball rather than an active source-control
      project. The ibiblio Linux utilities index lists ren-1.0.tar.gz under
      file-manipulation utilities, and Homebrew packages that same archive.
  package-nerd-significance:
    - >
      ren is package-nerd interesting because it is a compact historical Unix utility: a
      comp.sources.unix-era program, later patched for Linux, preserved through source
      archives and modern package managers despite having no obvious upstream VCS.
  project-history:
    - >
      The ren 1.0 README says Vladimir Lanin originally wrote the program and submitted
      it to comp.sources.unix in 1988. Rob Schipper later adjusted the code so it would
      compile under Linux and released the packaged 1.0 archive in March 1997.
  related-projects:
    - The manpage positions ren as a multi-file rename companion to mv(1).
  sources:
    - Homebrew formula metadata for ren.
    - ibiblio Linux utils/file index entry for ren-1.0.tar.gz.
    - ren 1.0 README and ren.1 from the ibiblio source archive.
  summary:
    - >
      ren is a small Unix command-line utility for renaming multiple files in a
      directory using wildcard search and replacement patterns.
  timeline:
    - '1988: Original ren program submitted to comp.sources.unix.'
    - '1997-03-31: Linux-adjusted ren 1.0 README and ibiblio archive entry.'
    - '1.0: Homebrew packages the ibiblio source archive as the stable release.'
  usage:
    - >
      ren operates in the current directory or a specified path, matching files with *
      and ? wildcards and constructing replacement names with #1 through #9 wildcard
      indexes. The manpage emphasizes preflight checks for collisions and safe handling
      of rename chains.
