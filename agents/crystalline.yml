id: brew:crystalline
display-name: Crystalline
repo: null
docs:
  - https://github.com/elbywan/crystalline#readme
config-file-location:
  unix:
    - shard.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation notes list pre-built binaries, Homebrew on macOS, Arch Linux
      packaging, and builds from source with Crystal shards. The Homebrew and Nix
      package-manager entries in the input show that it reached the cross-platform
      developer-tool packaging layer rather than remaining only a manually built Crystal
      shard.
  package-nerd-significance:
    - >
      For package maintainers, Crystalline is mainly a binary LSP package with tight
      coupling to Crystal compiler versions. Its compatibility table maps Crystal
      versions to Crystalline releases, which matters for formula and distribution
      updates.
  project-history:
    - >
      The project README describes Crystalline as an LSP server for Crystal and says it
      began as an experiment when there was no working Crystal LSP. The maintainer
      positioned it as a practical tool for editor features such as completion,
      go-to-definition, formatting, diagnostics, hover, and document symbols rather than
      as a complete language-intelligence platform.
  related-projects:
    - >
      The README credits Scry, the earlier Crystal language server, as an inspiration
      and partial source of reused code.
  sources:
    - https://github.com/elbywan/crystalline#readme
    - https://api.github.com/repos/elbywan/crystalline/releases?per_page=100
  summary:
    - >
      Crystalline is a Language Server Protocol implementation written in and for
      Crystal. Its package-manager interest is that it packages editor support for a
      compiled language whose official compiler architecture makes full language-server
      behavior relatively hard.
  timeline:
    - '2020: GitHub release v0.1.0 was published for Crystal 0.35.1 compatibility.'
    - '2026: GitHub release v0.18.0 targets Crystal 1.20 compatibility.'
  usage:
    - >
      Crystalline is meant to run behind editor integrations. The README documents VS
      Code, Vim/Neovim through coc.nvim, and Emacs lsp-mode setups, with project
      behavior controlled from shard.yml entries for the entry point, monorepo projects,
      and Crystal compilation flags.
related-packages:
  - id: brew:crystal
    reason: >
      Crystalline analyzes Crystal projects and tracks specific Crystal compiler
      compatibility, so the compiler is the required companion for its editor workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/elbywan/crystalline#readme
      - https://crystal-lang.org/reference/latest/
