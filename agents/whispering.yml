history:
  adoption-history:
    - >
      Whispering gained a package-oriented audience by offering open-source desktop
      builds for macOS, Windows, and Linux alongside a browser version. Users can bring
      their own cloud-provider credentials or select local and self-hosted transcription
      backends.
    - >
      In 2025 the maintainers broadened the repository from the standalone Whispering
      project into Epicenter, an ecosystem of local-first applications. Whispering
      remained the principal mature application and continued under the monorepo's
      apps/whispering directory.
  package-nerd-significance:
    - >
      Whispering combines several concerns attractive to package enthusiasts: open
      source, bring-your-own-provider configuration, local-first storage, self-hosted
      endpoints, and optional on-device models. The Homebrew cask provides a
      conventional installation path for an application that can avoid subscription
      transcription services and vendor-specific model hosting.
  project-history:
    - >
      Whispering was created as an open-source speech-to-text application built around a
      short interaction: press a shortcut, speak, and receive text. It supports
      recording, transcription through a chosen provider, optional AI polishing, and
      delivery to the clipboard or active application.
    - >
      The project later became part of Epicenter. In the current architecture, the
      browser application and Epicenter-hosted desktop application share the Whispering
      interface, while the native Epicenter runtime supplies global shortcuts,
      operating-system permissions, local model execution, native windows, and app-data
      storage.
  related-projects:
    - >
      Whispering is maintained within Epicenter, a broader collection of open-source,
      local-first applications.
    - >
      Supported workflows involve Whisper.cpp or GGUF models for on-device
      transcription, cloud speech providers, and OpenAI-compatible local servers such as
      Ollama, LM Studio, and llama.cpp for transcript transformations.
  sources:
    - https://epicenter.so/whispering/
    - https://github.com/EpicenterHQ/epicenter/blob/main/apps/whispering/README.md
    - >
      https://github.com/EpicenterHQ/epicenter/blob/main/docs/guides/custom-endpoint-transformations.md
    - https://github.com/EpicenterHQ/epicenter/discussions/610
    - source_facts.package-manager
  summary:
    - >
      Whispering is a free, open-source speech-to-text application for recording speech,
      transcribing it with local or cloud models, optionally transforming the
      transcript, and delivering the resulting text.
  timeline:
    - >
      2025-08-04: The maintainers announced that the Whispering repository was becoming
      Epicenter while Whispering remained its primary application.
    - >
      2026: Official architecture documentation describes Whispering as a shared browser
      application and an app hosted by the native Epicenter desktop runtime.
  usage:
    - >
      Users activate a shortcut, record speech, select a local, cloud, or self-hosted
      transcription provider, and copy or paste the resulting text. Optional
      transformations can correct grammar, format text, or run custom prompt workflows.
    - >
      The application stores settings and recording metadata locally first. Audio leaves
      the device when the selected cloud provider requires an upload; on-device
      transcription in the desktop host keeps audio local. Cloud-provider API keys may
      be entered in the application, but the official sources reviewed do not document a
      stable filesystem path for those credentials.
