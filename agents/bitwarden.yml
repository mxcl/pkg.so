history:
  adoption-history:
    - >
      Bitwarden reports use by millions of individuals and businesses. Its free tier,
      cross-platform clients, business plans, and self-hosting option helped it span
      personal, family, and enterprise password-management use.
  package-nerd-significance:
    - >
      Bitwarden is notable to package enthusiasts because it combines polished
      cross-platform clients with inspectable source code and an officially supported
      self-hosting path. The desktop package is one client in a broader ecosystem that
      also includes browser, mobile, web, and command-line interfaces.
  project-history:
    - >
      Founder Kyle Spearrin began building Bitwarden in 2015–2016 to create a simpler,
      more turnkey, cross-platform alternative to existing password managers. The first
      iteration and its source code were publicly launched in August 2016.
    - >
      The project subsequently expanded from login storage into secure notes, payment
      cards, identities, organizations, enterprise administration, Secrets Manager, and
      passwordless tooling while retaining an open-source foundation.
  related-projects:
    - Bitwarden web, browser-extension, mobile, and CLI clients
    - Bitwarden self-hosted server
    - Bitwarden Secrets Manager
    - Bitwarden Authenticator
  sources:
    - https://bitwarden.com/blog/defining-and-sustaining-value-for-bitwarden-users/
    - https://bitwarden.com/blog/q-and-a-with-bitwarden-founder-and-cto/
    - https://bitwarden.com/blog/the-bitwarden-tech-stack-built-for-security-and-scalability/
    - https://bitwarden.com/help/data-storage/
    - https://bitwarden.com/help/getting-started-desktop/
  summary:
    - >
      Bitwarden is an open-source, cross-platform credential manager launched in 2016.
      It provides encrypted vaults through desktop, browser, mobile, web, and
      command-line clients and supports either Bitwarden-hosted service or self-hosting.
  timeline:
    - '2015–2016: Kyle Spearrin began developing Bitwarden.'
    - 'August 2016: The first Bitwarden iteration and public source code launched.'
    - 'October 2017: Secure notes, card, and identity vault-item types were announced.'
  usage:
    - >
      The desktop client is used to create, organize, generate, retrieve, and autofill
      credentials and other sensitive vault items. It supports multiple accounts,
      biometric or system authentication where available, imports, and connections to
      Bitwarden cloud or self-hosted servers.
    - >
      Encrypted vault data rests in the application-data directory, while authentication
      tokens and biometric-unlock data use the operating system's secure credential
      store rather than a documented credentials file.
