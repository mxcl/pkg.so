history:
  adoption-history:
    - >
      Nsight Systems expanded its supported targets during 2018, including Windows
      target profiling. By 2019, NVIDIA was directing nvprof and Visual Profiler users
      to Nsight Systems and Nsight Compute as their successors.
  package-nerd-significance:
    - >
      Its host/target model separates performance-data collection from report
      inspection. This distinction matters when selecting packages for developer
      workstations, remote GPU machines, and embedded systems.
  project-history:
    - >
      NVIDIA introduced Nsight Systems as a system-wide performance analysis tool in
      2018. It combines statistical sampling and tracing to show interactions between
      CPU work and GPU execution.
  related-projects:
    - >
      Nsight Compute and Nsight Graphics provide deeper analysis after Nsight Systems
      identifies expensive GPU workloads. NVIDIA Visual Profiler and nvprof are
      predecessor tools in the CUDA profiling workflow.
  sources:
    - https://developer.nvidia.com/blog/?p=10488
    - https://developer.nvidia.com/blog/nvidia-announces-nsight-systems-2018-3/
    - https://developer.nvidia.com/blog/nvidia-announces-nsight-systems-2019-5/
    - https://docs.nvidia.com/nsight-systems/InstallationGuide/
  summary:
    - >
      NVIDIA Nsight Systems profiles application-wide CPU and GPU behavior to locate
      performance bottlenecks.
  timeline:
    - '2018: NVIDIA introduced Nsight Systems and expanded profiling to Windows targets.'
    - '2019: NVIDIA published migration guidance for nvprof and Visual Profiler users.'
  usage:
    - >
      Capture application traces and CPU samples, inspect timelines for synchronization
      or scheduling delays, and then investigate costly kernels with Nsight Compute. The
      installation guide distinguishes the profiling target from the analysis host.
