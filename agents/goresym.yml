history:
  adoption-history:
    - >
      GoReSym emerged as Go malware and Go-packed tooling became more common. Mandiant's
      release framed the need around Go's self-contained binaries, evolving runtime
      structures, and the difficulty reverse engineers face when symbols are stripped or
      malformed. Homebrew and Nix packaging made the command-line tool easier to install
      outside Mandiant FLARE-style workstations.
  package-nerd-significance:
    - >
      For package nerds in security tooling, GoReSym is a compact example of a
      domain-specific binary-analysis tool that vendors and adapts upstream Go internals
      rather than maintaining a fully separate parser. Its release artifacts and
      Homebrew packaging make a reverse-engineering utility available through normal
      developer package flows.
  project-history:
    - >
      The GitHub repository was created on February 15, 2022. Mandiant announced GoReSym
      on February 28, 2022 in a technical article about Go internals and symbol
      recovery, explaining that the project parses Go symbol information and embedded
      metadata by leaning on the Go compiler and runtime source layout.
  related-projects:
    - >
      Go compiler and runtime source code are the upstream basis for much of GoReSym's
      parser behavior.
    - IDA Pro integration is supported through the repository's IDAPython script.
    - Mandiant FLARE tooling is the surrounding reverse-engineering context for the project.
  sources:
    - >
      https://cloud.google.com/blog/topics/threat-intelligence/golang-internals-symbol-recovery/
    - https://github.com/mandiant/GoReSym
    - https://github.com/mandiant/GoReSym/releases
    - https://raw.githubusercontent.com/mandiant/GoReSym/master/README.md
  summary:
    - >
      GoReSym is Mandiant's Go symbol recovery tool for extracting runtime and source
      metadata from Go binaries, especially stripped, packed, malformed, or obfuscated
      samples encountered during reverse engineering.
  timeline:
    - '2022-02-15: GitHub repository created'
    - '2022-02-28: Mandiant announced GoReSym in a Go internals and symbol recovery article'
    - >
      2024-era: Homebrew formula entered with 2.x series package history in
      input/package-manager context
    - '2026: Release notes record Go 1.25 and Go 1.26 support in the 3.x series'
  usage:
    - >
      Users run GoReSym against a Go executable and request metadata such as type names,
      user and standard package names, input file paths, strings, and JSON output. The
      repository also includes an IDAPython import script that consumes GoReSym JSON and
      applies recovered names inside IDA Pro.
related-packages:
  - id: brew:redress
    reason: >
      Choose Redress for a command-oriented stripped-Go analysis workflow with
      source-layout reconstruction and radare2 integration; choose GoReSym for
      Go-runtime-derived parsing and JSON import scripts for IDA Pro and Ghidra.
    rel: alternative
    sources:
