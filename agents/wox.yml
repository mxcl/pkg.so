id: cask:wox
display-name: Wox
repo: null
docs:
  - https://www.woxlauncher.com/guide/introduction.html
config-file-location:
  unix:
    - ~/.wox
  windows:
    - '%USERPROFILE%\.wox'
credentials-file-location: null
history:
  adoption-history:
    - >
      Wox originated in the Windows launcher ecosystem and developed a substantial
      plugin community. The modern project is cross-platform, distributed through GitHub
      releases and package managers including Homebrew, Winget, Scoop, Chocolatey, and
      Linux community packages.
  package-nerd-significance:
    - >
      Wox is a long-running open-source launcher associated with extensible,
      keyboard-driven desktop workflows. Its plugin model, package-manager availability,
      and later cross-platform native implementation make it a prominent alternative to
      proprietary launchers such as Alfred and Raycast and a predecessor or reference
      point for related Windows launchers.
  project-history:
    - >
      The official site dates Wox to 2013. It evolved from a Windows-focused launcher
      into a native, GPU-rendered launcher for Windows, macOS, and Linux, combining
      local search and actions with an extensible plugin system. The 2.x series
      broadened the built-in feature set and replaced the Flutter interface with a
      native embedded UI.
  related-projects:
    - >
      The official documentation compares Wox with Flow Launcher, Raycast, and PowerToys
      Run. Its plugin ecosystem supports Node.js, Python, and script-based extensions.
  sources:
    - 'Official changelog: https://www.woxlauncher.com/changelog/'
    - 'Official installation guide: https://www.woxlauncher.com/guide/installation.html'
    - 'Official introduction: https://www.woxlauncher.com/guide/introduction.html'
    - 'Official repository README: https://github.com/Wox-launcher/Wox#readme'
  summary:
    - >
      Wox is an open-source, cross-platform, keyboard-first application launcher with
      built-in search and productivity tools plus an extensible plugin system.
  timeline:
    - '2013: The official site marks the beginning of the Wox project.'
    - '2026: Wox 2.0 is declared ready for everyday use.'
    - >
      2026: Wox 2.4 replaces the Flutter UI with an embedded native UI and expands the
      built-in toolset.
  usage:
    - >
      Users invoke Wox with a global shortcut, search for applications, files,
      bookmarks, URLs, and clipboard entries, run calculations and system actions, or
      route explicit queries to built-in and community plugins.
