history:
  adoption-history:
    - >
      WhatsApp extended its mobile messaging service to linked computers and
      subsequently improved its multi-device synchronization. Meta described WhatsApp in
      2023 as the largest platform offering end-to-end encrypted, cross-platform
      communication across phones, computers, and tablets.
    - >
      The native Mac application brought the redesigned desktop experience to macOS,
      including group calling, drag-and-drop file sharing, expanded chat-history
      viewing, and call notifications. Homebrew Cask provides a package-manager
      installation route for that official desktop client.
  package-nerd-significance:
    - >
      The WhatsApp cask packages a mainstream, automatically updated proprietary
      communication client rather than a traditional Unix tool. It illustrates Homebrew
      Cask's role in making widely used signed macOS applications reproducibly
      discoverable and installable alongside open-source command-line packages.
  project-history:
    - >
      WhatsApp began as a mobile messaging service and later added web and desktop
      access linked to a user's primary account. In March 2023 Meta announced a faster
      redesigned Windows desktop application and an early beta of the corresponding
      native Mac experience.
    - >
      On August 29, 2023, Meta announced the redesigned WhatsApp application for Mac,
      adding native group calling for up to eight video participants and 32 audio
      participants while retaining end-to-end encryption for personal messages and
      calls.
  related-projects:
    - >
      Related official products include WhatsApp for iPhone and Android, WhatsApp Web,
      WhatsApp Business, and Meta's multi-device infrastructure.
  sources:
    - https://about.fb.com/news/2023/03/faster-speeds-improved-calling-whatsapp-desktop/
    - https://about.fb.com/news/2023/08/new-whatsapp-app-for-mac-group-calling/
    - https://faq.whatsapp.com/
    - https://www.whatsapp.com/download
    - source_facts.package-manager
  summary:
    - >
      WhatsApp for Mac is the native desktop client for WhatsApp's private messaging and
      calling service. It links with a WhatsApp account and synchronizes chats across
      devices.
  timeline:
    - '2023-03-22: Meta announced that a new native WhatsApp experience for Mac was in beta.'
    - >
      2023-08-29: Meta announced the redesigned WhatsApp application for Mac with group
      calling.
  usage:
    - >
      Users link the Mac application to an existing WhatsApp account to exchange
      messages and media and make encrypted audio or video calls. The desktop interface
      supports file drag-and-drop, synchronized chat history, and incoming call
      notifications.
