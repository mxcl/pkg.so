history:
  adoption-history:
    - >
      Jamf released PPPC Utility for Mac administrators who needed to construct managed
      privacy-control payloads after Apple introduced Privacy Preferences Policy
      Control. It can save signed or unsigned profiles locally and upload profiles
      directly to Jamf Pro.
    - >
      Later releases followed changes in macOS privacy keys and Jamf Pro authentication,
      adding profile import, Big Sur authorization-key support, bearer-token
      authentication, OAuth client credentials, and newer PPPC service keys.
  package-nerd-significance:
    - >
      PPPC Utility captures an important change in macOS fleet administration: privacy
      permissions that users normally approve interactively can, where Apple permits, be
      managed through configuration profiles.
    - >
      It gives Mac packagers and MDM administrators a graphical way to derive
      code-signing requirements, assign protected-service permissions, and produce
      deployable profiles without hand-authoring payload XML.
  project-history:
    - >
      Jamf created PPPC Utility as an open-source macOS application for building
      configuration profiles containing Apple's Privacy Preferences Policy Control
      payload. The initial release appeared in September 2018.
    - >
      The project evolved alongside macOS and Jamf Pro, adding new payload keys, profile
      import, newer authentication methods, and direct upload support. Version 2.0
      modernized the codebase, raised the minimum system requirement to macOS 13, and
      added newer PPPC services.
  related-projects:
    - Jamf Pro can receive profiles uploaded directly from PPPC Utility.
    - >
      Apple's Privacy Preferences Policy Control payload and Transparency, Consent, and
      Control subsystem define the permissions represented by the generated profiles.
  sources:
    - 'Official changelog: https://github.com/jamf/PPPC-Utility/blob/master/CHANGELOG.md'
    - 'Official releases: https://github.com/jamf/PPPC-Utility/releases'
    - 'Official repository and README: https://github.com/jamf/PPPC-Utility'
  summary:
    - >
      PPPC Utility is Jamf's open-source macOS administration application for creating,
      signing, importing, and uploading configuration profiles that manage
      privacy-protected services.
  timeline:
    - '2018-09-21: PPPC Utility 1.0.0 was released.'
    - '2019-09-10: Version 1.1.0 added macOS 10.15 PPPC keys.'
    - '2020-04-29: Version 1.2.0 added profile import.'
    - >
      2022-10-04: Version 1.5.0 adopted Jamf Pro API token authentication with a
      Basic-authentication fallback.
    - >
      2026-05-26: Version 2.0.0 added new PPPC service keys, OAuth client credentials,
      and a macOS 13 minimum requirement.
  usage:
    - >
      Administrators add application bundles or executables, review their code-signing
      requirements, choose permissions such as Accessibility or Full Disk Access, and
      save the result as a signed or unsigned configuration profile. Profiles can also
      be imported or uploaded to Jamf Pro using supported authentication methods.
