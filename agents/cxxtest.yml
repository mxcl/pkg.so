history:
  adoption-history:
    - >
      CxxTest's adoption niche has been C++ projects that wanted generated test runners
      and xUnit-style assertions without forcing a separate library build or advanced
      C++ features. Its package-manager presence across Homebrew, Debian, Fedora, Nix,
      and Ubuntu reflects a mature testing utility kept available for existing C++ build
      workflows.
  package-nerd-significance:
    - >
      For package maintainers, CxxTest is a compact example of an older C++ test
      framework whose packaging value is mostly in a generator script, headers,
      documentation, and compatibility with many C++ compilers rather than a runtime
      library.
  project-history:
    - >
      The project's own release log records CxxTest releases back to 2002, with version
      2.7.0 adding embedded test suites and version 2.8.0 beginning the maintained
      version history in early 2003. Through the 3.x line it accumulated portability
      work for compilers and GUI runners, then version 4.0 in 2011 moved the scripting
      side from Perl to Python and refreshed the installation and user guide.
  related-projects:
    - CxxTest presents itself alongside JUnit, CppUnit, and xUnit-style testing frameworks.
  sources:
    - https://github.com/CxxTest/cxxtest/blob/master/README
    - https://github.com/CxxTest/cxxtest/blob/master/Versions
    - https://api.github.com/repos/CxxTest/cxxtest
    - https://formulae.brew.sh/formula/cxxtest
  summary:
    - >
      CxxTest is a C++ unit testing framework in the xUnit family, positioned by its
      README as similar in spirit to JUnit, CppUnit, and xUnit while avoiding a
      precompiled testing library.
  timeline:
    - '2002: Version 2.7.0 released with embedded test suites.'
    - '2003: Version 2.8.0 started the recorded version history.'
    - >
      2011: Version 4.0 replaced Perl scripting with Python and introduced a refreshed
      user guide.
    - '2014: Version 4.4 shipped Windows, SCons, and formatter fixes.'
  usage:
    - >
      Typical use starts with a header declaring a CxxTest::TestSuite, then runs
      cxxtestgen to generate a C++ test runner that is compiled with the user's normal
      compiler. That generator-centric flow made it friendly to Make, SCons, and
      distribution packaging because the installed executable is the key tool.
related-packages:
  - id: brew:cppunit
    reason: >
      CppUnit is a conventional library-based xUnit framework for C++, whereas CxxTest
      generates runners from headers and avoids requiring a precompiled testing library.
    rel: alternative
    sources:
      - https://github.com/CxxTest/cxxtest/blob/master/README
      - https://wiki.freedesktop.org/www/Software/cppunit/
  - id: brew:scons
    reason: >
      CxxTest's official release history and user documentation describe SCons
      integration for generating and running CxxTest suites as part of a build.
    rel: adjacent_workflow
    sources:
      - https://github.com/CxxTest/cxxtest/blob/master/Versions
      - https://www.scons.org/doc/HTML/scons-user.html
