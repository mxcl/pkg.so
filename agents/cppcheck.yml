config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package facts list Cppcheck across Homebrew, MacPorts, Debian,
      Ubuntu, Fedora/dnf, Alpine/apk, Arch/pacman, Nix, openSUSE/zypper, Chocolatey,
      Scoop, winget, and more. Upstream's README also explicitly points users to
      Homebrew, MacPorts, Conda, Conan, and other distribution channels, while warning
      that third-party packages may lag releases.
    - >
      The official website lists integrations with development tools such as Buildbot,
      CLion, Code::Blocks, CodeLite, Eclipse, and others. That integration footprint is
      part of why Cppcheck is common in CI and editor workflows.
  package-nerd-significance:
    - >
      Cppcheck is package-significant because static analyzers are often installed as
      developer tools rather than vendored into one project. Packagers need to track
      release cadence, optional PCRE/rules support, GUI builds, data-file install paths,
      and the upstream repository move while preserving a stable cppcheck command for
      CI.
  project-history:
    - >
      The upstream README notes that the original name was C++check and was later
      changed to Cppcheck. It also says that despite the name, Cppcheck is designed for
      both C and C++.
    - >
      The GitHub repository was created in March 2009. The README states that the
      repository moved from danmar/cppcheck to cppcheck-opensource/cppcheck, and the
      official website now links current source downloads to the cppcheck-opensource
      GitHub releases.
    - >
      Cppcheck has kept both command-line and graphical user interfaces. Upstream build
      documentation covers CMake, Visual Studio, Qt Creator, GNU make, MinGW, and
      cross-compiling, which explains why it appears in many OS package ecosystems.
  related-projects:
    - Cppcheck Premium is the upstream commercial offering with additional checks and support.
    - >
      The official website lists editor and CI integrations, including Buildbot, CLion,
      Code::Blocks, CodeLite, and Eclipse.
  sources:
    - https://api.github.com/repos/cppcheck-opensource/cppcheck
    - https://raw.githubusercontent.com/danmar/cppcheck/main/readme.md
    - https://cppcheck.sourceforge.io/
    - https://api.github.com/repos/cppcheck-opensource/cppcheck/releases?per_page=5
    - https://sourceforge.net/projects/cppcheck/rss?path=/cppcheck
  summary:
    - >
      Cppcheck is an open-source static analysis tool for C and C++ code. It focuses on
      bugs that compilers commonly miss, especially undefined behavior and dangerous
      constructs, while trying to keep false positives low.
  timeline:
    - '2009: Public GitHub repository created.'
    - '2025: The upstream README documents the repository move to cppcheck-opensource/cppcheck.'
    - '2026: Official releases include Cppcheck 2.21.0.'
  usage:
    - >
      Cppcheck is used from the command line and GUI to analyze C/C++ projects for
      memory issues, out-of-bounds access, uninitialized variables, null dereferences,
      invalid shifts, integer overflows, and other undefined behavior. Upstream also
      documents addon, rules, and platform data files as part of packaged installs.
related-packages:
  - id: brew:llvm
    reason: >
      Choose LLVM's clang-tidy when compiler-aware checks, compilation-database
      integration, and automated source fixes are more important than Cppcheck's
      compiler-independent analysis.
    rel: alternative
    sources:
      - https://clang.llvm.org/extra/clang-tidy/
      - https://cppcheck.sourceforge.io/manual.html
  - id: brew:cpplint
    reason: >
      Use cpplint alongside Cppcheck when Google C++ style conformance matters, since
      cpplint checks source style while Cppcheck concentrates on defects and undefined
      behavior.
    rel: adjacent_workflow
    sources:
      - https://github.com/cpplint/cpplint
      - https://cppcheck.sourceforge.io/
