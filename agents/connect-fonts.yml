history:
  adoption-history:
    - >
      Connect Fonts served creative professionals and teams that needed searchable font
      libraries, font activation, collections, application sets, and plug-ins for design
      applications. It also integrated third-party sources such as Adobe Fonts and
      Google Fonts.
  package-nerd-significance:
    - >
      The cask is notable as a packaged distribution of a long-running commercial
      font-management lineage. It illustrates the operational side of desktop
      typography: activation, cache maintenance, plug-ins, library migration, and
      licensing rather than font-file creation.
  project-history:
    - >
      Connect Fonts Desktop was Extensis's successor branding and migration path for
      Suitcase Fusion. The official documentation now labels its desktop user guide as
      legacy, while the former Extensis product page redirects to Monotype Connect.
  related-projects:
    - Suitcase Fusion
    - Monotype Connect
    - Adobe Fonts
    - Google Fonts
  sources:
    - >
      Official Extensis legacy user guide:
      https://help.extensis.com/hc/en-us/categories/12131429033755-Connect-Fonts-Desktop-LEGACY-User-Guide
    - 'Official product redirect: https://www.extensis.com/products/connect'
  summary:
    - >
      Connect Fonts is a commercial desktop font manager from the Extensis product
      lineage, used to organize, search, activate, and troubleshoot font collections.
  timeline:
    - "Suitcase Fusion era: Extensis established the product's desktop font-management lineage"
    - 'Connect Fonts era: Existing users were given a migration path from Suitcase Fusion'
    - 'Current documentation: Connect Fonts Desktop is identified as a legacy product'
  usage:
    - >
      Designers use the application to add and remove fonts, organize them into sets and
      collections, activate fonts manually or automatically, and integrate font
      activation with creative applications.
