history:
  adoption-history:
    - >
      Renewed Vision positions ProVideoPlayer for worship venues, live productions,
      broadcasters, sports environments, businesses and education. The official site
      showcases multiscreen and nonstandard-display workflows, while the support portal
      maintains dedicated product articles, manuals and video tutorials.
  package-nerd-significance:
    - >
      ProVideoPlayer represents a specialized class of macOS package: proprietary
      show-control software built around deterministic media playback, live inputs and
      multi-output display mapping. Package-manager installation is useful for
      production Macs that need repeatable application deployment even though show
      design and media assets remain operator-managed.
  project-history:
    - >
      ProVideoPlayer is Renewed Vision's professional multiscreen media-server and
      presentation application. Its PVP 3 generation expanded the product around layers,
      targets, effects, live inputs and flexible output mapping.
  related-projects:
    - >
      Renewed Vision's related production products include ProPresenter and
      ProScoreboard. The vendor's site presents them as tools for worship,
      live-production, broadcast, sports, business and education workflows.
  sources:
    - https://renewedvision.com/provideoplayer
    - >
      https://support.renewedvision.com/hc/en-us/articles/360011792273-How-do-I-install-ProVideoPlayer
    - https://support.renewedvision.com/hc/en-us/sections/360002436053-ProVideoPlayer
  summary:
    - >
      ProVideoPlayer is a proprietary macOS media server for cueing, compositing and
      routing video and other visual content across one or more displays.
  timeline:
    - >
      PVP 3 era: Added a layer-and-target workflow with expanded effects, live-video
      inputs and multiscreen output capabilities.
    - 'PVP 3.3: Added features including the Video Input Playlist and matte blend modes.'
  usage:
    - >
      Operators import media, arrange cues and playlists, build layered screen layouts,
      map content to targets, preview live inputs and send the composition to display
      outputs. The product supports display masking, transitions, blend modes and
      professional video paths including SDI, NDI and Syphon. Renewed Vision distributes
      the application directly as a ZIP that users place in Applications.
