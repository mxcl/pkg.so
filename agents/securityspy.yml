history:
  adoption-history:
    - >
      Ben Software says SecuritySpy developed a large worldwide user base spanning
      homes, small businesses, and large commercial installations. The product is
      designed to scale from small systems to installations with hundreds of cameras.
  package-nerd-significance:
    - >
      SecuritySpy is a specialized, Mac-native alternative to appliance and
      cloud-subscription surveillance systems. It combines camera interoperability,
      local recording, automation, and an embedded web server in a package that can be
      installed through a desktop package manager.
  project-history:
    - >
      Ben Bird founded Ben Software in 2000 to produce video software for macOS. The
      company released SecuritySpy in 2004 as its CCTV video-surveillance product and
      has continued developing it as a commercial Mac application.
  related-projects:
    - BTV was Ben Software's earlier general-purpose video capture and editing application.
    - SwiftCapture is the company's high-performance video-capture application.
    - ViewCam is a related application for viewing live IP-camera streams.
  sources:
    - 'Official company history: https://bensoftware.com/about-us.html'
    - 'Official manual: https://bensoftware.com/securityspy/manual/'
    - 'Official product page: https://bensoftware.com/securityspy/'
    - 'Package-manager availability: source_facts.package-manager.brew-cask'
  summary:
    - >
      SecuritySpy is commercial network-video-recorder and CCTV software for macOS,
      developed by Ben Software. It manages IP cameras, local or remote recording,
      motion detection, alerts, and browser-based monitoring.
  timeline:
    - '2000: Ben Bird founds Ben Software.'
    - '2004: Ben Software releases SecuritySpy.'
    - '2015: Ben Software releases the related SwiftCapture video tool.'
    - '2022: Ben Software releases the related ViewCam IP-camera viewer.'
  usage:
    - >
      Users connect one or more IP cameras, configure continuous or motion-triggered
      recording, choose storage and retention policies, and create schedules and alert
      actions. SecuritySpy also provides remote monitoring through its built-in
      HTTP/HTTPS web server and supports AI-assisted motion classification.
