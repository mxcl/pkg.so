credentials-file-location: null
history:
  adoption-history:
    - >
      git-hooks belongs to the older wave of hook managers that tried to make Git's
      local hook mechanism shareable before tools such as pre-commit became widespread.
      Its adoption signal is modest but real: the repository has several hundred stars,
      package-manager coverage through Homebrew, and a GitHub Pages manual that
      documents project, user, and system-wide hook scopes.
  package-nerd-significance:
    - >
      The package matters as a small Git subcommand with configuration spread across
      repository files and Git config. For packagers, the `git-hooks-go` formula name
      avoids collision with generic hook terminology while exposing the executable as
      `git-hooks`.
  project-history:
    - >
      The project was created on GitHub in November 2014 and describes itself as
      rewritten from icefox/git-hooks with extra features. Its own history file records
      a 1.0.0 release in November 2014, and later GitHub releases added update,
      installation, and configuration improvements.
  related-projects:
    - >
      git-hooks is descended from icefox/git-hooks and occupies the same space as other
      Git hook managers that standardize local pre-commit, commit-msg, and related hook
      workflows.
  sources:
    - https://api.github.com/repos/git-hooks/git-hooks/releases
    - https://git-hooks.github.io/git-hooks
    - https://github.com/git-hooks/git-hooks
    - https://raw.githubusercontent.com/git-hooks/git-hooks/master/History.md
    - https://raw.githubusercontent.com/git-hooks/git-hooks/master/Readme.md
  summary:
    - >
      git-hooks is a Go-based manager for Git hooks. It provides the `git hooks` command
      and organizes client-side hooks into project, user, global, and semi scopes.
  timeline:
    - '2014: GitHub repository created and 1.0.0 history entry recorded.'
    - '2015: Early releases fix repository detection and installation behavior.'
    - '2019: Release v1.2.0 adds SSH protocol support in `githooks.json`.'
    - '2020: Release v1.3.1 adds `hooks.global` support in user config.'
  usage:
    - >
      Practitioners install the `git-hooks` binary, run `git hooks install` inside a
      repository, and place hook scripts in structured directories such as
      `githooks/pre-commit`. The tool can also read `githooks.json` for community hook
      repositories and uses Git system configuration for global hook directories.
related-packages:
  - id: brew:pre-commit
    reason: >
      Choose pre-commit when you want a multi-language hook package manager that
      installs and runs externally published hooks from `.pre-commit-config.yaml`;
      git-hooks instead emphasizes layered project, user, and system hook directories.
    rel: alternative
    sources:
      - https://git-hooks.github.io/git-hooks/
      - https://pre-commit.com/
