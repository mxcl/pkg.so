history:
  adoption-history:
    - >
      Keystone gained adoption in reverse-engineering culture because it offered a
      reusable assembler library rather than a single command-line assembler. The
      repository documents language bindings for Java, Masm, C#, PowerShell, Perl,
      Python, NodeJS, Ruby, Go, Rust, Haskell, VB6, and OCaml, which made the engine
      usable from scripting environments and binary-analysis frameworks.
    - >
      Package-manager coverage in this batch includes Homebrew, Debian, Ubuntu, Arch,
      MacPorts, Nix, and Alpine, indicating that Keystone moved beyond its upstream
      source tree into the normal packaging channels used by security researchers and
      systems developers.
  package-nerd-significance:
    - >
      Keystone matters to package nerds because it is infrastructure for other tooling:
      a small command in a package manager represents a large cross-platform assembly
      engine, LLVM-derived internals, and a bundle of language bindings. It is also a
      good example of reverse-engineering tools becoming ordinary installable packages
      across Unix-like distributions.
  project-history:
    - >
      Keystone's own changelog records version 0.9 as the initial public release on May
      31, 2016. The project describes itself as a lightweight, multi-platform,
      multi-architecture assembler framework implemented in C/C++, based on LLVM, and
      exposing bindings for many languages.
    - >
      The 0.9.1 release on July 27, 2016 added Haskell and OCaml bindings and improved
      kstool and architecture support. The 0.9.2 release on June 21, 2020 focused on
      Python packaging, while the 0.9.2 release-candidate notes list Ethereum VM
      support, more language bindings, Android cross-compilation improvements, and
      assembly-behavior fixes across X86, Arm, Arm64, Mips, and PowerPC.
  related-projects:
    - >
      Capstone is the closely related disassembly framework from the same broader
      tooling ecosystem. LLVM provides the machine-code infrastructure on which Keystone
      is based.
  sources:
    - https://formulae.brew.sh/formula/keystone
    - https://github.com/keystone-engine/keystone
    - https://raw.githubusercontent.com/keystone-engine/keystone/master/ChangeLog
  summary:
    - >
      Keystone Engine is a multi-architecture assembler framework created for
      reverse-engineering, binary instrumentation, exploit-development, and
      dynamic-code-generation tooling. It is commonly discussed alongside Capstone, its
      disassembler sibling, because Keystone fills the assembler side of the same
      multi-architecture tooling space.
  timeline:
    - '2016-05-31: Keystone 0.9 initial public release.'
    - '2016-07-27: Keystone 0.9.1 added kstool improvements and Haskell and OCaml bindings.'
    - '2020-06-13: Keystone 0.9.2-rc1 added Ethereum VM support and additional bindings.'
    - '2020-06-21: Keystone 0.9.2 fixed Python binding packaging.'
  usage:
    - >
      The CLI entry point packaged by Homebrew is kstool, while the main value of
      Keystone is the library API: programs call the engine to turn
      architecture-specific assembly text into machine-code bytes. Its
      multi-architecture scope makes it useful for tests, shellcode generation, binary
      rewriting, and educational tooling.
related-packages:
  - id: brew:capstone
    reason: >
      Capstone complements Keystone by disassembling machine-code bytes into
      instructions, providing the reverse operation needed in many binary-analysis and
      rewriting workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/keystone-engine/keystone
      - https://www.capstone-engine.org/showcase.html
      - https://www.capstone-engine.org/documentation.html
