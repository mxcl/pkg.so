id: brew:neon
display-name: neon
repo: https://github.com/notroj/neon
docs:
  - https://notroj.github.io/neon-docs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      neon mattered historically because it was an early Unix C library for WebDAV-heavy
      clients. Apache Subversion's WebDAV notes describe the Subversion client side
      interfacing with Neon to generate WebDAV requests, and cite Joe Orton of Neon
      among the HTTP library implementors involved in that ecosystem.
  package-nerd-significance:
    - >
      neon is a classic dependency package: quiet, old, and most visible when some
      WebDAV or legacy HTTP client still expects its ABI. For package databases, its
      history is more about downstream consumers and compatibility than about an
      end-user command.
  project-history:
    - >
      The official documentation carries a 2001-2026 Joe Orton copyright line, and the
      GitHub mirror/repository was created on 2019-03-07. The README states that neon's
      API and ABI keep backwards compatibility from 0.27 through 1.0.0, with semantic
      versioning intended from 1.0.0 onward.
  related-projects:
    - WebDAV
    - HTTP/1.1
    - Apache Subversion
    - cadaver
    - OpenSSL
    - GnuTLS
    - libxml2
  sources:
    - https://api.github.com/repos/notroj/neon
    - https://formulae.brew.sh/api/formula/neon.json
    - https://github.com/notroj/neon
    - https://notroj.github.io/neon-docs/
    - >
      https://svn.apache.org/repos/asf/subversion/trunk/notes/http-and-webdav/webdav-usage.html
  summary:
    - >
      neon is a C library for HTTP/1.1 and WebDAV clients. Its README describes
      high-level HTTP/WebDAV methods, lower-level request handling, persistent
      connections, Basic and Digest authentication, Kerberos/SSPI/NTLM support, proxy
      support, TLS via OpenSSL or GnuTLS, WebDAV 207 XML handling, WebDAV locking/ACL
      support, and autoconf macros for embedding.
  timeline:
    - '2001: Earliest year in the official documentation copyright range.'
    - >
      2002-01-25: Apache Subversion WebDAV note last modified, documenting client-side
      use of Neon.
    - '2019-03-07: notroj/neon GitHub repository created.'
    - '2026-07-01: Homebrew API snapshot listed stable version 0.37.1.'
  usage:
    - >
      Package users usually do not run neon directly except for neon-config; they
      install it because another source build or package needs the C library, headers,
      pkg-config/autoconf metadata, and TLS/XML dependencies. Homebrew packages it as a
      library with OpenSSL and libxml2 support, and the 2026-07-01 formula API snapshot
      reported 5,364 installs over 365 days, with 3,231 install-on-request events.
related-packages:
  - id: brew:cadaver
    reason: >
      cadaver is a command-line WebDAV client built against neon, making it a practical
      way to use the library's WebDAV capabilities interactively.
    rel: adjacent_workflow
    sources:
      - https://notroj.github.io/cadaver/
      - https://notroj.github.io/neon/
  - id: brew:curl
    reason: >
      Choose libcurl when an application needs a broader multi-protocol transfer
      library; choose neon when its higher-level WebDAV operations and C API are the
      better fit.
    rel: alternative
    sources:
      - https://curl.se/libcurl/
      - https://notroj.github.io/neon/
