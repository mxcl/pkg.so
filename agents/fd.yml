id: brew:fd
display-name: fd
repo: null
docs:
  - https://github.com/sharkdp/fd#readme
config-file-location:
  unix:
    - .fdignore
    - ~/.fdignore
    - ~/.config/fd/ignore
  windows:
    - .fdignore
    - '%APPDATA%\fd\ignore'
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata shows fd in many package managers, including
      Homebrew, MacPorts, Nix, Arch, Alpine, Chocolatey, Scoop, winget, and
      openSUSE-style packaging. That breadth matches its role as a widely adopted
      developer workstation utility rather than a niche script.
    - >
      The GitHub repository metadata shows a large user base for a CLI tool, with tens
      of thousands of stars and more than a thousand forks at lookup time. Those numbers
      are not a substitute for install counts, but they support fd's status as one of
      the best-known modern replacements around classic Unix file search.
  package-nerd-significance:
    - >
      fd is one of the canonical package-manager installs for a modern command-line
      environment, often grouped with ripgrep, bat, exa/eza, and other Rust or
      Rust-adjacent developer tools. It matters because it changes the default
      ergonomics of filesystem search while still composing with Unix pipelines.
    - >
      For maintainers, fd also carries cross-platform naming and packaging concerns:
      some distributions use `fdfind` to avoid a name conflict, and the changelog notes
      release work around aliases, Windows builds, macOS architecture support, and
      minimum Rust versions.
  project-history:
    - >
      The fd repository was created in May 2017, with an early v0.1.0 tag that same
      month. Its README has consistently positioned the tool as an opinionated
      alternative to `find`: not a complete replacement for every `find` expression, but
      a faster default for common file-name and path searches.
    - >
      fd's design reflects the Rust CLI wave of the late 2010s: regex or glob matching,
      colored output, smart case, parallel traversal, Git-aware ignore handling, and
      integration with other tools through `--exec`, `--exec-batch`, and null-delimited
      output.
  related-projects:
    - >
      The README explicitly relates fd to GNU findutils `find` as the traditional tool
      it streamlines for common use cases.
    - >
      The README demonstrates composition with ripgrep and uses ignore-file behavior
      familiar from Git-oriented search tools.
  sources:
    - https://github.com/sharkdp/fd
    - https://github.com/sharkdp/fd/blob/master/README.md
    - https://github.com/sharkdp/fd/blob/master/CHANGELOG.md
    - https://api.github.com/repos/sharkdp/fd
    - https://api.github.com/repos/sharkdp/fd/tags?per_page=100
    - https://formulae.brew.sh/formula/fd
  summary:
    - >
      fd is a Rust command-line filesystem search tool designed as a simple, fast,
      user-friendly alternative to Unix `find`.
  timeline:
    - '2017: Repository created and v0.1.0 tag published.'
    - '2024: v9.0.0 changelog records significant traversal performance improvements.'
    - '2024: v10.0.0 changed hidden `.git` ignore behavior and raised the minimum Rust version.'
    - '2026: v10.4.2 released to fix a performance regression.'
  usage:
    - >
      The basic usage is `fd PATTERN`, recursively searching the current directory for
      entries containing the pattern. The README contrasts that with more verbose `find`
      forms and documents common options for extension filtering, glob mode, full-path
      matching, hidden files, ignored files, command execution, and exclusion globs.
    - >
      fd is commonly used alone for interactive file discovery and as a front end to
      other commands. Examples in the README include formatting matching source files
      with `clang-format`, opening test files in an editor, computing checksums in
      parallel, and piping selected file classes into ripgrep.
related-packages:
  - id: brew:findutils
    reason: >
      Choose GNU Findutils when scripts need the full expressive power and established
      semantics of `find`; choose fd for concise interactive searches, parallel
      traversal, and opinionated ignore handling.
    rel: alternative
    sources:
      - https://github.com/sharkdp/fd
      - https://www.gnu.org/software/findutils/manual/html_mono/find.html
  - id: brew:bfs
    reason: >
      Choose bfs when you want broad `find` expression compatibility with breadth-first
      traversal; choose fd when simpler regex/glob syntax and Git-aware defaults matter
      more.
    rel: alternative
    sources:
      - https://github.com/sharkdp/fd
      - https://tavianator.com/projects/bfs.html
  - id: brew:fzf
    reason: >
      fd's official integration guide uses fd as fzf's file-list generator, combining
      fast filesystem enumeration with interactive fuzzy selection.
    rel: adjacent_workflow
    sources:
      - https://github.com/sharkdp/fd
      - https://junegunn.github.io/fzf/
  - id: brew:tree
    reason: >
      The fd README documents piping filtered fd results into `tree --fromfile` to
      render an ignore-aware or extension-filtered directory tree.
    rel: adjacent_workflow
    sources:
      - https://github.com/sharkdp/fd
      - https://oldmanprogrammer.net/source.php?dir=projects/tree
