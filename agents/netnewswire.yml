history:
  adoption-history:
    - >
      NetNewsWire became a prominent native Mac reader during the early RSS boom and
      later shipped on iPhone and iPad. Its return to independent, open-source
      development preserved a familiar native client as commercial interest in
      standalone feed readers declined.
    - >
      Modern NetNewsWire can manage local subscriptions or synchronize through supported
      feed services, allowing it to serve both standalone and multi-device reading
      workflows.
  package-nerd-significance:
    - >
      NetNewsWire is a long-lived native Mac utility whose history spans shareware,
      corporate ownership, and community open-source development. Its survival tracks
      the history of desktop RSS software and makes it a recognizable package for users
      who prefer open protocols and native applications.
  project-history:
    - >
      Brent Simmons released NetNewsWire Lite in 2002 and NetNewsWire 1.0 in 2003.
      NewsGator acquired the application in 2005, followed by Black Pixel in 2011.
    - >
      Black Pixel returned the name to Simmons in 2018. He renamed his in-development
      Evergreen reader to NetNewsWire, and the new free and open-source NetNewsWire 5.0
      shipped in 2019.
  related-projects:
    - Evergreen
    - RSS
    - Atom
    - JSON Feed
    - Feedbin
    - Feedly
  sources:
    - 'Official help: https://netnewswire.com/help/'
    - 'Official history: https://netnewswire.com/history.html'
    - 'Official project page: https://netnewswire.com/'
    - 'Official repository: https://github.com/Ranchero-Software/NetNewsWire'
  summary:
    - >
      NetNewsWire is a free and open-source feed reader for macOS and iOS, originally
      created by Brent Simmons.
  timeline:
    - '2002: NetNewsWire Lite entered public beta.'
    - '2003: NetNewsWire 1.0 was released.'
    - '2005: NewsGator acquired NetNewsWire.'
    - '2011: Black Pixel acquired NetNewsWire.'
    - '2018: The name returned to Brent Simmons and the project entered its open-source era.'
    - '2019: The open-source NetNewsWire 5.0 was released.'
  usage:
    - >
      Users subscribe to RSS, Atom, JSON Feed, and RSS-in-JSON sources, organize them
      into folders, and track unread or starred articles. OPML import and export and
      multiple account types support migration and synchronization.
    - >
      Credentials and service tokens used by syncing accounts are stored in the macOS
      Keychain, as documented by the project's official release notes.
