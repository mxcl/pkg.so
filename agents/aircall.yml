history:
  adoption-history:
    - >
      Aircall grew from its first 100 customers in 2014 into an international business
      communications platform. Its official company history reports more than 23,000
      customer businesses, over 800 employees, nine offices, and more than $100 million
      in annual recurring revenue in 2022.
    - >
      The product broadened from cloud telephony into a unified workspace spanning
      calls, messaging, CRM context, integrations, automated workflows, and AI-assisted
      conversation analysis.
  package-nerd-significance:
    - >
      Aircall represents the SaaS desktop-client class of Homebrew Casks: installation
      can be automated locally, but accounts, phone numbers, routing, integrations, and
      most policy live in the vendor's cloud service. Administrators can also deploy the
      official macOS PKG through device-management systems.
  project-history:
    - >
      Aircall was created in Paris in 2014 and gained its first 100 customers that year.
      Its founders joined the 500 Startups accelerator in 2015, followed by an $8
      million Series A in 2016. The company subsequently expanded internationally and
      developed Aircall Workspace as its unified desktop and web communications
      interface.
  related-projects:
    - Aircall Workspace
    - Aircall mobile apps
    - Aircall browser extension
    - Aircall API and integrations marketplace
  sources:
    - https://aircall.io/
    - https://aircall.io/about-us/
    - https://support.aircall.io/en-gb
    - https://support.aircall.io/en-gb/articles/21534389326493
  summary:
    - >
      Aircall is a cloud customer-communications and business-phone platform for sales
      and support teams. Its desktop application provides calling, messaging, shared
      conversation history, CRM context, integrations, and AI-assisted workflows.
  timeline:
    - '2014: Created in Paris and reached its first 100 customers'
    - '2015: Founders joined the 500 Startups accelerator'
    - '2016: Raised an $8 million Series A'
    - '2022: Reported more than $100 million in annual recurring revenue'
    - '2020s: Aircall Workspace became the unified desktop and web experience'
  usage:
    - >
      Organizations provision users and phone numbers in Aircall, then agents use the
      desktop or web workspace to make and receive calls, exchange messages, work shared
      inboxes, and synchronize activity with CRM and help-desk integrations. A valid
      Aircall account is required; no official local credentials file is documented.
