id: brew:mcpsnoop
display-name: mcpsnoop
repo: null
docs:
  - https://github.com/kerlenton/mcpsnoop/tree/main/docs
  - https://github.com/kerlenton/mcpsnoop#readme
config-file-location:
  unix:
    - ./.mcpsnoop.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project distributes a single Go binary through GitHub releases, `go install`,
      and Homebrew. Its early release series moved from v0.1.0 in June 2026 to v0.16.0
      in July 2026, adding workflows for saved sessions and CI-oriented protocol checks
      alongside the interactive TUI.
  package-nerd-significance:
    - >
      mcpsnoop brings packet-inspection conventions to MCP without requiring a
      language-specific SDK or modified server. Its single-binary packaging and CI exit
      codes make captured agent-tool traffic usable both interactively and as a
      reproducible test artifact.
  project-history:
    - >
      The project appeared publicly in June 2026 with an initial v0.1.0 release. It was
      designed to complement MCP Inspector by sitting directly in the client's real data
      path rather than establishing a separate inspection connection.
  related-projects:
    - >
      MCP Inspector is the official comparison point; mcpsnoop differs by observing the
      user's real client-server connection.
    - Model Context Protocol and JSON-RPC define the traffic mcpsnoop captures and validates.
  sources:
    - https://api.github.com/repos/kerlenton/mcpsnoop
    - https://github.com/kerlenton/mcpsnoop#readme
    - https://github.com/kerlenton/mcpsnoop/releases/tag/v0.1.0
    - https://github.com/kerlenton/mcpsnoop/releases/tag/v0.16.0
    - source_facts.package-manager
  summary:
    - >
      mcpsnoop is a transparent proxy and terminal interface for observing Model Context
      Protocol traffic between an actual AI client and its MCP servers. It captures
      JSON-RPC frames from stdio or streamable-HTTP connections and supports live
      inspection, replay, export, comparison, and automated checks.
  timeline:
    - '2026: The official repository and v0.1.0 release appeared on June 27.'
    - '2026: Version v0.16.0 was released on July 27.'
  usage:
    - >
      For stdio servers, users replace the configured server command with `mcpsnoop --
      <server command>` and run `mcpsnoop` separately to open the TUI. For streamable
      HTTP, `mcpsnoop http` acts as a reverse proxy. Commands can reopen, export,
      compare, replay, validate, and prune captured sessions.
related-packages:
  - id: brew:mcp-inspector
    reason: >
      Choose MCP Inspector to connect as a dedicated client and exercise a server
      through web, CLI, or TUI interfaces; choose mcpsnoop when you must observe what a
      real client and server exchange on the wire.
    rel: alternative
    sources:
      - https://github.com/kerlenton/mcpsnoop#how-it-compares
      - https://modelcontextprotocol.io/docs/tools/inspector
