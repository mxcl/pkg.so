display-name: QR Journal
repo: null
docs:
  - https://www.joshjacob.com/mac-development/qrjournal-help
  - https://www.joshjacob.com/mac-development/qrjournal.php
config-file-location:
  macos:
    - ~/Library/Containers/com.joshjacob.qrjournal/Data/Library/Application Support/QRJournal/
credentials-file-location: null
history:
  adoption-history:
    - >
      QR Journal has remained a focused macOS utility rather than a hosted platform. Its
      official changelog shows continued maintenance across multiple macOS generations,
      including Catalina notarization and later universal support for Apple silicon and
      Intel Macs.
  package-nerd-significance:
    - >
      QR Journal exemplifies the small, single-purpose native utilities represented in
      Homebrew Cask. Package management provides a repeatable installation path for an
      application otherwise distributed through the developer's site or the Mac App
      Store.
  project-history:
    - >
      Developer Josh Jacob created QR Journal to scan QR codes with a Mac's iSight or
      compatible camera. Later releases added image import, URL watching, AppleScript
      integration, QR-code generation, Catalina notarization, and Apple-silicon support.
  related-projects:
    - AppleScript
    - macOS Camera
    - Homebrew Cask
  sources:
    - 'Official changelog: https://www.joshjacob.com/mac-development/qrjournal-changelog.php'
    - >
      Official data-storage documentation:
      https://www.joshjacob.com/mac-development/qrjournal-help/pages/resources.html
    - 'Official help: https://www.joshjacob.com/mac-development/qrjournal-help/'
    - 'Official product page: https://www.joshjacob.com/mac-development/qrjournal.php'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      QR Journal is a macOS utility by Josh Jacob for scanning QR codes with a camera or
      from imported images, saving recognized codes, generating new codes, and
      integrating scanning with AppleScript.
  timeline:
    - 'Version 1.0: Initial release.'
    - >
      Version 2.0: Added QR-code generation, Catalina support, notarization, and
      expanded AppleScript support.
    - >
      Version 3.0: Added Apple-silicon and Intel support, mirrored-video settings, and a
      new icon.
  usage:
    - >
      Users can scan a physical QR code through a compatible camera, import a code from
      an image or email, continuously watch for URLs, save captures in a journal,
      generate QR images, or pass recognized text to AppleScript workflows.
    - >
      The official help states that application data is stored under the sandboxed
      Application Support directory. The application does not require service
      credentials.
