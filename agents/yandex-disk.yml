history:
  adoption-history:
    - >
      Yandex positioned Disk as storage usable from computers, phones, and other
      internet-connected devices. It later became part of the wider Yandex 360 offering,
      with dedicated desktop clients and selective synchronization workflows.
    - >
      Yandex's company history records that the earlier Yandex.Fotki photo-hosting
      service was merged into Yandex Disk in 2018.
  package-nerd-significance:
    - >
      The macOS cask packages a proprietary cloud-sync client whose behavior spans local
      files and remote state. It is a representative example of why graphical package
      management is valuable even when an application's data service and authentication
      remain vendor-managed.
  project-history:
    - >
      Yandex launched Yandex.Disk in beta on April 5, 2012 as a service for storing
      files online and accessing them from internet-connected devices. The launch
      included file sharing, cross-device access, and integration with Yandex Mail
      attachments.
    - >
      The service evolved into a desktop experience where cloud files can appear
      alongside selectively downloaded local copies. Official documentation now covers
      macOS and Windows graphical clients and a Linux console client.
  related-projects:
    - Yandex 360 incorporates Yandex Disk alongside other Yandex productivity services.
    - Yandex Mail supplied an early integration by saving mail attachments into Disk.
    - Yandex.Fotki was merged into Yandex Disk in 2018.
  sources:
    - 'Official company history: https://yandex.com/company/history'
    - 'Official launch announcement: https://yandex.com/company/news/2012-2012-04-05'
    - >
      Official macOS help:
      https://yandex.com/support/yandex-360/customers/disk/desktop/macos/en/
  summary:
    - >
      Yandex Disk is Yandex's cloud file-storage and synchronization service. Its macOS
      client exposes cloud content as a desktop file workflow and supports selective
      local storage, synchronization, sharing, and screenshots.
  timeline:
    - '2012: Yandex.Disk launched in beta with online storage and cross-device access.'
    - '2018: Yandex.Fotki was merged into Yandex Disk.'
  usage:
    - >
      Users sign in with a Yandex account, choose which cloud files or folders to retain
      locally, and let the desktop application synchronize changes. The application also
      supports sharing files and taking screenshots.
