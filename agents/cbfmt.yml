id: brew:cbfmt
display-name: cbfmt
repo: null
docs:
  - https://github.com/lukas-reineke/cbfmt#readme
config-file-location:
  unix:
    - .cbfmt.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata shows cbfmt available through Homebrew and Nix.
      GitHub Releases published the v0.2.0 release on August 31, 2022.
  package-nerd-significance:
    - >
      cbfmt is package-nerd-relevant because it composes existing language formatters
      instead of replacing them, giving documentation projects a small CLI for keeping
      embedded examples formatted.
  project-history:
    - >
      The official repository was created in July 2022. Its README defines cbfmt as a
      tool that iterates over document code blocks and runs configured formatting
      commands for each block language.
  related-projects:
    - >
      rustfmt, gofmt, stylua, and black are example formatter commands shown in the
      official configuration example.
    - >
      Markdown, Org, and reStructuredText are the document formats named by the official
      README.
  sources:
    - https://api.github.com/repos/lukas-reineke/cbfmt
    - https://api.github.com/repos/lukas-reineke/cbfmt/releases
    - https://github.com/lukas-reineke/cbfmt#readme
    - source_facts.package-manager
  summary:
    - >
      cbfmt is a Rust command-line formatter driver for code blocks inside Markdown,
      Org, and reStructuredText documents.
  timeline:
    - '2022: The official GitHub repository was created.'
    - '2022: v0.1.x and v0.2.0 releases were published.'
    - '2023: The official repository metadata records later maintenance activity.'
  usage:
    - >
      A `.cbfmt.toml` file maps code block languages to formatter commands that read
      stdin and write stdout. Users can check or rewrite files, process directories
      recursively, or read a document from stdin.
related-packages:
  - id: brew:black
    reason: >
      Use Black as cbfmt's configured stdin/stdout formatter for Python code blocks;
      cbfmt's official example invokes Black with `black --fast -`.
    rel: adjacent_workflow
    sources:
      - https://github.com/lukas-reineke/cbfmt#readme
      - https://black.readthedocs.io/en/stable/
  - id: brew:stylua
    reason: >
      Use StyLua as cbfmt's formatter for embedded Lua code; cbfmt's official
      configuration example invokes `stylua -s -`.
    rel: adjacent_workflow
    sources:
      - https://github.com/lukas-reineke/cbfmt#readme
      - https://github.com/JohnnyMorganz/StyLua
