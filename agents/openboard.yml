config-file-location:
  linux:
    - /opt/openboard/etc/OpenBoard.config
    - ~/.local/share/OpenBoard/OpenBoardUser.config
  macos:
    - /Applications/OpenBoard.app/Contents/Resources/etc/OpenBoard.config
    - ~/Library/Application Support/OpenBoard/OpenBoardUser.config
  windows:
    - '%PROGRAMFILES%\OpenBoard\etc\OpenBoard.config'
    - '%USERPROFILE%\AppData\Local\OpenBoard\OpenBoardUser.config'
credentials-file-location: null
history:
  adoption-history:
    - >
      OpenBoard's lineage moved from a university-developed commercial product to free
      educational software and finally to a community-oriented fork focused on classroom
      work. That history helped it retain compatibility with established
      interactive-whiteboard practices while remaining open source.
    - >
      The project is maintained by the Geneva cantonal education department with support
      associated with the University of Lausanne. It supports Windows, macOS, and Debian
      officially, while community packages extend its reach to other Linux
      distributions.
    - >
      The official project site reports interest across Switzerland, Europe, and North
      America and describes institutional discussions among Swiss universities, cantonal
      education departments, and other educational organizations.
  package-nerd-significance:
    - >
      OpenBoard is a long-lived example of educational desktop software surviving
      several organizational transitions and forks while preserving an open,
      cross-platform codebase.
    - >
      Its package footprint is unusually rich for a whiteboard: native Qt application
      code, platform installers, editable configuration layers, portable lesson
      documents, multimedia libraries, and embeddable web widgets all matter to
      distributors and administrators.
  project-history:
    - >
      The software lineage began at the University of Lausanne in 2003 as Uniboard,
      developed with educators and specialists for interactive teaching. The UNIL
      spin-off Mnemis SA was formed in 2008 to commercialize continued development.
    - >
      In 2010, the Interministerial Delegation for Digital Education in Africa acquired
      Uniboard, made it free and open source, and renamed it Open-Sankoré. The Open
      Education Foundation forked Open-Sankoré 2.0 in spring 2013 to create OpenBoard
      and refocus development on simple classroom workflows.
    - >
      OpenBoard later came under maintenance associated with the Department of Public
      Education of Geneva, with the University of Lausanne contributing support and
      multiple Swiss educational institutions participating in discussions about its
      evolution.
  related-projects:
    - >
      Uniboard is the original University of Lausanne project from which the software
      lineage descends.
    - >
      Open-Sankoré was the free and open-source successor to Uniboard and the direct
      upstream fork point for OpenBoard.
    - >
      OpenBoard web widgets use packaged web content and an application-specific
      JavaScript API.
  sources:
    - https://github.com/OpenBoard-org/OpenBoard#readme
    - https://github.com/OpenBoard-org/OpenBoard/wiki/Configuration
    - https://openboard.ch/download/OpenBoard_Users_Guide_1.3.6.pdf
    - https://www.openboard.ch/en
    - https://www.openboard.ch/en/documentation
  summary:
    - >
      OpenBoard is an open-source interactive whiteboard and rich-media lesson-authoring
      application intended primarily for teaching. It works with interactive displays,
      pen tablets, projectors, or an ordinary computer.
  timeline:
    - '2003: The University of Lausanne began developing Uniboard.'
    - >
      2008: Mnemis SA was formed as a University of Lausanne spin-off to develop and
      commercialize Uniboard.
    - '2010: Uniboard became free and open source under the name Open-Sankoré.'
    - '2013: The Open Education Foundation forked Open-Sankoré 2.0 to create OpenBoard.'
    - >
      2016: Swiss universities, education departments, and institutions met to discuss
      OpenBoard's future evolution.
    - '2018: OpenBoard 1.5 redesigned Documents mode and delivered additional improvements.'
  usage:
    - >
      Teachers can handwrite or draw on a whiteboard canvas, annotate documents and web
      material, combine images, audio, video, and graphics, and prepare presentations
      without specialized hardware.
    - >
      OpenBoard supports classroom projection and dual-screen arrangements as well as
      standalone lesson preparation. Documents can be exported individually or collected
      into UBX archives for backup and transfer.
    - >
      Administrators can change ordinary preferences in the application or edit
      `OpenBoardUser.config`; system-wide defaults reside in `OpenBoard.config`.
