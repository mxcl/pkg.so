history:
  adoption-history:
    - >
      FLANN became a common dependency in scientific, machine-learning, and
      computer-vision packaging because it provides a reusable native nearest-neighbor
      engine with bindings. Homebrew packages it as a formula, while the official README
      points users to release archives and source checkout for development.
  package-nerd-significance:
    - >
      FLANN is package-nerd interesting because it is classic research software that
      became infrastructure: a C++ core, language bindings, release archives, example
      binaries, and packaging concerns around native builds rather than a single
      end-user CLI.
  project-history:
    - >
      The public repository history begins in 2007, and the project was documented
      academically in the 2009 Muja and Lowe VISAPP paper on automatic algorithm
      configuration for approximate nearest neighbors. The project later exposed C,
      MATLAB, Python, and Ruby bindings around the C++ implementation, making the
      research code useful as a packaged native library rather than only as an
      experiment.
  related-projects:
    - >
      The official README ties FLANN to its C, MATLAB, Python, and Ruby bindings, and to
      approximate nearest-neighbor research rather than to a single desktop application.
  sources:
    - https://formulae.brew.sh/formula/flann
    - https://github.com/flann-lib/flann
    - https://raw.githubusercontent.com/flann-lib/flann/master/README.md
    - https://www.cs.ubc.ca/research/flann/uploads/FLANN/flann_visapp09.pdf
  summary:
    - >
      FLANN, the Fast Library for Approximate Nearest Neighbors, is a C++ library for
      fast approximate nearest-neighbor search in high-dimensional spaces. Its README
      describes both a collection of nearest-neighbor algorithms and automatic selection
      of an algorithm and parameters for a given dataset.
  timeline:
    - '2007: Initial public repository import.'
    - '2009: Muja and Lowe publish the FLANN algorithm-configuration paper.'
    - '2012: 1.8.0 source tag appears in the public git history.'
    - '2021: 1.9.2 tag appears in the public git history.'
  usage:
    - >
      Users bring FLANN into applications that need approximate nearest-neighbor lookup
      over feature vectors or other high-dimensional data. The bundled package
      executables are examples; the main package value is the library and its language
      bindings.
related-packages:
  - id: brew:ngt
    reason: >
      Choose NGT when you specifically want a graph-and-tree index with documented
      support for dynamic registration, memory-mapped indexes, and a broad set of vector
      distance functions rather than FLANN's automatically selected algorithm
      collection.
    rel: alternative
    sources:
      - https://github.com/flann-lib/flann
      - https://github.com/NGT-labs/NGT
