history:
  adoption-history:
    - >
      Adoption is concentrated in the classic Doom speedrunning and source-port
      communities rather than in mainstream game distribution. Its package presence in
      Homebrew, Debian, Ubuntu, Fedora, Nix, and zypper makes it easy for runners, demo
      viewers, and tool-assisted-speedrun authors to install the same port across
      platforms.
    - >
      Homebrew's formula listed 431 installs over the preceding 365 days when checked
      for this enrichment batch, a modest but real signal for a specialist source port.
  package-nerd-significance:
    - >
      For package nerds, DSDA-Doom is interesting because it packages a living fork in a
      long lineage of Doom ports: Doom, Boom, MBF, PrBoom+, PrBoom+ UM, and then
      DSDA-Doom. Its value depends as much on reproducibility and demo sync as on
      end-user features, so distribution packages are part of preserving a shared
      competitive/tooling environment.
  project-history:
    - >
      The project follows the PrBoom+ line rather than starting as a general-purpose new
      engine. Its README describes it as a successor of PrBoom+ and emphasizes
      speedrunning-oriented strictness, advanced TAS tools, rewind, debugging features,
      and compatibility work for Heretic, Hexen, MBF21, UDMF, MAPINFO, and
      Doom-in-Hexen.
    - >
      The README records a maintainer handoff pattern: @kraflab maintained the project
      from 2020 through 2024, and @fabiangreffrath, @rfomin, and @Pedro-Beirao are
      listed as maintainers from 2024 onward. Release notes in the v0.28 and v0.29
      series show the port continuing to add game-format support, demo-related fixes,
      launcher/build improvements, macOS/Windows packaging, and speedrunning-specific
      behavior fixes.
  related-projects:
    - PrBoom+ is the direct predecessor named by the README.
    - >
      The Doom Speed Demos Archive is the community context implied by the DSDA name and
      by the port's speedrunning focus.
    - MBF21 and UMAPINFO are related Doom mapping/demo standards linked from the README.
    - Pedro-Beirao's dsda-launcher is a companion launcher linked by the README.
  sources:
    - https://github.com/kraflab/dsda-doom#readme
    - https://github.com/kraflab/dsda-doom/releases/tag/v0.28.0
    - https://github.com/kraflab/dsda-doom/releases/tag/v0.29.3
    - https://github.com/kraflab/dsda-doom/releases/tag/v0.29.4
    - https://formulae.brew.sh/formula/dsda-doom
  summary:
    - >
      DSDA-Doom is a Doom-family source port built for demo compatibility, speedrunning,
      TAS work, and modern map-standard support. It presents itself as a successor to
      PrBoom+ and has become one of the practical ports used around the Doom Speed Demos
      Archive ecosystem.
  timeline:
    - >
      2020: The README's maintainer list marks @kraflab's DSDA-Doom maintainership as
      beginning in this period.
    - >
      2024: The README lists @fabiangreffrath, @rfomin, and @Pedro-Beirao as maintainers
      from 2024 onward.
    - >
      2024-08-10: v0.28.0 was published with a large feature release including freelook
      rewrite work, UDMF additions, quality-of-life changes, and demo/tooling updates.
    - >
      2025-07-03: v0.29.3 was published with packaged Linux, macOS, and Windows release
      assets.
    - >
      2025-09-26: v0.29.4 was published and is the Homebrew stable version recorded for
      this batch.
  usage:
    - >
      Users run DSDA-Doom to play, record, validate, inspect, and replay Doom-engine
      demos with stricter compatibility expectations than a casual enhanced port. The
      README's feature list is especially relevant to speedrunners: strict mode, TAS
      tools, rewind, debugging aids, and support for modern community mapping standards.
related-packages:
  - id: brew:woof-doom
    reason: >
      Choose Woof! for a conservative Boom/MBF-oriented Doom port with modern
      community-standard support and a less speedrunning-specific focus; its official
      README explicitly places DSDA-Doom in its source-port lineage.
    rel: alternative
    sources:
      - https://github.com/fabiangreffrath/woof#readme
      - https://github.com/kraflab/dsda-doom#readme
  - id: cask:gzdoom
    reason: >
      Choose GZDoom when advanced modding, ZScript, true-color rendering, dynamic
      lights, and other enhanced-engine features matter more than DSDA-Doom's
      conservative demo and speedrunning behavior.
    rel: alternative
    sources:
      - https://zdoom.org/wiki/GZDoom
      - https://github.com/kraflab/dsda-doom#readme
