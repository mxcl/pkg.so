id: brew:licensed
display-name: Licensed
repo: null
docs:
  - https://github.com/licensee/licensed/tree/main/docs
  - https://github.com/licensee/licensed#readme
config-file-location:
  unix:
    - ./.licensed.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Licensed became useful to repositories that wanted license checks in development
      and continuous integration without manually inspecting every transitive
      dependency. Its source enumerators cover multiple language ecosystems, and its
      Homebrew formula made the Ruby CLI easy to install on macOS.
  package-nerd-significance:
    - >
      Licensed is package-nerd notable because it treats license review as package
      metadata that can be cached, diffed, and enforced in CI. It also shows the
      practical boundary between SPDX-style license identification and the messy
      package-manager work of finding dependency sources.
  project-history:
    - >
      The public GitHub repository was created on 2018-02-02 under GitHub's license
      tooling namespace and later moved under the licensee organization. The README
      describes the project as a Ruby gem and warns that it is not a complete
      open-source compliance solution.
    - >
      The changelog shows the project evolving through compatibility-driven releases: v3
      added migration guidance for self-contained builds, v4 removed self-contained
      executable releases and older Go support, and v5 required Ruby 3.0 or newer.
  related-projects:
    - >
      Related projects include Licensee for license detection, SPDX license data, and
      other dependency-license scanners such as LicenseFinder.
  sources:
    - https://api.github.com/repos/licensee/licensed
    - https://formulae.brew.sh/formula/licensed
    - https://github.com/licensee/licensed
    - >
      https://raw.githubusercontent.com/licensee/licensed/fa9914ac4db957a3197c9a0858aec18ba2f47bba/CHANGELOG.md
    - https://raw.githubusercontent.com/licensee/licensed/main/CHANGELOG.md
    - https://raw.githubusercontent.com/licensee/licensed/main/README.md
  summary:
    - >
      Licensed is a Ruby command-line tool for caching dependency license texts and
      checking them against repository policy. It sits in the GitHub Licensee ecosystem:
      Licensee detects license text, while Licensed records and verifies the
      dependency-level results that package managers expose.
  timeline:
    - '2018-02-02: GitHub repository created.'
    - >
      2022-03-17: v3.6.0 changelog entry adds getting-started documentation and
      npm-workspaces support.
    - >
      2023: v4.0.0 changelog entry removes self-contained executable releases and adds
      CocoaPods and Gradle multi-project support.
    - '2024: v5.0.0 changelog entry requires Ruby 3.0 or newer.'
    - '2025: v5.0.3 changelog entry adds pnpm v9 support.'
  usage:
    - >
      A project adds a .licensed.yml file, runs Licensed to cache dependency records,
      and then runs status or verification commands to catch newly introduced, stale, or
      disallowed dependency licenses.
related-packages:
  - id: brew:licensefinder
    reason: >
      Choose LicenseFinder when you want a broad package-manager scanner with an
      auditable dependency_decisions.yml approval log; Licensed instead maintains cached
      license records and validates their status.
    rel: alternative
    sources:
      - https://github.com/pivotal/LicenseFinder
      - https://github.com/licensee/licensed
  - id: brew:licensee
    reason: >
      Use Licensee alongside Licensed to identify the license of a project itself, while
      Licensed inventories and checks the licenses of that project's dependencies.
    rel: adjacent_workflow
    sources:
      - https://licensee.github.io/licensee/what-we-look-at/
      - https://github.com/licensee/licensed
