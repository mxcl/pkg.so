history:
  adoption-history:
    - >
      TechSmith describes Snagit as established screen-capture software used for
      documentation, training, troubleshooting, feedback, and asynchronous workplace
      communication. Its official customer material particularly highlights adoption by
      technical writers and support teams.
  package-nerd-significance:
    - >
      Snagit is one of the enduring commercial desktop capture packages. For package
      users it is notable for combining system-wide capture integration, an editor, a
      searchable local library, lightweight video recording, and numerous sharing
      destinations in one install.
  project-history:
    - >
      TechSmith introduced Snagit in 1990 as screen-capture software. Over subsequent
      decades it expanded beyond still captures into scrolling capture, annotation,
      searchable capture libraries, animated GIFs, screen and camera recording,
      templates, sharing integrations, and step-by-step documentation workflows.
  related-projects:
    - >
      Camtasia is TechSmith's more advanced video recording and editing product;
      TechSmith positions Snagit for screenshots and lightweight video, while Camtasia
      serves more elaborate video production.
    - Screencast is a TechSmith sharing service integrated into Snagit workflows.
  sources:
    - 'Official Snagit tutorials: https://www.techsmith.com/learn/tutorials/snagit/'
    - >
      Official TechSmith comparison of Snagit and Camtasia:
      https://www.techsmith.com/blog/snagit-vs-camtasia/
    - >
      Official TechSmith material identifying Snagit's 1990 introduction:
      https://download.techsmith.com/camtasia/camprodmanual.pdf
    - >
      Official technical-writer use-case article:
      https://www.techsmith.com/blog/why-technical-writers-choose-snagit/
  summary:
    - >
      Snagit is TechSmith's long-running commercial application for capturing, editing,
      organizing, recording, and sharing visual information from a computer screen.
  timeline:
    - '1990: TechSmith introduced Snagit as screen-capture software.'
    - >
      2010s–2020s: Snagit developed into a cross-platform visual-communication tool
      spanning screenshots, scrolling capture, annotation, capture libraries, GIFs, and
      lightweight video.
    - >
      2020s: TechSmith increasingly positioned Snagit for technical documentation,
      process guides, feedback, training, and asynchronous collaboration.
  usage:
    - >
      Users capture a screen, window, region, scrolling page, camera, or short video;
      annotate or edit the result; organize it in the Snagit Library; and export or
      share it. Common workflows include software documentation, bug reports, training
      materials, visual feedback, and quick process demonstrations.
