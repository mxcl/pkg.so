id: brew:percona-server@8.4
display-name: Percona Server for MySQL 8.4
repo: https://github.com/percona/percona-server
docs:
  - https://docs.percona.com/percona-server/8.4/index-contents.html
  - https://docs.percona.com/percona-server/8.4/index.html
config-file-location:
  unix:
    - /etc/my.cnf
    - /etc/mysql/my.cnf
    - $SYSCONFDIR/my.cnf
    - $MYSQL_HOME/my.cnf
    - ~/.my.cnf
    - $DATADIR/mysqld-auto.cnf
  windows:
    - '%WINDIR%\my.ini'
    - '%WINDIR%\my.cnf'
    - C:\my.ini
    - C:\my.cnf
    - '%BASEDIR%\my.ini'
    - '%BASEDIR%\my.cnf'
    - '%DATADIR%\mysqld-auto.cnf'
credentials-file-location:
  unix:
    - ~/.mylogin.cnf
  windows:
    - '%APPDATA%\MySQL\.mylogin.cnf'
history:
  adoption-history:
    - >
      Percona Server became an established alternative for operators who wanted MySQL
      compatibility together with additional observability, scalability, backup, and
      storage-engine features. Percona states that it is used by thousands of
      enterprises for demanding workloads.
    - >
      The project follows upstream MySQL release families and is distributed through
      Percona repositories, source builds, containers, and third-party package managers.
      The supplied record is specifically the Homebrew-maintained 8.4 formula.
    - >
      The 8.4 branch tracks MySQL's long-term-support model. Percona's lifecycle
      documentation records general availability in August 2024 and planned support into
      the next decade.
  package-nerd-significance:
    - >
      Percona Server is a prominent example of a vendor-maintained, source-compatible
      downstream database: administrators can retain MySQL protocols and tooling while
      gaining Percona-specific performance and instrumentation features.
    - >
      Its ecosystem connects the server with Percona XtraBackup, Percona Toolkit,
      Percona Monitoring and Management, Percona XtraDB Cluster, and Percona
      Distribution for MySQL. Compatibility remains version-sensitive, particularly for
      backups, authentication, plugins, and major upgrades.
    - >
      For Homebrew users, the formula exposes both server and client utilities and is
      keg-only because it is an alternative version of another formula.
  project-history:
    - >
      Percona Server grew from Percona's patches and XtraDB work for MySQL into a
      complete open-source MySQL-compatible server. Official historical documentation
      records initial Percona Server releases in December 2008.
    - >
      Subsequent branches followed major upstream MySQL generations. Percona's lifecycle
      table records the 5.5, 5.6, 5.7, and 8.0 production lines before the 8.4 LTS
      series.
    - >
      Percona Server for MySQL 8.4 became generally available on 28 August 2024. It
      incorporates MySQL 8.4 changes while retaining Percona's additional performance,
      instrumentation, security, and operational features.
  related-projects:
    - >
      MySQL Community Server, the upstream-compatible database on which Percona Server
      is based.
    - Percona XtraBackup for physical backups.
    - Percona Toolkit for MySQL administration and diagnostics.
    - Percona Monitoring and Management for database observability.
    - >
      Percona XtraDB Cluster and Percona Distribution for MySQL for clustered or
      integrated deployments.
  sources:
    - https://dev.mysql.com/doc/refman/8.4/en/option-files.html
    - >
      https://docs.percona.com/legacy-documentation/percona-server-for-mysql/Percona-Server-for-MySQL-5.1.pdf
    - https://docs.percona.com/percona-server/8.4/index.html
    - https://formulae.brew.sh/formula/percona-server@8.4
    - https://github.com/percona/percona-server
    - https://www.percona.com/release-lifecycle-overview/
  summary:
    - >
      Percona Server for MySQL is an open-source, MySQL-compatible relational database
      server maintained by Percona, with additional performance, scalability, backup,
      security, and instrumentation capabilities.
  timeline:
    - '2008: The first documented Percona Server releases shipped.'
    - '2011: Percona Server for MySQL 5.5 reached general availability.'
    - '2013: The 5.6 series reached general availability.'
    - '2016: The 5.7 series reached general availability.'
    - '2018: The 8.0 series reached general availability.'
    - "2024: Percona Server for MySQL 8.4 became the project's first 8.4 LTS series."
  usage:
    - >
      Use Percona Server as a MySQL-compatible database daemon and connect with standard
      MySQL clients and connectors. Configuration is supplied through MySQL-style option
      files and runtime system variables.
    - >
      The encrypted `.mylogin.cnf` file, created with `mysql_config_editor`, stores
      client login paths containing fields such as host, user, password, port, and
      socket.
    - >
      Operators commonly pair the server with backup, monitoring, replication, and
      high-availability tooling. Major-version upgrades require checking removed
      variables, authentication changes, plugin-to-component migrations, and matching
      backup-tool versions.
tags:
