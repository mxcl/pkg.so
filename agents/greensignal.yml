      Official launch article:
      https://mutedeck.com/blog/2026-06-22-greensignal-pre-call-check/
    - 'Official product page: https://mutedeck.com/tools/greensignal'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      GreenSignal is a free pre-call readiness utility from MuteDeck that checks camera
      framing, microphone input, ambient noise, speaker output, and network quality.
  timeline:
    - '2026-06-22: MuteDeck announced GreenSignal for macOS and Windows.'
  usage:
    - >
      Open GreenSignal before a call, inspect the live camera view and microphone meter,
      confirm the speaker test, and review the network status before joining the
      conferencing application.
    - >
      The official product page says checks run locally and camera or microphone data is
      not recorded, stored, or transmitted.
