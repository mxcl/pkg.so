config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CNCF records show KubeVela was accepted to the foundation on June 22, 2021 and
      moved to Incubating maturity on February 27, 2023. The repository scale, release
      count, documentation site, community calls, and CNCF status make it substantially
      more adopted than the one-purpose CLIs in this batch.
  package-nerd-significance:
    - >
      KubeVela is interesting to package maintainers because the Homebrew package ships
      the vela CLI for a much larger control-plane system. It is also a good example of
      Kubernetes ecosystem packaging where a CLI, CRDs, Helm charts, release assets,
      docs, and CNCF metadata all describe different parts of the same project.
  project-history:
    - >
      KubeVela was publicly launched in November 2020 around KubeCon + CloudNativeCon as
      an extensible application platform based on Open Application Model and Kubernetes.
      The project framed OAM as a way to separate developer-facing application
      descriptions from platform-engineer-defined components, traits, policies, and
      workflows.
  related-projects:
    - >
      Related projects include Open Application Model, Kubernetes, CUE, Helm, Argo CD,
      Crossplane, Dapr, and platform-engineering systems that expose higher-level
      application delivery abstractions. KubeVela is especially tied to OAM because the
      OAM specification describes KubeVela as a driving implementation.
  sources:
    - https://formulae.brew.sh/formula/kubevela
    - https://github.com/kubevela/kubevela
    - https://github.com/kubevela/kubevela/releases
    - >
      https://kubevela.io/blog/2020/12/7/kubevela-the-extensible-app-platform-based-on-open-application-model-and-kubernetes/
    - https://kubevela.io/docs
    - https://oam.dev/
    - >
      https://www.cncf.io/blog/2023/02/27/kubevela-brings-software-delivery-control-plane-capabilities-to-cncf-incubator/
    - https://www.cncf.io/projects/kubevela/
  summary:
    - >
      KubeVela is a Kubernetes-based application delivery platform built around Open
      Application Model ideas. Among the packages in this batch, it is the large
      ecosystem project: a CNCF project, a controller/CLI platform, and a long-running
      attempt to give platform teams a programmable application abstraction above raw
      Kubernetes objects.
  timeline:
    - '2020: KubeVela was launched publicly as an OAM-and-Kubernetes application platform.'
    - '2021: CNCF accepted KubeVela on June 22, 2021.'
    - '2023: KubeVela moved to CNCF Incubating maturity on February 27, 2023.'
    - '2026: The GitHub release page listed v1.10.9 on June 30, 2026.'
  usage:
    - >
      Operators install KubeVela into Kubernetes and use the vela CLI to define, deploy,
      and operate applications across clusters and environments. The project
      documentation emphasizes render, orchestrate, deploy workflows, GitOps and CI/CD
      integration, CUE-powered extensibility, addons, observability, multi-tenancy, and
      multi-cluster delivery.
related-packages:
  - id: brew:argocd
    reason: >
      Use Argo CD with KubeVela when you want Argo CD to reconcile Git state while
      KubeVela supplies application abstractions, workflows, and multi-cluster delivery
      behavior.
    rel: adjacent_workflow
    sources:
      - https://kubevela.io/docs/
      - https://kubevela.io/blog/archive/
      - https://argo-cd.readthedocs.io/en/stable/
  - id: brew:fluxcd
    reason: >
      Flux is an alternative GitOps reconciliation layer that KubeVela can adopt and
      augment with programmable workflows and hybrid or multi-cluster application
      delivery.
    rel: adjacent_workflow
    sources:
      - https://kubevela.io/docs/
      - https://fluxcd.io/flux/
  - id: brew:helm
    reason: >
      Helm charts can be consumed as KubeVela application components, allowing packaged
      Kubernetes workloads to participate in KubeVela workflows and multi-environment
      deployments.
    rel: adjacent_workflow
    sources:
      - https://kubevela.io/docs/
      - https://helm.sh/docs/
