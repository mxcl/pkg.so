id: brew:gitea
display-name: Gitea
repo: https://github.com/go-gitea/gitea
docs:
  - https://docs.gitea.com/
  - https://github.com/go-gitea/gitea#readme
config-file-location:
  unix:
    - $GITEA_CUSTOM/conf/app.ini
    - custom/conf/app.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      Gitea became important in the self-hosting and package-manager world because it
      offered a compact alternative to large forge deployments. Its Go implementation,
      official container image, cross-platform binaries, and presence in major package
      managers made it easy to deploy on personal servers, small teams' infrastructure,
      and organizations that prefer owning their source-control service.
    - >
      The project grew an ecosystem around the core server: official documentation,
      SDKs, the tea CLI, Gitea Runner, translation infrastructure, cloud offerings, and
      community-maintained extensions listed through awesome-gitea.
  package-nerd-significance:
    - >
      Gitea is a favorite package-manager entry because one formula or system package
      can install an entire forge with a small operational footprint. It is often chosen
      by users who want GitHub-like collaboration without outsourcing the service or
      running a heavier enterprise stack.
  project-history:
    - >
      Gitea's code lineage includes early Gogs commits from 2014, and the Gitea project
      identity appears in repository history in 2016 as maintainers replaced Gogs
      branding and prepared the first 1.0 release. Version 1.0.0 was tagged in December
      2016, giving the fork a stable release base under the Gitea name.
    - >
      After the fork, Gitea broadened from lightweight Git hosting into an all-in-one
      development platform. The official README describes repository hosting, code
      management, review, issue tracking, kanban boards, wiki, packages, team
      collaboration, and CI/CD that can reuse GitHub Actions workflows.
  related-projects:
    - >
      Gitea is related to Gogs through its origin, to Forgejo through later ecosystem
      divergence, and to tea, go-sdk, and Gitea Runner as official companion projects.
  sources:
    - https://about.gitea.com/
    - https://blog.gitea.com/release-of-1.26.3-and-1.26.4
    - https://docs.gitea.com/
    - https://github.com/go-gitea/gitea
  summary:
    - >
      Gitea is a self-hosted software development service written in Go. It combines Git
      hosting, code review, issues, pull requests, wiki, packages, project management,
      and Actions-style CI/CD in a single server that can run across the platforms
      supported by Go.
  timeline:
    - '2014: Early code lineage begins in the Gogs repository history.'
    - '2016: Gitea branding and project identity appear in repository history.'
    - '2016: v1.0.0 is tagged under the Gitea project.'
    - >
      2023: Gitea Actions and the runner ecosystem make CI/CD a first-class part of the
      platform.
    - '2026: 1.26.x releases continue the established server release series.'
  usage:
    - >
      Practitioners use Gitea as a private or public Git forge. Administrators configure
      the server through app.ini, run it as a binary, service, or container, and connect
      it to databases, SSH, reverse proxies, package registries, and Actions runners.
    - >
      Developers interact with Gitea much like other Git forges: clone and push
      repositories, open issues and pull requests, manage releases, publish packages,
      write wiki pages, and define workflows for CI jobs.
related-packages:
  - id: brew:forgejo
    reason: >
      Choose Forgejo when nonprofit governance, exclusively free-software development,
      and its independently diverging forge roadmap are priorities; choose Gitea for the
      Gitea-controlled ecosystem and services.
    rel: alternative
    sources:
      - https://docs.gitea.com/
      - https://forgejo.org/compare-to-gitea/
  - id: brew:tea
    reason: >
      Tea is Gitea's official CLI for working with repositories, issues, pull requests,
      releases, and administration across one or more Gitea servers.
    rel: adjacent_workflow
    sources:
      - https://about.gitea.com/products/tea/
      - https://docs.gitea.com/
  - id: brew:gitea-runner
    reason: >
      Gitea Runner registers with a Gitea instance and executes the jobs dispatched by
      Gitea Actions workflows.
    rel: adjacent_workflow
    sources:
      - https://docs.gitea.com/usage/actions/runner/
      - https://docs.gitea.com/runner/
