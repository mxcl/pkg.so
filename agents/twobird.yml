history:
  adoption-history:
    - >
      Twobird targeted Gmail, Google Workspace, and Outlook users who wanted email,
      tasks, reminders, calendars, and collaborative notes in a single inbox-oriented
      interface. Official sources do not publish adoption totals.
  package-nerd-significance:
    - >
      Twobird is a client for existing Google- or Microsoft-powered mail accounts rather
      than a mail provider. Installing the cask provides the desktop interface, while
      the user's provider remains authoritative for email and authentication.
  project-history:
    - >
      Twobird was created by Ginger Labs, the maker of Notability, as an email client
      that treats the inbox as a combined conversation and task workspace. Its official
      feature set joined email with editable shared notes, reminders, to-dos, labels,
      low-priority filtering, and unsubscribe tools.
    - >
      Twobird's official architecture description says email travels directly between
      the configured provider and the installed application rather than being routed or
      synchronized through Twobird's servers; limited server-side data supports features
      such as reminders and notifications.
  related-projects:
    - Notability is another Ginger Labs product.
    - >
      Twobird connects to Gmail, Google Workspace, and Outlook-backed addresses rather
      than providing independent mailboxes.
  sources:
    - https://support.twobird.com/hc/en-us
    - https://support.twobird.com/hc/en-us/articles/360032459432-Viewing-Emails-and-Notes
    - https://support.twobird.com/hc/en-us/articles/360032811491-Labels
    - https://www.twobird.com/
  summary:
    - >
      Twobird is an email client from Ginger Labs that combines mail with collaborative
      notes, reminders, to-dos, and calendar context.
  timeline:
    - >
      2020: Official Twobird help articles documented its combined email-and-notes
      workflow, labels, and task-oriented features.
    - >
      Early 2020s: The official product positioned Twobird as a free client for Google-
      and Microsoft-powered email accounts.
  usage:
    - >
      Users connect a supported Gmail, Google Workspace, or Outlook account, process
      mail as actionable inbox items, create collaborative notes, assign or comment on
      tasks, set reminders, and organize messages and notes with labels.
    - >
      Authentication is performed against the connected mail provider. Official
      documentation does not identify an editable configuration file or reusable
      credentials file on macOS.
