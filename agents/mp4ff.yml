history:
  project-history:
    - >
      The library parses and writes MP4 box structures and includes codec-specific
      support for AVC/H.264, HEVC/H.265, AV1, VVC, AAC, AC-3, Opus, WebVTT, TTML, and
      related sample-entry metadata. Its command-line tools expose common inspection and
      transformation tasks: mp4ff-info prints the MP4 box tree, mp4ff-pslister and
      mp4ff-nallister inspect codec parameter sets and NAL units, mp4ff-subslister
      inspects subtitle samples, mp4ff-crop trims progressive files, and
      mp4ff-encrypt/mp4ff-decrypt handle Common Encryption variants.
  sources:
    - https://dev.to/video/mp4ff-beyond-mp4-boxes-2bee
    - https://formulae.brew.sh/formula/mp4ff
    - https://github.com/Eyevinn/mp4ff
    - https://github.com/Eyevinn/mp4ff/blob/master/CHANGELOG.md
    - https://pkg.go.dev/github.com/Eyevinn/mp4ff
  summary:
    - >
      mp4ff is Eyevinn's Go library and tool set for MP4 and ISO Base Media File Format
      work, authored around video-engineering needs by Torbjorn Einarson and
      collaborators. The project emphasizes fragmented MP4, the style used by MPEG-DASH,
      HLS fMP4, MSS, CMAF-style tracks, and other streaming workflows, while also
      handling progressive MP4 files.
  usage:
    - >
      The project grew from the absence of a performant Go library that covered
      fragmented files deeply enough for backend services and command-line tooling. In
      practice, it is used by developers building packaging, inspection, encryption,
      resegmentation, and regression-test tooling around MP4 assets, rather than by end
      users editing media metadata by hand.
related-packages:
  - id: brew:bento4
    reason: >
      Choose Bento4 when you need a larger ISO-MP4 command suite with dedicated DASH/HLS
      packaging, fragmentation, editing, and DRM-oriented tools instead of a Go-native
      library.
    rel: alternative
    sources:
      - https://github.com/Eyevinn/mp4ff#readme
      - https://www.bento4.com/documentation/
  - id: brew:ffmpeg
    reason: >
      Choose FFmpeg when the job also requires decoding, encoding, transcoding,
      filtering, or broad container conversion rather than focused MP4 structure
      manipulation.
    rel: alternative
    sources:
      - https://github.com/Eyevinn/mp4ff#readme
      - https://ffmpeg.org/about.html
