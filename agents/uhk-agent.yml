history:
  adoption-history:
    - >
      Agent is distributed as the standard configuration utility for UHK hardware and
      ships desktop builds for macOS, Windows, and Linux, plus a web demonstration. Its
      development has tracked successive UHK firmware, device-protocol, and
      user-configuration formats.
    - >
      Later releases broadened the utility from basic keymap and firmware management to
      smart macros, twelve-layer keymaps, pointing-module configuration, advanced typing
      controls, and support for the UHK 80.
  package-nerd-significance:
    - >
      Agent is a useful example of an open-source Electron hardware configurator whose
      releases bundle closely matched keyboard firmware. For keyboard enthusiasts, it
      exposes unusually deep device-side customization while keeping configurations
      portable through import, export, and on-device storage.
  project-history:
    - >
      Ultimate Hacking Keyboard introduced Agent publicly in January 2016 as a
      cross-platform configuration application under development for the UHK. The first
      recorded stable release, Agent 1.0.0, followed in December 2017.
    - >
      Agent 2 arrived in 2022 with smart macros, twelve layers per keymap, and expanded
      module settings. Agent 4 followed in 2024 with dedicated module-configuration and
      advanced typing pages. Development continues alongside the open UHK firmware and
      hardware projects.
  related-projects:
    - Ultimate Hacking Keyboard
    - UHK firmware
    - UHK 60
    - UHK 80
    - Agent web demo
  sources:
    - https://github.com/UltimateHackingKeyboard/agent/blob/master/CHANGELOG.md
    - https://ultimatehackingkeyboard.com/agent
    - >
      https://ultimatehackingkeyboard.com/blog/2016/01/14/agent-is-coming-together-looking-for-a-firmware-developer
    - https://ultimatehackingkeyboard.com/blog/category/manufacturing/page/2
  summary:
    - >
      UHK Agent is the open-source configuration and firmware-management application for
      Ultimate Hacking Keyboard devices.
  timeline:
    - '2016: Ultimate Hacking Keyboard previewed Agent as its cross-platform configurator.'
    - '2017: Agent 1.0.0 was released.'
    - '2022: Agent 2 added smart macros and twelve-layer keymaps.'
    - '2024: Agent 4 added dedicated module and advanced typing configuration pages.'
    - '2024: UHK 80 support entered the official Agent and firmware repositories.'
  usage:
    - >
      Owners use Agent to create and edit keymaps, assign layers and dual-role keys,
      define macros and smart macros, tune mouse or module behavior, update firmware,
      and save configurations to a connected UHK. A web build is available for
      demonstration without owning a keyboard.
