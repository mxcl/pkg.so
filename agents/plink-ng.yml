history:
  adoption-history:
    - >
      The project documents a staged transition from PLINK 1.9 to 2.0, including changed
      report formats and compatibility considerations. Its coexistence guidance reflects
      the need to preserve established analysis workflows.
  package-nerd-significance:
    - >
      PLINK combines native command-line software with specialized genotype formats and
      scientific methods. Its parallel tool generations make executable naming, format
      compatibility, and reproducible analysis particularly relevant to packaging.
  project-history:
    - >
      PLINK 2.0 continues the PLINK toolset associated with Shaun Purcell and
      Christopher Chang. The official citation guide identifies the original 2007 PLINK
      paper and the 2015 second-generation methods paper.
    - >
      The plink-ng source tree contains both the 1.9 and 2.0 development lines, along
      with the PGEN format specification.
  related-projects:
    - >
      PLINK 1.9 is a companion generation. The toolkit interoperates with PLINK binary
      datasets and formats such as VCF, BCF, and BGEN.
  sources:
    - '[Official manual](https://www.cog-genomics.org/plink/2.0/)'
    - >
      [Official usage and citation
      guide](https://www.cog-genomics.org/plink/2.0/general_usage)
    - '[Upstream source tree](https://github.com/chrchang/plink-ng)'
  summary:
    - >
      PLINK 2.0 is a command-line toolset for processing genotype datasets and
      conducting large-scale genetic association analyses.
  timeline:
    - '2007: The original PLINK methods paper was published.'
    - '2015: The second-generation PLINK methods paper was published.'
  usage:
    - >
      Invoke plink2 with input flags, analysis operations, and an output prefix. Common
      workflows include genotype filtering, allele-frequency reports, association tests,
      population structure analysis, and format conversion.
    - >
      PLINK 2.0 is not universally interchangeable with PLINK 1.9; scripts should
      account for documented differences in flags and output formats.
