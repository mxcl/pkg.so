config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Spaceman is distributed through GitHub releases and Homebrew, making it accessible
      both as a directly downloaded macOS application and as a package-managed cask.
    - >
      Its public repository has attracted outside contributors, forks, feature requests,
      and issue reports concerning multi-display behavior, named Spaces, full-screen
      applications, refresh behavior, and compatibility with newer macOS releases.
  package-nerd-significance:
    - >
      Spaceman is a compact example of the macOS menu-bar utility tradition: it packages
      a focused solution to a platform UI limitation and exposes it through both signed
      release artifacts and Homebrew.
    - >
      It also illustrates lineage within small open-source utilities. Spaceman
      explicitly builds on WhichSpace while adding multiple display styles, user-defined
      short names, full-screen Space handling, and configurable refresh behavior.
  project-history:
    - >
      Spaceman was created as an open-source macOS application for showing the current
      Space or Spaces in the menu bar. The project acknowledges WhichSpace as its
      foundation and uses Sparkle for update delivery alongside helper libraries for
      launch-at-login and keyboard shortcuts.
    - >
      The initial v0.93 release established the application, v0.94 added naming for
      full-screen Spaces in the named display style, and v1.0 refreshed the preferences
      interface, added background Space refresh, and assigned full-screen names from
      application names.
  related-projects:
    - WhichSpace is the project on which Spaceman is based.
    - Sparkle supplies application update delivery.
    - LaunchAtLogin and KeyboardShortcuts provide supporting macOS integration.
  sources:
    - 'Official releases: https://github.com/Jaysce/Spaceman/releases'
    - 'Official repository and README: https://github.com/Jaysce/Spaceman'
  summary:
    - >
      Spaceman is an open-source macOS menu-bar utility that displays the active and
      inactive Spaces across one or more displays. It can render rectangles, numbers,
      numbered rectangles, or short user-assigned Space names.
  timeline:
    - 'Initial release: Spaceman v0.93 established the menu-bar Spaces viewer.'
    - 'v0.94: Full-screen Spaces became nameable in the named display style.'
    - >
      v1.0: Added background refresh, redesigned preferences, and automatic names for
      full-screen application Spaces.
  usage:
    - >
      Users choose one of four menu-bar styles: rectangles, numbers, rectangles with
      numbers, or named Spaces. The icon distinguishes active, inactive, full-screen,
      and cross-display entries.
    - >
      Space names are edited in Preferences and are limited to short labels. If the
      indicator becomes stale, users can force a refresh with a custom shortcut or
      enable an automatic five-second background refresh.
    - Installation is available through Homebrew or from official GitHub release disk images.
