history:
  adoption-history:
    - >
      The input package facts show cmusfm packaged in Homebrew, Alpine Linux, and Nix,
      matching a small cross-Unix audio utility audience.
  package-nerd-significance:
    - >
      cmusfm matters to package users because it keeps a lightweight terminal
      music-player workflow connected to Last.fm-style scrobbling without a desktop
      music client.
  project-history:
    - >
      The official README describes cmusfm as a small C scrobbler for cmus with
      listening-now support, offline played-track caching, POSIX ERE filename parsing,
      optional desktop notifications, and customizable scrobbling service URLs.
  related-projects:
    - >
      Official README ties the project directly to cmus and Last.fm, and documents
      configurable service URLs such as Libre.fm.
  sources:
    - https://github.com/Arkq/cmusfm#readme
    - source_facts.package-manager
  summary:
    - cmusfm is a standalone Last.fm scrobbler for the cmus music player.
  timeline:
    - 'GitHub repository: official project history shows 95 commits and 11 tags.'
  usage:
    - >
      Users run cmusfm init to authorize the scrobbler, edit ~/.config/cmus/cmusfm.conf
      if needed, and configure cmus status_display_program=cmusfm.
related-packages:
  - id: brew:cmus
    reason: >
      cmus is the music player that invokes cmusfm through its documented status-display
      integration, so it is the essential companion package.
    rel: adjacent_workflow
    sources:
      - https://github.com/Arkq/cmusfm#readme
      - https://cmus.github.io/
