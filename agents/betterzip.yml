history:
  adoption-history:
    - >
      BetterZip developed a long-running macOS user base around a document-style
      alternative to command-line archivers and Finder's basic archive operations.
      Finder integration, presets, automation, and broad format support made it useful
      beyond one-off archive extraction.
  package-nerd-significance:
    - >
      BetterZip appeals to macOS utility enthusiasts because it can inspect and modify
      archives without immediately rewriting them, integrates with Finder, supports
      repeatable presets, and exposes automation-oriented workflows while retaining a
      native document-based interface.
  project-history:
    - >
      MacItBetter's Robert Rezabek has developed BetterZip as a dedicated macOS archive
      editor since the 2000s. The publisher's site carries copyright dates beginning in
      2006 and maintains detailed release histories across successive major versions.
  related-projects:
    - >
      BetterZip occupies the same general macOS utility niche as built-in Archive
      Utility and command-line tools such as zip, unzip, tar, and 7-Zip-compatible
      archivers.
  sources:
    - 'Official BetterZip documentation: https://macitbetter.com/library/betterzip/docs/'
    - 'Official BetterZip version history: https://macitbetter.com/versionhistory.php'
    - 'Official MacItBetter help page: https://macitbetter.com/help/'
  summary:
    - >
      BetterZip is a commercial native macOS utility for browsing, creating, extracting,
      and modifying archives.
  timeline:
    - "2006: MacItBetter's published copyright history begins for BetterZip."
    - >
      2020s: BetterZip continued through major versions with Finder integration,
      presets, password management, and Apple-silicon-era maintenance.
    - '2026: MacItBetter continued publishing BetterZip 6 updates and documentation.'
  usage:
    - >
      Users open an archive as a document, add, remove, rename, preview, or reorder
      entries, then save the result. Presets, Finder extensions, a password manager, and
      automation entry points support recurring compression and extraction jobs.
