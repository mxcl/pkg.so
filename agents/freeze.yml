history:
  adoption-history:
    - >
      Freeze served macOS users who wanted a native graphical client for the standalone
      Amazon Glacier service. It supported multiple AWS accounts, multipart uploads,
      resumable transfers, vault inventory browsing, and archive descriptions created by
      several other Glacier clients.
    - >
      After Amazon announced that the standalone Glacier service would stop accepting
      new customers after December 15, 2025, the developer discontinued active Freeze
      development. Existing users can continue using it, and its website remains
      available as a reference.
  package-nerd-significance:
    - >
      Freeze is a representative native macOS client for an earlier generation of AWS
      archival-storage workflows. It matters historically because it made Glacier's
      vault, inventory, retrieval, and multipart-transfer model accessible without Java
      or a command-line workflow, while avoiding proprietary archive-description
      encoding.
  project-history:
    - >
      Freeze was developed by Volland Software Development as a Cocoa macOS client for
      Amazon Glacier. The official site carries copyright dating from 2015 and documents
      the product through its eventual maintenance discontinuation.
  related-projects:
    - Amazon Glacier is the archival-storage service accessed by Freeze.
    - >
      The application can decode archive descriptions produced by FastGlacier, CrossFTP,
      CloudBerry, and Synology NAS.
  sources:
    - 'Official FAQ: https://www.freezeapp.net/faq/'
    - 'Official guide: https://www.freezeapp.net/guide'
    - 'Official product page: https://www.freezeapp.net/'
  summary:
    - >
      Freeze is a native macOS file-transfer client for browsing, uploading to,
      downloading from, and synchronizing folders with Amazon Glacier vaults.
  timeline:
    - "2015: The official site's copyright range begins."
    - >
      2025: Amazon's announced cutoff for new standalone Glacier customers prompted the
      end of Freeze development.
    - >
      2026: The official site states that existing users may continue using Freeze, but
      no new features or updates will be released.
  usage:
    - >
      Users add AWS access-key and secret-key credentials, which Freeze stores in the
      macOS Keychain, and then work with Glacier vaults through a graphical interface.
      Freeze transfers files and synchronizes folders but does not itself create backup
      archives; users are advised to create standard ZIP or TAR archives separately.
