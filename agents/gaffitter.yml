history:
  adoption-history:
    - >
      GAFFitter's adoption is small but package-manager-shaped: the official site links
      Debian packages, and the supplied package facts list Homebrew, Debian, and Ubuntu
      package names.
    - >
      Its original use case reflects the optical-media era, but the underlying
      bin-packing-style workflow remains useful for arranging arbitrary items into fixed
      capacities.
  package-nerd-significance:
    - >
      GAFFitter is a compact example of a Unix filter wrapping a metaheuristic
      algorithm. For package maintainers, it is interesting because the executable name
      is fit rather than gaffitter, the upstream code is SourceForge-hosted Git, and the
      documentation still foregrounds CD/DVD packing.
  project-history:
    - >
      GAFFitter is authored by Douglas A. Augusto and hosted on SourceForge. SourceForge
      project metadata records an August 2005 creation date, and the official homepage
      points to version 1.0.0, the SourceForge Git repository, and official Debian
      packages.
    - >
      The homepage describes a POSIX-oriented command-line program designed to work as a
      filter in shell pipelines as well as on direct file and directory arguments.
  related-projects:
    - The official homepage links Debian packages as a distribution channel.
    - >
      The project documentation includes generated class documentation for the genetic
      algorithm implementation.
  sources:
    - https://gaffitter.sourceforge.net/
    - https://gaffitter.sourceforge.net/classGA.html
    - https://sourceforge.net/rest/p/gaffitter
    - https://sourceforge.net/rest/p/gaffitter/source/
  summary:
    - >
      GAFFitter, the Genetic Algorithm File Fitter, is a C++ command-line tool that uses
      a genetic algorithm to fit files or size/name items into fixed-size volumes such
      as CDs or DVDs while minimizing wasted space.
  timeline:
    - '2005: SourceForge project created.'
    - >
      2015: Official homepage lists version 1.0.0 and shows the site last updated in
      August 2015.
    - '2020s: Present in Homebrew, Debian, and Ubuntu according to the supplied package facts.'
  usage:
    - >
      Users run the fit executable with a target size and files, or pipe size/identifier
      pairs into it. Options control volume limits, direct input mode, delimiters, sort
      behavior, and genetic algorithm parameters such as seed, generations, population
      size, crossover probability, mutation probability, and selection pressure.
