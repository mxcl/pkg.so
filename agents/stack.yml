id: cask:stack
display-name: STACK
repo: null
docs:
  - https://www.transip.nl/knowledgebase/stack
  - https://www.transip.nl/knowledgebase/stack/5558-changelog-van-de-desktopapplicatie
config-file-location:
  linux:
    - ~/.config/STACK/stack.cfg
  macos:
    - ~/Library/Preferences/STACK/stack.cfg
  windows:
    - '%APPDATA%\STACK\stack.cfg'
credentials-file-location: null
history:
  adoption-history:
    - >
      STACK initially attracted users through invite codes for a free one-terabyte plan.
      TransIP later reported about 115,000 active free accounts and 12,400 paid
      accounts.
    - >
      After storage incidents in 2020, TransIP discontinued free STACK accounts on 10
      February 2021 while retaining and developing the paid service.
  package-nerd-significance:
    - >
      The desktop client is a vendor-customized synchronization package: TransIP
      documents that it was originally based on the Nextcloud client and switched to the
      ownCloud Desktop App with version 2.8.2.
    - >
      STACK is notable to storage-tool users for combining a synchronized desktop
      directory with browser, mobile, WebDAV, and SFTP access to storage hosted in the
      Netherlands.
  project-history:
    - >
      TransIP introduced STACK on 29 October 2015 as a Dutch online-storage service for
      storing, synchronizing, and sharing files across computers, tablets, and phones.
    - >
      The service developed from a heavily promoted free-storage offering into a paid
      cloud-storage product with desktop and mobile applications, backups, two-factor
      authentication, sharing, WebDAV, and SFTP support.
  related-projects:
    - ownCloud Desktop App is the documented upstream basis of current STACK desktop clients.
    - Nextcloud Client was the desktop client's earlier upstream basis.
    - >
      WebDAV and SFTP provide alternative access paths without using the synchronization
      client.
  sources:
    - >
      https://www.transip.nl/knowledgebase/stack-algemeen/3619-je-synchronisaties-met-stack-resetten
    - https://www.transip.nl/knowledgebase/stack/5558-changelog-van-de-desktopapplicatie
    - https://www.transip.nl/nieuws/transip-introduceert-stack/
    - https://www.transip.nl/stack/
    - https://www.transip.nl/stack/einde-gratis-stack/
    - https://www.transip.nl/stack/faq/
  summary:
    - >
      STACK is TransIP's hosted cloud-storage service and synchronization client. It
      provides web, desktop, and mobile access to files stored on TransIP infrastructure
      in the Netherlands.
  timeline:
    - '2015: TransIP introduced STACK with an invite-based free one-terabyte offering.'
    - >
      2018: New registrations for free STACK accounts ended after the invite campaign
      reached its planned scale.
    - '2021: TransIP discontinued free STACK accounts while continuing the paid service.'
    - >
      Desktop client 2.8.2: STACK moved from a Nextcloud Client base to the ownCloud
      Desktop App.
    - 'Desktop client 5.3.1: Apple Silicon and Ubuntu 24.04 support were added.'
  usage:
    - >
      Desktop users select local and remote folders to keep synchronized; the client
      records synchronization definitions and journal paths in stack.cfg.
    - >
      Users can alternatively access files through the official web or mobile
      applications, mount STACK through WebDAV, or transfer files through SFTP. Accounts
      protected by two-factor authentication use generated tokens where a protocol
      cannot accept the interactive second factor.
tags:
