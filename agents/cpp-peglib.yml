history:
  adoption-history:
    - >
      The supplied package facts list Homebrew and MacPorts. Header-only C++ libraries
      are often consumed directly from source, so package-manager adoption mainly helps
      users install the header and peglint consistently.
  package-nerd-significance:
    - >
      For package maintainers, cpp-peglib is a tidy example of a header-only C++ library
      with a useful companion executable. Its C++17 requirement and pthread note for
      some Linux distributions are the main packaging details.
  project-history:
    - >
      The public GitHub repository was created in February 2015. Upstream describes the
      project as a C++17 header-only PEG library that can be used by including peglib.h
      directly in a project.
    - >
      The README documents support for packrat parsing, left-recursive grammars,
      semantic actions, grammar loading, and an online PEG Playground. That positioning
      makes the project attractive to users who want parser-combinator-like ergonomics
      without a generated parser build step.
  related-projects:
    - >
      The README links cpp-peglib to Parsing Expression Grammars and packrat parsing
      literature.
    - PEG Playground is the upstream online demonstration for cpp-peglib.
  sources:
    - https://api.github.com/repos/yhirose/cpp-peglib
    - https://raw.githubusercontent.com/yhirose/cpp-peglib/master/README.md
    - https://api.github.com/repos/yhirose/cpp-peglib/releases?per_page=5
  summary:
    - >
      cpp-peglib is Yuji Hirose's single-header C++ PEG parser library. It packages
      Parsing Expression Grammar support as a C++17 header-only dependency, with peglint
      as the command-line tool exposed by the Homebrew formula.
  timeline:
    - '2015: Public GitHub repository created.'
    - '2015: Early upstream tags include v0.1.x releases.'
    - '2026: Upstream releases include v1.12.0.'
  usage:
    - >
      cpp-peglib is used to embed PEG grammars into C++ applications, build small DSL
      parsers, and lint grammar definitions. Upstream examples show calculator grammars,
      semantic actions, error logging, token boundaries, predicates, and packrat
      parsing.
