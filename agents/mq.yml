history:
  project-history:
    - >
      The documentation frames mq around structured-document workflows rather than
      general text filtering. Its listed use cases include LLM prompt and output
      processing, documentation management, content analysis, and batch processing
      across Markdown files. Its feature set includes selectors and built-in functions,
      custom functions, a REPL, IDE support, a VS Code extension, and Language Server
      Protocol support for custom function development.
  sources:
    - https://github.com/harehare/mq
    - https://github.com/harehare/mq/releases
    - https://mqlang.org/
    - https://mqlang.org/book/
  summary:
    - >
      mq is a Rust command-line language for querying and transforming Markdown with a
      jq-like syntax. The project site and book describe the goal directly: make
      Markdown as easy to slice, filter, map, and transform as JSON is with jq. The
      GitHub repository is under harehare/mq, and its package surface includes both the
      mq executable and mq-lsp.
  usage:
    - >
      The release history shows a fast-expanding 0.6 series in June 2026. Release notes
      in that period added Obsidian wikilink, callout, and embed support; HTTP module
      imports; HTML-to-Markdown conversion improvements; code actions and rename support
      in mq-lsp; shell completion; an md module for generating Markdown; cross-file
      collection queries; and a large matrix of binary, deb, and rpm artifacts. mq's
      package-manager niche is therefore a Markdown-native query processor for
      documentation-heavy and LLM-heavy workflows, complementary to jq rather than a
      replacement for it.
