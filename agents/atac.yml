history:
  adoption-history:
    - >
      ATAC has unusually broad packaging for a young TUI: the upstream README documents
      cargo, Homebrew, Scoop, Arch, Fedora Copr, Docker, and binary releases. The
      supplied package metadata also lists apk, Debian, Ubuntu, Nix, pacman, Scoop, and
      Homebrew packaging, indicating quick uptake across developer-oriented package
      managers.
    - >
      Its adoption story is tied to dissatisfaction with account-centric GUI API
      clients. The README comparison table stresses local files, offline behavior, full
      CLI usage, import from Postman/OpenAPI/cURL, and terminal-native operation.
  package-nerd-significance:
    - >
      ATAC is a good modern example of the package-manager-friendly Rust TUI wave: one
      static-feeling binary, many distro channels, explicit dependency tables, and a
      feature pitch aimed at replacing heavyweight SaaS desktop tools with local files
      that can live in source control.
  project-history:
    - >
      The repository began in February 2024 and quickly built a TUI around request
      collections, HTTP methods, bodies, headers, authentication, WebSocket support,
      environment files, import/export, themes, key bindings, and scripting. The README
      still describes the project as pre-1.0, with v1 and v2 TODO sections for requested
      polish and protocol expansion.
    - >
      The v0.23.0 release in 2026 added JWT and Digest authentication, a global config
      file, a large rework of text inputs, graphical-protocol disabling, and more
      headless-environment fixes. That release also describes the project as only a few
      features away from v1.
  related-projects:
    - >
      Related projects include Postman, Insomnia, Bruno, cURL, reqwest, ratatui, and
      editor integrations such as atac.nvim.
  sources:
    - Official git metadata from https://github.com/Julien-cpsn/ATAC.git
    - https://github.com/Julien-cpsn/ATAC#readme
    - https://github.com/Julien-cpsn/ATAC/releases.atom
  summary:
    - >
      ATAC is a Rust terminal API client, explicitly framed by its README as a Postman-,
      Insomnia-, and Bruno-like client that runs in the terminal without a graphical
      environment. The project emphasizes being free, account-less, offline, and backed
      by readable versionable files.
  timeline:
    - '2024: Initial repository commits and early Rust TUI implementation.'
    - '2025: v0.22.0 added Postman environment import.'
    - >
      2026: v0.23.0 added JWT/Digest authentication, global config, and a major
      text-input rework.
  usage:
    - >
      Users install `atac` and run it from a terminal to manage request collections,
      send HTTP/WebSocket requests, edit request data in a TUI, store environment files,
      export cURL and language snippets, and import existing API-client formats. It can
      be used interactively, as a CLI, or embedded into editor workflows such as the
      documented Neovim integration.
related-packages:
  - id: brew:posting
    reason: >
      Choose Posting for plain-YAML request collections, layered `.env` files, and
      documented gRPC support; choose ATAC when Postman/OpenAPI import or WebSocket
      workflows are more important.
    rel: alternative
    sources:
      - https://github.com/Julien-cpsn/ATAC#readme
      - https://posting.sh/
  - id: brew:hurl
    reason: >
      Choose Hurl for reviewable text files containing HTTP requests and response
      assertions that run naturally in CI; choose ATAC for interactive request editing
      and response exploration in a terminal UI.
    rel: alternative
    sources:
      - https://atac.julien-cpsn.com/
      - https://hurl.dev/docs/manual.html
  - id: cask:bruno
    reason: >
      Choose Bruno for a graphical offline client with Git-friendly collections; choose
      ATAC for the terminal-native workflow that explicitly cites Bruno as an
      inspiration.
    rel: alternative
    sources:
      - https://github.com/Julien-cpsn/ATAC#readme
      - https://docs.usebruno.com/
