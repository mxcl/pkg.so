id: brew:httpflow
display-name: httpflow
repo: null
docs:
  - https://github.com/six-ddc/httpflow
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is packaged by Homebrew in this batch and documents Homebrew
      installation in its own README. Linux use is framed as a source build against
      zlib, libpcap, and PCRE.
  package-nerd-significance:
    - >
      The package is interesting as a focused bridge between packet capture tooling and
      HTTP debugging: less general than Wireshark or tshark, but easier to script when
      the desired artifact is the HTTP stream itself.
  project-history:
    - >
      The GitHub repository was created in 2017 and describes the project as a
      command-line utility for capturing and dumping HTTP streams. Its README presents
      version 0.0.9 in the usage text and documents release binaries alongside source
      builds.
  related-projects:
    - >
      Related tools include tcpdump, libpcap, pcap-filter, Wireshark, tshark, and other
      HTTP-specific capture utilities.
  sources:
    - https://api.github.com/repos/six-ddc/httpflow
    - https://api.github.com/repos/six-ddc/httpflow/tags
    - https://github.com/six-ddc/httpflow
    - https://raw.githubusercontent.com/six-ddc/httpflow/master/README.md
  summary:
    - >
      httpflow is a small command-line packet capture utility for dumping HTTP request
      and response streams from live interfaces or saved pcap data.
  timeline:
    - '2017: The public GitHub repository was created.'
    - '2017: Tag 0.0.1 points at a February 25 commit.'
    - '2020: Tag 0.0.9 points at a May 7 commit.'
  usage:
    - >
      httpflow can listen on an interface, read packets from a pcap file, accept
      tcpdump-style capture expressions, filter URLs with a regular expression, read
      packet data from standard input, and write captured HTTP request and response data
      to a directory.
related-packages:
  - id: brew:tcpdump
    reason: >
      Use tcpdump to make filtered pcap captures that httpflow can later read and turn
      into extracted HTTP request and response data.
    rel: adjacent_workflow
    sources:
      - https://github.com/six-ddc/httpflow#readme
      - https://www.tcpdump.org/manpages/tcpdump.1.html
  - id: brew:tcpflow
    reason: >
      Choose tcpflow when you need reconstruction of arbitrary TCP conversations rather
      than httpflow's HTTP-specific extraction.
    rel: alternative
    sources:
      - https://github.com/six-ddc/httpflow#readme
      - https://github.com/simsong/tcpflow#readme
  - id: brew:wireshark
    reason: >
      Choose Wireshark when interactive inspection and decoding across many protocols is
      more useful than a small HTTP-only command-line dumper.
    rel: alternative
    sources:
      - https://github.com/six-ddc/httpflow#readme
      - https://www.wireshark.org/docs/
tags:
  - cli
