history:
  adoption-history:
    - >
      BZip3 is much newer and narrower than bzip2, but it has already reached Homebrew,
      Debian, Fedora, Alpine, Arch, MacPorts, Nix, Scoop, Ubuntu, and openSUSE package
      maps in the input facts. That adoption suggests interest from compression
      enthusiasts and distribution packagers rather than default system use.
    - >
      Its adoption pitch is compatibility of workflow, not format compatibility:
      commands such as `bzip3`, `bunzip3`, `bz3cat`, and `bz3grep` feel familiar to
      users of bzip2 and gzip-family tools.
  package-nerd-significance:
    - >
      BZip3 is interesting to package nerds because it is a deliberate sequel to a
      classic package rather than a generic new compressor. Its command naming, helper
      tools, and packaging-friendly build system make it easy for distributions to slot
      beside bzip2 for experimentation.
    - >
      Its significance is still emerging: it is not infrastructure in the way bzip2 is,
      but it is the sort of package compression fans track to see whether an old format
      family can be reimagined with modern algorithms.
  project-history:
    - >
      The upstream README describes BZip3 as combining a fast Burrows-Wheeler transform
      using suffix arrays, an order-0 context-mixing entropy coder, and an
      RLE/Lempel-Ziv-plus-prediction pass. The project copyright statement identifies
      Kamila Szewczyk as the main author for the 2022-2023 codebase.
    - >
      The repository history shows public 1.x tags, and the README credits
      packaging-oriented autotools work, which helped make the project fit ordinary
      source-package and distribution build flows.
  related-projects:
    - bzip2 is the explicit spiritual predecessor.
    - libsais is credited by the README for Burrows-Wheeler transform construction.
    - >
      xz, zstd, lrzip, BSC, and Turbo-Range-Coder appear in the README's comparison and
      benchmark context.
  sources:
    - https://github.com/iczelia/bzip3/blob/master/README.md
    - https://github.com/iczelia/bzip3/tags
    - source_facts.package-manager
  summary:
    - >
      BZip3 is a modern lossless compressor that explicitly presents itself as a better,
      faster, stronger spiritual successor to bzip2. It keeps the package shape familiar
      to Unix users while changing the compression internals substantially.
  timeline:
    - "2022: BZip3's main codebase copyright period begins."
    - '2022: Public 1.x tags begin in the upstream repository.'
    - >
      2023: The README documents the LGPLv3-only project, benchmarks, architecture
      testing, and packaging-friendly autotools build.
    - >
      2020s: BZip3 appears in multiple Unix and cross-platform package managers as a
      niche compression tool.
  usage:
    - >
      Users run `bzip3` to compress, `bunzip3` to decompress, and helper tools such as
      `bz3cat`, `bz3grep`, `bz3less`, and `bz3more` to inspect compressed files. The
      README also documents standard autotools-style source builds with `./configure`,
      `make`, and `make install`.
    - >
      The README emphasizes text and source-code compression, including benchmarks
      against xz, bzip2, zstd, and lrzip combinations. That makes the package most
      relevant for users comparing archival compression ratios rather than seeking
      maximum decompression ubiquity.
related-packages:
  - id: brew:bzip2
    reason: >
      Choose bzip2 when compatibility with the established `.bz2` ecosystem matters more
      than BZip3's newer format and design.
    rel: alternative
    sources:
      - https://github.com/iczelia/bzip3
      - https://sourceware.org/bzip2/manual/manual.html
  - id: brew:xz
    reason: >
      Choose XZ Utils when you need the widely deployed `.xz`/LZMA ecosystem; BZip3
      upstream directly benchmarks XZ as a competing high-ratio compressor.
    rel: alternative
    sources:
      - https://github.com/iczelia/bzip3
      - https://tukaani.org/xz/
  - id: brew:zstd
    reason: >
      Choose Zstandard when decompression speed and broad modern tooling support are
      priorities; BZip3 upstream directly compares its results with Zstandard.
    rel: alternative
    sources:
      - https://github.com/iczelia/bzip3
      - https://facebook.github.io/zstd/
