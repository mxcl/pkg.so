history:
  adoption-history:
    - >
      The IDE’s predecessor, IEP, reached its first official release in 2010, later
      gained macOS and 64-bit Linux binaries, and was made available in Debian during
      the 3.x series.
    - >
      Pyzo remains cross-platform and works with separately installed Python
      interpreters, including Conda environments, allowing users to update the IDE and
      execution environment independently.
  package-nerd-significance:
    - >
      Pyzo represents a lineage of lightweight scientific Python environments that
      predates today’s notebook-dominated workflow. It combines editor cells, multiple
      interactive shells, GUI event-loop integration, introspection, debugging, and
      package commands in one compact desktop IDE.
    - >
      Its 2016 separation of the IDE from a bundled Python distribution is especially
      relevant to package management: Pyzo became an environment-agnostic front end,
      while pip, Conda, and system packages retained responsibility for interpreters and
      libraries.
  project-history:
    - >
      Pyzo descends from IEP, an interactive Python editor and shell created after its
      author found no free environment combining the aspects they valued in IPython and
      a programmer’s editor. IEP’s first official release appeared in 2010.
    - >
      Originally, Pyzo was a Python distribution that bundled an environment with the
      IEP IDE. The projects were merged for Pyzo 4.0, leaving Pyzo as the lightweight
      IDE and relying on separately managed Python or Conda environments.
    - Pyzo 4.1, released in 2016, was the first announced release after the merger.
  related-projects:
    - >
      Pyzo works with CPython and Conda environments and supports workflows involving
      pip, IPython, scientific packages, and GUI toolkits. IEP is its direct
      predecessor.
  sources:
    - https://github.com/pyzo/pyzo/blob/main/RELEASE_NOTES.md
    - https://pyzo.org/
    - https://pyzo.org/iep.html
    - https://pyzo.org/start.html
  summary:
    - >
      Pyzo is a free, open-source, cross-platform Python IDE centered on interactive
      execution, introspection, editor cells, and independently configured Python
      environments.
  timeline:
    - '2010: IEP 2.1 became the lineage’s first official release.'
    - '2012: IEP 3.1 became a package and was positioned as the IDE for the Pyzo distribution.'
    - '2015: The IEP and Pyzo projects were merged for Pyzo 4.0.'
    - '2016: Pyzo 4.1 became the first announced post-merger release.'
  usage:
    - >
      Users install Pyzo separately from Python, then configure one or more shells to
      point at CPython, Conda, or other interpreters. Each shell may specify its initial
      directory, Python path, startup script, GUI integration, arguments, and
      environment variables.
    - >
      Code can be run directly in a shell, by selected lines, by Matlab-style cells, as
      an entire file, or as a project’s main file. Multiple shells can run
      simultaneously in subprocesses.
