history:
  adoption-history:
    - >
      PDF Expert grew from an early iPhone PDF reader into a widely used Apple-platform
      document application. Readdle extended it to iPad and Mac, added annotation,
      forms, signing, editing, OCR, conversion, cloud connections, and cross-platform
      subscriptions, and positioned it for students and professional document workflows.
  package-nerd-significance:
    - >
      PDF Expert is notable in Mac package catalogs as a polished proprietary
      counterpart to open-source and system PDF viewers. The cask provides a
      reproducible installation route for an application whose licensing, account
      activation, updates, and cross-device access are otherwise managed through Readdle
      and Apple's stores.
  project-history:
    - >
      Readdle began beta testing PDF Expert in 2009 and released a professional PDF
      reader for iPhone that year. Readdle's corporate history marks 2010 as the
      product's broader launch.
    - >
      Successive generations expanded PDF Expert across iPhone, iPad, and Mac and moved
      it from reading and annotation toward full editing, scanning and OCR, conversion,
      construction markup, file management, and AI-assisted document work.
  related-projects:
    - >
      PDF Expert is part of Readdle's productivity-app portfolio alongside Documents,
      Scanner Pro, Calendars, Spark, and Fluix.
    - >
      It integrates with iCloud and third-party cloud services and can transfer files
      through standard Apple and network workflows.
  sources:
    - https://pdfexpert.com/
    - https://readdle.com/blog/Readdle-turns-16
    - https://readdle.com/blog/pdfexpert/5
    - https://support.readdle.com/pdfexpert/en_US/using-pdf-expert
  summary:
    - >
      PDF Expert is Readdle's proprietary PDF reader and editor for macOS, iPhone, and
      iPad, covering annotation, forms, signing, page editing, OCR, conversion, and
      document organization.
  timeline:
    - '2009: Readdle beta-tested PDF Expert and released a professional PDF reader for iPhone.'
    - '2010: Readdle records the broader PDF Expert product launch.'
    - '2013: PDF Expert 5 delivered a major iPad-focused redesign and feature expansion.'
    - '2019: PDF Expert 7 launched as a major iPhone and iPad update.'
    - >
      2020s: PDF Expert expanded its Mac editor, OCR, conversion, cross-platform
      account, and subscription capabilities.
  usage:
    - >
      Users open PDFs from local storage or cloud services, annotate and sign documents,
      edit text and images, rearrange pages, fill forms, redact content, run OCR,
      convert files, and export or share results. On macOS, PDF Expert works with files
      in their existing filesystem locations rather than maintaining a required
      application document folder.
