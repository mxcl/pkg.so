history:
  adoption-history:
    - >
      Lark evolved from a system built to support ByteDance's own globally distributed
      operations into a commercial collaboration suite for outside organizations.
    - >
      The product is positioned for teams ranging from small groups to enterprises and
      is available across desktop, mobile, and web clients.
  package-nerd-significance:
    - >
      For package-manager users, the Lark cask provides a reproducible installation path
      for a broad, proprietary collaboration client whose functionality otherwise spans
      many separately installed categories of workplace software.
    - >
      Its all-in-one design is notable because chat acts as a hub connected to
      calendars, documents, meetings, tasks, approvals, databases, and workflow
      automation.
  project-history:
    - >
      Lark was created from ByteDance's investment in tools and processes for its
      internal operations. The commercial product carries those practices into an
      integrated workplace suite.
    - >
      The suite grew beyond messaging to combine meetings, calendars, collaborative
      documents, email, approvals, knowledge management, objectives, and the Base
      no-code database and workflow product.
  related-projects:
    - >
      Feishu is the related ByteDance workplace platform used in supported cross-border
      interoperability scenarios.
    - >
      Lark integrates with external services including Exchange, Outlook, Google
      Calendar, and Gmail.
  sources:
    - https://www.larksuite.com/en_us/blog/bytedance-work-tips
    - https://www.larksuite.com/en_us/plans
    - https://www.larksuite.com/en_us/product/messenger
    - https://www.larksuite.com/hc/en-US/
    - https://www.larksuite.com/product/overview
  summary:
    - >
      Lark is an all-in-one team collaboration and business-productivity suite developed
      from ByteDance's internal workplace tooling.
  timeline:
    - 'Internal era: ByteDance developed Lark to support its own distributed operations.'
    - >
      Commercial era: Lark expanded into an externally offered suite combining
      communication, content, meetings, and workflow tools.
  usage:
    - >
      Teams use Lark for chat, video meetings, calendars, collaborative documents,
      email, task coordination, approvals, wikis, objectives, and Base databases and
      automations.
    - >
      A typical workflow starts in Messenger and connects conversations to meetings,
      schedules, documents, tasks, approvals, or other business actions without
      switching applications.
