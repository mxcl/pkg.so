history:
  adoption-history:
    - >
      Hexcurse's long package life reflects its plain C/ncurses build model and
      traditional console UI. The input package metadata records Homebrew, Debian, Nix,
      and Ubuntu packages, and the Homebrew formula packages the v1.60.0 GitHub archive.
  package-nerd-significance:
    - >
      Hexcurse matters as one of the small curses hex editors that survived by being
      easy to build and package. Its history shows a common Unix package pattern: an old
      tarball-era utility rehomed on GitHub, lightly modernized, and kept useful through
      distro packaging rather than heavy feature churn.
  project-history:
    - >
      The upstream README says Hexcurse was written by Lonny Gomes and James Stephenson,
      then left unmaintained for a time before the maintainers noticed an old tarball
      circulating and restarted maintenance from a GitHub repository. The ChangeLog
      records a first release in May 2001, followed by rapid 2001-2003 development of
      undo, search, resizing, EBCDIC mode, large-file portability fixes, and terminal
      behavior improvements.
    - >
      After older 1.5x releases, the GitHub-era history includes a 1.58 release in 2014
      and a 1.60.0 release in November 2015. The 1.60.0 ChangeLog entry switched
      versioning toward semver, added color support, improved signal handling, fixed
      failed-save behavior, and incorporated several community pull requests.
  related-projects:
    - >
      Hexcurse is related to full-screen terminal hex editors such as hexedit and to
      lower-level byte inspection tools such as hexdump and xxd, but it emphasizes
      ncurses editing rather than one-shot dumping.
  sources:
    - https://api.github.com/repos/LonnyGomes/hexcurse/releases
    - https://formulae.brew.sh/formula/hexcurse
    - https://github.com/LonnyGomes/hexcurse
    - https://raw.githubusercontent.com/LonnyGomes/hexcurse/master/ChangeLog
  summary:
    - >
      Hexcurse is a C ncurses console hex editor with an early-2000s release history and
      a revived GitHub maintenance home.
  timeline:
    - '2001: First Hexcurse release recorded in the ChangeLog.'
    - >
      2002: 1.40 and 1.50 releases add resizing, decimal addressing, EBCDIC mode, and
      portability fixes.
    - '2003: 1.55 fixes a file-saving bug.'
    - '2013: GitHub repository created.'
    - '2014: 1.58 adds large-file support from a contributor patch.'
    - '2015: 1.60.0 release adds color support and several maintenance fixes.'
  usage:
    - >
      Hexcurse opens, edits, and saves files while showing hexadecimal and character
      windows. It supports searching, decimal or hexadecimal addresses, jumps, undo,
      bold markers for modified bytes, EBCDIC mode, and keyboard shortcuts for save,
      open, goto, find, mode toggle, paging, and quit.
related-packages:
  - id: brew:hexedit
    reason: >
      Choose hexedit for device-aware, piece-at-a-time editing and an Emacs-influenced
      command set; choose Hexcurse for its ncurses interface, EBCDIC display, and
      explicit width control.
    rel: alternative
    sources:
      - https://github.com/LonnyGomes/hexcurse#readme
      - https://rigaux.org/hexedit.html
  - id: brew:bvi
    reason: >
      Choose bvi when vi-style modal commands and startup configuration are important;
      choose Hexcurse for a function-key-oriented ncurses workflow.
    rel: alternative
    sources:
      - https://github.com/LonnyGomes/hexcurse#readme
      - https://bvi.sourceforge.net/overview.php
      - https://bvi.sourceforge.net/man_bvi.html
