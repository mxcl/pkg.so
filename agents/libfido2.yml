config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents package installs for Fedora, Ubuntu, Homebrew on macOS, and
      Windows release artifacts. Its command-line tools, fido2-cred, fido2-assert, and
      fido2-token, made low-level authenticator operations packageable outside browser
      stacks.
  package-nerd-significance:
    - >
      libfido2 is package-nerd significant because it brings passkey/security-key
      plumbing into the Unix packaging world as a normal C library, CLI suite, udev-rule
      companion, and dependency for higher-level authentication integrations.
  project-history:
    - >
      Yubico's NEWS file lists libfido2 0.1.0 on May 18, 2018 as the first beta release.
      The project reached 1.0.0 on March 21, 2019 with native HID support on Linux,
      macOS, and Windows, command options for U2F on dual authenticators, resident-key
      handling, CTAP2 CBOR checks, fuzzing harnesses, and documentation fixes.
    - >
      Later releases followed the FIDO standards curve: hmac-secret support in 2018,
      credential management and richer option APIs in 2019, U2F fallback and credProtect
      in 2020, NFC support on Linux and FIDO 2.1 work in 2021, and CTAP 2.3 support in
      2026.
  related-projects:
    - >
      Related projects and standards include YubiKeys, FIDO U2F, CTAP1, CTAP2, WebAuthn,
      libcbor, OpenSSL, zlib, systemd-udev, and language bindings such as Fido2Net,
      go-libfido2, p5-FIDO-Raw, and Rust libfido2 bindings.
  sources:
    - https://developers.yubico.com/CTAP/
    - https://developers.yubico.com/libfido2/
    - https://developers.yubico.com/libfido2/Releases/
    - https://github.com/Yubico/libfido2
    - https://raw.githubusercontent.com/Yubico/libfido2/main/NEWS
    - https://raw.githubusercontent.com/Yubico/libfido2/main/README.adoc
  summary:
    - >
      libfido2 is Yubico's BSD-licensed C library and command-line tool set for
      communicating with FIDO devices over USB or NFC and verifying attestation and
      assertion signatures. It supports FIDO U2F as CTAP1 and FIDO2 as CTAP2.
  timeline:
    - '2018-05-18: Yubico NEWS lists libfido2 0.1.0 as the first beta release.'
    - >
      2019-03-21: Yubico NEWS lists libfido2 1.0.0 with native HID support on Linux,
      macOS, and Windows.
    - '2020-04-15: Version 1.4.0 added U2F fallback and FIDO2 credential-protection support.'
    - >
      2021-10-27: Version 1.9.0 enabled NFC support on Linux and added OpenSSL 3.0
      compatibility.
    - '2026-04-15: Version 1.17.0 added CTAP 2.3 support.'
  usage:
    - >
      Developers link libfido2 when they need direct authenticator communication,
      attestation verification, assertion verification, or tooling around security keys.
      System users also install fido2-tools to inspect tokens and exercise credentials
      from the shell.
related-packages:
  - id: brew:pam-u2f
    reason: >
      Use pam-u2f when the goal is Unix login authentication: Yubico documents that it
      depends on libfido2 to connect U2F and FIDO2 authenticators to PAM.
    rel: adjacent_workflow
    sources:
      - https://developers.yubico.com/pam-u2f/
      - https://developers.yubico.com/libfido2/
