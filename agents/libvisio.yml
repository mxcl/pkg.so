config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      libvisio matters mainly through LibreOffice and related document-conversion
      workflows. Rather than being a user-facing editor, it packages the hard format
      knowledge needed to import VSD, VSS, VSDX, and related Visio content into open
      document pipelines.
  package-nerd-significance:
    - >
      It is a good example of the Document Liberation Project pattern: isolate a
      proprietary office format parser into a reusable library so distributions and
      applications can share the maintenance burden.
  project-history:
    - >
      The Document Foundation wiki describes libvisio as a library that parses Microsoft
      Visio file formats across versions. Its freedesktop.org repository history shows
      0.0.x releases beginning in 2011, followed by the 0.1.0 line in 2014, when the
      NEWS file records a switch to librevenge.
  related-projects:
    - LibreOffice is the main downstream office suite context.
    - librevenge is the document-library framework used by the 0.1 series.
    - >
      The Document Liberation Project hosts related import libraries for other
      proprietary office formats.
  sources:
    - https://cgit.freedesktop.org/libreoffice/libvisio
    - https://cgit.freedesktop.org/libreoffice/libvisio/plain/NEWS
    - https://cgit.freedesktop.org/libreoffice/libvisio/refs/tags
    - https://wiki.documentfoundation.org/DLP/Libraries/libvisio
  summary:
    - >
      libvisio is a Document Liberation Project library and tool set for parsing
      Microsoft Visio documents so free-office software can import diagrams from
      proprietary Visio formats.
  timeline:
    - '2011-06-23: libvisio-0.0.1 tag in the freedesktop.org repository.'
    - '2014-05-23: libvisio-0.1.0 tag; NEWS records the switch to librevenge.'
    - >
      2015-2019: 0.1.x releases added import fixes, fuzzing-driven crash fixes, Coverity
      fixes, and format support improvements.
    - '2025-09-23: libvisio-0.1.10 tag in the freedesktop.org repository.'
  usage:
    - >
      The package ships small inspection and conversion tools such as vsd2raw, vsd2text,
      vsd2xhtml, vss2raw, vss2text, and vss2xhtml, but its primary use is as an import
      library linked by office/document tooling.
