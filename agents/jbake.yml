credentials-file-location: null
history:
  adoption-history:
    - >
      JBake occupies the JVM side of the static-site-generator ecosystem, with package
      metadata in the input showing Homebrew and Nix distribution and the official site
      listing sites built with JBake. Its adoption is narrower than Jekyll or Hugo, but
      useful for Java teams that want static publishing while keeping content generation
      inside familiar JVM tooling.
  package-nerd-significance:
    - >
      JBake is package-nerd interesting because it is a static site generator that lives
      in Java packaging culture rather than the Ruby, Go, or JavaScript ecosystems. It
      bridges CLI packaging, Maven artifacts, Gradle plugins, and content tooling in a
      way that makes sense for JVM shops and documentation sites.
  project-history:
    - >
      The JBake site identifies the JBake Team beginning in 2012, and the project team
      page lists Jonathan Bullock as founder and developer. The repository README
      presents JBake as a Java static site/blog generator, and the documentation records
      its Gradle, Maven, mill, sbt, and SBuild integrations.
    - >
      The project adopted Semantic Versioning from v2.2.0 onward, according to its
      README. Later releases and documentation show the project moving through Java
      runtime requirements, Gradle-based builds, plugin integrations, and
      template/content support for common JVM publishing workflows.
  related-projects:
    - >
      JBake is related to Jekyll-style static site generation, Markdown, AsciiDoc,
      Freemarker, Groovy templates, Thymeleaf, Maven, Gradle, sbt, mill, SBuild, GitHub
      Pages-style hosting, and other static publishing tools.
  sources:
    - https://github.com/jbake-org/jbake
    - https://jbake.org/
    - https://jbake.org/community/sites.html
    - https://jbake.org/community/team.html
    - https://jbake.org/docs/latest/
    - https://jbake.org/news/jbake-v2-6-0-released.html
    - https://jbake.org/news/jbake-v2.7.0-release-candidate.html
  summary:
    - >
      JBake is a Java-based open-source static site and blog generator aimed at
      developers and designers. It converts plain content, templates, assets, and
      metadata into a static website that can be hosted without a server-side CMS.
  timeline:
    - '2012: JBake Team copyright period begins on the official site.'
    - >
      2013: Official documentation pages show early JBake manual authorship and project
      structure docs.
    - 'v2.2.0: JBake adopts Semantic Versioning.'
    - >
      2016: JBake 2.6.0 release notes describe a move to a Gradle build and a Java 7
      runtime requirement.
    - >
      2021: JBake 2.7.0 release-candidate news documents continued Maven plugin and
      release work.
  usage:
    - >
      A typical JBake project contains content, templates, assets, and a
      jbake.properties file; users run the jbake command or a build-tool plugin to
      generate HTML. The documentation describes Maven and Gradle integrations,
      watch/server-style workflows, Markdown, AsciiDoc, HTML content, metadata headers,
      and templating through engines such as Freemarker, Groovy, and Thymeleaf.
related-packages:
  - id: brew:hugo
    reason: >
      Hugo is a Go-based alternative for the same static-site generation task, with a
      larger built-in content, asset-pipeline, taxonomy, and multilingual feature set.
    rel: alternative
    sources:
      - https://jbake.org/
      - https://gohugo.io/about/introduction/
      - https://gohugo.io/documentation/
