history:
  adoption-history:
    - >
      Syntevo distributes SmartSynchronize for macOS, Windows, and Linux. It is
      available without charge for qualifying non-commercial users, including
      open-source developers and academic users, while commercial licenses add support
      and update rights.
  package-nerd-significance:
    - >
      SmartSynchronize represents the enduring standalone diff-and-merge tool category:
      utilities that can be launched independently or invoked by editors and
      version-control clients. Its combination of directory synchronization, three-way
      merge, and a cross-platform dual-pane file manager distinguishes it from minimal
      text-only diff viewers.
  project-history:
    - >
      Syntevo developed SmartSynchronize as a cross-platform file and directory
      comparison application. The fourth major generation expanded it with a
      keyboard-oriented dual-pane file manager, while subsequent releases refined file
      management, syntax-aware editing, comparison, and merge workflows.
  related-projects:
    - >
      SmartSVN, SmartGit, and DeepGit are related Syntevo developer tools.
      Version-control systems and editors can invoke SmartSynchronize through its
      command-line interface.
  sources:
    - https://blog.syntevo.com/smartsynchronize/2023/11/16/smartsynchronize-4-5-released.html
    - https://docs.syntevo.com/SmartSynchronize/
    - https://www.syntevo.com/smartsynchronize/
    - https://www.syntevo.com/smartsynchronize/whats-new/
  summary:
    - >
      SmartSynchronize is Syntevo's cross-platform graphical tool for comparing and
      editing files, comparing and synchronizing directory trees, performing three-way
      merges, and managing files.
  timeline:
    - >
      2020s: SmartSynchronize 4 introduced an integrated cross-platform dual-pane file
      manager.
    - '2023: SmartSynchronize 4.5 refined the file manager and comparison editor.'
    - 'Present: Syntevo continues to maintain SmartSynchronize for macOS, Windows, and Linux.'
  usage:
    - >
      Users compare two editable text files, reconcile three versions of a file, inspect
      and synchronize directory trees, save recurring directory comparisons as profiles,
      or launch comparisons from another application or the command line.
