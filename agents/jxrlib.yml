history:
  adoption-history:
    - >
      JPEG XR had a real Microsoft-platform footprint, especially through Windows
      Imaging Component, Internet Explorer-era support, and Microsoft Office document
      internals, but it did not displace JPEG, PNG, WebP, or later AVIF/JPEG XL in broad
      web packaging. The library remains packaged mostly for compatibility, conversion,
      and archival workflows.
  package-nerd-significance:
    - >
      jxrlib is interesting because it is less a trendy tool than a preservation and
      compatibility package: it keeps a Microsoft-origin image standard buildable on
      Unix package managers after CodePlex disappeared and after JPEG XR became a niche
      format.
  project-history:
    - >
      JPEG XR began as Microsoft imaging technology under the HD Photo and Windows Media
      Photo names. The format was submitted into JPEG standardization in 2007 and
      standardized as ISO/IEC 29199-2 and ITU-T T.832, with ITU-T T.832 describing the
      coded image format for storage and interchange of continuous-tone photographic
      content.
    - >
      The jxrlib code lineage comes from Microsoft's JPEG XR Device Porting Kit and
      CodePlex-era source release. Public mirrors describe jxrlib as the JPEG XR
      reference implementation library released by Microsoft under the BSD-2-Clause
      license; the README text says the code and documentation represent the final
      design and specification of the 1.0 bitstream and should be used as reference
      material when code and documentation differ.
  related-projects:
    - >
      Related projects include the ITU-T T.832 JPEG XR specification, ITU-T T.835
      reference software, Microsoft's Windows Imaging Component, and downstream forks
      that preserve or wrap the CodePlex-era source for Java, Rust, or distribution
      builds.
  sources:
    - https://formulae.brew.sh/formula/jxrlib
    - https://github.com/4creators/jxrlib
    - https://github.com/glencoesoftware/jxrlib
    - https://jpeg.org/jpegxr/workplan.html
    - https://tracker.debian.org/pkg/jxrlib
    - https://www.itu.int/ITU-T/recommendations/rec.aspx?id=13914
    - https://www.loc.gov/preservation/digital/formats/fdd/fdd000244.shtml
    - https://www.microsoft.com/en-us/research/project/jpeg-xr/
  summary:
    - >
      jxrlib packages the JPEG XR reference codec lineage: C command-line tools and
      libraries for encoding and decoding JPEG XR images, commonly exposed as
      `JxrEncApp` and `JxrDecApp`.
  timeline:
    - '2007: Microsoft submits HD Photo technology to JPEG for standardization.'
    - >
      2009: JPEG XR image coding specification appears in the ISO/IEC 29199 and ITU-T
      T.832 standard line.
    - >
      2013: Microsoft publishes JPEG XR source-code and plugin materials through the HD
      View/CodePlex-era channel.
    - >
      2017: Debian packaging version strings record a git snapshot lineage for libjxr
      packages.
    - >
      2026: Homebrew, Debian, Fedora, MacPorts, Nix, Arch, Ubuntu, and openSUSE
      packaging metadata still list jxrlib/libjxr packages.
  usage:
    - >
      Package users install jxrlib for the encoder and decoder tools and development
      libraries. The command-line utilities convert to and from JPEG XR files, while
      downstream packages use the library when they need support for `.jxr`, `.wdp`, or
      `.hdp` images.
related-packages:
  - id: brew:imagemagick
    reason: >
      Use ImageMagick with jxrlib when you need broader scripted image conversion or
      processing; its official format registry names jxrlib as the JXR/WDP delegate.
    rel: adjacent_workflow
    sources:
      - https://imagemagick.org/formats/
      - https://jpeg.org/jpegxr/software.html
