id: brew:go-hass-agent
display-name: Go Hass Agent
repo: null
docs:
  - https://github.com/joshuar/go-hass-agent#readme
config-file-location:
  linux:
    - ~/.config/go-hass-agent/preferences.toml
    - ~/.config/go-hass-agent/commands.toml
  macos:
    - ~/Library/Application Support/go-hass-agent/preferences.toml
    - ~/Library/Application Support/go-hass-agent/commands.toml
  windows:
    - '%LocalAppData%\go-hass-agent\preferences.toml'
    - '%LocalAppData%\go-hass-agent\commands.toml'
credentials-file-location:
  linux:
    - ~/.config/go-hass-agent/preferences.toml
  macos:
    - ~/Library/Application Support/go-hass-agent/preferences.toml
  windows:
    - '%LocalAppData%\go-hass-agent\preferences.toml'
history:
  adoption-history:
    - >
      The tool serves a focused Home Assistant niche: users who want desktop or server
      state inside automations without depending on a mobile companion app. Its Homebrew
      and Nix packaging broaden installation beyond manual Go builds, while the README's
      platform tables document a Linux-heavy sensor set plus cross-platform script and
      MQTT extension points.
  package-nerd-significance:
    - >
      For package catalogs, Go Hass Agent is a useful example of a desktop-adjacent
      automation agent packaged as a Go binary. Its value comes from bridging local OS
      APIs, MQTT, and Home Assistant's native app integration model rather than from
      being a general-purpose developer tool.
  project-history:
    - >
      The repository was created in April 2023, and the author introduced the project to
      the Home Assistant community the same month as a native app integration for
      desktop and laptop devices. The README frames it as analogous to the Home
      Assistant mobile companion app, but aimed at desktops, servers, Raspberry Pi
      devices, and other systems that can run Go.
  related-projects:
    - Home Assistant
    - Home Assistant Companion App
    - HASS.Agent
    - MQTT
  sources:
    - >
      https://community.home-assistant.io/t/go-hass-agent-a-native-app-integration-for-desktop-laptop-devices/559250
    - https://formulae.brew.sh/formula/go-hass-agent
    - https://github.com/joshuar/go-hass-agent
    - https://github.com/joshuar/go-hass-agent/releases
    - https://pkg.go.dev/github.com/joshuar/go-hass-agent
  summary:
    - >
      Go Hass Agent is a native Home Assistant companion-style agent for desktop and
      laptop devices. It exposes local sensors, controls, and events from a machine to
      Home Assistant so they can be used in dashboards and automations.
  timeline:
    - '2023: The GitHub repository was created.'
    - '2023: The author shared the project on the Home Assistant community forum.'
    - '2023: v5.0.x releases appeared on GitHub.'
    - '2026: v14.x releases showed ongoing packaging and sensor work.'
  usage:
    - >
      Practitioners run Go Hass Agent on a device they want Home Assistant to observe or
      control. The agent reports sensors such as battery, CPU, memory, disk, network,
      media, screen lock, user sessions, and hardware information where the operating
      system supports them; it can also expose custom script sensors, MQTT sensors and
      controls, D-Bus controls, notifications, and Home Assistant events.
related-packages:
  - id: cask:home-assistant
    reason: >
      On macOS, choose the official Home Assistant companion app when you want a native
      graphical client and Mac sensors; choose Go Hass Agent for its background-agent,
      scripting, custom-command, and MQTT extension model.
    rel: alternative
    sources:
      - https://github.com/joshuar/go-hass-agent
      - https://companion.home-assistant.io/docs/macos/
