    - >
      https://help.readmoo.com/zh-TW/articles/11330736-%E5%9C%A8%E9%9B%BB%E8%85%A6-%E6%89%8B%E6%A9%9F-%E5%B9%B3%E6%9D%BF%E4%B8%8A%E5%A6%82%E4%BD%95%E9%96%B1%E8%AE%80%E9%9B%BB%E5%AD%90%E6%9B%B8-%E9%9C%80%E8%A6%81%E5%AE%89%E8%A3%9D%E8%BB%9F%E9%AB%94%E6%88%96%E6%98%AF-app-%E5%97%8E
    - https://news.readmoo.com/2015/02/09/7-questions/
    - https://news.readmoo.com/2017/08/16/new-logo/
  summary:
    - >
      Readmoo 看書 is the desktop reading application for Readmoo, a Taiwanese Traditional
      Chinese ebook store and cloud-reading service. It provides access to purchased
      books and synchronized reading across desktop, browser, mobile, and mooInk
      devices.
  timeline:
    - >
      2012: Readmoo was established and its website publicly launched with an initial
      catalog of ten books.
    - "2015: A public naming campaign selected 讀墨 as the service's Chinese name."
    - >
      2017: Readmoo marked five years of service, introduced a second-generation
      identity, and expanded its ecosystem with mooInk hardware.
    - '2023: Readmoo announced a substantially refreshed Mac desktop application.'
  usage:
    - >
      Readers sign in with a Readmoo account, synchronize their bookshelf, download
      books for offline reading, and use features such as bookmarks, highlighting,
      annotations, reading progress, and cross-device synchronization. Readmoo also
      offers browser reading when installing a desktop application is unnecessary.
