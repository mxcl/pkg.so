history:
  adoption-history:
    - >
      Readmoo began as a browser-based, cross-device service and subsequently added iOS
      and Android apps, Windows and Mac desktop readers, and the mooInk device family.
      Its official history describes growth from an initial catalog of ten books and
      relationships with more than 80 Taiwanese publishers during its launch period.
  package-nerd-significance:
    - >
      Readmoo 看書 is notable in desktop package catalogs as the native reader for a
      Taiwan-centered Traditional Chinese ebook ecosystem. It connects desktop reading
      with a broader cloud library spanning browsers, mobile apps, and dedicated mooInk
      hardware rather than acting as a general-purpose local EPUB reader.
  project-history:
    - >
      Readmoo was established in early 2012 and publicly launched its website in
      September 2012. The service combined an ebook store, browser-based reading,
      annotations, highlighting, sharing, and a reading community. It later adopted the
      Chinese name 讀墨, released native mobile and desktop readers, and expanded into
      dedicated mooInk ebook readers.
  related-projects:
    - The Readmoo web reader provides browser-based access to the same account library.
    - Readmoo mobile applications support iOS and Android reading.
    - mooInk is Readmoo's dedicated ebook-reader device family.
    - mooPub is Readmoo's self-publishing service.
  sources:
    - https://help.readmoo.com/zh-TW/
