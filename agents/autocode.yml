credentials-file-location: null
history:
  adoption-history:
    - >
      Autocode's official documentation was written around GitHub login: users could
      create or load repositories and immediately begin generating code for them, with
      the service requesting read/write access to public and private repositories. That
      reflects a hosted-code-generation model rather than a purely local compiler or
      scaffolder.
    - >
      Its adoption footprint is best understood as narrow and historical. The package
      survives as an npm tarball and package-manager formula, while the public source
      repository and hosted product context are much harder to verify than the ReadMe
      documentation and registry metadata.
  package-nerd-significance:
    - >
      Autocode is a package-history oddity: an old npm package and CLI for a hosted
      code-generation workflow whose original repository URL no longer resolves. It is a
      good case where npm metadata, hosted docs, and package-manager records outlive the
      active source project.
    - >
      For enrichment, the lazy safe move is to cite the registry and official docs, keep
      the stale repository out of the official repo field, and avoid inventing
      continuity with newer unrelated projects that share the same name.
  project-history:
    - >
      The npm registry records the autocode package as created on 13 November 2014,
      version 1.0.0 as published on 27 October 2015, and version 1.3.1 as published on
      18 February 2016. The official ReadMe-hosted introduction describes it as a
      hackable, spec-driven code generator for producing code in any language or format.
    - >
      The official docs place Autocode in the mid-2010s wave of hosted developer tools
      around GitHub OAuth, generated project structure, and npm-distributed CLIs. They
      describe a web UI with areas for globals, imports, exports, outputs, interfaces,
      scripts, config, and files, plus hacking concepts such as generators, schemas,
      specs, engines, helpers, processors, transformers, and injectors.
    - >
      The npm registry metadata for version 1.3.1 lists a GitHub repository under
      ctate/autocode, but that URL returned HTTP 404 during review. Since no official
      live HTTP source-control page could be verified, the repository should remain null
      rather than inferred from stale registry metadata.
  related-projects:
    - GitHub is central to the official login and repository workflow.
    - >
      The docs describe generators, schemas, specs, engines, processors, transformers,
      and injectors as Autocode customization concepts.
    - ReadMe hosts the surviving official documentation surface.
  sources:
    - https://autocode.readme.io/docs/config
    - https://autocode.readme.io/docs/examples
    - https://autocode.readme.io/docs/getting-started
    - https://autocode.readme.io/docs/login-with-github
    - https://formulae.brew.sh/api/formula/autocode.json
    - https://registry.npmjs.org/autocode
  summary:
    - >
      Autocode was an npm-distributed, spec-driven code generator with hosted ReadMe
      documentation and a GitHub-integrated workflow for generating APIs, apps,
      websites, and project files from configuration.
  timeline:
    - '2014-11-13: npm registry created the autocode package.'
    - '2015-10-27: version 1.0.0 published to npm.'
    - '2016-02-18: version 1.3.1 published to npm.'
    - '2022-06-13: npm registry metadata modified.'
    - >
      2026-07-02: The registry-listed ctate/autocode GitHub URL returned HTTP 404 during
      review.
  usage:
    - >
      The documentation describes using Autocode to define specs and outputs, generate
      code, build and run code, export generators and schemas, and edit configuration
      through a Config tab. Examples include JSON generation/parsing, Express apps,
      package-manager files, README files, Redis config, and framework-specific project
      outputs.
    - >
      The package's practical config convention is `.autocode/config.yml`, visible in
      official examples and package-manager tests. That config-driven design is the key
      package-nerd detail: the CLI is a front end to generated outputs described by
      structured project data rather than a single language compiler.
