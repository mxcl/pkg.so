id: brew:erlang@28
display-name: Erlang/OTP 28
repo: null
docs:
  - https://www.erlang.org/docs/28
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      As with other OTP major lines, erlang@28 gives package-manager users a way to pin
      the runtime while the main Erlang package advances. The source facts list Erlang
      packages across Homebrew, apk, Chocolatey, MacPorts, Scoop, winget, zypper, and
      major Linux package managers.
  package-nerd-significance:
    - >
      OTP 28 is relevant to package maintainers because downstream Erlang tooling needed
      explicit support for its syntax and runtime changes; erlfmt's changelog, for
      example, added support for OTP 28 comprehensions and nominal types.
  project-history:
    - >
      Erlang/OTP 28.0 was announced on May 21, 2025 as a major release. The release
      introduced new language and runtime features such as priority messages, zip
      generators and strict generators in comprehensions, based floating-point literals,
      compiler diagnostics improvements, and source SBOM publication on GitHub Releases.
  related-projects:
    - >
      erlfmt tracks OTP 28 syntax changes so formatted source remains compatible with
      the OTP 28 language.
    - >
      OTP 28 belongs to the same upstream erlang/otp project as the OTP 26 and OTP 27
      formulae.
  sources:
    - https://www.erlang.org/
    - https://www.erlang.org/news/180
    - https://www.erlang.org/news/
    - https://formulae.brew.sh/formula/erlang@28
    - https://raw.githubusercontent.com/WhatsApp/erlfmt/main/CHANGELOG.md
  summary:
    - >
      Erlang/OTP 28 is the Homebrew versioned formula for the OTP 28 release line of the
      official Erlang runtime and OTP libraries.
  timeline:
    - '2025-05-21: Erlang/OTP 28.0 announced as a new major release.'
    - '2025: OTP 28.1, OTP 28.3, and OTP 28.4 followed as maintenance patch packages.'
    - '2026: OTP 28.5 continued the OTP 28 maintenance line.'
  usage:
    - >
      The formula installs the OTP 28 versions of the Erlang shell, compiler, escript,
      Dialyzer, Common Test runner, EPMD, and related runtime utilities.
related-packages:
  - id: brew:rebar3
    reason: >
      Use Rebar3 with OTP 28 to create, compile, test, dependency-lock, and release
      Erlang applications; its official compatibility table explicitly documents OTP 28
      support.
    rel: adjacent_workflow
    sources:
      - https://github.com/erlang/rebar3
      - https://rebar3.org/docs/
  - id: brew:erlfmt
    reason: >
      Use erlfmt to format OTP 28 source and enforce formatting in CI; its official
      release notes added support for OTP 28 generators and nominal types.
    rel: adjacent_workflow
    sources:
      - https://github.com/WhatsApp/erlfmt
      - https://github.com/WhatsApp/erlfmt/releases
