history:
  adoption-history:
    - >
      GPAC's adoption is strongest where media engineers need standards-conformant
      tooling rather than a single-purpose transcoder. Its README names video
      enthusiasts, academic researchers, standardization bodies, and professional
      broadcasters as common audiences, and the project provides installers and packages
      across desktop, server, and mobile platforms.
  package-nerd-significance:
    - >
      For package maintainers, GPAC is the kind of media package that pulls weight far
      beyond its formula name: MP4Box is a fixture in packaging scripts, test corpora,
      streaming workflows, and academic demos, while libgpac and bindings make the
      framework embeddable. The challenge is balancing a large codec/container feature
      surface with reproducible builds and platform-specific media dependencies.
  project-history:
    - >
      The GPAC FAQ says the project's seeds were planted by Jean Le Feuvre in New York
      while working on MPEG-4 ideas, and that researchers later helped keep the codebase
      available as a fully open-source project. The repository README says GPAC started
      as a startup in NYC, gained traction from research and a nascent multimedia
      community, and was open-sourced in 2003.
    - >
      The Git repository history imported from earlier CVS begins in 2005, and the
      project later moved through long-running 0.x releases to 1.x, 2.x, and
      calendar-style 26.x release tags. The README identifies Telecom Paris's MultiMedia
      group as the main development home, with external contributors and industrial R&D
      collaborations.
  related-projects:
    - MP4Box is the best-known GPAC command-line tool and shares the same source tree.
    - libgpac is the embeddable library beneath GPAC tools.
    - MP4Box.js is a JavaScript project inspired by GPAC's MP4Box tool.
    - >
      The GPAC testsuite repository carries conformance and regression tests for the
      framework.
  sources:
    - https://github.com/gpac/gpac
    - https://gpac.io/faq/
    - https://raw.githubusercontent.com/gpac/gpac/master/README.md
    - https://wiki.gpac.io/
    - https://wiki.gpac.io/Filters/Filters
    - https://wiki.gpac.io/MP4Box/MP4Box
  summary:
    - >
      GPAC is an open-source multimedia framework for standards-oriented media
      processing, packaging, streaming, playback, inspection, and interaction. It is
      especially known in packaging circles for MP4Box and for deep support of
      MP4/ISOBMFF, MPEG-DASH, CMAF, and related media standards.
  timeline:
    - '2003: GPAC is open-sourced according to the official README.'
    - '2005: CVS-derived repository history begins in the Git import.'
    - '2015: v0.5.2 is tagged as the first GitHub-versioned release in the repository history.'
    - >
      2020: v0.9.0 and v1.0.0 tags appear around the filter-era framework work cited by
      the README.
    - '2022: v2.0.0 is tagged as GPAC 2.0.'
    - '2026: v26.02.0 is tagged as GPAC Release 26.02.'
  usage:
    - >
      Users commonly invoke MP4Box for MP4 import, extraction, inspection, DASH
      segmentation, RTP hinting, and packaging operations. The `gpac` application
      exposes the framework's filter engine directly, letting users build arbitrary
      media-processing pipelines from filters.
related-packages:
  - id: brew:bento4
    reason: >
      Choose Bento4 for a focused toolkit and SDK around MP4, DASH, and HLS packaging;
      choose GPAC when you also need a broad filter graph, playback, streaming, and
      interactive-media framework.
    rel: alternative
    sources:
      - https://wiki.gpac.io/MP4Box/MP4Box
      - https://www.bento4.com/documentation/
  - id: brew:ffmpeg
    reason: >
      Choose FFmpeg primarily for broad codec transcoding, filtering, capture, and
      playback; use GPAC when standards-focused MP4/ISOBMFF inspection and DASH/CMAF
      packaging are central.
    rel: alternative
    sources:
      - https://github.com/gpac/gpac#features
      - https://ffmpeg.org/about.html
