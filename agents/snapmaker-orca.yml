history:
  adoption-history:
    - >
      Snippety is offered for macOS and iOS, with Apple-platform synchronization through
      iCloud. The official site also distributes a standalone macOS build and documents
      Homebrew installation.
    - >
      The official site reports approximately 1,100 App Store ratings and promotes both
      individual snippet expansion and iCloud-based sharing and collaboration.
  package-nerd-significance:
    - >
      Snippety occupies the power-user text-expander niche while adding
      developer-friendly syntax highlighting, shell-script execution, placeholders,
      Markdown, HTML, rich-text templates, a command-line interface, and Shortcuts
      integration. Its Homebrew cask makes the independently distributed macOS build
      reproducible through a familiar package workflow.
  project-history:
    - >
      Snippety was created by independent developer Wojciech Kulik as a native snippet
      manager and text expander for Mac and iPhone. The official site dates the product
      period from 2020.
    - >
      The product developed from snippet storage and expansion into a template and
      automation system with conditional blocks, placeholders, quick access, iCloud
      synchronization and collaboration, themes, shared files, backups, command-line
      tools, Shortcuts actions, and optional AI-assisted generation.
  related-projects:
    - >
      Snippety belongs to the same productivity category as TextExpander, Typinator,
      Espanso, Alfred snippets, and Raycast snippets, while emphasizing native Apple
      integration and local storage.
  sources:
    - 'Official documentation changelog: https://snippety.app/help/changelog/'
    - 'Official homepage: https://snippety.app/'
    - 'Official installation guide: https://snippety.app/help/installation/'
    - 'Official introduction: https://snippety.app/help/introduction/'
  summary:
    - >
      Snippety is a commercial snippet manager and text expander for macOS and iOS. It
      stores data locally, can synchronize through iCloud, and supports templates,
      placeholders, formatting, scripts, automation, and shared collections.
  timeline:
    - "2020: Beginning of the product period shown by the official site's copyright notice."
    - >
      2025: Official documentation recorded AI configuration, deeplinks, iCloud
      synchronization and collaboration, shared-file synchronization, backups, and
      themes.
    - >
      2026: Snippety added conditional blocks, command-line tools, Shortcuts
      integration, app-specific rules, and further template features.
  usage:
    - >
      Users save frequently reused text or templates and insert them from the app, copy
      them to the clipboard, trigger expansion by typing a keyword, or select them from
      a global quick-access menu.
    - >
      Power users build dynamic templates with placeholders, conditional blocks, nested
      snippet references, calculated values, clipboard or file content, simulated keys,
      and shell scripts. Libraries can remain local or synchronize and be shared through
      iCloud.
    - The standalone macOS edition can be installed with `brew install snippety`.
