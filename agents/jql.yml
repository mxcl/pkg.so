history:
  adoption-history:
    - >
      jql has broader packaging than most niche JSON CLIs in this batch. Its README
      lists installation routes through Alpine, Arch AUR, Cargo, Cargo Binstall, Fedora,
      FreeBSD, Homebrew, Nix, openSUSE, and GitHub release binaries. Crates.io reported
      248,530 total downloads and 3,640 recent downloads for the jql crate on
      2026-07-01.
  package-nerd-significance:
    - >
      For package collectors, jql is interesting as one of several post-jq experiments
      that treat JSON querying as a compact shell primitive but choose a new grammar.
      Its split crates also make it more library-shaped than a single binary-only
      utility.
  project-history:
    - >
      The Rust crate metadata dates the jql package to 2018-10-06. The repository later
      settled into a workspace with the jql binary plus jql-parser and jql-runner
      library crates, exposing the parser and execution pieces as reusable Rust
      packages.
  related-projects:
    - >
      jql is related to jq by domain rather than compatibility. Within its own
      repository, the most direct related projects are the jql-parser and jql-runner
      crates.
  sources:
    - https://crates.io/crates/jql
    - https://docs.rs/jql-parser/latest/jql_parser/
    - https://docs.rs/jql-runner/latest/jql_runner/
    - https://formulae.brew.sh/api/formula/jql.json
    - https://github.com/yamafaktory/jql
  summary:
    - >
      jql is a Rust command-line JSON query language and runner. It positions itself as
      a fast, lightweight, deliberately simple JSON selection tool rather than a
      jq-compatible language.
  timeline:
    - '2018: Crates.io recorded the jql crate creation on 2018-10-06.'
    - >
      2026: The GitHub release feed recorded jql, jql-parser, and jql-runner 8.1.x
      releases on 2026-03-18.
    - '2026: Homebrew formula API packaged jql 8.1.2 from the jql-v8.1.2 GitHub archive.'
  usage:
    - >
      jql accepts a query token sequence and returns JSON, with object selectors, array
      selectors, ranges, flattening, key extraction, streaming line-by-line input,
      validation, inline output, raw string output, and file-based queries. The README
      explicitly says there is no plan to align jql with jq or similar tools.
related-packages:
  - id: brew:jq
    reason: >
      Choose jq when you need its mature, widely documented filter language and
      ecosystem; choose jql when its intentionally simpler, incompatible token syntax
      fits the task.
    rel: alternative
    sources:
      - https://github.com/yamafaktory/jql
      - https://jqlang.org/manual/
