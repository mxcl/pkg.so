history:
  adoption-history:
    - >
      The project is distributed as a native macOS application and documents both manual
      installation from GitHub Releases and installation through Homebrew Cask.
  package-nerd-significance:
    - >
      It brings a familiar X11/Linux window-manager interaction to macOS: windows can be
      moved or resized from anywhere inside them rather than only through the title bar
      or borders.
  project-history:
    - >
      Daniel Marcotte's Easy Move+Resize is an open-source macOS window utility inspired
      by behavior common in X11/Linux window managers. Its public repository contains
      the Objective-C application, release workflow, issue tracker, and signed release
      artifacts.
  related-projects:
    - X11 window managers, whose modifier-key dragging behavior inspired the application.
    - Homebrew Cask, an installation route documented by the project.
  sources:
    - https://github.com/dmarcotte/easy-move-resize#readme
    - https://github.com/dmarcotte/easy-move-resize/releases
  summary:
    - >
      Easy Move+Resize is a small macOS utility that adds modifier-key-and-mouse-drag
      window movement and resizing modeled on common X11 window-manager behavior.
  timeline:
    - >
      2014: The public issue tracker was already documenting configurable modifier-key
      behavior.
    - >
      2025: The project published releases adding features such as dynamic refresh-rate
      handling and support for the Fn modifier key.
  usage:
    - >
      Users normally hold selected modifier keys and drag with the left mouse button to
      move a window or with the right or middle button to resize it. Menu-bar controls
      provide modifier selection, per-application disabling, bring-to-front behavior,
      and reset-to-defaults. macOS Accessibility permission is required for window
      manipulation.
