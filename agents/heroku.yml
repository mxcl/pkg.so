id: brew:heroku
display-name: Heroku CLI
repo: https://github.com/heroku/cli
docs:
  - https://devcenter.heroku.com/articles/heroku-cli
config-file-location: null
credentials-file-location:
  unix:
    - ~/.netrc
history:
  adoption-history:
    - >
      The CLI's adoption follows Heroku's role as an early platform-as-a-service
      developer workflow. For many users, `heroku create`, `git push heroku`, `heroku
      config`, `heroku ps`, `heroku logs`, `heroku run`, and add-on commands were the
      ordinary interface to cloud deployment before web dashboards or
      infrastructure-as-code tools became default for every platform.
    - >
      The Dev Center article says the CLI used to be part of the Heroku Toolbelt, then
      documents standalone installation through Homebrew, installers, and npm. That
      transition mirrors a broader shift from Ruby-era Heroku tooling to a Node.js/oclif
      CLI with plugins and generated command documentation.
    - >
      Heroku's 2016 changelog item for Teams support shows the CLI tracking platform
      features over time: the old Toolbelt CLI gained commands and flags for team
      operations as Heroku's collaboration model evolved.
  package-nerd-significance:
    - >
      Heroku CLI is a canonical example of a vendor CLI that became an operational
      dependency. It is not just a client for one API: package managers ship it because
      developers expect deployments, logs, config, add-ons, and database maintenance to
      be available from scripts, CI, and shell sessions.
    - >
      Its packaging history is a miniature history of language ecosystems in CLIs:
      RubyGem-era `heroku`, Toolbelt bundling to hide Ruby from non-Ruby users, then a
      Node.js and oclif architecture with npm distribution, Homebrew packaging, and
      plugin commands.
    - >
      oclif itself is historically tied to Heroku. Heroku's 2024 CLI v9 post says Heroku
      pioneered oclif and then moved all core CLI commands to it, making Heroku CLI both
      a consumer and a proving ground for a framework used by other large CLIs.
  project-history:
    - >
      Heroku's command-line story predates the Node.js repository. In March 2012, Heroku
      announced the Heroku Toolbelt as a package of the Heroku CLI, Foreman, and Git for
      OS X, Windows, and Debian/Ubuntu Linux. The post explained that the CLI used Ruby
      under the hood, while Toolbelt packaging isolated its libraries so developers
      outside Ruby ecosystems could use Heroku without managing RubyGems themselves.
    - >
      The `heroku/cli` repository was created on December 20, 2014. The repository
      README describes the modern CLI as a Node.js and oclif-based command-line
      interface for Heroku applications and services, with an extensible plugin
      architecture.
    - >
      In 2024, Heroku described CLI v9.0.0 as a major architecture release that moved
      all core commands onto oclif, consolidated commands into a single package,
      improved tests, and simplified release processes. Heroku noted that earlier
      commands had been split across legacy and pre-oclif architectures.
    - >
      In March 2026, Heroku described CLI v11 as a modernization that completed
      migration to ECMAScript Modules and oclif v4, shipped with Node.js 22 while
      retaining Node.js 20 compatibility, and added semantic color behavior and workflow
      changes such as command search and unified data-maintenance commands.
  related-projects:
    - >
      Foreman is part of the Heroku Toolbelt origin story and remains associated with
      local process workflows shaped by Heroku's Procfile model.
    - oclif is the CLI framework Heroku uses for the command architecture and plugin model.
    - >
      Heroku platform services such as Heroku Postgres, Redis, Pipelines, Teams, Private
      Spaces, add-ons, and the Dev Center are exposed or supported by CLI command
      groups.
  sources:
    - >
      Heroku CLI GitHub README for repository identity, command scope, and oclif/Node.js
      architecture.
    - >
      Heroku Dev Center CLI article for installation, credentials, Toolbelt note, and
      architecture.
    - >
      Heroku Toolbelt announcement for the Ruby-era bundle and cross-platform installer
      history.
    - >
      Heroku blog and Dev Center changelog entries for CLI v9 and v11 architectural
      milestones.
  summary:
    - >
      The Heroku CLI is the command-line interface for managing Heroku applications and
      services. Historically it is one of the defining cloud-platform CLIs: it carried
      Heroku's git-push deployment workflow, add-ons, dyno management, logs, config
      vars, database operations, teams, plugins, and local development commands into a
      single terminal tool.
  timeline:
    - '2012-03-09: Heroku announced Heroku Toolbelt, bundling the CLI, Foreman, and Git.'
    - '2014-12-20: `heroku/cli` GitHub repository creation date recorded by GitHub.'
    - '2016-10-18: Heroku Teams support was announced for the Heroku Toolbelt CLI.'
    - '2024-07-25: Heroku published its CLI v9 architecture and oclif-transition post.'
    - '2026-03-18: Heroku Dev Center changelog announced CLI v11.0.0.'
    - '2026-03-19: Heroku published its CLI v11 modernization post.'
  usage:
    - >
      The CLI manages app lifecycle, deployment, scaling, logs, add-ons, Heroku
      Postgres, Heroku Redis, SSL certificates, domains, pipelines, teams, private
      spaces, and plugin commands. The README's command-topic list functions as a map of
      Heroku's platform surface area exposed through the terminal.
    - >
      Authentication is stored through the CLI's credential flow; Heroku Dev Center
      troubleshooting notes that `.netrc` is where the CLI stores credentials on
      Unix-like systems, with `_netrc` on Windows.
    - >
      The CLI also has a plugin culture. The README points developers to Heroku's CLI
      plugin documentation, and Heroku's architecture writing emphasizes oclif's modular
      structure and plugin support.
related-packages:
  - id: brew:foreman
    reason: >
      Foreman runs Heroku-style Procfile applications locally and is documented by
      Heroku as an alternative local runner, making it useful alongside
      deployment-oriented Heroku CLI workflows.
    rel: adjacent_workflow
    sources:
      - https://devcenter.heroku.com/articles/heroku-local
      - https://ddollar.github.io/foreman/
