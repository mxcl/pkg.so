history:
  adoption-history:
    - >
      YellowDot is available as a direct download and through Homebrew. It serves a
      narrow macOS audience—particularly presenters and live-visual performers—for whom
      a brightly colored menu-bar indicator can be distracting.
    - >
      The developer now states that YellowDot no longer works on macOS Tahoe 26. The
      official page also points users of macOS 14.4 and later to Apple's built-in option
      for hiding privacy indicators on external displays.
  package-nerd-significance:
    - >
      YellowDot is a small, open-source example of package-manager culture around
      narrowly scoped macOS behavior: it turns an operating-system presentation
      annoyance into a one-command-installable menu-bar utility.
    - >
      Its implementation history also tracks changes in private macOS window behavior,
      forcing the project to replace its original window-moving technique with visual
      recoloring.
  project-history:
    - >
      YellowDot was inspired by the command-line utility undot and packaged the idea
      into an easy-to-use macOS application. Version 1 moved the indicator window
      off-screen on systems before macOS 12.2.
    - >
      After macOS 12.2 changed the indicator's implementation, YellowDot version 2
      adopted a different technique: locating the indicator and recoloring it black or
      white so it blends into the menu bar.
  related-projects:
    - undot
    - RecordingIndicatorUtility
  sources:
    - 'Official product page: https://www.lowtechguys.com/yellowdot/'
    - 'Official releases: https://github.com/FuzzyIdeas/YellowDot/releases'
    - 'Official repository README: https://github.com/FuzzyIdeas/YellowDot'
  summary:
    - >
      YellowDot is an open-source macOS menu-bar utility that reduces the visual
      prominence of microphone, location, and screen-capture privacy indicators.
  timeline:
    - 'Before macOS 12.2: Version 1 could move the indicator window off-screen.'
    - "macOS 12.2: Apple's changes prevented the original window-moving technique."
    - 'macOS 13 era: Version 2 recolored indicators to blend with the menu bar.'
    - 'macOS 14.4: Apple added a built-in external-display privacy-indicator option.'
    - 'macOS 26: The developer reports that YellowDot no longer works.'
  usage:
    - >
      Run the application in the background to recolor supported privacy indicators. It
      is most effective in fullscreen spaces on notched MacBooks, where a black
      indicator can blend into the surrounding menu bar.
    - >
      The application can be quit from its menu-bar item. Its purpose is cosmetic; it
      does not disable the underlying microphone, location, or screen-capture activity.
