history:
  adoption-history:
    - >
      MacLoggerDX has been maintained across more than two decades of macOS changes. Its
      changelog records the transition to Cocoa and SQLite, continuing support for new
      transceivers and digital-mode applications, and Universal builds for both Intel
      and Apple Silicon Macs.
    - >
      Its longevity and extensive hardware integration reflect adoption among Mac-based
      amateur-radio operators who need a native alternative to the larger
      Windows-oriented logging ecosystem.
  package-nerd-significance:
    - >
      MacLoggerDX is notable as a long-lived, Mac-native specialist application that
      joins serial and network rig control, logging, mapping, spotting, awards, and
      online confirmation services in one package.
    - >
      Its support for ADIF import and export, WSJT-X, Hamlib, LoTW, eQSL, QRZ Logbook,
      Club Log, AppleScript, and many radio and rotor protocols makes it an
      interoperability hub rather than merely a contact database.
  project-history:
    - >
      Dog Park Software released MacLoggerDX 1.0.0 on April 16, 2002. Early releases
      added editable logs, ADIF interchange, rig drivers, DX-cluster features, alarms,
      maps, and call-sign lookup.
    - >
      Version 5.0, released in 2009, became a Cocoa Universal Binary and moved its log
      database to SQLite. Later releases expanded digital-mode integration, online
      confirmations, award tracking, radio and rotor support, automation, and Apple
      Silicon compatibility.
  related-projects:
    - MacDoppler
    - dogparkSDR
    - WSJT-X
    - Hamlib
    - ARRL Logbook of the World
  sources:
    - 'Official FAQ: https://www.dogparksoftware.com/MacLoggerDX%20Help/mldxfc_faq.html'
    - >
      Official current change log:
      https://www.dogparksoftware.com/MacLoggerDX%20Help/mldxfc_changelog.html
    - >
      Official legacy change log:
      https://dogparksoftware.com/MacLoggerDX/Manual/Pages/changelog.html
    - >
      Official manual:
      https://www.dogparksoftware.com/MacLoggerDX%20Help/MacLoggerDX%20Help.html
  summary:
    - >
      MacLoggerDX is Dog Park Software's macOS application for amateur-radio contact
      logging and transceiver control. It combines a QSO database with DX-cluster spots,
      maps, call-sign lookup, awards tracking, QSL workflows, and control of radios,
      rotors, and keyers.
  timeline:
    - '2002-04-16: MacLoggerDX 1.0.0 was released.'
    - '2009-02-17: Version 5.0 introduced a Cocoa Universal Binary and SQLite log database.'
    - '2021-11-26: Version 6.36 documented Universal support for Apple Silicon and Intel.'
    - '2026-09-03: Version 6.62 continued hardware, mapping, and ADIF maintenance.'
  usage:
    - >
      Operators use MacLoggerDX to record QSOs, tune and read supported radios, consume
      DX-cluster spots, track worked and confirmed entities, exchange ADIF logs, and
      submit or reconcile confirmations with services such as LoTW, eQSL, Club Log, and
      QRZ Logbook.
    - >
      The application creates an MLDX_Logs folder in Documents by default, but users can
      select another log folder. The preferences plist stores application settings,
      registration information, and service-related settings.
