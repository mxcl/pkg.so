history:
  adoption-history:
    - >
      Replicator evolved through sustained Jamf-administrator use, adding selective
      replication, dependency handling, site-aware migration, XML import/export,
      API-client authentication, command-line operation, dry runs, and support for newer
      Jamf Pro object classes.
  package-nerd-significance:
    - >
      Replicator is notable in Mac-admin package collections because it packages a
      specialized Jamf Pro migration utility that would otherwise be installed manually
      from GitHub. It bridges graphical administration and repeatable command-line
      migration workflows.
  project-history:
    - >
      The project began as a focused utility for copying Jamf objects and grew into a
      broader synchronization and migration tool. Its long changelog records expansion
      from basic object replication to iOS objects, local XML sources, selective
      migrations, dependency-aware policy copying, bearer tokens, API clients, deletion
      mode, and detailed migration summaries.
  related-projects:
    - Jamf Pro provides the source and destination management servers and APIs.
    - >
      Jamf Sync and jamfcpr are recommended by Replicator for moving package payloads
      that Replicator itself does not copy.
  sources:
    - https://github.com/jamf/Replicator#readme
    - https://github.com/jamf/Replicator/blob/main/ChangeLog.md
  summary:
    - >
      Replicator is an open-source macOS administration tool maintained under the Jamf
      GitHub organization. It copies, exports, imports, updates, or removes selected
      Jamf Pro objects while accounting for object relationships and API limitations.
  timeline:
    - 'v2.1.0: Added replication of Jamf server users and groups.'
    - 'v3.0.0: Added locally stored XML sources and Mac App Store application objects.'
    - 'v7.1.0: Added command-line operation and object-specific export.'
    - >
      2025: The 8.x line added API roles and clients, multi-context environments, dry
      runs, and notarization.
    - >
      2026: The 8.5 and 8.6 releases added optional telemetry controls and improved
      dependency migration.
  usage:
    - >
      Administrators provide source and destination Jamf Pro servers, authenticate to
      each, choose object classes or individual objects, and run a migration or export.
      The bundled executable can also perform scripted exports and migrations after
      credentials and relevant folders have first been saved through the app.
    - >
      Replicator copies package metadata but not package binaries. Administrators must
      also account for API omissions, object dependencies, site ordering, credentials
      that cannot be extracted, and other limitations documented by the project.
