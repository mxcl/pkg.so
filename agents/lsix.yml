history:
  adoption-history:
    - >
      lsix is packaged by several Unix package managers despite being a single script.
      The supplied package facts list Homebrew, Debian, Alpine, Arch, Nix, and Scoop,
      and the official README directly mentions Homebrew as a macOS installation path.
    - >
      The repository's visible GitHub metadata shows thousands of stars and more than
      one hundred forks, which is unusually high for a small shell utility and reflects
      its popularity among terminal-graphics enthusiasts.
  package-nerd-significance:
    - >
      lsix is notable because it is almost aggressively small: a Bash script plus
      ImageMagick, using old Sixel terminal graphics to solve a real daily problem over
      SSH. Package nerds tend to care about it because it sits at the intersection of
      terminal capability detection, image conversion, and the long tail of terminal
      emulator compatibility.
  project-history:
    - >
      The GitHub repository was created in 2017. Its README emphasizes simplicity:
      installation is copying the single lsix script into the user's PATH, with
      ImageMagick as the only prerequisite.
    - >
      The project grew alongside renewed interest in inline terminal graphics. The
      README documents tested or reported support across xterm, MLterm, foot, WezTerm,
      iTerm2, Konsole, WSLtty, MinTTY, Yaft, and other Sixel-capable terminals, while
      explicitly listing common incompatible terminals.
  related-projects:
    - >
      Related projects include ImageMagick, which performs the image conversion and
      montage work, libsixel, which the README discusses as an alternative library
      approach, and Sixel-capable terminal emulators such as xterm, MLterm, foot,
      WezTerm, and iTerm2.
  sources:
    - https://api.github.com/repos/hackerb9/lsix
    - https://github.com/hackerb9/lsix
    - https://github.com/hackerb9/lsix#readme
    - source_facts.package-manager
  summary:
    - >
      lsix is a Bash script that behaves like an image-oriented ls: it displays
      thumbnail montages directly in Sixel-capable terminals. The README positions it as
      a simple terminal image browser built on ImageMagick and Sixel escape sequences.
  timeline:
    - '2017: GitHub repository created.'
    - >
      2024: GitHub repository still active with README updates and a large user-visible
      star/fork footprint.
    - '2026: Current package facts list lsix in multiple Unix package managers.'
  usage:
    - >
      Typical usage is running `lsix` in a directory to display local image thumbnails,
      or passing explicit filenames and shell globs. Because it delegates decoding to
      ImageMagick, the README notes broad support for bitmap and non-bitmap formats,
      with GIFs and multi-image files expanded into montages.
    - >
      The README says lsix has no command-line flags or configuration files; users who
      want to change tile width, font, or similar defaults edit variables at the top of
      the script.
related-packages:
  - id: brew:imagemagick
    reason: >
      ImageMagick is lsix's required companion, providing the format decoding, montage
      construction, and Sixel output used to render thumbnails.
    rel: adjacent_workflow
    sources:
      - https://github.com/hackerb9/lsix
      - https://imagemagick.org/
  - id: brew:chafa
    reason: >
      Choose Chafa when you need a terminal image renderer with ANSI/Unicode fallbacks,
      animation support, an embeddable C API, or graphics protocols beyond lsix's
      Sixel-focused montage workflow.
    rel: alternative
    sources:
      - https://github.com/hackerb9/lsix
      - https://hpjansson.org/chafa/
  - id: brew:viu
    reason: >
      Choose viu for a compact single-image viewer with Kitty and iTerm graphics support
      plus character-cell fallback, rather than lsix's directory-oriented Sixel
      thumbnail montages.
    rel: alternative
    sources:
      - https://github.com/hackerb9/lsix
      - https://github.com/atanunq/viu
