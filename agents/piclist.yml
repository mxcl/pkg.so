history:
  adoption-history:
    - >
      PicList retains compatibility with PicGo's plugin and editor-integration ecosystem
      while adding cloud browsing, deletion, synchronization, preprocessing, and gallery
      capabilities. Its official instructions cover Homebrew, Winget, Scoop, native
      installers, Linux packages, and Docker.
    - >
      The project integrates with Markdown-oriented tools including Typora, Obsidian,
      and VS Code. It can also expose a local upload API, allowing editors and
      automation to treat the desktop application or PicList-Core as an image-upload
      service.
  package-nerd-significance:
    - >
      PicList sits at the intersection of desktop packaging, Markdown authoring, and
      object-storage tooling. Package users get one cross-platform front end for many
      incompatible image-host APIs, while self-hosters can run its core in Docker and
      editor users can automate uploads through its PicGo-compatible interface.
  project-history:
    - >
      PicList is an open-source image upload and cloud-management application developed
      from the PicGo ecosystem. The official repository identifies PicGo's earlier
      lineage and Kuingsmile's PicList work from 2023 onward.
    - >
      The project expanded the basic image-uploader model with remote gallery
      management, deletion, preprocessing, configuration synchronization, a task system,
      scripts, themes, and a companion command-line core.
  related-projects:
    - PicGo is the upstream ecosystem and compatibility base from which PicList was developed.
    - PicList-Core provides the command-line and server-oriented core.
    - VS-PicList integrates PicList with Visual Studio Code.
    - >
      PicHoro is a related Android client, while ThemeHub and ScriptsHub distribute
      extensions.
  sources:
    - https://github.com/Kuingsmile/PicList
    - https://piclist.cn/en/
    - https://piclist.cn/en/configure
  summary:
    - >
      PicList is an open-source, cross-platform image uploader and cloud-storage manager
      based on PicGo, with desktop, command-line, server, editor-integration, and plugin
      workflows.
  timeline:
    - "2017: The repository's copyright notice marks the beginning of the PicGo lineage."
    - >
      2023: The repository's copyright notice marks the beginning of Kuingsmile's
      PicList work.
    - >
      2026: The project continued expanding image processing, scripting, cloud
      management, and cross-platform packaging.
  usage:
    - >
      Users configure one or more image hosts, then upload from drag and drop, the
      clipboard, URLs, scheduled tasks, editors, or the local API. PicList can
      preprocess images, copy generated links, browse and delete remote objects,
      synchronize configuration through Git-based services or WebDAV, and use
      PicGo-compatible plugins.
    - >
      The documented data.json file stores general configuration, including image-host
      and synchronization credentials such as tokens and WebDAV usernames and passwords;
      it should therefore be treated as sensitive.
