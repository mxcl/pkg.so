credentials-file-location: null
history:
  adoption-history:
    - >
      PremiumSoft reports more than 180,000 registered customers for the Navicat family
      across 138 countries and describes use by enterprises, government departments, and
      educational institutions. It does not publish a separate count for the Oracle
      edition.
  package-nerd-significance:
    - >
      The Homebrew cask supplies a package-manager route to a proprietary Oracle-focused
      GUI, complementing Oracle’s command-line and vendor-native tooling while keeping
      it distinct from the broader Navicat Premium package.
  project-history:
    - >
      Navicat is produced by PremiumSoft, founded in 1999. Navicat for Oracle became one
      of its database-specific administration clients; official company materials
      document the Oracle edition in the Navicat 8 generation, and it continues as part
      of Navicat 17.
  related-projects:
    - Oracle Database
    - Navicat Premium
    - Navicat Data Modeler
    - Oracle SQL*Plus
  sources:
    - https://www.navicat.com/en/company/aboutus.html
    - https://www.navicat.com/en/products/
    - https://www.navicat.com/en/products/navicat-for-oracle
    - https://www.navicat.com/manual/online_manual/en/navicat_17/mac_manual/
    - source_facts.package-manager
  summary:
    - >
      Navicat for Oracle is PremiumSoft’s proprietary graphical client for Oracle
      database administration and development.
  timeline:
    - '1999: PremiumSoft, the developer of Navicat, was founded.'
    - '2008: Official company materials document Navicat for Oracle 8 updates.'
    - '2024: Navicat 17 became the current major product generation.'
  usage:
    - >
      Oracle developers and administrators use it to manage connections and schema
      objects, edit data, build and run SQL or PL/SQL, transfer data, model databases,
      and access Oracle-specific facilities such as Data Pump.
