history:
  adoption-history:
    - >
      Flirc's cross-platform configurator supports macOS, Windows, and Linux. Its
      receiver presents itself as a keyboard after programming, so the configured device
      can be moved to another computer or media appliance without leaving the GUI
      running.
    - >
      Built-in profiles and integrations target common media-center environments
      including Kodi, NVIDIA Shield, Fire TV, Windows Media Center, Raspberry Pi, and
      Logitech Harmony setups.
  package-nerd-significance:
    - >
      Flirc is a favorite home-theater utility because it turns arbitrary infrared
      remotes into standard keyboard input and stores mappings on the USB receiver.
      Package-manager installation is primarily needed for initial programming, firmware
      maintenance, command-line automation, and configuration backup rather than
      continuous driver operation.
  project-history:
    - >
      Flirc pairs infrared remote-control signals with keyboard commands using a USB
      receiver and a cross-platform configuration application. The hardware-held
      configuration distinguishes it from conventional resident remote-control drivers.
    - >
      The second-generation firmware line added broader media-center profiles, wake
      support, infrared transmission, macros, long-press actions, and continued support
      for several receiver hardware variants.
  related-projects:
    - >
      Official profiles and documentation connect Flirc with Kodi, NVIDIA Shield, Fire
      TV, Windows Media Center, Raspberry Pi, Logitech Harmony, and Remote Buddy 2.
  sources:
    - https://flirc.com/downloads
    - https://flirc.tv/products/flirc-usb-receiver
    - https://www.flirc.com/software/flirc-usb/firmware/
  summary:
    - >
      Flirc is the graphical and command-line configurator for Flirc USB infrared
      receivers, which translate remote-control buttons into keyboard input.
  timeline:
    - >
      2022: Flirc's official firmware history marks version 4.0.3 as the initial release
      of that firmware line.
    - >
      2023: Firmware 4.1 introduced a new hashing algorithm and expanded Kodi, Shield,
      and Windows Media Center support.
    - '2023: Firmware added infrared transmission, macros, and long-press actions.'
    - >
      2024–2025: Firmware work expanded hardware variants and refined infrared behavior,
      profiles, and configuration reliability.
  usage:
    - >
      Users connect a Flirc receiver, select a controller profile or keyboard layout,
      and pair each remote button with the desired key or action. A bundled command-line
      utility provides the same configuration capabilities for scripting and headless
      use.
    - >
      Mappings are saved on the receiver itself. The desktop software can back up,
      restore, or share that device configuration.
