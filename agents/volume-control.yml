history:
  adoption-history:
    - >
      The application serves Mac users who need per-player volume control, particularly
      when AirPlay or external speakers make system-wide volume keys ineffective. Its
      player support expanded from iTunes and Spotify to Apple Music, Doppler, and
      Swinsian.
    - >
      The project distributes notarized releases, supports both Intel and Apple silicon,
      and is also packaged as a Homebrew cask.
  package-nerd-significance:
    - >
      Volume Control fills a narrow but persistent macOS integration gap by intercepting
      hardware volume-key workflows and controlling individual music applications. Its
      open-source implementation and Homebrew availability make a small menu-bar utility
      reproducibly installable.
  project-history:
    - >
      Volume Control is the successor to Andrea Alberti’s iTunes Volume Control. The
      earlier application began by controlling iTunes from keyboard volume keys and
      Apple Remote, later gaining Spotify support and numerous macOS compatibility
      updates.
    - >
      At version 1.7.0 the application was renamed Volume Control as iTunes gave way to
      Apple Music and support broadened beyond one player. Later releases added native
      Apple-silicon support, Doppler and Swinsian integration, renewed notarization, and
      compatibility with newer macOS releases.
  related-projects:
    - iTunes Volume Control is the discontinued predecessor.
    - >
      Apple Music, Spotify, Doppler, and Swinsian are the music applications controlled
      by current releases.
  sources:
    - https://github.com/alberti42/Volume-Control
    - https://github.com/alberti42/alberti42
    - https://github.com/alberti42/itunes-volume-control
  summary:
    - >
      Volume Control is an open-source macOS menu-bar utility that redirects the
      keyboard volume keys to supported music players while retaining access to
      system-volume control.
  timeline:
    - 'Version 1.0: Initial keyboard control of iTunes volume.'
    - 'Version 1.6.0: Added simultaneous Spotify, iTunes, and system-volume support.'
    - >
      Version 1.7.0: Renamed to Volume Control and updated for Apple Music and Apple
      silicon-era macOS.
    - 'Version 1.7.4: Added Doppler support.'
    - 'Version 2.0.0: Introduced a notarized build for newer macOS releases.'
    - 'Version 2.2.0: Added Swinsian support.'
  usage:
    - >
      After launching the application and granting Accessibility and Automation
      permissions, users press the normal volume keys to change the active supported
      player. Preferences control step size, HUD visibility, login behavior, and
      Command-key inversion between player and system volume.
