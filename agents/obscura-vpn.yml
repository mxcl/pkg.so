history:
  adoption-history:
    - >
      Obscura is distributed as native client software for macOS and other platforms.
      Its macOS download flow creates and funds an account on first launch, while
      Homebrew Cask offers an alternative installation path.
    - >
      The service commissioned Cure53 to audit its macOS application, network extension,
      and protocol; Obscura announced completion of that independent review in December
      2025.
  package-nerd-significance:
    - >
      Obscura is interesting to privacy and networking enthusiasts because its two-party
      relay design separates knowledge of the user's network identity from knowledge of
      the traffic destination.
    - >
      Its Homebrew Cask distribution makes a commercial privacy service fit naturally
      into declarative Mac setup scripts, while its published architecture and audit
      provide unusually concrete material for evaluating a VPN client.
  project-history:
    - >
      Obscura is operated by Sovereign Engineering Inc. Its public legal terms dated
      November 2024 describe a VPN designed so the service cannot access traffic
      contents because traffic remains encrypted to a blind relay.
    - >
      In February 2025, Obscura published a technical explanation of its two-party relay
      and QUIC-based architecture. In December 2025, it announced its first independent
      security audit by Cure53.
  related-projects:
    - WireGuard is supported as an alternative connection method documented by Obscura.
    - QUIC and Obscura's two-party relay design underpin the service's privacy architecture.
  sources:
    - https://obscura.net/OBS-01-report.v3.pdf
    - https://obscura.net/blog/
    - https://obscura.net/download/mac/
    - https://obscura.net/legal/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Obscura VPN is a privacy-focused VPN service and client from Sovereign
      Engineering. Its design uses separate relays so that no single relay has both the
      subscriber's source identity and destination information.
  timeline:
    - >
      2024: Obscura's published privacy policy and terms identified Sovereign
      Engineering as the service operator.
    - '2025: Obscura published its technical account of two-party relays and QUIC.'
    - >
      2025: Cure53 completed Obscura's first independent macOS application,
      network-extension, and protocol audit.
  usage:
    - >
      Install the macOS application directly or with Homebrew Cask, then create and fund
      an account during first launch. Obscura requires macOS 14 Sonoma or later.
    - >
      Use the native client for routine VPN operation; Obscura also publishes a
      WireGuard guide for compatible external clients. No official standalone
      configuration-file or credential-file location for the native macOS client was
      documented.
