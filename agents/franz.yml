history:
  adoption-history:
    - >
      Franz developed into a cross-platform client with a plugin and recipe ecosystem
      for adding web-based communication services. Workspaces, account synchronization,
      teams, paid plans, and many parallel service instances broadened it from a
      personal messenger aggregator into a general communication workspace.
    - >
      Franz 5 was released as an Apache-2.0 open-source application and remains
      represented by the public `meetfranz/franz` repository. Franz 6 arrived in 2026 as
      the product's tenth-anniversary release and expanded the application beyond
      messaging with integrated email, calendars, todos, search, and assistant features.
  package-nerd-significance:
    - >
      Franz helped popularize the Electron pattern of collecting many web messaging
      clients into one installable desktop shell. Its recipe system also inspired or
      paralleled a family of multi-service clients, while its split between open-source
      Franz 5 and the newer product line remains relevant when evaluating packages and
      forks.
  project-history:
    - >
      Franz began with a prototype shipped in 2016 to consolidate services such as
      WhatsApp, Slack, Messenger, and Telegram in one desktop application. The product
      subsequently added more services, multiple accounts, synchronized setups, and
      workspace organization while retaining separate provider-controlled web sessions.
    - >
      The official changelog marks Franz 6.0 in May 2026 as the ten-year release. The
      current product continues to centralize communication services while adding
      broader personal-productivity features.
  related-projects:
    - >
      Franz services are supplied through recipes and embedded provider web
      applications. Related multi-service desktop clients include Ferdium, Beeper,
      Rambox, Shift, and Station; Franz provides official comparison pages for these
      products.
  sources:
    - 'Official Franz 5 repository: https://github.com/meetfranz/franz'
    - 'Official changelog: https://meetfranz.com/changelog'
    - 'Official product history article: https://meetfranz.com/blog/all-in-one-messenger'
    - 'Official support center: https://meetfranz.com/support'
  summary:
    - >
      Franz is a cross-platform desktop application that combines messaging, email,
      collaboration, and other web services into one workspace.
  timeline:
    - '2016: The first Franz prototype launches as an all-in-one messenger.'
    - >
      2017–2025: Franz expands its service integrations, synchronization, workspaces,
      and Franz 5 release line.
    - "2026: Franz 6 launches as the project's tenth-anniversary release."
  usage:
    - >
      Users add services such as WhatsApp, Slack, Telegram, Gmail, Discord, and Signal,
      keep separate accounts in persistent tabs, group services into workspaces, and
      synchronize their Franz setup across devices. Provider logins remain separate web
      sessions controlled by each connected service.
