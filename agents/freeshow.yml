history:
  adoption-history:
    - >
      FreeShow targets churches and other live venues seeking an affordable presentation
      system. Its official repository says it is used worldwide, while cross-platform
      releases and import features help organizations migrate from established
      worship-presentation tools.
  package-nerd-significance:
    - >
      FreeShow is a notable open-source alternative in a category dominated by
      specialized commercial applications. It supplies packaged desktop releases for all
      major operating systems while retaining public source code, issue tracking, and
      documented interchange formats.
  project-history:
    - >
      FreeShow began in late 2021 after its creator found existing presentation programs
      either expensive or difficult to use. The first release followed in February 2022.
    - >
      The project subsequently developed stage displays, remote control, livestreaming,
      media management, scripture tools, and documented JSON-based show and project
      formats. It is maintained in the ChurchApps organization under the GPL.
  related-projects:
    - >
      Its migration and import ecosystem overlaps with presentation tools such as
      OpenLP, ProPresenter, Quelea, EasyWorship, and VideoPsalm.
  sources:
    - https://freeshow.app/docs
    - https://freeshow.app/docs/data
    - https://github.com/ChurchApps/FreeShow
  summary:
    - >
      FreeShow is a free, open-source, cross-platform presentation application for
      displaying lyrics, scripture, media, and slides at churches and live events.
  timeline:
    - '2021: Development of FreeShow began late in the year.'
    - '2022: The first public release appeared in February.'
    - >
      2020s: The project added remote control, stage displays, multiple outputs,
      livestreaming, and structured import and export formats.
  usage:
    - >
      Operators build projects and shows from songs, scripture, text, images, audio, and
      video, then route presentation content to audience, stage, livestream, and
      remote-control outputs.
