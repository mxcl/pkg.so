history:
  adoption-history:
    - >
      ShowyEdge has remained available across many macOS generations, with official
      downloads retained for systems from Snow Leopard through current releases. Its
      long maintenance history serves multilingual users who need a more visible
      input-source cue, including while working in full-screen applications.
  package-nerd-significance:
    - >
      ShowyEdge is a long-lived, narrowly focused open-source macOS utility from
      pqrs.org, the organization associated with keyboard-customization tools such as
      Karabiner-Elements. It illustrates the durable package-manager niche for utilities
      that expose operating-system state more clearly than the stock interface.
  project-history:
    - >
      ShowyEdge's first documented release was version 1.3 in June 2013. It initially
      displayed a color bar representing the active macOS input source and soon added
      custom frames, opacity controls, and multi-display support.
    - >
      The project added modern macOS integration over time, including Dark Mode, Apple
      Silicon support, a complete Swift and SwiftUI rewrite in 2021, application
      sandboxing in 2023, and migration to the SwiftUI application lifecycle in 2025.
  related-projects:
    - Karabiner-Elements
    - Karabiner-EventViewer
  sources:
    - 'Official changelog: https://github.com/pqrs-org/ShowyEdge/blob/main/NEWS.md'
    - 'Official project site: https://showyedge.pqrs.org/'
    - 'Official repository: https://github.com/pqrs-org/ShowyEdge'
  summary:
    - >
      ShowyEdge is an open-source macOS utility that displays a configurable colored bar
      or frame corresponding to the current keyboard input source.
  timeline:
    - '2013: ShowyEdge 1.3 was released.'
    - '2014: Multiple-display support was added.'
    - '2019: Dark Mode and additional indicator layouts were added.'
    - '2020: Apple Silicon support was added.'
    - '2021: The application was rewritten in Swift and SwiftUI.'
    - '2023: ShowyEdge became sandboxed.'
    - '2025: The project adopted the SwiftUI application lifecycle.'
  usage:
    - >
      Users assign indicator colors and positioning to keyboard input sources, making
      the active layout visible at the screen edge even in full-screen applications.
    - >
      The application provides preferences for indicator appearance and startup
      behavior, but its official user documentation does not specify a
      configuration-file path. It has no credential requirement.
