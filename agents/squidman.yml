credentials-file-location: null
history:
  adoption-history:
    - >
      SquidMan was maintained across many generations of Mac OS X and macOS, including
      PowerPC-era releases, Universal binaries, 64-bit-only releases, and eventually
      Apple Silicon support. The supplied package record identifies a Homebrew cask as
      an additional distribution route.
  package-nerd-significance:
    - >
      SquidMan turns the traditionally configuration-heavy Squid proxy into a personal
      Mac application while still exposing the generated Squid template for advanced
      customization. Its long release archive also documents the practical work of
      carrying a Unix network daemon across changing macOS architectures and security
      conventions.
  project-history:
    - >
      Tony Gray developed SquidMan as a graphical installer and controller that adapts
      Squid for use as a personal proxy on macOS. Official release notes document
      releases from 2003 onward and repeated updates to the bundled Squid build,
      installer, preferences, cache handling, and operating-system compatibility.
  related-projects:
    - >
      Squid is the underlying caching proxy installed and managed by SquidMan. SquidMan
      is a frontend and packaging layer rather than an independent proxy implementation.
  sources:
    - 'Official FAQ: https://squidman.net/squidman/faq/index.html'
    - 'Official homepage: https://squidman.net/squidman/'
    - 'Official release notes: https://squidman.net/squidman/releasenotes/index.html'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      SquidMan is a macOS graphical installer and manager for running Squid as a
      personal caching proxy.
  timeline:
    - '2003: Official release notes document SquidMan 1.5 and subsequent 1.x releases.'
    - '2006: Version 1.8 became a Universal binary.'
    - '2010: Version 3.0 added an in-application Squid uninstaller.'
    - '2013: Version 3.5 became 64-bit-only and was code-signed for Gatekeeper.'
    - '2016: Version 3.8 added explicit start, stop, and restart controls.'
    - '2020: Version 4.2 added universal Apple Silicon and Intel support.'
  usage:
    - >
      Users install and control a local Squid instance, cache downloaded content, proxy
      other computers on a subnet, and work around some authenticated-proxy
      compatibility problems. Preferences generate Squid's configuration from an
      editable template, allowing experienced users to customize directives beyond the
      graphical controls.
