history:
  adoption-history:
    - >
      By 2011 SQLiteManager was distributed through the Mac App Store as well as
      directly by SQLabs. It subsequently maintained a shared interface across macOS and
      Windows and offered a multiplatform license.
    - >
      The product broadened beyond ordinary SQLite files to cover cubeSQL and several
      encrypted-database formats, including SQLCipher and SQLite's official encryption
      extensions.
  package-nerd-significance:
    - >
      SQLiteManager packages SQLite inspection, schema editing, queries, import and
      export, recovery-related inspection, and automation into a desktop GUI. Its
      support for encrypted SQLite variants and embedded Lua scripting distinguishes it
      from minimal database browsers.
  project-history:
    - >
      SQLiteManager is SQLabs' proprietary desktop administration application for SQLite
      databases. Official posts document the 3.x line by 2011, while the redesigned 4.0
      generation received its public release in December 2012.
    - >
      Later 4.x releases added Retina and 64-bit support, improved Windows compatibility
      and high-DPI behavior, and expanded encrypted-database support. Version 4.3
      introduced SQLCipher support, and later releases continued updating the bundled
      SQLite and SQLCipher engines.
  related-projects:
    - >
      cubeSQL is SQLabs' SQLite-based client/server database and is supported directly
      by SQLiteManager.
    - SQLiteDoctor is SQLabs' companion SQLite database-recovery product.
    - >
      SQLCipher and SQLite Encryption Extension databases are supported encrypted
      database formats rather than SQLiteManager projects.
  sources:
    - https://sqlabs.com/sqlitemanager
    - https://sqlabs.com/sqlitemanager_encryption
    - https://sqlabs.com/sqlitemanager_version
    - https://www.sqlabs.com/blog/2011/07/sqlitemanager-3-8-0-released/
  summary:
    - >
      SQLiteManager is a proprietary graphical SQLite administration application from
      SQLabs for macOS and Windows.
  timeline:
    - '2011: SQLabs announced SQLiteManager 3.8 and its availability through the Mac App Store.'
    - '2012: SQLiteManager 4.0.0 received its public release.'
    - '2014: Version 4.3 added SQLCipher database support.'
    - '2018: Version 4.8 added 64-bit and improved high-DPI and Windows support.'
    - "2024: Version 4.9.2 added support for SQLite's RETURNING clause."
  usage:
    - >
      Users open local or in-memory SQLite databases, browse and edit records, design
      tables with a live SQL preview, execute and filter queries, inspect BLOBs, and
      import or export data. Lua scripting and plug-ins can automate repetitive
      operations, while charting and printing provide presentation-oriented output.
