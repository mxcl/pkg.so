history:
  adoption-history:
    - >
      libslax adoption is concentrated in the Junos ecosystem. Juniper states that
      standard Junos OS and Junos OS Evolved include the libslax tools, while the
      open-source distribution can be installed on a Unix-like computer for off-box SLAX
      development.
    - >
      The Juniper version table ties libslax versions to Junos releases, including
      libslax 0.14.1 with Junos OS 14.1, libslax 0.17.1 across Junos 14.2 through 17.3,
      libslax 0.22.0 across Junos 17.4 through 25.2, and libslax 3.1.6 for 25.4R1 and
      later.
  package-nerd-significance:
    - >
      libslax is niche, but it is a useful package-manager artifact because it exposes a
      vendor network-automation language as a normal open-source C toolchain. It pulls
      Junos scripting out of appliance firmware and into local development environments.
    - >
      It also represents an unusual branch in XSLT history: rather than replacing XSLT,
      SLAX keeps the transform model and changes the surface syntax so humans can write
      network automation code with less XML noise.
  project-history:
    - >
      Juniper documentation describes SLAX, Stylesheet Language Alternative syntaX, as a
      language for Junos OS commit scripts, op scripts, event scripts, and SNMP scripts.
      It keeps XSLT semantics but replaces XML-heavy syntax with a style closer to C and
      Perl.
    - >
      The libslax distribution overview says SLAX was originally developed as part of
      Junos OS for on-box scripting to customize and enhance the CLI. It also describes
      libslax as an open-source New BSD licensed C implementation built on libxml2,
      libxslt, and libexslt.
  related-projects:
    - >
      libslax is built on libxml2, libxslt, and libexslt. It is closely related to Junos
      OS automation scripting, Juniper's junoscriptorium example repository, and the
      broader XSLT/XML tooling ecosystem.
  sources:
    - https://github.com/Juniper/libslax
    - https://juniper.github.io/libslax/slax-manual.html
    - >
      https://www.juniper.net/documentation/us/en/software/junos/automation-scripting/topics/concept/junos-script-automation-libslax-distribution-overview.html
    - >
      https://www.juniper.net/documentation/us/en/software/junos/automation-scripting/topics/concept/junos-script-automation-slax-overview.html
    - >
      https://www.juniper.net/documentation/us/en/software/junos/automation-scripting/topics/task/junos-script-automation-libslax-distribution-installing.html
  summary:
    - >
      libslax is Juniper's open-source C implementation of SLAX, an alternate syntax for
      XSLT used for Junos automation scripts. It provides the parser, writer, processor,
      debugger, profiler, and libraries behind the `slaxproc` command.
  timeline:
    - "2014: Juniper's version table maps Junos OS 14.1 to libslax 0.14.1 and SLAX 1.1."
    - >
      2017: The libslax Read the Docs build records Juniper Networks copyright for the
      hosted documentation.
    - '2025-08-26: The Juniper/libslax GitHub repository release list records libslax-3.1.6.'
    - >
      25.4R1: Juniper's version table maps Junos OS 25.4R1 and later to libslax 3.1.6
      and SLAX 1.3.
  usage:
    - >
      Network engineers use libslax indirectly through Junos script execution and
      directly through `slaxproc` to validate SLAX syntax, run or debug scripts, format
      files, and convert between SLAX and XSLT. The debugger and profiler make it more
      than a syntax translator.
    - >
      Outside Junos devices, Homebrew's package gives developers a local Unix-like
      environment for writing and testing SLAX scripts before deploying them into Junos
      automation workflows.
