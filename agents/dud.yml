history:
  adoption-history:
    - >
      Dud has modest adoption compared with DVC, but it crossed into package-manager
      visibility through Homebrew and MacPorts. GitHub releases continued through the
      0.4 series in 2024, indicating an active but niche data-tooling project.
  package-nerd-significance:
    - >
      Dud matters as a minimalist counterpoint in the data-versioning package space: it
      packages a DVC-like workflow as a standalone CLI, favors explicit side effects,
      and turns Rclone into the remote transport layer rather than growing its own
      provider matrix.
  project-history:
    - >
      The public release line began in 2021 with v0.0.1. The README frames Dud as
      inspired by DVC but designed around speed, simplicity, explicit commits, and a
      smaller scope rather than the broader machine-learning workflow covered by DVC.
    - >
      Dud's design also delegates remote cache operations to Rclone instead of
      implementing cloud-storage backends itself, which makes the tool an example of a
      focused CLI leaning on a mature adjacent project.
  related-projects:
    - DVC is Dud's clearest conceptual relative and contrast point.
    - >
      Rclone is part of Dud's remote-cache story because Dud uses it for fetch and push
      operations.
    - Make is a related mental model for Dud stages and pipeline commands.
  sources:
    - https://github.com/kevin-hanselman/dud
    - https://kevin-hanselman.github.io/dud/
    - https://kevin-hanselman.github.io/dud/getting_started/
    - https://api.github.com/repos/kevin-hanselman/dud/releases?per_page=100
    - https://formulae.brew.sh/formula/dud
  summary:
    - >
      Dud is a small Go CLI for versioning data beside source code and describing
      reproducible data pipelines. Its package-nerd interest is that it deliberately
      narrows the DVC-style data-versioning idea down to explicit commands,
      symlink-oriented checkouts, and composition with existing Unix tools.
  timeline:
    - '2021: v0.0.1 published as the first GitHub release.'
    - '2022: v0.3.x releases refined the early command set.'
    - '2024: v0.4.5 published, keeping Dud available to Homebrew users.'
  usage:
    - >
      Users initialize Dud in a project, commit large files or directories to a cache,
      store small stage metadata in source control, and fetch or push cached data as
      needed. The tool is aimed at teams that want data reproducibility without
      experiment tracking or automatic cache mutation.
related-packages:
  - id: brew:dvc
    reason: >
      Choose DVC when you want a broader, batteries-included machine-learning workflow
      with experiment and metric management; choose Dud for a smaller tool focused on
      explicit data versioning and reproduction.
    rel: alternative
    sources:
      - https://kevin-hanselman.github.io/dud/#concrete-differences-with-dvc
      - https://dvc.org/doc
  - id: brew:rclone
    reason: >
      Dud invokes rclone for fetch and push operations and exposes a project-specific
      rclone configuration for defining the remote cache.
    rel: adjacent_workflow
    sources:
      - https://kevin-hanselman.github.io/dud/getting_started/
      - https://rclone.org/docs/
