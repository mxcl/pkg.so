id: brew:lazyrsync
display-name: lazyrsync
repo: null
docs:
  - https://github.com/westpoint-io/lazyrsync#readme
  - https://lazyrsync.westpoint.io/
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/lazyrsync/profiles.toml
    - $XDG_CONFIG_HOME/lazyrsync/settings.toml
    - ~/.config/lazyrsync/profiles.toml
    - ~/.config/lazyrsync/settings.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official installation instructions cover Homebrew, crates.io, cargo-binstall,
      and the Arch User Repository. Its profiles can also be invoked headlessly from
      schedulers such as cron.
  package-nerd-significance:
    - >
      lazyrsync packages rsync's extensive option surface into reusable, hand-editable
      TOML profiles while retaining rsync as the transfer engine. Preview diffs and
      confirmation gates make destructive synchronization options easier to audit.
  project-history:
    - >
      West Point Digital created lazyrsync as a Rust terminal interface for rsync,
      emphasizing reusable jobs, structured dry-run previews, live progress,
      cancellation, SSH transfers, and hard-linked snapshots.
  related-projects:
    - >
      lazyrsync requires rsync 3.1 or later for its complete preview and progress
      behavior and uses SSH-style remote paths for remote transfers.
  sources:
    - https://github.com/westpoint-io/lazyrsync
    - https://lazyrsync.westpoint.io/
  summary:
    - >
      lazyrsync is a Rust terminal UI and headless runner for reusable rsync
      synchronization and snapshot tasks.
  timeline:
    - >
      2026: The official documentation describes Homebrew, crates.io, cargo-binstall,
      and AUR distribution.
  usage:
    - >
      Create profiles and source-to-destination tasks in the TUI, preview changes with
      `p`, and run them with `r`. The same profiles work through `lazyrsync list` and
      `lazyrsync run`, allowing verified tasks to be scheduled without the TUI.
related-packages:
  - id: brew:rsync
    reason: >
      Install rsync 3.1 or later as the required transfer engine used for lazyrsync
      previews, progress reporting, synchronization, and snapshots.
    rel: adjacent_workflow
    sources:
      - https://github.com/westpoint-io/lazyrsync#install
      - https://rsync.samba.org/documentation.html
  - id: brew:openssh
    reason: >
      Install OpenSSH for lazyrsync tasks that synchronize to SSH-style remote paths or
      run unattended with key-based authentication.
    rel: adjacent_workflow
    sources:
      - https://github.com/westpoint-io/lazyrsync#readme
      - https://www.openssh.com/manual.html
