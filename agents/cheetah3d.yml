history:
  adoption-history:
    - >
      Cheetah3D developed a community around a comparatively approachable, Mac-native 3D
      workflow. The vendor highlights its user forum, built-in help, books, and video
      tutorials as the product's supporting learning ecosystem.
  package-nerd-significance:
    - >
      Cheetah3D is notable in Mac package collections as a long-running, independently
      developed, Mac-first alternative to larger cross-platform 3D suites. The cask
      turns the vendor's disk-image installation into a reproducible package-manager
      operation.
  project-history:
    - >
      Cheetah3D is developed by Martin Wengenmayer and MW3D-Solutions as a modeling,
      rendering, texturing, and character-animation application built specifically for
      macOS.
    - >
      The official release archive documents continuous development from at least the
      2.x era in 2006 through major revisions adding 64-bit support, physics, Retina
      support, physically based rendering, glTF, Metal, Apple Silicon, USDZ, and
      SceneKit formats.
  related-projects:
    - Apple SceneKit
    - glTF
    - USDZ
  sources:
    - 'Official news and release archive: https://www.cheetah3d.com/news.php'
    - 'Official product page: https://www.cheetah3d.com/'
    - 'Official training page: https://www.cheetah3d.com/training.php'
    - source_facts.package-manager
  summary:
    - >
      Cheetah3D is a commercial 3D modeling, UV mapping, texture-painting, rendering,
      and animation application developed specifically for the Mac.
  timeline:
    - '2006: Cheetah3D 3.0 released.'
    - '2009: Cheetah3D 5.0 released.'
    - '2010: A 64-bit version shipped.'
    - '2012: Cheetah3D 6.0 added Bullet Physics.'
    - '2017: Cheetah3D 7.0 shipped after an early-adopter beta.'
    - '2018: Version 7.3 added glTF and physically based materials.'
    - '2024: Version 8.0 added native Metal and Apple Silicon support.'
    - '2025: Version 8.1.3 improved macOS 15 compatibility.'
  usage:
    - >
      Artists use Cheetah3D for polygon and spline modeling, UV unwrapping, texture
      painting, node-based materials, character animation, and rendering. The
      downloadable demo permits evaluation, but saving documents requires a purchased
      serial number.
