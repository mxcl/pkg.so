history:
  adoption-history:
    - >
      Distributed as inexpensive macOS shareware, Find Any File occupies a long-running
      niche alongside Spotlight: users choose it when they need direct filesystem
      searches, access to normally excluded locations, or reusable searches based on
      detailed file metadata.
    - >
      Its availability as the Homebrew cask `find-any-file` makes the otherwise
      graphical shareware utility reproducible in Brew-managed Mac setups.
  package-nerd-significance:
    - >
      Package enthusiasts value Find Any File as a focused native utility that searches
      filesystem metadata directly rather than depending exclusively on Spotlight's
      index. Its saved searches, expert rules, root mode, and scriptable rules make it
      useful for investigating files that ordinary desktop search overlooks.
  project-history:
    - >
      Thomas Tempelmann released Find Any File 1.0 in December 2008. The official manual
      says its design was inspired by the Classic Mac OS Find File and Sherlock tools,
      themselves influenced by Bill Monk's Find Pro shareware.
    - >
      Version 2.0 arrived in September 2019 as a 64-bit application prepared for macOS
      Catalina, with additional search criteria and JSON-formatted saved searches. Later
      development added Spotlight-assisted results, scripted rules, content searching
      inside archives, and support for modern storage environments.
  related-projects:
    - >
      Apple Spotlight provides indexed search and can supplement Find Any File results,
      while Find Any File's direct filesystem approach covers locations and properties
      Spotlight may omit.
    - >
      The official history connects the design lineage to Classic Mac OS Find File,
      Sherlock, and Find Pro.
  sources:
    - 'Input package mapping: source_facts.package-manager.brew-cask'
    - 'Official detailed release history: https://findanyfile.app/versionhistory.php'
    - 'Official manual and version history: https://findanyfile.app/manual.php'
  summary:
    - >
      Find Any File is a macOS file-search utility by Thomas Tempelmann. It searches
      filesystem metadata directly, can include locations normally omitted by Spotlight,
      and supports saved searches, expert criteria, root-mode searching, and scriptable
      rules.
  timeline:
    - '2008: Find Any File 1.0 was released.'
    - '2019: Version 2.0 completed the transition to a 64-bit Catalina-ready application.'
    - '2023: Version 2.4 introduced scriptable search rules.'
  usage:
    - >
      Users construct searches from properties such as name, dates, size, kind, path,
      UTI, ownership, or content, then inspect results in flat, hierarchical, or
      icon-oriented views.
    - >
      Search definitions can be saved as `.faf` documents or made the default search.
      Advanced users can expose expert rules, search protected areas using root mode,
      and combine direct filesystem results with Spotlight results.
