history:
  adoption-history:
    - >
      The project documents usage by large Go projects and infrastructure stacks,
      including Kubernetes, Moby, etcd, HashiCorp Vault, Pulumi, Grafana Loki, Telegraf,
      and containerd. That list reflects the tool's appeal in repositories where raw go
      test output is too noisy but replacing the Go test runner would be undesirable.
  package-nerd-significance:
    - >
      gotestsum matters to package nerds because it is a canonical example of a CLI that
      wraps a standard tool without hiding it. It takes Go's structured test event
      stream seriously, turns it into useful terminal UX, and exports formats that CI
      servers already know how to consume.
  project-history:
    - >
      The gotestyourself/gotestsum repository was created in March 2018, and its first
      GitHub release, v0.1, was published in May 2018. The project grew around Go's
      test2json stream, adding output formats, summaries, JUnit XML, JSON log capture,
      rerun support for failed tests, watch mode, and tooling for finding slow tests.
    - >
      The README presents gotestsum as a test runner designed for both local development
      and CI automation. Its release notes show sustained maintenance after the 1.0 era,
      including support for additional output options, file-watching improvements,
      flaky-test reruns, CI report controls, and platform fixes.
  related-projects:
    - go test -json and cmd/test2json provide the event format gotestsum consumes.
    - JUnit XML consumers in CI systems are a major target for gotestsum's report output.
    - gotest.tools is the broader module namespace associated with gotestsum.
  sources:
    - https://formulae.brew.sh/formula/gotestsum
    - https://github.com/gotestyourself/gotestsum
    - https://github.com/gotestyourself/gotestsum#readme
    - https://github.com/gotestyourself/gotestsum/releases
  summary:
    - >
      gotestsum is a wrapper around go test -json that formats Go test output for humans
      while preserving machine-readable data for CI systems. It sits between the
      standard Go test runner and developer-facing or automation-facing reporting needs.
  timeline:
    - '2018: Repository created.'
    - '2018: v0.1 release published.'
    - '2023: v1.10.0 and v1.11.0 releases continued the 1.x line.'
    - '2024: v1.12.0 added work including file-watcher and output-format improvements.'
    - '2025: v1.13.0 release included watch-clear support and Go test attribute handling.'
  usage:
    - >
      A common invocation is to run gotestsum in place of go test, pass Go test flags
      after --, and choose a display format such as pkgname, dots, testname, testdox, or
      standard-compatible modes. In CI, users often add --junitfile for test-report
      ingestion and --jsonfile to retain the original test2json stream for later
      analysis.
    - >
      For local loops, gotestsum offers --watch to rerun tests after Go files change,
      --post-run-command for notifications or follow-up scripts, and gotestsum tool
      slowest for identifying expensive tests. Its design keeps go test semantics close
      while making the output easier to scan.
related-packages:
  - id: brew:gotests
    reason: >
      Use gotests before gotestsum when functions need editable table-driven test
      scaffolding generated first; gotestsum can then execute and report on those
      ordinary Go tests.
    rel: adjacent_workflow
    sources:
      - https://github.com/cweill/gotests#readme
      - https://github.com/gotestyourself/gotestsum#readme
