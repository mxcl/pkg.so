history:
  adoption-history:
    - >
      Official releases provide Windows and Linux executables, while source builds use
      Rust and Cargo. The supplied package-manager facts show distribution through
      Homebrew as `alass` and Scoop as `main/alass`.
    - >
      The tool's adoption sits in the media-maintenance niche: users with mismatched
      subtitle files, different cuts, advertisement breaks, or framerate drift can run a
      local binary instead of manually editing subtitle timestamps.
  package-nerd-significance:
    - >
      alass is a neat package-manager specimen because it wraps a specialized media
      algorithm into a normal CLI install. The package saves users from compiling a Rust
      workspace and C voice-activity component just to fix one badly timed subtitle
      file.
    - >
      It also shows the recurring package-manager pattern where the executable name
      differs from the crate/workspace internals: Homebrew users get `alass-cli`, while
      the human-facing project name remains simply `alass`.
  project-history:
    - >
      The public GitHub repository was created in February 2017. The README ties the
      algorithmic basis to the author's bachelor's thesis and presentation, and notes
      that the program was previously called `aligner` before being renamed to `alass`
      because the old name was hard to find in search engines.
    - >
      The workspace is split into `alass-core`, the reusable algorithm library, and
      `alass-cli`, the official command-line tool for end users. That split lets
      downstream code reuse the synchronization algorithm while package managers expose
      the practical CLI.
  related-projects:
    - 'alass-core: reusable library crate containing the synchronization algorithm.'
    - 'alass-cli: official command-line tool for end users.'
    - 'FFmpeg and ffprobe: external tools used by alass to extract audio from video references.'
  sources:
    - https://api.github.com/repos/kaegi/alass
    - https://github.com/kaegi/alass
    - input source_facts.package-manager
  summary:
    - >
      alass is a Rust command-line tool for Automatic Language-Agnostic Subtitle
      Synchronization. It aligns subtitle timing to a movie or to another subtitle file,
      correcting offsets, splits, and framerate differences without depending on the
      spoken language.
  timeline:
    - '2017: Public GitHub repository created.'
    - >
      Initial project period: README documents the bachelor's thesis and presentation
      behind the algorithm.
    - 'Later: Project renamed from `aligner` to `alass` for searchability.'
    - '2023: Repository metadata shows continued activity into late 2023.'
  usage:
    - >
      Basic use is `alass movie.mp4 incorrect_subtitle.srt output.srt`, or using a
      reference subtitle instead of a video file. For video references, `ffmpeg` and
      `ffprobe` are used to extract audio, with paths overridable through
      `ALASS_FFMPEG_PATH` and `ALASS_FFPROBE_PATH`.
    - >
      The README documents tuning with `--split-penalty` and a faster `--no-splits` mode
      when only a constant shift is desired. Supported subtitle formats include `.srt`,
      `.ssa`, `.ass`, and `.idx`, while common video formats are supported through
      FFmpeg.
related-packages:
  - id: brew:ffmpeg
    reason: >
      FFmpeg supplies the `ffmpeg` and `ffprobe` commands that alass uses to extract
      audio from video reference files before synchronization.
    rel: adjacent_workflow
    sources:
      - https://github.com/kaegi/alass
      - https://ffmpeg.org/documentation.html
