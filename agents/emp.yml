history:
  adoption-history:
    - >
      The README says Empire targeted small to medium startups running many
      microservices and needing more flexibility than Heroku. Its community surface
      included Read the Docs documentation, a Google group, and Slack, but the project
      remains tied closely to the Remind engineering context.
  package-nerd-significance:
    - >
      For package nerds, `emp` captures a particular mid-2010s deployment moment: Heroku
      workflows, Docker images, ECS services, internal ELBs, and Route53 service
      discovery wrapped in a small CLI install.
  project-history:
    - >
      Empire was created as a control layer on top of Amazon EC2 Container Service,
      exposing a subset of the Heroku Platform API so teams could keep Heroku-style
      workflows while running containerized services on AWS infrastructure.
  related-projects:
    - >
      Empire explicitly relates to Amazon ECS, Docker, the Heroku Platform API, Heroku's
      `hk` CLI, and Remind's earlier `tugboat` work.
  sources:
    - https://github.com/remind101/empire
    - https://empire.readthedocs.org/
  summary:
    - >
      `emp` is the command-line client for Empire, Remind's Heroku-like platform layer
      for deploying Docker applications onto Amazon ECS.
  usage:
    - >
      The `emp` CLI is documented as a fork of Heroku's `hk` command with
      Empire-specific features. A typical package-manager user installed `emp` to deploy
      tagged Docker images, scale Procfile process types, manage domains, and interact
      with an Empire API server from a terminal.
related-packages:
  - id: brew:docker
    reason: >
      Empire deploys tagged Docker images, so the Docker CLI is the practical companion
      for building, tagging, testing, and publishing the application artifacts consumed
      by `emp`.
    rel: adjacent_workflow
    sources:
      - https://github.com/remind101/empire#readme
      - https://docs.docker.com/reference/cli/docker/
