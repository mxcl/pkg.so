history:
  adoption-history:
    - >
      DetectX Swift was initially offered under different home and organizational
      licensing terms. On June 20, 2020, Sqwarq removed the registration requirement
      from version 1.x, including for commercial use.
    - >
      Sqwarq provides deployment material for Mac administrators, including profile
      manifests, TCC and update-control profiles, Munki guidance, Jamf Pro integration,
      and command-line use.
  package-nerd-significance:
    - >
      DetectX Swift occupies a distinctive niche between a conventional antivirus
      product and a general system profiler. It emphasizes fast, on-demand inspection,
      change history, administrator deployment, and user-reviewed remediation without
      persistent kernel extensions or privileged helper daemons.
  project-history:
    - >
      DetectX Swift was developed by Sqwarq as a lightweight macOS troubleshooting and
      threat-finding tool. Its guide and tutorial material were publicly available by
      2017, documenting search, profiling, history, whitelisting, and removal workflows.
    - >
      The product's design favors on-demand heuristics and system-state inspection over
      continuous background scanning. Sqwarq also publishes signing and checksum
      information so administrators can verify official builds.
  related-projects:
    - >
      DetectX is the related earlier Sqwarq product. Other Sqwarq administration and
      troubleshooting tools include FastTasks 2, App Fixer, Boot Buddy, and Critical
      Updates.
  sources:
    - https://sqwarq.com/detectx/
    - https://sqwarq.com/detectx/is-it-any-good/
    - https://sqwarq.com/product-security/
    - https://sqwarq.com/sqwarq.com/AppCasts/DetectX_Swift_User_Guide.pdf
  summary:
    - >
      DetectX Swift is Sqwarq's lightweight, on-demand macOS security and
      troubleshooting application. It searches for malware, adware, keyloggers,
      potentially unwanted software, and destabilizing system items while also profiling
      and recording changes to the Mac.
  timeline:
    - '2017: Public user-guide and tutorial material documented DetectX Swift'
    - >
      2020-06-20: Registration requirement removed from DetectX Swift 1.x, including
      commercial use
  usage:
    - >
      A normal launch runs Search and Profile operations. Users can inspect findings,
      whitelist acceptable items, review changes recorded by the History feature, and
      explicitly approve removals.
    - >
      Administrators can use command-line and management-platform integrations for
      scheduled scanning and managed deployment. The product does not automatically
      delete findings and does not install persistent kernel extensions or privileged
      helper daemons.
