history:
  adoption-history:
    - >
      The project is distributed through release binaries, Linux package formats, a
      container image, Go installation, and several operating-system package managers,
      making it a common lightweight hardening check in developer and security
      workflows.
  package-nerd-significance:
    - >
      checksec packages a broad set of binary-hardening checks into one small CLI. It is
      useful after compilation or packaging to verify that toolchain and linker
      hardening flags survived into the shipped artifact.
  project-history:
    - >
      The original checksec was written by Tobias Klein as a Bash script in 2011. The
      maintained project is a modern Go rewrite distributed as a single static binary
      while retaining the familiar checksec purpose and name.
  related-projects:
    - >
      The project is closely associated with ELF tooling, Linux kernel hardening,
      compiler and linker mitigations, and CI systems that consume its structured
      reports.
  sources:
    - https://github.com/slimm609/checksec
    - https://slimm609.github.io/checksec/
    - https://slimm609.github.io/checksec/checks/binary/
    - https://slimm609.github.io/checksec/checks/process/
  summary:
    - >
      checksec is a command-line auditor for security properties of ELF executables,
      running processes, and Linux kernels. It reports mitigations and hardening
      features such as RELRO, stack canaries, NX, PIE, CFI, FORTIFY_SOURCE, and seccomp.
  timeline:
    - '2011: Tobias Klein wrote the original Bash implementation.'
    - '2014: The current official GitHub repository was created.'
    - >
      2026: The Go-based 3.x series was distributed as static binaries, native packages,
      containers, and source builds.
  usage:
    - >
      Typical commands inspect one file, recursively scan a directory, audit a process
      by PID, or examine the running Linux kernel. Machine-readable CSV, JSON, XML, and
      YAML output makes it suitable for scripts and CI policy checks.
