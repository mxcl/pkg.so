history:
  adoption-history:
    - >
      AutoCorrect's adoption is strongest in Chinese-language and CJK
      publishing/developer communities, where mixed Latin and CJK text needs consistent
      spacing and punctuation. The README names scenarios such as books, documentation,
      media publishing, project source code, static-site generators, CI checks and
      editor plugins.
    - >
      The package facts show distribution through Homebrew, Nix, Scoop and winget, while
      the README advertises release channels and bindings for Docker, crates.io, npm,
      PyPI, RubyGems and Maven Central.
  package-nerd-significance:
    - >
      AutoCorrect is package-interesting because it packages language-specific editorial
      rules as a fast native CLI but also exports the engine across several language
      ecosystems. It sits between a formatter, a prose linter and a
      documentation-quality gate.
    - >
      For Homebrew users, it is one of the less common examples of a text formatter
      where the primary domain is multilingual typography rather than
      programming-language syntax.
  project-history:
    - >
      The current GitHub repository was created on 2020-05-26, but the README says the
      underlying scheme first appeared in 2013 in the Ruby China project and was refined
      over time. The project later became a cross-platform Rust CLI with SDK bindings.
    - >
      The README positions AutoCorrect alongside tools such as ESLint, RuboCop and
      gofmt: it can lint, print diffs, format files and integrate with CI. GitHub
      releases show an active 2.x series through v2.16.3, published on 2026-01-03.
  related-projects:
    - The README compares AutoCorrect's workflow to ESLint, RuboCop and gofmt.
    - >
      Related integrations include autocorrect-lsp, VS Code, IntelliJ Platform, Zed,
      GitHub Action, GitLab CI and Reviewdog.
  sources:
    - https://api.github.com/repos/huacnlee/autocorrect
    - https://api.github.com/repos/huacnlee/autocorrect/releases
    - https://github.com/huacnlee/autocorrect#readme
  summary:
    - >
      AutoCorrect is a Rust-based linter and formatter for CJK and English mixed text,
      aimed at standardizing spacing, punctuation and copywriting in documents, source
      comments and publishing workflows.
  timeline:
    - '2013: The README says the original scheme appeared in Ruby China.'
    - '2020: Current GitHub repository is created on 2020-05-26.'
    - '2023: v2.9.0 is published in the 2.x release line.'
    - '2026: v2.16.3 is published on 2026-01-03.'
  usage:
    - >
      Typical CLI usage is direct formatting or linting: autocorrect text.txt, echo text
      piped to autocorrect --stdin, autocorrect --fix, or autocorrect --lint with
      colored diff or JSON output.
    - >
      Configuration is created with autocorrect init, which writes .autocorrectrc. The
      README says the config can use YAML or JSON and controls rules such as CJK/English
      spacing, punctuation width, spelling, code-block behavior and custom vocabulary.
