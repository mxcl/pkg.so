id: brew:container2wasm
display-name: container2wasm
repo: null
docs:
  - https://github.com/container2wasm/container2wasm#readme
  - https://ktock.github.io/container2wasm-demo
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official sources present demos and examples rather than an adopter list. The
      project is best understood as experimental tooling for developers exploring how
      existing container images can be repackaged for WebAssembly and browser-hosted
      environments.
  package-nerd-significance:
    - >
      The package is interesting because it treats a container image as an input
      artifact rather than as something only a container runtime can execute. For
      package-manager users, it exposes a command-line bridge between OCI-style image
      distribution, WASI runtimes, and browser demos.
  project-history:
    - >
      Official releases began with v0.1.0 in February 2023. The README describes support
      for emulation through Bochs, TinyEMU, and QEMU, along with WASI runtimes such as
      wasmtime, wamr, wasmer, wasmedge, and wazero.
  related-projects:
    - >
      The README names WASI runtimes including wasmtime, wamr, wasmer, wasmedge, and
      wazero, and describes emulation through Bochs, TinyEMU, and QEMU.
  sources:
    - https://github.com/container2wasm/container2wasm#readme
    - https://ktock.github.io/container2wasm-demo
    - https://github.com/container2wasm/container2wasm/releases/tag/v0.1.0
    - https://github.com/container2wasm/container2wasm/releases/tag/v0.8.4
  summary:
    - >
      container2wasm is an experimental converter that turns container images into
      WebAssembly artifacts runnable on WASI runtimes or in browsers. It occupies a
      niche where container packaging meets WebAssembly portability experiments.
  timeline:
    - '2023: v0.1.0 release published.'
    - '2025: v0.8.0 release published.'
    - '2026: v0.8.4 release published.'
  usage:
    - >
      The main `c2w` command converts a container image such as `ubuntu:22.04` into an
      output `.wasm` file. The companion `c2w-net` command supports networking
      experiments for converted WASM images, including browser and WebSocket delegation
      modes.
related-packages:
  - id: brew:wasmtime
    reason: >
      Use Wasmtime to execute and test the WASI images produced by container2wasm;
      upstream uses it in its primary command examples.
    rel: adjacent_workflow
    sources:
      - https://github.com/container2wasm/container2wasm#container-image-to-wasm-wasi
      - https://github.com/bytecodealliance/wasmtime
  - id: brew:docker
    reason: >
      Use the Docker CLI with Buildx/BuildKit to supply the image-building functionality
      required by container2wasm's conversion workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/container2wasm/container2wasm#getting-started
      - https://docs.docker.com/build/buildx/
