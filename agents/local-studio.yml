config-file-location:
  unix:
    - <installation>/.env.local
credentials-file-location: null
history:
  adoption-history:
    - >
      Official materials position Local Studio within the growing local-AI workstation
      category: software that unifies model acquisition, hardware-aware runtimes,
      OpenAI-compatible serving, monitoring, and agent tools instead of requiring users
      to assemble those components independently.
  package-nerd-significance:
    - >
      Local Studio is notable to package users because it brings several normally
      separate local-AI layers into one install: model management, backend runtime
      selection, an OpenAI-compatible controller, usage monitoring, a web and Electron
      interface, and coding-agent tools.
  project-history:
    - >
      Local Studio is developed by Sybil Solutions as a local-first workstation for
      running and managing language models. Its documented architecture combines a
      Bun/Hono controller with a Next.js and React frontend and an Electron desktop
      shell.
  related-projects:
    - vLLM and SGLang are supported CUDA-oriented serving backends.
    - llama.cpp supplies broad GGUF and CPU-oriented inference support.
    - MLX is the documented default backend for Apple Silicon.
    - Hugging Face is used as a model-discovery and acquisition ecosystem.
  sources:
    - https://localstudio.ai/
    - https://localstudio.ai/agents
    - https://localstudio.ai/docs
    - source_facts.repo
  summary:
    - >
      Local Studio is an open-source, local-first AI workstation that manages language
      models, inference runtimes, controllers, OpenAI-compatible serving, and agent
      workflows from a unified desktop and web interface.
  timeline:
    - >
      The official materials document the current desktop, web, controller,
      model-serving, and agent architecture but do not provide a dated origin timeline.
  usage:
    - >
      Users select a model directory, install or discover a suitable inference backend,
      download and benchmark a model, and expose it through the local controller's
      OpenAI-compatible API. The workbench also combines providers, browser access,
      files, terminal tools, and coding-agent sessions.
    - >
      Apple Silicon installations normally use MLX, NVIDIA Linux systems can use vLLM or
      SGLang, and CPU or GGUF-oriented installations can use llama.cpp. Remote
      controllers and upstream OpenAI-compatible providers can also be registered.
