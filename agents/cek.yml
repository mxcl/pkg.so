id: brew:cek
display-name: cek
repo: null
docs:
  - https://github.com/bschaatsbergen/cek#readme
config-file-location: null
credentials-file-location:
  unix:
    - ~/.docker/config.json
history:
  adoption-history:
    - >
      The project is young but has a clear package-manager path through Homebrew and Go
      installation. The official repository metadata showed more than 300 stars and its
      first listed GitHub release, v0.2.0, was published on May 16, 2026.
  package-nerd-significance:
    - >
      cek is useful to package and container maintainers because it inspects image
      contents, layers, tags, and metadata without launching a container, which fits CI,
      registry triage, air-gapped transfer, and image-diff workflows.
  project-history:
    - >
      The official repository was created on December 27, 2025. The README positions cek
      as a command-line utility for browsing files, reading contents, inspecting layer
      mechanics, listing tags, exporting images, and showing image metadata.
  related-projects:
    - Docker, Podman, and containerd are supported local daemon sources named in the README.
    - OCI image registries are the remote source for image pulls and tag listing.
  sources:
    - https://api.github.com/repos/bschaatsbergen/cek
    - https://api.github.com/repos/bschaatsbergen/cek/releases
    - https://github.com/bschaatsbergen/cek#readme
  summary:
    - >
      cek, the container exploration kit, is a Go CLI for inspecting OCI container image
      filesystems and layers without running containers.
  timeline:
    - '2025: The official GitHub repository was created.'
    - '2026: v0.2.0 was published on GitHub Releases.'
    - '2026: The official repository metadata recorded active development into July.'
  usage:
    - >
      Users run commands such as `cek ls`, `cek cat`, `cek tags`, `cek export`, `cek
      tree`, and `cek inspect` against OCI image references. The tool can use local
      container daemon sockets through `DOCKER_HOST` or pull from remote registries.
related-packages:
  - id: brew:dive
    reason: >
      Choose dive when you want an interactive terminal interface focused on layer
      changes and wasted space; choose cek for scriptable file browsing, extraction,
      comparison, and registry operations.
    rel: alternative
    sources:
      - https://github.com/bschaatsbergen/cek#readme
      - https://github.com/wagoodman/dive#readme
  - id: brew:skopeo
    reason: >
      Skopeo complements cek by copying, synchronizing, signing, and deleting registry
      images, while cek examines their filesystems and layer contents.
    rel: adjacent_workflow
    sources:
      - https://github.com/bschaatsbergen/cek#readme
      - https://github.com/containers/skopeo#readme
