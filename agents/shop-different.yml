history:
  adoption-history:
    - >
      Michael Steeber released the experience as a free download for Apple-silicon and
      recent Intel Macs. Its Homebrew Cask entry made the otherwise standalone
      application available through package-managed Mac setups.
  package-nerd-significance:
    - >
      The cask is unusual packaging material: rather than a conventional utility, it
      installs a large, self-contained piece of interactive computing and retail
      history. Its Unity-based environments preserve period Apple hardware, software
      packaging, store layouts, and interface details.
  project-history:
    - >
      Michael Steeber spent roughly seven months researching, modeling, and building The
      Apple Store Time Machine before announcing it in July 2022. Robert Steeber
      supplied its music and interface sounds.
    - >
      The original release recreated four Apple Stores as they appeared on notable
      opening days: Tysons Corner in 2001, Stanford Shopping Center in 2004, Fifth
      Avenue in 2006, and Infinite Loop in 2015. Michael Steeber's development account
      says the stores were modeled in Blender and assembled into a real-time Mac
      experience with Unity.
  related-projects:
    - Michael Steeber's Tabletops newsletter
    - Apple Store Glossary
    - Blender
    - Unity
    - Homebrew Cask
  sources:
    - https://michaelsteeber.com/timemachine/
    - https://michaelsteeber.substack.com/p/tabletops-behind-the-scenes-1291586
    - https://michaelsteeber.substack.com/p/tabletops-the-apple-store-time-machine-1271930
    - source_facts.package-manager.brew-cask
  summary:
    - >
      The Apple Store Time Machine is a free interactive macOS recreation of four
      historically significant Apple Retail Stores on their opening days.
  timeline:
    - >
      2022: Michael Steeber began the approximately seven-month research and development
      effort.
    - '2022-07-25: The Apple Store Time Machine was publicly announced and released.'
    - >
      2022-08-08: Steeber published an official behind-the-scenes account of its Blender
      and Unity production workflow.
  usage:
    - >
      Users download and launch the Mac application, select one of four reconstructed
      stores, and explore products, fixtures, media, and period-specific details in a
      navigable 3D environment. No account or credentials are described by the official
      project page.
