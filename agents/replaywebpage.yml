history:
  adoption-history:
    - >
      ReplayWeb.page superseded the discontinued Webrecorder Player desktop application
      in 2020, bringing faster replay, searchable cached collections, WACZ support, and
      full-text search.
    - >
      It is delivered as a browser application, embeddable web component, npm package,
      and Electron desktop application. The macOS desktop build is also distributed
      through the Homebrew cask `replaywebpage`.
  package-nerd-significance:
    - >
      ReplayWeb.page makes WARC and WACZ collections usable without deploying a
      traditional replay server. Its client-side architecture is particularly valuable
      for static hosting, portable archives, and reproducible digital-preservation
      workflows.
    - >
      It connects several packaging ecosystems: GitHub desktop releases, an npm module
      for embedding, static assets for self-hosting, and a Homebrew cask for macOS
      installation.
  project-history:
    - >
      Webrecorder developed ReplayWeb.page as an open-source, serverless viewer for web
      archives. Its frontend and service-worker-based replay backend run in the browser
      rather than depending on a central archive server.
    - >
      In September 2020, Webrecorder discontinued Webrecorder Player in favor of the
      ReplayWeb.page desktop application. The newer project added support for the WACZ
      format alongside WARC and other archive formats.
  related-projects:
    - Webrecorder Player
    - ArchiveWeb.page
    - Browsertrix
    - wabac.js
    - py-wacz
  sources:
    - https://github.com/webrecorder/replayweb.page
    - https://github.com/webrecorder/webrecorder-player/issues/106
    - https://replayweb.page/docs/
    - https://replayweb.page/docs/embedding/
    - https://replayweb.page/docs/user-guide/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      ReplayWeb.page is Webrecorder's open-source viewer for replaying WARC, WACZ, HAR,
      and related web-archive material directly in a modern browser or desktop
      application.
  timeline:
    - '2020: ReplayWeb.page superseded the discontinued Webrecorder Player application.'
    - >
      2026: The project continued publishing desktop releases and developing its 2.5
      release series.
  usage:
    - >
      Users can open local archive files or load remotely hosted archives. WACZ is
      preferred for efficient on-demand loading, while WARC files must initially be read
      to construct an index.
    - >
      Developers can embed the `<replay-web-page>` component in another site or
      self-host its frontend and service-worker assets. Production embeds should pin a
      package version.
