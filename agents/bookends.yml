history:
  adoption-history:
    - >
      Bookends has accumulated at least fifteen major versions and supports interchange
      with EndNote, Papers, Sente, Zotero, and Mendeley. Its integrations with Word,
      Mellel, Nisus Writer Pro, Scrivener, DEVONthink, and AppleScript place it within
      long-running macOS academic-writing workflows.
  package-nerd-significance:
    - >
      Bookends represents the durable commercial, Mac-native branch of
      reference-management software. The Homebrew cask offers a convenient installation
      route for an application that otherwise uses a direct-download and
      registration-code model.
  project-history:
    - >
      Sonny Software has developed Bookends across many major releases as a
      macOS-focused reference manager, PDF organizer, citation formatter, and
      bibliography generator. Current releases combine native citation formats with CSL
      support, cloud synchronization, document integration, and local Apple Intelligence
      features where supported.
  related-projects:
    - >
      Comparable or interoperable reference managers include EndNote, Zotero, Mendeley,
      Papers, and Sente. Bookends also has especially close writing-workflow
      integrations with Mellel and Microsoft Word.
  sources:
    - 'Official product page: https://www.sonnysoftware.com/bookends-for-mac'
    - 'Official user guides: https://www.sonnysoftware.com/support/user-guides'
    - 'Official version history: https://www.sonnysoftware.com/support/version-history'
  summary:
    - >
      Bookends is a long-running commercial reference-management and bibliography
      application from Sonny Software, designed specifically for macOS and accompanied
      by Bookends for iOS.
  timeline:
    - '2024: Bookends 15 releases added and refined contemporary macOS workflows'
    - '2025: Version 15 added local Apple Intelligence-assisted metadata extraction features'
    - '2026: Version 15.4.2 introduced an MCP server for compatible AI assistants'
  usage:
    - >
      Researchers use Bookends to collect publication metadata and PDFs, organize and
      annotate libraries, insert temporary citations while writing, and generate
      formatted citations and bibliographies. Its own cloud-sync mechanism is
      recommended instead of placing live library databases in generic file-sync
      folders.
