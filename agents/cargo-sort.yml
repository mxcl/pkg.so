credentials-file-location: null
history:
  adoption-history:
    - >
      GitHub records the repository as created in June 2019, while crates.io records the
      cargo-sort crate as first published in May 2021. The input package facts list it
      in Homebrew, Alpine, Nix, and Arch packaging.
  package-nerd-significance:
    - >
      cargo-sort matters to package maintainers because it turns Cargo.toml dependency
      ordering into a repeatable check, useful for CI and pre-commit workflows where
      noisy dependency diffs are annoying.
  project-history:
    - >
      The project README says cargo-sort was created as an implementation of David
      Tolnay's request-for-implementation issue for alphabetically sorting Cargo.toml
      dependencies, and that it uses toml-edit to parse TOML.
  related-projects:
    - >
      The README credits toml-edit as the TOML parser and links the original
      request-for-implementation issue.
  sources:
    - https://api.github.com/repos/DevinR528/cargo-sort
    - https://github.com/DevinR528/cargo-sort
    - https://github.com/DevinR528/cargo-sort#readme
    - https://crates.io/api/v1/crates/cargo-sort
    - https://formulae.brew.sh/api/formula/cargo-sort.json
  summary:
    - >
      cargo-sort is a Rust Cargo subcommand for checking and sorting Cargo.toml
      dependency tables and related TOML tables.
  timeline:
    - '2019: GitHub repository created.'
    - '2021: First crates.io release recorded.'
    - '2026: crates.io records max_version 2.1.4.'
  usage:
    - >
      The official README documents `cargo sort` as a cargo subcommand with default
      rewrite, check-only, print, workspace, custom table-order, grouped sorting, and
      `--config` modes.
