id: brew:mysql-client
display-name: MySQL Client
repo: https://github.com/mysql/mysql-server
docs:
  - https://dev.mysql.com/doc
  - https://dev.mysql.com/doc/refman/en
  - https://dev.mysql.com/doc/refman/en/option-files.html
config-file-location:
  unix:
    - ~/.my.cnf
credentials-file-location:
  unix:
    - ~/.my.cnf
history:
  project-history:
    - >
      The `mysql-client` package-manager niche is deliberately narrower than a full
      database server package. It installs command-line client and utility programs for
      connecting to, inspecting, administering, dumping, importing, testing, and
      troubleshooting MySQL servers. Oracle's manual groups these under client programs
      such as `mysql`, `mysqladmin`, `mysqlcheck`, `mysqldump`, `mysqlimport`,
      `mysqlshow`, and `mysqlslap`, plus supporting utilities such as `mysqlbinlog`. The
      `mysql` program is an interactive and noninteractive SQL shell; `mysqldump`
      performs logical backups by emitting SQL or delimited formats; `mysqlbinlog` reads
      binary logs locally or from a remote server.
  sources:
    - https://blogs.oracle.com/mysql/mysql-retrospective-the-early-years
    - https://dev.mysql.com/doc/refman/8.0/en/mysqldump.html
    - https://dev.mysql.com/doc/refman/8.4/en/mysql.html
    - https://dev.mysql.com/doc/refman/9.1/en/programs-client.html
    - https://dev.mysql.com/doc/refman/9.7/en/mysqlbinlog.html
    - https://formulae.brew.sh/formula/mysql-client
    - https://www.oracle.com/corporate/pressrelease/oracle-buys-sun-042009.html
  summary:
    - >
      MySQL began in 1995 with Allan Larsson, David Axmark, and Michael "Monty"
      Widenius, with the first version released in May 1995. Oracle's retrospective
      traces early milestones that shaped the client/server toolchain: an external
      release in 1996, Linux binaries later that year, PHP drivers in 1997, Windows
      support in 1998, MyISAM in 1999, and a move to the GNU GPL during the MySQL 3.23
      beta period in 2000. Sun agreed to acquire MySQL AB in 2008, and Oracle later
      acquired Sun, placing MySQL under Oracle stewardship.
  usage:
    - >
      In practice, developers and DBAs install `mysql-client` on application hosts, CI
      runners, admin workstations, and migration machines that need to talk to a MySQL
      server without running one locally. It fills the same operational role as
      distribution packages named `mysql-client`, `mariadb-client`, or platform MySQL
      installers: a small CLI toolbox for SQL sessions, schema inspection, backups,
      imports, and scripted administration.
related-packages:
  - id: brew:mycli
    reason: >
      Choose mycli for interactive querying with contextual completion, syntax
      highlighting, and richer history; retain MySQL Client when you also need canonical
      administration, dump, import, and binary-log utilities.
    rel: alternative
    sources:
      - https://www.mycli.net/
      - https://dev.mysql.com/doc/refman/8.4/en/mysql.html
      - https://dev.mysql.com/doc/refman/8.4/en/programs-overview.html
  - id: brew:mydumper
    reason: >
      Use MyDumper alongside the standard clients when a large logical backup or restore
      needs parallel workers, chunking, streaming, or selective migration features
      beyond mysqldump.
    rel: adjacent_workflow
    sources:
      - https://mydumper.github.io/mydumper/docs/html/
      - https://dev.mysql.com/doc/refman/8.4/en/mysqldump.html
