history:
  project-history:
    - >
      Its technical emphasis is speed and CI-friendly output. The documentation lists
      support for browser-like link discovery across tags such as `a`, `img`, `link`,
      and `script`, along with text, JSON, and JUnit XML output. That places Muffet in
      the same operational niche as broken-link checkers used by documentation sites,
      static-site projects, and release pipelines: run it against a base URL, fail or
      inspect output when broken references appear, and integrate the result into GitHub
      Actions, Docker, or other automation.
  sources:
    - https://api.github.com/repos/raviqqe/muffet
    - https://formulae.brew.sh/formula/muffet
    - https://github.com/raviqqe/muffet
    - https://pkg.go.dev/github.com/raviqqe/muffet
    - https://raviqqe.com/muffet/
  summary:
    - >
      Muffet is a website link checker written in Go by raviqqe. The GitHub repository
      was created in 2018, and the project site describes it as a fast link checker for
      static websites that recursively scrapes and inspects pages.
  usage:
    - >
      For package managers, Muffet is a compact developer-tool package: one executable,
      MIT licensed, installable through Go or Homebrew, useful when a site needs link
      validation without a larger crawler framework.
related-packages:
  - id: brew:lychee
    reason: >
      Choose lychee when link checking must cover Markdown, HTML, files, directories, or
      standard input with a persistent `lychee.toml`; choose Muffet for recursively
      crawling a live website from a starting URL.
    rel: alternative
    sources:
      - https://raviqqe.com/muffet/
      - https://lychee.cli.rs/
