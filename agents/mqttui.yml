    - https://github.com/EdJoPaTo/mqttui
    - https://github.com/EdJoPaTo/mqttui/blob/main/Cargo.toml
  summary:
    - >
      mqttui is a Rust terminal client by EdJoPaTo for quick MQTT inspection and
      publishing. Its own README frames the project as a small, fast alternative to
      heavier MQTT viewers and command-line clients: the author had used MQTT Explorer
      for its overview, compared HiveMQ's mqtt-cli and Mosquitto's bundled
      mosquitto_sub/mosquitto_pub, and then built a terminal-oriented tool aimed at
      quickly watching or publishing MQTT traffic.
  usage:
    - >
      In practice mqttui is used both interactively and in scripts. The README documents
      the default terminal UI for subscribing to all topics or a named topic, a publish
      subcommand with retained-message support and stdin input, a log mode for streaming
      multiple topics to stdout, a read-one mode for shell scripts, and helpers for
      clearing retained topics. Its package-manager niche is the MQTT
      operations/debugging corner: lighter than a desktop MQTT browser, friendlier for
      repeated terminal work than raw Mosquitto commands, and packaged across Homebrew,
      Alpine, Arch, MacPorts, Nix, and other ecosystems.
related-packages:
  - id: brew:mosquitto
    reason: >
      Choose Mosquitto's mosquitto_pub and mosquitto_sub when you want mature,
      option-rich noninteractive MQTT clients or also need the Mosquitto broker; choose
      mqttui for a faster interactive terminal overview.
    rel: alternative
    sources:
      - https://github.com/EdJoPaTo/mqttui#history-and-alternatives
      - https://www.mosquitto.org/documentation/
