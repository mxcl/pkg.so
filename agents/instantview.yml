history:
  adoption-history:
    - >
      Silicon Motion distributes InstantView for docks and adapters based on its SM76x
      display technology. Current macOS releases support recent Apple operating-system
      generations, while legacy packages remain available for older macOS versions.
  package-nerd-significance:
    - >
      InstantView sits at the boundary between a desktop utility, a display driver, and
      adapter firmware management. Package-manager users care about it because
      installing the correct application release is necessary for supported USB display
      hardware and because compatibility is closely tied to operating-system versions.
  project-history:
    - >
      Silicon Motion developed InstantView as the user-facing display application for
      its graphics-display technology. It provides display control through a graphical
      interface and can update both the application and compatible adapter firmware.
    - >
      The official download archive distinguishes current InstantView releases from
      legacy macOS display applications and older conventional display drivers.
  related-projects:
    - Silicon Motion SM76x graphics-display SoCs.
    - >
      USB docking stations and display adapters incorporating compatible Silicon Motion
      hardware.
  sources:
    - https://www.siliconmotion.com/downloads/index.html
    - >
      https://www.siliconmotion.com/downloads/video/SMI%20macOS%20InstantView%20User%20Manual.pdf
    - https://www.siliconmotion.com/product/Graphics-Display-SoCs.html
  summary:
    - >
      Silicon Motion InstantView is a display application and driver interface for
      compatible SM76x-based docking stations and adapters. It supports mirrored or
      extended displays and manages compatible device firmware.
  timeline:
    - >
      2019: Silicon Motion's archive lists a legacy macOS display-driver release for
      older OS versions.
    - '2021: A later legacy driver release added support through macOS Catalina.'
    - '2024: The archived InstantView line covered Catalina through Monterey.'
    - '2026: InstantView V3.24 R04 was published for current macOS generations.'
  usage:
    - >
      Users install InstantView on a Mac connected to compatible display hardware, then
      choose mirrored or extended-display operation from its interface. The application
      remains active to support connected displays and can update itself and device
      firmware.
