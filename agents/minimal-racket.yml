history:
  project-history:
    - >
      The 2010 rename from PLT Scheme to Racket marked a deliberate move away from being
      described only as a Scheme implementation. The Racket project's own rename note
      says Racket remains a Lisp dialect and descendant of Scheme, but the new name
      better fit a language and toolchain aimed at language-oriented programming. The
      transition also renamed DrScheme to DrRacket, made racket the main command name,
      and shifted the preferred module language from #lang scheme to #lang racket while
      preserving compatibility.
  sources:
    - https://blog.racket-lang.org/2020/05/racket-is-25.html
    - https://cs.brown.edu/people/sk/Publications/Papers/Published/cffk-macros-to-dsls/
    - https://docs.racket-lang.org/
    - https://felleisen.org/matthias/manifesto/
    - https://racket-lang.org/new-name.html
  summary:
    - >
      Racket began in 1995 as PLT Scheme, a project connected to Matthias Felleisen,
      Matthew Flatt, Robert Bruce Findler, Shriram Krishnamurthi, and the broader PLT
      group. The early project combined programming-language research with education:
      DrScheme, later DrRacket, provided an environment for teaching Scheme-style
      programming, while the language accumulated modules, classes, macros, contracts,
      and tooling for larger programs.
  usage:
    - >
      Racket's ecosystem role is unusually meta: it is a practical language runtime, a
      teaching environment, and a platform for creating new languages. Academic accounts
      of Racket emphasize its macro system and its support for composing domain-specific
      languages. The minimal-racket package is the smaller Homebrew distribution for
      users who want the command-line runtime and raco tooling without the full
      batteries-included bundle; it still exposes the core package-management and build
      workflow used by Racket programmers.
