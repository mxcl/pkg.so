id: cask:dosbox-staging-app
display-name: DOSBox Staging
repo: null
docs:
  - https://www.dosbox-staging.org/manual
  - https://www.dosbox-staging.org/getting-started
config-file-location:
  linux:
    - ~/.config/dosbox/dosbox-staging.conf
  macos:
    - ~/Library/Preferences/DOSBox/dosbox-staging.conf
  windows:
    - '%LOCALAPPDATA%\DOSBox\dosbox-staging.conf'
credentials-file-location: null
history:
  adoption-history:
    - >
      DOSBox Staging attracted users seeking a maintained, mostly drop-in replacement
      for older DOSBox versions with modern host-platform support, improved defaults,
      and integrated audiovisual enhancements.
    - >
      The project is distributed for Windows, macOS, and Linux and can use existing
      DOSBox-style configurations. It is also suitable as a separately installed runtime
      for DOS collections, while storefront games can retain their own private DOSBox
      copies.
  package-nerd-significance:
    - >
      DOSBox Staging exemplifies a community soft fork that converts accumulated
      downstream patches and modernization work into a coherent release project. Its
      migration to Git, SDL 2, modern build practices, and cross-platform automation
      reduced friction for contributors and packagers.
    - >
      Its deliberate scope is important to emulator taxonomy: it optimizes the DOS and
      Windows 3.1 gaming experience rather than attempting to emulate every PC operating
      system or maximize hardware fidelity at all costs.
  project-history:
    - >
      DOSBox Staging was created on 15 September 2019 as a soft fork of the
      SourceForge-hosted DOSBox project. Patryk “dreamer” Obara and kcgen started it to
      consolidate forked work, introduce modern development practices, improve
      maintainability, and revive active DOSBox development.
    - >
      The first release series migrated the preserved DOSBox history from Subversion to
      Git, adopted SDL 2, and introduced updated rendering, audio, input, and
      configuration defaults. Later stewardship passed to John Novak.
  related-projects:
    - DOSBox
    - DOSBox-X
    - DOSBox Pure
    - FreeDOS
    - 86Box
    - PCem
  sources:
    - https://www.dosbox-staging.org/0.83/manual/introduction/what-is-dosbox-staging/
    - https://www.dosbox-staging.org/about/
    - https://www.dosbox-staging.org/getting-started/
    - https://www.dosbox-staging.org/releases/release-notes/0.75.0/
  summary:
    - >
      DOSBox Staging is a modern continuation of DOSBox focused on current operating
      systems, sensible defaults, maintainable development, and high-quality DOS-game
      audio and video emulation.
  timeline:
    - '2019-09-15: DOSBox Staging was created as a soft fork of DOSBox.'
    - >
      2020: The first release series adopted Git, SDL 2, and modernized cross-platform
      behavior.
    - '2022: The 0.79 series expanded runtime configuration controls and upgrade tooling.'
    - 'Later: Project stewardship passed to John Novak.'
  usage:
    - >
      Users typically place a DOS game in a host directory, mount that directory as a
      virtual drive, and run the game's executable. Most software works with the stock
      defaults, while per-game configuration can tune CPU, graphics, shaders, audio,
      MIDI, networking, and input.
