history:
  adoption-history:
    - >
      Dropbox helped normalize a dedicated synchronized folder as the user interface for
      consumer cloud storage. The desktop client has been deployed across macOS,
      Windows, and Linux and expanded from basic synchronization into backup, selective
      synchronization, online-only storage, sharing, and recovery workflows. Dropbox's
      official 2017 company material reported almost 200,000 business customers.
  package-nerd-significance:
    - >
      Dropbox is a canonical example of a proprietary auto-updating desktop application
      wrapped by system package managers. Its long-lived Linux, macOS, and Windows
      clients also made cloud synchronization behavior, filesystem integration, and
      headless installation recurring concerns for desktop package maintainers.
  project-history:
    - >
      Drew Houston and Arash Ferdowsi co-founded Dropbox in June 2007. The service
      centered on keeping a local Dropbox directory synchronized with cloud storage and
      other devices, later adding business plans, collaboration, backup, online-only
      files, and deeper filesystem integration.
  related-projects:
    - Dropbox Backup extends the desktop client into automatic computer-folder backup.
    - >
      Dropbox Business applies the synchronization and collaboration service to
      organizational accounts.
  sources:
    - >
      https://aem.dropbox.com/cms/content/dam/dropbox/www/en-us/news/about_Dropbox_february_2017.pdf
    - https://help.dropbox.com/installs/desktop-application-overview
    - https://help.dropbox.com/installs/download-dropbox
    - https://help.dropbox.com/sync/selective-sync-overview
    - https://www.dropbox.com/en_GB/about
  summary:
    - >
      Dropbox is a cloud-storage and file-synchronization service founded in 2007; its
      desktop client integrates a synchronized Dropbox folder into the host operating
      system.
  timeline:
    - '2007-06: Drew Houston and Arash Ferdowsi co-founded Dropbox.'
    - "2013: Dropbox Business became part of the product's business-oriented expansion."
    - '2017-10: Dropbox Professional launched for independent workers.'
    - >
      2026: The desktop application continued to provide synchronization, backup,
      offline access, online-only storage, sharing, and file recovery.
  usage:
    - >
      After signing in, users work through a Dropbox folder in Finder or File Explorer
      while the background client synchronizes changes with dropbox.com and other linked
      devices. Preferences expose account, synchronization, storage, and application
      settings; selective sync and online-only files help manage local disk use.
