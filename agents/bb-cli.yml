id: brew:bb-cli
display-name: Bitbucket CLI
repo: null
docs:
  - https://bb-cli.github.io/docs/commands
  - https://bb-cli.github.io/
  - https://bb-cli.github.io/authentication
config-file-location:
  unix:
    - ~/.bitbucket-rest-cli-config.json
credentials-file-location:
  unix:
    - ~/.bitbucket-rest-cli-config.json
history:
  adoption-history:
    - >
      Homebrew packages the tool as `bb-cli`; the supplied package-manager facts also
      show names in Debian, Ubuntu, Nix, zypper, and winget ecosystems, indicating
      cross-platform packaging beyond the upstream release binaries.
  package-nerd-significance:
    - >
      For package-index history, bb-cli is a useful example of a modern SaaS API wrapper
      distributed through both language/runtime channels and native package managers. It
      is not a foundational Unix tool, but it represents the package-manager demand for
      one-command access to hosted development platforms.
  project-history:
    - >
      The project README presents it as "Bitbucket Rest API CLI" and documents
      installation as a standalone binary from GitHub releases or via a container image.
      Its own development note dates the tool to 2021 and says it was developed with
      help from GitHub Copilot.
    - >
      The CLI is intentionally narrow: it wraps Bitbucket operations rather than trying
      to be a general Atlassian or Git hosting client. That makes it a small but
      recognizable example of service-specific CLIs that grew around cloud Git hosting.
  related-projects:
    - >
      Related tools include Atlassian/Bitbucket web APIs, general Git hosting CLIs such
      as GitHub CLI, and other service-specific terminal clients.
  sources:
    - https://bb-cli.github.io/
    - https://github.com/bb-cli/bb-cli#readme
    - input:source_facts.package-manager
  summary:
    - >
      bb-cli is a PHP command-line client for Bitbucket's REST API, packaged as the `bb`
      executable for developers who want pull requests, pipelines, branches, and other
      Bitbucket workflows in a terminal.
  timeline:
    - '2021: README development note says the tool was developed with help from GitHub Copilot.'
    - 'Current: README documents standalone GitHub release binaries and a GHCR container image.'
  usage:
    - >
      Typical use is interactive developer workflow from a shell: run `bb help`,
      authenticate with `bb auth`, then inspect or operate on Bitbucket pull requests,
      pipelines, and branches. The documented Docker setup bind-mounts the same config
      file into the container.
related-packages:
  - id: brew:bitbucket-cli
    reason: >
      Choose bitbucket-cli's bkt command when you need both Bitbucket Cloud and Data
      Center support, gh-like workflows, or structured JSON/YAML output; bb-cli is the
      narrower PHP client for Bitbucket REST workflows.
    rel: alternative
    sources:
      - https://github.com/bb-cli/bb-cli
      - https://github.com/avivsinai/bitbucket-cli
