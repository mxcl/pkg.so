config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Pangolin is offered as a managed cloud service and as self-hosted Community and
      Enterprise editions, allowing adoption without requiring a single deployment
      model.
    - >
      Official clients cover desktop, mobile, and command-line environments; the Linux
      CLI is explicitly described by the project as the official Linux client.
  package-nerd-significance:
    - >
      Pangolin brings WireGuard-based connectivity, identity-aware reverse proxying,
      private-resource access, and policy enforcement into one open, self-hostable
      platform.
    - >
      It is relevant to homelab and infrastructure package users as an alternative to
      combining separate VPN, reverse-proxy, identity-provider, and tunnel tools.
  project-history:
    - >
      Pangolin was developed as an open security and networking platform intended to
      unify connectivity and access policy. Its name refers both to a pangolin's
      protective scales and to its burrowing behavior, reflecting the project's security
      and tunneling roles.
    - >
      The platform evolved beyond its original identity-aware tunneled reverse-proxy
      role into a broader SASE-style system encompassing zero-trust VPN access, reverse
      proxying, privileged access, and an identity-aware AI gateway.
  related-projects:
    - WireGuard provides the underlying secure-tunneling technology identified by the project.
    - >
      The Pangolin ecosystem includes the main server, desktop and mobile clients, the
      official CLI, and site connectors used to reach private networks.
  sources:
    - https://docs.pangolin.net/manage/resources/understanding-resources
    - https://github.com/fosrl/cli
    - https://github.com/fosrl/pangolin
    - https://pangolin.net/about
  summary:
    - >
      Pangolin is an open-source networking and security platform for identity-aware
      access to applications, hosts, networks, and AI services. It combines zero-trust
      VPN and reverse-proxy functions around a shared identity and policy model.
  timeline:
    - >
      Initial phase: Pangolin was presented as an identity-aware tunneled reverse-proxy
      platform.
    - >
      Later development: The project expanded into a broader open SASE platform with
      VPN, reverse-proxy, privileged-access, and AI-gateway capabilities.
  usage:
    - >
      Administrators deploy Pangolin Cloud or a self-hosted control plane, define sites
      and resources, and grant users or roles access through explicit policies.
    - >
      Browser users can reach authenticated HTTPS resources without client software,
      while Pangolin clients provide access to private hosts, ports, and network ranges.
    - >
      Self-hosted server deployments use a mounted config/config.yml, but the reviewed
      Homebrew cask is the macOS client; official documentation does not establish a
      client-side configuration-file path.
