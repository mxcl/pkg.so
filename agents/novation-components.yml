history:
  adoption-history:
    - >
      Components became the shared management surface for a broad range of Novation
      controllers, grooveboxes, and synthesizers, including Launchkey, Launchpad,
      Circuit, Peak, Summit, and Bass Station II families.
  package-nerd-significance:
    - >
      Components represents a hardware vendor moving firmware maintenance, preset
      librarianship, content transfer, and MIDI-controller customization into one
      companion application. Its availability as both a Web MIDI application and a
      standalone desktop package is particularly relevant to users who track how music
      hardware crosses browser, desktop, and device-firmware ecosystems.
  project-history:
    - >
      Novation developed Components as the product hub for managing supported
      instruments. It consolidated tasks such as firmware updates, custom MIDI modes,
      templates, patches, samples, sessions, and device backups that had previously
      depended on product-specific workflows.
  related-projects:
    - >
      Novation Circuit: Components manages packs, samples, patches, and sessions for
      Circuit-family grooveboxes.
    - >
      Novation Launchkey and Launchpad: Components edits custom MIDI modes and installs
      firmware.
    - >
      Novation Peak, Summit, and Bass Station II: Supported synthesizers whose content
      or firmware can be managed through Components.
  sources:
    - 'Official Components product page: https://novationmusic.com/components'
    - >
      Official standalone-installation article:
      https://support.novationmusic.com/hc/en-gb/articles/115002560785-Novation-Components-Standalone-installers
    - >
      Official supported-products article:
      https://support.novationmusic.com/hc/en-gb/articles/360021384760-Which-products-use-Novation-Components
  summary:
    - >
      Novation Components is the official browser-based and standalone companion
      application for configuring supported Novation music hardware, transferring
      content, and maintaining firmware.
  timeline:
    - >
      Standalone era: Novation made Components available as both a Web MIDI application
      and an offline desktop application.
    - >
      Current era: Components serves as a common hub across multiple generations of
      Novation controllers, grooveboxes, and synthesizers.
  usage:
    - >
      Musicians connect supported Novation hardware over USB, then use Components to
      update firmware, edit custom control modes, transfer presets or packs, back up
      device content, and restore factory settings. Signing in is optional for basic
      operation but enables account-backed data storage.
