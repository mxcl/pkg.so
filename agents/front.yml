history:
  adoption-history:
    - >
      Front's official site reports use by more than 9,300 companies. Its adoption is
      organization-centered: administrators configure channels, rules, integrations, and
      access, while individual users work through the web, desktop, or mobile clients.
  package-nerd-significance:
    - >
      For package users, the cask is the desktop endpoint of a cloud collaboration
      service. Installing it provides a dedicated client, but organizational data,
      configuration, and identity remain service-managed rather than being represented
      by a conventional local dotfile.
  project-history:
    - >
      Front developed from a collaborative communications product into a broad
      customer-operations platform. Its current official positioning combines shared
      inboxes, ticketing, omnichannel communication, integrations, workflows, and
      AI-assisted customer support.
  related-projects:
    - >
      Front integrates with external communication channels and business applications
      and exposes a separate developer platform for APIs and custom integrations.
  sources:
    - 'Official Help Center: https://help.front.com/'
    - 'Official download page: https://front.com/download'
    - 'Official installation guide: https://help.front.com/en/articles/2275'
    - 'Official product page: https://front.com/'
  summary:
    - >
      Front is a hosted customer-operations and support platform centered on shared
      inboxes, multichannel conversations, ticketing, workflow coordination, and team
      collaboration.
  timeline:
    - >
      By 2026: Front describes the service as an AI customer-operations platform and
      reports more than 9,300 customer companies.
  usage:
    - >
      An organization invites users to a Front account and connects shared or individual
      communication channels. Users then triage, assign, discuss, and answer customer
      conversations in a coordinated inbox. The desktop application is optional because
      the service is also accessible through its web client.
