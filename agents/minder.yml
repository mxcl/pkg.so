id: brew:minder
display-name: Minder
repo: null
docs:
  - https://docs.mindersec.dev/
  - https://docs.mindersec.dev/getting_started/install_cli
config-file-location:
  unix:
    - $PWD/config.yaml
credentials-file-location: null
history:
  project-history:
    - >
      The platform enrolls repositories and applies policy to repositories, pull
      requests, dependencies, and artifacts. Rules can alert or auto-remediate, and the
      OpenSSF announcement specifically connects Minder with tools and standards such as
      OSV, OpenSSF Scorecard, and Sigstore. In October 2024, OpenSSF announced Minder as
      a sandbox project contributed by Stacklok.
  sources:
    - https://docs.mindersec.dev/getting_started/install_cli
    - https://docs.mindersec.dev/understand/profiles
    - https://github.com/mindersec/minder
    - >
      https://openssf.org/blog/2024/10/28/openssf-adds-minder-as-sandbox-project-to-simplify-the-integration-and-use-of-open-source-security-tools/
    - https://openssf.org/tag/minder/
  summary:
    - >
      Minder is a software supply-chain security platform originally associated with
      Stacklok and later contributed to the Open Source Security Foundation. The project
      describes its goal as helping development teams and open source communities build
      more secure software and prove their security posture through checks, policies,
      and attestations.
  usage:
    - >
      The `minder` package is the CLI face of that platform. Its quickstart flow creates
      a profile, registers repositories, and enables a secret-scanning rule; the
      profile-and-rules model is the core usage pattern for teams that want
      policy-as-code checks over GitHub repositories and supply-chain artifacts.
related-packages:
  - id: brew:scorecard
    reason: >
      Use OpenSSF Scorecard directly for standalone repository-security scoring, or
      apply its checks through Minder when you want centrally managed policies and
      remediation.
    rel: adjacent_workflow
    sources:
      - >
        https://openssf.org/blog/2024/10/28/openssf-adds-minder-as-a-sandbox-project-to-simplify-the-integration-and-use-of-open-source-security-tools/
      - https://github.com/ossf/scorecard
  - id: brew:osv-scanner
    reason: >
      OSV-Scanner provides direct CLI and CI dependency scans, while Minder consumes OSV
      data inside continuously evaluated dependency policies.
    rel: adjacent_workflow
    sources:
      - https://docs.mindersec.dev/
      - https://google.github.io/osv-scanner/
  - id: brew:cosign
    reason: >
      Cosign signs and verifies artifacts through Sigstore; Minder can enforce policies
      that check those artifact signatures and attestations.
    rel: adjacent_workflow
    sources:
      - https://docs.mindersec.dev/
      - https://docs.sigstore.dev/cosign/
