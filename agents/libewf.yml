history:
  adoption-history:
    - >
      EWF became important because forensic images produced by EnCase, FTK Imager,
      SMART, and related tools needed open readers and converters. libewf gave Unix
      package ecosystems a reusable C library plus tools such as ewfacquire, ewfinfo,
      ewfexport, ewfmount, and ewfverify.
    - >
      Distribution packages under names such as libewf, ewf-tools, and ewftools made E01
      handling available outside proprietary forensic workstations.
  package-nerd-significance:
    - >
      libewf is package-nerd useful because it turns a proprietary-forensics file family
      into a normal Unix library and set of small tools. It also carries one of the
      clearest public format documents for EWF, making it useful to preservation,
      incident response, and forensic packaging work.
  project-history:
    - >
      Joachim Metz began documenting the EWF file format in March 2006, with libewf's
      legacy ChangeLog recording release-preparation work in April 2006. The project
      grew alongside a public working specification for the format, covering SMART,
      EnCase E01, logical evidence files, and later EWF2 variants.
    - >
      The libyal repositories split the actively experimental libewf tree from a stable
      legacy tree. Homebrew's curation points at the legacy repository, while the
      project documentation and README describe the broader libewf effort.
  related-projects:
    - >
      Related projects include the libyal family of forensic libraries, The Sleuth Kit
      integrations, EnCase, FTK Imager, and forensic package sets that ship ewf-tools.
  sources:
    - https://formulae.brew.sh/formula/libewf
    - https://github.com/libyal/libewf-legacy
    - https://raw.githubusercontent.com/libyal/libewf-legacy/main/ChangeLog
    - >
      https://raw.githubusercontent.com/libyal/libewf/main/documentation/Expert%20Witness%20Compression%20Format%20%28EWF%29.asciidoc
  summary:
    - >
      libewf is the libyal library and tool suite for reading, writing, acquiring,
      verifying, exporting, and mounting Expert Witness Compression Format evidence
      files. Its package-manager identity is tied to digital forensics because EWF/E01
      images are common interchange artifacts between acquisition tools, forensic
      suites, and open-source analysis workflows.
  timeline:
    - '2006-03: Initial public EWF specification revisions for the libewf project.'
    - >
      2006-04: Legacy ChangeLog records first-release preparation and tool renames such
      as ewfcat to ewfexport and ewfmd5sum to ewfverify.
    - >
      2014: Legacy ChangeLog records stabilization work and synchronization with the
      experimental libewf tree.
    - '2026: The EWF specification document records maintenance through 2006-2026.'
  usage:
    - >
      Package users commonly install libewf for command-line acquisition and conversion,
      for mounting or inspecting EWF images, or as a dependency of forensic applications
      that need E01/S01/L01 support.
related-packages:
