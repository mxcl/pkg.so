id: brew:silk
display-name: SiLK
repo: null
docs:
  - https://tools.netsa.cert.org/silk/docs.html
  - https://tools.netsa.cert.org/silk/silk-reference-guide.pdf
  - https://tools.netsa.cert.org/silk/silk.html
config-file-location:
  unix:
    - ${SILK_CONFIG_FILE}
    - ${SILK_DATA_ROOTDIR}/silk.conf
    - /data/silk.conf
    - ${SILK_PATH}/share/silk/silk.conf
    - ${SILK_PATH}/share/silk.conf
    - /usr/share/silk/silk.conf
    - /usr/share/silk.conf
    - /etc/rwflowpack.conf
    - $prefix/etc/rwflowpack.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The official site positions SiLK for backbone, enterprise border, and mid-sized
      ISP traffic analysis, and the input records a Homebrew package. The official
      downloads page also documents RPM availability for recent releases, reflecting use
      by Unix and Linux operators.
  package-nerd-significance:
    - >
      Package nerds care because SiLK is a large, old-school Unix tool suite with dozens
      of executables, daemon/service configuration, C/Perl/Python components, generated
      manpages, and data-file compatibility concerns. Packaging it means making a full
      operational network-analysis environment available from a package manager.
  project-history:
    - >
      The official credits describe SiLK as a CERT Network Situational Awareness project
      that grew out of earlier large-scale analysis work associated with Suresh Lakshman
      Konda. The public release notes list releases from SiLK 0.1 in December 2003
      through 3.24.2 in May 2026.
    - >
      The project has evolved from early NetFlow-oriented tooling into a broader
      flow-analysis suite with IPFIX, NetFlow v5/v9, PySiLK, plug-ins, IPsets, Bags,
      prefix maps, scan detection, and service packaging material.
  related-projects:
    - >
      Related projects and components include YAF, libfixbuf, IPFIX, NetFlow, PySiLK,
      rwflowpack, flowcap, rwfilter, and the broader CERT NetSA Security Suite.
  sources:
    - https://tools.netsa.cert.org/silk/
    - https://tools.netsa.cert.org/silk/credits.html
    - https://tools.netsa.cert.org/silk/docs.html
    - https://tools.netsa.cert.org/silk/download.html
    - https://tools.netsa.cert.org/silk/releasenotes.html
    - source_facts.package-manager
  summary:
    - >
      SiLK, the System for Internet-Level Knowledge, is CERT NetSA's suite for
      collecting, storing, and analyzing large volumes of network flow data. It combines
      collection daemons with many command-line analysis tools for querying binary SiLK
      Flow repositories.
  timeline:
    - '2003: Official release notes list SiLK 0.1.'
    - '2008: Official release notes list SiLK 1.0.0.'
    - '2011: Official release notes list SiLK 3.0.0.'
    - '2017: Official release notes list SiLK 4.0.0 beta software while 3.x continues.'
    - '2026: Official downloads page lists SiLK 3.24.2.'
  usage:
    - >
      Operators run packing tools such as flowcap and rwflowpack to collect IPFIX or
      NetFlow data into a SiLK data repository, then use analysis commands such as
      rwfilter, rwcut, rwstats, rwuniq, rwset, and rwbag in pipelines to answer security
      questions over historical flow data.
tags:
  - cli
  - ipfix
  - netflow
  - network-security
  - traffic-analysis
