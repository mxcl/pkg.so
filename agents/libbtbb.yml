history:
  adoption-history:
    - >
      libbtbb's adoption followed the Ubertooth ecosystem rather than general-purpose
      networking libraries. It appears in Homebrew and Linux distributions because
      Bluetooth researchers, packet analysts, and hardware-security users need a
      packaged decoder to build the rest of the Ubertooth stack.
  package-nerd-significance:
    - >
      libbtbb is significant as a small package that unlocks a larger hardware-hacking
      workflow. In a package graph, it is the Bluetooth baseband decoding layer between
      SDR capture hardware and user-facing analysis tools.
  project-history:
    - >
      The README describes libbtbb as forked from the GR-Bluetooth project. That origin
      matters: it moved Bluetooth baseband decoding from a GNU Radio research path into
      a reusable library that could support Ubertooth tools, packet formats, and
      Wireshark integration.
    - >
      The changelog shows a hardware-toolchain release cadence tied to Ubertooth. The
      2014-02-R2 release added Bluetooth Low Energy support, limited Adaptive Frequency
      Hopping support, a rewritten Basic Rate API, and Wireshark plugin support. Later
      releases focused on PCAP formats, BLE PCAPNG support, build simplification, and
      Python 3.
  related-projects:
    - >
      Related projects include Ubertooth, GR-Bluetooth, GNU Radio, USRP hardware
      workflows, Wireshark dissectors, and Bluetooth Low Energy packet analysis.
  sources:
    - https://formulae.brew.sh/formula/libbtbb
    - https://github.com/greatscottgadgets/libbtbb
    - https://raw.githubusercontent.com/greatscottgadgets/libbtbb/master/README.md
    - https://raw.githubusercontent.com/greatscottgadgets/libbtbb/master/changelog
    - https://ubertooth.readthedocs.io/en/latest/building_from_git.html
  summary:
    - >
      libbtbb is Great Scott Gadgets' Bluetooth baseband decoding library, used with
      Ubertooth hardware and older GR-Bluetooth/USRP workflows to extract Bluetooth
      packet and piconet information.
  timeline:
    - >
      2014-02-20: 2014-02-R2 added Bluetooth Low Energy support, limited AFH support, a
      rewritten Basic Rate API, and Wireshark plugin support.
    - >
      2015-09-05: 2015-09-R2 added a new PCAP format for BR/EDR packets and BLE PCAPNG
      support.
    - '2017-03-01: 2017-03-R2 removed the libpcap dependency to simplify builds.'
    - '2018: 2018-08-R1 and 2018-12-R1 kept version parity with Ubertooth releases.'
    - '2020-12-25: 2020-12-R1 added Python 3 support and minor bug fixes.'
  usage:
    - >
      Users install libbtbb as a C library and headers, then consume it through
      Ubertooth utilities, packet decoders, and Wireshark-related workflows. The README
      notes use with Ubertooth devices and GR-Bluetooth/USRP.
related-packages:
  - id: brew:ubertooth
    reason: >
      Ubertooth supplies the hardware-facing host utilities and firmware that pair
      directly with libbtbb for capturing and decoding Bluetooth traffic.
    rel: adjacent_workflow
    sources:
      - https://github.com/greatscottgadgets/ubertooth
      - https://github.com/greatscottgadgets/libbtbb
      - https://ubertooth.readthedocs.io/en/latest/build_guide.html
  - id: brew:wireshark
    reason: >
      Wireshark is the documented analysis endpoint for Ubertooth Bluetooth captures,
      with BLE support built in and workflows for traffic decoded through the libbtbb
      ecosystem.
    rel: adjacent_workflow
    sources:
      - https://ubertooth.readthedocs.io/en/latest/build_guide.html
      - https://ubertooth.readthedocs.io/en/latest/capturing_BLE_Wireshark.html
      - https://www.wireshark.org/docs/
