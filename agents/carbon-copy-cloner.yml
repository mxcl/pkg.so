history:
  adoption-history:
    - >
      Over more than two decades, CCC developed from a disk-cloning utility into a
      task-oriented backup application with scheduling, incremental copying,
      verification, snapshots, network destinations, and detailed task history.
    - >
      Bombich has repeatedly adapted CCC to macOS storage changes, including Recovery
      partitions, APFS, snapshots, signed system volumes, Apple Silicon, and newer macOS
      security requirements.
  package-nerd-significance:
    - >
      Carbon Copy Cloner is a longstanding fixture in Mac administrator and enthusiast
      backup toolkits, especially where users want more control over sources,
      destinations, schedules, exclusions, verification, and restoration than a default
      backup workflow provides.
    - >
      Its package history tracks major changes in macOS storage architecture. That makes
      old-version compatibility, helper services, Full Disk Access, task migration, and
      bootable-copy expectations unusually important to cask users.
  project-history:
    - >
      Bombich Software released Carbon Copy Cloner 1.0 on January 18, 2002. Early
      releases focused on cloning Mac volumes and creating recoverable copies.
    - >
      CCC 4, released in 2014, redesigned the interface and architecture around unified
      saved and scheduled tasks, task chaining, runtime conditions, and a menu-bar
      status application.
    - >
      CCC 5 added APFS snapshot creation and retention features in 2018. Later
      generations continued shifting the emphasis from literal bootable cloning toward
      controlled, verifiable backups and restoration as macOS storage protections
      evolved.
  related-projects:
    - >
      Apple Time Machine is the built-in macOS backup system most often contrasted with
      CCC's configurable task model.
    - >
      Apple Disk Utility and Apple Software Restore participate in disk preparation or
      replication workflows discussed by CCC documentation.
    - APFS snapshots provide point-in-time retention used by modern CCC backup tasks.
  sources:
    - https://bombich.com/
    - https://bombich.com/en/kb/ccc/4/release-notes
    - https://bombich.com/time-machine
    - https://support.bombich.com/hc/en-us/articles/20686511433623-How-to-verify-a-backup
    - https://support.bombich.com/hc/en-us/categories/4411543022103-Carbon-Copy-Cloner
  summary:
    - >
      Carbon Copy Cloner, commonly abbreviated CCC, is Bombich Software's macOS backup
      and file-copying application. It supports selective and scheduled backups,
      incremental updates, verification, snapshots, restoration, and migration
      workflows.
  timeline:
    - '2002: Carbon Copy Cloner 1.0 is released.'
    - '2007: CCC 3.0 is released.'
    - '2012: CCC 3.5 is released.'
    - '2014: CCC 4 introduces a redesigned task-based interface and architecture.'
    - '2018: CCC 5.1 adds APFS snapshot creation and retention controls.'
    - >
      2025: CCC 7 documentation describes the current generation's backup, verification,
      and snapshot workflows.
  usage:
    - >
      Users select a source volume or folder, choose a destination, apply optional
      filters and advanced settings, and run the task manually or on a schedule.
      Subsequent runs ordinarily copy only changed content.
    - >
      CCC records task events and optional per-file audit data for troubleshooting and
      verification. Automated access to NAS volumes, encrypted volumes, disk images, and
      SMTP services can use credentials protected in CCC's private macOS keychain.
