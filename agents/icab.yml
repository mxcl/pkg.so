history:
  adoption-history:
    - >
      iCab developed a long-lived niche among Mac users by supporting successive
      generations of Apple hardware and operating systems. Its official download page
      retains builds for modern Apple Silicon and Intel systems as well as older Intel,
      PowerPC, and 68K Macs.
  package-nerd-significance:
    - >
      iCab is notable in Mac package culture for spanning classic Mac OS and modern
      macOS while remaining independently distributed as shareware. Its archive of
      architecture- and OS-specific builds illustrates the compatibility history of
      Macintosh application packaging.
  project-history:
    - >
      Alexander Clauss has distributed iCab since 1999 as an independently developed web
      browser for the Mac. The maintained 6.x line continues alongside downloadable
      legacy releases, including iCab 2.9.9 for classic Mac OS.
  related-projects:
    - The related iCab Mobile product brings the browser family to iPhone and iPad.
  sources:
    - https://www.icab.de/
    - https://www.icab.de/download.html
    - https://www.icab.de/faq.html
    - https://www.icab.de/news.html
  summary:
    - >
      iCab is a proprietary, independently developed alternative web browser for macOS
      with roots in the classic Mac OS era.
  timeline:
    - '1999: iCab enters public distribution.'
    - '2020: iCab 6.0 begins the current major release line.'
    - '2024: iCab 6.2.3 is released.'
    - '2026: iCab 6.3.7 is released.'
  usage:
    - >
      Users install iCab from the developer's download site and configure browsing,
      tabs, downloads, filtering, forms, and site-specific behavior through the
      application settings.
    - >
      The official FAQ documents optional saving and filling of web forms, kiosk mode,
      registration by name and serial number, and extensive preference controls. It does
      not document a current standalone configuration or credentials file path.
