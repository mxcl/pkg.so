credentials-file-location: null
history:
  project-history:
    - >
      Its major design milestone is the split between the text interface and a
      background server process. Pressing `q` detaches the interface while playback
      continues, and another interface can attach later. The official description also
      highlights a separate output-buffer thread for smooth playback under system or I/O
      load, gapless playback through precaching, customizable key bindings, playlist
      persistence, m3u support, Icecast and Shoutcast streams, and broad codec support
      through plugins and libraries.
  sources:
    - https://formulae.brew.sh/formula/moc
    - https://moc.daper.net/about
    - https://moc.daper.net/node/87
    - https://moc.daper.net/taxonomy/term/2
  summary:
    - >
      MOC, short for Music On Console, is a Linux and Unix console audio player whose
      official documentation names Damian Pietras as the original author and John
      Fitzgerald as maintainer. The project site describes an ncurses-style player
      inspired by Midnight Commander: users browse directories, press enter on a file,
      and MOC continues playback through the directory without requiring a prebuilt
      playlist.
  usage:
    - >
      MOC's package niche is the lightweight terminal music-player slot: closer to a
      self-contained player than to networked daemons such as MPD. The executable is
      `mocp`, and package records show it distributed broadly through Homebrew, Debian,
      Ubuntu, MacPorts, Nix, and zypper for users who want local console playback
      without a graphical library manager.
related-packages:
  - id: brew:cmus
    reason: >
      Choose cmus for a small, actively documented ncurses music player with a library,
      filters, and remote-control command; choose MOC for its Midnight Commander-style
      browser and detachable client/server interface.
    rel: alternative
    sources:
      - https://moc.daper.net/about
      - https://cmus.github.io/
      - https://github.com/cmus/cmus#readme
  - id: brew:mpd
    reason: >
      Choose Music Player Daemon when playback should run as a headless network service
      controlled by separate terminal, graphical, mobile, or web clients; choose MOC for
      an integrated terminal browser and player.
    rel: alternative
    sources:
      - https://moc.daper.net/about
      - https://www.musicpd.org/
      - https://mpd.readthedocs.io/en/stable/user.html
