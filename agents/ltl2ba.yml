history:
  adoption-history:
    - >
      LTL2BA was adopted by model-checking users who needed a practical LTL-to-automata
      translator that could interoperate with Spin. Its presence in Homebrew and Nix,
      recorded in the supplied package-manager facts, shows that it remains useful
      enough for Unix-like package collections despite being a specialized academic
      tool.
  package-nerd-significance:
    - >
      For package-history work, LTL2BA is an example of a compact research artifact that
      became long-lived infrastructure. It is tiny, stable, and domain-specific, but
      packaging it saves verification users from building or finding an old academic
      distribution manually.
  project-history:
    - >
      The official LTL2BA page describes the software as originally written by Denis
      Oddoux in version 1.0 and later modified by Paul Gastin in versions 1.2 and 1.3.
      The page ties the implementation to the paper "Fast LTL to Buchi Automata
      Translation", presented at CAV 2001, which explains why the package is known
      mostly inside verification and automata-theory circles rather than as a general
      developer tool.
    - >
      The project has kept a deliberately narrow interface: users enter LTL formulae
      using standard temporal and Boolean operators, can choose Spin syntax
      compatibility, and can ask the tool to emit an automaton image or a Spin never
      claim. The official download page is form based and does not advertise an official
      public source-control repository, so package managers generally package the
      released program rather than tracking a public upstream Git repository.
  related-projects:
    - >
      Spin is an important related model checker because the official interface can use
      Spin syntax and emit Spin never claims.
    - >
      Graphviz dot is related operationally because the official page says automata
      drawings are generated with dot.
    - JLtl2Ba is listed by the official page as a Java interface for LTL2BA.
  sources:
    - https://lsv.ens-paris-saclay.fr/~gastin/ltl2ba/
    - https://lsv.ens-paris-saclay.fr/~gastin/ltl2ba/download.php
    - source_facts.package-manager
  summary:
    - >
      LTL2BA is a small command-line and web tool for translating Linear Temporal Logic
      formulae into Buchi automata. It belongs to the formal-methods and model-checking
      ecosystem, where such translations are used to turn temporal specifications into
      automata that model checkers can consume.
  timeline:
    - '2001: The underlying fast LTL-to-Buchi translation work was presented at CAV 2001.'
    - 'Version 1.0: Denis Oddoux wrote the original LTL2BA software.'
    - 'Versions 1.2 and 1.3: Paul Gastin modified the tool.'
    - >
      Current packaging: Homebrew and Nix package ltl2ba according to the supplied
      source facts.
  usage:
    - >
      Users provide an LTL formula, choose syntax and simplification options, and use
      the output as a generalized Buchi automaton, Buchi automaton, or Spin never claim.
      The package is most relevant in workflows that generate or test temporal
      properties before feeding them to a model checker.
related-packages:
  - id: brew:spin
    reason: >
      Use Spin with LTL2BA-generated never claims to verify temporal properties of
      Promela system models.
    rel: adjacent_workflow
    sources:
      - https://lsv.ens-paris-saclay.fr/~gastin/ltl2ba/
      - https://spinroot.com/spin/Man/Manual.html
  - id: brew:graphviz
    reason: >
      Install Graphviz when LTL2BA output needs to be rendered as an automaton diagram,
      because the official service uses Graphviz's dot program for drawings.
    rel: adjacent_workflow
    sources:
      - https://lsv.ens-paris-saclay.fr/~gastin/ltl2ba/
      - https://graphviz.org/documentation/
