history:
  adoption-history:
    - >
      Sparsity remained a specialist macOS utility rather than a general file manager.
      It grew from a test-file generator into a scanner that reports sparse, cloned, and
      purgeable files in selected folders or volumes.
  package-nerd-significance:
    - >
      Sparse files expose the difference between a file's logical size and its allocated
      storage. Sparsity gives APFS researchers, developers, and storage troubleshooters
      a graphical way to create controlled examples and inspect how clones and sparse
      allocation affect real disk use.
  project-history:
    - >
      Howard Oakley introduced Sparsity in 2019 while investigating whether and how APFS
      supports sparse files. The early utility generated large sparse test files.
    - >
      Later releases added recursive scanning and reporting for sparse, clone, and
      purgeable files, including nominal size, allocated size, and sparsity ratio. The
      application was subsequently modernized for newer macOS releases.
  related-projects:
    - >
      The developer's related Precize utility inspects file allocation, metadata,
      bookmarks, and aliases. VolSizes was used in the original APFS sparse-file
      investigation to check volume capabilities.
  sources:
    - https://eclecticlight.co/2019/04/09/the-quest-for-sparse-files-in-apfs-do-they-exist/
    - https://eclecticlight.co/2021/03/29/sparse-files-are-common-in-apfs/
    - >
      https://eclecticlight.co/2025/07/03/more-updates-for-tahoe-aliases-special-files-sparsity-file-types-utiutility-and-language-nalaprop/
    - https://eclecticlight.co/taccy-signet-precize-alifix-utiutility-alisma/
  summary:
    - >
      Sparsity is a macOS storage utility by Howard Oakley for creating APFS sparse
      files and finding sparse or cloned files in folders and volumes.
  timeline:
    - >
      2019: An early Sparsity build accompanied the developer's investigation of APFS
      sparse files.
    - >
      2021: The developer used Sparsity code to illustrate how sparse files are created
      on APFS.
    - >
      2025: Sparsity 1.4 added a refreshed interface and compatibility with newer macOS
      releases.
  usage:
    - >
      Users can generate APFS sparse files for testing or scan a folder or volume.
      Results compare each matching file's logical and allocated size and report its
      sparsity ratio; the bundled help also includes Swift examples for creating and
      checking sparse files.
