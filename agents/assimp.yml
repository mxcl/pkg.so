history:
  adoption-history:
    - >
      assimp's adoption pattern is unusually broad for a native graphics library. The
      supplied package facts list Homebrew, Debian/Ubuntu, Fedora, Alpine, Arch,
      MacPorts, Nix, and openSUSE-style packages, while the README points to vcpkg,
      prebuilt binaries, bindings, ports, and community support channels.
    - >
      The package is common because it standardizes a messy area of build systems:
      importing OBJ, Collada, FBX, glTF, STL, IFC, 3MF, and other model data through one
      C/C++ ABI. Downstream projects can choose assimp as a single dependency instead of
      maintaining a matrix of format-specific parsers.
  package-nerd-significance:
    - >
      assimp is package-nerd significant because it is both leaf-tool and infrastructure
      dependency: a user may install the assimp binary directly, but many graphics, CAD,
      game, robotics, and visualization stacks pull the library indirectly. The many
      bundled importers, test models, and third-party contributions also make licensing
      and ABI stability more visible than in smaller media tools.
  project-history:
    - >
      The official repository describes assimp as the Open-Asset-Importer-Library
      repository and says it loads more than 40 3D file formats into a unified data
      structure. The project license and source headers carry a 2006-present project
      copyright, while the GitHub repository metadata dates the current public
      repository to 2010.
    - >
      Over time assimp accumulated not only importers and exporters but also
      post-processing steps such as normal and tangent generation, triangulation,
      vertex-cache optimization, degenerate primitive removal, duplicate-vertex
      handling, primitive sorting, and material cleanup. That broad post-processing
      layer is why packages often expose both a library and an assimp command-line
      executable rather than treating it as a format decoder only.
    - >
      The current README documents C and C++ APIs, bindings or ports for C#, Java,
      Python, Delphi, D, Android, iOS, Pascal, JavaScript/Node.js, JVM, Haxe, Rust,
      Unity, and Unreal-related integrations. The official documentation is Sphinx-based
      and covers installation, data structures, importer/exporter APIs, post-processing,
      importer notes, and developer guidance.
  related-projects:
    - >
      vcpkg, Homebrew, Debian/Ubuntu, Fedora, Arch, Alpine, MacPorts, Nix, and openSUSE
      packaging make assimp available across common developer platforms.
    - assimp-mdb is the official model database for testing.
    - >
      PyAssimp, AssimpNetter, assimpjs, russimp, and engine integrations demonstrate the
      binding and wrapper ecosystem documented by the upstream README.
  sources:
    - https://api.github.com/repos/assimp/assimp
    - https://github.com/assimp/assimp#readme
    - https://github.com/assimp/assimp/blob/master/LICENSE
    - https://the-asset-importer-lib-documentation.readthedocs.io/en/latest/
    - https://www.assimp.org/
    - source_facts.package-manager
  summary:
    - >
      Open Asset Import Library, better known as assimp, is a C/C++ library and
      command-line tool for loading many 3D asset formats into a common in-memory scene
      representation. It matters in package indexes because it is one of the standard
      native dependencies behind model viewers, game tooling, conversion utilities,
      bindings, and asset-processing pipelines.
  timeline:
    - '2006: Project copyright period begins in official assimp license/source headers.'
    - '2010: assimp/assimp repository created on GitHub.'
    - >
      2022: Official Read the Docs documentation carried a March 2022 v6.0.2
      documentation title.
    - '2026: The official repository metadata and tags showed continued v6 maintenance.'
  usage:
    - >
      Developers use assimp either as a library linked into applications or through the
      assimp CLI for inspecting, converting, and validating assets. The official
      README's quickstart is a CMake/Ninja source build, and its repository layout
      separates core import/export code, public headers, post-processing utilities,
      ports, samples, tools, scripts, and regression test models.
