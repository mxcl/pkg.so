history:
  adoption-history:
    - >
      PortSwigger maintains Community and Professional desktop editions. The free
      Community Edition provides the core manual-testing workflow, while the
      Professional edition extends it with automated and advanced tooling.
    - >
      Burp's role expanded alongside PortSwigger's training and publishing work,
      including The Web Application Hacker's Handbook, helping establish a shared tool
      vocabulary among web-security practitioners.
  package-nerd-significance:
    - >
      Burp Suite is a canonical package in security-oriented workstation setups:
      installing the cask provides a repeatable way to obtain the desktop interception
      proxy without manually managing the vendor download.
    - >
      Package maintainers care about its Java-based, cross-platform lineage, separate
      Community and Professional editions, embedded browser, extension ecosystem, and
      persistent project-versus-user settings model.
  project-history:
    - >
      Dafydd Stuttard wrote the first Burp implementation during PortSwigger's 2003–2006
      early-history period. Burp Suite 1.0 combined Proxy, Sock, Spider, and Repeater.
    - >
      The suite subsequently accumulated tools such as Intruder, Sequencer, Decoder, and
      Comparer. PortSwigger's 2007 v1.1 announcement records the transition of a major
      beta into a general release.
    - >
      Later releases introduced disk-backed projects and JSON configuration
      import/export while retaining temporary-project and global user-setting workflows.
  related-projects:
    - >
      PortSwigger Web Security Academy provides official learning material that commonly
      accompanies Burp usage.
    - Burp Extender and the BApp Store provide the suite's extension ecosystem.
    - Burp Suite Professional and Burp Suite DAST are related commercial PortSwigger products.
  sources:
    - https://portswigger.net/about
    - https://portswigger.net/blog/burp-suite-v1-1-released
    - https://portswigger.net/blog/burp-through-the-ages
    - https://portswigger.net/burp/documentation/desktop/settings
    - https://portswigger.net/burp/documentation/desktop/tools/proxy/http-history
  summary:
    - >
      Burp Suite is PortSwigger's integrated toolkit for assessing web applications. The
      Community Edition centers on intercepting, inspecting, modifying, and replaying
      HTTP traffic during manual security testing.
  timeline:
    - >
      2003–2006: Dafydd Stuttard writes the first Burp implementation and Burp Suite 1.0
      launches.
    - '2007: Burp Suite 1.1 is released after a public beta.'
    - '2016: PortSwigger introduces the modern Burp project-file workflow.'
  usage:
    - >
      Users typically configure a browser or the bundled browser to send traffic through
      Burp Proxy, inspect requests in HTTP history, alter intercepted messages, and
      replay selected requests with Repeater.
    - >
      Settings may be global to the user or scoped to a project. Burp can export and
      import JSON configuration files, but the official documentation leaves their save
      location to the user rather than defining a fixed configuration path.
