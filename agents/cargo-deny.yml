id: brew:cargo-deny
display-name: cargo-deny
repo: null
docs:
  - https://embarkstudios.github.io/cargo-deny
  - https://github.com/EmbarkStudios/cargo-deny#readme
config-file-location:
  unix:
    - <cwd>/deny.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      cargo-deny has broad adoption for Rust CI because it covers policy decisions that
      Cargo itself intentionally does not enforce: which licenses are acceptable,
      whether multiple versions are allowed, whether vulnerable advisories should fail
      builds, and which registries or git sources are trusted.
    - >
      The tool is packaged in apk, Homebrew, dnf, Nix, and pacman, and crates.io
      metadata shows more than four million downloads by June 2026. The README also
      points to cargo-deny-action for GitHub Actions use.
  package-nerd-significance:
    - >
      cargo-deny is package-nerd infrastructure because it makes dependency policy
      executable. Instead of tracking license allowlists, source restrictions,
      duplicate-version rules, and advisories in prose, teams can encode them in
      deny.toml and fail builds consistently.
    - >
      It is also an example of Cargo's external-tool model handling ecosystem governance
      concerns without bloating Cargo itself.
  project-history:
    - >
      Embark Studios created the repository and published the crate in May 2019. The
      README frames cargo-deny as an open-source release of a tool Embark uses
      internally, with a dedicated book for in-depth documentation.
    - >
      The project grew into one of the standard Rust dependency-policy tools, with docs
      organized around checks for licenses, bans, advisories, and sources. Its
      repository topics and README both present it as a Cargo subcommand for dependency
      linting.
  related-projects:
    - cargo-deny-action packages cargo-deny for GitHub Actions workflows.
    - RustSec advisory data is part of the broader ecosystem behind advisory checking.
    - >
      SPDX license identifiers and license lists are central to the licenses check
      documented by cargo-deny.
  sources:
    - https://api.github.com/repos/EmbarkStudios/cargo-deny
    - https://crates.io/api/v1/crates/cargo-deny
    - https://embarkstudios.github.io/cargo-deny
    - https://github.com/EmbarkStudios/cargo-deny#readme
    - https://github.com/EmbarkStudios/cargo-deny/blob/main/docs/src/cli/init.md
  summary:
    - >
      cargo-deny is an Embark Studios Cargo plugin for linting Rust dependency graphs.
      It checks advisories, license policy, banned crates, duplicate versions, and
      allowed package sources from a project-level deny.toml file.
  timeline:
    - '2019: GitHub repository created and first crates.io publication recorded.'
    - '2019-2020: Early 0.6.x tags show rapid iteration on dependency linting.'
    - '2024-2026: Release stream continues through 0.19.x.'
    - >
      2026: crates.io metadata shows more than four million downloads and version 0.19.9
      current in the sampled registry data.
  usage:
    - >
      The quickstart is `cargo install --locked cargo-deny && cargo deny init && cargo
      deny check`. The init command creates a deny.toml template in the current working
      directory unless a path is supplied.
    - >
      Users commonly run `cargo deny check` in CI, or run targeted checks such as `cargo
      deny check licenses`, `cargo deny check bans`, `cargo deny check advisories`, and
      `cargo deny check sources`.
related-packages:
  - id: brew:cargo-audit
    reason: >
      Choose cargo-audit for a narrower RustSec vulnerability audit, while cargo-deny is
      appropriate when CI must also enforce license, source, ban, and
      duplicate-dependency policies.
    rel: alternative
    sources:
      - https://github.com/rustsec/rustsec/blob/main/cargo-audit/README.md
      - https://github.com/RustSec/advisory-db/blob/main/README.md
      - https://embarkstudios.github.io/cargo-deny/checks/
