config-file-location:
  linux:
    - $XDG_CONFIG_HOME/go/env
    - ~/.config/go/env
  macos:
    - ~/Library/Application Support/go/env
  windows:
    - '%AppData%\go\env'
credentials-file-location: null
history:
  adoption-history:
    - >
      The initial public release drew contributors immediately, and Go grew from a
      systems-programming project into a broadly used general-purpose language. The Go
      team reports adoption both inside and outside Google, particularly for network
      services, infrastructure, cloud software, and large codebases.
    - >
      By its tenth anniversary, Go had expanded from a small set of supported systems
      and architectures into a mature ecosystem with production tooling, a modern
      garbage collector, and ports across many operating systems and architectures.
  package-nerd-significance:
    - >
      Go is notable for shipping an unusually cohesive toolchain: compiler, formatter,
      tester, documentation support, dependency management, and installation workflows
      are coordinated through standard commands. This reduces the amount of third-party
      tooling needed for a basic development environment.
    - >
      For package maintainers, Go's static compilation and module-aware tooling make
      command-line programs comparatively straightforward to build and distribute.
      Pinned toolchain formulae remain useful where projects require a specific Go
      language or toolchain generation.
  project-history:
    - >
      Robert Griesemer, Rob Pike, and Ken Thompson began designing Go at Google in
      September 2007 in response to software-engineering problems involving multicore
      systems, networking, dependency management, and large codebases. Ian Lance Taylor
      and Russ Cox later joined the early implementation effort.
    - >
      Go became a public open-source project on November 10, 2009. Community
      experimentation continued toward Go 1, released on March 28, 2012 with a
      compatibility commitment that helped establish a stable base for production
      software.
    - >
      Later toolchain evolution integrated modules, reproducible dependency metadata,
      workspaces, and automatic toolchain selection while retaining the central role of
      the go command and gofmt.
  related-projects:
    - >
      Go modules use go.mod files to declare module paths and dependencies, while
      go.work files coordinate multi-module workspaces.
    - >
      gofmt is distributed with the language and established automatic formatting as a
      standard Go workflow.
    - pkg.go.dev is the official discovery and API-documentation surface for Go packages.
  sources:
    - https://go.dev/blog/10years
    - https://go.dev/blog/1year
    - https://go.dev/blog/toward-go2
    - https://go.dev/doc/code
    - https://go.dev/doc/faq
    - https://go.dev/doc/toolchain
  summary:
    - >
      Go is an open-source, statically typed, compiled programming language created at
      Google with an emphasis on simplicity, efficient tooling, concurrency, and
      maintainable networked software.
  timeline:
    - >
      2007: Robert Griesemer, Rob Pike, and Ken Thompson began designing the language at
      Google.
    - '2009: Go became a public open-source project on November 10.'
    - '2012: Go 1 was released on March 28, establishing the Go 1 compatibility era.'
    - '2019: The project marked ten years of public development and broad production adoption.'
  usage:
    - >
      Developers use the go command to create modules, resolve dependencies, build,
      test, install, format, and inspect Go software. A repository commonly contains a
      go.mod file at a module root, with source organized into packages.
    - >
      Per-user defaults written by `go env -w` are stored in the environment file
      reported by `go env GOENV`. Toolchain selection can also be influenced by go.mod,
      go.work, and the GOTOOLCHAIN setting.
related-packages: []
