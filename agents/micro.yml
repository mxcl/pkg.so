id: brew:micro
display-name: micro
repo: null
docs:
  - https://github.com/micro-editor/micro#readme
  - https://micro-editor.github.io/
config-file-location:
  unix:
    - $MICRO_CONFIG_HOME/settings.json
    - $MICRO_CONFIG_HOME/bindings.json
    - $MICRO_CONFIG_HOME/init.lua
    - $XDG_CONFIG_HOME/micro/settings.json
    - $XDG_CONFIG_HOME/micro/bindings.json
    - $XDG_CONFIG_HOME/micro/init.lua
    - ~/.config/micro/settings.json
    - ~/.config/micro/bindings.json
    - ~/.config/micro/init.lua
credentials-file-location: null
history:
  project-history:
    - >
      The editor reached public attention around its 1.0-era releases in 2016 and has
      remained a popular small binary in package managers because it solves a very
      specific CLI usability problem: users who want a terminal editor that does not
      require learning vi or Emacs conventions. The upstream README emphasizes a single
      static binary with no runtime dependencies, which made it straightforward for
      distributions and app stores to package across Unix-like systems and Windows.
  sources:
    - https://formulae.brew.sh/formula/micro
    - https://github.com/micro-editor/micro
    - https://github.com/micro-editor/micro/blob/master/LICENSE
    - https://micro-editor.github.io/
    - https://micro-editor.github.io/about.html
    - https://news.ycombinator.com/item?id=12388654
  summary:
    - >
      micro is a terminal-based text editor created by Zachary Yedidia and developed in
      the micro-editor GitHub organization. The project frames itself as a successor in
      spirit to nano: easy to install, approachable for SSH and terminal users, but with
      modern editor features such as common keybindings, mouse support, splits and tabs,
      multiple cursors, syntax highlighting, and Lua plugins.
  usage:
    - >
      In practice, micro is used as an everyday terminal editor for local shells, remote
      SSH sessions, containers, and rescue environments. Its package-manager niche is
      the friendly default editor: more capable than nano for many programming tasks,
      less culturally heavy than Vim or Emacs, and easier to distribute than editors
      that need a large runtime.
related-packages:
  - id: brew:nano
    reason: >
      Choose GNU nano when you want the smaller, established Pico-style editor; micro
      explicitly positions itself as a nano successor with conventional shortcuts, mouse
      support, multiple cursors, splits, and plugins.
    rel: alternative
    sources:
      - https://github.com/micro-editor/micro
      - https://www.nano-editor.org/
