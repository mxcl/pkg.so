history:
  adoption-history:
    - >
      aoeui reached Unix package users through small-tool packaging rather than a large
      ecosystem. The input metadata records Homebrew, Debian, and Ubuntu package names,
      reflecting the classic distribution path for compact C terminal editors.
  package-nerd-significance:
    - >
      aoeui is package-nerd material because it is a tiny, old-school editor with
      keyboard-layout-specific ergonomics. Its existence in modern package indexes is a
      reminder that useful CLI software often survives as small source trees with a
      Makefile, a license, and just enough documentation.
  project-history:
    - >
      The upstream README says the editor was written in March 2007 by Paul Klausler and
      describes the source tree as the sources for `aoeui`, a lightweight and
      unobtrusive text editor optimized for the Dvorak keyboard layout.
    - >
      The project predates GitHub-centric open source distribution: its Homebrew
      metadata points to the archived Google Code project page, while the README now
      identifies the GitHub repository as the project's repository.
  related-projects:
    - asdfg is the related executable name shipped by packages for QWERTY-oriented use.
    - The archived Google Code project page is part of the project's provenance.
  sources:
    - https://code.google.com/archive/p/aoeui
    - https://github.com/pklausler/aoeui#readme
    - source_facts.package-manager
  summary:
    - >
      aoeui is a deliberately small terminal text editor optimized for fast editing by
      Dvorak keyboard users, with a companion QWERTY-oriented executable named `asdfg`
      in package metadata.
  timeline:
    - '2007: aoeui was written in March 2007, according to the upstream README.'
    - >
      2010s: Project distribution moved from Google Code-era hosting into a GitHub
      repository identified by upstream.
    - '2020s: Package metadata still carries Homebrew, Debian, and Ubuntu package names.'
  usage:
    - >
      The packaged executables are `aoeui` and `asdfg`. Upstream build instructions are
      minimal: adjust the first few lines of the Makefile for the local system, then
      build.
related-packages: []
