id: brew:jreleaser
display-name: JReleaser
repo: null
docs:
  - https://jreleaser.org/guide/latest
config-file-location:
  unix:
    - ./jreleaser.yml
    - ./jreleaser.toml
    - ./jreleaser.json
credentials-file-location:
  unix:
    - ~/.jreleaser/config.properties
    - $XDG_CONFIG_HOME/jreleaser/config.properties
history:
  adoption-history:
    - >
      JReleaser has a comparatively broad packaging and integration footprint. The
      README points to Maven Central artifacts, the Gradle Plugin Portal, GitHub release
      downloads, Docker images, Flathub, Chocolatey, AppImage, Homebrew, and an Azure
      DevOps extension. The input batch also records packages in apk, Homebrew,
      MacPorts, Scoop, and winget.
  package-nerd-significance:
    - >
      For package nerds, JReleaser is significant because it automates the unglamorous
      final mile of shipping: turning one project release into many ecosystem-specific
      packages. It is especially relevant to JVM projects but intentionally crosses
      language boundaries and treats package managers as first-class release targets.
  project-history:
    - >
      The project README describes JReleaser as a tool for releasing Java and non-Java
      projects, including Go, Rust, Elixir, and C#. Its goal is to simplify release
      creation and artifact publication while keeping distribution-specific options
      configurable.
  related-projects:
    - >
      JReleaser is related to Maven, Gradle, Ant, Docker, Homebrew, Chocolatey, Scoop,
      winget, MacPorts, Flathub, AppImage, and CI systems. It sits in the same
      release-automation space as build plugins, changelog tools, signing tools, and
      package-manager publishing bots.
  sources:
    - https://formulae.brew.sh/api/formula/jreleaser.json
    - https://github.com/jreleaser/jreleaser
    - https://github.com/jreleaser/jreleaser/releases/tag/v0.1.0
    - https://github.com/jreleaser/jreleaser/releases/tag/v1.0.0
    - https://github.com/jreleaser/jreleaser/releases/tag/v1.25.0
    - https://jreleaser.org/
    - https://jreleaser.org/guide/latest/index.html
  summary:
    - >
      JReleaser is a release automation tool for Java and non-Java projects. It packages
      release creation, artifact signing, checksums, changelogs, announcements, and
      publishing to package managers into a CLI and build-tool-oriented workflow.
  timeline:
    - '2021: GitHub release pages recorded JReleaser v0.1.0 on 2021-04-10.'
    - '2022: GitHub release pages recorded JReleaser v1.0.0 on 2022-04-10.'
    - '2025: The release feed recorded a regular v1.x cadence through v1.22.0 on 2025-12-31.'
    - '2026: The release feed recorded v1.25.0 on 2026-06-29.'
  usage:
    - >
      JReleaser users describe distributions and release behavior in jreleaser.yml,
      jreleaser.toml, or jreleaser.json, then run the CLI or build-tool integrations
      from local development or CI/CD. The guide includes quick starts for the CLI,
      Maven, Gradle, and Ant, and concept pages for workflows, distributions, artifacts,
      templates, packagers, deployers, announcers, and signing.
related-packages:
  - id: brew:goreleaser
    reason: >
      GoReleaser is the clearest alternative for Go-centric release automation, while
      JReleaser's official FAQ notes that it inspired JReleaser's broader cross-language
      approach.
    rel: alternative
    sources:
      - https://jreleaser.org/guide/latest/faq.html
      - https://goreleaser.com/intro/
  - id: brew:syft
    reason: >
      JReleaser can invoke Syft during its catalog stage to generate SPDX, CycloneDX,
      and other SBOM formats for distributions and files.
    rel: adjacent_workflow
    sources:
      - https://jreleaser.org/guide/latest/reference/catalog/sbom/syft.html
      - https://github.com/anchore/syft
  - id: brew:cosign
    reason: >
      JReleaser has a documented Cosign signing backend for release artifacts, files,
      and checksums and can upload the public key with the release.
    rel: adjacent_workflow
    sources:
      - https://jreleaser.org/guide/latest/reference/signing.html
      - https://docs.sigstore.dev/cosign/signing/overview/
