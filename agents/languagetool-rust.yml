history:
  adoption-history:
    - >
      LanguageTool-Rust sits in the Rust ecosystem as a typed client for a widely used
      proofreading server. Its adoption is niche but practical: developers can add
      grammar/style checking to Rust programs, while CLI users can query LanguageTool
      from scripts without writing API glue.
  package-nerd-significance:
    - >
      For package nerds, LTRS is a bridge package: it wraps a Java-origin proofreading
      service in Rust library types and a small CLI. It is useful in editor,
      documentation, CI, and prose-checking workflows where LanguageTool is wanted
      without running the Java client directly.
  project-history:
    - >
      The crate was created on crates.io on 2022-05-16 and developed as Rust bindings
      for the LanguageTool server API. Its README states that it can use the public
      LanguageTool API or a self-hosted LanguageTool server.
    - >
      The changelog shows rapid early CLI and library work in May 2022, including
      commands such as `ping`, JSON output, and automatic use of the online LanguageTool
      server. Version 2.0.0, dated 2023-02-07, expanded the project structure and
      related-project documentation. Version 3.0.0, dated 2025-09-17, was a breaking
      refactor that separated library and CLI modules and added support for custom file
      types including Markdown, HTML, and Typst.
  related-projects:
    - >
      Related projects include LanguageTool itself, the LanguageTool public HTTP API,
      docs.rs, crates.io, and other Rust prose-checking tools that integrate grammar
      checks into documentation workflows.
  sources:
    - https://crates.io/crates/languagetool-rust
    - https://docs.rs/languagetool-rust/latest/languagetool_rust
    - https://github.com/jeertmans/languagetool-rust
    - https://raw.githubusercontent.com/jeertmans/languagetool-rust/main/CHANGELOG.md
  summary:
    - >
      LanguageTool-Rust, also called LTRS, is both a Rust library and an `ltrs`
      command-line client for the LanguageTool HTTP API.
  timeline:
    - '2022-05-16: Crate created on crates.io and early 0.0.x changelog entries began.'
    - '2023-02-07: Version 2.0.0 documented a broader project cleanup and related-project work.'
    - >
      2025-09-17: Version 3.0.0 introduced breaking CLI/library refactors and custom
      file-type support.
    - >
      2025-12-31: Version 3.0.1 bumped the minimum supported Rust version and fixed raw
      output behavior.
  usage:
    - >
      The README documents `cargo install languagetool-rust --features full` and an
      `ltrs` CLI with commands such as `ping`, `languages`, and `check`. By default, the
      CLI uses the public LanguageTool API, while users can point it at their own
      server.
related-packages:
  - id: brew:languagetool
    reason: >
      Install LanguageTool alongside ltrs when you want the official proofreading engine
      running locally instead of sending checks to the public API.
    rel: adjacent_workflow
    sources:
      - https://github.com/jeertmans/languagetool-rust
      - https://dev.languagetool.org/http-server
  - id: brew:harper
    reason: >
      Choose Harper when the requirement is an entirely local English grammar engine and
      language server rather than a Rust client for a multilingual LanguageTool HTTP
      service.
    rel: alternative
    sources:
      - https://github.com/jeertmans/languagetool-rust
      - https://writewithharper.com/
      - https://writewithharper.com/docs/integrations/language-server
