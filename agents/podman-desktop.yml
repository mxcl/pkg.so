  windows:
    - '%USERPROFILE%\.local\share\containers\podman-desktop\configuration\settings.json'
credentials-file-location:
  unix:
    - ~/.config/containers/auth.json
history:
  adoption-history:
    - >
      Podman Desktop progressed through public 0.x releases in 2022 and declared its 1.0
      release in May 2023. The project later reported one million, three million and
      five million cumulative downloads, reflecting broad uptake among developers
      seeking a graphical container workflow.
    - >
      In 2024 the maintainers began moving Podman Desktop into the Cloud Native
      Computing Foundation; the official documentation now identifies it as a CNCF
      Sandbox project.
  package-nerd-significance:
    - >
      Podman Desktop gives package users a cross-platform graphical counterpart to
      Podman's daemonless, rootless container engine. Its extension system,
      Docker-compatibility tooling and Kubernetes integration make it a useful bridge
      among local container engines, registries and cluster workflows.
  project-history:
    - >
      Podman Desktop was developed as a graphical environment around Podman and related
      cloud-native tools. Early releases established container, image, registry and
      Kubernetes workflows, while the extension model opened the application to other
      engines and providers.
    - >
      Version 1.0 arrived on May 17, 2023, marking the application's declared maturity.
      Subsequent releases expanded Compose, Kubernetes, OpenShift and AI-development
      workflows while retaining Windows, macOS and Linux distribution.
  related-projects:
    - Podman
    - Buildah
    - Kubernetes
    - OpenShift
    - Docker and Compose compatibility tooling
  sources:
    - 'Official 1.0 announcement: https://podman-desktop.io/blog/podman-desktop-release-1.0'
    - >
      Official CNCF announcement:
      https://podman-desktop.io/blog/2024/11/14/podman-desktop-cncf
    - >
      Official adoption retrospective:
      https://podman-desktop.io/blog/5-million-lessons-learned
    - 'Official documentation: https://podman-desktop.io/docs/intro'
    - 'Official release archive: https://podman-desktop.io/blog/archive'
  summary:
    - >
      Podman Desktop is an open-source graphical application for building, running,
      inspecting and managing containers, images, pods and local Kubernetes workflows.
  timeline:
    - '2022: Public 0.x releases established the desktop container workflow'
    - '2023-05-17: Podman Desktop 1.0 was released'
    - '2024-11: The project announced its move toward the CNCF'
    - '2026-08: The project reported five million cumulative downloads'
  usage:
    - >
      Developers use Podman Desktop to create and inspect containers, build and pull
      images, authenticate to registries, operate Podman machines, run Compose workloads
      and deploy to local or remote Kubernetes contexts. Extensions add support for
      adjacent engines and developer workflows.
