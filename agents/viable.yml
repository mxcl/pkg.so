history:
  adoption-history:
    - >
      Viable was released as free software for users needing a small, direct interface
      to Apple's Virtualization framework. The developer's articles use it for
      performance investigation, compatibility testing, creation of disposable macOS
      environments, and examination of older or beta system releases.
    - >
      Its scope remains deliberately lightweight compared with full commercial
      virtualization suites. Viable shares the framework's restrictions, including the
      supported guest architectures, device limitations, and Apple's limit on
      concurrently running macOS virtual machines.
  package-nerd-significance:
    - >
      Viable is valuable as a compact demonstration of how much macOS virtualization
      Apple silicon provides at the operating-system framework level. It exposes
      practical VM controls without the larger management layers of commercial products
      and is useful for reproducible testing with disposable macOS guests.
  project-history:
    - >
      Howard Oakley built Viable in Swift from Apple's virtualization sample code while
      investigating lightweight virtualization on Apple silicon. He described the app
      publicly in July 2022 and subsequently released beta builds with improved display
      handling, device support, VM bundles, error handling, shared folders, and
      machine-identity controls.
    - >
      Viable consumes Apple IPSW restore images to create macOS virtual machines and
      relies on the Virtualization framework supplied with macOS rather than
      implementing an independent hypervisor stack.
  related-projects:
    - >
      ViableS is the sandboxed, locked-down sibling that can open the same VM bundles
      without host shared-folder or clipboard integration.
    - >
      Vimy runs VM bundles created by recent Viable versions, while Liviable applies a
      related lightweight approach to Linux guests.
    - >
      Comparable Apple-silicon virtualization applications include VirtualBuddy, UTM,
      and commercial products such as Parallels, although their feature sets differ.
  sources:
    - >
      Developer's origin article:
      https://eclecticlight.co/2022/07/04/virtualisation-on-apple-silicon-macs-1-how-well-does-it-work/
    - >
      Official beta announcement:
      https://eclecticlight.co/2022/07/19/second-beta-of-viable-for-virtualising-macos-on-apple-silicon-macs/
    - 'Official product page: https://eclecticlight.co/virtualisation-on-apple-silicon/'
  summary:
    - >
      Viable is a free, lightweight macOS virtual-machine creator and runner for
      Apple-silicon Macs. It uses Apple's Virtualization framework and builds guests
      from macOS IPSW restore images.
  timeline:
    - >
      2022-07-04: The developer publicly described the Viable test application and its
      origins.
    - >
      2022-07-19: Viable's second public beta was announced with configurable resources
      and device support.
    - '2022-12-28: A refactored Viable beta and its sandboxed ViableS sibling were released.'
  usage:
    - >
      Users select or download a macOS IPSW image, configure virtual CPU count, memory,
      display, storage, shared folders, and related settings, then create and run a
      macOS VM.
    - >
      Typical uses include testing other macOS versions or localizations,
      software-development compatibility work, running disposable research environments,
      and isolating potentially unsafe material. Supported guests and available devices
      are constrained by Apple's Virtualization framework and the host and guest macOS
      releases.
