history:
  adoption-history:
    - >
      Unclutter developed a long-running Mac user base around its always-available
      combination of clipboard history, notes, and temporary file storage. The official
      site records Apple editorial features in 2018 and from 2020 through 2023.
    - >
      The product remained a paid, one-time-purchase application while continuing to
      receive compatibility and maintenance updates across successive macOS generations,
      including native Apple Silicon support.
  package-nerd-significance:
    - >
      Unclutter represents the polished commercial Mac-utility tradition: a persistent
      menu-bar application that combines several small workflow tools behind a
      system-level gesture.
    - >
      Its user-controlled storage model is particularly useful to power users. Files and
      notes are ordinary data in documented folders, and those folders can be moved into
      iCloud Drive, Dropbox, Google Drive, or another filesystem-backed sync service
      without requiring a proprietary Unclutter account.
  project-history:
    - >
      Unclutter has been published by Eugene Krupnov and UJ.Labs since 2012. It
      established a pull-down desktop shelf for clipboard history, notes, and frequently
      used files.
    - >
      A major 2015 redesign added multiple notes, richer file organization, search,
      sharing, and multi-display support. Subsequent releases added localization,
      Universal Clipboard improvements, Dark Mode, notarization, and ongoing macOS
      compatibility work.
    - >
      Native Apple Silicon support arrived in 2020. Later updates refined onboarding,
      appearance, privacy controls for clipboard capture, automation through
      AppleScript, cloud-drive behavior, and compatibility with newer macOS releases.
  related-projects:
    - >
      macOS Clipboard and Universal Clipboard provide the system data that Unclutter's
      clipboard panel extends with history.
    - >
      iCloud Drive, Dropbox, Google Drive, and similar filesystem-backed services can
      synchronize user-selected Unclutter Files and Notes folders.
    - >
      Finder, Spotlight, Quick Look, and AppleScript participate in Unclutter's
      file-management and automation workflows.
  sources:
    - https://unclutterapp.com/
    - >
      https://unclutterapp.com/blog/2022/06/02/faq-how-to-change-storage-folder-for-unclutter-files-and-notes-sync-between-devices/
    - https://unclutterapp.com/changelog
    - https://unclutterapp.com/support
  summary:
    - >
      Unclutter is a commercial macOS productivity utility by Eugene Krupnov and
      UJ.Labs. It exposes clipboard history, quick notes, and a file drop zone in a
      panel that slides down from the top of the screen.
  timeline:
    - "2012: The official site identifies the beginning of Unclutter's publication history."
    - >
      2015: A major redesign added multiple notes, file organization, search, sharing,
      and multi-display support.
    - '2019: Releases began using Apple notarization.'
    - '2020: Native Apple Silicon support was added.'
    - >
      2023: Unclutter 2.2 refreshed its icons, onboarding, activation, and macOS
      compatibility.
    - '2025: Official AppleScript automation support was added.'
  usage:
    - >
      Moving the pointer to the top of the screen and scrolling down reveals the
      Unclutter panel; users can also drag files to the top edge and drop them into its
      Files area.
    - >
      The three panels retain clipboard history, quick notes, and files. Panels can be
      rearranged, resized, or disabled.
    - >
      Files and notes use documented sandbox storage folders by default. Users may
      choose separate custom folders and place them in a cloud drive to obtain
      synchronization across Macs.
