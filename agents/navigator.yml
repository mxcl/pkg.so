history:
  adoption-history:
    - >
      ZSA reported producing 2,000 Navigator Trackball units before its 2025 launch and
      selling more than half shortly afterward. The later Trackpad broadened the system,
      while the free companion app addressed macOS limitations affecting third-party
      trackpad gestures and smooth scrolling.
  package-nerd-significance:
    - >
      The cask packages the small macOS-specific utility needed to make open,
      QMK-oriented keyboard hardware behave more like a native trackpad. It is a useful
      example of package management bridging moddable peripheral firmware and
      operating-system accessibility APIs.
  project-history:
    - >
      ZSA launched the Navigator Trackball in 2025 as a modular pointing-device
      attachment for its Voyager keyboard. The Navigator Trackpad followed in 2026 after
      additional hardware and firmware work; because macOS does not expose the same
      third-party trackpad behavior as Windows and Linux, ZSA built a companion menu-bar
      application for gesture support and tuning.
  related-projects:
    - ZSA Navigator Trackball
    - ZSA Navigator Trackpad
    - ZSA Voyager
    - Oryx
    - QMK
    - Keymapp
  sources:
    - https://blog.zsa.io/navigator-trackpad-feature-update/
    - https://blog.zsa.io/press-to-exit-auto-mouse-and-updates/
    - https://the-ergo-archive.zsa.io/newsletters/2025/08
    - https://www.zsa.io/navigator
    - https://www.zsa.io/navigator/trackpad/getting-started
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Navigator is ZSA's macOS companion utility for configuring the Navigator
      Trackpad's cursor, scrolling, and gesture behavior.
  timeline:
    - '2025: ZSA launched the Navigator Trackball.'
    - '2026: ZSA introduced the Navigator Trackpad and its macOS companion application.'
    - >
      2026-08: Navigator firmware gained support for using one Trackball and one
      Trackpad simultaneously.
  usage:
    - >
      After connecting and configuring a Navigator Trackpad in Oryx, macOS users run the
      companion app from its menu-bar icon, grant Accessibility permission when
      prompted, and adjust cursor speed, scrolling, gestures, and related behavior.
      Windows and Linux provide the relevant basic behavior without this app.
