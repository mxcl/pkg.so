history:
  adoption-history:
    - >
      Frame0's official site presents it as a cross-platform, offline-first wireframing
      application used for rapid design work. The site displays customer accounts from
      individual designers and logos of organizations whose people use the product, but
      it does not publish audited adoption figures.
  package-nerd-significance:
    - >
      Frame0 occupies the focused desktop-wireframing niche associated with tools such
      as Balsamiq while adding file-based offline operation, reusable component
      libraries, diagramming, interactive exports, and optional AI-assisted generation.
      Its macOS, Windows, and Linux distributions make it relevant across desktop
      package ecosystems.
  project-history:
    - >
      Frame0 was publicly presented by MKLabs as a desktop tool for quickly producing
      hand-drawn, low-fidelity wireframes. Its official site carries a 2024–2026
      copyright range. The product subsequently expanded beyond screen sketches to
      reusable libraries, interactive prototypes, UML and entity-relationship diagrams,
      HTML/PDF export, and an experimental AI agent.
  related-projects:
    - >
      Frame0's documentation says its library system is developed using the open-source
      DGM.js library.
    - >
      The official product positions Frame0 as an alternative to Balsamiq and uses icons
      derived from the Lucide icon library.
    - An official Frame0 MCP server provides an alternative route for AI-assisted wireframing.
  sources:
    - 'Official documentation: https://docs.frame0.app/'
    - 'Official homepage: https://frame0.app/'
    - 'Official libraries guide: https://docs.frame0.app/libraries/'
    - 'Official prototyping guide: https://docs.frame0.app/prototyping/'
  summary:
    - >
      Frame0 is an offline-first, cross-platform desktop application for sketch-style
      wireframes, diagrams, and interactive prototypes. Documents are stored as
      individual files and can be synchronized using a user-selected cloud-storage
      service.
  timeline:
    - "2024: Earliest year in the official site's copyright range."
    - >
      2024–2026: Frame0 developed as a cross-platform wireframing, diagramming, and
      prototyping product.
    - >
      Later product development: AI-agent support and an MCP server were added as
      optional AI workflows.
  usage:
    - >
      Users create low-fidelity interfaces from primitive shapes, UI libraries,
      templates, and sketch-style icons, then link pages to demonstrate flows. Projects
      can be shared as native `.f0` documents or exported to image, HTML, and PDF
      formats.
    - >
      Frame0 keeps documents file-based and offline. Users who need synchronization can
      place those documents in services such as iCloud, Dropbox, Google Drive, or
      OneDrive.
    - >
      The optional AI agent requires the user to configure a key for a supported model
      provider; the official settings documentation does not disclose a credentials-file
      path.
