history:
  adoption-history:
    - >
      helmify sits in a niche but recognizable adoption path: teams already have
      Kubernetes manifests, often generated by Kustomize, Operator SDK, or Kubebuilder,
      and want a Helm chart for distribution or installation. Its Homebrew packaging
      gives that converter workflow a standard CLI install path on macOS and Linux.
  package-nerd-significance:
    - >
      helmify is useful when a package ecosystem needs a bridge from plain Kubernetes
      YAML into Helm's package shape. It does not replace chart design, but it lowers
      the cost of producing a first chart skeleton from manifests that already exist.
  project-history:
    - >
      The `arttor/helmify` repository was created in 2021. Its README frames the project
      as a converter from existing Kubernetes manifests to Helm charts rather than as a
      chart authoring framework.
    - >
      The project grew around practical object processors for common Kubernetes
      resources: workloads, services, ingress, persistent volume claims, RBAC resources,
      ConfigMaps, Secrets, webhooks, and CRDs. The README warns that generated templates
      and values are overwritten on each run, which makes helmify a generator step
      rather than a safe manual-edit workspace.
  related-projects:
    - Helm is the chart format and lint/install target for helmify output.
    - >
      Kustomize, Operator SDK, and Kubebuilder are common manifest sources mentioned by
      the README.
    - cert-manager appears in helmify options through subchart and CRD handling.
  sources:
    - https://api.github.com/repos/arttor/helmify
    - https://api.github.com/repos/arttor/helmify/releases
    - https://github.com/arttor/helmify
    - https://raw.githubusercontent.com/arttor/helmify/master/README.md
  summary:
    - >
      helmify is a small CLI that converts Kubernetes YAML manifests into a Helm chart.
      It reads supported Kubernetes objects from standard input or files, creates chart
      templates and values, and is especially aimed at generating charts from Operator
      SDK or Kubebuilder output.
  timeline:
    - '2021: The `arttor/helmify` repository was created.'
    - '2021: Early public releases appeared, including v0.2.0 in August.'
    - '2022: The v0.3.x line continued the converter workflow documented in the README.'
  usage:
    - >
      Common usage pipes manifests into `helmify mychart`, points `helmify -f` at a file
      or directory, or pipes `kustomize build` output into helmify. Operator projects
      can add a Makefile target that builds default config and feeds the result to
      helmify.
    - >
      The generated chart should usually be reviewed and tested with Helm tooling. The
      project README describes end-to-end tests that run `helm lint --strict` against
      generated charts.
related-packages:
  - id: brew:helm@3
    reason: Helm validates, packages, distributes, and installs the charts generated by Helmify.
    rel: adjacent_workflow
