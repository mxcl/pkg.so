history:
  adoption-history:
    - >
      bpftop's adoption path is tied to the rise of eBPF observability. The README
      points users to package-manager installs from Fedora, Arch Linux, and Nix, and the
      Homebrew input records additional packaging in apk, brew, Debian, Fedora, Nix,
      pacman, and zypper.
    - >
      Because it requires root privileges and kernel eBPF statistics, adoption is mostly
      among systems, performance, and observability engineers rather than general CLI
      users.
  package-nerd-significance:
    - >
      bpftop is significant because it packages a modern kernel-observability niche into
      a familiar top-like interface. For package maintainers, it is also a compact
      example of the newer Rust-plus-Linux-system-libraries tooling showing up in
      traditional Unix package collections.
    - >
      Its package metadata tells a useful story: a tool announced from Netflix, later
      maintained independently, spreading quickly through Linux distributions and
      Homebrew because eBPF became operationally important.
  project-history:
    - >
      The README describes bpftop as formerly maintained by Netflix and now
      independently maintained by Jose Fernandez, with Netflix no longer affiliated. The
      official announcement from Netflix introduced it as a way to streamline eBPF
      performance optimization.
    - >
      The project appeared publicly in 2024, with a v0.1.0 tag in February 2024. Its
      README now documents install scripts, distribution packages, Linux kernel
      requirements, libelf/libz dependencies, journald integration, and a Rust/Cargo
      build.
  related-projects:
    - >
      bpftop belongs with eBPF observability tools such as bpftrace, BCC tools,
      libbpf-based utilities, and kernel performance monitors.
    - >
      Its interface lineage is the Unix `top` family: live tabular system state with
      sorting, filtering, and drill-down views.
  sources:
    - https://github.com/jfernandez/bpftop#readme
    - >
      https://netflixtechblog.com/announcing-bpftop-streamlining-ebpf-performance-optimization-6a727c1ae2e5
    - source_facts.package-manager
  summary:
    - >
      bpftop is a top-like terminal monitor for running eBPF programs. It reports
      runtime, events per second, estimated CPU percentage, process references, and
      time-series graphs while enabling eBPF runtime statistics only while the tool is
      active.
  timeline:
    - '2024: Official repository was created and v0.1.0 was tagged in February.'
    - '2024: Netflix announced bpftop for eBPF performance optimization.'
    - '2026: v0.9.0 tag appears in the official GitHub repository.'
    - 'Current: README states the project is now independently maintained by Jose Fernandez.'
  usage:
    - >
      The normal workflow is `sudo bpftop`, optionally with a refresh delay. Users
      navigate with arrow keys or vim-style keys, filter programs, sort columns, and
      enter graph views for a selected eBPF program.
    - >
      Internally, the README says bpftop uses the Linux `BPF_ENABLE_STATS` syscall
      command, samples statistics, and disables statistics gathering when the file
      descriptor is dropped on exit.
