history:
  adoption-history:
    - >
      Stick Software continued distributing Jiggler as a lightweight freeware utility
      and later updated it for modern macOS and Apple Silicon. The source repository
      welcomes focused contributions but describes the application as not under active
      feature development.
  package-nerd-significance:
    - >
      Jiggler is a representative example of the small, single-purpose Mac utilities
      commonly installed through Homebrew Cask. Its longevity also illustrates how
      narrowly scoped desktop tools can survive major platform transitions with modest
      maintenance.
  project-history:
    - >
      Stick Software says Jiggler was originally written in response to a user request.
      Its code dates back to the early 2000s, and the project was open-sourced in 2016.
    - >
      An official 2015 announcement described Jiggler as freeware that periodically
      moves the mouse so lengthy tasks are not interrupted by sleep or the screen saver.
  related-projects:
    - macOS Energy Saver
    - caffeinate
    - KeepingYouAwake
  sources:
    - https://github.com/bhaller/Jiggler
    - https://www.sticksoftware.com/
    - https://www.sticksoftware.com/about.html
    - https://www.sticksoftware.com/news/pr/15020801.html
  summary:
    - >
      Jiggler is a small macOS utility from Stick Software that keeps the computer awake
      by periodically simulating mouse activity.
  timeline:
    - "Early 2000s: Much of Jiggler's original code was written."
    - '2015: Stick Software announced Jiggler 1.6 as a freeware Mac utility.'
    - "2016: Jiggler's source code was published."
    - '2020–2021: Stick Software updated Jiggler for current macOS releases and Apple Silicon.'
  usage:
    - >
      Users launch Jiggler before a lengthy task and enable its mouse-jiggling behavior
      instead of temporarily changing macOS sleep and screen-saver settings.
