credentials-file-location: null
history:
  adoption-history:
    - >
      helm-docs became part of chart-authoring workflows because it is easy to run
      locally, in containers, and as a pre-commit hook. The README includes pre-commit
      hook configurations and direct binary usage for regenerating READMEs.
    - >
      The README documents Homebrew, Scoop, mise, source builds, and container usage,
      while the supplied package metadata also lists Homebrew, Nix, Scoop, and openSUSE
      packaging.
  package-nerd-significance:
    - >
      helm-docs is package-nerd glue: it turns Helm charts from installable bundles into
      better documented packages. In chart repositories with many values, generated
      documentation prevents README drift and makes package review less painful.
    - >
      It is also a good example of a packaging-adjacent CLI that belongs in package
      managers because teams run it in hooks, CI, release pipelines, and local chart
      authoring environments.
  project-history:
    - >
      The public repository was created in September 2018, during the period when Helm
      charts were becoming a standard way to distribute Kubernetes applications. GitHub
      release metadata shows a v0.1.0 release in July 2019.
    - >
      The tool evolved around Go templates and chart parsing. Its default workflow
      searches recursively for `Chart.yaml`, reads values files and chart metadata, and
      renders Markdown through either a default internal template or user-supplied
      `README.md.gotmpl` files.
  related-projects:
    - Helm is the chart format and command-line ecosystem that helm-docs documents.
    - Go templates drive the Markdown rendering model.
    - pre-commit is a common workflow integration documented by the project.
    - >
      Chart.yaml, values.yaml, and README.md.gotmpl are the main chart files touched by
      the tool.
  sources:
    - https://api.github.com/repos/norwoodj/helm-docs
    - https://github.com/norwoodj/helm-docs
    - https://github.com/norwoodj/helm-docs/releases
  summary:
    - >
      helm-docs is a Go command-line tool that auto-generates Markdown documentation
      from Helm charts. Its README describes generated files that include chart metadata
      and tables of values, defaults, and descriptions parsed from comments.
    - >
      The project sits in the practical layer around Helm: once charts became a common
      packaging format for Kubernetes applications, teams needed generated, reviewable
      README files that stayed synchronized with `Chart.yaml`, `values.yaml`, and
      template conventions.
  timeline:
    - '2018: Public GitHub repository created.'
    - '2019: v0.1.0 release published.'
    - '2019: Early 0.x releases iterate on generated chart documentation.'
    - >
      2020s: README documents Homebrew, Scoop, mise, source, container, and pre-commit
      workflows.
  usage:
    - >
      A chart maintainer runs `helm-docs` in a repository, optionally with
      `--chart-search-root`, `--template-files`, or `--dry-run`. The tool finds charts,
      parses metadata and values, and writes generated Markdown back into chart README
      files.
    - >
      Comment conventions in `values.yaml` let maintainers document fields next to the
      defaults they control. That makes the generated table useful for reviewers and
      users who need to understand chart configuration without reading every template.
related-packages:
  - id: brew:helm
    reason: >
      Helm supplies the chart metadata and values structure that helm-docs parses, so it
      is the essential companion for creating, linting, packaging, and using the
      documented charts.
    rel: adjacent_workflow
    sources:
      - https://github.com/norwoodj/helm-docs#readme
      - https://helm.sh/docs/topics/charts/
  - id: brew:pre-commit
    reason: >
      helm-docs officially provides pre-commit hook configurations that regenerate chart
      READMEs when chart metadata, values, or templates change.
    rel: adjacent_workflow
    sources:
      - https://github.com/norwoodj/helm-docs#readme
      - https://pre-commit.com/
