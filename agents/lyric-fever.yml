history:
  adoption-history:
    - >
      The project is distributed as a downloadable macOS application and through
      Homebrew. Its repository presents it as a spiritual successor to LyricsX,
      retaining the menu-bar lyrics niche while emphasizing lower resource use and
      contemporary macOS APIs.
  package-nerd-significance:
    - >
      Lyric Fever packages several otherwise separate music integrations into a native
      menu-bar application: AppleScript and ScriptingBridge playback integration,
      MusicKit metadata matching, multiple lyric providers, Core Data caching, and
      on-device translation. It is notable to package users as an open-source successor
      in a small but enduring macOS lyrics-tool lineage.
  project-history:
    - >
      Lyric Fever was created as a native macOS lyrics companion for Spotify and Apple
      Music. Its official release history shows a progression from automatic menu-bar
      lyrics to fullscreen and karaoke modes, translation, local LRC support, multiple
      fallback providers, and broader Apple Music support.
  related-projects:
    - LyricsX is identified by the project as its spiritual predecessor.
    - >
      The application integrates with Spotify, Apple Music, LRCLIB, NetEase,
      MusicBrainz, and Cover Art Archive services.
  sources:
    - 'Input package metadata: source_facts.package-manager.brew-cask'
    - 'Official README: https://github.com/aviwad/LyricFever#readme'
    - 'Official releases: https://github.com/aviwad/LyricFever/releases'
  summary:
    - >
      Lyric Fever is an open-source macOS menu-bar application that synchronizes lyrics
      with Spotify and Apple Music. It also provides fullscreen, karaoke, translation,
      romanization, and offline-caching features.
  timeline:
    - 'Version 2.0: Added fullscreen, karaoke, translation, and backup lyrics.'
    - 'Version 2.1: Expanded Apple Music, local-file, translation, and romanization support.'
    - >
      Version 3: Restructured the code, restored Apple Music support, added provider
      fallback, manual search, and a redesigned menu-bar interface.
  usage:
    - >
      Users run Spotify or Apple Music and leave Lyric Fever active in the menu bar,
      where it follows the current track and displays synchronized lyrics. Optional
      fullscreen and floating karaoke modes provide larger presentations, while cached
      lyrics support later offline viewing.
