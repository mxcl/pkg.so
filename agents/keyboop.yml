history:
  adoption-history:
    - >
      Keyboop is distributed as a signed and notarized macOS application, through its
      official download and a Homebrew cask. Its audience is primarily people who type
      in Russian and English and want automatic layout correction without sending their
      input to a remote service.
  package-nerd-significance:
    - >
      Keyboop combines several normally separate desktop utilities—layout correction,
      text snippets, local speech recognition, and translation—in an inspectable Swift
      application. Its use of local Whisper or Parakeet models makes it notable among
      privacy-oriented input tools.
  project-history:
    - >
      Ivan Smetanin created Keyboop as a free, MIT-licensed macOS layout switcher. The
      official repository credits Smetanin for the product and Claude as a code
      co-author, and describes the defining design choice as inserting corrected text
      directly instead of routing every correction through the clipboard.
    - >
      The project expanded beyond Russian-English layout correction to include snippets,
      local dictation through Whisper and Parakeet, on-device translation through Apple
      Translation, encrypted dictation history, and signed automatic updates.
  related-projects:
    - >
      The official build instructions integrate whisper.cpp for speech recognition,
      FluidAudio for Parakeet inference on Apple Neural Engine, and Sparkle for
      application updates. The help page positions Keyboop as a privacy-focused
      alternative to Punto Switcher.
  sources:
    - https://github.com/iffuno/keyboop
    - https://keyboop.com/
    - https://keyboop.com/changelog/
    - https://keyboop.com/help/
    - https://keyboop.com/privacy/
  summary:
    - >
      Keyboop is a free, open-source macOS input utility that automatically corrects
      Russian-English keyboard-layout mistakes and adds local voice dictation, snippets,
      and on-device translation.
  timeline:
    - >
      2026: The public project documents more than one hundred incremental releases in
      its official changelog.
    - >
      2026: The application supports both Apple Silicon and Intel Macs, with Parakeet
      acceleration available on Apple Neural Engine hardware.
  usage:
    - >
      Keyboop watches word boundaries and corrects text entered in the wrong Russian or
      English layout. Users can manually convert text with a hotkey, expand snippets,
      dictate locally, and replace selected text with an on-device translation. Keyboard
      accessibility and microphone permissions are required for the corresponding
      features.
