history:
  adoption-history:
    - >
      The official history reports that Shimo Docs surpassed eight million users in 2017
      and experienced sixfold user growth during the 2020 pandemic and return-to-work
      period. Its official quick-start material later described use by tens of millions
      of users and hundreds of thousands of enterprises.
    - >
      The product expanded from consumer collaborative documents into a broader
      enterprise office suite, with SaaS, SDK, and private-deployment offerings and
      integrations such as DingTalk.
  package-nerd-significance:
    - >
      For package-oriented users, Shimo Docs is an example of a cloud-first
      collaborative office suite that still provides installable desktop clients. The
      Homebrew Cask packages its macOS client alongside locally installed productivity
      tools even though documents and collaboration are primarily service-backed.
  project-history:
    - >
      Wuhan Chuxin Technology was established in 2014 and launched Shimo Docs in 2015 as
      an online real-time collaborative document product. The suite subsequently added
      spreadsheets, presentations, mind maps, forms, whiteboards, team spaces, and
      enterprise controls.
    - >
      Commercialization began in 2016, the product intensified its enterprise focus from
      2017, and the company introduced the Shimo Office enterprise sub-brand in 2021.
  related-projects:
    - Shimo Office
    - DingTalk
    - Homebrew Cask
  sources:
    - https://shimo.im/about
    - https://shimo.im/blog/articles/AXXNNKDAAAF2Y.html
    - https://shimo.im/help/articles/AZ7ZKUCWACFIK.html
    - https://shimo.im/help/docs/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      石墨文档 (Shimo Docs) is a Chinese cloud collaboration and office suite with web,
      desktop, and mobile clients.
  timeline:
    - '2014: Wuhan Chuxin Technology was established.'
    - '2015: Shimo Docs was officially released as an online collaborative document product.'
    - >
      2016: The company began commercializing enterprise services and joined DingTalk's
      early recommended-app group.
    - >
      2017: The product reported more than eight million users and received Series B
      investment.
    - >
      2020: The official history reports sixfold user growth during the pandemic and
      return-to-work period.
    - '2021: The company introduced the enterprise-focused 石墨办公 (Shimo Office) sub-brand.'
  usage:
    - >
      Users create, import, edit, share, and collaboratively review documents,
      spreadsheets, presentations, forms, mind maps, and other workspace content. The
      service supports multi-device synchronization, permissions, comments, revision
      history, and team spaces.
    - >
      Official support documentation identifies the macOS desktop client's cache
      directory as /Users/<username>/Library/Application Support/com.shimo.desktop.main;
      this is a cache/data location, not an officially documented configuration-file
      location.
