id: cask:zentty
display-name: Zentty
repo: null
docs:
  - https://zentty.org/docs
config-file-location:
  macos:
    - ~/.config/zentty/config.toml
    - ~/.config/zentty/bookmarks.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied source_facts.package-manager records Homebrew Cask availability. The
      reviewed official sources do not establish broader adoption figures.
  package-nerd-significance:
    - >
      Zentty combines a native application with a bundled CLI and a documented TOML file
      suitable for dotfile management. Its reuse of libghostty connects terminal-engine
      development with a separate workspace interface.
  project-history:
    - >
      Zentty is a Zenjoy project from Leuven, Belgium. Its name derives from Zenjoy, and
      its interface combines Swift/AppKit with libghostty rendering.
  related-projects:
    - >
      Ghostty/libghostty provides terminal rendering. Claude Code, Codex, and other
      agent CLIs run within its shell panes; tmux compatibility supports selected agent
      workflows.
  sources:
    - '[Documentation overview](https://zentty.org/docs/)'
    - '[Official website](https://zentty.org/)'
    - '[Settings and portability](https://zentty.org/docs/themes-settings/)'
    - source_facts.package-manager
  summary:
    - >
      Zentty is a macOS terminal organized around persistent worklanes, terminal panes,
      and coding-agent status.
  timeline:
    - >
      2026: Official documentation describes public builds with worklanes, agent
      integrations, and an embedded CLI.
  usage:
    - >
      Users group shells, development servers, and agents into worklanes, then navigate
      to panes needing attention. Layout restoration preserves workspace structure
      between sessions.
tags:
  - coding-agents
  - developer-workflow
  - ghostty
  - macos
  - terminal-emulator
provenance:
  category-sources:
    - >
      [Official documentation](https://zentty.org/docs/) identifies a native macOS
      terminal for agent-driven development.
  display-name-sources:
    - '[Official website](https://zentty.org/) uses Zentty.'
  docs-sources:
    - >
      [Environment reference](https://zentty.org/docs/reference/) documents
      ZENTTY_PANE_TOKEN for local IPC, but no credentials file. Credentials-path
      confidence: medium; null means no documented file.
    - >
      [Official documentation](https://zentty.org/docs/) is the dedicated documentation
      section.
    - >
      [Settings guide](https://zentty.org/docs/themes-settings/) and [file
      reference](https://zentty.org/docs/reference/) explicitly document config.toml and
      bookmarks.json. Config-path confidence: high; documentation describes macOS.
  history-sources:
    - '[Documentation overview](https://zentty.org/docs/)'
    - '[Official website](https://zentty.org/)'
    - '[Settings and portability](https://zentty.org/docs/themes-settings/)'
    - source_facts.package-manager
  repo-sources:
    - >
      source_facts.repo already contains a repository URL; repo is null as instructed,
      without reassessing it.
  tags-sources:
    - >
      [Official documentation](https://zentty.org/docs/) describes the platform,
      terminal engine, and agent workflows.
category-confidence: high
