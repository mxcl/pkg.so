history:
  adoption-history:
    - >
      ICR is a smaller companion package rather than part of Crystal's core
      distribution. The README documents source installation with make, use as a shard
      dependency, and an Arch AUR package; the supplied package metadata adds Homebrew
      and Nix packaging, showing that language-adjacent developer tools often get
      packaged separately from the compiler.
  package-nerd-significance:
    - >
      ICR is significant mostly as a packaging companion to Crystal. Its usefulness
      depends on matching the installed Crystal compiler, readline, and LLVM development
      files, so it illustrates why language ecosystems often need small auxiliary
      formulae beyond the main runtime.
  project-history:
    - >
      The official GitHub repository was created in 2016 under the crystal-community
      organization. Its README presents the tool as an interactive console for Crystal
      and credits Potapov Sergey as creator and maintainer, with later community
      contributors adding support for newer Crystal versions, records, require flags,
      syntax highlighting, and maintenance.
  related-projects:
    - >
      ICR is directly tied to Crystal and Shards. The README also points to
      inf-crystal.el as an editor integration for connecting Emacs to an ICR subprocess.
  sources:
    - https://github.com/crystal-community/icr
    - https://api.github.com/repos/crystal-community/icr
  summary:
    - >
      ICR, short for Interactive Crystal, is a REPL-like console for the Crystal
      programming language. It exists because Crystal is normally compiled, so an
      interactive shell has to simulate the Ruby-style irb experience by generating and
      running Crystal programs behind the scenes.
  timeline:
    - '2016: The official GitHub repository was created.'
    - >
      2021: The repository's last pushed timestamp in the GitHub API indicates
      maintenance activity through the Crystal 0.x/early 1.x era.
  usage:
    - >
      ICR is used like irb for Crystal: each submitted instruction is accumulated into a
      generated Crystal program, executed, and presented as if only the new instruction
      ran. It supports requiring local files or shards from the command line and
      includes console commands such as paste, debug, quit, exit, and reset.
related-packages:
  - id: brew:crystal
    reason: >
      ICR requires the Crystal compiler to generate and execute each accumulated
      interactive program, so Crystal is its essential companion toolchain.
    rel: adjacent_workflow
    sources:
      - https://github.com/crystal-community/icr#readme
      - https://crystal-lang.org/reference/latest/
