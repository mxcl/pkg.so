id: brew:lazy-tmux
display-name: lazy-tmux
repo: null
docs:
  - https://lazy-tmux.xyz/
  - https://lazy-tmux.xyz/configuration
config-file-location:
  unix:
    - $LAZY_TMUX_CONFIG
    - $XDG_CONFIG_HOME/lazy-tmux/lazy-tmux.toml
    - ~/.config/lazy-tmux/lazy-tmux.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      lazy-tmux is available as a standalone binary, a Homebrew package, and a Docker
      image. Its official repository documents compatibility testing across tmux
      releases 2.9 through 3.7b.
  package-nerd-significance:
    - >
      tmux session persistence has a long-standing ecosystem of plugins and scripts.
      lazy-tmux is distinctive for lazy restoration, optional scrollback capture,
      process replay controls, an autosave daemon, and a searchable TUI, reducing the
      cost of restoring large saved environments.
  project-history:
    - >
      Anton Grishin created lazy-tmux as a Go command-line session manager for saving
      tmux sessions and restoring them on demand. The project developed beyond basic
      snapshots to include layouts, running commands, environment data, scrollback,
      autosave, and interactive session selection.
  related-projects:
    - tmux is the terminal multiplexer whose sessions lazy-tmux saves and restores.
    - fzf can be used as an optional lightweight selection engine.
  sources:
    - https://github.com/alchemmist/lazy-tmux#readme
    - https://lazy-tmux.xyz/
    - https://lazy-tmux.xyz/configuration/
  summary:
    - >
      lazy-tmux is a Go-based tmux session snapshot and restoration utility. It can
      preserve sessions, windows, panes, layouts, commands, and optional scrollback,
      then restore selected state lazily.
  timeline:
    - >
      2026: The official project site documents lazy restoration, a TUI picker,
      autosave, and optional scrollback recovery.
  usage:
    - >
      Users snapshot tmux state, browse saved sessions through the built-in TUI or
      optional fzf integration, and restore only the desired session or window. An
      optional TOML file controls snapshot storage, autosave timing, scrollback,
      timeouts, and command replay allowlists or denylists.
related-packages:
  - id: brew:tmux
    reason: >
      tmux provides the sessions, windows, panes, and layouts that lazy-tmux snapshots
      and restores, so it is the essential companion runtime.
    rel: adjacent_workflow
    sources:
      - https://github.com/alchemmist/lazy-tmux
      - https://github.com/tmux/tmux/wiki
  - id: brew:fzf
    reason: >
      lazy-tmux can use fzf as an optional lightweight session or window selection
      engine when its full built-in TUI is unnecessary.
    rel: adjacent_workflow
    sources:
      - https://github.com/alchemmist/lazy-tmux
      - https://github.com/junegunn/fzf
