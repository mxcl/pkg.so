history:
  adoption-history:
    - >
      The README notes packaging for Ubuntu and Homebrew, which reflects ditaa's role as
      a small documentation-adjacent utility rather than a full application platform.
      Its longevity comes from a stable input format: diagrams remain editable as plain
      text and can be re-rendered as the tool improves.
  package-nerd-significance:
    - >
      ditaa is notable because it treats ASCII diagrams as source code: diffable,
      embeddable in comments or docs, and convertible during builds. That makes it a
      natural package-manager resident for documentation pipelines and text-centric
      developer workflows.
  project-history:
    - >
      The official README expands the name as 'DIagrams Through Ascii Art' and says the
      author built it partly for hack value and partly to modernize ASCII diagrams in
      old FAQs, text documents, source comments, and markup formats. The GitHub
      repository was created in 2011, while the project site and README preserve the
      older Java-utility style of distribution.
  related-projects:
    - >
      Graphviz and PlantUML serve adjacent diagram-as-code workflows, but ditaa is
      unusual in rendering free-form ASCII art rather than a formal graph language.
    - >
      DocBook, HTML, LaTeX, and Javadoc are named in the README as text-based formats
      where rendered diagrams can be embedded.
  sources:
    - https://ditaa.sourceforge.net/
    - https://github.com/stathissideris/ditaa#readme
    - https://api.github.com/repos/stathissideris/ditaa
  summary:
    - >
      ditaa is a Java command-line utility that converts diagrams drawn in ASCII art
      into bitmap graphics. It became a familiar helper for people who wanted text-first
      diagrams in documentation but nicer rendered output for readers.
  timeline:
    - '2011: Official GitHub repository created.'
    - '2010s: README documents Ubuntu and Homebrew package availability.'
    - '2022: Repository metadata shows maintenance activity into the 2020s.'
  usage:
    - >
      Users invoke the jar or packaged ditaa command against a text diagram and output
      an image. The tool recognizes ASCII line art, shape markup, color codes, tags for
      document or storage shapes, HTML pre blocks, transparency, antialiasing, SVG
      output, scaling, and other rendering options.
related-packages:
  - id: brew:emacs
    reason: >
      GNU Emacs Org Babel can execute ditaa source blocks and insert the generated
      diagrams directly into Org documents.
    rel: adjacent_workflow
    sources:
      - https://github.com/stathissideris/ditaa#readme
      - https://orgmode.org/worg/org-contrib/babel/languages/ob-doc-ditaa.html
      - https://www.gnu.org/software/emacs/
