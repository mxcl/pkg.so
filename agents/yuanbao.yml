history:
  adoption-history:
    - >
      Tencent integrated Yuanbao into its wider product ecosystem and described Hunyuan
      as embedded across core products including WeChat, QQ, Tencent Meeting, and
      Tencent Docs. Later official reporting also discussed adding Yuanbao as a WeChat
      contact and using large language models in search-related experiences.
  package-nerd-significance:
    - >
      Yuanbao is notable in desktop packaging as a first-party consumer AI assistant
      from one of China's largest software platforms. The cask provides a conventional
      macOS installation path for a service otherwise centered on Tencent's cloud models
      and ecosystem.
  project-history:
    - >
      Tencent publicly launched its AI assistant Yuanbao in May 2024, building it on the
      company's Hunyuan foundation model. Subsequent official materials describe
      continued integration with Tencent services and the use of additional model
      capabilities, including DeepSeek.
  related-projects:
    - >
      Yuanbao is closely related to Tencent Hunyuan, Tencent's foundation-model family,
      and is integrated with services across Tencent's consumer and productivity
      ecosystem.
  sources:
    - 'Official product site: https://yuanbao.tencent.com/'
    - >
      Tencent 2024 interim results:
      https://static.www.tencent.com/uploads/2024/08/14/424baf5fd758722f4d0c0c6362488b67.pdf
    - 'Tencent corporate history: https://www.tencent.com/zh-cn/who-we-are/our-story/'
  summary:
    - >
      Tencent Yuanbao is a consumer AI assistant launched in 2024 and built around
      Tencent's Hunyuan model ecosystem, with later support for additional models and
      Tencent-service integrations.
  timeline:
    - '2024-05: Tencent launched the Yuanbao AI assistant.'
    - >
      2024: Tencent reported Yuanbao as a public-facing application of its Hunyuan
      foundation model.
    - >
      2025: Tencent described deeper Yuanbao integration across its services and
      AI-search experiences.
  usage:
    - >
      Users interact with Yuanbao for conversational questions, searching and
      synthesizing information, writing and content assistance, document-oriented work,
      and multimodal AI tasks through Tencent's official applications and services.
