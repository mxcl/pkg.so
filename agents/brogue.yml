history:
  adoption-history:
    - >
      Brogue's adoption sits in roguelike culture more than conventional infrastructure:
      players share seeds, recordings, challenges, and strategy around a deterministic
      single-player dungeon. CE became the default distribution path after the original
      website pointed current downloads to the GitHub releases page.
    - >
      In package managers, Brogue CE gives terminal and desktop users a reproducible way
      to install a living roguelike without chasing platform-specific zip files. The
      input package facts show packaging in Homebrew and Alpine, matching its mixed
      terminal/SDL audience.
  package-nerd-significance:
    - >
      Brogue CE matters to package nerds because it is a living example of how game
      preservation, community stewardship, and package-manager distribution overlap. The
      package is also culturally interesting because it carries classic roguelike
      conventions into modern CI, release artifacts, and cross-platform packaging.
  project-history:
    - >
      The original Brogue site identifies Brogue as a roguelike for Mac OS X, Windows,
      and Linux by Brian Walker and now directs users to Brogue: Community Edition for
      the current version. The CE repository describes itself as a continuation of Brian
      Walker's game, with goals of fixing bugs and crashes, improving gameplay, easing
      maintenance, and serving as a base for forks and ports.
    - >
      Brogue CE's release lineage starts from the original game's 1.7-era heritage and
      moved through CE 1.8 and 1.9 toward a more active community cadence. The changelog
      records a notable shift around CE 1.10: the maintainers said CE had matured, Brian
      Walker was involved in development, and the project became open to original
      gameplay changes as well as preservation-oriented maintenance.
  related-projects:
    - >
      Brogue belongs to the roguelike family alongside NetHack, Angband, Dungeon Crawl
      Stone Soup, and Cataclysm-style descendants, while its CE model resembles other
      community continuations that keep beloved games buildable on current systems.
  sources:
    - https://github.com/tmewett/BrogueCE#readme
    - https://raw.githubusercontent.com/tmewett/BrogueCE/master/CHANGELOG.md
    - https://sites.google.com/site/broguegame/
    - source_facts.package-manager
  summary:
    - >
      Brogue CE is the community-maintained continuation of Brogue, Brian Walker's
      minimalist roguelike. It preserves the original dungeon-crawler design while
      adding bug fixes, platform maintenance, quality-of-life features, variants,
      graphical improvements, and ongoing balance work.
  timeline:
    - 'Original era: Brian Walker creates Brogue for Mac OS X, Windows, and Linux.'
    - 'CE era: Brogue: Community Edition launches as a continuation of the original game.'
    - '2020: CE release tags include the 1.8 and 1.9 series.'
    - >
      CE 1.10: Maintainers document a broader scope, including original gameplay changes
      with Brian Walker involved.
    - '2026-02-12: GitHub lists Brogue CE 1.15.1 as the latest release at the time researched.'
  usage:
    - >
      Players run `brogue` to descend through a procedurally generated dungeon, retrieve
      the Amulet of Yendor from depth 26, and optionally return to the surface. CE
      supports graphical tiles, terminal/curses builds, command-line options,
      recordings, seed catalogs, and variants such as Rapid Brogue and Bullet Brogue.
