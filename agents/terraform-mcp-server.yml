    - <project>/.gemini/.env
history:
  adoption-history:
    - >
      Because it is an official HashiCorp project in a new tool category, adoption is
      still young but visible in package-manager channels. Homebrew packaged v1.0.0 and
      reported hundreds of installs over the preceding year, while the GitHub repository
      accumulated more than a thousand stars by mid-2026.
  package-nerd-significance:
    - >
      For package nerds, terraform-mcp-server marks the Terraform ecosystem's move from
      human-only CLIs into agent-facing package surfaces: a Homebrew-installable binary
      whose real job is to let editors and LLM clients discover Terraform metadata and
      act against Terraform services.
  project-history:
    - >
      HashiCorp created the terraform-mcp-server repository in April 2025, during the
      early wave of Model Context Protocol tooling for developer agents. The README
      describes a server that integrates with Terraform Registry APIs and supports both
      stdio and Streamable HTTP transports.
    - >
      The project moved quickly from early 0.x releases to v1.0.0 in June 2026. Its
      README examples show installation through Docker or a local binary and
      configuration in MCP-capable clients such as Visual Studio Code agent mode, with
      optional HCP Terraform and Terraform Enterprise access through TFE environment
      variables.
  related-projects:
    - >
      Terraform Registry, HCP Terraform, and Terraform Enterprise are the main Terraform
      services exposed by the server.
    - >
      Model Context Protocol clients such as Visual Studio Code agent mode are
      documented as launch surfaces.
  sources:
    - https://api.github.com/repos/hashicorp/terraform-mcp-server
    - https://api.github.com/repos/hashicorp/terraform-mcp-server/releases
    - https://formulae.brew.sh/api/formula/terraform-mcp-server.json
    - https://github.com/hashicorp/terraform-mcp-server#readme
  summary:
    - >
      terraform-mcp-server is HashiCorp's MCP server for connecting AI assistants and
      agentic development tools to Terraform Registry, HCP Terraform, and Terraform
      Enterprise workflows.
  timeline:
    - '2025: Repository created and v0.1.0 released.'
    - '2026: v1.0.0 released and packaged by Homebrew.'
    - '2026: README documents stdio and Streamable HTTP transports for MCP clients.'
  usage:
    - >
      The server is run in stdio mode for local MCP clients or in Streamable HTTP mode
      for networked clients. Its tools expose Terraform Registry providers, modules,
      policies, HCP Terraform workspaces, organization and project listing, private
      registry access, and guarded Terraform operations.
    - >
      The README warns that server responses may expose Terraform data to MCP clients
      and LLMs, so users are expected to connect it only to trusted clients and to
      review dynamic recommendations before applying them.
