history:
  adoption-history:
    - >
      Postman distributes the CLI as a signed and supported companion to its desktop and
      cloud platform. Official installation methods include npm, native Windows
      installation, and a Unix installation script, making it suitable for developer
      workstations and CI/CD runners.
  package-nerd-significance:
    - >
      The CLI brings Postman's collection-oriented API workflow into terminals and
      automated pipelines. Package users care because it supplies an officially
      supported alternative to manually exporting work to Newman while retaining Postman
      authentication, cloud synchronization, governance, monitoring, and newer platform
      commands.
  project-history:
    - >
      Postman describes its CLI as being based on Newman, the company's earlier
      command-line collection runner. The newer Postman CLI broadened that foundation
      into a supported interface for individual requests, collections, workspaces,
      datasets, mock servers, monitors, performance tests, API governance, webhooks,
      Flows, and SDK generation.
  related-projects:
    - Newman is the open-source collection runner on which Postman says the CLI is based.
    - >
      The Postman desktop application and Postman cloud workspaces provide the graphical
      and hosted sides of the same API-development platform.
  sources:
    - >
      Official authentication guide:
      https://learning.postman.com/docs/postman-cli/postman-cli-auth
    - >
      Official command reference:
      https://learning.postman.com/docs/postman-cli/postman-cli-options
    - >
      Official installation guide:
      https://learning.postman.com/docs/postman-cli/postman-cli-installation
    - 'Official overview: https://learning.postman.com/docs/postman-cli/postman-cli-overview'
  summary:
    - >
      Postman CLI is Postman's signed and supported command-line tool for API
      development, testing, workspace synchronization, automation, and platform
      management.
  timeline:
    - 'Post-Newman era: Postman introduced a broader official CLI based on Newman.'
    - >
      Version 1.39.1: The command set added support for Postman's newer API-governance
      experience.
    - 'Version 1.46.1: Version represented by the supplied package record.'
  usage:
    - >
      Developers use the `postman` command to send and test requests, run collections
      locally or in CI/CD, synchronize local collections and environments with cloud
      workspaces, manage Postman resources, and authenticate interactively or with an
      API key. Local-only operations can run without login, while cloud operations
      require authentication.
