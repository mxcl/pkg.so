id: brew:bvi
display-name: bvi
repo: https://github.com/buergmann/bvi
docs:
  - https://bvi.sourceforge.net/man_bvi.html
  - https://bvi.sourceforge.net/overview.php
  - https://bvi.sourceforge.net/quick.php
config-file-location:
  unix:
    - ~/.bvirc
    - ./.bvirc
credentials-file-location: null
history:
  adoption-history:
    - >
      bvi spread through traditional Unix packaging channels because it solves a small
      but durable problem: editing binary files from a terminal with vi muscle memory.
      The official download page links to Debian, FreeBSD, Fedora, MacPorts, HP-UX,
      Solaris, Cygwin, and older static Linux executables; the supplied package facts
      also show Homebrew, Alpine, Nix, Ubuntu, and zypper packaging.
  package-nerd-significance:
    - >
      bvi is a classic small Unix utility: curses-based, vi-shaped, and useful when
      heavyweight GUI hex editors are unavailable. Its packaging significance comes from
      portability and from the fact that it preserves vi semantics in a domain where
      line-oriented editor assumptions break.
  project-history:
    - >
      The official home page describes bvi as a display-oriented editor for binary
      files, based on the vi text editor, and notes that the package also includes the
      bmore viewer. The README in the official GitHub repository identifies Gerhard
      Buergmann as the author and states that bvi is distributed under the GPL.
    - >
      The project has a long SourceForge release history: the download page lists 1.3.0
      in 2001, 1.3.1 in 2002, 1.3.2 in 2004, 1.4.x releases in 2014, 2019, and 2023, and
      1.5.0 as the stable release in 2025.
  related-projects:
    - vi is the command model bvi adapts for binary editing.
    - bmore is the binary viewer included with bvi.
    - >
      Other hex editors occupy the same niche, but bvi is distinct for keeping vi-style
      modal editing.
  sources:
    - https://bvi.sourceforge.net/
    - https://bvi.sourceforge.net/download.php
    - https://bvi.sourceforge.net/links.php
    - https://bvi.sourceforge.net/man_bvi.html
    - https://github.com/buergmann/bvi
  summary:
    - >
      bvi is a vi-style binary and hex editor by Gerhard Buergmann. It keeps the modal,
      command-oriented feel of vi while treating files as byte streams rather than text
      lines.
  timeline:
    - '2001: bvi 1.3.0 source release is listed on the official download page.'
    - '2004: bvi 1.3.2 source and RPM-era packages are listed.'
    - '2014: bvi 1.4.0 source release is listed.'
    - '2023: bvi 1.4.2 source release is listed.'
    - '2025: bvi 1.5.0 is listed as the current stable release.'
  usage:
    - >
      bvi is used for direct inspection and patching of binary files. Its manpage
      explains the three-pane display with byte offsets, hex bytes, and printable
      characters, byte-offset ranges instead of line ranges, hex search commands,
      read-only mode, partial file loading, and startup commands via BVIINIT, ~/.bvirc,
      or ./.bvirc.
related-packages: []
tags:
