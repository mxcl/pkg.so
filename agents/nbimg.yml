history:
  adoption-history:
    - >
      This is a preservation-and-specialist package, not a broad developer tool. GitHub
      API data retrieved on 2026-07-01 showed 10 stars and 6 forks, and Homebrew
      Formulae reported only 8 installs over the prior 365 days.
    - >
      Its practical audience is people working with old smartphone firmware images or
      boot splash customization workflows where NB, BMP, or NBH splash formats still
      appear.
  package-nerd-significance:
    - >
      nbimg is useful mostly as a format fossil: tiny, specific, and still installable
      through Homebrew for the rare case where old mobile boot-splash tooling is needed.
  project-history:
    - >
      The original release post was published on 2008-07-03 by Pau Oliva. It described
      nbimg as a command-line HTC splash screen tool that could convert NB to BMP and
      BMP to NB, autodetect image dimensions, support any splash screen size, and handle
      devices such as the Diamond and Athena at 640x480.
    - >
      The GitHub repository was created on 2012-06-18 and now mainly preserves the
      source and download references. The repository tags include v1.1, v1.2, and
      v1.2.1; there are no GitHub Releases listed by the releases API.
  sources:
    - https://api.github.com/repos/poliva/nbimg
    - https://api.github.com/repos/poliva/nbimg/tags
    - https://formulae.brew.sh/api/formula/nbimg.json
    - https://github.com/poliva/nbimg
    - https://pof.eslack.org/2008/07/03/nbimg-htc-splash-screen-tool/
    - https://raw.githubusercontent.com/poliva/nbimg/master/README.md
  summary:
    - >
      nbimg is a very small boot-splash conversion utility for older HTC, Android, and
      Windows CE smartphone images, converting between NB splash-screen files and BMP
      images.
  timeline:
    - '2008-07-03: original nbimg HTC splash screen tool post published.'
    - '2012-06-18: poliva/nbimg repository created on GitHub.'
    - '2019-09-24: latest GitHub push date reported by the GitHub API retrieval on 2026-07-01.'
    - '2026-07-01: Homebrew Formulae reported stable version 1.2.1.'
  usage:
    - >
      The original CLI takes -F with a .nb or .bmp file; a BMP input is encoded to NB,
      and an NB input is decoded to BMP. Optional flags set width, height, padding
      pattern, padding size, smartphone output mode, and NBH metadata such as model ID
      and header type.
    - >
      Package users install it when they need exactly that file-format bridge. There is
      little sign of a modern ecosystem around it beyond keeping the converter buildable
      and packaged.
