id: brew:babeld
display-name: babeld
repo: https://github.com/jech/babeld
docs:
  - https://www.irif.fr/~jch/software/babel
  - https://www.irif.fr/~jch/software/babel/babeld.html
config-file-location:
  unix:
    - /etc/babeld.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Babel's adoption has been strongest in wireless mesh, ad-hoc, and small routing
      deployments where fast convergence, loop avoidance, and link-quality awareness
      matter. The official project page also documents related implementations,
      including FRR's Babel support and pybabel.
    - >
      The package metadata in this batch shows babeld available through Homebrew,
      Debian, Ubuntu, Fedora, Arch, Alpine, and Nix. That makes it a broadly packaged
      routing daemon despite its specialized networking niche.
  package-nerd-significance:
    - >
      babeld is a tidy example of a serious network protocol delivered as a small Unix
      daemon. For package maintainers, it has the interesting traits of real routing
      software without the size and policy surface of a full routing suite.
    - >
      It also sits at the meeting point of RFC standardization and grassroots mesh
      networking, which makes its package history more interesting than its low-key
      command name suggests.
  project-history:
    - >
      Babel was designed by Juliusz Chroboczek as a loop-avoiding distance-vector
      protocol with fast convergence properties, drawing ideas from DSDV, AODV, and
      EIGRP while adding link-cost estimation and route redistribution.
    - >
      The babeld manual presents the daemon as the operational implementation: it runs
      on selected interfaces, sends routing updates over the protocol port, installs
      routes into the kernel, and supports a configuration file, local control
      interface, route filtering, and redistribution.
    - >
      Babel was standardized first as RFC 6126 and then revised as RFC 8966. That
      standards path gave babeld significance beyond a standalone daemon: it became one
      of the concrete implementations behind an IETF routing protocol.
  related-projects:
    - >
      FRR includes a Babel implementation based on babeld, though the official Babel
      page warns that version is obsolete and not recommended.
    - pybabel is an independent Python implementation of the IPv6 subset of RFC 6126.
    - DSDV, AODV, and EIGRP are named by the Babel project as protocol influences.
    - >
      bird2 and other routing suites are adjacent package-manager alternatives for
      dynamic routing, though Babel's daemon remains its focused implementation.
  sources:
    - https://datatracker.ietf.org/doc/html/rfc6126
    - https://datatracker.ietf.org/doc/html/rfc8966
    - https://github.com/jech/babeld
    - https://www.irif.fr/~jch/software/babel/
    - https://www.irif.fr/~jch/software/babel/babeld.html
    - input.json source_facts.package-manager
  summary:
    - >
      babeld is the reference-style Unix daemon for Babel, a loop-avoiding
      distance-vector routing protocol for IPv6 and IPv4. It is optimized for wireless
      mesh networks but also works on wired networks, making it a small, practical
      routing daemon for experimental, community, and mixed-link networks.
  timeline:
    - '2011: Babel is standardized as RFC 6126.'
    - '2018: babeld 1.8.x releases appear in the official Git tag history.'
    - '2021: Babel is revised and standardized as RFC 8966.'
    - >
      2026: babeld package metadata shows continuing availability across major Unix
      package managers.
  usage:
    - >
      Operators run babeld on one or more network interfaces to exchange Babel routes.
      The daemon can read /etc/babeld.conf by default, preserve long-term state, install
      kernel routes, export routes from routing tables, and expose a local configuration
      protocol.
    - >
      babeld is usually used on mesh routers, lab networks, community wireless networks,
      and dual-stack IPv4/IPv6 environments where a compact dynamic routing daemon is
      preferable to heavier routing suites.
related-packages: []
