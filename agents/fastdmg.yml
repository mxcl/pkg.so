history:
  adoption-history:
    - >
      FastDMG is intended to become the Finder's default handler for DMG and other
      supported disk-image formats. Homebrew Cask provides an additional installation
      path for macOS users.
    - >
      The author reports having used the utility for more than a decade, while the
      published release history begins with its first native, non-Platypus release in
      2018.
  package-nerd-significance:
    - >
      Disk images are central to macOS software distribution, so a lightweight
      alternative handler is directly relevant to people who repeatedly download,
      inspect, and mount packaged applications.
    - >
      FastDMG is a small native wrapper around macOS's built-in hdiutil, illustrating
      the package-nerd preference for focused utilities that expose existing system
      capabilities with less interface overhead.
  project-history:
    - >
      Sveinbjörn Þórðarson developed FastDMG as a fast, unobtrusive alternative to
      Apple's DiskImageMounter. It is a native Objective-C/Cocoa application and a
      minimal wrapper around the hdiutil utility included with macOS.
    - >
      The first native non-Platypus release appeared in 2018. Later releases added
      Developer ID signing, Apple-silicon support through a universal binary, and Apple
      notarization.
  related-projects:
    - >
      FastDMG wraps Apple's hdiutil and indirectly uses the macOS DiskImages framework.
      It replaces DiskImageMounter for Finder-opened disk-image files rather than
      creating disk images.
  sources:
    - https://github.com/sveinbjornt/FastDMG
    - https://sveinbjorn.org/fastdmg
    - >
      https://sveinbjorn.org/news/2018-05-24-11-12-28/Faster-disk-image-mounting-with-FastDMG.html
    - source_facts.description
  summary:
    - >
      FastDMG is an open-source macOS utility that quickly mounts DMG, ISO, Toast, and
      other disk images as an alternative to DiskImageMounter.
  timeline:
    - '2018: FastDMG received its first native non-Platypus release.'
    - '2019: The application added Developer ID signing and Mojave Dark Mode support.'
    - '2020: FastDMG became a universal Intel and Apple-silicon application.'
    - '2025: The application was notarized by Apple.'
  usage:
    - >
      Users install FastDMG, select it under Finder's Open with setting for a disk-image
      file, and apply Change All. FastDMG then handles supported images when they are
      opened.
    - >
      The application runs without a Dock icon, windows, or menus and can mount several
      images concurrently. It requires no credentials, and the official usage
      documentation does not identify a persistent user configuration file.
