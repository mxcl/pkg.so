config-file-location:
  linux:
    - /etc/sensors3.conf
    - /etc/sensors.d/*
    - /etc/fancontrol
credentials-file-location: null
history:
  adoption-history:
    - >
      lm-sensors became a standard Linux hardware-monitoring plumbing package because
      the kernel drivers expose data through sysfs, while libsensors supplies
      board-specific labels and conversion rules that applications can share instead of
      duplicating. The upstream README asks users to contribute board configurations so
      others with the same hardware do not need to recreate them.
    - >
      Package-manager adoption is broad in the supplied package data, with entries
      across Alpine, Debian, Fedora, Homebrew, Nix, Arch, Ubuntu, and openSUSE families.
      That matches its role as the CLI backend behind many desktop monitors, server
      dashboards, and home-lab scripts.
  package-nerd-significance:
    - >
      lm-sensors is one of those small packages that makes an entire category of system
      tooling possible. It turns messy per-board hwmon naming into stable CLI and
      library output, so package maintainers, monitoring stacks, and shell scripts can
      depend on sensors rather than chasing individual chip drivers.
    - >
      For Homebrew and other Unix package sets, lm-sensors is interesting because its
      upstream is Linux-specific even when package metadata can appear in cross-platform
      indexes. The useful behavior depends on Linux kernel hwmon support, sysfs, and
      local hardware.
  project-history:
    - >
      The current lm-sensors version 3 line provides user-space support for Linux
      hardware monitoring drivers in Linux 2.6.5 and later, while older kernels require
      the version 2 line. The package is organized around documentation, sample
      configuration files, libsensors, and programs such as sensors-detect, sensors,
      sensord, fancontrol, and pwmconfig.
    - >
      The version 3 CHANGES file records the 3.0.0 release cycle in 2007, including the
      initial 3.0.0-rc1 release, the switch to the default /etc/sensors3.conf
      configuration file during the release candidates, and the 3.0.0 final release in
      November 2007. Later releases continued to track new kernel hwmon attributes, chip
      families, JSON output, systemd integration, and new configuration samples.
  related-projects:
    - >
      The Linux kernel hwmon subsystem, libsensors, sensors-detect, fancontrol,
      pwmconfig, sensord, GNOME Sensors Applet, Psensor, PowerTOP, and s-tui are closely
      related in the upstream documentation.
  sources:
    - https://github.com/lm-sensors/lm-sensors#readme
    - https://raw.githubusercontent.com/lm-sensors/lm-sensors/master/CHANGES
    - https://raw.githubusercontent.com/lm-sensors/lm-sensors/master/lib/sensors.conf.5
    - https://raw.githubusercontent.com/lm-sensors/lm-sensors/master/prog/pwm/fancontrol
    - https://raw.githubusercontent.com/lm-sensors/lm-sensors/master/prog/pwm/fancontrol.8
    - source_facts.package-manager-url
  summary:
    - >
      lm-sensors is the Linux user-space package for reading and configuring
      hardware-monitoring data such as temperatures, voltages, fan speeds, and PWM fan
      control.
  timeline:
    - '2007-09-25: lm-sensors 3.0.0-rc1 is marked as the initial version 3 release.'
    - >
      2007-10-28: The 3.0.0-rc3 notes record /etc/sensors3.conf as the default
      configuration file.
    - '2007-11-24: lm-sensors 3.0.0 is released.'
    - '2019-10-18: lm-sensors 3.6.0 adds JSON-related fixes and many sensor-detection updates.'
    - '2024-01-13: lm-sensors 3.6.2 adds richer sensor metadata and JSON output changes.'
  usage:
    - >
      Typical use starts with running sensors-detect as root so the tool can identify
      installed hardware and recommend kernel modules. The sensors command reports
      current readings and can set limits, while sensord can watch values, log alarms,
      and feed an RRD database.
    - >
      libsensors reads kernel hwmon data from /sys and applies labels or scaling from
      configuration files. fancontrol reads its own configuration, usually generated by
      pwmconfig, and adjusts PWM outputs from temperature readings; upstream warns users
      to configure fan control carefully because bad settings can damage hardware.
related-packages:
  - id: brew:gkrellm
    reason: >
      Use GKrellM when you want a graphical Linux system monitor that displays
      temperature, voltage, and fan readings supplied through lm-sensors and kernel
      hardware-monitoring interfaces.
    rel: adjacent_workflow
    sources:
      - https://billw2.github.io/gkrellm/gkrellm.html
      - https://github.com/lm-sensors/lm-sensors#readme
  - id: brew:i2c-tools
    reason: >
      Use i2c-tools alongside lm-sensors to inspect general-purpose Linux I2C buses and
      devices; its official README records that it was split from lm-sensors.
    rel: adjacent_workflow
    sources:
      - https://git.kernel.org/pub/scm/utils/i2c-tools/i2c-tools.git/plain/README
      - https://github.com/lm-sensors/lm-sensors#readme
