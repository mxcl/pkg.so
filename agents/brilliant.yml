history:
  adoption-history:
    - >
      Brilliant moved from a private alpha in February 2026 into frequent beta releases.
      During the beta period it added Windows support, hosted integrations for coding
      agents, browser-based editing and publishing, multiplayer collaboration, teams,
      and increasingly complete Figma import.
  package-nerd-significance:
    - >
      Brilliant treats design artifacts as plain-text Blueprint files and exposes its
      canvas through MCP. This makes designs amenable to version-control review and lets
      terminal and editor agents such as Claude Code, Cursor, Codex, and Copilot operate
      on the same editable canvas as a human designer.
  project-history:
    - >
      The official changelog begins with a private alpha announced in February 2026.
      Early releases concentrated on the native vector canvas, shader rendering,
      Blueprint, and Claude Code integration.
    - >
      The 2026 beta series rapidly expanded agent connections, Figma interchange, web
      publishing, multiplayer editing, teams, design systems, Windows support, and
      exports to vector, raster, video, HTML, and React formats.
  related-projects:
    - Blueprint design language
    - Brilliant MCP server
    - Brilliant Figma plugin
    - Claude Code
    - Cursor
    - OpenAI Codex
    - GitHub Copilot
  sources:
    - https://brilliant.design/
    - https://brilliant.design/docs/ai/providers-and-models
    - https://brilliant.design/docs/changelog/changelog
    - https://brilliant.design/docs/workspace/settings
  summary:
    - >
      Brilliant is an AI-native professional design application built around an editable
      vector canvas, a plain-text design language, design systems, and connections to
      external coding agents through MCP.
  timeline:
    - "February 27, 2026: Brilliant's private alpha was announced."
    - >
      April 2026: The beta series added onboarding, Figma import, and deeper Claude Code
      integration.
    - >
      July 2026: Hosted Codex sessions, web publishing, multiplayer editing, and the
      browser editor arrived.
    - >
      August 2026: Teams, expanded Figma migration, and hosted Cursor sessions were
      introduced.
    - >
      September 2026: The beta series continued with performance, sync, agent, and
      reliability improvements.
  usage:
    - >
      Designers and developers create and edit vector interfaces manually or through the
      built-in AI chat, connect external MCP-capable agents, import Figma work, apply
      token-based design systems, collaborate, and export PNG, SVG, PDF, video, HTML, or
      React output.
    - >
      Optional third-party AI API keys are entered in Settings and stored in macOS
      Keychain or Windows Credential Manager. They are not stored in a documented
      credentials file or synchronized to Brilliant's servers.
