config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      TCP Viewer is distributed as a signed macOS application and through a Homebrew
      cask. The project later opened its full source under GPL-2.0-or-later and added
      command-line and MCP interfaces alongside the graphical application.
  package-nerd-significance:
    - >
      TCP Viewer combines a native AppKit interface with libpcap capture and Wireshark
      protocol libraries. It is notable as a Mac-focused, open-source alternative for
      users who want Wireshark-grade decoding with a narrower interface, standard PCAP
      interoperability, CLI automation, and package-manager installation.
  project-history:
    - >
      The Proxyman team created TCP Viewer as a native macOS packet viewer. Version 1.0
      initially focused on opening, inspecting, and exporting captures. Subsequent
      releases added live capture through a privileged local helper, Wireshark-backed
      decoding, traffic grouping, stream following, session files, a CLI, and MCP
      integration.
  related-projects:
    - >
      Wireshark supplies the protocol-analysis libraries used by TCP Viewer. Proxyman
      and Tiny Shield are other network products from the same team.
  sources:
    - 'Official changelog: https://tcpviewer.proxyman.com/docs/changelog'
    - 'Official documentation: https://tcpviewer.proxyman.com/docs'
    - 'Official repository: https://github.com/ProxymanApp/TCPViewer'
    - 'Official website: https://tcpviewer.proxyman.com/'
  summary:
    - >
      TCP Viewer is an open-source, Apple-silicon macOS application for capturing and
      inspecting network packets using libpcap and Wireshark's analysis libraries.
  timeline:
    - >
      Version 1.0: Initial release for opening, inspecting, and exporting macOS packet
      captures.
    - >
      Version 1.2: Added live capture, PCAP workflows, native packet views, and
      Wireshark-backed protocol details.
    - 'Version 1.10.0: Added MCP-based packet inspection and automation.'
    - 'Version 1.14.0: Added a command-line interface and Wireshark display filters.'
  usage:
    - >
      Users capture traffic from a network interface or open PCAP, PCAPNG, and TCP
      Viewer session files. They can group traffic by application or destination, filter
      protocols and fields, inspect decoded packet trees and bytes, follow streams,
      export captures, or automate the application through its CLI and MCP interface.
