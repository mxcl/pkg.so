history:
  adoption-history:
    - >
      Proton Mail's May 2014 public beta attracted enough demand that Proton temporarily
      paused new registrations while increasing capacity. Over the following decade, the
      service expanded from the web to mobile applications and then to a dedicated
      desktop client, which Proton described as a frequently requested community
      feature.
  package-nerd-significance:
    - >
      The desktop package brings Proton's encrypted mail and calendar web experience
      into a separately updating Electron application, reducing dependence on a
      general-purpose browser and exposure to browser extensions. Its code resides in
      Proton's GPL-licensed WebClients monorepo.
  project-history:
    - >
      Proton Mail entered public beta on May 16, 2014 as a privacy-oriented encrypted
      webmail service. Its applications later expanded across mobile platforms while
      retaining web access.
    - >
      Proton launched dedicated Windows and macOS desktop applications on March 14,
      2024, with Linux initially in beta. The desktop client packages the full Mail and
      Calendar experience and inherits Proton Mail's zero-access and end-to-end
      encryption protections.
  related-projects:
    - Proton Calendar
    - Proton Mail Bridge
    - Proton Drive
    - Proton Pass
    - Proton VPN
  sources:
    - >
      Official 2014 public-beta announcement:
      https://proton.me/blog/protonmail-now-public-beta
    - 'Official desktop guide: https://proton.me/support/mail-desktop-app'
    - 'Official desktop launch announcement: https://proton.me/blog/proton-mail-desktop-app'
    - 'Official source monorepo: https://github.com/ProtonMail/WebClients'
  summary:
    - >
      Proton Mail is Proton's encrypted email service. Its desktop application supplies
      the synchronized Proton Mail and Proton Calendar experience in a dedicated client
      for macOS, Windows, and Linux.
  timeline:
    - '2014-05-16: Proton Mail entered public beta'
    - '2024-03-14: Desktop applications launched for Windows and macOS, with Linux in beta'
  usage:
    - >
      Users sign in with a Proton Account to read and send mail, manage folders and
      settings, and work with Proton Calendar in the same desktop application. Mail and
      calendar data remain synchronized with Proton's web and mobile clients.
