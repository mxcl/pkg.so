history:
  adoption-history:
    - >
      FlowVision is distributed as a free macOS application, through its official GitHub
      releases, and through Homebrew. The official site documents `brew install
      flowvision` as a supported installation route.
    - >
      The project targets users browsing large local image collections and mixed
      image/video folders, emphasizing responsive thumbnails, folder navigation, and
      Finder-like organization without uploading media.
  package-nerd-significance:
    - >
      FlowVision is notable as a GPL-licensed native macOS media browser that works
      locally and publishes its source and build instructions. It offers a
      package-manageable alternative to cloud-oriented photo tools and conventional
      one-file-at-a-time viewers.
    - >
      Its combination of waterfall layouts, recursive browsing, video playback, HDR
      support, and file operations makes it useful for inspecting heterogeneous asset
      directories.
  project-history:
    - >
      FlowVision is an open-source macOS image and video browser maintained in the
      `netdcy/FlowVision` repository. The project has developed around fast folder-based
      browsing, waterfall and grid presentation, and direct organization of local files.
    - >
      The public release stream shows continuing incremental work on performance, file
      management, media display, and compatibility, while the official site emphasizes a
      local-only, no-tracking design.
  related-projects:
    - The interface deliberately uses familiar Finder-style file-management controls.
    - >
      The source build uses media and Swift ecosystem components including FFmpegKit,
      BTree, and Settings.
  sources:
    - 'Official releases: https://github.com/netdcy/FlowVision/releases'
    - 'Official repository README: https://github.com/netdcy/FlowVision#readme'
    - 'Official website: https://flowvision.app/en/'
  summary:
    - >
      FlowVision is a free, open-source image and video browser for macOS. It combines
      waterfall and grid layouts, recursive browsing, video previews, HDR display, and
      Finder-like file organization while keeping media local.
  timeline:
    - >
      The project established an open-source macOS application and public release stream
      on GitHub.
    - >
      Later releases expanded file-management behavior, video support, HDR display,
      recursive browsing, and large-folder performance.
  usage:
    - >
      Open folders containing images or videos and browse them in adaptive waterfall or
      grid layouts. Users can move, copy, rename, tag, and rate files while browsing.
    - >
      Keyboard shortcuts, mouse gestures, side-button navigation, recursive mode,
      high-quality scaling, and video previews support rapid traversal of large media
      trees.
