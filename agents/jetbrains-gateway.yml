credentials-file-location: null
history:
  adoption-history:
    - >
      Gateway is available as a standalone launcher, through JetBrains Toolbox, and
      through the Remote Development Gateway plugin bundled with supported JetBrains
      IDEs. JetBrains also integrates it with remote-environment providers including
      CodeCanvas, Gitpod, Google Cloud, Coder, and WSL workflows.
  package-nerd-significance:
    - >
      Gateway separates the small local connection launcher and JetBrains Client from
      the heavyweight IDE backend running remotely. This split architecture is important
      to desktop packaging, remote cache management, backend version deployment, and
      reproducible development-environment tooling.
  project-history:
    - >
      JetBrains Gateway emerged as the desktop entry point for JetBrains'
      remote-development architecture. It connects a local client to an IDE backend on
      another machine and can download and manage the necessary remote components.
    - >
      Remote-development functionality later became available both through the
      standalone Gateway application and directly within supported JetBrains IDEs
      through a bundled plugin.
  related-projects:
    - JetBrains Client provides the local user interface for remote IDE sessions.
    - IntelliJ IDEA and other JetBrains IDEs can act as remote backends.
    - JetBrains Toolbox can install and update Gateway.
    - JetBrains CodeCanvas is an officially supported remote-environment provider.
  sources:
    - https://www.jetbrains.com/help/idea/jetbrains-gateway.html
    - https://www.jetbrains.com/help/idea/remote-development-a.html
    - https://www.jetbrains.com/remote-development/gateway/
  summary:
    - >
      JetBrains Gateway is a compact desktop launcher for connecting to remote
      development environments backed by JetBrains IDEs. It handles SSH or
      provider-based connections, backend deployment, and launching JetBrains Client.
  timeline:
    - "Early 2020s: Gateway became JetBrains' dedicated entry point for remote IDE development."
    - >
      2025: Official documentation described standalone, Toolbox, and IDE-bundled
      installation scenarios.
    - '2026: Gateway supported SSH and multiple managed remote-development providers.'
  usage:
    - >
      A developer selects or configures a remote machine, authenticates—commonly over
      SSH—and chooses a project and IDE backend. Gateway deploys or locates the backend
      and opens the remote project locally in JetBrains Client.
