history:
  adoption-history:
    - >
      Supernotes began as a student-oriented web application and later expanded into
      dedicated macOS, Windows, Linux, iOS, Android, and VR clients. Offline operation,
      real-time sharing, Markdown import and export, backlinks, graph views, and an API
      broadened it from collaborative study notes into a general personal-knowledge
      tool.
  package-nerd-significance:
    - >
      Supernotes is relevant to package users as a proprietary, cross-platform knowledge
      application with a portable Markdown-oriented data model and an official API. The
      Homebrew cask supplies a reproducible installation path for its macOS client even
      though the application itself is not open source.
  project-history:
    - >
      Founders Tobias Whetton and Connor Neblett developed Supernotes after encountering
      fragmented note-taking and learning tools as students at King's College London.
      The project entered open beta in August 2018.
    - >
      After eight months of further development, Supernotes 1.0, code-named Hamburg, was
      released on October 14, 2019. It centered on Markdown notecards, card hierarchies,
      sharing, comments, tags, filters, search, and mobile web access.
  related-projects:
    - >
      The official site positions Supernotes alongside knowledge and note tools such as
      Notion, Roam Research, Logseq, Evernote, and Apple Notes.
    - >
      Supernotes publishes an official API for cards, collections, comments, tags,
      templates, and webhooks.
  sources:
    - https://developer.supernotes.app/api-reference/introduction
    - https://help.supernotes.app/en/
    - https://supernotes.app/
    - https://supernotes.app/about/
    - https://supernotes.app/blog/posts/introduction-supernotes-1.0-release/
    - https://supernotes.app/blog/posts/story-behind-supernotes/
  summary:
    - >
      Supernotes is a collaborative, cross-platform note-taking and personal-knowledge
      application organized around concise Markdown notecards.
  timeline:
    - '2018-08-09: Supernotes enters open beta.'
    - '2019-10-14: Supernotes 1.0 is released.'
    - '2020s: Native desktop and mobile clients complement the web application.'
  usage:
    - >
      Users capture ideas as Markdown notecards, arrange cards into overlapping
      hierarchies, connect related knowledge, search or visualize it, and share cards
      for real-time editing and comments. Offline mode permits reading and editing
      before changes synchronize when connectivity returns.
    - >
      Developers can create account-managed API keys for integrations, but the official
      documentation does not identify a credentials file. No supported local
      configuration-file location is documented.
