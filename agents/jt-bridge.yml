history:
  adoption-history:
    - >
      JT-Bridge 3.4.x was tested with WSJT-X 2.2–2.3 and several established macOS
      logging applications, including MacLoggerDX, RUMlogNG, and Aether.
  package-nerd-significance:
    - >
      JT-Bridge is a niche example of package management serving specialized scientific
      and hobbyist workflows. It connects independently developed radio and logging
      tools instead of replacing either one.
  project-history:
    - >
      JT-Bridge was developed as a macOS intermediary between WSJT-X and amateur-radio
      logging software. Its 3.4 series added macOS Big Sur support and continued
      compatibility work across WSJT-X and multiple loggers.
  related-projects:
    - WSJT-X
    - MacLoggerDX
    - RUMlogNG
    - Aether
  sources:
    - https://jt-bridge.eller.nu/
    - https://jt-bridge.eller.nu/downloads/
    - >
      https://jt-bridge.eller.nu/jt-bridge.help/Contents/Resources/English.lproj/preferences.html
  summary:
    - >
      JT-Bridge is a macOS amateur-radio utility that receives WSJT-X activity and
      connects it with logging applications, QSL-status lookup, notifications, and
      optional log transfer.
  timeline:
    - '2020: JT-Bridge 3.4.0 added macOS 11 Big Sur support.'
    - '2021: JT-Bridge 3.4.3 was released with compatibility testing against WSJT-X 2.3.0.'
  usage:
    - >
      Operators configure WSJT-X networking and their preferred logger in JT-Bridge,
      then use the app to follow decoded activity, check worked or confirmed status,
      receive CQ notifications, and transfer logged contacts.
