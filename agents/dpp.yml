history:
  adoption-history:
    - >
      dpp's adoption has stayed centered on the D ecosystem rather than becoming a
      general-purpose systems tool. Its packaging in Homebrew and Nix makes it
      discoverable to D users who need C header interop without hand-maintaining
      bindings.
  package-nerd-significance:
    - >
      For package maintainers, dpp is a compact example of language-ecosystem tooling
      that depends on libclang and a host C preprocessor to bridge ABI-heavy native
      libraries into a less mainstream compiled language.
  project-history:
    - >
      The public GitHub repository was created in August 2017. Its README describes the
      goal as giving D files the same practical ease of use as C or C++ #include
      workflows, including macro-heavy C APIs, and notes that the work was supported by
      Symmetry Investments.
  related-projects:
    - D language
    - libclang
    - dmd
    - dub
  sources:
    - https://github.com/atilaneves/dpp
    - https://raw.githubusercontent.com/atilaneves/dpp/master/README.md
    - https://api.github.com/repos/atilaneves/dpp
  summary:
    - >
      dpp, invoked as d++, is a D-language interop tool that lets D source files
      directly include C and limited C++ headers, translating declarations through
      libclang and then compiling the generated D code.
  timeline:
    - '2017: atilaneves/dpp was created on GitHub.'
    - >
      2017 onward: the project documented success translating headers for libraries such
      as curl, OpenSSL, libvirt, Python.h, and others.
    - >
      2024: the repository still showed maintenance activity, while remaining a niche D
      interop package.
  usage:
    - >
      Users write quasi-D .dpp files containing #include directives, then run d++ so the
      tool expands declarations and selected macros into D code before invoking a D
      compiler.
related-packages:
  - id: brew:dub
    reason: >
      DUB is the documented D package/build workflow for installing or running dpp,
      including the official `dub install dpp` and `dub run dpp` commands.
    rel: adjacent_workflow
    sources:
      - https://github.com/atilaneves/dpp#build-instructions
      - https://dub.pm/
