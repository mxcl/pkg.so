id: cask:docker-desktop
display-name: Docker Desktop
repo: null
docs:
  - https://docs.docker.com/desktop
config-file-location:
  linux:
    - ~/.docker/desktop/settings-store.json
    - ~/.docker/config.json
  macos:
    - ~/Library/Group Containers/group.com.docker/settings-store.json
    - ~/.docker/config.json
  windows:
    - C:\Users\[USERNAME]\AppData\Roaming\Docker\settings-store.json
    - '%USERPROFILE%\.docker\config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Docker's developer-oriented packaging of containers helped make container
      workflows an industry standard after Docker's 2013 debut. Docker for Mac and
      Docker for Windows became widely used ways to establish local Docker development
      environments; Docker reported in 2018 that they were used daily by millions of
      developers.
    - >
      Docker Desktop subsequently expanded beyond macOS and Windows. A Linux technical
      preview was announced in 2022, bringing the integrated desktop workflow to Linux
      users as well.
  package-nerd-significance:
    - >
      Docker Desktop is a notable package because one desktop installation assembles a
      large toolchain: Docker Engine, the Docker CLI, Docker Compose, Build tooling,
      Kubernetes integration, and credential helpers. It hides the platform-specific
      virtual-machine or subsystem plumbing needed to run Linux containers on desktop
      operating systems.
    - >
      It also sits at an important boundary between open-source container components and
      Docker's commercially distributed desktop product, making licensing, deployment
      policy, resource use, and configuration management recurring concerns for
      developers and fleet administrators.
  project-history:
    - >
      Docker's first release appeared in 2013 and popularized an approachable build,
      image, registry, and runtime workflow around Linux containers.
    - >
      Docker for Mac and Docker for Windows established integrated native-looking
      desktop environments around a Linux container backend. On Windows, the product
      initially relied heavily on Hyper-V; Docker later developed WSL 2 integration to
      provide a more native Linux-kernel-based experience.
    - >
      The product evolved into Docker Desktop and accumulated integrated Compose,
      Kubernetes, Build, extension, volume, debugging, and security workflows while
      retaining the Docker CLI as its principal automation interface.
  related-projects:
    - Docker Engine
    - Moby
    - Docker CLI
    - Docker Compose
    - BuildKit
    - Docker Hub
    - Kubernetes
  sources:
    - https://docs.docker.com/get-started/docker-overview/
    - https://www.docker.com/blog/docker-hearts-wsl-2/
    - https://www.docker.com/blog/docker-windows-desktop-now-kubernetes/
    - https://www.docker.com/blog/getting-started-with-docker-desktop/
    - https://www.docker.com/products/docker-desktop/
  summary:
    - >
      Docker Desktop is Docker's integrated local container-development application for
      macOS, Windows, and Linux. It bundles the daemon, command-line client, Compose,
      build facilities, credential integration, and optional local orchestration behind
      a desktop interface.
  timeline:
    - "2013: Docker's first version was released."
    - >
      2016: Docker's desktop tooling brought integrated Docker workflows to Mac and
      Windows developers.
    - >
      2018: Docker for Windows Desktop added an integrated Kubernetes beta, matching an
      existing Docker for Mac capability.
    - '2019: Docker announced a WSL 2-based direction for Docker Desktop on Windows.'
    - '2022: Docker announced a Docker Desktop for Linux technical preview.'
  usage:
    - >
      Developers use Docker Desktop to build images, run and inspect containers, define
      multi-container applications with Compose, share images through registries, and
      test containerized services locally.
    - >
      The application supplies desktop-friendly lifecycle and resource controls while
      retaining scriptable Docker commands, allowing local workflows to resemble CI and
      deployment workflows.
