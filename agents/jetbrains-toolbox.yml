id: cask:jetbrains-toolbox
display-name: JetBrains Toolbox
repo: null
docs:
  - https://www.jetbrains.com/help/toolbox-app
config-file-location:
  linux:
    - ~/.local/share/JetBrains/Toolbox/.settings.json
  macos:
    - ~/Library/Application Support/JetBrains/Toolbox/.settings.json
  windows:
    - '%LOCALAPPDATA%\JetBrains\Toolbox\.settings.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      JetBrains positioned Toolbox App as the central installer and updater for its
      desktop developer tools, including Early Access builds. It subsequently grew into
      a project launcher and an entry point for local, SSH-based, and managed
      development environments.
  package-nerd-significance:
    - >
      Toolbox App matters to package users because it manages IDE installation and
      upgrade state outside the operating system package manager while Homebrew Cask
      provides a convenient bootstrap installation on macOS. That boundary is useful
      when troubleshooting ownership of IDE updates or installation paths.
  project-history:
    - >
      The application originated as “JetBrains App Launcher,” a JetBrains hackathon
      project intended to simplify installing, updating, and uninstalling the company’s
      desktop tools. It continued as an internal side project, was named JetBrains
      Toolbox App near the end of 2015, and entered a public Early Access Program in May
      2016.
  related-projects:
    - >
      Manages JetBrains IDEs such as IntelliJ IDEA, PyCharm, WebStorm, GoLand, and
      related JetBrains development tools.
    - Complements JetBrains remote-development and IDE Services offerings.
  sources:
    - https://blog.jetbrains.com/blog/2016/05/25/introducing-jetbrains-toolbox-app/
    - https://www.jetbrains.com/help/toolbox-app/installation.html
    - https://www.jetbrains.com/help/toolbox-app/introduction.html
    - source_facts.package-manager
  summary:
    - >
      JetBrains Toolbox App is JetBrains’ cross-platform manager for installing,
      updating, configuring, and launching its IDEs and for organizing local and remote
      development projects.
  timeline:
    - >
      2015: The hackathon-born launcher was released internally and named JetBrains
      Toolbox App.
    - '2016: JetBrains opened the Toolbox App Early Access Program.'
    - >
      2026: Official documentation describes local, SSH, and development-environment
      management in addition to IDE installation.
  usage:
    - >
      Users install and update JetBrains tools, keep multiple IDE versions, open recent
      projects, and connect to remote development hosts. On macOS, Homebrew Cask can
      install Toolbox App, after which the application normally manages JetBrains IDE
      lifecycle itself.
tags:
  - cross-platform
