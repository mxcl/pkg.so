config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Numi expanded from its macOS desktop experience to include a command-line
      interface and Windows and Linux offerings. Its official repository also supports
      installation of numi-cli through the developer's Homebrew tap.
    - >
      The official GitHub project has attracted a substantial open-source audience and
      supports integrations such as Alfred and JavaScript extensions.
  package-nerd-significance:
    - >
      Numi appeals to package enthusiasts because it combines a polished
      natural-language desktop calculator with an automatable command-line program
      distributed through Homebrew.
    - >
      Its plain-text .numi documents, open calculation engine, extension mechanism, and
      support for units, currencies, dates, and time zones make it useful beyond
      ordinary arithmetic.
  project-history:
    - >
      Numi is a natural-language calculator created by Nikolai/Dmitry Nikolaev. Rather
      than imitating a pocket calculator, it evaluates readable expressions such as
      currency conversions, percentages, dates, and unit calculations.
    - >
      The project publishes its calculation engine, CLI, plugins, Alfred workflow,
      documentation, and release artifacts through the official nikolaeu/numi GitHub
      repository. The graphical application remains the primary experience, while the
      CLI exposes most calculation features to shell workflows.
  related-projects:
    - The official Alfred workflow connects Numi's CLI to the Alfred launcher.
    - Homebrew can install numi-cli from the developer's nikolaeu/numi tap.
  sources:
    - https://github.com/nikolaeu/numi
    - https://github.com/nikolaeu/numi/releases
    - https://github.com/nikolaeu/numi/wiki
    - https://numi.app/
  summary:
    - >
      Numi is a natural-language calculator for desktop and command-line use. It
      evaluates arithmetic, units, currencies, percentages, dates, and other expressions
      written as readable text.
  timeline:
    - Numi began as a macOS natural-language calculator.
    - The project later added numi-cli and official Windows and Linux distribution.
    - '2025: The official GitHub wiki received a substantial documentation update.'
    - '2026: The official repository continued publishing macOS and CLI releases.'
  usage:
    - >
      Enter calculations as ordinary text, combining labels, variables, conversions,
      percentages, dates, and multiple lines. Documents can be imported or exported as
      UTF-8 plain-text .numi files.
    - >
      For automation, run expressions with numi-cli; the official repository documents
      direct installation and installation through the developer's Homebrew tap.
      JavaScript extensions for the macOS application belong under the documented
      application-support extensions directory.
