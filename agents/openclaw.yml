id: cask:openclaw
display-name: OpenClaw
repo: null
docs:
  - https://docs.openclaw.ai/
  - https://docs.openclaw.ai/gateway/configuration
  - https://docs.openclaw.ai/start/lore
config-file-location:
  unix:
    - ~/.openclaw/openclaw.json
credentials-file-location:
  unix:
    - ~/.openclaw/state/openclaw.sqlite
    - ~/.openclaw/agents/<agentId>/agent/openclaw-agent.sqlite
    - ~/.openclaw/credentials/
history:
  adoption-history:
    - >
      OpenClaw grew rapidly from a small personal project into a community-maintained
      agent platform. The official announcement says that this growth required adding
      maintainers and formalizing project processes.
    - >
      Its distribution spans a native desktop application, an npm-based command-line and
      gateway stack, and a plugin ecosystem. The Homebrew cask supplies a conventional
      macOS installation path.
  package-nerd-significance:
    - >
      OpenClaw is notable to package enthusiasts because it packages an unusually broad
      local-agent stack: gateway services, model-provider integrations, chat-channel
      plugins, browser and tool automation, desktop clients, and persistent agent
      workspaces.
    - >
      Its fast Clawd-to-Moltbot-to-OpenClaw rename also created a real-world packaging
      migration problem involving repository names, npm packages, documentation domains,
      configuration compatibility, and native release channels.
  project-history:
    - >
      Peter Steinberger initially built the software as WhatsApp Relay, later naming the
      assistant Clawd and the project Clawdbot. The official account describes it as a
      weekend project that expanded from a WhatsApp gateway into a general local agent
      platform.
    - >
      After a trademark-related request from Anthropic, the project briefly became
      Moltbot in January 2026. It adopted the OpenClaw name at the end of that month,
      when the repository, npm packages, and documentation were migrated.
  related-projects:
    - Clawd and Clawdbot were earlier names for the project and assistant.
    - Moltbot was the short-lived name immediately preceding OpenClaw.
    - >
      OpenClaw integrates with model providers and messaging systems through its gateway
      and plugin architecture.
  sources:
    - https://docs.openclaw.ai/concepts/oauth
    - https://docs.openclaw.ai/gateway/configuration
    - https://docs.openclaw.ai/start/lore
    - https://github.com/openclaw/openclaw/releases
    - https://openclaw.ai/blog/introducing-openclaw
  summary:
    - >
      OpenClaw is an open-source, self-hosted personal-agent platform that runs on a
      user's own computer or server and connects an AI assistant to messaging
      applications, models, tools, and local workspaces.
  timeline:
    - 'November 2025: Clawd emerged from the earlier WhatsApp Relay project.'
    - 'January 27, 2026: The project changed from Clawd/Clawdbot to Moltbot.'
    - 'January 30, 2026: The project completed its migration to the OpenClaw name.'
  usage:
    - >
      Users typically run a local or remote OpenClaw Gateway, choose one or more model
      providers, and connect messaging channels such as WhatsApp, Telegram, Discord,
      Slack, or Teams.
    - >
      The guided setup commands create the main configuration and workspace.
      Configuration defaults to ~/.openclaw/openclaw.json, while current shared and
      per-agent credentials are stored in SQLite; the credentials directory also holds
      channel/provider state and legacy OAuth-import material.
tags:
