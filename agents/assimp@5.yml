history:
  adoption-history:
    - >
      Like the unversioned assimp formula, assimp@5 benefits from the wide package
      adoption of assimp across Homebrew, MacPorts, Nix, Arch, Fedora, Alpine,
      Debian/Ubuntu, and openSUSE-style ecosystems listed in the supplied facts. The
      versioned formula is mainly package-manager infrastructure: it preserves
      compatibility for consumers that are not ready for the current upstream major.
  package-nerd-significance:
    - >
      Versioned formulae are a package-manager signal: assimp is important enough, and
      has enough downstream native consumers, that keeping a prior major branch
      available is useful. For dependency graph readers, assimp@5 says more about ABI
      compatibility and rebuild pressure than about a separate upstream project.
  project-history:
    - >
      Upstream assimp began no later than the 2006 copyright period recorded in official
      source/license files, and the current assimp/assimp GitHub repository dates to
      2010. The upstream README describes a library that loads more than 40 3D file
      formats into a shared in-memory format, with a growing exporter set and a
      command-line tool.
    - >
      The 5.x formula exists because native graphics dependencies often need a stable
      major line while downstream packages catch up to ABI or behavior changes. The
      upstream project continued into v6 releases, but a versioned package lets Homebrew
      users keep software pinned to the previous major branch when needed.
  related-projects:
    - The unversioned Homebrew assimp formula tracks the main upstream package.
    - >
      Downstream C/C++ graphics and asset-processing packages may select assimp@5 to
      avoid current-major ABI changes.
    - >
      The same upstream ports and bindings ecosystem applies: PyAssimp, AssimpNetter,
      assimpjs, russimp, and engine integrations.
  sources:
    - https://api.github.com/repos/assimp/assimp
    - https://github.com/assimp/assimp#readme
    - https://github.com/assimp/assimp/blob/master/LICENSE
    - https://www.assimp.org/
    - source_facts.name
    - source_facts.package-manager
    - source_facts.package-manager-url
  summary:
    - >
      assimp@5 is the Homebrew versioned formula for the Open Asset Import Library 5.x
      line. Upstream history is the same assimp project: a C/C++ 3D asset
      importer/exporter and CLI that normalizes many model formats into a common scene
      representation.
  timeline:
    - '2006: assimp project copyright period begins in official source/license files.'
    - '2010: assimp/assimp repository created on GitHub.'
    - >
      2020s: Homebrew exposes assimp@5 as a versioned formula alongside the main assimp
      formula.
    - >
      2026: Upstream assimp repository metadata and tags showed continued v6
      maintenance, making the @5 package a compatibility line.
  usage:
    - >
      Users install assimp@5 when they specifically need the 5.x library/CLI behavior,
      headers, or ABI expected by their project. The usage model is otherwise the same
      as upstream assimp: link the library, use bindings, or invoke the assimp
      command-line tool for asset inspection and conversion.
