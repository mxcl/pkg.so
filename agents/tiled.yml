credentials-file-location: null
history:
  adoption-history:
    - >
      Tiled evolved from a tile-map editor into a general-purpose 2D level editor
      supporting multiple map projections, object layers, worlds, templates, custom
      properties, plugins, and JavaScript extensions. Its generic data model and export
      ecosystem let it serve many engines rather than a single game runtime.
  package-nerd-significance:
    - >
      Tiled is a durable, engine-neutral content tool whose TMX and TMJ formats and
      extension points make it useful across otherwise unrelated game-development
      stacks. Package users value that the editor, command-line conversion tool,
      scripting API, and documented formats can fit both artist-facing and automated
      asset pipelines.
  project-history:
    - >
      The official news archive records public releases beginning in 2004. The project
      established mapeditor.org in 2006 and moved its repository to Mercurial in 2008;
      it later moved to GitHub and continued broadening from tile painting into
      object-centric level design, automation, worlds, and scripting.
  related-projects:
    - TMX map format
    - Tiled JavaScript API
    - tiled-extensions
    - game-engine importers and loaders
  sources:
    - https://doc.mapeditor.org/en/latest/manual/automapping/ — official automation workflow
    - https://doc.mapeditor.org/en/latest/manual/introduction/ — official scope and features
    - https://doc.mapeditor.org/en/latest/manual/worlds/ — official world workflow
    - https://www.mapeditor.org/news.html — official release archive
  summary:
    - >
      Tiled is a free, open-source 2D level editor centered on tile maps but also
      capable of free image placement, object layers, custom properties, worlds,
      automation, and extensible import and export formats.
  timeline:
    - '2004: Earliest releases in the official news archive'
    - '2006: Project website moved to mapeditor.org'
    - '2008: Source repository moved to Mercurial'
    - '2017: The project reached its long-planned stable milestone'
    - '2019: Project files and multi-map world workflows became supported concepts'
  usage:
    - >
      Game developers create tile layers and freely positioned objects, attach custom
      data for their engine, organize assets in projects, and export maps in native or
      engine-specific formats. Advanced workflows use terrain painting, Automapping
      rules, worlds, plugins, or JavaScript automation.
