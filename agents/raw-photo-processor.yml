history:
  adoption-history:
    - >
      RPP targeted serious Mac-based photographers who wanted precise raw development
      rather than an all-in-one cataloging and editing suite. It supported integration
      with Photoshop and Lightroom and offered camera profiles for a wide range of
      DSLRs, medium-format backs, and compact cameras.
    - >
      The official download page describes separate 32-bit legacy and 64-bit builds for
      Intel Macs, with compatibility extending from Mac OS X 10.4 through 10.14. Its
      donation-supported model unlocked selected multiprocessing and
      workflow-integration features.
  package-nerd-significance:
    - >
      RPP is a specialist Mac raw converter whose design favors deliberate,
      high-precision processing over real-time previews and broad workflow management.
      It is interesting to package collectors as an Intel-era photographic tool with a
      narrow technical philosophy, legacy OS support, and integrations with larger
      editing suites.
  project-history:
    - >
      Andrey Tverdokhleb created RPP in California with extensive photographic guidance
      from Iliah Borg. The project positioned raw conversion as the digital equivalent
      of developing film: establish white balance, exposure, interpolation, color, and
      tone correctly before handing the image to a general editor.
    - >
      Official release notes show active development across the early 2010s, adding
      camera support, colorimetric processing, film and paper profiles, and
      compatibility with successive Mac OS X releases.
  related-projects:
    - RPP integrates with Adobe Lightroom and Photoshop.
    - >
      It uses or works with ArgyllCMS for camera profiling and ExifTool for
      metadata-related operations.
  sources:
    - 'Official FAQ: https://www.raw-photo-processor.com/RPP/FAQ.html'
    - 'Official downloads: https://www.raw-photo-processor.com/RPP/Downloads.html'
    - 'Official overview: https://www.raw-photo-processor.com/RPP/Overview.html'
    - >
      Official release note:
      https://www.raw-photo-processor.com/RPP/News/Entries/2012/11/14_Version_4.7.0_released.html
  summary:
    - >
      Raw Photo Processor, commonly abbreviated RPP, is a specialized macOS raw-image
      converter designed by photographer-software engineer Andrey Tverdokhleb with
      guidance from photographer Iliah Borg.
  timeline:
    - '2011: Version 4.2.1 added support for cameras including the Fuji X100 and Olympus E-PL2.'
    - >
      2012: Version 4.7.0 added colorimetric mode, new profiles, camera support, and OS
      X Mountain Lion compatibility.
    - >
      2013: Version 4.7.1 expanded support for contemporary Canon, Nikon, Sony, Fuji,
      Panasonic, Pentax, Olympus, and Samsung cameras.
    - >
      2014: The official overview was updated with RPP's mature processing philosophy
      and feature set.
  usage:
    - >
      RPP is used as the raw-development stage of a photographic workflow. Users set
      white balance and exposure, choose interpolation, recover highlights, tune tone
      and color, batch-process related photographs, and then perform sharpening,
      cropping, or further editing in another application. The official FAQ recommends a
      film-inspired workflow of generating previews, selecting keepers, propagating
      settings, and producing final TIFF or JPEG output.
