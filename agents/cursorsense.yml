config-file-location:
  macos:
    - ~/Library/Application Support/SteerMouse & CursorSense
credentials-file-location: null
history:
  adoption-history:
    - >
      CursorSense has remained a specialized macOS utility for users who want finer
      pointer control than the operating system provides. Plentycom has repeatedly
      updated it for new macOS releases and input-device generations.
  package-nerd-significance:
    - >
      CursorSense exemplifies the proprietary macOS utilities that Homebrew Cask makes
      reproducibly installable even though their configuration and licensing remain
      vendor-managed.
  project-history:
    - >
      Plentycom released CursorSense 1.0 in July 2012. It initially operated through
      macOS preference infrastructure and added recommended settings, broader device
      support, and cursor auto-snapping over subsequent releases.
    - >
      CursorSense became a standalone application in 2024, when it was removed from
      System Settings. Its official changelog also documents Apple silicon support and
      continued compatibility work for newer macOS releases.
  related-projects:
    - >
      Plentycom also develops SteerMouse. CursorSense can inherit cursor-speed settings
      from SteerMouse, and the products share an Application Support location.
  sources:
    - https://plentycom.jp/en/cursorsense
    - https://plentycom.jp/en/cursorsense/download.php
    - https://plentycom.jp/en/cursorsense/support.html
    - source_facts.package-manager.brew-cask
  summary:
    - >
      CursorSense is a proprietary macOS utility from Plentycom for independently
      adjusting pointer acceleration and sensitivity, including settings for individual
      input devices.
  timeline:
    - '2012: CursorSense 1.0 was released.'
    - >
      2014: Settings moved to the shared SteerMouse & CursorSense Application Support
      location.
    - '2018: CursorSense 2.0 added cursor auto-snapping.'
    - '2020: Apple silicon support was introduced.'
    - '2024: CursorSense became a standalone application.'
  usage:
    - >
      Users select a mouse or other supported pointing device and tune its acceleration
      and sensitivity. The utility can retain settings per device and offers
      community-derived recommended settings.
tags:
