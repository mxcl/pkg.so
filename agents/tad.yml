history:
  adoption-history:
    - >
      Tad is distributed as a cross-platform desktop application and as the Homebrew
      cask `tad`. Its official site describes it as a hobby project aimed at data
      engineers and data scientists rather than a hosted analytics platform.
  package-nerd-significance:
    - >
      Tad gives package-manager users a lightweight graphical way to inspect large CSV
      and Parquet files without importing them into a server or spreadsheet. Its
      transition from SQLite to embedded DuckDB also reflects DuckDB's growing role in
      local analytical tooling.
  project-history:
    - >
      Antony Courtney initially released Tad in 2017 as a standalone CSV viewer and
      explorer. The codebase was later reorganized as a TypeScript and React monorepo
      with an embeddable pivot-table component and multiple relational back ends.
    - >
      The 0.10 release in 2022 replaced SQLite with DuckDB for primary analytical
      processing and added direct Parquet, compressed CSV, DuckDB database, SQLite
      database, and directory browsing support.
  related-projects:
    - DuckDB provides Tad's embedded analytical engine.
    - SlickGrid renders its large, scrollable data grid.
    - The repository contains reusable packages including reltab, aggtree, and tadviewer.
  sources:
    - Input source_facts.package-manager.brew-cask.
    - https://github.com/antonycourtney/tad
    - https://www.tadviewer.com/
  summary:
    - >
      Tad is a free, MIT-licensed desktop viewer and pivot-table application for
      exploring tabular files and local database files.
  timeline:
    - '2017-04-05: Initial public release.'
    - '2017-05-29: First cross-platform macOS, Linux, and Windows release.'
    - '2022-04-19: Tad 0.10 adopted DuckDB and added Parquet and database-file support.'
    - '2024-06-21: Tad 0.14 updated its embedded engine to DuckDB 1.0 and added Parquet export.'
  usage:
    - >
      Users open CSV, TSV, compressed CSV, Parquet, SQLite, or DuckDB data and
      interactively filter, sort, aggregate, pivot, format, and export it. Tad can also
      be launched from a shell with a data-file argument.
