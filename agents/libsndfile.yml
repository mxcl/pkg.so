history:
  adoption-history:
    - >
      libsndfile became common infrastructure in Unix audio stacks because it solved a
      narrow but persistent portability problem: reading and writing many sampled-audio
      file formats without each application carrying its own parsers. Its availability
      across Homebrew, Debian, Fedora, Arch, Nix, MacPorts, Windows package channels,
      and other ecosystems reflects that library role.
  package-nerd-significance:
    - >
      Package maintainers care about libsndfile because it sits below many higher-level
      audio applications and has a security-sensitive parser surface. Its release notes
      include multiple CVE and malformed-file fixes, so distributions tend to track it
      as a foundational media library rather than as an optional end-user tool.
  project-history:
    - >
      Erik de Castro Lopo developed libsndfile and published its original project site
      at mega-nerd.com. The project's release history records version 0.0.8 on February
      15, 1999 as the first official release, version 1.0.0 on August 16, 2002 as the
      first stable 1.0 release, and later additions such as FLAC and CAF support in 2005
      and Ogg/Vorbis support in 2009.
    - >
      The GitHub README records that de Castro Lopo originally developed and maintained
      the project and that, after version 1.0.30, maintenance moved to the libsndfile
      team under the canonical GitHub organization.
  related-projects:
    - >
      SoX is a related command-line sound conversion project named by the original
      libsndfile site.
    - >
      libaudiofile is named by the original libsndfile site as a similar library with a
      different programming interface.
    - >
      libsamplerate is a related Erik de Castro Lopo audio library often packaged near
      libsndfile, but it solves sample-rate conversion rather than file parsing.
  sources:
    - http://www.mega-nerd.com/libsndfile/
    - http://www.mega-nerd.com/libsndfile/NEWS
    - https://github.com/libsndfile/libsndfile
    - https://github.com/libsndfile/libsndfile/releases
  summary:
    - >
      libsndfile is a long-running C library for reading and writing sampled-sound files
      through one API. Its package-manager importance comes from hiding the format,
      endian, and sample-width details of WAV, AIFF, AU, FLAC, Ogg/Vorbis, CAF, and
      other audio containers behind a small LGPL library and a set of command-line
      inspection/conversion tools.
  timeline:
    - '1999-02-15: Version 0.0.8 marked the first official release.'
    - '2002-08-16: Version 1.0.0 became the first 1.0.x release.'
    - "2005-09-30: Version 1.0.12 added FLAC, Apple's CAF, and virtual I/O support."
    - '2009-02-07: Version 1.0.18 added Ogg/Vorbis support and Windows binaries.'
    - >
      2020-09-19: Version 1.0.30 preceded the transfer of maintenance to the libsndfile
      team described in the GitHub README.
  usage:
    - >
      Developers link against the C API or use the bundled tools such as sndfile-info,
      sndfile-convert, sndfile-play, and metadata utilities. The package is especially
      useful in audio editors, batch conversion scripts, test pipelines, and DSP
      programs that need predictable PCM access across multiple container formats.
related-packages:
  - id: brew:sox
    reason: >
      Choose SoX for a broad, effects-oriented command-line audio workflow; choose
      libsndfile when an application needs an embeddable API for sampled-sound file I/O.
    rel: alternative
    sources:
      - https://libsndfile.github.io/libsndfile/
      - https://sox.sourceforge.net/
