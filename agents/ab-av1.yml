config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager metadata lists ab-av1 in Homebrew, MacPorts, Nix,
      Scoop, and zypper, which points to cross-platform adoption among users who want
      reproducible video-encoding tooling without hand-maintaining local scripts.
  package-nerd-significance:
    - >
      Package maintainers care about ab-av1 because it wraps heavyweight multimedia
      dependencies into one CLI contract: FFmpeg in PATH, SVT-AV1/libvmaf support, and a
      Rust binary with release artifacts for multiple platforms.
  project-history:
    - >
      The GitHub repository was created in January 2022 and the package metadata
      identifies Alex Butler as the author. The project follows the pattern of small
      media CLIs that turn a complicated FFmpeg quality-search workflow into a
      repeatable command.
  related-projects:
    - FFmpeg provides the encoding and probing substrate used by ab-av1.
    - >
      SVT-AV1, libvmaf, libx265, and libx264 are encoder or quality-analysis components
      referenced by the official README.
  sources:
    - >
      Official README, Cargo.toml, GitHub repository metadata, GitHub releases, and
      source_facts.package-manager.
  summary:
    - >
      ab-av1 is a Rust command-line tool for AV1-oriented video encoding workflows. Its
      official README describes fast VMAF sampling, automatic CRF calculation, and
      FFmpeg/SVT-AV1/VMAF integration, while also supporting other FFmpeg encoders such
      as libx265 and libx264.
  timeline:
    - '2022: GitHub repository created.'
    - '2026: v0.11.4 published on GitHub releases.'
  usage:
    - >
      The README documents subcommands such as auto-encode, crf-search, sample-encode,
      encode, vmaf, and xpsnr. Typical use is to sample an input, choose a CRF that
      meets a target VMAF or XPSNR quality threshold, then run FFmpeg with the selected
      settings.
related-packages:
  - id: brew:ffmpeg
    reason: >
      ab-av1 requires `ffmpeg` in `PATH` and delegates its probing, sample encodes, full
      encodes, and quality calculations to an appropriately featured FFmpeg build.
    rel: adjacent_workflow
    sources:
      - https://github.com/alexheretic/ab-av1#readme
      - https://ffmpeg.org/documentation.html
  - id: brew:svt-av1
    reason: >
      Install SVT-AV1 when building or selecting the FFmpeg encoder stack used by ab-av1
      for its primary AV1 workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/alexheretic/ab-av1#readme
      - https://gitlab.com/AOMediaCodec/SVT-AV1
