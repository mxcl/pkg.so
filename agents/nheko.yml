history:
  adoption-history:
    - >
      Nheko is available through its own cross-platform releases and a broad set of
      community packaging channels. The official README documents packages for Arch
      Linux, Debian and Ubuntu, Fedora, Gentoo, Mageia, Nix, Alpine, openSUSE, Flatpak,
      Guix, Homebrew, and Chocolatey.
  package-nerd-significance:
    - >
      Nheko is a representative native Matrix client: it uses Qt and C++ rather than a
      browser-derived desktop shell, supports distribution-native packaging across many
      Unix ecosystems, and integrates encrypted messaging with desktop secret services.
      Its profile option also makes multiple isolated Matrix accounts explicit at the
      process and configuration level.
  project-history:
    - >
      Nheko was created to provide a native Matrix desktop application that feels like a
      mainstream chat client rather than an IRC client. Continued development under the
      Nheko-Reborn organization expanded end-to-end encryption, voice and video calls,
      room management, media, stickers, multiple profiles, signed Windows installers,
      and broad desktop packaging.
  related-projects:
    - Matrix, the federated communication protocol used by Nheko.
    - mtxclient, the Nheko-Reborn C++ Matrix client library used by the project.
    - >
      Element, cited by Nheko as an example of the mainstream chat experience it aims to
      provide in a native client.
  sources:
    - >
      Official manual page source:
      https://github.com/Nheko-Reborn/nheko/blob/master/man/nheko.1.adoc
    - 'Official project homepage: https://nheko-reborn.github.io/'
    - 'Official release history: https://github.com/Nheko-Reborn/nheko/releases'
    - 'Official repository README: https://github.com/Nheko-Reborn/nheko#readme'
  summary:
    - >
      Nheko is a native, cross-platform Matrix desktop client built with Qt and C++20,
      with encrypted messaging, calls, rooms, media, notifications, and multiple
      command-line-selectable profiles.
  timeline:
    - >
      Early project era: Nheko established its goal of making Matrix feel like a
      mainstream native chat application.
    - >
      0.9–0.12 series: Releases expanded encrypted messaging, calling, Matrix
      compatibility, platform integration, and signed installers.
    - >
      0.12.0: The project added Apple Silicon builds on project hardware and signed
      MSIX/appinstaller distribution with automatic updates.
    - '0.12.1: The release included security hardening and a stable Nheko app installer.'
  usage:
    - >
      Users sign in to a Matrix homeserver, join rooms, exchange encrypted or
      unencrypted messages and files, place supported voice or video calls, and manage
      room membership. The -p/--profile option creates isolated profiles for multiple
      accounts. On supported Unix desktops, encrypted operation relies on a secret
      service such as KDE Wallet or GNOME Keyring.
