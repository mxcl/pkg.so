history:
  project-history:
    - >
      The project belongs to the small tarpit/honeypot family of anti-crawler tools that
      emerged in response to large-scale AI scraping. Its documented usage is
      deliberately simple: place hidden, inaccessible-to-humans links into normal pages,
      proxy the trap path to Miasma, and let Miasma generate self-referential pages
      under that path. The README also documents operational guardrails such as rate
      limiting and a maximum number of in-flight connections.
  sources:
    - >
      https://arstechnica.com/tech-policy/2025/01/ai-haters-build-tarpits-to-trap-and-trick-ai-scrapers-that-ignore-robots-txt/
    - https://formulae.brew.sh/formula/miasma
    - https://github.com/austin-weeks/miasma
    - https://news.ycombinator.com/item?id=47561819
  summary:
    - >
      Miasma is a Rust-based anti-scraping tool from the austin-weeks/miasma GitHub
      project. Its README frames it as a way to send AI web scrapers into an endless set
      of generated pages rather than ordinary site content, using hidden links on a site
      and a reverse proxy route such as an Nginx location that points scraper traffic at
      the Miasma server.
  usage:
    - >
      Its adoption signal is early and package-manager-specific: Homebrew packages it as
      `miasma`, Hacker News discussed the GitHub project, and the formula builds it from
      Rust source. Compared with general bot-blocking middleware, its niche is narrower
      and more adversarial: it is not a crawler classifier or robots.txt policy tool,
      but a poison-page generator for site operators who intentionally want unwanted
      scrapers to waste work.
related-packages:
  - id: brew:nginx
    reason: >
      nginx is Miasma's documented reverse-proxy companion for routing a hidden trap
      path to the service and rate-limiting crawler requests before they consume Miasma
      resources.
    rel: adjacent_workflow
    sources:
      - https://github.com/austin-weeks/miasma#readme
      - https://nginx.org/en/docs/http/ngx_http_proxy_module.html
      - https://nginx.org/en/docs/http/ngx_http_limit_req_module.html
