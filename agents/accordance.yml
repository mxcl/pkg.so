history:
  adoption-history:
    - >
      Accordance initially targeted scholars and pastors who needed grammatical analysis
      of Greek and Hebrew texts, working with the GRAMCORD Institute. Later releases
      added lexicons, commentaries, user notes, images, broad searching, maps, and
      consumer-oriented study collections.
    - >
      Distribution evolved from Macintosh floppy disks to CD-ROM collections and
      downloads. Accordance expanded to iOS in 2011 and released a native Windows
      edition in 2013, widening a product long associated with the Mac biblical-studies
      community.
  package-nerd-significance:
    - >
      Accordance is a long-lived example of specialist scholarly software whose value
      lies as much in licensed datasets and tagged texts as in the application itself.
      Migration and backup therefore involve program preferences, installed modules, and
      user-created research files.
    - >
      For Mac package users, the Homebrew cask installs the application, while
      Accordance itself manages accounts, licensed modules, updates, preferences, and
      user libraries. The cask should not be mistaken for a complete reproducible
      installation of a user's research corpus.
  project-history:
    - >
      Roy Brown, who had previously created the Macintosh Bible program ThePerfectWord
      in 1988, began Accordance to provide deeper original-language analysis for
      scholars and pastors. Accordance 1.0 was released exclusively for Macintosh in
      February 1994 in cooperation with the GRAMCORD Institute.
    - >
      Accordance developed from a specialized grammatical-analysis program into a broad
      Bible-study library and research environment. Major additions included secondary
      resources and user notes in version 2, image and cross-library search support in
      version 3, the Accordance Bible Atlas, Mac OS X support, tabbed workspaces, mobile
      editions, and Windows support.
  related-projects:
    - >
      ThePerfectWord and MacBible: Earlier Macintosh Bible software associated with
      founder Roy Brown.
    - >
      GRAMCORD: The grammatical-analysis organization that collaborated on early
      Accordance releases.
    - 'Accordance Mobile: Companion Bible-study applications for iOS, iPadOS, and Android.'
  sources:
    - https://support.accordancebible.com/hc/en-us
    - >
      https://support.accordancebible.com/hc/en-us/articles/35804210381851-Migrating-Accordance-Desktop-to-Another-Computer
    - https://www.accordancebible.com/25-events/
    - https://www.accordancebible.com/history/
  summary:
    - >
      Accordance is a commercial Bible-study and biblical-research environment with
      particular strengths in searching and analyzing original-language texts, managing
      scholarly reference libraries, and organizing user research.
  timeline:
    - '1988: Roy Brown created the earlier Macintosh Bible program ThePerfectWord.'
    - '1994: Accordance 1.0 was released for Macintosh on floppy disks.'
    - >
      1996: Accordance 2.0 added secondary resources, user notes, and parallel-passage
      tools; CD-ROM distribution followed.
    - '1998: Accordance Bible Atlas was released.'
    - '2001: Accordance gained native Mac OS X support.'
    - '2011: Accordance Mobile 1.0 was released for iOS.'
    - '2013: Accordance was released natively for Windows.'
  usage:
    - >
      Users read and compare Bible translations, search morphologically tagged Greek and
      Hebrew texts, consult linked lexicons and commentaries, build diagrams, create
      notes and highlights, and organize work in saved workspaces.
    - >
      Accordance stores application support data and preferences under the user's
      Library on macOS, while user-created workspaces, notes, tools, papers, highlights,
      and diagrams normally live in `~/Documents/Accordance Files`. These locations
      matter when backing up or migrating an installation.
