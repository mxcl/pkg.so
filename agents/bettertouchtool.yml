credentials-file-location: null
history:
  adoption-history:
    - >
      The official site reports more than sixteen years on the Mac and hundreds of
      thousands of users. Its scope grew from gesture customization into a broad
      automation environment supporting keyboards, mice, Stream Deck devices, MIDI,
      scripts, floating interfaces, window management, clipboard history, and launchers.
  package-nerd-significance:
    - >
      BetterTouchTool is a characteristic Mac power-user package: one application can
      replace several narrowly focused remapping, window-management, launcher, and
      automation utilities. Exportable JSON presets make elaborate configurations
      portable and shareable, while Homebrew Cask provides a repeatable installation
      path.
  project-history:
    - >
      BetterTouchTool is developed by Andreas Hegenberg and folivora.AI. Officially
      archived builds bearing 2010 filenames and the site's claim of more than sixteen
      years on the Mac place its origins around 2010.
    - >
      Over time the project expanded well beyond its original touch and gesture
      emphasis. The current product treats many input sources as triggers that can
      invoke hundreds of built-in or scripted actions.
  related-projects:
    - >
      BetterSnapTool, BTT Remote, BTT Mobile, and KeyboardCleanTool are related
      folivora.AI products.
    - The official community site hosts support discussions and shared presets.
  sources:
    - >
      https://docs.folivora.ai/docs/configuration/presets/ — official preset import,
      export, and sharing documentation.
    - >
      https://docs.folivora.ai/docs/configuration/restoring-backups/ — official backup
      behavior and storage location.
    - >
      https://folivora.ai/ — official product description, developer attribution,
      adoption statements, and feature inventory.
    - https://folivora.ai/releases/ — official archive containing historical builds.
  summary:
    - >
      BetterTouchTool is a long-running macOS input-customization and automation
      utility. It maps gestures, buttons, keys, devices, scripts, and other triggers to
      actions and multi-step workflows.
  timeline:
    - 'Circa 2010: Earliest builds represented in the official release archive.'
    - >
      2026: Official site reports more than sixteen years on the Mac and hundreds of
      thousands of users.
  usage:
    - >
      Users define triggers from trackpads, mice, keyboards, Stream Decks, MIDI devices,
      URLs, scripts, and other inputs, then associate them with built-in or custom
      actions.
    - >
      Configurations can be organized into presets. Presets can be exported as JSON for
      backup or sharing, but the official documentation warns that imported presets may
      contain scripts and should come only from trusted sources.
