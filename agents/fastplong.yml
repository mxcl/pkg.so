config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official project documents distribution through Bioconda, prebuilt Linux
      binaries, source builds, and package-manager-supplied build dependencies. Homebrew
      packaging is recorded in source_facts.package-manager.
  package-nerd-significance:
    - >
      fastplong is notable as the long-read counterpart in OpenGene's fastp family. It
      packages common FASTQ quality-control, filtering, trimming, reporting, splitting,
      and streaming operations into one compiled command suited to high-throughput
      sequencing pipelines.
  project-history:
    - >
      OpenGene developed fastplong for preprocessing and quality control of long
      sequencing reads from platforms such as Oxford Nanopore and PacBio. Its design
      applies the fastp-style all-in-one workflow to long-read FASTQ data.
    - >
      The implementation emphasizes throughput through multithreading, SIMD-oriented
      dependencies, fast compressed I/O, streaming, and batch processing, while
      producing both machine-readable JSON and human-readable HTML reports.
  related-projects:
    - fastp is the related OpenGene tool recommended by the project for short-read data.
    - >
      libdeflate, ISA-L, and Highway are optional or recommended performance-oriented
      build dependencies.
  sources:
    - https://github.com/OpenGene/fastplong#readme
    - source_facts.package-manager
  summary:
    - >
      fastplong is a command-line preprocessing and quality-control tool for long-read
      FASTQ sequencing data. It supports filtering, adapter trimming, cutting or masking
      low-quality regions, output splitting, streaming, batch processing, and HTML/JSON
      reports.
  timeline:
    - >
      The project introduced an OpenGene long-read workflow parallel to fastp's
      established short-read role.
  usage:
    - >
      A basic run supplies FASTQ input and output with `fastplong -i in.fq -o out.fq`;
      gzip compression is inferred from filename suffixes. Without an output filename,
      quality control can still run and generate reports.
    - >
      Pipeline users can read from standard input, stream accepted reads to standard
      output, save rejected reads, split output for parallel downstream work, or use the
      supplied batch script to process folders of FASTQ files.
