display-name: Kingfisher
repo: null
docs:
  - https://github.com/mongodb/kingfisher#readme
config-file-location:
  unix:
    - kingfisher.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      MongoDB's announcement framed Kingfisher as a core part of MongoDB's internal
      security workflows before its public release. Homebrew packaging made the CLI
      installable for macOS and Linux users through the same channel many security
      engineers use for scanners and developer tools.
  package-nerd-significance:
    - >
      For package collectors, Kingfisher sits in the modern secret-scanner lineage with
      Gitleaks, TruffleHog, and Nosey Parker, but its package identity is shaped by
      Rust, Hyperscan/Vectorscan-style performance work, validation, SARIF output, and a
      report viewer bundled with the CLI.
  project-history:
    - >
      MongoDB presented Kingfisher publicly in June 2025 after describing it as a
      project that began as an internal effort to detect and verify exposed credentials.
      The project couples fast pattern matching with validation checks so security teams
      can distinguish inactive-looking findings from active credentials that require
      urgent rotation or revocation.
    - >
      The repository history and release stream show a fast-moving post-release project.
      GitHub releases list Kingfisher v1.12.0, v1.13.0, and v1.14.0 on June 25-26, 2025,
      and v1.103.0 through v1.105.0 during June 16-29, 2026.
  related-projects:
    - >
      Kingfisher imports and triages reports from Gitleaks and TruffleHog, references
      Nosey Parker as part of its scanner lineage, and outputs SARIF for integration
      with code-scanning workflows.
  sources:
    - https://api.github.com/repos/mongodb/kingfisher/releases?per_page=100
    - https://formulae.brew.sh/formula/kingfisher
    - https://github.com/mongodb/kingfisher
    - https://github.com/mongodb/kingfisher/releases
    - >
      https://www.mongodb.com/company/blog/product-release-announcements/introducing-kingfisher-real-time-secret-detection-validation
  summary:
    - >
      Kingfisher is MongoDB's open source secret scanning and live validation tool,
      written in Rust for high-throughput scans of repositories, files, archives, cloud
      storage, collaboration systems, and CI workflows.
  timeline:
    - >
      2025-06: MongoDB announced Kingfisher as an open source secret scanner with live
      validation.
    - '2025-06-25: GitHub release v1.12.0 was published.'
    - '2025-06-26: GitHub releases v1.13.0 and v1.14.0 were published.'
    - '2026-06-29: GitHub release v1.105.0 was published.'
  usage:
    - >
      Kingfisher is used to scan source trees, Git history, platform integrations,
      archives, and storage targets for leaked API keys, tokens, and credentials. Its
      CLI can emit JSON, SARIF, TOON, and HTML reports, validate supported secrets
      against provider APIs, revoke selected secret types, and open a local or hosted
      report viewer.
related-packages:
  - id: brew:trufflehog
    reason: >
      Choose TruffleHog when its established verified-secret workflow and extensive
      remote-source integrations best match your audit; Kingfisher emphasizes
      high-throughput scanning plus validation, blast-radius, and response features.
    rel: alternative
    sources:
      - >
        https://www.mongodb.com/company/blog/product-release-announcements/introducing-kingfisher-real-time-secret-detection-validation
      - https://github.com/trufflesecurity/trufflehog
  - id: brew:gitleaks
    reason: >
      Choose Gitleaks for a focused, configurable Git, directory, stdin, pre-commit, and
      CI scanner; choose Kingfisher when live validation and broader response analysis
      are central requirements.
    rel: alternative
    sources:
      - >
        https://www.mongodb.com/company/blog/product-release-announcements/introducing-kingfisher-real-time-secret-detection-validation
      - https://github.com/gitleaks/gitleaks
