history:
  adoption-history:
    - >
      The developer calls coconutBattery a standard for battery reading since 2005. Its
      long compatibility table spans PowerPC-era Mac OS X through current macOS
      releases, reflecting continued maintenance across multiple generations of Apple
      hardware.
  package-nerd-significance:
    - >
      The application is a long-lived specialist Mac utility that exposes battery-health
      data beyond the basic status shown by macOS. Its historical readings and support
      for attached iPhones and iPads make it useful for diagnosing aging devices and
      evaluating used Apple hardware.
  project-history:
    - >
      coconutBattery has provided battery readings since 2005. The current fourth
      generation monitors Macs and connected iPhones and iPads, while paid Plus editions
      add extended analytics and workflow features.
  related-projects:
    - >
      coconutID is another coconut-flavour utility concerned with identifying Apple
      hardware and its manufacturing information.
  sources:
    - 'Official product page and FAQ: https://www.coconut-flavour.com/coconutbattery/'
  summary:
    - >
      coconutBattery is a macOS battery-diagnostics utility that displays live health
      information for Mac, iPhone, and iPad batteries.
  timeline:
    - '2005: coconutBattery began providing battery readings.'
    - >
      2026-04-03: Version 4.3 added support for newer Apple hardware and corrected
      several readings and interface issues.
  usage:
    - >
      Users inspect current charge, design capacity, battery health, temperature,
      voltage, and related device data. Available features also include saving health
      records, menu-bar details, Wi-Fi device access, notifications, lifetime analysis,
      and printable reports.
