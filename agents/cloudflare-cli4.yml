repo: https://github.com/cloudflare/python-cloudflare-cli4
docs:
  - https://developers.cloudflare.com/api
  - https://github.com/cloudflare/python-cloudflare-cli4#readme
config-file-location:
  unix:
    - ~/.cloudflare/cloudflare.cfg
credentials-file-location:
  unix:
    - ~/.cloudflare/cloudflare.cfg
history:
  adoption-history:
    - >
      Its package history is tied to Python packaging and Cloudflare API users: the
      README shows pip-style installation from the repository, while the input record
      identifies the Homebrew formula cloudflare-cli4.
  package-nerd-significance:
    - >
      For package maintainers, cloudflare-cli4 is notable as a compatibility package: it
      preserves the older CLI workflow after the main Python Cloudflare package changed
      direction.
  project-history:
    - >
      The official README says this repository is a snapshot of the cli4 Python tool
      that was originally packaged with the cloudflare Python package, and that starting
      with cloudflare v3 the CLI was split out and no longer actively developed.
  related-projects:
    - >
      The README identifies the former parent package as the cloudflare Python package,
      and the docs target Cloudflare API v4.
  sources:
    - https://developers.cloudflare.com/api/ is the official Cloudflare API reference.
    - >
      https://github.com/cloudflare/python-cloudflare-cli4#readme documents the
      repository as the standalone cli4 snapshot, usage, and
      ~/.cloudflare/cloudflare.cfg.
    - source_facts.package-manager lists the Homebrew formula cloudflare-cli4.
  summary:
    - >
      cloudflare-cli4 is Cloudflare's standalone packaging of the legacy cli4 Python
      command for calling Cloudflare API v4 endpoints from a shell.
  timeline:
    - >
      2016-2024: The README copyright span identifies Cloudflare-maintained history for
      the code.
    - '2024: GitHub releases list 2.19.4 as the published release.'
    - >
      2024: The standalone repository's README says cli4 was split from the cloudflare
      Python package when that package reached v3 and was no longer actively developed.
  usage:
    - >
      The cli4 command maps shell arguments to Cloudflare API paths, supports
      JSON/YAML/NDJSON output, HTTP methods, profiles, headers, and configuration-backed
      API keys or tokens.
