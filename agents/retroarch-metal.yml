    - ~/.retroarch.cfg
    - /etc/retroarch.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      RetroArch became the reference frontend for the libretro API and was ported across
      desktop operating systems, mobile platforms, game consoles, handhelds,
      single-board computers, and browsers.
    - >
      Its distribution spans official stable and nightly builds, operating-system
      stores, Steam, direct downloads, and package managers. The macOS Metal build is
      distributed through the Homebrew cask `retroarch-metal`.
  package-nerd-significance:
    - >
      RetroArch separates a portable frontend from dynamically loaded libretro cores,
      allowing one interface, configuration model, and input stack to drive many
      emulators and game engines.
    - >
      Package maintainers must distinguish the frontend from its independently sourced
      cores and account for platform-specific graphics drivers, assets, firmware,
      controller profiles, and content. The macOS artifact retains the `Metal` name for
      historical reasons even though it now includes Vulkan and OpenGL drivers as well.
  project-history:
    - >
      RetroArch originated in 2010 as a free-software frontend and became the reference
      implementation for the libretro API. Libretro defines common audio, video, input,
      and lifecycle callbacks; emulator and game-engine implementations are loaded as
      cores.
    - >
      The project evolved into a broad cross-platform interface for emulation, game
      engines, and some media workloads. Its macOS distribution historically became
      known as the Metal build, but the current universal build includes Vulkan, OpenGL,
      and experimental Metal video drivers.
  related-projects:
    - libretro
    - Lakka
    - RetroAchievements
    - individual libretro cores
  sources:
    - https://docs.libretro.com/guides/install-macos/
    - https://docs.libretro.com/start/installation/
    - https://github.com/libretro/RetroArch
    - https://github.com/libretro/RetroArch/blob/master/retroarch.c
    - source_facts.package-manager.brew-cask
  summary:
    - >
      RetroArch is the free, cross-platform reference frontend for the libretro API. It
      loads emulator, game-engine, and other implementations as modular cores and
      presents them through a shared interface.
  timeline:
    - >
      2010: Copyright history in the official source identifies the beginning of
      RetroArch development.
    - >
      2014: Libretro published a technical brochure describing the RetroArch/libretro
      architecture.
    - >
      2026: The universal macOS build continued to carry the historical Metal name while
      bundling multiple video drivers.
  usage:
    - >
      Users install RetroArch, obtain suitable libretro cores, configure controllers and
      directories, and load legally obtained game or media content.
    - >
      Stable builds prioritize tested releases, while nightly builds expose recent
      commits. On macOS, official documentation recommends the Vulkan or OpenGL drivers
      for most users because the Metal driver remains experimental.
