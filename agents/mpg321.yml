config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The tool was designed to behave like mpg123 for front ends, scripts, and software
      that shell out to an MP3 decoder. That compatibility goal made it especially
      useful for package distributions and desktop front ends during the era when
      mpg123's licensing caused friction: mpg321 could play MP3 files, serve as a
      backend for other applications, and decode MP3 to WAV for CD-recording workflows
      while relying on the integer-only MAD decoder.
  sources:
    - https://formulae.brew.sh/formula/mpg321
    - https://linux.die.net/man/1/mpg321
    - https://mpg321.sourceforge.net/
    - https://packages.debian.org/sid/mpg321
  summary:
    - >
      mpg321 is a GPL command-line MP3 player created as a free replacement for mpg123.
      Its homepage credits Joe Drew as the person who conceived and wrote the project,
      notes that it uses code from Rob Leslie's MAD distribution, XMMS, and plaympeg
      from SMPEG, and lists Nanakos Chrysostomos as maintainer for the later
      SourceForge-hosted releases.
  usage:
    - >
      Its package-manager niche is narrow but clear: a small mpg123-compatible player
      rather than a general multimedia framework. Debian and Homebrew package it under
      its own name, and Debian describes it as a clone intended to function as a drop-in
      replacement in many cases, with some mpg123 functionality left unimplemented.
related-packages:
  - id: brew:mpg123
    reason: >
      Choose mpg123 for the original command family and its reusable decoder/output
      libraries; choose mpg321 when compatibility with the historically free
      libmad-based replacement is the priority.
    rel: alternative
    sources:
      - https://mpg321.sourceforge.net/about.html
      - https://www.mpg123.de/
