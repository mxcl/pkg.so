history:
  adoption-history:
    - >
      Padloc is distributed as web, desktop, mobile, and browser-extension clients,
      making the same encrypted-vault model available across common personal and team
      workflows.
    - >
      The project supports both its hosted service and self-hosting; the official
      repository contains the core, server, web, desktop, mobile, and extension
      components.
  package-nerd-significance:
    - >
      Padloc appeals to package enthusiasts because it combines an inspectable
      AGPL-licensed implementation with native packages, a web client, browser
      extensions, and a self-hosting path.
    - >
      Its transition from Padlock to Padloc is a useful packaging detail because legacy
      version 2 applications and services retain the old spelling.
  project-history:
    - >
      Padloc began under the name Padlock. With version 3, the project dropped the final
      “k” and introduced a substantially revised architecture with features including
      shared vaults and two-factor authentication.
    - >
      The modern project is maintained as an open-source monorepo containing shared core
      logic and clients for several platforms.
  related-projects:
    - >
      Padlock v2 and Padlock Cloud are the legacy predecessors documented by the
      official migration guide.
    - >
      The official repository describes Tauri, Electron, Cordova, progressive-web-app,
      and browser-extension front ends sharing Padloc components.
  sources:
    - https://docs.padloc.app/docs/security/
    - https://docs.padloc.app/guides/upgrade_v2/
    - https://docs.padloc.app/manual/
    - https://github.com/padloc/padloc
  summary:
    - >
      Padloc is an open-source password and sensitive-data manager for individuals and
      teams. It stores records in encrypted vaults and supports sharing,
      synchronization, item history, and multiple client forms.
  timeline:
    - >
      Version 3: The project was renamed from Padlock to Padloc and introduced a
      redesigned architecture, shared vaults, and two-factor authentication.
    - >
      Version 4: A separate modern client generation and account migration path replaced
      the legacy Padlock applications.
  usage:
    - >
      Users create an account or connect to a self-hosted instance, unlock it with a
      master password, and keep logins, secure notes, financial details, and files in
      encrypted vault items.
    - >
      Browser extensions match stored items to websites and fill forms, while
      organizations and shared vaults support controlled team or family access.
    - >
      The master password is not retained by the service and cannot be recovered, so
      users must preserve it securely.
