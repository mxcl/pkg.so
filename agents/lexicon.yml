id: brew:lexicon
display-name: Lexicon
repo: https://github.com/dns-lexicon/dns-lexicon
docs:
  - https://dns-lexicon.github.io/dns-lexicon
  - https://dns-lexicon.github.io/dns-lexicon/user_guide.html
config-file-location:
  unix:
    - $CONFIG_DIR/lexicon.yml
    - $CONFIG_DIR/lexicon_<provider>.yml
credentials-file-location:
  unix:
    - $CONFIG_DIR/lexicon.yml
    - $CONFIG_DIR/lexicon_<provider>.yml
history:
  adoption-history:
    - >
      Lexicon's adoption is tied to ACME DNS-01 automation. The PyPI project page for
      `dns-lexicon` version 2.1.22 stated that Lexicon was designed for automation,
      specifically Let's Encrypt, and the official docs include installation, Docker,
      configuration, provider options, integration, and developer-guide sections for
      adding providers.
  package-nerd-significance:
    - >
      Package nerds care about Lexicon because it is adapter glue packaged as a
      first-class tool. It turns dozens of vendor APIs into one command surface, making
      certificate automation, dynamic DNS workflows, and infrastructure scripts more
      portable.
  project-history:
    - >
      Lexicon began in the `AnalogJ/lexicon` repository, created on February 2, 2016.
      The original project described itself as a standardized way to manipulate DNS
      records across providers and accumulated a large provider-oriented ecosystem.
    - >
      The project moved to the `dns-lexicon/dns-lexicon` repository starting with
      version 3.20.0. The old repository README directs users and issue reporters to the
      new repository, while the DNS-Lexicon changelog records 3.20.0 on December 12,
      2024 and subsequent 3.20.x/3.21.x releases in the new line.
  related-projects:
    - >
      Lexicon is related to Let's Encrypt and ACME DNS-01 clients such as Certbot and
      dehydrated hooks. It also sits beside DNS automation tools such as lego, acme.sh
      integrations, octoDNS, and provider-specific DNS plugins.
  sources:
    - https://api.github.com/repos/AnalogJ/lexicon
    - https://api.github.com/repos/dns-lexicon/dns-lexicon
    - https://dns-lexicon.github.io/dns-lexicon/
    - https://dns-lexicon.github.io/dns-lexicon/changelog.html
    - https://dns-lexicon.github.io/dns-lexicon/user_guide.html
    - https://formulae.brew.sh/formula/lexicon
    - https://github.com/AnalogJ/lexicon
    - https://github.com/dns-lexicon/dns-lexicon
    - https://pypi.org/project/dns-lexicon/2.1.22/
  summary:
    - >
      DNS-Lexicon, packaged by Homebrew as `lexicon`, is a CLI and Python library for
      manipulating DNS records through a provider-neutral interface. Its practical niche
      is automation: scripts and certificate clients can create TXT, A, CNAME, and other
      records without learning each DNS provider API.
  timeline:
    - '2016: The original `AnalogJ/lexicon` repository was created on February 2, 2016.'
    - '2019: DNS-Lexicon changelog entries show the 3.1.x and 3.2.x release line in active use.'
    - '2024: Version 3.19.0 was released from the original repository on December 6, 2024.'
    - '2024: Version 3.20.0 on December 12, 2024 marked the move to `dns-lexicon/dns-lexicon`.'
    - '2026: The documentation changelog records 3.25.2 on May 10, 2026.'
  usage:
    - >
      As a CLI, Lexicon takes a provider name followed by create, update, delete, or
      list operations for DNS records. As a library, it exposes the same idea to Python
      code through a common client/configuration layer. Credentials live in
      provider-specific configuration, so automation can swap DNS providers with less
      custom glue.
related-packages:
  - id: brew:dehydrated
    reason: >
      Use dehydrated with Lexicon's documented generic hook when a shell-based ACME
      client must create and remove DNS-01 challenge records through any supported
      provider.
    rel: adjacent_workflow
    sources:
      - https://dns-lexicon.github.io/dns-lexicon/user_guide.html
      - https://github.com/dehydrated-io/dehydrated
  - id: brew:certbot
    reason: >
      Use Certbot with Lexicon's included hook when certificate issuance needs
      provider-neutral DNS-01 record automation rather than a provider-specific Certbot
      plugin.
    rel: adjacent_workflow
    sources:
      - https://dns-lexicon.github.io/dns-lexicon/user_guide.html
      - https://eff-certbot.readthedocs.io/en/latest/using.html
  - id: brew:octodns
    reason: >
      Choose octoDNS as an alternative when you want declarative, source-controlled
      reconciliation of whole DNS zones; choose Lexicon for imperative record operations
      from a CLI or Python code.
    rel: alternative
    sources:
      - https://dns-lexicon.github.io/dns-lexicon/introduction.html
      - https://github.com/octodns/octodns
