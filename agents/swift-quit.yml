history:
  adoption-history:
    - >
      Community contributions added a delay before quitting, improved handling of
      tab-close events, and introduced the option to apply automatic quitting only to
      selected applications.
    - >
      The project is distributed through its own download and a Homebrew cask, making
      the utility accessible to both conventional Mac users and command-line-oriented
      package-manager users.
  package-nerd-significance:
    - >
      Swift Quit is a focused example of a small macOS utility that changes a
      fundamental platform convention: it makes closing an application's final window
      behave more like closing a program on Windows.
    - >
      Its GPL-licensed source, small native Xcode project, and Homebrew cask make it
      straightforward to inspect, package, and modify. Because it relies on macOS
      Accessibility control, permission handling is an important part of installation
      and upgrades.
  project-history:
    - >
      Swift Quit was created as an open-source macOS utility for automatically quitting
      applications after their final window is closed. Subsequent releases added
      inclusion and exclusion lists, launch-at-login behavior, a delay before quitting,
      and the option to hide its menu-bar item.
  related-projects:
    - >
      The utility complements macOS window managers and menu-bar tools, but its role is
      specifically application termination rather than window placement.
  sources:
    - 'Official release history: https://github.com/onebadidea/swiftquit/releases'
    - 'Official repository README: https://github.com/onebadidea/swiftquit#readme'
  summary:
    - >
      Swift Quit is a GPL-licensed macOS utility that automatically terminates
      applications when their last window closes, optionally limited to or excluding
      selected applications.
  timeline:
    - >
      v1.3: Contributors added delayed quitting, better tab-close handling, and a
      selected-applications mode.
    - >
      v1.4: Finder and Spotlight became default exclusions and application-launch checks
      were improved.
    - >
      v1.5: The project simplified options, fixed launch-at-login behavior, and added
      the ability to hide the menu-bar item.
  usage:
    - >
      After granting Accessibility permission, users can make Swift Quit apply globally,
      restrict it to selected applications, or exclude applications that should remain
      running without windows.
    - >
      The official README warns that automatic quitting can cause unwanted closures in
      some workflows and recommends deliberate use of the inclusion or exclusion
      settings.
