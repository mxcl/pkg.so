config-file-location:
  unix:
    - /etc/et.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      The project documents installation through Homebrew, MacPorts, a Debian
      repository, Fedora and EPEL packages, FreeBSD, openSUSE, NixOS flakes, Docker, and
      source builds, which shows adoption primarily among command-line users who want a
      mosh-like reconnecting terminal with SSH-style invocation.
  package-nerd-significance:
    - >
      For package maintainers, `et` is notable because the package contains both client
      and daemon pieces and benefits from service integration: Homebrew launchd files,
      systemd service files, NixOS module settings, and `/etc/et.cfg` all matter as much
      as the binary.
  project-history:
    - >
      The official README frames Eternal Terminal around one idea: a remote shell that
      automatically reconnects without interrupting the session. It uses SSH for
      handshaking and encryption, then maintains its own TCP session on the server port.
  related-projects:
    - >
      The README positions usage next to SSH by requiring SSH access for handshaking and
      by supporting SSH config parsing; users often compare it with mosh because both
      address resilient remote terminal sessions.
  sources:
    - https://github.com/MisterTea/EternalTerminal
    - https://mistertea.github.io/EternalTerminal
  summary:
    - >
      Eternal Terminal is a reconnectable secure remote shell whose package name is
      usually `et`.
  timeline:
    - >
      2010s: Eternal Terminal appears as a reconnecting remote shell for roaming IP and
      flaky network sessions.
    - >
      2020s: Packaging instructions cover Homebrew, MacPorts, Debian, Fedora, FreeBSD,
      openSUSE, NixOS, Docker, and source builds.
  usage:
    - >
      Users run an `etserver` daemon on the remote host and connect with `et hostname`
      or `et user@hostname:port`. The README also documents jumphosts, port forwarding,
      command execution after setup, SSH config parsing, and `/etc/et.cfg` for server
      settings such as the listening port.
related-packages:
  - id: brew:mosh
    reason: >
      Choose Mosh for its UDP-based roaming and predictive interaction model; choose
      Eternal Terminal when native scrolling, tmux control mode, or TCP transport is
      more important.
    rel: alternative
    sources:
      - https://eternalterminal.dev/
      - https://mosh.org/
