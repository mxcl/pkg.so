credentials-file-location: null
history:
  adoption-history:
    - >
      UninstallPKG developed as a dedicated macOS utility for users who wanted to remove
      software installed through Apple installer packages. Its support for defunct
      packages, application-associated packages, package-content inspection, and
      protected system locations made it useful beyond simple application deletion.
    - >
      The application became free in 2021 and added native Apple silicon support,
      reducing barriers for package-manager users maintaining newer Macs.
  package-nerd-significance:
    - >
      UninstallPKG operates on macOS package receipts and bills of materials rather than
      treating an application bundle as the whole installation. This matters when a PKG
      has placed helpers, frameworks, drivers, or other files across the filesystem.
    - >
      Its safety rules—including refusing essential packages and retaining files shared
      by other packages—illustrate why receipt-aware removal is more complicated than
      deleting an application from `/Applications`.
  project-history:
    - >
      CoreCode released the first UninstallPKG beta in May 2013 and a paid 1.0 release
      that December. Early releases added package search, multi-package removal, cleanup
      of generated files, and removal from Dock and login items.
    - >
      Later development tracked macOS platform changes including System Integrity
      Protection, hardened runtime, notarization, Apple silicon, and Full Disk Access.
      Version 1.2.0 changed the application to a free, promotion-supported product.
  related-projects:
    - >
      UninstallPKG complements Apple's Installer and `pkgutil`, but provides a
      graphical, receipt-aware removal workflow rather than package installation or
      receipt inspection alone.
  sources:
    - https://www.corecode.io/uninstallpkg/faq.html
    - https://www.corecode.io/uninstallpkg/history.html
    - https://www.corecode.io/uninstallpkg/readme.html
  summary:
    - >
      UninstallPKG is a macOS utility from CoreCode that inspects installed PKG receipts
      and removes the files associated with selected packages, with safeguards for
      system and shared files.
  timeline:
    - '2013-05-29: Initial beta released.'
    - '2013-12-04: Version 1.0 became commercially available.'
    - '2015: Releases adapted package removal to System Integrity Protection.'
    - >
      2017: Version 1.1.0 added controlled removal of system packages without disabling
      System Integrity Protection.
    - '2021-10: Version 1.2.0 became free and added native Apple silicon support.'
    - '2023-08: Version 1.2.1 added Full Disk Access checks and background scanning.'
  usage:
    - >
      Users select an installed package, inspect its contents, and review the proposed
      file removals before confirming uninstallation. Filters expose application-related
      and defunct packages, while preferences control which installers and system
      locations are excluded.
    - >
      The official documentation warns users to remove only packages whose purpose they
      understand, since non-packaged software can depend on files recorded by a package.
