config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GNU findutils became a baseline package because find and xargs are core building
      blocks for shell scripts, build systems, package recipes, cleanup jobs, and system
      administration. Its utilities are used directly by humans and indirectly by
      scripts that need portable traversal, filtering, batching, and deletion behavior.
    - >
      On GNU/Linux systems, GNU findutils is typically the default implementation behind
      find, xargs, locate, and updatedb. On macOS and other Unix-like systems it is
      often installed explicitly when users need GNU options or behavior rather than the
      platform's BSD-derived tools.
  package-nerd-significance:
    - >
      GNU findutils is package-nerd bedrock because it is both infrastructure and user
      interface. Package builds, source cleanups, test runners, release scripts, and
      sysadmin snippets constantly rely on find and xargs semantics, so small behavior
      changes can matter across thousands of downstream projects.
    - >
      It is also a classic example of GNU userland divergence: users on BSD/macOS often
      install it specifically to get GNU find behavior, while Linux distributions treat
      it as part of the expected base command set.
  project-history:
    - >
      The findutils NEWS file traces the beginning of findutils history to 1987, with
      known releases from 1.0 in June 1990 onward. The distribution was renamed to
      findutils in release 4.1 in November 1994, after earlier 1.x, 2.x, and 3.x
      releases had already established the GNU versions of find-related tools.
    - >
      Release 4.0 in November 1994 added a Texinfo manual, man pages for updatedb and
      locate database formats, find performance work, symlink-loop handling
      improvements, locate database changes, updatedb command-line options, xargs
      performance improvements, and a test suite for xargs. Those notes show the package
      maturing from separate Unix utilities into a maintained GNU distribution.
    - >
      The modern package continues to evolve around compatibility and edge cases rather
      than novelty. GNU findutils 4.10.0, released in June 2024, changed xargs signal
      behavior to improve POSIX compliance, fixed xargs parallel-execution behavior,
      improved diagnostics, rejected obsolete year-2038-unsafe configurations, and
      updated translations.
  related-projects:
    - >
      GNU grep, GNU sed, GNU coreutils, and GNU tar are neighboring command-line
      packages in the same GNU userland culture.
    - BSD find and BSD xargs are the comparison point on macOS and BSD systems.
    - >
      mlocate and plocate are related locate-style tools in the broader
      filename-database search family.
  sources:
    - https://www.gnu.org/software/findutils/
    - https://www.gnu.org/software/findutils/manual/html_mono/find.html
    - https://ftpmirror.gnu.org/gnu/findutils/findutils-4.10.0.tar.xz
    - https://git.savannah.gnu.org/git/findutils.git
  summary:
    - >
      GNU findutils is the GNU collection of file-searching utilities: find, xargs,
      locate, and updatedb. It is one of the classic Unix-style packages that turns
      filesystem traversal, file selection, and command construction into scriptable
      command-line primitives.
  timeline:
    - '1987: Beginning of findutils history recorded in the GNU findutils NEWS file.'
    - '1990: GNU findutils 1.0 release date is recorded as June 22.'
    - >
      1994: Release 4.0 adds the Texinfo manual, updatedb and locatedb man pages, find
      improvements, locate database changes, and xargs tests.
    - '1994: Release 4.1 renames the distribution to findutils.'
    - '2003: Release 4.1.20 marks James Youngman as the new maintainer.'
    - '2015: Release 4.6.0 is described as the first stable release since 4.4.2.'
    - >
      2024: Release 4.10.0 ships POSIX-related xargs changes, diagnostics improvements,
      year-2038 build checks, documentation updates, and translation updates.
  usage:
    - >
      find traverses directory trees and selects files by name, type, time, permissions,
      ownership, size, path, expression logic, and many other predicates. It can print
      matches, delete files, execute commands, or pass NUL-delimited output into other
      tools.
    - >
      xargs turns input lists into command invocations, often pairing with find -print0
      for safe processing of filenames containing whitespace or special characters.
      locate and updatedb provide the faster database-backed counterpart: updatedb
      builds the filename database and locate searches it.
related-packages:
  - id: brew:fd
    reason: >
      Choose fd for concise interactive filename searches with parallel traversal and
      opinionated ignore-aware defaults; retain GNU Findutils for its complete
      expression language, portability role, `xargs`, and `locate`.
    rel: alternative
    sources:
      - https://github.com/sharkdp/fd
      - https://www.gnu.org/software/findutils/manual/find.html
