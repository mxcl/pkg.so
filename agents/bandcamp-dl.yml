id: brew:bandcamp-dl
display-name: bandcamp-dl
repo: https://github.com/Evolution0/bandcamp-dl
docs:
  - https://github.com/Evolution0/bandcamp-dl#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation from PyPI, wheels, source, Homebrew on
      macOS, and Arch AUR. The supplied package facts currently list Homebrew packaging,
      which is consistent with its role as a small end-user media utility rather than a
      foundational library.
  package-nerd-significance:
    - >
      bandcamp-dl is a small but recognizable example of the long tail of media
      downloaders that package managers carry for users who prefer scriptable local
      archives. The package is also a maintenance reminder: site scrapers are useful,
      but they depend on HTML and metadata behavior outside the package maintainer's
      control.
  project-history:
    - >
      The public repository history begins in April 2013. The current project metadata
      names the PyPI package bandcamp-downloader and lists Iheanyi Ekechukwu and Anthony
      Forsberg as authors, with the GitHub repository as its source and tracker.
    - >
      The changelog shows the project maturing through the 0.0.x releases with practical
      downloader concerns: safer interrupted downloads, album-art controls,
      individual-track support, ID3/tagging compatibility, dependency cleanup, and
      Python 3-focused maintenance.
  related-projects:
    - >
      bandcamp-dl is related to youtube-dl and yt-dlp in package-manager culture, but it
      is narrower: it targets Bandcamp album and track pages rather than broad
      video-site extraction.
  sources:
    - https://github.com/Evolution0/bandcamp-dl
    - https://github.com/Evolution0/bandcamp-dl/blob/master/CHANGELOG.rst
    - https://github.com/Evolution0/bandcamp-dl/blob/master/README.rst
    - https://github.com/Evolution0/bandcamp-dl/blob/master/pyproject.toml
    - >
      https://github.com/Evolution0/bandcamp-dl/commit/9a24e93ab968b5d566724fe5d1be3654a852dc23
    - input.source_facts.package-manager
  summary:
    - >
      bandcamp-dl is a Python command-line downloader for Bandcamp albums and tracks. It
      follows the youtube-dl tradition of a small CLI that turns media-site pages into
      local files, but it is specialized for Bandcamp metadata, album art, lyrics, and
      filename templating.
  timeline:
    - '2013: Public Git history begins with the initial repository commits.'
    - '2016: v0.0.5 documents ID3, incomplete-download, and dependency improvements.'
    - '2017: v0.0.6 marks the last version to officially support Python 2.7.x.'
    - '2017: v0.0.7 adds safer resume behavior and cleaner CLI output.'
    - '2025: v0.0.17 is tagged with a lyrics-related fix.'
  usage:
    - >
      The basic interface is bandcamp-dl URL, with options for artist, album, and track
      slugs, output templates, base directory, album-art embedding, lyrics embedding,
      filename normalization, and overwrite/resume behavior.
    - >
      Its README explicitly frames bug reports around reproducible URLs and command
      options, which is typical for site-specific download tools that must adapt when
      the upstream website changes.
related-packages:
  - id: brew:yt-dlp
    reason: >
      Choose yt-dlp when you need Bandcamp extraction within a much broader multi-site
      media workflow; its official extractor list includes Bandcamp tracks, albums,
      users, and weekly shows.
    rel: alternative
    sources:
