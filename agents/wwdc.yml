history:
  adoption-history:
    - >
      The project is developed openly under a BSD license and has attracted a
      substantial contributor and user community on GitHub.
    - >
      It packages Apple's freely available developer-conference material into a
      Mac-focused interface with persistent local viewing state, making the annual
      session archive easier to browse as an ongoing technical library.
  package-nerd-significance:
    - >
      WWDC is a developer-oriented media client distributed as a macOS cask and built
      from an established open-source Swift codebase.
    - >
      It is interesting to package maintainers because it combines native video
      playback, searchable transcripts, local annotations, automatic updates, and
      optional CloudKit synchronization around content hosted by Apple.
  project-history:
    - >
      WWDC was created as an unofficial native macOS application for watching Apple's
      Worldwide Developers Conference streams and session videos.
    - >
      The application grew beyond basic playback to cover schedules, prior-year
      archives, searchable multilingual transcripts, favorites, progress tracking,
      bookmarks with annotations, clip sharing, picture-in-picture, and optional iCloud
      synchronization.
  related-projects:
    - >
      Apple's Developer app and developer website are the authoritative sources for the
      conference videos and session links used by the application.
    - >
      The codebase uses Realm for storage and caching, Sparkle for automatic updates,
      CloudKitCodable for synchronization, and Siesta for networking.
  sources:
    - https://github.com/insidegui/WWDC#readme
    - https://wwdc.io/
  summary:
    - >
      WWDC is an unofficial open-source macOS client for watching Apple
      developer-conference livestreams and session videos and organizing them with
      transcripts, progress, favorites, notes, and bookmarks.
  timeline:
    - The project began as an unofficial native macOS viewer for WWDC content.
    - >
      Later releases added schedules, historical session access, searchable transcripts,
      bookmarks, clip sharing, and optional iCloud synchronization.
  usage:
    - >
      Developers browse conference editions, follow the current schedule, watch live or
      archived sessions at adjustable speeds, search transcripts, and jump directly to
      relevant moments.
    - >
      Favorites, viewing progress, and annotated bookmarks help turn the session catalog
      into a reusable learning reference; optional iCloud support synchronizes that
      state across Macs.
