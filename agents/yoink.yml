history:
  adoption-history:
    - >
      Yoink has remained a maintained independent Mac utility through multiple macOS
      generations. Its developer states that it has repeatedly been featured by the Mac
      App Store in productivity and time-saving collections, and it is also distributed
      directly and through Setapp.
  package-nerd-significance:
    - >
      Yoink exemplifies the focused indie macOS utility: it modifies a basic desktop
      interaction without replacing Finder. Its support for Terminal, Automator, system
      services, Quick Actions, Handoff, and clipboard workflows makes it especially
      appealing to users who automate or heavily customize their Macs.
  project-history:
    - >
      Solo developer Matthias Gansrigler-Hrad released Yoink for Mac in 2011; the
      official developer blog marked its fifteenth anniversary in 2026. The application
      began as a temporary shelf designed to simplify dragging files between windows,
      spaces, and full-screen applications.
    - >
      Subsequent releases expanded the shelf beyond Finder files to application content
      and added system services, Quick Actions, Terminal and Automator use, Handoff,
      Continuity Camera, and an optional local clipboard history.
  related-projects:
    - >
      Eternal Storms Software also develops ScreenFloat, Transloader, DeskMat, and an
      independently purchased Yoink edition for iPhone and iPad.
  sources:
    - 'Official Yoink product page: https://eternalstorms.at/yoink/mac/'
    - 'Official Yoink usage tips: https://eternalstorms.at/yoink/mac/tips/'
    - >
      Official developer anniversary post:
      https://blog.eternalstorms.at/2026/09/01/happy-15th-birthday-yoink-for-mac/
    - 'Official privacy policy: https://eternalstorms.at/privacypolicy/'
    - source_facts.package-manager
  summary:
    - >
      Yoink is an independent macOS drag-and-drop utility that presents a temporary
      shelf for files and application content, freeing the pointer while the user
      navigates to a destination.
  timeline:
    - '2011: Yoink for Mac was first released.'
    - >
      2012: Yoink 2.0 expanded the shelf to accept application content such as text,
      images, and links.
    - '2020: Official workflow guidance documented Terminal and Automator integration.'
    - "2026: Eternal Storms Software marked Yoink for Mac's fifteenth anniversary."
  usage:
    - >
      A user begins dragging a file or content item, drops it onto Yoink's edge- or
      cursor-based shelf, navigates freely, and then drags the item to its destination.
      Power-user workflows include Finder services, keyboard shortcuts, Terminal's `open
      -a Yoink`, Automator actions, clipboard recall, and cross-device Handoff.
