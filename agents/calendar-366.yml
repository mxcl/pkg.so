history:
  adoption-history:
    - >
      Calendar 366 II was distributed for macOS as both a full desktop calendar and a
      compact menu-bar calendar. The product subsequently evolved into a universal
      Calendar 366 application spanning Mac, iPhone, iPad, and Apple Watch, while the
      official site retained downloads for the earlier Calendar 366 II generation.
  package-nerd-significance:
    - >
      The cask captures the second-generation standalone macOS edition from before
      Calendar 366 moved to its current universal Apple-platform distribution. It is
      representative of polished menu-bar calendar utilities that augment Apple's system
      calendar database without replacing the user's synchronization provider.
  project-history:
    - >
      Calendar 366 II is the second major generation of Vincent Miethe's Calendar 366
      application for macOS. It combines calendar events and reminders in a configurable
      desktop and menu-bar interface.
    - >
      The current Calendar 366 product broadened the design across Apple's device
      platforms and added direct integrations with services including Google, Outlook,
      Microsoft 365, Todoist, Zoom, Fastmail, and CalDAV.
  related-projects:
    - >
      Apple Calendar and Reminders supply system calendars and tasks that Calendar 366
      can access with user permission.
    - >
      The application can connect to iCloud, Google, Outlook, Microsoft 365, Todoist,
      Zoom, Fastmail, CalDAV, and subscribed ICS calendars.
  sources:
    - https://calendar366.com/
    - https://calendar366.com/help/index.html
    - https://nspektor.com/en/privacy
  summary:
    - >
      Calendar 366 II is a native macOS calendar and task application centered on a
      full-featured menu-bar calendar, natural-language event entry, reminders, and
      customizable views.
  timeline:
    - 'Version 1: Calendar 366 Plus established the earlier product generation.'
    - 'Version 2: Calendar 366 II became the second-generation macOS edition.'
    - >
      2026: The current Calendar 366 is offered as a universal application across Mac,
      iPhone, iPad, and Apple Watch, with legacy Calendar 366 II downloads still
      referenced by the official site.
  usage:
    - >
      Users view and edit events and reminders from the menu bar or desktop window,
      create items with natural-language input, switch among calendar sets and views,
      and use keyboard shortcuts or URL-scheme automation.
    - >
      Calendar data can come from Apple's system database or connected calendar
      providers. The official privacy documentation says events and reminders remain on
      the device except when synchronized through a provider selected by the user.
