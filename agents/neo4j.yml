id: brew:neo4j
display-name: Neo4j
repo: https://github.com/neo4j/neo4j
docs:
  - https://neo4j.com/docs
  - https://neo4j.com/docs/getting-started
  - https://neo4j.com/docs/operations-manual/current
config-file-location:
  unix:
    - <NEO4J_HOME>/conf/neo4j.conf
    - <NEO4J_HOME>/conf/neo4j-admin.conf
    - /etc/neo4j/neo4j.conf
    - /etc/neo4j/neo4j-admin.conf
  windows:
    - <NEO4J_HOME>\conf\neo4j.conf
    - <NEO4J_HOME>\conf\neo4j-admin.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Neo4j helped define the graph database category for package managers and
      application developers. Neo4j's milestone list connects the project to the NoSQL
      wave in 2009, Cypher in 2011, the O'Reilly Graph Databases book and GraphConnect
      conferences in 2012, labeled property graphs in Neo4j 2.0 in 2013, openCypher in
      2015, and Bolt/native drivers in Neo4j 3.0 in 2016.
  package-nerd-significance:
    - >
      For package history, Neo4j is the major graph database in this batch: a long-lived
      Java server, a query-language ecosystem, dedicated CLI/admin tools, and many
      downstream integrations. The Homebrew formula API snapshot generated on 2026-06-30
      reported 12,248 installs over 365 days and 720 installs over 30 days, far above
      the smaller neighboring packages in this batch.
  project-history:
    - >
      Neo4j's official open-source history says development began in 2000 while the
      founders were building a content management system and needed a relationship-first
      data model that relational databases did not handle well. The same timeline says
      the property graph model was invented in 2000, a graph database entered 24/7
      production in 2003, and Neo4j 1.0 shipped in 2007 as open-source and commercial
      packages.
  related-projects:
    - Cypher
    - openCypher
    - APOC
    - Bolt
    - cypher-shell
    - Neo4j Aura
    - Neo4j Graph Data Science
  sources:
    - https://formulae.brew.sh/api/formula/neo4j.json
    - https://github.com/neo4j/neo4j
    - https://neo4j.com/docs/getting-started/graph-database/
    - https://neo4j.com/open-source-project/
  summary:
    - >
      Neo4j is a transactional property graph database centered on nodes, relationships,
      properties, and the Cypher query language. The Homebrew package installs the
      self-managed Community Edition tooling, including the neo4j and neo4j-admin
      executables, and defines a Homebrew service that runs neo4j console from the
      package prefix.
  timeline:
    - >
      2000: Neo4j development begins and the property graph model is invented, according
      to Neo4j.
    - '2003: First graph database in 24/7 production, according to Neo4j.'
    - '2007: Neo4j 1.0 released as open-source and commercial packages.'
    - '2011: Cypher launched.'
    - '2015: openCypher standards project launched.'
    - '2016: Neo4j 3.0 added APOC procedures, Bolt, native drivers, and a cost-based optimizer.'
    - '2026-06-30: Homebrew API snapshot listed stable version 2026.05.0.'
  usage:
    - >
      Package users tend to install Neo4j locally for development, demos, integration
      tests, graph modeling, and Cypher experimentation before moving to a managed Aura
      instance or a production self-managed deployment. Homebrew's formula depends on
      cypher-shell and OpenJDK 21, exposes neo4j and neo4j-admin, and wires a service
      for launching the database under the Homebrew var directories.
related-packages:
  - id: cask:neo4j-desktop
    reason: >
      Choose Neo4j Desktop for a graphical local development workspace that manages DBMS
      instances and associated tools, rather than operating the standalone server
      package directly.
    rel: alternative
    sources:
      - https://neo4j.com/docs/desktop/current/
      - https://neo4j.com/docs/operations-manual/current/
  - id: brew:cypher-shell
    reason: >
      Cypher Shell is Neo4j's separately installable command-line client for running
      Cypher and administrative commands against local or remote Neo4j DBMS instances.
    rel: adjacent_workflow
    sources:
      - https://neo4j.com/docs/operations-manual/current/cypher-shell/
      - https://neo4j.com/docs/operations-manual/current/tools/cypher-shell/
  - id: brew:neo4j-mcp
    reason: >
      Neo4j MCP exposes a running Neo4j database to MCP-compatible clients so assistants
      and agents can inspect graph schema and execute permitted Cypher operations.
    rel: adjacent_workflow
    sources:
      - https://neo4j.com/docs/mcp/current/
      - https://neo4j.com/docs/mcp/current/configuration/
