config-file-location:
  macos:
    - ~/Library/Preferences/com.goodsnooze.MacWhisper.plist
credentials-file-location:
  macos:
    - ~/Library/Application Support/MacWhisper/mdmlicense.plist
history:
  adoption-history:
    - >
      MacWhisper found an audience among journalists, researchers, students, podcasters,
      and other Mac users who wanted Whisper-quality transcription with a native
      graphical workflow and the option to keep sensitive media on-device.
    - >
      The product expanded beyond file transcription into recording, dictation, meeting
      capture, speaker recognition, translation, batch processing, cloud-provider
      integrations, automation, and a command-line interface.
  package-nerd-significance:
    - >
      MacWhisper helped package OpenAI's Whisper model family into an approachable
      native macOS application, avoiding the Python environments, model setup, and
      command-line workflow commonly associated with early Whisper use.
    - >
      For automation-minded users, watch folders, export formats, webhooks, and the `mw`
      CLI bridge the gap between a consumer Mac app and scriptable transcription
      infrastructure.
  project-history:
    - >
      Independent developer Jordi Bruin created and maintains MacWhisper as part of the
      Good Snooze family of macOS utilities.
    - >
      Over successive releases it added more local transcription engines and models,
      optional cloud transcription and language-model services, system-wide dictation,
      meeting workflows, and professional export and automation features.
    - >
      MacWhisper 14 introduced a redesigned editor and performance improvements;
      subsequent 14.x work continued expanding transcription providers and
      meeting-oriented workflows.
  related-projects:
    - >
      Built around speech-recognition model ecosystems including OpenAI Whisper,
      WhisperKit, NVIDIA Parakeet, and optional cloud transcription services.
    - >
      Related Good Snooze utilities include MacGPT and other native macOS productivity
      applications.
  sources:
    - 'Official CLI guide: https://docs.macwhisper.com/article/57-macwhisper-command-line-tool'
    - >
      Official MacWhisper 14 announcement:
      https://goodsnooze.gumroad.com/p/macwhisper-14-0-new-editor-improved-performance-and-what-s-next
    - 'Official product page: https://goodsnooze.gumroad.com/l/macwhisper'
    - 'Official support site: https://docs.macwhisper.com/'
  summary:
    - >
      MacWhisper is a native macOS transcription application by Jordi Bruin that turns
      audio and video into editable text using local or optional cloud
      speech-recognition models. It wraps model management, recording, transcription,
      editing, export, and automation in a Mac-focused product.
  timeline:
    - 'Early 2020s: MacWhisper emerged as a native Mac interface for Whisper transcription.'
    - >
      2026: MacWhisper 14 introduced a redesigned transcript editor and broad
      performance improvements.
    - >
      2026: The `mw` command-line tool extended MacWhisper into terminal scripts and
      agent workflows.
  usage:
    - >
      Users drag in or record audio and video, select a recognition model, edit
      synchronized transcripts, identify speakers, translate content, and export text,
      subtitle, document, or structured formats.
    - >
      Local transcription is emphasized for sensitive recordings, while Pro workflows
      can optionally use third-party API keys and cloud services.
