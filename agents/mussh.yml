history:
  sources:
    - https://formulae.brew.sh/formula/mussh
    - https://linux.die.net/man/1/mussh
    - https://sourceforge.net/projects/mussh/
  summary:
    - >
      mussh, the MUltihost SSH Wrapper, is a small Unix shell utility from the
      SourceForge era of system-administration tooling. The SourceForge project was
      registered in 2001 and describes the program as a shell script for executing a
      command or script over SSH on multiple hosts with one command, using ssh-agent and
      public-key authentication where possible to avoid repeated password prompts.
  usage:
    - >
      Its niche is deliberately narrower than configuration-management systems: it
      broadcasts one-off remote commands or scripts across host lists. That made it
      useful for administrators who needed a simple SSH fan-out tool without adopting a
      larger orchestration stack. Packaging in Homebrew and major Linux distributions
      keeps it in the lightweight CLI/sysadmin category alongside tools such as pssh and
      pdsh.
related-packages:
  - id: brew:pssh
    reason: >
      Choose PSSH when you also need parallel scp, rsync, file collection, or
      process-killing commands in addition to parallel SSH execution; mussh is the
      smaller shell-wrapper option.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/mussh/
      - https://github.com/lilydjwg/pssh
  - id: brew:pdsh
    reason: >
      Choose pdsh for high-fan-out cluster administration with multithreading and
      optional SSH, Slurm, genders, netgroup, and dsh-group modules; choose mussh for a
      minimal OpenSSH shell wrapper.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/mussh/
      - https://github.com/chaos/pdsh
