history:
  adoption-history:
    - >
      ktea's documented adoption surface is small: Homebrew packaging for macOS and
      downloadable release binaries for Linux and Windows. Its niche is Kafka operators
      and developers who prefer a terminal UI over web consoles or ad hoc Kafka CLI
      commands.
  package-nerd-significance:
    - >
      ktea is package-nerd interesting as part of the wave of focused terminal UIs that
      wrap operational systems in a k9s-like workflow. For Kafka, that means packaging a
      Go TUI plus cross-platform release artifacts rather than asking users to assemble
      shell commands around Kafka admin tools.
  project-history:
    - >
      The project is organized as a Go application with a command under cmd/ktea and UI,
      schema registry, Kafka Connect, and admin-related packages. The README documents
      multi-cluster support, topic management, record consumption, consumer-group views,
      Schema Registry browsing, and Kafka Connect integration.
  related-projects:
    - >
      Related tools and systems include Apache Kafka, Kafka Connect, Schema Registry,
      k9s, and Kafka command-line administration tools.
  sources:
    - https://github.com/jonas-grgt/ktea
    - https://github.com/jonas-grgt/ktea/releases
    - https://github.com/jonas-grgt/ktea/tags
  summary:
    - >
      ktea is a Kafka terminal client for browsing and operating Kafka clusters from a
      TUI. Its README positions it for users who like the k9s style of terminal-native
      cluster navigation.
  timeline:
    - >
      2025-2026: The repository release stream published cross-platform binaries through
      GitHub releases.
    - >
      2026-03-03: Release v0.8.0 was published with packaged artifacts for macOS, Linux,
      and Windows.
    - '2026: The README documented Homebrew installation via the jonas-grgt/ktea tap.'
  usage:
    - >
      Users configure clusters in ~/.config/ktea/config.yaml or through the TUI, then
      navigate topics, schemas, consumer lag, records, and Kafka Connect resources with
      keyboard-driven tables.
related-packages:
  - id: brew:kafkactl
    reason: >
      Choose kafkactl instead when Kafka administration needs a scriptable kubectl-style
      CLI with contexts, ACL operations, schemas, and credential-keyring support rather
      than an interactive TUI.
    rel: alternative
    sources:
      - https://github.com/jonas-grgt/ktea#features
      - https://deviceinsight.github.io/kafkactl/
  - id: brew:kaf
    reason: >
      Choose Kaf for a lightweight command-oriented Kafka workflow that can inspect
      groups and topics, produce or consume records, reset offsets, and compose
      operations in shell pipelines.
    rel: alternative
    sources:
      - https://github.com/jonas-grgt/ktea#features
      - https://github.com/birdayz/kaf#readme
  - id: brew:kcat
    reason: >
      Choose kcat when the main requirement is a small non-JVM producer, consumer,
      metadata inspector, or pipe-friendly Kafka debugging tool rather than cluster
      administration through a TUI.
    rel: alternative
    sources:
      - https://github.com/jonas-grgt/ktea#features
      - https://github.com/edenhill/kcat#readme
