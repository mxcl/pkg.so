id: cask:megacmd-app
display-name: MEGAcmd
repo: https://github.com/meganz/MEGAcmd
docs:
  - https://github.com/meganz/MEGAcmd/blob/master/README.md
  - https://github.com/meganz/MEGAcmd/blob/master/UserGuide.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      MEGA distributes MEGAcmd for Linux, macOS, Windows, and some NAS environments. The
      input also records its availability as the Homebrew cask megacmd-app.
  package-nerd-significance:
    - >
      MEGAcmd exposes a consumer cloud-storage service through interactive and
      scriptable commands, making synchronization, backup, transfers, and remote-file
      automation usable from shells and scheduled jobs.
  project-history:
    - >
      MEGA developed MEGAcmd as its official command-line application, built around a
      background server, an interactive shell, and non-interactive mega-* client
      commands.
  related-projects:
    - MEGA C++ SDK, which supplies the lower-level MEGA functionality used by MEGAcmd.
    - >
      MEGAsync, which uses the same synchronization mechanism according to the MEGAcmd
      user guide.
  sources:
    - https://github.com/meganz/MEGAcmd
    - https://github.com/meganz/MEGAcmd/blob/master/UserGuide.md
    - source_facts.package-manager
  summary:
    - >
      MEGAcmd is MEGA's official interactive and scriptable command-line client for
      accessing accounts and files without the graphical web client.
  timeline:
    - >
      Public project era: MEGA maintains MEGAcmd in the meganz GitHub organization and
      distributes packages for its supported platforms.
  usage:
    - >
      Use the interactive mega-cmd shell for exploratory account work or the individual
      mega-* commands in scripts. Common workflows include file transfer,
      synchronization, scheduled backup, link management, and WebDAV or streaming
      access.
    - >
      A login creates a local cache beneath the user's home directory containing account
      cache data, session state, and saved sync, backup, and WebDAV configuration. The
      official guide does not give a stable exact pathname, so no config or credentials
      file location is asserted.
tags:
  - backup
