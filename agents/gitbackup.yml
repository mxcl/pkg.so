id: brew:gitbackup
display-name: gitbackup
repo: null
docs:
  - https://github.com/amitsaha/gitbackup#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/gitbackup/gitbackup.yml
    - ~/.config/gitbackup/gitbackup.yml
  macos:
    - ~/Library/Application Support/gitbackup/gitbackup.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      gitbackup serves a practical niche rather than a broad platform role: independent
      developers, consultants, and organizations that want a repeatable backup path for
      repositories spread across hosted forges. Homebrew packaging gave macOS users a
      direct installation path, while release binaries and containers cover other
      deployments.
  package-nerd-significance:
    - >
      The package is a reminder that source hosting is not a backup strategy by itself.
      In package-manager terms, gitbackup wraps forge APIs, Git clone behavior, and
      host-specific credentials into one installable disaster-recovery utility.
  project-history:
    - >
      Amit Saha's project dates back to at least 2017, when the README pointed readers
      of a Linux Journal article to the lj-0.1 era of the source. The tool grew from
      repository cloning into a broader backup utility with service-specific
      authentication, OS-specific configuration paths, Docker images, and a GitHub
      migration mode.
  related-projects:
    - Git provides the clone and repository data model.
    - GitHub, GitLab, Bitbucket, and Forgejo provide the hosted repository APIs.
    - GitHub's Migration API supplies the archive-based GitHub backup mode.
  sources:
    - https://formulae.brew.sh/formula/gitbackup
    - https://github.com/amitsaha/gitbackup
    - https://github.com/amitsaha/gitbackup/releases
    - https://raw.githubusercontent.com/amitsaha/gitbackup/master/README.md
  summary:
    - >
      gitbackup is a Go command-line tool for backing up repositories from GitHub,
      GitLab, Bitbucket, and Forgejo. It is aimed at users and teams that want local or
      migration-style copies of hosted Git repositories.
  timeline:
    - '2017: v0.1-era source associated with a Linux Journal backup article.'
    - '2019: 0.4 and 0.5 release tags followed the early Go CLI line.'
    - '2021: 0.6 added the documented GitHub OAuth device flow.'
    - '2026: README described commercial support by Common Loop Works Pty Ltd.'
  usage:
    - >
      Practitioners configure service tokens, choose a provider, and run gitbackup to
      clone repositories into a backup directory. GitHub users can also use
      migration-oriented commands that retrieve archive artifacts supported by GitHub's
      Migration API.
