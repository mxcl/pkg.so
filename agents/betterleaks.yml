  - https://github.com/betterleaks/betterleaks/blob/main/docs/config.md
  - https://github.com/betterleaks/betterleaks/blob/main/docs/scanning.md
  - https://github.com/betterleaks/betterleaks#readme
config-file-location:
  unix:
    - ./.betterleaks.toml
    - ./.gitleaks.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption history is still young, but the input already records Homebrew, Fedora,
      MacPorts, Nix, and winget packaging. The project also publishes container usage
      through GitHub Container Registry in its README installation examples.
  package-nerd-significance:
    - >
      Betterleaks matters to package nerds as a fast-moving 2026 entry in the
      secret-scanning ecosystem: it inherits expectations from Gitleaks but pushes more
      logic into configurable filters and validation. The interesting packaging angle is
      how quickly a security CLI can appear across Homebrew, Linux packages, containers,
      and Windows package feeds.
  project-history:
    - >
      The official repository was created in February 2026 and describes Betterleaks as
      maintained by the people behind Gitleaks, including Gitleaks' original author.
      Early 2026 releases moved quickly, reaching v1.6.0 by June 2026.
  related-projects:
    - >
      Related projects include Gitleaks, TruffleHog, git-secrets, detect-secrets, and
      hosted secret-scanning features in GitHub and GitLab.
  sources:
    - https://api.github.com/repos/betterleaks/betterleaks
    - https://api.github.com/repos/betterleaks/betterleaks/releases
    - https://raw.githubusercontent.com/betterleaks/betterleaks/main/README.md
    - source_facts.package-manager
  summary:
    - >
      Betterleaks is a new secrets-scanning CLI focused on configurable detection,
      contextual filtering, secret validation, and scanning across Git, local
      directories, GitHub, GitLab, Hugging Face, S3, and stdin.
  timeline:
    - '2026: Repository created in February.'
    - '2026: Early 1.x releases published through spring and summer.'
    - '2026: v1.6.0 released in June.'
  usage:
    - >
      Betterleaks is used to scan repositories, local paths, hosted forges, object
      storage, and stdin for secrets. Its configuration model uses TOML rules with
      Expr-based filters and validation checks, and it keeps compatibility with
      Gitleaks-shaped configs.
related-packages:
  - id: brew:gitleaks
    reason: >
      Choose Gitleaks when you want the older, broadly established scanner and its
      mature pre-commit, CI, and GitHub Action ecosystem; Betterleaks is maintained by
      people from that project but adds a newer filtering and credential-analysis model.
    rel: alternative
    sources:
      - https://github.com/betterleaks/betterleaks
      - https://github.com/gitleaks/gitleaks
  - id: brew:trufflehog
    reason: >
      Choose TruffleHog when verified-secret detection and its documented source
      integrations are the priority; choose Betterleaks when you want highly
      configurable Expr-based filtering, validation, analysis, and embeddable Go APIs.
    rel: alternative
    sources:
      - https://github.com/betterleaks/betterleaks
      - https://github.com/trufflesecurity/trufflehog
  - id: brew:git-secrets
    reason: >
      Use git-secrets as a lightweight local Git-hook gate to block configured
      credential patterns before commit, alongside broader Betterleaks scans of history,
      hosted platforms, and artifacts.
    rel: adjacent_workflow
    sources:
      - https://github.com/betterleaks/betterleaks/blob/main/docs/scanning.md
      - https://github.com/awslabs/git-secrets
