history:
  adoption-history:
    - >
      Arctic is distributed as a native macOS application and is also packaged as the
      Homebrew cask `arctic`, giving command-line-oriented Mac administrators and
      editors a reproducible installation route.
  package-nerd-significance:
    - >
      Arctic is notable in media-production package collections because it applies
      storage inspection and cleanup workflows to Final Cut Pro libraries, including
      render files, proxies, optimized media, caches, and other reproducible data.
  project-history:
    - >
      The product was previously named Final Cut Library Manager. Hedge introduced the
      Arctic name in April 2024 and provided migration support for data created by the
      older application.
  related-projects:
    - >
      Final Cut Pro supplies the library format Arctic inspects. Hedge's PostLab is an
      adjacent product for versioning and collaboration around editing libraries.
  sources:
    - 'Official Arctic documentation: https://docs.hedge.video/arctic'
    - 'Official Arctic product page: https://hedge.co/products/arctic'
    - 'Official Arctic release history: https://docs.hedge.video/arctic/releases'
  summary:
    - >
      Arctic is Hedge's macOS utility for inspecting, reporting on, and safely cleaning
      Final Cut Pro libraries. It descends from Final Cut Library Manager and is aimed
      at editors managing large libraries across local, network, and archival storage.
  timeline:
    - >
      2011–2023: Final Cut Library Manager established the product lineage later
      inherited by Arctic.
    - '2024-04-02: First Arctic release.'
    - '2024-07: Arctic added migration support for Final Cut Library Manager data.'
    - '2025-04-23: Arctic 25.1 added sending libraries to PostLab.'
    - '2026-01-20: Arctic 26.1 added Final Cut Pro 12 support.'
  usage:
    - >
      Users connect or mount volumes, let Arctic scan for `.fcpbundle` libraries, and
      inspect their media and generated-data footprint. Arctic can remove reproducible
      library data, search library contents, export media reports as CSV, and create
      library templates.
