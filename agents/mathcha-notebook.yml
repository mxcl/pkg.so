history:
  adoption-history:
    - >
      Mathcha serves users who need fast visual mathematics input without learning
      LaTeX. Mathcha Notebook extends the browser editor to a licensed desktop
      application whose documents remain on the user's machine and which removes the
      online edition's document-count limit.
  package-nerd-significance:
    - >
      Mathcha Notebook is notable as a cross-platform, privacy-oriented desktop
      packaging of a specialized WYSIWYG mathematics editor. It targets the space
      between equation widgets in general-purpose word processors and full TeX authoring
      systems.
  project-history:
    - >
      Mathcha.io identifies Bui Duc Nha as the developer and maintainer. Its official
      site dates the service to at least 2018, and the published changelog records
      active feature development through 2022. Mathcha Notebook packages the editor for
      offline desktop use.
  related-projects:
    - Mathcha Online
    - LaTeX
    - MathJax
  sources:
    - 'Official Mathcha Notebook page: https://www.mathcha.io/notebook/'
    - 'Official about page: https://cdn.mathcha.io/about'
    - 'Official changelog: https://cdn.mathcha.io/change-log'
    - 'Official documentation: https://www.mathcha.io/documentation/'
  summary:
    - >
      Mathcha Notebook is the licensed desktop edition of Mathcha, a visual editor for
      documents combining ordinary text, mathematical notation and diagrams.
  timeline:
    - "2018: Mathcha's official site copyright history begins"
    - '2022: The official changelog records continued editor and diagram development'
    - '2026: The official documentation describes document snapshots and restoration'
  usage:
    - >
      Users compose notes, homework and tutorials in mixed text and math modes, insert
      symbols through backslash-driven suggestions or handwriting recognition, create
      diagrams, and export portable Mathcha documents. Unlike the online edition,
      Notebook stores document data locally and does not support sharing.
