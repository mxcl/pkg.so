history:
  adoption-history:
    - >
      KKBOX expanded from Taiwan to Hong Kong in 2009, entered Japan through its work
      with KDDI, and launched in Singapore and Malaysia in 2013. Official company
      history records mobile clients, social listening, Facebook partnership in
      Asia-Pacific, Chromecast support, personalized recommendations, and smartwatch
      availability as successive adoption milestones.
  package-nerd-significance:
    - >
      KKBOX is significant as a long-running Asian streaming service with desktop,
      mobile, web, wearable, and living-room clients. The Homebrew cask gives macOS
      users a package-managed installation path for a proprietary subscription media
      application—an increasingly common role for cask ecosystems.
  project-history:
    - >
      KKBOX launched in Taiwan in 2005. KKCompany describes it as the world's first
      legally authorized music-streaming service. It grew from a single streaming
      product into a flagship cross-market audio platform and later broadened its
      positioning toward music, podcasts, social listening, and other audio experiences.
  related-projects:
    - >
      KKCompany Technologies operates KKBOX alongside multimedia and cloud brands
      including BlendVision and Going Cloud.
    - >
      LISMO Unlimited, developed with KDDI, was renamed KKBOX when the brand formally
      entered Japan in 2013.
  sources:
    - >
      https://ir.kkcompany.com/files/uploads/%E5%85%AC%E9%96%8B%E8%AA%AA%E6%98%8E%E6%9B%B8/2023%20Annual%20Report%2020240607_Final.pdf
    - https://www.kkcompany.com/en-us-2/
    - https://www.kkcompany.com/newsroom/kkbox-to-launch-family-plan/
  summary:
    - >
      KKBOX is a subscription music and audio streaming service originating in Taiwan
      and serving multiple Asian markets.
  timeline:
    - '2005: KKBOX launched in Taiwan.'
    - >
      2009: Service expanded to Hong Kong and released iPhone, iPod touch, and Android
      clients.
    - '2011: Social listening and the KDDI-backed LISMO Unlimited service launched.'
    - "2012: Became Facebook's first Asia-Pacific music-streaming partner."
    - '2013: Launched in Singapore and Malaysia; LISMO Unlimited became KKBOX in Japan.'
    - '2015: Added personalized recommendations and smartwatch support.'
    - '2020: Repositioned toward a broader social-audio identity.'
  usage:
    - >
      Users sign in with a KKID through the desktop app or web player to stream licensed
      music and other audio content, manage personalized recommendations and playlists,
      and use subscription features available in their market.
