id: brew:git-subrepo
display-name: git-subrepo
repo: null
docs:
  - https://github.com/ingydotnet/git-subrepo/wiki
  - https://github.com/ingydotnet/git-subrepo#readme
config-file-location:
  unix:
    - <subrepository>/.gitrepo
credentials-file-location: null
history:
  adoption-history:
    - >
      git-subrepo serves a persistent niche: projects that want vendored source trees
      with upstream synchronization but do not want users to run git submodule update.
      Its package-manager presence in Homebrew, Debian, Nix, and openSUSE-style
      packaging gives maintainers a packaged alternative for teams that reject Git
      submodules but still need upstream push and pull operations.
  package-nerd-significance:
    - >
      git-subrepo is important in package-maintenance culture because it addresses the
      recurring vendor-versus-submodule choice. It favors normal clone behavior for
      downstream users while preserving enough metadata for maintainers to synchronize
      embedded code with upstream projects.
  project-history:
    - >
      The repository began in 2013 and framed git-subrepo as a solid alternative to Git
      submodule and subtree workflows. Its introductory documentation argues that users,
      collaborators, and repository owners have different needs, and that submodules
      especially impose knowledge and synchronization burdens on people who only want to
      clone and use a project.
    - >
      The design stores subrepository metadata in a .gitrepo file inside the
      subdirectory, squashes pulls into the mainline history, and keeps refs for subrepo
      fetch and push workflows. A major 0.4.0-era redesign in 2018 shifted
      implementation details toward merge and rebase methods, with later 0.4.x releases
      improving testing, shell compatibility, path handling, Git version behavior, and
      completion scripts.
  related-projects:
    - >
      The project's own documentation compares it directly with git-submodule and
      git-subtree, and also discusses subtree merge strategies as related Git practice.
  sources:
    - https://formulae.brew.sh/formula/git-subrepo
    - https://github.com/ingydotnet/git-subrepo
    - https://github.com/ingydotnet/git-subrepo/blob/master/Changes
    - https://github.com/ingydotnet/git-subrepo/blob/master/Intro.pod
    - https://github.com/ingydotnet/git-subrepo/blob/master/ReadMe.pod
    - https://github.com/ingydotnet/git-subrepo/releases
  summary:
    - >
      git-subrepo is a Git extension for embedding external repositories into
      subdirectories while avoiding many workflow problems associated with submodules
      and subtrees.
  timeline:
    - '2013: First public commit appeared in the GitHub repository.'
    - '2015: 0.2.x and 0.3.0 tags marked early public releases.'
    - '2018: 0.4.0 release documented a redesign around merge and rebase methods.'
    - '2024: 0.4.7 through 0.4.9 releases included compatibility and packaging fixes.'
  usage:
    - >
      Practitioners clone an external repository into a subdirectory, initialize an
      existing subdirectory as a subrepo, pull upstream updates, push local subdirectory
      changes back, inspect status, clean metadata refs, and rely on .gitrepo to mark
      and configure each embedded repository.
related-packages:
  - id: brew:git
    reason: >
      Choose Git's built-in submodule workflow when retaining a separately versioned
      repository pointer is preferable; git-subrepo instead vendors the files so a
      normal clone is immediately complete.
    rel: alternative
    sources:
      - https://github.com/ingydotnet/git-subrepo#readme
      - https://git-scm.com/docs/git-submodule
