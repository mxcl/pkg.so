history:
  adoption-history:
    - >
      FastANI became a practical command-line component in microbial genomics because it
      accepts both complete and draft assemblies and supports one-to-one, one-to-many,
      and many-to-many comparisons. The supplied package metadata shows distribution
      through Homebrew, Debian, and Ubuntu, complementing upstream source builds and
      release binaries.
  package-nerd-significance:
    - >
      FastANI matters to package users because it turns a computationally expensive
      comparative-genomics method into a scriptable executable suitable for large
      batches. Its small CLI surface, release binaries, and Linux and macOS package
      availability make it easy to place inside reproducible genome-classification
      pipelines.
  project-history:
    - >
      The official FastANI repository was created in 2017. FastANI uses Mashmap as a
      MinHash-based sequence mapping engine and follows the broad workflow of earlier
      ANI methods while avoiding their expensive sequence-alignment step.
    - >
      The associated 2018 Nature Communications paper introduced FastANI as a scalable
      ANI method and used it to analyze more than 90,000 prokaryotic genomes. The study
      reported accuracy comparable to alignment-based ANI methods in the intended
      similarity range with speedups of two to three orders of magnitude.
  related-projects:
    - Mashmap is the approximate mapping engine used by FastANI.
    - >
      Mash is another MinHash-based genome-distance tool discussed in the FastANI paper,
      while BLAST-based ANI solvers are the slower alignment-based comparison point.
  sources:
    - https://github.com/ParBLiSS/FastANI
    - https://github.com/ParBLiSS/FastANI/releases
    - https://www.nature.com/articles/s41467-018-07641-9
    - source_facts.package-manager
  summary:
    - >
      FastANI is a command-line bioinformatics tool for rapidly estimating average
      nucleotide identity between complete or draft microbial genomes. It replaces
      expensive all-against-all alignments with approximate sequence mapping, making ANI
      practical for large genome collections.
  timeline:
    - '2017: The official FastANI GitHub repository was created.'
    - >
      2018: The FastANI method and analysis of more than 90,000 prokaryotic genomes were
      published in Nature Communications.
    - '2023: FastANI v1.34 was published through the official GitHub releases feed.'
  usage:
    - >
      Users provide a query genome and reference genome, or text files listing multiple
      query and reference assemblies. FastANI writes tab-delimited ANI results and can
      optionally generate a lower-triangular PHYLIP-style matrix.
    - >
      The official README recommends checking assembly quality and notes that pairs far
      below roughly 80 percent ANI are outside FastANI's useful nucleotide-level range.
      It also documents multi-threading and a small query/reference asymmetry in
      pairwise estimates.
related-packages:
  - id: brew:skani
    reason: >
      Choose skani when you need faster large-scale ANI searches, aligned-fraction
      output, or stronger support for incomplete MAGs; FastANI remains a widely used,
      focused ANI workflow for complete and draft assemblies.
    rel: alternative
    sources:
      - https://github.com/ParBLiSS/FastANI#readme
      - https://github.com/bluenote-1577/skani#readme
