history:
  adoption-history:
    - >
      OpenPLC Editor is distributed for Windows, macOS, and Linux and is paired with
      OpenPLC Runtime for executing generated control programs. A built-in simulator
      allows logic to be tested without PLC hardware.
    - >
      The editor serves both education and industrial-automation experimentation by
      offering graphical IEC languages alongside Structured Text and deployment to
      OpenPLC runtimes and supported embedded targets.
  package-nerd-significance:
    - >
      OpenPLC Editor makes IEC 61131-3 development available through an open-source,
      cross-platform desktop package. That is unusual in a field where PLC toolchains
      are often tied to proprietary vendors and operating systems.
    - >
      For package users, the editor is the authoring half of a broader toolchain:
      projects are compiled or simulated locally and can then be uploaded to OpenPLC
      Runtime. Recent development uses an Electron and Node.js stack and publishes
      builds for several operating systems and CPU architectures.
  project-history:
    - >
      OpenPLC Editor evolved as the programming environment for the OpenPLC ecosystem,
      providing graphical and textual IEC 61131-3 languages and producing programs for
      OpenPLC Runtime.
    - >
      The current v4 generation uses a modern cross-platform desktop architecture, adds
      an integrated simulator and source-control-oriented project workflows, and
      communicates with OpenPLC Runtime v4 for compilation, deployment, and debugging. A
      related browser edition is incorporated into Autonomy Edge.
  related-projects:
    - OpenPLC Runtime executes programs produced by the editor.
    - >
      Autonomy Edge includes a browser-based edition sharing the project format and many
      editor capabilities.
    - Arduino CLI and supported embedded toolchains are used for applicable hardware targets.
  sources:
    - https://autonomylogic.com/download
    - https://edge.autonomylogic.com/docs/openplc-editor/overview/
    - https://github.com/Autonomy-Logic/openplc-editor
    - https://github.com/Autonomy-Logic/openplc-editor/wiki
    - https://github.com/Autonomy-Logic/openplc-runtime/blob/main/docs/EDITOR_INTEGRATION.md
    - source_facts.package-manager
  summary:
    - >
      OpenPLC Editor is an open-source, cross-platform IDE for creating IEC 61131-3
      control programs for OpenPLC Runtime. It supports graphical and textual PLC
      languages, simulation, compilation, device configuration, and runtime deployment.
  timeline:
    - '2024: The official project wiki was refreshed for the current OpenPLC Editor codebase.'
    - >
      v4 generation: The editor adopted a cross-platform desktop architecture and direct
      integration with the headless OpenPLC Runtime v4.
    - >
      2026: The v4 release line expanded industrial protocols and IEC 61131-3 data and
      variable features.
  usage:
    - >
      Users create a PLC project, define variables and tasks, write logic in Structured
      Text, Ladder Diagram, Function Block Diagram, Sequential Function Chart, or
      Instruction List, and test it with the simulator or compile it for a target.
    - >
      For Runtime v4, the editor converts the project through its compilation pipeline,
      packages the generated sources, uploads them over the runtime API, and provides
      deployment and debugging controls.
