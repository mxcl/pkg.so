history:
  adoption-history:
    - >
      Sococo was offered as both a browser application and native macOS and Windows
      clients, making the same hosted workplace available across common desktop
      environments. Its support documentation also records integrations with Slack,
      Zoom, Microsoft Teams, Webex, and Google meeting tools.
  package-nerd-significance:
    - >
      The Homebrew cask represents a proprietary, service-backed desktop client rather
      than a self-contained open-source program. It is useful to package managers
      because it makes installation of the native Mac client repeatable while account,
      workspace, and service configuration remain hosted.
  project-history:
    - >
      Sococo developed as an online workplace organized around graphical office maps,
      rooms, and user avatars. Its official support portal documents desktop
      installation, room-based communication, organization administration, media
      features, integrations, and a long sequence of 6.x release notes.
  related-projects:
    - Slack
    - Zoom
    - Microsoft Teams
    - Webex
    - Google Meet
  sources:
    - https://support.sococo.com/
    - https://support.sococo.com/article/89454-integrating-other-applications-with-sococo
    - https://support.sococo.com/article/89481-sococo-basics-tutorial-and-faqs
    - >
      https://support.sococo.com/article/89645-using-sococo-on-laptop-desktop-or-mobile-devices
  summary:
    - >
      Sococo is a hosted virtual-office platform whose desktop client presents
      colleagues as avatars in persistent rooms and spaces. It combines presence
      awareness, chat, meetings, screen sharing, shared links, and administrative
      controls.
  timeline:
    - "By 2020: Sococo's official support portal was operated by Ignite Technologies."
    - >
      6.x era: Official release-note series documented continued maintenance of the
      service and desktop clients.
  usage:
    - >
      Users sign in with Sococo credentials, Slack, or an organization's SAML/SSO
      configuration, then move between rooms on a workspace map. People in a room can
      chat or start embedded audio, video, and screen-sharing sessions, while
      administrators manage spaces, members, and integrations.
