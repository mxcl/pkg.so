history:
  adoption-history:
    - >
      bkcrack grew from a specialist security tool into a packaged CLI available through
      Homebrew, Nix, openSUSE/zypper, and upstream GitHub release artifacts for Ubuntu,
      macOS, and Windows. That distribution pattern reflects a tool useful enough for
      repeatable incident-response and recovery workflows but still niche compared with
      general password crackers.
  package-nerd-significance:
    - >
      Package nerds care about bkcrack because it packages a classic academic break of
      legacy ZIP encryption into a reproducible CLI with cross-platform binaries. It is
      a reminder that 'ZIP password support' in archive tools historically meant weak
      ZipCrypto unless AES or another modern scheme was explicitly used.
  project-history:
    - >
      The project was published on GitHub in 2016 and describes itself as an
      implementation of Eli Biham and Paul C. Kocher's known-plaintext attack on the
      PKZIP stream cipher. Its documentation explains the ZipCrypto keystream model and
      frames bkcrack as a way to recover internal keys, remove or change archive
      passwords, and attempt password recovery.
  related-projects:
    - >
      Related tools include zip password recovery and auditing utilities, but bkcrack is
      specifically centered on ZipCrypto known-plaintext recovery rather than generic
      brute-force cracking.
    - >
      The underlying cryptanalytic reference is Biham and Kocher's PKZIP stream-cipher
      paper, which bkcrack cites directly from its README.
  sources:
    - https://doi.org/10.1007/3-540-60590-8_12
    - https://github.com/kimci86/bkcrack#readme
    - https://github.com/kimci86/bkcrack/releases
    - source_facts.package-manager
  summary:
    - >
      bkcrack is a command-line cryptanalysis tool for legacy ZIP encryption,
      specifically the traditional PKWARE/ZipCrypto scheme. Its package-manager identity
      is narrow and practical: a small utility installed when a user needs a
      known-plaintext attack workflow against old encrypted ZIP archives.
  timeline:
    - '1994: Biham and Kocher publish the known-plaintext attack on the PKZIP stream cipher.'
    - '2016: bkcrack repository is created on GitHub.'
    - '2020: v1.0.0 appears as the first GitHub release in the current release history.'
    - '2020s: bkcrack becomes available through Homebrew and other Unix package sets.'
  usage:
    - >
      Typical use starts with a ciphertext entry and 12 or more bytes of known
      plaintext, often supplied from another ZIP entry or file. Users run bkcrack to
      recover the ZipCrypto internal state, then decrypt data, create an unencrypted
      copy of the archive, change the password, or search for the original password from
      recovered keys.
related-packages:
  - id: brew:fcrackzip
    reason: >
      Choose fcrackzip when recovery requires brute-force or dictionary guessing; choose
      bkcrack when corresponding plaintext is available and a much more targeted
      ZipCrypto known-plaintext attack is possible.
    rel: alternative
    sources:
      - https://github.com/kimci86/bkcrack#readme
      - https://oldhome.schmorp.de/marc/fcrackzip.html
