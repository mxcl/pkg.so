id: cask:dbeaverteam
display-name: DBeaver Team Edition
repo: null
docs:
  - https://dbeaver.com/docs/team-edition
config-file-location:
  macos:
    - /Applications/DBeaverTeam.app/Contents/Eclipse/dbeaver.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      Team Edition is intended for medium-to-large organizations that need shared
      database resources, centralized access control, auditing, and both web and desktop
      access. It requires a server deployment and is offered under an annual
      subscription.
  package-nerd-significance:
    - >
      The desktop cask is only one component of a client-server product. Packaging the
      client separately is useful for managed workstation deployment, but a functional
      Team Edition environment also requires the server-side infrastructure and
      licensing described by DBeaver.
  project-history:
    - >
      DBeaver Team Edition extends the DBeaver family from individual desktop database
      work into centrally managed collaboration. The official architecture combines a
      Team Edition server with web and desktop clients; the desktop experience is based
      on DBeaver Ultimate, while the web experience is related to CloudBeaver
      Enterprise.
  related-projects:
    - DBeaver Ultimate
    - CloudBeaver Enterprise
    - DBeaver Community
    - DBeaver Lite
    - DBeaver Enterprise
  sources:
    - https://dbeaver.com/dbeaver-team-edition/
    - https://dbeaver.com/docs/team-edition/
    - https://dbeaver.com/docs/team-edition/Team-Edition-Migration/
    - https://dbeaver.com/docs/team-edition/Team-Edition/
  summary:
    - >
      DBeaver Team Edition is a server-backed collaborative database-management platform
      with web and desktop clients, centralized governance, and shared resources.
  timeline:
    - >
      Product-line expansion: DBeaver introduces Team Edition for multi-user database
      collaboration.
    - >
      Current architecture: Team Edition combines a required server deployment with
      optional web and desktop access.
  usage:
    - >
      Administrators deploy the Team Edition server and configure users, teams, roles,
      projects, and authentication. Users then connect through the web or desktop client
      to share connections, queries, scripts, credentials, diagrams, and other database
      resources.
