id: brew:diffutils
display-name: GNU Diffutils
repo: https://git.savannah.gnu.org/git/diffutils.git
docs:
  - https://www.gnu.org/software/diffutils/manual
  - https://www.gnu.org/software/diffutils/manual/diffutils.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Diffutils became package-manager infrastructure almost by being everywhere: the
      tools are standard build, patch-review, and source-maintenance utilities, and
      Homebrew, Linux distributions, and other package sets commonly ship the GNU
      implementations under the `diffutils` package name.
  package-nerd-significance:
    - >
      Diffutils is foundational package-nerd equipment. Source packages, downstream
      patches, generated tarballs, build logs, and regression tests all lean on
      diff-family tools, and many higher-level tools in this batch either consume diff
      output or improve on its presentation.
  project-history:
    - >
      The GNU Diffutils manual describes the package as a way to find differences
      between files, including side-by-side formats, context and unified diffs, and
      scripts suitable for the `patch` program. As part of GNU, it supplies standard
      userland comparison utilities across GNU and GNU-like systems.
  related-projects:
    - >
      Related tools include GNU patch, diffstat, Git diff, colordiff, diffoscope, and
      modern syntax-aware viewers such as Difftastic.
  sources:
    - https://www.gnu.org/software/diffutils/
    - https://www.gnu.org/software/diffutils/manual
    - https://git.savannah.gnu.org/cgit/diffutils.git
  summary:
    - >
      GNU Diffutils is the GNU package that provides the classic file-comparison
      programs `diff`, `cmp`, `diff3`, and `sdiff`.
  timeline:
    - >
      1980s-1990s: GNU Diffutils became the GNU implementation of core file-comparison
      utilities.
    - >
      2000s: Unified diff output remained the common interchange format for source
      patches and package maintenance.
    - >
      2020s: GNU Diffutils continues to be distributed as the `diffutils` package across
      package managers.
  usage:
    - >
      `diff` compares text files and can emit normal, context, or unified output; `cmp`
      checks byte-level differences; `diff3` compares three files for merge-style
      workflows; and `sdiff` supports side-by-side comparison and merging.
related-packages:
  - id: brew:gpatch
    reason: >
      GNU patch applies the comparison output produced by GNU diff, forming the
      traditional create-with-diff and apply-with-patch workflow.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/diffutils/manual/diffutils.html
      - https://www.gnu.org/software/diffutils/manual/html_node/Invoking-patch.html
  - id: brew:diffstat
    reason: >
      diffstat summarizes GNU diff output into per-file change counts and histograms,
      making large patches easier to triage.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/diffutils/manual/diffutils.html
      - https://invisible-island.net/diffstat/diffstat.html
  - id: brew:colordiff
    reason: >
      colordiff wraps or filters conventional diff output to add terminal color while
      preserving the familiar diff-oriented workflow.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/diffutils/manual/diffutils.html
      - https://www.colordiff.org/
  - id: brew:difftastic
    reason: >
      Choose Difftastic for syntax-aware source comparisons that can ignore misleading
      formatting changes; choose GNU Diffutils for standardized line-oriented output and
      patch interoperability.
    rel: alternative
    sources:
      - https://www.gnu.org/software/diffutils/manual/diffutils.html
      - https://difftastic.wilfred.me.uk/introduction
  - id: brew:diffoscope
    reason: >
      Choose diffoscope when comparing packages, archives, binaries, or other nested
      build artifacts; choose GNU Diffutils for direct text, byte, directory, and
      three-way comparisons.
    rel: alternative
    sources:
      - https://www.gnu.org/software/diffutils/
      - https://diffoscope.org/
  - id: brew:wdiff
    reason: >
      Choose GNU wdiff when word-level changes within text lines are the primary
      concern; GNU Diffutils remains the conventional choice for line-oriented and
      byte-oriented comparisons.
    rel: alternative
    sources:
      - https://www.gnu.org/software/diffutils/manual/diffutils.html
      - https://www.gnu.org/software/wdiff/manual/wdiff.html
