credentials-file-location: null
history:
  adoption-history:
    - >
      batt is Homebrew-packaged and its README documents `brew install batt` followed by
      running it as a brew service. It also offers an installation script and release
      binaries.
    - >
      The repository page showed about 1.6k stars at enrichment time, reflecting a niche
      but visible Apple Silicon power-user audience.
  package-nerd-significance:
    - >
      batt is interesting because it is a package-manager-distributed hardware-control
      tool that depends on private-feeling macOS power behavior and firmware
      compatibility rather than a stable cross-platform Unix API.
    - >
      It also captures a packaging moment: before native macOS charge limits became
      broader, power users installed a daemon through Homebrew to get ThinkPad-style
      charge thresholds on Apple Silicon MacBooks.
  project-history:
    - >
      The README states the maintainer created batt because existing tools were
      unsatisfactory. It focuses on predictable charge limiting, with the common use
      case of stopping charge around a configured maximum such as 80 percent.
    - >
      batt's design is intentionally daemon-based: the README compares it to docker,
      with a client sending requirements to a background daemon that performs the
      charging control.
    - >
      By 2026, the README notes a changed platform landscape: macOS 26.4 and later
      supports native charge limiting from 80 to 100 percent, while batt remains useful
      on older macOS versions or when users want limits below 80 percent.
  related-projects:
    - The README links third-party GUI projects BattGUI and batt-helper.
    - >
      macOS Optimized Battery Charging and macOS 26.4 native charge limiting are the
      platform features batt complements or replaces depending on OS version.
  sources:
    - https://github.com/charlie0129/batt
    - https://github.com/charlie0129/batt/releases
    - source_facts.package-manager
  summary:
    - >
      batt is a macOS utility for controlling and limiting battery charging on Apple
      Silicon MacBooks, available as a command-line daemon/client and a native menu-bar
      app.
  timeline:
    - '2025: v0.4.1 release highlights an experimental GUI and macOS Tahoe compatibility work.'
    - >
      2026: README update says macOS 26.4 adds native charge limiting, reducing batt's
      necessity for some users.
    - '2026: v0.7.x releases include auto-calibration and scheduling work.'
  usage:
    - >
      Typical CLI usage is to install the daemon, check status with `sudo batt status`,
      set an upper charge limit with commands such as `sudo batt limit 80`, disable the
      limit with `batt disable` or `batt limit 100`, and optionally control adapter
      power.
    - >
      Advanced usage includes lower and upper charge bands, MagSafe LED control,
      idle/sleep handling, automatic calibration, scheduled calibration, and logs under
      `/tmp/batt.log`.
