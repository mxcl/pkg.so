history:
  adoption-history:
    - >
      The official README strongly recommends installing with Homebrew and also notes
      MacPorts availability. The batch input independently lists both Homebrew and
      MacPorts package-manager entries, which is the main distribution signal for this
      niche macOS CLI.
  package-nerd-significance:
    - >
      cliclick matters to package-manager users because it fills a narrow but durable
      gap: scriptable GUI input on macOS without AppleScript ceremony or a larger
      automation runtime. Its appeal is strongest in test scripts, window-manager glue,
      demos, and local automation where a packaged single binary is easier to depend on
      than a GUI automation stack.
  project-history:
    - >
      The upstream GitHub repository was created in 2013 and is maintained by Carsten
      Bluem under the BlueM account. The project has stayed deliberately focused on
      macOS GUI event automation rather than becoming a general cross-platform
      automation framework.
  related-projects:
    - >
      cliclick sits near macOS automation tools such as AppleScript, Automator,
      Shortcuts, and lower-level event injectors, but its official scope is a
      command-line tool for mouse and keyboard actions.
  sources:
    - https://github.com/BlueM/cliclick#readme
    - https://www.bluem.net/jump/cliclick
  summary:
    - >
      cliclick is a small macOS command-line automation utility for driving mouse and
      keyboard events from Terminal. Its official README expands the name as Command
      Line Interface Click, says it is written in Objective-C, and documents commands
      for clicking, moving, dragging, waiting, printing mouse position, and sending key
      events.
  timeline:
    - '2013: BlueM/cliclick GitHub repository created.'
    - '2025: Version 5.1 is the latest tag visible from the official repository tag list.'
    - '2026: The batch input lists Homebrew and MacPorts distribution.'
  usage:
    - >
      Typical use is shell-driven UI automation: click a coordinate, move relative to
      the current mouse position, drag, wait between events, print coordinates, or send
      key presses. The README also notes that Terminal or the invoking app must have
      macOS Accessibility permission or the tool may appear to do nothing.
related-packages:
  - id: cask:hammerspoon
    reason: >
      Choose Hammerspoon when automation needs persistent Lua configuration, hotkeys,
      window management, and broader macOS APIs; choose cliclick for compact
      shell-driven mouse and keyboard event sequences.
    rel: alternative
    sources:
      - https://github.com/BlueM/cliclick#readme
      - https://www.hammerspoon.org/go/
      - https://www.hammerspoon.org/docs/
