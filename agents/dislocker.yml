history:
  adoption-history:
    - >
      The input package metadata lists dislocker across Alpine, Homebrew, Debian,
      Fedora, Nix, and Ubuntu. That spread is consistent with a niche but important
      system package: most users do not need it daily, but administrators and recovery
      users want it packaged when a BitLocker volume appears on a Unix-like machine.
  package-nerd-significance:
    - >
      dislocker is notable in package indexes because it wraps a proprietary storage
      format in familiar Unix concepts: command-line tools, a library, FUSE mounting,
      manpages, and distribution packages. It is the kind of specialized package that
      turns a painful one-off recovery task into an installable workflow.
  project-history:
    - >
      The GitHub repository was created in December 2012. The README frames the project
      around reading, and in supported modes writing, BitLocker volumes including
      Windows Vista through Windows 10 era encrypted partitions and BitLocker-To-Go
      removable media.
  related-projects:
    - >
      Related components include FUSE, NTFS mounting tools, BitLocker-To-Go media, and
      Unix package builds documented by the project.
  sources:
    - https://github.com/Aorimn/dislocker
    - https://api.github.com/repos/Aorimn/dislocker
    - https://github.com/Aorimn/dislocker/tags
    - https://formulae.brew.sh/formula/dislocker
  summary:
    - >
      dislocker is a C and FUSE-based tool for accessing Microsoft BitLocker-encrypted
      volumes from Linux and macOS. It provides both dynamic FUSE access and flat-file
      decryption paths, making it a practical bridge between Windows-encrypted storage
      and Unix-like recovery or administration workflows.
  timeline:
    - '2012-12: GitHub repository created'
    - '2010s: release tags progressed from v0.3 through v0.7.x'
    - '2026-01: repository still receiving pushes according to official GitHub metadata'
  usage:
    - >
      The README points users toward `dislocker-fuse` for dynamic decryption that
      exposes a virtual NTFS partition as `dislocker-file`, and toward `dislocker-file`
      for producing a decrypted flat file. It also documents companion binaries for BEK
      files and BitLocker metadata inspection.
