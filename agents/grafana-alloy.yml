id: brew:grafana-alloy
display-name: Grafana Alloy
repo: null
docs:
  - https://grafana.com/docs/alloy/latest
config-file-location:
  linux:
    - /etc/alloy/config.alloy
  macos:
    - $(brew --prefix)/etc/alloy/config.alloy
  windows:
    - '%ProgramFiles%\GrafanaLabs\Alloy\config.alloy'
credentials-file-location: null
history:
  adoption-history:
    - >
      Grafana Labs tied Alloy adoption to its recommendation that Grafana Agent users
      plan migrations before the Agent end-of-life date. Official migration
      documentation covers moving Agent Flow state directories and pipelines into Alloy
      layouts on Linux, macOS, Windows, and containers.
    - >
      The package became important in Homebrew-style environments because it packages a
      production telemetry collector as a single serviceable CLI/daemon with documented
      platform-specific configuration paths.
  package-nerd-significance:
    - >
      Alloy matters to package maintainers because it sits at the convergence point of
      Prometheus scraping, OpenTelemetry Collector components, service management, and
      cross-platform config conventions. It replaced several collector choices with one
      packaged executable for many Grafana observability setups.
  project-history:
    - >
      Alloy grew out of Grafana Agent and Grafana Agent Flow. Grafana Labs described
      Grafana Agent as a broad OSS telemetry agent introduced in 2020 for Prometheus-era
      collection problems, then positioned Alloy in 2024 as the successor that uses
      Agent Flow concepts while aligning with the OpenTelemetry Collector.
    - >
      The launch announcement emphasized compatibility with OTLP, OpenTelemetry
      Collector, and Prometheus Agent workflows. That made Alloy both a migration target
      for Grafana Agent users and a standalone collector for mixed observability
      environments.
  related-projects:
    - Grafana Agent and Grafana Agent Flow are Alloy's direct predecessors.
    - >
      OpenTelemetry Collector, Prometheus Agent, Grafana, Loki, Tempo, and Mimir are
      adjacent projects in the same collector and backend ecosystem.
  sources:
    - https://grafana.com/blog/grafana-agent-to-grafana-alloy-opentelemetry-collector-faq/
    - >
      https://grafana.com/blog/grafana-alloy-opentelemetry-collector-with-prometheus-pipelines/
    - https://grafana.com/docs/alloy/latest/
    - https://grafana.com/docs/alloy/latest/set-up/migrate/from-flow/
  summary:
    - >
      Grafana Alloy is Grafana Labs' open source distribution of the OpenTelemetry
      Collector, designed to run telemetry pipelines for metrics, logs, traces, and
      profiles while retaining first-class Prometheus-oriented pipeline support.
  timeline:
    - "2020: Grafana Agent rolled out as Grafana Labs' OSS telemetry agent."
    - >
      2024-04-09: Grafana Agent and Grafana Agent Operator entered long-term support in
      favor of Alloy.
    - >
      2024-04-10: Grafana Labs announced Grafana Alloy as an OpenTelemetry Collector
      distribution with Prometheus pipelines.
    - >
      2025-11-01: Grafana Agent was expected to reach end of life, making Alloy the
      migration target.
  usage:
    - >
      Operators use Alloy to receive, transform, scrape, relabel, and export telemetry.
      Common package-manager usage is installing the binary, editing config.alloy, and
      running Alloy as a long-lived service that forwards data to Grafana Cloud, an LGTM
      stack, or other compatible backends.
related-packages:
  - id: brew:grafana
    reason: >
      Use Grafana as the visualization and exploration frontend for telemetry that Alloy
      sends to Grafana Cloud or self-managed Grafana stack backends.
    rel: adjacent_workflow
    sources:
      - https://grafana.com/docs/grafana-cloud/send-data/alloy/introduction/how-alloy-works/
      - https://grafana.com/docs/grafana/latest/
  - id: brew:prometheus
    reason: >
      Use Alloy alongside Prometheus when you need Alloy to scrape Prometheus-format
      endpoints or forward processed metrics to a Prometheus-compatible backend.
    rel: adjacent_workflow
    sources:
      - https://grafana.com/docs/alloy/latest/introduction/
      - https://prometheus.io/docs/introduction/overview/
