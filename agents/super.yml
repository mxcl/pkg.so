id: cask:super
display-name: SuperDB
repo: null
docs:
  - https://github.com/brimdata/super#readme
  - https://superdb.org/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The Homebrew cask packages the `super` binary from official GitHub releases. The
      v0.1.0, v0.2.0, and v0.3.0 releases in early 2026 show the project being
      distributed as versioned command-line artifacts.
  package-nerd-significance:
    - >
      SuperDB matters to package and CLI users because it makes heterogeneous data
      wrangling scriptable from a single binary, with SQL-like pipelines over formats
      that usually require separate tools.
  project-history:
    - >
      The official repository was created in November 2019 and now describes SuperDB as
      a database that puts JSON and relational tables on equal footing. The README
      explains the project's super-structured data model, SUP/BSUP/CSUP formats, and
      SuperSQL query language.
  related-projects:
    - >
      Related official concepts and projects include SuperSQL, SUP/BSUP/CSUP formats,
      SuperDB Desktop, Brimdata's Zui desktop app, and common data formats such as JSON,
      CSV, Parquet, and Arrow.
  sources:
    - https://github.com/brimdata/super
    - https://github.com/brimdata/super/releases
    - https://raw.githubusercontent.com/brimdata/super/main/README.md
    - source_facts.source-archive
  summary:
    - >
      SuperDB is an analytics database and command-line query engine for data that mixes
      relational tables, JSON, CSV, Parquet, Arrow, HTTP, and S3 sources.
  timeline:
    - '2019: Official GitHub repository created.'
    - '2026: v0.1.0, v0.2.0, and v0.3.0 releases published.'
  usage:
    - >
      The `super` command can query files, HTTP endpoints, and S3 paths locally without
      a storage engine, and can also operate against a super-structured database through
      `super db` subcommands.
related-packages:
  - id: brew:duckdb
    reason: >
      Choose DuckDB when you want a mature embedded OLAP engine with conventional SQL
      and broad dataframe and Parquet integrations; SuperDB explicitly contrasts its
      heterogeneous super-structured model with DuckDB's analytical approach.
    rel: alternative
    sources:
      - https://superdb.org/
      - https://duckdb.org/docs/stable/
  - id: brew:jq
    reason: >
      Choose jq for lightweight, established JSON-only shell transformations; SuperDB
      explicitly presents `super` as jq-like querying extended with strong typing, SQL,
      additional formats, and database operations.
    rel: alternative
    sources:
      - https://superdb.org/
      - https://jqlang.github.io/jq/manual/
tags:
