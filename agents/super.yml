  history-sources:
    - https://github.com/brimdata/super
    - https://github.com/brimdata/super/releases
    - https://raw.githubusercontent.com/brimdata/super/main/README.md
    - source_facts.source-archive
  repo-sources:
    - >
      source_facts.repo already has https://github.com/brimdata/super; prompt requires
      repo null when source_facts.repo is present.
  tags-sources:
    - >
      Official README describes analytics, CLI use, database behavior, structured data,
      and semi-structured JSON support.
