history:
  adoption-history:
    - >
      BuhoLaunchpad targets Mac users who want to retain the classic full-screen
      Launchpad workflow while adding more control over layout, search, display
      placement, gestures, and application sources. Official packaging as a macOS
      application and availability through Homebrew Cask support repeatable
      installation.
  package-nerd-significance:
    - >
      BuhoLaunchpad occupies a specific macOS utility niche created by changes to
      Apple's application-launching experience. It packages a familiar grid metaphor as
      an independently maintained application with configurable layouts, backups,
      external application locations, and multi-display behavior.
  project-history:
    - >
      Dr.Buho developed BuhoLaunchpad as a modern replacement for the familiar macOS
      full-screen application grid. The product retained Launchpad-style browsing and
      folders while adding search, hidden-app management, custom locations, layout
      backup and restore, and more detailed appearance controls.
    - >
      The 2026 release line added multiple saved layouts, app hiding, hot-corner
      activation, flexible icon sizing, expanded multi-display behavior, background and
      blur controls, and trackpad navigation.
  related-projects:
    - Apple Launchpad, whose classic app-grid workflow BuhoLaunchpad is designed to replace.
    - Other Dr.Buho macOS utilities distributed from the same vendor.
  sources:
    - https://www.drbuho.com/buholaunchpad/guide
    - https://www.drbuho.com/buholaunchpad/guide/buholaunchpad-overview
    - https://www.drbuho.com/buholaunchpad/release-notes
  summary:
    - >
      BuhoLaunchpad is a proprietary macOS application launcher that recreates the
      classic full-screen Launchpad grid while adding layout, appearance, search,
      gesture, display, backup, and application-location controls.
  timeline:
    - >
      2026-01: The 1.4 release line added multiple layouts, backup and restore, and
      centralized hidden-app management.
    - >
      2026-04: The 1.7 release line refined the interface and introduced freely
      adjustable icon sizing.
    - >
      2026-05: The 1.8 release line expanded multi-display, background, blur,
      font-color, and trackpad controls.
  usage:
    - >
      Users open BuhoLaunchpad to browse, search, group, and launch installed
      applications in a full-screen grid. Settings can adjust rows, columns, icon scale,
      appearance, keyboard shortcuts, trackpad gestures, startup behavior, and the
      display on which the launcher appears.
    - >
      The application can scan custom or external application locations, hide unwanted
      apps, import an older Launchpad layout, and back up, restore, switch, compact, or
      reset layouts.
