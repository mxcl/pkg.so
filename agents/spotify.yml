history:
  adoption-history:
    - >
      Spotify expanded from music streaming into podcasts and audiobooks while adding
      free advertising-supported access, paid subscriptions, offline listening, social
      features, personalized recommendations, and playback across many device types.
    - >
      Spotify's official retrospective records a progression to 200 million subscribers,
      reflecting the service's large-scale adoption.
  package-nerd-significance:
    - >
      The desktop client is a prominent proprietary cask: a frequently installed
      consumer application delivered outside traditional source-package ecosystems. Its
      automatic-update behavior and vendor-hosted binary distribution typify modern
      desktop cask packaging.
  project-history:
    - >
      Spotify launched its streaming service in 2008. It subsequently developed clients
      for desktop, mobile, web, speakers, televisions, consoles, and other connected
      devices while broadening its catalog beyond music.
  related-projects:
    - Spotify Web Player provides browser-based playback.
    - Spotify for Artists and Spotify for Creators serve artists, podcasters, and publishers.
    - Spotify Connect coordinates playback across compatible devices.
  sources:
    - https://newsroom.spotify.com/2023-02-01/spotifys-journey-to-200-million-subscribers/
    - https://support.spotify.com/us/
  summary:
    - >
      Spotify is a proprietary streaming client for music, podcasts, and audiobooks. The
      macOS desktop application provides library management, playlists, discovery,
      downloads for eligible plans, and Spotify Connect.
  timeline:
    - "2008: Spotify's streaming service launches."
    - '2023: Spotify announces that it has reached 200 million subscribers.'
  usage:
    - >
      Users sign in to stream and organize media, create playlists, follow creators, and
      control playback on other Spotify Connect devices. Eligible paid plans support
      offline listening and other premium features.
    - >
      Spotify documents settings through its application and account interfaces, but its
      official end-user support does not identify stable user-editable configuration or
      credentials files.
