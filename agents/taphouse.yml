history:
  adoption-history:
    - >
      Taphouse is distributed as a direct DMG and through the official Homebrew cask.
      Its official site describes a free core application with an optional one-time paid
      upgrade rather than a subscription.
    - >
      The product targets both developers who prefer a visual workflow and Mac users
      unfamiliar with terminal package management. It operates on existing Homebrew
      installations and exposes the same package catalog and commands through a native
      interface.
  package-nerd-significance:
    - >
      Taphouse is unusually self-referential package-manager software: Homebrew can
      install the graphical client that subsequently manages Homebrew itself. This makes
      it useful for users who want cask-based lifecycle management without making the
      terminal their daily package browser.
    - >
      Its power-user features—Brewfile import and export, tap management, dependency
      inspection, package pinning, cleanup, service control, release-note previews, and
      installation history—surface established Homebrew practices in a native SwiftUI
      application.
  project-history:
    - >
      Taphouse is a native macOS graphical interface for Homebrew developed by
      Multimodal Solutions. Official terms dated December 2025 describe it as an
      application for visually browsing, installing, updating, and managing Homebrew
      packages.
    - >
      The official changelog records rapid development through 2026, including Apple
      Silicon migration assistance, curated package collections, security scanning,
      Brewfile workflows, third-party update discovery, widgets, and broader
      package-maintenance tooling.
  related-projects:
    - >
      Homebrew is the package manager Taphouse controls; Taphouse invokes the same
      `brew` operations available in Terminal.
    - >
      The official site compares Taphouse with other Homebrew graphical clients
      including Cakebrew, Cork, and Applite.
  sources:
    - https://taphouse.multimodalsolutions.gr/
    - https://taphouse.multimodalsolutions.gr/changelog
    - https://taphouse.multimodalsolutions.gr/faq
    - https://taphouse.multimodalsolutions.gr/features
    - https://taphouse.multimodalsolutions.gr/terms.html
    - source_facts.version
  summary:
    - >
      Taphouse is a native macOS graphical client for browsing, installing, upgrading,
      removing, and maintaining Homebrew formulae and casks.
  timeline:
    - "2025-12-26: The dated official terms describe Taphouse's free and paid editions."
    - '2026-01-20: Version 1.4.0 adds Apple Silicon migration and release-note tooling.'
    - '2026-05-01: Version 1.5 introduces widgets and expanded package-management workflows.'
    - '2026-06-30: The official changelog records version 1.5.4.9.'
  usage:
    - >
      Taphouse requires an existing Homebrew installation. Users can install it from a
      DMG or with `brew install --cask taphouse`, then perform ordinary Homebrew
      operations through its graphical interface.
    - >
      The application can manage formulae, casks, services, taps, Brewfiles, updates,
      dependencies, cleanup, and vulnerability information. Official documentation says
      package and preference data stay locally on the Mac, but it does not publish a
      stable configuration-file path.
