config-file-location:
  macos:
    - ~/Library/Preferences/co.eclecticlight.xattred.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      The Eclectic Light Company distributes xattred as a free, signed macOS application
      with an automatic-update mechanism. It is aimed at advanced Mac users,
      administrators, researchers, and developers investigating file metadata,
      quarantine, provenance, and copy behavior.
  package-nerd-significance:
    - >
      Extended attributes are normally manipulated with low-level APIs or the `xattr`
      command. xattred makes binary and property-list metadata visible and editable,
      including security-relevant `com.apple.quarantine`, `com.apple.macl`, and
      `com.apple.provenance` data. Its crawler, comparison, and bulk-stripping tools
      make it particularly useful for filesystem and Gatekeeper investigations.
  project-history:
    - >
      Howard Oakley developed xattred as a native graphical editor that works directly
      with macOS extended-attribute facilities rather than wrapping the `xattr` command.
      After a beta period, version 1.0 was released in May 2019 with an integrated help
      book and a bulk Stripper feature.
    - >
      Later development followed changes in APFS and macOS security metadata. Version
      1.4 modernized the application and emphasized research tools for quarantine,
      provenance, and xattr flags; subsequent releases continued updating the crawler
      and compatibility with newer macOS versions.
  related-projects:
    - xattr
    - cmpxat
    - Sandstrip
    - Pratique
    - Providable
    - Metamer
  sources:
    - >
      https://eclecticlight.co/2019/05/13/xattred-the-gui-extended-attribute-editor-reaches-version-1-0-at-last/
    - >
      https://eclecticlight.co/2023/05/18/inspect-and-control-extended-attributes-with-xattred-1-4/
    - https://eclecticlight.co/xattred-sandstrip-xattr-tools/
  summary:
    - >
      xattred is Howard Oakley's macOS application for inspecting, creating, editing,
      copying, comparing, crawling, and removing file and folder extended attributes.
  timeline:
    - '2010s: xattred began as a beta extended-attribute editor.'
    - '2019: Version 1.0 introduced the full release, a help book, and the bulk Stripper.'
    - >
      2023: Version 1.4 modernized the application and expanded its role in APFS and
      provenance research.
  usage:
    - >
      Users drop or select files and folders to inspect their extended attributes, edit
      text or structured property-list contents, copy attributes between items, compare
      two files, crawl directory trees, or remove one attribute type recursively. It can
      also add quarantine metadata for testing Gatekeeper behavior.
    - >
      The developer documents preferences at
      `~/Library/Preferences/co.eclecticlight.xattred.plist`, including update-check
      settings. xattred works on local filesystem metadata and does not require
      credentials.
