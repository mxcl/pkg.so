credentials-file-location: null
history:
  adoption-history:
    - >
      FontLab Studio 5 became a de facto industry standard for professional type design
      and production. FontLab states that Adobe, Apple, IBM, Microsoft, Monotype,
      Morisawa, and major foundries used it. Later generations added native color- and
      variable-font production while retaining professional drawing, spacing, kerning,
      hinting, scripting, and export workflows.
  package-nerd-significance:
    - >
      FontLab sits at the intersection of graphical design software and font-production
      tooling. Package enthusiasts care about its long-lived file-format support, Python
      scripting, OpenType production features, interoperability with UFO, FontForge,
      Glyphs, and other source formats, and its role in producing widely deployed system
      and commercial fonts.
  project-history:
    - >
      The company traces its origins to Pyrus North America, established in 1992.
      FontLab 2.0 appeared for Windows in 1993, followed by TrueType support in 1994 and
      FontLab 3.0 in 1998. Fontlab Ltd. acquired the Pyrus assets in 2000. FontLab
      Studio 5 shipped in 2005, FontLab VI was a full rewrite in 2017, FontLab 7
      followed in 2019, and FontLab 8 arrived in 2022.
  related-projects:
    - >
      FontLab’s related products include Fontographer, TypeTool, TransType, BitFonter,
      and FontLab Pad. Its workflows interoperate with fontTools/TTX, UFO, FontForge,
      Glyphs, OpenType, and variable-font formats.
  sources:
    - 'Official FontLab 8 help: https://help.fontlab.com/fontlab/8/'
    - >
      Official FontLab Studio 5 history:
      https://blog.fontlab.com/2005/06/15/fontlab-studio-5-opentype-standard/
    - 'Official company history: https://blog.fontlab.com/about/'
  summary:
    - >
      FontLab is a long-running professional font editor for macOS and Windows. The
      current FontLab 8 generation combines glyph drawing, spacing, kerning, OpenType
      feature work, variable- and color-font production, scripting, and export.
  timeline:
    - '1992: Pyrus North America was established.'
    - '1993: FontLab 2.0 for Windows appeared.'
    - '2000: Fontlab Ltd. acquired the Pyrus assets.'
    - '2005: FontLab Studio 5 shipped and became a professional production standard.'
    - '2017: FontLab VI launched as a full rewrite.'
    - '2019: FontLab 7 was released.'
    - '2022: FontLab 8 was released.'
  usage:
    - >
      Typeface designers use FontLab to draw and edit glyph outlines, build character
      sets, space and kern families, author OpenType behavior, manage variable masters,
      test fonts, automate work with Python, and export production font files.
