id: cask:rustrover
display-name: RustRover
repo: null
docs:
  - https://www.jetbrains.com/help/rust
  - https://www.jetbrains.com/help/rust/configuring-project-and-ide-settings.html
  - >
    https://www.jetbrains.com/help/rust/directories-used-by-the-ide-to-store-settings-caches-plugins-and-logs.html
config-file-location:
  linux:
    - ~/.config/JetBrains/RustRover<version>
  macos:
    - ~/Library/Application Support/JetBrains/RustRover<version>
  windows:
    - '%APPDATA%\JetBrains\RustRover<version>'
credentials-file-location: null
history:
  adoption-history:
    - >
      JetBrains said demand grew during years of maintaining Rust support as a plugin
      for IntelliJ IDEA and CLion. The dedicated IDE moved through an Early Access and
      public-preview period before general availability, while Rust support also
      remained available in compatible JetBrains IDEs.
  package-nerd-significance:
    - >
      RustRover marks the maturation of Rust tooling from a language plugin into a
      dedicated commercial IDE. It is especially relevant to developers who want
      Cargo-aware project management, code analysis, debugging, testing, and the broader
      JetBrains platform in one package.
  project-history:
    - >
      RustRover grew out of JetBrains' open-source Rust plugin for IntelliJ IDEA and
      CLion. JetBrains announced the standalone IDE and opened its Early Access Program
      in September 2023. General availability followed in May 2024 with free
      non-commercial and paid commercial licensing options; the RustRover product itself
      is closed source.
  related-projects:
    - >
      The JetBrains Rust plugin preceded RustRover and continues to provide Rust support
      in compatible JetBrains IDEs.
    - >
      IntelliJ IDEA and CLion share the underlying JetBrains platform and can provide
      related Rust workflows.
  sources:
    - >
      https://blog.jetbrains.com/rust/2023/09/13/introducing-rustrover-a-standalone-rust-ide-by-jetbrains/
    - >
      https://blog.jetbrains.com/rust/2024/05/21/rustrover-is-released-and-includes-a-free-non-commercial-option/
    - https://www.jetbrains.com/help/rust/
  summary:
    - >
      RustRover is JetBrains' dedicated integrated development environment for Rust and
      its ecosystem.
  timeline:
    - '2023: JetBrains announced RustRover and opened its Early Access Program.'
    - >
      2024: RustRover became generally available with free non-commercial and paid
      commercial licensing.
  usage:
    - >
      Developers use RustRover to open or create Cargo projects, edit and analyze Rust
      code, run tests, debug programs, manage version control, and work with the
      surrounding Rust toolchain.
