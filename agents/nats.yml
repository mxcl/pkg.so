id: brew:nats
display-name: NATS CLI
repo: null
docs:
  - https://docs.nats.io/
  - https://github.com/nats-io/natscli#readme
config-file-location:
  unix:
    - ~/.config/nats/context
credentials-file-location: null
history:
  adoption-history:
    - >
      The CLI is maintained in the official nats-io organization and is distributed
      through Homebrew as well as release archives and installation channels documented
      by the project.
    - >
      Its scope expanded with the NATS ecosystem, providing administrative workflows for
      JetStream, Key-Value stores, Object Stores, services, server monitoring, and
      authentication contexts.
  package-nerd-significance:
    - >
      The package gives operators one official executable for both everyday
      publish/subscribe testing and substantial NATS or JetStream administration. Named
      contexts make multiple servers and authentication profiles manageable from a
      package-installed CLI.
  project-history:
    - >
      NATS CLI was developed as the official command-line client and administrative
      utility for the NATS ecosystem. It consolidates messaging operations, JetStream
      management, monitoring, benchmarking, and server inspection in the `nats`
      executable.
    - >
      The project stores named connection contexts as JSON documents, allowing server
      URLs and authentication settings to be reused across commands.
  related-projects:
    - >
      Related official projects include nats-server, NATS client libraries, the nsc
      account-management tool, and the wider JetStream ecosystem.
  sources:
    - 'Official NATS documentation: https://docs.nats.io/'
    - 'Official releases: https://github.com/nats-io/natscli/releases'
    - 'Official repository and README: https://github.com/nats-io/natscli'
  summary:
    - >
      NATS CLI is the official command-line utility for interacting with NATS,
      administering JetStream resources, inspecting servers, managing contexts, and
      testing messaging workloads.
  timeline:
    - >
      Early 2020s: The official natscli project established the `nats` command as the
      unified NATS administrative CLI.
    - '2024: The v0.1 series continued expanding operational and authentication functionality.'
    - >
      2026: Official releases continue to add JetStream, reporting, monitoring, and
      server-management improvements.
  usage:
    - >
      Operators use `nats pub`, `nats sub`, and `nats request` for messaging; `nats
      stream`, `consumer`, `kv`, and `object` commands for JetStream resources; and
      `nats server` commands for inspection and administration.
    - >
      Named contexts created with `nats context add` retain server and authentication
      settings. Credentials files may be referenced by a context, but the official CLI
      does not prescribe one fixed credentials-file location.
related-packages:
  - id: brew:nats-server
    reason: >
      NATS CLI is the documented client and administrative companion for NATS Server,
      providing publish/subscribe tests and management of the server's built-in
      JetStream features.
    rel: adjacent_workflow
    sources:
      - https://docs.nats.io/concepts/getting-started/
      - https://github.com/nats-io/natscli#readme
      - https://github.com/nats-io/nats-server#readme
