history:
  adoption-history:
    - >
      PDFify is available through the developer's website, Apple's App Store, and
      Homebrew. It supports interactive desktop use, Finder Quick Actions, Apple
      Shortcuts, Spotlight, and Siri, allowing it to fit both manual and repeatable Mac
      document workflows.
  package-nerd-significance:
    - >
      PDFify wraps established OCR capabilities in a native Mac application while
      exposing Finder and Shortcuts automation. Local document processing, direct
      Homebrew distribution, PDF/A support, and composable actions make it useful to
      users who combine graphical applications with automated workflows.
  project-history:
    - >
      Independent developer Dirk Holtwick created PDFify as a macOS utility for
      assembling PDFs, recognizing text, scanning pages, and reducing file size. Later
      releases broadened it with PDF/A output, Finder batch processing, Apple Vision and
      Tesseract OCR, Apple Silicon support, and App Shortcuts.
  related-projects:
    - >
      PDFify uses Tesseract as one of its OCR implementations and can alternatively use
      Apple's Vision framework. Its searchable-PDF workflow overlaps with OCR-focused
      command-line and scanning tools.
  sources:
    - https://pdfify.app/changelog
    - https://pdfify.app/future
    - https://pdfify.app/help
  summary:
    - >
      PDFify is a macOS utility for combining document pages, scanning, compressing
      PDFs, producing PDF/A files, and making documents searchable through local OCR.
  timeline:
    - 'Version 3.3.2: Added Apple Silicon support and multilingual Apple Vision OCR.'
    - 'Version 3.4: Added batch processing through Finder Quick Actions.'
    - 'Version 4.0: Added PDF/A-2u output and linearized PDFs.'
    - 'Version 5.0: Adopted Tesseract 5 with an Apple-Silicon-optimized pipeline.'
    - >
      Version 5.2: Added App Shortcuts for OCR, compression, PDF/A conversion, and text
      export.
  usage:
    - >
      Users can open a PDF or assemble pages from files, images, the clipboard,
      screenshots, email, web pages, an iPhone, or a scanner. PDFify can apply Tesseract
      or Apple Vision OCR, compress documents, save PDF/A output, and export recognized
      content as text or JSON. Official documentation states that document operations
      happen locally.
