history:
  adoption-history:
    - >
      QGroundControl is maintained as an open-source, cross-platform ground station
      under the Dronecode ecosystem. Its common support for both PX4 and ArduPilot makes
      it a broadly applicable graphical client within the MAVLink drone community.
  package-nerd-significance:
    - >
      It packages a substantial Qt/QML, mapping, video, telemetry, and
      hardware-integration stack into one desktop application. Distribution maintainers
      care about its cross-platform build, MAVLink compatibility, GStreamer video
      support, and access to USB and network-connected flight controllers.
  project-history:
    - >
      QGroundControl developed around the MAVLink protocol with the aim of providing one
      adaptable ground-station codebase across desktop and mobile platforms. The project
      is dual-licensed under Apache 2.0 and GPLv3 and is governed within the Dronecode
      Project.
  related-projects:
    - MAVLink supplies the vehicle communication protocol used by QGroundControl.
    - >
      PX4 and ArduPilot are the two major autopilot platforms explicitly supported by
      the project.
  sources:
    - >
      Official developer guide governance and design notes:
      https://docs.qgroundcontrol.com/master/en/qgc-dev-guide/
    - >
      Official first-flight documentation:
      https://docs.qgroundcontrol.com/master/en/qgc-user-guide/getting_started/quick_start.html
    - 'Official project overview and feature list: https://github.com/mavlink/qgroundcontrol'
  summary:
    - >
      QGroundControl is an open-source ground-control station for configuring, planning
      missions for, flying, and monitoring MAVLink-compatible unmanned vehicles.
  timeline:
    - >
      The project established a single Qt/QML codebase for desktop and mobile
      ground-control use.
    - The project joined the Dronecode governance ecosystem.
    - >
      Current releases provide mission planning, live telemetry, vehicle setup,
      parameter editing, multi-vehicle operation, and video streaming.
  usage:
    - >
      Operators use QGroundControl to connect over USB, telemetry radio, Wi-Fi, or
      Ethernet; configure a vehicle; plan autonomous missions; monitor live instruments
      and maps; and inspect logs and MAVLink traffic. Application settings are normally
      managed through its graphical Settings view. Optional `.settings` override files
      are loaded from the `Settings` directory beneath the application load/save path.
