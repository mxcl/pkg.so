history:
  adoption-history:
    - >
      todometer was released as a small cross-platform Electron application and later
      added Windows packaging, browser integration through a web clipper, and desktop
      builds for macOS, Windows, and Linux.
    - >
      The project subsequently expanded beyond direct GUI use with a custom URL
      protocol, a localhost REST API, and an MCP server, allowing scripts, shortcuts,
      browser extensions, and AI assistants to add or manipulate tasks.
  package-nerd-significance:
    - >
      todometer is characteristic of the focused open-source Electron utilities commonly
      installed through desktop package managers: it turns a compact productivity idea
      into a cross-platform native application.
    - >
      Its later move from browser-style local storage to a movable SQLite data vault is
      notable for package users who care about local ownership, backup, and optional
      synchronization through a user-selected folder.
  project-history:
    - >
      Cassidy Williams created todometer as a deliberately simple task application that
      visualizes progress with a meter. The core workflow divides tasks into pending,
      in-progress or paused, and completed states.
    - >
      The second major generation modernized Electron and React and refined
      notifications and paused-task handling. A later major refresh added task editing
      and drag-and-drop, moved task storage to SQLite, and introduced the configurable
      data vault, local API, protocol handler, and MCP integration.
  related-projects:
    - todometer web clipper
    - Electron
    - React
    - SQLite
    - Model Context Protocol
  sources:
    - https://github.com/cassidoo/todometer#readme
    - https://github.com/cassidoo/todometer/blob/main/docs/api-and-mcp-setup.md
    - https://github.com/cassidoo/todometer/releases
    - source_facts.package-manager
  summary:
    - >
      todometer is an open-source desktop to-do application that represents completed
      work with a progress meter and emphasizes a small daily task workflow.
  timeline:
    - 'Initial generation: todometer launches as a compact Electron task meter.'
    - >
      Version 2: Electron and React are updated and notification and paused-task
      workflows are refined.
    - >
      Version 3: The application receives a major refresh, migrates tasks to a movable
      SQLite data vault, and adds editing, drag-and-drop, a local API, URL handling, and
      MCP integration.
  usage:
    - >
      Users add tasks, move or drag them among task states, mark work complete, and use
      the progress meter as a visual measure of the day's completion.
    - >
      Daily reset, reminders, notifications, display options, and a movable data vault
      are configured from the settings drawer. External tools can add tasks through
      `todometer://` URLs or control the application through its local REST API or MCP
      server.
