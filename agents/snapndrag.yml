history:
  adoption-history:
    - >
      Yellow Mug distributes SnapNDrag as a macOS application, with the Pro edition
      offered through the Mac App Store.
    - >
      The application addresses a durable Mac workflow: quickly capturing a screen
      region or window and dragging the resulting image directly into Mail, Finder, or
      another application.
  package-nerd-significance:
    - >
      SnapNDrag represents the long-running native macOS utility tradition in which a
      narrowly focused tool grows into a managed capture library while preserving a
      simple drag-and-drop workflow. Its Homebrew cask provides a package-managed
      installation option for that commercial desktop application.
  project-history:
    - >
      SnapNDrag began as a simple one-click screenshot utility whose defining
      interaction was dragging the resulting image into another application.
    - >
      Yellow Mug gradually developed it into a broader screenshot tool with folders,
      nondestructive annotation, sharing, batch renaming, customizable hotkeys,
      background operation, and multiple output formats.
  related-projects:
    - >
      SnapNDrag uses Apple's Preview as an external annotation editor in the workflow
      documented by its official user's guide.
    - >
      It complements macOS's built-in screenshot shortcuts and can automatically import
      system screenshots when granted the required permission.
  sources:
    - 'Official FAQ: https://www.yellowmug.com/snapndrag/faq/'
    - 'Official privacy-permission guide: https://yellowmug.com/snapndrag/catalina/'
    - 'Official product page: https://www.yellowmug.com/snapndrag/'
    - "Official user's guide: https://www.yellowmug.com/snapndrag/help3/"
  summary:
    - >
      SnapNDrag is a native macOS screenshot utility for capturing, organizing,
      annotating, and sharing images.
  timeline:
    - 'Initial period: SnapNDrag launched as a simple one-click capture-and-drag utility.'
    - >
      Later development: Yellow Mug added screenshot organization, annotation, sharing,
      batch operations, hotkeys, and background operation.
  usage:
    - >
      Users capture a selection, window, full screen, or timed screen; the result enters
      SnapNDrag's folder-based library and can be dragged into another application or
      shared through macOS services.
    - >
      Screenshots can be renamed, searched, previewed, and edited nondestructively.
      Screen Recording permission is required, while automatic importing of macOS
      screenshots requires Full Disk Access.
