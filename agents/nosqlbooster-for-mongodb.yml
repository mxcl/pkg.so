history:
  adoption-history:
    - >
      NoSQLBooster has tracked MongoDB server evolution through successive major
      releases, adding support for MongoDB 3.6 in the 4.3 series, MongoDB 7 in the 8.x
      era, MongoDB 8 in the 9.x era, and MongoDB 8.3 in version 11.1.
    - >
      The application is available on macOS, Linux, and Windows. Its official site
      offers a 30-day trial that becomes a feature-limited free edition, supporting both
      personal and commercial use.
  package-nerd-significance:
    - >
      NoSQLBooster is notable among database desktop packages for combining a MongoDB
      shell-oriented IDE with graphical exploration, query building, code completion,
      script history, aggregation helpers, and code generation.
    - >
      Version 11's replacement of its older Fibers-based execution layer with the same
      asynchronous rewriting technology used by mongosh illustrates the maintenance
      burden of keeping a third-party database IDE aligned with MongoDB's official shell
      and driver ecosystem.
  project-history:
    - >
      The product was originally known as MongoBooster and had established a regular
      release cadence by at least 2016. The official archive shows the NoSQLBooster name
      in sustained use across later major versions, with releases continuing through
      version 11 in 2026.
    - >
      Over time it evolved from an enhanced Mongo shell and GUI into a broader MongoDB
      IDE with a visual query builder, SQL-style querying, script history, code
      generation, debugging, aggregation tooling, and AI-assisted query features.
  related-projects:
    - >
      NoSQLBooster embeds and extends MongoDB shell workflows and relies on the MongoDB
      Node.js driver and BSON libraries.
    - >
      Version 11 moved to an embedded mongosh engine and its asynchronous rewriter,
      bringing behavior closer to MongoDB's official shell.
  sources:
    - https://nosqlbooster.com/blog/announcing-mongobooster-41/
    - https://nosqlbooster.com/blog/announcing-mongobooster-43/
    - https://nosqlbooster.com/blog/announcing-nosqlbooster-11-1/
    - https://nosqlbooster.com/blog/archives/
    - https://nosqlbooster.com/blog/nosqlbooster-11-breaking-changes/
  summary:
    - >
      NoSQLBooster for MongoDB is a cross-platform graphical client and development
      environment that combines database browsing with MongoDB shell scripting, query
      construction, completion, visualization, and administration tools.
  timeline:
    - '2016: The official release archive records active MongoBooster development.'
    - '2017: MongoBooster 4.1 added a visual query builder and searchable script history.'
    - '2018: Version 4.3 added official MongoDB 3.6 support.'
    - '2021: NoSQLBooster 7.0 added a MongoDB script debugger.'
    - '2025: Version 10.0 introduced AI-assisted query and explanation features.'
    - >
      2026: Version 11 replaced the legacy shell engine with embedded mongosh and added
      native Apple Silicon builds.
    - '2026: Version 11.1 extended support through MongoDB 8.3.'
  usage:
    - >
      Users create MongoDB connection profiles, browse databases and collections, edit
      documents, execute shell scripts, construct aggregation pipelines, and inspect
      results in graphical views.
    - >
      The IDE also targets developers moving between shell, SQL-like, and driver APIs by
      offering completion, snippets, query translation, code generation, history, and
      debugging. Connection profiles can contain authentication material, but no
      official fixed credentials-file path was documented.
