history:
  adoption-history:
    - >
      Adoption came through the C, C++, desktop, and systems-software ecosystems where
      Autotools and hand-written build glue had long been painful. The Meson project
      lists users including X.Org, GNOME, Enlightenment, elementary OS, Budgie, and many
      other projects; its broader ecosystem role is as a modern alternative to Autotools
      and, in some cases, CMake, especially for projects that want native Ninja speed
      with less build-language ceremony.
  project-history:
    - >
      Meson's technical identity is speed plus low-friction build definitions. Its own
      documentation frames the project around reducing both time spent waiting for
      builds and time spent writing or debugging build files. It supports many compilers
      and languages, integrates tests and install rules, and includes a subproject and
      wrap system so dependencies can be fetched or embedded in a controlled way.
      Version 1.0.0 landed after roughly ten years of development, with Pakkanen noting
      that the original 1.0 bar was tied to satisfying GStreamer's needs.
  sources:
    - https://formulae.brew.sh/formula/meson
    - https://github.com/mesonbuild/meson
    - https://groups.google.com/g/ninja-build/c/9zu5E9Sc56w
    - https://mesonbuild.com/
    - https://mesonbuild.com/Users.html
    - https://mesonbuild.com/Wrap-dependency-system-manual.html
    - https://nibblestew.blogspot.com/2022/12/after-exactly-10-years-meson-100-is-out.html
  summary:
    - >
      Meson is a cross-platform build system created by Jussi Pakkanen after frustration
      with existing build tools. Pakkanen publicly introduced it to the Ninja build
      mailing list in February 2013 as a research experiment for a fast, high-level
      build system, with Ninja chosen as the natural backend because speed was a hard
      requirement. The project later moved from that experimental posture into a
      mainstream build tool with an Apache-licensed Python implementation and a
      deliberately small, declarative build language.
  usage:
    - >
      As a package, Meson is distributed almost everywhere a developer might bootstrap a
      build environment: Homebrew, Debian, Ubuntu, Fedora, Arch, macOS package systems,
      Windows package managers, Nix, and others. Package managers carry it because it is
      often part of the build toolchain for other source packages, not merely an
      end-user CLI.
related-packages:
  - id: brew:ninja
    reason: >
      Ninja is Meson's default fast execution backend and consumes the build graph
      generated by meson setup.
    rel: adjacent_workflow
    sources:
      - https://mesonbuild.com/Running-Meson.html
      - https://ninja-build.org/manual
  - id: brew:cmake
    reason: >
      CMake is a more established alternative build-configuration system with a broader
      generator ecosystem; choose Meson when its smaller declarative language and
      Ninja-centered workflow are preferable.
    rel: alternative
    sources:
      - https://mesonbuild.com/
      - https://cmake.org/about/
