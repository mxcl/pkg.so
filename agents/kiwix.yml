history:
  adoption-history:
    - >
      The project grew from an offline-Wikipedia reader into a family of applications
      for macOS, iOS, Windows, Linux, Android, browser environments, and servers. Its
      content catalog likewise expanded beyond Wikipedia to many web-based educational
      and reference collections.
    - >
      Kiwix is organized as a Swiss nonprofit and is developed by a worldwide team and
      volunteer community. The Apple client is distributed through Apple's stores and as
      a direct macOS download.
  package-nerd-significance:
    - >
      Kiwix separates content from the reader through ZIM, a compressed open archive
      format. That architecture lets package users install a relatively stable reader
      while selecting large, independently distributed offline datasets.
    - >
      It is a prominent example of packaging web-scale reference material for
      disconnected, bandwidth-constrained, educational, archival, and field-use
      environments.
  project-history:
    - >
      In 2006, Renaud Gaudin built an offline Wikipedia reader for information kiosks in
      Mali while Emmanuel Engelhart independently created an offline Wikipedia project
      named Kiwix and helped develop openZIM. They joined forces under the Kiwix name in
      2007.
    - >
      Kiwix subsequently broadened from offline Wikipedia into a multi-platform reader
      and distribution ecosystem for many kinds of web content. The current Apple
      repository provides the shared iOS, iPadOS, and macOS client.
  related-projects:
    - openZIM defines the archive ecosystem used to package content.
    - libkiwix and libzim provide shared reader and archive functionality.
    - >
      Kiwix Desktop, Kiwix Android, Kiwix JS, and kiwix-tools serve other platforms and
      deployment models.
  sources:
    - https://github.com/kiwix
    - https://github.com/kiwix/kiwix-apple
    - https://www.kiwix.org/en/about/
  summary:
    - >
      Kiwix is an open-source offline reader for web content, best known for making
      Wikipedia and other educational collections available without a live internet
      connection.
  timeline:
    - '2006: Renaud Gaudin and Emmanuel Engelhart independently began offline-Wikipedia work.'
    - '2007: The two efforts joined under the Kiwix name.'
    - '2022–2023 era: The unified Apple client added macOS support in its 3.0 line.'
  usage:
    - >
      Users download or open ZIM archives, search and browse their contents locally, and
      manage an offline library. The approach is useful where connectivity is absent,
      costly, unreliable, or intentionally restricted.
    - >
      The Apple application supports macOS as well as iOS and iPadOS and can obtain
      content through Kiwix's catalog or open compatible local ZIM files.
