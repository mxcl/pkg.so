  summary:
    - >
      HP Easy Admin is HP's macOS utility for downloading printer and scanner solutions
      for later deployment.
  timeline:
    - 'By 2018: HP had published its official Easy Admin support and usage guide.'
  usage:
    - >
      Administrators select an HP printer model, locate the appropriate print or scan
      solution, and download it for local use or remote distribution. A printer
      connection is not required.
