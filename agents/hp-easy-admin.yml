history:
  adoption-history:
    - >
      HP positions Easy Admin for education and enterprise administrators who need
      printer and scanner software for remote distribution.
  package-nerd-significance:
    - >
      It provides Mac administrators with a focused way to retrieve HP deployment
      packages without connecting to the target printer, making it useful in
      managed-fleet and software-distribution workflows.
  project-history:
    - >
      HP developed Easy Admin as a macOS utility for directly downloading HP printing
      and scanning solutions.
