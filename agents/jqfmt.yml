id: brew:jqfmt
display-name: jqfmt
repo: null
docs:
  - https://github.com/noperator/jqfmt#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption evidence is modest and package-manager oriented: Homebrew packages jqfmt
      from its v0.1.0 GitHub tag, and the input batch also records Nix packaging.
      Homebrew analytics for the formula showed 92 installs over the 365-day window
      reported by the formula API on 2026-07-01.
  package-nerd-significance:
    - >
      The tool is notable because jq has many linters, wrappers, and JSON formatters,
      but fewer dedicated formatters for jq's own query language. jqfmt also illustrates
      a common small-tool pattern: extract just enough parser machinery from an
      implementation such as gojq to make a narrow CLI utility.
  project-history:
    - >
      The README describes jqfmt as an opinionated formatter written after the author
      found long jq-heavy shell snippets difficult to inspect. Its implementation began
      from code taken out of itchyny/gojq's query parser because gojq did not expose the
      parser and AST walking API the author wanted.
  related-projects:
    - >
      jqfmt is closely related to jq, gojq, jqjq, and other jq-adjacent utilities that
      parse or transform jq programs rather than JSON data alone.
  sources:
    - https://formulae.brew.sh/api/formula/jqfmt.json
    - https://github.com/itchyny/gojq
    - https://github.com/noperator/jqfmt
    - https://github.com/noperator/jqfmt/releases/tag/v0.1.0
  summary:
    - >
      jqfmt is a small Go command-line formatter for jq programs, built for the
      practical problem of reading long shell one-liners that contain dense jq
      expressions.
  timeline:
    - '2025: GitHub release feed recorded v0.1.0 as the initial release.'
    - '2026: Homebrew formula API packaged v0.1.0 from the GitHub release archive.'
  usage:
    - >
      jqfmt reads jq expressions from a file or standard input and adds line breaks
      around selected structures such as objects, arrays, pipes, and operators. It is
      meant as a readability tool rather than a replacement for jq itself.
related-packages:
  - id: brew:jq
    reason: Use jq to execute the queries that jqfmt reformats for easier reading and editing.
    rel: adjacent_workflow
    sources:
      - https://github.com/noperator/jqfmt
      - https://jqlang.org/manual/
