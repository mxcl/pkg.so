history:
  adoption-history:
    - >
      Pretzel serves livestreamers and video creators who need music licensed for
      monetized Twitch and YouTube content. Its desktop player, curated stations and
      streaming integrations fit directly into creator broadcast workflows.
    - >
      Pretzel subsequently joined Songtradr. Pretzel's official account of the
      acquisition says its existing team continued day-to-day operation and its
      creator-focused licensing mission remained unchanged.
  package-nerd-significance:
    - >
      Pretzel is notable as a desktop package whose core value is not merely playback
      but the licensing metadata attached to its catalog. Packaging the player gives
      creators a dedicated, updatable client for selecting music according to
      platform-specific usage rights.
    - >
      Its distinction between Twitch-safe and YouTube-safe material illustrates why
      media packages may depend on a live service and changing rights data rather than a
      static local music library.
  project-history:
    - >
      Pretzel began as a service created by streamers to make complex music licensing
      more manageable for content creators. It developed a curated catalog licensed for
      use in livestreams and recorded creator content.
    - >
      The service later became part of Songtradr's music-rights ecosystem while
      retaining its product team and focus on creator-safe music.
  related-projects:
    - Songtradr, the music-rights and licensing company that acquired Pretzel.
    - >
      Twitch and YouTube, the principal publishing platforms addressed by Pretzel's
      licensing and filtering features.
  sources:
    - https://help.pretzel.rocks/en-us/articles/15281272-what-is-pretzel
    - >
      https://help.pretzel.rocks/en-us/articles/15281279-pretzel-was-acquired-by-songtradr-what-does-that-mean-for-pretzel
    - https://help.pretzel.rocks/en-us/articles/15281302-what-is-youtube-safe
    - https://www.pretzel.rocks/
  summary:
    - >
      Pretzel is a licensed music-streaming service and desktop player designed for
      livestreamers and other monetized-content creators.
  timeline:
    - Pretzel was created by streamers to simplify music licensing for creators.
    - Pretzel later joined the Songtradr family while retaining its operating team.
  usage:
    - >
      Creators use the player to browse licensed stations and filter material
      appropriate for their publishing platform. Pretzel also offers desktop and Stream
      Deck integration for live-production workflows.
    - >
      Users must pay attention to the service's current platform labels and subscription
      terms: Pretzel's official guidance explains that rights-holder changes can affect
      catalog status and that continued protection may depend on an active paid
      subscription.
