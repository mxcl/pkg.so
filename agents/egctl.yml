history:
  adoption-history:
    - >
      egctl adoption follows Envoy Gateway adoption in cloud-native shops experimenting
      with or standardizing on Kubernetes Gateway API. The input package metadata lists
      Homebrew, Debian, Ubuntu, and Nix, which fits a tool used by platform engineers
      across laptops, CI images, and operations hosts.
  package-nerd-significance:
    - >
      For package nerds, egctl is a neat example of a sub-binary packaged out of a
      larger cloud-native controller repository. Its release assets sit next to CRDs and
      install manifests, so packaging it is about extracting the useful operator CLI
      from a broader Kubernetes release train.
  project-history:
    - >
      Envoy Gateway was introduced as an open source project for dynamically
      provisioning and configuring Envoy Proxy from Gateway API resources. The egctl
      binary became part of the release artifacts for operators who need a packaged
      command-line surface alongside the controller and Kubernetes manifests.
    - >
      The earliest public Envoy Gateway release on GitHub was v0.1.0 in May 2022.
      Releases quickly added prebuilt egctl archives for common operating systems,
      making the CLI easy for Homebrew and other package managers to distribute
      separately from the full Kubernetes install manifests.
  related-projects:
    - Envoy Proxy is the data-plane proxy managed by Envoy Gateway.
    - >
      Kubernetes Gateway API provides the resource model that Envoy Gateway watches and
      implements.
    - >
      kubectl remains the general Kubernetes CLI that egctl complements for Envoy
      Gateway-specific operations.
  sources:
    - https://github.com/envoyproxy/gateway#readme
    - https://gateway.envoyproxy.io/docs
    - https://gateway.envoyproxy.io/latest/tasks/operations/egctl/
    - https://github.com/envoyproxy/gateway/releases
  summary:
    - >
      egctl is the command-line utility shipped with Envoy Gateway, the Envoy project
      for managing Envoy Proxy as a standalone or Kubernetes application gateway. Its
      history is therefore tied to Envoy Gateway's rise around Kubernetes Gateway API
      rather than to an independent CLI lineage.
  timeline:
    - '2022-05-13: Envoy Gateway v0.1.0 prerelease appears.'
    - '2022-10-20: Envoy Gateway v0.2.0 is published as a non-prerelease.'
    - '2023-11-02: v0.6.0 shows the project maturing through 2023.'
    - '2026-06-05: v1.8.1 release includes egctl archives for Linux, macOS, and Windows.'
  usage:
    - >
      egctl is used for operating and inspecting Envoy Gateway deployments,
      complementing kubectl and the Gateway API objects that actually drive
      configuration. It is a package-manager-friendly way to put Envoy Gateway
      diagnostics and operator commands on a workstation without installing the whole
      project from source.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      kubectl manages the Kubernetes and Gateway API resources on which egctl operates,
      while egctl adds Envoy Gateway-specific inspection and diagnostic commands.
    rel: adjacent_workflow
    sources:
      - https://gateway.envoyproxy.io/latest/tasks/operations/egctl/
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:envoy
    reason: >
      Envoy is the data-plane proxy whose generated configuration egctl can retrieve and
      inspect through Envoy Gateway.
    rel: adjacent_workflow
    sources:
      - https://gateway.envoyproxy.io/latest/tasks/operations/egctl/
      - https://www.envoyproxy.io/docs/envoy/latest/
