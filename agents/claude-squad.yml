config-file-location:
  unix:
    - ~/.claude-squad/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through Homebrew and a manual shell installer. Homebrew
      packages stable version 1.0.19 from the official GitHub tag archive and also
      exposes a `head` build from the main branch.
    - >
      The official GitHub release API records v1.0.19 published on June 17, 2026. The
      README also documents installation as `claude-squad` with an optional `cs`
      symlink, plus a manual installer that places the binary in `~/.local/bin`.
  package-nerd-significance:
    - >
      Claude Squad is package-nerd significant because it packages orchestration around
      existing local CLIs rather than yet another model client. It treats tmux, git
      worktrees, gh, and agent binaries as composable dependencies in a single TUI
      workflow.
    - >
      Its Homebrew formula is also an example of the new AI-agent tooling stack entering
      conventional package managers: users install one binary, then combine it with
      separately packaged agents such as Claude Code, Codex, Aider, and Gemini.
  project-history:
    - >
      Claude Squad belongs to the agent-orchestration layer that appeared after terminal
      coding agents became practical daily tools. Instead of providing a model or coding
      agent itself, it manages several agent sessions, previews their diffs, and helps
      users check out or push the resulting branches.
    - >
      The README documents a deliberately Unix-native architecture: tmux for isolated
      terminal sessions, git worktrees for conflict-free branches, and the GitHub CLI
      for pull-request-oriented workflows. Its default program is `claude`, but users
      can launch Codex, Aider, Gemini, or custom programs with the `-p` flag or profiles
      in the config file.
  related-projects:
    - Claude Code is the default program Claude Squad launches.
    - Codex, Gemini CLI, and Aider are named by the README as supported local agent programs.
    - >
      tmux, git worktrees, and the GitHub CLI are required or central tools in the
      documented architecture.
  sources:
    - https://github.com/smtg-ai/claude-squad
    - https://formulae.brew.sh/api/formula/claude-squad.json
    - https://api.github.com/repos/smtg-ai/claude-squad/releases/latest
  summary:
    - >
      Claude Squad is a terminal TUI for managing multiple AI coding agents in separate
      workspaces. The official README describes it as a way to run Claude Code, Codex,
      Gemini, Aider, and other local agents simultaneously, using tmux sessions and git
      worktrees to isolate each task.
  timeline:
    - '2026-06-17: GitHub release API records Claude Squad v1.0.19.'
    - >
      2026: Homebrew formula `claude-squad` packages v1.0.19 from the official GitHub
      tag archive.
    - >
      2026: The README documents Claude Code, Codex, Gemini, and Aider profiles with
      tmux and git-worktree isolation.
  usage:
    - >
      Users run `cs` to open the TUI, create or attach to sessions, review diffs, commit
      and push branches, pause or resume sessions, and switch between preview and diff
      tabs. The default agent command is `claude`, while `cs -p "codex"`, `cs -p "aider
      ..."`, and `cs -p "gemini"` launch other assistants.
    - >
      Configuration lives at `~/.claude-squad/config.json`; the README documents `cs
      debug` as the way to find the exact path and profiles as the way to persist named
      agent commands.
related-packages:
  - id: cask:claude-code
    reason: >
      Claude Code is Claude Squad's default agent command and can be run in isolated
      concurrent worktrees through the TUI.
    rel: adjacent_workflow
    sources:
      - https://github.com/smtg-ai/claude-squad#readme
      - https://github.com/anthropics/claude-code#readme
  - id: cask:codex
    reason: >
      Claude Squad explicitly supports launching Codex sessions with `cs -p "codex"` or
      a named profile.
    rel: adjacent_workflow
    sources:
      - https://github.com/smtg-ai/claude-squad#readme
      - https://github.com/openai/codex#readme
  - id: brew:aider
    reason: >
      Claude Squad explicitly supports Aider as an agent program, including passing
      Aider model arguments through its program option or profiles.
    rel: adjacent_workflow
    sources:
      - https://github.com/smtg-ai/claude-squad#readme
      - https://aider.chat/docs/
  - id: brew:gemini-cli
    reason: >
      Claude Squad explicitly documents launching Gemini CLI in a managed session with
      `cs -p "gemini"`.
    rel: adjacent_workflow
    sources:
      - https://github.com/smtg-ai/claude-squad#readme
      - https://github.com/google-gemini/gemini-cli#readme
  - id: brew:tmux
    reason: >
      tmux is an official Claude Squad prerequisite and supplies the isolated terminal
      sessions used for managed agents.
    rel: adjacent_workflow
    sources:
      - https://github.com/smtg-ai/claude-squad#readme
      - https://github.com/tmux/tmux/wiki
  - id: brew:gh
    reason: >
      GitHub CLI is an official prerequisite used alongside Claude Squad's
      commit-and-push workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/smtg-ai/claude-squad#readme
      - https://cli.github.com/manual/gh
