credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption has centered on developers who want issue data to travel with a Git
      repository and who need offline access. The project documents bridges for GitHub,
      GitLab, Jira, and Launchpad, making it useful as a local archive and
      synchronization layer rather than only as a replacement issue tracker.
  package-nerd-significance:
    - >
      For package users, git-bug is interesting because it treats issue tracking as a
      Git-native data problem. It fits the same offline-first, clone-and-sync model that
      made distributed version control attractive, while still acknowledging hosted
      issue trackers through bridge support.
  project-history:
    - >
      The project was initially built by Michael Mure and later organized under the
      git-bug project on GitHub. Public release history shows a 0.2.0 release in 2018,
      several 0.x releases through 2020 and 2022, and renewed 0.8 to 0.10 releases in
      2025, indicating a tool that evolved from a distributed issue-storage experiment
      into a CLI, TUI, and web-interface workflow.
  related-projects:
    - >
      git-bug relates to hosted issue trackers such as GitHub Issues, GitLab Issues,
      Jira, and Launchpad through its bridge system.
  sources:
    - https://formulae.brew.sh/formula/git-bug
    - https://github.com/git-bug/git-bug
    - https://raw.githubusercontent.com/git-bug/git-bug/trunk/CHANGELOG.md
    - https://raw.githubusercontent.com/git-bug/git-bug/trunk/doc/usage/third-party.md
  summary:
    - >
      git-bug is a decentralized issue tracker that stores issues, comments, identities,
      and related metadata as Git objects inside a repository. Its project framing
      follows a long-running Git culture idea: project state should be portable with the
      repository rather than locked inside a single hosted forge.
  timeline:
    - '2018: 0.2.0 release documented in the changelog.'
    - '2020: 0.7.x releases continued the early 0.x line.'
    - '2025: 0.8.1, 0.9.0, and 0.10.x releases documented renewed CLI and web UI work.'
  usage:
    - >
      Practitioners use git-bug inside an existing repository to create, query, edit,
      and synchronize issues. Bridge users configure a third-party service, pull issues
      into the repository-backed store, work on them offline through the CLI, TUI, or
      web UI, then push changes back to the forge.
