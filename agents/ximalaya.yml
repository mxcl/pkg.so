history:
  adoption-history:
    - >
      The company says its service connects hundreds of millions of users across mobile,
      desktop, automotive, smart-home, smart-speaker, and wearable contexts. It reported
      13.51 million content creators and 268 million average monthly users across
      scenarios for 2021.
  package-nerd-significance:
    - >
      The cask packages a native Mac client for a large Chinese-language audio ecosystem
      rather than an open-source media player. For package-manager users, its
      significance is convenient desktop access to a service whose catalog, accounts,
      and distribution infrastructure remain platform-managed.
  project-history:
    - >
      Shanghai Ximalaya Technology was established in 2012. The company developed 喜马拉雅
      as an online audio-sharing platform and expanded it into a broad content ecosystem
      spanning long-form audio, creator publishing, live programming, smart speakers,
      vehicles, and other connected devices.
