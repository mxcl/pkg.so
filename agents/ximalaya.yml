    - >
      喜马拉雅 is a Chinese online audio platform and desktop client for discovering and
      listening to audiobooks, podcasts, radio-style programs, live audio, and other
      spoken-word content.
  timeline:
    - '2012: Shanghai Ximalaya Technology was established.'
