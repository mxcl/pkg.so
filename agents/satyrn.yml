history:
  adoption-history:
    - >
      Satyrn is currently presented by its developer as an alpha for macOS. It lowers
      migration friction by opening standard ipynb files from Finder, detecting existing
      kernels and Conda environments, and connecting to remote servers.
    - >
      The application has broadened from notebook editing into environment and
      dependency management through uv, plus AI-assisted autocomplete, prompt cells,
      agent mode, SQL cells, linting, Black formatting, code search, and Plotly
      integration.
  package-nerd-significance:
    - >
      Satyrn sits at the intersection of desktop-app packaging and Python environment
      management. Its integration with uv creates and manages Python versions, virtual
      environments, kernels, and dependencies inside a notebook client, making it
      particularly interesting to users who normally assemble that stack from Jupyter,
      Conda, ipykernel, and command-line package tools.
    - >
      The Homebrew cask packages an Electron-based macOS application, while Satyrn’s
      optional command-line launcher restores the terminal-to-notebook workflow expected
      by developers.
  project-history:
    - >
      Satyrn originated from its developer’s desire for a native-feeling macOS Jupyter
      client. Development began with a Swift prototype, but limitations in available
      Swift code-editor frameworks led to a rewrite using TypeScript, Electron, and
      CodeMirror.
    - >
      The Electron version quickly added familiar editor capabilities such as
      autocomplete, multiple cursors, cross-cell cursor movement, and linting. Later
      work integrated uv for automatic Python and virtual-environment management and
      added provider-backed AI coding features.
  related-projects:
    - Jupyter and the ipynb format
    - JupyterLab
    - Visual Studio Code
    - Electron
    - CodeMirror
    - uv
    - Conda
  sources:
    - https://satyrn.app/
    - https://satyrn.app/blog/electron-rewrite/
    - https://satyrn.app/blog/intelligent-autocomplete-eval/
    - https://satyrn.app/blog/satyrn-virtual-env-management/
    - https://satyrn.app/cli/
  summary:
    - >
      Satyrn is an alpha-stage macOS Jupyter client designed to provide a faster, more
      focused notebook experience with integrated Python environments, editing tools,
      database cells, visualizations, remote-server access, and AI assistance.
  timeline:
    - 'Initial prototype: Satyrn began as a Swift application intended to feel native on macOS.'
    - >
      Electron rewrite: The developer moved the editor to TypeScript, Electron, and
      CodeMirror.
    - 'Later development: Satyrn added AI autocomplete and editing features.'
    - >
      Later development: uv integration added managed Python versions, virtual
      environments, kernels, and dependencies.
  usage:
    - >
      Users open ipynb notebooks or directories from Finder, the desktop interface, or
      the `satyrn` command-line launcher. Satyrn can reuse detected kernels and Conda
      environments or create uv-managed environments.
    - >
      Notebook workflows include Python and SQL cells, remote-server connections,
      autocomplete, AI prompt cells, agent mode, linting, Black formatting, code search,
      and Plotly output.
