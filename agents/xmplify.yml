history:
  adoption-history:
    - >
      MOSO states that Xmplify is used by businesses, educational and research
      institutions, and individuals in more than 50 countries. Its published customer
      list spans media, technology, finance, standards, research, and higher education.
  package-nerd-significance:
    - >
      Xmplify represents the native-macOS end of the XML-tooling spectrum: a graphical
      editor that combines structured editing, schema-aware completion, validation,
      XPath, and XSLT workflows without requiring a cross-platform IDE.
  project-history:
    - >
      MOSO developed Xmplify specifically for macOS as a native XML editor. Its
      long-running release notes document continuing compatibility work across macOS
      generations and the transition to a Universal binary supporting Intel and Apple
      silicon.
    - >
      The editor grew beyond syntax editing to include automatic schema derivation,
      contextual documentation, DTD and XSD validation, XPath and regular-expression
      search, XSLT processing, and live web previews.
  related-projects:
    - >
      Xmplify can use external XSLT processors including Saxon and Xalan, in addition to
      its built-in libxslt processor.
  sources:
    - https://xmplifyapp.com/
    - https://xmplifyapp.com/faq.html
    - https://xmplifyapp.com/release-notes/current.html
  summary:
    - >
      Xmplify is MOSO's commercial native XML editor for macOS, centered on schema-aware
      editing, validation, XPath, XSLT, and structured-document navigation.
  timeline:
    - >
      By 2006: MOSO's site copyright history indicates Xmplify's product presence dates
      to the mid-2000s.
    - "2021: Xmplify's release line became a Universal binary for Intel and Apple silicon Macs."
    - >
      2022–2025: Releases continued adapting the editor to newer macOS behavior while
      refining schema handling and editing assistance.
  usage:
    - >
      Users edit XML with context-sensitive completion derived from a DTD, an XML
      Schema, or a schema Xmplify generates automatically. Common workflows include
      validating documents, navigating to definitions, running XPath searches, applying
      XSL transformations, and previewing generated HTML.
    - >
      The official FAQ documents custom document templates under ~/Library/Application
      Support/Xmplify/Templates, but this is application-support content rather than a
      documented main configuration file.
