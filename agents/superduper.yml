history:
  adoption-history:
    - >
      SuperDuper! has remained available across many generations of Mac OS X and macOS.
      Shirt Pocket continues to provide older compatible releases reaching back to
      Jaguar-era systems while current releases support APFS and modern macOS.
    - >
      The application became a familiar Mac-maintenance tool for users who wanted a
      directly bootable or readily recoverable copy of a startup disk, complementing
      file-versioning and cloud-backup products.
  package-nerd-significance:
    - >
      SuperDuper! is a long-lived example of specialist Mac shareware distributed
      outside the Mac App Store. Its presence in Homebrew Cask makes a traditionally
      website-delivered system utility discoverable and script-installable.
    - >
      It also documents the evolution of Mac storage: releases span PowerPC and
      Intel-era boot constraints, FireWire and USB disks, HFS+, APFS, and the changing
      system-volume behavior of recent macOS releases.
  project-history:
    - >
      Shirt Pocket developed SuperDuper! as a focused macOS backup, recovery, and
      disk-copying utility. The product emphasizes a simple interface over the
      lower-level complexity of cloning APFS or HFS+ volumes.
    - >
      Its long compatibility record tracks major Mac hardware and filesystem
      transitions. Shirt Pocket maintains separate legacy downloads for older
      operating-system releases while adapting current versions to newer macOS storage
      rules.
  related-projects:
    - >
      Time Machine: Apple's built-in versioned backup facility, commonly used alongside
      rather than identically to a clone-oriented tool.
    - "Disk Utility: Apple's built-in disk-management and imaging application."
  sources:
    - https://shirt-pocket.com/SuperDuper/SuperDuperDescription.html
    - https://www.shirt-pocket.com/superduper4.php
    - source_facts.description
    - source_facts.version
  summary:
    - >
      SuperDuper! is Shirt Pocket's macOS utility for backing up, recovering, and
      copying APFS and HFS+ volumes.
  timeline:
    - 'Mac OS X era: SuperDuper! releases supported systems as early as Jaguar and Panther.'
    - >
      2017: Apple's APFS era created a new filesystem target that later SuperDuper!
      releases support.
    - '2026: Homebrew distributes SuperDuper! 4.x as a macOS cask.'
  usage:
    - >
      Users select a source volume and a separate destination volume, then perform a
      full copy or a faster incremental update using saved settings and schedules.
    - >
      It is commonly used to maintain a local recovery copy on an external disk. It does
      not target optical media or tape, and the destination must be separate from the
      startup volume.
