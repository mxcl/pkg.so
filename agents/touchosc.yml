history:
  adoption-history:
    - >
      TouchOSC became established in music and live-performance workflows by letting
      phones and tablets act as customizable OSC and MIDI control surfaces. Official
      Hexler material records an iPad-compatible universal release in 2010, REAPER
      support in 2012, and a fully featured Android version in 2013.
    - >
      The next-generation release broadened the product into a cross-platform editor and
      runtime for desktop and mobile systems. Documents can be exchanged across
      platforms, while MIDI, OSC, scripting, gamepad input, and networked editing
      support more elaborate installations.
  package-nerd-significance:
    - >
      TouchOSC sits at the boundary between desktop packaging, music technology, and
      network protocols. Its macOS cask is useful in reproducible audio workstations
      where the same control layouts may also run on Linux, Windows, iOS, or Android.
    - >
      Its portable `.tosc` documents, legacy layout import, OSC/MIDI interoperability,
      Lua-based scripting, and architecture-specific Linux packages make its release
      history relevant to maintainers of creative-tool environments.
  project-history:
    - >
      Hexler developed TouchOSC as a configurable touch control surface for sending and
      receiving Open Sound Control and MIDI data. Early releases focused on Apple mobile
      devices, followed by Android support and companion editor and bridge tools.
    - >
      In June 2021 Hexler announced a brand-new, next-generation TouchOSC. The
      redesigned application integrated the editor into every platform, introduced a new
      `.tosc` document format, and expanded scripting, message routing, and synchronized
      network editing.
  related-projects:
    - TouchOSC Mk1
    - TouchOSC Bridge
    - Protokol
    - Open Sound Control
    - MIDI
  sources:
    - 'Official TouchOSC news archive: https://hexler.net/news/category/touchosc'
    - 'Official manual: https://hexler.net/touchosc/manual/complete'
    - 'Official next-generation announcement: https://hexler.net/touchosc-the-next-generation'
    - 'Official releases: https://hexler.net/touchosc/releases'
  summary:
    - >
      TouchOSC is Hexler's cross-platform toolkit for building custom control surfaces
      that communicate with music, media, and other software through MIDI, OSC, local
      messages, scripts, and related transports.
  timeline:
    - '2010: TouchOSC became a universal Apple mobile application with iPad support.'
    - '2012: REAPER added OSC control-surface support including TouchOSC workflows.'
    - '2013: Hexler released a fully featured Android version.'
    - >
      2016: TouchOSC and TouchOSC Bridge added USB connectivity for supported
      mobile-to-desktop workflows.
    - '2021-06: Hexler announced the next-generation TouchOSC for desktop and mobile platforms.'
  usage:
    - >
      Create a control-surface document in the integrated editor, add controls and
      message mappings, configure MIDI or OSC connections, and enter control-surface
      mode to operate connected software or hardware.
    - >
      Layouts can be exchanged across supported platforms and synchronized for networked
      editing and preview. The official manual includes setup recipes for Ableton Live,
      Logic Pro, Traktor Pro, Resolume Wire, and Hexler Protokol.
