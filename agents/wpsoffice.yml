history:
  adoption-history:
    - >
      The personal edition became free in 2005, helping establish WPS Office as a widely
      available alternative to commercial office suites.
    - >
      WPS expanded from its Chinese PC origins to macOS, Linux, Windows, Android, and
      iOS. Its official company history describes worldwide distribution and support for
      dozens of languages.
  package-nerd-significance:
    - >
      WPS Office is a prominent proprietary alternative in desktop package catalogs for
      users who need one install covering word processing, spreadsheets, presentations,
      and PDFs with compatibility for common Microsoft Office formats.
    - >
      Its lineage from a DOS word processor through Kingsoft Office to the globally
      branded WPS Office makes it an unusually long-running office package across
      several generations of desktop computing.
  project-history:
    - >
      Kingsoft traces WPS to Qiu Bojun's first WPS word processor for Chinese DOS users
      in 1988. The product was subsequently rebuilt for Windows, and a full writing,
      spreadsheet, and presentation suite was released in China under the WPS Office
      name in 2001.
    - >
      The personal edition became free in 2005. International editions were known for a
      time as Kingsoft Office before the worldwide product name returned to WPS Office
      in 2014. PDF, cloud collaboration, and AI features later broadened the suite
      beyond its original three editors.
  related-projects:
    - >
      WPS Writer, WPS Spreadsheet, WPS Presentation, and WPS PDF are the suite's
      principal components.
    - >
      Microsoft Office, Google Docs, and LibreOffice address overlapping document
      workflows and file formats.
  sources:
    - https://help.wps.com/?lang=en
    - https://www.wps.com/about-us/
    - https://www.wps.com/blog/what-is-kingsoft/
    - https://www.wps.com/office/
    - https://www.wps.com/office/mac/
  summary:
    - >
      WPS Office is Kingsoft Office Software's cross-platform productivity suite,
      combining word processing, spreadsheets, presentations, and PDF tools.
  timeline:
    - '1988: The first WPS word processor was completed for Chinese DOS users.'
    - '2001: A full office suite was released in China under the WPS Office name.'
    - '2005: The personal edition became free.'
    - '2011: The office business became Beijing Kingsoft Office Software.'
    - '2014: Kingsoft Office was renamed WPS Office worldwide.'
    - "2019: Kingsoft Office listed on Shanghai's STAR Market."
    - '2023: WPS AI was introduced.'
  usage:
    - >
      Users create and edit text documents, spreadsheets, presentations, and PDFs in one
      application and exchange files in widely used Microsoft Office formats.
    - >
      Optional account-backed services add cloud synchronization and real-time
      collaboration, while the desktop editors also support conventional local-file
      workflows.
