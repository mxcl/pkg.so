  windows:
    - '%APPDATA%\Freelens'
credentials-file-location:
  unix:
    - ~/.kube/config
history:
  adoption-history:
    - >
      Freelens is distributed for macOS, Windows, and Linux, with official project
      instructions covering direct packages and package-manager channels including
      Homebrew, APT, Flatpak, Snap, AUR, WinGet, and Scoop.
    - >
      The project reports that extensions previously used with OpenLens have been
      converted for Freelens, preserving an important part of the surrounding Kubernetes
      desktop-tool ecosystem.
  package-nerd-significance:
    - >
      Freelens gives package users a fully open community continuation of the
      Lens/OpenLens-style Kubernetes desktop experience. Its broad packaging matrix and
      bundled kubectl and Helm tools make it an instructive example of the complexity
      involved in shipping a consistent Kubernetes GUI across desktop platforms.
    - >
      For cluster operators, its interaction with kubeconfig files, authentication
      helpers, kubectl versions, Helm, Electron storage, and extensions makes
      installation provenance and packaging behavior operationally relevant.
  project-history:
    - >
      Freelens is a community-maintained, free and open-source Kubernetes IDE derived
      from the OpenLens codebase. Official repository records retain attribution for
      files continuing code from the original OpenLens fork.
    - >
      Development has expanded beyond basic cluster browsing to include an integrated
      terminal, bundled kubectl and Helm clients, extension APIs, cross-platform
      packages, and continuing modernization of the inherited codebase.
  related-projects:
    - OpenLens is the upstream lineage from which Freelens was forked.
    - >
      kubectl and Helm are bundled command-line tools used by Freelens for cluster and
      package operations.
    - >
      Kubernetes kubeconfig files supply cluster endpoints, contexts, certificates,
      tokens, and authentication-provider configuration.
  sources:
    - https://freelensapp.github.io/docs/
    - https://github.com/freelensapp/freelens/blob/main/README.md
    - https://github.com/freelensapp/freelens/issues/2447
    - https://github.com/freelensapp/freelens/releases
  summary:
    - >
      Freelens is a community-maintained, cross-platform Kubernetes IDE descended from
      OpenLens. It provides graphical cluster inspection and management together with
      terminals, kubectl and Helm integration, and an extension system.
  timeline:
    - '2024: The Freelens repository imported and continued the OpenLens-derived codebase.'
    - >
      2025: The project documented broad native and package-manager distribution across
      macOS, Windows, and Linux.
    - >
      2026: Freelens completed a major ESM-first, Vite, and Vitest modernization on its
      main development line.
  usage:
    - >
      Users load Kubernetes clusters from kubeconfig files, inspect workloads and
      resources, view logs and YAML, open terminals, and perform common
      cluster-management operations from a desktop interface.
    - >
      Freelens uses ~/.kube/config by default on Unix-like systems and can use bundled
      or user-selected kubectl and Helm executables. Extensions add pages, resource
      actions, preferences, catalog integrations, and other functionality.
