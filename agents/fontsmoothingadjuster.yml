history:
  adoption-history:
    - >
      The project serves macOS users who lost the graphical font-smoothing control when
      Apple removed it from System Preferences in macOS Big Sur. Its narrow scope makes
      it a convenience utility rather than a broad configuration framework.
  package-nerd-significance:
    - >
      It packages a macOS defaults-domain tweak behind a small native GUI, illustrating
      how package managers can preserve discoverability for focused utilities that
      restore removed operating-system controls.
  project-history:
    - >
      Bounce Technologies created Font Smoothing Adjuster after macOS Big Sur removed
      the earlier System Preferences control for disabling font smoothing. The project
      was published as an MIT-licensed native macOS application, with source and
      official releases hosted on GitHub.
  related-projects:
    - >
      The underlying macOS `defaults` command and the global `AppleFontSmoothing`
      preference provide the command-line equivalent of the app's controls.
  sources:
    - >
      Official project README:
      https://github.com/bouncetechnologies/Font-Smoothing-Adjuster#readme
  summary:
    - >
      Font Smoothing Adjuster is a small native macOS utility that exposes graphical
      controls for the system's font-smoothing preference.
  timeline:
    - >
      2020: macOS Big Sur removes the former graphical font-smoothing control,
      motivating the utility.
    - >
      2022: The project's documented development period includes its public GitHub
      releases and maintenance.
  usage:
    - >
      Users select a font-smoothing level or disable smoothing through the GUI, then log
      out or restart macOS for the change to apply across applications. Terminal users
      can make the equivalent change through the `AppleFontSmoothing` global preference.
