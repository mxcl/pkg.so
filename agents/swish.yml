history:
  adoption-history:
    - >
      Swish is distributed as a native macOS application and is also available through
      Setapp. The supplied package record identifies a Homebrew Cask, giving
      command-line-oriented Mac users another installation path.
  package-nerd-significance:
    - >
      Swish represents the class of polished, commercial macOS utilities commonly
      managed through Homebrew Cask even though their source code is not the package
      artifact. Its low-level, non-sandboxed behavior also explains why it is
      distributed outside the Mac App Store.
  project-history:
    - >
      Swish was created by Christian Renninger as a macOS window manager centered on
      trackpad gestures. The official site presents it as a commercial application with
      a trial and perpetual-license option.
  related-projects:
    - Setapp, which provides an alternative subscription distribution channel.
    - Mackup, which the official FAQ recommends for backing up Swish settings.
  sources:
    - https://highlyopinionated.co/legal/
    - https://highlyopinionated.co/swish/
    - source_facts.package-manager
  summary:
    - >
      Swish is a native macOS window-management utility that maps trackpad, Magic Mouse,
      and keyboard gestures to window snapping, resizing, application control, and
      movement between displays and Spaces.
  timeline:
    - '2019: The official site copyright identifies Swish with developer Christian Renninger.'
    - >
      Present: Swish is distributed directly, through Setapp, and through the supplied
      Homebrew Cask record.
  usage:
    - >
      Users invoke window actions by swiping or pinching on title bars and can enable or
      disable individual gestures in the settings window. Keyboard-driven snapping is
      also supported.
    - >
      The application requires macOS accessibility-style low-level control and is
      intentionally distributed outside the Mac App Store.
