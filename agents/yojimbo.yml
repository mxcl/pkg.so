history:
  adoption-history:
    - >
      Bare Bones continued developing Yojimbo across multiple macOS generations, adding
      tagging, iPad synchronization, Mac App Store distribution, iCloud synchronization,
      Apple Silicon support, and other platform integrations.
  package-nerd-significance:
    - >
      Yojimbo represents the long-running macOS tradition of native personal-information
      managers. Its Homebrew cask gives a proprietary Mac application a reproducible
      command-line installation path.
  project-history:
    - >
      Bare Bones Software released Yojimbo 1.0 in January 2006 as an information
      organizer for Mac OS X. It was designed as a low-friction repository for otherwise
      difficult-to-classify personal information.
  related-projects:
    - Yojimbo for iPad was introduced as a companion product in 2010.
    - Other Bare Bones Software products include BBEdit and the discontinued TextWrangler.
  sources:
    - 'Official company history: https://www.barebones.com/company/history.html'
    - 'Official product page: https://www.barebones.com/products/yojimbo'
    - 'Official release archive: https://www.barebones.com/support/yojimbo/archived_notes.html'
    - source_facts.package-manager
  summary:
    - >
      Yojimbo is a proprietary macOS personal-information organizer developed by Bare
      Bones Software and first released in 2006.
  timeline:
    - '2006-01-22: Yojimbo 1.0 was released.'
    - '2009: Yojimbo 2.0 added tag browsing.'
    - '2010: Yojimbo 3.0 and Yojimbo for iPad introduced synchronization.'
    - '2011: Yojimbo became available through the Mac App Store.'
    - '2013: Yojimbo 4.0 added optional synchronization and Retina-display support.'
    - '2020: Yojimbo 4.5 added iCloud synchronization and Dark Mode support.'
  usage:
    - >
      Users collect text, bookmarks, PDFs, web archives, serial numbers, passwords, and
      images, then retrieve them using search, tags, labels, and collections.
    - >
      Yojimbo copies imported material into its database and supports exporting items
      without locking them into a proprietary workflow.
