credentials-file-location: null
history:
  adoption-history:
    - >
      EVE Online has sustained a player community for more than two decades. Its
      official retrospective data identifies characters created on the May 6, 2003
      launch date that remained associated with players attending Fanfest in 2022.
    - >
      Corporations and alliances became core social institutions in its shared universe.
      Regular expansions, community events, and official developer interfaces support a
      broader ecosystem around the game.
  package-nerd-significance:
    - >
      The cask packages the launcher for a long-lived, continuously updated online game
      rather than a fixed game payload. The launcher manages the much larger shared
      client cache independently of Homebrew.
    - >
      EVE's local profiles and caches are operationally important because interface
      layouts and other client settings may require explicit backup. Its data-rich
      universe also supports third-party market, corporation, fitting, and analytics
      tools through official developer interfaces.
  project-history:
    - >
      EVE Online officially launched on May 6, 2003. It developed as a persistent
      science-fiction MMORPG distinguished by a shared universe, player organizations,
      industry, trade, and large-scale conflict.
    - >
      By 2005, the official project history described EVE as an established single-shard
      universe. The game marked its twentieth anniversary in 2023 and continued to
      receive expansions and launcher updates.
  related-projects:
    - >
      Officially related surfaces include EVE Academy, EVE Support, the EVE developer
      portal, and the wider EVE universe. Community applications commonly consume
      official game data and APIs.
  sources:
    - https://support.eveonline.com/
    - https://www.eveonline.com/
    - https://www.eveonline.com/eve-academy
    - https://www.eveonline.com/news/view/a-history-of-eve-database-server-hardware
    - https://www.eveonline.com/news/view/eve-player-data
  summary:
    - >
      EVE Online is a persistent, single-shard science-fiction MMORPG that launched in
      2003 and is maintained through continuing expansions and community events.
  timeline:
    - '2003: EVE Online officially launched on May 6.'
    - '2005: The game was already operating as a notable single-shard universe.'
    - '2023: EVE Online celebrated its twentieth anniversary.'
  usage:
    - >
      Players use the launcher to install, update, verify, and start the game client.
      EVE Academy provides introductory guidance, while the support site documents
      accounts, gameplay, policies, and troubleshooting.
    - >
      On macOS, official support documentation places client cache and settings profiles
      under ~/Library/Application Support/CCP/EVE/. Authentication is service-managed,
      and no official portable plaintext credentials file is documented.
