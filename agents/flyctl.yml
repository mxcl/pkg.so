config-file-location:
  unix:
    - ~/.fly/config.yml
credentials-file-location:
  unix:
    - ~/.fly/config.yml
history:
  adoption-history:
    - >
      flyctl adoption follows Fly.io's platform adoption: it is the documented entry
      point for launching apps, deploying services, managing infrastructure primitives,
      and automating CI workflows. Official install docs include Homebrew on macOS,
      shell install scripts on Unix-like systems, and a PowerShell installer on Windows.
  package-nerd-significance:
    - >
      flyctl is package-nerd significant as a fast-moving cloud CLI: package managers
      need to track frequent upstream releases, expose both fly and flyctl entry points,
      and preserve a simple install path for users who bootstrap deployments from a
      fresh workstation or CI image.
    - >
      It is also a good example of modern PaaS packaging, where the CLI is not just a
      helper but the main control plane surface for app creation, deployment,
      credentials, and operational introspection.
  project-history:
    - >
      Fly.io documentation presents flyctl as one of the primary ways to interact with
      the Fly.io platform. The CLI covers account login, app launch and deployment,
      Machines, volumes, networking, certificates, logs, secrets, organizations, SSH,
      WireGuard, and related platform operations.
    - >
      The public superfly/flyctl repository is the source-control home for the CLI and
      has been released as a versioned Go command-line tool since early public releases
      in 2019.
  related-projects:
    - >
      Fly.io Machines, Fly Launch, Fly Deploy, LiteFS Cloud, Managed Postgres, WireGuard
      networking, and Tigris storage are platform areas exposed through flyctl commands.
    - >
      The Fly.io docs site and the superfly/flyctl GitHub repository are the main
      related official project surfaces.
  sources:
    - https://fly.io/docs/flyctl/
    - https://fly.io/docs/flyctl/install/
    - https://github.com/superfly/flyctl
    - https://github.com/superfly/flyctl/releases/tag/v0.0.1
  summary:
    - >
      flyctl is the official Fly.io command-line interface, installed locally and
      invoked as fly to create, deploy, and manage applications on Fly.io.
  timeline:
    - '2019: flyctl v0.0.1 was published.'
    - "2020: flyctl continued through frequent v0.0.x releases as Fly.io's CLI matured."
    - '2022: Fly Machines and related infrastructure commands became part of the CLI surface.'
    - >
      2026: Fly.io documentation lists flyctl as the primary local CLI for apps,
      Machines, volumes, networking, and more.
  usage:
    - >
      Users run fly auth login or signup, fly launch, fly deploy, fly logs, fly status,
      fly secrets, fly machine, fly volumes, fly certs, and related commands to manage
      apps and infrastructure from local terminals or CI jobs.
