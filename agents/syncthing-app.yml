id: cask:syncthing-app
display-name: Syncthing for macOS
repo: null
docs:
  - https://docs.syncthing.net/
  - https://docs.syncthing.net/users/config.html
  - https://github.com/syncthing/syncthing-macos#readme
config-file-location:
  macos:
    - ~/Library/Application Support/Syncthing/config.xml
credentials-file-location:
  macos:
    - ~/Library/Application Support/Syncthing/key.pem
    - ~/Library/Application Support/Syncthing/https-key.pem
history:
  adoption-history:
    - >
      Syncthing became a prominent open-source option for continuous synchronization
      without routing users' files through a central storage provider. Its
      cross-platform daemon encouraged a surrounding ecosystem of service definitions,
      containers, and graphical wrappers.
    - >
      Syncthing for macOS packages the daemon with a native menu-bar interface, login
      startup, Finder integration, status reporting, and Sparkle updates. The supplied
      package record and official README both document Homebrew Cask installation.
  package-nerd-significance:
    - >
      Syncthing is notable for combining decentralized device-to-device synchronization,
      open source, cryptographic device identities, and a browser-based administration
      interface.
    - >
      The macOS bundle illustrates an important packaging pattern: a native wrapper
      tracks and embeds an upstream command-line daemon, disables the daemon's
      independent updater, and publishes wrapper releases tied to upstream versions.
  project-history:
    - >
      Syncthing's official release history begins with the v0.2 series in December 2013.
      It later adopted a three-part, semver-like release scheme with 1.0.
    - >
      The macOS project was created to make the Syncthing daemon behave like a native
      Mac application. It bundles a supported daemon version and intentionally keeps the
      wrapper lean, leaving advanced configuration to Syncthing's web interface.
    - >
      The bundle transitioned to the Syncthing v2 line as its supported branch in
      February 2026, with the v1 bundle line deprecated.
  related-projects:
    - Syncthing, the bundled cross-platform synchronization daemon.
    - Sparkle, used by the macOS wrapper for application updates.
    - Other Syncthing graphical wrappers and platform service integrations.
  sources:
    - https://docs.syncthing.net/
    - https://docs.syncthing.net/users/config.html
    - https://docs.syncthing.net/users/releases
    - https://github.com/syncthing/syncthing-macos
    - https://github.com/syncthing/syncthing-macos/releases
    - source_facts.package-manager
  summary:
    - >
      Syncthing for macOS is the official native macOS application bundle for Syncthing.
      It embeds the open-source synchronization daemon and adds a menu-bar status
      interface, login startup, Finder access, and an application-level updater.
  timeline:
    - "2013: Syncthing's official release table begins with v0.2."
    - '2019: Syncthing adopted its 1.0 release line and semver-like numbering.'
    - '2025: Syncthing 2.0 was released.'
    - >
      2026: The macOS bundle made Syncthing v2 the supported version and deprecated its
      v1 line.
  usage:
    - >
      Launch the menu-bar application, open Syncthing's Web GUI, add remote devices by
      device ID, and share selected folders with those devices.
    - >
      The bundle automatically manages a local Syncthing instance. Advanced users can
      point the wrapper at another local instance, adjust process quality of service, or
      supply extra daemon arguments through macOS defaults.
