history:
  adoption-history:
    - >
      The repository shows hundreds of stars, dozens of forks, and many tagged releases.
      The README documents Homebrew, Scoop, Arch, installer-script, and `go install`
      installation paths, which is a broader packaging surface than many LeetCode helper
      CLIs.
  package-nerd-significance:
    - >
      `leetgo` is a good package-nerd example of a language-specific productivity CLI
      that still needs cross-platform release automation, shell installation paths,
      browser-cookie integration, per-project config discovery, and generated source
      layouts for many programming languages.
  project-history:
    - >
      The project README describes `leetgo` as a terminal companion for LeetCode with
      code generation, local testing, contest support, automatic browser-cookie reading,
      and optional OpenAI-assisted fix support. It supports both leetcode.com and
      leetcode.cn.
    - >
      The v1.4 configuration change is a useful marker in the project's evolution: the
      README states that since v1.4, `leetgo` stopped reading the global
      `~/.config/leetgo/config.yaml` file and moved configuration into a project-local
      `leetgo.yaml` discovered by walking upward from the working directory.
  related-projects:
    - >
      The README credits EndlessCheng/codeforces-go, clearloop/leetcode-cli,
      budougumi0617/leetgode, and skygragon/leetcode-cli as inspirations.
  sources:
    - https://github.com/j178/leetgo
    - https://github.com/j178/leetgo/releases
  summary:
    - >
      `leetgo` is a Go-based LeetCode CLI that generates problem descriptions, skeleton
      code, test harnesses, contest files, and local test workflows for people who want
      to solve LeetCode problems from a terminal and editor.
  timeline:
    - '2024: v1.4-era documentation moved configuration into project-local `leetgo.yaml` files.'
    - '2024-11-04: v1.4.10 release notes document a Chrome cookie decryption fix.'
    - '2024-12-28: v1.4.13 release added support for multiple credential sources.'
    - '2026-04-04: v1.4.17 was released.'
  usage:
    - >
      A typical workflow is `leetgo init`, edit `leetgo.yaml`, `leetgo pick`, `leetgo
      test`, and `leetgo submit`. The tool can generate complete runnable programs for
      several languages and uses browser cookies, explicit cookies, or environment
      variables for LeetCode authentication.
related-packages:
