history:
  adoption-history:
    - >
      Serial is positioned for system administrators, network engineers, hardware
      developers, and other Mac users who regularly connect to routers, servers,
      firewalls, industrial controls, and embedded or IoT hardware. Its built-in device
      support reduces dependence on separately installed USB-to-serial kernel drivers.
  package-nerd-significance:
    - >
      Serial packages an unusually broad hardware-console toolkit into a native Mac
      application: terminal emulation, direct serial access, SSH, Telnet, raw TCP
      sockets, Bluetooth serial, file-transfer protocols, logging, and hex-oriented
      input and display. It is particularly useful when a network device is unreachable
      except through its console port.
  project-history:
    - >
      Decisive Tactics develops Serial as a proprietary macOS terminal application. The
      official release history identifies March 2020 as the initial Serial 2.0 release,
      which broadened the application with SSH, Telnet, hex view, and Bluetooth Smart
      support.
    - >
      Subsequent releases added native Apple Silicon support, extended compatibility
      with serial adapters, and regularly updated the bundled SSH and cryptographic
      libraries.
  related-projects:
    - OpenSSH
    - screen
    - minicom
    - PuTTY
  sources:
    - https://www.decisivetactics.com/products/serial/
    - https://www.decisivetactics.com/products/serial/release-notes
    - https://www.decisivetactics.com/support/view?article=ssh-supported-features
  summary:
    - >
      Serial is a macOS terminal emulator and connection utility from Decisive Tactics.
      It communicates with serial hardware directly and also supports SSH, Telnet, raw
      TCP sockets, Bluetooth serial, logging, and classic file-transfer protocols.
  timeline:
    - '2020: Serial 2.0 debuted with SSH, Telnet, hex view, and Bluetooth Smart support.'
    - '2020: Native Apple Silicon support was added.'
    - '2021: Support expanded for additional Prolific, Keyspan, and Bluetooth serial devices.'
  usage:
    - >
      Users connect a Mac to serial consoles and embedded devices without separately
      locating vendor drivers, or create reusable profiles for SSH, Telnet, and
      socket-based sessions. Common work includes network-appliance setup,
      recovery-console access, firmware transfer, raw protocol inspection, and session
      logging.
