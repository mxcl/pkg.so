history:
  adoption-history:
    - >
      Tap Forms expanded from iPhone to iPad, Mac, and Apple Watch. The developer says
      it was featured on the App Store front page, installed on Apple Retail Store
      demonstration phones, and visible in promotional material for the original iPad.
    - >
      Tap Forms 5 consolidated the iPhone and iPad editions into a universal iOS app and
      remained a perpetual-purchase product. It later entered maintenance mode as Tap
      Forms Pro became the actively developed successor.
  package-nerd-significance:
    - >
      Tap Forms occupies the space between spreadsheets and full relational-database
      development environments: users design forms and structured collections without
      building a conventional application.
    - >
      For package-manager users, the cask preserves access to the established Tap Forms
      5 Mac application even after the product line moved toward Tap Forms Pro. Its
      document-oriented workflow, scripting, imports, backups, and multiple
      synchronization options make it useful for personal inventories and bespoke record
      keeping.
  project-history:
    - >
      Developer Brendan Duddridge began Tap Forms in 2008 after finding that the early
      iPhone lacked a built-in way to store small pieces of structured information. The
      first edition reached the App Store on September 28, 2008.
    - >
      The product subsequently gained iPad, Mac, and Apple Watch editions. Tap Forms 5
      launched in August 2016 as a major paid upgrade with revised Mac and universal iOS
      editions.
    - >
      Tap Forms Pro was announced as the successor in 2025. The developer states that
      Tap Forms 5 remains usable on supported systems, while new feature development is
      concentrated in Tap Forms Pro.
  related-projects:
    - Tap Forms Pro is the subscription-based successor to Tap Forms 5.
    - >
      The official materials position Tap Forms as a flexible replacement for
      discontinued personal-database products such as Bento.
  sources:
    - https://www.tapforms.com/forums/topic/after-10-years-still-best-notes-app/
    - https://www.tapforms.com/forums/topic/announcing-tap-forms-version-5/
    - >
      https://www.tapforms.com/forums/topic/important-announcement-new-tap-forms-version-coming-soon/
    - https://www.tapforms.com/presskit/
    - https://www.tapforms.com/support/
  summary:
    - >
      Tap Forms 5 is the fifth major generation of Brendan Duddridge's customizable
      personal-database application for Apple platforms.
  timeline:
    - '2008: Development begins and the first Tap Forms edition reaches the App Store.'
    - '2016: Tap Forms 5 launches as a major paid upgrade.'
    - '2025: Tap Forms Pro is introduced as the actively developed successor.'
  usage:
    - >
      Users create databases for inventories, collections, contacts, schedules,
      journals, business records, and other structured personal information, then
      customize forms, fields, layouts, searches, and reports.
    - >
      Tap Forms documents can be backed up, imported, exported, and synchronized between
      Apple devices. Official support documentation should be consulted before moving
      live database documents through general-purpose file-sync services.
