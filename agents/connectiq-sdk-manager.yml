id: cask:connectiq-sdk-manager
display-name: Connect IQ SDK Manager
repo: null
docs:
  - https://developer.garmin.com/connect-iq/reference-guides
  - https://developer.garmin.com/connect-iq/reference-guides/visual-studio-code-extension
  - https://developer.garmin.com/connect-iq/sdk
config-file-location:
  linux:
    - ~/.Garmin/ConnectIQ/sdkmanager-config.ini
    - ~/.Garmin/ConnectIQ/current-sdk.cfg
  macos:
    - ~/Library/Application Support/Garmin/ConnectIQ/sdkmanager-config.ini
    - ~/Library/Application Support/Garmin/ConnectIQ/current-sdk.cfg
  windows:
    - '%APPDATA%\Garmin\ConnectIQ\sdkmanager-config.ini'
    - '%APPDATA%\Garmin\ConnectIQ\current-sdk.cfg'
credentials-file-location: null
history:
  adoption-history:
    - >
      Garmin announced Connect IQ in 2014 for an initial generation of wearable devices
      and said the platform would become available on selected products in 2015. By the
      System 7 announcement in 2023, Garmin reported expansion from four original
      devices to more than 100 products.
    - >
      The SDK Manager became the standard acquisition and selection tool for SDK
      releases and downloadable device definitions. Garmin's Visual Studio Code Monkey C
      extension also exposes an Open SDK Manager command as part of the supported
      development workflow.
  package-nerd-significance:
    - >
      The SDK Manager is the reproducibility hinge for Connect IQ development: it
      installs side-by-side SDKs and device definitions and records the active SDK used
      by editors and build tools.
    - >
      The Homebrew cask is useful because Garmin distributes the manager separately from
      the SDK payloads it controls. Developers still use the manager after installation
      to select an SDK and obtain device support.
  project-history:
    - >
      Garmin announced Connect IQ in September 2014 as an open application platform for
      its wearables, with an SDK focused on low-power devices, sensors, Bluetooth Low
      Energy, and ANT+. The platform subsequently expanded to smartwatches, cycling
      computers, and outdoor handhelds.
    - >
      Development initially centered on Garmin's Eclipse tooling. Garmin later
      established Visual Studio Code and its Monkey C extension as the primary
      documented workflow, with SDK Manager integrated into the extension for acquiring
      SDKs and device definitions.
  related-projects:
    - Monkey C is the programming language used for Connect IQ applications.
    - >
      The Garmin Monkey C Visual Studio Code extension provides editing, building,
      debugging, and SDK Manager integration.
    - >
      The Connect IQ Simulator and device definitions are installed and managed
      alongside SDK releases.
  sources:
    - https://developer.garmin.com/connect-iq/reference-guides/visual-studio-code-extension/
    - https://developer.garmin.com/connect-iq/sdk/
    - >
      https://forums.garmin.com/developer/connect-iq/b/news-announcements/posts/welcome-to-system-7
    - >
      https://www.garmin.com/en-US/newsroom/press-release/outdoor/2014-introducing-connect-iq-the-first-ever-open-platform-for-garmin-wearables/
  summary:
    - >
      Connect IQ SDK Manager is Garmin's cross-platform tool for downloading, selecting,
      and maintaining Connect IQ SDK releases and device definitions.
  timeline:
    - '2014: Garmin announced the Connect IQ platform and developer preview.'
    - '2015: Connect IQ became available on selected Garmin wearables.'
    - >
      2023: Garmin described Connect IQ as a nearly decade-old platform supporting more
      than 100 products.
    - >
      2026: Garmin's official setup flow continued to use SDK Manager alongside the
      Monkey C Visual Studio Code extension.
  usage:
    - >
      Install and launch SDK Manager, complete its first-run setup, download an SDK and
      the required device definitions, and mark the desired SDK as active.
    - >
      Garmin's Visual Studio Code extension can open SDK Manager directly. Projects are
      then built in Monkey C for selected device definitions and tested with the Connect
      IQ simulator or compatible hardware.
