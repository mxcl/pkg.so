history:
  adoption-history:
    - >
      Comet initially launched on July 9, 2025 for Perplexity Max subscribers, with
      invite-only access rolling out through a waitlist. Perplexity made the browser
      freely downloadable worldwide on October 2, 2025 after reporting that millions had
      joined the waitlist. It subsequently expanded across desktop and mobile platforms.
  package-nerd-significance:
    - >
      Comet is a prominent example of the post-2024 wave of AI-native browsers: a
      Chromium derivative that treats an assistant and agentic actions as primary
      browser features rather than extensions. Its Homebrew Cask makes the otherwise
      vendor-managed macOS application available through a familiar declarative
      installation workflow.
  project-history:
    - >
      Perplexity introduced Comet in July 2025 as a browser built around contextual
      questions and an assistant capable of conducting browsing sessions and actions.
      The product moved from subscriber and invite-only distribution to free general
      availability in October 2025, while adding background assistants and broader
      platform support.
  related-projects:
    - Chromium
    - Perplexity
    - Google Chrome
    - Chrome extensions
  sources:
    - https://www.perplexity.ai/changelog/what-we-shipped-october-3rd
    - https://www.perplexity.ai/comet
    - https://www.perplexity.ai/help-center/en/articles/11172798-getting-started-with-comet
    - https://www.perplexity.ai/hub/blog/introducing-comet
  summary:
    - >
      Comet is Perplexity's Chromium-based web browser, combining conventional browsing
      with Perplexity search, contextual page assistance, summarization, and agentic
      browser actions.
  timeline:
    - '2025-07-09: Launched for Perplexity Max subscribers with invite-only rollout planned'
    - '2025-10-02: Made freely available worldwide'
    - '2025-11: Android edition announced'
    - '2026: Official product page lists Mac, Windows, iOS, and Android availability'
  usage:
    - >
      Comet can be used as a conventional browser with bookmarks, translation, password
      management, and most Chrome extensions. Its integrated assistant can answer
      questions about open pages, summarize content, work across tabs, manage tabs
      through natural-language commands, and perform supported tasks such as drafting
      email or navigating sites.
