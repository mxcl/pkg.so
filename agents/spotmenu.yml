history:
  adoption-history:
    - >
      SpotMenu became a Homebrew cask and is distributed through GitHub Releases. The
      maintainer describes it as being used by thousands of people, while the repository
      has attracted a substantial macOS open-source audience.
  package-nerd-significance:
    - >
      SpotMenu is a compact example of a community-developed macOS cask: a native
      menu-bar application distributed as a notarized app bundle, updated through
      Sparkle, and also buildable from source with Xcode.
    - >
      Its integration with locally installed media players and optional Spotify Web API
      authorization illustrates the automation and permission boundaries common to macOS
      menu-bar utilities.
  project-history:
    - >
      SpotMenu was created as an open-source macOS menu-bar companion for Spotify and
      iTunes, later described as Spotify and Apple Music. Its current implementation
      uses Swift and SwiftUI and provides playback controls, global shortcuts, track
      information, and optional Spotify track liking.
  related-projects:
    - Spotify and Apple Music are the supported playback applications.
    - Sparkle supplies the application's automatic-update mechanism.
  sources:
    - https://github.com/kmikiy/SpotMenu
    - https://github.com/kmikiy/SpotMenu#readme
    - https://github.com/kmikiy/SpotMenu/releases
  summary:
    - >
      SpotMenu is an open-source macOS menu-bar utility that displays the active Spotify
      or Apple Music track and provides quick playback controls.
  timeline:
    - 'Early releases: SpotMenu provides Spotify and iTunes information in the macOS menu bar.'
    - >
      Current generation: The SwiftUI application supports Spotify and Apple Music,
      configurable controls, global shortcuts, and optional Spotify Web API integration.
  usage:
    - >
      Users launch SpotMenu alongside Spotify or Apple Music, left-click to show or hide
      its playback panel, right-click for its context menu and preferences, and hover
      over the panel for playback controls.
    - >
      Optional Spotify track liking requires a user-created Spotify developer
      application and client ID. The official README directs users to enter the client
      ID through Preferences but does not document a credentials file.
