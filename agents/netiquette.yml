history:
  adoption-history:
    - >
      Netiquette is distributed as a free, open-source Objective-See utility for macOS.
      Objective-See's security research has used it alongside ProcessMonitor and
      FileMonitor when examining potentially malicious applications, giving it a
      practical role in the macOS analysis toolkit.
  package-nerd-significance:
    - >
      Netiquette offers a focused, native alternative to general packet-analysis suites
      when the immediate question is which process owns a socket or connection. Its
      graphical interface, JSON export, and command-line mode make the same observations
      useful to interactive investigators and shell-oriented workflows.
  project-history:
    - >
      Objective-See created Netiquette as a lightweight macOS network monitor, crediting
      Jonathan Levin as inspiration. The application is open source under GPLv3 and is
      maintained in Objective-See's public repository.
    - >
      Later releases added Apple-silicon compatibility, improved connection enumeration,
      sortable columns, byte counters, name resolution, interface refinements, and
      localization.
  related-projects:
    - >
      Netiquette belongs to Objective-See's collection of free macOS security tools and
      is used alongside ProcessMonitor and FileMonitor during behavioral analysis.
    - >
      It complements lower-level tools such as tcpdump and full packet analyzers by
      organizing socket and connection information around the responsible process.
  sources:
    - https://github.com/objective-see/Netiquette#readme
    - https://github.com/objective-see/Netiquette/releases
    - https://objective-see.org/blog/blog_0x61.html
    - https://objective-see.org/products/netiquette.html
  summary:
    - >
      Netiquette is Objective-See's lightweight, open-source macOS network monitor for
      inspecting sockets and connections through a graphical interface or command line.
  timeline:
    - >
      2020: Objective-See research documented Netiquette as part of its open-source
      dynamic-analysis toolkit.
    - >
      Version 1.2.0: Apple-silicon compatibility and improved connection enumeration
      were added.
    - >
      Version 2.0.0: Sortable columns, byte counters, name resolution, and performance
      improvements were introduced.
    - 'Version 2.3.0: Localization support was introduced.'
  usage:
    - >
      Launching the application displays active sockets and connections grouped by the
      responsible process, with addresses, ports, protocol, interface, state, and byte
      counts. Users can filter the view, change refresh and display settings, and export
      results as JSON.
    - >
      The bundled executable also supports command-line enumeration, DNS name
      resolution, formatted JSON, and omission of Apple processes. Output can be
      redirected to a file for later analysis.
