id: brew:cgoban
display-name: CGoban 1
repo: https://sourceforge.net/p/cgoban1/git
docs:
  - https://cgoban1.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CGoban was distributed as source code using GNU autoconf and was made available
      through SourceForge. The 1.9.13 revision history records the move to SourceForge
      and patches submitted by other people.
  package-nerd-significance:
    - >
      CGoban is package-nerd relevant as an old-school X11 game/client utility: a
      source-built autoconf application, tied to Go servers and SGF, with a tiny
      binary-focused install story.
  project-history:
    - >
      The official README for cgoban 1.9.13 describes a Unix/X11 program that acts as a
      computerized Go board, SGF viewer/editor, internet Go server client, and Go modem
      protocol bridge.
  related-projects:
    - >
      The official homepage names NNGS, IGS, SGF, and Go modem protocol as related
      services or formats.
  sources:
    - https://sourceforge.net/p/cgoban1/git
    - https://cgoban1.sourceforge.net/
    - https://formulae.brew.sh/api/formula/cgoban.json
    - https://sourceforge.net/p/cgoban1/git/ci/master/tree/README?format=raw
  summary:
    - >
      CGoban 1, short for Complete Goban Mark 1, is an X11/Unix Go program for local
      play, SGF editing, internet Go server access, and Go modem protocol bridging.
  timeline:
    - '0.0.0: Alpha version.'
    - '0.1.0: First beta version.'
    - '1.0.0: First full release.'
    - '1.9.13: Moved to SourceForge and incorporated various patches.'
    - '2003: Official homepage address was dated 06 January 2003.'
  usage:
    - >
      CGoban users could play local Go games with rule sets and time controls, edit and
      view SGF files, connect to NNGS or IGS, and use arena mode for testing Go modem
      protocol programs.
related-packages:
  - id: brew:gnu-go
    reason: >
      GNU Go is a documented engine companion: CGoban 1 can launch it through the Go
      Modem Protocol and provide the graphical board while GNU Go chooses moves.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/s/gnugo/gnugo_3.html
      - https://cgoban1.sourceforge.net/
