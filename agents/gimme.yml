history:
  adoption-history:
    - >
      gimme became useful because Travis CI users needed repeatable Go versions before
      Go version managers and CI images covered every combination. Its README documents
      Homebrew and Arch AUR installation paths, placing it in the package-manager layer
      used by developers who wanted the same version-selection behavior outside Travis
      jobs.
  package-nerd-significance:
    - >
      For package maintainers, gimme is a compact example of a version manager that
      delegates policy to upstream Go release artifacts while caching local installs. It
      matters less as a broad ecosystem pillar than as a Travis-era tool that encoded Go
      matrix testing into one shell script.
  project-history:
    - >
      The public repository began in January 2015, and the README states that the
      original goal was trivial Go cross-compilation within Travis CI. Early releases
      added automatic Go version discovery, source and binary install paths, and shell
      environment output that lets users activate a selected Go installation with eval
      or by sourcing an env file.
    - >
      The project evolved around changes in the Go release process. The changelog
      records support for stable and oldstable aliases, checksums for downloaded
      archives, mirror support through GIMME_DOWNLOAD_BASE, Windows binary downloads,
      and repeated updates for newer Go release lines.
  related-projects:
    - >
      gimme overlaps with Go version managers and CI image management, but its README
      frames it specifically around Travis CI cross-compilation and upstream Go release
      downloads.
  sources:
    - https://github.com/travis-ci/gimme
    - https://github.com/travis-ci/gimme/blob/master/CHANGELOG.md
    - https://github.com/travis-ci/gimme/blob/master/README.md
  summary:
    - >
      gimme is a small shell utility from the Travis CI ecosystem for installing and
      selecting Go toolchain versions. Its niche is CI and developer-shell setup rather
      than general Go project management.
  timeline:
    - '2015: Repository and first tags appeared for the shell-based Go installer.'
    - >
      2016: 1.0.0 added Homebrew documentation, cross-compilation support, and broader
      platform handling.
    - '2017: stable alias and known-version listing were added.'
    - >
      2018: .x version resolution, oldstable support, and support for Go 1.11-era
      releases landed.
  usage:
    - >
      Practitioners use gimme by asking for a Go version, stable alias, oldstable alias,
      or master branch, then applying the emitted shell environment. In CI it is used
      with variables such as GIMME_GO_VERSION, GIMME_OS, and GIMME_ARCH to exercise
      builds across operating-system and architecture combinations.
related-packages:
  - id: brew:goenv
    reason: >
      Choose goenv when you want persistent global and per-project Go selection through
      shims and .go-version files; choose gimme for a small environment-emitting
      installer suited to CI matrices.
    rel: alternative
    sources:
      - https://github.com/travis-ci/gimme#readme
      - https://github.com/go-nv/goenv/blob/master/README.md
