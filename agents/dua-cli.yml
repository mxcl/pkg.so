id: brew:dua-cli
display-name: dua-cli
repo: null
docs:
  - https://github.com/Byron/dua-cli#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/dua-cli/config.toml
  macos:
    - ~/Library/Application Support/dua-cli/config.toml
  windows:
    - '%APPDATA%\dua-cli\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      dua-cli is widely packaged for a Rust CLI of its size: Homebrew, MacPorts, Fedora,
      Arch, Nix, NetBSD/pkgsrc, Scoop, WinGet, Void Linux, Cargo, and binary release
      installers are all documented upstream. Crates.io metadata shows more than two
      hundred thousand total downloads, while Homebrew analytics show steady formula
      installs.
  package-nerd-significance:
    - >
      dua-cli is significant as part of the Rust replacement-tool lineage: a faster,
      friendlier take on classic Unix disk-usage workflows, packaged as a single CLI
      across many operating systems. It is also a useful comparison point against `du`,
      `ncdu`, `dust`, `gdu`, and graphical disk analyzers.
  project-history:
    - >
      The public GitHub repository was created in 2019, and crates.io records the crate
      shortly after. The README explains the name as 'Disk Usage Analyzer' and
      emphasizes parallel scanning that can saturate SSDs, plus an interactive mode
      designed with multi-stage deletion safeguards.
    - >
      The project builds on Rust ecosystem libraries such as `jwalk` for parallel
      filesystem walking and `petgraph` for interactive graph handling. Its README also
      documents the removal of older terminal backend complexity in favor of crossterm.
  related-projects:
    - >
      The README lists `du`, `dust`, `dutree`, `pdu`, `ncdu`, `gdu`, `godu`, GNOME Disk
      Usage Analyzer, and KDE Filelight as similar programs. It also acknowledges
      `jwalk` as a core reason the CLI could focus on user-facing behavior.
  sources:
    - https://github.com/Byron/dua-cli
    - https://github.com/Byron/dua-cli#readme
    - https://crates.io/api/v1/crates/dua-cli
    - https://formulae.brew.sh/api/formula/dua-cli.json
  summary:
    - >
      dua-cli is a Rust disk-usage analyzer whose installed command is `dua`. It
      combines fast parallel directory scanning with an optional interactive terminal UI
      for exploring and deleting disk usage.
  timeline:
    - '2019: Public Byron/dua-cli GitHub repository created.'
    - '2019: Crates.io records the `dua-cli` crate.'
    - >
      2020s: Upstream README documents installation through Homebrew, MacPorts, Cargo,
      Linux package managers, Scoop, WinGet, Nix, and binary releases.
  usage:
    - >
      Basic usage mirrors `du`: run `dua`, `dua *`, or `dua aggregate` to inspect
      directory sizes. The `dua interactive` or `dua i` mode opens a terminal browser
      for navigating large trees and deleting unwanted data with confirmation steps. The
      optional config file controls interactive behavior such as Escape-key navigation.
related-packages:
  - id: brew:ncdu
    reason: >
      Choose ncdu for a mature, lightweight ncurses-style browser suited to remote
      systems and export/import scans; choose dua when parallel traversal and broader
      cleanup and analysis commands are priorities.
    rel: alternative
    sources:
      - https://github.com/Byron/dua-cli#readme
      - https://dev.yorhel.nl/ncdu
  - id: brew:dust
    reason: >
      Choose Dust for a concise noninteractive tree of the largest files and
      directories, while dua is better when the same session must navigate, mark, trash,
      or delete entries interactively.
    rel: alternative
    sources:
      - https://github.com/Byron/dua-cli#readme
      - https://github.com/bootandy/dust#readme
  - id: brew:gdu
    reason: >
      Choose gdu for a focused interactive disk-usage browser optimized for SSD
      scanning; choose dua for combined aggregate, interactive, duplicate, snapshot, and
      flame-graph workflows.
    rel: alternative
    sources:
      - https://github.com/Byron/dua-cli#readme
      - https://github.com/dundee/gdu#readme
