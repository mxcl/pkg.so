history:
  adoption-history:
    - >
      GrandTotal is distributed as a proprietary macOS application in multiple editions.
      Its workflow supports document files stored in shared cloud folders, migration
      from older GrandTotal versions, and imports from several online invoicing
      services.
  package-nerd-significance:
    - >
      GrandTotal is notable as a long-lived Mac-native business application packaged
      through Homebrew Cask. Its document-oriented storage, customizable layouts,
      automation and plug-in hooks, and migration support distinguish it from
      browser-only invoicing services.
  project-history:
    - >
      GrandTotal is developed by Media Atelier as a native Mac application for producing
      estimates and invoices. Version 6 introduced a new document format, while current
      releases are in the GrandTotal 9 generation and add regulatory,
      document-recognition, integration, and automation capabilities.
  related-projects:
    - >
      Media Atelier also develops compatible Mac business applications and publishes
      JavaScript- and HTML-based extension interfaces for GrandTotal.
  sources:
    - https://www.mediaatelier.com/en/GrandTotal
    - https://www.mediaatelier.com/en/Help/
    - https://www.mediaatelier.com/en/Support/
  summary:
    - >
      GrandTotal is Media Atelier's proprietary macOS application for creating and
      managing estimates, invoices, customers, payments, and business documents.
  timeline:
    - >
      Version 6: Introduced a new GrandTotal document format and migration from versions
      5 and earlier.
    - >
      2026: GrandTotal 9 releases added document recognition, Peppol and regional tax
      integrations, and an MCP server in the XL edition.
  usage:
    - >
      Users create company profiles, customers, catalog items, estimates, and invoices,
      then customize document layouts and export or send finished documents. Shared
      .grandtotal files can be placed on supported cloud drives for collaboration.
    - >
      GrandTotal settings are primarily managed through its graphical preferences and
      document setup. Official documentation consulted here does not identify a single
      user-editable configuration file or credential file.
