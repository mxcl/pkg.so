history:
  adoption-history:
    - >
      Pulse SMS expanded the Android phone’s SMS/MMS experience to computers, tablets,
      browsers, and other devices. The official desktop client was distributed for
      macOS, Windows, and Linux.
    - >
      The maintained desktop repository serves as a release channel, while its README
      directs developers to a separate code repository.
  package-nerd-significance:
    - >
      Pulse SMS illustrates the Electron-era pattern of packaging a web-connected mobile
      companion as native-looking desktop clients across all major desktop operating
      systems.
    - >
      For package-manager users, the cask turns the project’s release-oriented desktop
      distribution into a conventional install while the Android phone remains the SMS
      endpoint.
  project-history:
    - >
      Pulse SMS began as an Android-centered SMS/MMS application designed to expose a
      user’s conversations across devices through a synchronized web platform.
    - >
      The desktop application was implemented with Electron for macOS, Windows, and
      Linux. Its official release repository was separated from the repository
      containing the client source code.
  related-projects:
    - >
      The Pulse SMS ecosystem includes its Android application, web platform, desktop
      clients, tablet client, and browser integrations.
  sources:
    - https://github.com/maplemedia/pulse-sms-desktop
    - https://home.pulsesms.app/overview/
    - https://home.pulsesms.app/overview/platform-android.html
  summary:
    - >
      Pulse SMS is a cross-device SMS/MMS service whose desktop application lets users
      access and reply to conversations handled through their Android phone.
  timeline:
    - >
      Cross-device expansion: Pulse SMS made Android SMS/MMS conversations available
      through desktop, tablet, web, and browser clients.
    - >
      Desktop packaging milestone: Official macOS, Windows, and Linux clients were
      delivered with Electron.
    - >
      Repository split: The official desktop release repository began directing
      developers to a separate source-code repository.
  usage:
    - >
      Users configure Pulse SMS on an Android phone and sign into the desktop client to
      read and reply to synchronized conversations from a computer.
    - >
      The wider service supports SMS/MMS media, scheduled messages, archived
      conversations, muted or blocked contacts, and per-conversation appearance
      customization.
