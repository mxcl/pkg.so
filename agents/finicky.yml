config-file-location:
  macos:
    - ~/.finicky.js
credentials-file-location: null
history:
  adoption-history:
    - >
      Finicky became a popular macOS utility for people who use several browsers or keep
      work and personal browsing contexts separate. Its declarative configuration fits
      naturally into dotfile-managed workstation setups.
    - >
      The official README documents installation through the `finicky` Homebrew cask as
      well as GitHub releases.
  package-nerd-significance:
    - >
      Finicky turns the operating system's default-browser decision into programmable
      configuration. Package and dotfile enthusiasts care because browser selection,
      profile choice, URL cleanup, and application-specific routing can be reviewed and
      reproduced as code.
  project-history:
    - >
      Finicky is an open-source macOS application maintained by John Sterling. Its
      established configuration model uses JavaScript rules to match or rewrite URLs and
      select browsers or other URL handlers.
    - >
      The actively documented v4 line expands the configuration model with TypeScript
      support, browser profiles, opener-aware matching, system information helpers, and
      migration guidance for v3 users.
  related-projects:
    - The README recommends Browserosaurus as a complementary graphical browser chooser.
    - >
      Finicky integrates with installed browsers and profiles rather than replacing
      their rendering engines.
  sources:
    - 'Official README: https://github.com/johnste/finicky'
    - >
      Official v4 configuration reference:
      https://github.com/johnste/finicky/wiki/Configuration-(v4)
    - 'Official wiki: https://github.com/johnste/finicky/wiki'
  summary:
    - >
      Finicky is an open-source macOS URL router. Set as the default browser, it
      evaluates JavaScript or TypeScript rules to decide which browser, profile, or
      application should open each URL and can rewrite URLs before dispatch.
  timeline:
    - 'Finicky 3: The project established its JavaScript-based routing configuration.'
    - >
      Finicky 4: The maintained configuration model added modern module syntax,
      TypeScript support, browser-profile routing, and migration documentation.
  usage:
    - >
      Create `~/.finicky.js`, define a default browser, and add match handlers for
      domains, URL patterns, regular expressions, functions, source applications, or
      browser profiles.
    - >
      Rewrite rules run before handler matching, enabling workflows such as forcing
      HTTPS or removing tracking parameters. Finicky is then selected as the macOS
      default browser.
