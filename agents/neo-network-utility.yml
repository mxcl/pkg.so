history:
  adoption-history:
    - >
      DEVONtechnologies distributes Neo Network Utility as freeware for macOS and
      explicitly encourages users to share it. Its audience is Mac users who want common
      Unix network diagnostics without working directly in Terminal.
    - >
      The application is available as the Homebrew cask recorded in
      source_facts.package-manager, giving command-line package users an installation
      route despite the application itself being graphical.
  package-nerd-significance:
    - >
      The utility packages familiar networking concepts—adapter details, reachability
      tests, routing, speed checks, and DNS information—into a Mac-native interface. It
      is useful when the underlying Unix commands are known but a compact GUI is more
      convenient.
    - >
      Its name deliberately recalls Apple's legacy Network Utility, though
      DEVONtechnologies states that the products are otherwise unrelated.
  project-history:
    - >
      DEVONtechnologies first released Neo Network Utility in July 2024 as a freeware
      graphical front end for basic network information and diagnostics.
    - >
      Version 1.1 followed in August 2024 with IPv6 support, optional display of
      underlying shell commands, easier output copying, hidden-adapter controls, and
      reliability improvements.
    - >
      Version 2.0 arrived in 2025 with a refreshed interface, multiple windows,
      concurrent tool use, keyboard navigation, link-status indicators, SSID and BSSID
      display, and RDAP-based registration lookups.
  related-projects:
    - >
      Apple's discontinued Network Utility, which inspired the product's positioning but
      is not the same application
    - Unix network-diagnostic commands exposed through the graphical interface
  sources:
    - https://www.devontechnologies.com/apps/freeware
    - https://www.devontechnologies.com/blog/20240826-network-utility-11
    - https://www.devontechnologies.com/download
    - source_facts.package-manager
  summary:
    - >
      Neo Network Utility is a free macOS application from DEVONtechnologies that
      presents network-interface information and common diagnostic operations through a
      native graphical interface.
  timeline:
    - 'July 2024: Initial freeware release'
    - 'August 2024: Version 1.1 added IPv6 and command-display features'
    - '2025: Version 2.0 added multi-window operation and a redesigned interface'
  usage:
    - >
      Use it to inspect network adapters, test whether hosts are reachable, trace packet
      routes, check network speed, and retrieve DNS or registration information.
    - >
      The application is aimed at interactive troubleshooting. Version 1.1 can reveal
      the underlying shell commands and copy their output, which is useful when
      translating a GUI diagnosis into terminal-based work.
