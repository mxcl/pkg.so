history:
  project-history:
    - >
      The result became a player with a small default interface but a large technical
      surface. The README describes support for many media formats, audio and video
      codecs, and subtitle types. The stable manual documents keyboard-driven playback,
      GPU video output, configuration files, profiles, input commands, IPC, embedding
      through libmpv, and extension points through Lua, JavaScript, and C plugins. Lua
      scripting is a major part of the ecosystem: the Lua manual says scripts can call
      into the mpv core, retrieve playback state and user settings, and use the client
      API internally.
  sources:
    - https://github.com/mpv-player/mpv
    - https://github.com/mpv-player/mpv/blob/master/DOCS/client-api-changes.rst
    - https://github.com/mpv-player/mpv/blob/master/DOCS/man/lua.rst
    - https://github.com/mpv-player/mpv/wiki/FAQ
    - https://mpv.io/manual/stable/
  summary:
    - >
      mpv is a free command-line media player descended from MPlayer and mplayer2. The
      mpv FAQ says the relationship with MPlayer is mostly historic: mplayer2 forked
      away from MPlayer, and in 2012 a group of newer mplayer2 developers forked
      mplayer2 again, later naming the second fork mpv. The reason given by the project
      was disagreement over direction: MPlayer emphasized maintenance and old
      compatibility, while mpv prioritized modernization, code removal, rewrites, bug
      reduction, and replacing MPlayer-specific mechanisms with FFmpeg mechanisms.
  usage:
    - >
      A major milestone was the LGPL relicensing effort opened in 2015, motivated by
      turning the player core into libmpv and reducing GPL friction for applications
      that embed video playback in-process. That discussion also documents how much
      obsolete MPlayer-era code mpv had already removed, including mencoder, the old
      GUI, old kernel drivers, decoder wrappers, win32 codec loading, ancient video
      outputs, filters, and build-system pieces. In package-manager terms, mpv occupies
      the power-user media-player slot: a scriptable CLI player used directly from
      terminals, file managers, frontends, media-center tools, and other applications
      through libmpv.
related-packages:
  - id: brew:yt-dlp
    reason: >
      Install yt-dlp alongside mpv to let mpv's documented ytdl hook resolve and play
      URLs from supported online media sites.
    rel: adjacent_workflow
    sources:
      - https://mpv.io/manual/stable/#options-ytdl
      - https://github.com/yt-dlp/yt-dlp#embedding-yt-dlp
