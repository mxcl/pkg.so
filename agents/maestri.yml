    - https://www.themaestri.app/en/docs/terminals
    - https://www.themaestri.app/en/docs/workspaces
    - source_facts.version
  summary:
    - >
      Maestri is a native macOS canvas for arranging and coordinating terminals, coding
      agents, notes, files, sketches, and browser portals within project workspaces.
  timeline:
    - '2026: Homebrew input identifies Maestri 0.41.0 as the packaged release.'
    - 'Current: Official documentation describes Maestri as macOS-only.'
  usage:
    - >
      A typical session opens a project workspace, places one or more agent terminals on
      the canvas, connects them to notes or each other, and monitors parallel work
      spatially. Users can assign roles, create isolated floors, compose prompts, and
      schedule recurring agent routines.
