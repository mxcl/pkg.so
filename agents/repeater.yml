config-file-location:
  macos:
    - ~/Library/Application Support/repeater/auth.json
credentials-file-location:
  macos:
    - ~/Library/Application Support/repeater/auth.json
history:
  adoption-history:
    - >
      Distributed through Homebrew, npm, platform-specific binaries, and installation
      scripts. The project is aimed at terminal users who prefer Markdown files over a
      separate graphical flashcard collection.
  package-nerd-significance:
    - >
      Repeater combines plain-text, version-control-friendly study material with SQLite
      progress tracking and FSRS scheduling, making spaced repetition fit naturally into
      terminal and Markdown workflows.
  project-history:
    - >
      Shaan Khosla developed Repeater as a lightweight, text-first alternative to
      applications such as Anki. Its public releases began in January 2026 and continued
      rapidly through the first half of that year.
  related-projects:
    - >
      Anki is the principal comparison made by the project; Repeater can import Anki
      .apkg decks while retaining Markdown as its source of truth.
    - FSRS supplies the scheduling model used for reviews.
  sources:
    - 'Official README: https://github.com/shaankhosla/repeater#readme'
    - 'Official documentation: https://shaankhosla.github.io/repeater/'
    - 'Official releases: https://github.com/shaankhosla/repeater/releases'
  summary:
    - >
      Repeater is a command-line flashcard application whose decks are ordinary Markdown
      notes. It detects question-and-answer and cloze cards, records review progress in
      SQLite, and schedules reviews with FSRS.
  timeline:
    - '2026-01-19: Version 0.1.1 was released.'
    - '2026-05-07: Version 0.1.10 was released.'
  usage:
    - >
      Users write cards alongside ordinary notes in Markdown, index them, and begin
      review sessions with `repeater drill`. Optional features include Anki import,
      media links, Apple Notes integration on macOS, and an LLM-assisted card-writing
      workflow.
