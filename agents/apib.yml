config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README explicitly documents Homebrew installation for macOS and source builds
      for other platforms. The build documentation explains both Bazel and CMake paths,
      noting that the CMake build was used for Homebrew and potentially other
      repositories.
  package-nerd-significance:
    - >
      apib sits in the lineage of tiny HTTP load-test binaries that are easy to install,
      script, and throw into CI or release checks. Package nerds care because it is both
      familiar, thanks to its ApacheBench-like shape, and different enough to preserve:
      HTTP/1.1 focus, OAuth signing, CSV automation, and remote monitoring made it
      useful for API-centric benchmarking.
  project-history:
    - >
      The public repository was created in 2013 under Apigee. The README describes the
      tool as stable, available on Linux, Mac OS X, and FreeBSD, and positioned as a
      simple performance-testing utility for HTTP API servers.
    - >
      The repository is now archived on GitHub, so its package-manager value is mostly
      historical and operational rather than fast-moving. GitHub releases list apib 1.2
      and 1.2.1 release candidates in 2020, while the README identifies 1.2.1 as the
      current version.
  related-projects:
    - >
      apib is directly compared with ApacheBench in its own documentation. It is also
      adjacent to HTTP load generators, API performance smoke tests, libev-based
      clients, and Apigee API operational tooling.
  sources:
    - https://api.github.com/repos/apigee/apib
    - https://github.com/apigee/apib#readme
    - https://github.com/apigee/apib/blob/master/doc/BUILDING.md
    - https://github.com/apigee/apib/blob/master/doc/REMOTE-MONITORING.md
    - https://github.com/apigee/apib/blob/master/doc/RUNNING.md
  summary:
    - >
      apib, short for API Bench, is an Apigee-origin HTTP API benchmarking tool. It was
      designed as a modernized ApacheBench-like utility for testing HTTP/1.1 APIs with
      concurrency, keep-alive behavior, CSV output, OAuth 1.0 signing, and optional
      remote resource monitoring.
  timeline:
    - '2013: Public apigee/apib repository created.'
    - '2020: GitHub releases published apib 1.2 and 1.2.1 release candidate.'
    - '2024: Repository metadata shows the project archived on GitHub.'
  usage:
    - >
      A simple run looks like apib -c 100 -d 60 URL, which sends load for a time-bounded
      interval using a configured number of concurrent connections. The running guide
      emphasizes time-scheduled tests, warmup periods, HTTP verbs, request bodies,
      headers, HTTP Basic authentication, OAuth 1.0 signatures, and CSV output for
      automated test scripts.
    - >
      apibmon is the companion remote-monitoring process. The official docs show apib
      using -M host:port to collect CPU and memory statistics from a target host running
      apibmon, with /proc-based resource collection on Linux-like systems.
related-packages:
  - id: brew:hey
    reason: >
      Choose hey for a maintained, small ApacheBench-style HTTP load generator with a
      similarly direct command-line workflow and HTTP/2 support; apib additionally
      provides its own remote resource monitor.
    rel: alternative
    sources:
      - https://github.com/apigee/apib#readme
      - https://github.com/rakyll/hey#readme
  - id: brew:vegeta
    reason: >
      Choose Vegeta when a constant request rate and reusable attack-result pipelines
      are more important than apib's duration-and-concurrency model or `apibmon`
      integration.
    rel: alternative
    sources:
      - https://github.com/apigee/apib/blob/master/doc/RUNNING.md
      - https://github.com/tsenart/vegeta#readme
  - id: brew:k6
    reason: >
      Choose Grafana k6 for JavaScript or TypeScript scenarios, thresholds, lifecycle
      hooks, browser testing, and observability integrations; apib is better suited to
      compact single-endpoint command-line benchmarks.
    rel: alternative
    sources:
      - https://github.com/apigee/apib#readme
      - https://grafana.com/docs/k6/latest/
