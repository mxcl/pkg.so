credentials-file-location:
  unix:
    - ~/.netrc
history:
  adoption-history:
    - >
      DAP2 was approved as a NASA Earth Science Data Systems standard in 2005, and
      OPeNDAP describes later adoption across servers, web applications, MATLAB, Ferret,
      PyFerret, PyDAP, and other scientific-data tools. OPeNDAP's releases page also
      notes libdap's use by the Hyrax server and inclusion in Linux distributions such
      as EPEL.
    - >
      The library matters most in earth-science and distributed-data stacks where
      HTTP-accessible array datasets need subsetting without downloading full files. It
      is part of the infrastructure lineage that also intersects with Hyrax, BES, OLFS,
      netCDF-oriented workflows, PyDAP, and DAP4 documentation.
  package-nerd-significance:
    - >
      libdap is a classic scientific Unix library package: protocol implementation, C++
      ABI concerns, autotools/CMake build history, command-line probes, and downstream
      distribution packaging all meet in one formula. It is significant less for UI
      visibility than for enabling remote scientific data access across many consumers.
  project-history:
    - >
      OPeNDAP grew out of the Distributed Oceanographic Data System work in the
      ocean-science community, with OPeNDAP Inc. formed in 2000 to maintain and evolve
      the protocol and software. The library history reflects that migration from older
      DODS/libdap++ organization into a standalone libdap module and then the libdap4
      repository for DAP2 and DAP4 support.
    - >
      The 2005 libdap 3.5.0 beta release notes describe the old DODS CVS module being
      split into a new libdap module, new install paths, renamed utilities getdap and
      dap-config, and early DDX work aimed at later DAP protocol evolution. Later
      libdap4 release notes record C++11 migration, DAP4 API work, large-array handling,
      direct I/O support, and the getdap4 command-line client.
  related-projects:
    - >
      Hyrax, BES, and OLFS are closely related OPeNDAP server-side projects. PyDAP,
      Ferret, PyFerret, MATLAB OPeNDAP support, netCDF-oriented clients, and DAP2/DAP4
      specifications are adjacent parts of the same scientific-data ecosystem.
  sources:
    - https://github.com/OPENDAP/libdap4
    - https://opendap.github.io/libdap4/html/
    - https://raw.githubusercontent.com/OPENDAP/libdap4/master/NEWS
    - https://raw.githubusercontent.com/OPENDAP/libdap4/master/README.md
    - https://www.opendap.org/about/history/
    - https://www.opendap.org/software/releases/
  summary:
    - >
      libdap is OPeNDAP's C++ implementation of the Data Access Protocol family,
      carrying the DAP2 heritage forward while adding DAP4 support. In package-manager
      terms it is the client and server library substrate behind tools such as getdap
      and getdap4 rather than an end-user science application by itself.
  timeline:
    - '2000: OPeNDAP Inc. was formed to maintain and evolve the DODS data-access protocol.'
    - '2005: DAP2 was approved as a NASA Earth Science Data Systems standard.'
    - >
      2005: libdap 3.5.0 beta split the old DODS CVS layout into a standalone libdap
      module and renamed utilities such as getdap and dap-config.
    - '2014: OPeNDAP history describes DAP4 release work under the OPULS program.'
    - '2022: libdap 3.20.x releases continued DAP4 API, RHEL, C++11, and Hyrax support work.'
    - '2025: libdap4 API documentation was generated for version 3.21.1.'
  usage:
    - >
      Package users usually encounter libdap through linked scientific applications,
      server components, dap-config, or the getdap/getdap4 command-line clients. Its
      ~/.dodsrc configuration and ~/.netrc credential support are package-nerd clues
      that the library also participates in authenticated remote data access workflows.
related-packages:
