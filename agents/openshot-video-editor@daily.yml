id: cask:openshot-video-editor@daily
display-name: OpenShot Video Editor (Daily Build)
repo: null
docs:
  - https://www.openshot.org/static/files/user-guide
config-file-location:
  unix:
    - ~/.openshot_qt/openshot.settings
  windows:
    - C:\Users\USERNAME\.openshot_qt\openshot.settings
credentials-file-location: null
history:
  adoption-history:
    - >
      OpenShot began as a Linux-focused editor and expanded to Linux, macOS, and
      Windows. The project states that it has been downloaded millions of times; the
      daily-build cask serves users who want development snapshots instead of stable
      releases.
  package-nerd-significance:
    - >
      OpenShot is a long-running desktop open-source video editor whose stack combines a
      Python/PyQt interface, the C++ libopenshot backend, FFmpeg, and optional Blender
      integration. The @daily cask is particularly useful to testers and contributors
      tracking unreleased changes.
  project-history:
    - >
      Jonathan Thomas created OpenShot in August 2008 after finding that available Linux
      video editors did not meet his goals of being easy to use, powerful, and stable.
    - >
      OpenShot Studios, LLC was incorporated in 2012 to hold and protect the project's
      copyright and trademark assets. The application subsequently matured into a
      cross-platform editor for Linux, macOS, and Windows.
  related-projects:
    - libopenshot
    - FFmpeg
    - Blender
    - MLT
  sources:
    - 'Official About page: https://www.openshot.org/about/'
    - 'Official story: https://www.openshot.org/story/'
    - 'Official user guide: https://www.openshot.org/static/files/user-guide/'
    - source_facts.repo
  summary:
    - >
      OpenShot Video Editor is a free, open-source, cross-platform nonlinear video
      editor. This cask follows its daily development builds.
  timeline:
    - '2008: Jonathan Thomas created OpenShot as a Linux video-editor project.'
    - '2012: OpenShot Studios, LLC was incorporated.'
    - 'Later: OpenShot expanded from Linux to macOS and Windows.'
  usage:
    - >
      OpenShot is used to arrange clips on a timeline, trim and composite media, add
      titles, effects, transitions, and animation, and export finished video. Daily
      builds are best suited to testing recent fixes and features and may be less stable
      than normal releases.
tags:
  - cross-platform
  - daily-build
  - nonlinear-editing
  - open-source
  - video-editor
provenance:
  category-sources:
    - >
      Official About page describes OpenShot as a free, open-source video editor:
      https://www.openshot.org/about/
    - source_facts.description identifies a cross-platform video editor.
  display-name-sources:
    - >
      The cask token includes @daily, while the official product name is OpenShot Video
      Editor.
    - current_curation.display-name
  docs-sources:
    - >
      Official OpenShot HTML user guide, including preferences, editing, effects,
      export, and troubleshooting documentation.
  history-sources:
    - 'Official About page: https://www.openshot.org/about/'
    - 'Official story: https://www.openshot.org/story/'
    - 'Official user guide: https://www.openshot.org/static/files/user-guide/'
    - source_facts.repo
  repo-sources:
    - >
      source_facts.repo already supplies https://github.com/OpenShot/openshot-qt; repo
      is intentionally null as required.
  tags-sources:
    - Official About page describes the product and supported platforms.
    - The package identifier explicitly denotes a daily build.
category-confidence: high
category-path:
