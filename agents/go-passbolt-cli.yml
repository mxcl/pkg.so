history:
  adoption-history:
    - >
      The tool serves Passbolt users who need scriptable access to resources, folders,
      users, and groups without using the browser extension. Its README documents
      Homebrew tap installation, release binaries, Go installation, community packages,
      and Repology as a package index.
  package-nerd-significance:
    - >
      For package users, go-passbolt-cli is important because secret-management CLIs
      need predictable packaging, man pages, shell completion, and noninteractive modes;
      those are the pieces that let teams integrate a password manager into scripts
      while keeping human workflows auditable.
  project-history:
    - >
      The Go library and CLI appeared publicly in 2021, with a Passbolt community
      announcement describing go-passbolt and go-passbolt-cli as ready for public use
      after cleanup work. The CLI repository later moved under the passbolt organization
      while retaining a community-driven disclaimer in its README.
  related-projects:
    - >
      go-passbolt is the Go module used for programmatic Passbolt integration. Passbolt
      provides the password-manager server, API, and team collaboration model that the
      CLI automates.
  sources:
    - https://api.github.com/repos/passbolt/go-passbolt-cli
    - >
      https://community.passbolt.com/t/announcing-go-passbolt-and-go-passbolt-cli-a-go-library-and-a-cli-tool-to-interact-with-passbolt/4231
    - https://github.com/passbolt/go-passbolt
    - https://github.com/passbolt/go-passbolt-cli
    - https://github.com/passbolt/go-passbolt-cli/releases/tag/v0.5.0
    - https://www.passbolt.com/docs
  summary:
    - >
      go-passbolt-cli is a command-line client for Passbolt, the open-source password
      manager for teams.
  timeline:
    - >
      2021: go-passbolt and go-passbolt-cli announced for public use in the Passbolt
      community.
    - '2021: Public GitHub repository created.'
    - '2025: v0.4.0 release series published.'
    - >
      2026: v0.5.0 release added schema-driven resource type support and Passbolt v5
      encrypted-metadata support through the SDK.
  usage:
    - >
      Practitioners configure the server address, private key, and password or
      passphrase, then create, list, get, update, delete, or share Passbolt resources.
      The CLI also supports TOTP MFA modes, server verification, JSON output for
      scripts, and an exec mode that resolves passbolt:// secret references into
      child-process environment variables.
