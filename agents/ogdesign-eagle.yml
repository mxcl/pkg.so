history:
  adoption-history:
    - >
      Eagle reported more than 100,000 users during 2019–2020 and more than 200,000
      during 2021. Its current official site presents the application as serving a broad
      community of creative professionals.
    - >
      Adoption grew beyond image reference collection as Eagle added font, audio, video,
      bookmark, browser-extension, API, and plugin workflows on macOS and Windows.
  package-nerd-significance:
    - >
      Eagle is notable to desktop-software enthusiasts as a local-first digital asset
      manager whose libraries remain on user-controlled storage instead of being locked
      into a mandatory hosted catalog.
    - >
      Its browser extension, broad format support, Web API, plugin system, and ability
      to place libraries on compatible synchronized storage make it a flexible hub for
      personal creative archives.
  project-history:
    - >
      Eagle began as an idea for reducing repetitive asset-management work by designers
      and released version 1.0 in 2017. Early development added Windows support, browser
      extensions, automatic tagging, color tools, annotations, and integrations for
      importing online inspiration.
    - >
      Eagle 2.0 and its API arrived in 2021, followed by Eagle 3.0 and the Eagle
      Community in 2022. Eagle 4 introduced a plugin system, redesigned interface, and
      AI-oriented tools. The Eagle team has since described version 5 as a deeper
      architectural rebuild while continuing to maintain version 4.
  related-projects:
    - >
      Eagle's official browser extensions capture images, screenshots, and other web
      assets into a library.
    - >
      The Eagle Plugin API and Web API allow JavaScript plugins and external automation
      to interact with items, folders, tags, and libraries.
  sources:
    - https://developer.eagle.cool/plugin-api
    - https://eagle.cool/
    - https://eagle.cool/blog/post/eagle-v5-development-update
    - https://eagle.cool/support
    - https://en.eagle.cool/blog/post/eagle-milestone
    - https://www.eagle.cool/blog/post/eagle4
  summary:
    - >
      Eagle is a local digital asset manager for collecting, organizing, searching, and
      previewing design references and other creative files on macOS and Windows.
  timeline:
    - '2017: Eagle 1.0 was released.'
    - >
      2019–2020: Eagle added major format and browser support and reported more than
      100,000 users.
    - '2021: Eagle 2.0 and the Eagle API were released.'
    - '2022: Eagle 3.0 and Eagle Community were released.'
    - '2024: Eagle 4 introduced its plugin system and redesigned interface.'
    - '2026: The Eagle team publicly described the ongoing version 5 architectural rebuild.'
  usage:
    - >
      Create an Eagle library on user-controlled storage, then collect assets through
      drag and drop, clipboard capture, screenshots, imports, or the browser extension.
      Organize them with folders, tags, ratings, notes, and smart folders.
    - >
      Use Eagle to search and preview images, video, audio, fonts, bookmarks, and other
      creative material. Advanced workflows can use plugins or the local Web API;
      libraries may also be placed in storage managed by compatible synchronization
      tools.
