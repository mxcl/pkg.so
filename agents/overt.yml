history:
  adoption-history:
    - >
      The macOS edition uses Homebrew as its package-management backend and exposes both
      casks and formulae through a graphical catalog. Overt also designed its catalog
      model to support third-party sources and contemplated backends such as Winget and
      Scoop for other platforms.
  package-nerd-significance:
    - >
      Overt turns package-manager repositories into an app-store-style interface without
      imposing a central payment system or a closed catalog. It is notable to package
      enthusiasts as an attempt to expose Homebrew casks and formulae to people who
      would not ordinarily use a command-line package manager.
  project-history:
    - >
      Overt began under the name OpenStore as an open alternative to a
      platform-controlled app store. It was designed around existing package managers
      and their repositories rather than a proprietary distribution backend.
    - >
      The project developed into an open-source Electron desktop application. Its macOS
      implementation integrates with Homebrew to discover, install, update, and
      uninstall graphical applications and command-line packages, while allowing users
      to add external catalogs.
  related-projects:
    - Homebrew is the package-management backend documented for the macOS edition.
    - Winget and Scoop were considered as prospective Windows backends.
    - >
      Cakebrew is a related Homebrew GUI; Overt distinguishes itself through cask
      support, external catalogs, and a less technical app-store-style interface.
  sources:
    - https://getovert.app/about/
    - https://getovert.app/install/
    - https://getovert.app/package-managers/homebrew/
    - https://github.com/GetOvert/Overt#readme
  summary:
    - >
      Overt is an open-source app-store-style graphical client that delegates software
      installation and maintenance to established package managers.
  timeline:
    - >
      Initial concept: The project was named OpenStore and framed as an open alternative
      to Apple's App Store.
    - 'macOS implementation: Overt adopted Homebrew as its package-management backend.'
    - >
      Open-source development: The Electron and TypeScript application was published in
      the GetOvert organization.
  usage:
    - >
      Users browse software supplied by default or external catalogs and perform
      one-click installation, update, and removal. On macOS, Overt delegates those
      operations to Homebrew and can expose both casks and formulae.
