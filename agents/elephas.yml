history:
  adoption-history:
    - >
      Elephas began with a Mac-native focus and grew to serve thousands of
      professionals, particularly knowledge workers who wanted AI assistance integrated
      into existing applications rather than confined to a browser chat.
    - >
      Its scope expanded from writing transformations to persistent personal knowledge
      workspaces, integrations with document and note sources, offline models, local
      indexing, and optional bring-your-own-provider operation.
  package-nerd-significance:
    - >
      Elephas is representative of the post-GPT-3 wave of native desktop AI utilities
      packaged as casks. It combines system-wide invocation with document retrieval and
      supports several execution models: bundled cloud AI, user-supplied provider keys,
      and local/offline models.
    - >
      For package-oriented Mac users, the application is notable for making AI workflows
      available across desktop applications while increasingly emphasizing local
      indexing and control over where inference runs.
  project-history:
    - >
      Liberation Softwares LLP founded Elephas in 2021 and launched it for Mac users as
      an AI writing assistant. The original idea was to make then-new language-model
      capabilities directly accessible across normal Mac applications.
    - >
      The product subsequently evolved into a broader personal knowledge assistant.
      Super Brain added document-grounded knowledge work, Super Command exposed features
      system-wide, and later releases added multiple AI providers, offline models, local
      embeddings, agents, integrations, and on-device sensitive-data redaction.
  related-projects:
    - Elephas Super Brain
    - Elephas Super Command
    - Ollama
    - OpenAI
    - Anthropic Claude
    - Google Gemini
  sources:
    - https://elephas.app/
    - https://elephas.app/about
    - https://elephas.app/blog/elephas-website-planet
    - https://elephas.app/support/
    - https://elephas.app/support/getting-started/release-notes/
  summary:
    - >
      Elephas is a Mac-native AI writing and personal knowledge assistant developed by
      Liberation Softwares LLP.
  timeline:
    - '2021: Elephas was founded and launched for Mac users.'
    - '2023: Release notes document the expanding Super Brain knowledge-assistant feature set.'
    - >
      2024: Super Command broadened system-wide access and Elephas added multiple
      providers and offline-model integrations.
    - >
      2025: Elephas added workflow agents, Notion and Apple Notes integrations, and
      built-in offline models.
    - >
      2026: Elephas introduced fully local indexing, offline agentic operation, and
      on-device sensitive-data redaction.
  usage:
    - >
      Users create knowledge workspaces from documents, notes, URLs, and supported
      integrations, then search, summarize, and ask questions grounded in those sources.
    - >
      Super Command provides rewriting, summarization, translation, drafting, and custom
      actions inside other Mac applications. Users can choose built-in cloud models,
      configure their own provider, or use supported local models for offline workflows.
