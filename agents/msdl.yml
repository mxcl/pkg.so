history:
  adoption-history:
    - >
      msdl's packaging niche is legacy streaming-media retrieval: it covers protocols
      and server behavior that general HTTP download tools historically did not handle
      well.
  package-nerd-significance:
    - >
      In package collections, msdl is less about modern video platforms and more about
      preserving access to old streaming protocols with a small C-era command-line tool.
  project-history:
    - >
      The official SourceForge-hosted site describes msdl as a downloader for mms:// and
      rtsp:// URLs, supporting MMS, MMSH, WMS-RTSP, Real-RTSP, FTP, and HTTP on Linux
      and BSD systems. The SourceForge file feed shows the public release series from
      0.9 in 2007 through 1.2.7-r2 in 2010.
  sources:
    - https://msdl.sourceforge.net/
    - https://msdl.sourceforge.net/msdlhelp.html
    - https://sourceforge.net/projects/msdl/rss?path=/msdl
    - source_facts.description
    - source_facts.homepage
  summary:
    - >
      msdl, short for Media Stream DownLoader, is an open-source command-line downloader
      for media stream URLs and older streaming protocols.
  timeline:
    - '2007: SourceForge file feed lists msdl 0.9 and 1.0 tarball releases.'
    - '2009: SourceForge file feed lists the 1.2.x series.'
    - '2010: SourceForge file feed lists msdl 1.2.7-r2.'
  usage:
    - >
      The official manual documents output-file selection, resume, retry, bandwidth and
      stream-speed controls, RTSP ranges, metafile handling, protocol selection, proxy
      behavior through HTTP_PROXY, and basic HTTP or FTP authentication passed as
      command-line options.
