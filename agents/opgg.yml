history:
  adoption-history:
    - >
      OP.GG expanded from a League of Legends statistics service into a global
      game-service platform covering multiple competitive games. Desktop extends the web
      service into the game session with automatic setup, overlays, live information,
      and personalized features.
  package-nerd-significance:
    - >
      OP.GG Desktop represents the class of companion applications that turn public
      match data and metagame statistics into actionable in-client tooling. It is
      particularly associated with automatic League of Legends rune, spell, and build
      recommendations, while also exposing tools for Teamfight Tactics and Valorant.
  project-history:
    - >
      OP.GG launched its service in beta in 2012 and subsequently expanded globally and
      beyond League of Legends. Its official company history records mobile,
      browser-extension, Overwolf, esports, and additional game-statistics initiatives.
    - >
      OP.GG for Desktop launched in October 2020. The application developed into an
      all-in-one companion offering match analysis, automatic build configuration,
      search, game-specific tools, and an optional in-game overlay.
  related-projects:
    - The main OP.GG web service supplies game records, rankings, and analysis.
    - >
      OP.GG mobile applications and the earlier Overwolf application provide related
      companion experiences.
    - >
      League of Legends, Teamfight Tactics, and Valorant are among the games covered by
      Desktop documentation.
  sources:
    - https://help.op.gg/hc/en-us/articles/48467238743961-Getting-Started-with-the-OP-GG-App
    - https://help.op.gg/hc/en-us/categories/26592881210009-OP-GG-for-Desktop
    - https://log.op.gg/company_en/
    - https://op.gg/desktop
  summary:
    - >
      OP.GG Desktop is a macOS and Windows game companion that brings OP.GG's
      competitive-game statistics, recommendations, and overlays into a desktop
      application.
  timeline:
    - '2012: OP.GG launched its service in beta.'
    - '2013: OP.GG began global service.'
    - '2020-10: OP.GG for Desktop launched.'
    - '2025: OP.GG published a consolidated getting-started guide for the desktop application.'
  usage:
    - >
      Users may run the application without signing in, but an OP.GG account enables
      personalized services. For League of Legends it can configure recommended spells
      and builds, while its overlay presents information such as opponent data, builds,
      and timers during play.
