id: cask:dcp-o-matic-player
display-name: DCP-o-matic Player
repo: https://git.carlh.net/cgit/dcpomatic
docs:
  - https://dcpomatic.com/manual/html
  - https://dcpomatic.com/manual/html/ch18.html
config-file-location:
  linux:
    - ~/.config/dcpomatic2/config.xml
  macos:
    - ~/Library/Preferences/com.dcpomatic/2/config.xml
  windows:
    - '%LOCALAPPDATA%\dcpomatic\config.xml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The official download surface distributes Player alongside the wider DCP-o-matic
      suite for macOS, Windows, AppImage, and numerous Linux distributions, reflecting
      use across desktop and cinema-workstation environments.
  package-nerd-significance:
    - >
      It is a notable open-source desktop package for the specialized Digital Cinema
      Package workflow. Its native installers, AppImage, and distribution packages make
      it relevant to multimedia package maintainers.
  project-history:
    - >
      DCP-o-matic is developed by Carl Hetherington as free software. Player is one
      member of a broader suite that also creates, verifies, combines, writes, and
      manages Digital Cinema Packages.
  related-projects:
    - >
      DCP-o-matic, Verifier, Playlist Editor, KDM Creator, Disk Writer, and the other
      applications maintained by the same project.
  sources:
    - https://dcpomatic.com/development
    - https://dcpomatic.com/download
    - https://dcpomatic.com/manual/html/
  summary:
    - >
      DCP-o-matic Player is the playback component of the DCP-o-matic digital-cinema
      suite, intended for opening, checking, and presenting DCP content.
  timeline:
    - 'Project era: DCP-o-matic was established as a free and open-source digital-cinema suite.'
    - >
      Current suite: Player is distributed as a distinct application within DCP-o-matic
      installers.
  usage:
    - >
      Users open a DCP from the File menu for checking playback. An advanced mode
      supports playlists and separate controls, with playlists authored in the companion
      Playlist Editor.
tags:
  - cinema
  - dcp
  - digital-cinema
  - media-player
  - playback
  - verification
provenance:
  category-sources:
