history:
  adoption-history:
    - >
      The creator reported that the public GitHub project reached 1,000 stars within six
      days and quickly began receiving issues and pull requests. This is a
      creator-supplied account rather than an independent adoption measurement.
    - >
      The project expanded from macOS to official builds for macOS, Windows, and
      multiple Linux package formats. Its README also records community-maintained
      distribution through Homebrew, AUR, Fedora's Terra repository, Scoop, and Solus.
  package-nerd-significance:
    - >
      NeoHtop translates the process-table culture of top and htop into a graphical,
      themed desktop application, pairing a Rust backend with a Svelte interface through
      Tauri.
    - >
      It is a characteristic modern package-manager project: official release binaries
      coexist with community-maintained Homebrew, AUR, RPM, Scoop, and Solus packages.
      The maintainers explicitly distinguish those packages from official GitHub
      releases.
  project-history:
    - >
      Abdenasser Elidrissi started NeoHtop in 2024 after using macOS Activity Monitor to
      investigate browser memory consumption and wanting a more attractive graphical
      tool reminiscent of htop. The project also served as a practical way to learn Rust
      and Tauri.
    - >
      The name combines the system-monitoring association of htop with an aesthetic nod
      to neofetch. Early development added themes, animation, process search, status
      filtering, and pagination before the project was published on GitHub.
    - >
      Subsequent releases added broader platform support, richer process details,
      process pinning, regular-expression search, persistent settings, and an interface
      inspired by the Mac Touch Bar. A separate NeoHtop CLI later brought a
      terminal-oriented implementation back to the project's command-line roots.
  related-projects:
    - htop, the terminal process monitor that motivated the project
    - neofetch, whose visual culture influenced the name
    - NeoHtop CLI, the related terminal implementation
  sources:
    - https://abdenasser.github.io/neohtop/
    - https://github.com/Abdenasser/neohtop#readme
    - https://github.com/Abdenasser/neohtop/releases
    - https://www.abdenasser.com/2024/11/06/oh-boy-neohtop/
  summary:
    - >
      NeoHtop is a free, open-source, cross-platform graphical system monitor built with
      Rust, Tauri, and Svelte. It presents live processes and resource consumption
      through a modern, themeable interface.
  timeline:
    - '2024: Abdenasser Elidrissi created and publicly released NeoHtop'
    - "November 2024: The creator documented the project's origin and rapid early adoption"
    - >
      Later releases: Expanded from macOS to Windows and Linux and added persistent
      configuration and advanced filtering
  usage:
    - >
      Monitor CPU and memory consumption, search processes by name, command, or PID,
      filter with multiple terms or regular expressions, pin important processes, sort
      columns, and terminate processes.
    - >
      Some operating-system processes require elevated privileges. The official README
      documents launching the macOS application with sudo or using pkexec on Linux when
      that access is needed.
    - >
      Package-manager builds are community-maintained; the project identifies GitHub
      Releases as the source of its official binaries.
