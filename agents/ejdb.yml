history:
  adoption-history:
    - >
      EJDB is a niche embedded-database package rather than a mainstream server
      database. The input package metadata lists Homebrew and Chocolatey coverage, and
      the README documents macOS, Linux, FreeBSD, Windows, iOS, and language binding
      support.
  package-nerd-significance:
    - >
      EJDB matters to package nerds as a compact example of the embedded JSON database
      niche: C library, CLI server, language bindings, and a single-file storage engine.
      It sits near SQLite culturally, but with a document/JQL model rather than SQL as
      the primary interface.
  project-history:
    - >
      The current upstream README identifies EJDB2 as an embeddable JSON database engine
      under the MIT license. It emphasizes a C11 API, single-file database storage,
      online backups, JQL, collection joins, IOWOW key/value storage, and IWNET-powered
      HTTP and WebSocket endpoints.
    - >
      The visible GitHub release stream for the v2 line starts with v2.0.40 in February
      2020 and continues through v2.73 in November 2022. Release notes show work on
      bindings, query behavior, Node.js compatibility, IOWOW/IWNET integration, and the
      `jbs` server CLI.
  related-projects:
    - IOWOW is the persistent key/value storage engine used by EJDB2.
    - IWNET powers the HTTP REST and WebSocket endpoint layer.
    - EJDB2Swift and other native bindings extend EJDB beyond the C API.
  sources:
    - https://ejdb.org
    - https://github.com/Softmotions/ejdb#readme
    - https://github.com/Softmotions/ejdb/releases
  summary:
    - >
      EJDB is Softmotions' embeddable JSON database engine, with the README focused on
      EJDB2, a C11 library built around a single-file database, JQL queries, native
      bindings, and optional HTTP/WebSocket endpoints.
  timeline:
    - '2020-02-17: v2.0.40 appears in the public GitHub release stream.'
    - '2020-12-17: v2.0.57 adds JSON operation and jbs changes.'
    - '2021-03-21: v2.0.59 changes the default jbs database filename to ejdb2.db.'
    - '2021-06-22: v2.61 moves to a compact versioning scheme.'
    - '2022-02-14: v2.70 moves network API support to IWNET.'
    - '2022-11-14: v2.73 is published with Node 18 and dependency updates.'
  usage:
    - >
      Developers embed EJDB2 in applications that want local JSON document storage
      without running a separate database server. The `jbs` executable can expose the
      database through HTTP and WebSocket APIs for experimentation or lightweight
      service use.
related-packages:
