id: brew:empty
display-name: empty
repo: https://sourceforge.net/p/empty/code
docs:
  - https://empty.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project page lists successful compilation and testing on a broad set of
      Unix-like systems, including BSDs, macOS, Linux, Solaris, AIX, HP-UX, OSF1, and
      Cygwin. That portability is the main adoption story rather than a large ecosystem.
  package-nerd-significance:
    - >
      The package is interesting because it keeps the old Unix promise small: PTY
      scripting from plain shell, entirely in C, with minimal dependencies. It is the
      sort of utility that survives in package managers because it solves one awkward
      automation job without dragging in a language stack.
  project-history:
    - >
      The official site says `empty` was written by Mikhail E. Zakharov, based on the
      idea of Daniel J. Bernstein's pty-4.0 but without porting pty-4.0 code. Its
      copyright notice spans 2005 to 2020.
  related-projects:
    - >
      The homepage compares `empty` directly with Tcl/Expect, Perl Expect, and Python
      Pexpect, and notes the conceptual link to pty-4.0.
  sources:
    - https://empty.sourceforge.net/
    - https://sourceforge.net/p/empty/code
  summary:
    - >
      `empty` is a lightweight Unix PTY automation tool meant to let shell scripts drive
      interactive programs without pulling in Tcl/Expect, Perl, Python, or a larger
      scripting runtime.
  usage:
    - >
      `empty` runs a process under a pseudo-terminal and then sends or waits for text
      through named input and output files. The homepage compares a short telnet login
      sequence against Tcl/Expect, Perl Expect, and Python Pexpect examples.
related-packages:
  - id: brew:expect
    reason: >
      Choose Expect when a full Tcl-based automation language and its mature scripting
      ecosystem are useful; choose `empty` for a smaller C utility driven directly from
      shell scripts.
    rel: alternative
    sources:
      - https://empty.sourceforge.net/
      - https://core.tcl-lang.org/expect/home
