id: brew:mon
display-name: mon
repo: null
docs:
  - https://github.com/tj/mon#readme
config-file-location:
  macos:
    - ~/.config/mole/whitelist
    - ~/.config/mole/purge_paths
credentials-file-location: null
history:
  project-history:
    - >
      The tool is used more like a tiny supervisor than a full metrics system. Its
      README shows one mon instance per process, shell scripts as configuration, PID
      files and log prefixes for multiple instances, and companion tools such as
      mongroup for managing groups of mon processes. Homebrew packages it as a
      lightweight system utility for monitoring hosts, services, or arbitrary commands
      and alerting about problems.
  sources:
    - https://formulae.brew.sh/formula/mon
    - https://github.com/tj/mon
  summary:
    - >
      mon is TJ Holowaychuk's small C process monitor, framed by its README as a
      reaction against heavier monitoring tools and their configuration languages. The
      project deliberately keeps the model simple: run a command, restart it on failure,
      optionally daemonize it, and call user-supplied scripts on restart or final error.
  usage:
    - >
      Because public sources for this particular mon package are sparse outside the
      upstream README and package metadata, its project history is best treated as a
      short package note rather than a detailed adoption narrative.
related-packages:
  - id: cask:appcleaner
    reason: >
      Choose AppCleaner for a focused graphical workflow that removes an application and
      its related files; Mole includes a broader terminal uninstaller plus cleanup,
      analysis, maintenance, and monitoring.
    rel: alternative
    sources:
      - https://github.com/tw93/Mole
      - https://freemacsoft.net/appcleaner/
  - id: cask:daisydisk
    reason: >
      Choose DaisyDisk for a polished graphical disk-space map and user-directed
      large-file removal; Mole provides its disk analysis as one part of a broader
      terminal maintenance suite.
    rel: alternative
    sources:
      - https://github.com/tw93/Mole
      - https://daisydiskapp.com/
