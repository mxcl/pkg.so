id: cask:freeplane
display-name: Freeplane
repo: https://github.com/freeplane/freeplane
docs:
  - https://docs.freeplane.org/
  - https://docs.freeplane.org/getting-started/Command-line_options_and_configuration.html
  - https://docs.freeplane.org/user-documentation/working-w-mindmap-files.html
config-file-location:
  unix:
    - ~/.freeplane/<version>/auto.properties
  windows:
    - '%APPDATA%/Freeplane/<version>/auto.properties'
credentials-file-location: null
history:
  adoption-history:
    - >
      Freeplane developed as a community-oriented continuation of FreeMind, retaining
      familiar mind-map workflows while pursuing more frequent releases and easier
      integration of contributions. Official project material records SourceForge
      Community Choice recognition in 2014 and 2016 and Staff Choice recognition in 2014
      and 2020.
    - >
      It is used for mind mapping, note taking, knowledge organization, task planning,
      presentations, and structured information analysis. Its Java base permits use on
      Linux, macOS, and Windows, while scripting and add-ons extend it beyond
      conventional diagramming.
  package-nerd-significance:
    - >
      Freeplane is notable to package users as a long-lived, cross-platform Java desktop
      application descended from FreeMind. It combines a stable `.mm` document ecosystem
      with Groovy scripting, add-ons, portable operation, command-line controls, and
      extensive import and export support.
  project-history:
    - >
      Freeplane was forked from FreeMind after disagreements about software
      architecture, release cadence, and community contribution practices. Founder and
      lead developer Dimitry Polivaev began the fork, whose code was substantially
      refactored toward a modular and extensible design.
    - >
      The project's documentation identifies the Freeplane 1.1 era with 2008–2010 and
      traces its inherited FreeMind lineage back to 2000. Subsequent releases expanded
      Freeplane into broader knowledge-management, automation, and extensibility use
      cases.
  related-projects:
    - FreeMind is Freeplane's ancestor and the project from which it was forked.
    - Docear integrated Freeplane for academic literature and knowledge-management workflows.
  sources:
    - >
      Official contributor history:
      https://docs.freeplane.org/attic/old-mediawiki-content/Contributors.html
    - 'Official documentation home: https://docs.freeplane.org/'
    - >
      Official relationship history:
      https://docs.freeplane.org/user-documentation/Relationship_to_FreeMind.html
  summary:
    - >
      Freeplane is a free, open-source mind-mapping and knowledge-management application
      descended from FreeMind and designed around a modular Java architecture.
  timeline:
    - '2008: The documented Freeplane 1.1 development era began.'
    - '2010: The documented Freeplane 1.2 development era began.'
    - '2014: Freeplane received SourceForge Community Choice and Staff Choice recognition.'
    - '2016: Freeplane again received SourceForge Community Choice recognition.'
    - '2020: Freeplane received SourceForge Staff Choice recognition.'
  usage:
    - >
      Users create `.mm` mind maps containing hierarchical text, notes, attributes,
      links, images, formulas, tasks, and reminders. Maps can be filtered, folded,
      styled, scripted, password-protected, and exported to formats including HTML, PDF,
      SVG, Markdown, OPML, office formats, and LaTeX-related outputs.
