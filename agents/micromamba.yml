history:
  project-history:
    - >
      micromamba packages the same codebase with different build choices: the official
      documentation describes it as a tiny, statically linked C++ executable with its
      own CLI, no required `base` environment, and no bundled Python. The Mamba README
      positions it for CI/CD pipelines, Docker images, bootstrapping, and other places
      where a single self-contained executable is easier than installing Miniforge or a
      full conda stack.
  sources:
    - >
      https://chanzuckerberg.com/eoss/proposals/fast-software-package-management-for-bio-and-data-science/
    - https://formulae.brew.sh/formula/micromamba
    - https://github.com/mamba-org/mamba
    - https://mamba.readthedocs.io/en/latest/user_guide/micromamba.html
    - https://medium.com/@QuantStack/introducing-mamba-2-0-0e8d5c6d1d0c
    - https://wolfv.medium.com/making-conda-fast-again-4da4debfb3b7
  summary:
    - >
      micromamba is the small, standalone member of the Mamba package-manager family.
      Mamba began at QuantStack as a C++ reimplementation of conda focused on faster
      dependency solving and downloads, using libsolv and parallel fetching while
      preserving conda-compatible package operations. That work grew inside the
      conda-forge ecosystem, where fast solving matters for large scientific and
      data-science package graphs.
  usage:
    - >
      A major technical milestone came with the Mamba 2.0 effort, which made Mamba use
      the same standalone code as micromamba and removed the older Python-dependent
      pieces. For package-manager users, micromamba fills the bootstrapper niche: create
      or run conda environments quickly without first carrying an entire conda
      distribution.
