history:
  adoption-history:
    - >
      WindowKeys began as a focused answer to an early macOS Sequoia usability gap:
      third-party keyboards could not always invoke Apple's Globe-key tiling shortcuts.
      Later releases broadened the app into a tiling panel and shortcut-driven command
      center rather than merely a keyboard workaround.
  package-nerd-significance:
    - >
      WindowKeys is a useful example of a small native utility built directly around a
      newly introduced operating-system feature. It exposes macOS's own Window-menu
      tiling commands instead of supplying an independent tiling engine, making it
      interesting to users who prefer thin system integrations.
  project-history:
    - >
      Apptorium introduced WindowKeys in September 2024 after macOS Sequoia added native
      window-tiling actions. Version 2.0 introduced the Tiling Panel in January 2025,
      while version 3.0 in June 2025 added cross-display movement, per-window
      repeat-last-action support, and a redesigned shortcut editor.
  related-projects:
    - >
      macOS native window tiling: WindowKeys invokes the operating system's Window-menu
      commands.
    - >
      Other Apptorium desktop utilities share the same focus on small native macOS
      productivity tools.
  sources:
    - https://www.apptorium.com/blog/windowkeys
    - https://www.apptorium.com/windowkeys
    - https://www.apptorium.com/windowkeys/release-notes
    - https://www.apptorium.com/windowkeys/release-notes/3.0
  summary:
    - >
      WindowKeys is a native macOS utility from Apptorium that assigns customizable
      keyboard shortcuts to the operating system's built-in window-tiling commands and
      provides a panel for accessing those commands.
  timeline:
    - >
      2024-09-19: Apptorium introduced WindowKeys as a shortcut utility for macOS
      Sequoia's new tiling actions.
    - '2024-11-13: Version 1.1 delivered the first documented feature update.'
    - '2025-01-09: Version 2.0 introduced the Tiling Panel.'
    - >
      2025-06-04: Version 3.0 expanded WindowKeys with cross-display movement and
      repeat-last-action support.
    - '2025-06-25: Version 3.0.1 followed with shortcut-handling fixes.'
  usage:
    - >
      Users assign global shortcuts to native macOS tiling actions, open the Tiling
      Panel for visual access, move windows between displays, and repeat the most recent
      tiling command for an app window. Applications must expose compatible native
      tiling entries in their Window menu.
