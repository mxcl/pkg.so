history:
  adoption-history:
    - >
      The official product site presents Dockside as an indie macOS utility distributed
      directly and through Homebrew. It emphasizes native implementation, Apple
      notarization, offline operation, and a one-time license rather than an account or
      subscription service.
  package-nerd-significance:
    - >
      Dockside belongs to the Mac power-user tradition of small utilities that reshape
      file handling around drag-and-drop. Its Homebrew cask makes an otherwise
      direct-download utility easy to install and update declaratively.
  project-history:
    - >
      Dockside was publicly documented by Hachipoo Apps by October 2024 as a two-part
      shelf beside the macOS Dock: a general file shelf and an automatically populated
      area for recent screenshots and downloads.
    - >
      The application grew into a more configurable native shelf with multiple
      positions, temporary drop areas, folder monitoring, clipboard history, media and
      system widgets, scripting, Shortcuts, and third-party workflow integrations.
  related-projects:
    - macOS Dock
    - Finder
    - Apple Shortcuts
    - Clop
    - Dropshare
  sources:
    - https://hachipoo.com/dockside-app
    - https://hachipoo.com/dockside-usage-tips
    - https://hachipoo.com/press
  summary:
    - >
      Dockside is a native macOS file shelf that sits beside or independently of the
      Dock. It provides drag-and-drop staging, quick access to files and folders, recent
      screenshots and downloads, notes, previews, and workflow actions.
  timeline:
    - >
      2024: Hachipoo Apps published an official Dockside usage guide describing its
      file, screenshot, download, clipboard, and advanced shelf behavior.
    - >
      2026: The official product site presented Dockside as a broader customizable shelf
      with automation, widgets, utilities, and third-party integrations.
  usage:
    - >
      Users drag files, folders, applications, links, media, or text onto a persistent
      shelf, then drag them into another application when needed. Separate shelves can
      expose downloads, screenshots, folders, recent items, clipboard history, media
      controls, or system information.
    - >
      Advanced workflows can run Shortcuts, AppleScript, command-line actions, file
      utilities, and supported third-party integrations directly from shelf items.
