config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The plugin is deliberately distributed separately from iTerm2. Installing it opts
      the user into the network path needed by the companion feature; without the
      plugin, iTerm2 cannot connect to a companion device.
    - >
      It is also packaged as the Homebrew cask `itermcompanion`, giving Mac
      package-manager users a reproducible installation path.
  package-nerd-significance:
    - >
      The separate package is notable because it turns a security-sensitive networking
      feature into an explicit installation choice instead of bundling it silently with
      the terminal emulator.
    - >
      Its source lives in the main iTerm2 repository, illustrating the common monorepo
      pattern in which an independently packaged helper is developed alongside its host
      application.
  project-history:
    - >
      The Companion Plugin is part of the iTerm2 project maintained by George Nachman
      and contributors. The official iTerm2 source tree contains dedicated Companion and
      iTermCompanion components.
  related-projects:
    - iTerm2
    - iTerm2 Companion for iPhone
  sources:
    - https://github.com/gnachman/iTerm2
    - https://iterm2.com/companion-plugin.html
    - source_facts.package-manager
  summary:
    - >
      iTerm2 Companion Plugin is an optional macOS helper that pairs iTerm2 with the
      iTerm2 Companion iPhone app through a relay connection.
  timeline:
    - >
      The plugin was introduced as a separately installed component so companion
      connectivity requires an explicit user action.
  usage:
    - >
      Install the application in `/Applications`; it does not need to be launched
      manually because iTerm2 discovers it automatically.
    - Use it only when pairing iTerm2 with the companion application on an iPhone.
