history:
  adoption-history:
    - >
      Paperpile developed around a web-first research workflow, with browser integration
      for importing references and a Google Docs integration for collaborative citation
      work.
    - >
      Its dedicated Microsoft Word plugin extended that workflow to desktop Word on
      macOS and Windows, while integrations now include cloud storage, BibTeX and LaTeX
      workflows, and Overleaf.
  package-nerd-significance:
    - >
      Paperpile is notable among reference managers for centering its workflow on the
      browser and cloud productivity suites instead of beginning as a conventional
      desktop bibliography database.
    - >
      The Homebrew cask packages the dedicated Word companion application rather than
      the complete Paperpile web service.
  project-history:
    - >
      Paperpile was founded in 2012 by three computational biologists—Stefan, Greg, and
      Andreas—during their work as researchers at the European Bioinformatics Institute
      and MIT.
    - >
      The project was created to simplify collecting, managing, reading, and citing
      scientific papers, and subsequently added integrations spanning browsers, Google
      Docs, Microsoft Word, cloud storage, and BibTeX-based writing.
  related-projects:
    - >
      Official migration documentation positions Zotero, Mendeley, and EndNote as other
      reference managers from which libraries may be imported.
    - >
      Paperpile integrates with Google Scholar, PubMed, arXiv, Google Docs, Microsoft
      Word, Google Drive, OneDrive, Overleaf, and BibTeX workflows.
  sources:
    - https://paperpile.com/about/
    - https://paperpile.com/h/get-started-web/
    - https://paperpile.com/h/get-started-word/
    - https://paperpile.com/h/integrations/
  summary:
    - >
      Paperpile is a commercial, cloud-oriented reference manager for collecting papers,
      organizing research libraries, reading PDFs, and producing citations and
      bibliographies.
  timeline:
    - '2012: Paperpile was founded by three computational biologists.'
    - >
      2025: Official Word-plugin guidance documented dedicated macOS and Windows clients
      alongside the established Google Docs workflow.
  usage:
    - >
      Researchers collect references and PDFs from publisher sites and scholarly
      databases, organize them with folders and labels, and cite them while writing.
    - >
      The reviewed macOS cask installs the companion used to search a Paperpile library
      and insert or update citations and bibliographies in Microsoft Word.
    - >
      Paperpile accounts and connected cloud services are authorized through application
      interfaces; the official documentation does not identify a standalone credentials
      file.
