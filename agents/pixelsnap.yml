history:
  adoption-history:
    - >
      PixelSnap is aimed chiefly at interface designers, developers, and product teams
      that need to inspect on-screen dimensions without opening source design files. The
      official site highlights use alongside Sketch, Affinity applications, and Figma
      and publishes testimonials from practitioners at design and technology
      organizations.
  package-nerd-significance:
    - >
      PixelSnap is a focused macOS utility of the kind that package-manager users often
      value: it turns a narrow but repetitive visual-development task into a global
      desktop action. Its cask also makes a commercially distributed design tool
      manageable alongside open-source development utilities.
  project-history:
    - >
      PixelSnap was created as a macOS utility for measuring distances and object
      dimensions anywhere on the screen. PixelSnap 2 was subsequently rewritten from
      scratch, with the vendor emphasizing faster recognition, improved Retina support,
      snappable guides, multiple-object measurement, customizable shortcuts, and
      integrations with design and screenshot tools.
  related-projects:
    - >
      The official site documents integration with Sketch, the Affinity suite, Figma,
      Adobe XD, and CleanShot.
  sources:
    - 'Official PixelSnap website: https://pixelsnap.com/'
  summary:
    - >
      PixelSnap 2 is a proprietary macOS screen-measurement utility. It detects object
      boundaries, measures distances and dimensions, checks alignment with guides and
      crosshairs, and exports annotated measurement screenshots.
  timeline:
    - >
      PixelSnap 2: The application was rewritten from scratch and expanded with faster
      measurement, guides, multi-object measurement, and additional integrations.
  usage:
    - >
      Designers and developers invoke PixelSnap over any application to measure spacing
      and object bounds, retain dimensions on screen, check alignment, copy
      measurements, or capture an image showing the measured area.
