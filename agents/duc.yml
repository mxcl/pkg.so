id: brew:duc
display-name: duc
repo: null
docs:
  - https://github.com/zevv/duc#readme
config-file-location:
  unix:
    - /etc/ducrc
    - ~/.config/duc/ducrc
    - ~/.ducrc
    - ./.ducrc
credentials-file-location: null
history:
  adoption-history:
    - >
      duc entered conventional Unix packaging channels: its homepage documents Debian
      and derivative installation, and the package metadata here shows availability
      across Homebrew, Debian, Fedora, Nix, Ubuntu, Alpine, and openSUSE-family
      packaging.
    - >
      Adoption is mostly sysadmin and storage-operator oriented. It is useful where
      repeated recursive du scans are too expensive and where visual inspection is more
      useful than a single sorted list.
  package-nerd-significance:
    - >
      duc is package-nerd-interesting as a classic small C/Unix utility: one executable
      name, man-page style documentation, broad distro packaging, and a stable purpose
      that has not accreted a large platform around itself.
    - >
      It also represents a family of disk-usage tools that compete by data structure and
      UI rather than by cloud integration: ncdu, dust, gdu, and duc all solve the same
      operator itch with different tradeoffs.
  project-history:
    - >
      The project documentation presents duc as a collection of tools for indexing,
      inspecting, and visualizing disk usage. Its homepage emphasizes scale, saying it
      has been tested on filesystems with hundreds of millions of files and petabytes of
      storage.
    - >
      The public GitHub release history shows a 1.0 release candidate in 2015 followed
      by 1.x releases, which matches its role as a mature small Unix utility rather than
      a fast-moving platform.
  related-projects:
    - >
      duc is related in usage to ncdu, gdu, dust, and graphical disk usage viewers, but
      its distinguishing feature is the persistent indexed database used by several
      front ends.
    - >
      It also belongs to the same operational toolbox as du, df, find, and filesystem
      inventory scripts used by Unix administrators.
  sources:
    - https://github.com/zevv/duc
    - http://duc.zevv.nl
    - https://github.com/zevv/duc/releases
  summary:
    - >
      duc is a disk-usage indexer and visualizer built for large Unix filesystems. Its
      niche is the middle ground between simple du-style scans and heavier monitoring
      systems: it indexes once, stores accumulated directory sizes, then lets users
      inspect the database through CLI, ncurses, X/OpenGL, or CGI views.
  timeline:
    - '2015: duc 1.0 release candidate appears in the GitHub release history.'
    - '2015: duc 1.1, 1.2, and 1.3 releases follow.'
    - '2016: duc 1.4 release line begins.'
    - '2017: duc 1.4.3 is published in the GitHub release history.'
  usage:
    - >
      The typical workflow is to run duc index over a filesystem subtree, then use
      commands such as duc ls, text UI, GUI, or web views to inspect where space is
      going. Its default database workflow makes it valuable on machines where disk
      usage analysis is repeated.
    - >
      Because it keeps a database of accumulated sizes, duc is better suited to repeated
      exploration of large trees than one-shot disk usage commands.
related-packages:
  - id: brew:ncdu
    reason: >
      Choose ncdu for a widely packaged, SSH-friendly interactive scanner that explores
      a tree directly instead of relying on Duc's reusable indexed database.
    rel: alternative
    sources:
      - https://duc.zevv.nl/
      - https://dev.yorhel.nl/ncdu
  - id: brew:gdu
    reason: >
      Choose gdu when you want a fast cross-platform terminal disk analyzer with
      interactive and non-interactive modes rather than Duc's multiple database-backed
      front ends.
    rel: alternative
    sources:
      - https://duc.zevv.nl/
      - https://github.com/dundee/gdu
  - id: brew:dust
    reason: >
      Choose Dust for an immediate terminal-sized visualization of the largest files and
      directories without first building Duc's persistent index.
    rel: alternative
    sources:
      - https://duc.zevv.nl/
      - https://github.com/bootandy/dust
  - id: brew:agedu
    reason: >
      Choose agedu when the main task is finding large data that has not been accessed
      recently, whereas Duc primarily indexes and visualizes accumulated sizes.
    rel: alternative
    sources:
      - https://duc.zevv.nl/
      - https://www.chiark.greenend.org.uk/~sgtatham/agedu/
