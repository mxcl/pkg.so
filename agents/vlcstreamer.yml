history:
  adoption-history:
    - >
      Hobbyist Software distributed supported helper builds for macOS and Windows and
      also hosted an unsupported Linux helper contributed by the community. Its
      alternate-version archive preserves builds for older Windows and macOS releases.
  package-nerd-significance:
    - >
      VLC Streamer illustrates a common packaging pattern from the early
      mobile-streaming era: a desktop helper combined VLC-based conversion with
      discovery and delivery to a companion mobile application.
    - >
      It is distinct from the VideoLAN VLC application despite relying on VLC for
      conversion and some playback tasks.
  project-history:
    - >
      Hobbyist Software developed VLC Streamer as a desktop-helper and mobile-app system
      for watching computer-hosted videos on iPhone and iPad devices. The helper uses
      VLC to convert source movies into an efficient Apple-oriented streaming format
      before sending them over the local network.
    - >
      The project maintained separate Windows and macOS helpers, retained legacy builds
      for older operating systems, and published an unsupported community-provided Linux
      edition.
  related-projects:
    - VLC media player
    - VLC Remote
    - VLC Streamer mobile app
  sources:
    - https://hobbyistsoftware.com/vlcstreamer
    - https://hobbyistsoftware.com/vlcstreamer-stream
    - https://hobbyistsoftware.com/vlcstreamer-versions
  summary:
    - >
      VLC Streamer is Hobbyist Software's desktop helper for converting and streaming
      videos from a Mac or PC to the companion VLC Streamer application on an iPhone or
      iPad.
  timeline:
    - 'Legacy era: Separate helper releases supported older Windows and macOS versions.'
    - >
      Later distribution: Hobbyist Software retained an unsupported community-provided
      Linux helper alongside its supported desktop downloads.
  usage:
    - >
      A user installs the helper on a computer, runs it on the same local network as the
      mobile device, selects a video, and begins watching after the helper has converted
      enough material to start streaming.
    - >
      Streaming avoids copying the whole movie to the device, while an optional workflow
      can copy the converted movie for later offline viewing.
