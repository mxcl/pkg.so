repo: null
docs:
  - https://www.cprover.org/cbmc/doc/manual.pdf
  - https://diffblue.github.io/cbmc/cprover_documentation.html
  - https://www.cprover.org/cbmc
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official documentation notes availability for Linux, Windows, and macOS, including
      Debian/Ubuntu packages, release binaries, and Homebrew. The supplied package facts
      also show cbmc packaged by Homebrew, Debian, Ubuntu, Fedora, and Nix.
  package-nerd-significance:
    - >
      CBMC is a heavyweight developer-tools package because a single install exposes a
      mature formal-methods toolchain rather than just one binary. It is notable in
      package collections as a command-line verification suite that can slot into CI and
      compiler-like workflows.
  project-history:
    - >
      The CProver site presents CBMC as a bounded model checker for C and C++ and names
      Daniel Kroening as the contact. The current Diffblue GitHub repository was created
      in 2016 and remains the development repository for CBMC and related CProver tools.
  related-projects:
    - >
      The CProver tool family includes JBMC for Java bytecode, goto-analyzer,
      goto-cc/goto-gcc/goto-ld, goto-diff, goto-harness, goto-instrument, janalyzer,
      jdiff, and related solver utilities.
  sources:
    - https://api.github.com/repos/diffblue/cbmc
    - https://github.com/diffblue/cbmc
    - https://www.cprover.org/cbmc/
    - https://www.cprover.org/cbmc/doc/manual.pdf
    - https://diffblue.github.io/cbmc/cprover_documentation.html
    - https://www.cprover.org/cbmc
    - https://formulae.brew.sh/api/formula/cbmc.json
  summary:
    - >
      CBMC is the C Bounded Model Checker, a CProver formal-verification tool for
      checking C and C++ programs for memory safety, undefined behavior, assertions, and
      related properties.
  timeline:
    - '2016: Current public GitHub repository created.'
    - '2025: CBMC 6.7 and 6.8 release series published on GitHub.'
    - '2026: CBMC 6.9 and 6.10 releases published on GitHub.'
  usage:
    - >
      CBMC analyzes programs by unwinding loops and passing the resulting formula to a
      decision procedure. The tool suite includes `cbmc`, `goto-cc`, `goto-instrument`,
      `goto-analyzer`, `jbmc`, and related utilities for producing and analyzing goto
      programs.
related-packages:
  - id: brew:cppcheck
    reason: >
      Choose Cppcheck for lightweight detection of common C/C++ defects with minimal
      proof setup; choose CBMC when you need bounded, solver-backed verification of
      assertions and program properties.
    rel: alternative
    sources:
      - https://github.com/cppcheck-opensource/cppcheck
      - https://www.cprover.org/cbmc/
