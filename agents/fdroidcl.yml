history:
  adoption-history:
    - >
      The supplied package facts show fdroidcl distributed by Homebrew, Debian, Ubuntu,
      Nix, and winget. That spread is notable for a small F-Droid companion tool: it
      means the CLI is useful outside a single Linux packaging niche and has become a
      recognizable bridge between desktop package managers, Android devices, and F-Droid
      repositories.
    - >
      The README notes unofficial Debian and Ubuntu packages, while the current package
      facts show wider packaging. Its adoption is tied to users who manage multiple
      Android devices, prefer scripted installs, or want F-Droid repository access
      without installing the Android F-Droid client on every device first.
  package-nerd-significance:
    - >
      fdroidcl is interesting because it turns F-Droid into something closer to a
      traditional package-manager CLI. For package nerds, app IDs, repository indexes,
      repeatable installs, and ADB-backed device operations make Android app management
      feel closer to apt, brew, or pacman workflows.
  project-history:
    - >
      The fdroidcl repository was created in 2015 and its README presents the tool as a
      simple command-line client for F-Droid. The README contrasts it with the Android
      client: the Android client integrates with the device for update checks and
      notifications, while fdroidcl runs on the desktop and uses ADB.
    - >
      The project grew from basic index, search, install, uninstall, and download
      operations into a broader CLI that can manage repositories and setups. The README
      documents commands for updating indexes, searching apps, installing updates,
      scanning connected devices, managing repositories, and creating setup definitions
      for mass installs.
  related-projects:
    - F-Droid is the upstream app distribution ecosystem whose repositories fdroidcl consumes.
    - ADB is the Android device bridge fdroidcl uses to operate on connected devices.
    - >
      fdroidserver is the complementary tool suite for creating and maintaining F-Droid
      repositories.
  sources:
    - https://github.com/Hoverth/fdroidcl
    - https://raw.githubusercontent.com/Hoverth/fdroidcl/master/README.md
    - https://api.github.com/repos/Hoverth/fdroidcl
    - https://formulae.brew.sh/formula/fdroidcl
  summary:
    - >
      fdroidcl is a command-line desktop client for F-Droid. It is not an F-Droid
      repository server and it is not a replacement Android app store UI; it is a
      host-side tool that talks to connected Android devices over ADB and operates on
      F-Droid repositories from a terminal.
  timeline:
    - '2015: GitHub repository created and early v0.1.0 tag history appears.'
    - '2025: v0.8.1 tag history shows ongoing maintenance.'
    - >
      2026: README requires Go 1.21 or later and documents repository and setup
      management commands.
  usage:
    - >
      The normal workflow is to run fdroidcl update to download repository indexes,
      search or show app metadata, and then install or upgrade packages on a connected
      device. Repository management and setup export/import make it useful for
      repeatable device provisioning.
    - >
      The README also documents clear limits: fdroidcl does not run as a daemon, does
      not act as an F-Droid server, and does not swap apps with devices. Those
      boundaries make it a focused CLI rather than a general F-Droid platform.
related-packages:
  - id: cask:android-platform-tools
    reason: >
      fdroidcl operates on connected Android devices through ADB, which Android SDK
      Platform-Tools supplies.
    rel: adjacent_workflow
    sources:
      - https://github.com/Hoverth/fdroidcl/blob/master/README.md
      - https://developer.android.com/tools/adb
  - id: brew:fdroidserver
    reason: >
      Use fdroidserver to create and publish an F-Droid-compatible repository, then use
      fdroidcl to search it and install its apps on connected devices.
    rel: adjacent_workflow
    sources:
      - https://github.com/Hoverth/fdroidcl/blob/master/README.md
      - https://f-droid.org/en/docs/Setup_an_F-Droid_App_Repo/
