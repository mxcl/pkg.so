id: brew:brag
display-name: Brag
repo: https://sourceforge.net/p/brag/code
docs:
  - https://brag.sourceforge.net/README
  - https://brag.sourceforge.net/brag.1.html
config-file-location:
  unix:
    - ~/.brag/<server>/<group>/accept
    - ~/.brag/<server>/<group>/reject
credentials-file-location:
  unix:
    - ~/.brag/<server>/passwd
history:
  adoption-history:
    - >
      Brag's adoption is small but historically package-manager-shaped: the input
      package facts record Homebrew, Debian, and Ubuntu packages. Its man page and
      README also assume Unix home-directory state under ~/.brag and cron-based
      operation, matching the packaging conventions of the period.
    - >
      Its niche narrowed as web-based binary distribution, dedicated NZB clients, and
      private indexers changed Usenet workflows, but Brag remains a compact example of a
      classic NNTP automation tool.
  package-nerd-significance:
    - >
      Brag matters to package historians as a surviving Homebrew formula for an older
      Unix networking workflow: scripted Usenet binary retrieval over NNTP. It is less a
      mainstream modern tool than a preserved slice of early broadband-era command-line
      culture.
    - >
      It is also a reminder that package managers carry long tails of specialized tools
      whose primary upstreams live on SourceForge rather than GitHub.
  project-history:
    - >
      Brag is credited in its README to author Akos Polster and maintained at
      SourceForge. The project documentation reflects the early-2000s Usenet binary era,
      including support for uuencode, MIME base64, yEnc, authentication, filters, and
      parallel NNTP connections.
    - >
      The SourceForge file feed shows Brag releases at least from version 1.1.0 in
      October 2000 through version 1.4.3 in March 2004. The acknowledgements list
      several contributors for NNTP support, yEnc support, performance work, Mac OS X
      fixes, Debian fixes, and user reports.
  related-projects:
    - NNTP news servers are the network service Brag automates against.
    - >
      Usenet binary tools and later NZB clients occupy the same broad problem space of
      fetching multipart posts.
    - >
      Debian packaging is mentioned in the README acknowledgements and also appears in
      the input package facts.
  sources:
    - https://brag.sourceforge.net/README
    - https://brag.sourceforge.net/brag.1.html
    - https://sourceforge.net/projects/brag/rss?path=/brag
    - source_facts.package-manager
  summary:
    - >
      Brag is a command-line Usenet binary downloader. It collects multipart binary
      attachments from NNTP newsgroups, assembles them, and was designed to be robust
      enough for unattended cron jobs.
  timeline:
    - '2000-10: SourceForge lists a Brag 1.1.0 RPM release.'
    - '2002-02: SourceForge lists Brag 1.2.0 source and RPM releases.'
    - '2003-11: SourceForge lists Brag 1.4.0 and 1.4.1 releases.'
    - '2004-03: SourceForge lists Brag 1.4.3 source and RPM releases.'
  usage:
    - >
      The man page describes running brag against an NNTP server and newsgroup,
      optionally with authentication, accept/reject subject patterns, parallel
      connection count, output directory, and cross-server or cross-newsgroup part
      combining.
    - >
      State is stored under ~/.brag, with unfinished and finished directories per server
      and group. Passwords can be placed in ~/.brag/<server>/passwd, while accept and
      reject pattern files live below the server and group directory.
related-packages:
  - id: brew:nzbget
    reason: >
      Choose NZBGet when you prefer NZB-driven Usenet downloads, a managed queue, web
      interface, APIs, and post-processing automation; choose Brag for direct
      cron-friendly newsgroup scanning and multipart assembly.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/brag/
      - https://nzbget.com/documentation/
      - https://github.com/nzbgetcom/nzbget
tags:
  - binary-download
  - cli
  - multipart-assembly
  - nntp
  - usenet
