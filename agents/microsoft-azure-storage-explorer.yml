credentials-file-location: null
history:
  adoption-history:
    - >
      Microsoft positioned the preview as a free standalone tool for developers building
      and diagnosing Azure Storage applications, initially offering Windows and macOS
      builds. It subsequently became a cross-platform management client integrated with
      Microsoft Entra authentication and multiple Azure Storage services.
    - >
      Its scope expanded beyond the preview's blob-centered workflows to queues, tables,
      file shares, Data Lake Storage, managed disks, AzCopy-powered transfers,
      access-control management, and local Azurite development.
  package-nerd-significance:
    - >
      Storage Explorer packages many Azure data-plane operations into one desktop
      client, making it useful when a graphical inspection or transfer workflow is
      faster than composing Azure CLI, PowerShell, SDK, or portal operations.
  project-history:
    - >
      Microsoft announced a substantially revised Azure Storage Explorer preview with
      Azure SDK 2.8 in 2015. The preview emphasized standalone, cross-platform storage
      inspection, uploads and downloads, metadata, and shared-access-signature
      workflows.
    - >
      Microsoft continued broadening the client as Azure Storage evolved, including
      deeper Data Lake Storage support and AzCopy integration for high-throughput
      transfers.
  related-projects:
    - AzCopy, used as a high-performance transfer engine.
    - Azurite, the local Azure Storage emulator.
    - >
      Azure CLI, Azure PowerShell, and the Azure portal, which provide alternative
      storage-management interfaces.
  sources:
    - https://azure.microsoft.com/en-us/blog/announcing-the-azure-sdk-2-8-for-net/
    - https://azure.microsoft.com/en-us/blog/azure-source-volume-74/
    - >
      https://learn.microsoft.com/azure/storage/storage-explorer/vs-azure-tools-storage-manage-with-storage-explorer
    - https://learn.microsoft.com/en-us/azure/storage/common/storage-explorer-sign-in
  summary:
    - >
      Microsoft Azure Storage Explorer is a free cross-platform desktop client for
      browsing, transferring, and administering data in Azure Storage.
  timeline:
    - '2015: Microsoft announced the revised cross-platform Storage Explorer preview.'
    - >
      2018: Storage Explorer support was added to the broader Azure Data Lake Storage
      Gen2 preview.
    - >
      2019: AzCopy integration entered public preview as the application's
      high-throughput transfer engine.
  usage:
    - >
      Sign in with a Microsoft Entra account to browse permitted subscriptions, or
      attach an individual resource using a SAS, connection string, account name and
      key, or supported local-emulator connection.
    - >
      Use the explorer interface to upload, download, copy, inspect, and manage blobs,
      file shares, queues, tables, disks, and Data Lake Storage resources. Microsoft
      recommends Entra authentication where possible.
