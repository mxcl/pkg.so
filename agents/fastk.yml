history:
  adoption-history:
    - >
      FastK's public footprint is niche and bioinformatics-specific. Its adoption signal
      is strongest in packaging and genomics workflows that need efficient k-mer
      histograms, tables, and profiles for large sequencing data rather than in broad
      developer communities.
  package-nerd-significance:
    - >
      For package nerds, FastK is interesting because it is a domain-heavy command suite
      where filesystem layout is part of the interface: stub files, hidden sidecar
      files, table/profile extensions, and companion commands such as Fastrm and
      Fastmerge all have to be packaged together correctly.
  project-history:
    - >
      The README identifies Gene Myers as author, gives July 22, 2020 as the first date,
      and documents FastK as a k-mer counter optimized for high-quality assembly
      datasets. Its command suite includes FastK itself plus utilities for moving,
      merging, concatenating, inspecting, and mapping FastK output files.
  related-projects:
    - KMC3 is named in the README as a performance comparison point.
    - DAZZ_DB is supported as an input format.
    - merfin is named as a downstream use case for relative k-mer profiles.
  sources:
    - https://github.com/thegenemyers/FASTK
    - https://raw.githubusercontent.com/thegenemyers/FASTK/master/README.md
    - https://api.github.com/repos/thegenemyers/FASTK
  summary:
    - >
      FastK is Gene Myers' k-mer counter for high-quality shotgun sequencing data,
      especially Illumina and PacBio HiFi datasets. It is packaged as a command-line
      scientific tool rather than a general developer utility.
  timeline:
    - '2020: README records the first FastK date as July 22, 2020.'
    - '2020: GitHub repository created on October 19, 2020.'
    - '2021: README current date records April 18, 2021.'
  usage:
    - >
      FastK consumes CRAM, BAM, SAM, FASTA, FASTQ, gzip-compressed sequence files, and
      Dazzler databases, producing histograms, sorted k-mer/count tables, and optional
      sequence profiles. The README emphasizes low-memory operation, temporary disk
      usage, multithreading, and HPC workflows such as splitting data and merging
      tables.
related-packages:
  - id: brew:jellyfish
    reason: >
      Jellyfish is an alternative k-mer counter built around a lock-free hash table,
      while FastK emphasizes high-fidelity datasets, sorted tables, sequence profiles,
      and bounded-memory disk-backed processing.
    rel: alternative
    sources:
      - https://github.com/thegenemyers/FASTK#readme
      - https://github.com/gmarcais/Jellyfish#readme
