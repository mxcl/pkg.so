history:
  adoption-history:
    - >
      gloox became useful to developers who wanted a C++ library rather than a complete
      XMPP client. The official site lists several product users, and the supplied
      package metadata shows packaging across Alpine, Homebrew, Debian, Fedora,
      MacPorts, Nix, Arch, Ubuntu, and openSUSE.
  package-nerd-significance:
    - >
      For package maintainers, gloox is a classic C++ networking library package:
      tarball releases, optional TLS and compression dependencies, a `gloox-config`
      helper, pkg-config-style integration, and ABI-sensitive releases used by
      downstream XMPP software.
  project-history:
    - >
      The official Camaya site presents gloox as a full-featured XMPP engine maintained
      by Jakob Schroeter, with stable tarball releases, API documentation, a changelog,
      and anonymous SVN access. The site copyright range runs from 2002 to 2023, and the
      latest stable version listed there is 1.0.28.
  related-projects:
    - >
      gloox is related to Jabber/XMPP clients, bots, components, XMPP Extension Protocol
      implementations, and the related glooxd server project hosted on the same Camaya
      site.
  sources:
    - https://camaya.net/api/gloox-1.0.28/
    - https://camaya.net/gloox/
    - https://camaya.net/gloox/changelog/
    - https://camaya.net/gloox/doc/
    - https://camaya.net/gloox/download/
    - source_facts.package-manager
  summary:
    - >
      gloox is a portable ANSI C++ Jabber/XMPP client library. It provides
      protocol-level building blocks for XMPP clients, components, authentication,
      roster handling, messaging, file transfer, proxy support, and extension support.
  timeline:
    - '2002: Official Camaya site copyright range begins.'
    - '2020: gloox 1.0.24 released.'
    - '2023: gloox 1.0.25, 1.0.26, 1.0.27, and 1.0.28 released.'
    - '2023: Official API documentation for gloox 1.0.28 published.'
  usage:
    - >
      Developers embed gloox in C++ clients, bots, and components. The official
      documentation points users to feature documentation, API references, examples, FAQ
      material, and source installation using configure, make, and make install.
