history:
  adoption-history:
    - >
      The project is visible in Go documentation, Homebrew, and Debian's Go library
      packaging. That adoption pattern is common for Go conversion libraries: developers
      embed the library in migration tools, while package managers expose a small
      command-line converter for one-off document cleanup.
  package-nerd-significance:
    - >
      For package nerds, html2markdown is interesting because it occupies the narrow
      lane between heavyweight converters such as Pandoc and tiny ad hoc scripts. It
      packages a parser-backed Go library as an installable utility, giving shell users
      a focused HTML-to-Markdown tool with binaries across platforms.
  project-history:
    - >
      The repository was created in 2018 and presents the project as a Go library that
      converts HTML to Markdown with parser-based handling for unknown input. The README
      emphasizes extensibility through rules and plugins, with support for
      GitHub-flavored Markdown features such as tables, strikethrough, and task-list
      items.
    - >
      The release stream shows steady versioned packaging, with the 1.x series active
      through 2024 and the 2.x series appearing afterward. Release assets include
      platform archives and package artifacts, which explains why a library-oriented Go
      project also fits Homebrew as a CLI formula.
  related-projects:
    - >
      The README names Turndown for JavaScript and lunny/html2md as related projects. In
      practice, users also compare this kind of tool with Pandoc, html2text, and bespoke
      site-migration scripts.
  sources:
    - >
      GitHub repository and release metadata document the repository creation date and
      versioned release history.
    - Homebrew and Debian package pages support package-manager adoption.
    - >
      The GitHub README documents parser-based conversion, rules, plugins, security
      caveats, and related projects.
  summary:
    - >
      html2markdown is the Homebrew-packaged command-line face of Johannes Kaufmann's
      html-to-markdown project, a Go implementation for turning HTML into readable
      Markdown. Its appeal comes from using an HTML parser and conversion rules instead
      of regular-expression scraping.
  timeline:
    - '2018: The html-to-markdown repository was created on GitHub.'
    - '2020: The v1.2.0 release continued the early 1.x line.'
    - '2021: v1.3.0 added nested-list focused work.'
    - '2023: v1.4.0 added escaping control, followed by v1.5.0 list-start work.'
    - '2024: v1.6.0 landed before the alpha 2.0 releases.'
    - '2025: v2.3.0 identified table-plugin work in the release title.'
    - '2026: v2.5.2 shipped with multiple platform artifacts.'
  usage:
    - >
      Typical use cases are converting copied web fragments, archived pages, CMS
      exports, or generated HTML into Markdown for documentation systems. The README's
      rule and plugin APIs make it useful when a team needs repeatable conversion rules
      instead of a generic all-purpose document converter.
related-packages:
  - id: brew:pandoc
    reason: >
      Choose Pandoc when HTML-to-Markdown conversion is part of a broader workflow
      involving formats such as DOCX, LaTeX, EPUB, or multiple Markdown dialects.
    rel: alternative
    sources:
      - https://github.com/JohannesKaufmann/html-to-markdown#readme
      - https://pandoc.org/MANUAL.html
