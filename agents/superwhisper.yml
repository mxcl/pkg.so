id: cask:superwhisper
display-name: Superwhisper
repo: null
docs:
  - https://superwhisper.com/docs/get-started/introduction
config-file-location:
  macos:
    - ~/Documents/superwhisper
credentials-file-location: null
history:
  adoption-history:
    - >
      Superwhisper expanded from its macOS desktop application to Windows and
      iOS/iPadOS. Its official documentation presents a shared license across desktop
      and iOS and optional synchronization across installations.
  package-nerd-significance:
    - >
      Superwhisper represents the newer class of AI-native desktop utilities that
      combine local or cloud speech recognition with language-model post-processing.
      Support for custom modes, bring-your-own API keys, deep links, shortcuts, and
      local configuration gives technical users substantial workflow control.
    - >
      The Homebrew cask makes the rapidly updated macOS application reproducibly
      installable alongside conventional command-line and desktop tools.
  project-history:
    - >
      Superwhisper was developed as an AI-assisted dictation application. Its feature
      set grew beyond direct speech-to-text to include configurable processing modes,
      contextual rewriting, file transcription, translation, system-audio capture,
      speaker separation, and both local and cloud models.
  related-projects:
    - Whisper speech-recognition models
    - OpenAI
    - Anthropic
    - Deepgram
    - Groq
  sources:
    - https://superwhisper.com/docs/get-started/introduction
    - https://superwhisper.com/docs/get-started/settings-advanced
    - https://superwhisper.com/docs/modes/modes
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Superwhisper is an AI-powered dictation and transcription application that turns
      speech or media files into text and can reshape the result through configurable
      language-model modes.
  timeline:
    - '2026: Official documentation lists macOS, Windows, and iOS/iPadOS availability.'
    - '2026: The supplied Homebrew cask record tracks Superwhisper 2.17.3.'
  usage:
    - >
      Common uses include drafting messages, email, notes, and professional text by
      voice; transcribing meetings, interviews, lectures, and media files; translating
      dictation; and building custom modes that apply specialized prompts or application
      context.
