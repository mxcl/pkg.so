history:
  adoption-history:
    - >
      M3Unify has remained a specialist macOS utility rather than a general media
      manager. Its releases followed Apple's transition from iTunes to Music and
      successive macOS compatibility changes, preserving a workflow aimed at portable
      players, removable media, and car-audio systems.
  package-nerd-significance:
    - >
      M3Unify packages a traditionally script-heavy media-export workflow into a focused
      GUI application. Package users value it for reproducible folder layouts, M3U
      generation, metadata-based naming, format conversion, and support for removable
      storage.
  project-history:
    - >
      Doug Adams released M3Unify 1.0 in 2014 as a tool for copying tracks and
      constructing M3U playlists. Later versions added metadata-based conversion,
      artwork export, folder-pattern controls, relative-path playlists, FLAC handling,
      and support for Apple's Music application. Version 3.0 removed iTunes support and
      updated the interface for current macOS releases.
  related-projects:
    - Apple Music and its predecessor iTunes provide the source libraries used by M3Unify.
    - >
      M3U is the interoperable playlist format at the center of the application's export
      workflow.
    - Doug's Apps also publishes Dupin and Join Together for adjacent music-library tasks.
  sources:
    - https://dougscripts.com/apps/m3unifyapp.php
    - https://dougscripts.com/apps/m3unifyfaq.php
  summary:
    - >
      M3Unify is a commercial macOS utility by Doug Adams for exporting local music
      files and producing M3U playlists for folders, removable media, and external
      players.
  timeline:
    - '2014: M3Unify 1.0.0 was released.'
    - '2018: Version 1.10 added relative-path M3U export and M3U import.'
    - "2019: Version 2.0 introduced compatibility with Apple's Music application."
    - '2026: Version 3.0 added Playlist XML import and removed iTunes support.'
  usage:
    - >
      Users drag local tracks from Music, files from Finder, or compatible playlist
      files into M3Unify. The application can copy or convert the accessible audio,
      arrange it into metadata-derived folders, export artwork, and create M3U playlists
      with relative or absolute paths. It operates on copies and does not alter the
      source music library.
