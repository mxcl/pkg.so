id: brew:ffmpeg@2.8
display-name: FFmpeg 2.8
repo: https://git.ffmpeg.org/ffmpeg.git
docs:
  - https://ffmpeg.org/documentation.html
config-file-location:
  unix:
    - $FFMPEG_DATADIR/*.ffpreset
    - ~/.ffmpeg/*.ffpreset
    - PREFIX/share/ffmpeg/*.ffpreset
credentials-file-location: null
history:
  adoption-history:
    - >
      As a formula, ffmpeg@2.8 serves compatibility rather than new-feature adoption.
      Homebrew's formula API marks it deprecated but not disabled and builds from the
      official 2.8.22 tarball, showing it survives as an older release-line package for
      consumers that still need it.
    - >
      The official 2.8 changelog is dominated by maintenance and security-style fixes in
      later point releases, including bounds checks, overflow fixes, parser hardening,
      and demuxer/decoder corrections. That is typical of an old multimedia branch kept
      alive for downstream stability.
  package-nerd-significance:
    - >
      Versioned FFmpeg formulas matter because multimedia stacks are sensitive to codec
      availability, library ABI versions, and behavior changes. `ffmpeg@2.8` is a
      compatibility anchor for the Feynman branch rather than the recommended path for
      new users.
    - >
      The branch tells package historians where old consumers froze: FFmpeg 2.x
      libraries, 2015 branch point, long-tail point releases, and a Homebrew package
      kept available even after deprecation.
  project-history:
    - >
      FFmpeg 2.8 `Feynman` was presented by the upstream project about three months
      after FFmpeg 2.7. The official old download page identifies 2.8.22 as the final
      stable release from the 2.8 branch, cut from master on 2015-09-05 and released as
      2.8.22 on 2023-10-29.
    - >
      The branch is significant because upstream notes it includes changes from
      ffmpeg-mt and Libav snapshots from August 2015. That places it in the long
      post-fork reconciliation period when distribution packages and application build
      scripts often cared about exact FFmpeg/Libav API and ABI behavior.
  related-projects:
    - FFmpeg is the upstream project.
    - ffmpeg-full and ffmpeg are related Homebrew FFmpeg packaging variants.
    - >
      Libav and ffmpeg-mt are historically relevant because upstream 2.8 release notes
      mention imported changes from both.
  sources:
    - https://ffmpeg.org/olddownload.html
    - https://git.ffmpeg.org/gitweb/ffmpeg.git/blob/refs/heads/release/2.8:/RELEASE_NOTES
    - https://git.ffmpeg.org/gitweb/ffmpeg.git/blob/refs/heads/release/2.8:/Changelog
    - https://formulae.brew.sh/api/formula/ffmpeg@2.8.json
    - https://ffmpeg.org/about.html
    - https://ffmpeg.org/ffmpeg.html
  summary:
    - >
      ffmpeg@2.8 is a pinned Homebrew formula for FFmpeg's 2.8 `Feynman` release branch,
      useful when older software needs the FFmpeg 2.x library/CLI behavior rather than
      unpinned FFmpeg.
  timeline:
    - '2015: FFmpeg 2.8 branch cut from master on 2015-09-05.'
    - '2015: FFmpeg 2.8 `Feynman` announced about three months after 2.7.'
    - >
      2023: FFmpeg 2.8.22 released on 2023-10-29 as the final stable 2.8 branch release
      listed by upstream.
    - >
      2026: Homebrew formula API lists ffmpeg@2.8 as deprecated but not disabled,
      sourced from ffmpeg-2.8.22.tar.xz.
  usage:
    - >
      Users install a versioned FFmpeg formula when an application, script, or build
      dependency expects 2.8-era command behavior or library versions. The package still
      provides the familiar FFmpeg tools such as `ffmpeg`, `ffprobe`, `ffplay`, and, in
      this line, `ffserver`.
    - >
      For direct media conversion, the command-line model is the same as FFmpeg
      generally: read inputs, choose streams and options, then write outputs. The
      difference is the release line and linked dependency set, not a separate
      interface.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Choose the current unversioned FFmpeg formula when legacy 2.8 library or command
      compatibility is unnecessary and newer codec and filter support is desired.
    rel: alternative
    sources:
      - https://ffmpeg.org/olddownload.html
      - https://formulae.brew.sh/formula/ffmpeg
      - https://formulae.brew.sh/formula/ffmpeg@2.8
  - id: brew:ffmpeg@4
    reason: >
      Choose FFmpeg 4 as a newer compatibility line when software can move beyond the
      2.8 ABI but is not yet ready for the current unversioned FFmpeg branch.
    rel: alternative
    sources:
      - https://ffmpeg.org/olddownload.html
      - https://ffmpeg.org/index.html
      - https://formulae.brew.sh/formula/ffmpeg@4
tags:
