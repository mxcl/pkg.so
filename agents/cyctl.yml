history:
  adoption-history:
    - >
      Official project materials show Cyclops aimed at DevOps teams that publish
      templates for developers, QA teams, product managers, and other Kubernetes users.
      cyctl matters in that model because it gives package-manager users a scriptable
      way to install Cyclops and wire templates into a running instance.
  package-nerd-significance:
    - >
      For package nerds, cyctl is interesting because it packages a Kubernetes UI
      workflow as a conventional single binary. It sits in the same cultural lane as
      kubectl-adjacent helpers: small CLIs that make cluster workflows reproducible,
      automatable, and easy to install with Homebrew.
  project-history:
    - >
      Cyclops began as a Kubernetes developer-experience project in the
      cyclops-ui/cyclops repository, which GitHub records as created in April 2023. The
      project README frames Cyclops as a way to reduce direct YAML editing by exposing
      validated, template-driven interfaces for Kubernetes workloads.
    - >
      The cyctl command is documented as the Cyclops CLI. The official generated command
      reference includes cyctl init, whose page says it initializes Cyclops with the
      required resources and demo templates; that command reference was generated by
      Cobra in July 2024.
  related-projects:
    - Cyclops uses Helm charts as the template mechanism behind its UI.
    - >
      kubectl and Glasskube are adjacent installation or Kubernetes operation tools
      mentioned in official Cyclops materials.
  sources:
    - https://github.com/cyclops-ui/cyclops
    - https://github.com/cyclops-ui/cyclops#readme
    - https://cyclops-ui.github.io/docs/cyctl/
    - https://cyclops-ui.github.io/docs/cyctl/cyctl_init
    - https://api.github.com/repos/cyclops-ui/cyclops
    - https://api.github.com/repos/cyclops-ui/cyclops/releases?per_page=10
  summary:
    - >
      cyctl is the command-line companion to Cyclops, an open source Kubernetes tool
      that turns Helm-backed workload templates into customizable UIs. In
      package-manager terms it is a small operational CLI: useful for installing
      Cyclops, managing modules and templates, and automating Cyclops workflows from
      shells or CI.
  timeline:
    - '2023: cyclops-ui/cyclops repository created on GitHub.'
    - '2024: Official cyctl command reference generated with Cobra.'
    - >
      2025: Cyclops release series v0.20 and v0.21 published with cyctl distributed
      through package managers.
  usage:
    - >
      Typical cyctl usage starts with installing the Homebrew formula, then running
      commands such as cyctl init or resource-oriented get, create, update, delete, and
      describe subcommands. The README also calls out GitHub Actions automation, where a
      newly published template can be connected to Cyclops automatically through the
      CLI.
related-packages:
  - id: brew:helm
    reason: >
      Use Helm alongside cyctl to author, render, and validate the charts that Cyclops
      exposes as customizable workload templates.
    rel: adjacent_workflow
    sources:
      - https://cyclops-ui.com/docs/templates/template_storage/
      - https://helm.sh/docs/topics/charts/
  - id: brew:kubernetes-cli
    reason: >
      Use kubectl alongside cyctl for direct inspection, debugging, and low-level
      management of the Kubernetes resources installed or managed through Cyclops.
    rel: adjacent_workflow
    sources:
      - https://cyclops-ui.com/docs/cyctl/cyctl_init/
      - https://kubernetes.io/docs/reference/kubectl/
