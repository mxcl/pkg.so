history:
  adoption-history:
    - >
      Objective Development describes Little Snitch as having protected Mac users for
      more than two decades and as a leading Mac network monitor and personal
      application firewall.
    - >
      Version 5 was designed for the transition to modern macOS security architecture,
      supporting both Intel and Apple Silicon and replacing its deprecated
      kernel-network-extension foundation with Apple's Network Extension and Endpoint
      Security frameworks.
  package-nerd-significance:
    - >
      Little Snitch is a canonical macOS power-user tool because it makes per-process
      network behavior visible and controllable. Its rules, profiles, blocklists,
      traffic history, command-line interface, and PCAP capture bridge desktop privacy
      tooling and network diagnostics.
  project-history:
    - >
      Little Snitch began in the early Mac OS X era as an application-aware outbound
      network monitor and firewall. Over more than twenty years it expanded from
      connection prompts into traffic visualization, profiles, code-signature-aware
      rules, subscriptions, and command-line administration.
    - >
      Little Snitch 5.0 was released in November 2020 after its filtering core was
      rewritten around Apple's Network Extension and Endpoint Security frameworks. The
      release also introduced a command-line interface, longer traffic history,
      human-readable JSON backups, and deployment improvements.
  related-projects:
    - >
      Apple's Network Extension and Endpoint Security frameworks underpin Little Snitch
      5's filtering architecture.
    - Network Monitor is Little Snitch's companion interface for traffic history and analysis.
    - >
      Rule-group subscriptions allow externally maintained rules and blocklists to be
      consumed by Little Snitch.
  sources:
    - 'Official Little Snitch 5 help: https://help.obdev.at/littlesnitch5/'
    - >
      Official Little Snitch 5 release notes:
      https://www.obdev.at/products/littlesnitch/releasenotes5.html
    - 'Official product page: https://www.obdev.at/products/littlesnitch/index-en.html'
    - 'Official support center: https://www.obdev.at/support/littlesnitch'
  summary:
    - >
      Little Snitch 5 is Objective Development's macOS application firewall and network
      monitor, providing per-process connection control, traffic history, profiles, and
      rule management.
  timeline:
    - 'Early 2000s: Little Snitch began protecting application network connections on Mac OS X.'
    - >
      2020: Little Snitch 5.0 shipped with a rewritten Network Extension-based core and
      Apple Silicon support.
    - '2021: Version 5 added per-process PCAP capture and improved identifier-based rules.'
    - >
      2022: Version 5 added automatic configuration backups and broader blocklist-format
      support.
  usage:
    - >
      Little Snitch alerts when applications or processes initiate connections and lets
      users allow, deny, or defer decisions. Network Monitor shows destinations, ports,
      protocols, geography, and traffic history.
    - >
      Advanced users manage profiles for different networks, subscribe to rule groups,
      capture selected traffic in PCAP format, and automate configuration through the
      littlesnitch command-line utility.
