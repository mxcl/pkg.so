id: cask:charmstone
display-name: Charmstone
repo: https://github.com/rxhanson/Charmstone-Community
docs:
  - https://charmstone.app/
  - https://github.com/rxhanson/Charmstone-Community#readme
config-file-location:
  macos:
    - >
      ~/Library/Containers/com.knollsoft.Charmstone/Data/Library/Preferences/com.knollsoft.Charmstone.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Charmstone is distributed directly and through the Mac App Store, with a
      free-to-try model and an in-app full-version purchase. Homebrew Cask provides
      another installation route for the directly distributed build.
  package-nerd-significance:
    - >
      Charmstone is a representative macOS launcher cask: a closed-source,
      sandbox-compatible utility with direct and App Store distribution. Its community
      repository is noteworthy because it exposes scripts, localization, configuration
      commands, and issue discussion without publishing the application source.
  project-history:
    - >
      Ryan Hanson created Charmstone as a spatial application launcher and switcher for
      macOS. The application itself remains closed source, while an official public
      community repository supports user scripts, localization, bug reports, and
      discussion.
  related-projects:
    - >
      Charmstone can launch applications produced by Apple Script Editor or Automator
      and can incorporate macOS Sonoma web apps from the user's Applications directory.
  sources:
    - 'Official product page: https://charmstone.app/'
    - 'Officially linked community repository: https://github.com/rxhanson/Charmstone-Community'
  summary:
    - >
      Charmstone is a macOS launcher and application switcher that uses spatial memory
      to reduce reliance on the Dock or the conventional Command-Tab switcher.
  timeline:
    - >
      Public distribution: Charmstone became available through both direct download and
      the Mac App Store.
  usage:
    - >
      Users invoke a spatial switching interface with a modifier-key combination, place
      applications in remembered positions, launch exported scripts or Automator
      applications, and control the window through documented charmstone:// URLs. Some
      hidden preferences can be changed with macOS defaults commands.
tags:
  - app-launcher
  - app-switcher
  - automation
  - macos
  - productivity
  - spatial-interface
provenance:
  category-sources:
    - Official product page describes a quicker switcher launcher for macOS.
    - source_facts.description calls Charmstone an app launcher and switcher.
  display-name-sources:
    - Official product page uses Charmstone.
    - source_facts.applications lists Charmstone.app.
  docs-sources:
    - >
      The official homepage documents the core switching model, system support, and
      distribution options.
    - >
      The official site links the Charmstone-Community repository for scripts,
      discussion, configuration commands, and usage notes.
  history-sources:
    - 'Official product page: https://charmstone.app/'
    - 'Officially linked community repository: https://github.com/rxhanson/Charmstone-Community'
  repo-sources:
    - >
      Repository description identifies it as the home for Charmstone scripts,
      localization, and discussion: https://github.com/rxhanson/Charmstone-Community
    - >
      The official Charmstone product page links this developer-owned repository as its
      community, bugs, and discussion project: https://charmstone.app/
  tags-sources:
    - Official community repository documents script and Automator integration.
    - Official homepage documents spatial app switching.
category-confidence: high
category-path:
  - productivity
  - application-launcher
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: high
tags-confidence: high
