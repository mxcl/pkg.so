id: brew:cc-switch-cli
display-name: cc-switch-cli
repo: null
docs:
  - https://github.com/SaladDay/cc-switch-cli#readme
config-file-location:
  unix:
    - ~/.cc-switch/cc-switch.db
    - ~/.cc-switch/settings.json
    - ~/.cc-switch/config.json
    - $CC_SWITCH_CONFIG_DIR/cc-switch.db
    - $CC_SWITCH_CONFIG_DIR/settings.json
    - $CC_SWITCH_CONFIG_DIR/config.json
credentials-file-location:
  unix:
    - ~/.cc-switch/cc-switch.db
    - $CC_SWITCH_CONFIG_DIR/cc-switch.db
history:
  adoption-history:
    - >
      The supplied package facts show Homebrew, Nix, Scoop, and winget packaging. The
      README also documents direct release tarballs/zips for macOS, Linux, and Windows
      plus Homebrew installation.
  package-nerd-significance:
    - >
      It is a package-manager-friendly wrapper around the messy local state of multiple
      AI CLIs. For package nerds, the interesting bit is that most persistent state is
      centralized in ~/.cc-switch, with live files synced out to each target application
      only when needed.
  project-history:
    - >
      The official README describes cc-switch-cli as a CLI fork of CC-Switch, crediting
      the original architecture and core functionality to farion1231/cc-switch while
      adding command-line and TUI workflows.
  related-projects:
    - CC-Switch, Claude Code, Codex, Gemini CLI, OpenCode, Hermes, and OpenClaw.
  sources:
    - https://api.github.com/repos/SaladDay/cc-switch-cli
    - https://github.com/SaladDay/cc-switch-cli
    - https://github.com/SaladDay/cc-switch-cli#readme
    - https://formulae.brew.sh/api/formula/cc-switch-cli.json
  summary:
    - >
      CC-Switch CLI is a Rust TUI/CLI manager for switching and managing provider,
      account, MCP, prompt, skill, proxy, and session configuration across AI coding
      assistants.
  usage:
    - >
      Typical commands list and switch providers, manage
      Codex/Claude/Gemini/OpenCode/Hermes/OpenClaw configuration, inspect OAuth
      accounts, sync MCP servers, review sessions, manage skills and prompts, and enable
      local proxy routes.
related-packages:
  - id: brew:cc-connect
    reason: >
      Use cc-connect after configuring supported local agents with CC-Switch CLI when
      those agents also need to be operated remotely through chat platforms or a web
      interface.
    rel: adjacent_workflow
    sources:
      - https://github.com/SaladDay/cc-switch-cli#readme
      - https://github.com/chenhg5/cc-connect/blob/main/README.md
tags:
  - ai
  - ai-assistant
  - claude-code
  - cli
  - codex
  - gemini
  - openclaw
  - opencode
provenance:
  category-sources:
    - >
      Official README describes cc-switch-cli as a TUI and CLI manager for Claude Code,
      Codex, Gemini, OpenCode, Hermes, and OpenClaw provider configurations.
  display-name-sources:
    - Official GitHub repository and README use the project name cc-switch-cli.
  docs-sources:
    - >
      Official README documents CC-Switch storage under ~/.cc-switch or
      $CC_SWITCH_CONFIG_DIR, including cc-switch.db, settings.json, and legacy
      config.json.
    - Official README is the primary documentation surface for cc-switch-cli.
    - >
      Official README says the SQLite database stores providers, MCP, prompts, and app
      state, and provider management includes API key management.
  history-sources:
    - https://api.github.com/repos/SaladDay/cc-switch-cli
    - https://github.com/SaladDay/cc-switch-cli
    - https://github.com/SaladDay/cc-switch-cli#readme
    - https://formulae.brew.sh/api/formula/cc-switch-cli.json
  repo-sources:
    - >
      source_facts.repo is already set to https://github.com/SaladDay/cc-switch-cli, so
      the prompt requires returning repo as null.
  tags-sources:
    - >
      Official README lists Claude Code, Codex, Gemini, OpenCode, Hermes, and OpenClaw
      support and documents CLI provider/auth/config commands.
category-confidence: high
category-path:
  - ai
  - orchestration
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: high
