history:
  adoption-history:
    - >
      ffmpegthumbnailer was adopted in package managers because it fills a narrow but
      recurring desktop need: produce thumbnails for arbitrary video formats using the
      same codec coverage FFmpeg already provides. Homebrew packages the single
      ffmpegthumbnailer executable, and the project also exposes a library for
      applications that want thumbnail generation directly.
  package-nerd-significance:
    - >
      This is the kind of package maintainers like to keep boring: a tiny binary, a
      library, FFmpeg plus libpng dependencies, and a clear job. Its recurring build
      fixes against newer FFmpeg releases are the main maintenance story.
  project-history:
    - >
      The project describes itself as a lightweight video thumbnailer that uses FFmpeg
      to decode frames, with supported formats depending on how FFmpeg was built. Its
      early changelog starts at version 1.0 as the initial FFmpegThumbnailer release,
      and version 1.2.0 added libffmpegthumbnailer so applications could use it as a
      library instead of only a command-line tool.
    - >
      The 2.x line modernized the project around a C++ library namespace, C API changes,
      CMake, and GitHub hosting. Later releases focused on practical desktop-thumbnailer
      concerns: rotation metadata, embedded image metadata, raw RGB output, command-line
      argument checks, compatibility with newer FFmpeg, and an optional audio
      thumbnailer.
  related-projects:
    - >
      FFmpeg supplies the decoding layer. File managers and desktop thumbnail services
      are the main integration targets.
  sources:
    - https://github.com/dirkvdb/ffmpegthumbnailer/blob/master/README
    - https://github.com/dirkvdb/ffmpegthumbnailer/blob/master/ChangeLog
    - https://github.com/dirkvdb/ffmpegthumbnailer/releases
    - https://formulae.brew.sh/formula/ffmpegthumbnailer
  summary:
    - >
      ffmpegthumbnailer is a small FFmpeg-based thumbnail generator for video files,
      designed for file managers and other desktop software that need quick previews.
  timeline:
    - '1.0: Initial FFmpegThumbnailer release.'
    - '1.2.0: Added libffmpegthumbnailer library access.'
    - '2.0.10: Migrated to GitHub and CMake.'
    - '2016: Version 2.2.0 added embedded image metadata preference.'
    - '2024: Version 2.2.3 fixed builds against newer FFmpeg and compilers.'
    - '2025: Version 2.3.0 added an optional audio thumbnailer.'
  usage:
    - >
      Typical use is either direct CLI thumbnail generation or integration by a file
      manager/desktop thumbnail service. Because it delegates decoding to FFmpeg, its
      practical media coverage follows the FFmpeg build options available on the system.
related-packages:
  - id: brew:ffmpeg
    reason: >
      FFmpeg is the decoding foundation used by ffmpegthumbnailer, and its enabled
      formats determine which media files can be thumbnailed.
    rel: adjacent_workflow
    sources:
      - https://github.com/dirkvdb/ffmpegthumbnailer
      - https://formulae.brew.sh/formula/ffmpegthumbnailer
      - https://ffmpeg.org/about.html
  - id: brew:geeqie
    reason: >
      Geeqie is a media-browsing application whose Homebrew formula explicitly depends
      on ffmpegthumbnailer for video-preview workflows.
    rel: adjacent_workflow
    sources:
      - https://formulae.brew.sh/formula/geeqie
      - https://formulae.brew.sh/formula/ffmpegthumbnailer
