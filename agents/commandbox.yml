history:
  adoption-history:
    - >
      CommandBox grew as infrastructure around modern CFML development: it integrates
      with ForgeBox for community package distribution, supports embedded CFML servers,
      and provides OS-specific installers and packages. The supplied package-manager
      metadata lists Homebrew, Scoop, and winget, showing that the tool is distributed
      through both Unix-like and Windows package-manager channels.
  package-nerd-significance:
    - >
      CommandBox is significant because it brings npm-style package metadata and CLI
      workflows to the CFML ecosystem. Its `box.json` descriptor, ForgeBox publishing
      flow, Git/HTTP/SVN endpoint support, and cross-platform binary distribution make
      it a package manager as much as a developer shell.
  project-history:
    - >
      The official manual describes CommandBox as a standalone native tool for Windows,
      macOS, and Linux, written in CFML and integrated with the Ortus Box ecosystem
      while remaining extensible for general CFML projects. Ortus also identifies it as
      open source under Apache 2.0.
  related-projects:
    - >
      CommandBox is tied to ForgeBox, ColdBox, ContentBox, TestBox, Lucee, Adobe
      ColdFusion, and the wider Ortus Solutions Box ecosystem.
  sources:
    - https://commandbox.ortusbooks.com/readme.md
    - https://www.ortussolutions.com/products/commandbox
    - https://commandbox.ortusbooks.com/package-management/creating-packages.md
  summary:
    - >
      CommandBox is Ortus Solutions' CFML-oriented command-line environment: a CLI,
      package manager, REPL, embedded server, scaffolding tool, and automation surface
      for ColdFusion and Box-family projects.
  timeline:
    - >
      2010s: CommandBox emerged under Ortus Solutions as Project Gideon for CFML CLI,
      package, REPL, and embedded-server workflows.
    - >
      2017: Ortus site metadata shows the CommandBox product page in the modern products
      navigation.
    - >
      2020s: CommandBox documentation covers Homebrew, Windows installers, Linux
      packages, ForgeBox publishing, embedded servers, and task runners.
    - '2026: Official manual identifies current documentation as CommandBox 6.3.x.'
  usage:
    - >
      Developers use the `box` executable to run shell commands, manage `box.json`
      packages, initialize and publish ForgeBox packages, start embedded CFML servers,
      scaffold applications, and automate workflows from native shells.
