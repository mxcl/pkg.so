config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Yubico distributes the application across desktop and mobile platforms as its
      full-featured companion for USB- and NFC-capable YubiKeys. The same application
      covers authentication and device-management workflows that previously required
      more specialized tools.
  package-nerd-significance:
    - >
      Yubico Authenticator matters to package maintainers because it combines a Flutter
      interface with a platform-specific helper and tightly bounded dependencies.
      Yubico's build documentation explicitly advises packagers to bundle the locked
      dependencies or preserve their upper version bounds.
  project-history:
    - >
      The desktop application was originally developed with Qt under the
      yubioath-desktop name. Yubico subsequently replaced that implementation with the
      current Flutter codebase while retaining the earlier code on a legacy branch.
    - >
      The modern application expanded beyond viewing OATH codes to manage FIDO passkeys
      and fingerprints, PIV certificates and keys, Yubico OTP slots, device
      applications, and factory-reset operations.
  related-projects:
    - YubiKey hardware
    - YubiKey Manager CLI
    - Legacy yubioath-desktop codebase
  sources:
    - >
      Official development guide:
      https://developers.yubico.com/yubioath-flutter/Development.html
    - >
      Official release notes:
      https://developers.yubico.com/yubioath-flutter/Release_Notes.html
    - 'Official repository and README: https://github.com/Yubico/yubioath-flutter'
    - >
      Official user guide:
      https://docs.yubico.com/software/yubikey/tools/authenticator/auth-guide/
  summary:
    - >
      Yubico Authenticator is Yubico's open-source companion application for managing
      YubiKeys and using credentials stored on the hardware device.
  timeline:
    - '2016: Published releases document the earlier yubioath-desktop generation.'
    - '2021: Version 5.1 added management of FIDO-enabled YubiKeys.'
    - >
      2022: Version 6.0 introduced the redesigned Flutter interface, Android support,
      and native Apple silicon support.
    - '2024: Version 7.0 broadened passkey, PIV, OTP, and device-management capabilities.'
  usage:
    - >
      Users connect or tap a YubiKey to view OATH one-time passwords and manage
      supported FIDO, PIV, OTP, and device settings. OATH secrets remain on the
      hardware-backed key, and the core workflows do not require network connectivity.
