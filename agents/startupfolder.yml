id: cask:startupfolder
display-name: Startup Folder
repo: https://github.com/FuzzyIdeas/StartupFolder
docs:
  - https://github.com/FuzzyIdeas/StartupFolder#readme
  - https://lowtechguys.com/startupfolder
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project supports direct installation from its website and explicitly documents
      `brew install --cask startupfolder`, treating Homebrew Cask as a first-class
      installation route.
  package-nerd-significance:
    - >
      Startup Folder turns the familiar folder-as-configuration metaphor into a macOS
      login automation tool. Its documented Homebrew installation and public
      GPL-licensed Swift source make a small desktop utility straightforward to inspect,
      automate, and reproduce.
  project-history:
    - >
      Startup Folder is developed by the Low-Tech Guys and published in the
      `FuzzyIdeas/StartupFolder` repository. The project is implemented for modern macOS
      and released under GPL-3.0.
  related-projects:
    - >
      It overlaps with macOS Login Items and launch agents but offers a folder-driven
      interface for ordinary files, applications, links, scripts, and Shortcuts.
  sources:
    - https://github.com/FuzzyIdeas/StartupFolder
    - https://lowtechguys.com/startupfolder/
    - source_facts.package-manager
  summary:
    - >
      Startup Folder is a macOS startup automation utility. It watches a `Startup`
      directory in the user's home directory and launches the items placed there when
      the user starts a session.
  timeline:
    - >
      The public repository records the application's development and releases across
      dozens of commits.
    - >
      The official site documents support for macOS Sonoma and later and a Homebrew Cask
      installation path.
  usage:
    - >
      Place applications, scripts, links, Shortcuts, or other launchable items in
      `~/Startup`. Apps can be added as aliases, while a Shortcut can be represented by
      an empty file named `Shortcut Name.shortcut`.
    - >
      The app can launch applications hidden, keep selected applications or scripts
      alive, detect crash loops, and expose per-script standard-output and
      standard-error logs.
