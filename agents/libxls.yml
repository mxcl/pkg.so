history:
  adoption-history:
    - >
      libxls spread through Unix package managers because the XLS format remained common
      in public data, research archives, and office exports long after XLSX became the
      default Office format. The R tidyverse readxl package documents libxls as its
      embedded reader for .xls files, which made the library visible to data analysts
      who never installed it directly.
  package-nerd-significance:
    - >
      For package maintainers, libxls is a small example of a compatibility library
      whose value comes from preserving access to awkward legacy binary formats. Its
      1.5-era fuzzing and error-handling work also turned an old parser into something
      more acceptable for distro builds that may process untrusted documents.
  project-history:
    - >
      The public source history records copyright lines for Komarov Valery in 2004,
      Christophe Leitienne in 2006, David Hoerl from 2008 through 2017, and Evan Miller
      from 2013 through 2018. The GitHub project describes the library as a parser for
      Excel files in the old binary OLE format and as the home of a CSV conversion tool.
    - >
      By the 1.5.x series the project had been moved under new maintenance. The project
      README calls out the GitHub hosting move, an in-memory parsing API,
      error-returning internals, fuzz testing, and fixes for security vulnerabilities in
      the 1.4-and-earlier line.
  related-projects:
    - >
      readxl embeds libxls for .xls support and RapidXML for .xlsx support. The library
      also sits near tools that understand Microsoft Compound Document/OLE files and
      older Excel BIFF records.
  sources:
    - >
      https://api.github.com/repos/libxls/libxls/commits/6c45c4adcb80d0575d71306652e201ad01b125c7
    - https://github.com/libxls/libxls
    - https://github.com/libxls/libxls/blob/dev/include/xls.h
    - https://readxl.tidyverse.org/reference/readxl-package.html
  summary:
    - >
      libxls is a C/C++ library and small command-line toolkit for reading the legacy
      binary Excel XLS format. Its package-manager identity is tied to a practical
      problem: extracting data from old spreadsheets without automating Microsoft Excel.
  timeline:
    - "2004: Source copyright records Komarov Valery's early libxls work."
    - '2008: The v0.2.0 tag is associated with a GitHub commit dated 2008-03-30.'
    - '2018: The maintained GitHub line includes Evan Miller copyright years through 2018.'
    - >
      2019: The 1.5.x series marks the project's new-maintenance era with fuzzing and
      security fixes.
  usage:
    - >
      Typical use is either linking the C library to inspect worksheets and cells, or
      running the bundled converter on an XLS file before feeding the result to
      text-based data tools. The library is most relevant when the input is the old
      binary XLS/OLE format rather than OOXML XLSX.
related-packages:
  - id: brew:xlsxio
    reason: >
      Choose XLSX I/O when the spreadsheets use the newer .xlsx format or must be
      written as well as read; libxls is specialized for legacy binary .xls files.
    rel: alternative
    sources:
      - https://github.com/libxls/libxls
      - https://github.com/brechtsanders/xlsxio
