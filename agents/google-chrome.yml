id: cask:google-chrome
display-name: Google Chrome
repo: null
docs:
  - https://support.google.com/chrome
config-file-location:
  linux:
    - ~/.config/google-chrome
  macos:
    - ~/Library/Application Support/Google/Chrome
  windows:
    - '%LOCALAPPDATA%\Google\Chrome\User Data'
credentials-file-location: null
history:
  adoption-history:
    - >
      Chrome grew into a cross-platform browser used by billions of people. It also
      became a principal compatibility target for web developers and gained managed
      deployment and policy facilities for organizations.
  package-nerd-significance:
    - >
      Chrome is a prominent proprietary desktop package built on an open-source
      upstream, Chromium. Package maintainers must distinguish Google's branded binaries
      from Chromium source builds and accommodate Chrome's own updater, channels,
      profile data, and distribution terms.
  project-history:
    - >
      Google launched Chrome in 2008 with an emphasis on speed, security, simplicity,
      process isolation, and increasingly capable web applications. Chrome is based
      substantially on the Chromium open-source project while adding Google branding,
      services, and product-specific components.
    - >
      Google adopted a rapid release model, and Chrome's rendering and JavaScript
      technologies became influential web-platform implementation targets.
  related-projects:
    - Chromium
    - V8
    - Blink
    - ChromeOS
    - Chrome for Testing
  sources:
    - >
      Official 100-release retrospective:
      https://blog.google/products-and-platforms/products/chrome/100-versions-chrome-later-what-we-learned-along-way/
    - 'Official Chrome Help: https://support.google.com/chrome/'
    - >
      Official Chrome history article:
      https://blog.google/products-and-platforms/products/chrome/happy-10th-birthday-chrome-best-yet-come/
    - >
      Official Chromium user-data documentation:
      https://chromium.googlesource.com/chromium/src/+/HEAD/docs/user_data_dir.md
    - source_facts.description
  summary:
    - >
      Google Chrome is Google's proprietary, cross-platform web browser, built
      substantially from the Chromium project.
  timeline:
    - '2008: Google launched Chrome.'
    - "2018: Google marked Chrome's tenth anniversary."
    - '2022: Chrome reached its hundredth major release.'
  usage:
    - >
      People use Chrome for general browsing, web applications, extensions, synchronized
      profiles, password management, and developer tools. Organizations can centrally
      manage Chrome through enterprise policies.
tags:
  - chromium-based
  - cross-platform
  - extensions
