history:
  adoption-history:
    - >
      Kitex's adoption story is tied to CloudWeGo, the ByteDance-originated middleware
      collection launched publicly in September 2021. CloudWeGo documentation and blog
      posts place Kitex beside Hertz, Netpoll, Volo, and other infrastructure projects,
      with the repository and website presenting it as production-oriented middleware
      rather than a tutorial framework.
  package-nerd-significance:
    - >
      Kitex is package-nerd significant because it packages a large-company RPC stack as
      open source Go tooling. It joins a crowded RPC ecosystem with gRPC, Thrift, RPCX,
      and cloud-native service-governance libraries, but carries CloudWeGo's emphasis on
      performance, extensibility, and ByteDance-scale operational lessons.
  project-history:
    - >
      CloudWeGo describes Kitex as its first open source microservice framework.
      CloudWeGo blog material says ByteDance initiated Kitex and related fundamental
      libraries in 2019 to address functionality and performance challenges in a large
      microservice architecture, then released the project for open source contribution
      on GitHub in 2021.
    - >
      The Kitex repository's first release, v0.0.1, was published on July 12, 2021. Its
      documentation and README emphasize Netpoll integration, multiple message
      protocols, service-governance modules, extensibility points, and generated code
      for Thrift and Protobuf services.
  related-projects:
    - >
      Kitex is related to CloudWeGo Netpoll, kitex-contrib, kitex-examples, Hertz, Volo,
      Thrift, Protobuf, gRPC, and RPCX.
  sources:
    - https://api.github.com/repos/cloudwego/kitex/releases?per_page=100
    - https://formulae.brew.sh/formula/kitex
    - https://github.com/cloudwego/kitex
    - https://github.com/cloudwego/kitex/releases
    - >
      https://www.cloudwego.io/blog/2022/09/30/kitex-unifying-open-source-practice-for-a-high-performance-rpc-framework/
    - >
      https://www.cloudwego.io/blog/2023/06/15/cloudwego-a-leading-practice-for-building-enterprise-cloud-native-middleware/
    - >
      https://www.cloudwego.io/blog/2024/01/29/enhancing-performance-in-microservice-architecture-with-kitex/
    - https://www.cloudwego.io/docs/kitex/
    - https://www.cloudwego.io/docs/kitex/overview/
  summary:
    - >
      Kitex is CloudWeGo's Go RPC framework for high-performance, extensible
      microservices, with built-in code generation for Thrift, Protobuf, and scaffold
      code.
  timeline:
    - >
      2019: ByteDance initiated Kitex and related libraries to address microservice
      architecture challenges.
    - '2021-07-12: GitHub release v0.0.1 was published.'
    - '2021-09: CloudWeGo was launched publicly as open source middleware from ByteDance.'
    - '2022-09-30: CloudWeGo published a one-year open source practice article for Kitex.'
    - '2026-05-08: GitHub release v0.16.2 was published.'
  usage:
    - >
      Developers use Kitex to generate service code from IDL definitions and build Go
      RPC clients and servers with configurable transports, protocols, middleware,
      service discovery, load balancing, retries, rate limiting, tracing, logging, and
      diagnostics. Its CLI package is especially relevant because code generation is
      part of the normal Kitex workflow.
related-packages:
  - id: brew:thrift
    reason: >
      Kitex generates Go RPC clients and servers from Thrift IDL and officially supports
      Thrift wire protocols, making the Apache Thrift compiler and ecosystem directly
      relevant.
    rel: adjacent_workflow
    sources:
      - https://www.cloudwego.io/blog/2021/09/13/cloudwego-open-source-announcement/
      - https://thrift.apache.org/docs/
  - id: brew:protobuf
    reason: >
      Kitex supports Protocol Buffers IDL and generated service code, so `protoc`
      belongs in Kitex projects that define services with `.proto` files.
    rel: adjacent_workflow
    sources:
      - https://www.cloudwego.io/blog/2021/09/13/cloudwego-open-source-announcement/
      - https://protobuf.dev/
  - id: brew:grpc
    reason: >
      Kitex officially supports the gRPC protocol, making gRPC tooling useful when
      interoperability with existing gRPC services is required.
    rel: adjacent_workflow
    sources:
      - https://www.cloudwego.io/blog/2021/09/13/cloudwego-open-source-announcement/
      - https://grpc.io/docs/
