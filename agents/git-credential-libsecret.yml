id: brew:git-credential-libsecret
display-name: git-credential-libsecret
repo: https://github.com/git/git
docs:
  - https://git-scm.com/doc/credential-helpers
config-file-location:
  unix:
    - ~/.gitconfig
    - $XDG_CONFIG_HOME/git/config
    - .git/config
credentials-file-location: null
history:
  adoption-history:
    - >
      Git's credential-helper documentation lists git-credential-libsecret alongside
      macOS Keychain and Windows Credential Manager as the Linux secure persistent
      storage option. That placement made it part of the standard Git credential-helper
      ecosystem rather than a standalone password-manager integration.
    - >
      Linux package managers expose it as a separate package because the helper depends
      on libsecret and desktop secret-service libraries that are not always part of a
      minimal Git build.
  package-nerd-significance:
    - >
      For package maintainers, git-credential-libsecret is a small but important split
      from the main Git package. It is tied to desktop-secret-service dependencies, so
      distributing it separately keeps headless or minimal Git installs lean while
      giving Linux desktop users OS-integrated credential storage.
    - >
      It also illustrates Git's extension model: a helper in `contrib/credential` can
      become a distro-facing executable without changing Git's core credential protocol.
  project-history:
    - >
      The helper entered Git's contrib area in 2016. Its initial Git commit describes it
      as based on the earlier GNOME Keyring helper, replacing the deprecated,
      GNOME-specific libgnome-keyring library with libsecret and the XDG Secret Service
      API.
    - >
      Later Git-side changes kept the helper aligned with Git's credential protocol. A
      2017 change made it unlock locked secrets through the Secret Service interface,
      and 2023 changes added storage for password expiry and OAuth refresh-token
      attributes while preserving compatibility with older stored credentials.
  related-projects:
    - >
      git-credential-cache and git-credential-store are Git's built-in generic helpers;
      libsecret fills the Linux secure-storage role.
    - >
      git-credential-osxkeychain and git-credential-wincred are the analogous
      platform-specific helpers for macOS and Windows.
    - >
      Git Credential Manager and git-credential-oauth are related helpers that generate
      or manage credentials through broader authentication workflows.
  sources:
    - >
      https://git-scm.com/doc/credential-helpers lists git-credential-libsecret as the
      Linux secure persistent storage helper.
    - >
      https://git-scm.com/docs/gitcredentials documents Git credential helpers,
      configuration, and helper invocation semantics.
    - >
      https://github.com/git/git documents the upstream Git source history for the
      libsecret helper.
  summary:
    - >
      git-credential-libsecret is Git's Linux Secret Service credential helper. It lets
      Git store and retrieve HTTPS credentials through libsecret-backed wallets such as
      GNOME Keyring or KDE Wallet instead of keeping long-lived credentials in plaintext
      files.
  timeline:
    - >
      2016: Git adds `contrib/credential/libsecret` as a libsecret replacement for the
      GNOME Keyring helper.
    - '2017: The helper learns to unlock locked Secret Service items when reading credentials.'
    - >
      2023: The helper stores Git credential attributes such as password expiry and
      OAuth refresh tokens in a backwards-compatible secret format.
    - '2025: Git fixes compilation of the libsecret helper in contrib.'
  usage:
    - >
      Practitioners configure it through Git's `credential.helper` setting, usually in
      `~/.gitconfig`, `$XDG_CONFIG_HOME/git/config`, or a repository `.git/config`.
      After configuration, Git invokes `git credential-libsecret` through the
      credential-helper protocol during HTTP authentication.
    - >
      Its use case is workstation Git over HTTPS: the first authentication stores a
      username and password, personal access token, or generated token in the desktop
      secret service, and later fetch, pull, and push operations retrieve it without
      prompting.
related-packages:
  - id: brew:git-credential-oauth
    reason: >
      Use git-credential-oauth after libsecret in Git's helper chain when credentials
      should be created through browser-based OAuth and then retained by libsecret.
    rel: adjacent_workflow
    sources:
      - https://github.com/hickford/git-credential-oauth#how-it-works
      - https://git-scm.com/docs/gitcredentials
