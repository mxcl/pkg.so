history:
  adoption-history:
    - >
      Blockstream expanded Green from a Bitcoin wallet into a multi-platform product
      supporting Liquid accounts, hardware wallets, singlesig and assisted multisig
      operation, Tor, watch-only access, and advanced transaction controls.
    - >
      The desktop implementation became part of a broader Blockstream wallet family
      spanning desktop and mobile clients and sharing the Green Development Kit.
  package-nerd-significance:
    - >
      The desktop package is a notable open-source GUI wallet in Bitcoin packaging
      because it combines self-custody, Liquid support, hardware-wallet integration, and
      reproducible release-verification guidance in a conventional cross-platform Qt
      application.
    - >
      Its lineage also illustrates how a consumer wallet can be split into a reusable
      cross-platform SDK, mobile clients, and a separately packaged desktop frontend.
  project-history:
    - >
      Blockstream acquired Bitcoin wallet provider GreenAddress in 2016 and launched
      Blockstream Green Wallet in March 2019. Liquid support followed in July 2019.
    - >
      The Blockstream Green desktop application launched in May 2020. The current Qt
      client is built on Blockstream’s cross-platform Green Development Kit.
    - >
      In July 2025 the product was renamed from Green to Blockstream App. Subsequent
      releases continued to combine Bitcoin, Liquid, Lightning-related flows, wallet
      recovery, and hardware-device support.
  related-projects:
    - GreenAddress
    - Blockstream Green Development Kit (GDK)
    - Blockstream Jade
    - Liquid Network
  sources:
    - https://blockstream.com/about/
    - https://github.com/Blockstream/green_qt
    - https://github.com/Blockstream/green_qt/blob/master/CHANGELOG.md
    - https://github.com/blockstream/gdk
    - https://help.blockstream.com/blockstream-app
  summary:
    - >
      Blockstream App, formerly Blockstream Green, is Blockstream’s open-source,
      non-custodial desktop wallet for Bitcoin and Liquid. It supports software and
      hardware signers and both singlesig and assisted multisig workflows.
  timeline:
    - '2016: Blockstream acquired GreenAddress.'
    - '2019: Blockstream Green Wallet launched.'
    - '2019: Liquid support was added to Green.'
    - '2020: The Blockstream Green desktop application launched.'
    - '2025: Green was renamed Blockstream App.'
  usage:
    - >
      Users create or restore a self-custodial wallet, back up its recovery phrase, and
      use the application to receive, send, and manage Bitcoin or Liquid assets.
    - >
      Advanced uses include pairing Blockstream Jade or other supported hardware
      wallets, configuring Tor or a personal Electrum server, using watch-only access,
      selecting coins, and managing 2FA-protected multisig accounts.
    - >
      The recovery phrase and wallet keys are security-critical credentials, but the
      official sources reviewed do not document a single portable credentials-file path;
      no credentials location is therefore asserted.
