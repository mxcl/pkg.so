history:
  adoption-history:
    - >
      hut is niche by design: it is most useful to SourceHut users who want forge
      operations in scripts or terminal workflows. Package metadata lists distribution
      across Homebrew, Debian, Ubuntu, Fedora-family, Alpine, Arch, Nix, MacPorts, and
      openSUSE ecosystems, which is broad for a forge-specific CLI.
  package-nerd-significance:
    - >
      hut is significant to SourceHut-oriented package users because it mirrors the
      forge's API-first, email-friendly culture in a scriptable binary. It is also a
      good example of a CLI whose package-manager value is higher than its standalone
      fame: without easy packaging, SourceHut automation stays locked behind manual
      web/API calls.
  project-history:
    - >
      The SourceHut project entered public alpha in November 2018 after private
      development, and hut appeared later as a compact CLI companion for that ecosystem.
      The hut refs page shows v0.1.0 in March 2022 and a steady sequence of 0.x releases
      afterward.
    - >
      Release notes show hut tracking SourceHut's expanding service surface. v0.7.0
      added git webhook handling, git setup for send-email configuration, pages ACL
      handling, multi-resource update commands, and a package-maintainer note for
      setting the version via linker flags. v0.8.0 added a version command, meta
      pronouns/avatar handling, hub list/show commands, list and todo preferences, build
      tag filtering and updating, and instance-origin configuration.
  related-projects:
    - >
      hut is tied to the SourceHut suite: git.sr.ht, builds.sr.ht, todo.sr.ht,
      lists.sr.ht, pages.sr.ht, meta.sr.ht, and hub.sr.ht. Its workflows also intersect
      with git send-email and project configuration files.
  sources:
    - >
      SourceHut project pages, hut release refs, the hut repository summary, and package
      metadata were used.
  summary:
    - >
      hut is a command-line client for sr.ht, the SourceHut software forge. It exposes
      SourceHut services from the shell, including git, builds, tickets, patches, pages,
      meta/account features, and hub/project views as those APIs became available.
  timeline:
    - '2018: SourceHut began public alpha.'
    - '2022: hut v0.1.0 was tagged.'
    - '2023: v0.3.0 and v0.4.0 releases expanded the 0.x line.'
    - >
      2025: v0.7.0 added git webhook, git setup, pages ACL, and package-maintainer
      version guidance.
    - >
      2026: v0.8.0 added hub commands, meta profile handling, build tag operations, and
      instance-origin configuration.
  usage:
    - >
      The tool is used for day-to-day sr.ht work from a terminal: cloning and
      configuring repositories, submitting or inspecting builds, handling tickets and
      patches, managing pages, and reading or updating account/project metadata.
related-packages:
  - id: brew:git
    reason: >
      Git is the primary companion for hut's SourceHut repository workflows, and hut can
      configure cloned repositories for the forge's `git send-email` contribution flow.
    rel: adjacent_workflow
    sources:
      - https://git.xenrox.net/~xenrox/hut
      - https://git.xenrox.net/~xenrox/hut/tree/master/item/doc/hut.1.scd
      - https://git-scm.com/docs
  - id: brew:jq
    reason: >
      The hut manual explicitly demonstrates piping `hut graphql` JSON into jq for
      formatting and query-driven processing.
    rel: adjacent_workflow
    sources:
      - https://git.xenrox.net/~xenrox/hut/tree/master/item/doc/hut.1.scd
      - https://jqlang.github.io/jq/manual/
