credentials-file-location: null
history:
  adoption-history:
    - >
      Cobalt remains a niche but durable Rust CLI. crates.io lists `cobalt-bin` with
      tens of thousands of downloads, while Homebrew, Nix, Arch, Scoop, and WinGet
      packaging in the input show that the tool crossed beyond Cargo-only installation.
  package-nerd-significance:
    - >
      Cobalt is useful as a package-history marker for the period when Rust CLIs began
      replacing scripting-language developer tools. Its significance is not mass
      adoption; it is the way it packages a static-site workflow into a native binary
      and ships across Cargo and OS package managers.
    - >
      The package is also a reminder that package names can be ambiguous: crates.io has
      an unrelated `cobalt` crate, while the static site generator's executable package
      is `cobalt-bin`.
  project-history:
    - >
      The GitHub repository was created in 2014, and the changelog records `0.2` as the
      initial release. The project later organized around the `cobalt-org/cobalt.rs`
      repository and publishes the binary crate as `cobalt-bin`.
    - >
      Cobalt's changelog shows the tool growing into a fuller site generator through
      2016 and 2017, adding `serve`, `watch`, `new`, custom paths, RSS improvements,
      draft support, syntax highlighting experiments, generated binaries for macOS,
      Windows, and Linux, and a move from getopt to clap.
  related-projects:
    - >
      Cobalt sits in the static-site-generator family with Jekyll, Hugo, Zola, and
      mdBook, and it uses Rust ecosystem pieces such as Cargo distribution and Rust
      templating/parsing libraries.
    - >
      Its own docs are built and maintained separately in
      `cobalt-org/cobalt-org.github.io`, which the official documentation links as the
      docs source.
  sources:
    - https://github.com/cobalt-org/cobalt.rs
    - https://raw.githubusercontent.com/cobalt-org/cobalt.rs/master/CHANGELOG.md
    - https://cobalt-org.github.io/docs
    - https://cobalt-org.github.io/docs/config
    - https://crates.io/crates/cobalt-bin
  summary:
    - >
      Cobalt is a Rust static site generator distributed as the `cobalt` command,
      packaged for Homebrew and as the `cobalt-bin` crate on crates.io. Its package-nerd
      appeal is that it is an early Rust-era take on the Jekyll-style static site
      workflow: source files, front matter, Liquid-style templates, and a small native
      CLI.
  timeline:
    - '2014: `cobalt-org/cobalt.rs` GitHub repository created.'
    - '2016: `cobalt-bin` crate created on crates.io.'
    - >
      2017: Changelog records generated binaries for macOS, Windows, and Linux in the
      0.5 era and a larger 0.7.0 feature release.
    - '2022: 0.18.0 drops `cobalt import` and improves local serving behavior.'
    - '2025: 0.20.0 switches Sass support from libsass to grass.'
    - '2026: 0.20.4 release published.'
  usage:
    - >
      Users create a site with Cobalt's directory conventions and configure site-wide
      behavior in `_cobalt.yml`. The official docs describe `_cobalt.yml` as the default
      config file for site options, source and destination directories, front matter
      defaults, syntax highlighting, pages, posts, and assets.
    - >
      The day-to-day CLI shape is familiar for static site generators: initialize or
      create content, build static output, and use local serving/watch workflows while
      editing.
related-packages:
  - id: brew:hugo
    reason: >
      Hugo is a mature static-site-generator alternative with a substantially broader
      documentation, theme, module, and asset-pipeline ecosystem.
    rel: alternative
    sources:
      - https://cobalt-org.github.io/docs/
      - https://gohugo.io/documentation/
  - id: brew:zola
    reason: >
      Zola is another Rust-native static-site generator, using CommonMark and Tera
      templates with Sass, search, and live reload built into its workflow.
    rel: alternative
    sources:
      - https://cobalt-org.github.io/docs/
      - https://www.getzola.org/documentation/getting-started/overview/
