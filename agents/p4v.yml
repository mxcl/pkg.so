id: cask:p4v
display-name: P4 Visual Client (P4V)
repo: null
docs:
  - https://help.perforce.com/helix-core/server-apps/p4v/current/Content/P4V/Home-p4v.html
  - https://www.perforce.com/products/helix-core-apps/helix-visual-client-p4v
config-file-location: null
credentials-file-location:
  unix:
    - ~/.p4tickets when the standard P4 ticket store is used (overridable with P4TICKETS)
  windows:
    - >
      %USERPROFILE%\p4tickets.txt when the standard P4 ticket store is used (overridable
      with P4TICKETS)
history:
  adoption-history:
    - >
      P4V became the approachable desktop counterpart to the p4 command line for teams
      using Perforce repositories. Official guides document a consistent interface
      across Windows, macOS, and Linux, making it useful in mixed-platform
      organizations.
    - >
      Its visualization features address workflows common in large, long-lived depots:
      revision graphs expose branching and integration history, while Time-lapse View
      shows how an individual file evolved.
  package-nerd-significance:
    - >
      P4V packages several pieces of the desktop ecosystem together: the main visual
      client, P4 Admin, P4Merge, and the p4vc command-line bridge. Installing the cask
      therefore supplies both a GUI and supporting tools for a P4 workstation.
    - >
      It is particularly relevant where a repository contains assets that are awkward to
      inspect through text-oriented tools, including game, media, and other binary-heavy
      projects.
  project-history:
    - >
      P4V was established as Perforce's cross-platform graphical client by at least the
      2008.1 documentation series. Later guides retained the depot, workspace, and
      changelist model while expanding visual history, streams, custom tools, and
      administration integration.
    - >
      The underlying server product was branded Helix Core from 2016 and returned to the
      P4 name in 2025. Current documentation accordingly calls the application P4 Visual
      Client while retaining the familiar P4V abbreviation.
  related-projects:
    - P4 CLI offers scriptable access to the same server and workspace concepts.
    - P4Merge supplies visual diff and merge functionality.
    - P4 Admin provides graphical server administration and is included by the P4V installer.
    - P4 Code Review integrates collaborative review with P4 repositories.
  sources:
    - https://help.perforce.com/helix-core/server-apps/p4v/2026.1/Content/P4V/install-p4v.html
    - >
      https://help.perforce.com/helix-core/server-apps/p4v/current/Content/P4V/introduction.about.html
    - https://www.perforce.com/blog/vcs/introducing-the-p4-platform
    - https://www.perforce.com/products/helix-core-apps/helix-visual-client-p4v
  summary:
    - >
      P4V is Perforce's cross-platform graphical client for P4 Server. It presents
      depots, workspaces, changelists, streams, branches, file history, merging, and
      administrative workflows through a desktop interface.
  timeline:
    - '2008: An official P4V 2008.1 getting-started guide documented the visual client.'
    - >
      2014: P4V documentation described a common interface across Windows, Mac, UNIX,
      and Linux.
    - >
      2025: Helix Core began returning to the P4 name while the P4V abbreviation
      remained in use.
  usage:
    - >
      Users connect with a server address, user identity, and optional workspace, then
      retrieve files, check them out, organize changes in changelists, and submit them.
      Recent and favorite connections simplify repeated access.
    - >
      Revision Graph and Time-lapse View are commonly used to investigate branch
      integrations and file evolution. P4V can also launch custom tools with the active
      connection's P4PORT, P4USER, P4CLIENT, and related settings.
