history:
  adoption-history:
    - >
      Araelium says Screenflick has been in continuous development since 2007 and has
      received hundreds of updates. The product has persisted through many generations
      of macOS and remains commercially maintained, although official sources do not
      publish user totals.
  package-nerd-significance:
    - >
      Screenflick represents the long-lived commercial Mac utility tradition: a focused
      native application, distributed directly by its developer and also installable as
      a Homebrew cask. Its separate capture-and-export workflow and Screenflick Loopback
      audio device distinguish it from basic one-step recording tools.
  project-history:
    - >
      Screenflick entered continuous development in 2007 as a dedicated Mac screen
      recorder. Over time it accumulated high-resolution and high-frame-rate capture,
      system and microphone audio, camera overlays, cursor and keystroke visualization,
      time-lapse recording, flexible exports, and a proprietary loopback device for
      system-audio capture.
    - >
      The 3.x series continues to receive compatibility and maintenance releases for
      modern macOS versions. Araelium’s archive documents multiple 3.2 and 3.3 updates
      during 2025.
  related-projects:
    - Screenflick Loopback
    - QuickTime Player
    - Final Cut Pro
    - Homebrew Cask
  sources:
    - 'Official Screenflick FAQ: https://store.araelium.com/screenflick-mac-screen-recorder/faq'
    - >
      Official previous-version archive:
      https://www.araelium.com/support/screenflick/download-previous-versions
    - 'Official support center: https://store.araelium.com/support/screenflick'
    - >
      Official usage guide:
      https://store.araelium.com/screenflick-mac-screen-recorder/how-to-use
  summary:
    - >
      Screenflick is a commercial macOS screen recorder from Araelium with capture
      controls for screen video, system and microphone audio, cameras, mouse actions,
      keystrokes, and flexible post-recording export.
  timeline:
    - '2007: Continuous development of Screenflick began.'
    - '2025: The 3.2 series received multiple maintenance releases.'
    - '2025: Screenflick 3.3 was released, followed by 3.3.1 and 3.3.2.'
  usage:
    - >
      Users select screen, audio, microphone, and camera options; choose a window,
      region, or full display; record; then adjust visual overlays and export settings.
      Typical uses include tutorials, calls, software demonstrations, time lapses, and
      gameplay capture.
