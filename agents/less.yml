provenance:
  category-sources:
    - >
      source_facts.description says pager program similar to more; official Greenwood
      Software FAQ says less is a pager for displaying text files.
  display-name-sources:
    - source_facts.name is less; official Greenwood Software site uses less.
  docs-sources:
    - >
      Official Greenwood Software less homepage and FAQ are the primary official
      documentation surfaces available online.
  history-sources:
    - https://github.com/gwsw/less
    - https://www.greenwoodsoftware.com/less/
    - https://www.greenwoodsoftware.com/less/faq.html
  repo-sources:
    - >
      Official Greenwood Software pages direct bug reports/issues to
      github.com/gwsw/less; source_facts.source-archive comes from the official
      Greenwood Software distribution rather than a repository.
  tags-sources:
    - >
      source_facts.description and executables; official FAQ describes less as a
      command-line pager.
category-confidence: high
category-path:
  - system
  - terminal
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: medium
