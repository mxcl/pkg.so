id: brew:less
display-name: less
repo: https://github.com/gwsw/less
docs:
  - https://www.greenwoodsoftware.com/less/faq.html
  - https://www.greenwoodsoftware.com/less/index.html
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/lesskey
    - ~/.config/lesskey
    - ~/.lesskey
    - /usr/local/etc/syslesskey
  windows:
    - ~/_lesskey
    - lesskey.ini
    - c:\syslesskey
credentials-file-location: null
history:
  adoption-history:
    - >
      The official home page describes less as present on most Linux, Unix, and Mac OS
      systems and on many other operating systems. The FAQ also notes distribution
      through standard Unix-like system software and GNU archives.
    - >
      Its adoption is helped by being a drop-in pager for commands and environment
      variables such as PAGER. Developers use it through man, git, shells, build logs,
      and package-manager output without always invoking it directly.
  package-nerd-significance:
    - >
      less is package-nerd bedrock: a tiny command that sits in the path of almost every
      Unix developer workflow. Its value is partly invisible because many tools delegate
      paging to it, making the package a system utility dependency rather than an
      application people consciously launch.
  project-history:
    - >
      The official FAQ says less was written by Mark Nudelman and is maintained by him.
      The source tree's copyright file dates the code line to 1984, and the README
      identifies the distribution as part of the GNU project while also documenting a
      separate Less License option.
    - >
      The program has stayed under active maintenance for decades. Greenwood Software's
      release page records many numbered releases from the 2010s and 2020s, while the
      NEWS file tracks ongoing pager features such as OSC 8 hyperlink handling, command
      mapping, prompt expansion, mouse support, regex behavior, and platform fixes.
  related-projects:
    - more is the older pager less is explicitly compared with.
    - >
      GNU distributes less, and many Unix-like systems ship it as part of their standard
      toolset.
  sources:
    - https://github.com/gwsw/less
    - https://www.greenwoodsoftware.com/less/
    - https://www.greenwoodsoftware.com/less/faq.html
  summary:
    - >
      less is a classic terminal pager: a free, open source program for viewing text one
      screen at a time, similar to more but with richer navigation and search behavior.
  timeline:
    - "1984: The less source copyright line begins with Mark Nudelman's 1984 copyright."
    - '2011: Greenwood Software recorded less-444 as a general-use release on June 9, 2011.'
    - '2021: less-581.2 was released for general use on April 28, 2021.'
    - '2026: less-702 was released for general use on May 22, 2026.'
  usage:
    - >
      less opens files or standard input for interactive viewing, with forward and
      backward movement, searching, marks, filtering, follow mode, and configurable key
      bindings through lesskey-style configuration.
    - >
      Package builds usually install the less and lesskey executables plus manual pages.
      The README recommends downloading numbered release packages from Greenwood
      Software for ordinary use and cloning the Git repository only for source
      development.
related-packages:
  - id: brew:lesspipe
    reason: >
      Add lesspipe when you want less to transparently inspect archives, PDFs, office
      documents, and media metadata through its documented LESSOPEN filter mechanism.
    rel: adjacent_workflow
    sources:
      - https://lesspipe.org/docs.html
      - https://www.greenwoodsoftware.com/less/faq.html
  - id: brew:moor
    reason: >
      Choose Moor as an alternative pager when you prefer built-in syntax highlighting,
      incremental filtering, transparent decompression, and defaults intended to ease
      migration from less.
    rel: alternative
    sources:
      - https://github.com/walles/moor
      - https://www.greenwoodsoftware.com/less/faq.html
tags:
  - cli
  - pager
  - terminal
  - text-viewer
geiger:
  category: appliance
  color: green
  confidence: low
  reason: narrow executable package without higher-risk signals
  reasons:
    - narrow executable package without higher-risk signals
  signals:
