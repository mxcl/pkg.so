config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents binary releases, Debian/Ubuntu installation, distro
      packages through the author's Cloudsmith repository, and Homebrew packaging.
      GitHub metadata shows a small but active open-source utility with wiki
      documentation and cross-platform release artifacts.
    - >
      Homebrew analytics show modest niche use, with 190 installs in the last 365 days
      in the formula API.
  package-nerd-significance:
    - >
      Cascadia is package-nerd useful because it exposes a library-grade CSS selector
      engine as a tiny shell tool. It fits scripts, data-cleaning one-liners, and
      package tests where pulling in a browser or a larger scraper would be excessive.
  project-history:
    - >
      The project began publicly in 2016 under Tong Sun's GitHub account. Its README
      says it started as a thin wrapper around Andy Balholm's Go Cascadia package and
      grew into a more capable selector-testing and extraction tool.
  related-projects:
    - andybalholm/cascadia provides the Go CSS selector package wrapped by this CLI.
    - >
      andrew-d/goscrape is cited by the README as an influence for block and piece
      extraction concepts.
  sources:
    - https://api.github.com/repos/suntong/cascadia
    - https://github.com/suntong/cascadia
    - https://github.com/suntong/cascadia/wiki
    - https://github.com/suntong/cascadia#readme
    - https://formulae.brew.sh/api/formula/cascadia.json
  summary:
    - >
      Cascadia is a Go command-line wrapper around the Go Cascadia CSS selector package,
      aimed at testing selectors and extracting HTML/XML content without writing a Go
      program.
  timeline:
    - '2016: Public GitHub repository created and copyright range begins in the CLI help.'
    - '2025: README example shows version 1.5.0 built on 2025-11-10.'
    - '2026: Homebrew formula packages v1.5.1 and tracks the GitHub release tarball.'
  usage:
    - >
      Users pass an input file or stdin, a CSS selector, and an output target. The tool
      supports text output, raw output, block and piece extraction, wrapped HTML output,
      and CSV/TSV-style table output for scraping workflows.
related-packages:
  - id: brew:htmlq
    reason: >
      Choose htmlq for a compact jq-inspired HTML pipeline with direct text and
      attribute extraction; choose Cascadia when its block-and-piece tabular extraction
      or wrapped-HTML output better fits the job.
    rel: alternative
    sources:
      - https://github.com/suntong/cascadia
      - https://github.com/mgdm/htmlq
