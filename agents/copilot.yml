id: brew:copilot
display-name: AWS Copilot CLI
repo: null
docs:
  - https://aws.github.io/copilot-cli
config-file-location:
  unix:
    - copilot/
credentials-file-location:
  unix:
    - ~/.aws/credentials
    - ~/.aws/config
history:
  adoption-history:
    - >
      Copilot was adopted by developers who wanted a small number of commands around
      ECS, Fargate, App Runner, environments, services, scheduled jobs, secrets, and
      CI/CD without hand-writing all CloudFormation or CDK wiring. Its Homebrew
      distribution made it a natural install for macOS-based AWS and container
      workflows.
  package-nerd-significance:
    - >
      For package maintainers, Copilot is a good example of a cloud vendor CLI that
      packages application templates, deployment orchestration, and generated
      infrastructure state into a single executable. Its retirement also matters:
      package metadata can outlive vendor support, so formula consumers need the history
      to understand why a formerly central AWS tool is now archived.
  project-history:
    - >
      The project was developed by AWS as an application-focused CLI for production
      container workloads. Its repository describes the tool as a way to build, release,
      and operate production-ready containerized applications on AWS App Runner or
      Amazon ECS on AWS Fargate, and the documentation centers on generated Copilot
      manifests and a project-local copilot/ directory.
    - >
      AWS later announced an end-of-support date of June 12, 2026. The official
      repository was archived after that date, which makes the package historically
      important but no longer a forward-looking AWS deployment interface.
  related-projects:
    - >
      AWS Copilot CLI overlaps with lower-level AWS tooling such as the AWS CLI, AWS
      CloudFormation, AWS CDK, Amazon ECS tooling, and App Runner deployment workflows.
  sources:
    - https://github.com/aws/copilot-cli
    - https://github.com/aws/copilot-cli/releases
    - https://aws.github.io/copilot-cli
    - https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Copilot.html
    - >
      https://aws.amazon.com/blogs/containers/announcing-the-end-of-support-for-the-aws-copilot-cli/
  summary:
    - >
      AWS Copilot CLI was AWS's opinionated command-line path for packaging
      containerized applications into Amazon ECS, AWS Fargate, AWS App Runner, and
      related deployment resources. It sat above lower-level AWS APIs and infrastructure
      templates, turning Dockerfile-centered services into repeatable application,
      environment, service, job, and pipeline manifests.
  timeline:
    - '2019: aws/copilot-cli repository created.'
    - '2025: v1.34.1 released as a late official GitHub release.'
    - '2026-06-12: AWS Copilot CLI reached its announced end-of-support date.'
  usage:
    - >
      A typical use created a copilot/ directory in an application repository, then used
      commands such as copilot init and copilot deploy to create AWS infrastructure and
      deploy services. It expected normal AWS credentials from the AWS SDK and CLI
      chain, including ~/.aws/credentials and ~/.aws/config.
related-packages:
  - id: brew:aws-cdk
    reason: >
      AWS recommends CDK as a Copilot migration path when teams need fine-grained
      infrastructure control, reusable constructs, testing, and integration with
      existing CDK stacks.
    rel: alternative
    sources:
      - >
        https://aws.amazon.com/blogs/containers/announcing-the-end-of-support-for-the-aws-copilot-cli/
      - https://docs.aws.amazon.com/cdk/v2/guide/home.html
  - id: brew:awscli
    reason: >
      AWS documents using the AWS CLI to provision ECS Express Mode services, the
      recommended low-overhead migration path for standard containerized web
      applications formerly deployed with Copilot.
    rel: alternative
    sources:
      - >
        https://aws.amazon.com/blogs/containers/announcing-the-end-of-support-for-the-aws-copilot-cli/
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-welcome.html
