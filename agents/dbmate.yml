history:
  adoption-history:
    - >
      Dbmate spread as a simple binary migration tool for teams that wanted SQL
      migrations without adopting a framework-specific migrator. The official README
      documents installation through npm, Homebrew, direct Linux binaries, Scoop on
      Windows, and GitHub Container Registry images, showing how it fits multiple
      package ecosystems.
  package-nerd-significance:
    - >
      Dbmate is package-nerd friendly because it is boring in the best way: one
      self-contained binary, plain SQL files, environment-variable configuration, and no
      service dependency. It is a migration tool that deliberately avoids framework
      lock-in and SaaS upsell, which makes it easy to slot into mixed-language repos.
  project-history:
    - >
      The official GitHub repository was created in November 2015, and its early v0.1
      tag points to a December 2015 commit. The README emphasizes that Dbmate can be
      used with Go, Node.js, Python, Ruby, PHP, Rust, C++, or any other stack, making it
      independent of a web framework's migration system.
  related-projects:
    - >
      The README explicitly frames Dbmate against other database schema migration tools,
      while its supported database targets include MySQL, MariaDB, PostgreSQL, SQLite,
      ClickHouse, BigQuery, and Spanner.
  sources:
    - https://github.com/amacneil/dbmate
    - https://raw.githubusercontent.com/amacneil/dbmate/master/README.md
    - https://api.github.com/repos/amacneil/dbmate
    - >
      https://api.github.com/repos/amacneil/dbmate/git/commits/158ecaa96570a07826ab0c6f20e965f5a15a784e
  summary:
    - >
      Dbmate is a standalone, framework-agnostic database migration tool that keeps
      schemas in sync across developers and production servers. It uses plain SQL
      migrations, timestamped migration files, and a command-line workflow that can be
      shared across languages and frameworks.
  timeline:
    - '2015: Official GitHub repository was created.'
    - '2015: v0.1 tag appears in the official repository.'
    - >
      Present: README documents Dbmate v2-era usage, multi-database support, containers,
      and package-manager installs.
  usage:
    - >
      A typical project stores DATABASE_URL in the environment or a local .env file,
      keeps migration files under ./db/migrations by default, and runs commands such as
      dbmate new, up, migrate, rollback, status, dump, and load. Dbmate also writes
      schema.sql for diffing schema changes in git.
related-packages:
  - id: brew:goose
    reason: >
      Choose goose for a Go-centric migration workflow that can mix SQL with registered
      Go migration functions; choose Dbmate for a framework-neutral standalone binary
      centered on plain SQL and automatic schema dumps.
    rel: alternative
    sources:
      - https://github.com/amacneil/dbmate#readme
      - https://pressly.github.io/goose/
