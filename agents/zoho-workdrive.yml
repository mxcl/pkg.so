history:
  adoption-history:
    - >
      Zoho distributes WorkDrive desktop clients for organizations and individuals who
      need cloud files integrated with local workflows. WorkDrive Sync supports Windows,
      macOS, and Linux, while TrueSync provides a virtual-drive model on supported
      systems.
    - >
      The desktop clients support team folders, role-based operations, selective
      synchronization, offline access, and enterprise-oriented deployment and migration
      workflows.
  package-nerd-significance:
    - >
      WorkDrive illustrates the two dominant desktop cloud-storage models: full local
      synchronization through WorkDrive Sync and on-demand virtual-drive access through
      TrueSync.
    - >
      For package users, the desktop client bridges Zoho's hosted collaboration service
      with Finder or the native filesystem, allowing ordinary desktop tools to work with
      synchronized organizational content.
  project-history:
    - >
      Zoho developed WorkDrive as a cloud file-storage and collaboration service with
      desktop applications that connect hosted team content to local filesystems.
    - >
      The desktop offering expanded from conventional synchronization to TrueSync's
      virtual-drive approach. On macOS, TrueSync was subsequently redesigned around
      Apple's File Provider Extension architecture.
  related-projects:
    - >
      WorkDrive is part of Zoho's broader business-software ecosystem and handles Zoho
      Writer, Sheet, and Show link-file formats in addition to conventional files.
  sources:
    - https://help.zoho.com/portal/en/kb/workdrive/desktop-apps
    - >
      https://help.zoho.com/portal/en/kb/workdrive/desktop-apps/workdrive-truesync/articles/release-notes
    - >
      https://help.zoho.com/portal/en/kb/workdrive/frequently-asked-questions-faqs/desktop-sync-apps/articles/desktop-sync-apps
    - https://www.zoho.com/workdrive/desktop-sync.html
  summary:
    - >
      Zoho WorkDrive is a cloud file-storage and team-collaboration service whose
      desktop clients provide local synchronization or virtual-drive access to hosted
      files.
  timeline:
    - "2024: WorkDrive TrueSync for macOS adopted Apple's File Provider Extension architecture."
    - '2024: Browser-based sign-in became the default TrueSync authentication flow.'
    - '2025: Zoho extended TrueSync support to Linux.'
  usage:
    - >
      Users sign in with a Zoho account and synchronize files between WorkDrive and
      their computer. WorkDrive Sync downloads files for local and offline work;
      TrueSync exposes a virtual drive and downloads content on demand, with selected
      items optionally retained offline.
