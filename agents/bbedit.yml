history:
  adoption-history:
    - >
      BBEdit began as freeware and quickly gained attention for grep pattern matching
      and multi-file search. BBEdit 2.5 became a commercial product in 1993, while the
      free BBEdit Lite served users who did not need the full application.
    - >
      Its longevity, native transition to Mac OS X, command-line tool, scripting
      support, language modules, and continued maintenance have made it a durable editor
      among Mac developers, writers, and system administrators.
  package-nerd-significance:
    - >
      BBEdit is one of the defining native Mac text editors and predates Mac OS X.
      Package enthusiasts value the combination of a polished graphical editor with
      grep, shell integration, scripting, source-control features, and a `bbedit`
      command-line launcher.
    - >
      The Homebrew cask makes installation reproducible, while expert preferences
      exposed through the macOS `defaults` system appeal to users who automate
      workstation setup. Bare Bones cautions users to limit direct preference changes to
      documented keys.
  project-history:
    - >
      Rich Siegel publicly released BBEdit as a freeware Macintosh text editor on April
      12, 1992. Bare Bones Software commercialized BBEdit 2.5 in May 1993 and
      incorporated in 1994.
    - >
      BBEdit 3 added Power Macintosh support, and BBEdit 6.1 became Bare Bones
      Software's first commercial product to run natively on Mac OS X. Continued major
      releases have added extensive code, markup, Unix, source-control, and
      language-aware editing facilities.
  related-projects:
    - BBEdit Lite was the historical free companion to commercial BBEdit.
    - >
      TextWrangler later served as Bare Bones Software's free text editor before its
      capabilities were folded into BBEdit's free mode.
    - The `bbedit` command-line tool connects shell workflows to the graphical editor.
  sources:
    - 'Official BBEdit support index: https://www.barebones.com/support/bbedit/'
    - 'Official BBEdit user manual: https://www.barebones.com/support/bbedit/manual.html'
    - 'Official Bare Bones company history: https://www.barebones.com/company/history.html'
    - >
      Official expert-preferences reference:
      https://www.barebones.com/support/bbedit/ExpertPreferences.html
  summary:
    - >
      BBEdit is Bare Bones Software's long-running native macOS editor for plain text,
      source code, and markup.
  timeline:
    - '1992: Rich Siegel releases BBEdit as freeware for the Macintosh.'
    - '1993: BBEdit 2.5 becomes a commercial product and BBEdit Lite is introduced.'
    - '1994: Bare Bones Software incorporates and BBEdit 3 gains Power Macintosh support.'
    - >
      2001: BBEdit 6.1 becomes the company's first commercial product to run natively on
      Mac OS X.
    - >
      2020s: BBEdit remains actively developed with code, markup, Unix, Git, and
      language-server workflows.
  usage:
    - >
      BBEdit is used for text and code editing, grep-based searches, multi-file
      transformations, markup work, projects, source control, remote-file access, and
      Unix-oriented workflows. Its command-line tool opens local files and FTP/SFTP URLs
      in the application.
    - >
      Most preferences are managed in the application. Documented expert settings can be
      changed with `defaults write com.barebones.bbedit …`, but the official
      documentation does not identify a supported, stable preferences-file pathname
      suitable for direct editing, so no config-file location is reported.
