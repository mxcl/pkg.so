credentials-file-location: null
history:
  adoption-history:
    - >
      RustQC is published as a standalone executable, container image, Cargo package,
      and reusable Rust library; the supplied record also documents Homebrew packaging.
    - >
      The RNA workflow is designed to fit into nf-core/rnaseq while remaining usable as
      a standalone command, giving it a bridge between workflow-oriented bioinformatics
      and conventional Unix packaging.
  package-nerd-significance:
    - >
      RustQC is part of the 'rewrite it in Rust' strand of scientific tooling: it
      consolidates a dependency-heavy collection of R, Python, and C/C++ programs into a
      compiled binary with no runtime dependencies.
    - >
      Its compatibility-oriented outputs are significant for pipeline maintainers
      because they aim to preserve established file formats and MultiQC integration
      while reducing staging, process startup, and repeated BAM traversal.
  project-history:
    - >
      Seqera developed RustQC as a fast Rust implementation of established sequencing
      quality-control methods. Its RNA command combines work traditionally performed by
      dupRadar, featureCounts, RSeQC, Qualimap, preseq, and samtools.
    - >
      The project documents that AI coding agents substantially assisted development and
      that correctness is assessed through comparisons with the original tools on real
      sequencing data.
  related-projects:
    - >
      RustQC reimplements or reproduces workflows associated with dupRadar,
      featureCounts, RSeQC, Qualimap, preseq, and samtools.
    - >
      It produces outputs intended for consumption by MultiQC and is designed to fit the
      nf-core/rnaseq pipeline.
  sources:
    - https://github.com/seqeralabs/RustQC
    - https://seqeralabs.github.io/RustQC/
    - https://seqeralabs.github.io/RustQC/getting-started/introduction/
    - https://seqeralabs.github.io/RustQC/usage/configuration/
    - source_facts.package-manager
  summary:
    - >
      RustQC is a compiled sequencing quality-control toolkit written in Rust. Its
      principal RNA-seq workflow accepts SAM, BAM, or CRAM data and combines numerous
      established analyses into a single command and largely single-pass workflow.
  timeline:
    - >
      2026: RustQC was available through Seqera's official repository, documentation
      site, binary releases, containers, Cargo, and Homebrew packaging.
  usage:
    - >
      A typical RNA-seq run supplies an aligned BAM file and GTF annotation to `rustqc
      rna`, optionally enabling paired-end mode and selecting an output directory.
    - >
      Advanced settings can be loaded from system and user XDG YAML files, the
      `RUSTQC_CONFIG` environment variable, or an explicit `--config` path.
      Higher-priority sources and command-line flags override discovered configuration.
