history:
  adoption-history:
    - >
      Mini vMac expanded rapidly beyond its original Macintosh host: Windows support
      arrived in 2001, followed by an X Window System port. Later releases added
      additional emulated Macintosh models and many host-platform variations.
    - >
      Its small footprint and continued availability made it a practical preservation
      tool for running early Macintosh systems and applications on modern hardware.
  package-nerd-significance:
    - >
      Mini vMac is valued in retrocomputing because it is compact, portable, open
      source, and deliberately focused on Motorola 680x0 Macintosh hardware. It offers a
      relatively direct way to preserve and exercise classic software environments.
    - >
      The project distributes many compile-time variations rather than treating every
      emulated machine and host option as runtime configuration, making its build and
      packaging system part of its technical identity.
  project-history:
    - >
      Mini vMac descends conceptually and technically from vMac and is part of Paul C.
      Pratt's Gryphel Project. Its first public release was version 0.1.0 in February
      2001.
    - >
      The emulator initially focused on the Macintosh Plus and later added variations
      for systems including the Macintosh 128K and Macintosh SE. Its official pages
      moved to SourceForge in 2004 and returned to the Gryphel site in 2014.
  related-projects:
    - vMac is the earlier emulator from which Mini vMac originated.
    - The Gryphel Project is Mini vMac's parent project.
    - >
      CopyRoms is an accompanying utility for obtaining ROM images from supported
      physical Macintosh computers.
  sources:
    - https://www.gryphel.com/c/minivmac/
    - https://www.gryphel.com/c/minivmac/start.html
    - https://www.gryphel.com/c/news/nva0.html
    - https://www.gryphel.com/c/news/nva4.html
  summary:
    - >
      Mini vMac is a free and open-source emulator for early Motorola 680x0-based Apple
      Macintosh computers. It is designed to run classic Macintosh system software and
      applications on modern hosts.
  timeline:
    - '2001: Mini vMac 0.1.0 became the first public release.'
    - '2001: Windows and X Window System ports followed the initial release.'
    - >
      2004: Emulation variations for the Macintosh 128K family were introduced and the
      project pages moved to SourceForge.
    - '2005: Version 2.6.1 added a Macintosh SE variation.'
    - '2014: The project pages returned to the Gryphel site.'
  usage:
    - >
      A typical setup places a legally obtained Macintosh ROM image named vMac.ROM where
      Mini vMac can find it, then boots a compatible classic Mac disk image.
    - >
      Users employ it for software preservation, retrocomputing, historical development
      environments, and running old games or productivity applications.
