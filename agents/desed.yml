config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README lists several package routes, including Alpine Linux, Arch
      AUR, DragonFly BSD, Fedora, FreeBSD, Void Linux, Cargo, source builds, and
      precompiled GitHub releases. That spread reflects a small but real command-line
      audience across Unix-like package ecosystems.
  package-nerd-significance:
    - >
      desed is notable because it gives a classic Unix stream editor the kind of
      interactive debugger usually associated with larger programming languages. For
      package collectors, it is a niche but memorable text-processing tool: small,
      Rust-based, and aimed at people who write enough sed to need a debugger.
  project-history:
    - >
      The maintainer describes desed as a first Rust project built because sed lacked
      comfortable debugging tooling. The project reached public 1.x releases by 2020 and
      had a v1.2.2 release in 2024.
  related-projects:
    - >
      Related tools include GNU sed itself and sed programs such as sedtris, which the
      README references as an example of complex sed usage.
  sources:
    - https://github.com/SoptikHa2/desed#readme
    - https://github.com/SoptikHa2/desed/releases/tag/v1.2.0
    - https://github.com/SoptikHa2/desed/releases/tag/v1.2.2
  summary:
    - >
      desed is a terminal user-interface debugger for sed scripts. It wraps GNU sed's
      debugging capability with interactive stepping, breakpoints, reverse stepping, hot
      reload, and state inspection.
  timeline:
    - '2020: v1.2.0 added autoreload and BSD support.'
    - '2022: v1.2.1 fixed BSD file-watch support on armv7.'
    - '2024: v1.2.2 was published.'
  usage:
    - >
      Users run desed to step through sed programs, inspect pattern and hold-space
      state, preview substitutions, place breakpoints, and reload edited scripts while
      staying in a terminal UI.
related-packages:
  - id: brew:gnu-sed
    reason: >
      Install GNU sed alongside desed because desed uses GNU sed's debugging interface
      at runtime; GNU sed is also the direct tool for executing the scripts after
      debugging.
    rel: adjacent_workflow
    sources:
      - https://github.com/SoptikHa2/desed#readme
      - https://www.gnu.org/software/sed/manual/sed.html
