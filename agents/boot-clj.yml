config-file-location:
  unix:
    - $BOOT_HOME/boot.properties
    - ./boot.properties
    - $BOOT_HOME/profile.boot
    - ./profile.boot
    - ./build.boot
    - ./.bootignore
credentials-file-location:
  unix:
    - $BOOT_HOME/credentials.gpg
    - ~/.lein/credentials.clj.gpg
history:
  adoption-history:
    - >
      Boot was adopted inside the Clojure community as an alternative to Leiningen-style
      project configuration, especially for workflows needing composable pipelines,
      ClojureScript builds, REPL-driven automation, and single-file scripts. The
      official README lists package-manager installation paths through Homebrew, Nix,
      AUR, Docker, Chocolatey, and Scoop, showing that it crossed from library ecosystem
      tooling into OS package collections.
  package-nerd-significance:
    - >
      Boot is interesting to package nerds because it is both a package and a package
      bootstrapper: the installed command is a shim, while the real tool comes from
      Maven coordinates. It also illustrates a Clojure-era preference for programmable
      build logic, fileset immutability, and REPL-friendly build automation rather than
      declarative-only project files.
  project-history:
    - >
      Boot's own README describes it as both a Clojure build framework and an ad-hoc
      Clojure script evaluator. Instead of treating a build as a static project map,
      Boot evaluates Clojure scripts in a runtime environment that can add dependencies,
      compose tasks, and pass managed filesets between task middleware.
    - >
      The public release line visible in the official GitHub releases starts with 2.0.0
      prereleases in late 2014, moves through 2.0 release candidates in early 2015, and
      continues through the 2.7 and 2.8 series. The 2.8.3 release in April 2019 is the
      last stable release shown in the sampled GitHub release metadata.
  related-projects:
    - >
      Related projects include Clojure itself, Maven repositories used for dependency
      resolution, Leiningen credentials compatibility noted in the curation data,
      boot-bin wrapper releases, and ClojureScript build workflows documented by the
      Boot project.
  sources:
    - https://boot-clj.github.io/
    - https://github.com/boot-clj/boot#readme
    - https://github.com/boot-clj/boot/releases/tag/2.0.0-pre28
    - https://github.com/boot-clj/boot/releases/tag/2.8.3
  summary:
    - >
      Boot is a Clojure build framework and command-line script runner built around the
      idea that builds are programs. Its historical niche was giving Clojure projects
      programmable build pipelines, immutable filesets, classloader isolation, and
      ad-hoc scripting before the newer Clojure CLI tooling became common.
  timeline:
    - '2014: Boot 2.0.0 prereleases appear on GitHub.'
    - '2015: Boot 2.0.0 release-candidate series continues.'
    - '2016: Boot 2.6.0 and 2.7.x releases published.'
    - '2018: Boot 2.8.0 and 2.8.x releases published.'
    - '2019: Boot 2.8.3 published on GitHub.'
  usage:
    - >
      Users run `boot` with tasks such as `repl`, `pom`, `jar`, and `install`, or write
      a `build.boot` script that composes tasks in Clojure. The wrapper script or
      executable is a thin launcher that downloads and runs Boot's JARs from Maven, so
      `boot -u` historically handled updating the runtime bits.
related-packages:
  - id: brew:leiningen
    reason: >
      Choose Leiningen for the established `project.clj`-based Clojure project workflow;
      Boot instead models builds as composable Clojure task pipelines and can reuse
      Leiningen's encrypted credentials file.
    rel: alternative
    sources:
      - https://github.com/boot-clj/boot#readme
      - https://github.com/boot-clj/boot/wiki/Repository-Credentials-and-Deploying
      - https://github.com/technomancy/leiningen#readme
  - id: brew:clojure
    reason: >
      Choose the official Clojure CLI for modern `deps.edn` dependency and tool
      execution workflows when Boot's fileset and task-middleware build model is
      unnecessary.
    rel: alternative
    sources:
      - https://github.com/boot-clj/boot#readme
      - https://clojure.org/reference/clojure_cli
      - https://clojure.org/reference/deps_edn
