id: cask:repetier-host
display-name: Repetier-Host
repo: https://github.com/repetier/Repetier-Host-Mac
docs:
  - https://www.repetier.com/documentation/repetier-host-mac
  - https://www.repetier.com/documentation/repetier-host-mac/installation-and-connection
config-file-location:
  macos:
    - ~/Library/Preferences/com.repetier.Repetier-Host-Mac.plist
    - ~/Library/Application Support/Slic3r
credentials-file-location: null
history:
  adoption-history:
    - >
      Repetier positions the Host as compatible with most FDM printers and documents
      more than 500,000 installations across the Host family. Printer manufacturers have
      also shipped customized, branded editions with predefined drivers, printer,
      slicer, and filament settings.
  package-nerd-significance:
    - >
      Repetier-Host reflects the RepRap-era integrated host model: one desktop package
      arranges models, invokes slicers, previews G-code, streams commands, and manually
      controls the printer. Its bundled or integrated relationships with Slic3r,
      CuraEngine, Skeinforge, Repetier-Firmware, and Repetier-Server make it a useful
      record of the early open desktop-3D-printing software stack.
  project-history:
    - >
      Repetier-Host was created to manage RepRap-style 3D printers and was optimized for
      Repetier-Firmware while retaining compatibility with other common firmware
      families. A distinct Objective-C Mac edition was published in the official
      Repetier GitHub organization under an Apache 2.0 license.
    - >
      The wider Host family developed into an all-in-one workflow covering build-plate
      arrangement, slicing, G-code inspection, direct printing, and monitoring. Repetier
      later positioned Repetier-Server as a complementary always-on and
      browser-accessible print service.
  related-projects:
    - Repetier-Firmware is the closely integrated printer firmware.
    - >
      Repetier-Server provides remote, browser-based printer control and can print
      without keeping Repetier-Host running.
    - >
      Slic3r, CuraEngine, and Skeinforge are slicers integrated with or distributed
      alongside editions of Repetier-Host.
  sources:
    - 'Official Mac manual: https://www.repetier.com/documentation/repetier-host-mac/'
    - 'Official Mac repository: https://github.com/repetier/Repetier-Host-Mac'
    - >
      Official Repetier forum path guidance:
      https://forum.repetier.com/d/9794-preferences-file
    - 'Official Repetier-Host page: https://www.repetier.com/documentation/repetier-host/'
  summary:
    - >
      Repetier-Host is a desktop control suite for FDM 3D printers that arranges models,
      drives slicers, previews and edits G-code, and sends jobs to compatible printers.
  timeline:
    - >
      RepRap era: Repetier-Host emerged as host software for RepRap-style printers, with
      dedicated Windows/Linux and Mac implementations.
    - 'Mac 0.32: The official Mac documentation says automatic updating was added.'
    - >
      Integrated-suite era: The Host combined multiple slicers and added close
      integration with Repetier-Firmware and Repetier-Server.
  usage:
    - >
      A typical workflow imports STL models, arranges and scales them on a virtual build
      plate, slices them into G-code, previews the toolpath, and sends the job over USB,
      TCP/IP, or removable media.
    - >
      Printer profiles store connection parameters, build dimensions, movement rates,
      temperatures, and event scripts. Manual controls can move axes, set heaters and
      fans, issue raw G-code, and monitor printer responses.
