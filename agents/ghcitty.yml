id: brew:ghcitty
display-name: ghcitty
repo: null
docs:
  - https://github.com/mattlianje/ghcitty#readme
config-file-location:
  unix:
    - ~/.ghcitty
credentials-file-location: null
history:
  adoption-history:
    - >
      The project had only a short public history at the time of this enrichment run, so
      adoption evidence is limited to its Homebrew formula, Cargo installation
      instructions, Nix installation instructions, and repository-level documentation.
      Its significance is therefore best treated as emerging rather than established.
  package-nerd-significance:
    - >
      ghcitty is package-nerd-interesting as a tiny wrapper around an existing language
      REPL: it adds a modern terminal interface without asking users to abandon Cabal,
      Stack, GHCi commands, Hoogle, or editor-based workflows.
  project-history:
    - >
      The public repository was created in April 2026 and describes ghcitty as part of
      the author's d4 collection. Its README presents the tool as a personal, modest
      frontend rather than a replacement for GHCi.
  related-projects:
    - >
      The README positions ghcitty around GHCi, Cabal, Stack, GHCup, Hoogle, and the
      author's d4 collection.
  sources:
    - https://api.github.com/repos/mattlianje/ghcitty
    - https://github.com/mattlianje/ghcitty
    - https://github.com/mattlianje/ghcitty/releases/tag/v0.2.0
    - https://raw.githubusercontent.com/mattlianje/ghcitty/master/README.md
  summary:
    - >
      ghcitty is a Rust frontend for GHCi that keeps the normal Haskell REPL underneath
      while adding terminal niceties such as highlighting, completion, multiline
      editing, Hoogle lookup, session replay, and auto-reload.
  timeline:
    - '2026: The GitHub repository was created.'
    - '2026: README documents Cargo, source, Nix, Stack, and Cabal-oriented usage.'
    - '2026: v0.2.0 was published as an official GitHub release.'
  usage:
    - >
      Practitioners run ghcitty in a Haskell project directory and let it auto-detect
      Stack or Cabal projects, or pass `--plain` to force bare GHCi. The README also
      documents one-shot eval, JSON output, named sessions, persistent replay under
      `~/.local/share/ghcitty/<session>.hs`, and a simple `~/.ghcitty` key-value config
      file.
related-packages:
  - id: brew:ghcid
    reason: >
      Choose ghcid when the main need is a deliberately minimal save-triggered GHCi
      reload and test loop rather than an enhanced interactive REPL interface.
    rel: alternative
    sources:
      - https://github.com/mattlianje/ghcitty#readme
      - https://github.com/ndmitchell/ghcid#readme
  - id: brew:cabal-install
    reason: >
      ghcitty detects Cabal projects and can launch within their project-aware REPL
      context, while cabal-install manages the build plan and dependencies.
    rel: adjacent_workflow
    sources:
      - https://github.com/mattlianje/ghcitty#readme
      - https://cabal.readthedocs.io/en/stable/getting-started.html
  - id: brew:haskell-stack
    reason: >
      ghcitty detects `stack.yaml` and can use Stack's GHCi environment for
      snapshot-based projects.
    rel: adjacent_workflow
    sources:
      - https://github.com/mattlianje/ghcitty#readme
      - https://docs.haskellstack.org/en/stable/
  - id: brew:ghcup
    reason: >
      GHCup installs and selects the GHC executable that ghcitty wraps, which is useful
      when projects require different compiler releases.
    rel: adjacent_workflow
    sources:
      - https://github.com/mattlianje/ghcitty#readme
      - https://www.haskell.org/ghcup/guide/
