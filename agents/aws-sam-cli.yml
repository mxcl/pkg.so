id: brew:aws-sam-cli
display-name: AWS SAM CLI
repo: https://github.com/aws/aws-sam-cli
docs:
  - >
    https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-command-reference.html
  - >
    https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
  - >
    https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli.html
  - https://github.com/aws/aws-sam-cli#readme
config-file-location:
  unix:
    - samconfig.toml
    - samconfig.yaml
    - samconfig.yml
credentials-file-location:
  unix:
    - ~/.aws/credentials
  windows:
    - C:\Users\USERNAME\.aws\credentials
history:
  adoption-history:
    - >
      SAM CLI adoption tracks the broader AWS serverless workflow. It gives local and CI
      users a packageable command named sam while the SAM template language remains
      CloudFormation-compatible infrastructure definition.
    - >
      The supplied package facts list Homebrew, Nix, Scoop, and winget availability,
      which matches a cross-platform AWS developer tool: local laptops, CI runners, and
      onboarding scripts all need a stable installer story.
  package-nerd-significance:
    - >
      For package maintainers, SAM CLI is a heavyweight Python/AWS developer tool whose
      release cadence matters because AWS service behavior, Lambda runtimes, and local
      emulation expectations move quickly. The executable is small from the user's point
      of view but represents a large AWS workflow surface.
  project-history:
    - >
      The repository's public history begins in August 2017 as AWS SAM Local CLI, with
      early tags starting at v0.1.0. The README describes AWS SAM as an open-source
      framework with shorthand syntax for functions, APIs, databases, and event source
      mappings, and identifies this repository as the SAM CLI source code.
    - >
      Over time the CLI became the everyday developer entry point for SAM: local
      Lambda-like execution, Docker-backed testing, packaging, deployment, guided
      configuration, and command references live in AWS's Serverless Application Model
      developer guide.
  related-projects:
    - AWS Serverless Application Model is the template framework the CLI operates on.
    - AWS CloudFormation is the deployment substrate SAM extends.
    - Docker is used by SAM CLI for local Lambda-like execution workflows.
  sources:
    - >
      https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-command-reference.html
    - >
      https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
    - >
      https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli.html
    - https://github.com/aws/aws-sam-cli#readme
    - official git history and tags from https://github.com/aws/aws-sam-cli
  summary:
    - >
      AWS SAM CLI is the command-line companion to the AWS Serverless Application Model,
      used to build, test, debug, package, and deploy serverless applications defined
      with SAM templates.
  timeline:
    - '2017: Repository history begins as AWS SAM Local CLI and v0.1.0 is tagged.'
    - '2018: v0.x releases add and evolve SAM CLI functionality.'
    - >
      2020: README screenshots and docs show SAM CLI as the front door for local
      build/test/deploy workflows.
    - '2026: v1.x development tags show continuing active release work.'
  usage:
    - >
      Typical commands include sam init, sam build, sam local invoke, sam local
      start-api, sam deploy, and guided configuration flows. The official docs describe
      a project-level SAM CLI configuration file for command parameter values.
    - >
      The default config name is samconfig at the project root next to template.yaml,
      with TOML as the default format and YAML/YML also supported. AWS credentials are
      inherited from the standard AWS SDK/CLI credential chain, including shared
      credentials files.
related-packages:
  - id: brew:awscli
    reason: >
      AWS documents AWS CLI as the companion used to configure the credentials and
      profiles that SAM CLI consumes for builds and deployments against AWS.
    rel: adjacent_workflow
    sources:
      - >
        https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/prerequisites.html
      - >
        https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli-configure.html
      - https://github.com/aws/aws-cli
