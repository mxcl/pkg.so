history:
  adoption-history:
    - >
      Panoply was packaged for macOS, Windows, Linux, and other Java-capable desktops
      early in its life. It subsequently gained remote URL access, support for
      additional scientific formats and conventions, vector and animation exports, and
      links to NASA-authored workflows for Earth-observation data.
    - >
      Its long-running NASA GISS distribution and reliance on Unidata's netCDF-Java
      library made it a convenient graphical inspection tool for climate, atmospheric,
      oceanographic, and other multidimensional scientific datasets.
  package-nerd-significance:
    - >
      Panoply is useful when a full scientific programming environment would be
      excessive: it can quickly inspect metadata, slice multidimensional arrays, compare
      variables, and export publication or presentation graphics. Package users should
      note that it is a Java desktop application rather than a command-line netCDF
      processor.
  project-history:
    - >
      Robert Schmunk developed Panoply at NASA's Goddard Institute for Space Studies.
      Version 1.0 was released in December 2002 with an initial emphasis on
      latitude-longitude climate-model arrays; later generations broadened the program
      to generic two-dimensional arrays, line plots, trajectories, remote catalogs, many
      map projections, and modern export formats.
    - >
      Version 4 in 2014 substantially refactored gridding and added generic 2D and
      time-series plotting. Panoply 5 moved plot controls to floating palettes and
      continued updating netCDF-Java and the shared NASA GISS mapping libraries.
  related-projects:
    - Unidata netCDF-Java provides core scientific-data access.
    - NASA GISS G.Projector shares mapping concepts and libraries with Panoply.
    - >
      Panoply can browse THREDDS and OPeNDAP catalogs and open remote HTTP, HTTPS, and
      S3 datasets.
  sources:
    - https://www.giss.nasa.gov/tools/panoply/
    - https://www.giss.nasa.gov/tools/panoply/changelog/
    - https://www.giss.nasa.gov/tools/panoply/changelog/changelog1.html
    - https://www.giss.nasa.gov/tools/panoply/changelog/changelog4.html
    - https://www.giss.nasa.gov/tools/panoply/credits.html
  summary:
    - >
      Panoply is NASA GISS's cross-platform Java viewer for plotting and exploring
      georeferenced and other multidimensional arrays stored in netCDF, HDF, GRIB, and
      related formats.
  timeline:
    - '2002-12-05: Panoply 1.0 was released.'
    - '2004-06-21: A Windows-specific distribution appeared with version 1.4.1.'
    - '2014-04-09: Version 4.0 added generic 2D, time-oriented, and line plotting.'
    - >
      2022-06-22: Version 5.1.0 moved the baseline to Java 11 and introduced unified
      floating controls.
  usage:
    - >
      Open a local scientific-data file, remote dataset URL, S3 object, or supported
      catalog; select a variable and dimensions; then create map, contour, trajectory,
      or line plots. Plots can be combined or exported to bitmap, PDF, PostScript, SVG,
      KMZ, or MP4 formats.
