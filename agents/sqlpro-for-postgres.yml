history:
  adoption-history:
    - >
      SQLEditor has been distributed as a commercial native Mac application across
      multiple macOS generations. Its official download archive preserves releases for
      systems from OS X 10.5 onward, while Homebrew Cask provides a package-managed
      installation route for the current application.
  package-nerd-significance:
    - >
      SQLEditor bridges visual schema design and text-oriented development workflows. It
      can round-trip SQL through the clipboard and files, reverse-engineer live
      databases, generate dialect-specific DDL, and work with Ruby on Rails migrations,
      making it useful alongside command-line database clients and migration tools.
  project-history:
    - >
      SQLEditor is an independently developed graphical database-design tool from
      MalcolmHardie Solutions. Its official release history records the 1.2 release in
      April 2006, followed by major generations that added broader import, export,
      diffing, reporting, and extensibility features.
    - >
      The third generation consolidated the interface and introduced a JavaScript
      plug-in system and report generator. SQLEditor 4 subsequently added Apple Silicon
      support and further import, export, and reliability work.
  related-projects:
    - >
      SQLEditor interoperates with MySQL, PostgreSQL, SQLite, Oracle, Microsoft SQL
      Server, and other databases through built-in support or JDBC drivers.
    - >
      Its Rails schema and migration support places it alongside framework migration
      tools, while its diagramming and DDL generation overlap with conventional
      entity-relationship modeling applications.
  sources:
    - https://www.malcolmhardie.com/sqleditor/
    - https://www.malcolmhardie.com/sqleditor/releases/4.0.3/releasenotes.html
    - https://www.malcolmhardie.com/support/sqleditor/
    - https://www.malcolmhardie.com/support/sqleditor/manual/v4/applehelp/
  summary:
    - >
      SQLEditor is a proprietary native macOS application for visually designing
      relational database schemas, reverse-engineering existing databases, and
      generating database-specific SQL.
  timeline:
    - '2006: SQLEditor 1.2 was released.'
    - '2012: The second major generation was documented and released.'
    - '2015: Documentation was updated for SQLEditor 3.'
    - '2022: SQLEditor 4 reached its release generation with Apple Silicon support.'
    - '2023: Version 4.0.3 delivered additional stability fixes.'
  usage:
    - >
      Users create tables, columns, indexes, and foreign-key relationships graphically,
      or import schemas from SQL text and live databases. Designs can be exported as
      dialect-specific DDL, database updates, Rails migrations, diagrams, or generated
      reports.
