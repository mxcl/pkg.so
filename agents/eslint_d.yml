id: brew:eslint_d
display-name: eslint_d
repo: https://github.com/mantoni/eslint_d.js
docs:
  - https://github.com/mantoni/eslint_d.js#readme
config-file-location: null
credentials-file-location:
  unix:
    - RESOLVED_ESLINT_INSTALLATION/.eslint_d
history:
  adoption-history:
    - >
      eslint_d found its niche in editor-driven JavaScript development, especially Vim,
      Neovim, Emacs, and other environments where a linter may be invoked repeatedly for
      a single buffer. The README documents integrations for editor linting packages and
      notes that some editors already cache ESLint themselves.
  package-nerd-significance:
    - >
      Its significance is mostly ergonomic: it is a small package-manager-era workaround
      for the cost of repeatedly starting a large JavaScript toolchain. Package nerds
      care because it shows how wrapper commands, local dependency resolution, daemon
      files, and editor integrations can change perceived tool speed without changing
      the underlying linter.
  project-history:
    - >
      The npm package was first published in 2015, shortly after ESLint 1.0.0, and its
      upstream README still presents it as a workflow accelerator rather than a
      replacement linter. It supports multiple ESLint generations and forwards normal
      ESLint arguments to a background server.
  related-projects:
    - >
      eslint_d is directly tied to ESLint and overlaps in use with editor integrations
      that cache ESLint processes internally.
  sources:
    - https://github.com/mantoni/eslint_d.js
    - https://www.npmjs.com/package/eslint_d
    - https://formulae.brew.sh/formula/eslint_d
  summary:
    - >
      eslint_d is a daemonized wrapper around ESLint that keeps an ESLint server process
      alive so repeated lint runs from editors and shells avoid much of Node.js startup
      and module-loading cost.
  timeline:
    - '2015: eslint_d first published to npm.'
    - '2024: v14.2.0 adds documented debug mode.'
    - '2026: v15.x line supports modern ESLint and Node.js versions.'
  usage:
    - >
      Users install `eslint_d`, run it as a drop-in `eslint` replacement, and let it
      start, stop, or restart the daemon automatically. It can use the local project
      ESLint package, fall back to a bundled ESLint, report daemon status, and provide
      an extra `--fix-to-stdout` option for editor save hooks.
related-packages:
  - id: brew:eslint
    reason: >
      ESLint is the underlying linter that eslint_d executes, and a project-local
      installation lets eslint_d use that project's exact rules, plugins, and
      configuration.
    rel: adjacent_workflow
    sources:
      - https://github.com/mantoni/eslint_d.js#readme
      - https://eslint.org/docs/latest/use/getting-started
