id: cask:nethlink
display-name: NethLink
repo: null
docs:
  - https://github.com/NethServer/nethlink#readme
config-file-location:
  linux:
    - ~/.config/nethlink/user_data.json
    - ~/.config/nethlink/available_users.json
  macos:
    - ~/Library/Application Support/nethlink/user_data.json
    - ~/Library/Application Support/nethlink/available_users.json
  windows:
    - '%APPDATA%/nethlink/user_data.json'
    - '%APPDATA%/nethlink/available_users.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      The project officially supports package-based installation through Homebrew on
      macOS and Winget on Windows, with an AppImage workflow for Linux. This gives
      NethServer administrators a consistent desktop access tool across the principal
      desktop platforms.
  package-nerd-significance:
    - >
      NethLink is relevant to package users as a small, open-source administrative
      client tied to the NethServer ecosystem. Its official packaging across Homebrew
      and Winget, alongside a manually distributed AppImage, illustrates a common
      multi-platform Electron delivery model.
  project-history:
    - >
      NethServer developed NethLink as an open-source desktop tool for linking
      NethServer systems and exposing remote-access functions through a graphical
      interface.
    - >
      The project is implemented as a cross-platform desktop application and is
      distributed for macOS, Windows, and Linux.
  related-projects:
    - >
      NethLink is a client in the broader NethServer ecosystem and is intended to
      connect to separately deployed NethServer systems.
  sources:
    - https://github.com/NethServer/nethlink#readme
  summary:
    - >
      NethLink is an open-source cross-platform desktop client for connecting to
      NethServer systems and accessing their remote-management tools.
  timeline:
    - >
      Current project: Official distribution supports Homebrew on macOS, Winget on
      Windows, and AppImage installation on Linux.
  usage:
    - >
      Users launch the application, enter a NethServer hostname, username, and password,
      and then access the connected server.
    - >
      NethLink stores current-user and previously used account records in its documented
      platform-specific user-data directory. The official README does not state that
      passwords are stored in those JSON files, so no credentials-file location is
      asserted.
tags:
