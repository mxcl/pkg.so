history:
  adoption-history:
    - >
      Kissat is packaged beyond Homebrew, including Debian, Fedora/DNF, and Nix
      according to the input package facts. That kind of distribution matters for
      formal-methods users because SAT solvers are often invoked by other verification,
      synthesis, model-checking, theorem-proving, and package-build workflows.
  package-nerd-significance:
    - >
      Kissat is notable because SAT solvers are small command-line packages with outsize
      influence: they can sit invisibly underneath formal verification, dependency
      solving, hardware checking, and research pipelines. Its competition pedigree makes
      the package more than another CLI; it is a benchmark artifact from the SAT-solving
      community.
  project-history:
    - >
      Kissat comes from the same SAT-solver lineage as CaDiCaL, Lingeling, Plingeling,
      Treengeling, and related competition solvers associated with Armin Biere and
      collaborators. Its homepage describes it as a condensed and improved
      reimplementation of CaDiCaL in C, with library use possible even though the solver
      is not incremental.
    - >
      The project became prominent through SAT Competition work. The official Kissat
      page records first place in the main track and first place on unsatisfiable
      instances at SAT Competition 2020, and the repository README points to solver
      descriptions for SAT Competition 2024.
  related-projects:
    - >
      Kissat is related to CaDiCaL, Gimsatul, IsaSAT, Lingeling, Plingeling,
      Treengeling, Paracooba, and the broader SAT Competition benchmark ecosystem.
  sources:
    - https://api.github.com/repos/arminbiere/kissat/releases?per_page=100
    - https://fmv.jku.at/kissat/
    - https://formulae.brew.sh/formula/kissat
    - https://github.com/arminbiere/kissat
    - https://github.com/arminbiere/kissat/releases
  summary:
    - >
      Kissat is Armin Biere's compact C SAT solver, described by the project as a
      keep-it-simple-and-clean bare-metal solver and as a reimplementation of CaDiCaL
      ideas with improved data structures, scheduling, algorithms, and implementation.
  timeline:
    - >
      2020: Kissat won first place in the SAT Competition 2020 main track and first
      place on unsatisfiable instances.
    - >
      2020: The official Kissat page linked the SAT Competition 2020 system description
      and submitted source archive.
    - '2022-08-07: SAT Competition 2022 Light, Hyper, and Bulky GitHub releases were published.'
    - >
      2024: The repository README pointed to a SAT Competition 2024 solver description
      covering CaDiCaL, Gimsatul, IsaSAT, and Kissat.
    - '2025-10-16: GitHub release rel-4.0.4 was published.'
  usage:
    - >
      Users build Kissat with the repository's configure-and-make workflow and run it as
      a SAT solver on CNF instances. The README states that binaries are provided with
      major releases, while the homepage links the SAT Competition 2020 source
      submission and competition descriptions for deeper reproducibility context.
related-packages:
  - id: brew:cadical
    reason: >
      Choose CaDiCaL when an incremental SAT-solver API is important; Kissat is its
      performance-focused C reimplementation and is officially described as
      non-incremental.
    rel: alternative
    sources:
      - https://fmv.jku.at/kissat/
      - https://fmv.jku.at/cadical/
      - https://github.com/arminbiere/cadical#readme
