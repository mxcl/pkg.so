credentials-file-location: null
history:
  adoption-history:
    - >
      Time Sink has remained a macOS-specific utility aimed at individuals who want
      automatic, local activity accounting without manually starting a timer for every
      task. Later releases adapted to macOS sandboxing, privacy permissions, Dark Mode,
      and Apple silicon while retaining compatibility with older workflows.
  package-nerd-significance:
    - >
      Time Sink represents the native-Mac, utility-style branch of time tracking: it
      observes application and window activity locally, stores its own history, and
      exports ordinary reports rather than centering a hosted team service. Its long
      release history and modest system requirements make it characteristic of durable
      indie Mac software.
  project-history:
    - >
      Many Tricks first released Time Sink in October 2010. The application grew from
      automatic foreground and background timing and reports to include Pools, scheduled
      exports, ad hoc timers, screenshots, sandboxed storage, and native support for
      both Apple-silicon and Intel Macs.
  related-projects:
    - Many Tricks macOS utilities
    - macOS Screen Recording privacy controls
  sources:
    - https://manytricks.com/privacy/appstore/ — official storage and privacy details
    - https://manytricks.com/timesink/help/ — official usage overview
    - https://manytricks.com/timesink/help/settings.html — official settings and feature guide
    - https://manytricks.com/timesink/releasenotes/ — official release chronology
  summary:
    - >
      Time Sink is a Many Tricks utility for macOS that automatically records time spent
      in applications and windows, groups activity into Pools, and presents or exports
      usage reports.
  timeline:
    - '2010: Initial public release'
    - >
      2017: Major redesign added ad hoc timers, improved reports, and sandboxed App
      Store storage
    - '2020: Optional periodic screenshots were added alongside newer macOS privacy handling'
    - '2021: Native Apple-silicon support and Dark Mode arrived'
    - '2025: Web-based help and further maintenance updates shipped'
  usage:
    - >
      Launch Time Sink and leave it running to record foreground and background
      application activity. Users can ignore items, group related apps or windows into
      Pools, categorize off-computer work with ad hoc timers, inspect date-based
      reports, and export delimited snapshots.
