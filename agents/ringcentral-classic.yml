history:
  adoption-history:
    - >
      RingCentral acquired Glip in 2015 and announced that its messaging and
      collaboration features would be integrated into RingCentral Office while remaining
      available across web, desktop, and mobile platforms.
    - >
      RingCentral introduced a replacement desktop application in 2020 and stated that
      no new development would occur on RingCentral Classic, directing users toward the
      consolidated RingCentral app.
  package-nerd-significance:
    - >
      The cask preserves an installable artifact from RingCentral's transition from the
      acquired Glip client to its unified communications application. It is primarily
      relevant to legacy deployments and software-history collections rather than new
      installations.
  project-history:
    - >
      RingCentral Classic descended from Glip, a team-messaging service combining
      conversations with tasks, calendars, notes, annotations, and file sharing.
      RingCentral acquired Glip in 2015 to integrate collaboration into its cloud
      communications platform.
    - >
      In August 2018, the Glip desktop application was renamed RingCentral and gained a
      new icon reflecting its expanded calling and online-meeting capabilities. It later
      became known as RingCentral Classic to distinguish it from RingCentral's
      replacement desktop application.
  related-projects:
    - Glip
    - RingCentral app
    - RingCentral Office
    - RingEX
  sources:
    - >
      https://community.ringcentral.com/news-announcements-13/ringcentral-app-for-desktop-is-here-9380
    - >
      https://support.ringcentral.com/gb/en/release-notes/office/app/classic/release-notes-august-2018.html
    - >
      https://www.ringcentral.com/whyringcentral/company/pressreleases/ringcentral-acquires-glip--a-team-messaging-and-collaboration-co.html
    - source_facts.description
  summary:
    - >
      RingCentral Classic is the legacy RingCentral desktop collaboration client
      formerly distributed as Glip, combining team messaging with calling and meeting
      features.
  timeline:
    - >
      2015: RingCentral acquired Glip and announced plans to integrate it with
      RingCentral Office.
    - >
      2018: The Glip desktop application was renamed RingCentral and expanded around
      calling and meetings.
    - >
      2020: RingCentral introduced its replacement desktop app and placed Classic into
      maintenance-only support.
  usage:
    - >
      Organizations used the client for team conversations, calling, meetings, shared
      files, tasks, and other collaboration workflows tied to RingCentral accounts.
    - >
      Current users should treat the application as legacy software and evaluate
      migration to the supported RingCentral app.
