id: brew:cfonts
display-name: cfonts
repo: null
docs:
  - https://github.com/dominikwilkowski/cfonts#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation through Homebrew, AUR, Fedora, NixOS, MacPorts,
      Cargo, npm, and Yarn. The package metadata in this batch also shows Homebrew,
      Fedora, MacPorts, and Nix packaging.
    - >
      cfonts has stayed useful because terminal banners are a durable CLI trope: release
      scripts, demos, dev tools, and playful command output often want large colored
      text without depending on a full TUI framework.
  package-nerd-significance:
    - >
      cfonts is package-nerd fun because the project straddles npm and crates.io while
      exposing the same tiny command name to users. Its release notes read like a tour
      of how one small CLI moves through multiple packaging ecosystems.
    - >
      It is also a reminder that not every packaged developer tool is about compilers or
      infrastructure. Sometimes the valuable artifact is a polished, dependency-light
      terminal affordance that makes other tools more readable or memorable.
  project-history:
    - >
      The official GitHub repository was created in January 2015 and originally grew as
      a Node.js package. The release-branch documentation describes two implementations,
      Rust and Node.js, with the Homebrew formula using the Rust release line.
    - >
      The project's release process distinguishes `vX.Y.Znodejs` tags from `vX.Y.Zrust`
      tags. The official release instructions also describe publishing to npm,
      crates.io, Homebrew, AUR, Fedora, and MacPorts, making the repository unusually
      explicit about its multi-ecosystem packaging workflow.
  related-projects:
    - npm and Yarn are the documented package channels for the Node.js implementation.
    - >
      crates.io and docs.rs are the documented package and API documentation surfaces
      for the Rust implementation.
    - >
      Homebrew, AUR, Fedora, NixOS, and MacPorts are documented downstream package
      channels in the official release notes.
  sources:
    - https://api.github.com/repos/dominikwilkowski/cfonts
    - https://github.com/dominikwilkowski/cfonts
    - https://github.com/dominikwilkowski/cfonts#readme
    - https://formulae.brew.sh/api/formula/cfonts.json
    - https://api.github.com/repos/dominikwilkowski/cfonts/releases
    - https://github.com/dominikwilkowski/cfonts/blob/released/RELEASE.md
  summary:
    - >
      cfonts is a command-line text banner generator for ANSI console fonts. The
      official README calls it a small CLI for giving command-line output some visual
      style, with both Rust and Node.js implementations.
  timeline:
    - '2015: The dominikwilkowski/cfonts repository is created on GitHub.'
    - '2023: The release stream includes both Rust and Node.js tags.'
    - >
      2025: v3.3.1nodejs and v1.3.0rust releases show both implementations still tracked
      in the official repository.
  usage:
    - >
      The CLI accepts text and options for font, alignment, colors, gradients, spacing,
      and related terminal presentation. The README documents supported characters and
      multiple font faces such as block, slick, tiny, grid, pallet, shade, chrome,
      simple, 3d, huge, and console.
    - >
      There is no official persistent config file or credential file documented for the
      CLI, so both locations are null.
related-packages:
  - id: brew:figlet
    reason: >
      Choose FIGlet for the classic Unix banner workflow and its large ecosystem of
      external FIGlet font files; choose cfonts when built-in ANSI color and gradients
      are more important.
    rel: alternative
    sources:
      - https://github.com/dominikwilkowski/cfonts#readme
      - http://www.figlet.org/figlet-man.html
  - id: brew:toilet
    reason: >
      Choose TOIlet when FIGlet compatibility, Unicode, libcaca color effects, or output
      formats such as HTML and IRC are preferable to cfonts' bundled font styles.
    rel: alternative
    sources:
      - https://github.com/dominikwilkowski/cfonts#readme
      - http://caca.zoy.org/wiki/toilet
