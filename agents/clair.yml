id: brew:clair
display-name: Clair
repo: null
docs:
  - https://quay.github.io/clair
config-file-location:
  unix:
    - /etc/clair/config.yaml
    - /etc/clair/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Clair is distributed as a Homebrew formula and appears in other package sets in
      the supplied input, while its README also points users to stable GitHub releases
      and a Quay container image. Its adoption path is tied to container registries and
      CI systems that need image vulnerability matching against known vulnerability
      feeds.
  package-nerd-significance:
    - >
      Clair matters to package nerds because it connects OS-package and language-package
      vulnerability databases to container layers. It sits at the point where package
      manifests, distribution advisories, OCI images, and registry policy meet.
  project-history:
    - >
      The public repository was created in November 2015 and its README describes the
      project goal as making container-based infrastructure more transparent. Clair
      later evolved into the v4 architecture documented in the Clair book, with separate
      indexer, matcher, notifier, and combo operating modes configured by YAML or JSON.
  related-projects:
    - >
      Related projects include Quay, OCI image tooling, Docker image tooling,
      vulnerability databases consumed by Clair matchers, and other image scanners such
      as Trivy and Grype.
  sources:
    - https://github.com/quay/clair
    - https://quay.github.io/clair
    - https://quay.github.io/clair/reference/config.html
    - https://api.github.com/repos/quay/clair/releases
  summary:
    - >
      Clair is Quay's open source service for static analysis of vulnerabilities in
      application container images, including OCI and Docker images. It is notable in
      package-manager culture because it made vulnerability metadata, image indexing,
      and registry-side security scanning part of the ordinary container toolchain.
  timeline:
    - '2015: Public GitHub repository created and initial public release v0.0.1 published.'
    - '2016: v1 releases established Clair as a container vulnerability analysis service.'
    - >
      2020: Clair v4 line documented a service-oriented architecture with indexer,
      matcher, and notifier modes.
    - '2024: v4.7.0 added documented drop-in configuration file support.'
    - '2025: v4.9.0 release published.'
  usage:
    - >
      Clients use the Clair API to index container images and match indexed contents
      against vulnerability data. Operators run Clair with a structured configuration
      file, commonly under /etc/clair, and select a service mode such as indexer,
      matcher, notifier, or combo.
related-packages:
  - id: brew:trivy
    reason: >
      Choose Trivy for a standalone scanner that covers container images plus
      filesystems, repositories, Kubernetes, misconfiguration, secrets, licenses, and
      SBOM discovery without operating a Clair service.
    rel: alternative
    sources:
      - https://github.com/quay/clair
      - https://trivy.dev/latest/
      - https://github.com/aquasecurity/trivy#readme
  - id: brew:grype
    reason: >
      Choose Grype for a local CLI centered on vulnerability scanning of images,
      directories, archives, and existing SBOMs rather than Clair's registry-oriented
      indexing service.
    rel: alternative
    sources:
      - https://github.com/quay/clair
      - https://github.com/anchore/grype#readme
      - https://oss.anchore.com/docs/guides/vulnerability/scan-targets/
