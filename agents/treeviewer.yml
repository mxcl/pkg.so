config-file-location:
  unix:
    - ~/.local/share/TreeViewer
  windows:
    - '%LOCALAPPDATA%/TreeViewer'
credentials-file-location: null
history:
  adoption-history:
    - >
      TreeViewer is distributed for Windows, macOS, and Linux and includes both a
      graphical application and a command-line utility. Its use in research is supported
      by a formal 2024 Ecology and Evolution software paper that the project asks users
      to cite.
  package-nerd-significance:
    - >
      TreeViewer combines a cross-platform .NET desktop application, a headless
      command-line mode, and a separately maintained signed module repository. That
      modular packaging model, plus its support for unattended module installation,
      makes it notable for reproducible scientific workstations and servers.
  project-history:
    - >
      TreeViewer was developed by Giacomo Bianchini and Paula Sánchez-Baracaldo as a
      modular environment for visualizing and manipulating phylogenetic trees.
      Individual modules handle operations such as coordinate calculation, branch
      drawing, selection, and file processing.
    - >
      The project progressed through the 1.x and 2.x release lines, adding signed
      installers, Apple-silicon support, tree-comparison facilities, and broader
      plotting and analysis features. Its design and scientific rationale were
      documented in a peer-reviewed paper in 2024.
  related-projects:
    - TreeViewerCommandLine
    - TreeViewer module repository
    - Avalonia UI
    - .NET
  sources:
    - https://doi.org/10.1002/ece3.10873
    - https://github.com/arklumpus/TreeViewer
    - https://github.com/arklumpus/TreeViewer/releases
  summary:
    - >
      TreeViewer is an open-source, cross-platform application and command-line tool for
      visualizing, manipulating, and exporting phylogenetic trees through a modular
      processing pipeline.
  timeline:
    - "2024: TreeViewer's design and use were documented in Ecology and Evolution."
    - >
      2024: The project provided signed installers and native Apple-silicon builds
      during its continuing 2.x development.
  usage:
    - >
      Users open phylogenetic-tree files, assemble modules into plotting or
      transformation workflows, inspect attributes, and export publication-oriented
      graphics. The command-line program supports trees too large for interactive
      preview and headless workflows; modules can be installed from the online
      repository or an offline archive.
