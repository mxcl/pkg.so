history:
  adoption-history:
    - >
      Ladder adoption appears concentrated among self-hosters, researchers, and
      developers who want a local or private proxy rather than depending on public
      hosted services. The README documents binary, Docker, Docker Compose, and
      Helm-chart installation paths.
    - >
      Release pages show early 0.0.x packaging with multi-platform assets and community
      contributions, but there is limited public evidence of broad institutional
      adoption.
  package-nerd-significance:
    - >
      Ladder is package-nerd interesting because it packages an otherwise messy
      browser/proxy/debugging workflow into one self-hostable binary and container
      image.
    - >
      It also illustrates the tension around proxy tools in package repositories: useful
      for QA and access-control testing, but requiring explicit warnings about legal
      compliance, terms of service, and public-instance abuse.
  project-history:
    - >
      The README describes Ladder as a developer tool for simulating different client
      environments and observing how modern websites serve content under varying
      conditions. It supports request and response modifications, custom user agents,
      X-Forwarded-For settings, injected code, raw HTML fetching, an API route, and
      rulesets.
    - >
      The project separated reusable rules into the `everywall/ladder-rules` repository
      and release notes later mention ruleset compiler work, JSON body support,
      FlareSolverr integration, Docker hardening, and continued binary releases.
  related-projects:
    - `everywall/ladder-rules` is the direct companion ruleset repository.
    - >
      FlareSolverr is an optional integration mentioned by Ladder for browser-rendered
      challenge handling, with separate legal and contractual considerations.
    - >
      Public services such as 12ft.io and 1ft.io are historical comparison points named
      by the package metadata and repository description.
  sources:
    - https://github.com/everywall/ladder
    - https://github.com/everywall/ladder-rules
    - https://github.com/everywall/ladder/releases
    - https://raw.githubusercontent.com/everywall/ladder/main/README.md
    - https://raw.githubusercontent.com/everywall/ladder/main/docker-compose.yaml
  summary:
    - >
      Ladder is a self-hosted HTTP web proxy for testing and analyzing paywall behavior,
      response modification, CORS/header behavior, and content delivery differences
      across client environments. The project positions itself for legitimate research,
      QA, and debugging use.
    - >
      Its package history is niche but concrete: a small Go proxy became a packaged
      binary, Docker image, Compose service, Helm-adjacent deployment, and
      ruleset-driven web tool.
  timeline:
    - '2020s: Ladder emerged as a self-hosted alternative to public article-proxy services.'
    - >
      2020s: The project added Docker, binary, API, ruleset, and response-modification
      workflows.
    - >
      2020s: The ruleset repository became a companion project for reusable
      domain-specific behavior.
    - >
      2026: The v0.0.x release line included JSON API body support, FlareSolverr
      integration, and Docker hardening work.
  usage:
    - >
      Users run the proxy locally or in Docker, often pointing it at a ruleset URL. They
      can browse through the web form, append a target URL to the proxy base URL, call
      `/api/`, or fetch raw HTML through `/raw/`.
    - >
      Configuration is mostly environment-variable driven: port, preforking, user agent,
      forwarded IP, basic auth, URL logging, allowed domains, base path, ruleset path,
      and optional FlareSolverr host.
