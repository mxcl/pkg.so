    - .lando.local.yml
    - ~/.lando/config.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Lando's own 2017 adoption notes said it had diversified beyond Kalabox's
      Pantheon-heavy user base into Laravel, MEAN, Ruby, and other development use
      cases. The Lando docs later codified that model around a Landofile checked into a
      project repository, so a developer can clone a repo, run lando start, and get the
      local development stack in minutes.
  package-nerd-significance:
    - >
      Lando CLI is package-relevant because it turns a local Docker Compose ecosystem
      into a reproducible per-project developer tool. The Homebrew formula is the
      ergonomic entry point for macOS and Unix developers who want lando on PATH without
      manually wiring the JavaScript runtime pieces.
  project-history:
    - >
      In a 2017 Lando project post, Mike Pirog traced Lando back to Kalabox, which began
      as an internal Kalamuna tool for getting Pantheon sites running locally in about
      10 to 15 minutes. Kalabox moved through a Vagrant/VirtualBox/Puppet-backed first
      version and a Docker-oriented Kalabox 2 before the maintainers decided the design
      was too monolithic and fragile.
    - >
      The same post says Lando was born on 9 January 2017 after the Kalabox 2
      experience, with goals of doing more with less code, using a single in-repository
      config file, opening the tool beyond Pantheon-specific Drupal and WordPress
      workflows, and making containerized project tooling feel more native.
  related-projects:
    - >
      Lando is related to Kalabox, Docker, Docker Compose, Pantheon local development,
      Platform.sh workflows, Drupal, WordPress, Laravel, MEAN, Ruby, and Lando's plugin
      and recipe ecosystem.
  sources:
    - https://docs.lando.dev/cli
    - https://docs.lando.dev/config/global.html
    - https://docs.lando.dev/getting-started/what-it-do.html
    - https://docs.lando.dev/landofile
    - https://github.com/lando/core
    - https://lando.dev/blog/2017/10/24/journey-lando.html
  summary:
    - >
      Lando CLI is the command-line surface for Lando, a Docker-based local development
      and DevOps tool that grew out of Kalabox. It packages local environment
      orchestration, recipes, services, proxying, events, and project-specific tooling
      behind a developer-friendly lando command.
  timeline:
    - '2016-09-19: Kalabox 2 was released.'
    - '2016-11-25: The last Kalabox release was cut before the pivot.'
    - '2017-01-09: Lando was born as the post-Kalabox redesign.'
    - >
      2017-10-24: The Lando project published its Kalabox-to-Lando history and early
      adoption notes.
    - '2026-04-28: The lando/core repository listed v3.26.4 among its releases.'
  usage:
    - >
      The CLI has general Lando commands such as start, stop, rebuild, logs, info, ssh,
      config, update, and destroy; tooling commands defined by individual Landofiles;
      and management commands used by setup and plugin workflows. Project config centers
      on .lando.yml plus base and local override files, while global CLI config can live
      in ~/.lando/config.yml.
related-packages:
  - id: brew:docker-compose
    reason: >
      Docker Compose is Lando's documented service orchestrator, so it is the relevant
      lower-level companion when inspecting or extending the container topology behind a
      Lando application.
    rel: adjacent_workflow
    sources:
      - https://docs.lando.dev/config/orchestrator.html
      - https://docs.docker.com/compose/
