history:
  adoption-history:
    - >
      Official gator installation paths include downloading binaries from Gatekeeper
      releases, building from source, and installing with Homebrew on macOS and Linux.
      Its adoption is tied to Gatekeeper users who want to test or manage policies
      before applying them to Kubernetes clusters.
  package-nerd-significance:
    - >
      gator matters because it packages policy validation and policy-library workflows
      into a local CLI, making Gatekeeper policy development fit into package-manager,
      CI, and preflight-test workflows rather than only live-cluster admission control.
  project-history:
    - >
      Gatekeeper's repository was created in 2018 as the Kubernetes admission-control
      project in the Open Policy Agent ecosystem. The README distinguishes modern
      Gatekeeper from earlier OPA sidecar and kube-mgmt usage, noting native Kubernetes
      CRDs, constraints, constraint templates, audit functionality, mutation, and
      external data support.
    - >
      The gator CLI is documented as a Gatekeeper v3.11+ beta feature. The same official
      page notes that `go install` support requires Gatekeeper master or v3.16.0 and
      later, and that the `gator policy` subcommand is a v3.22+ alpha feature.
  related-projects:
    - >
      gator is part of Open Policy Agent Gatekeeper and works with Gatekeeper
      ConstraintTemplates, Constraints, Kubernetes resources, and the official
      gatekeeper-library. The Gatekeeper README also relates the project to OPA with
      kube-mgmt.
  sources:
    - https://github.com/open-policy-agent/gatekeeper
    - https://github.com/open-policy-agent/gatekeeper/releases
    - https://open-policy-agent.github.io/gatekeeper/website/docs
    - https://open-policy-agent.github.io/gatekeeper/website/docs/gator
  summary:
    - >
      gator is the command-line utility shipped by Open Policy Agent Gatekeeper for
      local Gatekeeper policy work. It lets users evaluate ConstraintTemplates and
      Constraints outside the cluster, and newer versions add policy-library management
      commands.
  timeline:
    - '2018: Gatekeeper repository created.'
    - '2019: v2.0.1 release published.'
    - '2023: v3.11.0 release line introduced the documented gator beta feature state.'
    - '2024: v3.16.0 became the documented minimum for `go install` of gator by version.'
    - '2026: v3.22.0 release line introduced the documented `gator policy` alpha feature state.'
  usage:
    - >
      `gator test` evaluates Kubernetes objects against templates and constraints and
      reports violations through both output and exit status. `gator policy` provides a
      brew-inspired interface for discovering, installing, upgrading, and managing
      policies from the official gatekeeper-library.
related-packages:
  - id: brew:opa
    reason: >
      Use Open Policy Agent for general-purpose Rego evaluation and policy services;
      gator is the more specialized choice for testing Gatekeeper ConstraintTemplates,
      Constraints, and Kubernetes resources.
    rel: alternative
    sources:
      - https://open-policy-agent.github.io/gatekeeper/website/docs/gator/
      - https://www.openpolicyagent.org/docs/latest/
  - id: brew:conftest
    reason: >
      Use Conftest when the main task is testing structured configuration files with
      Rego, while gator fits Gatekeeper-specific Kubernetes admission-policy artifacts.
    rel: alternative
    sources:
      - https://open-policy-agent.github.io/gatekeeper/website/docs/gator/
      - https://www.conftest.dev/
