history:
  adoption-history:
    - >
      Airtame's application is available for macOS, Windows, Linux, and ChromeOS, with
      browser-based and guest options reducing installation barriers. The platform
      targets managed meeting, education, and digital-signage environments as well as
      ordinary wireless presentations.
  package-nerd-significance:
    - >
      Airtame interests package enthusiasts because the desktop package is only one
      component of a hardware-and-cloud presentation platform. Packaging must account
      for screen-recording and local-network permissions, optional audio integration,
      administrator-managed deployment, and discovery of dedicated receivers.
  project-history:
    - >
      Airtame developed its desktop application as the sender and setup utility for the
      company's wireless screen-sharing devices and later Airtame Hub platform. Official
      current documentation presents the same core application across major desktop
      operating systems and supplements it with browser, guest, and mass-deployment
      variants.
  related-projects:
    - Airtame hardware receivers and Airtame Hub provide the display endpoint.
    - Airtame Cloud supports device management and digital-signage workflows.
    - >
      The browser-based Airtame application offers sharing without the standard desktop
      installation.
  sources:
    - >
      Official Airtame App documentation:
      https://help.airtame.com/hc/en-us/sections/5149511274525-Airtame-App
    - >
      Official application-variants guide:
      https://help.airtame.com/hc/en-us/articles/5203156638109-Which-Airtame-app-variations-exists
    - >
      Official macOS installation guide:
      https://help.airtame.com/hc/en-us/articles/5274773465885-Install-the-Airtame-app-on-macOS
  summary:
    - >
      Airtame is a wireless screen-sharing and digital-signage platform. Its desktop
      application discovers and configures Airtame receivers and shares an entire screen
      or selected window to them.
  timeline:
    - '2021: Official macOS guidance documented Big Sur screen-sharing and audio permissions.'
    - >
      2024: Official documentation described standard, guest, browser, and
      mass-deployment application variants.
    - >
      2025: Updated macOS installation guidance covered Sequoia permissions and
      Apple-silicon systems.
  usage:
    - >
      On macOS, users install Airtame in Applications, grant screen and system-audio
      recording access, allow local-network discovery, select a nearby Airtame receiver,
      and share a window or screen. The app can also configure new Airtame screens.
      Official documentation notes log files under
      `/Users/YOURUSERNAME/Library/Logs/Airtame`, but this is a diagnostic log directory
      rather than a configuration or credentials file.
