id: cask:iterm2
display-name: iTerm2
repo: https://github.com/gnachman/iTerm2
docs:
  - https://iterm2.com/documentation-preferences.html
  - https://iterm2.com/documentation.html
  - https://iterm2.com/python-api
config-file-location:
  macos:
    - ~/Library/Preferences/com.googlecode.iterm2.plist
    - User-selected folder
    - URL containing com.googlecode.iterm2.plist when external preferences are enabled
credentials-file-location: null
history:
  adoption-history:
    - >
      iTerm2 became a common replacement for Apple's Terminal among macOS developers,
      system administrators, and other command-line-heavy users. Long-running
      development added split panes, profiles, a hotkey window, search, triggers, shell
      integration, tmux control mode, extensive key mapping, and scripting.
    - >
      Version 3 broadened the automation model; the 3.3 series introduced a Python
      scripting API and scriptable status bar. The project remains distributed directly
      and through macOS package managers such as Homebrew Cask.
  package-nerd-significance:
    - >
      For macOS package users, iTerm2 is one of the canonical first casks installed on a
      development workstation. Its combination of profiles, escape-sequence support,
      tmux integration, shell integration, triggers, and automation makes it a frequent
      endpoint for dotfile repositories and reproducible workstation setups.
  project-history:
    - >
      iTerm2 is the successor to the earlier iTerm terminal emulator. Maintained by
      George Nachman and contributors, it developed into a feature-rich macOS-native
      terminal replacement while retaining an open-source codebase and a long archive of
      release notes.
  related-projects:
    - iTerm is the predecessor named by the official project help page.
    - >
      tmux integrates through control mode so remote tmux windows can appear as native
      iTerm2 windows and tabs.
    - >
      The iTerm2 Python API and shell-integration scripts are official companion
      automation surfaces.
  sources:
    - https://github.com/gnachman/iTerm2
    - https://iterm2.com/documentation.html
    - https://iterm2.com/downloads.html
    - https://iterm2.com/help/
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      iTerm2 is an open-source terminal emulator for macOS and the successor to iTerm.
      It provides a native, highly configurable interface for shells, local command-line
      work, SSH sessions, tmux sessions, and scripted terminal automation.
  timeline:
    - 'Late 2000s: iTerm2 emerged as the successor to iTerm.'
    - '2016: The stable iTerm2 3.0 series delivered a major generation of features and fixes.'
    - '2019: iTerm2 3.3 added the Python scripting API and scriptable status bar.'
  usage:
    - >
      Users create profiles for shells and remote workflows, arrange sessions in tabs
      and split panes, configure colors and key mappings, and add shell integration for
      command-aware features. Advanced users automate the application with AppleScript
      or the Python API and use tmux control mode for persistent remote sessions.
tags:
