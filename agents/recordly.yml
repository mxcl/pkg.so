history:
  adoption-history:
    - >
      Recordly is distributed as a free, AGPL-licensed desktop application for macOS,
      Windows, and Linux. Prebuilt releases, source builds, cross-platform support, and
      a contribution-oriented repository make it accessible both to creators and to
      developers extending or packaging it.
  package-nerd-significance:
    - >
      Recordly combines an Electron interface with native capture helpers on macOS and
      Windows, illustrating the packaging tradeoffs of a cross-platform media
      application that still needs operating-system-specific capture and audio
      integration.
    - >
      Its open repository, saved .recordly project format, source-build instructions,
      extension API, and community contribution model make it more inspectable and
      adaptable than closed-source screen-recording applications.
  project-history:
    - >
      Recordly began as a fork of OpenScreen. The maintainers state that more than 80
      percent of its code has since diverged, while acknowledging that features
      including zoom animations originated in that earlier codebase.
    - >
      It developed into a combined recorder and nonlinear presentation editor, adding
      automatic and manual zooms, cursor rendering, annotations, backgrounds, webcam
      overlays, speed regions, extra audio, resumable project files, and MP4 or GIF
      export.
  related-projects:
    - OpenScreen is the project from which Recordly was originally forked.
    - Recordly Marketplace distributes community extensions for the editor.
    - >
      Electron coordinates the desktop application, while native capture helpers
      integrate ScreenCaptureKit on macOS and Windows Graphics Capture and WASAPI on
      Windows.
  sources:
    - https://github.com/webadderallorg/Recordly
    - https://github.com/webadderallorg/Recordly/blob/main/EXTENSIONS.md
    - https://github.com/webadderallorg/Recordly/blob/main/recordly.rb
    - https://recordly.dev/
  summary:
    - >
      Recordly is a free, open-source screen recorder and editor for creating demos,
      walkthroughs, and product videos. It combines capture with presentation-focused
      editing, including zooms, cursor effects, styled backgrounds, annotations, audio,
      and webcam overlays.
  timeline:
    - 'Origin: Recordly began as a fork of OpenScreen.'
    - >
      Divergence: The project evolved into a substantially independent codebase with its
      own capture, editing, rendering, and project workflows.
    - >
      Current direction: Development targets macOS, Windows, and Linux and accepts
      community contributions and extensions.
  usage:
    - >
      Users select a display or application window, choose microphone and system-audio
      inputs, record, and move directly into the editor.
    - >
      The editor supports trimming, zoom and speed regions, annotations, cursor styling,
      backgrounds, webcam overlays, cropping, and additional audio. Work can be saved as
      .recordly projects and exported as MP4 or GIF.
