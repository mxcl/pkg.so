history:
  adoption-history:
    - >
      BookMacster developed as the full-featured member of Sheep Systems' BookMacster
      family, alongside narrower tools such as Smarky, Synkmark, and Markster. Its
      official history records migration support for users of the earlier Bookdog
      product and continuing adaptation to Safari, Firefox, Chrome-family browsers, and
      their proprietary sync services.
  package-nerd-significance:
    - >
      BookMacster occupies a specialized part of the Mac utility ecosystem: it bridges
      otherwise incompatible browser bookmark stores and sync systems while retaining a
      user-controlled collection file. Its long version history illustrates the
      maintenance burden of tracking browser storage formats, extensions,
      native-messaging interfaces, and macOS automation behavior.
  project-history:
    - >
      Public beta history reaches back to at least January 2010. By 2011 the application
      supported crossgrading from Sheep Systems' earlier Bookdog utility and had
      expanded its browser add-ons, background agents, localization behavior, and
      bookmark interchange features.
    - >
      Later releases moved from older Bookmarkshelf documents to .bmco Collection files,
      added automatic cross-browser and multi-Mac workflows, and replaced older browser
      plug-in techniques with modern extensions and native messaging.
  related-projects:
    - Bookdog
    - Smarky
    - Synkmark
    - Markster
    - Safari
    - Firefox
    - Google Chrome
  sources:
    - https://sheepsystems.com/bookmacster/HelpBook/SSYMH.01.05.html
    - https://sheepsystems.com/bookmacster/HelpBook/SSYMH.04.11.html
    - https://sheepsystems.com/bookmacster/HelpBook/SSYMH.05.04.html
    - https://sheepsystems.com/products/bookmacster.html
    - https://www.sheepsystems.com/developers_blog/new-bmco-file-format.html
  summary:
    - >
      BookMacster is a long-running macOS bookmark manager and cross-browser
      synchronization bridge from Sheep Systems. It can organize, verify, deduplicate,
      tag, sort, import, and export bookmarks while connecting otherwise separate
      browser sync ecosystems.
  timeline:
    - 'January 2010: An early BookMacster public beta was documented.'
    - >
      2011: BookMacster supported migration from the earlier Bookdog product and
      expanded background syncing and browser integration.
    - '2014: The product added and refined direct bookmark-search and background workflows.'
    - >
      2017: The BookMacster family adopted the .bmco Collection format and modernized
      browser-extension integration.
  usage:
    - >
      Users create a BookMacster Collection, add browser profiles or other bookmark
      sources as clients, configure import and export directions, and enable Syncers to
      propagate changes. For multi-device use, BookMacster typically acts as a bridge
      Mac between browser-specific services such as iCloud, Firefox Sync, and Chrome
      Sync.
    - >
      Because multiple active synchronization routes can form loops, the official Help
      Book recommends planning the topology before enabling cross-browser or multi-Mac
      syncing.
