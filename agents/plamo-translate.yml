history:
  adoption-history:
    - >
      PLaMo Translate initially operated as a web service. Preferred Networks expanded
      access with macOS and Windows desktop applications in March 2026, making
      translation callable from text selected in other applications.
    - >
      The desktop application is available across the service's plans, including the
      free plan, lowering the barrier to adopting the service as a system-wide
      translation aid.
  package-nerd-significance:
    - >
      PLaMo Translate is notable as a Japanese-focused AI translation service with a
      packaged desktop client. For package-manager users, the client turns a
      browser-first service into an installable utility with a global
      selection-and-shortcut workflow.
  project-history:
    - >
      Preferred Networks announced the PLaMo Translate language model and service in
      2025, positioning it as an AI translation system specialized for Japanese text.
    - >
      In 2026, the service added native desktop clients and later expanded its
      translation modes, including live audio translation. The desktop client integrates
      translation and English-writing correction into ordinary application workflows.
  related-projects:
    - >
      PLaMo is Preferred Networks' family of large language models; PLaMo Translate is
      the translation-focused model and service in that family.
  sources:
    - https://translate.preferredai.jp/features/
    - https://translate.preferredai.jp/news/20260324-2-desktop-app/
    - https://www.preferred.jp/en/news/pr20250527
  summary:
    - >
      PLaMo Translate is Preferred Networks' AI translation service focused on
      high-quality Japanese translation, offered through web and desktop applications.
  timeline:
    - '2025: Preferred Networks announced the PLaMo Translate model and service.'
    - '2026-03-24: PLaMo Translate launched desktop applications for macOS and Windows.'
    - '2026-06-08: The service announced live audio translation.'
  usage:
    - >
      On macOS, users can select text in another application and press Command-C twice
      to open PLaMo Translate with the result. The shortcut is customizable and requires
      macOS accessibility permission.
    - >
      The service also supports pasted text, file translation, English-writing
      correction, browser-oriented workflows, and live audio translation.
