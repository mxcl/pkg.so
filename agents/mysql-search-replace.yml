    - https://interconnectit.com/search-and-replace-for-wordpress-databases/
    - https://raw.githubusercontent.com/interconnectit/Search-Replace-DB/master/README.md
  summary:
    - >
      Search Replace DB is interconnect/it's GPLv3 PHP utility for database
      search-and-replace work during PHP and MySQL site migrations. Its own README
      frames the tool around migrating PHP/MySQL websites and says it works with common
      CMSes; the workflow is deliberately operational, with backups first, file
      migration, upload of the script folder, a browser UI, and a safe dry run before
      applying replacements.
  usage:
    - >
      The 4.1 line added several features that explain the package's niche: multiple
      search-replaces, table exclusions, PHP/module/security checks, CLI SSL connection
      support, and removal of WordPress-specific automatic credential loading because it
      created security issues when users left the script on sites. In practice the
      Homebrew formula packages it as `mysql-search-replace` with the `srdb` executable,
      making a historically web-distributed migration script available as a command-line
      tool for developers who need a targeted database replacement step rather than a
      full CMS migration framework.
related-packages:
  - id: brew:wp-cli
    reason: >
      For WordPress-specific work, WP-CLI's wp search-replace command provides
      serialization-aware replacement inside the broader official WordPress
      administration CLI, including dry runs, multisite operation and SQL export.
    rel: alternative
    sources:
      - https://developer.wordpress.org/cli/commands/search-replace/
      - https://interconnectit.com/search-and-replace-for-wordpress-databases/
