credentials-file-location: null
history:
  adoption-history:
    - >
      dnsmasq became widely adopted because it solves the ordinary edge-network problem
      in one daemon. It is packaged by Homebrew, Debian and Ubuntu, Fedora/DNF, Alpine,
      Arch, MacPorts, Nix, and openSUSE-style distributions, and it appears in routers,
      virtualization setups, container labs, and developer machines.
    - >
      Its adoption history is also tied to network appliances and local development
      tooling: dnsmasq can be the DNS cache on a router, the DHCP server on a test
      subnet, or the wildcard/local-domain resolver on a developer laptop.
  package-nerd-significance:
    - >
      dnsmasq is package-nerd infrastructure canon: tiny, old, everywhere, and still the
      fastest route from blank machine to working local DNS and DHCP. It often appears
      as a transitive operational dependency behind friendlier tools.
    - >
      Its significance is also historical. Before every platform had polished
      local-network UX, dnsmasq was the practical package that let developers and
      operators compose DNS, DHCP, TFTP, and lab-network behavior from one service.
  project-history:
    - >
      Simon Kelley's dnsmasq project documents a deliberately small service for DNS,
      DHCP, TFTP, PXE, and related local-network functions. The official documentation
      emphasizes small-network infrastructure: local DNS caching and forwarding, DHCP
      leases, static host mappings, and boot services without deploying a full
      enterprise DNS/DHCP suite.
    - >
      The public dnsmasq site keeps the manual, downloads, changelog, and gitweb
      repository together, reflecting its older upstream style: a compact C daemon,
      tarball releases, a traditional mailing-list-oriented maintenance model, and broad
      downstream packaging.
  related-projects:
    - >
      Related projects include Unbound and BIND for heavier DNS service, ISC Kea for
      larger DHCP deployments, dnscrypt-proxy for encrypted upstream DNS forwarding, and
      dnsdist for load balancing and traffic control in larger DNS environments.
  sources:
    - https://thekelleys.org.uk/dnsmasq/doc.html
    - https://thekelleys.org.uk/dnsmasq/docs/dnsmasq-man.html
    - https://thekelleys.org.uk/dnsmasq/CHANGELOG
    - https://thekelleys.org.uk/gitweb/?p=dnsmasq.git;a=summary
    - https://formulae.brew.sh/formula/dnsmasq
  summary:
    - >
      dnsmasq is a lightweight DNS forwarder, DHCP server, router-advertisement daemon,
      and network-boot helper for small networks. It is one of the classic Unix packages
      for making a laptop, router, lab VM, or embedded box hand out names and addresses.
  timeline:
    - '2004: The official changelog records dnsmasq 2.x-era releases.'
    - >
      2010s: dnsmasq becomes common in Linux distributions, routers, virtualization, and
      developer-network workflows.
    - >
      2020s: The project continues from its official site with tarball releases, manual
      pages, and a public gitweb repository.
  usage:
    - >
      Administrators use dnsmasq to cache and forward DNS, serve DHCP leases, define
      local hostnames, provide TFTP/PXE boot support, and advertise IPv6 router
      information. It is commonly configured with a single dnsmasq.conf file plus
      optional hosts and lease files.
    - >
      Package users care that dnsmasq is small enough to run on embedded systems but
      standard enough to be scripted and supervised like any other Unix daemon.
related-packages:
  - id: brew:unbound
    reason: >
      Unbound is the stronger alternative when the primary requirement is a full
      validating recursive DNS resolver rather than Dnsmasq's lightweight forwarding
      plus integrated DHCP services.
    rel: alternative
    sources:
      - https://thekelleys.org.uk/dnsmasq/doc.html
      - https://unbound.docs.nlnetlabs.nl/en/latest/
  - id: brew:bind
    reason: >
      BIND is a broader alternative for complex authoritative or recursive DNS service,
      while Dnsmasq is optimized for lightweight small-network DNS and DHCP.
    rel: alternative
    sources:
      - https://thekelleys.org.uk/dnsmasq/doc.html
      - https://bind9.readthedocs.io/en/latest/
  - id: brew:libvirt
    reason: >
      Libvirt starts dnsmasq instances to provide DNS and DHCP for managed virtual
      networks, making the packages a documented virtualization-host workflow.
    rel: adjacent_workflow
    sources:
      - https://wiki.libvirt.org/Libvirtd_and_dnsmasq.html
      - https://libvirt.org/formatnetwork.html
