id: brew:dnsmasq
display-name: dnsmasq
repo: http://thekelleys.org.uk/git/dnsmasq.git
docs:
  - https://thekelleys.org.uk/dnsmasq/docs/dnsmasq-man.html
  - https://thekelleys.org.uk/dnsmasq/doc.html
config-file-location:
  unix:
    - /etc/dnsmasq.conf
