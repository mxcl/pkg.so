id: brew:mapserver
display-name: MapServer
repo: https://github.com/MapServer/MapServer
docs:
  - https://mapserver.org/documentation.html
config-file-location:
  unix:
    - '*.map'
credentials-file-location: null
history:
  adoption-history:
    - >
      MapServer's adoption is institutional and infrastructure-oriented: public
      agencies, universities, and GIS teams use it to publish spatial services rather
      than to run a desktop UI. OSGeo says it is supported by a diverse group of
      organizations and administered by the MapServer Project Steering Committee.
    - >
      The input package metadata lists MapServer packages across Homebrew, Debian,
      Ubuntu, Fedora, Alpine, MacPorts, Nix, and openSUSE-style packaging. That broad
      packaging footprint is typical for mature GIS infrastructure with native
      dependencies and server deployment needs.
  package-nerd-significance:
    - >
      MapServer is package-nerd important because it is old, native, standards-heavy GIS
      infrastructure that still ships. It pulls together C, GDAL/OGR, PROJ, image
      libraries, optional scripting environments, and web-server deployment conventions.
    - >
      It is also historically important as one of the classic open-source web mapping
      engines, surviving the transition from CGI map servers to modern OGC and
      tile-oriented web GIS stacks.
  project-history:
    - >
      OSGeo's project page says MapServer was originally developed in the mid-1990s at
      the University of Minnesota and is known as a fast open-source platform for
      publishing spatial data and interactive mapping applications to the web. The
      official GitHub repository credits Stephen Lime as the original author and notes
      major NASA funding through cooperative agreements with the University of Minnesota
      Department of Forest Resources.
    - >
      MapServer predates many modern web-map stacks. It began as a C-based CGI-era map
      engine and grew into a standards-heavy server that can publish raster and vector
      data through OGC protocols. OSGeo lists support for GDAL/OGR data access, PROJ
      projections, WMS, WFS, WCS, SOS, GML, GeoJSON, KML, SLD, and related web mapping
      standards.
    - >
      The current GitHub repository was created in April 2012, reflecting migration of
      an older project into GitHub-hosted development rather than the beginning of the
      software itself. Releases in the 8.6 line were still being published in 2025 and
      2026, showing unusually long continuity for a web mapping engine.
  related-projects:
    - MapCache is listed by OSGeo as a MapServer sub-project for tile caching.
    - GDAL/OGR and PROJ are central supporting geospatial libraries.
    - >
      GeoServer, MapGuide Open Source, and deegree are listed by OSGeo as similar web
      mapping projects.
  sources:
    - https://api.github.com/repos/MapServer/MapServer
    - https://api.github.com/repos/MapServer/MapServer/releases?per_page=5
    - https://github.com/MapServer/MapServer
    - https://www.osgeo.org/projects/mapserver/
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      MapServer is a long-running open-source web mapping engine for publishing spatial
      data and interactive mapping applications, administered in the OSGeo ecosystem and
      configured primarily through .map files.
  timeline:
    - 'Mid-1990s: Project originated at the University of Minnesota.'
    - >
      1990s: NASA funding supported development through University of Minnesota
      forestry-related work.
    - '2012: Current GitHub repository created.'
    - '2025: MapServer 8.6.0 released.'
    - '2026: MapServer 8.6.4 released.'
  usage:
    - >
      Users configure MapServer with mapfiles, conventionally named with a .map
      extension, then run tools such as mapserv, map2img, shp utilities, legend,
      scalebar, and related helpers. OSGeo's feature list specifically notes that
      MapServer is easily configured through .map files.
    - >
      Package users care about both the CGI/server binary and the helper utilities.
      mapserv is the recognizable runtime, but tools such as map2img and shptree make it
      possible to test rendering and prepare data from the command line.
related-packages:
  - id: brew:gdal
    reason: >
      MapServer uses GDAL/OGR to access raster and vector formats, while GDAL's
      command-line utilities can inspect, convert, and prepare those datasets before
      publication.
    rel: adjacent_workflow
    sources:
      - https://www.osgeo.org/projects/mapserver/
      - https://gdal.org/en/stable/programs/index.html
  - id: brew:postgis
    reason: >
      MapServer documents native PostGIS layers, making PostGIS a practical database
      backend for spatial data that MapServer publishes.
    rel: adjacent_workflow
    sources:
      - https://mapserver.org/input/vector/postgis.html
      - https://postgis.net/documentation/
  - id: brew:proj
    reason: >
      MapServer relies on PROJ for on-the-fly coordinate transformations, and PROJ's
      utilities help inspect or test the coordinate systems referenced by Mapfiles.
    rel: adjacent_workflow
    sources:
      - https://www.osgeo.org/projects/mapserver/
      - https://proj.org/apps/index.html
