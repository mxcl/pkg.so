history:
  adoption-history:
    - >
      Routine reports support for macOS, Windows, Linux, iOS, Android, and the web. Its
      official site states that more than 100,000 professionals and teams use the
      service, though this is a vendor-reported adoption figure.
  package-nerd-significance:
    - >
      Routine represents the modern synchronized productivity-app cask: Homebrew
      installs the native macOS shell while accounts, calendars, tasks, notes,
      integrations, and workspaces are coordinated through a hosted cross-platform
      service.
  project-history:
    - >
      Routine began as a calendar-centered productivity application and developed into a
      broader workspace combining tasks, meetings, projects, notes, databases,
      integrations, and automation.
    - >
      The product's current generation is presented as Routine 2.0 and adds AI meeting
      notes, assistants, agents, voice capture, and workflow automation to its planning
      foundation.
  related-projects:
    - Routine integrates with external calendar, communication, and productivity services.
    - >
      Comparable planning products identified by Routine include Akiflow, Motion,
      Sunsama, Todoist, Notion, and Morgen.
  sources:
    - https://help.routine.co/en
    - https://www.routine.co/
    - source_facts.provenance
  summary:
    - >
      Routine is a cross-platform productivity workspace combining calendar planning,
      tasks, notes, projects, time blocking, and AI-assisted automation.
  timeline:
    - 'Early product phase: Routine focused on unifying calendars, tasks, and daily planning.'
    - >
      Routine 2.0: The product expanded toward an all-in-one workspace with databases,
      integrations, AI agents, and automations.
    - >
      2026: Routine's official site advertised desktop, mobile, Linux, and web clients
      and vendor-reported adoption above 100,000 users.
  usage:
    - >
      Individuals capture tasks and notes, plan tasks alongside calendar events,
      allocate time, manage recurring work, and organize information with projects,
      labels, pages, and databases. Teams can add workspaces, integrations, meeting
      notes, automations, and specialized AI agents.
