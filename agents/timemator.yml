history:
  adoption-history:
    - >
      Timemator targets freelancers and other professionals who need task-based records,
      billing calculations, and reports. Its direct Mac distribution, iOS companion,
      iCloud synchronization, and Homebrew Cask availability place it across several
      common Apple-software installation workflows.
  package-nerd-significance:
    - >
      Timemator is representative of commercial, local-first Mac productivity software
      that can be installed declaratively with Homebrew while licensing, private work
      records, backups, and optional iCloud synchronization remain outside the package
      manager.
  project-history:
    - >
      Catforce Studio released Timemator 1.0 on May 1, 2019 as a further development of
      the earlier Timepal project. The initial release added billable hours to its
      automatic time-tracking foundation.
    - >
      Version 2.0, released October 7, 2019, added the Activity Timeline and rule
      creation from captured activity. iCloud Sync arrived in May 2020, Apple Silicon
      support followed in December 2020, and version 3.0 in November 2022 introduced a
      rewritten application structure and redesigned task, timeline, and reporting
      interface.
  related-projects:
    - Timepal
  sources:
    - Input `source_facts.description` and `source_facts.package-manager`.
    - https://timemator.com/
    - https://timemator.com/support/
    - https://timemator.com/updates/
  summary:
    - >
      Timemator is a commercial, local-first time-tracking application for Apple
      platforms that combines automatic activity capture, rule-driven timers, manual
      entries, reports, and billing calculations.
  timeline:
    - '2019: Timemator 1.0 was released as a further development of Timepal.'
    - '2019: Version 2.0 introduced the Activity Timeline.'
    - '2020: iCloud Sync and an Apple Silicon universal build were added.'
    - '2022: Version 3.0 introduced a rewritten application structure and redesigned interface.'
  usage:
    - >
      Users organize work into tasks and folders, define rules that start or pause
      timers based on active applications, documents, paths, or websites, and review
      captured activity in daily or weekly timelines. Entries can be edited, assigned
      hourly rates, and exported for client reporting.
