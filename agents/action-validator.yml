id: brew:action-validator
display-name: action-validator
repo: https://github.com/mpalmer/action-validator
docs:
  - https://github.com/mpalmer/action-validator#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents several distribution paths: pre-built binaries from
      GitHub releases, cargo, asdf, mise, npm packages, direct repository builds, GitHub
      Action usage, and pre-commit integration. That spread is unusually broad for a
      small validator and reflects demand across Rust, Node, version-manager, and CI
      users.
  package-nerd-significance:
    - >
      action-validator is package-nerd friendly because it packages a CI correctness
      check as a local command, not only as hosted platform behavior. It is also notable
      for offering the same validation idea through native binaries, cargo, npm, asdf,
      mise, pre-commit, and a composite GitHub Action.
  project-history:
    - >
      The repository was created in October 2021 and published v0.1.0 the same day. The
      README describes a focused Rust-based tool intended for pre-commit hooks and
      similar validation workflows.
  related-projects:
    - >
      Related projects include SchemaStore-backed validators, pre-commit hooks, GitHub
      Actions workflow linters, and CI policy checks.
  sources:
    - https://api.github.com/repos/mpalmer/action-validator
    - https://api.github.com/repos/mpalmer/action-validator/releases
    - https://raw.githubusercontent.com/mpalmer/action-validator/main/README.md
  summary:
    - >
      action-validator is a standalone linter for GitHub Actions and workflow YAML
      files, checking structure against schemas and validating path globs.
  timeline:
    - '2021-10-26: GitHub repository created and v0.1.0 published.'
    - >
      2023-03-03: v0.4.0 added WASM builds, multiple filenames, and older-distro binary
      support.
    - '2024-02-23: v0.6.0 added negative-glob support and tests.'
    - '2025-08-20: v0.8.0 added --rootdir support.'
    - >
      2026-04-09: v0.9.0 improved file discovery using git-known files and added a
      pre-built GitHub Action.
  usage:
    - >
      The core workflow is to pass one or more GitHub workflow or action YAML files to
      action-validator. The README also shows pre-commit hook usage, npx usage, a Node
      API, and running the validator inside GitHub Actions.
related-packages:
  - id: brew:actionlint
    reason: >
      Choose actionlint when you need deeper GitHub Actions workflow analysis—including
      expression typing, reusable-workflow checks, and embedded ShellCheck—while
      action-validator emphasizes schema and repository-glob validation and also accepts
      action metadata files.
    rel: alternative
    sources:
      - https://github.com/mpalmer/action-validator#readme
      - https://github.com/rhysd/actionlint#readme
  - id: brew:pre-commit
    reason: >
      action-validator publishes an official pre-commit hook, so pre-commit can run its
      YAML validation automatically before changes are committed.
    rel: adjacent_workflow
    sources:
      - https://github.com/mpalmer/action-validator#using-pre-commit
      - https://pre-commit.com/
  - id: brew:action-docs
    reason: >
      After action-validator checks an action or reusable-workflow definition, Action
      docs can generate synchronized Markdown documentation from that same YAML
      metadata.
    rel: adjacent_workflow
    sources:
      - https://github.com/mpalmer/action-validator#readme
      - https://github.com/npalm/action-docs#readme
