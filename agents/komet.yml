history:
  adoption-history:
    - >
      Komet attracted users seeking a native macOS alternative to terminal editors for
      commit messages. Its project documentation also identifies Commit for Linux and
      Comet for elementary OS as applications inspired by Komet.
  package-nerd-significance:
    - >
      Komet represents a specialized class of developer utility: a graphical editor
      invoked directly by multiple version-control systems. Homebrew cask packaging
      makes this native workflow component amenable to declarative Mac setup.
  project-history:
    - >
      Komet was created as a native Cocoa editor dedicated to writing commit messages.
      It evolved to recognize the differing comment conventions of Git, Jujutsu,
      Mercurial, and Subversion while adding spell checking, line-length warnings,
      themes, Touch Bar support, and recovery of canceled messages.
  related-projects:
    - Git
    - Jujutsu
    - Mercurial
    - Subversion
    - Commit for Linux
    - Comet for elementary OS
  sources:
    - https://github.com/zorgiepoo/Komet#readme
    - https://github.com/zorgiepoo/Komet/wiki/Options
  summary:
    - >
      Komet is an open-source native macOS commit-message editor designed to make
      applying or discarding a commit convenient while encouraging readable subject and
      body text.
  timeline:
    - 'Early project: Komet established a native Cocoa workflow for commit-message editing.'
    - 'Later development: Support expanded across Git, Mercurial, Subversion, and Jujutsu.'
  usage:
    - >
      Users configure a supported version-control system to invoke Komet as its editor.
      Komet then separates message text from generated comments and provides one-action
      apply or discard controls, spelling support, and line-length feedback.
