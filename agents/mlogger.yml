    - https://github.com/nbrownus/mlogger
    - https://raw.githubusercontent.com/nbrownus/mlogger/master/README.md
  summary:
    - >
      mlogger is a small C syslog utility from the nbrownus/mlogger repository, which
      was created on GitHub on 2013-11-23. Its README describes it as a simple
      command-line program for logging different sources to syslog, based on the
      bsdutils `logger` utility shipped with many Linux distributions.
  usage:
    - >
      The project exists in a narrow systems-scripting niche: it keeps the familiar
      `logger` shape but adds behavior for larger local log lines, indented line
      continuation, remote syslog servers over TCP or UDP, Unix sockets, tags,
      priorities, file input, process IDs, and stderr mirroring. The package-manager
      role is correspondingly small: a Homebrew-installable `mlogger` executable for
      scripts or operators that need syslog submission with those patched behaviors
      rather than a full logging daemon.
related-packages:
  - id: brew:util-linux
    reason: >
      Choose util-linux's `logger` for the actively maintained mainstream Linux
      implementation; choose mlogger when its larger-line and indentation-continuation
      patches are specifically needed.
    rel: alternative
    sources:
      - https://github.com/nbrownus/mlogger#readme
      - https://man7.org/linux/man-pages/man1/logger.1.html
      - https://github.com/util-linux/util-linux
