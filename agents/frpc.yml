credentials-file-location: null
history:
  adoption-history:
    - >
      frpc became widely packaged because it solves a common self-hosting and operations
      problem: reaching a machine that cannot accept inbound connections. Homebrew
      packages frpc separately from frps, matching the operational split between client
      nodes and public relay servers.
    - >
      The upstream project distributes cross-platform release archives for macOS, Linux,
      FreeBSD, and other targets, and the GitHub project has over 100,000 stars, making
      frp one of the better-known open-source tunneling tools.
  package-nerd-significance:
    - >
      For package maintainers, frpc is interesting because it is one binary from a
      larger upstream release but has a distinct operational role. Splitting it into a
      client package lets users install only the private-side tunnel agent on laptops,
      home servers, CI boxes, or LAN hosts.
  project-history:
    - >
      frp began as an open-source Go reverse-proxy and tunneling project in late 2015.
      Its official documentation and README present frpc and frps as the two halves of
      the system: the client configuration lives with the internal service, while the
      server accepts client connections and publishes TCP, UDP, HTTP, HTTPS, and related
      proxy modes.
    - >
      The project has remained pre-1.0 while continuing regular feature releases. The
      maintainers describe ongoing v2 work and compatibility concerns in the README, and
      the v0.69.0 release introduced an explicit wire-protocol setting as a transition
      path for future frpc/frps protocol changes.
  related-projects:
    - frps is the server counterpart shipped by the same upstream frp project.
    - >
      The README discusses a planned v2 direction influenced by cloud-native proxy ideas
      such as Kubernetes, service mesh systems, and Envoy-like extensibility.
  sources:
    - https://api.github.com/repos/fatedier/frp
    - https://github.com/fatedier/frp
    - https://github.com/fatedier/frp/releases
    - https://gofrp.org/en/docs
  summary:
    - >
      frpc is the client-side command in frp, the fast reverse proxy project used to
      expose services behind NAT or firewalls to the Internet. In the frp deployment
      model, frpc runs beside the private service and connects outward to frps on a
      reachable host.
  timeline:
    - '2015: The frp GitHub repository was created.'
    - '2017: Public GitHub releases were already publishing frp binaries in the v0.x series.'
    - >
      2026: v0.69.0 documented a compatibility window and introduced the versioned
      frpc/frps wire protocol.
    - '2026: v0.69.1 refined UDP and SUDP behavior for the new wire protocol.'
  usage:
    - >
      A typical frpc workflow is to put frps on a public server, configure frpc with
      that server address and one or more local services, then start frpc with a TOML
      configuration file. The official README includes SSH, web-service, DNS,
      Unix-domain-socket, HTTPS, private-service, and P2P examples.
    - >
      The client side is also where users configure proxy definitions, local IPs and
      ports, plugins, authentication parameters, optional compression or encryption, and
      newer transport settings such as the frpc/frps wire protocol.
related-packages:
  - id: brew:frps
    reason: >
      frps is the public-server counterpart that accepts frpc connections and publishes
      the client's configured private services.
    rel: adjacent_workflow
    sources:
      - https://gofrp.org/en/docs/setup/
      - https://github.com/fatedier/frp
  - id: brew:rathole
    reason: >
      Choose rathole when you want a more narrowly focused Rust client/server reverse
      tunnel with a single TOML-configured binary for both roles.
    rel: alternative
    sources:
      - https://github.com/rathole-org/rathole#readme
      - https://gofrp.org/en/docs/setup/
