id: brew:cassandra-reaper
display-name: Reaper for Apache Cassandra
repo: null
docs:
  - https://cassandra-reaper.io/docs
config-file-location:
  linux:
    - /etc/cassandra-reaper/cassandra-reaper.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Reaper is aimed at operators of Cassandra clusters where anti-entropy repair is a
      recurring operational requirement. Its package distribution includes tarball,
      package repository, Docker-oriented configuration, and a Homebrew formula for
      local use.
    - >
      Homebrew analytics show 270 installs in the last 365 days in the formula API;
      GitHub metadata shows a medium-sized operations tool with hundreds of stars and
      forks.
  package-nerd-significance:
    - >
      Reaper matters because Cassandra repair is essential but operationally awkward.
      Packaging Reaper gives operators a standard daemon, config file, logs, CLI, and
      upgrade path for a task that otherwise tends to become local scripting.
  project-history:
    - >
      The public repository was created in 2016. The official README notes that this
      repository is a fork of the original Reaper project created by Spotify, and the
      current project is maintained under The Last Pickle organization.
    - >
      Reaper evolved around Cassandra operational repair: segmented repairs, parallel
      repair coordination, repair schedules, multiple storage backends, a UI, REST API,
      and the `spreaper` command-line client.
  related-projects:
    - Apache Cassandra is the database Reaper repairs.
    - Spotify's original Reaper project is credited in the README as the source project.
  sources:
    - https://api.github.com/repos/thelastpickle/cassandra-reaper
    - https://github.com/thelastpickle/cassandra-reaper
    - https://cassandra-reaper.io/
    - https://cassandra-reaper.io/docs
    - https://formulae.brew.sh/api/formula/cassandra-reaper.json
  summary:
    - >
      Reaper for Apache Cassandra is a centralized, stateful repair scheduler and
      management interface for Cassandra clusters, with a web UI, REST API, and
      `spreaper` CLI.
  timeline:
    - '2016: Public GitHub repository created under thelastpickle/cassandra-reaper.'
    - '2022: Changelog shows scheduler, topology, metrics, and storage fixes in the 3.x line.'
    - '2025: Version 4.0.0 released after beta and release-candidate work.'
    - '2026: Version 4.2.5 released and packaged by Homebrew.'
  usage:
    - >
      Operators configure `cassandra-reaper.yaml`, run the server, register Cassandra
      clusters, and schedule or trigger repairs. The UI is served under `/webui/`, the
      REST API is exposed on port 8080 by default, and `spreaper` can issue commands to
      a running Reaper instance.
related-packages:
  - id: brew:cassandra
    reason: >
      Apache Cassandra is the database Reaper connects to over JMX and maintains by
      scheduling and coordinating anti-entropy repairs.
    rel: adjacent_workflow
    sources:
      - https://cassandra-reaper.io/docs/
      - https://cassandra.apache.org/doc/stable/cassandra/managing/operating/repair.html
