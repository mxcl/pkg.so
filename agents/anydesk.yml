config-file-location:
  unix:
    - ~/.anydesk/service.conf
    - /etc/anydesk/service.conf
  windows:
    - '%APPDATA%\AnyDesk\service.conf'
    - '%PROGRAMDATA%\AnyDesk\service.conf'
credentials-file-location: null
history:
  adoption-history:
    - >
      AnyDesk grew from a lightweight remote-desktop product into a cross-platform
      service used for remote support, remote work, unattended administration, and
      management of always-on devices.
  package-nerd-significance:
    - >
      AnyDesk is notable to package users as proprietary remote-access software that can
      run portably or as an installed system service. Its documented configuration
      directories are important when migrating installations, preserving device
      identities, or preparing reproducible deployments.
  project-history:
    - >
      AnyDesk Software GmbH was founded in Germany in 2014 to provide fast, accessible
      remote control. The product's low-latency design is built around the company's
      proprietary DeskRT codec for transmitting graphical desktop content.
  related-projects:
    - >
      Comparable remote-access systems include Remote Desktop Protocol and VNC
      implementations, along with products such as TeamViewer and RustDesk.
  sources:
    - https://anydesk.com/en/ai-info
    - https://anydesk.com/en/leadership-team
    - https://support.anydesk.com/back-up-anydesk-id-and-settings
    - https://support.anydesk.com/docs/quick-start-guide
    - https://support.anydesk.com/unattended-access
  summary:
    - >
      AnyDesk is proprietary cross-platform software for interactive remote desktop
      sessions, unattended access, technical support, and remote device administration.
  timeline:
    - '2014: AnyDesk was founded in Germany.'
    - '2014: The AnyDesk remote-access product was launched around its DeskRT codec.'
    - >
      2020s: AnyDesk expanded its administration, unattended-access, and cross-platform
      capabilities.
  usage:
    - >
      Users enter a remote device's AnyDesk ID or Alias and either wait for the remote
      user to approve the session or authenticate through unattended access. Sessions
      can provide desktop control, file transfer, privacy controls, and configurable
      permission profiles.
