history:
  adoption-history:
    - >
      Northern Softworks distributes the utility as a native macOS application. The
      supplied package metadata records a Homebrew Cask named
      northern-softworks-cache-cleaner, giving command-line-oriented Mac users a
      reproducible installation route.
  package-nerd-significance:
    - >
      The application represents the long-running Mac utility tradition of wrapping
      cache deletion, maintenance scripts, disk checks, and troubleshooting commands in
      a graphical interface. Its version-specific branding also makes the cask useful to
      package curators who track applications across annual macOS naming changes.
  project-history:
    - >
      Northern Softworks' manual carries a 2002–2024 copyright notice and documents the
      Sequoia generation of its Cache Cleaner family. The input identifies the
      corresponding current application as Golden Gate Cache Cleaner, continuing the
      product family's practice of matching its name to a macOS release.
  related-projects:
    - >
      The manual identifies the Cache Cleaner Engine as the companion component used for
      automatic maintenance.
    - >
      The utility exposes or wraps macOS facilities such as Disk Utility, periodic
      maintenance scripts, Spotlight, Launch Services, SMART checks, and ClamAV-based
      scanning.
  sources:
    - >
      Official Northern Softworks user manual:
      https://www.northernsoftworks.com/cachecleanerUsersManual.pdf
    - source_facts.applications
    - source_facts.homepage
    - source_facts.package-manager
  summary:
    - >
      Golden Gate Cache Cleaner is the macOS 26-era member of Northern Softworks' Cache
      Cleaner utility family, a graphical collection of system-maintenance,
      troubleshooting, cache-cleaning, and automation tools.
  timeline:
    - '2002: Earliest year in the copyright range printed by the official Cache Cleaner manual.'
    - '2024: The official manual documented the Sequoia Cache Cleaner generation.'
    - >
      2026: The supplied package record identifies the application as Golden Gate Cache
      Cleaner.
  usage:
    - >
      Users employ the application to clear system and application caches, run
      maintenance scripts, inspect system information, repair selected system state,
      create diagnostic or installer media, and automate recurring maintenance. The
      manual cautions that cache cleaning and some repair operations are irreversible
      and can restart the machine.
