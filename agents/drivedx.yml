history:
  adoption-history:
    - >
      DriveDx matured through continuous additions for newer HDDs, SATA SSDs, NVMe
      devices, Apple storage, Fusion Drives, SoftRAID configurations, external-drive
      access, and successive macOS releases.
    - >
      Later releases adopted hardened runtime and notarization, removed 32-bit Mac
      support, and added native Apple Silicon support while continuing to refine
      diagnostics using field feedback and accumulated failure histories.
  package-nerd-significance:
    - >
      DriveDx is a Mac-specific interpretation layer over often opaque S.M.A.R.T.
      telemetry. Package users care about it because installing the cask is easy, but
      complete external USB or FireWire diagnostics may also require a separate
      low-level SAT SMART driver.
    - >
      Its unusually long official release history captures the maintenance burden of
      storage diagnostics: changing macOS security rules, architecture transitions,
      bridge drivers, vendor-specific attributes, and model-specific heuristics.
  project-history:
    - >
      DriveDx is BinaryFruit's proprietary drive-health diagnostic and forecasting
      utility for macOS. Its name expands to Drive Diagnostics, using “Dx” in the
      medical sense of diagnosis.
    - >
      The official version history reaches at least version 1.0.6 in 2013. The product
      evolved beyond merely displaying raw S.M.A.R.T. values by applying separate HDD
      and SSD rules, model- and firmware-aware heuristics, measurement history, ratings,
      self-tests, alerts, and reports.
  related-projects:
    - >
      macOS Disk Utility exposes a simpler built-in S.M.A.R.T. status, while DriveDx
      provides deeper interpretation and historical monitoring.
    - >
      A separately installed SAT SMART driver can enable diagnostics for external USB
      and FireWire drives where macOS does not expose the required data directly.
  sources:
    - https://binaryfruit.com/drivedx/help
    - https://binaryfruit.com/drivedx/kb
    - https://binaryfruit.com/drivedx/release-notes
  summary:
    - >
      DriveDx is a proprietary macOS utility from BinaryFruit for monitoring and
      forecasting HDD and SSD health. It interprets S.M.A.R.T. indicators with
      drive-specific heuristics, maintains measurement history, runs self-tests, and
      warns about developing failures.
  timeline:
    - >
      2013: Version 1.0.6 improved diagnostics and bundled support for external USB and
      FireWire drive monitoring.
    - >
      2015: Version 1.4 added richer device statistics, configurable health monitoring,
      and newer macOS and drive support.
    - "2020: Version 1.10 adopted Apple's hardened runtime and notarization."
    - '2021: Version 1.11 removed 32-bit Mac support and improved Apple Silicon compatibility.'
    - >
      2023: Version 1.12 added native Apple Silicon support; version 1.12.1 added macOS
      Sonoma readiness.
  usage:
    - >
      DriveDx normally runs in the background, periodically reads drive-health data,
      evaluates ratings and trends, and alerts when it finds warning, failing, or failed
      states. Users can inspect health indicators, error logs, statistics, temperatures,
      and self-test results or configure email reports.
    - >
      Its results should be treated as early-warning evidence rather than a replacement
      for backups. Historical measurements improve some heuristic evaluations,
      especially for undocumented vendor-specific attributes.
