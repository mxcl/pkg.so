history:
  adoption-history:
    - >
      Public adoption evidence is thin and mostly vendor-controlled. Datadog's
      announcement pointed users to macOS and Linux installation paths, while Homebrew
      cask distribution makes the macOS CLI available through a package-manager
      workflow.
  package-nerd-significance:
    - >
      coterm is package-nerd interesting as a vendor CLI cask: it packages an operations
      and security workflow whose behavior depends on Datadog services, policy rules,
      and a local command shim rather than on a public source tree.
  project-history:
    - >
      Datadog announced CoTerm in preview on 2024-06-26 as a tool for safer command-line
      workflows during operations and incident response. Datadog's documentation
      describes CoTerm as a CLI utility that records terminal sessions, analyzes
      recordings in Datadog, and adds a validation layer to terminal commands.
    - >
      The Homebrew cask metadata records coterm version 1.0.0 and the vendor binary name
      ddcoterm. The vendor-hosted macOS arm64 binary for that version reported a
      Last-Modified timestamp of 2025-03-13 when checked during this enrichment run.
  related-projects:
    - >
      CoTerm integrates with Datadog terminal session review, Datadog Case Management,
      Log Explorer, Event Explorer, and Sensitive Data Scanner.
  sources:
    - https://coterm.datadoghq.com/coterm/1.0.0/29eab36/macos-arm64/ddcoterm
    - https://docs.datadoghq.com/coterm.md
    - https://docs.datadoghq.com/coterm/
    - https://formulae.brew.sh/api/cask/coterm.json
    - https://www.datadoghq.com/blog/introducing-coterm/
  summary:
    - >
      coterm is Datadog's CoTerm command-line utility for recording terminal sessions
      and adding validation or approval checks around terminal commands.
  timeline:
    - '2024: Datadog announces CoTerm preview on 2024-06-26.'
    - '2025: Datadog updates the CoTerm announcement on 2025-04-03.'
    - '2025: The version 1.0.0 macOS arm64 binary reports Last-Modified 2025-03-13.'
  usage:
    - >
      Datadog documents CoTerm for recording interactive terminal sessions, reviewing
      terminal sessions as replays, events, or logs, warning before risky commands,
      requiring approvals through Datadog Case Management for selected commands, and
      redacting sensitive data through Datadog Sensitive Data Scanner.
