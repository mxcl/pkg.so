id: brew:edbrowse
display-name: Edbrowse
repo: null
docs:
  - https://edbrowse.org/usersguide.html
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/edbrowse/ebrc
    - ~/.ebrc
credentials-file-location:
  unix:
    - ~/.ebrc
    - ~/.netrc
history:
  adoption-history:
    - >
      Edbrowse adoption has always been specialized. The homepage says it was originally
      written for blind users, while sighted users have used its unusual scripting
      abilities for batch jobs, cron jobs, web forms, email, and database access.
    - >
      The package appears in multiple Unix-like package managers and also provides
      statically linked Linux executables for users who do not want to build from
      source. That matches its audience: users who need a working command-line web tool
      more than a modern graphical browser.
  package-nerd-significance:
    - >
      Edbrowse is significant because it is not merely a text browser. It is an
      accessible, scriptable, ed-shaped environment for interacting with the web, mail,
      databases, and local files, which makes it a rare package in the space between
      editor, browser, and automation tool.
    - >
      It is also a packaging challenge in miniature: a command-line tool that depends on
      networking, HTML handling, JavaScript engines, SSL, PCRE, curl, ODBC, and platform
      accessibility expectations while preserving a terse line interface.
  project-history:
    - >
      The official user guide says Karl Dahlke wrote the first version of edbrowse in
      Perl in 2001 and remains the principal developer. The homepage says the original
      Perl version was portable but lacked many of the features that later arrived in
      the C implementation.
    - >
      Karl Dahlke rewrote version 2 in C and initially wrote a JavaScript compiler and
      engine from scratch. The homepage says version 3.1.1 moved to Mozilla's
      SpiderMonkey JavaScript engine, and later releases migrated through Duktape,
      QuickJS, and QuickJS-NG as the JavaScript ecosystem changed.
    - >
      The project is now maintained by the edbrowse organization on GitHub. The official
      site describes it as a work in progress and asks for developers, while the
      repository metadata shows ongoing activity through June 2026.
  related-projects:
    - ed is the interface model edbrowse intentionally resembles.
    - >
      SpiderMonkey, Duktape, QuickJS, and QuickJS-NG are JavaScript engines used across
      edbrowse's history.
    - curl and PCRE are named by the project documentation as important dependencies.
    - The Perl edbrowse implementation remains available as an unsupported historical version.
  sources:
    - https://edbrowse.org/
    - https://edbrowse.org/usersguide.html
    - https://api.github.com/repos/edbrowse/edbrowse
  summary:
    - >
      Edbrowse is a command-line editor, browser, mail client, IRC client, and database
      front end built around an ed-like line interface. Its history is tightly connected
      to accessibility: the project was originally written for blind users, while also
      attracting users who want scriptable web interaction from a text command language.
  timeline:
    - '2001: Karl Dahlke writes the first version of edbrowse in Perl.'
    - 'Version 2: Edbrowse is rewritten in C with a home-grown JavaScript engine.'
    - 'Version 3.1.1: Edbrowse adopts Mozilla SpiderMonkey for JavaScript.'
    - 'Later 3.x: Edbrowse migrates from Duktape to QuickJS and then QuickJS-NG.'
    - '2026: GitHub repository metadata shows active development.'
  usage:
    - >
      Edbrowse starts from an ed-like editing model, then adds URL loading, HTML
      rendering, links, forms, JavaScript, mail, IRC, SQL access through ODBC, and
      directory editing. The guide explicitly says familiarity with ed helps.
    - >
      Configuration uses an edbrowse configuration file containing functions similar to
      shell startup files. The batch input records common Unix paths as
      `$XDG_CONFIG_HOME/edbrowse/ebrc` and `~/.ebrc`, and the user guide documents
      scripts, mail, IRC, and database configuration in that file.
related-packages:
  - id: brew:ed
    reason: >
      GNU ed provides the command language and editing model that Edbrowse deliberately
      extends, and Edbrowse's guide says fluency with ed helps users operate it.
    rel: adjacent_workflow
    sources:
      - https://edbrowse.org/usersguide.html
      - https://www.gnu.org/software/ed/manual/ed_manual.html
  - id: brew:lynx
    reason: >
      Choose Lynx for a conventional keyboard-navigated terminal web browser; choose
      Edbrowse when ed-style editing, scripting, mail, forms, or database access are
      central to the workflow.
    rel: alternative
    sources:
      - https://edbrowse.org/usersguide.html
      - https://lynx.invisible-island.net/lynx_help/Lynx_users_guide.html
  - id: brew:quickjs-ng
    reason: >
      Current Edbrowse releases require QuickJS-NG to execute JavaScript encountered
      during text-based browsing, making it a documented build and runtime companion.
    rel: adjacent_workflow
    sources:
      - https://edbrowse.org/
      - https://quickjs-ng.github.io/quickjs/
