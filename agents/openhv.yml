  windows:
    - '%APPDATA%\OpenRA\settings.yaml'
credentials-file-location: null
history:
  adoption-history:
    - >
      OpenHV is distributed for Linux, macOS, and Windows. Its official website links
      releases and packages through itch.io, GitHub, Homebrew, Chocolatey, Winget,
      Flathub, Snapcraft, AUR, and Docker, reflecting adoption across both game
      storefronts and operating-system package ecosystems.
  package-nerd-significance:
    - >
      OpenHV demonstrates how an open-source game can combine an established engine with
      freely redistributable code and content. Its many official packaging channels,
      dedicated-server image, date-based releases, and editable MiniYAML and Lua content
      make it interesting to game packagers and modders.
  project-history:
    - >
      OpenHV is an open-content science-fiction real-time strategy game derived from
      Daniel Cook's Hard Vacuum design and implemented as an OpenRA mod. The project
      describes itself as a standalone game with LAN and internet multiplayer, skirmish
      bots, spectators, replay sharing, and an integrated map editor.
    - >
      The source code, like the OpenRA engine and SDK scripts it uses, is released under
      GPLv3. Game artwork, sounds, rules, and other content use various Creative Commons
      licenses.
  related-projects:
    - >
      OpenRA supplies the engine and modding model used by OpenHV. Hard Vacuum supplies
      the original game design and visual concept on which OpenHV is based.
  sources:
    - https://github.com/OpenHV/OpenHV
    - https://github.com/OpenHV/OpenHV/releases
    - https://github.com/OpenHV/OpenHV/wiki
    - https://www.openhv.net/
  summary:
    - >
      OpenHV is a free, open-source pixel-art science-fiction real-time strategy game
      built with the OpenRA engine and based on the Hard Vacuum design.
  timeline:
    - '2023: The official release archive includes the 20231125 release.'
    - '2024: Regular date-based releases continued, including 20240401 and 20240908.'
    - '2025: The project published feature and bug-fix releases through the 20250725 release.'
  usage:
    - >
      Players use OpenHV for single-player skirmishes and network multiplayer, while
      spectators and replay sharing support community play. Modders edit MiniYAML rules
      and Lua scripts, and server operators can run the official dedicated-server mode
      or Docker image.
