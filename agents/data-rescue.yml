history:
  adoption-history:
    - >
      Data Rescue became a long-running commercial recovery utility for Mac users and
      later gained a Windows edition. Homebrew Cask provides Mac users with a
      package-manager installation route alongside Prosoft's disk-image download.
  package-nerd-significance:
    - >
      Data Rescue represents the proprietary, GUI-focused side of the macOS package
      ecosystem: a specialized recovery application distributed as a vendor DMG but made
      reproducibly discoverable and installable through Homebrew Cask.
  project-history:
    - >
      Prosoft Engineering developed Data Rescue as a nondestructive file-recovery
      utility. Official materials document several generations, including Data Rescue 3,
      Data Rescue 4 in 2014, Data Rescue 5, and Data Rescue 6.
    - >
      The software is designed to scan damaged, reformatted, or otherwise inaccessible
      media and copy recoverable files to a separate destination rather than modifying
      the source disk.
  related-projects:
    - >
      Prosoft Drive Genius and Data Backup Pro are related Prosoft storage utilities.
      BootWell and Recovery Drive functionality appeared in earlier Data Rescue
      workflows.
  sources:
    - https://www.prosofteng.com/blog
    - https://www.prosofteng.com/downloads
    - https://www.prosofteng.com/support
    - https://www.prosofteng.com/support/docs/Data-Rescue-4-User-Guide.pdf
  summary:
    - >
      Data Rescue is Prosoft Engineering's commercial data-recovery application for
      recovering files from failed, corrupted, reformatted, or accidentally erased
      storage.
  timeline:
    - '2014: Prosoft released Data Rescue 4 and subsequently version 4.1.'
    - >
      2020: Prosoft directed newer macOS users to Data Rescue 5 while retaining legacy
      downloads.
    - >
      2023: Prosoft published updated installation and activation instructions for Data
      Rescue on macOS.
    - "2026: Prosoft's official downloads page lists Data Rescue 6.0.9 for macOS and Windows."
  usage:
    - >
      Users install the application, select a source device, run the appropriate scan,
      preview recoverable files, and restore them to a different disk. Prosoft advises
      minimizing writes to the damaged source to avoid overwriting recoverable data.
