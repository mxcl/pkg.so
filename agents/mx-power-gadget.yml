history:
  adoption-history:
    - >
      The application launched shortly after the Apple Silicon transition and has been
      updated for successive M-series generations. Official releases added Big Sur
      compatibility, configurable displays, sensor corrections for M2 and M4 machines,
      and expanded frequency ranges for newer chips.
  package-nerd-significance:
    - >
      Mx Power Gadget fills the Apple Silicon niche formerly associated with
      processor-specific power and frequency gadgets: it exposes CPU, GPU,
      efficiency-core, performance-core, temperature, frequency, utilization, and power
      behavior in a compact native utility. This makes it useful for performance
      testing, thermal observation, and comparing workloads across M-series Macs.
  project-history:
    - >
      Seense released Mx Power Gadget 1.0 on 1 December 2021 as an Apple Silicon
      monitoring utility. Early updates corrected sensor and power reporting, while
      version 1.1 added logging, preferences, unit selection, and configurable GPU and
      core displays.
    - >
      Later maintenance followed Apple's processor generations and macOS releases,
      including M2 temperature compensation, M4 sensor work, a higher frequency graph
      ceiling, M5-related updates, and localization.
  related-projects:
    - >
      Mx Power Gadget is produced by Seense and presented alongside MenuBar Stats, the
      developer's broader modular macOS system monitor.
  sources:
    - 'Official developer page: https://www.seense.com/about/'
    - 'Official product page: https://www.seense.com/menubarstats/mxpg/'
    - 'Official release history: https://www.seense.com/menubarstats/mxpg/whatsnew.html'
  summary:
    - >
      Mx Power Gadget is a native macOS performance, power, frequency, utilization, and
      temperature monitor designed exclusively for Apple Silicon Macs.
  timeline:
    - '2021-12-01: Version 1.0 first released.'
    - '2022-01-31: Version 1.1 added logging and a preferences panel.'
    - '2023-04-07: Version 1.4 improved M2 temperature reporting.'
    - '2024-11-28: Version 1.5 updated temperature sensors for M4.'
    - '2025-01-06: Version 1.5.2 expanded the frequency graph for M4.'
    - '2026-03-08: Version 1.6 added M5-related updates.'
    - '2026-04-25: Version 1.6.4 added translations and corrections.'
  usage:
    - >
      Users run the app on an Apple Silicon Mac to inspect real-time performance metrics
      and graphs. The preferences introduced in version 1.1 allow Celsius or Fahrenheit
      units and control whether GPU and efficiency/performance-core data appear in
      utilization and frequency views; logging can record observations.
