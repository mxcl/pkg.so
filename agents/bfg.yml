id: brew:bfg
display-name: BFG Repo-Cleaner
repo: https://github.com/rtyley/bfg-repo-cleaner
docs:
  - https://rtyley.github.io/bfg-repo-cleaner
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      BFG became widely known because git-filter-branch was powerful but slow and
      difficult to use for common cleanup jobs. BFG narrowed the problem to the
      operations teams most often needed after accidentally committing giant artifacts
      or secrets, then packaged that workflow as a standalone executable.
    - >
      The input records Homebrew, MacPorts, and Scoop packaging, matching BFG's
      cross-platform appeal: it is a Java-based tool that can be used from macOS, Linux,
      or Windows when a Git repository needs emergency cleanup.
  package-nerd-significance:
    - >
      BFG is package-nerd significant because it turned one of Git administration's
      ugliest chores into a memorable, packaged CLI. Before git-filter-repo became the
      modern upstream-recommended tool, BFG was the package many developers reached for
      when Git history got polluted.
    - >
      Its design is a good example of a focused package beating a built-in
      general-purpose tool for a painful workflow: fewer knobs, better defaults for
      common cleanup cases, and performance claims strong enough to become part of the
      project's identity.
  project-history:
    - >
      The official GitHub repository was created in December 2012. BFG's README and
      project site center on two core repository-cleaning jobs: stripping large blobs
      and replacing sensitive text across history.
    - >
      Release history shows BFG maturing through the 2010s, including Git LFS support in
      v1.12.5 in 2015, Java 8 and Scala 2.12 support in v1.13.0 in 2018, Scala 2.13 in
      v1.14.0 in 2021, and v1.15.0 in January 2025.
  related-projects:
    - >
      Related projects include git-filter-branch, git-filter-repo, git lfs migrate, and
      secret-scanning tools such as Gitleaks or TruffleHog that may detect the problem
      before BFG is needed.
  sources:
    - https://api.github.com/repos/rtyley/bfg-repo-cleaner
    - https://api.github.com/repos/rtyley/bfg-repo-cleaner/releases
    - https://raw.githubusercontent.com/rtyley/bfg-repo-cleaner/master/README.md
    - https://rtyley.github.io/bfg-repo-cleaner/
    - source_facts.package-manager
  summary:
    - >
      BFG Repo-Cleaner is a Scala/JVM command-line tool for removing large files,
      passwords, credentials, and other unwanted blobs from Git history. Its official
      positioning is as a simpler and much faster alternative to git-filter-branch for
      cleansing bad data from repositories.
  timeline:
    - '2012: Official repository created in December.'
    - '2015: v1.12.5 added Git LFS support.'
    - '2018: v1.13.0 moved to Scala 2.12 and Java 8.'
    - '2021: v1.14.0 updated to Scala 2.13.'
    - '2025: v1.15.0 released in January.'
  usage:
    - >
      Typical usage is on a mirror clone or bare repository, with commands such as
      stripping blobs above a size threshold or replacing text listed in a file. After
      BFG rewrites the repository objects, users still need the normal Git cleanup and
      force-push workflow expected after history rewriting.
    - >
      Because it rewrites repository history, BFG is used deliberately: it is most
      valuable when a repository has already leaked bulky files or secrets and the team
      needs a repeatable cleanup tool rather than manual filter-branch scripting.
related-packages:
  - id: brew:git-filter-repo
    reason: >
      Choose git-filter-repo for more general history restructuring, full-path
      filtering, Python callbacks, and an integrated rewrite cleanup workflow; its
      official documentation includes direct conversions from BFG commands.
    rel: alternative
    sources:
      - https://github.com/newren/git-filter-repo
      - >
        https://github.com/newren/git-filter-repo/blob/main/Documentation/converting-from-bfg-repo-cleaner.md
      - https://rtyley.github.io/bfg-repo-cleaner/
