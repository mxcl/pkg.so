id: brew:daemon
display-name: daemon
repo: null
docs:
  - https://libslack.org/daemon
config-file-location:
  unix:
    - /etc/daemon.conf
    - ~/.daemonrc
credentials-file-location: null
history:
  adoption-history:
    - >
      daemon fits a long Unix packaging niche: small service-wrapper commands that
      predate or complement init systems. Its official page lists Linux, BSD, Solaris,
      and macOS-oriented keywords and maintains downloadable source tarballs rather than
      advertising an official source-control repository.
  package-nerd-significance:
    - >
      The package is interesting because it preserves an old-school Unix service-wrapper
      workflow in modern package managers: one small executable, a manpage,
      configuration files, and source tarballs from an upstream software page.
  project-history:
    - >
      The official libslack page describes daemon as a companion to libslack's
      daemonization functionality: it performs the process-context work for programs
      written in languages or scripts that do not daemonize themselves.
  related-projects:
    - >
      daemon is related to libslack, daemonize, system daemonization APIs, pidfile-based
      service wrappers, and Unix init/service supervision tools.
  sources:
    - https://libslack.org/daemon
    - https://libslack.org/daemon/manual/daemon.1.html
  summary:
    - >
      daemon is a Unix command that turns other processes into daemon-style background
      services, adding process setup, pidfile management, logging, respawn behavior, and
      optional configuration files around a client command.
  timeline:
    - '0.6.4: Official download table lists a final 0.6.4 tarball.'
    - '0.8.4: Official download table lists daemon-0.8.4 as the current source tarball.'
  usage:
    - >
      Users invoke daemon around another command, optionally name it, write and lock
      pidfiles, send output to syslog, respawn it, and define default options in system
      or per-user configuration files.
related-packages:
  - id: brew:daemonize
    reason: >
      Choose daemonize for a smaller one-shot wrapper focused on detaching, redirection,
      pidfiles, and locking; choose daemon when you also need named-service
      configuration, syslog integration, or respawning.
    rel: alternative
    sources:
      - https://www.libslack.org/daemon/manual/daemon.1.html
      - https://software.clapper.org/daemonize/daemonize.html
tags:
  - cli
  - daemonization
  - process-management
  - service-wrapper
  - unix
