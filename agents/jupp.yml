config-file-location:
  unix:
    - ~/.jupprc
credentials-file-location: null
history:
  adoption-history:
    - >
      jupp is niche, but its presence in Homebrew, Debian and Ubuntu as `joe-jupp`,
      Fedora, and Nix shows that distributions kept it available for users who wanted
      the JOE editing model with the MirBSD-maintained patch set.
    - >
      Its audience is mostly terminal-editor users who prefer WordStar-style or
      JOE-style keybindings and want a compact editor with syntax highlighting,
      rescue-system friendliness, and programmer features.
  package-nerd-significance:
    - >
      jupp is package-nerd interesting because it is a fork maintained as a patchy,
      portable editor distribution rather than a clean modern upstream repository.
      Packagers preserve it for users who care about exact terminal-editor behavior,
      small rescue-friendly builds, and old-school keybinding compatibility.
    - >
      It also shows a common packaging pattern for small Unix tools: the authoritative
      source is a project web page with tarballs, CVS instructions, manpages, and
      checksums rather than a GitHub repository.
  project-history:
    - >
      The jupp page describes the Unix/GNU-compatible line as based on JOE 3.1 and the
      MS-DOS-compatible line as based on JOE 2.8. It frames the project as a portable
      version of JOE's Own Editor, developed with GNU autotools and licensed under GPL
      version 1 terms as used by that code base.
    - >
      Rather than tracking modern JOE directly, jupp intentionally stayed on older JOE
      bases that the maintainer considered better behaved overall, then layered in fixes
      and features for professional users.
  related-projects:
    - >
      jupp is directly related to JOE's Own Editor and keeps JOE-family frontends such
      as `joe`, `jmacs`, `jpico`, `jstar`, and `rjoe`.
    - >
      It is also part of the MirBSD/MirPorts tool ecosystem alongside other MirBSD
      subprojects.
  sources:
    - https://joe-editor.sourceforge.io/
    - https://mbsd.evolvis.org/jupp.htm
  summary:
    - >
      jupp is a programmer-oriented fork and portable variant of JOE's Own Editor. Its
      project page presents it as a JOE-derived editor with bug fixes, security fixes,
      UTF-8 work, programmer conveniences, and the familiar JOE editor flavors.
  timeline:
    - 'JOE 2.8 base: jupp maintained an MS-DOS-compatible line as joe-2.8jupp3.'
    - 'JOE 3.1 base: jupp maintained a Unix/GNU-compatible line as joe-3.1jupp41.'
    - >
      Distribution era: jupp entered package managers including Homebrew, Debian and
      Ubuntu as `joe-jupp`, Fedora, and Nix.
  usage:
    - >
      Users run `jupp` as a terminal editor. The project page notes that related JOE
      flavors such as `jmacs`, `joe`, `jpico`, `jstar`, and `rjoe` are included, though
      not every jupp-specific feature applies to every flavor.
    - >
      The page documents source downloads, checksums, CVS checkout, GNU autotools build
      commands, manpages, and editor tricks such as visible spaces, hex editing, syntax
      highlighting toggles, bracketed paste, and conflict-marker search.
related-packages:
  - id: brew:joe
    reason: >
      Choose JOE for the actively maintained original editor line; jupp is a separately
      maintained JOE-derived variant based on older JOE code with its own fixes and
      portability work.
    rel: alternative
    sources:
      - https://mbsd.evolvis.org/jupp.htm
      - https://joe-editor.sourceforge.io/
