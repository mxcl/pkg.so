credentials-file-location: null
history:
  adoption-history:
    - >
      Hubble adoption follows Cilium adoption in Kubernetes clusters. The Cilium
      documentation says the Hubble CLI binary is installed by default on Cilium agent
      pods, while package-manager metadata in this batch shows external packaging
      through Homebrew, Nix, winget, and openSUSE for operators who want the CLI outside
      the cluster.
  package-nerd-significance:
    - >
      For package nerds, Hubble is a good example of cloud-native infrastructure tooling
      where the Homebrew formula is not the product's center of gravity. The CLI package
      is useful because it gives laptop-side access to an observability plane whose real
      data source lives inside Kubernetes and Cilium.
  project-history:
    - >
      The cilium/hubble repository was created in November 2019, and public release
      metadata records v0.5.1 in April 2020. The project grew around Cilium's eBPF
      datapath: Hubble consumes visibility generated by Cilium and exposes it through
      the Hubble API, CLI, Relay, metrics, and UI components.
    - >
      Cilium documentation treats Hubble as part of the Cilium observability story
      rather than a standalone packet sniffer. The documentation describes node-local
      visibility from the Hubble API, cluster-wide visibility through Hubble Relay, and
      a UI that discovers service dependency graphs at L3/L4 and L7.
  related-projects:
    - >
      Related projects include Cilium, eBPF, Kubernetes, Hubble Relay, Hubble UI, Cilium
      Cluster Mesh, Prometheus, Grafana, and OpenTelemetry-style observability
      workflows.
  sources:
    - >
      Official Cilium documentation, Hubble repository README, GitHub repository and
      release metadata, and Homebrew package metadata supplied in the batch input.
  summary:
    - >
      Hubble is the Cilium project's observability layer for Kubernetes networking,
      services, and security events. It is built on Cilium and eBPF so that operators
      can inspect service dependencies, network flows, DNS activity, HTTP behavior,
      policy denials, and cluster-wide communication without instrumenting each
      application.
  timeline:
    - '2019: cilium/hubble repository created.'
    - '2020: GitHub Releases metadata records Hubble v0.5.1.'
    - '2022: GitHub Releases metadata records Hubble v0.10.0.'
    - '2026: Hubble release table records v1.19.4 aligned with the Cilium 1.19 release train.'
  usage:
    - >
      Operators use `hubble observe` to inspect flows, filter traffic by source,
      destination, namespace, labels, protocol, or verdict, and troubleshoot DNS, TCP,
      HTTP, Kafka, and network-policy behavior. In larger deployments, Hubble Relay and
      Hubble UI turn node-local flow data into cluster or multi-cluster observability.
related-packages:
  - id: brew:cilium-cli
    reason: >
      The Cilium CLI enables Hubble and Relay, checks their status, and creates the
      port-forward through which a workstation-side Hubble CLI queries cluster
      observability data.
    rel: adjacent_workflow
    sources:
      - https://docs.cilium.io/en/stable/gettingstarted/hubble_setup/
      - https://github.com/cilium/cilium-cli
