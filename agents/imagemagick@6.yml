id: brew:imagemagick@6
display-name: ImageMagick 6
repo: null
docs:
  - https://legacy.imagemagick.org/script/command-line-processing.php
  - https://legacy.imagemagick.org/script/command-line-tools.php
  - https://legacy.imagemagick.org/script/resources.php
config-file-location:
  unix:
    - $MAGICK_CONFIGURE_PATH
    - $PREFIX/etc/ImageMagick-6
    - $PREFIX/share/ImageMagick-6
    - $XDG_CACHE_HOME/ImageMagick
    - ~/.config/ImageMagick
    - <client path>/etc/ImageMagick
  windows:
    - $MAGICK_CONFIGURE_PATH
    - <windows registry>
    - $PREFIX/config
    - $USERPROFILE/.config/ImageMagick
    - <client path>
credentials-file-location: null
history:
  adoption-history:
    - >
      Versioned ImageMagick packages exist because image-processing stacks often depend
      on command behavior, headers, and libraries that changed across major versions.
      The input metadata shows imagemagick@6 mapped in Homebrew while many other package
      managers expose ImageMagick under the unversioned package name.
  package-nerd-significance:
    - >
      The formula is important because it is a compatibility package. Package
      maintainers can ship ImageMagick 7 as the default while still giving older
      automation and dependent software a versioned path that avoids surprise behavior
      changes.
  project-history:
    - >
      The broader ImageMagick project began at DuPont in the late 1980s and was posted
      to Usenet's comp.archives group on August 1, 1990 after DuPont transferred
      copyright to ImageMagick Studio LLC. Version 6 later became the line associated
      with Anthony Thyssen's work on clearer command-line processing for multiple
      images.
    - >
      The legacy repository and website describe ImageMagick 6 as a maintained legacy
      suite and recommend upgrading legacy installations to version 7. Its docs keep the
      version 6 command-line tools, resources, and configuration paths available for
      users and packagers who need that behavior.
  related-projects:
    - >
      Related projects include the ImageMagick 7 repository, GraphicsMagick, Magick++,
      Magick.NET, Anthony Thyssen's ImageMagick Usage examples, and the Homebrew
      imagemagick and imagemagick-full formulas.
  sources:
    - >
      Official ImageMagick history page, ImageMagick 6 README, legacy command-line tools
      and resources documentation, GitHub repository metadata, and Homebrew formula
      metadata.
  summary:
    - >
      imagemagick@6 is the Homebrew formula for the legacy ImageMagick 6 branch. It
      preserves the version 6 command-line and library behavior for software that has
      not moved to the ImageMagick 7 interfaces or assumptions.
  timeline:
    - "1990: ImageMagick is posted to Usenet's comp.archives group."
    - >
      Version 6: Command-line semantics are redesigned around clearer handling of
      multiple images.
    - '2018: The ImageMagick6 GitHub repository is created for the legacy branch.'
    - '2026: The legacy website states an April 1, 2029 end-of-life date for ImageMagick 6.'
  usage:
    - >
      Users install imagemagick@6 when a script or dependency expects the ImageMagick 6
      tool names, configuration layout, or library interfaces. The legacy command-line
      tools page documents convert, identify, mogrify, montage, composite, compare,
      display, import, animate, conjure, and stream.
related-packages:
  - id: brew:imagemagick
    reason: >
      Choose the current ImageMagick formula for new deployments and migrate legacy
      commands where necessary, since upstream treats version 6 as a legacy line with a
      declared end-of-life date.
    rel: alternative
    sources:
      - https://github.com/ImageMagick/ImageMagick6
      - https://imagemagick.org/porting/
      - https://formulae.brew.sh/formula/imagemagick
  - id: brew:graphicsmagick
    reason: >
      Choose GraphicsMagick when you need an independently maintained,
      compatibility-focused descendant of the older ImageMagick command and API model.
    rel: alternative
    sources:
      - https://graphicsmagick.sourceforge.io/FAQ.html
      - https://graphicsmagick.sourceforge.io/GraphicsMagick.html
