history:
  adoption-history:
    - >
      Realbyte distributes Money Manager across Apple and Android ecosystems and
      maintains separate platform editions. Its official support material documents
      migration, backup, paid-license, and platform-specific workflows for a broad
      consumer audience.
  package-nerd-significance:
    - >
      For package users, Money Manager is primarily a proprietary desktop/mobile finance
      application rather than an extensible developer tool. Its local database and
      explicit backup/export workflow matter because application removal or device
      failure can otherwise put financial records at risk.
  project-history:
    - >
      Money Manager is developed by Realbyte as a consumer expense-tracking and
      personal-finance application. The product centers on recording income, expenses,
      and transfers, with account statistics, budgets, recurring entries, and backup
      facilities.
  related-projects:
    - Realbyte maintains platform-specific Money Manager editions for macOS, iOS, and Android.
    - >
      Spreadsheet import/export and platform backup services provide interchange paths
      rather than a public plugin or source-code ecosystem.
  sources:
    - >
      Official backup documentation:
      https://help.realbyteapps.com/hc/en-us/articles/360043020434-How-to-backup-and-restore-data
    - 'Official help center: https://help.realbyteapps.com/hc/en-us'
    - 'Official product homepage: https://realbyteapps.com/'
  summary:
    - >
      Money Manager is Realbyte's proprietary personal-finance and expense-tracking
      application. It records transactions and budgets while keeping its working data on
      the user's device.
  timeline:
    - '2022: Realbyte published its current official backup and restore guidance.'
    - '2023: Official support guidance documented transfers between devices and platforms.'
    - '2026: The official help center continues to publish Android and iOS release guidance.'
  usage:
    - >
      Users record income, expenses, and transfers, organize them by account and
      category, and review budgets and statistics. Official support documentation
      strongly recommends regular backups because application data is stored on the
      device.
    - >
      Backups can be exported through supported cloud, email, or file-sharing workflows.
      Official documentation identifies `money.sqlite` as a backup database filename in
      relevant device-transfer workflows.
