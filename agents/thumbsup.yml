history:
  adoption-history:
    - >
      DEVONtechnologies distributes ThumbsUp as freeware for the Mac community. It has
      persisted as one of the company's small standalone utilities alongside products
      such as EasyFind, PhotoStickies, and XMenu.
  package-nerd-significance:
    - >
      ThumbsUp is a classic single-purpose Mac utility: small, drag-and-drop driven, and
      useful in batch workflows without requiring a full image editor. Homebrew Cask
      turns the vendor-distributed application into a reproducible install.
  project-history:
    - >
      DEVONtechnologies created ThumbsUp as a quick thumbnail generator and image
      converter. An official 2013 update grouped it with the company's long-running
      freeware, while a 2019 release modernized it for 64-bit macOS and Catalina-era
      security requirements.
  related-projects:
    - DEVONtechnologies' EasyFind, PhotoStickies, and XMenu freeware utilities.
    - >
      DEVONthink, whose official workflow article recommends ThumbsUp for reducing
      embedded image sizes.
  sources:
    - https://shop.devontechnologies.com/blog/20231219-resize-images
    - https://shop.devontechnologies.com/blog/updatesforeasyfindthumbsupandxmenu
    - https://www.devontechnologies.com/apps/freeware
    - https://www.devontechnologies.com/blog/20191114-autumn-updates
  summary:
    - >
      ThumbsUp is a freeware macOS utility from DEVONtechnologies for batch-generating
      thumbnails and resized image files.
  timeline:
    - >
      2013: DEVONtechnologies published an update with new localizations, Mavericks
      adjustments, and fixes.
    - >
      2019: ThumbsUp became 64-bit-only and added Catalina-related and App Transport
      Security adjustments.
    - >
      2023: DEVONtechnologies documented ThumbsUp as a practical image-resizing
      companion for document workflows.
  usage:
    - >
      Users choose output naming, format, size, quality, sharpening, and anti-aliasing
      options, then drag images, movies, PDFs, or folders onto the app for batch
      conversion. Generated files are written beside the originals.
