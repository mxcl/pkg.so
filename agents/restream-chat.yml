history:
  adoption-history:
    - >
      Restream Chat became available both in a browser and as a downloadable desktop
      client for Windows, macOS, and Linux. The desktop client added native
      notifications, text-to-speech, transparency, click-through behavior, and an
      always-on-top presentation for streamers.
    - >
      Its integration with Restream's multistreaming service and browser-source support
      made it usable alongside encoder software such as OBS rather than only inside
      Restream Studio. The supplied package facts identify a Homebrew cask for the macOS
      client.
  package-nerd-significance:
    - >
      Restream Chat represents the desktop-companion pattern common in streaming
      software: a hosted service is paired with a lightweight native client so chat
      remains visible outside the browser. Package-manager installation is useful for
      keeping that companion application alongside the rest of a broadcaster's desktop
      toolchain.
  project-history:
    - >
      Restream developed Chat as a unified conversation surface for broadcasters sending
      streams to multiple platforms. It combines incoming messages and, where supported
      by each destination, provides replies and cross-platform relaying.
    - >
      By 2021, Restream's official guide documented both the browser version and
      downloadable clients, along with encoder-dashboard and on-stream overlay
      workflows.
  related-projects:
    - Restream Studio provides an integrated browser-based chat panel.
    - >
      OBS Studio and other encoders can display Restream Chat through docks or
      browser-source overlays.
    - >
      Twitch, YouTube, Facebook, Discord, LinkedIn, X, Rumble, and Kick are among the
      services supported to varying degrees for reading, replying, or relaying.
  sources:
    - https://restream.io/blog/restream-chat-everything-you-need-to-know/
    - https://restream.io/chat
    - https://support.restream.io/en/collections/153153-restream-chat
    - source_facts.package-manager
  summary:
    - >
      Restream Chat is Restream's unified chat interface for reading and responding to
      comments from multiple live-streaming destinations in one place.
  timeline:
    - >
      2021: Restream published an extensive official guide documenting browser,
      desktop-client, encoder, and overlay usage.
  usage:
    - >
      Streamers use the desktop application or browser interface to monitor several
      platform chats together, reply to viewers, and relay supported comments between
      communities.
    - >
      The desktop application adds adjustable appearance, opacity, always-on-top and
      click-through modes, notifications, and text-to-speech. Broadcasters can also
      embed a customized chat overlay into streaming software as a browser source.
