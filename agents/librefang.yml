id: brew:librefang
display-name: LibreFang
repo: null
docs:
  - https://docs.librefang.ai/
  - https://docs.librefang.ai/getting-started
  - https://docs.librefang.ai/getting-started/examples
  - https://docs.librefang.ai/integrations/migration
config-file-location:
  unix:
    - ~/.librefang/config.toml
credentials-file-location:
  unix:
    - ~/.librefang/secrets.env
history:
  adoption-history:
    - >
      LibreFang is distributed through several package-manager-friendly channels:
      Homebrew tap and cask, Cargo install from the repository, Docker images, npm, pip,
      Arch packaging, and signed release assets. Official GitHub metadata observed
      during enrichment showed 321 stars and 64 forks, indicating early but visible
      adoption.
  package-nerd-significance:
    - >
      Package maintainers care about LibreFang because it ships as a single Rust-based
      CLI/daemon with multiple official distribution paths, desktop and container
      options, release assets for several platforms, and documented config migration
      from related agent systems.
  project-history:
    - >
      The project presents itself as a community fork of RightNow-AI/openfang with open
      governance and a merge-first pull-request policy. GitHub repository metadata shows
      the librefang/librefang repository was created on 2026-03-12, and the README
      describes the implementation as a Rust-built agent operating system rather than a
      Python wrapper or chatbot framework.
  related-projects:
    - >
      OpenFang is the direct upstream family named by the README and migration docs;
      OpenClaw, LangChain, and AutoGPT are documented migration sources.
  sources:
    - https://api.github.com/repos/librefang/librefang
    - https://docs.librefang.ai/
    - https://docs.librefang.ai/getting-started
    - https://docs.librefang.ai/getting-started/examples
    - https://docs.librefang.ai/integrations/migration
    - https://github.com/librefang/librefang
    - https://github.com/librefang/librefang/releases
  summary:
    - >
      LibreFang is an open-source Agent Operating System written in Rust for running
      autonomous AI agents with lifecycle management, scheduling, channels, workflows,
      memory, skills, MCP integration, and a local dashboard/API.
  timeline:
    - '2026-03-12: GitHub repository created.'
    - '2026-03-25: Early release-candidate tags appear in the official GitHub releases stream.'
    - >
      2026-06-29: v2026.6.29 release published with Homebrew, npm, pip, Cargo, Docker,
      Arch, RPM, Android, Windows, Linux, and macOS install paths documented in the
      release notes.
  usage:
    - >
      The normal CLI flow is to install the binary, run `librefang init` or start the
      daemon, configure at least one LLM provider key, then use commands such as
      `librefang chat`, `librefang agent`, `librefang workflow`, `librefang cron`, and
      `librefang start` for local or daemon-backed agent operation.
related-packages:
  - id: cask:openclaw
    reason: >
      OpenClaw is an alternative agent platform for users with an existing OpenClaw
      deployment; LibreFang provides an automated migration command that imports its
      configuration and data.
    rel: alternative
    sources:
      - https://docs.librefang.ai/integrations/migration
      - https://docs.openclaw.ai/
tags:
