history:
  adoption-history:
    - >
      jp was adopted as a package-manager utility across several Unix-like ecosystems
      because it solves a small CLI problem without requiring a graphical plotting
      stack. The batch package facts list Homebrew, Debian, Ubuntu, MacPorts, Nix,
      Scoop, apk, and openSUSE package names.
  package-nerd-significance:
    - >
      jp is package-nerd attractive because it turns terminal Unicode and braille-style
      canvas output into a tiny analytics surface. It belongs to the same mental shelf
      as jq-adjacent CLI tools: small enough to install casually, useful when a full
      plotting environment would be too much.
  project-history:
    - >
      The upstream repository presents jp as a dependency-light terminal plotting tool
      with prebuilt binaries for Linux, macOS, and Windows and a Go install path under
      github.com/sgreben/jp/cmd/jp. Its README examples emphasize stdin/stdout use,
      JSONPath selection, CSV input, and multiple terminal canvas styles.
  related-projects:
    - jp is commonly composed with jq or other structured-data producers.
    - Its input model uses JSONPath-style expressions for selecting chart data.
  sources:
    - https://formulae.brew.sh/formula/jp
    - https://github.com/sgreben/jp
    - https://github.com/sgreben/jp#readme
    - https://github.com/sgreben/jp/releases
  summary:
    - >
      jp is a small Go command-line program for drawing terminal plots from JSON or CSV
      input. It fits the Unix package niche of single-purpose data inspection tools:
      pipe structured data in, choose a JSONPath expression and plot type, and get a bar
      chart, line chart, scatter plot, histogram, or heatmap in the terminal.
  timeline:
    - >
      2018: Release tags in the upstream repository reached the 1.1 series, including
      CSV support and heatmap plotting.
    - >
      2018: The README documented binary downloads for Linux, macOS, and Windows and Go
      installation from github.com/sgreben/jp/cmd/jp.
  usage:
    - >
      Typical use is exploratory: combine jq or another data producer with jp, select
      x/y values using JSONPath, and render quick charts directly in a terminal session.
      CSV support made it useful beyond JSON APIs and logs.
related-packages:
  - id: brew:youplot
    reason: >
      Choose YouPlot when your input is delimiter-oriented tabular data or you need
      terminal chart types such as density and box plots; choose jp for direct
      JSON/JSONPath selection and heatmaps.
    rel: alternative
    sources:
      - https://github.com/sgreben/jp#readme
      - https://github.com/red-data-tools/YouPlot/
  - id: brew:jq
    reason: >
      Use jq before jp to reshape or aggregate JSON—especially JSON Lines with jq's
      slurp mode—before jp selects values and renders the terminal plot.
    rel: adjacent_workflow
    sources:
      - https://github.com/sgreben/jp#readme
      - https://jqlang.github.io/jq/manual/
