history:
  adoption-history:
    - >
      YES24 extends its eBook service across smartphones, tablets, desktop computers,
      and dedicated Crema readers. The official guide emphasizes synchronized reading
      position and access to purchased books on multiple devices.
    - >
      The desktop viewer supports both Windows and macOS, tying desktop reading into
      YES24's Korean eBook store and Crema Club subscription catalog.
  package-nerd-significance:
    - >
      The Homebrew cask gives macOS users a package-manager route to a region-specific,
      DRM-aware commercial eBook client that would otherwise be installed through the
      vendor's download flow.
  project-history:
    - >
      YES24 eBook is the desktop reading client for YES24's wider digital-book
      ecosystem. It connects the retailer's purchased eBooks and Crema Club titles with
      desktop and mobile reading applications and the Crema family of dedicated readers.
  related-projects:
    - YES24
    - Crema
    - Crema Club
  sources:
    - >
      Official YES24 company service overview:
      https://company.yes24.com/pdf/2026_YES24_%ED%9A%8C%EC%82%AC%EC%86%8C%EA%B0%9C%EC%84%9C.pdf
    - 'Official YES24 eBook device guide: https://www.yes24.com/notice/eBookGuide/guide_pc.aspx'
  summary:
    - >
      YES24 eBook is the macOS desktop reader for eBooks purchased from the Korean
      retailer YES24 and for eligible Crema Club subscription titles.
  timeline:
    - '2012: YES24 began selling devices under the Crema eBook-reader brand.'
    - >
      Desktop era: YES24 provided Windows and macOS viewers as part of its multi-device
      eBook service.
  usage:
    - >
      Users purchase an eBook on YES24, install and launch the viewer, sign in with
      their YES24 account, download a title to the bookshelf, and open it for reading.
      Reading position can carry across supported devices.
    - >
      The application requires a YES24 account for access to the user's purchased or
      subscribed library; the official documentation does not describe a separate
      credentials file.
