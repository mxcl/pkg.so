history:
  adoption-history:
    - >
      VisualDiffer is distributed as a native macOS application and officially supports
      installation through Homebrew as well as downloads from GitHub Releases.
  package-nerd-significance:
    - >
      It provides a graphical, macOS-focused alternative to command-line diff utilities,
      while retaining automation possibilities through its visdiff command-line tool.
  project-history:
    - >
      The current open-source project is a Swift rewrite of an earlier Objective-C
      implementation. Its maintainers describe the rewrite as a clean port rather than
      an automated source conversion.
  related-projects:
    - >
      Related tools include command-line diff programs and graphical
      directory-comparison applications. VisualDiffer's own visdiff tool connects
      terminal and GUI workflows.
  sources:
    - https://github.com/visualdiffer/visualdiffer
    - https://wiki.visualdiffer.com/
    - https://wiki.visualdiffer.com/visdiff.html
  summary:
    - >
      VisualDiffer is an open-source macOS application for side-by-side folder
      comparison and file-level diffs. It highlights added, removed, and modified
      content and includes filtering and synchronization-oriented operations.
  timeline:
    - The original VisualDiffer was implemented in Objective-C.
    - >
      The current implementation was rewritten from scratch in Swift and released
      through GitHub and Homebrew.
  usage:
    - >
      Users drag files or directories into the application, inspect differences, filter
      unwanted paths, and perform file operations. The official wiki also documents
      Finder integration, hidden preferences, and the visdiff command-line bridge.
