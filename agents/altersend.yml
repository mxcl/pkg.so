history:
  adoption-history:
    - >
      Official clients cover macOS, Windows, Linux, iOS, and Android, while browser
      links let recipients download without installing the application. The project also
      distributes the macOS client through Homebrew Cask and documents Flatpak and AUR
      installation routes.
  package-nerd-significance:
    - >
      AlterSend is notable to package users as an open-source, cross-platform
      alternative to cloud-backed transfer services. Its package-manager story spans
      Homebrew, Flatpak, and the AUR, while its peer-to-peer design avoids making
      temporary cloud storage part of the normal transfer path.
  project-history:
    - >
      AlterSend was developed as a free, Apache-2.0-licensed application for sending
      files directly between devices. Its official implementation is a monorepo
      containing desktop, mobile, web, relay, and shared packages.
  related-projects:
    - >
      LocalSend and Blip are comparable direct-transfer applications; WeTransfer,
      Dropbox, and Google Drive represent the cloud-upload workflow AlterSend explicitly
      contrasts with.
  sources:
    - 'Official README: https://github.com/denislupookov/altersend#readme'
    - 'Official website: https://altersend.com/'
  summary:
    - >
      AlterSend is an open-source, end-to-end encrypted file-transfer application that
      normally sends data directly between devices without accounts, cloud uploads, or a
      peer-to-peer size limit. An encrypted relay can forward traffic when a direct
      connection is unavailable.
  timeline:
    - >
      Current distribution: Official builds are offered for desktop and mobile
      platforms, with Homebrew Cask documented for macOS.
  usage:
    - >
      Users pair their own devices with a QR code or join code, or create a browser link
      for another recipient. Transfers work on a local network or across the internet
      and can resume after interruption. Relay-routed and browser-link transfers have
      service limits, while direct transfers remain unlimited.
