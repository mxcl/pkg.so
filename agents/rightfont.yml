history:
  adoption-history:
    - >
      RightFont targets designers and creative teams managing local fonts, Google Fonts,
      and shared libraries. Integrations with applications such as Photoshop,
      Illustrator, InDesign, Sketch, Figma, Affinity, and office software make it part
      of practical design-production workflows.
  package-nerd-significance:
    - >
      RightFont is relevant to Mac package users because font activation affects
      system-wide application behavior and design reproducibility. Its library files can
      be placed in cloud-synchronized folders, while fonts may remain in their original
      folders rather than being copied into a system font directory.
  project-history:
    - >
      RightFont has developed as a native macOS font-management application centered on
      visual preview, activation, organization, and design-application integration.
      Version 9 was described by the vendor as its largest update since the initial
      release, and version 10 rebuilt core parts of the app while adding folder-backed
      browsing, improved imports, customizable list views, preview presets, and nested
      tags.
  related-projects:
    - >
      RightFont integrates with Google Fonts and Adobe Fonts and can share libraries
      through services such as Dropbox, Google Drive, and Box. It also cooperates with
      major Adobe, Figma, Sketch, Affinity, and Apple productivity applications.
  sources:
    - https://rightfontapp.com/
    - https://rightfontapp.com/docs
    - https://rightfontapp.com/docs/organize-fonts/share-your-font-library
    - https://rightfontapp.com/updates
  summary:
    - >
      RightFont is a commercial native font manager for macOS that organizes, previews,
      activates, and shares font collections.
  timeline:
    - >
      2026-06-01: RightFont 10.0 introduced a rebuilt core and expanded folder, import,
      preview, list, and tagging workflows.
  usage:
    - >
      Designers use RightFont to preview fonts without permanent installation, group
      them into libraries, sets, tags, and smart filters, activate missing fonts for
      documents, apply fonts inside supported design applications, and synchronize team
      libraries through shared cloud-storage folders.
