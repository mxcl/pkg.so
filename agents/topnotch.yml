history:
  adoption-history:
    - >
      TopNotch targets owners of notched Mac displays and remains deliberately narrow in
      scope: it changes the menu-bar area to visually blend with the camera housing
      while accommodating multiple displays, Spaces, and dynamic wallpapers.
  package-nerd-significance:
    - >
      The Homebrew cask makes this small proprietary menu-bar utility reproducibly
      installable alongside other macOS workstation tools. It exemplifies the
      single-purpose desktop utilities that cask users often automate when provisioning
      a Mac.
  project-history:
    - >
      TopNotch was created by the team behind CleanShot as a free macOS utility for
      visually hiding the display notch. Its official site emphasizes background
      operation, dynamic-wallpaper support, multiple-display handling, and optional
      rounded wallpaper corners.
  related-projects:
    - CleanShot X
    - macOS Dynamic Desktop
  sources:
    - 'Official homepage: https://topnotch.app/'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      TopNotch is a macOS background utility that makes a display notch less visible by
      adapting the wallpaper and menu-bar area.
  timeline:
    - >
      2021: TopNotch emerged for the generation of MacBook Pro hardware that introduced
      a display notch.
  usage:
    - >
      Run TopNotch in the background and enable its notch-hiding treatment. Optional
      settings add rounded wallpaper corners, while the application watches for
      wallpaper changes and supports multiple displays and Spaces.
