provenance:
  category-sources:
    - >
      Official README describes a command-line tool for creating and viewing cheatsheets
      for *nix commands.
    - current_curation.category is developer-tools.
  display-name-sources:
    - Official README heading and source_facts.name use cheat.
  docs-sources:
    - >
      Official INSTALLING.md at https://github.com/cheat/cheat/blob/master/INSTALLING.md
      documents configuration setup.
    - >
      Official README at https://github.com/cheat/cheat describes usage, cheatsheets,
      cheatpaths, and links INSTALLING.md.
  history-sources:
    - https://github.com/cheat/cheat
    - https://github.com/cheat/cheat/blob/master/INSTALLING.md
    - https://api.github.com/repos/cheat/cheat
    - https://api.github.com/repos/cheat/cheatsheets
  repo-sources:
    - >
      source_facts.repo already contains https://github.com/cheat/cheat; prompt requires
      repo null when supplied.
  tags-sources:
    - >
      Official README describes command-line cheatsheets, cheatpaths, searchable tags,
      and documentation workflow.
    - current_curation.tags includes go.
category-confidence: high
