history:
  adoption-history:
    - >
      The underlying DNClient beta began in 2022 and expanded from Linux to Windows and
      numerous processor architectures. Defined Networking introduced the graphical
      DNClient Desktop for macOS and Windows in version 0.8.0 in July 2025, later adding
      endpoint OIDC enrollment and desktop update notifications.
  package-nerd-significance:
    - >
      DNClient Desktop provides a packaged graphical endpoint for Managed Nebula,
      combining Nebula's encrypted overlay networking with centralized enrollment and
      policy delivery. It is distinct from both the headless DNClient Server package and
      the open-source Nebula implementation.
  project-history:
    - >
      Defined Networking created DNClient as the managed client software required for
      hosts to join Managed Nebula networks. It polls the management service for
      configuration changes and applies them to the underlying Nebula connection. The
      product family now includes Desktop, Server, and Mobile Nebula variants.
  related-projects:
    - >
      Nebula is the underlying peer-to-peer overlay-network technology. DNClient Server
      is the headless client variant, while Mobile Nebula serves mobile platforms.
  sources:
    - 'Official DNClient glossary: https://docs.defined.net/glossary/dnclient/'
    - 'Official Desktop glossary: https://docs.defined.net/glossary/dnclient-desktop/'
    - 'Official changelog: https://docs.defined.net/dnclient-changelog/'
    - >
      Official installation guide:
      https://docs.defined.net/get-started/dnclient-desktop/install/
  summary:
    - >
      DNClient Desktop is Defined Networking's graphical macOS and Windows client for
      connecting a device to one or more centrally managed Nebula networks.
  timeline:
    - '2022: DNClient 0.1.0 enters beta.'
    - '2022: DNClient 0.1.5 adds Windows support.'
    - "2023: Version 0.3.0 makes the server client's config directory selectable with a flag."
    - '2025: Version 0.8.0 introduces DNClient Desktop for macOS and Windows.'
    - '2025: Version 0.9.0 adds endpoint OIDC enrollment.'
    - '2026: Desktop enrollment and lifecycle fixes continue in the 0.9 series.'
  usage:
    - >
      An administrator creates a Managed Nebula host and supplies an enrollment code, or
      configures endpoint SSO. The user installs DNClient Desktop, permits its
      background component, enrolls the device, and manages automatic connections from
      the macOS menu bar or Windows taskbar.
