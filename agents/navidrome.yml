credentials-file-location: null
history:
  adoption-history:
    - >
      Navidrome became one of the recognizable modern choices in the self-hosted music
      space because it combined a web UI with compatibility for the long-lived Subsonic
      client ecosystem. GitHub repository metadata consulted on 2026-07-01 showed more
      than 22,000 stars and over 1,500 forks. Homebrew analytics listed 1,243 installs
      over the preceding 365 days, while the input package record also showed
      distribution through Alpine, Nix, Arch, Scoop, and WinGet.
  package-nerd-significance:
    - >
      Navidrome is a useful package because it turns a personal media archive into a
      network service with a stable client API. For package maintainers, it pulls
      together Go service packaging, ffmpeg/taglib runtime dependencies, service files,
      Docker images, and desktop/mobile client interoperability.
  project-history:
    - >
      The GitHub repository was created on 2016-02-24. Public GitHub releases visible
      through the API show early 0.x releases by 2020 and frequent releases continuing
      through v0.62.0 on 2026-06-08. The README describes Navidrome as an open source
      web-based music collection server and streamer and tells users to use releases
      rather than the development branch for stable binaries.
  related-projects:
    - >
      Subsonic, OpenSubsonic, Airsonic, Madsonic, ffmpeg, taglib, Material UI,
      React-Admin, and Subsonic-compatible mobile and desktop clients are central to the
      ecosystem.
  sources:
    - https://api.github.com/repos/navidrome/navidrome
    - https://formulae.brew.sh/formula/navidrome
    - https://github.com/navidrome/navidrome
    - https://github.com/navidrome/navidrome/releases
    - https://www.navidrome.org/docs/installation/docker/
    - https://www.navidrome.org/docs/overview/
  summary:
    - >
      Navidrome is a self-hosted music server and streamer with a browser UI and
      Subsonic/OpenSubsonic-compatible API. Its appeal is a lightweight personal
      streaming service that lets users keep their own music files while using a broad
      ecosystem of Subsonic clients.
  timeline:
    - '2016-02-24: GitHub repository created.'
    - '2020-02-08: v0.7.1 release appears in the GitHub releases history.'
    - '2020-02-16: v0.8.1 released.'
    - '2026-06-08: v0.62.0 released.'
    - '2026-07-01: Homebrew formula listed stable version 0.62.0.'
  usage:
    - >
      Users run Navidrome as a service, usually pointing it at a music directory and a
      separate data directory. The Docker docs show the common pattern: mount
      `/path/to/music` at `/music`, mount `/path/to/data` at `/data`, expose port 4533,
      and run the `deluan/navidrome` image. The overview docs emphasize standalone
      browser playback plus Subsonic-compatible clients, transcoding, multi-user
      libraries, playlists, scrobbling, and low resource usage.
related-packages:
  - id: cask:jellyfin
    reason: >
      Choose Jellyfin when one server must organize and stream video, television,
      photos, and music; choose Navidrome for a lighter music-focused service with broad
      Subsonic/OpenSubsonic client compatibility.
    rel: alternative
    sources:
      - https://navidrome.org/docs/overview/
      - https://jellyfin.org/docs/general/about/
  - id: brew:mpd
    reason: >
      Choose MPD for a daemon-centered local or network playback system controlled by
      replaceable lightweight clients; choose Navidrome for browser streaming,
      multi-user libraries, and Subsonic-compatible remote apps.
    rel: alternative
    sources:
      - https://navidrome.org/docs/overview/
      - https://www.musicpd.org/
      - https://mpd.readthedocs.io/en/stable/user.html
