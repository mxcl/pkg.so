history:
  adoption-history:
    - >
      OwOCR grew from a Japanese-focused clipboard OCR utility into a multi-platform
      front end for numerous local and cloud recognition engines. Packaged applications
      for macOS and Windows coexist with a Python package and Linux support, while later
      releases expanded inputs beyond the clipboard to screen regions, folders, sockets,
      WebSockets, and OBS.
  package-nerd-significance:
    - >
      OwOCR is attractive to package enthusiasts because it provides one configurable
      interface over otherwise fragmented OCR backends. It combines native
      operating-system engines, open-source models, and cloud services while supporting
      automation through files, sockets, WebSockets, hotkeys, and command-line
      operation.
  project-history:
    - >
      OwOCR was originally derived from Manga OCR and focused on Japanese text. It
      subsequently became a broader multi-service OCR orchestrator, adding
      cross-platform desktop integration, coordinate-aware output, two-pass recognition,
      multiple capture sources, and numerous interchangeable engines.
  related-projects:
    - >
      Related engines and projects include Manga OCR, comic-text-detector, Mokuro, Apple
      Vision and Live Text, OneOCR, meikiocr, NDLOCR-Lite, EasyOCR, RapidOCR, Google
      Lens, Google Vision, Bing, Azure Document Intelligence, and OCRSpace.
  sources:
    - https://github.com/AuroraWright/owocr
    - https://github.com/AuroraWright/owocr/releases
    - source_facts.repo
  summary:
    - >
      OwOCR is an open-source, multi-platform OCR tool that continuously consumes images
      and sends recognized text to configurable destinations, with a particular emphasis
      on Japanese.
  timeline:
    - 'Initial development: Derived from Manga OCR as a Japanese-oriented recognition workflow.'
    - >
      Later development: Added multiple local and cloud engines, desktop integrations,
      sockets, WebSockets, and screen capture.
    - '2026: The 1.26 series added OBS input and NDLOCR-Lite integration.'
  usage:
    - >
      By default, OwOCR monitors the clipboard for images and returns recognized text to
      the clipboard. Users can instead capture screens or windows, watch folders,
      connect through sockets or WebSockets, feed images from OBS, write text or JSON
      files, and switch engines from the tray icon, terminal, or global hotkeys.
