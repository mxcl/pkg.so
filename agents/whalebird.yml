history:
  adoption-history:
    - >
      Whalebird expanded beyond its original Mastodon focus to support multiple
      Fediverse server families, including Pleroma, Friendica, Firefish, GoToSocial,
      Pixelfed, Akkoma, Hometown, and Iceshrimp.
    - >
      The project distributes desktop builds for macOS, Windows, and Linux. Its official
      README documents installation through Homebrew Cask, Snap, the Arch User
      Repository, and Winget in addition to direct downloads.
  package-nerd-significance:
    - >
      Whalebird is a representative package-manager-era Fediverse client: an open-source
      Electron application delivered through native-looking packages across several
      operating systems. It gives Homebrew, Snap, AUR, and Winget users a familiar
      installation route for a decentralized social-network client.
  project-history:
    - >
      Akira Fukushima's Whalebird project emerged in 2018 as a free, open-source desktop
      client for the Fediverse. It uses a single-column, Slack-like interface and
      supports multiple accounts, streaming timelines, and desktop notifications.
    - >
      The client broadened its compatibility as the Fediverse diversified, moving from
      its early Mastodon and Pleroma identity to a longer list of ActivityPub-compatible
      server implementations.
  related-projects:
    - >
      Related services and implementations include Mastodon, Pleroma, Friendica,
      Firefish, GoToSocial, Pixelfed, Akkoma, Hometown, and Iceshrimp.
    - >
      Related distribution systems include Homebrew Cask, Snap, the Arch User
      Repository, Winget, and the Windows Store.
  sources:
    - https://github.com/h3poteto/whalebird-desktop#readme
    - https://whalebird.social/downloads
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      Whalebird is a free, open-source desktop client for Mastodon and other Fediverse
      services. It provides a single-column interface, multi-account management,
      streaming updates, and desktop notifications.
  timeline:
    - "2018: The project identifies this as the beginning of Whalebird's copyright history."
    - '2023: The documented 5.x release line supplied native macOS desktop builds.'
    - '2026: Official distribution spans macOS, Windows, and several Linux package formats.'
  usage:
    - >
      Users register one or more accounts hosted by supported Fediverse servers, then
      read streaming timelines, post updates, and receive desktop notifications through
      a unified desktop interface.
    - >
      macOS users can install the application with Homebrew Cask; the official project
      also supplies direct and package-manager installation routes for Linux and
      Windows.
