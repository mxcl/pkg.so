history:
  adoption-history:
    - >
      The project offers a free direct edition through GitHub and a paid App Store
      edition that supports the independent developer. The supplied package record
      distributes the direct edition as the Homebrew cask `hagimimonitordirect`.
    - >
      The direct edition exists because App Store sandboxing prevents several hardware
      and process-inspection capabilities, including SMC temperature and fan readings,
      some per-process statistics, media-key handling, and DDC/CI display control.
  package-nerd-significance:
    - >
      HagimiMonitor combines conventional menu-bar telemetry with lower-level Apple
      Silicon and peripheral features that are difficult to ship inside the Mac App
      Store sandbox.
    - >
      Its split direct/App Store packaging makes it a useful example of how macOS
      distribution channels affect hardware-monitoring feature sets.
  project-history:
    - >
      HagimiMonitor was developed as a native Swift and SwiftUI menu-bar monitor
      optimized for Apple Silicon. It grew from compact live telemetry into eight
      monitoring modules, report generation, health scoring, event detection, and
      convenience controls.
    - >
      During its 2026 release series, the project added Bluetooth monitoring,
      per-process views, quick controls, and SQLite-backed historical reports while
      maintaining separate direct and sandboxed editions.
  related-projects:
    - >
      The App Store edition shares the core monitoring interface but omits capabilities
      prohibited by sandbox restrictions.
    - The Homebrew `hagimimonitordirect` cask packages the direct, notarized application.
  sources:
    - https://github.com/Acerola-1/hagimi-monitor/blob/main/README.en.md
    - https://github.com/Acerola-1/hagimi-monitor/releases
    - source_facts.applications
    - source_facts.package-manager
  summary:
    - >
      HagimiMonitor Direct is the full-featured, independently distributed edition of a
      native Apple Silicon menu-bar monitor for CPU, GPU, memory, storage, networking,
      battery, Bluetooth, and displays.
  timeline:
    - >
      2026: The public release series expanded through v1.x with Bluetooth monitoring,
      quick controls, and SQLite-backed statistical reports.
  usage:
    - >
      Keep the application running in the menu bar for a compact load indicator, then
      open its panel for detailed hardware and system metrics.
    - >
      Choose the direct edition when temperature, fan, DDC/CI display controls, or
      unrestricted process statistics are required; these features are unavailable from
      the sandboxed App Store edition.
