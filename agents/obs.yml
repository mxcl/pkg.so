id: cask:obs
display-name: OBS Studio
repo: https://github.com/obsproject/obs-studio
docs:
  - https://docs.obsproject.com/
  - https://github.com/obsproject/obs-studio/wiki
  - https://obsproject.com/kb
config-file-location:
  linux:
    - ~/.config/obs-studio
  macos:
    - ~/Library/Application Support/obs-studio
  windows:
    - '%APPDATA%\obs-studio'
credentials-file-location: null
history:
  adoption-history:
    - >
      OBS expanded from an initially manageable community into a widely used streaming
      and recording application. In an official 2018 progress report, its creator
      reported nine million downloads of the preceding release within three months and
      described OBS and its derivatives as among the most widely used tools for live
      streaming and recording.
    - >
      Cross-platform support, broad capture and encoding capabilities, integrations with
      major streaming services, and an extensive plugin ecosystem helped establish OBS
      Studio as standard infrastructure for creators, educators, event producers, and
      screen-recording workflows.
  package-nerd-significance:
    - >
      OBS Studio is a prominent cross-platform open-source desktop application with a
      large native-code repository, extensive plugin interfaces, scripting support, and
      platform-specific capture backends.
    - >
      Profiles, scene collections, plugins, and service settings make its configuration
      directory valuable for backup and migration, while Homebrew Cask provides macOS
      users with a package-managed installation path.
  project-history:
    - >
      OBS began as Open Broadcaster Software, created and maintained by Hugh Bailey,
      known in the project as Lain. The first public release appeared in August 2012.
      The project evolved into OBS Studio, a cross-platform application for capturing,
      compositing, encoding, recording, and live streaming video under the GPL.
  related-projects:
    - OBS plugins and scripts extend capture, effects, automation, and service integration.
    - >
      The obs-websocket functionality supports remote control and automation and is
      included in modern OBS Studio releases.
    - >
      Applications derived from OBS technology are related products but are not the
      upstream OBS Studio project.
  sources:
    - https://github.com/obsproject/obs-studio
    - https://obsproject.com/
    - https://obsproject.com/blog/obs-progress-report-august-2018
    - https://obsproject.com/kb/
  summary:
    - >
      OBS Studio is a free, open-source, cross-platform application for live streaming,
      video recording, capture, compositing, and encoding.
  timeline:
    - '2012-08: The first public OBS release appeared.'
    - >
      2018-08: The project marked its sixth anniversary and reported nine million
      downloads of the preceding release in three months.
  usage:
    - >
      Users combine video, audio, display, window, browser, and device sources into
      scenes, switch or transition between scenes, mix audio, and record locally or
      stream to a configured service. Profiles separate output and service settings,
      while scene collections separate production layouts.
