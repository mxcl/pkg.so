history:
  adoption-history:
    - >
      MarsEdit is distributed to Homebrew users through the `marsedit` cask. Its
      compatibility with WordPress, Micro.blog, Tumblr, TypePad, Movable Type,
      MetaWeblog, and AtomPub gives it a role as a general-purpose Mac blogging client
      rather than a frontend for one service.
  package-nerd-significance:
    - >
      MarsEdit represents the long-running native desktop-client approach to web
      publishing: offline composition, local post archives, Markdown or rich-text
      editing, and publishing through standard blog APIs. The cask provides a
      package-manager-friendly installation path for an otherwise conventionally
      distributed commercial Mac application.
  project-history:
    - >
      Red Sweater develops MarsEdit as a native macOS blog editor. MarsEdit 5 added
      streamlined microposting, Markdown syntax highlighting, and a rebuilt rich-text
      editor while retaining established facilities such as local archives, templates,
      media uploading, and offline writing.
  related-projects:
    - >
      Works with WordPress, Micro.blog, Tumblr, TypePad, Movable Type, and services
      implementing MetaWeblog or AtomPub APIs.
  sources:
    - https://help.redsweater.com/marsedit/getting-started/
    - https://redsweater.com/marsedit/
    - source_facts.package-manager
  summary:
    - >
      MarsEdit is a native macOS application for writing, previewing, archiving, and
      publishing blog posts. It supports both rich text and plain text, including
      Markdown-oriented workflows.
  timeline:
    - >
      MarsEdit 5: Added microposting, Markdown syntax highlighting, and a new rich-text
      editor.
  usage:
    - >
      Users add a blog by supplying its homepage URL; MarsEdit normally detects the API
      settings and downloads recent posts. It can compose offline, preview posts using
      the blog's appearance, upload media, and publish when connectivity is available.
    - >
      Blog passwords requested by MarsEdit are stored in the macOS system keychain. Some
      services require application-specific or web-services passwords instead of the
      normal interactive-login password.
