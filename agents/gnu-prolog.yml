id: brew:gnu-prolog
display-name: GNU Prolog
repo: https://github.com/didoudiaz/gprolog
docs:
  - https://www.gprolog.org/manual/gprolog.html
  - https://www.gprolog.org/manual/html_node
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GNU Prolog occupies a practical niche among Prolog implementations: it emphasizes
      ISO Prolog compatibility, native executables, command-line compilation, C
      interoperability, and an integrated finite-domain solver. Those traits made it
      useful for logic-programming teaching, constraint examples, embeddable tools, and
      users who prefer a compiler-style workflow over a large image-based environment.
  package-nerd-significance:
    - >
      GNU Prolog matters in package ecosystems because it is both a language runtime and
      a compiler toolchain: packages install several helper binaries, architecture
      support matters, and releases document low-level ports across Unix, macOS,
      Windows, ARM, and RISC-V targets.
  project-history:
    - >
      The official GNU Prolog site says development began in January 1996 under the name
      Calypso. The design drew from two earlier Diaz systems: wamcc, a Prolog-to-C
      compiler based on the Warren Abstract Machine, and clp(FD), a finite-domain
      constraint system built around a low-level primitive for defining higher-level
      constraints.
  related-projects:
    - >
      GNU Prolog is related to wamcc, clp(FD), the Warren Abstract Machine tradition,
      ISO Prolog systems, SWI-Prolog, and constraint-logic programming tools.
  sources:
    - http://www.gprolog.org/
    - https://arxiv.org/abs/1012.2496
    - https://github.com/didoudiaz/gprolog
    - https://www.gprolog.org/manual/gprolog.html
  summary:
    - >
      GNU Prolog is Daniel Diaz's free Prolog compiler with finite-domain constraint
      solving. Its defining trait is native-code compilation to small standalone
      executables, alongside an interactive top-level and debugger.
  timeline:
    - '1996: Development started in January under the name Calypso.'
    - '1999: Manual copyright years begin for GNU Prolog documentation.'
    - >
      2010: Diaz, Abreu, and Codognet published an implementation paper describing GNU
      Prolog's native compiler and FD solver.
    - '2021: Version 1.5.0 notes record the move of the source repository to GitHub.'
  usage:
    - >
      Practitioners run gprolog for the interactive top-level and gplc to compile Prolog
      files, C files, WAM files, and related inputs into native programs. Constraint
      programmers use its FD predicates for arithmetic, Boolean, symbolic, and reified
      constraints, often paired with enumeration heuristics.
related-packages:
  - id: brew:swi-prolog
    reason: >
      SWI-Prolog is a broader alternative with modules, a package ecosystem, extensive
      language bindings, web tooling, and a large library environment; choose GNU Prolog
      when native standalone compilation and integrated finite-domain constraints are
      the priority.
    rel: alternative
    sources:
      - https://www.gprolog.org/
      - https://www.gprolog.org/manual/gprolog.html
      - https://www.swi-prolog.org/
      - https://www.swi-prolog.org/pldoc/doc_for?object=manual
