history:
  adoption-history:
    - >
      Zeplin grew from an Istanbul-based project into a product used by design and
      engineering teams for structured design handoff. Its official history records
      participation in Y Combinator and the later establishment of a San Francisco
      office.
    - >
      The platform expanded beyond screen inspection into shared styleguides, design
      tokens, workflow integrations, APIs, and webhooks. Its desktop application remains
      particularly relevant to designers publishing work through supported design-tool
      plugins.
  package-nerd-significance:
    - >
      Zeplin represents the specialized design-to-development handoff category: it
      converts finalized designs into inspectable specifications, assets,
      platform-specific code snippets, and centrally managed design-system information.
    - >
      For package users, the cask provides the native publishing client and installs
      integrations for supported design tools, while developers can often consume
      published projects through the web application.
  project-history:
    - >
      Zeplin began in Istanbul in June 2014 and joined Y Combinator in May 2015. Version
      1.0 launched in July 2015.
    - >
      The product evolved into a collaborative workspace for documenting designs,
      tracking screen and component changes, maintaining styleguides, and connecting
      design artifacts with engineering tools.
  related-projects:
    - >
      Zeplin officially integrates with design tools including Figma, Sketch, Adobe XD,
      and Photoshop, and with engineering workflow tools such as Storybook, GitHub,
      Jira, Slack, and VS Code.
  sources:
    - https://support.zeplin.io/en/articles/244698-downloading-mac-and-windows-apps
    - https://support.zeplin.io/en/articles/6398304-advantages-of-using-styleguides
    - https://support.zeplin.io/en/articles/6579140-what-is-zeplin
    - https://zeplin.io/about/
  summary:
    - >
      Zeplin is a design-delivery and collaboration platform that gives product teams a
      structured place to publish finalized designs, inspect specifications and assets,
      document design systems, and coordinate design-to-development handoff.
  timeline:
    - "2014: Zeplin's journey began in Istanbul."
    - '2015: Zeplin joined Y Combinator.'
    - '2015: Zeplin 1.0 launched.'
    - '2016: Zeplin established a San Francisco office.'
    - >
      2025: Projects became platform-neutral, allowing users to switch among Web, iOS,
      Android, and macOS specifications within one project.
  usage:
    - >
      Designers publish designs through Zeplin's desktop application and supported
      design-tool plugins. Developers inspect screens, components, assets, tokens,
      measurements, and generated snippets through the desktop or web application. Teams
      use projects, approvals, comments, and styleguides to communicate implementation
      intent.
