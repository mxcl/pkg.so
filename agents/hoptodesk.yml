    - https://www.hoptodesk.com/docs is the official Dashboard documentation.
    - https://www.hoptodesk.com/on-premises is the official self-hosting guide.
  history-sources:
    - https://gitlab.com/hoptodesk/hoptodesk
    - https://help.hoptodesk.com/
    - https://www.hoptodesk.com/on-premises
    - source_facts.description
    - source_facts.package-manager
  repo-sources:
    - >
      The official HopToDesk website and official packaging metadata point to the
      hoptodesk organization; https://gitlab.com/hoptodesk/hoptodesk is the primary
      cross-platform project.
    - source_facts.repo is empty, so repository discovery was required.
  tags-sources:
