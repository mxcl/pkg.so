id: cask:hoptodesk
display-name: HopToDesk
repo: https://gitlab.com/hoptodesk/hoptodesk
docs:
  - https://www.hoptodesk.com/docs
  - https://help.hoptodesk.com/
  - https://www.hoptodesk.com/on-premises
config-file-location:
  linux:
    - ~/.config/hoptodesk/api.json
    - /root/.config/hoptodesk/api.json (background service)
  macos:
    - ~/Library/Preferences/com.hoptodesk.HopToDesk/api.json
  windows:
    - '%APPDATA%\HopToDesk\config\api.json'
    - C:\ProgramData\HopToDesk\config\api.json (all users and service)
credentials-file-location: null
history:
  adoption-history:
    - >
      HopToDesk is distributed for major desktop and mobile platforms. Its official help
      center also documents unattended access, centralized Dashboard enrollment, managed
      deployment, and self-hosted networking, broadening it from ad-hoc support software
      into a fleet-management option.
  package-nerd-significance:
    - >
      It is notable to package users as a cross-platform remote-support client with both
      public relay infrastructure and documented self-hosting options. The macOS
      Homebrew cask provides a reproducible installation path for an otherwise
      GUI-oriented support application.
  project-history:
    - >
      The official GitLab project was created in September 2022. The project developed
      as a cross-platform remote desktop and support application with end-to-end
      encryption, later documenting Dashboard management, custom networks, on-premises
      deployment, and automation interfaces.
  related-projects:
    - The official HopToDesk Dashboard provides device and team management.
    - >
      The official on-premises offering supplies self-hosted signaling and relay
      infrastructure.
  sources:
    - https://gitlab.com/hoptodesk/hoptodesk
    - https://help.hoptodesk.com/
    - https://www.hoptodesk.com/on-premises
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      HopToDesk is a cross-platform remote desktop and remote-support application. It
      supports interactive and unattended access, file transfer, terminal sessions, port
      forwarding, custom relay infrastructure, and managed device enrollment.
  timeline:
    - '2022: The official HopToDesk GitLab project was created.'
    - >
      Later releases: Dashboard enrollment, self-hosting, and automation became
      documented parts of the product.
  usage:
    - >
      Users run HopToDesk on both endpoints, connect with a device ID and temporary or
      permanent password, and optionally enable two-factor authentication.
      Administrators can enroll devices in the Dashboard or point clients at custom
      infrastructure using the documented api.json override.
tags:
  - cross-platform
  - end-to-end-encryption
  - file-transfer
  - remote-desktop
  - remote-support
  - screen-sharing
  - self-hosting
  - unattended-access
provenance:
  category-sources:
