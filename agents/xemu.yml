config-file-location:
  linux:
    - <directory-containing-xemu>/xemu.toml
  macos:
    - <xemu.app>/Contents/Resources/xemu.toml
  windows:
    - <directory-containing-xemu.exe>\xemu.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project publishes builds for Windows, macOS, and Linux and maintains a
      community-reported compatibility catalog for original Xbox titles. Its official
      documentation invites users to submit updated compatibility reports as emulation
      behavior evolves.
  package-nerd-significance:
    - >
      xemu is notable to emulator and package-manager users because it packages a
      QEMU-derived original Xbox machine implementation as a cross-platform desktop
      application. Its need for user-supplied system files, disk images, EEPROM data,
      and optional TOML configuration also makes it a more infrastructure-like package
      than a typical game launcher.
  project-history:
    - >
      xemu continues the XQEMU project, which espes started in 2012 with major
      contributions from Jannik Vogel, Matt Borgerson, and others. Matt Borgerson
      started the xemu continuation in 2020.
    - >
      The emulator is built on QEMU and is distributed as free software under GPLv2.
      Development takes place publicly on GitHub.
  related-projects:
    - XQEMU, the predecessor project
    - QEMU, the generic machine emulator on which xemu is built
  sources:
    - 'Official About and History page: https://xemu.app/docs/about/'
    - 'Official FAQ: https://xemu.app/docs/faq/'
    - 'Official snapshots documentation: https://xemu.app/docs/snapshots/'
    - source_facts.package-manager
  summary:
    - >
      xemu is a free, open-source emulator for the original Microsoft Xbox. It emulates
      the console hardware so that official titles and homebrew software can run on
      contemporary Windows, macOS, and Linux systems.
  timeline:
    - '2012: The predecessor XQEMU project was started by espes.'
    - '2020: Matt Borgerson started xemu as a continuation of XQEMU.'
  usage:
    - >
      Users configure the required Xbox system files and storage images, then load
      legally obtained game-disc images or homebrew software. The emulator supports
      controllers, snapshots, an EEPROM image, compatibility reporting, and advanced
      command-line or xemu.toml configuration.
    - >
      Snapshots preserve the emulated machine state inside the selected hard-disk image.
      The official documentation cautions that restoring an old snapshot can also roll
      back the apparent state of in-game saves.
