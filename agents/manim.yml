id: brew:manim
display-name: Manim
repo: https://github.com/ManimCommunity/manim
docs:
  - https://docs.manim.community/en/stable
config-file-location:
  linux:
    - <scene-directory>/manim.cfg
    - ~/.config/manim/manim.cfg
  macos:
    - <scene-directory>/manim.cfg
    - ~/.config/manim/manim.cfg
  windows:
    - <scene-directory>/manim.cfg
    - UserDirectory/AppData/Roaming/Manim/manim.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      Manim's adoption is closely tied to educational math video production, Python
      notebooks, and reproducible animation scripts. The official README links to PyPI,
      Docker Hub, Binder examples, a Discord server, a Reddit community, and Read the
      Docs documentation, which shows a broad community packaging surface beyond a
      single source checkout.
    - >
      By 2026 the community repository had tens of thousands of GitHub stars and
      thousands of forks, while the original 3Blue1Brown repository remained even
      larger. That split is important for package users: formulae and Python packages
      generally target the community edition, while the 3Blue1Brown repository is still
      a separate upstream lineage.
  package-nerd-significance:
    - >
      Manim is package-nerd interesting because it combines a Python API, a CLI
      renderer, native graphics and video dependencies, optional Docker packaging,
      notebook integration, and a historically visible fork distinction between
      3Blue1Brown's original code and the community edition.
  project-history:
    - >
      The original `3b1b/manim` repository was created in March 2015 and is described as
      an animation engine for explanatory math videos. The Manim Community README says
      the community edition was forked from Grant Sanderson's original 3Blue1Brown tool
      and is recommended by the community project for continued development, improved
      features, stronger documentation, and more active community maintenance.
    - >
      The ManimCommunity/manim repository was created in May 2020 under the
      ManimCommunity organization. Its README describes Manim as an engine for precise
      programmatic animations and points users to the original 3Blue1Brown repository
      when they want to study how Grant Sanderson makes his videos.
  related-projects:
    - 3b1b/manim is the original Grant Sanderson repository.
    - >
      ManimCommunity/jupyter_examples provides Binder-backed notebook examples linked
      from the official README.
    - The community project publishes a Docker image as `manimcommunity/manim`.
  sources:
    - https://docs.manim.community/en/stable
    - https://docs.manim.community/en/stable/guides/configuration.html
    - https://github.com/3b1b/manim
    - https://github.com/ManimCommunity/manim
    - https://github.com/ManimCommunity/manim#readme
    - https://github.com/ManimCommunity/manim/releases/tag/v0.20.1
  summary:
    - >
      Manim is a Python animation engine for creating explanatory math videos
      programmatically. The Homebrew formula packages the Manim Community Edition, the
      community-maintained version of the tool associated with Grant Sanderson's
      3Blue1Brown math videos.
  timeline:
    - '2015: Original 3Blue1Brown Manim repository created.'
    - '2020: Manim Community repository created.'
    - '2025: v0.19.0 community release published.'
    - '2026: v0.20.1 community release published.'
  usage:
    - >
      Typical usage defines a Python `Scene` class, then runs a command such as `manim
      -p -ql example.py SquareToCircle` to render and preview an animation. The
      documentation also covers CLI flags, `manim.cfg` files, the global `config`
      object, Docker usage, and a `%%manim` IPython magic for Jupyter workflows.
