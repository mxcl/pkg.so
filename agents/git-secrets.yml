id: brew:git-secrets
display-name: git-secrets
repo: null
docs:
  - https://github.com/awslabs/git-secrets#readme
  - https://github.com/awslabs/git-secrets/blob/master/git-secrets.1
config-file-location:
  unix:
    - .git/config
    - ~/.gitconfig
    - ~/.config/git/config
    - /etc/gitconfig
credentials-file-location:
  unix:
    - ~/.aws/credentials
history:
  adoption-history:
    - >
      git-secrets became a recognizable package because it came from AWS Labs and
      addressed a common Git failure mode with no server dependency. Homebrew and Linux
      distribution packaging made it easy to add to developer workstations and
      repository templates.
  package-nerd-significance:
    - >
      The package is important in Git tooling culture because it turns secret scanning
      into local hooks and plain Git config. It is small, scriptable, and easy to wire
      into templates, which made it useful before and alongside hosted secret-scanning
      services.
  project-history:
    - >
      AWS Labs released git-secrets in 2015 as a hook-driven local scanner. The README
      documents pre-commit, commit-msg, and prepare-commit-msg hooks, as well as
      repository and global Git configuration for prohibited and allowed patterns.
    - >
      The changelog shows rapid maturation after the initial release: 1.1.0 added
      full-history scanning, `.gitallowed`, cached/no-index/untracked scan modes, and
      staged-file scanning in hooks; 1.3.0 refined provider output handling, Windows
      path behavior, and IAM key detection.
  related-projects:
    - >
      Related tools and concepts include Git hooks, AWS credential files,
      organization-specific secret providers, repository templates, and other secret
      scanners used in pre-commit workflows.
  sources:
    - https://formulae.brew.sh/formula/git-secrets
    - https://github.com/awslabs/git-secrets
    - https://raw.githubusercontent.com/awslabs/git-secrets/master/CHANGELOG.md
    - https://raw.githubusercontent.com/awslabs/git-secrets/master/README.rst
  summary:
    - >
      git-secrets is an AWS Labs command-line tool that installs Git hooks and scans
      commits for prohibited secret patterns. Its best-known workflow is preventing AWS
      credentials and other sensitive strings from entering Git history.
  timeline:
    - '2015: Repository created under AWS Labs.'
    - '2015: 1.0.0 initial release.'
    - '2016: 1.1.0 added full-history scans, `.gitallowed`, and more scan modes.'
    - '2016: 1.2.x fixed path and provider-command handling.'
    - '2019: 1.3.0 improved IAM key scanning and Windows path handling.'
  usage:
    - >
      Practitioners run `git secrets --install` inside a repository, often followed by
      `git secrets --register-aws`, so commits are blocked when configured patterns are
      detected. They also run `git secrets --scan-history` before publishing a
      repository or add custom providers for organization-specific patterns.
related-packages:
  - id: brew:gitleaks
    reason: >
      Choose Gitleaks for a maintained rule-based scanner that supports Git
      repositories, directories, standard pre-commit usage, and an official GitHub
      Action.
    rel: alternative
    sources:
      - https://github.com/gitleaks/gitleaks#readme
      - https://github.com/awslabs/git-secrets#readme
  - id: brew:trufflehog
    reason: >
      Choose TruffleHog when verified-secret detection or scanning sources beyond a
      local Git repository is more important than git-secrets' compact hook-and-regex
      workflow.
    rel: alternative
    sources:
      - https://github.com/trufflesecurity/trufflehog#readme
      - https://github.com/awslabs/git-secrets#readme
  - id: brew:git-secret
    reason: >
      Use git-secret when sensitive files must intentionally remain in the repository in
      encrypted form, and use git-secrets to catch plaintext credentials that escape
      that workflow.
    rel: adjacent_workflow
    sources:
      - https://git-secret.io/
      - https://github.com/awslabs/git-secrets#readme
