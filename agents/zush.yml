history:
  adoption-history:
    - >
      The official product site reported more than 1,500 users in 2026 and distribution
      through a signed macOS download, the Mac App Store, Homebrew, and the Microsoft
      Store. Zush supports local cloud-sync folders without directly connecting to
      users' cloud accounts.
  package-nerd-significance:
    - >
      Zush represents a desktop-oriented extension of batch-renaming culture: instead of
      applying one regular-expression or sequence rule to every file, it derives names
      independently from file contents. Its BYOK and Ollama modes also make AI-provider
      selection part of an otherwise conventional file-management workflow.
  project-history:
    - >
      Zush began as an AI image-renaming application and expanded into a general file
      renamer. Its official changelog records document support and the broader
      file-renaming focus in version 1.8.0, Offline AI and provider-specific BYOK
      support in version 1.9.0, video and additional format support in version 2.0.0,
      and a substantially expanded template and Naming Block system in version 3.0.0.
    - >
      By August 2026, the application supported macOS and Windows, more than 100 file
      formats, managed cloud inference, user-supplied provider keys, and local
      processing through Ollama.
  related-projects:
    - Ollama supplies the compatible local-model runtime used by Zush's Offline AI mode.
    - >
      Finder, File Explorer, Spotlight, and Windows Search remain the underlying
      file-management and search tools; Zush changes filenames and metadata rather than
      replacing them.
  sources:
    - https://zushapp.com/
    - https://zushapp.com/changelog
    - https://zushapp.com/docs
    - https://zushapp.com/docs/byok
    - https://zushapp.com/docs/privacy-security
  summary:
    - >
      Zush is a proprietary AI-assisted file renamer and organizer for macOS and
      Windows. It analyzes supported files, proposes content-aware names, supports
      reviewed batch operations and monitored folders, and retains rename history for
      undo.
  timeline:
    - '2026-03: Version 1.8.0 expanded Zush from image renaming to general file renaming.'
    - '2026-04: Version 1.9.0 added Offline AI through Ollama and provider-scoped BYOK setup.'
    - '2026-05: Version 2.0.0 added video analysis and many additional formats.'
    - >
      2026-05: Version 3.0.0 introduced 145 Naming Blocks, reusable templates, and wider
      media support.
    - '2026-08: Version 3.9.0 made BYOK and Offline AI available on every plan.'
  usage:
    - >
      Users add individual files or mixed folders, review AI-generated names, edit
      suggestions, and apply the batch with the option to restore original names from
      Activity history. Templates, Naming Blocks, custom prompts, metadata rules, and
      folder monitoring support repeatable workflows.
    - >
      Cloud AI works without a user-managed key. BYOK accepts supported Gemini, Groq,
      OpenAI, or Claude keys, which official documentation says are kept in secure
      platform storage rather than a documented credentials file. Offline AI uses
      compatible Ollama models.
