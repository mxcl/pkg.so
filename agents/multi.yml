history:
  adoption-history:
    - >
      Multi's official installation instructions recommend Homebrew Cask and also
      provide release disk images. This makes a source-available Mac utility accessible
      through a conventional package-manager workflow.
    - >
      The project evolved beyond its graphical configuration interface by documenting a
      `create-mac-app` command-line script and environment variables, enabling scripted
      creation and replacement of generated applications.
  package-nerd-significance:
    - >
      Multi is a compact example of the site-specific-browser pattern: instead of
      installing a large dedicated client for every web service, users generate
      lightweight macOS WebKit applications from declarative JSON.
    - >
      Its single-file configuration, command-line creator, and support for injected
      JavaScript and CSS make generated apps reproducible and unusually hackable for a
      desktop GUI utility.
  project-history:
    - >
      Multi was created to build custom, lightweight macOS applications from one or more
      websites. Its public repository is implemented around native macOS and WebKit
      components and documents successive work on performance, licensing, and a version
      3 rewrite.
    - >
      The project centers each generated application on a JSON configuration embedded in
      that application's bundle, with optional CSS, JavaScript, cookies, HTTP
      authentication, user-agent overrides, and window behavior.
  related-projects:
    - WebKit
    - site-specific browsers
    - Homebrew Cask
  sources:
    - https://github.com/kofigumbs/multi
    - source_facts.package-manager
  summary:
    - >
      Multi creates lightweight, customized macOS applications from groups of websites
      using JSON configuration and optional JavaScript or CSS.
  timeline:
    - >
      Initial design: Multi provided a graphical workflow for turning websites into
      macOS applications
    - 'Later development: A command-line creator enabled scripted app creation and updates'
    - "Version 3 era: The project's author documented a rewrite and removal of paid licensing"
  usage:
    - >
      Users define tabs and URLs in JSON, choose tabbed or separate windows, and
      optionally inject local or remote JavaScript and CSS. Generated apps can be
      created or updated through the bundled CLI using environment variables.
