history:
  adoption-history:
    - >
      The original MenuMeters developed a following as a compact macOS menu-bar system
      monitor. When the original implementation stopped working on OS X El Capitan, Yuji
      Tachikawa maintained a compatibility fork, and community pull requests were
      incorporated into it.
    - >
      The fork later moved from a System Preferences pane to a standalone application as
      macOS tightened security around preference panes. Its continued availability
      through GitHub releases and Homebrew casks preserved the utility for
      package-managed Mac setups.
  package-nerd-significance:
    - >
      MenuMeters is a classic open-source Mac utility whose packaging reflects changes
      in macOS extension and security models. Its migration from an `NSMenuExtra`
      preference pane to a faceless `NSStatusItem` application is a compact history of
      how third-party menu-bar software adapted to platform restrictions.
    - >
      It also sits in a recognizable lineage of lightweight menu-bar monitors, with the
      maintainer explicitly pointing users toward newer projects such as Stats, iGlance,
      and eul.
  project-history:
    - >
      MenuMeters was originally developed by Raging Menace as a set of CPU, memory,
      disk, and network meters for the macOS menu bar. The original design ceased
      working on El Capitan because `SystemUIServer` no longer loaded third-party menu
      extras not signed by Apple.
    - >
      Yuji Tachikawa created a minimally modified fork using `NSStatusItem` objects in a
      faceless application. Beginning with the Catalina-era redesign, the fork became an
      independent application rather than a System Preferences pane.
  related-projects:
    - >
      The Raging Menace MenuMeters release is the original upstream from which this fork
      derives.
    - >
      Stats, iGlance, and eul are newer menu-bar system monitors recommended by the
      fork's maintainer.
    - Additional MenuMeters forks are maintained by emcrisostomo and axet.
  sources:
    - https://github.com/yujitach/MenuMeters#readme
    - https://github.com/yujitach/MenuMeters/releases
    - https://member.ipmu.jp/yuji.tachikawa/MenuMetersElCapitan
  summary:
    - >
      MenuMeters is an open-source macOS menu-bar utility that displays CPU, memory,
      disk, and network activity. The current project is Yuji Tachikawa's compatibility
      fork of the original Raging Menace utility.
  timeline:
    - >
      2015: OS X El Capitan's restrictions broke the original third-party menu-extra
      implementation and prompted a compatible fork.
    - >
      2019: The Catalina-era project transitioned from a preference pane to an
      independent application.
    - '2020: The project added preliminary Apple-silicon support.'
  usage:
    - >
      Users select the CPU, memory, disk, and network meters they want in the menu bar,
      inspect detailed statistics from their pull-down menus, and configure their
      presentation in the standalone application.
    - >
      Developers can clone the official repository, open `MenuMeters.xcodeproj`, and
      build the `MenuMeters` target.
