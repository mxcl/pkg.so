history:
  adoption-history:
    - >
      The official press kit says PDF Pals has received positive user feedback for its
      functionality and developer engagement. The vendor markets it to researchers,
      legal professionals, consultants, financial analysts, and other people who need to
      interrogate long or complex documents.
  package-nerd-significance:
    - >
      PDF Pals exemplifies the early wave of native desktop
      retrieval-augmented-generation tools: document ingestion and embeddings run
      locally, while prompts are sent to a user-selected model provider. Its
      bring-your-own-key design, Apple Keychain storage, local SQLite data, and absence
      of an Electron runtime distinguish it from many hosted PDF-chat services.
  project-history:
    - >
      PDF Pals was created as a native macOS application by Podzim LLC for question
      answering over PDF documents. Its design emphasizes local document processing, no
      file-size limit, OCR for scans and forms, and a perpetual-license option.
    - >
      The application expanded beyond OpenAI to support Azure OpenAI Service,
      OpenRouter, and custom OpenAI-compatible endpoints, while retaining the option to
      rent provider access rather than supply a personal key.
  related-projects:
    - The PDF Pals site identifies BoltAI and KTool as other Podzim LLC products.
    - >
      It interoperates with OpenAI, Azure OpenAI Service, OpenRouter, and custom
      OpenAI-compatible model endpoints.
  sources:
    - 'Official FAQ: https://pdfpals.com/faqs'
    - 'Official Help Center: https://pdfpals.com/help'
    - 'Official homepage: https://pdfpals.com/'
    - 'Official press kit: https://pdfpals.com/press-kit'
  summary:
    - >
      PDF Pals is a commercial native macOS application for asking questions about one
      or more PDF documents. It performs document processing locally, supports OCR, and
      connects to several hosted or compatible language-model providers.
  timeline:
    - >
      Initial product era: PDF Pals launched as a native macOS PDF-chat application with
      local document ingestion and bring-your-own-key access.
    - >
      Later development: Support expanded to Azure OpenAI Service, OpenRouter, and
      custom OpenAI-compatible endpoints.
    - >
      Current product: PDF Pals offers local SQLite-backed data, OCR, multiple-provider
      access, and perpetual licensing.
  usage:
    - >
      Users configure a supported model provider or rented access, open one or more
      PDFs, and ask questions in natural language. Local ingestion and similarity search
      retrieve relevant document passages for the model.
    - >
      The application supports scanned PDFs and complex forms through OCR. Documents and
      training data remain on the Mac, although an internet connection is normally
      required to obtain model-generated responses from a hosted provider.
    - >
      The official FAQ says OpenAI API keys are stored in Apple Keychain; because this
      is a credential store rather than a documented credentials file path, no
      credentials-file location is reported.
