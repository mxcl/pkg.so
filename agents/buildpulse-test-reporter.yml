history:
  adoption-history:
    - >
      Public adoption is limited and mostly product-driven. The README lists native
      environment-variable inference for GitHub Actions, Buildkite, CircleCI, Jenkins,
      Semaphore, Travis CI, Webapp.io, AWS CodeBuild, Bitbucket Pipelines, and Azure
      DevOps Pipelines.
    - >
      For GitHub Actions users, the README points to `buildpulse-action` as a wrapper
      around the binary, which is the likely common path for teams already using
      BuildPulse.
  package-nerd-significance:
    - >
      Its significance is modest but real for package-manager catalogs: it is an example
      of a vendor SaaS integration CLI that gets packaged so CI scripts can pin or
      install a normal executable instead of copying curl snippets.
    - >
      The interesting packaging detail is cross-platform binary distribution for a
      narrow CI function, with Homebrew acting as a convenient macOS developer and CI
      install path.
  project-history:
    - >
      The `buildpulse/test-reporter` repository was created on 2020-07-19. The README
      describes the project as a binary that connects continuous integration to
      BuildPulse and documents platform-specific downloads, local builds with
      GoReleaser, and standalone submission commands.
    - >
      The project is intentionally narrow: it is not a general test runner, but an
      integration binary that packages BuildPulse upload behavior for Linux, macOS, and
      Windows CI environments.
  related-projects:
    - >
      BuildPulse Test Reporter is related to buildpulse.io, BuildPulse flaky-test
      analysis, `buildpulse-action`, GitHub Actions, Buildkite, CircleCI, Jenkins,
      Travis CI, and other CI systems.
  sources:
    - https://api.github.com/repos/buildpulse/test-reporter
    - https://github.com/buildpulse/test-reporter#readme
  summary:
    - >
      BuildPulse Test Reporter is a small CI upload/reporting CLI for BuildPulse's
      flaky-test product. Its public role is to connect test output from CI systems to
      buildpulse.io so BuildPulse can detect, track, and rank flaky tests.
  timeline:
    - '2020: Public `buildpulse/test-reporter` repository is created.'
    - >
      2020s: README documents packaged binaries for Linux, macOS, and Windows and native
      support for common CI providers.
    - >
      2025: Repository metadata shows recent upstream activity, but public project
      history remains sparse.
  usage:
    - >
      Users run `buildpulse-test-reporter submit` with a test report path plus
      BuildPulse account and repository identifiers. In unsupported CI environments,
      they provide commit, branch, build URL, organization, and repository metadata
      through environment variables.
    - >
      The command also accepts coverage files, tags, quotas, repository directory, or
      tree SHA, making it a CI metadata bridge rather than a local developer workflow
      tool.
