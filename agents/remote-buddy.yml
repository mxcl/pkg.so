history:
  adoption-history:
    - >
      The first preview attracted substantial attention in the Mac community, and
      IOSPIRIT quickly broadened hardware support beyond the Apple Remote. Remote Buddy
      subsequently adapted to Wii controllers, third-party infrared receivers, iPhone
      web control, Apple TV, Siri Remote, and newer macOS security requirements.
  package-nerd-significance:
    - >
      Remote Buddy is a long-lived example of macOS hardware integration surviving
      repeated changes to Apple remote-control hardware, Bluetooth, infrared drivers,
      sandboxing, and privacy controls. Its Behaviours and configurable mappings turn
      diverse controllers into a common automation layer for Mac applications.
  project-history:
    - >
      Felix Schwarz conceived Remote Buddy in 2006 after finding the original Apple
      Remote too limited for controlling DVD playback on an Intel iMac. He built the
      first preview in roughly two weeks and released it on June 6, 2006. The project
      rapidly gained support for more receivers and controllers, added Wii Remote
      support in 2006, reached version 1.0 in 2007, and introduced an iPhone-oriented
      AJAX Remote shortly after the iPhone's debut. Later development added native
      companion applications, Apple TV display support, Siri Remote integration,
      backups, and guided privacy configuration.
  related-projects:
    - >
      Remote Buddy Mobile provides iPhone and iPad control, while Remote Buddy Display
      extends the system to Apple TV. The product's Behaviours integrate with media
      players, presentation software, browsers, and other Mac applications.
  sources:
    - https://www.iospirit.com/blog/2016/06/10-years-of-Remote-Buddy
    - https://www.iospirit.com/products/remotebuddy/presskit/
    - https://www.iospirit.com/products/remotebuddy/releasenotes
    - https://www.iospirit.com/products/remotebuddy/whats-new/
  summary:
    - >
      Remote Buddy is an IOSPIRIT macOS automation and remote-control application that
      maps physical remotes and mobile devices to application, media, presentation,
      pointer, keyboard, and system actions.
  timeline:
    - '2006: The first Remote Buddy preview was released on June 6.'
    - '2006: Support expanded to additional remotes, including the Wii Remote.'
    - '2007: Version 1.0 shipped, followed by the iPhone-oriented AJAX Remote.'
    - '2015: Remote Buddy Display extended the system to Apple TV.'
    - '2020s: Remote Buddy 2 added guided setup, privacy controls, and a backup manager.'
  usage:
    - >
      Users connect or select a supported controller, choose application-specific
      Behaviours, and map buttons to actions. Remote Buddy can control media and
      presentations, expose virtual mouse and keyboard functions, and accept control
      from phones or Apple TV-related companion applications.
