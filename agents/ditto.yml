history:
  adoption-history:
    - >
      Ditto is aimed primarily at centrally managed education and business deployments.
      Its official site describes use across more than 180 countries and promotes
      deployment through familiar receiver hardware, account-level administration, MDM,
      and zero-touch workflows.
    - >
      The product expanded from screen sharing into a combined platform for digital
      signage, moderation, and urgent full-screen alerts.
  package-nerd-significance:
    - >
      Ditto's Homebrew cask gives Mac administrators a repeatable installation path for
      a proprietary, cross-platform presentation client commonly deployed across managed
      fleets.
  project-history:
    - >
      Official update records show Ditto operating as a room-and-receiver screen-sharing
      system by 2017. Subsequent releases expanded its administrative portal,
      digital-signage capabilities, receiver platforms, browser-based connections, and
      moderation tools.
    - >
      By 2022, Ditto Connect clients supported screen-mirroring annotation and Ditto
      Director provided iOS/iPadOS moderation. Later releases continued developing the
      macOS, Windows, iOS, Android, tvOS, web, and account-portal components.
  related-projects:
    - Ditto Connect
    - Ditto Director
    - Ditto Account Portal
    - Ditto receiver applications
  sources:
    - https://help.airsquirrels.com/ditto/292-the-installable-ditto-connect-application
    - https://help.airsquirrels.com/ditto/297-previous-ditto-updates
    - https://help.airsquirrels.com/ditto/80-ditto-setup-guide
    - https://www.airsquirrels.com/ditto
  summary:
    - >
      Ditto is Squirrels' software platform for wireless screen mirroring, digital
      signage, and on-screen emergency alerts. The macOS application lets a user connect
      to a Ditto-enabled room and share a screen using a room code.
  timeline:
    - >
      2017: Official update history documents room codes, portal branding, room labels,
      and Apple TV support.
    - '2019: The account portal gained a dashboard and a more flexible room-and-receiver model.'
    - '2022: Ditto added screen-mirroring annotation and introduced Ditto Director moderation.'
    - >
      2023: Official support documentation described the permanently installed Ditto
      Connect client for managed deployment.
  usage:
    - >
      Administrators register receivers and rooms in the Ditto Account Portal, link
      receivers to rooms, and deploy Ditto Connect to users. A presenter enters the
      displayed room code to share a device screen.
    - >
      Organizations can reuse the same receiver deployment for scheduled signage and
      high-priority alerts as well as interactive presentations.
