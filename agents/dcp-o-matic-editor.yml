id: cask:dcp-o-matic-editor
display-name: DCP-o-matic Editor
repo: https://github.com/cth103/dcpomatic
docs:
  - https://dcpomatic.com/manual/html
  - https://dcpomatic.com/manual/html/ch22.html
config-file-location:
  linux:
    - ~/.config/dcpomatic2/config.xml
  macos:
    - /Users/<user>/Library/Preferences/com.dcpomatic/2/config.xml
  windows:
    - C:\Users\<user>\AppData\Local\dcpomatic\config.xml
credentials-file-location:
  linux:
    - ~/.config/dcpomatic2/config.xml
  macos:
    - /Users/<user>/Library/Preferences/com.dcpomatic/2/config.xml
  windows:
    - C:\Users\<user>\AppData\Local\dcpomatic\config.xml
history:
  adoption-history:
    - >
      DCP-o-matic is used across digital-cinema production and exhibition by
      film-makers, festivals, projectionists, subtitlers, and cinema technicians. Editor
      extends the suite beyond package creation to maintenance of existing DCP metadata.
  package-nerd-significance:
    - >
      Editor exposes a narrow, non-transcoding operation as a separately packaged
      application. This is attractive in cinema workflows because metadata corrections
      can avoid expensive and potentially lossy re-encoding of picture, sound, and
      timed-text assets.
  project-history:
    - >
      DCP-o-matic began with its first repository commit in 2012 and developed into a
      suite covering DCP creation, playback, verification, delivery, key management, and
      metadata manipulation. Editor is the suite tool for changing metadata in an
      existing package while retaining its media assets.
  related-projects:
    - DCP-o-matic
    - DCP-o-matic Player
    - DCP-o-matic Verifier
    - DCP-o-matic Combiner
  sources:
    - https://dcpomatic.com/development
    - https://dcpomatic.com/manual/html/ch01s02.html
    - https://dcpomatic.com/manual/html/ch22.html
    - https://www.dcpomatic.com/
  summary:
    - >
      DCP-o-matic Editor edits metadata in existing Digital Cinema Packages without
      changing their video, audio, or text assets.
  timeline:
    - '2012: First commit to the DCP-o-matic repository.'
    - '2015: DCP-o-matic 1.83 was distributed for Windows and several Linux families.'
    - >
      2024: Editor was included among the separately downloadable DCP-o-matic
      applications for macOS and Windows.
  usage:
    - >
      Open an existing DCP, adjust supported Composition Playlist metadata, and write
      the changes without re-encoding the package's essence assets.
