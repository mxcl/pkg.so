history:
  adoption-history:
    - >
      GLEW's project news records inclusion in the OpenGL SDK and NVIDIA OpenGL SDK in
      2007, an important adoption signal for an extension loader. The library's
      stability, permissive license, and simple include-and-initialize workflow helped
      it become a default dependency for tutorials, examples, and desktop OpenGL
      applications.
    - >
      Package managers usually ship both the library and the `glewinfo` and `visualinfo`
      utilities. That turns GLEW from a build dependency into a diagnostics package for
      graphics stacks, useful when comparing driver extension exposure across Linux,
      macOS, Windows, BSD, and Mesa-based systems.
  package-nerd-significance:
    - >
      GLEW matters to package maintainers because it smooths over a historically awkward
      boundary between graphics drivers, OpenGL headers, generated loaders, and
      application build systems. A distro-provided GLEW package lets many older and
      portable OpenGL projects avoid vendoring generated extension code.
  project-history:
    - >
      GLEW's copyright history names Milan Ikits, Marcelo E. Magallon, and Lev Povalahev
      in the early 2000s, and the project site records a long release line beginning
      before the 1.2.5 release in December 2004. The project later moved through
      SourceForge and GitHub, while continuing to distribute generated release
      snapshots.
    - >
      The 1.x series tracked OpenGL 2.x, 3.x, and 4.x extension growth. GLEW 2.0 in 2016
      added forward-compatible-context support plus OSMesa and EGL support, and GLEW 2.1
      in 2017 added support for OpenGL 4.6.
  related-projects:
    - >
      GLEW sits alongside OpenGL, Mesa, GLX, WGL, EGL, GLUT/freeglut, and SDK sample
      code that needs portable access to extension entry points.
  sources:
    - https://github.com/nigels-com/glew
    - https://glew.sourceforge.net/
    - https://glew.sourceforge.net/basic.html
  summary:
    - >
      GLEW, the OpenGL Extension Wrangler Library, is a C and C++ extension-loading
      library that discovers OpenGL, WGL, GLX, and EGL capabilities at runtime. It
      became a standard packaging target because OpenGL applications often need the same
      generated headers, library, and inspection tools across operating systems.
  timeline:
    - '2004: GLEW 1.2.5 released with new extensions and FreeBSD support.'
    - '2007: GLEW included in the OpenGL SDK and NVIDIA OpenGL SDK.'
    - '2016: GLEW 2.0 added forward-compatible contexts, OSMesa, and EGL support.'
    - '2017: GLEW 2.1 added OpenGL 4.6 support.'
  usage:
    - >
      Practitioners include `GL/glew.h`, create a valid OpenGL context, call
      `glewInit()`, and then test extension or version variables before using optional
      API entry points. `glewinfo` verifies extension entry points, while `visualinfo`
      reports visuals or pixel formats.
    - >
      Developers who need new extension data can regenerate sources with the project's
      generation workflow, but the README recommends packaged release snapshots for most
      users.
related-packages:
  - id: brew:glbinding
    reason: >
      glbinding is a generated C++11 OpenGL binding with type-safe enums, real
      functions, per-feature headers, and multi-context support; choose it for modern
      C++ interfaces rather than GLEW's traditional C/C++ loader API.
    rel: alternative
    sources:
      - https://glew.sourceforge.net/
      - https://glbinding.org/docs/v2.0/
