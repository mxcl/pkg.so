history:
  adoption-history:
    - >
      JPEG Archive found its audience among people with large photo folders rather than
      application developers. Packaging in Homebrew, Nix, and Arch fits that pattern:
      install a few binaries, combine them with GNU Parallel or Ladon, dcraw, exiftool,
      and shell scripts, and run them over existing photo trees.
  package-nerd-significance:
    - >
      The project is notable because it packaged image-quality metrics into everyday
      shell tooling. It is not just another cjpeg wrapper: it represents the practical,
      storage-saving side of perceptual image comparison in a small Unix utility set.
  project-history:
    - >
      The upstream README frames the project around long-term photo storage and web
      serving. Its goals are to use common JPEG files, minimize storage space and cost,
      and identify duplicate or similar photos. The toolset includes jpeg-archive,
      jpeg-recompress, jpeg-compare, and jpeg-hash.
    - >
      The 2.0.0 release line changed the underlying JPEG encoder to mozjpeg and
      defaulted to progressive output. The GitHub release page shows the 2.2.0 release
      dated 2018-07-15, while the README retains a 2015 copyright notice for Daniel G.
      Taylor.
  related-projects:
    - The README recommends Ladon or GNU Parallel for running the tools over many files.
    - >
      jpeg-archive depends on adjacent command-line tools such as dcraw and exiftool for
      some workflows.
    - The project links rflynn/imgmin as an alternative.
  sources:
    - https://formulae.brew.sh/formula/jpeg-archive
    - https://github.com/danielgtaylor/jpeg-archive
    - https://github.com/danielgtaylor/jpeg-archive#readme
    - https://github.com/danielgtaylor/jpeg-archive/releases
  summary:
    - >
      JPEG Archive is a set of command-line tools for reducing, comparing, hashing, and
      batch-processing JPEG photo collections. It grew around a package-nerd-friendly
      idea: keep the broadly supported JPEG format, but squeeze storage cost by
      recompressing images to visually similar output.
  timeline:
    - >
      2015: Project README copyright line identifies Daniel G. Taylor and the JPEG
      Archive toolset.
    - '2018: 2.0.0 release switched to mozjpeg and progressive encoding by default.'
    - '2018: 2.2.0 release appeared on July 15.'
    - '2024: Arch Linux packaging still carried jpeg-archive 2.2.0.'
  usage:
    - >
      The README shows jpeg-archive as a folder-level wrapper and jpeg-recompress as the
      core optimizer. jpeg-recompress searches for the smallest JPEG quality that
      preserves perceived visual quality, optimizes Huffman tables, and can copy EXIF,
      IPTC, XMP, and color profile metadata by default.
related-packages:
  - id: brew:parallel
    reason: >
      GNU Parallel can execute JPEG Archive's per-image recompression jobs across CPU
      cores, a batch workflow explicitly recommended by JPEG Archive's README.
    rel: adjacent_workflow
    sources:
      - https://github.com/danielgtaylor/jpeg-archive#readme
      - https://www.gnu.org/software/parallel/
  - id: brew:dcraw
    reason: >
      dcraw decodes camera raw photos into the image stream consumed by JPEG Archive's
      documented RAW-to-JPEG workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/danielgtaylor/jpeg-archive#readme
      - https://www.dechifro.org/dcraw/
  - id: brew:exiftool
    reason: >
      ExifTool supplies the metadata handling required by JPEG Archive's
      folder-processing script when preserving photo metadata during recompression.
    rel: adjacent_workflow
    sources:
      - https://github.com/danielgtaylor/jpeg-archive#readme
      - https://exiftool.org/
