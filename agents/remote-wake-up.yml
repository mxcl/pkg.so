history:
  adoption-history:
    - >
      The application targets Mac, iPhone, and iPad users who administer home, office,
      NAS, and workstation devices. iCloud synchronization, widgets, Shortcuts, Siri,
      and a macOS menu-bar interface broaden it from a simple packet sender into an
      Apple-platform remote-control utility.
  package-nerd-significance:
    - >
      Remote Wake Up packages Wake-on-LAN discovery and triggering together with
      higher-level SSH and AppleScript actions. It is useful to Mac package users who
      want a native GUI for waking and automating machines without assembling separate
      command-line tools.
  project-history:
    - >
      Witt Software developed Remote Wake Up as an Apple-platform utility for waking and
      controlling networked devices. Version 2.0 introduced a redesigned cross-device
      application with improved Wake-on-LAN and SSH support and iCloud synchronization.
  related-projects:
    - Apple Shortcuts and Siri provide automation entry points.
    - SSH and AppleScript supply command-execution mechanisms beyond Wake-on-LAN.
  sources:
    - 'Official product page: https://www.witt-software.com/remotewakeup/'
    - 'Official release notes: https://www.witt-software.com/releasenotes/'
  summary:
    - >
      Remote Wake Up is a native Apple-platform utility for discovering, waking, and
      controlling networked devices through Wake-on-LAN, SSH, and AppleScript.
  timeline:
    - >
      Version 2.0: Added a modernized Mac, iPhone, and iPad experience with improved
      Wake-on-LAN and SSH support and iCloud synchronization.
  usage:
    - >
      Users discover or define hosts, organize them with labels, and send Wake-on-LAN
      packets locally or, with suitable network configuration, over the internet.
    - >
      Reusable SSH or AppleScript commands can be assigned to hosts and invoked through
      the application, widgets, Shortcuts, Siri, or the Mac menu bar.
