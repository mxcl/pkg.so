history:
  adoption-history:
    - >
      OpenFastTrace supports use as a standalone command-line JAR, as a Java library,
      and through Maven and Gradle build integrations. Its documentation also lists
      IDE-oriented tooling and templates for working with traceable specification items.
  package-nerd-significance:
    - >
      OFT is unusual among package-manager offerings because it turns lightweight
      documentation and source annotations into a traceability graph rather than
      compiling or formatting them. It can also trace itself, demonstrating the same
      documentation-to-implementation workflow it offers to other projects.
    - >
      The modular Java design separates importers, exporters, reporting, the core
      algorithm, and its public API. This allows additional artifact formats and
      build-system integrations without replacing the tracing engine.
  project-history:
    - >
      OpenFastTrace was created as an open-source suite for connecting requirements,
      specifications, implementation, tests, and other project artifacts. Its design
      avoids fixing a single artifact hierarchy, allowing projects to define the kinds
      of coverage they require.
    - >
      The project evolved into a multi-module Java application with Markdown,
      reStructuredText, tagged-source, and SpecObject support, plus reporting and plugin
      APIs. Later major releases raised the supported Java runtime while retaining
      command-line and library usage.
  related-projects:
    - >
      The project maintains or documents Maven and Gradle integrations, IDE support, and
      plugins for additional input formats such as AsciiDoc. Maven Central is the
      official Java artifact distribution channel described by its developer guide.
  sources:
    - https://github.com/itsallcode/openfasttrace#readme
    - https://github.com/itsallcode/openfasttrace/blob/main/doc/developer_guide.md
    - https://github.com/itsallcode/openfasttrace/blob/main/doc/user_guide.md
  summary:
    - >
      OpenFastTrace, commonly abbreviated OFT, is an open-source requirements-tracing
      suite. It links specification items across documentation, implementation, and
      tests to reveal missing coverage and obsolete artifacts.
  timeline:
    - 'Early releases: OpenFastTrace ran on Java 8 and provided a command-line JAR.'
    - '3.x era: The supported runtime moved to Java 11.'
    - >
      4.x era: The supported runtime moved to Java 17, and the project continued
      distributing a CLI, library, and build integrations.
  usage:
    - >
      A project writes identifiable specification items in supported documents and
      places coverage tags in downstream documentation, code, or tests. Running `oft
      trace` over those paths produces text or HTML reports showing complete,
      incomplete, or obsolete trace chains.
    - >
      OFT can run directly from its executable JAR, participate in Maven or Gradle
      builds, or be embedded through its Java API. The official documentation does not
      define a user-level configuration or credential file.
