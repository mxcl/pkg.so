  summary:
    - >
      msgpack-tools is a small pair of Unix-style conversion utilities for MessagePack
      and JSON. The README lists `msgpack2json` for converting MessagePack to JSON and
      `json2msgpack` for the reverse direction, with options for lax JSON parsing, lossy
      conversions, pretty-printing, and base64 encoding. The AUTHORS file names Nicholas
      Fraser and Jerry Jacobs, and the changelog shows the project beginning as
      `msgpack2json` v0.1 before being renamed to msgpack-tools in v0.2.
  usage:
    - >
      The tool's role is practical glue around the MessagePack ecosystem. MessagePack
      itself is a compact binary serialization format supported across many languages;
      msgpack-tools lets developers inspect binary MessagePack payloads, convert
      hand-written JSON into MessagePack during builds, or test MessagePack-RPC services
      with shell pipelines and netcat. Its package-manager niche is intentionally small:
      a command-line bridge between human-editable JSON and binary MessagePack,
      overlapping with broader data remarshal tools but staying focused on two
      executables.
