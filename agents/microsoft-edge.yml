history:
  adoption-history:
    - >
      Microsoft made the Chromium-based Edge generally available for supported Windows
      versions and macOS in January 2020. It replaced Edge Legacy on Windows and
      expanded Edge into a cross-platform browser.
    - >
      Homebrew Cask packages Edge as a macOS application, giving command-line-oriented
      Mac users a reproducible installation and upgrade path alongside Microsoft's
      direct installer.
  package-nerd-significance:
    - >
      Edge is notable to package users as Microsoft's downstream Chromium browser: it
      combines Chromium web compatibility with Microsoft services, enterprise policy
      support, and its own stable and Insider release channels.
    - >
      The stable and Canary casks can coexist, making them useful for
      browser-compatibility testing and for comparing production behavior with upcoming
      Chromium and Edge changes.
  project-history:
    - >
      Microsoft Edge originally shipped with Windows 10 in July 2015 using Microsoft's
      EdgeHTML engine. Microsoft subsequently rebuilt the browser on Chromium; that
      edition was released on January 15, 2020.
  related-projects:
    - >
      Chromium is the upstream open-source browser project on which modern Microsoft
      Edge is based.
    - >
      Microsoft Edge Canary, Dev, and Beta are preview channels that complement the
      stable release.
  sources:
    - >
      https://support.microsoft.com/en-us/microsoft-edge/what-s-the-difference-between-the-new-microsoft-edge-and-microsoft-edge-legacy-a01258e5-8c05-7bbb-bed2-c65bec0eb126
    - https://www.microsoft.com/en-us/edge/download/insider
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Microsoft Edge is Microsoft's cross-platform Chromium-based web browser. This
      record represents its stable macOS release distributed through Homebrew Cask.
  timeline:
    - '2015: Edge Legacy launched with Windows 10 using EdgeHTML.'
    - >
      2020: The Chromium-based Microsoft Edge was released for supported Windows
      versions and macOS.
    - '2021: Support for Edge Legacy ended.'
  usage:
    - >
      Use the stable cask for ordinary browsing, web application testing, and managed
      enterprise deployments. Microsoft documents browser policies and deployment
      separately on Microsoft Learn.
    - >
      Edge stores browser state in a channel-specific user-data directory. Microsoft
      documents the default macOS stable directory as ~/Library/Application
      Support/Microsoft Edge, but this is application data rather than a single
      configuration file.
