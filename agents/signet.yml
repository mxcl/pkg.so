history:
  adoption-history:
    - >
      Signet is published as freeware by The Eclectic Light Company. The input records a
      Homebrew Cask, providing a package-manager installation route in addition to the
      publisher's direct download.
  package-nerd-significance:
    - >
      Signet gives Mac administrators and software collectors a graphical way to audit
      old application bundles for missing, obsolete, revoked, or otherwise problematic
      signatures.
    - >
      That makes it especially relevant when maintaining archives of older Mac software
      or diagnosing why Gatekeeper rejects an application after installation or
      migration.
  project-history:
    - >
      The Eclectic Light Company developed Signet as a focused macOS utility for
      recursively finding application and other bundles and checking their code
      signatures.
    - >
      The application later gained notarization checking and was rebuilt as a universal
      application for Intel and Apple-silicon Macs.
  related-projects:
    - >
      Taccy, another Eclectic Light utility for examining code signatures and privacy
      settings.
    - >
      Gatekeeper, the macOS security subsystem whose signature assessments Signet helps
      users investigate.
    - Apple notarization, which newer Signet releases can check.
  sources:
    - 'Official downloads page: https://eclecticlight.co/downloads/'
    - >
      Official product page:
      https://eclecticlight.co/taccy-signet-precize-alifix-utiutility-alisma/
    - source_facts.package-manager
  summary:
    - >
      Signet is a macOS security utility from The Eclectic Light Company that scans
      folders for bundles and reports code-signature problems.
  timeline:
    - >
      2019: The official product page documented Signet as a utility for scanning and
      checking bundle signatures.
    - 'Apple-silicon transition era: Signet became available as a universal Mac application.'
    - Later releases added notarization checking.
  usage:
    - >
      Users select a folder for recursive scanning. Signet finds application and other
      bundles, validates their signatures, and reports issues such as revocation,
      missing signatures, and obsolete signature types.
    - >
      It is intended for investigating old or suspect software and for performing a
      broader signature audit than checking one bundle manually.
