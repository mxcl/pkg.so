history:
  adoption-history:
    - >
      ScreenFocus is sold directly by Apptorium and through the Mac App Store as a
      small, single-purpose utility for multi-display Mac users. It is also packaged as
      the Homebrew cask recorded in source_facts.package-manager. Official sources do
      not publish usage totals.
  package-nerd-significance:
    - >
      ScreenFocus exemplifies the compact native macOS utility: it changes one aspect of
      the desktop environment, has minimal setup, and can be installed reproducibly as a
      cask. Its privacy claim is unusually straightforward for a focus
      utility—display-dimming activity remains on the Mac, with no usage analytics or
      telemetry.
  project-history:
    - >
      Apptorium created ScreenFocus to reduce distraction and glare in multi-monitor
      workspaces by dimming displays that are not currently under the pointer. Users can
      choose which monitors participate and tune dim level, delay, and fade duration.
    - >
      ScreenFocus 1.1 added Apple Silicon support and introduced a new license system in
      2022. Version 1.1.1 followed as a bug-fix release in 2024.
  related-projects:
    - Apptorium Cursor Teleporter
    - macOS Displays settings
    - Homebrew Cask
  sources:
    - >
      Official per-monitor article:
      https://www.apptorium.com/screenfocus/articles/why-main-monitor-is-not-dimmed
    - 'Official product page and FAQ: https://www.apptorium.com/screenfocus'
    - 'Official release notes: https://www.apptorium.com/screenfocus/release-notes'
    - source_facts.package-manager
  summary:
    - >
      ScreenFocus is an Apptorium macOS utility that automatically dims inactive
      displays and restores a display’s brightness when the pointer moves onto it.
  timeline:
    - '2022: ScreenFocus 1.1 introduced Apple Silicon support and a new license system.'
    - '2024: ScreenFocus 1.1.1 delivered bug fixes.'
  usage:
    - >
      ScreenFocus runs as a menu-bar utility in a multi-monitor workspace. The user
      selects which displays may be dimmed and adjusts the dim level, delay, and fade;
      moving the pointer between displays automatically changes which screen is
      emphasized.
