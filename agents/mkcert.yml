history:
  project-history:
    - >
      The tool's core idea is deliberately narrow. Instead of asking each developer to
      memorize OpenSSL invocations or manage browser trust stores by hand, mkcert
      creates a local certificate authority, installs it into the system and Firefox/NSS
      trust stores where supported, and issues certificates for local hostnames, IP
      addresses, and wildcards. The upstream README also warns that the generated root
      CA private key can intercept secure requests from the machine, which is why mkcert
      is framed as a local development tool rather than production CA infrastructure.
  sources:
    - https://formulae.brew.sh/formula/mkcert
    - https://github.com/FiloSottile/mkcert
    - https://news.ycombinator.com/item?id=17748208
    - https://words.filippo.io/mkcert-valid-https-certificates-for-localhost/
  summary:
    - >
      mkcert is Filippo Valsorda's small Go tool for locally trusted development
      certificates. It appeared in the 2018 developer conversation around localhost
      HTTPS and was explained by Valsorda in a January 2019 post: deployment
      certificates had become easier through ACME and Let's Encrypt, but development
      still fell back to HTTP because localhost and private development names cannot use
      ordinary public CA validation.
  usage:
    - >
      mkcert became a common package-manager utility because it solves a recurring
      web-development pain point with one command and no project-specific configuration.
      Homebrew, MacPorts, Linux packages, and prebuilt binaries cover the usual
      developer platforms, while the README leaves web-server configuration to the user
      after the certificate and key are generated.
related-packages:
  - id: brew:gimmecert
    reason: >
      Choose Gimmecert for an explicit per-project CA hierarchy with server and client
      certificates; choose mkcert when automatic local browser and operating-system
      trust is the priority.
    rel: alternative
    sources:
      - https://github.com/FiloSottile/mkcert#readme
      - https://gimmecert.readthedocs.io/en/stable/usage.html
  - id: brew:nss
    reason: >
      Install NSS alongside mkcert when certutil is needed to add the local CA to
      Firefox or another NSS trust store on macOS or Linux.
    rel: adjacent_workflow
    sources:
      - https://github.com/FiloSottile/mkcert#readme
      - https://firefox-source-docs.mozilla.org/security/nss/index.html
