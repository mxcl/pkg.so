history:
  adoption-history:
    - >
      Amadine expanded from a Mac-focused vector editor to a cross-device product for
      macOS, iPadOS, and iOS. Its mobile editions support Apple Pencil workflows, while
      clipboard and document-format improvements facilitate moving designs between Apple
      devices.
  package-nerd-significance:
    - >
      Amadine is of interest as a native, comparatively lightweight vector-design
      alternative distributed both directly and through Apple's stores. The Homebrew
      cask provides a convenient installation route for the direct-download macOS
      edition.
  project-history:
    - >
      BeLight Software developed Amadine as a vector illustration and graphic-design
      application for Apple platforms. The documented 1.x series steadily added
      professional features including flowing text, CMYK documents, compressed native
      files, shape libraries, image-stock integration, color-profile improvements, and
      image tracing.
  related-projects:
    - BeLight Software
    - Figma
    - Pexels
    - Pixabay
    - Unsplash
  sources:
    - https://amadine.com/
    - https://amadine.com/support/help/
    - https://amadine.com/support/release-notes
  summary:
    - >
      Amadine is BeLight Software's vector illustration and graphic-design application
      for Mac, iPad, and iPhone.
  timeline:
    - 'Version 1.2: Expanded vector-shape libraries and introduced the Fusion tool.'
    - 'Version 1.4: Added flowing text, CMYK support, and a compressed native document format.'
    - 'Version 1.6: Added integrated image-stock access and expanded preference controls.'
    - >
      Version 1.8.3: Added bitmap-to-vector image tracing and raised minimum platform
      requirements.
  usage:
    - >
      Users create illustrations, icons, layouts, and other vector artwork with pen,
      drawing, shape, text, gradient, path, layer, and layout tools. The application
      imports and exports common vector and raster formats and uses its own Amadine
      document formats for editable work.
