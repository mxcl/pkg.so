credentials-file-location: null
history:
  project-history:
    - >
      The project documentation broadens that role into a small code-generation
      framework: mockery inspects Go source, emits implementations for interfaces,
      supports multiple mock styles, and lets users provide custom templates rendered
      with typed interface metadata. Configuration via `.mockery.yaml` lets projects
      select packages and interfaces, which makes it suitable for repeatable generation
      in CI or local test workflows.
  sources:
    - https://api.github.com/repos/vektra/mockery
    - https://formulae.brew.sh/formula/mockery
    - https://github.com/vektra/mockery
    - https://vektra.github.io/mockery/v3.7/
  summary:
    - >
      mockery is a Go code generator from the vektra GitHub organization for creating
      mock implementations of Go interfaces. Its repository was created in 2014 and the
      README frames the original use case around generating mocks that work with
      `stretchr/testify/mock`, removing repetitive hand-written mock code in Go tests.
  usage:
    - >
      Within package managers, mockery fills the Go-testing generator niche alongside
      tools such as mockgen and moq. Homebrew packages it as `mockery`, and package
      records also list Debian, Ubuntu, MacPorts, Scoop, and zypper, matching its role
      as a developer CLI installed outside an individual Go module when teams want
      consistent generated mocks across repositories.
