id: brew:mysql-client@8.0
display-name: MySQL Client 8.0
repo: https://github.com/mysql/mysql-server
docs:
  - https://dev.mysql.com/doc/refman/8.0/en
  - https://dev.mysql.com/doc/refman/8.0/en/option-files.html
config-file-location:
  unix:
    - /etc/my.cnf
    - /etc/mysql/my.cnf
    - SYSCONFDIR/my.cnf
    - ~/.my.cnf
  windows:
    - '%WINDIR%\my.ini'
    - '%WINDIR%\my.cnf'
    - C:\my.ini
    - C:\my.cnf
    - '%APPDATA%\MySQL\.mylogin.cnf'
credentials-file-location:
  unix:
    - ~/.my.cnf
    - ~/.mylogin.cnf
  windows:
    - '%APPDATA%\MySQL\.mylogin.cnf'
history:
  project-history:
    - >
      MySQL 8.0 was a major technical generation. Oracle's 8.0 manual highlights a
      transactional data dictionary replacing older metadata files and nontransactional
      tables, atomic DDL, and automatic server-side upgrade work that formerly depended
      on `mysql_upgrade`. The 8.0 release notes list the GA line beginning with 8.0.11
      on 2018-04-19 and running through 8.0.46, with the notes marking 8.0.46 as the
      April 2026 EOL point for the series.
  sources:
    - https://blogs.oracle.com/mysql/mysql-retrospective-the-early-years
    - https://dev.mysql.com/doc/refman/5.7/en/programs-client.html
    - https://dev.mysql.com/doc/refman/8.0/en/mysql-nutshell.html
    - https://dev.mysql.com/doc/refman/8.0/en/mysqldump.html
    - https://dev.mysql.com/doc/relnotes/mysql/8.0/en/
    - https://formulae.brew.sh/formula/mysql-client@8.0
    - https://www.oracle.com/corporate/pressrelease/oracle-buys-sun-042009.html
  summary:
    - >
      The `mysql-client@8.0` formula packages the client-side tools for the MySQL 8.0
      series, separating the CLI utilities from a full local server install. It inherits
      the broader MySQL history: MySQL was founded in 1995 by Allan Larsson, David
      Axmark, and Michael "Monty" Widenius, grew through early web and Linux adoption,
      moved to the GPL during the MySQL 3.23 era, was acquired by Sun in 2008, and came
      under Oracle through Oracle's acquisition of Sun.
  usage:
    - >
      For users, the Homebrew `@8.0` formula preserves access to the 8.0-compatible
      client command set: `mysql` for SQL sessions and scripts, `mysqldump` and
      `mysqlpump` for logical export workflows, `mysqladmin` for server operations,
      `mysqlcheck` for table maintenance, `mysqlbinlog` for binary log inspection, and
      helper programs such as `mysql_config_editor`. It is useful when applications,
      servers, or deployment policies remain pinned to the 8.0 protocol and tooling
      behavior rather than the unversioned client package.
related-packages:
  - id: brew:mycli
    reason: >
      Choose mycli for interactive MySQL work when context-sensitive completion, syntax
      highlighting and richer terminal ergonomics matter more than using Oracle's
      reference client.
    rel: alternative
    sources:
      - https://www.mycli.net/docs
      - https://github.com/dbcli/mycli
      - https://formulae.brew.sh/formula/mycli
  - id: brew:mysql
    reason: >
      Install the full MySQL package when this client toolbox must be paired with a
      locally operated MySQL server daemon.
    rel: adjacent_workflow
    sources:
      - https://dev.mysql.com/doc/refman/8.4/en/what-is-mysql.html
      - https://dev.mysql.com/doc/refman/8.4/en/mysql.html
      - https://formulae.brew.sh/formula/mysql
tags:
  - cli
  - client
  - database
  - mysql
  - sql
provenance:
  category-sources:
    - 'source_facts.description: open source relational database management system.'
  display-name-sources:
    - source_facts.name mysql-client@8.0 normalized to MySQL Client 8.0.
  docs-sources:
    - Official MySQL 8.0 Reference Manual documents option files.
  history-sources:
    - https://blogs.oracle.com/mysql/mysql-retrospective-the-early-years
    - https://dev.mysql.com/doc/refman/5.7/en/programs-client.html
    - https://dev.mysql.com/doc/refman/8.0/en/mysql-nutshell.html
    - https://dev.mysql.com/doc/refman/8.0/en/mysqldump.html
    - https://dev.mysql.com/doc/relnotes/mysql/8.0/en/
    - https://formulae.brew.sh/formula/mysql-client@8.0
    - https://www.oracle.com/corporate/pressrelease/oracle-buys-sun-042009.html
  repo-sources:
    - source_facts.homepage is the official MySQL Server GitHub repository.
  tags-sources:
    - >
      source_facts.executables include mysql, mysqladmin, mysqldump, and related MySQL
      client tools.
category-confidence: high
category-path:
  - data
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
tags-confidence: high
