history:
  adoption-history:
    - >
      GNUSki's adoption appears small and package-manager-oriented. Its SourceForge page
      shows console-game metadata and minimal current download activity, while Homebrew
      packages version 0.3 from the SourceForge release archive.
  package-nerd-significance:
    - >
      GNUSki is a small terminal-game package kept alive by source archives and
      package-manager recipes. Its interest is mostly nostalgic: SkiFree-style gameplay
      translated into an ncurses console program.
  project-history:
    - >
      SourceForge lists GNUSki as registered on 30 June 2005, with a file area
      containing the `gnuski-0.3.tar.gz` release under a directory modified on 31 May
      2007.
    - >
      The SourceForge project summary records the project as inactive, with a last
      update on 25 March 2016.
  related-projects:
    - SkiFree is the game GNUSki clones.
    - NCurses is the terminal UI library named by the official project metadata.
  sources:
    - https://formulae.brew.sh/api/formula/gnuski.json
    - https://sourceforge.net/projects/gnuski/
    - https://sourceforge.net/projects/gnuski/files/
    - https://sourceforge.net/rest/p/gnuski
  summary:
    - >
      GNUSki is an inactive SourceForge-hosted open source console game described by its
      project page as a clone of the old Windows game SkiFree using NCurses graphics.
  timeline:
    - '2005-06-30: SourceForge project registration date.'
    - '2007-05-31: SourceForge file area lists the GNUSki release directory.'
    - '2016-03-25: SourceForge project page lists the last update date.'
  usage:
    - >
      The official metadata identifies GNUSki as a Linux/BSD/Cygwin C++ console game
      using Curses/Ncurses. Homebrew installs the `gnuski` executable from the
      SourceForge tarball.
