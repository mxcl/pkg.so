history:
  adoption-history:
    - >
      VorbisGain became a small but durable distro package because it solved a common
      local-library problem for Ogg users. Debian's package description notes that the
      process is non-destructive and that many audio players in Debian supported reading
      the tags, including XMMS, Quod Libet, amaroK, Muine, and Rhythmbox.
  package-nerd-significance:
    - >
      VorbisGain is package-nerd significant as a codec-specific metadata tool: it is
      not a general audio editor, but the exact utility you want when maintaining an
      old-school Ogg Vorbis collection with ReplayGain-aware players.
  project-history:
    - >
      VorbisGain came from the Ogg Vorbis and ReplayGain era, when listeners and
      music-library maintainers wanted album and track loudness consistency without
      destructive peak normalization. The project homepage describes it as a replacement
      for pre-encoding normalization: instead of changing samples, it analyzes perceived
      loudness and writes tags that compatible players can use at playback time.
    - >
      The available public history is thin compared with core Xiph projects, but the
      tool's role is clear and stable: apply ReplayGain technology specifically to Ogg
      Vorbis files, add clipping-prevention hints, and rely on player support for the
      playback adjustment.
  related-projects:
    - ReplayGain is the loudness-normalization method VorbisGain implements.
    - >
      vorbis-tools, libvorbis, mp3gain, metaflac, foobar2000, and Quod Libet are
      adjacent tools or consumers in the same audio metadata ecosystem.
  sources:
    - https://linux.die.net/man/1/vorbisgain
    - https://packages.debian.org/sid/sound/vorbisgain
    - https://sjeng.org/vorbisgain.html
    - https://wiki.hydrogenaudio.org/index.php/ReplayGain
  summary:
    - >
      VorbisGain is a command-line utility for calculating ReplayGain values for Ogg
      Vorbis files and storing the results as Vorbis comment tags. It targets perceived
      loudness normalization without rewriting the audio stream.
  timeline:
    - >
      2001: ReplayGain emerged as a proposed loudness-normalization technique for
      formats including Ogg Vorbis.
    - >
      2000s: VorbisGain circulated as the Ogg Vorbis-specific command-line scanner and
      tag writer.
    - >
      Current package era: Distribution packages continue to ship VorbisGain as a small
      utility for non-destructive ReplayGain tagging.
  usage:
    - >
      The man page describes `vorbisgain` as calculating ReplayGain values for named Ogg
      Vorbis input files and writing the result back as tags. Common modes include album
      gain with `-a`, recursive processing with `-r`, skipping already tagged files with
      `-f`, display-only mode with `-d`, cleaning tags with `-c`, and converting older
      ReplayGain tags with `-C`.
    - >
      Typical users run it over album directories after ripping or encoding to Vorbis,
      then let compatible players choose track-gain or album-gain playback.
      Non-supporting players still play the files because the audio data is unchanged.
