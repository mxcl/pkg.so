id: brew:nerdfetch
display-name: NerdFetch
repo: null
docs:
  - https://github.com/ThatOneCalculator/NerdFetch#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      NerdFetch's adoption is mostly in terminal-aesthetic and lightweight-system-info
      circles rather than infrastructure tooling. The README lists installation routes
      through Arch AUR, Homebrew, Nix, Gentoo GURU or LiGurOS, manual curl install,
      Termux, and one-shot shell execution. The Homebrew formula API reported stable
      version 8.5.4 and 193 install-on-request events in the prior 30 days when checked
      on 2026-07-01.
  package-nerd-significance:
    - >
      NerdFetch is not a foundational package, but it is representative of the terminal
      rice ecosystem: tiny, portable, icon-forward, and distributed through several
      community package managers. It is useful enrichment for package catalogs because
      its value comes from cross-OS packaging and terminal culture more than from a
      large dependency graph.
  project-history:
    - >
      The project deliberately keeps the implementation portable: the README describes
      it as a POSIX.1-2001 shell script for Linux, macOS, Android, BSD systems, and
      other Unix-like environments. Its dependencies are an icon-capable font such as
      Nerd Fonts, Cozette, Phosphor, or emoji mode, plus a POSIX-compliant shell. A
      February 2026 release note for v8.5.0 calls out POSIX.1-2001 compatibility as a
      feature, reinforcing that portability is the project's main engineering story.
    - >
      GitHub metadata retrieved on 2026-07-01 showed about 643 stars and 35 forks, with
      repository topics including neofetch, screenfetch, system-information, terminal,
      unixporn, Termux, macOS, Linux, and POSIX.
  related-projects:
    - Nerd Fonts
    - neofetch
    - screenfetch
    - Cozette
    - Phosphor
    - Termux
  sources:
    - https://api.github.com/repos/ThatOneCalculator/NerdFetch
    - https://api.github.com/repos/ThatOneCalculator/NerdFetch/releases?per_page=100
    - https://formulae.brew.sh/api/formula/nerdfetch.json
    - https://github.com/ThatOneCalculator/NerdFetch
    - https://github.com/ThatOneCalculator/NerdFetch/releases
  summary:
    - >
      NerdFetch is a small POSIX shell system-fetch script in the neofetch/screenfetch
      tradition, but themed around Nerd Fonts and other icon fonts. Its GitHub
      repository was created on 2020-09-05, and the release stream visible through
      GitHub starts at v5.0.0 on 2022-02-24 and reaches v8.5.4 on 2026-03-15.
  timeline:
    - '2020-09-05: GitHub repository created.'
    - '2022-02-24: Oldest GitHub release returned by the API, v5.0.0.'
    - '2026-02-01: v8.5.0 release note highlights POSIX.1-2001 compatibility.'
    - '2026-03-15: v8.5.4 released.'
  usage:
    - >
      Users run `nerdfetch` to print OS, shell, package-manager, and environment facts
      with compact icon-heavy output for screenshots, shell startup demos, and quick
      machine identity checks. It is a package-nerd fit because it tests icon font
      setup, shell portability, and package-manager detection across many Unix-like
      systems.
related-packages:
  - id: brew:fastfetch
    reason: >
      fastfetch performs the same terminal system-information task with a compiled,
      highly configurable implementation, while NerdFetch favors a small portable POSIX
      shell script and icon-font styling.
    rel: alternative
    sources:
      - https://github.com/ThatOneCalculator/NerdFetch
      - https://github.com/fastfetch-cli/fastfetch
