history:
  adoption-history:
    - >
      Clock Signal is released as a native macOS application and as source code, while
      Qt and SDL interfaces support Linux, BSD, and other Unix-like systems.
    - >
      The macOS build is available through Homebrew Cask as clock-signal. Official
      GitHub releases use date-based release names and continue to deliver emulator
      fixes and hardware-support improvements.
  package-nerd-significance:
    - >
      Clock Signal is aimed at emulation enthusiasts who value automatic media
      detection, cycle-level accuracy, authentic signal processing, and low latency. Its
      shared core spanning Cocoa/Metal, Qt, and SDL also makes it interesting to
      developers working on portable emulation front ends.
  project-history:
    - >
      Tom Harte developed Clock Signal as a multi-system emulator that attempts to make
      the emulator itself unobtrusive: users open disk, tape, or ROM media and CLK
      analyzes it to select and configure a suitable machine.
    - >
      The project grew to cover numerous 8- and 16-bit computers and consoles. Its
      architecture emphasizes bus- and cycle-level modeling, composite-video and audio
      signal processing, and host-driven low-latency output.
  related-projects:
    - CLK's Qt interface
    - CLK's SDL interface
  sources:
    - Input fields source_facts.repo and source_facts.package-manager.
    - 'Official build guide: https://github.com/TomHarte/CLK/blob/master/BUILD.md'
    - 'Official releases: https://github.com/TomHarte/CLK/releases'
    - 'Official repository and README: https://github.com/TomHarte/CLK'
  summary:
    - >
      Clock Signal, also called CLK, is an open-source multi-system emulator focused on
      one-step media loading, accurate signal reproduction, cycle-level emulation, and
      low input and audiovisual latency.
  timeline:
    - >
      Early development: Clock Signal begins with bus-level emulation of the Z80, ZX80,
      and ZX81.
    - >
      Later development: The project expands into a multi-system emulator with native
      macOS and cross-platform Qt and SDL interfaces.
    - >
      2026: Date-based GitHub releases continue with fixes across the emulated computer
      and console set.
  usage:
    - >
      On macOS, users can open supported disk, tape, or ROM files directly; CLK attempts
      to infer the platform, configure the emulated machine, and issue required loading
      commands. Cross-platform builds can also be launched from the command line with a
      media-file argument.
