repo: https://gitlab.com/duplicity/duplicity
docs:
  - https://duplicity.us/docs.html
  - https://duplicity.us/stable/README.html
  - https://duplicity.us/stable/duplicity.1.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      duplicity's adoption rests on a simple Unix promise: encrypted incremental backups
      to many storage protocols from a CLI. The official site says it is mature software
      used for large personal and corporate backups.
    - >
      The project is packaged broadly across Homebrew, Alpine, Debian, Fedora, MacPorts,
      Nix, Arch, Ubuntu, and openSUSE-style ecosystems in the batch metadata. The
      official site also names Fedora, Debian, and Ubuntu distribution inclusion,
      reinforcing its long-standing Linux distribution presence.
    - >
      Its ecosystem includes frontends such as Déjà Dup and duply. The official
      duplicity homepage points to Déjà Dup releases and describes duply as a shell
      frontend formerly known as ftplicity.
  package-nerd-significance:
    - >
      duplicity matters to package maintainers because it is old, security-sensitive
      infrastructure at the intersection of Python packaging, GnuPG, librsync,
      remote-storage SDKs, and system backup policy.
    - >
      It also anchors a family of related packages. Duplicacy's README compares itself
      directly with duplicity, and duply exists primarily to profile and automate
      duplicity invocations. That makes duplicity both an executable and a reference
      point in backup-tool design debates.
  project-history:
    - >
      duplicity's public identity has stayed remarkably stable: encrypted remote backups
      built from tar, GnuPG, and the rsync algorithm. The official site describes this
      design directly and notes that the package also includes `rdiffdir`, an extension
      of librsync's `rdiff` idea to directories.
    - >
      The project later moved its public development to GitLab, where the repository
      metadata records the current project namespace as created in 2019. The official
      site still links to older Launchpad downloads for historical releases, showing a
      longer project history than the GitLab creation date alone.
    - >
      By 2026 duplicity had reached the 3.x series, with the official site listing 3.1.0
      as the current release on June 16, 2026. The stable README also reflects modern
      Python packaging changes, recommending pipx/venv-style installs for Python
      3.11-era externally managed environments.
  related-projects:
    - librsync and GnuPG are core dependencies in duplicity's design.
    - rdiff-backup is historically adjacent and is linked from duplicity's site.
    - Déjà Dup and duply are prominent frontends called out by the official homepage.
    - >
      Duplicacy, restic, Duplicati, bup, and Attic are related backup tools often
      compared with duplicity.
  sources:
    - >
      https://duplicity.us/ documents the core design, maturity/adoption statement,
      supported backends, current release, related frontends, and distribution
      inclusion.
    - >
      https://duplicity.us/stable/README.html documents modern installation and
      development guidance.
    - >
      https://duplicity.us/stable/duplicity.1.html documents command-line behavior and
      backend URL usage.
    - >
      https://gitlab.com/api/v4/projects/duplicity%2Fduplicity documents current GitLab
      repository metadata.
    - >
      https://gitlab.com/api/v4/projects/duplicity%2Fduplicity/repository/tags?per_page=20
      documents recent release tags.
  summary:
    - >
      duplicity is a long-running encrypted, bandwidth-efficient backup tool. It backs
      up directories by creating encrypted tar-format volumes and uploading them to
      local or remote storage, using librsync so incrementals record only changed parts
      of files.
  timeline:
    - >
      2000s: duplicity establishes its core model of encrypted tar volumes plus
      librsync-based incrementals.
    - '2019: The current GitLab project namespace is created.'
    - '2025: duplicity 3.0.x releases continue through GitLab tags.'
    - '2026: duplicity 3.1.0 is released on June 16, 2026 according to the official homepage.'
  usage:
    - >
      Typical usage is to run duplicity against a source directory and a target URL,
      using GnuPG keys or passphrases for encryption/signing and a backend URL for
      storage. Supported backends listed by the official site include S3, Backblaze B2,
      Dropbox, FTP, GIO, Google Drive, IMAP, local filesystem, Mega, Azure, OneDrive,
      rclone, rsync, SSH/SCP, SwiftStack, Tahoe-LAFS, and WebDAV.
    - >
      duplicity supports deleted files, Unix permissions, directories, symbolic links,
      FIFOs, and device files, but the official site notes hard links are not supported.
      Administrators often wrap it in cron jobs, system scripts, duply profiles, or GUI
      frontends.
related-packages:
  - id: brew:duply
    reason: >
      Choose duply with duplicity when recurring jobs need named profiles, pre/post
      scripts, verification, and retention batches; the duplicity project officially
      identifies duply as its shell frontend.
    rel: adjacent_workflow
    sources:
      - https://duplicity.us/
      - https://duply.net/Main_Page
  - id: brew:rdiff-backup
    reason: >
      Choose rdiff-backup instead when an ordinary browsable mirror of the latest backup
      and reverse-difference history are preferable to duplicity's encrypted tar
      volumes.
    rel: alternative
    sources:
      - https://duplicity.us/
      - https://rdiff-backup.net/
  - id: brew:restic
    reason: >
      Choose restic instead for a snapshot repository built around content-defined
      chunking, deduplication, authenticated encryption, and explicit integrity checking
      rather than duplicity's tar-volume and librsync model.
    rel: alternative
    sources:
      - https://duplicity.us/
      - https://restic.readthedocs.io/en/stable/
      - https://restic.net/
