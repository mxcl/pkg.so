      The official App Store product title is SSH Config Editor:
      https://apps.apple.com/us/app/ssh-config-editor/id1109319285?mt=12
    - current_curation.display-name
  docs-sources:
    - The official App Store listing is the best accessible first-party feature reference.
    - source_facts.homepage identifies the developer homepage.
  history-sources:
    - https://apps.apple.com/us/app/ssh-config-editor/id1109319285?mt=12
    - https://github.com/Hejki/kitty-ssh
    - https://man.openbsd.org/ssh
    - https://man.openbsd.org/ssh-keygen
    - source_facts.package-manager
  repo-sources:
    - >
      No official public source repository for the SSH Config Editor application was
      identified. The developer's `kitty-ssh` repository is a related integration
      utility, not the application itself.
  tags-sources:
    - >
      The official App Store listing documents OpenSSH configuration, identity files,
      port forwarding, key generation, known-host editing, and macOS support.
