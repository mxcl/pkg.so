id: cask:ssh-config-editor
display-name: SSH Config Editor
repo: null
docs:
  - https://apps.apple.com/us/app/ssh-config-editor/id1109319285?mt=12
  - https://www.hejki.org/ssheditor
config-file-location:
  macos:
    - ~/.ssh/config
    - ~/.ssh/known_hosts
credentials-file-location:
  macos:
    - ~/.ssh/id_ecdsa
    - ~/.ssh/id_ecdsa_sk
    - ~/.ssh/id_ed25519
    - ~/.ssh/id_ed25519_sk
    - ~/.ssh/id_mldsa44_ed25519
    - ~/.ssh/id_rsa
history:
  adoption-history:
    - >
      The application is distributed as a macOS app and is also packaged as the Homebrew
      Cask `ssh-config-editor`, making a graphical OpenSSH configuration workflow
      available through a command-line-oriented package ecosystem.
  package-nerd-significance:
    - >
      It is notable as a native graphical layer over standard OpenSSH files rather than
      a separate proprietary connection database. That lets users retain configuration
      compatible with the system `ssh` client while gaining structured editing and
      key-management conveniences.
  project-history:
    - >
      Petr Hejkal publishes SSH Config Editor for macOS. Its official listing describes
      a focused editor for OpenSSH client configuration with graphical support for
      identities, forwarding rules, arbitrary SSH options, key generation, and
      known-host management.
  related-projects:
    - OpenSSH supplies the configuration and identity-file formats managed by the application.
    - >
      Hejki's `kitty-ssh` utility integrates kitty terminal URL handling with SSH Config
      Editor preferences.
  sources:
    - https://apps.apple.com/us/app/ssh-config-editor/id1109319285?mt=12
    - https://github.com/Hejki/kitty-ssh
    - https://man.openbsd.org/ssh
    - https://man.openbsd.org/ssh-keygen
    - source_facts.package-manager
  summary:
    - >
      SSH Config Editor is a macOS graphical editor for OpenSSH client configuration. It
      manages host entries, identity files, forwarding rules, known hosts, and
      connection launching while retaining the standard OpenSSH file model.
  timeline:
    - >
      The official App Store release history documents continued maintenance of the
      macOS application.
    - >
      2025: Official release notes recorded compatibility and user-interface maintenance
      for current macOS releases.
  usage:
    - >
      Use it to organize SSH host definitions, choose identity files, configure local or
      remote port forwarding, inspect known hosts, generate keys, and launch configured
      connections.
    - >
      The principal configuration files are `~/.ssh/config` and `~/.ssh/known_hosts`;
      OpenSSH private identities conventionally reside under `~/.ssh/` but may be stored
      at user-selected paths.
tags:
  - gui
  - key-management
  - known-hosts
  - macos
  - openssh
  - port-forwarding
  - ssh
  - ssh-config
provenance:
