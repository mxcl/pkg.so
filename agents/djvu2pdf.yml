history:
  adoption-history:
    - >
      The input package metadata shows djvu2pdf packaged across Homebrew, MacPorts, Nix,
      and zypper, which is typical for small Unix document utilities that remain useful
      in archival and conversion workflows.
  package-nerd-significance:
    - >
      djvu2pdf is package-nerd interesting because it is a thin wrapper around older
      document-conversion primitives: tiny upstream, stable job, broad enough packaging,
      and little need for a larger application stack.
  project-history:
    - >
      The official project page describes djvu2pdf as a compact tool that works on
      Linux, BSD, and MacOS, with Windows use handled through Cygwin. Its documented
      dependency stack is the classic Unix document toolchain: DjVuLibre command-line
      utilities and Ghostscript.
    - >
      The official download surface is release-archive oriented rather than repository
      oriented, listing a source tarball and Debian package for version 0.9.2.
  related-projects:
    - DjVuLibre supplies the DjVu command-line tools used in the documented dependency set.
    - Ghostscript supplies the PDF/PostScript processing dependency documented by the project.
  sources:
    - https://0x2a.at/site/projects/djvu2pdf
    - source_facts.package-manager
  summary:
    - >
      djvu2pdf is a small command-line document converter for turning DjVu files into
      PDF files.
  timeline:
    - '0.9.2: Official project page lists source and Debian package downloads.'
    - '2026 batch: Input metadata shows packaging in Homebrew, MacPorts, Nix, and zypper.'
  usage:
    - >
      Users install DjVuLibre and Ghostscript, then run the djvu2pdf executable to
      convert DjVu documents into PDFs for readers and document-processing pipelines.
related-packages:
  - id: brew:djvulibre
    reason: >
      djvu2pdf officially requires DjVuLibre's command-line tools to decode and process
      the DjVu input before PDF generation.
    rel: adjacent_workflow
    sources:
      - https://0x2a.at/site/projects/djvu2pdf
      - https://djvu.sourceforge.net/doc/index.html
  - id: brew:ghostscript
    reason: >
      djvu2pdf officially requires Ghostscript for the PDF/PostScript stage of its
      conversion pipeline.
    rel: adjacent_workflow
    sources:
      - https://0x2a.at/site/projects/djvu2pdf
      - https://www.ghostscript.com/
