config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      diff-pdf became useful to packagers because it fills a precise automation gap:
      comparing rendered PDFs in CI, document workflows, and release checks where
      textual diffs do not describe visual output. The README documents installation
      through Windows release ZIPs, Chocolatey, Homebrew, MacPorts, Fedora/CentOS
      packages, and openSUSE builds.
  package-nerd-significance:
    - >
      The package is a good example of Unix packaging around graphical document
      infrastructure: a CLI front end with GUI mode, native library dependencies, and
      real value in reproducible document testing.
  project-history:
    - >
      The upstream GitHub repository was created in 2009 and describes diff-pdf as a
      simple tool for visually comparing two PDF files. The README now labels the
      project as provided as-is and not actively developed, while still welcoming
      patches.
    - >
      The project has kept a traditional autotools build and depends on wxWidgets,
      Cairo, and Poppler. GitHub releases show continuing tagged maintenance from the
      0.3 series in 2019 through 0.5.3 in 2026.
  related-projects:
    - >
      Poppler, Cairo, wxWidgets, Chocolatey, Homebrew, MacPorts, and openSUSE Build
      Service are the main adjacent tools and distribution surfaces named by upstream.
  sources:
    - https://github.com/vslavik/diff-pdf
    - https://api.github.com/repos/vslavik/diff-pdf
    - https://raw.githubusercontent.com/vslavik/diff-pdf/master/README.md
    - https://api.github.com/repos/vslavik/diff-pdf/releases
  summary:
    - >
      diff-pdf is a small visual comparison tool for PDF files. It can act like a quiet
      CLI checker through exit status, emit a highlighted diff PDF, or open a simple
      viewer for page-by-page inspection.
  timeline:
    - '2009: The vslavik/diff-pdf GitHub repository is created.'
    - '2019: Version 0.3 appears in GitHub releases.'
    - '2021: Version 0.5 is released.'
    - '2026: Version 0.5.3 is released.'
  usage:
    - >
      Common usage is diff-pdf a.pdf b.pdf for an exit code, --output-diff=diff.pdf for
      a marked-up artifact, or --view for an interactive GUI. That mix makes it useful
      both in scripts and in manual document review.
related-packages:
  - id: brew:diffoscope
    reason: >
      Choose diffoscope when you need recursive, human-readable inspection of a PDF's
      internal structure or other build artifacts rather than diff-pdf's rendered visual
      comparison.
    rel: alternative
    sources:
      - https://github.com/vslavik/diff-pdf#readme
      - https://diffoscope.org/
