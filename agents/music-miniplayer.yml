    - https://marioaguzman.github.io/musicminiplayer/
  summary:
    - >
      Music MiniPlayer is a native macOS remote for Apple Music whose interface
      recreates the classic iTunes MiniPlayer.
  timeline:
    - "2022: Music MiniPlayer received an Editors' Choice mention in MacLife's October issue."
  usage:
    - >
      The utility provides glanceable track information and playback controls for Apple
      Music, plus playlist selection and a specialized live-streaming display.
    - >
      It requires the macOS Music application, does not require an Apple Music
      subscription, and is not compatible with Spotify.
