id: brew:mpgtx
display-name: mpgtx
repo: https://sourceforge.net/p/mpgtx/code/HEAD/tree
docs:
  - https://mpgtx.sourceforge.net/
config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The early project history is preserved in the homepage news log. Version 1.0 was
      announced as the first stable release on July 23, 2001. Version 1.1 added support
      for files larger than 2 GB, and version 1.3 in August 2002 brought major
      improvements such as MPEG-2 support and more playable chunks from MPEG-1 and
      MPEG-2 splits. A 2004 note describes Debian packager Erik Schanze helping revive
      maintenance after a long quiet period.
  sources:
    - https://formulae.brew.sh/formula/mpgtx
    - https://linux.die.net/man/1/mpgtx
    - https://mpgtx.sourceforge.net/
    - https://packages.debian.org/sid/sound/mpgtx
  summary:
    - >
      mpgtx is Laurent Alacoque's GPL command-line toolbox for manipulating MPEG audio,
      video, and system files. The project homepage presents it in Unix-tool style: a
      program meant to do a small set of MPEG operations from the shell, including
      splitting, joining, demultiplexing, inspecting MPEG streams, and editing ID3 tags
      on MP3 files.
  usage:
    - >
      In practice mpgtx is used less like a media player and more like a
      repair-and-surgery tool for older MPEG assets: split a large MPEG file,
      concatenate streams, demux transport/program streams into elementary audio and
      video files, or batch-edit ID3v1 tags. Its limitation is also part of its
      identity: it is GOP-based, so video cuts happen at group-of-picture boundaries
      rather than exact frames.
related-packages:
  - id: brew:ffmpeg
    reason: >
      Choose FFmpeg when you need broad format support, filtering, transcoding, or
      multiplexing; choose mpgtx for its small, direct toolbox for legacy MPEG
      splitting, joining, inspection, demultiplexing, and ID3 operations.
    rel: alternative
    sources:
      - https://mpgtx.sourceforge.net/
      - https://ffmpeg.org/about.html
      - https://ffmpeg.org/documentation.html
