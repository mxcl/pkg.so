config-file-location:
  unix:
    - ${XDG_CONFIG_HOME:-$HOME/.config}/calc/calcrc
    - ~/.calcrc
credentials-file-location: null
history:
  adoption-history:
    - >
      calc has been packaged broadly across Unix-like systems because it fills the gap
      between simple desk calculators, `bc`, and larger computer algebra systems. The
      repository README gives install examples for yum, pacman, apt, dnf, Termux, and
      source builds, matching its presence in many package managers.
    - >
      Its adoption is strongest among users who want scriptable exact arithmetic without
      pulling in a full CAS. Landon Curt Noll's pages also connect calc scripts to
      large-prime and astronomical interests, a good example of how small Unix math
      tools become personal research infrastructure.
  package-nerd-significance:
    - >
      calc matters to package nerds because it is a preserved lineage of pre-Git,
      pre-GitHub Unix numerics that still receives modern portability work. It is not
      just another calculator: it is a programmable arbitrary-precision environment
      small enough for base developer workflows.
    - >
      It is also a reminder that package ecosystems carry historical software forward.
      The same package is at home in Debian, Fedora, Arch, Homebrew, MacPorts, Nix,
      Termux, and source tarballs, because the CLI contract has stayed useful for
      decades.
  project-history:
    - >
      The official author page says most of calc was written by David I. Bell, with
      source and releases maintained by Landon Curt Noll, and credits Ernest W. Bowen
      plus others for numerical and help-file improvements. It also notes that portions
      derived from earlier public-domain arbitrary-precision routines posted to the net
      around 1984, though little recognizable code remained.
    - >
      The official README presents calc as an interactive calculator that can also
      execute a single command from the shell. It supports huge integer arithmetic,
      exact fractions, complex numbers, transcendental functions, variables, loops, and
      user-defined functions in a C-like language.
    - >
      The current CHANGES file shows active maintenance into the 2020s, including XDG
      Base Directory support and a 2026 2.17.0.0 line that synchronizes changes from the
      newer 3.0 work while keeping a legacy branch for very old systems.
  related-projects:
    - >
      Related tools include `bc`, `dc`, GNU bc, PARI/GP, Python's decimal and fractions
      modules, Maxima, and small Unix math utilities. calc occupies the middle ground:
      scriptable and exact like `bc`, but with a richer C-like language and built-in
      math library.
  sources:
    - http://www.isthe.com/chongo/tech/comp/calc/calc-author.html
    - http://www.isthe.com/chongo/tech/comp/calc/calc-whatis.html
    - http://www.isthe.com/chongo/tech/comp/calc/index.html
    - https://github.com/lcn2/calc/blob/master/CHANGES
    - https://github.com/lcn2/calc/blob/master/README.md
  summary:
    - >
      calc is a long-running arbitrary-precision calculator with an interactive shell, a
      C-like expression language, exact rational arithmetic, complex numbers, and
      programmable functions. Its package history is unusually old-school: a Unix
      mathematical tool maintained through tarballs, mirrors, distro packages, and now
      GitHub releases.
  timeline:
    - >
      1984: Earlier public-domain arbitrary-precision routines were posted to the net,
      later influencing calc's ancestry.
    - >
      1990s-2000s: calc circulated as source, binaries, and mirrored tarballs maintained
      by Landon Curt Noll.
    - >
      2022: Official calc web pages point users to GitHub releases and the GitHub source
      repository.
    - >
      2026: CHANGES documents calc 2.17.0.0 work, including C17 expectations, XDG Base
      Directory support, and a legacy branch for old systems.
  usage:
    - >
      Users run `calc` interactively, pass an expression as a command-line argument, or
      write scripts in calc's C-like language. Typical package-manager usage is
      installing the binary and then relying on it for precise integer, rational,
      modular, complex, and high-precision floating calculations.
    - >
      The tool supports startup configuration through `calcrc` paths, with recent
      release notes documenting XDG Base Directory adoption alongside the older
      `~/.calcrc` convention.
related-packages:
  - id: brew:bc
    reason: >
      Choose GNU bc for the smaller traditional arbitrary-precision calculator language;
      choose calc when complex numbers and a richer C-like programmable environment are
      useful.
    rel: alternative
    sources:
      - https://github.com/lcn2/calc/blob/master/README.md
      - https://www.gnu.org/software/bc/manual/html_mono/bc.html
  - id: brew:pari
    reason: >
      Choose PARI/GP when the primary task is computational number theory or access to a
      broad computer-algebra library, while calc is a lighter general exact-arithmetic
      shell.
    rel: alternative
    sources:
      - https://github.com/lcn2/calc/blob/master/README.md
      - https://pari.math.u-bordeaux.fr/
