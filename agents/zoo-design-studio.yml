credentials-file-location: null
history:
  adoption-history:
    - >
      Zoo released the Modeling App alpha publicly in 2023. The application later became
      Zoo Design Studio and expanded from a code-first demonstration of Zoo's APIs into
      a general CAD product supporting graphical, programmatic, and natural-language
      workflows.
    - >
      The application is available for Linux, macOS, and Windows, as well as in a
      browser. Its plain-text KCL project representation makes ordinary source-control
      practices applicable to CAD work.
  package-nerd-significance:
    - >
      Zoo Design Studio treats editable source code as the canonical representation of
      CAD operations. This makes diffs, revision control, reusable functions, and
      automation first-class parts of a mechanical-design workflow.
    - >
      The application layer is open source even though Zoo's cloud geometry engine is
      proprietary, making the repository useful as both an end-user application and a
      substantial example client for Zoo's APIs and KCL tooling.
  project-history:
    - >
      KittyCAD began developing programmable infrastructure for hardware design before
      building a first-party modeling application on that infrastructure. The public
      Modeling App paired a graphical CAD interface with KCL, ensuring that
      point-and-click operations and hand-written code modified the same model
      representation.
    - >
      KittyCAD adopted the Zoo company brand in December 2023. The Modeling App
      subsequently became Zoo Design Studio, and version 1 launched in May 2025 with
      point-and-click CAD, editable KCL, and integrated parametric Text-to-CAD.
    - >
      In 2026, Zoo added Zookeeper, a conversational CAD agent that can research,
      create, inspect, and revise models inside Design Studio.
  related-projects:
    - >
      KCL is Zoo's open-source programming language and the native project format used
      by Zoo Design Studio.
    - Zoo's Engine API supplies the cloud geometry operations used by the application.
    - Zookeeper is the conversational CAD agent integrated into Zoo Design Studio.
  sources:
    - https://docs.zoo.dev/blog/announcing-zookeeper
    - https://docs.zoo.dev/docs/zoo-design-studio
    - https://github.com/KittyCAD/modeling-app
    - https://zoo.dev/blog/introducing-zoo
    - https://zoo.dev/blog/why-modeling-app
    - https://zoo.dev/blog/zoo-design-studio-v1
  summary:
    - >
      Zoo Design Studio is an open-source, code-backed CAD application from Zoo. It
      combines conventional graphical modeling, KCL programming, and AI-assisted
      modeling over Zoo's cloud geometry engine.
  timeline:
    - '2023-10: Zoo publicly discussed its API-first Modeling App strategy.'
    - '2023-12: KittyCAD adopted Zoo as its umbrella company brand.'
    - '2025-05: Zoo Design Studio version 1 launched.'
    - '2026-02: Zoo announced the integrated Zookeeper conversational CAD agent.'
  usage:
    - >
      Engineers create parts and assemblies through point-and-click tools, KCL source
      code, or natural-language interaction with Zookeeper. Changes remain represented
      as project files that can be inspected and version-controlled.
    - >
      Projects can use Personal Cloud synchronization or local directory libraries.
      Project-scoped preferences are stored in project.toml; the settings documentation
      also identifies a separate user.toml for account-wide preferences but does not
      document its filesystem path.
