history:
  adoption-history:
    - >
      The official site states that more than 800 Mac users have adopted SpaceJump and
      presents testimonials from users organizing multi-monitor, freelance, and
      project-based workflows. This is vendor-reported adoption rather than
      independently audited usage.
    - >
      Distribution through a Homebrew cask complements the direct download and gives
      macOS package users a familiar installation path.
  package-nerd-significance:
    - >
      SpaceJump belongs to the niche ecosystem of macOS utilities that fill
      long-standing gaps in Apple's Spaces and Mission Control interface. It is
      especially interesting alongside tools such as Spaceman and Space Capsule because
      each takes a different approach to identifying and navigating virtual desktops.
    - >
      For automation-minded users, its combination of named workspaces, per-Space
      hotkeys, CSV time export, Apple Shortcuts, shell scripts, and one-click action
      groups turns Spaces into lightweight workflow contexts rather than merely extra
      desktops.
  project-history:
    - >
      SpaceJump was developed as a native Swift utility to supply features absent from
      macOS Spaces, beginning with persistent human-readable names and faster
      navigation. Its feature set expanded to include Mission Control labels, a
      searchable quick switcher, window movement, notes, per-Space hotkeys, automatic
      time tracking, and manual automation groups.
    - >
      The product is distributed as a small commercial macOS application with a trial
      and one-time license. Its official materials emphasize local operation and state
      that personal workspace data remains on the Mac.
  related-projects:
    - >
      Apple Mission Control and Spaces provide the virtual-desktop substrate that
      SpaceJump augments.
    - >
      Spaceman and Space Capsule are related macOS utilities focused on identifying or
      navigating Spaces.
    - Apple Shortcuts can be invoked from SpaceJump automation groups.
  sources:
    - 'Official FAQ: https://www.getspacejump.com/faq'
    - 'Official guides: https://www.getspacejump.com/guides'
    - 'Official product page: https://www.getspacejump.com/'
  summary:
    - >
      SpaceJump is a native macOS utility for naming Spaces, displaying those names in
      the menu bar and Mission Control, switching directly between desktops, tracking
      time by workspace, and attaching notes or automations to a Space.
  timeline:
    - >
      2026: The official site documented a user base of more than 800 Mac users and a
      feature set spanning Space naming, switching, time tracking, notes, and
      automations.
  usage:
    - >
      Users assign names, icons, and colors to macOS Spaces, then use the menu-bar
      indicator or searchable Quick Switcher to identify and enter a workspace.
    - >
      Freelancers and project-based users can organize one Space per client or project,
      record active time automatically, exclude idle periods, and export time logs as
      CSV.
    - >
      Automation groups can launch applications, open folders, invoke Apple Shortcuts,
      or run shell scripts on demand. Accessibility permission is required for Space
      detection and keyboard shortcuts.
