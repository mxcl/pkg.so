history:
  adoption-history:
    - >
      Softorino describes the macOS product as part of a Folder Colorizer franchise that
      began on Windows and reached millions of users.
  package-nerd-significance:
    - >
      It packages a focused Finder-customization utility that changes the folder icon
      itself, allowing the appearance to travel with the folder to another Mac or
      external drive.
  project-history:
    - >
      Softorino says its Folder Colorizer franchise has operated for roughly a decade.
      Its official blog identifies 2022 as the arrival of Folder Colorizer for Mac.
  related-projects:
    - Folder Colorizer 2 for Windows is the related Windows edition recommended by Softorino.
  sources:
    - 'Official Softorino blog: https://softorino.com/blog/folder-colorizer-mac'
    - 'Official product page: https://softorino.com/folder-colorizer-mac'
  summary:
    - >
      Folder Colorizer is a proprietary macOS utility from Softorino for replacing
      standard folder icons with colors, emojis, decals, or images.
  timeline:
    - >
      2022: Softorino identifies Folder Colorizer for Mac as already providing advanced
      folder customization.
    - >
      2025: Softorino contrasted the application with the more limited
      folder-customization features introduced in macOS.
  usage:
    - >
      Users drag folders into the application, choose a color, image, emoji, or decal,
      and apply the new appearance. It supports batch changes, iCloud folders, local
      image storage, change history, and restoration of the original icon.
