id: cask:chronycontrol
display-name: ChronyControl
repo: null
docs:
  - https://chrony-project.org/documentation.html
  - https://www.whatroute.net/chronycontrol.html
config-file-location:
  macos:
    - /etc/chrony.d/chrony.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      ChronyControl made chronyd more approachable on macOS by bundling the daemon and
      command-line client, installing the required launchd services, and exposing
      monitoring and privileged configuration through a native application.
    - >
      Successive releases tracked upstream chrony versions and macOS toolchain changes,
      including Swift transitions, notarization, Apple Silicon universal binaries,
      Network Time Security, and newer macOS releases.
  package-nerd-significance:
    - >
      The package is a macOS integration layer around a traditionally Unix-oriented
      timekeeping daemon. It is notable for translating daemon installation, launchd
      management, privileged configuration, logging, and chronyc monitoring into a
      desktop utility while retaining normal command-line access.
  project-history:
    - >
      Bryan Christianson created ChronyControl as a straightforward way to install,
      configure, and monitor chronyd on macOS, where the built-in ntpd could synchronize
      slowly on intermittently connected machines.
    - >
      The initial release bundled an August 2015 chrony snapshot. Later releases
      regularly refreshed the embedded chrony toolchain and added configuration editing,
      graphs, log management, NTS support, Apple Silicon support, wake-from-sleep
      resynchronization, and modern macOS service integration.
  related-projects:
    - chrony supplies the bundled chronyd daemon and chronyc command-line client.
    - >
      macOS ntpd is the built-in time service that ChronyControl disables when
      installing chronyd.
    - GPSDConfig can integrate GPS reference-clock information with ChronyControl.
  sources:
    - 'Official product and release history: https://www.whatroute.net/chronycontrol.html'
    - 'Official upstream chrony site: https://chrony-project.org/'
  summary:
    - >
      ChronyControl is a macOS graphical installer, configurator, and monitor for the
      chrony time-synchronization suite.
  timeline:
    - '2015-08-19: ChronyControl 1.0.0 was released with an embedded chrony snapshot'
    - >
      2016-02-11: Version 1.1.0 added configurable file locations and an embedded
      configuration editor
    - '2020-10-08: Version 1.4.0 adopted chrony 4.0 and Network Time Security support'
    - '2021-05-14: Version 1.4.2 shipped as a universal Intel and Apple Silicon application'
    - '2024-09-03: Version 1.5.0 updated the embedded suite to chrony 4.6'
    - '2024-10-09: Version 1.5.1 updated to chrony 4.6.1 and macOS Sequoia tooling'
  usage:
    - >
      Users authenticate through the application's padlock before performing privileged
      operations. ChronyControl can install, start, stop, and remove chronyd; edit and
      install its plain-text configuration; run chronyc monitoring commands; and graph
      tracking logs.
    - >
      The installed command-line programs remain usable in the normal Unix manner.
      ChronyControl installs chronyd under /usr/local/sbin, chronyc under
      /usr/local/bin, and the configuration under /etc/chrony.d.
