config-file-location:
  macos:
    - /Users/{username}/Library/Application Support/iMazing
  windows:
    - C:\Users\{username}\AppData\Roaming\iMazing
credentials-file-location:
  macos:
    - macOS Keychain
  windows:
    - Windows Credential Manager
    - Windows Certificate Store
    - Windows CNG Key Storage Provider
history:
  adoption-history:
    - >
      DigiDNA states that DiskAid quickly gained millions of users and that iMazing has
      been downloaded by millions. Its enterprise documentation reports deployment
      across businesses, banks, government institutions, educational institutions, and
      nonprofits.
    - >
      The enterprise product line added Configurator and a contract-only CLI for
      provisioning and automated data-capture workflows. The macOS desktop application
      is also distributed through the Homebrew Cask recorded in
      source_facts.package-manager.
  package-nerd-significance:
    - >
      iMazing is a long-lived third-party layer over Apple's mobile-device protocols,
      offering inspectable local backups, selective data extraction, configurable
      storage, snapshot retention, and automation beyond the standard Finder, Apple
      Devices, or former iTunes interfaces.
    - >
      For administrators, its documented application-support directories,
      credential-store behavior, deployment packages, CLI, and Configurator workflows
      make it relevant to reproducible fleet management as well as personal device
      maintenance.
  project-history:
    - >
      Geneva-based DigiDNA was incorporated in 2008 and launched DiskAid that year as a
      tool for transferring files between an iPhone and a computer. As the software
      expanded into broader iOS backup and management work, DigiDNA renamed it iMazing
      in 2014.
    - >
      iMazing 1.0 was released on September 18, 2014 alongside iOS 8 support, adding
      two-way music management, backup archiving, selective restore, and device cloning.
      iMazing 3 followed in April 2024 with a redesigned and re-engineered interface
      intended to support further growth as a device-management platform.
  related-projects:
    - DiskAid is iMazing's original name and direct predecessor.
    - iMazing Mini performs scheduled background backups.
    - iMazing Configurator provides local supervision and provisioning workflows.
    - >
      iMazing Profile Editor, iMazing CLI, and iMazing Converter are related tools in
      DigiDNA's product family.
  sources:
    - https://imazing.com/about
    - https://imazing.com/blog/imazing-1-0-released
    - >
      https://imazing.com/documentation/iMazing-in-Enterprise-and-Institutional-Environments.pdf
    - https://imazing.com/media
    - https://imazing.com/support
    - source_facts.package-manager
  summary:
    - >
      iMazing is DigiDNA's local management application for iPhone, iPad, and related
      Apple-device data on macOS and Windows. It supports backups and snapshots, data
      browsing and export, media and app transfer, device configuration, supervision,
      and enterprise provisioning without requiring users to place device contents in
      iCloud.
  timeline:
    - '2008: DigiDNA launches the iPhone file-transfer utility DiskAid.'
    - '2014: DiskAid is renamed iMazing; iMazing 1.0 ships on September 18.'
    - '2024: iMazing 3 launches with a redesigned and re-engineered interface.'
  usage:
    - >
      Consumers commonly use iMazing to create encrypted local backups, browse backup
      contents, transfer photos, music, messages and files, migrate data, and select
      local, external, or network backup locations.
    - >
      Administrators use Configurator, blueprints, profiles, supervision, and the CLI
      for repeatable device provisioning and data workflows. Sensitive passwords and
      keys are kept in the operating system's credential facilities rather than ordinary
      files.
