config-file-location:
  linux:
    - ~/.minetest/minetest.conf
  macos:
    - ~/Library/Application Support/minetest/minetest.conf
  windows:
    - '%APPDATA%\Minetest\minetest.conf'
credentials-file-location: null
history:
  adoption-history:
    - >
      Luanti developed an ecosystem of games, mods, texture packs, and multiplayer
      servers. Its availability across desktop and mobile platforms and through
      operating-system package managers helped make it a widely distributed
      free-software voxel engine.
    - >
      ContentDB serves as the project's official distribution and discovery service for
      community games, mods, and texture packs.
  package-nerd-significance:
    - >
      Luanti is a long-lived, cross-platform free-software game engine with a
      Lua-extensible content ecosystem. It is packaged by numerous operating-system
      distributions and supports both graphical clients and headless servers.
    - >
      The 2024 rename is especially relevant to package maintainers because
      compatibility names remain visible in paths, configuration filenames, environment
      variables, and related packages. The primary configuration file is still named
      `minetest.conf`.
  project-history:
    - >
      Perttu Ahola, known as celeron55, began the project in 2010 under the name
      Minetest. It evolved from a voxel game into an engine and platform for
      independently developed games and mods.
    - >
      On October 13, 2024, the project was renamed Luanti. The name combines a reference
      to the Finnish word `luonti`, meaning creation, with Lua, the language used for
      games and mods.
  related-projects:
    - ContentDB is the official content service for Luanti games, mods, and texture packs.
    - >
      Minetest Game is a separately maintained base game that was historically closely
      associated with the engine.
  sources:
    - 'Official organization repositories: https://github.com/luanti-org'
    - 'Official project background: https://docs.luanti.org/about/luanti/'
    - 'Official repository README: https://github.com/luanti-org/luanti/blob/master/README.md'
    - 'Official website: https://www.luanti.org/'
  summary:
    - >
      Luanti, formerly Minetest, is a free and open-source voxel game engine and content
      platform designed for Lua-based game creation and modding.
  timeline:
    - '2010: Perttu Ahola began the project that became Minetest.'
    - '2024: Minetest was renamed Luanti.'
    - '2024 onward: Historical `minetest` filenames and paths were retained for compatibility.'
  usage:
    - >
      Players install games and other content, create local worlds, or connect to
      multiplayer servers. Creators use the Lua API to develop games and mods and can
      distribute them through ContentDB.
    - >
      Server operators can run the headless server, choose storage backends, install
      content, and manage global and per-world settings.
