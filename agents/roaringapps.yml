history:
  adoption-history:
    - >
      The desktop application connects locally installed software with RoaringApps'
      crowd-sourced compatibility database. Signed-in users can upload an installed-app
      list, maintain favorites, and contribute compatibility reports for the wider
      community.
  package-nerd-significance:
    - >
      RoaringApps is useful around operating-system and processor transitions, when
      package users need to know whether their installed applications will launch, run
      natively, require translation, or have known problems before an upgrade.
  project-history:
    - >
      RoaringApps for Mac began as a beta compatibility scanner and evolved through
      local application matching, account integration, direct compatibility reporting,
      support for successive macOS releases, and architecture-transition data. Version 2
      was rewritten from the ground up in native Swift.
  related-projects:
    - >
      The desktop client is a companion to the RoaringApps website and its crowd-sourced
      compatibility database for macOS, iOS, and Windows applications.
  sources:
    - https://roaringapps.com/apps
    - https://roaringapps.com/help/contribute-to-roaringapps
    - https://roaringapps.com/help/mac-app
    - https://roaringapps.com/mac-app
  summary:
    - >
      RoaringApps for Mac scans installed applications and shows crowd-sourced macOS
      compatibility information from the RoaringApps database.
  timeline:
    - 'Initial beta: Version 0.6.2 was the first beta release.'
    - '2016: Version 0.8.2 was described as a refactored initial beta.'
    - 'Version 1.0.0: Application matching moved on-device.'
    - 'Version 2.0.0: The client received a ground-up native Swift rewrite.'
  usage:
    - >
      Users point the application at one or more application directories, scan installed
      software, review compatibility status, and optionally sign in to synchronize their
      installed list, favorites, and compatibility reports.
