history:
  adoption-history:
    - >
      PlistEdit Pro has been maintained across successive Mac OS X and macOS generations
      since at least 2004. Its release history tracks transitions including Universal
      binaries, 64-bit operation, Gatekeeper signing, notarization, Apple Silicon,
      sandboxed preferences, and newer macOS permission behavior.
    - >
      The application occupies a specialist role among Mac and iOS developers and
      administrators who need a richer interface than a text editor or command-line
      plist utilities.
  package-nerd-significance:
    - >
      Property lists underpin macOS application preferences, bundles, launch services,
      and development metadata. PlistEdit Pro gives package maintainers and developers
      structural editing, format-aware display, multi-file search, and access to binary
      plists without manual XML conversion.
    - >
      The bundled pledit command-line tool and AppleScript support bridge interactive
      inspection and automation, while the preferences browser exposes a
      package-nerd-friendly view of settings distributed across the system.
  project-history:
    - >
      Fat Cat Software has shipped PlistEdit Pro since the early Mac OS X era. The
      application grew from a property-list editor into a broader toolkit with
      favorites, property-list browsers, structure definitions, external-editor
      integration, scripting, and command-line support.
    - >
      JSON reading, writing, and conversion arrived in 2011. Later releases adapted the
      long-lived codebase to modern macOS security, interface, processor, and
      application-sandbox conventions.
  related-projects:
    - >
      Apple's property-list formats and Core Foundation preferences are the principal
      data formats and APIs PlistEdit Pro works with.
    - >
      Xcode is a common neighboring development tool; PlistEdit Pro historically
      supported use as an external editor and understands structure definitions used for
      developer metadata.
    - >
      The pledit command-line tool accompanies the graphical application for opening and
      piping property-list content.
  sources:
    - https://www.fatcatsoftware.com/plisteditpro/
    - https://www.fatcatsoftware.com/plisteditpro/Docs/index.html
    - https://www.fatcatsoftware.com/plisteditpro/Docs/releasenotes.html
  summary:
    - >
      PlistEdit Pro is a commercial macOS editor for Apple property lists and JSON. It
      combines structural and raw-text editing with search, format conversion,
      preference browsing, structure definitions, AppleScript, and a command-line
      helper.
  timeline:
    - '2004: The official release history records the early 1.0.1 and 1.1 releases.'
    - '2006: A Universal binary and the pledit command-line tool were added.'
    - >
      2008: Saved property-list browser configurations and broader privileged-file
      editing arrived.
    - '2011: JSON reading, writing, and plist conversion were added.'
    - '2022: PlistEdit Pro added native Apple Silicon support.'
    - >
      2023: The application added handling for macOS Sonoma permission prompts around
      sandboxed preference files.
  usage:
    - >
      Developers open plist or JSON files to edit nested dictionaries, arrays, keys, and
      typed values through an outline or raw-text view. Structure definitions can
      provide known keys, display formats, and allowable values.
    - >
      Power users can browse or search folders of preference files, perform conversions,
      automate operations through AppleScript, or pass plist content to the pledit
      command-line helper.
