history:
  adoption-history:
    - >
      Sizzy evolved from an open-source responsive-design project into a commercially
      maintained development browser. The official product material says it has been
      actively maintained since 2018 and is available for macOS, Windows, and Linux.
    - >
      Its workflow expanded beyond viewport previews to persistent project workspaces,
      isolated login sessions, unified debugging, screenshots, terminals, and
      coding-agent integration.
  package-nerd-significance:
    - >
      Sizzy represents the specialized developer-browser category: it packages Chromium
      with multi-viewport QA and project tooling instead of treating responsive testing
      as a temporary DevTools mode. Its transition from open source to a paid product is
      also a familiar independent-developer sustainability story.
  project-history:
    - >
      Sizzy began as a tool focused on viewing responsive designs across multiple
      simulated devices. Its maker later developed it into a paid, full-time-maintained
      browser for web development.
    - >
      The modern product combines Chromium rendering with synchronized devices, isolated
      sessions, debugging tools, API and storage inspection, capture tools, local
      processes, terminals, and coding agents.
  related-projects:
    - >
      Comparable responsive-development tools include Polypane and the open-source
      Responsively App. Chrome DevTools device mode provides a narrower, single-viewport
      alternative.
  sources:
    - https://docs.sizzy.co/
    - https://sizzy.co/
    - https://sizzy.co/blog/browser-for-web-developers
    - https://www.kitze.io/talks/gh-stars
  summary:
    - >
      Sizzy is a Chromium-based desktop browser designed for web developers. It keeps
      projects, responsive device previews, login sessions, debugging tools, captures,
      terminals, and coding agents in one workspace.
  timeline:
    - >
      2018: Sizzy was under active maintenance by this year, according to its official
      product history.
    - >
      Later: The project moved from an open-source responsive tool to a paid development
      browser.
    - >
      2026: Official product material presented terminals and coding-agent sessions as
      part of the integrated workflow.
  usage:
    - >
      Developers open a local or remote web project, arrange several device-sized
      viewports, and synchronize navigation, scrolling, clicks, and typing across them.
      Separate sessions can test authenticated roles side by side, while the debugging
      panel aggregates consoles, DevTools, storage, API inspection, screenshots, and
      project processes.
