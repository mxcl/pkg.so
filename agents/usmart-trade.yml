history:
  adoption-history:
    - >
      uSMART expanded from its Hong Kong origins into a multi-market brokerage group
      with operations in Singapore and the United States. Its official history records a
      Singapore capital-markets-services license in 2021, a regional app rollout soon
      afterward, and a registered US broker-dealer milestone in 2025.
    - >
      The platform broadened access across desktop, mobile, and browser-based editions
      while adding research, education, algorithmic orders, fractional-share trading,
      options, and multiple regional markets.
  package-nerd-significance:
    - >
      uSMART Trade illustrates how Homebrew Cask can manage installation of a regulated,
      account-centric financial application even though identity verification,
      portfolios, market data, and trading authority remain in the broker's hosted
      systems.
  project-history:
    - >
      uSMART Group was founded in December 2018 as a technology-driven brokerage
      business headquartered across Hong Kong and Singapore. Its official material
      emphasizes investment in product development and the use of software, data, and
      quantitative tools to support trading and research.
    - >
      The group subsequently established regulated entities in Hong Kong and Singapore
      and extended its geographic reach. The desktop uSMART application complements the
      group's mobile and lightweight web clients.
  related-projects:
    - uSMART mobile app
    - uSMART PC Express
    - uSMART Securities Hong Kong
    - uSMART Securities Singapore
    - uSMART Capital
  sources:
    - https://hk.usmartglobal.com/en/download
    - https://sg.usmartglobal.com/about
    - https://www.usmartglobal.com/
    - https://www.usmartglobal.com/about
    - source_facts.package-manager
  summary:
    - >
      uSMART Trade is a desktop client for uSMART's regulated brokerage platform,
      providing market information, research tools, and trading access for products
      including stocks and options.
  timeline:
    - '2018: uSMART Group was founded.'
    - >
      2019: The uSMART app received an innovation award cited in the company's official
      history.
    - '2021: uSMART Singapore received a capital-markets-services license.'
    - >
      2022: The company rolled out the uSMART app for its Singapore market soon after
      licensing.
    - '2025: uSMART Capital became a US registered broker-dealer and FINRA member.'
  usage:
    - >
      Eligible clients register and complete the broker's account-opening requirements,
      sign in to the application, review quotes and research, fund an account, and place
      or manage orders for supported markets and products. Available instruments and
      features depend on the user's region and regulated entity.
