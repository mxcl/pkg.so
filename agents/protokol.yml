history:
  adoption-history:
    - >
      Hexler originally used Protokol internally, then prepared a public release after
      finding it useful in home-studio troubleshooting and receiving requests from other
      users. It is distributed for desktop, mobile, and Raspberry Pi-class systems.
  package-nerd-significance:
    - >
      Protokol is a compact diagnostic tool for inspecting MIDI and OSC traffic without
      launching a full digital audio workstation or control-surface editor. Its
      availability across macOS, Windows, Linux, ARM, iOS, and Android makes it useful
      in heterogeneous music and interactive-media setups.
  project-history:
    - >
      Hexler created Protokol as a minimal internal development tool for checking
      whether software and hardware control signals reached a computer. Studio use
      exposed additional value in diagnosing stray MIDI clock traffic, malfunctioning
      knobs and faders, synchronization timing, and OSC mappings, prompting Hexler to
      turn it into a public application.
  related-projects:
    - TouchOSC
    - MIDI
    - Open Sound Control
    - Art-Net
  sources:
    - 'Official manual introduction: https://hexler.net/protokol/manual/introduction'
    - 'Official product page: https://hexler.net/protokol'
  summary:
    - >
      Protokol is Hexler's lightweight, cross-platform monitor and logger for
      control-protocol message streams, including MIDI, OSC, Art-Net, and
      game-controller input.
  timeline:
    - 'Undated: Began as an internal Hexler development utility'
    - >
      Undated: Expanded into a public cross-platform application after studio use and
      user requests
  usage:
    - >
      Users select a MIDI, OSC, or game-controller source and inspect its messages in a
      real-time list. Messages can be filtered, timestamped, copied, or saved, making
      the app suitable for connection checks, hardware diagnosis, synchronization tests,
      and OSC mapping discovery.
