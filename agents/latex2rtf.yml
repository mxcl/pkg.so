id: brew:latex2rtf
display-name: LaTeX2RTF
repo: https://github.com/latex2rtf/latex2rtf
docs:
  - https://latex2rtf.sourceforge.net/docs.html
  - https://latex2rtf.sourceforge.net/usage.html
config-file-location:
  unix:
    - $RTFPATH/*.cfg
    - cfg/*.cfg
credentials-file-location: null
history:
  adoption-history:
    - >
      LaTeX2RTF spread because it solved a social document-exchange problem: LaTeX
      authors often needed to share drafts with collaborators, editors, or institutions
      using Word. The SourceForge homepage frames conversion to RTF as a way to get
      LaTeX content into Word .doc or .docx workflows.
    - >
      The tool is distributed through CTAN and Unix package managers including Homebrew,
      Debian, Fedora, MacPorts, Ubuntu, and openSUSE, which reflects its role as a
      practical bridge rather than a full-fidelity typesetting replacement.
  package-nerd-significance:
    - >
      LaTeX2RTF is package-nerd significant because it packages interoperability pain.
      It is not glamorous, but it survives because file-format boundaries between TeX
      and Word workflows are still operationally important.
    - >
      Its history also shows an old-school maintenance chain: university course code,
      individual maintainers, SourceForge coordination, CTAN distribution, and a later
      GitHub home.
  project-history:
    - >
      The official manual records the first version of LaTeX2RTF in 1994, written by
      Fernando Dorner and Andreas Granzer at the Vienna University under Ralf
      Schlatterbeck's supervision as a one-semester course project. A second course
      effort in 1995 by Friedrich Polzer and Gerhard Trisko produced version 1.5, and
      Schlatterbeck maintained and extended the program until 1998.
    - >
      In 1998 Georg Lehner found the project via Wilfried Hennings' TeX Conversion
      Webpage, added functionality, and took over maintenance. The manual states that
      the last release by Georg was 1.8aa, that Scott Prahl did much of the post-1.8aa
      development, and that Wilfried Hennings coordinated development on SourceForge.
    - >
      A GitHub repository under the latex2rtf organization was created on 2024-07-24,
      while the README still points bug reports to GitHub and the historical project
      site remains on SourceForge.
  related-projects:
    - >
      Related projects include CTAN, TeX Live, Microsoft RTF and Word, LaTeX2HTML,
      Pandoc, tex4ht, and other TeX conversion tools that trade perfect typesetting for
      document interchange.
  sources:
    - https://api.github.com/repos/latex2rtf/latex2rtf
    - https://ctan.org/tex-archive/support/latex2rtf?lang=en
    - https://latex2rtf.sourceforge.net/
    - https://latex2rtf.sourceforge.net/latex2rtf_1_9_17.html
    - https://raw.githubusercontent.com/latex2rtf/latex2rtf/master/README
  summary:
    - >
      LaTeX2RTF translates LaTeX documents to Rich Text Format so they can be opened and
      edited in word processors, especially Microsoft Word. Its documentation is
      unusually candid that LaTeX and RTF have different document models, so conversion
      is useful but imperfect.
  timeline:
    - >
      1994: Version 1.0 written by Fernando Dorner and Andreas Granzer under Ralf
      Schlatterbeck's supervision.
    - '1995: Version 1.5 produced by Friedrich Polzer and Gerhard Trisko.'
    - >
      1998: Georg Lehner took over maintenance after finding the project through the TeX
      Conversion Webpage.
    - '1999-2007: Manual copyright updates list Wilfried Hennings and Scott Prahl.'
    - '2024-07-24: GitHub repository created.'
  usage:
    - >
      Users run `latex2rtf` on a LaTeX file to produce an RTF document, with `latex2png`
      available for image-related conversion workflows. Configuration is driven by
      `.cfg` files in configured paths, and the manual documents limitations around
      equations, tables, graphics, bibliographies, language support, and page
      formatting.
related-packages:
  - id: brew:pandoc
    reason: >
      Choose Pandoc when the real goal is an editable DOCX file or a multi-format
      publishing pipeline; choose LaTeX2RTF when direct RTF output and its established
      configuration files are specifically required.
    rel: alternative
    sources:
      - https://latex2rtf.sourceforge.net/
      - https://pandoc.org/MANUAL.html
