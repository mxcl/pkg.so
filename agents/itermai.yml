config-file-location: null
credentials-file-location:
  macos:
    - macOS Keychain
history:
  adoption-history:
    - >
      The plug-in is installed separately from iTerm2 and is discovered automatically
      when placed in /Applications. AI use additionally requires explicit enablement and
      provider configuration in iTerm2.
    - >
      AI Chat became a major iTerm2 feature in the 3.6 release line, extending earlier
      prompt and output-explanation features with linked sessions, permissions, multiple
      providers, and optional terminal actions.
  package-nerd-significance:
    - >
      The separate package is an unusual capability boundary: installing the terminal
      emulator alone does not include the code that performs AI-provider network
      requests. Administrators can therefore block the plug-in bundle, while package
      users can opt into the network-capable component independently.
  project-history:
    - >
      iTerm2 originally exposed generative-AI features inside the terminal application.
      In the 3.5.1 release, provider-communication code was moved into this separately
      installed plug-in as a safety and administrative-control measure.
    - >
      The component is developed in the main iTerm2 source repository under the iTermAI
      directory. Later iTerm2 releases expanded the user-facing feature into AI Chat
      with per-session permissions, provider selection, orchestration, and
      terminal-aware explanations.
  related-projects:
    - >
      iTerm2 is the required host terminal emulator and contains the user interface and
      settings.
    - >
      The plug-in supports configured hosted or local language-model providers; official
      documentation describes OpenAI-compatible providers among the available choices.
  sources:
    - 'Official AI Chat documentation: https://iterm2.com/documentation-ai-chat.html'
    - 'Official iTerm2 release notes: https://iterm2.com/downloads.html'
    - 'Official plug-in page: https://iterm2.com/ai-plugin.html'
    - 'Official source directory: https://github.com/gnachman/iTerm2/tree/master/iTermAI'
  summary:
    - >
      iTerm2 AI Plugin is the optional network-capable component that enables iTerm2's
      generative-AI and AI Chat features. Its separation from the host application
      creates an explicit installation and policy boundary around sending
      terminal-related information to model providers.
  timeline:
    - >
      2024: iTerm2 3.5.1 moved AI-provider communication into the separately installed
      plug-in and added administrative controls.
    - '2025: The iTerm2 3.6 release line introduced the expanded AI Chat experience.'
  usage:
    - >
      Install the application bundle in /Applications; iTerm2 locates it automatically.
      Users then configure an AI provider and model under iTerm2's AI settings.
    - >
      Chats may be unlinked, linked to a terminal or browser session, or used for
      orchestration. Permissions separately govern reading terminal state and contents,
      running commands, controlling sessions, and writing to the clipboard or
      filesystem.
