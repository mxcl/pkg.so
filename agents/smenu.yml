credentials-file-location: null
history:
  adoption-history:
    - >
      The README notes that some Linux distributions already package smenu and that it
      can be built on Unix-like systems with a functional terminfo development platform.
      The supplied package metadata records Homebrew, Alpine, Debian, Ubuntu, Nix, and
      openSUSE package names.
  package-nerd-significance:
    - >
      Package maintainers care because smenu depends on terminal capabilities, terminfo,
      UTF-8 behavior, and interactive shell ergonomics. It is a compact example of
      packaging a C-based CLI that must behave correctly across many terminals.
  project-history:
    - >
      The official repository describes smenu as starting as a lightweight and flexible
      terminal menu generator before evolving into a versatile CLI selection tool for
      interactive or scripting use. Its README compares it to `sed`, but for selection
      rather than editing.
  related-projects:
    - >
      The README frames smenu by analogy to classic Unix filters such as `sed`; it also
      depends on terminal capabilities from the terminfo ecosystem.
  sources:
    - 'GitHub releases API for p-gen/smenu: earliest listed release v0.9.11 on 2018-01-26.'
    - >
      https://github.com/p-gen/smenu README: origin statement, selection-filter
      description, terminal and UTF-8 behavior, build/install notes, examples.
    - 'https://github.com/p-gen/smenu/blob/master/smenu.1: official manpage documentation.'
    - >
      input source_facts.package-manager: Homebrew, Alpine, Debian, Ubuntu, Nix, and
      zypper package names.
  summary:
    - >
      smenu is a terminal selection filter: it reads words from standard input or a
      file, displays them as an interactive terminal menu, and writes the selected value
      back to the shell pipeline. It is a package-nerd tool because it turns ordinary
      POSIX pipelines into small interactive workflows without requiring a full TUI
      framework.
  timeline:
    - '2018: Earliest GitHub release returned by the releases API was v0.9.11.'
    - '2020s: README documents distribution packaging and builds on Unix-like systems.'
    - >
      2020s: Repository presents smenu as a mature selection filter with manpage and
      wiki documentation.
  usage:
    - >
      A common pattern is command substitution: pipe text into `smenu`, let the user
      choose with keyboard or mouse in a scrolling terminal window, and store the result
      in a shell variable. The README examples select fields from `/proc` and
      `/etc/passwd` output.
