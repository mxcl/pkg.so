id: cask:museeks
display-name: Museeks
repo: null
docs:
  - https://github.com/martpie/museeks#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/museeks
    - ~/.config/museeks
  macos:
    - ~/Library/Application Support/museeks
  windows:
    - '%AppData%\museeks'
credentials-file-location: null
history:
  adoption-history:
    - >
      Museeks distributes desktop builds for Linux, macOS, and Windows. Its maintainers
      explicitly describe publication through package managers such as Homebrew and the
      AUR as community-maintained, an important distinction for users comparing upstream
      releases with repository packages.
  package-nerd-significance:
    - >
      Museeks appeals to users who want a focused local-library player without the
      feature density of larger media suites. It is also a useful example of a
      cross-platform desktop application that moved to a Tauri and Rust backend while
      retaining a web-technology interface.
  project-history:
    - >
      Museeks was created as a clean, deliberately simple cross-platform music player
      rather than a competitor to feature-heavy media managers. The project has evolved
      through multiple desktop technology generations and now documents a Tauri v2 and
      Rust backend with a React interface.
  related-projects:
    - >
      Museeks occupies the same local-library music-player space as other lightweight
      desktop players, but its official scope emphasizes simplicity, playlists, queue
      management, and broad common-format support.
  sources:
    - https://github.com/martpie/museeks
    - https://github.com/martpie/museeks/releases
    - https://museeks.io/
    - 'input: source_facts.package-manager.brew-cask'
  summary:
    - >
      Museeks is an open-source desktop music player for Linux, macOS, and Windows. It
      focuses on local audio libraries, playlists, queues, cover art, playback controls,
      and M3U import and export.
  timeline:
    - >
      The project established a cross-platform desktop player centered on a minimal
      local-library experience.
    - >
      Later development adopted a Tauri v2 and Rust backend while preserving the
      React-based interface.
  usage:
    - >
      Users add local music to a library, organize playlists and queues, and play common
      formats including MP3, AAC, FLAC, WAV, Ogg, and 3GPP. For troubleshooting, the
      application exposes its storage directory from Settings; removing that directory
      resets local state.
tags:
  - cross-platform
  - local-library
  - music-player
  - playlists
  - rust
  - tauri
