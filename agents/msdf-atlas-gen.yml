config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is packaged by Homebrew as a standalone CLI, which makes a
      graphics-programming font-atlas generator available through normal developer
      package-manager workflows.
    - >
      Its README explicitly ties font atlases to real-time rendering contexts such as
      video games, so adoption centers on rendering engines, game tooling, and UI
      systems that need scalable text assets.
  package-nerd-significance:
    - >
      For package users, msdf-atlas-gen is notable because it wraps specialized
      real-time text-rendering algorithms in a normal Unix-style executable.
    - >
      It also exposes a compact dependency story familiar to C++ packaging: upstream
      MSDFgen, CMake, vcpkg, and release tarballs that package managers can build
      reproducibly.
  project-history:
    - >
      The official README presents the project as a utility built around MSDFgen. It
      loads glyphs from TTF or OTF fonts, generates distance fields, packs them into
      atlas bitmaps, and can export image, CSV, JSON, or Artery Font outputs.
    - >
      The changelog records version 1.0 as the initial release on 2020-03-08, followed
      by releases that updated MSDFgen, added CMake support, added multiple-font and
      variable-font features, and moved the build toward CMake plus vcpkg.
  related-projects:
    - MSDFgen is the core related generator technology.
    - >
      Artery Font format, vcpkg, Conan, CMake, FreeType, and real-time rendering engines
      are adjacent pieces named or implied by the official README and changelog.
  sources:
    - https://formulae.brew.sh/formula/msdf-atlas-gen
    - https://github.com/Chlumsky/msdf-atlas-gen#readme
    - https://github.com/Chlumsky/msdf-atlas-gen/blob/master/CHANGELOG.md
    - source_facts.repo
  summary:
    - >
      msdf-atlas-gen is a C++ utility and library for generating compact font atlases
      using multi-channel signed distance fields.
  timeline:
    - '2020: Version 1.0 initial release.'
    - >
      2021: Version 1.2 added multiple fonts or font sizes in one atlas and y-origin
      selection.
    - '2021: Version 1.2.2 added CMake and Conan package-manager support.'
    - >
      2024: Version 1.3 switched primary dependency management to vcpkg and overhauled
      CMake configuration.
  usage:
    - >
      Command-line use starts with a required font input, optional character or glyph
      sets, atlas type selection such as MSDF or MTSDF, output options such as image,
      JSON, CSV, or Artery Font, and generator controls for ranges, padding, threading,
      and coordinate origin.
    - >
      The project can also be used as a library; the README includes C++ examples for
      generating a whole atlas and for dynamic atlas growth.
related-packages:
  - id: brew:msdfgen
    reason: >
      Use msdfgen for individual vector shapes or glyph distance fields; use it
      alongside msdf-atlas-gen when a rendering workflow needs those fields packed into
      a complete font atlas.
    rel: adjacent_workflow
    sources:
      - https://github.com/Chlumsky/msdf-atlas-gen#readme
      - https://github.com/Chlumsky/msdfgen#readme
