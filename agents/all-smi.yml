id: brew:all-smi
display-name: all-smi
repo: null
docs:
  - https://github.com/lablup/all-smi#readme
config-file-location:
  linux:
    - $XDG_CONFIG_HOME/all-smi/config.toml
    - ~/.config/all-smi/config.toml
    - /etc/all-smi/config.toml
  macos:
    - ~/Library/Application Support/all-smi/config.toml
    - ~/.config/all-smi/config.toml
    - /Library/Application Support/all-smi/config.toml
  windows:
    - '%APPDATA%\all-smi\config.toml'
    - '%PROGRAMDATA%\all-smi\config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as a Homebrew formula, while its official releases also
      provide platform-specific artifacts. Its scope has expanded beyond a single vendor
      utility to cover NVIDIA, AMD, Intel, Apple Silicon, Jetson, Tenstorrent, and other
      accelerator environments.
  package-nerd-significance:
    - >
      all-smi gives operators a single package and command surface for heterogeneous GPU
      fleets, reducing dependence on separate vendor-specific SMI tools. Its TUI,
      snapshots, recording, remote views, Prometheus endpoint, and service support make
      it useful both interactively and in lightweight monitoring deployments.
  project-history:
    - >
      all-smi was developed by Lablup as a Rust-based, cross-platform GPU monitoring
      utility. The release history records continued expansion into remote monitoring,
      service operation, native Windows telemetry, Intel Level Zero support, and
      runtime-loaded AMD support.
  related-projects:
    - >
      Vendor tools and APIs integrated or complemented by all-smi include
      nvidia-smi/NVML, AMD telemetry interfaces, Intel Level Zero, Apple Silicon
      monitoring, and accelerator-specific utilities.
  sources:
    - https://github.com/lablup/all-smi#readme
    - https://github.com/lablup/all-smi/releases
  summary:
    - >
      all-smi is a unified command-line GPU and accelerator monitoring tool. It provides
      local and remote terminal views, machine-readable snapshots, recording, an API
      with Prometheus metrics, and cross-platform service integration.
  timeline:
    - >
      v0.26.0: Added supervised service support on Linux, macOS, and Windows, plus
      expanded Windows and Intel GPU telemetry.
    - 'v0.26.2: Moved Linux AMD monitoring into a versioned runtime-loaded companion library.'
  usage:
    - >
      Run `all-smi local` for local monitoring, `all-smi view` for remote endpoints, or
      `all-smi api` to expose metrics. Persistent settings are optional and may be
      supplied through the documented TOML file, environment variables, or command-line
      flags.
