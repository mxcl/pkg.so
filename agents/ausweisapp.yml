history:
  adoption-history:
    - >
      AusweisApp is distributed as the German federal government’s official eID client
      across desktop and mobile platforms. It supports the German identity card,
      electronic residence permit, and EU/EEA eID card, using NFC-capable mobile devices
      or compatible readers where appropriate.
    - >
      The source is published under the EUPL, enabling community ports and integrations.
      The official open-source page records community packaging across Linux
      distributions and other platforms, while official releases target the systems
      supported by the federal project.
  package-nerd-significance:
    - >
      AusweisApp is unusually important packaging infrastructure because it joins
      citizen-facing desktop and mobile applications, smart-card and NFC access,
      government certification requirements, cryptography, and a documented
      SDK/WebSocket interface.
    - >
      Its long-lived `AusweisApp2` identifiers remain visible in package names,
      application IDs, configuration names, and community repositories even after the
      user-facing product was renamed AusweisApp. That naming history matters to
      maintainers resolving upgrades and package identity.
  project-history:
    - >
      AusweisApp2 1.0.0 was initially provided in October 2014 for testing on stationary
      operating systems. Governikus develops the client on behalf of the German federal
      government, and the source is released under the European Union Public Licence.
    - >
      The product evolved from a desktop eID client into a cross-platform application
      and embeddable SDK. It gained smartphone-as-card-reader workflows, mobile NFC
      support, WebSocket integration, automated test modes, and SDK distribution.
    - >
      With the 2.0 generation in November 2023, AusweisApp2 was renamed AusweisApp and
      received a substantially revised interface while preserving compatibility-related
      identifiers in parts of the ecosystem.
  related-projects:
    - 'German online ID function: The government identity infrastructure used by AusweisApp.'
    - 'AusweisApp SDK: Embeddable form of the eID client for application developers.'
    - >
      AusweisApp SDK Wrapper: Native integration layer for supported mobile development
      environments.
    - 'identglue: Officially referenced integration tooling for web services.'
  sources:
    - 'Official SDK documentation: https://www.ausweisapp.bund.de/sdk/'
    - 'Official download and product description: https://www.ausweisapp.bund.de/en/download'
    - 'Official open-source page: https://www.ausweisapp.bund.de/en/open-source'
    - >
      Official release notes archive:
      https://www.ausweisapp.bund.de/fileadmin/user_upload/Software/AusweisApp-2.4.0-ReleaseNotes.pdf
    - 'Official repository: https://github.com/Governikus/AusweisApp'
  summary:
    - >
      AusweisApp is the German federal government’s official client for using the online
      identification function of supported identity documents. It reads an identity card
      through NFC or a card reader and mediates encrypted identification with an online
      service.
  timeline:
    - >
      2014-10-28: AusweisApp2 1.0.0 was initially released for testing on desktop
      operating systems.
    - '2023-11-06: The 2.0 generation was released.'
    - '2023: AusweisApp2 was renamed AusweisApp and received a redesigned interface.'
    - >
      Later releases: SDK names and environment variables progressively moved from
      AusweisApp2 branding to AusweisApp branding.
  usage:
    - >
      A user starts an identification process with an online service, opens or is
      redirected to AusweisApp, reviews the requested data and service authorization,
      presents a supported identity document to an NFC device or card reader, and enters
      the card PIN. The application then handles the encrypted exchange between the
      document and service.
