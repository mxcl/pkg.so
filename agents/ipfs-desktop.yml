config-file-location:
  linux:
    - ~/.config/IPFS Desktop/
    - ~/.ipfs/config
  macos:
    - ~/Library/Application Support/IPFS Desktop/
    - ~/.ipfs/config
  windows:
    - '%APPDATA%\IPFS Desktop\'
    - '%USERPROFILE%\.ipfs\config'
credentials-file-location: null
history:
  adoption-history:
    - >
      IPFS Desktop packages an IPFS node for Windows, macOS, Linux, and experimental
      FreeBSD use. Official installers include automatic updating, while community
      package-manager distributions let users place it under their existing
      system-management workflows.
    - >
      The application is positioned both as a terminal-free introduction to IPFS and as
      a graphical control panel and file browser for experienced users who already
      operate an IPFS node.
  package-nerd-significance:
    - >
      IPFS Desktop turns a network daemon, repository, browser-facing Web UI, and
      operating-system integrations into one desktop package. That makes it a useful
      example of packaging a distributed-systems stack while preserving access to the
      underlying Kubo repository and command-line workflow.
  project-history:
    - >
      Design work for a dedicated IPFS desktop experience was publicly discussed in the
      IPFS GUI project in 2018. By 2019, the 0.9 release was integrating IPFS and IPNS
      URL handling with the host operating system.
    - >
      The application evolved into an Electron shell combining Kubo and IPFS Web UI with
      tray controls, peer visualization, file import, protocol handling, and package
      formats for multiple desktop operating systems.
  related-projects:
    - Kubo supplies the embedded IPFS node and its repository configuration.
    - IPFS Web UI supplies the graphical file, peer, and content-management interface.
    - IPFS Companion extends IPFS and IPNS handling inside conventional web browsers.
  sources:
    - 'Official 0.9 announcement: https://blog.ipfs.tech/2019-09-19-ipfs-desktop-0-9/'
    - 'Official README: https://github.com/ipfs/ipfs-desktop#readme'
    - 'Official installation guide: https://docs.ipfs.tech/install/ipfs-desktop/'
    - 'Official releases: https://github.com/ipfs/ipfs-desktop/releases'
  summary:
    - >
      IPFS Desktop is the official graphical desktop bundle for running and managing an
      IPFS node. It combines Kubo, IPFS Web UI, operating-system tray controls, file
      import and pinning, peer visualization, and IPFS/IPNS protocol integration.
  timeline:
    - '2018: The IPFS GUI project publicly discussed the design of IPFS Desktop.'
    - >
      2019: IPFS Desktop 0.9 added broader operating-system integration for IPFS and
      IPNS addressing.
    - >
      2026: The v0.50 release line announced the end of Shipyard-team maintenance after
      September 30 and directed transition questions to the IPFS community.
  usage:
    - >
      Users can run a local IPFS node without working directly in a terminal, import and
      manage files, inspect connected peers, explore content-addressed data, and open
      IPFS or IPNS links through desktop protocol integration.
    - >
      Existing Kubo users can use the application as a control panel for a selected
      repository. The application checks IPFS_PATH first and otherwise uses the
      conventional ~/.ipfs repository on Unix-like systems.
