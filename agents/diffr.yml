    - >
      source_facts.description says it is an LCS-based diff highlighting tool for
      terminal code review.
  display-name-sources:
    - Official GitHub README and repository name use diffr.
    - source_facts.name is diffr.
  docs-sources:
    - >
      Official GitHub README is the primary documentation surface found for
      installation, usage, git integration, and color customization.
  history-sources:
    - https://github.com/mookid/diffr#readme
    - https://github.com/mookid/diffr/blob/master/CHANGELOG.md
  repo-sources:
    - >
      source_facts.repo already contains https://github.com/mookid/diffr, so repo was
      not re-determined per instruction.
  tags-sources:
    - Official README documents git integration and color customization for diff output.
    - source_facts.description mentions terminal code review and diff highlighting.
category-confidence: high
category-path:
