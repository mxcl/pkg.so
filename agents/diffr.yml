id: brew:diffr
display-name: diffr
repo: null
docs:
  - https://github.com/mookid/diffr#readme
config-file-location:
  unix:
    - ~/.gitconfig
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through Homebrew, Arch AUR, Cargo, and
      direct source builds. It also shows diffr configured as a Git pager and
      interactive diff filter, which is the main adoption path for daily review use.
  package-nerd-significance:
    - >
      diffr matters to package and source maintainers because it stays in the
      Unix-filter tradition: no repository database, no review server, just a small CLI
      that improves the diffs developers already pipe around.
  project-history:
    - >
      The changelog records the initial 0.1.0 release on 2019-07-01. Early releases
      added color customization, split reusable logic into `diffr-lib`, optimized LCS
      post-processing, and added line-number display.
  related-projects:
    - >
      The README calls diffr an improvement on Git's diff-highlight script and notes
      Git's built-in `--word-diff` and `--color-words` options as related approaches.
  sources:
    - https://github.com/mookid/diffr#readme
    - https://github.com/mookid/diffr/blob/master/CHANGELOG.md
  summary:
    - >
      diffr is a terminal filter that refines unified diffs with word-level
      highlighting, making code review easier when ordinary line-oriented output is too
      coarse.
  timeline:
    - '2019: 0.1.0 initial release.'
    - '2019: 0.1.2 split reusable logic into diffr-lib.'
    - '2020: 0.1.3 added line-number display.'
  usage:
    - >
      diffr reads unified diff input on stdin and writes enhanced output on stdout. The
      README shows `git show HEAD | diffr` for one-off use and `.gitconfig` settings
      that route Git paging and interactive diffs through diffr.
related-packages:
  - id: brew:git-delta
    reason: >
      Choose git-delta when you want a richer Git and unified-diff pager with syntax
      highlighting, navigation, line numbers, and optional side-by-side views; diffr is
      a smaller word-highlighting filter.
    rel: alternative
    sources:
      - https://github.com/mookid/diffr#readme
      - https://dandavison.github.io/delta/
  - id: brew:diff-so-fancy
    reason: >
      Choose diff-so-fancy for more extensive Git-oriented patch reformatting; choose
      diffr when preserving the ordinary unified-diff layout with focused word-level
      highlights is preferable.
    rel: alternative
    sources:
      - https://github.com/mookid/diffr#readme
      - https://github.com/so-fancy/diff-so-fancy#readme
  - id: brew:git
    reason: >
      Git directly produces the unified diffs that diffr filters, and diffr's official
      setup configures it as Git's pager and interactive diff filter.
    rel: adjacent_workflow
    sources:
      - https://github.com/mookid/diffr#readme
      - https://git-scm.com/docs/git-diff
tags:
  - cli
  - code-review
  - diff
  - git
  - syntax-highlighting
  - terminal
