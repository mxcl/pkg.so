history:
  adoption-history:
    - >
      Tencent distributes Weiyun through desktop, mobile, web, and Mini Program
      surfaces. The official download page also describes a synchronization assistant
      that links cloud storage with folders on a computer.
    - >
      The Homebrew cask supplies an additional package-manager installation path for the
      macOS desktop client.
  package-nerd-significance:
    - >
      Weiyun is a proprietary cloud-drive client whose cask allows macOS users and
      workstation-management scripts to install the official application declaratively.
    - >
      It is especially relevant in Tencent-centered environments because users can
      authenticate with Weixin or QQ and manage files across Tencent's desktop, mobile,
      web, and Mini Program surfaces.
  project-history:
    - >
      Tencent Weiyun is a personal cloud-storage product operated by Tencent. Its
      official materials describe an evolution beyond basic backup toward cross-device
      file management, photo backup, previews, sharing, online document editing, version
      recovery, and collaborative editing.
  related-projects:
    - Weixin and QQ, which provide supported sign-in identities.
    - Weiyun Sync Assistant, the companion desktop synchronization surface.
  sources:
    - https://www.weiyun.com/
    - https://www.weiyun.com/download.html
    - https://www.weiyun.com/help.html
    - https://www.weiyun.com/xy-privacy.html
    - source_facts.package-manager
  summary:
    - >
      Tencent Weiyun is a cloud drive for storing, backing up, synchronizing,
      previewing, editing, and sharing files and photos across devices.
  timeline:
    - >
      2019-10-24: Weiyun introduced its documented policy for managing accounts whose
      stored data exceeded their available quota.
    - >
      2021-11-02: The dated official privacy guide documented Tencent's operation of
      Weiyun and its Weixin and QQ sign-in flows.
  usage:
    - >
      Users sign in with a Weixin or QQ account to upload, download, organize, preview,
      and share files; back up photos; synchronize selected content; and edit supported
      documents online.
    - >
      The desktop application emphasizes stable transfers and file management, while the
      synchronization assistant links selected cloud content with local computer
      storage.
