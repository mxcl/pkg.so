history:
  adoption-history:
    - >
      OpenSuperWhisper is distributed through GitHub releases and a Homebrew cask. Its
      Apple-silicon-only focus and local model execution place it among the growing
      collection of native macOS utilities built around open speech models.
  package-nerd-significance:
    - >
      The project packages Whisper-style speech recognition as a small, open-source,
      native Mac utility rather than a hosted transcription service. It is notable for
      combining downloadable local models, global input triggers, drag-and-drop
      transcription, and conventional Homebrew installation.
  project-history:
    - >
      OpenSuperWhisper was created as an MIT-licensed macOS dictation and transcription
      application. It uses downloadable Whisper and Parakeet models and exposes native
      conveniences including global shortcuts, hold-to-record controls, microphone
      selection, and Finder audio-file handling.
    - >
      The official release series progressed through early 0.0.x builds to 0.1.0, which
      added Finder integration, broader audio-format handling, and additional
      preferences.
  related-projects:
    - Whisper and whisper.cpp provide the project's core speech-recognition lineage.
    - Parakeet is offered as an alternative transcription engine.
    - Homebrew provides the packaged macOS installation route.
  sources:
    - https://github.com/Starmel/OpenSuperWhisper#readme
    - https://github.com/Starmel/OpenSuperWhisper/releases
    - source_facts.package-manager
  summary:
    - >
      OpenSuperWhisper is an open-source, native macOS utility for recording or
      importing audio and transcribing it locally with downloadable speech-recognition
      models.
  timeline:
    - 'Early releases: The project published its initial 0.0.x builds on GitHub.'
    - >
      2026-03: Release 0.1.0 added Finder integration, enhanced audio handling, and new
      preferences.
  usage:
    - >
      Users select or download a speech model, choose a microphone and language, and
      trigger recording with a global keyboard or mouse shortcut. Audio files can also
      be dragged into the application for queued transcription.
