history:
  adoption-history:
    - >
      The input package-manager data lists Homebrew and Nix packaging, which is a small
      but meaningful formal-methods footprint: these ecosystems are common in
      reproducible research and developer workstations.
    - >
      Bitwuzla's adoption story is also academic. The official README points to the CAV
      2023 publication and asks downstream users to report projects that incorporate
      Bitwuzla so they can be linked as third-party applications.
  package-nerd-significance:
    - >
      Bitwuzla is package-nerd significant because solver packaging is where
      reproducibility gets real: exact versions, linked SAT backends, Python bindings,
      and platform builds can change research and CI outcomes.
    - >
      It also carries lineage value. The official references include SMT-LIB and
      BTOR2/Boolector literature, placing Bitwuzla in the bit-vector and
      hardware/software verification solver family rather than in generic
      theorem-proving packaging.
    - >
      The 0.x release cadence through 2026 shows an actively moving solver, which makes
      package-manager freshness and dependency choices unusually important.
  project-history:
    - >
      The Bitwuzla repository was created in 2020, and the project reached a public
      0.1.0 release on June 30, 2023. The README asks users to cite the CAV 2023
      Bitwuzla system-description paper by Aina Niemetz and Mathias Preiner.
    - >
      Official documentation describes the command-line tool as supporting SMT-LIBv2 and
      non-sequential BTOR2 input files. The API documentation covers C++, C, Python, and
      OCaml documentation surfaces.
    - >
      The installation docs identify CaDiCaL and SymFPU as required dependencies, with
      optional solver backends such as Kissat. The CLI exposes SAT-solver choices and
      solver controls that matter to verification researchers and benchmark runners.
  related-projects:
    - SMT-LIB is the standard input language family documented by the CLI.
    - >
      BTOR2 and Boolector are cited in the official references and define part of the
      bit-vector solver lineage around Bitwuzla.
    - >
      CaDiCaL and SymFPU are required dependencies in the official installation docs;
      Kissat is documented as an optional dependency/SAT backend.
  sources:
    - https://bitwuzla.github.io/docs
    - https://bitwuzla.github.io/docs/binary.html
    - https://bitwuzla.github.io/docs/install.html
    - https://bitwuzla.github.io/docs/references.html
    - https://github.com/bitwuzla/bitwuzla#readme
    - source_facts.package-manager
  summary:
    - >
      Bitwuzla is an SMT solver for fixed-size bit-vectors, floating-point arithmetic,
      arrays, uninterpreted functions, and combinations of those theories. Its name is
      an Austrian dialect joke meaning someone who tinkers with bits.
    - >
      For package users, Bitwuzla is not just another CLI: it is a research-grade solver
      with a stable command-line interface, C/C++/Python APIs, and package-manager
      availability for reproducible formal-methods workflows.
  timeline:
    - '2020: bitwuzla/bitwuzla repository created.'
    - '2023-06-30: Bitwuzla 0.1.0 released.'
    - '2023: Bitwuzla system-description paper published at CAV 2023.'
    - '2024-12-13: Bitwuzla 0.7.0 released.'
    - '2025-05-22: Bitwuzla 0.8.0 released.'
    - '2026-05-21: Bitwuzla 0.9.1 released.'
  usage:
    - >
      CLI usage centers on feeding SMT-LIBv2 or BTOR2 files to bitwuzla, optionally
      producing models, unsat cores, interpolants, and solver statistics. The CLI can
      also parse-only, preprocess-only, set time and memory limits, choose SAT backends,
      and configure bit-vector solving options.
    - >
      Library usage matters too: packages that install Bitwuzla make it available both
      as a command and as a dependency for tools that need embedded SMT solving.
related-packages:
  - id: brew:z3
    reason: >
      Choose Z3 when a verification or modeling task needs a broader set of SMT-LIB
      theories and its extensive general-purpose APIs; choose Bitwuzla for a solver
      centered on bit-vectors, floating point, arrays, and BTOR2 input.
    rel: alternative
    sources:
      - https://bitwuzla.github.io/docs/
      - https://bitwuzla.github.io/docs/binary.html
      - https://microsoft.github.io/z3guide/docs/logic/intro/
