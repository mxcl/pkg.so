history:
  adoption-history:
    - >
      The input records Homebrew distribution. The official project also documents
      deployment as a standalone service with local or S3-compatible artifact storage
      and SQLite or PostgreSQL metadata storage.
  package-nerd-significance:
    - >
      The project applies repository-manager ideas to many package ecosystems in one
      lightweight program. Its version-cooldown feature is particularly relevant to
      supply-chain-conscious package users because newly published versions can be
      quarantined before automated builds consume them.
  project-history:
    - >
      The git-pkgs organization created proxy as a caching service for package
      registries, intended to reduce repeated downloads and improve build reliability.
      The project broadened that basic cache into a multi-ecosystem service with
      mirroring, storage backends, a dashboard, vulnerability information, and
      configurable release cooldowns.
  related-projects:
    - >
      Supported clients include npm, Cargo, Maven and Gradle, NuGet, Composer, Conan,
      Conda, CRAN, Julia Pkg, Docker, APT, and RPM-family package managers.
    - >
      S3-compatible services can provide artifact storage, while SQLite and PostgreSQL
      can store proxy metadata.
  sources:
    - https://github.com/git-pkgs/proxy#readme
    - https://github.com/git-pkgs/proxy/blob/main/docs/configuration.md
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      git-pkgs proxy is a lightweight caching proxy that serves artifacts and metadata
      for multiple package registries.
  timeline:
    - >
      2026: Official documentation describes multi-registry caching, mirroring,
      vulnerability views, and configurable version cooldowns.
  usage:
    - >
      Operators start the `proxy` service and point package-manager clients at its
      ecosystem-specific endpoints. Configuration can be supplied through command-line
      flags, environment variables, or an explicitly selected YAML or JSON file.
    - >
      The `mirror` command can pre-populate the cache from package URLs, SBOM documents,
      individual packages, or registries. Deployments may use local files or
      S3-compatible storage and either SQLite or PostgreSQL.
