    - ~/.rainbarf.conf
    - $RAINBARF
credentials-file-location: null
history:
  adoption-history:
    - >
      rainbarf is distributed through Homebrew and MacPorts, reflecting its principal
      audience among terminal-multiplexer users on macOS and other Unix-like systems.
  package-nerd-significance:
    - >
      rainbarf represents the small Unix utility tradition: a focused command emits
      compact system telemetry that can be embedded in another program's status line.
  project-history:
    - >
      rainbarf was created as a compact CPU, memory, and battery visualization for tmux
      and GNU Screen status bars.
  related-projects:
    - tmux
    - GNU Screen
  sources:
    - https://github.com/creaktive/rainbarf#readme
    - source_facts.package-manager
  summary:
    - >
      rainbarf is a command-line system monitor that renders CPU, memory, and battery
      statistics for terminal-multiplexer status bars.
  timeline:
    - >
      Project era: rainbarf emerged as a lightweight status-bar helper for tmux and GNU
      Screen.
    - >
      Package adoption: Homebrew and MacPorts made it directly installable for
      terminal-centric users.
  usage:
    - >
      Users invoke rainbarf from a tmux or GNU Screen status configuration to render
      compact resource charts. The official project does not document a dedicated
      rainbarf configuration-file path.
