credentials-file-location: null
history:
  adoption-history:
    - >
      Before Telestream's acquisition, Vara Software had established Wirecast and
      related real-time production products as award-winning tools for live web video.
    - >
      A 2009 Telestream release reported that Wirecast powered on-demand footage for the
      Live Earth webcast and described use across entertainment and corporate
      communications.
    - >
      Telestream subsequently maintained parallel macOS and Windows editions and
      published versioned guides, tutorials, knowledge-base material, and integrations
      for professional streaming workflows.
  package-nerd-significance:
    - >
      Wirecast is a prominent example of proprietary broadcast-production software
      distributed through a desktop cask rather than as a reusable library or
      command-line dependency.
    - >
      It represents the software-based production-studio model: commodity computers and
      capture devices replace portions of a traditional live switching and webcasting
      stack.
  project-history:
    - >
      Wirecast originated at European developer Vara Software as a real-time
      live-production and streaming application.
    - >
      Telestream completed its acquisition of Vara Software on August 27, 2008, adding
      Wirecast's live-production technology to its existing media encoding and workflow
      portfolio.
    - >
      Telestream continued developing Wirecast as a cross-platform desktop studio for
      combining live cameras, prerecorded media, titles, layers, chroma key, recording,
      and streaming.
  related-projects:
    - Vara Software's Videocue was acquired alongside Wirecast.
    - >
      Telestream's broader media portfolio has included Episode, Flip4Mac, Vantage,
      Switch, and ScreenFlow.
  sources:
    - https://www.telestream.net/company/press/pdfs/prs-2009-02-10.pdf
    - >
      https://www.telestream.net/company/press/pdfs/prs_Telestream_Vara_Software_Acquisition.pdf
    - https://www.telestream.net/telestream-support/wire-cast/documentation.htm
  summary:
    - >
      Wirecast is Telestream's proprietary macOS and Windows live-production application
      for composing, recording, and streaming multi-source broadcasts.
  timeline:
    - >
      Before 2008: Vara Software developed Wirecast as a live-production and streaming
      product.
    - '2008: Telestream acquired Vara Software and Wirecast.'
    - '2009: Telestream positioned Wirecast as a desktop video studio for live webcasting.'
    - >
      Later releases: Telestream expanded Wirecast through versioned Studio and Pro
      editions, online help, tutorials, and specialist workflow guides.
  usage:
    - >
      Operators assemble cameras, microphones, screen captures, remote contributors,
      prerecorded media, titles, and graphics into shots and layers, then switch them
      into a live program.
    - >
      Wirecast can record a production locally and broadcast it to supported streaming
      platforms or configured streaming destinations.
