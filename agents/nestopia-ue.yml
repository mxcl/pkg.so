history:
  adoption-history:
    - >
      Nestopia has a reputation in emulator circles as an accuracy-oriented NES/Famicom
      emulator; the libretro port calls it cycle accurate and bases itself on the
      Nestopia JG fork as the de facto upstream. That split explains why users may see
      Nestopia as a standalone app, a libretro core, or a JG-derived core depending on
      packaging.
    - >
      Homebrew shows modest macOS/Linux package use, with 233 stable installs and 11
      HEAD installs in the 365-day window visible on the formula page. Flathub gives a
      separate Linux-desktop signal, listing 1,423 downloads per month for the Nestopia
      Flatpak page at the time it was read.
  package-nerd-significance:
    - >
      Nestopia UE matters because it preserves the standalone-app workflow for an
      emulator core that also lives in frontend ecosystems. It is a good example of
      packaging as preservation: the GUI app survives even as core emulation
      responsibility moves to another fork.
  project-history:
    - >
      The original Nestopia codebase was written by Martin Freij, with copyright years
      shown as 2003-2008 in the libretro Nestopia README. Nestopia UE continued that
      code after the original upstream stopped, combining the original source with
      Linux/desktop port work.
    - >
      The current 0ldsk00l repository describes itself as a fork of the original
      Nestopia source plus the Linux port, with the practical goal of keeping a
      functional standalone GUI release available on major desktop platforms. It also
      says core emulation work is no longer maintained there and should go upstream to
      Nestopia JG.
  related-projects:
    - Nestopia JG
    - nestopia-libretro
    - RetroArch/libretro
    - FCEUX
    - Mesen
  sources:
    - https://flathub.org/en/apps/ca._0ldsk00l.Nestopia
    - https://formulae.brew.sh/formula/nestopia-ue
    - https://github.com/0ldsk00l/nestopia
    - https://github.com/0ldsk00l/nestopia-historical
    - https://github.com/libretro/nestopia
  summary:
    - >
      Nestopia UE is the maintained standalone GUI line of the Nestopia NES/Famicom
      emulator. The Homebrew package gives users a native desktop emulator rather than a
      libretro core alone.
  timeline:
    - >
      2003-2008: original Nestopia copyright period credited to Martin Freij in the
      libretro Nestopia README.
    - '2008-2018: Nestopia UE contributors credited in the libretro Nestopia README.'
    - >
      2020-2024: Rupert Carmichael/Nestopia JG period credited in the libretro Nestopia
      README.
    - 'August 9, 2025: GitHub repository lists 1.53.2 as the latest release.'
  usage:
    - >
      Package users launch `nestopia` to run NES/Famicom ROMs, configure
      input/video/audio, use the standalone FLTK GUI, and play ROM sets without going
      through RetroArch. Power users care about BIOS placement for Famicom Disk System
      content, sample packs for cartridges with external ADPCM samples, and upstream
      core fixes.
    - >
      For maintainers, the package is a small desktop stack: C/C++ emulator code with
      FLTK, SDL, libarchive, OpenGL function loading, sample-rate conversion, and
      zlib-style archive support.
related-packages:
