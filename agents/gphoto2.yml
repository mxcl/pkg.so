id: brew:gphoto2
display-name: gphoto2
repo: https://github.com/gphoto/gphoto2
docs:
  - https://www.gphoto.org/doc/manual
  - https://www.gphoto.org/doc/manual/ref-gphoto2-cli.html
config-file-location:
  unix:
    - ~/.gphoto/settings
credentials-file-location: null
history:
  adoption-history:
    - >
      gphoto2 became a standard package in Unix-like distributions because camera access
      was not uniform across vendors or protocols. The gPhoto homepage explicitly names
      Linux, FreeBSD, NetBSD, macOS, and major Linux distributions as supported or
      packaged environments.
    - >
      Its adoption is also tied to automation. Photographers, labs, kiosks,
      astrophotography setups, archive workflows, and CI-like hardware rigs can call a
      CLI command where GUI photo importers are too manual.
  package-nerd-significance:
    - >
      gphoto2 is a classic package-manager favorite because it bridges hardware,
      scripting, and desktop media workflows. Installing it pulls together the CLI,
      libgphoto2, USB/serial camera support, translations, optional preview libraries,
      and udev-style integration handled by distributions.
    - >
      For maintainers, the hard part is not the small CLI but the moving camera
      ecosystem underneath it. libgphoto2 NEWS entries continually add camera IDs,
      protocol quirks, PTP behavior, vendor-specific configuration, Android
      file-descriptor support, and security fixes for untrusted USB devices.
  project-history:
    - >
      The gPhoto project describes gPhoto2 as a free, redistributable set of digital
      camera software applications for Unix-like systems. The gphoto2 repository README
      defines the package itself as the command-line frontend to libgphoto2.
    - >
      The project history is inseparable from libgphoto2. The library provides camera
      drivers and protocol support, while the CLI exposes that support for users,
      scripts, tethered shooting, camera configuration, preview capture, and file
      operations.
    - >
      The gphoto2 NEWS file records years of CLI-focused evolution: split capture and
      download commands, `--capture-tethered`, event waiting, movie capture, filename
      templating improvements, parsable file listings, EXIF retrieval, and
      signal-controlled long-running capture operations.
  related-projects:
    - >
      Related projects include libgphoto2, gtkam, digiKam camera import support, desktop
      photo managers, camera tethering tools, PTP/MTP libraries, and distribution udev
      rules for camera access.
  sources:
    - https://github.com/gphoto/gphoto2
    - https://github.com/gphoto/gphoto2/blob/master/NEWS
    - https://github.com/gphoto/gphoto2/releases
    - https://github.com/gphoto/libgphoto2/blob/master/NEWS
    - https://www.gphoto.org/
    - https://www.gphoto.org/doc/manual/ref-gphoto2-cli.html
    - https://www.gphoto.org/proj/libgphoto2/
    - https://www.gphoto.org/proj/libgphoto2/support.php
  summary:
    - >
      gphoto2 is the command-line frontend for libgphoto2, the gPhoto project's camera
      access library. It gives Unix-like systems a scriptable way to inspect, download
      from, configure, and in many cases remotely control digital cameras.
  timeline:
    - >
      2.4.2 series: NEWS records the split between capture-only and capture-and-download
      image commands.
    - >
      2.4.7 series: NEWS records wait-event, wait-event-and-download, capture-tethered,
      and large-file download support.
    - '2.4.10 series: NEWS records continuous movie capture via preview frames.'
    - >
      2.5.0 series: NEWS records keep/no-keep capture options, timed wait-event forms,
      and full configuration tree listing.
    - '2.5.9 series: NEWS records source and issue tracking moving to GitHub.'
    - >
      2019-10-27: GitHub releases page records gphoto2 2.5.20 with larger file ranges
      and added shell commands.
    - >
      2025-08-11: GitHub releases page records gphoto2 2.5.32 with EXIF retrieval
      commands and file-operation reverse ordering.
  usage:
    - >
      Users run `gphoto2` to list cameras and files, download images, set or read camera
      configuration, trigger captures, wait for camera events, capture tethered
      sessions, and stream or save previews depending on camera support.
    - >
      The manual page describes gphoto2 as a command-line client for a cross-platform
      digital camera library. The repository README lists libgphoto2 as the required
      library and popt as the command-line option dependency, with optional EXIF, JPEG,
      CDK, and AALIB support.
related-packages:
  - id: brew:libgphoto2
    reason: >
      gphoto2 is the official command-line frontend to libgphoto2 and requires that
      library for camera detection, file access, configuration, and capture operations.
    rel: adjacent_workflow
    sources:
      - https://github.com/gphoto/gphoto2
      - https://github.com/gphoto/libgphoto2
