history:
  adoption-history:
    - >
      The project gained a community following among Mac users who wanted YouTube Music
      to run as a separate native process with operating-system integrations. Its
      official README documents both downloadable releases and Homebrew Cask
      installation.
  package-nerd-significance:
    - >
      YT Music is a compact example of a native Swift/WKWebView wrapper that turns a web
      service into a package-managed Mac application. It is explicitly unofficial and
      should not be confused with a Google-maintained YouTube Music client.
  project-history:
    - >
      Developer Steve Radford created YT Music as an open-source macOS wrapper for
      music.youtube.com. It uses WKWebView rather than Electron and adds Mac-specific
      playback controls and notifications.
  related-projects:
    - >
      The application wraps Google's YouTube Music service but is not affiliated with
      YouTube or Google.
    - Its source project uses Xcode and CocoaPods for development.
  sources:
    - 'Official releases: https://github.com/steve228uk/YouTube-Music/releases'
    - 'Official repository and README: https://github.com/steve228uk/YouTube-Music'
    - source_facts.package-manager
  summary:
    - >
      YT Music is an unofficial, open-source macOS wrapper that runs YouTube Music as a
      standalone WKWebView application.
  timeline:
    - 'Initial project era: The project was published as a native macOS YouTube Music wrapper.'
    - >
      Subsequent releases: Media keys, keyboard shortcuts, Now Playing integration,
      Touch Bar controls, and track-change notifications were documented.
    - >
      Package-manager adoption: The official README added Homebrew Cask installation
      instructions.
  usage:
    - >
      Users access music.youtube.com in a dedicated Mac application and control playback
      through media keys, keyboard shortcuts, Now Playing integration, Touch Bar
      controls, and system notifications.
    - >
      Developers can clone the repository, install its dependencies with CocoaPods, and
      build the Xcode workspace.
