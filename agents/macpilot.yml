id: cask:macpilot
display-name: MacPilot
repo: null
docs:
  - https://www.koingosw.com/products/macpilot/manual.php
config-file-location:
  macos:
    - ~/Library/Preferences/com.koingosw.MacPilot.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      MacPilot is distributed as a conventional macOS application and through the
      Homebrew Cask ecosystem as `macpilot`, giving command-line-oriented Mac users a
      reproducible installation route.
  package-nerd-significance:
    - >
      MacPilot packages a large collection of macOS defaults, maintenance operations,
      and otherwise command-line-oriented tweaks behind a graphical interface. Its save
      points are also useful for applying a repeatable collection of settings across
      Macs.
  project-history:
    - >
      Koingo Software developed MacPilot as a graphical route to hidden and advanced
      macOS settings. The current official product material advertises access to more
      than 1,200 features and combines preference changes with maintenance, networking,
      file-permission, and system-information tools.
  related-projects:
    - >
      OnyX and Deeper occupy adjacent parts of the macOS maintenance and
      hidden-preference utility ecosystem.
  sources:
    - https://www.koingosw.com/products/macpilot
    - https://www.koingosw.com/products/macpilot/manual.php
    - source_facts.package-manager.brew-cask
    - source_facts.version
  summary:
    - >
      MacPilot is a commercial macOS system-customization and maintenance utility from
      Koingo Software. It exposes hidden settings and Unix-backed operations through a
      graphical interface.
  timeline:
    - '2026: Input package metadata records MacPilot 18.0 in the Homebrew Cask catalog.'
  usage:
    - >
      Users employ MacPilot to change hidden Finder, Dock, login, networking, and
      application preferences; run maintenance operations; inspect system information;
      reset settings to defaults; and create deployable save points. Some operations
      require an administrator account or changes to System Integrity Protection.
tags:
  - gui
