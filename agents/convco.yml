id: brew:convco
display-name: Convco
repo: null
docs:
  - https://convco.github.io/
config-file-location:
  unix:
    - .versionrc
credentials-file-location: null
history:
  adoption-history:
    - >
      Convco's distribution follows Rust tooling norms: `cargo install convco` is the
      upstream installation path, crates.io tracks the package, and the input package
      facts show additional Homebrew and Nix packaging for users who prefer system
      package managers.
  package-nerd-significance:
    - >
      Convco is the sort of compact, single-binary release helper package that package
      managers like: it exposes one executable, has no credentials surface, and bridges
      Git history conventions with reproducible release automation.
  project-history:
    - >
      The upstream repository was created in November 2019, and the crate was published
      on crates.io in December 2019. Its README frames the tool as a Conventional Commit
      CLI and documents a small set of release-engineering commands rather than a broad
      Git wrapper.
  related-projects:
    - >
      The README explicitly connects Convco to Conventional Commits,
      conventional-changelog, the conventional-changelog config specification, Git
      editor integration, and cargo-release usage.
  sources:
    - https://github.com/convco/convco
    - https://convco.github.io/
    - https://crates.io/crates/convco
    - https://github.com/convco/convco/releases/tag/v0.6.4
    - https://formulae.brew.sh/formula/convco
  summary:
    - >
      Convco is a Rust command-line tool for teams that use Conventional Commits to
      validate commit ranges, generate changelogs, assist commits, and calculate
      semantic versions.
  timeline:
    - '2019-11-14: Official GitHub repository created.'
    - '2019-12-26: crates.io package created.'
    - '2026-05-24: v0.6.4 release published.'
  usage:
    - >
      Common workflows include `convco check` in hooks or CI, `convco changelog` for
      changelog generation, `convco version --bump` for release calculation, and `convco
      commit` as an interactive Conventional Commit helper or Git editor.
related-packages:
  - id: brew:cocogitto
    reason: >
      Choose Cocogitto when you want Conventional Commit tooling that also performs an
      opinionated release transaction with configurable hooks, changelog updates, a
      release commit, and a Git tag.
    rel: alternative
    sources:
      - https://convco.github.io/
      - https://docs.cocogitto.io/
      - https://docs.cocogitto.io/guide/bump
  - id: brew:git-cliff
    reason: >
      Choose git-cliff when highly customizable Conventional Commit changelogs and
      release notes are the primary need rather than Convco's broader commit-validation
      and commit-assistance command set.
    rel: alternative
    sources:
      - https://convco.github.io/
      - https://git-cliff.org/
