history:
  adoption-history:
    - >
      Waku is distributed as a signed, self-updating desktop application and as the
      Homebrew cask represented by this record. Rather than replacing individual agent
      ecosystems, it detects supported agent CLIs already installed on the user's
      machine and communicates through their native structured protocols.
  package-nerd-significance:
    - >
      Waku represents the emerging class of local orchestration frontends for
      command-line coding agents. Its provider-neutral timeline, Git-backed checkpoints,
      native Rust/GPUI interface, and reuse of existing provider authentication make it
      interesting to developers comparing agent runtimes and desktop shells.
  project-history:
    - >
      Waku was introduced as a native desktop application for managing multiple local
      coding-agent CLIs from one interface. It is built in Rust with GPUI and keeps
      projects, sessions, transcripts, and provider identifiers on the user's machine.
    - >
      The architecture separated the desktop RPC client from a standalone waku-daemon.
      The daemon owns task SQLite data, attachments, provider sessions, and workspace
      Git operations, while the desktop retains presentation state and a disposable
      preview cache.
  related-projects:
    - >
      Supported agent integrations include Claude Code, Codex CLI, Cursor CLI, OpenCode,
      Amp, Grok Build, Kimi Code, Fx, and Pi.
    - >
      GPUI, originating in the Zed ecosystem, provides Waku's GPU-accelerated native
      interface.
    - Sparkle supplies signed in-application updates on macOS.
  sources:
    - https://github.com/egoist/waku#readme
    - https://github.com/egoist/waku/blob/main/RELEASING.md
    - https://waku.sh/
  summary:
    - >
      Waku is a native desktop workspace that presents multiple locally installed
      coding-agent CLIs through a common interface. It keeps sessions and project state
      local and adds queueing, steering, transcripts, and Git-aware rewind.
  timeline:
    - >
      2026: Waku's official site presented the application as a local native frontend
      for coding agents.
    - >
      The project established a daemon/client architecture and provider-neutral protocol
      for agent sessions.
    - >
      Early releases added signed desktop distribution, automatic updates, local state
      management, and support for a growing set of agent CLIs.
  usage:
    - >
      Users first install and authenticate at least one supported agent CLI. Waku
      detects those CLIs and provides a shared interface for starting independent
      project sessions, changing models or reasoning settings, steering active work, and
      reviewing tool activity.
    - >
      Each prompt can create a hidden Git checkpoint, allowing the working tree and
      associated provider conversation to be rewound together. Waku itself requires no
      account or separate API credentials.
