history:
  adoption-history:
    - >
      fSpy widened the reach of its predecessor's workflow by providing a standalone,
      cross-platform application rather than requiring users to perform calibration
      inside Blender. Its official Blender importer remains an important route for
      transferring matched cameras into 3D scenes.
    - >
      The application is used in 3D modeling, compositing, architectural reconstruction,
      and visual-effects preparation when a synthetic camera must reproduce the
      perspective of a still photograph or perspective rendering.
  package-nerd-significance:
    - >
      fSpy is useful in graphics toolchains because it separates camera solving from any
      single 3D package and stores the result in a documented project format. Its
      official Blender importer offers a smooth path into Blender, while other
      applications can consume copied parameters or implement their own importers.
  project-history:
    - >
      fSpy was created by Stuffmatic as a successor to BLAM, a Blender add-on for
      still-image camera calibration. The developer described fSpy as an effort to bring
      BLAM's functionality to a wider audience through a standalone application.
    - >
      The application was built as open-source cross-platform software using TypeScript,
      Electron, React, and Redux. Its focus remains still-image matching rather than
      moving-camera tracking or general photogrammetric reconstruction.
  related-projects:
    - BLAM is fSpy's Blender-based predecessor.
    - >
      The official fSpy Blender importer transfers computed camera parameters and the
      background image into Blender.
  sources:
    - 'Official basics guide: https://fspy.io/basics/'
    - 'Official repository README: https://github.com/stuffmatic/fSpy'
    - 'Official tutorial: https://fspy.io/tutorial/'
    - 'Official website: https://fspy.io/'
  summary:
    - >
      fSpy is an open-source, cross-platform application that estimates a 3D camera's
      focal length, orientation, and position from perspective cues in a still image.
  timeline:
    - >
      The official sources describe fSpy's origin in the earlier BLAM Blender add-on but
      do not provide a reliable first-release date.
  usage:
    - >
      Users load a suitable perspective image, align controls with parallel real-world
      lines to establish vanishing points, place the 3D origin, optionally supply a
      reference distance or principal point, and inspect the computed camera parameters.
      Results can be imported through the official Blender add-on or transferred
      manually to other 3D applications.
