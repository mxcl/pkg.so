history:
  adoption-history:
    - >
      Buf adoption followed the pain points of larger Protobuf users: teams wanted one
      repeatable command for compiling, linting, compatibility checks, and generation
      instead of per-repository shell scripts around `protoc -I` paths. The CLI is
      distributed through Homebrew, npm, Docker, Windows installers, binary downloads,
      tarballs, source builds, and other package managers listed in the input.
    - >
      Registry features widened its role from local CLI tooling to organization-level
      schema governance. The Buf Schema Registry stores modules, renders documentation,
      resolves dependencies, hosts remote plugins, produces generated SDKs, and can
      enforce schema checks for teams that publish APIs there.
  package-nerd-significance:
    - >
      Buf matters to package-tooling people because it treats `.proto` files as
      versioned modules instead of loose source files copied between repos. It brings
      package-lock and registry patterns familiar from language ecosystems into Protobuf
      schema distribution.
    - >
      It is also a notable example of a package manager formula that installs not only
      the main `buf` binary but companion protoc plugins, making Homebrew a convenient
      entry point for Protobuf linting and compatibility checks.
  project-history:
    - >
      Buf was created by Buf Technologies as a developer-tooling layer for Protobuf
      projects. Its public repository presents it as a modern toolchain for Protobuf
      rather than a replacement for the schema language itself: it keeps the plugin
      model familiar to `protoc` users while adding workspace configuration,
      deterministic checks, and registry-aware workflows.
    - >
      The project grew beyond a formatter or wrapper into a broader ecosystem: the CLI,
      Buf Schema Registry, remote plugins, generated SDKs, ConnectRPC, Protobuf-ES, and
      Protovalidate are all positioned by Buf as related pieces of schema-driven API
      infrastructure.
  related-projects:
    - `protoc` is the historical compiler that Buf augments for day-to-day Protobuf workflows.
    - >
      The Buf Schema Registry is the hosted registry used for modules, documentation,
      remote plugins, generated SDKs, and schema checks.
    - >
      ConnectRPC, Protobuf-ES, and Protovalidate are related Buf ecosystem projects
      named by the official README.
  sources:
    - https://buf.build/docs/bsr
    - https://buf.build/docs/cli
    - https://github.com/bufbuild/buf
    - source_facts.package-manager
  summary:
    - >
      Buf is a modern Protocol Buffers toolchain centered on the `buf` CLI, replacing
      many direct `protoc` workflows with module-aware builds, linting, breaking-change
      detection, formatting, code generation, dependency management, API calls, and
      access to the Buf Schema Registry.
  timeline:
    - >
      2020: Early public Buf releases established the CLI around Protobuf build, lint,
      breaking-change, and generation workflows.
    - >
      2021: Buf reached a stable v1 line and documented a
      no-breaking-changes-within-major-version CLI policy.
    - >
      2020s: The project expanded around the Buf Schema Registry, remote plugins,
      generated SDKs, ConnectRPC, Protobuf-ES, and Protovalidate.
  usage:
    - >
      Typical CLI use starts with `buf config init`, then `buf build`, `buf format -w`,
      `buf lint`, `buf breaking --against ...`, and `buf generate`. Projects commonly
      check in `buf.yaml`, `buf.gen.yaml`, and `buf.lock` so CI and developer laptops
      run the same Protobuf workflow.
    - >
      Core CLI features work without a Buf Schema Registry account, while signing in
      adds private module dependency resolution, remote plugins, generated SDKs, hosted
      documentation, and server-side checks.
related-packages:
  - id: brew:protobuf
    reason: >
      Choose the upstream protoc package for the traditional compiler-centered workflow;
      choose Buf for module-aware workspaces, built-in linting, compatibility checks,
      dependency management, and registry integration.
    rel: alternative
    sources:
      - https://buf.build/docs/cli
      - https://protobuf.dev/
  - id: brew:buffa
    reason: >
      Buf can run buffa's official remote plugin to generate Rust Protobuf code without
      installing a local protoc-gen-buffa binary.
    rel: adjacent_workflow
    sources:
      - https://github.com/anthropics/buffa
      - https://github.com/anthropics/buffa/blob/main/docs/guide.md
      - https://buf.build/docs/cli
