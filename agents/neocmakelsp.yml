id: brew:neocmakelsp
display-name: neocmakelsp
repo: null
docs:
  - https://neocmakelsp.github.io/docs
config-file-location:
  linux:
    - .neocmake.toml
    - .neocmakelint.toml
    - $XDG_CONFIG_HOME/neocmakelsp/config.toml
    - ~/.config/neocmakelsp/config.toml
  macos:
    - .neocmake.toml
    - .neocmakelint.toml
    - ~/Library/Application Support/neocmakelsp/config.toml
  windows:
    - .neocmake.toml
    - .neocmakelint.toml
    - '{FOLDERID_RoamingAppData}/neocmakelsp/config.toml'
credentials-file-location: null
history:
  adoption-history:
    - >
      This is a niche developer-tool package serving CMake users who want editor
      intelligence without adopting a larger IDE. The repository API showed 407 stars
      and 36 forks on the 2026-07-01 request. The Homebrew API snapshot generated on
      2026-07-01 reported 624 installs over 365 days and 66 installs over 30 days.
  package-nerd-significance:
    - >
      Its significance is as part of the language-server packaging layer: small Rust
      binary, editor-facing, and useful across editor camps. It is not foundational
      infrastructure, but it fills a real gap for CMake-heavy projects whose developers
      want LSP behavior outside CLion or VS Code extensions.
  project-history:
    - >
      The public GitHub repository was created on 2022-07-02. The project had reached
      v0.10.3 by 2026-06-03, with prebuilt release assets for multiple operating systems
      and CPU targets.
  related-projects:
    - CMake
    - Language Server Protocol
    - tree-sitter
    - Tower
    - Neovim
    - Helix
  sources:
    - https://api.github.com/repos/neocmakelsp/neocmakelsp
    - https://api.github.com/repos/neocmakelsp/neocmakelsp/releases?per_page=8
    - https://formulae.brew.sh/api/formula/neocmakelsp.json
    - https://github.com/neocmakelsp/neocmakelsp/blob/master/README.md
    - https://neocmakelsp.github.io/docs/
  summary:
    - >
      neocmakelsp is a Rust language server for CMake, built around Tower and
      tree-sitter. Its README emphasizes completions from CMake-file analysis,
      lint-style error detection, formatting/CLI support, and editor integration for
      Neovim, Emacs, VS Code, and Helix.
  timeline:
    - '2022-07-02: GitHub repository created.'
    - '2026-06-03: v0.10.3 release published.'
    - '2026-07-01: Homebrew API snapshot listed stable version 0.10.3.'
  usage:
    - >
      Package users install the neocmakelsp executable, then point an editor LSP client
      at it for CMakeLists.txt completion, diagnostics, and formatting support. The
      README also advertises cargo install, which makes Homebrew one of several
      convenient distribution routes rather than the project's only installation path.
related-packages:
  - id: brew:cmake-language-server
    reason: >
      Choose cmake-language-server for a smaller Python-based CMake LSP focused on
      completion, hover documentation, and cmake-format integration; neocmakelsp offers
      a broader Rust-based feature set.
    rel: alternative
    sources:
      - https://github.com/regen100/cmake-language-server#readme
      - https://neocmakelsp.github.io/
  - id: brew:cmake
    reason: >
      CMake is the build-system implementation whose language and file API neocmakelsp
      analyzes to provide project-aware editor features.
    rel: adjacent_workflow
    sources:
      - https://neocmakelsp.github.io/
      - https://cmake.org/documentation/
  - id: brew:cmake-lint
    reason: >
      neocmakelsp can invoke cmake-lint on file saves when `enable_external_cmake_lint`
      is enabled in `.neocmake.toml`.
    rel: adjacent_workflow
    sources:
      - https://github.com/neocmakelsp/neocmakelsp#cmake-lint-integration
      - https://github.com/cmake-lint/cmake-lint
