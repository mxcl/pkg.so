history:
  adoption-history:
    - >
      UNIGINE offers Heaven in a free Basic edition for evaluation and in commercial
      editions with extended reporting, automation, and stress-testing features. Its
      Windows, Linux, and macOS support helped make it a portable workload for comparing
      graphics hardware and checking system stability.
  package-nerd-significance:
    - >
      Heaven is a long-lived, visually distinctive GPU benchmark. Package-manager
      availability is useful for repeatable installation on test machines, although
      benchmark comparisons still require consistent presets, APIs, drivers, and
      hardware conditions.
  project-history:
    - >
      UNIGINE introduced Heaven in 2009 as a real-time steampunk demonstration and GPU
      benchmark powered by the UNIGINE Engine. It combines a scripted benchmark with
      interactive fly-through and walk-through modes.
    - >
      The official manual describes GPU-bound benchmarking, hardware tessellation,
      configurable rendering quality, stability testing, and monitoring of cooling
      behavior under sustained load.
  related-projects:
    - UNIGINE Valley
    - UNIGINE Superposition
    - UNIGINE Engine
  sources:
    - 'Official Heaven product page: https://benchmark.unigine.com/heaven'
    - 'Official Heaven user manual: https://benchmark.unigine.com/docs/heaven/User_Manual.pdf'
    - 'Official UNIGINE benchmark chronology: https://benchmark.unigine.com/'
  summary:
    - >
      Heaven Benchmark is UNIGINE's cross-platform graphics benchmark and stress
      workload for measuring GPU performance and investigating hardware or cooling
      instability.
  timeline:
    - '2009: UNIGINE introduced Heaven Benchmark.'
    - >
      2013: The official Heaven manual documented the established multi-platform
      benchmark and its Basic, Advanced, and Professional editions.
  usage:
    - >
      Users select a rendering API, resolution, quality, tessellation level, and preset
      before running the benchmark. Looping workloads can expose instability or cooling
      problems; comparable scores require the same settings and similar software
      environments.
