history:
  adoption-history:
    - >
      kubecfg's adoption is concentrated in teams that want Kubernetes manifests in
      version control but need stronger abstraction and reuse than plain YAML. Its
      documentation and README emphasize reviewable configuration changes, reproducible
      desired state, and disaster-recovery-friendly infrastructure-as-code practices.
    - >
      The Homebrew formula gives macOS and Linuxbrew users a package-manager path, while
      GitHub releases provide precompiled binaries for direct installation.
  package-nerd-significance:
    - >
      kubecfg is interesting to package nerds because it represents the Jsonnet branch
      of Kubernetes configuration tooling. In the package ecosystem it sits beside Helm
      and Kustomize, but its core bet is a general-purpose data-templating language
      rather than chart packages or patch overlays.
    - >
      Its small CLI shape also makes it a classic infrastructure-as-code package:
      installable by Homebrew, runnable in CI, and tied closely to the Kubernetes and
      Jsonnet release surfaces.
  project-history:
    - >
      The kubecfg/kubecfg repository was created on 2021-11-17, and the first GitHub
      release listed by the releases API, v0.23.0, was published on 2021-12-21. The
      README describes kubecfg as a tool for managing Kubernetes resources as code and
      notes its similarity to a similarly named internal Google tool.
    - >
      The project is intentionally thin around Jsonnet. Its README says kubecfg relies
      heavily on Jsonnet to describe Kubernetes resources and acts as a
      Kubernetes-specific wrapper around Jsonnet evaluation.
  related-projects:
    - Jsonnet is the data-templating language kubecfg relies on.
    - Kubernetes is the target resource API.
    - >
      Helm and Kustomize solve adjacent Kubernetes configuration packaging and
      customization problems with different models.
  sources:
    - https://api.github.com/repos/kubecfg/kubecfg
    - https://api.github.com/repos/kubecfg/kubecfg/releases
    - https://formulae.brew.sh/formula/kubecfg
    - https://github.com/kubecfg/kubecfg
    - https://jsonnet.org/
    - https://kubecfg.github.io/kubecfg
  summary:
    - >
      kubecfg is a Kubernetes configuration-management CLI built around Jsonnet. It lets
      teams describe Kubernetes resources as reusable code, render or diff them, and
      apply the resulting desired state to clusters.
  timeline:
    - '2021-11-17: GitHub repository created.'
    - '2021-12-21: GitHub release v0.23.0 published.'
    - '2021-12-22: GitHub release v0.24.0 published.'
    - '2026-05-28: GitHub release v0.37.0 published.'
  usage:
    - >
      Users write Jsonnet, JSON, or YAML inputs, then use kubecfg show, diff, update,
      and delete against Kubernetes resources. The README quickstart demonstrates
      rendering YAML, applying objects, comparing local desired state with the server,
      updating the cluster, and deleting the demo resources.
    - >
      Features such as dependency-aware sorting, extra Jsonnet builtins, and optional
      garbage collection make kubecfg fit repositories where Kubernetes configuration is
      treated as code rather than as hand-edited deployment YAML.
related-packages:
  - id: brew:jsonnet
    reason: >
      Use the Jsonnet CLI to develop and test the data templates that kubecfg evaluates
      before applying their Kubernetes-specific output.
    rel: adjacent_workflow
    sources:
      - https://github.com/kubecfg/kubecfg
      - https://jsonnet.org/learning/getting_started.html
