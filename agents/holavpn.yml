history:
  adoption-history:
    - >
      Hola's official materials say the service was founded in 2008 and report adoption
      in the hundreds of millions of users or downloads. These figures are vendor claims
      and vary among pages.
    - >
      The product expanded across browser extensions, desktop and mobile applications,
      televisions, game consoles, and routers. Hola distinguishes its community-powered
      free network from Premium service, which uses dedicated servers and does not use
      the subscriber's device as a peer.
  package-nerd-significance:
    - >
      Hola is unusual among consumer VPN packages because its free service uses a
      peer-to-peer value-exchange model: users receive routing service while
      contributing limited idle network and processing resources. That architecture
      materially differs from a conventional server-only VPN and is important context
      when selecting the package.
  project-history:
    - >
      Hola VPN Ltd. describes Hola as a community-powered internet service founded in
      2008. Its products evolved into free and Premium offerings spanning browser-level
      proxying and full-device VPN applications.
  related-projects:
    - >
      Hola's official FAQ identifies Bright Data as the commercial user of resources
      contributed through the consumer peer network.
    - Hola Browser and Hola browser extensions provide related proxy-based access modes.
  sources:
    - https://hola.org/faq
    - https://hola.org/faq_macos
    - https://hola.org/products/desktop
    - https://hola.org/support/troubleshooting/mac
  summary:
    - >
      Hola VPN is a consumer location-routing service whose free offering uses a
      community-powered peer-to-peer network and whose Premium offering uses dedicated
      servers.
  timeline:
    - '2008: Hola was founded, according to its official FAQ.'
    - >
      2026: The official desktop product supported Windows and macOS, while Premium
      accounts supported multiple device classes.
  usage:
    - >
      On macOS, users open the application, sign in or create an account, select a
      country, and enable the central connection switch. The app installs the required
      VPN configuration automatically.
    - >
      The macOS FAQ documents a three-day trial followed by Premium subscription
      requirements for that app. A Premium account can be used on up to ten concurrent
      devices.
