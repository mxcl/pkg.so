history:
  adoption-history:
    - >
      libcoap's adoption follows the embedded and IoT networking ecosystem rather than
      desktop application culture. Its README names hosted environments including
      Contiki-NG, Espressif ESP-IDF, LwIP, and RIOT-OS, which explains why package
      managers ship both library artifacts and tools such as `coap-client`,
      `coap-server`, and `coap-rd`.
  package-nerd-significance:
    - >
      libcoap is package-nerd relevant because it is a small C library sitting at the
      boundary between standards work and actual device networks. It is the installable
      thing that turns RFC language about constrained REST into commands a maintainer
      can run against embedded boards, gateways, and simulators.
  project-history:
    - >
      The repository identifies libcoap as a C implementation of CoAP and carries
      copyright years beginning in 2010 for Olaf Bergmann and contributors. That places
      the project in the early CoAP implementation wave before the protocol was
      published as RFC 7252 in June 2014.
    - >
      As CoAP grew from a basic REST-like protocol for constrained devices into a family
      of RFC extensions, libcoap accumulated support for related specifications
      including group communication, observing resources, block-wise transfers, CoAP
      over TCP/TLS/WebSockets, OSCORE, hop limit, and echo/request-token processing.
  related-projects:
    - >
      Related projects and standards include RFC 7252 CoAP, Contiki-NG, RIOT-OS, LwIP,
      Espressif ESP-IDF, OSCORE, and the libcoap-minimal examples referenced by the
      project.
  sources:
    - https://datatracker.ietf.org/doc/html/rfc7252
    - https://formulae.brew.sh/formula/libcoap
    - https://github.com/obgm/libcoap
    - https://libcoap.net/
  summary:
    - >
      libcoap is a C implementation of the Constrained Application Protocol, the IETF
      protocol standardized as RFC 7252 for low-power, lossy, and memory-constrained
      networks. It gives Unix and embedded developers a reusable CoAP parser, networking
      layer, examples, and client/server tools.
  timeline:
    - >
      2010: Copyright range in the official repository begins for Olaf Bergmann and
      contributors.
    - '2014-06: RFC 7252 published CoAP as an Internet Standards Track protocol.'
    - >
      2020s: Repository documents support for multiple CoAP extension RFCs and embedded
      environments.
  usage:
    - >
      Developers use libcoap to build CoAP clients, servers, resource directories, and
      test fixtures. Homebrew exposes separate OpenSSL-suffixed tools in addition to the
      base client, server, and resource-directory commands, making it useful both as a
      development library and a packet-level debugging utility.
