history:
  adoption-history:
    - >
      The native application builds on recognition of the separately distributed free
      Mole CLI, whose public repository has attracted a large contributor and user
      community. The desktop product targets users who want the same maintenance domain
      presented through a native visual interface.
  package-nerd-significance:
    - >
      Mole is notable because its commercial native application and free open-source CLI
      address overlapping macOS maintenance workflows for different audiences. The cask
      packages the native graphical product, not merely the terminal utility.
  project-history:
    - >
      Mole is a native macOS maintenance application by tw93. It combines cleanup,
      application management, maintenance tasks, disk analysis, live system monitoring,
      menu-bar metrics, privacy alerts, battery care, and fan control in one paid
      desktop product. Its official site distinguishes this application from the free,
      open-source Mole CLI.
  related-projects:
    - >
      The official site positions the native application as covering work commonly split
      among CleanMyMac, AppCleaner, DaisyDisk, iStat Menus, and Sensei. It is related
      to, but distinct from, tw93's open-source Mole CLI.
  sources:
    - https://mole.fit/
  summary:
    - >
      Mole is a commercial native Mac cleaner, application manager, disk analyzer,
      optimizer, and system monitor.
  timeline:
    - '2020s: The free Mole CLI developed an open-source contributor community.'
    - >
      2026: The official site offered the native Mole application as a separate
      one-time-purchase product.
  usage:
    - >
      Users review reclaimable caches and temporary files, uninstall applications with
      leftovers, run supported macOS maintenance tasks, inspect disk usage with a
      treemap, and monitor CPU, memory, GPU, disk, network, battery, temperature, and
      fans.
