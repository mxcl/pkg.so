history:
  adoption-history:
    - >
      Adoption is concentrated among developers who need reproducible low-overhead
      timing for cryptography, benchmarking, and systems tuning. Its appearance in
      Homebrew, Debian, Ubuntu, Fedora-family packages, and Nix reflects a
      package-manager role as a tiny measurement primitive rather than an end-user
      application.
  package-nerd-significance:
    - >
      libcpucycles is package-nerd interesting because it packages the messy hardware
      reality of cycle counters into a minimal library. It is deliberately small, but
      its value is in the portability table: one dependency handles CPU families and OS
      timing APIs that would otherwise become build-system conditionals in every
      benchmark.
  project-history:
    - >
      The official introduction describes libcpucycles as a microlibrary for cycle
      counting, with a simple API: include `cpucycles.h`, call `cpucycles()`, and link
      with `-lcpucycles`. The project abstracts machine-level counters such as amd64
      TSC/PMC, ARM counters, RISC-V counters, and OS fallbacks such as
      `mach_absolute_time`, `perf_event`, `CLOCK_MONOTONIC`, and `gettimeofday`.
    - >
      The release notes visible in the 20250925 documentation show active portability
      work after the early 2023 tarballs, including s390x counter support, FreeBSD
      support, arm32-1176 support, a `cpucycles-info` man page, and macOS build fixes.
  related-projects:
    - >
      Related projects include the broader cr.yp.to software family,
      architecture-specific cycle counters such as TSC and PMC, Linux `perf_event`,
      POSIX clocks, and benchmarking code in cryptographic libraries.
  sources:
    - https://cpucycles.cr.yp.to/
    - https://cpucycles.cr.yp.to/libcpucycles-20250925/doc/api.md.html
    - https://cpucycles.cr.yp.to/libcpucycles-20250925/doc/download.md.html
    - https://formulae.brew.sh/formula/libcpucycles
  summary:
    - >
      libcpucycles is a small timing library for counting CPU cycles across multiple CPU
      and operating-system counter mechanisms. It comes from the cr.yp.to ecosystem
      associated with Daniel J. Bernstein's performance-oriented cryptographic and
      systems software.
  timeline:
    - '2023-01-10: Release notes document `cpucycles_version()` and s390x counter work.'
    - '2023-01-15: Release notes mention behavior alignment for `cpucycles_version()`.'
    - >
      2024-01-14: Release notes add arm32-1176 counter support, FreeBSD support, and
      install/license documentation updates.
    - '2024-03-18: Release notes mention macOS porting fixes and the `cpucycles-info` man page.'
    - '2025-09-25: Documentation tree published for libcpucycles-20250925.'
  usage:
    - >
      Programmers use libcpucycles when they want an architecture-aware cycle counter
      without writing per-platform assembly and fallback code. Package users also get
      tools such as `cpucycles-info` and `cpucycles-open`, which help inspect available
      counters and support benchmarking workflows.
