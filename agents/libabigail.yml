config-file-location:
  unix:
    - ~/.abignore
    - $libdir/libabigail/default.abignore
credentials-file-location: null
history:
  adoption-history:
    - >
      libabigail became important in distribution and platform engineering because ABI
      breaks are expensive when shared libraries are consumed by many separately built
      packages. Red Hat engineering articles describe it as a tool for long-term ABI
      maintenance, and Android carried an external libabigail tree for ABI-related
      tooling before replacing that tree with a tombstone in 2024.
  package-nerd-significance:
    - >
      For package maintainers, libabigail is one of the canonical tools for turning ABI
      compatibility from tribal knowledge into CI output. It matters when sonames,
      distro updates, and rebuild policies meet real binary compatibility.
  project-history:
    - >
      The project grew around the idea that ABI-relevant artifacts - types, variables,
      functions, declarations, and their binary/debug-information representations -
      should be modeled explicitly and compared mechanically. Sourceware hosts the
      project page, Git repository, mailing list, bug tracker, tarballs, and generated
      manuals.
  related-projects:
    - >
      Related projects include elfutils, DWARF tooling, Linux distribution package QA,
      Android ABI tooling, and CI systems that gate shared-library compatibility.
  sources:
    - >
      https://developers.redhat.com/articles/2024/05/20/application-binary-interface-compatibility-testing-libabigail
    - >
      https://developers.redhat.com/blog/2019/03/06/changes-made-to-the-libabigail-abi-change-analysis-framework-in-2018
    - https://sourceware.org/libabigail
    - https://sourceware.org/libabigail/manual
    - https://sourceware.org/libabigail/manual/libabigail-tools.html
  summary:
    - >
      libabigail, the ABI Generic Analysis and Instrumentation Library, is a Sourceware
      project for building, serializing, comparing, and reporting on ABI corpora. Its
      command-line tools make ABI compatibility checks scriptable for C and C++
      shared-library ecosystems.
  timeline:
    - >
      2010s: libabigail developed on Sourceware as a library and tool suite for ABI
      corpus analysis.
    - '2018: Red Hat documented major work across libabigail 1.2, 1.3, 1.4, and 1.5.'
    - >
      2024-05-20: Red Hat described libabigail-based ABI compatibility testing workflows
      for binaries across distributions and versions.
  usage:
    - >
      The package exposes tools such as abidiff, abidw, abicompat, abipkgdiff, abilint,
      and kmidiff. They are used to compare binaries, inspect ABI XML, compare packages,
      and check kernel module interface differences.
related-packages:
  - id: brew:elfutils
    reason: >
      elfutils supplies the ELF, DWARF, and debuginfod facilities that libabigail uses
      to inspect binaries and locate separate debugging information.
    rel: adjacent_workflow
    sources:
      - https://sourceware.org/libabigail/
      - https://sourceware.org/elfutils/
      - https://sourceware.org/elfutils/Debuginfod.html
