      scale.
  package-nerd-significance:
    - >
      uBar illustrates the desktop-customization utilities distributed through Homebrew
      Cask: a graphical application whose installation can be managed alongside
      command-line tools.
  project-history:
    - >
      Brawer’s uBar developed as a configurable macOS taskbar and Dock replacement. Its
      second generation was a rewrite for OS X Mavericks; the third added positioning on
      every screen edge, window previews, and user-created timepieces.
  related-projects:
    - macOS Dock; Homebrew Cask.
