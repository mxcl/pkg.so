  summary:
    - >
      uBar is a commercial macOS application for switching between applications and
      windows through a configurable taskbar.
  timeline:
    - '2014: uBar 2 introduced a rewrite for OS X 10.9 and later.'
    - '2015: uBar 3 added edge positioning, window previews, and custom timepieces.'
  usage:
    - >
      Users configure window grouping, favorites, display placement, and appearance
      through preferences. Custom timepieces use a Timepiece.plist and associated PNG
      assets.
