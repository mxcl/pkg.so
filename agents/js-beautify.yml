id: brew:js-beautify
display-name: JS Beautifier
repo: https://github.com/beautifier/js-beautify
docs:
  - https://beautifier.io/
  - https://github.com/beautifier/js-beautify#readme
config-file-location:
  unix:
    - .jsbeautifyrc
credentials-file-location: null
history:
  adoption-history:
    - >
      JS Beautifier spread through npm, Homebrew, and direct browser use because it
      solved a common web-development task before formatter-on-save workflows were
      standard. Its GitHub repository has thousands of stars and many forks, and the
      package-manager footprint reflects long-lived demand for a simple
      beautify/unobfuscate command.
  package-nerd-significance:
    - >
      js-beautify is significant because it captures an earlier era of JavaScript
      tooling: before bundlers, minifiers, linters, and opinionated formatters all
      converged into modern frontend toolchains, a small beautifier package could become
      infrastructure for editors, web tools, distro packages, and debugging workflows.
  project-history:
    - >
      The GitHub repository was created in December 2008, and the README describes the
      tool as a way to reformat bookmarklets, ugly JavaScript, scripts packed by Dean
      Edwards' packer, and output from JavaScript obfuscators. The project grew from
      JavaScript beautification into a multi-language web-source formatter with
      command-line binaries for JavaScript, CSS, and HTML.
    - >
      The npm package history begins in July 2012 and shows steady releases across the
      1.x line for more than a decade. The project also maintains beautifier.io as the
      browser-facing interface, making the same lineage visible both to CLI users and to
      developers pasting code into an online beautifier.
  related-projects:
    - >
      Related projects include beautifier.io, the Python jsbeautifier distribution,
      Prettier, ESLint formatting workflows, Dean Edwards' packer, and other source
      beautifiers embedded in editors and web debugging tools.
  sources:
    - https://beautifier.io/
    - https://formulae.brew.sh/formula/js-beautify
    - https://github.com/beautifier/js-beautify
    - https://github.com/beautifier/js-beautify/blob/main/CHANGELOG.md
    - https://registry.npmjs.org/js-beautify
    - https://www.npmjs.com/package/js-beautify
  summary:
    - >
      JS Beautifier, distributed as js-beautify, is a formatter and de-obfuscation tool
      for JavaScript, JSON, CSS, SCSS, HTML, and related web syntaxes. It predates the
      formatter monoculture around Prettier and remains a familiar CLI and web tool for
      turning minified or packed frontend code back into readable source.
  timeline:
    - '2008: GitHub repository created for js-beautify.'
    - '2012: npm package publication history began with 0.1.8.'
    - '2013: 1.x releases established the package as a stable CLI-era JavaScript beautifier.'
    - '2024: 1.15.0 shipped in the long-running 1.x release line.'
    - >
      2026: 2.x releases appeared on npm and the beautifier.io interface identified
      itself with the 2.x line.
  usage:
    - >
      The CLI is used to re-indent source files, inspect minified production JavaScript,
      normalize generated HTML or CSS, and run formatter settings from a .jsbeautifyrc
      file. It is more of a readability and recovery tool than a modern opinionated
      style enforcer.
related-packages:
  - id: brew:prettier
    reason: >
      Choose Prettier when you want an opinionated formatter that reprints supported
      languages to enforce one consistent project style; choose JS Beautifier when
      configurability or beautifying packed and obfuscated web source is more important.
    rel: alternative
    sources:
      - https://github.com/beautifier/js-beautify
      - https://prettier.io/docs/
      - https://prettier.io/docs/option-philosophy
