id: brew:aws-spiffe-workload-helper
display-name: AWS SPIFFE Workload Helper
repo: null
docs:
  - https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRoleWithWebIdentity.html
  - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sourcing-external.html
  - https://docs.aws.amazon.com/rolesanywhere/latest/userguide/introduction.html
  - https://github.com/spiffe/aws-spiffe-workload-helper#readme
config-file-location:
  unix:
    - ~/.aws/config
credentials-file-location: null
history:
  adoption-history:
    - >
      The repository is a SPIFFE tiny-project and remains a narrow integration tool
      rather than a broad CLI ecosystem. Its GitHub releases reached v0.0.5 on February
      16, 2026.
  package-nerd-significance:
    - >
      The package is notable because it bridges SPIFFE Workload API identity, AWS Roles
      Anywhere, AWS STS, and the AWS external credential process contract in a single
      distributable binary.
  project-history:
    - >
      The official README describes the helper as a lightweight tool for providing
      workloads with AWS credentials using SPIFFE identity, with support for X.509 SVIDs
      through AWS Roles Anywhere and JWT SVIDs through AssumeRoleWithWebIdentity.
  related-projects:
    - SPIFFE and the SPIFFE Workload API provide the identity source.
    - >
      AWS Roles Anywhere and AWS STS AssumeRoleWithWebIdentity provide AWS credential
      exchange targets.
    - >
      AWS rolesanywhere-credential-helper is the AWS tool the README compares this
      helper against.
  sources:
    - https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRoleWithWebIdentity.html
    - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sourcing-external.html
    - https://docs.aws.amazon.com/rolesanywhere/latest/userguide/introduction.html
    - https://github.com/spiffe/aws-spiffe-workload-helper#readme
    - https://github.com/spiffe/aws-spiffe-workload-helper/releases
  summary:
    - >
      AWS SPIFFE Workload Helper is a SPIFFE project helper for obtaining AWS
      credentials from SPIFFE workload identities.
  timeline:
    - '2024: Initial public development began in the official repository.'
    - '2025: Early v0.0.x releases were published.'
    - '2026: v0.0.5 was published on GitHub Releases.'
  usage:
    - >
      Users configure AWS SDKs and CLIs by setting `credential_process` in
      `~/.aws/config` to invoke `aws-spiffe-workload-helper`. The helper can return
      credentials to stdout or write a user-specified credential file for legacy
      consumers.
related-packages:
  - id: brew:rolesanywhere-credential-helper
    reason: >
      Choose AWS's credential helper for general X.509-based IAM Roles Anywhere use;
      choose AWS SPIFFE Workload Helper when the certificate is an SVID obtained
      directly from the SPIFFE Workload API.
    rel: alternative
    sources:
      - https://github.com/spiffe/aws-spiffe-workload-helper#readme
      - https://github.com/aws/rolesanywhere-credential-helper
  - id: brew:spiffe-helper
    reason: >
      SPIFFE Helper can materialize and renew SVID files for file-oriented workloads,
      while AWS SPIFFE Workload Helper directly exchanges SVIDs for AWS credentials.
    rel: adjacent_workflow
    sources:
      - https://github.com/spiffe/spiffe-helper#readme
      - https://github.com/spiffe/aws-spiffe-workload-helper#readme
