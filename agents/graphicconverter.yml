history:
  adoption-history:
    - >
      Developed continuously for the Mac since 1992, GraphicConverter grew from a
      personal conversion utility into a long-running shareware product. Lemke Software
      says it has attracted more than 1.5 million users.
    - The supplied package metadata records distribution through the Homebrew cask ecosystem.
  package-nerd-significance:
    - >
      GraphicConverter is a durable example of classic Mac shareware: a focused
      file-format converter that accumulated browser, metadata, batch-processing, and
      full image-editing capabilities over decades.
    - >
      Its unusually broad format support makes it useful for opening, inspecting, and
      converting uncommon or legacy graphics without adopting a database-centered photo
      workflow.
  project-history:
    - >
      Thorsten Lemke began developing GraphicConverter in 1992 as a solution to an
      image-conversion problem. Continued development expanded it into an image browser,
      editor, metadata tool, and batch converter.
    - >
      The official version history documents many major generations, including
      GraphicConverter 11 in 2019 and GraphicConverter 12 in 2023.
  related-projects:
    - Lemke Software also develops tools including CADintosh, FontBook, and EXIF Sync.
  sources:
    - https://www.lemkesoft.de/en/products/graphicconverter
    - https://www.lemkesoft.de/fileadmin/pdf/en/manual_en.pdf
    - https://www.lemkesoft.de/index.php?L=1&id=32
    - https://www.lemkesoft.de/produkte/graphicconverter/versionsuebersicht
    - source_facts.package-manager.brew-cask
  summary:
    - >
      GraphicConverter is a long-lived macOS image utility from Thorsten Lemke and Lemke
      Software. It began as a format converter and evolved into a broad image-management
      and editing application.
  timeline:
    - '1992: Thorsten Lemke began developing GraphicConverter.'
    - '2019: GraphicConverter 11 was released.'
    - '2023: GraphicConverter 12 was released.'
  usage:
    - >
      Users browse folders of images, inspect metadata, edit pictures, run batch
      conversions, and export files in different graphics formats.
    - >
      Its browser operates directly on files, making it suitable for large conversion or
      organization jobs without first importing images into a library.
