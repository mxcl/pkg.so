history:
  adoption-history:
    - >
      The README highlights integrations with editor and IDE workflows, including
      Sublime Text, Emacs, Vim, Atom, Visual Studio Code, and GoLand. That adoption
      pattern made gotests useful as both a terminal command and an editor action for
      quickly producing test skeletons.
  package-nerd-significance:
    - >
      gotests is the sort of package that shows how Go tooling tends to compose: it is
      not a test framework, but a small generator that feeds ordinary go test workflows
      and leaves normal Go source behind.
  project-history:
    - >
      The repository was created in January 2016 and published early 1.x releases in
      2016. The README describes the tool as a generator for table-driven tests and
      documents command-line filters for exported functions, named tests, recursive
      package traversal, templates, and writing generated tests back to files.
  related-projects:
    - Go's table-driven test idiom is the coding style gotests automates.
    - >
      Go editor integrations such as VS Code Go and Vim plugins provide interactive
      entry points for generated tests.
  sources:
    - https://formulae.brew.sh/formula/gotests
    - https://github.com/cweill/gotests
    - https://github.com/cweill/gotests#readme
    - https://github.com/cweill/gotests/releases
  summary:
    - >
      gotests is a Go test-boilerplate generator. It analyzes functions and methods and
      emits table-driven test scaffolding, fitting the Go community's preference for
      generated but editable test code.
  timeline:
    - '2016: Repository created and v1.0 published.'
    - '2020: v1.6.0 release published.'
    - '2025: v1.8.0 release described full Go generics support.'
    - '2025: v1.9.0 release described local AI-powered test generation through Ollama.'
  usage:
    - >
      Typical usage is to run gotests against files or packages, optionally selecting
      specific functions, exported APIs, custom templates, or testify-style output.
      Later releases added full Go generics support and an optional local-LLM mode
      through Ollama for generating test cases.
related-packages:
  - id: brew:gotestsum
    reason: >
      Use gotests to create editable Go test scaffolding, then run the resulting
      standard Go tests with gotestsum when you want concise local output, reruns, watch
      mode, or JUnit reports for CI.
    rel: adjacent_workflow
    sources:
      - https://github.com/cweill/gotests#readme
      - https://github.com/gotestyourself/gotestsum#readme
