history:
  adoption-history:
    - >
      KeyScreen is distributed directly, through the Mac App Store, and through Homebrew
      Cask. Its official positioning targets tutorial authors, streamers, presenters,
      and software demonstrators.
  package-nerd-significance:
    - >
      KeyScreen represents the small but enduring macOS utility category of input
      visualizers used alongside capture, streaming, and presentation software. Homebrew
      Cask makes this graphical workflow reproducible from the command line.
  project-history:
    - >
      KeyScreen was created as a native macOS utility for displaying keyboard input as
      an on-screen overlay. The product evolved to include configurable appearance,
      multiple displays, global controls, special-key handling, and reusable themes.
  related-projects:
    - >
      Presentify is the developer’s complementary screen-annotation and
      pointer-highlighting application. Recording and streaming applications such as OBS
      and presentation software consume KeyScreen’s visible overlay.
  sources:
    - https://keyscreen.app/
    - https://keyscreen.app/faq
    - source_facts.package-manager
  summary:
    - >
      KeyScreen is a macOS keystroke-visualization application from Softal Limited. It
      presents key presses as a customizable overlay for recordings, tutorials, streams,
      presentations, and live demonstrations.
  timeline:
    - >
      2026: The official site identifies Softal Limited as the publisher and documents
      direct, Mac App Store, and Homebrew distribution.
  usage:
    - >
      Users choose which ordinary, modifier, function, and special keys to show,
      customize the overlay’s font, color, size, position, opacity, and animation, and
      place it on one or more displays. The app processes input locally and excludes
      password-field keystrokes.
