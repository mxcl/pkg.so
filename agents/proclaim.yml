history:
  adoption-history:
    - >
      Proclaim was designed for church staff and volunteer presentation teams. Its cloud
      collaboration, team licensing, and integrations with worship and Bible-study
      services position it as a specialized alternative to general slide software.
  package-nerd-significance:
    - >
      Proclaim is notable as a domain-specific presentation package whose cloud
      synchronization, media catalog, song reporting, remote control, and broadcast
      interfaces are integrated into one desktop workflow.
  project-history:
    - >
      Logos announced Proclaim before release in 2011 and officially records its release
      in 2012. It became part of the wider Logos/Faithlife ecosystem for church
      presentations, Bible content, sermons, and group collaboration.
    - >
      The product subsequently expanded beyond projected slides into sermon recording
      and publishing, digital signage, livestreaming, remote control, and integrations
      such as CCLI SongSelect, MIDI, NDI, and SDI.
  related-projects:
    - Logos Bible Software supplies an integrated Bible-study and sermon workflow.
    - Proclaim Remote provides remote presentation control.
    - CCLI SongSelect and Planning Center are supported workflow integrations.
  sources:
    - https://faithlife.com/fast-facts
    - https://faithlife.com/history
    - https://proclaim.logos.com/
    - >
      https://support.proclaim.logos.com/hc/en-us/articles/19863185772813-Get-Started-with-Proclaim
  summary:
    - >
      Proclaim is cloud-based church presentation software from Logos, formerly
      operating under the Faithlife brand. It combines collaborative service preparation
      with live presentation, media, recording, streaming, and publishing tools.
  timeline:
    - '2011: Logos publicly announced Proclaim and ran a beta.'
    - '2012: Proclaim Church Presentation Software was officially released.'
    - '2020: Proclaim 3.0 added features aimed at livestreaming and connected church workflows.'
  usage:
    - >
      Church teams use Proclaim to prepare service orders and slides collaboratively,
      present lyrics and Scripture across multiple displays, operate confidence
      monitors, and manage on-air content.
    - >
      Presentations synchronize through the service, but official guidance says required
      presentation content is downloaded locally so a prepared service can continue
      during a network interruption. Presentations can also be backed up to and restored
      from a .prs file.
