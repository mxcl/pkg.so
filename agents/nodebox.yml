history:
  adoption-history:
    - >
      NodeBox 3 accumulated a library of visual nodes, tutorials, examples, and
      extension points for Python and Clojure. Its official release record shows
      sustained maintenance across macOS and Windows, including a long-lived 3.0 series
      and a native Apple Silicon release in 2026.
  package-nerd-significance:
    - >
      NodeBox sits at the intersection of creative coding and visual programming. Its
      graph-based, non-destructive model makes procedural graphics accessible without
      requiring every user to write a complete program, while its extensible nodes still
      expose code-oriented workflows.
  project-history:
    - >
      NodeBox 3 emerged as a node-based successor within the broader NodeBox family. The
      project dropped the alpha marker in December 2012, signaling that NodeBox 3 was
      considered stable enough for regular use. Development continued through
      visualization, animation, data-import, export, and platform-support improvements.
  related-projects:
    - >
      The official site also preserves NodeBox 1, a Python-oriented 2D graphics
      environment, and NodeBox OpenGL, a hardware-accelerated graphics library.
  sources:
    - https://github.com/nodebox/nodebox
    - https://www.nodebox.net/node/
    - https://www.nodebox.net/node/documentation/
    - https://www.nodebox.net/node/release-notes
  summary:
    - >
      NodeBox is an open-source visual programming application for procedural graphics,
      generative design, animation, and data visualization.
  timeline:
    - '2012: NodeBox 3 dropped its alpha version marker.'
    - '2013: Early stable releases expanded device, data, full-screen, and example support.'
    - '2021: Version 3.0.52 restored movie export on newer macOS releases.'
    - '2026: Version 3.1.0 added a native Apple Silicon build.'
  usage:
    - >
      Users construct networks of connected nodes that generate and transform geometry,
      data, text, color, and animation. Projects are saved as .ndbx documents and can
      export visual results such as PDF, images, or movies. Advanced users can implement
      nodes with Python, Clojure, or Java-backed functions.
