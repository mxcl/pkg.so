history:
  adoption-history:
    - >
      The founders took the company through Y Combinator and scaled the product as a
      cloud business-phone platform for small and medium-sized organizations.
    - >
      In September 2025, OpenPhone became Quo. The company described the change as a
      continuation of the existing product and mission, accompanied by a broader
      front-office direction and an expanded AI agent named Sona.
  package-nerd-significance:
    - >
      The Homebrew cask packages the desktop client of an account-backed, cross-platform
      communications service rather than a self-contained local utility. It is an
      example of package managers serving as a convenient installation and update
      channel for SaaS desktop front ends.
  project-history:
    - >
      Mahyar Raissi and Daryna Kulya founded the company in 2018 after observing that
      small-business operators often depended on personal telephone numbers. The first
      product was a modern business phone under the OpenPhone name.
    - >
      The platform developed into a collaborative VoIP system spanning desktop, mobile,
      and web clients, with shared numbers, team workflows, integrations, analytics,
      automation, and AI-assisted communications.
  related-projects:
    - Quo was formerly named OpenPhone.
    - Sona is Quo's AI front-office agent.
  sources:
    - 'Official Resource Center: https://support.quo.com/'
    - 'Official company history: https://www.quo.com/about'
    - 'Official introduction: https://support.quo.com/getting-started/introduction'
    - 'Official rebrand announcement: https://www.quo.com/blog/next-chapter/'
  summary:
    - >
      Quo, formerly OpenPhone, is a cloud VoIP and business-communications platform for
      teams, providing calling, messaging, shared numbers, collaboration, automation,
      and AI-assisted features.
  timeline:
    - '2018: Mahyar Raissi and Daryna Kulya founded the company behind OpenPhone.'
    - >
      2025: OpenPhone rebranded as Quo and expanded its front-office positioning and
      Sona AI agent.
  usage:
    - >
      Organizations create a workspace, obtain or port business telephone numbers,
      invite team members, and use desktop, mobile, or browser clients to handle calls,
      messages, voicemail, and shared customer conversations.
    - >
      The service requires an internet connection and a Quo account; configuration is
      managed through the application and service settings rather than a documented
      local configuration file.
