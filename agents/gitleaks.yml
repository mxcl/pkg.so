history:
  adoption-history:
    - >
      Gitleaks gained strong adoption in the DevSecOps ecosystem because it fits several
      control points: developer workstations, pre-commit hooks, pull-request checks,
      scheduled repository scans, and containerized CI jobs. The project homepage cites
      large Docker, GitHub release, and Homebrew usage figures, and the GitHub
      repository has a large star and fork count.
    - >
      The official Gitleaks GitHub Action widened adoption by giving teams a hosted-CI
      path for scanning pull requests and commits without writing their own wrapper
      around the CLI.
  package-nerd-significance:
    - >
      Gitleaks is a package-manager favorite because it is a Go security utility with
      broad platform binaries, Docker images, a pre-commit hook, and an official action.
      That combination makes it easy to pin in reproducible developer environments and
      CI toolchains.
  project-history:
    - >
      The GitHub repository was created in January 2018 and grew around a rule-based
      scanner for passwords, API keys, and tokens. The project is written in Go and
      ships a default TOML configuration containing detection rules and allowlists.
    - >
      The v8 command model consolidated scanning around git, dir, and stdin modes, while
      older detect and protect commands were hidden for compatibility. The README later
      described the project as feature complete, with security patches as the
      maintenance focus and Betterleaks named as the author's new direction.
  related-projects:
    - >
      Gitleaks Action is the official GitHub Action for running scans on pull requests,
      commits, or on demand.
    - >
      Betterleaks is named by the maintainer as the follow-on project receiving new
      feature work.
  sources:
    - https://api.github.com/repos/gitleaks/gitleaks
    - https://github.com/gitleaks/gitleaks
    - https://gitleaks.io/
    - https://raw.githubusercontent.com/gitleaks/gitleaks/master/README.md
    - https://raw.githubusercontent.com/gitleaks/gitleaks/master/config/gitleaks.toml
  summary:
    - >
      Gitleaks is an open-source secret scanner for Git repositories, files,
      directories, and standard input. It is best known as a fast CLI that can run
      locally, in pre-commit hooks, in containers, or in CI before leaked credentials
      reach shared history.
  timeline:
    - '2018: The gitleaks/gitleaks repository was created.'
    - '2022: v8-era releases emphasized the newer git, dir, and stdin scanning modes.'
    - >
      2024: v8.19.0 hid the older detect and protect commands in favor of the newer
      command names.
    - >
      2026: The README described Gitleaks as feature complete, with future releases
      focused on security patches.
  usage:
    - >
      Practitioners use gitleaks git to scan repository history, gitleaks dir to scan
      working trees or exported source, and gitleaks stdin for pipeline streams.
      Baseline reports let teams suppress already-known findings while failing builds
      for newly introduced secrets.
    - >
      Teams customize .gitleaks.toml when they need organization-specific rules,
      allowlists, report formats, or redaction behavior. In package-manager workflows,
      the single binary makes it easy to add secret scanning to local development and CI
      images without a language runtime.
related-packages:
  - id: brew:trufflehog
    reason: >
      Choose TruffleHog when live-credential verification and scanning sources beyond
      local code—such as cloud storage, container images, and hosted organizations—are
      primary requirements.
    rel: alternative
    sources:
      - https://github.com/gitleaks/gitleaks
      - https://github.com/trufflesecurity/trufflehog
  - id: brew:detect-secrets
    reason: >
      Choose detect-secrets when a reviewed baseline and plugin/filter model are
      preferable for preventing new findings in a large repository with accepted
      historical results.
    rel: alternative
    sources:
      - https://github.com/gitleaks/gitleaks
      - https://github.com/Yelp/detect-secrets
  - id: brew:git-secrets
    reason: >
      Choose git-secrets for a Git-hook-centered pattern blocker, particularly when AWS
      patterns or credential-file providers are central to the workflow.
    rel: alternative
    sources:
      - https://github.com/gitleaks/gitleaks
      - https://github.com/awslabs/git-secrets
  - id: brew:pre-commit
    reason: >
      Gitleaks officially documents a pre-commit configuration, while pre-commit
      installs and manages the hook environment that runs the scanner before commits are
      accepted.
    rel: adjacent_workflow
    sources:
      - https://github.com/gitleaks/gitleaks#pre-commit
      - https://pre-commit.com/
