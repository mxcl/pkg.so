history:
  adoption-history:
    - >
      Sonic Visualiser is distributed as free software for Windows, Linux, and macOS and
      is aimed at musicologists, archivists, signal-processing researchers, and other
      close listeners. Its official site provides a scholarly citation for research use.
    - >
      Development has received support from Queen Mary University of London and multiple
      European and UK research programs. Later releases were also maintained by
      Particular Programs before development support returned to Queen Mary's Centre for
      Digital Music.
  package-nerd-significance:
    - >
      Sonic Visualiser turns research-grade audio inspection into a general desktop
      workflow. Its layer-and-pane model can combine waveforms, spectrograms, manual
      annotations, imported data, MIDI, and algorithmically generated features while
      keeping them aligned in time.
    - >
      Its support for Vamp feature-extraction plugins makes it both a practical analysis
      tool and a host for reproducible music-information-retrieval experiments. Session
      files and exportable annotations also fit research and archival workflows.
  project-history:
    - >
      Sonic Visualiser was initiated at the Centre for Digital Music at Queen Mary
      University of London and was primarily developed by Chris Cannam with
      contributions from audio researchers and software developers.
    - >
      The project emerged in the mid-2000s and was documented academically in an ACM
      Multimedia paper in 2010. It has continued to evolve through major interface,
      platform, recording, large-file, and high-resolution-display improvements.
  related-projects:
    - Sonic Lineup
    - Sonic Annotator
    - Tony
    - Vamp plugins
    - Rubber Band Library
  sources:
    - https://github.com/sonic-visualiser/sonic-visualiser
    - https://www.sonicvisualiser.org/
    - https://www.sonicvisualiser.org/documentation.html
    - https://www.sonicvisualiser.org/sv2010.pdf
  summary:
    - >
      Sonic Visualiser is a free, open-source desktop application for detailed
      visualization, analysis, and annotation of music audio recordings.
  timeline:
    - >
      2005: The copyright history in the official repository marks the beginning of the
      project's early development.
    - >
      2010: The developers presented Sonic Visualiser as an open-source music-audio
      analysis application at ACM Multimedia.
    - >
      2017: Version 3.0 marked roughly a decade of continuous development at Queen
      Mary's Centre for Digital Music.
    - '2024: The official reference manual documented the 5.0.1 generation of the application.'
  usage:
    - >
      Users load recordings, arrange synchronized panes and layers, inspect waveforms
      and spectrograms, add time-aligned annotations, and run Vamp plugins to derive
      features such as beats or pitches. Sessions preserve the analysis layout, while
      annotations and selected audio regions can be exported.
