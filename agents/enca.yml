history:
  adoption-history:
    - >
      Enca's adoption has been mostly in Unix text-processing and distribution packaging
      rather than in application-level branding. Its value comes from being scriptable
      through the `enca` and `enconv` commands and from supporting Central and Eastern
      European language encodings alongside multibyte encodings.
  package-nerd-significance:
    - >
      Enca is a classic small Unix package: autoconf build, C library plus CLI frontend,
      optional converter backends, and a job that mostly appears when old text meets
      modern UTF-8 assumptions. It matters to packagers because charset detection and
      conversion bugs are painful, regional, and hard to replace with a generic shell
      one-liner.
  project-history:
    - >
      The README preserves a clear maintenance lineage: original copyright by David
      Necas from 2000 to 2003, later work by Michal Cihar from 2009 to 2016, and Project
      OSS Revival maintenance from 2025 to 2026. Michal Cihar's project page lists Enca
      1.19 and links the historical `nijel/enca` repository, while the package metadata
      points to the revived Project OSS Revival repository.
  related-projects:
    - >
      GNU recode, iconv, Perl Unicode::Map, and cstocs are documented as converter
      integrations or related tools.
    - libenca is the library component behind the command-line frontend.
  sources:
    - https://cihar.com/software/enca/
    - https://raw.githubusercontent.com/Project-OSS-Revival/enca/master/README.md
    - https://github.com/Project-OSS-Revival/enca
  summary:
    - >
      Enca, the Extremely Naive Charset Analyser, is a command-line tool and library for
      detecting text encodings and converting files through built-in and external
      converters. Its niche is old-fashioned but still practical: figuring out what
      character set a text file is using before a script or migration mangles it.
  timeline:
    - '2000-2003: Original Enca development credited to David Necas.'
    - '2009-2016: Michal Cihar maintained Enca and published 1.19-era releases.'
    - '2013: Public GitHub repository lineage was present on GitHub.'
    - '2025-2026: Project OSS Revival copyright appears in the revived README.'
  usage:
    - >
      Users run `enca` to guess an input file's encoding and `enconv` or converter
      integration to rewrite text into another encoding. The README documents optional
      use of GNU recode, iconv, Perl charset converters, and cstocs, which is exactly
      the kind of plumbing that made it useful in legacy text cleanup workflows.
related-packages:
  - id: brew:uchardet
    reason: >
      Choose uchardet when you want a compact Mozilla-derived, language-independent
      detector and library; choose Enca when language-specific analysis and integrated
      conversion backends are useful.
    rel: alternative
    sources:
      - https://www.freedesktop.org/wiki/Software/uchardet/
      - https://cihar.com/software/enca/
  - id: brew:recode
    reason: >
      Use GNU Recode with Enca when detection should feed a broad charset and
      surface-conversion workflow; Enca's official README documents recode as an
      optional converter backend.
    rel: adjacent_workflow
    sources:
      - https://github.com/Project-OSS-Revival/enca/blob/master/README.md
      - https://github.com/rrthomas/recode#readme
  - id: brew:libiconv
    reason: >
      Use GNU libiconv as Enca's conversion backend on systems needing its character-set
      coverage; Enca documents optional compilation against the UNIX98 iconv interface.
    rel: adjacent_workflow
    sources:
      - https://github.com/Project-OSS-Revival/enca/blob/master/README.md
      - https://www.gnu.org/software/libiconv/
