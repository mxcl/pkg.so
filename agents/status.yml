history:
  adoption-history:
    - >
      Status's contributors used early Status Desktop builds internally; in November
      2018 the project moved its core-contributor communication from Slack to the
      desktop alpha.
    - >
      After desktop development paused while the mobile application was prioritized,
      Status reintroduced Desktop beta 0.1.0 in September 2020 for macOS, Windows, and
      Linux.
    - >
      A rebuilt generation of the mobile and desktop applications entered broad public
      beta distribution in 2024, combining messaging, a multichain self-custodial
      wallet, and token-aware communities.
  package-nerd-significance:
    - >
      Status packages several decentralized-system roles in one desktop client:
      peer-to-peer encrypted messaging, community administration, identity based on
      cryptographic keys, and a self-custodial cryptocurrency wallet.
    - >
      Its local-first security model makes backup and upgrade behavior unusually
      important. Status cannot reset a forgotten password or recover a lost recovery
      phrase, and local backups remain on the user's device.
  project-history:
    - >
      Status was founded in 2017 around an open-source interface for Ethereum and
      decentralized applications, with private communication and user sovereignty as
      central goals.
    - >
      The desktop effort has gone through an early alpha, a pause while mobile work took
      priority, a 2020 reintroduction, and a later application rebuild. Desktop also
      became the platform for resource-intensive features such as full community
      administration and decentralized community-history archives.
  related-projects:
    - Waku provides peer-to-peer messaging technology used by Status.
    - Ethereum supplies the account and smart-contract ecosystem underlying Status Wallet.
    - Keycard is a related Status hardware project for protecting cryptographic keys.
  sources:
    - https://status.app/blog/re-introducing-status-desktop-beta-v0-1-0
    - >
      https://status.app/blog/status-desktop-v2-35-local-backups-new-home-page-performance-boosts-and-more
    - https://status.app/blog/status-mobile-desktop-releases
    - https://status.app/help/communities/about-the-community-history-service
    - https://status.app/help/profile/understand-your-status-keys-and-recovery-phrase
    - https://status.app/whitepaper.pdf
  summary:
    - >
      Status is an open-source desktop and mobile application combining decentralized
      encrypted messaging, communities, and a self-custodial cryptocurrency wallet.
  timeline:
    - '2017: The Status project was founded.'
    - >
      2018: Core contributors moved their internal communication from Slack to Status
      Desktop alpha.
    - '2020: Status Desktop beta 0.1.0 was reintroduced for macOS, Windows, and Linux.'
    - >
      2024: Rebuilt Status mobile and desktop applications entered broad public beta
      distribution.
    - '2025: Desktop 2.35 introduced automatic and manual local profile-data backups.'
  usage:
    - >
      Users create or restore a cryptographic profile, communicate through peer-to-peer
      messaging, participate in communities, and optionally manage assets through the
      integrated wallet.
    - >
      Users should securely record the recovery phrase and remember the profile
      password. Desktop can create local profile backups, but those backups do not
      replace the recovery phrase and, when introduced in version 2.35, did not include
      chat messages.
    - >
      The official documentation describes Status keys as securely stored on the device
      and protected by the Status password, but it does not document a stable standalone
      credentials-file path suitable for direct management.
