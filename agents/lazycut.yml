history:
  adoption-history:
    - >
      Official installation instructions list Homebrew for macOS and `go install` from
      source. GitHub repository metadata recorded 869 stars on July 1, 2026, which is
      meaningful visibility for a young single-purpose media CLI.
  package-nerd-significance:
    - >
      lazycut is package-nerd candy because it stacks classic Unix media tooling behind
      a discoverable TUI: FFmpeg does the media work, Chafa handles terminal graphics,
      and Homebrew makes the whole bundle one command away.
  project-history:
    - >
      The public repository was created on January 18, 2026. Releases followed quickly,
      from v0.1.2 on January 18, 2026, through v0.3.9 on March 26, 2026.
  related-projects:
    - >
      FFmpeg is the core media-processing dependency, while Chafa provides terminal
      graphics. lazycut sits near other terminal media tools that wrap complex
      command-line pipelines in keyboard-first interfaces.
  sources:
    - https://api.github.com/repos/ozemin/lazycut
    - https://api.github.com/repos/ozemin/lazycut/releases
    - https://ffmpeg.org
    - https://github.com/ozemin/lazycut
    - https://hpjansson.org/chafa/
  summary:
    - >
      lazycut is a Go terminal video trimmer that uses FFmpeg and Chafa to provide
      interactive media preview and export from the command line. Its public record is
      brief, but the package is interesting because it brings a traditionally GUI-heavy
      workflow into a Homebrew-installed TUI.
  timeline:
    - '2026: Public GitHub repository created'
    - '2026: v0.1.2 release published'
    - '2026: v0.3.9 release published'
  usage:
    - >
      The README documents `lazycut video.mp4` for an interactive TUI, `lazycut trim`
      for explicit in/out trimming, and `lazycut probe` for inspection. It supports
      keyboard-driven seeking, marking sections, preview, export, undo, mute, and
      aspect-ratio conversion.
related-packages:
  - id: brew:ffmpeg
    reason: >
      lazycut invokes FFmpeg for media probing and video processing, while supplying an
      interactive terminal interface for selecting the desired cuts.
    rel: adjacent_workflow
    sources:
      - https://github.com/ozemin/lazycut
      - https://ffmpeg.org/documentation.html
  - id: brew:chafa
    reason: >
      lazycut uses Chafa to render video previews inside the terminal, making it a
      direct runtime companion to the trimming workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/ozemin/lazycut
      - https://hpjansson.org/chafa/
