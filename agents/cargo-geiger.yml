config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      cargo-geiger found a niche in Rust security review and supply-chain auditing,
      especially among developers interested in minimizing or documenting unsafe code in
      dependencies.
    - >
      The README points users toward cargo-crev and safety-dance as audit contexts where
      cargo-geiger statistics can help. That positioning kept it from becoming a
      simplistic 'unsafe equals bad' badge while still making unsafe usage visible.
  package-nerd-significance:
    - >
      cargo-geiger is package-nerd significant because it made unsafe-code exposure a
      transitive package property that could be inspected like licenses, advisories, or
      dependency trees.
    - >
      It also shows Rust's audit culture maturing: package metadata alone is not enough,
      so tools emerged to summarize source-level risk signals across the dependency
      graph.
  project-history:
    - >
      The cargo-geiger repository and crate were created in June 2018. The README says
      the tool was originally based on code from cargo-osha and cargo-tree, combining
      unsafe-code scanning with dependency-tree traversal.
    - >
      Over time the project split reusable pieces into library crates, including
      `geiger` and `cargo-geiger-serde`. The changelog records substantial
      dependency-graph work in 0.11.0 using cargo_metadata and JSON/report serialization
      improvements.
  related-projects:
    - cargo-osha and cargo-tree are named by the README as original sources of code or ideas.
    - >
      cargo-crev and safety-dance are named as audit workflows where cargo-geiger output
      can provide statistical input.
    - >
      cargo_metadata became important to cargo-geiger's dependency-graph handling,
      according to the changelog.
  sources:
    - https://api.github.com/repos/geiger-rs/cargo-geiger
    - https://crates.io/crates/cargo-geiger
    - https://github.com/geiger-rs/cargo-geiger#readme
    - https://github.com/geiger-rs/cargo-geiger/blob/master/CHANGELOG.md
  summary:
    - >
      cargo-geiger is a Cargo subcommand that reports unsafe Rust usage in a crate and
      its dependency graph. Its name references a Geiger counter: unsafe code is treated
      as something worth detecting, measuring, and containing.
    - >
      The project is intentionally framed as audit input, not an automatic security
      verdict. Its README warns that unsafe usage is nuanced and that reports should be
      handled carefully.
  timeline:
    - '2018-06-20: GitHub repository created and cargo-geiger 0.1.0 published to crates.io.'
    - >
      2018-2019: Project builds on cargo-osha and cargo-tree ideas to scan crates and
      dependencies for unsafe usage.
    - >
      2020: 0.11.0 changelog records dependency-graph exploration through cargo_metadata
      and adds JSON/report serialization pieces.
    - '2026: Project remains active under geiger-rs with more than 190,000 crates.io downloads.'
  usage:
    - >
      Usage is intentionally simple: run `cargo geiger` from the directory containing
      the `Cargo.toml` to analyze. The tool reports unsafe-code statistics for the crate
      and dependencies.
    - >
      The README documents installation with `cargo install --locked cargo-geiger`, an
      optional vendored OpenSSL build, and prebuilt GitHub releases.
related-packages:
  - id: brew:cargo-crev
    reason: >
      Use cargo-crev alongside cargo-geiger when you want Geiger's unsafe-code metric
      incorporated into a broader dependency-review and web-of-trust workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/geiger-rs/cargo-geiger#readme
      - https://github.com/crev-dev/cargo-crev/blob/main/cargo-crev/src/doc/getting_started.md
