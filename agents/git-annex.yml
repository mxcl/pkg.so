id: brew:git-annex
display-name: git-annex
repo: https://source.git-annex.branchable.com/
docs:
  - https://git-annex.branchable.com/
  - https://git-annex.branchable.com/git-annex
config-file-location:
  unix:
    - .git/config
    - ~/.config/git-annex/autostart
credentials-file-location:
  unix:
    - .git/annex/creds/
history:
  adoption-history:
    - >
      git-annex became important in communities that need reproducible paths and Git
      metadata without putting large data into Git itself. The official install page
      lists packaging across Debian, Ubuntu, Fedora, Arch, Alpine, NixOS, Gentoo, Guix,
      Void, openSUSE, Homebrew, FreeBSD, OpenBSD, Android, Windows, conda, and PyPI.
    - >
      Its ecosystem significance comes from special remotes and related tools. The
      project documents built-in remotes for S3, rsync, WebDAV, git-lfs, borg,
      bittorrent, tor, web, and rclone, and its devblog describes scientific users and
      DataLad-related work around storing Git repositories on annex special remotes.
  package-nerd-significance:
    - >
      git-annex matters to package people because it sits at the intersection of Git,
      Haskell packaging, external data stores, and reproducible archival workflows. It
      has many executables, many optional integrations, and many platform-specific
      packages, so distributions treat it as a substantial data-management package
      rather than a tiny Git extension.
  project-history:
    - >
      The project grew around Joey Hess's idea of combining Git's distributed history
      with a key-value store for file contents. Its manual describes the core model:
      annexed files become versioned links, while content is stored under
      .git/annex/objects and can be fetched, copied, moved, or dropped between
      repositories.
    - >
      The project broadened beyond a command-line annexer into a larger system with
      assistant workflows, preferred content, encryption, content verification, and many
      special remotes. A Kickstarter-backed development year funded concentrated work on
      the git-annex assistant, after which Joey continued development notes on the
      project devblog.
    - >
      The release stream and project wiki show a long-lived maintenance culture:
      features such as git-remote-annex, clusters, new hash backends, and special-remote
      improvements were documented through the same site used for manual pages,
      installation instructions, forums, and news.
  related-projects:
    - >
      Related systems include Git LFS, DataLad, rclone, borg, bup, rsync, S3-compatible
      storage, WebDAV storage, and provider-specific special remotes listed by the
      git-annex project.
  sources:
    - https://git-annex.branchable.com/
    - https://git-annex.branchable.com/design/assistant/blog/
    - https://git-annex.branchable.com/devblog/
    - https://git-annex.branchable.com/git-annex
    - https://git-annex.branchable.com/install/
    - https://git-annex.branchable.com/news/
    - https://git-annex.branchable.com/special_remotes/
    - https://git-annex.branchable.com/walkthrough/
  summary:
    - >
      git-annex is a distributed data-management tool that lets Git track file names,
      directory history, and metadata while keeping large file contents outside normal
      Git objects.
  timeline:
    - >
      2012: Public testimonials and the assistant campaign documented wider interest in
      Git-backed large-file workflows.
    - '2012: The assistant work was funded through a Kickstarter-backed development year.'
    - >
      2025: The devblog described Distribits, scientific users, DataLad-related work,
      and git-remote-annex.
    - >
      2026: Version 10.20260624 documented new hash-backend build flags, git-remote
      behavior improvements, and a new put command.
  usage:
    - >
      Practitioners use git-annex to keep large assets, media, archives, datasets,
      backups, and offline drives under a versioned tree. A typical workflow initializes
      a Git repository, runs git annex init, adds large files with git annex add,
      commits the symlinks or pointer files to Git, and transfers content with get,
      drop, copy, move, sync, fsck, and special-remote commands.
    - >
      The tool is also used as a policy engine for storage availability. Users can set
      numcopies and preferred content rules, encrypt remotes, verify checksums, keep
      drives offline, and later ask git-annex where content lives or move it to a
      desired repository.
related-packages:
  - id: brew:git-lfs
    reason: >
      Choose Git LFS for a simpler host-backed large-file extension that preserves an
      ordinary Git workflow and uses pointer files, while git-annex is better suited to
      multiple stores, offline media, copy policies, and heterogeneous remotes.
    rel: alternative
    sources:
      - https://git-lfs.com/
      - https://git-annex.branchable.com/
      - https://git-annex.branchable.com/special_remotes/
  - id: brew:datalad
    reason: >
      Use DataLad on top of git-annex when research datasets need higher-level commands
      for nested datasets, retrieval, publication, and provenance while retaining direct
      compatibility with git-annex repositories.
    rel: adjacent_workflow
    sources:
      - https://handbook.datalad.org/en/latest/basics/101-180-FAQ.html
      - https://docs.datalad.org/en/stable/
  - id: brew:rclone
    reason: >
      Use rclone as a git-annex special remote to place annexed content on cloud
      providers supported by rclone while git-annex retains file identity, location
      tracking, and policy.
    rel: adjacent_workflow
    sources:
      - https://git-annex.branchable.com/special_remotes/
      - https://git-annex.branchable.com/special_remotes/rclone/
      - https://rclone.org/
  - id: brew:borgbackup
    reason: >
      Use BorgBackup as a git-annex special remote when annexed content should be stored
      through Borg's deduplicating archive format rather than a normal annex repository.
    rel: adjacent_workflow
    sources:
      - https://git-annex.branchable.com/special_remotes/
      - https://git-annex.branchable.com/special_remotes/borg/
      - https://www.borgbackup.org/
  - id: brew:git
    reason: >
      Git supplies the commits, branches, remotes, and directory history, while
      git-annex stores and tracks large file content outside Git's normal object
      database.
    rel: adjacent_workflow
    sources:
      - https://git-annex.branchable.com/
      - https://git-annex.branchable.com/walkthrough/
      - https://git-scm.com/docs
