id: brew:flexget
display-name: FlexGet
repo: https://github.com/Flexget/Flexget
docs:
  - https://flexget.readthedocs.io/en/stable
  - https://flexget.com/CLI
config-file-location:
  unix:
    - ./config.yml
    - $VIRTUAL_ENV/config.yml
    - ~/.flexget/config.yml
    - ~/.config/flexget/config.yml
  windows:
    - C:\Users\YOURUSER\flexget\config.yml
    - C:\Documents and Settings\YOURUSER\flexget\config.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      FlexGet's adoption grew around self-hosted media automation, where users wanted a
      programmable middle layer between feeds, indexers, download clients, and media
      organization. The supplied package metadata records packaging through Homebrew,
      apk, and Nix, while the README also points to PyPI, Docker images, Read the Docs,
      GitHub Discussions, and Discord.
  package-nerd-significance:
    - >
      FlexGet is package-nerd significant because it is a long-lived Python CLI
      application whose value comes from ecosystem glue: package installation, plugins,
      YAML config validation, daemonized scheduling, web UI artifacts, Docker/PyPI
      packaging, and constant maintenance against changing third-party sites.
  project-history:
    - >
      The official GitHub repository was created in 2011 and is described by GitHub
      metadata as the official FlexGet repository. The README presents FlexGet as a
      multipurpose content automation tool with YAML configuration, many plugins, and
      integrations with applications that provide watch directories or external utility
      interfaces.
    - >
      The official website emphasizes that FlexGet is not built for one client or
      purpose. Its documentation describes a broad plugin ecosystem, daemon mode,
      scheduling, client integrations, site integrations, a cookbook, a web UI under
      development, and a community documentation site.
    - >
      The official changelog shows a long-running 3.x release line, with 3.19.26
      published on 2026-06-29 and many regular maintenance releases. It also records
      ongoing Python and dependency updates, web UI packaging work, plugin fixes, and
      compatibility changes.
  related-projects:
    - >
      PyPI, Docker Hub, Read the Docs, GitHub Discussions, and Discord are part of the
      official project distribution and support surface.
    - >
      Deluge, Transmission, uTorrent, rTorrent, SABnzbd, Trakt, TheTVDB, IMDb, RSS,
      torrents, NZBs, and YAML are documented adjacent tools, services, formats, or
      workflows.
  sources:
    - https://api.github.com/repos/Flexget/Flexget
    - https://flexget.com/
    - https://flexget.com/ChangeLog
    - https://flexget.readthedocs.io/en/stable
    - https://formulae.brew.sh/formula/flexget
    - https://github.com/Flexget/Flexget
    - https://raw.githubusercontent.com/Flexget/Flexget/master/README.rst
  summary:
    - >
      FlexGet is a Python-based automation tool for content workflows, especially media
      feeds and downloads. It is best understood as a plugin-heavy CLI scheduler and
      filter engine for RSS, HTML, CSV, torrents, NZBs, podcasts, comics, series,
      movies, and related sources.
  timeline:
    - '2011: Official GitHub repository created.'
    - '2022: Current FlexGet documentation pages were created in the website system.'
    - >
      2023: 3.11.0 release line includes Python 3.12 support shortly afterward in the
      changelog.
    - '2025: 3.18.x release line begins, with frequent maintenance releases through late 2025.'
    - '2026: 3.19.26 released on June 29.'
  usage:
    - >
      Users install FlexGet with pip or a system package, write a YAML configuration,
      and define tasks that combine input plugins, filters, and output actions. The
      README's minimal example watches an RSS feed, matches configured series names, and
      downloads matching items.
    - >
      The official site highlights torrents, NZBs, podcasts, comics, TV, movies, RSS,
      HTML, CSV, plugins for sites without useful feeds, daemon scheduling, client
      integration with download applications, and site integration with media metadata
      services.
related-packages:
  - id: cask:transmission
    reason: >
      Transmission is a practical downstream client for FlexGet because FlexGet's
      official transmission plugin sends accepted torrent files and magnet links
      directly to it.
    rel: adjacent_workflow
    sources:
      - https://flexget.com/Plugins
      - https://github.com/transmission/transmission
