history:
  adoption-history:
    - >
      NCH has distributed Classic FTP for both Windows and macOS, with a free edition
      for non-commercial use and a paid professional offering. The official build log
      documents releases on both platforms over more than a decade.
  package-nerd-significance:
    - >
      Classic FTP represents the long-lived desktop FTP-client category: a conventional
      two-pane interface, saved sites, synchronization, and FTPS support packaged for
      users who maintain websites without a command-line client.
  project-history:
    - >
      NCH Software designed Classic FTP to resemble a traditional FTP client while
      remaining approachable to novice website administrators. Its official version log
      reaches back at least to the 2.x line in 2012.
    - >
      Later releases continued separately across Windows and macOS, with most logged
      changes characterized as maintenance updates rather than major changes to the
      classic transfer workflow.
  related-projects:
    - NCH Fling FTP Sync Software
    - Pocket FTP
  sources:
    - 'Official help manual: https://help.nchsoftware.com/help/en/classicftp/win/index.html'
    - 'Official product page: https://www.nchsoftware.com/classic/index.html'
    - 'Official version history: https://www.nchsoftware.com/classic/versions.html'
  summary:
    - >
      Classic FTP is NCH Software's graphical FTP and FTPS client for uploading,
      downloading, deleting, and synchronizing files between a computer and remote
      servers.
  timeline:
    - '2012: The official build log records Classic FTP 2.x releases for Windows and macOS.'
    - '2016: The macOS line reached version 3.00.'
    - '2019: The Windows line reached version 4.00.'
    - '2024: NCH published a macOS 5.00 maintenance release.'
  usage:
    - >
      Users define an FTP site, connect with server credentials, browse local and remote
      directories side by side, and transfer files by buttons or drag and drop. The
      synchronization tool compares local and remote folders for website maintenance.
