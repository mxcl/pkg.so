history:
  adoption-history:
    - >
      cabextract's adoption comes from solving an unglamorous but persistent packaging
      problem: Unix, BSD, macOS, Cygwin, DOS, and Amiga users often need to unpack
      Microsoft cabinet archives without Windows tooling. The official download page
      links to Debian, Ubuntu, Fedora, FreeBSD, NetBSD, OpenBSD, Homebrew, MacPorts,
      Cygwin, DOS/FreeDOS, and Amiga packages.
    - >
      It became part of the background infrastructure of packaging, reverse-engineering,
      and driver/font extraction workflows because it is scriptable, small, and
      available in many distribution repositories.
  package-nerd-significance:
    - >
      For package nerds, cabextract is classic plumbing: tiny surface, high leverage,
      and useful exactly when an upstream ships Windows-era cabinet payloads inside
      installers or self-extracting files. It is the sort of utility that quietly keeps
      cross-platform packaging and archival workflows sane.
    - >
      Its libmspack relationship matters because it separates archive-format knowledge
      from CLI ergonomics, letting other software use the library while packagers keep a
      simple cabextract executable.
  project-history:
    - >
      cabextract's README credits Stuart Caie and gives a 2000-2023 copyright span. The
      project focuses on Microsoft Cabinet archives, the format Microsoft used for
      software distribution and Windows Font Packs, and it explicitly distinguishes
      those archives from InstallShield cabinet files.
    - >
      Version 1.0 was a major architectural point: the NEWS file says cabextract moved
      the hard decompression work into libmspack, making extraction more robust and
      faster while keeping the cabextract CLI focused on archive discovery, listing,
      filtering, testing, and extraction.
    - >
      The official site describes cabextract as based on the portable LGPL libmspack
      library. libmspack itself supports Microsoft compression formats including SZDD,
      KWAJ, CAB, CHM, and Exchange Offline Address Book LZX data.
  related-projects:
    - libmspack is the library cabextract uses for Microsoft compression formats.
    - Microsoft Cabinet is the archive format cabextract targets.
    - InstallShield cabinet files are explicitly out of scope and detected separately.
    - >
      Windows CE cabinet tooling is included through cabextract's related scripts and
      documentation.
  sources:
    - https://github.com/kyz/libmspack/tree/master/cabextract
    - https://raw.githubusercontent.com/kyz/libmspack/master/cabextract/NEWS
    - https://raw.githubusercontent.com/kyz/libmspack/master/cabextract/README
    - https://www.cabextract.org.uk/
    - https://www.cabextract.org.uk/libmspack/
  summary:
    - >
      cabextract is a small, long-lived Free Software command-line utility for
      extracting Microsoft Cabinet files. It is tightly associated with Stuart Caie's
      libmspack library and remains a standard Unix-side tool for unpacking .CAB
      archives.
  timeline:
    - '2000: cabextract copyright history begins.'
    - 'Version 1.0: cabextract moved core decompression work to libmspack.'
    - '2013-2015: 1.5 fixed crashes and hangs found with afl fuzzing by Debian contributors.'
    - '2023-02-05: libmspack 0.11alpha was released.'
    - '2023-02-24: cabextract 1.11 was released.'
  usage:
    - >
      Common usage is direct and Unix-like: cabextract file.cab extracts an archive,
      cabextract executable.exe searches for embedded cabinets, cabextract -d selects an
      output directory, cabextract -F filters filenames, cabextract -l lists contents,
      and cabextract -t tests extraction integrity.
    - >
      The tool also handles multipart cabinet sets and Windows CE installation cabinets,
      and its documentation includes magic-file rules to help distinguish Microsoft
      cabinets from InstallShield files.
related-packages:
  - id: brew:gcab
    reason: >
      Choose gcab when you need to create Microsoft Cabinet archives as well as list or
      extract them; cabextract is focused on extraction.
    rel: alternative
    sources:
      - https://github.com/kyz/libmspack
      - https://gitlab.gnome.org/GNOME/gcab
  - id: brew:unshield
    reason: >
      Use Unshield alongside cabextract when a vendor's .cab files belong to the
      incompatible InstallShield installer format rather than the standard Microsoft
      Cabinet format.
    rel: adjacent_workflow
    sources:
      - https://github.com/kyz/libmspack/tree/master/cabextract
      - https://github.com/twogood/unshield
