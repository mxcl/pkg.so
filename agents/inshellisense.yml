id: brew:inshellisense
display-name: inshellisense
repo: https://github.com/microsoft/inshellisense
docs:
  - https://github.com/microsoft/inshellisense#readme
config-file-location:
  unix:
    - ~/.inshellisenserc
    - ~/.config/inshellisense/rc.toml
  windows:
    - ~/.inshellisenserc
    - ~/.config/inshellisense/rc.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The project reports autocomplete support for more than 600 command-line tools and
      works across Windows, Linux, and macOS. Its official GitHub repository has
      attracted a substantial user and contributor audience, indicating adoption beyond
      a small experimental utility.
  package-nerd-significance:
    - >
      inshellisense brings editor-like completion into an interactive terminal session
      without requiring every CLI author to implement shell-specific completion
      independently. It is notable for spanning Bash, Zsh, Fish, PowerShell, Nushell,
      Xonsh, and experimental Command Prompt support.
  project-history:
    - >
      inshellisense is an MIT-licensed terminal autocomplete project maintained in
      Microsoft's GitHub organization. It developed as a terminal-native runtime
      offering IDE-style command discovery and completion across multiple operating
      systems and shells.
  related-projects:
    - >
      Shell-native completion systems for Bash, Zsh, Fish, PowerShell, and Nushell
      address the same general problem; inshellisense distinguishes itself through one
      cross-shell runtime and a large catalog of CLI specifications.
  sources:
    - 'Official Microsoft repository and README: https://github.com/microsoft/inshellisense'
  summary:
    - >
      inshellisense is a cross-platform, terminal-native autocomplete runtime developed
      under the Microsoft organization. It supplies IDE-style suggestions for hundreds
      of command-line programs and integrates with several common shells.
  timeline:
    - The official sources reviewed do not provide a dependable first-release date.
    - >
      2026: The official repository remained actively maintained and documented support
      for more than 600 command-line tools.
  usage:
    - >
      Users run `is` to enter an autocomplete-enabled shell session and `exit` to leave
      it. `is init` handles initial setup, while shell startup integration can be
      appended to the relevant Bash, Zsh, Fish, PowerShell, Xonsh, or Nushell profile. A
      TOML configuration file controls keybindings, alias expansion, Nerd Font support,
      and suggestion limits.
