history:
  adoption-history:
    - >
      Submariner is available as a downloadable macOS application and through the
      Homebrew cask recorded in source_facts.package-manager. The official site says
      development resumed after a long hiatus, while the repository's later releases
      document continued modernization for newer macOS versions and Subsonic-compatible
      servers.
  package-nerd-significance:
    - >
      Submariner is of interest to self-hosting and Mac package users because it
      supplies a native, non-Electron desktop client for the Subsonic ecosystem. Its
      history also illustrates maintenance of a long-lived Cocoa application through
      sandboxing, Keychain integration, Swift migration, and changing macOS media
      frameworks.
  project-history:
    - >
      Submariner began as a native macOS client for Subsonic servers. Its documented 2.0
      generation substantially modernized the application with App Sandbox support,
      Keychain-backed passwords, token authentication, AVFoundation playback, local
      caching, and a redesigned interface. Subsequent releases continued moving
      components to Swift and expanded browsing, playback, playlist, AirPlay, and
      automation features.
  related-projects:
    - >
      Submariner works with Subsonic and compatible self-hosted music servers. Its
      repository also documents macOS technologies including Core Data, AVFoundation,
      AirPlay, AppleScript, Keychain, and App Sandbox.
  sources:
    - https://github.com/SubmarinerApp/Submariner
    - https://github.com/SubmarinerApp/Submariner/releases
    - https://submarinerapp.com/
    - source_facts.package-manager
  summary:
    - >
      Submariner is an open-source, native macOS client for streaming and managing music
      and podcasts hosted on Subsonic-compatible servers.
  timeline:
    - '1.0: The repository history records the initial Submariner release.'
    - >
      2.0: The application adopted a redesigned modern macOS interface, sandboxing,
      Keychain password storage, token authentication, AVFoundation, and relative media
      paths.
    - '2.2: The project documented a broader rewrite of components in Swift.'
    - >
      2025: The official site announced that development had resumed after a long hiatus
      and highlighted the 3.4 release.
  usage:
    - >
      Users connect Submariner to a Subsonic-compatible server, browse or search its
      music library, play and cache tracks, manage playlists and favorites, and
      optionally import local audio. Server passwords are stored through macOS Keychain
      rather than a documented credentials file.
