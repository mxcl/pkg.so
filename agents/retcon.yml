history:
  adoption-history:
    - >
      Retcon progressed through a long public alpha and beta series before its first
      paid public release in August 2024. Later releases expanded remote operations,
      repository integrations, commit splitting, OpenSSH configuration support,
      large-history performance, and cross-branch commit movement.
    - >
      The supplied package facts identify a Homebrew cask, making the independently
      distributed macOS application available through a developer-oriented package
      manager.
  package-nerd-significance:
    - >
      Retcon targets a traditionally command-heavy part of Git culture: polishing
      commits with interactive rebases before review or publication. Its visual
      previews, persistent undo, conflict-aware manipulation, and preservation of the
      working tree and stage offer a distinct workflow from general-purpose Git clients.
    - >
      It is particularly relevant to developers who treat commit history as a curated
      communication artifact and routinely reorder, split, fix up, reword, or remove
      commits before sharing a branch.
  project-history:
    - >
      Development started in early 2022. The official release archive documents
      successive alpha and beta builds that developed Retcon's visual model for
      manipulating commits, files, branches, conflicts, remotes, and the working tree.
    - >
      Retcon 1.0 became the first public release on August 27, 2024. Continued releases
      added Finder and terminal integration, commit splitting, OpenSSH configuration
      support, substantial performance work for very large histories, and cross-branch
      cut, copy, and paste for commits.
  related-projects:
    - Git provides the repository and history model Retcon manipulates.
    - >
      Retcon overlaps with general-purpose Git GUIs but concentrates on history
      rewriting and conflict-aware commit editing.
    - >
      It can use OpenSSH configuration, macOS Keychain-backed SSH agents, and
      third-party agents such as 1Password or Secretive for remote authentication.
  sources:
    - https://retcon.app/
    - https://retcon.app/help
    - https://retcon.app/releases
    - source_facts.package-manager
  summary:
    - >
      Retcon is a native macOS Git client specializing in visual, undoable history
      rewriting through direct manipulation of commits and files.
  timeline:
    - '2022: Development began.'
    - '2023: Public alpha and beta releases iterated on the visual history-editing interface.'
    - '2024: Retcon 1.0 became the first public release on August 27.'
    - >
      2025: Releases added commit splitting, OpenSSH configuration support, and major
      performance improvements.
    - '2026: Retcon 1.6 added cut, copy, and paste of commits across branches.'
  usage:
    - >
      Developers open a Git repository and drag, reword, delete, fix up, split, copy, or
      move commits while previewing the resulting history and conflicts. Most operations
      can be reversed with standard macOS undo.
    - >
      Retcon also supports staging, branch operations, pull and push workflows, conflict
      resolution, Finder and terminal integration, and HTTPS or SSH remote
      authentication.
