history:
  adoption-history:
    - >
      WaveForms grew from software paired with the Electronics Explorer into the common
      application layer for multiple Digilent instruments, including the Analog
      Discovery and Digital Discovery families.
    - >
      WaveForms 3 added macOS and Linux support alongside Windows, substantially
      broadening its usefulness in teaching laboratories, electronics workbenches, and
      small embedded systems. The supplied package facts record distribution to macOS
      users through the Homebrew waveforms cask.
  package-nerd-significance:
    - >
      WaveForms is notable because one desktop package replaces a rack of common
      electronic instruments when paired with supported USB hardware. It also offers
      JavaScript automation and an SDK, making it useful beyond its graphical interface.
    - >
      Its cross-platform packaging spans conventional desktops and ARM Linux systems, an
      unusual range for proprietary test-and-measurement software.
  project-history:
    - >
      Digilent traces WaveForms to Instrumentation, evaluation software created with the
      Electronics Explorer board in 2007. Feedback from university beta users informed
      the first public WaveForms generation.
    - >
      Later releases added devices and instruments such as network, spectrum, impedance,
      and protocol analyzers. WaveForms 3 brought a redesigned interface, a new SDK, and
      macOS and Linux support.
    - >
      The product was formerly branded WaveForms 2015; Digilent subsequently simplified
      the WaveForms 3 product name to WaveForms.
  related-projects:
    - Digilent WaveForms SDK provides programmatic access to supported hardware.
    - >
      Supported hardware families include Electronics Explorer, Analog Discovery, and
      Digital Discovery.
  sources:
    - https://digilent.com/blog/software-update-waveforms-3-7-5/
    - https://digilent.com/blog/waveforms-a-brief-history/
    - https://digilent.com/reference/software/waveforms/waveforms-3/reference-manual
    - source_facts.package-manager
  summary:
    - >
      WaveForms is Digilent's cross-platform virtual-instrument application for
      controlling supported oscilloscopes, waveform generators, logic analyzers, power
      supplies, and related test hardware.
  timeline:
    - >
      2007: Digilent created the Instrumentation precursor for Electronics Explorer
      university evaluations.
    - >
      WaveForms 1 era: The first public generation supplied core oscilloscope,
      waveform-generator, logic, pattern, power, and static-I/O tools.
    - >
      WaveForms 3 era: A redesigned interface, new SDK, and macOS and Linux support were
      introduced.
    - '2021: Digilent retired the WaveForms 2015 branding in favor of WaveForms.'
  usage:
    - >
      Users connect a supported Digilent device, select it in Device Manager, and
      operate virtual instruments such as the oscilloscope, waveform generator, logic
      analyzer, and network analyzer.
    - >
      The application can run with a demo device for exploration without physical
      hardware, save instrument projects and complete workspaces, export measurements,
      and automate tasks with JavaScript.
