history:
  adoption-history:
    - >
      ldid became familiar in jailbreak and unsigned iOS development toolchains because
      it can apply ad-hoc signatures and entitlements. The supplied package metadata
      records availability through Homebrew, MacPorts, and Nix, extending the tool
      beyond the Cydia packaging environment.
  package-nerd-significance:
    - >
      For package maintainers, ldid is a small tool with outsized importance at the
      boundary of Mach-O packaging, platform signing policy, and iOS development
      workflows.
  project-history:
    - >
      ldid emerged from iPhone OS and macOS code-signing work that needed a lightweight
      way to add, refresh, or inspect Mach-O signature metadata outside Apple's full
      signing workflow. Upstream remains a compact utility hosted in saurik's source
      repository rather than a broad signing framework.
  related-projects:
    - >
      Related tools and ecosystems include Apple's codesign utility, Cydia packaging,
      Theos-style iOS development workflows, and general Mach-O binary tooling.
  sources:
    - https://cydia.saurik.com/info/ldid/
    - https://git.saurik.com/ldid.git
    - source_facts.package-manager
  summary:
    - >
      ldid, the Link Identity Editor, is a small command-line utility from Jay Freeman's
      Cydia ecosystem for manipulating the signature block in a Mach-O binary.
  timeline:
    - '2000s: ldid enters the Cydia/saurik tool ecosystem for Mach-O signature manipulation.'
    - '2020s: Homebrew, MacPorts, and Nix package ldid for developer workstations.'
  usage:
    - >
      The official Cydia page documents three core operations: use -S to sign a binary
      from scratch and allocate entitlements, -s to update hashes on an existing binary,
      and -e to dump entitlements.
