history:
  adoption-history:
    - >
      The channel is intended for developers, advanced users, testers, and early
      adopters rather than stability-first everyday use. It gives Opera a public testing
      population whose feedback can shape features before promotion to later release
      stages.
  package-nerd-significance:
    - >
      Opera Developer matters to package enthusiasts as a separately installable rolling
      preview channel. It permits side-by-side exposure to upcoming browser behavior
      without replacing the stable Opera package.
    - >
      The channel also provides web developers and extension authors an early
      compatibility target, although its experimental nature makes it unsuitable for
      irreplaceable browsing data.
  project-history:
    - >
      Opera described a three-stream desktop release model in May 2013: Developer for
      the newest and least stable work, Opera Next for stabilization, and Opera Stable
      for general use. The Opera 17 Developer preview followed in August 2013 and was
      explicitly described as a place where features could be piloted, revised,
      promoted, or abandoned.
    - >
      Opera continues to use Developer as the first public stage for browser
      experiments. Successful ideas may progress toward stable Opera after testing,
      while some experiments never ship.
  related-projects:
    - Opera Browser
    - Opera Beta
    - Opera GX
    - Opera Air
  sources:
    - >
      https://blogs.opera.com/desktop/2013/05/opera-features-and-release-cycle/ —
      official three-stream release model.
    - >
      https://blogs.opera.com/desktop/2013/08/opera-17-first-developer-stream-preview/ —
      official early Developer preview.
    - https://www.opera.com/opera/developer — current official channel description.
    - source_facts.description
  summary:
    - >
      Opera Developer is the earliest public preview channel for Opera's desktop browser
      experiments and upcoming features.
  timeline:
    - '2013: Opera documented its Developer, Next, and Stable desktop release streams.'
    - '2013: Opera published the Opera 17 Developer stream preview.'
    - >
      Ongoing: Experimental features are tested publicly before possible promotion to
      stable Opera.
  usage:
    - >
      Users install Opera Developer to preview experimental browser features, test
      websites and extensions against forthcoming behavior, and provide feedback. Opera
      warns that the channel may be unstable or crash.
