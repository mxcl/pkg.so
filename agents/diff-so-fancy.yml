id: brew:diff-so-fancy
display-name: diff-so-fancy
repo: null
docs:
  - https://github.com/so-fancy/diff-so-fancy#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      diff-so-fancy spread through developer tooling because it required little
      ceremony: place the script on PATH and point Git's pager or interactive.diffFilter
      at it. The README lists official project-noted availability through GitHub
      releases, npm, Homebrew, Fedora, Arch, and Debian/Ubuntu packaging.
  package-nerd-significance:
    - >
      For package nerds, diff-so-fancy is a classic single-purpose developer package: a
      small script, broad editor-terminal appeal, and visible overlap between dotfiles
      culture, Git ergonomics, and distro packaging.
  project-history:
    - >
      The official history document says diff-so-fancy began as a commit in Paul Irish's
      dotfiles, grew into a standalone script, and was later moved into the so-fancy
      repository by Steve Mao. The GitHub repository was created in 2016.
    - >
      The README presents the project as a tool for making diffs human readable to
      improve code quality and defect spotting. Its options are mostly Git configuration
      keys that control hunk headers, leading symbols, rulers, empty lines, and display
      width.
  related-projects:
    - >
      Git, diff-highlight, delta, Lazygit, and difftastic are the main neighboring tools
      named by upstream.
  sources:
    - https://github.com/so-fancy/diff-so-fancy
    - https://api.github.com/repos/so-fancy/diff-so-fancy
    - https://raw.githubusercontent.com/so-fancy/diff-so-fancy/master/README.md
    - https://raw.githubusercontent.com/so-fancy/diff-so-fancy/master/docs/history.md
    - https://api.github.com/repos/so-fancy/diff-so-fancy/releases
  summary:
    - >
      diff-so-fancy is a terminal filter that reformats unified diffs into a more
      human-readable display. It is commonly wired into Git as a pager or interactive
      diff filter.
  timeline:
    - '2016: The so-fancy/diff-so-fancy GitHub repository is created.'
    - '2021: Version 1.4.0 is published.'
    - '2026: Version 1.4.10 is published.'
  usage:
    - >
      The normal Git setup is core.pager set to pipe through diff-so-fancy and less,
      plus interactive.diffFilter for patch mode. It can also consume ordinary unified
      diff output from diff -u or recursive diff.
related-packages:
  - id: brew:git-delta
    reason: >
      Choose delta for syntax highlighting, line numbers, navigation, side-by-side
      display, and a documented diff-so-fancy emulation mode.
    rel: alternative
    sources:
      - https://github.com/so-fancy/diff-so-fancy#alternatives
      - https://dandavison.github.io/delta/features.html
  - id: brew:difftastic
    reason: >
      Choose Difftastic when syntax-aware structural comparison and ignoring
      formatting-only changes matter more than restyling a line-oriented unified diff.
    rel: alternative
    sources:
      - https://github.com/so-fancy/diff-so-fancy#alternatives
      - https://difftastic.wilfred.me.uk/
  - id: brew:lazygit
    reason: >
      Lazygit can use diff-so-fancy as a configured stdin diff renderer, adding an
      interactive Git TUI around its formatted output.
    rel: adjacent_workflow
    sources:
      - https://github.com/so-fancy/diff-so-fancy#alternatives
      - https://github.com/jesseduffield/lazygit/blob/master/docs/Custom_DiffRenderers.md
