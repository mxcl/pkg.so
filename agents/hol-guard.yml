credentials-file-location: null
history:
  adoption-history:
    - >
      HOL Guard supplies adapters for a broad group of coding-agent environments,
      including Codex, Claude Code, Cursor, Cline, Gemini CLI, OpenCode, GitHub Copilot
      CLI, and others. Integrations use native hooks, managed launchers, and MCP proxies
      according to the host's available enforcement points.
    - >
      The project separates its open-source local runtime from optional Guard Cloud
      services. Local blocking, approvals, receipts, and policy remain usable without an
      account, while cloud services add shared history, team policy, and fleet
      visibility.
  package-nerd-significance:
    - >
      HOL Guard applies package-security concerns directly to agent-driven development:
      it can review package-manager operations, changed plugins and skills, MCP
      configurations, shell commands, file access, and possible secret exposure before
      supported actions run.
    - >
      The repository also ships Plugin Scanner, giving maintainers and CI systems checks
      for manifests, secrets, unsafe commands, dependency provenance, GitHub Actions
      permissions, and package readiness across multiple agent-plugin ecosystems.
  project-history:
    - >
      Hashgraph Online developed HOL Guard as an open-source, local-first runtime
      security layer for increasingly capable AI coding agents. The project grew into a
      combination of local policy enforcement, approval and receipt tooling,
      supply-chain checks, harness-specific integrations, and an optional cloud
      coordination layer.
  related-projects:
    - >
      Plugin Scanner is the companion maintainer and CI package-inspection tool shipped
      from the same repository.
    - Guard Cloud adds optional synchronized evidence, shared policy, and fleet management.
    - >
      Supported harnesses include Codex, Claude Code, Cursor, Cline, Gemini CLI,
      OpenCode, and GitHub Copilot CLI.
  sources:
    - https://github.com/hashgraph-online/hol-guard
    - https://github.com/hashgraph-online/hol-guard/blob/main/docs/guard/get-started.md
    - https://hol.org/guard
    - https://hol.org/guard/releases
  summary:
    - >
      HOL Guard is an open-source, local-first runtime security layer for AI agents. It
      evaluates supported commands, file access, package operations, MCP calls, plugins,
      skills, and configuration changes, then allows, blocks, or requests approval
      according to policy.
  timeline:
    - >
      2026: Official HOL Guard materials document desktop installers, multi-harness
      runtime protection, supply-chain scanning, local receipts, and optional Guard
      Cloud coordination.
  usage:
    - >
      Users run guided setup, install protection for one or more supported agent
      harnesses, inspect proposed artifact changes, resolve approval requests, and
      review recorded receipts. Package checks and AI bill-of-materials exports are also
      available from the CLI.
    - >
      Project-specific policy overrides can be placed in `<project>/.hol-guard.toml`.
      Local policy decisions and evidence remain effective without a cloud connection.
