history:
  adoption-history:
    - >
      The initial release supported HD60 S+ and HD60 X. Later releases added
      configuration controls and support for newer devices, including 4K X and Game
      Capture Neo.
  package-nerd-significance:
    - >
      This is a narrowly scoped vendor utility rather than a general capture
      application. Its Homebrew cask is useful for Mac operators who need repeatable
      access to firmware and low-level settings for Elgato USB capture hardware.
  project-history:
    - >
      Elgato introduced Capture Device Utility 1.0 for macOS in May 2023 to update
      firmware and select audio inputs on supported capture devices. Version 1.1
      expanded device configuration, while versions 1.2 and 1.3 added newer hardware
      support and further controls.
  related-projects:
    - Elgato HD60 S+
    - Elgato HD60 X
    - Elgato 4K X
    - Elgato Game Capture Neo
    - OBS Studio
  sources:
    - >
      https://help.elgato.com/hc/en-us/articles/16107404549773-Capture-Device-Utility-1-0-Release-Notes
    - >
      https://help.elgato.com/hc/en-us/articles/17094488517645-Capture-Device-Utility-1-1-Release-Notes
    - >
      https://help.elgato.com/hc/en-us/articles/26005991056397-Capture-Device-Utility-1-3-Release-Notes
    - source_facts.package-manager
  summary:
    - >
      Elgato Capture Device Utility is a macOS utility for updating firmware and
      configuring supported Elgato capture devices.
  timeline:
    - '2023-05-23: Capture Device Utility 1.0 was released for macOS.'
    - >
      2023-06-27: Version 1.1 added HDMI color-range, EDID, USB-transfer, and
      HDR-tonemapping controls.
    - '2024-02-01: Version 1.2 added 4K X support and analog-audio gain control.'
    - >
      2024-04-18: Version 1.3 added Game Capture Neo and 10 Gbps mode for 4K X on
      supported Macs.
  usage:
    - >
      Operators connect a supported Elgato capture device, launch the utility, and
      adjust device-level options such as firmware, audio input, EDID behavior, color
      range, transfer mode, or supported USB modes. It is a companion configuration
      tool, not the application used to record or stream video.
