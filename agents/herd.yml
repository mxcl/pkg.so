id: cask:herd
display-name: Laravel Herd
repo: null
docs:
  - https://herd.laravel.com/docs
  - https://herd.laravel.com/docs/macos/advanced-usage/directories-and-files
  - https://herd.laravel.com/docs/windows/advanced-usage/directories-and-files
config-file-location:
  macos:
    - ~/Library/Application Support/Herd/config
    - <project-root>/herd.yml
  windows:
    - '%USERPROFILE%\.config\herd\config'
    - <project-root>\herd.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Herd packages a convention-driven PHP environment for developers who want Laravel
      projects to run locally without manually assembling PHP, nginx, DNS, Composer, and
      related services. Herd Pro subsequently broadened that environment with managed
      databases, debugging, mail, and service integrations.
  package-nerd-significance:
    - >
      Herd is notable as a vendor-maintained, batteries-included alternative to
      hand-managed PHP installations, containers, and older Laravel-oriented
      local-serving tools. Its Homebrew cask makes the macOS desktop distribution
      reproducible through a package-manager workflow.
  project-history:
    - >
      Laravel introduced Herd as a native local-development environment for macOS and
      later expanded it to Windows. The product evolved from a lightweight PHP and
      Laravel setup into a broader development workstation with multiple PHP versions, a
      command-line interface, project manifests, and optional managed services.
  related-projects:
    - Laravel
    - PHP
    - Composer
    - Laravel Valet
    - Laravel Forge
    - Expose
  sources:
    - https://herd.laravel.com/docs/
    - https://herd.laravel.com/docs/windows/advanced-usage/command-line
    - https://herd.laravel.com/docs/windows/changelog
    - https://herd.laravel.com/docs/windows/sites/herd-yaml
  summary:
    - >
      Laravel Herd is Laravel's native PHP development environment for macOS and
      Windows. It combines a desktop application and CLI with preconfigured PHP, web
      serving, local domains, Composer, and Laravel-oriented tooling.
  timeline:
    - '2023: Laravel Herd became publicly available for macOS.'
    - '2024: Herd expanded to Windows.'
    - >
      2026: The official changelog records continued additions to CLI, services, and
      Laravel project creation workflows.
  usage:
    - >
      Developers use Herd to serve projects under local `.test` domains, switch or
      isolate PHP versions, create and link Laravel applications, manage services, and
      share local sites. A project-root `herd.yml` can capture team-portable PHP, TLS,
      alias, service, and integration settings.
tags:
