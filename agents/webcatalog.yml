history:
  adoption-history:
    - >
      WebCatalog Desktop is distributed as a downloadable desktop application and
      through Homebrew Cask on macOS. Its official help center documents free and paid
      functionality, profiles, spaces, synchronization, and management of multiple web
      accounts.
  package-nerd-significance:
    - >
      WebCatalog appeals to users who want isolated, app-like wrappers around browser
      services without maintaining separate browser profiles manually. Its profile and
      space model makes it useful for handling multiple accounts and grouping web
      applications.
  project-history:
    - >
      WebCatalog developed as a desktop container for turning websites and web services
      into app-like desktop experiences. The current product emphasizes custom apps,
      profiles, spaces, notifications, privacy controls, and cross-device
      synchronization.
  related-projects:
    - >
      The product belongs to the same broad desktop-web-wrapper category as
      site-specific browsers and Electron-style packaged web applications.
  sources:
    - >
      Official help center:
      https://docs.webcatalog.io/en/collections/6321386-webcatalog-desktop
    - 'Official homepage: https://webcatalog.io/'
  summary:
    - >
      WebCatalog Desktop is a productivity application for installing and running
      websites as desktop-style applications, with profiles and spaces for account and
      workspace separation.
  timeline:
    - >
      Current product: WebCatalog Desktop provides custom apps, profiles, spaces,
      synchronization, notifications, and desktop integration.
  usage:
    - >
      Users create app-like launchers for web services, maintain multiple accounts in
      separate profiles, organize applications into spaces, and configure desktop
      integrations such as notifications, menu-bar access, and keyboard shortcuts.
