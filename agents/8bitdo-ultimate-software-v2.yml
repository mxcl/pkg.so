history:
  adoption-history:
    - >
      Adoption is tied to 8BitDo's supported-device catalog: owners use the utility when
      their controller or modification kit requires configurable mappings, profiles,
      calibration, lighting, or vendor firmware maintenance.
  package-nerd-significance:
    - >
      The Homebrew cask turns a vendor-distributed hardware utility into a reproducibly
      installable macOS package. It is a useful example of package managers covering
      device-management applications that sit outside traditional developer tooling.
  project-history:
    - >
      8BitDo developed Ultimate Software V2 as a redesigned successor to its earlier
      Ultimate Software. The official FAQ describes V2 as offering enhanced key
      remapping, macros, audio configuration, firmware updates, and a more efficient
      interface.
  related-projects:
    - 8BitDo Ultimate Software
    - 8BitDo controller firmware
  sources:
    - https://app.8bitdo.com/Ultimate-Software-V2/
    - source_facts.description
    - source_facts.package-manager
  summary:
    - >
      8BitDo Ultimate Software V2 is 8BitDo's proprietary desktop application for
      configuring and updating supported controllers and other 8BitDo devices.
  timeline:
    - >
      V2 generation: 8BitDo introduced a redesigned successor with expanded
      configuration features.
    - >
      Current era: 8BitDo distributes V2 for supported Windows and macOS systems and
      maintains a device-specific compatibility list.
  usage:
    - >
      Connect a supported device, select it in Ultimate Software V2, and configure
      available mappings, macros, lighting, audio, or other device-specific options. The
      application also installs vendor firmware updates.
