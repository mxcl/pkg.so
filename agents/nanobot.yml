credentials-file-location: null
history:
  adoption-history:
    - >
      GitHub API data fetched on 2026-07-01 showed 1,327 stars and 200 forks, a notable
      early signal for a project less than fourteen months old. Homebrew's formula JSON
      generated on 2026-07-01 reported 897 installs over 365 days and 75 installs over
      30 days, so Homebrew adoption exists but is still small compared with mature
      infrastructure packages.
    - >
      The README's examples show the intended adoption path: builders package MCP
      servers into dedicated chat-like experiences such as a game, a Hugging Face MCP
      example, or a Shopify shopping assistant, then run them with a `nanobot.yaml` or
      directory of markdown agent definitions.
  package-nerd-significance:
    - >
      Nanobot is significant because it packages the MCP-host side of the agent stack
      into a single Homebrew CLI. It is not yet an old, stable Unix utility; its value
      is that it gives MCP developers a reproducible command-line way to turn MCP
      servers into usable agent surfaces while the ecosystem is still forming.
  project-history:
    - >
      The GitHub repository was created on 2025-05-16, and the project was still
      explicitly labeled alpha/heavy-development in its README during this run. That
      fits the package's role: it tracks the fast-moving Model Context Protocol
      ecosystem and is still changing configuration and host behavior while MCP and
      MCP-UI mature.
    - >
      Release metadata shows rapid iteration through v0.0.87, published on 2026-06-24.
      The README roadmap emphasizes fuller MCP and MCP-UI compliance, multi-agent
      support, production-ready UI, more model providers, authentication/security
      features, and embeddable front-end integrations.
  related-projects:
    - Model Context Protocol
    - MCP-UI
    - Obot Platform
  sources:
    - https://api.github.com/repos/obot-platform/nanobot
    - https://api.github.com/repos/obot-platform/nanobot/releases?per_page=5
    - https://formulae.brew.sh/api/formula/nanobot.json
    - https://formulae.brew.sh/formula/nanobot
    - https://github.com/obot-platform/nanobot
  summary:
    - >
      Nanobot is a young Obot Platform project for building MCP-based agents. Its
      upstream README describes it as a standalone open-source MCP host that combines
      MCP servers, an LLM, and context into a deployable agent experience, rather than
      relying on the MCP hosts built into editors and chat products.
  timeline:
    - '2025-05-16: obot-platform/nanobot repository created on GitHub.'
    - '2026-06-24: v0.0.87 release published.'
    - >
      2026-07-01: Homebrew formula JSON listed stable version 0.0.87 and 897 installs
      over 365 days.
  usage:
    - >
      Package users install the `nanobot` CLI, define one or more agents and MCP
      servers, provide model-provider credentials such as OpenAI or Anthropic API keys,
      and run `nanobot run ./nanobot.yaml` or a configuration directory. The local UI is
      served from port 8080 in the README example.
    - >
      Package nerds should treat this as an agent-hosting tool rather than a library
      dependency: it is useful for experimenting with MCP servers, local provider
      wiring, and standalone agent UIs, but the upstream warning about breaking changes
      means pinning versions matters for repeatable demos or internal tools.
related-packages:
  - id: cask:block-goose
    reason: >
      Choose goose when you want a mature general-purpose local agent with desktop and
      CLI clients and MCP extensions, rather than a host focused on packaging dedicated
      MCP agent experiences.
    rel: alternative
    sources:
      - https://github.com/obot-platform/nanobot#readme
      - https://block.github.io/goose/
      - https://github.com/block/goose
  - id: brew:mcp-inspector
    reason: >
      Use MCP Inspector to exercise and debug the tools, resources, prompts, transports,
      and authentication of an MCP server before wiring that server into a Nanobot
      agent.
    rel: adjacent_workflow
    sources:
      - https://github.com/obot-platform/nanobot#readme
      - https://modelcontextprotocol.io/docs/tools/inspector
      - https://github.com/modelcontextprotocol/inspector
