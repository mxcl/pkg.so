history:
  adoption-history:
    - >
      bibutils is available across Homebrew, Debian, Ubuntu, Fedora, MacPorts, Nix,
      Arch, and other package managers, which matches its role as a reusable
      command-line conversion toolkit for scripts.
    - >
      Because it supports BibTeX, BibLaTeX, RIS, EndNote, ISI, PubMed/NBIB, Word
      bibliography, ADS, and MODS workflows, it is useful to users moving references
      among citation managers, library metadata systems, and publishing tools.
  package-nerd-significance:
    - >
      bibutils is a tidy example of Unix filter design applied to bibliography metadata:
      instead of maintaining N-squared pairwise converters, it centralizes conversion
      through MODS.
    - >
      Package nerds care because it is one of those small, durable utilities that
      quietly make citation-manager and library-metadata interoperability scriptable.
  project-history:
    - >
      The official SourceForge wiki describes bibutils as a program set for
      interconverting bibliography formats using MODS XML as a common intermediate,
      reducing the number of converters needed for many input and output formats.
    - >
      The documented development history groups changes by major versions: version 5
      changed the default input and output character set to UTF-8 and added the ability
      to write MODS XML in multiple character sets, while later major versions reflect
      library changes.
  related-projects:
    - >
      MODS, the Library of Congress Metadata Object Description Schema, is the
      intermediate format used by bibutils.
    - >
      BibTeX and BibLaTeX are both supported through bib2xml, biblatex2xml, xml2bib, and
      xml2biblatex.
    - >
      RIS, EndNote, PubMed/NBIB, ISI, ADS, and Word bibliography formats are part of the
      conversion ecosystem documented by the project.
  sources:
    - https://sourceforge.net/p/bibutils/home/Bibutils
    - https://sourceforge.net/p/bibutils/home/Working%20with%20MODS
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      bibutils is a suite of Unix-style bibliography conversion filters that translate
      between formats through a common MODS XML intermediate representation.
  timeline:
    - 'Version 2: Official development history records an early major-version line.'
    - >
      Version 5: Default input and output character set changes to UTF-8, with MODS XML
      output in multiple character sets.
    - 'Version 6: Major version changes because of library changes.'
    - 'Version 7: Major version changes again because of library changes.'
  usage:
    - >
      Users chain format-specific converters such as ris2xml followed by xml2bib, or
      bib2xml followed by xml2ris, using MODS XML as the intermediate format.
    - >
      The tools are intentionally command-line filters, making them suitable for shell
      pipelines, automated metadata cleanup, and larger bibliographic projects.
related-packages:
  - id: brew:bibtexconv
    reason: >
      Choose BibTeXConv for custom HTML, Markdown, YAML, ODT, or IETF outputs and URL
      validation; choose bibutils for broad standard-format interchange through MODS.
    rel: alternative
    sources:
      - https://www.nntb.no/~dreibh/bibtexconv/
      - https://sourceforge.net/p/bibutils/home/Bibutils/
