config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The EROFS project documentation lists adoption in Android system firmware,
      container-related projects such as composefs and Kata Containers, bootloaders such
      as U-Boot and GRUB, and many distributions including Alpine, Arch, Debian, Fedora,
      Gentoo, Homebrew, NixOS, openSUSE, Ubuntu, and others.
  package-nerd-significance:
    - >
      erofs-utils sits at the boundary between kernel filesystem support and
      reproducible image-building pipelines. Package maintainers care about it because
      newer releases expose kernel-era features such as compression algorithms,
      multi-threaded compression, FUSE support, tar sources, OCI registry support, and
      remote EROFS mounting.
  project-history:
    - >
      Kernel documentation describes EROFS as a modern, efficient, secure read-only
      kernel filesystem for immutable system images, container images, application
      sandbox images, and dataset snapshots. The EROFS project docs say it has been
      formally available since Linux 5.4 and is maintained by an open-source developer
      community.
  related-projects:
    - >
      EROFS is documented in the Linux kernel tree and has separate erofs-utils
      userspace tools.
    - >
      The project documentation links EROFS to Android, composefs, Kata Containers,
      U-Boot, GRUB, and distribution packaging ecosystems.
  sources:
    - https://docs.kernel.org/filesystems/erofs.html
    - https://erofs.docs.kernel.org/
    - https://erofs.docs.kernel.org/en/latest/mkfs.html
    - https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git/plain/README
    - https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git/plain/ChangeLog
    - https://formulae.brew.sh/formula/erofs-utils
  summary:
    - >
      erofs-utils is the upstream userspace toolkit for EROFS, the Enhanced Read-Only
      File System used to build, inspect, check, mount, and extract immutable filesystem
      images.
  timeline:
    - 'Linux 5.4: EROFS became formally available according to the project documentation.'
    - >
      2024-08-09: erofs-utils 1.8 added multi-threaded compression, preliminary
      Zstandard support, FUSE improvements, tar source support, and incremental-build
      work.
    - >
      2026-02-18: erofs-utils 1.9 added S3 and OCI registry image creation, remote mount
      support, directory compression, and metadata-zone work.
    - '2026-03-04: erofs-utils 1.9.1 followed as a maintenance release.'
  usage:
    - >
      The package provides mkfs.erofs for creating images, mount.erofs for mounting,
      erofsfuse for unprivileged FUSE mounting, dump.erofs for analysis, and fsck.erofs
      for consistency checking and extraction. The mkfs docs cover creating images from
      directories or tarballs, optional compression, reproducible-build controls, and
      tar/OCI-oriented workflows.
related-packages:
  - id: brew:squashfs
    reason: >
      Choose Squashfs-tools as an alternative for creating compressed read-only
      filesystem images when its mature format or space-oriented defaults better fit the
      deployment; EROFS emphasizes runtime performance and finer-grained access
      tradeoffs.
    rel: alternative
    sources:
      - https://erofs.docs.kernel.org/en/latest/features.html
      - https://github.com/plougher/squashfs-tools
