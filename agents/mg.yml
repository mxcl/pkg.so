id: brew:mg
display-name: mg
repo: null
docs:
  - https://github.com/ibara/mg#readme
config-file-location:
  unix:
    - ~/.mg
    - ~/.mg-TERM
credentials-file-location: null
history:
  project-history:
    - >
      The package distributed by Homebrew through ibara/mg is a portable version of
      OpenBSD's mg. Its README says it tracks OpenBSD upstream aggressively, preserving
      mg's role as a compact, public-domain-ish editor that gives users familiar Emacs
      key bindings without bringing along GNU Emacs as a large programmable environment.
  sources:
    - https://cdn.netbsd.org/pub/pkgsrc/current/pkgsrc/editors/mg/index.html
    - https://formulae.brew.sh/formula/mg
    - https://github.com/ibara/mg
    - https://github.com/troglobit/mg
    - https://man.openbsd.org/mg
  summary:
    - >
      mg is the small Emacs-like editor lineage that began as MicroGNUEmacs, itself
      based on Dave Conroy's MicroEMACS. The troglobit mg history summarizes the origin
      as a Micro Emacs clone created in 1987 from the 1985 MicroEMACS v30 code, with the
      old Micro GNU Emacs name dropped after a dispute with the FSF. OpenBSD's mg manual
      gives the design goal in practical terms: a small, fast, portable editor for
      people who cannot or do not want to run Emacs, or who are not familiar with vi.
  usage:
    - >
      Its adoption story is strongest in BSD and Unix packaging. OpenBSD includes mg as
      a base-system editor; portable builds are packaged by Homebrew, Debian, Fedora,
      MacPorts, Nix, Arch, Ubuntu, openSUSE, pkgsrc, and other ports collections. In
      practice it is used as a lightweight `$EDITOR`, for quick system-file edits,
      rescue or remote environments, and users whose muscle memory is Emacs rather than
      vi.
related-packages:
  - id: brew:emacs
    reason: >
      Choose GNU Emacs when you need a fully programmable editor and its extension
      ecosystem; mg is explicitly intended as the smaller, faster Emacs-key-compatible
      option.
    rel: alternative
    sources:
      - https://github.com/ibara/mg#readme
      - https://www.gnu.org/software/emacs/
  - id: brew:vim
    reason: >
      Choose Vim when you prefer modal vi-style editing and broad Vim compatibility;
      mg's official description targets users who want Emacs-style interaction instead
      of vi.
    rel: alternative
    sources:
      - https://github.com/ibara/mg#readme
      - https://www.vim.org/about.php
