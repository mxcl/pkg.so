config-file-location:
  unix:
    - ${FREECIV_STORAGE_DIR}/freeciv-client-rc-<major>.<minor>
credentials-file-location: null
history:
  adoption-history:
    - >
      Freeciv became a standard open source strategy-game package across Unix-like
      systems because it bundles visible applications and command-line/server
      components. The supplied package facts list it in Homebrew, Debian, Ubuntu,
      Fedora, Alpine, Arch, MacPorts, Nix, openSUSE, Chocolatey, and winget, reflecting
      broad cross-platform packaging.
  package-nerd-significance:
    - >
      Freeciv is a useful package-manager specimen because it combines a large game data
      tree, GUI clients, networked server behavior, translations, rulesets, and
      command-line maintenance tools in one formula. It also shows the classic packaging
      split between desktop launchability and server/admin executables.
  project-history:
    - >
      The project presents itself as a Free Software strategy game in the tradition of
      turn-based civilization building. Its official site and repository emphasize the
      client-server architecture, community development, and a release line that has
      continued through modern 3.x releases.
  related-projects:
    - >
      Related official surfaces include the Freeciv wiki, forum, metaserver, Redmine
      tracker, and GitHub organization. In packaging terms it sits near open source
      strategy games that ship both graphical clients and network servers.
  sources:
    - https://github.com/freeciv/freeciv
    - https://raw.githubusercontent.com/freeciv/freeciv/main/README.md
    - https://www.freeciv.org/
    - https://www.freeciv.org/wiki
  summary:
    - >
      Freeciv is a free and open source empire-building strategy game inspired by the
      history of human civilization. It is both a playable game and a long-running
      packaged desktop/server program, with graphical clients, a standalone server,
      ruleset tooling, and documentation utilities shipped by Unix package managers.
  timeline:
    - >
      1990s: Freeciv emerged as a free software implementation of civilization-style
      empire building.
    - '2024: Freeciv 3.1.0 was released as a new stable series.'
    - '2025: Freeciv 3.2.0 was released as a new stable series.'
    - '2026: Freeciv 3.2.4 was announced on the official site as the current stable release.'
  usage:
    - >
      Users run graphical clients such as freeciv-gtk4 to play, freeciv-server to host
      games, and helper tools such as freeciv-ruleup for ruleset maintenance. Package
      users often care about data files, client toolkit variants, and compatibility
      between client and server versions.
related-packages: []
