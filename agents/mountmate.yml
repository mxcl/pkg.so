history:
  adoption-history:
    - >
      MountMate is distributed as a downloadable macOS disk image and through the
      Homebrew package recorded in source_facts.package-manager.
    - >
      The project remains a focused native utility rather than a cross-platform
      storage-management suite.
  package-nerd-significance:
    - >
      MountMate packages a collection of tasks otherwise handled through Finder, Disk
      Utility, or shell commands into a small native menu-bar application.
    - >
      It appeals to Mac users who keep external disks attached, manage network shares,
      or want to reduce unnecessary spinning-disk activity without running a larger
      storage utility.
  project-history:
    - >
      The developer created MountMate to manage a continuously attached spinning
      external disk that macOS would repeatedly wake for Finder or Spotlight activity.
    - >
      The initial single-purpose mount and unmount workflow expanded to include
      free-space reporting, keyboard shortcuts, network-share auto-mounting, reconnect
      and keep-alive behavior, and forced ejection.
  related-projects:
    - macOS Disk Utility
    - SMB
    - NFS
    - AFP
  sources:
    - https://github.com/homielab/mountmate
    - https://mountmate.homielab.com/
  summary:
    - >
      MountMate is a native macOS menu-bar utility for mounting, unmounting,
      reconnecting, and ejecting external volumes and network shares.
  timeline:
    - >
      Initial development: MountMate was created to control an always-connected external
      hard drive from the menu bar.
    - >
      Later development: Network-share auto-mounting, keep-alive behavior, keyboard
      shortcuts, and force-eject support were added.
  usage:
    - >
      Users select connected volumes from the menu bar to mount or unmount them, inspect
      free space, or force an eject when necessary.
    - >
      Network shares can be configured for login-time mounting and automatic
      reconnection after sleep, network changes, or dropped connections.
