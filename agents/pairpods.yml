history:
  adoption-history:
    - >
      The initial beta included Homebrew installation, and PairPods remains distributed
      as the `pairpods` Homebrew cask. Its official repository also provides signed
      application releases and supports automatic update notifications through Sparkle.
  package-nerd-significance:
    - >
      PairPods packages a task that macOS users could otherwise assemble manually with
      aggregate or multi-output audio devices into a small native menu-bar utility. Its
      Homebrew cask and open SwiftUI code make it convenient for Mac-oriented package
      collections.
  project-history:
    - >
      PairPods began as an open-source macOS menu-bar application by Paweł Woźniak. The
      February 2025 beta shared audio between two Bluetooth devices; subsequent releases
      added per-device volume, selection of more than two devices, reconnection,
      sample-rate information, master-clock selection, and battery reporting.
  related-projects:
    - Uses macOS CoreAudio facilities to construct shared audio output.
    - Uses Sparkle for application update notifications.
  sources:
    - https://github.com/wozniakpawel/PairPods#readme
    - https://github.com/wozniakpawel/PairPods/blob/main/CHANGELOG.md
    - https://pairpods.app/
  summary:
    - >
      PairPods is a free, open-source macOS menu-bar application for sending the same
      audio to two or more Bluetooth output devices, with per-device controls and
      automatic reconnection.
  timeline:
    - >
      2025-02-26: Initial beta release added two-device audio sharing and Homebrew
      installation.
    - '2025-04-21: Per-device volume controls arrived in version 0.2.0.'
    - '2026-03-01: Version 0.5.0 expanded sharing to two or more selected devices.'
    - '2026-03-22: Version 0.7.0 improved Bluetooth battery reporting.'
  usage:
    - >
      Connect at least two Bluetooth audio devices in macOS, open PairPods from the menu
      bar, select participating devices, optionally adjust their volumes and master
      clock, and enable Share Audio. Devices with mismatched native sample rates can
      exhibit pitch or synchronization artifacts.
