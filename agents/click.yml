id: brew:click
display-name: Click
repo: null
docs:
  - https://github.com/databricks/click#readme
config-file-location:
  unix:
    - ~/.kube/config
    - $KUBECONFIG
credentials-file-location:
  unix:
    - ~/.kube/config
    - $KUBECONFIG
history:
  adoption-history:
    - >
      Click's official install paths include Cargo and source builds, with an AUR
      package documented by the README. Input package metadata also lists Homebrew,
      Debian, Ubuntu, Alpine, and Nix, showing that package-manager distribution
      expanded beyond the upstream Rust install path.
    - >
      The GitHub repository metadata showed more than one thousand stars at research
      time, indicating a visible but specialized Kubernetes operator audience.
  package-nerd-significance:
    - >
      Click is package-nerd interesting as a Kubernetes-era REPL distributed through
      Rust's Cargo ecosystem and system package managers. It overlaps with `kubectl`,
      but optimizes for repeated interactive work across many Kubernetes objects and
      contexts.
    - >
      Its packaging story also reflects a familiar CLI arc: first installable from a
      language package manager, then picked up by OS package managers as Kubernetes
      operators wanted a normal binary on their PATH.
  project-history:
    - >
      The GitHub repository was created in July 2017. The README describes Click as a
      REPL whose active configuration tracks the current Kubernetes context, namespace,
      and object so commands can be applied without repeatedly specifying targets.
    - >
      The official changelog labels version 0.3.0 as the first public release. Later
      releases added richer Kubernetes object support, completion, aliases, ranges,
      one-off execution, exec-provider authentication, Rust 2021, k8s-openapi, and newer
      table/rendering dependencies.
  related-projects:
    - >
      Kubernetes and kubectl are the core related tools because Click reads kubeconfig
      files and wraps Kubernetes object workflows.
    - >
      Cargo and crates.io are related distribution mechanisms because the README
      documents `cargo install click`.
    - The Arch AUR is a related package channel documented by the README.
  sources:
    - https://github.com/databricks/click#readme
    - https://github.com/databricks/click/blob/master/CHANGELOG.md
    - https://api.github.com/repos/databricks/click
    - https://api.github.com/repos/databricks/click/releases
  summary:
    - >
      Click is Databricks' Command Line Interactive Controller for Kubernetes, a Rust
      REPL for quickly managing Kubernetes clusters and objects.
  timeline:
    - '2017: The GitHub repository is created.'
    - >
      2022: GitHub release metadata records v0.6.0; the changelog notes migration to
      k8s-openapi and Rust 2021.
    - '2022: v0.6.2 adds configurable kubectl binary support.'
    - >
      2023: v0.6.3 adds experimental Teleport support, cronjob interaction, and a `last`
      command.
  usage:
    - >
      Click reads Kubernetes configuration from `~/.kube/config` by default and honors
      `KUBECONFIG` when set. It also stores its own configuration in the `.kube`
      directory, and its prompt tracks context, namespace, and object.
    - >
      The README documents authentication through tokens, username/password, private key
      and certificate, and GKE-style auth providers. The changelog shows later support
      for Azure and OIDC auth providers, CRDs, file copy, cronjobs, daemonsets,
      persistent volumes, and other operational commands.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Choose kubectl for Kubernetes' standard, scriptable command interface; choose
      Click when a stateful REPL is more convenient for repeated interactive operations.
    rel: alternative
    sources:
      - https://github.com/databricks/click#readme
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:k9s
    reason: >
      Choose K9s when you prefer a continuously updating full-screen terminal UI for
      browsing and operating cluster resources instead of Click's command-oriented REPL.
    rel: alternative
    sources:
      - https://github.com/databricks/click#readme
      - https://k9scli.io/
      - https://k9scli.io/topics/commands/
tags:
