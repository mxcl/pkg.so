history:
  adoption-history:
    - >
      Conar is distributed as a desktop database client with free and paid service
      tiers. Its public repository enables community inspection and contribution, but
      the official sources reviewed do not publish reliable adoption totals.
  package-nerd-significance:
    - >
      Conar combines a conventional cross-database desktop client with natural-language
      SQL assistance. Its public Electron and TypeScript codebase is useful to package
      enthusiasts studying how modern database GUIs combine local desktop packaging,
      cloud-synchronized connections, and hosted AI services.
  project-history:
    - >
      Conar was developed publicly as an open-source Electron application for
      simplifying database work. Its scope expanded across PostgreSQL, MySQL, Microsoft
      SQL Server, and ClickHouse, with AI-assisted querying and data management
      presented as core features.
  related-projects:
    - >
      PostgreSQL, MySQL, Microsoft SQL Server, ClickHouse, Electron, and the AI-provider
      integrations documented in the source repository are central to Conar's operation.
  sources:
    - https://conar.app/
    - https://github.com/wannabespace/conar
  summary:
    - >
      Conar is an open-source desktop database client that provides browsing, editing,
      filtering, and AI-assisted SQL workflows for several relational and analytical
      database systems.
  timeline:
    - >
      Current official product: Conar supports PostgreSQL, MySQL, Microsoft SQL Server,
      and ClickHouse.
  usage:
    - >
      Users save database connections, inspect schemas and records, create filters, edit
      data, and ask the integrated AI assistant to produce or refine SQL queries. The
      official site also advertises cloud synchronization for saved connections.
