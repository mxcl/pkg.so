id: brew:ibazel
display-name: ibazel
repo: null
docs:
  - https://github.com/bazelbuild/bazel-watcher#readme
config-file-location:
  unix:
    - '%WORKSPACE%/.bazel_fix_commands.json'
  windows:
    - '%WORKSPACE%/.bazel_fix_commands.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      ibazel became a common companion tool in Bazel-heavy developer workflows because
      it supplies the watch mode that many language-specific toolchains provide by
      default. Its README documents Homebrew, npm, Arch Linux AUR, and source-build
      installation paths, and Homebrew analytics show materially higher use than most
      packages in this batch.
  package-nerd-significance:
    - >
      ibazel is package-nerd candy because it sits at the boundary of build systems,
      file watching, editor feedback, live reload, npm distribution, Homebrew bottles,
      and Bazel's own repository culture. It is small enough to be a CLI utility, but
      important enough to show how a build ecosystem fills ergonomic gaps around a
      deliberately explicit core build tool.
  project-history:
    - >
      The Bazel watcher README frames the tool around a familiar edit-save-rerun loop:
      save a file, have tests rebuild, or restart a server after source changes. The
      repository states that it is not an official Google product, while it lives under
      the `bazelbuild` GitHub organization and uses Bazel itself for builds.
  related-projects:
    - >
      The README connects ibazel directly to Bazel and mentions generated repair
      workflows involving Buildozer and Gazelle. Its npm package path, `@bazel/ibazel`,
      also ties it into JavaScript projects using Bazel.
  sources:
    - https://formulae.brew.sh/formula/ibazel
    - https://github.com/bazelbuild/bazel-watcher
    - https://github.com/bazelbuild/bazel-watcher/releases
  summary:
    - >
      ibazel is the executable from Bazel watcher, a source-file watcher for Bazel
      projects that reruns `build`, `test`, or `run` targets after source changes.
  timeline:
    - 'v0.0.1: The repository contains an early public release tag.'
    - >
      2017: The README's profiler example records iBazel and Bazel version data around a
      development-server reload workflow.
    - >
      v0.15.x-v0.29.x: The tag history shows a long 0.x release series across the Bazel
      watcher repository.
    - '2026: The GitHub releases page lists v0.29.0 as an April 2026 release.'
  usage:
    - >
      Developers run commands such as `ibazel build //path/to:target`, `ibazel test`, or
      `ibazel run` during active development. The output runner feature reads
      `%WORKSPACE%/.bazel_fix_commands.json` and can prompt for generated repair
      commands such as Buildozer or Gazelle invocations.
related-packages:
  - id: brew:bazel
    reason: >
      ibazel is a watch-mode companion that repeatedly invokes Bazel builds, tests, and
      run targets when workspace sources change.
    rel: adjacent_workflow
    sources:
      - https://github.com/bazelbuild/bazel-watcher
      - https://bazel.build/
  - id: brew:buildozer
    reason: >
      ibazel's documented output runner can recognize Buildozer suggestions in Bazel
      output and prompt the user to apply those BUILD-file repairs.
    rel: adjacent_workflow
    sources:
      - https://github.com/bazelbuild/bazel-watcher
      - https://github.com/bazel-contrib/buildtools/blob/main/buildozer/README.md
