history:
  adoption-history:
    - >
      GR spread through scientific Python and Julia more than through a standalone
      desktop-app story. The project references presentations at PyCon DE 2012 and 2013,
      PyCon US 2013, EuroPython 2014 and 2015, EuroSciPy 2015, JuliaCon 2015 and 2016,
      and SciPy 2016.
    - >
      The project documentation says release 0.6 added Matplotlib backend support, and
      version 0.10.0 added inline graphics for IPython, Jupyter, and Julia-style
      interactive workflows. That made GR attractive as a fast plotting backend in
      notebooks and numerical environments.
  package-nerd-significance:
    - >
      GR is package-manager interesting because many users meet it indirectly through
      plotting stacks: a Python or Julia plotting package suddenly depends on a native
      graphics runtime, Qt terminal, fonts, OpenGL behavior, and platform-specific
      display plumbing.
    - >
      The package name libgr highlights the native-library layer beneath the friendlier
      GR Framework name. For maintainers, this means tracking not only source releases
      but also binary artifacts, shared-library search paths, and GUI terminal behavior.
  project-history:
    - >
      The GR documentation says the framework was developed by the Scientific IT-Systems
      group at the Peter Grunberg Institute, Forschungszentrum Juelich, with Josef
      Heinen as the main developer and maintainer. It positions GR as a self-contained
      visualization library suited to real-time and signal-processing environments.
    - >
      GR combines an implementation of GKS with OpenGL-backed rendering and related
      components such as GR3 for simple 3D scenes. The documentation records GR3 as work
      by Florian Rhiem and describes the library as usable directly from C or through
      Python ctypes and Julia ccall interfaces.
  related-projects:
    - GKS and OpenGL are the graphics foundations named by the GR documentation.
    - >
      Matplotlib, IPython, Jupyter, and Julia are major environments described by GR's
      documentation and references.
    - >
      GR3, GR.jl, python-gr, ruby-gr, and grplot are related components or bindings
      around the native library.
  sources:
    - https://github.com/sciapp/gr
    - https://github.com/sciapp/gr/blob/master/README.md
    - https://gr-framework.org/
    - https://gr-framework.org/about.html
    - https://gr-framework.org/references.html
  summary:
    - >
      GR Framework is a compact cross-platform visualization system for scientific and
      technical applications. Its C library is based on Graphical Kernel System ideas
      and OpenGL, while its bindings make it useful from Python, Julia, C, Rust, and
      other environments.
  timeline:
    - '2011: GR references include Neutron Science Visualization Software work at Juelich.'
    - >
      2012: GR was presented at PyCon DE and described as a universal framework for
      visualization applications.
    - '2013: GR was presented at PyCon US and PyCon DE.'
    - >
      2015-03-09: The v0.10.0 tag was created; the documentation associates 0.10.0 with
      inline graphics support for IPython and Jupyter-style environments.
    - >
      2016: GR was presented at JuliaCon and SciPy, showing adoption in Julia and Python
      scientific-computing communities.
  usage:
    - >
      Users install libgr for the native GR libraries and tools such as gksqt and
      grplot. Developers call the C API or use language packages to produce 2D graphs,
      3D scenes, inline notebook graphics, and GUI-integrated scientific visualizations.
    - >
      Because GR is self-contained and portable, it is often packaged as a native
      dependency below higher-level plotting packages. The Homebrew libgr formula gives
      macOS users the C-level runtime expected by language bindings and plotting
      frontends.
related-packages:
  - id: brew:julia
    reason: >
      GR's official Julia package installs and drives the GR runtime, making Julia a
      documented high-level environment for plots and scientific visualization.
    rel: adjacent_workflow
    sources:
      - https://gr-framework.org/julia.html
      - https://julialang.org/
  - id: brew:gnuplot
    reason: >
      gnuplot is a script-oriented alternative for 2D and 3D scientific plotting when a
      standalone command language is preferable to GR's native and language-binding
      APIs.
    rel: alternative
    sources:
      - https://www.gr-framework.org/
      - http://www.gnuplot.info/
