history:
  adoption-history:
    - >
      Frescobaldi evolved from a KDE-specific tool into a Python and Qt application
      intended for Linux, macOS, and Windows. This broadened it from its original
      Kate-plugin audience to LilyPond users across the major desktop platforms.
    - >
      It occupies a specialized place in the music-notation ecosystem: users retain
      LilyPond's text-based, version-controllable source files while gaining editor
      assistance, score setup, integrated engraving, PDF point-and-click navigation,
      MIDI playback, and documentation browsing.
  package-nerd-significance:
    - >
      Frescobaldi is a notable companion package to LilyPond because it provides an
      IDE-like workflow without replacing LilyPond's plain-text source model. That
      combination appeals to musicians who value reproducible engraving, source control,
      multiple LilyPond versions, and automation-friendly score files.
  project-history:
    - >
      Frescobaldi traces its roots to LilyKDE, a Python plugin for the KDE3 Kate editor
      released on Christmas 2007. When KDE4 initially lacked support for Python Kate
      plugins, LilyKDE became a standalone application and was renamed Frescobaldi.
    - >
      Frescobaldi 0.7 became the first public release on Christmas 2008, followed by
      1.0.0 on Christmas 2009 and 1.2.0 on Christmas 2010. The project then moved away
      from KDE4 libraries; Frescobaldi 2 was rewritten around Python and Qt for
      cross-platform availability.
  related-projects:
    - >
      LilyPond is the music-engraving engine and source language around which
      Frescobaldi's workflow is built.
    - LilyKDE was Frescobaldi's predecessor.
    - Poppler historically powered the integrated PDF music view.
  sources:
    - 'Official history and manual: https://frescobaldi.org/uguide.html'
    - 'Official homepage: https://frescobaldi.org/'
    - 'Official repository README: https://github.com/frescobaldi/frescobaldi'
  summary:
    - >
      Frescobaldi is a free, cross-platform text editor and integrated working
      environment for creating LilyPond sheet-music sources.
  timeline:
    - "2007: LilyKDE, Frescobaldi's predecessor, was released on Christmas."
    - '2008: Frescobaldi 0.7 became the first public release.'
    - '2009: Frescobaldi 1.0.0 was released.'
    - '2010: Frescobaldi 1.2.0 was released.'
    - '2011: Frescobaldi 2 was targeted as a Python-and-Qt rewrite for major desktop platforms.'
  usage:
    - >
      A typical workflow is to open or create a `.ly` source file, edit the notation
      with syntax assistance, run LilyPond, inspect errors and the generated score, and
      use point-and-click links between the PDF music view and source text. Frescobaldi
      also offers a score wizard, snippets, pitch and rhythm tools, MIDI support,
      MusicXML/MIDI/ABC import, and configurable LilyPond installations.
