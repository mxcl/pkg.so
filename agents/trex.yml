history:
  adoption-history:
    - >
      TRex is available from GitHub Releases, the Mac App Store, and the Homebrew cask
      recorded in both its official README and `source_facts.package-manager`. The
      official repository has also accumulated a substantial visible user community for
      a focused macOS utility.
    - >
      Its automation surface expanded beyond the menu bar to include a bundled
      command-line tool, URL schemes, Shortcuts integration, and official Alfred and
      Raycast workflows.
  package-nerd-significance:
    - >
      TRex packages macOS OCR into a low-friction menu-bar workflow: select a screen
      region and immediately receive text on the clipboard. It is especially attractive
      to automation-oriented Mac users because the same capture behavior can be invoked
      from a CLI, URL schemes, launchers, and Shortcuts.
    - >
      The project is open source under the MIT license and can work offline,
      distinguishing its original local OCR workflow from web-based OCR services.
  project-history:
    - >
      Ameba Labs developed TRex as an open-source macOS utility for extracting otherwise
      unselectable text using OCR. Its initial design centered on Apple-platform text
      recognition and a nearly invisible menu-bar interface.
    - >
      Later releases added QR and barcode recognition, command-line and automation
      interfaces, broader language support through Tesseract, update infrastructure, and
      more advanced OCR workflows. The official 2.0 release added table detection,
      optional LLM-backed recognition and post-processing, multi-region capture, watch
      mode, and capture history.
  related-projects:
    - >
      The README points to Alfred, Raycast, macOS Shortcuts, SwiftBar, and Ameba Labs'
      Esse as adjacent integrations or companion tools. TRex also relies on the broader
      Apple Vision and Tesseract OCR ecosystems.
  sources:
    - 'Official releases: https://github.com/amebalabs/TRex/releases'
    - 'Official repository and README: https://github.com/amebalabs/TRex'
    - >
      Repository URL supplied by `source_facts.repo`; Homebrew cask identity supplied by
      `source_facts.package-manager`.
  summary:
    - >
      TRex is an open-source macOS menu-bar OCR utility from Ameba Labs. It captures a
      selected screen region and places recognized text on the clipboard, with
      additional QR, barcode, CLI, URL-scheme, and automation support.
  timeline:
    - >
      Initial era: TRex established its select-a-region, copy-to-clipboard OCR workflow
      on macOS.
    - >
      2025: Version 1.9 expanded language support through Tesseract and added automatic
      updates.
    - >
      2026: Version 2.0 added table extraction, optional LLM processing, multi-region
      capture, watch mode, and persistent capture history.
  usage:
    - >
      Invoke Capture from the menu bar or a configurable global shortcut, select a
      screen region as if taking a screenshot, and use the recognized text from the
      clipboard. It is suited to screenshots, videos, screen sharing, images, and
      documents whose text cannot be selected.
    - >
      Advanced users can call the bundled CLI, invoke `trex://` URL schemes, run a
      Shortcut after capture, or connect the tool to Alfred and Raycast. Core
      README-documented features operate offline.
