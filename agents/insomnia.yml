history:
  adoption-history:
    - >
      Insomnia evolved from a Chrome application into an open-source standalone desktop
      client and later added commercial collaboration capabilities. Kong acquired the
      project in 2019 and continued developing it as part of its API tooling. Its
      protocol coverage expanded beyond REST and GraphQL to include gRPC, WebSockets,
      server-sent events, and SOAP-oriented workflows.
    - >
      A controversial cloud-oriented transition in the 8.x era was followed by Insomnia
      8.3 restoring fully local projects alongside encrypted Cloud Sync and Git Sync.
      That three-way storage model became an important adoption consideration for
      developers and organizations with data-residency requirements.
  package-nerd-significance:
    - >
      Insomnia sits in the same everyday toolbox as curl, Postman, HTTPie, and API
      specification tooling, but combines interactive request composition with
      environments, scripts, authentication helpers, API design, testing, plugins, and
      source-control workflows. Package users care about its ability to keep projects
      local or Git-backed and about its companion Inso CLI for automation and CI.
  project-history:
    - >
      Gregory Schier began Insomnia as a side project in the mid-2010s, first as a
      Chrome web application and then as an open-source standalone desktop application.
      Kong acquired Insomnia in October 2019, positioning it alongside Kong's broader
      API platform while retaining its developer-client role.
  related-projects:
    - Inso CLI brings Insomnia specifications and tests into command-line and CI workflows.
    - >
      Kong Gateway and Kong Konnect can consume or synchronize API configuration
      produced through the wider Kong toolchain.
    - Git Sync connects Insomnia projects to supported source-control repositories.
  sources:
    - https://developer.konghq.com/insomnia/
    - https://developer.konghq.com/insomnia/collected-data/
    - https://developer.konghq.com/insomnia/storage/
    - https://github.com/Kong/insomnia/discussions/6626
    - https://konghq.com/blog/news/kong-acquires-insomnia
    - source_facts.description
  summary:
    - >
      Insomnia is an API development client for designing, sending, debugging, and
      testing requests. It supports REST/HTTP, GraphQL, gRPC, WebSockets, event streams,
      environments, plugins, scripts, and multiple project-storage models.
  timeline:
    - >
      Mid-2010s: Insomnia began as Gregory Schier's side project and evolved from a
      Chrome app into a standalone open-source desktop client.
    - '2019: Kong acquired Insomnia.'
    - '2023: Insomnia 8.3 restored fully local projects alongside Cloud Sync and Git Sync.'
  usage:
    - >
      Developers organize requests into collections, define reusable environment values,
      configure authentication and headers, inspect responses, and import specifications
      or command-line requests. Teams can choose local storage, encrypted cloud
      collaboration, or Git-backed project storage, while Inso CLI supports linting and
      test automation.
