history:
  adoption-history:
    - >
      CharlesSoft maintained Pacifist across many macOS generations. Its official
      archive preserves releases compatible with systems ranging from Mac OS X 10.2
      through later Intel-era versions, while the current product supports Apple Silicon
      as well as 64-bit Intel Macs.
    - >
      The longevity reflects a recurring macOS power-user need: inspecting installer
      payloads and recovering selected files without running an entire installer.
  package-nerd-significance:
    - >
      Pacifist is unusually package-manager-adjacent for a desktop utility. It exposes
      the contents, scripts, and resources inside macOS installer packages and can
      analyze installation receipts to determine which package installed a file.
    - >
      That makes it useful for auditing unfamiliar installers, recovering individual
      operating-system components, comparing installed files with package contents, and
      understanding Apple's packaging formats.
  project-history:
    - >
      Pacifist developed into a general macOS package and archive workbench rather than
      only a file extractor. Its supported formats grew to include .pkg installers, disk
      images, asset catalogs, legacy Mac OS 9 Installer Tomes, and common compressed
      archives.
    - >
      Pacifist 4 was rewritten from the ground up in Swift 5 with an emphasis on
      multithreading, performance, and user-experience improvements. CharlesSoft also
      added Apple Silicon optimization while retaining Intel support.
  related-projects:
    - >
      macOS Installer and its .pkg format provide much of Pacifist's package-inspection
      use case.
    - Finder Quick Look integration exposes archive contents outside the main application.
    - >
      The command-line interface provides automation-oriented extraction alongside the
      graphical application.
  sources:
    - https://www.charlessoft.com/
    - https://www.charlessoft.com/pacifist_olderversions.html
    - https://www.charlessoft.com/pacifist_screenshots/index.html
  summary:
    - >
      Pacifist is a macOS utility from CharlesSoft for opening, inspecting, searching,
      and extracting installer packages, disk images, and archives. It can also inspect
      installation scripts and receipts, analyze existing installations, and operate
      through either a GUI or command line.
  timeline:
    - 'Pacifist 2: Official archived builds supported Mac OS X 10.2 and later systems.'
    - 'Pacifist 3: Compatibility expanded across the Intel-era Mac OS X release range.'
    - 'Pacifist 4: The application was rewritten in Swift 5 with a multithreaded architecture.'
    - >
      Apple Silicon era: Pacifist was optimized for Apple Silicon while retaining 64-bit
      Intel support.
  usage:
    - >
      Users open a package, disk image, or archive and extract only the desired files or
      folders. They can inspect scripts before installation, search installer receipts
      for the origin of an installed file, or scan a system for package files that are
      missing or changed.
    - >
      Pacifist also supports Quick Look previews and an automation-friendly command-line
      interface, making it useful beyond its primary graphical workflow.
