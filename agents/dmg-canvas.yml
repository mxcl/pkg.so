history:
  adoption-history:
    - >
      DMG Canvas has been maintained across major macOS transitions, adding Retina-ready
      design, code signing, notarization, APFS and modern compression, Apple silicon-era
      compatibility, and command-line build automation. Araelium's archive shows
      releases from version 1 in 2008 through version 4 in the 2020s.
  package-nerd-significance:
    - >
      DMG Canvas packages a traditionally script-heavy macOS release task into a
      reproducible visual project. Its command-line builder is particularly relevant to
      release engineers who want designed DMG artifacts in Xcode or
      continuous-integration workflows.
  project-history:
    - >
      Araelium released DMG Canvas 1.0 in July 2008. Version 2 arrived in February 2010,
      version 3 was maintained through 2021, and version 4 introduced a redesigned
      interface, a human-readable document format, modern notarization support, and
      updated disk-image formats.
  related-projects:
    - >
      DMG Canvas complements Apple's disk-image, code-signing, and notarization tools
      and Araelium's Package Builder product.
  sources:
    - >
      Official previous-version archive:
      https://www.araelium.com/support/dmgcanvas/download-previous-versions
    - 'Official pricing and version-4 overview: https://www.araelium.com/dmgcanvas/pricing'
    - 'Official product page: https://www.araelium.com/dmgcanvas'
  summary:
    - >
      DMG Canvas is Araelium's visual macOS tool for designing, building, signing, and
      notarizing distributable disk images.
  timeline:
    - '2008: DMG Canvas 1.0 is released.'
    - '2010: DMG Canvas 2.0 is released.'
    - '2021: The final listed DMG Canvas 3 release appears.'
    - >
      2023: DMG Canvas 4 adopts Apple's newer notarization service and a human-readable
      project format.
    - '2025: Version 4.2 adds further updates in the official release archive.'
  usage:
    - >
      Developers lay out files, backgrounds, text, and localized license agreements in a
      visual editor and build a finished DMG. Builds can be automated with the bundled
      dmgcanvas command-line tool or integrated into Xcode-oriented release workflows.
