history:
  adoption-history:
    - >
      The Toolbox became the graphical desktop environment for users who wanted to
      author specifications and operate the TLA+ tools without assembling command-line
      invocations. The official installation page also documents distribution through a
      Homebrew cask on macOS.
    - >
      The project later gained a lighter-weight alternative in the official TLA+
      extension for Visual Studio Code. The repository now characterizes the
      Eclipse-based Toolbox as unmaintained while continuing to make it available
      alongside the command-line tools.
  package-nerd-significance:
    - >
      The package bundles a formal-specification editor with the TLC model checker,
      PlusCal translator, pretty-printer, and proof-system integration. It is an
      unusually substantial developer tool to install through a desktop package manager.
    - >
      Its Eclipse RCP lineage, Java runtime requirements, bundled toolchain, and
      cross-platform archives make it a recognizable example of packaging a
      research-oriented verification environment for ordinary workstations.
  project-history:
    - >
      TLA+ Toolbox was written by Simon Zambrovski and subsequently improved by Markus
      Kuppe and Daniel Ricketts. It is based on the Eclipse platform and shares the main
      tlaplus/tlaplus repository with the core command-line tools.
    - >
      The repository is managed by the TLA+ Foundation and contains both the Toolbox
      sources and tools such as TLC, SANY, PlusCal, and the TLA+ pretty-printer.
  related-projects:
    - TLC model checker
    - PlusCal translator
    - TLA+ Proof System (TLAPS)
    - TLA+ extension for Visual Studio Code
    - CommunityModules
  sources:
    - https://docs.tlapl.us/using%3Atoolbox
    - https://github.com/tlaplus/tlaplus#readme
    - https://lamport.azurewebsites.net/tla/toolbox.html
    - source_facts.package-manager
  summary:
    - >
      TLA+ Toolbox is the Eclipse-based integrated development environment for the TLA+
      formal-specification toolchain. It supports writing specifications, translating
      PlusCal, running TLC, inspecting error traces, producing formatted modules, and
      invoking the TLA+ proof system.
  timeline:
    - >
      Initial development: Simon Zambrovski writes the Toolbox, followed by improvements
      from Markus Kuppe and Daniel Ricketts.
    - >
      2013: Older bugs remain in the historical Bugzilla archive while current issue
      tracking moves to GitHub.
    - >
      Later development: The Toolbox and core TLA+ command-line tools are consolidated
      in the tlaplus/tlaplus repository.
    - >
      Current status: The repository recommends the TLA+ Visual Studio Code extension
      for graphical use and describes the Eclipse Toolbox as unmaintained.
  usage:
    - >
      Users create or open a TLA+ specification, edit its modules, define TLC models,
      and run model checking from the graphical interface. Error traces can be explored
      interactively and formulas evaluated at individual trace steps.
    - >
      The Toolbox can also run the PlusCal translator, generate pretty-printed output,
      and integrate with TLAPS. Its embedded help pages are the primary user manual.
