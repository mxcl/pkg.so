config-file-location:
  linux:
    - ~/.config/StarUML/keymap.json
  macos:
    - ~/Library/Application Support/StarUML/keymap.json
  windows:
    - C:\Users\<user>\AppData\Roaming\StarUML\keymap.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The original StarUML was used in more than one hundred countries and exceeded
      three million downloads according to the developers' 2014 announcement. After the
      original sponsor closed and development stopped, the original developers began a
      new generation built with web technologies.
    - >
      The modern commercial line preserved cross-platform desktop distribution and
      developed an extension ecosystem. Homebrew Cask provides another installation path
      for macOS users.
  package-nerd-significance:
    - >
      StarUML spans two software-distribution eras: an older GPL-licensed generation and
      a proprietary, commercially sustained successor. That transition makes it a useful
      example of a mature desktop developer tool changing its funding and licensing
      model while retaining its product identity.
    - >
      Its Electron/web-technology extension model, public extension repositories, custom
      keymaps, package registry, and support for code and documentation generation give
      it relevance beyond diagram drawing.
  project-history:
    - >
      StarUML began as an open-source UML modeling project. After its sponsor closed and
      the old project became unmaintained, the original developers rebuilt the
      application using HTML5, CSS, and JavaScript and commercialized the new generation
      to fund continued development and support.
    - >
      StarUML 2 entered public beta in May 2014 and reached its official 2.0 release in
      December 2014. Subsequent releases expanded the product beyond core UML into ER
      diagrams, flowcharts, data-flow diagrams, multiple windows, extensions, additional
      modeling languages, cloud architecture notation, and AI integration.
  related-projects:
    - >
      The official StarUML GitHub organization publishes extensions, samples, CLI
      examples, an MCP server, and historical framework projects, but not the
      proprietary current desktop application's source.
    - >
      Official extensions cover languages and interchange formats including Java, C++,
      C#, XMI, and other code-generation or reverse-engineering workflows.
  sources:
    - https://docs.staruml.io/
    - https://docs.staruml.io/user-guide/customization
    - https://github.com/staruml
    - https://staruml.io/blog/
    - https://staruml.io/blog/posts/staruml-2-0-0-beta1-release/
    - https://staruml.io/blog/posts/staruml-2-0-0-official-release-out-of-beta/
    - https://staruml.io/help
    - source_facts.package-manager
  summary:
    - >
      StarUML is a cross-platform software-modeling application centered on UML and
      extended to database, process, systems, architecture, and general-purpose diagram
      types. It combines a commercial desktop product with an extension API and a public
      ecosystem of samples and add-ons.
  timeline:
    - >
      2014: The original developers released the StarUML 2 beta with a new
      web-technology stack and commercial model.
    - '2014: StarUML 2.0 reached its official release.'
    - '2015: StarUML 2.1 added entity-relationship diagrams.'
    - '2016: StarUML 2.6 added flowcharts.'
    - '2018: StarUML 3 introduced multiple windows, data-flow diagrams, and automatic updates.'
    - >
      2025: StarUML 7 added Mermaid diagrams, Azure architecture support, and AI
      integration through MCP.
  usage:
    - >
      Use StarUML to build and document software models, including UML class, sequence,
      component, deployment, state, activity, and use-case diagrams, alongside ERD,
      BPMN, SysML, C4, flowchart, and cloud-architecture models.
    - >
      Customize shortcuts with `keymap.json` in the documented per-user configuration
      directory. Install extensions through the Extension Manager, from a GitHub URL, or
      manually in the platform-specific user extension directory.
