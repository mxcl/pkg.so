history:
  adoption-history:
    - >
      The official site positions Shimo for individual Mac users, consultants, power
      users, and organizations managing many VPN accounts. Homebrew Cask distribution
      also makes the commercial application usable in scripted Mac provisioning.
  package-nerd-significance:
    - >
      Shimo is notable to Mac package users because one native client supports a
      heterogeneous set of VPN technologies—including WireGuard, OpenVPN, IPsec,
      AnyConnect, Fortinet, GlobalProtect, Ivanti, and SSH—and can export deployable
      connection packages.
  project-history:
    - >
      Shimo is a commercial macOS VPN client currently published and supported by Jäger
      Apps. It manages user-supplied VPN configurations rather than operating a VPN
      service of its own, and emphasizes multi-protocol support, concurrent connections,
      automation, deployment, and accounting.
  related-projects:
    - WireGuard
    - OpenVPN
    - IPsec
    - Cisco AnyConnect
    - Homebrew Cask
  sources:
    - https://jaeger.freshdesk.com/support/solutions/205000079074
    - https://www.shimovpn.com/
    - https://www.shimovpn.com/specs/
    - https://www.shimovpn.com/terms/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Shimo is a commercial multi-protocol VPN client for macOS, currently published by
      Jäger Apps.
  timeline:
    - >
      2026: Shimo's official terms identify Jäger Apps as the software's licensor and
      distinguish the client from third-party VPN services.
  usage:
    - >
      Users create or import VPN accounts, provide the credentials, certificates, or
      tokens required by their organization or VPN provider, and connect from the macOS
      menu bar. Shimo can maintain concurrent connections and automate connection
      changes using network, Wi-Fi, location, or application triggers.
    - >
      The official site states that passwords, PINs, certificates, and other account
      information are stored in the macOS Keychain. Administrators can export
      connections with supporting files and settings as deployment packages.
