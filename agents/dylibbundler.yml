history:
  adoption-history:
    - >
      The README documents source builds with make plus MacPorts and Homebrew
      installation. The batch input likewise lists Homebrew and MacPorts, matching its
      niche as a macOS packaging/deployment helper for developers who ship application
      bundles.
  package-nerd-significance:
    - >
      dylibbundler is useful package-nerd plumbing for the awkward boundary between
      Unix-style shared libraries and macOS .app bundles. It automates a task that
      otherwise requires many install_name_tool and copy operations, especially for
      ports of Linux or other Unix software to macOS.
  project-history:
    - >
      The official git history begins on 2014-05-29 under the macdylibbundler
      repository. Tagged releases visible from the official repository include
      0.4.5-release in 2019, 1.0.0 in 2021, and 1.0.5 in 2022.
  related-projects:
    - >
      The README places dylibbundler near Apple's command-line tools for dynamic
      libraries, especially otool and install_name_tool, and near MacPorts/Homebrew
      workflows for shipping Unix-derived macOS applications.
  sources:
    - https://github.com/auriamg/macdylibbundler#readme
    - https://github.com/auriamg/macdylibbundler
  summary:
    - >
      dylibbundler is a macOS command-line utility for collecting dynamic-library
      dependencies into an application bundle. The official README frames it as a fix
      for the practical pain of distributing Unix-ported macOS apps that depend on
      .dylib files.
  timeline:
    - '2014: Initial commits land in the official repository.'
    - '2019: 0.4.5-release tag created.'
    - '2021: 1.0.0 tag created.'
    - '2022: 1.0.5 tag created.'
  usage:
    - >
      Users point dylibbundler at an executable or plugin with -x, ask it to bundle
      dependencies with -b, choose a destination directory with -d, and set the runtime
      install path with -p. The tool walks otool -L dependencies, copies libraries,
      changes install names, and prepares the executable and bundled libraries for
      distribution.
related-packages:
  - id: brew:cmake
    reason: >
      Choose CMake BundleUtilities when dependency collection and bundle fixups should
      run inside a CMake installation script; choose dylibbundler for a focused
      standalone post-build command.
    rel: alternative
    sources:
      - https://github.com/auriamg/macdylibbundler
      - https://cmake.org/cmake/help/latest/module/BundleUtilities.html
