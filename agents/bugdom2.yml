  summary:
    - >
      Bugdom 2 is Pangea Software’s 2002 sequel to Bugdom. The packaged edition is an
      authorized modern port for macOS, Windows, and Linux.
  timeline:
    - '2002: Pangea Software released Bugdom 2.'
    - '2010: Pangea issued its last PowerPC and 32-bit Intel version.'
    - '2023: The modern cross-platform port received its initial release.'
  usage:
    - >
      Players explore a 3D world from an insect-scale perspective, completing
      action-adventure levels as the grasshopper Skip.
    - >
      The modern release adds widescreen presentation and improved mouse and controller
      support while preserving the original game.
    - >
      The repository includes multilingual original manuals, source-build instructions,
      a changelog, and documented cheat codes.
