history:
  adoption-history:
    - >
      The original sequel remained part of Pangea Software’s catalog through PowerPC and
      32-bit Intel Mac releases, with the last such version recorded in 2010.
    - >
      Iliyas Jorio’s authorized modern release made the game readily available on macOS,
      Windows, and Linux and placed it alongside a larger collection of maintained
      Pangea ports.
  package-nerd-significance:
    - >
      Bugdom 2 is a compact example of source-enabled game preservation: an older
      commercial Mac title was authorized for redistribution as a modern, cross-platform
      package.
    - >
      Its modern build uses common portable tooling and libraries, making the game
      easier for package managers to deliver than its historical Mac-only releases.
  project-history:
    - >
      Pangea Software released Bugdom 2 in 2002 as the sequel to Bugdom. The game
      continued the series’ insect-scale 3D action-adventure format.
    - >
      Pangea’s final PowerPC and 32-bit Intel version was released in 2010. Iliyas Jorio
      later produced a modern port with Pangea Software’s permission.
    - >
      The modern version first released in October 2023, adding cross-platform and
      widescreen support, improved mouse and controller handling, seamless terrain
      texturing, and gameplay fixes.
