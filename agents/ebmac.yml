credentials-file-location: null
history:
  adoption-history:
    - >
      EBMac began as a dedicated EPWING viewer but progressively added compatibility
      with adjacent dictionary formats and collections, including EBWin user
      dictionaries, StarDict, MDict, PDIC, ABBYY Lingvo DSL, and LogoVista material.
    - >
      The application followed macOS platform changes through 64-bit conversion,
      Developer ID signing, Catalina notarization, dark mode, and an experimental
      universal build for Apple Silicon.
  package-nerd-significance:
    - >
      EBMac preserves access to locally owned electronic dictionaries in EPWING and
      related formats, making it important to collectors and language-tool enthusiasts
      who prefer durable offline reference data over subscription services.
    - >
      Its cross-dictionary search, full-text indexes, custom Unicode mappings, URL
      scheme, Services integration, clipboard search, and AppleScript support make an
      older Japanese electronic-dictionary ecosystem usable in modern Mac workflows.
  project-history:
    - >
      EBMac was publicly released by hishida in December 2010 as a macOS EPWING and
      electronic-book viewer. Early releases rapidly added cross-dictionary search,
      bookmarks, history, web search, URL-scheme automation, Services integration, and
      AppleScript.
    - >
      During the 2010s the project expanded beyond EPWING, adding EBWin-format user
      dictionaries, StarDict, MDict, vertical writing, and full-text indexing. Later
      releases addressed macOS security and architecture transitions while maintaining
      compatibility with numerous commercial Japanese dictionary titles.
  related-projects:
    - EBWin is the related Windows dictionary viewer, and EBPocket serves mobile platforms.
    - >
      EBStudio creates JIS X 4081 and electronic-book dictionaries that EBMac can search
      and display.
    - EBShrink on Mac is documented in the same official release-history page.
  sources:
    - 'Official FAQ: https://ebstudio.info/manual/EBMac/81faq.php'
    - 'Official manual: https://ebstudio.info/manual/EBMac/'
    - 'Official release history: https://ebstudio.info/manual/EBMac/91hist.php'
    - 'Official search documentation: https://ebstudio.info/manual/EBMac/21search.php'
    - 'Official settings documentation: https://ebstudio.info/manual/EBMac/31settings.php'
  summary:
    - >
      EBMac is a freeware macOS viewer for EPWING electronic dictionaries and several
      related offline dictionary formats. It supports individual and combined dictionary
      searches, full-text search, bookmarks, history, custom character mappings, and
      automation interfaces.
  timeline:
    - '2010: EBMac 0.90 was publicly released.'
    - '2011: URL-scheme, Services, clipboard-search, and AppleScript integration were added.'
    - '2014: EBMac became a 64-bit application.'
    - '2015: EBWin user dictionaries and StarDict support were added.'
    - '2016: MDict support was added.'
    - '2019: Catalina notarization and dark mode support arrived.'
    - >
      2020: ABBYY Lingvo DSL support was added and an Apple Silicon universal build was
      offered experimentally.
    - >
      2024: Version 1.47.0 updated dictionary mappings, MDict rendering, and the minimum
      supported macOS version.
  usage:
    - >
      Register folders containing EPWING, electronic-book, LogoVista, or PDIC
      dictionaries in Preferences, then search one dictionary or an entire configured
      group.
    - >
      EBMac supports incremental, exact, prefix, suffix, crossword, conditional,
      compound, full-text, automatic, and web searches.
    - >
      Power users can query through `ebmac://`, AppleScript, the macOS Services menu, or
      clipboard monitoring. Custom Unicode search substitutions can be stored in
      `alternate.ini`.
