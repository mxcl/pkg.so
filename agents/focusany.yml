history:
  adoption-history:
    - >
      FocusAny is distributed for macOS, Windows, and Linux and is also packaged as a
      Homebrew cask for macOS. Its extension model supports store installation, local
      ZIP import, and developer-directory debugging.
    - >
      The project has grown around a plugin marketplace, an SDK, integrations with more
      than 40 AI providers, and support for exposing plugin tools through MCP.
  package-nerd-significance:
    - >
      FocusAny combines several current desktop-tooling trends in one open-source
      application: launcher-style global search, an extensible plugin system, local and
      hosted language models, MCP interoperability, and visual workflow automation.
    - >
      Its public Apache-2.0 repository and documented local-development workflow make it
      useful both as an installable productivity tool and as a platform that package and
      plugin developers can inspect and extend.
  project-history:
    - >
      FocusAny developed as an open-source, cross-platform productivity toolbar. Its
      scope expanded beyond global search and quick actions to encompass clipboard
      history, screenshots, file and window tools, a plugin ecosystem, AI-provider
      integrations, an MCP server, and visual workflows.
    - >
      The project's 1.0-era changelog identifies AI and MCP support, remote-web caching,
      expanded plugin debugging, and workflow-related improvements as major additions.
  related-projects:
    - focusany-sdk, the plugin SDK maintained within the FocusAny repository.
    - The official README also links official mirrors on Gitee and GitCode.
  sources:
    - 'Official README: https://github.com/modstart-lib/focusany#readme'
    - 'Official changelog: https://github.com/modstart-lib/focusany/blob/main/changelog.md'
    - 'Official documentation: https://focusany.com/zh/document'
    - 'Official site: https://focusany.com/'
  summary:
    - >
      FocusAny is an Apache-2.0-licensed, cross-platform productivity toolbar combining
      global search, quick actions, plugins, AI-model access, MCP tools, and visual
      workflow automation.
  timeline:
    - >
      1.0 era: Added broad AI-provider integration, MCP server support, and expanded
      plugin tooling.
    - >
      2026: Official site presents FocusAny as a cross-platform AI productivity
      assistant with a plugin marketplace and visual workflows.
  usage:
    - >
      Invoke the toolbar with Alt/Option+Space, search for applications or actions, and
      install additional capabilities from the plugin store or a local ZIP. Users can
      configure hosted or local AI providers and build visual workflows; developers can
      build Vue or React plugins with focusany-sdk.
