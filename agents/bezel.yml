history:
  adoption-history:
    - >
      Bezel targets developers, designers, presenters, and product teams that need to
      show a physical iPhone or iPad on a Mac. The official site describes use for
      demonstrations, recordings, screenshots, presentations, and checking work on real
      devices.
    - >
      Nonstrict expanded the product beyond its original cable-connected Mac workflow
      with a separate Apple Vision Pro edition in 2024, broader device support and
      full-screen presentation in Bezel 3.0, and wireless AirPlay mirroring in Bezel
      4.0.
  package-nerd-significance:
    - >
      Bezel occupies a polished native-app niche between QuickTime-style device capture,
      Apple's own iPhone Mirroring, and more elaborate streaming software. It is
      especially relevant to package-oriented Mac users who repeatedly demonstrate or
      record mobile software and want automatic device frames, rotation, screenshots,
      audio, and presentation-oriented controls.
  project-history:
    - >
      Nonstrict founders Mathijs Kadijk and Tom Lokhorst created Bezel after seeking a
      simpler and more realistic way to present work on iOS applications. The first
      macOS release launched on September 26, 2023 and mirrored a cable-connected iPhone
      inside an accurate device frame.
    - >
      The project subsequently grew into a broader Apple-device presentation toolkit.
      Nonstrict launched a native visionOS edition in February 2024, released Bezel 3.0
      with full-screen mode and localization in June 2025, and added wireless mirroring
      to the Mac edition in Bezel 4.0 in February 2026.
  related-projects:
    - >
      Bezel is related in purpose to QuickTime Player device capture, Apple's iPhone
      Mirroring, AirPlay receivers, and screen-recording or presentation applications.
  sources:
    - https://nonstrict.eu/bezel/
    - https://nonstrict.eu/blog/2023/launching-bezel/
    - https://nonstrict.eu/blog/2024/launching-bezel-for-vision/
    - https://nonstrict.eu/blog/2025/launching-bezel-3.0/
    - https://nonstrict.eu/blog/2026/launching-bezel-4.0/
  summary:
    - >
      Bezel is Nonstrict's native Apple-device mirroring and presentation application.
      It displays an iPhone, iPad, Apple TV, or Vision Pro feed on a Mac with a
      realistic device frame and tools for recording, screenshots, audio, and
      full-screen presentation.
  timeline:
    - >
      2023: Nonstrict launched the first macOS version of Bezel with cable-connected
      iPhone mirroring.
    - >
      2024: Bezel for Apple Vision Pro launched with wireless mirroring into a
      three-dimensional device model.
    - >
      2025: Bezel 3.0 added full-screen presentation, expanded device onboarding, and
      nine interface languages.
    - '2026: Bezel 4.0 introduced wireless AirPlay mirroring on macOS.'
  usage:
    - >
      Users connect a supported device by USB or configure Bezel as an AirPlay
      destination, then mirror the device in a matching frame. Common workflows include
      live application demos, video calls, classroom or stakeholder presentations,
      high-resolution screenshots, and screen recordings.
