history:
  adoption-history:
    - >
      Nook entered public alpha as an open-source, local-first Mac browser. Its sidebar,
      spaces, vertical-tab workflow, and community roadmap positioned it among browsers
      exploring alternatives to a conventional horizontal tab strip. Development later
      resumed under a new maintainer and repository home.
  package-nerd-significance:
    - >
      Nook is a native, GPL-licensed macOS browser built around WebKit and modern Apple
      frameworks. It interests package-oriented users as a source-available browser
      outside the dominant Chromium and Firefox application families, and Homebrew Cask
      provides repeatable binary installation.
  project-history:
    - >
      Nook began as an experiment in a calm, local-first, open browser for macOS. Its
      first public alpha appeared in October 2025. The project later changed
      maintainership and resumed active development in September 2026, with the
      application bundle identifier changing as part of the transition.
  related-projects:
    - >
      Its sidebar-first spaces and vertical-tab design place it in the same design
      conversation as Arc and other alternative browsers, while its native
      implementation uses Apple's WebKit rather than shipping a Chromium engine.
  sources:
    - 'Official Nook website: https://browsewithnook.com/'
    - 'Official changelog: https://browsewithnook.com/whats-new'
    - 'Official releases: https://github.com/nook-browser/Nook/releases'
    - 'Official repository and README: https://github.com/nook-browser/Nook'
  summary:
    - >
      Nook is an open-source, native macOS web browser with a minimal interface and
      sidebar-first tab organization.
  timeline:
    - "2025: Nook's first public alpha was announced in October."
    - '2026: Development restarted in September under a new maintainer and repository home.'
    - >
      2026: The revived release line reworked tab management, combined profiles with
      spaces, strengthened ad blocking, and hardened security.
  usage:
    - >
      Users browse with vertical tabs organized into spaces, use split view and a
      command palette, and keep browsing state locally. The project also supports
      building from source with Xcode, while packaged releases provide the normal
      end-user installation route.
