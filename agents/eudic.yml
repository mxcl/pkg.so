history:
  adoption-history:
    - >
      Eudic expanded from a Mac dictionary into clients for macOS, Windows, Linux, iOS,
      and Android, with synchronized vocabulary books and learning notes. Its official
      guide reports use by millions of learners and recognition in Apple storefronts
      across multiple regions.
    - >
      Support for imported MDict, Lingoes, and Babylon dictionaries made it attractive
      to users who curate large offline reference collections in addition to using
      built-in and online dictionaries.
  package-nerd-significance:
    - >
      Eudic is notable among desktop language tools for combining offline dictionaries,
      third-party dictionary formats, screen selection lookup, document translation,
      vocabulary review, and cross-device synchronization in one application.
    - >
      Its Mac client is especially relevant to package users who want system-wide word
      lookup and a locally installed dictionary corpus rather than a browser-only
      translation service.
  project-history:
    - >
      Eudic's official guide dates the first Mac release to 2009 and describes it as the
      first Mac dictionary application to support mouse-based screen word capture.
    - >
      Over the following decade, the product expanded across desktop and mobile
      platforms and added cloud synchronization, document reading, vocabulary study,
      pronunciation analysis, and AI-assisted translation and writing features.
  related-projects:
    - 欧路翻译
    - 每日英语听力
    - MDict
    - WordNet
  sources:
    - https://dict.eudic.net/areas/gitbook/1.html
    - https://www.eudic.net/v4/en/app/eudic
    - https://www.eudic.net/v4/en/app/history?appkey=eusoft_eudic_en
  summary:
    - >
      Eudic, branded in Chinese as 欧路词典, is a cross-platform English dictionary,
      translation, reading, and vocabulary-learning application.
  timeline:
    - '2009: The first Eudic Mac edition was released with mouse-based screen word capture.'
    - >
      2010s: Eudic expanded to Windows, Linux, iOS, and Android with synchronized
      learning data.
    - >
      2020s: The product added AI-assisted translation, writing, explanations, and
      conversation features.
  usage:
    - >
      Users look up words, capture selected text from other Mac applications, translate
      text and documents, import third-party dictionaries, maintain vocabulary books and
      notes, and synchronize learning data across devices.
