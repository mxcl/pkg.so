history:
  adoption-history:
    - >
      The project became known through differential testing of C compilers. The README
      points to the paper Finding and Understanding Bugs in C Compilers as the best
      summary of the research, and the packaged tool is available across Homebrew and
      several Linux distributions according to the input package-manager facts.
  package-nerd-significance:
    - >
      Csmith is a compact command-line generator with outsized value for compiler
      packages: it can be scripted into local compiler checks, regression hunts, and
      distribution QA without a large service dependency.
  project-history:
    - >
      The official README says Csmith was developed at the University of Utah by Xuejun
      Yang, Yang Chen, Eric Eide, and John Regehr as part of a compiler-testing research
      project. It says the project was open sourced in 2009 and is maintained as an
      open-source project in discretionary time.
  related-projects:
    - >
      The README's primary related projects are C compilers such as GCC and Clang, used
      as differential-testing targets.
  sources:
    - https://github.com/csmith-project/csmith#readme
    - https://api.github.com/repos/csmith-project/csmith
    - https://formulae.brew.sh/formula/csmith
  summary:
    - >
      Csmith is a random C program generator designed for compiler testing. It is a
      package-nerd staple because it turns compiler validation into a repeatable
      command-line workload that distributions can package and compiler developers can
      run locally.
  timeline:
    - '2009: Csmith was open sourced.'
    - '2011: The GitHub repository was created.'
    - '2026: Homebrew formula metadata lists stable version 2.3.0.'
  usage:
    - >
      Official usage examples generate a random C file with csmith, compile it with GCC
      and Clang, run both outputs, and compare results. The README also notes that
      generated programs avoid undefined behavior and that timeouts are best practice
      because generated programs can contain infinite loops.
related-packages:
  - id: brew:gcc
    reason: >
      Use GCC as one side of Csmith differential testing, compiling generated programs
      under GCC and another compiler or optimization setting to identify divergent
      results.
    rel: adjacent_workflow
    sources:
      - https://github.com/csmith-project/csmith#readme
      - https://gcc.gnu.org/
  - id: brew:llvm
    reason: >
      Use LLVM's Clang as a contrasting compiler for Csmith-generated programs; Csmith's
      official example compares GCC and Clang output directly.
    rel: adjacent_workflow
    sources:
      - https://github.com/csmith-project/csmith#readme
      - https://clang.llvm.org/
  - id: brew:creduce
    reason: >
      Use C-Reduce after Csmith finds a compiler discrepancy to shrink the generated C
      test case while preserving the crash, miscompilation, or other interesting
      behavior.
    rel: adjacent_workflow
    sources:
      - https://github.com/csmith-project/csmith#readme
      - https://github.com/csmith-project/creduce
