history:
  adoption-history:
    - >
      Maxon describes Cinebench as an industry-standard benchmark. Its users include
      individual computer owners, IT administrators evaluating purchases, technology
      journalists, and hardware manufacturers validating or optimizing systems.
    - >
      The benchmark's score ranges and underlying workloads evolve with Cinema 4D and
      Redshift. Maxon therefore warns that Cinebench 2026 scores should not be compared
      directly with earlier Cinebench generations.
  package-nerd-significance:
    - >
      Cinebench is a familiar package-nerd tool for quick post-installation validation,
      thermal and stability checks, and comparative CPU or GPU testing. Packaging makes
      it easy to deploy the same benchmark build across otherwise similar Macs.
    - >
      Version pinning matters: compiler, renderer, workload, and scoring changes can
      invalidate comparisons across major releases, so reproducible benchmark results
      require recording the exact Cinebench generation and settings.
  project-history:
    - >
      Cinebench was derived from Maxon's professional Cinema 4D rendering technology to
      measure real-world computer performance. Current releases use the Redshift render
      engine and a consistent production-style scene for CPU and GPU tests.
    - >
      Cinebench 2024 expanded the modern benchmark to Redshift CPU and GPU workloads.
      Cinebench 2026 updated hardware support, compiler and rendering components, added
      an SMT-oriented CPU test, and recalibrated its scoring range.
  related-projects:
    - Cinema 4D
    - Redshift
    - Maxon One
  sources:
    - 'Official measurement methodology: https://www.maxon.net/en/how-we-measure-in-cinebench'
    - 'Official product page: https://www.maxon.net/en/cinebench'
    - >
      Official release notes:
      https://support.maxon.net/hc/en-us/articles/10379226739996-Cinebench-2026-0-0-December-29-2025
    - 'Official technical information: https://www.maxon.net/en/tech-info-cinebench'
    - source_facts.package-manager
  summary:
    - >
      Cinebench is Maxon's free cross-platform CPU and GPU benchmarking utility, based
      on rendering technology used by Cinema 4D and Redshift.
  timeline:
    - '2023-09: Cinebench 2024.0.1 release documented.'
    - '2024-11: Cinebench 2024.1.0 released.'
    - >
      2025-12-29: Cinebench 2026.0.0 released with broader hardware support and
      recalibrated scores.
  usage:
    - >
      Run the CPU multiple-thread, CPU single-thread, CPU single-core SMT, or GPU test
      appropriate to the comparison. Close background workloads before testing because
      indexing, security software, browsers, and operating-system activity can affect
      results.
    - >
      Advanced benchmark options allow longer minimum runtimes for sustained-load and
      cooling tests. Results should only be compared within the same Cinebench
      generation and equivalent test configuration.
