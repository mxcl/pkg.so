history:
  adoption-history:
    - >
      Usenapp developed as a native 64-bit macOS client combining traditional newsgroup
      reading with the NZB-centered workflows common in modern binary Usenet use.
    - >
      Its feature set grew to include multiple primary and backup news servers, Newznab
      and Spotweb indexers, SuperSearch and MegaSearch, Watchdog automation, Smart
      Folders, bandwidth controls, and automatic repair and extraction.
    - >
      The application is available through the Homebrew cask `usenapp`, providing a
      package-manager installation route alongside the vendor download.
  package-nerd-significance:
    - >
      Usenapp bundles several tools that Unix-oriented Usenet users often assemble
      separately: a newsreader, indexer search, NZB queue, watch-folder automation,
      bandwidth scheduling, and post-processing.
    - >
      For Mac package users, the cask turns a commercial, vendor-distributed client into
      a manageable application package while preserving access to a comparatively
      specialized networking ecosystem.
  project-history:
    - >
      Usenapp was created as a native macOS Usenet client by Xoroxsoft. It combines
      threaded discussion reading with binary-search and download workflows rather than
      limiting itself to either role.
    - >
      The official release-notes archive documents continued maintenance through the 1.x
      series, while the product site describes native support for both Apple silicon and
      Intel Macs.
  related-projects:
    - Usenet
    - NZB
    - Newznab
    - Spotweb
    - PAR2
    - RAR
  sources:
    - https://www.usenapp.com/
    - https://www.usenapp.com/docs/index.html
    - https://www.usenapp.com/faq/
    - https://www.usenapp.com/releasenotes/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Usenapp is a native macOS Usenet client that combines threaded newsgroup reading,
      NZB search and downloading, automated monitoring, and download repair and
      extraction.
  timeline:
    - '2025-10: Usenapp 1.28 was published in the official release-notes archive.'
    - >
      2026-09: Usenapp 1.28.1 was published, demonstrating continued maintenance of the
      1.x line.
  usage:
    - >
      Configure one or more Usenet providers, then browse discussion groups, search
      supported indexers or Usenapp's search services, and download or import NZB files.
    - >
      Smart Folders and Watchdog automate matching and downloading; completed binary
      downloads can be repaired, merged, extracted, filtered, and moved to a chosen
      destination.
    - >
      Usenapp requires service credentials for external news servers or indexers, but
      the official documentation does not publish a credentials-file path.
