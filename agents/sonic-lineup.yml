history:
  adoption-history:
    - >
      Sonic Lineup is distributed as free software for Windows, Linux, and macOS. Its
      narrowly focused workflow serves music researchers, recording engineers,
      performers, and listeners comparing alternate performances or takes.
  package-nerd-significance:
    - >
      Sonic Lineup packages several research-oriented audio-analysis techniques behind a
      deliberately constrained interface. It is useful when synchronized comparison is
      needed without the annotation and parameter complexity of Sonic Visualiser.
    - >
      The project is also an accessible desktop showcase for the MATCH alignment
      algorithm and Vamp analysis plugins including Chordino, pYIN, and the QM Key
      Detector.
  project-history:
    - >
      Sonic Lineup was developed at Queen Mary University of London's Centre for Digital
      Music as part of the Sonic Visualiser family. Its source credits Chris Cannam's
      early work from 2005–2007 and Queen Mary development through 2019.
    - >
      The application was designed as a quick comparative companion to Sonic Visualiser:
      it aligns structurally related recordings and presents synchronized visualization
      modes, while intentionally omitting editing, annotation, and session export.
  related-projects:
    - Sonic Visualiser
    - Sonic Annotator
    - Tony
    - Vamp plugins
    - MATCH
  sources:
    - https://github.com/sonic-visualiser/sonic-lineup
    - https://www.sonicvisualiser.org/sonic-lineup/
    - https://www.sonicvisualiser.org/sonic-lineup/doc/reference/1.0.1/en/index.html
  summary:
    - >
      Sonic Lineup is a free, open-source application for rapidly comparing and aligning
      multiple recordings of the same or structurally similar musical material.
  timeline:
    - '2005–2007: Chris Cannam authored the early code credited by the official repository.'
    - '2019: Queen Mary published the reference manual for the 1.0 generation of Sonic Lineup.'
  usage:
    - >
      Users open several related audio files, choose one as the reference, and let Sonic
      Lineup calculate time alignments. They can then navigate or play the files in
      synchronization and switch all tracks among waveform, spectrogram, pitch, key, and
      stereo views.
