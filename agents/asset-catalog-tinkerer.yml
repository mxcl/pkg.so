history:
  adoption-history:
    - >
      The application became a specialized macOS utility for developers and designers
      who need to inspect compiled asset catalogs embedded in applications and system
      frameworks. Official releases added conveniences such as Quick Look integration,
      Apple Silicon support, broader asset formats, and command-line extraction.
    - >
      Homebrew installation gives the otherwise graphical application a place in
      reproducible macOS developer setups, while the bundled `act` command extends it
      into shell and automation workflows.
  package-nerd-significance:
    - >
      Compiled Apple asset catalogs are intentionally less transparent than source
      `.xcassets` directories. Asset Catalog Tinkerer provides a focused inspection and
      extraction layer for `.car` files, making it useful for reverse engineering,
      debugging packaged resources, and examining how macOS or iOS applications ship
      images.
    - >
      Its combination of an app bundle, Quick Look plug-in, command-line helper, and
      Homebrew cask makes it an illustrative multi-surface macOS package.
  project-history:
    - >
      Asset Catalog Tinkerer was created by Guilherme Rambo as a macOS application for
      browsing images compiled into Apple asset catalog `.car` files and exporting
      individual or complete sets of assets.
    - >
      Development broadened the application beyond image catalogs: version 2.2 added
      theme-store support, later releases added a Quick Look plug-in and compatibility
      improvements, and version 2.9 introduced SVG and SF Symbols extraction plus the
      `act` command-line tool.
  related-projects:
    - 'Xcode asset catalogs: Source assets compiled by Apple tooling into `.car` files.'
    - 'Quick Look: macOS preview system extended by the application’s bundled plug-in.'
    - 'assetutil: Apple command-line tooling concerned with compiled asset catalogs.'
  sources:
    - 'Official README: https://github.com/insidegui/AssetCatalogTinkerer#readme'
    - 'Official releases: https://github.com/insidegui/AssetCatalogTinkerer/releases'
  summary:
    - >
      Asset Catalog Tinkerer is a macOS utility for opening compiled Apple asset catalog
      files, browsing their contents, and copying or exporting images. It also supports
      selected theme-store formats.
  timeline:
    - 'Version 2.2: Added support for theme-store files.'
    - 'Version 2.5: Added a Quick Look plug-in and automatic updating.'
    - 'Version 2.7: Added a universal Apple Silicon and Intel build.'
    - 'Version 2.9: Added SVG and SF Symbols support and the `act` command-line tool.'
  usage:
    - >
      Users open a `.car` file—often found in an application’s Resources directory—then
      browse its assets and drag, copy, or export selected images or the complete
      catalog. The Quick Look plug-in previews supported catalogs, while `act` supports
      command-line inspection and extraction.
