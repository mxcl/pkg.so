id: brew:cmus
display-name: cmus
repo: null
docs:
  - https://cmus.github.io/
  - https://github.com/cmus/cmus#readme
  - https://github.com/cmus/cmus/blob/master/Doc/cmus.txt
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/cmus/rc
credentials-file-location: null
history:
  adoption-history:
    - >
      cmus became a standard terminal-audio package across Unix package managers. The
      batch input lists packages in Alpine, Homebrew, Debian, MacPorts, Nix, Arch,
      Ubuntu, and openSUSE, and the upstream README documents build dependency sets for
      Debian/Ubuntu, Fedora/RHEL, Arch, Alpine, Termux, and Homebrew.
  package-nerd-significance:
    - >
      cmus is a classic package-manager favorite because it is small, ncurses-native,
      scriptable, and useful on headless machines or minimal desktops. It also exercises
      distro audio stacks through optional input and output plugins while remaining a
      compact C package.
  project-history:
    - >
      The official repository credits Timo Hirvonen for 2004-2008 copyright and later
      work to various authors, reflecting a long-running community-maintained C project.
      The project now lives at github.com/cmus/cmus with an official website at
      cmus.github.io.
  related-projects:
    - cmusfm integrates with cmus as a Last.fm scrobbler via cmus status_display_program.
    - >
      mpd and MOC occupy nearby terminal/daemon music-player space, while cmus-remote is
      the official companion control command.
  sources:
    - https://cmus.github.io/
    - https://github.com/cmus/cmus#readme
    - https://github.com/cmus/cmus/blob/master/Doc/cmus.txt
    - https://github.com/cmus/cmus.github.io/blob/master/index.html
  summary:
    - >
      cmus is a small, fast console music player for Unix-like systems, built around an
      ncurses interface, plugin-based audio I/O, a keyboard-driven library, playlists,
      filters, and the cmus-remote control tool.
  timeline:
    - '2004: Earliest copyright year credited to Timo Hirvonen in the official README.'
    - '2008: Copyright attribution expands to various authors.'
    - >
      2015: 2.6.x and 2.7.x releases added features such as JACK, Opus, sndio, and
      optional mouse support.
    - '2019: 2.8.0 added CoreAudio output, D-Bus MPRIS support, and multiple-playlist support.'
    - '2024: 2.11.0 and 2.12.0 releases continued UI, build, and plugin maintenance.'
  usage:
    - >
      Users run cmus in a terminal, add music to the library, switch among numbered
      views for library, sorted library, playlist, queue, browser, filters, and
      settings, and control playback through keybindings or cmus-remote.
related-packages:
  - id: brew:cmusfm
    reason: >
      cmusfm is a dedicated Last.fm and Libre.fm scrobbler that plugs into cmus through
      the documented `status_display_program` mechanism.
    rel: adjacent_workflow
    sources:
      - https://cmus.github.io/
      - https://github.com/Arkq/cmusfm#readme
  - id: brew:moc
    reason: >
      MOC is an alternative ncurses-style console music player whose detachable
      interface leaves playback running in a local server, making it attractive when
      persistent playback matters more than cmus's library-oriented interface.
    rel: alternative
    sources:
      - https://cmus.github.io/
      - https://moc.daper.net/about
  - id: brew:mpd
    reason: >
      Music Player Daemon is an alternative for users who prefer a long-running
      network-controlled playback service with separate clients instead of an integrated
      terminal player interface.
    rel: alternative
    sources:
      - https://cmus.github.io/
      - https://www.musicpd.org/
      - https://mpd.readthedocs.io/en/stable/user.html
