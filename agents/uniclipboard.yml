credentials-file-location: null
history:
  adoption-history:
    - >
      UniClipboard targets users whose clipboard workflows cross macOS, Windows, Linux,
      iOS, and Android. Official distribution includes desktop applications, a headless
      CLI, mobile clients, and package-oriented installation paths such as Homebrew,
      Snap, COPR, Debian, RPM, and AppImage.
    - >
      The project remains under active development. Its official materials position
      searchable history, public-key device pairing, local-first operation, and
      encrypted relay fallback as alternatives to account-based or single-vendor
      clipboard services.
  package-nerd-significance:
    - >
      UniClipboard combines a Rust and Tauri desktop application, a daemon, a scriptable
      CLI, mobile clients, and multiple native packaging formats in one open-source
      project. That breadth makes its data-directory conventions, profile isolation,
      keyring integration, and portable-mode behavior particularly relevant to
      packagers.
    - >
      The project also demonstrates how a user-facing synchronization package can keep
      its database encrypted locally while storing long-lived key material in each
      operating system's secure-storage service.
  project-history:
    - >
      UniClipboard began as an open-source cross-device clipboard synchronization
      project and developed into a local-first, peer-to-peer system for text, images,
      and files.
    - >
      The maintained UniClipboard organization now houses the desktop application and
      CLI, dedicated documentation, signed release artifacts, and a separate
      mobile-client repository. Official documentation describes both stable and
      prerelease channels and notes that development is ongoing.
  related-projects:
    - The UniClipboard/UniClip repository contains the official mobile client.
    - >
      The desktop listener retains compatibility with the SyncClipboard protocol for
      mobile and third-party integrations.
    - >
      The project compares its focused clipboard workflow with iCloud Universal
      Clipboard, self-hosted clipboard systems, KDE Connect, and Mouse Without Borders.
  sources:
    - https://docs.uniclipboard.app/
    - https://github.com/UniClipboard/UniClipboard
    - https://www.uniclipboard.app/
    - source_facts.description
    - source_facts.repo
  summary:
    - >
      UniClipboard is an open-source, local-first clipboard synchronization system that
      transfers text, images, and files among a user's devices with end-to-end
      encryption and no required cloud account.
  timeline:
    - >
      2024: Early public project activity established cross-device clipboard
      synchronization and device discovery.
    - >
      2026: The maintained project documents desktop, CLI, iOS, and Android clients,
      encrypted local history, peer-to-peer transport, and signed cross-platform
      releases.
  usage:
    - >
      Users install UniClipboard on two or more devices, create or join a trusted device
      space, and then copy normally; supported clipboard content is synchronized
      automatically according to per-device send, receive, and content-type controls.
    - >
      Power users can use the `uniclip` CLI in terminals, scripts, SSH sessions, or
      headless installations. LAN-only mode disables public relay services, while the
      default transport can use direct connections and an encrypted relay fallback.
