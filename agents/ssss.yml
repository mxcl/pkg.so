history:
  adoption-history:
    - >
      The project page notes a Debian package and Freshmeat announcements, reflecting
      the mid-2000s Unix packaging path for small security tools. The supplied package
      facts show it later remained available across Homebrew, Debian, Ubuntu,
      Fedora/DNF, Alpine, MacPorts, and Nix, which is the sort of long-tail packaging
      that keeps old but useful CLI cryptography tools reachable.
  package-nerd-significance:
    - >
      Package maintainers care about ssss because it is a compact, classic Unix security
      utility with stable command names and few moving parts. Its continued presence in
      multiple package managers makes it a reference point for threshold-secret
      workflows even when newer tools wrap Shamir sharing with additional authentication
      or modern cryptographic framing.
  project-history:
    - >
      The official project page says ssss was written in 2006 by B. Poettering, licensed
      under GPL v2, linked against GNU libgmp, and designed for UNIX/Linux machines
      using /dev/random as an entropy source. The homepage distributes release tarballs
      from 0.1 through 0.5 rather than pointing to a public source-control repository.
  related-projects:
    - >
      The homepage links ssss to the broader Shamir secret sharing tradition and
      mentions seccure as another cryptography project by the same author. Its usage
      notes also point to OpenSSL and GPG for encrypting larger payloads before
      splitting only the symmetric key.
  sources:
    - http://point-at-infinity.org/ssss/
    - http://point-at-infinity.org/ssss/ssss.1.html
    - source_facts.package-manager
  summary:
    - >
      ssss is a small Unix-oriented command-line implementation of Shamir's Secret
      Sharing Scheme. Its package-manager identity is unusually literal: it ships two
      commands, ssss-split and ssss-combine, for turning a secret into threshold shares
      and reconstructing it from enough shares.
  timeline:
    - '2006: Official project page says ssss was written by B. Poettering.'
    - '2006: ssss 0.1 through 0.5 tarballs were published on the project homepage.'
    - >
      2018: Official homepage copyright and last-modified metadata show the page was
      still maintained.
  usage:
    - >
      Typical usage is interactive: ssss-split prompts for a secret and emits numbered
      shares for a threshold scheme, while ssss-combine reads enough shares to
      reconstruct the secret. The manpage also documents hex mode for binary material,
      quiet modes for scripts, and a hybrid pattern where large data is encrypted with
      tools such as OpenSSL or GPG and only the key is shared.
tags:
