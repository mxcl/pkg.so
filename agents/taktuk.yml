history:
  adoption-history:
    - >
      TakTuk was accepted into Debian's unstable branch in February 2007, a key
      package-manager milestone for a cluster-administration tool. The TakTuk download
      page directs Debian users to `apt-get install taktuk` and acknowledges Lucas
      Nussbaum's packaging, documentation, and testing work.
    - >
      The project was used with KAAPI in GRIDS@work plugtests in 2006, 2007, and 2008,
      including deployments across more than 1400 processors in 2006 and more than 3600
      processor cores in 2007 and 2008. In March 2012, the TakTuk news page reported
      TakTuk as a base tool in Grid5000/FutureGrid.
  package-nerd-significance:
    - >
      Package nerds care about TakTuk because it is a classic cluster-era Unix tool with
      a strong packaging story: Perl implementation, SSH-based operation, Debian
      packaging, Homebrew/Nix availability, and a wrapper ecosystem. It also illustrates
      why package managers matter for infrastructure tools that must be deployed
      consistently across many machines.
  project-history:
    - >
      The TakTuk documentation credits the original concept to Cyrille Martin's PhD
      thesis and names Jacques Briat, Olivier Richard, Thierry Gautier, and Guillaume
      Huard among the people involved. Version 3, the Perl version, is credited to
      Guillaume Huard and is the maintained package line documented by the site.
    - >
      The January 2007 TakTuk 3.0 release was the first stable release of the new Perl
      engine. The project notes that moving from earlier C++ versions to Perl allowed
      TakTuk to propagate its own code to remote hosts, avoiding the need to install
      TakTuk everywhere before deployment.
  related-projects:
    - >
      Related tools include Kanif, the TakTuk wrapper for cluster management, and older
      cluster command dispatch tools such as C3, pdsh, and dsh whose syntax and behavior
      Kanif intentionally mimics.
  sources:
    - https://taktuk.gitlabpages.inria.fr/
    - https://taktuk.gitlabpages.inria.fr/download.html
    - https://taktuk.gitlabpages.inria.fr/kanif.html
    - https://taktuk.gitlabpages.inria.fr/news.html
    - https://taktuk.gitlabpages.inria.fr/taktuk_module.html
    - https://taktuk.gitlabpages.inria.fr/use.html
  summary:
    - >
      TakTuk is an Inria-origin tool for adaptive large-scale remote execution
      deployment. Its homepage describes a command-line system that spreads itself
      across remote nodes, builds an interconnection network, transports commands, and
      multiplexes or demultiplexes I/O.
  timeline:
    - '2006: TakTuk used in the third GRIDS@work Grid5000 plugtest with KAAPI.'
    - '2007-01-26: TakTuk 3.0 released as the first stable Perl-engine release.'
    - '2007-02: TakTuk accepted into Debian unstable.'
    - '2007-07: Kanif 1.0 released as a TakTuk wrapper.'
    - '2008-11: TakTuk::Pilot Perl module released with TakTuk 3.6.2.'
    - >
      2010-03: TakTuk 3.7 series added deployment groups, gateway support, process
      targeting, and wait commands.
    - '2012-03: TakTuk reported as a base tool in Grid5000/FutureGrid.'
  usage:
    - >
      TakTuk uses passwordless remote login, normally SSH, to establish a logical
      network between hosts. It can execute commands on deployed nodes, send input to
      commands, gather output to the root host, and allow deployed processes to
      communicate through the logical network.
    - >
      The project positions TakTuk for parallel machine administration and parallel
      application development. For simpler regular-cluster tasks, the site recommends
      Kanif, a wrapper that provides C3-, pdsh-, and dsh-like behavior while relying on
      TakTuk underneath.
tags:
