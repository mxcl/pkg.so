      https://www.teamviewer.com/en/global/company/press/2021/teamviewer-integrates-enhanced-teamviewer-meeting-for-free/
    - >
      Official TeamViewer product update:
      https://community.teamviewer.com/English/discussion/129568/~/English/kb/product-updates
  summary:
    - >
      TeamViewer Meeting is TeamViewer’s conferencing and collaboration application for
      screen sharing, voice calls, and video meetings. It was rebranded from Blizz and
      later integrated into the broader TeamViewer client.
  timeline:
    - '2020: TeamViewer 15.13 introduces a redesigned meeting experience.'
    - '2021: Blizz is rebranded as TeamViewer Meeting and integrated into TeamViewer clients.'
    - >
      2023: TeamViewer announces that Meeting is no longer sold to new customers but
      remains supported for existing users.
    - '2025: TeamViewer describes its meeting feature as being in final sunset planning.'
    - '2026: Telephone dial-in service is scheduled to stop on February 27.'
  usage:
    - >
      Users sign in, start or join a meeting, and selectively enable screen sharing,
      camera, and microphone. Existing customers may use the standalone Meeting client,
      while newer TeamViewer documentation places meeting controls inside the principal
      desktop client.
