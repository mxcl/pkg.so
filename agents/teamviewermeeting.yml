history:
  adoption-history:
    - >
      TeamViewer folded the enhanced Meeting service into its client at no additional
      cost for licensed users in 2021, positioning meetings alongside its established
      remote-connectivity workflow. The company later stopped selling Meeting to new
      customers while continuing support for existing licensed users.
    - >
      Current TeamViewer documentation describes meeting functionality in the main
      desktop client as being in final sunset planning, reflecting consolidation away
      from the standalone product.
  package-nerd-significance:
    - >
      The cask captures a transitional desktop product: a conferencing application
      descended from Blizz, rebranded into the TeamViewer family, integrated into the
      main TeamViewer client, and later withdrawn from new sales. It is useful when
      maintaining existing licensed environments that still depend on the standalone
      client.
  project-history:
    - >
      TeamViewer Meeting originated as Blizz before TeamViewer rebranded it and
      integrated an enhanced meeting experience into TeamViewer. The 15.13 release
      introduced the revised interface and broader meeting entitlement in December 2020.
    - >
      In January 2021, TeamViewer formally announced that the rebranded Meeting product
      would be included with TeamViewer clients. It supported screen sharing, VoIP,
      video conferencing, mobile participation, and larger licensed sessions.
  related-projects:
    - Blizz
    - TeamViewer
    - TeamViewer QuickJoin
  sources:
