history:
  adoption-history:
    - >
      Markpad is distributed for Windows, macOS, and Linux through native downloads and
      several package managers. Its official repository documents Chocolatey and Snap
      installations alongside direct installers, AppImage, Debian, RPM, and macOS
      disk-image builds.
  package-nerd-significance:
    - >
      Markpad occupies the small, package-friendly niche between a plain system notepad
      and a full knowledge-management suite. Its Tauri-based footprint, native
      cross-platform packages, absence of telemetry, and support for
      package-manager-controlled updates make it especially relevant to users who want a
      focused Markdown desktop application.
  project-history:
    - >
      Markpad is an open-source Markdown editor built with SvelteKit, Tauri, and Rust.
      Its development expanded the original notepad-like editor into a multi-tab,
      multi-window application with synchronized editing and preview, session
      restoration, diagrams, mathematics, themes, and export support.
    - >
      By 2026 the project was publishing frequent 2.x releases and had broadened
      distribution across native installers and package managers. Official release notes
      also document substantial community work on document fidelity, cross-platform
      packaging, session handling, and large-file behavior.
  related-projects:
    - >
      Markpad uses Monaco Editor for editing, KaTeX for mathematics, Mermaid for
      diagrams, and Tauri for its cross-platform desktop shell.
  sources:
    - https://github.com/sftwrdotdev/Markpad#readme
    - https://github.com/sftwrdotdev/Markpad/releases
  summary:
    - >
      Markpad is a free, open-source, cross-platform Markdown viewer and text editor
      designed to provide a lightweight, notepad-like interface with a richer rendered
      preview.
  timeline:
    - >
      2026: The active 2.x release series expands native packaging, multi-window
      support, editing fidelity, and session restoration.
  usage:
    - >
      Markpad is used to open and edit local Markdown files, work in synchronized
      source-and-preview panes, navigate documents by headings, render code
      highlighting, mathematics and diagrams, restore editing sessions, and export
      documents to HTML or PDF.
