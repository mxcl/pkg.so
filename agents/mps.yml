id: cask:mps
display-name: JetBrains MPS
repo: https://github.com/JetBrains/MPS
docs:
  - https://www.jetbrains.com/help/mps
  - https://www.jetbrains.com/mps/learn
config-file-location:
  macos:
    - ~/Library/Application Support/JetBrains/MPS<version>
credentials-file-location: null
history:
  adoption-history:
    - >
      MPS has been used to build standalone language-oriented products and industry
      DSLs. JetBrains highlights applications such as mbeddr for embedded engineering,
      MetaR for biomedical data analysis, and DSLs for Dutch tax legislation.
    - >
      YouTrack was the first publicly announced product developed using MPS, reaching
      beta in 2009.
    - >
      The macOS distribution is available through the Homebrew cask recorded in
      source_facts.package-manager.
  package-nerd-significance:
    - >
      MPS is notable because it stores programs as structured models and renders them
      through projectional editors, allowing textual, tabular, mathematical,
      diagrammatic, and form-like notations to coexist.
    - >
      For language-tooling practitioners it bundles language structure, editors, type
      systems, constraints, intentions, generators, migrations, debugging, and IDE
      packaging into one open-source workbench.
  project-history:
    - >
      JetBrains developed MPS as an open-source language workbench for defining
      domain-specific languages and generating target code such as Java, C, and XML.
    - >
      MPS 2.0, released in 2011, marked a maturity milestone with standalone language
      IDEs, improved type systems, build scripting, merge support, and tabular editors.
    - >
      In 2017 MPS adopted JetBrains' year-based versioning and a regular release cadence
      aligned with the IntelliJ Platform on which it is built.
  related-projects:
    - IntelliJ Platform
    - YouTrack
    - mbeddr
    - MetaR
  sources:
    - https://blog.jetbrains.com/mps/2009/09/mps-based-issue-tracker-youtrack-goes-beta/
    - https://blog.jetbrains.com/mps/2011/08/mps-20-is-out/
    - https://blog.jetbrains.com/mps/2017/02/the-eap-started-for-mps-2017-1
    - https://github.com/JetBrains/MPS
    - https://www.jetbrains.com/mps/
  summary:
    - >
      JetBrains MPS is an open-source language workbench for designing domain-specific
      languages, projectional editors, type systems, and code generators.
  timeline:
    - '2009: JetBrains announced YouTrack as the first public product developed using MPS.'
    - '2011: MPS 2.0 was released.'
    - "2017: MPS adopted JetBrains' year-based release scheme and IntelliJ-aligned cadence."
  usage:
    - >
      Language authors define concepts, editors, constraints, type-system rules,
      intentions, and generators; users then edit structured models through generated or
      customized IDE experiences.
    - >
      Projects commonly generate source code or other artifacts for established target
      platforms, while reusable languages and plugins extend the workbench itself.
