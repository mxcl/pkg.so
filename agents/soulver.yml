history:
  adoption-history:
    - >
      Soulver expanded from its original Mac application to native iPhone and iPad
      editions. It is distributed directly, through Apple’s App Stores, and through
      Setapp.
    - >
      The interface inspired a broader class of notepad calculators. Soulver’s official
      FAQ identifies several later alternatives while describing Soulver as the
      originator of the modern answer-column design.
  package-nerd-significance:
    - >
      Soulver occupies the useful middle ground between a conventional calculator, a
      scratchpad, and a spreadsheet. Its text-first calculations, live references,
      variables, unit conversions, and automation hooks make it particularly attractive
      to developers and other keyboard-oriented users.
    - >
      The product also has a related command-line tool and SoulverCore framework, but
      those are separate projects and not repositories for the proprietary Soulver
      application represented by this cask.
  project-history:
    - >
      Soulver originated in 2005 with the goal of improving the calculator interface on
      computers. Its defining design placed live answers beside editable, annotated
      calculations in a text editor.
    - >
      Successive major generations expanded the concept: Soulver 1.2 added words
      alongside numbers, Soulver 2 added live financial rates, natural-language
      functions, and tokenized line references, and Soulver 3 introduced a redesigned
      sheet-based interface and broader date, time, automation, and file-format
      capabilities.
  related-projects:
    - SoulverCore is the natural-language calculation engine used by Soulver.
    - Soulver CLI exposes related calculation and sheetbook workflows in a terminal.
    - >
      MathPad, Calca, OpalCalc, Parsify, Figr, Numbr, and NoteCalc are identified in
      Soulver’s official FAQ as predecessors, inspired tools, or alternatives.
  sources:
    - https://documentation.soulver.app/
    - https://documentation.soulver.app/whats-new
    - https://github.com/soulverteam
    - https://soulver.app/
  summary:
    - >
      Soulver is a native Apple-platform notepad calculator developed around an answer
      column that evaluates natural-language calculations as the user types. The project
      dates to 2005 and has been refined across several major paid generations.
  timeline:
    - >
      2005: The original Soulver introduced its live answer-column notepad-calculator
      interface.
    - '2006: Soulver 1.2 added support for using words alongside numbers.'
    - >
      2010: Soulver 2 added live currency and stock rates, natural-language functions,
      and tokenized line references.
    - >
      2019: Soulver 3 began the third major generation with a redesigned interface and
      expanded calculation features.
    - >
      2026: The official site identifies a fourth major paid generation in Soulver’s
      release cadence.
  usage:
    - >
      Use Soulver as an editable scratchpad for arithmetic, percentages, currencies,
      units, dates, times, financial estimates, and multi-step calculations.
    - >
      Variables, line references, subtotals, tags, sheetbooks, Shortcuts, URL schemes,
      and the companion CLI support repeatable or automated workflows beyond one-off
      calculation.
