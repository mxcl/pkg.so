history:
  adoption-history:
    - >
      The official product page documents support for 26 AI coding agents and numerous
      terminal applications, positioning Vibe Island as a unified monitor for developers
      who run multiple local or remote agent sessions.
  package-nerd-significance:
    - >
      Vibe Island reflects the emergence of desktop companion tools around
      terminal-based coding agents. Package-oriented users may care about its automatic
      integration setup, local Unix-socket communication, terminal metadata access, and
      ability to aggregate otherwise separate agent ecosystems.
  project-history:
    - >
      Vibe Island is a native macOS application developed by Edward Luo. Its official
      privacy policy, dated March 25, 2026, documents local processing of coding-agent
      hook events, JSONL session files, and terminal metadata.
  related-projects:
    - >
      Supported agent environments include Claude Code, OpenAI Codex, Gemini CLI,
      Cursor, OpenCode, GitHub Copilot, and numerous other coding agents.
    - >
      Supported terminal environments include Terminal.app, iTerm2, Ghostty, Warp,
      WezTerm, Kitty, Zellij, and integrated IDE terminals.
  sources:
    - 'Official Claude Code integration guide: https://vibeisland.app/claude-code/'
    - 'Official Codex integration guide: https://vibeisland.app/codex/'
    - 'Official privacy policy: https://vibeisland.app/privacy/'
    - 'Official product page and FAQ: https://vibeisland.app/'
  summary:
    - >
      Vibe Island is a macOS menu-bar/notch companion for monitoring and interacting
      with AI coding-agent sessions. It presents multiple agents in a unified panel,
      provides completion notifications and terminal jumping, and can surface approval
      or question prompts for supported agents.
  timeline:
    - >
      2026-03-25: The dated official privacy policy documented Vibe Island's local
      processing model.
    - '2026: Official product materials documented unified support for 26 AI coding agents.'
  usage:
    - >
      Users launch Vibe Island alongside supported coding agents and terminals. It
      automatically configures supported integrations, monitors active sessions,
      displays tool activity and completion state, and jumps back to the relevant
      terminal tab or pane.
    - >
      The application processes session information locally. A license key and
      activation instance ID are stored locally and sent to the payment provider for
      validation, but the official documentation does not publish their filesystem
      location.
