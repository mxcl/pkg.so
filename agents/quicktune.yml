history:
  adoption-history:
    - >
      QuickTune is distributed as a free companion utility for users who want a compact
      controller for Apple's Music application. The current product supports both Apple
      silicon and Intel Macs and is localized in several languages.
    - >
      The project belongs to a collection of small Apple Music companion applications by
      Mario Guzmán that recreate distinctive interfaces from earlier generations of Mac
      software.
  package-nerd-significance:
    - >
      QuickTune is a deliberately nostalgic native Mac utility: it reproduces QuickTime
      7's brushed-metal interface while controlling the modern Music application. It is
      an example of package-manager culture preserving small, focused desktop utilities
      and historical interface idioms.
    - >
      Its implementation is also technically distinctive for avoiding a generic
      cross-platform shell: the official page says it is written in Swift and AppKit,
      with Core Graphics and Core Animation for the interface and Scripting Bridge plus
      Distributed Notification Center for Music integration.
  project-history:
    - >
      QuickTune was developed by Mario Guzmán in Beaverton, Oregon, in collaboration
      with Tuomas Hämäläinen in Copenhagen. It applies the visual language of QuickTime
      7 to a modern Apple Music mini-player.
    - >
      The QuickTune 7 generation added a Leopard-style theme and adapted its display to
      local tracks and streaming radio. Later 7.x work added animated track and provider
      information.
  related-projects:
    - Music Widget recreates the iTunes Dashboard widget as an Apple Music controller.
    - Music Remote recreates the short-lived player interface from the Mac OS X Public Beta.
    - Music MiniPlayer recreates the iTunes 10 MiniPlayer.
  sources:
    - https://marioaguzman.github.io/music/
    - https://marioaguzman.github.io/quicktune/
  summary:
    - >
      QuickTune 7 is a native macOS mini-player that controls Apple Music through an
      interface modeled on QuickTime 7. It provides playback controls, track details,
      playlist access, an inspector, and Dock-menu controls.
  timeline:
    - 'QuickTune 7: Recreates the QuickTime 7 Tiger-era appearance for modern Apple Music.'
    - 'QuickTune 7.1: Adds an optional Mac OS X Leopard theme.'
    - 'QuickTune 7.2: Adds animated track and provider information for streaming radio.'
  usage:
    - >
      Users run QuickTune alongside Apple's Music application to control playback and
      volume, change playlists, inspect now-playing metadata, and jump back to the
      current song or source in Music.
    - >
      The application requires Music.app and a supported macOS release. The official
      page does not document a configuration-file or credentials-file path.
