history:
  adoption-history:
    - >
      Vernier positions Graphical Analysis as a cross-platform classroom application
      that works with its sensor ecosystem on the operating systems commonly used in
      schools. A browser-based Progressive Web App further reduces installation
      requirements for managed classroom devices.
    - >
      The free Basic tier supports common collection and analysis tasks, while Graphical
      Analysis Pro adds advanced graphing, calculated columns, annotations, synchronized
      video, data sharing, and instructional content for site-licensed deployments.
  package-nerd-significance:
    - >
      The macOS package is one distribution of a broader cross-platform scientific-data
      application also offered for mobile, desktop, Chromebook, and browser
      environments. For lab administrators, the native package provides USB and
      Bluetooth sensor access while the PWA offers a low-maintenance alternative where
      browser hardware APIs suffice.
  project-history:
    - >
      Graphical Analysis developed as Vernier's modern application for collecting,
      graphing, sharing, and analyzing data from classroom sensors. Its platform
      coverage expanded to native desktop and mobile applications and a Progressive Web
      App.
    - >
      The product later adopted a Basic and Pro model, with the paid edition layering
      advanced analysis and teaching workflows over the core data-collection
      application.
  related-projects:
    - Vernier Spectral Analysis focuses on spectrometer workflows.
    - >
      Vernier Video Analysis handles motion analysis, while Instrumental Analysis
      supports additional laboratory instruments.
    - Graphical Analysis integrates with Vernier Go Direct and LabQuest sensors.
  sources:
    - https://www.vernier.com/downloads/
    - https://www.vernier.com/product/graphical-analysis/
    - https://www.vernier.com/support/ga4/
  summary:
    - >
      Vernier Graphical Analysis is a classroom science application for collecting,
      visualizing, sharing, and analyzing data from Vernier sensors.
  timeline:
    - >
      2020s: Vernier expanded Graphical Analysis across native desktop, mobile,
      Chromebook, and browser-based environments.
    - >
      2026: Version 6.3 added accessibility, visualization, sensor-support, and
      Pro-workflow improvements.
  usage:
    - >
      Students and educators connect a compatible sensor over Bluetooth or USB, collect
      measurements in real time, graph the resulting data, calculate statistics or curve
      fits, and save or share results.
    - >
      The free tier covers essential collection and analysis. Pro licenses unlock
      additional graph types, calculated columns, annotations, advanced fitting,
      synchronized video, sharing, and a library of investigations.
