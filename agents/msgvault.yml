  summary:
    - >
      msgvault is a local-first archive, search, analytics, and AI-query tool for
      personal message history, created by Wes McKinney and published by Kenn Software
      LLC. McKinney's February 2026 announcement describes building it after years of
      using Gmail and wanting local control over decades of email, attachments, and
      messages. The announcement says the project began as a hybrid Python/Rust effort
      and moved to a single-language Go project that ships as a static binary.
  usage:
    - >
      The architecture centers on downloading messages into a local archive, then
      querying them without live mailbox access. The docs describe Gmail, IMAP,
      Microsoft 365, PST, MBOX, Apple Mail, WhatsApp, iMessage, Google Voice, Facebook
      Messenger, and SMS Backup & Restore imports; SQLite is the default system of
      record, DuckDB and Parquet power analytics, SQLite FTS5 powers keyword search, and
      optional vector search can use a configured local or self-hosted embedding
      endpoint. The CLI exposes sync, import, search, TUI, MCP server, HTTP server,
      analytics, and deletion workflows. Its package-manager niche is newer than
      traditional mail tools: it is not an email client, but a local archive substrate
      for search, personal analytics, and LLM/MCP access over a private message corpus.
