history:
  adoption-history:
    - >
      Glasskube entered a crowded Kubernetes packaging space around Helm, Kustomize,
      operators, Artifact Hub, and GitOps tools. Its adoption story is early but visible
      through its GitHub releases, documentation, Homebrew installation path, CNCF
      Landscape badge, package repository, and supported package examples such as
      cert-manager, ingress-nginx, kube-prometheus, Kubernetes Dashboard, and
      CloudNativePG.
  package-nerd-significance:
    - >
      For package nerds, Glasskube is interesting because it imports expectations from
      OS package managers into Kubernetes: a central package repository, dependency
      handling, typed configuration, package status, and update workflows. Its Homebrew
      formula is mainly the entry point to a cluster-side package manager rather than
      the package manager's whole state.
  project-history:
    - >
      The project appeared publicly in early 2024 with alpha releases and a README
      explaining that its authors had spent years in the Kubernetes ecosystem struggling
      with package management, configuration, and distribution. Glasskube's design
      responds to those problems with typed package configuration, dependencies, update
      previews, repositories, and package custom resources.
  related-projects:
    - >
      Kubernetes, Helm, Kustomize, Renovate, Artifact Hub, cert-manager, ingress-nginx,
      kube-prometheus, CloudNativePG.
  sources:
    - https://api.github.com/repos/glasskube/glasskube/releases?per_page=100
    - https://glasskube.dev/products/package-manager/docs/
    - https://raw.githubusercontent.com/glasskube/glasskube/main/CHANGELOG.md
    - https://raw.githubusercontent.com/glasskube/glasskube/main/README.md
  summary:
    - >
      Glasskube is an open-source Kubernetes package manager that presents Kubernetes
      applications as dependency-aware packages managed through a CLI, a local web UI,
      and GitOps-friendly custom resources. Its project pitch frames it as a simpler
      package-management layer inspired by Homebrew and npm.
  timeline:
    - '2024: Alpha releases begin in the GitHub release stream.'
    - >
      2024: The README positions Glasskube as a Kubernetes package manager inspired by
      Homebrew and npm.
    - >
      2024: Changelog entries show package-operator, UI, GitOps, and repository workflow
      development.
  usage:
    - >
      Practitioners install the CLI, point it at a kubeconfig, bootstrap the in-cluster
      components, start the local package-manager UI with glasskube serve, and then
      install, update, configure, describe, open, suspend, resume, or uninstall
      Kubernetes packages. Noninteractive users manage package repositories and values
      through CLI flags, while GitOps users work with the package custom resources.
related-packages:
  - id: brew:helm
    reason: >
      Choose Helm for its mature chart ecosystem and flexible client-side templating;
      Glasskube added dependency-aware, server-side lifecycle and typed-configuration
      features and could wrap Helm charts, but its original repository is now archived.
    rel: alternative
    sources:
      - https://glasskube.dev/products/package-manager/docs/comparisons/helm/
      - https://helm.sh/docs/
  - id: brew:kustomize
    reason: >
      Choose Kustomize when the task is to create readable environment-specific overlays
      for plain Kubernetes manifests; Glasskube targeted package discovery,
      installation, dependencies, and lifecycle management.
    rel: alternative
    sources:
      - https://glasskube.dev/blog/kustomize-vs-helm/
      - https://kubectl.docs.kubernetes.io/references/kustomize/
  - id: brew:kubernetes-cli
    reason: >
      kubectl complements Glasskube for inspecting and operating the Kubernetes
      resources that Glasskube creates, and both default to the active context in
      ~/.kube/config.
    rel: adjacent_workflow
    sources:
      - https://glasskube.dev/products/package-manager/docs/
      - https://kubernetes.io/docs/reference/kubectl/
