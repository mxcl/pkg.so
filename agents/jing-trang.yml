history:
  adoption-history:
    - >
      Jing became one of the canonical open-source RELAX NG validators listed by
      relaxng.org, with support for both XML and compact syntaxes and library use with
      SAX2 parsers. Trang earned a similar role for schema conversion, especially for
      teams maintaining DTD, RELAX NG compact syntax, and W3C XML Schema artifacts
      across XML publishing and standards workflows.
  package-nerd-significance:
    - >
      Jing-Trang matters because it is the kind of old, stable XML infrastructure
      package that quietly supports documentation toolchains, standards validation,
      editors, and build systems. Its version tags and release names preserve the older
      date-stamped style common in Java XML tools, and its presence in Homebrew,
      Debian-family packages, Nix, and Maven metadata reflects a tool that survived long
      after XML schema debates cooled.
  project-history:
    - >
      Jing and Trang grew out of James Clark's RELAX NG work. The RELAX NG home page
      identifies Jing as a Java validator written by James Clark and Trang as a Java
      schema converter written by James Clark that uses Jing. RELAX NG itself was
      standardized through OASIS in 2001, gained compact syntax in 2002, and became part
      of ISO/IEC 19757.
    - >
      The project history spans early 2000s RELAX NG tooling, a Google Code era, and the
      GitHub-hosted `relaxng/jing-trang` repository. The preserved Jing and Trang pages
      state that development of both tools took place together in the jing-trang
      project, while the GitHub repository preserves the combined build and produces
      `jing.jar` and `trang.jar`.
  related-projects:
    - >
      Jing-Trang is tied to RELAX NG, TREX, RELAX Core, DTDinst, SAX2, W3C XML Schema,
      and XML editor integrations. The RELAX NG software list places it beside
      validators such as RNV, libxml2, MSV, and schema-related tools such as rnc2rng and
      RNGOM.
  sources:
    - https://api.github.com/repos/relaxng/jing-trang/releases?per_page=100
    - https://api.github.com/repos/relaxng/jing-trang/tags?per_page=100
    - https://central.sonatype.com/artifact/com.thaiopensource/jing
    - https://github.com/relaxng/jing-trang
    - https://relaxng.org/
    - https://relaxng.org/jclark/jing.html
    - https://relaxng.org/jclark/trang.html
  summary:
    - >
      Jing-Trang packages two long-lived Java tools from the RELAX NG ecosystem: Jing, a
      RELAX NG validator, and Trang, a multi-format XML schema converter. Together they
      cover validation, conversion between RELAX NG XML syntax, RELAX NG compact syntax,
      XML DTDs, and W3C XML Schema output, and schema inference from example XML
      documents.
  timeline:
    - >
      2001: RELAX NG became an OASIS Committee Specification, and early jing-trang tags
      include the RELAX NG tooling era.
    - >
      2002: RELAX NG Compact Syntax reached OASIS Committee Specification status;
      Trang's page documents compact-syntax conversion support.
    - >
      2003: RELAX NG became ISO/IEC 19757-2, making Jing useful for validating an
      international-standard schema language.
    - >
      2009: The V20091111 tag and Maven metadata show the Google Code-era combined
      Jing/Trang artifact.
    - "2015: V20151127 appeared in the GitHub repository's release history."
    - '2024: V20241231 continued the combined GitHub-hosted release series.'
  usage:
    - >
      Package-manager users mainly install Jing-Trang to get the `jing` and `trang`
      commands. `jing` validates XML documents against RELAX NG schemas, while `trang`
      converts schemas among supported formats and can infer a schema from example XML.
      The repository README documents building the Java jars with the included Ant
      wrapper.
