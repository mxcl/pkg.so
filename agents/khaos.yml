id: brew:khaos
display-name: khaos
repo: https://github.com/aleksandarskrbic/khaos
docs:
  - https://github.com/aleksandarskrbic/khaos#readme
config-file-location:
  unix:
    - ./my-scenario.yaml
    - /path/to/custom-scenario.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      The repository and Homebrew formula show early package-manager adoption for macOS
      and Linux users, but evidence of broad ecosystem uptake is still limited. Its
      adoption story is best understood as an emerging Kafka testing utility rather than
      a mature infrastructure standard.
  package-nerd-significance:
    - >
      khaos is notable because it packages a hands-on Kafka lab into one CLI: local
      KRaft or ZooKeeper clusters, scenario files, schema formats, synthetic data, and
      failure simulation are exposed as installable commands instead of ad hoc producer
      scripts.
  project-history:
    - >
      The upstream changelog records version 0.1.0 on December 23, 2025 as the initial
      release, with configurable producers and consumers, YAML scenarios, correlated
      event flows, Faker-backed data generation, Docker Compose integration,
      authentication support, live stats, prebuilt scenarios, and CLI commands for
      running, simulating, validating, listing, and managing clusters.
    - >
      Rapid follow-up releases in December 2025 added Avro, Protobuf, Schema Registry
      support, scenario categories, custom scenario files, Docker support, and internal
      refactoring. Version 0.7.0 on January 2, 2026 added consumer failure simulation,
      duplicate message simulation, dead-letter queue support, and new testing
      scenarios.
  related-projects:
    - >
      khaos sits near Apache Kafka, Kafka UI, Schema Registry, Apache Flink, Spark
      Streaming, Kafka Streams, Docker Compose, and Faker-backed synthetic data
      generators.
  sources:
    - https://formulae.brew.sh/formula/khaos
    - https://github.com/aleksandarskrbic/khaos
    - https://raw.githubusercontent.com/aleksandarskrbic/khaos/main/CHANGELOG.md
  summary:
    - >
      khaos is a young Kafka data generator, load-testing, and chaos-engineering CLI. It
      uses YAML scenarios to generate synthetic traffic, simulate producers and
      consumers, and exercise Kafka cluster failure modes.
  timeline:
    - '2025-12-23: khaos 0.1.0 initial release.'
    - >
      2025-12-25: versions 0.2.0 through 0.4.0 added Avro, Protobuf, Schema Registry,
      and scenario categories.
    - '2025-12-27: version 0.5.0 added custom scenario files and Docker support.'
    - >
      2026-01-02: version 0.7.0 added consumer failure, duplicate-message, and DLQ
      simulations.
    - >
      2026-01-05: version 0.7.1 fixed external-cluster authentication and
      managed-cluster retention behavior.
  usage:
    - >
      Users run bundled or custom YAML scenarios against a local Docker-managed Kafka
      cluster or an external cluster. The README documents traffic generation, load
      testing, producer and consumer simulation, stream-processing test data, chaos
      scenarios, monitoring validation, authentication, and serialization formats.
related-packages:
  - id: brew:kafka
    reason: >
      Apache Kafka is the broker platform Khaos exercises; install it when you need
      Kafka's own server and administration tools rather than relying on Khaos's bundled
      Docker cluster or an external service.
    rel: adjacent_workflow
    sources:
      - https://getkhaos.dev/docs
      - https://kafka.apache.org/quickstart
tags:
