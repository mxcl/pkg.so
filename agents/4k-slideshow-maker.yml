history:
  adoption-history:
    - >
      4K Download distributes the application for Windows, macOS, and Ubuntu and
      describes more than ten years of stable operation. The official product page
      reports a user base exceeding 100,000.
  package-nerd-significance:
    - >
      The Homebrew cask makes a proprietary, cross-platform slideshow authoring tool
      reproducibly installable on macOS. Its continued packaging is notable because it
      fills a narrow GUI niche—turning photographs and music into preset-targeted
      video—without requiring a full nonlinear video editor.
  project-history:
    - >
      4K Slideshow Maker has been part of the 4K Download application family since at
      least 2017, when the company announced coordinated updates across its desktop
      products. The product evolved as a streamlined slideshow creator supporting
      photos, music, transitions, previews, Ken Burns effects, and output presets up to
      4K.
  related-projects:
    - >
      4K Slideshow Maker belongs to the same 4K Download desktop suite as 4K Image
      Compressor and the company's media-download applications.
  sources:
    - >
      Official 2017 suite update:
      https://www.4kdownload.com/blog/2017/11/10/major-4k-download-updates-new-versions-all-applications-and-fresh-site-design--1/
    - 'Official product page: https://www.4kdownload.com/products/slideshowmaker/3'
    - 'Official usage guide: https://www.4kdownload.com/howto/howto-make-slideshow/4'
  summary:
    - >
      4K Slideshow Maker is a desktop application for assembling photographs, video,
      music, transitions, and effects into slideshow videos. It emphasizes a short,
      preset-driven workflow rather than general-purpose video editing.
  timeline:
    - >
      2017: 4K Download documented the application as part of its coordinated
      desktop-suite update.
    - '2021: The official product record lists the 2.0.1 release dated October 29.'
  usage:
    - >
      Users add and reorder photographs, choose music and transition timing, preview the
      result, and render to platform or device presets such as 1080p, 4K, YouTube, and
      Facebook.
