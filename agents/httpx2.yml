id: brew:httpx2
display-name: HTTPX2
repo: https://github.com/pydantic/httpx2
docs:
  - https://httpx2.pydantic.dev/
  - https://httpx2.pydantic.dev/api
  - https://httpx2.pydantic.dev/quickstart
config-file-location: null
credentials-file-location:
  unix:
    - ~/.netrc
history:
  adoption-history:
    - >
      Pydantic presents HTTPX2 as a maintained continuation for users of HTTPX,
      preserving its familiar interface while providing a forward path and timely
      maintenance.
  package-nerd-significance:
    - >
      HTTPX2 matters to Python package users because it carries forward the modern HTTPX
      design—synchronous and asynchronous APIs, HTTP/2, strict timeouts, type
      annotations, and direct ASGI/WSGI support—under active Pydantic stewardship.
  project-history:
    - >
      HTTPX2 continues the work of HTTPX and its community. Pydantic adopted stewardship
      under a new package and import name after activity in the original HTTPX project
      became limited.
  related-projects:
    - HTTPX
    - HTTPCore2
    - Requests
    - AnyIO
  sources:
    - https://github.com/pydantic/httpx2
    - https://httpx2.pydantic.dev/
  summary:
    - >
      HTTPX2 is a Pydantic-maintained, next-generation HTTP client for Python with
      synchronous, asynchronous, command-line, HTTP/1.1, and HTTP/2 interfaces.
  timeline:
    - '2026: Pydantic stewardship established HTTPX2 as a maintained continuation of HTTPX.'
  usage:
    - >
      Install `httpx2` for the Python API, `httpx2[cli]` for the command-line client, or
      `httpx2[http2]` for optional HTTP/2 support. It is commonly used for application
      HTTP calls, async services, testing ASGI/WSGI applications, proxying, streaming,
      and transport customization.
