config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      KeePassC's adoption was niche but practical: it served Unix users who already kept
      KeePass or KeePassX databases and wanted a terminal-first way to open, search,
      edit, and copy credentials. Its Homebrew formula reflects that small-tool
      packaging niche rather than broad enterprise adoption.
  package-nerd-significance:
    - >
      KeePassC is historically interesting because it bridges GUI-era KeePassX databases
      and terminal workflows using a small Python package. It also shows the limitations
      of early KeePass 1.x compatibility: KeePass 2.x support was planned but remained
      outside the stable project scope.
  project-history:
    - >
      The GitHub repository was created on 2012-08-30, shortly after the related kppy
      Python module repository was created on 2012-05-13. The official README describes
      KeePassC as fully compatible with KeePass v1.x and KeePassX databases, encrypted
      with AES, and controlled through a curses interface.
    - >
      The official project page lists v1.8.0 as the stable release from 2018-05-16 and
      says the maintainer's main focus had shifted to a Rust reimplementation while
      KeePassC remained stable and feature-complete. GitHub releases record v1.7.0 on
      2015-01-06 and v1.8.2 on 2018-06-28.
  related-projects:
    - >
      KeePassC is related to KeePass 1.x, KeePassX, kppy, terminal password managers,
      and the maintainer's later Rust reimplementation effort. It is not a KeePassXC
      replacement because its documented compatibility is the older KeePass
      v1.x/KeePassX database format.
  sources:
    - https://api.github.com/repos/raymontag/keepassc
    - https://api.github.com/repos/raymontag/kppy
    - https://github.com/raymontag/keepassc
    - https://github.com/raymontag/keepassc/releases
    - https://outerhaven.de/keepassc/
    - https://outerhaven.de/keepassc/docu.html
  summary:
    - >
      KeePassC is a Python 3, curses-based password manager compatible with KeePass 1.x
      and KeePassX databases. It belongs to the terminal-password-manager lineage:
      keyboard-driven, local database oriented, and designed for users who wanted
      KeePass-style encrypted storage without a graphical UI.
  timeline:
    - '2012-05-13: The related kppy KeePass 1.x Python module repository was created.'
    - '2012-08-30: KeePassC repository was created.'
    - '2015-01-06: KeePassC 1.7.0 was published on GitHub Releases.'
    - '2018-05-16: The project page identified v1.8.0 as the stable release.'
    - '2018-06-28: KeePassC 1.8.2 was published on GitHub Releases.'
  usage:
    - >
      A typical user opens an existing KeePass 1.x or KeePassX database in the curses
      interface, searches entries, generates passwords, and copies usernames or
      passwords to the clipboard. It also shipped helper programs such as keepassc-agent
      and keepassc-server.
related-packages:
  - id: cask:keepassxc
    reason: >
      Choose KeePassXC when you want a maintained cross-platform graphical client that
      can officially import KeePassC's KeePass 1 database format into modern KDBX
      storage.
    rel: alternative
    sources:
      - https://github.com/raymontag/keepassc#readme
      - https://keepassxc.org/docs/KeePassXC_UserGuide
