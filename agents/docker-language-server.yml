history:
  adoption-history:
    - >
      The project is young, but its adoption path is official: the README says Docker
      maintains the Docker DX Visual Studio Code extension as a supported client, and
      CLIENTS.md documents use with any LSP-capable editor plus JetBrains through
      LSP4IJ. Homebrew and Nix packaging make it available outside VS Code-centric
      distribution.
  package-nerd-significance:
    - >
      This package is significant because Docker authoring moved from syntax
      highlighting into an official language-server binary. For package nerds, it is a
      compact example of modern CLI packaging: an editor-facing Go executable that pulls
      together Dockerfile syntax, Compose schemas, Bake, Buildx, BuildKit, Docker Scout,
      telemetry settings, and cross-editor LSP conventions.
  project-history:
    - >
      The README describes the project as a language server for the Docker ecosystem,
      covering Dockerfiles, Compose files, and Bake files. It depends on Buildx for some
      features and exposes diagnostics, hover, completion, code navigation, formatting,
      document links, inlay hints, and related editor behaviors.
    - >
      The public tag history starts with v0.1.0 in March 2025, and the changelog shows
      rapid feature work through 2025. Early releases added Compose and Bake editing
      features, Dockerfile linting and image intelligence, Docker Hub suggestions, WSL
      URI fixes, schema updates, and release automation.
  related-projects:
    - >
      Related projects include Docker DX for Visual Studio Code, the Language Server
      Protocol, Dockerfile reference documentation, Compose specification, Docker Bake,
      Buildx, BuildKit, Docker Scout, rcjsuen/dockerfile-language-server, tliron/glsp,
      and LSP4IJ.
  sources:
    - https://github.com/docker/docker-language-server#readme
    - https://github.com/docker/docker-language-server/blob/main/CHANGELOG.md
    - https://github.com/docker/docker-language-server/blob/main/CLIENTS.md
    - https://github.com/docker/docker-language-server/releases
    - https://github.com/docker/docker-language-server/tags
  summary:
    - >
      Docker Language Server is Docker's LSP server for Dockerfiles, Compose files, and
      Bake files. It moves Docker authoring features into editors through the Language
      Server Protocol.
  timeline:
    - '2025: v0.1.0 is tagged as the first public release line.'
    - '2025: v0.5.0-v0.10.x releases add rapid Compose, Dockerfile, and Bake language features.'
    - >
      2025: v0.17.0 adds Dockerfile inlay hints for image push age and Docker Hub
      image-tag suggestions for Compose.
    - '2025: v0.20.1 is documented in the changelog with Bake schema fixes.'
    - '2026: the package appears in Homebrew and Nix metadata.'
  usage:
    - >
      Users run docker-language-server start over stdio or TCP and connect it to an
      editor. The server provides Dockerfile, Compose, and Bake language features, with
      optional initialization settings for telemetry, Compose support, Dockerfile
      diagnostic overlap handling, and experimental Bake code-lens capabilities.
related-packages:
  - id: brew:docker-buildx
    reason: >
      Install Buildx to enable the language server's Buildx-dependent Dockerfile linting
      and Bake-related features.
    rel: adjacent_workflow
    sources:
      - https://github.com/docker/docker-language-server#requirements
      - https://docs.docker.com/build/architecture/
  - id: brew:dockerfile-language-server
    reason: >
      Choose Dockerfile Language Server when you need a narrower Dockerfile-only LSP;
      Docker Language Server covers Dockerfile, Compose, and Bake and explicitly
      provides an option to suppress diagnostics duplicated by this server.
    rel: alternative
    sources:
      - https://github.com/docker/docker-language-server#language-server-configuration
      - https://github.com/rcjsuen/dockerfile-language-server#readme
