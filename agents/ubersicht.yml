history:
  adoption-history:
    - >
      Übersicht fostered a community widget ecosystem through its official gallery.
      Widgets are independently inspectable and shareable source bundles, and the
      gallery accepts widgets maintained in their own GitHub repositories.
  package-nerd-significance:
    - >
      Übersicht is attractive to package-oriented users because desktop widgets are
      built from editable web source and shell-command output rather than a closed
      binary widget format. This makes widgets easy to inspect, version, customize, and
      share.
  project-history:
    - >
      Felix Hageloh created Übersicht as an open-source macOS application for running
      commands and displaying their output in desktop widgets.
    - >
      The widget model evolved from CoffeeScript-based widgets to JavaScript modules
      rendered with React and JSX, while retaining support for the classic format. The
      project also added AppleScript automation support.
  related-projects:
    - React
    - JSX
    - CoffeeScript
    - GeekTool
  sources:
    - 'Official repository: https://github.com/felixhageloh/uebersicht'
    - 'Official website: https://tracesof.net/uebersicht/'
    - 'Official widget gallery: https://tracesof.net/uebersicht-widgets/'
  summary:
    - >
      Übersicht is an open-source macOS desktop-widget host whose widgets combine system
      commands with HTML, CSS, JavaScript, React, and JSX.
  timeline:
    - 'Early releases: Übersicht widgets could be written in CoffeeScript.'
    - >
      Later releases: JavaScript modules using React and JSX became the primary widget
      format while classic widgets remained supported.
    - 'Version 1.1.45: Übersicht added AppleScript support.'
  usage:
    - >
      Users install widgets through Übersicht's menu and widget folder, or write JSX
      modules that run commands, periodically refresh, and render their output on the
      desktop. Übersicht watches the selected widget directory and reloads edited
      widgets for a live-development workflow.
