history:
  adoption-history:
    - >
      The input package metadata shows Aravis packaged by Homebrew, Alpine, Debian,
      Ubuntu, Nix, and openSUSE. That distribution footprint matches a C/GObject library
      used by desktop tools, embedded imaging setups, and Linux vision stacks.
    - >
      The official GitHub API metadata shows a four-digit star count and hundreds of
      forks, unusually strong for an industrial-camera library. Its continued 0.8
      maintenance releases indicate downstreams still depend on the stable ABI and tool
      names.
  package-nerd-significance:
    - >
      Aravis is package-nerd interesting because it sits at the intersection of Linux
      multimedia packaging and industrial hardware support. Its versioned tools, GLib
      ABI expectations, GStreamer plugin surface, and camera-protocol quirks make it
      exactly the sort of package where distro maintainers care about stable branches
      and hardware regression notes.
  project-history:
    - >
      The official GitHub repository was created in August 2016 and describes Aravis as
      a vision library for GenICam-based cameras. Its official topics and README surface
      the core technical areas: cameras, GenICam, GigE Vision, USB3 Vision,
      GLib/GObject, GStreamer, GTK, and video.
    - >
      The release history shows a long 0.8 stable line and newer 0.9 pre-release work.
      The 0.8.3 release notes, for example, focused on GigE Vision packet-size
      adjustment before streaming starts, while later releases mention viewer
      improvements, GStreamer plugin fixes, USB3 Vision handling, and GigE Vision
      compatibility fixes.
  related-projects:
    - >
      Related systems include GenICam, GigE Vision, USB3 Vision, GLib, GObject, GObject
      Introspection, GStreamer, GTK, Meson, and Linux camera tooling.
  sources:
    - https://api.github.com/repos/AravisProject/aravis
    - https://api.github.com/repos/AravisProject/aravis/releases
    - https://aravisproject.github.io/docs/aravis-0.8
    - https://github.com/AravisProject/aravis
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      Aravis is a vision and camera-control library for GenICam-based industrial
      cameras. The package includes both libraries and command-line utilities for
      testing, discovery, viewing, fake cameras, and camera tooling.
  timeline:
    - '2016: The official GitHub repository was created.'
    - '2020: The 0.8 release line appeared, with 0.8.0 published from the official repository.'
    - '2021: The 0.8.3 release emphasized GigE Vision packet-size adjustment before streaming.'
    - '2025: The 0.9.1 pre-release continued API and camera-protocol work.'
    - '2026: The project published both 0.8.36 stable and 0.9.2 pre-release tarballs.'
  usage:
    - >
      Package users get utilities such as `arv-tool-0.8`, `arv-viewer-0.8`,
      `arv-camera-test-0.8`, `arv-fake-gv-camera-0.8`, and `arv-test-0.8`. Developers
      use the library from C/GObject-oriented applications, GObject introspection
      bindings, and GStreamer pipelines.
    - >
      Common workflows include discovering cameras, inspecting GenICam features, testing
      GigE Vision or USB3 Vision devices, running fake-camera setups for development,
      and viewing live camera streams.
