history:
  adoption-history:
    - >
      Time Out has been distributed directly by Dejal and through the Mac App Store, and
      is also packaged as the Homebrew cask time-out. Its long compatibility history
      spans early Mac OS X, PowerPC and Intel universal builds, 64-bit transitions,
      sandboxing, and modern macOS releases.
  package-nerd-significance:
    - >
      Time Out is a veteran Mac utility whose release notes preserve a compact history
      of macOS packaging transitions: universal binaries, Gatekeeper signing,
      sandbox-compatible login behavior, Mac App Store distribution, and changing
      minimum-system requirements.
  project-history:
    - >
      Dejal released the first Time Out beta on July 10, 2003 and version 1.0 on August
      18, 2003. The application established its characteristic Normal and Micro break
      model early, then accumulated idle detection, sounds, scripts, multiple-display
      support, and extensive customization.
    - >
      Time Out 2.0, released in March 2016, introduced a setup assistant and a
      substantially redesigned application. Later releases expanded break themes,
      activity statistics, supporter features, and compatibility with newer macOS
      generations.
  related-projects:
    - >
      The official Extras collection includes community themes and scripts that
      integrate break sessions with applications or provide guided activities.
  sources:
    - https://dejal.com/help/timeout/en/
    - https://dejal.com/timeout/release/
    - https://www.dejal.com/timeout/
    - https://www.dejal.com/timeout/extras/
  summary:
    - >
      Time Out is a long-running macOS utility by Dejal Systems that schedules
      configurable work breaks and microbreaks.
  timeline:
    - '2003: Time Out 1.0 beta and 1.0 were released for Mac OS X.'
    - '2011: A Mac App Store-compatible edition appeared.'
    - '2012: Time Out moved to a 64-bit Mac requirement and added Developer ID signing.'
    - '2016: Time Out 2.0 introduced a redesigned generation and setup assistant.'
  usage:
    - >
      Users configure one or more breaks, commonly a ten-minute Normal break after fifty
      minutes and a brief Micro break every fifteen minutes. Time Out dims the displays
      when a break begins and can play sounds, run scripts, show themes, postpone or
      skip breaks, and adjust scheduling around idle periods.
