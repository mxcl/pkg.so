history:
  adoption-history:
    - >
      Mos is available both as a downloadable macOS application and through the Homebrew
      cask recorded in source_facts.package-manager.
    - >
      Its official repository has attracted a contributor and user community around
      smooth scrolling, per-application profiles, localization, and Logitech-device
      support.
  package-nerd-significance:
    - >
      Mos is representative of the focused, open-source macOS utilities commonly managed
      as Homebrew casks: it changes one aspect of desktop behavior while remaining
      independently upgradeable and removable.
    - >
      It is especially useful to users who combine an external wheel mouse with a
      trackpad and want separate direction or smoothing behavior for each device.
  project-history:
    - >
      Mos began as a lightweight macOS utility for making mouse-wheel scrolling behave
      more like trackpad scrolling while allowing mouse and trackpad directions to be
      configured independently.
    - >
      A public test of the substantial 3.0 redesign was announced in 2019. Later
      releases expanded the project into per-application scrolling profiles, hotkeys,
      mouse-button bindings, and Logitech HID++ support.
  related-projects:
    - macOS Accessibility
    - Logitech HID++
    - Homebrew Cask
  sources:
    - https://github.com/Caldis/Mos
    - https://github.com/Caldis/Mos/issues/207
    - https://github.com/Caldis/Mos/releases/
    - https://github.com/Caldis/Mos/wiki
  summary:
    - >
      Mos is an open-source macOS menu-bar utility for smooth mouse-wheel scrolling,
      independent scroll direction, per-application behavior, and mouse-button
      customization.
  timeline:
    - '2019: Mos 3.0 entered public testing.'
    - >
      2026: Mos 4.0 introduced a redesigned buttons module, simulated-trackpad
      scrolling, independent axes, and broader localization.
  usage:
    - >
      Users grant Accessibility permission so Mos can read and rewrite scrolling events,
      then tune smoothness, speed, direction, hotkeys, application-specific overrides,
      and supported mouse buttons.
    - >
      The app is normally left running as a menu-bar utility and is commonly installed
      or upgraded with Homebrew Cask.
