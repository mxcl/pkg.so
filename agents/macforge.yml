history:
  adoption-history:
    - >
      MacForge served the macOS customization community as a graphical catalog and
      manager for plugins, applications, and themes. It automated installation and
      updates that otherwise required users to build bundles or copy them into
      system-wide support directories.
    - >
      Its adoption has always been constrained by macOS security boundaries: many
      injected plugins require reduced System Integrity Protection or library-validation
      settings, and individual plugins must track macOS and processor-architecture
      changes.
  package-nerd-significance:
    - >
      MacForge represents the package-manager pattern applied to unsupported macOS
      customization: repositories publish metadata and bundles, while the client handles
      discovery, installation, enablement, blacklisting, and updates.
    - >
      It is historically tied to the SIMBL plugin ecosystem and later moved to
      mach-inject-style loading. That makes it useful for understanding the tension
      between tweak ecosystems and Apple's increasingly strict code-signing and runtime
      protections.
  project-history:
    - >
      MacEnhance developed MacForge as the successor-era plugin manager for its macOS
      modification ecosystem. The project evolved from earlier SIMBL-oriented
      functionality, was renamed MacForge in the 0.8 release, and added a store-like
      discovery and management interface for plugins, themes, and applications.
  related-projects:
    - >
      mySIMBL is identified by the project as the option for older macOS releases and is
      MacForge's direct ecosystem predecessor.
    - >
      The MacEnhance/MacForgeRepo repository contains the catalog metadata and
      publishing workflow used by MacForge.
    - >
      SIMBL and mach_inject are related injection technologies underlying generations of
      the plugin ecosystem.
  sources:
    - https://github.com/MacEnhance/MacForge
    - https://github.com/MacEnhance/MacForge/blob/master/CHANGELOG.md
    - https://github.com/MacEnhance/MacForgeRepo
    - https://www.macenhance.com/docs/general/sip.html
    - https://www.macenhance.com/macforge
  summary:
    - >
      MacForge is an open-source macOS plugin manager and catalog for discovering,
      installing, enabling, disabling, and updating system and application
      customizations.
  timeline:
    - >
      0.8: The application was renamed MacForge, added Mojave support, and moved from
      SIMBL to a mach_inject-based helper.
    - >
      1.0.5: The interface and injector were substantially revised, Big Sur support was
      added, and plugins gained hosted settings interfaces.
    - '2020-09-02: The official product page recorded the 1.0.8 release.'
    - >
      1.2.0 beta: Initial Apple-silicon support and a new injection implementation were
      added, with plugins still requiring individual architecture updates.
  usage:
    - >
      Users install MacForge's helper tools, browse its repositories, and install or
      manage plugin bundles, themes, and applications. Bundles can also be opened or
      dragged into MacForge directly.
    - >
      Many injected plugins require changes to System Integrity Protection and library
      validation. The official documentation warns that weakening these protections may
      make the Mac less secure, so MacForge is primarily suited to experienced users who
      understand that tradeoff.
