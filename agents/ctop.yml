credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation documentation lists downloadable binaries, Arch packaging,
      Homebrew, MacPorts, Scoop, and a Docker image. That breadth made ctop easy to try
      across developer laptops, servers, and container hosts.
  package-nerd-significance:
    - >
      ctop is a compact example of the post-Docker wave of single-binary terminal
      monitoring tools: package managers distribute one executable, Docker users can
      also run it as a container, and the runtime hooks are mostly environment variables
      and a small config file.
  project-history:
    - >
      The project appeared publicly as a GitHub-released Go terminal utility in 2017,
      moving quickly through early 0.x releases. Its README has long described built-in
      Docker and runC support, with other container and cluster connectors planned.
    - >
      GitHub release metadata records v0.7.7 in March 2022, while the README advertises
      direct binary releases and package-manager installs.
  related-projects:
    - >
      ctop is related to Docker, runC, top-style process monitors, and other terminal
      tools in the Docker ecosystem.
  sources:
    - https://github.com/bcicen/ctop#readme
    - https://github.com/bcicen/ctop/blob/master/_docs/connectors.md
    - https://api.github.com/repos/bcicen/ctop/releases?per_page=100
  summary:
    - >
      ctop is a top-like terminal interface for container metrics. It gives a concise,
      real-time overview of multiple containers and a single-container inspection view.
  timeline:
    - '2017: v0.3 and early 0.x releases published.'
    - '2018: v0.7 release published.'
    - '2022: v0.7.7 release published.'
  usage:
    - >
      ctop starts without arguments and reads Docker host variables by default. Users
      commonly use it to sort, filter, inspect logs, open a single-container view, exec
      a shell, and save filters or display preferences to the default config path.
related-packages:
  - id: brew:lazydocker
    reason: >
      Choose lazydocker when you want a broader Docker terminal manager for containers,
      images, volumes, logs, and Compose services; choose ctop for a compact
      metrics-first view.
    rel: alternative
    sources:
      - https://github.com/bcicen/ctop#readme
      - https://github.com/jesseduffield/lazydocker#readme
  - id: brew:oxker
    reason: >
      oxker is a resource-focused Docker TUI with container control features, making it
      an alternative when richer interactive management is needed alongside monitoring.
    rel: alternative
    sources:
      - https://github.com/bcicen/ctop#readme
      - https://github.com/mrjackwills/oxker#readme
  - id: brew:docker
    reason: >
      Use the Docker CLI for scripted container lifecycle operations and ctop for an
      interactive live view of metrics from the same Docker daemon.
    rel: adjacent_workflow
    sources:
      - https://github.com/bcicen/ctop#readme
      - https://docs.docker.com/reference/cli/docker/
