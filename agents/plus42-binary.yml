history:
  adoption-history:
    - >
      Plus42 is distributed for desktop and mobile operating systems, with free desktop
      downloads and paid mobile editions. Compatibility with HP-42S programs and Free42
      state and program workflows gives existing calculator enthusiasts a direct
      migration path.
  package-nerd-significance:
    - >
      The Binary edition is the speed-oriented binary-floating-point build. Its
      separation from the Decimal edition makes numerical representation an explicit
      package choice—an unusually visible example of implementation-level arithmetic
      affecting end-user packaging.
  project-history:
    - >
      Thomas Okken began adding advanced programming features to Free42 in 2019. In 2021
      he forked that work to build a calculator with algebraic equations, attached
      units, directories and a larger display; Plus42 1.0 followed in April 2022.
    - >
      Plus42 retained the HP-42S and Free42 programming model while adding financial
      calculations, plotting, structured storage and features inspired by later HP
      calculator families. The project is GPLv2-licensed and maintains shared source for
      its platform editions.
  related-projects:
    - Plus42 Decimal
    - Free42
    - HP-42S
  sources:
    - 'Official Free42 documentation: https://thomasokken.com/free42/'
    - 'Official project and documentation: https://thomasokken.com/plus42/'
    - 'Official release history: https://thomasokken.com/plus42/history.html'
  summary:
    - >
      Plus42 Binary is the binary-floating-point edition of Plus42, an open-source
      scientific programmable RPN calculator derived from Free42 and compatible with the
      HP-42S model.
  timeline:
    - '2019: Advanced programming features that preceded Plus42 began appearing in Free42'
    - '2021: Development began on a feature-expanded Free42 fork'
    - '2022-04-27: Plus42 1.0 was released'
  usage:
    - >
      Users perform scientific, engineering and financial calculations through an
      HP-style RPN interface, write keystroke programs, evaluate algebraic equations,
      attach units to values and plot functions. The Binary package suits users who
      prefer native binary floating-point behavior and speed.
