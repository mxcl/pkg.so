id: cask:timemachinestatus
display-name: TimeMachineStatus
repo: null
docs:
  - https://github.com/lukepistrol/TimeMachineStatus#readme
  - https://github.com/lukepistrol/TimeMachineStatus/releases
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README distributes TimeMachineStatus through GitHub Releases and
      explicitly documents installation through the Homebrew cask `timemachinestatus`.
      This gives the niche utility both a direct-update path and a package-managed
      installation path.
  package-nerd-significance:
    - >
      TimeMachineStatus is a focused example of a packageable macOS menu-bar utility
      built around an operating-system service. It exposes Time Machine state and
      controls without attempting to replace Apple’s backup engine.
  project-history:
    - >
      Lukas Pistrol developed TimeMachineStatus as an open-source Swift and SwiftUI
      menu-bar application intended to show more useful Time Machine information than
      the system default. Its features grew to include destination details, per-volume
      backup starts, status-item customization, and failure information.
    - >
      Later releases adjusted to macOS permission changes. Release 0.2.1 replaced a Full
      Disk Access requirement with explicit user selection of the Time Machine
      preferences file.
  related-projects:
    - Apple Time Machine
    - Apple `tmutil`
  sources:
    - Input `source_facts.description` and `source_facts.package-manager`.
    - https://github.com/lukepistrol/TimeMachineStatus
    - https://github.com/lukepistrol/TimeMachineStatus/releases
  summary:
    - >
      TimeMachineStatus is an open-source macOS menu-bar application for viewing and
      controlling aspects of Apple Time Machine backups.
  timeline:
    - >
      Early releases: The application added menu-bar status, backup-destination details,
      and Homebrew installation.
    - >
      0.2.1: Full Disk Access was replaced by user-authorized selection of the Time
      Machine preferences file.
    - '0.2.5: Failed-backup indicators and error descriptions were added.'
  usage:
    - >
      Users keep the application in the menu bar to inspect current backup state and
      destinations, start a backup for a selected volume, and customize the status item.
      On supported releases, the user explicitly grants access to the Time Machine
      preferences file when prompted.
