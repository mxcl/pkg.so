provenance:
  category-sources:
    - >
      source_facts.description says Dancer's shell, or distributed shell; official
      homepage describes dsh as a wrapper for executing multiple remote shell commands.
  display-name-sources:
    - >
      source_facts.name is dsh; official homepage title is DSH - dancer's shell /
      distributed shell.
  docs-sources:
    - >
      Official homepage contains download, compile, configuration, and usage
      documentation and is the best official documentation surface.
  history-sources:
    - https://www.netfort.gr.jp/~dancer/software/dsh.html.en
    - https://www.netfort.gr.jp/~dancer/software/downloads/
    - https://formulae.brew.sh/formula/dsh
  repo-sources:
    - >
      https://www.netfort.gr.jp/~dancer/software/downloads/ — official source archives;
      not a source-control repository.
    - >
      https://www.netfort.gr.jp/~dancer/software/dsh.html.en — official page links
      release downloads but no current official HTTP(S) source-control project page.
  tags-sources:
    - >
      source_facts.description and official homepage describe executing commands across
      multiple remote hosts using rsh/remsh/ssh wrappers and host group configuration.
