history:
  adoption-history:
    - >
      Shift says the project grew from a Canadian side project into a product used by
      professionals worldwide. Its audience includes people who routinely juggle
      multiple web applications, accounts, and work or personal contexts.
    - >
      The current product offers free, Advanced, and Teams plans, broadening its use
      from individual browser organization to centrally billed workplace deployments.
  package-nerd-significance:
    - >
      Shift represents the Electron/Chromium-era class of desktop productivity
      applications that package managers distribute as large, frequently updated casks.
      It is especially relevant to users who treat web applications as a unified desktop
      workspace and want installation and upgrades managed alongside native software.
  project-history:
    - >
      Shift was founded in Victoria, British Columbia, in 2016 as a side project within
      the Canadian technology company Redbrick. It evolved into a desktop workspace
      centered on managing multiple accounts and web applications.
    - >
      The product subsequently moved toward positioning itself as Shift Browser,
      combining conventional browsing with Spaces, integrated applications, anchored
      apps, synchronization, and team plans.
  related-projects:
    - 'Chromium: Browser technology underlying the broader ecosystem in which Shift operates.'
    - 'Redbrick: Canadian technology company under which Shift began.'
  sources:
    - https://shift.com/blog/shift-the-web-browser-born-made-in-canada/
    - >
      https://support.shift.com/hc/en-us/articles/24804884792596-Getting-started-with-Shift-Browser
    - >
      https://support.shift.com/hc/en-us/articles/39193522568468-Compare-plans-and-features-for-Shift-Browser
    - source_facts.description
  summary:
    - >
      Shift is a customizable desktop browser and workspace for organizing web
      applications, accounts, tabs, and separate Spaces in one window.
  timeline:
    - '2016: Shift was founded in Victoria, British Columbia, as a Redbrick side project.'
    - >
      2025: Shift publicly described its Canadian origins and worldwide professional
      user base.
    - >
      2026: Official onboarding presented the current product as Shift Browser,
      organized around browsing, apps, synchronization, and Spaces.
  usage:
    - >
      Users create Spaces for different contexts, add web applications and accounts, pin
      or anchor frequently used tools, and synchronize their setup between supported
      desktop computers.
    - >
      Shift is commonly used to keep multiple accounts for services such as email and
      collaboration tools simultaneously accessible without repeatedly signing in and
      out.
