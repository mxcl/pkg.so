history:
  adoption-history:
    - >
      Apidog Europe extends the Apidog desktop and cloud workflow to organizations
      requiring European data residency. The separate Homebrew Cask and application
      bundle allow macOS users to install the region-specific client explicitly rather
      than relying on the globally hosted edition.
  package-nerd-significance:
    - >
      The separate cask is significant because regional hosting is encoded at package
      and application level, making the deployment choice visible and reproducible. It
      is not a separate open-source codebase or a different class of API tool.
  project-history:
    - >
      Apidog Europe was introduced as a region-specific edition of Apidog. Official
      documentation describes it as storing data in Europe and providing a migration
      path for users moving from the standard service.
    - >
      Functionally, it belongs to the same specification-centered API platform, covering
      design, request debugging, mocking, testing, documentation, and team
      collaboration.
  related-projects:
    - Apidog is the standard globally hosted edition of the platform.
    - OpenAPI and Swagger specifications are central interchange formats.
    - Postman collections and scripts are supported compatibility surfaces.
  sources:
    - https://docs.apidog.com/en
    - https://docs.apidog.com/en/introduction-to-apidog-643492m0
    - source_facts.description
    - source_facts.source-archive
  summary:
    - >
      Apidog Europe is the European-hosted edition of Apidog's collaborative API design,
      debugging, mocking, testing, and documentation platform.
  timeline:
    - >
      By 2026: Official documentation offered Apidog Europe downloads, GDPR information,
      and migration guidance.
    - '2026: The supplied Homebrew Cask record distributes Apidog Europe 2.8.43 for macOS.'
  usage:
    - >
      Teams use Apidog Europe for the same API lifecycle workflows as Apidog while
      keeping service data in the European region. Typical work includes maintaining
      specifications, managing environments, sending requests, building mocks and
      automated tests, and publishing documentation.
    - >
      Users should select this regional client when their organization requires the
      European Apidog service; migration guidance is provided in the official
      documentation.
