history:
  adoption-history:
    - >
      Grok Bot began as an internal prototype used across the company for sales,
      marketing, operations, and engineering work. The August 2026 beta initially
      covered eligible SuperGrok and Cursor subscribers; xAI expanded access later that
      month to every SuperGrok tier, Cursor Pro, and all Cursor Teams plans.
    - >
      The official client matrix subsequently included macOS, Windows, Linux, iPhone,
      iPad, and Android. Homebrew's `grok-bot` cask provides a package-manager
      installation path for the macOS desktop application.
  package-nerd-significance:
    - >
      Grok Bot represents a shift from stateless chat clients toward persistent agent
      workspaces: named bots retain context, share a cloud computer, use connectors and
      browser sessions, and can run scheduled work. The cask is useful to Mac
      administrators even though the service, state, and authentication are primarily
      account- and cloud-managed rather than configured through documented local files.
  project-history:
    - >
      xAI launched Grok Bot publicly in beta on 11 August 2026, describing it as a
      roster of always-on AI teammates, each operating through a persistent computer
      with a browser, filesystem, and terminal.
    - >
      The product expanded quickly after launch with broader subscription availability,
      an X integration, enterprise support, mobile clients, routines, multi-bot
      coordination, and workflows learned through demonstration.
  related-projects:
    - Grok and SuperGrok provide eligible subscriptions and model access.
    - Cursor accounts and Cursor Teams are supported identity and entitlement surfaces.
    - Grok Build is xAI's related terminal-oriented coding agent.
  sources:
    - https://docs.x.ai/grok-bot/get-started
    - https://docs.x.ai/grok-bot/overview
    - https://x.ai/news/grok-bot-more-plans
    - https://x.ai/news/introducing-grok-bot
    - source_facts.package-manager
  summary:
    - >
      Grok Bot is xAI's persistent computer-using agent product. Users create named AI
      teammates, give them access to applications and websites, and communicate through
      messages, voice, routines, or other bots while work continues on a cloud computer.
  timeline:
    - '2026-08-11: xAI launched Grok Bot in beta.'
    - '2026-08-26: Availability expanded across SuperGrok, Cursor Pro, and Cursor Teams plans.'
    - '2026-08-29: xAI introduced a dedicated X integration.'
    - '2026-09: xAI documented enterprise use, mobile clients, and persistent-agent workflows.'
  usage:
    - >
      Users install the desktop or mobile client, authenticate with a supported Cursor
      account, optionally link an eligible SuperGrok subscription, create a bot with a
      defined job, and grant access to tools as required.
    - >
      Bots can perform multi-step work through connectors or computer use, retain files
      and browser sessions, collaborate in group chats, and run routines. Approval rules
      and separate controls for cloud and local-computer access govern sensitive
      actions.
