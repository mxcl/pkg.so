  - https://sourceforge.net/p/lpc21isp/code/HEAD/tree/README
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Homebrew, Debian, Ubuntu, and MacPorts package lpc21isp according to the supplied
      package-manager facts, which is typical for embedded utilities that remain useful
      long after active upstream development slows.
    - >
      SourceForge categorizes the project for developers and command-line use, and
      downstream ports describe it as an ISP programmer for NXP LPC microcontrollers.
  package-nerd-significance:
    - >
      lpc21isp matters to package maintainers because it is one of the small hardware
      bring-up tools that turns a Unix package manager into a practical embedded
      workstation. Its value is not broad desktop popularity, but being available when a
      board needs serial ISP flashing.
  project-history:
    - >
      The official SourceForge README identifies Martin Maurer as the author and
      describes the project as a portable command-line ISP for the NXP LPC family and
      Analog Devices ADUC70xx. Its copyright block covers 2003-2013, with later
      SourceForge code revisions reaching lpc21isp 1.97 in January 2014.
    - >
      The project lived in the classic SourceForge/SVN era of embedded open source:
      small C sources, Visual Studio and GCC build notes, and a project page oriented
      around downloads, code browsing, and a simple web site.
  related-projects:
    - >
      Related tools include vendor flash loaders, OpenOCD for debug-adapter workflows,
      and other serial bootloader utilities for microcontroller families.
  sources:
    - https://lpc21isp.sourceforge.net/
    - https://sourceforge.net/p/lpc21isp/code/HEAD/tree/
    - https://sourceforge.net/p/lpc21isp/code/HEAD/tree/README
    - source_facts.package-manager
  summary:
    - >
      lpc21isp is a portable command-line in-system programming tool for flashing
      firmware to NXP LPC-family and Analog Devices ADUC70xx microcontrollers over their
      serial bootloaders.
  timeline:
    - '2003: Official README copyright period begins for lpc21isp.'
    - '2008: SourceForge SVN history shows the initial imported project files.'
    - '2014: SourceForge code browser shows lpc21isp 1.97 revisions.'
    - >
      2026: Supplied package-manager facts list Homebrew, Debian, Ubuntu, and MacPorts
      packages.
  usage:
    - >
      Package users install the `lpc21isp` executable and use it from scripts or
      terminal sessions to transfer a firmware image through a supported serial
      bootloader. It has no documented project configuration or credential file.
related-packages:
  - id: brew:open-ocd
    reason: >
      Choose OpenOCD when programming must be performed through a JTAG or SWD debug
      adapter and the same session should also support on-chip debugging; lpc21isp
      targets serial ROM-bootloader ISP instead.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/lpc21isp/
      - https://openocd.org/doc/html/Debug-Adapter-Configuration.html
      - https://openocd.org/doc/html/Flash-Programming.html
