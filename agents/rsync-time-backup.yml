history:
  adoption-history:
    - >
      The README documents Linux, macOS, and Windows through WSL or Cygwin, and lists
      community extensions. source_facts.package-manager records Homebrew distribution.
  package-nerd-significance:
    - >
      It assembles rsync and filesystem hard links into browsable snapshots that can be
      restored with ordinary file tools.
  project-history:
    - >
      Laurent Cozic developed the script to provide Time Machine-style backups using
      rsync. Its copyright statement begins in 2013.
  related-projects:
    - >
      rsync supplies transfer functionality; Apple's Time Machine inspired the backup
      model. The README lists rtb-wrapper and time-travel as extensions.
  sources:
    - https://github.com/laurent22/rsync-time-backup#readme
    - source_facts.package-manager
  summary:
    - >
      Rsync time backup is a shell script for incremental snapshots stored as ordinary
      directories.
  timeline:
    - "2013: Earliest year in Laurent Cozic's upstream copyright statement."
  usage:
    - >
      Pass a source, destination, and optional exclusion file. Unchanged files share
      hard links with earlier backups. SSH supports remote endpoints; retention rules
      expire old snapshots. Configuration is supplied through arguments, and SSH
      identity files are user-selected.
