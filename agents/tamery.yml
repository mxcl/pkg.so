id: cask:tamery
display-name: Tamery
repo: https://github.com/wannabespace/tamery
docs:
  - https://github.com/wannabespace/tamery#readme
  - https://tamery.app/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Tamery is available as a desktop application, a web application, a Homebrew cask
      for macOS, and an Arch Linux package. Desktop users may continue without an
      account, while account-backed operation can synchronize connections across
      devices.
    - >
      The client targets both human SQL work and agent-assisted workflows: its MCP
      server permits tools such as Claude Code and Cursor to query configured databases
      while requiring user confirmation before writes.
  package-nerd-significance:
    - >
      Tamery combines several packaging trends in one database client: an Electron-style
      desktop application, a hosted web surface, an open-source monorepo, cloud
      synchronization, AI-assisted SQL, and an MCP bridge for coding agents.
    - >
      For database-tool users, its distinctive tradeoff is an agent-aware workflow with
      confirmation gates and optional connection synchronization. The desktop
      application can also work offline and keep connection metadata local.
  project-history:
    - >
      The project was originally published from a repository named conar and was
      subsequently rebranded as Tamery; GitHub redirects the former official repository
      URL to wannabespace/tamery.
    - >
      Tamery evolved into an AI-assisted database client supporting PostgreSQL, MySQL,
      MariaDB, SQL Server, ClickHouse, SQLite-compatible services, SSH tunnels, SSL,
      schema browsing, query editing, visualization, and an MCP server.
  related-projects:
    - Claude Code and Cursor, named as MCP clients in the official README
    - PostgreSQL, MySQL, MariaDB, SQL Server, ClickHouse, SQLite, Turso, and Cloudflare D1
  sources:
    - https://github.com/wannabespace/tamery#readme
    - https://tamery.app/
  summary:
    - >
      Tamery is an open-source database client and MCP server for desktop and web. It
      combines a table browser and schema-aware query editor with an AI assistant,
      encrypted connection handling, and guarded database access for external agents.
  timeline:
    - >
      2026: The project rebranded from Conar to Tamery and moved to the canonical
      wannabespace/tamery repository.
    - >
      2026: Tamery documented desktop, web, Homebrew, Arch Linux, offline,
      synchronization, and MCP-server workflows under the new name.
  usage:
    - >
      Paste a database connection string, environment file, JDBC URL, or psql command,
      then browse tables or open the query editor. The desktop client can connect
      directly to localhost and private networks.
    - >
      The AI assistant can write, explain, and repair SQL. Tamery states that
      data-changing operations require confirmation.
    - >
      Connection strings are encrypted. Users can synchronize them across devices or
      select metadata-only behavior so connection strings remain on the local machine.
related-packages:
  - id: cask:tableplus
    reason: >
      Choose TablePlus when you want a polished conventional native database GUI with
      broad database support and documentation, rather than Tamery's AI-assistant and
      MCP-centered workflow.
    rel: alternative
    sources:
      - https://github.com/wannabespace/tamery#readme
      - https://tableplus.com/
      - https://docs.tableplus.com/
  - id: cask:dbeaver-community
    reason: >
      Choose DBeaver Community Edition when you prefer a mature cross-platform
      open-source database workbench and its large driver ecosystem over Tamery's
      agent-oriented desktop and web experience.
    rel: alternative
    sources:
      - https://github.com/wannabespace/tamery#readme
      - https://dbeaver.io/
      - https://dbeaver.com/docs/dbeaver/
