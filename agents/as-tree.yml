id: brew:as-tree
display-name: as-tree
repo: null
docs:
  - https://github.com/jez/as-tree#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The provided package-manager facts list Homebrew, MacPorts, and Nix, which is a
      strong adoption signal for a tiny CLI filter. GitHub repository metadata reported
      hundreds of stars at research time.
    - >
      The tool's adoption niche is among users who already compose shell pipelines.
      Instead of adding complex filtering options to `tree`, it lets `find` or `fd`
      decide what paths exist and uses `as-tree` only for presentation.
  package-nerd-significance:
    - >
      as-tree is package-nerd candy because it does one thing that Unix pipelines want:
      transform line-oriented path streams into tree-shaped output. It is also a small
      Rust utility that ships through multiple package managers despite a minimal
      feature set.
    - >
      The contrast with `tree` is the point: no large option surface is needed when
      existing tools already produce the right list.
  project-history:
    - >
      The public repository was created in May 2020, with initial GitHub releases
      published the same month. The README states that the tool was inspired by a
      feature request in `fd`, and that it builds under both Cargo and Bazel.
    - >
      Its README is deliberately narrow: pass a list of paths in, get a tree display
      out. Development notes document Bazel-based tests and fixture files, while
      installation notes point to pre-built releases, Cargo, and source builds.
  related-projects:
    - >
      The README explicitly relates as-tree to `tree`, `find`, and `fd`, and cites the
      fd feature request that inspired it.
  sources:
    - https://api.github.com/repos/jez/as-tree
    - https://api.github.com/repos/jez/as-tree/releases
    - https://github.com/jez/as-tree
    - https://raw.githubusercontent.com/jez/as-tree/master/README.md
    - source_facts.package-manager
  summary:
    - >
      as-tree is a small Rust command-line filter that reads paths from a file or stdin
      and prints them as a tree. It complements path producers such as `find` and `fd`
      rather than replacing them.
  timeline:
    - '2020: Public GitHub repository created.'
    - '2020: 0.9.0 through 0.12.0 GitHub releases published in May.'
  usage:
    - >
      Common usage is `find . -name '*.txt' | as-tree` or `fd --exclude test | as-tree`.
      The CLI can also read a filename argument, print full path prefixes with `-f`, and
      control color with `--color always|auto|never`.
    - >
      Because it is a filter, it fits neatly into scripts and aliases where users want
      `tree`-like output after a more expressive file search.
related-packages:
  - id: brew:tree
    reason: >
      Choose tree when you want one command to traverse and display a directory; choose
      as-tree when another command already produced the exact path list to visualize.
    rel: alternative
    sources:
      - https://github.com/jez/as-tree#readme
      - https://github.com/Old-Man-Programmer/tree
  - id: brew:fd
    reason: >
      fd can perform fast, ignore-aware path selection and pipe its results into as-tree
      for hierarchical presentation.
    rel: adjacent_workflow
    sources:
      - https://github.com/jez/as-tree#readme
      - https://github.com/sharkdp/fd#readme
  - id: brew:findutils
    reason: >
      GNU find supplies expressive filesystem queries whose resulting paths can be piped
      into as-tree for readable tree output.
    rel: adjacent_workflow
    sources:
      - https://github.com/jez/as-tree#readme
      - https://www.gnu.org/software/findutils/manual/html_mono/find.html
