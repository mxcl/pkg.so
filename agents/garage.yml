id: brew:garage
display-name: Garage
repo: https://git.deuxfleurs.fr/Deuxfleurs/garage
docs:
  - https://garagehq.deuxfleurs.fr/documentation
config-file-location:
  unix:
    - /etc/garage.toml
    - $GARAGE_CONFIG_FILE
credentials-file-location: null
history:
  adoption-history:
    - >
      Official documentation presents Deuxfleurs itself as an early production user and
      invites other organizations to add public use cases. Package-manager availability
      across Homebrew and several Linux distributions reflects its role as an
      installable service daemon rather than only a source-built research project.
  package-nerd-significance:
    - >
      Garage matters to package and self-hosting communities because it gives
      S3-compatible object storage a small-operator shape: a single CLI/server package,
      plain configuration, documented packages, and a design explicitly tuned for
      machines outside conventional datacenters.
  project-history:
    - >
      The project was created in 2020 by Deuxfleurs, an experimental small-scale
      self-hosted service provider. Its README describes Garage as the storage service
      Deuxfleurs has used in production since the first release in 2020.
    - >
      Garage's design centers on lightweight operation, resilience to machine failures,
      and replication across locations rather than compatibility with filesystem or
      POSIX semantics.
  related-projects:
    - >
      Garage is related to Amazon S3 through protocol compatibility, and to Deuxfleurs
      infrastructure projects such as Bagage, which the official use-case documentation
      describes as a WebDAV-to-S3 and SFTP-to-S3 proxy.
  sources:
    - https://garagehq.deuxfleurs.fr/documentation/design/goals/
    - https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/
    - https://git.deuxfleurs.fr/Deuxfleurs/garage
    - https://git.deuxfleurs.fr/api/v1/repos/Deuxfleurs/garage
    - https://git.deuxfleurs.fr/api/v1/repos/Deuxfleurs/garage/releases?limit=100
  summary:
    - >
      Garage is a self-hosted, S3-compatible distributed object store from Deuxfleurs,
      aimed at small-to-medium deployments that span multiple physical locations.
  timeline:
    - '2020: Garage project created and first used by Deuxfleurs in production.'
    - '2021: 0.3.0 release published on the official Deuxfleurs forge.'
    - '2022: 0.7.0 release published as Garage moved through early public releases.'
  usage:
    - >
      Users deploy Garage nodes with a TOML configuration file, join them into a
      cluster, and access storage through S3-compatible clients. The project documents
      common operations such as binary packages, systemd service setup, gateway nodes,
      reverse proxying, monitoring, and upgrades.
related-packages:
  - id: brew:minio
    reason: >
      Choose MinIO when strong consistency and erasure coding fit the deployment better;
      Garage's official comparison contrasts those properties with Garage's lightweight,
      replication-based, multi-site design.
    rel: alternative
    sources:
      - https://garagehq.deuxfleurs.fr/documentation/design/related-work/
      - https://min.io/product/aistor/object-store
  - id: brew:restic
    reason: >
      Garage officially documents using restic with a Garage bucket as an S3 backup
      repository, including the required endpoint, key, and repository settings.
    rel: adjacent_workflow
    sources:
      - https://garagehq.deuxfleurs.fr/documentation/connect/backup/
      - https://restic.readthedocs.io/en/stable/030_preparing_a_new_repo.html
