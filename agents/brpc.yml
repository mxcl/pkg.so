credentials-file-location: null
history:
  adoption-history:
    - >
      bRPC's adoption history starts inside Baidu: the official docs include use-case
      pages for Baidu Maps API gateway, Union DSP, ELF learning framework, and
      cloud-platform proxy services. After incubation, adoption broadened through Apache
      governance, public documentation, mailing lists, GitHub issues, and Homebrew
      packaging.
    - >
      Unlike many RPC libraries packaged primarily as language modules, bRPC ships
      developer-facing tools such as `rpc_press`, `rpc_replay`, `rpc_view`,
      `parallel_http`, and `trackme_server`, which explains why it appears as a Homebrew
      formula rather than only as a C++ source dependency.
  package-nerd-significance:
    - >
      For package nerds, bRPC is a useful contrast to small CLI tools: it is a heavy C++
      distributed-systems framework whose package-manager artifact exposes both
      libraries and operational tools. Its history also shows how company-born
      infrastructure becomes a community-governed Apache project without losing the
      fingerprints of its original production environment.
  project-history:
    - >
      The Apache bRPC website describes the project as an industrial-grade C++ RPC
      framework often used in high-performance systems such as search, storage, machine
      learning, advertising, and recommendation. The README explains the name as better
      RPC and highlights one-port multi-protocol servers, HTTP/HTTPS, h2/gRPC, Redis,
      memcached, Thrift, Baidu internal protocols, and braft-based Raft services.
    - >
      bRPC entered the Apache Incubator on 2018-11-13. The incubator status page records
      Apache bRPC incubating releases 0.9.6 in 2019, 0.9.7 in 2020, 1.0.0 in 2021, and
      1.1.0 through 1.3.0 in 2022 before graduation on 2022-12-22. The first listed
      post-graduation Apache bRPC release is 1.4.0 on 2023-02-07.
  related-projects:
    - >
      Related projects include gRPC, Apache Thrift, protobuf, braft, Redis and memcached
      clients, HTTP/2 service frameworks, and other large-scale C++ RPC stacks used
      inside infrastructure companies.
  sources:
    - https://brpc.apache.org/
    - https://brpc.apache.org/docs/
    - https://brpc.apache.org/docs/use-cases-inside-baidu/
    - https://github.com/apache/brpc
    - https://incubator.apache.org/projects/brpc.html
  summary:
    - >
      Apache bRPC is an industrial-grade C++ RPC framework for reliable,
      high-performance services. It is rooted in Baidu production infrastructure and
      later became an Apache Top-Level Project, with built-in support for multiple
      protocols, observability endpoints, benchmarking and replay tools, and
      distributed-systems components.
  timeline:
    - 'Pre-2018: bRPC develops as Baidu production RPC infrastructure.'
    - '2018-11-13: bRPC enters the Apache Incubator.'
    - '2019-07-14: Apache bRPC incubating 0.9.6 release.'
    - '2021-10-31: Apache bRPC incubating 1.0.0 release.'
    - '2022-12-22: bRPC graduates from the Apache Incubator.'
    - '2023-02-07: Apache bRPC 1.4.0 release after graduation.'
  usage:
    - >
      Engineers use bRPC to build C++ clients and servers that need high-throughput RPC,
      mixed protocol support, HTTP-accessible debugging, profiling, load balancing,
      naming-service integration, and production observability. It is especially
      relevant to large internal-service deployments where one framework must bridge
      custom protocols and common open protocols.
