id: brew:cdk8s
display-name: cdk8s
repo: https://github.com/cdk8s-team/cdk8s-cli
docs:
  - https://cdk8s.io/docs/latest
  - https://cdk8s.io/docs/latest/get-started
config-file-location:
  unix:
    - ./cdk8s.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      cdk8s grew in the infrastructure-as-code community as a code-first alternative to
      hand-written Kubernetes YAML, Helm templates, and Kustomize overlays. Its official
      docs support TypeScript, Python, Java, and Go language guides, reflecting adoption
      by teams that prefer typed languages and reusable constructs.
    - >
      The project later became associated with the Cloud Native Computing Foundation
      ecosystem as a CNCF Sandbox project, giving it a recognizable place among
      Kubernetes tooling rather than as only an AWS-authored experiment.
  package-nerd-significance:
    - >
      For package people, cdk8s matters because it packages a Node-based CLI for a
      polyglot framework: the formula is the command-line entry point, while generated
      bindings and constructs connect npm, PyPI, Maven, Go modules, and Kubernetes
      release churn.
  project-history:
    - >
      AWS introduced cdk8s publicly in 2020 as a Kubernetes-focused member of the
      broader CDK family. The official documentation presents it around apps, charts,
      constructs, and imports, mirroring the construct model familiar from AWS CDK while
      targeting Kubernetes manifests.
    - >
      The Homebrew package installs the cdk8s CLI, whose official GitHub repository is
      cdk8s-team/cdk8s-cli. The documentation site links to the broader cdk8s-team/cdk8s
      project for framework documentation and source.
  related-projects:
    - >
      cdk8s is part of the CDK family of infrastructure tools and is conceptually
      related to AWS CDK and CDK for Terraform, while competing or coexisting with Helm,
      Kustomize, and handwritten Kubernetes YAML.
  sources:
    - https://api.github.com/repos/cdk8s-team/cdk8s-cli
    - https://github.com/cdk8s-team/cdk8s-cli
    - https://cdk8s.io/
    - https://cdk8s.io/docs/latest
    - https://cdk8s.io/docs/latest/get-started
    - https://formulae.brew.sh/api/formula/cdk8s.json
  summary:
    - >
      cdk8s is the Cloud Development Kit for Kubernetes, a framework and CLI for
      defining Kubernetes manifests in general-purpose programming languages and
      synthesizing them to YAML.
  timeline:
    - '2020: AWS publicly introduces cdk8s for Kubernetes manifests.'
    - '2021: cdk8s-cli repository created under the cdk8s-team organization.'
    - >
      2020s: Documentation grows around multiple programming languages and Kubernetes
      construct workflows.
  usage:
    - >
      Typical use starts with cdk8s init, a project-level cdk8s.yaml file, and app code
      that defines charts and constructs. The CLI synthesizes manifests for review or
      deployment through other Kubernetes workflows.
related-packages:
  - id: brew:kustomize
    reason: >
      Choose Kustomize when you want declarative composition and patches over existing
      Kubernetes YAML; choose cdk8s when you want typed, object-oriented application
      code that synthesizes YAML.
    rel: alternative
    sources:
      - https://cdk8s.io/docs/latest/
      - https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
  - id: brew:kubernetes-cli
    reason: >
      kubectl applies the standard Kubernetes manifests produced by cdk8s, making it the
      documented deployment companion after cdk8s synth.
    rel: adjacent_workflow
    sources:
      - https://cdk8s.io/docs/latest/
      - https://kubernetes.io/docs/reference/kubectl/
tags:
  - cli
  - infrastructure-as-code
  - kubernetes
  - manifests
  - object-oriented
