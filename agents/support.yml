credentials-file-location: null
history:
  adoption-history:
    - >
      Root3 reports that Support App has been used by organizations worldwide since its
      2020 public release. It is designed for deployment through device-management
      services using custom configuration profiles, making it particularly suited to
      managed Mac fleets.
  package-nerd-significance:
    - >
      Support App is notable to Mac administrators because it turns configuration
      profiles, preference domains, scripts, and system diagnostics into a branded
      self-service support surface. It fits naturally into declarative fleet setup and
      can be installed as a Homebrew cask or organizational package.
    - >
      Its open GitHub repository and extensive preference-key documentation make it more
      automatable and auditable than many proprietary help-desk menu-bar clients.
  project-history:
    - >
      Support App was developed by Root3, a Netherlands-based Apple device-management
      specialist, and publicly released in 2020. It is written in Swift and SwiftUI as a
      native, sandboxed macOS menu-bar application.
    - >
      The project evolved from presenting basic Mac and user information into a
      configurable organizational support hub with custom actions, scripted extensions,
      notifications, privileged operations, and optional integration with Root3's App
      Catalog.
  related-projects:
    - Support App can integrate with Root3 App Catalog for managed application updates.
    - >
      Its documented deployment paths include Jamf Pro, Kandji, Microsoft Intune, and
      other device-management systems supporting custom configuration profiles.
  sources:
    - https://github.com/root3nl/SupportApp/wiki
    - https://github.com/root3nl/SupportApp/wiki/Configuration
    - https://github.com/root3nl/SupportApp/wiki/Extensions
    - source_facts.repo
  summary:
    - >
      Support App is an open-source macOS menu-bar utility that gives users and help
      desks access to device diagnostics, support channels, company resources, and
      administrator-defined actions.
  timeline:
    - '2020: Support App is publicly released.'
    - >
      2020s: The project adds configuration-profile deployment, scripted extensions,
      privileged actions, and App Catalog integration.
  usage:
    - >
      Mac administrators brand and configure the app through the nl.root3.support
      preference domain, normally using a configuration profile exported from
      Configurator Mode and delivered by device management. Tiles can show system
      information or open applications, URLs, commands, file servers, and support tools.
    - >
      Scripts can populate extension values through
      /Library/Preferences/nl.root3.support.plist. No application credentials file is
      required or documented; external integrations may have their own independently
      managed credentials.
