history:
  adoption-history:
    - >
      The official README documents Homebrew, Snap, and Go installation paths, placing
      the tool in the common distribution channels used by small Go security CLIs. It
      also lists appearances in security newsletters and community media, which points
      to use in the bug-bounty tooling ecosystem rather than as a general-purpose web
      crawler.
  package-nerd-significance:
    - >
      For package managers, csprecon is a typical modern Go security tool: one
      executable, no documented config file, and official installation instructions that
      explicitly include Homebrew.
  project-history:
    - >
      The upstream project presents csprecon as a focused security utility for
      bug-bounty and reconnaissance workflows. Its first GitHub release was v0.0.1 in
      November 2022, and the README documents release notes as the project's changelog
      surface.
  related-projects:
    - >
      csprecon belongs to the same operational niche as other small reconnaissance and
      bug-bounty CLIs that discover domains, hosts, or policy-derived targets.
  sources:
    - https://github.com/edoardottt/csprecon#readme
    - https://github.com/edoardottt/csprecon/releases/tag/v0.0.1
    - https://github.com/edoardottt/csprecon/releases
  summary:
    - >
      csprecon is a Go command-line reconnaissance tool for discovering target domains
      by inspecting Content Security Policy data.
  timeline:
    - '2022: v0.0.1 is published on GitHub.'
    - '2022: README documents Homebrew, Snap, and Go installation methods.'
    - '2023: v0.0.5 is published on GitHub.'
  usage:
    - >
      The CLI accepts single URLs, lists of domains, CIDR input, concurrency and
      rate-limit options, proxy settings, and JSON output. That makes it
      package-relevant as a composable recon binary for shell pipelines.
