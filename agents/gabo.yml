id: brew:gabo
display-name: gabo
repo: null
docs:
  - https://github.com/ashishb/gabo#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Upstream documents installation through go install, direct go run usage, and
      Homebrew. Public package-manager adoption appears intentionally narrow in the
      supplied facts, with Homebrew listed as the only package-manager entry.
  package-nerd-significance:
    - >
      gabo is a small but package-relevant example of turning copied CI YAML into a
      versioned CLI. Its value is less about broad ecosystem history and more about
      encoding conservative workflow defaults into a repeatable tool.
  project-history:
    - >
      The GitHub repository was created in March 2023. Its README frames the tool as a
      response to common GitHub Actions pitfalls and emphasizes generated workflows with
      timeouts, path filters, concurrency cancellation, caching, and reduced
      GITHUB_TOKEN permissions.
  related-projects:
    - >
      gabo-generated workflows refer to ecosystem tools such as actionlint, zizmor,
      hadolint, vacuum, and oasdiff for specific CI checks.
    - >
      The README points readers to the author's GitHub Actions pitfalls article for
      background.
  sources:
    - https://api.github.com/repos/ashishb/gabo
    - https://github.com/ashishb/gabo
    - https://raw.githubusercontent.com/ashishb/gabo/master/README.md
  summary:
    - >
      gabo, short for GitHub Actions Boilerplate, is a Go command-line tool for
      generating and analyzing GitHub Actions workflow boilerplate with safer defaults.
  timeline:
    - '2023: GitHub repository created.'
    - >
      2020s: Distributed through go install/direct go run and Homebrew according to
      upstream README and supplied package facts.
  usage:
    - >
      The CLI can analyze a repository or generate workflow files under
      .github/workflows. Supported templates include Android, Docker, npm/yarn, Go,
      Python, shell, YAML, Markdown, OpenAPI, and GitHub Actions linting workflows.
related-packages:
  - id: brew:actionlint
    reason: >
      gabo can generate a GitHub Actions linting workflow that runs actionlint for
      workflow syntax and semantic checks.
    rel: adjacent_workflow
    sources:
      - https://github.com/ashishb/gabo#readme
      - https://rhysd.github.io/actionlint/
  - id: brew:zizmor
    reason: >
      gabo's GitHub Actions linting template invokes zizmor alongside actionlint to
      detect security problems in generated or existing workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/ashishb/gabo#readme
      - https://docs.zizmor.sh/
