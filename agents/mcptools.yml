credentials-file-location: null
history:
  adoption-history:
    - >
      By July 2026, GitHub metadata showed about 1.6k stars and more than 100 forks,
      indicating meaningful adoption among MCP developers and operators. Its feature set
      is targeted at people building or debugging MCP servers rather than end users
      chatting with models.
    - >
      The README includes Homebrew installation instructions via the project's tap as
      well as `go install`, showing the usual Go CLI distribution path: source install
      for cross-platform users and a package-manager path for macOS users.
  package-nerd-significance:
    - >
      MCP Tools is significant because protocol ecosystems usually need practical
      inspection tools before they become comfortable to package and operate. For MCP,
      `mcptools` fills the role that `curl`, `grpcurl`, or `jq`-heavy scripts fill
      elsewhere: a small CLI you can install and use to prove what a server exposes.
    - >
      Its binary-name story also captures a packaging problem in young ecosystems: the
      obvious command name `mcp` is valuable but can conflict, so formulas and
      installers need aliases or alternate executable names.
  project-history:
    - >
      The public GitHub repository was created in March 2025, during the first broad
      wave of standalone MCP utilities. The first GitHub release, v0.0.1, was published
      the same day as repository creation, and the project reached v0.7.1 by May 2025.
    - >
      The README shows that the installed command may appear as `mcp`, `mcpt`, or
      `mcptools` depending on installation method and conflict avoidance. That naming
      detail is package-history relevant because `mcp` is a tempting but collision-prone
      binary name in the MCP ecosystem.
  related-projects:
    - >
      MCP Tools is related to MCP server implementations, MCP Inspector-style workflows,
      and clients such as MCPHost. It complements MCPM by inspecting and exercising
      servers after they have been installed or configured.
  sources:
    - https://api.github.com/repos/f/mcptools
    - https://api.github.com/repos/f/mcptools/releases
    - https://github.com/f/mcptools
  summary:
    - >
      MCP Tools is a command-line interface for inspecting, calling, testing, mocking,
      and proxying Model Context Protocol servers. Its README describes it as a Swiss
      Army knife for MCP servers, with support for stdio and HTTP transports, multiple
      output formats, an interactive shell, a web interface, aliases, config management,
      mock servers, and project scaffolding.
  timeline:
    - '2025-03: Public GitHub repository created.'
    - '2025-03: v0.0.1 release published.'
    - '2025-05: v0.7.1 release published.'
    - '2026-07: Repository metadata shows about 1.6k stars and 124 forks.'
  usage:
    - >
      Common usage is to connect to an MCP server and list tools, resources, or prompts,
      then call a specific tool with JSON parameters. The README examples show using a
      filesystem MCP server over stdio, calling `read_file`, opening an interactive
      shell, and switching output among table, compact JSON, and pretty JSON formats.
    - >
      For server developers, MCP Tools also provides mock server, proxy, guard, web UI,
      and scaffolding modes. That makes it less of a single-purpose client and more of a
      debugging and interoperability tool for MCP implementations.
related-packages:
  - id: brew:mcp-inspector
    reason: >
      Choose MCP Inspector when you want the protocol's reference graphical inspector or
      its shared web, CLI, and TUI clients; choose MCP Tools for a compact CLI with
      mock, proxy, guard, alias, and scaffolding workflows.
    rel: alternative
    sources:
      - https://github.com/f/mcptools#readme
      - https://modelcontextprotocol.io/docs/tools/inspector
