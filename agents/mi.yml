id: cask:mi
display-name: mi
repo: null
docs:
  - https://www.mimikaki.net/help/3.9.6/ja/index.html
  - https://www.mimikaki.net/mi/faq
config-file-location:
  macos:
    - ~/Library/Application Support/mi3/AppPreferences.mi
    - iCloud Drive/mi/.mi/AppPreferences.mi
credentials-file-location: null
history:
  adoption-history:
    - >
      mi is distributed as a free macOS application and is also catalogued as the
      Homebrew cask `mi`, giving command-line-oriented Mac users a package-managed
      installation path.
  package-nerd-significance:
    - >
      mi is notable as a long-running, Mac-native general-purpose editor with explicit
      mode-specific configuration, keywords, plug-ins, and tools. Its documented,
      portable settings hierarchy is useful to users who back up or migrate development
      environments.
  project-history:
    - >
      mi is developed by Daisuke Ueyama as a macOS text editor. Its documentation
      describes a focus on efficient plain-text work including programming, web-page
      creation, manuscript writing, review, and log analysis.
    - >
      The version 3 configuration model stores application preferences and per-mode data
      under `mi3`; settings can optionally be placed in an iCloud Drive folder for
      synchronization.
  related-projects:
    - macOS text editors
    - Homebrew Cask
  sources:
    - https://www.mimikaki.net/help/3.9.6/ja/index.html
    - https://www.mimikaki.net/help/3.9/ja/manageapp.html
    - https://www.mimikaki.net/mi/faq/
    - source_facts.package-manager
  summary:
    - >
      mi is a free general-purpose text editor for macOS, oriented toward coding and
      other structured plain-text work.
  timeline:
    - >
      Version 2.1.11: Mode and other settings moved into the user's Application Support
      directory
    - >
      Version 3: Configuration uses the `mi3` hierarchy and can optionally synchronize
      selected settings through iCloud Drive
  usage:
    - >
      Users open and edit local text files, select modes by filename extension, and
      customize each mode's appearance, keywords, plug-ins, and tools. Settings can be
      migrated by copying the documented configuration directory.
tags:
