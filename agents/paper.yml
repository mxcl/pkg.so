history:
  adoption-history:
    - >
      The developer says pap.er has provided free wallpapers since its 2017 release. The
      official site publishes favorable user testimonials but supplies no independently
      quantified adoption figures.
  package-nerd-significance:
    - >
      For Homebrew users, the cask packages a long-running, Mac-specific wallpaper
      utility whose official distribution otherwise comes from the developer website or
      Mac App Store.
  project-history:
    - >
      pap.er was released in 2017 as a macOS wallpaper application. The later 5.x line
      requires macOS 11 or newer and emphasizes editor-curated images, while the older
      3.x line remains available for macOS 10.13 and newer without the same manual
      curation.
  related-projects:
    - macOS desktop wallpaper settings
    - Mac App Store
  sources:
    - >
      Input package metadata: source_facts.description, source_facts.version, and
      source_facts.package-manager
    - 'Official pap.er homepage and FAQ: https://www.paperapp.net/?lang=en'
  summary:
    - >
      pap.er is a macOS wallpaper application offering curated high-resolution images,
      including selections intended for 4K, 5K, and portrait displays.
  timeline:
    - '2017: pap.er was released for macOS.'
    - >
      5.x era: The application moved to a macOS 11-or-newer edition with editor-curated
      wallpapers while retaining a legacy 3.x download.
  usage:
    - >
      Users can change wallpaper on demand or schedule weekly, daily, or hourly changes.
      The application can also incorporate users’ own images through its wallpaper
      storage folder, although the official FAQ does not publish that folder’s
      filesystem path.
