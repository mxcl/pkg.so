id: brew:gpatch
display-name: GNU patch
repo: https://git.savannah.gnu.org/cgit/patch.git
docs:
  - https://www.gnu.org/software/diffutils/manual/html_node/Invoking-patch.html
  - https://savannah.gnu.org/projects/patch
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      patch became a standard Unix packaging primitive because source distributions
      could ship small textual changes instead of whole replacement trees. GNU patch's
      support for unified diffs, reject files, backup naming, and POSIX/GNU build
      conventions made it fit naturally into Autotools-era source packages and
      distribution build recipes.
  package-nerd-significance:
    - >
      For package maintainers, GNU patch is infrastructure rather than just a user
      command. It is the tool behind downstream patch queues, source RPM and Debian
      patch application, vendor backports, portability fixes, and decades of
      email-driven source exchange before pull-request platforms normalized
      repository-hosted review.
  project-history:
    - >
      The GNU patch README states that this GNU version applies diff files to original
      files and includes many Free Software Foundation changes: binary and large-file
      handling, unified diff support, merge behavior, GNU-style backup files, improved
      RCS and SCCS interaction, GNU option parsing/configure conventions, and better
      POSIX compliance.
    - >
      The README also explains why the FSF distributed GNU patch independently: Larry
      Wall had not released a new version since mid-1988, and he agreed to GNU
      distribution under the GNU General Public License. GNU bulletins from the 1990s
      describe patch as GNU's version of Larry Wall's program for applying diff output.
  related-projects:
    - GNU diffutils produces the diff output commonly consumed by patch.
    - RCS, SCCS, CVS, and later Git all coexist with patch-oriented workflows.
    - >
      Git's `git apply` and `git format-patch` continue the patch-file workflow in a
      repository-aware form.
  sources:
    - https://ftp.gnu.org/gnu/patch/
    - https://ftp.gnu.org/gnu/patch/patch-2.7.6.tar.xz
    - https://git.savannah.gnu.org/cgit/patch.git
    - https://savannah.gnu.org/projects/patch
    - https://www.gnu.org/bulletins/bull22.html
    - https://www.gnu.org/software/diffutils/manual/html_node/Invoking-patch.html
  summary:
    - >
      GNU patch applies diff output to original files to produce modified files. It
      descends from Larry Wall's patch program and became one of the basic tools of Unix
      source distribution, mailing-list development, and package-manager patch
      application.
  timeline:
    - '1984: Larry Wall copyright years begin in the GNU patch README.'
    - >
      1988: The GNU patch README says Larry Wall had not released a new version since
      mid-1988.
    - '1989: Free Software Foundation copyright years begin in the GNU patch README.'
    - "1990s: GNU bulletins list patch as GNU's version of Larry Wall's diff-applying program."
    - '1997: GNU FTP archive lists patch 2.5.'
    - >
      2009: patch 2.6 adds a regression test suite, merge option, improved rejects, and
      GPLv3 licensing.
    - '2012: patch 2.7 adds `diff --git` format support and path-safety checks.'
    - '2018: GNU FTP archive lists patch 2.7.6.'
    - '2025: GNU FTP archive lists patch 2.8.'
  usage:
    - >
      The GNU diffutils manual shows the common form `patch <patchfile`, with optional
      original-file and patch-file arguments. If no patch file is supplied, patch reads
      diff output from standard input; if no input file is supplied, it tries to infer
      the file to edit from leading patch text.
related-packages:
  - id: brew:diffutils
    reason: >
      GNU diffutils creates the diff files that GNU patch consumes, making the two tools
      the standard producer-and-consumer pair for repository-independent source changes.
    rel: adjacent_workflow
    sources:
      - https://www.gnu.org/software/diffutils/manual/html_node/Merging-with-patch.html
      - https://www.gnu.org/software/diffutils/
