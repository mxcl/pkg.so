history:
  adoption-history:
    - >
      LibJWT is packaged across many Unix-like systems, including Homebrew, Debian,
      Ubuntu, Fedora, Alpine, MacPorts, Nix, and openSUSE. That distribution spread
      reflects a common packaging need: C and C-adjacent services need JWT/JWK
      primitives without embedding a large web framework.
    - >
      The project also evolved with the crypto-backend landscape. Its README documents
      OpenSSL, GnuTLS, and MbedTLS support, plus JSON backends through Jansson or
      json-c, letting distributors choose dependencies that match platform policy.
  package-nerd-significance:
    - >
      LibJWT is interesting to package maintainers because security-sensitive C
      libraries have unusually sharp dependency and ABI edges. The package exposes
      choices among crypto libraries, JSON parsers, and optional libcurl support while
      staying useful as a small shared library and command-line utility bundle.
  project-history:
    - >
      Ben Collins moved the Git repository in May 2015, and the v1.0.0 tag is anchored
      to that early public history. The project later expanded beyond basic JWT signing
      and validation into a broader JOSE library surface, including JWS serializations,
      JWE serializations, JWK thumbprints, remote JWKS caching, DPoP, and
      application-profile helpers.
    - >
      The documentation tracks the IETF standards that shaped the library, including RFC
      7515 through RFC 7519 for JWS, JWE, JWK, JWA, and JWT, plus later standards such
      as RFC 7638, RFC 8725, RFC 9068, RFC 9278, and RFC 9449.
  related-projects:
    - >
      Related standards and projects include JWT.io, the JOSE RFC family, OpenSSL,
      GnuTLS, MbedTLS, Jansson, json-c, and libcurl.
  sources:
    - https://datatracker.ietf.org/doc/html/rfc7519
    - https://formulae.brew.sh/formula/libjwt
    - https://github.com/benmcollins/libjwt
    - https://github.com/benmcollins/libjwt/tags
    - https://libjwt.io/
  summary:
    - >
      LibJWT is a C library for JSON Web Token and adjacent JOSE formats. It gives C
      programs JWT creation, verification, JWK/JWKS handling, JWS, JWE, and multiple
      crypto-backend choices without making the application shell out to higher-level
      language tooling.
  timeline:
    - '2015-05-19: v1.0.0 tag points at the repository-move commit.'
    - '2016-11-05: v1.6.1 tag was committed.'
    - >
      2020s: Documentation covers JWS, JWE, JWK, JWKS, DPoP, JWT Best Current Practices,
      and access-token profiles.
    - '2026: README documents experimental ML-DSA support tied to FIPS 204 and RFC 9964.'
  usage:
    - >
      Common uses include signing JWTs, verifying tokens against local keys or JWKS
      keyrings, generating JWKs, handling key rotation through cached remote JWKS, and
      building tokens for application profiles such as access-token JWTs, DPoP, VAPID,
      PASSporT, OpenID4VCI, mTLS, and JAdES.
related-packages:
