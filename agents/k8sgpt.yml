history:
  adoption-history:
    - >
      CNCF accepted K8sGPT as a Sandbox project on December 19, 2023. That milestone
      gave the tool a recognizable governance and discovery channel in the same
      ecosystem as Kubernetes, Helm, Prometheus, and other operational packages.
    - >
      Homebrew and Nix packaging made the CLI easy to install into local Kubernetes
      troubleshooting workflows. Its adoption pattern is typical of modern cloud-native
      CLIs: operators install a small binary, point it at kubeconfig-backed clusters,
      and then decide which AI backend or integration is appropriate for their
      environment.
  package-nerd-significance:
    - >
      For package nerds, K8sGPT is a snapshot of the moment when AI tools became normal
      enough to be packaged beside kubectl-adjacent utilities. It is small, Go-based,
      cloud-native, and interesting precisely because it translates high-context cluster
      state into a single local command.
    - >
      Its CNCF Sandbox status also matters: Homebrew formulae for CNCF-adjacent projects
      often become the fastest path for operators to try experimental infrastructure
      tools without committing to a cluster add-on first.
  project-history:
    - >
      The public GitHub repository was created in March 2023 under the k8sgpt-ai
      organization. The project describes itself as a tool for scanning Kubernetes
      clusters, diagnosing and triaging issues in simple English, with analyzers that
      encode SRE experience.
    - >
      K8sGPT moved quickly from a standalone CLI idea into a broader cloud-native
      project surface. The documentation covers getting started flows, integrations, and
      operator-style use, while the repository and project site present the tool as a
      Kubernetes-first assistant rather than a general chatbot wrapper.
  related-projects:
    - >
      K8sGPT belongs near kubectl, k9s, Lens, Prometheus, and Kubernetes operator
      tooling in a package taxonomy. Its related project surface includes the K8sGPT
      operator, Kubernetes analyzers, and AI provider integrations rather than
      Kafka-style data-plane tools.
  sources:
    - https://api.github.com/repos/k8sgpt-ai/k8sgpt
    - https://docs.k8sgpt.ai/
    - https://formulae.brew.sh/formula/k8sgpt
    - https://github.com/k8sgpt-ai/k8sgpt
    - https://github.com/k8sgpt-ai/k8sgpt/releases
    - https://www.cncf.io/projects/k8sgpt/
  summary:
    - >
      K8sGPT is a Kubernetes diagnostics CLI that combines cluster analysis with
      large-language-model backends, turning Kubernetes failure signals into
      plain-English explanations. In package-manager culture it sits at the meeting
      point of cloud-native operations and the 2023 wave of AI-assisted developer
      tooling.
  timeline:
    - '2023-03: Public GitHub repository created.'
    - '2023-04: Early v0.1.x and v0.2.x releases published.'
    - '2023-12-19: Accepted into the CNCF Sandbox.'
  usage:
    - >
      K8sGPT is commonly used as an interactive diagnostic layer for Kubernetes
      clusters. Users run the CLI against live cluster resources, review analyzer
      output, and optionally use configured AI providers to explain or triage the
      findings.
    - >
      Because its credentials and backend settings can live in the same user-level YAML
      configuration, the package has an operational security dimension: it is not just a
      read-only formatter, but a tool that may combine Kubernetes access with AI
      provider credentials.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      kubectl supplies the kubeconfig-centered Kubernetes access and general
      resource-management workflow that K8sGPT builds on with automated diagnosis and AI
      explanations.
    rel: adjacent_workflow
    sources:
      - https://github.com/k8sgpt-ai/k8sgpt/blob/main/SECURITY_SELF_ASSESSMENT.md
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:k9s
    reason: >
      Use K9s to interactively inspect and manage cluster resources, then K8sGPT when
      you want analyzer-driven fault detection and plain-language explanations for the
      same Kubernetes environment.
    rel: adjacent_workflow
    sources:
      - https://github.com/derailed/k9s
      - https://github.com/k8sgpt-ai/k8sgpt
