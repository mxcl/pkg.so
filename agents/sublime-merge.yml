id: cask:sublime-merge
display-name: Sublime Merge
repo: null
docs:
  - https://www.sublimemerge.com/docs
config-file-location:
  linux:
    - ~/.config/sublime-merge/Packages/User/
  macos:
    - ~/Library/Application Support/Sublime Merge/Packages/User/
  windows:
    - '%APPDATA%\Sublime Merge\Packages\User\'
credentials-file-location: null
history:
  adoption-history:
    - >
      Sublime Merge is distributed for macOS, Windows, and Linux and can be evaluated
      without an enforced time limit, with a paid license required for continued use.
      Official changelogs show sustained cross-platform releases since its 2018
      introduction.
    - >
      Its audience overlaps with Sublime Text users, but it is also designed as a
      standalone Git interface with its own command-line launcher, package directories,
      themes, menus, and workflow documentation.
  package-nerd-significance:
    - >
      Sublime Merge is notable for combining a proprietary desktop Git interface with a
      custom high-performance Git-reading library and Sublime's syntax-highlighting and
      theming machinery. It exposes enough file-based customization to interest users
      who manage dotfiles, while deliberately not offering Sublime Text's full plugin
      API.
    - >
      The application includes the smerge command-line tool and can be registered as a
      Git merge tool, making it useful in workflows that mix terminal Git with graphical
      history inspection, staging, and conflict resolution.
  project-history:
    - >
      Sublime HQ introduced Sublime Merge in September 2018 as a graphical Git client.
      Early releases rapidly added worktrees, submodules, Git Flow commands, commit
      editing, search, and platform integration.
    - >
      A substantial 2020 interface revision added repository and file tabs, GPU
      rendering, and a redesigned commit dialog. Later releases continued improving
      repository scanning, diff rendering, blame, worktrees, Git compatibility, and
      Wayland support.
  related-projects:
    - >
      Sublime Text supplies the related editor ecosystem and syntax definitions that
      Sublime Merge can load.
    - Git is the underlying distributed version-control system operated by the client.
    - >
      The open sublimehq/Packages repository contains syntax definitions, but is not the
      source repository for Sublime Merge itself.
  sources:
    - https://www.sublimemerge.com/
    - https://www.sublimemerge.com/docs/command_line
    - https://www.sublimemerge.com/docs/getting_started
    - https://www.sublimemerge.com/docs/packages
    - https://www.sublimemerge.com/download
  summary:
    - >
      Sublime Merge is Sublime HQ's cross-platform graphical Git client. It emphasizes
      fast repository navigation, precise staging, commit editing, search, code-aware
      diffs, and integrated conflict resolution.
  timeline:
    - '2018-09-20: The first public Sublime Merge build was welcomed in the official changelog.'
    - >
      2018: Early updates added worktrees, submodules, Git Flow, commit editing, and
      advanced search.
    - '2020: A redesigned interface introduced repository tabs, file tabs, and GPU rendering.'
    - >
      2023–2026: Releases continued improving performance, Git compatibility, worktrees,
      blame, and platform integration.
  usage:
    - >
      Developers use Sublime Merge to clone or initialize repositories, inspect commit
      graphs, stage files, hunks, or lines, create and edit commits, manage branches and
      remotes, search history, and resolve merge conflicts.
    - >
      The smerge command opens repositories and files from a shell and can act as Git's
      configured merge tool. User customization is stored in the platform-specific
      Packages/User directory.
tags:
