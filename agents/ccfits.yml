  - https://heasarc.gsfc.nasa.gov/docs/software/fitsio/ccfits/html/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package facts show CCfits packaged as a development library across
      Homebrew, Debian/Ubuntu, Fedora, MacPorts, Arch, and openSUSE. That adoption
      mirrors CFITSIO and FITS' role as common infrastructure in astronomical data
      processing.
  package-nerd-significance:
    - >
      CCfits is important to package maintainers because it is not a flashy CLI but a
      scientific development dependency. Keeping it packaged lets astronomy and
      high-energy astrophysics software build against a stable C++ abstraction over the
      long-lived FITS/CFITSIO stack.
  project-history:
    - >
      The official documentation says CCfits was written as part of a re-engineering
      effort for XSPEC, the X-Ray data analysis program. It was designed with Rational
      Rose, originally implemented on Solaris, and later ported to Windows 2000/VC++.net
      with contributions from named collaborators.
  related-projects:
    - The official documentation ties CCfits directly to CFITSIO, FITS, HEASARC, and XSPEC.
  sources:
    - https://heasarc.gsfc.nasa.gov/docs/software/fitsio/CCfits/
    - https://heasarc.gsfc.nasa.gov/docs/software/fitsio/ccfits
    - https://heasarc.gsfc.nasa.gov/docs/software/fitsio/ccfits/html/index.html
    - https://formulae.brew.sh/api/formula/ccfits.json
  summary:
    - >
      CCfits is NASA HEASARC's C++ wrapper library for CFITSIO, providing an
      object-oriented interface for manipulating FITS astronomy data files.
  timeline:
    - 'XSPEC re-engineering era: CCfits written as part of an XSPEC re-engineering effort.'
    - '2025: Official documentation lists CCfits version 2.7 and release notes for March 2025.'
  usage:
    - >
      CCfits users create FITS objects, open or create disk files, obtain HDU
      references, and manipulate data through higher-level C++ objects rather than
      making lower-level CFITSIO calls for each operation.
related-packages:
  - id: brew:cfitsio
    reason: >
      CCfits requires CFITSIO and wraps it for C++; use CFITSIO directly when a C or
      Fortran API, lower-level control, or its bundled FITS utilities are preferable.
    rel: adjacent_workflow
    sources:
      - https://heasarc.gsfc.nasa.gov/docs/software/fitsio/ccfits/
      - https://heasarc.gsfc.nasa.gov/docs/software/fitsio/fitsio.html
