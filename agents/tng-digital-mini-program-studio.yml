history:
  adoption-history:
    - >
      The studio is tied to the TNG Digital Mini Program Platform workflow: developers
      join a workspace, associate a project with a Mini Program, develop and debug
      locally, preview it on a real device, and upload it for testing and release.
    - >
      Its intended adopters are organizations and developers building sub-applications
      for wallet-style host applications. The platform reduces the need to ship separate
      native iOS and Android applications by using one mini-program project for both
      host environments.
  package-nerd-significance:
    - >
      Mini Program Studio packages a platform-specific JavaScript development stack,
      simulator, customized Chrome debugging tools, Git integration, and NPM dependency
      management into a desktop IDE. It illustrates the tooling ecosystems that form
      around embedded wallet mini-app platforms.
    - >
      For package users, the cask provides a repeatable installation path for an
      otherwise vendor-distributed IDE that participates in a larger authenticated
      publishing workflow.
  project-history:
    - >
      TNG Digital's Mini Program Studio was documented in 2021 as the desktop IDE for
      its Mini Program Development Platform. The platform uses web-oriented technologies
      and a domain-specific stack including JavaScript, AXML, and ACSS to build
      sub-applications hosted inside mobile wallet applications.
    - >
      The IDE was designed as a one-stop development tool covering project creation,
      editing, local simulation, debugging, real-device preview, upload, Git operations,
      and NPM package management.
  related-projects:
    - TNG Digital Mini Program Platform
    - Touch 'n Go eWallet
    - Alipay Mini Programs
    - JavaScript
