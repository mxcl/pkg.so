      https://miniprogram.tngdigital.com.my/docs/miniprogram_tngd/mpdev/developer-guide
    - 'Official documentation portal: https://miniprogram.tngdigital.com.my/docs/'
    - >
      Official interface guide:
      https://miniprogram.tngdigital.com.my/docs/miniprogram_tngd/mpdev/mini-program-studio_interface
  summary:
    - >
      TNG Digital Mini Program Studio is the desktop IDE for developing, debugging,
      previewing, and publishing Mini Programs on TNG Digital's platform.
  timeline:
    - >
      2021: The official documentation introduced Mini Program Studio and its integrated
      development workflow.
    - >
      2023: The official developer guide described the broader account, workspace, IDE,
      testing, and publishing workflow.
  usage:
    - >
      Developers create or open a Mini Program project, edit its JavaScript, AXML, ACSS,
      and configuration files, and run it in the integrated simulator. Customized Chrome
      developer tools provide source, network, storage, console, and layout debugging.
    - >
      The IDE supports real-device preview and remote debugging. After associating the
      project with an application, developers upload code to the Mini Program Platform
      for testing, approval, and release.
    - >
      The interface also exposes visual Git operations and NPM package management,
      although Mini Program runtime restrictions mean that browser DOM APIs and some
      Node.js-specific packages are unavailable.
