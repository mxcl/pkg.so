history:
  adoption-history:
    - >
      Bluepill found adoption among iOS teams that needed faster CI feedback without
      rewriting tests. The README explicitly documents Homebrew installation, release
      binaries, Fastlane plugin integrations, and a Bitrise build/test step, showing
      that usage spread through common mobile CI packaging channels.
    - >
      The surrounding ecosystem included Redpill and other Fastlane plugins, plus
      Bitrise support, which let teams wire Bluepill into existing build pipelines
      rather than treating it as a standalone experiment.
  package-nerd-significance:
    - >
      Bluepill is significant because it packages a hard local-platform problem:
      reproducible iOS simulator parallelism. For package nerds, it is a case study in a
      CLI wrapping Xcode artifacts, Simulator behavior, junit reporting, and CI
      integration into something installable with Homebrew.
    - >
      It also marks a particular era of iOS infrastructure, when teams combined xctool,
      FBSimulatorControl ideas, Fastlane plugins, and custom runners to make
      Apple-platform testing scale in CI.
  project-history:
    - >
      LinkedIn open-sourced Bluepill in January 2017 after building it to run its large
      iOS test suite in a reasonable amount of time. The README describes its core
      features: parallel simulator execution, automatic test grouping, headless mode,
      junit reports, retry behavior, and simulator crash or hang recovery.
    - >
      The project was originally published under LinkedIn's GitHub organization and
      later lives under MobileNativeFoundation. Its tags show a long 5.x release line,
      and the README tracks supported Xcode versions with branches for older Xcode
      releases.
  related-projects:
    - parallel_ios_tests inspired the project.
    - Facebook xctool and FBSimulatorControl are credited by the README as inspirations.
    - >
      Fastlane plugins such as Redpill, fastlane-plugin-bluepill, Bluepillar, and
      XBluepill integrated Bluepill into mobile release workflows.
    - Bitrise's Bluepill Build/Test for iOS step connected it to hosted CI.
  sources:
    - >
      https://engineering.linkedin.com/blog/2017/01/open-sourcing-bluepill--run-ios-tests-in-multiple-simulators
    - https://github.com/MobileNativeFoundation/bluepill#readme
    - https://github.com/MobileNativeFoundation/bluepill/releases
    - source_facts.package-manager
  summary:
    - >
      Bluepill is an iOS test runner created at LinkedIn to run large XCTest and UI-test
      suites across multiple simulators on one Mac. It became a recognizable package for
      iOS CI teams because it attacked the slow, flaky simulator-test problem before
      Apple's own parallel-test story was mature.
  timeline:
    - '2017: LinkedIn open-sourced Bluepill and published early v0.x tags.'
    - >
      2017: README credits inspiration from parallel_ios_tests, Facebook xctool, and
      FBSimulatorControl.
    - '2017-2018: Fastlane and Bitrise integrations appeared around the project ecosystem.'
    - >
      2024: Official repository metadata and tags show continued releases through the
      5.x line, including Xcode 15.1-era work.
  usage:
    - >
      A typical workflow builds an app and test bundle with xcodebuild
      build-for-testing, then invokes bluepill with the generated .xctestrun file and an
      output directory. The tool can also read a JSON configuration file via
      -c/--config, but the README documents this as a user-supplied file rather than a
      fixed config path.
    - >
      Operationally, Bluepill matters because it packs tests into simulator groups,
      controls retry behavior, collects junit output, and can run headless to reduce
      resource use on CI machines.
