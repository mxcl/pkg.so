id: brew:ldid-procursus
display-name: ldid-procursus
repo: null
docs:
  - https://github.com/ProcursusTeam/ldid#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is strongest in iOS, jailbreak, and Procursus packaging environments
      where Mach-O signing behavior is needed outside the standard Apple developer-tool
      path.
    - >
      Homebrew, MacPorts, and Nix entries make the Procursus ldid fork available to
      developers building or inspecting iOS-oriented packages from general-purpose
      Unix-like systems.
  package-nerd-significance:
    - >
      ldid-procursus is package-nerd significant because it packages a tool from a
      specialized platform subculture into mainstream package managers. The formula name
      also records fork provenance, which matters for tools with multiple historical
      lineages.
  project-history:
    - >
      ldid originated in the iPhoneOS jailbreak ecosystem as a lightweight alternative
      to Apple's codesign tooling for Mach-O binaries. The ProcursusTeam repository is
      the packaged fork used by the Procursus bootstrap and related packaging workflows.
    - >
      The public ProcursusTeam tag history reaches back to v1.0.363 on a July 2008
      commit and continues through later v1.x tags. The Homebrew formula name
      ldid-procursus distinguishes this fork/package from other ldid histories and
      ports.
  related-projects:
    - >
      Related projects include Apple's codesign tooling, Mach-O binary tooling,
      Procursus, and other iOS jailbreak packaging utilities.
  sources:
    - https://formulae.brew.sh/formula/ldid-procursus
    - https://github.com/ProcursusTeam/ldid
    - https://github.com/ProcursusTeam/ldid/releases/tag/v1.0.363
  summary:
    - >
      ldid-procursus packages the ProcursusTeam fork of ldid, a command-line tool for
      placing real or fake signatures in Mach-O binaries used in iOS and
      jailbreak-adjacent toolchains.
  timeline:
    - '2008-07: Early v1.0.363 tag appears in the ProcursusTeam ldid repository history.'
    - >
      2020s: ProcursusTeam maintains the ldid fork used by Procursus-oriented packaging
      workflows.
    - '2020s: Homebrew, MacPorts, and Nix distribute the package as ldid-procursus.'
  usage:
    - >
      Users run ldid or ldid2 to add signatures to Mach-O binaries, commonly for
      development, packaging, or jailbreak bootstrap workflows where Apple's codesign
      command is not the right fit.
related-packages:
  - id: brew:ldid
    reason: >
      Choose the original Cydia/saurik lineage for the minimal upstream tool; the
      Procursus fork adds documented conveniences including man pages, OpenSSL 3
      support, password-protected PKCS#12 keys, architecture names, and PKCS#11 loading.
    rel: alternative
    sources:
      - https://github.com/ProcursusTeam/ldid
      - https://cydia.saurik.com/info/ldid/
tags:
  - binary-tools
  - cli
  - code-signing
