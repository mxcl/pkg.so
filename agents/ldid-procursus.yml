  history-sources:
    - https://formulae.brew.sh/formula/ldid-procursus
    - https://github.com/ProcursusTeam/ldid
    - https://github.com/ProcursusTeam/ldid/releases/tag/v1.0.363
  repo-sources:
    - source_facts.repo is already populated, so repo is null per batch rule.
  tags-sources:
    - Official README mentions signatures, p12 keys, PKCS#11, and architecture flags.
