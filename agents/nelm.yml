history:
  adoption-history:
    - >
      Nelm's adoption story is anchored in werf. On 2024-04-29, werf announced v2.0 with
      Nelm as the default and only deployment engine, while maintaining backward
      compatibility with Helm charts so users generally did not need to change charts to
      keep deploying.
    - >
      The Nelm README says it is production-ready because, as werf's deployment engine,
      it had been battle-tested across thousands of projects for years. The GitHub API
      showed 1,089 stars and 28 forks on 2026-07-01, and Homebrew showed 680 installs
      over 365 days, 91 over 90 days, and 59 over 30 days when checked the same day.
  package-nerd-significance:
    - >
      Nelm is significant because it is a rare attempt to improve Helm deployment
      semantics while staying compatible with Helm charts and releases. For Kubernetes
      packaging people, that places it in the high-friction zone between ubiquitous Helm
      chart packaging and the operational needs of safer, more observable deploys.
  project-history:
    - >
      The Nelm repository was created on 2023-12-29. The werf team had already
      introduced the new deployment engine experimentally in werf v1.2.234 on
      2023-05-25, then named it Nelm in a 2024-01-30 update and said they planned to
      make it available as a standalone CLI.
    - >
      The werf blog says the separate Nelm project began at the end of December 2023
      because some users wanted the deployment part of werf without image building and
      cleanup. The same post says Nelm 1.0 made that Helm-chart-compatible deployment
      engine available as an open-source CLI.
  related-projects:
    - werf
    - Helm
    - Kubernetes
    - Server-Side Apply
  sources:
    - https://api.github.com/repos/werf/nelm
    - https://blog.werf.io/nelm-cli-helm-compatible-alternative-5648b191f0af
    - https://formulae.brew.sh/formula/nelm
    - https://github.com/werf/nelm
    - https://github.com/werf/nelm/discussions/397
    - https://github.com/werf/werf/discussions/5657
    - https://github.com/werf/werf/discussions/6100
  summary:
    - >
      Nelm is werf's Helm-compatible Kubernetes deployment engine and standalone CLI. It
      manages Helm charts and releases while adding features such as Server-Side Apply,
      plan-like previews, improved CRD handling, secrets management, resource ordering,
      and more detailed deployment tracking.
  timeline:
    - '2023-05-25: werf announced an experimental new deployment engine in v1.2.234.'
    - '2023-12-29: Public Nelm GitHub repository created.'
    - >
      2024-01-30: werf maintainers identified the new engine's official name as Nelm and
      planned a standalone CLI.
    - '2024-04-29: werf v2.0 made Nelm the default and only deployment engine.'
    - '2025-08-12: Nelm maintainers summarized features added across v1.1.0 through v1.11.0.'
    - '2026-07-01: Homebrew formula stable version observed as 1.25.2.'
  usage:
    - >
      Users install `nelm` to deploy local Helm-compatible charts to Kubernetes,
      especially when they want Helm chart compatibility plus stronger deployment
      behavior: Server-Side Apply, resource plan output, CRD upgrade handling, secret
      support, resource readiness tracking, and detailed logs/events during deployment.
    - >
      Package nerds evaluate Nelm as a Helm alternative rather than a chart format
      replacement. A practical migration path is attractive because it preserves Helm
      charts and releases while swapping the deployment engine underneath, similar to
      how werf v2 moved its users onto Nelm by default.
related-packages:
  - id: brew:helm
    reason: >
      Choose Helm for the established Kubernetes package-manager CLI and plugin
      ecosystem; choose Nelm when you want compatible charts and releases plus
      Server-Side Apply planning, richer tracking, and advanced lifecycle controls.
    rel: alternative
    sources:
      - https://github.com/werf/nelm
      - https://helm.sh/docs/
  - id: brew:werf
    reason: >
      Use werf when you want Nelm's deployment engine integrated with container-image
      building, publishing, cleanup, and a broader Kubernetes delivery workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/werf/nelm
      - https://werf.io/docs/latest/usage/deploy/overview.html
      - https://github.com/werf/werf
