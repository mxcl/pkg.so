history:
  adoption-history:
    - >
      Spundle has remained a specialist freeware utility rather than a mass-market
      storage product. Successive releases expanded filesystem and macOS compatibility
      while retaining its narrow focus on sparse-bundle management.
    - >
      The application evolved to support encryption, custom band sizes, band-size
      changes, and newer APFS variants in addition to its original create, resize, and
      compact workflow.
  package-nerd-significance:
    - >
      Spundle provides a graphical wrapper around difficult hdiutil operations, making
      an advanced macOS disk-image feature accessible without reproducing complex
      command lines.
    - >
      For package-manager users it is a characteristically Mac-specific utility: small,
      independently distributed, and closely tied to APFS, HFS+, sparse bundles, and
      backup workflows.
  project-history:
    - >
      Howard Oakley introduced Spundle in May 2020 as a single-window macOS wrapper for
      three hdiutil sparse-bundle functions: creation, resizing, and compaction. The
      initial interface exposed maximum size, filesystem, and band-size controls.
    - >
      Later releases added encrypted sparse-bundle creation, broader filesystem choices,
      band-size changes, case-sensitive APFS support, and compatibility with newer macOS
      releases.
  related-projects:
    - hdiutil is the underlying macOS command-line disk-image utility wrapped by Spundle.
    - APFS and HFS+ are principal filesystems used inside macOS sparse bundles.
    - >
      Time Machine and other backup workflows can use sparse bundles and may benefit
      from deliberate maximum-size and band-size choices.
  sources:
    - >
      https://eclecticlight.co/2020/05/18/spundle-a-new-utility-for-creating-and-adjusting-sparse-bundles/
    - >
      https://eclecticlight.co/2023/12/04/spundle-1-8-adds-support-for-case-sensitive-apfs-sparse-bundles/
    - https://eclecticlight.co/dintch/
  summary:
    - >
      Spundle is a freeware macOS utility for creating, resizing, and compacting
      sparse-bundle disk images. It exposes filesystem, maximum-size, encryption, and
      band-size choices through a graphical interface.
  timeline:
    - >
      2020: Spundle is introduced as a graphical utility for creating, resizing, and
      compacting sparse bundles.
    - '2023: Spundle adds support for case-sensitive APFS sparse bundles.'
    - >
      Later releases: Compatibility expands to newer macOS generations and additional
      sparse-bundle operations.
  usage:
    - >
      Users select a maximum size, filesystem, and optional custom band size to create a
      sparse bundle, or open an existing bundle to resize or compact it. Encryption is
      available for newly created bundles.
    - >
      Compaction reclaims unused host-storage space from a sparse bundle. The developer
      notes that some encrypted-bundle operations have version-specific limitations.
