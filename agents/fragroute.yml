history:
  adoption-history:
    - >
      fragroute's official page documented builds on OpenBSD, FreeBSD, Linux, Solaris,
      and Windows 2000, with dependencies on libdnet, libpcap, libevent, and platform
      tunnel drivers. The bundled scripts include notes for attacks reported against
      Snort 1.8.3 in January 2002, anchoring the tool in IDS regression testing
      practice.
  package-nerd-significance:
    - >
      For package-history purposes, fragroute is significant because it is a tarball-era
      security utility that remains packaged long after its original homepage workflow.
      It preserves a specific moment in IDS testing, before many tools moved to GitHub
      and before network evasion testing became a routine part of security lab
      distributions.
  project-history:
    - >
      The official homepage describes fragroute as an implementation of most attacks
      from the January 1998 Secure Networks paper on eluding network intrusion
      detection. The bundled license covers 2001 and 2002, and the 1.2 source archive
      contains README and manpage files dated April 2002.
    - >
      The project belongs to the same early-2000s packet-manipulation culture as libdnet
      and libpcap-based security tools. Its author page distributed source tarballs and
      plain-text manpages rather than a modern public source-control repository.
  related-projects:
    - >
      Official dependencies and related tools named by the project include libdnet,
      libpcap, libevent, fragtest, Snort test scripts, CIPE-Win32, and TUN/TAP drivers.
      The manpage contrasts fragroute with fragrouter by noting that fragroute affects
      only local outbound traffic.
  sources:
    - https://www.monkey.org/~dugsong/fragroute
    - https://www.monkey.org/~dugsong/fragroute/fragroute-1.2.tar.gz
    - https://www.monkey.org/~dugsong/fragroute/fragroute.8.txt
    - https://www.monkey.org/~dugsong/fragroute/fragtest.8.txt
  summary:
    - >
      fragroute is a classic network-security test tool by Dug Song for intercepting,
      modifying, and rewriting outbound traffic to a target host. Its purpose is to
      reproduce insertion, evasion, and denial-of-service techniques against
      intrusion-detection systems and TCP/IP stacks in a controlled test setting.
  timeline:
    - >
      1998: Secure Networks paper on insertion, evasion, and denial-of-service attacks
      provides the attack taxonomy fragroute implements.
    - '2001: Copyright period begins for the fragroute source distribution.'
    - >
      2002: fragroute 1.2 source archive, README, manpage, and Snort test notes dated
      April 2002.
    - '2002: Bundled notes document attacks against Snort 1.8.3 reported January 28, 2002.'
  usage:
    - >
      The fragroute executable reads a ruleset and a target host, then applies
      directives such as delay, duplicate, drop, fragment, overlap, print, reorder,
      segment, source-route, TTL, and TOS changes to outbound packets. fragtest
      complements it by probing a remote host's IP fragment reassembly behavior.
