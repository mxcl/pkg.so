history:
  adoption-history:
    - >
      NameChanger has remained a macOS-specific utility across many operating-system
      generations. Its official archive offers editions compatible with systems from Mac
      OS X Panther onward, while the supplied metadata records distribution through
      Homebrew Cask.
  package-nerd-significance:
    - >
      NameChanger is representative of the small, single-purpose macOS utilities
      commonly installed through cask repositories: it exposes batch operations that
      would otherwise require shell scripts or repeated Finder edits, while retaining a
      native graphical workflow.
  project-history:
    - >
      MRR Software developed NameChanger around the single task of previewing and
      applying batch filename transformations. Successive generations added rename
      history, case conversion, custom date formats, regular expressions,
      text-file-driven renaming, recursive folder handling, and Finder Services
      integration.
  related-projects:
    - >
      NameChanger overlaps with command-line batch-renaming tools and Finder automation,
      but presents its transformations as a previewable native macOS workflow.
  sources:
    - https://mrrsoftware.com/namechanger/
    - 'input: source_facts.package-manager.brew-cask'
  summary:
    - >
      NameChanger is a free macOS batch-renaming utility from MRR Software. It previews
      filename transformations before applying them and supports replacement, wildcard,
      sequence, date, regular-expression, case, append, prepend, and character-removal
      operations.
  timeline:
    - The earliest archived edition on the official page supported Mac OS X 10.3 Panther.
    - >
      Version 3.0 introduced rename history, case conversion, a redesigned interface,
      Finder Services integration, and additional date and ordering controls.
    - >
      Later releases added text-file-driven renaming, improved large and remote batch
      handling, recursive folder input, and character insertion.
  usage:
    - >
      Users drag files into the application, select a transformation, inspect the live
      preview, and execute the rename. Advanced options can preserve extensions, ignore
      case, force unique results, and apply operations only to checked subsets.
