id: brew:extract_url
display-name: extract_url.pl
repo: null
docs:
  - https://github.com/m3m0ryh0l3/extracturl/blob/master/README
  - http://www.memoryhole.net/~kyle/extract_url
config-file-location:
  unix:
    - ~/.extract_urlview
    - ~/.urlview
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package metadata lists Homebrew and Nix packages. The official
      homepage also notes packaging-oriented changes such as a distribution-friendly
      package layout in the 1.5.7 release history.
  package-nerd-significance:
    - >
      extract_url.pl is a classic small Unix email helper: it composes through pipes,
      integrates with mutt, has a dotfile configuration path, and fills gaps in older
      URL selectors around MIME, quoted-printable, duplicate URLs, and shell-safe URL
      handling.
  project-history:
    - >
      The official homepage documents version 1.6.1 and says the source repository moved
      from Google Code to GitHub. The GitHub repository description records it as
      automatically exported from code.google.com/p/extracturl.
  related-projects:
    - The official homepage compares extract_url.pl with urlview and urlscan.
    - >
      The documented workflow is primarily tied to mutt, while optional Perl modules
      such as URI::Find and Curses::UI broaden URL detection and interface behavior.
  sources:
    - http://www.memoryhole.net/~kyle/extract_url/
    - https://github.com/m3m0ryh0l3/extracturl/blob/master/NEWS
    - https://github.com/m3m0ryh0l3/extracturl/blob/master/README
    - https://github.com/m3m0ryh0l3/extracturl/blob/master/extract_urlview.sample
    - source_facts.package-manager
  summary:
    - >
      extract_url.pl is a Perl utility that extracts URLs from MIME email messages or
      plain text, designed especially for use with the mutt email client and as a
      replacement or pre-parser for urlview.
  timeline:
    - '2008: Official NEWS records 1.3.x and 1.4 releases.'
    - '2009: Official NEWS records 1.5 release.'
    - '2013: Official NEWS records distribution-friendly packaging work in 1.5.7.'
    - '2015: GitHub repository was created from the former Google Code project.'
    - >
      2017: Official NEWS records 1.6.2 with dependency-location fixes and ALTSELECT
      default change.
  usage:
    - >
      The homepage documents piping email through extract_url.pl, using it with urlview,
      invoking it on message files, and configuring mutt macros. It also documents
      options for help, man output, list mode, plain-text mode, quoted-printable
      decoding, config file selection, and version output.
related-packages:
  - id: brew:urlscan
    reason: >
      Choose urlscan for a more polished terminal selection interface; extract_url.pl's
      official comparison says urlscan improves on urlview's interface while
      extract_url.pl better reconstructs some MIME format=flowed URLs.
    rel: alternative
    sources:
      - https://www.memoryhole.net/~kyle/extract_url/
      - https://github.com/firecat53/urlscan#readme
  - id: brew:urlview
    reason: >
      Use urlview as the simpler curses URL launcher, or pipe extract_url.pl into it
      when you want extract_url.pl's MIME repair followed by urlview's selector.
    rel: alternative
    sources:
      - https://www.memoryhole.net/~kyle/extract_url/
      - https://github.com/sigpipe/urlview#readme
  - id: brew:mutt
    reason: >
      Mutt can pipe the current email into extract_url.pl through the officially
      documented macros, including variants for encrypted messages.
    rel: adjacent_workflow
    sources:
      - https://www.memoryhole.net/~kyle/extract_url/
      - https://www.mutt.org/doc/manual/
tags:
  - cli
  - email
  - mutt
  - perl
  - text-processing
  - url-extraction
