history:
  project-history:
    - >
      MoarVM's technical identity comes from Raku's implementation demands. The project
      README lists the runtime features expected by Rakudo and NQP: Unicode-aware
      strings, precise generational parallel garbage collection, closures,
      continuations, serialization, native calling, async IO, threads, bytecode
      specialization, inlining, on-stack replacement, scalar replacement, partial escape
      analysis, JIT compilation, profiling, heap snapshots, and remote debugging.
      Worthington's decade-retrospective slides describe the early implementation as a
      simple bytecode interpreter written in C, with later additions such as type
      specialization, JIT compilation, and a more advanced dispatch mechanism.
  sources:
    - https://6guts.wordpress.com/2013/05/31/moarvm-a-virtual-machine-for-nqp-and-rakudo/
    - https://formulae.brew.sh/formula/moarvm
    - https://github.com/MoarVM/MoarVM
    - https://github.com/rakudo/rakudo
    - https://jnthn.net/papers/2021-vmil-moarvm-reflections.pdf
    - https://www.moarvm.org/
  summary:
    - >
      MoarVM, short for Metamodel On A Runtime Virtual Machine, is a virtual machine
      built for the 6model object system and primarily aimed at NQP and Rakudo, the main
      Raku compiler. Jonathan Worthington publicly introduced the project in May 2013,
      explaining that a small team had been building a runtime around the 6model object
      system as another backend for Perl 6/Raku, alongside JVM work and the older Parrot
      backend. The initial goals were practical: a lightweight VM focused on Rakudo's
      needs, native support for 6model, a quick build, and a path to exploring JIT
      compilation.
  usage:
    - >
      In the package ecosystem, MoarVM is usually installed as part of a Raku toolchain
      rather than used directly by application developers. The Homebrew formula exposes
      the `moar` executable and runtime libraries, while Rakudo can be built against
      MoarVM or generate it during its own build. MoarVM's own site describes it as the
      VM used by the majority of Raku programmers, placing it as the dominant native
      runtime for Raku code, with JVM and JavaScript serving as alternative backends in
      the broader Rakudo ecosystem.
related-packages:
  - id: brew:rakudo
    reason: >
      Rakudo is the Raku compiler that runs on MoarVM, so install it when the goal is to
      execute or develop Raku programs rather than work directly on the VM.
    rel: adjacent_workflow
    sources:
      - https://github.com/MoarVM/MoarVM
      - https://github.com/rakudo/rakudo
  - id: brew:rakudo-star
    reason: >
      Rakudo Star supplies a fuller Raku distribution around the compiler and runtime
      stack, making it the batteries-included choice rather than a low-level MoarVM
      installation.
    rel: adjacent_workflow
    sources:
      - https://www.moarvm.org/
      - https://rakudo.org/star
