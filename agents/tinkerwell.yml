id: cask:tinkerwell
display-name: Tinkerwell
repo: null
docs:
  - https://tinkerwell.app/docs
  - https://tinkerwell.app/docs/3/setup-guides/ssh
  - https://tinkerwell.app/docs/4/getting-started/settings
config-file-location:
  linux:
    - /home/<Username>/.config/Tinkerwell/vuex.json
  macos:
    - /Users/<Username>/Library/Application Support/Tinkerwell/vuex.json
  windows:
    - C:\Users\<Username>\AppData\Roaming\Tinkerwell\vuex.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Tinkerwell is aimed at PHP and Laravel developers who want a richer desktop
      counterpart to framework tinker shells and command-line REPLs. Support for Laravel
      Forge, SSH, Docker, Kubernetes, IDE integration, and multiple local PHP runtimes
      extended it from quick experiments to remote application debugging.
    - >
      Its commercial desktop distribution and Homebrew cask provide a ready-to-run
      environment without making users assemble editor, REPL, and remote-connection
      components themselves.
  package-nerd-significance:
    - >
      Tinkerwell packages an interactive language workbench as a desktop application. It
      is of interest to package-oriented developers because it bridges local runtime
      discovery with SSH agents, containers, Kubernetes contexts, Laravel tooling, and
      API-backed code generation.
    - >
      Its troubleshooting documentation explicitly identifies the per-user data
      directory and vuex.json settings file, which helps with backup, migration, and
      clean-reset workflows.
  project-history:
    - >
      Tinkerwell was developed as a desktop code runner and tinker tool for PHP, with
      particularly close integration into the Laravel ecosystem. It combines an editor,
      interactive evaluation, autocompletion, structured output, snippets, and remote
      execution.
    - >
      Later releases expanded execution targets and integrations to include SSH servers,
      Laravel Forge sites, Docker environments, Kubernetes clusters, IDE workflows, and
      optional AI code generation.
  related-projects:
    - PHP
    - Laravel
    - Laravel Tinker
    - Laravel Forge
    - Docker
    - Kubernetes
    - PhpStorm
  sources:
    - 'Official documentation: https://tinkerwell.app/docs/'
    - >
      Official installation documentation:
      https://tinkerwell.app/docs/3/getting-started/installation
    - 'Official product site: https://tinkerwell.app/'
    - 'Official settings documentation: https://tinkerwell.app/docs/4/getting-started/settings'
    - >
      Official troubleshooting documentation:
      https://tinkerwell.app/docs/3/troubleshooting/troubleshooting
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Tinkerwell is a commercial desktop PHP code runner and REPL-oriented development
      workbench with Laravel and remote-runtime integrations.
  timeline:
    - >
      Initial era: Tinkerwell launched as a desktop tinker tool for PHP and Laravel
      developers.
    - >
      Later releases: Remote SSH, Docker, Kubernetes, Laravel Forge, IDE, and
      AI-assisted workflows broadened its scope.
    - '2026: The supplied Homebrew cask distributed Tinkerwell 5.17.3 for Apple silicon.'
  usage:
    - >
      Use Tinkerwell to evaluate PHP snippets against a local application or a selected
      remote runtime, inspect results, test framework behavior, and save reusable
      snippets. Auto-evaluation should be disabled for code with potentially
      consequential side effects such as database mutations.
    - >
      Remote connections can use explicit SSH keys or a configured SSH agent. Advanced
      settings accept Laravel Forge and OpenAI API keys, but the official documentation
      does not identify a separate credentials file.
    - >
      For backup or troubleshooting, preserve or reset the documented Tinkerwell data
      directory. The vuex.json file stores application settings, while the surrounding
      directory also contains connections and caches.
