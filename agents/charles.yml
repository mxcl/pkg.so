history:
  adoption-history:
    - >
      Charles grew from a basic Java HTTP proxy into a cross-platform debugging
      environment with automatic system-proxy configuration, SSL interception,
      breakpoints, throttling, rewriting, mapping, reverse proxies, and
      protocol-specific viewers.
    - >
      Official documentation now covers desktop browsers, mobile devices, emulators,
      command-line clients, and headless operation, reflecting adoption across web and
      mobile development workflows.
  package-nerd-significance:
    - >
      Charles is a veteran GUI network-debugging package whose history predates many
      modern browser developer tools. It remains useful when traffic must be observed or
      modified outside a single browser process, including native apps and mobile
      devices.
    - >
      Package users value its cross-platform Java lineage, stable session format,
      system-proxy automation, SSL certificate workflow, and portable -config option for
      selecting a non-default configuration file.
  project-history:
    - >
      Charles 1.0 received its initial public release sometime in 2002. Early releases
      added CSV export, reverse proxying, SSL interception, HTTP/1.1, and automatically
      generated certificates.
    - >
      Version 2 expanded automatic proxy configuration and added tools for rewriting,
      throttling, SOCKS, Flash Remoting, JSON, XML, and SOAP traffic.
    - >
      Version 3 added request editing and replay, mapping tools, a web control
      interface, transparent proxying, headless operation, and an explicit per-site
      SSL-proxying model. Subsequent releases continued adapting Charles to newer HTTP,
      TLS, operating-system, browser, and mobile-development environments.
  related-projects:
    - >
      Browser developer tools overlap with Charles for inspecting web traffic but
      generally remain scoped to their browser.
    - >
      Wireshark and tcpdump provide lower-level packet capture; Charles can import
      packet captures but focuses on application-layer HTTP debugging.
    - >
      Fiddler and mitmproxy occupy related interactive HTTP-proxy and
      traffic-manipulation niches.
  sources:
    - >
      https://www.charlesproxy.com/documentation/configuration/browser-and-system-configuration/
    - https://www.charlesproxy.com/documentation/getting-started/
    - https://www.charlesproxy.com/documentation/using-charles/command-line-options/
    - https://www.charlesproxy.com/documentation/version-history/
    - https://www.charlesproxy.com/documentation/version-history/old-versions/
  summary:
    - >
      Charles is a cross-platform web-debugging proxy that records HTTP and HTTPS
      exchanges and lets developers inspect, replay, throttle, map, rewrite, or
      interrupt application traffic.
  timeline:
    - '2002: Charles 1.0 receives its initial public release.'
    - '2003: SSL interception and HTTP/1.1 support arrive in the 1.x series.'
    - '2005: Charles 2.0 introduces a major tool and interface overhaul.'
    - '2007: Charles 3.0 adds request editing, replay, charts, and mapping tools.'
    - >
      2009: Charles 3.4 makes SSL proxying opt-in per site and adds headless
      configuration support.
  usage:
    - >
      A developer runs Charles locally and configures a browser, operating system,
      mobile device, emulator, or application to use its HTTP or SOCKS proxy, normally
      on port 8888. Recorded requests and responses can then be inspected and
      manipulated.
    - >
      HTTPS inspection requires clients to trust the Charles root certificate and SSL
      Proxying to be enabled for the relevant locations. The default configuration can
      be replaced with an explicit path using the -config command-line option.
