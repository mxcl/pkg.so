id: brew:igv
display-name: Integrative Genomics Viewer
repo: https://github.com/igvteam/igv
docs:
  - https://igv.org/doc/desktop
config-file-location:
  unix:
    - ~/igv/prefs.properties
credentials-file-location: null
history:
  adoption-history:
    - >
      IGV's adoption is unusually strong for a desktop scientific package because it
      became both a research citation target and a practical review tool. The docs
      explicitly tell researchers how to cite IGV, and the project site lists follow-on
      publications including variant review and igv.js.
  package-nerd-significance:
    - >
      IGV is package-nerd interesting because it is a heavyweight scientific GUI shipped
      through developer package managers. It crosses desktop launchers, Java runtime
      bundling, genomics file formats, command-line helper tools, and citation-grade
      scientific reproducibility.
  project-history:
    - >
      IGV originated at the Broad Institute as a response to the growing size and
      heterogeneity of genomic datasets. The 2011 Nature Biotechnology paper introduced
      IGV as a tool for integrated visual exploration, and the 2013 Briefings in
      Bioinformatics paper described it as a high-performance viewer for large
      heterogeneous genomics data.
    - >
      The desktop application later became one member of a broader IGV family. The
      official desktop docs list the original Java desktop application, IGV-Web, and
      igv.js as related forms, while the GitHub README identifies the desktop repository
      as the Mac, Windows, and Linux application.
  related-projects:
    - >
      Related IGV projects include IGV-Web, igv.js, igv-notebook, and igvtools. In
      package-manager terms, IGV also sits near bioinformatics tools that produce or
      transform BAM/CRAM, VCF, BED, and genome annotation files.
  sources:
    - https://academic.oup.com/bib/article/14/2/178/208453
    - https://github.com/igvteam/igv
    - https://igv.org/
    - https://igv.org/doc/desktop/
    - https://www.nature.com/articles/nbt.1754
  summary:
    - >
      The Integrative Genomics Viewer is a desktop genome visualization tool for
      interactively exploring large genomic datasets, annotations, alignments, and
      metadata across local, public, and cloud-hosted sources.
  timeline:
    - '2011: Nature Biotechnology paper introduced Integrative Genomics Viewer.'
    - '2012: Public GitHub repository created for the desktop application.'
    - >
      2013: Briefings in Bioinformatics article described high-performance genomics data
      visualization and exploration with IGV.
    - '2017: Cancer Research article documented IGV use in variant review.'
    - '2023: igv.js publication documented an embeddable JavaScript implementation of IGV.'
  usage:
    - >
      Desktop IGV is used to load genome references and inspect aligned reads, variants,
      annotations, expression data, and other genomics tracks. The Homebrew package
      exposes both `igv` and `igvtools`, reflecting the split between interactive
      visualization and command-line data preparation.
related-packages:
  - id: brew:samtools
    reason: >
      Use SAMtools to inspect, sort, convert, and index SAM/BAM/CRAM alignment data
      before loading those indexed alignments into IGV for visual review.
    rel: adjacent_workflow
    sources:
      - https://www.htslib.org/doc/samtools.html
      - https://igv.org/doc/desktop/UserGuide/tracks/alignments/
  - id: brew:bcftools
    reason: >
      Use BCFtools to call, filter, normalize, and query VCF/BCF variants, then load the
      resulting variant files into IGV alongside supporting reads.
    rel: adjacent_workflow
    sources:
      - https://samtools.github.io/bcftools/bcftools.html
      - https://igv.org/doc/desktop/UserGuide/tracks/variants/
  - id: brew:bedtools
    reason: >
      Use BEDTools to derive, intersect, or summarize genomic intervals and load the
      resulting BED-compatible tracks into IGV for contextual visualization.
    rel: adjacent_workflow
    sources:
      - https://bedtools.readthedocs.io/en/latest/
      - https://igv.org/doc/desktop/FileFormats/DataTracks/
