id: brew:lua
display-name: Lua
repo: https://github.com/lua/lua
docs:
  - https://www.lua.org/manual
  - https://www.lua.org/manual/5.5
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Lua's adoption has been driven by embedding. The official manual describes using C
      functions to extend Lua into domain-specific languages, and the official readme
      says Lua is used in many products and projects around the world. Its small C
      implementation made it popular in games, applications, embedded systems, network
      software, and tools that need a scripting layer.
    - >
      Package managers package Lua both as a current interpreter and as versioned
      formulas because ABI and language-version differences matter. The supplied
      package-manager facts show broad distribution across Homebrew, apk, Chocolatey,
      dnf, MacPorts, Nix, pacman, Scoop, winget, and zypper, while separate packages
      such as lua@5.4 preserve older minor series for applications and libraries that
      cannot jump runtime versions.
  package-nerd-significance:
    - >
      Lua is a package-manager staple because it is simultaneously a user-facing
      scripting language, an embeddable C library, and the dependency underneath many
      other tools. Package nerds care about which minor series a formula installs, how
      executable names are versioned, whether luac is included, and how Lua modules find
      the matching runtime.
  project-history:
    - >
      Lua was created in 1993 at PUC-Rio as an extension and configuration language.
      Official Lua history material frames its evolution from a simple in-house
      configuration language into a widely used embeddable language with tables, lexical
      scoping, closures, coroutines, and a small portable C implementation.
    - >
      The official reference manual emphasizes Lua's dual identity: it is both a
      standalone interpreter and a library designed to be embedded in host programs.
      This design made Lua attractive for applications that wanted scripting without
      carrying a large runtime. The distribution is source-first, written in clean C,
      and builds on common Unix-like platforms with a small Makefile-driven process.
    - >
      Lua 5.x shaped the package-manager era of Lua. Lua 5.1 became historically
      important because LuaJIT targets the 5.1 language family; Lua 5.2, 5.3, 5.4, and
      5.5 continued the standard interpreter line with API and virtual-machine changes.
      The official version history records Lua 5.5.0 released on 22 Dec 2025 with
      global-variable declarations, named vararg tables, more compact arrays, and
      incremental major garbage collections.
  related-projects:
    - LuaJIT is a major alternative implementation associated with Lua 5.1 compatibility.
    - >
      LuaRocks is the common Lua module package manager used alongside distribution Lua
      packages.
    - >
      LuaLS and Luacheck are developer tools in the Lua ecosystem that depend on Lua
      language semantics.
    - >
      PUC-Rio and Lua.org are the official institutional and project homes for the
      reference implementation.
  sources:
    - https://raw.githubusercontent.com/lua/lua/master/README.md
    - https://www.lua.org/history.html
    - https://www.lua.org/manual/5.5/manual.html
    - https://www.lua.org/manual/5.5/readme.html
    - https://www.lua.org/versions.html
    - source_facts.package-manager
  summary:
    - >
      Lua is a lightweight, embeddable scripting language developed at PUC-Rio in
      Brazil. The Homebrew lua package represents the mainline Lua runtime and compiler,
      exposing the lua interpreter and luac compiler for interactive use, scripting,
      embedding, and bytecode compilation.
  timeline:
    - '1993: Lua was born at PUC-Rio in Brazil.'
    - >
      2000: Lua 4.0 was released, closing the era covered by the first official HOPL
      history paper.
    - >
      2015: Lua 5.3 introduced integers, bitwise operators, a basic UTF-8 library, and
      32/64-bit support.
    - >
      2020: Lua 5.4 introduced a new generational garbage collector mode and
      const/to-be-closed variables.
    - >
      2025: Lua 5.5.0 was released with global-variable declarations and other
      language/runtime changes.
  usage:
    - >
      Users run lua for interactive or batch scripts, run luac to compile Lua chunks, or
      embed liblua in a host application. Lua programs often use LuaRocks or
      distribution packages for modules, but the core runtime itself does not use a
      project-level config file or credentials file.
    - >
      For packagers, the important usage detail is that different Lua minor versions are
      not ABI compatible. The official version history states that different versions
      can have different APIs and virtual machines, so applications embedding Lua and C
      libraries for Lua must be rebuilt for a new version.
related-packages:
  - id: brew:luajit
    reason: >
      Choose LuaJIT when Lua 5.1 compatibility, high execution speed, or its FFI is more
      important than following the current reference-Lua language line.
    rel: alternative
    sources:
      - https://luajit.org/luajit.html
      - https://luajit.org/extensions.html
      - https://www.lua.org/versions.html
  - id: brew:lua@5.4
    reason: >
      Choose the versioned Lua 5.4 formula when an embedded application or native module
      requires the 5.4 API, ABI, or virtual machine instead of current Lua.
    rel: alternative
    sources:
      - https://www.lua.org/versions.html
      - https://www.lua.org/manual/5.4/
  - id: brew:luarocks
    reason: >
      Use LuaRocks alongside Lua to discover and install version-compatible Lua modules
      and their dependencies.
    rel: adjacent_workflow
    sources:
      - https://luarocks.org/docs
      - https://luarocks.org/about
  - id: brew:lua-language-server
    reason: >
      Use Lua Language Server with Lua projects for completion, navigation, diagnostics,
      annotations, formatting, and configurable runtime-version awareness.
    rel: adjacent_workflow
    sources:
      - https://luals.github.io/
      - https://luals.github.io/wiki/configuration/
  - id: brew:luacheck
    reason: >
      Use Luacheck in Lua command-line and CI workflows to detect undefined globals,
      unused variables, syntax errors, and other static-analysis issues.
    rel: adjacent_workflow
    sources:
      - https://github.com/lunarmodules/luacheck
      - https://luacheck.readthedocs.io/en/stable/
