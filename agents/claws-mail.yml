id: brew:claws-mail
display-name: Claws Mail
repo: https://git.claws-mail.org/?p=claws.git%3Ba%3Dsummary
docs:
  - https://www.claws-mail.org/manual/claws-mail-manual.html
  - https://www.claws-mail.org/faq/index.php/Installation_and_Configuration
config-file-location:
  unix:
    - ~/.claws-mail/clawsrc
    - ~/.claws-mail/accountrc
    - ~/.claws-mail/actionsrc
    - ~/.claws-mail/customheaderrc
    - ~/.claws-mail/dispheaderrc
    - ~/.claws-mail/folderitemrc
    - ~/.claws-mail/folderlist.xml
    - ~/.claws-mail/matcherrc
    - ~/.claws-mail/menurc
    - ~/.claws-mail/addrbook/addrbook-*.xml
credentials-file-location:
  unix:
    - ~/.claws-mail/passwordstorerc
    - ~/.claws-mail/oauth2rc
history:
  adoption-history:
    - >
      The package has broad distribution coverage across Unix-like and Windows package
      ecosystems. The batch metadata lists Homebrew, Debian, Ubuntu, Fedora, Arch,
      openSUSE, Alpine, Nix, MacPorts, Scoop, and WinGet package names, which reflects
      its long life as a cross-platform desktop utility rather than a single-distro
      niche app.
    - >
      The official news page for 4.4.0 on 2026-03-09 calls that release the project's
      25-year milestone, showing continued upstream maintenance into the mid-2020s.
  package-nerd-significance:
    - >
      For package maintainers, Claws Mail is interesting because it is a mature GTK
      desktop application with many optional integrations: TLS, libetpan, GPG, spam
      filtering, HTML rendering plugins, notification plugins, translations, manuals,
      and platform-specific packaging. It is also a useful example of an old-school GUI
      mail client that remains packageable across Unix package managers and Windows
      package catalogs.
  project-history:
    - >
      The official manual says Sylpheed-Claws was created so new mail-client features
      could be tested without compromising Sylpheed stability, with developers regularly
      synchronizing with Hiroyuki Yamamoto's Sylpheed codebase. The projects later
      diverged: work on GTK2 started in early 2003, the first GTK2-based Sylpheed-Claws
      release arrived in March 2005, and the project became Claws Mail in 2006.
    - >
      Claws Mail continued to emphasize a traditional Unix desktop mail-client model:
      multiple accounts and mailboxes, POP3, IMAP, local mbox, SSL, authentication
      methods, filtering, searching, import/export, GnuPG, plugins, configurable
      toolbars, per-folder preferences, and safeguards against data loss.
  related-projects:
    - >
      Sylpheed is the direct ancestor and early upstream counterpart named in the Claws
      Mail manual.
    - >
      The official manual positions Claws Mail beside other mail clients such as
      Evolution and Outlook by saying it is not a full personal information manager.
    - >
      Plugins and related tools include GnuPG support, Bogofilter, SpamAssassin,
      mailMBOX, RSSyl, notification plugins, and HTML display plugins documented by the
      manual, FAQ, and release notes.
  sources:
    - https://www.claws-mail.org/manual/claws-mail-manual.html
    - https://www.claws-mail.org/faq/index.php/General_Information
    - https://www.claws-mail.org/news.php
  summary:
    - >
      Claws Mail is a GTK-based email and news client known for being lightweight, fast,
      and extensible. Its official manual traces the project to April 2001, when it
      began as Sylpheed-Claws, a development test bed for Sylpheed features, before
      becoming an independent project and taking the Claws Mail name in November 2006.
  timeline:
    - '2001: Sylpheed-Claws begins in April as a Sylpheed feature test bed.'
    - '2003: GTK2 work begins for Sylpheed and Sylpheed-Claws.'
    - '2005: First GTK2-based Sylpheed-Claws release appears in March.'
    - '2006: The project changes its name to Claws Mail in November.'
    - '2026: Claws Mail 4.4.0 release notes mark 25 years of the project.'
  usage:
    - >
      Claws Mail is used as a graphical mail and news reader for users who want a fast,
      configurable client without a full personal-information-manager stack. Official
      FAQ entries document MH mail storage, local Unix mailbox handling, POP3, IMAP,
      SMTP-only accounts, GPG support, filtering, plugins, address completion, and an
      explicit no-HTML-message-composition stance.
related-packages:
  - id: brew:sylpheed
    reason: >
      Choose Sylpheed for the original lightweight GTK mail client from which Claws Mail
      began; Claws Mail later diverged with its own feature and plugin direction.
    rel: alternative
    sources:
      - https://www.claws-mail.org/manual/claws-mail-manual.html
      - https://sylpheed.sraoss.jp/en/
  - id: brew:gnupg
    reason: >
      Use GnuPG with Claws Mail when you need the mail client's documented OpenPGP
      signing and encryption support.
    rel: adjacent_workflow
    sources:
      - https://www.claws-mail.org/manual/claws-mail-manual.html
      - https://gnupg.org/
  - id: brew:bogofilter
    reason: >
      Use Bogofilter with Claws Mail for the Bayesian spam-filtering workflow documented
      by the mail client.
    rel: adjacent_workflow
    sources:
      - https://www.claws-mail.org/manual/claws-mail-manual.html
      - https://bogofilter.sourceforge.io/
