config-file-location: null
credentials-file-location:
  macos:
    - ~/Library/Application Support/JumpCloud Password Manager/data/daemon/backup
history:
  adoption-history:
    - >
      JumpCloud positioned Password Manager as part of its IdentityOS platform for
      organization-managed credentials. Official documentation supports desktop clients
      on macOS, Windows, and Linux, plus browser and mobile integrations.
  package-nerd-significance:
    - >
      The application is noteworthy for combining enterprise identity administration
      with a decentralized password-vault design: encrypted vault data is kept on user
      devices and synchronized end-to-end through JumpCloud infrastructure rather than
      being held as an ordinary server-side password database.
  project-history:
    - >
      JumpCloud introduced Password Manager as an integrated organizational
      password-management and vault product by 2022. It was designed to remove a
      separate master-password workflow and tie enrollment and administration to
      JumpCloud-managed identities.
  related-projects:
    - JumpCloud IdentityOS
    - JumpCloud Password Manager browser extension
    - JumpCloud Password Manager mobile app
  sources:
    - https://jumpcloud.com/support/faq-jumpcloud-password-manager
    - https://jumpcloud.com/support/jumpcloud-password-manager-desktop-app
    - https://jumpcloud.com/wp-content/uploads/2022/11/202211-GEN-YearInReview.pdf
  summary:
    - >
      JumpCloud Password Manager is an organization-managed password vault and 2FA
      authenticator integrated with JumpCloud IdentityOS. It stores vault data locally
      and synchronizes encrypted copies between devices through JumpCloud servers.
  timeline:
    - >
      2022: JumpCloud featured its decentralized Password Manager in its official
      year-in-review material.
    - >
      2024: JumpCloud ended support for the Linux AppImage build while retaining Debian
      and RPM packages.
    - >
      2026: Official desktop documentation covered managed use across macOS, Windows,
      and Linux.
  usage:
    - >
      Enrolled users unlock the desktop app with a PIN or supported biometrics, organize
      passwords and other sensitive records, generate TOTP codes, share folders, inspect
      password health, and use the browser extension for autofill. Administrators
      control enrollment and deployment through JumpCloud.
