history:
  adoption-history:
    - >
      OpenDesign launched with adapters for a broad set of coding-agent CLIs rather than
      binding its workflow to one model vendor. It subsequently added packaged desktop
      releases, container deployment, plugins, design-system catalogs, and MCP
      integration.
    - >
      The official changelog records rapid contributor and feature growth after the
      first public release, including a larger agent bench and a built-in sign-in-based
      model service in 0.9.0.
  package-nerd-significance:
    - >
      OpenDesign treats design practice as packageable developer infrastructure: Agent
      Skills, design-system bundles, plugins, templates, and MCP services are stored as
      inspectable files and registries rather than being confined to a hosted editor.
    - >
      It is notable for composing existing local coding agents with reusable design
      knowledge, producing ordinary project artifacts such as HTML, CSS, PDF, PPTX, and
      MP4 that can continue through standard source-control workflows.
  project-history:
    - >
      OpenDesign emerged as a local-first, open-source design workspace built around
      installed coding-agent CLIs. Its first public release combined agent detection and
      dispatch, curated design systems, reusable skills, and sandboxed artifact
      previews.
    - >
      The project broadened into an extensible design platform with desktop and
      container distribution, a plugin marketplace, portable Agent Skill-compatible
      packages, media workflows, design-system authoring, and multiple routes for local
      or bring-your-own-key inference.
  related-projects:
    - >
      Claude Code, Codex, Cursor, Gemini CLI, OpenCode, Qwen, Copilot CLI, and other
      agent runtimes can act as execution backends.
    - >
      The project adopts the Agent Skills `SKILL.md` convention and adds
      `open-design.json` metadata for its plugin ecosystem.
    - >
      Figma and Pencil migration workflows connect external design sources to
      code-oriented outputs.
  sources:
    - https://github.com/nexu-io/open-design#readme
    - https://github.com/nexu-io/open-design/blob/main/CHANGELOG.md
    - https://github.com/nexu-io/open-design/blob/main/QUICKSTART.md
    - https://github.com/nexu-io/open-design/blob/main/apps/daemon/src/app-config.ts
  summary:
    - >
      OpenDesign is a local-first design workspace that turns coding agents into a
      design engine. It combines agent runtimes, design systems, skills, plugins,
      previews, and export pipelines while keeping generated artifacts in ordinary
      files.
  timeline:
    - '2026-05-01: OpenDesign 0.1.0 became the first public release.'
    - >
      2026-05-07: Version 0.5.0 added first-class live dashboards, inspect-mode editing,
      and further agent integration.
    - >
      2026-05-29: Version 0.9.0 added the built-in OpenDesign AMR service and
      substantially expanded onboarding, plugins, and agent support.
  usage:
    - >
      Install the desktop application for an automatically configured workspace, run the
      stack from source or Docker, or expose OpenDesign to another agent through its MCP
      integration.
    - >
      Choose an available coding agent, design system, and skill or plugin; provide a
      brief; review the streamed artifact; then retain the generated source or export it
      to formats such as PDF, PPTX, or MP4.
