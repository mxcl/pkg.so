history:
  adoption-history:
    - >
      Broad's README points many users toward Terra, a managed bioinformatics platform
      with built-in Cromwell support, while self-managed users can download a JAR or
      Docker image. This split shaped Cromwell's adoption: package managers provide
      local CLI access, but large production usage often happens through managed or
      institution-maintained deployments.
  package-nerd-significance:
    - >
      For package maintainers, Cromwell is a JVM scientific-workflow package whose
      command-line distribution wraps a larger service-oriented engine. It matters
      because reproducible workflow tooling often needs both local executables for
      validation and stable release artifacts for institutional compute environments.
  project-history:
    - >
      The repository was created in 2015, and early releases began that year. The
      official documentation says Cromwell started life as a WDL engine, with WDL
      draft-2 as its first language, and later added WDL 1.0 support while continuing to
      track WDL development.
    - >
      Cromwell's architecture centers on workflow execution backends. The official
      backend documentation describes included support for Local, HPC schedulers such as
      SGE, LSF, HTCondor, and Slurm, Google Cloud through Google Batch, GA4GH TES, and
      AWS Batch beta support.
  related-projects:
    - WDL and OpenWDL are the workflow language context for Cromwell.
    - Terra is a managed platform with built-in Cromwell support.
    - GA4GH TES, Google Batch, AWS Batch, and HPC schedulers are execution-backend contexts.
  sources:
    - https://github.com/broadinstitute/cromwell#readme
    - https://cromwell.readthedocs.io/en/stable/
    - https://cromwell.readthedocs.io/en/stable/LanguageSupport/
    - https://cromwell.readthedocs.io/en/stable/backends/Backends/
    - https://github.com/broadinstitute/cromwell/releases/tag/0.5
  summary:
    - >
      Cromwell is Broad Institute's open-source workflow management system for
      bioinformatics and other scientific workflows. It is closely associated with WDL,
      ships with the womtool helper, and can run workflows locally, as a server, or
      against pluggable execution backends.
  timeline:
    - '2015: Repository created and 0.5 release published.'
    - '2015: Early 0.x releases established Cromwell as a WDL workflow engine.'
    - >
      2020s: Documentation emphasizes Terra-managed usage, self-managed JAR or Docker
      deployments, WDL support, and modular backends.
  usage:
    - >
      Users run Cromwell to execute WDL workflows and use womtool for WDL validation and
      workflow object model tasks. Common deployments range from five-minute local
      tutorials to persistent server mode, cloud batch backends, and HPC scheduler
      integrations.
related-packages:
  - id: brew:nextflow
    reason: >
      Choose Nextflow when you prefer a dataflow/Groovy-style pipeline language with
      built-in portability across local, HPC, cloud, container, and package-manager
      environments instead of Cromwell's WDL-centered model.
    rel: alternative
    sources:
      - https://github.com/broadinstitute/cromwell
      - https://nextflow.io/docs/latest/index.html
  - id: brew:snakemake
    reason: >
      Choose Snakemake when a Python-based, GNU Make-like rule language and integrated
      software-environment management fit the analysis better than Cromwell's WDL and
      backend configuration model.
    rel: alternative
    sources:
      - https://github.com/broadinstitute/cromwell
      - https://snakemake.readthedocs.io/en/stable/tutorial/tutorial.html
