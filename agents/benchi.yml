id: brew:benchi
display-name: Benchi
repo: null
docs:
  - https://github.com/ConduitIO/benchi#readme
config-file-location:
  unix:
    - path passed to benchi -config
credentials-file-location: null
history:
  adoption-history:
    - >
      Benchi's adoption story is currently tied to the Conduit ecosystem and Go/Docker
      users. The README documents binary downloads, `go install`, and a shell installer,
      while the supplied Homebrew facts show package-manager availability.
    - >
      Because it is young and specialized, its public adoption is better described as
      early ecosystem packaging than broad industry uptake.
  package-nerd-significance:
    - >
      Benchi is package-nerd interesting as a young, purpose-built benchmark harness for
      containerized data infrastructure. It packages a repeatable benchmark workflow,
      not just a timer.
    - >
      Its significance is still emerging; the reason to care today is that it turns
      Conduit-style pipeline benchmarking into a small installable CLI.
  project-history:
    - >
      The official repository was created in February 2025. The README says Benchi was
      developed to simplify setting up and running benchmarks for Conduit, and describes
      Docker Compose environments, metrics collection, hooks, and real-time monitoring.
    - >
      Public releases moved quickly in March and April 2025, from v0.1.0 through v0.4.1,
      giving the project a compact early release history rather than a long legacy.
  related-projects:
    - Conduit is the data-pipeline project Benchi was developed to benchmark.
    - Docker Compose is central to Benchi's benchmark environment model.
    - Prometheus-style metrics endpoints are used by documented collector examples.
  sources:
    - https://github.com/ConduitIO/benchi
    - https://github.com/ConduitIO/benchi/releases
    - source_facts.package-manager-url
    - source_facts.repo
  summary:
    - >
      Benchi is ConduitIO's minimal Docker-based benchmarking framework for measuring
      application and infrastructure performance, especially data-pipeline scenarios.
  timeline:
    - '2025: Repository created.'
    - '2025: v0.1.0 released.'
    - '2025: v0.4.1 released.'
    - '2025: Homebrew package metadata lists `benchi` as an installable formula.'
  usage:
    - >
      Users run `benchi -config <file>` against a YAML benchmark configuration that
      defines Docker Compose infrastructure, tools, metrics collectors, tests, and
      lifecycle hooks. Results are written into timestamped output directories with logs
      and aggregated CSV metrics.
    - >
      The tool is suited to repeatable infrastructure benchmarks where containers,
      Prometheus-like metrics, and scripted benchmark phases matter more than
      single-command timing.
related-packages:
  - id: brew:conduit
    reason: >
      Use Conduit with Benchi when benchmarking streaming pipelines: Benchi was created
      for Conduit and includes a collector that measures per-pipeline message and byte
      throughput from Conduit's metrics endpoint.
    rel: adjacent_workflow
    sources:
      - https://github.com/ConduitIO/benchi
      - https://github.com/ConduitIO/conduit
      - https://docs.conduit.io/
tags:
  - benchmarking
  - cli
