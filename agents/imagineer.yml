history:
  adoption-history:
    - >
      imagineer is distributed through Cargo, Homebrew, Nix, and prebuilt GitHub
      releases. Its Homebrew install counts are small, but its presence in Rust and Unix
      package channels reflects interest in scriptable image conversion backed by
      memory-safe Rust image libraries.
    - >
      The rename from `sic` to `imagineer` is part of the adoption story: the original
      name described a minimal converter, while the later tool had grown into batch
      processing, animated image support, custom operation parsing, and imageproc-backed
      manipulation.
  package-nerd-significance:
    - >
      imagineer matters in package-manager culture as a Rust-native alternative to older
      C/C++ image utilities for common terminal workflows. It also functions as a
      practical CLI showcase for the `image` and `imageproc` crates, tracking those
      libraries as they add formats and operations.
  project-history:
    - >
      The changelog records the first `sic` release, 0.1.0, on 2017-11-12 with
      conversion between formats powered by the Rust `image` crate. Over time, the
      project added file-extension format inference, image operations, an image-script
      interface, stdin/stdout support, animated image handling, AVIF and WebP support,
      QOI support, and broader encoder behavior.
    - >
      In 2025, version 0.23.0 renamed the project and binary to `imagineer`, with the
      README explaining the name as a pun on image, engineering, and imagination.
      Version 0.24.0 then changed the installed binary name to `ig`, making the command
      shorter while keeping the project identity.
  related-projects:
    - >
      imagineer is directly related to the Rust `image` and `imageproc` crates, and its
      changelog links older `sic` releases to the previous repository naming. It sits
      near tools such as ImageMagick and GraphicsMagick in use case, but with a Rust
      crate ecosystem focus.
  sources:
    - https://formulae.brew.sh/api/formula/imagineer.json
    - https://github.com/foresterre/imagineer
    - https://raw.githubusercontent.com/foresterre/imagineer/main/CHANGELOG.md
    - https://raw.githubusercontent.com/foresterre/imagineer/main/README.md
  summary:
    - >
      imagineer is a Rust command-line image conversion and manipulation tool. It began
      as `sic`, a simple image CLI, and became a front-end for the Rust `image` and
      `imageproc` crates.
  timeline:
    - "2017: `sic` 0.1.0 introduced image conversion powered by Rust's `image` crate."
    - '2018: The project added image operations and an embedded user manual.'
    - '2019: The CLI gained direct operation flags plus stdin/stdout support.'
    - '2021: Animated image handling and AVIF decoding appeared in the changelog.'
    - '2025: Version 0.23.0 renamed the project to `imagineer`.'
    - '2025: Version 0.24.0 changed the binary name to `ig`.'
  usage:
    - >
      The `ig` command converts images with `--input` and `--output`, can infer output
      format from file extensions, and exposes explicit output format selection for
      formats including AVIF, BMP, OpenEXR, Farbfeld, GIF, ICO, JPEG, PNG, Netpbm
      variants, QOI, TGA, TIFF, and WebP.
    - >
      Beyond conversion, imagineer supports glob-driven batch processing and ordered
      image operations such as blur, crop, resize, grayscale, threshold, overlay,
      dither, hue rotation, and convolution filters. The README notes that operation
      order matters.
related-packages:
  - id: brew:imagemagick
    reason: >
      Choose ImageMagick when you need a much broader catalog of command-line operators,
      image formats, or mature delegate integrations than imagineer provides.
    rel: alternative
    sources:
      - https://raw.githubusercontent.com/foresterre/imagineer/main/README.md
      - https://imagemagick.org/convert/
  - id: brew:graphicsmagick
    reason: >
      Choose GraphicsMagick for established `gm`-based conversion and batch-processing
      workflows with a long-standing compatibility and stability focus.
    rel: alternative
    sources:
      - https://raw.githubusercontent.com/foresterre/imagineer/main/README.md
      - http://www.graphicsmagick.org/
