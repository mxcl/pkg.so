credentials-file-location: null
history:
  adoption-history:
    - >
      The official install notes list package-manager paths for OpenBSD, FreeBSD,
      NetBSD, Debian, Ubuntu, Homebrew, and Termux, showing that dMagnetic moved from a
      standalone source tarball into the usual retro-computing package channels.
  package-nerd-significance:
    - >
      dMagnetic is the sort of package that keeps old commercial interactive fiction
      usable without emulators for each original machine. It packages a niche
      preservation workflow as a small CLI program that fits cleanly into Unix, BSD,
      macOS, Windows, and mobile terminal environments.
  project-history:
    - >
      The project is not a game distribution; it is an interpreter for original Magnetic
      Scrolls binaries. Its official page emphasizes portability through ordinary C
      compiler support and publishes the code under the BSD 2-clause license.
  related-projects:
    - >
      The official page points users to original Magnetic Scrolls game data, including
      .mag/.gfx files from the Magnetic Scrolls memorial.
  sources:
    - https://www.dettus.net/dMagnetic
    - https://www.dettus.net/dMagnetic/dMagnetic_037.pdf
  summary:
    - >
      dMagnetic is a portable terminal interpreter for the classic Magnetic Scrolls text
      adventures, letting modern systems run games such as The Pawn, The Guild of
      Thieves, Jinxter, Corruption, Fish!, Myth, and Wonderland.
  timeline:
    - >
      2023-05: dMagnetic 0.37 was published with help-screen updates and Apple II
      graphics memory improvements.
  usage:
    - >
      Users provide original game data in formats such as .mag/.gfx, MS-DOS resource
      files, Commodore 64 disk images, Amstrad CPC disk images, Archimedes disk images,
      Spectrum +3 disks, Atari XL disks, or Apple II disk images. The interpreter
      renders terminal graphics using modes ranging from no graphics through ASCII,
      ANSI, UTF-8, and sixel.
