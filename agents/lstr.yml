history:
  adoption-history:
    - >
      lstr is newer than long-established tools such as tree, but it has already been
      packaged for Homebrew and Nix in the supplied package facts, and the README notes
      NetBSD package availability. The GitHub repository shows substantial early
      interest for a young filesystem CLI.
  package-nerd-significance:
    - >
      lstr is representative of a modern wave of Rust replacements and companions for
      familiar Unix tools: not a wholesale reinvention of the shell, but a focused
      binary that adds git awareness, color conventions, icons, and TUI ergonomics while
      staying close to the `tree` mental model.
  project-history:
    - >
      The GitHub repository was created in 2025 and the crate was published to crates.io
      the same month. The README presents the project as a small Rust CLI focused on
      essential tree-viewing features without broad configuration surface.
    - >
      The project combines familiar `tree` behavior with modern terminal conveniences:
      LS_COLORS-aware coloring, optional icons, file sizes and permissions, git status
      markers, .gitignore-aware filtering, OSC 8 hyperlinks, and an interactive mode
      with keyboard navigation.
  related-projects:
    - >
      Related tools include tree, eza, lsd, fzf, bat, Rust terminal UI libraries,
      LS_COLORS-aware file browsers, and git-aware filesystem viewers.
  sources:
    - https://api.github.com/repos/bgreenwell/lstr
    - https://crates.io/crates/lstr
    - https://github.com/bgreenwell/lstr
    - https://github.com/bgreenwell/lstr#readme
    - source_facts.package-manager
  summary:
    - >
      lstr is a Rust directory tree viewer inspired by the classic `tree` command. Its
      README describes a fast, minimalist tool with both classic tree output and an
      optional interactive terminal UI.
  timeline:
    - '2025: GitHub repository created.'
    - '2025: crates.io metadata shows the lstr crate first published.'
    - '2025: README documents Homebrew, source, and NetBSD installation paths.'
  usage:
    - >
      The basic CLI form is `lstr [OPTIONS] [PATH]`, defaulting to the current
      directory. Users can limit depth, show only directories, respect ignore files,
      sort by name, size, modification time, or extension, and pipe classic output to
      tools such as fzf, less, or bat.
    - >
      The interactive mode is launched with `lstr interactive [OPTIONS] [PATH]`. The
      README documents keyboard controls for moving, expanding directories, opening
      files in `$EDITOR`, quitting, and printing a selected path to stdout for shell
      integration.
related-packages:
  - id: brew:tree
    reason: >
      Choose tree for the established, narrowly focused directory hierarchy command;
      lstr explicitly identifies it as the inspiration for its classic mode.
    rel: alternative
    sources:
      - https://github.com/bgreenwell/lstr#readme
      - https://github.com/Old-Man-Programmer/tree
  - id: brew:erdtree
    reason: >
      Choose erdtree when directory visualization must also provide parallel traversal
      and disk-usage analysis rather than lstr's minimalist classic and interactive
      views.
    rel: alternative
    sources:
      - https://github.com/bgreenwell/lstr#readme
      - https://github.com/solidiquis/erdtree
