history:
  adoption-history:
    - >
      Material Maker is distributed through the developer's itch.io page and Steam,
      while its official README documents package-manager installation through Homebrew,
      Scoop, and Chocolatey. This mix gives artists conventional storefront downloads
      and package-oriented users reproducible installation routes.
    - >
      The public repository accepts community contributions and translations, and the
      project maintains user documentation alongside its source.
  package-nerd-significance:
    - >
      Material Maker is an example of a desktop creative application built with a game
      engine but distributed like a cross-platform developer tool. Its open repository,
      automation builds, command-line support, and availability through multiple package
      managers make it convenient in graphics and game-development workstations.
    - >
      Its procedural node graphs produce reusable material definitions and exported
      textures for engines such as Godot, Unity, Unreal Engine, and for Blender
      workflows.
  project-history:
    - >
      Rodolphe Suescun began Material Maker as an open-source Godot-based tool in 2018.
      Its initial emphasis was procedural texture generation through interconnected
      graph nodes; it later grew to include brush graphs and direct painting on 3D
      models.
    - >
      The project continued through regular public releases and underwent substantial
      work to move its interface and rendering foundations to Godot 4. Its scope now
      spans procedural PBR material design, texture synthesis, and layered 3D painting.
  related-projects:
    - Godot Engine supplies Material Maker's application and graph-interface foundation.
    - >
      Blender, Godot, Unity, and Unreal Engine are documented export targets or
      downstream workflows.
  sources:
    - https://github.com/RodZill4/material-maker
    - https://rodzill4.github.io/material-maker/doc/
    - https://rodzilla.itch.io/material-maker
    - https://rodzilla.itch.io/material-maker/devlog
    - source_facts.package-manager
  summary:
    - >
      Material Maker is an open-source procedural PBR material editor and 3D
      texture-painting application built with Godot Engine. Users construct textures,
      materials, and brushes as node graphs and export the resulting assets to common
      rendering and game-engine workflows.
  timeline:
    - "2018: Development and the repository's stated copyright period began."
    - '2023: Material Maker 1.3 expanded the node library and asset-sharing workflow.'
    - '2024–2025: Development focused on the substantial migration to Godot 4.'
    - '2026: Continued releases expanded and refined the interface and creative workflow.'
  usage:
    - >
      Artists connect generator, transform, filter, and material nodes to build
      procedural PBR textures, then export texture sets for use in supported 3D tools
      and engines.
    - >
      The painting workflow applies node-defined brushes to imported 3D models, while
      reusable materials, brushes, and nodes can be stored in user libraries.
