history:
  adoption-history:
    - >
      libxmlb became useful in Linux desktop plumbing because projects such as AppStream
      and fwupd deal in large XML metadata collections. The same maintainer ecosystem
      around GNOME, fwupd, and LVFS made the binary metadata cache a practical
      dependency for package and firmware tooling.
  package-nerd-significance:
    - >
      libxmlb matters to package nerds because it sits where package metadata, desktop
      app metadata, and firmware metadata meet performance constraints. It turns text
      metadata into a binary cache that package managers and desktop software centers
      can query cheaply.
  project-history:
    - >
      Richard Hughes' README frames the project around the cost of parsing XML and the
      inability to mmap normal XML strings directly. libxmlb converts XML into a
      structured binary format with a deduplicated string table and NUL-terminated
      strings, trading compactness for fast queries and near zero-copy access.
    - >
      The first visible 0.1.0 GitHub tag points to a commit dated 2018-10-04. The design
      is intentionally narrow: it implements only a subset of XPath and ships xb-tool
      for compiling and querying binary XML.
  related-projects:
    - >
      fwupd, LVFS, AppStream, GNOME Software, and other metadata-heavy desktop tools are
      the neighboring ecosystem. libxml2 remains the broader XML library; libxmlb is the
      binary metadata cache layer.
  sources:
    - >
      https://api.github.com/repos/hughsie/libxmlb/commits/a5878a07a6a1bafce8857be2bb9316fffa9907f3
    - https://blog.tenstral.net/2020/01/a-big-appstream-status-update.html
    - https://github.com/hughsie/libxmlb
    - https://raw.githubusercontent.com/hughsie/libxmlb/main/README.md
  summary:
    - >
      libxmlb is a small system library for compiling XML metadata into a binary
      representation that can be memory-mapped and queried quickly. It is most
      associated with desktop and firmware metadata workflows where large XML files need
      repeated lookups.
  timeline:
    - '2018: The 0.1.0 tag points to a commit dated 2018-10-04.'
    - >
      2019: AppStream discussions describe LVFS and fwupd as using AppStream metadata
      for firmware metadata.
    - >
      2020s: libxmlb is packaged across Linux distributions and Homebrew as xb-tool and
      the libxmlb library.
  usage:
    - >
      Typical usage is to compile XML metadata into an .xmlb file and query it with
      xb-tool or through the library API. It is a cache/query accelerator, not a
      general-purpose XML replacement.
related-packages:
  - id: brew:appstream
    reason: >
      Use AppStream with libxmlb when building or querying standardized Linux
      software-component catalogs; AppStream officially lists libxmlb as a required
      indexing dependency.
    rel: adjacent_workflow
    sources:
