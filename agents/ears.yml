history:
  adoption-history:
    - Distributed as a native macOS application and through the Homebrew Cask package `ears`.
  package-nerd-significance:
    - >
      Ears is useful to keyboard-centric Mac users because it exposes audio-device
      selection, microphone muting, and Bluetooth reconnection without repeatedly
      opening System Settings; its command-line and AppleScript interfaces also make
      those operations scriptable.
  project-history:
    - >
      Retina Studio developed Ears as a focused macOS utility for switching among
      increasingly complex combinations of speakers, headphones, microphones, webcams,
      and Bluetooth devices.
  related-projects:
    - macOS System Settings provides the underlying system controls that Ears streamlines.
    - Ears supports integration with shell scripts, launchers, and AppleScript workflows.
  sources:
    - 'Official product page: https://retina.studio/ears/'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Ears is a macOS audio-routing utility from Retina Studio. It provides
      keyboard-driven input and output selection, global microphone muting, per-device
      volume defaults, and Bluetooth-device shortcuts.
  timeline:
    - >
      2026: The official product page documents command-line and AppleScript control
      alongside audio switching and Instamute features.
  usage:
    - >
      Invoke Ears with a global hotkey, select an input or output device, or configure
      favorite Bluetooth devices and mute behavior in the app's preferences.
    - >
      Automation users can issue commands such as `ears --output`, `ears --input`, and
      `ears --mute`, or control the application through AppleScript.
