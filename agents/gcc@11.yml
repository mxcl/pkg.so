id: brew:gcc@11
display-name: GCC 11
repo: https://gcc.gnu.org/git/gcc.git
docs:
  - https://gcc.gnu.org/install
  - https://gcc.gnu.org/onlinedocs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Versioned GCC 11 packages became useful as distributions and users moved past GCC
      10 but still needed to pin a compiler before later GCC majors. For package
      managers, a versioned formula lets recipes and local builds request gcc-11,
      g++-11, or gfortran-11 without making the whole system follow that major.
  package-nerd-significance:
    - >
      gcc@11 is important as a compatibility and migration package: it carries the first
      GCC major where gnu++17 became the default C++ mode, while still giving packagers
      a pinned compiler older than the newest GCC line.
  project-history:
    - >
      The official GCC timeline lists GCC 11.1 on April 27, 2021, then 11.2 in July
      2021, 11.3 in April 2022, 11.4 in May 2023, and 11.5 in July 2024. The GCC 11
      change notes call out a default C++ mode change to gnu++17, new diagnostic column
      behavior, sanitizer improvements, DWARF 5 debug information defaults for many
      targets, and a C++11-capable host compiler requirement for building GCC itself.
  related-projects:
    - >
      GCC 11 is related to the main GCC project, libstdc++, binutils, gcov, LTO tooling,
      sanitizer runtimes, and neighboring versioned package-manager formulae such as
      gcc@10 and unversioned gcc.
  sources:
    - https://gcc.gnu.org/gcc-11/changes.html
    - https://gcc.gnu.org/git.html
    - https://gcc.gnu.org/onlinedocs/
    - https://gcc.gnu.org/releases.html
  summary:
    - >
      GCC 11 is the Homebrew versioned packaging line for the GCC 11 release series.
      Like gcc@10, it preserves a specific GNU Compiler Collection major version for
      projects that need a stable compiler generation.
  timeline:
    - '1987: GCC 1.0 released.'
    - '2021: GCC 11.1 released.'
    - '2021: GCC 11.2 released.'
    - '2022: GCC 11.3 released.'
    - '2023: GCC 11.4 released.'
    - '2024: GCC 11.5 released.'
  usage:
    - >
      The Homebrew package exposes version-suffixed tools such as cpp-11, gcov-11,
      lto-dump-11, and target-prefixed gcc/g++/gfortran executables. Upstream source
      control uses the same GCC repository with release branches such as releases/gcc-11
      and release tags documented by the GCC Git page.
related-packages:
  - id: brew:gcc
    reason: >
      Choose the unversioned GCC formula for the currently maintained compiler line when
      a project no longer requires GCC 11 compatibility.
    rel: alternative
    sources:
      - https://gcc.gnu.org/
      - https://gcc.gnu.org/releases.html
      - https://gcc.gnu.org/git.html
  - id: brew:llvm
    reason: >
      Choose LLVM when a GCC-compatible Clang toolchain with modular libraries and
      different diagnostics is preferable to retaining GCC 11.
    rel: alternative
    sources:
      - https://gcc.gnu.org/gcc-11/changes.html
      - https://clang.llvm.org/docs/UsersManual.html
      - https://clang.llvm.org/features.html
  - id: brew:binutils
    reason: >
      Pair GCC 11 with GNU Binutils when the build requires GNU assembler, linker,
      archive, or binary-inspection tools.
    rel: adjacent_workflow
    sources:
      - https://gcc.gnu.org/install/download.html
      - https://sourceware.org/binutils/
      - https://sourceware.org/binutils/docs/
