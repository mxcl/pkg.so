history:
  adoption-history:
    - >
      Camlp5 has long lived in the OCaml toolchain's syntax-extension culture. Its
      official docs describe use as a shell command, as an OCaml compiler preprocessor
      through -pp, and inside the OCaml toplevel.
    - >
      The package metadata in this batch shows Camlp5 in Homebrew, Debian, Ubuntu,
      MacPorts, and Arch, reflecting its role as a durable compatibility package for
      OCaml projects that still rely on Camlp5 syntax extensions or revised syntax.
  package-nerd-significance:
    - >
      Camlp5 matters to package nerds because it is both a real tool and an
      archaeological layer in OCaml packaging. It preserves a branch of the Camlp4
      preprocessor tradition that many older OCaml packages and syntax experiments
      depended on.
    - >
      It is also a reminder that language ecosystems carry syntax tooling as
      compatibility debt. Keeping Camlp5 packaged means old source distributions,
      revised-syntax code, and pre-ppx extension workflows can still be built on modern
      Unix systems.
  project-history:
    - >
      The official Camlp5 about page traces its ideas to Michel Mauny in the 1990s.
      Daniel de Rauglaudre implemented the first version in 1996 under the name Camlp4,
      where the four Ps meant Pre-Processor-Pretty-Printer.
    - >
      In 2002, Camlp4 maintenance moved to Michel Mauny and was later extended by
      Nicolas Pouillard with different design ideas and some incompatibilities. In 2006,
      de Rauglaudre restarted the original line of work and renamed it Camlp5.
    - >
      The current GitHub README says Camlp5 was originally written by Daniel de
      Rauglaudre, with maintenance and upgrades by Chet Murthy. It also notes a newer
      8.x line that differs substantially from the 7.x releases and is tested against
      modern OCaml versions.
  related-projects:
    - Camlp4 is the predecessor and divergence point described by the official Camlp5 history.
    - OCaml is the language and compiler toolchain Camlp5 preprocesses.
    - >
      The OCaml ppx ecosystem is the modern comparison point for many syntax-extension
      workflows, although Camlp5 remains its own preprocessor line.
    - >
      JoCaml is mentioned in the GitHub README as historically supported by older Camlp5
      versions.
  sources:
    - https://api.github.com/repos/camlp5/camlp5/releases
    - https://camlp5.github.io/doc/html
    - https://camlp5.github.io/doc/html/about.html
    - https://github.com/camlp5/camlp5
    - https://github.com/camlp5/camlp5/blob/master/README.md
    - input.json source_facts.package-manager
  summary:
    - >
      Camlp5 is an OCaml preprocessor and pretty-printer used to extend or redefine
      OCaml syntax, convert between syntaxes, and build parsing or pretty-printing
      extensions.
  timeline:
    - '1990s: Michel Mauny expresses ideas that later feed into Camlp5.'
    - '1996: Daniel de Rauglaudre implements the first version as Camlp4.'
    - '2002: Camlp4 maintenance moves and later evolves with incompatible design changes.'
    - '2006: Daniel de Rauglaudre restarts the original line as Camlp5.'
    - '2016: camlp5/camlp5 GitHub repository is created.'
    - '2021: Camlp5 8.00 release appears in the GitHub releases feed.'
    - >
      2026: Current repository activity shows ongoing maintenance for modern OCaml
      compatibility.
  usage:
    - >
      Common shell commands include camlp5o for ordinary OCaml syntax and camlp5r for
      revised syntax. The docs show invoking them through ocamlc -pp and loading
      camlp5o.cma or camlp5r.cma in the OCaml toplevel.
    - >
      Developers use Camlp5 to write parsing and printing kits, extensible grammars,
      quotations, macros, syntax extensions, and pretty-printers. It is also used to
      convert OCaml programs from one syntax to another and to inspect syntax-extension
      output.
related-packages:
