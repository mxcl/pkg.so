  summary:
    - PhotoCraft is a free, open-source, offline-capable image editor built natively in Rust.
  timeline:
    - '2026: Early-alpha releases became available for macOS, Windows, Linux, and the web.'
  usage:
    - >
      Users can edit raster artwork with layered, non-destructive workflows and open or
      save layered PSD and PSB documents. Developers can build the desktop application
      from source with the Rust toolchain.
