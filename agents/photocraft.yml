history:
  adoption-history:
    - >
      PhotoCraft provides native builds for macOS, Windows, and Linux, plus a
      WebAssembly build. The project remains early-stage and asks users to report rough
      edges through its issue tracker and community channels.
  package-nerd-significance:
    - >
      PhotoCraft is notable as a native, cross-platform image editor written from
      scratch in Rust rather than packaged as an Electron application. Its focus on
      layered PSD/PSB workflows, local processing, and reproducible parity tracking
      makes it relevant to open-source graphics-tool users.
  project-history:
    - >
      PhotoCraft was introduced by the ArtCraft team as one of a family of free,
      open-source creative applications. It aims to provide a familiar professional
      image-editing workflow with layers, masks, adjustment layers, filters, vectors,
      brushes, and color-management features.
    - >
      The project is dual-licensed under MIT or Apache-2.0 and measures progress toward
      broader Photoshop-compatible workflows through a public roadmap and parity
      tooling.
  related-projects:
    - >
      PhotoCraft is part of ArtCraft’s Crafting Apps family alongside VectorCraft,
      FilmCraft, LightCraft, PdfCraft, EffectCraft, and DesignCraft.
  sources:
