history:
  adoption-history:
    - >
      liboil mattered most in the multimedia and desktop stack, where many packages
      needed fast pixel, audio, or numeric loops but did not want to maintain
      architecture-specific assembly in every project.
    - >
      Its package-manager life continued after active upstream development because older
      software still linked against liboil, while newer software increasingly moved to
      Orc or compiler/native SIMD approaches.
  package-nerd-significance:
    - >
      liboil is package-nerd interesting because it captures a transitional moment
      before widespread portable SIMD abstractions: projects wanted reusable
      CPU-specific inner loops, but compiler autovectorization and runtime SIMD
      libraries had not settled the problem.
    - >
      Its replacement by Orc is also instructive. The successor moved from a collection
      of hand-optimized functions toward a small runtime compiler for array operations,
      which explains why liboil often remains only as a compatibility package.
  project-history:
    - >
      The project documentation describes liboil as a library of simple functions
      optimized for CPUs using techniques such as Altivec, MMX, and SSE. Its goal was to
      consolidate optimized inner-loop code that multimedia applications and libraries
      often carried privately.
    - >
      The freedesktop.org download directory shows a compact release line from 0.2.0 and
      0.3.x in 2005 through 0.3.17 in February 2010. After that period, Orc, the Oil
      Runtime Compiler, became the successor project for generating and executing
      SIMD-style inner loops.
  related-projects:
    - Orc, the Oil Runtime Compiler, is documented by its project as the successor to liboil.
    - >
      GStreamer is closely related through Orc stewardship and through the multimedia
      use cases that made optimized inner loops valuable.
    - >
      Altivec, MMX, SSE, NEON, and similar SIMD instruction families are the hardware
      context behind liboil and Orc.
  sources:
    - https://cgit.freedesktop.org/liboil
    - https://formulae.brew.sh/formula/liboil
    - https://github.com/GStreamer/orc
    - https://gstreamer.freedesktop.org/modules/orc.html
    - https://liboil.freedesktop.org/download/
    - https://liboil.freedesktop.org/wiki/
  summary:
    - >
      liboil, the Library of Optimized Inner Loops, is a freedesktop.org-era C library
      of simple CPU-optimized routines. It collected small loops such as array
      conversion, multiplication, summing, and other SIMD-friendly operations behind a
      reusable API.
  timeline:
    - >
      2005: freedesktop.org download directory records liboil 0.2.0, 0.2.1, 0.2.2, and
      the early 0.3.x series.
    - '2006: freedesktop.org download directory records releases through liboil 0.3.10.'
    - '2008: freedesktop.org download directory records liboil 0.3.13, 0.3.14, and 0.3.15.'
    - '2010: freedesktop.org download directory records liboil 0.3.17.'
    - '2010s: Orc is documented as the successor to liboil.'
  usage:
    - >
      Developers used liboil as a C library for optimized primitive operations. Package
      users mostly encountered it indirectly as a dependency, with oil-bugreport
      available as a diagnostic executable.
    - >
      The library is relevant when building older multimedia stacks or software that
      still depends on the liboil API rather than Orc.
related-packages:
  - id: brew:orc
    reason: >
      Choose ORC for new portable SIMD inner-loop work because GStreamer documents it as
      Liboil's replacement and ORC identifies itself as Liboil's successor.
    rel: alternative
