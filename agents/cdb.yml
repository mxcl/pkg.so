history:
  adoption-history:
    - >
      cdb's adoption has been unusually long-lived for a tiny database format. The
      official site lists independent support packages and bindings in Perl, Ruby, Go,
      Rust, Python/Node wrappers through cdb64-rs, and TinyCDB wrappers. The Homebrew
      input also records cdb packages in Homebrew, MacPorts, and Nix.
  package-nerd-significance:
    - >
      For package nerds, cdb is part of the D. J. Bernstein software lineage and a
      canonical example of a tiny, stable file format that escaped its original
      codebase. Its appeal is the combination of predictable lookup behavior, crash-safe
      replacement, public-domain-style licensing in packaged builds, and easy
      reimplementation in many languages.
  project-history:
    - >
      The official cdb site describes cdb as a fast, reliable, simple package for
      creating and reading constant databases, with successful lookups in large
      databases normally taking two disk accesses and unsuccessful lookups one. The
      official format page republishes Bernstein's original 19960914 document, 'A
      structure for constant databases,' which defines the core cdb file layout, hash
      tables, records, little-endian 32-bit quantities, and hash function.
    - >
      The official download page records cdb-0.55 on 1996-09-22 as the first release,
      cdb-0.70 on 2000-02-17 as an almost complete API rewrite with mmap suggested by
      Ken Lalonde, cdb-0.75 on 2000-02-19 as a bug-fix and performance release, and a
      2025-10-21 release adding cdb64 support, configure/make install support, and
      updated documentation.
  related-projects:
    - >
      The official intro page lists cdb64, cdb64-rs, CDB_File, cdb-full, CDB::TinyCDB,
      and Go implementations as packages that support the cdb or cdb64 formats.
  sources:
    - https://cdb.cr.yp.to/
    - https://cdb.cr.yp.to/cdb.html
    - https://cdb.cr.yp.to/cdbmake.html
    - https://cdb.cr.yp.to/format.html
    - https://formulae.brew.sh/api/formula/cdb.json
    - https://cdb.cr.yp.to/download.html
  summary:
    - >
      cdb is D. J. Bernstein's constant database package: a small file format and
      toolset for creating immutable key-value databases with fast lookups and atomic
      replacement. It is aimed at workloads where data is rebuilt wholesale and then
      read many times.
  timeline:
    - '1996-09-14: Original cdb format document date on the official format page.'
    - '1996-09-22: cdb-0.55 first release on the official download page.'
    - '2000-02-17: cdb-0.70 rewrote almost everything from scratch and incorporated mmap.'
    - '2000-02-19: cdb-0.75 fixed a database creation bug and improved cdbmake performance.'
    - '2025-10-21: Official release added cdb64 support and modern configure/install support.'
  usage:
    - >
      cdb is used when a program needs a compact, immutable lookup table that can be
      regenerated atomically. The package includes cdbmake for building databases,
      cdbget for lookup, cdbdump for dumping records, cdbstats for inspection, and a C
      read API documented on the official site.
related-packages:
  - id: brew:tinycdb
    reason: >
      Choose TinyCDB when you want a compact compatible cdb implementation with a small
      library and utility set while retaining the constant-database workflow and file
      format.
    rel: alternative
    sources:
      - https://www.corpit.ru/mjt/tinycdb.html
      - https://cdb.cr.yp.to/
