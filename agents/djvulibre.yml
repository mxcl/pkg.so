id: brew:djvulibre
display-name: DjVuLibre
repo: https://sourceforge.net/p/djvu/djvulibre-git/ci/master/tree
docs:
  - https://djvu.sourceforge.net/
  - https://djvu.sourceforge.net/doc/index.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official DjVuLibre site describes DjVu as being used by hundreds of academic,
      commercial, governmental, and non-commercial sites, and lists distribution
      availability through Fedora, openSUSE, Debian, Ubuntu, Windows, and Mac OS
      packages.
  package-nerd-significance:
    - >
      DjVuLibre matters in package collections because it is both an archival-document
      utility suite and the reusable library behind many DjVu workflows. It is the
      package that turns a historically web-centric scanned-document format into normal
      Unix command-line plumbing.
  project-history:
    - >
      DjVu was originally developed at AT&T Labs-Research and was sold to LizardTech in
      March 2000. LizardTech released the reference implementation under the GNU GPL in
      October 2000, after which DjVuLibre continued as an enhanced open source version
      maintained by original DjVu inventors.
  related-projects:
    - The official site lists DjView4, JavaDjVu, and DjvuDigital as related DjVu projects.
  sources:
    - https://djvu.sourceforge.net/
    - https://sourceforge.net/p/djvu/djvulibre-git/ci/master/tree/
  summary:
    - >
      DjVuLibre is the open source implementation of DjVu, a document-image format and
      software platform aimed at fast distribution of scanned documents, digital
      documents, and high-resolution images.
  timeline:
    - '2000-03: AT&T sold DjVu to LizardTech.'
    - '2000-10: LizardTech released the reference implementation under the GNU GPL.'
    - '2026-05: DjVuLibre 3.5.30 was released.'
  usage:
    - >
      Package users get a broad command-line toolkit for creating, inspecting,
      assembling, extracting, decoding, and converting DjVu documents, plus the C++ DjVu
      reference library. The source README also notes that most users on macOS can
      install the Homebrew package directly.
related-packages:
  - id: brew:djview4
    reason: >
      DjView4 is the official separately packaged portable GUI built on DjVuLibre,
      making it the natural desktop viewer beside the library and command-line suite.
    rel: adjacent_workflow
    sources:
      - https://djvu.sourceforge.net/
      - https://djvu.sourceforge.net/djview4.html
  - id: brew:minidjvu
    reason: >
      Choose minidjvu for a smaller, experimental tool focused specifically on
      black-and-white JB2 DjVu encoding and decoding rather than DjVuLibre's full format
      support.
    rel: alternative
    sources:
      - https://minidjvu.sourceforge.net/
      - https://djvu.sourceforge.net/doc/index.html
  - id: brew:djvu2pdf
    reason: >
      djvu2pdf uses DjVuLibre's command-line tools together with Ghostscript when the
      desired output is a PDF rather than another DjVu artifact.
    rel: adjacent_workflow
    sources:
      - https://0x2a.at/site/projects/djvu2pdf
      - https://djvu.sourceforge.net/doc/index.html
