history:
  adoption-history:
    - >
      Link Grammar has persisted as a niche but long-lived NLP package because it
      combines an academic grammar formalism with runnable dictionaries and a small
      interactive parser. Its presence in Unix package managers keeps the CMU parser
      available for experiments, symbolic NLP systems, dictionary work, and regression
      tests even as statistical and neural NLP methods became dominant.
  package-nerd-significance:
    - >
      Link Grammar is package-nerd catnip because it is an old academic parser that
      still builds as a normal Unix package. It carries dictionaries, generated data, C
      libraries, bindings, man pages, and CLI tools, preserving a pre-deep-learning
      branch of NLP in a form that can still be installed with a package manager.
  project-history:
    - >
      The theory was developed in 1991 by Davy Temperley, John Lafferty, and Daniel
      Sleator at Carnegie Mellon University. The project's README points to the original
      1991 CMU technical report, a 1993 parsing workshop paper, and a 1995 robust
      parsing paper as the foundational publications.
    - >
      The modern package is a continuation of the original CMU parser but has diverged
      substantially from the early code base. The README describes major engineering
      evolution: extensive bug fixes, orders-of-magnitude performance work, full
      multithreading, UTF-8 support, security cleanup for cloud deployment, improved
      English coverage, and added languages including Thai and Russian.
  related-projects:
    - >
      Related projects include the original CMU Link Grammar parser, OpenCog Language
      Learning, the link-generator tool, and downstream NLP systems that prefer symbolic
      grammar structures over purely statistical parsers.
  sources:
    - https://github.com/opencog/link-grammar
    - https://github.com/opencog/link-grammar/blob/master/AUTHORS
    - https://github.com/opencog/link-grammar/blob/master/README.md
    - https://www.cs.cmu.edu/afs/cs.cmu.edu/project/link/pub/www/papers/ps/LG-IWPT93.ps
    - https://www.cs.cmu.edu/afs/cs.cmu.edu/project/link/pub/www/papers/ps/tr95-125.ps
  summary:
    - >
      Link Grammar is the CMU Link Grammar natural-language parser packaged as
      libraries, dictionaries, and command-line tools. It turns sentences into
      graph-like typed links between words, with conversions to more conventional
      phrase-structure and dependency views.
  timeline:
    - >
      1991: Temperley, Lafferty, and Sleator developed the Link Grammar theory at
      Carnegie Mellon University.
    - >
      1991: The CMU-CS-91-196 technical report Parsing English with a Link Grammar was
      published.
    - >
      1993: Sleator and Temperley presented Parsing English with a Link Grammar at the
      Third International Workshop on Parsing Technologies.
    - >
      1995: Grinberg, Lafferty, and Sleator published A Robust Parsing Algorithm for
      Link Grammars.
    - >
      5.9.0: The package added an experimental sentence-generation system exposed
      through link-generator.
  usage:
    - >
      The package includes language dictionaries, APIs for multiple programming
      languages, and command-line tools such as link-parser and link-generator. The
      interactive parser is useful for inspecting linkages and costs by hand, while the
      library form lets other NLP systems consume the parser programmatically.
