history:
  adoption-history:
    - >
      Bungie's original game data is now distributed in a ready-to-run release powered
      by Aleph One. The official project offers macOS, Windows, and Linux packages,
      allowing the formerly classic-Mac title to remain usable on contemporary systems.
    - >
      In package-manager culture, the dedicated Homebrew cask recorded in
      source_facts.package-manager provides the complete first game as a distinct
      application even though it shares an engine project with both sequels.
  package-nerd-significance:
    - >
      Marathon is a prominent preservation package: historical game data and a
      community-maintained, GPL-licensed engine are assembled into a modern desktop
      application. Its separate scenario-specific preference and support paths matter
      when packaging the trilogy side by side.
  project-history:
    - >
      Marathon originated at Bungie as the first game in the Marathon science-fiction
      shooter trilogy. The modern package runs its original data files with Aleph One,
      the open-source continuation of Bungie's Marathon 2 engine.
  related-projects:
    - >
      Marathon 2: Durandal and Marathon Infinity continue the trilogy and are separately
      packaged.
    - >
      Aleph One is the shared open-source engine and supports third-party scenarios,
      maps, plugins, Lua scripting, and MML.
  sources:
    - Input field source_facts.package-manager
    - 'Official Aleph One homepage: https://alephone.lhowon.org/'
    - 'Official Aleph One wiki: https://github.com/Aleph-One-Marathon/alephone/wiki'
    - 'Official Marathon page: https://alephone.lhowon.org/games/marathon.html'
    - 'Official engine repository: https://github.com/Aleph-One-Marathon/alephone'
    - >
      Official file-location documentation:
      https://github.com/Aleph-One-Marathon/alephone/wiki/File-Locations
  summary:
    - >
      Marathon is the first entry in Bungie's science-fiction first-person-shooter
      trilogy. The contemporary package combines the original Marathon data with the
      Aleph One engine for modern systems.
  timeline:
    - "Original era: Bungie released Marathon as the trilogy's opening game."
    - >
      Open-source era: Aleph One continued the Marathon 2 engine and gained support for
      the complete trilogy.
    - >
      Modern distribution: The official project supplies ready-to-run packages for
      macOS, Windows, and Linux.
  usage:
    - >
      Players install the all-in-one application and launch its single-player campaign
      using the original Marathon assets. Aleph One also supplies configurable controls,
      saved games, recordings, screenshots, plugins, and peer-to-peer multiplayer
      facilities.
