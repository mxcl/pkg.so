history:
  adoption-history:
    - >
      Optimus Player targets Mac users who retain local audiovisual collections or need
      formats and codecs not handled consistently by subscription-streaming
      applications. Its documented audience includes users concerned with color
      fidelity, subtitles, accessibility, and playback of older or unusual media.
  package-nerd-significance:
    - >
      The application combines a native macOS interface with FFmpeg's broad demuxer and
      codec support. Its emphasis on managed color output, hardware decoding, dual
      subtitles, VoiceOver, and synchronized AirPlay 2 audio distinguishes it from more
      generic cross-platform players.
  project-history:
    - >
      The developer spent six months building the first production release after leaving
      full-time employment. Version 1.0 focused on accurate color, experimental AirPlay
      2 audio, dual subtitles, and broad format support through FFmpeg.
    - >
      Later 1.x releases added AV1 and GIF playback, media-key integration, customizable
      navigation and playback rate, Big Sur compatibility, native Apple-silicon support,
      Picture in Picture, Spatial Audio, and automatic discovery of adjacent subtitle
      files.
  related-projects:
    - FFmpeg supplies the underlying libraries used for hundreds of formats and codecs.
    - >
      VLC is an adjacent general-purpose media player discussed in the official site's
      color-output comparison.
    - >
      Apple media technologies provide hardware acceleration, color management, Now
      Playing, VoiceOver, Picture in Picture, and AirPlay integration.
  sources:
    - https://www.optimusplayer.com/
    - https://www.optimusplayer.com/download/
    - https://www.optimusplayer.com/faq/
  summary:
    - >
      Optimus Player is a native macOS player for local audio and video, built on FFmpeg
      and designed around format breadth, accurate color, subtitles, accessibility, and
      Apple-platform playback features.
  timeline:
    - >
      Version 1.0: Optimus Player debuted with color management, experimental AirPlay 2
      audio, and dual subtitles.
    - >
      Version 1.1: Added AV1, GIF, media controls, and built-in AirPlay 2 support on
      newer macOS releases.
    - 'Version 1.2: Added playback-rate and navigation customization.'
    - 'Version 1.3: Added initial macOS Big Sur support.'
    - >
      Version 1.5: Added native Apple-silicon support, Picture in Picture, Spatial
      Audio, and automatic subtitle discovery.
  usage:
    - >
      Users open local media files in formats such as MP4, MKV, and Ogg. The player
      supports external and simultaneous dual subtitle tracks, keyboard and gesture
      navigation, hardware decoding where available, HDR output, VoiceOver, and
      synchronized audio streaming to multiple AirPlay 2 devices.
