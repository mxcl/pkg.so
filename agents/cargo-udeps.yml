history:
  adoption-history:
    - >
      GitHub records the repository as created in August 2019, and crates.io records the
      first release shortly after. The README lists Nix/NixOS, Arch Linux, and Homebrew
      packages; the input package facts also list Alpine.
  package-nerd-significance:
    - >
      cargo-udeps is useful to maintainers because unused dependencies affect build
      time, dependency graphs, packaging policy, and audit surface; its README trophy
      case records real projects where unused dependencies were removed.
  project-history:
    - >
      The official README says cargo-udeps finds unused dependencies in Cargo.toml and
      needs Rust nightly to run, while compiling on stable.
  related-projects:
    - >
      The README links deps.rs status and lists downstream projects where cargo-udeps
      found unused dependencies.
