  summary:
    - >
      cargo-udeps is a Cargo subcommand for finding unused dependencies declared in
      Cargo.toml.
  timeline:
    - '2019: GitHub repository created and first crates.io release recorded.'
    - '2026: crates.io records max_version 0.1.61.'
  usage:
    - >
      The README documents `cargo +nightly udeps`, package and workspace Cargo.toml
      metadata for ignore lists, and pre-commit hook usage.
