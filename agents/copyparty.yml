id: brew:copyparty
display-name: copyparty
repo: https://github.com/9001/copyparty
docs:
  - https://github.com/9001/copyparty#readme
config-file-location:
  unix:
    - copyparty.conf
    - ~/.config/copyparty/copyparty.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      copyparty's adoption comes from the self-hosting and ad-hoc file-transfer niche:
      users can run it locally, on a home server, on a VPS, or from a single
      self-contained script. Packaging in Homebrew, Alpine, Arch, Nix, and Windows
      package indexes reflects its spread beyond a pure GitHub download workflow.
  package-nerd-significance:
    - >
      For package nerds, copyparty is interesting because it is deliberately portable
      and dependency-light while still exposing many server features. That makes
      distribution packaging less about a complex dependency tree and more about
      shipping the Python entry points, optional extras, and documentation for a
      surprisingly broad file-server surface.
  project-history:
    - >
      The public repository was created in 2019 and presents copyparty as a way to turn
      almost any device into a file server using any web browser. The project emphasizes
      portability: the server needs only Python, supports Python 2 and 3, and treats
      most extra capabilities as optional dependencies.
    - >
      Over time the project grew from a lightweight browser file-sharing tool into a
      multi-protocol personal file server with resumable uploads, deduplication, WebDAV,
      SFTP, FTP, TFTP, media playback, thumbnails, file search, and a small companion
      toolset.
  related-projects:
    - >
      copyparty sits near personal file servers, browser upload tools, WebDAV servers,
      FTP/SFTP servers, media indexers, and self-hosting utilities rather than a single
      upstream ecosystem.
  sources:
    - https://github.com/9001/copyparty
    - https://github.com/9001/copyparty#readme
    - https://github.com/9001/copyparty/releases
    - https://github.com/9001/copyparty/blob/hovudstraum/docs/versus.md
  summary:
    - >
      copyparty is a portable Python file server that bundles browser uploads and
      downloads, WebDAV, FTP, SFTP, TFTP, media indexing, thumbnails, search, and
      optional single-file execution into one project. Its history is mostly documented
      through its repository, README, and release stream rather than a formal
      project-history page.
  timeline:
    - '2019: 9001/copyparty repository created.'
    - >
      2020s: README documents growth into HTTP, WebDAV, SFTP, FTP, TFTP, SMB/CIFS, media
      indexing, thumbnails, search, and browser-file-management features.
    - '2026: v1.20.x releases show continued active upstream maintenance.'
  usage:
    - >
      Typical use is to start a copyparty process that exposes one or more directories
      through a browser UI and optional network protocols. Configuration can be supplied
      through command-line arguments or config files such as copyparty.conf and
      ~/.config/copyparty/copyparty.conf; accounts and per-volume permissions are
      configured inside that server configuration rather than through a separate
      credential store.
related-packages:
  - id: brew:filebrowser
    reason: >
      Choose File Browser for a more efficient single-binary web file manager with a
      settings GUI and user signup; choose copyparty when WebDAV, FTP, SFTP, richer
      indexing, or accelerated integrity-checked uploads matter.
    rel: alternative
    sources:
      - https://github.com/9001/copyparty/blob/hovudstraum/docs/versus.md
      - https://filebrowser.org/
  - id: brew:rclone
    reason: >
      Choose rclone when broad cloud-storage and protocol support is more important than
      copyparty's full browser UI, media features, and resumable upload pipeline; rclone
      can also expose storage through WebDAV.
    rel: alternative
    sources:
      - https://github.com/9001/copyparty/blob/hovudstraum/docs/versus.md
      - https://rclone.org/commands/rclone_serve_webdav/
