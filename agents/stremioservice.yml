history:
  adoption-history:
    - >
      Stremio distributes the service for macOS, Windows, Debian/Ubuntu, Red Hat-family
      systems, Flatpak, and Docker, allowing Stremio Web to use native streaming
      capabilities across several desktop deployment styles.
    - >
      The v0.1 release line remains labeled alpha on the official download page,
      indicating that it is an actively developed companion rather than a replacement
      for every integrated Stremio client.
  package-nerd-significance:
    - >
      Stremio Service separates the native streaming engine from the browser-based
      Stremio interface. This lets a small background package provide local HTTP/HTTPS
      streaming, media processing, and BitTorrent-related capabilities that browsers
      cannot supply directly.
    - >
      Its packaging spans conventional desktop installers, distribution packages,
      Flatpak, and containers. The official Docker project exposes APP_PATH so
      administrators can choose where server settings and certificates are stored.
  project-history:
    - >
      Stremio Service emerged as the standalone companion backend for Stremio Web. Its
      official repository packages a Rust launcher together with the Stremio runtime,
      server code, FFmpeg, and FFprobe.
    - >
      The public v0.1 release series was being distributed by 2023 and has continued
      with signed installers and packages maintained through the official Stremio GitHub
      organization.
  related-projects:
    - Stremio Web is the primary browser client paired with Stremio Service.
    - >
      The official Stremio server-docker project packages the streaming server for
      container deployment.
    - >
      Stremio's desktop and television applications provide other integrated ways to use
      the wider Stremio platform.
  sources:
    - https://github.com/Stremio/server-docker
    - https://github.com/Stremio/stremio-service
    - https://github.com/Stremio/stremio-service/releases
    - https://www.stremio.com/
    - https://www.stremio.com/download-service
  summary:
    - >
      Stremio Service is Stremio's official native companion for Stremio Web. It runs
      the local streaming backend and bundles the runtime and media-processing
      components needed for capabilities unavailable to a browser alone.
  timeline:
    - '2023: The public v0.1 release series was distributed for desktop platforms.'
    - '2024: Version 0.1.13 continued signed installer and multi-platform package maintenance.'
    - '2025: Version 0.1.14 updated Flatpak integration and desktop behavior.'
    - '2026: The v0.1 series continued with updated runtime and cross-platform releases.'
  usage:
    - >
      Users install and run Stremio Service alongside Stremio Web; the web client
      connects to the local service for streaming and media-processing functions.
    - >
      Desktop packages are intended to run as a companion application. Container users
      can expose the documented HTTP and HTTPS ports and set APP_PATH to a persistent
      directory.
    - >
      The official desktop-service README does not document a stable per-platform
      configuration filename or a distinct credentials file, so neither location is
      asserted here.
