config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Avro became common in data-engineering environments because it carries schemas
      with serialized data and supports schema evolution. Apache's current project site
      describes Avro as a leading serialization format for record data and a first
      choice for streaming data pipelines, with implementations across JVM languages,
      Python, C/C++, C#, PHP, Ruby, Rust, JavaScript, and Perl.
    - >
      The C package is a practical packaging target for users who need small native
      tools or C library integration without pulling in the Java toolchain. On Unix
      package managers it fills the niche between the full Java avro-tools jar and
      embedding Avro support in larger data platforms.
  package-nerd-significance:
    - >
      For package nerds, avro-c is interesting because it is a native-library subpackage
      split out of a multi-language Apache project. It gives Homebrew, Nix, and
      Debian-style systems a way to install Avro's C ABI and CLI utilities without
      treating the whole project as a Java artifact.
    - >
      It also shows the awkward but useful boundary between data-format standards and
      language ecosystems: one upstream release, many language bindings, and multiple
      downstream formulas for the same specification.
  project-history:
    - >
      Apache Avro's first official release was Avro 1.0.0 on July 15, 2010. The project
      was framed from the start as a serialization system with rich data structures,
      compact binary encoding, object container files, RPC support, and language
      bindings where code generation is optional rather than mandatory.
    - >
      The C implementation lives in the main Apache Avro repository rather than a
      separate project. That matters for packagers: language bindings, command-line
      tools, release artifacts, and the shared Avro specification move together under
      the Apache release process.
  related-projects:
    - Apache Avro Java and avro-tools share the same upstream repository and specification.
    - Avro C++ is the neighboring native binding for C++ programs and code generation.
    - >
      Apache Hadoop, Kafka-oriented data pipelines, and other record-processing systems
      are common consumers of Avro data, though they package their own integrations
      separately.
  sources:
    - https://avro.apache.org/
    - https://avro.apache.org/blog/2010/07/15/avro-1.0.0/
    - https://avro.apache.org/blog/releases/
    - https://avro.apache.org/docs/
    - https://github.com/apache/avro
    - source_facts.executables
  summary:
    - >
      Avro C is the C implementation and command-line tooling slice of Apache Avro,
      Apache's schema-based data serialization system. In Homebrew it exposes utilities
      such as avrocat, avroappend, avropipe, and avromod for working with Avro object
      container files from a Unix shell.
  timeline:
    - '2010: Apache Avro 1.0.0 announced as the first Avro release.'
    - '2021: Avro 1.11.0 released with 120 JIRA issues addressed.'
    - '2024: Avro 1.12.0 released by the Apache Avro community.'
    - '2025: Avro 1.12.1 listed as the latest Apache Avro release.'
  usage:
    - >
      The C utilities are mostly file and stream tools: avrocat inspects or emits
      records, avroappend appends data to container files, avropipe moves Avro data
      through pipelines, and avromod edits Avro container metadata. They are useful in
      shell workflows where the Java avro-tools package would be heavier than necessary.
    - >
      There is no standard per-user configuration file or credential store for Avro C
      itself. Behavior is driven by schemas, Avro container metadata, command-line
      arguments, and application code using the C API.
related-packages:
  - id: brew:avro-tools
    reason: >
      Use Avro Tools alongside the C library when a workflow needs the broader Java CLI
      for schema compilation, JSON conversion, file inspection, metadata operations, or
      repair.
    rel: adjacent_workflow
    sources:
      - https://avro.apache.org/docs/1.12.0/api/java/org/apache/avro/tool/package-summary.html
      - https://avro.apache.org/docs/1.8.0/api/c/index.html
  - id: brew:avro-cpp
    reason: >
      Choose Avro C++ instead when the application is written in C++ and benefits from
      generated C++ record types and the `avrogencpp` workflow.
    rel: alternative
    sources:
      - https://avro.apache.org/docs/1.12.0/api/cpp/html/index.html
      - https://avro.apache.org/docs/1.8.0/api/c/index.html
