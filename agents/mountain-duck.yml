id: cask:mountain-duck
display-name: Mountain Duck
repo: null
docs:
  - https://docs.mountainduck.io/
config-file-location:
  macos:
    - ~/Library/Group Containers/G69SCX94XU.duck/Library/Application Support/duck/
  windows:
    - '%AppData%\Cyberduck'
credentials-file-location:
  macos:
    - macOS Keychain
  windows:
    - Windows Credential Manager
history:
  adoption-history:
    - >
      Mountain Duck serves users who want SFTP, WebDAV, object storage, and cloud-drive
      content exposed through the operating system's normal file manager. Shared
      bookmarks with Cyberduck support workflows that combine mounted access with a
      dedicated transfer client.
  package-nerd-significance:
    - >
      Mountain Duck packages broad remote-storage protocol support behind a desktop
      filesystem interface. Its shared configuration with Cyberduck and use of the open
      Cyberduck core make it notable within the wider Cyberduck tool family.
  project-history:
    - >
      iterate GmbH released Mountain Duck 1.0 in January 2016 for macOS and Windows. The
      product was built on Cyberduck's open-source core libraries and mounted remote
      storage in Finder or File Explorer.
    - >
      Subsequent major releases expanded synchronization, offline access, cloud-provider
      support, and Cryptomator interoperability while retaining shared bookmarks and
      credentials with Cyberduck.
  related-projects:
    - Cyberduck
    - Cyberduck CLI
    - Cryptomator
  sources:
    - >
      Official Cyberduck repository, whose core libraries are used by Mountain Duck:
      https://github.com/iterate-ch/cyberduck
    - 'Official changelog: https://mountainduck.io/changelog/'
    - 'Official documentation overview: https://docs.mountainduck.io/'
    - >
      Official installation and storage documentation:
      https://docs.mountainduck.io/mountainduck/installation/
  summary:
    - >
      Mountain Duck is a commercial macOS and Windows application from iterate GmbH that
      mounts remote servers and cloud storage as local disks.
  timeline:
    - '2016: Mountain Duck 1.0 was released.'
    - '2017: Mountain Duck 2.0 was released as a paid major upgrade.'
    - '2019: Mountain Duck 3.0 expanded its synchronization-oriented workflow.'
    - '2020: Mountain Duck 4.0 was released.'
  usage:
    - >
      Users create bookmarks for services such as SFTP, WebDAV, Amazon S3, Azure,
      OneDrive, Dropbox, and other supported storage systems, then work with the mounted
      files through Finder or File Explorer.
    - >
      Bookmarks, connection profiles, and history reside in the shared Cyberduck
      application-support directory. Saved login data uses Keychain on macOS or
      Credential Manager on Windows.
