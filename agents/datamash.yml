id: brew:datamash
display-name: GNU Datamash
repo: https://git.savannah.gnu.org/gitweb?p=datamash.git
docs:
  - https://www.gnu.org/software/datamash/manual/datamash.html
  - https://www.gnu.org/software/datamash/manual/html_node/index.html
  - https://www.gnu.org/software/datamash
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Its adoption is tied to shell users who want spreadsheet-like aggregations without
      leaving pipes. The GNU project page and manual make it available as a documented
      GNU package with a Savannah source repository.
  package-nerd-significance:
    - >
      For package nerds, Datamash fills the gap between classic text filters and heavier
      data tools: it is a tiny install that adds statistics to POSIX-flavored shell
      workflows.
  project-history:
    - >
      Datamash entered the GNU ecosystem as a small Unix-style data tool: it keeps the
      pipeline model of tools such as `sort`, `cut`, and `uniq`, but adds grouped
      statistics and table-oriented operations.
  related-projects:
    - >
      Core GNU text utilities such as `sort`, `cut`, and `uniq` are close companions in
      the same pipeline style.
  sources:
    - https://www.gnu.org/software/datamash
    - https://www.gnu.org/software/datamash/manual/datamash.html
    - https://git.savannah.gnu.org/gitweb?p=datamash.git
  summary:
    - >
      GNU Datamash is a GNU command-line program for numeric, textual, and statistical
      operations on delimited text files.
  timeline:
    - '2014: GNU Datamash is documented as part of the GNU software collection.'
    - '2025: GNU Datamash 1.9 is listed in project release notes.'
  usage:
    - >
      Typical package use is in scripts and one-off terminal pipelines, where `datamash`
      can group fields, calculate summary statistics, transpose data, and transform
      tabular text.
related-packages:
  - id: brew:miller
    reason: >
      Choose Miller when records have named fields or formats such as CSV, TSV, JSON,
      DKVP, or XTAB and you need chained filtering, joins, transformation, and grouped
      statistics beyond Datamash's delimiter-oriented statistical pipeline.
    rel: alternative
    sources:
      - https://www.gnu.org/software/datamash/manual/datamash.html
      - https://miller.readthedocs.io/en/latest/misc-examples/
      - https://miller.readthedocs.io/en/latest/reference-verbs/
  - id: brew:csvkit
    reason: >
      Choose csvkit when the workflow is specifically CSV-centric and needs a suite for
      conversion, querying, inspection, and descriptive column statistics rather than
      Datamash's broader Unix-text aggregation syntax.
    rel: alternative
    sources:
      - https://www.gnu.org/software/datamash/
      - https://csvkit.readthedocs.io/en/latest/
      - https://csvkit.readthedocs.io/en/latest/scripts/csvstat.html
