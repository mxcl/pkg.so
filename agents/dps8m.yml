history:
  adoption-history:
    - >
      DPS8M's adoption is primarily in retrocomputing, operating-system preservation,
      and Multics study rather than ordinary application development. Packaging in
      Homebrew and Nix gives users a repeatable way to install a simulator that would
      otherwise live mostly in source builds and specialist documentation.
  package-nerd-significance:
    - >
      For package nerds, DPS8M is interesting because it packages a historically
      specific mainframe simulator with multiple utilities, generated cross-reference
      documentation, and release-specific omnibus manuals, tying modern Unix package
      management to preserved 36-bit computing environments.
  project-history:
    - >
      The project presents itself as the DPS8M Simulator and credits the DPS8M
      Development Team across 2006-2025 in its README. Its GitLab project was created in
      February 2019, consistent with a later public hosting home for a longer-lived
      simulator codebase.
  related-projects:
    - Multics
    - SIMH
    - GE-645
    - Honeywell 6180
    - Bull DPS-8/M
  sources:
    - https://gitlab.com/dps8m/dps8m
    - https://gitlab.com/dps8m/dps8m/-/raw/master/README.md
    - https://dps8m.gitlab.io/dps8m/Documentation/
    - https://gitlab.com/api/v4/projects/dps8m%2Fdps8m
    - https://gitlab.com/api/v4/projects/dps8m%2Fdps8m/repository/tags?per_page=100
  summary:
    - >
      DPS8M is a simulator for the 36-bit GE, Honeywell, and Bull 600/6000-series
      mainframes, especially the DPS-8/M line descended from GE-645 hardware and
      associated with running Multics.
  timeline:
    - >
      2006: the project README's copyright range begins, indicating the long-running
      development team history.
    - '2016: early alpha and release-candidate tags were present in the GitLab tag history.'
    - '2019: the GitLab project record was created.'
    - >
      2025: official documentation listed release-specific manuals for R3.0.0, R3.0.1,
      and R3.1.0.
  usage:
    - >
      Users build or install the simulator, then run dps8 and companion utilities such
      as tape and printer conversion tools. The official documentation is aimed at end
      users, operators, developers, and package maintainers, covering installation,
      compilation, configuration, operation, and troubleshooting.
