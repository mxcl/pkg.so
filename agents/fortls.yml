id: brew:fortls
display-name: fortls
repo: https://github.com/fortran-lang/fortls
docs:
  - https://fortls.fortran-lang.org/
config-file-location:
  unix:
    - root_path/.fortlsrc
    - root_path/.fortls.json
    - root_path/.fortls
credentials-file-location: null
history:
  adoption-history:
    - >
      fortls is designed for any editor that supports LSP. The official README names
      Visual Studio Code, Atom, Sublime Text, Vim/Neovim/gVim, and Emacs integrations,
      reflecting adoption through editor plugins rather than only command-line
      invocation.
  package-nerd-significance:
    - >
      fortls is significant because it gives Fortran the same LSP packaging shape
      familiar from newer language ecosystems: a standalone server executable, Python
      package distribution, conda-forge availability, editor-neutral protocol support,
      and project-local configuration.
  project-history:
    - >
      The fortran-lang/fortls repository was created in October 2021. The README says
      the project was originally based on hansec/fortran-language-server, but later
      diverged and is now developed independently with additional features and fixes.
    - >
      The official README also states that fortls has reached a feature-complete and
      stable maintenance phase while Fortran-lang work explores a newer language server
      based on LFortran for deeper syntax understanding.
  related-projects:
    - >
      fortls is historically related to hansec/fortran-language-server and is part of
      the Fortran-lang ecosystem. The README points to future LFortran-based
      language-server work as the planned path for deeper Fortran syntax and semantic
      support.
  sources:
    - https://api.github.com/repos/fortran-lang/fortls
    - https://api.github.com/repos/fortran-lang/fortls/releases?per_page=20
    - https://fortls.fortran-lang.org/
    - https://fortls.fortran-lang.org/fortls_changes.html
    - https://fortls.fortran-lang.org/options.html
    - https://github.com/fortran-lang/fortls
    - https://raw.githubusercontent.com/fortran-lang/fortls/master/README.md
  summary:
    - >
      fortls is the Fortran Language Server, a Python implementation of the Language
      Server Protocol for Fortran. It provides editor features such as symbols, hover,
      signature help, completion, go-to definition, references, rename, diagnostics, and
      code actions.
  timeline:
    - '2021: fortran-lang/fortls repository created.'
    - '2022: 2.x release series published.'
    - '2024: 3.0.0 release published.'
    - '2025: 3.2.2 release published.'
  usage:
    - >
      Users install fortls with pip or conda-forge and point an editor's LSP client at
      the fortls executable. Configuration can be supplied through command-line options
      or JSON configuration files such as .fortlsrc, .fortls.json, or .fortls at a
      project root.
related-packages:
  - id: brew:fortran-language-server
    reason: >
      Choose the original Fortran Language Server when maintaining an older integration
      tied to that implementation; fortls is its independently developed successor with
      additional features, but both install an executable named `fortls` and should not
      be installed together.
    rel: alternative
    sources:
      - https://github.com/fortran-lang/fortls
      - https://github.com/hansec/fortran-language-server
tags:
