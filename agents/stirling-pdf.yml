id: cask:stirling-pdf
display-name: Stirling PDF
repo: null
docs:
  - https://docs.stirlingpdf.com/
  - https://docs.stirlingpdf.com/Configuration
  - https://docs.stirlingpdf.com/Installation/Path%20Structure
config-file-location:
  linux:
    - ~/.config/Stirling-PDF/configs/settings.yml
  macos:
    - ~/Library/Application Support/Stirling-PDF/configs/settings.yml
  windows:
    - '%APPDATA%\Stirling-PDF\configs\settings.yml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The project says it grew from a weekend experiment posted to Reddit into a widely
      deployed PDF platform. It is distributed as a desktop application, self-hosted
      server, container image, Kubernetes deployment, and Java archive.
  package-nerd-significance:
    - >
      Stirling PDF is notable in self-hosting circles because it consolidates many PDF
      operations behind a locally deployable web interface and API. Its container-first
      distribution and persistent YAML configuration make it convenient to manage
      alongside other homelab services.
  project-history:
    - >
      Stirling PDF began as a 24-hour experiment by one engineer with four features. It
      evolved into an open-source PDF platform spanning a desktop client, browser
      interface, self-hosted server, automation pipelines, and private APIs.
  related-projects:
    - >
      Its implementation incorporates established document components including Apache
      PDFBox, LibreOffice, qpdf, PDF.js, and PDF-LIB.
  sources:
    - https://docs.stirlingpdf.com/Configuration/
    - https://github.com/Stirling-Tools/Stirling-PDF#readme
    - https://www.stirling.com/about
    - https://www.stirling.com/download
  summary:
    - >
      Stirling PDF is a privacy-oriented PDF editing and automation platform that can
      run locally, on a desktop, or on self-managed infrastructure.
  timeline:
    - >
      2023: The early Stirling PDF project gained public users through its open-source,
      self-hosted distribution.
    - '2025: Stirling V2 was introduced as a broader PDF platform.'
  usage:
    - >
      Users edit, merge, split, sign, redact, convert, OCR, and compress PDFs through
      the graphical interface. Operators commonly deploy the server in a container,
      persist its configs directory, and configure settings through the UI, environment
      variables, or settings.yml.
