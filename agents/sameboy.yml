history:
  adoption-history:
    - >
      SameBoy expanded from its original macOS release into an emulator with native
      Cocoa, SDL, libretro, iOS, watchOS, Windows, and Unix-like-platform support. Its
      core is also consumable as a library, widening its use beyond the standalone
      desktop application.
    - >
      The project emphasizes interoperability: its save states follow BESS, later
      releases preserve compatibility with older SameBoy states, and battery saves can
      interoperate with other emulators. The iOS frontend reached the App Store, while
      Homebrew provides a convenient macOS desktop installation path.
  package-nerd-significance:
    - >
      SameBoy combines an unusually accuracy-focused emulator core with multiple
      frontends, open boot ROMs, a debugger, a reusable library, and a libretro core.
      That makes it relevant to emulator users, Game Boy homebrew developers, reverse
      engineers, and distribution maintainers rather than only casual players.
    - >
      Its long, public release history and support for standard Unix installation
      variables such as PREFIX and DESTDIR make it a useful example of one codebase
      serving a macOS app, conventional Unix package layouts, Windows binaries, mobile
      frontends, and an embeddable core.
  project-history:
    - >
      SameBoy was created by Lior Halphon as an open-source emulator written in portable
      C. Version 0.1 was publicly released on April 1, 2016, initially with a macOS
      download and source code. Frequent releases steadily added Windows and SDL
      support, Super Game Boy emulation, more accurate hardware timing, libretro
      integration, mobile frontends, and developer tooling.
    - >
      Accuracy became the project’s defining focus. The official feature documentation
      reports complete passes across several established test-ROM suites and regular
      automated testing against thousands of games. Version 1.0, released in December
      2024, marked a stable documented core API and broadened the platform story to
      watchOS and modern desktop integration.
  related-projects:
    - libretro and RetroArch
    - BESS save-state format
    - SameSuite hardware test ROMs
    - RGBDS
    - mooneye-gb test suite
  sources:
    - https://github.com/LIJI32/SameBoy
    - https://sameboy.github.io/
    - https://sameboy.github.io/changelog/
    - https://sameboy.github.io/downloads/
    - https://sameboy.github.io/features/
  summary:
    - >
      SameBoy is an open-source, accuracy-oriented emulator for Game Boy-family systems.
      It provides native macOS and iOS interfaces, an SDL desktop frontend, a libretro
      core, a reusable C library, open boot ROMs, and an integrated debugger.
  timeline:
    - '2016: SameBoy 0.1 became the first public release.'
    - '2017: The release line added regular Windows downloads.'
    - '2019: SameBoy 0.12 introduced high-level Super Game Boy emulation.'
    - '2021: SameBoy adopted BESS-based interoperable save states in the 0.14 series.'
    - '2023: SameBoy 0.16 introduced a fully featured iOS frontend.'
    - '2024: SameBoy 1.0 shipped with a stable documented core API and watchOS support.'
  usage:
    - >
      Players open Game Boy ROMs through the Cocoa, SDL, iOS, or other supported
      frontends and use features such as battery saves, save states, rewind, link
      emulation, cheats, controller input, scaling filters, and color correction.
    - >
      Developers use the textual debugger, memory and video inspection tools, symbols,
      test automation, and the library API for homebrew debugging, hardware research,
      emulator validation, and embedding the core in other frontends.
