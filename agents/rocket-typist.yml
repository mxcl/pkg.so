history:
  adoption-history:
    - >
      Rocket Typist expanded from a Mac text-expansion workflow to macOS, iPhone, and
      iPad, with iCloud synchronization providing a shared snippet collection. The
      official product offers free and Pro tiers and supports imports from established
      tools and interchange formats including TextExpander, TypeIt4Me, CSV, and text.
    - >
      Version 3 rebuilt the interface in SwiftUI, rewrote iCloud integration, and
      broadened snippets beyond text to images and code. Version 3.2 added Smart
      Snippets backed by OpenAI, executable JavaScript snippets, case-adaptive
      expansion, and additional text-correction workflows.
  package-nerd-significance:
    - >
      Rocket Typist illustrates the modern evolution of the classic text-expander
      category: local keyboard automation is combined with Apple-platform
      synchronization, structured import and export, rich media, JavaScript execution,
      and optional remote AI processing.
    - >
      Its data model matters when moving or backing up installations. The official
      documentation distinguishes local storage from an iCloud-synchronized database and
      documents export formats, but it does not publish a fixed local database or
      configuration-file path.
  project-history:
    - >
      Witt Software developed Rocket Typist as an Apple-platform text expander centered
      on reusable snippets and abbreviations. Over successive major releases it gained
      macros, rich and image snippets, cross-device synchronization, mobile clients,
      JavaScript execution, and optional AI-powered Smart Snippets.
  related-projects:
    - TextExpander and TypeIt4Me are supported import sources.
    - Apple iCloud synchronizes snippet collections across supported devices.
    - OpenAI services are optionally used by Smart Snippets.
  sources:
    - >
      Official iCloud guide:
      https://www.witt-software.com/rockettypist/help/en.lproj/Page4.html
    - 'Official manual: https://www.witt-software.com/rockettypist/help/en.lproj/index.html'
    - >
      Official privacy notes:
      https://www.witt-software.com/rockettypist/help/en.lproj/Page0.html
    - 'Official product page: https://www.witt-software.com/rockettypist/'
    - >
      Official quick start:
      https://www.witt-software.com/rockettypist/help/en.lproj/Page1.html
  summary:
    - >
      Rocket Typist is a text-expansion and snippet-management application for Mac,
      iPhone, and iPad. It inserts reusable text, formatted content, images, code, and
      macro-driven content through abbreviations, shortcuts, menus, or its mobile
      keyboard.
  timeline:
    - >
      Version 3.0: Rocket Typist added iPhone and iPad support, rebuilt iCloud
      synchronization, adopted SwiftUI, and introduced image and code snippets.
    - >
      Version 3.2: Smart Snippets, executable JavaScript, case-adaptive expansion, text
      correction, and a selection macro were introduced.
  usage:
    - >
      Users create snippets, assign abbreviations or keyboard shortcuts, and allow
      Accessibility control on macOS so Rocket Typist can recognize abbreviations and
      paste expansions into other applications.
    - >
      Snippets can be organized into folders, combined with macros, imported or
      exported, and synchronized through iCloud. Smart Snippets are optional, require an
      OpenAI account and API key, and send the selected prompt content to OpenAI for
      processing.
