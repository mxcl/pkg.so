id: cask:satdump
display-name: SatDump
repo: null
docs:
  - https://docs.satdump.org/
config-file-location:
  linux:
    - /usr/share/satdump/satdump_cfg.json
    - ~/.config/satdump/settings.json
  windows:
    - C:\Program Files\SatDump\share\satdump\satdump_cfg.json
    - '%APPDATA%\satdump\settings.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      SatDump is distributed for desktop Linux, macOS, Windows, Android, and several
      hardware platforms. The official instructions also cover source builds and
      containerized operation.
    - >
      source_facts.package-manager records a Homebrew Cask, giving macOS users a
      package-manager route to the graphical application.
  package-nerd-significance:
    - >
      SatDump packages a technically demanding radio and remote-sensing workflow—SDR
      capture, demodulation, decoding, calibration, image production, and
      projection—into one cross-platform application.
    - >
      It is particularly useful to radio and satellite hobbyists because its pipeline
      model supports both recorded baseband data and live SDR input across many
      spacecraft and instruments.
  project-history:
    - >
      SatDump developed into a generic, cross-platform satellite-data processing suite
      with both graphical and command-line interfaces. Its official organization
      maintains the application, documentation, website, and satellite resources.
    - >
      The project publishes stable releases alongside nightly builds and maintains
      platform-specific packages and build instructions.
  related-projects:
    - software-defined radio
    - F-Droid
    - SatDump.Docs
    - SDR++
  sources:
    - '[Official SatDump documentation](https://docs.satdump.org/)'
    - '[Official SatDump organization](https://github.com/SatDump)'
    - '[Official SatDump releases](https://github.com/SatDump/SatDump/releases)'
    - '[Official SatDump repository](https://github.com/SatDump/SatDump)'
    - source_facts.package-manager
  summary:
    - >
      SatDump is an open-source suite for receiving and processing satellite
      transmissions from live software-defined radios or previously recorded signal
      data.
  timeline:
    - >
      1.0 era: Official documentation presented integrated GUI and CLI workflows for
      offline and live satellite processing.
    - >
      Later development: The project added maintained desktop, mobile, container, and
      single-board-computer distribution paths.
  usage:
    - >
      In the GUI, users select a processing pipeline for a recording or attach a
      recorder to an SDR for live reception. The CLI exposes corresponding pipeline,
      live-processing, and recording commands.
    - >
      System-wide defaults live in `satdump_cfg.json`; documented per-user overrides are
      stored in `settings.json` and take precedence.
