id: brew:jd
display-name: jd
repo: null
docs:
  - https://github.com/josephburnett/jd/blob/master/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      jd is packaged by Homebrew, Fedora, MacPorts, Scoop, and winget metadata in the
      input. The README also documents installation through Homebrew, mise, go install,
      downloaded release binaries, Docker, a GitHub Action, and a local or hosted
      WebAssembly-based UI.
  package-nerd-significance:
    - >
      jd fills the gap left by line-oriented diff when structured JSON changes need to
      be reviewed, patched, or normalized. Package nerds care because it makes JSON
      changes scriptable while preserving concepts familiar from Unix diff and patch.
  project-history:
    - >
      The public repository was created in 2016 and its tag history begins with v1.0-era
      releases before moving through a v2 series. The README says the v2 library
      replaced the v1 library, adding diff context, minimal array diffs, and hunk-level
      metadata.
  related-projects:
    - >
      Related standards and tools include Unix diff and patch, JSON Merge Patch RFC
      7386, JSON Patch RFC 6902, YAML tooling, Go package distribution, GitHub Actions,
      and the jd WebAssembly UI.
  sources:
    - https://formulae.brew.sh/formula/jd
    - https://github.com/josephburnett/jd
    - https://github.com/josephburnett/jd/blob/master/README.md
    - https://github.com/josephburnett/jd/releases
    - https://pkg.go.dev/github.com/josephburnett/jd
  summary:
    - >
      jd is a command-line utility and Go library for diffing and patching JSON and YAML
      values. Its README describes a native jd diff format, JSON Merge Patch support
      from RFC 7386, and partial JSON Patch support from RFC 6902.
  timeline:
    - '2016: The jd repository was created and v1.0-era tags began.'
    - '2020: v1.3.0 appeared in the tag stream under both release-1.3.0 and v1.3.0 names.'
    - '2022: v2.0.0 began the v2 line.'
    - '2024: v2.4.0 appeared in the tag stream.'
    - '2025: v2.5.0 added targeted comparison options and path-isolated diff semantics.'
  usage:
    - >
      The CLI compares two JSON files, reads a second value from standard input when
      omitted, applies patches with -p, writes output with -o, handles set and multiset
      array semantics, translates formats, and can read or write YAML. Its examples show
      using a generated diff as a patch file.
related-packages:
  - id: brew:dyff
    reason: >
      Choose dyff when the primary task is a compact, human-readable comparison of YAML
      configuration files; choose jd when you also need machine-applicable JSON patches
      or patch-format translation.
    rel: alternative
    sources:
      - https://github.com/josephburnett/jd#readme
      - https://github.com/homeport/dyff/blob/main/README.md
tags:
  - cli
  - diff
  - json
