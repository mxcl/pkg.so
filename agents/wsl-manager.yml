history:
  adoption-history:
    - >
      The upstream installation guide documents distribution through the Microsoft
      Store, Winget, Scoop and Homebrew, and identifies Chocolatey packaging as
      community maintained. These channels establish packaging reach without
      establishing active-user counts.
  package-nerd-significance:
    - >
      The application connects graphical distribution management with root filesystem
      imports, reusable environments and package-manager installation workflows.
  project-history:
    - >
      The upstream README describes WSL Manager as a spare-time project dating to 2021.
      It provides a graphical interface for Windows Subsystem for Linux and has expanded
      to native virtual machines on macOS.
  related-projects:
    - Windows Subsystem for Linux; Apple Virtualization framework; Flutter.
  sources:
