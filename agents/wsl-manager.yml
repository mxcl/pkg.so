  summary:
    - >
      WSL Manager is an open-source desktop application for managing Linux environments
      on Windows and macOS.
  timeline:
    - '2021: Project origin, according to the upstream README.'
  usage:
    - >
      Users install, clone, move, back up and configure distributions or virtual
      machines. Saved command snippets and remote WSL management over SSH support
      repeated administration tasks.
