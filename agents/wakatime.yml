history:
  adoption-history:
    - >
      WakaTime's open-source editor plugins established a shared heartbeat protocol and
      configuration file across many development environments. The macOS application
      extends that model to applications without a dedicated plugin and acts as a
      catch-all activity collector.
    - >
      The current macOS application also succeeds the older Xcode-specific integration,
      which became impractical after modern Xcode versions stopped loading traditional
      plugins.
  package-nerd-significance:
    - >
      WakaTime is notable for its plugin-plus-CLI architecture: editor integrations
      collect activity and delegate standardized heartbeat delivery to a common
      command-line client. The shared ~/.wakatime.cfg convention lets many independently
      packaged plugins use the same account and privacy settings.
  project-history:
    - >
      WakaTime developed a family of open-source editor plugins around its hosted
      developer-analytics service. The macOS system-tray application broadened
      collection beyond individual editors to Xcode, design tools, API clients,
      communication applications, and other desktop software.
    - >
      The macOS client remains open source and uses a WakaTime API key to associate
      locally observed activity with the user's dashboard.
  related-projects:
    - >
      Related official projects include wakatime-cli, the common heartbeat client used
      by editor plugins, and the many WakaTime integrations for editors such as VS Code,
      Vim, and JetBrains IDEs. The older xcode-wakatime project directs users to
      macos-wakatime.
  sources:
    - https://github.com/wakatime/macos-wakatime
    - https://github.com/wakatime/wakatime-cli
    - https://github.com/wakatime/xcode-wakatime
    - https://wakatime.com/help/creating-plugin
    - https://wakatime.com/mac
  summary:
    - >
      WakaTime for Mac is an open-source menu-bar application that automatically records
      time spent in macOS applications and sends activity metrics to a WakaTime
      dashboard.
  timeline:
    - >
      WakaTime established a cross-editor ecosystem built around plugins and a shared
      command-line heartbeat client.
    - >
      The Xcode-specific plugin was deprecated in favor of the macOS WakaTime
      application after Xcode stopped supporting traditional plugins.
    - >
      The macOS application evolved into a catch-all tracker for applications without
      dedicated WakaTime integrations.
  usage:
    - >
      Users install the application, enter their WakaTime API key, grant any required
      macOS permissions, and leave it running in the menu bar. It detects active
      applications and reports activity to the user's dashboard; specialized application
      support can assign categories, projects, or entity types.
