id: brew:aqbanking
display-name: AqBanking
repo: https://git.aquamaniac.de/git/aqbanking
docs:
  - https://www.aquamaniac.de/rdm/projects/aqbanking/wiki
config-file-location:
  unix:
    - ~/.aqbanking/settings6
credentials-file-location: null
history:
  adoption-history:
    - >
      AqBanking is packaged across several Unix-like package managers in the input
      metadata, including Homebrew, Alpine, Fedora, Nix, Arch, and openSUSE. That spread
      matches its role as a system library and set of helper tools rather than a flashy
      standalone app.
    - >
      The official wiki shows the adoption pressure that keeps the package alive: PSD2
      changes, Decoupled TAN problems, CAMT migration issues, Verification of Payee
      support, and lists of successfully tested bank connections.
  package-nerd-significance:
    - >
      AqBanking matters to package nerds because it packages the moving target of
      European online banking into reusable command-line and library components. It is
      the kind of dependency that only gets noticed when banks change authentication
      rules and every downstream finance app needs the new protocol behavior.
  project-history:
    - >
      The official Redmine overview describes AqBanking as a free library for online
      banking. Its wiki organizes end-user setup pages, protocol-specific pages, and
      developer notes for implementing new banking-service backends.
    - >
      The project sits inside the broader AqBanking project family on aquamaniac.de and
      is maintained together with Gwenhywfar, a support library that appears in
      AqBanking release news.
  related-projects:
    - >
      Related projects and protocols include Gwenhywfar, HBCI/FinTS, EBICS, OFX, PayPal
      support, PSD2, CAMT, and Verification of Payee.
  sources:
    - https://git.aquamaniac.de/git/aqbanking
    - https://www.aquamaniac.de/rdm/projects/aqbanking
    - https://www.aquamaniac.de/rdm/projects/aqbanking/wiki
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      AqBanking is a free online-banking library and command-line tool family for bank
      access protocols such as HBCI/FinTS, EBICS, OFX, and PayPal-oriented workflows. It
      is less a single toy CLI than a long-lived plumbing package for finance
      applications.
  timeline:
    - '2019: The wiki notes PSD2 support beginning with AqBanking 5.99.25beta.'
    - '2025: The wiki notes Verification of Payee support beginning with AqBanking 6.7.7beta.'
    - >
      2025: Project news announced AqBanking 6.8.x releases addressing Decoupled TAN,
      CAMT, and VOP-related changes.
    - '2026: The official project remains active on aquamaniac.de.'
  usage:
    - >
      Users and integrators use AqBanking to configure banking users, test bank
      connections, retrieve account data, and talk to backend-specific tools. The
      Homebrew package exposes commands such as `aqbanking-cli`, `aqbanking-config`,
      `aqhbci-tool4`, `aqebics-tool`, `aqofxconnect-tool`, and `aqpaypal-tool`.
    - >
      The official wiki is heavily operational: pages cover Pin/TAN setup, chipTAN USB
      setup, HBCI crypto modes, PayPal setup, PSD2 migration, and backend development.
related-packages:
  - id: cask:gnucash
    reason: >
      GnuCash uses AqBanking as its online-banking layer, making the desktop accounting
      application a practical front end for configuring connections and retrieving bank
      data.
    rel: adjacent_workflow
    sources:
      - https://www.aquamaniac.de/rdm/projects/aqbanking/wiki/AqBanking6
      - https://www.gnucash.org/docs.phtml
