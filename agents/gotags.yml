config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears to have been concentrated in editor workflows rather than broad
      application stacks. The README includes Vim Tagbar configuration and an Emacs
      integration through gotags-el, and Homebrew packages the tool as a standalone
      formula.
  package-nerd-significance:
    - >
      For package collectors, gotags is representative of the pre-language-server layer
      of Go editor tooling: tiny, single-purpose, and built to bridge Go code into older
      Unix editor conventions.
  project-history:
    - >
      The GitHub repository was created in March 2012, early in Go's public tooling era,
      and the v1.0.0 tag points at a March 2012 commit that updated the README and
      screenshot. The README describes gotags as a ctags-compatible tag generator for Go
      and documents editor-oriented flags such as recursive traversal, standard-output
      writing, and sorted tag output.
  related-projects:
    - ctags provides the tag-file convention that gotags targets.
    - Vim Tagbar and gotags-el are editor-side consumers of gotags output.
  sources:
    - https://formulae.brew.sh/formula/gotags
    - https://github.com/jstemmer/gotags
    - https://github.com/jstemmer/gotags#readme
    - https://github.com/jstemmer/gotags/tags
  summary:
    - >
      gotags is a small Go command-line tool that emits ctags-compatible tag files for
      Go source code. Its role is intentionally narrow: make Go symbols available to
      editors and tag browsers that already understand the ctags format.
  timeline:
    - '2012: Repository created and v1.0.0 tagged.'
    - '2017: v1.4.1 tag recorded with a version-string update.'
    - '2021: Repository activity includes commits through April 2021.'
  usage:
    - >
      Users run gotags over Go source files or directories and consume the generated tag
      file from editors. The tool is most useful in environments where ctags-style
      navigation remains part of the developer setup.
related-packages:
  - id: brew:universal-ctags
    reason: >
      Choose Universal Ctags when one maintained indexer must cover Go alongside many
      other languages; choose gotags when a small Go-specific generator and its
      documented Tagbar integration are sufficient.
    rel: alternative
    sources:
      - https://github.com/jstemmer/gotags#readme
      - https://github.com/universal-ctags/ctags
      - https://docs.ctags.io/en/latest/man/ctags.1.html
