history:
  adoption-history:
    - >
      Rowel is distributed as a cross-platform desktop application for macOS, Windows,
      and Linux. Optional KeePassXC-Browser protocol support lets users integrate the
      vault with established browser autofill extensions.
  package-nerd-significance:
    - >
      Rowel is notable as a free, open-source password manager built with Tauri, Rust,
      and web technologies. Its local SQLCipher vault, additional application-level
      encryption, reproducible toolchain, release attestations, and signed updater make
      it particularly relevant to users who scrutinize packaging and
      software-supply-chain behavior.
  project-history:
    - >
      Rowel began under the name Swifty in the swiftyapp/swifty repository and
      subsequently moved to fwdai/rowel after its early alpha releases.
    - >
      The project developed into an offline-first credential manager supporting logins,
      payment-card records, secure notes, password generation, time-based one-time
      passwords, optional Google Drive synchronization, and browser integration.
  related-projects:
    - KeePassXC
    - KeePassXC-Browser
    - SQLCipher
    - Tauri
  sources:
    - https://github.com/fwdai/rowel#readme
    - https://github.com/fwdai/rowel/blob/main/docs/threat-model.md
  summary:
    - >
      Rowel is a free, offline-first password manager whose encrypted SQLite vault
      remains on the user's device unless optional synchronization is enabled.
  timeline:
    - >
      Early alpha period: The project was developed as Swifty in the swiftyapp/swifty
      repository.
    - 'After v1.0.0-alpha.6: Development and release provenance moved to fwdai/rowel.'
  usage:
    - >
      Users store logins, payment-card details, secure notes, TOTP secrets, and passkeys
      in a locally encrypted vault.
    - >
      Vaults can be backed up for migration or optionally synchronized through Google
      Drive. Browser autofill is available through Rowel's extension or the
      KeePassXC-Browser protocol.
