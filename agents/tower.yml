id: cask:tower
display-name: Tower
repo: null
docs:
  - https://www.git-tower.com/help/guides/first-steps/get-started-with-tower/mac
  - https://www.git-tower.com/help/guides/remote-repositories/connect-authenticate/mac
  - https://www.git-tower.com/help/home/mac
config-file-location:
  macos:
    - ~/Library/Application Support/com.fournova.Tower3/environment.plist
    - ~/Library/Application Support/com.fournova.Tower3/CompareTools/CompareTools.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Tower gained users among developers who wanted a native graphical Git workflow
      without giving up advanced operations. It integrates hosted accounts from services
      such as GitHub, GitLab, Bitbucket, and Azure DevOps while continuing to use Git
      repositories and standard authentication mechanisms.
    - >
      The product expanded from macOS to Windows, shipping its first Windows version in
      2016. Tower later moved from infrequent major upgrades toward smaller, regular
      releases, allowing new Git and hosting-service workflows to arrive more quickly.
  package-nerd-significance:
    - >
      Tower is a prominent proprietary Git GUI distributed through the Homebrew cask
      ecosystem. It represents a common package-manager pattern: installing a polished
      desktop client while retaining interoperable repositories, Git configuration, SSH
      agents, credential helpers, and command-line tools.
    - >
      Its native implementation, support for advanced operations such as interactive
      rebase, undo, commit signing, Git LFS, pull requests, and multiple branching
      workflows make it notable to developers who alternate between graphical and
      command-line Git.
  project-history:
    - >
      The Tower team began developing Tower for Mac in 2010 and shipped its first
      version in 2011. Major Mac releases followed in 2014 and 2018.
    - >
      Windows development began in 2012 alongside Tower Mac 2; the first Windows release
      shipped in 2016 and received a major upgrade in 2018. The product is developed by
      fournova as a native Git client for macOS and Windows.
  related-projects:
    - Git
    - GitHub
    - GitLab
    - Bitbucket
    - Azure DevOps
    - Git LFS
    - git-flow
  sources:
    - 'Official Tower Help for Mac: https://www.git-tower.com/help/home/mac'
    - >
      Official Tower development history:
      https://www.git-tower.com/blog/developing-for-the-desktop-tower
    - >
      Official authentication guide:
      https://www.git-tower.com/help/guides/remote-repositories/connect-authenticate/mac
  summary:
    - >
      Tower is fournova's proprietary native Git desktop client for macOS and Windows,
      designed to expose both everyday and advanced version-control workflows through a
      graphical interface.
  timeline:
    - '2010: Development of Tower for Mac began.'
    - '2011: The first Tower for Mac release shipped.'
    - '2012: Development of Tower for Windows began.'
    - '2014: A major Tower for Mac release shipped.'
    - '2016: The first Tower for Windows release shipped.'
    - '2018: Major new releases shipped for Mac and Windows.'
  usage:
    - >
      Open or clone a Git repository, inspect changes and history, stage and commit
      work, manage branches and tags, synchronize remotes, resolve conflicts, and
      perform operations such as merge, rebase, cherry-pick, revert, or stash.
    - >
      Connect hosting-service accounts for repository discovery and authentication. On
      macOS, Tower can use Keychain-backed credentials, SSH agents and keys, standard
      Git credential helpers, `.netrc`, and custom SSH configuration.
