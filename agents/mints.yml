history:
  adoption-history:
    - >
      Mints is aimed primarily at advanced Mac users, system administrators, support
      personnel, and developers. The developer distributes separate builds spanning
      macOS Sierra through current macOS releases.
  package-nerd-significance:
    - >
      Mints packages many otherwise specialized macOS diagnostic workflows into one
      graphical utility. It is particularly useful to package and support specialists
      investigating Unified Log data, Spotlight importers, TCC, Time Machine, software
      updates, storage, and Apple security components.
  project-history:
    - >
      Howard Oakley released Mints 1.0 in February 2021 as a free collection of advanced
      diagnostic and system tools. Its initial release emphasized Spotlight diagnostics
      and demonstrated a search-indexing defect affecting RTF documents in Catalina and
      Big Sur. Later versions expanded into broader logging, system-information,
      data-analysis, and hardware-diagnostic functions.
  related-projects:
    - Cirrus shares iCloud testing functionality with Mints.
    - Taccy shares privacy-protection diagnostic concerns with Mints.
    - SpotTest is a related focused Spotlight diagnostic utility from the same developer.
  sources:
    - >
      Official 1.0 announcement:
      https://eclecticlight.co/2021/02/15/full-release-of-mints-1-0-is-now-available-and-diagnoses-big-surs-spotlight-bug/
    - 'Official product documentation: https://eclecticlight.co/mints-a-multifunction-utility/'
  summary:
    - >
      Mints is a free multifunction macOS diagnostic utility by Howard Oakley. It
      extracts focused Unified Log data, collects hard-to-find system information, tests
      Spotlight, and provides specialist inspection and data tools.
  timeline:
    - '2021: Mints 1.0 was released with advanced Spotlight diagnostics.'
    - '2023: Mints added or refined log support for contemporary iCloud Drive behavior.'
    - >
      2026: Version 1.22 added locale and language information and support for current
      macOS beta releases.
  usage:
    - >
      Users select a diagnostic area, choose a time period, and retrieve a focused log
      extract using a built-in predicate. Other tools test Spotlight indexing, inspect
      software-update and recovery information, examine system and storage details, and
      analyze specialist data. Reliable log extraction requires running from a macOS
      administrator account.
