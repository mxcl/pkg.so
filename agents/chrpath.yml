id: brew:chrpath
display-name: chrpath
repo: https://codeberg.org/pere/chrpath
docs:
  - https://codeberg.org/pere/chrpath/src/branch/master/README.md
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package facts show broad distribution packaging across apk, Homebrew,
      Debian, dnf, Nix, pacman, Ubuntu, and zypper. The NEWS file also shows Debian
      packaging work early in the project history.
  package-nerd-significance:
    - >
      chrpath is package-manager plumbing: it fixes build and relocation artifacts after
      compilation without relinking. Packagers care about it because RPATH and RUNPATH
      determine whether a binary uses bundled, build-directory, or system libraries at
      runtime.
  project-history:
    - >
      The official NEWS file records chrpath 0.1 in March 2001 with support for deleting
      and modifying rpath information. The README says the tool was based on two small
      programs found on the GCC mailing list.
    - >
      The project accumulated portability fixes for Solaris, Irix, 64-bit architectures,
      Hurd, kFreeBSD, and other ELF edge cases. In 2023, the project moved to Codeberg
      after Alioth shut down.
  related-projects:
    - >
      Related tools include patchelf and elfhack; related concepts include ELF dynamic
      sections, DT_RPATH, DT_RUNPATH, runtime linkers, and distribution binary patching.
  sources:
    - https://codeberg.org/pere/chrpath/src/branch/master/README
    - https://codeberg.org/pere/chrpath/src/branch/master/NEWS
    - https://codeberg.org/pere/chrpath/src/branch/master/chrpath.rst
    - https://codeberg.org/api/v1/repos/pere/chrpath
  summary:
    - >
      chrpath is a small command-line tool for listing, removing, converting, and
      replacing the RPATH or RUNPATH embedded in ELF binaries.
  timeline:
    - '2001: 0.1 first release with rpath deletion and modification.'
    - '2002: 0.6 added a manual page and Debian package scripts.'
    - '2011: 0.14 moved the project to Alioth and improved cross-endian ELF handling.'
    - '2014: 0.16 fixed Coverity-discovered issues.'
    - '2023: 0.17 moved the project to Codeberg.'
    - '2024: 0.18 added DT_MIPS_RLD_MAP_REL support and packaging metadata adjustments.'
  usage:
    - >
      chrpath lists the current rpath or runpath by default, deletes it with -d,
      converts RPATH to RUNPATH with -c, and replaces an existing value with -r when the
      replacement is no longer than the current string.
related-packages:
  - id: brew:patchelf
    reason: >
      PatchELF is the broader alternative when a packaging job must also change the ELF
      interpreter, SONAME, or declared dependencies instead of only RPATH or RUNPATH.
    rel: alternative
    sources:
      - https://codeberg.org/pere/chrpath/src/branch/master/chrpath.rst
      - https://github.com/NixOS/patchelf#readme
