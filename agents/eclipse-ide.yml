id: cask:eclipse-ide
display-name: Eclipse IDE for Eclipse Committers
repo: https://github.com/eclipse-packaging/packages
docs:
  - https://help.eclipse.org/latest/index.jsp
  - https://www.eclipse.org/downloads/packages
  - >
    https://www.eclipse.org/setups/problems?bundle-id=org.eclipse.epp.package.committers&product-id=org.eclipse.epp.package.committers.product
config-file-location:
  macos:
    - /Applications/Eclipse.app/Contents/Eclipse/eclipse.ini
    - /Applications/Eclipse.app/Contents/Eclipse/configuration/config.ini
credentials-file-location:
  unix:
    - ~/.eclipse/org.eclipse.equinox.security/secure_storage
history:
  adoption-history:
    - >
      The Committers edition is maintained by the Eclipse Packaging Project as an
      audience-specific Eclipse distribution. It is used in Eclipse contributor setup
      instructions because it bundles source code, developer documentation, PDE, Git
      integration, and other tools useful for working across Eclipse projects.
  package-nerd-significance:
    - >
      This is the self-hosting flavor of Eclipse: an Eclipse-based IDE packaged
      specifically to develop Eclipse. It is also a useful example of how the EPP build
      turns the same simultaneous-release repository into distinct, reproducible
      products.
  project-history:
    - >
      Eclipse began as IBM technology and was released as open source in November 2001;
      the Eclipse Foundation became its independent steward in 2004.
    - >
      The Eclipse Packaging Project was created in 2007 to assemble purpose-specific
      downloads. Its Committers profile, built as `epp.package.committers`, layers PDE,
      JDT, Git, Marketplace support, sources, and developer documentation on the Eclipse
      Platform.
  related-projects:
    - Eclipse Platform provides the underlying workbench and component model.
    - Eclipse PDE provides plug-in development tools.
    - Eclipse JDT provides Java tooling.
    - EGit and JGit provide Git integration.
    - Eclipse Packaging Project builds the distribution.
  sources:
    - https://github.com/eclipse-packaging/packages
    - https://projects.eclipse.org/projects/technology.packaging
    - https://www.eclipse.org/about/
    - https://www.eclipse.org/downloads/packages/
  summary:
    - >
      Eclipse IDE for Eclipse Committers is the Eclipse Packaging Project's self-hosting
      distribution for contributors who develop Eclipse projects and plug-ins.
  timeline:
    - '2001: IBM published the Eclipse Platform and JDT source.'
    - "2004: The Eclipse Foundation became the project's independent steward."
    - '2007: The Eclipse Packaging Project was created.'
    - '2008: Eclipse Packaging reached its 1.0 release series.'
    - 'Present: The Committers profile is assembled from each quarterly Simultaneous Release.'
  usage:
    - >
      It is used for contributing to Eclipse itself, developing and debugging plug-ins,
      browsing platform sources, and working with Git-hosted Eclipse projects. Its
      broader toolset also makes it suitable for advanced RCP and Java development.
tags:
  - eclipse
  - eclipse-development
  - git
  - ide
  - java
  - maven
  - pde
  - plugin-development
provenance:
  category-sources:
    - >
      Official Eclipse Packages catalog describes this package as an IDE for developing
      Eclipse itself: https://www.eclipse.org/downloads/packages/
  display-name-sources:
    - 'Official Eclipse package page: https://www.eclipse.org/downloads/packages/'
    - current_curation.display-name
  docs-sources:
    - >
      Eclipse Help is the official IDE documentation; the official package catalog and
      problem-reporting guide describe the Committers distribution.
  history-sources:
    - https://github.com/eclipse-packaging/packages
    - https://projects.eclipse.org/projects/technology.packaging
    - https://www.eclipse.org/about/
    - https://www.eclipse.org/downloads/packages/
  repo-sources:
    - >
      The official Eclipse Packaging repository identifies `epp.package.committers` as a
      built profile: https://github.com/eclipse-packaging/packages
  tags-sources:
    - >
      Official package description and EPP profile documentation:
      https://www.eclipse.org/downloads/packages/ and
      https://github.com/eclipse-packaging/packages
category-confidence: high
category-path:
  - developer-tools
  - integrated-development-environments
