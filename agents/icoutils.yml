id: brew:icoutils
display-name: icoutils
repo: https://cgit.git.savannah.gnu.org/cgit/icoutils.git
docs:
  - https://www.nongnu.org/icoutils
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The Savannah release directory shows packaged source releases from 0.26.0 in 2005
      through 0.32.3 in 2018. The homepage also points to Debian package pages, and the
      input metadata lists packaging across Homebrew, Debian, Ubuntu, Fedora, Arch,
      Alpine, MacPorts, Nix, and openSUSE.
    - >
      Homebrew packages icoutils with libpng, exposing it to macOS and Linux users who
      need Windows resource conversion without a Windows development environment.
  package-nerd-significance:
    - >
      icoutils is the sort of small format utility that package repositories quietly
      depend on: it is not glamorous, but it solves an annoying binary-resource problem
      with composable commands.
    - >
      Its significance is strongest in cross-platform packaging, where Unix build
      systems need to inspect or generate Windows icon resources without bringing in a
      GUI resource editor.
  project-history:
    - >
      The icoutils homepage identifies Oskar Liljeblad as the original creator and
      records copyright beginning in 1998. The project lives on NonGNU/Savannah, with
      Savannah's cgit repository treated by the homepage as the authoritative source
      when mirrors differ.
    - >
      Its core tools cover different layers of Windows icon handling: icotool converts
      .ico and .cur files to and from PNG images, wrestool extracts icons and cursors
      from PE and NE executables and libraries, and extresso automates
      extraction/conversion through resource scripts.
  related-projects:
    - >
      Related components include libpng, GNU Autoconf, GNU Automake, GNU gettext, GNU
      Libtool, Gnulib, Perl, libwww-perl, Windows PE/NE resource tooling, and desktop
      icon/cursor conversion workflows.
  sources:
    - >
      Homebrew metadata documents formula packaging, libpng dependency, and distribution
      through brew.
    - >
      The NonGNU homepage documents the toolset, original author, authoritative Savannah
      repository, POSIX target, requirements, usage pointers, and release note location.
    - The Savannah release index provides dated source release artifacts.
  summary:
    - >
      icoutils is a GPL command-line toolkit for extracting, converting, creating, and
      scripting Microsoft Windows icon and cursor resources on POSIX systems.
  timeline:
    - '1998: icoutils copyright begins with original author Oskar Liljeblad.'
    - '2005: Savannah file area lists icoutils 0.26.0 source and RPM artifacts.'
    - '2009: 0.27.0 and 0.28.0 source releases appear in the Savannah file area.'
    - '2012: 0.30.0 source release appears in the Savannah file area.'
    - '2017: 0.31.x and 0.32.x releases appear in the Savannah file area.'
    - '2018: 0.32.3 is released.'
  usage:
    - >
      The package is used when icons or cursor images are locked inside Windows
      executable formats or when PNG assets need to be assembled into .ico/.cur files
      for cross-platform software distribution.
    - >
      The homepage states that icoutils was designed for modern POSIX-compatible systems
      such as Linux, making it useful in build scripts, packaging pipelines, and
      asset-conversion jobs.
