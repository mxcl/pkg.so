  windows:
    - '%APPDATA%\PostboxApp\profiles.ini'
    - '%APPDATA%\PostboxApp\Profiles\<profile>\'
credentials-file-location: null
history:
  adoption-history:
    - >
      Postbox developed a long-running user base among people seeking a power-user
      desktop mail client on macOS and Windows. In October 2024, eM Client acquired
      Postbox; sales and development ended, and users were offered a migration path to
      eM Client.
  package-nerd-significance:
    - >
      Postbox is notable as a commercial desktop client built from Mozilla mail
      technology while pursuing its own productivity-oriented interface. Its long
      release history, profile-based storage, native packaging, and eventual acquisition
      make it a useful example of the lifecycle of a proprietary desktop package derived
      from open platform components.
  project-history:
    - >
      Postbox emerged as a desktop email client for macOS and Windows and reached its
      1.0 generation in 2009. Its early releases incorporated Mozilla security updates
      and supported migration from clients including Apple Mail and Eudora.
    - >
      Postbox 6 arrived in 2018 with a new Mozilla-derived foundation, new data
      directories, Maildir support, and integrated features that had previously been
      add-ons. The product continued through the Postbox 7 generation.
    - >
      eM Client acquired Postbox in October 2024. Postbox announced that it would no
      longer be sold or developed and that Postbox, Inc. would cease operations in
      December 2024, although existing perpetual licenses could continue to be used
      while compatible.
  related-projects:
    - Mozilla Thunderbird
    - eM Client
    - Enigmail
  sources:
    - 'Official Postbox 6 announcement: https://www.postbox-inc.com/blog/entry/postbox-6-0'
    - >
      Official acquisition FAQ:
      https://support.postbox-inc.com/hc/en-us/articles/26987964800023-eM-Client-Acquisition-FAQ
    - >
      Official acquisition announcement:
      https://www.postbox-inc.com/blog/entry/postbox-acquired-by-em-client
    - 'Official product page: https://www.postbox-inc.com/'
    - 'Official release notes: https://www.postbox-inc.com/product/releasenotes'
  summary:
    - >
      Postbox is a discontinued commercial desktop email client for macOS and Windows,
      designed around unified accounts, fast search, conversation views, filtering,
      composition tools, and extensive workflow customization.
  timeline:
    - '2009: Postbox reached its 1.0 generation'
    - '2018: Postbox 6 introduced a new foundation and data directories'
    - '2024: eM Client acquired Postbox and development and sales ended'
  usage:
    - >
      Users combine multiple IMAP or POP accounts, search and organize mail, apply
      filters and topics, compose reusable responses, and work with local or
      synchronized mail folders. Postbox stores accounts, preferences, indexes, and
      local mail inside a Mozilla-style profile directory.
