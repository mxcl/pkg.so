history:
  adoption-history:
    - >
      The implementation spread across macOS, Linux, Windows, mobile platforms,
      WebAssembly, Raspberry Pi, Java, and Docker. Package-manager records supplied with
      the input identify packages in Homebrew, Alpine, Fedora, Nix, Arch Linux, and
      Scoop.
    - >
      Its lightweight C API and broad hardware support encouraged bindings and
      integrations beyond the command-line examples. The official project includes CPU
      execution plus acceleration paths for Apple, NVIDIA, AMD, Vulkan, OpenVINO, and
      other platforms.
  package-nerd-significance:
    - >
      whisper.cpp became a prominent example of packaging a large machine-learning
      model's inference engine as a portable native program. It separates the executable
      from downloadable model weights, supports model quantization, and can run
      completely offline.
    - >
      For package maintainers, the project is notable for its wide architecture matrix,
      optional acceleration backends, CMake build, compact C API, and recurring
      distinction between packaged code and separately obtained model data.
  project-history:
    - >
      Georgi Gerganov started whisper.cpp in 2022 as a dependency-light C/C++
      implementation of OpenAI's Whisper speech-recognition model, built on the ggml
      tensor library. Early development quickly added WebAssembly experiments, real-time
      transcription, embedded-device demonstrations, and a C-style integration API.
    - >
      The project later moved under the ggml-org organization and grew into a
      multi-platform inference implementation with quantization, voice-activity
      detection, numerous hardware backends, bindings, examples, and server and
      streaming tools.
  related-projects:
    - >
      OpenAI Whisper: The original automatic-speech-recognition model implemented by
      whisper.cpp.
    - 'ggml: The machine-learning tensor library underlying whisper.cpp.'
    - >
      llama.cpp: A related ggml-family native inference project with a similar emphasis
      on local, portable execution.
  sources:
    - https://github.com/ggml-org/whisper.cpp
    - https://github.com/ggml-org/whisper.cpp/discussions/126
    - https://github.com/ggml-org/whisper.cpp/discussions/167
  summary:
    - >
      whisper.cpp is a portable C/C++ inference implementation of OpenAI's Whisper
      model, designed for efficient offline speech recognition across desktop, mobile,
      browser, embedded, CPU, GPU, and accelerator environments.
  timeline:
    - >
      2022: The project appeared publicly and began adding WebAssembly, streaming,
      embedded-device, and C API work.
    - '2022: Early releases introduced a formal roadmap and release notes.'
    - >
      2023: Hardware acceleration and quantization work broadened practical deployment
      options.
    - >
      Later development: Stewardship moved to the ggml-org GitHub organization and
      platform support continued expanding.
  usage:
    - >
      Users download a converted ggml-format Whisper model, build or install the tools,
      and run `whisper-cli` against supported audio. The CLI accepts a model path and
      can transcribe or translate speech locally.
    - >
      Common uses include offline transcription, subtitles, voice interfaces, real-time
      microphone processing, server deployments, and embedding the C API in other
      applications. Quantized models trade some precision for lower storage and memory
      requirements.
