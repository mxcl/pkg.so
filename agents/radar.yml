history:
  adoption-history:
    - >
      Radar expanded from a desktop tray application to support macOS, Windows, and
      major Linux distributions, and later introduced Android and iOS clients.
    - >
      Its collections provide one-click integrations, while manual API configuration
      lets users monitor services not covered by a packaged integration.
  package-nerd-significance:
    - >
      Radar is notable to package-manager users as a cross-platform desktop monitor that
      turns arbitrary HTTP APIs into local menu-bar metrics without requiring a hosted
      Radar account.
    - >
      Its combination of packaged collections and user-supplied requests resembles a
      lightweight, desktop-oriented monitoring system rather than a conventional
      dashboard service.
  project-history:
    - >
      Ganapathy created Radar to avoid repeatedly opening browser tabs to inspect
      important metrics. The initial beta established a tray-based API viewer with
      keyboard navigation.
    - >
      Subsequent releases added collections, OAuth handlers, dark mode, threshold
      notifications, historical charts, groups, import and export, mobile clients, and
      broader response-format support.
  related-projects:
    - Radar Collections supplies one-click metric definitions for supported services.
    - Users can bypass collections and configure arbitrary HTTP APIs directly.
  sources:
    - 'Official adding-data guide: https://getradar.co/docs/adding-data'
    - 'Official changelog: https://getradar.co/docs/changelog'
    - 'Official getting-started guide: https://getradar.co/docs/getting-started'
    - 'Official product page: https://getradar.co/'
    - 'Official settings guide: https://getradar.co/docs/settings'
  summary:
    - >
      Radar is a privacy-oriented desktop and mobile application for fetching API-backed
      metrics, displaying them from the system tray or menu bar, charting changes, and
      issuing threshold notifications.
  timeline:
    - 'v0.0.1: Radar entered beta.'
    - 'v0.0.3: Radar Collections introduced one-click metrics.'
    - 'v1.0.0: Radar left beta.'
    - 'v2.0.0: Threshold notifications were introduced.'
    - 'v2.1.0: Historical analytics were added.'
    - 'v2.6.0: Import, export, and mobile applications were introduced.'
  usage:
    - >
      Users install a predefined Radar Collection or manually enter an API URL,
      parameters, request body, headers, and authentication headers. Radar can refresh
      requests on demand or periodically.
    - >
      Metrics can be transformed with custom code, organized into groups, graphed over
      time, and paired with threshold notifications. The official documentation says
      data remains on the device and no Radar account is required.
    - >
      Settings are changed through the graphical interface and can be exported to a
      user-selected JSON file. The documentation mentions an internal configuration file
      but does not document its location, so no stable config-file path is asserted. API
      credentials may be entered in requests, but no separate official credentials-file
      location is documented.
