    - '%MARIADB_HOME%\my.ini'
    - '%MARIADB_HOME%\my.cnf'
    - '%MYSQL_HOME%\my.ini'
    - '%MYSQL_HOME%\my.cnf'
history:
  adoption-history:
    - >
      The 10.6 branch became a common target for organizations that standardized on
      MariaDB before 10.11 and 11.x. Its long maintenance window made it a practical
      server line for applications that wanted MySQL compatibility without chasing
      rolling releases.
    - >
      By 2026, the package-history story is mostly compatibility and migration. MariaDB
      Foundation's EOL notice says maintenance releases stop after 6 July 2026, which
      makes mariadb@10.6 useful for matching old deployments but less suitable as a new
      default.
  package-nerd-significance:
    - >
      The versioned Homebrew formula preserves an old server line for projects with
      pinned database compatibility. That is useful for reproducing customer
      environments, testing migrations, or maintaining CI jobs before a planned jump to
      10.11, 11.4, or 11.8.
    - >
      The catch is support lifetime: as 10.6 reaches EOL, the formula's value shifts
      from recommended deployment target to compatibility artifact. Package users should
      treat it as a bridge, not a forever pin.
  project-history:
    - >
      MariaDB began in 2009 as a community fork of MySQL and grew into a
      MySQL-compatible server with its own public source tree and release policy.
      MariaDB 10.6 was part of the mature 10.x series, following 10.5 and preceding
      later LTS branches such as 10.11.
    - >
      MariaDB 10.6.4 release notes identify 6 August 2021 as the Stable GA date for the
      10.6 series and describe it as an evolution of MariaDB 10.5 with several new
      features. MariaDB Foundation later announced that Community Server 10.6 would
      reach end of life on 6 July 2026.
  related-projects:
    - MariaDB 10.11 is the later 10.x LTS branch and common upgrade target.
    - MariaDB 11.4 and 11.8 are newer LTS branches for users moving beyond 10.x.
    - >
      MariaDB Connector/C supplies client-library compatibility for applications
      connecting to 10.6.
  sources:
    - https://mariadb.com/docs/release-notes/community-server/10.6/10.6.4
    - >
      https://mariadb.com/docs/server/clients-and-utilities/server-client-software/download/getting-the-mariadb-source-code
    - >
      https://mariadb.com/docs/server/server-management/install-and-upgrade-mariadb/configuring-mariadb/configuring-mariadb-with-option-files
    - https://mariadb.org/about/
    - https://mariadb.org/download/
    - https://mariadb.org/mariadb-server-10-6-reaches-end-of-life-on-july-6th/
    - https://mariadb.org/mariadb-server-turns-fifteen/
  summary:
    - >
      MariaDB 10.6 is an older long-term MariaDB Server branch whose Homebrew formula is
      valuable for compatibility testing and legacy production parity. It is near the
      end of its community maintenance lifetime as of July 2026, so users pinning it
      should plan upgrades.
  timeline:
    - '2009: MariaDB began as a community fork of MySQL.'
    - '2021: MariaDB 10.6.4 became Stable GA on 6 August 2021.'
    - '2023: MariaDB 10.11 became the later 10.x LTS line.'
    - '2026: MariaDB Foundation listed 10.6 among current LTS releases before EOL.'
    - '2026: MariaDB Community Server 10.6 reaches end of life on 6 July 2026.'
  usage:
    - >
      Use mariadb@10.6 when tests, dumps, replication, plugins, or production parity
      require the 10.6 series specifically. It should not be chosen casually for new
      installations when newer maintained LTS branches are available.
    - >
      Configuration uses MariaDB's standard option-file hierarchy. MariaDB docs list
      Unix-like my.cnf locations and Windows my.ini/my.cnf locations, and client options
      may avoid insecure command-line passwords by using option files.
related-packages:
  - id: brew:mariadb@12.3
    reason: >
      MariaDB Foundation recommends evaluating a recent LTS such as 12.3 when leaving
      the end-of-life 10.6 branch, provided the application and upgrade are tested
      first.
    rel: alternative
    sources:
      - >
        https://mariadb.org/mariadb-server-12-3-11-8-11-4-and-10-11-q3-2026-maintenance-releases-and-goodbye-10-6/
      - https://mariadb.org/mariadb-server-12-3-lts-released/
  - id: brew:mariadb@10.11
    reason: >
      Choose MariaDB 10.11 as the closest maintained 10.x LTS alternative when remaining
      within the 10.x generation simplifies compatibility work.
    rel: alternative
    sources:
      - https://mariadb.org/mariadb-10-11-is-lts/
      - https://mariadb.org/mariadb-server-10-6-reaches-end-of-life-on-july-6th/
  - id: brew:mysql@8.4
    reason: >
      Choose MySQL 8.4 when Oracle MySQL LTS behavior or vendor certification is
      required rather than MariaDB's independently developed server.
    rel: alternative
    sources:
      - https://dev.mysql.com/doc/refman/8.4/en/
      - >
        https://mariadb.com/docs/release-notes/community-server/about/compatibility-and-differences/mariadb-vs-mysql-compatibility
  - id: brew:mariadb-connector-c
    reason: >
      Use MariaDB Connector/C for supported C and C++ client connectivity while
      maintaining or migrating a MariaDB 10.6 deployment.
    rel: adjacent_workflow
    sources:
      - https://mariadb.com/docs/connectors/mariadb-connector-c
