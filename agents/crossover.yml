credentials-file-location: null
history:
  adoption-history:
    - >
      CrossOver became a commercial way for macOS and Linux users to run selected
      Windows productivity applications, utilities, and games without maintaining a
      separate Windows installation. CodeWeavers says the product has served hundreds of
      thousands of users worldwide.
    - >
      Its compatibility database, installation recipes, and bottle abstraction make
      Wine-based application deployment more approachable, while product revenue
      supports CodeWeavers' continuing Wine work.
  package-nerd-significance:
    - >
      CrossOver is notable at the boundary between proprietary packaging and open-source
      infrastructure: it commercializes a curated Wine experience while CodeWeavers
      contributes engineering back to Wine.
    - >
      For package-oriented users, bottles provide isolated, movable Windows environments
      with their own registry, C: drive, dependencies, and settings. That model
      resembles application prefixes or lightweight per-application environments more
      than a conventional virtual machine.
  project-history:
    - >
      CodeWeavers was founded by Jeremy White in 1996, discovered Wine in 1997, and
      reorganized around Wine development in 1999. Alexandre Julliard and other Wine
      contributors subsequently joined the company.
    - >
      The first CrossOver Office release arrived in 2002 and became the basis for the
      broader CrossOver product family. CrossOver Mac packages CodeWeavers' Wine-based
      compatibility work into a supported desktop product with installation recipes,
      application integration, graphics translation options, and bottle management.
  related-projects:
    - Wine is the open-source compatibility layer underlying CrossOver.
    - CrossOver Linux is the corresponding CodeWeavers product for Linux hosts.
    - >
      DXVK and Apple's D3DMetal are selectable graphics translation technologies in
      supported CrossOver configurations.
  sources:
    - >
      Official CrossOver Mac user guide:
      https://support.codeweavers.com/en_US/crossover-mac-user-guide
    - 'Official CrossOver product page: https://www.codeweavers.com/crossover/'
    - >
      Official advanced configuration guide:
      https://support.codeweavers.com/en_US/advanced-crossover-mac-configuration
    - >
      Official history by CodeWeavers founder:
      https://www.codeweavers.com/blog/jwhite/2008/2/15/codeweavers-and-crossover-an-introduction-and-beginnings
  summary:
    - >
      CrossOver is CodeWeavers' commercial Wine-based compatibility product for running
      many Windows applications and games on macOS and Linux without installing Windows
      or using a conventional virtual machine.
  timeline:
    - '1996: Jeremy White founded CodeWeavers.'
    - '1997: CodeWeavers discovered and began engaging with Wine.'
    - '1999: CodeWeavers reorganized its business around Wine development.'
    - '2002: CodeWeavers released the first CrossOver Office.'
    - >
      Later releases: CrossOver expanded from office software into a general Windows
      application and game compatibility product for macOS and Linux.
  usage:
    - >
      On macOS, users install a supported or unlisted Windows application into a bottle.
      Each bottle contains its own Windows-style filesystem, registry, settings,
      applications, and user data.
    - >
      Advanced users can duplicate, archive, publish, and customize bottles; adjust
      Wine, DXVK, D3DMetal, synchronization, and display settings; or open a
      Wine-configured shell.
