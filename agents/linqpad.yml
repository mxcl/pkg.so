history:
  adoption-history:
    - >
      LINQPad became a well-established utility in the .NET ecosystem through continuous
      development, a free Standard edition, paid advanced editions, and support for
      keeping multiple major versions installed side by side.
    - >
      Originally associated with Windows development, LINQPad expanded to Apple silicon
      Macs; LINQPad 9 unified its Windows and macOS codebases.
  package-nerd-significance:
    - >
      LINQPad occupies the useful space between a REPL, a database client, and a
      lightweight IDE. Package users value it for quickly testing C# expressions,
      exploring APIs, querying databases with LINQ, and running snippets without
      creating a full project.
    - >
      Its long release history and side-by-side major-version model also make it notable
      to .NET developers who maintain code targeting different runtime generations.
  project-history:
    - >
      Joe Albahari, author of C# in a Nutshell, created LINQPad and has maintained it
      since its first release in 2007.
    - >
      The product progressed through numerous major and minor releases. LINQPad 9 became
      its largest major update, combining the Windows and macOS implementations and
      supporting scripts targeting multiple modern .NET releases.
  related-projects:
    - >
      Closely associated with Microsoft .NET, C#, LINQ, NuGet packages, and database
      systems exposed through LINQPad data contexts.
  sources:
    - 'Official FAQ: https://www.linqpad.net/FAQ.aspx'
    - 'Official LINQPad 9 page: https://www.linqpad.net/linqpad9.aspx'
    - 'Official downloads page: https://www.linqpad.net/download.aspx'
  summary:
    - >
      LINQPad is a proprietary .NET scratchpad and interactive database-query
      environment created by Joe Albahari. Since 2007 it has grown from a compact LINQ
      experimentation tool into a long-lived developer utility for C# scripting,
      database exploration, debugging, and rapid prototyping.
  timeline:
    - '2007: LINQPad was first released.'
    - '2020s: Native Apple-silicon macOS editions became available.'
    - 'LINQPad 9: Windows and macOS codebases were unified in a major cross-platform release.'
  usage:
    - >
      Users write C# expressions, statements, or programs, query supported databases
      through LINQ, reference assemblies and NuGet packages, and inspect rich
      interactive results.
    - >
      It is commonly used to test small ideas, learn APIs, diagnose data, automate
      one-off work, and demonstrate code without creating a Visual Studio project.
