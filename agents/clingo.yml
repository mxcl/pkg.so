history:
  adoption-history:
    - >
      The official README points users to source and binary releases, installation
      requirements, the Potassco guide, and an online clingo runner. The batch input
      lists broad distribution coverage across apk, Homebrew, Debian/Ubuntu via clasp,
      dnf, MacPorts, Nix, Scoop, and zypper.
  package-nerd-significance:
    - >
      clingo is package-nerd significant because it packages a research-grade
      declarative programming system as a practical CLI and embeddable library. It is
      the kind of solver that appears both in academic workflows and in distro package
      sets, where reproducible versions and language bindings matter.
  project-history:
    - >
      clingo grew out of the Potassco toolchain, joining gringo's grounding role with
      clasp's solving role for logic programs. The 5.x release line in the official
      changelog emphasizes API stability and growth across C, C++, Python, and Lua
      bindings, CMake packaging, ASPIF support, propagators, and updates to the embedded
      clasp solver.
  related-projects:
    - >
      clingo is directly related to Potassco, gringo, clasp, the Potassco guide, ASPIF
      tooling, and Answer Set Programming research/software. It also sits near other
      constraint, SAT, SMT, and logic-programming tools in developer package
      collections.
  sources:
    - https://github.com/potassco/clingo#readme
    - https://potassco.org/clingo
    - https://potassco.org/doc/start
    - https://github.com/potassco/clingo/blob/master/CHANGES.md
  summary:
    - >
      clingo is Potassco's grounder and solver for Answer Set Programming. The official
      README says clingo takes a logic program and computes answer sets representing
      solutions, while the official Potassco page describes it as combining gringo and
      clasp into a monolithic system.
  timeline:
    - '2010s: clingo 5.x tags appear in the official repository, starting with v5.0.0.'
    - >
      2020s: Official changelog records 5.2 through 5.8 work on CMake, MIT licensing,
      APIs, Python wheels, ASPIF, propagators, and clasp updates.
    - >
      2026: Batch input lists clingo or clasp packages across apk, Homebrew, Debian,
      Ubuntu, dnf, MacPorts, Nix, Scoop, and zypper.
  usage:
    - >
      Users model combinatorial problems as logic programs and run clingo to ground and
      solve them. Official resources provide a getting-started guide, online execution,
      API documentation, release downloads, and executables in the package such as
      clingo, gringo, clasp, lpconvert, and reify.
