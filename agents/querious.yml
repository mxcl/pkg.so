history:
  adoption-history:
    - >
      Araelium's supported-download archive shows sustained maintenance across Querious
      2, 3, and 4, with releases spanning older and current macOS generations.
    - >
      Querious 4 modernized the interface and preferences, improved SQL completion and
      schema comparison, and introduced experimental SQLite support while retaining
      MySQL as the product's central focus.
  package-nerd-significance:
    - >
      Querious represents the native-commercial branch of macOS database tooling: it is
      built specifically around Mac interface conventions rather than being a
      cross-platform web shell. It is particularly relevant to users who want visual
      MySQL administration, schema comparison, querying, and data-file manipulation in
      one application.
  project-history:
    - >
      Querious is a proprietary database client developed by Araelium for macOS. Its
      official release archive documents a long-lived product line progressing through
      Querious 2, Querious 3 in 2020, and Querious 4 in 2023.
    - >
      Successive generations expanded beyond table browsing and SQL execution into
      schema-object editors, import and export, database duplication and comparison,
      server monitoring, SSH and SSL connectivity, and saved connection management.
  related-projects:
    - MySQL and compatible database servers are Querious's primary targets.
    - SQLite support appeared experimentally in the Querious 4 generation.
  sources:
    - https://www.araelium.com/querious
    - https://www.araelium.com/querious/new_features
    - https://www.araelium.com/support/querious/documentation/connections_saved
    - https://www.araelium.com/support/querious/download-previous-versions
  summary:
    - >
      Querious 4 is a proprietary native macOS client for MySQL and compatible
      databases. It combines visual data and schema editing with SQL queries,
      import/export, schema comparison, connection management, and server-administration
      tools.
  timeline:
    - '2020-02-13: Querious 3 is released.'
    - >
      2022-02: Querious 3.2 adds encrypted settings transfer, including saved
      connections and passwords.
    - '2023-06-11: Querious 4 is released.'
    - '2025-05-20: Querious 4.2 is released.'
  usage:
    - >
      Users create saved TCP/IP or Unix-socket connections, optionally using SSL or SSH
      tunnels, and then browse, edit, query, import, export, compare, or duplicate
      databases.
    - >
      Connection passwords may be stored in the macOS Keychain or requested for every
      connection. The official documentation does not publish a credentials-file path.
      Settings can also be exported deliberately as an encrypted transfer file, but that
      user-chosen export is not the application's fixed configuration location.
