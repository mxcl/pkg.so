history:
  adoption-history:
    - >
      BathyScaphe is designed specifically for the Japanese 5channel community and also
      supports Machi BBS, Shitaraba, and some other compatible boards. Its long-running
      Mac-native design incorporates platform conventions such as Spotlight, Quick Look,
      AppleScript, Keychain, gestures, Retina graphics, and Gatekeeper signing.
  package-nerd-significance:
    - >
      BathyScaphe is notable as a specialized, long-lived native Mac client for Japanese
      textboard culture. It combines local SQLite-backed organization, log search,
      automation, credential storage, image previews, and Japanese ASCII-art handling in
      a package that follows macOS interface and distribution conventions.
  project-history:
    - >
      The official project says BathyScaphe has evolved alongside macOS since 2005.
      Later development adopted Sparkle for in-app updates and continued adding
      contemporary Mac features while retaining its specialized 5channel reading and
      posting workflow.
  related-projects:
    - >
      The application supports 5channel as its primary service and also works with Pink
      Channel, Machi BBS, Shitaraba, and some compatible bulletin boards.
  sources:
    - 'Official project site: https://bathyscaphe.bitbucket.io/'
    - >
      Official project workspace linked by the site:
      https://bitbucket.org/bathyscaphe/workspace/repositories/
  summary:
    - >
      BathyScaphe is a native macOS client for reading and posting to 5channel and
      related Japanese bulletin-board systems.
  timeline:
    - '2005: BathyScaphe began evolving as a macOS-native bulletin-board client'
    - >
      Version 2.7: Added features including inline viewing of 5channel drawings and
      Sparkle updates
    - 'Version 3.2.1: Official site release for macOS Big Sur or later'
  usage:
    - >
      Users browse boards and threads, post replies, filter unwanted messages, search
      and organize threads, preview linked images, manage favorites and smart boards,
      and use Be or Ronin accounts. The application stores supported account passwords
      in macOS Keychain and provides maintained help from its Help menu.
