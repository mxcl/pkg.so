id: brew:ccmux
display-name: ccmux
repo: null
docs:
  - https://github.com/epilande/ccmux/tree/main/docs
  - https://github.com/epilande/ccmux#readme
config-file-location:
  unix:
    - ~/.config/ccmux/ccmux.json
credentials-file-location: null
history:
  adoption-history:
    - >
      ccmux is installable through Homebrew and from source. Its setup command
      integrates with supported coding agents, while its tmux-based design lets users
      retain existing terminal sessions and worktree practices.
    - >
      The project supports several agent clients, including Claude Code, Codex, Cursor,
      OpenCode, and other agent-oriented command-line tools, reflecting the emergence of
      multi-agent coding workflows.
  package-nerd-significance:
    - >
      ccmux represents a recent class of terminal utilities built around AI coding
      agents. It layers agent-aware state, navigation, notifications, handoff, and
      worktree operations onto tmux rather than replacing the established terminal
      multiplexer.
  project-history:
    - >
      ccmux was created by epilande as a terminal interface for discovering, monitoring,
      and controlling multiple AI coding-agent sessions running in tmux.
    - >
      The project evolved beyond a session picker to include a background daemon, agent
      hooks, status tracking, sidebars, notifications, session handoff, pane
      interaction, and Git worktree management.
  related-projects:
    - tmux
    - Claude Code
    - OpenAI Codex
    - Cursor
    - OpenCode
    - Git worktrees
  sources:
    - >
      Official architecture and feature documentation:
      https://github.com/epilande/ccmux/tree/main/docs
    - 'Official repository and README: https://github.com/epilande/ccmux'
  summary:
    - >
      ccmux is a terminal user interface and background service for coordinating
      multiple AI coding-agent sessions hosted in tmux panes.
  timeline:
    - '2020s: ccmux emerged during the adoption of terminal-based AI coding agents.'
    - >
      2026: The official documentation describes multi-agent hooks, a daemon, session
      handoff, notifications, sidebars, and worktree operations.
  usage:
    - >
      Users start coding agents in tmux panes and run ccmux to locate sessions, inspect
      status, switch panes, send input, capture output, create handoffs, and manage
      related worktrees.
    - >
      Preferences are stored in ~/.config/ccmux/ccmux.json and can be managed through
      ccmux config commands. Optional setup installs agent-specific hooks and marker
      files under the user's configuration directories.
    - >
      ccmux does not document its own credentials store; authentication remains the
      responsibility of each underlying coding-agent client.
