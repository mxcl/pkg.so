history:
  adoption-history:
    - >
      OmniDiskSweeper became freeware in 2009 and has remained a small, long-lived macOS
      utility. The Omni Group has continued updating it for major platform transitions,
      including Catalina and Apple silicon.
  package-nerd-significance:
    - >
      OmniDiskSweeper is a native graphical counterpart to command-line disk-accounting
      tools. Package users value its narrow purpose, long Mac lineage, and size-sorted
      view that leaves cleanup decisions to the user.
  project-history:
    - >
      The Omni Group developed OmniDiskSweeper to scan a drive and display files and
      folders from largest to smallest. Official archives show a beta in 2002, while the
      company describes its 2006 release as the first non-beta update since 2003.
  related-projects:
    - >
      Command-line tools such as du provide related disk-usage information.
      OmniDiskSweeper is distributed through Omni Labs alongside other smaller Omni
      applications.
  sources:
    - >
      Official 2006 history note:
      https://www.omnigroup.com/blog/entry/New_ish_version_of_OmniDiskSweeper
    - >
      Official Apple-silicon announcement:
      https://www.omnigroup.com/blog/omni-productivity-suite-now-available-for-m1-and-macos-big-sur
    - 'Official product blog archive: https://www.omnigroup.com/blog/category/OmniDiskSweeper'
    - 'Official product page: https://www.omnigroup.com/more'
  summary:
    - >
      OmniDiskSweeper is The Omni Group's free macOS utility for finding large files and
      folders and moving unwanted items to the Trash.
  timeline:
    - '2002: The Omni Group archive records an OmniDiskSweeper 1.3 beta.'
    - "2003: The release lineage referenced by The Omni Group's later history was established."
    - '2009: OmniDiskSweeper became freeware.'
    - '2018: Version 1.10 made moving files to the Trash the default behavior.'
    - '2020: The Omni Group released a native Universal build for Apple-silicon Macs.'
  usage:
    - >
      Users select a disk, inspect the size-sorted hierarchy, and open or trash items
      after deciding they are unnecessary. On protected macOS volumes, the application
      may require system-granted access to enumerate all files.
