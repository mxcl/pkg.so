id: brew:brev
display-name: Brev CLI
repo: null
docs:
  - https://docs.nvidia.com/brev/cli/getting-started
config-file-location:
  unix:
    - ~/.brev/ssh_config
credentials-file-location:
  unix:
    - ~/.brev/credentials.json
history:
  adoption-history:
    - >
      Brev's adoption is tied less to generic CLI popularity and more to users who need
      short-lived GPU development environments. Official installation paths include
      Homebrew on macOS, a shell installer on Linux and WSL, and conda-forge via Pixi,
      while Homebrew analytics showed several hundred installs over the prior year at
      lookup time.
  package-nerd-significance:
    - >
      Brev is significant as a modern example of a CLI wrapper around cloud GPU
      lifecycle management. For package maintainers, it shows the 2020s pattern of
      developer tools shipping through Homebrew, curl installers, and conda-style
      channels while primarily orchestrating remote infrastructure rather than local
      binaries.
  project-history:
    - >
      The public brev-cli repository was created in October 2021 and published v0.1.0
      later that month. The project has kept a rapid release cadence, with GitHub
      releases continuing through v0.6.327 in June 2026.
    - >
      NVIDIA's Brev documentation describes the product as instant access to GPU
      instances preconfigured for AI and ML development across multiple cloud providers.
      The CLI README positions the tool around logging in, creating GPU instances,
      listing instances, SSH-style workflows, and integrations for AI coding agents.
  related-projects:
    - NVIDIA Brev is the hosted service managed by the CLI.
    - >
      VS Code Remote SSH, JupyterLab, Docker, CUDA, Python, and NVIDIA NIM workflows are
      common adjacent tools in the official docs.
    - conda-forge and Pixi are documented as alternative installation channels.
  sources:
    - https://developer.nvidia.com/brev
    - https://docs.nvidia.com/brev/latest/
    - https://formulae.brew.sh/api/formula/brev.json
    - https://github.com/brevdev/brev-cli
    - https://raw.githubusercontent.com/brevdev/brev-cli/main/README.md
  summary:
    - >
      Brev CLI is the terminal client for NVIDIA Brev, a service for launching and
      managing GPU-backed development instances. Its package history sits at the
      intersection of cloud workspaces, remote SSH development, and AI/ML infrastructure
      packaging.
  timeline:
    - '2021: brev-cli repository created and v0.1.0 released.'
    - '2021: v0.4.x releases followed within the first public release year.'
    - >
      2026: NVIDIA Brev docs describe GPU instances, launchables, CLI workflows, and
      AI/ML development use cases.
    - '2026: v0.6.327 published and Homebrew stable version reported as 0.6.327.'
  usage:
    - >
      Typical usage starts with `brev login`, then `brev create` to launch a named GPU
      instance and `brev ls` to inspect instances. The docs also emphasize VS Code
      Remote SSH, Jupyter, port forwarding, Docker workloads, GPU type selection, and
      agent-oriented commands.
related-packages:
  - id: brew:gh
    reason: >
      GitHub CLI is a documented companion: Brev's installer can reuse gh authentication
      to avoid unauthenticated GitHub API limits when retrieving Brev releases.
    rel: adjacent_workflow
    sources:
      - https://docs.nvidia.com/brev/cli/getting-started
      - https://cli.github.com/manual/gh_auth_token
tags:
  - cli
  - cloud-workspaces
  - development-environments
  - gpu
  - nvidia-brev
