config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      heksa's adoption appears narrow: the input package facts list Homebrew packaging,
      and the upstream README includes packaging-status and release-download badges.
      That is enough to mark it as a packaged terminal utility, but not enough to claim
      broad ecosystem adoption.
  package-nerd-significance:
    - >
      For package nerds, heksa is interesting as a modern replacement-adjacent tool for
      `hexdump` and `xxd`: single binary, cross-platform Go build, colorized byte
      classes, and convenience flags aimed at binary inspection and reverse-engineering
      workflows.
  project-history:
    - >
      The repository metadata records heksa's public GitHub project from December 2019.
      The README credits Pekka Jarvinen from 2019 onward and describes the tool as a hex
      file dumper with ANSI colors, configurable output formats, offsets, seek and limit
      handling, and stdin support.
  related-projects:
    - >
      heksa is related to traditional binary inspection tools such as `hexdump`, `xxd`,
      and `od`, while adding terminal color and convenience formatting for modern CLI
      workflows.
  sources:
    - https://api.github.com/repos/raspi/heksa
    - https://github.com/raspi/heksa
    - https://raw.githubusercontent.com/raspi/heksa/master/README.md
  summary:
    - >
      heksa is a Go-based command-line hex dumper focused on colored terminal output and
      multiple simultaneous numeric views of binary data. Its history is thin but
      source-backed enough to identify it as a small developer utility rather than a
      larger platform.
  timeline:
    - '2019: GitHub repository metadata records the heksa project.'
    - "2021: The README's embedded help text shows a 1.14.0 build date in May 2021."
    - 'Package-manager era: The input package facts record Homebrew packaging.'
  usage:
    - >
      The CLI reads files or stdin and can display hex, decimal, octal, bits, ASCII,
      block visualizations, multiple offset formats, human-readable offsets, relative
      offsets after seeking, byte limits, and prefixed numeric inputs such as
      hexadecimal, octal, binary, SI, and IEC units.
related-packages:
  - id: brew:hexyl
    reason: >
      Choose hexyl for a widely packaged Rust-based colored terminal viewer; choose
      heksa when its simultaneous numeric views and offset-format controls better fit
      the inspection task.
    rel: alternative
    sources:
      - https://github.com/raspi/heksa
      - https://github.com/sharkdp/hexyl
