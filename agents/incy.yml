history:
  adoption-history:
    - >
      INCY expanded across Apple, Android, television, Windows, macOS, and Linux
      platforms. Its desktop line was still described by the project as pre-alpha in
      2026, while remaining usable for daily work.
  package-nerd-significance:
    - >
      INCY packages a broad set of modern proxy protocols behind one graphical client
      and supports subscription URLs, raw configurations, routing profiles, deep links,
      and portable desktop builds. This makes it relevant to users who manage proxy
      configurations across several operating systems.
  project-history:
    - >
      INCY is a cross-platform proxy client built on Xray-core. The project distributes
      mobile, television, and desktop clients and documents integration formats for VPN
      and proxy service providers.
    - >
      Its documented feature set grew to include routing profiles, full Xray JSON
      imports, TLS fragmentation, a kill switch, per-application routing, television
      pairing, shortcuts, and provider-facing deep links.
  related-projects:
    - >
      The official INCY organization also maintains incy-docs, incy-link-encoder,
      incy-tv-relay, and incy-icons. Xray-core supplies the underlying proxy engine.
  sources:
    - https://docs.incy.cc/en/
    - https://docs.incy.cc/en/deep-links/
    - https://github.com/INCY-DEV/incy-platforms
  summary:
    - >
      INCY is a cross-platform Xray-core proxy client supporting subscription-based and
      directly imported proxy configurations.
  timeline:
    - >
      2026: Official documentation recorded native encrypted deep-link support across
      current mobile and desktop clients.
    - >
      2026: The project distributed pre-alpha desktop releases for macOS, Windows, and
      Linux alongside its mobile and television clients.
  usage:
    - >
      Users add subscriptions by URL, QR code, or share link; import individual VLESS,
      VMess, Trojan, Shadowsocks, Hysteria2, SOCKS5, or WireGuard endpoints; and apply
      routing profiles to send traffic through a proxy, directly, or to a block rule.
