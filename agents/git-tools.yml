config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README explicitly credits git-restore-mtime as the reason the repository was
      packaged into distributions. It lists Debian, Ubuntu, Linux Mint, Fedora,
      EPEL-based systems, Gentoo, Arch AUR, Homebrew, MacPorts, Kali Linux, MidnightBSD
      mports, and Mageia as distribution channels or package ecosystems for the tools.
  package-nerd-significance:
    - >
      Git Tools is a classic package-manager-friendly utility collection: small scripts,
      man pages, no daemon, and names that Git automatically discovers as subcommands.
      Its packaging story also shows how one highly useful script, git-restore-mtime,
      can pull a broader toolbox into distro archives.
  project-history:
    - >
      The upstream repository was created in 2012, and the README says the tools have
      been tested against Git versions dating back to 2010. The collection is built from
      Bash utilities plus a Python utility, git-restore-mtime, which became the most
      visible member of the set.
  related-projects:
    - >
      The suite extends Git and overlaps with shell scripts, Git aliases, and individual
      packaging of git-restore-mtime in Debian-derived systems.
  sources:
    - https://api.github.com/repos/MestreLion/git-tools
    - https://formulae.brew.sh/formula/git-tools
    - https://github.com/MestreLion/git-tools
    - https://github.com/MestreLion/git-tools/tree/main/man1
    - https://raw.githubusercontent.com/MestreLion/git-tools/main/README.md
    - https://tracker.debian.org/pkg/git-mestrelion-tools
  summary:
    - >
      Git Tools is Rodrigo Silva's collection of small Git-related command-line
      utilities, distributed as normal `git-*` executables with optional man pages. The
      suite covers repository maintenance and migration chores that are useful but too
      specific to belong in core Git.
  timeline:
    - '2010: README says the tools were tested against Git versions dating back to this era.'
    - '2012: GitHub repository created and copyright notice added for Rodrigo Silva.'
    - '2020: Debian oldoldstable carried git-mestrelion-tools 2020.09-1.'
    - '2022: Debian stable line carried git-mestrelion-tools 2022.12-1.'
  usage:
    - >
      Practitioners use the tools as Git subcommands after placing the executables in
      PATH or installing an operating-system package. Examples include restoring file
      modification times from commit history, finding repositories with uncommitted
      changes, cloning a subset of a repository while preserving relevant history,
      renaming branch prefixes, and stripping files before a merge.
related-packages:
  - id: brew:git-extras
    reason: >
      git-extras is the broader utility-suite alternative, offering many workflow and
      reporting commands, while Git Tools concentrates on a smaller set of repository
      maintenance and migration scripts.
    rel: alternative
    sources:
      - https://github.com/MestreLion/git-tools#readme
      - https://github.com/tj/git-extras#readme
  - id: brew:git
    reason: >
      Git provides the repositories and external-subcommand mechanism on which every Git
      Tools command operates.
    rel: adjacent_workflow
    sources:
      - https://github.com/MestreLion/git-tools#readme
      - https://git-scm.com/docs/git
