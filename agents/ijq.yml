id: brew:ijq
display-name: ijq
repo: https://codeberg.org/gpanders/ijq
docs:
  - https://codeberg.org/gpanders/ijq
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/ijq/config
    - ~/.config/ijq/config
credentials-file-location: null
history:
  adoption-history:
    - >
      ijq occupies the package-manager niche for people who already use jq but want fast
      feedback while building a filter. Homebrew, MacPorts, Nix, Arch, and Alpine
      package metadata in the input show distribution across Unix-like package
      ecosystems; Homebrew formula metadata records binary bottles and install
      analytics.
  package-nerd-significance:
    - >
      For package nerds, ijq is interesting because it packages an ergonomic shell
      companion rather than a new data-processing stack. It is small, jq-compatible, and
      useful in the same workflows where people already install jq, fx, jless, or
      browser-based jqplay.
  project-history:
    - >
      The public tag history reaches v0.1.0 in 2020, and the project later moved its
      primary home to Codeberg while preserving a GitHub mirror for contributions.
      Release notes for v1.2.0 mention removing remaining SourceHut references, and
      v1.3.0 tells packagers that ijq lives at Codeberg.
    - >
      The tool stayed intentionally close to jq rather than becoming a separate query
      language. Its later evolution added terminal usability features: asynchronous jq
      subprocess handling for large inputs, an overlay menu, configurable key bindings,
      filter history, and a config file.
  related-projects:
    - >
      ijq is directly related to jq and jqplay. The README also points to vim-jqplay as
      similar work, while package users may compare it with adjacent JSON explorers such
      as fx or jless.
  sources:
    - >
      Project README, Codeberg release notes, Codeberg repository metadata, and Homebrew
      formula metadata.
  summary:
    - >
      ijq is a terminal interface around jq, built for interactive exploration of JSON
      filters before reusing them in scripts. Its README describes it as an interactive
      jq tool, like jqplay for the command line, and notes that jq remains the
      underlying filter engine.
  timeline:
    - '2020: v0.1.0 appears in the public tag history.'
    - >
      2024: v1.1.0 improves UI responsiveness by running jq subprocess work without
      blocking the main interface.
    - >
      2025: v1.2.0 removes remaining SourceHut references and documents the Codeberg
      home for packagers.
    - '2026: v1.3.0 adds a config file, overlay menu, history management, and Codeberg CI.'
  usage:
    - >
      A common workflow is to open a JSON file or pipe API output into ijq, edit the jq
      filter interactively, then press Return to emit the filtered output and save the
      filter for later jq use. The README also documents history storage under the XDG
      data path and a config file for changing the history file, jq binary, pane
      visibility, and key bindings.
related-packages:
  - id: brew:jq
    reason: >
      ijq runs jq underneath and can export an interactively developed filter for direct
      reuse with `jq -f` in scripts and pipelines.
    rel: adjacent_workflow
    sources:
      - https://github.com/gpanders/ijq#readme
      - https://jqlang.github.io/jq/manual/
