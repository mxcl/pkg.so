history:
  adoption-history:
    - >
      epeg stayed a niche but memorable package because it solved one job well: quickly
      making thumbnails from JPEGs. It accumulated language bindings for Python and
      Node.js and enough downstream interest to remain packaged in Homebrew, MacPorts,
      and Nix.
  package-nerd-significance:
    - >
      epeg is the sort of package that appeals to people who like small, purpose-built C
      libraries: it wraps a particular libjpeg optimization in a compact API and
      command-line install, and it carries a visible lineage from desktop-environment
      infrastructure into modern package managers.
  project-history:
    - >
      The epeg README says the library was originally developed inside the Enlightenment
      project. The repository maintainer notes that at some later, unspecified point
      epeg disappeared from that project or was merged into another library, with
      v0.9.1.042 named as the last original version known to that maintainer.
    - >
      The current GitHub repository preserves that original code lineage while carrying
      updates and improvements on the master branch. The copyright notice dates the
      software to 2000 and credits Carsten Haitzler and contributors.
  related-projects:
    - >
      epeg relates to libjpeg, the Enlightenment project, Python bindings through
      epeg-cffi, and Node.js bindings distributed as an npm package.
  sources:
    - https://github.com/mattes/epeg
    - https://raw.githubusercontent.com/mattes/epeg/master/README.md
  summary:
    - >
      epeg is a JPEG thumbnailing library and command-line package focused on fast
      downscaling. Its README describes the core idea as using libjpeg's ability to
      decode only the DCT coefficients needed for the requested output size, reducing
      CPU work when large JPEGs are turned into small thumbnails.
  timeline:
    - '2000: Copyright notice credits Carsten Haitzler and contributors.'
    - 'Unknown: epeg developed within the Enlightenment project.'
    - >
      Unknown: epeg disappeared from or was merged into another Enlightenment library
      after the original line.
    - '2023-04-05: GitHub release epeg v0.9.3 published.'
  usage:
    - >
      Users and bindings rely on epeg when the source image is much larger than the
      desired thumbnail. The performance advantage comes from avoiding full-resolution
      decode work and, in some cases, avoiding colorspace conversion when YUV or
      grayscale access is sufficient.
related-packages:
  - id: brew:vips
    reason: >
      Choose libvips for demand-driven, multi-format image pipelines; epeg is the
      narrower choice when the job is specifically fast JPEG thumbnail generation.
    rel: alternative
    sources:
      - https://github.com/mattes/epeg#readme
      - https://www.libvips.org/API/current/
  - id: brew:imagemagick
    reason: >
      ImageMagick is the broader command-line alternative for thumbnails, geometry,
      effects, and many formats, while epeg concentrates on efficient JPEG downscaling.
    rel: alternative
    sources:
      - https://github.com/mattes/epeg#readme
      - https://imagemagick.org/Usage/resize/#thumbnail
  - id: brew:jpeg-turbo
    reason: >
      libjpeg-turbo provides a libjpeg-compatible implementation that can supply the
      JPEG decoding API on which epeg's reduced-resolution workflow depends.
    rel: adjacent_workflow
    sources:
      - https://github.com/mattes/epeg#readme
      - https://github.com/libjpeg-turbo/libjpeg-turbo#readme
