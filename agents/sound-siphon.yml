history:
  adoption-history:
    - >
      Sound Siphon was designed to make captured Mac audio available as microphone-like
      virtual inputs to other applications, allowing it to work with recorders,
      broadcasting software, communication tools, and sandboxed applications.
    - >
      The vendor documents podcasting, game broadcasting, conversation recording,
      transcription, DAW, and inter-application routing workflows. A public API also
      permits other applications to control Sound Siphon capture.
  package-nerd-significance:
    - >
      Sound Siphon is part of the long-running ecosystem of macOS virtual-audio tools
      used to bridge applications that otherwise cannot exchange audio directly.
    - >
      Its release history illustrates the maintenance burden of low-level Mac audio
      utilities: plug-ins, extensions, sandbox rules, operating-system permissions,
      subprocess capture, sample rates, and compatibility changes all require continuing
      adaptation.
  project-history:
    - >
      Static Z Software was supporting Sound Siphon by late 2013, when its official FAQ
      documented capture from sandboxed applications. The product subsequently evolved
      through multiple major versions while retaining its virtual-input model.
    - >
      Later releases added configurable channels, mapping and live mixing. On newer
      macOS releases, the application can capture Mac audio directly, while a separate
      plug-in remains necessary when other applications need Sound Siphon virtual input
      devices.
  related-projects:
    - >
      Sound Control is Static Z’s related per-application volume, effects, and routing
      utility.
    - >
      Sound Siphon: Audio Unit is a separate product for capturing application or system
      audio directly inside compatible DAWs.
  sources:
    - https://staticz.com/category/faqs/sound-siphon-faqs/
    - https://staticz.com/soundsiphon/
    - >
      https://staticz.zendesk.com/hc/en-us/articles/115009014947-Is-there-a-public-API-for-Sound-Siphon
    - https://staticz.zendesk.com/hc/en-us/articles/360058530892-Installing-PlugIn
    - https://staticz.zendesk.com/hc/en-us/categories/115001296267-Sound-Siphon
  summary:
    - >
      Sound Siphon is Static Z Software’s macOS audio-capture and inter-application
      routing utility. It can record directly or create virtual input devices containing
      system audio, selected applications, microphones, or mixtures of those sources.
  timeline:
    - >
      2013: Official support material documented Sound Siphon working with sandboxed Mac
      applications.
    - '2015: Sound Siphon 2.0.2 introduced a public API for application developers.'
    - '2020: Sound Siphon 2.1.1 improved multichannel-device and subprocess capture.'
    - >
      2025: Sound Siphon 3.8.2 enabled direct recording on macOS 15 while retaining the
      plug-in for virtual inputs used by other applications.
  usage:
    - >
      Create virtual microphones for sending system audio, selected applications, and
      physical microphones into recording, streaming, conferencing, or broadcasting
      software.
    - >
      Use the built-in recorder for timed or ordinary captures, with live mixing,
      channel mapping, level previews, and optional muting of applications during
      recording.
