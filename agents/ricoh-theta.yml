history:
  adoption-history:
    - >
      The desktop app accompanies the RICOH THETA camera family and serves users who
      move spherical photographs and videos from camera-centered capture workflows to a
      computer for viewing and sharing.
  package-nerd-significance:
    - >
      For package users, RICOH THETA is a vendor-specific hardware companion
      application: its value lies in maintaining a desktop workflow for a specialized
      360-degree media format rather than providing a general image editor or an open
      developer tool.
  project-history:
    - >
      RICOH THETA was released as part of Ricoh's broader THETA 360-degree imaging
      ecosystem. The computer application complements the mobile capture and editing
      apps by providing desktop viewing for media created with THETA cameras.
  related-projects:
    - >
      The broader official ecosystem includes RICOH THETA cameras, the RICOH THETA
      smartphone app, THETA+, camera plug-ins, and RICOH THETA Stitcher.
  sources:
    - https://support.theta360.com/intl/catalog/pdf/RICOH_THETA_Catalog_en.pdf
    - https://theta360.com/en/support/download/pcmac
  summary:
    - >
      RICOH THETA is the official desktop companion application for viewing 360-degree
      still images and videos produced by RICOH THETA cameras.
  timeline:
    - >
      2010s: The desktop viewer became part of Ricoh's expanding THETA camera and
      application ecosystem.
  usage:
    - >
      Users transfer THETA media to a Mac, open it in the desktop application, and
      navigate spherical images or videos interactively. The app complements, rather
      than replaces, the mobile applications used for remote shooting and camera
      settings.
