history:
  adoption-history:
    - >
      Picture View was offered as a free direct download and later listed in the Mac App
      Store. Its official site supports both Apple silicon and Intel Macs.
  package-nerd-significance:
    - >
      Picture View represents the small, single-purpose macOS utilities commonly
      installed through cask-style package managers: it is lightweight, native, and
      intended to replace a default desktop file-viewing workflow.
  project-history:
    - >
      Picture View emerged as a lightweight macOS image browser in 2021. Early releases
      rapidly added folder navigation, configurable shortcuts, themes, image metadata,
      multiple browsing layouts, SVG and PSD previews, and ZIP browsing.
    - >
      Version 2.0 was signed and notarized using an Apple developer certificate.
      Development continued through the 2.3 series in 2022, with the official notes
      emphasizing stability and interface refinements.
  related-projects:
    - macOS Preview
    - Finder Quick Look
    - Homebrew Cask
  sources:
    - https://wl879.github.io/apps/picview/
    - https://wl879.github.io/apps/picview/note.html
    - source_facts.package-manager
  summary:
    - >
      Picture View is a lightweight macOS image browser designed for quick, cache-free
      viewing in single-image or multi-column layouts.
  timeline:
    - >
      2021-07-06: The earliest release recorded in the official update notes, version
      1.1.0, added overview browsing and window-management features.
    - >
      2021-12-17: Version 2.0.0 introduced redesigned navigation and shortcuts, SVG
      previewing, signing, and notarization.
    - '2022-06-19: Version 2.3.4 was published.'
  usage:
    - >
      Users open individual images or folders, browse images in single-image or
      multi-column modes, inspect EXIF information, preview several image formats, and
      optionally keep the display awake while viewing.
