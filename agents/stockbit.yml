history:
  adoption-history:
    - >
      Stockbit developed a service spanning web, mobile, and desktop interfaces. Its
      official desktop page documents Mac and Windows applications; the supplied
      source_facts.package-manager records Homebrew Cask availability without
      establishing installation or user counts.
  package-nerd-significance:
    - >
      The cask provides a package-manager entry point to a regional financial desktop
      application. Its utility depends on the Stockbit service and user account.
  project-history:
    - >
      Stockbit's own account describes its Indonesian origins as a social network for
      stock investors. The service combines investor discussion with market analysis and
      trading.
  related-projects:
    - Stockbit's web and mobile applications provide other interfaces to the same service.
