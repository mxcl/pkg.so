history:
  adoption-history:
    - >
      Demand following the original Mac release led Flexibits to launch an iPhone
      edition in 2012, Fantastical 2 for iPhone in 2013, an iPad edition in 2014, and
      Fantastical 2 for Mac in 2015.
    - >
      Fantastical 3 unified the product family across Apple platforms in 2020 and
      introduced both a free tier and the Flexibits Premium subscription. Apple selected
      Fantastical as its 2020 Mac App of the Year.
    - The product later expanded to Apple Vision Pro and, in 2024, Windows.
  package-nerd-significance:
    - >
      Fantastical is a prominent example of a polished proprietary Mac application that
      is commonly provisioned through Homebrew Cask even though its account, calendar,
      and subscription management remain graphical.
    - >
      Its long-running natural-language parser, URL scheme, AppleScript support, and
      later MCP-related integrations make it relevant to automation-oriented desktop
      users.
  project-history:
    - >
      Fantastical began as a university project and was released by Flexibits for Mac in
      May 2011. Its defining early feature was natural-language event entry in a compact
      menu-bar application.
    - >
      Over successive major releases it grew into a full calendar and task client with
      direct account integrations, calendar sets, scheduling tools, weather,
      conference-call support, and cross-device synchronization.
  related-projects:
    - >
      Cardhop is Flexibits' companion contact-management application and is included
      with Flexibits Premium.
  sources:
    - https://flexibits.com/blog/2011/05/ladies-and-gentlemen-start-your-calendars/
    - https://flexibits.com/blog/2026/05/happy-15th-birthday-fantastical-and-flexibits/
    - https://flexibits.com/fantastical/help
  summary:
    - >
      Fantastical is Flexibits' cross-platform calendar, task, and scheduling
      application, best known for natural-language event creation and its Mac menu-bar
      origins.
  timeline:
    - '2011: Fantastical 1.0 launched for Mac.'
    - '2012: The first iPhone edition launched.'
    - '2013: Fantastical 2 launched for iPhone.'
    - '2014: Fantastical arrived on iPad.'
    - '2015: Fantastical 2 launched for Mac.'
    - >
      2020: Fantastical 3 and Flexibits Premium debuted; Fantastical was named Apple's
      Mac App of the Year.
    - '2024: Fantastical launched for Windows.'
  usage:
    - >
      Users connect calendar and task accounts, create entries with natural-language
      phrases, organize calendars into contextual sets, and manage invitations and
      scheduling.
    - >
      Automation users can create or reveal events through Fantastical's URL handler and
      AppleScript support.
