id: brew:bbftp-client
display-name: bbFTP
repo: https://gitlab.in2p3.fr/cc-in2p3-hpss-service/bbftp
docs:
  - https://bbftp.cc.in2p3.fr/3.2.1.bbftp.html
  - https://bbftp.cc.in2p3.fr/doc.3.2.1.html
  - https://cc-in2p3-hpss-service.pages.in2p3.fr/bbftp
config-file-location:
  unix:
    - ~/.bbftprc
    - /etc/bbftp.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      bbFTP's adoption history is more institutional than mass-market: its feature set
      and official docs target large scientific data transfers, HPSS/RFIO storage,
      grid-style certificate authentication, and Unix platforms such as Scientific
      Linux, Ubuntu, macOS, and Solaris.
  package-nerd-significance:
    - >
      bbFTP is significant as a pre-cloud, research-computing file-transfer package: it
      solved a real package-manager problem for sites moving very large files before
      modern object stores and ubiquitous HTTPS tooling. Its formula also demonstrates
      how Homebrew carries niche scientific infrastructure clients, not just desktop
      developer tools.
  project-history:
    - >
      The official overview says bbFTP was written by Gilles Farrache at the IN2P3
      Computing Center in Lyon, France. The download archive shows public 1.9.x releases
      by 2000, with the 2.x and 3.x lines adding certificate authentication,
      RFIO/HPSS-oriented large-file work, passive mode, remote operations, and platform
      ports.
    - >
      The 3.2.1 documentation was generated in February 2013 and lists 3.2.1 as the
      latest release. The newer IN2P3 GitLab repository preserves the project under the
      CC-IN2P3 HPSS service namespace.
  related-projects:
    - >
      Related projects include GridFTP, scp, rsync, lftp, HPSS/RFIO tooling, and other
      high-throughput scientific data-transfer clients.
  sources:
    - https://bbftp.cc.in2p3.fr/download.html
    - https://bbftp.cc.in2p3.fr/history.html
    - https://bbftp.cc.in2p3.fr/index.html
    - https://gitlab.in2p3.fr/cc-in2p3-hpss-service/bbftp
  summary:
    - >
      bbFTP is IN2P3's secure file-transfer software for large files. It implements its
      own protocol, supports multi-stream transfers, large TCP windows, compression,
      retries, and authentication modes aimed at scientific-computing environments.
  timeline:
    - '2000-08-29: Download archive lists bbftp.v.1.9.0.'
    - '2001-04-05: Version 2.0.0 archive published.'
    - '2003-04-01: Version 3.0.0 released.'
    - '2004-07-22: Version 3.1.0 released with remote operations and site configuration files.'
    - '2005-05-30: Version 3.2.0 released with `bbftpstatus` and Darwin port work.'
    - '2013-02-07: Version 3.2.1 released as the latest listed release.'
  usage:
    - >
      Users run the `bbftp` client to transfer files larger than 2 GB, often with
      multiple data streams, retry behavior, customized timeouts, and secure
      authentication. `bbftpstatus`, added in the 3.2.0 line, provides status queries
      for the transfer system.
related-packages:
  - id: brew:rsync
    reason: >
      Choose rsync when both endpoints support rsync or a remote shell and incremental
      synchronization is the priority; retain bbFTP Client when the destination
      specifically exposes bbftpd and benefits from its tuned multi-stream transfer
      protocol.
    rel: alternative
    sources:
      - https://bbftp.cc.in2p3.fr/3.2.1.bbftp.html
      - https://rsync.samba.org/
tags:
  - cli
  - client
  - file-transfer
  - large-files
  - networking
geiger:
  category: tool
  color: blue
  confidence: medium
  reason: broad file, network, media, or database tool signal
  reasons:
    - broad file, network, media, or database tool signal
  signals:
