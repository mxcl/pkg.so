    - Official bbftp man page documents client usage and configuration behavior.
  history-sources:
    - https://bbftp.cc.in2p3.fr/download.html
    - https://bbftp.cc.in2p3.fr/history.html
    - https://bbftp.cc.in2p3.fr/index.html
    - https://gitlab.in2p3.fr/cc-in2p3-hpss-service/bbftp
  repo-sources:
    - Official IN2P3 GitLab project page for bbFTP is the source-control project URL.
  tags-sources:
