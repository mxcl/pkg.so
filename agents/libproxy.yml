history:
  adoption-history:
    - >
      libproxy spread through desktop and distribution ecosystems because proxy
      configuration is a cross-application problem. Its README lists support for
      Windows, Mac, and Linux/UNIX, and the repository displays Repology badges for
      Arch, Debian, Fedora, FreeBSD, Gentoo, Homebrew, MSYS2, openSUSE, Ubuntu, and
      others.
  package-nerd-significance:
    - >
      libproxy is package-nerd significant because it is plumbing: when proxy
      auto-detection is wrong, every downloader, updater, package manager, and network
      client feels broken. Packaging it consistently lets desktop and CLI software share
      one resolver instead of each shipping a slightly different proxy stack.
    - >
      The 0.5 rewrite and later fixes show why distributions care about this library
      despite its small API. Build options, PAC JavaScript engines, desktop plugins, and
      platform-specific proxy stores all affect whether higher-level network software
      works behind corporate and campus proxies.
  project-history:
    - >
      The project originated before its GitHub repository; the 0.4.12 release notes on
      2016-01-12 explicitly say development moved to `github.com/libproxy/libproxy`. The
      GitHub repository itself was created on 2015-04-17.
    - >
      The 0.4 series carried the traditional plugin-heavy proxy resolver stack,
      including desktop-environment integration and JavaScript engines for PAC. In 2023,
      the 0.5.0 release included a complete rewrite, and subsequent 0.5.x releases
      concentrated on platform behavior, Windows handling, XDG Desktop Portal support,
      PAC edge cases, packaging, and build cleanup.
  related-projects:
    - >
      GNOME, KDE, XDG Desktop Portal, PAC and WPAD implementations, GLib/GIO networking,
      curl-like downloaders, and operating-system proxy settings are the related
      ecosystem.
  sources:
    - https://api.github.com/repos/libproxy/libproxy
    - https://api.github.com/repos/libproxy/libproxy/releases
    - https://formulae.brew.sh/formula/libproxy
    - https://github.com/libproxy/libproxy
    - https://libproxy.github.io/libproxy
    - https://raw.githubusercontent.com/libproxy/libproxy/main/README.md
  summary:
    - >
      libproxy is a cross-platform library for automatic proxy configuration. It exists
      so applications can ask one question, how to reach a network resource, without
      each application reimplementing environment-variable parsing, desktop proxy
      settings, PAC, WPAD, and network-change behavior.
  timeline:
    - '2015-04-17: The GitHub repository was created.'
    - '2016-01-12: Version 0.4.12 noted the move of development to GitHub.'
    - >
      2020-12-04: Version 0.4.16 fixed CVE-2020-26154 and CVE-2020-25219 and updated
      PAC-related internals.
    - '2023-05-15: Version 0.5.0 shipped a complete rewrite.'
    - '2024-04-25: Version 0.5.6 added XDG Desktop Portal proxy resolver support.'
  usage:
    - >
      Applications and libraries use libproxy to resolve the proxy or direct connection
      to use for a URL. Homebrew also installs the `proxy` command, giving users a small
      CLI surface around the same automatic proxy-resolution behavior.
