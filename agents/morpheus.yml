history:
  project-history:
    - >
      A major milestone for the software was the 2014 Bioinformatics article by Jörn
      Starruß, Walter de Back, Lutz Brusch, and Andreas Deutsch, which presented
      Morpheus as a user-friendly environment for integrating cell-based models with ODE
      and reaction-diffusion systems. The paper emphasized model construction in
      biological and mathematical terms rather than programming code, plus support for
      simulation, visualization, archiving, and batch processing.
  sources:
    - https://formulae.brew.sh/formula/morpheus
    - https://gitlab.com/morpheus.lab/morpheus
    - https://morpheus.gitlab.io/
    - >
      https://morpheus.gitlab.io/publication/2014/01/17/morpheus-a-user-friendly-modeling-environment-for-multiscale-and-multicellular-systems-biology/
  summary:
    - >
      Morpheus is a TU Dresden-centered modeling and simulation environment for
      multiscale and multicellular systems biology. The project page describes it as a
      tool for coupling ordinary differential equations, partial differential equations,
      and cellular Potts models in 2D or 3D, with a declarative GUI workflow and a
      MorpheusML model-description language. The GitLab project credits Jörn Starruß,
      Justin Bürger, and other TU Dresden contributors.
  usage:
    - >
      In practice, Morpheus is used by computational biology researchers and educators
      to build shareable multicellular models, run simulations, visualize output, and
      perform parameter scans. Its package-manager role is unusual for Homebrew: it
      ships both command-line and GUI entry points, making a research desktop
      application available through a developer-oriented package manager.
related-packages:
  - id: brew:gnuplot
    reason: >
      Install gnuplot alongside Morpheus for its documented plotting workflow; Morpheus
      can locate it from PATH or use a path selected in the GUI or simulator options.
    rel: adjacent_workflow
    sources:
      - https://morpheus.gitlab.io/faq/settings/gnuplot-path/
      - http://www.gnuplot.info/documentation.html
