history:
  adoption-history:
    - >
      Keyguard expanded across Android, Wear OS, Linux, Windows, and macOS and is
      available through several platform-native distribution channels, including
      Homebrew Cask on macOS. It remains an independent client and is not affiliated
      with Bitwarden.
    - >
      Support for both hosted and self-hosted Bitwarden-compatible services, alongside
      KeePass files, positions Keyguard as an alternative client spanning
      cloud-synchronized and file-based vault workflows.
  package-nerd-significance:
    - >
      Keyguard is notable to package users as a multiplatform alternative implementation
      in the Bitwarden and KeePass ecosystems. Its Kotlin Multiplatform, Compose
      Multiplatform, and native Rust architecture also makes it an example of a modern
      cross-platform security application.
    - >
      Packagers and users must preserve the distinction between protocol and data-format
      compatibility and official vendor status: Keyguard is third-party software, not a
      Bitwarden application.
  project-history:
    - >
      Artem Chepurnyi created Keyguard as an independent password manager and
      third-party client for the Bitwarden platform. The official project copyright
      history begins in 2021.
    - >
      The project broadened beyond Bitwarden-compatible accounts to include KeePass KDBX
      files, offline vault access, passkeys, security auditing, multi-account operation,
      and desktop SSH and GPG agent functions.
  related-projects:
    - 'Bitwarden: the vault platform and server ecosystem supported by Keyguard.'
    - >
      Vaultwarden: a self-hosted Bitwarden-compatible server documented as supported by
      Keyguard.
    - 'KeePass: the KDBX file ecosystem supported by Keyguard.'
    - >
      Kotlin Multiplatform, Compose Multiplatform, and Rust: principal implementation
      technologies identified by the official repository.
  sources:
    - https://github.com/AChep/keyguard-app
    - https://keyguard.dev/
    - https://keyguard.dev/docs/
  summary:
    - >
      Keyguard is an independent cross-platform password manager and client for
      Bitwarden-compatible services and KeePass KDBX files.
  timeline:
    - '2021: The official project copyright history begins.'
    - >
      2020s: Keyguard expanded across Android, Wear OS, Linux, Windows, and macOS and
      added KeePass support alongside Bitwarden-compatible accounts.
  usage:
    - >
      Users connect one or more Bitwarden-compatible accounts or open KeePass databases,
      then search, organize, autofill, synchronize, and audit vault items. Keyguard also
      supports offline access, passkeys, password and key generation, backups, and SSH
      or GPG agent workflows on supported platforms.
