credentials-file-location: null
history:
  adoption-history:
    - >
      The developer reports that CodeKit quickly gained users at organizations including
      Google, General Electric, major advertising agencies, and Barack Obama's 2012
      campaign. Its project configuration file also supported team adoption by making
      build settings portable through version control.
  package-nerd-significance:
    - >
      CodeKit is emblematic of the Mac-native GUI build-tool era: it wrapped rapidly
      changing front-end compilers and optimizers in a file-watching desktop application
      for developers who preferred not to assemble command-line pipelines. Its
      version-controlled config.codekit3 file bridges GUI configuration and reproducible
      team workflows.
  project-history:
    - >
      Developer Bryan Jones first created a Coda plugin to compile Less, then expanded
      it into Less.app. Requests for equivalent Sass and CoffeeScript tooling led him to
      build CodeKit during 2011. A public beta shipped in November 2011, paid licenses
      followed in April 2012, and CodeKit 2 arrived in March 2014 after a substantial
      redesign. CodeKit 3 later introduced another major interface and configuration
      generation.
  related-projects:
    - >
      CodeKit grew directly from Less.app and integrates front-end tools and languages
      including Sass, Less, Stylus, Babel, Rollup, Terser, PostCSS, TypeScript,
      CoffeeScript, Pug, and image optimizers.
  sources:
    - 'Official developer history: https://codekitapp.com/about/'
    - 'Official getting-started documentation: https://codekitapp.com/help/'
    - 'Official team-workflow documentation: https://codekitapp.com/help/teams/'
    - 'Official upgrade documentation: https://codekitapp.com/help/upgrading/'
  summary:
    - >
      CodeKit is a commercial macOS application that watches web-project files and
      provides a graphical build pipeline for compiling languages, bundling and
      minifying assets, optimizing images, and refreshing browsers.
  timeline:
    - '2011: CodeKit 1.0 was developed from the earlier Less.app concept.'
    - '2011-11: Public beta shipped.'
    - '2012-04: Commercial license sales began.'
    - '2014-03: CodeKit 2 shipped.'
    - '2016: CodeKit 3-era upgrades and discounted migrations began.'
  usage:
    - >
      A developer drags a website folder into CodeKit, adjusts project or file-specific
      processing settings, and lets the application rebuild assets and refresh connected
      browsers when files change. Teams commit config.codekit3 so collaborators receive
      the same project settings after cloning the repository.
