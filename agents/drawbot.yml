history:
  adoption-history:
    - >
      DrawBot has been used in the TypeMedia department at the Royal Academy of Art in
      The Hague. Its official documentation presents it as both a graphics-production
      environment and a teaching tool that gives students immediate visual feedback
      while learning programming concepts.
    - >
      The self-contained macOS application avoids requiring users to install Python
      separately, which makes it suitable for classrooms, typography workshops, and
      designers experimenting with code.
  package-nerd-significance:
    - >
      DrawBot occupies a distinctive intersection of Python tooling, typography,
      generative graphics, and macOS application packaging. It exposes a scriptable
      graphics API while remaining approachable as a standalone desktop application.
    - >
      Its longevity in design education makes it an important example of domain-specific
      creative coding software distributed outside the conventional Python command-line
      ecosystem.
  project-history:
    - >
      DrawBot began in 2003 under the name DesignRobots for a Python workshop at the
      TypoTechnica conference. It subsequently evolved into a Cocoa application with a
      graphics API and image-export facilities.
    - >
      The first Cocoa release supported basic geometric shapes and Bézier paths but not
      text. Version 2.0 added extensive API and text improvements, and version 3 was a
      complete rewrite with further API changes.
  related-projects:
    - DesignRobots was the original name of the project.
    - Python is DrawBot's scripting language and implementation language.
  sources:
    - 'Official application guide: https://www.drawbot.com/content/drawBotApp.html'
    - 'Official documentation: https://www.drawbot.com/'
    - 'Official history: https://www.drawbot.com/content/history.html'
  summary:
    - >
      DrawBot is a free macOS creative-coding application that executes Python scripts
      to produce two-dimensional graphics, typography, images, and animations.
  timeline:
    - '2003: The project began as DesignRobots for a TypoTechnica Python workshop.'
    - 'First Cocoa release: Version 0.9a added rectangles, ovals, and Bézier paths.'
    - '2007: Version 2.0 brought major API and text improvements.'
    - 'Version 3: The application was completely rewritten.'
  usage:
    - >
      Users write Python in DrawBot's built-in editor, inspect output and tracebacks,
      preview generated pages, and export work as formats including PDF, SVG, PNG, JPEG,
      TIFF, and movies. The editor also offers interactive value manipulation and an
      optional live-coding mode.
