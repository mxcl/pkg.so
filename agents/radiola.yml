    - >
      Radiola is distributed through its official GitHub releases and as a Homebrew
      cask, giving macOS users both direct-download and package-managed installation
      paths.
  package-nerd-significance:
    - >
      Radiola is a focused, open-source menu-bar application that exemplifies the small
      native utilities commonly surfaced through Homebrew Cask: narrow in scope, easy to
      install, and maintained through public releases.
  project-history:
    - >
      The available official material documents an actively maintained macOS radio
      player but does not provide a detailed origin narrative. Its release history shows
      continuing development around playback reliability, station management, AirPlay,
      imports, exports, and newer macOS compatibility.
  related-projects:
    - Homebrew Cask provides the package-managed installation route documented by the project.
    - Radio Browser is integrated as a station-search source in recent Radiola releases.
