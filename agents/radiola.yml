  summary:
    - >
      Radiola is a lightweight macOS Internet-radio player that lives in the menu bar.
      It is designed for quickly selecting and listening to streams without opening a
      full media player.
  timeline:
    - >
      Recent releases: Added AirPlay, CSV/M3U station import and export, Radio Browser
      improvements, and playback-recovery work.
  usage:
    - >
      Users normally select a station from the menu-bar interface, manage stations in a
      dedicated window, and inspect recently played track history. The project documents
      installation from GitHub Releases or with `brew install --cask radiola`.
