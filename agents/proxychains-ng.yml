config-file-location:
  unix:
    - $PROXYCHAINS_CONF_FILE
    - ./proxychains.conf
    - ~/.proxychains/proxychains.conf
    - $(sysconfdir)/proxychains.conf
    - /etc/proxychains.conf
credentials-file-location:
  unix:
    - $PROXYCHAINS_CONF_FILE
    - ./proxychains.conf
    - ~/.proxychains/proxychains.conf
    - $(sysconfdir)/proxychains.conf
history:
  adoption-history:
    - >
      ProxyChains-NG is packaged across major Linux distributions, Homebrew, MacPorts,
      Nix, and other package ecosystems. The official README lists Linux, BSD, macOS,
      and Haiku support.
  package-nerd-significance:
    - >
      The package is a classic Unix interposition hack: it can proxy an otherwise
      proxy-unaware dynamically linked TCP client without modifying that client. Its
      reliance on loader behavior also explains its well-known limitations with static
      binaries, scripts, daemons, and protected executables.
  project-history:
    - >
      ProxyChains-NG is the maintained new-generation continuation of the earlier,
      unmaintained ProxyChains project. Development and releases moved to the
      rofl0r/proxychains-ng GitHub repository rather than the legacy SourceForge page.
  related-projects:
    - >
      It works with SOCKS4a, SOCKS5, and HTTP CONNECT proxies and is often paired with
      Tor or SSH-created SOCKS endpoints. The README recommends network-layer approaches
      such as iptables when loader interposition is unsuitable.
  sources:
    - https://github.com/rofl0r/proxychains-ng
    - https://github.com/rofl0r/proxychains-ng/releases
  summary:
    - >
      ProxyChains-NG is a Unix shared-library preloader that hooks networking functions
      in dynamically linked programs and redirects their TCP connections through one or
      more SOCKS or HTTP proxies.
  timeline:
    - ProxyChains-NG began as a continuation of the unmaintained original ProxyChains project.
    - >
      Version 4.x established the `proxychains4` command and configuration format used
      by current packages.
  usage:
    - >
      Prefix a dynamically linked client command with `proxychains4` after defining
      proxy endpoints and chain behavior in `proxychains.conf`. Users should verify the
      observed public address before sensitive use because unsupported programs can
      bypass the hooks.
