history:
  adoption-history:
    - >
      glslViewer gained visibility among shader artists and graphics programmers because
      it connects command-line ergonomics with shader-toy-style iteration. Repository
      metadata shows thousands of stars and hundreds of forks, while the wiki and README
      point to an ecosystem of installation guides, usage guides, conventions, Discord
      discussion, and acknowledgements for Windows support, ShaderToy compatibility, OSC
      integration, and related creative-coding projects.
    - >
      Its Homebrew and other package-manager entries make it easy to add shader
      previewing to a workstation without setting up a full engine. That packaging story
      is especially useful for workshops, live coding, CI rendering, and reproducible
      art pipelines.
  package-nerd-significance:
    - >
      glslViewer is significant because it packages a graphics sandbox as a Unix-like
      command. It gives shader practitioners a small installed tool that can bridge
      notebooks, shell scripts, art installations, classroom demos, and engine-adjacent
      shader experiments.
  project-history:
    - >
      Patricio Gonzalez Vivo opened the public glslViewer repository in 2014. The
      project grew around a practical idea from shader art and graphics prototyping:
      make GLSL sketches runnable from a terminal, with file hot reload, texture
      loading, model loading, and interactive control through standard console streams
      or OSC.
    - >
      The README documents expansion from fragment and vertex shader display into a
      broader sandbox: include resolution, user-defined uniforms, automatically
      generated defines, image and video textures, OBJ/PLY/glTF import, PBR defaults,
      debug modes, shadow maps, headless rendering, image and PNG-sequence export,
      screensaver mode, and WebAssembly cross-compilation.
  related-projects:
    - The README acknowledges inspiration from fragTool and hdreffects.
    - >
      ShaderToy compatibility and creative-coding workflows connect glslViewer to the
      wider shader art ecosystem.
    - OpenGL, GLFW, GLSL, and WebGL topics frame its graphics-tooling context.
  sources:
    - https://api.github.com/repos/patriciogonzalezvivo/glslViewer
    - https://github.com/patriciogonzalezvivo/glslViewer
    - https://github.com/patriciogonzalezvivo/glslViewer/wiki
    - https://raw.githubusercontent.com/patriciogonzalezvivo/glslViewer/main/README.md
  summary:
    - >
      glslViewer is a console-based OpenGL sandbox for displaying and live-editing 2D
      and 3D GLSL shaders without building a separate graphical user interface. It fits
      the creative-coding side of package-manager culture: install a binary, point it at
      shader files and media, and iterate quickly.
  timeline:
    - '2014: Public GitHub repository created.'
    - "2015: The project had an official project page under Patricio Gonzalez Vivo's site."
    - >
      Later development: README-documented features expanded to OSC control, asset
      loading, headless rendering, export, and WebAssembly builds.
  usage:
    - >
      Practitioners use glslViewer to load a fragment shader, pair geometry with vertex
      shaders, attach image, video, camera, or audio textures, and edit shader files
      while the viewer hot-reloads changes. The wiki documents workflows for single
      fragment shaders, 3D models, PBR material editing, uniforms, defines, and console
      input commands.
    - >
      The tool also serves automation uses: headless rendering, still-image export, PNG
      sequence export, screensaver mode, and OSC or POSIX stream control let other
      programs drive shader rendering without embedding a custom renderer.
related-packages:
  - id: cask:kodelife
    reason: >
      Choose KodeLife when you want a native graphical shader IDE with an integrated
      editor and multi-API support; glslViewer is better suited to terminal-driven GLSL
      and scripted rendering workflows.
    rel: alternative
    sources:
      - https://github.com/patriciogonzalezvivo/glslViewer
      - https://hexler.net/kodelife/docs
      - https://hexler.net/kodelife/manual/introduction
