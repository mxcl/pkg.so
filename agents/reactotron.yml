credentials-file-location: null
history:
  adoption-history:
    - >
      Infinite Red describes Reactotron as its original in-house debugger and a tool it
      uses in day-to-day client development. It is available on macOS, Linux, and
      Windows, and its client libraries are installed as development dependencies so
      they can be excluded from production builds.
    - >
      A 2018 Chain React conference talk, referenced by the official project, presented
      Reactotron's debugging workflow to the broader React Native community.
  package-nerd-significance:
    - >
      Reactotron packages a developer-controlled telemetry channel and desktop inspector
      without requiring a commercial monitoring service. Its extensible plugin model and
      support for Redux, MobX State Tree, Async Storage, MMKV, networking, benchmarks,
      and custom commands make it a recognizable part of the React Native debugging
      ecosystem.
  project-history:
    - >
      Reactotron originated at Infinite Red; the official repository credits Stephen
      'skellock' Grider with creating it and Infinite Red, rmevans9, and numerous
      contributors with its subsequent development. The project evolved into a monorepo
      containing a cross-platform desktop application, React and React Native clients,
      and an extensible collection of plugins.
  related-projects:
    - >
      Infinite Red's Ignite React Native starter has historically included
      Reactotron-ready development workflows.
    - >
      reactotron-react-native and reactotron-react-js connect applications to the
      desktop client.
    - >
      reactotron-redux and other plugins extend inspection to state-management and
      storage systems.
  sources:
    - https://docs.infinite.red/reactotron/
    - https://docs.infinite.red/reactotron/plugins/
    - https://docs.infinite.red/reactotron/quick-start/getting-started/
    - https://docs.infinite.red/reactotron/quick-start/react-native/
    - https://github.com/infinitered/reactotron
  summary:
    - >
      Reactotron is Infinite Red's open-source desktop debugger for React and React
      Native projects. It receives development-time events over WebSockets and presents
      application state, network activity, logs, errors, performance measurements, and
      plugin-provided tools.
  timeline:
    - >
      2018: Reactotron was featured in the official project's recommended Chain React
      talk, “Debugging and Beyond with Reactotron.”
    - >
      The project expanded into a cross-platform monorepo with desktop, React, React
      Native, and plugin packages.
  usage:
    - >
      Developers run the Reactotron desktop application, add the appropriate client as a
      development dependency, and create ReactotronConfig.js in the project root. The
      client can report logs, state changes, API traffic, errors, storage contents, and
      benchmarks; plugins add Redux, MMKV, Storybook, overlay, and custom-command
      workflows. Official guidance recommends disabling the connection in production
      builds.
