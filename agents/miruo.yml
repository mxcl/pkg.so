history:
  sources:
    - https://formulae.brew.sh/formula/miruo
    - https://github.com/KLab/miruo
    - https://www.freshports.org/net/miruo/
  summary:
    - >
      miruo is a small network-analysis command-line tool from KLab. Its upstream README
      describes it in Japanese as a packet-capture TCP session monitor that groups
      packets by TCP session, summarizes connection and disconnection portions, detects
      retransmitted segments, long-running communications, reset-aborted sessions, and
      IP-fragmented segments, and can read files saved by tcpdump -w. Homebrew packages
      it as a GPL-3.0-only utility with the single miruo executable.
  usage:
    - >
      The tool's adoption record is modest but source-backed: FreeBSD added a net/miruo
      port in 2015 and described it as a network monitor/analyzer that prints packets on
      the terminal in a neat style and can read tcpdump capture files. Its practical
      role overlaps with tcpdump and Wireshark workflows, but with a narrower
      terminal-first focus on making TCP sessions easier to scan rather than offering a
      full graphical protocol analyzer.
related-packages:
  - id: brew:tcpdump
    reason: >
      Use tcpdump to capture or filter traffic and write a pcap file, then pass that
      file to miruo for its documented TCP-session-oriented summary.
    rel: adjacent_workflow
    sources:
      - https://github.com/KLab/miruo
      - https://github.com/the-tcpdump-group/tcpdump
  - id: brew:wireshark
    reason: >
      Choose Wireshark when you need broad protocol dissection, display filters, and
      interactive packet inspection rather than miruo's lightweight TCP-session summary.
    rel: alternative
    sources:
      - https://github.com/KLab/miruo
      - https://www.wireshark.org/docs/
