history:
  adoption-history:
    - >
      Reverso expanded from early online translation and electronic dictionaries into a
      cross-device language platform spanning the web, desktop, mobile, and browser
      extensions. Its official materials report tens of millions of users and
      application downloads, while registered accounts synchronize favorites and search
      history across supported surfaces.
  package-nerd-significance:
    - >
      Reverso represents the desktop-client form of a long-running hosted language
      platform rather than a self-contained offline translator. Package users obtain
      quick system-wide access to translation and writing tools, while much of the
      product's value comes from Reverso's online linguistic services and synchronized
      account data.
  project-history:
    - >
      Founder and CEO Théo Hoffenberg led Reverso from the early Internet era, initially
      developing electronic dictionaries and a free online translation service. The
      product family later added contextual translation from bilingual corpora,
      collaborative dictionaries, neural machine translation, writing correction,
      adaptive vocabulary learning, and native desktop and mobile clients.
  related-projects:
    - >
      The wider Reverso family includes Reverso Context, Translate Text, document
      translation, grammar checking, dictionaries, conjugation, browser extensions,
      mobile applications, and Reverso Corporate services.
  sources:
    - https://context.reverso.net/translation/about
    - https://www.corporate-translation.reverso.com/about-us
    - https://www.reverso.net/windows-mac-app/en
  summary:
    - >
      Reverso is a proprietary cross-platform translation, writing-assistance,
      dictionary, and language-learning service whose desktop client integrates those
      services with everyday computer workflows.
  timeline:
    - 'Early Internet era: Reverso launched a free online translation service.'
    - '2009: The Reverso team created its Collaborative Dictionary.'
    - '2010s: Reverso expanded contextual translation and cross-device applications.'
    - >
      2020s: The desktop application combines translation with AI-assisted correction,
      rephrasing, vocabulary saving, and learning tools.
  usage:
    - >
      Desktop users select text in browsers, email, messaging, or documents and invoke
      Reverso to translate it without changing applications. The product also offers
      contextual examples, pronunciation, favorites, vocabulary practice, correction,
      and rephrasing; signing in enables synchronization of favorites and search
      history.
