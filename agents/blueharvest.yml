history:
  adoption-history:
    - >
      BlueHarvest has remained useful as Macs have increasingly shared removable media,
      network storage, and ZIP archives with non-Mac systems. Its official release
      history shows continued maintenance across many macOS generations, including Apple
      Silicon and macOS Tahoe support.
  package-nerd-significance:
    - >
      BlueHarvest addresses a familiar cross-platform nuisance: Finder metadata such as
      .DS_Store, AppleDouble files, and __MACOSX directories appearing on non-Mac
      storage. Packaging it as a Homebrew cask makes a small but persistent macOS
      hygiene utility easy to redeploy.
  project-history:
    - >
      BlueHarvest was developed by zeroonetwenty as a macOS utility for automatically
      removing Mac-specific metadata from removable and network storage. The application
      expanded beyond background cleaning to Finder actions, ZIP cleaning, whitelists,
      scheduled cleaning, previews, logging, and Apple Silicon support.
  related-projects:
    - >
      BlueHarvest Lite is the Mac App Store-oriented variant with additional
      sandbox-related limitations.
    - Finder creates some of the metadata that BlueHarvest removes.
    - Homebrew Cask provides the macOS package-manager entry.
  sources:
    - https://www.zeroonetwenty.com/blueharvest/
    - https://www.zeroonetwenty.com/blueharvest/how-to.html
    - https://www.zeroonetwenty.com/blueharvest/release-notes.html
    - https://www.zeroonetwenty.com/blueharvestlite/frequently-asked-questions.html
  summary:
    - >
      BlueHarvest is a long-running macOS utility that removes Mac metadata files from
      removable disks, network volumes, folders, and ZIP archives.
  timeline:
    - >
      2018: BlueHarvest 7 added broader metadata removal, scheduled cleaning, previews,
      and logging.
    - '2024: Version 8.3 improved renamed-disk handling and startup reliability.'
    - '2025: Version 8.4 added optional __MACOSX-folder deletion and improved error reporting.'
    - >
      2026: Version 8.5 added support for disks mounted in the user's Application
      Support folder.
  usage:
    - >
      Users configure BlueHarvest through its application preferences to clean non-Mac
      disks, network disks, or selected locations automatically. They can also invoke
      “Clean using BlueHarvest” from Finder for a disk, folder, or ZIP archive.
