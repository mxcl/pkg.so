history:
  adoption-history:
    - >
      ColorSnapper's official site says its magnifying-glass interaction was introduced
      in 2010 and subsequently adopted by modern color-picker applications. The first
      generation supported five OS X releases before development shifted to ColorSnapper
      2.
  package-nerd-significance:
    - >
      It is a compact example of a native macOS design utility distributed outside the
      Mac App Store and packaged by Homebrew Cask. Developers value its many
      code-oriented export formats, color-profile conversion, keyboard workflow, and
      direct copying into editors.
  project-history:
    - >
      The original ColorSnapper magnifier appeared in 2010. ColorSnapper 1 was released
      in 2011, and ColorSnapper 2 received its initial public release in May 2015.
      Version 1.7.0 added a universal Apple Silicon/Intel binary and modern CSS
      color-space support in May 2026.
  related-projects:
    - Apple Color Panel
    - Adobe Photoshop
    - Adobe Illustrator
    - macOS Digital Color Meter
  sources:
    - https://colorsnapper.com/
    - https://colorsnapper.com/changelog/
    - https://colorsnapper.com/faq/
  summary:
    - >
      ColorSnapper 2 is a commercial macOS color picker for sampling screen pixels,
      adjusting and organizing colors, and exporting values in formats suited to design
      and source code.
  timeline:
    - '2010: Original ColorSnapper magnifying glass introduced'
    - '2011: ColorSnapper 1 released'
    - '2015-05-01: ColorSnapper 2 initial public release'
    - '2026-05-07: Version 1.7.0 added native Apple Silicon support and modern CSS color spaces'
  usage:
    - >
      Users invoke a global shortcut, select a screen pixel through the magnifying
      loupe, choose an export format, and paste the resulting value into a design or
      development tool. The application also keeps color history and favorites and can
      adjust colors through Apple's Color Panel.
