id: cask:notesollama
display-name: NotesOllama
repo: https://github.com/andersrex/notesollama
docs:
  - https://github.com/andersrex/notesollama#readme
config-file-location:
  macos:
    - NotesOllama.app/Contents/Resources/commands.json
credentials-file-location: null
history:
  adoption-history:
    - >
      NotesOllama attracted users interested in adding locally hosted generative-AI
      commands to Apple Notes without routing note content through a hosted model
      provider. The official repository later entered an unmaintained, as-is state,
      limiting expectations for continued compatibility work.
  package-nerd-significance:
    - >
      NotesOllama is a compact example of composing a native SwiftUI utility, the macOS
      accessibility API, and a separately managed local model server. It exposes the
      Ollama endpoint through an environment variable and stores customizable prompt
      commands as a JSON resource inside the application bundle.
  project-history:
    - >
      Anders Rex published NotesOllama in 2024 as an open-source macOS utility inspired
      by Obsidian Ollama. It uses AXSwift to interact with Apple Notes and OllamaKit to
      communicate with Ollama. The maintainer subsequently marked the repository as no
      longer maintained.
  related-projects:
    - Ollama supplies the local model service.
    - Apple Notes is the host application controlled through macOS accessibility APIs.
    - Obsidian Ollama is identified by the author as the project's inspiration.
    - NotesCmdr is another Apple Notes utility from the same developer.
  sources:
    - https://github.com/andersrex/notesollama
    - source_facts.homepage
  summary:
    - >
      NotesOllama is an open-source macOS utility that sends selected Apple Notes
      content to locally running Ollama models and inserts model-assisted results into
      Notes.
  timeline:
    - '2024: Anders Rex published NotesOllama under the MIT License.'
    - 'Later: The official repository was marked unmaintained and provided as-is.'
  usage:
    - >
      Users run Ollama on its default macOS endpoint, launch NotesOllama, grant the
      required accessibility access, and invoke prompt commands from its magic-wand menu
      while working in Apple Notes. A non-default Ollama service can be selected with
      `NOTESOLLAMA_OLLAMA_BASE_URL`.
    - >
      Custom prompts are stored in `commands.json` inside the NotesOllama application
      bundle. Because Ollama runs locally and no cloud credential is required by
      NotesOllama, no credentials file is documented.
