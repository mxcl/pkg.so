history:
  adoption-history:
    - >
      Arc expanded from its original macOS application to Windows and mobile editions.
      Its official Help Center maintains separate release-note tracks for macOS,
      Windows, iOS, and Android.
  package-nerd-significance:
    - >
      Arc is notable to package-manager users as a proprietary Chromium derivative with
      an unconventional workspace-oriented interface. The Homebrew cask offers a
      reproducible installation path for a browser otherwise distributed through Arc’s
      own release infrastructure.
  project-history:
    - >
      Arc was developed by The Browser Company as a Chromium-based desktop browser.
      Official release-note archives document macOS releases from 2021 onward and later
      Windows and mobile variants.
  related-projects:
    - Chromium is Arc desktop’s underlying open-source browser codebase.
    - Dia is presented by The Browser Company as an evolution of ideas developed through Arc.
  sources:
    - >
      Official Arc Help Center release notes:
      https://resources.arc.net/hc/en-us/sections/20497738798231-Release-Notes
    - >
      Official Arc Privacy & Security documentation:
      https://resources.arc.net/hc/en-us/articles/19434846038935-Privacy-Security
    - 'Official Arc homepage: https://arc.net/'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Arc is a proprietary Chromium-based browser from The Browser Company. It
      emphasizes a workspace-style browsing model and is distributed on macOS through
      the official Arc release service and third-party package metadata such as the
      Homebrew cask.
  timeline:
    - '2021: Arc’s official macOS release-note archive begins.'
    - >
      2022: Arc’s official macOS release notes continued as the browser reached broader
      public use.
    - >
      2023–2026: Official release archives cover macOS and Windows development, with Arc
      Search releases tracked for mobile platforms.
  usage:
    - >
      Users install Arc as a graphical browser and organize browsing into spaces, tabs,
      and other Arc-specific workspace concepts. Package-manager users commonly use the
      Homebrew cask to install or upgrade the signed macOS application.
