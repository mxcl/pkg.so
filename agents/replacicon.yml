history:
  adoption-history:
    - >
      Replacicon draws replacement artwork from online icon collections and targets Mac
      users who want older or inconsistent third-party icons to match the current macOS
      visual style. It also monitors application updates so custom icons can be restored
      when an update replaces them.
  package-nerd-significance:
    - >
      Application icons are normally part of a bundle managed by the application vendor,
      so local icon replacement can be undone during upgrades. Replacicon is noteworthy
      to Mac package users because it automates both discovery and persistence of this
      otherwise fragile customization.
  project-history:
    - >
      Replacicon was created as a focused macOS customization utility for locating and
      applying alternate application icons. Version 2.0 added generation of replacement
      artwork through Apple Intelligence and Image Playground.
  related-projects:
    - The application searches third-party icon sources including macosicons.com.
    - Version 2.0 integrates with Apple's Image Playground where supported.
  sources:
    - 'Official product homepage: https://replacicon.app/'
  summary:
    - >
      Replacicon is a macOS utility that scans installed applications, finds alternate
      icons, applies replacements, restores originals, and helps preserve custom icons
      across application updates.
  timeline:
    - >
      Version 2.0: Added replacement-icon generation using Apple Intelligence and Image
      Playground.
  usage:
    - >
      Users scan installed applications, select an application and alternate icon, and
      apply the replacement. Filters can focus the list on applications in the Dock, and
      original icons can be restored later.
    - Background update monitoring helps reapply customized icons after application upgrades.
