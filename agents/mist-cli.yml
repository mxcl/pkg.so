    - https://marketplace.jamf.com/details/mist
  summary:
    - >
      mist-cli is the command-line edition of MIST, the macOS Installer Super Tool from
      Ninxsoft. Its README describes it as a Mac command-line tool for automatically
      downloading macOS firmwares and installers, while the companion Mist repository
      provides the graphical Mac app for the same job. Homebrew packages the CLI as
      mist-cli and records that the formula was formerly known as mist.
  usage:
    - >
      The tool emerged for a Mac administration workflow that Apple's own
      software-update surfaces do not make especially scriptable: listing available
      macOS installers and Apple Silicon firmware restore files, filtering for
      compatibility or beta releases, exporting inventory data as CSV, JSON, property
      list, or YAML, and downloading the selected installer or IPSW. The README
      documents validation of firmware downloads by SHA-1 checksum and subcommands for
      list, download, and version. In practice, Mac admins and power users use mist-cli
      in scripts, build pipelines, or recovery-media workflows where the GUI app is less
      convenient. Its package-manager niche is a macOS-focused system utility: Homebrew
      exposes the CLI, while the adjacent Mist app serves users who prefer a graphical
      interface.
