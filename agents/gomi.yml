credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents installation through a curl installer, prebuilt
      GitHub release binaries, Homebrew, Scoop, AUR, and the author's afx manifest
      format. That spread is typical for a small CLI whose value comes from being
      available everywhere a shell user might want to replace a dangerous default.
    - >
      Homebrew and other package-manager metadata give gomi a low-friction install route
      for people who do not want to manage GitHub release assets by hand.
  package-nerd-significance:
    - >
      gomi is a neat package-nerd example of replacing a risky POSIX habit with a small
      packaged binary. It respects familiar rm ergonomics while adding XDG trash
      behavior and a restore UI, so distributions can package it as an opt-in safety
      tool rather than a shell framework.
  project-history:
    - >
      The public repository was created in May 2015 under babarot and later describes
      gomi as Japanese for trash. The README frames the project as a response to the
      command-line gap between graphical trash folders and rm, adding a TUI restore
      browser, XDG Trash specification support, multi-volume handling, and YAML
      configuration.
    - >
      The project evolved from a safer rm-style utility into a cross-platform trash CLI
      with release automation and prebuilt binaries. Its configuration path,
      ~/.config/gomi/config.yaml, and its restore browser make it closer to a system
      utility than a one-shot script.
  related-projects:
    - rm is the command-line behavior gomi intentionally resembles.
    - >
      trash-cli and desktop file-manager trash implementations are adjacent tools in the
      same safer-deletion space.
    - >
      The freedesktop.org XDG Trash specification is relevant to gomi's interoperability
      claims.
  sources:
    - https://api.github.com/repos/babarot/gomi
    - https://github.com/babarot/gomi
    - https://github.com/babarot/gomi/releases
    - https://gomi.dev/
    - https://raw.githubusercontent.com/babarot/gomi/main/README.md
  summary:
    - >
      gomi is a Go command-line replacement for rm that moves files into a trash area
      and provides restoration instead of immediate permanent deletion. Its
      package-manager appeal is the Unix-shaped interface: users can install one small
      binary, alias rm to gomi if they choose, and get a safer deletion workflow without
      changing shells or file managers.
  timeline:
    - '2015: GitHub repository created.'
    - '2025: GitHub release pages show the 1.x release stream in active use.'
    - >
      2026: The README documents gomi as a cross-platform trash CLI with XDG Trash
      support, prebuilt binaries, and package-manager installs.
  usage:
    - >
      Typical use is to run gomi with rm-compatible flags, or to alias rm=gomi, so
      deletions are moved to trash. Restoration is launched with --restore or -b,
      opening an interactive browser where users can search, preview, select, and
      restore trashed files.
    - >
      The tool is most useful on developer workstations and servers where mistaken rm
      commands are costly but a full desktop trash workflow is absent or inconvenient.
related-packages:
  - id: brew:trash-cli
    reason: >
      Choose trash-cli for a script-oriented suite of separate put, list, restore,
      empty, and remove commands; choose gomi for rm-compatible flags and an integrated
      restoration TUI, with both interoperating through the XDG Trash specification.
    rel: alternative
    sources:
      - https://gomi.dev/
      - https://github.com/andreafrancia/trash-cli#readme
  - id: brew:rmtrash
    reason: >
      Choose rmtrash for a macOS-specific, rm-like path to the system Trash; choose gomi
      when cross-platform operation, XDG interoperability, or its interactive restore
      browser matters.
    rel: alternative
    sources:
      - https://github.com/babarot/gomi#readme
      - https://github.com/TBXark/rmtrash#readme
  - id: brew:trash
    reason: >
      Choose `trash` when a small macOS utility closely tied to Finder's Trash behavior
      is sufficient; choose gomi for cross-platform support, configuration, and built-in
      restoration.
    rel: alternative
    sources:
      - https://github.com/babarot/gomi#readme
      - https://github.com/ali-rantakari/trash/blob/master/readme.md
