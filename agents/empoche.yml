history:
  adoption-history:
    - >
      Empoche was distributed for Linux, macOS, and Windows. Its official download
      documentation recommended Snap for cross-distribution Linux use and also listed
      AppImage, Debian, RPM, AUR, Homebrew, WinGet, and Chocolatey installation paths.
    - >
      The official FAQ described Empoche as a public beta and stated that desktop and
      web clients were available, with dedicated mobile applications and browser
      extensions planned.
  package-nerd-significance:
    - >
      Empoche is notable as a proprietary-looking desktop productivity application that
      embraced a broad range of native package channels. Its official installation page
      explicitly documented both Homebrew Cask and several Linux and Windows package
      ecosystems.
  project-history:
    - >
      Empoche combined automatic application-usage tracking with tasks, projects, tags,
      scheduling, teams, and productivity reporting. Official documentation also exposed
      help areas for an API, plugins, integrations, translations, a roadmap, and a
      changelog.
  related-projects:
    - >
      The official FAQ says Empoche open-sourced the application-categorization database
      on GitHub, although the main application's official repository is not identified.
  sources:
    - 'Official FAQ: https://empoche.com/help/faq'
    - 'Official documentation: https://empoche.com/documentation'
    - 'Official download page: https://empoche.com/download'
    - 'Official help center: https://empoche.com/help'
  summary:
    - >
      Empoche is a cross-platform task, project, and automatic time-tracking
      application. Its package-manager footprint spanned Homebrew Cask, Snap, AUR,
      WinGet, and Chocolatey alongside conventional installers.
  timeline:
    - 'Public-beta era: Official FAQ described Empoche as open to all registered users.'
    - >
      Version 0.4.5 era: Official download page offered Linux, macOS, and Windows
      packages across numerous distribution channels.
  usage:
    - >
      Users create tasks and projects, organize work with tags and statuses, schedule
      work, and review automatically tracked application time and productivity data.
    - >
      The desktop tracker records application identity and usage duration in chunks.
      Official documentation says tracking can be paused and applications can be placed
      on a block list.
