history:
  adoption-history:
    - >
      Arabica's adoption is niche and library-oriented. The input metadata shows
      Homebrew and MacPorts packaging, while the official GitHub repository has modest
      star and fork counts, consistent with a mature C++ XML component used when a
      project specifically wants this API stack.
  package-nerd-significance:
    - >
      Arabica is the kind of package that keeps old XML-heavy C++ build graphs alive. It
      matters less for trendy CLI workflows and more for packagers who need small,
      standards-flavored C++ XML libraries to keep compiling across modern C++
      transitions.
  project-history:
    - >
      The official GitHub repository was created in September 2012, but the project
      presents itself as a traditional C++ XML toolkit rather than a modern service. Its
      README and repository metadata emphasize standards-style XML APIs: SAX2, DOM,
      XPath, XSLT, and HTML processing.
    - >
      The 2020-April release moved the package to C++14, removed old `std::auto_ptr`
      usage, and cleaned out SAX1-era adapter code that the maintainer described as
      probably never used in Arabica's history.
  related-projects:
    - >
      Related technologies include SAX2, DOM, XPath, XSLT, HTML parsing, XML parsing,
      and C++14.
  sources:
    - https://api.github.com/repos/jezhiggins/arabica
    - https://api.github.com/repos/jezhiggins/arabica/releases
    - https://github.com/jezhiggins/arabica
    - https://github.com/jezhiggins/arabica/tree/main/doc
    - source_facts.package-manager
  summary:
    - >
      Arabica is a C++ XML and HTML processing toolkit. Its official repository
      describes SAX2, DOM, XPath, and XSLT implementations written in Standard C++,
      making it a library package with a small CLI surface rather than an app.
  timeline:
    - '2012: The official GitHub repository was created.'
    - '2020: The 2020-April release required C++14 and removed `std::auto_ptr` usage.'
    - >
      2024: The official GitHub metadata shows repository activity continuing after the
      2020 modernization release.
  usage:
    - >
      Developers use Arabica as a C++ library for SAX2 event parsing, DOM manipulation,
      XPath evaluation, XSLT processing, and HTML/XML tooling. The Homebrew package also
      exposes the `mangle` executable.
related-packages:
  - id: brew:libxml2
    reason: >
      Arabica can use libxml2 as its underlying XML parser, so install it when building
      Arabica with that backend.
    rel: adjacent_workflow
    sources:
      - https://github.com/jezhiggins/arabica
      - https://gnome.pages.gitlab.gnome.org/libxml2/devhelp/
  - id: brew:xerces-c
    reason: >
      Arabica provides SAX2 wrappers for Xerces-C++, making Xerces-C++ a supported
      parser backend when its validation and XML facilities are preferred.
    rel: adjacent_workflow
    sources:
      - https://github.com/jezhiggins/arabica
      - https://xerces.apache.org/xerces-c/
