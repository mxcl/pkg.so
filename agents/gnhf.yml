id: brew:gnhf
display-name: gnhf
repo: https://github.com/kunchenguid/gnhf
docs:
  - https://github.com/kunchenguid/gnhf#readme
config-file-location:
  unix:
    - ~/.gnhf/config.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption evidence is narrow but concrete: the repository publishes an npm-oriented
      install path, Homebrew packages it as a formula, and the README lists supported
      agent backends including Claude Code, Codex, Rovo Dev, OpenCode, GitHub Copilot
      CLI, Pi, and ACP targets. Its package-manager significance is therefore strongest
      among developers already experimenting with long-running code-agent workflows.
  package-nerd-significance:
    - >
      For package nerds, gnhf is interesting as a small example of the coding-agent
      wrapper pattern becoming a normal installable CLI. It packages policy around Git
      cleanliness, commit granularity, failure rollback, and agent selection rather than
      providing a model or editor of its own.
  project-history:
    - >
      The public changelog shows the project starting with version 0.1.1 on March 31,
      2026, followed by quick additions for iteration caps, OpenCode and Rovo Dev
      support, per-agent overrides, worktrees, ACP agents, push mode, and post-run
      summaries. That release cadence reflects the fast-moving 2026 ecosystem around
      local coding agents rather than a long-lived Unix utility lineage.
  related-projects:
    - >
      gnhf wraps coding-agent CLIs such as Claude Code, Codex, OpenCode, Rovo Dev,
      GitHub Copilot CLI, Pi, and ACP-compatible agents. It also depends on Git
      conventions such as branches, worktrees, commits, and clean working trees.
  sources:
    - https://formulae.brew.sh/formula/gnhf
    - https://github.com/kunchenguid/gnhf
    - https://github.com/kunchenguid/gnhf/blob/main/CHANGELOG.md
  summary:
    - >
      gnhf, short for Good Night, Have Fun, is a command-line orchestrator for
      unattended coding-agent runs. Its own README describes a loop that starts from a
      clean Git repository, invokes an agent, records successful iterations as commits,
      and keeps notes and run metadata for later review.
  timeline:
    - '2026-03-31: Changelog records the initial public 0.1.1 release.'
    - '2026-04-01: Early releases add iteration caps and OpenCode/Rovo Dev integrations.'
    - '2026-04-10: Worktree support lands for multiple agent runs against one repository.'
    - '2026-05-03: Post-run exit summaries are added.'
  usage:
    - >
      Practitioners run gnhf inside a Git repository with a natural-language objective,
      optionally setting iteration or token caps, worktree isolation, branch mode, and
      push behavior. It is used as an outer loop around other agent CLIs, turning
      repeated agent attempts into reviewable commits and notes.
related-packages:
  - id: cask:codex
    reason: >
      Codex is a documented gnhf backend; install it when you want gnhf to drive
      OpenAI's coding agent through repeated, commit-producing iterations.
    rel: adjacent_workflow
    sources:
      - https://github.com/kunchenguid/gnhf#agents
      - https://developers.openai.com/codex/cli/
  - id: cask:claude-code
    reason: >
      Claude Code is gnhf's documented default backend and is the appropriate companion
      when your unattended workflow uses Anthropic's terminal coding agent.
    rel: adjacent_workflow
    sources:
      - https://github.com/kunchenguid/gnhf#agents
      - https://docs.anthropic.com/en/docs/claude-code/overview
  - id: brew:opencode
    reason: >
      OpenCode is a documented gnhf backend for users who want an open-source,
      multi-provider coding-agent client beneath the orchestration loop.
    rel: adjacent_workflow
    sources:
      - https://github.com/kunchenguid/gnhf#agents
      - https://opencode.ai/docs/
