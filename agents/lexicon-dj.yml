history:
  adoption-history:
    - >
      Lexicon emerged from Rekordcloud after its creator concluded that a desktop
      application was necessary for reliable interaction with local DJ libraries. Nearly
      two years of development and a year of alpha and beta testing preceded the 1.0
      launch.
    - >
      It established its niche by treating Lexicon as a central library that can
      synchronize metadata across Rekordbox, Serato, Engine DJ, Traktor, VirtualDJ, and
      other DJ workflows. In 2025, library conversion became available on the free plan,
      broadening its utility as a migration and recovery tool.
  package-nerd-significance:
    - >
      DJ libraries contain unusually fragile, vendor-specific data such as cue points,
      beatgrids, loops, playlists, and custom tags. Lexicon matters because it
      translates and backs up that state across otherwise incompatible ecosystems,
      making it both a metadata-management application and an interoperability tool.
  project-history:
    - >
      Lexicon was created by DJ and software developer Christiaan Maks as the desktop
      successor to Rekordcloud. The name changed because the product was no longer
      primarily a cloud website, while Rekordcloud remained the company behind it.
    - >
      Lexicon 1.0 launched on March 1, 2022 after extensive alpha and beta testing.
      Subsequent releases expanded library synchronization, analysis, backup, cloud
      storage, mobile, and hardware-oriented workflows.
  related-projects:
    - Rekordcloud
    - Rekordbox
    - Serato DJ
    - Engine DJ
    - Traktor Pro
    - VirtualDJ
    - djay Pro
    - Apple Music
  sources:
    - https://www.lexicondj.com/about
    - https://www.lexicondj.com/blog/dj-library-conversion
    - https://www.lexicondj.com/blog/lexicon-1
    - https://www.lexicondj.com/blog/the-lexicon-workflow
    - https://www.lexicondj.com/manual/all
  summary:
    - >
      Lexicon DJ is a professional music-library manager designed to sit between DJ
      applications. It organizes tracks and playlists, repairs metadata, manages cues
      and beatgrids, and converts or synchronizes libraries across major DJ platforms.
  timeline:
    - 'Circa 2020: Development of the desktop application began.'
    - '2021: Alpha and beta testing was underway.'
    - '2022: Lexicon 1.0 launched on March 1.'
    - '2025: Cross-application library conversion became free.'
    - '2026: Version 1.11 expanded Pioneer USB and CDJ-oriented workflows.'
  usage:
    - >
      A common workflow is to import an existing DJ library, manage tracks and playlists
      in Lexicon, then synchronize the curated library to one or more performance
      applications. Users also employ its backups, duplicate detection, metadata
      cleanup, tagging, cue tools, and library conversion before changing DJ platforms
      or preparing backup media.
