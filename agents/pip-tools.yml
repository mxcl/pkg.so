docs:
  - https://pip-tools.readthedocs.io/en/stable
  - https://pip-tools.readthedocs.io/en/stable/cli
config-file-location:
  unix:
    - <input-directory>/.pip-tools.toml
    - <input-directory>/pyproject.toml
  windows:
    - <input-directory>\.pip-tools.toml
    - <input-directory>\pyproject.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      pip-tools became a widely packaged companion to pip and is listed by the Python
      Packaging Authority among key packaging projects. Stewardship under Jazzband gives
      it a community-maintained project home, while integrations such as pre-commit
      support place dependency compilation in routine development workflows.
  package-nerd-significance:
    - >
      pip-tools popularized a lightweight input-versus-lock workflow before Python
      standardized a universal application lock file: developers declare broad
      requirements, compile exact transitive pins, and synchronize environments to those
      pins. It remains attractive because its output is ordinary pip-compatible
      requirements files.
  project-history:
    - >
      pip-tools evolved as a pair of focused commands around pip: pip-compile resolves
      abstract dependency declarations into pinned requirements, while pip-sync makes an
      environment match compiled files. The project is now maintained in the Jazzband
      organization.
  related-projects:
    - pip
    - PyPI
    - Jazzband
    - pipenv
    - Poetry
    - uv
  sources:
    - https://github.com/jazzband/pip-tools
    - https://packaging.python.org/en/latest/key_projects/
    - https://pip-tools.readthedocs.io/en/stable/
  summary:
    - >
      pip-tools is a community-maintained set of Python command-line tools for producing
      pinned requirements and synchronizing installed environments.
  timeline:
    - '2010s: pip-tools established the pip-compile and pip-sync workflow.'
    - >
      Later development: Project stewardship moved under Jazzband and support expanded
      to modern pyproject.toml metadata and pip's backtracking resolver.
  usage:
    - >
      pip-compile reads dependencies from pyproject.toml, setup.cfg, setup.py, or
      requirements.in and writes pinned requirements files. pip-sync then installs,
      upgrades, or removes packages so an environment matches those compiled files.
      Compilation should be performed for each target Python environment when dependency
      markers can produce platform-specific results.
