history:
  adoption-history:
    - >
      The developer reports continuing to use the utility weekly more than a decade
      after its 2011 Mac App Store rejection. The official page also notes secondary
      uses such as allowing children or pets near a keyboard without generating input.
  package-nerd-significance:
    - >
      KeyboardCleanTool is a classic single-purpose desktop utility: it temporarily
      changes low-level input behavior to solve a physical maintenance problem. Its
      persistence despite rejection from an application store also illustrates the value
      of direct downloads and package-manager distribution for niche software.
  project-history:
    - >
      KeyboardCleanTool originated as a small side project from the developer of
      BetterTouchTool. Apple rejected it from the Mac App Store in 2011 as
      insufficiently useful, but the developer continued distributing it independently.
    - >
      The application was later completely rewritten using the cleaning engine shared
      with BetterTouchTool, adding optional mouse and trackpad blocking, screen
      darkening, display-sleep prevention, and timed unlocking.
  related-projects:
    - >
      BetterTouchTool: the same developer's broader input customization and automation
      application; its keyboard-clean mode is described as KeyboardCleanTool's modern
      integrated counterpart.
  sources:
    - https://docs.folivora.ai/docs/actions/action-definitions/
    - https://folivora.ai/keyboardcleantool/
  summary:
    - >
      KeyboardCleanTool is a free macOS utility that suppresses keyboard and optional
      pointing-device input while hardware is being wiped.
  timeline:
    - >
      2011: Apple rejected KeyboardCleanTool from the Mac App Store; independent
      distribution continued.
    - >
      2026: The official site documented a complete rewrite sharing its cleaning engine
      with BetterTouchTool.
  usage:
    - >
      A user starts the cleaning mode, wipes the keyboard, Touch Bar, and optionally the
      trackpad or mouse, then unlocks by holding a pointing-device button or by using
      the configured timer. The screen can be darkened to make smudges easier to see.
