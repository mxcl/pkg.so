history:
  adoption-history:
    - >
      packslip ships a GitHub Action for adding signed manifests to release workflows
      and documents consumer integration with mise. Its specification also defines
      behavior for package managers, installers, and mirrors.
    - >
      The available official material documents integrations and intended consumers but
      does not establish broad ecosystem adoption.
  package-nerd-significance:
    - >
      packslip moves release-layout knowledge from package-manager recipes into a
      vendor-signed manifest. That can reduce duplicated filename heuristics while
      letting consumers verify publisher identity, artifact digests, platform selection,
      executable paths, resources, provenance, and host requirements.
    - >
      Its separation of immutable per-release statements from mutable signed release
      lists is relevant to package-manager authors who need both reproducibility and
      later withdrawal or recommendation metadata.
  project-history:
    - >
      Jeff Dickey created packslip as a versioned signed-manifest format and Rust
      reference implementation for vendor binaries. The repository contains the version
      1 specification, CLI, library, GitHub Actions, conformance material, and
      documentation site.
    - >
      The version 1 format is declared stable. The format version is intentionally
      independent of the reference implementation's semantic version.
  related-projects:
    - Sigstore bundles carry packslip signatures and verification material.
    - in-toto statements provide the signed envelope's data model.
    - GitHub Actions can provide keyless workflow identities.
    - mise is a documented consumer integration.
  sources:
    - 'Official contributing guide: https://github.com/jdx/packslip/blob/main/CONTRIBUTING.md'
    - 'Official overview: https://packslip.dev/'
    - 'Official version 1 specification: https://packslip.dev/release/v1/'
    - 'Official workflow guide: https://packslip.dev/docs/release-workflow/'
  summary:
    - >
      packslip is a stable version 1 signed-manifest format and toolchain for
      describing, selecting, and verifying vendor release artifacts.
  timeline:
    - >
      Version 1: The release-manifest format was declared stable; official sources
      reviewed here do not publish a reliable origin date.
  usage:
    - >
      Publishers run packslip after building, packaging, and platform-signing their
      release files. It hashes the final artifacts, records their platform and archive
      layout, and signs an in-toto statement using a CI identity or Ed25519 key.
    - >
      Consumers verify the signer and signed metadata, select a compatible artifact,
      download it, and confirm its digest before installation. The optional release.toml
      manifest describes complex release layouts during the build.
