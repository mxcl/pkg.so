history:
  adoption-history:
    - >
      Official README installation instructions include Homebrew, go install, and
      release binaries, and the acknowledgments thank contributors for getting the
      project into Homebrew. That is a small but concrete signal that the project
      intentionally targeted package-manager distribution.
  package-nerd-significance:
    - >
      Cyphernetes is package-nerd-interesting because it turns a familiar database
      query-language style into a Kubernetes CLI. It belongs to the family of
      kubectl-adjacent tools that trade verbose shell pipelines for a domain language
      and then ship as one installable binary.
  project-history:
    - >
      The GitHub repository was created in November 2023. Its README describes
      Cyphernetes as a Cypher-inspired query language for Kubernetes, mixing ASCII-art,
      SQL, and JSONPath ideas so users can express Kubernetes graph operations more
      directly than with long kubectl pipelines.
    - >
      The repository is organized as a monorepo containing the core parser and engine,
      the cyphernetes CLI, a web client, docs, and an operator. That layout explains why
      the Homebrew package is a CLI but the project is broader than a single command.
  related-projects:
    - Neo4j Cypher is the named inspiration for the query language.
    - kubectl is the operational baseline Cyphernetes often replaces or complements.
    - The Cyphernetes operator extends the query language into Kubernetes workflow automation.
  sources:
    - https://github.com/AvitalTamir/cyphernetes
    - https://github.com/AvitalTamir/cyphernetes#readme
    - https://github.com/AvitalTamir/cyphernetes/tree/main/docs
    - https://api.github.com/repos/AvitalTamir/cyphernetes
    - https://api.github.com/repos/AvitalTamir/cyphernetes/releases?per_page=10
    - https://api.github.com/repos/AvitalTamir/cyphernetes/tags?per_page=100
  summary:
    - >
      Cyphernetes is a Kubernetes query tool that applies a Cypher-inspired graph
      language to Kubernetes resources. It packages Kubernetes inspection and mutation
      workflows as shell, one-shot CLI, web UI, kubectl plugin, Go API, and operator
      entry points.
  timeline:
    - '2023: AvitalTamir/cyphernetes repository created on GitHub.'
    - '2024: Early v0.1 through v0.6 tags appear in the repository tag history.'
    - >
      2025: v0.18.x releases published and Homebrew installation documented in the
      official README.
  usage:
    - >
      Users run cyphernetes web for a local web client, cyphernetes shell for an
      interactive shell, cyphernetes query for one-off scripts and CI/CD, kubectl cypher
      as a plugin, or the operator for dynamic Kubernetes workflows. Queries can match
      Kubernetes resources, filter them by status fields, return projections, or create
      related resources such as Services from Deployments.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Choose kubectl for the standard resource-oriented Kubernetes command set; choose
      Cyphernetes when graph patterns make relationships across resources easier to
      query or modify.
    rel: alternative
    sources:
      - https://cyphernet.es/docs/cli/
      - https://kubernetes.io/docs/reference/kubectl/
