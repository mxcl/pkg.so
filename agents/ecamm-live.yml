history:
  adoption-history:
    - >
      Ecamm Live is aimed at Mac-based creators, educators, interviewers, podcasters,
      marketers, and live sellers who need a packaged production workflow without
      assembling a conventional broadcast-control stack.
  package-nerd-significance:
    - >
      For package-management users, Ecamm Live is an example of a proprietary,
      subscription-oriented macOS creative application distributed as a Homebrew cask.
      The cask makes an otherwise vendor-downloaded application reproducible within a
      broader Mac software setup.
  project-history:
    - >
      Ecamm Live is developed by Ecamm as a macOS live-streaming and video-production
      application. Official documentation reflects its evolution into a combined
      streaming, recording, presentation, interview, and virtual-camera environment.
  related-projects:
    - 'Ecamm Help Center: The official support and manual surface.'
    - >
      Homebrew Cask: A package-management installation route for the vendor-distributed
      macOS application.
  sources:
    - https://support.ecamm.com/en/articles/3204344-ecamm-user-manual
    - https://support.ecamm.com/en/articles/3323951-using-scenes
    - https://support.ecamm.com/en/articles/5666230-using-profiles
    - https://www.ecamm.com/
  summary:
    - >
      Ecamm Live is a commercial macOS studio for live streaming, video recording,
      presentations, interviews, and virtual-camera production.
  timeline:
    - >
      2019: The official Ecamm Live manual documented the application's preferences and
      production workflow.
    - >
      2026: Ecamm's refreshed Help Center documented current profiles, scenes,
      destinations, and production features.
  usage:
    - >
      Users assemble productions from camera, screen, video, audio, guest, scene, and
      overlay sources, then stream to supported services or record locally.
    - >
      Profiles organize shows and their scenes, overlays, sound effects, and most
      settings. Profiles can be exported as `.ecammprofile` files, while scenes can be
      exchanged as `.ecammlive` files.
    - >
      Service accounts are managed through the application's Preferences interface.
      Official documentation does not publish a stable on-disk credential path.
