history:
  adoption-history:
    - >
      Dorso is distributed as a signed and notarized macOS application, through
      Homebrew, and through the Mac App Store. Its local processing and lack of an
      account requirement position it as a lightweight desktop wellness utility.
    - >
      Community contributions expanded the original camera-based design with AirPods
      motion sensing, additional warning styles, analytics, localization, settings
      profiles, and power-management behavior.
  package-nerd-significance:
    - >
      Dorso packages computer-vision and motion-sensor ergonomics into a small native
      menu-bar application. It is also notable for using only local processing rather
      than requiring a hosted account or telemetry service.
  project-history:
    - >
      The project released version 1.0.0 in January 2026 under the earlier name Posturr.
      It used Apple's Vision framework to compare the user's current pose with a
      calibrated baseline and progressively blur the screen when slouching was detected.
    - >
      Subsequent development renamed the application Dorso and broadened it with AirPods
      head-motion tracking, alternative visual warnings, posture analytics, profiles,
      automatic source switching, localization, and in-application updates.
  related-projects:
    - Apple Vision framework
    - Core Motion
    - dorso-linux
    - postured
  sources:
    - https://github.com/tldev/dorso#readme
    - https://github.com/tldev/dorso/blob/main/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      Dorso is a macOS menu-bar application that detects poor posture with a camera or
      compatible AirPods and applies a visual screen warning until posture improves.
  timeline:
    - '2026-01-24: Version 1.0.0 was released under the Posturr name.'
    - '2026-01-31: AirPods motion tracking was added.'
    - '2026-02-04: Settings profiles were added.'
    - '2026-03-03: Automatic switching between camera and AirPods tracking was added.'
    - '2026-07-19: The 1.14 series introduced automatic updating for GitHub builds.'
  usage:
    - >
      After granting camera or Motion & Fitness permission, users calibrate an upright
      posture and leave Dorso running in the menu bar. Sensitivity, warning style,
      delay, tracking source, profiles, and pause behavior can be adjusted in Settings.
