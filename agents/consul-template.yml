config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Consul Template found adoption in infrastructure stacks that needed dynamic data
      in ordinary files. Its README recommends running it as a system service, explains
      why automatic reload-on-file-change is intentionally avoided, and points users
      toward examples, configuration docs, templating docs, Docker use, and community
      support.
    - >
      Input package metadata lists Consul Template for Homebrew, apk, Chocolatey, Nix,
      and pacman, reflecting its cross-platform single-binary packaging model.
  package-nerd-significance:
    - >
      Consul Template matters because it packages dynamic infrastructure state into the
      oldest Unix deployment interface: files on disk plus a signal or command. That
      made it useful before every application learned service discovery APIs directly.
    - >
      For package maintainers, it is a classic HashiCorp Go binary: upstream releases,
      version-specific docs, service-manager usage, Docker images, and a web of
      compatibility with Consul, Vault, Nomad, and downstream config consumers.
  project-history:
    - >
      HashiCorp released Consul Template 0.1.0 in October 2014. The README still states
      the core idea: query a Consul, Vault, or Nomad cluster and update any number of
      templates on the filesystem.
    - >
      The early changelog shows rapid hardening after launch: 0.2.0 added file and
      key-prefix helpers, tree and ls functions, string helpers, and more examples;
      0.5.0 added SIGHUP reload and service-listing support. Later releases added Vault,
      Nomad, Consul namespace/partition/peering features, imported services, and
      security fixes.
  related-projects:
    - Consul is the original data source named in the project name.
    - Vault and Nomad are first-class data sources in the README.
    - >
      haproxy and nginx are common destination-service examples in the README's reload
      discussion.
  sources:
    - https://github.com/hashicorp/consul-template
    - https://github.com/hashicorp/consul-template/blob/main/CHANGELOG.md
    - https://github.com/hashicorp/consul-template/blob/main/docs/configuration.md
    - https://github.com/hashicorp/consul-template/blob/main/docs/templating-language.md
  summary:
    - >
      Consul Template is a HashiCorp daemon and CLI that renders files from Consul,
      Vault, and Nomad data, then optionally runs commands after changes. It became a
      standard bridge between service discovery/configuration data and traditional
      config-file driven software.
  timeline:
    - '2014: Version 0.1.0 is released as the initial Consul Template release.'
    - '2014: Version 0.5.0 adds SIGHUP reload and services template support.'
    - '2023: Version 0.35.0 adds alpha support for Consul namespaces, partitions, and peering.'
    - >
      2025: Version 0.41.x adds Consul imported services support and file sandbox
      security work.
    - '2026: Version 0.42.0 continues security and dependency maintenance.'
  usage:
    - >
      Common usage is to run consul-template with template mappings such as
      source:destination:command, render configuration files from Consul KV or service
      catalog data, and restart or reload services such as nginx or haproxy when
      rendered output changes.
    - >
      The README also documents once mode, reload via SIGHUP, environment variables
      shared with Consul, Vault, and Nomad tooling, and version-specific documentation
      through Git tags.
related-packages:
