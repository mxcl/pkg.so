    - >
      Version 1.2.6: The official page documents automatic and manual burning of
      completed goals.
    - '2026: Distributed through the Homebrew `daruma` cask.'
  usage:
    - >
      Users add a goal, select the Daruma's right eye when work begins, select the left
      eye on completion, and then burn completed goals manually or automatically.
