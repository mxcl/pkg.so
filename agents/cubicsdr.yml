history:
  adoption-history:
    - >
      CubicSDR is distributed across macOS, Windows, and Linux, with separate official
      build projects for those platforms. Its use of SoapySDR lets one interface work
      with hardware families including RTL-SDR, HackRF, Airspy, bladeRF, LimeSDR,
      SDRplay, and USRP.
  package-nerd-significance:
    - >
      CubicSDR is notable as an open-source, cross-platform desktop front end for the
      modular SoapySDR hardware ecosystem. It combines spectrum and waterfall
      visualization with multiple demodulation modes without tying users to one receiver
      vendor.
  project-history:
    - >
      CubicSDR was developed as a GPL-licensed, cross-platform software-defined radio
      application. The project established a separate Sphinx manual on Read the Docs and
      maintains platform-specific build repositories alongside its main C++ codebase.
    - >
      The 0.2.7 source release added CW mode and refreshed important radio and audio
      dependencies, including Hamlib, liquid-dsp, and RtAudio.
  related-projects:
    - SoapySDR provides CubicSDR's cross-vendor SDR device layer.
    - >
      liquid-dsp supplies digital signal-processing components; RtAudio provides audio
      I/O; Hamlib integration supports radio control.
  sources:
    - https://cubicsdr.readthedocs.io/en/latest/
    - https://github.com/cjcliffe/CubicSDR
    - https://github.com/cjcliffe/CubicSDR/issues/348
    - https://github.com/cjcliffe/CubicSDR/releases
  summary:
    - >
      CubicSDR is a cross-platform graphical software-defined radio receiver built
      around SoapySDR and related open-source DSP and audio libraries.
  timeline:
    - '2016: The official manual effort moved to a Sphinx/Read the Docs workflow.'
    - >
      2022: CubicSDR 0.2.7 was released as a source release with CW mode and dependency
      updates.
  usage:
    - >
      Users select a compatible SDR device, inspect signals in spectrum and waterfall
      views, tune a frequency, and choose a demodulation mode such as FM, AM, sideband,
      I/Q, or CW.
    - >
      The official manual includes hardware support, building guidance, interface
      documentation, and a practical walkthrough for receiving NOAA stations.
