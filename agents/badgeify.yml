history:
  adoption-history:
    - >
      Badgeify initially supported core menu-bar notification tracking and quick
      launching, with a free tier limited to three apps. Later releases added
      application groups, per-app visibility controls, macOS appearance refinements, a
      bundled command-line interface, and settings import/export.
    - >
      The project targets users who hide the Dock, want visible notification state, or
      prefer launching frequently used applications from the menu bar.
  package-nerd-significance:
    - >
      Badgeify is a focused macOS utility whose appeal lies in integrating otherwise
      separate application icons and badge counts into the system menu bar. Its Homebrew
      cask and bundled JSON-producing CLI make it relevant both to GUI-oriented Mac
      setups and light automation.
  project-history:
    - >
      Badgeify began with pre-1.0 releases in 2024 that established app badge tracking,
      quick launching, drag-and-drop organization, and menu-bar visibility controls.
      Version 1.0.0 introduced application groups in October 2024.
    - >
      Development continued with notification integrations, customization and
      resource-use improvements. Version 1.9.2 added a bundled badgeify command with
      list and status subcommands, while the 1.13 series added settings export and
      import.
  related-projects:
    - >
      Badgeify can coexist with other macOS menu-bar management tools, according to its
      official documentation.
    - The bundled badgeify command-line tool exposes badge state for scripts and monitoring.
  sources:
    - 'Official changelog archive: https://badgeify.app/changelog/archive/'
    - 'Official changelog: https://badgeify.app/changelog/'
    - 'Official introduction: https://docs.badgeify.app/introduction'
    - 'Official press kit: https://badgeify.app/press-kit/'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Badgeify is a proprietary macOS utility that places application icons and
      notification state in the menu bar, provides quick launching, and can group
      related applications under one icon.
  timeline:
    - '2024-09: Pre-1.0 releases established the core menu-bar and notification features.'
    - '2024-10: Badgeify 1.0.0 introduced application groups.'
    - '2025-10: Version 1.9.2 added a bundled command-line tool with JSON output.'
    - '2026-03: Version 1.13.0 added settings export and import.'
  usage:
    - >
      Users grant macOS Accessibility permission, add applications to Badgeify, and
      configure when their icons or notification counts appear. Advanced users can query
      badge state through the bundled CLI or export settings for backup and transfer.
