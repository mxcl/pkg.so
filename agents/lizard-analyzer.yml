id: brew:lizard-analyzer
display-name: Lizard
repo: https://github.com/terryyin/lizard
docs:
  - https://github.com/terryyin/lizard#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents both direct script usage and installation through pip, which
      made Lizard convenient for CI jobs and local quality gates before
      language-specific static-analysis suites were always present in package-manager
      workflows.
    - >
      Homebrew packaging under lizard-analyzer gives macOS users a CLI install path
      while avoiding the formula-name collision with the unrelated lizard compressor.
  package-nerd-significance:
    - >
      The formula is a small example of package-manager disambiguation: the upstream
      project, command name, and common Python package name are lizard, but Homebrew has
      to call the formula lizard-analyzer because brew:lizard is already the compression
      tool.
    - >
      It also shows how scripting-language tools enter Unix package managers even when
      pip installation is available, because packaging the CLI gives users a repeatable
      system-level binary without managing a Python environment by hand.
  project-history:
    - >
      The terryyin/lizard repository was created on GitHub in June 2012. The README
      describes the tool as an extensible cyclomatic complexity analyzer for many
      programming languages, with an emphasis on scanning C/C++ without needing complete
      header search paths and Java without resolving all imports.
    - >
      Over time the tool expanded beyond basic cyclomatic complexity counts into
      duplicate-code detection and other static-code metrics. Its language list in the
      README spans C/C++, Java, Python, JavaScript/TypeScript, Go, Rust, Swift,
      Solidity, Zig, and other languages.
  related-projects:
    - >
      The package sits near linters, static analyzers, and code-metric tools such as
      cloc, radon, cppcheck, and language-specific complexity plugins.
    - It is unrelated to brew:lizard, the compression utility packaged in the same batch.
  sources:
    - https://api.github.com/repos/terryyin/lizard
    - https://formulae.brew.sh/formula/lizard-analyzer
    - https://github.com/terryyin/lizard
    - https://github.com/terryyin/lizard/releases
    - https://raw.githubusercontent.com/terryyin/lizard/master/README.rst
  summary:
    - >
      Lizard is a Python-based cyclomatic-complexity and static-analysis command-line
      tool. Its package history is mildly confusing because Homebrew names this formula
      lizard-analyzer while the executable is lizard, avoiding collision with a separate
      compression utility also named lizard.
  timeline:
    - '2012: terryyin/lizard repository created on GitHub.'
    - '2026: GitHub releases 1.20.0 and 1.23.0 were published for the analyzer.'
    - >
      2026: Homebrew formula lizard-analyzer identified the executable as lizard and the
      package as an extensible cyclomatic complexity analyzer.
  usage:
    - >
      Lizard is commonly used as a lightweight metric pass over source trees: run lizard
      on a path, optionally select languages, exclude paths, and fail builds when
      complexity or parameter-count thresholds are exceeded.
    - >
      Because it intentionally measures how complex code looks rather than trying to
      fully compile or semantically resolve a project, it fits quick scans, pre-commit
      checks, and repository audits where low setup cost matters.
related-packages:
  - id: brew:pmccabe
    reason: >
      Choose pmccabe for a compact C/C++-focused McCabe complexity and line-count tool;
      choose Lizard for broader language coverage, configurable metrics, duplicate
      detection, and structured reports.
    rel: alternative
    sources:
      - https://gitlab.com/pmccabe/pmccabe#readme
      - https://github.com/terryyin/lizard#readme
  - id: brew:cppcheck
    reason: >
      Use Cppcheck alongside Lizard when a C or C++ workflow needs defect and
      undefined-behavior checks in addition to Lizard's structural complexity metrics.
    rel: adjacent_workflow
    sources:
      - https://github.com/cppcheck-opensource/cppcheck
      - https://github.com/terryyin/lizard#readme
