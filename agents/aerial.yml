history:
  adoption-history:
    - >
      The project says it has been maintained continuously since 2015. It evolved from a
      replacement Apple TV-style screensaver into a power-user tool with community video
      packs, per-display controls, overlays, playlists, and live-wallpaper support.
  package-nerd-significance:
    - >
      Aerial is a prominent example of a macOS-native, open-source application
      distributed through Homebrew Cask. Its long evolution also tracks Apple's
      transition from the legacy `.saver` mechanism to modern app-extension-based
      screensavers.
  project-history:
    - >
      Aerial began in 2015 as a way to play Apple TV aerial footage on a Mac. The
      current project is maintained by Guillaume Louel; its official site links both the
      current repository and the original 2015 repository.
    - >
      The modern application expanded beyond Apple's video catalog with user videos,
      live feeds, community expansions, overlays, playlists, multi-display layouts, and
      wallpaper operation. Aerial 4 moved distribution to an application containing a
      screensaver app extension for newer macOS releases.
  related-projects:
    - Apple TV aerial screensavers
    - PaperSaver
    - Sparkle
  sources:
    - 'Official FAQ and data-location guidance: https://aerialscreensaver.github.io/faq/'
    - 'Official project overview and history: https://aerialscreensaver.github.io/'
    - 'Official repository README: https://github.com/AerialScreensaver/Aerial'
  summary:
    - >
      Aerial is an open-source macOS screensaver and live-wallpaper application built
      around Apple's aerial footage and extensible video sources.
  timeline:
    - '2015: The original Aerial project brought Apple TV aerial footage to macOS.'
    - >
      2026: Aerial 4 adopted an app-extension-based screensaver architecture and
      expanded native wallpaper functionality.
  usage:
    - >
      Users install Aerial as a macOS application, select Apple or community footage,
      import personal videos, or configure live streams, then control screensaver and
      wallpaper playback from its menu-bar interface.
    - >
      Aerial stores settings and cached content beneath `/Users/Shared/Aerial/`;
      deleting that directory resets settings and removes cached data.
