history:
  adoption-history:
    - >
      Shield was released publicly after the author obtained the required production
      Endpoint Security entitlement from Apple. It is distributed as a menu-bar
      application backed by a system extension and helper tool.
    - >
      The official article says feedback and bug reports helped the application mature
      after its January 2021 initial release. Its adoption is specialized because
      installation requires approval of a security-sensitive system extension.
  package-nerd-significance:
    - >
      Shield is notable as a transparent, open-source macOS endpoint-security utility
      built around Apple's post-kernel-extension Endpoint Security model. It exposes
      controls commonly associated with commercial endpoint products in a focused
      menu-bar application.
    - >
      Its package also illustrates why some Mac security software cannot be treated as
      an ordinary drag-and-run app: installation, entitlement approval, system-extension
      lifecycle, persistent system-wide preferences, and reboot-dependent removal all
      matter operationally.
  project-history:
    - >
      Security researcher Csaba Fitzl created Shield after studying how process
      injection can inherit application entitlements and enable privilege escalation or
      privacy-control bypasses. The implementation moved from an early daemon concept to
      an Endpoint Security system extension controlled by a menu-bar application.
    - >
      The project reused and adapted open-source ideas and code from Objective-See tools
      and studied the Crescendo codebase. Later functionality added allow lists and
      detection of suspicious symbolic-link and hard-link creation.
  related-projects:
    - >
      Objective-See tools, particularly LuLu and Patrick Wardle's process-monitoring
      work, influenced Shield's implementation.
    - Crescendo was another Endpoint Security codebase consulted during development.
  sources:
    - 'Official project and usage article: https://theevilbit.github.io/shield/'
    - 'Official repository: https://github.com/theevilbit/Shield'
  summary:
    - >
      Shield is an open-source macOS endpoint-security application that detects and
      optionally blocks several process-injection techniques. It also monitors
      suspicious hard-link and symbolic-link creation and presents controls through a
      menu-bar interface.
  timeline:
    - "2019: The author's Shield development article was first published."
    - "January 2021: Initial public release, according to the author's project history."
    - 'Version 1.1: Added detection for suspicious symbolic-link and hard-link creation.'
  usage:
    - >
      On first launch, users install and approve Shield's system extension in macOS
      Security & Privacy, then start the Endpoint Security client from the menu-bar
      application or enable it in preferences.
    - >
      Blocking mode rejects configured injection attempts; non-blocking mode records
      alerts, and learning mode automatically builds allow-list entries. Individual
      protections cover injection-related environment variables, task-port access,
      Electron debugging switches, library validation, and suspicious file links.
    - >
      Uninstalling the agent removes the system extension but requires a reboot to
      complete. The application itself must be removed separately.
