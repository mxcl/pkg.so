history:
  adoption-history:
    - >
      The upstream README presents container-image use through quay.io/coreos/chunkah as
      the primary path, with cargo install and Fedora packaging as additional options.
      The batch input records Homebrew and DNF packaging.
  package-nerd-significance:
    - >
      chunkah is interesting to container and distro package people because it maps
      package or component boundaries back onto OCI layers after the image has been
      built. That makes package churn, client pulls, and shared storage the focus rather
      than the textual Dockerfile step history.
  project-history:
    - >
      The GitHub repository was created in December 2025. The README explains chunkah as
      a post-processing step for images whose Dockerfile-derived layers do not match
      reusable content boundaries.
  related-projects:
    - >
      The README positions chunkah alongside Podman, Buildah, Docker or Moby, skopeo,
      bootc images, rpm-ostree component hints, zstd:chunked, cosign, and OCI image
      tooling.
  sources:
    - https://github.com/coreos/chunkah#readme
    - https://api.github.com/repos/coreos/chunkah
    - https://api.github.com/repos/coreos/chunkah/releases
  summary:
    - >
      chunkah is a CoreOS OCI image tool that turns a flat root filesystem or existing
      image into content-based layers intended to improve layer reuse.
  timeline:
    - '2025: Public GitHub repository created.'
    - '2026: v0.1.0 released.'
    - '2026: v0.6.0 release documented in the README examples.'
  usage:
    - >
      Users can split an existing image or split an image at build time with Podman and
      Buildah. The README also documents Docker image-mount usage, SOURCE_DATE_EPOCH
      support, cosign verification, xattr-based component hints, output formats,
      max-layer tuning, pruning, and bootc-image compatibility.
related-packages:
  - id: brew:podman
    reason: >
      Podman can inspect the source image, run chunkah's official container, and load
      the resulting OCI archive in the project's documented image-splitting workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/coreos/chunkah#readme
      - https://github.com/podman-container-tools/podman#readme
  - id: brew:skopeo
    reason: >
      Skopeo can import chunkah's OCI-directory output or convert its OCI archive when a
      Docker-compatible archive is required.
    rel: adjacent_workflow
    sources:
      - https://github.com/coreos/chunkah#readme
      - https://github.com/podman-container-tools/skopeo#readme
