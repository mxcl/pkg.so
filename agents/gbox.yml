history:
  adoption-history:
    - >
      GBOX is distributed as a Homebrew formula for macOS users and as the @gbox.ai/cli
      npm package for Linux and Windows users according to its official README. The
      repository topics and documentation position it in the emerging AI-agent tooling
      space rather than as a general-purpose mobile automation framework.
  package-nerd-significance:
    - >
      For package maintainers, GBOX is notable as an example of AI-agent tooling that
      packages more than a command: Go and Node build tooling, Android Debug Bridge,
      Appium-related dependencies, FRP client support, MCP server export, and
      cloud-service login all meet at one CLI entry point.
  project-history:
    - >
      The public GitHub repository was created in March 2025 under the babelcloud
      organization. The project documentation and README describe the package around
      AI-agent workflows: installing local dependencies, logging in to gbox.ai,
      connecting Android devices, and exporting MCP configuration for agent tools.
  related-projects:
    - >
      The README connects GBOX to MCP clients such as Claude Code and Cursor, Android
      tooling such as ADB and Appium, and the @gbox.ai/cli and @gbox.ai/mcp-server npm
      packages.
  sources:
    - https://api.github.com/repos/babelcloud/gbox
    - https://docs.gbox.ai/
    - https://github.com/babelcloud/gbox
    - https://raw.githubusercontent.com/babelcloud/gbox/main/README.md
  summary:
    - >
      GBOX is a developer tool for giving AI agents controlled computer and mobile
      environments. Its official README presents it as a CLI and MCP-oriented system for
      Android, Linux desktop, browser, and local or cloud device automation.
  timeline:
    - '2025: Public GitHub repository created.'
    - '2025: CLI installation documented through Homebrew on macOS and npm on Linux/Windows.'
    - '2026: Official repository metadata showed the project still in active early development.'
  usage:
    - >
      Typical package usage starts with installing the CLI, running setup, logging in,
      connecting an Android device or cloud environment, and exporting an MCP server
      configuration for tools such as Claude Code or Cursor. The README also documents
      browser, desktop, SDK, and Android-device scenarios.
related-packages:
  - id: cask:android-platform-tools
    reason: >
      Install Android SDK Platform-Tools when GBOX needs ADB to connect, inspect,
      install to, or run commands on local Android devices; GBOX's official setup
      explicitly lists ADB as a dependency.
    rel: adjacent_workflow
    sources:
      - https://github.com/babelcloud/gbox#readme
      - https://developer.android.com/tools/adb
  - id: brew:appium
    reason: >
      Use Appium alongside GBOX for WebDriver-based mobile application automation, as
      GBOX's complete setup explicitly installs the Appium server, drivers, and plugins
      for its Android workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/babelcloud/gbox#readme
      - https://appium.io/docs/en/latest/intro/appium/
