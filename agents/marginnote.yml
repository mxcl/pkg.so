history:
  adoption-history:
    - >
      MarginNote is aimed at students, researchers, professional-exam candidates,
      language learners, and other readers working with dense source material. The
      official site presents Mac and iPad as its two principal platforms and describes
      iCloud-backed synchronization between them.
  package-nerd-significance:
    - >
      MarginNote is notable in desktop package catalogs because it combines several
      categories normally represented by separate applications: document annotation,
      visual knowledge mapping, flashcard generation, spaced-repetition review, and
      academic reading. Its macOS cask also provides a package-managed installation
      route for an otherwise commercial, Apple-platform application.
  project-history:
    - >
      MarginNote states that the product began with MarginNote 1 in 2013. MarginNote 3,
      released in July 2018, reorganized the application around document reading and
      study modes and established automatic card generation, mind maps, OCR, and review
      decks as signature capabilities.
    - >
      MarginNote 4 launched in May 2024 as a substantial product redesign. It separated
      documents, study sets, and review into distinct modules while retaining links
      among source excerpts, mind-map nodes, and flashcards.
  related-projects:
    - >
      Official workflow material describes integrations or complementary use with Zotero
      and Anki, while MarginNote itself covers annotation, mind mapping, and review.
  sources:
    - https://www.marginnote.com/en/features/index.html
    - https://www.marginnote.com/en/index.html
    - https://www.marginnote.com/en/whats-new/index.html
  summary:
    - >
      MarginNote is a commercial deep-reading and study application for macOS and iPad.
      It turns excerpts from PDFs and other learning materials into linked notes,
      mind-map nodes, and flashcards.
  timeline:
    - '2013: MarginNote 1 begins the product line.'
    - '2018-07-31: MarginNote 3 launches with a redesigned read–annotate–review workflow.'
    - '2024-05: MarginNote 4 launches as a product-form rebuild.'
  usage:
    - >
      Users import PDFs, EPUBs, web material, and supported media; annotate source
      passages; organize extracted material into mind maps and study sets; and review
      the resulting cards. Official examples emphasize literature reviews, textbook
      study, professional examinations, language learning, and long-term knowledge
      development.
