history:
  adoption-history:
    - >
      JET Pilot targets users who want a graphical Kubernetes workflow without the
      commercial restrictions of some desktop IDEs or the keyboard-centric interaction
      of terminal tools such as k9s. Official releases provide packages for macOS,
      Linux, and Windows.
    - >
      The project remains a comparatively focused Kubernetes client rather than a broad
      container platform, adding operational features incrementally through its public
      releases.
  package-nerd-significance:
    - >
      JET Pilot is notable as a lightweight, MIT-licensed desktop Kubernetes interface
      built with Tauri rather than a large bundled desktop runtime. Its Homebrew cask
      and native packages make a GUI cluster client straightforward to install on
      workstations.
    - >
      It occupies the space between kubectl-style command-line administration and full
      commercial Kubernetes IDEs, emphasizing uncluttered presentation and fast access
      to routine cluster operations.
  project-history:
    - >
      JET Pilot was created in response to the commercialization of visually polished
      Kubernetes IDEs. Its author sought to combine a graphical interface with the speed
      and operational focus that power users associate with tools such as k9s.
    - >
      The application developed into a cross-platform Kubernetes desktop client with
      live logs, object editing, container shells, command-palette navigation, Helm
      integration, scaling, and node operations.
  related-projects:
    - Kubernetes is the cluster platform managed by JET Pilot.
    - kubectl is the standard Kubernetes command-line client.
    - >
      k9s is a terminal-based Kubernetes interface explicitly cited by the project as a
      point of comparison.
    - Helm support was added for Kubernetes package and release management.
  sources:
    - https://github.com/unxsist/jet-pilot
    - https://github.com/unxsist/jet-pilot/releases
  summary:
    - >
      JET Pilot is an open-source, cross-platform Kubernetes desktop client focused on
      speed, visual simplicity, and common operational workflows.
  timeline:
    - >
      September 2024: Release 1.30 added events, Helm support, node cordoning and
      draining, and broader resource support.
    - 'November 2024: Release 1.31 added scaling and improved Helm context handling.'
  usage:
    - >
      Operators use JET Pilot to inspect Kubernetes resources, follow workload logs,
      edit or describe objects, open shells in containers, switch namespaces, and invoke
      actions through a command palette.
    - >
      Later releases support Helm-aware workflows, workload scaling, and node cordon and
      drain operations.
