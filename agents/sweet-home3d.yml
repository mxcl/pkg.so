  macos:
    - ~/Library/Application Support/eTeks/Sweet Home 3D/
    - ~/Library/Preferences/com.eteks.sweethome3d.plist
    - ~/Library/Preferences/com.eteks.sweethome3d.SweetHome3D.plist
  windows:
