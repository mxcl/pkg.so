credentials-file-location: null
history:
  adoption-history:
    - >
      Official project statistics reported more than 3.6 million SourceForge installer
      downloads between the September 2007 release of version 1.0 and the end of 2009,
      alongside Java Web Start and online use. The project subsequently expanded beyond
      its original desktop application to mobile and browser-accessible editions.
  package-nerd-significance:
    - >
      Sweet Home 3D is a long-running GPL desktop application from the Java era that
      remains distributed across Windows, macOS, and Linux. Its combination of a
      maintained SVN tree, portable Java build, native installers, plug-in API, and
      community furniture and texture libraries makes it notable to package maintainers.
  project-history:
    - >
      The source tree records GPL licensing work in 2006, and Sweet Home 3D 1.0 was
      released on September 12, 2007 with Windows, macOS, and Linux installers.
      Development added importable furniture and texture libraries, rendering, plug-ins,
      printing, and an online edition while retaining the SH3D project format.
    - >
      In August 2024, repository commits recorded Space Mushrooms taking over the
      project. The official site and SourceForge-hosted SVN repository continue to
      publish source code and developer documentation.
  related-projects:
    - >
      Sweet Home 3D Online and Sweet Home 3D Mobile provide related browser and mobile
      workflows.
    - >
      Furniture Library Editor and Textures Library Editor produce the SH3F and SH3T
      library formats used by Sweet Home 3D.
  sources:
    - https://sourceforge.net/p/sweethome3d/code/HEAD/tree/trunk/SweetHome3D/
    - https://www.sweethome3d.com/blog/sweet-home-3d-2009-statistics/
    - https://www.sweethome3d.com/download/
    - https://www.sweethome3d.com/history/
  summary:
    - >
      Sweet Home 3D is a free, open-source interior-design application for drawing
      furnished floor plans in 2D and previewing them in 3D.
  timeline:
    - '2006: The source tree adopted the GNU GPL.'
    - '2007: Version 1.0 introduced installers for Windows, macOS, and Linux.'
    - '2009: Official statistics reported millions of installer downloads since version 1.0.'
    - '2024: Space Mushrooms took over the project.'
  usage:
    - >
      Users draw walls and rooms over an existing plan or from scratch, drag furniture
      from a catalog, and inspect changes in a synchronized 3D view. The application
      also supports importing models and textures, rendering images and video, printing,
      and extension through plug-ins.
