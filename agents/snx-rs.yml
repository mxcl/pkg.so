credentials-file-location:
  unix:
    - ~/.config/snx-rs/snx-rs.conf
history:
  adoption-history:
    - >
      The project publishes signed APT and DNF repositories, providing a maintained
      distribution route for Linux users alongside its other installation options.
      Reliable adoption counts were not established.
  package-nerd-significance:
    - >
      It packages an independently implemented enterprise VPN client with both graphical
      and command-line interfaces, including a service controlled through snxctl.
  project-history:
    - >
      The project implements an unofficial Check Point VPN client in Rust, with support
      for Linux, Windows and macOS.
  related-projects:
    - >
      Check Point VPN is the interoperability target; snx-rs is not the vendor's
      official client.
  sources:
    - https://github.com/ancwrd1/snx-rs#readme
    - https://github.com/ancwrd1/snx-rs/blob/main/docs/command-line-usage.md
  summary:
    - snx-rs is an open-source client for connecting to Check Point VPN gateways.
  timeline:
    - >
      2026: Official documentation describes cross-platform support and signed Linux
      package repositories.
  usage:
    - >
      Discover the gateway's login methods before connecting. Desktop users can control
      the service through the GUI or snxctl; standalone mode supports headless use.
