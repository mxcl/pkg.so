history:
  adoption-history:
    - >
      Google made Bard broadly available during 2023, then carried its users and
      workflows into the Gemini brand in 2024. Gemini subsequently expanded across web
      and mobile surfaces and now has a dedicated macOS application documented by
      Google.
  package-nerd-significance:
    - >
      The Gemini cask represents a newer packaging pattern: a native desktop entry point
      for a continuously evolving cloud AI service. The local application provides
      operating-system integration, while models and much of the functionality remain
      service-side.
  project-history:
    - >
      Google launched Bard in 2023 as a conversational generative-AI product. In
      February 2024, Google renamed Bard to Gemini, introduced Gemini Advanced, and
      launched new mobile experiences under the same brand.
    - >
      The dedicated Mac application brings Gemini to the desktop with a global shortcut,
      voice input, window context, image analysis, writing assistance, brainstorming,
      and coding help.
  related-projects:
    - Bard
    - Gemini models
    - Gemini Advanced
    - Google AI Studio
    - Gemini API
    - Google Assistant
  sources:
    - >
      Official 2024 rename announcement:
      https://blog.google/intl/en-africa/products/explore-get-answers/bard-becomes-gemini-try-ultra-10-and-a-new-mobile-app-today/
    - 'Official Gemini for Mac help: https://support.google.com/gemini/answer/17011627?hl=en'
    - 'Official Gemini site: https://gemini.google/'
    - source_facts.description
  summary:
    - >
      Gemini is Google's generative-AI assistant; this package installs Google's native
      Gemini application for macOS.
  timeline:
    - '2023: Google launched the assistant under the Bard name.'
    - '2024: Bard was renamed Gemini, alongside Gemini Advanced and new mobile experiences.'
    - 'By 2026: Google documents a dedicated Gemini app for macOS.'
  usage:
    - >
      Users sign in with a supported Google Account and use the Mac application for
      answers, drafting, summarization, brainstorming, coding help, image analysis,
      voice interaction, and assistance based on a shared application window. An
      internet connection is required for Gemini features.
