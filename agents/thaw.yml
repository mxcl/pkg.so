history:
  adoption-history:
    - >
      Thaw is distributed through signed GitHub releases, Homebrew stable and beta
      casks, and its built-in Sparkle updater. The project accepts community
      contributions and translations and documents migration of compatible Ice-era
      settings.
  package-nerd-significance:
    - >
      Thaw is a local-first, GPL-licensed macOS utility in the lineage of open-source
      menu-bar managers. It is interesting to package maintainers because it interacts
      with Accessibility, Screen Recording, WindowServer, Control Center, Sparkle
      updates, and rapidly changing macOS menu-bar behavior while requiring no account
      or analytics backend.
  project-history:
    - >
      Thaw began in 2026 as a maintained fork of Ice, preserving the familiar hidden and
      always-hidden menu-bar model while developing its own settings and persistence
      vocabulary. The project later moved into the thaw-app GitHub organization.
    - >
      The 2.0 development cycle rebuilt major portions for macOS 26, including settings,
      automation, item identity, layout persistence, and menu-bar rendering. Subsequent
      development added profiles, triggers, integrations, URI automation, and
      experimental support for newer macOS releases.
  related-projects:
    - Forked from Ice, another open-source macOS menu-bar manager.
    - >
      Offers an official Raycast integration and thaw:// automation that can also be
      used from launchers and automation tools.
  sources:
    - >
      Official architecture:
      https://github.com/thaw-app/Thaw/blob/development/docs/ARCHITECTURE.md
    - 'Official changelog: https://github.com/thaw-app/Thaw/blob/development/CHANGELOG.md'
    - 'Official releases: https://github.com/thaw-app/Thaw/releases'
    - 'Official repository and README: https://github.com/thaw-app/Thaw'
    - source_facts.package-manager
  summary:
    - >
      Thaw is a free, open-source macOS menu-bar manager that hides, reveals, searches,
      arranges, and styles status items.
  timeline:
    - '2026: Thaw began as a maintained fork of Ice.'
    - >
      2026: Stable and beta distribution expanded through GitHub Releases, Homebrew, and
      Sparkle.
    - >
      2026: The 2.0 cycle rebuilt Thaw around macOS 26 and added extensive layout,
      profile, appearance, and automation capabilities.
  usage:
    - >
      Use Thaw to divide menu-bar items into visible, hidden, and always-hidden
      sections, reveal them with gestures or hotkeys, search for items, and save
      contextual layouts.
    - >
      Accessibility permission is needed for menu-bar manipulation. Screen Recording is
      optional and enables live item previews and wallpaper-derived appearance features.
    - >
      Integrate Thaw with Raycast or other automation tools through its documented
      thaw:// URL scheme.
