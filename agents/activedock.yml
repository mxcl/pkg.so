history:
  adoption-history:
    - >
      ActiveDock has been positioned for Mac users who want more window-management and
      organizational features than Apple's Dock supplies. The vendor explicitly presents
      it as an alternative to HyperDock, uBar, cDock, DragThing, and similar utilities.
    - >
      Version 2 broadened the dock-replacement idea with window previews, groups, folder
      views, a start menu, themes, custom icons, and multi-monitor support. The official
      documentation, first published in 2020, continues to be updated for current
      releases.
  package-nerd-significance:
    - >
      ActiveDock belongs to the long-running ecosystem of macOS shell and Dock
      customization tools. Such applications interest Mac utility enthusiasts because
      they reshape a highly visible system workflow without replacing protected system
      files or requiring System Integrity Protection to be disabled.
    - >
      Its direct vendor distribution and Homebrew cask packaging provide a conventional
      package-manager route for installing an otherwise proprietary Mac utility.
  project-history:
    - >
      MacPlus Software developed ActiveDock as a customizable application launcher and
      replacement for Apple's Dock and Launchpad. ActiveDock 2 centers on faster
      switching among applications and windows while adding organization and appearance
      controls.
    - >
      Official online documentation was published on June 18, 2020 and has subsequently
      been maintained as the application evolved. The vendor states that current
      releases support modern macOS versions and Apple Silicon.
  related-projects:
    - >
      Apple Dock and Launchpad: the built-in macOS interfaces ActiveDock supplements or
      replaces.
    - >
      HyperDock, uBar, cDock, and DragThing: related or legacy Mac Dock-enhancement
      utilities named by the vendor.
    - "MultiDock: MacPlus Software's related product for users who require multiple panels."
  sources:
    - 'Official documentation: https://noteifyapp.com/2020/06/18/activedock-documentation/'
    - 'Official product page: https://noteifyapp.com/activedock/'
  summary:
    - >
      ActiveDock 2 is a proprietary macOS Dock replacement and application launcher from
      MacPlus Software. It combines application and window switching with groups, folder
      views, themes, custom icons, a start menu, and multi-monitor support.
  timeline:
    - 'Before 2020: ActiveDock was established as a macOS Dock replacement.'
    - '2020: Official ActiveDock documentation was published on June 18.'
    - >
      ActiveDock 2 era: The product added groups, folder views, window previews, themes,
      and expanded application-launcher features.
    - 'Current releases: ActiveDock supports Apple Silicon and contemporary macOS versions.'
  usage:
    - >
      Users employ ActiveDock to launch applications and documents, preview and switch
      windows, arrange items into groups or folder views, customize Dock appearance, and
      control which running applications appear.
    - >
      The application requires macOS privacy permissions for features such as window
      previews and switching. Its settings can be reset through the
      com.sergey-gerasimenko.ActiveDock-2 defaults domain, but the official
      documentation does not identify the underlying preferences file path.
