history:
  adoption-history:
    - >
      WinZip describes itself as the original widely used Windows file-compression
      utility and says millions of users across thousands of organizations use its
      products.
    - >
      WinZip later established a separate Mac line. Its official legacy-download catalog
      records Mac editions from 1.0 onward, while the lifecycle page records continued
      Mac releases through version 12.
  package-nerd-significance:
    - >
      WinZip helped define the commercial graphical archive-manager category around the
      ubiquitous ZIP format.
    - >
      For package-manager users, the Mac cask offers a proprietary GUI counterpart to
      command-line archivers and open-source archive managers, including encryption and
      cloud-oriented workflows beyond basic extraction.
  project-history:
    - >
      WinZip developed from a ZIP compression utility into a broader file-management and
      security product family.
    - >
      The current product emphasizes compression, extraction, encryption, backup, cloud
      integration, file sharing, and managed enterprise controls. The Mac edition
      supplies a native graphical workflow for creating and opening archives.
  related-projects:
    - WinZip Mac Edition is the platform-specific product represented by this cask.
    - >
      WinZip's related products include WinZip Courier, WinZip Self-Extractor, WinZip
      Command Line Support Add-On, and WinZip Enterprise.
  sources:
    - https://kb.winzip.com/en/130500
    - https://www.winzip.com/en/
    - https://www.winzip.com/en/download/
    - https://www.winzip.com/en/download/legacy/
    - https://www.winzip.com/en/support/product-lifecycle-policy/
  summary:
    - >
      WinZip is a long-running proprietary archive manager that has expanded from ZIP
      compression into encryption, file management, backup, sharing, and cloud
      integration.
  timeline:
    - >
      Mac Edition 1.0: Earliest Mac release retained in WinZip's official
      legacy-download catalog.
    - '2019: WinZip Mac 7 became generally available.'
    - '2020: WinZip Mac 8 became generally available.'
    - '2021: WinZip Mac 9 became generally available.'
    - '2022: WinZip Mac 10 became generally available.'
    - '2023: WinZip Mac 11 became generally available.'
    - '2024: WinZip Mac 12 became generally available.'
  usage:
    - >
      Mac users create and extract archives, choose compression and encryption defaults,
      protect files, and share smaller packaged files.
    - >
      The Mac application can integrate with iCloud Drive and supported cloud services;
      cloud accounts are configured through the application's preferences.
