history:
  adoption-history:
    - >
      Camellia's visible adoption is modest and mostly historical. The project was
      hosted on SourceForge and positioned itself as a replacement for the discontinued
      Intel IPL library and a complement to OpenCV.
    - >
      Its Homebrew packaging keeps the command-line demos and C library buildable on
      macOS, but the official site does not document a large modern downstream
      ecosystem.
  package-nerd-significance:
    - >
      Camellia is package-nerd interesting as preserved research software: a plain-C
      computer-vision library from the early-2000s SourceForge era that still has enough
      structure to be packaged.
    - >
      It also captures a transition point in vision tooling, explicitly relating itself
      to Intel IPL and OpenCV before OpenCV became the default answer for most
      open-source computer-vision work.
  project-history:
    - >
      The official homepage says Camellia came from the European Camellia project,
      IST-2001-34410. It was developed by Ecole des Mines de Paris in coordination with
      partners including Philips Electronics Nederland, University of Hannover,
      University of Las Palmas, Philips Semiconductors Hamburg, and Renault.
    - >
      The library was opened to disseminate results from that research project. Its
      homepage describes it as cross-platform C code for Unix, Linux, and Windows, with
      optimized functions for filtering, morphology, labelling, warping, drawing,
      projection and backprojection, color conversion, and image loading and saving.
  related-projects:
    - OpenCV is named by the official homepage as a complementary library.
    - >
      Intel IPL is named by the official homepage as a discontinued library Camellia
      could replace.
    - >
      The original Camellia European project is the research project from which the
      open-source library emerged.
  sources:
    - https://camellia.sourceforge.net/
    - https://camellia.sourceforge.net/doc/html/index.html
    - https://sourceforge.net/p/camellia/code
    - https://sourceforge.net/projects/camellia/
    - input.json source_facts.executables
  summary:
    - >
      Camellia is a small open-source image processing and computer vision library
      written in plain C, distributed with example programs and Doxygen documentation.
  timeline:
    - >
      2001: Camellia European project IST-2001-34410 begins as the research context for
      the library.
    - >
      2007: Official homepage document metadata records creation and last save dates for
      the project site.
    - '2026: Homebrew still ships the camellia formula with demo executables.'
  usage:
    - >
      The library is used from C programs for image processing and computer-vision
      routines. The Homebrew package installs demonstration executables such as
      cam_demo, cam_myobjects, and cam_yalefaces.
    - >
      The official documentation is Doxygen-oriented, so the expected user is a
      developer linking the C library rather than a user running a polished end-user
      application.
related-packages:
  - id: brew:opencv
    reason: >
      Choose OpenCV for a substantially broader, actively documented computer-vision
      ecosystem; Camellia's official site explicitly describes OpenCV as a complementary
      library.
    rel: alternative
    sources:
      - https://camellia.sourceforge.net/
      - https://opencv.org/about/
