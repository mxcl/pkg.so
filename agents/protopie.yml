history:
  adoption-history:
    - >
      ProtoPie reported use by interaction-design teams internationally soon after
      launch; an official 2017 account named users including LINE, Google, Yahoo!,
      Nintendo, Alipay, and Tencent.
    - >
      In 2021 the company reported serving individual customers and 15,000 enterprises
      across 100 countries, with most revenue coming from outside Korea.
  package-nerd-significance:
    - >
      ProtoPie occupies the specialized space between static design tools and code-heavy
      prototype frameworks: its sensor, gesture, hardware, and API-oriented interactions
      let designers test behavior that ordinary click-through mockups cannot represent.
    - >
      For package-manager users, the cask provides a reproducible installation path for
      a proprietary desktop design tool whose broader workflow also involves Player,
      Cloud, and Connect components.
  project-history:
    - >
      Founder Tony Kim traced ProtoPie to App.eal, a mobile-prototyping experiment
      created after his experience as a Google designer highlighted the cost of coding
      high-fidelity prototypes.
    - >
      ProtoPie launched in 2016 as a code-free tool for rapidly creating realistic
      interactive prototypes. The company commercialized it in 2017 and introduced a
      substantially revised brand alongside ProtoPie 4.0 in 2019.
  related-projects:
    - >
      The official ecosystem comprises ProtoPie Studio for authoring, ProtoPie Player
      for testing on mobile devices, ProtoPie Cloud for sharing, and ProtoPie Connect
      for connected multi-device and hardware experiences.
  sources:
    - https://www.protopie.io/blog/journey-behind-protopie
    - https://www.protopie.io/blog/new-protopie-brand
    - https://www.protopie.io/blog/not-your-prototypical-prototyping
    - https://www.protopie.io/learn/docs/introducing-protopie-getting-started
  summary:
    - >
      ProtoPie is a commercial, code-free interaction-design environment for creating
      and testing high-fidelity prototypes across desktop, mobile, automotive, and other
      connected-device contexts.
  timeline:
    - '2016: ProtoPie launched publicly.'
    - >
      2017: ProtoPie was commercialized and held its first mobile-prototyping meetup
      with LINE in Tokyo.
    - >
      2019: ProtoPie 4.0 arrived with a redesigned brand and an expanding international
      design-team user base.
  usage:
    - >
      Designers use ProtoPie Studio to assemble interactions, sensor input, variables,
      and transitions without conventional application code, then test on devices with
      Player or share through Cloud.
    - >
      Typical work begins in Studio, while Connect supports prototypes that exchange
      messages with hardware, APIs, simulators, or multiple devices.
