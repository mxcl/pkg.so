history:
  adoption-history:
    - >
      Distribution expanded beyond Cargo: the official README lists AUR, Alpine, Gentoo
      GURU, Homebrew, MacPorts, Scoop, prebuilt GitHub release binaries, and crates.io.
      The input also records additional package-manager coverage including Debian, Nix,
      and zypper.
  package-nerd-significance:
    - >
      The package is notable as a tiny terminal-native Rust utility with unusually broad
      package-manager reach for its size. It is the sort of tool package maintainers
      like because it has a single executable, clear CLI behavior, prebuilt releases,
      and a crates.io source path.
  project-history:
    - >
      The repository was created in 2020 and the README presents the tool as small,
      fast, memory efficient, zoomable, and multi-platform. The project publishes
      prebuilt binaries through GitHub releases and a Rust crate through crates.io.
  related-projects:
    - >
      The README names minimap.vim as a related project and example consumer. It also
      sits near terminal editor tooling, Rust CLI utilities, crates.io packaging, and
      package-manager ecosystems such as Homebrew, MacPorts, Scoop, AUR, Alpine, Gentoo,
      Nix, Debian, and openSUSE.
  sources:
    - https://github.com/wfxr/code-minimap
    - https://github.com/wfxr/code-minimap/releases
    - https://crates.io/crates/code-minimap
  summary:
    - >
      code-minimap is a Rust command-line tool for rendering source-code minimaps as
      text. Its official README frames it as a fast way to generate IDE-like minimap
      output for terminal editors and related tooling.
  timeline:
    - '2020: GitHub repository created.'
    - '2020: v0.4.3 release published in November.'
    - '2021: v0.6.0 and follow-up releases expanded the 0.6 line.'
    - '2024: v0.6.8 released.'
  usage:
    - >
      The basic workflow is `code-minimap <file>` with options for horizontal and
      vertical scaling, producing a block-character minimap in the terminal. The README
      explicitly points to use in IDE-like minimap plugins for terminal text editors.
