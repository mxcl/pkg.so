history:
  adoption-history:
    - >
      TickTick expanded the earlier GTasks concept into a cross-platform service. Its
      combination of task lists, calendars, habits, focus timers, reminders, notes, and
      synchronization positions it as an integrated personal-productivity application
      rather than a minimal checklist.
    - >
      The native macOS client is distributed through Homebrew Cask, making the
      proprietary desktop application convenient to include in repeatable workstation
      setups.
  package-nerd-significance:
    - >
      TickTick is representative of account-backed desktop software managed as a cask:
      Homebrew automates application installation, while user data, synchronization,
      subscriptions, and backups remain controlled by TickTick's service.
    - >
      It is useful in declarative Mac setups where productivity applications are
      installed alongside command-line development packages.
  project-history:
    - >
      TickTick's founding team began with GTasks, an Android application that
      synchronized with Google Tasks, in 2010. The team officially launched TickTick in
      2013 as a more capable application with synchronization across multiple platforms.
    - >
      The product subsequently incorporated calendar planning, Pomodoro-style focus
      sessions, habit tracking, an Eisenhower Matrix, notes, and other time-management
      features.
  related-projects:
    - GTasks
    - TickTick web and mobile applications
    - Homebrew Cask
  sources:
    - 'Official About page: https://www.ticktick.com/about'
    - "Official Beginner's Guide: https://help.ticktick.com/articles/7054286604315131904"
    - 'Official Help Center: https://help.ticktick.com/'
    - source_facts.package-manager and source_facts.provenance
  summary:
    - >
      TickTick is a cross-platform task and time-management service descended from the
      founding team's GTasks application. Its macOS client combines to-do lists with
      planning, focus, habit, and synchronization features.
  timeline:
    - '2010: The founding team began developing GTasks for Android.'
    - >
      2013: TickTick officially launched with broader functionality and cross-platform
      synchronization.
    - >
      Later: Calendar, Pomodoro, habit-tracking, and Eisenhower Matrix features
      broadened the product beyond task lists.
  usage:
    - >
      Users create and organize tasks, subtasks, lists, sections, and folders; schedule
      work in calendar views; set reminders; track habits; and run focus sessions.
    - >
      A TickTick account synchronizes activity across supported desktop, web, and mobile
      clients. The official web application also provides backup and restore controls.
