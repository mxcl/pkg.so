history:
  adoption-history:
    - >
      WALTR PRO serves users who want to place locally owned media and documents on
      iPhones, iPads, and iPods without managing a conventional iTunes library. It is
      distributed for both macOS and Windows, including through Homebrew Cask on macOS.
    - >
      Softorino continued updating WALTR PRO for newer Apple platforms, announcing iOS
      18 and iPhone 16 compatibility in 2024. The product is now also included in
      Softorino's Universal License.
  package-nerd-significance:
    - >
      WALTR PRO abstracts Apple's device protocols, media-format constraints, metadata
      handling, and destination-app rules behind a drag-and-drop interface. Package
      users value it when an unsupported video or audio file needs simultaneous
      conversion and transfer.
    - >
      It is the successor-era product in a lineage that includes the original WALTR and
      WALTR 2. WALTR 2 is still technically supported but is no longer sold or scheduled
      for future updates.
  project-history:
    - >
      WALTR PRO follows the original WALTR and WALTR 2 products. WALTR 2 added Wi-Fi
      transfer, broad iPod support, automatic metadata and cover art, and PDF and EPUB
      handling; WALTR PRO extended the family with broader file-management, conversion,
      and metadata features.
    - >
      Official Softorino guides documented WALTR PRO workflows by 2020, including local,
      no-iTunes transfers from Mac and Windows. Subsequent releases maintained
      compatibility with newer iOS devices and added AI-assisted metadata handling.
  related-projects:
    - WALTR and WALTR 2 are earlier generations of Softorino's Apple-device transfer utility.
    - >
      Apple Music, Apple TV, Books, and supported third-party iOS applications are
      common destinations for transferred files.
    - >
      iTunes or Apple device drivers may still be required for device recognition on
      Windows even though users do not manage transfers through iTunes itself.
  sources:
    - https://help.softorino.com/help/can-i-buy-waltr-2-will-it-be-supported-6dbcc43d
    - https://help.softorino.com/help/waltr-pro
    - https://help.softorino.com/help/what-is-the-difference-between-waltr-waltr-2
    - https://softorino.com/blog/compatibility-update-for-ios18
    - https://softorino.com/waltr
  summary:
    - >
      WALTR PRO is Softorino's desktop application for converting and transferring
      music, video, books, photographs, ringtones, and other files from macOS or Windows
      to Apple mobile devices.
  timeline:
    - '2010s: Softorino established the WALTR product line and followed it with WALTR 2.'
    - '2020: Official Softorino guides documented WALTR PRO transfer workflows.'
    - '2024: Softorino announced WALTR PRO compatibility with iOS 18 and the iPhone 16 family.'
    - '2025: Softorino documented WALTR 2 as no longer sold and directed users to WALTR PRO.'
  usage:
    - >
      Users connect an iPhone, iPad, or iPod by USB, or enable Wi-Fi transfers after
      initial setup, then drag files into WALTR PRO and choose a destination. The
      application converts unsupported media while transferring it to an appropriate
      native or third-party app.
    - >
      WALTR PRO can edit or automatically populate artwork and metadata. It supports
      music, video, EPUB, PDF, subtitles, ringtones, and formats accepted by compatible
      third-party applications, but official support says it does not transfer
      playlists.
    - >
      Current Universal License activation is managed through the purchaser's email and
      a web-based License Manager; official documentation does not identify a
      credentials file.
