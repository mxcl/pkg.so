history:
  adoption-history:
    - >
      The supplied package metadata records shntool packages across Alpine, Homebrew,
      Debian, Fedora/DNF, MacPorts, Nix, Ubuntu, and openSUSE, indicating long-running
      cross-distribution adoption despite its legacy upstream web presence.
  package-nerd-significance:
    - >
      shntool is a classic example of a Unix multi-call audio toolkit: one package
      installs a family of narrowly named commands for inspecting, hashing, splitting,
      joining, repairing, and converting lossless audio. It remains recognizable in
      archival and concert-recording workflows centered on exact WAVE data.
  project-history:
    - >
      shntool was developed as a multi-purpose WAVE data processing and reporting
      utility. Its design abstracts file formats from the core, allowing compressed or
      uncompressed audio to be handled when an appropriate format module is available.
    - >
      The command family retains `shn` names from its association with Shorten-era
      lossless-audio workflows, while its operations apply more generally to WAVE data.
  related-projects:
    - >
      External codec programs act as format modules for compressed audio; Shorten is the
      historical format most visibly reflected in the command names.
  sources:
    - http://shnutils.freeshell.org/shntool/
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      shntool is a suite for analyzing and manipulating WAVE data. It provides separate
      commands for operations including inspection, length calculation, checksumming,
      splitting, joining, conversion, padding, trimming, and repair.
  timeline:
    - >
      Legacy era: shntool became established in Shorten and lossless WAVE processing
      workflows.
    - >
      Version 3.0.10: The long-lived release packaged by multiple Unix and Linux
      distributions.
  usage:
    - >
      Users select a purpose-specific command such as `shninfo`, `shnlen`, `shnhash`,
      `shnsplit`, `shnjoin`, `shnfix`, or `shnconv`. The tools can operate on
      uncompressed WAVE files and on supported compressed formats through external
      helpers.
