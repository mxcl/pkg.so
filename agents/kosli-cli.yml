history:
  adoption-history:
    - >
      Kosli CLI adoption is primarily tied to Kosli users rather than broad
      general-purpose developer-tool adoption. Homebrew packaging matters because CI/CD
      and DevOps teams often install such CLIs on laptops, build runners, and scripts
      without checking out source code.
    - >
      GitHub repository metadata observed on 2026-07-01 reported 15 stars and 7 forks,
      so the public open-source footprint is modest even though the CLI is central to
      Kosli's product workflow.
  package-nerd-significance:
    - >
      Kosli CLI is package-nerd significant as an example of a SaaS workflow becoming a
      first-class package-manager formula: the service is external, but the reproducible
      local command is what users install, pin, and automate.
    - >
      It also reflects the wider move from CI scripts that only build and deploy toward
      CLIs that produce attestations, evidence, and compliance records.
  project-history:
    - >
      The GitHub repository was created on 2021-04-13. Release metadata shows v0.1.0
      published on 2021-04-29, followed by a fast early cadence through v0.3.0 on
      2021-08-19 and a long 2.x series by 2026.
    - >
      The official README describes the repository as containing the Kosli CLI for
      recording and querying software delivery events to Kosli. The official install
      documentation lists package managers, pre-built binaries, Docker images, and
      source builds as supported installation paths.
  related-projects:
    - >
      Kosli CLI is related to CI/CD systems, artifact provenance tools, deployment audit
      trails, Open Policy Agent policy checks, and supply-chain attestation tooling.
    - >
      Within the Kosli ecosystem, it pairs with Kosli Trails and setup actions for
      installing the CLI in GitHub Actions.
  sources:
    - https://api.github.com/repos/kosli-dev/cli
    - https://api.github.com/repos/kosli-dev/cli/releases
    - https://docs.kosli.com/client_reference
    - https://docs.kosli.com/getting_started/install
    - https://github.com/kosli-dev/cli
  summary:
    - >
      Kosli CLI is the command-line client for recording and querying software delivery
      events in Kosli. Its history is tied to the rise of audit trails, deployment
      attestations, and continuous-compliance tooling in CI/CD pipelines.
  timeline:
    - '2021-04-13: GitHub repository created.'
    - '2021-04-29: v0.1.0 published in GitHub release metadata.'
    - '2021-08-19: v0.3.0 published in GitHub release metadata.'
    - '2026-06-29: GitHub repository page listed v2.29.0 as a release.'
  usage:
    - >
      Users run `kosli` commands to report compliance and delivery events, query trails,
      and integrate Kosli with pipelines. Configuration and credentials can be supplied
      through Kosli config files such as `kosli.yaml`, `kosli.yml`, `kosli.json`, or
      `kosli.toml`.
    - >
      The CLI is most relevant in automated delivery systems where build, artifact,
      pull-request, and deployment events need to be linked into an auditable trail.
related-packages:
  - id: brew:snyk-cli
    reason: >
      Use Snyk CLI to produce code, container, or IaC scan results in SARIF form, then
      pass that file to `kosli attest snyk` as delivery evidence.
    rel: adjacent_workflow
    sources:
      - https://docs.snyk.io/developer-tools/snyk-cli
      - https://docs.kosli.com/client_reference/kosli_attest_snyk
  - id: brew:sonar-scanner
    reason: >
      Run SonarScanner to create a SonarQube analysis, then use `kosli attest sonar` to
      retrieve its quality-gate result and attach it to a Kosli artifact or trail.
    rel: adjacent_workflow
    sources:
      - >
        https://docs.sonarsource.com/sonarqube-server/latest/analyzing-source-code/scanners/sonarscanner
      - https://docs.kosli.com/client_reference/kosli_attest_sonar
