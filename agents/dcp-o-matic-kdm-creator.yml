id: cask:dcp-o-matic-kdm-creator
display-name: DCP-o-matic KDM Creator
repo: https://github.com/cth103/dcpomatic
docs:
  - https://dcpomatic.com/manual/html
  - https://dcpomatic.com/manual/html/ch10.html
config-file-location:
  linux:
    - ~/.config/dcpomatic2/config.xml
  macos:
    - /Users/<user>/Library/Preferences/com.dcpomatic/2/config.xml
  windows:
    - C:\Users\<user>\AppData\Local\dcpomatic\config.xml
credentials-file-location:
  linux:
    - ~/.config/dcpomatic2/config.xml
  macos:
    - /Users/<user>/Library/Preferences/com.dcpomatic/2/config.xml
  windows:
    - C:\Users\<user>\AppData\Local\dcpomatic\config.xml
history:
  adoption-history:
    - >
      DCP-o-matic is used across the digital-cinema workflow by film-makers, festivals,
      projectionists, subtitlers, and cinema technicians. KDM Creator addresses the
      distribution side of encrypted exhibition by generating recipient- and
      time-specific playback keys.
  package-nerd-significance:
    - >
      KDM Creator makes a standards-heavy public-key workflow accessible as a standalone
      desktop package. Package maintainers and operators must treat its configuration as
      sensitive because the official manual says `config.xml` may contain the only
      private key capable of decrypting stored DKDMs.
  project-history:
    - >
      DCP-o-matic began with its first repository commit in 2012 and grew into a suite
      covering DCP creation, checking, delivery, and encryption. KDM Creator is the
      specialized application for producing Key Delivery Messages from DKDMs created by
      DCP-o-matic or supplied by another party.
  related-projects:
    - DCP-o-matic
    - DCP-o-matic Player
    - DCP-o-matic Verifier
  sources:
    - https://dcpomatic.com/development
    - https://dcpomatic.com/manual/html/ch01s02.html
    - https://dcpomatic.com/manual/html/ch10.html
    - https://dcpomatic.com/manual/html/ch10s03.html
    - https://www.dcpomatic.com/
  summary:
    - >
      DCP-o-matic KDM Creator creates Key Delivery Messages from Distribution KDMs so
      encrypted Digital Cinema Packages can be authorized for particular cinema systems
      and validity periods.
  timeline:
    - '2012: First commit to the DCP-o-matic repository.'
    - '2015: DCP-o-matic 1.83 was distributed for Windows and major Linux distributions.'
    - >
      2017: KDM Creator was offered as a separate macOS application alongside
      DCP-o-matic 2.10.
  usage:
    - >
      Import or select a DKDM, choose cinema screens and validity periods, and generate
      KDM files or email deliveries for the intended recipients. Back up `config.xml`
      when relying on internally stored DKDMs because it contains the associated
      decryption key.
