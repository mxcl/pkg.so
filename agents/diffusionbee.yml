history:
  adoption-history:
    - >
      DiffusionBee targeted macOS users who wanted Stable Diffusion without installing
      Python environments or manually managing dependencies. Its one-click packaging and
      local execution made generative image tooling accessible on Intel and Apple
      Silicon Macs.
  package-nerd-significance:
    - >
      DiffusionBee represents the wave of desktop packages that wrapped early Stable
      Diffusion workflows into consumer-friendly local applications. For package
      curators, it is notable for bundling a substantial machine-learning runtime,
      downloading model data on first launch, and storing generated artifacts and
      imported models under the user’s home directory.
  project-history:
    - >
      DiffusionBee was created as a graphical macOS wrapper around Stable Diffusion,
      initially emphasizing easy local use on Apple Silicon and later documenting Intel
      support and a wider range of workflows. The project credits upstream work
      including Stable Diffusion, Maple Diffusion, a TensorFlow Stable Diffusion
      implementation, Swift Diffusion, and Hugging Face Diffusers.
  related-projects:
    - >
      Stable Diffusion, Maple Diffusion, stable-diffusion-tensorflow, Swift Diffusion,
      Hugging Face Diffusers, and model distribution through Hugging Face.
  sources:
    - https://diffusionbee.com/
    - https://github.com/divamgupta/diffusionbee-stable-diffusion-ui
    - >
      https://github.com/divamgupta/diffusionbee-stable-diffusion-ui/blob/master/docs/DOCUMENTATION.md
  summary:
    - >
      DiffusionBee is a macOS desktop application for running Stable Diffusion
      image-generation workflows locally through a graphical interface.
  timeline:
    - >
      Early Stable Diffusion era: Introduced as a one-click local Stable Diffusion GUI
      for Apple Silicon Macs.
    - >
      Subsequent development: Added Intel Mac support and workflows including
      image-to-image, inpainting, outpainting, upscaling, custom models, ControlNet, and
      LoRA.
  usage:
    - >
      Users launch the application, allow it to download required model data, enter a
      text prompt, and generate images locally. The interface also supports
      image-to-image work, masks, generation history, imported models, and advanced
      generation controls.
