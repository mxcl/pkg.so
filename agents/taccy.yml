history:
  adoption-history:
    - >
      Taccy was aimed at advanced Mac users, system administrators, developers, and
      security researchers dealing with the increasingly complex privacy and
      notarization behavior introduced around macOS Mojave and Catalina. It remained
      distributed as freeware through The Eclectic Light Company.
  package-nerd-significance:
    - >
      Taccy turns several otherwise command-line-heavy macOS inspection tasks into a
      focused graphical workflow. It is useful when package maintainers and
      administrators need to understand an application's bundle identifier, privacy
      usage declarations, entitlements, hardened-runtime state, code signature,
      notarization, or installer-package trust without manually combining Plist
      inspection, codesign output, and unified-log searches.
  project-history:
    - >
      Taccy was created to inspect application Info.plist data, entitlements, code
      signatures, and privacy-related declarations as Apple's TCC privacy controls
      became more prominent in macOS Mojave.
    - >
      In early 2019 the developer expanded Taccy with a filtered unified-log browser for
      diagnosing TCC, LaunchServices, securityd, sandboxd, and related privacy-control
      activity. Later 2019 releases added clearer hardened-runtime and notarization
      reporting, Catalina privacy declarations, and package checks.
    - >
      The utility subsequently received Universal builds and compatibility updates for
      newer macOS releases.
  related-projects:
    - >
      Signet: the same developer's utility for scanning folders and checking bundle
      signatures.
    - >
      ArchiChect: an Eclectic Light utility for checking architecture, quarantine,
      signatures, and notarization.
    - >
      macOS codesign, spctl, and log tools: command-line facilities whose output
      overlaps with parts of Taccy's graphical inspection workflow.
  sources:
    - >
      Official Mojave privacy troubleshooting article:
      https://eclecticlight.co/2019/02/01/solving-problems-with-mojaves-privacy-protection/
    - >
      Official notarization article:
      https://eclecticlight.co/2019/09/09/how-to-recognise-properly-notarized-apps-with-taccy-1-3/
    - >
      Official package-checking article:
      https://eclecticlight.co/2019/10/12/taccy-now-checks-packages-as-well-as-app-notarization/
    - >
      Official product page:
      https://eclecticlight.co/taccy-signet-precize-alifix-utiutility-alisma/
  summary:
    - >
      Taccy is a freeware macOS diagnostic utility by The Eclectic Light Company for
      inspecting application metadata, privacy declarations, entitlements, code
      signatures, notarization, and relevant unified-log activity.
  timeline:
    - >
      2019: Taccy gained a specialized unified-log browser for troubleshooting Mojave
      privacy controls.
    - '2019: Version 1.2 added interpretation of Catalina privacy settings.'
    - '2019: Version 1.3 added clearer hardened-runtime and notarization checks.'
    - '2019: Taccy added installer-package checks alongside application notarization checks.'
    - '2020: Taccy became available as a Universal application.'
  usage:
    - >
      Users drag an application onto Taccy or open it from the File menu, then inspect
      its Info.plist declarations, identifier, entitlements, signature, hardened-runtime
      and notarization state, and privacy-related settings. Its log view can isolate
      activity from TCC and related macOS subsystems; the developer notes that log
      access requires running it from an administrator account.
