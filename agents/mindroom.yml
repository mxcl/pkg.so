history:
  adoption-history:
    - >
      MindRoom supports local execution paired with hosted Matrix, fully self-hosted
      deployments, a macOS menu-bar application, Docker, and Kubernetes. Its Matrix
      foundation allows the same agents to participate through Matrix clients and
      bridged services rather than remaining confined to a proprietary chat interface.
  package-nerd-significance:
    - >
      MindRoom combines several package-nerd interests in one system: declarative YAML
      configuration, local or self-hosted deployment, model-provider portability, Matrix
      federation, persistent state, OpenAI-compatible endpoints, extensible tools and
      skills, and a native macOS cask that manages the local service.
  project-history:
    - >
      MindRoom was developed as an open-source multi-agent runtime built on Matrix. Its
      stated motivation is to move AI agents out of isolated applications and place them
      in shared chat rooms where multiple users and agents can collaborate.
    - >
      The project grew into an ecosystem containing the core runtime, MindRoom Chat, a
      self-hosting stack, example agent workspaces, Matrix integration components,
      execution isolation, and deployment tooling.
  related-projects:
    - >
      Matrix: the open, federated communications protocol underlying MindRoom's rooms,
      identities, threads, and bridges.
    - 'MindRoom Chat: an AI-oriented Matrix client for MindRoom workflows.'
    - "mindroom-stack: the project's complete local self-hosting stack."
    - >
      OpenClaw and Hermes: self-hosted assistant projects that the official
      documentation compares with MindRoom.
  sources:
    - https://docs.mindroom.chat/
    - https://github.com/mindroom-ai
    - https://github.com/mindroom-ai/mindroom
  summary:
    - >
      MindRoom is a self-hostable multi-agent runtime that gives AI agents Matrix
      identities, shared rooms, tools, memory, knowledge bases, scheduling, model
      routing, and collaboration workflows.
  timeline:
    - >
      Initial direction: Created as an open-source runtime for AI agents living and
      collaborating in Matrix rooms.
    - >
      Ecosystem expansion: Added a dedicated chat client, hosted pairing, local and
      container deployment paths, tool integrations, isolation controls, and a macOS
      menu-bar package.
  usage:
    - >
      Users define models, agents, teams, rooms, tools, memory, and authorization in
      config.yaml or through the web dashboard. They then converse with agents in Matrix
      threads, mention several agents for collaboration, schedule work, attach
      integrations, or expose selected agents through the OpenAI-compatible API.
