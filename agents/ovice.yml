history:
  adoption-history:
    - >
      ovice emerged during the rapid shift to remote work and was adopted as a
      persistent communication space rather than only a scheduled-meeting tool. Official
      customer accounts describe organization-wide deployments, including a Transcosmos
      rollout involving roughly 1,800 employees logging in daily.
  package-nerd-significance:
    - >
      The cask packages the desktop client for a primarily SaaS-based workplace. It
      illustrates the Electron-style package pattern in which the installed application
      provides startup integration, richer screen sharing, and a more isolated runtime
      while most product state and collaboration remain service-backed.
  project-history:
    - >
      Founder Sae Hyung Jung began developing ovice after being caught in a North
      African lockdown in March 2020 and finding conventional online meetings inadequate
      for casual, office-like communication. Nimaru Technology, now oVice, Inc., was
      established in 2020 to develop and distribute the virtual-workplace platform.
  related-projects:
    - >
      The desktop application exposes the same core spaces, chat, and meeting functions
      as the browser service. ovice Go is the related mobile client for Android and iOS.
  sources:
    - https://help.ovice.com/hc/en-us/articles/26341396667161-Using-the-ovice-Desktop-App
    - https://www.ovice.com/casestudy/transcosmos
    - https://www.ovice.com/company
    - https://www.ovice.com/ja/careers
  summary:
    - >
      ovice is a SaaS virtual-workplace platform for distributed and hybrid teams, with
      a desktop client for macOS and Windows.
  timeline:
    - >
      2020: Nimaru Technology, later oVice, Inc., was founded and development of the
      virtual workplace began.
    - '2021: Organizations including Transcosmos began larger workplace deployments.'
    - >
      2022: Transcosmos reported an organization-wide rollout with 1,800 daily employee
      logins.
  usage:
    - >
      Teams enter shared spatial workspaces, move between areas, chat, hold meetings,
      and share screens. The desktop client adds smoother startup, automatic launch,
      higher-resolution screen sharing, and a more isolated operating environment than
      the browser version.
