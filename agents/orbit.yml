credentials-file-location:
  macos:
    - macOS Keychain (Google authentication tokens)
history:
  adoption-history:
    - >
      Orbit is aimed at people who manage several personal, work, or client Google
      identities and want to avoid repeated account switching or accidental use of the
      wrong sender. It is sold as a perpetual license with a trial rather than as a
      subscription.
  package-nerd-significance:
    - >
      Orbit uses native macOS technology and WebKit instead of bundling Chromium or
      Electron, while retaining the real Google web applications. Its isolated cookie
      sessions and local Keychain token storage make it a compact example of a
      site-specific browser designed around account separation.
  project-history:
    - >
      Dearnode developed Orbit as a native Apple-silicon Mac application for running
      multiple Google accounts in one window. Each account receives an isolated browser
      session while Gmail, Calendar, Drive, Meet, Docs, and Gemini remain the original
      Google web applications.
    - >
      The product was publicly marketed in 2026 for macOS 14 and later. Its architecture
      has no Orbit synchronization server or mail relay: the application communicates
      directly with Google, keeps authentication tokens in the macOS Keychain, and
      stores user content with Google or locally.
  related-projects:
    - >
      Gmail, Google Calendar, Google Drive, Meet, Docs, Sheets, Slides, and Gemini are
      the primary services surfaced by Orbit.
    - >
      Mimestream, Shift, Kiwi, and browser profiles are adjacent approaches compared on
      Orbit's official site.
    - WebKit supplies the native web-content layer rather than a bundled Chromium runtime.
  sources:
    - https://orbitformac.com/
    - https://orbitformac.com/contact
    - https://orbitformac.com/privacy
    - https://orbitformac.com/terms
  summary:
    - >
      Orbit is a native macOS client that places multiple isolated Google and Google
      Workspace sessions in one window without operating a separate mail or
      synchronization backend.
  timeline:
    - >
      2026: Dearnode publicly marketed Orbit for Mac as a native multi-account Google
      Workspace client.
    - >
      2026-07: Official privacy and service terms documented its on-device session
      architecture and perpetual-license model.
  usage:
    - >
      Users add standard Google or Google Workspace accounts, each of which runs in a
      separate session with its own cookies. The first nine accounts can be selected
      with Command-1 through Command-9, and each session can access Gmail and other
      Google Workspace web applications.
