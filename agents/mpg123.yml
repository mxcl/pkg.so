config-file-location: null
credentials-file-location: null
history:
  project-history:
    - >
      The package's role widened from a player binary into a library-oriented decoder
      stack. libmpg123 gave applications a reusable MP3 decoder, while the command-line
      tools remained useful for playback, decoding to files, scripting, and audio-output
      testing through programs such as mpg123 and out123. The project emphasizes
      portability across GNU/Linux, macOS, BSD systems, Solaris, AIX, HP-UX, IRIX, OS/2,
      Cygwin, and Windows, with runtime CPU-specific assembly optimizations on several
      architectures.
  sources:
    - >
      https://android.googlesource.com/platform/external/mpg123/+/83254c70354aec4976ff3d1ea3f4d2bd600da163/README
    - https://formulae.brew.sh/formula/mpg123
    - https://www.mpg123.de/
    - https://www.mpg123.de/asterisk.shtml
  summary:
    - >
      mpg123 is one of the long-lived Unix command-line MP3 players and MPEG audio
      decoders. The project traces its roots to Michael Hipp's work in the mid-1990s,
      beginning as an MP2 player in 1994 and gaining MP3 support in 1995. The project
      site describes it as a fast console MPEG Audio player and decoder library, with
      support for MPEG 1.0/2.0/2.5 layers 1, 2, and 3 and reusable decoding and output
      libraries.
  usage:
    - >
      In package-manager terms, mpg123 occupies the small, durable niche of a
      lightweight MP3 playback and decoding utility. Its history also explains mpg321:
      mpg321 appeared as a free drop-in replacement during the period when old mpg123
      releases were treated as non-free by some distributions. The revived mpg123 line
      moved under the LGPL-2.1 license and remained the canonical package for users who
      want the original tool and its library rather than the libmad-based clone.
related-packages:
  - id: brew:mpv
    reason: >
      Choose mpv when you need an interactive player for many audio and video formats,
      subtitles, and configurable graphical output rather than mpg123's focused console
      MPEG-audio playback and library stack.
    rel: alternative
    sources:
      - https://www.mpg123.de/
      - https://mpv.io/manual/stable/
  - id: brew:ffmpeg
    reason: >
      Choose FFmpeg when MPEG-audio decoding must feed a larger stream-selection,
      filtering, conversion, or transcoding pipeline rather than a focused player and
      decoder API.
    rel: alternative
    sources:
      - https://www.mpg123.de/
      - https://ffmpeg.org/ffmpeg.html
      - https://ffmpeg.org/ffmpeg-codecs.html
  - id: brew:mpd
    reason: >
      MPD can use libmpg123 as its MPEG-audio decoder backend, pairing mpg123's decoding
      library with a persistent network-controlled music server.
    rel: adjacent_workflow
    sources:
      - https://mpd.readthedocs.io/en/stable/user.html
      - https://github.com/MusicPlayerDaemon/MPD/blob/master/NEWS
      - https://www.mpg123.de/api/
