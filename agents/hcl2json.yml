config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption stayed in the small-utility lane: Homebrew, MacPorts, Nix, prebuilt
      GitHub release binaries, Docker images, and tool-version-manager installs made it
      easy to drop into shell pipelines. The project matters most where HCL is data to
      inspect or transform rather than configuration to execute.
  package-nerd-significance:
    - >
      Package maintainers care about hcl2json because it is a single-purpose, Go-built
      CLI with no runtime service, no credentials, and obvious test fixtures: feed HCL
      in, compare JSON out. It fills the awkward gap between plain text processing and
      linking a whole HCL application stack.
  project-history:
    - >
      The repository was created in July 2019 and framed itself around HCL2 conversion
      at a time when HCL was becoming the shared configuration substrate for Terraform
      and other HashiCorp-style tools. The README says the tool was created because
      there were few direct schemaless converters, while later HashiCorp HCL tooling
      such as hcldec offered a more specification-driven path.
  related-projects:
    - HashiCorp HCL provides the underlying configuration language and Go packages.
    - Terraform is the most common class of HCL input mentioned by the project.
    - hcldec is the upstream HCL command-line alternative for spec-guided decoding.
  sources:
    - https://api.github.com/repos/tmccombs/hcl2json
    - https://api.github.com/repos/tmccombs/hcl2json/releases
    - https://github.com/hashicorp/hcl
    - https://github.com/tmccombs/hcl2json
  summary:
    - >
      hcl2json is a small Go command-line converter for turning HashiCorp Configuration
      Language version 2 input into JSON. Its niche is not general Terraform evaluation;
      it is a bridge for scripts and non-Go programs that need to inspect HCL-shaped
      configuration without embedding a full HCL-aware application.
  timeline:
    - '2019: GitHub repository created.'
    - '2019: v0.0.1 release published.'
    - '2020: 0.3.x releases broadened the early packaged surface.'
    - '2021: v0.3.2 release published.'
  usage:
    - >
      Typical use is piping an HCL file or stdin through hcl2json and redirecting JSON
      output for downstream tools. The README also documents a simplify mode and an HCL
      pack-format mode, while warning that some HCL constructs cannot be converted with
      exact semantic equivalence.
related-packages:
  - id: brew:hcledit
    reason: >
      hcledit complements hcl2json by making token-preserving, schemaless changes to HCL
      before the resulting document is converted to JSON.
    rel: adjacent_workflow
    sources:
      - https://github.com/tmccombs/hcl2json#readme
      - https://github.com/minamijoyo/hcledit#readme
  - id: brew:jq
    reason: >
      jq is a practical downstream companion for querying or transforming the JSON that
      hcl2json writes to standard output.
    rel: adjacent_workflow
    sources:
      - https://github.com/tmccombs/hcl2json#readme
      - https://jqlang.github.io/jq/manual/
