id: brew:ctail
display-name: ctail
repo: null
docs:
  - https://github.com/pquerna/ctail#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      In package-manager terms, ctail is a small operations utility: the sort of
      single-purpose CLI that gets packaged so administrators can install it quickly on
      workstations and bastion hosts.
  package-nerd-significance:
    - >
      ctail captures an older but still recognizable operations pattern: distribute work
      over SSH and compose familiar Unix tools instead of adopting a larger log
      pipeline.
  project-history:
    - >
      The official README presents ctail as a simple tool around tail(1), many machines,
      and many log files. It is implemented in C and built on APR and APR-Util.
  related-projects:
    - >
      tail(1), OpenSSH, APR, and centralized log collectors are the main adjacent tools
      and design alternatives.
  sources:
    - https://github.com/pquerna/ctail
    - https://raw.githubusercontent.com/pquerna/ctail/master/README.md
    - source_facts.package-manager
  summary:
    - >
      ctail is a cluster tail tool for merging tail streams from many machines. It uses
      existing SSH authentication rather than adding a central log collection service.
  usage:
    - >
      Users pass machine lists with -m and optionally a default log path with -f. The
      README examples show tailing /var/log/messages and web access logs across multiple
      hosts.
related-packages:
  - id: brew:openssh
    reason: >
      ctail explicitly relies on existing non-interactive SSH authentication to connect
      to each target machine, so OpenSSH supplies the client, keys, agent, and host
      configuration used by the workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/pquerna/ctail
      - https://www.openssh.com/manual.html
tags:
  - cli
