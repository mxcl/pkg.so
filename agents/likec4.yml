history:
  adoption-history:
    - >
      LikeC4's adoption has followed the broader move from hand-edited architecture
      diagrams to diagrams-as-code workflows. Its CLI supports preview, static-site
      builds, image and data exports, and generated React/Web Component artifacts, which
      made it easy to put architecture diagrams into repositories, documentation sites,
      CI, and IDE workflows.
  package-nerd-significance:
    - >
      For package nerds, LikeC4 is a modern example of a documentation tool distributed
      like a developer CLI: a fast-moving npm-centered project that also lands in
      Homebrew so architecture modeling can be installed next to compilers, formatters,
      and static-site tooling.
  project-history:
    - >
      The project appeared publicly with early 0.x tags in 2024 and grew as a
      TypeScript/Node-based toolchain around a domain-specific language, CLI, web
      viewer, editor support, and generated artifacts. The README describes LikeC4 as
      inspired by the C4 Model and Structurizr DSL, but aimed at more flexible notation
      and model depth.
  related-projects:
    - >
      LikeC4 is closely related to Simon Brown's C4 model, Structurizr DSL, Mermaid, D2,
      PlantUML/C4-PlantUML, and documentation systems that embed generated diagrams. Its
      generated component workflow also connects it to React and web-component
      publishing.
  sources:
    - https://c4model.com/
    - https://github.com/likec4/likec4
    - https://github.com/likec4/likec4/releases/tag/v0.6.0
    - https://likec4.dev/
    - https://likec4.dev/tooling/cli/
  summary:
    - >
      LikeC4 is an architecture-as-code toolkit for describing software architecture in
      a textual DSL and generating live, interactive diagrams from that model. Its name
      reflects its relationship to the C4 model while deliberately allowing custom
      notation, element types, and nesting beyond the strict C4 levels.
  timeline:
    - '2024-04-20: The v0.6.0 tag was published in the public GitHub repository.'
    - >
      2025: Discussions and releases show LikeC4 expanding around multi-project
      workflows and Vite-style integration.
    - >
      2026: The LikeC4 site described a toolkit for modeling, visualizing, validating,
      exporting, and embedding architecture from code.
  usage:
    - >
      Users write architecture models in LikeC4 files, run the CLI to preview or build
      diagrams, and keep those models under version control with the rest of the system.
      The package is most relevant to teams that want architecture documentation to
      change through code review instead of through separate drawing tools.
related-packages:
  - id: brew:structurizr-cli
    reason: >
      Choose Structurizr CLI when strict C4-model compatibility and the reference
      Structurizr DSL ecosystem matter more than LikeC4's customizable notation and
      arbitrary nesting.
    rel: alternative
    sources:
      - https://github.com/likec4/likec4
      - https://docs.structurizr.com/
      - https://docs.structurizr.com/cli
  - id: brew:d2
    reason: >
      LikeC4 can export a model to D2, after which the D2 CLI can render or further
      process the generated textual diagram.
    rel: adjacent_workflow
    sources:
      - https://likec4.dev/tooling/cli/
      - https://d2lang.com/tour/intro/
  - id: brew:mermaid-cli
    reason: >
      LikeC4's CLI can export Mermaid source, and mermaid-cli can render that exported
      source in documentation or CI pipelines.
    rel: adjacent_workflow
    sources:
      - https://likec4.dev/tooling/cli/
      - https://github.com/mermaid-js/mermaid-cli#readme
