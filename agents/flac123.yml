history:
  adoption-history:
    - >
      The package is distributed through Unix-style package managers in the input data
      and upstream documents dependency names for macOS/Homebrew, FreeBSD, Debian
      variants, and Red Hat variants, suggesting practical use by users who want a
      minimal FLAC player rather than a full media library application.
  package-nerd-significance:
    - >
      flac123 is package-nerd useful because it exposes the classic Unix audio stack: a
      tiny frontend, libao output abstraction, libFLAC decoding, and simple command-line
      switches.
  project-history:
    - >
      The official README describes flac123 as a command-line program for playing audio
      files encoded with FLAC. Its implementation depends on libao, libFLAC, and popt,
      and the project documents testing on Linux, FreeBSD, and macOS.
    - >
      The GitHub tag snapshot used for this enrichment is sparse, with 2.1.x tags rather
      than a detailed origin narrative. The supported history is therefore mainly its
      role as a lightweight FLAC playback frontend.
  related-projects:
    - FLAC, libFLAC, libao, popt, mpg123-style command-line audio players.
  sources:
    - https://github.com/flac123/flac123
    - https://api.github.com/repos/flac123/flac123/tags
  summary:
    - >
      flac123 is a small command-line FLAC player, patterned around the tradition of
      simple terminal audio players.
  timeline:
    - '2020s: GitHub repository shows 2.1.x tags.'
    - '2020s: README documents Linux, FreeBSD, and macOS testing.'
  usage:
    - >
      Typical use is direct playback of FLAC files from a shell, with options for
      selecting a libao output driver, writing decoded audio to WAV, quiet output, and a
      remote mode for programmatic control.
