config-file-location:
  macos:
    - $XDG_CONFIG_HOME/mactop/config.json
    - ~/.mactop/config.json
    - $XDG_CONFIG_HOME/mactop/theme.json
    - ~/.mactop/theme.json
credentials-file-location: null
history:
  adoption-history:
    - >
      mactop became useful in the Apple Silicon era because many traditional Unix
      monitoring tools do not expose SoC-specific measurements such as efficiency and
      performance cores, GPU frequency, Neural Engine activity, and power telemetry. Its
      official repository shows Homebrew installation instructions and a public GitHub
      project with substantial stars and forks for a platform-specific system tool.
  package-nerd-significance:
    - >
      mactop matters to package and systems people because it fills a macOS-on-ARM
      observability gap from the command line. It is the kind of package developers
      install immediately after getting Apple Silicon hardware because it exposes
      metrics that `top`, `htop`, and cross-platform libraries often do not provide.
  project-history:
    - >
      The tool is written in Go with CGO and uses native Apple APIs such as SMC,
      IOReport, IOKit, and IOHIDEventSystemClient. Its official README frames it as
      Apple Silicon only, requiring macOS Monterey 12.3 or later.
  related-projects:
    - >
      mactop is related to traditional terminal monitors such as top and htop, but
      targets Apple Silicon-specific telemetry through macOS native APIs.
  sources:
    - https://github.com/metaspartan/mactop
    - source_facts.package-manager
  summary:
    - >
      mactop is a terminal system monitor for Apple Silicon Macs. The project describes
      itself as a `top`-style monitor for real-time Apple Silicon CPU, GPU, ANE, DRAM,
      power, temperature, fan, process, and I/O metrics.
  timeline:
    - 'Public repository: Official Git tags start at v0.0.1.'
    - >
      Current README: Documents Homebrew installation, headless output, Prometheus
      metrics, menu bar mode, and support for all Apple Silicon models.
  usage:
    - >
      Users normally run `mactop` interactively for a terminal UI. The README also
      documents flags for update interval, foreground and background colors, headless
      JSON output, output formats such as YAML and CSV, Prometheus metrics, and optional
      menu bar mode.
related-packages:
  - id: brew:asitop
    reason: >
      asitop is a lighter Python and powermetrics-based Apple Silicon monitor; choose it
      for a narrow CPU/GPU/power dashboard, while mactop provides broader native
      telemetry and core monitoring without sudo.
    rel: alternative
    sources:
      - https://github.com/metaspartan/mactop#readme
      - https://tlkh.github.io/asitop/
  - id: cask:stats
    reason: >
      Stats is a graphical macOS menu-bar monitor for CPU, GPU, memory, disk, network,
      battery, fans, and sensors; choose it over mactop when a persistent GUI is more
      useful than a terminal or structured-output workflow.
    rel: alternative
    sources:
      - https://github.com/metaspartan/mactop#readme
      - https://github.com/exelban/stats
