config-file-location:
  linux:
    - ~/.config/amethyst
  macos:
    - ~/Library/Preferences/com.apple.java.util.prefs.plist
    - ~/Library/Application Support/Amethyst
  windows:
    - '%APPDATA%\Amethyst'
    - '%LOCALAPPDATA%\Amethyst'
credentials-file-location:
  macos:
    - ~/.amethyst
history:
  adoption-history:
    - >
      Amethyst became a feature-rich Android Nostr client and subsequently expanded into
      a Kotlin Multiplatform codebase with desktop applications, shared protocol and UI
      modules, a command-line client, and distributable libraries. The official desktop
      build is available through Homebrew Cask on macOS and through native packages or
      archives on Windows and Linux.
  package-nerd-significance:
    - >
      Amethyst matters to package enthusiasts because it packages a broad Nostr
      implementation across mobile, desktop, CLI, and library surfaces. Its source tree
      exposes reusable Quartz protocol components, while its desktop packaging
      demonstrates how a mobile-first Kotlin project can grow into a multi-platform
      distribution.
  project-history:
    - >
      Amethyst originated as a native Android client for the decentralized Nostr social
      protocol. Its architecture grew around relay connections, an in-memory event
      model, and reusable protocol code, later adding shared Kotlin Multiplatform
      components and a Compose desktop application.
  related-projects:
    - >
      Quartz is the repository's reusable Nostr Kotlin Multiplatform library. Commons
      supplies shared UI and view-model code, while the desktop application reuses both
      Quartz and Commons. Amber is supported as an external Android signer through
      NIP-55.
  sources:
    - 'Official README: https://github.com/vitorpamplona/amethyst#readme'
    - 'Official build guide: https://github.com/vitorpamplona/amethyst/blob/main/BUILDING.md'
    - 'Official desktop roadmap: https://github.com/vitorpamplona/amethyst/issues/1629'
  summary:
    - >
      Amethyst is an open-source Nostr client centered on user-controlled identities and
      relay-based social networking. The project supports Android and desktop clients
      and implements a large range of Nostr Improvement Proposals.
  timeline:
    - >
      2025: The project published an official roadmap for bringing the desktop client
      toward Android feature parity.
    - >
      Current distribution: The desktop application is packaged for macOS, Windows, and
      Linux, including a Homebrew Cask for macOS.
  usage:
    - >
      Users sign in with or generate a Nostr identity, choose relays, and consume or
      publish signed events such as notes, messages, reactions, media, and Lightning
      zaps. Users should treat public Nostr activity as potentially permanent and
      understand that relays can observe connection metadata.
