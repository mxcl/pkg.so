credentials-file-location: null
history:
  adoption-history:
    - >
      AbleSet is aimed at performers and production teams whose shows already run from
      Ableton Live. Official community material documents recurring use in cover-band,
      backing-track, rehearsal, festival, redundant-computer, and large multi-song show
      workflows.
  package-nerd-significance:
    - >
      AbleSet packages stage-oriented show control as a desktop service with a browser
      interface, local networking, MIDI, OSC, scripting, and project-relative JSON
      state. For package-manager users, the cask makes a specialized proprietary Ableton
      companion reproducibly installable while its project files remain portable with
      the Live project.
  project-history:
    - >
      AbleSet developed around converting Ableton Live locators into an actionable
      setlist. Its scope expanded from song ordering and remote playback into lyrics,
      MIDI and OSC control, custom interfaces, redundant-computer synchronization,
      audio-interface monitoring, scripting, and saved setlist management.
  related-projects:
    - Ableton Live
    - Max for Live
    - Open Sound Control
    - MIDI
    - Bitfocus Companion
  sources:
    - https://beta.ableset.com/
    - https://beta.ableset.com/docs
    - https://beta.ableset.com/docs/all
    - https://forum.ableset.app/
  summary:
    - >
      AbleSet is a proprietary setlist-management and show-control companion for Ableton
      Live, built for rehearsals and live performance.
  timeline:
    - 'Early product: AbleSet established a locator-driven setlist workflow for Ableton Live.'
    - >
      2023: Official forum discussions documented local HTTP integration and an exposed
      plugin-oriented browser API.
    - '2025: AbleSet 3 beta introduced an integrated saved-setlist manager.'
    - >
      2026: The official documentation described expanded Canvas, mixer, scripting, OSC,
      and project-folder workflows.
  usage:
    - >
      Place named locators or section clips in an Ableton Live project, then use AbleSet
      to reorder, annotate, save, and launch songs. Its browser interface can be opened
      from computers or mobile devices on the same network, while MIDI, OSC, Stream Deck
      integrations, and custom canvases provide stage controls.
