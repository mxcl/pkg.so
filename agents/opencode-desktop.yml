id: cask:opencode-desktop
display-name: OpenCode
repo: https://github.com/anomalyco/opencode
docs:
  - https://opencode.ai/docs
  - https://opencode.ai/docs/config
  - https://opencode.ai/docs/providers
config-file-location:
  unix:
    - ./opencode.json
    - ~/.config/opencode/opencode.json
credentials-file-location:
  unix:
    - ~/.local/share/opencode/auth.json
history:
  adoption-history:
    - >
      OpenCode is distributed through several developer-oriented channels, including its
      own install script, npm-compatible package managers, Homebrew, Arch Linux
      packages, Chocolatey, Scoop, Mise, Docker images, desktop releases, and IDE
      integrations. Its official documentation recommends the project’s Homebrew tap for
      the newest releases while noting that Homebrew’s core formula may update less
      frequently.
  package-nerd-significance:
    - >
      OpenCode is notable to package-manager users because one codebase spans a terminal
      interface, desktop application, IDE integration, automation, and container
      distribution. It also exemplifies modern developer tools that maintain both an
      upstream package-manager channel and downstream community packages.
  project-history:
    - >
      OpenCode emerged as an open-source AI coding agent designed to work across
      terminal, desktop, IDE, and automation interfaces. Its configuration and provider
      system are shared across those surfaces.
  related-projects:
    - >
      OpenCode interoperates with numerous hosted and local model providers through the
      AI SDK and Models.dev ecosystem. Its project-level AGENTS.md convention connects
      it with the broader ecosystem of repository-scoped coding-agent instructions.
  sources:
    - https://opencode.ai/docs
    - https://opencode.ai/docs/config/
    - https://opencode.ai/docs/providers
    - 'source_facts.version: 1.18.15'
  summary:
    - >
      OpenCode is an open-source AI coding agent available as a terminal interface,
      desktop application, IDE extension, and GitHub-oriented automation tool. It
      supports many model providers and both global and project-specific configuration.
  timeline:
    - '2026: The supplied desktop cask record identifies version 1.18.15.'
  usage:
    - >
      Users connect an LLM provider, open a software project, and ask OpenCode to
      explain code, plan work, implement changes, or run configured agents and commands.
      Configuration can be stored globally or in a project, while provider credentials
      added through /connect are stored separately in auth.json.
tags:
