history:
  adoption-history:
    - >
      According to Youdao's official overview, the product accumulated more than 80
      million effective users after its 2007 launch. Its desktop adoption was supported
      by free distribution, browser screen-word lookup, online vocabulary
      synchronization, and coverage of newly emerging web vocabulary.
  package-nerd-significance:
    - >
      Youdao Dictionary is a long-lived example of Chinese desktop dictionary software
      whose value comes from blending locally installed lookup workflows with
      continuously updated web-derived definitions. The Homebrew cask makes the vendor's
      macOS application available through a package-manager workflow.
  project-history:
    - >
      NetEase Youdao launched Youdao Dictionary in 2007 as free translation software.
      Version 1.0 of the desktop dictionary was publicly released on 10 December 2007,
      followed by version 1.2 in July 2008. The product combined conventional bilingual
      and Chinese dictionaries with Youdao's web-definition and extraction technologies.
  related-projects:
    - >
      The application belongs to NetEase Youdao's broader family of search, translation,
      vocabulary, and language-learning products.
  sources:
    - 'Official changelog: https://cidian.youdao.com/changelog.html'
    - 'Official desktop help: https://cidian.youdao.com/help5.html'
    - 'Official product history: https://cidian.youdao.com/about/index.html'
  summary:
    - >
      Youdao Dictionary is a NetEase Youdao desktop dictionary and translation
      application first released in 2007.
  timeline:
    - '2007: NetEase Youdao launched Youdao Dictionary.'
    - '2007-12-10: Youdao Desktop Dictionary 1.0 received its first public release.'
    - '2008-07-16: Version 1.2 was released.'
    - >
      Later adoption: The official product overview reported more than 80 million
      effective users.
  usage:
    - >
      Users look up and translate Chinese, English, Japanese, French, and Korean terms;
      access bilingual, English-only, and Chinese dictionaries; capture words from
      browsers; work with offline dictionaries; review lookup history; and synchronize
      vocabulary through the online wordbook.
