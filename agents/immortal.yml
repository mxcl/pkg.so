id: brew:immortal
display-name: immortal
repo: null
docs:
  - https://immortal.run/
config-file-location:
  unix:
    - /usr/local/etc/immortal/*.yml
credentials-file-location: null
history:
  adoption-history:
    - >
      immortal's adoption footprint is modest compared with large init systems, but it
      is packaged for Homebrew and distributed by the project as Linux deb and rpm
      artifacts. That puts it in the category of small supervisor tools chosen when
      systemd, supervisord, or runit is more machinery than a package author wants.
  package-nerd-significance:
    - >
      For package maintainers, immortal is notable because it is a compact, Go-built
      supervisor with a YAML file convention and no hard dependency on one init system.
      It is the sort of utility that fits Homebrew and BSD-style environments where a
      service wrapper should be inspectable and portable.
  project-history:
    - >
      The public GitHub repository was created in 2016 and describes immortal as a
      cross-platform, OS-agnostic supervisor for the *nix family. The project site
      presents it as a practical service wrapper with manual pages, packaging links,
      examples, and a run.yml workflow.
    - >
      The run.yml documentation shows the project's deployment bias: a service can ship
      its own YAML file, and operators can stop, restart, pause, or resume it through
      immortal without logging into the host to hand-run process commands.
  related-projects:
    - >
      supervisord, systemd, runit, daemontools, and s6 occupy the neighboring
      process-supervision space.
    - >
      immortalctl and immortaldir are shipped with immortal as the control and
      directory-management companions.
  sources:
    - https://api.github.com/repos/immortal/immortal/releases
    - https://formulae.brew.sh/formula/immortal
    - https://github.com/immortal/immortal
    - https://immortal.run/
    - https://immortal.run/post/run.yml/
  summary:
    - >
      immortal is a small Go process supervisor for Unix-like systems. It packages a
      familiar daemon-management idea into three commands: immortal for running and
      supervising a service, immortalctl for status and control, and immortaldir for
      managing services from YAML files.
  timeline:
    - '2016: Public GitHub repository created.'
    - '2017: Early 0.13.x and 0.15.x releases published through GitHub releases.'
    - '2024: v0.24.6 published through the GitHub releases feed.'
  usage:
    - >
      The tool is used to run a command detached from a controlling terminal, restart it
      after termination, keep logs, and expose status and control through a Unix socket.
      The companion immortalctl command provides the operator-facing control surface.
related-packages:
  - id: brew:runit
    reason: >
      Choose runit when you want a mature three-stage init system and daemontools-style
      per-service run scripts; choose immortal for portable YAML-defined supervision
      that can sit under an existing Unix init system.
    rel: alternative
    sources:
      - https://immortal.run/post/immortaldir/
      - https://smarden.org/runit/
  - id: brew:supervisor
    reason: >
      Choose Supervisor when you need its established INI configuration, XML-RPC
      interface, process groups, and optional web control; choose immortal for a smaller
      Go-based supervisor centered on YAML files and Unix-socket control.
    rel: alternative
    sources:
      - https://immortal.run/post/run.yml/
      - https://supervisord.org/introduction.html
      - https://supervisord.org/configuration.html
