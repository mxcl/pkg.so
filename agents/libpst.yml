history:
  adoption-history:
    - >
      The project spread through Unix package collections because its job is narrow,
      hard to replace by shell scripting, and repeatedly needed during Outlook
      migrations. The Homebrew formula, together with the input package-manager metadata
      for Debian, Fedora, MacPorts, Nix, Arch, Ubuntu, and openSUSE, shows broad
      packaging across desktop and server ecosystems.
  package-nerd-significance:
    - >
      For package maintainers, libpst is a classic compatibility package: it bridges a
      proprietary desktop data format into plain Unix artifacts, exposes a shared
      library for downstream tools, and carries enough format edge cases that having one
      maintained implementation is better than every mail importer growing its own PST
      parser.
  project-history:
    - >
      The Five-Ten-SG libpst documentation presents readpst as the front-line utility
      for converting Outlook Personal Folders files to mbox, MH-style files, separate
      messages, contacts, LDAP LDIF, vCard, and DII load-file output. The project
      maintained a Mercurial repository and developer documentation for libpst.so.4,
      placing it in the older Unix tradition of small conversion tools with a reusable C
      library beneath them.
    - >
      The package matters historically because PST files were proprietary Outlook
      containers while Unix mail tools generally expected mailbox-like formats. libpst
      became one of the standard escape hatches for migration, discovery, forensics, and
      long-lived personal mail archives.
  related-projects:
    - >
      libpff is a related PST-format project referenced by the libpst documentation for
      PST format documentation. Mail clients and archival tools consume libpst output
      through mbox, MH, LDIF, vCard, and DII rather than through a libpst-specific data
      model.
  sources:
    - https://formulae.brew.sh/formula/libpst
    - https://hg.five-ten-sg.com/libpst/
    - https://www.five-ten-sg.com/libpst/
    - https://www.five-ten-sg.com/libpst/devel/
    - https://www.five-ten-sg.com/libpst/rn01re01.html
    - https://www.freshports.org/mail/libpst
  summary:
    - >
      libpst is a Unix-oriented toolkit and library for extracting Microsoft Outlook PST
      data into mail formats used by open mail clients and archival workflows.
  timeline:
    - >
      2009: The rpm spec history around the Five-Ten-SG-maintained releases records
      rapid 0.6.x work on Python bindings, MIME handling, appointment decoding, and
      Outlook 2003 64-bit PST support.
    - >
      2020: FreeBSD ports updated to libpst 0.6.74, showing continued downstream
      maintenance of the 0.6 series.
    - >
      2021: Five-Ten-SG documentation identified libpst Utilities version 0.6.76 and
      pointed users to the Mercurial repository and generated shared-library
      documentation.
  usage:
    - >
      Package users most often encounter libpst through readpst, which turns PST folders
      into mbox-compatible output or separate message files. The sibling tools lspst,
      pst2ldif, and pst2dii cover inspection, contact export, and litigation-support
      workflows.
