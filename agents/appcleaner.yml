history:
  adoption-history:
    - >
      FreeMacSoft has supplied separate AppCleaner builds for multiple generations of
      macOS, from Snow Leopard-era systems through current releases. The 3.x line
      successively added modern macOS compatibility, localizations, Dark Mode, Apple
      Silicon support, and safer handling of protected or locked files.
  package-nerd-significance:
    - >
      AppCleaner is a long-lived example of the Mac uninstaller utility: it accounts for
      the preference files, caches, and support data that remain when an application
      bundle is merely dragged to the Trash. Its small, single-purpose design makes it a
      familiar complement to cask-based application installation.
  project-history:
    - >
      AppCleaner was developed by FreeMacSoft as a focused graphical uninstaller for
      macOS. Its official release record documents a 2.x line supporting older OS X
      releases and a redesigned 3.x generation introduced in 2015.
  related-projects:
    - >
      AppCleaner complements Finder-based application removal and package-manager
      uninstall workflows by searching for files associated with an application bundle.
  sources:
    - https://freemacsoft.net/appcleaner/
    - https://freemacsoft.net/appcleaner/releasenotes.html
    - source_facts.package-manager
  summary:
    - >
      AppCleaner is a free macOS utility that locates and removes support files
      associated with an unwanted application.
  timeline:
    - '2013: AppCleaner 2.2.1 improved OS X Mavericks support.'
    - '2015-10-01: AppCleaner 3.0 introduced a redesigned interface and enhanced search engine.'
    - '2018-11-18: Version 3.5 added macOS Mojave and Dark Mode support.'
    - '2021-02-02: Version 3.6 added native Apple M1 support.'
    - '2023-07-04: Version 3.6.8 added a new icon and related-file searches for system apps.'
  usage:
    - >
      Users drag an application into AppCleaner or select it from the app list, review
      the related files found across the system, and confirm deletion. SmartDelete can
      detect applications moved to the Trash and offer associated-file cleanup.
