history:
  adoption-history:
    - >
      Vysor broadened from native and Chrome applications into a progressive web
      application using WebUSB, while retaining native clients for platform-specific
      capabilities.
    - >
      The product supports free and paid tiers and targets both general phone
      interaction and developer workflows on physical Android and iOS devices.
  package-nerd-significance:
    - >
      Vysor packages Android Debug Bridge-style device access and video transport into
      an approachable graphical tool. It is useful for developers, demonstrations,
      support sessions, and testing on real hardware, while its WebUSB and
      progressive-web-app transition reflects the migration away from legacy Chrome Apps
      and native browser plugins.
  project-history:
    - >
      Vysor was created by Koushik Dutta as a tool for displaying and controlling a
      phone from a desktop.
    - >
      Version 3 was described by the project as its first major rewrite: the former
      native and Chrome applications were rebuilt around a progressive web application,
      WebUSB, WebAssembly video decoding, and a redesigned interface. Later major
      versions added audio, notification, and iOS mirroring capabilities.
  related-projects:
    - >
      Android Debug Bridge underpins Android device discovery and control workflows used
      by Vysor.
    - The Vysor Share feature provides remote screen and ADB access through shareable links.
  sources:
    - https://app.vysor.io/
    - https://github.com/koush/vysor.io
    - https://github.com/koush/vysor.io/blob/master/README.md
    - https://github.com/koush/vysor.io/wiki
    - https://www.vysor.io/
  summary:
    - >
      Vysor is a desktop and browser-based tool by Koushik Dutta for mirroring and
      controlling Android and iOS devices from a computer.
  timeline:
    - 'Version 3.0: Vysor was rewritten as a WebUSB-capable progressive web application.'
    - 'Version 3.1: Android audio mirroring was added.'
    - 'Version 3.2: Android notification mirroring was added.'
    - 'Version 4.0: iOS mirroring arrived on macOS.'
    - 'Version 4.1: iOS mirroring expanded to Windows and Linux.'
  usage:
    - >
      For Android, users enable USB debugging, connect or pair a device, and operate it
      through the desktop or WebUSB application with keyboard and mouse input. Vysor
      also supports wireless operation, screenshots, recording, file transfer, and
      remote device sharing, with some capabilities reserved for paid tiers.
