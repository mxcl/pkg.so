id: brew:hister
display-name: Hister
repo: null
docs:
  - https://hister.org/docs
  - https://hister.org/docs/configuration
config-file-location:
  linux:
    - ./config.yml
    - $XDG_CONFIG_HOME/hister/config.yml
    - ~/.config/hister/config.yml
    - ~/.histerrc
  macos:
    - ./config.yml
    - $XDG_CONFIG_HOME/hister/config.yml
    - ~/Library/Preferences/hister/config.yml
    - ~/Library/Application Support/hister/config.yml
    - ~/.histerrc
    - ~/.config/hister/config.yml
  windows:
    - .\config.yml
    - '%LOCALAPPDATA%\hister\config.yml'
    - '%XDG_CONFIG_HOME%\hister\config.yml'
    - '%APPDATA%\hister\config.yml'
    - ~\.histerrc
    - ~\.config\hister\config.yml
credentials-file-location:
  linux:
    - ./config.yml
    - $XDG_CONFIG_HOME/hister/config.yml
    - ~/.config/hister/config.yml
    - ~/.histerrc
  macos:
    - ./config.yml
    - $XDG_CONFIG_HOME/hister/config.yml
    - ~/Library/Preferences/hister/config.yml
    - ~/Library/Application Support/hister/config.yml
    - ~/.histerrc
    - ~/.config/hister/config.yml
  windows:
    - .\config.yml
    - '%LOCALAPPDATA%\hister\config.yml'
    - '%XDG_CONFIG_HOME%\hister\config.yml'
    - '%APPDATA%\hister\config.yml'
    - ~\.histerrc
    - ~\.config\hister\config.yml
history:
  adoption-history:
    - >
      Official installation guidance supports binary installation, source builds, Docker
      and Nix. The supplied package record also establishes Homebrew distribution; these
      channels do not establish adoption volume.
  package-nerd-significance:
    - >
      Hister combines a locally controlled search service with browser capture and
      terminal access, making personal information retrieval available through familiar
      self-hosting and command-line workflows.
  project-history:
    - >
      Hister is an AGPL-licensed personal search project whose documented scope includes
      visited pages, imported browser history, local files and crawled websites. The
      reviewed sources do not establish a reliable founding date.
  related-projects:
    - Browser extensions provide capture clients; Docker and Nix provide deployment options.
  sources:
    - https://hister.org/
    - https://hister.org/docs/installing
    - source_facts.package-manager
  summary:
    - Hister builds a private full-text index of content selected by its user.
  timeline:
    - 'Undated: Official documentation describes binary, source, Docker and Nix installation.'
  usage:
    - >
      Run a local or shared server, connect a browser extension or import documents,
      then search through the web interface, terminal, CLI or API.
tags:
  - browsing-history
  - cli
  - full-text-search
  - privacy
  - self-hosted
provenance:
  category-sources:
    - https://hister.org/ — Private full-text search for browsing history and local documents.
  display-name-sources:
    - https://hister.org/ — Official product spelling.
  docs-sources:
    - https://hister.org/docs — Dedicated official documentation.
    - >
      https://hister.org/docs/configuration — High confidence for listed config paths;
      --config and HISTER_CONFIG override selection. XDG paths are conditional; dotfile
      paths are legacy. tui.yaml resides beside the selected config.
    - >
      https://hister.org/docs/configuration — High confidence that the selected YAML can
      contain app.access_token, OAuth secrets and API keys; credentials paths list
      possible config locations, not files necessarily containing credentials.
    - >
      https://hister.org/docs/user-handling — User tokens and password hashes are stored
      separately in the configured database.
  history-sources:
    - https://hister.org/
    - https://hister.org/docs/installing
    - source_facts.package-manager
  repo-sources:
    - source_facts.repo — Already populated; repository determination skipped as instructed.
  tags-sources:
    - https://hister.org/ — Official capabilities and privacy model.
category-confidence: high
category-path:
  - productivity
  - personal-search
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: high
tags-confidence: high
