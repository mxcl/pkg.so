id: brew:cargo-make
display-name: cargo-make
repo: null
docs:
  - https://sagiegurari.github.io/cargo-make
config-file-location:
  unix:
    - Makefile.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      cargo-make is packaged broadly for a Rust CLI tool: the input facts list apk,
      Homebrew, Nix, and Arch packages, and the official docs mention Arch installation
      and binary releases. Crates.io reported 3,466,972 downloads when checked on
      2026-06-30.
  package-nerd-significance:
    - >
      It gives Rust packages a TOML-native automation layer that travels with the
      repository, filling the same cultural space as make, npm scripts, and task runners
      while staying close to Cargo conventions.
  project-history:
    - >
      The crate first appeared on crates.io in June 2017 as version 0.1.0. The official
      documentation presents both cargo-make, invoked as cargo make, and makers, a
      standalone executable with the same features.
  related-projects:
    - >
      Related tools include Cargo, traditional make, language-specific task runners, and
      cargo-make's standalone makers executable.
  sources:
    - https://api.github.com/repos/sagiegurari/cargo-make
    - https://github.com/sagiegurari/cargo-make
    - https://sagiegurari.github.io/cargo-make
    - https://crates.io/api/v1/crates/cargo-make
    - https://formulae.brew.sh/api/formula/cargo-make.json
  summary:
    - >
      cargo-make is a Rust task runner and build tool. Its official documentation
      describes TOML task files that define flows for formatting, building, testing,
      documentation, benches, security validation, and other project automation.
  timeline:
    - '2017: First crates.io release 0.1.0.'
    - '2025: Crates.io latest version 0.37.24.'
    - '2026: Homebrew stable version 0.37.24.'
  usage:
    - >
      Users normally create a Makefile.toml, define tasks under [tasks.*], and run a
      flow such as cargo make my-flow. The tool also supports predefined flows,
      workspace behavior, profiles, environment variables, conditions, plugins, and CI
      examples.
related-packages:
  - id: brew:just
    reason: >
      Just is a command runner centered on concise justfile recipes; choose it for a
      lightweight repository command menu, while cargo-make is better suited to TOML
      dependency graphs and Cargo-workspace-aware flows.
    rel: alternative
    sources:
      - https://sagiegurari.github.io/cargo-make/
      - https://just.systems/man/en/
  - id: brew:go-task
    reason: >
      Task provides cross-platform YAML Taskfiles with dependencies and reusable tasks;
      choose it for language-neutral YAML automation, while cargo-make offers Rust- and
      Cargo-oriented workspace behavior.
    rel: alternative
    sources:
      - https://sagiegurari.github.io/cargo-make/
      - https://taskfile.dev/docs/
