history:
  adoption-history:
    - >
      ksnip developed into a cross-platform Qt application with builds and packaging for
      Linux, Windows, and macOS. Its repository also separates reusable annotation and
      color-selection functionality into the related kImageAnnotator and kColorPicker
      projects.
    - >
      Early development quickly added command-line capture, configurable save behavior,
      cursor capture, printing, and Imgur upload, establishing the capture-edit-share
      workflow retained by later releases.
  package-nerd-significance:
    - >
      ksnip offers a consistent screenshot-and-annotation workflow across desktop
      environments whose native capture APIs and conventions differ. This makes it
      attractive to users maintaining the same toolset across Linux, Windows, and macOS.
    - >
      Its Qt-based implementation and integration with kImageAnnotator make it relevant
      to desktop packagers, especially on Linux where support must span X11, KDE, and
      GNOME-oriented environments.
  project-history:
    - >
      The official repository shows active development by 2016 under Damir Porobic.
      Early commits introduced configuration handling, command-line capture, custom save
      defaults, annotation improvements, and image uploading.
    - >
      The project matured from a screenshot utility into a broader capture and
      annotation application with delayed and regional capture modes, configurable
      annotation tools, and sharing integrations.
  related-projects:
    - kImageAnnotator supplies the annotation component used by ksnip.
    - kColorPicker supplies color-selection functionality.
    - Imgur is an optional upload target documented by the project.
  sources:
    - https://github.com/ksnip/ksnip
    - https://github.com/ksnip/ksnip/commits/master
    - https://github.com/ksnip/ksnip/wiki
    - https://github.com/ksnip/ksnip/wiki/Imgur-Uploader
  summary:
    - >
      ksnip is a Qt-based cross-platform utility for taking screenshots and annotating,
      saving, copying, printing, or uploading the resulting images.
  timeline:
    - >
      2016: Early public development added configuration, command-line capture, saving,
      annotation, and upload features.
    - >
      2017: The official wiki documented the growing capture, editing, printing, and
      Imgur workflows.
  usage:
    - >
      Users capture a full screen, window, region, or other supported target, then
      annotate the image with drawing, text, shapes, numbering, blur, and related tools
      before saving or copying it.
    - >
      Optional Imgur integration supports anonymous uploads or user-mode uploads
      configured with an individually registered client ID and secret. The official
      documentation does not publish a stable credentials-file location.
