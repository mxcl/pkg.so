history:
  adoption-history:
    - >
      JASP is positioned as a free alternative to commercial point-and-click statistics
      packages. Its official materials target students, instructors, and researchers,
      and describe institutional support and worldwide use.
  package-nerd-significance:
    - >
      JASP packages a broad R-backed statistical environment behind a reproducible
      graphical workflow. It is notable to package users because a substantial
      scientific desktop stack, analysis modules, and publishing-oriented output are
      delivered as one cross-platform application.
  project-history:
    - >
      JASP was developed by researchers at the University of Amsterdam as a free,
      open-source statistics package combining frequentist and Bayesian methods. Its
      name honors Bayesian statistician Sir Harold Jeffreys.
    - >
      The project emphasizes an interface familiar to users of graphical statistics
      packages while producing dynamically updated tables and plots. Later releases
      added facilities such as browser-based access and displayed R syntax for analyses.
  related-projects:
    - R provides the statistical ecosystem underlying many JASP analyses.
    - >
      SPSS, SAS, and Minitab are established graphical statistics packages that official
      JASP materials present as points of comparison.
  sources:
    - https://github.com/jasp-stats/jasp-desktop
    - https://jasp-stats.org/2023/03/06/r-syntax-mode-in-jasp-the-first-button/
    - https://jasp-stats.org/jasp-materials/
    - >
      https://jasp-stats.org/wp-content/uploads/2024/08/MacDougall-Users-Guide-for-JASP-v-2.0.pdf
  summary:
    - >
      JASP is a free, open-source, cross-platform graphical statistics package developed
      at the University of Amsterdam. It combines frequentist and Bayesian analyses with
      an interface designed for users who do not want to write code.
  timeline:
    - '2018: Official teaching material documented browser-based JASP access through rollApp.'
    - '2023: JASP 0.17 introduced displayed R syntax for core analyses.'
  usage:
    - >
      Users import or enter data, choose analyses through the graphical interface, and
      export publication-oriented tables and plots. JASP project files can preserve
      data, analysis choices, and results for sharing or later revision.
    - >
      The application is commonly used in statistics teaching and research where an
      accessible graphical workflow and both Bayesian and frequentist methods are
      desired.
