    reason: >
      After MCPM discovers, installs, and runs a server, MCP Tools can inspect its
      protocol surface, call tools directly, or place a debugging proxy in front of it.
    rel: adjacent_workflow
    sources:
      - https://mcpm.sh/
      - https://github.com/f/mcptools#readme
