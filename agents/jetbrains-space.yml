history:
  adoption-history:
    - >
      Space entered early access at KotlinConf in December 2019. JetBrains reported that
      roughly 25,000 organizations joined before the December 2020 general-availability
      release, generating substantial message, repository, issue, and code-review
      activity. JetBrains later stated that overall adoption did not meet its
      expectations.
  package-nerd-significance:
    - >
      Space was notable for trying to place source hosting, code review, CI/CD, package
      registries, automation, project management, and team communication in one
      JetBrains-integrated platform. Its package repositories and Kotlin-based
      automation made it particularly relevant to development-tool and
      artifact-management users.
  project-history:
    - >
      JetBrains introduced Space as an all-in-one environment for software development
      and organizational collaboration. It combined Git hosting, code review,
      automation, CI/CD, package storage, issues, documents, chat, and team
      administration, with cloud and on-premises editions and desktop, web, and mobile
      clients.
    - >
      In May 2024, JetBrains announced that Space would be discontinued and proposed a
      narrower Git-hosting and code-review successor called SpaceCode. In November 2024,
      JetBrains also discontinued the SpaceCode private preview. Space Cloud access was
      disabled from June 1, 2025, while qualifying on-premises installations could
      continue indefinitely under updated terms.
  related-projects:
    - >
      SpaceCode was the proposed successor focused on Git hosting and code review, but
      it never reached general availability.
    - >
      JetBrains directed customers toward YouTrack and TeamCity for project management
      and CI/CD workflows.
    - JetBrains Gateway was used with Space cloud development environments.
  sources:
    - https://blog.jetbrains.com/space/2020/12/09/space-release
    - https://blog.jetbrains.com/space/2024/05/27/the-future-of-space/
    - >
      https://blog.jetbrains.com/space/2024/11/27/discontinuation-of-the-spacecode-private-preview/
    - >
      https://space-support.jetbrains.com/hc/en-us/articles/19158484213138-What-will-happen-to-my-Space-instance-after-May-31-2025
    - >
      https://space-support.jetbrains.com/hc/en-us/articles/360010766959-What-is-JetBrains-Space
  summary:
    - >
      JetBrains Space was an integrated code and team-collaboration platform available
      through cloud and on-premises editions. Space Cloud was discontinued in 2025;
      eligible on-premises installations may continue to operate.
  timeline:
    - 'December 2019: Space early-access program launched at KotlinConf.'
    - >
      December 2020: Space reached general availability after about 25,000 organizations
      joined the EAP.
    - 'May 2024: JetBrains stopped new Space sales and announced a pivot toward SpaceCode.'
    - 'November 2024: JetBrains announced that SpaceCode would not reach general availability.'
    - 'June 1, 2025: Space and SpaceCode cloud organizations were deactivated.'
  usage:
    - >
      Teams used Space for Git repositories, reviews, CI/CD, package hosting, issues,
      documents, chat, automation, and organization management. The desktop application
      offered access to the same collaboration environment outside a browser. Space
      Cloud is no longer usable; maintained on-premises installations are the remaining
      deployment option.
