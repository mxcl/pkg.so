display-name: CHITUBOX
repo: null
docs:
  - https://docs.chitubox.com/en-US
  - https://docs.chitubox.com/en-US/chitubox/latest/quick-start
config-file-location:
  linux:
    - ~/.local/share/chitubox2_0/Conf
  windows:
    - C:\Users\{user-name}\AppData\Local\chitubox2_0\Conf
credentials-file-location: null
history:
  adoption-history:
    - >
      The official documentation presents CHITUBOX as supporting numerous resin-printer
      models and their printer-specific output formats. Its profile-oriented workflow
      makes it useful across a heterogeneous collection of SLA, DLP, and LCD machines.
  package-nerd-significance:
    - >
      CHITUBOX matters to packaging enthusiasts because it is proprietary
      hardware-adjacent software whose usefulness depends on printer profiles and many
      vendor-specific slice formats. Keeping desktop packages working provides a bridge
      between general-purpose computers and resin-printer ecosystems.
  project-history:
    - >
      CHITUBOX developed as a dedicated resin-printing slicer. Its documented formats
      include the legacy .chitubox project format, the newer .ctp project format, and
      .cfg/.cfgx configuration interchange.
    - >
      The product family includes CHITUBOX Basic and Pro, while the same official
      documentation portal also covers ChituManager for managing compatible printers.
  related-projects:
    - CHITUBOX Basic
    - CHITUBOX Pro
    - ChituManager
  sources:
    - 'Official introduction: https://docs.chitubox.com/en-US/chitubox/latest/introduction'
    - >
      Official menu and configuration-path reference:
      https://docs.chitubox.com/en-US/chitubox-basic/latest/ui-and-features/menu
    - 'Official quick start: https://docs.chitubox.com/en-US/chitubox/latest/quick-start'
  summary:
    - >
      CHITUBOX is a desktop slicer for preparing 3D meshes for resin printers. It
      combines printer and material profiles, model placement, support generation,
      slicing, and export into printer-specific formats.
  timeline:
    - 'Legacy era: .chitubox served as the original project-file format.'
    - >
      2023-format era: .ctp was introduced as a richer project format alongside .cfgx
      configuration interchange.
  usage:
    - >
      A typical workflow adds a printer profile, imports an STL, OBJ, or 3MF model,
      orients it, generates or edits supports, slices it, previews the result, and
      exports the printer-compatible file, often to removable media.
