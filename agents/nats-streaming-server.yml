history:
  adoption-history:
    - >
      NATS Streaming Server mattered during the period when NATS users needed persistent
      streams before JetStream became the standard NATS persistence engine. Its adoption
      footprint is now mostly legacy maintenance and migrations: Homebrew listed the
      formula as deprecated on 2026-07-01 and reported 193 installs over the preceding
      365 days.
  package-nerd-significance:
    - >
      This is a package-history marker for a superseded infrastructure component:
      keeping it packaged helps old deployments and migration tests, while the formula
      deprecation and upstream archive tell package maintainers not to treat it as a
      living NATS server family member.
  project-history:
    - >
      The GitHub repository was created on 2016-03-24 and the project reached its final
      published GitHub release, v0.25.6, on 2023-11-17. The repository README says NATS
      Streaming Server is deprecated, with critical bug and security fixes applied until
      June 2023, and directs persistence users to JetStream. GitHub marked the
      repository archived on 2025-12-31.
    - >
      The replacement path is explicit in the NATS documentation: JetStream is built
      into nats-server and the docs state that JetStream completely replaces the legacy
      STAN streaming layer.
  related-projects:
    - >
      NATS, nats-server, JetStream, and the legacy STAN client libraries are the
      important adjacent projects.
  sources:
    - https://api.github.com/repos/nats-io/nats-streaming-server
    - https://docs.nats.io/nats-concepts/jetstream
    - https://formulae.brew.sh/formula/nats-streaming-server
    - https://github.com/nats-io/nats-streaming-server
    - https://github.com/nats-io/nats-streaming-server/releases/tag/v0.25.6
    - https://nats-io.gitbook.io/legacy-nats-docs/nats-streaming-server-aka-stan
  summary:
    - >
      NATS Streaming Server, also called STAN, was the reliable streaming layer that
      predated JetStream in the NATS ecosystem. It added persistence, durable
      subscriptions, acknowledgements, and replay-style messaging on top of core NATS
      for users who wanted lightweight streaming without running a larger broker stack.
  timeline:
    - '2016-03-24: GitHub repository created.'
    - '2023-06: Upstream deprecation window for critical bug and security fixes ended.'
    - '2023-11-17: v0.25.6 released.'
    - '2025-12-31: GitHub repository archived.'
  usage:
    - >
      Package users installed the standalone `nats-streaming-server` binary to run a
      STAN server beside NATS clients. Practical use involved provisioning channels,
      durable subscribers, and client libraries for applications that needed message
      replay or at-least-once delivery. New deployments are expected to use JetStream in
      `nats-server` instead.
related-packages:
  - id: brew:nats-server
    reason: >
      Use NATS Server with its built-in JetStream persistence for supported new
      deployments replacing the deprecated standalone NATS Streaming Server.
    rel: alternative
    sources:
      - https://github.com/nats-io/nats-streaming-server
      - https://docs.nats.io/concepts/jetstream
