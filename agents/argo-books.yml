config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Argo Books is distributed for Windows, macOS, and Linux without requiring an
      account or trial registration. Homebrew provides the macOS application as a cask.
  package-nerd-significance:
    - >
      The application follows a local-first desktop model: each business is stored in a
      portable `.argo` file rather than requiring the books to live in a hosted account.
      This makes backup, migration, and package-managed desktop installation
      comparatively straightforward.
  project-history:
    - >
      Argo Books is a Canadian small-business accounting application developed by Argo
      Robots. Its official materials emphasize locally stored company files and a
      desktop workflow rather than a browser-hosted ledger.
  related-projects:
    - >
      Its optional developer API accepts inbound accounting objects for later review and
      import by a merchant's desktop application.
    - Stripe import is offered as an integration.
  sources:
    - https://argorobots.com/about-us/
    - https://argorobots.com/documentation/
    - https://argorobots.com/documentation/pages/getting-started/quick-start.php
    - source_facts.package-manager
  summary:
    - >
      Argo Books is local-first accounting software for small businesses, covering
      transactions, invoicing, payroll, inventory, analytics, and reporting.
  timeline:
    - The official sources reviewed do not provide a reliable public first-release date.
  usage:
    - >
      A user creates or opens a company file, records revenue and expenses, manages
      customers, suppliers, inventory, invoices, and payroll, and produces reports from
      the desktop application.
    - >
      Company data is stored in a user-chosen `.argo` file. That business-data file is
      portable and can be copied for backup, but the official documentation does not
      identify it as an application configuration file.
