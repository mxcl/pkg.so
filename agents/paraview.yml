id: cask:paraview
display-name: ParaView
repo: https://gitlab.kitware.com/paraview/paraview
docs:
  - https://docs.paraview.org/en/latest
  - https://docs.paraview.org/en/latest/ReferenceManual/index.html
  - https://docs.paraview.org/en/latest/UsersGuide/introduction.html
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/ParaView/ParaView-UserSettings.json
    - ~/.config/ParaView/ParaView-UserSettings.json
    - $XDG_CONFIG_HOME/ParaView/ParaViewServer-UserSettings.json
    - ~/.config/ParaView/ParaViewServer-UserSettings.json
    - $XDG_CONFIG_HOME/ParaView/ParaViewX.Y.ini
    - ~/.config/ParaView/ParaViewX.Y.ini
  windows:
    - '%APPDATA%/ParaView/ParaView-UserSettings.json'
    - '%APPDATA%/ParaView/ParaViewServer-UserSettings.json'
    - '%APPDATA%/ParaView/ParaViewX.Y.ini'
credentials-file-location: null
history:
  adoption-history:
    - >
      Development continued through collaborations involving Kitware, Sandia National
      Laboratories, Los Alamos National Laboratory, the Army Research Laboratory,
      CSimSoft, and other academic, government, and commercial participants.
    - >
      Its open-source, multi-platform distribution and client/server design made it
      useful from desktop analysis through remote and high-performance visualization.
      Python scripting and batch executables also support reproducible and automated
      workflows.
  package-nerd-significance:
    - >
      ParaView is a foundational scientific-visualization package built on VTK and
      designed to scale from local workstations to distributed-memory systems.
    - >
      It matters to package maintainers because its broad reader, rendering, Qt, Python,
      MPI, and HPC feature surface makes builds and binary distribution substantially
      more involved than a typical desktop application.
  project-history:
    - >
      ParaView began in 2000 as a collaboration between Kitware and Los Alamos National
      Laboratory, initially funded through the US Department of Energy ASCI Views
      program. The first public release, ParaView 0.6, appeared in October 2002.
    - >
      Work on ParaView 3.0 began in September 2005 with Kitware, Sandia National
      Laboratories, and CSimSoft. That effort rewrote the user interface and developed a
      quantitative-analysis framework; version 3.0 was released in May 2007.
    - >
      A separately funded Kitware web-visualization effort became ParaView Enterprise
      Edition, contributed to ParaView's client/server architecture, and later served as
      a precursor to ParaViewWeb.
  related-projects:
    - VTK is ParaView's underlying Visualization Toolkit.
    - PVEE contributed to the client/server architecture and preceded ParaViewWeb.
    - >
      Catalyst connects ParaView's analysis and visualization capabilities to
      simulations for in situ processing.
  sources:
    - https://docs.paraview.org/en/latest/UsersGuide/introduction.html
    - https://docs.paraview.org/en/v5.13.1/Tutorials/SelfDirectedTutorial/introduction.html
    - https://www.paraview.org/
  summary:
    - >
      ParaView is a BSD-licensed, open-source, multi-platform application for scientific
      data analysis and visualization. Its architecture supports interactive desktop
      work, client/server operation, Python scripting, batch processing, and large
      distributed datasets.
  timeline:
    - '2000: Kitware and Los Alamos National Laboratory began the ParaView project.'
    - 'October 2002: ParaView 0.6 became the first public release.'
    - 'September 2005: Development of the redesigned ParaView 3.0 began.'
    - 'May 2007: ParaView 3.0 was released.'
    - >
      June 2013: ParaView 4.0 introduced more cohesive GUI controls and improved
      multiblock interaction.
  usage:
    - >
      Users load scientific datasets, construct pipelines of sources and filters,
      configure representations and color maps, and render or export the resulting
      views.
    - >
      The desktop application is complemented by pvpython and pvbatch for scripting and
      automation and by server executables for remote or distributed processing.
    - >
      Persistent user settings are stored beneath the documented ParaView
      user-configuration directory; X.Y in the INI filename denotes the application's
      major and minor version.
