id: brew:btparse
display-name: btparse
repo: https://github.com/ambs/Text-BibTeX
docs:
  - https://metacpan.org/dist/Text-BibTeX
  - https://metacpan.org/dist/Text-BibTeX/view/btparse/doc/btparse.pod
  - https://metacpan.org/pod/Text::BibTeX
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/btop/btop.conf
    - ~/.config/btop/btop.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is strongest in the Perl and bibliography-tooling ecosystem, where CPAN
      distribution history gives Text-BibTeX a long tail. Homebrew's btparse formula
      packages the native library side for users who need the parser outside a pure CPAN
      installation.
    - >
      The package is niche but durable: its public release history spans from 1997 to a
      latest MetaCPAN release in 2025, which is unusually long-lived for a tiny parser
      library.
  package-nerd-significance:
    - >
      btparse is package-nerd archaeology: a C library from the late-1990s Perl/TeX
      toolchain that still ships through modern package managers because bibliographic
      formats are sticky and exact parser behavior matters.
    - >
      It also shows how Homebrew sometimes packages a subcomponent by its native library
      name even when the canonical upstream distribution identity is a language package,
      Text-BibTeX.
  project-history:
    - >
      Text-BibTeX first appeared on CPAN in March 1997 under Greg Ward's PAUSE account.
      The distribution wrapped a C library, btparse, for parsing and processing BibTeX
      data and provided a Perl interface through Text::BibTeX.
    - >
      The btparse manual describes a lexical scanner, LR parser, AST traversal API, name
      splitting, TeX string handling, and BibTeX-compatible string manipulation. Later
      releases moved maintenance to the AMBS PAUSE account and point MetaCPAN users at
      the GitHub repository.
  related-projects:
    - Text::BibTeX is the Perl API built around the btparse parser.
    - BibTeX is the original bibliography format and tool whose data language btparse targets.
    - MetaCPAN and CPAN are the distribution history surfaces for Text-BibTeX releases.
  sources:
    - https://fastapi.metacpan.org/v1/release/Text-BibTeX
    - >
      https://fastapi.metacpan.org/v1/release/_search?q=distribution:Text-BibTeX&size=5&sort=date:asc
    - https://github.com/ambs/Text-BibTeX
    - https://metacpan.org/dist/Text-BibTeX
    - https://metacpan.org/dist/Text-BibTeX/view/btparse/doc/btparse.pod
    - https://metacpan.org/pod/Text::BibTeX
  summary:
    - >
      btparse is the C parsing library bundled with the Text-BibTeX distribution,
      exposed to Homebrew users as BibTeX utility libraries. It matters mostly as
      infrastructure: a small, old, specialized parser that keeps bibliographic tooling
      from having to reimplement BibTeX syntax.
  timeline:
    - '1997: Text-BibTeX 0.1 appears on CPAN under GWARD.'
    - '1999: Text-BibTeX 0.30-era releases include FAQ and btparse/Text::BibTeX documentation.'
    - >
      2025: Text-BibTeX 0.91 is published on MetaCPAN under AMBS with a GitHub
      repository resource.
  usage:
    - >
      btparse is used to parse BibTeX entries into an abstract syntax tree, iterate
      entries and fields, split author-name lists, and apply BibTeX-style string
      transformations. The Homebrew formula exposes the bibparse executable as the
      user-facing command.
    - >
      It is not a credentialed service and does not have an official config file; it is
      library and command-line parsing infrastructure.
related-packages:
  - id: brew:bib-tool
    reason: >
      Choose BibTool when the goal is command-line sorting, merging, field rewriting, or
      validation of BibTeX databases rather than embedding btparse's C parsing API.
    rel: alternative
    sources:
      - https://metacpan.org/dist/Text-BibTeX/view/btparse/doc/btparse.pod
      - https://www.gerd-neugebauer.de/software/TeX/BibTool/en/
  - id: brew:bibtex-tidy
    reason: >
      Choose bibtex-tidy for opinionated formatting and cleanup of BibTeX text,
      especially in automated formatting workflows, rather than low-level C or Perl
      parsing.
    rel: alternative
    sources:
      - https://metacpan.org/dist/Text-BibTeX/view/btparse/doc/btparse.pod
      - https://flamingtempura.github.io/bibtex-tidy/
