id: brew:fourmolu
display-name: Fourmolu
repo: https://github.com/fourmolu/fourmolu
docs:
  - https://fourmolu.github.io/
  - https://fourmolu.github.io/config
config-file-location:
  unix:
    - fourmolu.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Fourmolu is adopted by Haskell projects that want automatic formatting but need
      policy knobs that Ormolu intentionally avoids. The README documents installation
      through GHCup, Cabal, Stack, release notes, editor integration through Haskell
      Language Server, and CI through the recommended `run-fourmolu` GitHub Action.
  package-nerd-significance:
    - >
      Fourmolu is a package-nerd case study in formatter governance. It forked an
      intentionally opinionated tool not to change the parser architecture, but to
      change the social contract around style configuration, while still tracking
      upstream Ormolu.
  project-history:
    - >
      The repository was created in 2020 and describes itself as a fork of Ormolu with
      upstream improvements continually merged. The official README frames the project
      around one key departure from Ormolu: replacing the no-configuration style rule
      with configurable parameters.
    - >
      The changelog shows a pattern of adding Fourmolu-specific configuration while also
      importing upstream Ormolu changes, including parser updates, formatting fixes, and
      support for new GHC language features.
  related-projects:
    - >
      Fourmolu is directly related to Ormolu, GHC, ghc-lib-parser, Cabal, Stack, GHCup,
      Haskell Language Server, Hackage, and the `run-fourmolu` GitHub Action.
  sources:
    - https://api.github.com/repos/fourmolu/fourmolu
    - https://api.github.com/repos/fourmolu/fourmolu/releases
    - https://fourmolu.github.io/
    - https://fourmolu.github.io/changelog/
    - https://fourmolu.github.io/config/
    - https://github.com/fourmolu/fourmolu
    - https://raw.githubusercontent.com/fourmolu/fourmolu/main/README.md
  summary:
    - >
      Fourmolu is a formatter for Haskell source code. It is an Ormolu fork that keeps
      Ormolu's parser-driven, idempotent formatting goals while adding configurable
      style options through CLI flags and `fourmolu.yaml`.
  timeline:
    - '2020: The public `fourmolu/fourmolu` repository was created.'
    - '2023: v0.13.x and v0.14.x releases continued the configurable formatter line.'
    - '2024: v0.16.x added explicit configuration-file selection and upstream parser updates.'
    - '2025: v0.19.0.0 added options such as `haddock-location-signature` and `if-style`.'
    - >
      2026: v0.20.0.0 made Fourmolu installable with GHCup and added more
      import-grouping and record-style configuration.
  usage:
    - >
      Users run `fourmolu Module.hs` to print formatted output, `fourmolu -i` to rewrite
      files, or `fourmolu --mode check` in CI. Configuration can be written in
      `fourmolu.yaml`, discovered from parent directories and the XDG config directory,
      or passed as command-line options.
related-packages:
  - id: brew:ormolu
    reason: >
      Choose Ormolu when you want the upstream formatter's deliberately fixed style;
      choose Fourmolu when the project needs configurable formatting rules.
    rel: alternative
    sources:
      - https://github.com/fourmolu/fourmolu#readme
      - https://github.com/tweag/ormolu#readme
