config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption remained niche but visible in Unix package-manager culture. Homebrew
      carried the macOS formula, and the input package facts also list Nix packaging,
      which fits the tool's small, source-buildable shape.
  package-nerd-significance:
    - >
      getxbook is notable as a compact, portable C package with few dependencies beyond
      libc, sockets, and OpenSSL. For package maintainers, that makes it a classic small
      utility: easy to build, easy to audit, and heavily shaped by the fragility of the
      remote services it automates.
  project-history:
    - >
      Nick White published getxbook as a collection of one-purpose tools: getgbook for
      Google Books, getabook for Amazon, getbnbook for Barnes & Noble, and an optional
      Tcl/Tk graphical frontend. The official page frames the project around reading
      privacy and offline control of page scans, while the download list records public
      source and binary releases in 2013 and 2015.
  related-projects:
    - >
      The official comparison page discusses PySheng, Google Book Downloader, and a
      Google Book Downloader userscript as nearby tools with narrower service coverage
      or heavier dependencies.
  sources:
    - https://formulae.brew.sh/formula/getxbook
    - https://github.com/phracker/getxbook/blob/master/getxbook.1
    - https://njw.name/getxbook/
    - https://njw.name/getxbook/comparison
  summary:
    - >
      getxbook is a small C toolkit for downloading page images from Google Books
      previews, Amazon Look Inside, and Barnes & Noble Book Viewer. Its place in package
      history is tied to offline reading, book privacy, and scriptable capture of
      preview-page services rather than to a large application ecosystem.
  timeline:
    - '2013: Version 1.1 binaries were published for Linux and Windows.'
    - '2015: Version 1.2 source was published.'
    - 'Homebrew era: A macOS formula made the command-line tools installable with brew.'
  usage:
    - >
      Practitioners use getxbook by choosing the site-specific command for a book
      source, letting the tool save page images into a local directory, and resuming
      partial downloads when a run is stopped. The surrounding scripts support
      conversion workflows such as searchable PDF, DjVu, and OCR-derived text.
related-packages:
  - id: brew:tesseract
    reason: >
      Use Tesseract after getxbook because getxbook's official conversion scripts use it
      to extract text and build searchable output from downloaded page images.
    rel: adjacent_workflow
    sources:
      - https://njw.name/getxbook/
      - https://tesseract-ocr.github.io/tessdoc/
      - https://tesseract-ocr.github.io/tessdoc/Command-Line-Usage.html
