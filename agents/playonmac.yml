credentials-file-location: null
history:
  adoption-history:
    - >
      PlayOnMac brought the PlayOnLinux project's Wine-prefix and installation-script
      approach to macOS. Its shared community documentation and source tree reflect the
      close relationship between the Mac and Linux editions.
    - >
      The broader project reported rapid early community interest and later distribution
      through Debian and Ubuntu for its Linux edition. On macOS, PlayOnMac became a
      recognizable free alternative for running supported Windows applications without a
      Windows license or full virtual machine.
  package-nerd-significance:
    - >
      PlayOnMac is notable in package-manager culture as a graphical layer over Wine
      that manages separate prefixes, selectable Wine builds, installation recipes, and
      application shortcuts. This makes packaging more involved than installing a single
      compatibility-runtime binary.
    - >
      Its shared lineage with PlayOnLinux illustrates an older generation of community
      compatibility tooling that predates newer game-focused Wine managers. Maintainers
      must account for downloaded Wine builds and mutable per-user prefixes in addition
      to the application bundle itself.
  project-history:
    - >
      The PlayOnLinux project was started on 7 May 2007 to make Windows games easier to
      install and run through Wine. PlayOnMac applies the same managed-prefix and
      scripted-installer model to macOS.
    - >
      The fourth-generation PlayOnLinux/PlayOnMac codebase is maintained in the shared
      POL-POM-4 repository. The project later began developing the Phoenicis generation
      while continuing to maintain the version 4 applications.
  related-projects:
    - >
      PlayOnLinux is the closely related Linux edition and shares documentation and
      source code with PlayOnMac.
    - >
      Wine provides the Windows compatibility layer used to run applications inside
      managed prefixes.
    - >
      Phoenicis is the project's newer-generation platform, while POL-POM-4 remains the
      source tree for the version 4 applications.
  sources:
    - https://github.com/PlayOnLinux/POL-POM-4
    - https://wiki.playonmac.com/index.php/Main_Page
    - https://www.playonmac.com/en
    - https://www.playonmac.com/en/news-p3.html
    - https://www.playonmac.com/en/news-p31.html
    - https://www.playonmac.com/en/news.html
  summary:
    - >
      PlayOnMac is free macOS software for installing and running supported Windows
      applications and games through Wine. It manages application-specific virtual
      drives, Wine versions, installation scripts, and shortcuts through a graphical
      interface.
  timeline:
    - '2007: The related PlayOnLinux project was founded on 7 May.'
    - >
      2009: PlayOnLinux entered Debian and Ubuntu repositories, broadening adoption of
      the shared project ecosystem.
    - >
      2018: PlayOnLinux and PlayOnMac 4.3.4 were released alongside continued work on
      the Phoenicis generation.
  usage:
    - >
      Users select a supported application or perform a manual installation, after which
      PlayOnMac creates a Wine prefix, installs required components, and exposes a
      launch shortcut.
    - >
      Separate prefixes allow applications to use different Wine releases and settings.
      The configuration window is used for Wine, display, library, debugging, and
      per-prefix customization.
