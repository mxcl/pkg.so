history:
  adoption-history:
    - >
      Official documentation emphasizes local binary use, Docker-image use, and Google
      Cloud Builder use. It also documents Homebrew installation for macOS, which helped
      make the CLI easy to install outside a larger Google Cloud SDK.
  package-nerd-significance:
    - >
      The package matters because it made container image assertions portable: the test
      spec can live beside a Dockerfile, and CI can fail the image artifact rather than
      only failing application unit tests. Its explicit schema versioning and
      single-purpose binary made it attractive to packaging and release pipelines.
  project-history:
    - >
      The project released v0.1.0 in October 2017 and v1.0.0 in March 2018. Its README
      now describes the project as not officially supported by Google and in maintenance
      mode, while still accepting contributions.
  related-projects:
    - >
      The README references Docker, Google Cloud Builder, and container image metadata
      rather than a specific runtime integration.
  sources:
    - https://github.com/GoogleContainerTools/container-structure-test#readme
    - https://github.com/GoogleContainerTools/container-structure-test/releases/tag/v0.1.0
    - https://github.com/GoogleContainerTools/container-structure-test/releases/tag/v1.0.0
    - https://github.com/GoogleContainerTools/container-structure-test/releases/tag/v1.22.1
  summary:
    - >
      Container Structure Tests is a GoogleContainerTools project for validating
      container image contents, command behavior, filesystem state, and metadata. It
      became a common package-manager entry because it is a standalone binary aimed at
      CI checks for built images.
  timeline:
    - '2017: v0.1.0 release published.'
    - '2018: v1.0.0 release published.'
    - >
      2025: v1.22.1 release published while the README described the project as in
      maintenance mode.
  usage:
    - >
      Users provide YAML or JSON test files to `container-structure-test test --image
      ... --config ...`. The test types cover command output, file existence, file
      contents, image metadata, and license checks, which are the concerns image
      publishers usually want to verify before release.
related-packages:
  - id: brew:container-canary
    reason: >
      Choose Container Canary when validation should model a platform's runtime
      requirements with exec, HTTP, and TCP probes rather than focus primarily on an
      image's files, metadata, and command output.
    rel: alternative
    sources:
      - https://github.com/GoogleContainerTools/container-structure-test#readme
      - https://github.com/NVIDIA/container-canary#readme
