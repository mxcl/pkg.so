history:
  adoption-history:
    - >
      ByteDance released UI-TARS Desktop as an open-source desktop interface for its
      UI-TARS computer-use model. Its early releases supported local computer operation,
      while later releases added remote computer and browser operators.
    - >
      The repository subsequently became home to a broader multimodal-agent stack,
      pairing UI-TARS Desktop with Agent TARS and reusable GUI-agent SDK components.
  package-nerd-significance:
    - >
      UI-TARS Desktop packages research-oriented visual computer control as an
      installable desktop application. It interests package enthusiasts because it
      combines a native desktop shell, user-supplied or hosted vision-language models,
      screenshot-based perception, and automated mouse and keyboard actions.
  project-history:
    - >
      UI-TARS Desktop emerged from ByteDance's UI-TARS work on native agents for
      graphical-user-interface interaction. The project provides a desktop application
      that interprets screenshots with a vision-language model and turns predictions
      into computer actions.
    - >
      The redesigned UI-TARS Desktop 0.1.0 was announced in April 2025. Version 0.2.0
      followed in June 2025 with remote computer and remote browser operators. The
      repository later expanded its scope under the TARS multimodal-agent stack.
  related-projects:
    - UI-TARS
    - Agent TARS
    - UI-TARS SDK
    - Seed-1.5-VL
    - Model Context Protocol
  sources:
    - https://github.com/bytedance/UI-TARS-desktop
    - https://github.com/bytedance/UI-TARS-desktop/blob/main/docs/sdk.md
    - https://github.com/bytedance/UI-TARS-desktop/releases
  summary:
    - >
      UI-TARS Desktop is ByteDance's open-source desktop GUI agent. It uses multimodal
      models to understand screenshots and carry out natural-language instructions
      through computer or browser controls.
  timeline:
    - '2025: UI-TARS SDK was introduced.'
    - '2025: Redesigned UI-TARS Desktop 0.1.0 was released.'
    - '2025: UI-TARS Desktop 0.2.0 added remote computer and browser operators.'
    - '2025: The repository broadened into the TARS multimodal-agent stack.'
  usage:
    - >
      Users select a compatible model provider, endpoint, model, and API key, grant the
      operating-system permissions needed for screen capture and accessibility control,
      and then issue natural-language tasks. The agent repeatedly captures the
      interface, asks the model for an action, and operates the mouse or keyboard until
      the task ends.
