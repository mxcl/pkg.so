id: brew:litmusctl
display-name: litmusctl
repo: null
docs:
  - https://docs.litmuschaos.io/
config-file-location:
  unix:
    - ~/.kube/config
credentials-file-location:
  unix:
    - ~/.kube/config
history:
  adoption-history:
    - >
      Litmus itself was accepted into CNCF on June 25, 2020 and moved to Incubating on
      January 11, 2022. That CNCF path gave the surrounding tools, including litmusctl,
      a place in cloud-native SRE workflows rather than only in vendor-specific chaos
      demos.
    - >
      The broader Litmus project advertises adopters and end-user case studies, while
      litmusctl adoption is mostly implicit: users who run LitmusChaos in Kubernetes
      clusters need a supported CLI path for delegate connection and account operations.
  package-nerd-significance:
    - >
      For Homebrew and Nix users, litmusctl is a small example of a cloud-native
      project's operational surface being shipped as a standalone CLI, separate from the
      heavier Kubernetes control plane it manages.
    - >
      It also shows the package-manager problem of distributing fast-moving Kubernetes
      ecosystem CLIs whose usefulness depends on a compatibility matrix rather than only
      on their own version number.
  project-history:
    - >
      LitmusChaos began as Kubernetes-oriented chaos engineering tooling before becoming
      a CNCF project. The separate litmusctl repository was created on February 15,
      2021, after Litmus had already entered CNCF Sandbox, giving operators a Go-based
      CLI for the agent-plane workflows around Litmus ChaosCenter and Kubernetes
      clusters.
    - >
      The litmusctl README documents versioned usage guides spanning early v0.2-era
      compatibility through later v0.12-v0.23 and 1.x releases, which reflects its role
      as a compatibility-sensitive operations tool tied to LitmusChaos control-plane
      versions.
  related-projects:
    - >
      LitmusChaos is the parent chaos engineering platform; ChaosHub provides reusable
      chaos experiments; kubectl and Kubernetes are required context for delegate
      installation and cluster operations.
  sources:
    - https://api.github.com/repos/litmuschaos/litmusctl
    - https://github.com/litmuschaos/litmus
    - https://github.com/litmuschaos/litmusctl
    - https://litmuschaos.io/
    - https://www.cncf.io/projects/litmus/
  summary:
    - >
      litmusctl is the command-line companion to LitmusChaos, a CNCF-hosted cloud-native
      chaos engineering platform. It matters less as a standalone tool than as the
      terminal interface for connecting Chaos Delegates, creating projects, scheduling
      Chaos Scenarios, and managing LitmusChaos accounts.
  timeline:
    - >
      2017: LitmusChaos work began as simple Kubernetes chaos jobs, according to CNCF
      project history.
    - '2020-06-25: Litmus was accepted into CNCF.'
    - '2021-02-15: The litmuschaos/litmusctl GitHub repository was created.'
    - '2022-01-11: Litmus moved to CNCF Incubating.'
    - '2026-05-20: The litmusctl repository listed release 1.26.0.'
  usage:
    - >
      litmusctl is used to connect Chaos Delegates, create projects, schedule Chaos
      Scenarios, disconnect delegates, and manage multiple LitmusChaos accounts. Its
      documented requirements include a kubeconfig at ~/.kube/config and kubectl
      underneath for applying manifests.
    - >
      For package users, the key operational detail is version compatibility: the README
      maps litmusctl releases such as 1.19.0 through 1.26.0 to supported Chaos Center
      version ranges.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      litmusctl requires Kubernetes cluster access and documents using kubectl
      underneath to apply delegate manifests, making the packaged kubectl client a
      direct operational companion.
    rel: adjacent_workflow
    sources:
      - https://github.com/litmuschaos/litmusctl
      - https://kubernetes.io/docs/reference/kubectl/
