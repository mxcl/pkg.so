history:
  adoption-history:
    - >
      RingCentral Phone was deployed as a focused desktop softphone for RingCentral's
      hosted PBX service. RingCentral later shifted customers toward a unified
      application combining messaging, video, and phone functions.
    - >
      The official downloads page retained an RC Phone Desktop maintenance build for
      existing deployments, while RingCentral's migration documentation described the
      standalone Phone application as retiring. The macOS client was also distributed as
      the Homebrew cask `ringcentral-phone`.
  package-nerd-significance:
    - >
      RingCentral Phone is an example of a package whose cask can outlive its strategic
      product role: legacy binaries may remain downloadable for established deployments
      even after the vendor directs new users to a replacement application.
    - >
      Maintainers and administrators should distinguish the legacy RingCentral Phone
      client from the current unified RingCentral app and avoid assuming that similarly
      named artifacts have the same lifecycle.
  project-history:
    - >
      RingCentral Phone was the vendor's standalone softphone client for calling,
      voicemail, SMS, fax, contacts, conferencing, and RingCentral PBX management.
    - >
      RingCentral subsequently consolidated communications features into the unified
      RingCentral app. Its support material directs customers away from the standalone
      Phone experience, although the official download catalog continued to list an RC
      Phone Desktop maintenance build.
  related-projects:
    - RingCentral app
    - RingEX
    - RingCentral Meetings
    - RingCentral Scheduler
  sources:
    - https://assets.ringcentral.com/us/guide/rc_for_desktop_user_guide.pdf
    - https://support.ringcentral.com/ca/en/transition-to-rcv/users1.html
    - https://support.ringcentral.com/download.html
    - source_facts.package-manager.brew-cask
  summary:
    - >
      RingCentral Phone is RingCentral's legacy standalone desktop softphone and
      PBX-management client. RingCentral has been transitioning customers to its unified
      RingCentral application.
  timeline:
    - >
      2018: The official RingCentral Phone desktop user guide documented the standalone
      softphone workflow.
    - >
      2021: RingCentral discontinued support for the RingCentral Phone mobile app as
      part of its transition toward a unified communications client.
    - >
      2024: RingCentral's official downloads catalog listed an RC Phone Desktop 24.3
      maintenance build.
    - >
      2026: Official transition documentation continued to describe the standalone
      RingCentral Phone app as retiring.
  usage:
    - >
      Existing customers use the client with a RingCentral account to place and receive
      calls, manage voicemail and messages, handle contacts, and configure call
      behavior.
    - >
      For new deployments, RingCentral directs users toward the unified RingCentral app.
      The legacy client remains most relevant to organizations maintaining established
      softphone workflows.
