history:
  adoption-history:
    - >
      xScope established a long-lived niche among Mac interface designers and developers
      who need measurements and overlays without modifying the application or page being
      inspected. Its official press page records sustained use by working designers and
      photographers.
  package-nerd-significance:
    - >
      xScope is notable as a durable, Mac-native alternative to browser-only inspection
      tools. Its version history spans the PowerPC-to-Intel transition, Retina displays,
      Apple Silicon, and successive macOS privacy frameworks, making it an unusually
      persistent example of specialist desktop design tooling distributed through
      package managers.
  project-history:
    - >
      xScope is a macOS screen-measurement and inspection suite produced by The
      Iconfactory and ARTIS Software. The earliest surviving official version-history
      entry is xScope 1.0.1 from January 2004.
    - >
      The application grew from rulers, guides, frames, a loupe, and crosshairs into a
      broader design toolkit. Major revisions added automatic dimension detection,
      mobile-device screen templates, iOS mirroring, Retina-aware measurement, browser
      overlays, text and glyph inspection, accessibility-oriented vision simulation, and
      modern color-space support.
  related-projects:
    - >
      xScope Mirror is the companion iOS and Apple Watch application used to preview Mac
      windows and design assets.
    - >
      The product overlaps with browser developer tools, screen rulers, color pickers,
      and UI overlay utilities, but combines those functions in one native macOS
      application.
  sources:
    - 'Official press information: https://xscopeapp.com/press'
    - 'Official product and feature overview: https://xscopeapp.com/'
    - 'Official user guide: https://xscopeapp.com/guide'
    - 'Official version history: https://xscopeapp.com/history'
  summary:
    - >
      xScope is a proprietary macOS toolkit for measuring, inspecting, and testing
      screen graphics and interface layouts. It has been maintained since at least early
      2004 and is aimed primarily at designers and developers who need rulers, guides,
      overlays, magnification, color inspection, and device-screen previews.
  timeline:
    - '2004: Earliest official version-history entry, xScope 1.0.1.'
    - '2006: xScope 1.5 became a Universal Binary for Intel Macs.'
    - '2008: xScope 2.0 added automatic Dimensions measurements and mobile screen templates.'
    - '2012: xScope 3.0 added iOS mirroring and substantially redesigned the tool suite.'
    - '2014: xScope 4.0 added Retina support, browser overlays, and text inspection.'
    - '2020: xScope 4.5 added Apple Silicon and macOS Big Sur compatibility.'
    - '2024: xScope 4.7 modernized screen capture and expanded Display P3 handling.'
  usage:
    - >
      Designers use xScope to measure pixels and angles, place persistent guides and
      frames, inspect colors, compare a live interface with a mockup, and test layouts
      at representative screen sizes.
    - >
      The Mirror companion can show a selected Mac window or design asset on iOS and
      Apple Watch while it is being edited.
