    - https://github.com/maxmind/mmdbinspect
    - https://maxmind.github.io/libmaxminddb/mmdblookup.html
  summary:
    - >
      mmdbinspect is a MaxMind utility for inspecting records in one or more `.mmdb`
      databases. It sits next to MaxMind's lower-level MMDB tooling but is aimed at
      structured inspection: the README describes command-line lookup of IP addresses or
      CIDR networks against one or more databases, including globbed database paths,
      YAML output by default, and JSONL output for streaming workflows.
  usage:
    - >
      The tool reflects the operational needs of GeoIP and related MMDB users. Its
      selection rules handle both host lookups and larger networks, returning contained
      records where possible and falling back to the containing record when no contained
      record exists. Release packaging covers binary tarballs, Debian packages, RPM
      packages, macOS archives, Windows zip files, and Go installation, while Homebrew
      and Nix expose it as a package-manager install. In practice it is used for
      auditing GeoIP2, GeoLite2, and custom MMDB files where users need repeatable,
      machine-readable output rather than the typed diagnostic output of `mmdblookup`.
related-packages:
  - id: brew:mmdbctl
    reason: >
      Use mmdbctl alongside mmdbinspect when inspection leads to a need to import,
      export, diff, validate, or losslessly shrink the underlying MMDB file.
    rel: adjacent_workflow
    sources:
