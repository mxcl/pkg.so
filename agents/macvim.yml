id: brew:macvim
display-name: MacVim
repo: null
docs:
  - https://github.com/macvim-dev/macvim/wiki
  - https://github.com/macvim-dev/macvim#readme
config-file-location:
  macos:
    - ~/.vimrc
    - ~/.vim/vimrc
    - $XDG_CONFIG_HOME/vim/vimrc
    - ~/.gvimrc
credentials-file-location: null
history:
  adoption-history:
    - >
      MacVim has long been the package-manager answer for developers who want Vim as a
      native macOS app rather than only inside Terminal. The official README documents
      both `brew install macvim` and the Homebrew cask `macvim-app`, and the installing
      wiki distinguishes the official binary release from Homebrew-managed updates.
    - >
      The GitHub repository shows a large public history, many releases, thousands of
      stars, hundreds of forks, and a wiki, which reflects MacVim’s role as a durable
      macOS developer tool rather than a one-off GUI port.
  package-nerd-significance:
    - >
      MacVim is significant because it sits at the intersection of Unix editor culture
      and native Mac application packaging. It gives package managers a concrete
      artifact that is both a terminal-oriented Vim build and a macOS app bundle, with
      the classic tension between fast upstream Vim updates and platform-specific GUI
      release quality.
    - >
      For Homebrew users, `macvim` versus `vim` is a meaningful package distinction: the
      upstream Vim package generally tracks core Vim more directly, while MacVim bundles
      a GUI app and Mac-specific behavior. That distinction is explicitly called out in
      the official README.
  project-history:
    - >
      MacVim is maintained as a downstream fork of Vim rather than a thin wrapper. The
      official README says it routinely merges upstream Vim, while the maintainer wiki
      explains that MacVim is an intrusive fork because Vim was not designed as an
      embeddable editor engine and because native macOS GUI behavior requires code,
      runtime, and documentation changes throughout the tree.
    - >
      The project’s current documentation lives on macvim.org and in the GitHub wiki.
      The MacVim help site is generated from the MacVim source repository and presents
      the bundled Vim help files plus MacVim-specific help such as `gui_mac.txt`.
  related-projects:
    - >
      MacVim is directly related to upstream Vim, from which it routinely merges. It is
      also related to Homebrew's `vim` formula, GUI Vim variants, and Neovim in the
      broader editor ecosystem, but its official docs position it specifically as the
      native macOS GUI for Vim.
  sources:
    - https://github.com/macvim-dev/macvim
    - https://github.com/macvim-dev/macvim/wiki/Installing
    - https://github.com/macvim-dev/macvim/wiki/Merging-from-upstream-Vim
    - https://macvim.org/
    - https://macvim.org/docs/
    - https://macvim.org/docs/gui_mac.txt.html
    - https://macvim.org/docs/starting.txt.html
  summary:
    - >
      MacVim is the macOS GUI distribution of Vim. The project describes it as a macOS
      version of Vim with a graphical interface, tight platform integration, menus,
      dialogs, toolbars, scroll bars, full-screen modes, trackpad gestures, Touch Bar
      support, Command-key mappings, system services, and Mac-specific text rendering.
  timeline:
    - >
      Public repository: MacVim Git history includes snapshot tags and release tags in
      the official repository.
    - '2023: The official wiki home page records active maintenance by macvim-dev.'
    - >
      2026: macvim.org documentation reports current generated help for MacVim r183.1
      and Vim 9.2.699.
    - '2026: GitHub repository page lists MacVim r183 as the latest release on Apr 8, 2026.'
  usage:
    - >
      After installation, MacVim can be launched from the Dock or from the terminal with
      `mvim`. Homebrew’s formula installs CLI entry points such as `mvim`, `gvim`,
      `gview`, and diff variants, letting users keep Vim workflows while opening files
      in a native GUI bundle.
    - >
      Configuration follows Vim conventions. The official help lists Unix personal
      initialization files such as `$HOME/.vimrc`, `$HOME/.vim/vimrc`, and
      `$XDG_CONFIG_HOME/vim/vimrc`; MacVim-specific help recommends keeping GUI
      customizations in `~/.gvimrc` rather than editing the system `gvimrc` that is
      overwritten on update.
related-packages:
  - id: brew:vim
    reason: >
      Choose Vim for the upstream editor without MacVim's native macOS application
      layer; MacVim routinely merges Vim while adding substantial Mac-specific GUI and
      runtime changes.
    rel: alternative
    sources:
      - https://github.com/macvim-dev/macvim/wiki/Merging-from-upstream-Vim
      - https://www.vim.org/
  - id: cask:vimr
    reason: >
      VimR is a native macOS GUI built around Neovim, making it the closest alternative
      when users want a Mac application but prefer Neovim's embeddable architecture and
      ecosystem.
    rel: alternative
    sources:
      - https://macvim.org/
      - https://github.com/qvacua/vimr
      - https://neovim.io/
  - id: brew:neovim
    reason: >
      Choose Neovim for a Vim-compatible editor emphasizing Lua configuration, RPC,
      embeddable UIs, Tree-sitter, and built-in LSP; choose MacVim for the traditional
      Vim codebase with native macOS GUI integration.
    rel: alternative
    sources:
      - https://github.com/macvim-dev/macvim/wiki/Merging-from-upstream-Vim
      - https://neovim.io/
