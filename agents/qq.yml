history:
  adoption-history:
    - >
      QQ expanded quickly beyond its original desktop client. Tencent launched Mobile QQ
      in 2000, and peak concurrent QQ accounts exceeded one million in 2001, 100 million
      in 2010, and 200 million in 2014.
    - >
      Tencent reported more than 768 million monthly active QQ accounts on smart devices
      as of March 2020, reflecting its long-running role in China's consumer messaging
      ecosystem.
  package-nerd-significance:
    - >
      QQ is proprietary consumer software rather than a conventional open-source
      package, so package-manager users care mainly about obtaining and updating the
      official macOS client reproducibly.
    - >
      The Homebrew cask wraps Tencent's signed distribution while avoiding unofficial
      download portals, which is particularly useful for software whose upstream release
      URLs and build identifiers change frequently.
  project-history:
    - >
      Tencent launched the first QQ beta, QQ99 build 0210, on February 10, 1999. It
      began as an Internet-pager-style service for presence tracking and real-time
      communication.
    - >
      Tencent subsequently connected QQ to mobile messaging and expanded it into a
      broader social platform supporting text chat, voice and video calls, file
      transfer, mail, and related services.
  related-projects:
    - TIM is Tencent's office-oriented version of QQ.
    - Qzone, QQ Mail, QQ Games, and QQ Music grew around Tencent's wider QQ ecosystem.
    - Weixin/WeChat is Tencent's later messaging and social platform.
  sources:
    - https://www.tencent.com/en-us/articles/80262.html
    - https://www.tencent.com/products/qq/
    - https://www.tencent.com/who-we-are/our-story/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      QQ is Tencent's proprietary instant-messaging and social platform, launched in
      1999 and distributed across desktop and mobile clients.
  timeline:
    - 'February 1999: Tencent launches QQ99 beta build 0210.'
    - 'June 2000: Mobile QQ launches.'
    - 'February 2001: Peak concurrent QQ accounts exceed one million.'
    - 'January 2009: Tencent launches an international version of QQ.'
    - 'March 2010: Peak concurrent QQ accounts exceed 100 million.'
    - 'April 2014: Peak concurrent QQ accounts exceed 200 million.'
    - 'March 2020: QQ has more than 768 million monthly active smart-device accounts.'
  usage:
    - >
      QQ users communicate through text chat, voice and video calls, and point-to-point
      file transfer, with integration into other Tencent services.
    - >
      On macOS, package-manager users install the official QQ application through the qq
      Homebrew cask and then sign in with a QQ account. No official local
      credential-file location is documented.
