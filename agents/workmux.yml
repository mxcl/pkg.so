history:
  adoption-history:
    - >
      workmux supports installation through Homebrew, Cargo, mise, Nix, a shell
      installer, and release binaries. Its documented workflow expanded from
      tmux-oriented worktree management to multiple terminal backends and integrations
      with coding agents.
    - >
      The project added dashboards, agent-status tracking, sandboxes, session mode,
      multi-window layouts, and integrations for tools including Claude Code, Codex,
      OpenCode, Gemini, and Copilot CLI.
  package-nerd-significance:
    - >
      workmux packages a composable Unix workflow—Git worktrees, terminal multiplexers,
      hooks, and developer agents—into one command-line utility. It is especially
      relevant to package enthusiasts running several coding-agent tasks concurrently
      without sharing a checkout.
    - >
      Its support for Homebrew, Cargo, mise, and Nix, together with XDG-aware
      configuration and shell completions, makes it representative of modern
      cross-platform Rust CLI distribution.
  project-history:
    - >
      workmux began as a command-line tool for pairing Git worktrees with tmux windows.
      It subsequently developed into a broader terminal-first workspace for parallel
      coding agents, with lifecycle commands that create, open, merge, and remove
      worktrees and their associated multiplexer state.
    - >
      During 2026 the project rapidly added agent dashboards and status tracking,
      isolated container and Lima sandboxes, session and multi-window modes, additional
      terminal backends, and stronger handling of credentials and repository-controlled
      configuration.
  related-projects:
    - 'Git worktree: The Git facility used to create independent working directories.'
    - 'tmux, WezTerm, Kitty, and Zellij: Terminal environments supported by workmux workflows.'
    - >
      Claude Code, Codex, OpenCode, Gemini, and Copilot CLI: Coding agents with
      documented workmux integrations.
  sources:
    - https://github.com/raine/workmux
    - https://github.com/raine/workmux/blob/main/CHANGELOG.md
    - https://workmux.raine.dev/
  summary:
    - >
      workmux is a terminal-first development-workflow manager that creates a Git
      worktree and corresponding terminal-multiplexer workspace for each task, with
      particular emphasis on parallel coding agents.
  timeline:
    - '2026: Added filesystem-backed state and experimental WezTerm support.'
    - '2026: Added sandbox execution using containers or Lima virtual machines.'
    - '2026: Added session mode, multi-window sessions, dashboards, and agent-status tooling.'
    - >
      2026: Added XDG base-directory support and continued expanding agent and terminal
      integrations.
  usage:
    - >
      Run `workmux init` to create an optional project-level `.workmux.yaml`, then use
      `workmux add` to create a branch worktree and multiplexer workspace. `workmux
      merge` or `workmux remove` handles cleanup.
    - >
      Global defaults live in `~/.config/workmux/config.yaml`; the nearest
      `.workmux.yaml` supplies project or nested-monorepo overrides. Users can configure
      pane layouts, setup hooks, copied or symlinked files, agents, branch naming, and
      sandboxing.
