id: brew:git-fresh
display-name: git-fresh
repo: null
docs:
  - https://github.com/imsky/git-fresh#readme
config-file-location:
  unix:
    - .freshignore
    - ~/.freshignore
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents manual installation on Linux, macOS, and Windows, plus
      package-manager paths through Homebrew, bpkg, and the Arch User Repository.
      Homebrew's formula lists git-fresh in homebrew/core with stable version 1.13.0,
      which reflects modest but real package-manager adoption.
  package-nerd-significance:
    - >
      The package is niche but practical: it bundles a handful of recurring Git
      maintenance commands into one executable and exposes a tiny ignore-file
      convention. Its significance is local-workstation ergonomics rather than broad
      ecosystem influence.
  project-history:
    - >
      The project is distributed as a shell-based Git helper. Its README describes the
      default workflow as updating the local root branch from the remote root, stashing
      changes, and pruning remote branches, with flags for stale-branch deletion,
      rebasing or merging, tag cleanup, workspace wiping, and stash clearing.
  related-projects:
    - >
      git-fresh is related to Git's fetch, pull, prune, stash, rebase, branch deletion,
      and tag cleanup commands.
  sources:
    - https://formulae.brew.sh/formula/git-fresh
    - https://github.com/imsky/git-fresh#readme
  summary:
    - >
      git-fresh is a small Git maintenance command by Ivan Malopinsky for updating a
      repository's root branch, pruning remotes, stashing changes, and removing stale
      local or remote branches.
  timeline:
    - '1.13.0: Homebrew packages git-fresh as the current stable release.'
    - 'README era: Homebrew, bpkg, and AUR installation paths are documented upstream.'
  usage:
    - >
      Practitioners run `git fresh` when returning to a repository and wanting to
      synchronize the root branch, prune remote-tracking branches, and optionally clean
      stale branches or tags. The `.freshignore` file, either in the repository or home
      directory, lets users protect branch names from cleanup.
related-packages: []
