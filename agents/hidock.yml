history:
  adoption-history:
    - >
      HiDock is distributed free of charge from its official site. The official
      materials do not publish broader adoption figures.
  package-nerd-significance:
    - >
      HiDock is representative of the focused, single-purpose macOS utility: it fills a
      gap in native Dock behavior without attempting to replace the Dock or provide a
      larger desktop environment.
  project-history:
    - >
      The maker created HiDock after finding that macOS could not retain the desired
      Dock behavior for both a laptop screen and a large external display. The resulting
      utility applies different Dock settings according to the active display
      configuration.
  related-projects:
    - >
      The official page points to Hand Mirror, another macOS utility associated with the
      same maker.
  sources:
    - 'Official HiDock homepage: https://hidock.app/'
    - 'Official maker portfolio: https://rafa.design/'
  summary:
    - >
      HiDock is a macOS utility from Rafa.Design that applies different Dock settings
      when display configurations change.
  timeline:
    - >
      The official sources describe HiDock’s origin and continuing distribution but do
      not provide a dated release chronology.
  usage:
    - >
      Users define Dock behavior for different setups, such as making it larger and
      always visible on an external display while keeping it smaller and hidden on the
      laptop display. HiDock cannot display the Dock on multiple monitors simultaneously
      because macOS does not expose that capability.
