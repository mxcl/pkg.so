  - https://docs.aws.amazon.com/dcv
  - https://docs.aws.amazon.com/dcv/latest/userguide/client-mac.html
  - https://docs.aws.amazon.com/dcv/latest/userguide/using-connection-file.html
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      AWS made DCV 2017 available for EC2-hosted workloads without an additional DCV
      charge, helping connect the protocol with cloud-hosted visualization and
      high-performance computing.
    - >
      DCV clients now span Windows, Linux, macOS, and browsers. AWS also uses the
      protocol in managed services including Amazon AppStream 2.0 and Amazon WorkSpaces.
  package-nerd-significance:
    - >
      DCV Viewer packages a specialized high-performance remote-display client rather
      than a general-purpose RDP or VNC viewer. It is particularly relevant on
      workstations that access GPU-backed engineering, visualization, and
      high-performance computing workloads.
    - >
      The Homebrew cask makes the native macOS client reproducibly installable, while
      portable `.dcv` connection files can capture per-session client options without
      imposing a fixed global configuration path.
  project-history:
    - >
      Desktop Cloud Visualization originated at NICE as software for remote access to
      high-performance visualization workloads. AWS announced its acquisition of NICE in
      2016 and subsequently integrated DCV more closely with AWS infrastructure.
    - >
      The 2024.0 release renamed NICE DCV to Amazon DCV. The underlying protocol
      continued to provide encrypted pixel streaming from Windows or Linux servers to
      native and browser clients.
  related-projects:
    - Amazon EC2 commonly hosts graphics-intensive applications accessed through DCV.
    - Amazon AppStream 2.0 and Amazon WorkSpaces use the DCV protocol.
    - >
      NICE EnginFrame was another high-performance-computing product maintained by the
      NICE team acquired by AWS.
  sources:
    - >
      https://aws.amazon.com/about-aws/whats-new/2017/12/aws-and-nice-announce-the-general-availability-of-desktop-cloud-visualization-dcv-2017/
    - https://aws.amazon.com/blogs/aws/amazon-web-services-to-acquire-nice/
    - https://aws.amazon.com/blogs/aws/nice-desktop-cloud-visualization-dcv-is-now-amazon-dcv/
    - https://docs.aws.amazon.com/dcv/latest/userguide/doc-history-release-notes.html
  summary:
    - >
      Amazon DCV Viewer is the native client for Amazon DCV, a high-performance
      remote-display protocol used to access desktops and graphics-intensive
      applications running on remote servers.
  timeline:
    - '2016: AWS announced its acquisition of NICE.'
    - '2017: DCV 2017 became generally available, including use on Amazon EC2.'
    - '2024: NICE DCV was renamed Amazon DCV.'
    - '2026: Current releases continued macOS client and server support.'
  usage:
    - >
      Users supply the remote server and session information, authenticate using
      credentials managed by the DCV server, and interact with the streamed desktop
      through the native viewer.
    - >
      The client supports display controls, file transfer, printing, clipboard
      integration, audio, multiple monitors, smart cards, and `.dcv` connection files.
      Connection files are user-created at arbitrary paths, so no fixed
      configuration-file location is documented.
related-packages:
