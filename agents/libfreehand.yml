history:
  adoption-history:
    - >
      libfreehand followed the same adoption path as several LibreOffice-era import
      libraries: it served LibreOffice first, then became a standalone library that
      other distributions and applications could package. Homebrew, Debian, Ubuntu,
      Fedora, Arch, MacPorts, Nix, and openSUSE package records in the input show that
      it is distributed well beyond LibreOffice source builds.
  package-nerd-significance:
    - >
      libfreehand matters to package nerds because it preserves access to an abandoned
      professional graphics format without requiring Adobe software. It is also a tidy
      example of the Document Liberation pattern: small C++ libraries split out so
      distributions can patch, fuzz, and update document importers independently.
  project-history:
    - >
      The Document Foundation wiki describes libfreehand as a parser for FreeHand
      documents from versions 3 through 11. Its source distribution archive records
      0.0.0 tarballs dated 2013-10-31, followed by 0.1.0 on 2014-05-23, 0.1.1 on
      2015-06-11, 0.1.2 on 2017-09-16, and 0.1.3 on 2026-05-26.
    - >
      The library belongs to the Document Liberation Project, which says it was born in
      April 2014 after a family of file-format libraries grew too large for its earlier
      home. The project goal is to help users escape vendor lock-in by converting
      proprietary document formats toward open formats such as ODF.
  related-projects:
    - >
      LibreOffice uses Document Liberation Project libraries for legacy and proprietary
      import filters.
    - >
      Sibling Document Liberation libraries include importers for formats such as
      WordPerfect, Microsoft Works, and older Mac document families.
  sources:
    - https://dev-www.libreoffice.org/src/libfreehand/
    - https://github.com/LibreOffice/libfreehand
    - https://wiki.documentfoundation.org/DLP/Libraries/libfreehand
    - https://www.documentliberation.org/about/
  summary:
    - >
      libfreehand is a Document Liberation Project library for parsing Aldus,
      Macromedia, and Adobe FreeHand files so that office and graphics software can
      import a discontinued proprietary vector format.
  timeline:
    - '2013-10-31: LibreOffice source archive lists libfreehand 0.0.0 tarballs.'
    - >
      2014-04: The Document Liberation Project says it was born within The Document
      Foundation framework.
    - '2014-05-23: LibreOffice source archive lists libfreehand 0.1.0.'
    - '2017-09-16: LibreOffice source archive lists libfreehand 0.1.2.'
    - '2026-05-26: LibreOffice source archive lists libfreehand 0.1.3.'
  usage:
    - >
      The command-line tools fh2raw, fh2svg, and fh2text expose the parser for
      inspection and conversion workflows. In desktop software, the library is most
      important as an import component for opening old FreeHand artwork rather than as
      an end-user command.
