history:
  adoption-history:
    - >
      Slideshower developed as a lightweight macOS utility for users who want
      folder-based slideshows without importing images into Photos. Subsequent
      development broadened the original random full-screen viewer with saved slideshow
      documents, multiple layouts, music, transitions, video playback and export,
      overlays, and live folder monitoring.
  package-nerd-significance:
    - >
      Slideshower fills a narrow macOS utility gap: it works directly with folders and
      offers randomized presentation without requiring a managed photo library. Homebrew
      Cask distribution also makes the otherwise independently distributed application
      scriptable to install.
  project-history:
    - >
      Pawel Trybulski created Slideshower after unsuccessfully searching in October 2023
      for a straightforward way to run a randomized photo slideshow on a Mac without
      using Photos. The official About page, published in December 2023, presents the
      application as a direct response to that missing workflow.
  related-projects:
    - macOS Photos
    - macOS screen-saver and presentation utilities
  sources:
    - https://slideshower.com/
    - https://slideshower.com/about/
    - source_facts.package-manager
  summary:
    - >
      Slideshower for macOS is a folder-oriented slideshow application for randomized,
      full-screen presentation of photos and videos.
  timeline:
    - >
      2023: Pawel Trybulski created Slideshower after encountering the lack of a simple
      folder-based randomized slideshow workflow on macOS.
    - "2023: The creator published the official account of the application's origin."
  usage:
    - >
      Users select a folder, optionally include nested folders, choose sequential or
      shuffled playback, and present images or videos full-screen or in grid layouts.
      Slideshows can include music, transitions, overlays, and saved `.slideshow`
      documents.
