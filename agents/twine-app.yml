id: cask:twine-app
display-name: Twine
repo: null
docs:
  - https://twinery.org/cookbook
  - https://twinery.org/reference/en
config-file-location:
  macos:
    - ~/Library/Application Support/Twine/prefs.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Twine has been used to create thousands of works, according to its official site.
      Its low-code passage editor makes it approachable to writers, while variables,
      conditional logic, CSS, and JavaScript support more elaborate interactive-fiction
      projects.
  package-nerd-significance:
    - >
      Twine is both a browser application and a packaged Electron desktop application.
      The desktop package keeps preferences and its story library locally, while
      published stories are portable HTML files; package users therefore need to back up
      authoring data separately from the application bundle.
  project-history:
    - >
      Twine was created by Chris Klimas and is now supported by an open-source
      contributor community and infrastructure from the Interactive Fiction Technology
      Foundation. The current Twine application is a browser and Electron port, with
      story formats maintained as related but separate projects.
    - >
      The desktop architecture switched from NW.js to Electron in Twine 2.3.0. Twine
      separates the editor from story formats such as Chapbook, Harlowe, Snowman, and
      SugarCube, allowing the same authoring environment to target different
      interactive-fiction runtimes.
  related-projects:
    - >
      Chapbook, Harlowe, Snowman, and SugarCube are Twine story formats with their own
      documentation and source repositories.
    - >
      The Twine specification repositories document the interchange formats used by the
      application.
  sources:
    - https://github.com/klembot/twinejs
    - https://twinery.org/
    - https://twinery.org/reference/en/
    - https://twinery.org/reference/en/release-notes/2-3.html
  summary:
    - >
      Twine is an open-source authoring environment for interactive, nonlinear stories.
      It provides a visual story editor, runs on the web or desktop, and publishes
      stories as HTML.
  timeline:
    - "Twine 1.x: The original application established Twine's passage-based authoring model."
    - >
      2019: Twine 2.3.0 moved the desktop application to Electron and began storing
      story-directory files as publishable stories.
    - >
      2020s: Twine continues as an open-source browser and desktop application with
      independently maintained story formats.
  usage:
    - >
      Authors create passages, connect them with links, select a story format, test the
      story in a browser, and publish it as HTML. Libraries can be archived for backup
      or migration, and individual stories can also be exported in Twee format.
    - >
      The desktop application's preferences file is `prefs.json` under
      `~/Library/Application Support/Twine`; the same directory is the default macOS
      story-library location. No service account or credentials file is required for
      local authoring.
