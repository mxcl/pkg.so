history:
  adoption-history:
    - >
      Its adoption history is mostly in proprietary .NET software workflows rather than
      open-source package culture. The product's long release notes and licensing
      features point to use by vendors who need trial versions, hardware-locked
      licenses, and protection against casual decompilation.
  package-nerd-significance:
    - >
      For package catalogs, .NET Reactor is notable because it is a commercial GUI/CLI
      security tool packaged as a cask rather than a source-built formula. It represents
      the closed-source side of the .NET tooling ecosystem that package managers still
      need to index for developer workstations.
  project-history:
    - >
      The official release history shows .NET Reactor releases dating back to February
      2006, placing it in the long-running generation of commercial .NET obfuscators
      that grew alongside the early .NET Framework ecosystem. Later releases continued
      to track new .NET versions, Visual Studio integration, and platform support.
  related-projects:
    - IntelliLock
    - .NET
    - Visual Studio
  sources:
    - https://www.eziriz.com/dotnet_reactor.htm
    - https://www.eziriz.com/reactor_history.htm
    - https://formulae.brew.sh/cask/dotnet-reactor
  summary:
    - >
      .NET Reactor is Eziriz's commercial .NET code protection, obfuscation, and
      licensing tool. It is distributed as a desktop application plus command-line
      tooling for applying protection to compiled .NET assemblies.
  timeline:
    - '2006: The official history lists .NET Reactor 2.0.0.2.'
    - '2025: The official history lists .NET Reactor 7.5.0.0 with .NET 10 protection support.'
    - '2026: The Homebrew cask metadata packages the macOS x64 signed build at version 7.5.0.0.'
  usage:
    - >
      Developers run .NET Reactor after building an application or library to apply
      obfuscation, anti-tamper features, code protection, and optional license
      enforcement. The Homebrew cask exposes both the graphical app and console
      executable on macOS.
