history:
  adoption-history:
    - >
      Beads adoption is unusually fast for a young developer tool. The official
      repository metadata showed 24,977 stars and 1,668 forks on 2026-06-30, and the
      README documents installation through Homebrew, npm, an install script, Go source
      builds, Windows support, Arch AUR, and related MCP/PyPI packaging.
    - >
      The package-manager facts in this batch list Homebrew, Debian, Ubuntu, MacPorts,
      Nix, and winget entries. That distribution spread matters because Beads is meant
      to be installed once and used across projects, including by automated agents that
      need a predictable CLI.
  package-nerd-significance:
    - >
      Beads is package-nerd significant because it packages a new workflow assumption:
      issue tracking as local, mergeable, agent-readable state in the repository
      neighborhood. It sits at the intersection of CLI issue trackers, local-first
      databases, Dolt, MCP, and coding-agent coordination.
    - >
      It is also a good example of a modern package needing many ecosystem edges at
      once: Homebrew formulae for shell users, npm for Node workflows, PyPI/MCP for
      agent integrations, winget for Windows, and docs that teach agents as first-class
      users.
  project-history:
    - >
      The public GitHub repository for gastownhall/beads was created on 2025-10-12. Its
      README presents the tool as 'bd - Beads' and describes a cross-platform CLI for
      macOS, Linux, Windows, and FreeBSD, with Dolt as the version-controlled SQL
      storage backend.
    - >
      The project moved quickly from pre-1.0 tags in October 2025 to 1.0.x releases in
      April and May 2026, followed by a 1.1.0 release candidate in June 2026. The README
      documents agent setup commands for Codex, Claude Code, Factory.ai Droid, Cursor,
      Copilot, and other environments, showing that agent integration became part of the
      main product surface rather than an add-on.
  related-projects:
    - Dolt is the storage backend named by the README.
    - >
      Beads Viewer is a companion terminal UI and graph-analysis sidecar for Beads issue
      exports.
    - >
      MCP, Codex, Claude Code, Factory.ai Droid, Cursor, and Copilot appear in the
      official setup and integration docs as agent/editor surfaces.
  sources:
    - https://api.github.com/repos/gastownhall/beads
    - https://api.github.com/repos/gastownhall/beads/releases
    - https://raw.githubusercontent.com/gastownhall/beads/main/README.md
    - source_facts.package-manager
  summary:
    - >
      Beads is a distributed graph issue tracker for AI-assisted software work. Its core
      idea is to give coding agents persistent, structured project memory using a
      dependency-aware issue graph stored in Dolt rather than ad hoc markdown plans.
  timeline:
    - '2025-10-12: gastownhall/beads repository is created.'
    - '2025-10-14: v0.9.1 is published as an early public release.'
    - '2026-04-15: v1.0.1 and v1.0.2 are published.'
    - '2026-05-09: v1.0.4 is published.'
    - '2026-06-26: v1.1.0-rc.1 is published.'
  usage:
    - >
      Typical use starts with 'bd init' inside a project. Core commands include 'bd
      ready' for unblocked work, 'bd create' for new tasks, 'bd update --claim' for
      atomic claiming, 'bd dep add' for dependency links, 'bd show' for details, 'bd
      prime' for agent context, and 'bd remember' for persistent project memory.
    - >
      The README documents two storage modes: embedded Dolt by default for a
      single-writer local database, and server mode for an external dolt sql-server when
      concurrent writers matter. It also describes git-free and stealth modes for
      non-git workspaces, CI, monorepos, evaluations, and personal planning.
related-packages:
  - id: brew:beads_viewer
    reason: >
      Add Beads Viewer when Beads projects need an interactive terminal interface or
      deterministic graph-based triage, planning, dependency, and health analysis.
    rel: adjacent_workflow
    sources:
      - https://beads.gascity.com/community-tools
      - https://github.com/Dicklesworthstone/beads_viewer#readme
