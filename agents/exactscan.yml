config-file-location:
  macos:
    - ~/Library/Preferences/de.exactcode.ExactScan Pro.plist
    - ~/Library/Preferences/de.exactcode.ExactScan.plist
    - ~/Library/Preferences/com.exactcode.*
credentials-file-location: null
history:
  adoption-history:
    - >
      ExactScan is positioned by ExactCODE as a paperless-office application with
      built-in support for more than 500 professional scanners. Its profile-driven
      workflows address both individual scanning and dedicated scan workstations.
  package-nerd-significance:
    - >
      ExactScan is notable to Mac package users because it packages proprietary scanner
      support and document-processing workflows that commonly otherwise require
      manufacturer utilities. Its preference files can also be copied when migrating
      profiles between Macs.
  project-history:
    - >
      ExactCODE developed ExactScan as part of its longer-running image-processing work,
      alongside PDF and OCR products including OCRKit.
  related-projects:
    - >
      ExactCODE identifies OCRKit and Re/compress as related document-processing
      products. ExactScan can also operate with vendor scanner drivers or its own
      built-in drivers.
  sources:
    - 'Official ExactCODE company page: https://exactcode.com/'
    - 'Official ExactScan FAQ: https://www.exactscan.com/faq.html'
    - 'Official ExactScan help: https://exactscan.com/help/'
  summary:
    - >
      ExactScan is ExactCODE's commercial document-scanning application for macOS, with
      later Linux and Windows variants. It combines scanner drivers, scan profiles,
      image correction, filing, PDF generation, and optional OCR-oriented workflows.
  timeline:
    - "ExactCODE era: ExactScan emerged from the company's image-processing and PDF work."
    - >
      Current product era: ExactCODE advertises built-in support for more than 500
      professional scanners.
  usage:
    - >
      Users create reusable profiles covering filing, source, color, resolution, image
      processing, OCR, and imprinter settings. Profiles can drive scanner buttons,
      automatic document-feeder workflows, multi-page output, searchable PDFs, and
      automatic naming or filing.
