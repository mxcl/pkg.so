history:
  adoption-history:
    - >
      FOX's adoption story is tied to portable desktop software and bundled sample
      applications. The official download page ships source archives for Linux/Unix and
      Windows, documentation, and application sources such as Adie, Shutterbug, and the
      FOX Calculator inside the FOX distribution.
    - >
      For package managers, FOX is the kind of dependency that appears both as a GUI
      library and as a source of small demonstration utilities, which is why packages
      often expose executables such as adie, calculator, reswrap, and fox-config.
  package-nerd-significance:
    - >
      FOX is package-nerd significant as a long-lived, self-contained GUI toolkit with
      its own build artifacts, helper tools, and sample applications. It represents the
      older Unix packaging problem of shipping a portable C++ GUI library that also
      contains useful end-user programs.
    - >
      It is also interesting because official distribution is archive-based: the source
      of truth is the project's download directory and documentation site, not an
      official GitHub or GitLab project page.
  project-history:
    - >
      FOX was started by Jeroen van der Zijp and is distributed as source archives from
      the official fox-toolkit.org download area rather than through an official public
      source-control repository. The site copyright range begins in 1997, and the
      downloads page lists stable, old-stable, and development source releases.
    - >
      The project's design notes frame FOX as a source-available LGPL toolkit written
      from the ground up in C++, avoiding wrappers over native GUI libraries and
      concentrating platform dependencies in selected base classes.
  related-projects:
    - >
      Adie, Shutterbug, and FOX Calculator are distributed with or from the FOX
      distribution and serve as example applications.
    - >
      FOX is related by problem domain to other cross-platform GUI toolkits, but the
      official goals page distinguishes it from wrappers over native GUI libraries.
  sources:
    - http://fox-toolkit.org/
    - http://fox-toolkit.org/download.html
    - http://fox-toolkit.org/goals.html
    - http://fox-toolkit.org/news.html
    - http://fox-toolkit.org/win32.html
  summary:
    - >
      FOX Toolkit is a C++ cross-platform GUI toolkit. Its official site presents it as
      a way to build applications that can be recompiled across operating systems while
      keeping GUI behavior under the toolkit's control.
  timeline:
    - '1997: Official site copyright range begins for FOX Toolkit.'
    - '1.4.35: Old stable source archive is listed on the official download page.'
    - '1.6.59: Stable source archive is listed on the official download page.'
    - '1.7.90: Development source archive and news entry are listed on the official site.'
  usage:
    - >
      Developers use FOX as a C++ GUI library, compiling against its headers and
      libraries. The Win32 documentation describes linking FOX applications with Visual
      C++ and using a normal main function via the mainCRTStartup entry point.
    - >
      The official goals page emphasizes platform-independent public interfaces,
      avoiding accidental inclusion of platform-specific GUI headers, and relying only
      on low-level operating-system facilities.
