    - ~/.mcfly/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The supplied package-manager facts list McFly across Homebrew, MacPorts, Alpine,
      Arch, Nix, Scoop, WinGet, and openSUSE/Zypper, showing broad packaging across
      Unix-like and Windows-adjacent ecosystems.
    - >
      The README documents Homebrew, MacPorts, WinGet, install-script, manual release,
      source, and Zinit installation paths. It also includes release-process notes for
      Homebrew, reflecting long-running package-manager maintenance rather than a
      one-off binary upload.
  package-nerd-significance:
    - >
      McFly is package-nerd interesting because it modernized an old shell muscle-memory
      path without requiring a new shell or large framework. It is a Rust CLI with many
      package-manager entries, a small executable surface, and visible cross-shell
      integration details.
    - >
      Its use of SQLite for enriched history also makes it part of the broader trend of
      CLIs turning plain-text shell workflows into indexed local databases while
      preserving escape hatches back to ordinary files.
  project-history:
    - >
      The official GitHub repository was created in July 2018, and the first listed
      GitHub release, v0.1.0, was published on 2018-10-12. It is written in Rust and
      integrates with Bash, Zsh, Fish, and PowerShell rather than replacing the shell
      itself.
    - >
      McFly's README emphasizes reversibility: it augments shell history in a SQLite
      database while maintaining the normal shell history file, so users can stop using
      McFly without losing the conventional history path. That design choice helped it
      fit into conservative shell setups.
  related-projects:
    - >
      Related shell-history tools include fzf-based Ctrl-R bindings, atuin, hstr, and
      shell-native history search. McFly's official positioning is specifically an
      intelligent replacement for Ctrl-R rather than a full shell environment.
  sources:
    - https://github.com/cantino/mcfly
    - https://github.com/cantino/mcfly#readme
    - https://github.com/cantino/mcfly/releases
    - source_facts.package-manager
  summary:
    - >
      McFly is a shell-history replacement for reverse search, designed to make Ctrl-R
      results context-aware instead of purely chronological. The project describes
      itself as an upgraded Ctrl-R that considers the current directory, command exit
      status, timestamps, and prior shell history.
  timeline:
    - '2018-07: GitHub repository created.'
    - '2018-10: v0.1.0 published on GitHub releases.'
    - '2023-2025: Continued 0.8 and 0.9 release series.'
    - '2025-12: v0.9.4 published on GitHub releases.'
  usage:
    - >
      Typical use is rebinding Ctrl-R in a shell startup file so McFly opens a
      full-screen history search UI. The tool stores enhanced history metadata in an
      OS-specific SQLite database and can dump history to stdout for scripting or
      inspection.
    - >
      McFly's settings are mostly environment-variable based, with color settings stored
      in a config.toml under the McFly data directory. The README documents the macOS
      application-support path, Linux XDG data path, and a legacy ~/.mcfly fallback.
related-packages:
  - id: brew:atuin
    reason: >
      Choose Atuin when you want encrypted cross-machine synchronization, self-hosting,
      and a richer SQLite history database; McFly stays focused on local context-aware
      Ctrl-R search while preserving normal shell history.
    rel: alternative
    sources:
      - https://github.com/cantino/mcfly#readme
      - https://docs.atuin.sh/latest/
  - id: brew:hstr
    reason: >
      Choose HSTR for a lightweight Bash/Zsh history TUI with command bookmarking and
      history cleanup; McFly supports more shells and ranks results with execution
      context.
    rel: alternative
    sources:
      - https://github.com/cantino/mcfly#readme
      - https://github.com/dvorka/hstr#readme
  - id: brew:fzf
    reason: >
      Choose fzf when you need a general-purpose fuzzy finder that can search command
      history as one of many list types; McFly is specialized for history and records
      additional command context.
    rel: alternative
    sources:
      - https://github.com/cantino/mcfly#readme
      - https://junegunn.github.io/fzf/
