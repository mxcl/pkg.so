history:
  adoption-history:
    - >
      The project sustained a player community through free accounts, ongoing releases,
      events, and volunteer development. An official 2018 press release reported
      thousands of players active each day, and the official site states that the
      service has no subscriptions, advertisements, donations, or other revenue.
      Homebrew Cask provides an automated macOS launcher installation path.
  package-nerd-significance:
    - >
      The cask packages the launcher for a volunteer-operated revival of a discontinued
      online game, an unusual example of package management preserving convenient access
      to community-maintained gaming culture.
  project-history:
    - >
      Disney launched Toontown Online in 2003 and announced its closure in August 2013.
      On September 19, 2013, the day the original service closed, the Toontown Rewritten
      team announced that it had been working to keep the game alive. Alpha testing
      began on October 28, 2013 while the team reverse-engineered and rebuilt the
      original server architecture, and the project subsequently continued with new
      features, events, and original content.
  related-projects:
    - >
      Toontown Rewritten revives Disney's Toontown Online and is operated independently
      of Disney Interactive.
    - >
      The official Toontown Rewritten GitHub organization publishes API documentation
      and a release archive, but not the game or launcher source repository.
  sources:
    - 'Official About Toontown FAQ: https://www.toontownrewritten.com/help/faq/about-toontown'
    - 'Official GitHub organization: https://github.com/toontownrewritten'
    - 'Official help center: https://www.toontownrewritten.com/help/'
    - 'Official release notes: https://www.toontownrewritten.com/news/release-notes/all'
    - source_facts.description; source_facts.package-manager
  summary:
    - Toontown Rewritten is a free, fan-run revival of Disney's Toontown Online MMORPG.
  timeline:
    - '2003: Disney launched Toontown Online.'
    - "August 2013: Disney announced Toontown Online's closure."
    - 'September 19, 2013: Toontown Online closed and Toontown Rewritten was announced.'
    - 'October 28, 2013: Toontown Rewritten began alpha testing.'
    - >
      2014: The Mac client entered the alpha release series and broader beta development
      continued.
    - >
      Later years: The volunteer team continued operating the game and publishing new
      content and client updates.
  usage:
    - >
      Players create a free account, install the official launcher, and enter a
      cooperative online cartoon world with tasks, minigames, social play, and battles
      against the Cogs.
