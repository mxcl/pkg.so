history:
  adoption-history:
    - >
      ACME is packaged as a small retro-computing developer tool rather than a broad
      application framework. The input package-manager facts list Homebrew, Debian, Nix,
      Arch, and Ubuntu packages, matching its use by developers who want a Unix-packaged
      assembler for 6502-family targets.
  package-nerd-significance:
    - >
      ACME matters to package nerds because it is a classic niche CLI: small,
      GPL-licensed, useful to retro-computing and demoscene workflows, and distributed
      through Unix package managers for repeatable builds of old-machine software.
  project-history:
    - >
      The official SourceForge project presents ACME as a GPL-licensed cross assembler
      for multiple environments. Its current SourceForge code tree exposes source, docs,
      examples, testing material, and ACME_Lib, with the trunk shown at revision 454
      during this batch.
    - >
      The in-tree documentation records detailed assembler behavior, including pseudo
      opcodes, address modes, CPU-specific behavior, and 65816 support. The source also
      carries compatibility dialects for historical ACME versions from 0.85 through
      0.98, showing that the tool has had a long-running version lineage.
  related-projects:
    - >
      Related projects include other 6502-family assemblers, Commodore and 65816
      development toolchains, and retro-computing build systems that package cross
      assemblers for reproducible command-line builds.
  sources:
    - >
      Official SourceForge project page, code browser, in-tree docs, source file, and
      source_facts.package-manager.
  summary:
    - >
      ACME Cross-Assembler is a command-line cross assembler for 6502-family
      development. The official SourceForge project describes it as a multi-platform
      assembler for 6502, 6510, 65c02, and 65816 CPUs.
  timeline:
    - '2020-07-10: SourceForge file listing shows acme0.97mac.zip released.'
    - 'Current: SourceForge code browser shows trunk at revision 454.'
    - 'Current: Source code lists compatibility dialects from 0.85 through 0.98.'
  usage:
    - >
      Package users invoke the acme executable to assemble source for 6502, 6510, 65c02,
      and 65816 targets. The official documentation covers pseudo opcodes for emitting
      values, selecting CPU behavior, handling 65816 register lengths, and controlling
      assembler dialect compatibility.
related-packages:
