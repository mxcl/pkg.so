    reason: >
      Choose cc65 when a 6502 project needs a complete cross-development suite with a C
      compiler, macro assembler, linker, librarian, and target runtime libraries rather
      than a standalone assembler.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/acme-crossass/
      - https://cc65.github.io/
  - id: brew:xa
    reason: >
      Choose xa for a Unix-oriented 6502/65C02 cross assembler when its segment model
      and o65 relocatable-object tools better match an existing retro-computing
      codebase.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/acme-crossass/
      - https://www.floodgap.com/retrotech/xa/
