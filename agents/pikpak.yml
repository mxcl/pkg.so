history:
  adoption-history:
    - >
      PikPak expanded from its cloud-drive service into a multi-client platform with
      web, desktop, mobile, television, and browser-extension access. Its current Help
      Center also documents WebDAV, a command-line client, personal access tokens, and
      MCP connections for external applications.
  package-nerd-significance:
    - >
      PikPak combines cloud storage with server-side link and torrent retrieval, media
      streaming, WebDAV, CLI access, and automation integrations. The cask provides the
      native desktop client while the user's durable content and account state reside
      primarily in the cloud service.
  project-history:
    - >
      PikCloud states in its first transparency report that PikPak commenced operations
      in July 2021. The service developed as a private cloud drive centered on remote
      saving, large storage plans, cross-device access, and online video playback.
    - >
      By 2025 and 2026, official documentation described a wider integration surface
      including Connected Apps, WebDAV, personal access tokens, PikPak CLI, and an MCP
      endpoint for AI tools.
  related-projects:
    - >
      The official service includes PikPak Web, mobile and television applications, a
      browser extension, PikPak CLI, WebDAV access, and PikPak MCP.
  sources:
    - https://mypikpak.com/en-US
    - https://mypikpak.com/en-US/desktop-app
    - https://mypikpak.com/en-US/help-center
    - https://static.mypikpak.com/transparent-reporting/PikPak%20Transparency%20Report.pdf
  summary:
    - >
      PikPak is a cloud-storage and remote-download service with native clients, file
      sharing, media playback, and external integration options.
  timeline:
    - '2021: PikPak commenced operations in July.'
    - '2025: PikPak issued its first transparency report, covering the year ending June 2025.'
    - >
      2026: The official Help Center documents CLI, MCP, personal-access-token, and
      WebDAV integrations.
  usage:
    - >
      Users sign in to store and organize files, save supported links or torrent tasks
      to the cloud, download files to devices, stream saved media, share files, and
      connect external tools through supported integrations.
