history:
  adoption-history:
    - >
      FIPLAB reported millions of users across Memory Clean 1 and 2 when it directed
      that installed base toward its direct-distribution releases in 2019. Memory Clean
      3 became the succeeding paid generation and was later renamed Memory Meter 3.
  package-nerd-significance:
    - >
      The application represents the long-running macOS category of compact menu-bar
      resource monitors. Its transition from the Mac App Store to direct distribution
      also illustrates how cask packaging can keep independently distributed desktop
      utilities convenient to install.
  project-history:
    - >
      Memory Meter 3 is the current name of FIPLAB's Memory Clean 3, a macOS menu-bar
      utility for viewing memory use and pressure and releasing inactive memory.
    - >
      In 2019 FIPLAB made Memory Clean 3 exclusive to direct distribution, explaining
      that this allowed faster updates and features unavailable under Mac App Store
      sandboxing. In February 2026 the company renamed it Memory Meter 3 and changed its
      direct-update delivery.
  related-projects:
    - >
      Memory Meter 3 succeeds Memory Clean and Memory Clean 2. Other FIPLAB system
      utilities include Battery Health 3, Disk Doctor Pro, and Disk Aid.
  sources:
    - https://blog.fiplab.com/
    - https://blog.fiplab.com/future-of-memory-clean
    - https://support.fiplab.com/memory-meter-3/getting-started
    - https://support.fiplab.com/memory-meter-3/menu-bar-icon
  summary:
    - >
      Memory Meter 3 is FIPLAB's macOS menu-bar memory monitor and cleaning utility,
      previously named Memory Clean 3.
  timeline:
    - >
      2019: FIPLAB moved Memory Clean 3 to direct distribution and encouraged users of
      earlier Memory Clean releases to migrate.
    - '2026: Memory Clean 3 was renamed Memory Meter 3.'
  usage:
    - >
      Users keep the application in the menu bar to view used or free memory, memory
      pressure, and memory-heavy applications, and to trigger manual or automatic memory
      cleaning.
