config-file-location:
  unix:
    - Scarb.toml
    - cairo_project.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Caracal's public adoption is narrower than general-purpose static analyzers
      because it targets the Starknet/Cairo ecosystem. Its first GitHub release, v0.1.0,
      appeared in July 2023, followed by 0.2.x releases for Cairo compiler 2.x support.
    - >
      The Homebrew formula packages the caracal CLI, making it convenient for auditors
      and developers on macOS to run the same detector list documented in the upstream
      README.
  package-nerd-significance:
    - >
      Caracal is package-nerd interesting as a young blockchain-security analyzer where
      the package boundary includes a Rust CLI, Cairo compiler dependencies, SIERRA
      compatibility, and smart-contract audit workflows.
    - >
      It also shows how quickly niche language ecosystems produce packageable analyzers
      once the compiler exposes a stable intermediate representation.
  project-history:
    - >
      Caracal was created in the Crytic GitHub organization in January 2023. The Crytic
      organization describes itself as blockchain security by Trail of Bits, placing
      Caracal in the same family of security analysis tooling as other Crytic projects.
    - >
      The README describes Caracal as a static analyzer over SIERRA for Starknet smart
      contracts. It supports standalone Cairo files, Cairo projects, and Scarb projects,
      with precompiled binaries published on GitHub releases.
  related-projects:
    - >
      Cairo and the cairo-lang compiler crates are direct dependencies named in
      Caracal's Cargo.toml.
    - Starknet is the smart-contract platform Caracal targets.
    - Scarb is the Cairo package/build tool flow documented by Caracal.
    - Crytic and Trail of Bits provide the security-tooling context for the project.
  sources:
    - https://api.github.com/orgs/crytic
    - https://api.github.com/repos/crytic/caracal
    - https://api.github.com/repos/crytic/caracal/releases
    - https://github.com/crytic/caracal
    - https://github.com/crytic/caracal/blob/master/Cargo.toml
    - https://github.com/crytic/caracal/blob/master/README.md
  summary:
    - >
      Caracal is a Rust command-line static analyzer for Starknet smart contracts,
      working over Cairo's SIERRA representation to run vulnerability detectors,
      printers, taint analysis, and data-flow analysis.
  timeline:
    - '2023-01: crytic/caracal repository is created on GitHub.'
    - '2023-07: Caracal v0.1.0 is published.'
    - '2023-08: v0.2.0 is published for the Cairo compiler 2.x line.'
    - '2024-01: v0.2.3 is published, matching the version in Cargo.toml.'
    - >
      2026: Homebrew formula metadata still identifies Caracal as a Starknet
      smart-contract static analyzer.
  usage:
    - >
      Users run caracal detectors to list available detectors, caracal printers to list
      printers, caracal detect to analyze standalone files or projects, and caracal
      print to export information such as CFGs and call graphs.
    - >
      For Scarb projects, the README instructs users to enable SIERRA output in
      Scarb.toml before running Caracal. For standalone analysis with a bundled
      compiler, users may need to provide Cairo corelib with --corelib or CORELIB_PATH.
related-packages:
  - id: brew:scarb
    reason: >
      Scarb builds Cairo and Starknet projects and emits the SIERRA artifacts Caracal
      analyzes; Caracal's README documents the required Scarb.toml settings.
    rel: adjacent_workflow
    sources:
      - https://github.com/crytic/caracal/blob/master/README.md
      - https://docs.swmansion.com/scarb/docs
