config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The batch input records packaging in Homebrew, Debian, Ubuntu, MacPorts, and Nix,
      which matches BOSSA's long tail as an embedded host tool used from developer
      laptops and build systems.
    - >
      BOSSA also became familiar outside the original ShumaTech audience through
      development-board support; the README lists SAMD21 and SAMD51 among supported
      families and credits board contributions from Atmel, David Crocker, and Adafruit
      Industries.
  package-nerd-significance:
    - >
      BOSSA is package-nerd significant because a tiny-looking formula provides a
      critical bridge between general-purpose developer machines and microcontroller
      boot ROMs.
    - >
      Its command names matter: users often search for bossac because IDEs and embedded
      build systems invoke that executable even though the upstream project name is
      BOSSA.
  project-history:
    - >
      BOSSA was created by Scott Shumate as an open source replacement for Atmel's
      SAM-BA software. The name expands to Basic Open Source SAM-BA Application,
      reflecting the goal of a simpler programmer for SAM-family microcontrollers.
    - >
      The GitHub repository dates to August 2011, and the README describes both the
      GUI-oriented BOSSA project and the command-line bossac tool. The project is
      BSD-licensed and written primarily in C++.
  related-projects:
    - >
      Atmel SAM-BA is the proprietary tool and boot-assistant ecosystem BOSSA was
      created to replace.
    - bossac is the command-line BOSSA frontend shipped by this package.
    - >
      Atmel SAM device families such as SAMD21, SAMD51, SAM3, SAM4, and SAM7 are the
      target microcontroller families listed by the upstream README.
  sources:
    - https://api.github.com/repos/shumatech/BOSSA
    - https://api.github.com/repos/shumatech/BOSSA/releases?per_page=100
    - https://github.com/shumatech/BOSSA
    - https://www.shumatech.com/web/products/bossa
    - source_facts.package-manager
  summary:
    - >
      BOSSA is ShumaTech's flash programming utility for Atmel SAM ARM microcontrollers,
      with bossac providing the command-line interface commonly packaged for developer
      and embedded workflows.
  timeline:
    - '2011-08: Official GitHub repository metadata shows the BOSSA repository created.'
    - '2016: GitHub release metadata shows 1.7.0 in the public release feed.'
    - '2023: Repository metadata shows upstream activity continuing into the 1.9.x era.'
    - >
      2026: Package-manager input records Homebrew, Debian, Ubuntu, MacPorts, and Nix
      availability.
  usage:
    - >
      Developers use bossac to write binary images to the flash or ROM of supported
      Atmel SAM devices over USB or serial connections, and to inspect or dump target
      memory. GUI BOSSA covers interactive programming workflows, while bossac is better
      suited to scripts and IDE toolchains.
    - >
      The tool is usually invoked after a device is placed into its SAM-BA bootloader
      mode, so it is packaged as a host-side flashing utility rather than as firmware.
related-packages:
  - id: brew:platformio
    reason: >
      Use PlatformIO with BOSSA when you want a complete Atmel SAM build-and-upload
      workflow; PlatformIO's official SAM platform lists BOSSA's `tool-bossac` as an
      upload package.
    rel: adjacent_workflow
    sources:
      - https://github.com/shumatech/BOSSA
      - https://docs.platformio.org/en/latest/platforms/atmelsam.html
