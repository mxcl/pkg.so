id: brew:gopass
display-name: gopass
repo: null
docs:
  - https://github.com/gopasspw/gopass/tree/master/docs
  - https://github.com/gopasspw/gopass#readme
  - https://www.gopass.pw/
config-file-location:
  unix:
    - ~/.config/gopass/config
    - /etc/gopass/config
    - <STORE_DIR>/config
    - <STORE_DIR>/config.worktree
  windows:
    - '%APPDATA%\gopass\config'
credentials-file-location:
  unix:
    - ~/.local/share/gopass/stores/root
    - ~/.password-store
history:
  adoption-history:
    - >
      gopass adoption is strongly tied to package managers and team workflows. The
      README documents Homebrew, MacPorts, Debian-style packages from the gopass package
      repository, Fedora, Arch, WinGet, Chocolatey, Scoop, FreeBSD, OpenBSD, Alpine,
      source builds, and manual release downloads.
    - >
      The project also grew a browser-integration side through gopass-jsonapi and
      gopassbridge, letting users avoid the command line for routine website logins
      while keeping the git/GPG-backed store model.
  package-nerd-significance:
    - >
      gopass is significant to package nerds because it preserves the Unix
      password-store mental model while making it more installable and cross-platform
      for teams. It is a CLI-first security tool whose real-world value depends on
      package-manager trust, GPG/git availability, shell completion, and browser-native
      messaging helpers.
    - >
      It is also a case study in a project name colliding with distro namespaces: the
      README warns Debian and Ubuntu users not to install an unrelated `gopass` package
      from official repositories, then points them to the gopass project's own apt
      repository.
  project-history:
    - >
      The gopasspw/gopass repository was created in February 2017 and published a v1.0.0
      release the same day. Its README describes the project as a drop-in replacement
      for pass, built from experience with globally distributed development teams.
    - >
      The early 1.x release line moved quickly through setup, team, mount, sync, and
      browser-oriented workflows. The README shows the project broadening from a
      Unix-style password-store clone into a cross-platform secrets manager with Linux,
      macOS, BSD, and Windows installation paths.
  related-projects:
    - >
      The README relates gopass to pass, GPG, git, age, fossil, gopass-jsonapi,
      gopassbridge, gpg4win, package managers such as Homebrew and Scoop, and browser
      integrations.
  sources:
    - https://api.github.com/repos/gopasspw/gopass
    - https://github.com/gopasspw/gopass
    - https://github.com/gopasspw/gopass#readme
    - https://github.com/gopasspw/gopass/releases
    - https://www.gopass.pw/
  summary:
    - >
      gopass is a command-line password manager positioned as a more team-oriented take
      on the standard Unix password manager, pass. By default it encrypts secrets with
      GPG and versions the store in git, while also supporting other crypto and storage
      backends.
  timeline:
    - '2017: GitHub repository created under gopasspw/gopass.'
    - '2017: v1.0.0 release published on GitHub Releases.'
    - '2017: v1.1.0 and v1.2.0 releases followed during the first months of public development.'
    - '2017: v1.3.x releases continued the early stable CLI line.'
    - >
      2020s: README documents broad package-manager installation across Unix-like
      systems and Windows, plus browser integration through gopass-jsonapi.
  usage:
    - >
      A typical user runs `gopass setup` to create a root store, choose encryption,
      optionally configure a git remote, and write configuration under the user's gopass
      config directory. Daily commands include `gopass create`, `gopass ls`, `gopass
      show -c`, `gopass rm`, `gopass sync`, and `gopass mounts`.
    - >
      The default store path documented by the README is
      `$HOME/.local/share/gopass/stores/root`, with GPG encryption and git storage. The
      README also notes that age encryption and fossil storage are available
      alternatives.
related-packages:
  - id: brew:pass
    reason: >
      Choose pass for the smallest shell-based Unix password-store implementation;
      choose gopass for cross-platform operation, team-oriented stores, multiple
      backends, and broader built-in workflows.
    rel: alternative
    sources:
      - https://www.passwordstore.org/
      - https://github.com/gopasspw/gopass#readme
  - id: brew:gopass-jsonapi
    reason: >
      Install gopass-jsonapi when browser extensions such as gopassbridge need a
      native-messaging bridge to retrieve logins from gopass.
    rel: adjacent_workflow
    sources:
      - https://github.com/gopasspw/gopass-jsonapi#readme
      - https://github.com/gopasspw/gopass#readme
