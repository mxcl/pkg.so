history:
  adoption-history:
    - >
      bioawk spread through the practical genomics command-line ecosystem rather than
      through a large application platform. The input package metadata lists Homebrew,
      Debian, Ubuntu, and Nix packages, which is exactly the distribution pattern
      expected for a small Unix filter that bioinformaticians drop into shell pipelines.
  package-nerd-significance:
    - >
      bioawk is package-nerd catnip because it is not a new workflow engine or
      framework; it is the old Unix text-processing model with just enough domain
      knowledge to remove glue code. It keeps awk's one-liner culture alive inside
      genomics pipelines.
  project-history:
    - >
      The lh3/bioawk repository was created on GitHub in January 2012 and describes the
      project as BWK awk modified for biological data. Its README says bioawk extends
      Brian Kernighan's awk with BED, GFF, SAM, VCF, FASTA/FASTQ, tab-delimited headers,
      gzip support through zlib, and biosequence helper functions while falling back to
      original awk behavior when the biological extensions are not used.
  related-projects:
    - >
      bioawk is directly related to BWK awk, zlib, and command-line genomics tools such
      as samtools, bcftools, BED/GFF utilities, and FASTA/FASTQ pipeline filters.
  sources:
    - https://api.github.com/repos/lh3/bioawk
    - https://github.com/lh3/bioawk
    - https://raw.githubusercontent.com/lh3/bioawk/master/README.md
    - source_facts.package-manager
  summary:
    - >
      bioawk is a small but durable bioinformatics command-line package: Brian
      Kernighan's awk modified to understand common genomics text formats and
      gzip-compressed input.
  timeline:
    - '2012: lh3/bioawk repository created on GitHub.'
    - '2012: v1.0 tag published in the repository.'
    - '2010s: Packaged by Unix-like distributions for bioinformatics shell workflows.'
  usage:
    - >
      Common uses include extracting fields from VCF or SAM, converting FASTA/FASTQ
      records, reverse-complementing sequences, and using `-c fastx`, `-c sam`, `-c
      vcf`, or `-c hdr` to make biological records feel like awk fields.
    - >
      It is especially useful when the job is too small for a full Python or Perl script
      but too biological for plain awk.
related-packages:
  - id: brew:samtools
    reason: >
      Use SAMtools to read, convert, sort, or select SAM/BAM/CRAM data, then pipe its
      text output into bioawk for concise record-level filtering and transformation, as
      demonstrated by bioawk's official README.
    rel: adjacent_workflow
    sources:
      - https://raw.githubusercontent.com/lh3/bioawk/master/README.md
      - https://www.htslib.org/doc/samtools.html
