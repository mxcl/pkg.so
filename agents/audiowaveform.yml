config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README documents installation paths across Ubuntu PPA packages, Debian and RPM
      release assets, Arch AUR, Homebrew, Windows binaries, Docker, and Nix. The
      supplied package-manager facts also show Homebrew, Nix, and Scoop coverage, which
      matches its role as a small binary tool that packagers can expose as a single
      executable.
  package-nerd-significance:
    - >
      audiowaveform is interesting to package maintainers because it sits at the
      intersection of C++, image output, and codec libraries while still behaving like a
      classic filter-style CLI. Its release assets and package notes cover several Linux
      families, macOS/Homebrew, Windows, Docker, and Nix, making it a good example of a
      multimedia utility that is useful only when the binary and its codec dependencies
      are packaged cleanly.
  project-history:
    - >
      The project began as a public source release on 2013-10-14 in the BBC GitHub
      repository, with Chris Needham as the author. The current official Codeberg
      repository records the BBC GitHub repository as its original URL, and the README
      now identifies Chris Needham and contributors as the authors.
    - >
      The official changelog shows steady growth from the 1.0 series into a more general
      media conversion and rendering tool: direct PNG output arrived in 2013, JSON
      waveform output and configurable image colors in 2014, FLAC support in 2014, Ogg
      Vorbis and automatic zoom-to-width behavior in 2018, Opus input in 2022, bar-style
      rendering in 2023, raw audio input in 2024, and Windows UTF-8 filename support in
      2025.
  related-projects:
    - >
      The README credits Audacity, madlld, and pdjson code, and links a separate
      compile-static-audiowaveform project for Windows binaries.
  sources:
    - https://api.github.com/repos/bbc/audiowaveform
    - https://codeberg.org/api/v1/repos/chrisn/audiowaveform
    - https://codeberg.org/chrisn/audiowaveform/src/branch/master/CHANGELOG.md
    - https://codeberg.org/chrisn/audiowaveform/src/branch/master/README.md
  summary:
    - >
      audiowaveform is a C++ command-line utility for turning audio into compact
      waveform data and rendered waveform images. Its package-manager niche is the
      Unix-style batch tool for web audio, podcast tooling, archival previews, and any
      pipeline that needs waveform JSON, binary .dat data, or PNG output without opening
      a GUI editor.
  timeline:
    - '2013: Initial public release.'
    - '2014: JSON waveform output, image color options, and FLAC support were added.'
    - '2018: Ogg Vorbis input and automatic zoom-to-width rendering were added.'
    - '2022: Opus input support was added.'
    - '2023: Bar-style waveform rendering and JSON input support were added.'
    - >
      2025: The current Codeberg repository was created with the BBC GitHub repository
      listed as the original URL.
    - '2026: Version 1.11.1 fixed Ubuntu packaging scripts.'
  usage:
    - >
      The core command reads MP3, WAV, FLAC, Ogg Vorbis, Opus, raw, .dat, or JSON
      waveform data and writes WAV, .dat, JSON, or PNG. It computes min/max sample pairs
      over a zoom window, can read or write standard streams with explicit formats, and
      can split channels or render fixed-width waveform images.
related-packages:
  - id: brew:ffmpeg
    reason: >
      FFmpeg is the officially documented upstream decoding stage for piping audio from
      video or other media into audiowaveform as WAV data.
    rel: adjacent_workflow
    sources:
      - https://codeberg.org/chrisn/audiowaveform/src/branch/master/README.md
      - https://ffmpeg.org/ffmpeg.html
