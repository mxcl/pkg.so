credentials-file-location: null
history:
  adoption-history:
    - >
      jq-lsp is surfaced through editor integrations rather than as a standalone
      end-user data tool. The README points users toward vscode-jq, Neovim lspconfig and
      mason.nvim, Emacs lsp-mode, Helix, and IntelliJ with LSP4IJ, matching how language
      servers are usually adopted.
  package-nerd-significance:
    - >
      jq-lsp is package-nerd notable because it turns jq from a terse shell pipeline
      language into something editors can understand. It also shows a common LSP
      pattern: reuse an existing language parser, ship one small server binary, and let
      many editors share the same intelligence.
  project-history:
    - >
      The project belongs to jq's later ecosystem rather than jq's original 2010s
      command-line history. It uses a modified version of itchyny's gojq parser and
      bases builtin documentation on jq manual data, making it a bridge between jq the
      CLI language and modern Language Server Protocol editor workflows.
    - >
      Public release artifacts began with the 0.1 series. The November 2025 releases
      added IntelliJ/LSP4IJ support, import-search behavior, jq 1.8 builtins and docs,
      parser fixes, and packaged binaries. January and February 2026 releases refined
      server internals and parser traversal.
  related-projects:
    - >
      Related projects include jq, gojq, vscode-jq, Neovim lspconfig, mason.nvim, Emacs
      lsp-mode, Helix, and IntelliJ LSP4IJ.
  sources:
    - https://github.com/jqlang/awesome-jq
    - https://github.com/wader/jq-lsp
    - https://github.com/wader/jq-lsp/releases
    - https://github.com/wader/vscode-jq
    - https://raw.githubusercontent.com/wader/jq-lsp/master/README.md
  summary:
    - >
      jq-lsp is Mattias Wadman's language server for jq, bringing editor features to jq
      filters and scripts. Its README lists syntax checking, missing function and
      binding diagnostics, goto definition, completion, import support, hover
      information, document symbols, and project-specific builtins through `.jq-lsp.jq`.
  timeline:
    - '2025-11-18: v0.1.2 and v0.1.14 release artifacts were published in the 0.1 line.'
    - >
      2025-11-18: v0.1.14 added IntelliJ with LSP4IJ support, jq 1.8 builtins and docs,
      import search-path support, and related parser fixes.
    - '2025-11-27: v0.1.15 fixed parsing of binary operators with binding.'
    - >
      2026-01-01: v0.1.16 updated gojq, moved more server CLI behavior into jq, and
      fixed position handling.
    - '2026-02-12: v0.1.17 corrected suffix-list traversal.'
  usage:
    - >
      Developers install `jq-lsp` with Go or a package manager and let an editor launch
      it for `.jq` files. The `.jq-lsp.jq` file lets a project declare additional
      builtin functions or variables so diagnostics and completion match the environment
      where jq code actually runs.
related-packages:
  - id: brew:jq
    reason: >
      Install jq alongside jq-lsp to execute and test the jq programs for which the
      language server supplies editor diagnostics and navigation.
    rel: adjacent_workflow
    sources:
      - https://github.com/wader/jq-lsp#readme
      - https://jqlang.org/manual/
