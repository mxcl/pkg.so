history:
  adoption-history:
    - >
      The batch input records packages in Homebrew, Debian, Fedora, MacPorts, Nix, Arch,
      and openSUSE. Upstream docs also point to an official Docker image, making kcov
      available through both traditional package managers and container workflows.
  package-nerd-significance:
    - >
      kcov is notable because it brings coverage to binaries and scripts without
      requiring the build to be compiled with coverage instrumentation. For distro
      packagers and CI maintainers, that makes it useful for testing shell-heavy or
      mixed-language projects where gcov-style workflows are awkward.
  project-history:
    - >
      Simon Kagstrom created the GitHub repository in August 2010. From the README's
      account, kcov started with Bcov's idea of using debug information for coverage and
      then expanded into a broader coverage-reporting tool with HTML, lcov-style output,
      Cobertura XML, JSON output, and CI integrations.
    - >
      Release history documents platform and integration work through the 2010s and
      2020s, including Docker images from v31, macOS binaries in v32, FreeBSD and macOS
      build work in v36, AArch64 support in release 38, RISC-V and Codecov updates in
      v41, and Cobertura/Jenkins fixes in v43.
  related-projects:
    - >
      kcov descends from Bcov and integrates with coverage-reporting services including
      Coveralls, Codecov, Jenkins, SonarQube, GitHub Actions, and GitLab CI.
  sources:
    - https://bcov.sourceforge.net/
    - https://github.com/SimonKagstrom/kcov
    - https://github.com/SimonKagstrom/kcov/releases
    - https://simonkagstrom.github.io/kcov
  summary:
    - >
      kcov is a code coverage tool for compiled programs, Python, and shell scripts. Its
      README says it began as a fork of Bcov and uses DWARF debugging information so
      programs can be measured without special compiler switches.
  timeline:
    - '2010-08-23: GitHub repository created.'
    - '2015-11-02: v29 release published.'
    - >
      2016-04-28: v31 release published; README documents official Docker images for
      releases since v31.
    - '2018-08-23: v36 release included FreeBSD port and macOS build fixes.'
    - '2020-01-17: release 38 added AArch64 support.'
    - '2024-07-23: v43 release included Cobertura and Jenkins fixes.'
  usage:
    - >
      A typical invocation runs kcov with an output directory and an executable plus
      arguments. Users filter included or excluded paths, merge multiple coverage runs,
      and publish reports to CI services such as Coveralls, Codecov, Jenkins, SonarQube,
      GitHub Actions, and GitLab CI.
related-packages:
  - id: brew:gcovr
    reason: >
      Choose gcovr for compiler-instrumented GCC/gcov coverage and a broad selection of
      CI report formats; choose kcov when coverage without special compilation flags or
      coverage of shell and Python programs is important.
    rel: alternative
    sources:
      - https://github.com/SimonKagstrom/kcov#readme
      - https://gcovr.com/en/stable/
  - id: brew:lcov
    reason: >
      Choose LCOV for an established gcov/llvm-cov trace-processing and HTML-report
      workflow, while kcov is designed to collect coverage directly from debug
      information and scripts.
    rel: alternative
    sources:
      - https://github.com/SimonKagstrom/kcov#readme
      - https://github.com/linux-test-project/lcov/blob/master/README.rst
