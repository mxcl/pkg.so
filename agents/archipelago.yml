history:
  adoption-history:
    - >
      Archipelago is distributed as a macOS application and through Homebrew Cask. Its
      adoption remained centered on users interested in a minimal terminal with
      web-rendering technology.
  package-nerd-significance:
    - >
      Archipelago is notable as a native macOS application that embeds a web-based
      terminal stack, illustrating a middle ground between conventional native terminal
      emulators and Electron-style terminals.
    - >
      Its Homebrew Cask distribution gives package-manager users a reproducible
      installation path for a comparatively small terminal project.
  project-history:
    - >
      Archipelago began after its developer used Hyper and liked its appearance and
      extensibility but encountered performance and rendering problems attributed to
      Hyper's then-used terminal component.
    - >
      The developer adopted xterm.js and built Archipelago as a minimalist open-source
      terminal emulator around web technology while retaining a macOS application
      project.
  related-projects:
    - Hyper directly inspired Archipelago's design.
    - >
      xterm.js supplied the terminal technology that the developer selected to address
      the performance and buffer-rendering problems described in the README.
  sources:
    - 'Official Archipelago repository and README: https://github.com/npezza93/archipelago'
  summary:
    - >
      Archipelago is a minimalist open-source terminal emulator for macOS that uses web
      terminal technology inside a native application.
  timeline:
    - >
      Project origin: Archipelago was started as a faster, more reliable alternative
      inspired by Hyper.
    - 'Later distribution: The project added Homebrew Cask as an official installation method.'
  usage:
    - >
      Users install and launch Archipelago as a macOS terminal application. Contributors
      install its web dependencies and open the native project in Xcode.
