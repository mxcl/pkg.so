id: brew:glom
display-name: glom
repo: https://github.com/mahmoud/glom
docs:
  - https://glom.readthedocs.io/en/latest
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      glom found a place in Python data plumbing where nested dictionaries, JSON
      responses, ORM objects, and mixed object/list structures make direct indexing
      brittle. Its Read the Docs site, PyPI package, command-line interface, and
      distribution through package managers made it usable both as a library and as a
      shell inspection tool.
  package-nerd-significance:
    - >
      glom matters to package nerds because it is a Python library that also ships a
      useful executable. Installing the package gives both importable APIs and a
      data-transformation CLI, so package managers expose a small but practical bridge
      between Python code and shell workflows.
  project-history:
    - >
      Mahmoud Hashemi released glom publicly in 2018, with the README pointing to an
      original announcement post and a PyCon 2018 lightning talk from the same launch
      period. The project adopted CalVer-style releases and documents its growth in a
      changelog focused on backwards compatibility.
  related-projects:
    - >
      The documentation compares glom with jq, XPath/XSLT, SQL, GraphQL, templating
      systems, and Python validation libraries, while keeping Python specs as the
      central interface.
  sources:
    - https://github.com/mahmoud/glom
    - https://glom.readthedocs.io/
    - https://glom.readthedocs.io/en/stable/cli.html
    - https://pypi.org/project/glom/
    - https://raw.githubusercontent.com/mahmoud/glom/master/CHANGELOG.md
    - https://raw.githubusercontent.com/mahmoud/glom/master/README.md
  summary:
    - >
      glom is a Python library and CLI for declarative access, transformation,
      validation, and restructuring of nested data.
  timeline:
    - '2018: v18.0.0 public release shipped with tutorial and error-system work.'
    - '2020: v20.7.0 added Match mode, validation, and a documentation refactor.'
    - '2022: v22.1.0 introduced optional star and recursive-star path expansion.'
    - '2023: v23.5.0 added TOML support to the CLI.'
    - '2024: v24.11.0 added Python 3.12 support and a CLI scalar flag.'
  usage:
    - >
      Practitioners use glom specs to pull values out of nested data, transform
      structures, validate shapes with Match, mutate data with Assign and Delete, stream
      through Iter, and inspect JSON or TOML at the command line.
related-packages:
  - id: brew:jq
    reason: >
      jq is the closest documented CLI alternative for JSON filtering and
      transformation; choose it for a dedicated shell query language, while glom uses
      Python specifications and also embeds directly as a library.
    rel: alternative
    sources:
      - https://glom.readthedocs.io/en/latest/by_analogy.html
      - https://jqlang.github.io/jq/
      - https://jqlang.github.io/jq/manual/
  - id: brew:jello
    reason: >
      jello is an alternative for filtering JSON and JSON Lines with ordinary Python
      list and dictionary syntax, while glom provides a broader reusable library for
      nested-object transformation and validation.
    rel: alternative
    sources:
      - https://glom.readthedocs.io/en/latest/cli.html
      - https://github.com/kellyjonbrazil/jello
