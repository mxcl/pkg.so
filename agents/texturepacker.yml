history:
  adoption-history:
    - >
      CodeAndWeb says game developers have used TexturePacker since 2010. Its broad
      exporter catalog and generic JSON/XML output made it usable across many 2D engines
      rather than tying it to one runtime.
    - >
      GUI, command-line, Docker, and CI workflows expanded its role from an
      artist-facing packing tool to a repeatable asset-build component.
  package-nerd-significance:
    - >
      TexturePacker is notable as a desktop graphics tool that also behaves like a build
      tool: `.tps` project files and command-line overrides make visual asset settings
      reproducible in scripts and continuous integration.
    - >
      Its many engine-specific exporters illustrate the compatibility layer needed
      between source artwork, packed GPU textures, and runtime sprite metadata.
  project-history:
    - >
      TexturePacker was established as CodeAndWeb's sprite-sheet creation and
      optimization product. The official site describes continuous use by game
      developers since 2010.
    - >
      The product developed support for multiple packing algorithms, trimming, duplicate
      detection, scaling, hardware texture compression, many engine exporters,
      command-line automation, and containerized CI operation.
  related-projects:
    - >
      CodeAndWeb also develops SpriteIlluminator, PhysicsEditor, TexturePacker3D, and
      BabelEdit.
    - >
      TexturePacker exports data for engines and frameworks including Unity, Unreal
      Engine, Godot, Phaser, Cocos2d, SpriteKit, and many others.
  sources:
    - https://www.codeandweb.com/texturepacker
    - https://www.codeandweb.com/texturepacker/documentation
    - https://www.codeandweb.com/texturepacker/documentation/commandline
    - https://www.codeandweb.com/texturepacker/documentation/installation-and-licensing
  summary:
    - >
      TexturePacker is a proprietary GUI and command-line tool for assembling source
      images into optimized sprite sheets and texture atlases, together with metadata
      for game engines.
  timeline:
    - >
      2010: The vendor dates the beginning of TexturePacker's use by game developers to
      this year.
    - >
      2021: Legacy FlashUnpacker integration is removed following the end of Adobe Flash
      Player support.
    - >
      2020s: Docker/CI licensing, modern GPU texture formats, and a large catalog of
      engine exporters support automated asset pipelines.
  usage:
    - >
      Developers drag sprite folders into the GUI, select an exporter and packing
      settings, then publish an atlas image and metadata file for their engine.
    - >
      Projects can be saved as `.tps` files and rebuilt with the `TexturePacker`
      command. Command-line options can override project settings, making the tool
      suitable for build scripts and CI. Because `.tps` files are user-named project
      artifacts rather than files in a prescribed location, no fixed configuration path
      is reported.
