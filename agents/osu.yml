id: cask:osu
display-name: osu!
repo: null
docs:
  - https://osu.ppy.sh/wiki/en/Client/Release_stream/Lazer
  - https://osu.ppy.sh/wiki/en/Client/Release_stream/Lazer/File_storage
  - https://osu.ppy.sh/wiki/en/Main_page
config-file-location:
  linux:
    - ~/.local/share/osu/framework.ini
    - ~/.local/share/osu/game.ini
  macos:
    - ~/Library/Application Support/osu/framework.ini
    - ~/Library/Application Support/osu/game.ini
  windows:
    - '%APPDATA%\osu\framework.ini'
    - '%APPDATA%\osu\game.ini'
credentials-file-location: null
history:
  adoption-history:
    - >
      osu! grew from a small 2007 test build and a handful of beatmaps into an online
      community organized around user-created beatmaps, rankings, multiplayer, modding,
      and competitive tournaments.
    - >
      The open-source lazer rewrite broadened platform support and moved client
      development into a public GitHub workflow while retaining compatibility and
      migration paths for the long-running stable-client community.
  package-nerd-significance:
    - >
      osu! is notable for pairing an open-source cross-platform client with a large
      service-backed, user-generated-content ecosystem. Its beatmap formats, skins,
      replay files, local databases, and ruleset architecture make client packaging and
      data migration unusually important.
    - >
      The macOS cask distributes the modern lazer codebase from the official repository,
      making it distinct from the older closed-source stable Windows client.
  project-history:
    - >
      Dean Herbert, known as peppy, began osu! in 2007 as a proof of concept called
      ouentest. A small private build appeared in July, followed by the public launch,
      forums, beatmap sharing, and online rankings later that year.
    - >
      New game modes, including osu!taiko, osu!catch, and osu!mania, expanded the
      project beyond its original click-rhythm ruleset. Technical debt in the stable
      client eventually prompted a ground-up, cross-platform rewrite.
    - >
      The rewrite, code-named lazer, began in earnest in 2016 and published its first
      GitHub build in February 2017. It is developed openly alongside the reusable
      osu!framework.
  related-projects:
    - osu!framework
    - osu!wiki
    - osu!stable
    - Bancho
    - osu!taiko
    - osu!catch
    - osu!mania
  sources:
    - 'Official 2007 history: https://osu.ppy.sh/wiki/en/History_of_osu%21/2007'
    - 'Official history index: https://osu.ppy.sh/wiki/en/History_of_osu%21'
    - 'Official lazer history: https://osu.ppy.sh/wiki/en/Client/Release_stream/Lazer'
    - 'Official repository: https://github.com/ppy/osu'
  summary:
    - >
      osu! is a community-centered rhythm game built around player-created beatmaps,
      online rankings, multiple rulesets, multiplayer, replay sharing, and extensive
      customization. The packaged macOS application is the open-source lazer client.
  timeline:
    - '2007: The first proof-of-concept build and public release appeared.'
    - '2008: osu!taiko and osu!catch joined the original game mode.'
    - '2012: osu!mania was introduced.'
    - '2016: The open-source lazer rewrite was announced.'
    - '2017: The first lazer build was published on GitHub.'
  usage:
    - >
      Players download or create beatmaps and perform timed inputs to music across four
      official rulesets. The client also supports online rankings, multiplayer, replays,
      skins, an integrated beatmap editor, and migration from the older stable client.
