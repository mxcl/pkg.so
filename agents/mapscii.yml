id: brew:mapscii
display-name: MapSCII
repo: https://github.com/rastapasta/mapscii
docs:
  - https://github.com/rastapasta/mapscii#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      MapSCII spread as a terminal novelty with real geospatial plumbing underneath. The
      official README documents npx mapscii, npm install -g mapscii, snap install
      mapscii, and direct use of the mapscii command, while Homebrew and Nix metadata in
      the input show additional package-manager adoption.
    - >
      Its GitHub repository metadata shows unusually high interest for a small CLI map
      viewer, which fits its role as a memorable demo of vector tiles, terminal
      graphics, and OpenStreetMap-style data in one command.
  package-nerd-significance:
    - >
      MapSCII is significant as a tiny package-index gem: it combines Node packaging,
      terminal rendering, vector tiles, and OpenStreetMap-derived data in a way that is
      instantly testable from a shell.
    - >
      It is also a good example of why package managers carry playful tools: the utility
      may be narrow, but it exercises real terminal and geospatial dependencies.
  project-history:
    - >
      The MapSCII GitHub repository was created in September 2016. Its README presents
      the project as a Braille and ASCII world map renderer for the console, with mouse
      dragging and zooming, points of interest, Mapbox-style layer styling, public or
      private vector tile servers, OSM2VectorTiles-based data, and offline MBTiles
      support.
    - >
      The official release stream shows the early feature path: ASCII mode in 2017,
      improved mouse support later in 2017, a CoffeeScript-to-JavaScript transition in
      2019, and version 0.3.1 in February 2020.
  related-projects:
    - >
      Mapbox Styles, vector tiles, MBTiles, and OSM2VectorTiles are listed in the
      official README as part of the MapSCII feature set.
    - OpenStreetMap-derived data is central to the project's map-viewing experience.
  sources:
    - https://api.github.com/repos/rastapasta/mapscii
    - https://api.github.com/repos/rastapasta/mapscii/releases?per_page=5
    - https://github.com/rastapasta/mapscii
    - source_facts.package-manager
  summary:
    - >
      MapSCII is a JavaScript terminal map viewer that renders world map data as Braille
      and ASCII characters and can be run locally or over a telnet-style terminal
      session.
  timeline:
    - '2016: Public GitHub repository created.'
    - '2017: ASCII mode and improved mouse support releases published.'
    - '2019: CoffeeScript-to-JavaScript release published.'
    - '2020: v0.3.1 release published.'
  usage:
    - >
      Users run mapscii, pan with arrow keys, zoom with a and z, switch character mode
      with c, quit with q, and use mouse events when the terminal supports them. It can
      connect to vector tile servers or work with local VectorTile/MBTiles data.
    - >
      For package users, MapSCII is mostly a frictionless CLI: install it, run mapscii,
      and get an interactive world map in a terminal without a browser.
related-packages:
  - id: brew:telnet
    reason: >
      A telnet client provides the zero-install way to use MapSCII's documented public
      service at `mapscii.me` before installing the local application.
    rel: adjacent_workflow
    sources:
      - https://github.com/rastapasta/mapscii
