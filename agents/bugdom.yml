history:
  adoption-history:
    - >
      Bugdom was bundled with some Macintosh models, giving it visibility well beyond
      stand-alone game sales and making it a recognizable title among late-1990s Mac
      users.
    - >
      Its dependence on QuickDraw 3D made the original increasingly difficult to run
      after classic Mac OS. Iliyas Jorio’s Pangea-approved modern port restored
      straightforward access on macOS, Windows, and Linux.
  package-nerd-significance:
    - >
      Bugdom is a preservation-oriented package: it turns a classic Mac game tied to
      obsolete QuickDraw 3D technology into an installable modern desktop application.
    - >
      The port is also noteworthy for replacing its initial Quesa-based compatibility
      layer with a purpose-built renderer while retaining the original game’s design and
      data under Pangea’s permission.
  project-history:
    - >
      Pangea Software released Bugdom for Macintosh in 1999. Designed by Brian
      Greenstone and Toucan Studio, it follows pill bug Rollie McFly on a quest to
      rescue ladybugs from King Thorax.
    - >
      After Jorio completed a modern port of Pangea’s Nanosaur, Pangea invited him to
      port Bugdom. The modern version debuted in December 2020 with arbitrary-resolution
      support, new save and settings interfaces, and numerous fixes.
    - >
      The port initially used a custom Quesa fork to replace the unavailable classic
      environment. Version 1.3.1 replaced that layer with a tailor-made renderer and
      added native Apple Silicon support.
  related-projects:
    - Bugdom 2
    - Nanosaur
    - Quesa
    - QuickDraw 3D
    - Pangea Software modern ports
  sources:
    - https://github.com/jorio/Bugdom
    - https://github.com/jorio/Bugdom/blob/master/CHANGELOG.md
    - https://github.com/jorio/Bugdom/blob/master/docs/Instructions.pdf
  summary:
    - >
      Bugdom is Pangea Software’s 1999 bug-themed 3D action-adventure game. The
      maintained package is an officially approved modern port for macOS, Windows, and
      Linux.
  timeline:
    - '1999: Pangea Software shipped the original Bugdom for Macintosh.'
    - '2003: The last known classic Mac OS release appeared.'
    - '2020: The modern cross-platform port debuted.'
    - '2021: A tailor-made renderer replaced the port’s Quesa-based renderer.'
  usage:
    - >
      Players control Rollie McFly through ten 3D levels, fighting enemies, rescuing
      ladybugs, and using vehicles and creature mounts.
    - >
      Modern releases support current desktop operating systems, arbitrary resolutions,
      widescreen presentation, contemporary controllers, and mouse-driven menus.
    - The repository also supplies source-build instructions for macOS, Windows, and Linux.
