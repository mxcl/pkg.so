history:
  adoption-history:
    - >
      Maintenance has been offered freely to Mac users as part of Titanium Software's
      family of system utilities. Separate builds are maintained for major macOS
      releases, while older compatible versions remain downloadable after active
      development ends.
  package-nerd-significance:
    - >
      Maintenance represents the classic macOS system-utility tradition: a graphical
      front end over administrative and housekeeping operations that power users might
      otherwise perform with shell commands. Its per-macOS-version releases are
      important to cask maintainers because compatibility is tightly coupled to the host
      operating-system generation.
  project-history:
    - >
      Titanium Software's developer states that work on these Mac utilities dates to
      2003. Maintenance evolved as a focused, donationware interface for system
      housekeeping, with releases tailored to successive Mac OS X, OS X, and macOS
      generations.
  related-projects:
    - OnyX
    - Deeper
    - Uninstaller
  sources:
    - https://www.titanium-software.fr/en/license.html
    - https://www.titanium-software.fr/en/maintenance.html
    - https://www.titanium-software.fr/en/maintenance_release.html
  summary:
    - >
      Maintenance is a donationware macOS utility from Titanium Software that provides a
      graphical interface for system maintenance and cleaning tasks.
  timeline:
    - "2003: Titanium Software's developer began sustained work on the Mac utility family."
    - 'Mac OS X 10.4 era: An archived Maintenance 1.1.8 build supported PowerPC and Intel Macs.'
    - >
      2026: Maintenance 3.5.x targets macOS Tahoe 26, with separate archived builds
      retained for older systems.
  usage:
    - >
      Users employ Maintenance to rebuild system databases, delete application, font,
      and system caches, clear logs and recent items, remove miscellaneous system files,
      and perform other housekeeping tasks.
    - >
      Users must install the release specifically intended for their major macOS
      version. Some operations require Full Disk Access or administrative privileges
      because they affect system-managed data.
