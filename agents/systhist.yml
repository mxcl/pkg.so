history:
  adoption-history:
    - >
      SystHist is distributed as freeware by The Eclectic Light Company and is also
      available through Homebrew Cask as `systhist`. It serves users and administrators
      who need a clearer view of macOS update records than the operating system's
      headline version alone provides.
    - >
      Successive releases expanded compatibility across Intel and Apple silicon macOS
      generations and added visibility into silent security updates, Rapid Security
      Responses, and XProtect Remediator records.
  package-nerd-significance:
    - >
      SystHist exposes the messy, layered reality behind macOS update state: the
      installed system version, security updates, silent data updates, and their
      recorded histories do not always align. That makes it useful for auditing package
      state and diagnosing machines whose apparent update status is misleading.
  project-history:
    - >
      SystHist was created by The Eclectic Light Company as a focused macOS utility for
      listing installed system and security updates. By April 2019, version 1.8 had
      gained a dedicated product and support page.
    - >
      The developer subsequently adapted it to changing macOS update mechanisms and
      hardware. Version 1.9 added the running macOS version to clarify discrepancies in
      recorded update history, while later releases added newer security-update records
      and support for successive macOS generations.
  related-projects:
    - >
      SilentKnight, which checks macOS firmware, security settings, and security-data
      currency.
    - LockRattler, a quick checker for core macOS security systems and updates.
    - silnite, a command-line utility for related security and update checks.
  sources:
    - >
      Official 2019 release announcement:
      https://eclecticlight.co/2019/04/08/new-versions-of-lockrattler-and-systhist-with-product-and-support-pages/
    - 'Official product page: https://eclecticlight.co/lockrattler-systhist/'
    - source_facts.package-manager
  summary:
    - >
      SystHist is a macOS utility from The Eclectic Light Company that reports the
      machine's installed operating-system and security-update history, including
      otherwise quiet security-data updates.
  timeline:
    - '2019: Version 1.8 introduced a dedicated product and support page.'
    - >
      Version 1.9: Added the running macOS version to clarify discrepancies in recorded
      update history.
    - 'Version 1.18: Added reporting for Rapid Security Responses.'
    - >
      Later releases: Expanded security-record coverage and compatibility across newer
      macOS and Apple silicon systems.
  usage:
    - >
      Run SystHist to inspect the system's recorded OS and security-update installations
      and compare that history with the currently running macOS version.
    - >
      The utility is primarily diagnostic: it helps investigate missing, repeated,
      silent, or otherwise confusing update records rather than installing updates
      itself.
