id: brew:ducker
display-name: ducker
repo: null
docs:
  - https://github.com/robertpsoane/ducker#readme
config-file-location:
  linux:
    - ~/.config/ducker/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Evidence of adoption is thin beyond packaging and GitHub releases. Homebrew, Arch,
      and Nix packaging suggest enough interest for distribution, but the project
      remains niche compared with Docker's official CLI and larger TUI tools.
  package-nerd-significance:
    - >
      ducker is useful metadata-wise because it is a package-manager-distributed Rust
      TUI around Docker, not a Docker plugin or daemon component. The name also invites
      confusion with DuckDB and Cyberduck-adjacent packages in alphabetical lists.
    - >
      It shows the k9s pattern migrating from Kubernetes to smaller operational
      surfaces: package a focused terminal UI around an existing daemon API.
  project-history:
    - >
      The public release history starts in June 2024 with v0.0.1, followed quickly by
      early 0.0.x and 0.1.x releases. The README documents a cargo-first installation
      path with later package availability through Homebrew, Arch, and Nix.
    - >
      The project is intentionally scoped around interactive Docker inspection and
      common container actions from the terminal.
  related-projects:
    - >
      ducker is related to Docker, k9s, lazydocker, and other terminal dashboards that
      wrap daemon APIs with keyboard-driven views.
  sources:
    - https://github.com/robertpsoane/ducker
    - https://ducker.soane.io
    - https://github.com/robertpsoane/ducker/releases
  summary:
    - >
      ducker is a small Rust terminal UI for managing Docker containers, images,
      volumes, and networks. Its own README frames it as inspired by k9s, which places
      it in the modern operator-TUI family rather than in Docker's official CLI lineage.
  timeline:
    - '2024: v0.0.1 is published in the GitHub release history.'
    - '2024: v0.1.0 and v0.1.1 are published in August.'
    - '2024: v0.1.2 is published later in August.'
    - '2025: README documents Homebrew, Arch, Nix, and cargo installation paths.'
  usage:
    - >
      Users run ducker as an interactive TUI for Docker objects, navigating pages for
      containers, images, volumes, and networks and triggering actions through hotkeys
      or commands.
    - >
      Its configuration is a YAML file on Linux, with options for prompt, default exec
      command, Docker socket path, update checks, and autocomplete behavior.
related-packages:
  - id: brew:lazydocker
    reason: >
      Choose lazydocker for a more established Docker and Docker Compose TUI with logs,
      metrics, service operations, and customizable commands; choose Ducker for its
      smaller K9s-inspired Rust interface.
    rel: alternative
    sources:
      - https://github.com/robertpsoane/ducker
      - https://github.com/jesseduffield/lazydocker
  - id: brew:docker
    reason: >
      Docker provides the daemon and canonical CLI that Ducker controls, so it is the
      essential adjacent package when the Docker engine and command-line client are not
      already installed.
    rel: adjacent_workflow
    sources:
      - https://github.com/robertpsoane/ducker
      - https://docs.docker.com/reference/cli/docker/
