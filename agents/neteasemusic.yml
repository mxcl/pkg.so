history:
  adoption-history:
    - >
      NetEase reported more than 400 million users by 2018 and more than 800 million
      registered users by the end of 2019. The service developed a particularly active
      music community and became a prominent platform for discovering Chinese
      independent musicians.
    - >
      Its catalog grew through licensing partnerships, while personalized
      recommendations, playlists, song reviews, artist tools, social features, and the
      Cloud Village community differentiated it from a conventional desktop music
      player.
  package-nerd-significance:
    - >
      For package users, the cask provides a convenient installation path for the
      proprietary desktop client of a large service-oriented music platform. The
      application depends on NetEase accounts, network services, regional licensing, and
      the vendor's catalog rather than operating as a self-contained local player.
  project-history:
    - >
      NetEase launched the NetEase Cloud Music streaming platform in April 2013. It
      combined playback, download, and search functions with recommendations, reviews,
      playlists, and music-focused social interaction.
    - >
      The platform subsequently invested in independent-musician discovery and
      monetization, licensing partnerships, community features, and higher-quality
      playback formats.
  related-projects:
    - >
      The desktop application is a client for the NetEase Cloud Music service and its
      synchronized account library.
    - >
      It occupies the same broad software category as other proprietary streaming
      clients, while concentrating on China's music market and independent-musician
      community.
  sources:
    - >
      https://ir.netease.com/news-releases/news-release-details/netease-cloud-music-and-big-hit-entertainment-team-launch-bts
    - https://ir.netease.com/node/14096
    - https://ir.netease.com/static-files/7eb71727-01dd-46cc-8ff5-955440facc52
    - https://music.163.com/
  summary:
    - >
      NetEase Cloud Music is NetEase's interactive music-streaming service, combining
      licensed playback with recommendations, playlists, comments, social discovery, and
      support for independent musicians.
  timeline:
    - '2013: NetEase Cloud Music launched in April.'
    - '2018: NetEase reported that the service had surpassed 400 million users.'
    - >
      2019: Cloud Village expanded the service's music-community features; NetEase
      reported more than 800 million registered users by year end.
    - '2022: The service introduced Seamless Play and Hi-Res lossless audio.'
    - '2023: Dolby Atmos support was announced across compatible content and devices.'
  usage:
    - >
      Users sign in to stream or download available music, maintain playlists, receive
      personalized recommendations, follow musicians, and participate in comments and
      community features.
    - >
      Catalog availability, downloads, playback quality, and other functions can depend
      on account status, licensing, device support, and region.
