history:
  adoption-history:
    - >
      Dolphie's distribution remains more focused than older database CLIs, but it has
      official installation routes through PyPI, Homebrew, and Docker. Its appeal is
      concentrated among MySQL/MariaDB/ProxySQL operators who want a terminal-native
      monitor without deploying a full web observability stack.
  package-nerd-significance:
    - >
      Dolphie is notable because it packages modern Python TUI ergonomics into the old
      'top for databases' niche. It also treats replay and daemon capture as first-class
      package features, which makes it useful for incident reconstruction rather than
      only live observation.
  project-history:
    - >
      The Dolphie repository was created in September 2022, with a 1.0.0 release the
      following day. The README describes it as a real-time analytics interface for
      MySQL, MariaDB, and ProxySQL and documents both interactive TUI operation and
      daemon-mode recording.
    - >
      By the 6.x series, Dolphie had grown beyond a top-like process viewer into a
      broader troubleshooting tool: dashboard panels, process lists, replication,
      metadata locks, statement summaries, ProxySQL panels, record-and-replay, daemon
      capture, host cache files, tab setup files, and Textual-based UI behavior.
  related-projects:
    - >
      Dolphie sits near tools such as mytop, innotop, PMM-style database monitoring, and
      ProxySQL admin tooling, while using a modern TUI approach and explicit
      MySQL/MariaDB/ProxySQL support.
  sources:
    - https://github.com/charles-001/dolphie#readme
    - https://api.github.com/repos/charles-001/dolphie
    - https://github.com/charles-001/dolphie/releases/tag/1.0.0
    - https://github.com/charles-001/dolphie/releases/tag/6.15.0
  summary:
    - >
      Dolphie is a Python TUI for real-time MySQL, MariaDB, and ProxySQL monitoring,
      positioned as a single-pane operational console for database administrators.
  timeline:
    - '2022: Repository created and 1.0.0 released.'
    - '2025: Project already shipping mature 6.x releases.'
    - '2026: 6.15.0 released, with repository activity continuing into June.'
  usage:
    - >
      Users run dolphie against a MySQL or ProxySQL URI, command-line credentials, MySQL
      option files, login paths, environment variables, or Dolphie config files. The
      README documents precedence across command-line options, credential profiles,
      environment variables, Dolphie config, ~/.mylogin.cnf, and ~/.my.cnf.
related-packages:
  - id: brew:innotop
    reason: >
      Choose innotop for the older, Perl-based top-style MySQL and InnoDB monitor;
      choose Dolphie for a modern TUI with explicit ProxySQL support and session
      recording and replay.
    rel: alternative
    sources:
      - https://github.com/charles-001/dolphie#readme
      - https://github.com/innotop/innotop#readme
