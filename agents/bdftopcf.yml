id: brew:bdftopcf
display-name: bdftopcf
repo: https://gitlab.freedesktop.org/xorg/util/bdftopcf
docs:
  - https://gitlab.freedesktop.org/xorg/util/bdftopcf
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      bdftopcf is adopted wherever traditional X11 bitmap-font tooling is still
      packaged. The input package facts show it in Homebrew, Alpine, Fedora, MacPorts,
      Nix, and openSUSE packaging, reflecting its role as a compatibility and build
      utility rather than an end-user application.
  package-nerd-significance:
    - >
      bdftopcf is package-nerd significant because it is a surviving shard of the X11
      bitmap font toolchain. Its value is mostly infrastructural: font packages, old X
      deployments, reproducible builds, and compatibility stacks need tiny tools like
      this to keep legacy formats buildable.
  project-history:
    - >
      The X.Org manpage carries MIT X Consortium and Open Group copyright notices from
      the 1990s and identifies Keith Packard as the author. The current upstream README
      describes bdftopcf as a font compiler whose output is portable across
      architectures while still allowing fast native reads on the architecture it was
      optimized for.
    - >
      Like many X11 utilities, bdftopcf moved through the modular X.Org era. The
      freedesktop GitLab tag history includes modular-copy and X.Org 7.0-era tags in
      2005, followed by standalone bdftopcf 1.0.x and 1.1.x releases through
      bdftopcf-1.1.2 in 2024.
  related-projects:
    - BDF is the text bitmap font source format converted by the tool.
    - PCF is the compiled bitmap font format produced by the tool.
    - >
      X.Org Server and the historical X font server are the consumers named by the
      upstream README and manpage.
  sources:
    - https://gitlab.freedesktop.org/api/v4/projects/xorg%2Futil%2Fbdftopcf/repository/tags
    - https://gitlab.freedesktop.org/xorg/util/bdftopcf/-/raw/master/README.md
    - https://www.x.org/archive/X11R7.5/doc/man/man1/bdftopcf.1.html
    - source_facts.package-manager
  summary:
    - >
      bdftopcf is a small X.Org utility that compiles BDF bitmap fonts into PCF, the
      Portable Compiled Format used by the X server and X font server. It is not
      glamorous, but it is part of the plumbing that made bitmap font distribution and
      loading practical across architectures.
  timeline:
    - '1990s: bdftopcf is part of the MIT X Consortium/Open Group X11 utility set.'
    - >
      2001: The XFree86/X.Org manpage revisions document the tool and Keith Packard
      authorship.
    - '2005: X.Org modularization tags appear in the upstream history.'
    - '2007: bdftopcf-1.0.1 appears as an early standalone util release.'
    - '2024: bdftopcf-1.1.2 is tagged upstream on freedesktop GitLab.'
  usage:
    - >
      The documented command takes a .bdf font and writes PCF to standard output or an
      output file. Options set glyph padding, scanline unit, bit order, byte order,
      terminal-font conversion, ink-metric handling, and output filename.
related-packages:
  - id: brew:mkfontscale
    reason: >
      Use mkfontscale's mkfontdir command after installing generated PCF files to
      rebuild the fonts.dir index used by the legacy X11 font system.
    rel: adjacent_workflow
    sources:
      - https://www.x.org/archive/X11R7.0/doc/PDF/fonts.pdf
      - https://www.x.org/releases/current/doc/man/man1/mkfontscale.1.xhtml
  - id: brew:xorg-server
    reason: >
      Install X.Org Server when the generated PCF bitmap fonts are intended for an X11
      server environment that consumes traditional X font resources.
    rel: adjacent_workflow
    sources:
      - https://www.x.org/docs/man/man.pdf
      - https://www.x.org/wiki/Documentation
