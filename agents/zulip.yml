  windows:
    - C:\Program Files\Zulip-Desktop-Config\global_config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Early customers continued using Zulip after its acquisition by Dropbox. Following
      the 2015 open-source release, the project quickly attracted contributors and
      users.
    - >
      Kandra Labs launched Zulip Cloud and commercial support for self-hosted
      deployments in 2017. Zulip reports major growth during the 2020 shift to remote
      work and another migration wave after changes to Slack's free plan in 2022.
    - >
      The platform has found a particular audience among open-source projects, research
      groups, educators, and organizations that need searchable, asynchronous technical
      discussions.
  package-nerd-significance:
    - >
      Zulip combines a fully open-source, self-hostable server with official web,
      desktop, mobile, terminal, and API clients. That makes it relevant both as an
      end-user communications package and as infrastructure that administrators can
      operate themselves.
    - >
      Its stream-and-topic conversation model is distinctive among chat systems and is
      especially useful for distributed technical communities with many concurrent,
      long-running discussions.
  project-history:
    - >
      Zulip was created by a Cambridge, Massachusetts startup founded in 2012 by members
      of the team behind Ksplice. Its design drew inspiration from MIT's Zephyr
      messaging community and the BarnOwl client.
    - >
      Dropbox acquired the startup in early 2014 while Zulip was still in private beta.
      Dropbox released the complete product as open-source software in 2015.
    - >
      Tim Abbott founded Kandra Labs in 2016 to steward and finance the project. In
      2026, the project announced the independent nonprofit Zulip Foundation as its new
      steward, with Kandra Labs owned by the foundation.
  related-projects:
    - Zephyr
    - BarnOwl
    - Ksplice
    - Zulip Server
    - Zulip Terminal
    - Slack
    - Matrix
  sources:
    - 'Official desktop-client repository: https://github.com/zulip/zulip-desktop'
    - 'Official open-source overview: https://docs.zulip.com/for/open-source/'
    - 'Official project history: https://docs.zulip.com/history/'
  summary:
    - >
      Zulip is an open-source team communication system that organizes messages into
      channels and fine-grained topics, combining real-time chat with structured
      asynchronous discussion.
  timeline:
    - '2012: The original Zulip company was founded.'
    - '2014: Dropbox acquired Zulip while it was in private beta.'
    - '2015: Dropbox released Zulip as open-source software.'
    - '2016: Kandra Labs was founded to steward and sustain the project.'
    - '2017: Zulip Cloud and commercial support for self-hosted deployments launched.'
    - '2026: The nonprofit Zulip Foundation became steward of the project.'
  usage:
    - >
      People use the desktop client to sign in to one or more Zulip organizations and
      participate in topic-organized discussions with notifications and native desktop
      integration.
    - >
      Organizations can use Zulip Cloud or operate the open-source server themselves.
      Administrators can preconfigure desktop organizations and automatic updates with
      the documented system-wide global_config.json file.
    - >
      The official desktop documentation does not identify a separate user-managed
      credentials file; authentication sessions are managed internally by the
      application.
