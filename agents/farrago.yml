history:
  adoption-history:
    - >
      Farrago found uses beyond conventional radio-style soundboards: Rogue Amoeba
      documents workflows for podcasters, theater technicians, voice chat, VoiceOver,
      MIDI controllers, and TouchOSC. Version 2 was a paid upgrade for existing version
      1 customers.
  package-nerd-significance:
    - >
      Farrago is a polished, Mac-native example of the soundboard category. Package
      users value it for fast keyboard and MIDI triggering, organized sound sets,
      live-performance workflows, and integration with other audio-production tools.
  project-history:
    - >
      Rogue Amoeba began developing Farrago in 2018 and released version 1.0 on January
      24 of that year. It was designed as a modern Swift-based Mac soundboard
      emphasizing rapid keyboard playback.
    - >
      Version 1.2 added MIDI control and multi-tile editing in July 2018. Version 1.5
      refined List view and appearance behavior in 2020. Farrago 2, released in April
      2023, was the first paid major upgrade and added a redesigned interface, emoji
      tile art, search, an audio editor, smart and lockable sets, secondary windows, and
      integrated searches of Freesound and Apple loops.
  related-projects:
    - >
      Rogue Amoeba's documentation describes podcast workflows involving Audio Hijack.
      Farrago can also search Apple loops supplied by GarageBand and Logic Pro and
      online sounds from Freesound.org.
  sources:
    - >
      Official historical screenshot gallery:
      https://rogueamoeba.com/support/knowledgebase/?showArticle=Farrago-Screenshot-Gallery
    - 'Official manual: https://rogueamoeba.com/support/manuals/farrago/'
    - >
      Official support center:
      https://rogueamoeba.com/support/knowledgebase/?showCategory=Farrago
  summary:
    - >
      Farrago is Rogue Amoeba's commercial soundboard application for macOS. It provides
      quick playback of sound effects, music, and other clips using grid- or
      list-oriented sound sets.
  timeline:
    - '2018-01-24: Farrago 1.0 released.'
    - '2018-04-27: Version 1.1 added a dark theme.'
    - '2018-07-12: Version 1.2 added MIDI support and multi-tile editing.'
    - '2020-04-17: Version 1.5 substantially revised List view.'
    - '2023-04-13: Farrago 2.0 released as the first paid major upgrade.'
    - '2023-09-08: Version 2.0.5 added a permissions window.'
  usage:
    - >
      Podcasters use Farrago to trigger music and effects during recordings, while
      theater operators use it to cue live-performance audio. Users can arrange clips
      into sound sets, trigger them from the keyboard or MIDI hardware, and work in
      either a freeform grid or an ordered list.
