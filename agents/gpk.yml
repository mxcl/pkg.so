id: brew:gpk
display-name: GlazePKG
repo: null
docs:
  - https://github.com/neur0map/glazepkg#readme
config-file-location:
  unix:
    - ~/.config/glazepkg/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      The official README documents distribution through Homebrew, the Arch User
      Repository, Nix, Go installation, and prebuilt binaries for macOS, Linux, and
      Windows. It supports 46 package managers across native and language-specific
      ecosystems.
  package-nerd-significance:
    - >
      GlazePKG is aimed directly at polyglot package-manager users: it provides one
      inventory and operational interface over otherwise separate package databases,
      while leaving upgrades to the package manager that owns each installation.
  project-history:
    - >
      GlazePKG was developed by neur0map as the official package manager interface for
      RyokuArch and expanded into a cross-platform TUI and CLI for viewing and operating
      on packages from many independent managers.
  related-projects:
    - RyokuArch is the distribution with which GlazePKG is officially associated.
    - >
      Supported ecosystems include Homebrew, APT, pacman/AUR, Nix, npm, pip, Cargo, Go,
      Flatpak, and many others.
  sources:
    - 'Official README: https://github.com/neur0map/glazepkg#readme'
    - 'Official maintainer profile: https://github.com/neur0map'
  summary:
    - >
      GlazePKG is a cross-platform terminal interface that inventories packages
      installed by many package managers and can search, install, upgrade, remove,
      snapshot, and compare them from one interface.
  timeline:
    - GlazePKG originated as the official package-management interface for RyokuArch.
    - The project grew to support macOS, Linux, and Windows and dozens of package managers.
  usage:
    - >
      Users run `gpk` to browse installed software, inspect dependencies and help
      output, search available packages, perform package operations, and record
      snapshots of system package state.
    - >
      Persistent caches, notes, snapshots, and exports are stored below
      `~/.local/share/glazepkg/`, or the corresponding `XDG_DATA_HOME` location; these
      are application data rather than a documented configuration file.
related-packages:
  - id: brew:meta-package-manager
    reason: >
      Choose Meta Package Manager when you prefer a Python-based, scriptable command
      that normalizes inventory, search, upgrade, and backup operations across many
      managers without a TUI-first design.
    rel: alternative
    sources:
      - https://github.com/neur0map/glazepkg#readme
      - https://kdeldycke.github.io/meta-package-manager/
  - id: brew:topgrade
    reason: >
      Choose Topgrade when your primary goal is running updates across many package
      managers and developer tools, rather than GlazePKG's broader inventory,
      installation, removal, snapshot, and TUI workflows.
    rel: alternative
    sources:
      - https://github.com/neur0map/glazepkg#readme
      - https://github.com/topgrade-rs/topgrade#readme
