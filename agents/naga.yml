id: brew:naga
display-name: naga
repo: null
docs:
  - https://github.com/anayjoshi/naga
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      There is no strong evidence of broad adoption. On July 1, 2026 the GitHub API
      showed 5 stars and 1 fork. Homebrew reported 43 installs over 365 days. This looks
      like a niche or historical CLI game package kept available because it builds and
      has a simple standalone binary.
  package-nerd-significance:
    - >
      Its significance is mostly as a naming collision and package-catalog
      disambiguation case. Without context, `naga` may mean the terminal game, the Rust
      shader translation library, or the `naga` binary installed by `naga-cli`.
  project-history:
    - >
      The available source history is thin: a C terminal game repository, BSD-3-Clause
      license, a 1.0 release, and repository activity that appears to have stopped after
      a push on November 4, 2015. The Homebrew formula installs version 1.0 and
      conflicts with `naga-cli` because both install a binary named `naga`.
  related-projects:
    - naga-cli
  sources:
    - https://api.github.com/repos/anayjoshi/naga
    - https://api.github.com/repos/anayjoshi/naga/releases/latest
    - https://formulae.brew.sh/api/formula/naga.json
    - https://formulae.brew.sh/formula/naga
    - https://github.com/anayjoshi/naga
  summary:
    - >
      This `brew:naga` is the small terminal Snake game by Anay Joshi, not the Rust
      shader translator. Its GitHub repository was created on June 8, 2014, and the only
      GitHub release is `naga-v1.0`, also published on June 8, 2014 with the release
      name `Naga is born!`.
  timeline:
    - '2014-06-08: GitHub repository created.'
    - '2014-06-08: `naga-v1.0` release published.'
    - '2015-11-04: last pushed timestamp reported by the GitHub API.'
    - '2026-07-01: GitHub API showed 5 stars and Homebrew API showed 43 installs over 365 days.'
  usage:
    - >
      The practical use is simply launching `naga` in a terminal to play Snake. Package
      maintainers mostly need to care about the binary-name conflict with `naga-cli`,
      since the shader translation CLI is a much more active package with the same
      executable name.
related-packages:
  - id: brew:nsnake
    reason: >
      nSnake is another ncurses terminal Snake game, but adds customizable controls,
      appearance, levels, and multiple game modes for users wanting more than naga's
      minimal play loop.
    rel: alternative
    sources:
      - https://github.com/anayjoshi/naga
      - https://github.com/alexdantas/nSnake
