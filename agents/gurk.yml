history:
  adoption-history:
    - >
      The README documents installation through GitHub release binaries, `cargo
      binstall`, `cargo install --git`, Arch Linux packages, Nix/NixOS, and FreeBSD
      packages or ports. Homebrew and Arch package metadata make it available as a named
      package for terminal and messaging users.
    - >
      Its adoption is necessarily niche: it is useful to users who want Signal in a
      terminal workflow and are comfortable with linked-device semantics, local
      configuration, and terminal keybindings.
  package-nerd-significance:
    - >
      gurk is notable as a package because it sits at an awkward boundary: a Rust TUI
      application with Signal protocol dependencies that cannot use the ordinary
      crates.io binary path. That pushes distributors toward GitHub releases, git-based
      Cargo installs, and OS package recipes.
    - >
      For terminal users, it is an example of packaging a messaging client as a
      keyboard-first command rather than a desktop application.
  project-history:
    - >
      The GitHub repository was created in July 2020, and an early v0.2.0 release was
      published in July 2021. The README describes first-run linking through a QR code,
      after which the program creates a configuration file at the default config
      location.
    - >
      The project cannot publish its binary through crates.io according to the README
      because it depends on official Signal libraries that are not available there, so
      distribution relies on release binaries, source installs, and OS package managers.
  related-projects:
    - Signal Messenger is the service and protocol ecosystem gurk connects to.
    - presage is referenced by the README as a related Signal client library.
    - >
      libsignal-related libraries are part of the dependency reason the binary is not
      published on crates.io.
  sources:
    - https://api.github.com/repos/boxdot/gurk-rs
    - https://api.github.com/repos/boxdot/gurk-rs/releases?per_page=100
    - https://github.com/boxdot/gurk-rs
    - https://raw.githubusercontent.com/boxdot/gurk-rs/main/README.md
  summary:
    - >
      gurk is a terminal Signal Messenger client written in Rust. It provides a text UI
      for linked-device Signal use and stores its configuration in `gurk.toml` under
      XDG-style or home-directory paths.
  timeline:
    - '2020: GitHub repository created.'
    - '2021: v0.2.0 release published.'
  usage:
    - >
      Users run `gurk`, link it as a Signal device via QR code on first launch, and then
      interact through keyboard-driven channel, message, selection, file upload, URL,
      reaction, mute, and help commands.
    - >
      Configuration supports custom keybindings and default-keybinding control in
      `gurk.toml`; the same config locations may contain sensitive linked-client
      settings, which is why credentials and configuration locations are the same for
      curation purposes.
related-packages:
  - id: brew:signal-cli
    reason: >
      Choose signal-cli when the same Signal account needs a scriptable command,
      JSON-RPC, or D-Bus interface instead of gurk's interactive terminal UI.
    rel: alternative
    sources:
      - https://github.com/boxdot/gurk-rs
      - https://github.com/AsamK/signal-cli
