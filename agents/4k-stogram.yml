history:
  adoption-history:
    - >
      4K Download distributed Stogram for Windows, macOS, and Linux and reports more
      than one million users and over ten years of operation. Its appeal centered on
      bulk download, automatic subscription updates, and local backup of Instagram
      content.
    - >
      Instagram increasingly restricted the unofficial interaction patterns on which the
      application depended. 4K Download ultimately discontinued development after
      concluding that it could not guarantee reliable operation or account safety.
      Existing free installations and previously unlocked premium features remain
      usable, but the company no longer supplies updates, fixes, or support.
  package-nerd-significance:
    - >
      4K Stogram is an instructive example of a packaged desktop client whose
      reliability depends on an evolving, externally controlled service. Its Homebrew
      cask remains useful for installing the final application, but package availability
      cannot restore compatibility when Instagram changes its behavior.
  project-history:
    - >
      4K Stogram was developed as a desktop Instagram viewer, downloader, and backup
      tool. By 2017 it supported sorting, pinned accounts, and story-only downloads;
      later releases added private-account access, Stories, Highlights, Reels, tagged
      and saved posts, subscription import and export, and automatic updates.
    - >
      Version 4.2 in 2021 made in-app Instagram login mandatory. Releases through 4.8 in
      February 2024 repeatedly adjusted authorization, pacing, and device behavior in
      response to Instagram limits and challenges. The official product record
      identifies 4.9, dated May 18, 2024, as the last release before support was
      discontinued.
  related-projects:
    - 4K Tokkit applies a related subscription-and-download workflow to TikTok.
    - >
      Other 4K Download applications share the same vendor, licensing approach, and
      desktop distribution model.
  sources:
    - >
      Official 4.2 announcement:
      https://www.4kdownload.com/blog/2021/12/21/introducing-new-4k-stogram-release--1/
    - >
      Official 4.8 announcement:
      https://www.4kdownload.com/blog/2024/02/16/4k-stogram-released-no-more-authorisation-errors-but-many-improvements/
    - >
      Official discontinuation explanation:
      https://www.4kdownload.com/faq/faq-why-is-stogram-discontinued
    - 'Official product page: https://www.4kdownload.com/products/stogram-8'
  summary:
    - >
      4K Stogram is a discontinued desktop downloader and viewer for Instagram photos,
      videos, Reels, Stories, Highlights, accounts, hashtags, and locations. It can
      still be installed and used, but its vendor no longer updates or supports it.
  timeline:
    - >
      2017: Documented updates added post sorting, pinned accounts, manual ordering, and
      story-only downloads.
    - >
      2021: Version 4.2 required in-app Instagram login and added proxy and
      backup-related features.
    - >
      2024: Versions 4.8 and 4.9 were released amid continuing authorization and
      service-limit problems.
    - >
      After 2024: 4K Download discontinued updates, fixes, sales of new premium
      licenses, and user support.
  usage:
    - >
      Users search for an Instagram account, hashtag, or location, select content types
      and date ranges, and download media locally. The application can maintain
      subscriptions, back up an account, and export or import its subscription database.
      Because support is discontinued, users should expect breakage and heed the
      vendor's warning that Instagram interactions may put accounts at risk.
