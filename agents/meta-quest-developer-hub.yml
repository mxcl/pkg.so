history:
  adoption-history:
    - >
      MQDH became part of Meta's supported Quest development workflow across Unity,
      Unreal, native Android, and related XR tooling. Meta documentation recommends it
      for managing test headsets and deploying builds.
  package-nerd-significance:
    - >
      MQDH consolidates several command-line and device-side Quest tasks into a
      vendor-supported desktop application. For package-manager users, the cask provides
      a reproducible way to install a central component of the Quest build-test-debug
      loop.
  project-history:
    - >
      Meta Quest Developer Hub, commonly abbreviated MQDH, is Meta's desktop companion
      application for Meta Quest development. Earlier official material described it in
      the Oculus development ecosystem; current documentation positions it within Meta
      Horizon OS development.
  related-projects:
    - >
      MQDH works with Meta Quest headsets, Android Debug Bridge, Meta XR SDKs, Meta XR
      Simulator, Unity, Unreal Engine, and the Meta Horizon Developer Dashboard.
  sources:
    - >
      Official MQDH XR project guide:
      https://developers.meta.com/horizon/documentation/android-apps/ts-mqdh-xr-projects/
    - >
      Official MQDH headset setup guide:
      https://developers.meta.com/horizon/documentation/unreal/ts-mqdh-device-setup/
    - >
      Official Meta glossary:
      https://developers.meta.com/horizon/documentation/unity/glossary/
    - >
      Official Unity development overview:
      https://developers.meta.com/horizon/documentation/unity/unity-development-overview/
  summary:
    - >
      Meta Quest Developer Hub is Meta's desktop companion application for configuring
      Quest development headsets and managing deployment, debugging, capture, casting,
      performance, SDK, and publishing workflows.
  timeline:
    - >
      2022: Official Oculus-era material described Developer Hub as a standalone
      companion tool in the Quest development workflow.
    - >
      2026: Meta documentation continued to expand MQDH guidance for headset setup,
      debugging, performance analysis, and project creation.
  usage:
    - >
      Developers connect a Quest headset, configure it for development, deploy
      application builds, inspect logs, collect Perfetto traces, capture screenshots or
      video, cast the headset display, obtain tools and SDKs, and upload builds for
      distribution. A Meta Horizon developer account is required for account-backed
      device setup.
