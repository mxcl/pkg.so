history:
  adoption-history:
    - >
      ODE is distributed for Windows, macOS, and Linux, with AppImage and Debian
      packages available for Linux. Its documentation presents use cases in agriculture,
      climate, data journalism, government, finance, heritage, and libraries.
    - >
      The project positions itself as privacy-conscious, free, and open source, lowering
      the barrier to Frictionless-style validation for users who do not work from code
      or command-line tools.
  package-nerd-significance:
    - >
      ODE packages the Frictionless Data approach into a desktop GUI. For data-tooling
      users, it is a bridge between spreadsheet workflows and reproducible validation,
      metadata, and publication practices.
  project-history:
    - >
      The Open Knowledge Foundation developed Open Data Editor as a no-code desktop
      application for exploring, validating, editing, and publishing tabular data. The
      project is built around the Frictionless Framework and remains identified as beta
      in its official repository.
    - >
      The documentation subsequently expanded beyond basic validation into FAIR-data
      guidance, responsible AI, metadata editing, publication workflows, technical
      documentation, and geographically diverse use cases.
  related-projects:
    - Frictionless Framework supplies the underlying data tooling and validation concepts.
    - Frictionless Data provides the broader standards and ecosystem context.
    - >
      The official documentation compares ODE with Data Check, IATI Validator, CSV Lint,
      360Giving Data Quality Checker, and Data Curator.
  sources:
    - https://github.com/okfn/opendataeditor#readme
    - https://okfn.org/en/projects/open-data-editor/
    - https://opendataeditor.okfn.org/
  summary:
    - >
      Open Data Editor, commonly abbreviated ODE, is an OKFN desktop application that
      gives non-programmers a graphical workflow for finding and correcting errors in
      tabular data, managing metadata, and exporting or publishing results.
  timeline:
    - >
      The official repository labels the application beta and documents cross-platform
      release artifacts.
    - >
      2025: The current official documentation set identifies Open Knowledge Foundation
      as its publisher and consolidates user, technical, and contributor guidance.
  usage:
    - >
      Open a CSV, Excel file, folder, or supported online table; inspect automatically
      detected structural and type errors; edit affected cells and metadata; then export
      the corrected data or use a documented publication workflow.
    - >
      An optional local AI component can assist with supported tasks. The official
      repository documents environment variables for overriding its model name, URL, and
      filename.
