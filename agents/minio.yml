history:
  adoption-history:
    - >
      A major governance milestone came in 2021, when MinIO announced that the project
      had moved fully to the GNU AGPLv3 license. That change affected how downstream
      users and vendors evaluated embedding and redistribution, and it explains why
      package records for the server tend to track licensing carefully. Homebrew
      packaged the server as `minio`, including a service definition that runs `minio
      server` on port 9000 with data under the Homebrew prefix; its formula later marked
      the package deprecated on 2026-02-17 because the upstream repository was archived.
  project-history:
    - >
      The project positioned itself against heavier storage stacks by making the S3 API
      the common interface for data outside AWS. MinIO's server, client tooling, and SDK
      ecosystem let operators run object storage on bare metal, virtual machines,
      containers, and Kubernetes, while applications keep using familiar S3 semantics.
      Dell Technologies Capital described the company's early appeal as recognizing the
      move from Hadoop-style storage toward disaggregated S3-style storage across
      multi-cloud environments.
  sources:
    - https://formulae.brew.sh/api/formula/minio.json
    - https://formulae.brew.sh/formula/minio
    - https://github.com/minio/minio
    - https://www.delltechnologiescapital.com/resources/a-milestone-series-b-for-minio
    - https://www.min.io/about
    - >
      https://www.min.io/blog/from-open-source-to-free-and-open-source-minio-is-now-fully-licensed-under-gnu-agplv3
  summary:
    - >
      MinIO was founded in 2014 by Garima Kapoor, Anand Babu "AB" Periasamy, and
      Harshavardhana as a cloud-native object-storage company. The open-source server
      became known for a deliberately small, S3-compatible object store written in Go,
      aimed at unstructured-data workloads such as analytics, AI/ML pipelines, backups,
      logs, container images, and private-cloud storage.
  usage:
    - >
      In package-manager terms, `minio` is the local-server side of the S3-compatible
      storage niche: useful for developers who need a real object store on a laptop, CI
      host, or lab machine, and for operators testing workflows before moving to larger
      MinIO deployments or another S3-compatible backend.
related-packages:
  - id: brew:minio-mc
    reason: >
      Use MinIO Client as the official shell companion for creating aliases,
      transferring objects, and administering a MinIO server.
    rel: adjacent_workflow
    sources:
      - https://github.com/minio/minio#test-using-minio-client-mc
      - https://github.com/minio/mc#readme
  - id: brew:minio-warp
    reason: >
      Use Warp to measure the throughput, latency, consistency, and capacity limits of a
      MinIO deployment through its S3 endpoint.
    rel: adjacent_workflow
    sources:
      - https://docs.min.io/warp/
      - https://github.com/minio/warp#readme
