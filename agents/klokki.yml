history:
  adoption-history:
    - >
      The product attracted freelancers and makers who wanted timers to react to their
      working context instead of requiring constant manual control. The official site
      says thousands of users adopted it and highlights Jira integration, reporting,
      billable-hour calculation, backups, offline operation, and macOS-native
      interaction.
    - >
      Development later slowed as the small team balanced full-time employment and
      family obligations. The maker now states that Klokki and Klokki Slim remain
      downloadable in their current form but receive no updates or support pending a
      possible ground-up successor.
  package-nerd-significance:
    - >
      Klokki exemplifies a polished independent macOS utility whose binary distribution
      remains easy to automate through Homebrew Cask even after active support pauses.
      Its local-first data model, contextual automation rules, and menu-bar design
      appeal to users who prefer focused native tools over browser-based time-tracking
      suites.
  project-history:
    - >
      Klokki emerged from a company split involving maker Stas Moor and a former
      co-founder. Moor enlisted a longtime collaborator to re-release and improve the
      application, but development gradually slowed and ultimately stopped. The official
      open letter says a future reimagining may return with time tracking still at its
      core, although no schedule has been announced.
  related-projects:
    - Klokki Slim is a related edition that remains available in its existing form.
    - Jira Cloud and Jira Server can synchronize tasks and tracked time with Klokki.
  sources:
    - https://klokki.com/download/Klokki.html
    - https://www.klokki.com/index.html
  summary:
    - >
      Klokki is a native macOS time tracker that can start and stop timers automatically
      in response to user-defined work rules.
  timeline:
    - '2019: Official privacy policy took effect.'
    - '1.3.7: Maintenance release fixed crashes and added in-app license reactivation.'
    - >
      Current status: Klokki and Klokki Slim remain available without updates or
      support; a future rebuild is contemplated but unscheduled.
  usage:
    - >
      Users select a task and define a rule based on their work context; Klokki starts
      the timer when the rule matches. It also supports manual menu-bar control, idle
      detection, billable rates, reports, keyboard shortcuts, Jira synchronization,
      imports, and automatic backups. The official site says tracked data stays on the
      user's Mac.
