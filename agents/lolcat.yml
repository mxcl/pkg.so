history:
  adoption-history:
    - >
      lolcat has broad package-manager presence for a toy CLI. The supplied package
      facts list Alpine, Homebrew, Debian, Fedora, MacPorts, Nix, Arch, and Ubuntu
      packages.
    - >
      The official repository's star and fork counts show unusually high recognition for
      such a small utility, reflecting its spread through terminal screenshots, shell
      demos, and dotfile culture.
  package-nerd-significance:
    - >
      lolcat is package-nerd significant because it is pure terminal whimsy that became
      a real cross-distro package. It is often installed not because it is necessary,
      but because it makes pipelines, demos, and shell prompts visibly fun.
  project-history:
    - >
      The official GitHub repository was created in August 2011. The README is minimal,
      showing the tool's visual output and installation commands for Linux and macOS
      rather than presenting a large manual.
    - >
      The package follows the classic Unix filter pattern: install a small executable
      and pipe text through it to transform output. Its implementation is Ruby-only, and
      the repository includes a gemspec and man page alongside the `bin` and `lib`
      directories.
  related-projects:
    - >
      lolcat is related to ANSI terminal color filters and shell-demo utilities, and is
      commonly combined with ordinary Unix commands through pipes.
  sources:
    - https://api.github.com/repos/busyloop/lolcat
    - https://github.com/busyloop/lolcat#readme
    - source_facts.package-manager
  summary:
    - >
      lolcat is a small Ruby command-line program for coloring terminal output with
      rainbow ANSI colors. Its upstream description is intentionally playful: 'Rainbows
      and unicorns!'
  timeline:
    - '2011: Official GitHub repository created.'
    - '2010s: lolcat spreads across common Unix-like package managers.'
    - '2024: Official repository activity continues on GitHub.'
  usage:
    - >
      Users typically pipe command output through `lolcat` to add rainbow color, or call
      `lolcat` directly on text files. The Homebrew package exposes the `lolcat`
      executable.
    - >
      Because lolcat is cosmetic and does not manage state, it has no official config
      file or credentials file location.
related-packages:
  - id: brew:lolcrab
    reason: >
      Choose lolcrab for a Rust-based colorizer with configurable gradients,
      OpenSimplex-style noise, and animation; its official documentation explicitly
      describes it as like lolcat but more colorful.
    rel: alternative
    sources:
      - https://github.com/mazznoer/lolcrab#readme
      - https://github.com/busyloop/lolcat#readme
  - id: brew:boxes
    reason: >
      Use boxes after or alongside lolcat when you want colored text enclosed in
      ASCII-art frames; the official boxes manual specifically directs users to lolcat
      for automatic coloring.
    rel: adjacent_workflow
    sources:
      - https://boxes.thomasjensen.com/boxes-man-1.html
      - https://github.com/busyloop/lolcat#readme
