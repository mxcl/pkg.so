    - source_facts.description identifies Little Snitch as a host-based application firewall.
  display-name-sources:
    - Objective Development's product site and official manual use the name Little Snitch.
    - source_facts.applications lists Little Snitch.app.
  docs-sources:
    - Objective Development publishes the official Little Snitch 6 manual and support center.
    - The official backup guide documents the active configuration storage format and path.
  history-sources:
    - https://help.obdev.at/littlesnitch6/intro-whatis
    - https://help.obdev.at/littlesnitch6/lsc-backup
    - https://www.obdev.at/products/littlesnitch/download-previous-versions.html
    - https://www.obdev.at/products/littlesnitch/index.html
    - https://www.obdev.at/products/littlesnitch/releasenotes.html
  repo-sources:
    - >
      Repositories for Little Snitch for Linux are a separate product and are not
      returned for this macOS cask.
    - >
      The macOS product is proprietary according to Objective Development's official
      manual, and no official public source-control repository for the macOS application
      is linked: https://help.obdev.at/littlesnitch6/intro-whatis
  tags-sources:
    - >
      The official manual documents application-aware firewall rules, interactive
      connection control, blocklists, profiles, and historical network analysis:
      https://help.obdev.at/littlesnitch6/intro-whatis
