  - https://www.obdev.at/support/littlesnitch
config-file-location:
  macos:
    - /Library/Application Support/Objective Development/Little Snitch/configuration6.xpl
credentials-file-location: null
history:
  adoption-history:
    - >
      Little Snitch became a long-running macOS power-user and privacy tool by making
      otherwise invisible outbound application connections visible and controllable. Its
      interactive connection alerts established a recognizable workflow for
      per-application network policy.
    - >
      Successive macOS security-model changes moved the product from older kernel-level
      components toward Apple's modern network-extension architecture while preserving
      rules, profiles, monitoring, and upgrade paths across major releases.
  package-nerd-significance:
    - >
      Little Snitch is one of the canonical macOS application firewalls and a frequent
      post-install package for users who want outbound-connection visibility.
      Package-focused users care about its privileged components, signed installer,
      OS-version compatibility, persistent rule database, and explicit backup and
      restore support.
    - >
      Its human-readable .lsbackup export and command-line administration features also
      make it relevant to fleet management, reproducible setups, and configuration
      auditing despite the main product being proprietary.
  project-history:
    - >
      Objective Development has maintained Little Snitch for more than two decades.
      Early 1.x releases supported the Jaguar-era Mac OS X generation; later major
      versions added richer rule management, profiles, Network Monitor, traffic history,
      blocklists, encrypted DNS, and enterprise deployment features.
    - >
      Little Snitch 6 unified rule management and network analysis in the Little Snitch
      app and stores its active rule set and settings in an encrypted configuration
      file. The product remains proprietary but offers a recurring demo mode and a
      time-limited Network Monitor trial.
  related-projects:
    - Little Snitch Network Monitor visualizes current and historical connection activity.
    - >
      Objective Development also publishes Little Snitch for Linux, but that is a
      distinct platform product with different configuration paths and should not be
      confused with this macOS cask.
  sources:
    - https://help.obdev.at/littlesnitch6/intro-whatis
    - https://help.obdev.at/littlesnitch6/lsc-backup
    - https://www.obdev.at/products/littlesnitch/download-previous-versions.html
    - https://www.obdev.at/products/littlesnitch/index.html
    - https://www.obdev.at/products/littlesnitch/releasenotes.html
  summary:
    - >
      Little Snitch is Objective Development's macOS application firewall and network
      monitor, providing per-process connection rules, interactive alerts, profiles,
      blocklists, and historical traffic analysis.
  timeline:
    - 'Early 2000s: Little Snitch 1.x supported early Mac OS X releases including Jaguar.'
    - >
      2024: Little Snitch 6 introduced the current major-generation configuration and
      monitoring experience.
    - >
      Subsequent 6.x releases continued adapting the firewall to new macOS releases and
      adding privacy and analysis features.
  usage:
    - >
      When an uncovered connection occurs, Little Snitch can pause it and ask the user
      to allow or deny it. Users can create persistent or temporary rules, organize
      rules into profiles, subscribe to blocklists, and inspect live or historical
      traffic.
    - >
      The encrypted active configuration is stored at /Library/Application
      Support/Objective Development/Little Snitch/configuration6.xpl. Users can create
      portable, human-readable .lsbackup exports from the application; the encryption
      key for the internal configuration is held in the macOS System keychain rather
      than a documented credentials file.
tags:
