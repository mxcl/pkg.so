history:
  adoption-history:
    - >
      File Roller's adoption is tied to GNOME desktops and distributions that package
      GNOME applications. The supplied package metadata shows it packaged across
      Homebrew, Debian, Ubuntu, Fedora, Arch, Alpine, MacPorts, Nix, and openSUSE.
    - >
      Its role in packaging is slightly different from command-line archivers:
      distributions ship File Roller as a desktop archive UI, while the actual
      compression and extraction capabilities depend on helper programs and optional
      libraries such as libarchive and unarchiver backends.
  package-nerd-significance:
    - >
      File Roller is package-nerd significant because it is the GNOME desktop layer over
      a pile of archive formats and helper utilities. It exposes old and new compression
      formats to ordinary users while forcing packagers to keep format support, MIME
      integration, Nautilus integration, translations, and sandboxed desktop behavior
      working together.
    - >
      Its NEWS history also captures the maintenance burden of desktop archive managers:
      parsing hostile or unusual archives, password retries, multi-volume archives,
      mounted volumes, cloud-provider paths, Flatpak manifests, and platform toolkit
      transitions.
  project-history:
    - >
      The official README defines File Roller as an archive manager for the GNOME
      environment and emphasizes that it is a frontend to archiving programs such as tar
      and zip. It supports creating and modifying archives, viewing archive contents,
      viewing or modifying files inside archives, and extracting files.
    - >
      The NEWS file records a long GNOME application history beginning with version 0.1
      as the first public version. Early releases quickly added JAR, RAR, LHA,
      drag-and-drop, wildcard operations, compressed single-file support,
      non-interactive modes, and Nautilus integration. Version 1.101 ported the
      application to GNOME 2, while the later 44.alpha release ported it to GTK4.
    - >
      Modern File Roller maintenance tracks GNOME platform changes and archive-format
      churn. Recent NEWS entries include bzip3 support, updated Flatpak packaging,
      native app chooser changes, rar parsing fixes, Google Drive filename fixes, and
      many translation updates.
  related-projects:
    - >
      File Roller is related to GNOME Files/Nautilus integration, tar, zip, 7zip, rar,
      libarchive, unarchiver backends, Flatpak packaging, and the broader GNOME
      application stack.
  sources:
    - https://gitlab.gnome.org/GNOME/file-roller
    - https://gitlab.gnome.org/GNOME/file-roller/-/raw/master/README.md
    - https://gitlab.gnome.org/GNOME/file-roller/-/raw/master/NEWS
  summary:
    - >
      File Roller is GNOME's archive manager, a graphical frontend for creating,
      inspecting, modifying, and extracting archives through underlying archiving tools.
  timeline:
    - '0.1: First public version.'
    - >
      0.8: Adds compressed single-file support, non-interactive add mode, and Nautilus
      scripts.
    - '1.101: Ports to GNOME 2.'
    - '2024: 44.alpha ports File Roller to GTK4.'
    - '2024: 44.4 adds bzip3 support and file-selector improvements.'
    - '2026: 44.7 includes parsing, Flatpak, metadata, and translation fixes.'
  usage:
    - >
      The README describes File Roller as able to create and modify archives, view
      archive contents, view or modify files inside an archive, and extract files. It
      supports many common and legacy archive formats, including 7z, zip, tar variants,
      rar, cab, cpio, deb and rpm in read-only mode, ISO images, Java archive formats,
      and single-file compression formats.
    - >
      For users, the important operational detail is that File Roller is a graphical
      frontend. Package maintainers therefore care about both the GNOME libraries it
      builds against and the command-line archivers or optional backends installed
      alongside it.
