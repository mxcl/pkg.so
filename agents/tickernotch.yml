history:
  adoption-history:
    - >
      TickerNotch is distributed as a direct, signed macOS download and through
      supported storefront editions. Its free tier keeps a limited set of tickers,
      weather, social, news, alert, and menu-bar-pin features active after the
      full-feature trial.
  package-nerd-significance:
    - >
      TickerNotch illustrates a newer class of Mac utilities that treats the display
      notch as usable information space. For package-manager users it combines several
      traditionally separate menu-bar tools—market monitors, weather widgets, RSS
      tickers, social counters, and system meters—behind one install.
  project-history:
    - >
      BitVibe Labs, operated by independent developer John Farmakis, created TickerNotch
      as a macOS information strip for the space around a MacBook notch. The official
      privacy notice and guide document the product in 2026.
  related-projects:
    - The iPhone edition, which places live information in the Dynamic Island.
    - Open-Meteo, used for weather readings.
    - >
      Sparkle, whose appcast mechanism is used by the direct-download edition for update
      checks.
  sources:
    - https://bitvibelabs.com/tickernotch/
    - https://bitvibelabs.com/tickernotch/help/
    - https://bitvibelabs.com/tickernotch/privacy/
  summary:
    - >
      TickerNotch is a macOS notch and menu-bar utility for market tickers, weather,
      social counters, system metrics, RSS news, charts, holdings, and alerts.
  timeline:
    - >
      2026: TickerNotch's official product documentation and privacy notice identify
      BitVibe Labs as its publisher.
    - '2026: The product offered direct-download, storefront, free-tier, and paid editions.'
  usage:
    - >
      Users add market symbols, cities, social handles, and RSS feeds to strips beside
      the MacBook notch, with selected values optionally pinned to the menu bar. The app
      also supports market charts and alerts, local system metrics, configurable
      layouts, and a simulated notch for other displays.
