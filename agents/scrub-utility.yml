history:
  adoption-history:
    - >
      Scrub has been maintained within the Eclectic Light Company's collection of free
      macOS utilities and updated across successive macOS generations, including the
      transition to universal Intel and Apple-silicon builds. No authoritative usage
      totals are published.
  package-nerd-significance:
    - >
      Scrub packages a collection of otherwise specialized metadata and privacy-cleaning
      operations into a native Mac application. It is notable for treating sanitization
      as an auditable, deliberately destructive workflow rather than as routine cache
      cleaning.
  project-history:
    - >
      Howard Oakley developed Scrub to remove hidden information that could leak details
      from sensitive files, folders, or removable volumes. The developer wrote in
      September 2019 that the utility had been under development for more than a year
      before its first full 1.0 release.
    - >
      Later releases expanded operating-system compatibility and improved handling of
      extended attributes while retaining the two-phase audit-then-clean design.
  related-projects:
    - >
      Scrub is distributed alongside the Eclectic Light Company's other macOS system
      utilities, including SilentKnight, SystHist, Skint, and LockRattler.
  sources:
    - >
      Developer's Scrub 1.0 article:
      https://eclecticlight.co/2019/09/12/how-scrub-1-0-can-help-protect-your-privacy/
    - 'Official product page: https://eclecticlight.co/lockrattler-systhist/'
  summary:
    - >
      Scrub is a macOS privacy utility that audits and removes extended attributes,
      metadata, document versions, caches, logs, and timestamps that may disclose
      sensitive information.
  timeline:
    - >
      2018: Development was underway by this period, according to the developer's 2019
      retrospective.
    - '2019: Scrub 1.0 was released as the first full version.'
    - '2020: Scrub became a universal application supporting Intel and Apple-silicon Macs.'
    - >
      2023: Scrub 1.3 expanded support through macOS Sonoma and improved
      extended-attribute handling.
  usage:
    - >
      Users first audit a selected document, folder, or volume to identify what Scrub
      would remove and any associated risks, then explicitly run the cleaning phase.
    - >
      The developer warns that removal cannot be undone and that applying Scrub
      broadly—for example, to an entire home directory—can cause serious damage or data
      loss. A typical intended use is sanitizing removable media containing sensitive
      documents.
