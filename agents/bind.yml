id: brew:bind
display-name: BIND 9
repo: https://gitlab.isc.org/isc-projects/bind9
docs:
  - https://bind9.readthedocs.io/
  - https://www.isc.org/bind
config-file-location:
  unix:
    - /etc/named.conf
    - /usr/local/etc/namedb/named.conf
credentials-file-location: null
history:
  adoption-history:
    - >
      BIND's adoption is bound to the adoption of DNS itself. ISC describes BIND 9 as
      the first, oldest, and most commonly deployed DNS solution, and says it is used
      for publishing the DNSSEC-signed root zone, top-level domains, hosting providers,
      enterprises, and large resolver farms. The input package facts show BIND packaged
      across major Unix and cross-platform package managers.
  package-nerd-significance:
    - >
      BIND is package-nerd bedrock: one package contains a daemon that helped define
      Internet infrastructure operations and a CLI toolkit that generations of sysadmins
      treat as diagnostic muscle memory. Its packaging also carries distro policy
      decisions about chrooting, service managers, default paths, crypto libraries,
      DNSSEC defaults, and whether users install the full server just to get `dig`.
  project-history:
    - >
      ISC's official BIND history says Berkeley Internet Name Domain began in the early
      1980s at UC Berkeley as a DARPA-funded graduate-student project. After UC
      Berkeley, DEC and Paul Vixie carried major stewardship, and ISC was founded in
      1994 specifically to provide a home for BIND development and maintenance.
  related-projects:
    - >
      Related DNS software includes NSD, Unbound, Knot DNS, PowerDNS Authoritative
      Server, PowerDNS Recursor, dnsmasq, CoreDNS, and systemd-resolved; related
      BIND-era projects include the discontinued BIND 10/Bundy effort.
  sources:
    - Official BIND 9 README from ISC GitLab.
    - Official ISC BIND page.
    - Official ISC History of BIND page.
    - Packaged executable and package-manager facts from source_facts.
  summary:
    - >
      BIND 9 is ISC's classic open-source DNS implementation: a name server, recursive
      resolver, DNSSEC platform, and suite of DNS administration tools including
      `named`, `dig`, `host`, `nslookup`, `rndc`, and DNSSEC utilities.
  timeline:
    - 'Early 1980s: BIND originally written at UC Berkeley under a DARPA grant.'
    - '1994: ISC founded to provide a home for BIND development and maintenance.'
    - '1997-05: First production-ready BIND 8 released.'
    - '2000-09: BIND 9 released as a major rewrite of the architecture.'
    - '2009: ISC begins BIND 10 rewrite effort.'
    - '2014: ISC ends BIND 10 development and refocuses on BIND 9.'
    - '2016: BIND 9.11.0 and later move to the MPL 2.0 license.'
    - "2018-02: BIND project migrates to ISC's self-hosted GitLab."
    - "2019-2020: ISC replaces BIND's home-grown network interface layer with libuv."
  usage:
    - >
      Package users install BIND either for the `named` daemon or for the DNS toolbelt.
      On servers it acts as an authoritative name server, recursive resolver, forwarder,
      or split-horizon DNS service; on developer and operator workstations the package
      is often installed just to get `dig`, `host`, `nslookup`, `nsupdate`, and DNSSEC
      inspection/signing tools.
related-packages:
  - id: brew:unbound
    reason: >
      Choose Unbound when you need a security-focused validating, recursive, caching
      resolver without BIND's authoritative-server role and broader administration
      suite.
    rel: alternative
    sources:
      - https://www.isc.org/bind/
      - https://unbound.docs.nlnetlabs.nl/en/latest/
  - id: brew:nsd
    reason: >
      Choose NSD for an authoritative-only DNS server with a narrower operational scope,
      while BIND is appropriate when authoritative service, recursion, and extensive DNS
      utilities are needed together.
    rel: alternative
    sources:
      - https://www.isc.org/bind/
      - https://nsd.docs.nlnetlabs.nl/en/latest/
