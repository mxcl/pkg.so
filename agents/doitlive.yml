history:
  adoption-history:
    - >
      doitlive became a recognizable tool among conference speakers, developer
      advocates, and CLI demo authors because it solves a familiar live-demo problem:
      commands can be scripted and rehearsed while still appearing to be typed in a
      terminal. Its README advertises installation through both Homebrew and pip.
  package-nerd-significance:
    - >
      doitlive sits in a charming package niche: not a shell, not a recorder, and not a
      slide deck system, but a tiny CLI for making command-line demos reliable. Its
      history also ties together Click, IPython compatibility, shell completion, and
      Homebrew/PyPI packaging.
  project-history:
    - >
      The doitlive repository was created in June 2014. Its README says the idea came
      from Jordi Gutierrez Hermoso's Revsets talk at PyCon 2014, with Click helping make
      the tool quick to implement.
    - >
      The release history began immediately in June 2014 with 0.1.0 and 0.2.0, reached
      1.0 on June 18, 2014, and continued through larger Python packaging and shell
      support changes. The 4.0.0 release in 2018 added shell completion for bash, zsh,
      and fish, environment and alias handling, and broader internal reorganization.
    - >
      The 5.x line modernized the project for contemporary Python and IPython versions,
      including dropping Python 2 in 5.0.0 and later supporting newer IPython and Python
      releases.
  related-projects:
    - >
      The README names Click as an implementation influence, prezto themes as
      prompt-theme inspiration, and HackerTyper and PlayerPiano as related
      presentation/performance tools.
  sources:
    - https://github.com/sloria/doitlive#readme
    - https://doitlive.readthedocs.io/en/latest/changelog.html
    - https://api.github.com/repos/sloria/doitlive
  summary:
    - >
      doitlive is a terminal-presentation helper that replays scripted shell commands as
      the presenter types, turning demos into controlled performances while preserving
      the look of live typing.
  timeline:
    - '2014: Repository created; 0.1.0, 0.2.0, and 1.0 releases published in June.'
    - '2014: README credits a PyCon 2014 Revsets talk as the idea source.'
    - '2018: 4.0.0 adds shell completion and larger command-handling improvements.'
    - '2024: 5.0.0 drops Python 2 and old Python/IPython support.'
    - '2026: 5.2.1 released with continued maintenance.'
  usage:
    - >
      The core workflow is intentionally simple: create a shell-command file such as
      session.sh, run doitlive play session.sh, then type arbitrary keys to reveal and
      execute the stored commands in a fake terminal session.
