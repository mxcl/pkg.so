history:
  adoption-history:
    - >
      The upstream changelog says version 1.4.0 added Ubuntu PPA and macOS Homebrew
      package-manager availability, and the batch metadata lists Homebrew, Debian,
      Fedora, MacPorts, Nix, Arch, and Ubuntu package names. Adoption was driven by
      users needing a tunable OpenCL BLAS on devices not well served by fixed vendor
      libraries.
    - >
      The README asks users with poor out-of-the-box performance to run tuners and
      contribute results, which made the project partly a packaged library and partly a
      community database of device-specific OpenCL tuning.
  package-nerd-significance:
    - >
      CLBlast is package-nerd bait because it combines portable C++ packaging, OpenCL
      ICD dependencies, optional CUDA backend support, Python bindings, tuners, samples,
      benchmarks, and a built-in tuning database. It also offers a clean contrast with
      clBLAS: same problem domain, but newer, more tunable, and more explicit about
      cross-vendor device coverage.
  project-history:
    - >
      The changelog starts with version 0.1.0 as the initial preview release on GitHub,
      supporting a small set of level-1 and level-3 routines. Later pre-1.0 releases
      added broader BLAS coverage, a C API, Travis CI, MSVC support, thread safety,
      testing against clBLAS and CPU BLAS libraries, and tuned device parameters.
    - >
      CLBlast reached 1.0.0 after adding correctness fixes, Mesa Clover and ROCm
      support, external performance reports, and more tuned parameters. The README cites
      a 2017 GTC presentation, an IWOCL 2018 presentation, and the paper 'CLBlast: A
      Tuned OpenCL BLAS Library' as deeper background.
  related-projects:
    - >
      clBLAS is the older OpenCL BLAS library that CLBlast explicitly compares against
      and offers migration-compatible APIs for.
    - cuBLAS is the NVIDIA CUDA BLAS library used as a contrast in the README.
    - CLTune inspired the included auto-tuner according to the README's paper references.
    - Netlib BLAS provides the routine model, while OpenCL provides the device API.
  sources:
    - https://github.com/CNugteren/CLBlast#readme
    - https://raw.githubusercontent.com/CNugteren/CLBlast/master/CHANGELOG
    - https://cnugteren.github.io/clblast/clblast.html
    - https://arxiv.org/abs/1705.05249
  summary:
    - >
      CLBlast is a lightweight, tunable OpenCL BLAS library written in C++11. Its README
      frames it as an alternative to clBLAS and cuBLAS for users who want vendor-neutral
      OpenCL support, inspectable kernels, device-specific tuning, and support for a
      wide range of GPUs, CPUs, embedded GPUs, and accelerators.
  timeline:
    - >
      2017: CLBlast is presented at NVIDIA GTC and the first arXiv version of the
      CLBlast paper appears.
    - >
      2018: CLBlast is presented at IWOCL and the paper is published as 'CLBlast: A
      Tuned OpenCL BLAS Library'.
    - >
      1.0.0: The project reaches a stable major release with ROCm/Mesa support and
      external performance reports.
    - '1.4.0: Ubuntu PPA and macOS Homebrew packaging are added upstream.'
    - >
      1.7.0: Parallel kernel compilation for faster tuning and CMake 4.0 compatibility
      are added.
  usage:
    - >
      CLBlast users compile the library with CMake, include either clblast.h or
      clblast_c.h, pass OpenCL buffers to routines, and optionally build samples,
      benchmarks, tests, and tuners. The API is intentionally close to Netlib BLAS and
      cuBLAS/clBLAS conventions while avoiding a library initialization step.
related-packages:
  - id: brew:clblas
    reason: >
      Choose clBLAS when maintaining an existing application built around AMD's
      established OpenCL BLAS API; CLBlast documents clBLAS compatibility and migration
      as part of its alternative implementation.
    rel: alternative
