credentials-file-location: null
history:
  adoption-history:
    - >
      asdf's adoption comes from the plugin model. The official README advertises one
      CLI for multiple languages, consistent commands, one global config, per-project
      `.tool-versions`, support for legacy files such as `.node-version`, `.nvmrc`, and
      `.ruby-version`, and automatic switching as users move between directories.
    - >
      The input package facts list Alpine, Homebrew, MacPorts, Nix, and openSUSE
      packaging. In practice, many users also install it directly from Git, then use
      package-managed plugins for runtimes through asdf's own plugin index and community
      plugins.
  package-nerd-significance:
    - >
      asdf is significant because it turns language runtime installation into a plugin
      packaging problem. It competes with language-native version managers, distro
      packages, and newer tools, but its stable `.tool-versions` convention became a
      common project-level contract across mixed-language repositories.
  project-history:
    - >
      The repository was created in 2014 and the README frames asdf as a response to the
      proliferation of tools such as gvm, nvm, rbenv, and pyenv. Its bundled 'Ballad of
      asdf' says the author wrote one more version manager after installing many
      language-specific managers and learning many command sets.
    - >
      The first tagged version, v0.1.0, was annotated in July 2016. From there asdf grew
      as a shell-based version manager with plugins, shims, and a shared
      `.tool-versions` file. Release metadata shows v0.9.0 in 2021 and a rapid 0.10+ to
      0.19 series through 2026.
  related-projects:
    - >
      gvm, nvm, rbenv, and pyenv are named by the README as comparable language-specific
      tools.
    - asdf-plugins is the official plugin short-name index.
    - asdf-plugin-template and asdf-vm/actions support plugin creation and CI workflows.
  sources:
    - >
      https://api.github.com/repos/asdf-vm/asdf/git/tags/ae2eb8b75d07ec787e9e603cc0e89affb9c57c6f
    - https://asdf-vm.com/
    - https://asdf-vm.com/manage/configuration.html
    - https://github.com/asdf-vm/asdf
    - source_facts.package-manager
  summary:
    - >
      asdf is an extensible multi-runtime version manager built around one CLI, one
      per-project `.tool-versions` file, and a plugin system for languages and tools. It
      became a package-manager favorite because it replaces a pile of language-specific
      version managers with a single shim and plugin workflow.
  timeline:
    - '2014: GitHub repository created.'
    - '2016: v0.1.0 annotated as the first tagged version.'
    - '2021: v0.9.0 release published.'
    - '2025: v0.16.0 release published.'
    - '2026: v0.19.0 release published.'
  usage:
    - >
      A typical workflow is to install asdf, add a plugin such as Node.js or Ruby,
      install one or more versions, and set versions globally or in a project. The
      `.tool-versions` file records tool names and versions, while `~/.asdfrc` holds
      user-specific settings such as legacy version file behavior, plugin repository
      sync timing, and concurrency.
related-packages:
  - id: brew:mise
    reason: >
      Choose mise when you want `.tool-versions` and asdf-plugin compatibility together
      with built-in environment and task management; mise provides an official
      project-by-project migration guide from asdf.
    rel: alternative
    sources:
      - https://mise.jdx.dev/dev-tools/comparison-to-asdf.html
      - https://mise.jdx.dev/
  - id: brew:pyenv
    reason: >
      Choose pyenv for a Python-focused interpreter manager with Python-specific
      installation and selection workflows; asdf's official README identifies pyenv as
      one of the specialized managers its polyglot interface can replace.
    rel: alternative
    sources:
      - https://github.com/asdf-vm/asdf
      - https://github.com/pyenv/pyenv
