history:
  adoption-history:
    - >
      Testfully supports browser and desktop use, with cloud and offline storage modes.
      Its CLI extends exported API tests into CI/CD workflows.
  package-nerd-significance:
    - >
      Testfully combines a graphical API client with automation-oriented features such
      as scripts, environments, secret management, a markup language, Git integration,
      and a CLI.
  project-history:
    - >
      Testfully developed as a platform spanning API request authoring, testing, and
      monitoring for REST and GraphQL services.
  related-projects:
    - >
      Its official documentation includes import workflows for data created by other
      API-development tools.
  sources:
    - https://docs.testfully.io/
    - https://docs.testfully.io/docs/cli/
    - https://docs.testfully.io/docs/download/
    - https://docs.testfully.io/docs/vault/
  summary:
    - Testfully is an API client, testing, and monitoring platform for REST and GraphQL APIs.
  timeline:
    - >
      Desktop expansion: Testfully made its application available for macOS, Windows,
      and Linux alongside its web application.
    - >
      CLI expansion: Testfully added a command-line runner for exported requests and
      tests in CI/CD environments.
    - >
      Secret-management expansion: Testfully introduced a vault backed by native
      operating-system credential storage.
  usage:
    - >
      Developers compose and organize API requests, use environments and variables,
      write tests and scripts, manage secrets, and run exported request suites from the
      Testfully CLI.
