history:
  adoption-history:
    - >
      T2M2 progressed from beta testing to a free 1.0 release for macOS Sierra in June
      2017. The developer subsequently maintained separate compatibility builds as macOS
      and Time Machine changed.
    - >
      The current product line supports modern APFS-based backups and newer macOS
      releases while retaining an older build for earlier systems.
  package-nerd-significance:
    - >
      T2M2 converts macOS Unified Log activity into a focused Time Machine health
      report, avoiding the need for users to construct log predicates and interpret
      low-level backup messages themselves.
    - >
      For package-oriented Mac administrators, it complements Apple's Time Machine
      interface and command-line tools by exposing backup regularity, errors, available
      destination space, and related diagnostic evidence.
  project-history:
    - >
      Howard Oakley of The Eclectic Light Company created The Time Machine Mechanic
      after investigating how to extract and interpret Time Machine activity from the
      macOS Unified Log.
    - >
      Version 1.0 was released in June 2017 for Sierra following public beta testing. It
      analyzed backup events and errors and included a detailed help book for
      interpreting its reports.
    - >
      The application later evolved to accommodate APFS Time Machine backups and
      continuing changes in macOS logging. The current 2.x line targets Big Sur and
      later, while an older 1.x build covers earlier systems.
  related-projects:
    - Time Machine is Apple's backup system inspected by T2M2.
    - >
      Consolation, Ulbow, LogUI, and Mints are related Eclectic Light Company utilities
      for browsing or analyzing macOS logs.
    - >
      RunT2M2 was an earlier companion for running T2M2 with elevated access on older
      macOS releases.
  sources:
    - >
      https://eclecticlight.co/2017/05/23/beyond-scripting-in-swift-dates-steppers-and-parsing-log-entries/
    - https://eclecticlight.co/2017/06/09/the-time-machine-mechanic-t2m2-version-1-0-released/
    - https://eclecticlight.co/consolation-t2m2-and-log-utilities/
  summary:
    - >
      The Time Machine Mechanic, commonly abbreviated T2M2, is a free macOS diagnostic
      utility by Howard Oakley. It analyzes Unified Log entries to report whether Time
      Machine backups are running normally and to highlight errors or other warning
      signs.
  timeline:
    - >
      2017-05: Howard Oakley documented development of T2M2's Time Machine log-analysis
      approach.
    - '2017-06-09: T2M2 1.0 was released for macOS Sierra after beta testing.'
    - '2020s: T2M2 was adapted for APFS-based Time Machine backups and newer macOS releases.'
    - '2026: The official product page offers maintained 1.x and 2.x compatibility lines.'
  usage:
    - >
      Users run T2M2 from an administrator account and select an analysis period. The
      application reads relevant Unified Log entries and reports backup regularity,
      destination space, completed work, warning signs, and errors.
    - >
      T2M2 is a diagnostic companion rather than a backup engine: users continue to
      configure and run backups with Apple's Time Machine tools, then use T2M2 and its
      included help to investigate behavior.
