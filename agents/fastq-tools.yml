config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      fastq-tools is niche compared with later all-in-one preprocessors, but it fills a
      durable command-line niche for people who want small composable tools over a
      single workflow application. Its Homebrew packaging reflects that Unix-toolbox use
      case.
  package-nerd-significance:
    - >
      fastq-tools is significant as a small-binary, many-command package: it packages
      the FASTQ format as a shell-friendly toolkit. That makes it closer to classic
      text-processing utilities than to GUI or report-heavy bioinformatics applications.
  project-history:
    - >
      Daniel C. Jones published fastq-tools under an MIT-style license in 2011. The
      README presents it as a collection of small and efficient programs for common
      tasks with high-throughput sequencing data in FASTQ format.
    - >
      The package follows the older autotools-era scientific CLI model: generated
      configure scripts for release tarballs, autogen.sh for git checkouts, and a short
      dependency list of PCRE and zlib. The GitHub repository remained active through
      later tags, with v0.8.3 listed among its published tags.
  related-projects:
    - >
      fastq-tools complements larger FASTQ quality-control and preprocessing tools by
      providing focused filters and counters for shell pipelines.
  sources:
    - https://github.com/dcjones/fastq-tools
    - https://github.com/dcjones/fastq-tools#readme
    - https://api.github.com/repos/dcjones/fastq-tools/tags
  summary:
    - >
      fastq-tools is a compact suite of Unix-style utilities for FASTQ sequencing files,
      including tools for sorting, grepping, k-mer counting, local sequence matching,
      quality-score tabulation and adjustment, sampling, and duplicate counting.
  timeline:
    - '2011: The GitHub repository is created and the README copyright names Daniel C. Jones.'
    - '2011: The project is released as a set of small FASTQ utilities.'
    - '2022: The repository shows later maintenance activity.'
    - '2022: v0.8.3 is listed among repository tags.'
  usage:
    - >
      The suite works with ordinary and gzipped FASTQ files. Users pick individual
      commands such as fastq-sort, fastq-grep, fastq-kmers, fastq-sample, fastq-uniq,
      and fastq-qual rather than configuring a long-running application.
    - >
      No persistent configuration or credentials file is documented; behavior is driven
      by command-line options and the input FASTQ streams or files.
related-packages:
  - id: brew:fastp
    reason: >
      Choose fastp when you want an integrated FASTQ preprocessing command with
      filtering, trimming, and HTML/JSON reports; choose fastq-tools for small
      composable sorting, searching, sampling, and statistics utilities.
    rel: alternative
    sources:
      - https://github.com/dcjones/fastq-tools
      - https://github.com/OpenGene/fastp
