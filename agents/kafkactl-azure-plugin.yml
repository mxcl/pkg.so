id: brew:kafkactl-azure-plugin
display-name: kafkactl-azure-plugin
repo: null
docs:
  - https://github.com/deviceinsight/kafkactl-plugins/blob/main/azure/README.adoc
  - https://deviceinsight.github.io/kafkactl
config-file-location:
  unix:
    - ~/.config/kafkactl/config.yml
    - ~/.kafkactl/config.yml
    - /etc/kafkactl/config.yml
  windows:
    - '%APPDATA%\kafkactl\config.yml'
credentials-file-location: null
history:
  adoption-history:
    - >
      The Azure plugin addresses a specific adoption path: teams using Azure Event Hubs
      through its Kafka-compatible interface and wanting to keep kafkactl as their local
      operational CLI. Its Homebrew and winget packages make that provider-specific
      helper installable like the main command.
  package-nerd-significance:
    - >
      The package is notable as a tiny cloud-auth extension packaged independently of
      its host CLI. It is the kind of package that makes metadata catalogs useful: the
      executable name alone is less important than its relationship to kafkactl, Azure
      Event Hubs, OAuth, SASL, and Kafka-compatible APIs.
  project-history:
    - >
      Device Insight's kafkactl project began in December 2018 as a Kafka management
      CLI. The separate kafkactl-plugins repository was created in March 2024 and
      contains both AWS and Azure plugin directories.
    - >
      The Azure plugin README states that the plugin configures kafkactl to use an Azure
      OAuth credential flow for login and enables passwordless logins with Azure Event
      Hubs. The plugin repository's first v1.0.0 release was published on March 12,
      2024.
  related-projects:
    - >
      Related projects include kafkactl, Apache Kafka, Azure Event Hubs, Azure identity
      tooling, and the sibling kafkactl AWS plugin.
  sources:
    - https://api.github.com/repos/deviceinsight/kafkactl
    - https://api.github.com/repos/deviceinsight/kafkactl-plugins
    - https://deviceinsight.github.io/kafkactl
    - https://formulae.brew.sh/formula/kafkactl-azure-plugin
    - https://github.com/deviceinsight/kafkactl
    - https://github.com/deviceinsight/kafkactl-plugins
    - https://github.com/deviceinsight/kafkactl-plugins/blob/main/azure/README.adoc
    - https://github.com/deviceinsight/kafkactl-plugins/releases
  summary:
    - >
      kafkactl-azure-plugin is a kafkactl companion binary for Azure OAuth
      authentication. It exists so Kafka-compatible Azure Event Hubs setups can be
      managed through kafkactl without baking Azure-specific login behavior into the
      main CLI.
  timeline:
    - '2018-12: kafkactl repository created.'
    - '2024-03: kafkactl-plugins repository created.'
    - '2024-03-12: kafkactl-plugins v1.0.0 released.'
  usage:
    - >
      The plugin is configured as a kafkactl token provider. In practice it is invoked
      by kafkactl during authentication rather than used as a general-purpose
      user-facing command.
related-packages:
  - id: brew:kafkactl
    reason: >
      Install kafkactl as the host Kafka administration CLI that discovers and invokes
      this Azure OAuth token-provider plugin.
    rel: adjacent_workflow
    sources:
      - https://github.com/deviceinsight/kafkactl#plugins
      - https://github.com/deviceinsight/kafkactl-plugins/blob/main/azure/README.adoc
