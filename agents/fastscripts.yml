history:
  adoption-history:
    - >
      FastScripts has been continuously maintained for more than two decades and is
      marketed by Red Sweater as a utility beloved by Mac automation experts. Its
      long-lived free-use model allowed basic use while reserving larger shortcut
      collections or newer premium capabilities for licensed users.
    - >
      The application has followed changes in Mac automation culture, adding Automator
      workflow support in 2005, 64-bit compatibility in 2011, Apple Silicon improvements
      in 2020, and a substantially revised multiprocess FastScripts 3 in 2021.
  package-nerd-significance:
    - >
      FastScripts occupies a durable niche between Apple's built-in Script Menu and full
      automation platforms. It preserves familiar macOS Scripts-folder conventions while
      adding global shortcuts, application-specific organization, search, multiple
      script languages, cancellation, and progress monitoring.
    - >
      Its support for AppleScript, shell and Perl scripts, Automator workflows,
      applications, documents, aliases, symbolic links, and arbitrary script collections
      makes it useful as a lightweight glue layer for personal Mac automation.
  project-history:
    - >
      FastScripts predates Red Sweater's 2005 blog archive. Developer Daniel Jalkut's
      official account dates FastScripts 2.0 to June 10, 2004, when keyboard shortcuts
      and new preferences were introduced.
    - >
      The 2.x series accumulated automation-oriented features over many years, including
      Automator support, on-screen messages, recent scripts, custom menu ordering,
      plain-text AppleScript execution, and 64-bit support. FastScripts 3 entered beta
      in February 2021 and was publicly released on November 11, 2021 with ScriptLight
      search, separate high-performance execution processes, running-task controls, and
      symbolic-link support.
  related-projects:
    - >
      FastScripts deliberately extends Apple's Script Menu conventions and supports
      AppleScript, Automator, Shortcuts actions, shell scripts, and the BBEdit-style
      filename convention for custom menu ordering.
  sources:
    - 'Official FAQ: https://help.redsweater.com/fastscripts/faq/'
    - 'Official FastScripts 3 beta history: https://redsweater.com/blog/3685/fastscripts-3-beta'
    - 'Official product page: https://redsweater.com/fastscripts/'
    - 'Official version history: https://redsweater.com/fastscripts/whatsnew.html'
  summary:
    - >
      FastScripts is a long-running macOS menu-bar utility from Red Sweater Software for
      organizing and invoking scripts, workflows, applications, and documents. It builds
      on Apple's traditional Scripts-folder model with keyboard shortcuts, contextual
      menus, search, and managed script execution.
  timeline:
    - '2004-06-10: FastScripts 2.0 released with keyboard shortcuts and new preferences.'
    - '2005-04-19: Version 2.2 added on-screen display messages.'
    - >
      2005-05-04: Version 2.2.1 added Automator workflow support and runaway-script
      cancellation.
    - '2009-06-22: Version 2.4 introduced a free-forever tier limited by keyboard shortcuts.'
    - '2011-07-12: Version 2.6 added 64-bit compatibility.'
    - '2021-02-11: FastScripts 3 public beta announced.'
    - '2021-11-11: FastScripts 3.0 publicly released.'
    - '2022-09-26: Version 3.2 added arbitrary script collections and parameterized invocation.'
  usage:
    - >
      Users place scripts in their personal Scripts folder or configure additional
      script collections, then run them from the menu bar, ScriptLight search, or global
      and application-specific keyboard shortcuts. Application-specific scripts live
      under an Applications subfolder and appear when the corresponding application is
      active.
