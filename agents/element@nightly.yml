id: cask:element@nightly
display-name: Element Nightly
repo: https://github.com/element-hq/element-web
docs:
  - https://docs.element.io/latest
  - https://github.com/element-hq/element-web/blob/develop/apps/desktop/README.md
  - https://web-docs.element.dev/
config-file-location:
  macos:
    - ~/Library/Application Support/Element/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      The client gained traction alongside the Matrix ecosystem after Vector was renamed
      Riot in 2016. Element's official history cites deployments and ecosystem adoption
      in government, defense, universities, and other organizations.
    - >
      The nightly channel is aimed at contributors, testers, administrators, and early
      adopters who need to exercise changes before stable desktop releases.
  package-nerd-significance:
    - >
      Element Nightly provides a readily installable view of current Matrix client
      development and is useful for testing new encrypted-messaging, federation,
      calling, and user-interface work before stable releases.
    - >
      The project is also notable for its open development lineage: the Electron desktop
      wrapper uses Element Web at its core, and in 2026 the separate element-desktop
      repository was merged into the element-web monorepo.
  project-history:
    - >
      The flagship Matrix client began as Vector and was renamed Riot in 2016. Riot
      reached 1.0 in 2019 and enabled end-to-end encryption by default for new private
      conversations in 2020.
    - >
      In July 2020 Riot, its developer New Vector, and the Modular hosting service were
      unified under the Element name. Element Desktop packages the Element Web client in
      Electron; Element Nightly is its continuously updated development-build channel.
  related-projects:
    - Matrix
    - Element Web
    - Element Desktop
    - Synapse
    - Element Call
  sources:
    - https://element.io/about
    - https://element.io/blog/e2e-encryption-by-default-cross-signing-is-here/
    - https://element.io/blog/welcome-to-element/
    - https://github.com/element-hq/element-desktop
    - https://github.com/element-hq/element-web
  summary:
    - >
      Element Nightly is the development-build channel of Element Desktop, an
      open-source Matrix collaboration and messaging client.
  timeline:
    - '2016: Vector was renamed Riot.'
    - '2019: Riot reached its 1.0 release.'
    - '2020: End-to-end encryption became the default for new private conversations.'
    - '2020: Riot and New Vector were rebranded as Element.'
    - '2026: The element-desktop repository was merged into the element-web monorepo.'
  usage:
    - >
      Used to join Matrix homeservers for federated rooms, direct messages, encrypted
      conversations, file sharing, voice/video communication, and collaboration.
    - >
      Nightly builds expose recent changes ahead of stable releases and therefore trade
      release stability for earlier testing access.
