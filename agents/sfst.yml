history:
  adoption-history:
    - >
      SFST became part of the computational morphology toolchain around academic
      finite-state NLP. The official page lists downstream morphologies such as SMOR,
      LatMor, EMOR, TRMOR, mlmorph, and yakutmorph, and also notes Debian and Homebrew
      packaging plus Python bindings.
  package-nerd-significance:
    - >
      SFST matters to package-manager users because it brings an academic NLP
      finite-state toolchain into ordinary Unix-style installation flows. Its Homebrew
      and Debian packaging makes older research software usable alongside modern NLP
      tools without manual source builds.
  project-history:
    - >
      The official SFST page publishes source-code releases from version 1.2 through
      1.4.7g and asks users to cite the 2005 FSMNLP paper 'A Programming Language for
      Finite State Transducers.' Later releases added UTF-8 support, efficiency
      improvements, Hopcroft minimisation, work with the HFST team, and bug fixes for
      lexicon and replacement behavior.
  related-projects:
    - >
      The official page names AFST and HFST as projects extending SFST-related
      functionality, and notes HFST was implemented on top of SFST, OpenFST, and foma
      libraries.
  sources:
    - >
      Official LMU SFST page: project description, features, source releases,
      manual/tutorial links, related morphologies, packaging notes, citation, and
      related FST toolkits.
    - Official SFST manual PDF metadata confirms the manual is the project manual surface.
    - 'input.source_facts.package-manager: Homebrew, Debian, and Ubuntu package names.'
  summary:
    - >
      SFST is Helmut Schmid's Stuttgart Finite State Transducer toolbox for building
      morphological analyzers and other finite-state-transducer based NLP tools. The
      official page describes a compiler, interactive and batch analyzers, transducer
      comparison/printing tools, and an efficient C++ transducer library.
  timeline:
    - '2005: SFST publication presented at FSMNLP 2005.'
    - '1.2: Earliest source release listed on the official SFST downloads page.'
    - '1.4.2: Official release notes mention Hopcroft minimisation and work with the HFST team.'
    - '1.4.7g: Latest source release listed on the official SFST downloads page.'
  usage:
    - >
      Users write transducer programs and compile them into minimized transducers, then
      use the command-line tools for analysis, generation, parsing, printing,
      comparison, and low-memory lookup. Its official documentation explicitly targets
      users familiar with grep, sed, or Perl.
