id: brew:cloc
display-name: cloc
repo: null
docs:
  - https://github.com/AlDanial/cloc#readme
config-file-location:
  unix:
    - ~/.config/cloc/options.txt
  windows:
    - C:\Users\%USERNAME%\AppData\Roaming\cloc\options.txt
credentials-file-location: null
history:
  adoption-history:
    - >
      cloc became a staple packaging target because it is useful in almost any source
      tree and easy to ship as a command-line utility. The official README documents
      installation through npm, apt, yum, dnf, pacman, emerge, apk, pkg, pkg_add,
      MacPorts, Homebrew, winget, Chocolatey, Scoop, Docker, and GitHub releases.
    - >
      The batch input independently records coverage across Alpine, Homebrew,
      Chocolatey, Debian, Fedora, MacPorts, Nix, Arch, Scoop, Ubuntu, and Winget,
      matching cloc's broad cross-platform adoption.
  package-nerd-significance:
    - >
      cloc is package-nerd significant because it is one of the standard tiny tools
      people install everywhere to inspect source distributions. It also tests package
      metadata assumptions: source archives, generated Windows binaries, shell wrappers,
      Perl availability, Docker images, CPAN/npm wrappers, and OS-native packages all
      coexist.
    - >
      Its README explicitly credits maintainers for Debian, CPAN, and npm packaging,
      showing that cloc's distribution story is not incidental but part of its
      ecosystem.
  project-history:
    - >
      cloc was created by Al Danial and dates to 2006, when the project was hosted on
      SourceForge. The official README states that cloc moved to GitHub in September
      2015 after SourceForge hosting that began in August 2006.
    - >
      The tool is written in Perl, is designed to be portable with few external
      requirements, and incorporates ideas or code from SLOCCount, Regexp::Common,
      Win32::Autoglob, and Algorithm::Diff. Release notes show steady additions of
      language recognizers, output formats, archive support, VCS/diff features, and
      Windows packaging improvements.
  related-projects:
    - >
      Related projects include David Wheeler's SLOCCount, Git, Docker, Perl packaging
      ecosystems, App::cloc on CPAN, the npm cloc package, and package-manager formulae
      for Homebrew, MacPorts, Chocolatey, Scoop, Winget, and Linux distributions.
  sources:
    - https://github.com/AlDanial/cloc#readme
    - https://github.com/AlDanial/cloc/blob/master/Unix/NEWS
    - https://github.com/AlDanial/cloc/releases
  summary:
    - >
      cloc counts blank lines, comment lines, and physical source lines across many
      programming languages, with support for files, directories, archives,
      repositories, and diffs.
  timeline:
    - '2006: SourceForge hosting begins and Al Danial copyright history starts.'
    - '2015: Project moves from SourceForge to GitHub.'
    - '2021: cloc receives a Zenodo DOI badge in upstream metadata.'
    - '2024: Version 2.00 released with no breaking changes from 1.x.'
    - >
      2025: Version 2.06 uses GitHub Actions for release packaging and Windows
      executable work.
    - >
      2026: Version 2.08 released with additional language/file-type support and
      packaging refinements.
  usage:
    - >
      Users run `cloc` on a file, directory, archive, git commit, or repository to get
      language-level blank/comment/code counts. It can also compare versions, read
      archives such as tar, zip, wheels, RPMs, and Debian packages, and emit reports in
      multiple formats.
    - >
      Because the source version runs on Perl and the Windows executable bundles what it
      needs, cloc is practical for CI jobs, release audits, quick repository
      comparisons, and language-mix summaries.
related-packages:
  - id: brew:scc
    reason: >
      Choose scc when you want a compiled, highly parallel code counter that adds
      complexity, COCOMO, unique-line, and machine-readable reporting beyond basic line
      counts.
    rel: alternative
    sources:
      - https://github.com/boyter/scc
      - https://github.com/AlDanial/cloc#readme
  - id: brew:tokei
    reason: >
      Choose Tokei for a fast compiled code counter with simple per-language statistics,
      `.gitignore` support, and project or user configuration files.
    rel: alternative
    sources:
      - https://github.com/XAMPPRocky/tokei
      - https://github.com/AlDanial/cloc#readme
