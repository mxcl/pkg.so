history:
  adoption-history:
    - >
      aha's adoption is mostly package-manager adoption: the project README explicitly
      documents Homebrew and conda installation, and the supplied package facts list
      packages in Homebrew, Debian, Fedora, Arch, MacPorts, Nix, Alpine, Ubuntu, and
      openSUSE ecosystems.
    - >
      That distribution profile matches the tool's role: it is useful in scripts, CI
      logs, bug reports, and documentation pipelines where terminal color needs to
      survive outside a terminal emulator.
  package-nerd-significance:
    - >
      aha is the kind of package that appears small until it is missing from a packaging
      set: it fills the specific gap between ANSI-colored CLI output and static HTML
      artifacts. Its broad distro coverage makes it a handy compatibility target for
      scripts that need portable terminal-to-web conversion.
  project-history:
    - >
      The public GitHub repository for aha began in May 2012 with an initial commit. The
      project has stayed close to the Unix filter model: read colored terminal text on
      standard input, emit HTML on standard output, and avoid runtime dependencies
      beyond a C compiler and make for source builds.
    - >
      Version tags in the official repository show a long-lived but compact tool rather
      than a fast-moving framework. Notable repository tags include 0.5 in 2018 and
      0.5.1 in 2020, with the README continuing to document source builds and simple
      shell-pipeline examples.
  related-projects:
    - >
      aha commonly sits beside terminal-color producers such as colordiff, ls --color,
      htop, and man/ul pipelines rather than replacing them.
    - >
      It overlaps in purpose with broader terminal capture or documentation tools, but
      stays focused on ANSI-to-HTML conversion.
  sources:
    - https://api.github.com/repos/theZiz/aha
    - https://api.github.com/repos/theZiz/aha/commits?per_page=1&page=181
    - >
      https://api.github.com/repos/theZiz/aha/git/commits/41c2320eb31ef1c95fcd45a0feb0303f606fc711
    - https://github.com/theZiz/aha#readme
    - source_facts.package-manager
  summary:
    - >
      aha, the ANSI HTML Adapter, is a small C command-line utility for turning ANSI
      SGR-colored terminal output into HTML. Its niche is deliberately narrow: preserve
      colored command output from tools such as colordiff, ls, htop, and formatted man
      pages so it can be posted or archived as standards-compliant HTML.
  timeline:
    - '2012: Public GitHub repository created with an initial commit.'
    - '2018: Official repository tag 0.5 recorded.'
    - '2020: Official repository tag 0.5.1 recorded.'
    - >
      2026: Input package facts list aha across Homebrew, Debian, Fedora, Arch,
      MacPorts, Nix, Alpine, Ubuntu, and openSUSE.
  usage:
    - >
      Typical usage pipes colored command output into aha and redirects the result to an
      HTML file. Official examples include converting aha's own help output, colordiff
      output, colored ls output, htop output with line-fix handling, and formatted
      man-page output.
    - >
      For package users, the important operational detail is that aha is
      dependency-light and filter-shaped. It can be dropped into an existing shell
      pipeline without adopting a larger documentation or terminal-recording stack.
related-packages:
  - id: brew:colordiff
    reason: >
      Use colordiff to produce colorized diff output and pipe it into aha when you need
      a shareable HTML rendering of that diff.
    rel: adjacent_workflow
    sources:
      - https://github.com/theZiz/aha#readme
      - https://www.colordiff.org/
