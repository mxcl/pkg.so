history:
  adoption-history:
    - >
      DEVONthink began as a single-database Personal Edition and was extended with Pro
      and Pro Office editions for multiple databases, OCR, email archiving, and web
      access. DEVONthink To Go brought the system to iPhone and iPad in 2010, and a
      redesigned synchronization system completed the cross-device ecosystem in 2016.
    - >
      Its long life and emphasis on local storage have made it a durable Mac application
      for researchers, writers, legal and office users, and
      personal-knowledge-management enthusiasts who want large searchable document
      collections without placing their primary data on a vendor server.
  package-nerd-significance:
    - >
      DEVONthink is a veteran, Mac-native information manager with deep automation,
      AppleScript integration, smart rules, OCR, tagging, item links, and local database
      storage. Package enthusiasts value it as a power-user application whose databases
      remain user-controlled and can participate in scripted research and archival
      workflows.
  project-history:
    - >
      DEVONtechnologies' founders released DEVONthink 1.0 in April 2002 for knowledge
      and information workers. Later editions added multiple databases, OCR, email
      archiving, and an integrated web server.
    - >
      The product grew into a wider Mac and mobile ecosystem with DEVONthink To Go,
      flexible synchronization, browser capture, automation, and multiple editions.
      DEVONthink 4 added generative-AI integrations, automatic versioning,
      revision-proof databases, expanded automation, and a refined web interface while
      retaining local-first document storage.
  related-projects:
    - DEVONthink To Go is the companion iPhone and iPad application.
    - >
      DEVONagent is DEVONtechnologies' research assistant and can send collected
      material into DEVONthink.
    - >
      DEVONthink Server adds browser-based access and team workflows around DEVONthink
      databases.
  sources:
    - https://www.devontechnologies.com/apps/devonthink
    - https://www.devontechnologies.com/apps/devonthink/new
    - https://www.devontechnologies.com/apps/devonthink/security
    - https://www.devontechnologies.com/press/archive/devonthink-20-years-promotion
    - https://www.devontechnologies.com/support/faq/where-are-my-databases
  summary:
    - >
      DEVONthink is a proprietary Mac document and information manager for collecting,
      searching, annotating, linking, and automating work with local databases. It is
      commonly used as a research archive, document repository, and personal knowledge
      base.
  timeline:
    - '2002: DEVONthink 1.0 was released to the Mac community.'
    - '2010: DEVONthink To Go extended the product to iPhone and iPad.'
    - '2016: A modern synchronization system completed the Mac-and-mobile ecosystem.'
    - '2022: DEVONthink marked its twentieth anniversary.'
    - >
      2025: DEVONthink 4 introduced a new generation with AI integration, versioning,
      and revision-proof databases.
  usage:
    - >
      Users create databases for documents, notes, email, web captures, scans, and other
      files, then organize them with groups, tags, metadata, links, smart groups, and
      smart rules. OCR, search, browser capture, synchronization, scripting, and
      external-editor integration support research and archival workflows.
    - >
      Database locations are user-selected; DEVONtechnologies recommends a
      home-directory folder such as ~/Databases. The Global Inbox is stored at
      ~/Library/Application Support/DEVONthink Pro 3/Inbox.dtBase2, but these are
      user-data locations rather than a documented application configuration file.
