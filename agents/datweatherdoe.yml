history:
  adoption-history:
    - >
      DatWeatherDoe is distributed as a macOS application through GitHub releases and
      Homebrew Cask. Its documented platform target is macOS 13 or later.
  package-nerd-significance:
    - >
      DatWeatherDoe is a compact open-source SwiftUI menu-bar application. It is useful
      to package-oriented macOS users as a focused alternative to larger weather clients
      and illustrates a common cask pattern: a native status-bar utility distributed
      directly from GitHub releases.
  project-history:
    - >
      DatWeatherDoe was developed as a simple macOS menu-bar weather client. The project
      migrated its weather backend from the retired OpenWeatherMap API 2.5 service to
      WeatherAPI and added location-based weather lookup.
  related-projects:
    - WeatherAPI supplies weather data.
    - macOS Location Services can supply the user's position when permission is granted.
  sources:
    - https://github.com/inderdhir/DatWeatherDoe
    - source_facts.package-manager.brew-cask
  summary:
    - >
      DatWeatherDoe is an open-source macOS menu-bar application that displays weather
      using either Location Services or manually supplied coordinates.
  timeline:
    - >
      2024: The project documented migration away from the retiring OpenWeatherMap API
      2.5 interface to WeatherAPI.
    - >
      The official sources do not provide a reliable date for the project's initial
      public release.
  usage:
    - >
      Users can fetch weather from macOS Location Services or from entered latitude and
      longitude coordinates, choose a polling interval, and use the app in Dark Mode.
    - >
      Location-based operation requires enabling permission under macOS privacy
      settings. The packaged application does not document a user-managed credentials
      file; a personal WeatherAPI key in Config.xcconfig is only part of the
      source-build developer setup.
