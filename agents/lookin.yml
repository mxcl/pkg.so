history:
  adoption-history:
    - >
      Lookin is distributed as a macOS application and works with LookinServer, which
      developers add to an iOS project's debug configuration through CocoaPods or Swift
      Package Manager.
  package-nerd-significance:
    - >
      Lookin gives Apple-platform developers an open-source, package-installable
      alternative for inspecting and modifying an application's view hierarchy outside
      Xcode's built-in inspector.
  project-history:
    - >
      Lookin was developed as a macOS application for inspecting and modifying views in
      running iOS applications. The desktop application and its companion LookinServer
      framework are maintained in separate official repositories.
    - >
      The version 1.0.1 release published the complete desktop application source and
      added Apple silicon support.
  related-projects:
    - >
      LookinServer is the official iOS-side framework used to connect an application to
      the Lookin desktop inspector.
    - The project describes Xcode UI Inspector and Reveal as comparable tools.
  sources:
    - >
      Official LookinServer repository and integration guide:
      https://github.com/QMUI/LookinServer
    - 'Official desktop repository and README: https://github.com/hughkli/Lookin'
    - 'Official release history: https://github.com/hughkli/Lookin/releases'
  summary:
    - >
      Lookin is an open-source macOS inspection and debugging application for examining
      and modifying the views of an iOS application.
  timeline:
    - >
      Version 1.0.1: The project announced Apple silicon support and publication of the
      complete desktop application source.
  usage:
    - >
      Developers run Lookin on macOS and integrate LookinServer into an iOS
      application's debug build. The desktop application can then inspect the
      application's view hierarchy and properties.
    - The official integration guide warns against including LookinServer in release builds.
