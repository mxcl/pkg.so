config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The man page and source page document testing with XChat, ircII, BitchX, mIRC, and
      irssi, which captures the project's practical adoption goal: keep familiar IRC
      clients usable with an ICB server. Homebrew packaging preserves that bridge for
      users who still need the proxy.
  package-nerd-significance:
    - >
      icbirc is the kind of package that makes broad package indexes culturally useful:
      it preserves access to a minor protocol and a specific chat-history ecosystem,
      while also documenting the practical differences between IRC channels and ICB
      groups.
  project-history:
    - >
      The author page embeds the OpenBSD-style man page, states that the first version
      was written in 2003, and publishes source tarballs rather than a source-control
      repository. The page's history section records later maintenance releases in 2015,
      2016, and 2024, largely incorporating OpenBSD ports-tree patches.
  related-projects:
    - >
      Related projects and protocols include ICB, IRC, OpenBSD ports, XChat, ircII,
      BitchX, mIRC, irssi, and the RFC 1459/2811/2812 IRC specifications cited by the
      man page.
  sources:
    - https://formulae.brew.sh/formula/icbirc
    - https://www.benzedrine.ch/icbirc-2.2.tar.gz
    - https://www.benzedrine.ch/icbirc.html
  summary:
    - >
      icbirc is Daniel Hartmeier's proxy that lets IRC clients connect to ICB servers by
      translating commands and messages between the two chat protocols. It is a tiny
      compatibility bridge for an obscure but historically interesting chat network.
  timeline:
    - '2003: First version of icbirc written.'
    - '2015: Versions 1.9 and 2.0 incorporated connection and OpenBSD port fixes.'
    - '2016: Version 2.1 added OpenBSD pledge support and IRC error-message behavior changes.'
    - '2024: Version 2.2 included additional OpenBSD ports-tree patches.'
  usage:
    - >
      A typical invocation is `icbirc -s default.icb.net`, after which an IRC client
      connects to the proxy. Supported IRC commands include login, listing, joining,
      messaging, topic, kick, mode handoff, quit, and a `RAWICB` escape hatch for custom
      ICB commands.
related-packages:
  - id: brew:irssi
    reason: >
      Use Irssi as a terminal IRC front end for icbirc; the icbirc author explicitly
      documents that Irssi works with the proxy when lag_max_before_disconnect is set to
      0.
    rel: adjacent_workflow
    sources:
      - https://www.benzedrine.ch/icbirc.html
      - https://irssi.org/documentation/
