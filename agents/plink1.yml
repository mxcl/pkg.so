history:
  adoption-history:
    - >
      PLINK became a standard command-line component of genome-wide association
      workflows. PLINK 1.9 retained broad compatibility with PLINK 1.07 while making
      large analyses practical on ordinary desktops and allowing selected matrix
      computations to be divided across clusters.
  package-nerd-significance:
    - >
      PLINK matters to package users because it combines a long-lived genomics command
      vocabulary with compact binary datasets, reproducible text outputs, broad
      operating-system support, and unusually strong attention to computational
      efficiency.
    - >
      The `plink1` package name is significant where PLINK 1.x and PLINK 2 coexist:
      scripts may depend on the older executable and file semantics even while both
      generations share the official plink-ng source repository.
  project-history:
    - >
      The original PLINK was created by Shaun Purcell. PLINK 1.9 was developed primarily
      by Christopher Chang and collaborators as a comprehensive, backward-compatible
      modernization of PLINK 1.07.
    - >
      The second-generation work emphasized bitwise algorithms, sequential memory
      access, multithreading, larger-than-memory datasets, standardized command parsing,
      and faster implementations of common population-genetics operations.
  related-projects:
    - PLINK 1.07, whose command set and file formats PLINK 1.9 largely preserves.
    - PLINK 2.0, the newer generation developed in the same plink-ng project.
    - GCTA, whose genetic-relationship-matrix ecosystem influenced additions to PLINK 1.9.
  sources:
    - https://www.cog-genomics.org/plink/1.9/
    - https://www.cog-genomics.org/plink/1.9/credits
    - https://www.cog-genomics.org/plink/1.9/general_usage
    - https://www.cog-genomics.org/plink/2.0/general_usage
  summary:
    - >
      PLINK 1.9 is the performance-focused modernization of the original PLINK
      whole-genome association analysis toolset. It is free, open-source command-line
      software for managing genotype datasets and running large-scale association,
      quality-control, linkage-disequilibrium, relatedness, and population-genetics
      analyses.
  timeline:
    - >
      2007: The original PLINK methods paper described the whole-genome association and
      population-linkage toolset.
    - >
      2015: The PLINK 1.9 methods paper presented the second-generation implementation
      for larger and richer datasets.
  usage:
    - >
      Typical work starts by loading a PLINK binary fileset (`.bed`, `.bim`, and `.fam`)
      or converting another supported genotype format. Users combine analysis and
      filtering flags and normally set `--out` to keep each run's reports and derived
      datasets under a distinct prefix.
    - >
      PLINK is commonly scripted for genotype quality control, allele-frequency
      calculations, association tests, LD pruning, principal components, relatedness
      matrices, dataset conversion, filtering, and merging. It writes a log recording
      the effective options for each run.
