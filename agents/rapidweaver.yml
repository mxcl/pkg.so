history:
  adoption-history:
    - >
      RapidWeaver became part of the long-running independent Mac software ecosystem and
      developed a substantial community of users and third-party theme and add-on
      developers. Realmac credits that ecosystem with helping the product continue for
      more than two decades.
  package-nerd-significance:
    - >
      RapidWeaver represents the native-Mac, offline website-builder tradition: projects
      are authored locally and published to ordinary hosting rather than being tied to a
      hosted site-building service. Its longevity, theme ecosystem, plugin
      compatibility, and support for conventional FTP-family protocols make it notable
      to collectors and maintainers of specialist macOS software.
  project-history:
    - >
      Realmac Software was founded in 2002 and released RapidWeaver in 2004 as a
      template-based website editor for the Mac. It has remained in continuous
      development and is now presented as RapidWeaver Classic alongside Realmac's newer
      RapidWeaver Elements product.
  related-projects:
    - RapidWeaver Elements is Realmac Software's newer no-code website builder.
    - >
      Apple iWeb was a contemporary consumer-oriented Mac website builder that
      RapidWeaver outlasted.
    - >
      Third-party themes and add-ons form an important part of the RapidWeaver Classic
      ecosystem.
  sources:
    - 'Official manual: https://docs.realmacsoftware.com/classic-manual'
    - >
      Official product history and feature page:
      https://www.realmacsoftware.com/rapidweaver-classic/
    - >
      Official publishing documentation:
      https://docs.realmacsoftware.com/classic-manual/user-manual/publishing/publish-to-a-web-server
  summary:
    - >
      RapidWeaver is Realmac Software's native macOS visual website builder, now
      marketed as RapidWeaver Classic.
  timeline:
    - '2002: Realmac Software was founded.'
    - '2004: Realmac Software released RapidWeaver for the Mac.'
    - >
      After more than 20 years: RapidWeaver continues as RapidWeaver Classic with
      compatibility for its established projects and add-on ecosystem.
  usage:
    - >
      Users build sites from themes in a graphical, offline Mac application, preview
      responsive layouts, and publish generated files locally or through FTP, FTPS,
      SFTP, or Amazon S3. Publishing destinations and hosting credentials are configured
      per project, while project documents are saved at user-selected locations.
