id: brew:mvnvm
display-name: mvnvm
repo: https://bitbucket.org/mjensen/mvnvm
docs:
  - https://bitbucket.org/mjensen/mvnvm
  - https://bitbucket.org/mjensen/mvnvm/raw/master/README.md
config-file-location:
  unix:
    - mvnvm.properties
    - ~/.mvnvm.properties
credentials-file-location: null
history:
  project-history:
    - >
      The tool works by reading mvnvm.properties in a project directory, or
      ~/.mvnvm.properties for a user-wide default, and then selecting or downloading the
      requested Maven distribution before passing ordinary arguments through to mvn.
      That gives Java projects a lightweight analogue to runtime-version managers: the
      repository can declare mvn_version=... so contributors and CI jobs use the same
      Maven release without committing the Maven binaries themselves.
  sources:
    - https://bitbucket.org/mjensen/mvnvm/
    - https://bitbucket.org/mjensen/mvnvm/raw/master/README.md
    - https://formulae.brew.sh/formula/mvnvm
  summary:
    - >
      mvnvm is a Maven version manager that grew out of Atlassian-associated Java build
      tooling. Its README presents it as a simpler way to invoke Maven and manage the
      Maven version used by a team, with copyright attributed to Atlassian and others
      from 2013 through 2023.
  usage:
    - >
      Its package-manager footprint is small, with Homebrew carrying it as a formula, so
      its niche is mainly teams that want Maven version pinning without changing their
      build to the Maven Wrapper or a larger environment manager.
related-packages: []
tags:
  - build-tool
  - cli
  - java
  - maven
  - version-manager
provenance:
  category-sources:
    - 'source_facts.description: Maven version manager.'
  display-name-sources:
    - source_facts.name and official repository name use mvnvm.
  docs-sources:
    - Official Bitbucket README documents usage and properties.
  history-sources:
    - https://bitbucket.org/mjensen/mvnvm/
    - https://bitbucket.org/mjensen/mvnvm/raw/master/README.md
    - https://formulae.brew.sh/formula/mvnvm
  repo-sources:
    - >
      source_facts.homepage and official Bitbucket repository are
      https://bitbucket.org/mjensen/mvnvm.
  tags-sources:
    - Official README describes invoking Maven and managing Maven versions.
category-confidence: high
category-path:
  - developer-tools
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: high
tags-confidence: high
