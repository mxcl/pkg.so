history:
  adoption-history:
    - >
      libirecovery is adopted mostly through restore, recovery, and device-support
      tooling rather than end-user applications. Its presence in Homebrew, Debian and
      Ubuntu as irecovery, Fedora, MacPorts, Nix, and Alpine reflects the need for a
      packaged recovery-mode utility in open source Apple-device workflows.
  package-nerd-significance:
    - >
      For package maintainers, libirecovery is notable because it is small but
      version-sensitive: device databases, USB backends, readline support,
      libimobiledevice-glue, and idevicerestore compatibility all matter. It is the
      package that makes recovery-mode support available without bundling restore
      tooling into every consumer.
  project-history:
    - >
      The README describes libirecovery as a cross-platform library for communicating
      with iBoot and iBSS over USB and says it is a fork of an older version from former
      openjailbreak.org. The project is intended for use with idevicerestore and the
      larger libimobiledevice project.
    - >
      The repository tags show early 0.1-era tags in 2011, while the project's first
      1.0.0 GitHub release was part of the June 15, 2020 libimobiledevice release round
      that also included idevicerestore 1.0.0 and libimobiledevice 1.3.0. Later releases
      continued to track Apple hardware IDs, recovery-mode behavior, and Windows and
      macOS build details.
  related-projects:
    - >
      Related projects include idevicerestore, libimobiledevice, libimobiledevice-glue,
      libusb, Apple iBoot and iBSS, and historical openjailbreak.org recovery tooling.
  sources:
    - https://github.com/libimobiledevice/libirecovery
    - https://github.com/libimobiledevice/libirecovery/releases
    - https://libimobiledevice.org/news/2020/06/15/release-galore/
    - https://libimobiledevice.org/news/2025/09/12/libirecovery-1.3.0-release/
    - https://libimobiledevice.org/news/2025/10/17/libirecovery-1.3.1-release/
    - https://raw.githubusercontent.com/libimobiledevice/libirecovery/master/README.md
  summary:
    - >
      libirecovery is the libimobiledevice-family library and irecovery command for
      talking to iBoot and iBSS on Apple iOS devices over USB. It occupies the
      recovery-mode corner of the broader open source Apple-device stack.
  timeline:
    - '2011-03-04: The repository records a 0.1 tag-era commit for early libirecovery code.'
    - >
      2020-06-15: libirecovery 1.0.0 was announced in the libimobiledevice release round
      alongside idevicerestore 1.0.0.
    - '2023-05-13: libirecovery 1.1.0 was published on GitHub releases.'
    - '2024-03-23: libirecovery 1.2.0 was published on GitHub releases.'
    - >
      2025-09-12: libirecovery 1.3.0 added iOS 1 and iOS 2 recovery-mode support and
      updated the device database.
    - >
      2025-10-17: libirecovery 1.3.1 added support for M5-family devices and fixed MSVC
      array-initialization compatibility.
  usage:
    - >
      The irecovery tool is used for low-level recovery-mode interaction, and the
      library is used by idevicerestore and related utilities that need USB
      communication with iBoot or iBSS. This is a lower-level workflow than ordinary
      device info, backup, or AFC file access through libimobiledevice.
related-packages:
  - id: brew:libimobiledevice
    reason: >
      Use libimobiledevice to communicate with Apple devices in normal mode and its
      ideviceenterrecovery tool to transition a device before using libirecovery for
      bootloader-level recovery interaction.
    rel: adjacent_workflow
