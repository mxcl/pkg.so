history:
  adoption-history:
    - >
      The official GitHub project accumulated a substantial user and contributor
      following as a macOS Shadowsocks-family client. Its repository records thousands
      of stars and more than a thousand forks, although the project documentation has
      since been withdrawn.
  package-nerd-significance:
    - >
      ShadowsocksX-NG-R is part of the lineage of menu-bar proxy clients that made
      Shadowsocks and related protocols accessible to macOS users. Its Homebrew cask
      provided a repeatable installation route for a GUI networking tool otherwise
      distributed through GitHub releases.
  project-history:
    - >
      ShadowsocksX-NG-R was developed as a fork of the official ShadowsocksX-NG macOS
      client. Release history shows continued work on proxy subscriptions,
      compatibility, signing, dark mode, and bundled routing-list updates.
    - >
      The repository's current branch contains a notice that the project was removed
      because of regulation, leaving its release archive and repository history as the
      main official record.
  related-projects:
    - Shadowsocks
    - ShadowsocksX-NG
    - ShadowsocksR
  sources:
    - 'Official releases: https://github.com/qinyuhang/ShadowsocksX-NG-R/releases'
    - 'Official repository: https://github.com/qinyuhang/ShadowsocksX-NG-R'
  summary:
    - >
      ShadowsocksX-NG-R is a macOS graphical proxy client derived from ShadowsocksX-NG
      and associated with the ShadowsocksR ecosystem.
  timeline:
    - "2017: The project's public issue history documents active macOS use."
    - >
      2020: Later releases addressed signing, dark mode, dependencies, and routing-list
      updates.
    - 'Later: The repository content was removed with a regulatory notice.'
  usage:
    - >
      Users historically supplied a compatible proxy-server profile, selected routing or
      proxy behavior from the macOS interface, and used the menu-bar application to
      enable or disable system proxying. No authoritative current file path for its
      stored profiles is documented.
