history:
  adoption-history:
    - >
      The product targets small businesses and operational workflows that need label
      printing without a large enterprise labeling stack. Its support for
      spreadsheet-driven bulk printing and common thermal-printer brands broadened its
      role from a simple designer to a lightweight production-label tool.
  package-nerd-significance:
    - >
      Label LIVE is notable in desktop package catalogs as a specialized
      hardware-adjacent application distributed for both macOS and Windows. A Homebrew
      cask makes its direct-download Mac release easier to install and update
      declaratively.
  project-history:
    - >
      Caylan Sharp of Semireg Industries introduced Label LIVE as a cross-platform
      desktop application for designing and printing labels to USB-connected printers.
      The introductory release emphasized a similar experience on macOS and Windows,
      spreadsheet imports, barcode generation, and direct support for popular thermal
      printers.
  related-projects:
    - Zebra printers
    - Brother printers
    - DYMO printers
    - ROLLO printers
    - Microsoft Excel
  sources:
    - https://label.live/faqs
    - https://label.live/guides
    - https://label.live/guides/introducing-label-live
  summary:
    - >
      Label LIVE is a commercial cross-platform label-design and printing application
      from Semireg Industries. It combines visual label layout, barcodes, variable data,
      spreadsheet import, and direct printing.
  timeline:
    - 'Initial beta: Semireg Industries introduced Label LIVE for macOS and Windows.'
    - >
      Subsequent development: Official guides expanded to cover spreadsheet data,
      automation logic, print history, cloud imports, and bulk barcodes.
  usage:
    - >
      Users design label templates, add text, images, variables, and barcodes, import
      data from spreadsheets or cloud sources, and print through inkjet, laser, or
      supported thermal-label printers.
