id: brew:darker
display-name: Darker
repo: https://github.com/akaihola/darker
docs:
  - https://github.com/akaihola/darker
config-file-location:
  unix:
    - pyproject.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      Darker's official docs document installation from PyPI, conda-forge availability,
      editor integrations, pre-commit usage, and a GitHub Action. The changelog records
      early 2020 releases, a 1.0.0 release in July 2020, conda-forge availability in
      1.2.2, support for plain directories in 1.4.0, and a 3.0.0 release that added Ruff
      formatter support while moving linting to Graylint.
  package-nerd-significance:
    - >
      Darker matters to Python package maintainers because it is about incremental
      formatter adoption: it reduces formatting churn in old codebases while still
      letting projects standardize on tools such as Black, Ruff, isort, flynt, and
      pyupgrade.
  project-history:
    - >
      The README explains Darker as a response to a common adoption problem for Black:
      teams often want consistent formatting without one large repository-wide reformat.
      Darker compares revisions, formats with Black or another supported formatter, and
      writes back only the changed regions.
  related-projects:
    - >
      The README points to Black, Ruff, isort, flynt, pyupgrade, pytest-darker,
      Graylint, pre-commit, and the Darker GitHub Action as adjacent tools and
      integrations.
  sources:
    - https://github.com/akaihola/darker
    - https://github.com/akaihola/darker/blob/master/CHANGES.rst
    - https://github.com/akaihola/darker/releases
  summary:
    - >
      Darker is a Python formatting tool that applies Black-style formatting only to
      regions changed between Git revisions or in a working tree.
  timeline:
    - '2020: 0.1.0 and 1.0.0 were released.'
    - '2020: 1.2.2 added conda-forge availability.'
    - '2022: 1.4.0 added support for plain directories outside Git repositories.'
    - '2025: 3.0.0 added Ruff formatter support and changed default formatter dependencies.'
  usage:
    - >
      Users typically run darker on files or directories inside a Git repository,
      optionally selecting a revision range, showing a diff, or configuring behavior
      through pyproject.toml under tool.darker.
related-packages:
  - id: brew:black
    reason: >
      Choose Black directly for whole-project formatting or new codebases; Darker
      upstream specifically reserves its changed-region workflow for incremental
      adoption.
    rel: alternative
    sources:
      - https://github.com/akaihola/darker#why
      - https://black.readthedocs.io/en/stable/
  - id: brew:ruff
    reason: >
      Choose Ruff directly when you want a fast standalone formatter, while Darker can
      also invoke Ruff to restrict formatting to Git-changed regions.
    rel: alternative
    sources:
      - https://github.com/akaihola/darker#what
      - https://docs.astral.sh/ruff/formatter/
  - id: brew:isort
    reason: >
      Darker can run isort on imports alongside changed-region code formatting through
      its documented --isort integration.
    rel: adjacent_workflow
    sources:
      - https://github.com/akaihola/darker#what
      - https://pycqa.github.io/isort/
  - id: brew:pre-commit
    reason: >
      Darker publishes an official pre-commit hook and setup instructions for running
      changed-region formatting before commits.
    rel: adjacent_workflow
    sources:
      - https://github.com/akaihola/darker#using-as-a-pre-commit-hook
      - https://pre-commit.com/
  - id: brew:git
    reason: >
      Darker uses Git revisions and the working tree to discover modified regions, so
      Git supplies the history underlying its primary workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/akaihola/darker#what
      - https://git-scm.com/about
tags:
  - black
  - cli
  - formatter
