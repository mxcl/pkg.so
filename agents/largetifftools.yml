history:
  adoption-history:
    - >
      LargeTIFFTools is niche, but it entered general package ecosystems because it
      solves a real memory-bound image-processing problem. Debian packaged 1.3.7 on
      2016-11-10, and Debian's package page lists it as a C program for
      TIFF/raster-image work with libtiff, JPEG, PNG, and OpenMP runtime dependencies.
  package-nerd-significance:
    - >
      For package nerds, LargeTIFFTools is an example of the tiny scientific utility
      that earns a formula because the general tools can be too memory-hungry. It
      complements libtiff, ImageMagick, and GraphicsMagick by specializing in
      large-slide TIFF workflows.
  project-history:
    - >
      The official page says LargeTIFFTools was developed by the Modeling of the Living
      team at IJCLab, formerly IMNC, near Paris. It is tied to pathology and microscopy
      slide image workflows, and the page asks academic users to cite a 2013 Diagnostic
      Pathology article about analyzing huge pathology images with open-source software.
    - >
      The toolkit consists of `tiffmakemosaic`, `tifffastcrop`, and `tiffsplittiles`.
      Its release notes emphasize practical file-format and robustness improvements:
      broader bit-depth handling, PNG output, libpng build compatibility, better
      corrupted-input exit codes, Fax-like compression support, multi-directory TIFF
      handling, WebP and Zstd compression support, and zero-size image checks in release
      1.4.2.
  related-projects:
    - >
      Related projects include libtiff, BigTIFF, ImageMagick, GraphicsMagick, NDPITools,
      and microscopy/pathology whole-slide imaging tools.
  sources:
    - https://bigtiff.org/
    - >
      https://metadata.ftp-master.debian.org/changelogs/main/l/largetifftools/largetifftools_1.4.2-2_changelog
    - https://packages.debian.org/sid/largetifftools
    - https://pperso.ijclab.in2p3.fr/page_perso/Deroulers/software/largetifftools
  summary:
    - >
      LargeTIFFTools is a small open-source toolkit for manipulating very large TIFF
      files without loading the whole image into memory.
  timeline:
    - >
      2013: The official page points academic users to a Diagnostic Pathology article on
      huge pathology images.
    - '2016-11-10: Debian changelog records initial Debian packaging of version 1.3.7.'
    - '2017-09-18: Debian changelog records new upstream version 1.3.10.'
    - >
      2021-07-17: Debian changelog records version 1.4 with WebP and Zstd-related
      packaging dependencies.
    - '2025-02-26: Debian changelog records new upstream version 1.4.2.'
  usage:
    - >
      Users apply the tools from a shell or by drag-and-drop on Windows. Typical jobs
      include making mosaics, extracting rectangular regions, and splitting tiled TIFFs
      into independent files while avoiding whole-image decoding.
related-packages:
  - id: brew:libtiff
    reason: >
      LibTIFF provides the underlying TIFF library plus general inspection, conversion,
      cropping, and splitting commands that complement LargeTIFFTools' specialized
      huge-image operations.
    rel: adjacent_workflow
    sources:
      - https://pperso.ijclab.in2p3.fr/page_perso/Deroulers/software/largetifftools
      - https://libtiff.gitlab.io/libtiff/tools.html
  - id: brew:imagemagick
    reason: >
      Choose ImageMagick when broad format conversion and general image manipulation
      matter more than LargeTIFFTools' memory-conscious specialization for exceptionally
      large TIFF images.
    rel: alternative
    sources:
      - https://pperso.ijclab.in2p3.fr/page_perso/Deroulers/software/largetifftools
      - https://imagemagick.org/command-line-processing
