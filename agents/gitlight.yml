history:
  adoption-history:
    - >
      The project is available as a browser application and as desktop software for
      macOS, Windows, and Linux. Its official README also documents installation through
      Homebrew.
  package-nerd-significance:
    - >
      GitLight packages code-hosting notification triage into a focused desktop
      application, offering developers an alternative to repeatedly checking GitHub and
      GitLab web interfaces.
  project-history:
    - >
      GitLight was created as a free and open-source desktop interface for GitHub and
      GitLab notifications. It is built with Tauri and SvelteKit and combines
      notifications from both hosting services.
  related-projects:
    - GitHub and GitLab provide the notification streams that GitLight presents.
  sources:
    - https://github.com/colinlienard/gitlight#readme
    - https://gitlight.app/
  summary:
    - >
      GitLight is a cross-platform desktop and web application for monitoring GitHub and
      GitLab activity.
  timeline:
    - GitLight became available as both a browser application and native desktop software.
  usage:
    - >
      Users connect their code-hosting accounts, receive push notifications, and triage
      activity through a Kanban-style interface. Events can be filtered by repository,
      organization, pull request, issue, or commit.
