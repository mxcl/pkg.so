history:
  adoption-history:
    - >
      zziplib found its niche in applications that wanted to bundle many read-only
      resource files into a single ZIP while keeping code close to ordinary file and
      directory access. The documentation explicitly names game and graphics application
      developers as requesters of extension and custom I/O support.
    - >
      Its model is intentionally narrower than full ZIP tools: applications can create
      archives with ordinary zip/unzip utilities and then ship zziplib only for final
      read access. That made it attractive for packaged games, resource archives, and
      embedded or portable software where a small zlib-based reader was enough.
  package-nerd-significance:
    - >
      ZZIPlib is interesting because it captures an old packaging trick: ship assets as
      ZIP files but let code pretend they are files. The LGPL/MPL licensing, zlib
      dependency, POSIX-like API, SDL-oriented examples, and odd collection of small
      tools make it a very package-nerd archive library.
  project-history:
    - >
      The official history says Guido Draheim developed zziplib from Tomi Ollila's
      zip08x work. The API documentation says Draheim picked up Ollila's ZIP decoder
      routines and wrapped them with call signatures resembling POSIX file APIs, so
      zzip_open has the same general shape as open(2) but can open zipped files.
    - >
      The SourceForge documentation dates the ZIP access page to June 1, 2000 and the
      programmer interface page to July 20, 2002. The project page notes that it was
      later hosted on GitHub, and the GitHub repository summary says the project
      originated in 1999, was adopted by Guido Draheim in 2000, and moved to GitHub in
      2017 for easier collaboration.
  related-projects:
    - >
      zziplib depends on zlib for decompression and sits near Info-ZIP, PKWARE ZIP
      specifications, zipios++, SDL resource-loading examples, Java JAR files, Quake PK3
      files, and OpenOffice or StarOffice ZIP-based document formats.
  sources:
    - https://github.com/gdraheim/zziplib
    - https://zziplib.sourceforge.net/history.html
    - https://zziplib.sourceforge.net/zzip-api.html
    - https://zziplib.sourceforge.net/zzip-extio.html
    - https://zziplib.sourceforge.net/zzip-zip.html
  summary:
    - >
      ZZIPlib is a lightweight C library for read access to ZIP archives and unpacked
      data, best known for POSIX-shaped zzip_ functions that can make zipped resources
      look file-like to an application.
  timeline:
    - "1999: Tomi Ollila explored ZIP decoder routines that became part of zziplib's ancestry."
    - '2000-06-01: The zziplib ZIP access documentation was created.'
    - >
      2002-04: Ollila gave up remaining zip08x copyright restrictions and pointed the
      zip08x README to zziplib, according to the project history.
    - >
      2002-07-20: The programmer interface documentation described zzip_open and related
      POSIX-like APIs.
    - '2017: The project moved to GitHub for collaboration.'
  usage:
    - >
      Developers can call direct ZIP APIs such as zzip_dir_open and zzip_file_open, or
      use magic wrappers such as zzip_open, zzip_read, and zzip_close. The extension I/O
      layer lets applications recognize ZIP-derived formats such as JAR or game-resource
      extensions and route reads through custom handlers.
related-packages:
  - id: brew:libzip
    reason: >
      Choose libzip when software must create, update, encrypt, or otherwise modify ZIP
      archives; ZZIPlib is optimized for lightweight read access and file-like resource
      loading.
    rel: alternative
    sources:
      - https://zziplib.sourceforge.net/
      - https://libzip.org/documentation/
  - id: brew:libarchive
    reason: >
      Choose libarchive for streaming access across many archive formats; choose ZZIPlib
      when ZIP-only, POSIX-like resource access is the central requirement.
    rel: alternative
    sources:
      - https://zziplib.sourceforge.net/
      - https://www.libarchive.org/
  - id: brew:zip
    reason: >
      Use the Zip command to create the resource archives that a deployed application
      later reads through ZZIPlib's lightweight runtime API.
    rel: adjacent_workflow
    sources:
      - https://zziplib.sourceforge.net/zzip-zip.html
      - https://infozip.sourceforge.net/Zip.html
