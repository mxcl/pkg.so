history:
  adoption-history:
    - >
      The supplied package metadata lists Homebrew and Nix packaging for the `snow`
      command. For package collections, SNOW's value is not broad modern adoption but
      its durable niche: a tiny, inspectable security/steganography utility with stable
      source and clear manual-page behavior.
  package-nerd-significance:
    - >
      Package nerds care about SNOW because it is the kind of small historical CLI that
      package managers keep alive: a single-purpose tool, a memorable algorithmic trick,
      a manual page, portable source, and no service or account model. It is also a
      useful test case for distinguishing real package names from unrelated projects
      with the same short name.
  project-history:
    - >
      The official manual was written in December 1996 and documents a compact
      Unix-style tool with concealment and extraction modes, optional compression,
      optional password-based encryption, and file or standard-input workflows. The home
      page records fixes in November 1998 for DOS encryption compatibility and DOS
      carriage-return handling.
    - >
      In June 2013, the author made SNOW available under the Apache 2.0 license. The
      official page still distributes source archives, DOS/Windows binaries, and Java
      versions, making it a preserved example of 1990s steganography software that
      remains easy to package.
  related-projects:
    - >
      SNOW is related to text steganography tools and to Matthew Kwan's ICE encryption
      work, which the manual and home page identify as the built-in encryption
      algorithm.
  sources:
    - https://darkside.com.au/snow/
    - https://darkside.com.au/snow/description.html
    - https://darkside.com.au/snow/manual.html
    - input.source_facts.package-manager
  summary:
    - >
      SNOW is Matthew Kwan's small command-line steganography program for hiding data in
      trailing spaces and tabs in text files.
  timeline:
    - '1996-12-29: Official manual page written.'
    - >
      1998-11-22: DOS encryption and carriage-return compatibility fixes recorded on the
      home page.
    - '2013-06-16: SNOW made available under the Apache 2.0 license.'
    - '2025-11-09: Official home page last modified by Matthew Kwan.'
  usage:
    - >
      SNOW conceals a message in an input text file by appending invisible whitespace
      and extracts a hidden message when no message is supplied. Options cover
      compression, quiet mode, capacity reporting, password encryption, line-length
      control, message files, and inline message strings.
tags:
