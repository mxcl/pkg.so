    - ~/.config/DevKinsta
  macos:
    - ~/Library/Application Support/DevKinsta
  windows:
    - '%APPDATA%\DevKinsta'
credentials-file-location: null
history:
  adoption-history:
    - >
      DevKinsta was introduced through Kinsta's community in December 2020 and reached
      the 1.0 series by January 2021. It supports local use without a Kinsta hosting
      plan, while MyKinsta customers can pull hosted sites locally and push changes to
      staging environments.
    - >
      The product expanded across macOS, Windows, and Ubuntu. Its 2022 releases added
      native ARM64 Docker images for Apple silicon and continued improving site
      synchronization and local development tooling.
  package-nerd-significance:
    - >
      DevKinsta packages a complete WordPress development stack—Docker, Nginx, MySQL,
      PHP, WordPress, MailHog, and Adminer—behind a desktop interface. It is notable to
      package users because it trades manual service configuration for reproducible
      containerized local sites and direct hosting integration.
  project-history:
    - >
      Kinsta announced DevKinsta in December 2020 as a desktop environment for creating
      local WordPress sites, downloading existing Kinsta sites, and sending work back to
      Kinsta environments.
    - >
      The 1.x series received installation and cross-platform fixes in early 2021.
      Version 2 followed in July 2021, and subsequent releases developed the
      Docker-backed stack, database handling, Apple-silicon support, and Kinsta
      synchronization.
    - >
      Current documentation presents DevKinsta as a local WordPress suite available for
      macOS, Windows, and supported Ubuntu systems. A Kinsta account is optional for
      local development but required for MyKinsta synchronization.
  related-projects:
    - >
      DevKinsta uses Docker, Nginx, MySQL, PHP, WordPress, MailHog, and Adminer.
      MyKinsta provides its remote hosting integration.
  sources:
    - https://community.kinsta.com/t/devkinsta-2-0-released/842
    - https://community.kinsta.com/t/devkinsta-releases-minor/371
    - https://community.kinsta.com/t/welcome-to-devkinsta/49
    - https://kinsta.com/docs/devkinsta/
    - https://kinsta.com/docs/devkinsta/devkinsta-integration/
  summary:
    - >
      DevKinsta is Kinsta's free desktop suite for creating and managing containerized
      local WordPress development sites.
  timeline:
    - '2020-12-03: Kinsta publicly welcomed users to DevKinsta'
    - '2021-01: DevKinsta 1.0 series available'
    - '2021-07: DevKinsta 2.0 series released'
    - '2022-03: Version 2.5 added native ARM64 Docker images for Apple silicon'
  usage:
    - >
      Users create fresh local WordPress sites or import existing sites, then work with
      bundled web, database, email-testing, and logging tools. Local sites are stored
      under a configurable site folder, which defaults to the user's DevKinsta
      directory.
    - >
      Kinsta customers can pull sites from MyKinsta and push local changes to eligible
      staging environments. DevKinsta displays per-site database credentials in its
      interface; users should back up site files and databases before operations that
      may remove Docker data.
