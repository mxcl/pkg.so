id: brew:budget-tracker
display-name: Budget Tracker TUI
repo: null
docs:
  - https://github.com/Feromond/budget-tracker-tui#readme
config-file-location:
  linux:
    - ~/.config/BudgetTracker/config.json
  macos:
    - ~/Library/Application Support/BudgetTracker/config.json
  windows:
    - '%APPDATA%\BudgetTracker\config.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      Distributed through Homebrew as `budget-tracker`; the project is also designed for
      installation in the Rust ecosystem.
  package-nerd-significance:
    - >
      A small Rust-and-Ratatui application that exemplifies the modern package-manager
      niche for polished, keyboard-driven replacements for desktop personal-finance
      tools.
  project-history:
    - >
      Created as an open-source terminal budget tracker, the project developed from
      basic transaction recording into a local personal-finance application with
      categorization, budgets, and spending visualization.
  related-projects:
    - >
      Built in the Rust terminal-interface ecosystem and associated with Ratatui-style
      TUI applications.
  sources:
    - source_facts.description
    - source_facts.homepage
    - source_facts.package-manager
  summary:
    - >
      Budget Tracker TUI is a local, keyboard-driven personal-finance application for
      recording income and expenses and reviewing budgets from a terminal.
  timeline:
    - 'Initial development: Released as an open-source Rust terminal application.'
    - 'Homebrew adoption: Packaged as the `budget-tracker` formula.'
  usage:
    - >
      Run `budget-tracker` to manage transactions, categories, budgets, and spending
      views without leaving the terminal.
related-packages:
  - id: brew:hledger
    reason: >
      Choose hledger when you want version-controllable plain-text journals and CLI,
      TUI, or web reporting; choose Budget Tracker TUI for an integrated SQLite-backed
      interactive budgeting application.
    rel: alternative
    sources:
      - https://github.com/Feromond/budget-tracker-tui
      - https://hledger.org/
tags:
  - budgeting
  - cli
  - personal-finance
  - rust
  - terminal
  - tui
provenance:
