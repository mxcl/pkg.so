id: brew:immich-go
display-name: immich-go
repo: null
docs:
  - https://github.com/simulot/immich-go#readme
config-file-location:
  unix:
    - ./immich-go.toml
credentials-file-location:
  unix:
    - ./immich-go.toml
history:
  adoption-history:
    - >
      immich-go became important because the official Immich CLI intentionally keeps a
      narrower scope. The official Immich CLI documentation recommends immich-go for
      Google Photos Takeout imports, giving the community tool a clear place in the
      official migration story.
    - >
      The repository has several thousand GitHub stars in repository metadata, and the
      input metadata records packages across Homebrew, Nix, Arch, and winget. Homebrew
      formula analytics also show more installs than several smaller image tools in this
      batch, consistent with active use by self-hosters migrating large libraries.
  package-nerd-significance:
    - >
      immich-go is package-nerd significant because it is a classic static-binary answer
      to a fast-moving web application's migration pain. It complements the official CLI
      by trading monorepo alignment for easy cross-platform distribution and specialized
      import heuristics, especially around Google Photos Takeout metadata.
  project-history:
    - >
      The GitHub repository was created on 2023-07-21. The project's motivation document
      says the author needed to migrate NAS-stored photos and Google Photos content into
      Immich, wanted better handling of Google Takeout archive oddities, and chose Go
      partly to avoid deploying a Node.js program to user machines.
    - >
      As Immich's API changed, immich-go tracked the server ecosystem rather than
      standing still as a one-off importer. Release metadata for v0.32.0 in June 2026
      explicitly calls out compatibility work for Immich V3 while maintaining
      compatibility with Immich V2.
  related-projects:
    - >
      immich-go is built around the Immich server API and is explicitly related to
      immich-cli. Its migration focus also connects it to Google Photos Takeout and
      iCloud export workflows.
  sources:
    - https://docs.immich.app/features/command-line-interface
    - https://formulae.brew.sh/formula/immich-go
    - https://github.com/simulot/immich-go
    - https://github.com/simulot/immich-go/blob/main/docs/misc/motivation.md
    - https://github.com/simulot/immich-go/releases
  summary:
    - >
      immich-go is a community-maintained Go utility for uploading and migrating large
      photo collections into Immich. Its README describes it as an open-source tool for
      uploading from local folders, Google Photos Takeout, iCloud exports, ZIP archives,
      and other Immich servers without requiring Node.js or Docker.
  timeline:
    - '2023-07-21: GitHub repository created.'
    - '2025-03-22: v0.25.0 release published with iCloud import noted in the release name.'
    - '2025-09-22: v0.28.0 release published with concurrent uploads noted in the release name.'
    - '2025-11-23: v0.31.0 release published.'
    - '2026-06-25: v0.32.0 release published with Immich V3 compatibility.'
  usage:
    - >
      The README documents commands for uploading from folders and Google Photos Takeout
      archives, archiving from an Immich server, duplicate detection, album and tag
      creation, RAW+JPEG and burst-photo stacking, iCloud import, server-to-server
      migration, and skipped-file patterns for common system artifacts. Its command
      style centers on explicit --server and --api-key options.
related-packages:
  - id: brew:immich-cli
    reason: >
      Choose the official Immich CLI for supported general uploads and server
      inspection; choose immich-go when you need the specialized Google Photos Takeout,
      iCloud, archival, or server-migration workflows documented by immich-go and
      recommended by Immich for Takeout imports.
    rel: alternative
    sources:
      - https://docs.immich.app/features/command-line-interface/
      - https://github.com/simulot/immich-go/blob/main/docs/README.md
