history:
  adoption-history:
    - >
      The supplied package-manager metadata shows Tarlz available in Homebrew, Debian,
      Nix, and Ubuntu. That is the expected adoption path for a small Unix archiving
      tool: source releases from the upstream lzip project, then distribution packaging
      for users who need lzip-compatible backup/archive workflows.
  package-nerd-significance:
    - >
      Package nerds care because Tarlz argues for archive format details that ordinary
      tar pipelines hide: member alignment, CRC-protected metadata, corruption recovery,
      and parallel decoding. It is the sort of tool that matters to distribution
      maintainers, backup users, and compression people who care about long-term archive
      integrity.
  project-history:
    - >
      The official NonGNU page describes Tarlz as a massively parallel combined
      implementation of the tar archiver and the lzip compressor using lzlib. The
      official manual is copyrighted 2013-2026 by Antonio Diaz Diaz, and the official
      download index shows public tarlz tarball releases from 0.3 in March 2018 through
      0.29 in January 2026.
  related-projects:
    - lzip, lzlib, plzip, lziprecover, GNU tar, POSIX pax format.
  sources:
    - >
      https://download.savannah.nongnu.org/releases/lzip/tarlz/ official release index:
      tarball versions and dates.
    - >
      https://www.nongnu.org/lzip/manual/tarlz_manual.html official manual: version
      0.29, usage, file-format notes.
    - >
      https://www.nongnu.org/lzip/tarlz.html official page: purpose, lzip/tar member
      alignment, recovery and parallel decoding claims.
    - 'input source_facts.package-manager: brew, Debian, Nix, Ubuntu packaging.'
  summary:
    - >
      Tarlz is a command-line archiver that combines tar-style archiving with lzip
      compression while preserving alignment between tar members and lzip members. Its
      niche is careful, recoverable, parallel-friendly tar.lz archives.
  timeline:
    - '2018-03: Official download index lists tarlz 0.3.'
    - '2019-02: Official download index lists tarlz 0.11.'
    - '2021-06: Official download index lists tarlz 0.21.'
    - '2023-09: Official download index lists tarlz 0.24.'
    - '2026-01: Official manual covers tarlz 0.29.'
  usage:
    - >
      Tarlz is used to create and extract multimember tar.lz archives, including
      appendable and recoverable archive layouts. Official docs emphasize parallel
      decompression, appending and deleting members, safer recovery from corruption, and
      POSIX-style backup behavior.
