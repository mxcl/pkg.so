credentials-file-location: null
history:
  adoption-history:
    - >
      PopClip has remained in continuous development since 2011. Its utility grew beyond
      built-in copy, paste, search, dictionary, and spelling operations through an
      extension model that lets users and developers add specialized actions.
    - >
      The official extension directory became a substantial part of the product's
      identity, distributing actions for text editing, web services, productivity
      applications, transformations, and developer workflows. Modern releases support
      signed extensions, automatic extension updates, multiple action instances,
      folders, and per-action settings.
  package-nerd-significance:
    - >
      PopClip is a durable example of the single-purpose, independently developed macOS
      utility: a small interaction enhancement grew into an extensible automation
      surface used across applications.
    - >
      Package enthusiasts care about the distinction between the proprietary PopClip
      application and its publicly inspectable extension ecosystem. The official
      `pilotmoon/PopClip-Extensions` repository contains maintained extension sources,
      but it is not the source repository for the PopClip application itself.
  project-history:
    - >
      PopClip was created by independent developer Nick Moore and first released on July
      18, 2011. Early updates expanded its contextual text menu with search, link
      opening, dictionary lookup, spelling correction, application exclusions, and
      menu-bar controls.
    - >
      The application has been maintained under the Pilotmoon Software name. Over time,
      its extension architecture matured from property-list packages into formats
      supporting JSON, YAML, JavaScript, TypeScript, snippets, scripted actions, APIs,
      signatures, and a curated extension directory.
  related-projects:
    - >
      The official site identifies SnipDo, formerly Pantherbar, as a Windows utility
      inspired by PopClip but unaffiliated with its developer.
    - >
      Related official repositories include `pilotmoon/PopClip-Extensions` for
      maintained extensions and `pilotmoon/PopClip-Localization` for translation
      resources; neither is the proprietary application's source repository.
  sources:
    - https://github.com/pilotmoon/PopClip-Extensions — official extension-source repository
    - https://www.popclip.app/changelog — official release chronology back to version 1.0
    - https://www.popclip.app/dev/ — official extension architecture reference
    - >
      https://www.popclip.app/guide/ — official overview, developer identity, and
      continuous-development statement
    - >
      https://www.popclip.app/guide/extensions — official extension usage and management
      documentation
  summary:
    - >
      PopClip is a paid macOS utility that displays a context-sensitive action bar when
      the user selects text. Built-in and installable actions provide editing,
      searching, translation, automation, and application-specific workflows.
  timeline:
    - '2011-07-18: PopClip 1.0 released'
    - '2011-11-09: Version 1.2 added search, link, dictionary, and spelling actions'
    - '2015-09-08: Version 1.5.3 added OAuth support for extensions'
    - >
      2023-08-30: Extension developer documentation moved from GitHub to the official
      documentation site
    - '2026-07-22: A major update expanded action organization and extension management'
  usage:
    - >
      PopClip runs in the background and appears when text is selected. Users click an
      action to copy, paste, search, look up, transform, translate, or send the
      selection to another application or service.
    - >
      Users extend it by installing packages or text snippets from the official
      directory. Extension authors define actions through a package-level `Config`
      dictionary and may implement URL, key-press, service, Shortcut, JavaScript,
      AppleScript, or shell-script actions.
