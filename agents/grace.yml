id: brew:grace
display-name: Grace
repo: https://plasma-gate.weizmann.ac.il/cgi-bin/viewvc.cgi/grace
docs:
  - https://plasma-gate.weizmann.ac.il/Grace/doc/FAQ.html
  - https://plasma-gate.weizmann.ac.il/Grace/doc/UsersGuide.html
config-file-location:
  unix:
    - ./gracerc
    - ./.grace/gracerc
    - ~/.grace/gracerc
    - $GRACE_HOME/gracerc
    - $GRACE_HOME/fonts/FontDataBase
credentials-file-location: null
history:
  adoption-history:
    - >
      Grace occupied a durable niche on Unix-like scientific workstations:
      point-and-click plotting with publication-quality output, batch capabilities, and
      file formats suited to lab workflows. Its official page also notes historical
      ports to VMS, OS/2, and older Windows systems, which reflects its use across
      scientific computing environments rather than only one desktop platform.
  package-nerd-significance:
    - >
      Grace matters to package nerds as a classic X11 scientific desktop application
      that still carries older Unix assumptions: Motif or LessTif UI dependencies,
      helper binaries, font data, batch mode, and export drivers. Packaging it is as
      much about preserving a lab plotting workflow as shipping a single binary.
    - >
      Its ACE/gr to Xmgr to Grace history also explains why users and downstream
      packages may still refer to `xmgrace` even when the package display name is Grace.
  project-history:
    - >
      The official FAQ and user guide identify Grace as derived from Xmgr, also known as
      ACE/gr, originally written by Paul Turner. Development from version 4.00 was taken
      over by a volunteer team coordinated by Evgeny Stambulchik.
    - >
      When the copyright changed to the GPL, the project name changed to Grace. The
      documentation expands the name as either 'GRaphing, Advanced Computation and
      Exploration of data' or 'Grace Revamps ACE/gr'. The first Grace version was
      numbered 5.0.0, while the last public Xmgr version was 4.1.2.
  related-projects:
    - Xmgr and ACE/gr are direct predecessors.
    - >
      Gnuplot and Genplot are comparable script-oriented plotting tools named in the
      official documentation.
    - >
      Sigmaplot and Microcal Origin are comparable GUI plotting tools named in the
      official documentation.
  sources:
    - https://plasma-gate.weizmann.ac.il/Grace/
    - https://plasma-gate.weizmann.ac.il/Grace/doc/CHANGES.html
    - https://plasma-gate.weizmann.ac.il/Grace/doc/FAQ.html
    - https://plasma-gate.weizmann.ac.il/Grace/doc/UsersGuide.html
    - https://plasma-gate.weizmann.ac.il/cgi-bin/viewvc.cgi/grace
  summary:
    - >
      Grace is a WYSIWYG two-dimensional plotting tool for numerical data on X11 and
      Motif-style Unix desktops. It belongs to the scientific-graphics lineage where a
      graphical plotting program also exposes a command language for automated and
      reproducible plotting.
  timeline:
    - '1991-1995: Official copyright notice credits Paul J. Turner for the Xmgr/ACE-gr era.'
    - 'Version 4.00: Development passed to a volunteer team coordinated by Evgeny Stambulchik.'
    - '5.0.0: First Grace-numbered version after the GPL/name change.'
    - >
      5.1.8: The official change log documents safe mode for command-language statements
      that could modify files.
  usage:
    - >
      Users run the GUI as `xmgrace` or use command-line helpers such as `gracebat` for
      batch plotting and conversion workflows. The official guide emphasizes the
      combination of GUI convenience and scripting power for calculations, automated
      tasks, and precise control of graph appearance.
    - >
      Grace project files and runtime configuration are conventional package-manager
      concerns because users often need stable fonts, default settings, and reproducible
      plot output across machines. The documented `gracerc` lookup locations and font
      database path are part of that operational footprint.
related-packages:
  - id: brew:gnuplot
    reason: >
      Choose gnuplot when a primarily script-driven plotting workflow is preferable;
      Grace's official FAQ contrasts that style with Grace's combined GUI and scripting
      approach.
    rel: alternative
    sources:
      - https://plasma-gate.weizmann.ac.il/Grace/doc/FAQ.html
      - http://www.gnuplot.info/
