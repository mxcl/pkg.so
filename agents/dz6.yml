id: brew:dz6
display-name: dz6
repo: null
docs:
  - https://dz6.dev.br
  - https://github.com/mentebinaria/dz6#readme
config-file-location:
  unix:
    - ~/.dz6init
  windows:
    - '%USERPROFILE%\.dz6init'
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is early but visible in package-manager culture: the README advertises
      installation through Cargo, Arch AUR, FreeBSD pkg, WinGet, and binary releases,
      while the repository had 175 GitHub stars and 15 forks when checked through the
      GitHub API on 2026-06-30.
  package-nerd-significance:
    - >
      For package nerds, dz6 is notable as a modern Rust/TUI entry in the old hex-editor
      category: small executable surface, cross-platform packaging, and command-line
      ergonomics tuned for reverse-engineering workflows rather than a GUI-first editor.
  project-history:
    - >
      The project comes from Mente Binaria, a reverse-engineering/security education
      group, which fits the README's focus on file inspection, forensics, malware
      analysis, string filtering, offset navigation, comments, bookmarks, and a
      calculator inside the hex editor.
    - >
      The tool's project history is still short: GitHub metadata shows the repository
      was created on 2025-11-15, and the README documents early packaging through Cargo,
      AUR, FreeBSD packages, WinGet, and GitHub releases.
  related-projects:
    - >
      Related tools include classic hex editors and binary-analysis utilities; dz6
      differentiates itself through terminal UI, Vim-style keys, and reverse-engineering
      oriented tags such as ELF, PE-file, malware-analysis, and forensics.
  sources:
    - https://github.com/mentebinaria/dz6
    - https://raw.githubusercontent.com/mentebinaria/dz6/main/README.md
    - https://api.github.com/repos/mentebinaria/dz6
  summary:
    - >
      dz6 is a young Rust terminal hex editor aimed at people who want a Vim-like
      workflow for binary inspection and editing. Its public repository was created in
      November 2025, and the project presents itself as a fast, cross-platform, open
      source TUI hex editor.
  timeline:
    - '2025-11-15: Public GitHub repository created.'
    - >
      2026: README documents Cargo, AUR, FreeBSD, WinGet, and release-package
      installation paths.
  usage:
    - >
      dz6 is used from the terminal as `dz6 [OPTIONS] <FILE>`, with optional initial
      offset and read-only mode. Its usage niche is binary triage and editing with
      keyboard-driven navigation, hex or ASCII editing, string search, bookmarks,
      comments, and Vim-style movement.
related-packages:
  - id: brew:bvi
    reason: >
      Choose bvi when you want the older, established curses-based binary editor with
      closer traditional vi semantics; choose dz6 for a modern Rust TUI with PE/ELF
      views and richer annotations.
    rel: alternative
    sources:
      - https://github.com/mentebinaria/dz6#readme
      - https://bvi.sourceforge.net/overview.php
      - https://bvi.sourceforge.net/man_bvi.html
