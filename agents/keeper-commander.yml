id: brew:keeper-commander
display-name: Keeper Commander
repo: https://github.com/Keeper-Security/Commander
docs:
  - https://docs.keeper.io/en/keeperpam/commander-cli/overview
  - https://github.com/Keeper-Security/Commander#readme
config-file-location:
  unix:
    - ~/.keeper/config.json
  windows:
    - '%USERPROFILE%\.keeper\config.json'
credentials-file-location:
  unix:
    - ~/.keeper/config.json
  windows:
    - '%USERPROFILE%\.keeper\config.json'
history:
  adoption-history:
    - >
      Keeper Commander is adopted by Keeper customers and administrators who need
      scriptable access to Keeper vault and enterprise features. Official Keeper
      documentation presents it as a way to automate many Keeper functions, including
      user and team provisioning, vault access, reports, imports, exports, PAM
      workflows, and SDK-based integrations.
    - >
      Package-manager support across Homebrew, Chocolatey, and winget reflects its
      cross-platform administrative role: teams need the `keeper` command available on
      macOS, Windows, and automation hosts without hand-building from source.
  package-nerd-significance:
    - >
      Keeper Commander is package-nerdy because it turns a hosted password-management
      platform into a local CLI surface with a long release train and multiple install
      channels. It is also an example of a security product exposing its operational
      model through an open-source command package rather than only through a web
      console.
  project-history:
    - >
      The Commander repository was created on 2015-09-01. Its README describes a
      Python-based CLI and SDK that provides administrative controls, reporting,
      import/export, and vault management for the Keeper Security platform. Older tags
      show the project was versioned before GitHub Releases became the main release
      surface; a v1.0 tag points at a 2018-07-27 version-increment commit.
    - >
      By 2021, the release stream had reached the v4.x line and then the v16.x line,
      with release names such as v16.1.1 noting Record Types and Secrets Manager. In
      2024 and later release notes, Commander continued to add enterprise and
      platform-administration features, including service-mode hardening, non-human
      identity reporting, OS-native keychain storage, and config-location changes.
  related-projects:
    - >
      Keeper Commander is related to Keeper Password Manager, KeeperPAM, Keeper Secrets
      Manager, Keeper's .NET and PowerShell Commander implementation, enterprise
      provisioning workflows, and package-manager manifests for Homebrew, Chocolatey,
      and winget.
  sources:
    - https://api.github.com/repos/Keeper-Security/Commander
    - >
      https://api.github.com/repos/Keeper-Security/Commander/commits/c0a6bed10bc2cc5d24ff7fcfdd84f259a4ed14f5
    - https://docs.keeper.io/en/keeperpam/commander-cli/overview
    - https://docs.keeper.io/enterprise-guide/commander-cli
    - >
      https://docs.keeper.io/enterprise-guide/user-and-team-provisioning/cli-provisioning-with-commander-sdk
    - https://github.com/Keeper-Security/Commander
    - https://github.com/Keeper-Security/Commander/releases
    - https://raw.githubusercontent.com/Keeper-Security/Commander/master/README.md
  summary:
    - >
      Keeper Commander is Keeper Security's open-source command-line, terminal UI, and
      Python SDK interface for the Keeper password-management and privileged-access
      platform. It is both an administrator automation tool and a developer integration
      surface for vault, enterprise, import/export, reporting, Secrets Manager, and
      KeeperPAM workflows.
  timeline:
    - '2015-09-01: GitHub repository created.'
    - '2018-07-27: The v1.0 tag points to a version-increment commit.'
    - '2021-05-04: GitHub Releases include v4.80.'
    - '2021-08-10: v16.1.1 release named Record Types and Secrets Manager.'
    - '2024-02-26: v16.10.5 was published.'
    - >
      2026-05-26: v18.0.4 release notes included service-mode hardening and an
      OS-standard config-location change.
    - '2026-06-23: v18.0.9 was published.'
  usage:
    - >
      Users install Commander as a binary, from source, or through Python packaging,
      then run `keeper` interactively, in shell mode, as a terminal vault UI, from
      scripts, or as a REST service. It stores login/configuration state in a Keeper
      config file and can be used for both personal vault operations and
      organization-wide administrative automation.
related-packages: []
tags:
  - cli
  - keeperpam
  - password-manager
  - sdk
