history:
  adoption-history:
    - >
      Responsively App developed as a free, open-source, community-powered tool
      available on macOS, Windows, and Linux. The official project repository has
      attracted a substantial contributor and user community.
    - >
      The application supports Homebrew, Chocolatey, WinGet, RPM, AppImage, and
      direct-download installation paths; the supplied package record identifies the
      Homebrew cask as `responsively`.
  package-nerd-significance:
    - >
      Responsively App packages a specialized Electron-based browser rather than
      requiring developers to assemble a collection of browser windows and extensions
      for responsive testing.
    - >
      Its cross-platform packages and open development model make it a recognizable
      example of a desktop web-development utility distributed through multiple
      operating-system package managers.
  project-history:
    - >
      Responsively App was created as an open-source modified browser focused on
      responsive web development. Its core idea is to show a web project in several
      device-sized viewports simultaneously and mirror interactions across them.
    - >
      The project expanded its workflow with customizable device suites, shared
      inspection, screenshots, hot reloading, browser extensions, and integrated
      developer tooling.
  related-projects:
