credentials-file-location: null
history:
  adoption-history:
    - >
      Jobber reached package-manager users through Homebrew and Nix, but its adoption
      stayed narrower than cron itself because it asks users to install a daemonized
      scheduler rather than rely on the base system. Its strongest niche is where
      operators want cron-like scheduling plus visible run history and more explicit
      failure behavior.
  package-nerd-significance:
    - >
      Jobber is interesting as a packaged cron alternative that tried to make failure
      semantics part of the job definition. For package maintainers and ops-minded
      users, it shows the tradeoff between richer scheduler behavior and the extra
      service-management surface of replacing a ubiquitous system tool.
  project-history:
    - >
      The GitHub repository was created in September 2014, and the release sequence
      shows a beta in January 2015 followed by v1.0.0 in January 2016. The project then
      moved through 1.1, 1.2, 1.3, and 1.4 lines, with v1.4.4 published in June 2020.
    - >
      Jobber's documentation settled around a per-user jobfile model: each user defines
      jobs in ~/.jobber, while jobbermaster and jobberrunner coordinate execution. The
      README later notes that the project is stable but not actively maintained due to
      lack of maintainer time.
  related-projects:
    - cron is the direct point of comparison and replacement target.
    - >
      systemd timers, anacron, and language-level job schedulers occupy adjacent
      scheduling territory, but Jobber's own documentation frames cron as the main
      comparison.
  sources:
    - The GitHub release API supplies the release timeline.
    - >
      The project site and README supply the cron-alternative positioning, project
      status, and feature set.
    - >
      The v1.4 documentation supplies the jobfile, daemon, CLI, error-handling, and
      run-log behavior.
  summary:
    - >
      Jobber is a Go-based Unix job scheduler positioned as a better-behaved alternative
      to cron. Its project site emphasizes scheduled command execution plus job
      execution history, error handling, retry/backoff behavior, and failure reporting.
  timeline:
    - '2014: GitHub repository created.'
    - '2015: v0.1.0 beta release published.'
    - '2016: v1.0.0 and early 1.x releases published.'
    - '2018: v1.3.x releases published.'
    - '2019: v1.4.0 release published.'
    - '2020: v1.4.4 release published.'
  usage:
    - >
      Users define YAML jobs with commands, schedules, onError behavior, result sinks,
      and optional run logs. The command-line interface supports loading jobs, listing
      jobs and recent runs, testing a job, pausing and resuming jobs, and printing a job
      command.
