id: brew:cherrytree
display-name: CherryTree
repo: https://github.com/giuspen/cherrytree
docs:
  - https://github.com/giuspen/cherrytree#readme
  - https://www.giuspen.net/cherrytree
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      CherryTree became a familiar package-manager entry because it filled the local,
      offline, tree-structured notes niche on Unix desktops. The input package metadata
      lists packages for Homebrew, Debian/Ubuntu, Arch, Alpine, MacPorts, Nix, openSUSE,
      Chocolatey, Scoop, and winget.
    - >
      Homebrew's formula metadata reported 3,461 installs in the trailing 365-day window
      at research time, a modest but real signal for a GUI app in a mostly CLI package
      manager.
  package-nerd-significance:
    - >
      CherryTree is package-nerd-interesting because it is a desktop productivity app
      that still behaves like a good Unix package: source tarballs, distro packaging,
      predictable local files, and no hosted service dependency.
    - >
      Its Homebrew formula is also a reminder that Brew is not just compilers and
      daemons; it carries end-user GTK applications when they have stable upstream
      releases.
  project-history:
    - >
      The official README describes CherryTree as a hierarchical note-taking application
      written by Giuseppe Penone and Evgenii Gurianov. Its feature set grew around
      programmer-friendly notes: rich text, code boxes, syntax highlighting, embedded
      files, import/export, PDF/HTML/plain-text output, and storage as XML or SQLite.
    - >
      The project is distributed from giuspen.net and developed in the official GitHub
      repository. Current releases continue to ship cross-platform binaries and source
      archives, with Homebrew tracking version 1.7.0 in 2026.
  related-projects:
    - >
      The official README names SourCherry as a third-party Android project and
      cherrytree-notes-web-interface as an enhanced web interface for HTML exports.
    - >
      CherryTree sits near other local note-tree tools in the package ecosystem,
      especially older import targets such as KeepNote, NoteCase, Zim, Tomboy, and
      RedNotebook.
  sources:
    - https://github.com/giuspen/cherrytree#readme
    - https://www.giuspen.net/cherrytree/
    - https://formulae.brew.sh/api/formula/cherrytree.json
  summary:
    - >
      CherryTree is a GTK desktop note-taking application built around hierarchical
      notebooks, rich text, syntax highlighting, and portable single-file or
      directory-backed storage.
  timeline:
    - '2025: CherryTree 1.x releases continued on GitHub, including 1.6.x maintenance releases.'
    - '2026: CherryTree 1.7.0 was published upstream and tracked by Homebrew.'
  usage:
    - >
      Users launch the `cherrytree` desktop executable to maintain hierarchical note
      trees, often mixing formatted prose, code snippets, images, links, and exported
      documents in one notebook file.
    - >
      The official README notes import support from several older note tools, which
      matters for users moving long-lived personal knowledge bases between desktop note
      applications.
related-packages:
  - id: brew:zim
    reason: >
      Choose Zim when transparent plain-text wiki files and Git-friendly storage matter
      more than CherryTree's rich-text, embedded-file, and single-database workflow;
      CherryTree can import Zim notebooks.
    rel: alternative
    sources:
      - https://github.com/giuspen/cherrytree#readme
      - https://zim-wiki.org/manual/About.html
