history:
  adoption-history:
    - >
      MariaDB 11.4 became a natural landing point for users who wanted to leave older
      10.x branches while avoiding short-lived 11.x releases. The Foundation explicitly
      framed 11.4 LTS as a way to encourage broader MariaDB 11 adoption.
    - >
      For package users, adoption is often controlled by production parity: a versioned
      formula lets local development, CI, and migration testing stay on 11.4 even if the
      unversioned Homebrew formula moves to a newer LTS.
  package-nerd-significance:
    - >
      The package significance of mariadb@11.4 is controlled modernization. It gives
      users a stable 11.x target without forcing them to jump to each later branch,
      which matters for SQL compatibility, dumps, replication testing, plugins, and
      client tooling.
    - >
      As an LTS branch maintained until May 2029, 11.4 is a strong default pin for users
      who need a supported MariaDB line but are not ready to follow yearly LTS upgrades
      immediately.
  project-history:
    - >
      MariaDB began in 2009 as a MySQL-compatible community fork and later developed its
      own release policy and source tree. By the 11.x generation, MariaDB had separated
      feature-development cadence from long-term-support expectations.
    - >
      MariaDB Foundation announced in April 2024 that MariaDB Server 11.4 would be an
      LTS release to support users expecting five years of bug fixes in a release with a
      locked feature set. The 11.4.2 release notes identify 29 May 2024 as the Stable GA
      date and say 11.4 is maintained until May 2029.
  related-projects:
    - MariaDB 10.11 is the older 10.x LTS line for conservative compatibility.
    - MariaDB 11.8 is the next yearly LTS after 11.4.
    - >
      MariaDB Connector/C provides the client library used by C/C++ applications
      connecting to 11.4.
  sources:
    - https://mariadb.com/docs/release-notes/community-server/11.4/11.4.2
    - >
      https://mariadb.com/docs/server/clients-and-utilities/server-client-software/download/getting-the-mariadb-source-code
    - >
      https://mariadb.com/docs/server/server-management/install-and-upgrade-mariadb/configuring-mariadb/configuring-mariadb-with-option-files
    - https://mariadb.org/11-4-lts/
    - https://mariadb.org/about/
    - https://mariadb.org/download/
    - https://mariadb.org/mariadb-server-turns-fifteen/
  summary:
    - >
      MariaDB 11.4 is a long-term-support MariaDB Server line and the first broadly
      stabilizing LTS in the 11.x generation. The Homebrew mariadb@11.4 formula is
      useful when users want newer 11.x behavior but need a locked feature set and a
      support window rather than a moving default.
  timeline:
    - '2009: MariaDB began as a community fork of MySQL.'
    - '2024: MariaDB Foundation announced that MariaDB Server 11.4 would be LTS.'
    - '2024: MariaDB 11.4.2 became Stable GA on 29 May 2024.'
    - '2025: MariaDB 11.8 succeeded 11.4 as the next yearly LTS.'
    - '2029: MariaDB 11.4 maintenance is scheduled through May 2029.'
  usage:
    - >
      Use mariadb@11.4 when an application is certified for MariaDB 11.4, when
      production is on the 2024 LTS line, or when users want 11.x features with an LTS
      maintenance horizon.
    - >
      MariaDB 11.4 release notes call out dump/client compatibility behavior around a
      new sandbox command in mariadb-dump output. That is exactly the kind of packaging
      detail that makes version pinning useful for database users and tooling authors.
related-packages:
  - id: brew:mariadb@12.3
    reason: >
      Choose MariaDB 12.3 for the latest LTS feature generation when application testing
      permits a major upgrade; retain 11.4 when its established compatibility baseline
      matters more.
    rel: alternative
    sources:
      - https://mariadb.org/mariadb-server-12-3-lts-released/
      - https://mariadb.org/about/
  - id: brew:mysql@8.4
    reason: >
      Choose MySQL 8.4 when Oracle MySQL LTS compatibility and its specific ecosystem
      are required rather than MariaDB 11.4 features.
    rel: alternative
    sources:
      - https://dev.mysql.com/doc/refman/8.4/en/
      - >
        https://mariadb.com/docs/release-notes/community-server/about/compatibility-and-differences/mariadb-vs-mysql-compatibility
  - id: brew:mariadb-connector-c
    reason: >
      Use MariaDB Connector/C as the official native client library for C and C++
      programs connecting to MariaDB 11.4.
    rel: adjacent_workflow
    sources:
      - https://mariadb.com/docs/connectors/mariadb-connector-c
