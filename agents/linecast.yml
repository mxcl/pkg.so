id: brew:linecast
display-name: linecast
repo: https://github.com/ashuttl/linecast
docs:
  - https://github.com/ashuttl/linecast#readme
config-file-location:
  unix:
    - ~/.config/linecast/config.json
  windows:
    - '%USERPROFILE%/.config/linecast/config.json'
credentials-file-location: null
history: null
related-packages:
  - id: brew:wthrr
    reason: >
      wthrr is a narrower terminal-weather alternative focused on current, forecast, and
      historical weather with a configurable Rust TUI; choose it when linecast's maps,
      tides, and astronomy views are unnecessary.
    rel: alternative
    sources:
      - https://github.com/ashuttl/linecast#readme
      - https://github.com/ttytm/wthrr-the-weathercrab#readme
  - id: brew:wego
    reason: >
      wego is a forecast-focused alternative with selectable weather backends and ASCII,
      emoji, Markdown, and JSON frontends, making it better suited to backend choice and
      composable shell output.
    rel: alternative
    sources:
      - https://github.com/ashuttl/linecast#readme
      - https://github.com/schachmat/wego#readme
tags:
  - astronomy
  - cli
  - maps
  - moon
  - sunrise
  - terminal
  - tides
  - weather
provenance:
  category-sources:
    - 'Official linecast README: https://github.com/ashuttl/linecast'
    - source_facts.description
  display-name-sources:
    - Official repository name and README
  docs-sources:
    - The official repository README is the project's primary documentation surface.
  history-sources:
    - >
      The official project material documents current capabilities well but provides
      insufficient durable, dated history for a reliable historical narrative.
    - https://github.com/ashuttl/linecast
  repo-sources:
    - source_facts.homepage is the official source-control project page.
  tags-sources:
    - Official linecast README documents weather, sunshine, moon, tides, and maps commands.
    - source_facts.description
category-confidence: high
category-path:
  - science
  - weather
  - terminal-tools
display-name-confidence: high
docs-confidence: high
history-confidence: low
repo-confidence: high
tags-confidence: high
