id: brew:aerc
display-name: aerc
repo: https://git.sr.ht/~rjarry/aerc
docs:
  - https://aerc-mail.org/
  - https://man.sr.ht/~rjarry/aerc
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/aerc/aerc.conf
    - ~/.config/aerc/aerc.conf
credentials-file-location:
  unix:
    - $XDG_CONFIG_HOME/aerc/accounts.conf
    - ~/.config/aerc/accounts.conf
history:
  adoption-history:
    - >
      aerc is packaged across mainstream Unix package ecosystems, including Homebrew,
      Debian, Ubuntu, Fedora, Arch, Alpine, MacPorts, Nix, and openSUSE according to the
      supplied package-manager facts. That breadth is a useful signal for a terminal
      mail client: package maintainers consider it a normal installable tool rather than
      a source-only niche.
    - >
      Its adoption niche overlaps with developers who use email as part of
      source-control workflows. The homepage calls out first-class support for working
      with git and email, a notable feature for users who review and send patches
      through mailing lists.
  package-nerd-significance:
    - >
      aerc matters to package nerds because it is a modern terminal mail client with a
      broad backend matrix and a Unix-native configuration model. It sits in the same
      cultural space as mutt/neomutt and alpine, but with Go-era packaging,
      SourceHut-native development, and explicit Git email support.
    - >
      The package is also a good example of how terminal applications increasingly
      bundle rich workflows without leaving the terminal: embedded terminal composition,
      terminal browser rendering, patch highlighting, threading, PGP integration, and
      asynchronous network support are all advertised by the project itself.
  project-history:
    - >
      The project is hosted on SourceHut at git.sr.ht/~rjarry/aerc and publishes release
      tags beginning with the 0.x series. Its public project identity has stayed close
      to hacker-oriented terminal mail: the homepage slogan is "a pretty good email
      client", and the official SourceHut summary says it is a pretty good email client
      that runs in your terminal.
    - >
      The project has continued as an actively maintained SourceHut project, with
      source, releases, mailing lists, bug tracker, and wiki all linked from the
      official homepage. The homepage also links FOSDEM 2024 and FOSDEM 2025 aerc
      material, reflecting a project with conference-facing Unix desktop and
      email-culture presence rather than a quiet one-off utility.
  related-projects:
    - >
      Related tools and protocols include IMAP, JMAP, Maildir, Notmuch, Mbox, SMTP,
      sendmail, GnuPG, git-send-email, mutt, neomutt, and SourceHut mailing-list
      workflows.
  sources:
    - https://aerc-mail.org/
    - https://git.sr.ht/~rjarry/aerc
    - https://git.sr.ht/~rjarry/aerc/blob/master/doc/aerc-accounts.5.scd
    - https://git.sr.ht/~rjarry/aerc/blob/master/doc/aerc-config.5.scd
    - source_facts.package-manager
  summary:
    - >
      aerc is a terminal email client for users who want a fast, keyboard-driven mail
      workflow inside the Unix terminal rather than a graphical mail application. Its
      official site describes it as an email client that runs in the terminal, with
      embedded-terminal composition, Vim-style key bindings, an ex-command system,
      Git-and-email workflows, and support for IMAP, JMAP, Maildir, Notmuch, Mbox, SMTP,
      and sendmail.
  timeline:
    - '0.1.0: Earliest public release tag visible in the official SourceHut repository.'
    - '2024: Official homepage links a FOSDEM 2024 aerc talk.'
    - '2025: Official homepage links FOSDEM 2025 aerc slides.'
    - '2026: SourceHut repository remains active, with 0.21.0 visible among release tags.'
  usage:
    - >
      Users configure aerc through XDG-style configuration files under the aerc config
      directory. The official aerc-config manpage says aerc uses aerc.conf, binds.conf,
      and accounts.conf under XDG config home plus aerc, defaulting to ~/.config/aerc,
      and that alternate files can be supplied on the command line.
    - >
      The accounts.conf file is security-sensitive. The official aerc-accounts manpage
      says it configures mail accounts, defaults to ~/.config/aerc/accounts.conf, may
      include account credentials, and must be kept secret. The config manpage also
      documents that accounts.conf permissions are expected to be restrictive unless the
      unsafe-accounts-conf option is explicitly enabled.
related-packages:
  - id: brew:neomutt
    reason: >
      Choose NeoMutt when you want the mature Mutt configuration ecosystem and its
      extensive mail-protocol and Notmuch features; choose aerc for its Go-based
      terminal UI, embedded terminals, and native asynchronous IMAP/JMAP design.
    rel: alternative
    sources:
      - https://aerc-mail.org/
      - https://docs.neomutt.org/
  - id: brew:notmuch
    reason: >
      aerc can use Notmuch as a backend, combining aerc's terminal mail interface with
      Notmuch's fast global search and tag-based local-mail index.
    rel: adjacent_workflow
    sources:
      - https://aerc-mail.org/
      - https://notmuchmail.org/
  - id: brew:gnupg
    reason: >
      Install GnuPG alongside aerc to provide the PGP signing, encryption, and
      signature-verification workflow advertised by the mail client.
    rel: adjacent_workflow
    sources:
      - https://aerc-mail.org/
      - https://gnupg.org/documentation/index.html
