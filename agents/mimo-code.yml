id: brew:mimo-code
display-name: MiMoCode
repo: https://github.com/XiaomiMiMo/MiMo-Code
docs:
  - https://github.com/XiaomiMiMo/MiMo-Code#readme
  - https://mimo.xiaomi.com/mimocode
config-file-location:
  unix:
    - .mimocode/mimocode.json
    - ~/.config/mimocode/mimocode.json
credentials-file-location:
  linux:
    - $XDG_DATA_HOME/mimocode/auth.json
    - ~/.local/share/mimocode/auth.json
  macos:
    - ~/Library/Application Support/mimocode/auth.json
history:
  project-history:
    - >
      Its technical identity is a fork of OpenCode with Xiaomi-added agent
      infrastructure for long-horizon coding work. The public README highlights
      persistent memory backed by SQLite FTS5, with project memory, session checkpoints,
      scratch notes, and per-task progress logs. Xiaomi's engineering write-up frames
      the design around computation, memory, and evolution: the runtime supplies tools,
      state, and context reconstruction around a stateless language model.
  sources:
    - https://github.com/XiaomiMiMo/MiMo-Code
    - https://mimo.mi.com/docs/en-US/news/latest/mimocode
    - https://mimo.xiaomi.com/blog/mimo-code-long-horizon
  summary:
    - >
      MiMoCode is a terminal-native AI coding assistant from Xiaomi's MiMo team. The
      project is published under the MIT license and describes itself as a coding agent
      that can read and write code, run commands, manage Git, and preserve project
      knowledge across sessions.
  usage:
    - >
      In practice, the Homebrew package installs the `mimo` CLI for developers who want
      a terminal coding agent with OpenCode-like provider, TUI, LSP, MCP, and plugin
      support plus persistent memory and task orchestration. Its niche is among agentic
      coding CLIs such as OpenCode, Claude Code, and Codex-style local agents, with the
      main distinguishing feature being explicit cross-session memory.
related-packages:
  - id: brew:opencode
    reason: >
      Choose OpenCode for the upstream general-purpose terminal coding agent; choose
      MiMo Code when Xiaomi's persistent memory, checkpoints, task tracking, and
      long-horizon orchestration are the priority.
    rel: alternative
    sources:
      - https://mimo.xiaomi.com/blog/mimo-code-long-horizon
      - https://opencode.ai/docs/
tags:
  - ai
  - cli
  - coding-agent
  - developer-tools
  - memory
  - terminal
provenance:
  category-sources:
    - Official README calls MiMoCode a terminal-native AI coding assistant.
    - 'source_facts.description: AI coding agent with cross-session memory.'
  display-name-sources:
    - Official GitHub README heading uses MiMoCode.
  docs-sources:
    - >
      Official GitHub README describes MiMoCode, quick start, configuration, and project
      memory.
    - Official MiMo website is linked from the README.
  history-sources:
    - https://github.com/XiaomiMiMo/MiMo-Code
    - https://mimo.mi.com/docs/en-US/news/latest/mimocode
    - https://mimo.xiaomi.com/blog/mimo-code-long-horizon
  repo-sources:
    - source_facts.homepage points to the official GitHub repository.
  tags-sources:
    - >
      Official README describes CLI/terminal AI coding assistant, persistent memory, and
      model/provider configuration.
    - source_facts.executables lists mimo.
category-confidence: high
category-path:
  - ai
  - coding-agents
display-name-confidence: high
docs-confidence: high
history-confidence: medium
repo-confidence: high
tags-confidence: high
