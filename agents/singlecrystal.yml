history:
  adoption-history:
    - >
      SingleCrystal grew from a Mac-only crystallography application into native Mac and
      Windows editions. CrystalMaker Software's history records continuing releases
      across both platforms, including Apple Silicon support and long-running
      integration with CrystalMaker.
    - >
      The application is aimed at teaching and research workflows from classrooms to
      laboratories and synchrotrons. Its licensing includes a demonstration mode, while
      full documentation, tutorials, example data, and a curated crystal-structure
      library are bundled with the application.
  package-nerd-significance:
    - >
      SingleCrystal is a specialized example of scientific desktop software packaged for
      native operating-system integration rather than delivered as a generic
      cross-platform wrapper. It matters to package users working in crystallography
      because it combines simulation, experimental-image analysis, indexing,
      visualization, and export in one application while interoperating with common
      crystallographic data formats and CrystalMaker's companion tools.
  project-history:
    - >
      CrystalMaker Software released SingleCrystal 1.0 for Mac in January 2005 with
      reciprocal-lattice visualization, transmission-electron diffraction, and
      stereographic projections. Subsequent releases added observed-versus-simulated
      data, X-ray diffraction, Laue simulation, live integration with CrystalMaker, and
      a native Windows edition.
    - >
      SingleCrystal 1.3 received an Apple Design Award in 2007. Version 2.0 followed in
      2010, version 5 arrived in January 2024 with a redesigned interface,
      three-dimensional diffraction, Brillouin zones, and crystal-shape tools, and later
      5.x releases expanded image processing and platform support.
  related-projects:
    - >
      CrystalMaker visualizes crystal and molecular structures and can exchange
      structural data with SingleCrystal through Live Intensity mode.
    - >
      CrystalDiffract is CrystalMaker Software's companion application for conventional
      X-ray and neutron powder-diffraction profiles.
  sources:
    - https://crystalmaker.com/about/history/
    - https://crystalmaker.com/singlecrystal/
    - https://crystalmaker.com/singlecrystal/release-notes/mac/5/index.html
    - https://crystalmaker.com/singlecrystal/release-notes/win/5/index.html
    - https://crystalmaker.com/singlecrystal/specs/index.html
  summary:
    - >
      SingleCrystal is CrystalMaker Software's native macOS and Windows application for
      simulating, visualizing, measuring, and indexing crystal diffraction patterns and
      morphological properties.
  timeline:
    - >
      2005: SingleCrystal 1.0 launched for Mac with reciprocal lattices, TEM
      diffraction, and stereographic projections.
    - '2007: SingleCrystal 1.3 received an Apple Design Award.'
    - '2008: Live Rotation integration with CrystalMaker appeared in SingleCrystal 1.4 for Mac.'
    - '2010: SingleCrystal 2.0 added X-ray diffraction and Laue simulation.'
    - >
      2024: SingleCrystal 5 introduced three-dimensional diffraction, Brillouin zones,
      crystal shapes, and a redesigned interface.
    - '2025: SingleCrystal 5.2 expanded peak detection and auto-grid workflows.'
    - >
      2026: The 5.3 and 5.4 series continued platform, interface, indexing, and
      image-processing improvements.
  usage:
    - >
      Researchers and students create simulations from built-in structures or import
      CIF, CMTX, and CrystalMaker documents. They can simulate X-ray, neutron, or
      electron diffraction, overlay simulations on observed images, auto-index patterns,
      inspect reciprocal lattices and Brillouin zones, construct stereographic
      projections and crystal shapes, and export numerical or graphical results.
