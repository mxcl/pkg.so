history:
  adoption-history:
    - >
      Fing says its network-scanning platform has served tens of millions of users,
      while the original mobile app accumulated more than 100 million downloads. Fing
      Desktop extended that established consumer network-discovery ecosystem to Windows
      and macOS.
  package-nerd-significance:
    - >
      Fing Desktop packages a polished graphical alternative to command-line discovery
      tools, combining device identification with ping, traceroute, DNS checks, speed
      testing, alerts, and continuous monitoring. Package users should distinguish this
      desktop cask from Fing Mobile, Fing Agent, Fingbox, and the historical Fing CLI.
  project-history:
    - >
      Fing was founded in 2009 by networking and IoT specialists Carlo Medas and Marco
      De Angelis. The product began as a free mobile network scanner before expanding
      into hardware, desktop, web, subscription, and professional offerings.
    - >
      Fing introduced Desktop in 2020 as a PC evolution of the mobile app with enhanced
      discovery accuracy and monitoring. Fing became part of Lansweeper later that year,
      joining its consumer device-recognition technology with Lansweeper's IT
      asset-management expertise.
  related-projects:
    - >
      Fing Mobile is the original mobile scanner and can display networks monitored by
      Desktop.
    - >
      Fing Agent provides always-on monitoring on Linux, Raspberry Pi, and Docker, where
      Fing Desktop is unavailable.
    - >
      Fingbox was Fing's connected-home monitoring appliance; Fing Web provides browser
      access to synchronized network information.
  sources:
    - >
      Official Desktop FAQ:
      https://help.fing.com/hc/en-us/articles/10194342857628-Fing-Desktop-FAQs
