      https://www.fing.com/news/fing-becomes-part-of-a-bigger-family/
    - 'Official company history: https://www.fing.com/about-us/'
    - >
      Official scan guide:
      https://help.fing.com/hc/en-us/articles/25602650223260-Scan-your-Network
  summary:
    - >
      Fing Desktop is the Windows and macOS member of Fing's network-discovery and
      monitoring family. It scans local networks, identifies connected devices, exposes
      troubleshooting and security tools, and can synchronize network data through a
      Fing account.
  timeline:
    - '2009: Fing was founded and began with a free mobile network scanner.'
    - '2016: Fing expanded into connected-home monitoring with Fingbox.'
    - '2020-02-24: Fing Desktop 1.0.0 officially launched.'
    - '2020-10-14: Fing announced that it had joined Lansweeper.'
  usage:
    - >
      Users typically launch Fing Desktop on a computer attached to the target network,
      scan or refresh the network, and inspect recognized devices and network details.
      An activated Desktop agent can perform continuous monitoring; free accounts can
      perform limited manual scans.
    - >
      A Fing account is used to link and synchronize Desktop data with Fing Mobile and
      Fing Web. Subscription level governs features such as continuous monitoring,
      intruder alerts, security checks, and the number of monitored networks.
