history:
  adoption-history:
    - >
      FontGoggles became a specialist tool for type designers and font engineers who
      need to inspect binary fonts alongside development formats such as UFO and
      Designspace files. Its support for variable fonts, OpenType shaping, color-font
      technology, and live reload aligns it closely with modern font-development
      workflows.
    - >
      The project has continued to follow changes in HarfBuzz, Unicode, OpenType, and
      emerging color- and variable-font formats, making it useful for testing new font
      technology before it is universally supported by general-purpose applications.
  package-nerd-significance:
    - >
      FontGoggles exposes the normally hidden interaction among font source formats,
      compilation, Unicode data, OpenType layout, HarfBuzz shaping, variable axes, and
      color glyph rendering. That makes it particularly interesting to font-toolchain
      maintainers and typography specialists.
  project-history:
    - >
      FontGoggles is an open-source macOS font viewer created by Just van Rossum. It is
      designed for interactive inspection and comparison rather than merely installing
      fonts or displaying static specimen sheets.
    - >
      Version 1.0 was released in February 2020. Subsequent releases expanded
      variable-font and color-font support, adopted newer HarfBuzz and Unicode data, and
      kept compatibility with both older macOS releases and Apple Silicon.
  related-projects:
    - HarfBuzz provides the shaping behavior exposed by FontGoggles.
    - fontTools and uharfbuzz are central parts of its font parsing and shaping stack.
    - UFO and Designspace are important source formats in the workflows FontGoggles supports.
  sources:
    - https://fontgoggles.org/
    - https://github.com/justvanrossum/fontgoggles#readme
    - https://github.com/justvanrossum/fontgoggles/blob/master/CHANGELOG.md
  summary:
    - >
      FontGoggles is an interactive macOS font viewer aimed at type-design and
      font-engineering work. It compares fonts, exercises OpenType shaping and variable
      axes, and can reload changing source files during development.
  timeline:
    - '2020: FontGoggles 1.0 was released.'
    - '2021: The project added COLRv1 color-font support.'
    - >
      2022: HarfBuzz took over outline extraction for binary fonts, removing the
      FreeType dependency.
    - >
      2024: FontGoggles became a universal macOS build supporting both Apple Silicon and
      Intel.
    - '2025: The core non-UI library became usable on platforms other than macOS.'
  usage:
    - >
      Users drop font files into a window, enter or load sample text, and compare
      shaping results across fonts. Controls expose direction, script, language,
      OpenType features, variation axes, color glyphs, metrics, and baselines.
    - >
      Font source files can remain open while they are edited elsewhere; FontGoggles
      reloads them, which makes it practical as a live preview tool in a font-production
      loop.
