config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      GraphQXL distributes precompiled Linux and macOS binaries, a Homebrew formula, and
      a Node wrapper installable with npm or Yarn. This allows the same compiler to fit
      both system-package and JavaScript build-tool workflows.
  package-nerd-significance:
    - >
      GraphQXL is notable as a language-neutral schema preprocessor delivered as a small
      native executable rather than a framework plugin. Its release assets cover common
      Linux and macOS architectures, while node-graphqxl bridges the binary into
      npm-based builds.
  project-history:
    - >
      Gabotechs created the public GraphQXL repository in August 2022 to address
      repetitive and hard-to-modularize schema-first GraphQL definitions without tying
      schemas to a backend language.
    - >
      The project established a frequent binary release cadence beginning with v0.14.0
      in September 2022 and reaching v0.40.2 in March 2024. Its official mdBook grew
      into the main guide for installation, compilation, and language features.
  related-projects:
    - GraphQL supplies the base schema language that GraphQXL extends and targets.
    - node-graphqxl integrates the compiler with Node package and build workflows.
  sources:
    - https://gabotechs.github.io/graphqxl/
    - https://gabotechs.github.io/graphqxl/installation.html
    - https://gabotechs.github.io/graphqxl/usage.html
    - https://github.com/gabotechs/graphqxl/releases
    - source_facts.package-manager
  summary:
    - >
      GraphQXL is a language and standalone compiler that extends GraphQL schema syntax
      with inheritance, generics, modifiers, imports, and description templates, then
      emits ordinary `.graphql` files.
  timeline:
    - '2022: The public repository is created in August.'
    - '2022: v0.14.0 begins the recorded GitHub release series in September.'
    - '2024: v0.40.2 is released in March with six binary assets.'
  usage:
    - >
      Users pass a `.graphqxl` schema to `graphqxl`; the compiler writes the
      corresponding `.graphql` schema. The extended syntax is aimed at large
      schema-first services that need reusable types, imports, and language-independent
      code organization.
related-packages:
  - id: brew:graphql-inspector
    reason: >
      GraphQXL compiles schemas to standard `.graphql` files, which GraphQL Inspector
      can consume for schema inspection and change comparison.
    rel: adjacent_workflow
    sources:
      - https://gabotechs.github.io/graphqxl/
      - https://the-guild.dev/graphql/inspector/docs/api/schema
