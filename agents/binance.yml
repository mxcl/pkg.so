history:
  adoption-history:
    - >
      Binance reports that the exchange became the largest digital-asset exchange by
      trading volume within 180 days of its 2017 launch. It subsequently expanded from
      spot trading into a broader cryptocurrency and blockchain-services ecosystem
      accessible through web, mobile, and desktop clients.
  package-nerd-significance:
    - >
      The desktop package is a proprietary client for a service-backed financial
      platform rather than a self-contained or open-source cryptocurrency tool. Package
      users should obtain it through authenticated distribution channels, keep it
      updated, and treat account security and regional availability as operational
      concerns.
  project-history:
    - >
      Changpeng Zhao and the founding team launched Binance in July 2017 as a
      cryptocurrency exchange. Binance states that the initial service concentrated on
      crypto-to-crypto spot trading before growing into a wider blockchain ecosystem.
  related-projects:
    - Binance Exchange is the service accessed by the desktop client.
    - >
      Binance Authenticator and supported passkey or two-factor authentication
      mechanisms can protect Binance accounts.
    - >
      Binance Research and Binance Academy are related information services within the
      Binance ecosystem.
  sources:
    - 'Official Binance company overview: https://www.binance.com/en/about/'
    - >
      Official account-security guide:
      https://www.binance.com/en/support/faq/detail/115002439332
    - >
      Official fifth-anniversary history:
      https://www.binance.com/en/blog/from-our-ceo/2435011738702007817
    - >
      Official launch announcement:
      https://www.binance.com/en/support/announcement/detail/115000599831
  summary:
    - >
      Binance is a cryptocurrency exchange and blockchain-services ecosystem launched in
      2017. Its desktop application provides native access to the account-based exchange
      platform.
  timeline:
    - 'July 14, 2017: Binance Exchange officially launched.'
    - >
      Early 2018: Binance reported reaching the leading position among cryptocurrency
      exchanges by trading volume.
    - >
      2022: Binance marked five years of operation and described its expansion into a
      broad blockchain ecosystem.
  usage:
    - >
      Users install the desktop client to access Binance account functions and
      cryptocurrency trading from a dedicated application. The service uses an account
      login and supports additional protections such as passkeys and two-factor
      authentication; availability and functionality may vary by jurisdiction.
