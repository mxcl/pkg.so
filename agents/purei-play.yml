history:
  adoption-history:
    - >
      Play! expanded beyond desktop systems to Android, iOS, and an experimental browser
      port. The official download surface also points Linux users to Flathub, while
      Homebrew packages the macOS build as the purei-play cask.
    - >
      Its public compatibility tracker records game behavior and provides a structured
      route for community test reports.
  package-nerd-significance:
    - >
      Play! is notable among PlayStation 2 emulators for using a built-in
      high-level-emulation BIOS, avoiding dependency on an externally dumped console
      BIOS. Its portable codebase and browser experiment also make it interesting to
      emulator developers and cross-platform packaging communities.
  project-history:
    - >
      Jean-Philip Desjardins created Play! as a portable PlayStation 2 emulator focused
      on accessibility and consistent behavior across platforms. The project developed
      native builds for Windows, macOS, Unix-like systems, Android, and iOS, later
      adding an experimental web-browser port.
    - >
      The project has progressed through long-running compatibility work, adding support
      for more games and selected Namco System 246/256 arcade software while maintaining
      a public compatibility tracker.
  related-projects:
    - Play!.js
    - PsfPlayer
  sources:
    - 'Official About page: https://www.purei.org/about.php'
    - 'Official downloads: https://www.purei.org/downloads.php'
    - 'Official homepage and development log: https://www.purei.org/'
    - 'Official repository: https://github.com/jpd002/Play-'
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Play! is an open-source, portable PlayStation 2 emulator distinguished by its
      built-in high-level-emulation BIOS and broad platform support.
  timeline:
    - '2012: Archived official downloads document early public Play! builds.'
    - >
      2022: The official compatibility tracker passed reported milestones of hundreds of
      playable games.
    - '2023: Desktop builds gained preliminary Namco System 246/256 arcade support.'
  usage:
    - >
      Users load their own compatible disc images or ELF programs through the graphical
      interface or command-line options. No external PlayStation 2 BIOS can or needs to
      be configured; users consult the official compatibility tracker when evaluating
      individual games.
