credentials-file-location:
  unix:
    - ~/.aliyun/config.json
history:
  adoption-history:
    - >
      The README explicitly supports trying the CLI in Alibaba Cloud Shell before local
      installation, which gives it both a hosted-cloud and local-terminal path. It
      documents Homebrew installation, direct downloads for macOS, Linux, and Windows,
      and links to GitHub releases.
    - >
      The input package-manager facts show broad downstream packaging: Homebrew, Nix,
      pacman, Scoop, winget, and zypper.
  package-nerd-significance:
    - >
      aliyun-cli is the canonical terminal entry point for Alibaba Cloud automation. For
      package maintainers, it is a multi-platform cloud CLI with real credential
      storage, release assets, shell completion, and frequent cloud-service surface
      changes.
  project-history:
    - >
      The public repository begins in git history on 2015-06-30. The current README
      describes the CLI as a Go tool built on top of Alibaba Cloud OpenAPI and
      distributed through GitHub releases, platform installers, a one-line installer,
      and package managers.
    - >
      The changelog records a v0.1 entry dated 2018-01-11 with a Go refactoring, basic
      configuration, and automatic endpoint location. Later pre-v3 entries added richer
      configuration commands, authentication modes, completion, paging, ossutil
      integration, and v3.0.0 GA refactoring.
  related-projects:
    - 'Alibaba Cloud OpenAPI: service interface layer used by the CLI.'
    - 'ossutil: object-storage toolset integrated according to the changelog.'
  sources:
    - Git history from https://github.com/aliyun/aliyun-cli.git
    - 'Official README: https://raw.githubusercontent.com/aliyun/aliyun-cli/master/README.md'
    - >
      Official changelog:
      https://raw.githubusercontent.com/aliyun/aliyun-cli/master/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      Alibaba Cloud CLI is Alibaba Cloud's open-source command-line interface for
      managing Alibaba Cloud resources through OpenAPI.
  timeline:
    - '2015: Public Git history begins.'
    - '2018: Changelog records v0.1 with Go refactoring and basic configuration.'
    - '2018: v3.0.1 tag exists in repository history.'
    - '2026: v3.4.2 tag appears in repository history.'
  usage:
    - >
      Users normally start with aliyun configure, which writes profile data including
      credentials, region, output format, and language. The README documents
      authentication modes including AK, RAM role ARN, ECS RAM role, OIDC, external
      credential process, CredentialsURI, chainable RAM role ARN, and CloudSSO.
    - >
      Once configured, the aliyun executable invokes Alibaba Cloud OpenAPI actions and
      product commands from the terminal, with troubleshooting support tied to RequestID
      or error messages.
