id: brew:chibi-scheme
display-name: Chibi-Scheme
repo: null
docs:
  - https://github.com/ashinn/chibi-scheme#readme
  - https://synthcode.com/scheme/chibi
config-file-location:
  unix:
    - ~/.snow/config.scm
credentials-file-location:
  unix:
    - ~/.snow/priv-key.scm
history:
  adoption-history:
    - >
      Chibi-Scheme's adoption is narrower than Chez Scheme or CHICKEN, but it appears in
      several Unix-style package sets because small embeddable interpreters are useful
      dependencies and testbeds.
    - >
      The input package metadata lists Alpine, Homebrew, Fedora, and Ubuntu packages.
      Homebrew reported 39,642 trailing-365-day installs at research time, a strong
      signal for a small language-runtime formula.
  package-nerd-significance:
    - >
      Chibi-Scheme is package-nerd-significant because it represents the opposite end of
      the Scheme packaging spectrum from big optimizing compilers: tiny, embeddable, no
      external dependencies, and suitable for C projects.
    - >
      It is also a useful R7RS-small package for testing scripts, build integrations,
      and extension-language experiments without installing a large runtime.
  project-history:
    - >
      The official README describes Chibi-Scheme as a very small library for use as an
      extension and scripting language in C programs. It highlights isolated heaps for
      multiple VMs, lightweight VM-based threads, no external dependencies, Unicode
      support, hygienic macros, and an extensible module system.
    - >
      The project also ships command-line tools such as `chibi-scheme`, `chibi-doc`,
      `chibi-ffi`, and Snow-related commands, so the package is both an embeddable
      library and a usable Scheme command-line environment.
  related-projects:
    - The README connects Chibi-Scheme to R7RS small and the `(scheme small)` library.
    - >
      The installed Snow-related executables put it near the Scheme package/library
      tooling ecosystem as well as embedded C extension languages.
  sources:
    - https://github.com/ashinn/chibi-scheme#readme
    - https://synthcode.com/scheme/chibi/
    - https://github.com/ashinn/chibi-scheme/releases/tag/0.12
    - https://formulae.brew.sh/api/formula/chibi-scheme.json
  summary:
    - >
      Chibi-Scheme is a small Scheme implementation intended for embedding as a C
      extension and scripting language, while still providing a substantial
      R7RS-small-oriented default environment.
  timeline:
    - '2024: Chibi-Scheme 0.11 released.'
    - '2026: Chibi-Scheme 0.12 released and tracked by Homebrew.'
  usage:
    - >
      The official README documents the normal source workflow as `make && make test`,
      producing a shared library and a sample `chibi-scheme` command-line REPL.
    - >
      Package users mainly care that the formula installs a tiny Scheme runtime, FFI
      tooling, and documentation helpers without a heavyweight dependency chain.
related-packages:
  - id: brew:chicken
    reason: >
      Choose CHICKEN for portable Scheme-to-C compilation and its Eggs ecosystem; choose
      Chibi-Scheme when a smaller dependency-free embeddable R7RS runtime is the
      priority.
    rel: alternative
    sources:
      - https://www.call-cc.org/
      - https://synthcode.com/scheme/chibi/
  - id: brew:chezscheme
    reason: >
      Choose Chez Scheme when optimizing native-code compilation and whole-program
      optimization matter more than Chibi-Scheme's compact embeddable design.
    rel: alternative
    sources:
      - https://cisco.github.io/ChezScheme/
      - https://synthcode.com/scheme/chibi/
