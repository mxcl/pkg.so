history:
  adoption-history:
    - >
      Curio has remained a macOS-focused independent application under continuous
      development since its 2004 debut. Its users include designers, writers, students,
      educators, scientists, project managers, lawyers, and entrepreneurs.
    - >
      Distribution grew to include both traditional website licenses and Mac App Store
      subscriptions. Curio projects remain local files, allowing users to retain direct
      control of their notebooks rather than requiring a hosted account.
  package-nerd-significance:
    - >
      Curio is a long-running indie Mac application that combines several productivity
      categories without forcing information into a single rigid document type. A
      Homebrew cask makes this otherwise graphical, traditionally licensed application
      manageable alongside developer tooling.
    - >
      Its local single-file project model is attractive to users who value inspectable
      backups, ordinary file synchronization, and independence from mandatory cloud
      accounts.
  project-history:
    - >
      Developer George Browning began work on Curio in 2002 and shipped Curio 1.0 in
      2004 through Zengobi. It has remained in continuous development as a freeform
      notebook for collecting research, notes, documents, visual ideas, and tasks.
    - >
      Over time Curio incorporated outlining, mind mapping, metadata, search,
      presentation, task management, document embedding, automation, and extensive
      import/export capabilities. Curio 11 moved the primary documentation into an
      interactive bundled Welcome project; newer releases also publish web
      documentation.
    - >
      Curio 34, released in 2026, added Kanban boards, table formulas, expanded
      automation, and a separate CLI for supported professional users.
  related-projects:
    - >
      Curiota is Zengobi's lightweight companion application for rapidly collecting
      notes and files for later use in Curio.
    - >
      Curio CLI is a separately downloaded automation interface for querying and
      updating Curio projects.
  sources:
    - >
      Official Curio 11 release notes:
      https://www.zengobi.com/curio/releasenotes/Curio110000.html
    - 'Official Curio 34 release notes: https://www.zengobi.com/curio/releasenotes/'
    - 'Official Curio press kit: https://www.zengobi.com/curio/press/34/press_kit.html'
    - 'Official documentation: https://www.zengobi.com/curio/docs/34/'
  summary:
    - >
      Curio is a freeform macOS notebook that combines notes, research, documents,
      brainstorming canvases, outlining, mind mapping, and task tracking in local
      project files.
  timeline:
    - '2002: George Browning began developing Curio.'
    - '2004: Curio 1.0 shipped.'
    - >
      2016: Curio 11 introduced an interactive Welcome project containing its guided
      tour and documentation.
    - '2021: Curio 17 added Quick Find across idea spaces, figures, metadata, and resources.'
    - '2024: Curio 28 added wikilinks and a unified jump interface.'
    - >
      2026: Curio 34 added Kanban boards, table formulas, enhanced automation, and Curio
      CLI integration.
  usage:
    - >
      Users create local Curio project files and organize material on freeform idea
      spaces alongside outlines, mind maps, lists, tables, files, media, and tasks.
    - >
      The app suits research collection, class notes, project planning, creative
      brainstorming, case preparation, and presentations. Projects do not require an
      account and are not uploaded by Curio itself.
    - >
      New users are introduced through the bundled Welcome to Curio project, while the
      official web documentation provides searchable feature guidance.
