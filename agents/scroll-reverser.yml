id: cask:scroll-reverser
display-name: Scroll Reverser
repo: https://github.com/pilotmoon/Scroll-Reverser
docs:
  - https://pilotmoon.com/scrollreverser
config-file-location:
  macos:
    - ~/Library/Preferences/com.pilotmoon.scroll-reverser.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      The developer reports that Scroll Reverser attracted tens of thousands of
      downloads during its first week and was widely linked by Mac websites and forums.
      Users subsequently requested independent mouse and trackpad controls, older-Mac
      support, and translations.
  package-nerd-significance:
    - >
      Scroll Reverser is representative of the focused native utilities commonly
      installed through Homebrew Cask: it changes one macOS behavior, integrates with
      system input permissions, and stores conventional macOS preferences.
    - >
      Its long support span—from PowerPC-era Mac OS X through Apple silicon—also makes
      it a compact example of the maintenance burden carried by enduring desktop
      utilities.
  project-history:
    - >
      Nick Moore created Scroll Reverser in 2011 after encountering Apple's then-new
      natural scrolling in an OS X Lion developer preview. Apple rejected the initial
      Mac App Store submission, so Moore published the application and its source code
      independently.
    - >
      The utility evolved from reversing scrolling globally into providing separate
      mouse, trackpad, axis, and wheel-step controls. Community contributions added
      numerous localizations, while later releases adapted it to macOS privacy
      permissions, dark mode, and Apple silicon.
  related-projects:
    - >
      The official site identifies DiscreteScroll, LinearMouse, Mac Mouse Fix, MOS, and
      UnnaturalScrollWheels as alternatives with overlapping functionality.
  sources:
    - >
      Developer's project retrospective:
      https://pilotmoon.com/blog/2020/12/09/scroll-reverser-1-8
    - 'Official product page and release history: https://pilotmoon.com/scrollreverser'
    - 'Official repository: https://github.com/pilotmoon/Scroll-Reverser'
  summary:
    - >
      Scroll Reverser is an open-source macOS utility for controlling scroll direction
      independently for mice and trackpads.
  timeline:
    - '2011: Scroll Reverser 1.0 was released after its Mac App Store submission was rejected.'
    - '2011: Independent controls for axes and input-device types were introduced.'
    - >
      2020: Version 1.8 added Big Sur, Apple silicon, dark-mode, and privacy-permission
      support.
    - '2024: Version 1.9 updated login behavior and support for recent macOS releases.'
  usage:
    - >
      A common setup keeps macOS natural scrolling enabled for the trackpad while Scroll
      Reverser restores classic wheel direction for a mouse. Users can independently
      select devices and axes and optionally adjust discrete wheel-step size.
    - >
      The app requires macOS Accessibility permission and, on relevant releases, Input
      Monitoring permission. Its official troubleshooting guide also covers
      remote-desktop behavior and complete removal.
