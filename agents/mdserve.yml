id: brew:mdserve
display-name: mdserve
repo: null
docs:
  - https://github.com/jfernandez/mdserve/tree/main/docs
  - https://github.com/jfernandez/mdserve#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Official installation paths include Homebrew for macOS, an install script for
      Linux, Cargo, Arch Linux, Nix, source builds, and GitHub release binaries. The
      input package-manager facts list Homebrew, Nix, and pacman packages.
    - >
      GitHub metadata showed hundreds of stars within its first year, consistent with a
      tool aimed at the newly visible AI-agent workflow around generated Markdown.
  package-nerd-significance:
    - >
      mdserve is package-nerd relevant because it packages a modern local preview stack
      into one installable CLI, explicitly avoiding the heavier
      documentation-site-generator category. It reflects the 2025-era shift where
      generated Markdown, Mermaid diagrams, and agent-written docs became routine
      terminal artifacts.
  project-history:
    - >
      The GitHub repository was created on 2025-09-22. The README positions mdserve
      narrowly: it is a local preview companion for AI coding agents, not a
      documentation site generator, static site server, or general-purpose authoring
      system.
    - >
      The project includes a Claude Code plugin so an agent can decide when rendered
      Markdown is useful and start a preview for longer documents, tables, diagrams, or
      other content that is hard to inspect raw in a terminal.
  related-projects:
    - >
      The README names mdBook, Docusaurus, and MkDocs as tools outside mdserve's
      intended scope.
    - >
      The acknowledgments cite Axum, markdown-rs, and Catppuccin as implementation or
      theme influences.
  sources:
    - https://api.github.com/repos/jfernandez/mdserve
    - https://github.com/jfernandez/mdserve#readme
    - https://github.com/jfernandez/mdserve/tree/main/docs
    - source_facts.package-manager
  summary:
    - >
      mdserve is a Rust Markdown preview server built for live-rendering Markdown during
      AI-assisted coding sessions. Its README emphasizes zero configuration, a single
      binary, live reload, ephemeral sessions, GFM, Mermaid, directory mode, and
      built-in themes.
  timeline:
    - '2025: Public GitHub repository created.'
    - >
      2025: README documented Homebrew, Cargo, Arch, Nix, source, and release-binary
      installation paths.
    - '2026: Repository metadata showed continuing activity and hundreds of stars.'
  usage:
    - >
      The basic workflow is `mdserve README.md` for a single file or `mdserve docs/` for
      a directory. Optional flags set hostname, port, and whether to open a browser
      automatically.
    - >
      The README documents single-file mode for focused previewing and directory mode
      for serving `.md` and `.markdown` files with sidebar navigation and file watching.
related-packages:
  - id: brew:grip
    reason: >
      Choose Grip when the goal is to preview a README with GitHub-compatible rendering
      before committing; mdserve instead emphasizes Mermaid, agent workflows, directory
      mode, and live reload but is now unmaintained.
    rel: alternative
    sources:
      - https://github.com/jfernandez/mdserve#readme
      - https://github.com/joeyespo/grip#readme
  - id: brew:glow
    reason: >
      Choose Glow to read rendered Markdown inside the terminal rather than running
      mdserve's browser-based local server.
    rel: alternative
    sources:
      - https://github.com/jfernandez/mdserve#readme
      - https://github.com/charmbracelet/glow#readme
  - id: brew:mdbook
    reason: >
      Use mdBook when Markdown must become a navigable, buildable documentation site, a
      workflow the mdserve README explicitly places outside mdserve's scope.
    rel: adjacent_workflow
    sources:
      - https://github.com/jfernandez/mdserve#readme
      - https://rust-lang.github.io/mdBook/
