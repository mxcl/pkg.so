id: cask:rsyncui
display-name: RsyncUI
repo: null
docs:
  - https://rsyncui.netlify.app/docs
  - https://rsyncui.netlify.app/blog
config-file-location:
  macos:
    - ~/.rsyncosx/<macserialnumber>/configurations.json
    - ~/.rsyncosx/<macserialnumber>/<profile>/configurations.json
    - ~/.rsyncosx/<macserialnumber>/rsyncuiconfig.json
credentials-file-location:
  macos:
    - ~/.ssh/id_rsa
    - ~/.ssh_rsyncosx/rsyncosx
history:
  adoption-history:
    - >
      RsyncUI is distributed directly through signed and notarized releases and through
      a Homebrew cask. Its official repository documents the Homebrew installation
      command and has attracted an established macOS user and contributor community.
    - >
      The project remains a solo-maintained, free and open-source utility, with
      documentation emphasizing local storage and no server-side component.
  package-nerd-significance:
    - >
      RsyncUI gives macOS users a native SwiftUI front end for one of Unix culture's
      most durable synchronization tools. It exposes task organization, rsync
      parameters, dry-run verification, logging, scheduling, snapshots, and SSH
      workflows without requiring users to assemble every command manually.
    - >
      Its continued use of the historical `.rsyncosx` data directory preserves lineage
      with its predecessor, making the on-disk naming itself a small artifact of package
      history.
  project-history:
    - >
      Developer Thomas Evensen began the predecessor RsyncOSX in August 2016 as a Swift
      learning project. Work on the SwiftUI-based RsyncUI began in late 2020.
    - >
      After eight years of RsyncOSX releases, that predecessor was archived in August
      2024. RsyncUI continued as the actively developed macOS interface, retaining the
      historical `.rsyncosx` configuration directory.
  related-projects:
    - >
      RsyncUI wraps the rsync command-line utility and supports local and SSH-based
      synchronization.
    - >
      Its direct predecessor is the archived RsyncOSX application. The developer also
      maintains supporting Swift packages for argument generation, process execution,
      SSH-key creation, output parsing, and deep links.
  sources:
    - https://github.com/rsyncOSX/RsyncUI
    - https://rsyncui.netlify.app/about/
    - https://rsyncui.netlify.app/docs/
    - https://rsyncui.netlify.app/docs/reference/config-files/
    - https://rsyncui.netlify.app/docs/ssh-setup/ssh-keys/
  summary:
    - >
      RsyncUI is a free, open-source SwiftUI application for configuring and running
      rsync synchronization, backup, snapshot, restore, scheduling, and remote-SSH tasks
      on macOS.
  timeline:
    - '2016: Development of the predecessor RsyncOSX began.'
    - '2020: Development of the SwiftUI-based RsyncUI began.'
    - '2024: RsyncOSX was archived after eight years of releases; RsyncUI remained active.'
    - >
      2026: The project continued shipping documented, signed macOS releases and
      Homebrew installation support.
  usage:
    - >
      Users define source and destination folders, choose local or remote
      synchronization, configure rsync parameters, verify tasks with dry runs, and then
      execute and inspect synchronization results.
    - >
      Remote jobs use passwordless SSH keys. The documented default identity is
      `~/.ssh/id_rsa`; custom identities and ports can be set globally or per task.
tags:
  - backup
  - file-synchronization
  - macos
  - rsync
  - ssh
  - swiftui
provenance:
  category-sources:
    - >
      https://rsyncui.netlify.app/docs/ describes a macOS synchronization application
      built over the rsync command-line tool.
    - source_facts.description identifies RsyncUI as a GUI for rsync.
  display-name-sources:
    - >
      https://github.com/rsyncOSX/RsyncUI and the official documentation use RsyncUI as
      the project name.
    - source_facts.applications lists RsyncUI.app.
  docs-sources:
    - https://rsyncui.netlify.app/blog/ contains official release notes and technical updates.
    - >
      https://rsyncui.netlify.app/docs/ is linked as User documentation by the official
      repository.
  history-sources:
    - https://github.com/rsyncOSX/RsyncUI
    - https://rsyncui.netlify.app/about/
    - https://rsyncui.netlify.app/docs/
    - https://rsyncui.netlify.app/docs/reference/config-files/
    - https://rsyncui.netlify.app/docs/ssh-setup/ssh-keys/
  repo-sources:
    - >
      source_facts.repo is already populated with https://github.com/rsyncOSX/RsyncUI,
      so the repository was intentionally not re-determined.
  tags-sources:
    - >
      https://github.com/rsyncOSX/RsyncUI supplies the official project description and
      topics.
    - https://rsyncui.netlify.app/docs/ describes the macOS SwiftUI front end for rsync.
    - https://rsyncui.netlify.app/docs/ssh-setup/ documents SSH-based remote synchronization.
category-confidence: high
category-path:
  - system
  - backup-and-sync
display-name-confidence: high
docs-confidence: high
history-confidence: high
repo-confidence: high
