id: brew:ld-find-code-refs
display-name: ld-find-code-refs
repo: null
docs:
  - https://launchdarkly.com/docs/home/flags/code-references
  - https://github.com/launchdarkly/ld-find-code-refs#readme
config-file-location:
  unix:
    - ${dir}/.launchdarkly/coderefs.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption is mostly inside LaunchDarkly-using teams rather than the general CLI
      ecosystem. The tool appears in Homebrew as ld-find-code-refs, making it easy to
      install in macOS and CI environments that already use Brew.
  package-nerd-significance:
    - >
      For package cataloging, ld-find-code-refs is a good example of a vendor-specific
      DevOps CLI whose usefulness comes from being scriptable in CI and packaged outside
      the vendor SaaS UI.
  project-history:
    - >
      The project was published by LaunchDarkly as an Apache-2.0 Go command-line program
      in the launchdarkly GitHub organization. Its role is tied to LaunchDarkly's code
      references feature, which connects feature flag definitions in LaunchDarkly to the
      application code that references them.
    - >
      The public tag history includes a 0.1.0 tag on a January 2019 commit and later 0.x
      releases through the 2019-era repository history visible from GitHub tags.
  related-projects:
    - >
      Related LaunchDarkly tooling includes ldcli for managing LaunchDarkly resources
      from the command line and the LaunchDarkly code references documentation.
  sources:
    - https://formulae.brew.sh/formula/ld-find-code-refs
    - https://github.com/launchdarkly/ld-find-code-refs
    - https://github.com/launchdarkly/ld-find-code-refs/releases/tag/0.1.0
    - https://launchdarkly.com/docs/home/flags/code-references
  summary:
    - >
      ld-find-code-refs is LaunchDarkly's build-time command-line tool for scanning
      source repositories and sending feature-flag code reference metadata to
      LaunchDarkly.
  timeline:
    - '2019: Public 0.1.0 tag appears in the LaunchDarkly GitHub repository.'
    - '2019: 0.5.0 tag appears after the initial 0.x release series.'
    - >
      2020s: The tool is distributed through Homebrew for LaunchDarkly code reference
      workflows.
  usage:
    - >
      The package is used in CI or build workflows to scan checked-out code, read
      coderefs configuration such as .launchdarkly/coderefs.yaml, and publish references
      so engineers can navigate from a flag to the code paths that use it.
related-packages:
  - id: brew:ldcli
    reason: >
      Use LaunchDarkly CLI to administer feature flags and other LaunchDarkly resources,
      while ld-find-code-refs supplies the complementary CI scan that connects those
      flags to their source-code references.
    rel: adjacent_workflow
    sources:
      - https://launchdarkly.com/docs/home/getting-started/ldcli
      - https://launchdarkly.com/docs/home/flags/code-references
