history:
  adoption-history:
    - >
      Hy is distributed through Python packaging and also appears in system package
      managers such as Homebrew, Debian, Ubuntu, Arch, Alpine, and Nix. Its community
      surfaces include GitHub Discussions, Stack Overflow's `hy` tag, documentation on
      hylang.org, and a browser console for trying the language.
  package-nerd-significance:
    - >
      Hy is interesting to package nerds because it is not a separate virtual machine or
      runtime island. It packages as a Python-hosted language that can import Python
      modules directly, which makes it easier to install experimentally while still
      offering Lisp macros and syntax.
  project-history:
    - >
      The public repository was created in December 2012. Hy's README frames the project
      with the line that Lisp and Python should love each other, and explains the core
      technical idea: Hy code becomes Python AST, so Python's ecosystem remains
      available.
    - >
      The 1.0.0 announcement in September 2024 described that release as arriving after
      nearly 12 years of on-and-off development and real-world use. The NEWS file states
      that Hy follows semantic versioning since 1.0.0, marking a stabilization point
      after the long 0.x period.
  related-projects:
    - >
      Hy is related to Python, Lisp-family languages, macro systems, Python AST tooling,
      PyPI packaging, and editor/REPL workflows for experimental languages.
  sources:
    - >
      Hy homepage, README, NEWS, 1.0.0 announcement, repository metadata, and Homebrew
      package metadata were used.
  summary:
    - >
      Hy is a Lisp dialect embedded in Python. It reads Lisp syntax and transforms it
      into Python abstract syntax tree objects, giving users macros and Lisp syntax
      while keeping access to Python built-ins, libraries, packaging, and runtime
      behavior.
  timeline:
    - '2012: Public GitHub repository created.'
    - '2024: 1.0.0 released after nearly 12 years of development.'
    - '2024: NEWS states semantic versioning begins with 1.0.0.'
    - '2026: 1.3.0 release notes list support for Python 3.9 through Python 3.15.'
  usage:
    - >
      Users run `hy` for a REPL, execute `.hy` programs with `hy myprogram.hy`,
      translate with `hy2py`, and compile with `hyc`. The homepage examples show
      Python-equivalent forms for assignment, sorting, functions, context managers,
      comprehensions, and macros.
