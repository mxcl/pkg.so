id: brew:jena
display-name: Apache Jena
repo: https://github.com/apache/jena
docs:
  - https://jena.apache.org/documentation
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Jena's adoption follows the standards history of RDF, OWL, and SPARQL. The
      official overview positions it as a framework aligned with W3C recommendations and
      as a toolkit with storage strategies, inference, and APIs, making it useful both
      inside Java applications and as a command-line RDF workbench.
  package-nerd-significance:
    - >
      Jena is interesting in package catalogs because one upstream project exposes both
      a mature Java library stack and a dense CLI surface. A single install gives shell
      users access to RDF parsers, SPARQL engines, SHACL and ShEx validators, and TDB
      tooling, so it behaves like a Semantic Web toolbox rather than a single binary.
  project-history:
    - >
      Jena began at HP Labs in Bristol, UK, in 2000. The project says it has always been
      open source and was used across Semantic Web applications and demonstrators before
      moving under Apache governance.
    - >
      After HP refocused direct development support in 2009, the project team applied
      for adoption by the Apache Software Foundation in November 2010. Jena entered
      Apache incubation that month and graduated as an Apache top-level project in April
      2012.
  related-projects:
    - >
      ARQ is Jena's SPARQL query engine and appears in the package as the arq and sparql
      commands.
    - Apache Fuseki is the Jena SPARQL server component documented by the project.
    - >
      TDB and TDB2 are Jena storage layers exposed through loader, query, update,
      backup, compact, dump, and stats commands.
  sources:
    - https://github.com/apache/jena
    - https://jena.apache.org/about_jena/about.html
    - https://jena.apache.org/documentation
  summary:
    - >
      Apache Jena is a Java framework and command-line toolkit for RDF, SPARQL, Linked
      Data, and Semantic Web work. In package-manager form it is notable for shipping a
      large family of RDF conversion, query, validation, and TDB tools as regular shell
      commands.
  timeline:
    - '2000: Jena development started at HP Labs in Bristol, UK.'
    - >
      2009: HP refocused direct development activity while remaining supportive of the
      project.
    - '2010: the project entered Apache incubation in November.'
    - '2012: Jena graduated as an Apache top-level project in April.'
    - '2013: the Apache GitHub repository was created.'
  usage:
    - >
      The package installs tools such as arq, riot, sparql, rsparql, rdfcat, rdfdiff,
      shacl, shex, and TDB utilities. That makes the formula useful for converting RDF
      syntaxes, running SPARQL queries, validating graphs, loading local triple stores,
      and scripting Linked Data maintenance without writing a Java wrapper.
related-packages:
  - id: brew:fuseki
    reason: >
      Install Fuseki when Jena datasets need to be served over SPARQL 1.1 query, update,
      and Graph Store protocols rather than accessed only through local APIs and
      commands.
    rel: adjacent_workflow
    sources:
      - https://jena.apache.org/documentation/
      - https://jena.apache.org/documentation/fuseki2/
