credentials-file-location:
  unix:
    - ~/.buttrc
  windows:
    - C:\Users\<username>\AppData\Roaming\buttrc
history:
  adoption-history:
    - >
      The project expanded from an Icecast/Shoutcast source client into a cross-platform
      broadcasting tool with local recording, multiple codecs, command-line and network
      control, MIDI control, and later WebRTC WHIP support.
  package-nerd-significance:
    - >
      BUTT is notable as a compact desktop source client rather than a streaming server.
      It packages the practical broadcaster-side workflow—audio capture, encoding,
      metadata updates, reconnection, recording, and server authentication—into one
      cross-platform application.
  project-history:
    - >
      Daniel Nöthen developed BUTT as a cross-platform live-audio streaming client. The
      official changelog records public releases by 2007, when the application already
      had a configuration GUI and recording support.
  related-projects:
    - >
      Designed for Icecast and Shoutcast servers and WebRTC WHIP endpoints; the manual
      also discusses integration with audio-routing tools such as BlackHole, PulseAudio,
      and Voicemeeter.
  sources:
    - https://danielnoethen.de/butt/
    - https://danielnoethen.de/butt/Changelog.html
    - https://danielnoethen.de/butt/release/1.47.0/butt-1.47.0_manual.html
  summary:
    - >
      BUTT, short for Broadcast Using This Tool, is a cross-platform client for sending
      live microphone or line-input audio to Icecast, Shoutcast, or WebRTC WHIP
      services, with optional simultaneous local recording.
  timeline:
    - '2007: Early public releases added recording and a graphical configuration interface.'
    - '2024: WebRTC WHIP support appeared in the 1.42 series.'
    - '2026: The 1.47 series continued active cross-platform maintenance.'
  usage:
    - >
      Users add a streaming server and its credentials, select audio devices and codecs,
      and start broadcasting from the graphical interface. Advanced workflows include
      automatic reconnect and recording, metadata updates, multiple instances selected
      with `-c`, command-line or network control, and MIDI control.
