history:
  adoption-history:
    - >
      The developer says the app has grown substantially since 2009 and describes it as
      a standard app in leading music schools. Its official site reports a large
      cross-platform user base through more than 82,000 ratings, while its forums supply
      community-created charts and curated playlists.
  package-nerd-significance:
    - >
      For package-manager users, iReal Pro is notable as a long-lived, commercial
      musician's tool distributed across desktop and mobile platforms. The Homebrew cask
      provides a convenient Mac installation path for software otherwise obtained
      through a platform store or direct download.
  project-history:
    - >
      iReal Pro began as a portable chord-chart application and developed into a
      cross-platform virtual backing band. Its official material describes continuous
      development since its early years, expansion from Apple platforms to Android,
      Windows, and Linux, and a community ecosystem centered on shared chord charts.
    - >
      The product evolved beyond chart display to include editable charts,
      transposition, more than 50 accompaniment styles, practice looping, recording,
      audio and notation export, accessibility support, and custom URL schemes for
      third-party integration.
  related-projects:
    - >
      The official Iris-style comparison is not applicable; iReal Pro's own ecosystem
      includes the iReal Pro Forums, its Learn guides, and URL schemes for embedding or
      importing songs and playlists.
  sources:
    - 'Official Learn guides: https://www.irealpro.com/learn/'
    - 'Official developer documentation: https://www.irealpro.com/developer-docs/'
    - 'Official product page: https://www.irealpro.com/'
    - 'Official support policy: https://www.irealpro.com/support-policy/'
    - 'Official version history: https://www.irealpro.com/version-history/'
  summary:
    - >
      iReal Pro is a commercial chord-chart editor and virtual backing band for music
      practice, teaching, rehearsal, and performance. It generates accompaniments from
      chord charts and supports a community-maintained library shared through its
      forums.
  timeline:
    - >
      2009: The official support policy identifies this as the beginning of the app's
      sustained community growth.
    - >
      2010: The official site reports that the app was named among TIME's 50 Best
      Inventions of 2010.
    - >
      2022: The project added 17 Salsa accompaniment styles developed with percussionist
      Samuel Torres.
    - '2024: Official news documented expanded Brazilian styles and major playlist updates.'
    - '2026: Official materials announced live-recorded drums and Windows availability.'
  usage:
    - >
      Musicians use iReal Pro to write, import, organize, transpose, display, and share
      chord charts, then generate adjustable backing tracks for practice or rehearsal.
      Common workflows include looping difficult passages, changing tempo or key, muting
      instruments, exporting MIDI or MusicXML, and importing community charts from the
      official forums.
    - >
      Each supported platform is a separate purchase. The application works offline for
      core practice, while forum downloads, cloud synchronization, and external sharing
      use online services.
