id: brew:nbping
display-name: NBping
repo: null
docs:
  - https://github.com/hanshuaikang/NBping#readme
config-file-location:
  unix:
    - User-specified YAML file passed with `--config` (for example, `nbping.yaml`)
credentials-file-location: null
history:
  adoption-history:
    - >
      GitHub API data retrieved on 2026-07-01 showed 2,208 stars and 90 forks, unusually
      high for a young single-purpose network CLI. The README also displays HelloGitHub
      and Trendshift badges and thanks several Chinese open-source and operations media
      channels for reposting or paying attention to the project.
    - >
      Homebrew Formulae reported stable version 0.7.1 and 596 installs over the prior
      365 days. The package-manager footprint in the input record also includes Nix,
      Scoop, and zypper, which fits a cross-platform CLI distributed mainly as a
      developer/operator convenience tool.
  package-nerd-significance:
    - >
      NBping is part of the Rust terminal-ops wave: small static-feeling CLIs with
      polished TUIs that replace old Unix output streams for humans while keeping enough
      flags and export modes for automation.
  project-history:
    - >
      The repository was created on 2024-12-21. The project was first surfaced under the
      Nping name, but the README includes an explicit renaming notice that the project
      was officially renamed from Nping to NBPing and that the old name is deprecated.
    - >
      The README positions it as a visual ping tool rather than a packet-crafting suite:
      its examples focus on pinging multiple hostnames at intervals, switching terminal
      views, saving results, and exporting metrics for Prometheus and Grafana.
  related-projects:
    - Prometheus
    - Grafana
    - Rust terminal UI tooling
  sources:
    - https://api.github.com/repos/hanshuaikang/NBping
    - https://api.github.com/repos/hanshuaikang/NBping/releases
    - https://formulae.brew.sh/api/formula/nbping.json
    - https://github.com/hanshuaikang/NBping
    - https://raw.githubusercontent.com/hanshuaikang/NBping/main/README.md
  summary:
    - >
      NBping is a Rust ping tool with a terminal UI for concurrent targets, live
      graph/table/point/sparkline views, TCP and IP range ping support, YAML
      configuration, output logging, and a Prometheus exporter mode.
  timeline:
    - '2024-12-21: hanshuaikang/NBping repository created.'
    - '2025-09-10: v0.5.0 release published.'
    - '2026-01-01: v0.6.0 release published.'
    - '2026-06-28: v0.7.1 release published.'
    - '2026-07-01: Homebrew Formulae reported stable version 0.7.1.'
  usage:
    - >
      Operators and CLI nerds use nbping when ordinary ping output is too flat: compare
      several hosts side by side, watch latency update in a terminal graph or table, set
      count and interval flags, choose the initial view, and optionally write results to
      a file.
    - >
      Exporter mode is the more operations-flavored path: run nbping exporter with
      targets, interval, and port, then scrape /metrics with Prometheus and visualize
      the latency data in Grafana.
related-packages:
  - id: brew:gping
    reason: >
      Choose gping for a simpler graphical ping chart that can also graph command
      execution time, while NBping emphasizes concurrent targets, multiple TUI views,
      YAML configuration, and exporter mode.
    rel: alternative
    sources:
      - https://github.com/hanshuaikang/NBping
      - https://github.com/orf/gping
  - id: brew:mtr
    reason: >
      Choose mtr when troubleshooting requires continuous per-hop loss and latency
      statistics along the network path rather than NBping's endpoint-focused live
      views.
    rel: alternative
    sources:
      - https://github.com/hanshuaikang/NBping
      - https://github.com/traviscross/mtr
      - https://www.bitwizard.nl/mtr/
  - id: brew:prometheus
    reason: >
      NBping's exporter mode exposes a /metrics endpoint specifically intended for
      Prometheus scraping.
    rel: adjacent_workflow
    sources:
      - https://github.com/hanshuaikang/NBping
      - https://prometheus.io/docs/introduction/overview/
  - id: brew:grafana
    reason: >
      The NBping README documents Grafana as the visualization layer for latency metrics
      collected through its Prometheus exporter.
    rel: adjacent_workflow
    sources:
      - https://github.com/hanshuaikang/NBping
      - https://grafana.com/docs/grafana/latest/
tags:
  - cli
  - latency
  - networking
  - ping
  - visualization
