history:
  adoption-history:
    - >
      Lingon has been maintained across multiple generations of macOS. The advanced
      product was previously branded Lingon X and is now Lingon Pro, with separate
      releases retained for older macOS versions.
    - >
      Lingon Pro is distributed outside the Mac App Store because its privileged
      launchd-management features exceed the store's restrictions. The current product
      is sold as a one-time purchase and is available as a trial download.
  package-nerd-significance:
    - >
      Lingon Pro gives Mac power users a graphical route into launchd, the service
      manager underlying login items, scheduled jobs, agents, and daemons. It is useful
      when a plist and `launchctl` workflow is too opaque but users still need access to
      advanced launchd keys, root jobs, monitoring, logs, and task revision history.
  project-history:
    - >
      Peter Borg Apps developed Lingon as a user-friendly macOS task-automation
      interface. The product family separates the simpler Lingon application from Lingon
      Pro, the advanced standalone launchd editor formerly called Lingon X.
    - >
      Successive Lingon X releases targeted changing macOS generations. Lingon Pro 10
      refined the interface with multiple windows and tabs, a more secure
      privileged-save workflow, task revisions, monitoring improvements, and modern
      macOS integration.
  related-projects:
    - >
      Apple launchd and its property-list files provide the underlying job-management
      system edited by Lingon Pro.
    - Apple Shortcuts and Siri can invoke tasks managed by current Lingon releases.
    - >
      LaunchControl is another third-party graphical editor and debugger for macOS
      launchd jobs.
  sources:
    - https://www.peterborgapps.com/lingon/
    - https://www.peterborgapps.com/support/
  summary:
    - >
      Lingon Pro is Peter Borg Apps' advanced macOS utility for creating, scheduling,
      editing, running, and monitoring launchd tasks, including privileged system jobs.
  timeline:
    - >
      Lingon X era: The advanced application was maintained in separate releases for
      successive macOS generations.
    - >
      Lingon Pro 10: The product adopted its current Pro branding and a refined
      multiwindow, tabbed interface.
  usage:
    - >
      Users employ Lingon Pro to start applications, commands, scripts, or shortcuts at
      login, startup, scheduled times, intervals, wake events, or other launchd
      conditions. The Pro edition can edit the full range of launchd settings, run jobs
      as root or for multiple users, and monitor task folders in the background.
    - >
      The official support page documents the application's preferences domain and reset
      command, but it does not document a stable user-editable configuration-file
      location. Licenses are reset with preferences, but no separate credentials-file
      location is documented.
related-packages:
  - id: cask:launchcontrol
    reason: >
      Choose LaunchControl when detailed launchd validation, debugging, runtime state,
      and Homebrew-service visibility are priorities; choose Lingon Pro for its
      task-oriented scheduling interface, Shortcuts/Siri integration, and built-in
      monitoring workflow.
    rel: alternative
    sources:
      - https://www.peterborgapps.com/lingon/
      - https://www.soma-zone.com/LaunchControl/
      - https://www.soma-zone.com/LaunchControl/manual.html
