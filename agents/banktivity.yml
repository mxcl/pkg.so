history:
  adoption-history:
    - >
      The original iBank quickly developed a following among Mac users and expanded from
      macOS to iPhone in 2009 and iPad in 2012. IGG reported helping hundreds of
      thousands of customers manage their finances.
    - >
      Later Banktivity releases added workspaces, reports, tagging, budgeting,
      investment tracking, cloud synchronization, and automatic financial-institution
      downloads. In 2020 the product moved to a subscription model that bundled
      connected services while retaining non-connected functionality after cancellation
      under the announced terms.
  package-nerd-significance:
    - >
      Banktivity represents a long-running, Mac-native personal-finance lineage in a
      category often dominated by Quicken and web services. The Homebrew cask provides a
      repeatable installation route for proprietary software whose user data remains
      financially sensitive.
    - >
      Its 2016 rename is a useful packaging detail: Banktivity continued the version
      numbering and customer lineage of iBank rather than beginning as an unrelated
      product.
  project-history:
    - >
      IGG Software first released its personal-finance application as iBank in November
      2003. The family expanded to iPhone and iPad before IGG renamed it Banktivity in
      2016, combining the words “bank” and “activity.”
    - >
      Banktivity 6 was rebuilt and released in 2017 with workspaces and more than one
      hundred changes. Banktivity 7 followed in 2018, and a new subscription-based
      generation arrived in 2020 across macOS and iOS.
  related-projects:
    - >
      iBank is the former name of Banktivity. Direct Access is IGG Software's connected
      service for downloading transactions from financial institutions.
  sources:
    - >
      Official 2020 release post:
      https://www.iggsoftware.com/blog/2020/10/the-new-banktivity-now-available/
    - 'Official Direct Access page: https://www.iggsoftware.com/direct-access/'
    - 'Official announcements: https://www.iggsoftware.com/announcements.php'
    - 'Official rename announcement: https://www.iggsoftware.com/pr/Banktivity.pdf'
  summary:
    - >
      Banktivity is IGG Software's personal-finance manager for macOS and iOS, descended
      from the iBank application first released in 2003.
  timeline:
    - '2003: IGG Software releases iBank for Mac.'
    - '2009: iBank for iPhone is released.'
    - '2012: iBank for iPad is released.'
    - '2016: IGG Software renames the iBank family to Banktivity.'
    - '2017: Banktivity 6 introduces a rebuilt application and workspaces.'
    - '2018: Banktivity 7 is released.'
    - '2020: A new subscription-based Banktivity generation launches on macOS and iOS.'
  usage:
    - >
      Banktivity is used to track accounts, transactions, investments, budgets, bills,
      and financial goals. Optional connected services import activity from banks and
      brokerages.
    - >
      Because the application handles financial records and institution connections, its
      local documents and synchronized account data should be treated as sensitive. No
      official fixed configuration-file or credentials-file path was verified.
