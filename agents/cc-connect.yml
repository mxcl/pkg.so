  docs-sources:
    - >
      Official README lists docs/usage.md as the full documentation, INSTALL.md as the
      installation guide, and config.example.toml as the configuration template.
    - Official README manual setup copies config.example.toml to ~/.cc-connect/config.toml.
    - >
      Official usage guide documents platform credential setup commands that write
      credentials back to config.toml.
  history-sources:
