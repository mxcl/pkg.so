  - https://github.com/chenhg5/cc-connect#readme
  - https://github.com/chenhg5/cc-connect/blob/main/INSTALL.md
config-file-location:
  unix:
    - ~/.cc-connect/config.toml
credentials-file-location:
  unix:
    - ~/.cc-connect/config.toml
history:
  adoption-history:
    - >
      The project is distributed through Homebrew and npm according to the supplied
      package facts and README badges. Its README tracks rapid platform and agent
      expansion, with v1.3.3 notes describing new first-class agents, platform
      integrations, and operational hardening; the GitHub releases API reported v1.4.1
      published on 2026-06-28.
  package-nerd-significance:
    - >
      It is an example of the 2025-2026 wave of AI-agent plumbing packages: a single CLI
      that packages chat adapters, local daemon behavior, provider credentials, and
      multi-agent routing into a Homebrew-installable tool.
  project-history:
    - >
      The official README positions cc-connect as a bridge between locally running AI
      agents and chat platforms. Its usage guide documents session management,
      provider/model switching, daemon mode, scheduled tasks, web admin, bridge access,
      and platform setup.
  related-projects:
    - >
      Claude Code, Codex, Gemini CLI, OpenCode, Cursor Agent, and chat platforms
      documented in the official README.
  sources:
    - https://api.github.com/repos/chenhg5/cc-connect
    - https://github.com/chenhg5/cc-connect
    - https://github.com/chenhg5/cc-connect/blob/main/docs/usage.md
    - https://github.com/chenhg5/cc-connect#readme
    - https://github.com/chenhg5/cc-connect/blob/main/INSTALL.md
    - https://formulae.brew.sh/api/formula/cc-connect.json
  summary:
    - >
      cc-connect bridges local AI coding agents to chat platforms so users can drive
      coding agents from messaging apps.
  timeline:
    - '2026-06-28: GitHub releases API reported v1.4.1.'
  usage:
    - >
      Users configure projects, agents, platform tokens, API providers, and bridge/web
      tokens in config.toml, commonly under ~/.cc-connect/config.toml. It targets
      chat-driven workflows for code review, research, automation, data analysis, and
      remote control of local agent sessions.
related-packages:
  - id: brew:cc-switch-cli
    reason: >
      Use CC-Switch CLI alongside cc-connect when the same local Claude Code, Codex,
      Gemini, or OpenCode installations need centralized provider, account, MCP, prompt,
      and skill configuration.
    rel: adjacent_workflow
    sources:
      - https://github.com/chenhg5/cc-connect/blob/main/README.md
      - https://github.com/SaladDay/cc-switch-cli#readme
