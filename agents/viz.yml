history:
  adoption-history:
    - >
      Viz was distributed as precompiled GitHub releases and through Homebrew. Its
      repository attracted a modest community of users and contributors around a
      narrowly focused native macOS capture workflow.
  package-nerd-significance:
    - >
      Viz combines several common extraction tasks—OCR, QR and barcode recognition, and
      color sampling—in one native screen-snipping utility. Its automatic clipboard
      output, configurable hotkeys, optional shell-command post-processing, and Homebrew
      distribution make it particularly useful in keyboard-driven macOS workflows.
    - >
      The developer states that active development and releases have been on hold since
      the end of 2025, an important maintenance consideration for package users.
  project-history:
    - >
      Alin Lupascu developed Viz as a SwiftUI macOS utility using Apple's Vision
      framework for text and code recognition. Later releases added capture history,
      color picking, optional iCloud Drive history synchronization, webcam capture, and
      a custom updater.
    - >
      After development had effectively stopped near the end of 2025, the maintainer
      marked the project on hold indefinitely while leaving open the possibility of
      returning to it.
  related-projects:
    - Pearcleaner, Sentinel, and PearHID are other macOS utilities by the same developer.
    - Apple Vision supplies the recognition capabilities used by Viz.
  sources:
    - https://github.com/alienator88/Viz
    - https://github.com/alienator88/Viz/releases
  summary:
    - >
      Viz is a native macOS screen-snipping utility for extracting text, QR codes,
      barcodes, and colors and copying the result to the clipboard.
  timeline:
    - 'Version 1.9: Capture history was added.'
    - 'Version 2.0: Color picking and history integration were added.'
    - 'Version 2.1: Optional iCloud Drive history synchronization was added.'
    - '2025: Active development and releases effectively stopped.'
  usage:
    - >
      Users invoke configurable shortcuts, select part of the screen, and receive
      recognized text, code data, or color values on the clipboard. Viz can retain
      captures in history, synchronize that history through iCloud Drive when enabled,
      and pass OCR output to user-configured shell commands.
