id: brew:mdcat
display-name: mdcat
repo: null
docs:
  - https://github.com/BIRSAx2/mdcat#readme
  - https://github.com/BIRSAx2/mdcat/blob/main/mdcat.1.adoc
config-file-location:
  unix:
    - ~/.config/mdcat/config.toml
credentials-file-location: null
history:
  adoption-history:
    - >
      mdcat moved from a Rust crate into mainstream package-manager culture. The input
      facts list packages in Homebrew, MacPorts, Nix, and Scoop, while the Homebrew
      formula reported stable version 2.9.1 and installation analytics in 2026.
    - >
      Crates.io reported about 190,000 total downloads and a 2026 newest version of
      2.9.1, which makes mdcat one of the better-known Rust terminal Markdown viewers
      rather than a one-off sample program.
  package-nerd-significance:
    - >
      mdcat is interesting to package maintainers because it is a terminal UI tool whose
      quality depends on optional terminal capabilities and native libraries, especially
      libcurl and image-rendering support. That gives formulas and distro packages more
      surface area than a plain text filter.
    - >
      It is also a useful marker for the Rust CLI wave: a small binary distributed
      through Cargo, Homebrew, Nix-style systems, and other package managers, with
      release artifacts and generated shell completions as package extras.
  project-history:
    - >
      The mdcat crate was first published on crates.io in January 2018. Its current
      README credits Sebastian Wiesner and Mouhieddine Sabir in the copyright notice and
      says the project is now maintained by BIRSAx2.
    - >
      The upstream changelog shows an active 2.x line through 2024 and 2026: version
      2.4.0 added limited table support in September 2024, version 2.7.0 moved remote
      resource handling to curl in November 2024, version 2.8.0 transferred maintenance
      to BIRSAx2 in June 2026, and version 2.9.0 added footnote and math rendering
      shortly afterward.
  related-projects:
    - >
      The README positions mdcat near terminal pagers and Markdown viewers, and
      documents `mdless` compatibility by allowing the binary to be linked or copied as
      `mdless` for automatic pagination.
    - >
      Its implementation relies on terminal ecosystem pieces such as syntect for code
      highlighting, resvg for SVG rendering, OSC 8 hyperlinks, and iTerm2, kitty,
      WezTerm, and Sixel graphics protocols.
  sources:
    - https://crates.io/crates/mdcat
    - https://formulae.brew.sh/formula/mdcat
    - https://github.com/BIRSAx2/mdcat#readme
    - https://github.com/BIRSAx2/mdcat/blob/main/CHANGELOG.md
    - source_facts.package-manager
  summary:
    - >
      mdcat is a Rust command-line renderer for Markdown/CommonMark documents in text
      terminals. It sits in the same user niche as cat, less, glow, and mdless, but
      emphasizes modern terminal features such as OSC 8 links, syntax highlighting,
      inline image protocols, math rendering, and terminal-specific navigation marks.
  timeline:
    - '2018: mdcat crate first published on crates.io.'
    - >
      2024: The 2.x series added table support, shell completion generation, Ghostty
      image support, and curl-backed remote resources.
    - '2026: Version 2.8.0 moved maintenance to BIRSAx2.'
    - '2026: Version 2.9.0 added footnote and math rendering.'
  usage:
    - >
      Typical use is direct terminal viewing, for example `mdcat README.md`, with
      optional use as `mdless` when installed or linked that way for paging. Packagers
      are expected to consider shell completions and a man page built from
      `mdcat.1.adoc`.
    - >
      The README documents best results in terminals with modern graphics and link
      protocols, including iTerm2, kitty, WezTerm, Ghostty, foot, and Sixel-capable
      xterm setups. It also documents a troubleshooting path through the `MDCAT_LOG`
      environment variable rather than a persistent configuration file.
related-packages:
  - id: brew:mdfried
    reason: >
      Choose mdfried when a pager-style interface, large rendered headings, extensive
      inline-image support, or Mermaid rendering is more important than mdcat's
      stream-oriented `cat` behavior.
    rel: alternative
    sources:
      - https://github.com/BIRSAx2/mdcat#readme
      - https://github.com/benjajaja/mdfried#readme
  - id: brew:glow
    reason: >
      Choose Glow for a polished terminal UI that can browse Markdown files and open
      repository or remote Markdown, while mdcat is particularly convenient in pipelines
      and direct file rendering.
    rel: alternative
    sources:
      - https://github.com/BIRSAx2/mdcat#readme
      - https://github.com/charmbracelet/glow#readme
  - id: brew:mdless
    reason: >
      Choose the independent Ruby-based mdless when traditional pager behavior, custom
      themes, and its established Ruby/macOS workflow are preferred; mdcat can also
      expose a lightweight `mdless` compatibility mode itself.
    rel: alternative
    sources:
      - https://github.com/BIRSAx2/mdcat#readme
      - https://github.com/ttscoff/mdless#readme
