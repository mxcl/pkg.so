config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Version 3 was the first major Kaleidoscope release in eight years and marked the
      product’s return to active development under its new independent owners.
    - >
      It remained a one-time-purchase release before the product adopted subscription
      licensing. The official support material states that v3 perpetual licenses remain
      usable.
  package-nerd-significance:
    - >
      The versioned cask lets users pin the last major one-time-purchase generation
      instead of following the main cask into the subscription era.
    - >
      For Mac-focused developer environments, it captures a meaningful compatibility and
      licensing boundary while retaining the graphical Git, text, image, and folder
      comparison workflows associated with Kaleidoscope.
  project-history:
    - >
      The team that acquired Kaleidoscope in 2020 modernized the neglected application
      and released version 3 in October 2021.
    - >
      Version 3 began a renewed sequence of feature updates. It was later superseded by
      subscription-based releases, while existing v3 licenses remained valid.
  related-projects:
    - >
      Kaleidoscope 2 preceded this generation; later subscription releases succeeded it.
      Git, Xcode, ksdiff, Subversion, and Mercurial are documented integrations.
  sources:
    - https://blog.kaleidoscope.app/2021/10/07/meet-the-new-kaleidoscope/
    - https://blog.kaleidoscope.app/2021/10/12/acquiring-a-product/
    - >
      https://blog.kaleidoscope.app/2023/03/23/switching-to-subscription-pricing-for-kaleidoscope-4/
    - https://kaleidoscope.app/help
  summary:
    - >
      Kaleidoscope 3 is the legacy third major generation of the macOS visual diff and
      merge tool and the final generation sold primarily under a perpetual-license
      model.
  timeline:
    - '2020: The current independent team acquired Kaleidoscope.'
    - '2021: Kaleidoscope 3 launched as the first major release in eight years.'
    - '2022: Version 3 continued receiving feature and maintenance updates.'
    - '2023: Kaleidoscope 4 introduced the transition to subscription pricing.'
  usage:
    - >
      Users compare or merge text, images, and directories in the graphical application
      and integrate it into Git and other developer workflows through ksdiff.
    - >
      The versioned cask mainly serves v3 license holders and users deliberately
      retaining the pre-subscription major release.
tags:
