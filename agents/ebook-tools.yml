history:
  adoption-history:
    - >
      The input metadata records broad downstream packaging, including Homebrew, Alpine,
      Debian/Ubuntu as epub-utils, Fedora, MacPorts, Nix, Arch, and openSUSE. That broad
      packaging footprint is larger than the visible upstream activity would otherwise
      suggest.
  package-nerd-significance:
    - >
      ebook-tools is the kind of legacy conversion package that remains useful because
      distributions have kept it buildable. The interesting metadata story is not rapid
      upstream development, but long-tail preservation across package managers.
  project-history:
    - >
      The SourceForge project describes ebook tools as tools for accessing and
      converting various ebook file formats. The 0.2.2 tarball is shown on the official
      SourceForge files page with a September 4, 2012 release date.
  related-projects:
    - >
      Downstream Debian and Ubuntu package the related command set as epub-utils
      according to the batch input metadata.
  sources:
    - https://sourceforge.net/projects/ebook-tools/
    - https://sourceforge.net/projects/ebook-tools/files/ebook-tools/0.2.2/
    - https://sourceforge.net/p/ebook-tools/code
  summary:
    - >
      ebook-tools is an older SourceForge-hosted toolkit for accessing and converting
      ebook formats. Its package relevance comes from being small, old, and still
      shipped by many Unix-like package managers for tools such as `einfo` and
      `lit2epub`.
  timeline:
    - '2012: ebook-tools 0.2.2 tarball released on SourceForge.'
    - >
      2026: Still present in multiple package-manager ecosystems according to the batch
      input metadata.
  usage:
    - >
      Packaged usage centers on command-line utilities including `einfo` and `lit2epub`,
      matching the package description of accessing and converting ebook formats.
related-packages:
  - id: cask:calibre
    reason: >
      Choose Calibre when you need a full ebook library application and its extensively
      documented multi-format `ebook-convert` command rather than ebook-tools' small
      legacy utility set.
    rel: alternative
    sources:
      - https://sourceforge.net/projects/ebook-tools/
      - https://manual.calibre-ebook.com/generated/en/ebook-convert.html
