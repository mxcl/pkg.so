history:
  adoption-history:
    - >
      The project expanded from its initial macOS and Windows releases to Linux packages
      and attracted external code contributions soon after launch. Its positioning
      emphasizes a small native desktop footprint, offline operation, and a focused
      alternative to browsers, knowledge-base applications, and full code editors.
  package-nerd-significance:
    - >
      MDHero is a compact Tauri-and-Rust desktop application distributed from a public
      MIT-licensed repository. It is of interest to package users as a narrowly scoped
      Markdown reader and editor with native installers, local-first behavior,
      reproducible public builds, and no account requirement.
  project-history:
    - >
      Vaibhav Kakde released MDHero in April 2026 as an open-source Markdown viewer for
      macOS and Windows. Editing, update support, signing and notarization, presentation
      mode, live reload, Linux packaging, and a macOS Quick Look extension followed
      during its early release series.
    - >
      The application uses Tauri with a Rust backend and a Svelte interface. It renders
      Markdown locally and supports syntax highlighting, KaTeX mathematics, Mermaid
      diagrams, multiple tabs, file watching, PDF output, and lightweight editing.
  related-projects:
    - Tauri
    - Svelte
    - Rust
    - markdown-it
    - KaTeX
    - Mermaid
    - Marp
  sources:
    - 'Official project site: https://mdhero.app/'
    - 'Official release history: https://mdhero.app/releases/'
    - 'Official repository README: https://github.com/vaibhav-kakde-in/mdhero#readme'
  summary:
    - >
      MDHero is a free, open-source, local-first Markdown viewer and lightweight editor
      for macOS, Windows, and Linux.
  timeline:
    - '2026-04-23: First public release.'
    - '2026-04-28: Lightweight in-application editing arrived.'
    - '2026-05: External contributions and notarized macOS builds appeared.'
    - '2026-09: Linux packages and macOS Quick Look support were available.'
  usage:
    - >
      Users open local Markdown files, public repository URLs, or pasted Markdown;
      switch among rendered, split, raw, and edit views; and save changes back to disk.
      The application works offline, requires no account, and uses no API-key
      credentials for its browser-based AI lookup shortcuts.
