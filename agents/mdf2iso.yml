history:
  adoption-history:
    - >
      mdf2iso survived mostly as a distribution utility rather than as a living upstream
      application. The input facts list packages in Homebrew, Debian, Ubuntu, MacPorts,
      Nix, Arch, and pacman-family systems, while Homebrew follows Debian's package page
      as its homepage.
    - >
      That packaging pattern is typical for old disk-image tools: small source, stable
      behavior, little upstream activity, but useful enough to keep available when users
      encounter legacy proprietary CD/DVD image formats.
  package-nerd-significance:
    - >
      mdf2iso matters less as an actively evolving project than as a long-tail
      package-manager artifact. It preserves a tiny utility for converting Alcohol 120%
      images on Unix-like systems without installing a larger optical-disc emulation
      stack.
    - >
      Its history shows a common distro-maintenance pattern: the upstream homepage
      disappeared, but Debian/Salsa packaging became the practical source of truth for
      downstream package managers.
  project-history:
    - >
      Debian packaging records identify Salvatore Santagati as the upstream author and
      give copyright years 2004-2005. The Debian man page was written in December 2005
      because the original program did not ship one.
    - >
      The Debian changelog records an initial Ubuntu package in December 2005, a Debian
      repackaging in January 2007, and an import of upstream 0.3.1 in February 2015. By
      2018 the Debian control metadata had moved VCS fields to Salsa and removed the
      dead Berlios homepage.
  related-projects:
    - >
      mdf2iso belongs to the family of command-line optical-disc image converters for
      legacy image formats such as MDF, BIN/CUE, and TOC/DAT.
    - >
      For package managers, its closest maintained relationship is Debian/Salsa
      packaging rather than a separate active upstream project site.
  sources:
    - https://formulae.brew.sh/api/formula/mdf2iso.json
    - https://salsa.debian.org/debian/mdf2iso/-/blob/master/debian/changelog
    - https://salsa.debian.org/debian/mdf2iso/-/blob/master/debian/copyright
    - https://salsa.debian.org/debian/mdf2iso/-/blob/master/debian/mdf2iso.1
    - source_facts.package-manager
  summary:
    - >
      mdf2iso is a small command-line converter for Alcohol 120% `.mdf` disk images. Its
      job is narrow: convert MDF input into plain ISO output, or into cue/bin and
      toc/dat image pairs.
  timeline:
    - "2004: Upstream copyright period begins for Salvatore Santagati's mdf2iso."
    - '2005: Ubuntu initial package and Debian man page created.'
    - '2007: Repackaged for Debian.'
    - '2015: Debian imported upstream 0.3.1 with large-file support.'
    - >
      2018: Debian packaging moved VCS metadata to Salsa and removed the dead Berlios
      homepage.
  usage:
    - >
      The documented invocation is `mdf2iso [OPTION] [BASENAME.MDF] [DESTINATION]`.
      Without `--cue` or `--toc`, it generates ISO output; with those switches it can
      write cue/bin or toc/dat pairs.
    - >
      There is no official configuration or credential flow. It is a direct file
      conversion tool intended for local disk-image files.
related-packages:
  - id: brew:iat
    reason: >
      Choose Iso9660 Analyzer Tool when the source may be MDF or one of several other
      legacy CD-image formats and the desired result is ISO-9660; mdf2iso additionally
      offers CUE/BIN and TOC/DAT output modes.
    rel: alternative
    sources:
      - https://salsa.debian.org/debian/mdf2iso/-/blob/master/debian/mdf2iso.1
      - https://sourceforge.net/projects/iat.berlios/
      - https://packages.debian.org/sid/iat
  - id: brew:xorriso
    reason: >
      After mdf2iso creates an ISO image, GNU xorriso can inspect, extract, modify,
      verify, or record the resulting ISO-9660 filesystem.
    rel: adjacent_workflow
    sources:
      - https://salsa.debian.org/debian/mdf2iso/-/blob/master/debian/mdf2iso.1
      - https://www.gnu.org/software/xorriso/
