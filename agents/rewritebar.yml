history:
  adoption-history:
    - >
      RewriteBar expanded from a focused rewriting utility into a configurable front end
      for numerous cloud and local model providers. Its system-wide selection workflow,
      keyboard shortcuts, PopClip integration, and later Apple Shortcuts support place
      it in the macOS automation and productivity ecosystem.
  package-nerd-significance:
    - >
      RewriteBar illustrates the newer class of native desktop AI clients that separate
      the writing interface from the model provider. Package users can choose hosted
      services or local runtimes such as Ollama and LM Studio, while Homebrew
      installation support added a familiar managed-install path.
  project-history:
    - >
      RewriteBar began public beta development in April 2024 and reached its initial 1.2
      release in May 2024. Subsequent releases added custom actions, translation and
      language controls, local-model support, session history, follow-up actions, and a
      redesigned version 2 application.
  related-projects:
    - >
      RewriteBar integrates with cloud AI providers including OpenAI and Anthropic and
      with local model services including Ollama, LM Studio, oMLX, and Apple
      Intelligence. It also offers a PopClip extension and Apple Shortcuts actions.
  sources:
    - https://rewritebar.com/
    - https://rewritebar.com/changelog
    - https://rewritebar.com/docs
    - https://rewritebar.com/docs/ai-providers
  summary:
    - >
      RewriteBar is a native macOS writing assistant that applies AI-powered grammar
      correction, rewriting, translation, summarization, and custom text actions to
      selected text across applications.
  timeline:
    - '2024-04-24: First beta version was published.'
    - '2024-05-14: Initial release followed.'
    - '2025-09-28: Session history, LM Studio support, and Homebrew installation were added.'
    - '2026-02-21: Documentation moved from Notion to the official website.'
  usage:
    - >
      Users select text in another application, invoke RewriteBar with a global shortcut
      or integration, choose a built-in or custom action, compare the result, and apply
      it. The app can use RewriteBar's service, third-party API keys, or supported local
      models.
