id: cask:rotki
display-name: rotki
repo: null
docs:
  - https://docs.rotki.com/
  - https://docs.rotki.com/usage-guides
  - https://docs.rotki.com/usage-guides/data-directory.html
config-file-location:
  macos:
    - <directory-containing-rotki-executable>/rotki_config.json
credentials-file-location:
  linux:
    - ~/.local/share/rotki/data/users/<account_name>/rotkehlchen.db
  macos:
    - ~/Library/Application Support/rotki/data/users/<account_name>/rotkehlchen.db
  windows:
    - '%LOCALAPPDATA%/rotki/data/users/<account_name>/rotkehlchen.db'
history:
  adoption-history:
    - >
      rotki evolved from a cryptocurrency accounting application into a cross-platform
      portfolio-management system covering exchanges, multiple blockchains, DeFi
      activity, historical events, and tax-oriented profit-and-loss reporting. Its
      official changelog shows continuous packaged releases and database migrations,
      while current releases provide native artifacts for Linux, macOS, and Windows.
  package-nerd-significance:
    - >
      rotki is notable to package enthusiasts because it combines an open-source desktop
      client, a separately usable backend, encrypted local databases, frequent schema
      migrations, and platform-native binary releases. Its migration from the hidden
      ~/.rotkehlchen directory to standards-compliant per-platform data directories is a
      particularly relevant packaging detail.
    - >
      It also occupies an unusual niche among cryptocurrency tools: users retain a local
      encrypted accounting database rather than relying exclusively on a hosted
      portfolio service. That makes data-directory backups, version-compatible database
      upgrades, and reproducible desktop installation important operational concerns.
  project-history:
    - >
      The project has existed since 2017 and initially used the name Rotkehlchen. The
      official changelog records public 0.1.0 and 0.1.1 releases in April 2018, followed
      by frequent releases that expanded exchange tracking, Ethereum support,
      accounting, and tax-report generation.
    - >
      The application was rebranded from Rotkehlchen to rotki during the 1.0 series in
      2019. Version 1.6.0 in July 2020 migrated user data from ~/.rotkehlchen to the
      operating system's standard application-data directory. Subsequent development
      broadened blockchain and DeFi decoding while retaining a privacy-oriented,
      local-data architecture.
  related-projects:
    - SQLite and SQLCipher provide rotki's local database foundation.
    - >
      Exchange APIs, blockchain nodes, explorers, and price oracles supply portfolio and
      transaction data.
    - The desktop distribution pairs rotki's backend with a graphical cross-platform client.
  sources:
    - 'Official FAQ: https://github.com/rotki/docs/blob/main/faq.md'
    - 'Official changelog: https://github.com/rotki/rotki/blob/develop/docs/changelog.rst'
    - 'Official data-directory guide: https://docs.rotki.com/usage-guides/data-directory.html'
    - 'Official database guide: https://docs.rotki.com/contribution-guides/rotki-database.html'
    - 'Official documentation overview: https://docs.rotki.com/'
    - 'Official releases: https://github.com/rotki/rotki/releases'
  summary:
    - >
      rotki is an open-source, privacy-oriented portfolio tracking, asset-management,
      and accounting application specializing in cryptocurrency. It imports activity
      from exchanges and blockchains, stores each local user's information in an
      encrypted SQLCipher database, and produces portfolio statistics and accounting
      reports.
  timeline:
    - '2017: The rotki project was established.'
    - '2018-04-23: Version 0.1.0 was released under the Rotkehlchen name.'
    - >
      2019: The application was rebranded from Rotkehlchen to rotki during the 1.0
      release series.
    - '2020-07-23: Version 1.6.0 adopted standards-compliant per-platform data directories.'
    - >
      2026: The project continued shipping signed cross-platform desktop and
      standalone-backend releases.
  usage:
    - >
      Users create a local account, add blockchain addresses or exchange integrations,
      import CSV histories when necessary, and let rotki retrieve and decode
      transactions into accounting events. The resulting history supports portfolio
      views, statistics, exports, and profit-and-loss reporting.
    - >
      The data directory should be backed up only after the desktop application has
      fully closed, unless the in-app backup feature is used. Directly copying active
      SQLite files can produce an inconsistent backup because pending WAL or journal
      data may not have been incorporated.
    - >
      Long-neglected installations may require an intermediate rotki release to migrate
      an old database before opening it with a current version. Premium synchronization
      covers the user database but not every part of the global database, so users
      should understand the distinction when moving installations.
