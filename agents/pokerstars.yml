    - https://www.pokerstars.net/
  docs-sources:
    - The official Learn section provides poker rules and play guidance.
    - >
      The official PokerStars help center covers accounts, gameplay, technical issues,
      and responsible gaming.
  history-sources:
    - https://www.pokerstars.net/
    - https://www.pokerstars.net/help/
    - https://www.pokerstars.net/help/articles/tec-sft-reinst-mstr/
  repo-sources:
