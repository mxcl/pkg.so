id: cask:pokerstars
display-name: PokerStars
repo: null
docs:
  - https://www.pokerstars.net/help
  - https://www.pokerstars.net/poker/learn
config-file-location:
  macos:
    - ~/Library/Preferences/*user.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      PokerStars distributes desktop and mobile clients alongside its web presence, with
      locally retained desktop settings and player notes supporting long-running player
      profiles and workflows.
  package-nerd-significance:
    - >
      For package users, PokerStars is an example of a proprietary network game whose
      useful local state survives separately from the application bundle. Preserving the
      settings file and optional player-note database matters when reinstalling or
      migrating the cask.
  project-history:
    - >
      PokerStars developed into a multi-platform online poker service with dedicated
      desktop and mobile clients. The .net service focuses on free-to-play poker and
      social games.
  related-projects:
    - PokerStars mobile app
    - PokerStars Learn
  sources:
    - https://www.pokerstars.net/
    - https://www.pokerstars.net/help/
    - https://www.pokerstars.net/help/articles/tec-sft-reinst-mstr/
  summary:
    - >
      PokerStars is an online poker client. The .net edition provides free-to-play
      poker, account features, player notes, and related learning and responsible-gaming
      resources.
  timeline:
    - 'Desktop era: PokerStars provided native clients for Windows and macOS.'
    - 'Mobile era: PokerStars extended the service to Android and iOS apps.'
  usage:
    - >
      Users install the desktop client, sign in, and join online poker games. On macOS,
      the client keeps its settings in a user.ini file under ~/Library/Preferences;
      optional player notes are stored separately under the PokerStars folder in
      ~/Library/Application Support.
tags:
  - card-game
  - free-to-play
