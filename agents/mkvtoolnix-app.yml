id: cask:mkvtoolnix-app
display-name: MKVToolNix
repo: https://codeberg.org/mbunkus/mkvtoolnix
docs:
  - https://mkvtoolnix.download/docs.html
  - https://mkvtoolnix.download/doc/mkvtoolnix-gui.html
config-file-location:
  macos:
    - ~/Library/Preferences/bunkus.org/mkvtoolnix-gui/mkvtoolnix-gui.ini
credentials-file-location: null
history:
  adoption-history:
    - >
      MKVToolNix became a standard cross-platform toolkit in Matroska-oriented
      workflows, with official binaries or installation guidance for macOS, Windows,
      Linux, and other Unix-like systems.
    - >
      The macOS application is distributed through the Homebrew cask recorded in
      source_facts.package-manager, making the GUI and its companion utilities
      reproducible through a package-manager workflow.
  package-nerd-significance:
    - >
      MKVToolNix is important to package and media-tool users because it provides
      focused, scriptable Matroska primitives alongside a GUI, rather than requiring
      full video transcoding software.
    - >
      Its long release history, platform-specific packages, and command-line components
      make it useful in both interactive media maintenance and automated remuxing
      pipelines.
  project-history:
    - >
      Moritz Bunkus made his Matroska libraries and tools officially available on May 1,
      2003. The project subsequently developed into a suite containing mkvmerge,
      mkvinfo, mkvextract, mkvpropedit, and MKVToolNix GUI.
    - >
      The project moved its source repository, issue tracker, and wiki from GitLab to
      Codeberg in March 2025.
  related-projects:
    - Matroska
    - libEBML
    - libMatroska
  sources:
    - https://help.mkvtoolnix.download/t/mkvtoolnix-issue-tracker-wiki-moved-to-codeberg/1266
    - https://mkvtoolnix.download/
    - https://mkvtoolnix.download/docs.html
    - https://mkvtoolnix.download/old_news.html
    - https://mkvtoolnix.download/source.html
  summary:
    - >
      MKVToolNix is a long-running collection of command-line and graphical tools for
      creating, inspecting, extracting, and modifying Matroska containers.
  timeline:
    - '2003: The Matroska libraries and tools became officially available.'
    - >
      2015: MKVToolNix GUI 8.3.0 introduced external settings and job-queue files in
      place of earlier Windows registry storage.
    - '2025: The source repository, issue tracker, and wiki moved to Codeberg.'
  usage:
    - >
      Users commonly remultiplex audio, video, subtitle, attachment, and chapter streams
      without transcoding; inspect container structure; extract tracks; and edit
      Matroska metadata or headers.
    - >
      The GUI can save multiplexing configurations and reopen .mtxcfg files, while the
      companion command-line tools support repeatable shell and automation workflows.
