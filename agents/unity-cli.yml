history:
  adoption-history:
    - >
      Unity positions the CLI for continuous-integration agents, automation scripts,
      terminal-first development, and environments where installing the full Unity Hub
      is undesirable. The initial beta supports macOS, Linux, and Windows on x64 and
      Arm64.
  package-nerd-significance:
    - >
      The standalone CLI gives package-manager users a lighter alternative to Unity Hub
      for installing Editors and modules. Structured JSON or TSV output, predictable
      exit codes, self-updates, and non-interactive service-account authentication make
      it especially relevant to CI and agentic workflows.
  project-history:
    - >
      Unity CLI began as an experimental standalone command-line tool for managing Unity
      Editors, modules, projects, and authentication independently of the Unity Hub
      desktop application.
    - >
      The first public beta established Editor and module installation, project
      management, authentication, structured output, upgrades, and verified binary
      downloads. Later beta releases expanded diagnostics, automation, service-account
      authentication, proxy configuration, and Unity Pipeline integration.
  related-projects:
    - >
      Unity CLI works alongside Unity Editor, Unity Hub, and the experimental Unity
      Pipeline package. It also provides a migration path from scripts using Unity Hub's
      embedded headless CLI.
  sources:
    - https://docs.unity.com/en-us/unity-cli
    - https://docs.unity.com/en-us/unity-cli/release-notes
    - https://docs.unity.com/en-us/unity-cli/unity-cli
    - https://docs.unity.com/en-us/unity-cli/unity-cli-reference
    - https://docs.unity.com/en-us/unity-cli/use-unity-cli
    - https://unity.com/blog/meet-the-unity-cli
  summary:
    - >
      Unity CLI is Unity's experimental standalone terminal tool for installing and
      managing Unity Editors and modules, opening projects, handling authentication, and
      supporting automation without requiring the Unity Hub desktop application.
  timeline:
    - '2026-04-04: Unity published the first public beta, 0.1.0-beta.1.'
    - >
      2026-05-07: Beta 4 added major diagnostics, Editor-management, project-management,
      and automation commands.
    - '2026-05-21: Beta 5 added service-account authentication and Unity Pipeline installation.'
    - '2026-07-20: Unity presented the CLI as a terminal and agent-automation interface.'
  usage:
    - >
      Users run `unity install` to install Editors, `unity install-modules` to add
      platform support, `unity open` to launch projects, and `unity auth login` to
      authenticate. Machine-readable output and non-interactive credentials support CI,
      build agents, and automation.
