history:
  adoption-history:
    - >
      Balsamiq says its early adoption was driven largely by developers and product
      managers before it became established in professional UX workflows. Its
      deliberately sketch-like visual language made low-fidelity wireframes useful as
      conversation artifacts rather than polished final designs.
    - >
      The product expanded from the original desktop and Confluence offering into a
      family of desktop, web, and Atlassian products. Balsamiq has announced that
      Desktop sales end on December 31, 2026, followed by the end of official Desktop
      support on December 31, 2027, as the company shifts its focus to Balsamiq Cloud.
  package-nerd-significance:
    - >
      Balsamiq became a recognizable fixture in developer and product-management
      toolkits by making intentionally rough wireframes fast to construct. The Desktop
      application is also notable for moving from an Adobe AIR foundation to a rewritten
      native application while retaining its BMPR project format.
  project-history:
    - >
      Founder Peldi Guilizzoni built and launched the original Balsamiq Mockups in 2008
      after developing an interest in user experience while working as a programmer.
    - >
      After more than a decade of desktop-product experience, Balsamiq released the
      rewritten Balsamiq Wireframes for Desktop in January 2020. The new generation
      replaced the Adobe-based implementation with a native application and renamed the
      product to emphasize low-fidelity wireframes rather than mockups.
  related-projects:
    - Balsamiq Cloud is the company's web-based successor and collaboration platform.
    - >
      Balsamiq Mockups 3 for Desktop was the Adobe AIR-based predecessor to Balsamiq
      Wireframes for Desktop.
  sources:
    - >
      Founder's official history:
      https://balsamiq.com/blog/personal-whats-your-story-why-start-balsamiq/
    - 'Official Desktop guide: https://balsamiq.com/support/getting-started/desktop/'
    - 'Official Desktop launch: https://balsamiq.com/learn/wireframes-for-desktop-launch/'
    - 'Official EULA and lifecycle notice: https://balsamiq.com/legal/eula/'
  summary:
    - >
      Balsamiq Wireframes is a commercial desktop tool for rapidly creating low-fidelity
      user-interface wireframes and prototypes.
  timeline:
    - '2008: Peldi Guilizzoni launched the original Balsamiq Mockups.'
    - '2020: The fully rewritten Balsamiq Wireframes for Desktop was released.'
    - '2026: Balsamiq plans to end sales of the Desktop product on December 31.'
    - '2027: Official support for Balsamiq for Desktop is scheduled to end on December 31.'
  usage:
    - >
      Designers, developers, product managers, and other stakeholders arrange UI
      controls on a canvas to sketch interfaces, link screens, collect feedback, present
      concepts, and export wireframes. Local projects use the BMPR format, while the
      Desktop application can also work with Balsamiq Cloud projects.
