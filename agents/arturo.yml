history:
  adoption-history:
    - >
      Official installation paths include pre-built binaries, an installer script at
      get.arturo-lang.io, nightly releases, Docker, and Homebrew. The provided
      package-manager facts also list apk, MacPorts, and winget, showing that Arturo has
      moved beyond a source-only experimental language into multiple packaging channels.
    - >
      GitHub metadata reported hundreds of stars and active issues at research time, and
      the README points users to GitHub Issues and a dedicated Discord server for
      community discussion.
  package-nerd-significance:
    - >
      Arturo is notable as a small language runtime with broad binary-distribution
      ambitions. It is written in Nim, packaged by several OS/package ecosystems, and
      exposes a single interpreter command that fits cleanly into Homebrew-style CLI
      collections.
    - >
      For package nerds, the interesting part is not just the language syntax but the
      distribution story: stable binaries, nightlies, installer script, Docker image,
      and package-manager formulas all coexist.
  project-history:
    - >
      The public GitHub repository was created in September 2019. Early GitHub releases
      appeared in late September and October 2019, and the README identifies Arturo as a
      Nim-written language that is loosely related to families such as Logo, Rebol,
      Forth, Ruby, Haskell, Smalltalk, Tcl, and Lisp.
    - >
      The language design described in the README centers on blocks of words, symbols,
      and literal values with no reserved words. The README also explains the name as a
      memorial to the author's pet Arturo, and the license text credits Yanis
      Zafiropulos, also known as Dr.Kameleon.
  related-projects:
    - >
      The official README highlights Arturo-adjacent projects Grafito and Aguila, and
      points to a separate nightly-build repository.
  sources:
    - https://api.github.com/repos/arturo-lang/arturo
    - https://api.github.com/repos/arturo-lang/arturo/releases
    - https://arturo-lang.io/documentation
    - https://github.com/arturo-lang/arturo
    - https://raw.githubusercontent.com/arturo-lang/arturo/master/README.md
    - source_facts.package-manager
  summary:
    - >
      Arturo is an independently developed, portable programming language and
      interpreter aimed at efficient scripting. Its package identity is simple: install
      the `arturo` executable, then run scripts or enter the language environment.
  timeline:
    - '2019: Public GitHub repository created.'
    - '2019: Early v0.3.x and v0.4.0 GitHub releases published.'
    - '2021: Multiple v0.9.x releases published.'
    - '2026: v0.10.0 `Arizona Bark` release published.'
  usage:
    - >
      Users typically install a pre-built binary or use a package manager, then run
      Arturo scripts from the command line. The official documentation covers getting
      started, language basics, command-line use, the standard library, and examples.
    - >
      The README showcases adjacent Arturo projects such as Grafito and Aguila,
      indicating that the language ecosystem includes experiments in graph data and
      desktop application building as well as the core interpreter.
