history:
  adoption-history:
    - >
      ParseHub's founders reported that the service gained its first ten paying
      customers within weeks of its September 2014 launch. By May 2016, the bootstrapped
      company reported thousands of users, hundreds of paying customers, and sustained
      month-over-month revenue growth.
    - >
      The company initially aimed at developers and technically experienced
      professionals dealing with difficult websites, then broadened the desktop
      application's interface and training material so that users with spreadsheet or
      business-analysis experience could build scraping projects without writing code.
      These adoption figures are company-reported.
  package-nerd-significance:
    - >
      ParseHub packages a browser-like visual scraper as a desktop application for
      macOS, Windows, and Linux while executing full production runs in its cloud
      service. This hybrid model makes it approachable for non-programmers but also
      gives developers a REST API, webhooks, JSON and CSV export, scheduling, and
      project tokens.
    - >
      For package-oriented users, the distinction between local test runs and cloud runs
      is operationally important: tests use the local machine and IP address, whereas
      normal runs continue on ParseHub's servers. API automation also requires an
      account API key and per-project token.
  project-history:
    - >
      ParseHub was developed for visually extracting structured data from complex and
      poorly structured websites. The team spent almost a year building and user-testing
      the initial product before launching it in September 2014.
    - >
      By 2016, ParseHub had evolved from a beta aimed at technical users into a broader
      no-code data-collection application. A redesigned desktop interface automated
      common selection and extraction steps, and the company published an expanded
      searchable help center.
    - >
      ParseHub remained bootstrapped during its early growth. Its desktop client defines
      scraping projects and performs local tests, while the hosted service runs complete
      jobs and exposes their status and results through the web interface and REST API.
  related-projects:
    - >
      ParseHub's REST API lets developers start runs, inspect projects, receive
      webhooks, and download JSON or CSV data.
    - Cloud-run scheduling and IP rotation complement the desktop project editor.
    - >
      The official documentation discusses migration from the discontinued Kimono Labs
      service.
  sources:
    - >
      Official 2016 product redesign announcement:
      https://www.parsehub.com/blog/introducing-a-new-version-of-parsehub/
    - 'Official API reference: https://www.parsehub.com/docs/ref/api/v2/'
    - 'Official Help Center: https://help.parsehub.com/hc/en-us'
    - >
      Official ParseHub launch retrospective:
      https://www.parsehub.com/blog/how-we-got-our-first-10-paying-saas-customers/
    - >
      Official growth retrospective:
      https://www.parsehub.com/blog/how-we-grew-revenue-by-20-every-month-without-investors/
    - >
      Official local-versus-cloud execution documentation:
      https://help.parsehub.com/hc/en-us/articles/115002853354-Where-do-my-projects-run
  summary:
    - >
      ParseHub is a visual web-scraping platform with desktop clients for macOS,
      Windows, and Linux. Users construct extraction projects without necessarily
      writing code, run jobs locally for testing or in ParseHub's cloud, and retrieve
      results as JSON or CSV or through a REST API.
  timeline:
    - >
      2014: ParseHub launched publicly in September after almost a year of development
      and user testing.
    - >
      2015: The founders documented gaining the first ten paying customers shortly after
      launch.
    - >
      2016: ParseHub reported thousands of users and hundreds of paying customers while
      remaining bootstrapped.
    - >
      2016: A redesigned desktop application and an expanded searchable help center were
      introduced.
  usage:
    - >
      A user signs in to the desktop client, enters a target URL, and builds a project
      from visual selection, navigation, and extraction commands. Test runs execute
      locally; normal runs execute in ParseHub's cloud and can continue after the
      desktop application closes.
    - >
      Results can be downloaded from the application or account page in JSON or CSV
      format. Developers can automate projects through the REST API using an account API
      key and project token, with webhooks recommended for completion notifications.
