id: cask:rstudio
display-name: RStudio Desktop
repo: https://github.com/rstudio/rstudio
docs:
  - https://docs.posit.co/ide/user
config-file-location:
  unix:
    - ~/.config/rstudio/rstudio-prefs.json
  windows:
    - '%APPDATA%\RStudio\rstudio-prefs.json'
credentials-file-location: null
history:
  adoption-history:
    - >
      RStudio brought the editor, R console, plots, help, package management, project
      navigation, and development tools into one integrated interface. Its growth was
      reinforced by workflows for R packages, Shiny applications, R Markdown, Quarto,
      notebooks, version control, and reproducible analysis.
    - >
      The IDE became a central part of the broader R ecosystem and was offered in both
      desktop and browser-served forms. Posit describes its open-source data-science
      tools as making code-first work accessible to a broad community.
  package-nerd-significance:
    - >
      RStudio made R package installation and development visible inside a mainstream
      graphical IDE while retaining direct access to the R console and library system.
      Package-manager users typically manage RStudio separately from the R runtime and
      from project-level R package environments.
    - >
      The IDE is itself open source and has an official public repository, making it
      both a packaged end-user application and an inspectable development project.
  project-history:
    - >
      Work on RStudio began in November 2008, and the first public release appeared in
      February 2011 as an open-source IDE for R. Subsequent releases added projects,
      version-control integration, package-development tools, debugging, Shiny support,
      R Markdown, notebooks, and data-import tooling.
    - >
      RStudio 1.0 was released in November 2016. In 2022 the company announced that it
      would become Posit, while preserving RStudio as the name of the IDE.
  related-projects:
    - >
      R is the underlying language runtime. Closely associated projects and products
      include Shiny, R Markdown, Quarto, renv, the tidyverse, Posit Workbench, and
      Positron.
  sources:
    - https://docs.posit.co/ide/user/
    - https://github.com/rstudio/rstudio
    - https://posit.co/blog/announcing-rstudio-v1-0
    - https://posit.co/blog/rstudio-is-becoming-posit
    - https://posit.co/blog/rstudio-new-open-source-ide-for-r
  summary:
    - >
      RStudio Desktop is an open-source integrated development environment centered on R
      and reproducible data-science workflows.
  timeline:
    - '2008: Work on RStudio began in November.'
    - "2011: RStudio's first public release appeared in February."
    - '2016: RStudio 1.0 was released in November.'
    - '2022: The company announced its new Posit name while retaining RStudio as the IDE name.'
  usage:
    - >
      Users write and execute R code, inspect data and plots, manage packages and
      projects, debug programs, use version control, author reproducible documents,
      develop Shiny applications, and build R packages.
