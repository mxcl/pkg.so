history:
  adoption-history:
    - >
      Slite is positioned for organizational knowledge sharing across product,
      engineering, operations, support, human-resources, and sales teams. Its official
      documentation covers migration from systems such as Notion, Confluence, and Google
      Drive.
  package-nerd-significance:
    - >
      The Homebrew cask provides a reproducible command-line installation path for
      Slite's macOS desktop client, useful in managed workstation and bootstrap
      configurations even though Slite itself is primarily a hosted service.
  project-history:
    - >
      Slite developed as a collaborative documentation and team-knowledge product. It
      subsequently emphasized verified documentation, AI-assisted search, integrations,
      automation, and a self-maintaining knowledge-base model.
  related-projects:
    - Official integrations include Slack, Google Drive, an API, and MCP-based access.
    - The Help Center documents imports from Notion, Confluence, and Google Drive.
  sources:
    - https://slite.com/changelog
    - https://slite.com/help
  summary:
    - >
      Slite is a hosted collaborative knowledge base with desktop clients, structured
      documentation, AI-assisted search, verification workflows, and integrations.
  timeline:
    - '2026-08: Slite introduced AI-powered search in its Help Center.'
    - >
      2026: Slite described its product as a self-maintaining knowledge base with
      agent-assisted change proposals and human approval.
  usage:
    - >
      Teams use Slite to write and organize internal documents, search institutional
      knowledge, verify important pages, import existing content, and connect
      documentation with other workplace tools.
