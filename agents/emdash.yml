history:
  adoption-history:
    - >
      Emdash reached a stable v1 release in April 2026 after a public beta. Official
      releases support macOS, Windows, and Linux, while its provider catalog covers
      numerous CLI coding agents rather than requiring a single model vendor.
    - >
      The project expanded from parallel local worktrees into remote development,
      recurring automations, issue-tracker integrations, pull-request review, reusable
      prompts and skills, MCP servers, and an in-app browser.
  package-nerd-significance:
    - >
      Emdash packages an emerging agentic-development workflow into a cross-platform
      desktop application. Package enthusiasts may find its combination of Homebrew
      distribution, local-first state, Git worktree isolation, provider CLI discovery,
      SSH support, and optional repository-level configuration especially notable.
    - >
      Its provider-neutral approach lets developers retain the command-line agents and
      Git repositories they already use while coordinating parallel work through a
      graphical environment.
  project-history:
    - >
      General Action developed Emdash as an open-source agentic development environment
      for coordinating coding agents. Each task receives an isolated Git worktree and
      branch, allowing several agents to work concurrently without sharing a checkout.
    - >
      Emdash v1 became the stable release on 24 April 2026 after a one-week public beta.
      The v1 line rebuilt the task and worktree engine, made remote SSH projects
      first-class, and strengthened pull-request and review workflows.
  related-projects:
    - >
      Emdash integrates with coding-agent CLIs including Codex, Claude Code, Cursor,
      OpenCode, Amp, Devin, Qwen Code, and GitHub Copilot.
    - >
      Its workflow also connects with GitHub, GitLab, Linear, Jira, Asana, Notion, and
      other issue or source-hosting services.
  sources:
    - https://emdash.com/changelog
    - https://emdash.com/docs
    - https://emdash.com/docs/project-config
    - https://github.com/generalaction/emdash
  summary:
    - >
      Emdash is an open-source, local-first desktop environment for running coding
      agents concurrently in isolated Git worktrees. It combines agent sessions,
      terminals, diff review, pull-request workflows, issue integrations, and remote
      development in one application.
  timeline:
    - 'April 2026: Emdash v1 became the stable release after a one-week public beta.'
    - >
      August 2026: Emdash v1.2 introduced the Workspace Server and expanded remote
      development.
    - >
      September 2026: The v1.2 series continued expanding integrations, agent support,
      and remote workflows.
  usage:
    - >
      Users add a local or remote Git project, create tasks, and assign an installed
      coding-agent CLI to each task. Emdash creates separate worktrees so tasks can run
      in parallel, then provides diff review, commit, push, pull-request, and CI-check
      workflows.
    - >
      Project teams can commit a `.emdash.json` file at the chosen project working
      directory to share preserve patterns, shell setup, and lifecycle scripts. Most
      other project settings remain local and take precedence over shared values.
    - >
      GitHub and SSH credentials are handled through connected accounts, encrypted
      application storage, user-supplied SSH key paths, or an SSH agent; the official
      documentation does not identify a standalone Emdash credentials file.
