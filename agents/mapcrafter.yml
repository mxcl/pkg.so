history:
  adoption-history:
    - >
      Mapcrafter's adoption is mostly in the Minecraft server and map-sharing niche
      rather than general GIS. Homebrew packaged it with command-line utilities such as
      mapcrafter, mapcrafter_export, mapcrafter_markers, and helper scripts, which made
      it convenient for macOS users maintaining local worlds or small servers.
    - >
      The official docs emphasize Linux and other Unix-like systems, with experimental
      Windows support, matching the way the tool spread through source builds, package
      managers, and server-admin workflows.
  package-nerd-significance:
    - >
      Mapcrafter is the kind of package that earns its slot by being specialized: a C++
      renderer with multiple CLI entry points, not a generic Minecraft launcher or web
      app. It also shows the package-manager value of preserving niche tooling after the
      upstream release cadence slows.
  project-history:
    - >
      The public GitHub repository dates to December 2012, and the project documentation
      describes Mapcrafter as free GPL software with its source hosted on GitHub. Its
      documentation frames the tool around high-performance offline rendering rather
      than a live server: users point it at world data, choose render views and modes,
      and generate a browsable map output.
    - >
      The 2.x release line was active through the mid-2010s; GitHub releases show
      version 2.2 in March 2016, 2.3 in July 2016, and 2.4 in June 2017. The project
      remains recognizable to package users because it solved a narrow but persistent
      Minecraft administration problem: producing a static, shareable map without
      running a game server plugin.
  related-projects:
    - Leaflet.js is used for the generated browser map presentation.
    - >
      Other Minecraft map renderers occupy the same niche, but Mapcrafter's official
      docs position it as a high-performance C++ offline renderer.
  sources:
    - https://api.github.com/repos/mapcrafter/mapcrafter
    - https://api.github.com/repos/mapcrafter/mapcrafter/releases?per_page=5
    - https://mapcrafter.readthedocs.io/en/latest/
    - https://mapcrafter.readthedocs.io/en/latest/configuration.html
    - source_facts.executables
    - source_facts.package-manager
  summary:
    - >
      Mapcrafter is a C++ renderer for Minecraft worlds that turns Anvil-format world
      data into static web map tiles viewable in a browser with Leaflet-style pan and
      zoom.
  timeline:
    - '2012: Public GitHub repository created.'
    - '2016: Mapcrafter 2.2 and 2.3 releases published.'
    - '2017: Mapcrafter 2.4 release published.'
    - '2024: Repository still receiving commits according to GitHub metadata.'
  usage:
    - >
      Typical use starts with an INI-like configuration file; the official configuration
      docs call the example file render.conf and show world, map, and marker sections.
      Users set an output directory, point input_dir at a Minecraft world, and select
      render modes, rotations, and views.
    - >
      Package users care less about a long-running daemon and more about reproducible
      batch rendering: install the formula, edit render.conf, run mapcrafter, and
      publish the generated files behind any static web server.
