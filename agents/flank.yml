history:
  adoption-history:
    - >
      Flank's adoption is concentrated in mobile CI and Firebase Test Lab workflows. It
      appeals to teams that already understand `gcloud firebase test` configuration but
      need more parallelism, reporting, retries, and sharding behavior.
    - >
      The README says Flank is YAML compatible with the gcloud CLI and adds features to
      accelerate velocity and increase quality, including test sharding, cost reporting,
      stability testing, HTML reports, JUnit XML reports, and Smart Flank.
  package-nerd-significance:
    - >
      Flank is a practical package-manager tool because it wraps a cloud mobile-testing
      service in a reproducible CLI contract. Its value is not a new test framework, but
      a faster scheduler and report layer around Firebase Test Lab.
    - >
      The package is also a good example of infrastructure CLI design: a single YAML
      file, environment-variable-friendly overrides, CI-friendly reports, and cloud
      credentials inherited from the Google tooling ecosystem.
  project-history:
    - >
      The official Flank repository was created in 2017. Its README describes the
      project as a Firebase Test Lab runner for Android and iOS and links the
      documentation at flank.github.io/flank.
    - >
      The hosted docs present Flank as a CLI and configuration-driven test runner.
      Release tags visible through the official repository include 23.x versions,
      showing an actively versioned project history even though the project-level
      history prose is limited.
  related-projects:
    - Firebase Test Lab is the cloud test service Flank drives.
    - gcloud firebase test is the configuration model Flank keeps YAML-compatible with.
    - Android and iOS test artifacts are the primary workload types.
  sources:
    - https://flank.github.io/flank
    - https://github.com/Flank/flank
    - https://raw.githubusercontent.com/Flank/flank/master/README.md
  summary:
    - >
      Flank is a massively parallel Android and iOS test runner for Firebase Test Lab.
      The official README and docs emphasize gcloud-compatible YAML, extra sharding and
      reporting features, and faster mobile test execution.
  timeline:
    - '2017: Official Flank repository created.'
    - >
      2020s: Official docs describe Android and iOS Firebase Test Lab execution with
      gcloud-compatible YAML.
    - '2023: Official release list includes 23.x tags.'
  usage:
    - >
      Users download the jar or install a packaged CLI, prepare a `flank.yml`, and run
      Android or iOS Firebase Test Lab jobs. The docs also show CLI flags for overriding
      YAML values and using environment variables.
    - >
      The curated credential locations reflect Google Cloud authentication and Flank's
      own local state; the official docs center the user workflow around Firebase Test
      Lab and gcloud-compatible configuration.
