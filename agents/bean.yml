history:
  adoption-history:
    - >
      Bean became a familiar lightweight alternative for Mac users who wanted more
      formatting than TextEdit without the weight of a full office suite. Its free
      availability, PowerPC-era builds, many localizations, and continued direct
      downloads helped it remain useful across a long range of macOS releases.
  package-nerd-significance:
    - >
      Bean is a durable example of small native Mac software distributed independently
      rather than through the Mac App Store. Package enthusiasts value its long
      compatibility tail, fast Cocoa-native design, and explicit format tradeoffs. Bean
      2.x also has historical open-source interest, while Bean 3.x is closed source.
  project-history:
    - >
      James Hoover first published Bean in 2006 as a lean Cocoa word processor focused
      on speed and simplicity. It developed distinctive features including live word
      count, focus mode, split-window editing, templates, backups, and a tabbed document
      interface. In 2012 Hoover announced the end of active feature development after
      Bean 3.2.2, while leaving open the possibility of compatibility maintenance. That
      maintenance continued, with the official site publishing newer builds for modern
      macOS systems.
  related-projects:
    - TextEdit
    - NSTextView
    - LibreOffice
    - Microsoft Word
    - OpenOffice
  sources:
    - 'Official News & Plans: https://www.bean-osx.com/Todo.html'
    - 'Official file-format documentation: https://bean-osx.com/fileformats.html'
    - 'Official help and changelog: https://www.bean-osx.com/bean_help/index.html'
    - 'Official homepage: https://bean-osx.com/'
  summary:
    - >
      Bean is a compact native macOS word processor created by James Hoover. It favors
      fast, uncluttered writing and common rich-text formats over advanced publishing
      features such as footnotes, stylesheets, and full Microsoft Word compatibility.
  timeline:
    - '2006: Bean was first published.'
    - '2007: The copyright period shown in current official help begins.'
    - >
      2012: Active development was announced as ending after version 3.2.2, with
      compatibility updates still possible.
    - '2026: Bean 3.7.7 was released for current and older supported macOS versions.'
  usage:
    - >
      Bean is suited to letters, notes, drafts, and moderately formatted documents. It
      reads and writes RTF, RTFD, Bean, plain text, and web archives; it can import or
      export several office formats with documented losses. The author recommends RTF or
      DOC for sharing and warns that complex academic or publishing work may require a
      fuller word processor or TeX.
