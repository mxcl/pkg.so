id: brew:cgrep
display-name: Cgrep
repo: https://github.com/awgn/cgrep
docs:
  - https://awgn.github.io/cgrep
  - https://github.com/awgn/cgrep#readme
config-file-location:
  unix:
    - ./.cgreprc
    - ~/.cgreprc
    - /etc/cgreprc
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed through Hackage and from source on GitHub. Official
      docs document cabal, stack, and source installation paths.
  package-nerd-significance:
    - >
      CGrep is interesting to package maintainers because it sits in the family of grep
      replacements but uses language parsing and Haskell packaging rather than plain
      byte or regex scanning alone.
  project-history:
    - >
      The official documentation frames CGrep as an extension of traditional grep for
      source code, adding language-aware context filters and semantic matching.
  related-projects:
    - >
      The official README links CGrep to Hackage for package distribution and GitHub for
      source development.
  sources:
    - https://api.github.com/repos/awgn/cgrep
    - https://github.com/awgn/cgrep
    - https://awgn.github.io/cgrep/
    - https://awgn.github.io/cgrep
    - https://github.com/awgn/cgrep#readme
    - https://formulae.brew.sh/api/formula/cgrep.json
    - https://github.com/awgn/cgrep/blob/master/CHANGELOG.md
    - https://github.com/awgn/cgrep/blob/master/README.md
  summary:
    - >
      CGrep is a Haskell context-aware grep for source code that searches by code,
      comment, literal, token kind, file type, and semantic patterns.
  timeline:
    - >
      v8.0.0: Changelog notes performance improvements and expanded
      language/configuration support.
    - >
      v9.2: Official docs describe faster token and semantic search, UTF-8 support, and
      semantic test filtering.
    - 'v9.2.2: Official homepage documents this release line.'
  usage:
    - >
      CGrep is used to search source trees while limiting matches to code, comments,
      string literals, identifiers, native types, keywords, numbers, operators, file
      kinds, languages, or test/non-test code.
related-packages:
  - id: brew:ast-grep
    reason: >
      Choose ast-grep when searches and rewrites need explicit abstract-syntax-tree
      patterns; CGrep is closer to grep with language-aware context filters.
    rel: alternative
    sources:
      - https://awgn.github.io/cgrep/
      - https://ast-grep.github.io/guide/introduction.html
  - id: brew:ripgrep
    reason: >
      Choose ripgrep for very fast recursive regular-expression search with
      repository-aware ignore handling when CGrep's source-language context is
      unnecessary.
    rel: alternative
    sources:
      - https://awgn.github.io/cgrep/
      - https://github.com/BurntSushi/ripgrep#readme
tags:
  - cli
  - code-search
  - grep
  - haskell
  - source-code
