id: brew:abcl
display-name: Armed Bear Common Lisp
repo: https://github.com/armedbear/abcl
docs:
  - https://abcl.org/
  - https://abcl.org/releases/latest/abcl.pdf
  - https://armedbear.common-lisp.dev/doc/abcl-user.html
config-file-location:
  unix:
    - ~/.abclrc
credentials-file-location: null
history:
  adoption-history:
    - >
      ABCL occupies a particular niche among Common Lisp implementations: it lets Lisp
      code run where a JVM is already the deployment target. The supplied
      package-manager metadata lists it in APK, Homebrew, Debian, MacPorts, Nix, and
      Ubuntu, reflecting its role as both a language runtime and a Java ecosystem
      bridge.
  package-nerd-significance:
    - >
      Package maintainers care about ABCL because it is a Common Lisp runtime whose
      runtime contract is Java rather than a native Lisp image. That makes Java version
      support, jar layout, wrappers, ASDF integration, and contrib artifacts central
      packaging concerns.
  project-history:
    - >
      The official homepage says ABCL was originally started as a scripting language for
      the J editor. It later grew into a standalone Common Lisp implementation on the
      JVM, with support for JSR-223 so it can act as a Java scripting engine and with
      Java-to-Lisp integration APIs for embedding Lisp in Java applications.
  related-projects:
    - >
      ABCL is tied historically to the J editor and operationally to the JVM, Java
      scripting APIs, ASDF, Quicklisp, and SLIME.
  sources:
    - >
      Official homepage, FAQ repository section, README, releases index, GitHub
      repository metadata, and source_facts.package-manager.
  summary:
    - >
      Armed Bear Common Lisp is an ANSI Common Lisp implementation for the Java Virtual
      Machine. The official homepage describes it as providing both an interpreter and
      compiler, compiling Lisp to Java bytecode, and supporting Java integration.
  timeline:
    - >
      2016: Official GitHub mirror/repository metadata shows the armedbear/abcl
      repository created.
    - >
      2026: Official ABCL release archive lists 1.10.0 artifacts, including abcl.jar and
      abcl.pdf.
  usage:
    - >
      Official documentation shows ABCL being run as a jar with java -jar abcl.jar, used
      as an interactive REPL, embedded from Java, and connected to Common Lisp tooling
      such as ASDF, Quicklisp, and SLIME.
related-packages:
  - id: brew:sbcl
    reason: >
      Choose SBCL when you want a native-code Common Lisp implementation instead of
      ABCL's JVM hosting and Java-integration model; ABCL's official FAQ directly
      contrasts their runtime representations.
    rel: alternative
    sources:
      - https://abcl.org/faq.shtml
      - https://www.sbcl.org/
