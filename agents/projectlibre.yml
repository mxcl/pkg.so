  - https://projectlibre.com/projectlibre-desktop
  - https://projectlibre.com/projectlibre-documentation
config-file-location:
  unix:
    - ~/.projectlibre/projectlibre.conf
  windows:
    - '%USERPROFILE%\ProjectLibre\projectlibre.conf'
credentials-file-location: null
history:
  adoption-history:
    - >
      ProjectLibre Desktop has been distributed as free desktop software for Windows,
      macOS, and Linux and has developed a worldwide user base spanning 193 countries.
      The official project reports more than eight million downloads and use in
      education and organizations.
    - >
      SourceForge has served as the project's long-running release, source-code,
      discussion, and issue-tracking hub. Homebrew's cask offers a package-managed
      installation path on macOS.
  package-nerd-significance:
    - >
      ProjectLibre is a prominent open-source option for users who need traditional
      critical-path scheduling and Microsoft Project file compatibility without a
      proprietary desktop license.
    - >
      Its Java implementation and cross-platform packaging made the same professional
      scheduling model available across Windows, macOS, and Unix-like desktops. The
      separate cloud product does not replace the freely distributed desktop
      application.
  project-history:
    - >
      ProjectLibre launched in 2012 as an open-source desktop project-management
      application built by a team with earlier experience at PSDI, Scitor, WebProject,
      and Projity. It continued that lineage's focus on professional scheduling rather
      than lightweight task lists.
    - >
      The project subsequently added ProjectLibre Cloud for collaborative and
      multi-project work while retaining ProjectLibre Desktop as the free, single-user,
      open-source edition.
  related-projects:
    - >
      Projity and its earlier project-management products form part of the team's
      development lineage.
    - Microsoft Project is the principal compatibility target and comparison point.
    - >
      ProjectLibre Cloud extends the product family to collaborative portfolio and
      resource management.
  sources:
    - https://projectlibre.com/about-us/
    - https://projectlibre.com/projectlibre-desktop/
    - https://sourceforge.net/p/projectlibre/code/ci/master/tree/
    - https://sourceforge.net/projects/projectlibre/
  summary:
    - >
      ProjectLibre Desktop is a free, open-source project-scheduling application
      centered on Gantt charts, work breakdown structures, resources, costs, baselines,
      earned value, and critical-path analysis.
  timeline:
    - >
      2012: The ProjectLibre SourceForge project was registered and the ProjectLibre era
      began.
    - >
      2012 onward: ProjectLibre expanded the free desktop application and later
      introduced a separate collaborative cloud platform.
  usage:
    - >
      Individual project managers build task schedules, dependencies, calendars,
      milestones, baselines, resource assignments, and cost plans, then inspect Gantt,
      network, WBS, and earned-value views.
    - >
      The desktop application can open Microsoft Project files and stores individual
      project documents locally, making it suitable for offline, single-user planning.
