    - https://checkmate.gissen.nl/documentation.php
    - https://checkmate.gissen.nl/download.php
    - https://github.com/Sjord/checkmate
    - https://github.com/sjord
  summary:
    - >
      mpck is the command-line half of Checkmate MP3 Checker, a GPL-licensed utility
      associated with Sjoerd Langkemper's Sjord/checkmate project. Checkmate scans MP3
      files for structural errors: whether frames are in the expected places, whether
      frame headers are correct, and whether those headers remain consistent through the
      file. The project ships both a Windows Explorer-like graphical program and mpck,
      the cross-platform command-line program for Windows, Linux, and Unix-like systems.
  usage:
    - >
      The changelog shows a long incremental history rather than a broad ecosystem
      story: the early releases added CRC handling, filename checks, Windows support,
      and the rename to mpck; later versions added XML output, mmap-based scanning for
      large files, recursive scanning fixes, files larger than 4 GB, APE tag support,
      and corrected exit codes. In practice, mpck is used as a validator for MP3
      collections or ingestion pipelines, where a CLI that exits usefully and can report
      bad files is more convenient than a desktop checker.
related-packages:
  - id: brew:mp3val
    reason: >
      Choose MP3val when you need MPEG audio validation with an optional repair mode for
      fixable stream, tag-placement, CRC, and VBR-header problems rather than mpck's
      primarily reporting-oriented checks.
    rel: alternative
    sources:
      - https://checkmate.gissen.nl/
      - https://mp3val.sourceforge.net/docs/manual.html
