config-file-location:
  macos:
    - ~/Library/Application Support/Leader Key/config.json
credentials-file-location: null
history:
  adoption-history:
    - >
      Leader Key developed a macOS user base around keyboard-driven application
      launching and automation. Its official repository documents Homebrew installation,
      a human-editable JSON configuration, URL-scheme automation, and integrations with
      tools such as Alfred, Raycast, shell scripts, Keyboard Maestro, and
      Karabiner-Elements.
    - >
      The maintainer later stated that Tuna had surpassed Leader Key and would receive
      the main development focus, while Leader Key would remain free and open source.
  package-nerd-significance:
    - >
      Leader Key translates Vim's leader-key concept into a native macOS launcher: a
      single activation shortcut opens a deterministic tree of subsequent keystrokes.
      Its plain JSON configuration and URL scheme also make it unusually scriptable for
      a graphical launcher.
  project-history:
    - >
      Mikkel Malmberg created Leader Key as a macOS launcher inspired by Vim's leader
      key, Raycast, and a multi-key Karabiner setup. It favors memorable, nested key
      sequences over fuzzy-searching application names or assigning many unrelated
      global shortcuts.
  related-projects:
    - Tuna is the maintainer's newer launcher and incorporates Leader Key functionality.
    - Raycast and Alfred are general macOS launchers with which Leader Key can integrate.
    - Karabiner-Elements can provide advanced trigger-key mappings.
  sources:
    - https://github.com/mikker/LeaderKey
    - https://github.com/mikker/LeaderKey/wiki
    - >
      https://raw.githubusercontent.com/mikker/LeaderKey/refs/heads/main/Leader%20Key/UserConfig.swift
  summary:
    - >
      Leader Key is an open-source macOS application launcher that executes
      applications, commands, folders, and URLs through predictable nested keyboard
      sequences.
  timeline:
    - The project established a Homebrew-installable, JSON-configured macOS launcher.
    - >
      The maintainer subsequently shifted primary attention to Tuna while keeping Leader
      Key open source.
  usage:
    - >
      Users choose a leader shortcut, then define a hierarchy of follow-up keys and
      actions in the settings UI or config.json. Sequences can launch applications, open
      folders or URLs, execute commands, and control windows.
    - >
      The `leaderkey://` URL scheme can activate or hide the launcher, navigate a
      sequence, reload configuration, reveal config.json in Finder, and open settings.
