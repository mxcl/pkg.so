history:
  adoption-history:
    - >
      Distribution has spread through Rust and system package channels: the README
      documents Cargo installation, precompiled binary installation, Homebrew,
      Nix/NixOS, and Arch Linux packaging, while source_facts also lists Scoop
      packaging.
  package-nerd-significance:
    - >
      For package-manager users, CodeSnap is a compact example of a modern Rust CLI that
      turns a social or documentation task into a local, reproducible binary. Its
      significance is strongest in the cross-packaging story: Cargo, Homebrew, Nix,
      Arch, and Scoop all make it reachable without a web app.
  project-history:
    - >
      The project README describes CodeSnap as a pure Rust renderer that generates
      snapshots through a graphics engine rather than network or browser-based
      rendering. It provides both a CLI and a Rust library API.
  related-projects:
    - >
      Related projects include syntect for syntax highlighting, Sublime Text syntax
      definitions and themes, Rust Cargo packaging, and web/editor tools that create
      code images for documentation or social sharing.
  sources:
    - https://github.com/codesnap-rs/codesnap
    - https://codesnap-docs.netlify.app/
    - https://formulae.brew.sh/api/formula/codesnap.json
  summary:
    - >
      CodeSnap is a Rust command-line tool and library for rendering code snippets into
      visual snapshots such as PNG, SVG, HTML, and text-style outputs.
  timeline:
    - '2020s: Project develops as a Rust CLI and library for code snapshots.'
    - '2020s: README documents Cargo, Arch Linux, Nix/NixOS, and Homebrew installation paths.'
    - '2026: Homebrew formula distributes CodeSnap 0.13.4.'
  usage:
    - >
      Users run codesnap against a source file to generate an output image or use the
      Rust library builder API inside another project. The tool supports themes, line
      numbers, watermarks, backgrounds, scaling, breadcrumbs, clipboard integration, and
      multiple output formats.
