id: brew:batik
display-name: Apache Batik
repo: https://github.com/apache/xmlgraphics-batik
docs:
  - https://xmlgraphics.apache.org/batik
  - https://xmlgraphics.apache.org/batik/javadoc
  - https://xmlgraphics.apache.org/batik/tools
  - https://xmlgraphics.apache.org/batik/using
config-file-location:
  unix:
    - ~/.batik/preferences.xml
    - ~/.batik/__svgbrowser.policy
credentials-file-location: null
history:
  adoption-history:
    - >
      Batik has persisted because SVG rendering and conversion are infrastructure needs.
      The Apache site explicitly points to real-life projects and products using Batik,
      and package metadata shows it shipped through Homebrew, Debian and Ubuntu as
      libbatik-java, Fedora, MacPorts, Nix, and openSUSE.
    - >
      Recent Apache news shows active maintenance through version 1.19 on May 6, 2025,
      following 1.18 in 2024 and earlier bug-fix and security releases.
  package-nerd-significance:
    - >
      Batik is important package-manager archaeology: a pre-Rust, pre-Go, Java-era
      graphics toolkit that still matters because SVG conversion has long tails in build
      systems, documentation pipelines, desktop Java applications, and distribution
      repositories.
    - >
      It is also a reminder that command-line packages can be wrappers around
      substantial library ecosystems. Installing batik pulls in decades of XML, SVG,
      Java2D, and Apache XML Graphics history, not just one executable.
  project-history:
    - >
      Batik emerged during the early SVG standardization era. A W3C www-svg mailing-list
      announcement from December 4, 2000 announced the beta release of Batik 1.0 as an
      Apache Batik team project and described it as a Java 2D based SVG toolkit.
    - >
      The current Apache project page describes the same core ambition: provide reusable
      Java modules for SVG parsing, generation, DOM support, viewing, scripting, and
      transcoding, plus a full SVG browser implementation to validate interoperability.
    - >
      Batik remains part of Apache XML Graphics. Its GitHub repository is an Apache
      mirror for the official project, while the canonical documentation and release
      news live under xmlgraphics.apache.org.
  related-projects:
    - Apache XML Graphics is Batik's project family.
    - Apache FOP is related through vector/PDF transcoding support noted by the Batik site.
    - W3C SVG is the specification family Batik implements.
  sources:
    - https://github.com/apache/xmlgraphics-batik
    - https://lists.w3.org/Archives/Public/www-svg/2000Dec/0000.html
    - https://xmlgraphics.apache.org/batik/
    - source_facts.package-manager
  summary:
    - >
      Apache Batik is a long-running Java toolkit for rendering, generating,
      manipulating, viewing, and transcoding SVG. In package-manager terms it is both a
      library stack and a set of command-line tools such as the rasterizer, Squiggle SVG
      browser, SVG pretty-printer, and TTF-to-SVG converter.
  timeline:
    - '2000: Batik 1.0 beta announced on the W3C www-svg mailing list.'
    - '2020: Apache Batik 1.13 released as a bug-fix release.'
    - '2022: Apache Batik 1.15 and 1.16 released with security fixes noted in project news.'
    - '2024: Apache Batik 1.18 released.'
    - '2025: Apache Batik 1.19 released as a bug-fix release.'
  usage:
    - >
      Developers use Batik from Java applications to parse, render, generate,
      manipulate, and transcode SVG, including server-side conversion to formats such as
      PNG, JPEG, TIFF, EPS, and PDF when paired with related Apache components.
    - >
      CLI users encounter it through tools such as batik-rasterizer, batik-squiggle,
      batik-svgpp, batik-slideshow, and batik-ttf2svg.
related-packages:
  - id: brew:fop
    reason: >
      Apache FOP works directly with Batik for SVG handling and provides the PDF and EPS
      transcoders used by Batik workflows.
    rel: adjacent_workflow
    sources:
      - https://xmlgraphics.apache.org/batik/faq.html
      - https://xmlgraphics.apache.org/fop/
