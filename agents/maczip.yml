history:
  adoption-history:
    - >
      The utility evolved from eZip into MacZip while retaining a focus on native macOS
      integration. Later releases added Finder services and an extension, Apple Silicon
      and Big Sur support, Quick Look improvements, accessibility work, and integration
      with the vendor's QSpace file manager.
    - >
      Its Homebrew cask makes the vendor-distributed DMG accessible through a common
      macOS package workflow.
  package-nerd-significance:
    - >
      MacZip is notable as a graphical counterpart to command-line archivers: it exposes
      archive browsing, partial extraction, preview, encryption, Finder integration, and
      multi-format handling through a native application.
    - >
      The eZip-to-MacZip rename is relevant to package tracking because the current
      product identity differs from the historical name still present in its official
      domain.
  project-history:
    - >
      MacZip began under the name eZip as a macOS archive-management application.
      Version 2.0, released in 2020, renamed it MacZip and added support for macOS Big
      Sur and Apple Silicon.
    - >
      Subsequent releases expanded Finder integration, encryption services, archive
      preview, permissions controls, split-volume handling, and compatibility with
      QSpace.
  related-projects:
    - >
      QSpace and QSpace Pro are file-manager products from the same vendor with which
      MacZip integrates.
    - eZip is the former name of MacZip.
  sources:
    - 'Official product page and release history: https://ezip.awehunt.com/'
  summary:
    - >
      MacZip, formerly eZip, is a native macOS utility for opening, browsing, creating,
      modifying, previewing, encrypting, and extracting archive files.
  timeline:
    - '2020: Version 2.0 renamed eZip to MacZip and added Big Sur and Apple Silicon support.'
    - >
      2021: Versions 2.1 and 2.2 added Finder integration, encryption services,
      permissions controls, and broader archive handling.
    - '2022: Version 2.3 improved split-volume and decompression reliability.'
    - >
      2024: Version 2.4 improved Quick Look, Finder-extension behavior, compression
      preferences, and QSpace compatibility.
  usage:
    - >
      Users can open archives without extracting everything, preview contents with Quick
      Look, extract selected entries, create or encrypt archives, and invoke operations
      through Finder services or the Finder extension.
    - >
      The application stores user preferences, but its official documentation does not
      publish their on-disk location. It does not require a documented credentials file.
