history:
  adoption-history:
    - >
      Petrichor reached its first stable release in August 2025 after four alpha and
      four beta builds tested with community feedback.
    - >
      The project distributes signed macOS releases directly and documents Homebrew cask
      installation, making it convenient for package-managed Mac setups. It remains a
      hobby project developed without ads or a paid tier.
  package-nerd-significance:
    - >
      Petrichor serves users who maintain local, metadata-rich music collections and
      want streaming-service-style discovery and library views without making cloud
      streaming the default.
    - >
      Its native Swift and SwiftUI implementation, SQLite-backed library, broad codec
      support, Homebrew installation, and explicit privacy model make it interesting to
      Mac software and self-managed-media enthusiasts.
  project-history:
    - >
      Kushal Pandya created Petrichor to address the lack of a simple offline macOS
      player offering conveniences associated with streaming applications, while also
      learning Swift and macOS development.
    - >
      The application grew from its 2025 stable release into a broader local-library
      player with smart playlists, gapless playback, equalization, spatial audio,
      AirPlay output, internet radio, and optional Last.fm scrobbling.
  related-projects:
    - CrescendoKit
    - FFmpeg
    - TagLib
    - SQLite
    - Last.fm
  sources:
    - 'Official changelog: https://petrichor.page/changelog/'
    - 'Official repository README: https://github.com/kushalpandya/Petrichor'
    - 'Official user guide: https://github.com/kushalpandya/Petrichor/wiki'
    - 'Official website: https://petrichor.page/'
  summary:
    - >
      Petrichor is a native, open-source macOS music player centered on offline
      libraries and metadata-driven organization.
  timeline:
    - >
      2025-08-24: Petrichor 1.0.0 became the first stable release after eight prerelease
      builds.
    - '2025-09: The 1.1 series refreshed the interface and improved large-library performance.'
    - >
      2026: The official site documented an expanded feature set including internet
      radio, smart playlists, AirPlay, and a new in-house audio engine.
  usage:
    - >
      Users add one or more music folders; Petrichor scans supported files, extracts
      metadata and artwork, and builds a local SQLite-backed library.
    - >
      The player supports library browsing by artists, albums, genres, years, decades,
      and composers, plus playlists, search, a queue, an equalizer, lyrics, and optional
      online enhancements.
    - >
      Last.fm authorization occurs on Last.fm's website. Petrichor retains only the
      resulting session key and does not receive the user's Last.fm password.
