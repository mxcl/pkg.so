credentials-file-location: null
history:
  adoption-history:
    - >
      The official EPICS site describes a collaboration spanning many projects across
      disciplines, sizes, and continents. Historical EPICS material records the early
      LANL-ANL collaboration, 1992 participation by LBL, SSCL, and CEBAF, and later
      commercial licensing of EPICS Release 3.8.
    - >
      Package adoption follows EPICS Base's role as a foundational scientific-control
      dependency: the supplied source metadata lists Homebrew, Debian, and Ubuntu
      package names, while the official repository documents the portable branch and
      release structure needed by downstream users.
  package-nerd-significance:
    - >
      For package maintainers, EPICS Base is significant because it is a long-lived
      scientific infrastructure package with many executables, C/C++ libraries, Perl
      tooling, architecture-specific install paths, and downstream modules. Its branch
      history, tagged releases, and broad operating-system support make it a classic
      example of packaging research-facility infrastructure rather than a single small
      CLI.
  project-history:
    - >
      EPICS grew out of accelerator control-system work at Los Alamos National
      Laboratory and Argonne National Laboratory. Official historical material describes
      GTACS, the Ground Test Accelerator Control System, as the immediate predecessor
      and explains that the EPICS name was adopted as the LANL and ANL collaboration
      generalized the software for multi-lab use.
    - >
      The EPICS repository documentation says current and past EPICS Base versions are
      maintained in the same GitHub repository, with EPICS 7 development on the 7.0
      branch and older branches for 3.13, 3.14, 3.15, and 3.16. The project continues to
      release EPICS Base as the central core of the toolkit.
  related-projects:
    - >
      EPICS Base is related to EPICS 7 modules, Channel Access, PV Access, IOC
      applications, softIOC, areaDetector, StreamDevice, and the wider EPICS
      collaboration software ecosystem.
  sources:
    - https://docs.epics-controls.org/en/latest/
    - >
      https://docs.epics-controls.org/en/latest/contributing/HowToWorkWithTheEpicsRepository.html
    - https://epics-controls.org/
    - https://epics.anl.gov/EpicsDocumentation/EpicsGeneral/epics_success.html
    - https://epics.anl.gov/docs/APS2014/01-Introduction-to-EPICS.pdf
    - https://github.com/epics-base/epics-base
    - source_facts.package-manager
  summary:
    - >
      EPICS Base is the C/C++ core of the Experimental Physics and Industrial Control
      System toolkit. EPICS provides software components and command-line tools for
      building distributed control systems used by particle accelerators, telescopes,
      large experiments, and industrial installations.
  timeline:
    - >
      1988: LANL hosted the Accelerator Automation Application Toolkit Workshop that
      shaped GTACS.
    - '1989: LANL and ANL teams met around the Advanced Photon Source control-system effort.'
    - >
      1991: EPICS was presented at ICALEPCS and became identified with the
      accelerator-control standard model.
    - '1992: LBL, SSCL, and CEBAF joined the EPICS collaboration.'
    - >
      2004: EPICS was released under the EPICS Open License according to official
      training material.
    - '2026: EPICS Base 7.0.10 was announced on the official EPICS site.'
  usage:
    - >
      EPICS Base users build the toolkit, create or run IOCs, and use Channel Access and
      PV Access tools to read, write, monitor, and serve process variables. The
      repository README shows a quick `make` build and a `softIoc` example, while the
      documentation indexes installation, IOC creation, database concepts, Channel
      Access commands, and system administration topics.
