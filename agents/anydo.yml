history:
  adoption-history:
    - >
      Any.do is offered across the web, native macOS and Windows applications, iOS and
      Android, smartwatches, browser extensions, and messaging or automation
      integrations. This broad platform coverage supports continuous task access rather
      than a desktop-only workflow.
  package-nerd-significance:
    - >
      The Homebrew Cask package gives macOS users a reproducible command-line
      installation path for a proprietary, account-oriented productivity application. It
      is representative of casks that package an Electron-distributed desktop client
      while the user's task data is synchronized through a hosted service.
  project-history:
    - >
      Official sources describe Any.do as a cross-platform productivity platform for
      personal, family, and team organization. The current product spans personal lists
      and reminders as well as shared boards, calendars, automations, roles, and
      integrations.
  related-projects:
    - >
      Any.do integrates with services including Gmail, WhatsApp, Slack, Zapier, Make,
      and calendar providers, according to its official help material.
  sources:
    - 'Official Help Center: https://support.any.do/en/'
    - >
      Official getting-started guide:
      https://support.any.do/en/articles/8609629-getting-started-with-any-do
    - 'source_facts.package-manager: brew-cask/anydo'
  summary:
    - >
      Any.do is a cross-platform task, reminder, calendar, and collaborative planning
      service. The packaged desktop application provides native access to the same
      synchronized productivity system available through its web and mobile clients.
  timeline:
    - >
      Desktop distribution: Any.do provides native applications for macOS and Windows
      alongside its web and mobile clients.
    - >
      2026: The official getting-started guide describes Free, Premium, Family, and
      Workspace modes and an expanded collection of integrations.
  usage:
    - >
      People use Any.do to create tasks and lists, schedule reminders, plan through
      calendars and My Day, maintain grocery lists, and collaborate through shared
      family or workspace boards. An Any.do account is central to synchronizing this
      information among supported platforms.
