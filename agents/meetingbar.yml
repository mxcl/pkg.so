history:
  adoption-history:
    - >
      MeetingBar is distributed through the Mac App Store, direct disk images, and
      Homebrew Cask. Its official site presents it as a broadly installed macOS utility,
      while the public repository supports contributions, translations, and
      integrations.
    - >
      The application expanded from relying on calendars synchronized through macOS
      Calendar to also supporting a direct Google Calendar connection.
  package-nerd-significance:
    - >
      MeetingBar exemplifies the small, focused macOS menu-bar utility: it turns
      calendar metadata into a one-click launcher while remaining open source and
      package-manager installable.
    - >
      Its support for Shortcuts, AppleScript, global keyboard shortcuts, configurable
      link handling, and numerous conferencing URL formats makes it useful to
      automation-oriented macOS users.
  project-history:
    - >
      MeetingBar emerged as an open-source macOS utility focused on keeping the current
      or next online meeting visible in the menu bar. Early project documentation
      already emphasized macOS Calendar integration and recognition of numerous
      conferencing services.
    - >
      Subsequent development broadened calendar-provider handling, meeting-link
      detection, reminders, display controls, translations, and automation. Direct
      Google Calendar support complemented the original system-calendar workflow.
  related-projects:
    - >
      macOS Calendar can supply events from iCloud, Google, Exchange, Office 365, and
      other accounts.
    - >
      Google Meet, Zoom, Microsoft Teams, Webex, and many other meeting services are
      recognized from calendar-event links.
    - Apple Shortcuts and AppleScript provide automation surfaces.
  sources:
    - https://github.com/leits/MeetingBar
    - https://github.com/leits/MeetingBar/blob/master/README.md
    - https://github.com/leits/MeetingBar/wiki/FAQ
    - https://meetingbar.app/
    - source_facts.package-manager
  summary:
    - >
      MeetingBar is a free, open-source macOS menu-bar application that displays current
      and upcoming calendar events and opens detected conferencing links with one click.
  timeline:
    - >
      2020: The project's official wiki documented macOS Calendar integration and
      support for a broad range of meeting services.
    - >
      2021: The project publicly discussed direct Google Calendar integration as an
      alternative to system calendar synchronization.
    - >
      Later releases: Direct Google Calendar access, expanded meeting-service
      recognition, reminders, and automation became part of the application.
  usage:
    - >
      After onboarding, users select macOS Calendar or a direct Google Calendar
      connection and choose display and notification preferences. The menu-bar item then
      shows the current or next event and opens its meeting link.
    - >
      Users can filter events, select preferred browsers or native meeting applications,
      create ad-hoc meetings, configure reminders, and automate behavior with Shortcuts
      or AppleScript.
