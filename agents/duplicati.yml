history:
  adoption-history:
    - >
      Duplicati developed from a Duplicity-inspired backup client into an independent
      cross-platform system with a built-in web interface, scheduler, command-line
      tools, and a large range of remote-storage backends.
    - >
      Its availability on Windows, macOS, and Linux, permissive MIT licensing, broad
      cloud-provider support, and ability to run as a desktop tray application or
      long-running service have made it common in desktop, home-server, NAS, and
      self-hosted backup setups.
  package-nerd-significance:
    - >
      Duplicati is a prominent client-side encrypted backup tool in package ecosystems
      because it offers a graphical workflow and scheduler while remaining scriptable
      and open source.
    - >
      Its architecture is operationally important: backup definitions, application
      settings, logs, destination credentials, and encryption passphrases can reside in
      the server SQLite database, while each backup also has a rebuildable local
      database that indexes remote contents. Protecting and, where supported, encrypting
      the server database is therefore essential.
  project-history:
    - >
      Duplicati began as a backup client inspired by Duplicity and followed similar
      designs until 2008, after which the project developed its own storage format and
      architecture.
    - >
      The modern Duplicati 2 line provides encrypted, compressed, incremental backups
      through a web-based interface and command-line components. Development is
      maintained openly in the official `duplicati/duplicati` repository.
  related-projects:
    - Duplicity inspired Duplicati's early development, but the projects later diverged.
    - The separate `duplicati/documentation` repository supplies the current official manual.
    - >
      Duplicati's local per-backup databases act as indexes and caches; they can be
      reconstructed from remote backup data and are distinct from the server
      configuration database.
  sources:
    - https://docs.duplicati.com/
    - https://docs.duplicati.com/community-docs/community-docs-introduction
    - https://docs.duplicati.com/database-and-storage/the-server-database
    - https://github.com/duplicati/duplicati
  summary:
    - >
      Duplicati is a free, open-source backup client for encrypted, compressed,
      incremental backups to cloud services, remote servers, and local storage.
  timeline:
    - 'Before 2008: Duplicati began as a project inspired by Duplicity.'
    - "2008: The project started diverging from Duplicity's functionality and design."
    - >
      Duplicati 2 era: The project adopted its current web-interface, scheduler,
      server-database, and multi-backend architecture.
    - >
      2026: The active 2.x release line continues to ship stable, beta, and canary
      channels from the official GitHub repository.
  usage:
    - >
      Users define sources, filters, a destination, encryption, and a retention policy
      in the web UI, then run backups manually or with the built-in scheduler.
    - >
      Duplicati encrypts data before upload and supports destinations such as
      S3-compatible services, Backblaze B2, Dropbox, Google Drive, OneDrive, SFTP, FTP,
      and WebDAV.
    - >
      The `Duplicati-server.sqlite` file holds server configuration and may contain
      credentials and encryption passphrases. Its location can be overridden with
      `--server-datafolder` or `DUPLICATI_HOME`, and current documentation recommends
      protecting it with a settings-encryption key.
