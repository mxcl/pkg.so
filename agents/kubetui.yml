id: brew:kubetui
display-name: kubetui
repo: null
docs:
  - https://github.com/sarub0b0/kubetui#readme
config-file-location:
  unix:
    - $XDG_CONFIG_HOME/kubetui/config.yaml
    - ~/.config/kubetui/config.yaml
credentials-file-location: null
history:
  adoption-history:
    - >
      kubetui is a smaller project, but its packaging across Homebrew, Nix, pacman,
      winget, and zypper metadata shows the familiar path for Rust CLIs: publish
      prebuilt binaries, make the tool easy to install on developer workstations, and
      let terminal users avoid a browser dashboard.
  package-nerd-significance:
    - >
      kubetui sits in the same ecosystem as k9s and other terminal-first Kubernetes
      dashboards. It is package-nerd interesting because it is a modern Rust TUI
      distributed through several OS package managers, with features that overlap both
      kubectl workflows and full dashboard tools.
  project-history:
    - >
      The kubetui README describes the project as a TUI for developers and operators to
      access Kubernetes application and infrastructure information. The Rust crate
      metadata identifies the repository, MIT license, and keywords around Kubernetes,
      terminal UI, and monitoring.
  related-projects:
    - >
      Related tools include kubectl, k9s, kube-ps1, stern, kubetail, and Kubernetes
      Dashboard. kubetui is most directly comparable to terminal dashboards that trade
      web UI polish for fast keyboard-driven inspection.
  sources:
    - https://formulae.brew.sh/formula/kubetui
    - https://github.com/sarub0b0/kubetui
    - https://github.com/sarub0b0/kubetui/blob/main/Cargo.toml
    - https://github.com/sarub0b0/kubetui/releases
  summary:
    - >
      kubetui is a Rust terminal UI for monitoring and exploring Kubernetes resources.
      It packages a cluster browser, log viewer, filters, context selection, and
      resource inspection into a single terminal application.
  timeline:
    - '2025: Public issue activity and packaging metadata show active use and distribution.'
    - '2026: The v1.14.0 release highlighted a Node tab and column-aware filtering.'
    - >
      2026: Cargo metadata in the repository listed version 1.14.0 and Kubernetes TUI
      keywords.
  usage:
    - >
      The README documents browsing pods and container logs, inspecting nodes, watching
      ConfigMaps and Secrets, listing network resources, watching events, selecting
      arbitrary resources, changing contexts, and using a custom config file through
      --config-file.
related-packages:
  - id: brew:k9s
    reason: >
      Choose K9s when you want a more management-oriented Kubernetes terminal UI with
      resource editing, deletion, port forwarding, container shells, and related
      operational commands.
    rel: alternative
    sources:
      - https://github.com/sarub0b0/kubetui
      - https://github.com/derailed/k9s
  - id: brew:stern
    reason: >
      Use Stern alongside kubetui when you need a dedicated command for tailing and
      filtering logs across multiple Kubernetes pods and containers.
    rel: adjacent_workflow
    sources:
      - https://github.com/sarub0b0/kubetui#log-query
      - https://github.com/stern/stern
