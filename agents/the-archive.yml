history:
  adoption-history:
    - >
      The Archive emerged from the Zettelkasten.de community and was adopted by writers
      and personal-knowledge-management users seeking a dedicated Mac application for
      the Zettelkasten method. The publisher maintains a user forum, themes, plug-ins,
      help material, and an active release-notes archive.
    - >
      Homebrew offers The Archive as a cask, giving command-line-oriented Mac users a
      package-managed installation path alongside the publisher's direct download.
  package-nerd-significance:
    - >
      The Archive represents the plain-text, local-file branch of personal knowledge
      management: notes remain ordinary files rather than being locked in a proprietary
      database. Its combination of stable Zettel identifiers, search-based links,
      Markdown, themes, URL automation, and scripting appeals to users who want durable
      data and composable workflows.
  project-history:
    - >
      Sascha Fast and Christian Tietze conceived The Archive as a focused implementation
      of the Zettelkasten method, with programming led by Tietze. Development began in
      December 2016, a private beta followed in May 2017, and version 1.0 was released
      on March 15, 2018.
    - >
      The application was built in Swift around plain-text storage, rapid search, stable
      note identifiers, Markdown, tags, saved searches, themes, and writer-focused
      navigation. Later releases added dark mode, multiple tabs and windows, inline
      image previews, wiki-link conveniences, and plug-in support.
  related-projects:
    - >
      The Zettelkasten.de site documents the broader Zettelkasten method and hosts the
      user community.
    - >
      An official GitHub repository distributes community themes, but it is not the
      source repository for the proprietary application.
    - >
      The official help discusses migration from plain-text-oriented tools such as nvALT
      and DEVONthink exports.
  sources:
    - 'Official Zettelkasten overview: https://zettelkasten.de/overview/'
    - 'Official help: https://zettelkasten.de/the-archive/help/'
    - 'Official press kit: https://zettelkasten.de/the-archive/presskit/'
    - 'Official release notes: https://zettelkasten.de/the-archive/release-notes/'
    - source_facts.package-manager
  summary:
    - >
      The Archive is a macOS note-taking and personal-knowledge-management application
      designed specifically for plain-text Zettelkasten workflows.
  timeline:
    - '2016-12: Development began.'
    - '2017-05: Private beta started.'
    - '2018-03-15: The Archive 1.0 was released.'
    - '2018-08: Version 1.1 added live detection of external file changes and theme updating.'
    - '2019-08: Version 1.4 introduced multiple tabs and windows.'
    - '2021-02: The 1.6 release cycle added inline image previews.'
  usage:
    - >
      Choose a local archive directory and create plain-text notes carrying stable,
      commonly time-based Zettel identifiers.
    - >
      Use the Omnibar, full-text search, hashtags, saved searches, and double-bracket
      wiki links to find and connect notes without adopting a proprietary document
      format.
    - >
      Automate searches and note creation through thearchive:// URLs, customize the
      editor with themes, and extend newer releases with JavaScript-based plug-ins.
