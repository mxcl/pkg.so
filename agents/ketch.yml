history:
  adoption-history:
    - >
      The project targets both interactive terminal users and AI agents. Its documented
      structured output, stable exit codes, and MCP server mode make it suitable for
      scripted and agent-driven research workflows.
  package-nerd-significance:
    - >
      ketch packages several normally separate capabilities—search-provider access,
      source search, documentation lookup, readable-content extraction, crawling, and
      optional browser rendering—into a stateless Go executable. That makes it notable
      to users who prefer composable command-line tools without a resident service.
  project-history:
    - >
      ketch was developed as a fast, stateless research CLI. Its stated motivation was
      to replace per-provider SDK integration with one command interface and consistent
      output across multiple search and extraction backends.
  related-projects:
    - >
      The official documentation identifies Brave, DuckDuckGo, SearXNG, Exa, Firecrawl,
      and Keenable as web-search backends; Grep, Sourcegraph, and GitHub for source
      search; and Context7 for library documentation.
  sources:
    - https://chain.sh/ketch/
    - https://github.com/1broseidon/ketch#readme
  summary:
    - >
      ketch is a stateless command-line research tool built for humans and software
      agents. It searches the web and public source code, queries library documentation,
      and converts web pages or PDFs into structured Markdown or JSON.
  timeline:
    - >
      2026: The official project site presented ketch as a single-binary search and
      scraping tool for agents.
  usage:
    - >
      Typical uses include web research, extracting readable Markdown from pages,
      searching public code, querying library documentation, crawling sites, and feeding
      structured results to automation. Search providers that require authentication can
      be configured once and then used without passing credentials on every invocation.
