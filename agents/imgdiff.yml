config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption appears niche but visible: the repository has roughly 1.7k GitHub stars
      in repository metadata, and Homebrew publishes a formula for macOS users. Homebrew
      analytics for the formula show low install counts, which fits a developer-tooling
      utility used mainly inside visual test and image-comparison workflows.
  package-nerd-significance:
    - >
      imgdiff is package-nerd interesting because it is a tiny Go binary competing on
      startup simplicity and benchmark performance against heavier image-processing
      stacks. It represents the class of single-binary tools that package managers can
      expose for CI and screenshot-regression jobs without pulling in a larger
      application.
  project-history:
    - >
      The GitHub repository was created on 2020-12-12, and the v1.0.0 release was
      published the same day as an initial release with pre-built binaries. Follow-up
      releases in February and March 2021 fixed package-path and output-writing issues,
      after which the package remained a compact single-purpose visual comparison tool.
  related-projects:
    - >
      The README explicitly compares imgdiff with odiff. It also fits the broader
      visual-regression ecosystem around screenshot testing and pixel-diff utilities.
  sources:
    - https://formulae.brew.sh/formula/imgdiff
    - https://github.com/n7olkachev/imgdiff
    - https://github.com/n7olkachev/imgdiff/releases
  summary:
    - >
      imgdiff is a small Go command-line utility for pixel-by-pixel image comparison.
      Its public README frames the project as a faster response to odiff, another
      visual-diff tool used in image-regression and screenshot-testing workflows.
  timeline:
    - '2020-12-12: GitHub repository created and v1.0.0 initial release published.'
    - '2021-02-17: v1.0.1 fixed the package path.'
    - '2021-03-25: v1.0.2 fixed output writing.'
    - '2026: Homebrew formula metadata lists imgdiff as a pixel-by-pixel image difference tool.'
  usage:
    - >
      The README documents a CLI that accepts base, compare, and output image paths,
      with options for color-difference threshold, diff-image rendering, and
      layout-failure behavior. The intended use is direct image comparison rather than
      general image editing.
related-packages:
  - id: brew:odiff
    reason: >
      Choose odiff when you want a SIMD-first image-comparison tool with both a native
      CLI and a documented Node.js API; imgdiff's own README identifies it as the direct
      comparison target.
    rel: alternative
    sources:
      - https://github.com/n7olkachev/imgdiff
      - https://github.com/dmtrKovalenko/odiff
