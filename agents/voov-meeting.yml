history:
  adoption-history:
    - >
      Tencent reports that VooV Meeting is available in more than 100 countries and
      regions, positioning it as the international counterpart to Tencent Meeting for
      cross-region collaboration.
  package-nerd-significance:
    - >
      The Homebrew cask gives macOS administrators a package-managed installation path
      for a mainstream conferencing client that is otherwise distributed through
      Tencent's download center.
  project-history:
    - >
      Tencent launched Tencent Meeting/VooV in December 2019 and identified March 2020
      as the launch of the international VooV Meeting edition.
  related-projects:
    - >
      Tencent Meeting is the PRC version and is interoperable with VooV Meeting for
      supported meetings and features.
  sources:
    - >
      Tencent 2020 results material documenting the March 2020 international launch:
      https://static.www.tencent.com/uploads/2020/05/13/9a37a7c0c48137220311b26dfdc942ae.pdf
    - >
      Tencent Carbon Neutrality Target and Roadmap Report:
      https://static.www.tencent.com/attachments/TencentCarbonNeutralityTargetandRoadmapReport.pdf
    - 'Tencent product overview: https://www.tencent.com/products/tencent-meeting-voov-meeting/'
    - >
      VooV Meeting privacy policy describing Tencent Meeting interoperability:
      https://voovmeeting.com/df/en/privacy-policy.html
  summary:
    - >
      VooV Meeting is Tencent's international cloud video-conferencing client, providing
      meetings, screen sharing, whiteboards, host controls, virtual backgrounds, and
      cross-platform participation.
  timeline:
    - '2019: Tencent Meeting/VooV conferencing product launched in December.'
    - '2020: International edition VooV Meeting launched in March.'
  usage:
    - >
      Users host or join meetings from desktop, mobile, tablet, or the web. Common uses
      include remote work, education, finance, government events, and telemedicine.
