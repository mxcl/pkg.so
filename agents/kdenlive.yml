id: cask:kdenlive
display-name: Kdenlive
repo: https://invent.kde.org/multimedia/kdenlive
docs:
  - https://docs.kdenlive.org/
  - https://docs.kdenlive.org/en/getting_started/configure_kdenlive/configuration_info.html
config-file-location:
  linux:
    - ~/.config/kdenliverc
    - ~/.config/kdenlive-appimagerc
  macos:
    - ~/Library/Preferences/kdenliverc
  windows:
    - '%LocalAppData%/kdenliverc'
credentials-file-location: null
history:
  adoption-history:
    - >
      Kdenlive evolved from a small Linux-oriented project into an official KDE
      application. A crowdfunding campaign launched in 2012 reached its target by the
      end of 2014, and KDE formally adopted Kdenlive in 2015.
    - >
      The project subsequently expanded its cross-platform ambitions. A Windows version
      was announced in 2016, while current official materials support Linux, Windows,
      macOS, and BSD.
  package-nerd-significance:
    - >
      Kdenlive is a major packaged open-source creative application built from several
      established components: Qt and KDE libraries provide the interface, MLT supplies
      the editing framework, and FFmpeg handles broad media decoding and encoding.
      Frei0r, Movit, LADSPA, and SOX extend its effects and audio capabilities.
    - >
      For maintainers and advanced users, Kdenlive demonstrates the integration and
      compatibility work involved in shipping a full non-linear editor across desktop
      platforms, codec stacks, plugin systems, and hardware configurations.
  project-history:
    - >
      Jason Wood launched Kdenlive in 2003 with the 0.2.3 release. After a period of
      inactivity, Jean-Baptiste Mardelle joined in 2005 and became a central maintainer
      as development resumed.
    - >
      The project completed a major KDE 3-to-KDE 4 refactoring in 2008 and began another
      migration toward KDE Frameworks 5 in 2011. A later timeline rewrite was planned in
      2018 and distributed in 2019, providing a foundation for continued feature
      development.
  related-projects:
    - 'KDE: the community under which Kdenlive is developed.'
    - "MLT: Kdenlive's multimedia editing framework."
    - 'FFmpeg: the underlying decoding and encoding stack.'
    - 'Frei0r and Movit: video-effects technologies used through the Kdenlive stack.'
    - >
      Glaxnimate: an animation application that Kdenlive can integrate with for motion
      graphics.
  sources:
    - https://apps.kde.org/kdenlive/
    - https://docs.kdenlive.org/
    - https://kdenlive.org/
    - https://kdenlive.org/about/
  summary:
    - >
      Kdenlive is KDE's free and open-source non-linear video editor, combining a Qt/KDE
      interface with the MLT and FFmpeg multimedia stack.
  timeline:
    - '2003: Jason Wood launched Kdenlive with release 0.2.3.'
    - '2005: Jean-Baptiste Mardelle joined the revived project.'
    - '2008: The KDE 3-to-KDE 4 refactoring was completed.'
    - '2012: A development crowdfunding campaign began.'
    - '2015: Kdenlive became an official KDE application.'
    - '2016: A Windows version and broader cross-platform direction were announced.'
    - '2019: The refactored timeline code was distributed.'
  usage:
    - >
      Kdenlive supports timeline-based editing, multi-track audio and video, proxy
      media, effects, transitions, titles, subtitles, color work, asset organization,
      automatic backups, and rendering to numerous media formats. It is used for work
      ranging from simple edits to complex multi-sequence productions.
