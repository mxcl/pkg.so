history:
  adoption-history:
    - >
      Softblade positions MQTT.fx for developers, industrial IoT departments, and
      hobbyists. Its reusable broker profiles and graphical inspection tools support
      both development and production testing; the reviewed sources do not quantify
      adoption.
  package-nerd-significance:
    - >
      MQTT.fx packages protocol debugging into a desktop application with a bundled Java
      runtime. Its public payload-decoder extension project provides an integration
      surface even though an official public repository for the complete application was
      not verified.
  project-history:
    - >
      According to Softblade, MQTT.fx was introduced to the community in 2014. The
      product developed into a commercial desktop MQTT client with MQTT 5 support,
      scripted messaging, and Sparkplug tooling.
  related-projects:
    - 'mqttfx-payload-decoders: the official extension project for displaying message payloads.'
  sources:
    - '[Official installation manual](https://mqttfx-manual.softblade.net/installation.html).'
    - '[Official payload decoders](https://github.com/Jerady/mqttfx-payload-decoders).'
    - '[Official vendor overview](https://www.softblade.de/).'
  summary:
    - >
      MQTT.fx is a graphical MQTT client used to test broker connections, publish and
      subscribe to messages, and diagnose IoT communication.
  timeline:
    - '2014: MQTT.fx is introduced to the community.'
  usage:
    - >
      Create a connection profile with the broker address and required authentication,
      then publish or subscribe to topics. The client also offers payload decoding,
      logging, and JavaScript automation.
