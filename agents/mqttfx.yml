    - >
      Credentials location: low confidence for an absolute path. The official profile
      documentation states that profiles and settings share mqttfx-config.xml and
      exported profiles may contain credentials; no platform-specific location was
      verified.
    - >
      [Official MQTT.fx manual](https://mqttfx-manual.softblade.net/index.html),
