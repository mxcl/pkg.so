config-file-location:
  macos:
    - ~/Library/Application Support/Nimble Commander/Config
    - ~/Library/Application Support/Nimble Commander/State
    - ~/Library/Saved Application State/info.filesmanager.Files.savedState
    - ~/Library/Preferences/info.filesmanager.Files.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      The application developed from a focused dual-pane file manager into a broader
      power-user tool with archives, remote protocols, tabs, batch renaming, an internal
      viewer, external tools, and an integrated terminal. In 2024 it became completely
      free and open source.
  package-nerd-significance:
    - >
      Nimble Commander belongs to the orthodox file-manager tradition: two panels,
      keyboard-oriented navigation, explicit selection, and close integration with
      terminals and remote filesystems. It is notable to package users as a native macOS
      alternative to classic tools such as Midnight Commander and Total Commander.
  project-history:
    - >
      Michael Kazakov first released the application in May 2013. Early releases added a
      viewer, FTP and SFTP support, tabs, remote connections, administrative operations,
      and a terminal. Version 1.1.2 adopted the Nimble Commander name in June 2016.
  related-projects:
    - >
      Midnight Commander and Total Commander are related through the orthodox dual-pane
      file-manager model, although they are separate projects.
  sources:
    - https://github.com/mikekazakov/nimble-commander/blob/main/Docs/Help.md
    - https://magnumbytes.com/
    - https://magnumbytes.com/whats-new/
  summary:
    - >
      Nimble Commander is a native dual-pane file manager for macOS, designed for fast
      keyboard-driven filesystem work and influenced by classic orthodox file managers.
  timeline:
    - '2013: Version 0.1.0 was released.'
    - "2016: Version 1.1.2 changed the application's name to Nimble Commander."
    - '2024: Version 1.6.0 made the project completely free and open source.'
  usage:
    - >
      Users navigate and operate on files in two panels, browse archives, connect to
      FTP, SFTP and WebDAV resources, batch-rename items, invoke external tools, and use
      an integrated terminal. The Mac App Store build is sandboxed; the standalone build
      additionally provides features such as Admin Mode and the terminal.
