config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      cfnctl is a niche infrastructure tool rather than a broad AWS standard utility.
      Official distribution is through GitHub releases, and the package metadata in this
      batch shows it packaged in Homebrew.
    - >
      Its adoption story is best read as package-manager convenience for
      CloudFormation-heavy users who want plan/apply style stack operations without
      switching their template language.
  package-nerd-significance:
    - >
      cfnctl is interesting to package people because it is a small single-purpose CLI
      that imports the workflow vocabulary of one infrastructure tool into another
      ecosystem. That kind of tool often lives or dies by whether it is easy to install
      as a binary.
    - >
      The Homebrew formula matters here: it turns a GitHub-release-only CloudFormation
      helper into a one-command install for macOS operators.
  project-history:
    - >
      The official repository was created in September 2021 and frames the tool around a
      specific workflow problem: teams that like Terraform's CLI experience but are
      required to use CloudFormation. The README describes the project as early in
      development and explicitly lists missing features such as large-template S3 upload
      and drift detection.
    - >
      The first public GitHub releases in March 2023 were v0.1.0 and v0.1.1. The README
      continues to invite feature requests and pull requests and notes planned terminal
      UI work around the Charm stack.
  related-projects:
    - AWS CloudFormation is the stack system cfnctl operates against.
    - Terraform is the workflow model named directly by the README.
    - >
      Charm's Bubble Tea, Lip Gloss, and Huh are listed in the README as planned
      terminal UI migration targets.
  sources:
    - https://api.github.com/repos/rogerwelin/cfnctl
    - https://github.com/rogerwelin/cfnctl
    - https://github.com/rogerwelin/cfnctl#readme
    - https://formulae.brew.sh/api/formula/cfnctl.json
    - https://api.github.com/repos/rogerwelin/cfnctl/releases
  summary:
    - >
      cfnctl is a Go command-line tool that brings a Terraform-like workflow to AWS
      CloudFormation. Its README presents familiar commands such as apply, plan,
      destroy, output, and validate for users who still need to manage CloudFormation
      stacks.
  timeline:
    - '2021: The rogerwelin/cfnctl repository is created on GitHub.'
    - '2023: v0.1.0 and v0.1.1 are published as GitHub releases.'
    - '2026: The README still describes planned improvements and early-development gaps.'
  usage:
    - >
      The documented commands are apply, plan, destroy, output, validate, and version.
      The README example uses `cfnctl apply --template-file mycfntmpl.yaml
      --auto-approve`.
    - >
      Because the official README does not document a persistent application config file
      or credentials file, those locations are left null. AWS credential handling may be
      inherited from the AWS SDK or environment, but that is not named in the project
      documentation used here.
related-packages:
  - id: brew:cfn-lint
    reason: >
      Use cfn-lint before cfnctl to validate CloudFormation templates against AWS
      resource schemas and additional rules before planning or applying the stack.
    rel: adjacent_workflow
    sources:
