history:
  adoption-history:
    - >
      The official site says Focus has been used by tens of thousands of people. Its
      feature set broadened from website and application blocking into schedules,
      Pomodoro sessions, statistics, scripting, profiles, and parental-control-style
      locking.
    - >
      Focus added Setapp support in 2017. The macOS package is also available as a
      Homebrew cask, placing the commercial application in two package-oriented Mac
      distribution channels.
  package-nerd-significance:
    - >
      Focus is a long-running example of a proprietary macOS utility made reproducibly
      installable through Homebrew Cask. Its URL scheme, AppleScript support,
      command-line controls, and session hooks also make it amenable to automation-heavy
      workflows.
  project-history:
    - >
      Focus 1.0 was released in December 2014 as a native Mac distraction blocker.
      Successive 1.x releases expanded browser compatibility, scheduling, allow lists,
      Pomodoro workflows, password protection, scripting, statistics, and Apple-silicon
      support.
    - >
      Focus 2, released in 2023, was a complete rewrite that introduced profiles, a
      redesigned menu-bar interface, unlock codes, and revised statistics. Later
      releases added multiple simultaneously active profiles and overnight schedules.
  related-projects:
    - >
      The official site identifies Think Machine as another product from the same
      software studio.
  sources:
    - 'Official changelog: https://heyfocus.com/changelog/'
    - 'Official documentation: https://heyfocus.com/docs/'
    - 'Official product site: https://heyfocus.com/'
    - source_facts.package-manager identifies the Homebrew cask.
  summary:
    - >
      Focus is a commercial macOS productivity application that blocks distracting
      websites and applications. It supports timed or scheduled sessions, Pomodoro
      cycles, profiles, statistics, scripting, and enforcement modes designed to make
      sessions difficult to bypass.
  timeline:
    - '2014: Focus 1.0 received its first major release.'
    - >
      2017: Added Setapp support, password protection, breaks, statistics, and expanded
      automation features across several releases.
    - '2021: Added Apple-silicon and macOS Big Sur support.'
    - '2023: Focus 2 shipped as a complete rewrite with profiles and a new menu-bar experience.'
    - '2025: Added multiple active profiles and further profile-management improvements.'
  usage:
    - >
      Create profiles containing the websites and applications to block, then start a
      timed session, Pomodoro cycle, or recurring schedule from the menu bar. Locked
      Mode or password protection can prevent premature changes, while scripting hooks
      can coordinate Focus sessions with other Mac applications.
