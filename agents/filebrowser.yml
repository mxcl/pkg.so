history:
  adoption-history:
    - >
      File Browser's adoption came from a simple niche: self-hosters, homelab users, and
      small teams wanted a browser-based file manager without deploying a full groupware
      or storage platform.
    - >
      Its availability in Homebrew, Alpine, MacPorts, and Nix reflects that it is useful
      both as a local developer utility and as a small server component in Unix-like
      environments.
    - >
      The maintenance-only status is also part of its adoption story: the project
      reached a stable product shape, so package managers mostly carry it as dependable
      infrastructure rather than a fast-moving feature app.
  package-nerd-significance:
    - >
      File Browser is a neat package-manager specimen because it turns what could be a
      pile of web-app dependencies into a single installed executable.
    - >
      It also represents the self-hosted Go-binary pattern common in Homebrew and Nix:
      portable server, minimal runtime dependencies, easy service wrapping, and a
      config/database file that package maintainers need to account for.
  project-history:
    - >
      The upstream repository was created in 2015 and describes the project as a web
      file browser. The README frames the goal as create-your-own-cloud software: a
      server-side binary directed at a filesystem path and exposed through a web
      interface.
    - >
      Versioned tags show the project reaching v1.0.0 in 2017 and v2.0.0 in 2019, with
      the v2 series becoming the long-lived packaging target for most users.
    - >
      The README says File Browser is a finished product and is in maintenance-only
      mode, with maintainers focusing on bug triage, security issues, and review of
      bug-fix pull requests rather than planned new features.
  related-projects:
    - >
      File Browser sits near self-hosted file managers, WebDAV/SFTP front ends, and
      single-binary Go server tools.
    - >
      It is often paired with system service managers, reverse proxies, and container
      runtimes rather than with a larger application framework.
  sources:
    - https://github.com/filebrowser/filebrowser
    - https://github.com/filebrowser/filebrowser/releases
    - https://raw.githubusercontent.com/filebrowser/filebrowser/master/README.md
    - https://filebrowser.org/
    - https://filebrowser.org/installation
  summary:
    - >
      File Browser is a self-hosted web file manager that serves a chosen directory
      through a browser UI for uploading, deleting, previewing, editing, and sharing
      files.
    - >
      Its package-manager appeal is that it compresses a useful private-cloud pattern
      into a single Go binary: install it, point it at a path, and run a small web
      server.
  timeline:
    - '2015: Upstream GitHub repository created.'
    - '2017: v1.0.0 tag committed.'
    - '2019: v2.0.0 tag committed.'
    - '2020: v2.6.x releases published in the long-running v2 line.'
    - '2026: README states the project is a finished product in maintenance-only mode.'
  usage:
    - >
      Typical use is to install File Browser, choose the root directory to expose,
      configure a database and settings, and run the web server behind local
      authentication or a reverse proxy.
    - >
      Users choose it when they need a quick file-management UI for a server directory,
      a small replacement for ad hoc SFTP access, or a browser-accessible drop zone for
      local infrastructure.
    - >
      The operational model is intentionally compact: one binary, a database file for
      persistent state, static web assets in the binary, and command-line/config
      settings for binding, root path, and users.
related-packages:
  - id: brew:caddy
    reason: >
      Use Caddy in front of File Browser to follow upstream's end-of-life guidance with
      a reverse proxy and automatic HTTPS; configure an independent authentication layer
      as well.
    rel: adjacent_workflow
    sources:
      - https://github.com/filebrowser/filebrowser
      - https://caddyserver.com/docs/quick-starts/reverse-proxy
      - https://caddyserver.com/docs/automatic-https
