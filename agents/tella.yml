  summary:
    - >
      Tella is a screen-recording, video-editing, hosting, and sharing service. Its
      macOS application captures screen, camera, microphone, and system audio while
      keeping visual sources separate for later editing.
  timeline:
    - '2023: Tella documents its browser recorder and version 3.0 of its Chrome extension.'
    - >
      2026: Tella offers native macOS and Windows clients alongside its browser recorder
      and Chrome extension.
  usage:
    - >
      Users record their screen, camera, microphone, and optionally system audio;
      arrange or edit the resulting tracks; then share a hosted link, embed the video,
      or export a file. The native Mac client supports background upload, separate
      streams, clip-based recording, custom-area capture, and system-audio capture.
