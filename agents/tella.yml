history:
  adoption-history:
    - >
      Tella expanded from a browser-based asynchronous-video tool into a cross-platform
      service with a Chrome extension and native macOS and Windows applications. The
      product targets people producing demonstrations, tutorials, sales videos,
      educational material, and asynchronous team updates.
    - >
      Its workflow combines capture, cloud upload, editing, hosting, link sharing, and
      export, placing it in the polished business-video segment between simple
      operating-system recorders and traditional nonlinear editors.
  package-nerd-significance:
    - >
      The macOS cask provides a native capture client for a cloud-centered editing and
      hosting service. It is especially relevant to package users who need system-audio
      capture and separate screen and camera streams, capabilities that browser-only or
      built-in macOS recorders may not provide in the same workflow.
  project-history:
    - >
      By 2023, Tella publicly described itself as a browser-based asynchronous-video
      application with screen, camera, and audio recording plus a Chrome extension. It
      subsequently added native applications for macOS and Windows.
    - >
      The current product combines multi-track capture with layouts, captions,
      transcript-based editing, audio cleanup, hosting, analytics, team collaboration,
      and high-resolution export. Tella maintains an extensive official changelog
      documenting its continuing development.
  related-projects:
    - Tella web recorder
    - Tella Chrome extension
  sources:
