history:
  adoption-history:
    - >
      DEVONagent Pro is the full-featured edition in the DEVONagent family.
      DEVONtechnologies also offers lighter menu-bar editions, while Pro targets
      sustained research workflows requiring simultaneous sources, post-processing,
      archiving, and automation.
  package-nerd-significance:
    - >
      For package-manager users, DEVONagent Pro is a notable example of a long-lived,
      proprietary, Mac-native research application distributed as a Homebrew cask rather
      than a command-line search utility. Its appeal lies in combining metasearch,
      filtering, archiving, scheduled searches, and export in one desktop package.
  project-history:
    - >
      DEVONagent was developed by DEVONtechnologies as a web-research companion within
      its family of information-management applications. The product evolved into Lite,
      Express, and Pro editions; Pro became the edition containing the complete research
      browser, archive, scheduled-search, export, and scripting feature set.
  related-projects:
    - DEVONagent Lite and DEVONagent Express are reduced editions in the same family.
    - >
      DEVONthink is the closely related DEVONtechnologies document-management
      application to which DEVONagent Pro can send research material.
    - >
      DEVONsphere Express applies related-content discovery to local Mac data rather
      than concentrating on web research.
  sources:
    - 'Official downloads page: https://devontechnologies.com/download/apps'
    - >
      Official manual:
      https://download.devontechnologies.com/download/devonagent/3.11.8/DEVONagent%20Pro%20Manual.pdf
    - 'Official product and edition history: https://www.devontechnologies.com/apps/devonagent'
  summary:
    - >
      DEVONagent Pro is DEVONtechnologies' professional macOS web-research assistant. It
      searches multiple sources, post-processes results, scans pages, produces summaries
      and topic maps, archives useful material, schedules searches, and exports or
      forwards collected research.
  timeline:
    - >
      By 2018: DEVONtechnologies documentation described DEVONagent as part of its
      established DEVONtechnology application family.
    - >
      2026: DEVONagent Pro 3.11.11 was listed on the official downloads page with
      updated search plugins and search sets.
  usage:
    - >
      Researchers use DEVONagent Pro to query multiple engines, filter and rank results,
      scan sites, save searches, maintain a local research archive, schedule recurring
      searches, and export findings as bookmarks, rich-text digests, PDF reports, or
      DEVONthink content.
