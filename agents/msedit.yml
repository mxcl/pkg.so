  summary:
    - >
      Microsoft Edit is Microsoft's open-source command-line text editor for Windows,
      implemented as a small Rust terminal editor and packaged outside Windows as
      `msedit` in Homebrew. Microsoft introduced it publicly in May 2025 as a response
      to a specific gap: 32-bit Windows had the classic MS-DOS Editor, but 64-bit
      Windows lacked an inbox command-line editor. The project deliberately uses a
      modeless text-user interface so people can edit files from a terminal without
      learning modal editor commands.
  usage:
    - >
      The GitHub README frames Edit as a simple editor for simple needs, paying homage
      to MS-DOS Editor while using modern controls similar to VS Code. Microsoft
      documented built-in features such as mouse support, multiple open files, find and
      replace with regex support, and word wrap; Microsoft Learn later documented
      availability in Windows 11 updates, installation through WinGet, and
      cross-platform availability through the GitHub repository. In package-manager
      terms, `msedit` is a lightweight terminal-editor option for users who want
      Microsoft Edit on macOS or Linux, or outside Windows' bundled release channel.
