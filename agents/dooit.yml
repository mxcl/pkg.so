history:
  adoption-history:
    - >
      Dooit found a home in the terminal productivity niche: it is distributed through
      PyPI and appears in Unix package-manager ecosystems such as Homebrew, Alpine, and
      Nix. Its README also links a Discord community and screenshots of user-customized
      configurations.
  package-nerd-significance:
    - >
      Dooit is package-nerd interesting as part of the wave of polished terminal
      productivity applications distributed like developer tools. It is a Python TUI app
      with themes, extras, package-manager support, and release artifacts rather than a
      simple script.
  project-history:
    - >
      The public dooit-org/dooit repository was created in April 2022. Its README
      presents the project as a customizable TUI todo manager and points users to the
      project wiki for installation and configuration.
    - >
      The project progressed from early 0.x tags to 1.0 and later 3.x releases. GitHub
      release metadata shows 3.3.4 published in November 2025, and repository metadata
      shows continued activity into 2026.
  related-projects:
    - >
      Related projects include Dooit Extras, smassh, other Python terminal UI todo
      managers, PyPI, and terminal productivity tools using Vim-like interaction
      patterns.
  sources:
    - https://github.com/dooit-org/dooit#readme
    - https://api.github.com/repos/dooit-org/dooit
    - https://api.github.com/repos/dooit-org/dooit/releases
    - https://pypi.org/pypi/dooit/json
    - https://formulae.brew.sh/formula/dooit
  summary:
    - >
      Dooit is a Python terminal user interface todo manager. It focuses on interactive
      task management, Vim-like keybindings, topic-separated todo lists, theming, and
      Python-based customization.
  timeline:
    - '2022: The public GitHub repository is created.'
    - '2022: Early 0.x tags appear in the current repository.'
    - '2025: Release metadata shows the 3.3.x series.'
    - '2026: GitHub metadata shows continued repository activity.'
  usage:
    - >
      Users launch `dooit` to manage todo lists interactively in the terminal. The
      README highlights keybinding help with `?`, topic-separated lists with branching,
      and customization through a Python config file and companion Dooit Extras
      configurations.
related-packages:
  - id: brew:task
    reason: >
      Choose Taskwarrior when you prefer a long-established command-oriented task
      database with reports, hooks, filters, and scripting instead of Dooit's
      full-screen customizable TUI.
    rel: alternative
    sources:
      - https://dooit-org.github.io/dooit/getting_started/introduction.html
      - https://taskwarrior.org/docs/
