credentials-file-location: null
history:
  adoption-history:
    - >
      grunt-cli was widely adopted with Grunt during the early Node.js build-tool era,
      when JavaScript projects needed repeatable commands for minification, linting,
      concatenation, tests, and release chores. Its global-install pattern let
      developers type `grunt` in many projects while allowing each project to control
      its own Grunt and plugin versions.
    - >
      As npm scripts and later bundlers became more common, grunt-cli's role narrowed
      but remained historically important: it is the launcher that made Grunt's
      project-local dependency model ergonomic across shells, editors, CI systems, and
      package managers.
  package-nerd-significance:
    - >
      grunt-cli is package-manager lore because it encodes the
      global-binary/local-library compromise that became common in Node tooling. It
      gives Homebrew, npm, Debian, Arch, Nix, Ubuntu, and Windows package entries a
      simple executable to ship, while project correctness still depends on
      `package.json` and the local `node_modules` graph.
    - >
      For maintainers, grunt-cli is also a reminder that a package named like a tool can
      be only a shim. Installing it gives users the command, not necessarily the task
      runner semantics until a project supplies a Gruntfile and dependencies.
  project-history:
    - >
      The Grunt ecosystem began with the core grunt repository in September 2011 and the
      dedicated grunt-cli repository in November 2012. The CLI split reflects a Node.js
      packaging lesson: the executable can live globally while the task runner and
      plugins stay pinned in each project.
    - >
      Grunt documentation for the 0.4 era explicitly tells users that installing
      grunt-cli does not install the Grunt task runner. Instead, each `grunt` invocation
      searches through Node's require system for a local Grunt installation, reads the
      project Gruntfile, and runs requested tasks. The grunt-cli npm package was created
      in November 2012, matching the repository's early public history.
  related-projects:
    - grunt is the task runner that grunt-cli locates and runs.
    - >
      grunt-contrib plugins provide common tasks such as uglify, jshint, and nodeunit in
      documented examples.
    - >
      npm is the package manager used by Grunt documentation for installing grunt-cli,
      grunt, and plugins.
  sources:
    - https://api.github.com/repos/gruntjs/grunt
    - https://api.github.com/repos/gruntjs/grunt-cli
    - https://github.com/gruntjs/grunt-cli
    - https://gruntjs.com/getting-started
    - https://gruntjs.com/using-the-cli
    - https://registry.npmjs.org/grunt-cli
  summary:
    - >
      grunt-cli is the small command-line launcher for Grunt, the JavaScript task
      runner. Its importance is not that it contains the build system itself, but that
      it standardizes the global or local `grunt` command while delegating execution to
      the Grunt version installed beside a project Gruntfile.
  timeline:
    - '2011: gruntjs/grunt repository created.'
    - '2012: gruntjs/grunt-cli repository created.'
    - '2012: grunt-cli package created on npm.'
    - '2013: Grunt 0.4 documentation formalized the global CLI plus local Grunt workflow.'
    - '2021: grunt-cli 1.4.x releases published.'
    - '2024: grunt-cli 1.5.0 release published.'
  usage:
    - >
      Typical use is `npm install -g grunt-cli` to place `grunt` on PATH, followed by
      project-local installation of `grunt` and plugins as development dependencies.
      Running `grunt` from a project directory locates the nearest Gruntfile, loads
      project tasks, and executes the named or default task. The CLI also exposes
      options for help, base path, alternate Gruntfile, task directories, npm-installed
      plugins, dry-run behavior, verbosity, version output, and shell completion.
related-packages:
  - id: brew:gulp-cli
    reason: >
      Choose gulp-cli for a Node.js task-runner workflow built around exported
      JavaScript functions, streams, and explicit `series()` or `parallel()` composition
      instead of Grunt's configuration-oriented Gruntfile and plugin task model.
    rel: alternative
    sources:
