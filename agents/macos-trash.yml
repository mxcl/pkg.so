history:
  adoption-history:
    - >
      The README documents installation through Homebrew, Mint, and manual binary
      download, while the batch input records Homebrew and MacPorts packaging.
      Repository metadata captured during this run showed hundreds of GitHub stars,
      reflecting steady interest in safer command-line deletion on macOS.
  package-nerd-significance:
    - >
      macos-trash fills the long-standing gap between Unix `rm` and Finder's Trash. For
      package users, it is the kind of small native CLI that makes scripts safer while
      preserving macOS-specific behavior such as recoverable trash items.
  project-history:
    - >
      The official repository was created in January 2015. The current README describes
      a macOS 13-or-later utility and notes that, although macOS 15 added a built-in
      `trash` command, this package still provides an interactive flag and fixes Put
      Back behavior.
  related-projects:
    - >
      The README links related projects including the cross-platform Node.js `trash`,
      `empty-trash`, `macos-wallpaper`, and `do-not-disturb`.
  sources:
    - https://api.github.com/repos/sindresorhus/macos-trash
    - https://github.com/sindresorhus/macos-trash
    - https://github.com/sindresorhus/macos-trash#readme
    - source_facts.package-manager
  summary:
    - >
      macos-trash is a Swift command-line tool that moves files and folders to the macOS
      Trash instead of deleting them directly.
  timeline:
    - '2015: Official GitHub repository created.'
    - '2024: macOS 15 introduced a built-in `trash` command, according to the project README.'
    - '2026: Repository activity continued through commits pushed to the default branch.'
  usage:
    - >
      The documented CLI shape is `trash [--help | -h] [--version | -v] [--interactive |
      -i] <path> ...`. The README also suggests aliasing `rm` to `trash` for users who
      want a safer default in their shell.
related-packages:
  - id: brew:gomi
    reason: >
      Choose gomi when you want a cross-platform, XDG-compatible trash with an
      interactive restore browser and pruning controls; choose macos-trash for a minimal
      native macOS command with Finder-style recovery behavior.
    rel: alternative
    sources:
      - https://github.com/sindresorhus/macos-trash#readme
      - https://gomi.dev/
