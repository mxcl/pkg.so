history:
  adoption-history:
    - >
      Picmal is distributed as a native macOS application and through Homebrew cask. Its
      Finder Services, Shortcuts, Raycast, menu-bar, drag-and-drop, watched-folder, and
      command-line integrations target both ordinary Mac users and automation-oriented
      workflows.
  package-nerd-significance:
    - >
      Picmal packages a broad collection of media-processing jobs behind one native
      interface while keeping processing local. For package-manager users, it provides a
      self-contained alternative to assembling several format-specific command-line
      tools and does not require Homebrew-installed dependencies.
    - >
      The accompanying `picmal-cli` makes the same conversion and compression
      capabilities available to shell scripts, including JSON output, naming patterns,
      metadata controls, and batch operation.
  project-history:
    - >
      The official sources document Picmal as a modern native macOS media toolbox but do
      not provide a reliable origin date or detailed release history. Its documented
      scope has grown beyond image conversion to include audio and video processing, PDF
      operations, vectorization, background removal, watched folders, system
      integrations, and a command-line interface.
  related-projects:
    - picmal-cli
    - macOS Finder Services
    - Apple Shortcuts
    - Raycast
  sources:
    - 'Official CLI documentation: https://picmal.app/docs/cli'
    - 'Official FAQ: https://picmal.app/docs/faq'
    - 'Official integrations documentation: https://picmal.app/docs/integrations'
    - 'Official introduction: https://picmal.app/docs'
  summary:
    - >
      Picmal is a native macOS toolbox for converting and compressing images, audio,
      video, and PDFs locally.
  timeline:
    - >
      The official documentation reviewed does not publish a dependable project-origin
      timeline.
  usage:
    - >
      Users can drop files or folders into the application, choose an output format or
      compression preset, and process them locally. Additional tools cover cropping, PDF
      combination and splitting, audio merging, video assembly, raster vectorization,
      background removal, watermarks, output naming, and watched folders.
    - >
      No account or network connection is required for media processing. Network access
      is limited to trial and license activation. The application is self-contained and
      bundles its processing tools.
