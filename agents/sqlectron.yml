history:
  adoption-history:
    - >
      Sqlectron gained adoption as a free desktop client offering one interface for
      multiple database systems on macOS, Linux, and Windows. Its official GitHub
      project accumulated a substantial user and contributor community.
  package-nerd-significance:
    - >
      Sqlectron exemplifies the cross-platform Electron database clients that became
      common in the mid-2010s. Its configuration is especially relevant to package users
      because saved server records—including database passwords and SSH connection
      details—reside in the same managed configuration file.
  project-history:
    - >
      Sqlectron began in 2015 as an MIT-licensed, cross-platform SQL client. The project
      originally separated reusable database code into sqlectron-core; in 2021 that code
      was merged into the main graphical-client repository and the core repository was
      archived. The former sqlectron-gui URL now redirects to the consolidated sqlectron
      repository.
  related-projects:
    - >
      sqlectron-core was the reusable database layer before being merged into the main
      application.
    - The official project also documents a terminal-oriented Sqlectron client.
  sources:
    - https://github.com/sqlectron/sqlectron#readme
    - https://github.com/sqlectron/sqlectron-core
    - https://github.com/sqlectron/sqlectron/blob/main/docs/app/configuration-file.md
  summary:
    - >
      Sqlectron is an open-source desktop SQL client with cross-database and
      cross-platform support.
  timeline:
    - '2015: The Sqlectron project began under the MIT license.'
    - '2021: sqlectron-core was merged into the main GUI repository and archived.'
  usage:
    - >
      Users save database server definitions, optionally configure SSH tunneling and
      private keys, browse database structures, and execute SQL through the desktop
      application. Supported back ends documented by the project include PostgreSQL,
      Redshift, MySQL, MariaDB, SQL Server, Cassandra, and SQLite.
