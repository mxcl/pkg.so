id: brew:diamond
display-name: DIAMOND
repo: null
docs:
  - https://github.com/bbuchfink/diamond/wiki
  - https://bbuchfink.github.io/diamond
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      DIAMOND's adoption is tied to its promise of much faster BLAST-like protein and
      translated DNA alignment. The README highlights 100x to 10,000x BLAST speed, low
      resource requirements, downloads from GitHub releases, Bioconda availability,
      Galaxy integration, and citation badges.
  package-nerd-significance:
    - >
      DIAMOND is significant because it is a research-grade bioinformatics workhorse
      that also behaves like a normal packaged CLI. That combination makes it common in
      reproducible pipelines, containers, Conda environments, Homebrew installs, and HPC
      workflows.
  project-history:
    - >
      The README says the initial version was developed by Benjamin J. Buchfink at the
      Huson lab, University of Tuebingen, from 2013 to 2015. Later development continued
      independently, with support from an EXIST grant in 2018-2019 and the Max Planck
      Institute for Biology Tuebingen from 2019 to 2024.
  related-projects:
    - >
      The README frames DIAMOND as BLAST-compatible and links it to Bioconda and the
      European Galaxy server for workflow use.
  sources:
    - https://github.com/bbuchfink/diamond
    - https://raw.githubusercontent.com/bbuchfink/diamond/master/README.md
    - https://api.github.com/repos/bbuchfink/diamond
    - https://github.com/bbuchfink/diamond/releases/tag/v2.2.2
  summary:
    - >
      DIAMOND is a high-performance sequence aligner for protein and translated DNA
      searches, positioned as a BLAST-compatible tool for large biological datasets.
  timeline:
    - '2013-2015: Initial version developed at the Huson lab, University of Tuebingen.'
    - '2015: Original DIAMOND publication cited in the README.'
    - >
      2021: Sensitive protein alignments at tree-of-life scale publication cited in the
      README.
    - '2026: v2.2.2 release published on GitHub.'
  usage:
    - >
      Package users install DIAMOND when they need command-line database creation,
      protein search, translated DNA search, sequence clustering, taxonomic
      classification, or BLAST-style tabular, pairwise, and XML outputs.
related-packages:
  - id: brew:blast
    reason: >
      Choose NCBI BLAST for the canonical NCBI toolset, full nucleotide-oriented program
      family, and reference behavior; choose DIAMOND for high-throughput protein and
      translated-DNA searches with familiar BLAST-style output.
    rel: alternative
    sources:
      - https://bbuchfink.github.io/diamond/
      - https://www.ncbi.nlm.nih.gov/books/NBK279670/
  - id: brew:mmseqs2
    reason: >
      Choose MMseqs2 for a broader protein-and-nucleotide search, profile-search,
      taxonomy, and clustering suite; choose DIAMOND for a focused BLAST-compatible
      protein and translated-DNA workflow.
    rel: alternative
    sources:
      - https://bbuchfink.github.io/diamond/
      - https://github.com/soedinglab/MMseqs2
