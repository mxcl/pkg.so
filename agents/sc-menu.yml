history:
  adoption-history:
    - >
      SC Menu targets managed macOS environments as well as individual users. Its
      documented configuration-profile domain, update controls, notification settings,
      login registration, and card-insertion or removal hooks align it with Mac
      administration and enterprise smartcard deployment workflows.
    - >
      Distribution through a Homebrew cask gives administrators and technical users a
      reproducible alternative to installing the application bundle manually.
  package-nerd-significance:
    - >
      SC Menu is a compact example of Homebrew cask packaging for specialized security
      hardware. It exposes macOS CryptoTokenKit and PIV card state through a menu-bar
      interface while retaining administrator-friendly controls through commands and MDM
      configuration profiles.
  project-history:
    - >
      SC Menu was developed as an open-source Swift menu application for macOS PIV
      smartcards. Its core design displays card-presence state in the menu bar and lets
      users inspect certificates stored on an inserted card.
    - >
      The project later accumulated operational features useful to Mac administrators:
      registration and removal from Login Items, configurable update and notification
      behavior, expiration-warning policy, and optional scripts triggered by card
      insertion or removal.
  related-projects:
    - macOS CryptoTokenKit
    - PIV smartcards
    - macOS configuration profiles and MDM
    - macOS Login Items
  sources:
    - https://github.com/boberito/sc_menu
  summary:
    - >
      SC Menu is a lightweight open-source macOS menu-bar application for monitoring PIV
      smartcards and viewing the certificates they contain.
  timeline:
    - >
      Initial purpose: SC Menu provided a menu-bar indication of PIV smartcard presence
      and certificate viewing.
    - 'Later development: Login Item registration and unregistration commands were documented.'
    - >
      Later development: MDM configuration-profile controls and card insertion/removal
      script hooks were added.
  usage:
    - >
      A green menu-bar smartcard icon indicates an inserted card; a blank icon indicates
      that no card is present. Users can inspect certificates on the card from the
      application.
    - >
      Administrators can register the app to launch at login and deploy preferences
      under the `com.ttinc.sc-menu` configuration-profile domain. Supported policy
      controls cover updates, notifications, certificate-expiration warnings, and
      scripts executed when cards are inserted or removed.
