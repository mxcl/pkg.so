id: brew:markdown-toc
display-name: markdown-toc
repo: https://github.com/jonschlinkert/markdown-toc
docs:
  - https://github.com/jonschlinkert/markdown-toc#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The official repository description says the package is used by many well-known
      projects and thousands of other projects. The README displays npm version/download
      badges and documents npm installation, while supplied package facts show Homebrew
      and Nix packaging as well.
  package-nerd-significance:
    - >
      markdown-toc is a classic small Unixy documentation helper: it reads Markdown,
      emits Markdown, and is easy to wire into README generation. Package maintainers
      care because it has a stable CLI surface and also doubles as a library for
      build-time documentation automation.
  project-history:
    - >
      The GitHub repository was created in 2013. The README describes markdown-toc as a
      tool that uses Remarkable to parse Markdown and can be used from the command line
      or as an API/plugin.
    - >
      The project belongs to the ecosystem of README automation tools around Jon
      Schlinkert's packages, Verb, and Assemble-style documentation workflows. Its own
      README is generated with Verb using markdown-toc, making the package
      self-demonstrating.
  related-projects:
    - The README identifies Remarkable as the Markdown parser used by markdown-toc.
    - The README notes it was generated with Verb and can be used as a Remarkable plugin.
  sources:
    - https://api.github.com/repos/jonschlinkert/markdown-toc
    - https://github.com/jonschlinkert/markdown-toc
    - source_facts.package-manager
  summary:
    - >
      markdown-toc is a Node.js API and CLI for generating and inserting tables of
      contents in Markdown files.
  timeline:
    - '2013: GitHub repository created.'
    - >
      2010s: README documents npm installation and CLI/API usage for README
      table-of-contents generation.
    - '2026: Supplied package facts list Homebrew and Nix packaging.'
  usage:
    - >
      The common CLI workflow is to install markdown-toc globally, add a hidden <!-- toc
      --> marker to a README, and run markdown-toc -i README.md to inject or update the
      generated TOC. Without in-place mode, the CLI can print a TOC to standard output
      or JSON.
    - >
      As an API, markdown-toc returns rendered content plus token data so build scripts
      can render a custom table of contents. Options cover heading depth, bullet style,
      slugification, filtering, indentation, and whether to include the first H1.
related-packages:
  - id: brew:github-markdown-toc
    reason: >
      Choose github-markdown-toc when the target is specifically GitHub README or wiki
      anchor behavior and a dependency-free compiled Go CLI is preferable to
      markdown-toc's Node.js API and Remarkable integration.
    rel: alternative
    sources:
      - https://github.com/jonschlinkert/markdown-toc
      - https://github.com/ekalinin/github-markdown-toc.go
  - id: brew:marksman
    reason: >
      Choose Marksman when table-of-contents creation should be an editor code action
      within a broader Markdown language-server workflow rather than a standalone
      README-generation command.
    rel: alternative
    sources:
      - https://github.com/jonschlinkert/markdown-toc
      - https://github.com/artempyanykh/marksman/blob/main/docs/features.md
