history:
  adoption-history:
    - >
      Retrace is distributed as a native application for Apple Silicon Macs and through
      the Homebrew cask supplied in the input. The project also publishes source-build
      instructions using Swift Package Manager and Xcode.
    - >
      Its ability to import existing Rewind data positions it as a migration path for
      users who want a transparent, locally processed screen-history system.
  package-nerd-significance:
    - >
      Retrace is notable to package enthusiasts as an open-source, auditable entrant in
      the personal screen-memory category. It combines native macOS frameworks, SQLite
      full-text search, OCR, and HEVC storage without requiring an account or cloud
      backend.
    - >
      Because screen-history applications retain unusually sensitive data, its
      MIT-licensed source, local storage layout, absence of telemetry, and
      package-manager distribution are central parts of its appeal rather than
      incidental implementation details.
  project-history:
    - >
      Retrace was created as an open-source, local-first alternative to Rewind AI for
      macOS. The project captures the screen at intervals, extracts text with Apple's
      Vision framework, stores metadata in SQLite with FTS5, and encodes visual history
      as HEVC video.
    - >
      The project describes itself as being in early development. Its implemented
      feature set includes searchable OCR history, a scrubber timeline, usage analytics,
      configurable capture and exclusion controls, global shortcuts, and import of
      existing Rewind data; audio transcription and local semantic embeddings remain
      planned work.
  related-projects:
    - >
      Rewind AI directly inspired Retrace and is the source format supported by its
      migration tools.
    - >
      Apple Vision provides OCR, VideoToolbox provides HEVC encoding, and SQLite FTS5
      provides full-text search.
    - >
      Sparkle supplies application updates; future plans identify whisper.cpp for
      transcription and llama.cpp for local embeddings.
  sources:
    - https://github.com/haseab/retrace
    - https://retrace.to/
    - https://retrace.to/privacy
    - source_facts.package-manager
  summary:
    - >
      Retrace is an open-source, local-first macOS application that records screen
      activity, extracts searchable text with OCR, and presents the result as a timeline
      and activity history.
  timeline:
    - >
      2026: Official project materials documented the early-development application,
      local-only architecture, Homebrew distribution, and public source repository.
  usage:
    - >
      After granting Screen Recording and optional Accessibility permissions, users let
      Retrace capture screen activity in the background, then search OCR text, filter by
      application or date, scrub through the timeline, and review application-usage
      analytics.
    - >
      Users can tune the capture interval, exclude applications and private browsing
      windows, assign shortcuts, import Rewind data, choose a custom data location, and
      delete selected history or the complete local data store.
