id: brew:dunamai
display-name: Dunamai
repo: https://github.com/mtkennerly/dunamai
docs:
  - https://dunamai.readthedocs.io/
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Dunamai is distributed as a Python package, a command-line tool, a GitHub Action,
      and a Homebrew formula. Its most visible related adoption path is
      poetry-dynamic-versioning, another mtkennerly project that uses VCS tags to enable
      dynamic versioning in Poetry projects.
  package-nerd-significance:
    - >
      Dunamai matters to package maintainers because dynamic version generation sits at
      the boundary between VCS history, build backends, Python packaging rules, and
      reproducible release artifacts. It is a small package, but it codifies a common
      maintainer desire: tag a release once and let packaging metadata follow.
  project-history:
    - >
      Dunamai was created in 2019 by Michael Kennerly as an alternative in the
      dynamic-versioning space. Its README contrasts it with Versioneer, especially for
      projects that do not use setup.py or do not want generated versioning code
      committed into the repository.
    - >
      The project broadened beyond Git-only workflows: official docs list support for
      Git, Mercurial, Darcs, Subversion, Bazaar, Fossil, and Pijul, and serialization
      styles including PEP 440, Semantic Versioning, and Haskell PVP.
  related-projects:
    - >
      Related projects include Versioneer, setuptools-scm, poetry-dynamic-versioning,
      Poetry, Flit, GitHub Actions, and the VCS tools that Dunamai can read: Git,
      Mercurial, Darcs, Subversion, Bazaar, Fossil, and Pijul.
  sources:
    - https://github.com/mtkennerly/dunamai#readme
    - https://dunamai.readthedocs.io/
    - https://api.github.com/repos/mtkennerly/dunamai
    - https://api.github.com/repos/mtkennerly/dunamai/releases
    - https://pypi.org/pypi/dunamai/json
    - https://api.github.com/repos/mtkennerly/poetry-dynamic-versioning
    - https://formulae.brew.sh/formula/dunamai
  summary:
    - >
      Dunamai is a Python library and CLI for deriving standards-compliant version
      strings from version-control tags, aimed at CI builds, release tagging, and
      dynamic package versions.
  timeline:
    - '2019: The GitHub repository is created.'
    - '2019: v0.1.0 is published on GitHub Releases and PyPI.'
    - '2019: poetry-dynamic-versioning is created as a related Poetry integration.'
    - '2026: v1.26.1 is published and packaged as Homebrew stable 1.26.1.'
  usage:
    - >
      Users call commands such as `dunamai from any` in CI or release scripts to produce
      versions from tags, commit distance, dirty state, branch names, and commit IDs. As
      a library, it exposes a Version object so build tools can inspect and serialize
      version parts.
related-packages:
  - id: brew:poetry
    reason: >
      Use Poetry with Dunamai when a Python project needs Poetry's packaging workflow
      while deriving its version from VCS tags; Dunamai documents both a direct `poetry
      version` command and its dedicated Poetry plugin.
    rel: adjacent_workflow
    sources:
      - https://github.com/mtkennerly/dunamai#integration
      - https://python-poetry.org/docs/
