id: brew:ctags
display-name: Exuberant Ctags
repo: https://sourceforge.net/p/ctags/code/HEAD/tree
docs:
  - https://ctags.sourceforge.net/
  - https://ctags.sourceforge.net/ctags.html
config-file-location:
  unix:
    - /etc/ctags.conf
    - /usr/local/etc/ctags.conf
    - ~/.ctags
    - .ctags
  windows:
    - /ctags.cnf
    - ~/ctags.cnf
    - ctags.cnf
credentials-file-location: null
history:
  adoption-history:
    - >
      The Exuberant Ctags home page states that the tool was used in at least 50
      countries, supported 41 programming languages, was included in major Linux
      distributions, and was covered by editor and programming publications. The input
      package facts show the Homebrew package name distributed across many modern
      package managers, including apk, Homebrew, Chocolatey, Fedora, MacPorts, Nix,
      pacman, Scoop, winget, and zypper.
  package-nerd-significance:
    - >
      Ctags is a foundational editor-tool package: tiny, scriptable, cross-platform, and
      useful across many languages. Exuberant Ctags became the de facto packaged
      implementation for years, while later Universal Ctags packaging inherited much of
      the command-line and distribution story.
  project-history:
    - >
      The official change notes record ctags 1.0 as a first public release on May 31,
      1996. The project then expanded rapidly from a C/C++-oriented tag generator into a
      multi-language tool, adding Java support in 1998, many other language parsers
      through the 2000s, extended tag fields, recursive traversal, Emacs TAGS output,
      user-defined regex languages, and broad platform support.
    - >
      Version 5.8, dated July 9, 2009 on the official site, was the last Exuberant Ctags
      release advertised there. Its source distribution and platform packages remained
      important long after that date because the tool had become a standard dependency
      for editor navigation and source-code browsing workflows.
  related-projects:
    - >
      Exuberant Ctags is historically tied to vi, Vim, Emacs TAGS files, and editor
      source-navigation workflows. Universal Ctags is the active successor lineage used
      by newer tooling such as ctags-lsp.
  sources:
    - https://ctags.sourceforge.net/
    - https://ctags.sourceforge.net/whatis.html
    - https://ctags.sourceforge.net/desire.html
    - https://ctags.sourceforge.net/news.html
    - https://ctags.sourceforge.net/ctags.html
    - https://sourceforge.net/p/ctags/code/HEAD/tree
  summary:
    - >
      Exuberant Ctags is Darren Hiebert's multi-language implementation of the classic
      ctags source-indexing tool. It generates tag files that editors and other tools
      use for quick navigation to language objects such as functions, classes, macros,
      variables, and declarations.
  timeline:
    - '1996: ctags 1.0 first public release.'
    - '1998: ctags 2.1 added Java support; ctags 2.2 added recursive traversal.'
    - >
      2003: ctags 5.5 added list-languages, list-kinds, list-maps, C#, Erlang, HTML,
      JavaScript, and Standard ML support.
    - '2007: ctags 5.7 added support for .ctags on Windows.'
    - '2009: ctags 5.8 release advertised on the official site.'
  usage:
    - >
      ctags is typically run over a source tree to create a tags file for editors,
      source browsers, or other utilities. The official manual documents automatic
      language selection, recursive source traversal, configuration files, environment
      options, and tag-file output formats.
related-packages:
  - id: brew:universal-ctags
    reason: >
      Choose Universal Ctags for an actively maintained continuation with modern
      language parsers and updated configuration conventions; retain Exuberant Ctags
      when compatibility with its historical behavior is required.
    rel: alternative
    sources:
      - https://github.com/universal-ctags/ctags
      - https://docs.ctags.io/en/latest/incompatibilities.html
      - https://ctags.sourceforge.net/
  - id: brew:codequery
    reason: >
      CodeQuery can consume Exuberant Ctags symbol output together with cscope data to
      build a searchable SQLite-backed source-browsing database.
    rel: adjacent_workflow
    sources:
      - https://github.com/ruben2020/codequery
      - https://ctags.sourceforge.net/ctags.html
