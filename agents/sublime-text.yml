id: cask:sublime-text
display-name: Sublime Text
repo: null
docs:
  - https://www.sublimetext.com/docs
config-file-location:
  linux:
    - ~/.config/sublime-text/Packages/User/Preferences.sublime-settings
  macos:
    - ~/Library/Application Support/Sublime Text/Packages/User/Preferences.sublime-settings
  windows:
    - '%APPDATA%\Sublime Text\Packages\User\Preferences.sublime-settings'
credentials-file-location: null
history:
  adoption-history:
    - >
      Sublime Text developed a durable ecosystem around file-based preferences, syntax
      packages, snippets, build systems, and Python plugins. Its Packages/User directory
      became the conventional portable core of a user's customized setup.
    - >
      The editor is available across macOS, Windows, and Linux. Official Linux
      repositories, built-in update mechanisms on macOS and Windows, a command-line
      launcher, and persistent per-user data directories make it suitable for both
      interactive installation and package-managed workstation setups.
  package-nerd-significance:
    - >
      Sublime Text helped popularize a style of fast, keyboard-driven graphical editing
      built around fuzzy navigation, multiple selections, a command palette, and
      JSON-like configuration files. Its distinction between the installed executable,
      shipped packages, installed packages, and loose user packages is particularly
      relevant to reproducible editor setups.
    - >
      Package users care about the stable data-directory layout because uninstalling or
      replacing the application normally leaves preferences and packages intact. That
      separation supports backups and dotfile-style synchronization while allowing the
      application binary to be managed independently.
  project-history:
    - >
      Founder Jon Skinner wrote that the first code was written roughly two years before
      he began working full-time on the project in November 2007. By 2010, Sublime Text
      1.3 already offered find-in-files, live find previews, Goto Symbol, broader syntax
      support, and an expanded API.
    - >
      Successive major generations expanded the editor's package and plugin ecosystem,
      cross-platform support, indexing, and rendering. Sublime Text 4 reached its first
      stable release in May 2021 with GPU rendering, context-aware autocomplete,
      TypeScript support, and a revised licensing model based on a rolling update
      window.
  related-projects:
    - Sublime Merge is Sublime HQ's related graphical Git client.
    - The official sublimehq/Packages repository contains many bundled syntax definitions.
    - Third-party packages extend Sublime Text through its package and Python plugin APIs.
  sources:
    - https://www.sublimetext.com/blog/
    - https://www.sublimetext.com/blog/articles/130
    - https://www.sublimetext.com/blog/articles/introduction
    - https://www.sublimetext.com/docs/packages.html
    - https://www.sublimetext.com/docs/revert.html
    - https://www.sublimetext.com/docs/settings.html
  summary:
    - >
      Sublime Text is Sublime HQ's cross-platform editor for source code, markup, and
      prose. It is known for responsive editing, keyboard-oriented navigation, multiple
      selections, project-wide search, and an extensible package system.
  timeline:
    - 'Circa 2005: Jon Skinner began writing the project.'
    - '2007: Skinner began working full-time on the software.'
    - '2010: Sublime Text 1.3 expanded search, navigation, syntax support, and the API.'
    - >
      2018: Sublime Text 3.1 refined high-DPI rendering and introduced a JSON
      color-scheme format.
    - '2021: The first stable Sublime Text 4 release arrived.'
    - >
      2025: Sublime HQ announced a staged move of the plugin runtime from Python 3.3/3.8
      toward Python 3.13.
  usage:
    - >
      Developers use Sublime Text for editing individual files and directory-based
      projects, project-wide search, symbol navigation, multi-cursor changes,
      syntax-aware editing, and running configurable build systems.
    - >
      Global user preferences are normally stored in
      Packages/User/Preferences.sublime-settings beneath the platform's Sublime Text
      data directory. Syntax-specific settings, key bindings, snippets, build systems,
      and plugins can also be placed in Packages/User.
