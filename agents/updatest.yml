history:
  adoption-history:
    - >
      Updatest integrates directly with Homebrew and can adopt an already-installed
      application into Homebrew management. It also checks the Mac App Store, Sparkle,
      Electron update metadata, GitHub Releases, and its optional Updatest Network.
    - >
      The package is available as the Homebrew cask `updatest`, giving package-manager
      users a reproducible installation path and enabling the app's deeper Homebrew
      integration.
  package-nerd-significance:
    - >
      Updatest is notable for putting several macOS update ecosystems behind one
      graphical interface. Its Homebrew adoption workflow is particularly relevant to
      users migrating manually installed applications into package-manager control.
    - >
      Its distinction between locally verifiable sources, manual sources, and
      network-discovered versions makes update provenance visible instead of presenting
      every available version as equivalent.
  project-history:
    - >
      Updatest was developed as a native macOS application for discovering and applying
      updates from multiple official distribution mechanisms.
    - >
      The official changelog documents rapid expansion during 2026, including a
      redesigned 2.0 interface, improved community-version discovery under the Updatest
      Network name, Homebrew formula and cask management, and additional diagnostics.
  related-projects:
    - Homebrew
    - Homebrew Cask
    - Sparkle
    - Mac App Store
    - GitHub Releases
  sources:
    - https://github.com/updatest
    - https://updatest.app/
    - https://updatest.app/download/changelog.html
    - https://updatest.app/faq/
    - https://updatest.app/howto/
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Updatest is a native macOS update manager that discovers updates through Homebrew,
      the Mac App Store, Sparkle, Electron metadata, GitHub Releases, manual sources,
      and an optional shared version-discovery network.
  timeline:
    - >
      2026-01: Community Updates and extensive version-comparison improvements appeared
      in the 1.5 series.
    - '2026-02: Updatest 2.0 introduced a redesigned interface and expanded diagnostics.'
    - '2026-02: Community Updates was renamed Updatest Network.'
    - >
      2026-04: The official changelog documented broader Homebrew cask handling and
      package-management features.
  usage:
    - >
      Use Updatest to scan installed applications, review detected update sources, and
      launch the appropriate update mechanism.
    - >
      Applications can be adopted into Homebrew when users want the package manager to
      own future updates. A manual Homebrew cask or GitHub repository may instead be
      attached only as a notification source.
    - >
      Updatest scans `/Applications` and `~/Applications` by default. Homebrew is
      optional but enables more detection and direct updates.
