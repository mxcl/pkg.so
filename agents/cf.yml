id: brew:cf
display-name: cf
repo: null
docs:
  - https://ee.lbl.gov/downloads/cf
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      cf appears in this batch as a Homebrew formula and is distributed directly from
      LBL's download directory as versioned tarballs. Its packaging value is as a tiny
      log-processing utility rather than a large upstream ecosystem.
  package-nerd-significance:
    - >
      This is the kind of small, old-school Unix filter package that survives because it
      does one job cleanly. It is package-nerd interesting precisely because the
      upstream is a versioned source tarball with a manpage and CHANGES file, not a
      modern hosted repository.
  project-history:
    - >
      The distributed source archive carries a BSD-style University of California
      copyright covering 2004, 2005, 2006, 2009, and 2014. The CHANGES file records v1.1
      in 2004 as the first autoconf version, v1.2.1 in 2006 adding CFTIMEARGS, and later
      maintenance releases through v1.2.8 in 2024.
  related-projects:
    - The cf(1) manual page lists hf(1) and strftime(3) as related interfaces.
  sources:
    - https://ee.lbl.gov/
    - https://ee.lbl.gov/downloads/cf
    - https://formulae.brew.sh/api/formula/cf.json
  summary:
    - >
      cf is a small Unix command-line filter from Lawrence Berkeley National Laboratory
      for replacing numeric timestamps at the beginning of input lines with formatted
      dates. Its manual page documents stdin/file filtering, strftime formatting, UTC
      output, strict timestamp checking, and preservation of sub-second timestamp data.
  timeline:
    - '2004: v1.1 recorded as the first autoconf version.'
    - '2006: v1.2.1 released with CFTIMEARGS support.'
    - '2014: v1.2.5 maintenance release updated install and copyright details.'
    - '2024: v1.2.7 and v1.2.8 released.'
  usage:
    - >
      cf is used in pipelines that need human-readable timestamps in log-like text. It
      reads named files or stdin, replaces leading epoch timestamps, honors CFTIMEARGS
      as default flags when no command-line flags are specified, and supports custom
      strftime formats.
related-packages: []
tags:
  - cli
  - date-formatting
  - logs
  - text-filter
  - timestamps
