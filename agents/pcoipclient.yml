credentials-file-location: null
history:
  adoption-history:
    - >
      The macOS client is one endpoint in the cross-platform HP Anyware stack, which
      supports clients on desktop, mobile and thin-client platforms and agents on
      Windows, Linux and macOS. Official release records show a long-running versioned
      client line extending back through the Teradici-branded releases.
  package-nerd-significance:
    - >
      The cask packages an enterprise remote-workstation endpoint whose local client,
      broker and remote agent must interoperate. It is of particular interest in media,
      engineering and visualization environments because PCoIP emphasizes responsive
      remote display, high-resolution workflows, peripheral forwarding and
      build-to-lossless image quality.
  project-history:
    - >
      The application originated as Teradici's PCoIP Software Client for macOS. Teradici
      Cloud Access Software became HP Anyware in 2022, combining that platform with HP
      ZCentral Remote Boost. The client interface was subsequently renamed Anyware
      Client while legacy executable and configuration names were retained for
      compatibility.
  related-projects:
    - >
      HP Anyware Agents provide the remote host endpoint; Anyware Manager supports
      provisioning and administration; Remote Workstation Cards are another supported
      host type. The product lineage also includes Teradici Cloud Access Software and HP
      ZCentral Remote Boost.
  sources:
    - https://anyware.hp.com/components/graphics-agent-for-macos/22.07.1/release-notes
    - https://anyware.hp.com/documentation/software-client-for-macos/release-notes
    - >
      https://anyware.hp.com/web-help/pcoip_client/mac/22.09/connecting/connecting_to_remote_desktops/
  summary:
    - >
      HP Anyware Client for macOS, formerly Teradici PCoIP Software Client, connects a
      Mac to brokered or direct remote desktops using the PCoIP protocol.
  timeline:
    - '2022: Teradici Cloud Access Software became HP Anyware.'
    - >
      2023: The PCoIP Client interface was renamed Anyware Client while legacy
      executable and configuration names remained.
    - >
      2024: The client added a simplified update-notification experience and safer
      delivery of sensitive command-line parameters.
  usage:
    - >
      Users add an Anyware agent, connection manager or Remote Workstation Card by host
      address or registration code, authenticate with broker-provided or remote-machine
      credentials, and select an authorized desktop. Administrators can launch sessions
      with command-line flags or pcoip: URIs and can apply persistent user- or
      system-scoped plist settings.
