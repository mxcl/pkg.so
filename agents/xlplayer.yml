history:
  adoption-history:
    - >
      The official product site distributes 迅雷影音 for macOS alongside Windows, TV, and
      HarmonyOS editions. Its current positioning combines local playback with direct
      access to multiple cloud-storage services and cross-device playback continuity.
  package-nerd-significance:
    - >
      XLPlayer is a proprietary, regionally prominent media client whose Homebrew cask
      exposes the Mac application under its bundle-oriented English name. It is useful
      to package users who need broad codec support, Chinese subtitle workflows, or
      integration with cloud media services.
  project-history:
    - >
      Xunlei's official help center describes 迅雷影音 as the successor or upgraded form of
      迅雷看看. The redesign substantially revised its player core, browser, and interface
      while adding synchronized playback history and media utilities.
    - >
      The product later broadened from conventional local playback toward an integrated
      library that can organize local and cloud-hosted video across desktop and
      television devices.
  related-projects:
    - 迅雷看看, identified by the official FAQ as the predecessor
    - 迅雷云盘 and supported third-party cloud-storage services
  sources:
    - 'Official format page: https://video.xunlei.com/player/format'
    - 'Official help center: https://video.xunlei.com/aq_page.html'
    - 'Official macOS page: https://video.xunlei.com/mac.html'
    - source_facts.package-manager
  summary:
    - >
      迅雷影音, packaged on macOS as XLPlayer, is Xunlei's proprietary video player. It
      combines broad local-format playback, subtitles, a visual media library,
      cloud-source playback, and cross-device history synchronization.
  timeline:
    - 'By 2017: Xunlei maintained a dedicated official 迅雷影音 download and history surface.'
    - >
      2023: The official macOS page documented a staged expansion into cloud playback,
      audio and picture controls, smart libraries, third-party cloud services, local
      subtitles, WebDAV, and NAS access.
  usage:
    - >
      Users open or drag local video files into the player, manage a visual media
      library, select audio tracks, adjust picture and playback behavior, and load local
      or matched subtitles.
    - >
      The official product pages also describe direct playback from Xunlei, Baidu, and
      Alibaba cloud storage, plus WebDAV, NAS, and synchronized playback history across
      supported devices.
