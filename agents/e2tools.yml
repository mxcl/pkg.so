history:
  adoption-history:
    - >
      e2tools occupies a smaller niche than e2fsprogs but has durable packaging value:
      the README points to Repology for distribution packages, and the input package
      facts list packages across Homebrew, Debian, Ubuntu, Fedora, Alpine, Nix, and
      other ecosystems.
    - >
      The GitHub API showed 40 stars and 17 forks on 2026-06-30, matching a utility that
      is not fashionable but remains useful wherever build systems, embedded workflows,
      installers, or forensic tasks need direct edits to ext filesystem images.
  package-nerd-significance:
    - >
      e2tools is package-nerd significant because it is a thin, practical companion to
      e2fsprogs: not a replacement for `fsck` or `mkfs`, but a file-level toolbox for
      ext images. That makes it attractive in reproducible image builds, cross-platform
      repair kits, and minimal automation scripts.
    - >
      The README's alternatives section explains the tradeoff against kernel mounting
      and fuse2fs: e2tools uses the same e2fsprogs codebase, handles filesystem block
      sizes independently of kernel page size, and does not require mount privileges.
  project-history:
    - >
      The ChangeLog shows active development by Keith W. Sheffield in the early 2000s,
      with core commands such as `e2ln`, `e2mv`, `e2rm`, and `e2tail` appearing through
      2002 and build/documentation updates continuing into 2004.
    - >
      The GitHub repository was created in 2015 for the current public hosting lineage,
      but the project itself predates that import. Its README keeps the original
      motivation clear: copy files into a Linux filesystem from a machine that does not
      have ext2 support, or manipulate disk images on Linux without mounting them or
      requiring root.
  related-projects:
    - >
      e2tools is directly related to e2fsprogs because it requires e2fsprogs 1.27 or
      later and uses libext2fs for direct filesystem access.
    - >
      The README compares e2tools with the Linux kernel ext2 driver and fuse2fs, framing
      it as the no-mount, no-root option for file-level access to ext filesystem images.
  sources:
    - https://e2tools.github.io/
    - https://github.com/e2tools/e2tools
    - https://raw.githubusercontent.com/e2tools/e2tools/master/README.md
    - https://raw.githubusercontent.com/e2tools/e2tools/master/ChangeLog
    - https://api.github.com/repos/e2tools/e2tools
  summary:
    - >
      e2tools is a small GPL command suite for reading, writing, and manipulating files
      inside ext2, ext3, and ext4 filesystem images without mounting them. It wraps
      libext2fs from e2fsprogs and exposes familiar file operations through commands
      such as `e2cp`, `e2ls`, `e2mkdir`, `e2rm`, `e2mv`, `e2ln`, and `e2tail`.
  timeline:
    - '2002-03-05: ChangeLog records early command work, including `e2ln` integration.'
    - '2002-04-10: ChangeLog records `e2rm` as a new feature.'
    - '2002-08-08: ChangeLog records `e2tail` as a new feature suggested by Ralf Spenneberg.'
    - '2004-04-06: ChangeLog records basic user documentation added to the README.'
    - '2015-09-08: Current public GitHub repository created.'
    - '2024-09-15: GitHub API showed the repository had a recent push in September 2024.'
  usage:
    - >
      The command syntax treats an ext filesystem image or device plus a path as
      `filesystem:directory_path`. The README demonstrates making an image with `dd`,
      formatting it with `mkfs.ext2`, creating a directory with `e2mkdir`, listing with
      `e2ls`, copying with `e2cp`, and removing with `e2rm`.
    - >
      Its key use case is avoiding a mount step. On non-Linux systems it can access ext
      filesystems where the OS lacks native support; on Linux it can manipulate images
      or floppies without loopback mounting or root access.
related-packages:
  - id: brew:e2fsprogs
    reason: >
      e2tools uses e2fsprogs' libext2fs for file-level image access, while e2fsprogs
      supplies the complementary formatting, checking, resizing, tuning, and debugging
      commands for those ext filesystems.
    rel: adjacent_workflow
    sources:
      - https://e2tools.github.io/
      - https://github.com/tytso/e2fsprogs
