id: brew:cmake-lint
display-name: cmake-lint
repo: https://github.com/cmake-lint/cmake-lint
docs:
  - https://github.com/cmake-lint/cmake-lint#readme
config-file-location:
  unix:
    - $PWD/.cmakelintrc
    - ~/.config/cmakelintrc
    - $XDG_CONFIG_DIR/cmakelintrc
    - ~/.cmakelintrc
credentials-file-location: null
history:
  adoption-history:
    - >
      The project is distributed as the cmakelint Python package and the README gives
      pip installation instructions. The batch input lists Homebrew and Nix packages,
      and the README includes a pre-commit hook configuration, which makes it easy to
      adopt in project-level lint workflows.
  package-nerd-significance:
    - >
      cmake-lint matters as a small, packageable CMake hygiene tool: it gives package
      maintainers and CI pipelines a lightweight way to enforce CMake style without
      pulling in a full build-system rewrite or editor integration.
  project-history:
    - >
      The current GitHub repository describes itself as a fork of richq/cmake-lint
      created to continue maintenance. The bundled changelog records that version 1.2
      moved to GitHub and version 1.2.01 was published on PyPI; the GitHub API reports
      the current maintenance repository was created in June 2019.
  related-projects:
    - >
      cmake-lint is related to CMake, pre-commit, and other CMake formatting or editor
      tools such as cmake-format and cmake-language-server, but it remains focused on
      static lint checks.
  sources:
    - https://github.com/cmake-lint/cmake-lint#readme
    - https://raw.githubusercontent.com/cmake-lint/cmake-lint/master/CHANGELOG.md
    - https://api.github.com/repos/cmake-lint/cmake-lint
    - https://api.github.com/repos/cmake-lint/cmake-lint/releases
    - https://pypi.org/pypi/cmakelint/json
  summary:
    - >
      cmake-lint is a Python static style checker for CMake files. Its README describes
      a cmakelint command that parses CMake files, reports style issues, supports
      filters, and can be used directly or through pre-commit.
  timeline:
    - '2012: changelog records version 1.2 moving to GitHub and 1.2.01 being published on PyPI.'
    - '2019: current maintenance fork repository is created.'
    - >
      2024: version 1.4.3 adds Python 3.12 support and is published as the latest GitHub
      release checked.
  usage:
    - >
      Users run cmakelint with one or more CMake files and optional --config or --filter
      arguments. The README documents .cmakelintrc lookup in the working directory,
      XDG-style config paths, and the home directory, plus inline lint_cmake pragmas for
      per-file filter overrides.
related-packages:
  - id: brew:pre-commit
    reason: >
      pre-commit can install and run cmake-lint automatically using the hook
      configuration published by the cmake-lint repository.
    rel: adjacent_workflow
    sources:
      - https://github.com/cmake-lint/cmake-lint#readme
      - https://pre-commit.com/
  - id: brew:cmake
    reason: >
      CMake is the build-system tool that consumes the `CMakeLists.txt` and module files
      checked by cmake-lint.
    rel: adjacent_workflow
    sources:
      - https://github.com/cmake-lint/cmake-lint#readme
      - https://cmake.org/cmake/help/latest/manual/cmake-language.7.html
tags:
  - cli
  - cmake
  - developer-tools
  - linting
  - python
  - static-analysis
  - style-checker
geiger:
  category: appliance
  color: green
  confidence: low
  reason: narrow executable package without higher-risk signals
  reasons:
    - narrow executable package without higher-risk signals
  signals:
    - metadata:no-higher-risk-signals
provenance:
  category-sources:
