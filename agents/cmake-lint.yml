      source_facts.description says "Static code checker for CMake files"; official
      README says cmakelint parses CMake files and reports style issues.
  display-name-sources:
    - source_facts.name and official GitHub repository name.
  docs-sources:
    - >
      Official GitHub README provides installation, usage, and configuration:
      https://github.com/cmake-lint/cmake-lint#readme
  history-sources:
    - https://github.com/cmake-lint/cmake-lint#readme
    - https://raw.githubusercontent.com/cmake-lint/cmake-lint/master/CHANGELOG.md
    - https://api.github.com/repos/cmake-lint/cmake-lint
    - https://api.github.com/repos/cmake-lint/cmake-lint/releases
    - https://pypi.org/pypi/cmakelint/json
  repo-sources:
    - >
      Official GitHub project page from source_facts.homepage and README:
      https://github.com/cmake-lint/cmake-lint
  tags-sources:
    - >
      source_facts.description and executables; official README documents cmakelint CLI
      usage and configuration.
category-confidence: high
category-path:
  - developer-tools
  - linting
display-name-confidence: high
docs-confidence: high
history-confidence: high
