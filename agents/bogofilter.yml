credentials-file-location: null
history:
  adoption-history:
    - >
      Bogofilter was adopted by Unix mail users who wanted a local, trainable spam
      classifier that could plug into delivery agents and desktop mail clients. The
      official home page names KMail, Evolution, Claws Mail, maildrop, and
      procmail-style integration as usage surfaces.
    - >
      Its package reach is broad for a mail-filtering utility: the input package facts
      list Alpine, Homebrew, Debian, Fedora, MacPorts, Nix, Arch, Ubuntu, and openSUSE
      packaging. That distribution spread reflects how Bayesian filtering became normal
      infrastructure for local mail setups before hosted mail spam filtering took over
      much of the mainstream market.
  package-nerd-significance:
    - >
      Bogofilter is package-nerd significant because it captures a specific era of open
      source mail culture: local Unix mail delivery, procmail/maildrop recipes, Berkeley
      DB wordlists, and statistical filtering that users trained themselves.
    - >
      It is also an example of a mature C utility where packaging choices matter.
      Database backend support, Unicode and MIME handling, config-file defaults, and
      migration tooling all directly affect whether an upgrade preserves a user's
      trained corpus.
  project-history:
    - >
      Bogofilter appeared during the early-2000s wave of Bayesian spam filtering. Its
      official home page credits Eric S. Raymond with the initial version and says that,
      since 2002, David Relson, Matthias Andree, Greg Louis, and other open source
      volunteers brought it to maturity.
    - >
      The project explicitly roots its statistical approach in Paul Graham's 2002
      article on Bayesian spam filtering and Gary Robinson's refinements, including the
      Fisher inverse chi-square technique. The man page describes further practical
      engineering: MIME decoding, HTML parsing, token handling for hosts and IP
      addresses, and production-oriented database lookups.
    - >
      The release history shows a long maintenance arc from the 1.2.x line into 1.3.0
      release candidates. Recent entries include the 2019 Git repository conversion,
      maintenance after David Relson's death, C99 cleanup, SQLite3 driver work, and the
      2025 decision to make SQLite3 the default database driver.
  related-projects:
    - >
      Related projects include SpamAssassin, DSPAM, CRM114, procmail, maildrop, KMail,
      Evolution, and Claws Mail. Bogofilter occupies the small, fast, user-trained
      filter niche rather than the rule-heavy network-scored niche associated with
      SpamAssassin.
  sources:
    - https://bogofilter.sourceforge.io/
    - https://bogofilter.sourceforge.io/NEWS
    - https://bogofilter.sourceforge.io/faq.shtml
    - https://bogofilter.sourceforge.io/man_page.shtml
    - input.source_facts.package-manager
  summary:
    - >
      Bogofilter is a fast C-based Bayesian mail filter that classifies messages as spam
      or ham by statistical analysis of message headers and body text.
  timeline:
    - >
      2002: Initial Bogofilter work by Eric S. Raymond is followed by maturation by
      David Relson, Matthias Andree, Greg Louis, and volunteers.
    - >
      2003: Paul Graham's later Bayesian filtering work and Gary Robinson's refinements
      are reflected in Bogofilter's documented algorithmic approach.
    - "2013: Matthias Andree becomes maintainer after David Relson's long maintainership."
    - '2019: The source repository is converted to Git; Bogofilter 1.2.5 is released.'
    - '2024: 1.3.0 beta work resumes with Unicode, lexer, and corruption fixes.'
    - '2025: 1.3.0 release candidates make SQLite3 the default database driver.'
  usage:
    - >
      Common usage is pipeline-oriented: feed a message to `bogofilter`, inspect its
      spam, ham, or unsure result, and train it with known spam and non-spam examples.
      Companion tools such as `bogoutil`, `bogotune`, `bogolexer`, and database
      copy/compact helpers support training, tuning, inspection, and migration.
    - >
      The man page emphasizes script-friendly behavior, including terse modes,
      passthrough headers, bulk processing, explicit registration as spam or non-spam,
      and configuration options for wordlists and database directories.
related-packages:
