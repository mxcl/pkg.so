history:
  adoption-history:
    - >
      Royal TS began as freeware and later adopted a shareware model that retained free
      use for small environments. The official history records strong interest in the
      final freeware release and describes user feedback as an important influence on
      the redesigned product.
    - >
      Royal TSX extended the product family to macOS and allowed teams to share the same
      connection-and-credential documents across platforms without requiring a server.
  package-nerd-significance:
    - >
      Royal TSX represents the package-manager niche of proprietary, plugin-oriented
      administration clients. Its cask makes a multi-protocol operations workstation
      reproducible while Royal Documents keep connection definitions portable across
      Royal TS and Royal TSX.
  project-history:
    - >
      The Royal TS family began in 2003 as a Windows utility for managing Remote Desktop
      sessions. Work during 2010 and 2011 produced a redesigned, extensible second
      generation with credential management and support for additional connection types.
    - >
      After Royal TS 2, development expanded to macOS. Following roughly a year of
      development, Felix Deimel released Royal TSX V1 as the Mac counterpart, sharing
      the Royal Document format with Royal TS.
  related-projects:
    - >
      Royal TS is the Windows counterpart. Royal Server supplies optional centralized
      services, while Royal Documents are the portable data format shared by Royal TS
      and Royal TSX.
  sources:
    - https://docs.royalapps.com/
    - https://www.royalapps.com/blog/more-than-10-years-of-royal-ts-history
    - https://www.royalapps.com/ts/mac/features
    - source_facts.package-manager.brew-cask
  summary:
    - >
      Royal TSX is the macOS member of the Royal Apps remote-management family,
      providing a unified workspace for multiple connection protocols.
  timeline:
    - '2003: The first public Royal TS version was released.'
    - '2010–2011: Development began on an extensible Royal TS V2 architecture.'
    - 'By 2013: Royal TSX V1 had extended the Royal Document workflow to macOS.'
  usage:
    - >
      Administrators install the required plugins, create Royal Documents, and organize
      remote desktop, terminal, file-transfer, web, credential, and task objects.
      Credentials may be embedded in protected documents or referenced by name from
      separate personal documents.
