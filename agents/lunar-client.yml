id: cask:lunar-client
display-name: Lunar Client
repo: null
docs:
  - https://support.lunarclient.com/support/home
config-file-location:
  macos:
    - ~/.lunarclient/settings/game
  windows:
    - '%USERPROFILE%\.lunarclient\settings\game'
credentials-file-location:
  macos:
    - ~/.lunarclient/settings/game/accounts.json
  windows:
    - '%USERPROFILE%\.lunarclient\settings\game\accounts.json'
history:
  adoption-history:
    - >
      Lunar Client developed into a cross-platform Minecraft client offering a single
      installation, more than 65 modifications, performance improvements, settings, and
      cosmetics. Its official seventh-anniversary article in 2026 indicates that the
      project dates to 2019.
  package-nerd-significance:
    - >
      Lunar Client is notable in package-manager culture as a proprietary, self-updating
      game client whose package primarily bootstraps a larger managed Minecraft
      environment. Packaging it makes installation repeatable even though game
      components, modifications, and account state are subsequently managed by the
      client.
  project-history:
    - >
      Lunar Client is developed by Moonsworth as a free client and modpack for
      Minecraft. Although the supplied package description mentions Minecraft 1.7.10 and
      1.8.9, the current official site describes support for modern Minecraft versions.
  related-projects:
    - 'Minecraft: Java Edition'
    - Badlion Client
  sources:
    - https://support.lunarclient.com/support/home
    - >
      https://support.lunarclient.com/support/solutions/articles/60001645659-external-software-interfering-with-lunar-client
    - https://www.lunarclient.com/
    - https://www.lunarclient.com/news/lunar-client-7th-anniversary-rewards-cosmetics-more
  summary:
    - >
      Lunar Client is a proprietary, cross-platform Minecraft client combining a
      launcher, bundled modifications, performance features, settings, and cosmetics.
  timeline:
    - >
      2019: Lunar Client's inferred launch year, based on its official
      seventh-anniversary publication in 2026.
    - >
      2026: The official site advertised more than 65 modifications and support for
      Windows, macOS, and Linux.
  usage:
    - >
      Users install the launcher, authenticate with a Minecraft-capable Microsoft
      account, choose a supported game version, and launch Minecraft with the client's
      bundled modifications and performance features.
    - >
      The official troubleshooting guide identifies accounts.json as the file holding
      stored accounts and recommends deleting it when resetting account state.
