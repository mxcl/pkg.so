id: brew:git-multipush
display-name: git-multipush
repo: https://github.com/gavinbeatty/git-multipush
docs:
  - https://github.com/gavinbeatty/git-multipush#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The project stayed niche, but it entered Homebrew as a formula, which made it easy
      for macOS and Linuxbrew users to install a Git extension that otherwise followed a
      classic source-install workflow. GitHub metadata records a small public audience
      rather than broad ecosystem adoption.
  package-nerd-significance:
    - >
      The package is a snapshot of early distributed-forge Git habits: before one forge
      dominated many workflows, developers often mirrored projects across several hosts.
      As a package, it is interesting because it wraps Git config and git-push without
      adding a service dependency.
  project-history:
    - >
      Gavin Beatty published git-multipush as a POSIX shell-oriented Git subcommand with
      a generated manpage and a traditional Makefile install path. GitHub records the
      repository creation on 2010-02-04, and the README copyright and first tag both
      point to 2010 as the initial public period.
  related-projects:
    - git-push
    - Git remote configuration
    - Homebrew formulae for Git extensions
  sources:
    - https://formulae.brew.sh/formula/git-multipush
    - https://github.com/gavinbeatty/git-multipush
    - https://raw.githubusercontent.com/gavinbeatty/git-multipush/main/README.mkd
  summary:
    - >
      git-multipush is a small Git extension for pushing one branch to several remotes
      with one command. Its README frames the tool around a 2010 multi-forge workflow,
      naming GitHub, Gitorious, and repo.or.cz as examples of places where the same
      repository might be hosted.
  timeline:
    - '2010: Repository and first public tag appeared on GitHub.'
    - '2010: v2.3 and v2.4 release-candidate tags followed during early iteration.'
    - '2020: Repository activity included a push after the early release period.'
  usage:
    - >
      Practitioners use git-multipush when they maintain the same branch on several Git
      remotes. The command can push to explicit remotes, save per-branch remote lists in
      Git config, print configured remotes, run dry runs, and choose whether a failed
      push stops the whole operation or is reported after other pushes have been
      attempted.
related-packages:
  - id: brew:git
    reason: >
      Modern Git can attach multiple push URLs to one remote with `git remote set-url
      --add --push`; choose that built-in configuration when one logical remote should
      fan out, or git-multipush when you want named per-branch remote lists and its
      failure controls.
    rel: alternative
    sources:
      - https://github.com/gavinbeatty/git-multipush#readme
      - https://git-scm.com/docs/git-remote
tags:
  - cli
  - git
  - git-extension
  - git-push
  - multiple-remotes
