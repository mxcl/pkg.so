history:
  adoption-history:
    - >
      The package is widely carried because libimobiledevice-based tooling needs a
      portable way to reach device services over USB or network sync. The 1.0.9 release
      notes identify it as the first release after splitting usbmuxd and libusbmuxd,
      which made the daemon and client library easier for distributions to package
      separately.
  package-nerd-significance:
    - >
      It is one of the plumbing packages that makes non-Apple iOS workflows possible:
      device pairing, service access, backups, testing, and debugging stacks commonly
      depend on this small multiplexing layer.
  project-history:
    - >
      The library grew out of the libimobiledevice ecosystem, which provides open-source
      userspace tools for communicating with iPhone, iPad, and iPod touch devices. Its
      README describes libusbmuxd as a client library that does not talk directly to a
      device; it connects to a socket exposed by a usbmuxd daemon, using Apple's daemon
      on macOS and Windows or the libimobiledevice usbmuxd daemon on Linux.
  related-projects:
    - >
      libimobiledevice is the higher-level project that uses libusbmuxd for iOS service
      communication.
    - usbmuxd is the daemon side of the protocol.
    - libplist and libimobiledevice-glue are related libimobiledevice dependencies.
  sources:
    - https://github.com/libimobiledevice/libusbmuxd
    - https://raw.githubusercontent.com/libimobiledevice/libusbmuxd/master/NEWS
    - https://raw.githubusercontent.com/libimobiledevice/libusbmuxd/master/README.md
    - https://www.libimobiledevice.org/
  summary:
    - >
      libusbmuxd is the libimobiledevice client library and tool set for talking to the
      usbmux protocol used to multiplex connections to services on iOS devices.
  timeline:
    - '1.0.9: First release after the usbmuxd/libusbmuxd project split.'
    - >
      2.0.0: Added support for USB and network devices reported by usbmuxd and
      introduced new context-aware event subscription APIs.
    - >
      2.0.2: Renamed the library/API-versioned files to libusbmuxd-2.0 and added man
      pages for iproxy and inetcat.
    - '2.1.0: Moved socket code to libimobiledevice-glue and added libusbmuxd_version().'
  usage:
    - >
      Most users encounter libusbmuxd through higher-level tools, but the package also
      ships iproxy for forwarding a local TCP port to a service on a connected iOS
      device and inetcat for exposing a raw connection.
related-packages:
  - id: brew:libimobiledevice
    reason: >
