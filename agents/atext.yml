history:
  adoption-history:
    - >
      aText expanded from a macOS utility into a cross-platform macOS and Windows
      product. Its data-transfer and synchronization features support moving snippet
      collections between computers and sharing them through common cloud-storage
      services.
  package-nerd-significance:
    - >
      aText belongs to the classic power-user category of text expanders: small resident
      utilities that trade short abbreviations for substantial reductions in repetitive
      typing. Package users care about its automation variables, scripting, portable
      mode, cross-platform synchronization, and the distinction between current and
      legacy macOS editions.
  project-history:
    - >
      aText is developed by Tran Ky Nam Software. The current generation supports macOS
      and Windows, while the official site retains separate legacy documentation for
      aText 2 on macOS. The macOS 3.x changelog records continuing additions such as
      scripting, structured fields, application-specific behavior, JSON import and
      export, and portable mode.
  related-projects:
    - >
      aText can exchange CSV data with other snippet applications and synchronize
      through storage services such as iCloud Drive, Dropbox, Google Drive, and
      OneDrive.
  sources:
    - 'Official FAQ: https://www.trankynam.com/atext/doc/'
    - 'Official macOS changelog: https://www.trankynam.com/atext/changelog.mac'
    - 'Official product page: https://www.trankynam.com/atext/'
  summary:
    - >
      aText is a macOS and Windows text-expansion and automation utility that replaces
      user-defined abbreviations with reusable plain text, rich content, variables, or
      scripted output.
  timeline:
    - 'Legacy era: aText 2 served as the earlier macOS generation.'
    - >
      2022: The 3.x macOS series added and refined scripting, fields, snippet
      suggestions, and application-specific controls.
    - '2023: The macOS edition added JSON import/export and expanded AppleScript commands.'
    - >
      2024: Version 3.19 added portable mode; version 3.21 improved rich-text variable
      editing.
  usage:
    - >
      Users define abbreviations and associated snippets, then leave aText enabled to
      expand them while typing in other applications. Snippets can include rich text,
      images, date/time values, fields, keystrokes, and scripts. Data can be exported,
      imported, synchronized, and restored from automatic backups.
