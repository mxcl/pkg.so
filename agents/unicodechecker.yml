history:
  adoption-history:
    - >
      UnicodeChecker has served macOS users who need a native character inspector and
      converter without writing code or consulting raw Unicode data files. Its
      integration with macOS Services, AppleScript, Spotlight, and Quick Look extended
      its functions beyond the main application.
    - >
      The official archive offers older builds for several generations of Mac OS X and
      processor architecture, allowing the utility to remain usable on legacy Macs as
      well as current systems.
  package-nerd-significance:
    - >
      UnicodeChecker is a durable specialist utility whose releases track both Apple's
      platform transitions and new Unicode Character Database versions. Its history
      spans PowerPC, Universal Binary, Intel, and Apple Silicon eras.
    - >
      For package maintainers, it illustrates a package whose meaningful compatibility
      metadata includes both the minimum macOS version and the Unicode data revision it
      understands.
  project-history:
    - >
      EarthlingSoft developed UnicodeChecker as a freeware macOS application for
      exploring code points, names, encodings, decompositions, Unihan data, and related
      characters, and for converting text among web, URL, normalization, and
      programming-language representations.
    - >
      Over time the application added Services and AppleScript automation, Spotlight
      indexing, conversion utilities, advanced property searches, Dark Mode, Apple
      Silicon support, and updated Unicode data.
  related-projects:
    - >
      UnicodeChecker consumes data defined by the Unicode Standard and complements macOS
      Character Viewer, programming-language Unicode libraries, encoding converters, and
      command-line character-inspection tools.
  sources:
    - https://earthlingsoft.net/UnicodeChecker/
    - source_facts.description
    - source_facts.homepage
  summary:
    - >
      UnicodeChecker is EarthlingSoft's freeware macOS utility for inspecting Unicode
      characters and converting text among encodings, normalization forms, web formats,
      and programming-language representations.
  timeline:
    - >
      2002: The official version history records the 1.5.x series and Unicode conversion
      services.
    - '2005: UnicodeChecker added Spotlight support and an Apple Help book.'
    - >
      2006: Version 1.10 became a Universal Binary and expanded AppleScript and Unihan
      support.
    - '2015: Version 1.16 introduced advanced property-based code-point search.'
    - '2020: Version 1.22 added Dark Mode compatibility and Unicode 13 data.'
    - '2021: Version 1.23 added Apple Silicon support and Unicode 14 data.'
    - '2025: Version 1.25 adopted Unicode 17 data.'
  usage:
    - >
      Users browse or search for a character, inspect its code point, encodings,
      properties, decomposition, related characters, and Unihan information, or analyze
      strings with Split Up and Diff tools.
    - >
      Conversion features handle HTML, CSS, URLs, IDNA, programming-language escapes,
      and Unicode normalization. Many operations are also available to other macOS
      applications through Services and AppleScript.
