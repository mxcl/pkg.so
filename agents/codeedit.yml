history:
  adoption-history:
    - >
      CodeEdit has developed as a community-led open-source project, with public
      pre-release builds and contributions spread across the main application and
      related editor, language, extension, and command-line repositories. The project
      still describes the editor as under development and not yet recommended for
      production use.
  package-nerd-significance:
    - >
      CodeEdit interests macOS package users because it is written natively in Swift
      rather than built on a cross-platform web shell. It offers a publicly developed,
      free editor positioned between lightweight text editing and a fuller Xcode-like
      environment.
  project-history:
    - >
      CodeEdit began from the question of whether developers working outside
      Apple-platform projects could have a code editor with the native macOS experience
      associated with Xcode. The community-led project committed to remaining open
      source and free while growing from a lightweight editor toward richer IDE
      features.
  related-projects:
    - >
      CodeEditCLI, CodeEditSourceEditor, CodeEditTextView, CodeEditLanguages, and
      CodeEditKit are official related repositories. Xcode and Visual Studio Code occupy
      adjacent native-IDE and extensible-editor roles.
  sources:
    - 'Official CodeEdit documentation: https://docs.codeedit.app/'
    - 'Official CodeEdit homepage: https://www.codeedit.app/'
    - 'Official CodeEdit repository: https://github.com/CodeEditApp/CodeEdit'
  summary:
    - >
      CodeEdit is a free, open-source code editor built specifically for macOS in Swift.
      It emphasizes native performance and interface conventions while adding project
      search, completion, terminal, tasks, debugging, Git, code review, and extensions.
  timeline:
    - >
      The project formed as a community-led effort to create a native macOS editor for
      projects beyond Apple's platform stack.
    - The v0.1.0 release established the current public pre-release series.
    - >
      The v0.3 series expanded restoration, task output, external-file handling,
      language-server installation, and editor settings.
  usage:
    - >
      Developers open a file or folder as a workspace, edit and search source, run tasks
      or terminal commands, and use language-aware and version-control features. The
      official repository warns that the application remains in development, so users
      should expect pre-release changes.
