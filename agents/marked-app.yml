config-file-location:
  macos:
    - ~/Library/Application Support/Marked/ExportProfiles.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      Marked found a durable niche among macOS writers who prefer editing in a dedicated
      text editor while keeping a separate, automatically refreshed preview window. Its
      integration model supports Markdown editors as well as writing tools and document
      formats such as Scrivener.
    - >
      Successive generations broadened the application from Markdown previewing into
      proofreading, statistics, link validation, custom processing, and export
      workflows. Marked 3 continues that approach with modernized settings,
      localization, Quick Look support, command-line automation, and expanded export
      capabilities.
  package-nerd-significance:
    - >
      Marked exemplifies the Unix-friendly macOS pattern of composing specialized tools:
      users retain their preferred editor while delegating rendering, validation, and
      export to another application.
    - >
      Its command-line utility, URL scheme, custom processors, CSS styles, document
      metadata, and Homebrew cask make the otherwise graphical commercial application
      useful in scripted and package-managed writing environments.
  project-history:
    - >
      Marked was created by independent developer Brett Terpstra as a macOS preview
      companion for plain-text writing. Its defining design separates editing from
      presentation: Marked watches source files and refreshes a styled rendering as they
      change.
    - >
      The application evolved through multiple major generations while retaining that
      companion-tool model. It added support for multiple Markdown processors and other
      markup or writing formats, custom CSS, document statistics, proofreading, link
      checking, and export to formats including HTML, PDF, EPUB, and word-processing
      documents.
  related-projects:
    - 'MultiMarkdown and CommonMark: Markup dialects/processors supported by Marked.'
    - 'Pandoc: External processor commonly used in advanced Marked workflows.'
    - >
      Scrivener and Obsidian: Writing environments covered by Marked's official
      integration documentation.
  sources:
    - https://markedapp.com/
    - https://markedapp.com/about/
    - https://markedapp.com/help/Command_Line_Utility
    - https://markedapp.com/help/Per-Document_Settings
    - https://markedapp.com/help/changelog
    - https://markedapp.com/help/index
  summary:
    - >
      Marked is a commercial macOS preview, proofreading, and conversion companion for
      Markdown and other text-based writing formats. It is designed to work alongside a
      user's preferred editor rather than replace it.
  timeline:
    - >
      Original era: Brett Terpstra created Marked as a dedicated macOS preview companion
      for plain-text writers.
    - >
      Marked 2 era: The application expanded its processors, writing integrations,
      analysis tools, custom styling, and export workflow.
    - >
      Marked 3 era: The product added a redesigned settings system, broader
      localization, Quick Look features, enhanced automation, and continuing export
      improvements.
  usage:
    - >
      A typical workflow is to open a Markdown file or writing-project document in
      Marked while editing it elsewhere. Marked watches for changes and refreshes a
      styled preview, allowing the user to inspect formatting, readability statistics,
      spelling and grammar indicators, links, and document structure.
    - >
      Advanced users install custom CSS, choose or invoke external processors, set
      per-document metadata, automate the application through the mk command-line
      utility or URL scheme, and export publication-ready HTML, PDF, EPUB, or
      word-processing files.
