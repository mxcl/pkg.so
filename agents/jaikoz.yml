    - ~/.jaikoz/license.jai
  macos:
    - ~/Library/Preferences/Jaikoz/license.jai
  windows:
    - C:\Users\<username>\Jaikoz\license.jai
history:
  adoption-history:
    - >
      Jaikoz has remained actively developed as JThink's comprehensive tagger and is
      offered with comparable functionality on macOS, Windows, and Linux.
    - >
      Its integrations with MusicBrainz, Discogs, and AcoustID made it useful to
      collectors who want automated identification while retaining spreadsheet-style
      control over proposed metadata changes.
  package-nerd-significance:
    - >
      Jaikoz sits at the intersection of local file tagging and community-maintained
      music databases. It can identify recordings acoustically, reconcile metadata,
      expose uncommon tag fields, and rename files and folders from corrected metadata.
    - >
      For large-library maintainers, its combination of batch automation,
      before-and-after review, duplicate detection, and broad audio-format support makes
      it more than a simple tag editor.
  project-history:
    - >
      JThink has operated since 2006, and describes Jaikoz as its long-running
      comprehensive music tagger. The application has continued to gain format support
      and increasingly detailed matching through MusicBrainz, Discogs, AcoustID, and
      JThink's own mediation services.
    - >
      Jaikoz was designed as a cross-platform tag editor rather than a music player. Its
      interface combines a spreadsheet-like editor with automated correction workflows
      intended to process large collections.
  related-projects:
    - SongKong
    - MusicBrainz
    - Discogs
    - AcoustID
  sources:
    - https://community.jthink.net/t/where-are-settings-stored/13970
    - https://www.jthink.net/jaikoz/
    - https://www.jthink.net/jaikoz/jsp/help/osx/help.html
    - https://www.jthink.net/songkong/details2.jsp
  summary:
    - >
      Jaikoz is a commercial, cross-platform audio metadata editor that combines batch
      spreadsheet editing with automated identification and correction services.
  timeline:
    - >
      2006: JThink began operating; Jaikoz became its long-running comprehensive tagging
      application.
    - >
      Subsequent development added and refined integrations with MusicBrainz, Discogs,
      and AcoustID while expanding audio-format and metadata-field support.
  usage:
    - >
      Open folders or files, run AutoCorrect to identify and normalize metadata, inspect
      the proposed changes, make any manual edits, and save the updated tags.
    - >
      Common workflows include retrieving artwork, finding duplicates, correcting genres
      and classical metadata, renaming files and directories from tags, and processing
      large mixed-format libraries.
