history:
  adoption-history:
    - >
      Swinsian has continued as a paid, independently distributed macOS application
      across multiple major releases. Its feature set is directed at listeners who
      maintain local music libraries and need detailed tag editing, browsing, duplicate
      detection, and support for varied audio formats.
  package-nerd-significance:
    - >
      Swinsian is a representative Homebrew cask for a proprietary application
      distributed outside the Mac App Store. It appeals to users who want a focused
      local-library player with metadata tooling and format support instead of a
      streaming-centered service.
  project-history:
    - >
      Swinsian was developed as a dedicated macOS music player and library manager. The
      2.x series refined its browser and tag-oriented library interface. Swinsian 3
      added native Apple Silicon support, expanded classical-music metadata, ReplayGain
      and SoundCheck handling, more audio-device controls, playlist and library export
      improvements, and dark mode.
  related-projects:
    - Apple Music
    - iTunes-compatible XML libraries
    - ReplayGain
  sources:
    - https://swinsian.com/
    - https://swinsian.com/blog/2018/01/30/swinsian-2-dot-1/
    - https://swinsian.com/blog/2025/08/19/swinsian-3/
    - https://swinsian.com/support/
  summary:
    - >
      Swinsian is a native macOS music player and manager designed around locally
      maintained audio libraries.
  timeline:
    - >
      2018-01-30: Swinsian 2.1 expanded browser customization and multi-value metadata
      handling.
    - >
      2025-08-19: Swinsian 3 added native Apple Silicon support and a substantial set of
      library, audio, export, and interface features.
  usage:
    - >
      Users import and browse a local music library, edit tags, detect duplicates,
      manage playlists, and play supported audio formats. Swinsian 3 can export
      playlists with their music files or export the library as iTunes-style XML for use
      by other applications.
