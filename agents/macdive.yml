history:
  adoption-history:
    - >
      MacDive has expanded over the years from desktop dive logging into a cross-device
      workflow with macOS and iOS clients. Its official documentation supports
      migrations, cloud synchronization, file imports, and downloads from numerous dive
      computers.
  package-nerd-significance:
    - >
      MacDive is a specialist example of package-managed hardware-adjacent software:
      installing the application is simple, while its practical value depends on device
      compatibility, durable local records, import formats, and synchronization between
      computers and mobile devices.
  project-history:
    - >
      MacDive was developed as a native digital dive log for Apple platforms. The
      official guide notes that the application has accumulated many features over the
      years, including structured records for dives, sites, gear and marine life, direct
      dive-computer downloads, smart logs, images, and cloud synchronization.
  related-projects:
    - The MacDive iOS application shares dive data with the macOS application.
    - Dropbox and iCloud are supported cloud-sync providers.
    - Supported dive computers and file-based logbook formats supply data to MacDive.
  sources:
    - https://www.mac-dive.com/help/ios_01_11_cloud.php
    - https://www.mac-dive.com/help/mac.php
    - https://www.mac-dive.com/help/mac_04_01_userdata.php
  summary:
    - >
      MacDive is a proprietary digital dive log for macOS and iOS that organizes dive
      records and imports data from dive computers and files.
  timeline:
    - >
      Over successive releases: MacDive expanded its dive log with gear, site, image,
      smart-log, import, and synchronization features.
  usage:
    - >
      Divers use MacDive to download or import dive records, annotate dives with sites,
      equipment, tags, critters and images, and organize them into logs. Optional
      Dropbox or iCloud synchronization can keep records aligned across Macs and iOS
      devices.
