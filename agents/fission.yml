credentials-file-location: null
history:
  adoption-history:
    - >
      Fission became a long-lived Mac audio utility distributed both directly and, for a
      period, through the Mac App Store. Version 2.7.1 in 2021 ended Mac App Store
      distribution and returned the application to exclusive direct distribution through
      Rogue Amoeba.
    - >
      Homebrew Cask offers a package-managed installation path alongside Rogue Amoeba's
      direct-download trial/full-version installer.
  package-nerd-significance:
    - >
      Fission occupies a distinctive niche among Mac packages: it can make many MP3 and
      AAC edits without re-encoding, avoiding generational quality loss. Its
      direct-download licensing model, extensive legacy-build support, long release
      history, and Homebrew Cask packaging make it a recognizable proprietary utility in
      Mac software collections.
  project-history:
    - >
      Rogue Amoeba released Fission 1.0 on September 18, 2006 as a streamlined Mac audio
      editor. Early releases expanded waveform editing, normalization, cue sheets,
      metadata handling, and format support.
    - >
      Fission 2.0, released September 17, 2012, introduced a redesigned interface, FLAC
      and WAV editing, format export, batch conversion, and chapterized-audio workflows.
      Later releases tracked macOS changes, broadened accessibility, and modernized the
      interface while preserving the application's focus on simple, lossless editing.
  related-projects:
    - >
      Fission complements Rogue Amoeba audio applications such as Audio Hijack, Piezo,
      and Farrago. Common workflow alternatives include full digital audio workstations
      and general-purpose waveform editors, although Fission emphasizes lightweight
      lossless editing.
  sources:
    - 'Official manual: https://rogueamoeba.com/support/manuals/fission/'
    - 'Official product page: https://www.rogueamoeba.com/fission/'
    - 'Official release notes: https://rogueamoeba.com/support/releasenotes/?product=Fission'
  summary:
    - >
      Fission is Rogue Amoeba's macOS audio editor for rapid trimming, splitting,
      joining, metadata editing, and format conversion, including lossless editing of
      supported compressed formats.
  timeline:
    - '2006-09-18: Fission 1.0.0 was released.'
    - >
      2012-09-17: Fission 2.0.0 introduced a redesigned interface, FLAC/WAV editing,
      export, and batch conversion.
    - >
      2021-09-02: Version 2.7.1 moved distribution exclusively to RogueAmoeba.com and
      made the manual web-based.
    - '2025-09-10: Version 2.9.0 introduced a refreshed interface and initial macOS 26 support.'
    - '2026-03-02: Version 2.9.4 was released.'
  usage:
    - >
      Fission is commonly used to trim recordings, remove unwanted sections, split long
      recordings by silence, join files, edit metadata, create chapterized audio or
      ringtones, and batch-convert among MP3, AAC, Apple Lossless, FLAC, AIFF, and WAV.
