history:
  adoption-history:
    - >
      Inkspace accompanied Wacom's Bamboo Slate and Bamboo Folio smartpads and also
      supported the Intuos Pro Paper Edition. Its niche was converting paper-based
      drawing and note-taking into synchronized digital material.
    - >
      Wacom retired Inkspace from application stores in 2026. Existing installations can
      continue to work, but Wacom no longer provides updates, reinstallation, or
      technical support.
  package-nerd-significance:
    - >
      Inkspace represents a hardware-adjacent desktop package whose usefulness depends
      on both compatible Wacom devices and a vendor cloud service. Its retirement
      illustrates why package availability alone does not guarantee that a
      cloud-connected proprietary application remains supportable.
    - >
      The official retirement guidance makes exporting data especially important: users
      should preserve notes as standard files rather than depend on an application that
      can no longer be reinstalled.
  project-history:
    - >
      Wacom introduced the Inkspace application and cloud workflow alongside the Bamboo
      Slate and Bamboo Folio smartpads in 2016. The service synchronized digitized
      handwriting and sketches through a Wacom ID.
    - >
      Wacom later announced the end of life of Inkspace, Bamboo Paper, and Wacom Notes.
      Removal from major application stores was postponed to late January 2026, after
      which existing installations became unsupported.
  related-projects:
    - >
      Bamboo Slate and Bamboo Folio were smartpads designed to capture paper notes
      through Inkspace.
    - Wacom Intuos Pro Paper Edition could transfer captured paper sketches into Inkspace.
    - Bamboo Paper and Wacom Notes were retired in the same end-of-life program.
  sources:
    - https://support.wacom.com/hc/en-us/articles/1500006264821-How-does-Wacom-Inkspace-Work
    - >
      https://support.wacom.com/hc/en-us/articles/36070902398231-Bamboo-Paper-Inkspace-Wacom-Notes-application-End-of-Life-Notification
    - https://wacom.com/en-gb/about-wacom/news-and-events/2016/gb-1188
  summary:
    - >
      Wacom Inkspace was a note and sketch synchronization application for compatible
      Wacom paper-capture devices. It paired captured handwriting with a Wacom ID so
      material could be backed up and accessed across devices.
  timeline:
    - >
      2016: Wacom introduced new Inkspace features with the Bamboo Slate and Bamboo
      Folio smartpads.
    - '2025: Wacom announced that Inkspace had reached end of life.'
    - >
      January 2026: Removal from major application stores was scheduled after a short
      postponement.
  usage:
    - >
      Users paired a supported Wacom smartpad or paper-enabled tablet, signed in with a
      Wacom ID, and synchronized captured notes and drawings across devices.
    - >
      Wacom's retirement guidance recommends exporting Inkspace notes as PDF, PNG, or
      JPG for durable local access.
