history:
  adoption-history:
    - >
      The desktop application extends Perplexity's web experience by allowing explicitly
      connected local folders, supported native applications, and browsers to
      participate in tasks. Perplexity documents desktop availability on macOS and
      Windows, while the Personal Computer feature is centered on the Mac application.
    - >
      Perplexity promotes the Mac mini as an optional always-on host, although the
      application runs on other supported Macs. Phone pairing enables remote task
      initiation and approval of sensitive actions.
  package-nerd-significance:
    - >
      The application represents a shift from packaging an AI chat client to packaging a
      privileged desktop agent. Its requests for Accessibility, screen and system-audio
      recording, and Full Disk Access make installation provenance, permission review,
      and controlled folder access especially important to package-conscious users.
  project-history:
    - >
      Perplexity developed its desktop application beyond a conventional answer-engine
      client into a local agent environment. The Personal Computer experience combines
      Perplexity Computer with local file access, supported macOS application control,
      voice interaction, the Comet browser, and remote operation.
  related-projects:
    - >
      Perplexity Computer is the cloud-based agent feature embedded within the broader
      Personal Computer experience.
    - Comet is Perplexity's browser and handles supported web actions for the desktop agent.
  sources:
    - >
      Official Personal Computer overview:
      https://www.perplexity.ai/help-center/en/articles/14659663-what-is-personal-computer
    - >
      Official application overview:
      https://www.perplexity.ai/help-center/en/articles/19800001-about-the-app
    - >
      Official getting-started guide:
      https://www.perplexity.ai/help-center/en/articles/19800002-get-started
    - 'Official setup guide: https://www.perplexity.ai/personal-computer-setup'
  summary:
    - >
      Perplexity is a desktop AI application and agent environment. It can answer
      questions and, when authorized, work with local files, supported applications,
      browsers, voice input, and remotely initiated tasks.
  timeline:
    - >
      2026: Perplexity documents Personal Computer as a rebuilt Mac experience centered
      on its Computer agent.
    - >
      2026: Official desktop documentation covers both Mac and Windows installation,
      with installed-application control available on Mac.
  usage:
    - >
      Users install the application, sign in to a Perplexity account, approve only the
      required macOS permissions, and connect selected folders and applications.
      Personal Computer can organize or edit local files, operate supported applications
      through the desktop, delegate browser work to Comet, and accept remotely initiated
      tasks.
