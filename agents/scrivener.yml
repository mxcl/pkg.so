  summary:
    - >
      Scrivener is Literature & Latte's project-based writing environment for planning,
      researching, drafting, restructuring, and compiling long-form manuscripts.
  timeline:
    - >
      2005–2006: Early development and testing proceeded through Scrivener Gold and
      pre-1.0 betas.
    - 'January 2007: Scrivener 1.0 was released for Mac.'
    - '2017: Scrivener 3 began the current major-generation documentation line on macOS.'
    - 'Later expansion: Literature & Latte released Scrivener editions for Windows and iOS.'
  usage:
    - >
      Writers create a separate Scrivener project for a major work, break the draft into
      folders and documents in the binder, and arrange or inspect those pieces with
      corkboard, outliner, and Scrivenings views. Research can live alongside the
      manuscript.
    - >
      Users track metadata and writing targets, take snapshots, and compile the
      project's component documents into submission, print, ebook, or other output
      formats. Application settings coexist with project- and document-specific
      settings, while the project itself remains a user-selected file.
