history:
  adoption-history:
    - >
      Scrivener's pre-1.0 development was shaped by users of Scrivener Gold and public
      betas. Keith Blount reported purchases, published-author use, television-treatment
      work, and interest from the Mac press during the first week after the commercial
      1.0 release.
    - >
      Literature & Latte later described Scrivener as adopted by hundreds of thousands
      of writers, ranging from novices and students to novelists, academics, and
      professional screenwriters. The application expanded from its original Mac release
      to Windows and iOS while preserving a project format centered on long-form work.
  package-nerd-significance:
    - >
      Scrivener helped establish the dedicated long-form writing application as a
      recognizable desktop-software category. Its binder, corkboard, outliner, metadata,
      snapshots, and compile pipeline separate drafting and structural organization from
      final document production.
    - >
      Package enthusiasts value it as a durable, independently developed Mac application
      with deep native-workflow roots, a substantial manual produced using Scrivener
      itself, and a project-based model that exposes each major work as a user-managed
      file rather than hiding everything in an application database.
  project-history:
    - >
      Keith Blount began building the application to support his own nonlinear writing
      process after finding existing writing and organization tools did not match it.
      Early concepts used the name BookTree, and public development included Scrivener
      Gold and a series of Scrivener 1 betas.
    - >
      Scrivener 1.0 was released in January 2007 after extensive beta feedback refined
      its navigation and corkboard behavior. Literature & Latte continued developing the
      application through major revisions and later brought it to Windows and iOS.
  related-projects:
    - >
      Scapple is Literature & Latte's companion application for free-form note
      arrangement and idea mapping.
    - >
      Ulysses, CopyWrite, Avenir, Jer's Novel Writer, and the older Z-Write were writing
      tools discussed by Scrivener's creator when explaining the category and the
      project's origins.
    - >
      MultiMarkdown is used in Scrivener's publishing workflows and to produce its
      official manuals.
