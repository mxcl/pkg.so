history:
  adoption-history:
    - >
      The project reports contributions from the wider XMPP community and participation
      in Google Summer of Code projects through Google and the XMPP Standards Foundation
      in 2011 and 2012. Swift was offered for macOS, Windows, and Linux, with optional
      commercial support from Isode.
  package-nerd-significance:
    - >
      Swift is an example of a desktop client and reusable protocol stack being
      developed together: the Qt-based client uses the Swiften C++ XMPP library, while
      the same source tree also contains scripting, proxy, and utility components. Its
      official downloads included conventional desktop builds and Debian/Ubuntu package
      repositories.
  project-history:
    - >
      Swift was founded by XMPP community members and authors Remko Tronçon and Kevin
      Smith to create an unobtrusive, standards-based messaging client. The surrounding
      ecosystem grew to include Swiften for C++, Stroke for Java, and several smaller
      XMPP tools.
  related-projects:
    - Swiften is the C++ XMPP library underlying the desktop client.
    - Stroke is a Java port of the Swiften design.
    - >
      Sluift, Limber, Slimber, and SwiftTools are companion components listed by the
      official repository.
  sources:
    - https://swift.im/git/swift/tree/README.md
    - https://www.swift.im/about.html
    - https://www.swift.im/downloads.html
    - https://www.swift.im/wordpress/
  summary:
    - >
      Swift is a free, cross-platform XMPP desktop client built around the Swiften
      protocol library and designed for both individual and managed, security-conscious
      deployments.
  timeline:
    - >
      2011–2012: The project supported Google Summer of Code work through Google and the
      XMPP Standards Foundation.
    - '2018: Swift 4.0 reached full release status.'
  usage:
    - >
      Users connect with an XMPP account to exchange messages, manage presence and
      contacts, join multi-user chat rooms, transfer files, and use features such as
      acknowledgements and security labels. Developers can build the Qt client and its
      related components from the official Git repository with SCons.
