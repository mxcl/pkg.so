history:
  adoption-history:
    - >
      Major milestones tracked in the project's version history include the 2014 v1.28
      release adding a --v2 argument for modern defaults and experimental Swift code
      generation, v1.29 adding a built-in model compiler instead of relying on Xcode's
      momc, v1.30 making modern Objective-C and Swift defaults while adding bundled
      Swift 2 templates, and v1.31 adding Swift 3 support. Later releases added support
      for newer Core Data property types, nullability annotations, Swift fetchRequest
      generation, and more template metadata.
  project-history:
    - >
      The project became a notable tool in the Cocoa/Core Data ecosystem. Its README
      describes the command-line workflow around .xcdatamodel files, and a 2012 Edge
      Cases episode presented it as a popular open source Core Data code generation
      tool. In practice, developers ran mogenerator manually, from scripts, or from
      Xcode build phases to keep generated Objective-C classes synchronized with a Core
      Data model.
  sources:
    - https://edgecasesshow.com/027-where-mogenerator-really-picks-it-up.html
    - https://github.com/rentzsch/mogenerator
    - https://github.com/rentzsch/mogenerator/blob/master/Version-History.md
    - https://github.com/rentzsch/mogenerator/blob/master/mogenerator.m
    - https://www.tumblr.com/rentzsch/97193911940/mogenerator-1-28
  summary:
    - >
      mogenerator is Jonathan 'Wolf' Rentzsch's Core Data code generator, with project
      source copyright notices dating the codebase to 2006-2019. Its core idea is the
      two-class pattern for each Core Data entity: a generated machine-owned class such
      as _MyEntity that can be overwritten to match the model, and a human-owned
      subclass such as MyEntity where app-specific logic lives. That split made it
      attractive to Objective-C Mac and iOS developers who wanted generated accessors
      and constants without losing hand-written business logic every time the model
      changed.
  usage:
    - >
      Its package-manager niche is narrow but durable: a macOS developer CLI for legacy
      and long-lived Core Data projects, adjacent to Xcode's own model tooling but more
      opinionated about generated code ownership.
related-packages:
  - id: brew:swiftgen
    reason: >
      Choose SwiftGen when a Swift project needs Core Data generation alongside
      type-safe code for assets, strings, storyboards, and other resources; mogenerator
      is the narrower Core Data tool with its machine/human subclass pattern.
    rel: alternative
    sources:
      - https://github.com/rentzsch/mogenerator
      - https://github.com/SwiftGen/SwiftGen
