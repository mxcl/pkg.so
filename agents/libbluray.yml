history:
  adoption-history:
    - >
      libbluray became part of the free multimedia stack because media players could
      integrate Blu-ray structure and menu support without bundling decryption.
      VideoLAN's project page names VLC and MPlayer, and package managers distribute it
      as a dependency for playback applications and media frameworks.
  package-nerd-significance:
    - >
      libbluray is important because it keeps the open-source Blu-ray stack modular:
      disc navigation and BD-J live here, while AACS and BD+ are separate. That split
      lets distributions package a legal playback/navigation library even when encrypted
      commercial-disc playback needs user-provided keys or additional components.
  project-history:
    - >
      VideoLAN describes libbluray as a research project developed by an international
      team from Doom9, started from scratch without external specifications or copied
      code. The project page emphasizes portability across GNU/Linux, Windows, and Mac
      OS X, LGPL licensing, and a legal boundary: commercial discs protected by AACS or
      BD+ require separate projects such as libaacs or libbdplus.
    - >
      The VideoLAN download archive records release directories beginning with 0.2.1 on
      2011-11-30. Jean-Baptiste Kempf's 2011 VideoLAN release post described 0.2.1 as
      the first usable libbluray release and compared it to libdvdnav for Blu-ray Discs.
  related-projects:
    - >
      VLC, MPlayer, mpv, Kodi, FFmpeg, libaacs, libbdplus, libudfread, libdvdnav,
      libdvdread, and libdvdcss form the nearby optical-disc and media-playback
      ecosystem.
  sources:
    - https://download.videolan.org/pub/videolan/libbluray/
    - https://images.videolan.org/developers/libbluray.html
    - https://jbkempf.com/blog/2025/libbluray-1.4.0/
    - https://jbkempf.com/blog/Disc-libraries-releases/
    - https://videolan.videolan.me/libbluray/
  summary:
    - >
      libbluray is VideoLAN's open-source Blu-ray Disc playback library for media
      players such as VLC and MPlayer. It handles Blu-ray navigation, playlist parsing,
      menus, and BD-J while deliberately staying separate from DRM-circumvention code.
  timeline:
    - '2011: VideoLAN download archive lists libbluray 0.2.1 on 2011-11-30.'
    - '2011: Jean-Baptiste Kempf describes libbluray 0.2.1 as the first usable release.'
    - '2017: VideoLAN archive lists libbluray 1.0.0 on 2017-03-02.'
    - '2020: VideoLAN archive lists libbluray 1.2.1 on 2020-10-24.'
    - >
      2025: libbluray 1.4.0 release post describes BD-J, symbol visibility, and Meson
      build-system work.
    - '2026: VideoLAN archive lists libbluray 1.4.1 on 2026-02-25.'
  usage:
    - >
      Applications link libbluray to read Blu-ray directory structures, interpret
      playlists, navigate titles, and support Java-based BD-J menus. Users normally
      experience it through a player such as VLC, mpv, MPlayer, Kodi, or FFmpeg builds
      rather than by invoking libbluray directly.
related-packages:
  - id: cask:vlc
    reason: >
      VLC is a user-facing media player explicitly identified by VideoLAN as a libbluray
      consumer, making it the natural companion for graphical Blu-ray playback.
    rel: adjacent_workflow
    sources:
      - https://www.videolan.org/developers/libbluray.html
      - https://www.videolan.org/vlc/
  - id: brew:mpv
    reason: >
      mpv provides command-line Blu-ray playback and documents its direct reliance on
      libbluray for disc navigation, region handling, and BD-J menus.
    rel: adjacent_workflow
    sources:
      - https://mpv.io/manual/stable/
      - https://videolan.videolan.me/libbluray/
  - id: brew:libaacs
    reason: >
      libaacs complements libbluray by implementing AACS handling, which VideoLAN notes
      is separately required for many protected commercial discs.
    rel: adjacent_workflow
    sources:
      - https://www.videolan.org/developers/libbluray.html
      - https://www.videolan.org/developers/libaacs.html
