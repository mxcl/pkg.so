id: brew:chrome-devtools-mcp
display-name: Chrome DevTools MCP
repo: https://github.com/ChromeDevTools/chrome-devtools-mcp
docs:
  - https://github.com/ChromeDevTools/chrome-devtools-mcp#readme
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      The README centers adoption on MCP client configuration, including npx-based setup
      for agent tools and a Homebrew formula in the supplied package facts. It
      explicitly recommends using the latest npm package so clients track current Chrome
      DevTools MCP behavior.
  package-nerd-significance:
    - >
      For package-manager users, chrome-devtools-mcp is a snapshot of the 2025-2026
      shift from browser automation as a test-only concern to browser introspection as a
      standard coding-agent dependency. It packages DevTools, Puppeteer-backed
      automation, and MCP conventions into a single installable developer tool.
  project-history:
    - >
      The public GitHub repository was created in September 2025 under the
      ChromeDevTools organization. Its README describes an MCP server plus a standalone
      CLI that expose browser automation, debugging, screenshots, console and network
      inspection, and performance tracing to AI coding assistants.
    - >
      The project reached a 1.0.0 release in May 2026 and continued shipping frequent
      releases through June 2026, reflecting the fast-moving adoption of MCP tooling
      around coding agents.
  related-projects:
    - >
      Related projects include Chrome DevTools, Chrome for Testing, Puppeteer, the Model
      Context Protocol, and MCP clients such as Claude Code, Cursor, Copilot,
      Antigravity, and Amp as documented in the README.
  sources:
    - https://github.com/ChromeDevTools/chrome-devtools-mcp#readme
    - https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/docs/tool-reference.md
    - https://api.github.com/repos/ChromeDevTools/chrome-devtools-mcp
    - https://api.github.com/repos/ChromeDevTools/chrome-devtools-mcp/releases
  summary:
    - >
      Chrome DevTools MCP is Google's official Model Context Protocol server for letting
      coding agents inspect and control a live Chrome browser through Chrome DevTools
      capabilities.
  timeline:
    - '2025: GitHub repository created under ChromeDevTools.'
    - '2025: v0.1.0 tag published in September.'
    - '2026: v1.0.0 released in May.'
    - '2026: v1.4.0 released in June.'
  usage:
    - >
      Users run the MCP server with npx or the packaged executables and add it to an MCP
      client configuration. It officially supports Google Chrome and Chrome for Testing,
      with options for slim mode, headless operation, disabling usage statistics, and
      disabling update checks.
related-packages:
