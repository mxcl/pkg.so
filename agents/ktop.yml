id: brew:ktop
display-name: ktop
repo: null
docs:
  - https://vladimirvivien.github.io/ktop
config-file-location: null
credentials-file-location:
  unix:
    - $KUBECONFIG
    - ~/.kube/config
history:
  adoption-history:
    - >
      ktop is distributed through Kubernetes-native and general package-manager
      channels: the documentation lists installation as a kubectl plugin through krew,
      through Homebrew, through `go install`, through Docker, and through GitHub release
      binaries.
    - >
      Its adoption path is tied to operators and developers who want live cluster
      inspection without installing agents or server-side components.
  package-nerd-significance:
    - >
      ktop is package-nerd notable as a Kubernetes-era reinterpretation of a classic
      Unix admin interface. It also shows how kubectl plugins, Go single binaries,
      Homebrew formulae, and container images can all distribute the same cluster-ops
      tool.
  project-history:
    - >
      The GitHub repository was created on 2016-12-29. The project documentation
      describes ktop as a local, single-binary tool that connects through the Kubernetes
      API using the same kubeconfig credentials that kubectl uses.
    - >
      The project evolved around a specific gap in the Kubernetes CLI experience:
      `kubectl top` gives a snapshot, while ktop keeps an interactive terminal display
      open and supports hierarchical navigation through nodes, pods, containers, and
      logs.
  related-projects:
    - >
      ktop is related to kubectl top, the krew plugin manager, Kubernetes Metrics
      Server, Prometheus, cAdvisor/kubelet metrics endpoints, and other terminal cluster
      dashboards.
  sources:
    - https://api.github.com/repos/vladimirvivien/ktop
    - https://github.com/vladimirvivien/ktop
    - https://raw.githubusercontent.com/vladimirvivien/ktop/master/README.md
    - https://vladimirvivien.github.io/ktop/
    - https://vladimirvivien.github.io/ktop/guide/
  summary:
    - >
      ktop is a terminal dashboard for Kubernetes clusters, explicitly modeled after
      Unix top-style tools. It continuously displays node, pod, and container metrics
      and lets users drill from cluster overview into workload details and logs.
  timeline:
    - '2016-12-29: vladimirvivien/ktop repository created on GitHub.'
    - '2026-06-24: GitHub repository metadata recorded ongoing updates to the project.'
    - >
      2026: Project documentation described krew, Homebrew, Docker, Go install, and
      binary-release installation paths.
  usage:
    - >
      ktop uses `$KUBECONFIG` or `~/.kube/config`, supports context and namespace
      selection, and can use Prometheus scraping, Kubernetes Metrics Server, or a
      no-metrics fallback that shows resource requests and limits.
related-packages:
  - id: brew:kubernetes-cli
    reason: >
      Use kubectl alongside ktop for resource mutations and detailed API operations
      after ktop's dashboard identifies a workload that needs attention.
    rel: adjacent_workflow
    sources:
      - https://github.com/vladimirvivien/ktop
      - https://kubernetes.io/docs/reference/kubectl/
  - id: brew:krew
    reason: >
      Krew provides ktop's officially documented kubectl-plugin installation and update
      workflow.
    rel: adjacent_workflow
    sources:
      - https://github.com/vladimirvivien/ktop
      - https://krew.sigs.k8s.io/docs/
  - id: brew:k9s
    reason: >
      Choose K9s when you want a broader interactive Kubernetes resource-management TUI;
      choose ktop when the primary task is top-style metrics, drill-down, and logs.
    rel: alternative
    sources:
      - https://github.com/vladimirvivien/ktop
      - https://k9scli.io/
