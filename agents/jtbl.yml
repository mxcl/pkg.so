id: brew:jtbl
display-name: jtbl
repo: https://github.com/kellyjonbrazil/jtbl
docs:
  - https://github.com/kellyjonbrazil/jtbl
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      Adoption evidence is modest and package-manager-centered. The tool is packaged by
      Homebrew, MacPorts, and Nix, which places it in the same terminal-data-tool
      ecosystem as jq, jc, and other JSON pipeline utilities.
  package-nerd-significance:
    - >
      Package nerds care about jtbl because it is a focused Unix-filter style utility:
      stdin in, stdout out, no daemon, no framework, and a packaging footprint small
      enough for multiple package ecosystems.
  project-history:
    - >
      The public repository describes jtbl as a simple CLI that reads JSON from standard
      input and writes table output to standard output. GitHub tag history shows a 1.0.0
      tag in March 2020, followed by continued packaged releases through the 1.x line.
  related-projects:
    - jq is the broader JSON query tool commonly paired with terminal JSON workflows.
    - >
      jc, by the same maintainer, converts many command outputs and file formats into
      JSON for similar shell-pipeline use.
  sources:
    - https://formulae.brew.sh/formula/jtbl
    - https://github.com/kellyjonbrazil/jc
    - https://github.com/kellyjonbrazil/jtbl
    - https://github.com/kellyjonbrazil/jtbl/releases
    - https://github.com/kellyjonbrazil/jtbl/tags
  summary:
    - >
      jtbl is a small command-line formatter for turning JSON and JSON Lines streams
      into terminal, CSV, HTTP, and Markdown tables. Its niche is the shell pipeline:
      JSON-producing tools on one side, human-readable tabular output on the other.
  timeline:
    - '2020: The repository has a v1.0.0 tag dated March 17.'
    - '2021: The 1.2.x release series expanded the packaged 1.x line.'
    - '2023: The GitHub releases page records a 1.6.0 release.'
  usage:
    - >
      jtbl is used when a script or API emits JSON but the operator wants a quick table
      without writing a custom formatter. Its value is strongest in ad hoc inspection,
      README examples, shell aliases, and command demos.
related-packages:
  - id: brew:jc
    reason: >
      Pipe jc's JSON serialization of command output into jtbl to render that data as a
      table, a workflow demonstrated by jtbl's official README.
    rel: adjacent_workflow
    sources:
      - https://github.com/kellyjonbrazil/jtbl
      - https://github.com/kellyjonbrazil/jc
  - id: brew:jq
    reason: >
      Use jq between a JSON producer and jtbl to select or reshape fields before table
      rendering, as demonstrated in jtbl's official example pipeline.
    rel: adjacent_workflow
    sources:
      - https://github.com/kellyjonbrazil/jtbl
      - https://jqlang.github.io/jq/
