history:
  adoption-history:
    - >
      Shortwave is designed for Gmail and Google Workspace accounts. Its official site
      describes use by teams at thousands of companies, while its documentation also
      supports individual and multi-account workflows.
  package-nerd-significance:
    - >
      Shortwave is an example of a cross-platform, service-backed desktop package:
      installation is local, but mailbox synchronization, account identity, and much of
      the configuration model are managed through Gmail and Shortwave's service rather
      than user-maintained configuration files.
  project-history:
    - >
      A team of former Firebase employees started Shortwave in 2020 and publicly
      unveiled the company in 2021. The email client launched on February 15, 2022 as a
      new interface for existing Gmail accounts.
    - >
      The initial product emphasized inbox organization, bundles, search,
      keyboard-driven operation, and collaborative email. Beginning in 2023, Shortwave
      increasingly emphasized AI-assisted summaries, search, writing, and automation.
  related-projects:
    - Gmail
    - Google Workspace
    - Google Inbox
  sources:
    - 'Official company introduction: https://www.shortwave.com/blog/future-of-messaging/'
    - 'Official documentation: https://www.shortwave.com/docs/'
    - 'Official launch announcement: https://www.shortwave.com/blog/introducing-shortwave/'
    - 'Official product page: https://www.shortwave.com/'
  summary:
    - >
      Shortwave is a hosted email client for Gmail and Google Workspace that combines
      inbox organization, collaboration, search, and AI-assisted email workflows.
  timeline:
    - '2020: The Shortwave team began the company.'
    - '2021: Shortwave was publicly unveiled.'
    - '2022: The email client launched for Gmail accounts.'
    - '2023: Shortwave launched AI email summaries and expanded its AI-assisted workflow.'
  usage:
    - >
      Users sign in with a Gmail or Google Workspace account and use Shortwave through
      its macOS, Windows, mobile, or web clients.
    - >
      Gmail labels, filters, aliases, contacts, and other supported settings synchronize
      with Shortwave. Shortwave-specific settings are managed in the application; no
      official documentation identifies a user-managed configuration or credentials
      file.
