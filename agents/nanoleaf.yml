history:
  adoption-history:
    - >
      Nanoleaf distributes the Desktop App directly for Windows and macOS and documents
      compatibility across its connected-lighting product range. The official support
      guide also describes pairing from Linux, though the supplied cask packages the
      macOS application.
  package-nerd-significance:
    - >
      The Homebrew cask offers a package-manager installation path for a
      vendor-distributed smart-lighting controller, a class of desktop hardware
      companion normally installed through standalone disk images.
  project-history:
    - >
      Nanoleaf created the Desktop App as a computer-based control surface for its
      connected lighting. The application expanded beyond basic control to scenes,
      schedules, screen mirroring, gaming integrations, audio-reactive effects, and
      management of larger installations.
  related-projects:
    - Nanoleaf mobile app
    - Nanoleaf smart-lighting devices
    - Razer Chroma
    - Overwolf
  sources:
    - https://nanoleaf.me/en-us/pages/works-with/desktop-app
    - >
      https://support.nanoleaf.me/hc/en-us/articles/33036154567700-Pairing-Nanoleaf-App-Desktop
    - source_facts.package-manager
    - source_facts.source-archive
  summary:
    - >
      Nanoleaf Desktop App is the official desktop controller for compatible Nanoleaf
      lights and entertainment-lighting integrations.
  timeline:
    - '2026: Nanoleaf published its current first-party Desktop App pairing guide.'
  usage:
    - >
      Users pair compatible lights over the local network, manage rooms and
      installations, create or download scenes, schedule lighting, mirror displays, and
      connect supported gaming or audio-reactive integrations.
