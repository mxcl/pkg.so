id: cask:ferdium
display-name: Ferdium
repo: null
docs:
  - https://ferdium.org/faq
  - https://github.com/ferdium/ferdium-app#readme
config-file-location:
  linux:
    - ${XDG_CONFIG_HOME:-~/.config}/Ferdium/config/settings.json
    - ${XDG_CONFIG_HOME:-~/.config}/Ferdium/config/custom.css
  macos:
    - ~/Library/Application Support/Ferdium/config/settings.json
    - ~/Library/Application Support/Ferdium/config/custom.css
  windows:
    - '%APPDATA%\Ferdium\config\settings.json'
    - '%APPDATA%\Ferdium\config\custom.css'
credentials-file-location: null
history:
  adoption-history:
    - >
      Ferdium supports migration from Ferdi profiles and servers, giving users of the
      earlier client a path to retain existing configurations.
    - >
      Official packages are distributed for macOS, Windows, Linux, and FreeBSD through
      GitHub releases and numerous platform package managers, including Homebrew,
      Flatpak, AUR, Snap, Chocolatey, Winget, and Scoop.
  package-nerd-significance:
    - >
      Ferdium is attractive to package enthusiasts as an open-source, cross-platform
      wrapper for many web services with accountless operation, self-hostable
      synchronization, and editable service recipes.
    - >
      Its ecosystem is split into client, server, and recipe repositories, allowing
      users to package the desktop client, host their own data service, or contribute
      new web-service integrations independently.
  project-history:
    - >
      Ferdium developed as a community-maintained continuation of the Franz/Ferdi style
      of multi-service desktop client. Its migration tooling explicitly helps existing
      Ferdi users move their profiles into Ferdium.
    - >
      The project pairs the Electron desktop client with a separate self-hostable
      Ferdium Server and a community recipe catalogue.
  related-projects:
    - Ferdi is Ferdium's direct migration predecessor.
    - >
      Franz established the multi-service desktop-client lineage from which Ferdi and
      Ferdium evolved.
    - >
      Ferdium Server provides optional synchronized accounts, while Ferdium Recipes
      supplies service integrations.
  sources:
    - https://ferdium.org/
    - https://ferdium.org/download
    - https://ferdium.org/faq
    - https://github.com/ferdium/ferdium-app#readme
    - https://github.com/ferdium/ferdium-recipes
    - https://github.com/ferdium/ferdium-server
  summary:
    - >
      Ferdium is a community-built, open-source desktop application that places
      messaging, mail, collaboration, and other web services in one client.
  timeline:
    - >
      2022: The older Ferdi repository was archived as the Ferdium ecosystem became the
      active community continuation.
  usage:
    - >
      Users add services such as chat, mail, and collaboration sites, optionally create
      multiple instances for different accounts, and organize them into workspaces.
    - >
      Ferdium can be used without an account with data kept locally, with Ferdium's
      hosted synchronization, or with a self-hosted Ferdium Server. Advanced users can
      add custom websites, apply custom CSS, and develop or modify service recipes.
tags:
  - accountless
  - cross-platform
  - custom-css
