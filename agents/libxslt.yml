id: brew:libxslt
display-name: libxslt
repo: https://gitlab.gnome.org/GNOME/libxslt
docs:
  - https://gnome.pages.gitlab.gnome.org/libxslt/devhelp
config-file-location:
  unix:
    - /etc/xml/catalog
credentials-file-location: null
history:
  adoption-history:
    - >
      The 1.0.0 announcement framed DocBook processing as an early adoption path: GNOME
      and KDE documentation were named as target users, and KDE, GNOME, AxKit, and other
      projects were thanked for reuse and patches. That put libxslt directly into the
      XML documentation toolchain culture of early-2000s free software.
    - >
      The NEWS file shows the library settling into long-term maintenance after the
      early GNOME/XML push, with portability work, EXSLT fixes, Windows build support,
      lxml-facing exported symbols in 2009, and security fixes across later releases.
  package-nerd-significance:
    - >
      libxslt is one of those quiet infrastructure packages that explains why so many
      old source builds can turn DocBook XML into man pages, HTML, or release
      documentation. Package nerds care because xsltproc is both a standalone CLI and a
      build dependency that leaks into dependency graphs far beyond visible XML
      applications.
  project-history:
    - >
      Daniel Veillard wrote libxslt for the GNOME project. The GNOME-hosted reference
      manual describes it as the XSLT C library developed for GNOME, based on libxml2,
      and implementing much of EXSLT alongside XSLT processing.
    - >
      Veillard announced libxslt 1.0.0 on July 10, 2001 as the first stable release of
      the GNOME XSLT library. The announcement said it implemented the XSLT 1.0
      constructs, included common extensions, provided an extension framework, and
      shipped xsltproc with profiling support.
  related-projects:
    - >
      libxml2 is the base XML C library underneath libxslt. EXSLT supplies many of the
      portable extension functions implemented by libxslt. xsltproc is the command-line
      face of the library, and DocBook toolchains are one of its historically important
      consumers.
  sources:
    - https://github.com/GNOME/libxslt/blob/master/NEWS
    - https://gnome.pages.gitlab.gnome.org/libxslt/devhelp/
    - https://gnome.pages.gitlab.gnome.org/libxslt/tutorial/libxslttutorial.html
    - https://groups.google.com/g/mailing.gnome.announce/c/AJwONLlAteQ
  summary:
    - >
      libxslt is the GNOME XSLT C library, built on libxml2 and packaged with xsltproc,
      the small command-line transformer that made XSLT practical in Unix pipelines,
      documentation builds, and application installers.
  timeline:
    - >
      2001-07-10: Daniel Veillard announced libxslt 1.0.0 as the first stable GNOME XSLT
      library release.
    - '2003-11-04: libxslt 1.1.0 was released, according to the project NEWS file.'
    - '2009-09-24: libxslt 1.1.26 exported xsltProcessOneNode for lxml.'
    - '2017-11-02: libxslt 1.1.32 included portability and Windows test work.'
  usage:
    - >
      Package users usually meet libxslt through xsltproc, build-time documentation
      generation, language bindings, or applications that need an embeddable C XSLT
      engine rather than a JVM or browser runtime. Its tight pairing with libxml2 made
      it a standard dependency for XML-heavy C, Python, and desktop software stacks.
related-packages:
  - id: brew:libxml2
    reason: >
      Use libxml2 with libxslt for the underlying XML parsing, XPath, tree, and catalog
      facilities on which the XSLT engine is explicitly based.
    rel: adjacent_workflow
    sources:
      - https://gnome.pages.gitlab.gnome.org/libxslt/devhelp/
      - https://gnome.pages.gitlab.gnome.org/libxml2/devhelp/
  - id: brew:docbook-xsl
    reason: >
      Apply the DocBook XSL stylesheets with libxslt's xsltproc to transform DocBook XML
      into HTML, XSL-FO, manual pages, and related documentation outputs.
    rel: adjacent_workflow
    sources:
      - https://docbook.org/stylesheets/
      - https://gnome.pages.gitlab.gnome.org/libxslt/xsltproc.html
  - id: brew:xmlstarlet
    reason: >
      Use XMLStarlet beside libxslt when shell workflows need higher-level XML
      selection, editing, validation, and transformation commands built on libxml2 and
      libxslt.
    rel: adjacent_workflow
    sources:
      - https://xmlstar.sourceforge.net/doc/UG/xmlstarlet-ug.html
      - https://gnome.pages.gitlab.gnome.org/libxslt/xsltproc.html
