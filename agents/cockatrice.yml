history:
  adoption-history:
    - >
      Cockatrice is distributed for Windows, macOS, and several Linux distributions. Its
      public-server model supports remote multiplayer, while a single-player mode
      supports offline deck building and playtesting.
    - >
      Its Homebrew cask makes the macOS application available through a command-line
      package-management workflow.
  package-nerd-significance:
    - >
      Cockatrice is notable to package users because one installation contains a small
      suite: the Cockatrice client, the Oracle card-database utility, and the Servatrice
      server. The project is also a long-running C++/Qt desktop application with native
      packages across several operating systems.
  project-history:
    - >
      Cockatrice is an open-source, cross-platform virtual tabletop developed in C++
      with Qt. Its architecture separates the Cockatrice game client, Oracle database
      utility, and Servatrice network server.
    - >
      The project maintains stable and beta distribution channels without a fixed
      release schedule, reflecting a community-maintained desktop application rather
      than a tightly timed commercial release cycle.
  related-projects:
    - Oracle, the bundled card-database utility.
    - Servatrice, the Cockatrice network server.
    - Webatrice, the related web client for Cockatrice servers.
    - >
      Magic-Token and Magic-Spoiler, related data projects maintained by the Cockatrice
      organization.
  sources:
    - 'Official repository README: https://github.com/Cockatrice/Cockatrice'
    - 'Official website: https://cockatrice.github.io/'
    - 'Official wiki: https://github.com/Cockatrice/Cockatrice/wiki'
    - 'Package provenance: source_facts.package-manager and source_facts.provenance'
  summary:
    - >
      Cockatrice is an open-source virtual tabletop for playing multiplayer card games
      over a network, with offline deck-building and single-player facilities.
  timeline:
    - >
      Current era: The project publishes stable and beta builds for Windows, macOS, and
      Linux and continues development through its public GitHub repository.
  usage:
    - >
      Users install the client, run Oracle to obtain card data, build or import a deck,
      and either playtest offline or connect to a public Cockatrice server.
    - >
      Server operators can deploy Servatrice separately; the official repository also
      documents container-based server deployment.
