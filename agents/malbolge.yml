history:
  adoption-history:
    - >
      Malbolge's adoption is cultural rather than practical. It became a stock example
      in esoteric language collections because the original document could not even
      provide a normal example program and stated that no Malbolge programs had yet been
      written.
    - >
      Later bundled examples such as `answer.mal`, `copy.mal`, and a 99 Bottles program
      show how the community treated it as a puzzle language. Package managers carry
      interpreters like this less for production software and more to preserve runnable
      artifacts from programming-language folklore.
  package-nerd-significance:
    - >
      Malbolge is package-nerd catnip because it is tiny, public domain, historically
      odd, and easy to build as a single interpreter while representing a famous edge
      case in language implementation. It also tests whether package collections
      preserve playful and archival software, not just infrastructure.
  project-history:
    - >
      The original Malbolge material is dated 1998 and includes `malbolge.c`, `nop.mal`,
      and a language document titled "Malbolge '98, Ben Olmstead." In that document,
      Olmstead says existing esolangs were difficult for different reasons but none had
      been specifically designed to be difficult to program in, so Malbolge was created
      for that goal.
    - >
      The orphaned 2004 edition README says a long time had passed since release, useful
      trivial programs had emerged, and the package bundled the original interpreter
      with a Perl interpreter plus small example programs by later contributors. That
      2004 bundle is the basis for much of the small command-line distribution history
      around the language.
  related-projects:
    - >
      Related esoteric languages mentioned by the original document include INTERCAL,
      Brainfuck, Befunge, FALSE, TWDL, RUBE, and tri-INTERCAL.
  sources:
    - https://esoteric.sange.fi/orphaned/malbolge/
    - https://esoteric.sange.fi/orphaned/malbolge/README.txt
    - https://esoteric.sange.fi/orphaned/malbolge/malbolge.c
    - https://esoteric.sange.fi/orphaned/malbolge/malbolge.txt
  summary:
    - >
      Malbolge is an esoteric programming language by Ben Olmstead, deliberately
      designed to be difficult to program in. The Homebrew package provides a `malbolge`
      interpreter for a language whose original specification describes a trinary
      virtual machine, self-modifying code, intentionally hostile instruction encoding,
      and public-domain source.
  timeline:
    - "1998: Ben Olmstead's Malbolge interpreter and specification are published."
    - '2004: The orphaned Malbolge bundle adds a Perl interpreter and later example programs.'
    - '2004: The README records useful trivial programs emerging after the original release.'
  usage:
    - >
      Usage is interpreter-oriented: pass a `.mal` program to the `malbolge` executable
      and observe its input/output behavior. The official specification defines memory,
      trits, registers A/C/D, instruction decoding, input/output, and the stop
      instruction rather than a conventional application configuration.
