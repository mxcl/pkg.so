history:
  adoption-history:
    - >
      Vocaster Hub is distributed for macOS and Windows as the companion application for
      the Vocaster One and Vocaster Two hardware families. Focusrite integrates its
      installation into the products' Easy Start workflow.
    - >
      Focusrite continued developing the software after its initial release, adding
      workflow-specific Auto Gain and Enhance behavior, appearance options, and improved
      host/guest monitoring controls.
  package-nerd-significance:
    - >
      Vocaster Hub is representative of vendor-supplied hardware control software
      packaged separately from an audio interface's firmware and, on Windows, its
      driver.
    - >
      For package-manager users, it completes a Vocaster installation by exposing
      routing, mixing, gain, voice enhancement, loopback, and update controls that are
      not all available from the hardware alone.
  project-history:
    - >
      Focusrite introduced the Vocaster range as podcast-focused audio interfaces and
      supplied Vocaster Hub as their desktop control application. Initial Vocaster Hub
      1.0 downloads accompanied the Vocaster One and Two product generation in 2022.
    - >
      The Hub evolved as Focusrite expanded its podcasting workflow, including controls
      for microphone gain and enhancement, show mixes, loopback audio, device settings,
      and firmware updates.
  related-projects:
    - Focusrite Vocaster One
    - Focusrite Vocaster Two
    - Focusrite Easy Start
    - Focusrite Windows Driver
  sources:
    - >
      https://focusrite.com/articles/download-the-latest-software-update-available-for-vocaster-hub/
    - https://focusrite.com/articles/introducing-vocaster/
    - >
      https://support.focusrite.com/hc/en-gb/articles/13070702714130-Focusrite-Windows-Driver-Release-Notes
    - >
      https://userguides.focusrite.com/hc/en-gb/sections/13838885006226-Vocaster-Hub-User-Guide
  summary:
    - >
      Vocaster Hub is Focusrite's desktop control and mixing application for Vocaster
      One and Vocaster Two podcasting interfaces. It exposes device settings and
      podcast-oriented audio controls on macOS and Windows.
  timeline:
    - >
      2022: Focusrite introduced the Vocaster range and distributed Vocaster Hub 1.0 for
      Mac and Windows.
    - "2022: Focusrite's Windows driver added support for the Vocaster range."
    - >
      Later releases: Focusrite expanded Hub with workflow-specific Auto Gain behavior,
      themes, and improved monitoring controls.
  usage:
    - >
      Users connect a powered Vocaster interface over USB and open Vocaster Hub to
      control microphone gain, Auto Gain, Enhance presets, mute state, headphone and
      speaker levels, and the Show Mix.
    - >
      The software also manages computer-audio loopback and routing for recording
      browser audio, music playback, calls, or other applications into podcast and
      streaming software.
