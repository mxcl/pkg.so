id: brew:colormake
display-name: Colormake
repo: null
docs:
  - https://github.com/pagekite/Colormake#readme
config-file-location:
  unix:
    - /usr/share/colormake/colormake.rc
    - ~/.colormakerc
credentials-file-location: null
history:
  adoption-history:
    - >
      Colormake has the kind of quiet adoption typical of build-output filters: it is
      exposed as `colormake`, `clmake`, `colormake-short`, and `clmake-short`, and the
      supplied metadata lists packages in Homebrew, Debian, Ubuntu, Alpine, Nix, and
      openSUSE.
  package-nerd-significance:
    - >
      Colormake is notable for solving a narrow packaging-era problem with minimal
      machinery: improving human readability of compiler output without changing
      makefiles or build systems. The manpage also records an old command-name conflict:
      `/usr/bin/colormake` was formerly `/usr/bin/cmake`, which had to be renamed.
  project-history:
    - >
      The manual page is dated July 2001 and describes `colormake` as a wrapper for
      `make(1)`. The upstream README credits Bjarni R. Einarsson as author and says the
      project was inspired by Michael T. Babcock's `logcolorize` program.
  related-projects:
    - >
      Colormake is related to `make`, `less`, compiler output filters, and Michael T.
      Babcock's `logcolorize`, which the README names as an inspiration.
  sources:
    - https://github.com/pagekite/Colormake
    - https://raw.githubusercontent.com/pagekite/Colormake/master/README.md
    - https://raw.githubusercontent.com/pagekite/Colormake/master/colormake.1
  summary:
    - >
      Colormake is a small Perl-and-shell wrapper around `make` that colorizes build
      output so compiler messages and errors are easier to scan.
  timeline:
    - "2001: Debian-oriented manual page dated July 2 describes colormake's wrapper behavior."
    - '2000s: The command was renamed from `cmake` to `colormake` because of a name clash.'
    - '2010s: Upstream development moved to GitHub under the PageKite organization.'
  usage:
    - >
      Users substitute `colormake` where they would normally run `make`; `clmake` pipes
      through `less`, while the `-short` variants truncate long lines to avoid wrapping.
related-packages:
  - id: brew:make
    reason: >
      Use GNU Make with Colormake because Colormake directly wraps make, passing normal
      build options through while adding readable colorized output.
    rel: adjacent_workflow
    sources:
      - https://github.com/pagekite/Colormake
      - https://www.gnu.org/software/make/
  - id: brew:less
    reason: >
      Use less with Colormake through the supplied clmake command, which pipes colorized
      build output into the pager for navigating long compilations.
    rel: adjacent_workflow
    sources:
      - https://github.com/pagekite/Colormake
      - https://www.greenwoodsoftware.com/less/index.html
