id: brew:llvm@19
display-name: llvm@19
repo: null
docs:
  - https://llvm.org/docs
config-file-location: null
credentials-file-location: null
history:
  adoption-history:
    - >
      LLVM moved from academic compiler infrastructure into mainstream production use
      across commercial, open source, and research projects. The project highlights
      external users spanning language implementations, JITs, static analysis tools,
      linkers, debuggers, and high-performance computing toolchains.
    - >
      For package managers, LLVM's release train and large set of CLI tools made it a
      common versioned dependency. Versioned formulae such as llvm@19 let users pin a
      major compiler stack while newer major releases continue to land.
  package-nerd-significance:
    - >
      LLVM is one of the canonical package-manager stress tests: huge source trees, many
      binaries, CMake builds, multiple runtime libraries, and a steady major-version
      cadence. Versioned formulae matter because downstream projects often need a
      specific Clang/LLVM ABI or tool behavior.
    - >
      LLVM 19 gives package users a newer pinned major after LLVM 18 while avoiding an
      automatic jump to later LLVM APIs or clang-format behavior. That makes it useful
      for toolchain migrations, CI reproducibility, and projects whose build logic names
      versioned clang or llvm-config binaries.
  project-history:
    - >
      LLVM began as a University of Illinois research project to provide a modern
      SSA-based compilation strategy for static and dynamic compilation. The project
      made its 1.0 release in October 2003 and later grew into an umbrella for compiler,
      debugger, runtime, linker, and analysis subprojects.
    - >
      The upstream project describes LLVM as a collection of modular and reusable
      compiler and toolchain technologies rather than a single compiler. Its core
      libraries provide optimizer and code-generation infrastructure around LLVM IR,
      while Clang, LLD, LLDB, libc++, compiler-rt, MLIR, OpenMP, and other subprojects
      build on that base.
  related-projects:
    - >
      Clang, LLD, LLDB, libc++, compiler-rt, MLIR, OpenMP, Flang, BOLT, and the monorepo
      at github.com/llvm/llvm-project are the main related upstream projects.
  sources:
    - https://clang.llvm.org/docs/CommandGuide/clang.html
    - https://llvm.org/
    - https://llvm.org/docs/GettingStarted.html
    - https://llvm.org/docs/GitHub.html
    - https://llvm.org/pubs/2010-06-06-Clang-LLVM.pdf
    - https://releases.llvm.org/
    - source_facts.package-manager-url
  summary:
    - >
      LLVM 19 is the Homebrew versioned formula for the LLVM 19.x compiler and toolchain
      series, packaging the LLVM utilities, Clang family tools, LLD, MLIR tools, and
      related developer commands.
  timeline:
    - '2000: LLVM starts as a University of Illinois research project.'
    - '2003-10-24: LLVM 1.0 is released.'
    - '2012: LLVM receives the ACM Software System Award.'
    - '2024-09-17: LLVM 19.1.0 is released.'
    - '2024: Homebrew exposes LLVM 19 through the versioned llvm@19 formula.'
  usage:
    - >
      Package users install LLVM for Clang and clang++, clang-format, clang-tidy,
      clangd, LLD, llvm-ar, llvm-objdump, llvm-config, opt, llc, FileCheck, MLIR tools,
      and many other compiler-development utilities. Upstream getting-started
      documentation centers on cloning llvm-project, configuring with CMake, and
      selecting enabled subprojects such as clang and lld.
    - >
      Clang is documented as a C, C++, and Objective-C compiler driver that handles
      preprocessing, parsing, optimization, code generation, assembly, and linking,
      while transparently invoking lower-level compiler and linker tools.
related-packages:
  - id: brew:gcc
    reason: >
      Choose GCC when you need GNU's multi-language compiler suite, including integrated
      Fortran, Ada, D, and Go frontends, instead of the Clang/LLVM-centered toolchain.
    rel: alternative
    sources:
      - https://gcc.gnu.org/onlinedocs/gcc/G_002b_002b-and-GCC.html
      - https://clang.llvm.org/docs/UsersManual.html
  - id: brew:binutils
    reason: >
      Choose GNU Binutils when builds require GNU ld, gas, or the GNU implementations of
      binary utilities for which LLVM supplies compatible replacements.
    rel: alternative
    sources:
      - https://sourceware.org/binutils/
      - https://llvm.org/docs/CommandGuide/
  - id: brew:cmake
    reason: >
      CMake is LLVM's documented build-system frontend and configures which LLVM
      subprojects, targets, runtimes, and build options are enabled.
    rel: adjacent_workflow
    sources:
      - https://releases.llvm.org/19.1.0/docs/GettingStarted.html
      - https://cmake.org/cmake/help/latest/
  - id: brew:ninja
    reason: >
      Ninja executes LLVM build graphs generated by CMake and is a documented
      high-performance backend for LLVM source builds.
    rel: adjacent_workflow
    sources:
      - https://releases.llvm.org/19.1.0/docs/GettingStarted.html
      - https://ninja-build.org/
  - id: brew:lldb
    reason: >
      LLDB complements the compiler toolchain with source-level debugging while directly
      reusing LLVM's disassembler and Clang expression parser.
    rel: adjacent_workflow
    sources:
      - https://lldb.llvm.org/
      - https://lldb.llvm.org/resources/build.html
