history:
  adoption-history:
    - >
      Libxc adoption is visible through the citation expectations on the project site
      and through its list of interfacing programs. Codes use it so they can expose a
      broad, named set of density-functional approximations without reimplementing each
      functional locally.
    - >
      The 2018 SoftwareX paper became the preferred citation for later versions,
      reflecting the library's growth from a compact common functional set into a
      comprehensive, maintained reference implementation for DFT software.
  package-nerd-significance:
    - >
      Libxc is one of those quiet HPC packages that standardizes scientific meaning, not
      just linkage. In a dependency graph it signals that an electronic-structure code
      can delegate a notoriously broad and error-prone part of DFT to a common
      implementation.
  project-history:
    - >
      Libxc began with the aim of providing a portable, well tested, reliable set of
      functionals for codes of the European Theoretical Spectroscopy Facility. The 2012
      Computer Physics Communications paper presented a library containing routines for
      around 180 functionals and their derivatives, addressing a reproducibility problem
      caused by many slightly different implementations across electronic-structure
      programs.
    - >
      The project later grew beyond its ETSF origin into a shared dependency for many
      quantum-chemistry and solid-state codes. Its own site records an important
      implementation shift in version 4 in 2017, when Libxc moved from hand-written C
      implementations to automatic code generation with Maple.
  related-projects:
    - >
      Related projects include ETSF codes, DFT-FE, DFTK.jl, Elk, and other
      density-functional-theory and electronic-structure packages that interface with
      Libxc.
  sources:
    - https://arxiv.org/abs/1203.1739
    - https://gitlab.com/libxc/libxc
    - https://libxc.gitlab.io/
    - https://libxc.gitlab.io/manual
  summary:
    - >
      Libxc is a scientific C library of exchange-correlation and kinetic-energy
      functionals for density-functional theory, with Fortran and Python bindings for
      integration into electronic-structure codes.
  timeline:
    - '2012-03-08: The original Libxc paper was submitted to arXiv.'
    - '2012: The early Libxc reference appeared in Computer Physics Communications.'
    - '2017: Libxc version 4 switched to automatic Maple-based code generation.'
    - >
      2018: The SoftwareX paper 'Recent developments in Libxc' became the preferred
      citation for maintained versions.
  usage:
    - >
      Developers link Libxc into simulation codes and call its APIs to evaluate LDA,
      GGA, meta-GGA, hybrid, and related functionals. Packagers care about ABI,
      bindings, and the xc-info tool because downstream scientific packages often need a
      consistent functional catalog across C, Fortran, and Python interfaces.
related-packages:
  - id: brew:cp2k
    reason: >
      CP2K officially documents enabling Libxc to provide a wider choice of
      exchange-correlation functionals in DFT calculations.
    rel: adjacent_workflow
    sources:
      - https://manual.cp2k.org/trunk/technologies/libraries.html
      - https://libxc.gitlab.io/
  - id: brew:nwchem
    reason: >
      NWChem officially supports building against Libxc, so the packages work together
      when NWChem users need Libxc-provided DFT functionals.
    rel: adjacent_workflow
    sources:
      - https://nwchemgit.github.io/Interfaces-with-External-Software.html
      - https://libxc.gitlab.io/
