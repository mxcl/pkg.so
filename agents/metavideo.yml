history:
  adoption-history:
    - >
      NeededApps distributes MetaVideo directly and through the Mac App Store. The
      official site invites users to participate through its forum and describes the
      application as actively developed.
  package-nerd-significance:
    - >
      MetaVideo brings batch editing, presets, sidecars, CSV exchange, map-based
      geotagging, and media-database lookup into a native macOS interface. It is
      particularly notable for editing QuickTime ISO 6709 locations, a specialized
      metadata task not exposed conveniently by many general video tools.
  project-history:
    - >
      MetaVideo was introduced as a video-oriented companion to MetaImage. Its official
      version history begins with an initial release and records continued work on date
      parsing, GPS precision, QuickTime locations, XMP address tags, large-file support,
      compatibility, and broader tag coverage.
  related-projects:
    - MetaImage provides the analogous workflow for image metadata.
    - MetaRename uses metadata to rename and organize media files.
    - >
      MetaVideo can retrieve movie and television information from services including
      Apple TV, The Movie Database, and TheTVDB.
  sources:
    - 'Official product page: https://neededapps.com/metavideo/'
    - >
      Official supported-files tutorial:
      https://neededapps.com/tutorials/supported-files-by-metaimage-metavideo/
    - 'Official version history: https://neededapps.com/resources/metavideo/versions/'
  summary:
    - >
      MetaVideo is a proprietary macOS application from NeededApps for viewing,
      comparing, and editing video metadata and geographical tags. It extends the
      workflow established by MetaImage to video and audio-oriented metadata, including
      QuickTime fields.
  timeline:
    - 'After MetaImage: MetaVideo was introduced as its video-metadata companion.'
    - 'Initial release: The first MetaVideo version established the core editor.'
    - >
      Later releases: Added and refined XMP addresses, QuickTime GPS handling, date
      parsing, compatibility, tag coverage, and large-file support.
  usage:
    - >
      Users import videos or folders, inspect and compare metadata, edit multiple files,
      correct timestamps and GPS positions, apply presets, and exchange metadata through
      sidecars or CSV. For movies and television episodes, the application can retrieve
      descriptive metadata such as cast, crew, synopsis, and ratings from supported
      services.
