history:
  adoption-history:
    - >
      dbacl belongs to the early-2000s wave of command-line spam and text filters that
      could be composed with mail delivery agents and shell scripts. Its documentation
      includes tutorials for junk mail filtering, cross-validation, procmail
      integration, and comparisons with other classifiers, which made it fit the Unix
      mail-filtering culture of the period.
  package-nerd-significance:
    - >
      dbacl is interesting as a compact research-adjacent CLI package: it exposes
      Bayesian classification as ordinary Unix commands instead of a library or service.
      For package nerds, it is a reminder of when spam filtering, procmail recipes, and
      statistical text processing were common reasons to install small C command-line
      tools.
  project-history:
    - >
      The SourceForge project metadata records dbacl from January 2003, and the project
      homepage describes the core utility plus companion tools such as bayesol,
      mailcross, mailtoe, mailfoot, and mailinspect. The documentation emphasizes
      digramic Bayesian classification and decision rules based on misclassification
      costs.
  related-projects:
    - >
      The official related-projects page links dbacl to spam-filtering software, a
      Bayesian RSS aggregator, and the TREC Spam Filter Evaluation Tool Kit.
  sources:
    - https://sourceforge.net/rest/p/dbacl
    - https://dbacl.sourceforge.net/
    - https://dbacl.sourceforge.net/contents.html
    - https://dbacl.sourceforge.net/man.html
    - https://dbacl.sourceforge.net/related.html
    - https://sourceforge.net/p/dbacl/git
  summary:
    - >
      dbacl is a collection of lightweight Unix and POSIX utilities for Bayesian text
      classification. Its most familiar package-manager use is mail filtering, but the
      official documentation presents it as a general text-classification toolkit that
      can be scripted for many document-sorting tasks.
  timeline:
    - '2003: SourceForge project metadata records the project creation date.'
    - >
      2000s: Official docs cover spam filtering, shell integration, and manual pages for
      the dbacl utility family.
    - 'Present: SourceForge hosts the project page and an official Git browser.'
  usage:
    - >
      Users train categories from example text, classify new input, and combine dbacl
      with companion utilities when they need optimal classification rules or
      mail-filter evaluation. The manual-page index documents the small-tool style: one
      command for posterior probabilities, one for decision rules, and other commands
      for mailbox inspection and validation.
related-packages:
  - id: brew:bogofilter
    reason: >
      Choose Bogofilter for a dedicated trainable spam/ham filter; choose dbacl when you
      need a more general Bayesian text-classification toolkit and classifier-evaluation
      utilities.
    rel: alternative
    sources:
      - https://dbacl.sourceforge.net/man.html
      - https://dbacl.sourceforge.net/spam.html
      - https://bogofilter.sourceforge.io/
