history:
  adoption-history:
    - >
      Homebrew packages Clippy as stable 1.6.9, with the formula API showing more than
      one thousand on-request installs over the preceding year. The input package facts
      also record dnf and Winget package identifiers, though the upstream README itself
      emphasizes Homebrew installation.
  package-nerd-significance:
    - >
      Clippy is interesting because it packages macOS pasteboard semantics that ordinary
      POSIX pipes do not capture. For terminal-heavy Mac users and AI-agent workflows,
      it turns Finder-style file references, pasteboard types, and MCP clipboard
      operations into installable CLI behavior.
  project-history:
    - >
      The GitHub repository was created on 2025-07-15. The official README says Clippy
      was built specifically for the Mac clipboard system because `pbcopy` copies file
      contents while many GUI apps expect file references.
    - >
      The project broadened from the `clippy` command into a terminal-first clipboard
      suite that includes `pasty` for intelligent pasting, an MCP server for AI
      assistants, and optional companion workflows such as Draggy.
  related-projects:
    - >
      The README explicitly compares Clippy to `pbcopy`, explaining that pbcopy handles
      bytes while Clippy handles file-reference clipboard formats for GUI apps.
    - Related commands in the same suite include `pasty` and the optional Draggy companion.
  sources:
    - https://github.com/neilberkman/clippy#readme
    - https://formulae.brew.sh/api/formula/clippy.json
    - https://github.com/neilberkman/clippy
  summary:
    - >
      Clippy is a macOS-only terminal clipboard suite focused on copying file
      references, generated files, recent downloads, and clipboard contents in formats
      GUI applications understand.
  timeline:
    - '2025-07-15: GitHub repository is created.'
    - '2026: Homebrew formula tracks stable release 1.6.9 from the official GitHub tag archive.'
    - '2026: README documents MCP server support and the companion `pasty` workflow.'
  usage:
    - >
      Common examples include `clippy report.pdf` to copy a file reference, `clippy
      *.jpg` for multiple files, `curl ... | clippy` to place streamed data on the
      clipboard as a file, `clippy -r` for recent downloads, and `pasty` to paste
      Finder-copied files into the terminal.
related-packages:
  - id: brew:clipboard
    reason: >
      Choose Clipboard for cross-platform named clipboards and history; choose Clippy
      when macOS GUI-compatible file references and Finder-style workflows are the
      priority.
    rel: alternative
    sources:
      - https://github.com/neilberkman/clippy#readme
      - https://github.com/Slackadays/Clipboard#readme
  - id: cask:claude-code
    reason: >
      Clippy officially documents registering its bundled MCP server with Claude Code so
      the agent can copy generated text or files directly to the macOS clipboard.
    rel: adjacent_workflow
    sources:
      - https://github.com/neilberkman/clippy#readme
      - https://code.claude.com/docs/en/mcp
