history:
  adoption-history:
    - >
      The application is the standard delivery mechanism for Spitfire Audio's commercial
      and free sound libraries on macOS and Windows. Official guidance directs users of
      the earlier Spitfire Audio Library Manager to replace it with the current app.
  package-nerd-significance:
    - >
      For audio-workstation users, this cask packages the vendor-specific bootstrap
      layer that installs and updates much larger sample libraries and plug-ins. The
      application manages catalog entitlements and installation locations, while the
      resulting instruments are normally used from a DAW or Kontakt rather than inside
      the manager itself.
  project-history:
    - >
      The Spitfire Audio App succeeded the older Spitfire Audio Library Manager as the
      company's library downloader and product-management client.
  related-projects:
    - >
      Libraries installed by the app may use Spitfire's dedicated AU, VST, VST3, or AAX
      plug-ins, or Native Instruments Kontakt and Kontakt Player.
  sources:
    - https://support.spitfireaudio.com/en/articles/11815288-the-spitfire-audio-app
    - >
      https://support.spitfireaudio.com/en/articles/11816197-what-software-do-i-need-to-run-spitfire-libraries
    - https://support.spitfireaudio.com/en/articles/11816198-how-do-i-download-a-library
    - https://www.spitfireaudio.com/pages/spitfire-audio-app
  summary:
    - >
      Spitfire Audio App is Spitfire Audio's desktop download manager for installing,
      locating, repairing, and updating the company's sample libraries and plug-ins.
  timeline:
    - >
      By 2025: Official support documentation described the Spitfire Audio App as the
      replacement for the earlier Spitfire Audio Library Manager.
  usage:
    - >
      Users sign in with their Spitfire Audio account, select owned products, choose or
      accept a default content path, and monitor downloads. The app also exposes repair,
      locate, reset, and update workflows; installed instruments are subsequently loaded
      in a DAW or compatible plug-in host.
