history:
  adoption-history:
    - >
      Note Station is part of Synology's NAS-centered application ecosystem. The desktop
      client extends the DSM-hosted note library to offline computers, while DS note
      provides the mobile counterpart.
    - >
      Its adoption path is consequently tied to Synology NAS ownership and DSM accounts
      rather than to a stand-alone hosted service. Notes return to the user's NAS when
      the client reconnects.
  package-nerd-significance:
    - >
      Note Station Client is representative of vendor-specific desktop companions
      packaged through Homebrew Cask: the cask can automate installation, but the useful
      service remains coupled to separately administered NAS software.
    - >
      For self-hosting enthusiasts, it offers an integrated notes workflow in which
      storage, synchronization, history, and collaboration live on a privately operated
      Synology system.
  project-history:
    - >
      Synology introduced Note Station into its DSM package ecosystem as a rich-note and
      task application hosted on Synology NAS devices. DSM 5.1-era official
      documentation already describes Note Station and its DS note companion.
    - >
      The ecosystem expanded across the browser-based NAS application, desktop Note
      Station Client, mobile DS note applications, and a browser Web Clipper. Later
      releases added and refined offline synchronization, attachments, sharing, note
      history, encryption, and DSM compatibility.
  related-projects:
    - >
      Synology Note Station, the DSM server-side and browser application required by the
      client.
    - DS note, the official iOS and Android companion.
    - Synology Web Clipper, the browser extension for capturing web content into Note Station.
  sources:
    - >
      https://global.download.synology.com/download/Document/Software/UserGuide/Firmware/DSM/5.1/enu/Syno_UsersGuide_NAServer_enu.pdf
    - https://kb.synology.com/en-us/DSM/help/NoteStation/note_station_desc
    - https://www.synology.com/en-uk/dsm/7.2/software_spec/note_station
    - https://www.synology.com/en-uk/dsm/feature/note_station
    - https://www.synology.com/en-us/releaseNote/NoteStation?model=DS115
    - source_facts.package-manager
  summary:
    - >
      Synology Note Station Client is the offline desktop companion for the Note Station
      package running on a Synology NAS. It synchronizes notebooks, notes, tasks, tags,
      and attachments with the user's NAS-hosted library.
  timeline:
    - >
      2014: DSM 5.1-era official documentation describes Note Station and its mobile
      companion.
    - '2021: Note Station 2.6 added DSM 7 compatibility and interface and editing improvements.'
    - '2024: Synology published a Note Station maintenance release addressing security issues.'
  usage:
    - >
      Install and configure Note Station on a Synology NAS, then connect the desktop
      client using the NAS address and a permitted DSM account.
    - >
      Create and edit notes offline, organize them into shelves and notebooks, manage
      tasks and attachments, and synchronize changes with the NAS after reconnecting.
