  unix:
    - $XDG_CONFIG_HOME/gmailctl/credentials.json
    - $XDG_CONFIG_HOME/gmailctl/token.json
    - ~/.config/gmailctl/credentials.json
    - ~/.config/gmailctl/token.json
    - ~/.gmailctl/credentials.json
    - ~/.gmailctl/token.json
history:
  adoption-history:
    - >
      gmailctl's adoption story is that of a focused personal-infrastructure tool rather
      than a large ecosystem platform. It reached package managers such as Homebrew,
      Fedora, MacPorts, Nix, and Snap, making a Gmail-account automation workflow
      installable through normal workstation provisioning.
    - >
      The repository's star count and package availability indicate a recognizable niche
      among users who want email rules to live in version control and code review,
      especially people already comfortable with command-line tools and declarative
      configuration.
  package-nerd-significance:
    - >
      For package users, gmailctl is a small example of SaaS configuration drifting into
      dotfile territory. It packages the hidden state of a Gmail account as a
      CLI-managed artifact, so a mail workflow can be installed and upgraded alongside
      other command-line tools.
  project-history:
    - >
      The public repository was created in 2018 by Marco Bertoni. The README frames the
      project around a practical frustration with long, hard-to-audit Gmail filter lists
      and contrasts gmailctl with tools that generate XML for manual import.
    - >
      The project developed around a small CLI surface: init, edit, diff, apply,
      download, export, and debug. Versioned GitHub releases show a 0.x series
      continuing from 2021 through 2026, with prebuilt binaries and Go installation
      documented upstream.
  related-projects:
    - >
      gmail-britta is cited by the README as an earlier Gmail-filter DSL approach based
      around XML import.
    - >
      Jsonnet supplies the configuration language used for composable Gmail filter
      definitions.
  sources:
    - https://api.github.com/repos/mbrt/gmailctl
    - https://github.com/mbrt/gmailctl
    - https://github.com/mbrt/gmailctl/releases
  summary:
    - >
      gmailctl is a Go command-line tool for maintaining Gmail filters as declarative
      Jsonnet configuration. It treats mail filtering rules as code: users edit a local
      configuration, review a diff, and apply the result through the Gmail API instead
      of importing XML filters by hand.
  timeline:
    - '2018: Public GitHub repository created.'
    - '2021: Version 0.10.0 published in the GitHub releases stream.'
    - '2026: Version 0.12.0 published.'
  usage:
    - >
      Practitioners run gmailctl init to set up Gmail API access, then use gmailctl edit
      or a local Jsonnet file to maintain filters. The tool can show diffs against Gmail
      settings, apply the local configuration, export XML, and download existing filters
      as a migration starting point.
    - >
      Its main operational value is repeatability: filter rules can be reviewed, backed
      up, refactored, and reapplied, while credentials and tokens stay in the gmailctl
      configuration directory.
related-packages:
  - id: brew:jsonnet
    reason: >
      gmailctl configurations are written in Jsonnet, so the Jsonnet interpreter and
      formatter are useful for learning, validating, and maintaining the same
      declarative language outside gmailctl.
    rel: adjacent_workflow
    sources:
      - https://github.com/mbrt/gmailctl#configuration
      - https://jsonnet.org/learning/
