history:
  adoption-history:
    - >
      Tinderbox developed a durable specialist community among writers, researchers,
      analysts, educators, and knowledge-management practitioners. Eastgate maintains an
      official forum, regular community meetups, extensive examples, and a continuing
      commercial upgrade program.
    - >
      Homebrew Cask gives package-oriented Mac users an additional installation route,
      while Tinderbox documents remain locally stored XML files under the user’s
      control.
  package-nerd-significance:
    - >
      Tinderbox is notable as a deep, scriptable personal-information environment rather
      than a conventional notes database. Agents, attributes, actions, prototypes,
      multiple visualizations, and flexible export reward users who treat notes as
      structured and transformable data.
    - >
      Its continued development since the early Mac OS X era also makes it a long-lived
      example of independent native Mac software surviving major platform, architecture,
      and distribution transitions.
  project-history:
    - >
      Eastgate Systems launched Tinderbox, known as Ceres during early builds, on
      February 19, 2002 as Mac users were moving to Mac OS X. Mark Bernstein is its
      designer, building on Eastgate’s long involvement with hypertext systems.
    - >
      Successive releases expanded Tinderbox’s maps, outlines, timelines, attributes,
      prototypes, agents, action language, and HTML/XML export. Version 6 marked a
      substantial rewrite using Xcode and then-current Apple frameworks; later releases
      added native Apple Silicon support and continued expanding visualization,
      automation, and integration features.
  related-projects:
    - Storyspace
    - DEVONthink
    - Apple Notes
    - Evernote
  sources:
    - Input `source_facts.description` and `source_facts.package-manager`.
    - https://forum.eastgate.com/t/tinderbox-releases-a-timeline/5630
    - https://www.eastgate.com/Tinderbox/
    - https://www.eastgate.com/Tinderbox/cookbook/
    - https://www.eastgate.com/Tinderbox/download.html
  summary:
    - >
      Tinderbox is Eastgate Systems’ long-running macOS environment for capturing,
      structuring, visually mapping, analyzing, automating, and publishing notes.
  timeline:
    - '2002: Tinderbox launched publicly on February 19.'
    - >
      Version 4 era: Agents, rules, maps, outlines, and embedded export templates
      continued to expand.
    - >
      Version 6: The application underwent a major rewrite using modern Apple
      development frameworks.
    - 'Version 8.9: Tinderbox became native on Apple Silicon.'
  usage:
    - >
      Users create locally stored Tinderbox documents, arrange notes in maps or
      outlines, define structured attributes and prototypes, and use persistent agents
      to collect notes matching queries. Action code can transform metadata, while
      export templates produce HTML, XML, RSS, OPML, and other text formats.
