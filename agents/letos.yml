history:
  adoption-history:
    - >
      The application accumulated a long cross-platform user base under the SQLiteStudio
      name. It added macOS support in the 2.0 generation, was rewritten for better
      performance and maintainability in the 3.0 generation, and continued through
      package-manager distributions before adopting the Letos name.
  package-nerd-significance:
    - >
      Letos is useful when a package-oriented workflow needs a graphical way to inspect,
      edit, query, import, or export SQLite files without introducing a server database.
      Its plugin architecture, SQL editor, encrypted-database support, and portable
      builds give it a broader scope than a minimal database browser.
  project-history:
    - >
      Paweł Salawa began the project in early 2007 after failing to find a sufficiently
      simple SQLite manager. The original Tcl/Tk application was released as
      SQLiteStudio 1.0.0 in 2008; SQLiteStudio 2.0.0 followed in 2010 and added the
      first macOS port.
    - >
      Development of a C++ and Qt rewrite began in 2013, leading to the 3.0 generation.
      In 2026 the application became Letos to avoid the recurring misconception that
      SQLiteStudio was affiliated with the official SQLite project. The 4.0 generation
      also moved to Qt 6 and added features including an ERD editor.
  related-projects:
    - SQLite
    - Qt
    - SQLCipher
    - SQLite3 Multiple Ciphers
    - Letos Android connector
  sources:
    - https://github.com/pawelsalawa/letos
    - https://github.com/pawelsalawa/letos/blob/master/ChangeLog.md
    - https://github.com/pawelsalawa/letos/wiki/FAQ
    - https://github.com/pawelsalawa/letos/wiki/Letos
  summary:
    - >
      Letos is the continuation of SQLiteStudio, a free, open-source desktop manager for
      SQLite databases. It provides database browsing and editing, SQL execution, import
      and export tools, plugins, and support for several SQLite-related database
      formats.
  timeline:
    - '2007: Development began under the SQLiteStudio name.'
    - '2008: SQLiteStudio 1.0.0 reached its final release.'
    - '2010: Version 2.0.0 introduced a macOS port and a real SQL parser.'
    - '2013: Work began on the C++ and Qt rewrite that became the 3.0 generation.'
    - '2026: The project was renamed Letos and its 4.0 generation moved to Qt 6.'
  usage:
    - >
      Users open or register SQLite database files, browse schema and table data, edit
      records, execute SQL, and import or export data. Letos also supports extensions,
      plugins, custom SQL functions, and several encrypted SQLite formats.
