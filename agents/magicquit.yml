history:
  adoption-history:
    - >
      MagicQuit is distributed as a conventional macOS application and through the
      Homebrew cask recorded in source_facts.package-manager. Its official site presents
      it as a free, offline utility, while the public repository enables users to audit
      or build it.
  package-nerd-significance:
    - >
      MagicQuit represents the small, focused macOS menu-bar utility: a native
      application with a public source tree, direct releases, and package-manager
      distribution. Version 2.0 is also an instructive example of migrating persistent
      per-app choices from display names to bundle identifiers.
  project-history:
    - >
      MagicQuit was created to reduce desktop clutter and background resource use by
      politely quitting inactive applications. Its early 1.x line provided idle-based
      quitting; the 2.0 release added quitting after the last window closes, changed
      tracking from polling to events, adopted native launch-at-login support, and
      rebuilt settings with native macOS controls.
  related-projects:
    - >
      The official homepage cites Arc's tab-closing behavior as inspiration for applying
      a similar cleanup idea to macOS applications.
    - >
      Homebrew Cask provides the package-manager installation represented by this
      project record.
  sources:
    - Input field source_facts.package-manager identifies the Homebrew cask.
    - 'Official README: https://github.com/BigBerny/magicquit#readme'
    - 'Official changelog: https://github.com/BigBerny/magicquit/blob/main/CHANGELOG.md'
    - 'Official homepage and FAQ: https://magicquit.com/'
  summary:
    - >
      MagicQuit is an open-source macOS menu-bar utility that automatically sends a
      normal quit request to applications after an idle interval or, optionally, after
      their last window closes. It is designed to remain unobtrusive and avoid data loss
      by never force-killing applications.
  timeline:
    - '2023-08-03: Version 1.3.1 is recorded in the official changelog.'
    - '2023-12-21: Version 1.4 refined exclusions for background applications.'
    - '2026-07-20: Version 2.0 added quit-on-last-window-close and event-based tracking.'
    - '2026-07-21: Version 2.0.1 fixed window-counting and retry behavior.'
  usage:
    - >
      Users control MagicQuit from its menu-bar icon, where they can inspect timers,
      exclude individual applications, or reset an idle timer. Settings cover the idle
      duration, launch at login, last-window-close behavior, and its exclusion list. The
      last-window feature requires macOS Accessibility permission; idle quitting does
      not.
