history:
  adoption-history:
    - >
      Logstalgia has persisted as a niche but recognizable log-visualization tool in
      package-manager culture. The supplied package facts list it across Homebrew,
      Debian, Ubuntu, Fedora, openSUSE, MacPorts, Nix, Scoop, and Alpine packaging
      ecosystems.
    - >
      The official GitHub repository shows visible long-tail adoption for a visual CLI
      utility, with roughly 1.8k stars, 172 forks, and releases continuing through
      `logstalgia-1.1.5` in March 2026.
  package-nerd-significance:
    - >
      For package nerds, Logstalgia is the durable example of a small C++/OpenGL CLI
      that made log files visual without becoming an observability platform. It sits at
      the odd intersection of sysadmin tooling, demo-scene aesthetics, and
      package-manager nostalgia.
  project-history:
    - >
      The project credits Andrew Caudwell and carries a 2008 copyright notice in its
      upstream README. Its GitHub repository was created in December 2009 and remains
      the official source repository for the Logstalgia codebase.
    - >
      The README presents Logstalgia as a Unix-style tool around one executable,
      `logstalgia`, taking a log file path or `-` for standard input. Its options expose
      the visualizer's arcade metaphor: paddles, balls, groups, simulation speed, OpenGL
      display controls, and live reloadable user-supplied configuration files.
  related-projects:
    - >
      Logstalgia is closely related in spirit to Gource, another Andrew Caudwell
      visualization project, but Logstalgia targets web access logs rather than
      source-code history.
  sources:
    - https://api.github.com/repos/acaudwell/Logstalgia
    - https://github.com/acaudwell/Logstalgia#readme
    - https://github.com/acaudwell/Logstalgia/releases/tag/logstalgia-1.1.5
    - https://logstalgia.io/
    - source_facts.package-manager
  summary:
    - >
      Logstalgia is a command-line OpenGL visualizer that replays or streams web server
      access logs as a retro arcade-style simulation. It turns ordinary Apache, Nginx,
      and similar access logs into an animated view of requests, hosts, response codes,
      and paths.
  timeline:
    - '2008: Upstream README credits the original Logstalgia copyright to Andrew Caudwell.'
    - '2009: Official GitHub repository created.'
    - '2018: 1.1.x release series continues with `logstalgia-1.1.1` and `logstalgia-1.1.2`.'
    - '2026: `logstalgia-1.1.5` published on GitHub.'
  usage:
    - >
      Typical use is direct and pipeline-friendly: run `logstalgia access.log` for a
      saved log, or pipe live server logs with commands such as `tail -f
      /var/log/apache2/access.log | logstalgia --sync -`. The README also documents SSH
      streaming, time-window playback, custom grouping rules, and frame output for video
      capture.
    - >
      The tool is most useful with busy web logs because its real-time visualization
      depends on enough request volume to make the simulation interesting.
related-packages:
