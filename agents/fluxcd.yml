history:
  adoption-history:
    - >
      Weaveworks donated Flux and Flagger to the CNCF after Flux had gained production
      adoption and cloud-provider integrations. CNCF accepted Flux on 2019-07-15,
      advanced it to Incubating on 2021-03-12, and graduated it on 2022-11-30. Flux v2
      reached general availability in July 2023 and is used by organizations and cloud
      platforms for Kubernetes GitOps.
  package-nerd-significance:
    - >
      Flux helped establish GitOps as a Kubernetes operating pattern. Its v2
      architecture is notable for decomposing continuous delivery into composable
      controllers and custom-resource APIs rather than presenting only a monolithic
      deployment application.
  project-history:
    - >
      Engineers at Weaveworks started Flux in July 2016 to make internal deployments
      predictable. The project became increasingly Kubernetes-focused and added
      integrations with Helm and Kustomize. During its CNCF-era development, Flux was
      rewritten as Flux v2 around the GitOps Toolkit and specialized controllers.
  related-projects:
    - Kubernetes
    - GitOps Toolkit
    - Flagger
    - Helm
    - Kustomize
    - SOPS
  sources:
    - https://fluxcd.io/blog/2022/11/flux-is-a-cncf-graduated-project/
    - https://fluxcd.io/flux/migration/faq-migration/
    - https://github.com/fluxcd/flux2#readme
    - https://www.cncf.io/projects/flux/
  summary:
    - >
      Flux is a CNCF-graduated GitOps continuous-delivery system that reconciles
      Kubernetes clusters with declarative configuration from Git, OCI, Helm, buckets,
      and related sources.
  timeline:
    - '2016: Weaveworks engineers started Flux for predictable internal deployments.'
    - '2018: Flagger emerged as a Flux companion for progressive delivery.'
    - '2019: Flux was accepted into CNCF.'
    - '2021: Flux moved to CNCF Incubating.'
    - '2022: Flux became a CNCF Graduated project.'
    - '2023: Flux v2 reached general availability.'
  usage:
    - >
      Operators bootstrap Flux into a Kubernetes cluster, commit desired state to
      supported sources, and let its controllers reconcile applications and
      infrastructure. The flux CLI installs and bootstraps components, creates sources
      and secrets, inspects reconciliation, and supports automation workflows.
