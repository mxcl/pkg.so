history:
  adoption-history:
    - >
      EtreCheck was designed for use with the Apple Support Community, where users could
      generate a compact diagnostic report and share it with experienced helpers. The
      current EtreCheckPro remains free to run, with an optional one-time Power User
      purchase that adds automated solutions and richer analysis.
    - >
      The tool also supports consultants and IT support through its free text report and
      command-line operation, although the optional Power User package is aimed
      primarily at individual end users.
  package-nerd-significance:
    - >
      EtreCheckPro is useful to Mac package maintainers and support specialists because
      it inventories software, launch agents, security findings, storage, hardware, and
      performance in a report intended to be shared without requiring a conventional
      installer.
    - >
      Its portable-app installation model is simple, but uninstallers and package
      maintainers should note the retained report history and the optional activation
      code stored in the user's Login Keychain.
  project-history:
    - >
      EtreCheck evolved into EtreCheckPro as a macOS diagnostic and reporting utility
      produced by Etresoft. Officially retained older builds support legacy macOS
      releases, while current versions are universal binaries for Intel and Apple
      Silicon Macs.
    - >
      The free core workflow remains centered on generating and interpreting a report. A
      separately purchased Power User package adds computer-generated solutions,
      supporting detail, analytics, and comparisons.
  related-projects:
    - >
      Apple Support Community: the support setting for which the official FAQ says
      EtreCheck was designed.
    - 'EtreCheck 6.5.6: an officially retained legacy build for older macOS systems.'
  sources:
    - 'Official EtreCheckPro FAQ: https://etrecheck.com/en/faq.html'
    - 'Official EtreCheckPro details: https://etrecheck.com/en/details.html'
    - 'Official EtreCheckPro welcome page: https://etrecheck.com/en/welcome.html'
  summary:
    - >
      EtreCheckPro is a macOS diagnostic utility that produces reports about hardware,
      software, storage, security, networking, and performance, helping users identify
      problems or share findings with support communities.
  timeline:
    - >
      Earlier product era: EtreCheck established a report-sharing workflow designed for
      the Apple Support Community.
    - >
      EtreCheckPro era: The product combined a free diagnostic workflow with an optional
      one-time Power User upgrade.
    - >
      Version 6.8: Current-generation universal builds support both Intel and Apple
      Silicon Macs.
    - >
      Version 7: Officially announced as a forthcoming interface and feature redesign
      requiring a newer macOS baseline.
  usage:
    - >
      Users run the standalone app, choose a problem, describe it, and generate a
      report. They then review major and minor findings, security or malware warnings,
      storage issues, and can share the report for help.
    - >
      EtreCheckPro does not require formal installation and may run directly from
      Downloads or be moved to Applications. Generated reports are retained and managed
      through the Previous reports commands in the File menu.
