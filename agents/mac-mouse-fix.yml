id: cask:mac-mouse-fix
display-name: Mac Mouse Fix
repo: null
docs:
  - https://github.com/noah-nuebling/mac-mouse-fix#readme
  - https://github.com/noah-nuebling/mac-mouse-fix/discussions/101
config-file-location:
  macos:
    - ~/Library/Application Support/com.nuebling.mac-mouse-fix/config.plist
credentials-file-location: null
history:
  adoption-history:
    - >
      The project progressed through major 1.x, 2.x, and 3.x generations. Version 2
      introduced a substantially expanded remapping engine and click-and-drag gestures
      that simulate trackpad navigation; version 3 retained source availability while
      introducing a time-limited trial and paid license.
    - >
      The application has accumulated translations, hardware-compatibility discussions,
      and a large public issue and discussion archive. Older 2.x builds remain available
      for older macOS releases and for users who prefer the fully free generation.
  package-nerd-significance:
    - >
      Mac Mouse Fix is a prominent example of a focused macOS utility growing into a
      polished input-remapping system while keeping its implementation public. It
      combines event interception, smooth-scrolling physics, button chords, keyboard
      actions, and synthesized trackpad-like gestures.
    - >
      Its human-readable property-list configuration and separate background helper are
      useful to users who back up dotfile-adjacent application state or study macOS
      Accessibility and input-event APIs.
  project-history:
    - >
      Mac Mouse Fix was created by Noah Nuebling to improve inexpensive and third-party
      mice on macOS. Its scope grew from basic scrolling and button behavior into
      configurable gestures, keyboard mappings, desktop navigation, and trackpad-style
      interactions.
  related-projects:
    - >
      Logitech Options and SteerMouse address related third-party mouse customization
      use cases.
    - >
      Apple's Accessibility permission system and macOS event APIs are required for Mac
      Mouse Fix's background helper and input remapping.
  sources:
    - https://github.com/noah-nuebling/mac-mouse-fix
    - https://github.com/noah-nuebling/mac-mouse-fix/discussions/133
    - https://github.com/noah-nuebling/mac-mouse-fix/discussions/236
    - https://github.com/noah-nuebling/mac-mouse-fix/releases
    - https://macmousefix.com/
  summary:
    - >
      Mac Mouse Fix is a macOS mouse-customization utility that adds smooth scrolling,
      flexible button mappings, keyboard actions, and trackpad-like gestures to many
      third-party mice.
  timeline:
    - '1.x: The initial generation established the core mouse-enhancement utility.'
    - >
      2021: The developer documented the first Mac Mouse Fix 2 beta's new gesture
      simulation and remapping engine.
    - >
      2.x: Mac Mouse Fix remained free and broadened gesture, shortcut, and older-macOS
      support.
    - >
      3.0: The project adopted a free trial and paid-license model while remaining
      source-available.
    - >
      3.x: Configuration handling, modern macOS compatibility, scrolling behavior, and
      licensing reliability continued to evolve.
  usage:
    - >
      Users grant Accessibility access to the bundled helper, then assign clicks, holds,
      double-clicks, drags, keyboard shortcuts, Mission Control actions, and scrolling
      behavior to mouse controls.
    - >
      It is aimed at conventional third-party mice; the official README notes that some
      devices using proprietary protocols may expose only part of their button set, and
      Magic Mouse enhancement is not currently its focus.
