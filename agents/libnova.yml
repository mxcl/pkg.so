history:
  adoption-history:
    - >
      libnova has been adopted as a small scientific-system dependency rather than a
      standalone end-user tool. It is packaged across Unix-like systems and gives
      astronomy applications, observation planners, and command-line utilities a
      reusable C implementation of common celestial calculations.
    - >
      For Homebrew users the visible executable is libnovaconfig, but the package's real
      value is the development library and headers used by downstream software needing
      fast local ephemeris-style calculations.
  package-nerd-significance:
    - >
      libnova is a classic niche library package: it turns book-grade astronomical
      algorithms into a reusable C dependency with a stable Unix build story. That makes
      it interesting to package maintainers because downstream tools can depend on a
      small LGPL library instead of carrying private copies of the same math.
    - >
      Its SourceForge-era history, Doxygen documentation, and broad distribution
      packaging make it a good example of long-lived scientific infrastructure that
      rarely draws attention but keeps old and new astronomy programs buildable.
  project-history:
    - >
      The project is documented as the calculation engine used by the Nova project, with
      Liam Girdwood and Petr Kubanek listed as maintainers. Its documentation credits
      Jean Meeus's Astronomical Algorithms, the ELP lunar solution, and VSOP87 planetary
      theory as important algorithmic sources.
    - >
      SourceForge file history shows public libnova releases from 0.4 in September 2002
      through 0.15.0 in July 2012, with later SourceForge source-control tags for v0.13,
      v0.14, and v0.16. The repository view also records the 2013 move from Subversion
      to Git and later work on ELP lunar data and coordinate tests.
  related-projects:
    - >
      Nova is the project named by libnova's documentation as using libnova as its
      calculation engine.
    - >
      Jean Meeus's Astronomical Algorithms, the ELP lunar solution, and VSOP87 planetary
      theory are named in the libnova documentation as important algorithmic
      foundations.
    - >
      Other astronomy libraries and ephemeris tools fill adjacent roles, but libnova's
      niche is a compact C library packaged by general-purpose Unix package managers.
  sources:
    - https://formulae.brew.sh/formula/libnova
    - https://libnova.sourceforge.net/
    - https://sourceforge.net/p/libnova/libnova/ci/master/tree/
    - https://sourceforge.net/projects/libnova/files/libnova/
  summary:
    - >
      libnova is a C library for celestial mechanics, astrometry, and astrodynamics. It
      packages astronomical algorithms into a Unix-friendly library so programs can
      calculate planetary positions, rise and set times, coordinate transformations,
      lunar positions, and related values without embedding their own astronomy code.
  timeline:
    - '2002: SourceForge release directory records libnova 0.4.'
    - '2003: Releases 0.6.0, 0.7, and 0.8 appear in the SourceForge archive.'
    - '2004: Releases 0.9, 0.10, and 0.10.1 appear in the SourceForge archive.'
    - '2012: SourceForge release directory records libnova 0.15.0.'
    - '2013: Source repository records a move from Subversion to Git.'
    - >
      2016: Source repository records additional coordinate-test work on the Git master
      branch.
  usage:
    - >
      Developers link libnova into C or C++ software that needs Julian dates, sidereal
      time, apparent positions, solar and lunar coordinates, planetary positions, orbit
      calculations, angular separations, and rise-set-transit calculations.
    - >
      The package is useful when an application needs deterministic local computations
      rather than calling an online ephemeris service, especially in observatory,
      amateur astronomy, and scientific scripting contexts.
