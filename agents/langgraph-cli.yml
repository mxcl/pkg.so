id: brew:langgraph-cli
display-name: LangGraph CLI
repo: https://github.com/langchain-ai/langgraph
docs:
  - https://docs.langchain.com/langgraph-platform/langgraph-cli
  - https://reference.langchain.com/python/langgraph-cli
config-file-location:
  unix:
    - langgraph.json
credentials-file-location:
  unix:
    - .env
history:
  adoption-history:
    - >
      The CLI follows LangGraph's broader adoption among AI-agent developers: it
      packages local development, Docker image generation, and deployment commands
      behind one command name. The upstream README cites companies such as Klarna,
      Replit, and Elastic as LangGraph users, which made the CLI part of the operational
      tooling around a visible agent framework.
  package-nerd-significance:
    - >
      For package nerds, LangGraph CLI is interesting because it is not just a wrapper
      around a library: it is the packaging boundary between agent source trees, local
      service orchestration, Docker images, and hosted LangGraph deployments. Its
      Homebrew formula also reflects a Python AI tool being distributed as a first-class
      command-line utility.
  project-history:
    - >
      LangGraph grew out of the LangChain ecosystem as lower-level infrastructure for
      stateful, long-running agent workflows. The LangGraph repository describes the
      core framework as orchestration infrastructure for durable execution,
      human-in-the-loop control, memory, debugging, and production deployment.
    - >
      The CLI package is housed in the LangGraph monorepo under `libs/cli` and is
      published as the `langgraph-cli` Python package. Its project metadata describes it
      as a CLI for interacting with the LangGraph API, with a `langgraph` console script
      and dependencies for HTTP access, dotenv loading, and LangGraph SDK integration.
  related-projects:
    - >
      Related projects include LangGraph, LangChain, LangSmith, LangGraph.js, and the
      LangGraph SDK packages used by the CLI.
  sources:
    - https://docs.langchain.com/langgraph-platform/langgraph-cli
    - https://github.com/langchain-ai/langgraph
    - https://pypi.org/project/langgraph-cli/
    - https://raw.githubusercontent.com/langchain-ai/langgraph/main/libs/cli/pyproject.toml
    - https://reference.langchain.com/python/langgraph-cli
  summary:
    - >
      LangGraph CLI is the command-line tool for creating, developing, building, and
      running LangGraph applications and LangGraph API servers.
  timeline:
    - >
      2024: LangGraph became a prominent LangChain-family project for stateful agent
      workflows.
    - >
      2024: `langgraph-cli` appeared as a Python package for interacting with LangGraph
      API projects.
    - >
      2025-2026: The CLI docs describe Python and JavaScript command variants for build,
      deploy, up, and Dockerfile workflows.
  usage:
    - >
      The docs define `langgraph.json` as the default configuration file for declaring
      dependencies, graphs, and environment variables. Common commands include local
      development, image build, deployment, starting services with Docker Compose, and
      generating Dockerfiles.
