id: cask:pdf-squeezer
display-name: PDF Squeezer
repo: null
docs:
  - https://www.witt-software.com/faq
  - https://www.witt-software.com/pdfsqueezer
config-file-location:
  macos:
    - ~/Library/Containers/com.witt-software.PDF-Squeezer
    - ~/Library/Containers/com.witt-software.PDF-Squeezer-setapp
credentials-file-location: null
history:
  adoption-history:
    - >
      Witt Software's official press archive records coverage of PDF Squeezer from at
      least 2012 onward. The product later expanded beyond macOS to iPhone and iPad and
      is distributed through the developer's site, Apple's App Store, and Setapp.
  package-nerd-significance:
    - >
      PDF Squeezer represents the focused commercial Mac utilities commonly distributed
      through Homebrew casks. It also exposes an embedded command-line helper, which can
      be useful in scripted PDF workflows even though the package is primarily
      graphical.
  project-history:
    - >
      PDF Squeezer was created by Witt Software as a specialized utility for reducing
      PDF file sizes. The official FAQ describes many years of free updates before a
      ground-up redesign became the first paid major upgrade, version 4.
    - >
      Later releases added native support for both Apple silicon and Intel Macs. Witt
      Software also produced iPhone, iPad, and Windows editions.
  related-projects:
    - >
      PDF Squeezer complements scanners, PDF editors, mail clients, and archival
      workflows. Witt Software also publishes PDF Protector and PDF Text Include for
      other PDF operations.
  sources:
    - https://witt-software.com/press/
    - https://www.witt-software.com/faq/
    - https://www.witt-software.com/pdfsqueezer/
  summary:
    - >
      PDF Squeezer is a commercial document utility that reduces PDF size by
      recompressing images and removing unnecessary document data.
  timeline:
    - "2012: Witt Software's press archive records public coverage of PDF Squeezer."
    - >
      2020s: PDF Squeezer was rebuilt as version 4, its first paid major upgrade after
      years of free updates.
    - "2024: Witt Software's press archive recorded the release of an iPhone and iPad edition."
    - '2025: The press archive recorded coverage of PDF Squeezer 4.'
  usage:
    - >
      Users add PDFs, select or customize a compression profile, compare the result, and
      save or drag out the compressed copy. The application supports batches,
      password-protected PDFs, an Automator action, and a command-line helper.
