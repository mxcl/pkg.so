id: cask:dbeaverultimate
display-name: DBeaver Ultimate
repo: null
docs:
  - https://dbeaver.com/docs/dbeaver
config-file-location:
  macos:
    - /Applications/DBeaverUltimate.app/Contents/Eclipse/dbeaver.ini
    - ~/Library/DBeaverData/workspace6/General/.dbeaver/data-sources.json
    - ~/Library/DBeaverData/workspace6/General/.dbeaver/tasks.json
credentials-file-location:
  macos:
    - ~/Library/DBeaverData/secure/
history:
  adoption-history:
    - >
      Ultimate targets professional users who need a single desktop application for
      traditional databases, NoSQL systems, and cloud data services. It occupies the
      broadest individual-user position in DBeaver's commercial desktop lineup.
  package-nerd-significance:
    - >
      The Ultimate package selects DBeaver's feature-complete commercial desktop bundle.
      Keeping it distinct from Community, Lite, Enterprise, and Team editions is
      important for licensing, application identity, supported integrations, and upgrade
      behavior.
  project-history:
    - >
      DBeaver Ultimate is the multi-cloud commercial desktop edition in the DBeaver
      family. It combines database development and administration features with native
      integrations for major cloud platforms and cloud storage.
  related-projects:
    - DBeaver Community
    - DBeaver Lite
    - DBeaver Enterprise
    - DBeaver Team Edition
    - CloudBeaver
  sources:
    - https://dbeaver.com/dbeaver-ultimate/
    - https://dbeaver.com/docs/dbeaver/
    - https://dbeaver.com/docs/dbeaver/Configuration-files-in-DBeaver/
    - https://dbeaver.com/docs/dbeaver/Workspace-Location/
  summary:
    - >
      DBeaver Ultimate is DBeaver's comprehensive commercial desktop client for
      on-premises and cloud database work.
  timeline:
    - >
      Commercial product era: Ultimate becomes DBeaver's broad individual-user edition
      for database and multi-cloud workflows.
  usage:
    - >
      Users connect to heterogeneous databases and cloud services, develop and debug
      SQL, edit or compare data and schemas, administer databases, transfer data, and
      explore cloud resources from one desktop client.
tags:
  - cloud
  - commercial
  - data-migration
