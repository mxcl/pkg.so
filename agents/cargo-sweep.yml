history:
  adoption-history:
    - >
      GitHub records the repository as created in November 2018, and crates.io records
      the first cargo-sweep release in the same month. The input package facts list
      Homebrew, Nix, and Arch packages.
  package-nerd-significance:
    - >
      cargo-sweep is notable for Cargo users who accumulate large target directories or
      CI caches, because it offers narrower cleanup choices than Cargo's built-in `cargo
      clean`.
  project-history:
    - >
      The README describes cargo-sweep as a selective cleanup tool for Cargo build
      artifacts and currently marks the project as unmaintained while pointing users
      toward cargo-clean-all as an alternative.
  related-projects:
    - >
      The README lists Cargo's built-in `cargo clean` and cargo-clean-all as related
      cleanup tools.
  sources:
    - https://api.github.com/repos/holmgr/cargo-sweep
