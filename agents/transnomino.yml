history:
  adoption-history:
    - >
      Transnomino is offered as a free Mac utility and is distributed through the
      Homebrew cask recorded in `source_facts.package-manager`. Its recipe files and
      command-line arguments make it suitable both for occasional interactive renaming
      and repeatable automation.
  package-nerd-significance:
    - >
      Transnomino brings composable, previewable rename pipelines to macOS users who
      need more than Finder's basic batch-renaming facility but do not want to construct
      shell pipelines. Its recipe format also gives advanced users a reusable artifact
      that can be launched from scripts.
  project-history:
    - >
      Transnomino has evolved through multiple major releases documented by its official
      changelog. Version 7 expanded recipe and action workflows in 2022, version 9
      adopted Swift 6 strict-concurrency work in 2024, and version 10 refreshed the
      interface and metadata handling in 2026.
  related-projects:
    - >
      It overlaps with command-line batch-renaming tools and Finder's built-in rename
      feature, while adding regular expressions, metadata tokens, path transformations,
      previews, recipes, and folder automation.
  sources:
    - Homebrew cask identity supplied by `source_facts.package-manager`.
    - 'Official automation guide: https://www.transnomino.com/automation/automation.html'
    - 'Official changelog: https://www.transnomino.com/download/changelog.pdf'
    - 'Official product page: https://www.transnomino.com/'
  summary:
    - >
      Transnomino is a free macOS batch-renaming application. It builds rename
      operations as an ordered recipe and previews the resulting filenames before
      modifying files.
  timeline:
    - '2022: Version 7 expanded recipe and renaming-action behavior.'
    - '2024: Version 9 moved the application toward Swift 6 strict-concurrency compliance.'
    - '2026: Version 10 introduced a restyled interface and revised metadata handling.'
  usage:
    - >
      Users load files or directories, compose actions such as replacement, regular
      expressions, numbering, trimming, case conversion, or metadata insertion, inspect
      the live preview, and then apply the rename.
    - >
      Recipes can be saved at any user-chosen path and supplied with `-r`; directories
      can be supplied with `-d`. The official folder-automation example combines a
      recipe with a macOS Folder Action script.
