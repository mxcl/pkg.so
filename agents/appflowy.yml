history:
  adoption-history:
    - >
      AppFlowy attracted users and contributors looking for an open-source,
      self-hostable alternative to proprietary workspace applications. Its native
      desktop and mobile clients, offline operation, local data ownership, and optional
      AppFlowy Cloud synchronization broadened it beyond a developer-only project.
    - >
      The project is distributed as native applications and through package systems such
      as Homebrew Cask. Its ecosystem also includes separately reusable editor
      components and self-hosting infrastructure.
  package-nerd-significance:
    - >
      AppFlowy is notable to package users as a substantial cross-platform desktop
      application built from Flutter and Rust rather than a thin web wrapper. It also
      exemplifies the packaging challenges of modern local-first applications: native
      bundles, SQLite-backed user data, optional cloud services, and frequent releases.
    - >
      For open-source productivity enthusiasts, it is a prominent package in the
      Notion-alternative category and a practical test case for self-hosted
      collaboration stacks.
  project-history:
    - >
      AppFlowy was launched as an open-source alternative to Notion centered on user
      control of data and customization. The project developed a cross-platform
      application using Flutter for its interface and Rust for backend components.
    - >
      The product expanded from local documents and workspaces into databases, boards,
      calendars, templates, mobile clients, collaboration, and optional cloud
      synchronization while retaining offline and self-hosting use cases.
  related-projects:
    - >
      AppFlowy is commonly compared with Notion. Its wider project family includes
      AppFlowy Cloud and the reusable AppFlowy Editor, while its implementation uses
      Flutter, Rust, and SQLite.
  sources:
    - https://docs.appflowy.io/docs
    - https://docs.appflowy.io/docs/appflowy/readme/welcome-to-appflowy
    - >
      https://docs.appflowy.io/docs/documentation/software-contributions/architecture/frontend/user/user-data
  summary:
    - >
      AppFlowy is an open-source, cross-platform workspace for notes, knowledge
      management, databases, and project organization, designed around local data
      control and optional self-hosting.
  timeline:
    - '2021: AppFlowy was introduced publicly as an open-source Notion alternative.'
    - >
      Early development: The project established a Flutter interface with Rust backend
      components and local SQLite storage.
    - >
      Later expansion: Mobile applications, AppFlowy Cloud synchronization,
      collaboration, and self-hosting became part of the ecosystem.
  usage:
    - >
      Users organize material into workspaces containing documents, databases, boards,
      calendars, and related views. AppFlowy can operate locally and offline or
      synchronize through AppFlowy Cloud or a self-hosted deployment. The application
      exposes its data-folder choice through Settings → Files; official documentation
      does not establish a fixed configuration-file path or a separate credentials-file
      location.
related-packages:
  - id: cask:notion
    reason: >
      Choose Notion for its mature hosted workspace and integration ecosystem; choose
      AppFlowy when native offline use, source availability, data control, or
      self-hosting is the deciding requirement.
    rel: alternative
    sources:
      - https://docs.appflowy.io/docs
      - https://appflowy.com/blog/appflowy-1st-anniversary-and-2022-recap
      - https://www.notion.com/help/guides/what-is-notion
  - id: cask:affine
    reason: >
      Choose AFFiNE when whiteboarding and free-form visual thinking are central; choose
      AppFlowy for a workspace more strongly oriented around relational databases,
      structured project workflows, and native self-hosted collaboration.
    rel: alternative
    sources:
      - https://appflowy.com/blog/best-self-hosted-notion-alternatives
      - https://affine.pro/
      - https://docs.affine.pro/
