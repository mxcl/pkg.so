id: brew:forego
display-name: forego
repo: null
docs:
  - https://github.com/ddollar/forego
config-file-location:
  unix:
    - ./Procfile
credentials-file-location: null
history:
  adoption-history:
    - >
      forego fits the Heroku/Procfile development pattern: packages install one
      executable, projects carry a Procfile, and developers use a local supervisor to
      run web and worker processes with prefixed output.
  package-nerd-significance:
    - >
      forego is significant as a tiny, compiled alternative to Ruby Foreman for
      Procfile-based app development. For package managers it is a low-dependency Go
      binary that preserves a well-known developer workflow.
  project-history:
    - >
      The official README is deliberately sparse: it identifies David Dollar's Foreman
      as the model, points to downloadable builds, and shows source installation with
      Go. The repository tag list contains a 0.x release series ending at v0.16.1.
  related-projects:
    - >
      The README explicitly relates forego to ddollar/foreman and to the Procfile
      convention used by multi-process web applications.
  sources:
    - https://github.com/ddollar/forego
    - https://raw.githubusercontent.com/ddollar/forego/master/README.md
  summary:
    - >
      forego is a small Go implementation of Foreman-style Procfile process management.
      Its README describes it simply as 'Foreman in Go' and demonstrates starting
      multiple named processes from a Procfile.
  timeline:
    - '2015: README license line credits David Dollar and Apache 2.0.'
    - 'v0.16.1: official Git tags show the latest listed 0.x tag.'
  usage:
    - >
      A project writes process entries such as 'web: bin/web start -p $PORT' and
      'worker: bin/worker queue=FOO' in Procfile, then runs forego start. The README
      directs users to forego help and per-command help for details.
related-packages:
  - id: brew:foreman
    reason: >
      Choose Foreman for the original Ruby implementation and its documented Procfile
      validation, one-off commands, scaling options, and service-manager export formats;
      choose forego for a small Go executable.
    rel: alternative
    sources:
      - https://github.com/ddollar/forego#readme
      - https://ddollar.github.io/foreman/
  - id: brew:goreman
    reason: >
      Choose goreman when you want a currently documented Go-based Foreman clone with
      Procfile and environment-file controls; forego offers the simpler original
      “Foreman in Go” interface.
    rel: alternative
    sources:
      - https://github.com/ddollar/foreman#ports
      - https://github.com/mattn/goreman#readme
  - id: brew:honcho
    reason: >
      Choose Honcho for a Python implementation with documented Procfile parsing and
      environment handling, especially in Python-centered development environments.
    rel: alternative
    sources:
      - https://github.com/ddollar/foreman#ports
      - https://honcho.readthedocs.io/en/stable/using_procfiles.html
