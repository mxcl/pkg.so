id: cask:keepassxc
display-name: KeePassXC
repo: null
docs:
  - https://keepassxc.org/docs
  - https://keepassxc.org/docs/KeePassXC_GettingStarted
  - https://keepassxc.org/docs/KeePassXC_UserGuide
config-file-location:
  linux:
    - ~/.config/keepassxc/keepassxc.ini
    - ~/.local/state/keepassxc/keepassxc_local.ini
  macos:
    - ~/Library/Application Support/KeePassXC/keepassxc.ini
    - ~/Library/Caches/KeePassXC/keepassxc_local.ini
  windows:
    - '%APPDATA%\KeePassXC\keepassxc.ini'
    - '%LOCALAPPDATA%\KeePassXC\keepassxc_local.ini'
credentials-file-location: null
history:
  adoption-history:
    - >
      KeePassXC became the actively maintained community continuation for KeePassX users
      after development activity in KeePassX declined; the official FAQ notes that
      KeePassX later formally ceased development.
    - >
      The project expanded distribution across Linux, Windows, and macOS, including
      AppImage and Snap builds and an official Ubuntu PPA. Browser integration, a
      command-line client, and hardware-token support broadened it beyond a basic
      desktop password vault.
  package-nerd-significance:
    - >
      KeePassXC is important to package-oriented users because it keeps password storage
      local and file-based rather than requiring a hosted account. A KDBX database can
      be backed up or synchronized with tools chosen by the user and opened by other
      compatible implementations.
    - >
      It is also a notable cross-platform Qt security application with GUI, CLI,
      browser-integration, SSH-agent, Auto-Type, TOTP, and hardware-token workflows
      packaged across multiple desktop ecosystems.
  project-history:
    - >
      KeePassXC is a community-driven fork in the KeePass family, created after a
      decline in KeePassX development. The XC name reflects its focus on continued,
      cross-platform maintenance.
    - >
      The 2.1.0 release in January 2017 established the KeePassXC release line. Version
      2.2.0 added a CLI, YubiKey challenge-response, TOTP, Diceware generation, and
      portable mode. Version 2.3.0 added KDBX 4, Argon2, SSH-agent integration, and the
      KeePassXC-Browser integration.
  related-projects:
    - KeePass is the original Windows-centered password manager and KDBX ecosystem ancestor.
    - KeePassX was the cross-platform project from which KeePassXC was forked.
    - KeePassXC-Browser is the companion browser extension maintained by the project.
  sources:
    - 'Official 2.2.0 announcement: https://keepassxc.org/blog/2017-06-26-2.2.0-released/'
    - 'Official 2.3.0 announcement: https://keepassxc.org/blog/2018-02-28-2.3-released/'
    - 'Official FAQ and project comparison: https://keepassxc.org/docs/'
    - >
      Official changelog:
      https://github.com/keepassxreboot/keepassxc/blob/develop/CHANGELOG.md
    - 'Official user guide: https://keepassxc.org/docs/KeePassXC_UserGuide'
  summary:
    - >
      KeePassXC is a free, community-driven, cross-platform password manager that stores
      credentials in encrypted local KDBX database files. It emphasizes user-controlled
      storage while supporting desktop integration, browser filling, Auto-Type, one-time
      passwords, SSH-agent use, and command-line access.
  timeline:
    - '2017-01-22: KeePassXC 2.1.0 was released.'
    - >
      2017-06-26: Version 2.2.0 added the CLI, YubiKey support, TOTP, Diceware, and
      portable mode.
    - '2017-10-25: The project announced an official Ubuntu PPA.'
    - >
      2018-02-28: Version 2.3.0 added KDBX 4, Argon2, SSH-agent integration, and
      KeePassXC-Browser.
    - '2021-12-09: KeePassX formally announced that it was no longer developed.'
  usage:
    - >
      Users create or open a KDBX database, protect it with a master password and
      optionally a key file or hardware token, then organize credentials and generate
      unique passwords. Database files remain at user-selected locations rather than in
      a fixed credential directory.
    - >
      Common companion workflows include KeePassXC-Browser for browser filling,
      Auto-Type for desktop applications, TOTP storage, SSH-agent integration, and
      keepassxc-cli for scripts or terminal access.
