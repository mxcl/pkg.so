credentials-file-location: null
history:
  adoption-history:
    - >
      TextMate became a prominent native Mac editor among programmers and web developers
      during the mid-2000s. Its extensible bundle ecosystem spread language grammars,
      commands, snippets, and workflows beyond the features bundled with the
      application.
    - >
      TextMate's grammar and snippet conventions influenced other editors. Its
      scope-based language grammars became especially recognizable through their later
      reuse across the editor ecosystem.
  package-nerd-significance:
    - >
      TextMate joined Cocoa interface conventions to Unix commands and scripting, making
      it an influential example of a graphical editor built around composable
      command-line tools.
    - >
      Its bundles, scope selectors, snippets, macros, and `mate` command made the editor
      important to Mac-focused development workflows and editor-extension culture.
  project-history:
    - >
      Allan Odgaard created TextMate after becoming frustrated with the available code
      and markup editors on Mac OS X. MacroMates released TextMate 1.0 in October 2004.
    - >
      TextMate 1.5 followed in January 2006 with extensive changes and support for both
      PowerPC and Intel Macs. The TextMate 2 codebase was subsequently released as
      GPL-licensed open source and continues at the official TextMate GitHub
      organization.
  related-projects:
    - The official textmate/textmate repository contains the TextMate 2 source.
    - >
      TextMate bundles provide language-specific grammars, snippets, commands, and other
      extensions.
    - >
      The `mate` command integrates TextMate with shells and Unix programs that invoke
      an external editor.
  sources:
    - https://github.com/textmate/textmate
    - https://macromates.com/
    - https://macromates.com/blog/2004/hello-world/
    - https://macromates.com/blog/2006/textmate-15/
    - https://macromates.com/textmate/manual/
  summary:
    - >
      TextMate is an open-source, graphical text editor for macOS aimed at programmers
      and power users. It combines native Mac interaction with Unix command integration
      and a deeply extensible bundle system.
  timeline:
    - '2004: TextMate 1.0 is released.'
    - '2006: TextMate 1.5 is released for PowerPC and Intel Macs.'
    - '2012: Development of TextMate 2 proceeds in public as open-source software.'
    - '2019: TextMate 2 reaches a stable 2.0 release.'
  usage:
    - >
      TextMate is used to edit code and markup with project navigation, multiple carets,
      search, version-control integration, snippets, macros, and language-aware
      settings.
    - >
      Users customize behavior through bundles and scoped settings. The `mate` command
      supports terminal workflows and can serve as `EDITOR` or `GIT_EDITOR`.
