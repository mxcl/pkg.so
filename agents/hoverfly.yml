history:
  adoption-history:
    - >
      Hoverfly became useful in microservice testing because it sits at the
      architectural boundary rather than inside application code. The docs position it
      between intrusive mocks and hand-written stub services: a controllable dependency
      sandbox that can simulate slow, flaky, rate-limited, or unavailable APIs.
    - >
      The project has been packaged as a Homebrew formula and has adjacent official
      repositories for Java bindings, a UI, and a GitHub Action. Those companion
      projects show adoption beyond a single binary: Hoverfly became a small tool family
      for service virtualization in local development and CI.
  package-nerd-significance:
    - >
      Hoverfly matters to package nerds because it turns service virtualization into a
      portable CLI install rather than a heavy test environment. Its value is
      operational: developers can install one binary pair, put it in CI, and make
      network-dependent tests repeatable.
    - >
      It also illustrates how Go CLIs entered the testing-tooling shelf: self-contained
      binaries, Homebrew packaging, release archives, and wrappers for language
      ecosystems that do not have to reimplement the proxy.
  project-history:
    - >
      Hoverfly grew out of an effort to build the smallest service virtualization tool
      possible. Its documentation frames the project around the problem of testing
      applications that depend on external services, where network outages, latency,
      unavailable dependencies, and hard-to-manage test data make integration tests
      brittle.
    - >
      The repository README and docs describe a Go-based proxy/server application
      controlled by `hoverctl`. Hoverfly can capture, export, import, edit, and replay
      simulations, and the project also exposes a REST API and language bindings, most
      prominently Java bindings.
  related-projects:
    - hoverfly-java provides native Java bindings for using Hoverfly in JVM tests.
    - hoverfly-ui is the Angular frontend application bundled with Hoverfly.
    - hoverfly-github-action installs Hoverfly and hoverctl for GitHub Actions workflows.
    - >
      Traditional mocks and stub servers are the comparison points used in Hoverfly's
      own motivation documentation.
  sources:
    - https://formulae.brew.sh/formula/hoverfly
    - https://github.com/SpectoLabs/hoverfly
    - https://github.com/SpectoLabs/hoverfly-github-action
    - https://github.com/SpectoLabs/hoverfly-java
    - https://github.com/SpectoLabs/hoverfly-ui
    - >
      https://github.com/SpectoLabs/hoverfly/blob/master/docs/pages/introduction/gettingstarted.rst
    - >
      https://github.com/SpectoLabs/hoverfly/blob/master/docs/pages/introduction/motivation.rst
  summary:
    - >
      Hoverfly is an open source API simulation and service virtualization tool for
      development and testing. The project describes itself as a lightweight way to
      create realistic simulations of APIs that an application depends on.
  timeline:
    - >
      Origin: Hoverfly documentation says the project grew from an effort to build the
      smallest service virtualization tool possible.
    - >
      v1.12.10: The hosted documentation identifies the Hoverfly and hoverctl two-binary
      model.
    - 'v1.12.10: Homebrew builds the formula from the upstream SpectoLabs GitHub tag.'
  usage:
    - >
      The documented getting-started flow installs two binaries, `hoverfly` and
      `hoverctl`. `hoverctl` starts, stops, and configures a Hoverfly daemon, while
      `hoverfly` provides the proxy or webserver and API endpoints that do the
      simulation work.
    - >
      Typical usage is to replace unreliable or unavailable API dependencies with
      reusable simulations, then exercise application code over HTTP as if it were
      talking to the external service.
related-packages:
