id: brew:monkeysphere
display-name: Monkeysphere
repo: https://github.com/dkg/monkeysphere
docs:
  - https://github.com/dkg/monkeysphere#readme
  - https://manpages.debian.org/bullseye/src%3Amonkeysphere/index.html
config-file-location:
  unix:
    - ~/.monkeysphere/monkeysphere.conf
    - /etc/monkeysphere/monkeysphere.conf
    - /etc/monkeysphere/monkeysphere-host.conf
    - /etc/monkeysphere/monkeysphere-authentication.conf
credentials-file-location: null
history:
  project-history:
    - >
      The project was written by Jameson Rollins and Daniel Kahn Gillmor, according to
      the monkeysphere(7) manual page. Early changelog entries from 2008 show rapid work
      on server diagnostics, key expiration, certifier management, privilege separation,
      OpenSSH known_hosts and authorized_keys handling, and Debian packaging, which fits
      its role as a glue layer around GnuPG and OpenSSH rather than a replacement
      protocol.
  sources:
    - https://github.com/dkg/monkeysphere
    - https://github.com/dkg/monkeysphere/blob/master/Changelog
    - https://manpages.ubuntu.com/manpages/jammy/man7/monkeysphere.7.html
    - https://packages.debian.org/bullseye/monkeysphere
  summary:
    - >
      Monkeysphere is a security tool from the OpenPGP and Debian-adjacent world that
      tries to bring the OpenPGP web of trust to SSH and TLS authentication. Its README
      frames the project as extending OpenPGP's trust model to more areas of the
      Internet, with an implementation that lets users keep using OpenSSH while
      identifying users and servers through OpenPGP keys managed by GnuPG.
  usage:
    - >
      Administrators use Monkeysphere to bind human-readable OpenPGP user IDs to SSH
      keys and host identities. The tools update authorized_keys and known_hosts after
      checking key validity, expiration, revocation, authentication-capable subkeys, and
      signatures from trusted identity certifiers. That makes its package-manager niche
      a specialized PKI bridge for people who already trusted OpenPGP key signing and
      wanted that trust graph to govern SSH host verification or user login access.
related-packages:
  - id: brew:gnupg
    reason: >
      Monkeysphere relies on GnuPG to track OpenPGP keys, certifications, validity,
      expiration, and revocation before translating authentication-capable keys into SSH
      workflows.
    rel: adjacent_workflow
    sources:
      - https://github.com/dkg/monkeysphere#readme
      - https://gnupg.org/software/
  - id: brew:openssh
    reason: >
      Monkeysphere works with OpenSSH by maintaining or generating known_hosts and
      authorized_keys content while leaving normal SSH connections and agents in place.
    rel: adjacent_workflow
    sources:
      - https://github.com/dkg/monkeysphere#readme
      - https://www.openssh.com/
tags:
  - authentication
  - cli
  - openpgp
  - openssh
  - ssh
  - web-of-trust
