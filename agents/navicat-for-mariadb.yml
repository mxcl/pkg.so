config-file-location:
  macos:
    - ~/Library/Application Support/PremiumSoft CyberTech/Navicat CC/Common/Profiles
credentials-file-location:
  macos:
    - ~/Library/Application Support/PremiumSoft CyberTech/Navicat CC/Common/conn.plist
history:
  adoption-history:
    - >
      PremiumSoft reports that the Navicat family has more than 180,000 registered
      customers across 138 countries. The company does not publish a separate adoption
      count for the MariaDB edition.
  package-nerd-significance:
    - >
      The dedicated Homebrew cask preserves a database-specific installation choice for
      users who want a smaller commercial GUI instead of the multi-database Navicat
      Premium package.
  project-history:
    - >
      Navicat is produced by PremiumSoft, founded in 1999. Navicat for MariaDB developed
      as a database-specific edition offering a native environment for MariaDB
      administration and development; official release notes document the edition by at
      least the Navicat 11 generation in 2016.
  related-projects:
    - MariaDB
    - Navicat for MySQL
    - Navicat Premium
    - Navicat Data Modeler
  sources:
    - https://www.navicat.com/en/company/aboutus.html
    - https://www.navicat.com/en/products/
    - https://www.navicat.com/en/products/navicat-for-mariadb-release-note
    - https://www.navicat.com/manual/online_manual/en/navicat_17/mac_manual/
    - source_facts.package-manager
  summary:
    - >
      Navicat for MariaDB is PremiumSoft’s proprietary graphical client for MariaDB
      database administration and development.
  timeline:
    - '1999: PremiumSoft, the developer of Navicat, was founded.'
    - '2016: Official release notes document Navicat for MariaDB 11.2 updates.'
    - '2024: Navicat 17 became the current major product generation.'
  usage:
    - >
      It is commonly used to create and administer database objects, edit data, write
      and run SQL, manage connections, transfer or synchronize data, model schemas, and
      connect through SSH or SSL/TLS.
